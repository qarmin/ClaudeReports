{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"MaintNotificationsPoolHandler.get_handler_for_connection and OSSMaintNotificationsHandler.get_handler_for_connection share the SAME _processed_notifications set (and _in_progress for OSS) and the SAME _lock across all per-connection copies (lines 752-753, 1078-1080). remove_expired_notifications mutates this shared set. NodeMovingNotification.__hash__/__eq__ are based on id+host+port, but the migrating/migrated/failover notifications hash only on class name + id. Since the same id can legitimately recur across distinct maintenance cycles (the server may reuse ids), a still-present (un-expired) processed notification with a matching id will cause a genuinely new notification to be treated as already-processed and silently dropped at the 'notification in self._processed_notifications' guard.","fix":"Confirm server-assigned notification ids are unique for the lifetime of a TTL window; if reuse is possible, incorporate a monotonically-increasing receipt counter or timestamp into equality/hashing so a recurring id is not mistaken for an in-flight/processed one.","locations":[{"ref":"redis/maint_notifications.py:841-853","code":"  841 |     def remove_expired_notifications(self):\n  842 |         with self._lock:\n  843 |             for notification in tuple(self._processed_notifications):\n  844 |                 if notification.is_expired():\n  845 |                     self._processed_notifications.remove(notification)\n  846 | \n  847 |     def handle_notification(self, notification: MaintenanceNotification):\n  848 |         self.remove_expired_notifications()\n  849 | \n  850 |         if isinstance(notification, NodeMovingNotification):\n  851 |             return self.handle_node_moving_notification(notification)\n  852 |         else:\n  853 |             logger.error(f\"Unhandled notification type: {notification}\")","lines":13,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/maint_notifications.py#L841-L853"},{"ref":"redis/maint_notifications.py:862-867","code":"  862 |         with self._lock:\n  863 |             if notification in self._processed_notifications:\n  864 |                 # nothing to do in the connection pool handling\n  865 |                 # the notification has already been handled or is expired\n  866 |                 # just return\n  867 |                 return","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/maint_notifications.py#L862-L867"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"remove_database promotes a new active database even when the removed database was not the active one, and the condition is questionable. After removing a database, the code checks 'if highest_weight <= weight and highest_weighted_db.circuit.state == CLOSED' and then sets active_database to highest_weighted_db. 'weight' here is the weight of the removed database; 'highest_weight' is the highest remaining weight. The intent is presumably to re-pick an active DB only when the removed one outranked all remaining ones, but it fires whenever the removed weight was >= the top remaining weight regardless of whether the removed DB was actually the active database. This can force an unnecessary failover (and its connection-teardown side effects) when removing a non-active database.","fix":"Only re-elect the active database when the removed database was the current active one (or when the current active DB is no longer present/healthy), rather than purely on weight comparison.","locations":[{"ref":"redis/multidb/client.py:237-251","code":"  237 |     def remove_database(self, database: Database):\n  238 |         \"\"\"\n  239 |         Removes a database from the database list.\n  240 |         \"\"\"\n  241 |         weight = self._databases.remove(database)\n  242 |         highest_weighted_db, highest_weight = self._databases.get_top_n(1)[0]\n  243 | \n  244 |         if (\n  245 |             highest_weight <= weight\n  246 |             and highest_weighted_db.circuit.state == CBState.CLOSED\n  247 |         ):\n  248 |             self.command_executor.active_database = (\n  249 |                 highest_weighted_db,\n  250 |                 GeoFailoverReason.MANUAL,\n  251 |             )","lines":15,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/client.py#L237-L251"},{"ref":"redis/asyncio/multidb/client.py:241-254","code":"  241 |     async def remove_database(self, database: AsyncDatabase):\n  242 |         \"\"\"\n  243 |         Removes a database from the database list.\n  244 |         \"\"\"\n  245 |         weight = self._databases.remove(database)\n  246 |         highest_weighted_db, highest_weight = self._databases.get_top_n(1)[0]\n  247 | \n  248 |         if (\n  249 |             highest_weight <= weight\n  250 |             and highest_weighted_db.circuit.state == CBState.CLOSED\n  251 |         ):\n  252 |             await self.command_executor.set_active_database(\n  253 |                 highest_weighted_db, GeoFailoverReason.MANUAL\n  254 |             )","lines":14,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/client.py#L241-L254"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Failure-rate window is only advanced/reset on command execution, not on failures, so failures accumulate across stale windows. register_command_execution() checks 'if not start_time < now < end_time: reset()' before counting an execution, but register_failure() never performs this window check and simply increments _failures_count and calls _check_threshold(). If failures arrive in a window where few/no successful executions have advanced the window, or after the window has logically expired but no execution reset it, the failure count is evaluated against a stale _commands_executed and a stale window. This makes the sliding-window failure-rate semantics inaccurate (failures from an old window can trip the threshold).","fix":"Perform the same window-expiry check (and _reset) inside register_failure() before incrementing _failures_count, so failures and executions share a consistent sliding window.","locations":[{"ref":"redis/multidb/failure_detector.py:68-93","code":"   68 |     def register_failure(self, exception: Exception, cmd: tuple) -> None:\n   69 |         with self._lock:\n   70 |             if self._error_types:\n   71 |                 if type(exception) in self._error_types:\n   72 |                     self._failures_count += 1\n   73 |             else:\n   74 |                 self._failures_count += 1\n   75 | \n   76 |             self._check_threshold()\n   77 | \n   78 |     def set_command_executor(self, command_executor) -> None:\n   79 |         self._command_executor = command_executor\n   80 | \n   81 |     def register_command_execution(self, cmd: tuple) -> None:\n   82 |         with self._lock:\n   83 |             if not self._start_time < datetime.now() < self._end_time:\n   84 |                 self._reset()\n   85 | \n   86 |             self._commands_executed += 1\n   87 | \n   88 |     def _check_threshold(self):\n   89 |         if self._failures_count >= self._min_num_failures and self._failures_count >= (\n   90 |             math.ceil(self._commands_executed * self._failure_rate_threshold)\n   91 |         ):\n   92 |             self._command_executor.active_database.circuit.state = CBState.OPEN\n   93 |             self._reset()","lines":26,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/failure_detector.py#L68-L93"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"record_streaming_lag_from_response uses datetime.now().timestamp() (local naive time) as 'now' and subtracts the stream message timestamp which is epoch-milliseconds (UTC). datetime.now() returns local time; .timestamp() on a naive datetime interprets it as local time and converts to a POSIX (UTC) timestamp, so this happens to be UTC-correct - but it is fragile and inconsistent with the rest of the codebase that uses datetime.now(timezone.utc). More importantly, message_id.split('-') with int(timestamp) will raise ValueError on malformed/non-standard IDs; the whole loop is wrapped in a bare except that silently drops ALL lag recording for the batch on the first bad ID. Both sync and async copies share this.","fix":"Use datetime.now(timezone.utc).timestamp() for clarity, and parse/record per-message inside an inner try/except so one malformed message ID does not discard lag for the entire response.","locations":[{"ref":"redis/observability/recorder.py:568-613","code":"  568 |     try:\n  569 |         now = datetime.now().timestamp()\n  570 | \n  571 |         # Check if stream names should be hidden\n  572 |         config = _get_config()\n  573 |         hide_stream_names = config is not None and config.hide_stream_names\n  574 | \n  575 |         # RESP3 format: dict\n  576 |         if isinstance(response, dict):\n  577 |             for stream_name, stream_messages in response.items():\n  578 |                 effective_stream_name = (\n  579 |                     None if hide_stream_names else str_if_bytes(stream_name)\n  580 |                 )\n  581 |                 for messages in stream_messages:\n  582 |                     for message in messages:\n  583 |                         message_id, _ = message\n  584 |                         message_id = str_if_bytes(message_id)\n  585 |                         timestamp, _ = message_id.split(\"-\")\n  586 |                         # Ensure lag is non-negative (clock skew can cause negative values)\n  587 |                         lag_seconds = max(0.0, now - int(timestamp) / 1000)\n  588 | \n  589 |                         _metrics_collector.record_streaming_lag(\n  590 |                             lag_seconds=lag_seconds,\n  591 |                             stream_name=effective_stream_name,\n  592 |                             consumer_group=consumer_group,\n  593 |                         )\n  594 |         else:\n  595 |             # RESP2 format: list\n  596 |             for stream_entry in response:\n  597 |                 stream_name = str_if_bytes(stream_entry[0])\n  598 |                 effective_stream_name = None if hide_stream_names else stream_name\n  599 | \n  600 |                 for message in stream_entry[1]:\n  601 |                     message_id, _ = message\n  602 |                     message_id = str_if_bytes(message_id)\n  603 |                     timestamp, _ = message_id.split(\"-\")\n  604 |                     # Ensure lag is non-negative (clock skew can cause negative values)\n  605 |                     lag_seconds = max(0.0, now - int(timestamp) / 1000)\n  606 | \n  607 |                     _metrics_collector.record_streaming_lag(\n  608 |                         lag_seconds=lag_seconds,\n  609 |                         stream_name=effective_stream_name,\n  610 |                         consumer_group=consumer_group,\n  611 |                     )\n  612 |     except Exception:\n  613 |         pass","lines":46,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/observability/recorder.py#L568-L613"},{"ref":"redis/asyncio/observability/recorder.py:511-556","code":"  511 |     try:\n  512 |         now = datetime.now().timestamp()\n  513 | \n  514 |         # Check if stream names should be hidden\n  515 |         config = await _get_config()\n  516 |         hide_stream {"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"OCSP _check_certificate responder-selection condition relies on Python operator precedence in a way that is almost certainly not intended: `responder_name is not None and responder_name == issuer_cert.subject or responder_hash == issuer_hash` parses as `(responder_name is not None and responder_name == issuer_cert.subject) or (responder_hash == issuer_hash)`. If both responder_hash and issuer_hash are None (responder identified by name but no key hash present), the right operand `None == None` is True, so the issuer cert is trusted as the OCSP signer without checking the name. This is a security-relevant validation gap.","fix":"Add explicit parentheses and guard against None hashes: only treat issuer as signer when responder_hash is not None and equals issuer_hash, or when responder_name matches issuer subject.","locations":[{"ref":"redis/ocsp.py:82-87","code":"   82 |     if (\n   83 |         responder_name is not None\n   84 |         and responder_name == issuer_cert.subject\n   85 |         or responder_hash == issuer_hash\n   86 |     ):\n   87 |         cert_to_validate = issuer_cert","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/ocsp.py#L82-L87"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"OCSPVerifier.is_valid catches AuthorizationError from socket-based validation and retries via components_from_direct_connection(). AuthorizationError means the OCSP responder returned UNAUTHORIZED (response status), which is a definitive responder answer, not a transient socket issue; retrying against a freshly fetched server certificate masks an authoritative UNAUTHORIZED and can turn a legitimate failure into a success if the second path produces a different (e.g. GOOD) response. This weakens revocation enforcement.","fix":"Do not treat responder UNAUTHORIZED as a retry trigger; only retry on socket/connection-level errors, and propagate AuthorizationError.","locations":[{"ref":"redis/ocsp.py:298-308","code":"  298 |         # validate the certificate\n  299 |         try:\n  300 |             cert, issuer_url, ocsp_server = self.components_from_socket()\n  301 |             if issuer_url is None:\n  302 |                 raise ConnectionError(\"no issuers found in certificate chain\")\n  303 |             return self.check_certificate(ocsp_server, cert, issuer_url)\n  304 |         except AuthorizationError:\n  305 |             cert, issuer_url, ocsp_server = self.components_from_direct_connection()\n  306 |             if issuer_url is None:\n  307 |                 raise ConnectionError(\"no issuers found in certificate chain\")\n  308 |             return self.check_certificate(ocsp_server, cert, issuer_url)","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/ocsp.py#L298-L308"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Retry.call_with_retry off-by-one / semantics: with retries=N the loop executes the operation up to N+1 times (initial attempt + N retries) because the check is `if self._retries >= 0 and failures > self._retries`. The class docstring says 'retries a maximum of retries times'. Depending on interpretation this is one more attempt than 'retries' implies. This is consistent with the existing library convention but the AbstractRetry docstring ('retries a maximum of `retries` times') is misleading.","fix":"Clarify the docstring to state total attempts = retries + 1, or adjust the comparison to `failures >= self._retries` if the intent is exactly `retries` attempts.","locations":[{"ref":"redis/retry.py:118-135","code":"  118 |         while True:\n  119 |             try:\n  120 |                 return do()\n  121 |             except self._supported_errors as error:\n  122 |                 if is_retryable and not is_retryable(error):\n  123 |                     raise\n  124 |                 failures += 1\n  125 | \n  126 |                 if with_failure_count:\n  127 |                     fail(error, failures)\n  128 |                 else:\n  129 |                     fail(error)\n  130 | \n  131 |                 if self._retries >= 0 and failures > self._retries:\n  132 |                     raise error\n  133 |                 backoff = self._backoff.compute(failures)\n  134 |                 if backoff > 0:\n  135 |                     sleep(backoff)","lines":18,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/retry.py#L118-L135"},{"ref":"redis/retry.py:31-43","code":"   31 |     def __init__(\n   32 |         self,\n   33 |         backoff: \"AbstractBackoff\",\n   34 |         retries: int,\n   35 |         supported_errors: Tuple[Type[E], ...],\n   36 |     ):\n   37 |         \"\"\"\n   38 |         Initialize a `Retry` object with a `Backoff` object\n   39 |         that retries a maximum of `retries` times.\n   40 |         `retries` can be negative to retry forever.\n   41 |         You can specify the types of supported errors which trigger\n   42 |         a retry with the `supported_errors` parameter.\n   43 |         \"\"\"","lines":13,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/retry.py#L31-L43"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Sentinel.discover_master swaps the matching sentinel to the front of the list using `self.sentinels[0], self.sentinels[sentinel_no] = sentinel, self.sentinels[0]`. When sentinel_no == 0 this assigns self.sentinels[0] = sentinel (fine) and self.sentinels[0] (the RHS second element, already overwritten conceptually) - tuple assignment evaluates RHS first so it is actually safe, but when sentinel_no != 0 the element formerly at index 0 is moved to sentinel_no, which is correct. No bug in the swap itself; however the comment 'Put this sentinel at the top of the list' combined with the swap means the previously-first sentinel is demoted to sentinel_no rather than shifted, changing ordering semantics versus a rotate. This is intended behavior but worth noting as non-obvious.","fix":"No change required; optionally document that this is a swap, not a stable move-to-front, so iteration order after several failovers can reorder arbitrarily.","locations":[{"ref":"redis/sentinel.py:368-372","code":"  368 |                 # Put this sentinel at the top of the list\n  369 |                 self.sentinels[0], self.sentinels[sentinel_no] = (\n  370 |                     sentinel,\n  371 |                     self.sentinels[0],\n  372 |                 )","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/sentinel.py#L368-L372"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`parse_xinfo_stream` reads `data['last-entry']` directly (and `data['groups']`, `data['entries']`) with subscript access rather than `.get()`, while `first-entry` immediately above is fetched defensively with `.get()`. If a Redis/server variant omits `last-entry` (or the full-mode keys), this raises KeyError instead of degrading gracefully. The inconsistency between the `first` and `last` handling looks like an oversight.","fix":"Use `data.get('last-entry')` and guard the full-mode key accesses symmetrically with the `first-entry` handling.","locations":[{"ref":"redis/_parsers/helpers.py:786-808","code":"  786 |         first = data.get(\"first-entry\")\n  787 |         if first is not None and first[0] is not None:\n  788 |             data[\"first-entry\"] = (first[0], pairs_to_dict(first[1]))\n  789 |         last = data[\"last-entry\"]\n  790 |         if last is not None and last[0] is not None:\n  791 |             data[\"last-entry\"] = (last[0], pairs_to_dict(last[1]))\n  792 |     else:\n  793 |         data[\"entries\"] = {_id: pairs_to_dict(entry) for _id, entry in data[\"entries\"]}\n  794 |         if len(data[\"groups\"]) > 0 and isinstance(data[\"groups\"][0], list):\n  795 |             data[\"groups\"] = [\n  796 |                 pairs_to_dict(group, decode_keys=True) for group in data[\"groups\"]\n  797 |             ]\n  798 |             for g in data[\"groups\"]:\n  799 |                 if g[\"consumers\"] and g[\"consumers\"][0] is not None:\n  800 |                     g[\"consumers\"] = [\n  801 |                         pairs_to_dict(c, decode_keys=True) for c in g[\"consumers\"]\n  802 |                     ]\n  803 |         else:\n  804 |             data[\"groups\"] = [\n  805 |                 {str_if_bytes(k): v for k, v in group.items()}\n  806 |                 for group in data[\"groups\"]\n  807 |             ]\n  808 |     return data","lines":23,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/helpers.py#L786-L808"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`_parse_node_line` calls `line.split(\" \")` twice (once into `line_items`, then again inline to unpack the first 8 fields). Besides the needless second split, the hostname extraction `addr.split('@')[1].split(',')[1]` indexes `[1]` after splitting on ',', so an addr of form `ip:port@hostname` (no comma, the common case) would IndexError were it not for the `'@' in addr and ',' in addr` guard — but that guard means any node line WITH an '@' but a single comma-less hostname yields empty hostname even when a hostname is present. The logic only recovers a hostname when a comma is also present, which is fragile relative to the documented CLUSTER NODES format.","fix":"Split once and reuse `line_items`; parse the `@`-suffix more robustly (e.g. take everything after '@', then strip the trailing ',port,...' metadata) instead of relying on a fixed comma index.","locations":[{"ref":"redis/_parsers/helpers.py:1076-1096","code":" 1076 | def _parse_node_line(line):\n 1077 |     line_items = line.split(\" \")\n 1078 |     node_id, addr, flags, master_id, ping, pong, epoch, connected = line.split(\" \")[:8]\n 1079 |     ip = addr.split(\"@\")[0]\n 1080 |     hostname = addr.split(\"@\")[1].split(\",\")[1] if \"@\" in addr and \",\" in addr else \"\"\n 1081 |     node_dict = {\n 1082 |         \"node_id\": node_id,\n 1083 |         \"hostname\": hostname,\n 1084 |         \"flags\": flags,\n 1085 |         \"master_id\": master_id,\n 1086 |         \"last_ping_sent\": ping,\n 1087 |         \"last_pong_rcvd\": pong,\n 1088 |         \"epoch\": epoch,\n 1089 |         \"slots\": [],\n 1090 |         \"migrations\": [],\n 1091 |         \"connected\": True if connected == \"connected\" else False,\n 1092 |     }\n 1093 |     if len(line_items) >= 9:\n 1094 |         slots, migrations = _parse_slots(line_items[8:])\n 1095 |         node_dict[\"slots\"], node_dict[\"migrations\"] = slots, migrations\n 1096 |     return ip, node_dict","lines":21,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/helpers.py#L1076-L1096"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`parse_acl_getuser` accesses `data['flags']`, `data['passwords']`, `data['commands']`, `data['keys']` with hard subscripts. If a server build omits any of these (older/newer ACL schema, or a module-extended user), this raises KeyError instead of returning a partial/None result. The function already None-guards the top-level response but not the inner schema.","fix":"Use .get() with sensible defaults for the expected ACL fields, or validate presence before access.","locations":[{"ref":"redis/_parsers/helpers.py:1265-1305","code":" 1265 | def parse_acl_getuser(response, **options):\n 1266 |     if response is None:\n 1267 |         return None\n 1268 |     if isinstance(response, list):\n 1269 |         data = pairs_to_dict(response, decode_keys=True)\n 1270 |     else:\n 1271 |         data = {str_if_bytes(key): value for key, value in response.items()}\n 1272 | \n 1273 |     # convert everything but user-defined data in 'keys' to native strings\n 1274 |     data[\"flags\"] = list(map(str_if_bytes, data[\"flags\"]))\n 1275 |     data[\"passwords\"] = list(map(str_if_bytes, data[\"passwords\"]))\n 1276 |     data[\"commands\"] = str_if_bytes(data[\"commands\"])\n 1277 |     if isinstance(data[\"keys\"], str) or isinstance(data[\"keys\"], bytes):\n 1278 |         data[\"keys\"] = list(str_if_bytes(data[\"keys\"]).split(\" \"))\n 1279 |     if data[\"keys\"] == [\"\"]:\n 1280 |         data[\"keys\"] = []\n 1281 |     if \"channels\" in data:\n 1282 |         if isinstance(data[\"channels\"], str) or isinstance(data[\"channels\"], bytes):\n 1283 |             data[\"channels\"] = list(str_if_bytes(data[\"channels\"]).split(\" \"))\n 1284 |         if data[\"channels\"] == [\"\"]:\n 1285 |             data[\"channels\"] = []\n 1286 |     if \"selectors\" in data:\n 1287 |         if data[\"selectors\"] != [] and isinstance(data[\"selectors\"][0], list):\ {"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"RESP3 bulk/verbatim/error length parsing does not handle the explicit null forms the way RESP2 does. RESP2 special-cases `$-1` and `*-1` -> None before calling `read`. RESP3 relies solely on `_` for null and treats `$`/`=`/`*`/`~`/`%`/`>` lengths via `int(response)` then `read(int(response))`. A server (or proxy) emitting a legacy `$-1`/`*-1` over a RESP3 connection would pass `-1` to `_buffer.read`/`range(-1)` producing wrong/empty results or a buffer read error rather than None. While spec-compliant RESP3 servers use `_`, the parser is less defensive than RESP2 against the legacy null encoding.","fix":"Optionally treat a `-1` length on `$`/`*` as None in RESP3 too for robustness against mixed/legacy servers, or document that RESP3 strictly requires `_`.","locations":[{"ref":"redis/_parsers/resp3.py:101-146","code":"  101 |         # bulk response\n  102 |         elif byte == b\"$\":\n  103 |             response = self._buffer.read(int(response), timeout=timeout)\n  104 |         # verbatim string response\n  105 |         elif byte == b\"=\":\n  106 |             response = self._buffer.read(int(response), timeout=timeout)[4:]\n  107 |         # array response\n  108 |         elif byte == b\"*\":\n  109 |             response = [\n  110 |                 self._read_response(disable_decoding=disable_decoding, timeout=timeout)\n  111 |                 for _ in range(int(response))\n  112 |             ]\n  113 |         # set response\n  114 |         elif byte == b\"~\":\n  115 |             # redis can return unhashable types (like dict) in a set,\n  116 |             # so we return sets as list, all the time, for predictability\n  117 |             response = [\n  118 |                 self._read_response(disable_decoding=disable_decoding, timeout=timeout)\n  119 |                 for _ in range(int(response))\n  120 |             ]\n  121 |         # map response\n  122 |         elif byte == b\"%\":\n  123 |             # We cannot use a dict-comprehension to parse stream.\n  124 |             # Evaluation order of key:val expression in dict comprehension only\n  125 |             # became defined to be left-right in version 3.8\n  126 |             resp_dict = {}\n  127 |             for _ in range(int(response)):\n  128 |                 key = self._read_response(\n  129 |                     disable_decoding=disable_decoding, timeout=timeout\n  130 |                 )\n  131 |                 resp_dict[key] = self._read_response(\n  132 |                     disable_decoding=disable_decoding,\n  133 |                     push_request=push_request,\n  134 |                     timeout=timeout,\n  135 |                 )\n  136 |             response = resp_dict\n  137 |         # push response\n  138 |         elif byte == b\">\":\n  139 |             response = [\n  140 |                 self._read_response(\n  141 |                     disable_decoding=disable_decoding,\n  142 |                     push_request=push_request,\n  143 |                     timeout=timeout,\n  144 |                 )\n  145 |                 for _ in range(int(response))\n  146 |             ]","lines":46,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/resp3.py#L101-L146"},{"ref":"redis/_parsers/resp3.py:243-284","code":"  243 |         # bulk response\n  244 |         elif byte == b\"$\":\n  245 |             response = await self._read(int(response))\n  246 |         # verbatim string response\n  247 |         elif byte == b\"=\":\n  248 |             response = (await self._read(int(response)))[4:]\n  249 |         # array response\n  250 |         elif byte == b\"*\":\n  251 |             response = [\n  252 |                 (await self._read_response(disable_decoding=disable_decoding))\n  253 |                 for _ in range(int(response))\n  254 | {"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Pipeline._execute_transaction(): after a short/long response from EXEC it disconnects via `self.connection` (line 1919-1920) rather than the `connection` argument it was given. _execute_transaction is invoked through conn.retry.call_with_retry(lambda: execute(conn, ...)) where conn is a local that equals self.connection at call time, so today they coincide; but relying on self.connection inside a method that otherwise operates on the passed-in `connection` is fragile and inconsistent with the rest of the method (which uses `connection`).","fix":"Use the `connection` parameter for the disconnect (await connection.disconnect()) to stay consistent with the rest of _execute_transaction and avoid coupling to self.connection.","locations":[{"ref":"redis/asyncio/client.py:2122-2127","code":" 2122 |         if len(response) != len(commands):\n 2123 |             if self.connection:\n 2124 |                 await self.connection.disconnect()\n 2125 |             raise ResponseError(\n 2126 |                 \"Wrong number of response items from pipeline execution\"\n 2127 |             ) from None","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/client.py#L2122-L2127"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"PipelineStrategy._execute filters commands to (re)run with `not cmd.result or isinstance(cmd.result, Exception)`. A successful command whose result is a falsy value (e.g. 0, '', None, [], False) is treated as not-yet-executed and gets re-run on a retry pass, because `not cmd.result` is True for any falsy successful response. The intended condition is 'no result yet OR errored', but PipelineCommand.result defaults to None and many valid responses are falsy.","fix":"Track execution with an explicit sentinel/flag (e.g. a dedicated 'unset' marker or a `executed` bool) rather than truthiness of result; re-run only when result is the sentinel or an Exception.","locations":[{"ref":"redis/asyncio/cluster.py:2963-2965","code":" 2963 |         todo = [\n 2964 |             cmd for cmd in stack if not cmd.result or isinstance(cmd.result, Exception)\n 2965 |         ]","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L2963-L2965"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AsyncClusterKeyspaceNotifications.get_message with timeout>0 distributes the wait across nodes but caps per_node_timeout at min(0.1, timeout/total_nodes). With many nodes timeout/total_nodes is already tiny, so the cap is harmless, but the loop re-lists self._node_pubsubs every iteration and recomputes nothing about the shrinking remaining time - each poll always waits up to per_node_timeout regardless of how little wall-clock time is left before end_time, so the method can overshoot the caller's timeout by up to per_node_timeout. Minor but it means timeout is a soft lower-ish bound, not an upper bound.","fix":"Clamp per_node_timeout to the remaining time: `per_node_timeout = min(per_node_timeout, end_time - time.monotonic())` and skip the poll if it is <= 0.","locations":[{"ref":"redis/asyncio/keyspace_notifications.py:845-878","code":"  845 |         # Calculate per-node timeout for each poll\n  846 |         per_node_timeout = min(0.1, timeout / max(total_nodes, 1))\n  847 | \n  848 |         start_time = time.monotonic()\n  849 |         end_time = start_time + timeout\n  850 | \n  851 |         while True:\n  852 |             if time.monotonic() >= end_time:\n  853 |                 return None\n  854 | \n  855 |             pubsubs = list(self._node_pubsubs.values())\n  856 |             if not pubsubs:\n  857 |                 return None\n  858 | \n  859 |             # Round-robin polling\n  860 |             self._poll_index = self._poll_index % len(pubsubs)\n  861 |             pubsub = pubsubs[self._poll_index]\n  862 |             self._poll_index += 1\n  863 | \n  864 |             try:\n  865 |                 message = await pubsub.get_message(\n  866 |                     ignore_subscribe_messages=ignore_subscribe_messages,\n  867 |                     timeout=per_node_timeout,\n  868 |                 )\n  869 |             except (ConnectionError, TimeoutError, RedisError):\n  870 |                 await self._refresh_subscriptions_on_error()\n  871 |                 continue\n  872 | \n  873 |             if message is not None:\n  874 |                 notification = KeyNotification.from_message(\n  875 |                     message, key_prefix=self.key_prefix\n  876 |                 )\n  877 |                 if notification is not None:\n  878 |                     return notification","lines":34,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/keyspace_notifications.py#L845-L878"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Async ResubscribeOnActiveDatabaseChanged does not copy shard_channels, unlike the sync listener. Sync listener copies channels, patterns, and shard_channels onto the new pubsub before reconnecting; the async listener copies only channels and patterns. After a failover, shard channel subscriptions are silently lost for async pubsub users.","fix":"Copy new_pubsub.shard_channels = old_pubsub.shard_channels in the async listener to match sync behavior.","locations":[{"ref":"redis/asyncio/multidb/event.py:48-58","code":"   48 |     async def listen(self, event: AsyncActiveDatabaseChanged):\n   49 |         old_pubsub = event.command_executor.active_pubsub\n   50 | \n   51 |         if old_pubsub is not None:\n   52 |             # Re-assign old channels and patterns so they will be automatically subscribed on connection.\n   53 |             new_pubsub = event.new_database.client.pubsub(**event.kwargs)\n   54 |             new_pubsub.channels = old_pubsub.channels\n   55 |             new_pubsub.patterns = old_pubsub.patterns\n   56 |             await new_pubsub.on_connect(None)\n   57 |             event.command_executor.active_pubsub = new_pubsub\n   58 |             await old_pubsub.aclose()","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/event.py#L48-L58"},{"ref":"redis/multidb/event.py:48-59","code":"   48 |     def listen(self, event: ActiveDatabaseChanged):\n   49 |         old_pubsub = event.command_executor.active_pubsub\n   50 | \n   51 |         if old_pubsub is not None:\n   52 |             # Re-assign old channels and patterns so they will be automatically subscribed on connection.\n   53 |             new_pubsub = event.new_database.client.pubsub(**event.kwargs)\n   54 |             new_pubsub.channels = old_pubsub.channels\n   55 |             new_pubsub.patterns = old_pubsub.patterns\n   56 |             new_pubsub.shard_channels = old_pubsub.shard_channels\n   57 |             new_pubsub.on_connect(None)\n   58 |             event.command_executor.active_pubsub = new_pubsub\n   59 |             old_pubsub.close()","lines":12,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/event.py#L48-L59"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"SentinelConnectionPool.reset() resets master_address and slave_rr_counter, but get_master_address() compares self.master_address to detect a changed master and only disconnects idle connections when it differs. After reset() sets master_address=None, the next get_master_address always treats the master as 'changed' and force-disconnects idle connections even when the master is unchanged - extra reconnect churn. The sync code keeps this state in a separate proxy object whose lifecycle differs, so the reset semantics are not equivalent across stacks.","fix":"Confirm reset() of master_address is intended on every pool reset; if not, avoid clearing master_address there, or guard the disconnect on a genuine address change rather than the None sentinel.","locations":[{"ref":"redis/asyncio/sentinel.py:134-153","code":"  134 |     def reset(self):\n  135 |         super().reset()\n  136 |         self.master_address = None\n  137 |         self.slave_rr_counter = None\n  138 | \n  139 |     def owns_connection(self, connection: Connection):\n  140 |         check = not self.is_master or (\n  141 |             self.is_master and self.master_address == (connection.host, connection.port)\n  142 |         )\n  143 |         return check and super().owns_connection(connection)\n  144 | \n  145 |     async def get_master_address(self):\n  146 |         master_address = await self.sentinel_manager.discover_master(self.service_name)\n  147 |         if self.is_master:\n  148 |             if self.master_address != master_address:\n  149 |                 self.master_address = master_address\n  150 |                 # disconnect any idle connections so that they reconnect\n  151 |                 # to the new master the next time that they are used.\n  152 |                 await self.disconnect(inuse_connections=False)\n  153 |         return master_address","lines":20,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/sentinel.py#L134-L153"},{"ref":"redis/sentinel.py:115-128","code":"  115 |     def reset(self):\n  116 |         self.master_address = None\n  117 |         self.slave_rr_counter = None\n  118 | \n  119 |     def get_master_address(self):\n  120 |         master_address = self.sentinel_manager.discover_master(self.service_name)\n  121 |         if self.is_master and self.master_address != master_address:\n  122 |             self.master_address = master_address\n  123 |             # disconnect any idle connections so that they reconnect\n  124 |             # to the new master the next time that they are used.\n  125 |             connection_pool = self.connection_pool_ref()\n  126 |             if connection_pool is not None:\n  127 |                 connection_pool.disconnect(inuse_connections=False)\n  128 |         return master_address","lines":14,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/sentinel.py#L115-L128"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"_calculate_renewal_delay returns delay in seconds (delay/1000) and callers pass it to loop.call_later (seconds) - correct. But _delay_for_lower_refresh and _delay_for_ratio_refresh both independently call datetime.now() at slightly different instants, then min() is taken; the two 'now' reads differ, so the chosen delay can be marginally inconsistent. More notable: if get_lower_refresh_bound_millis is 0 (documented as 'no lower bound'), _delay_for_lower_refresh returns expire_date - now which is the FULL time to expiry, so min() would pick the ratio refresh as intended - but if the ratio is also effectively disabled the token could be refreshed only at the exact expiry instant, racing actual expiration.","fix":"Read 'now' once and pass it to both helpers; ensure a sane minimum positive delay floor so refresh always precedes expiry rather than coinciding with it.","locations":[{"ref":"redis/auth/token_manager.py:244-268","code":"  244 |     def _calculate_renewal_delay(self, expire_date: float, issue_date: float) -> float:\n  245 |         delay_for_lower_refresh = self._delay_for_lower_refresh(expire_date)\n  246 |         delay_for_ratio_refresh = self._delay_for_ratio_refresh(expire_date, issue_date)\n  247 |         delay = min(delay_for_ratio_refresh, delay_for_lower_refresh)\n  248 | \n  249 |         return 0 if delay < 0 else delay / 1000\n  250 | \n  251 |     def _delay_for_lower_refresh(self, expire_date: float):\n  252 |         return (\n  253 |             expire_date\n  254 |             - self._config.get_lower_refresh_bound_millis()\n  255 |             - (datetime.now(timezone.utc).timestamp() * 1000)\n  256 |         )\n  257 | \n  258 |     def _delay_for_ratio_refresh(self, expire_date: float, issue_date: float):\n  259 |         token_ttl = expire_date - issue_date\n  260 |         refresh_before = token_ttl - (\n  261 |             token_ttl * self._config.get_expiration_refresh_ratio()\n  262 |         )\n  263 | \n  264 |         return (\n  265 |             expire_date\n  266 |             - refresh_before\n  267 |             - (datetime.now(timezone.utc).timestamp() * 1000)\n  268 |         )","lines":25,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/auth/token_manager.py#L244-L268"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"BackgroundScheduler stores self._next_timer as a single attribute shared across run_once, run_recurring, run_recurring_async and _call_later. Each new schedule overwrites _next_timer with the latest TimerHandle, so stop() only cancels the most recently created timer; timers from earlier run_once/run_recurring calls (running on their own loops) are not cancelled via _next_timer (they are stopped only because their loops are stopped). For run_recurring_async (same loop), scheduling a second recurring task overwrites _next_timer and the first task's pending timer can no longer be cancelled, leaking a recurring callback.","fix":"Track timer handles per scheduled task (e.g. a list/set) and cancel all of them in stop(), rather than a single _next_timer slot.","locations":[{"ref":"redis/background.py:382-416","code":"  382 |                 if self._stopped:\n  383 |                     return\n  384 |             self._next_timer = loop.call_later(interval, execute_and_reschedule)\n  385 | \n  386 |         def execute_and_reschedule():\n  387 |             \"\"\"Execute the coroutine and schedule next run after completion.\"\"\"\n  388 |             with self._lock:\n  389 |                 if self._stopped:\n  390 |                     return\n  391 | \n  392 |             def on_complete(task: asyncio.Task):\n  393 |                 \"\"\"Callback when coroutine completes - schedule next execution.\"\"\"\n  394 |                 # Log any exceptions (prevents \"Task exception was never retrieved\")\n  395 |                 if task.cancelled():\n  396 |                     pass\n  397 |                 elif task.exception() is not None:\n  398 |                     logging.getLogger(__name__).debug(\n  399 |                         \"Recurring async coroutine raised exception\",\n  400 |                         exc_info=task.exception(),\n  401 |                     )\n  402 |                 # Schedule next execution AFTER this one completes\n  403 |                 schedule_next()\n  404 | \n  405 |             try:\n  406 |                 task = asyncio.ensure_future(coro(*args))\n  407 |                 task.add_done_callback(on_complete)\n  408 |             except Exception:\n  409 |                 # If scheduling fails, still try to schedule next run\n  410 |                 logging.getLogger(__name__).debug(\n  411 |                     \"Failed to schedule recurring async coroutine\", exc_info=True\n  412 |                 )\n  413 |                 schedule_next()\n  414 | \n  415 |         # Schedule first execution\n  416 |         self._next_timer = loop.call_later(interval, execute_and_reschedule)","lines":35,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/background.py#L382-L416"},{"ref":"redis/background.py:35-44","code":"   35 |             if self._next_timer:\n   36 |                 self._next_timer.cancel()\n   37 |                 self._next_timer = None\n   38 | \n   39 |             # Stop all event loops\n   40 |             for loop in self._event_loops:\n   41 |                 if loop.is_running():\n   42 |                     loop.call_soon_threadsafe(loop.stop)\n   43 | \n   44 |             self._event_loops.clear()","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/background.py#L35-L44"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"clean_health_check_responses() loops with a fixed ttl=10 and decrements ttl each iteration regardless of whether a response was actually read. If can_read() keeps returning False (no data) but health_check_response_counter stays > 0, the loop exits after 10 iterations leaving the counter positive, so a stale health-check accounting persists; conversely if there are more than 10 pending health checks they will not all be drained. The magic constant 10 is unexplained.","fix":"Decrement ttl only when no readable data was found (to bound idle spins) and/or size the bound off health_check_response_counter; document the intent of the constant.","locations":[{"ref":"redis/client.py:1270-1286","code":" 1270 |     def clean_health_check_responses(self) -> None:\n 1271 |         \"\"\"\n 1272 |         If any health check responses are present, clean them\n 1273 |         \"\"\"\n 1274 |         ttl = 10\n 1275 |         conn = self.connection\n 1276 |         while conn and self.health_check_response_counter > 0 and ttl > 0:\n 1277 |             if self._execute(conn, conn.can_read, timeout=conn.socket_timeout):\n 1278 |                 response = self._execute(conn, conn.read_response)\n 1279 |                 if self.is_health_check_response(response):\n 1280 |                     self.health_check_response_counter -= 1\n 1281 |                 else:\n 1282 |                     raise PubSubError(\n 1283 |                         \"A non health check response was cleaned by \"\n 1284 |                         \"execute_command: {}\".format(response)\n 1285 |                     )\n 1286 |             ttl -= 1","lines":17,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L1270-L1286"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In handle_message, a bare bytes response is special-cased as a health-check/pong: `response = [b'pong', response] if response != b'PONG' else [b'pong', b'']`. A legitimate non-pubsub bulk-string reply that happens to be bytes (e.g. from an out-of-band command on the same connection) would be misinterpreted as a pong message rather than surfaced/erroring, silently swallowing data.","fix":"Restrict this coercion to the known health-check value(s) instead of all bytes responses, or assert the response matches an expected health-check payload.","locations":[{"ref":"redis/client.py:1676-1677","code":" 1676 |         if isinstance(response, bytes):\n 1677 |             response = [b\"pong\", response] if response != b\"PONG\" else [b\"pong\", b\"\"]","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L1676-L1677"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Pipeline.unwatch() uses Python operator precedence such that `self.watching and self.execute_command('UNWATCH') or True` always evaluates to True, because the trailing `or True` masks any falsy result. The return value therefore conveys no information (it is documented as -> bool but is a constant True). If UNWATCH's actual reply mattered to a caller, it is discarded.","fix":"Rewrite explicitly: `if self.watching: return self.execute_command('UNWATCH')` and `return True` otherwise, or return the command result directly.","locations":[{"ref":"redis/client.py:2327-2329","code":" 2327 |     def unwatch(self) -> bool:\n 2328 |         \"\"\"Unwatches all previously specified keys\"\"\"\n 2329 |         return self.watching and self.execute_command(\"UNWATCH\") or True","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L2327-L2329"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"get_node_from_slot's deprecated server_type path can return the primary even when a replica was requested. When server_type is REPLICA but the slot has more than one node AND a load_balancing_strategy is active, the first branch (line 2281) wins and uses round-robin/random across all nodes including index 0 (the primary), so a caller asking for a replica may still hit the primary. Conversely the replica branch (line 2294-2297) is only reached when no load_balancing_strategy is set. The interaction between the deprecated server_type arg and load_balancing_strategy is inconsistent.","fix":"When server_type == REPLICA is explicitly requested, restrict selection to replica indices (>= 1) regardless of load_balancing_strategy, or document/deprecate the conflicting combination clearly.","locations":[{"ref":"redis/cluster.py:2549-2567","code":" 2549 |             if len(self.slots_cache[slot]) > 1 and load_balancing_strategy:\n 2550 |                 # get the server index using the strategy defined in load_balancing_strategy\n 2551 |                 primary_name = self.slots_cache[slot][0].name\n 2552 |                 node_idx = self.read_load_balancer.get_server_index(\n 2553 |                     primary_name, len(self.slots_cache[slot]), load_balancing_strategy\n 2554 |                 )\n 2555 |             elif (\n 2556 |                 server_type is None\n 2557 |                 or server_type == PRIMARY\n 2558 |                 or len(self.slots_cache[slot]) == 1\n 2559 |             ):\n 2560 |                 # return a primary\n 2561 |                 node_idx = 0\n 2562 |             else:\n 2563 |                 # return a replica\n 2564 |                 # randomly choose one of the replicas\n 2565 |                 node_idx = random.randint(1, len(self.slots_cache[slot]) - 1)\n 2566 | \n 2567 |             return self.slots_cache[slot][node_idx]","lines":19,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L2549-L2567"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ClusterPubSub.execute_command selects the pubsub node via get_node_from_slot using `self.cluster.read_from_replicas` / `load_balancing_strategy` (lines 2922-2926). For regular (non-shard) pubsub a SUBSCRIBE routed to a replica is valid, but if a replica is chosen and later fails over, the channel binding is to a node that no longer serves it; there is no rebinding for classic (non-shard) channels comparable to the shard reconciliation path. This silently drops classic subscriptions on failover without surfacing an error to the caller.","fix":"Document the non-shard pubsub failover limitation explicitly at this call site, or add reconnection/rebinding handling for classic channels analogous to the shard reconciliation in reinitialize_shard_subscriptions.","locations":[{"ref":"redis/cluster.py:3328-3346","code":" 3328 |         if self.connection is None:\n 3329 |             if self.connection_pool is None:\n 3330 |                 if len(args) > 1:\n 3331 |                     # Hash the first channel and get one of the nodes holding\n 3332 |                     # this slot\n 3333 |                     channel = args[1]\n 3334 |                     slot = self.cluster.keyslot(channel)\n 3335 |                     node = self.cluster.nodes_manager.get_node_from_slot(\n 3336 |                         slot,\n 3337 |                         self.cluster.read_from_replicas,\n 3338 |                         self.cluster.load_balancing_strategy,\n 3339 |                     )\n 3340 |                 else:\n 3341 |                     # Get a random node\n 3342 |                     node = self.cluster.get_random_node()\n 3343 |                 self.node = node\n 3344 |                 redis_connection = self.cluster.get_redis_connection(node)\n 3345 |                 self.connection_pool = redis_connection.connection_pool\n 3346 |             self.connection = self.connection_pool.get_connection()","lines":19,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L3328-L3346"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"PipelineStrategy.send_cluster_commands retry loop swallows the loop exit semantics. In send_cluster_commands (lines 4046-4060), on a retryable error it decrements retry_attempts and falls through the `pass` to loop again, but there is no backoff/sleep between attempts and, when retry_attempts hits 0, it `raise e` - however the `while True` has no other exit, so a persistently retryable error spins as fast as possible with zero delay (unlike _execute_command which sleeps on TryAgain/ClusterDown). This can hammer a recovering cluster.","fix":"Apply the configured retry backoff between attempts (or reuse the Retry object's call_with_retry) instead of an immediate tight retry loop.","locations":[{"ref":"redis/cluster.py:5036-5050","code":" 5036 |         while True:\n 5037 |             try:\n 5038 |                 return self._send_cluster_commands(\n 5039 |                     stack,\n 5040 |                     raise_on_error=raise_on_error,\n 5041 |                     allow_redirections=allow_redirections,\n 5042 |                 )\n 5043 |             except RedisCluster.ERRORS_ALLOW_RETRY as e:\n 5044 |                 if retry_attempts > 0:\n 5045 |                     # Try again with the new cluster setup. All other errors\n 5046 |                     # should be raised.\n 5047 |                     retry_attempts -= 1\n 5048 |                     pass\n 5049 |                 else:\n 5050 |                     raise e","lines":15,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L5036-L5050"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AsyncClusterManagementCommands.cluster_delslots wraps each execute_command in asyncio.create_task before passing to asyncio.gather. gather already schedules coroutines as tasks, so the explicit create_task is redundant; more importantly, eagerly creating all tasks means if one DELSLOTS fails the others keep running to completion (gather with default return_exceptions=False cancels pending awaitables, but already-scheduled tasks created outside gather are not guaranteed to be cancelled), potentially leaving partial slot changes with leaked tasks on error.","fix":"Pass the bare coroutines to asyncio.gather without wrapping in create_task; let gather manage scheduling and cancellation.","locations":[{"ref":"redis/commands/cluster.py:1185-1199","code":" 1185 |     async def cluster_delslots(self, *slots: EncodableT) -> List[bool]:\n 1186 |         \"\"\"\n 1187 |         Set hash slots as unbound in the cluster.\n 1188 |         It determines by it self what node the slot is in and sends it there\n 1189 | \n 1190 |         Returns a list of the results for each processed slot.\n 1191 | \n 1192 |         For more information see https://redis.io/commands/cluster-delslots\n 1193 |         \"\"\"\n 1194 |         return await asyncio.gather(\n 1195 |             *(\n 1196 |                 asyncio.create_task(self.execute_command(\"CLUSTER DELSLOTS\", slot))\n 1197 |                 for slot in slots\n 1198 |             )\n 1199 |         )","lines":15,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/cluster.py#L1185-L1199"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"msetex computes the field count as len(mapping) and emits `['MSETEX', len(mapping)]` followed by key/value pairs, but hsetex computes its FIELDS count as int(len(pieces)/2) from the flattened pieces (which combine items+key/value+mapping). msetex only ever flattens `mapping`, so if a caller's mapping were somehow not a plain dict the count could mismatch; more importantly the two sibling 'setex'-style builders use different counting strategies (len(mapping) vs len(pieces)//2), an inconsistency that makes them error-prone to maintain together.","fix":"Use a single consistent counting approach (count flattened pairs // 2) in both msetex and hsetex.","locations":[{"ref":"redis/commands/core.py:3898-3903","code":" 3898 |         pieces = [\"MSETEX\", len(mapping)]\n 3899 | \n 3900 |         for pair in mapping.items():\n 3901 |             pieces.extend(pair)\n 3902 | \n 3903 |         return self.execute_command(*pieces, *exp_options)","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L3898-L3903"},{"ref":"redis/commands/core.py:10125-10136","code":"10125 |         pieces = []\n10126 |         if items:\n10127 |             pieces.extend(items)\n10128 |         if key is not None:\n10129 |             pieces.extend((key, value))\n10130 |         if mapping:\n10131 |             for pair in mapping.items():\n10132 |                 pieces.extend(pair)\n10133 | \n10134 |         return self.execute_command(\n10135 |             \"HSETEX\", name, *exp_options, \"FIELDS\", int(len(pieces) / 2), *pieces\n10136 |         )","lines":12,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L10125-L10136"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"stralgo silently swallows a non-integer minmatchlen via try/int(minmatchlen)/except TypeError, but it also swallows a ValueError-free path inconsistently: `int(minmatchlen)` is computed only to test convertibility, then the ORIGINAL minmatchlen (not the int) is appended to pieces. If minmatchlen is a float like 2.5, int() succeeds (no TypeError), and the raw 2.5 is sent to the server. Also minmatchlen is accepted even when idx is False, contradicting the docstring which says it 'Can be provided only when idx set to True' - no validation enforces that.","fix":"Validate minmatchlen is an int (or coerce and append the coerced int), and raise DataError if minmatchlen/withmatchlen are provided without idx, as the docstring promises.","locations":[{"ref":"redis/commands/core.py:4631-4635","code":" 4631 |         try:\n 4632 |             int(minmatchlen)\n 4633 |             pieces.extend([b\"MINMATCHLEN\", minmatchlen])\n 4634 |         except TypeError:\n 4635 |             pass","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L4631-L4635"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"lcs ignores minmatchlen only when it equals 0 (`if minmatchlen is not None and minmatchlen != 0`). A caller explicitly passing minmatchlen=0 (the documented default meaning 'no minimum') silently omits the clause, which is correct, but a negative minmatchlen would be sent verbatim with no validation. More notably lcs (unlike stralgo) performs no validation that idx is set when minmatchlen/withmatchlen are used, so MINMATCHLEN/WITHMATCHLEN can be emitted without IDX, yielding a server error rather than a clear client-side DataError.","fix":"Validate that minmatchlen/withmatchlen require idx (matching stralgo's intent) and reject negative minmatchlen with a clear DataError.","locations":[{"ref":"redis/commands/core.py:4795-4804","code":" 4795 |         pieces: list[str | int] = [key1, key2]\n 4796 |         if len:\n 4797 |             pieces.append(\"LEN\")\n 4798 |         if idx:\n 4799 |             pieces.append(\"IDX\")\n 4800 |         if minmatchlen is not None and minmatchlen != 0:\n 4801 |             pieces.extend([\"MINMATCHLEN\", minmatchlen])\n 4802 |         if withmatchlen:\n 4803 |             pieces.append(\"WITHMATCHLEN\")\n 4804 |         return self.execute_command(\"LCS\", *pieces, keys=[key1, key2])","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L4795-L4804"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"scan_iter / sscan_iter / hscan_iter / zscan_iter (sync and async) initialize `cursor = '0'` (a str) and loop `while cursor != 0` (int). On the first iteration '0' != 0 is True so it runs once, then the server returns an int cursor so the comparison works thereafter. This relies on the string/int type mismatch always being unequal on the first pass; it works but is fragile and confusing - the sentinel type does not match the loop-termination type. If a parser ever returned the initial cursor as the string '0' the loop would never terminate. The pattern is duplicated in 8 places.","fix":"Initialize the sentinel as int 0 only if the loop condition is changed, or compare against the actual returned cursor type consistently; e.g. `cursor = None` with a `first` flag, or compare `int(cursor) != 0`.","locations":[{"ref":"redis/commands/core.py:6134-6139","code":" 6134 |         cursor = \"0\"\n 6135 |         while cursor != 0:\n 6136 |             cursor, data = self.scan(\n 6137 |                 cursor=cursor, match=match, count=count, _type=_type, **kwargs\n 6138 |             )\n 6139 |             yield from data","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L6134-L6139"},{"ref":"redis/commands/core.py:6197-6200","code":" 6197 |         cursor = \"0\"\n 6198 |         while cursor != 0:\n 6199 |             cursor, data = self.sscan(name, cursor=cursor, match=match, count=count)\n 6200 |             yield from data","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L6197-L6200"},{"ref":"redis/commands/core.py:6268-6276","code":" 6268 |         cursor = \"0\"\n 6269 |         while cursor != 0:\n 6270 |             cursor, data = self.hscan(\n 6271 |                 name, cursor=cursor, match=match, count=count, no_values=no_values\n 6272 |             )\n 6273 |             if no_values:\n 6274 |                 yield from data\n 6275 |             else:\n 6276 |                 yield from data.items()","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L6268-L6276"},{"ref":"redis/commands/core.py:6343-6352","code":" 6343 |         cursor = \"0\"\n 6344 |         while cursor != 0:\n 6345 |             cursor, data = self.zscan(\n 6346 |                 name,\n 6347 |                 cursor=cursor,\n 6348 |                 match=match,\n 6349 |                 count=count,\n 6350 |                 score_cast_func=score_cast_func,\n 6351 |             )\n 6352 |             yield from data","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L6343-L6352"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"xinfo_stream rebinds `options = {}` then `options = {'full': full}` inside the `if full:` block, discarding the initial empty dict (harmless) but the pattern is misleading. More importantly when full is False, options stays {} and 'full' is never passed, so the response callback cannot distinguish summary vs full; this is fine for current callbacks but the asymmetric handling (only setting the option when True) is a latent inconsistency with how other commands always pass their flag.","fix":"Always pass full to options (options = {'full': full}) and append b'FULL' conditionally, for consistency.","locations":[{"ref":"redis/commands/core.py:7605-7610","code":" 7605 |         pieces = [name]\n 7606 |         options = {}\n 7607 |         if full:\n 7608 |             pieces.append(b\"FULL\")\n 7609 |             options = {\"full\": full}\n 7610 |         return self.execute_command(\"XINFO STREAM\", *pieces, **options)","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L7605-L7610"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"georadius _georadiusgeneric checks `if kwargs['count'] is not None` for COUNT (correct) but geosearch _geosearchgeneric checks `if kwargs['count']` (truthiness). A count of 0 is treated differently by the two code paths: georadius would emit `COUNT 0` while geosearch drops it. Inconsistent handling of the same parameter between two sibling helpers; count=0 is nonsensical but the divergence is a latent copy-paste inconsistency.","fix":"Use a consistent `is not None` test for count in both helpers.","locations":[{"ref":"redis/commands/core.py:11797-11800","code":"11797 |         if kwargs[\"count\"] is not None:\n11798 |             pieces.extend([\"COUNT\", kwargs[\"count\"]])\n11799 |             if kwargs[\"any\"]:\n11800 |                 pieces.append(\"ANY\")","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L11797-L11800"},{"ref":"redis/commands/core.py:12068-12073","code":"12068 |         if kwargs[\"count\"]:\n12069 |             pieces.extend([b\"COUNT\", kwargs[\"count\"]])\n12070 |             if kwargs[\"any\"]:\n12071 |                 pieces.append(b\"ANY\")\n12072 |         elif kwargs[\"any\"]:\n12073 |             raise DataError(\"GEOSEARCH ``any`` can't be provided without count\")","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L12068-L12073"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"parse_to_list converts booleans through the int branch: bool is a subclass of int, so a True/False item (or a numeric item that is actually a flag) becomes 1/0. More importantly, the float fast-path (`isinstance(item, float)`) preserves floats but the subsequent int(item) attempt on a string like \"3.0\" raises ValueError and falls through to float, while \"3\" becomes int 3 - so semantically-float values that arrive as the string \"3\" are silently coerced to int, changing the response type depending on server formatting.","fix":"Decide on a single numeric type policy independent of the server's textual formatting, and avoid int() coercion of values that the caller expects as float.","locations":[{"ref":"redis/commands/helpers.py:73-106","code":"   73 | def parse_to_list(response):\n   74 |     \"\"\"Optimistically parse the response to a list.\"\"\"\n   75 |     res = []\n   76 | \n   77 |     special_values = {\"infinity\", \"nan\", \"-infinity\"}\n   78 | \n   79 |     if response is None:\n   80 |         return res\n   81 | \n   82 |     for item in response:\n   83 |         if item is None:\n   84 |             res.append(None)\n   85 |             continue\n   86 |         if isinstance(item, float):\n   87 |             res.append(item)\n   88 |             continue\n   89 |         try:\n   90 |             item_str = nativestr(item)\n   91 |         except TypeError:\n   92 |             res.append(None)\n   93 |             continue\n   94 | \n   95 |         if isinstance(item_str, str) and item_str.lower() in special_values:\n   96 |             res.append(item_str)  # Keep as string\n   97 |         else:\n   98 |             try:\n   99 |                 res.append(int(item))\n  100 |             except (ValueError, OverflowError, TypeError):\n  101 |                 try:\n  102 |                     res.append(float(item))\n  103 |                 except (ValueError, TypeError):\n  104 |                     res.append(item_str)\n  105 | \n  106 |     return res","lines":34,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/helpers.py#L73-L106"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"When a client is constructed with an explicit protocol=3 AND legacy_responses=True (the default), apply_module_callbacks selects the `resp3` dict, which is `{}` for the timeseries, json, bf and vectorset modules. As a result TS.GET/MGET/RANGE/INFO, JSON.* numeric/decode callbacks, BF.INFO, VSIM/VEMB/etc. get NO response post-processing and return raw wire values. Only protocol=None (implicit RESP3) routes through resp3_to_resp2_legacy. Explicitly passing protocol=3 thus behaves very differently from the default, which is surprising and likely unintended.","fix":"Populate the `resp3` (legacy) callback dicts the same way as `resp3_to_resp2_legacy`, or have apply_module_callbacks fall back to resp3_to_resp2_legacy when legacy_responses is True and user_protocol==3 and resp3 is empty.","locations":[{"ref":"redis/commands/helpers.py:171-184","code":"  171 |     callbacks: Dict[str, Callable[..., Any]] = dict(common)\n  172 |     if legacy_responses:\n  173 |         if user_protocol is None:\n  174 |             callbacks.update(resp3_to_resp2_legacy or {})\n  175 |         elif user_protocol in (3, \"3\"):\n  176 |             callbacks.update(resp3)\n  177 |         else:\n  178 |             callbacks.update(resp2)\n  179 |     else:\n  180 |         if user_protocol is None or user_protocol in (3, \"3\"):\n  181 |             callbacks.update(resp3_unified if resp3_unified is not None else resp3)\n  182 |         else:\n  183 |             callbacks.update(resp2_unified if resp2_unified is not None else resp2)\n  184 |     return callbacks","lines":14,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/helpers.py#L171-L184"},{"ref":"redis/commands/timeseries/__init__.py:82","code":"   82 |         _RESP3_MODULE_CALLBACKS = {}","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/timeseries/__init__.py#L82"},{"ref":"redis/commands/json/__init__.py:73","code":"   73 |         _RESP3_MODULE_CALLBACKS = {}","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/json/__init__.py#L73"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"json _convert_resp_floats (used for JSON.RESP unified) converts any string leaf that parses as float into a native float. This will also convert intentional numeric-looking JSON string values (e.g. a stored string \"3.14\") into floats, losing the distinction between a JSON string and a JSON number in the RESP-tree representation.","fix":"Rely on the wire-level type information (only convert leaves that JSON.RESP marks as doubles) rather than best-effort float() parsing of arbitrary strings, or document the lossy behaviour.","locations":[{"ref":"redis/commands/json/__init__.py:196-213","code":"  196 |     @staticmethod\n  197 |     def _convert_resp_floats(obj):\n  198 |         \"\"\"Recursively convert string-encoded JSON floats.\n  199 | \n  200 |         RESP2 has no native double type, so JSON.RESP returns JSON floats as\n  201 |         bulk strings. Any string/bytes leaf that parses as ``float`` is the\n  202 |         unified representation of such a value; non-numeric strings are left\n  203 |         untouched.\n  204 |         \"\"\"\n  205 |         if isinstance(obj, list):\n  206 |             return [_JSONBase._convert_resp_floats(item) for item in obj]\n  207 |         if isinstance(obj, (str, bytes)):\n  208 |             value = obj.decode() if isinstance(obj, bytes) else obj\n  209 |             try:\n  210 |                 return float(value)\n  211 |             except (ValueError, OverflowError):\n  212 |                 return obj\n  213 |         return obj","lines":18,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/json/__init__.py#L196-L213"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"JSON.arrindex silently drops `stop` when `start` is None. The `if start is not None:` block nests the `stop` append inside it, so calling arrindex(name, path, scalar, stop=5) sends neither start nor stop. There is no way to pass stop with a default/omitted start, and the silent drop hides the misuse instead of erroring.","fix":"Append start (defaulting to 0 when None but stop is provided) and stop independently, or raise DataError when stop is provided without start, so the argument intent is preserved.","locations":[{"ref":"redis/commands/json/commands.py:121-127","code":"  121 |         pieces = [name, str(path), self._encode(scalar)]\n  122 |         if start is not None:\n  123 |             pieces.append(start)\n  124 |             if stop is not None:\n  125 |                 pieces.append(stop)\n  126 | \n  127 |         return self.execute_command(\"JSON.ARRINDEX\", *pieces, keys=[name])","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/json/commands.py#L121-L127"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`AggregateRequest.sort_by` only special-cases `Asc`/`Desc` *instances* (`isinstance(f, (Asc, Desc))`), whereas the `first_value` reducer accepts both the Asc/Desc *class* and instances. Passing the bare class `Asc` (as the docstrings elsewhere suggest is a valid sort spec) falls through to the `else` branch and appends the class object itself as a field argument, producing a malformed SORTBY clause rather than an error.","fix":"Either reject non-instance Asc/Desc with a clear error, or handle the class form consistently with first_value.","locations":[{"ref":"redis/commands/search/aggregation.py:255-263","code":"  255 |         fields_args = []\n  256 |         for f in fields:\n  257 |             if isinstance(f, (Asc, Desc)):\n  258 |                 fields_args += [f.field, f.DIRSTRING]\n  259 |             else:\n  260 |                 fields_args += [f]\n  261 | \n  262 |         ret = [\"SORTBY\", str(len(fields_args))]\n  263 |         ret.extend(fields_args)","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/aggregation.py#L255-L263"},{"ref":"redis/commands/search/reducers.py:153-162","code":"  153 |         fieldstrs = []\n  154 |         if (\n  155 |             len(byfields) == 1\n  156 |             and isinstance(byfields[0], type)\n  157 |             and issubclass(byfields[0], SortDirection)\n  158 |         ):\n  159 |             byfields = [byfields[0](field)]\n  160 | \n  161 |         for f in byfields:\n  162 |             fieldstrs += [f.field, f.DIRSTRING]","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/reducers.py#L153-L162"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`_parse_profile`/`_parse_profile_unified` pass `query._cursor` (the list produced by `AggregateRequest.cursor()`, e.g. `[\"WITHCURSOR\", ...]`) directly as the `has_cursor` argument of `_get_aggregate_result`. It is used only for truthiness so it works, but it conflates a flag with a token list and, when truthy, makes `_get_aggregate_result` treat `res[0][1]` as a cursor id. For a profiled cursored aggregate this assumes the inner result is `[data, cursor_id]`; if the profile wraps the aggregate result differently this indexes the wrong element. The mismatch between a bool flag elsewhere (`has_cursor=bool(query._cursor)` in `aggregate`) and a raw list here is fragile.","fix":"Pass `bool(query._cursor)` for consistency with `aggregate()` and verify the cursored-profile result shape, rather than passing the raw cursor-args list.","locations":[{"ref":"redis/commands/search/commands.py:323-336","code":"  323 |     def _parse_profile(self, res, **kwargs):\n  324 |         query = kwargs[\"query\"]\n  325 |         if isinstance(query, AggregateRequest):\n  326 |             result = self._get_aggregate_result(res[0], query, query._cursor)\n  327 |         else:\n  328 |             result = Result(\n  329 |                 res[0],\n  330 |                 not query._no_content,\n  331 |                 duration=kwargs[\"duration\"],\n  332 |                 has_payload=query._with_payloads,\n  333 |                 with_scores=query._with_scores,\n  334 |             )\n  335 | \n  336 |         return result, ProfileInformation(res[1])","lines":14,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/commands.py#L323-L336"},{"ref":"redis/commands/search/commands.py:1457-1477","code":" 1457 |     def _get_aggregate_result(\n 1458 |         self, raw: List, query: Union[AggregateRequest, Cursor], has
