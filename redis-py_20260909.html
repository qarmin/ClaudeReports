_cursor: bool\n 1459 |     ):\n 1460 |         if has_cursor:\n 1461 |             if isinstance(query, Cursor):\n 1462 |                 query.cid = raw[1]\n 1463 |                 cursor = query\n 1464 |             else:\n 1465 |                 cursor = Cursor(raw[1])\n 1466 |             raw = raw[0]\n 1467 |         else:\n 1468 |             cursor = None\n 1469 | \n 1470 |         if isinstance(query, AggregateRequest) and query._with_schema:\n 1471 |             schema = raw[0]\n 1472 |             rows = raw[2:]\n 1473 |         else:\n 1474 |             schema = None\n 1475 |             rows = raw[1:]\n 1476 | \n 1477 |         return AggregateResult(rows, cursor, schema)","lines":21,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/commands.py#L1457-L1477"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`create_index` only emits the TEMPORARY clause when `isinstance(temporary, int)`. A caller passing a float number of seconds (a natural thing to do for an idle timeout) silently gets no TEMPORARY clause and creates a permanent index instead, with no error. Note `bool` is also an int subclass, so `temporary=True` would emit `TEMPORARY True`.","fix":"Accept numeric (int/float) values for `temporary` (and reject bool), or document/validate the expected type explicitly rather than silently dropping non-int values.","locations":[{"ref":"redis/commands/search/commands.py:1012-1014","code":" 1012 |         if temporary is not None and isinstance(temporary, int):\n 1013 |             args.append(TEMPORARY)\n 1014 |             args.append(temporary)","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/commands.py#L1012-L1014"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`HybridPostProcessingConfig.load` joins the variadic `fields` with spaces and then re-splits on spaces (`fields_str = \" \".join(fields); fields_list = fields_str.split(\" \")`). If any individual field token already contains a space (e.g. an expression passed as a single string), the LOAD count and the field list become inconsistent with what the caller intended, and the count emitted (`len(fields_list)`) will not match the original `fields`. The join/split round-trip is also pointless when tokens are already individual.","fix":"Use `fields` directly as the list (`fields_list = list(fields)`) instead of joining and re-splitting on spaces.","locations":[{"ref":"redis/commands/search/hybrid_query.py:270-277","code":"  270 |         if fields:\n  271 |             fields_str = \" \".join(fields)\n  272 |             fields_list = fields_str.split(\" \")\n  273 |             self._load_statements.extend((\"LOAD\", len(fields_list), *fields_list))\n  274 |             self._set_load_field_encodings(\n  275 |                 fields_list, encoding if decode_field else None\n  276 |             )\n  277 |         return self","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/hybrid_query.py#L270-L277"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"parse_m_get_unified RESP2 branch keys the result dict with the raw `item[0]` (bytes when decode_responses is False) while the RESP3 branch keys by the already-decoded name, and the legacy parse_m_get uses nativestr(item[0]). The unified RESP2 path is the odd one out, so dict keys differ by wire format for the same logical data.","fix":"Apply nativestr to item[0] in the RESP2 branch of parse_m_get_unified (and likewise parse_m_range_unified at line 160) so keys are protocol-independent.","locations":[{"ref":"redis/commands/timeseries/utils.py:130-139","code":"  130 |     res = {}\n  131 |     for item in response:\n  132 |         if not item[2]:\n  133 |             res[item[0]] = [_pairs_to_dict(item[1]), []]\n  134 |         else:\n  135 |             res[item[0]] = [\n  136 |                 _pairs_to_dict(item[1]),\n  137 |                 [int(item[2][0]), float(item[2][1])],\n  138 |             ]\n  139 |     return res","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/timeseries/utils.py#L130-L139"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"parse_m_range_unified RESP3 branch computes `metadata = item[1] if len(item) > 2 else []`, but the RESP3 MRANGE element layout is [labels, metadata, samples] (3 elements). The condition `len(item) > 2` only holds when metadata IS present, but when metadata is absent (2-element [labels, samples]) it returns [] for metadata AND uses item[-1] for samples — which is correct only by luck. If a 3-element form without real aggregator metadata ever appears the indexing assumptions are fragile and inconsistent with the synthesized RESP2 metadata path.","fix":"Make the RESP3 branch explicit about the element arity (distinguish 2- vs 3-element rows) and align the emitted metadata structure with _m_range_metadata used on the RESP2 path.","locations":[{"ref":"redis/commands/timeseries/utils.py:183-188","code":"  183 |     if isinstance(response, dict):\n  184 |         res = {}\n  185 |         for key, item in response.items():\n  186 |             metadata = item[1] if len(item) > 2 else []\n  187 |             res[key] = [item[0], metadata, parse_range_unified(item[-1])]\n  188 |         return res","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/timeseries/utils.py#L183-L188"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"VectorSet vadd/vsim use truthiness tests for numeric options: `if reduce_dim:`, `if count:`, `if ef:`, `if epsilon:`. A value of 0 is silently dropped. While 0 is meaningless for most, `epsilon` is documented as a float between 0 and 1 and `ef`/`count` could conceivably be 0 in edge cases; the silent drop differs from the explicit `is not None` checks used elsewhere (e.g. vrange/vrandmember count).","fix":"Use `is not None` checks for numeric options (reduce_dim, count, ef, epsilon) for consistency, matching vrange/vrandmember which correctly test `if count is not None`.","locations":[{"ref":"redis/commands/vectorset/commands.py:144-145","code":"  144 |         if reduce_dim:\n  145 |             pieces.extend([\"REDUCE\", reduce_dim])","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/vectorset/commands.py#L144-L145"},{"ref":"redis/commands/vectorset/commands.py:278-285","code":"  278 |         if count:\n  279 |             pieces.extend([\"COUNT\", count])\n  280 | \n  281 |         if epsilon:\n  282 |             pieces.extend([\"EPSILON\", epsilon])\n  283 | \n  284 |         if ef:\n  285 |             pieces.extend([\"EF\", ef])","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/vectorset/commands.py#L278-L285"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In Connection.__init__, protocol parsing does 'try: p = int(protocol)' catching TypeError to default and ValueError to error. But int(protocol) where protocol is a bool (True/False) succeeds silently (int(True)==1, int(False)==0), then the range check p<2 raises 'protocol must be either 2 or 3'. More subtly, a float like 2.9 becomes 2 silently. Passing protocol=2.9 is accepted as 2 without warning.","fix":"Validate that protocol is an int (or int-like string) explicitly before coercion, rejecting bool and non-integral floats with a clear message.","locations":[{"ref":"redis/connection.py:1018-1027","code":" 1018 |         try:\n 1019 |             p = int(protocol)\n 1020 |         except TypeError:\n 1021 |             p = DEFAULT_RESP_VERSION\n 1022 |         except ValueError:\n 1023 |             raise ConnectionError(\"protocol must be an integer\")\n 1024 |         else:\n 1025 |             if p < 2 or p > 3:\n 1026 |                 raise ConnectionError(\"protocol must be either 2 or 3\")\n 1027 |         self.protocol = p","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L1018-L1027"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AbstractConnection.connect_check_health stores per-call retry state in a list 'actual_retry_attempts = [0]' captured by the failure_callback closure. This works for a single in-flight connect, but the pattern of using a mutable list cell to smuggle a counter out of a callback is fragile, and on the non-retry path (retry_socket_connect=False, used by connect()) failure_callback is never invoked so actual_retry_attempts stays 0 even though the outer self.retry.call_with_retry in connect() may have retried multiple times; the error metric then under-reports retry_attempts.","fix":"Thread the retry count through the retry machinery's return/exception rather than a closure-captured list, and ensure the count reflects the outer retry loop in connect().","locations":[{"ref":"redis/connection.py:1121-1174","code":" 1121 |     def connect(self):\n 1122 |         \"Connects to the Redis server if not already connected\"\n 1123 |         # try once the socket connect with the handshake, retry the whole\n 1124 |         # connect/handshake flow based on retry policy\n 1125 |         self.retry.call_with_retry(\n 1126 |             lambda: self.connect_check_health(\n 1127 |                 check_health=True, retry_socket_connect=False\n 1128 |             ),\n 1129 |             lambda error: self.disconnect(error),\n 1130 |         )\n 1131 | \n 1132 |     def connect_check_health(\n 1133 |         self, check_health: bool = True, retry_socket_connect: bool = True\n 1134 |     ):\n 1135 |         if self._sock:\n 1136 |             return\n 1137 |         # Track actual retry attempts for error reporting\n 1138 |         actual_retry_attempts = [0]\n 1139 | \n 1140 |         def failure_callback(error, failure_count):\n 1141 |             actual_retry_attempts[0] = failure_count\n 1142 |             self.disconnect(error=error, failure_count=failure_count)\n 1143 | \n 1144 |         try:\n 1145 |             if retry_socket_connect:\n 1146 |                 sock = self.retry.call_with_retry(\n 1147 |                     self._connect,\n 1148 |                     failure_callback,\n 1149 |                     with_failure_count=True,\n 1150 |                 )\n 1151 |             else:\n 1152 |                 sock = self._connect()\n 1153 |         except socket.timeout:\n 1154 |             e = TimeoutError(\"Timeout connecting to server\")\n 1155 |             record_error_count(\n 1156 |                 server_address=self.host,\n 1157 |                 server_port=self.port,\n 1158 |                 network_peer_address=self.host,\n 1159 |                 network_peer_port=self.port,\n 1160 |                 error_type=e,\n 1161 |                 retry_attempts=actual_retry_attempts[0],\n 1162 |             )\n 1163 |             raise e\n 1164 |         except OSError as e:\n 1165 |             e = ConnectionError(self._error_message(e))\n 1166 |             record_error_count(\n 1167 |                 server_address=getattr(self, \"host\", None),\n 1168 |                 server_port=getattr(self, \"port\", None),\n 1169 |                 network_peer_address=getattr(self, \"host\", None),\n 1170 |                 network_peer_port=getattr(self, \"port\", None),\n 1171 |                 error_type=e,\n 1172 |                 retry_attempts=actual_retry_attempts[0],\n 1173 |             )\n 1174 |             raise e","lines":54,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L1121-L1174"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"UsernamePasswordCredentialProvider.get_credentials returns a 1-tuple (password,) when username is falsy, but treats an empty-string password as a valid single credential. With username='' and password='' it returns ('',), causing an AUTH with an empty password rather than skipping auth. Constructor coerces None to '' (username or '', password or ''), losing the distinction between 'no credentials' and 'empty credentials'.","fix":"Preserve None vs empty-string distinction, and skip returning a credential tuple when no password/username was actually supplied.","locations":[{"ref":"redis/credentials.py:55-62","code":"   55 |     def __init__(self, username: Optional[str] = None, password: Optional[str] = None):\n   56 |         self.username = username or \"\"\n   57 |         self.password = password or \"\"\n   58 | \n   59 |     def get_credentials(self):\n   60 |         if self.username:\n   61 |             return self.username, self.password\n   62 |         return (self.password,)","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/credentials.py#L55-L62"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"WeightedList.update_weight has its docstring placed as the first statement inside `with self._lock:` rather than directly under the def, so it is a no-op string expression, not a docstring (help()/__doc__ will not show it). Cosmetic but a copy/placement bug.","fix":"Move the '''Update weight of an item''' string to be the first line of the method body, above `with self._lock:`.","locations":[{"ref":"redis/data_structure.py:57-62","code":"   57 |     def update_weight(self, item, new_weight: float):\n   58 |         with self._lock:\n   59 |             \"\"\"Update weight of an item\"\"\"\n   60 |             old_weight = self.remove(item)\n   61 |             self.add(item, new_weight)\n   62 |             return old_weight","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/data_structure.py#L57-L62"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"EventDispatcher.dispatch_async lazily creates self._async_lock without synchronization: `if self._async_lock is None: self._async_lock = asyncio.Lock()`. If dispatch_async is invoked concurrently from multiple tasks before the lock is first created, two asyncio.Lock instances can be created (last write wins) and the snapshot section briefly runs without mutual exclusion. Low impact because the lock only guards a snapshot copy, but it defeats the intended exclusion on first use.","fix":"Create the asyncio.Lock in __init__ (bound to the running loop lazily but guarded), or document that concurrent first-use is acceptable since only a snapshot is protected.","locations":[{"ref":"redis/event.py:134-144","code":"  134 |     async def dispatch_async(self, event: object):\n  135 |         if self._async_lock is None:\n  136 |             self._async_lock = asyncio.Lock()\n  137 | \n  138 |         # Snapshot listeners under the lock, then release it before awaiting\n  139 |         # them. See the note in dispatch(); the same rationale applies here\n  140 |         # for dispatch_async re-entry from within a listener.\n  141 |         async with self._async_lock:\n  142 |             listeners = list(self._event_listeners_mapping.get(type(event), []))\n  143 |         for listener in listeners:\n  144 |             await listener.listen(event)","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/event.py#L134-L144"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"EventDispatcher.register_listeners merges listener lists via set() (`list(set(existing + new))`). This deduplicates by listener identity/hash but also discards ordering (set iteration order is arbitrary) and silently drops listeners that compare equal / hash equal even if they are distinct intended registrations. unregister_listeners deliberately uses identity ('is') to avoid relying on __eq__, but register uses set() which DOES rely on __hash__/__eq__, an inconsistency that can drop or reorder listeners.","fix":"Make register_listeners use identity-based dedup (append if not already present by `is`) to match unregister_listeners semantics and preserve order.","locations":[{"ref":"redis/event.py:146-163","code":"  146 |     def register_listeners(\n  147 |         self,\n  148 |         mappings: Dict[\n  149 |             Type[object],\n  150 |             List[Union[EventListenerInterface, AsyncEventListenerInterface]],\n  151 |         ],\n  152 |     ):\n  153 |         with self._lock:\n  154 |             for event_type in mappings:\n  155 |                 if event_type in self._event_listeners_mapping:\n  156 |                     self._event_listeners_mapping[event_type] = list(\n  157 |                         set(\n  158 |                             self._event_listeners_mapping[event_type]\n  159 |                             + mappings[event_type]\n  160 |                         )\n  161 |                     )\n  162 |                 else:\n  163 |                     self._event_listeners_mapping[event_type] = mappings[event_type]","lines":18,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/event.py#L146-L163"},{"ref":"redis/event.py:165-183","code":"  165 |     def unregister_listeners(\n  166 |         self,\n  167 |         mappings: Dict[\n  168 |             Type[object],\n  169 |             List[Union[EventListenerInterface, AsyncEventListenerInterface]],\n  170 |         ],\n  171 |     ):\n  172 |         with self._lock:\n  173 |             for event_type, to_remove in mappings.items():\n  174 |                 current = self._event_listeners_mapping.get(event_type)\n  175 |                 if not current:\n  176 |                     continue\n  177 |                 # Remove by identity to match register semantics and to avoid\n  178 |                 # reliance on listener __eq__ implementations.\n  179 |                 self._event_listeners_mapping[event_type] = [\n  180 |                     listener\n  181 |                     for listener in current\n  182 |                     if all(listener is not target for target in to_remove)\n  183 |                 ]","lines":19,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/event.py#L165-L183"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"HttpClient base_url normalization uses base_url.rstrip() with no argument, which strips ALL trailing whitespace (spaces, tabs, newlines) then appends '/'. rstrip() does not strip a trailing slash, so a base_url already ending in non-whitespace is fine, but the intent was almost certainly rstrip('/') to avoid double slashes when joining. As written, a base_url like 'http://h/api/' is left unchanged (correct), but 'http://h/api' becomes 'http://h/api/' - which combined with urljoin and an absolute-looking path can drop the '/api' segment. The bare rstrip() is a likely typo for rstrip('/').","fix":"Confirm intent; if the goal is to ensure exactly one trailing slash, use base_url.rstrip('/') + '/' or simply ensure it ends with '/'. Note urljoin semantics: relative path joining requires the base to end in '/'.","locations":[{"ref":"redis/http/http_client.py:110-114","code":"  110 |         self.base_url = (\n  111 |             base_url.rstrip() + \"/\"\n  112 |             if base_url and not base_url.endswith(\"/\")\n  113 |             else base_url\n  114 |         )","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/http/http_client.py#L110-L114"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"HttpClient retry: the request() method retries the underlying _make_request via self.retry.call_with_retry, but only HTTPError 5xx/429 are retried (via _is_retryable_http_error). However, after retries are exhausted, HTTPError is caught at line 285 and converted into a successful-looking HttpResponse (not re-raised), so a 500 after exhausted retries returns an HttpResponse with status 500 which _json_call then turns into HttpError. URLError/ssl.SSLError are registered as supported errors for retry but are NOT in _is_retryable_http_error (which returns False for non-HTTPError), so they are never actually retried despite being registered - dead retry configuration for network errors.","fix":"Make _is_retryable_http_error also return True for transient URLError/SSLError if they are meant to be retried, or remove them from update_supported_errors to avoid the misleading configuration.","locations":[{"ref":"redis/http/http_client.py:118","code":"  118 |         self.retry.update_supported_errors((HTTPError, URLError, ssl.SSLError))","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/http/http_client.py#L118"},{"ref":"redis/http/http_client.py:279-323","code":"  279 |         try:\n  280 |             return self.retry.call_with_retry(\n  281 |                 lambda: self._make_request(req, context=context, timeout=timeout),\n  282 |                 lambda _: dummy_fail(),\n  283 |                 lambda error: self._is_retryable_http_error(error),\n  284 |             )\n  285 |         except HTTPError as e:\n  286 |             # Read error body, build response, and decide on retry\n  287 |             err_body = b\"\"\n  288 |             try:\n  289 |                 err_body = e.read()\n  290 |             except Exception:\n  291 |                 pass\n  292 |             headers_map = {k.lower(): v for k, v in (e.headers or {}).items()}\n  293 |             err_body = self._maybe_decompress(err_body, headers_map)\n  294 |             status = getattr(e, \"code\", 0) or 0\n  295 |             response = HttpResponse(\n  296 |                 status=status,\n  297 |                 headers=headers_map,\n  298 |                 url=url,\n  299 |                 content=err_body,\n  300 |             )\n  301 |             return response\n  302 | \n  303 |     def _make_request(\n  304 |         self,\n  305 |         request: Request,\n  306 |         context: Optional[ssl.SSLContext] = None,\n  307 |         timeout: Optional[float] = None,\n  308 |     ):\n  309 |         with urlopen(request, timeout=timeout or self.timeout, context=context) as resp:\n  310 |             raw = resp.read()\n  311 |             headers_map = {k.lower(): v for k, v in resp.headers.items()}\n  312 |             raw = self._maybe_decompress(raw, headers_map)\n  313 |             return HttpResponse(\n  314 |                 status=resp.status,\n  315 |                 headers=headers_map,\n  316 |                 url=resp.geturl(),\n  317 |                 content=raw,\n  318 |             )\n  319 | \n  320 |     def _is_retryable_http_error(self, error: Exception) -> bool:\n  321 |         if isinstance(error, HTTPError):\n  322 |             return self._should_retry_status(error.code)\n  323 |         return False","lines":45,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/http/http_client.py#L279-L323"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In handle_node_moving_notification, when proactive_reconnect is True but notification.new_node_host is None, a threading.Timer fires run_proactive_reconnect after ttl/2 (lines 824-828). At that point the connection host was never updated (the 'host' kwarg is only added when new_node_host is not None, lines 838-846), so the reconnect targets the same old address. If the timer thread runs after the maintenance window has already been reverted by handle_node_moved_notification (scheduled at ttl, but ttl/2 < ttl so it fires first - ordering is fine), there is still no check that the moving notification is still the current one before reconnecting, so a superseded notification's delayed timer can disconnect connections that have since been re-pointed by a newer MOVING notification.","fix":"In the delayed run_proactive_reconnect path, re-check that the pool's current maintenance_notification_hash still matches this notification before disconnecting/marking connections.","locations":[{"ref":"redis/maint_notifications.py:902-910","code":"  902 |                 if self.config.proactive_reconnect:\n  903 |                     if notification.new_node_host is not None:\n  904 |                         self.run_proactive_reconnect(moving_address_src)\n  905 |                     else:\n  906 |                         threading.Timer(\n  907 |                             notification.ttl / 2,\n  908 |                             self.run_proactive_reconnect,\n  909 |                             args=(moving_address_src,),\n  910 |                         ).start()","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/maint_notifications.py#L902-L910"},{"ref":"redis/maint_notifications.py:935-952","code":"  935 |     def run_proactive_reconnect(self, moving_address_src: Optional[str] = None):\n  936 |         \"\"\"\n  937 |         Run proactive reconnect for the pool.\n  938 |         Active connections are marked for reconnect after they complete the current command.\n  939 |         Inactive connections are disconnected and will be connected on next use.\n  940 |         \"\"\"\n  941 |         with self._lock:\n  942 |             with self.pool._lock:\n  943 |                 # take care for the active connections in the pool\n  944 |                 # mark them for reconnect after they complete the current command\n  945 |                 self.pool.update_active_connections_for_reconnect(\n  946 |                     moving_address_src=moving_address_src,\n  947 |                 )\n  948 |                 # take care for the inactive connections in the pool\n  949 |                 # delete them and create new ones\n  950 |                 self.pool.disconnect_free_connections(\n  951 |                     moving_address_src=moving_address_src,\n  952 |                 )","lines":18,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/maint_notifications.py#L935-L952"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"DefaultFailoverStrategyExecutor._next_attempt_ts typed/initialized as int but assigned float time.time() values, and the delay accumulation can drift. self._next_attempt_ts is annotated int and initialized 0, but execute() assigns time.time() + failover_delay (float). More importantly, on the first NoValidDatabaseException it sets _next_attempt_ts and increments the counter, but the counter is only incremented again once time crosses _next_attempt_ts; with many rapid retries between intervals the counter stays low, so the effective time to exhaust failover_attempts is roughly failover_attempts * failover_delay regardless of retry frequency. The annotation is misleading and the timing semantics are subtle/undocumented.","fix":"Annotate _next_attempt_ts as float; document that failover exhaustion is time-based (attempts * delay), not retry-count based, to avoid confusion.","locations":[{"ref":"redis/multidb/failover.py:86-121","code":"   86 |         self._next_attempt_ts: int = 0\n   87 |         self._failover_counter: int = 0\n   88 | \n   89 |     @property\n   90 |     def failover_attempts(self) -> int:\n   91 |         return self._failover_attempts\n   92 | \n   93 |     @property\n   94 |     def failover_delay(self) -> float:\n   95 |         return self._failover_delay\n   96 | \n   97 |     @property\n   98 |     def strategy(self) -> FailoverStrategy:\n   99 |         return self._strategy\n  100 | \n  101 |     def execute(self) -> SyncDatabase:\n  102 |         try:\n  103 |             database = self._strategy.database()\n  104 |             self._reset()\n  105 |             return database\n  106 |         except NoValidDatabaseException as e:\n  107 |             if self._next_attempt_ts == 0:\n  108 |                 self._next_attempt_ts = time.time() + self._failover_delay\n  109 |                 self._failover_counter += 1\n  110 |             elif time.time() >= self._next_attempt_ts:\n  111 |                 self._next_attempt_ts += self._failover_delay\n  112 |                 self._failover_counter += 1\n  113 | \n  114 |             if self._failover_counter > self._failover_attempts:\n  115 |                 self._reset()\n  116 |                 raise e\n  117 |             else:\n  118 |                 raise TemporaryUnavailableException(\n  119 |                     \"No database connections currently available. \"\n  120 |                     \"This is a temporary condition - please retry the operation.\"\n  121 |                 )","lines":36,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/failover.py#L86-L121"},{"ref":"redis/asyncio/multidb/failover.py:86-121","code":"   86 |         self._next_attempt_ts: int = 0\n   87 |         self._failover_counter: int = 0\n   88 | \n   89 |     @property\n   90 |     def failover_attempts(self) -> int:\n   91 |         return self._failover_attempts\n   92 | \n   93 |     @property\n   94 |     def failover_delay(self) -> float:\n   95 |         return self._failover_delay\n   96 | \n   97 |     @property\n   98 |     def strategy(self) -> AsyncFailoverStrategy:\n   99 |         return self._strategy\n  100 | \n  101 |     async def execute(self) -> AsyncDatabase:\n  102 |         try:\n  103 |             database = await self._strategy.database()\n  104 |             self._reset()\n  105 |             return database\n  106 |         except NoValidDatabaseException as e:\n  107 |             if self._next_attempt_ts == 0:\n  108 |                 self._next_attempt_ts = time.time() + self._failover_delay\n  109 |                 self._failover_counter += 1\n  110 |             elif time.time() >= self._next_attempt_ts:\n  111 |                 self._next_attempt_ts += self._failover_delay\n  112 |                 self._failover_counter += 1\n  113 | \n  114 |             if self._failover_counter > self._failover_attempts:\n  115 |                 self._reset()\n  116 |                 raise e\n  117 |             else:\n  118 |                 raise TemporaryUnavailableException(\n  119 |                     \"No database connections currently available. \"\n  120 |                     \"This is a temporary condition - please retry the operation.\"\n  121 |                 )","lines":36,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/failover.py#L86-L121"}]},
{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AttributeBuilder.build_error_attributes accesses error_type.status_code and error_type.error_type via hasattr. error_type is typed as Exception; arbitrary exceptions having a 'status_code'/'error_type' attribute is incidental. hasattr swallows any exception raised by a property getter on the exception object (in 3.x hasattr only catches AttributeError, so a property that raises another exception would propagate) - low risk but the attribute probing is brittle and would mislabel unrelated exceptions that happen to expose these attribute names.","fix":"Probe a known redis exception base type / explicit interface instead of duck-typing arbitrary attribute names on Exception.","locations":[{"ref":"redis/observability/attributes.py:232-246","code":"  232 |         if error_type is not None:\n  233 |             attrs[ERROR_TYPE] = error_type.__class__.__name__\n  234 | \n  235 |             if (\n  236 |                 hasattr(error_type, \"status_code\")\n  237 |                 and error_type.status_code is not None\n  238 |             ):\n  239 |                 attrs[DB_RESPONSE_STATUS_CODE] = error_type.status_code\n  240 |             else:\n  241 |                 attrs[DB_RESPONSE_STATUS_CODE] = \"error\"\n  242 | \n  243 |             if hasattr(error_type, \"error_type\") and error_type.error_type is not None:\n  244 |                 attrs[REDIS_CLIENT_ERROR_CATEGORY] = error_type.error_type.value\n  245 |             else:\n  246 |                 attrs[REDIS_CLIENT_ERROR_CATEGORY] = \"other\"","lines":15,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/observability/attributes.py#L232-L246"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"OTelConfig uses mutable default argument evaluation: buckets_operation_duration=default_operation_duration_buckets() and the histogram buckets default are evaluated ONCE at function-definition time. Since the helpers return fresh lists each call this avoids shared-mutable-default aliasing of the SAME list across instances only because a new list is produced per def-evaluation - but all OTelConfig instances that omit the argument share the identical list object. If any code mutates config.buckets_operation_duration in place, it mutates the shared default for all instances. Idiomatic Python would default to None and build inside __init__.","fix":"Default the bucket parameters to None and assign 'self.buckets_x = buckets_x if buckets_x is not None else default_...()' inside __init__.","locations":[{"ref":"redis/observability/config.py:118-125","code":"  118 |         buckets_operation_duration: Sequence[\n  119 |             float\n  120 |         ] = default_operation_duration_buckets(),\n  121 |         buckets_stream_processing_duration: Sequence[\n  122 |             float\n  123 |         ] = default_histogram_buckets(),\n  124 |         buckets_connection_create_time: Sequence[float] = default_histogram_buckets(),\n  125 |         buckets_connection_wait_time: Sequence[float] = default_histogram_buckets(),","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/observability/config.py#L118-L125"}]},
{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"OCSP _check_certificate checks `if ocsp_response.this_update >= datetime.datetime.now(): raise 'issued in the future'`. Using >= rejects a response whose this_update is exactly the current instant (vanishingly rare but logically wrong) and, more importantly, datetime.datetime.now() returns naive local time while OCSP this_update/next_update are UTC. Comparing a UTC timestamp against local now() will be off by the local UTC offset, incorrectly accepting or rejecting responses depending on timezone.","fix":"Compare against datetime.datetime.now(datetime.timezone.utc) (and make this_update/next_update timezone-aware), and use > rather than >= for the future check.","locations":[{"ref":"redis/ocsp.py:68-75","code":"   68 |     if ocsp_response.this_update >= datetime.datetime.now():\n   69 |         raise ConnectionError(\"ocsp certificate was issued in the future\")\n   70 | \n   71 |     if (\n   72 |         ocsp_response.next_update\n   73 |         and ocsp_response.next_update < datetime.datetime.now()\n   74 |     ):\n   75 |         raise ConnectionError(\"ocsp certificate has invalid update - in the past\")","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/ocsp.py#L68-L75"}]},
{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"compare_versions returns -1 when version1 > version2 and 1 when version1 < version2, which is the inverse of the conventional comparator contract (and of Python's __lt__/sort expectations). The docstring documents this inverted behavior, but any caller assuming standard cmp semantics (negative => first is smaller) will get reversed results. This is a footgun used across the codebase.","fix":"Either rename/redocument prominently, or invert the return values to match the conventional contract (-1 when version1 < version2).","locations":[{"ref":"redis/utils.py:319-346","code":"  319 | def compare_versions(version1: str, version2: str) -> int:\n  320 |     \"\"\"\n  321 |     Compare two versions.\n  322 | \n  323 |     :return: -1 if version1 > version2\n  324 |              0 if both versions are equal\n  325 |              1 if version1 < version2\n  326 |     \"\"\"\n  327 | \n  328 |     num_versions1 = list(map(int, version1.split(\".\")))\n  329 |     num_versions2 = list(map(int, version2.split(\".\")))\n  330 | \n  331 |     if len(num_versions1) > len(num_versions2):\n  332 |         diff = len(num_versions1) - len(num_versions2)\n  333 |         for _ in range(diff):\n  334 |             num_versions2.append(0)\n  335 |     elif len(num_versions1) < len(num_versions2):\n  336 |         diff = len(num_versions2) - len(num_versions1)\n  337 |         for _ in range(diff):\n  338 |             num_versions1.append(0)\n  339 | \n  340 |     for i, ver in enumerate(num_versions1):\n  341 |         if num_versions1[i] > num_versions2[i]:\n  342 |             return -1\n  343 |         elif num_versions1[i] < num_versions2[i]:\n  344 |             return 1\n  345 | \n  346 |     return 0","lines":28,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/utils.py#L319-L346"}]},
{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`_score_to_resp2_bytes` uses `format(float(value), '.17g')` to re-encode scores to the bytes form Redis sends on RESP2. Redis actually formats doubles with up to 17 significant digits via `%.17Lg` on long double in some paths, but more importantly integer-valued scores on the RESP2 wire are sent without a decimal/exponent (e.g. b'3') whereas float(3) formatted with '.17g' yields b'3'. However for special values float('inf') formats to 'inf' which matches Redis, but float('nan') -> 'nan'. This re-encoding is best-effort and can produce a byte string that differs from what the actual RESP2 wire would carry for certain magnitudes, so a custom score_cast_func relying on exact wire bytes may observe a slightly different input under legacy-on-RESP3 than on a true RESP2 connection.","fix":"Document the approximation, or reuse the same formatting Redis uses; for parity-critical casts prefer passing through float() consistently.","locations":[{"ref":"redis/_parsers/helpers.py:428-440","code":"  428 | def _score_to_resp2_bytes(value):\n  429 |     \"\"\"Re-encode a score back to the bytes form Redis returns on the RESP2\n  430 |     wire so that custom ``score_cast_func`` callables observe the same\n  431 |     input type they would receive on a RESP2 connection when the wire\n  432 |     protocol is RESP3 but legacy response shapes are requested.\n  433 |     \"\"\"\n  434 |     if isinstance(value, bytes):\n  435 |         return value\n  436 |     if isinstance(value, str):\n  437 |         return value.encode()\n  438 |     if isinstance(value, bool):\n  439 |         return b\"1\" if value else b\"0\"\n  440 |     return format(float(value), \".17g\").encode()","lines":13,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/helpers.py#L428-L440"}]},
{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"object() forwards `infotype=infotype` into execute_command as an option in addition to the positional infotype argument. This duplicate passing relies on the response callback consuming the 'infotype' option; it is fragile and undocumented why the value is sent both positionally and as a kwarg.","fix":"Confirm the callback genuinely needs the infotype option; if not, drop the redundant kwarg.","locations":[{"ref":"redis/commands/core.py:1859-1865","code":" 1859 |     def object(self, infotype: str, key: KeyT, **kwargs) -> Any | Awaitable[Any]:\n 1860 |         \"\"\"\n 1861 |         Return the encoding, idletime, or refcount about the key\n 1862 |         \"\"\"\n 1863 |         return self.execute_command(\n 1864 |             \"OBJECT\", infotype, key, infotype=infotype, **kwargs\n 1865 |         )","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L1859-L1865"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"UnixDomainSocketConnection._connect() calls `await self.on_connect()` at the end, but on_connect is ALSO invoked by connect_check_health() right after _connect() returns (it calls on_connect_check_health() at the bottom of the socket-connect block). This means every Unix-domain-socket connection runs the full handshake (HELLO/AUTH/CLIENT SETNAME/SETINFO/SELECT) TWICE on connect, doubling startup round-trips and potentially desynchronizing the request/response stream (extra unread responses left on the socket). The sync mirror's UnixDomainSocketConnection._connect() does NOT call on_connect() (see redis/connection.py:2198-2213) - the async copy diverged. The TCP Connection._connect() (line 971) correctly does not call on_connect().","fix":"Remove the `await self.on_connect()` call from UnixDomainSocketConnection._connect(); the handshake is performed by connect_check_health() after _connect() returns, matching the TCP connection and the sync mirror.","locations":[{"ref":"redis/asyncio/connection.py:1808-1813","code":" 1808 |     async def _connect(self):\n 1809 |         async with async_timeout(self.socket_connect_timeout):\n 1810 |             reader, writer = await asyncio.open_unix_connection(path=self.path)\n 1811 |         self._reader = reader\n 1812 |         self._writer = writer\n 1813 |         await self.on_connect()","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/connection.py#L1808-L1813"},{"ref":"redis/asyncio/connection.py:969-972","code":"  969 |         try:\n  970 |             if not self.redis_connect_func:\n  971 |                 # Use the default on_connect function\n  972 |                 await self.on_connect_check_health(check_health=check_health)","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/connection.py#L969-L972"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"medium","description":"Async CloseConnectionOnActiveDatabaseChanged does not disconnect cluster connection pools, unlike the sync version. The sync listener (event.py) handles both standalone Redis and RedisCluster: for clusters it iterates nodes_manager.nodes_cache and calls update_active_connections_for_reconnect()/disconnect() on each node's pool. The async listener only handles the standalone Redis branch (isinstance check) and has no else branch for clusters, so when the active database is a RedisCluster and failover occurs, the old cluster's per-node connection pools are never marked for reconnect/disconnected. This is both a resource leak (lingering connections to the failed cluster) and a behavioral divergence from sync.","fix":"Mirror the sync else-branch in the async listener: for RedisCluster, iterate event.old_database.client.nodes_manager.nodes_cache.values() and await each node.redis_connection.connection_pool.update_active_connections_for_reconnect() / disconnect().","locations":[{"ref":"redis/asyncio/multidb/event.py:61-71","code":"   61 | class CloseConnectionOnActiveDatabaseChanged(AsyncEventListenerInterface):\n   62 |     \"\"\"\n   63 |     Close connection to the old active database.\n   64 |     \"\"\"\n   65 | \n   66 |     async def listen(self, event: AsyncActiveDatabaseChanged):\n   67 |         await event.old_database.client.aclose()\n   68 | \n   69 |         if isinstance(event.old_database.client, Redis):\n   70 |             await event.old_database.client.connection_pool.update_active_connections_for_reconnect()\n   71 |             await event.old_database.client.connection_pool.disconnect()","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/event.py#L61-L71"},{"ref":"redis/multidb/event.py:62-76","code":"   62 | class CloseConnectionOnActiveDatabaseChanged(EventListenerInterface):\n   63 |     \"\"\"\n   64 |     Close connection to the old active database.\n   65 |     \"\"\"\n   66 | \n   67 |     def listen(self, event: ActiveDatabaseChanged):\n   68 |         event.old_database.client.close()\n   69 | \n   70 |         if isinstance(event.old_database.client, Redis):\n   71 |             event.old_database.client.connection_pool.update_active_connections_for_reconnect()\n   72 |             event.old_database.client.connection_pool.disconnect()\n   73 |         else:\n   74 |             for node in event.old_database.client.nodes_manager.nodes_cache.values():\n   75 |                 node.redis_connection.connection_pool.update_active_connections_for_reconnect()\n   76 |                 node.redis_connection.connection_pool.disconnect()","lines":15,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/event.py#L62-L76"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"The async recorder.record_pubsub_message normalizes bytes channels to str (str_if_bytes) only in the else branch (when hide is disabled), while the sync recorder.record_pubsub_message does NOT normalize bytes at all. So sync metrics may carry raw bytes channel names as OTel attributes (invalid attribute type), and the two stacks behave differently for the same input - a copy-paste divergence between the sync and async mirrors.","fix":"Apply str_if_bytes consistently in both recorders for the channel name regardless of the hide flag, matching behavior across the sync/async mirror.","locations":[{"ref":"redis/observability/recorder.py:476-490","code":"  476 |     # Check if channel names should be hidden\n  477 |     effective_channel = channel\n  478 |     if channel is not None:\n  479 |         config = _get_config()\n  480 |         if config is not None and config.hide_pubsub_channel_names:\n  481 |             effective_channel = None\n  482 | \n  483 |     try:\n  484 |         _metrics_collector.record_pubsub_message(\n  485 |             direction=direction,\n  486 |             channel=effective_channel,\n  487 |             sharded=sharded,\n  488 |         )\n  489 |     except Exception:\n  490 |         pass","lines":15,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/observability/recorder.py#L476-L490"},{"ref":"redis/asyncio/observability/recorder.py:437-454","code":"  437 |     # Check if channel names should be hidden\n  438 |     effective_channel = channel\n  439 |     if channel is not None:\n  440 |         config = await _get_config()\n  441 |         if config is not None and config.hide_pubsub_channel_names:\n  442 |             effective_channel = None\n  443 |         else:\n  444 |             # Normalize bytes to str for OTel attributes\n  445 |             effective_channel = str_if_bytes(channel)\n  446 | \n  447 |     try:\n  448 |         collector.record_pubsub_message(\n  449 |             direction=direction,\n  450 |             channel=effective_channel,\n  451 |             sharded=sharded,\n  452 |         )\n  453 |     except Exception:\n  454 |         pass","lines":18,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/observability/recorder.py#L437-L454"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"In async `handle_push_response`, `msg_type` is decoded from bytes twice: once at the top (lines 422-423) and again redundantly inside the try block (lines 440-441 `if isinstance(msg_type, bytes): msg_type = msg_type.decode()`). The second decode is dead since msg_type is already a str by then. The sync `handle_push_response` does not have this duplicate, confirming it is a copy/paste leftover.","fix":"Remove the redundant second isinstance/decode block in the async handler.","locations":[{"ref":"redis/_parsers/base.py:437-438","code":"  437 |         if isinstance(msg_type, bytes):\n  438 |             msg_type = msg_type.decode()","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/base.py#L437-L438"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"The async Lock.acquire() lost the `sleep` keyword argument that the sync Lock.acquire() supports (sync signature: acquire(self, sleep=None, blocking=None, blocking_timeout=None, token=None)). In the async version `sleep` is hard-bound to `self.sleep` and cannot be overridden per-call. This is an API divergence between the two parallel stacks that must stay in lockstep, and breaks code that passes `sleep=` to acquire().","fix":"Add a `sleep: Optional[Number] = None` parameter to the async acquire() and set `sleep = self.sleep if sleep is None else sleep` at the top, mirroring the sync implementation.","locations":[{"ref":"redis/asyncio/lock.py:185-232","code":"  185 |     async def acquire(\n  186 |         self,\n  187 |         blocking: Optional[bool] = None,\n  188 |         blocking_timeout: Optional[Number] = None,\n  189 |         token: Optional[Union[str, bytes]] = None,\n  190 |     ):\n  191 |         \"\"\"\n  192 |         Use Redis to hold a shared, distributed lock named ``name``.\n  193 |         Returns True once the lock is acquired.\n  194 | \n  195 |         If ``blocking`` is False, always return immediately. If the lock\n  196 |         was acquired, return True, otherwise return False.\n  197 | \n  198 |         ``blocking_timeout`` specifies the maximum number of seconds to\n  199 |         wait trying to acquire the lock.\n  200 | \n  201 |         ``token`` specifies the token value to be used. If provided, token\n  202 |         must be a bytes object or a string that can be encoded to a bytes\n  203 |         object with the default encoding. If a token isn't specified, a UUID\n  204 |         will be generated.\n  205 |         \"\"\"\n  206 |         sleep = self.sleep\n  207 |         if token is None:\n  208 |             token = uuid.uuid1().hex.encode()\n  209 |         else:\n  210 |             try:\n  211 |                 encoder = self.redis.connection_pool.get_encoder()\n  212 |             except AttributeError:\n  213 |                 # Cluster\n  214 |                 encoder = self.redis.get_encoder()\n  215 |             token = encoder.encode(token)\n  216 |         if blocking is None:\n  217 |             blocking = self.blocking\n  218 |         if blocking_timeout is None:\n  219 |             blocking_timeout = self.blocking_timeout\n  220 |         stop_trying_at = None\n  221 |         if blocking_timeout is not None:\n  222 |             stop_trying_at = asyncio.get_running_loop().time() + blocking_timeout\n  223 |         while True:\n  224 |             if await self.do_acquire(token):\n  225 |                 self.local.token = token\n  226 |                 return True\n  227 |             if not blocking:\n  228 |                 return False\n  229 |             next_try_at = asyncio.get_running_loop().time() + sleep\n  230 |             if stop_trying_at is not None and next_try_at > stop_trying_at:\n  231 |                 return False\n  232 |             await asyncio.sleep(sleep)","lines":48,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/lock.py#L185-L232"},{"ref":"redis/lock.py:190-235","code":"  190 |     def acquire(\n  191 |         self,\n  192 |         sleep: Optional[Number] = None,\n  193 |         blocking: Optional[bool] = None,\n  194 |         blocking_timeout: Optional[Number] = None,\n  195 |         token: Optional[str] = None,\n  196 |     ):\n  197 |         \"\"\"\n  198 |         Use Redis to hold a shared, distributed lock named ``name``.\n  199 |         Returns True once the lock is acquired.\n  200 | \n  201 |         If ``blocking`` is False, always return immediately. If the lock\n  202 |         was acquired, return True, otherwise return False.\n  203 | \n  204 |         ``blocking_timeout`` specifies the maximum number of seconds to\n  205 |         wait trying to acquire the lock.\n  206 | \n  207 |         ``token`` specifies the token value to be used. If provided, token\n  208 |         must be a bytes object or a string that can be encoded to a bytes\n  209 |         object with the default encoding. If a token isn't specified, a UUID\n  210 |         will be generated.\n  211 |         \"\"\"\n  212 |         if sleep is None:\n  213 |             sleep = self.sleep\n  214 |         if token is None:\n  215 |             token = uuid.uuid1().hex.encode()\n  216 |         else:\n  217 |             encoder = self.redis.get_encoder()\n  218 |             token = encoder.encode(token)\n  219 |         if blocking is None:\n  220 |             blocking = self.blocking\n  221 |         if blocking_timeout is None:\n  222 |             blocking_timeout = self.blocking_timeout\n  223 |         stop_trying_at = None\n  224 |         if blocking_timeout is not None:\n  225 |             stop_trying_at = mod_time.monotonic() + blocking_timeout\n  226 |         while True:\n  227 |             if self.do_acquire(token):\n  228 |                 self.local.token = token\n  229 |                 return True\n  230 |             if not blocking:\n  231 |                 return False\n  232 |             next_try_at = mod_time.monotonic() + sleep\n  233 |             if stop_trying_at is not None and next_try_at > stop_trying_at:\n  234 |                 return False\n  235 |             mod_time.sleep(sleep)","lines":46,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/lock.py#L190-L235"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The async Lock raises LockError/LockNotOwnedError without the `lock_name` keyword that the sync mirror passes everywhere. Sync release() (LockError), do_release(), extend()/do_extend(), reacquire()/do_reacquire() all pass `lock_name=self.name`; the async equivalents omit it in most places (only async release() passes it). Callers inspecting exception.lock_name will get None from the async client, diverging from sync behavior.","fix":"Add `lock_name=self.name` to every LockError and LockNotOwnedError constructed in the async lock, matching redis/lock.py.","locations":[{"ref":"redis/asyncio/lock.py:299","code":"  299 |             raise LockNotOwnedError(\"Cannot release a lock that's no longer owned\")","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/lock.py#L299"},{"ref":"redis/asyncio/lock.py:315-317","code":"  315 |             raise LockError(\"Cannot extend an unlocked lock\")\n  316 |         if self.timeout is None:\n  317 |             raise LockError(\"Cannot extend a lock with no timeout\")","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/lock.py#L315-L317"},{"ref":"redis/asyncio/lock.py:329","code":"  329 |             raise LockNotOwnedError(\"Cannot extend a lock that's no longer owned\")","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/lock.py#L329"},{"ref":"redis/asyncio/lock.py:336-339","code":"  336 |         if self.local.token is None:\n  337 |             raise LockError(\"Cannot reacquire an unlocked lock\")\n  338 |         if self.timeout is None:\n  339 |             raise LockError(\"Cannot reacquire a lock with no timeout\")","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/lock.py#L336-L339"},{"ref":"redis/asyncio/lock.py:349","code":"  349 |             raise LockNotOwnedError(\"Cannot reacquire a lock that's no longer owned\")","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/lock.py#L349"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"zmpop omits the COUNT clause when count == 1 (`if count != 1: args.extend(['COUNT', count])`), while its blocking sibling bzmpop always appends `['COUNT', count]` unconditionally. Same divergence exists between lmpop (skips COUNT when count == 1) and blmpop (always sends COUNT). The behavior is harmless when count is the server default of 1, but if a caller explicitly passes count=1 the wire command differs between the blocking and non-blocking variants, and any future change to the server default of 1 would silently desync. These near-identical command builders should be consistent.","fix":"Make the COUNT handling identical across the blocking/non-blocking pairs (either always send COUNT or never send it for the default).","locations":[{"ref":"redis/commands/core.py:8755-8756","code":" 8755 |         if count != 1:\n 8756 |             args.extend([\"COUNT\", count])","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L8755-L8756"},{"ref":"redis/commands/core.py:8756","code":" 8756 |             args.extend([\"COUNT\", count])","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L8756"},{"ref":"redis/commands/core.py:4994-4996","code":" 4994 |         cmd_args = [num_keys] + list(args) + [direction]\n 4995 |         if count != 1:\n 4996 |             cmd_args.extend([\"COUNT\", count])","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L4994-L4996"},{"ref":"redis/commands/core.py:4959","code":" 4959 |         cmd_args = [timeout, numkeys, *args, direction, \"COUNT\", count]","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L4959"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"Sync client.py imports HealthCheck/HealthCheckPolicy from the ASYNC healthcheck module. The synchronous MultiDBClient imports 'from redis.asyncio.multidb.healthcheck import HealthCheck, HealthCheckPolicy', and config.py (sync) imports its health-check defaults from redis.asyncio.multidb.healthcheck as well. The sync stack therefore has no sync-native health check module and drives async health-check coroutines through BackgroundScheduler. While functional, this couples the sync client to the asyncio package and is an architectural smell / divergence from the documented 'parallel sync and async stacks' design; it also means installing/using the sync client always pulls in the async http client wrapper.","fix":"Either document this intentional reuse explicitly, or provide a sync-native health check module mirroring the async one to keep the stacks decoupled as the rest of the library does.","locations":[{"ref":"redis/multidb/client.py:6","code":"    6 | from redis.asyncio.multidb.healthcheck import HealthCheck, HealthCheckPolicy","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/client.py#L6"},{"ref":"redis/multidb/config.py:9-18","code":"    9 | from redis.asyncio.multidb.healthcheck import (\n   10 |     DEFAULT_HEALTH_CHECK_DELAY,\n   11 |     DEFAULT_HEALTH_CHECK_INTERVAL,\n   12 |     DEFAULT_HEALTH_CHECK_POLICY,\n   13 |     DEFAULT_HEALTH_CHECK_PROBES,\n   14 |     DEFAULT_HEALTH_CHECK_TIMEOUT,\n   15 |     HealthCheck,\n   16 |     HealthCheckPolicies,\n   17 |     PingHealthCheck,\n   18 | )","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/config.py#L9-L18"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"medium","description":"Async SentinelManagedConnection.__repr__ diverges from the sync mirror and is also malformed: it builds `s = '<module.Class'`, optionally appends `,host=..,port=..`, then returns `s + ')>'` - producing '<module.Class,host=h,port=p)>' with an unmatched closing paren and no '(' opener, unlike the sync repr which produces '<module.Class(service=svc,host=..,port=..)>'. The service name (available via self.connection_pool) is dropped entirely.","fix":"Mirror the sync __repr__: include the service name and balanced parentheses, e.g. f'<{module}.{name}(service={pool.service_name},host={host},port={port})>'.","locations":[{"ref":"redis/asyncio/sentinel.py:38-43","code":"   38 |     def __repr__(self):\n   39 |         s = f\"<{self.__class__.__module__}.{self.__class__.__name__}\"\n   40 |         if self.host:\n   41 |             host_info = f\",host={self.host},port={self.port}\"\n   42 |             s += host_info\n   43 |         return s + \")>\"","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/sentinel.py#L38-L43"},{"ref":"redis/sentinel.py:33-42","code":"   33 |     def __repr__(self):\n   34 |         pool = self.connection_pool\n   35 |         s = (\n   36 |             f\"<{type(self).__module__}.{type(self).__name__}\"\n   37 |             f\"(service={pool.service_name}%s)>\"\n   38 |         )\n   39 |         if self.host:\n   40 |             host_info = f\",host={self.host},port={self.port}\"\n   41 |             s = s % host_info\n   42 |         return s","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/sentinel.py#L33-L42"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"easy","description":"The async `AsyncSearchCommands.aggregate` type hint annotates `query` as `Union[AggregateResult, Cursor]`, but the parameter must be an `AggregateRequest` (or `Cursor`) - `AggregateResult` is the return type, not an accepted input. The sync `SearchCommands.aggregate` correctly uses `Union[AggregateRequest, Cursor]`. Misleading type hint copied incorrectly.","fix":"Change the async annotation to `Union[AggregateRequest, Cursor]` to match the sync signature and actual handling.","locations":[{"ref":"redis/commands/search/commands.py:1949-1952","code":" 1949 |     async def aggregate(\n 1950 |         self,\n 1951 |         query: Union[AggregateResult, Cursor],\n 1952 |         query_params: Optional[Dict[str, Union[str, int, float, bytes]]] = None,","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/commands.py#L1949-L1952"},{"ref":"redis/commands/search/commands.py:1425-1428","code":" 1425 |     def aggregate(\n 1426 |         self,\n 1427 |         query: Union[AggregateRequest, Cursor],\n 1428 |         query_params: Optional[Dict[str, Union[str, int, float, bytes]]] = None,","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/commands.py#L1425-L1428"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Redis.execute_command() catches `except Exception` (line 856) to record error metrics and re-raise, but asyncio.CancelledError is a BaseException (Python 3.8+), so a cancellation during call_with_retry is NOT recorded - acceptable - yet the broader concern is the metrics path: record_error_count itself is awaited inside the except handler. If the task is cancelled while awaiting record_error_count, the original exception is replaced by CancelledError and lost. The same pattern is repeated in PubSub._execute (1217-1227), Pipeline.immediate_execute_command (1841-1851) and Pipeline.execute (2094-2104).","fix":"Guard the awaited record_error_count() in these handlers (e.g. shield it or wrap in try/except so a cancellation during metric recording does not swallow/replace the in-flight RedisError) before re-raising.","locations":[{"ref":"redis/asyncio/client.py:993-1003","code":"  993 |         except Exception as e:\n  994 |             await record_error_count(\n  995 |                 server_address=getattr(conn, \"host\", None),\n  996 |                 server_port=getattr(conn, \"port\", None),\n  997 |                 network_peer_address=getattr(conn, \"host\", None),\n  998 |                 network_peer_port=getattr(conn, \"port\", None),\n  999 |                 error_type=e,\n 1000 |                 retry_attempts=actual_retry_attempts,\n 1001 |                 is_internal=False,\n 1002 |             )\n 1003 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/client.py#L993-L1003"},{"ref":"redis/asyncio/client.py:1403-1413","code":" 1403 |         except Exception as e:\n 1404 |             await record_error_count(\n 1405 |                 server_address=getattr(conn, \"host\", None),\n 1406 |                 server_port=getattr(conn, \"port\", None),\n 1407 |                 network_peer_address=getattr(conn, \"host\", None),\n 1408 |                 network_peer_port=getattr(conn, \"port\", None),\n 1409 |                 error_type=e,\n 1410 |                 retry_attempts=actual_retry_attempts,\n 1411 |                 is_internal=False,\n 1412 |             )\n 1413 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/client.py#L1403-L1413"},{"ref":"redis/asyncio/client.py:2038-2048","code":" 2038 |         except Exception as e:\n 2039 |             await record_error_count(\n 2040 |                 server_address=getattr(conn, \"host\", None),\n 2041 |                 server_port=getattr(conn, \"port\", None),\n 2042 |                 network_peer_address=getattr(conn, \"host\", None),\n 2043 |                 network_peer_port=getattr(conn, \"port\", None),\n 2044 |                 error_type=e,\n 2045 |                 retry_attempts=actual_retry_attempts,\n 2046 |                 is_internal=False,\n 2047 |             )\n 2048 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/client.py#L2038-L2048"},{"ref":"redis/asyncio/client.py:2038-2048","code":" 2038 |         except Exception as e:\n 2039 |             await record_error_count(\n 2040 |                 server_address=getattr(conn, \"host\", None),\n 2041 |                 server_port=getattr(conn, \"port\", None),\n 2042 |                 network_peer_address=getattr(conn, \"host\", None),\n 2043 |                 network_peer_port=getattr(conn, \"port\", None),\n 2044 |                 error_type=e,\n 2045 |                 retry_attempts=actual_retry_attempts,\n 2046 |                 is_internal=False,\n 2047 |             )\n 2048 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/c
