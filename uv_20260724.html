ample.com/` and a more specific one at `https://example.com/private/`), a request to `https://example.com/private/pkg` matches both `Index` entries, but `find` returns whichever one happens to come first in the hash set's bucket order rather than the longest (most specific) matching prefix. Since `find_prefix_index` backs both `index_for` (used to select the per-index credentials cache key) and `auth_policy_for` (used to decide whether authentication is required/forbidden for a URL), an unrelated, less-specific index's `AuthPolicy` and credentials scope can be applied to a request that was actually meant for the more specific nested index, with no way for the caller to control which one wins.","fix":"Select the index with the longest matching `root_url.path()` instead of the first match, e.g.:\n```rust\nfn find_prefix_index(&self, url: &Url) -> Option<&Index> {\n    self.0\n        .iter()\n        .filter(|index| index.is_prefix_for(url))\n        .max_by_key(|index| index.root_url.path().len())\n}\n```","locations":[{"ref":"crates/uv-auth/src/index.rs:97-129","code":"   97 | #[derive(Debug, Default, Clone, Eq, PartialEq)]\n   98 | pub struct Indexes(FxHashSet<Index>);\n   99 | \n  100 | impl Indexes {\n  101 |     pub fn new() -> Self {\n  102 |         Self(FxHashSet::default())\n  103 |     }\n  104 | \n  105 |     /// Create a new [`Indexes`] instance from an iterator of [`Index`]s.\n  106 |     pub fn from_indexes(urls: impl IntoIterator<Item = Index>) -> Self {\n  107 |         let mut index_urls = Self::new();\n  108 |         for url in urls {\n  109 |             index_urls.0.insert(url);\n  110 |         }\n  111 |         index_urls\n  112 |     }\n  113 | \n  114 |     /// Get the index for a URL if one exists.\n  115 |     pub(crate) fn index_for(&self, url: &Url) -> Option<&Index> {\n  116 |         self.find_prefix_index(url)\n  117 |     }\n  118 | \n  119 |     /// Get the [`AuthPolicy`] for a URL.\n  120 |     pub(crate) fn auth_policy_for(&self, url: &Url) -> AuthPolicy {\n  121 |         self.find_prefix_index(url)\n  122 |             .map(|index| index.auth_policy)\n  123 |             .unwrap_or(AuthPolicy::Auto)\n  124 |     }\n  125 | \n  126 |     fn find_prefix_index(&self, url: &Url) -> Option<&Index> {\n  127 |         self.0.iter().find(|&index| index.is_prefix_for(url))\n  128 |     }\n  129 | }","lines":33,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-auth/src/index.rs#L97-L129"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `TextCredentialStore::get_credentials`, the prefix-matching fallback loop (`crates/uv-auth/src/store.rs:362-391`) returns `Err(LookupError::AmbiguousUsername(...))` as soon as it finds two candidate credentials with equal `specificity` (`service.url().path().len()`), without first checking whether a later, strictly more specific candidate exists that would resolve the request unambiguously. Since `self.credentials` is an `FxHashMap`, iteration order is not insertion order, so whether the spurious ambiguity error fires depends on hash-based iteration order. Concretely: if a realm has two credentials tied at the same (less specific) service path (e.g. two different usernames both stored for `/api`) and a third, distinct, more specific credential for `/api/v1` that uniquely matches the request, the function can incorrectly bail out with `AmbiguousUsername` on the `/api` tie before ever reaching the unambiguous `/api/v1` match, purely because of iteration order. This can cause `uv` to spuriously fail to authenticate (or force the user to disambiguate) even though a valid, unique, most-specific credential is available for the request.","fix":"Do not `return` immediately on a tie; instead track the best match and an `ambiguous` flag, clearing the flag whenever a strictly more specific candidate supersedes the current best, and only report `LookupError::AmbiguousUsername` after scanning all candidates if the flag is still set for the final best specificity. For example: ```rust\nlet mut best: Option<(usize, &Credentials)> = None;\nlet mut ambiguous = false;\nfor ((service, stored_username), credential) in &self.credentials {\n    // ...existing realm/prefix/username filtering...\n    let specificity = service.url().path().len();\n    match best {\n        None => { best = Some((specificity, credential)); ambiguous = false; }\n        Some((best_specificity, _)) if specificity > best_specificity => {\n            best = Some((specificity, credential));\n            ambiguous = false;\n        }\n        Some((best_specificity, _)) if specificity == best_specificity => { ambiguous = true; }\n        _ => {}\n    }\n}\nif ambiguous {\n    return Err(LookupError::AmbiguousUsername(url.clone()));\n}\nOk(best.map(|(_, credential)| credential))\n```","locations":[{"ref":"crates/uv-auth/src/store.rs:362-391","code":"  362 |         let mut best: Option<(usize, &Service, &Credentials)> = None;\n  363 | \n  364 |         for ((service, stored_username), credential) in &self.credentials {\n  365 |             let service_realm = Realm::from(service.url().deref());\n  366 | \n  367 |             // Only consider services in the same realm\n  368 |             if service_realm != request_realm {\n  369 |                 continue;\n  370 |             }\n  371 | \n  372 |             // Service path must be a prefix of the request path.\n  373 |             if !is_path_prefix(service.url().path(), url.path()) {\n  374 |                 continue;\n  375 |             }\n  376 | \n  377 |             // If a username is provided, it must match\n  378 |             if let Some(request_username) = username {\n  379 |                 if Some(request_username) != stored_username.as_deref() {\n  380 |                     continue;\n  381 |                 }\n  382 |             }\n  383 | \n  384 |             // Update our best matching credential based on prefix length\n  385 |             let specificity = service.url().path().len();\n  386 |             if best.is_none_or(|(best_specificity, _, _)| specificity > best_specificity) {\n  387 |                 best = Some((specificity, service, credential));\n  388 |             } else if best.is_some_and(|(best_specificity, _, _)| specificity == best_specificity) {\n  389 |                 return Err(LookupError::AmbiguousUsername(url.clone()));\n  390 |             }\n  391 |         }","lines":30,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-auth/src/store.rs#L362-L391"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`TarGzWriter::write_file` in `crates/uv-build-backend/src/source_dist.rs` reads the file's length via `fs_err::metadata(file)?.len()` and immediately calls `header.set_size(metadata.len())`, then separately opens the file again (`File::open(file)?`) and streams its contents into `tokio_tar`'s `append_data`, which trusts the pre-set `header` size to know how many bytes to read from the reader and how much zero-padding to add to reach the 512-byte tar block boundary. If the file is modified (e.g. truncated or shrunk) between the `fs_err::metadata` call and the subsequent read -- for instance by a concurrent build step, a code generator, or another process touching the source tree -- the reader will yield fewer bytes than the declared header size. `append_data` does not re-validate the actual byte count against the declared size, so the tar entry silently ends up truncated/misaligned relative to its own header, corrupting the resulting `.tar.gz` sdist (subsequent entries in the archive become unreadable or contain garbage). This is a real TOCTOU gap: contrast with `ZipDirectoryWriter::write_file` in `crates/uv-build-backend/src/wheel.rs`, which for files under `WHOLE_FILE_ZIP_ENTRY_LIMIT` reads the whole file first and then uses `bytes.len()` (the actually observed length) for both the zip entry and `RECORD`, so no such race exists there.","fix":"Avoid trusting a size obtained before the read. Either read the file into memory first (as `ZipDirectoryWriter::write_file` does for small files) and use the actual buffer length for `header.set_size`, or open the file once, read it fully (or stream while tracking the actual byte count), and only then build/write the header using the observed size, e.g.:\n```rust\nlet mut file = File::open(file)?;\nlet metadata = file.metadata()?;\n// ... compute executable_bit from the already-open file's metadata ...\nlet mut buffer = Vec::with_capacity(metadata.len() as usize);\nfile.read_to_end(&mut buffer)?;\nheader.set_size(buffer.len() as u64);\nblock_on(self.tar.append_data(&mut header, path, SyncReader::new(Cursor::new(buffer))))\n    .map_err(|err| Error::TarWrite(self.path.clone(), err))?;\n```\nThis also removes the redundant second `file.metadata()?` call used only for `executable_bit`.","locations":[{"ref":"crates/uv-build-backend/src/source_dist.rs:485-518","code":"  485 |     fn write_file(&mut self, path: &str, file: &Path) -> Result<(), Error> {\n  486 |         let metadata = fs_err::metadata(file)?;\n  487 |         let mut header = Header::new_gnu();\n  488 |         // Work around bug in Python's std tar module\n  489 |         // https://github.com/python/cpython/issues/141707\n  490 |         // https://github.com/astral-sh/uv/pull/17043#issuecomment-3636841022\n  491 |         header.set_entry_type(EntryType::Regular);\n  492 |         // Preserve the executable bit, especially for scripts\n  493 |         #[cfg(unix)]\n  494 |         let executable_bit = {\n  495 |             use std::os::unix::fs::PermissionsExt;\n  496 |             file.metadata()?.permissions().mode() & 0o111 != 0\n  497 |         };\n  498 |         // Windows has no executable bit\n  499 |         #[cfg(not(unix))]\n  500 |         let executable_bit = false;\n  501 | \n  502 |         // Set reasonable defaults to avoid 0o000 permissions, while avoiding adding the exact\n  503 |         // filesystem permissions to the archive for reproducibility. Where applicable, the\n  504 |         // operating system filters the stored permission by the user's umask when unpacking.\n  505 |         if executable_bit {\n  506 |             header.set_mode(0o755);\n  507 |         } else {\n  508 |             header.set_mode(0o644);\n  509 |         }\n  510 |         header.set_size(metadata.len());\n  511 |         let reader = BufReader::new(File::open(file)?);\n  512 |         block_on(\n  513 |             self.tar\n  514 |                 .append_data(&mut header, path, SyncReader::new(reader)),\n  515 |         )\n  516 |         .map_err(|err| Error::TarWrite(self.path.clone(), err))?;\n  517 |         Ok(())\n  518 |     }","lines":34,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-build-backend/src/source_dist.rs#L485-L518"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`extract_package_name` in `crates/uv-build-frontend/src/error.rs` is documented to strip the version suffix from a `version_id` such as `pygraphviz-1.11` down to just the package name `pygraphviz`, but its `take_while` predicate accepts letters, digits, `.`, `-`, and `_` -- exactly the characters that also appear in the version suffix. For a typical `name-x.y.z` `version_id`, this consumes the entire string, so `extract_package_name` returns the input unchanged instead of stripping the version. This value is then used both as the human-readable name and, via `hint_build_dependency`'s `table_key`, as the literal TOML key suggested in the `[tool.uv.extra-build-dependencies]` hint. The `missing_wheel_package` test snapshot in `crates/uv-build-frontend/src/error.rs` (around line 619) confirms the bug is shipped behavior: it asserts the hint suggests `\"pygraphviz-1.11\" = [\"wheel\"]` instead of the correct `pygraphviz = [\"wheel\"]`. A user who copies this suggested snippet verbatim into their `pyproject.toml` will find it has no effect, because `extra-build-dependencies` is keyed by package name, not by `name-version`.","fix":"Make `extract_package_name` actually stop at the version boundary instead of accepting the same character classes that appear in the version. Since `version_id` is formatted as `<name>-<version>` and PEP 440 versions always start with a digit, split on the last `-` that is immediately followed by a digit, e.g.:\n```rust\nfn extract_package_name(version_id: &str) -> &str {\n    match version_id.rfind('-') {\n        Some(i) if version_id[i + 1..].starts_with(|c: char| c.is_ascii_digit()) => {\n            &version_id[..i]\n        }\n        _ => version_id,\n    }\n}\n```\nThen update the `missing_wheel_package` (and similar) snapshot tests to assert the corrected `pygraphviz = [\"wheel\"]` key.","locations":[{"ref":"crates/uv-build-frontend/src/error.rs:120-137","code":"  120 | /// Extract the package name from a version specifier string.\n  121 | /// Uses PEP 508 naming rules but more lenient for hinting purposes.\n  122 | fn extract_package_name(version_id: &str) -> &str {\n  123 |     // https://peps.python.org/pep-0508/#names\n  124 |     // ^([A-Z0-9]|[A-Z0-9][A-Z0-9._-]*[A-Z0-9])$ with re.IGNORECASE\n  125 |     // Since we're only using this for a hint, we're more lenient than what we would be doing if this was used for parsing\n  126 |     let end = version_id\n  127 |         .char_indices()\n  128 |         .take_while(|(_, char)| matches!(char, 'A'..='Z' | 'a'..='z' | '0'..='9' | '.' | '-' | '_'))\n  129 |         .last()\n  130 |         .map_or(0, |(i, c)| i + c.len_utf8());\n  131 | \n  132 |     if end == 0 {\n  133 |         version_id\n  134 |     } else {\n  135 |         &version_id[..end]\n  136 |     }\n  137 | }","lines":18,"link":"https: tFound => {}\n    Err(err) => return Err(err),\n}\n```ensuring the drop of `lock_file` (to release any held lock) still happens first when `Some`.","locations":[{"ref":"crates/uv-cache/src/lib.rs:521-550","code":"  521 |     /// Clear the cache, removing all entries.\n  522 |     pub fn clear(self, reporter: Box<dyn CleanReporter>) -> Result<Removal, io::Error> {\n  523 |         // Remove everything but `.lock`, Windows does not allow removal of a locked file\n  524 |         let mut removal = Remover::new(reporter).rm_rf(&self.root, true)?;\n  525 |         let Self {\n  526 |             root, lock_file, ..\n  527 |         } = self;\n  528 | \n  529 |         // Remove the `.lock` file, unlocking it first\n  530 |         if let Some(lock) = lock_file {\n  531 |             drop(lock);\n  532 |             fs_err::remove_file(root.join(\".lock\"))?;\n  533 |         }\n  534 |         removal.num_files += 1;\n  535 | \n  536 |         // Remove the root directory\n  537 |         match fs_err::remove_dir(root) {\n  538 |             Ok(()) => {\n  539 |                 removal.num_dirs += 1;\n  540 |             }\n  541 |             // On Windows, when `--force` is used, the `.lock` file can exist and be unremovable,\n  542 |             // so we make this non-fatal\n  543 |             Err(err) if err.kind() == io::ErrorKind::DirectoryNotEmpty => {\n  544 |                 trace!(\"Failed to remove root cache directory: not empty\");\n  545 |             }\n  546 |             Err(err) => return Err(err),\n  547 |         }\n  548 | \n  549 |         Ok(removal)\n  550 |     }","lines":30,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cache/src/lib.rs#L521-L550"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SimpleDetailHTML::parse_project_status` in `crates/uv-client/src/html.rs:145-191` scans all `<meta>` tags in `<head>` to build a PEP 792 `ProjectStatus` (which includes the security-relevant `Quarantined` and `Archived`/`Deprecated` states, see `crates/uv-pypi-types/src/project_status.rs`). At `html.rs:169-180`, if a `pypi:project-status-reason` meta tag is present but is missing its `content` attribute, the code does `return None;` from inside the `for` loop (line 176). Because this is a bare `return` from the whole function (not `continue`), it discards *any* `status` already parsed from an earlier `pypi:project-status` meta tag in the same page and aborts scanning of any later meta tags. The caller (`SimpleDetailHTML::parse`, `html.rs:89-94`) then falls back to `.unwrap_or_default()`, silently reporting `Status::Active` even though the server declared e.g. `archived` or `quarantined`. A single malformed/incomplete `-reason` tag therefore hides an otherwise valid and important project-status warning from the user. (The `\"pypi:project-status\"` arm at `html.rs:165` has the same class of bug: `attribute(tag, \"content\").as_deref().and_then(Status::new)?` uses `?` to bail the entire function on an unrecognized `content` value instead of just skipping that one tag.)","fix":"Do not abort the whole scan when a single meta tag is malformed; just skip that tag and keep any status/reason already collected:\n```rust\n\"pypi:project-status\" => {\n    if let Some(parsed) = attribute(tag, \"content\").as_deref().and_then(Status::new) {\n        status = Some(parsed);\n    } else {\n        warn!(\"Invalid or missing project status\");\n    }\n}\n\"pypi:project-status-reason\" => {\n    match attribute(tag, \"content\").as_deref().map(SmallString::from) {\n        Some(content) => reason = Some(content),\n        None => warn!(\"Invalid project status reason (missing)\"),\n    }\n}\n```","locations":[{"ref":"crates/uv-client/src/html.rs:145-191","code":"  145 |     fn parse_project_status(parser: &Parser, head: &Node) -> Option<ProjectStatus> {\n  146 |         let children = head.children()?;\n  147 |
