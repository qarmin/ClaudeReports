\n 2463 |                     numbers.push(n);\n 2464 |                     *self = Self::Vec(numbers.clone());\n 2465 |                 } else {","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep440/src/version.rs#L2461-L2465"}]},{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `FormMetadata::from_metadata`, the owned `String` fields obtained by destructuring `Metadata23` are cloned even though they are not used again: `metadata_version.clone()`, `name.clone()`, `version.clone()`. Likewise the `add_option` closure does `if let Some(some) = value.clone()` on an owned `Option<String>` it consumes. These clones are unnecessary allocations.","fix":"Drop the `.clone()` calls: push `metadata_version`, `name`, `version` directly (they are owned and unused afterward), and change the closure to `if let Some(some) = value { form_metadata.push((name, some)); }`.","locations":[{"ref":"crates/uv-publish/src/lib.rs:1232-1239","code":" 1232 |             (\"metadata_version\", metadata_version.clone()),\n 1233 |             // Twine transforms the name with `re.sub(\"[^A-Za-z0-9.]+\", \"-\", name)`\n 1234 |             // * <https://github.com/pypa/twine/issues/743>\n 1235 |             // * <https://github.com/pypa/twine/blob/5bf3f38ff3d8b2de47b7baa7b652c697d7a64776/twine/package.py#L57-L65>\n 1236 |             // warehouse seems to call `packaging.utils.canonicalize_name` nowadays and has a separate\n 1237 |             // `normalized_name`, so we'll start with this and we'll readjust if there are user reports.\n 1238 |             (\"name\", name.clone()),\n 1239 |             (\"version\", version.clone()),","lines":8,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-publish/src/lib.rs#L1232-L1239"},{"ref":"crates/uv-publish/src/lib.rs:1249-1253","code":" 1249 |         let mut add_option = |name, value: Option<String>| {\n 1250 |             if let Some(some) = value.clone() {\n 1251 |                 form_metadata.push((name, some));\n 1252 |             }\n 1253 |         };","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-publish/src/lib.rs#L1249-L1253"}]},{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `filter_and_convert_wheels`, `wheel.file.url.to_url()` is computed once into `url` (used only for the `name` filename comparison) and then computed a second, identical time for the `url:` field of `PylockTomlWheel`. The already-computed `url` can be reused, avoiding a redundant URL parse/allocation per wheel.","fix":"Reuse the previously computed value: set `url: Some(url)` instead of re-invoking `wheel.file.url.to_url().map_err(PylockTomlErrorKind::ToUrl)?` at line 685-690 (the local `url` is still owned and unused after the `name` check).","locations":[{"ref":"crates/uv-resolver/src/lock/export/pylock_toml.rs:662-695","code":"  662 |         let wheels = wheels\n  663 |             .into_iter()\n  664 |             .map(|wheel| {\n  665 |                 let url = wheel\n  666 |                     .file\n  667 |                     .url\n  668 |                     .to_url()\n  669 |                     .map_err(PylockTomlErrorKind::ToUrl)?;\n  670 |                 Ok(PylockTomlWheel {\n  671 |                     // Optional \"when the last component of path/ url would be the same value\".\n  672 |                     name: if url\n  673 |                         .filename()\n  674 |                         .is_ok_and(|filename| filename == *wheel.file.filename)\n  675 |                     {\n  676 |                         None\n  677 |                     } else {\n  678 |                         Some(wheel.filename.clone())\n  679 |                     },\n  680 |                     upload_time: wheel\n  681 |                         .file\n  682 |                         .upload_time_utc_ms\n  683 |                         .map(Timestamp::from_millisecond)\n  684 |                         .transpose()?,\n  685 |                     url: Some(\n  686 |                         wheel\n  687 |                             .file\n  688 |                             .url\n  689 |                             .to_url()\n  690 |                             .map_err(PylockTomlErrorKind::ToUrl)?,\n  691 |                     ),\n  692 |                     path: None,\n  693 |                     size: wheel.file.size,\n  694 |                     hashes: Hashes::from(wheel.file.hashes.clone()),\n  695 |                 })","lines":34,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/lock/export/pylock_toml.rs#L662-L695"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `crates/uv-client/src/cached_client.rs`, `CachedClient::send_cached` (lines 541-586) matches on `cache_control` inside the `BeforeRequest::Stale` arm (lines 560-575) and handles `CacheControl::AllowStale` at lines 571-574 by returning `CachedResponse::FreshCache(cached)`. This arm is unreachable: `send_cached` has exactly one caller, `get_cacheable` at `cached_client.rs:287`, and that call only happens inside the `else` branch of `if let Some(cached) = self.read_cache(cache_entry).await`, which itself is only reached after the earlier `if matches!(cache_control, CacheControl::AllowStale) { ...; return ...; }` guard at `cached_client.rs:251-283` has already returned (either with the stale payload or via `run_response_callback` after a `fresh_request`). So by the time `send_cached` runs, `cache_control` can never be `CacheControl::AllowStale`. The dead arm is harmless today but is misleading: a future reader/maintainer could reasonably believe `send_cached` handles the allow-stale case, and could introduce a real bug by relying on that branch executing (e.g. when refactoring the `AllowStale` fast path).","fix":"Either add a comment noting the invariant, or make it structurally impossible to violate, e.g. narrow the type passed to `send_cached` so it cannot represent `AllowStale`:\n```rust\n// `send_cached` is only reached when `cache_control` is not `AllowStale`\n// (see the early return in `get_cacheable`); assert the invariant instead\n// of silently handling a case that can never occur.\nCacheControl::AllowStale => {\n    debug_assert!(false, \"send_cached should never see CacheControl::AllowStale\");\n    CachedResponse::FreshCache(cached)\n}\n```","locations":[{"ref":"crates/uv-client/src/cached_client.rs:560-575","code":"  560 |             BeforeRequest::Stale(new_cache_policy_builder) => match cache_control {\n  561 |                 CacheControl::None | CacheControl::MustRevalidate | CacheControl::Override(_) => {\n  562 |                     debug!(\"Found stale response for: {url}\");\n  563 |                     self.send_cached_handle_stale(\n  564 |                         req,\n  565 |                         cache_control,\n  566 |                         cached,\n  567 |                         new_cache_policy_builder,\n  568 |                     )\n  569 |                     .await?\n  570 |                 }\n  571 |                 CacheControl::AllowStale => {\n  572 |                     debug!(\"Found stale (but allowed) response for: {url}\");\n  573 |                     CachedResponse::FreshCache(cached)\n  574 |                 }\n  575 |             },","lines":16,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-client/src/cached_client.rs#L560-L575"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`process_json` in the `uv-python` build script is effectively a no-op that only re-boxes the top-level object: it iterates the input object and clones every `key`/`value` into a fresh `serde_json::Map`, returning a structurally identical object. The name (`process_json`) and the call-site variable `filtered_data` imply filtering/minification, but no filtering happens - the only \"minification\" comes from `serde_json::to_string` emitting compact JSON. The whole function and the object rebuild are dead work and the naming is misleading to future readers.","fix":"Delete `process_json` and serialize `json_data` directly (`serde_json::to_string(&json_data)`), or rename it and add a real filtering step if one was intended. At minimum rename `filtered_data` to `minified_data` so the name does not falsely imply filtering.","locations":[{"ref":"crates/uv-python/build.rs:9-19","code":"    9 | fn process_json(data: &serde_json::Value) -> serde_json::Value {\n   10 |     let mut out_data = serde_json::Map::new();\n   11 | \n   12 |     if let Some(obj) = data.as_object() {\n   13 |         for (key, value) in obj {\n   14 |             out_data.insert(key.clone(), value.clone());\n   15 |         }\n   16 |     }\n   17 | \n   18 |     serde_json::Value::Object(out_data)\n   19 | }","lines":11,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/build.rs#L9-L19"},{"ref":"crates/uv-python/build.rs:48","code":"   48 |     let filtered_data = process_json(&json_data);","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/build.rs#L48"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"Four `RequirementsTxtParserError` variants are never constructed anywhere in the workspace: `ParsedUrl`, `UnsupportedRequirement`, `UrlConversion`, and `UnsupportedUrl`; they appear only in the `Display`/`source` match arms. Also the (dead) `ParsedUrl` `Display` arm has a broken message `write!(f, \"Couldn't URL at position {start}\")` missing the word `parse` (the parallel `RequirementsTxtFileError` arm correctly reads `Couldn't parse URL in ...`).","fix":"Remove the four unused variants (and their `Display`/`source` arms) or wire them up. If kept, fix the message to `Couldn't parse URL at position {start}`.","locations":[{"ref":"crates/uv-requirements-txt/src/lib.rs:1155-1156","code":" 1155 |     UrlConversion(String),\n 1156 |     UnsupportedUrl(String),","lines":2,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-requirements-txt/src/lib.rs#L1155-L1156"},{"ref":"crates/uv-requirements-txt/src/lib.rs:1184-1198","code":" 1184 |     UnsupportedRequirement {\n 1185 |         source: Box<Pep508Error<VerbatimParsedUrl>>,\n 1186 |         start: usize,\n 1187 |         end: usize,\n 1188 |     },\n 1189 |     Pep508 {\n 1190 |         source: Box<Pep508Error<VerbatimParsedUrl>>,\n 1191 |         start: usize,\n 1192 |         end: usize,\n 1193 |     },\n 1194 |     ParsedUrl {\n 1195 |         source: Box<Pep508Error<VerbatimParsedUrl>>,\n 1196 |         start: usize,\n 1197 |         end: usize,\n 1198 |     },","lines":15,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-requirements-txt/src/lib.rs#L1184-L1198"},{"ref":"crates/uv-requirements-txt/src/lib.rs:1265-1267","code":" 1265 |             Self::ParsedUrl { start, .. } => {\n 1266 |                 write!(f, \"Couldn't URL at position {start}\")\n 1267 |             }","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-requirements-txt/src/lib.rs#L1265-L1267"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `conflict_marker_reachability`, the `Entry::Occupied` branch computes `let mut after = child_map.get(&key).copied().unwrap_or(MarkerTree::FALSE); after.or(value);` but `after` is never read; the actual mutation happens on the following line `child_map.entry(key).or_insert(MarkerTree::FALSE).or(value);`. The `after` local and its `.or(value)` are leftover dead code.","fix":"Delete the two dead lines so the loop body is just:\n```rust\nfor (key, value) in parent_map {\n    child_map.entry(key).or_insert(MarkerTree::FALSE).or(value);\n}\n```","locations":[{"ref":"crates/uv-resolver/src/lock/export/mod.rs:565-569","code":"  565 |                     for (key, value) in parent_map {\n  566 |                         let mut after = child_map.get(&key).copied().unwrap_or(MarkerTree::FALSE);\n  567 |                         after.or(value);\n  568 |                         child_map.entry(key).or_insert(MarkerTree::FALSE).or(value);\n  569 |                     }","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/lock/export/mod.rs#L565-L569"}]},{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"The `Error::UnknownBoundKind(String)` variant is never constructed anywhere in the crate (confirmed by grep), and its `#[error(\"Unknown bound king {0}\")]` message contains a typo: `king` should be `kind`. It is dead code carrying a broken message.","fix":"Remove the unused `UnknownBoundKind(String)` variant. If it must be kept, fix the message: change `#[error(\"Unknown bound king {0}\")]` to `#[error(\"Unknown bound kind {0}\")]`.","locations":[{"ref":"crates/uv-workspace/src/pyproject_mut.rs:69-70","code":"   69 |     #[error(\"Unknown bound king {0}\")]\n   70 |     UnknownBoundKind(String),","lines":2,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/pyproject_mut.rs#L69-L70"}]},{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `audit`, `_markers` is computed via `resolution_markers(...)` for the non-universal case (`--python-version`/`--python-platform`) but is never used. `resolution_markers` (in `crates/uv/src/commands/pip/mod.rs`) is a pure function with no side effects, so this is wasted computation and, more importantly, signals that targeted (platform/version-specific) auditing is not actually applied: the auditable set is built with `lock.auditable(&extras, &groups, |_| true)`, whose `collect_filter` is hardcoded to `|_| true`, so no marker-based filtering ever happens. The result is that `--python-version`/`--python-platform` do not restrict the set of audited packages.","fix":"Either remove the dead `_markers` binding (and the `resolution_markers` call) if platform-targeted auditing is intentionally unsupported, or wire the computed markers into the `collect_filter` closure passed to `lock.auditable(...)` so the `|_| true` filter actually respects the requested platform/version markers.","locations":[{"ref":"crates/uv/src/commands/project/audit.rs:208-221","code":"  208 |     // Determine the markers to use for resolution.\n  209 |     let _markers = (!universal).then(|| {\n  210 |         resolution_markers(\n  211 |             python_version.as_ref(),\n  212 |             python_platform.as_ref(),\n  213 |             interpreter.as_ref().unwrap(),\n  214 |         )\n  215 |     });\n  216 | \n  217 |     // Build the set of auditable packages by traversing the lockfile from workspace roots,\n  218 |     // respecting the user's extras and dependency-group filters. Workspace members are excluded\n  219 |     // (they are local and have no external package identity), as are packages without a version.\n  220 |     // The `Auditable` view offers per-version and per-project projections from a single walk.\n  221 |     let auditable = lock.auditable(&extras, &groups, |_| true);","lines":14,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/audit.rs#L208-L221"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `map_matching_legacy_items` the inner condition `if search.is_empty() && require_unique` is nested inside `if require_unique { ... }`, so the `&& require_unique` is always true and redundant.","fix":"Drop the redundant conjunct: `if search.is_empty() {` (the surrounding `if require_unique` already guarantees it).","locations":[{"ref":"crates/uv-keyring/src/secret_service.rs:406-409","code":"  406 |         if require_unique {\n  407 |             if search.is_empty() && require_unique {\n  408 |                 return Err(ErrorCode::NoEntry);\n  409 |             } else if search.len() > 1 {","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-keyring/src/secret_service.rs#L406-L409"}]},{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`let p_credential = p_credential;` re-binds a `Copy` raw pointer to itself, which is a no-op with no effect on lifetime or ownership. It appears to be leftover code.","fix":"Remove the line `let p_credential = p_credential;`.","locations":[{"ref":"crates/uv-keyring/src/windows.rs:323","code":"  323 |             let p_credential = p_credential;","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-keyring/src/windows.rs#L323"}]},{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The `if !hashes.is_empty()` guard around the hash-emitting `for` loop is redundant: iterating an empty slice already emits nothing, so the check adds no behavior.","fix":"Remove the guard, keeping only the loop:\n```rust\nif self.hashes {\n    let mut hashes = package.hashes();\n    hashes.sort_unstable();\n    for hash in hashes.iter() {\n        writeln!(f, \" \\\\\")?;\n        write!(f, \"    --hash=\")?;\n        write!(f, \"{hash}\")?;\n    }\n}\n```","locations":[{"ref":"crates/uv-resolver/src/lock/export/requirements_txt.rs:171-181","code":"  171 |             if self.hashes {\n  172 |                 let mut hashes = package.hashes();\n  173 |                 hashes.sort_unstable();\n  174 |                 if !hashes.is_empty() {\n  175 |                     for hash in hashes.iter() {\n  176 |                         writeln!(f, \" \\\\\")?;\n  177 |                         write!(f, \"    --hash=\")?;\n  178 |                         write!(f, \"{hash}\")?;\n  179 |                     }\n  180 |                 }\n  181 |             }","lines":11,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/lock/export/requirements_txt.rs#L171-L181"}]},{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`PubGrubPackage::kind` is annotated `#[allow(dead_code)]` and documented as \"isn't actually used anywhere\". Per project guidance (`AGENTS.md`), `#[expect()]` is preferred over `#[allow()]` so the lint fires if the code becomes used, and dead debug-only helpers should be flagged.","fix":"Replace `#[allow(dead_code)]` with `#[expect(dead_code, reason = \"kept for printf-debugging\")]`, or remove the method if debug helpers are not desired in the tree.","locations":[{"ref":"crates/uv-resolver/src/pubgrub/package.rs:309-321","code":"  309 |     /// This isn't actually used anywhere, but can be useful for printf-debugging.\n  310 |     #[allow(dead_code)]\n  311 |     pub(crate) fn kind(&self) -> &'static str {\n  312 |         match &**self {\n  313 |             PubGrubPackageInner::Root(_) => \"root\",\n  314 |             PubGrubPackageInner::Python(_) => \"python\",\n  315 |             PubGrubPackageInner::System(_) => \"system\",\n  316 |             PubGrubPackageInner::Package { .. } => \"package\",\n  317 |             PubGrubPackageInner::Extra { .. } => \"extra\",\n  318 |             PubGrubPackageInner::Group { .. } => \"group\",\n  319 |             PubGrubPackageInner::Marker { .. } => \"marker\",\n  320 |         }\n  321 |     }","lines":13,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/pubgrub/package.rs#L309-L321"}]},{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `build_simple_api_response`, `insert_header(\"Content-Type\", \"application/vnd.pypi.simple.v1+json\")` is redundant: wiremock's `generate_response` unconditionally inserts (replacing) the `Content-Type` header from the mime passed to `set_body_raw`, which is the same value. The sibling helper `pypi_proxy::simple_api_response` sets it only once via `set_body_raw`.","fix":"Drop the redundant `.insert_header(\"Content-Type\", \"application/vnd.pypi.simple.v1+json\")` and rely on `set_body_raw(body_str, \"application/vnd.pypi.simple.v1+json\")` alone, as done in `pypi_proxy::simple_api_response`.","locations":[{"ref":"crates/uv-test/src/packse/server.rs:319-322","code":"  319 |     let body_str = body.to_string();\n  320 |     ResponseTemplate::new(200)\n  321 |         .insert_header(\"Content-Type\", \"application/vnd.pypi.simple.v1+json\")\n  322 |         .set_body_raw(body_str, \"application/vnd.pypi.simple.v1+json\")","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-test/src/packse/server.rs#L319-L322"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `crates/uv-client/src/html.rs:251-256`, the comment says: \"Extract the filename from the body text, which MUST match that of the final path component of the URL.\" This is incorrect: `SimpleDetailHTML::parse_anchor` never reads the anchor's body/inner text at all (that is only done by the unrelated `SimpleIndexHtml::parse_anchor_project_name` at `html.rs:377`). The filename is extracted purely from the `href` URL's path component (`path.split('/').next_back()`), with no comparison against the link's visible text. The comment misleads future readers into thinking there is a body-text/URL consistency check being performed here, when there is none.","fix":"Correct the comment to describe what the code actually does, e.g.:\n```rust\n// Extract the filename from the final path component of the href URL.\nlet filename = path\n    .split('/')\n    .next_back()\n    .ok_or_else(|| Error::MissingFilename(href.to_string()))?;\n```","locations":[{"ref":"crates/uv-client/src/html.rs:251-256","code":"  251 |         // Extract the filename from the body text, which MUST match that of\n  252 |         // the final path component of the URL.\n  253 |         let filename = path\n  254 |             .split('/')\n  255 |             .next_back()\n  256 |             .ok_or_else(|| Error::MissingFilename(href.to_string()))?;","lines":6,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-client/src/html.rs#L251-L256"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Several user-facing warning messages are built with `format!` string literals that wrap across source lines, embedding a literal newline plus the source indentation (many spaces) into the emitted message. For example the `Expected double quoted PEP 440 version to compare with {key},\\n                        found {r_value}...` text renders as a warning with an embedded newline and ~24 spaces of indentation. This produces malformed multi-line warning output for end users. The pattern is repeated across many of the `reporter.report(...)` calls in this file.","fix":"Join the message onto a single logical line using string concatenation across lines (`\"...\" \\\n\"...\"` with a trailing backslash, or adjacent string literals) so no literal newline/indentation is embedded, matching the single-line warning style used elsewhere.","locations":[{"ref":"crates/uv-pep508/src/marker/parse.rs:194-198","code":"  194 |                     format!(\n  195 |                         \"Expected double quoted PEP 440 version to compare with {key},\n  196 |                         found {r_value}, will be ignored\"\n  197 |                     ),\n  198 |                 );","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/parse.rs#L194-L198"},{"ref":"crates/uv-pep508/src/marker/parse.rs:219-223","code":"  219 |                         MarkerWarningKind::MarkerMarkerComparison,\n  220 |                         \"Comparing two markers with each other doesn't make any sense,\n  221 |                             will be ignored\"\n  222 |                             .to_string(),\n  223 |                     );","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/parse.rs#L219-L223"},{"ref":"crates/uv-pep508/src/marker/parse.rs:264-268","code":"  264 |                         MarkerWarningKind::ExtraInvalidComparison,\n  265 |                         \"Comparing extra with something other than a quoted string is wrong,\n  266 |                             will be ignored\"\n  267 |                             .to_string(),\n  268 |                     );","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/parse.rs#L264-L268"},{"ref":"crates/uv-pep508/src/marker/parse.rs:418-421","code":"  418 |                     format!(\n  419 |                         \"Expected PEP 440 versions to compare with {key}, found {value},\n  420 |                         will be ignored: {err}\"\n  421 |                     ),","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/parse.rs#L418-L421"},{"ref":"crates/uv-pep508/src/marker/parse.rs:465-468","code":"  465 |             format!(\n  466 |                 \"Expected PEP 440 version operator to compare {key} with `{version}`,\n  467 |                     found `{marker_operator}`, will be ignored\",\n  468 |                 version = pattern.version()","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/parse.rs#L465-L468"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `PythonDownloadRequest::prereleases` claims it \"defaults to true if `Self::version` is not None, and false otherwise\". The actual default computed in `allows_prereleases` is `self.version.as_ref().is_some_and(VersionRequest::allows_prereleases)`, i.e. it is only `true` when the version itself opts into pre-releases (e.g. a range with a pre-release bound or a pre-release version). For a stable version like `Some(3.12)` it returns `false`, contradicting the comment.","fix":"Update the comment to state the real behavior, e.g. `If not set, defaults to whether the version request itself allows pre-releases (`VersionRequest::allows_prereleases`), and false when there is no version.`","locations":[{"ref":"crates/uv-python/src/downloads.rs:226-229","code":"  226 |     /// Whether to allow pre-releases or not. If not set, defaults to true if [`Self::version`] is\n  227 |     /// not None, and false otherwise.\n  228 |     pub(crate) prereleases: Option<bool>,\n  229 | }","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/downloads.rs#L226-L229"},{"ref":"crates/uv-python/src/downloads.rs:623-629","code":"  623 |     pub(crate) fn allows_prereleases(&self) -> bool {\n  624 |         self.prereleases.unwrap_or_else(|| {\n  625 |             self.version\n  626 |                 .as_ref()\n  627 |                 .is_some_and(VersionRequest::allows_prereleases)\n  628 |         })\n  629 |     }","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/downloads.rs#L623-L629"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `is_alternative_implementation` describes the inverse of what the function computes. The comment reads `Whether this is a CPython installation.` and `Returns false if it is an alternative implementation, e.g., PyPy.`, but the function is named `is_alternative_implementation` and returns `true` for alternative implementations (`!matches!(..CPython..) || self.os().is_emscripten()`). The comment appears copy-pasted from a hypothetical `is_cpython`-style method and misleads readers about the return polarity.","fix":"Rewrite the doc comment to match the code, e.g. `/// Returns \\`true\\` if this is an alternative (non-CPython) implementation, e.g., PyPy or an Emscripten/Pyodide build.`","locations":[{"ref":"crates/uv-python/src/installation.rs:407-415","code":"  407 |     /// Whether this is a CPython installation.\n  408 |     ///\n  409 |     /// Returns false if it is an alternative implementation, e.g., PyPy.\n  410 |     pub(crate) fn is_alternative_implementation(&self) -> bool {\n  411 |         !matches!(\n  412 |             self.implementation(),\n  413 |             LenientImplementationName::Known(ImplementationName::CPython)\n  414 |         ) || self.os().is_emscripten()\n  415 |     }","lines":9,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/installation.rs#L407-L415"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `PythonRequirement::raises` states it returns `true` \"if the minimum version of Python required by the target is greater than the installed version\", but the body compares against the target's lower bound, not the installed version: `target.lower() > self.target.range().lower()`. `self.target` and `self.installed` are distinct fields, and callers in `resolver/mod.rs` (lines 4024-4025 and 4044-4045) rely on the target-vs-target comparison to decide whether a dependency raises the resolution's minimum-supported Python. The code is correct; the comment misdescribes it by saying \"installed\".","fix":"Change the doc comment to reference the target Python requirement, e.g. replace `greater than the installed version` with `greater than the current target Python requirement`.","locations":[{"ref":"crates/uv-resolver/src/python_requirement.rs:153-157","code":"  153 |     /// Returns `true` if the minimum version of Python required by the target is greater than the\n  154 |     /// installed version.\n  155 |     pub(crate) fn raises(&self, target: &RequiresPythonRange) -> bool {\n  156 |         target.lower() > self.target.range().lower()\n  157 |     }","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/python_requirement.rs#L153-L157"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"User-facing error message contains a double-negative grammatical error: `\"When using \\`--token\\`, a username cannot not be provided; found: {username}\"`. The `cannot not` should be `cannot`. The typo is also baked into snapshot tests (`crates/uv/tests/it/auth.rs:750` and `:931`).","fix":"Replace `a username cannot not be provided` with `a username cannot be provided` and update the two snapshot expectations in `crates/uv/tests/it/auth.rs`.","locations":[{"ref":"crates/uv/src/commands/auth/login.rs:100","code":"  100 |                 bail!(\"When using `--token`, a username cannot not be provided; found: {username}\");","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/auth/login.rs#L100"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `uv auth token` pyx branch emits the message `\"Cannot specify a username when logging in to pyx\"`, which is copy-pasted from `login.rs`. The `token` command is not logging in, so the wording is misleading to users of `uv auth token <pyx-url> --username ...`.","fix":"Change the message to reflect the command, e.g. `bail!(\"Cannot specify a username when fetching a token for pyx\");`.","locations":[{"ref":"crates/uv/src/commands/auth/token.rs:25-27","code":"   25 |         if username.is_some() {\n   26 |             bail!(\"Cannot specify a username when logging in to pyx\");\n   27 |         }","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/auth/token.rs#L25-L27"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `RemoveTarget` enum has swapped variant doc comments and a wrong summary. The type doc says `Represents the destination where dependencies are added` (this is `remove.rs`, so it should say \"removed\"; copied from `add.rs`). The `Project(VirtualProject)` variant is documented `A PEP 723 script, with inline metadata.` and the `Script(Pep723Script)` variant is documented `A project with a \\`pyproject.toml\\`.` - the two variant descriptions are reversed relative to their actual types.","fix":"Update the summary to \"...where dependencies are removed...\" and swap the two variant doc comments so `Project(VirtualProject)` reads `/// A project with a \\`pyproject.toml\\`.` and `Script(Pep723Script)` reads `/// A PEP 723 script, with inline metadata.`.","locations":[{"ref":"crates/uv/src/commands/project/remove.rs:404-412","code":"  404 | /// Represents the destination where dependencies are added, either to a project or a script.\n  405 | #[derive(Debug)]\n  406 | #[expect(clippy::large_enum_variant)]\n  407 | enum RemoveTarget {\n  408 |     /// A PEP 723 script, with inline metadata.\n  409 |     Project(VirtualProject),\n  410 |     /// A project with a `pyproject.toml`.\n  411 |     Script(Pep723Script),\n  412 | }","lines":9,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/remove.rs#L404-L412"}]},{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `PipListSettings::resolve`, the two mutually-exclusive CLI flags `--editable` and `--exclude-editable` are passed to `flag(editable, exclude_editable, \"exclude-editable\")`. The `flag` helper (`crates/uv-cli/src/options.rs:31`) assumes its two booleans are a `--<name>`/`--no-<name>` pair and, on conflict, emits `\"`--{name}` and `--no-{name}` cannot be used together\"`. Here that produces an error referencing `--exclude-editable` and `--no-exclude-editable` (a flag that does not exist), when the actual conflicting flags the user passed are `--editable` and `--exclude-editable`. Running `uv pip list --editable --exclude-editable` therefore prints a misleading error message.","fix":"Do not route these two non-paired flags through `flag`. Resolve `editable` explicitly, e.g. `editable: match (editable, exclude_editable) { (true, true) => bail!(\"`--editable` and `--exclude-editable` cannot be used together\"), (true, false) => Some(true), (false, true) => Some(false), (false, false) => None },`, so the error names the real flags.","locations":[{"ref":"crates/uv/src/settings.rs:3896","code":" 3896 |             editable: flag(editable, exclude_editable, \"exclude-editable\")?,","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/settings.rs#L3896"}]},{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `VersionBump::Rc` has a stray trailing `]` after the intra-doc link: `you'd also include [\\`VersionBump::Major\\`].]` (note the extra `]` at the very end of the line). The parallel doc comments on the neighboring `Alpha` and `Beta` variants end correctly with just `[\\`VersionBump::Major\\`].` (no trailing bracket), showing this is a copy-paste typo rather than intentional Markdown/rustdoc syntax.","fix":"Remove the stray trailing `]`:\n```rust\n/// for 1.2.3 => 2.0.0rc1, you'd also include [`VersionBump::Major`].\n```","locations":[{"ref":"crates/uv-cli/src/lib.rs:722","code":"  722 |     /// for 1.2.3 => 2.0.0rc1, you'd also include [`VersionBump::Major`].]","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/lib.rs#L722"}]},{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typo in the crate-level docs: `dev versions, which can be attached to both table releases and pre-releases` should read `stable releases`, not `table releases`.","fix":"Change `both table releases and pre-releases` to `both stable releases and pre-releases`.","locations":[{"ref":"crates/uv-pep440/src/lib.rs:9-11","code":"    9 | //! * dev versions, which can be attached to both table releases and pre-releases. When attached to a\n   10 | //!   pre-release the dev version is ordered just below the normal pre-release, however when attached\n   11 | //!   to a stable version, the dev version is sorted before a pre-releases","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep440/src/lib.rs#L9-L11"}]},{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Several doc comments and one `unreachable!` message reference a variant named `Sentinel` that no longer exists; the variant was renamed to `Max` (`LocalVersion::Max` / `LocalVersionSlice::Max`). The intra-doc links `[`LocalVersion::Sentinel`]` are broken and the panic message names a nonexistent value.","fix":"Update the references from `Sentinel` to `Max`: e.g. change `[`LocalVersion::Sentinel`]` to `[`LocalVersion::Max`]`, `Like [`LocalVersion::Sentinel`]` to `Like [`LocalVersion::Max`]`, and the `unreachable!(\"found `LocalVersionSlice::Sentinel`, ...\")` message to say `LocalVersionSlice::Max`.","locations":[{"ref":"crates/uv-pep440/src/version.rs:1740-1741","code":" 1740 | /// Either a sequence of local segments or [`LocalVersion::Sentinel`], an internal-only value that\n 1741 | /// compares greater than all other local versions.","lines":2,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep440/src/version.rs#L1740-L1741"},{"ref":"crates/uv-pep440/src/version.rs:1760","code":" 1760 |     /// Like [`LocalVersion::Sentinel`]","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep440/src/version.rs#L1760"},{"ref":"crates/uv-pep440/src/version_ranges.rs:206-208","code":"  206 |                 LocalVersionSlice::Max => unreachable!(\n  207 |                     \"found `LocalVersionSlice::Sentinel`, which should be an internal-only value\"\n  208 |                 ),","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep440/src/version_ranges.rs#L206-L208"}]},{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on the `PlatformPythonImplementation` variant reads `Deprecated \\`platform.machine\\` from <https://peps.python.org/pep-0345/#environment-markers>`, which describes `platform.machine` (the previous variant `PlatformMachine`), not the Python implementation. It is a copy-paste leftover attached to the wrong variant and is misleading.","fix":"Change line 53 from `/// Deprecated \\`platform.machine\\` from <https://peps.python.org/pep-0345/#environment-markers>` to reference the deprecated `platform.python_implementation` marker, or remove the stray line so the comment for `PlatformPythonImplementation` only says `/// \\`platform_python_implementation\\``.","locations":[{"ref":"crates/uv-pep508/src/marker/lowering.rs:52-55","code":"   52 |     PlatformMachine,\n   53 |     /// Deprecated `platform.machine` from <https://peps.python.org/pep-0345/#environment-markers>\n   54 |     /// `platform_python_implementation`\n   55 |     PlatformPythonImplementation,","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/lowering.rs#L52-L55"}]},{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Doc-comment typo: `Preview::all_enabled` is documented as `/// Check if all preview feature rae enabled.` (`feature rae` should read `features are`).","fix":"Change the comment to `/// Check if all preview features are enabled.`","locations":[{"ref":"crates/uv-preview/src/lib.rs:443","code":"  443 |     /// Check if all preview feature rae enabled.","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-preview/src/lib.rs#L443"}]},{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `PyxPublishingService::exchange_token`, the error-path comment reads \"something is misconfigured, e.g. a typo in the PyPI configuration ... https://docs.pypi.org/trusted-publishers/...\". This is the pyx (not PyPI) service; the comment was copy-pasted verbatim from `pypi.rs` and references PyPI docs/configuration that do not apply her ale first paragraph (lines 726-734) so only the current, accurate summary starting at `Resolve unencoded package extra markers ...` remains, keeping the `scope_package` explanation.","locations":[{"ref":"crates/uv-resolver/src/universal_marker.rs:726-740","code":"  726 | /// Resolve the conflict markers in a [`MarkerTree`] based on the conditions under which each\n  727 | /// conflict item is known to be true.\n  728 | ///\n  729 | /// For example, if the `cpu` extra is known to be enabled when `sys_platform == 'darwin'`, then\n  730 | /// given the combined marker `python_version >= '3.8' and extra == 'extra-7-project-cpu'`, this\n  731 | /// method would return `python_version >= '3.8' and sys_platform == 'darwin'`.\n  732 | ///\n  733 | /// If a conflict item isn't present in the map of known conflicts, it's assumed to be false in all\n  734 | /// environments.\n  735 | /// Resolve unencoded package extra markers and conflict-encoded extra markers in a\n  736 | /// [`MarkerTree`] based on the conditions under which each item is known to be true.\n  737 | ///\n  738 | /// When `scope_package` is set, unencoded package extras like `extra == 'cpu'` are interpreted\n  739 | /// relative to that package. Conflict-encoded extras and groups are resolved independent of\n  740 | /// `scope_package`.","lines":15,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/universal_marker.rs#L726-L740"}]},{"id":"CMT_24","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The step-numbering comments in `DisplayDependencyGraph::new` are wrong: `// Step 2: Add all dependencies.` is followed by `// Step 2: Reverse the graph.` (duplicate `Step 2`) and then `// Step 3: Filter the graph...`, so the reverse and filter phases are mislabeled.","fix":"Renumber the later comments: change `// Step 2: Reverse the graph.` to `// Step 3: Reverse the graph.` and `// Step 3: F ndex` from requirements file. Instead, use the `--no-index` command-line argument, or set `no-index` in a `uv.toml` or `pyproject.toml` file.\"\n 3478 |         );\n 3479 |     } else {\n 3480 |         if let Some(index_url) = index_url {\n 3481 |             if settings.index_locations.default_index().map(Index::url) != Some(index_url) {\n 3482 |                 warn_user_once!(\n 3483 |                     \"Ignoring `--index-url` from requirements file: `{index_url}`. Instead, use the `--index-url` command-line argument, or set `index-url` in a `uv.toml` or `pyproject.toml` file.\"\n 3484 |                 );\n 3485 |             }\n 3486 |         }\n 3487 |         for extra_index_url in extra_index_urls {\n 3488 |             if !settings\n 3489 |                 .index_locations\n 3490 |                 .implicit_indexes()\n 3491 |                 .any(|index| index.url() == extra_index_url)\n 3492 |             {\n 3493 |                 warn_user_once!(\n 3494 |                     \"Ignoring `--extra-index-url` from requirements file: `{extra_index_url}`. Instead, use the `--extra-index-url` command-line argument, or set `extra-index-url` in a `uv.toml` or `pyproject.toml` file.`\"\n 3495 |                 );\n 3496 |             }\n 3497 |         }\n 3498 |         for find_link in find_links {\n 3499 |             if !settings\n 3500 |                 .index_locations\n 3501 |                 .flat_indexes()\n 3502 |                 .any(|index| index.url() == find_link)\n 3503 |             {\n 3504 |                 warn_user_once!(\n 3505 |                     \"Ignoring `--find-links` from requirements file: `{find_link}`. Instead, use the `--find-links` command-line argument, or set `find-links` in a `uv.toml` or `pyproject.toml` file.`\"\n 3506 |                 );\n 3507 |             }\n 3508 |         }\n 3509 |     }\n 3510 | \n 3511 |     if !no_binary.is_none() && settings.build_options.no_binary() != no_binary {\n 3512 |         warn_user_once!(\n 3513 |             \"Ignoring `--no-binary` setting from requirements file. Instead, use the `--no-binary` command-line argument, or set `no-binary` in a `uv.toml` or `pyproject.toml` file.\"\n 3514 |         );\n 3515 |     }\n 3516 | \n 3517 |     if !no_build.is_none() && settings.build_options.no_build() != no_build {\n 3518 |         warn_user_once!(\n 3519 |             \"Ignoring `--no-binary` setting from requirements file. Instead, use the `--no-build` command-line argument, or set `no-build` in a `uv.toml` or `pyproject.toml` file.\"\n 3520 |         );\n 3521 |     }\n 3522 | }\n 3523 | \n 3524 | fn format_requires_python_sources(conflicts: &RequiresPythonSources) -> String {\n 3525 |     conflicts\n 3526 |         .iter()\n 3527 |         .map(|((package, group), specifiers)| {\n 3528 |             if let Some(group) = group {\n 3529 |                 format!(\"- {package}:{group}: {specifiers}\")\n 3530 |             } else {\n 3531 |                 format!(\"- {package}: {specifiers}\")\n 3532 |             }\n 3533 |         })\n 3534 |         .join(\"\\n\")\n 3535 | }\n 3536 | \n 3537 | fn format_optional_requires_python_sources(\n 3538 |     conflicts: &RequiresPythonSources,\n 3539 |     workspace_non_trivial: bool,\n 3540 | ) -> String {\n 3541 |     // If there's lots of conflicts, print a list\n 3542 |     if conflicts.len() > 1 {\n 3543 |         return format!(\n 3544 |             \".\\nThe following `requires-python` declarations do not permit this version:\\n{}\",\n 3545 |             format_requires_python_sources(conflicts)\n 3546 |         );\n 3547 |     }\n 3548 |     // If there's one conflict, give a clean message\n 3549 |     if conflicts.len() == 1 {\n 3550 |         let ((package, group), _) = conflicts.iter().next().unwrap();\n 3551 |         if let Some(group) = group {\n 3552 |             if workspace_non_trivial {\n 3553 |                 return format!(\n 3554 |                     \" (from workspace member `{package}`'s `tool.uv.dependency-groups.{group}.requires-python`).\"\n 3555 |                 );\n 3556 |             }\n 3557 |             return format!(\" (from `tool.uv.dependency-groups.{group}.requires-python`).\");\n 3558 |         }\n 3559 |         if workspace_non_trivial {\n 3560 |             return format!(\" (from workspace member `{package}`'s `project.requires-python`).\");\n 3561 |         }\n 3562 |         return \" (from `project.requires-python`)\".to_owned();\n 3563 |     }\n 3564 |     // Otherwise don't elaborate\n 3565 |     String::new()\n 3566 | }","lines":3566,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/mod.rs#L1-L3566"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"In `Osv::vuln_cache_entry`, the vulnerability `id` used to build the on-disk cache filename comes directly from the untrusted OSV batch-query response (`VulnSummary.id`, deserialized with no format validation) and is interpolated verbatim into a filename via `format!(\"{id}.msgpack\")`, then joined onto the cache directory with `CacheEntry::new` (`crates/uv-cache/src/lib.rs:57-59`, `dir.into().join(file)`). Because `PathBuf::join` honors `..`/`/` path components, a malicious or compromised vulnerability-service response (reachable via the user-configurable `--service-url` flag, or via a compromised/mirrored `osv.dev`) can supply an id such as `../../../../home/user/.bashrc` to make `fetch_vuln` write the fetched HTTP response (via `CachedClient::get_serde_with_retry` -> `write_atomic`, which does `tempfile_in(path.parent())` then renames into `path` with no path containment check) to an attacker-chosen location outside the intended `CacheBucket::Osv/vulnerability/` directory. This is a path-traversal / arbitrary file write primitive driven entirely by attacker-controlled network data, in a crate whose whole purpose is security auditing. The `types.rs` doc comment for `VulnerabilityID` explicitly says 'No assumptions should be made about the format of these identifiers', confirming the id is treated as opaque data, yet it is used unsanitized as a filesystem path component.","fix":"Validate/sanitize `id` before using it as a filesystem path component in `vuln_cache_entry`, e.g. reject or percent-encode any id containing `/`, `\\`, or `..`, or better, derive the cache filename from a hash of `id` (e.g. `uv_cache_key`) instead of the raw attacker-controlled string:\n```rust\nfn vuln_cache_entry(&self, id: &str) -> CacheEntry {\n    let bucket = self.cache.bucket(CacheBucket::Osv);\n    let safe_name = uv_cache_key::cache_digest(&id);\n    CacheEntry::new(bucket.join(\"vulnerability\"), format!(\"{safe_name}.msgpack\"))\n}\n```\nAlternatively, add a defensive check that `id` contains only the characters expected in vulnerability identifiers (alphanumeric, `-`, `_`, `.`) and return an `Error` otherwise.","locations":[{"ref":"crates/uv-audit/src/service/osv.rs:182-185","code":"  182 | #[derive(Debug, Clone, Deserialize)]\n  183 | struct VulnSummary {\n  184 |     id: String,\n  185 | }","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-audit/src/service/osv.rs#L182-L185"},{"ref":"crates/uv-audit/src/service/osv.rs:260-263","code":"  260 |     fn vuln_cache_entry(&self, id: &str) -> CacheEntry {\n  261 |         let bucket = self.cache.bucket(CacheBucket::Osv);\n  262 |         CacheEntry::new(bucket.join(\"vulnerability\"), format!(\"{id}.msgpack\"))\n  263 |     }","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-audit/src/service/osv.rs#L260-L263"},{"ref":"crates/uv-audit/src/service/osv.rs:394-400","code":"  394 |     async fn fetch_vuln(&self, id: &str) -> Result<Vulnerability, Error> {\n  395 |         let url = self\n  396 |             .base_url\n  397 |             .join(&format!(\"v1/vulns/{id}\"))\n  398 |             .map_err(|e| Error::Url(self.base_url.clone(), e))?;\n  399 | \n  400 |         let cache_entry = self.vuln_cache_entry(id);","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-audit/src/service/osv.rs#L394-L400"},{"ref":"crates/uv-audit/src/types.rs:33-38","code":"   33 | /// An opaque identifier for a vulnerability. These are conventionally\n   34 | /// formatted as `SRC-XXXX-YYYY`, where `SRC` is an identifier for the vulnerability source,\n   35 | /// `XXXX` is typically a year or other \"bucket\" identifier, and `YYYY` is a unique identifier\n   36 | /// within that bucket. For example, `CVE-2026-12345` or `PYSEC-2023-0001`.\n   37 | ///\n   38 | /// No assumptions should be made about the format of these identifiers.","lines":6,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-audit/src/types.rs#L33-L38"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`Osv::fetch_vuln` builds the vulnerability-detail request URL by directly formatting the untrusted, server-supplied `id` into a path segment: `self.base_url.join(&format!(\"v1/vulns/{id}\"))`. Since `Url::join` resolves `..` segments, an id containing traversal sequences (e.g. `../../admin/internal-endpoint`) lets a malicious or compromised vulnerability service redirect uv's own follow-up request to an arbitrary path on the same host (bypassing the intended `v1/vulns/` API surface). Combined with the fact that the batch query endpoint that supplies these ids is queried without any credential handling from the caller's side, this allows a malicious service to steer uv's outgoing requests to unexpected paths on the configured `--service-url` host.","fix":"Validate that `id` cannot alter the URL path structure before using it in `format!(\"v1/vulns/{id}\")`, e.g.:\n```rust\nif id.contains('/') || id.contains('\\\\') || id == \"..\" {\n    return Err(Error::MalformedRecord { id: id.to_string(), .. });\n}\n```\nor URL-encode `id` with `percent_encoding` before interpolating it into the path so that `/` and `..` cannot change the resolved path segments.","locations":[{"ref":"crates/uv-audit/src/service/osv.rs:394-398","code":"  394 |     async fn fetch_vuln(&self, id: &str) -> Result<Vulnerability, Error> {\n  395 |         let url = self\n  396 |             .base_url\n  397 |             .join(&format!(\"v1/vulns/{id}\"))\n  398 |             .map_err(|e| Error::Url(self.base_url.clone(), e))?;","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-audit/src/service/osv.rs#L394-L398"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`TextCredentialStore::write` in `crates/uv-auth/src/store.rs:312-337` writes the entire `credentials.toml` file (which can hold every stored credential across all realms) via a single non-atomic `fs::write(path, content)` call at line 335, acknowledged by the adjacent `// TODO(zanieb): We should use an atomic write here` comment. If the process is interrupted mid-write (crash, kill, power loss, disk full), the file can be left truncated or corrupted, causing the *entire* credential store to fail to parse (or silently lose entries) on next read, unlike a single-realm-scoped failure. This is a real data-loss risk, not just a style nit, since it can wipe out all saved credentials for every configured index.","fix":"Write to a temporary file in the same directory and then atomically rename it into place, e.g. ```rust\nlet tmp = path.as_ref().with_extension(\"toml.tmp\");\nfs::write(&tmp, content)?;\nfs::rename(&tmp, path.as_ref())?;\n``` so a crash mid-write leaves either the old or the new complete file, never a truncated one.","locations":[{"ref":"crates/uv-auth/src/store.rs:312-337","code":"  312 |     pub fn write<P: AsRef<Path>>(\n  313 |         self,\n  314 |         path: P,\n  315 |         _lock: LockedFile,\n  316 |     ) -> Result<(), TomlCredentialError> {\n  317 |         let credentials = self\n  318 |             .credentials\n  319 |             .into_iter()\n  320 |             .map(|((service, _username), credentials)| TomlCredential {\n  321 |                 service,\n  322 |                 credentials,\n  323 |             })\n  324 |             .collect::<Vec<_>>();\n  325 | \n  326 |         let toml_creds = TomlCredentials { credentials };\n  327 |         let content = toml::to_string_pretty(&toml_creds)?;\n  328 |         fs::create_dir_all(\n  329 |             path.as_ref()\n  330 |                 .parent()\n  331 |                 .ok_or(TomlCredentialError::CredentialsDirError)?,\n  332 |         )?;\n  333 | \n  334 |         // TODO(zanieb): We should use an atomic write here\n  335 |         fs::write(path, content)?;\n  336 |         Ok(())\n  337 |     }","lines":26,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-auth/src/store.rs#L312-L337"}]},{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"hard","description":"`cache_digest` (used pervasively for cache directory naming, e.g. `WheelCache::root` in `crates/uv-cache/src/wheel.rs:27-46`) hashes attacker-influenceable input (index URLs, package URLs, path dependency URLs) down to a single 64-bit `SeaHasher` digest with no collision detection or fallback. `SeaHasher` is a fast, non-cryptographic hash, not designed to resist deliberate collision search. Two distinct URLs that collide on this 64-bit digest would be cached under the exact same directory, causing one URL's cached wheel/metadata to be silently served for a completely different URL (cache corruption/poisoning), with no code path anywhere checking that the directory's contents actually correspond to the hashed input.","fix":"Store the original canonicalized URL string (or a longer/cryptographic digest such as truncated `SHA-256`) alongside the cache entry and verify it on read, so a hash collision degrades to a cache miss instead of returning wrong data; alternatively, widen `cache_digest` to use a keyed/cryptographic hash for values derived from external, potentially adversarial input such as index and package URLs.","locations":[{"ref":"crates/uv-cache-key/src/digest.rs:11-20","code":"   11 | pub fn cache_digest<H: CacheKey>(hashable: &H) -> String {\n   12 |     /// Compute a u64 hash of a [`CacheKey`] object.\n   13 |     fn cache_key_u64<H: CacheKey>(hashable: &H) -> u64 {\n   14 |         let mut hasher = CacheKeyHasher::new();\n   15 |         hashable.cache_key(&mut hasher);\n   16 |         hasher.finish()\n   17 |     }\n   18 | \n   19 |     to_hex(cache_key_u64(hashable))\n   20 | }","lines":10,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cache-key/src/digest.rs#L11-L20"},{"ref":"crates/uv-cache/src/wheel.rs:27-47","code":"   27 |     pub fn root(&self) -> PathBuf {\n   28 |         match self {\n   29 |             Self::Index(IndexUrl::Pypi(_)) => WheelCacheKind::Pypi.root(),\n   30 |             Self::Index(url) => WheelCacheKind::Index\n   31 |                 .root()\n   32 |                 .join(cache_digest(&CanonicalUrl::new(url.url().clone()))),\n   33 |             Self::Url(url) => WheelCacheKind::Url\n   34 |                 .root()\n   35 |                 .join(cache_digest(&CanonicalUrl::new((*url).clone()))),\n   36 |             Self::Path(url) => WheelCacheKind::Path\n   37 |                 .root()\n   38 |                 .join(cache_digest(&CanonicalUrl::new((*url).clone()))),\n   39 |             Self::Editable(url) => WheelCacheKind::Editable\n   40 |                 .root()\n   41 |                 .join(cache_digest(&CanonicalUrl::new((*url).clone()))),\n   42 |             Self::Git(url, sha) => WheelCacheKind::Git\n   43 |                 .root()\n   44 |                 .join(cache_digest(&CanonicalUrl::new((*url).clone())))\n   45 |                 .join(sha),\n   46 |         }\n   47 |     }","lines":21,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cache/src/wheel.rs#L27-L47"}]},{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"In the `TrustedPublishing` enum, the `Automatic` variant has a proper `///` doc comment (used by both `clap::ValueEnum` to populate `--trusted-publishing=<VALUE>` possible-value help text, and by `schemars::JsonSchema` for the generated config schema description), but the `Always` and `Never` variants use plain `//` comments instead of `///`. Plain `//` comments are not picked up by either `clap`'s or `schemars`'s derive macros, so `uv publish --help` and the generated JSON schema will show a description for `automatic` but no description at all for `always`/`never`, which is an inconsistent, easily-missed regression risk for anyone extending this enum.","fix":"Change the two plain comments to doc comments so they are picked up by `clap`/`schemars`:\n```rust\n/// Force trusted publishing.\nAlways,\n/// Never try to get a trusted publishing token.\nNever,\n```","locations":[{"ref":"crates/uv-configuration/src/trusted_publishing.rs:13-16","code":"   13 |     // Force trusted publishing.\n   14 |     Always,\n   15 |     // Never try to get a trusted publishing token.\n   16 |     Never,","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-configuration/src/trusted_publishing.rs#L13-L16"}]},{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"In `warn_uv_toml_masked_fields`, every masked field is pushed using its kebab-case TOML key (e.g. `\"cache-dir\"`, `\"override-dependencies\"`) except `cache_keys`, which is pushed as the snake_case identifier `\"cache_keys\"`. The user-facing warning (\"The following fields from `[tool.uv]` will be ignored...\") will therefore list `cache_keys` instead of the actual TOML key `cache-keys`, which is confusing and doesn't match what the user wrote in their file.","fix":"Change `masked_fields.push(\"cache_keys\");` to `masked_fields.push(\"cache-keys\");` to match the kebab-case key used by `#[serde(rename_all = \"kebab-case\")]` and every other entry in this function.","locations":[{"ref":"crates/uv-settings/src/lib.rs:633-635","code":"  633 |     if cache_keys.is_some() {\n  634 |         masked_fields.push(\"cache_keys\");\n  635 |     }","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-settings/src/lib.rs#L633-L635"}]},{"id":"OTHER_7","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`Error::BadUncompressedSize` and `Error::BadCompressedSize` format byte counts (`u64` sizes) with `{computed:08x}` / `{expected:08x}`, i.e. zero-padded hexadecimal. Unlike a CRC32 (where hex is conventional), file sizes are expected to be shown in decimal, so a size mismatch prints e.g. `got 000f4240, expected 00100000`, which is confusing to users. The neighbouring size-related variants (e.g. the `Conflicting*Sizes` ones) correctly print sizes in decimal.","fix":"Drop the `:08x` hex formatting for the size fields, e.g. `\"Bad uncompressed size (got {computed}, expected {expected}) for file: {}\"`, matching the decimal formatting used by the `Conflicting*Sizes` variants.","locations":[{"ref":"crates/uv-extract/src/error.rs:29-40","code":"   29 |     #[error(\"Bad uncompressed size (got {computed:08x}, expected {expected:08x}) for file: {}\", path.display())]\n   30 |     BadUncompressedSize {\n   31 |         path: PathBuf,\n   32 |         computed: u64,\n   33 |         expected: u64,\n   34 |     },\n   35 |     #[error(\"Bad compressed size (got {computed:08x}, expected {expected:08x}) for file: {}\", path.display())]\n
