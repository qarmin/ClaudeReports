<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`UnavailablePackage::from(&MetadataUnavailable)` calls `unreachable!(\"`requires-python` is only known upfront for registry distributions\")` for the `MetadataUnavailable::RequiresPython(..)` variant. That assumption is false for URL/git/path source distributions: `choose_version_url` in `resolver/mod.rs` waits on the built metadata and, on `MetadataResponse::Unavailable(reason)`, inserts `reason.into()` into `unavailable_packages` (a `HashMap<PackageName, UnavailablePackage>`), which selects exactly this `From` impl. When a URL/git/path source dependency declares a `requires-python` that the installed interpreter does not satisfy, `uv_distribution::build_metadata` returns `Error::RequiresPython` (see `uv-distribution/src/source/mod.rs:3160`), which `provider.rs` maps to `MetadataUnavailable::RequiresPython` (`provider.rs:336-339`). That value then reaches `reason.into()` and panics, crashing the resolver on a normal (if narrow) user path instead of reporting a clean incompatibility. The variant's own doc comment (`provider.rs:64-66`) even describes it as a source-distribution condition, contradicting the `unreachable!` rationale.","fix":"Do not funnel a `RequiresPython` metadata failure into the package-level `UnavailablePackage` conversion. Either handle `MetadataUnavailable::RequiresPython` explicitly in `choose_version_url` (e.g., surface it as a version-level `UnavailableVersion::RequiresPython`/incompatible-dist rather than a whole-package unavailability), or replace the `unreachable!()` arm in `impl From<&MetadataUnavailable> for UnavailablePackage` with a real, non-panicking `UnavailablePackage` variant so an incompatible URL source distribution yields a normal resolver error.","locations":[{"ref":"crates/uv-resolver/src/resolver/availability.rs:285-287","code":"  285 |             MetadataUnavailable::RequiresPython(..) => {\n  286 |                 unreachable!(\"`requires-python` is only known upfront for registry distributions\")\n  287 |             }","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/resolver/availability.rs#L285-L287"},{"ref":"crates/uv-resolver/src/resolver/mod.rs:1320-1327","code":" 1320 |         let metadata = match &*response {\n 1321 |             MetadataResponse::Found(archive) => &archive.metadata,\n 1322 |             MetadataResponse::Unavailable(reason) => {\n 1323 |                 self.unavailable_packages\n 1324 |                     .pin()\n 1325 |                     .insert(name.clone(), reason.into());\n 1326 |                 return Ok(None);\n 1327 |             }","lines":8,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/resolver/mod.rs#L1320-L1327"},{"ref":"crates/uv-resolver/src/resolver/provider.rs:336-339","code":"  336 |                 uv_distribution::Error::RequiresPython(requires_python, version) => {\n  337 |                     Ok(MetadataResponse::Unavailable(\n  338 |                         MetadataUnavailable::RequiresPython(requires_python, version),\n  339 |                     ))","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/resolver/provider.rs#L336-L339"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Credentials::to_header_value` builds the `Bearer` `Authorization` header by concatenating the raw token bytes directly (no base64 encoding, unlike the `Basic` branch): `HeaderValue::from_bytes(&[b\"Bearer \", token.as_slice()].concat()).expect(\"Bearer token is always valid HeaderValue\")`. This assumption is false when the token bytes are not valid HTTP header bytes (e.g. contain `\\n`, `\\r`, or NUL). `HuggingFaceProvider::credentials_for` in `crates/uv-auth/src/providers.rs:47-58` constructs exactly such a `Bearer` credential from the `HF_TOKEN` environment variable (`crates/uv-auth/src/providers.rs:27-41`), which is only checked for emptiness, not validated as a legal header value. A user whose `HF_TOKEN` contains a trailing newline (a common mistake when the value is populated via `$(cat token_file)` in a script, or copy-pasted from a file with a trailing newline) will cause `HeaderValue::from_bytes` to return `Err`, and the `.expect(...)` will panic and crash uv instead of producing a clear error.","fix":"Trim/validate the token when it is read from the environment, and make `to_header_value` fallible instead of panicking:\n```rust\n// providers.rs\nlet hf_token = std::env::var(EnvVars::HF_TOKEN)\n    .ok()\n    .map(|token| token.trim().to_string())\n    .map(String::into_bytes)\n    .filter(|token| !token.is_empty())?;\n```\nand in `credentials.rs`, return a `Result` from `to_header_value`/`authenticate` (or reject the token at `Token::new` construction time) rather than calling `.expect(\"Bearer token is always valid HeaderValue\")` on attacker/user-influenced bytes.","locations":[{"ref":"crates/uv-auth/src/credentials.rs:364-369","code":"  364 |             Self::Bearer { token } => {\n  365 |                 let mut header = HeaderValue::from_bytes(&[b\"Bearer \", token.as_slice()].concat())\n  366 |                     .expect(\"Bearer token is always valid HeaderValue\");\n  367 |                 header.set_sensitive(true);\n  368 |                 header\n  369 |             }","lines":6,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-auth/src/credentials.rs#L364-L369"},{"ref":"crates/uv-auth/src/providers.rs:27-41","code":"   27 | static HUGGING_FACE_TOKEN: LazyLock<Option<Vec<u8>>> = LazyLock::new(|| {\n   28 |     // Extract the Hugging Face token from the environment variable, if it exists.\n   29 |     let hf_token = std::env::var(EnvVars::HF_TOKEN)\n   30 |         .ok()\n   31 |         .map(String::into_bytes)\n   32 |         .filter(|token| !token.is_empty())?;\n   33 | \n   34 |     if std::env::var_os(EnvVars::UV_NO_HF_TOKEN).is_some() {\n   35 |         debug!(\"Ignoring Hugging Face token from environment due to `UV_NO_HF_TOKEN`\");\n   36 |         return None;\n   37 |     }\n   38 | \n   39 |     debug!(\"Found Hugging Face token in environment\");\n   40 |     Some(hf_token)\n   41 | });","lines":15,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-auth/src/providers.rs#L27-L41"},{"ref":"crates/uv-auth/src/providers.rs:47-58","code":"   47 | impl HuggingFaceProvider {\n   48 |     /// Returns the credentials for the Hugging Face platform, if available.\n   49 |     pub(crate) fn credentials_for(url: &Url) -> Option<Credentials> {\n   50 |         if RealmRef::from(url) == *HUGGING_FACE_REALM {\n   51 |             if let Some(token) = HUGGING_FACE_TOKEN.as_ref() {\n   52 |                 return Some(Credentials::Bearer {\n   53 |                     token: Token::new(token.clone()),\n   54 |                 });\n   55 |             }\n   56 |         }\n   57 |         None\n   58 |     }","lines":12,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-auth/src/providers.rs#L47-L58"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Timestamp::from_metadata` uses `.expect()` to convert filesystem-provided timestamps into `Timestamp`. On Unix, `metadata.ctime()` and `metadata.ctime_nsec()` return `i64` and are converted with `u64::try_from(...).expect(...)` / `u32::try_from(...).expect(...)`; these panic if the change-time is negative (e.g. before the Unix epoch), which can happen with a misconfigured system clock, some virtualized/CI environments, or unusual filesystems. On other platforms, `metadata.modified().expect(\"modified time to be available\")` panics if the platform/filesystem does not report an mtime. Since `Timestamp::from_path`/`from_metadata` is used throughout cache staleness checks on filesystem-controlled data, any of these conditions crashes the whole `uv` process instead of gracefully falling back or reporting an error.","fix":"Replace the `.expect()` calls with fallible handling, e.g. return an `io::Result<Self>` from `from_metadata`/`from_path` and map failures to an error (or saturate negative `ctime` to `0`/`UNIX_EPOCH` instead of panicking): ```rust\nlet ctime = u64::try_from(metadata.ctime()).unwrap_or(0);\nlet ctime_nsec = u32::try_from(metadata.ctime_nsec()).unwrap_or(0);\n```","locations":[{"ref":"crates/uv-cache-info/src/timestamp.rs:29-31","code":"   29 |                     u64::try_from(metadata.ctime()).expect(\"ctime to be representable as u64\");\n   30 |                 let ctime_nsec = u32::try_from(metadata.ctime_nsec())\n   31 |                     .expect(\"ctime_nsec to be representable as u32\");","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cache-info/src/timestamp.rs#L29-L31"},{"ref":"crates/uv-cache-info/src/timestamp.rs:36","code":"   36 |                 let modified = metadata.modified().expect(\"modified time to be available\");","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cache-info/src/timestamp.rs#L36"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`IndexCacheControl`'s `Serialize` impl calls `HeaderValue::to_str().expect(...)` on values that were originally accepted via `HeaderValue::from_str(...)` during `Deserialize` (see `IndexCacheControlWire` in the same file). `HeaderValue::from_str` permits obs-text bytes (0x80-0xFF, i.e. any non-ASCII UTF-8 continuation byte), but `HeaderValue::to_str()` only accepts visible ASCII and rejects those same bytes. This means a `cache-control.api`/`cache-control.files` value in a `[[tool.uv.index]]` table (e.g. `cache-control = { api = \"café\" }`) parses successfully at config-load time but the `.expect(\"cache-control.api is always parsed from a string\")` comment's invariant is false, so any later `Serialize` of the containing `Index`/`IndexCacheControl` (the derive is public API on `Index`, which itself derives `Serialize`) panics instead of returning a serialization error.","fix":"Replace the `.expect(...)` calls with proper error propagation, e.g. `api.to_str().map_err(|_| serde::ser::Error::custom(\"cache-control.api must be visible ASCII\"))?` inside a fallible serializer, or validate/reject non-ASCII header values at `Deserialize` time (in `IndexCacheControlWire`'s conversion) so the invariant the `.expect()` relies on is actually enforced instead of merely assumed.","locations":[{"ref":"crates/uv-distribution-types/src/index.rs:69-87","code":"   69 | impl Serialize for IndexCacheControl {\n   70 |     fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>\n   71 |     where\n   72 |         S: Serializer,\n   73 |     {\n   74 |         IndexCacheControlRef {\n   75 |             api: self.api.as_ref().map(|api| {\n   76 |                 api.to_str()\n   77 |                     .expect(\"cache-control.api is always parsed from a string\")\n   78 |             }),\n   79 |             files: self.files.as_ref().map(|files| {\n   80 |                 files\n   81 |                     .to_str()\n   82 |                     .expect(\"cache-control.files is always parsed from a string\")\n   83 |             }),\n   84 |         }\n   85 |         .serialize(serializer)\n   86 |     }\n   87 | }","lines":19,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/index.rs#L69-L87"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`PrioritizedDist::built_dist()` (`crates/uv-distribution-types/src/prioritized_distribution.rs:519-542`) filters out excluded wheels while rebuilding `adjusted_wheels`/`adjusted_best_index`, but only updates `adjusted_best_index` when it reaches the loop iteration `i == best_wheel_index`. If the wheel at `best_wheel_index` is itself excluded (`compatibility.is_excluded()`, i.e. `WheelCompatibility::Incompatible(IncompatibleWheel::ExcludeNewer(_))`), the loop `continue`s before that check, so `adjusted_best_index` is left at its initial value of `0`. If every wheel in `self.0.wheels` is excluded this way, `adjusted_wheels` ends up empty while `adjusted_best_index` is still `0`, producing `RegistryBuiltDist { wheels: vec![], best_wheel_index: 0, .. }`. This violates the documented invariants on `RegistryBuiltDist` in `crates/uv-distribution-types/src/lib.rs` (\"It is guaranteed that there is at least one wheel\" / \"This is guaranteed to point into a valid entry in `wheels`\"), and `RegistryBuiltDist::best_wheel()` (`crates/uv-distribution-types/src/lib.rs:801-806`) does `&self.wheels[self.best_wheel_index]`, which would panic with an out-of-bounds index. Today the only two call sites (`crates/uv-resolver/src/resolver/mod.rs:3838` and `crates/uv-distribution-types/src/resolved.rs:132`) happen to only call `built_dist()` after already selecting a `CompatibleDist::CompatibleWheel`/`IncompatibleWheel` (which guarantees the best wheel is not excluded), so the panic is not currently reachable, but the public API itself does not enforce this and is a latent footgun for any future caller.","fix":"Track whether the best wheel survived filtering and bail out instead of defaulting to index `0`:\n```rust\npub fn built_dist(&self) -> Option<RegistryBuiltDist> {\n    let best_wheel_index = self.0.best_wheel_index?;\n\n    let mut adjusted_wheels = Vec::with_capacity(self.0.wheels.len());\n    let mut adjusted_best_index = None;\n    for (i, (wheel, compatibility)) in self.0.wheels.iter().enumerate() {\n        if compatibility.is_excluded() {\n            continue;\n        }\n        if i == best_wheel_index {\n            adjusted_best_index = Some(adjusted_wheels.len());\n        }\n        adjusted_wheels.push(wheel.clone());\n    }\n    let adjusted_best_index = adjusted_best_index?;\n\n    let sdist = self.0.source.as_ref().map(|(sdist, _)| sdist.clone());\n    Some(RegistryBuiltDist {\n        wheels: adjusted_wheels,\n        best_wheel_index: adjusted_best_index,\n        sdist,\n    })\n}\n```\nThis makes `built_dist()` return `None` rather than an `Option`-wrapped value that silently breaks the `RegistryBuiltDist` invariants, so `RegistryBuiltDist::best_wheel()` can never panic even if a future caller invokes `built_dist()` without pre-checking compatibility.","locations":[{"ref":"crates/uv-distribution-types/src/prioritized_distribution.rs:519-542","code":"  519 |     pub fn built_dist(&self) -> Option<RegistryBuiltDist> {\n  520 |         let best_wheel_index = self.0.best_wheel_index?;\n  521 | \n  522 |         // Remove any excluded wheels from the list of wheels, and adjust the wheel index to be\n  523 |         // relative to the filtered list.\n  524 |         let mut adjusted_wheels = Vec::with_capacity(self.0.wheels.len());\n  525 |         let mut adjusted_best_index = 0;\n  526 |         for (i, (wheel, compatibility)) in self.0.wheels.iter().enumerate() {\n  527 |             if compatibility.is_excluded() {\n  528 |                 continue;\n  529 |             }\n  530 |             if i == best_wheel_index {\n  531 |                 adjusted_best_index = adjusted_wheels.len();\n  532 |             }\n  533 |             adjusted_wheels.push(wheel.clone());\n  534 |         }\n  535 | \n  536 |         let sdist = self.0.source.as_ref().map(|(sdist, _)| sdist.clone());\n  537 |         Some(RegistryBuiltDist {\n  538 |             wheels: adjusted_wheels,\n  539 |             best_wheel_index: adjusted_best_index,\n  540 |             sdist,\n  541 |         })\n  542 |     }","lines":24,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/prioritized_distribution.rs#L519-L542"},{"ref":"crates/uv-distribution-types/src/lib.rs:801-806","code":"  801 | impl RegistryBuiltDist {\n  802 |     /// Returns the best or \"most compatible\" wheel in this distribution.\n  803 |     pub fn best_wheel(&self) -> &RegistryBuiltWheel {\n  804 |         &self.wheels[self.best_wheel_index]\n  805 |     }\n  806 | }","lines":6,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/lib.rs#L801-L806"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`VerbatimUrl::as_path` panics on its own error path instead of returning an error. When `self.url.to_file_path()` returns `Err(())` (i.e. the URL is not a file URL), the `map_err` closure calls `self.url.to_file_path().unwrap()` on the same failing call, which panics. So a public `pub fn as_path(&self) -> Result<PathBuf, VerbatimUrlError>` that is documented/typed to return an error for non-file URLs will instead abort the process. Today's in-tree callers (`parsed_url.rs`) happen to construct the `VerbatimUrl` from a path so the URL is always a file URL, but any other caller (or a future one) passing a non-file `VerbatimUrl` triggers the panic.","fix":"Do not re-invoke and `unwrap()` the failing conversion. Build the error from the URL string instead, e.g. `.map_err(|()| VerbatimUrlError::UrlConversion(PathBuf::from(self.url.as_str())))`.","locations":[{"ref":"crates/uv-pep508/src/verbatim_url.rs:310-315","code":"  310 |     #[cfg(feature = \"non-pep508-extensions\")]\n  311 |     pub fn as_path(&self) -> Result<PathBuf, VerbatimUrlError> {\n  312 |         self.url\n  313 |             .to_file_path()\n  314 |             .map_err(|()| VerbatimUrlError::UrlConversion(self.url.to_file_path().unwrap()))\n  315 |     }","lines":6,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/verbatim_url.rs#L310-L315"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `fetch_from_url`, when `UV_PYTHON_CACHE_DIR` is set, the cache filename prefix is built with `&sha[..9]` on `self.sha256`. The `sha256` value is deserialized directly from the download metadata JSON (`JsonPythonDownload.sha256: Option<String>` at line 967, stored at line 1687) with no length or hex validation. A custom download list supplied via `--python-downloads-json-url`/`UV_PYTHON_DOWNLOADS_JSON_URL` (or a `file://`/path source) can contain a `sha256` shorter than 9 bytes (or with a multi-byte char straddling byte index 9), causing `&sha[..9]` to panic with a byte-index/char-boundary slice error. The test helper `cpython_download_for_url` at line 2316 already uses a 6-character sha (`\"abc123\"`), demonstrating such values are plausible.","fix":"Guard the slice, e.g. replace `&sha[..9]` with `sha.get(..9).unwrap_or(sha)` (or `&sha[..sha.len().min(9)]` guarded to a char boundary), so a short or non-ASCII `sha256` cannot panic. Alternatively validate that `sha256` is a 64-char hex string when parsing `JsonPythonDownload`.","locations":[{"ref":"crates/uv-python/src/downloads.rs:1268-1274","code":" 1268 |             let hash_prefix = match self.sha256.as_deref() {\n 1269 |                 Some(sha) => {\n 1270 |                     // Shorten the hash to avoid too-long-filename errors\n 1271 |                     &sha[..9]\n 1272 |                 }\n 1273 |                 None => \"none\",\n 1274 |             };","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/downloads.rs#L1268-L1274"},{"ref":"crates/uv-python/src/downloads.rs:1687-1687","code":" 1687 |             let sha256 = entry.sha256.map(Cow::Owned);","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/downloads.rs#L1687"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`PyxTokenStore::read` in `crates/uv-auth/src/pyx.rs:358-364` reads the on-disk API-key token file and calls `String::from_utf8(data).expect(\"Invalid UTF-8\")` at line 360. The corresponding `write` (`crates/uv-auth/src/pyx.rs:319-327`) persists the token via a plain, non-atomic `fs_err::tokio::write`, with no temp-file-plus-rename. If the write is interrupted (process kill, crash, power loss, disk full) partway through, the file can be left truncated, potentially splitting a multi-byte UTF-8 sequence or leaving arbitrary partial bytes. On the next run, `read()` will panic instead of returning a `TokenStoreError`, crashing `uv` rather than triggering a graceful re-authentication.","fix":"Replace `AccessToken::from(String::from_utf8(data).expect(\"Invalid UTF-8\"))` with a fallible conversion that returns `TokenStoreError`, e.g. `AccessToken::from(String::from_utf8(data).map_err(|err| TokenStoreError::Io(io::Error::new(io::ErrorKind::InvalidData, err)))?)`, and treat the resulting error the same as a missing/expired token (trigger a fresh bootstrap) rather than propagating a hard failure.","locations":[{"ref":"crates/uv-auth/src/pyx.rs:353-379","code":"  353 |     pub async fn read(&self) -> Result<Option<PyxTokens>, TokenStoreError> {\n  354 |         if let Some(api_key) = read_pyx_api_key() {\n  355 |             // Read the API key tokens from a file based on the API key.\n  356 |             let digest = uv_cache_key::cache_digest(&api_key);\n  357 |             match fs_err::tokio::read(self.subdirectory.join(format!(\"{digest}.json\"))).await {\n  358 |                 Ok(data) => {\n  359 |                     let access_token =\n  360 |                         AccessToken::from(String::from_utf8(data).expect(\"Invalid UTF-8\"));\n  361 |                     Ok(Some(PyxTokens::ApiKey(PyxApiKeyTokens {\n  362 |                         access_token,\n  363 |                         api_key,\n  364 |                     })))\n  365 |                 }\n  366 |                 Err(err) if err.kind() == io::ErrorKind::NotFound => Ok(None),\n  367 |                 Err(err) => Err(err.into()),\n  368 |             }\n  369 |         } else {\n  370 |             match fs_err::tokio::read(self.subdirectory.join(\"tokens.json\")).await {\n  371 |                 Ok(data) => {\n  372 |                     let tokens: PyxOAuthTokens = serde_json::from_slice(&data)?;\n  373 |                     Ok(Some(PyxTokens::OAuth(tokens)))\n  374 |                 }\n  375 |                 Err(err) if err.kind() == io::ErrorKind::NotFound => Ok(None),\n  376 |                 Err(err) => Err(err.into()),\n  377 |             }\n  378 |         }\n  379 |     }","lines":27,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-auth/src/pyx.rs#L353-L379"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`TomlCredentialWire::from(TomlCredential)` in `crates/uv-auth/src/store.rs:157-176` unconditionally calls `String::from_utf8(token.into_bytes()).expect(\"Token is valid UTF-8\")` at line 172 when converting a `Credentials::Bearer` entry for TOML serialization. `Token` is backed by `Vec<u8>` (`crates/uv-auth/src/credentials.rs`) and is constructed from raw, unchecked bytes elsewhere in the crate (e.g. `Credentials::from_header_value` builds a `Bearer` token directly from `header.as_bytes()` without any UTF-8 validation). If such a token is ever routed into the plaintext credential store (e.g. via `uv auth login`/token import flows), persisting it will panic instead of returning an error. Notably, `TomlCredentialError` already defines a `TokenNotUnicode(#[from] std::string::FromUtf8Error)` variant seemingly intended for exactly this case, but it is unreachable here because the conversion is implemented as an infallible `From` impl rather than `TryFrom`, so the `.expect()` is used instead of propagating the error.","fix":"Change `impl From<TomlCredential> for TomlCredentialWire` to `impl TryFrom<TomlCredential> for TomlCredentialWire` (updating call sites, e.g. inside `TomlCredentials`/`write`, to propagate the error), and replace `String::from_utf8(token.into_bytes()).expect(\"Token is valid UTF-8\")` with `String::from_utf8(token.into_bytes()).map_err(TomlCredentialError::TokenNotUnicode)?`, reusing the already-defined `TomlCredentialError::TokenNotUnicode` variant instead of panicking.","locations":[{"ref":"crates/uv-auth/src/store.rs:157-176","code":"  157 | impl From<TomlCredential> for TomlCredentialWire {\n  158 |     fn from(value: TomlCredential) -> Self {\n  159 |         match value.credentials {\n  160 |             Credentials::Basic { username, password } => Self {\n  161 |                 service: value.service,\n  162 |                 username,\n  163 |                 scheme: AuthScheme::Basic,\n  164 |                 password,\n  165 |                 token: None,\n  166 |             },\n  167 |             Credentials::Bearer { token } => Self {\n  168 |                 service: value.service,\n  169 |                 username: Username::new(None),\n  170 |                 scheme: AuthScheme::Bearer,\n  171 |                 password: None,\n  172 |                 token: Some(String::from_utf8(token.into_bytes()).expect(\"Token is valid UTF-8\")),\n  173 |             },\n  174 |         }\n  175 |     }\n  176 | }","lines":20,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-auth/src/store.rs#L157-L176"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`ModuleMap::from_str` in `crates/uv-build-frontend/src/pipreqs.rs` calls `PackageName::from_str(package.trim()).unwrap()` while parsing the bundled `pipreqs/mapping` data file (loaded via `include_str!` into the `MODULE_MAPPING` `LazyLock`). The mapping is compiled-in data maintained by hand, and nothing in the crate validates at build/test time that every `package` entry on the right-hand side of `:` parses as a valid `PackageName`. If a future edit to `crates/uv-build-frontend/src/pipreqs/mapping` introduces a malformed package name (e.g. a stray character, empty value, or bad line), the `unwrap()` will panic the first time `MODULE_MAPPING.lookup` is invoked -- which happens deep inside error-hint generation for a failed build (`Error::from_command_output` in `crates/uv-build-frontend/src/error.rs`), turning what should be a normal build-failure error message into an uv panic/crash. Because `MODULE_MAPPING` is a `LazyLock`, the panic would also poison the lock for any later access within the same process.","fix":"Replace the `unwrap()` with graceful handling so a malformed mapping line degrades instead of crashing the whole process, e.g.:\n```rust\nfor line in source.lines() {\n    if let Some((module, package)) = line.split_once(':') {\n        let module = module.trim();\n        match PackageName::from_str(package.trim()) {\n            Ok(package) => { mapping.insert(module, package); }\n            Err(err) => tracing::warn!(\"Invalid package name in pipreqs mapping: {err}\"),\n        }\n    }\n}\n```\nAdditionally, add a `#[test]` that eagerly forces `MODULE_MAPPING` and asserts it parses without error, so a bad entry is caught in CI instead of at runtime.","locations":[{"ref":"crates/uv-build-frontend/src/pipreqs.rs:12-22","code":"   12 |     fn from_str(source: &'a str) -> Self {\n   13 |         let mut mapping = FxHashMap::default();\n   14 |         for line in source.lines() {\n   15 |             if let Some((module, package)) = line.split_once(':') {\n   16 |                 let module = module.trim();\n   17 |                 let package = PackageName::from_str(package.trim()).unwrap();\n   18 |                 mapping.insert(module, package);\n   19 |             }\n   20 |         }\n   21 |         Self(mapping)\n   22 |     }","lines":11,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-build-frontend/src/pipreqs.rs#L12-L22"},{"ref":"crates/uv-build-frontend/src/pipreqs.rs:31-32","code":"   31 | pub(crate) static MODULE_MAPPING: LazyLock<ModuleMap> =\n   32 |     LazyLock::new(|| ModuleMap::from_str(include_str!(\"pipreqs/mapping\")));","lines":2,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-build-frontend/src/pipreqs.rs#L31-L32"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`MacKeychainDomain::FromStr` accepts `\"protected\"` and `\"data protection\"` and maps them to `MacKeychainDomain::Protected`, and `MacCredentialBuilder::build` will happily construct a credential with that domain (`target.parse().unwrap_or(MacKeychainDomain::User)`). However, `get_keychain` has `MacKeychainDomain::Protected => panic!(\"Protected is not a keychain domain on macOS\")`, so any subsequent `set`/`get`/`delete` on such a credential panics. It is unreachable from uv today because uv only calls `Entry::new` (which always passes `target = None`, yielding `User`), but it is a latent panic reachable through the public builder API whenever a `\"protected\"` target string is supplied.","fix":"Either drop the `Protected` variant entirely (and reject `\"protected\"`/`\"data protection\"` in `FromStr`), or return a recoverable error from `get_keychain` for `Protected` instead of panicking, e.g. `MacKeychainDomain::Protected => return Err(ErrorCode::Invalid(\"target\".to_string(), \"the Protected/data-protection keychain is not supported\".to_string()))`.","locations":[{"ref":"crates/uv-keyring/src/macos.rs:306-313","code":"  306 | fn get_keychain(domain: MacKeychainDomain) -> Result<SecKeychain> {\n  307 |     let domain = match domain {\n  308 |         MacKeychainDomain::User => SecPreferencesDomain::User,\n  309 |         MacKeychainDomain::System => SecPreferencesDomain::System,\n  310 |         MacKeychainDomain::Common => SecPreferencesDomain::Common,\n  311 |         MacKeychainDomain::Dynamic => SecPreferencesDomain::Dynamic,\n  312 |         MacKeychainDomain::Protected => panic!(\"Protected is not a keychain domain on macOS\"),\n  313 |     };","lines":8,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-keyring/src/macos.rs#L306-L313"},{"ref":"crates/uv-keyring/src/macos.rs:290-303","code":"  290 |     fn from_str(s: &str) -> Result<Self> {\n  291 |         match s.to_ascii_lowercase().as_str() {\n  292 |             \"user\" => Ok(Self::User),\n  293 |             \"system\" => Ok(Self::System),\n  294 |             \"common\" => Ok(Self::Common),\n  295 |             \"dynamic\" => Ok(Self::Dynamic),\n  296 |             \"protected\" => Ok(Self::Protected),\n  297 |             \"data protection\" => Ok(Self::Protected),\n  298 |             _ => Err(ErrorCode::Invalid(\n  299 |                 \"target\".to_string(),\n  300 |                 format!(\"'{s}' is not User, System, Common, Dynamic, or Protected\"),\n  301 |             )),\n  302 |         }\n  303 |     }","lines":14,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-keyring/src/macos.rs#L290-L303"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`ParsedGitPathUrl::try_from` calls `get_install_path(&url_in).unwrap()`. The only in-tree caller (`ParsedUrl::try_from`) guards this with `if get_install_path(&url).is_some()`, but `ParsedGitPathUrl` and its `TryFrom<DisplaySafeUrl>` impl are `pub`, so any direct call on a `git+` URL lacking a `#path=` fragment panics instead of returning an error. This violates the repo guideline against `.unwrap()`.","fix":"Replace `.unwrap()` with a proper error, e.g. `let install_path = get_install_path(&url_in).ok_or_else(|| ParsedUrlError::MissingGitPrefix(url_in.to_string()))?;` (or add a dedicated error variant), matching the fallible style used elsewhere in the file.","locations":[{"ref":"crates/uv-pypi-types/src/parsed_url.rs:337-354","code":"  337 |     fn try_from(url_in: DisplaySafeUrl) -> Result<Self, Self::Error> {\n  338 |         let install_path = get_install_path(&url_in).unwrap();\n  339 |         let ext = DistExtension::from_path(&install_path)\n  340 |             .map_err(|err| ParsedUrlError::MissingExtensionPath(install_path.clone(), err))?;\n  341 | \n  342 |         let url = url_in\n  343 |             .as_str()\n  344 |             .strip_prefix(\"git+\")\n  345 |             .unwrap_or(url_in.as_str());\n  346 |         let url = DisplaySafeUrl::parse(url)\n  347 |             .map_err(|err| ParsedUrlError::UrlParse(url.to_string(), err))?;\n  348 |         let url = GitUrl::try_from(url)?;\n  349 |         Ok(Self {\n  350 |             url,\n  351 |             install_path,\n  352 |             ext,\n  353 |         })\n  354 |     }","lines":18,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pypi-types/src/parsed_url.rs#L337-L354"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`ManagedPythonInstallation::implementation()` calls `panic!` for the `LenientImplementationName::Unknown` case. However `from_path` builds the key via `PythonInstallationKey::from_str`, which uses `LenientImplementationName::from(...)` and accepts unknown implementation names. A directory such as `foobar-3.10.0-linux-x86_64-gnu` inside the managed Python root therefore parses successfully in `find_all` (not treated as malformed, not skipped), and any subsequent call to `implementation()`, `executable()`, or `ensure_sysconfig_patched()` on it panics instead of erroring gracefully, contrary to the project guideline of avoiding `panic!`.","fix":"Make `implementation()` fallible and propagate the error, or reject unknown implementations in `from_path` so `find_all` filters such directories out via the existing `warn!` path rather than allowing a later panic.","locations":[{"ref":"crates/uv-python/src/managed.rs:469-476","code":"  469 |     pub fn implementation(&self) -> ImplementationName {\n  470 |         match self.key.implementation().into_owned() {\n  471 |             LenientImplementationName::Known(implementation) => implementation,\n  472 |             LenientImplementationName::Unknown(_) => {\n  473 |                 panic!(\"Managed Python installations should have a known implementation\")\n  474 |             }\n  475 |         }\n  476 |     }","lines":8,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/managed.rs#L469-L476"},{"ref":"crates/uv-python/src/managed.rs:328-355","code":"  328 |     fn from_path(path: impl AsRef<Path>) -> Result<Self, Error> {\n  329 |         let path = path.as_ref();\n  330 | \n  331 |         let key = PythonInstallationKey::from_str(\n  332 |             path.file_name()\n  333 |                 .ok_or(Error::NameError(\"name is empty\".to_string()))?\n  334 |                 .to_str()\n  335 |                 .ok_or(Error::NameError(\"not a valid string\".to_string()))?,\n  336 |         )?;\n  337 | \n  338 |         let path = std::path::absolute(path)\n  339 |             .map_err(|err| Error::AbsolutePath(path.to_path_buf(), err))?;\n  340 | \n  341 |         // Try to read the BUILD file if it exists\n  342 |         let build = match fs::read_to_string(path.join(\"BUILD\")) {\n  343 |             Ok(content) => Some(Cow::Owned(content.trim().to_string())),\n  344 |             Err(err) if err.kind() == io::ErrorKind::NotFound => None,\n  345 |             Err(err) => return Err(err.into()),\n  346 |         };\n  347 | \n  348 |         Ok(Self {\n  349 |             path,\n  350 |             key,\n  351 |             url: None,\n  352 |             sha256: None,\n  353 |             build,\n  354 |         })\n  355 |     }","lines":28,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/managed.rs#L328-L355"}]},{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `patch_sysconfigdata::update_prefix`, when a whitespace-separated token starts with `/install` and has trailing content, the code does `real_prefix.join(&rest[1..])`, assuming `rest[0]` is exactly a `/` byte. This is unsound in two ways: (1) if the character following `/install` is a multi-byte UTF-8 char, slicing `rest[1..]` falls on a non-char-boundary and panics; (2) if `/install` is a prefix of a longer word rather than a path segment (e.g. `/installers`), `rest[1..]` drops the first character and produces a corrupted path. These values come from external `_sysconfigdata_` files patched during `uv python install`.","fix":"Match on the path separator explicitly instead of slicing. Strip `/install` then `rest.strip_prefix('/')`: if `rest` is empty use `real_prefix`, if it starts with `/` join the remainder, otherwise leave the token unchanged.","locations":[{"ref":"crates/uv-python/src/sysconfig/mod.rs:148-153","code":"  148 |                 if let Some(rest) = part.strip_prefix(\"/install\") {\n  149 |                     if rest.is_empty() {\n  150 |                         real_prefix.display().to_string()\n  151 |                     } else {\n  152 |                         real_prefix.join(&rest[1..]).display().to_string()\n  153 |                     }","lines":6,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/sysconfig/mod.rs#L148-L153"}]},{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `LookaheadResolver::lookahead`, when `self.index.distributions().register_or_wait(&id).await` returns `Some(response)` (another task already populated the shared `InMemoryIndex` entry for this distribution id), the code assumes the response is `MetadataResponse::Found` and does `panic!(\"Failed to find metadata for: {requirement}\")` otherwise. `MetadataResponse` also has `Unavailable` and `Error` variants, and the `InMemoryIndex` is shared with the main resolver which populates non-`Found` responses. If a non-`Found` entry for the same URL distribution id is present when lookahead runs, this aborts the process instead of returning an error. `SourceTreeResolver::resolve_requires_dist` has the identical pattern.","fix":"Replace the `panic!` with error propagation: match the `MetadataResponse` and convert `Unavailable`/`Error` into the crate `Error` (e.g. via `Error::from_dist` or a dedicated variant), returning `Err(..)`.","locations":[{"ref":"crates/uv-requirements/src/lookahead.rs:171-174","code":"  171 |             if let Some(response) = self.index.distributions().register_or_wait(&id).await {\n  172 |                 let MetadataResponse::Found(archive) = &*response else {\n  173 |                     panic!(\"Failed to find metadata for: {requirement}\");\n  174 |                 };","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-requirements/src/lookahead.rs#L171-L174"},{"ref":"crates/uv-requirements/src/source_tree.rs:223-226","code":"  223 |             if let Some(response) = self.index.distributions().register_or_wait(&id).await {\n  224 |                 let MetadataResponse::Found(archive) = &*response else {\n  225 |                     panic!(\"Failed to find metadata for: {}\", path.user_display());\n  226 |                 };","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-requirements/src/source_tree.rs#L223-L226"}]},{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`from_resolution` and `from_lock` call `dist.git.precise().unwrap_or_else(|| panic!(\"Git distribution is missing a precise hash: {dist}\"))` when building `PylockTomlVcs.commit_id`. This relies on the invariant that every locked/resolved Git distribution carries a precise commit. If that invariant is ever violated (e.g. a hand-edited or future lockfile with a Git source lacking a resolved commit), export aborts the whole process with a panic instead of returning a `PylockTomlErrorKind`. AGENTS.md explicitly discourages `panic!`.","fix":"Return a proper error rather than panicking, e.g. add a `PylockTomlErrorKind::MissingGitPrecise(PackageName)` variant and use `dist.git.precise().ok_or_else(|| PylockTomlErrorKind::MissingGitPrecise(package.name.clone()))?`.","locations":[{"ref":"crates/uv-resolver/src/lock/export/pylock_toml.rs:543-545","code":"  543 |                         commit_id: dist.git.precise().unwrap_or_else(|| {\n  544 |                             panic!(\"Git distribution is missing a precise hash: {dist}\")\n  545 |                         }),","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/lock/export/pylock_toml.rs#L543-L545"},{"ref":"crates/uv-resolver/src/lock/export/pylock_toml.rs:845-847","code":"  845 |                     commit_id: sdist.git.precise().unwrap_or_else(|| {\n  846 |                         panic!(\"Git distribution is missing a precise hash: {sdist}\")\n  847 |                     }),","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/lock/export/pylock_toml.rs#L845-L847"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The `Display` impl for `RequirementsTxtExport` maps almost every failure to `std::fmt::Error` (e.g. `url.to_url().map_err(|_| std::fmt::Error)`), but two spots panic via `.expect(...)` instead: `.expect(\"registry package without version\")` when a registry package lacks a version (line 79) and `.expect(\"Internal Git URLs must have supported schemes\")` when reconstructing a `GitUrl` from a git source (line 96). Both rely on lock-file invariants; if a corrupt/hand-edited `uv.lock` violated them, `uv export` would abort with a panic instead of surfacing a formatting error like the surrounding code does.","fix":"Convert these to recoverable errors consistent with the rest of the function: e.g. `let version = package.id.version.as_ref().ok_or(std::fmt::Error)?;` and `.map_err(|_| std::fmt::Error)?` on `GitUrl::from_commit`, so malformed lock data yields a clean error rather than a panic during formatting.","locations":[{"ref":"crates/uv-resolver/src/lock/export/requirements_txt.rs:75-96","code":"   75 |                     let version = package\n   76 |                         .id\n   77 |                         .version\n   78 |                         .as_ref()\n   79 |                         .expect(\"registry package without version\");\n   80 |                     write!(f, \"{}=={}\", package.id.name, version)?;\n   81 |                 }\n   82 |                 Source::Git(url, git) => {\n   83 |                     // Remove the fragment and query from the URL; they're already present in the\n   84 |                     // `GitSource`.\n   85 |                     let mut url = url.to_url().map_err(|_| std::fmt::Error)?;\n   86 |                     url.set_fragment(None);\n   87 |                     url.set_query(None);\n   88 | \n   89 |                     // Reconstruct the `GitUrl` from the `GitSource`.\n   90 |                     let git_url = uv_git_types::GitUrl::from_commit(\n   91 |                         url,\n   92 |                         GitReference::from(git.kind.clone()),\n   93 |                         git.precise,\n   94 |                         git.lfs,\n   95 |                     )\n   96 |                     .expect(\"Internal Git URLs must have supported schemes\");","lines":22,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/lock/export/requirements_txt.rs#L75-L96"}]},{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `Lock::satisfies`, the workspace-member lookup uses `self.find_by_name(root_name).expect(\"found too many packages matching root\")`. `find_by_name` returns `Err` when two packages in the lock share the same name (which can occur in a hand-edited or corrupted `uv.lock`, or a forked-resolution entry that collides with a workspace-member name). Because this runs on user-facing commands (`uv lock --check`, `uv sync`), a bad lock causes an internal `panic!` instead of a graceful error. Notably, the sibling code in `installable.rs` handles the *identical* `find_by_name` result by mapping to `LockErrorKind::MultipleRootPackages`, so this `expect` is an inconsistency, and the project guidance in `AGENTS.md` explicitly says to avoid `.unwrap()`/`panic!` and prefer fallibility.","fix":"Replace the `.expect(...)` with a proper error, mirroring `installable.rs`:\n```rust\nlet root = self\n    .find_by_name(root_name)\n    .map_err(|_| LockErrorKind::MultipleRootPackages { name: root_name.clone() })?;\n```\nThis returns the already-defined `MultipleRootPackages` variant instead of aborting the process.","locations":[{"ref":"crates/uv-resolver/src/lock/mod.rs:1867-1875","code":" 1867 |         for root_name in packages.keys() {\n 1868 |             let root = self\n 1869 |                 .find_by_name(root_name)\n 1870 |                 .expect(\"found too many packages matching root\");\n 1871 | \n 1872 |             let Some(root) = root else {\n 1873 |                 // The package is not in the lockfile, so it can't be satisfied.\n 1874 |                 return Ok(SatisfiesResult::MissingRoot(root_name.clone()));\n 1875 |             };","lines":9,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/lock/mod.rs#L1867-L1875"}]},{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"On non-Unix targets (Windows), `RunCommand::PythonStdin` and `RunCommand::PythonGuiStdin` convert the raw stdin bytes with `String::from_utf8(script.clone()).expect(\"script is valid UTF-8\")`. The stdin content is fully external input (`uv run -` reads it via `read_to_end`), so piping non-UTF-8 bytes as the script on Windows panics the process instead of producing a clean error. AGENTS.md explicitly discourages `.expect()`/`panic!` on fallible paths.","fix":"Replace the `.expect(\"script is valid UTF-8\")` with a graceful error, e.g. bail out via an `anyhow`/typed error (`String::from_utf8(script.clone()).map_err(|_| anyhow!(\"Script provided via stdin is not valid UTF-8\"))?`) by having `as_command` return `Result<Command>`, or otherwise reject non-UTF-8 stdin before reaching this point.","locations":[{"ref":"crates/uv/src/commands/project/run.rs:1783-1786","code":" 1783 |                         let script =\n 1784 |                             String::from_utf8(script.clone()).expect(\"script is valid UTF-8\");\n 1785 |                         process.arg(script);\n 1786 |                     },","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/run.rs#L1783-L1786"},{"ref":"crates/uv/src/commands/project/run.rs:1813-1817","code":" 1813 |                     _ => {\n 1814 |                         let script =\n 1815 |                             String::from_utf8(script.clone()).expect(\"script is valid UTF-8\");\n 1816 |                         process.arg(script);\n 1817 |                     },","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/run.rs#L1813-L1817"}]},{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`Pep723ItemRef::directory` calls `.parent().expect(\"script path has no parent\")` on `std::path::absolute(&script.path)?`. This is effectively unreachable because `script.path` is always produced via `std::path::absolute(...)` of a file path (so it ends in a filename component and has a parent), but it is a `panic`-on-`None` in an otherwise fallible function that returns `io::Error`; a filesystem-root-like path would panic rather than error.","fix":"Replace the `expect` with a graceful error, e.g. return `io::Error::new(io::ErrorKind::InvalidInput, ...)` (or fall back to `current_dir()`) when `parent()` is `None`, keeping the function panic-free per project guidelines.","locations":[{"ref":"crates/uv-scripts/src/lib.rs:89-97","code":"   89 |     pub fn directory(&self) -> Result<PathBuf, io::Error> {\n   90 |         match self {\n   91 |             Self::Script(script) => Ok(std::path::absolute(&script.path)?\n   92 |                 .parent()\n   93 |                 .expect(\"script path has no parent\")\n   94 |                 .to_owned()),\n   95 |             Self::Stdin(..) | Self::Remote(..) => std::env::current_dir(),\n   96 |         }\n   97 |     }","lines":9,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-scripts/src/lib.rs#L89-L97"}]},{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"The `normalize-pe-timestamps` build helper indexes into the PE byte buffer using values read directly from the PE headers without bounds checks (`data[payload + 4..payload + 20]`, `data[payload + 20..payload + 24]`, `data[timestamp_offset..timestamp_offset + 4]`), and `rva_to_file_offset` computes `section.virtual_address + section.virtual_size` which can overflow `u32` (panicking in debug builds). A malformed/truncated PE causes an index-out-of-bounds panic or arithmetic overflow. Impact is limited because this is an internal build tool operating on freshly-built trampoline binaries, not shipped uv runtime code.","fix":"Use checked slicing (`data.get_mut(payload + 4..payload + 20)`) and `checked_add`/`saturating_add` for the RVA range comparison in `rva_to_file_offset`, returning an `anyhow` error via `bail!`/`format_err!` on out-of-range values instead of indexing/adding directly.","locations":[{"ref":"crates/uv-trampoline-builder/src/bin/normalize-pe-timestamps.rs:31-39","code":"   31 | fn rva_to_file_offset(sections: &[SectionTable], rva: u32) -> Option<usize> {\n   32 |     sections.iter().find_map(|section| {\n   33 |         if rva >= section.virtual_address && rva < section.virtual_address + section.virtual_size {\n   34 |             Some((rva - section.virtual_address + section.pointer_to_raw_data) as usize)\n   35 |         } else {\n   36 |             None\n   37 |         }\n   38 |     })\n   39 | }","lines":9,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-trampoline-builder/src/bin/normalize-pe-timestamps.rs#L31-L39"},{"ref":"crates/uv-trampoline-builder/src/bin/normalize-pe-timestamps.rs:83-93","code":"   83 |     for entry in debug_entries {\n   84 |         // Zero `IMAGE_DEBUG_DIRECTORY.time_date_stamp` (offset 4 in the struct).\n   85 |         let timestamp_offset = entry.entry_file_offset + 4;\n   86 |         data[timestamp_offset..timestamp_offset + 4].fill(0);\n   87 | \n   88 |         if entry.data_type == IMAGE_DEBUG_TYPE_CODEVIEW {\n   89 |             // PDB70 layout: magic[4] (\"RSDS\") | guid[16] | age[4] | filename...\n   90 |             let payload = entry.pointer_to_raw_data as usize;\n   91 |             data[payload + 4..payload + 20].fill(0); // Signature (GUID)\n   92 |             data[payload + 20..payload + 24].fill(0); // Age\n   93 |         }","lines":11,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-trampoline-builder/src/bin/normalize-pe-timestamps.rs#L83-L93"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`parse_json_downloads` turns each entry's `build` string into a `&'static str` via `Box::leak(s.into_boxed_str())`. This deliberately leaks one allocation per download entry every time a `ManagedPythonDownloadList` is constructed. For the short-lived CLI and the embedded list this is negligible, but `ManagedPythonDownloadList::new` can be called repeatedly (e.g. per resolution / when uv is used as a library, or with a remote JSON list), so the leaked `build` strings accumulate unboundedly across constructions.","fix":"Store `build` as an owned `Option<String>` (or `Arc<str>`) on `ManagedPythonDownload` instead of leaking to `&'static str`, and adjust the `build()` accessor accordingly, so repeated list construction does not leak.","locations":[{"ref":"crates/uv-python/src/downloads.rs:1688-1690","code":" 1688 |             let build = entry\n 1689 |                 .build\n 1690 |                 .map(|s| Box::leak(s.into_boxed_str()) as &'static str);","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/downloads.rs#L1688-L1690"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `wheel_metadata_from_remote_zip`, the byte range used to prefetch the `METADATA` file from a remote wheel zip is computed with plain, unchecked `u64` arithmetic over values taken directly from the (network-controlled) zip central directory record: `metadata_entry.compressed_size() + 30 + metadata_entry.filename().as_bytes().len() as u64`, then `size.div_ceil(buffer_size) * buffer_size`, then `offset + size`. `compressed_size()` and `header_offset()` both come from `astral_async_zip`'s parsed central directory and are fully attacker/server controlled (a malicious or compromised index/mirror can serve a wheel with a crafted, near-`u64::MAX` `compressed_size`). In debug/test builds (`overflow-checks = true` is Cargo's default for the `dev` profile, and `AGENTS.md` in this repo explicitly discourages release-profile builds during development) this addition/multiplication panics, crashing the fetch task. In release builds the arithmetic silently wraps, producing a nonsensical `offset..offset+size` range; this happens to be handled gracefully by `AsyncHttpRangeReader::prefetch` (it clamps `end` and returns early when `start >= end`), so release builds degrade to a fetch/parse error rather than a crash, but the inconsistency with the `saturating_sub` used two lines above (`reader.len().saturating_sub(CENTRAL_DIRECTORY_SIZE)`) shows the overflow was not deliberately accounted for here.","fix":"Use checked/saturating arithmetic consistent with the existing `saturating_sub` pattern in the same function, e.g.:\n```rust\nlet size = metadata_entry\n    .compressed_size()\n    .saturating_add(30)\n    .saturating_add(metadata_entry.filename().as_bytes().len() as u64);\nlet size = size.div_ceil(buffer_size).saturating_mul(buffer_size);\nreader\n    .inner_mut()\n    .get_mut()\n    .get_mut()\n    .prefetch(offset..offset.saturating_add(size))\n    .await;\n```\nOptionally also validate `offset`/`size` against `reader.len()` up front and return an `ErrorKind::Zip`/`ErrorKind::Metadata` error instead of silently truncating, so corrupt/malicious zip metadata surfaces as a clear error rather than a best-effort no-op fetch.","locations":[{"ref":"crates/uv-client/src/remote_metadata.rs:59-61","code":"   59 |     reader\n   60 |         .prefetch(reader.len().saturating_sub(CENTRAL_DIRECTORY_SIZE)..reader.len())\n   61 |         .await;","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-client/src/remote_metadata.rs#L59-L61"},{"ref":"crates/uv-client/src/remote_metadata.rs:80-96","code":"   80 |     let offset = metadata_entry.header_offset();\n   81 |     let size = metadata_entry.compressed_size()\n   82 |         + 30 // Header size in bytes\n   83 |         + metadata_entry.filename().as_bytes().len() as u64;\n   84 | \n   85 |     // The zip archive uses as BufReader which reads in chunks of 8192. To ensure we prefetch\n   86 |     // enough data we round the size up to the nearest multiple of the buffer size.\n   87 |     let buffer_size = 8192;\n   88 |     let size = size.div_ceil(buffer_size) * buffer_size;\n   89 | \n   90 |     // Fetch the bytes from the zip archive that contain the requested file.\n   91 |     reader\n   92 |         .inner_mut()\n   93 |         .get_mut()\n   94 |         .get_mut()\n   95 |         .prefetch(offset..offset + size)\n   96 |         .await;","lines":17,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-client/src/remote_metadata.rs#L80-L96"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"medium","description":"`star_range_specifier` computes `minor + 1` on a release segment (`u64`) taken from a user-parsed version without checking for overflow. If `minor == u64::MAX` the addition panics in debug builds and wraps in release builds. In practice the two-segment adjacency structure this guard requires makes reaching it with `minor == u64::MAX` essentially impossible, so impact is negligible, but the arithmetic is unchecked on externally-derived data.","fix":"Use `minor.checked_add(1)` and bail out (`return None`) on overflow, e.g. `[major, minor] if minor.checked_add(1) == Some(v2.release()[1]) && v2.release().len() == 2 => ...`.","locations":[{"ref":"crates/uv-pep508/src/marker/simplify.rs:384-386","code":"  384 |             [major, minor] if *v2.release() == [major, minor + 1] => {\n  385 |                 Some(VersionSpecifier::not_equals_star_version(v1.clone()))\n  386 |             }","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/simplify.rs#L384-L386"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`PrioritizedDist::from_built` and `PrioritizedDist::from_source` set the `markers` field unconditionally, without checking whether the inserted distribution is actually compatible. `from_built` (`crates/uv-distribution-types/src/prioritized_distribution.rs:344-356`) sets `markers: implied_markers(&dist.filename)` for any `WheelCompatibility`, and `from_source` (`crates/uv-distribution-types/src/prioritized_distribution.rs:359-371`) sets `markers: MarkerTree::TRUE` for any `SourceDistCompatibility`, even `WheelCompatibility::Incompatible(_)` or `SourceDistCompatibility::Incompatible(_)`. This contradicts the sibling methods `insert_built` and `insert_source` (used for every subsequent distribution of the same version), which only fold markers in `if compatibility.is_compatible()`. Since `markers` is documented as \"the set of supported platforms for the distribution\" and is exposed via `CompatibleDist::implied_markers()`, this makes the computed value depend on insertion order: whichever wheel/sdist happens to be the *first* one seen for a given package version (e.g. from a `--find-links` / flat-index directory listing, see `crates/uv-resolver/src/flat_index.rs:120-126` which calls `PrioritizedDist::from_built` for the first entry and `insert_built` for the rest) contributes its markers even when incompatible, while the exact same distribution would be ignored if it happened to arrive second. In the `from_source` case this is worse: an incompatible sdist (e.g. yanked, or `requires-python` mismatch) being the first entry forces `markers` to `MarkerTree::TRUE` permanently (since later `insert_built` calls skip the OR when `self.0.markers.is_true()`), so a subsequently-inserted, genuinely platform-specific compatible wheel ends up reporting `implied_markers() == TRUE` (i.e. \"works everywhere\"). This value is load-bearing for universal-resolution forking in `crates/uv-resolver/src/resolver/mod.rs` (`fork_version_registry`), e.g. `if dist.implied_markers().is_true() { return Ok(None); }` skips forking entirely, so the resolver can silently fail to fork for missing-platform coverage and may lock in a wheel that doesn't actually support the platforms it claims to.","fix":"Make `from_built`/`from_source` compute `markers` the same way `insert_built`/`insert_source` do, i.e. only include markers for compatible distributions:\n```rust\npub fn from_built(\n    dist: RegistryBuiltWheel,\n    hashes: Vec<HashDigest>,\n    compatibility: WheelCompatibility,\n) -> Self {\n    let markers = if compatibility.is_compatible() {\n        implied_markers(&dist.filename)\n    } else {\n        MarkerTree::FALSE\n    };\n    Self(Box::new(PrioritizedDistInner {\n        markers,\n        best_wheel_index: Some(0),\n        wheels: vec![(dist, compatibility)],\n        source: None,\n        hashes,\n    }))\n}\n\npub fn from_source(\n    dist: RegistrySourceDist,\n    hashes: Vec<HashDigest>,\n    compatibility: SourceDistCompatibility,\n) -> Self {\n    let markers = if compatibility.is_compatible() {\n        MarkerTree::TRUE\n    } else {\n        MarkerTree::FALSE\n    };\n    Self(Box::new(PrioritizedDistInner {\n        markers,\n        best_wheel_index: None,\n        wheels: vec![],\n        source: Some((dist, compatibility)),\n        hashes,\n    }))\n}\n```\nAdd a regression test that builds a `PrioritizedDist` starting from an incompatible wheel/sdist (via `from_built`/`from_source`) followed by a compatible one via `insert_built`/`insert_source`, and asserts `implied_markers()` matches what would be produced by starting from `PrioritizedDist::default()` and inserting the same two distributions in either order.","locations":[{"ref":"crates/uv-distribution-types/src/prioritized_distribution.rs:344-356","code":"  344 |     pub fn from_built(\n  345 |         dist: RegistryBuiltWheel,\n  346 |         hashes: Vec<HashDigest>,\n  347 |         compatibility: WheelCompatibility,\n  348 |     ) -> Self {\n  349 |         Self(Box::new(PrioritizedDistInner {\n  350 |             markers: implied_markers(&dist.filename),\n  351 |             best_wheel_index: Some(0),\n  352 |             wheels: vec![(dist, compatibility)],\n  353 |             source: None,\n  354 |             hashes,\n  355 |         }))\n  356 |     }","lines":13,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/prioritized_distribution.rs#L344-L356"},{"ref":"crates/uv-distribution-types/src/prioritized_distribution.rs:359-371","code":"  359 |     pub fn from_source(\n  360 |         dist: RegistrySourceDist,\n  361 |         hashes: Vec<HashDigest>,\n  362 |         compatibility: SourceDistCompatibility,\n  363 |     ) -> Self {\n  364 |         Self(Box::new(PrioritizedDistInner {\n  365 |             markers: MarkerTree::TRUE,\n  366 |             best_wheel_index: None,\n  367 |             wheels: vec![],\n  368 |             source: Some((dist, compatibility)),\n  369 |             hashes,\n  370 |         }))\n  371 |     }","lines":13,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/prioritized_distribution.rs#L359-L371"},{"ref":"crates/uv-distribution-types/src/prioritized_distribution.rs:380-399","code":"  380 |         // Track the implied markers.\n  381 |         if compatibility.is_compatible() {\n  382 |             if !self.0.markers.is_true() {\n  383 |                 self.0.markers.or(implied_markers(&dist.filename));\n  384 |             }\n  385 |         }\n  386 |         // Track the hashes.\n  387 |         if !compatibility.is_excluded() {\n  388 |             self.0.hashes.extend(hashes);\n  389 |         }\n  390 |         // Track the highest-priority wheel.\n  391 |         if let Some((.., existing_compatibility)) = self.best_wheel() {\n  392 |             if compatibility.is_more_compatible(existing_compatibility) {\n  393 |                 self.0.best_wheel_index = Some(self.0.wheels.len());\n  394 |             }\n  395 |         } else {\n  396 |             self.0.best_wheel_index = Some(self.0.wheels.len());\n  397 |         }\n  398 |         self.0.wheels.push((dist, compatibility));\n  399 |     }","lines":20,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/prioritized_distribution.rs#L380-L399"},{"ref":"crates/uv-distribution-types/src/prioritized_distribution.rs:401-424","code":"  401 |     /// Insert the given source distribution into the [`PrioritizedDist`].\n  402 |     pub fn insert_source(\n  403 |         &mut self,\n  404 |         dist: RegistrySourceDist,\n  405 |         hashes: impl IntoIterator<Item = HashDigest>,\n  406 |         compatibility: SourceDistCompatibility,\n  407 |     ) {\n  408 |         // Track the implied markers.\n  409 |         if compatibility.is_compatible() {\n  410 |             self.0.markers = MarkerTree::TRUE;\n  411 |         }\n  412 |         // Track the hashes.\n  413 |         if !compatibility.is_excluded() {\n  414 |             self.0.hashes.extend(hashes);\n  415 |         }\n  416 |         // Track the highest-priority source.\n  417 |         if let Some((.., existing_compatibility)) = &self.0.source {\n  418 |             if compatibility.is_more_compatible(existing_compatibility) {\n  419 |                 self.0.source = Some((dist, compatibility));\n  420 |             }\n  421 |         } else {\n  422 |             self.0.source = Some((dist, compatibility));\n  423 |         }\n  424 |     }","lines":24,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/prioritized_distribution.rs#L401-L424"},{"ref":"crates/uv-resolver/src/flat_index.rs:120-126","code":"  120 |                 match self.0.entry(version) {\n  121 |                     Entry::Occupied(mut entry) => {\n  122 |                         entry.get_mut().insert_built(dist, vec![], compatibility);\n  123 |                     }\n  124 |                     Entry::Vacant(entry) => {\n  125 |                         entry.insert(PrioritizedDist::from_built(dist, vec![], compatibility));\n  126 |                     }","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/flat_index.rs#L120-L126"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`UrlTrie::get` in `crates/uv-auth/src/cache.rs:226-239` walks the trie from the realm node down through the URL's path segments and returns as soon as it finds *any* node with a stored value: `state = self.states[state].get(component)?; if let Some(ref value) = self.states[state].value { return Some(value); }`. This returns the *shallowest* (least specific) ancestor with a cached value, not the deepest/most specific match. If credentials are cached for a shorter URL (e.g. an index root) and later a more specific sub-path under it gets different cached credentials (`CredentialsCache::insert` is called per exact request URL in `AuthMiddleware::complete_request`), a lookup for that sub-path (or anything nested under it) will keep returning the older, less specific entry instead of the more specific one that was actually cached for it. This contradicts the type's own doc comment ('A cache per URL, uses a trie for efficient prefix queries') which implies prefix-specific lookup, and could cause uv to authenticate a request with credentials that belong to a different, less specific resource.","fix":"Continue walking to the deepest reachable node and only fall back to a shallower cached value if no deeper node exists, e.g. track the last-seen value while descending but keep descending as far as possible, returning the deepest one found:\n```rust\nfn get(&self, url: &Url) -> Option<&T> {\n    let mut state = 0;\n    let realm = Realm::from(url).to_string();\n    let mut best = self.states[0].value.as_ref();\n    for component in [realm.as_str()].into_iter().chain(url.path_segments().unwrap().filter(|item| !item.is_empty())) {\n        let Some(next) = self.states[state].get(component) else { break };\n        state = next;\n        if let Some(ref value) = self.states[state].value {\n            best = Some(value);\n        }\n    }\n    best\n}\n```","locations":[{"ref":"crates/uv-auth/src/cache.rs:226-239","code":"  226 |     fn get(&self, url: &Url) -> Option<&T> {\n  227 |         let mut state = 0;\n  228 |         let realm = Realm::from(url).to_string();\n  229 |         for component in [realm.as_str()]\n  230 |             .into_iter()\n  231 |             .chain(url.path_segments().unwrap().filter(|item| !item.is_empty()))\n  232 |         {\n  233 |             state = self.states[state].get(component)?;\n  234 |             if let Some(ref value) = self.states[state].value {\n  235 |                 return Some(value);\n  236 |             }\n  237 |         }\n  238 |         self.states[state].value.as_ref()\n  239 |     }","lines":14,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-auth/src/cache.rs#L226-L239"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Indexes::find_prefix_index` (`crates/uv-auth/src/index.rs:126-128`) does `self.0.iter().find(|&index| index.is_prefix_for(url))` over an `FxHashSet<Index>`. If two configured indexes have overlapping prefixes (e.g. one at `https://ex
