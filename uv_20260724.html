g negation so it matches `tree.rs`/`audit.rs`: change `if preview.is_enabled(PreviewFeature::JsonOutput) && matches!(output_format, SyncFormat::Json) {` to `if matches!(output_format, SyncFormat::Json) && !preview.is_enabled(PreviewFeature::JsonOutput) {`.","locations":[{"ref":"crates/uv/src/commands/project/sync.rs:98-103","code":"   98 |     if preview.is_enabled(PreviewFeature::JsonOutput) && matches!(output_format, SyncFormat::Json) {\n   99 |         warn_user!(\n  100 |             \"The `--output-format json` option is experimental and the schema may change without warning. Pass `--preview-features {}` to disable this warning.\",\n  101 |             PreviewFeature::JsonOutput\n  102 |         );\n  103 |     }","lines":6,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/sync.rs#L98-L103"}]},{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `ProgressReporter::on_request_start`, a size is pushed into `state.sizes` (`state.sizes.insert(position, size.unwrap_or(0))`), but `on_request_complete` only removes the bar from `state.bars` and never removes the corresponding entry from `state.sizes`. The `sizes` vector therefore grows for the lifetime of the command and includes already-completed downloads. Since `position = state.sizes.partition_point(|&len| len < size)` is used to compute the insertion index `position + 1 + state.headers`, once earlier downloads finish the computed positions no longer reflect the set of currently-active bars, so new concurrent download bars are inserted at inflated indices (clamped to the end by `MultiProgress::insert`) rather than in size order. The effect is cosmetic mis-ordering plus unbounded (per-run) growth of `sizes`.","fix":"Track each numeric bar's size so it can be removed from `state.sizes` in `on_request_complete` (e.g. store the size in `ProgressBarKind::Numeric` - which it already does - and on completion `state.sizes.remove(pos)` for the matching value), keeping `sizes` in sync with the active `bars`.","locations":[{"ref":"crates/uv/src/commands/reporters.rs:224-296","code":"  224 |         let mut state = state.lock().unwrap();\n  225 | \n  226 |         // Preserve ascending order.\n  227 |         let position = size.map_or(0, |size| state.sizes.partition_point(|&len| len < size));\n  228 |         state.sizes.insert(position, size.unwrap_or(0));\n  229 |         state.max_len = std::cmp::max(state.max_len, name.len());\n  230 | \n  231 |         let max_len = state.max_len;\n  232 |         for progress in state.bars.values_mut() {\n  233 |             // Ignore spinners, such as for builds.\n  234 |             if let ProgressBarKind::Numeric { progress, .. } = progress {\n  235 |                 let template = format!(\n  236 |                     \"{{msg:{max_len}.dim}} {{bar:30.green/black.dim}} {{binary_bytes:>7}}/{{binary_total_bytes:7}}\"\n  237 |                 );\n  238 |                 progress.set_style(\n  239 |                     ProgressStyle::with_template(&template)\n  240 |                         .unwrap()\n  241 |                         .progress_chars(\"--\"),\n  242 |                 );\n  243 |                 progress.tick();\n  244 |             }\n  245 |         }\n  246 | \n  247 |         let progress = multi_progress.insert(\n  248 |             // Make sure not to reorder the initial \"Preparing...\" bar, or any previous bars.\n  249 |             position + 1 + state.headers,\n  250 |             ProgressBar::with_draw_target(size, self.printer.target()),\n  251 |         );\n  252 | \n  253 |         if let Some(size) = size {\n  254 |             // We're using binary bytes to match `human_readable_bytes`.\n  255 |             progress.set_style(\n  256 |                 ProgressStyle::with_template(\n  257 |                     &format!(\n  258 |                         \"{{msg:{}.dim}} {{bar:30.green/black.dim}} {{binary_bytes:>7}}/{{binary_total_bytes:7}}\", state.max_len\n  259 |                     ),\n  260 |                 )\n  261 |                     .unwrap()\n  262 |                     .progress_chars(\"--\"),\n  263 |             );\n  264 |             // If the file is larger than 1MB, show a message to indicate that this may take\n  265 |             // a while keeping the log concise.\n  266 |             if multi_progress.is_hidden() && !*HAS_UV_TEST_NO_CLI_PROGRESS && size > 1024 * 1024 {\n  267 |                 let (bytes, unit) = human_readable_bytes(size);\n  268 |                 let _ = writeln!(\n  269 |                     self.printer.stderr(),\n  270 |                     \"{} {} {}\",\n  271 |                     direction.as_str().bold().cyan(),\n  272 |                     name,\n  273 |                     format!(\"({bytes:.1}{unit})\").dimmed()\n  274 |                 );\n  275 |             }\n  276 |             progress.set_message(name);\n  277 |         } else {\n  278 |             progress.set_style(ProgressStyle::with_template(\"{wide_msg:.dim} ....\").unwrap());\n  279 |             if multi_progress.is_hidden() && !*HAS_UV_TEST_NO_CLI_PROGRESS {\n  280 |                 let _ = writeln!(\n  281 |                     self.printer.stderr(),\n  282 |                     \"{} {}\",\n  283 |                     direction.as_str().bold().cyan(),\n  284 |                     name\n  285 |                 );\n  286 |             }\n  287 |             progress.set_message(name);\n  288 |             progress.finish();\n  289 |         }\n  290 | \n  291 |         let id = state.id();\n  292 |         state\n  293 |             .bars\n  294 |             .insert(id, ProgressBarKind::Numeric { progress, size });\n  295 |         id\n  296 |     }","lines":73,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/reporters.rs#L224-L296"},{"ref":"crates/uv/src/commands/reporte ound-trip asymmetry: any string produced for `Wasm32` cannot be parsed back. The same `from_str` also omits several aliases that the `serde` derive accepts (`arm64`, `amd64`, `i386`). Currently latent because wasm32 only ever appears in `pyodide_*`/`pyemscripten_*` tags (parsed separately), so no `linux_*`/`manylinux_*`/`musllinux_*` tag round-trips through `wasm32`, and wheel filenames use canonical names.","fix":"Add a `\"wasm32\" => Ok(Self::Wasm32)` arm to `FromStr for Arch` so it stays symmetric with `name()`; optionally add the `i386`/`arm64`/`amd64` aliases that the `serde(alias = ...)` attributes already accept, for consistency.","locations":[{"ref":"crates/uv-platform-tags/src/platform.rs:198-216","code":"  198 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  199 |         match s {\n  200 |             \"aarch64\" => Ok(Self::Aarch64),\n  201 |             \"armv5tel\" => Ok(Self::Armv5TEL),\n  202 |             \"armv6l\" => Ok(Self::Armv6L),\n  203 |             // armv8l is 32-bit ARM running on ARMv8 hardware, compatible with armv7l\n  204 |             \"armv7l\" | \"armv8l\" => Ok(Self::Armv7L),\n  205 |             \"ppc64le\" => Ok(Self::Powerpc64Le),\n  206 |             \"ppc64\" => Ok(Self::Powerpc64),\n  207 |             \"ppc\" => Ok(Self::Powerpc),\n  208 |             \"i686\" => Ok(Self::X86),\n  209 |             \"x86_64\" => Ok(Self::X86_64),\n  210 |             \"s390x\" => Ok(Self::S390X),\n  211 |             \"loongarch64\" => Ok(Self::LoongArch64),\n  212 |             \"riscv64\" => Ok(Self::Riscv64),\n  213 |             _ => Err(format!(\"Unknown architecture: {s}\")),\n  214 |         }\n  215 |     }\n  216 | }","lines":19,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-platform-tags/src/platform.rs#L198-L216"},{"ref":"crates/uv-platform-tags/src/platform.rs:239-255","code":"  239 |     pub fn name(&self) -> &'static str {\n  240 |         match self {\n  241 |             Self::Aarch64 => \"aarch64\",\n  242 |             Self::Armv5TEL => \"armv5tel\",\n  243 |             Self::Armv6L => \"armv6l\",\n  244 |             Self::Armv7L => \"armv7l\",\n  245 |             Self::Powerpc64Le => \"ppc64le\",\n  246 |             Self::Powerpc64 => \"ppc64\",\n  247 |             Self::Powerpc => \"ppc\",\n  248 |             Self::X86 => \"i686\",\n  249 |             Self::X86_64 => \"x86_64\",\n  250 |             Self::S390X => \"s390x\",\n  251 |             Self::LoongArch64 => \"loongarch64\",\n  252 |             Self::Riscv64 => \"riscv64\",\n  253 |             Self::Wasm32 => \"wasm32\",\n  254 |         }\n  255 |     }","lines":17,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-platform-tags/src/platform.rs#L239-L255"}]},{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`Version.from_str` in the metadata fetch script does `major, minor, patch = version.split(\".\", 3)`. `maxsplit=3` yields up to 4 parts, so a version string with four numeric dot-separated components (e.g. `\"3.11.15.1\"`) makes the tuple unpack raise `ValueError`, and a two-component string (e.g. `\"3.11\"`) also fails to unpack into three names. Real interpreter versions are always three-component so this never triggers in practice, and this is a manually-run developer regeneration script (not a runtime path), hence negligible - but the `maxsplit=3` is a latent trap versus the intended three-field unpack.","fix":"Use `major, minor, patch = version.split(\".\", 2)` so the last split field always captures the remaining patch/prerelease text, matching the three-target unpack (the existing prerelease-stripping loop already handles trailing non-numeric content on `patch`).","locations":[{"ref":"crates/uv-python/fetch-download-metadata.py:123-134","code":"  123 |     @classmethod\n  124 |     def from_str(cls, version: str) -> Self:\n  125 |         major, minor, patch = version.split(\".\", 3)\n  126 |         prerelease = \"\"\n  127 |         for prerelease_kind in (\"a\", \"b\", \"rc\"):\n  128 |             parts = patch.split(prerelease_kind, 1)\n  129 |             if len(parts) == 2:\n  130 |                 patch = parts[0]\n  131 |                 prerelease = prerelease_kind + parts[1]\n  132 |                 break\n  133 | \n  134 |         return cls(int(major), int(minor), int(patch), prerelease)","lines":12,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/fetch-download-metadata.py#L123-L134"}]},{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`has_dependency_group` looks up the group by exact raw key (`groups.get(group.as_ref())`), whereas every other accessor in this file (`find_dependency`, `dependency_type_array_mut`, `remove_dependency_group_requirement`, etc.) normalizes each key via `GroupName::from_str` before comparing. A hand-written non-normalized key (e.g. `[dependency-groups]` with `Dev = [...]`) would not be found by `has_dependency_group` even though it normalizes to `dev`. Impact is negligible today because the only caller passes the already-normalized `DEV_DEPENDENCIES` and its fallback branches all resolve to the same group regardless, but the inconsistency is a latent trap for future callers.","fix":"Make `has_dependency_group` normalize like the rest: iterate `groups` and match with `GroupName::from_str(key).is_ok_and(|g| g == *group)` instead of `groups.get(group.as_ref()).is_some()`.","locations":[{"ref":"crates/uv-workspace/src/pyproject_mut.rs:1286-1292","code":" 1286 |     pub fn has_dependency_group(&self, group: &GroupName) -> bool {\n 1287 |         self.doc\n 1288 |             .get(\"dependency-groups\")\n 1289 |             .and_then(Item::as_table)\n 1290 |             .and_then(|groups| groups.get(group.as_ref()))\n 1291 |             .is_some()\n 1292 |     }","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/pyproject_mut.rs#L1286-L1292"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The `--config-setting-package`/`--config-settings-package` flag is defined inconsistently across subcommands. `InstallerArgs`, `ResolverArgs`, and `ResolverInstallerArgs` all name the field `config_settings_package` (plural \"settings\"), which clap derives as the primary flag `--config-settings-package`, with an `alias = \"config-settings-package\"` that is textually identical to the derived name (a redundant no-op alias). `ToolUpgradeArgs`, which manually re-implements a hidden/visible subset of `ResolverInstallerArgs` (per its own comment `// The following is equivalent to flattening \\`ResolverInstallerArgs\\`, ...`), instead names the field `config_setting_package` (singular), giving primary flag `--config-setting-package` with alias `--config-settings-package` (plural) — mirroring the sibling `config_setting`/`alias = \"config-settings\"` field, which is clearly the intended singular-primary/plural-alias convention. I confirmed the divergence by building the `uv` binary: `uv add --help` only exposes `--config-settings-package` (plural), while `uv tool upgrade --help` exposes `--config-setting-package` (singular) with the plural also accepted via alias. A user who learns the flag as `--config-setting-package` from `uv tool upgrade --help` (or from the analogous `--config-setting` flag, which is singular everywhere) gets an \"unrecognized argument\" error when they try the same flag name on `uv add`, `uv sync`, `uv run`, `uv lock`, `uv pip install/sync/compile`, `uv build`, etc., since those only accept the plural form.","fix":"Rename the field to `config_setting_package` (singular) in `InstallerArgs` (line 7419), `ResolverArgs` (line 7611), and `ResolverInstallerArgs` (line 7813) so the primary flag becomes `--config-setting-package` everywhere, matching `ToolUpgradeArgs` and the sibling `config_setting`/`alias = \"config-settings\"` convention, e.g.:\n```rust\n#[arg(long, alias = \"config-settings-package\", help_heading = \"Build options\", value_hint = ValueHint::Other)]\npub config_setting_package: Option<Vec<ConfigSettingPackageEntry>>,\n```\nKeep `alias = \"config-settings-package\"` (plural) on all of them for backward compatibility with any existing plural usage.","locations":[{"ref":"crates/uv-cli/src/lib.rs:6306-6321","code":" 6306 |     /// Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs.\n 6307 |     #[arg(\n 6308 |         long,\n 6309 |         short = 'C',\n 6310 |         alias = \"config-settings\",\n 6311 |         help_heading = \"Build options\"\n 6312 |     )]\n 6313 |     pub config_setting: Option<Vec<ConfigSettingEntry>>,\n 6314 | \n 6315 |     /// Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs.\n 6316 |     #[arg(\n 6317 |         long,\n 6318 |         alias = \"config-settings-package\",\n 6319 |         help_heading = \"Build options\"\n 6320 |     )]\n 6321 |     pub config_setting_package: Option<Vec<ConfigSettingPackageEntry>>,","lines":16,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/lib.rs#L6306-L6321"},{"ref":"crates/uv-cli/src/lib.rs:7404-7419","code":" 7404 |     /// Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs.\n 7405 |     #[arg(\n 7406 |         long,\n 7407 |         short = 'C',\n 7408 |         alias = \"config-settings\",\n 7409 |         help_heading = \"Build options\"\n 7410 |     )]\n 7411 |     config_setting: Option<Vec<ConfigSettingEntry>>,\n 7412 | \n 7413 |     /// Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs.\n 7414 |     #[arg(\n 7415 |         long,\n 7416 |         alias = \"config-settings-package\",\n 7417 |         help_heading = \"Build options\"\n 7418 |     )]\n 7419 |     config_settings_package: Option<Vec<ConfigSettingPackageEntry>>,","lines":16,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/lib.rs#L7404-L7419"},{"ref":"crates/uv-cli/src/lib.rs:7596-7611","code":" 7596 |     /// Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs.\n 7597 |     #[arg(\n 7598 |         long,\n 7599 |         short = 'C',\n 7600 |         alias = \"config-settings\",\n 7601 |         help_heading = \"Build options\"\n 7602 |     )]\n 7603 |     config_setting: Option<Vec<ConfigSettingEntry>>,\n 7604 | \n 7605 |     /// Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs.\n 7606 |     #[arg(\n 7607 |         long,\n 7608 |         alias = \"config-settings-package\",\n 7609 |         help_heading = \"Build options\"\n 7610 |     )]\n 7611 |     config_settings_package: Option<Vec<ConfigSettingPackageEntry>>,","lines":16,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/lib.rs#L7596-L7611"},{"ref":"crates/uv-cli/src/lib.rs:7796-7813","code":" 7796 |     /// Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs.\n 7797 |     #[arg(\n 7798 |         long,\n 7799 |         short = 'C',\n 7800 |         alias = \"config-settings\",\n 7801 |         help_heading = \"Build options\",\n 7802 |         value_hint = ValueHint::Other,\n 7803 |     )]\n 7804 |     pub config_setting: Option<Vec<ConfigSettingEntry>>,\n 7805 | \n 7806 |     /// Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs.\n 7807 |     #[arg(\n 7808 |         long,\n 7809 |         alias = \"config-settings-package\",\n 7810 |         help_heading = \"Build options\",\n 7811 |         value_hint = ValueHint::Other,\n 7812 |     )]\n 7813 |     pub config_settings_package: Option<Vec<ConfigSettingPackageEntry>>,","lines":18,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/lib.rs#L7796-L7813"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `LockArgs`, the `check` field declares `overrides_with = \"check\"`, referencing itself rather than the related `locked` field. The doc comments explicitly state the two are equivalent/aliased (`check`: \"Equivalent to `--locked`\", `locked`: \"Equivalent to `--check`\"), which is the same synonym pattern used elsewhere in the file where `overrides_with` links the two flags together. As written, the self-reference is a no-op for a plain boolean `SetTrue`-style flag (repeating `--check` multiple times has no special meaning to override), so it does not achieve any override relationship between `check` and `locked`. It happens to be functionally harmless today only because `crates/uv/src/settings.rs::LockSettings::resolve` special-cases `check` with an explicit `if check { .. } else { resolve_lock_check(locked) }`, but the attribute itself is dead/incorrect and misleading to future maintainers.","fix":"Change `overrides_with = \"check\"` to `overrides_with = \"locked\"` on the `check` field so the self-reference is replaced with a reference to its actual synonym field:\n```rust\n#[arg(long, value_parser = clap::builder::BoolishValueParser::new(), conflicts_with_all = [\"check_exists\", \"upgrade\"], overrides_with = \"locked\")]\npub check: bool,\n```","locations":[{"ref":"crates/uv-cli/src/lib.rs:4210","code":" 4210 |     #[arg(long, value_parser = clap::builder::BoolishValueParser::new(), conflicts_with_all = [\"check_exists\", \"upgrade\"], overrides_with = \"check\")]","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/lib.rs#L4210"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `PythonPinArgs`, the hidden `no_resolved` field declares `overrides_with(\"no_resolved\")`, i.e. it overrides itself instead of overriding its counterpart `resolved`. Every other boolean flag/negation pair in this file (e.g. `system`/`no_system`, `dev`/`no_dev`, `refresh`/`no_refresh`) declares `overrides_with` pointing at the *other* field so that whichever flag is passed last on the command line wins and clears the other. Because of the self-reference, passing `--resolved --no-resolved` (in either order) leaves both `resolved` and `no_resolved` set to `true` instead of one clearing the other (verified empirically against `clap` 4: with the self-reference both booleans end up `true` in both argument orders, whereas the correct pattern yields `(true,false)`/`(false,true)` depending on order). Downstream, `crates/uv/src/settings.rs::PythonPinSettings::resolve` calls `flag(resolved, no_resolved, \"resolved\")`, which explicitly `bail!`s with `ArgumentError` when both booleans are `true`. So `uv python pin --resolved --no-resolved` incorrectly errors out with a confusing \"arguments cannot be used together\" message instead of applying the intended last-flag-wins override.","fix":"Change the `no_resolved` field's attribute from `overrides_with(\"no_resolved\")` to `overrides_with(\"resolved\")`, matching the pattern used by every other flag/negation pair in the file:\n```rust\n#[arg(long, overrides_with(\"resolved\"))]\npub resolved: bool,\n\n#[arg(long, overrides_with(\"resolved\"), hide = true)]\npub no_resolved: bool,\n```\n(the second field must reference `resolved`, not itself).","locations":[{"ref":"crates/uv-cli/src/lib.rs:6928-6932","code":" 6928 |     #[arg(long, overrides_with(\"resolved\"))]\n 6929 |     pub resolved: bool,\n 6930 | \n 6931 |     #[arg(long, overrides_with(\"no_resolved\"), hide = true)]\n 6932 |     pub no_resolved: bool,","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/lib.rs#L6928-L6932"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `crates/uv-cli/src/options.rs`, three call sites pass the wrong `name` argument to `flag()`. The `flag()` helper (defined at `options.rs:31`) builds its conflict error message as `--{name}` and `--no-{name}`, so callers are expected to pass the *positive* flag name (e.g. `\"upgrade\"` for the `--upgrade`/`--no-upgrade` pair), exactly as done correctly at `options.rs:438` (`flag(upgrade, no_upgrade, \"upgrade\")`) and `options.rs:731` (`flag(upgrade, no_upgrade, \"upgrade\")`). However, `options.rs:227` calls `flag(refresh, no_refresh, \"no-refresh\")` and `options.rs:293` / `options.rs:593` call `flag(upgrade, no_upgrade, \"no-upgrade\")`, passing the negative name instead. If a user ever triggers the conflict branch of `flag()` for these paths, the resulting `ArgumentError` reads `` `--no-refresh` and `--no-no-refresh` cannot be used together `` (and similarly `` `--no-upgrade` and `--no-no-upgrade` ``), which never mentions the real `--refresh`/`--upgrade` flags and invents a nonexistent `--no-no-upgrade` flag. This is inconsistent with the corrected pattern used elsewhere in the same file (`\"upgrade\"`, `\"build\"`, `\"binary\"`, `\"build-isolation\"`, `\"reinstall\"`, `\"compile-bytecode\"`), strongly suggesting a copy-paste slip when the `ResolverArgs`/`RefreshArgs` conversions were duplicated from/to the `ResolverInstallerArgs` conversion.","fix":"Pass the positive flag name, matching the corrected call sites at `options.rs:438` and `options.rs:731`:\n```rust\n// options.rs:227\nflag(refresh, no_refresh, \"refresh\")?,\n// options.rs:293 and options.rs:593\nflag(upgrade, no_upgrade, \"upgrade\")?,\n```","locations":[{"ref":"crates/uv-cli/src/options.rs:227","code":"  227 |             flag(refresh, no_refresh, \"no-refresh\")?,","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/options.rs#L227"},{"ref":"crates/uv-cli/src/options.rs:293","code":"  293 |             upgrade: flag(upgrade, no_upgrade, \"no-upgrade\")?,","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/options.rs#L293"},{"ref":"crates/uv-cli/src/options.rs:593","code":"  593 |             flag(upgrade, no_upgrade, \"no-upgrade\")?,","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cli/src/options.rs#L593"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"`IncompatibleWheel::is_more_compatible` and `IncompatibleSource::is_more_compatible` handle the `ExcludeNewer(None)` case (a distribution excluded because it has no known publish time) inconsistently, despite both being annotated with the identical comment \"Smaller timestamps are closer to the cut-off time\". In `IncompatibleSource::is_more_compatible` (`crates/uv-distribution-types/src/prioritized_distribution.rs:737-740`), the comparison `timestamp_other < timestamp_self` relies on `Option<i64>`'s derived `Ord`, where `None` sorts as the smallest value, so a source distribution with no publish time (`self = None`) is *never* considered more compatible than one with a known publish time. In `IncompatibleWheel::is_more_compatible` (`crates/uv-distribution-types/src/prioritized_distribution.rs:762-770`), the same case is explicitly special-cased as `(None, _) => true`, meaning a wheel with no known publish time is *always* considered more compatible than any other `ExcludeNewer` wheel, including one whose publish time is only barely past the cutoff. This asymmetry means `PrioritizedDist::insert_built`/`insert_source` pick the \"best\" (least-incompatible) excluded distribution using opposite tie-break rules for wheels vs. sdists, which affects both the `IncompatibleWheel`/`IncompatibleSource` surfaced in error messages via `incompatible_wheel()`/`incompatible_source()`, and (per the previous finding) which entry ends up at `best_wheel_index`.","fix":"Decide on one semantics for \"no publish time\" relative to a known-late publish time and apply it identically in both `impl`s. For example, to match `IncompatibleSource` (treat unknown publish time as the least-preferable / most-excluded case, which is the more defensible choice since we cannot verify it precedes the cutoff), change `IncompatibleWheel::is_more_compatible`'s `ExcludeNewer` arm to:\n```rust\nSelf::ExcludeNewer(timestamp_self) => match other {\n    // Smaller timestamps are closer to the cut-off time; `None` (unknown) is treated as the\n    // least compatible, matching `IncompatibleSource::is_more_compatible`.\n    Self::ExcludeNewer(timestamp_other) => timestamp_other < timestamp_self,\n    Self::MissingPlatform(_)\n    | Self::NoBinary\n    | Self::RequiresPython(_, _)\n    | Self::Tag(_)\n    | Self::Yanked(_) => true,\n},\n```\n(dropping the special-cased `(None, _) => true` / `(_, None) => false` arms and relying on `Option`'s natural ordering, same as the source-distribution version).","locations":[{"ref":"crates/uv-distribution-types/src/prioritized_distribution.rs:734-757","code":"  734 | impl IncompatibleSource {\n  735 |     fn is_more_compatible(&self, other: &Self) -> bool {\n  736 |         match self {\n  737 |             Self::ExcludeNewer(timestamp_self) => match other {\n  738 |                 // Smaller timestamps are closer to the cut-off time\n  739 |                 Self::ExcludeNewer(timestamp_other) => timestamp_other < timestamp_self,\n  740 |                 Self::NoBuild | Self::RequiresPython(_, _) | Self::Yanked(_) => true,\n  741 |             },\n  742 |             Self::RequiresPython(_, _) => match other {\n  743 |                 Self::ExcludeNewer(_) => false,\n  744 |                 // Version specifiers cannot be reasonably compared\n  745 |                 Self::RequiresPython(_, _) => false,\n  746 |                 Self::NoBuild | Self::Yanked(_) => true,\n  747 |             },\n  748 |             Self::Yanked(_) => match other {\n  749 |                 Self::ExcludeNewer(_) | Self::RequiresPython(_, _) => false,\n  750 |                 // Yanks with a reason are more helpful for errors\n  751 |                 Self::Yanked(yanked_other) => matches!(yanked_other, Yanked::Reason(_)),\n  752 |                 Self::NoBuild => true,\n  753 |             },\n  754 |             Self::NoBuild => false,\n  755 |         }\n  756 |     }\n  757 | }","lines":24,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/prioritized_distribution.rs#L734-L757"},{"ref":"crates/uv-distribution-types/src/prioritized_distribution.rs:759-808","code":"  759 | impl IncompatibleWheel {\n  760 |     fn is_more_compatible(&self, other: &Self) -> bool {\n  761 |         match self {\n  762 |             Self::ExcludeNewer(timestamp_self) => match other {\n  763 |                 // Smaller timestamps are closer to the cut-off time\n  764 |                 Self::ExcludeNewer(timestamp_other) => match (timestamp_self, timestamp_other) {\n  765 |                     (None, _) => true,\n  766 |                     (_, None) => false,\n  767 |                     (Some(timestamp_self), Some(timestamp_other)) => {\n  768 |                         timestamp_other < timestamp_self\n  769 |                     }\n  770 |                 },\n  771 |                 Self::MissingPlatform(_)\n  772 |                 | Self::NoBinary\n  773 |                 | Self::RequiresPython(_, _)\n  774 |                 | Self::Tag(_)\n  775 |                 | Self::Yanked(_) => true,\n  776 |             },\n  777 |             Self::Tag(tag_self) => match other {\n  778 |                 Self::ExcludeNewer(_) => false,\n  779 |                 Self::Tag(tag_other) => tag_self > tag_other,\n  780 |                 Self::MissingPlatform(_)\n  781 |                 | Self::NoBinary\n  782 |                 | Self::RequiresPython(_, _)\n  783 |                 | Self::Yanked(_) => true,\n  784 |             },\n  785 |             Self::RequiresPython(_, _) => match other {\n  786 |                 Self::ExcludeNewer(_) | Self::Tag(_) => false,\n  787 |                 // Version specifiers cannot be reasonably compared\n  788 |                 Self::RequiresPython(_, _) => false,\n  789 |                 Self::MissingPlatform(_) | Self::NoBinary | Self::Yanked(_) => true,\n  790 |             },\n  791 |             Self::Yanked(_) => match other {\n  792 |                 Self::ExcludeNewer(_) | Self::Tag(_) | Self::RequiresPython(_, _) => false,\n  793 |                 // Yanks with a reason are more helpful for errors\n  794 |                 Self::Yanked(yanked_other) => matches!(yanked_other, Yanked::Reason(_)),\n  795 |                 Self::MissingPlatform(_) | Self::NoBinary => true,\n  796 |             },\n  797 |             Self::NoBinary => match other {\n  798 |                 Self::ExcludeNewer(_)\n  799 |                 | Self::Tag(_)\n  800 |                 | Self::RequiresPython(_, _)\n  801 |                 | Self::Yanked(_) => false,\n  802 |                 Self::NoBinary => false,\n  803 |                 Self::MissingPlatform(_) => true,\n  804 |             },\n  805 |             Self::MissingPlatform(_) => false,\n  806 |         }\n  807 |     }\n  808 | }","lines":50,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/prioritized_distribution.rs#L759-L808"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `handle_option`, the `example` attribute branch calls `get_string_literal(&meta, \"value_type\", \"option\")`, passing the meta-name `\"value_type\"` instead of `\"example\"`. The `meta_name` argument is only used to build the diagnostic message `expected {attribute_name} attribute to be a string: `{meta_name} = \"...\"``, so a malformed `#[option(example = 123)]` produces a misleading error that tells the developer to fix `value_type` rather than `example`.","fix":"Change the literal from `\"value_type\"` to `\"example\"`:\n```rust\nlet example_text = get_string_literal(&meta, \"example\", \"option\")?.value();\n```","locations":[{"ref":"crates/uv-macros/src/options_metadata.rs:289-291","code":"  289 |         } else if meta.path.is_ident(\"example\") {\n  290 |             let example_text = get_string_literal(&meta, \"value_type\", \"option\")?.value();\n  291 |             example = Some(dedent(&example_text).trim_matches('\\n').to_string());","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-macros/src/options_metadata.rs#L289-L291"}]},{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `warn_on_requirements_txt_setting`, the warning emitted for the `no_build` mismatch begins with `Ignoring \\`--no-binary\\` setting from requirements file`, but this branch handles `--no-build` (the rest of the same message correctly references `--no-build`/`no-build`). This is a copy-paste from the `no_binary` branch directly above and produces a misleading, self-contradictory user-facing warning.","fix":"Change the leading token from `--no-binary` to `--no-build`: replace `\"Ignoring \\`--no-binary\\` setting from requirements file. Instead, use the \\`--no-build\\` ...\"` with `\"Ignoring \\`--no-build\\` setting from requirements file. Instead, use the \\`--no-build\\` ...\"`.","locations":[{"ref":"crates/uv/src/commands/project/mod.rs:3517-3521","code":" 3517 |     if !no_build.is_none() && settings.build_options.no_build() != no_build {\n 3518 |         warn_user_once!(\n 3519 |             \"Ignoring `--no-binary` setting from requirements file. Instead, use the `--no-build` command-line argument, or set `no-build` in a `uv.toml` or `pyproject.toml` file.\"\n 3520 |         );\n 3521 |     }","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/mod.rs#L3517-L3521"}]},{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the `PipCommand::Install` arm, `build_constraints` are parsed with `RequirementsSource::from_overrides_txt`, whereas every other command (`pip compile`, `pip sync`, `build`, `tool run`, `tool install`) parses build constraints with `RequirementsSource::from_constraints_txt`. This is the lone outlier. Both constructors currently return the same `Self::RequirementsTxt(path)` value, so resolution behavior is unchanged, but the validation error message is wrong: passing e.g. a `pyproject.toml`/`.toml`/`pylock.toml` to `--build-constraints` of `uv pip install` produces `\"... but overrides must be specified in requirements.txt format\"` instead of `\"... but constraints must be specified ...\"`. It is also latently dangerous if the two constructors ever diverge in behavior.","fix":"Change the `.map(RequirementsSource::from_overrides_txt)` on line 974 to `.map(RequirementsSource::from_constraints_txt)` to match all other `build_constraints` call sites.","locations":[{"ref":"crates/uv/src/lib.rs:971-975","code":"  971 |             let build_constraints = args\n  972 |                 .build_constraints\n  973 |                 .into_iter()\n  974 |                 .map(RequirementsSource::from_overrides_txt)\n  975 |                 .collect::<Result<Vec<_>, _>>()?;","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/lib.rs#L971-L975"}]},{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `python_patch`, the local binding for the patch component is misnamed `minor` (copied from `python_minor`). It reads `release()[2]` (the patch) but stores it in a variable called `minor`, which is confusing when reading the code.","fix":"Rename the binding: `let patch = self.markers.python_full_version().version.release()[2]; u8::try_from(patch).expect(\"invalid patch version\")`.","locations":[{"ref":"crates/uv-python/src/interpreter.rs:410-413","code":"  410 |     pub(crate) fn python_patch(&self) -> u8 {\n  411 |         let minor = self.markers.python_full_version().version.release()[2];\n  412 |         u8::try_from(minor).expect(\"invalid patch version\")\n  413 |     }","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/interpreter.rs#L410-L413"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `Osv::query_identifiers`, the batch response is paired with the outgoing queries positionally via `pending_batch.iter().zip(batch_response.results.iter())` (`crates/uv-audit/src/service/osv.rs:323-325`). `zip` silently truncates to the shorter of the two iterators, so if the vulnerability service (attacker-controlled via `--service-url`, or simply buggy) returns fewer `results` entries than `queries` sent in the batch, the trailing dependencies in that batch are silently dropped from `result_map` with no error, no warning, and no log message. Because `uv-audit` is a security-auditing tool, this is a false-negative bug: some dependencies would be reported as vulnerability-free purely because the response was short, without any indication to the user that the audit was incomplete.","fix":"Validate that `batch_response.results.len() == pending_batch.len()` before zipping, and return an `Error` (or at least `tracing::warn!`) on mismatch instead of silently truncating:\n```rust\nif batch_response.results.len() != pending_batch.len() {\n    return Err(Error::MalformedRecord {\n        id: url.to_string(),\n        err: reqwest_middleware::Error::Middleware(anyhow::anyhow!(\n            \"OSV batch response length {} did not match request length {}\",\n            batch_response.results.len(),\n            pending_batch.len()\n        )),\n    });\n}\n```","locations":[{"ref":"crates/uv-audit/src/service/osv.rs:289-346","code":"  289 |         loop {\n  290 |             let mut next_pending = Vec::new();\n  291 |             for pending_batch in pending.chunks(OSV_QUERY_BATCH_SIZE) {\n  292 |                 let request = QueryBatchRequest {\n  293 |                     queries: pending_batch\n  294 |                         .iter()\n  295 |                         .map(|(dep, page_token)| QueryRequest {\n  296 |                             package: Package {\n  297 |                                 name: dep.name().to_string(),\n  298 |                                 ecosystem: \"PyPI\".to_string(),\n  299 |                             },\n  300 |                             version: dep.version().to_string(),\n  301 |                             page_token: page_token.clone(),\n  302 |                         })\n  303 |                         .collect(),\n  304 |                 };\n  305 | \n  306 |                 // NOTE: we need `uncached` here to access the underlying\n  307 |                 // client for our POST request.\n  308 |                 let batch_response: QueryBatchResponse = self\n  309 |                     .client\n  310 |                     .uncached()\n  311 |                     .for_host(&url)\n  312 |                     .raw_client()\n  313 |                     .post(url.as_ref())\n  314 |                     .json(&request)\n  315 |                     .send()\n  316 |                     .await?\n  317 |                     .error_for_status()\n  318 |                     .map_err(reqwest_middleware::Error::Reqwest)?\n  319 |                     .json()\n  320 |                     .await\n  321 |                     .map_err(reqwest_middleware::Error::Reqwest)?;\n  322 | \n  323 |                 for ((dep, _), batch_result) in\n  324 |                     pending_batch.iter().zip(batch_response.results.iter())\n  325 |                 {\n  326 |                     let ids = result_map.entry(dep).or_default();\n  327 |                     ids.extend(\n  328 |                         batch_result\n  329 |                             .vulns\n  330 |                             .iter()\n  331 |                             .filter(|v| filter.matches(&v.id))\n  332 |                             .map(|v| VulnerabilityID::new(v.id.clone())),\n  333 |                     );\n  334 |                     if let Some(token) = &batch_result.next_page_token {\n  335 |                         next_pending.push((*dep, Some(token.clone())));\n  336 |                     }\n  337 |                 }\n  338 |             }\n  339 | \n  340 |             if next_pending.is_empty() {\n  341 |                 break;\n  342 |             }\n  343 |             pending = next_pending;\n  344 |         }\n  345 | \n  346 |         Ok(result_map)","lines":58,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-audit/src/service/osv.rs#L289-L346"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`download_remote_script` streams the HTTP response body straight to a temp file without ever checking the response status. `reqwest` does not treat 4xx/5xx as errors, so if the remote script URL returns e.g. a 404 HTML page, that error page is written to the `.py` temp file and subsequently executed by the interpreter as if it were the user's script. Every sibling download path checks status - `resolve_gist_url` calls `response.error_for_status_ref()?` at `run.rs:1948` and `read_pylock_toml` calls it at `pylock.rs:38` - but neither the initial `send()` (`run.rs:1611-1615`) nor the post-Gist-redirect `send()` (`run.rs:1624-1628`) is validated here.","fix":"Call `response.error_for_status_ref()?;` immediately after each `.send().await?` in `download_remote_script` (after line 1615 and after line 1628), mirroring `resolve_gist_url` and `read_pylock_toml`, so a failed download surfaces the HTTP error instead of producing a script file containing the error body.","locations":[{"ref":"crates/uv/src/commands/project/run.rs:1610-1649","code":" 1610 |         let client = client_builder.build()?;\n 1611 |         let mut response = client\n 1612 |             .for_host(url)\n 1613 |             .get(Url::from(url.clone()))\n 1614 |             .send()\n 1615 |             .await?;\n 1616 | \n 1617 |         let gist_url;\n 1618 |         // If it's a Gist URL, use the GitHub API to get the raw URL.\n 1619 |         if response.url().host_str() == Some(\"gist.github.com\") {\n 1620 |             gist_url =\n 1621 |                 resolve_gist_url(DisplaySafeUrl::ref_cast(response.url()), client_builder).await?;\n 1622 |             url = &gist_url;\n 1623 | \n 1624 |             response = client\n 1625 |                 .for_host(url)\n 1626 |                 .get(Url::from(url.clone()))\n 1627 |                 .send()\n 1628 |                 .await?;\n 1629 |         }\n 1630 | \n 1631 |         let file_stem = url\n 1632 |             .path_segments()\n 1633 |             .and_then(Iterator::last)\n 1634 |             .and_then(|segment| segment.strip_suffix(\".py\"))\n 1635 |             .unwrap_or(\"script\");\n 1636 |         let file = tempfile::Builder::new()\n 1637 |             .prefix(file_stem)\n 1638 |             .suffix(\".py\")\n 1639 |             .tempfile()?;\n 1640 | \n 1641 |         // Stream the response to the file.\n 1642 |         let mut writer = file.as_file();\n 1643 |         let mut reader = response.bytes_stream();\n 1644 |         while let Some(chunk) = reader.next().await {\n 1645 |             use std::io::Write;\n 1646 |             writer.write_all(&chunk?)?;\n 1647 |         }\n 1648 | \n 1649 |         Ok(file)","lines":40,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/run.rs#L1610-L1649"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `uninstall`, the `ExitStatus` returned by `do_uninstall` is discarded via `?` (`do_uninstall(...).await?;`). `do_uninstall` returns `Ok(ExitStatus::Failure)` in several normal failure paths (no installations found at line 121, no matching installations at line 137, and removal errors at line 334), but the caller ignores that value, performs directory cleanup, and unconditionally returns `Ok(ExitStatus::Success)` at line 58. As a result `uv python uninstall <nonexistent>` and uninstalls that hit removal errors exit with status code 0 instead of a failure, breaking scripting and CI checks.","fix":"Capture and propagate the status, e.g. `let status = do_uninstall(&installations, targets, all, printer).await?;` and return `status` (or short-circuit `if status != ExitStatus::Success { return Ok(status); }`) instead of always returning `Ok(ExitStatus::Success)`. Decide explicitly whether directory cleanup should still run when `do_uninstall` reports failure.","locations":[{"ref":"crates/uv/src/commands/python/uninstall.rs:37-58","code":"   37 |     // Perform the uninstallation.\n   38 |     do_uninstall(&installations, targets, all, printer).await?;\n   39 | \n   40 |     // Clean up any empty directories.\n   41 |     if uv_fs::directories(installations.root())?.all(|path| uv_fs::is_temporary(&path)) {\n   42 |         fs_err::tokio::remove_dir_all(&installations.root()).await?;\n   43 | \n   44 |         if let Some(top_level) = installations.root().parent() {\n   45 |             // Remove the `toolchains` symlink.\n   46 |             match fs_err::tokio::remove_file(top_level.join(\"toolchains\")).await {\n   47 |                 Ok(()) => {}\n   48 |                 Err(err) if err.kind() == std::io::ErrorKind::NotFound => {}\n   49 |                 Err(err) => return Err(err.into()),\n   50 |             }\n   51 | \n   52 |             if uv_fs::directories(top_level)?.all(|path| uv_fs::is_temporary(&path)) {\n   53 |                 fs_err::tokio::remove_dir_all(top_level).await?;\n   54 |             }\n   55 |         }\n   56 |     }\n   57 | \n   58 |     Ok(ExitStatus::Success)","lines":22,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/python/uninstall.rs#L37-L58"},{"ref":"crates/uv/src/commands/python/uninstall.rs:118-137","code":"  118 | \n  119 |             if matches!(requests.as_slice(), [PythonRequest::Default]) {\n  120 |                 writeln!(printer.stderr(), \"No Python installations found\")?;\n  121 |                 return Ok(ExitStatus::Failure);\n  122 |             }\n  123 | \n  124 |             writeln!(\n  125 |                 printer.stderr(),\n  126 |                 \"No existing installations found for: {}\",\n  127 |                 request.cyan()\n  128 |             )?;\n  129 |         }\n  130 |     }\n  131 | \n  132 |     if matching_installations.is_empty() {\n  133 |         writeln!(\n  134 |             printer.stderr(),\n  135 |             \"No Python installations found matching the requests\"\n  136 |         )?;\n  137 |         return Ok(ExitStatus::Failure);","lines":20,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/python/uninstall.rs#L118-L137"},{"ref":"crates/uv/src/commands/python/uninstall.rs:325-335","code":"  325 |     if !errors.is_empty() {\n  326 |         for (key, err) in errors {\n  327 |             writeln!(\n  328 |                 printer.stderr(),\n  329 |                 \"Failed to uninstall {}: {}\",\n  330 |                 key.green(),\n  331 |                 err.to_string().trim()\n  332 |             )?;\n  333 |         }\n  334 |         return Ok(ExitStatus::Failure);\n  335 |     }","lines":11,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/python/uninstall.rs#L325-L335"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `Cache::prune`'s fourth pass (removing unused archives), `let target = fs_err::canonicalize(&path)?;` propagates any I/O error with `?`, aborting the entire `prune()` call on a single failure. This is inconsistent with the rest of the same function, which gracefully tolerates `NotFound` on the enclosing `read_dir` calls (e.g. lines 628, 646, 707-708). Because entries are first listed with `read_dir` and only later canonicalized, there is a TOCTOU window: if another process (e.g. a concurrent `uv` invocation, or a `remove()`/`prune()` racing with itself) deletes an archive directory between listing and canonicalizing it, this call fails and the whole prune operation is aborted rather than skipping that one dangling entry, leaving other genuinely-dangling archives unprocessed.","fix":"Handle `NotFound` for the per-entry `canonicalize` the same way as elsewhere in this function: ```rust\nlet target = match fs_err::canonicalize(&path) {\n    Ok(target) => target,\n    Err(err) if err.kind() == io::ErrorKind::NotFound => continue,\n    Err(err) => return Err(err),\n};\n```","locations":[{"ref":"crates/uv-cache/src/lib.rs:695-709","code":"  695 |         match fs_err::read_dir(self.bucket(CacheBucket::Archive)) {\n  696 |             Ok(entries) => {\n  697 |                 for entry in entries {\n  698 |                     let entry = entry?;\n  699 |                     let path = entry.path();\n  700 |                     let target = fs_err::canonicalize(&path)?;\n  701 |                     if !references.contains_key(&target) {\n  702 |                         debug!(\"Removing dangling cache archive: {}\", path.display());\n  703 |                         summary += rm_rf(path)?;\n  704 |                     }\n  705 |                 }\n  706 |             }\n  707 |             Err(err) if err.kind() == io::ErrorKind::NotFound => (),\n  708 |             Err(err) => return Err(err),\n  709 |         }","lines":15,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cache/src/lib.rs#L695-L709"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `uninstall_wheel`, when `fs_err::remove_file(&path)` fails with a non-`NotFound` error the code falls back to `fs_err::remove_dir_all(&path)`. If that fallback also fails, the inner arm `Err(_) => return Err(err.into())` returns the outer `err` (the original `remove_file` error) and discards the actual `remove_dir_all` error. On Unix, `remove_file` on a directory yields `EISDIR` (\"Is a directory\"), so the user is shown a misleading \"Is a directory\" message even though the real failure (e.g. `PermissionDenied` inside the tree) came from `remove_dir_all`.","fix":"Bind and propagate the inner error instead of the outer one: change `Err(_) => return Err(err.into())` to `Err(dir_err) => return Err(dir_err.into())` so the `remove_dir_all` failure is reported.","locations":[{"ref":"crates/uv-install-wheel/src/uninstall.rs:81-98","code":"   81 |         match fs_err::remove_file(&path) {\n   82 |             Ok(()) => {\n   83 |                 trace!(\"Removed file: {}\", path.display());\n   84 |                 file_count += 1;\n   85 |                 if let Some(parent) = path.parent() {\n   86 |                     visited.insert(normalize_path(parent));\n   87 |                 }\n   88 |             }\n   89 |             Err(err) if err.kind() == std::io::ErrorKind::NotFound => {}\n   90 |             Err(err) => match fs_err::remove_dir_all(&path) {\n   91 |                 Ok(()) => {\n   92 |                     trace!(\"Removed directory: {}\", path.display());\n   93 |                     dir_count += 1;\n   94 |                 }\n   95 |                 Err(err) if err.kind() == std::io::ErrorKind::NotFound => {}\n   96 |                 Err(_) => return Err(err.into()),\n   97 |             },\n   98 |         }","lines":18,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-install-wheel/src/uninstall.rs#L81-L98"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"Multiple doc comments and user-facing panic/error messages in `uv-preview` tell the reader to call `uv_preview::init`, but no such function exists. The public initialization entry point is `set` (see callers in `uv/src/lib.rs`, `uv-build/src/main.rs`, etc.). The `# Panics` doc on `get` references the broken intra-doc link `[`init`]`, the uninitialized-state `panic!` prints `Hint: Use `uv_preview::init` ...`, and the `with_features` guard prints `Cannot use ... after `uv_preview::init` has been called`. A user hitting these messages would search for a nonexistent `init` symbol.","fix":"Replace every `init` reference with the actual function name `set` (and fix the intra-doc link to `[`set`]`). For example, change the hint string to `Use `{}::set` or `{}::test::with_features` to initialize it` and the `with_features` message to `... after `uv_preview::set` has been called`.","locations":[{"ref":"crates/uv-preview/src/lib.rs:96-99","code":"   96 | /// # Panics\n   97 | ///\n   98 | /// When called before [`init`] or (with the `testing` feature) when the\n   99 | /// current thread does not hold a [`test::with_features`] guard.","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-preview/src/lib.rs#L96-L99"},{"ref":"crates/uv-preview/src/lib.rs:122-126","code":"  122 |         None => panic!(\n  123 |             \"The preview configuration has not been initialized\\nHint: Use `{}::init` or `{}::test::with_features` to initialize it\",\n  124 |             module_path!(),\n  125 |             module_path!()\n  126 |         ),","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-preview/src/lib.rs#L122-L126"},{"ref":"crates/uv-preview/src/lib.rs:199-201","code":"  199 |                 panic!(\n  200 |                     \"Cannot use `{}::with_features` after `uv_preview::init` has been called\",\n  201 |                     module_path!()","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-preview/src/lib.rs#L199-L201"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Error::RenameError` captures `stderr` from the failed `install_name_tool` invocation but the `#[error(...)]` attribute only formats `dylib`, so the captured `stderr` is never surfaced to the user. When patching the dylib install name fails, the underlying tool output (the actual reason for failure) is silently discarded even in the debug-mode `warn_user` path, which formats `{self}` (Display).","fix":"Include `stderr` in the error message, e.g. `#[error(\"Failed to update the install name of the Python dynamic library located at \\`{}\\`: {stderr}\", dylib.user_display())]`, so the diagnostic reaches the user.","locations":[{"ref":"crates/uv-python/src/macos_dylib.rs:45-46","code":"   45 |     #[error(\"Failed to update the install name of the Python dynamic library located at `{}`\", dylib.user_display())]\n   46 |     RenameError { dylib: PathBuf, stderr: String },","lines":2,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/macos_dylib.rs#L45-L46"},{"ref":"crates/uv-python/src/macos_dylib.rs:26-29","code":"   26 |     if !output.status.success() {\n   27 |         let stderr = String::from_utf8_lossy(&output.stderr).into_owned();\n   28 |         return Err(Error::RenameError { dylib, stderr });\n   29 |     }","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/macos_dylib.rs#L26-L29"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `InstalledTools::tools`, a directory whose name is not a valid [`PackageName`] causes `PackageName::from_str(name)?` to propagate an error and abort listing of ALL tools. This contradicts the method's documented contract of reporting per-tool errors (missing/invalid receipts are collected into the returned `Vec` with `Err`), and a single stray/invalid directory in the tools root (e.g. one created manually) makes `uv tool list` fail entirely instead of skipping that entry.","fix":"Skip directories with invalid names (like the earlier `file_name()`/`to_str()` guard uses `else { continue; }`), e.g. `let Ok(name) = PackageName::from_str(name) else { continue; };`, or push a per-tool `Err` instead of returning from the whole function.","locations":[{"ref":"crates/uv-tool/src/lib.rs:156-185","code":"  156 |     pub fn tools(&self) -> Result<Vec<(PackageName, Result<Tool, Error>)>, Error> {\n  157 |         let mut tools = Vec::new();\n  158 |         for directory in uv_fs::directories(self.root())? {\n  159 |             let Some(name) = directory\n  160 |                 .file_name()\n  161 |                 .and_then(|file_name| file_name.to_str())\n  162 |             else {\n  163 |                 continue;\n  164 |             };\n  165 |             let name = PackageName::from_str(name)?;\n  166 |             let path = directory.join(\"uv-receipt.toml\");\n  167 |             let contents = match fs_err::read_to_string(&path) {\n  168 |                 Ok(contents) => contents,\n  169 |                 Err(err) if err.kind() == io::ErrorKind::NotFound => {\n  170 |                     let err = Error::MissingToolReceipt(name.to_string(), path);\n  171 |                     tools.push((name, Err(err)));\n  172 |                     continue;\n  173 |                 }\n  174 |                 Err(err) => return Err(err.into()),\n  175 |             };\n  176 |             match ToolReceipt::from_string(contents) {\n  177 |                 Ok(tool_receipt) => tools.push((name, Ok(tool_receipt.tool))),\n  178 |                 Err(err) => {\n  179 |                     let err = Error::ReceiptRead(path, Box::new(err));\n  180 |                     tools.push((name, Err(err)));\n  181 |                 }\n  182 |             }\n  183 |         }\n  184 |         Ok(tools)\n  185 |     }","lines":30,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-tool/src/lib.rs#L156-L185"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`pip_show` with `--files` opens `RECORD` via `File::open(path)?` and parses it with `read_record(...)?`, so a single installed distribution that lacks a `RECORD` file (e.g., some egg-info or legacy-editable installs) makes the whole `uv pip show --files` invocation fail with an I/O error instead of gracefully skipping/warning for that one package. `pip` degrades gracefully in this case.","fix":"Handle a missing `RECORD` locally: match on `File::open(&path)`; on `ErrorKind::NotFound` print a `Files:` header with a note (or skip) rather than propagating the error with `?`, so other packages still render.","locations":[{"ref":"crates/uv/src/commands/pip/show.rs:216-223","code":"  216 |         if files {\n  217 |             let path = distribution.install_path().join(\"RECORD\");\n  218 |             let record = read_record(&mut File::open(path)?)?;\n  219 |             writeln!(printer.stdout(), \"Files:\")?;\n  220 |             for entry in record {\n  221 |                 writeln!(printer.stdout(), \"  {}\", entry.path)?;\n  222 |             }\n  223 |         }","lines":8,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/pip/show.rs#L216-L223"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"In `HashReader::poll_read`, after delegating to the inner reader it feeds `buf.filled()` (the *entire* filled region of the caller-supplied `ReadBuf`) into every hasher. The `AsyncRead` contract allows a `ReadBuf` to already contain filled bytes before `poll_read` is called; in that case those pre-existing bytes would be hashed again on this and every subsequent call, corrupting the digest. This is currently masked only because all present callers drive it through `tokio::io::copy`, `BufReader`, and `finish` (all of which reset `filled` to 0 per poll), so the bug is latent, but the code is incorrect for a general `AsyncRead` consumer (e.g. one that preserves partially-filled buffers across polls).","fix":"Record the filled length before delegating and hash only the newly-read bytes:\n```rust\nlet start = buf.filled().len();\nlet reader = Pin::new(&mut self.reader);\nmatch reader.poll_read(cx, buf) {\n    Poll::Ready(Ok(())) => {\n        let new = &buf.filled()[start..];\n        for hasher in self.hashers.iter_mut() {\n            hasher.update(new);\n        }\n        Poll::Ready(Ok(()))\n    }\n    other => other,\n}\n```","locations":[{"ref":"crates/uv-extract/src/hash.rs:94-109","code":"   94 |     fn poll_read(\n   95 |         mut self: Pin<&mut Self>,\n   96 |         cx: &mut Context<'_>,\n   97 |         buf: &mut ReadBuf<'_>,\n   98 |     ) -> Poll<std::io::Result<()>> {\n   99 |         let reader = Pin::new(&mut self.reader);\n  100 |         match reader.poll_read(cx, buf) {\n  101 |             Poll::Ready(Ok(())) => {\n  102 |                 for hasher in self.hashers.iter_mut() {\n  103 |                     hasher.update(buf.filled());\n  104 |                 }\n  105 |                 Poll::Ready(Ok(()))\n  106 |             }\n  107 |             other => other,\n  108 |         }\n  109 |     }","lines":16,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-extract/src/hash.rs#L94-L109"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`SupportedEnvironments::serialize` passes the full vector length (`Some(self.0.len())`) as the sequence-length hint to `serialize_seq`, but then skips every element whose `element.contents()` is `None` (the trivially-true / universal marker, e.g. an environment marker that simplifies to always-true). For self-describing formats (TOML/JSON, the only ones this type is used with today via `pyproject.toml`/`uv.toml`) an inaccurate length hint is harmless, but for any length-prefixed format (bincode/postcard) the declared count would exceed the number of elements actually emitted, producing a corrupt/undeserializable stream. The declared length must match the number of elements actually serialized.","fix":"Compute the accurate count first, e.g. `let contents: Vec<_> = self.0.iter().filter_map(|e| e.contents()).collect(); let mut seq = serializer.serialize_seq(Some(contents.len()))?; for c in &contents { seq.serialize_element(c)?; }`, or pass `None` to `serialize_seq` so no bogus length is declared.","locations":[{"ref":"crates/uv-pypi-types/src/supported_environments.rs:47-59","code":"   47 | impl serde::Serialize for SupportedEnvironments {\n   48 |     fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>\n   49 |     where\n   50 |         S: serde::Serializer,\n   51 |     {\n   52 |         let mut seq = serializer.serialize_seq(Some(self.0.len()))?;\n   53 |         for element in &self.0 {\n   54 |             if let Some(contents) = element.contents() {\n   55 |                 seq.serialize_element(&contents)?;\n   56 |             }\n   57 |         }\n   58 |         seq.end()\n   59 |     }","lines":13,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pypi-types/src/supported_environments.rs#L47-L59"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"`MarkerEnvironment::platform_version` is declared `fn` (private) while every other sibling accessor (`os_name`, `platform_machine`, `python_full_version`, etc.) is `pub`, and a corresponding `pub` setter `with_platform_version` exists. This makes the public API asymmetric: callers can set `platform_version` but cannot read it directly (only indirectly via `get_string`). The doc link `[MarkerEnvironment::platform_version]` at line 237 also points at a private item. Likely an accidental omission of `pub`.","fix":"Make the accessor `pub fn platform_version(&self) -> &str` for consistency with the other getters and its public setter, unless the private visibility is intentional (in which case drop the public intra-doc link reference).","locations":[{"ref":"crates/uv-pep508/src/marker/environment.rs:146-149","code":"  146 |     #[inline]\n  147 |     fn platform_version(&self) -> &str {\n  148 |         &self.inner.platform_version\n  149 |     }","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/environment.rs#L146-L149"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`fetch_and_find_matching_version` in `crates/uv-bin-install/src/lib.rs:587-613` streams the NDJSON version manifest into an unbounded `Vec<u8>` buffer (`buffer.extend_from_slice(&chunk)` at line 596) with no maximum size check, and repeatedly calls `buffer.drain(..=newline_pos)` (line 602) to consume each completed line, which shifts all remaining buffered bytes left on every line (O(n) per line, so O(n^2) over a large manifest). Because the manifest URL can point at a user-configured mirror (`PYX`/Astral mirror env vars) or, on a compromised/MITM'd connection, an attacker-controlled server, a malicious or buggy server that never sends a newline (or sends an extremely long line) can force unbounded memory growth in the client process, and even a legitimate but large manifest incurs needless quadratic copying.","fix":"Cap the buffer size (e.g. reject/err out via `Error::ManifestParse`-style variant if `buffer.len()` exceeds a reasonable bound such as a few MB before a newline is found), and use a `VecDeque` or track a start offset instead of `Vec::drain` to consume processed lines in O(1) amortized time instead of shifting the whole buffer on every line.","locations":[{"ref":"crates/uv-bin-install/src/lib.rs:587-613","code":"  587 |     // Stream the response line by line\n  588 |     let mut stream = response.bytes_stream();\n  589 |     let mut buffer = Vec::new();\n  590 | \n  591 |     while let Some(chunk) = stream.next().await {\n  592 |         let chunk = chunk.map_err(|err| Error::ManifestFetch {\n  593 |             url: manifest_url.to_string(),\n  594 |             source: reqwest_middleware::Error::Reqwest(err),\n  595 |         })?;\n  596 |         buffer.extend_from_slice(&chunk);\n  597 | \n  598 |         // Process complete lines\n  599 |         while let Some(newline_pos) = buffer.iter().position(|&b| b == b'\\n') {\n  600 |             let line = &buffer[..newline_pos];\n  601 |             let result = parse_and_check(line)?;\n  602 |             buffer.drain(..=newline_pos);\n  603 | \n  604 |             if let Some(resolved) = result {\n  605 |                 return Ok(resolved);\n  606 |             }\n  607 |         }\n  608 |     }\n  609 | \n  610 |     // Process any remaining data in buffer (in case there's no trailing newline)\n  611 |     if let Some(resolved) = parse_and_check(&buffer)? {\n  612 |         return Ok(resolved);\n  613 |     }","lines":27,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-bin-install/src/lib.rs#L587-L613"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`HashReader::finish` allocates a fresh 8 KiB heap buffer on every loop iteration via `self.read(&mut vec![0; 8192])`. Since `finish` is used to drain (and hash) an entire download/archive, this performs one heap allocation per ~8 KiB of data, which is wasteful in a hot path that runs over every downloaded wheel, sdist, and Python interpreter.","fix":"Allocate the buffer once before the loop and reuse it:\n```rust\npub async fn finish(&mut self) -> Result<(), std::io::Error> {\n    let mut buffer = vec![0; 8192];\n    while self.read(&mut buffer).await? > 0 {}\n    Ok(())\n}\n```","locations":[{"ref":"crates/uv-extract/src/hash.rs:83-87","code":"   83 |     pub async fn finish(&mut self) -> Result<(), std::io::Error> {\n   84 |         while self.read(&mut vec![0; 8192]).await? > 0 {}\n   85 | \n   86 |         Ok(())\n   87 |     }","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-extract/src/hash.rs#L83-L87"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`InternerGuard::only_extras` recurses over the ADD without memoization, while its structural twin `without_extras`/`without_extras_cached` uses an `FxHashMap<NodeId, NodeId>` cache precisely to keep the traversal polynomial over shared subgraphs. Because ADDs frequently contain duplicated subgraphs across branches (noted in the `and` memoization comment at lines 426-428), `only_extras` can recompute the same nodes repeatedly, giving worst-case exponential behavior on large markers. It is reachable in the resolver via `MarkerTree::only_extras` (`universal_marker.rs:389`).","fix":"Give `only_extras` a cached variant mirroring `without_extras_cached`: thread an `&mut FxHashMap<NodeId, NodeId>` through the recursion, returning early on cache hits and inserting the computed result keyed by the original `NodeId`.","locations":[{"ref":"crates/uv-pep508/src/marker/algebra.rs:709-730","code":"  709 |     pub(crate) fn only_extras(&mut self, mut i: NodeId) -> NodeId {\n  710 |         if matches!(i, NodeId::TRUE | NodeId::FALSE) {\n  711 |             return i;\n  712 |         }\n  713 | \n  714 |         let parent = i;\n  715 |         let node = self.shared.node(i);\n  716 |         if !matches!(node.var, Variable::Extra(_)) {\n  717 |             i = NodeId::FALSE;\n  718 |             for child in node.children.nodes() {\n  719 |                 i = self.or(i, child.negate(parent));\n  720 |             }\n  721 |             if i.is_true() {\n  722 |                 return NodeId::TRUE;\n  723 |             }\n  724 |             self.only_extras(i)\n  725 |         } else {\n  726 |             // Restrict all nodes recursively.\n  727 |             let children = node.children.map(i, |node| self.only_extras(node));\n  728 |             self.create_node(node.var.clone(), children)\n  729 |         }\n  730 |     }","lines":22,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/algebra.rs#L709-L730"},{"ref":"crates/uv-pep508/src/marker/algebra.rs:661-701","code":"  661 |     pub(crate) fn without_extras(&mut self, i: NodeId) -> NodeId {\n  662 |         let mut cache = FxHashMap::default();\n  663 |         self.without_extras_cached(i, &mut cache)\n  664 |     }\n  665 | \n  666 |     fn without_extras_cached(\n  667 |         &mut self,\n  668 |         mut i: NodeId,\n  669 |         cache: &mut FxHashMap<NodeId, NodeId>,\n  670 |     ) -> NodeId {\n  671 |         if matches!(i, NodeId::TRUE | NodeId::FALSE) {\n  672 |             return i;\n  673 |         }\n  674 | \n  675 |         if let Some(&cached) = cache.get(&i) {\n  676 |             return cached;\n  677 |         }\n  678 | \n  679 |         let original = i;\n  680 |         let parent = i;\n  681 |         let node = self.shared.node(i);\n  682 |         let result = if matches!(node.var, Variable::Extra(_)) {\n  683 |             i = NodeId::FALSE;\n  684 |             for child in node.children.nodes() {\n  685 |                 i = self.or(i, child.negate(parent));\n  686 |             }\n  687 |             if i.is_true() {\n  688 |                 NodeId::TRUE\n  689 |             } else {\n  690 |                 self.without_extras_cached(i, cache)\n  691 |             }\n  692 |         } else {\n  693 |             // Restrict all nodes recursively.\n  694 |             let children = node\n  695 |                 .children\n  696 |                 .map(i, |node| self.without_extras_cached(node, cache));\n  697 |             self.create_node(node.var.clone(), children)\n  698 |         };\n  699 |         cache.insert(original, result);\n  700 |         result\n  701 |     }","lines":41,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/algebra.rs#L661-L701"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`apply_filters` compiles every filter regex from scratch on each invocation via `Regex::new(matcher.as_ref())`. It is called for every snapshot assertion (through `run_and_format_silent`/`uv_snapshot!`), and each `TestContext` carries dozens of filters plus the global `INSTA_FILTERS`, so the test suite re-compiles the same regexes thousands of times. The existing `// TODO(konstin): Cache regex compilation` comment acknowledges this. Impact is limited to test-suite wall-clock time.","fix":"Cache compiled `Regex` values, e.g. keep a `OnceLock`/`LazyLock`-backed cache keyed by pattern string, or precompile the context filters once into `Vec<(Regex, String)>` when the `TestContext` is built rather than on every `apply_filters` call.","locations":[{"ref":"crates/uv-test/src/lib.rs:2163-2172","code":" 2163 | pub fn apply_filters<T: AsRef<str>>(mut snapshot: String, filters: impl AsRef<[(T, T)]>) -> String {\n 2164 |     for (matcher, replacement) in filters.as_ref() {\n 2165 |         // TODO(konstin): Cache regex compilation\n 2166 |         let re = Regex::new(matcher.as_ref()).expect(\"Do you need to regex::escape your filter?\");\n 2167 |         if re.is_match(&snapshot) {\n 2168 |             snapshot = re.replace_all(&snapshot, replacement.as_ref()).to_string();\n 2169 |         }\n 2170 |     }\n 2171 |     snapshot\n 2172 | }","lines":10,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-test/src/lib.rs#L2163-L2172"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"Inside the per-requirement loop, `RequiresPython::from_specifiers(requires_python.clone()).to_marker_tree()` is recomputed for every requirement even though `requires_python` is constant across the loop. This clones the specifiers and rebuilds the marker tree (a BDD) once per requirement instead of once per group.","fix":"Hoist the computation out of the loop:\n```rust\nlet extra_markers =\n    RequiresPython::from_specifiers(requires_python.clone()).to_marker_tree();\nfor requirement in &mut requirements {\n    requirement.marker.and(extra_markers.clone());\n}\n```\n(so the tree is built once and only cloned/`and`-ed per requirement).","locations":[{"ref":"crates/uv-workspace/src/dependency_groups.rs:181-185","code":"  181 |                 for requirement in &mut requirements {\n  182 |                     let extra_markers =\n  183 |                         RequiresPython::from_specifiers(requires_python.clone()).to_marker_tree();\n  184 |                     requirement.marker.and(extra_markers);\n  185 |                 }","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/dependency_groups.rs#L181-L185"}]},{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `add_dependency`, when prepending to a non-empty list (`index == 0`), the code calls `deps.clone()` to read the prefix of the second element while sidestepping the borrow checker. This clones the entire `Array` (every dependency value and its decor) just to read one `RawString` prefix.","fix":"Read and clone only the needed prefix, releasing the borrow immediately, instead of cloning the whole array: `let prefix = deps.get(index + 1).unwrap().decor().prefix().unwrap().clone();` (no `deps.clone()`). The owned `prefix` no longer borrows `deps`, so the later `deps.get_mut(...)` calls are unaffected.","locations":[{"ref":"crates/uv-workspace/src/pyproject_mut.rs:1587-1595","code":" 1587 |             if deps.len() > 1 && index == 0 {\n 1588 |                 let prefix = deps\n 1589 |                     .clone()\n 1590 |                     .get(index + 1)\n 1591 |                     .unwrap()\n 1592 |                     .decor()\n 1593 |                     .prefix()\n 1594 |                     .unwrap()\n 1595 |                     .clone();","lines":9,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/pyproject_mut.rs#L1587-L1595"}]},{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"When clearing the whole cache, `cache_clean` walks the entire cache tree once with `walkdir::WalkDir::new(cache.root()).into_iter().count()` purely to size the progress reporter, then `cache.clear(...)` walks and removes the tree a second time. For a large cache (hundreds of thousands of files) this roughly doubles the filesystem traversal cost just to render a progress bar.","fix":"Avoid the pre-count traversal: either drive the progress reporter incrementally from within `cache.clear` (report as entries are removed) or use an indeterminate/spinner reporter so the extra full-tree walk is not needed.","locations":[{"ref":"crates/uv/src/commands/cache_clean.rs:53-59","code":"   53 |         let num_paths = walkdir::WalkDir::new(cache.root()).into_iter().count();\n   54 |         let reporter = CleaningDirectoryReporter::new(printer, Some(num_paths));\n   55 | \n   56 |         let root = cache.root().to_path_buf();\n   57 |         cache\n   58 |             .clear(Box::new(reporter))\n   59 |             .with_context(|| format!(\"Failed to clear cache at: {}\", root.user_display()))?","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/cache_clean.rs#L53-L59"}]},{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `ReleaseNumbers::push`, when the inline buffer spills to the heap, the freshly-built owned `Vec` is cloned unnecessarily. `numbers` is already an owned `Vec<u64>` (produced by `numbers.to_vec()` then `numbers.push(n)`), so `Self::Vec(numbers.clone())` allocates a second `Vec` and then immediately drops the original. It should just move `numbers`.","fix":"Replace `*self = Self::Vec(numbers.clone());` with `*self = Self::Vec(numbers);` (the local `numbers` is already owned and no longer used afterward).","locations":[{"ref":"crates/uv-pep440/src/version.rs:2461-2465","code":" 2461 |                 if *len == 4 {\n 2462 |                     let mut numbers = numbers.to_vec();
