}","lines":47,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-client/src/html.rs#L145-L191"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`TrustedHost::from_str` in `crates/uv-configuration/src/trusted_host.rs:89-120` strips a trailing path (`/...`) from the host component via `host.split('/').next()`, but does not do the same for the port component. When a `--trusted-host` / `trusted-host` config value includes both a port and a path (e.g. `\"https://example.com:8443/simple\"`), the code does `let mut parts = s.splitn(2, ':')`, takes `parts.next()` for the host (correctly stripping `/simple`), then takes `parts.next()` for the port, which yields the raw string `\"8443/simple\"`. `str::parse::<u16>` then fails on that string and the whole value is rejected with `TrustedHostError::InvalidPort`, even though the semantically-equivalent host without a port (e.g. `\"https://example.com/simple\"`, covered by the existing `parse` test) parses successfully. This is inconsistent: `TrustedHost` demonstrably supports trailing paths (per the `parse_proxy_url...`-style test `\"https://example.com/hello/world\"`), but only when no port is present.","fix":"Strip any trailing path segment from the port portion before parsing it, mirroring the host handling, e.g.:\n```rust\nlet port = parts\n    .next()\n    .map(|port| port.split('/').next().unwrap_or(port))\n    .map(str::parse)\n    .transpose()\n    .map_err(|_| TrustedHostError::InvalidPort(s.to_string()))?;\n```\nAdd a regression test such as `\"https://example.com:8443/simple\".parse::<TrustedHost>()` asserting it yields `Host { scheme: Some(\"https\".into()), host: \"example.com\".into(), port: Some(8443) }`.","locations":[{"ref":"crates/uv-configuration/src/trusted_host.rs:103-117","code":"  103 |         let mut parts = s.splitn(2, ':');\n  104 | \n  105 |         // Detect host.\n  106 |         let host = parts\n  107 |             .next()\n  108 |             .and_then(|host| host.split('/').next())\n  109 |             .map(ToString::to_string)\n  110 |             .ok_or_else(|| TrustedHostError::MissingHost(s.to_string()))?;\n  111 | \n  112 |         // Detect port.\n  113 |         let port = parts\n  114 |             .next()\n  115 |             .map(str::parse)\n  116 |             .transpose()\n  117 |             .map_err(|_| TrustedHostError::InvalidPort(s.to_string()))?;","lines":15,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-configuration/src/trusted_host.rs#L103-L117"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`BuiltWheelIndex::find` in `crates/uv-distribution/src/index/built_wheel_index.rs` is documented as preferring \"newer versions over older versions, and aims to maximize compatibility with the target platform\" (i.e. version should take priority, with compatibility only as a tiebreaker), but the actual override condition is `dist_info.filename.version > existing.filename.version || compatibility > existing.filename.compatibility(self.tags)`. Because this is an `||` rather than a lexicographic `(version, then compatibility)` comparison, a candidate wheel with a strictly *lower* version than the current best can still replace it purely because its platform-tag `compatibility` ranks higher (`TagCompatibility` derives `Ord`, confirmed in `crates/uv-platform-tags/src/tags.rs:62-71`). This directly contradicts the stated priority and differs from the equivalent, correct selection logic in the sibling `RegistryWheelIndex` (`crates/uv-distribution/src/index/registry_wheel_index.rs:364-379`), which explicitly sorts by `version.cmp(...).then_with(|| compatibility.cmp(...))`. In the common case a build-cache shard only contains wheels of one version (all built from the same source-distribution revision), so the bug is latent, but if a build backend produces different wheel versions for the same cached revision (e.g. dynamic/time-based versioning, or PEP 517 backends resolving version differently across builds), `find` can silently pick and reuse an older, stale built wheel over a newer one.","fix":"Mirror the ordering used in `RegistryWheelIndex` and make version strictly take priority over compatibility, only falling back to compatibility when versions are equal, e.g.:\n```rust\nif let Some(existing) = candidate.as_ref() {\n    let existing_compatibility = existing.filename.compatibility(self.tags);\n    let better = match dist_info.filename.version.cmp(&existing.filename.version) {\n        std::cmp::Ordering::Greater => true,\n        std::cmp::Ordering::Equal => compatibility > existing_compatibility,\n        std::cmp::Ordering::Less => false,\n    };\n    if better {\n        candidate = Some(dist_info);\n    }\n} else {\n    candidate = Some(dist_info);\n}\n```\nThis also avoids recomputing `existing.filename.compatibility(self.tags)` from scratch on every iteration by only computing it when actually needed for the tie-break.","locations":[{"ref":"crates/uv-distribution/src/index/built_wheel_index.rs:329-338","code":"  329 |                     if let Some(existing) = candidate.as_ref() {\n  330 |                         // Override if the wheel is newer, or \"more\" compatible.\n  331 |                         if dist_info.filename.version > existing.filename.version\n  332 |                             || compatibility > existing.filename.compatibility(self.tags)\n  333 |                         {\n  334 |                             candidate = Some(dist_info);\n  335 |                         }\n  336 |                     } else {\n  337 |                         candidate = Some(dist_info);\n  338 |                     }","lines":10,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution/src/index/built_wheel_index.rs#L329-L338"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `fetch`, the short-commit-hash fast path for `GitReference::BranchOrTagOrCommit` is unreachable. `oid_to_fetch` is computed as `Some(rev)` only when the incoming `reference` is the `ReferenceOrOid::Oid` variant (line 681); it is `None` for every `ReferenceOrOid::Reference(...)` variant. But the `if let Some(oid_to_fetch) = oid_to_fetch.filter(|oid| is_short_hash_of(branch_or_tag_or_commit, *oid))` check at line 731-732 lives inside the `ReferenceOrOid::Reference(GitReference::BranchOrTagOrCommit(...))` arm, where `oid_to_fetch` is always `None`. A `GitReference` and a precise `Oid` are mutually exclusive here: `GitRemote::checkout` builds the reference as `locked_rev.map(ReferenceOrOid::Oid).unwrap_or(ReferenceOrOid::Reference(reference))`, so whenever a precise commit exists the reference is an `Oid` (handled by the separate arm at line 753) and never a `BranchOrTagOrCommit`. Consequently the intended optimization to fetch a single `+{oid}:refs/commit/{oid}` refspec for a pinned commit-hash reference never fires, and uv always falls into the `else` branch that fetches `+refs/heads/*`, `+HEAD`, and all tags. For a dependency pinned to a bare (short or full) commit hash that is not yet locked/precise, this forces a full fetch of every branch and tag instead of the single commit, which can be a large slowdown against big repositories. `is_short_hash_of` (line 947) is dead as a result.","fix":"Either remove the dead `if let Some(oid_to_fetch)` branch (and `is_short_hash_of`) since it can never execute, or actually make it reachable by deriving a fetchable commit for `BranchOrTagOrCommit`. If the goal is to fetch a specific commit for a pinned hash, the value must be threaded through: e.g. when the `BranchOrTagOrCommit(s)` string itself parses as a full `GitOid`, push `+{s}:refs/commit/{s}` directly, rather than relying on `oid_to_fetch` which is only populated for the `Oid` reference variant.","locations":[{"ref":"crates/uv-git/src/git.rs:681-694","code":"  681 |     let oid_to_fetch = if let ReferenceOrOid::Oid(rev) = reference {\n  682 |         let local_object = reference.resolve(repo).ok();\n  683 |         if let Some(local_object) = local_object {\n  684 |             if rev == local_object {\n  685 |                 return Ok(());\n  686 |             }\n  687 |         }\n  688 | \n  689 |         // If we know the reference is a full commit hash, we can just return it without\n  690 |         // querying GitHub.\n  691 |         Some(rev)\n  692 |     } else {\n  693 |         None\n  694 |     };","lines":14,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-git/src/git.rs#L681-L694"},{"ref":"crates/uv-git/src/git.rs:727-743","code":"  727 |         ReferenceOrOid::Reference(GitReference::BranchOrTagOrCommit(branch_or_tag_or_commit)) => {\n  728 |             // The `oid_to_fetch` is the exact commit we want to fetch. But it could be the exact\n  729 |             // commit of a branch or tag. We should only fetch it directly if it's the exact commit\n  730 |             // of a short commit hash.\n  731 |             if let Some(oid_to_fetch) =\n  732 |                 oid_to_fetch.filter(|oid| is_short_hash_of(branch_or_tag_or_commit, *oid))\n  733 |             {\n  734 |                 refspecs.push(format!(\"+{oid_to_fetch}:refs/commit/{oid_to_fetch}\"));\n  735 |             } else {\n  736 |                 // We don't know what the rev will point to. To handle this\n  737 |                 // situation we fetch all branches and tags, and then we pray\n  738 |                 // it's somewhere in there.\n  739 |                 refspecs.push(String::from(\"+refs/heads/*:refs/remotes/origin/*\"));\n  740 |                 refspecs.push(String::from(\"+HEAD:refs/remotes/origin/HEAD\"));\n  741 |                 tags = true;\n  742 |             }\n  743 |         }","lines":17,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-git/src/git.rs#L727-L743"},{"ref":"crates/uv-git/src/git.rs:946-953","code":"  946 | /// Whether `rev` is a shorter hash of `oid`.\n  947 | fn is_short_hash_of(rev: &str, oid: GitOid) -> bool {\n  948 |     let long_hash = oid.to_string();\n  949 |     match long_hash.get(..rev.len()) {\n  950 |         Some(truncated_long_hash) => truncated_long_hash.eq_ignore_ascii_case(rev),\n  951 |         None => false,\n  952 |     }\n  953 | }","lines":8,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-git/src/git.rs#L946-L953"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Edges::from_python_versions`, each version in a `python_version in '...'` / `not in '...'` list is converted with `python_version_to_full_version(...)?` inside a `map` closure, then `flatten_ok().collect::<Result<Ranges<_>, NodeId>>()?`. A single list element that is unrepresentable as a `python_version` (a version whose trimmed release has a non-zero 3rd+ segment, e.g. `3.9.1`) makes `python_version_to_full_version` return `Err(NodeId::FALSE)`, which the `?` propagates so the WHOLE expression collapses to `NodeId::FALSE` before the `NotIn` complement at lines 1419-1421 is even applied. This is wrong for a set-membership (union) operator: such an element should contribute nothing and be dropped, not poison the set. Concretely, `python_version in '3.9 3.9.1'` becomes unsatisfiable (`false`) instead of `python_full_version == '3.9.*'`, and far worse, `python_version not in '3.9.1'` becomes unsatisfiable (`false`) even though it must always be `true` (a `python_version` value can never equal `3.9.1`). Note the direct (non-list) path is correct: `python_version != '3.9.1'` correctly simplifies to `true` (see `tree.rs` test at line 2509), so the list path is inconsistent with it. Existing tests only exercise `3.10.0`, which `only_release_trimmed` reduces to the valid 2-segment `3.10`, so the buggy branch is untested. In the resolver this can silently drop dependencies or make `not in` constraints vanish.","fix":"Do not let a single `Err(NodeId::FALSE)` short-circuit the union. Build the range by folding, dropping elements that map to `Err(NodeId::FALSE)` (they match no `python_version`), e.g.:\n```rust\nlet mut range: Ranges<Version> = Ranges::empty();\nfor version in versions {\n    let specifier = VersionSpecifier::equals_version(version.only_release());\n    match python_version_to_full_version(specifier) {\n        Ok(specifier) => {\n            range = range.union(&release_specifier_to_range(specifier, true));\n        }\n        // An unrepresentable `python_version` matches nothing; skip it.\n        Err(node) if node == NodeId::FALSE => {}\n        Err(node) => return Err(node),\n    }\n}\nif operator == ContainerOperator::NotIn {\n    range = range.complement();\n}\nOk(Self::Version { edges: Self::from_range(&range) })\n```\nThis keeps valid versions and applies the `NotIn` complement afterwards.","locations":[{"ref":"crates/uv-pep508/src/marker/algebra.rs:1405-1426","code":" 1405 |     fn from_python_versions(\n 1406 |         versions: Vec<Version>,\n 1407 |         operator: ContainerOperator,\n 1408 |     ) -> Result<Self, NodeId> {\n 1409 |         let mut range: Ranges<Version> = versions\n 1410 |             .into_iter()\n 1411 |             .map(|version| {\n 1412 |                 let specifier = VersionSpecifier::equals_version(version.only_release());\n 1413 |                 let specifier = python_version_to_full_version(specifier)?;\n 1414 |                 Ok(release_specifier_to_range(specifier, true))\n 1415 |             })\n 1416 |             .flatten_ok()\n 1417 |             .collect::<Result<Ranges<_>, NodeId>>()?;\n 1418 | \n 1419 |         if operator == ContainerOperator::NotIn {\n 1420 |             range = range.complement();\n 1421 |         }\n 1422 | \n 1423 |         Ok(Self::Version {\n 1424 |             edges: Self::from_range(&range),\n 1425 |         })\n 1426 |     }","lines":22,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/algebra.rs#L1405-L1426"},{"ref":"crates/uv-pep508/src/marker/algebra.rs:1804-1817","code":" 1804 |     } else {\n 1805 |         let [major, minor, ..] = *specifier.version().release() else {\n 1806 |             unreachable!()\n 1807 |         };\n 1808 | \n 1809 |         Ok(match specifier.operator() {\n 1810 |             // `python_version` cannot have more than two release segments, and we know\n 1811 |             // that the following release segments aren't purely zeroes so equality is impossible.\n 1812 |             Operator::Equal | Operator::ExactEqual => {\n 1813 |                 return Err(NodeId::FALSE);\n 1814 |             }\n 1815 | \n 1816 |             // Similarly, inequalities are always `true`.\n 1817 |             Operator::NotEqual => return Err(NodeId::TRUE),","lines":14,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/algebra.rs#L1804-L1817"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `PyxPublishingService::exchange_token`, the trailing-slash upload URL is matched with the pattern arm `[\"v1\", \"upload\", workspace_name, registry_name, \"/\"]`. The comment above explicitly states \"a trailing slash is also permitted\", but `url`'s `path_segments()` yields an empty string `\"\"` (not `\"/\"`) as the final segment for a URL ending in `/`. For example `https://pyx.dev/v1/upload/ws/reg/` produces the segments `[\"v1\", \"upload\", \"ws\", \"reg\", \"\"]`, which matches neither arm, so the function returns `TrustedPublishingError::InvalidPyxUploadUrl`. A valid pyx upload URL with a trailing slash is therefore rejected during trusted-publishing token minting.","fix":"Match the empty final segment instead of `\"/\"`: change the second arm to `[\"v1\", \"upload\", workspace_name, registry_name, \"\"]` (or equivalently filter out a trailing empty segment before matching).","locations":[{"ref":"crates/uv-publish/src/trusted_publishing/pyx.rs:84-95","code":"   84 |         let path_segments: Vec<&str> = self\n   85 |             .registry\n   86 |             .path_segments()\n   87 |             .map_or(Vec::new(), std::iter::Iterator::collect);\n   88 | \n   89 |         let ([\"v1\", \"upload\", workspace_name, registry_name]\n   90 |         | [\"v1\", \"upload\", workspace_name, registry_name, \"/\"]) = path_segments[..]\n   91 |         else {\n   92 |             return Err(TrustedPublishingError::InvalidPyxUploadUrl(\n   93 |                 self.registry.clone(),\n   94 |             ));\n   95 |         };","lines":12,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-publish/src/trusted_publishing/pyx.rs#L84-L95"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `registry_pythons`, the sort comparator arms for the version-present-vs-absent case are inverted relative to the stated intent. The comment says `Place entries with a version before those without a version`, but `(Some(_), None) => Ordering::Greater` makes a versioned entry compare as greater than a versionless one, so ascending `sort_by` places versionless entries FIRST. Since Python discovery on Windows consumes this list front-to-back and the `version_filter` in `discovery.rs` always accepts entries whose `version` is `None`, registry Pythons with an unknown `SysVersion` are tried ahead of properly-versioned, higher-priority ones, so uv can select the wrong interpreter.","fix":"Swap the two arms so versioned entries sort first: use `(Some(_), None) => Ordering::Less` and `(None, Some(_)) => Ordering::Greater` instead of the current `(Some(_), None) => Ordering::Greater` and `(None, Some(_)) => Ordering::Less`.","locations":[{"ref":"crates/uv-python/src/windows_registry.rs:73-85","code":"   73 |         match (&a.version, &b.version) {\n   74 |             // Place entries with a version before those without a version.\n   75 |             (Some(_), None) => Ordering::Greater,\n   76 |             (None, Some(_)) => Ordering::Less,\n   77 |             // We want the highest version on top, which is the inverse from the regular order. The\n   78 |             // path is an arbitrary but stable tie-breaker.\n   79 |             (Some(version_a), Some(version_b)) => {\n   80 |                 version_a.cmp(version_b).reverse().then(a.path.cmp(&b.path))\n   81 |             }\n   82 |             // Sort the entries without a version arbitrarily, but stable (by path).\n   83 |             (None, None) => a.path.cmp(&b.path),\n   84 |         }\n   85 |     });","lines":13,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/windows_registry.rs#L73-L85"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `timestamp_from_toml_datetime`, a custom TOML offset is reconstructed with `TimeZone::fixed(Offset::constant(hours))` where `hours = minutes / 60`. `jiff`'s `Offset::constant(hours: i8)` only accepts whole-hour offsets, so the sub-hour remainder of `minutes` is silently discarded via integer division. Any `upload-time` timestamp written with a non-integer-hour zone offset (e.g. `+05:30` for India, `+05:45` for Nepal, `+09:30` for parts of Australia) is parsed 30-45 minutes off. `minutes` is the total signed minute offset (`i16`), confirmed in `toml_datetime`.","fix":"Preserve the full offset by converting to seconds, e.g. replace `toml_edit::Offset::Custom { minutes } => { let hours = i8::try_from(minutes / 60)...; TimeZone::fixed(Offset::constant(hours)) }` with `toml_edit::Offset::Custom { minutes } => TimeZone::fixed(Offset::from_seconds(i32::from(minutes) * 60).map_err(serde::de::Error::custom)?)`. `Offset::from_seconds` accepts arbitrary sub-hour offsets.","locations":[{"ref":"crates/uv-resolver/src/lock/export/pylock_toml.rs:1815-1825","code":" 1815 |     let tz = if let Some(offset) = datetime.offset {\n 1816 |         match offset {\n 1817 |             toml_edit::Offset::Z => TimeZone::UTC,\n 1818 |             toml_edit::Offset::Custom { minutes } => {\n 1819 |                 let hours = i8::try_from(minutes / 60).map_err(serde::de::Error::custom)?;\n 1820 |                 TimeZone::fixed(Offset::constant(hours))\n 1821 |             }\n 1822 |         }\n 1823 |     } else {\n 1824 |         TimeZone::UTC\n 1825 |     };","lines":11,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/lock/export/pylock_toml.rs#L1815-L1825"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `VersionMap::from_simple_metadata`, when a `flat_index` (`--find-links`) is merged into the lazy simple-metadata map, only `stable` is updated from the flat entries (`stable |= flat_index.iter().any(|(version, _)| version.is_stable())`), but `local` is NOT. The `local` flag therefore only reflects the registry simple-metadata versions and ignores any local versions contributed by the flat index. This is inconsistent with the two sibling constructors `from_flat_metadata` (which does `local |= version.is_local()`) and `impl From<FlatDistributions> for VersionMap` (which computes `local` from the flat index). `VersionMap::local()` is consulted in `CandidateSelector` (`candidate_selector.rs:327`) to decide whether to search for a local variant of a preferred version; if a local variant (e.g. `2.6.0+cpu`) only exists in the merged flat index and the simple metadata has none, `local()` wrongly returns `false` and the local-variant preference logic is skipped, so the resolver can select the non-local preferred version instead of the intended local variant.","fix":"Update `local` alongside `stable` when merging the flat index, mirroring the `stable` line:\n```rust\nif let Some(flat_index) = flat_index {\n    stable |= flat_index.iter().any(|(version, _)| version.is_stable());\n    local |= flat_index.iter().any(|(version, _)| version.is_local());\n    map = map.merge_flat(flat_index);\n}\n```","locations":[{"ref":"crates/uv-resolver/src/version_map.rs:91-94","code":"   91 |         if let Some(flat_index) = flat_index {\n   92 |             stable |= flat_index.iter().any(|(version, _)| version.is_stable());\n   93 |             map = map.merge_flat(flat_index);\n   94 |         }","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/version_map.rs#L91-L94"},{"ref":"crates/uv-resolver/src/version_map.rs:59-60","code":"   59 |         let mut stable = false;\n   60 |         let mut local = false;","lines":2,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/version_map.rs#L59-L60"},{"ref":"crates/uv-resolver/src/candidate_selector.rs:327-352","code":"  327 |                 if version_map.local() {\n  328 |                     for local in version_map\n  329 |                         .versions()\n  330 |                         .rev()\n  331 |                         .take_while(|local| *local > version)\n  332 |                     {\n  333 |                         if !local.is_local() {\n  334 |                             continue;\n  335 |                         }\n  336 |                         if local.clone().without_local() != *version {\n  337 |                             continue;\n  338 |                         }\n  339 |                         if !range.contains(local) {\n  340 |                             continue;\n  341 |                         }\n  342 |                         if let Some(dist) = version_map.get(local) {\n  343 |                             debug!(\"Preferring local version `{package_name}` (v{local})\");\n  344 |                             return Some(Candidate::new(\n  345 |                                 package_name,\n  346 |                                 local,\n  347 |                                 dist,\n  348 |                                 VersionChoiceKind::Preference,\n  349 |                             ));\n  350 |                         }\n  351 |                     }\n  352 |                 }","lines":26,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/candidate_selector.rs#L327-L352"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"When `tool.uv.sources` declares multiple sources for one package, `TryFrom<SourcesWire> for Sources` is supposed to guarantee that all sources with the same `extra`/`group` use pairwise-disjoint markers (the `Sources::iter` doc comment even states \"they will always use disjoint markers\"). But the validation loop iterates `sources.array_windows()`, which only yields *adjacent* pairs `[lhs, rhs]`. Non-adjacent sources are never compared, so overlapping markers separated by an unrelated entry slip through. For example, sources with markers `[\"sys_platform == 'linux'\", \"sys_platform == 'win32'\", \"sys_platform == 'linux'\"]` (all with the same/absent extra and group) pass validation: the two `linux` entries overlap but are never checked against each other because a `win32` entry sits between them. The disjointness invariant is then silently violated and downstream lowering can pick an arbitrary source on Linux.","fix":"Compare every unordered pair rather than only adjacent windows, e.g. iterate over `sources.iter().enumerate()` with an inner loop over later indices (or `itertools::tuple_combinations`), skipping pairs whose `extra()`/`group()` differ and running the existing `is_disjoint` check on the rest. Replace `for [lhs, rhs] in sources.array_windows()` with an O(n^2) pairwise scan over `(lhs, rhs)` for all `i < j`.","locations":[{"ref":"crates/uv-workspace/src/pyproject.rs:1092-1122","code":" 1092 |             SourcesWire::Many(sources) => {\n 1093 |                 for [lhs, rhs] in sources.array_windows() {\n 1094 |                     if lhs.extra() != rhs.extra() {\n 1095 |                         continue;\n 1096 |                     }\n 1097 |                     if lhs.group() != rhs.group() {\n 1098 |                         continue;\n 1099 |                     }\n 1100 | \n 1101 |                     let lhs = lhs.marker();\n 1102 |                     let rhs = rhs.marker();\n 1103 |                     if !lhs.is_disjoint(rhs) {\n 1104 |                         let Some(left) = lhs.contents().map(|contents| contents.to_string()) else {\n 1105 |                             return Err(SourceError::MissingMarkers);\n 1106 |                         };\n 1107 | \n 1108 |                         let Some(right) = rhs.contents().map(|contents| contents.to_string())\n 1109 |                         else {\n 1110 |                             return Err(SourceError::MissingMarkers);\n 1111 |                         };\n 1112 | \n 1113 |                         let mut hint = lhs.negate();\n 1114 |                         hint.and(rhs);\n 1115 |                         let hint = hint\n 1116 |                             .contents()\n 1117 |                             .map(|contents| contents.to_string())\n 1118 |                             .unwrap_or_else(|| \"true\".to_string());\n 1119 | \n 1120 |                         return Err(SourceError::OverlappingMarkers(left, right, hint));\n 1121 |                     }\n 1122 |                 }","lines":31,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/pyproject.rs#L1092-L1122"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `pyproject_project`, the user-supplied `--description` value is interpolated directly into the generated TOML with `format!(\"\\ndescription = \\\"{description}\\\"\", ...)` without any escaping. A description containing a double quote (`\"`) or backslash (`\\`) - e.g. `uv init --description 'My \"cool\" tool'` - produces a syntactically invalid `pyproject.toml` (`description = \"My \"cool\" tool\"`). `uv init` itself writes the file and returns success, but the resulting `pyproject.toml` fails to parse on the next `uv` command. Note this is inconsistent with how `authors` are handled, which go through `toml_edit` (`Author::to_toml_string`) and are correctly escaped (as the unit test `author_to_toml_string_handles_inline_quotes` demonstrates).","fix":"Escape the description as a TOML string instead of raw interpolation. Build the value with `toml_edit::Value::from(description)` (mirroring `Author::to_toml_string`) and splice the rendered string in, or use a serializer, rather than wrapping the raw text in literal `\"` characters. For example replace the `format!(\"\\ndescription = \\\"{description}\\\"\", ...)` branch with something that renders `toml_edit::Value::from(description.unwrap_or(\"Add your description here\"))` to produce a properly escaped value.","locations":[{"ref":"crates/uv/src/commands/project/init.rs:1094-1109","code":" 1094 |     indoc::formatdoc! {r#\"\n 1095 |         [project]\n 1096 |         name = \"{name}\"\n 1097 |         version = \"0.1.0\"{description}{readme}{authors}\n 1098 |         requires-python = \"{requires_python}\"\n 1099 |         dependencies = []\n 1100 |     \"#,\n 1101 |         readme = if no_readme { \"\" } else { \"\\nreadme = \\\"README.md\\\"\" },\n 1102 |         description = if no_description {\n 1103 |             String::new()\n 1104 |         } else {\n 1105 |             format!(\"\\ndescription = \\\"{description}\\\"\", description = description.unwrap_or(\"Add your description here\"))\n 1106 |         },\n 1107 |         authors = author.map_or_else(String::new, |author| format!(\"\\nauthors = [\\n    {}\\n]\", author.to_toml_string())),\n 1108 |         requires_python = requires_python.specifiers(),\n 1109 |     }","lines":16,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/init.rs#L1094-L1109"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The \"supported environments must be disjoint\" and \"required environments must be disjoint\" validation loops only compare *adjacent* pairs via `array_windows()`, not all pairs. For 3+ environments, an overlap between non-adjacent entries (e.g. `envs[0]` and `envs[2]` overlapping while neither overlaps `envs[1]`) is never detected, so `ProjectError::OverlappingMarkers` is not raised even though the invariant the code claims to enforce (`Supported environments must be disjoint`) is violated. The check silently passes and resolution proceeds with overlapping markers. Both loops (`environments.as_markers().array_windows()` and `required_environments.as_markers().array_windows()`) have the same defect.","fix":"Replace the adjacent-pair `array_windows()` iteration with a full pairwise comparison, e.g. iterate `markers.iter().enumerate()` and for each `i` compare against every `j > i` (`for (i, lhs) in markers.iter().enumerate() { for rhs in &markers[i + 1..] { if !lhs.is_disjoint(*rhs) { ... } } }`), so every pair of environments is checked for disjointness rather than only consecutive ones.","locations":[{"ref":"crates/uv/src/commands/project/lock.rs:674-696","code":"  674 |         // Ensure that the environments are disjoint.\n  675 |         if let Some(environments) = &environments {\n  676 |             for [lhs, rhs] in environments.as_markers().array_windows() {\n  677 |                 if !lhs.is_disjoint(*rhs) {\n  678 |                     let mut hint = lhs.negate();\n  679 |                     hint.and(*rhs);\n  680 | \n  681 |                     let lhs = lhs\n  682 |                         .contents()\n  683 |                         .map(|contents| contents.to_string())\n  684 |                         .unwrap_or_else(|| \"true\".to_string());\n  685 |                     let rhs = rhs\n  686 |                         .contents()\n  687 |                         .map(|contents| contents.to_string())\n  688 |                         .unwrap_or_else(|| \"true\".to_string());\n  689 |                     let hint = hint\n  690 |                         .contents()\n  691 |                         .map(|contents| contents.to_string())\n  692 |                         .unwrap_or_else(|| \"true\".to_string());\n  693 | \n  694 |                     return Err(ProjectError::OverlappingMarkers(lhs, rhs, hint));\n  695 |                 }\n  696 |             }","lines":23,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/lock.rs#L674-L696"},{"ref":"crates/uv/src/commands/project/lock.rs:703-726","code":"  703 |     let required_environments = if let Some(required_environments) = target.required_environments()\n  704 |     {\n  705 |         // Ensure that the environments are disjoint.\n  706 |         for [lhs, rhs] in required_environments.as_markers().array_windows() {\n  707 |             if !lhs.is_disjoint(*rhs) {\n  708 |                 let mut hint = lhs.negate();\n  709 |                 hint.and(*rhs);\n  710 | \n  711 |                 let lhs = lhs\n  712 |                     .contents()\n  713 |                     .map(|contents| contents.to_string())\n  714 |                     .unwrap_or_else(|| \"true\".to_string());\n  715 |                 let rhs = rhs\n  716 |                     .contents()\n  717 |                     .map(|contents| contents.to_string())\n  718 |                     .unwrap_or_else(|| \"true\".to_string());\n  719 |                 let hint = hint\n  720 |                     .contents()\n  721 |                     .map(|contents| contents.to_string())\n  722 |                     .unwrap_or_else(|| \"true\".to_string());\n  723 | \n  724 |                 return Err(ProjectError::OverlappingMarkers(lhs, rhs, hint));\n  725 |             }\n  726 |         }","lines":24,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/commands/project/lock.rs#L703-L726"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `PublishSettings::resolve`, the `trusted_publishing` value is combined config-first: `trusted_publishing.combine(args.trusted_publishing)`, where `trusted_publishing` is the value from the filesystem/`pyproject.toml` (`PublishOptions`) and `args.trusted_publishing` is the CLI `--trusted-publishing` value. Because `Combine` returns the left operand when it is `Some`, the configuration file takes precedence over the command line. This is inverted relative to every other field in the same function (`publish_url`, `keyring_provider`, `check_url` all use `args.X.combine(config)`), and relative to uv's documented CLI-over-config precedence. A user who sets `trusted-publishing` in `pyproject.toml` and then passes `--trusted-publishing never` (or `always`) on the command line will silently get the config value instead. It is the only `combine(args.` occurrence in the file.","fix":"Swap the operands so the CLI wins: `trusted_publishing: args.trusted_publishing.combine(trusted_publishing).unwrap_or_default(),` matching the sibling fields `publish_url`, `keyring_provider`, and `check_url`.","locations":[{"ref":"crates/uv/src/settings.rs:5067-5069","code":" 5067 |             trusted_publishing: trusted_publishing\n 5068 |                 .combine(args.trusted_publishing)\n 5069 |                 .unwrap_or_default(),","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv/src/settings.rs#L5067-L5069"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`cache_name` is inconsistent about representing an empty truncation result. In the all-hex-digits fast path, `cache_name(name, Some(0))` (or any `max_len` that truncates a non-empty hex-only `name` down to zero bytes) returns `Some(Cow::Borrowed(\"\"))`, because only `name.is_empty()` (the *pre*-truncation length) is checked before returning `name.get(..limit)`. The general (non-hex) branch, by contrast, explicitly checks `normalized.is_empty()` *after* truncation and returns `None` in that case. So `cache_name(\"abc\", Some(0))` returns `Some(\"\")` while `cache_name(\"xyz\", Some(0))` (non-hex-only) returns `None` for the same effective truncation-to-empty scenario -- an inconsistent, easily-triggered edge case in a function meant to normalize cache directory/file names.","fix":"Check emptiness after truncation in the hex branch too: ```rust\nreturn if name.is_empty() {\n    None\n} else {\n    let truncated = name.get(..limit).unwrap_or(name);\n    if truncated.is_empty() { None } else { Some(Cow::Borrowed(truncated)) }\n};\n```","locations":[{"ref":"crates/uv-cache-key/src/digest.rs:45-57","code":"   45 | pub fn cache_name(name: &str, max_len: Option<usize>) -> Option<Cow<'_, str>> {\n   46 |     let limit = max_len.unwrap_or(usize::MAX);\n   47 | \n   48 |     if name\n   49 |         .bytes()\n   50 |         .all(|char| matches!(char, b'0'..=b'9' | b'a'..=b'f'))\n   51 |     {\n   52 |         return if name.is_empty() {\n   53 |             None\n   54 |         } else {\n   55 |             Some(Cow::Borrowed(name.get(..limit).unwrap_or(name)))\n   56 |         };\n   57 |     }","lines":13,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-cache-key/src/digest.rs#L45-L57"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `SimpleDetailHTML::parse_anchor` (`crates/uv-client/src/html.rs:253-256`), `path.split('/').next_back().ok_or_else(|| Error::MissingFilename(...))?` is meant to reject anchors whose URL has no derivable filename. However, `str::split` always yields at least one item, even for an empty string (`\"\".split('/').next_back()` is `Some(\"\")`), so `next_back()` can never return `None` and the `MissingFilename` error can never be raised here. A registry page containing a fragment-only `<a href=\"#note\">` (common as a same-page anchor, unrelated to package files, and explicitly the kind of tag PyPI-style pages sometimes include) decodes to an empty `path` before the `#`, which then silently produces a `PypiFile` with an empty `filename` and `url` instead of being rejected or skipped. This is inconsistent with the sibling filter that already excludes empty `href` values (`html.rs:211`) and defeats the apparent intent of the `ok_or_else` check.","fix":"Explicitly check for an empty filename instead of relying on `next_back()` returning `None`:\n```rust\nlet filename = path\n    .split('/')\n    .next_back()\n    .filter(|filename| !filename.is_empty())\n    .ok_or_else(|| Error::MissingFilename(href.to_string()))?;\n```","locations":[{"ref":"crates/uv-client/src/html.rs:253-256","code":"  253 |         let filename = path\n  254 |             .split('/')\n  255 |             .next_back()\n  256 |             .ok_or_else(|| Error::MissingFilename(href.to_string()))?;","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-client/src/html.rs#L253-L256"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `locate_system_config_xdg` (`crates/uv-dirs/src/lib.rs:130-144`), the `XDG_CONFIG_DIRS` value is iterated with `config_dirs.split(':').take_while(|s| !s.is_empty())`. `take_while` stops the iteration entirely the first time it encounters an empty path segment, rather than merely skipping that segment. If a caller sets `XDG_CONFIG_DIRS` with a leading or doubled colon (e.g. `\":/etc/xdg\"` or `\"/a::/b\"`, which can happen from careless environment composition such as `\"$UNSET_VAR:$XDG_CONFIG_DIRS\"`), every directory listed after the first empty segment is silently never checked for `uv/uv.toml`, even though those later entries are otherwise valid absolute paths. This can cause `uv` to miss a legitimate system configuration file.","fix":"Use `.filter(|s| !s.is_empty())` instead of `.take_while(|s| !s.is_empty())` so that a single empty/malformed segment is skipped rather than terminating the search of subsequent directories:\n```rust\nfor dir in config_dirs.split(':').filter(|s| !s.is_empty()) {\n    let uv_toml_path = Path::new(dir).join(\"uv\").join(\"uv.toml\");\n    if uv_toml_path.is_file() {\n        return Some(uv_toml_path);\n    }\n}\n```","locations":[{"ref":"crates/uv-dirs/src/lib.rs:137","code":"  137 |     for dir in config_dirs.split(':').take_while(|s| !s.is_empty()) {","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-dirs/src/lib.rs#L137"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`MemchrSplitter::next` in `splitter.rs` silently drops a trailing empty segment when the haystack ends with the delimiter byte, unlike `str::split`. Concretely, `MemchrSplitter::split(\"any.\", b'.')` yields only `[\"any\"]` instead of `[\"any\", \"\"]`. This was verified with a standalone reproduction using the actual iterator logic (delimiter at the last byte causes `self.offset == self.haystack.len()` after the final match, so the `None if self.offset < self.haystack.len()` arm never fires and the trailing empty item is never produced). `wheel.rs`'s `parse_large_tag_component` relies on `MemchrSplitter` to reject malformed tag components via `tag.is_empty() || !tag.bytes().all(is_tag_atom_byte)`, but because the trailing empty segment is never yielded, that check is bypassed for tags ending in a period. This was confirmed end-to-end: parsing the wheel filename `foo-1.2.3-py3-none-any..whl` (whose platform tag component is `any.`) succeeds and returns `Ok(WheelFilename { ... platform_tag: [Any], repr: \"py3-none-any.\" })` instead of being rejected, even though the filename is malformed (trailing period in a tag segment). The same asymmetry affects `expanded_tags.rs`'s `parse_expanded_tag`, which also uses `MemchrSplitter` to split multi-part tag components. Since this parser handles untrusted wheel filenames from package registries, this leniency means malformed/corrupted filenames are silently accepted rather than surfaced as parse errors, which can mask registry corruption or crafted filenames and cause inconsistent identity between the `repr` (verbatim) and the structured tag list.","fix":"Fix `MemchrSplitter::next` in `splitter.rs` to emit the trailing empty segment when the haystack ends with the delimiter, matching `str::split` semantics. For example, track whether the final delimiter has already been consumed and still emit one more empty item when `index + 1 == haystack.len()`, e.g. by changing the `None` arm to use `<=` semantics via an explicit `done` flag:\n```rust\nfn next(&mut self) -> Option<Self::Item> {\n    if self.offset > self.haystack.len() {\n        return None;\n    }\n    match self.memchr.next() {\n        Some(index) => {\n            let start = self.offset;\n            self.offset = index + 1;\n            Some(&self.haystack[start..index])\n        }\n        None => {\n            let start = self.offset;\n            self.offset = self.haystack.len() + 1; // sentinel: fully consumed\n            Some(&self.haystack[start..])\n        }\n    }\n}\n```\nAdd a unit test in `splitter.rs` asserting `MemchrSplitter::split(\"a.\", b'.').collect::<Vec<_>>() == [\"a\", \"\"]` to lock in the corrected behavior, then confirm `WheelFilename::from_str(\"foo-1.2.3-py3-none-any..whl\")` now returns an error.","locations":[{"ref":"crates/uv-distribution-filename/src/splitter.rs:24-38","code":"   24 |     fn next(&mut self) -> Option<Self::Item> {\n   25 |         match self.memchr.next() {\n   26 |             Some(index) => {\n   27 |                 let start = self.offset;\n   28 |                 self.offset = index + 1;\n   29 |                 Some(&self.haystack[start..index])\n   30 |             }\n   31 |             None if self.offset < self.haystack.len() => {\n   32 |                 let start = self.offset;\n   33 |                 self.offset = self.haystack.len();\n   34 |                 Some(&self.haystack[start..])\n   35 |             }\n   36 |             None => None,\n   37 |         }\n   38 |     }","lines":15,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-filename/src/splitter.rs#L24-L38"},{"ref":"crates/uv-distribution-filename/src/wheel.rs:305-324","code":"  305 | fn parse_large_tag_component<T: FromStr>(\n  306 |     component: &str,\n  307 |     filename: &str,\n  308 | ) -> Result<TagSet<T>, WheelFilenameError> {\n  309 |     if component.is_empty() {\n  310 |         return Err(invalid_tag_component(filename));\n  311 |     }\n  312 | \n  313 |     let mut tags = TagSet::new();\n  314 |     for tag in MemchrSplitter::split(component, b'.') {\n  315 |         if tag.is_empty() || !tag.bytes().all(is_tag_atom_byte) {\n  316 |             return Err(invalid_tag_component(filename));\n  317 |         }\n  318 |         if let Ok(tag) = T::from_str(tag) {\n  319 |             tags.push(tag);\n  320 |         }\n  321 |     }\n  322 | \n  323 |     Ok(tags)\n  324 | }","lines":20,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-filename/src/wheel.rs#L305-L324"},{"ref":"crates/uv-distribution-filename/src/expanded_tags.rs:92-144","code":"   92 | fn parse_expanded_tag(tag: &str) -> Result<WheelTag, ExpandedTagError> {\n   93 |     let mut splitter = memchr::Memchr::new(b'-', tag.as_bytes());\n   94 |     if tag.is_empty() {\n   95 |         return Err(ExpandedTagError::MissingLanguageTag(tag.to_string()));\n   96 |     }\n   97 |     let Some(python_tag_index) = splitter.next() else {\n   98 |         return Err(ExpandedTagError::MissingAbiTag(tag.to_string()));\n   99 |     };\n  100 |     let Some(abi_tag_index) = splitter.next() else {\n  101 |         return Err(ExpandedTagError::MissingPlatformTag(tag.to_string()));\n  102 |     };\n  103 |     if splitter.next().is_some() {\n  104 |         return Err(ExpandedTagError::ExtraSegment(tag.to_string()));\n  105 |     }\n  106 | \n  107 |     let python_tag = &tag[..python_tag_index];\n  108 |     let abi_tag = &tag[python_tag_index + 1..abi_tag_index];\n  109 |     let platform_tag = &tag[abi_tag_index + 1..];\n  110 | \n  111 |     let is_small = memchr(b'.', tag.as_bytes()).is_none();\n  112 | \n  113 |     if let Some(small) = is_small\n  114 |         .then(|| {\n  115 |             Some(WheelTagSmall {\n  116 |                 python_tag: LanguageTag::from_str(python_tag).ok()?,\n  117 |                 abi_tag: AbiTag::from_str(abi_tag).ok()?,\n  118 |                 platform_tag: PlatformTag::from_str(platform_tag).ok()?,\n  119 |             })\n  120 |         })\n  121 |         .flatten()\n  122 |     {\n  123 |         Ok(WheelTag::Small { small })\n  124 |     } else {\n  125 |         Ok(WheelTag::Large {\n  126 |             large: Box::new(WheelTagLarge {\n  127 |                 build_tag: None,\n  128 |                 python_tag: MemchrSplitter::split(python_tag, b'.')\n  129 |                     .map(LanguageTag::from_str)\n  130 |                     .filter_map(Result::ok)\n  131 |                     .collect(),\n  132 |                 abi_tag: MemchrSplitter::split(abi_tag, b'.')\n  133 |                     .map(AbiTag::from_str)\n  134 |                     .filter_map(Result::ok)\n  135 |                     .collect(),\n  136 |                 platform_tag: MemchrSplitter::split(platform_tag, b'.')\n  137 |                     .map(PlatformTag::from_str)\n  138 |                     .filter_map(Result::ok)\n  139 |                     .collect(),\n  140 |                 repr: tag.into(),\n  141 |             }),\n  142 |         })\n  143 |     }\n  144 | }","lines":53,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-filename/src/expanded_tags.rs#L92-L144"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`IndexName::new` iterates over `name.chars()` to validate allowed characters but never checks for an empty string. Since the loop body never executes for `\"\"`, `IndexName::new(\"\")` returns `Ok(IndexName(\"\"))`. The dedicated `IndexNameError::EmptyName` variant (and the identically-named `IndexSourceError::EmptyName` in `index.rs`) exist specifically to reject this case but are never constructed anywhere in the codebase, so they are unreachable/dead code. In practice this means e.g. `--index =https://example.com/simple` (empty name before `=` in `Index::from_str`) or `name = \"\"` in a `[[tool.uv.index]]` table silently produces an index with an empty name instead of a clear validation error.","fix":"Add an explicit empty check at the top of `IndexName::new`: \n```rust\nfn new(name: &str) -> Result<Self, IndexNameError> {\n    if name.is_empty() {\n        return Err(IndexNameError::EmptyName);\n    }\n    for c in name.chars() {\n        ...\n    }\n    Ok(Self(SmallString::from(name)))\n}\n```\nThis makes the existing `EmptyName` error variants reachable and gives users a clear error instead of silently accepting an empty index name.","locations":[{"ref":"crates/uv-distribution-types/src/index_name.rs:19-32","code":"   19 |     fn new(name: &str) -> Result<Self, IndexNameError> {\n   20 |         for c in name.chars() {\n   21 |             match c {\n   22 |                 'a'..='z' | 'A'..='Z' | '0'..='9' | '-' | '_' | '.' => {}\n   23 |                 c if c.is_ascii() => {\n   24 |                     return Err(IndexNameError::UnsupportedCharacter(c, name.to_string()));\n   25 |                 }\n   26 |                 c => {\n   27 |                     return Err(IndexNameError::NonAsciiName(c, name.to_string()));\n   28 |                 }\n   29 |             }\n   30 |         }\n   31 |         Ok(Self(SmallString::from(name)))\n   32 |     }","lines":14,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/index_name.rs#L19-L32"},{"ref":"crates/uv-distribution-types/src/index_name.rs:90-93","code":"   90 | #[derive(Error, Debug)]\n   91 | pub enum IndexNameError {\n   92 |     #[error(\"Index included a name, but the name was empty\")]\n   93 |     EmptyName,","lines":4,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/index_name.rs#L90-L93"},{"ref":"crates/uv-distribution-types/src/index.rs:800-801","code":"  800 |     #[error(\"Index included a name, but the name was empty\")]\n  801 |     EmptyName,","lines":2,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-distribution-types/src/index.rs#L800-L801"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `uv-globfilter` debug/demo binary reads its walk root with `args().next().unwrap()`, which returns `argv[0]` (the path to the binary itself), not the first command-line argument. As a result `WalkDir::new(&walkdir_root)` walks the executable's own path rather than the directory the user passed, so the tool never inspects the intended directory.","fix":"Use the first real argument, e.g. replace `let walkdir_root = args().next().unwrap();` with `let walkdir_root = args().nth(1).expect(\"expected a directory argument\");`.","locations":[{"ref":"crates/uv-globfilter/src/main.rs:34-34","code":"   34 |     let walkdir_root = args().next().unwrap();","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-globfilter/src/main.rs#L34"}]},{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `dependency_groups` parse path reports the wrong warning kind, and the dedicated kind is dead code. When a `'...' in dependency_groups` expression has an invalid group name, the code reports `MarkerWarningKind::ExtrasInvalidComparison` with a `dependency group name` message, rather than the purpose-built `MarkerWarningKind::DependencyGroupsInvalidComparison`. As a result `DependencyGroupsInvalidComparison` is defined but never constructed anywhere in the crate.\n\nBefore:\n```rust\nreporter.report(\n    MarkerWarningKind::ExtrasInvalidComparison,\n    format!(\"Expected dependency group name (found `{l_string}`): {err}\"),\n);\n```","fix":"Report `MarkerWarningKind::DependencyGroupsInvalidComparison` in the `MarkerValueList::DependencyGroups` arm so the dedicated kind is used and callers can distinguish it from extras warnings.","locations":[{"ref":"crates/uv-pep508/src/marker/parse.rs:331-345","code":"  331 |                         MarkerValueList::DependencyGroups => {\n  332 |                             match GroupName::from_str(&l_string) {\n  333 |                                 Ok(name) => CanonicalMarkerListPair::DependencyGroup(name),\n  334 |                                 Err(err) => {\n  335 |                                     reporter.report(\n  336 |                                     MarkerWarningKind::ExtrasInvalidComparison,\n  337 |                                     format!(\"Expected dependency group name (found `{l_string}`): {err}\"),\n  338 |                                 );\n  339 |                                     CanonicalMarkerListPair::Arbitrary {\n  340 |                                         key,\n  341 |                                         value: l_string.to_string(),\n  342 |                                     }\n  343 |                                 }\n  344 |                             }\n  345 |                         }","lines":15,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/parse.rs#L331-L345"},{"ref":"crates/uv-pep508/src/marker/tree.rs:41","code":"   41 |     DependencyGroupsInvalidComparison,","lines":1,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-pep508/src/marker/tree.rs#L41"}]},{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`PartialEq` and `Hash` for `PythonRequest` are both derived from `to_canonical_string`, but `to_canonical_string` maps `Self::Directory(path)` and `Self::File(path)` to the identical string (`path.to_string_lossy()`). Consequently `PythonRequest::Directory(p) == PythonRequest::File(p)` returns `true` and the two hash equally, so the two semantically distinct variants collide when used as map/set keys. In practice a given path is either a file or a directory so real collisions are rare, but the equality/hash contract silently conflates the variants.","fix":"Disambiguate the two variants in `to_canonical_string` (e.g. prefix directory paths differently) or implement `PartialEq`/`Hash` structurally instead of via `to_canonical_string` so `Directory` and `File` are never considered equal.","locations":[{"ref":"crates/uv-python/src/discovery.rs:75-85","code":"   75 | impl PartialEq for PythonRequest {\n   76 |     fn eq(&self, other: &Self) -> bool {\n   77 |         self.to_canonical_string() == other.to_canonical_string()\n   78 |     }\n   79 | }\n   80 | \n   81 | impl std::hash::Hash for PythonRequest {\n   82 |     fn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n   83 |         self.to_canonical_string().hash(state);\n   84 |     }\n   85 | }","lines":11,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/discovery.rs#L75-L85"},{"ref":"crates/uv-python/src/discovery.rs:2206-2219","code":" 2206 |     pub fn to_canonical_string(&self) -> Cow<'_, str> {\n 2207 |         match self {\n 2208 |             Self::Any => Cow::Borrowed(\"any\"),\n 2209 |             Self::Default => Cow::Borrowed(\"default\"),\n 2210 |             Self::Version(version) => Cow::Owned(version.to_string()),\n 2211 |             Self::Directory(path) | Self::File(path) => path.to_string_lossy(),\n 2212 |             Self::ExecutableName(name) => Cow::Borrowed(name),\n 2213 |             Self::Implementation(implementation) => Cow::Borrowed(implementation.long_name()),\n 2214 |             Self::ImplementationVersion(implementation, version) => {\n 2215 |                 Cow::Owned(format!(\"{implementation}@{version}\"))\n 2216 |             }\n 2217 |             Self::Key(request) => Cow::Owned(request.to_string()),\n 2218 |         }\n 2219 |     }","lines":14,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-python/src/discovery.rs#L2206-L2219"}]},{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the `include_manifest` branch of `to_resolution_from_packages`, the manifest-requirements loop adds each resolved package with `petgraph.add_node(...)` followed by `inverse.insert(&dist.id, index)` unconditionally, whereas every other place that adds packages (the initial-roots dedup, the manifest dependency-groups loop at lines 476-505, and the main traversal at 685-698) uses `inverse.entry(&dist.id)` to avoid duplicates. If a manifest requirement resolves (via `find_by_markers`) to a `PackageId` that is already present in `inverse` (e.g. a package already added as a root, or the same package produced by two requirements), the `inverse.insert` overwrites the existing mapping and `add_node` creates a SECOND graph node for the same package. The graph then contains two `Node::Dist` entries for one package (with a dangling `root --Prod-->` edge to the orphaned original), producing a resolution that references the same package twice. The `seen` set guards only re-queuing (lines 430, 439), not graph-node creation, so it does not prevent this.","fix":"Mirror the dependency-groups loop: replace the `add_node` + `inverse.insert(&dist.id, index)` with a `match inverse.entry(&dist.id) { Entry::Vacant(entry) => { let index = petgraph.add_node(...); entry.insert(index); index } Entry::Occupied(entry) => *entry.get() }` so an already-present package reuses its existing node instead of creating a duplicate.","locations":[{"ref":"crates/uv-resolver/src/lock/installable.rs:413-419","code":"  413 |                 // Add the package to the graph.\n  414 |                 let index = petgraph.add_node(if groups.prod() {\n  415 |                     self.package_to_node(dist, tags, build_options, install_options, marker_env)?\n  416 |                 } else {\n  417 |                     self.non_installable_node(dist, tags, marker_env)?\n  418 |                 });\n  419 |                 inverse.insert(&dist.id, index);","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-resolver/src/lock/installable.rs#L413-L419"}]},{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`warn_uv_toml_masked_fields` destructures `no_sources_package: _` (line 420) and never adds it to `masked_fields`, even though `no-sources-package` is a valid `[tool.uv]` field in `pyproject.toml` (declared in `ResolverInstallerSchema`). If a user has both a `uv.toml` and a `pyproject.toml` `[tool.uv]` that sets `no-sources-package`, the `pyproject.toml` value is silently masked with no warning, unlike the sibling `no-sources` field which is warned. This is an inconsistency in the masking-warning coverage.","fix":"Bind `no_sources_package` in the destructure and add `if no_sources_package.is_some() { masked_fields.push(\"no-sources-package\"); }` alongside the `no-sources` check (or document explicitly why it is intentionally excluded).","locations":[{"ref":"crates/uv-settings/src/lib.rs:419-420","code":"  419 |                 no_sources,\n  420 |                 no_sources_package: _,","lines":2,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-settings/src/lib.rs#L419-L420"},{"ref":"crates/uv-settings/src/lib.rs:579-581","code":"  579 |     if no_sources.is_some() {\n  580 |         masked_fields.push(\"no-sources\");\n  581 |     }","lines":3,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-settings/src/lib.rs#L579-L581"}]},{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`backslash_escape` only escapes `\\` and `\"`, but it is used to build double-quoted POSIX shell snippets like `export PATH=\"{path}:$PATH\"` (Bash/Zsh/Ksh) and `setenv PATH \"{path}:$PATH\"` (Csh) that are written into shell rc files. Inside POSIX double quotes, `$` and backtick (`` ` ``) are still special, so a directory path containing `$` or a backtick would be subject to variable/command substitution when the rc file is sourced, corrupting the persisted `PATH`. The PowerShell counterpart `backtick_escape` correctly escapes `$`, showing the author was aware of this class of issue.","fix":"Escape `$` and `` ` `` in addition to `\\` and `\"` for the double-quoted POSIX shell forms (or single-quote the path and use the `escape_posix_for_single_quotes` approach already present in `shlex.rs`).","locations":[{"ref":"crates/uv-shell/src/lib.rs:324-338","code":"  324 | fn backslash_escape(s: &str) -> Cow<'_, str> {\n  325 |     if !s.chars().any(|c| matches!(c, '\\\\' | '\"')) {\n  326 |         return Cow::Borrowed(s);\n  327 |     }\n  328 | \n  329 |     let mut escaped = String::with_capacity(s.len());\n  330 |     for c in s.chars() {\n  331 |         match c {\n  332 |             '\\\\' | '\"' => escaped.push('\\\\'),\n  333 |             _ => {}\n  334 |         }\n  335 |         escaped.push(c);\n  336 |     }\n  337 |     Cow::Owned(escaped)\n  338 | }","lines":15,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-shell/src/lib.rs#L324-L338"},{"ref":"crates/uv-shell/src/lib.rs:270-281","code":"  270 |             Self::Bash | Self::Zsh | Self::Ksh => Some(format!(\n  271 |                 \"export PATH=\\\"{}:$PATH\\\"\",\n  272 |                 backslash_escape(&path.simplified_display().to_string()),\n  273 |             )),\n  274 |             Self::Fish => Some(format!(\n  275 |                 \"fish_add_path \\\"{}\\\"\",\n  276 |                 backslash_escape(&path.simplified_display().to_string()),\n  277 |             )),\n  278 |             Self::Csh => Some(format!(\n  279 |                 \"setenv PATH \\\"{}:$PATH\\\"\",\n  280 |                 backslash_escape(&path.simplified_display().to_string()),\n  281 |             )),","lines":12,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-shell/src/lib.rs#L270-L281"}]},{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`prepend_to_path` checks whether the directory is already on `PATH` with a raw sliding-window byte comparison: `existing_path.windows(path.len()).any(|p| *p == *path)`. This treats the whole `PATH` as one string and ignores the `;` separators, so it matches on any contiguous substring. If the new directory's path string is a substring of (or a prefix aligned with) an existing entry - e.g. adding `C:\\Users\\me\\bin` when `PATH` already contains `C:\\Users\\me\\bin2` - the check returns `true` and `prepend_path` returns `Ok(false)`, silently declining to add the directory that is genuinely not on `PATH`.","fix":"Split `existing_path` on `;` and compare each entry to `path` for exact (case-insensitive, per Windows) equality instead of using a byte-window substring search, so only a full path-component match counts as already-present.","locations":[{"ref":"crates/uv-shell/src/windows.rs:104-115","code":"  104 | fn prepend_to_path(existing_path: &HSTRING, path: HSTRING) -> Option<HSTRING> {\n  105 |     if existing_path.is_empty() {\n  106 |         Some(path)\n  107 |     } else if existing_path.windows(path.len()).any(|p| *p == *path) {\n  108 |         None\n  109 |     } else {\n  110 |         let mut new_path = path.to_os_string();\n  111 |         new_path.push(\";\");\n  112 |         new_path.push(existing_path.to_os_string());\n  113 |         Some(HSTRING::from(new_path))\n  114 |     }\n  115 | }","lines":12,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-shell/src/windows.rs#L104-L115"}]},{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`PackageMetadata` derives `Default`, but the derived default is inconsistent with the serde field defaults used during deserialization. Serde applies `default_requires_python` (`Some(\">=3.12\")`) and `default_true` for `sdist`/`wheel`, whereas `PackageMetadata::default()` produces `requires_python: None`, `sdist: false`, and `wheel: false`. The derived `Default` is currently unused, but it is a footgun: any future `PackageMetadata { yanked: true, ..Default::default() }` would silently produce a version that generates no sdist and no wheel and has no `Requires-Python`.","fix":"Either drop the `Default` derive on `PackageMetadata` (it is unused), or write a manual `Default` impl that mirrors the serde defaults (`requires_python: default_requires_python()`, `sdist: true`, `wheel: true`).","locations":[{"ref":"crates/uv-test/src/packse/scenario.rs:94-125","code":"   94 | #[derive(Debug, Deserialize, Default)]\n   95 | #[serde(deny_unknown_fields)]\n   96 | pub struct PackageMetadata {\n   97 |     /// The `Requires-Python` specifier. Defaults to `\">=3.12\"`.\n   98 |     #[serde(default = \"default_requires_python\")]\n   99 |     pub requires_python: Option<VersionSpecifiers>,\n  100 | \n  101 |     /// Dependency requirements.\n  102 |     #[serde(default)]\n  103 |     pub requires: Vec<Requirement>,\n  104 | \n  105 |     /// Extra names mapped to their optional dependency requirements.\n  106 |     #[serde(default)]\n  107 |     pub extras: BTreeMap<ExtraName, Vec<Requirement>>,\n  108 | \n  109 |     /// Whether to produce a source distribution.\n  110 |     #[serde(default = \"default_true\")]\n  111 |     pub sdist: bool,\n  112 | \n  113 |     /// Whether to produce a wheel.\n  114 |     #[serde(default = \"default_true\")]\n  115 |     pub wheel: bool,\n  116 | \n  117 |     /// Whether this version is yanked.\n  118 |     #[serde(default)]\n  119 |     pub yanked: bool,\n  120 | \n  121 |     /// Specific wheel tags to produce (e.g., `[\"cp312-abi3-win_amd64\"]`).\n  122 |     /// An empty list means produce only the default `py3-none-any` wheel.\n  123 |     #[serde(default)]\n  124 |     pub wheel_tags: Vec<WheelTag>,\n  125 | }","lines":32,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-test/src/packse/scenario.rs#L94-L125"},{"ref":"crates/uv-test/src/packse/scenario.rs:293-299","code":"  293 | fn default_requires_python() -> Option<VersionSpecifiers> {\n  294 |     Some(VersionSpecifiers::from_str(\">=3.12\").expect(\"default requires-python should be valid\"))\n  295 | }\n  296 | \n  297 | fn default_true() -> bool {\n  298 |     true\n  299 | }","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-test/src/packse/scenario.rs#L293-L299"}]},{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"When a dependency-group cycle is detected, the reported [`Cycle`] is built from the entire `parents` path (`parents.iter().copied().cloned().collect()`) and the [`Display`] impl closes the chain with `-> {first}` (the root group). If the cycle does not close on the first element (e.g. root `a` includes `b`, `b` includes `c`, `c` includes `b`), the detection fires at `name == b` with `parents == [a, b, c]`, producing the misleading message `a -> b -> c -> a` even though the real cycle is `b -> c -> b` and `a` is not part of it. The doc comment `Display a cycle, e.g., a -> b -> c -> a` assumes the cycle always re-enters the first element, which is not guaranteed.","fix":"Slice `parents` from the position of the repeated group so the reported cycle starts (and ends) at the actual repeated node. Replace the cycle branch with:\n```rust\nif let Some(pos) = parents.iter().position(|p| *p == name) {\n    return Err(DependencyGroupErrorInner::DependencyGroupCycle(Cycle(\n        parents[pos..].iter().copied().cloned().collect(),\n    )));\n}\n```\nThen `Display` (which appends `-> {first}`) prints the accurate cycle `b -> c -> b`.","locations":[{"ref":"crates/uv-workspace/src/dependency_groups.rs:116-120","code":"  116 |             if parents.contains(&name) {\n  117 |                 return Err(DependencyGroupErrorInner::DependencyGroupCycle(Cycle(\n  118 |                     parents.iter().copied().cloned().collect(),\n  119 |                 )));\n  120 |             }","lines":5,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/dependency_groups.rs#L116-L120"},{"ref":"crates/uv-workspace/src/dependency_groups.rs:322-335","code":"  322 | /// Display a cycle, e.g., `a -> b -> c -> a`.\n  323 | impl std::fmt::Display for Cycle {\n  324 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  325 |         let [first, rest @ ..] = self.0.as_slice() else {\n  326 |             return Ok(());\n  327 |         };\n  328 |         write!(f, \"`{first}`\")?;\n  329 |         for group in rest {\n  330 |             write!(f, \" -> `{group}`\")?;\n  331 |         }\n  332 |         write!(f, \" -> `{first}`\")?;\n  333 |         Ok(())\n  334 |     }\n  335 | }","lines":14,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/dependency_groups.rs#L322-L335"}]},{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Workspace::collect_required_members`, `required_members.insert(package.clone(), *editable)` unconditionally overwrites any previously recorded editability for a package. The conflict check only fires when both the existing and new values are `Some(_)`. When a package is required as a workspace source by two members - one specifying `{ workspace = true, editable = false }` and another (processed later, per `BTreeMap` ordering) specifying `{ workspace = true }` with no `editable` - the `Some(false)` is clobbered by `None`. Downstream, `members_requirements`/`group_requirements` resolve `None` via `.unwrap_or(true)`, so the explicit `editable = false` is silently flipped to `editable = true`. A later unspecified source should not override an earlier explicit value.","fix":"Only overwrite when the new value carries information, e.g. `let existing = required_members.get(package).copied();` then insert `editable.or(existing.flatten())` (preserving an explicit `Some(false)`), keeping the conflict check for the `Some != Some` case. Alternatively, `if editable.is_some() { required_members.insert(...); }` and skip the insert entirely when `editable` is `None` and an entry already exists.","locations":[{"ref":"crates/uv-workspace/src/workspace.rs:636-647","code":"  636 |                 let existing = required_members.insert(package.clone(), *editable);\n  637 |                 if let Some(Some(existing)) = existing {\n  638 |                     if let Some(editable) = editable {\n  639 |                         // If there are conflicting `editable` values, raise an error.\n  640 |                         if existing != *editable {\n  641 |                             return Err(WorkspaceError::from(\n  642 |                                 WorkspaceErrorKind::EditableConflict(package.clone()),\n  643 |                             ));\n  644 |                         }\n  645 |                     }\n  646 |                 }\n  647 |             }","lines":12,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/workspace.rs#L636-L647"},{"ref":"crates/uv-workspace/src/workspace.rs:558-564","code":"  558 |                         editable: Some(\n  559 |                             self.required_members\n  560 |                                 .get(name)\n  561 |                                 .copied()\n  562 |                                 .flatten()\n  563 |                                 .unwrap_or(true),\n  564 |                         ),","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/workspace.rs#L558-L564"},{"ref":"crates/uv-workspace/src/workspace.rs:696-702","code":"  696 |                 source: if member.pyproject_toml().is_package(!is_required_member) {\n  697 |                     RequirementSource::Directory {\n  698 |                         install_path: member.root.clone().into_boxed_path(),\n  699 |                         editable: Some(editability.unwrap_or(true)),\n  700 |                         r#virtual: Some(false),\n  701 |                         url,\n  702 |                     }","lines":7,"link":"https://github.com/astral-sh/uv/blob/92eb9dfa5dcadbb8e16b6282213104c09f6cc636/crates/uv-workspace/src/workspace.rs#L696-L702"}]},{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Changelog::is_empty` reports the changelog as empty when only `reinstalled` is non-empty, because it checks `self.installed.is_empty() && self.uninstalled.is_empty()` and ignores `self.reinstalled`. The docstring `Returns true if the changelog is empty` implies all three sets are considered. This method is used by `crates/uv/src/commands/tool/upgrade.rs:564` to classify an operation as `UpgradeOutcome::NoOp`. A `--reinstall` that reinstalls the tool's packages at the same version populates only `reinstalled` (a `CachedDist` and the prior `InstalledDist` of equal name+version compare equal via `LocalDist` and are partitioned into `reinstalled` in `Changelog::new`), so the environment actually changed but `is_empty()` returns `true`, mislabeling it a no-op.","fix":"Include `reinstalled` in the emptiness check: `self.installed.is_empty() && self.uninstalled.is_empty() && self.reinstalled.is_empty()`. (Reassess whether `includes` at lines 549-552 should also consider `reinstalled` for its callers.)","locations":[{"ref":"crates/uv/src/commands/pip/operations.rs:554-557","code":"  554 |     /// Returns `true` if the changelog is empty.\n  555 |     pub(crate) fn is_empty(&self) -> bool {\n  556 |         self.installed.is_empty() && self.uninstalled.is_empty()\n  557 |     }","lines":4,"link":"https://github.com/astr
