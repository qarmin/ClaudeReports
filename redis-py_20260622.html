<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.easy-badge{background:#052e16;color:#86efac;border-color:#16a34a}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","easy":false,"description":"The subkey wire-format parsers raise unhandled exceptions on malformed/unexpected server data, propagating out of KeyNotification.from_message -> get_message -> listen and crashing the polling/worker loop. _parse_length_prefixed_subkeys calls s.index(':') (raises ValueError if no colon) and int(s[pos:colon]) (raises ValueError on non-numeric length); a malicious or buggy length prefix also yields wrong-but-silent slices. _parse calls data.index('|') (line 434), data.index(':') (line 460), and key_and_subkey.index('\\n') (line 489) with no guard, all of which raise ValueError if the delimiter is absent. Any of these turns a single bad notification into a crash of the consumer thread.","fix":"Guard the delimiter lookups (use str.find and check for -1, or wrap _parse subkey branches in try/except ValueError returning None) so a malformed payload yields None instead of propagating an exception that kills the listen()/worker loop.","locations":[{"ref":"redis/keyspace_notifications.py:223-241","code":"  223 | def _parse_length_prefixed_subkeys(s: str) -> list[str]:\n  224 |     \"\"\"Parse a length-prefixed subkey list.\n  225 | \n  226 |     The wire format is ``<len>:<subkey>[,<len>:<subkey>...]``.\n  227 | \n  228 |     Returns:\n  229 |         A list of subkey strings.\n  230 |     \"\"\"\n  231 |     subkeys: list[str] = []\n  232 |     pos = 0\n  233 |     while pos < len(s):\n  234 |         colon = s.index(\":\", pos)\n  235 |         length = int(s[pos:colon])\n  236 |         start = colon + 1\n  237 |         subkeys.append(s[start : start + length])\n  238 |         pos = start + length\n  239 |         if pos < len(s) and s[pos] == \",\":\n  240 |             pos += 1  # skip comma separator\n  241 |     return subkeys","lines":19,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/keyspace_notifications.py#L223-L241"},{"ref":"redis/keyspace_notifications.py:430-466","code":"  430 |         match = cls._SUBKEYSPACE_PATTERN.match(channel)\n  431 |         if match:\n  432 |             db_str, key = match.groups()\n  433 |             database = int(db_str) if db_str != \"*\" else -1\n  434 |             pipe_idx = data.index(\"|\")\n  435 |             event_type = data[:pipe_idx]\n  436 |             subkeys = _parse_length_prefixed_subkeys(data[pipe_idx + 1 :])\n  437 | \n  438 |             if key_prefix:\n  439 |                 if not key.startswith(key_prefix):\n  440 |                     return None\n  441 |                 key = key[len(key_prefix) :]\n  442 | \n  443 |             return cls(\n  444 |                 key=key,\n  445 |                 event_type=event_type,\n  446 |                 database=database,\n  447 |                 channel=channel,\n  448 |                 is_keyspace=True,\n  449 |                 data=data,\n  450 |                 subkeys=subkeys,\n  451 |             )\n  452 | \n  453 |         # Try subkeyevent: channel=__subkeyevent@<db>__:<event>\n  454 |         # data=<key_len>:<key>|<subkey_len>:<subkey>[,...]\n  455 |         match = cls._SUBKEYEVENT_PATTERN.match(channel)\n  456 |         if match:\n  457 |             db_str, event_type = match.groups()\n  458 |             database = int(db_str) if db_str != \"*\" else -1\n  459 |             # Parse key by length prefix\n  460 |             colon_idx = data.index(\":\")\n  461 |             key_len = int(data[:colon_idx])\n  462 |             key_start = colon_idx + 1\n  463 |             key = data[key_start : key_start + key_len]\n  464 |             # After key, expect '|' then subkeys\n  465 |             subkeys_start = key_start + key_len + 1  # +1 for '|'\n  466 |             subkeys = _parse_length_prefixed_subkeys(data[subkeys_start:])","lines":37,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/keyspace_notifications.py#L430-L466"},{"ref":"redis/keyspace_notifications.py:485-491","code":"  485 |         match = cls._SUBKEYSPACEITEM_PATTERN.match(channel)\n  486 |         if match:\n  487 |             db_str, key_and_subkey = match.groups()\n  488 |             database = int(db_str) if db_str != \"*\" else -1\n  489 |             newline_idx = key_and_subkey.index(\"\\n\")\n  490 |             key = key_and_subkey[:newline_idx]\n  491 |             subkey = key_and_subkey[newline_idx + 1 :]","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/keyspace_notifications.py#L485-L491"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"Monitor.next_command() assumes the monitor regex always matches. If connection.read_response() yields a line that does not match monitor_re (e.g. a malformed/truncated MONITOR line, or a protocol/version mismatch), m is None and m.groups() raises AttributeError ('NoneType' object has no attribute 'groups') instead of a meaningful RedisError. The same method also unconditionally response.split(' ', 1), which raises ValueError if the response has no space.","fix":"Guard the match result: if m is None, raise RedisError(f\"Unexpected MONITOR response: {response!r}\"). Similarly validate the split result before unpacking.","locations":[{"ref":"redis/client.py:919-921","code":"  919 |         command_time, command_data = response.split(\" \", 1)\n  920 |         m = self.monitor_re.match(command_data)\n  921 |         db_id, client_info, command = m.groups()","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L919-L921"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","easy":true,"description":"_extracts_socket_address can raise UnboundLocalError. The local variable `socket_address` is only assigned inside the try block. If `connection._sock.getsockname()` raises AttributeError or OSError, the except branch only `pass`es, and the function then executes `return socket_address` while `socket_address` was never bound, raising UnboundLocalError. This method is invoked from the ConnectionError/TimeoutError/MovedError/etc. debug-logging paths in _execute_command, so an error during error handling can mask the original cluster error with a confusing UnboundLocalError.","fix":"Initialize `socket_address = None` before the try block (or `return None` inside the except), so the variable is always bound on the return path.","locations":[{"ref":"redis/cluster.py:1946-1958","code":" 1946 |     def _extracts_socket_address(\n 1947 |         self, connection: Optional[Connection]\n 1948 |     ) -> Optional[int]:\n 1949 |         if connection is None:\n 1950 |             return None\n 1951 |         try:\n 1952 |             socket_address = (\n 1953 |                 connection._sock.getsockname() if connection._sock else None\n 1954 |             )\n 1955 |             socket_address = socket_address[1] if socket_address else None\n 1956 |         except (AttributeError, OSError):\n 1957 |             pass\n 1958 |         return socket_address","lines":13,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L1946-L1958"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`parse_subcommand` guards the optional-fields block with `len(command) > 7` (i.e. length >= 8) but then indexes `command[7]`, `command[8]` AND `command[9]`. A COMMAND/COMMAND DOCS subcommand row of length 8 or 9 raises IndexError. Normal Redis returns 10-element rows so this is latent, but a future/older server or a module returning a shorter row would crash key extraction. The same too-loose guard pattern appears in `parse_command` (helpers.py).","fix":"Guard with `len(command) > 9` (>= 10) before accessing command[9], or assign the optional fields defensively with bounds checks.","locations":[{"ref":"redis/_parsers/commands.py:87-90","code":"   87 |         if len(command) > 7:\n   88 |             cmd_dict[\"tips\"] = command[7]\n   89 |             cmd_dict[\"key_specifications\"] = command[8]\n   90 |             cmd_dict[\"subcommands\"] = command[9]","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/commands.py#L87-L90"},{"ref":"redis/_parsers/helpers.py:1205-1208","code":" 1205 |         if len(command) > 7:\n 1206 |             cmd_dict[\"tips\"] = command[7]\n 1207 |             cmd_dict[\"key_specifications\"] = command[8]\n 1208 |             cmd_dict[\"subcommands\"] = command[9]","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/helpers.py#L1205-L1208"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`SearchCommands.sugadd` (and the async variant) call `pipe.execute()[-1]` after building a pipeline from the `suggestions` varargs. If `sugadd(key)` is called with no suggestion objects, the pipeline executes empty and `[-1]` raises IndexError instead of a clear error or a no-op return.","fix":"Guard against an empty `suggestions` tuple (return 0 or raise a descriptive ValueError) before indexing the pipeline result.","locations":[{"ref":"redis/commands/search/commands.py:1610-1631","code":" 1610 |     def sugadd(self, key, *suggestions, **kwargs):\n 1611 |         \"\"\"\n 1612 |         Add suggestion terms to the AutoCompleter engine. Each suggestion has\n 1613 |         a score and string.\n 1614 |         If kwargs[\"increment\"] is true and the terms are already in the\n 1615 |         server's dictionary, we increment their scores.\n 1616 | \n 1617 |         For more information see `FT.SUGADD <https://redis.io/commands/ft.sugadd/>`_.\n 1618 |         \"\"\"  # noqa\n 1619 |         # If Transaction is not False it will MULTI/EXEC which will error\n 1620 |         pipe = self.pipeline(transaction=False)\n 1621 |         for sug in suggestions:\n 1622 |             args = [SUGADD_COMMAND, key, sug.string, sug.score]\n 1623 |             if kwargs.get(\"increment\"):\n 1624 |                 args.append(\"INCR\")\n 1625 |             if sug.payload:\n 1626 |                 args.append(\"PAYLOAD\")\n 1627 |                 args.append(sug.payload)\n 1628 | \n 1629 |             pipe.execute_command(*args)\n 1630 | \n 1631 |         return pipe.execute()[-1]","lines":22,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/search/commands.py#L1610-L1631"},{"ref":"redis/commands/search/commands.py:1965-1986","code":" 1965 |     async def sugadd(self, key, *suggestions, **kwargs):\n 1966 |         \"\"\"\n 1967 |         Add suggestion terms to the AutoCompleter engine. Each suggestion has\n 1968 |         a score and string.\n 1969 |         If kwargs[\"increment\"] is true and the terms are already in the\n 1970 |         server's dictionary, we increment their scores.\n 1971 | \n 1972 |         For more information see `FT.SUGADD <https://redis.io/commands/ft.sugadd>`_.\n 1973 |         \"\"\"  # noqa\n 1974 |         # If Transaction is not False it will MULTI/EXEC which will error\n 1975 |         pipe = self.pipeline(transaction=False)\n 1976 |         for sug in suggestions:\n 1977 |             args = [SUGADD_COMMAND, key, sug.string, sug.score]\n 1978 |             if kwargs.get(\"increment\"):\n 1979 |                 args.append(\"INCR\")\n 1980 |             if sug.payload:\n 1981 |                 args.append(\"PAYLOAD\")\n 1982 |                 args.append(sug.payload)\n 1983 | \n 1984 |             pipe.execute_command(*args)\n 1985 | \n 1986 |         return (await pipe.execute())[-1]","lines":22,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/search/commands.py#L1965-L1986"}]},{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"medium","easy":false,"description":"ConnectionPool.disconnect() iterates chain(self._available_connections, self._in_use_connections) and builds an asyncio.gather() over them WITHOUT holding self._lock. Each connection.disconnect() awaits (wait_closed), yielding control, while other tasks may concurrently call get_connection()/release(), which mutate _available_connections / _in_use_connections. Mutating a set (_in_use_connections) during iteration raises 'Set changed size during iteration'; concurrent release() appends to the list being chained. get_connection_count()/set_retry() iterate the same collections lock-free too.","fix":"Snapshot the connections under self._lock (e.g. list(chain(...)) inside `async with self._lock`) before gathering disconnects / iterating, as the in-use snapshot is already done under lock in update_active_connections_for_reconnect().","locations":[{"ref":"redis/asyncio/connection.py:1673-1694","code":" 1673 |     async def disconnect(self, inuse_connections: bool = True):\n 1674 |         \"\"\"\n 1675 |         Disconnects connections in the pool\n 1676 | \n 1677 |         If ``inuse_connections`` is True, disconnect connections that are\n 1678 |         current in use, potentially by other tasks. Otherwise only disconnect\n 1679 |         connections that are idle in the pool.\n 1680 |         \"\"\"\n 1681 |         if inuse_connections:\n 1682 |             connections: Iterable[AbstractConnection] = chain(\n 1683 |                 self._available_connections, self._in_use_connections\n 1684 |             )\n 1685 |         else:\n 1686 |             connections = self._available_connections\n 1687 |         resp = await asyncio.gather(\n 1688 |             *(connection.disconnect() for connection in connections),\n 1689 |             return_exceptions=True,\n 1690 |         )\n 1691 | \n 1692 |         exc = next((r for r in resp if isinstance(r, BaseException)), None)\n 1693 |         if exc:\n 1694 |             raise exc","lines":22,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L1673-L1694"},{"ref":"redis/asyncio/connection.py:1708-1712","code":" 1708 |     def set_retry(self, retry: \"Retry\") -> None:\n 1709 |         for conn in self._available_connections:\n 1710 |             conn.retry = retry\n 1711 |         for conn in self._in_use_connections:\n 1712 |             conn.retry = retry","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L1708-L1712"}]},{"id":"RACE_2","type":"race_condition","type_label":"Race Condition","severity":"medium","easy":false,"description":"ConnectionPool.make_connection increments self._created_connections and checks it against max_connections, but in the base ConnectionPool the increment happens inside get_connection's 'with self._lock' block only for the pop; make_connection itself is called within that lock so it is fine there. However record_connection_count IDLE +1 is emitted in make_connection while the matching IDLE -1 is emitted later in get_connection outside any guarantee that make_connection succeeded fully; if make_connection raises after the +1 (it cannot here, but CacheProxyConnection construction can raise), the IDLE counter is leaked positive. The +1 is emitted only after successful construction in the base class, but the ordering between is_created bookkeeping and exception paths is fragile.","fix":"Emit the IDLE +1 / IDLE -1 / USED +1 transitions atomically within a single locked region tied to successful acquisition, or record IDLE -> USED as one transition to avoid counter drift when construction or connect fails.","locations":[{"ref":"redis/connection.py:3203-3226","code":" 3203 |     def make_connection(self) -> \"ConnectionInterface\":\n 3204 |         \"Create a new connection\"\n 3205 |         if self._created_connections >= self.max_connections:\n 3206 |             raise MaxConnectionsError(\"Too many connections\")\n 3207 |         self._created_connections += 1\n 3208 | \n 3209 |         kwargs = dict(self.connection_kwargs)\n 3210 | \n 3211 |         # Create the connection first, then record metrics only on success\n 3212 |         if self.cache is not None:\n 3213 |             connection = CacheProxyConnection(\n 3214 |                 self.connection_class(**kwargs), self.cache, self._lock\n 3215 |             )\n 3216 |         else:\n 3217 |             connection = self.connection_class(**kwargs)\n 3218 | \n 3219 |         # Record new connection created (starts as IDLE) - only after successful construction\n 3220 |         record_connection_count(\n 3221 |             pool_name=get_pool_name(self),\n 3222 |             connection_state=ConnectionState.IDLE,\n 3223 |             counter=1,\n 3224 |         )\n 3225 | \n 3226 |         return connection","lines":24,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L3203-L3226"},{"ref":"redis/connection.py:3146-3159","code":" 3146 |         # Record state transition: IDLE -> USED\n 3147 |         # (make_connection already recorded IDLE +1 for new connections)\n 3148 |         # This ensures counters stay balanced if connect() fails and release() is called\n 3149 |         pool_name = get_pool_name(self)\n 3150 |         record_connection_count(\n 3151 |             pool_name=pool_name,\n 3152 |             connection_state=ConnectionState.IDLE,\n 3153 |             counter=-1,\n 3154 |         )\n 3155 |         record_connection_count(\n 3156 |             pool_name=pool_name,\n 3157 |             connection_state=ConnectionState.USED,\n 3158 |             counter=1,\n 3159 |         )","lines":14,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L3146-L3159"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"AsyncHTTPClientWrapper creates a ThreadPoolExecutor in __init__ but never shuts it down. There is no close/aclose/__aexit__ and no executor.shutdown() anywhere, so each wrapper instance leaks up to max_workers (default 10) threads for the process lifetime. The executor is also not bound to the event loop's default executor, so it cannot be cleaned up by loop shutdown.","fix":"Add an async context manager / aclose() method that calls self._executor.shutdown(wait=False) (or shutdown(cancel_futures=True)), and document/require its use; alternatively pass executor=None to run_in_executor to reuse the loop's default executor.","locations":[{"ref":"redis/asyncio/http/http_client.py:117-131","code":"  117 |     def __init__(self, client: HttpClient, max_workers: int = 10) -> None:\n  118 |         \"\"\"\n  119 |         Initialize a new HTTP client instance.\n  120 | \n  121 |         Args:\n  122 |             client: Sync HTTP client instance.\n  123 |             max_workers: Maximum number of concurrent requests.\n  124 | \n  125 |         The client supports both regular HTTPS with server verification and mutual TLS\n  126 |         authentication. For server verification, provide CA certificate information via\n  127 |         ca_file, ca_path or ca_data. For mutual TLS, additionally provide a client\n  128 |         certificate and key via client_cert_file and client_key_file.\n  129 |         \"\"\"\n  130 |         self.client = client\n  131 |         self._executor = ThreadPoolExecutor(max_workers=max_workers)","lines":15,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/http/http_client.py#L117-L131"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","easy":false,"description":"ClusterNode._free is a bounded deque (maxlen=max_connections). _disconnect_and_release and release append to _free after disconnect; if _free is already full, deque silently drops the oldest entry while the dropped Connection object remains tracked in self._connections, never returned to the pool and never removed - a slow per-node connection leak/accounting drift. Normally len(_free) <= max_connections holds, but the maxlen behaviour makes the invariant silent rather than enforced.","fix":"Verify the free-queue invariant explicitly (assert/log) or remove the connection from _connections when it cannot be re-queued, so capacity accounting cannot silently drift.","locations":[{"ref":"redis/asyncio/cluster.py:1592-1620","code":" 1592 |     def release(self, connection: Connection) -> None:\n 1593 |         \"\"\"\n 1594 |         Release connection back to free queue.\n 1595 |         If the connection is marked for reconnect, disconnect it before\n 1596 |         returning it to the free queue.\n 1597 |         \"\"\"\n 1598 |         if connection.should_reconnect():\n 1599 |             task = asyncio.create_task(self._disconnect_and_release(connection))\n 1600 |             self._background_tasks.add(task)\n 1601 |             task.add_done_callback(self._background_tasks.discard)\n 1602 |             return\n 1603 |         self._free.append(connection)\n 1604 | \n 1605 |     async def _disconnect_and_release(self, connection: Connection) -> None:\n 1606 |         try:\n 1607 |             await connection.disconnect()\n 1608 |         except Exception as exc:\n 1609 |             logger.debug(\n 1610 |                 \"disconnecting released cluster connection failed: %r\",\n 1611 |                 exc,\n 1612 |                 exc_info=True,\n 1613 |             )\n 1614 |             try:\n 1615 |                 self._connections.remove(connection)\n 1616 |             except ValueError:\n 1617 |                 pass\n 1618 |             return\n 1619 | \n 1620 |         self._free.append(connection)","lines":29,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L1592-L1620"},{"ref":"redis/asyncio/cluster.py:1508","code":" 1508 |         self._free: Deque[Connection] = collections.deque(maxlen=self.max_connections)","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L1508"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","easy":false,"description":"TokenManager.start() spins up a new event loop in a daemon thread (start_loop) running loop.run_forever() when no loop is running. stop() cancels the timers but never stops the loop (loop.stop()) nor joins/closes the thread. The daemon thread with run_forever() leaks for the process lifetime; each new TokenManager that hits this path leaks another thread+loop. Daemon status prevents process-exit hangs but it is still a per-manager resource leak.","fix":"Track the created loop and thread on the instance; in stop() call loop.call_soon_threadsafe(loop.stop) and join the thread (with timeout), then loop.close().","locations":[{"ref":"redis/auth/token_manager.py:144-165","code":"  144 |             loop = asyncio.get_running_loop()\n  145 |         except RuntimeError:\n  146 |             # Run loop in a separate thread to unblock main thread.\n  147 |             loop = asyncio.new_event_loop()\n  148 | \n  149 |             # Use threading.Event to signal when loop is ready\n  150 |             loop_ready = threading.Event()\n  151 | \n  152 |             def start_loop():\n  153 |                 # This runs in the background thread. First, bind the event loop to\n  154 |                 # this thread, then signal that the loop is ready so the calling\n  155 |                 # thread can safely schedule work (via call_soon_threadsafe) before\n  156 |                 # we block in run_forever().\n  157 |                 asyncio.set_event_loop(loop)\n  158 |                 loop_ready.set()  # Signal that loop is ready for cross-thread use\n  159 |                 loop.run_forever()\n  160 | \n  161 |             thread = threading.Thread(target=start_loop, daemon=True)\n  162 |             thread.start()\n  163 | \n  164 |             # Wait for the loop to be ready before scheduling\n  165 |             loop_ready.wait()","lines":22,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/auth/token_manager.py#L144-L165"},{"ref":"redis/auth/token_manager.py:208-212","code":"  208 |     def stop(self):\n  209 |         if self._init_timer is not None:\n  210 |             self._init_timer.cancel()\n  211 |         if self._next_timer is not None:\n  212 |             self._next_timer.cancel()","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/auth/token_manager.py#L208-L212"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","easy":false,"description":"BackgroundScheduler.run_once / run_recurring create a brand-new event loop and daemon thread per call and append the loop to self._event_loops, but for run_once the loop runs forever (run_forever in _start_event_loop_in_thread) after the single delayed callback fires, and is only stopped in stop(). A program that calls run_once many times accumulates one never-terminating background thread + event loop per call until stop()/__del__. These are leaked resources for the lifetime of the scheduler.","fix":"For run_once, stop and close the loop after the one-shot callback completes (e.g. call loop.stop() from the callback wrapper) and remove it from _event_loops, rather than leaving run_forever active.","locations":[{"ref":"redis/background.py:46-65","code":"   46 |     def run_once(self, delay: float, callback: Callable, *args):\n   47 |         \"\"\"\n   48 |         Runs callable task once after certain delay in seconds.\n   49 |         \"\"\"\n   50 |         with self._lock:\n   51 |             if self._stopped:\n   52 |                 return\n   53 | \n   54 |         # Run loop in a separate thread to unblock main thread.\n   55 |         loop = asyncio.new_event_loop()\n   56 | \n   57 |         with self._lock:\n   58 |             self._event_loops.append(loop)\n   59 | \n   60 |         thread = threading.Thread(\n   61 |             target=_start_event_loop_in_thread,\n   62 |             args=(loop, self._call_later, delay, callback, *args),\n   63 |             daemon=True,\n   64 |         )\n   65 |         thread.start()","lines":20,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/background.py#L46-L65"},{"ref":"redis/background.py:469-496","code":"  469 | def _start_event_loop_in_thread(\n  470 |     event_loop: asyncio.AbstractEventLoop, call_soon_cb: Callable, *args\n  471 | ):\n  472 |     \"\"\"\n  473 |     Starts event loop in a thread and schedule callback as soon as event loop is ready.\n  474 |     Used to be able to schedule tasks using loop.call_later.\n  475 | \n  476 |     :param event_loop:\n  477 |     :return:\n  478 |     \"\"\"\n  479 |     asyncio.set_event_loop(event_loop)\n  480 |     event_loop.call_soon(call_soon_cb, event_loop, *args)\n  481 |     try:\n  482 |         event_loop.run_forever()\n  483 |     finally:\n  484 |         try:\n  485 |             # Clean up pending tasks\n  486 |             pending = asyncio.all_tasks(event_loop)\n  487 |             for task in pending:\n  488 |                 task.cancel()\n  489 |             # Run loop once more to process cancellations\n  490 |             event_loop.run_until_complete(\n  491 |                 asyncio.gather(*pending, return_exceptions=True)\n  492 |             )\n  493 |         except Exception:\n  494 |             pass\n  495 |         finally:\n  496 |             event_loop.close()","lines":28,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/background.py#L469-L496"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"All exponential backoff compute() methods evaluate self._base * 2**failures before applying min(self._cap, ...). For large failure counts (e.g. retries=-1 'forever' with many consecutive failures) 2**failures grows without bound, producing very large Python ints/floats each call; eventually the float multiplication overflows to inf, and min(cap, inf) returns cap so the result stays correct, but the intermediate 2**failures computation is unbounded work (big-int exponentiation grows with failures) creating a slow performance degradation over time on a never-succeeding operation.","fix":"Cap the exponent before computing the power, e.g. exp = min(failures, math.ceil(math.log2(cap/base)) + 1), to avoid unbounded big-int exponentiation.","locations":[{"ref":"redis/backoff.py:74-75","code":"   74 |     def compute(self, failures: int) -> float:\n   75 |         return min(self._cap, self._base * 2**failures)","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/backoff.py#L74-L75"},{"ref":"redis/backoff.py:98-99","code":"   98 |     def compute(self, failures: int) -> float:\n   99 |         return random.uniform(0, min(self._cap, self._base * 2**failures))","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/backoff.py#L98-L99"},{"ref":"redis/backoff.py:122-124","code":"  122 |     def compute(self, failures: int) -> float:\n  123 |         temp = min(self._cap, self._base * 2**failures) / 2\n  124 |         return temp + random.uniform(0, temp)","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/backoff.py#L122-L124"},{"ref":"redis/backoff.py:178-179","code":"  178 |     def compute(self, failures: int) -> float:\n  179 |         return min(self._cap, random.random() * self._base * 2**failures)","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/backoff.py#L178-L179"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"TransactionStrategy._execute_command returns an un-awaited coroutine on the immediate-execute path. `_execute_command` is an `async def`, but on the WATCH/UNWATCH/immediate branch it does `return self._immediate_execute_command(*args, **kwargs)` without `await`. The caller runs the whole thing via `asyncio.run(self._execute_command(...))`, so the inner `_immediate_execute_command()` coroutine is produced and returned but never awaited - the WATCH/UNWATCH command is never sent to the server, and Python emits a 'coroutine was never awaited' warning. The sync mirror (redis/cluster.py:4484) works because there `_immediate_execute_command` is a plain function that actually executes.","fix":"Use `return await self._immediate_execute_command(*args, **kwargs)` so the immediate command is actually executed.","locations":[{"ref":"redis/asyncio/cluster.py:2892","code":" 2892 |             return self._immediate_execute_command(*args, **kwargs)","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L2892"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"ConnectionPool.__init__ initializes self._in_use_connections as a plain set() (line 1440), but reset() reinitializes it as weakref.WeakSet() (line 1507). The sync mirror keeps a plain set() in both __init__ and reset() (redis/connection.py:3036). With a WeakSet, in-use connections are only weakly referenced by the pool; a connection whose only other strong reference is dropped by the caller can be garbage-collected while nominally 'in use'. This silently breaks max_connections enforcement (len(self._in_use_connections) under-counts), can make release()'s self._in_use_connections.remove(connection) raise KeyError for a collected connection, and produces inconsistent get_connection_count() metrics. The type of the container also changes mid-lifetime depending on whether reset() was ever called.","fix":"In reset(), set self._in_use_connections = set() to match __init__ and the sync mirror, instead of weakref.WeakSet().","locations":[{"ref":"redis/asyncio/connection.py:1507","code":" 1507 |         self._in_use_connections = weakref.WeakSet()","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L1507"},{"ref":"redis/asyncio/connection.py:1440","code":" 1440 |         self._in_use_connections: Set[AbstractConnection] = set()","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L1440"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"Async _on_circuit_state_change_callback calls asyncio.get_running_loop() unconditionally at the top, which raises RuntimeError if the callback fires outside a running event loop. pybreaker invokes the state_change listener synchronously from whatever context mutates the circuit state. The async failure detector / command path can transition a circuit to OPEN while running inside the loop (fine), but get_running_loop() is evaluated for every state change including HALF_OPEN (which doesn't even use loop). If a state change is ever triggered from a non-async thread/context (e.g. the shared health-check loop callback, or a sync caller), get_running_loop() raises and the callback aborts before scheduling recovery. The sync analog uses the BackgroundScheduler and has no such dependency.","fix":"Only fetch the loop in the branch that needs it (old CLOSED -> OPEN), wrap in try/except for get_running_loop, or capture the loop reference at initialize() time. Also guard against being called when no loop is running.","locations":[{"ref":"redis/asyncio/multidb/client.py:409-427","code":"  409 |     def _on_circuit_state_change_callback(\n  410 |         self, circuit: CircuitBreaker, old_state: CBState, new_state: CBState\n  411 |     ):\n  412 |         loop = asyncio.get_running_loop()\n  413 | \n  414 |         if new_state == CBState.HALF_OPEN:\n  415 |             self._half_open_state_task = asyncio.create_task(\n  416 |                 self._check_db_health(circuit.database)\n  417 |             )\n  418 |             return\n  419 | \n  420 |         if old_state == CBState.CLOSED and new_state == CBState.OPEN:\n  421 |             logger.warning(\n  422 |                 f\"Database {circuit.database} is unreachable. Failover has been initiated.\"\n  423 |             )\n  424 |             loop.call_later(DEFAULT_GRACE_PERIOD, _half_open_circuit, circuit)\n  425 | \n  426 |         if old_state != CBState.CLOSED and new_state == CBState.CLOSED:\n  427 |             logger.info(f\"Database {circuit.database} is reachable again.\")","lines":19,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/client.py#L409-L427"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"TokenManager.acquire_token / acquire_token_async use a shared self._retries counter that is never reset to 0 on the failure path. After a transient RequestTokenErr is exhausted (raised), self._retries is left at max_attempts. The next acquire_token call therefore starts with _retries already at the limit and will not retry at all (it raises on the first failure). It is only reset to 0 on a successful return. With a single shared instance used by the background renewal thread plus on-demand acquisitions, the retry budget is effectively global and not per-call, breaking the retry policy. Additionally, because _retries is shared and mutated without a lock while the renewal loop runs in a separate thread, concurrent acquire_token calls can corrupt the counter.","fix":"Track retry attempts in a local variable scoped to a single acquire_token call (e.g. a loop with a local counter), or reset self._retries = 0 in the failure branch before raising. Guard shared state with a lock if concurrent access is possible.","locations":[{"ref":"redis/auth/token_manager.py:214-242","code":"  214 |     def acquire_token(self, force_refresh=False) -> TokenResponse:\n  215 |         try:\n  216 |             token = self._idp.request_token(force_refresh)\n  217 |         except RequestTokenErr as e:\n  218 |             if self._retries < self._config.get_retry_policy().get_max_attempts():\n  219 |                 self._retries += 1\n  220 |                 sleep(self._config.get_retry_policy().get_delay_in_ms() / 1000)\n  221 |                 return self.acquire_token(force_refresh)\n  222 |             else:\n  223 |                 raise e\n  224 | \n  225 |         self._retries = 0\n  226 |         return TokenResponse(token)\n  227 | \n  228 |     async def acquire_token_async(self, force_refresh=False) -> TokenResponse:\n  229 |         try:\n  230 |             token = self._idp.request_token(force_refresh)\n  231 |         except RequestTokenErr as e:\n  232 |             if self._retries < self._config.get_retry_policy().get_max_attempts():\n  233 |                 self._retries += 1\n  234 |                 await asyncio.sleep(\n  235 |                     self._config.get_retry_policy().get_delay_in_ms() / 1000\n  236 |                 )\n  237 |                 return await self.acquire_token_async(force_refresh)\n  238 |             else:\n  239 |                 raise e\n  240 | \n  241 |         self._retries = 0\n  242 |         return TokenResponse(token)","lines":29,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/auth/token_manager.py#L214-L242"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In _renew_token (sync), the next renewal is scheduled via asyncio.get_running_loop() / loop.call_later. _renew_token runs inside loop.call_soon_threadsafe on the background event-loop thread, so get_running_loop() succeeds the first time. But when start() is called from a thread that already has a running loop, the renewal is scheduled with call_soon_threadsafe on that loop and runs as a synchronous callback; get_running_loop() inside it works only because a loop is running. The deeper problem: the recursive self-scheduling stores into self._next_timer only on the sync path, while the async path (_renew_token_async line 347) calls loop.call_later WITHOUT assigning to self._next_timer. Therefore stop() can never cancel the async renewal chain - the timer handle is lost and the periodic refresh keeps running after stop().","fix":"Assign the call_later handle to self._next_timer in _renew_token_async (self._next_timer = loop.call_later(delay, wrapped)) so stop() can cancel the scheduled async renewal.","locations":[{"ref":"redis/auth/token_manager.py:344-347","code":"  344 |             loop = asyncio.get_running_loop()\n  345 |             wrapped = _async_to_sync_wrapper(loop, self._renew_token_async)\n  346 |             logger.info(f\"Next token renewal scheduled in {delay} seconds\")\n  347 |             loop.call_later(delay, wrapped)","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/auth/token_manager.py#L344-L347"},{"ref":"redis/auth/token_manager.py:208-212","code":"  208 |     def stop(self):\n  209 |         if self._init_timer is not None:\n  210 |             self._init_timer.cancel()\n  211 |         if self._next_timer is not None:\n  212 |             self._next_timer.cancel()","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/auth/token_manager.py#L208-L212"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"DefaultCache.delete_by_redis_keys can append the same cache_key to keys_to_delete multiple times and append duplicate True values to the response, then call self._cache.pop(key) twice for the same key, raising KeyError. A single cache_key whose redis_keys contains more than one of the requested redis_keys (or both the str and bytes candidate of one key) is matched once per matching outer redis_key, so it is added to keys_to_delete repeatedly. The second pop() of an already-removed key raises KeyError, aborting the deletion. The response list length also no longer corresponds to the number of input redis_keys.","fix":"Deduplicate before popping: collect matched cache_keys in a set (or check membership before adding), and build the response per input redis_key rather than per match. Guard the pop with `if key in self._cache`.","locations":[{"ref":"redis/cache.py:214-239","code":"  214 |     def delete_by_redis_keys(\n  215 |         self, redis_keys: Union[List[bytes], List[str]]\n  216 |     ) -> List[bool]:\n  217 |         response = []\n  218 |         keys_to_delete = []\n  219 | \n  220 |         for redis_key in redis_keys:\n  221 |             # Prepare both versions for lookup\n  222 |             candidates = [redis_key]\n  223 |             if isinstance(redis_key, str):\n  224 |                 candidates.append(redis_key.encode(\"utf-8\"))\n  225 |             elif isinstance(redis_key, bytes):\n  226 |                 try:\n  227 |                     candidates.append(redis_key.decode(\"utf-8\"))\n  228 |                 except UnicodeDecodeError:\n  229 |                     pass  # Non-UTF-8 bytes, skip str version\n  230 | \n  231 |             for cache_key in self._cache:\n  232 |                 if any(candidate in cache_key.redis_keys for candidate in candidates):\n  233 |                     keys_to_delete.append(cache_key)\n  234 |                     response.append(True)\n  235 | \n  236 |         for key in keys_to_delete:\n  237 |             self._cache.pop(key)\n  238 | \n  239 |         return response","lines":26,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cache.py#L214-L239"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"MOVED handling can loop without making progress under shared use. On a MovedError, the code increments reinitialize_counter and, when _should_reinitialized() is false, calls move_slot(e) and sets moved=True so the next loop iteration recomputes the target node from the slot. But move_slot only updates the slot mapping when the redirected node differs (`node_changed`); if the redirected node equals the current primary (circular MOVED, the documented no-op branch at line 2232), the slots cache is unchanged, get_node_from_slot returns the same node, and the same MOVED is received again. This burns TTL iterations (RedisClusterRequestTTL=16) and ultimately raises ClusterError('TTL exhausted') instead of forcing a topology reinitialization. A server stuck advertising itself via MOVED will exhaust the request rather than self-heal.","fix":"On a circular/no-op MOVED (redirected node already the slot's primary), force a full topology reinitialization (or break out to the outer retry) instead of retrying the identical node until TTL exhaustion.","locations":[{"ref":"redis/cluster.py:1754-1781","code":" 1754 |             except MovedError as e:\n 1755 |                 if is_debug_log_enabled():\n 1756 |                     socket_address = self._extracts_socket_address(connection)\n 1757 |                     args_log_str = truncate_text(\" \".join(map(safe_str, args)))\n 1758 |                     logger.debug(\n 1759 |                         f\"MOVED error received for command {args_log_str}, on node {target_node.name}, \"\n 1760 |                         f\"and connection: {connection} using local socket address: {socket_address}, error: {e}\"\n 1761 |                     )\n 1762 |                 # First, we will try to patch the slots/nodes cache with the\n 1763 |                 # redirected node output and try again. If MovedError exceeds\n 1764 |                 # 'reinitialize_steps' number of times, we will force\n 1765 |                 # reinitializing the tables, and then try again.\n 1766 |                 # 'reinitialize_steps' counter will increase faster when\n 1767 |                 # the same client object is shared between multiple threads. To\n 1768 |                 # reduce the frequency you can set this variable in the\n 1769 |                 # RedisCluster constructor.\n 1770 |                 self.reinitialize_counter += 1\n 1771 |                 if self._should_reinitialized():\n 1772 |                     # during this call all connections are closed or marked for disconnect,\n 1773 |                     # so we don't need to disconnect the changed node's connections\n 1774 |                     self.nodes_manager.initialize(\n 1775 |                         additional_startup_nodes_info=[(e.host, e.port)]\n 1776 |                     )\n 1777 |                     # Reset the counter\n 1778 |                     self.reinitialize_counter = 0\n 1779 |                 else:\n 1780 |                     self.nodes_manager.move_slot(e)\n 1781 |                 moved = True","lines":28,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L1754-L1781"},{"ref":"redis/cluster.py:2208-2232","code":" 2208 |             slot_nodes = self.slots_cache[e.slot_id]\n 2209 |             if redirected_node not in slot_nodes:\n 2210 |                 # The new slot owner is a new server, or a server from a different\n 2211 |                 # shard. We need to remove all current nodes from the slot's list\n 2212 |                 # (including replications) and add just the new node.\n 2213 |                 self.slots_cache[e.slot_id] = [redirected_node]\n 2214 |                 node_changed = True\n 2215 |             elif redirected_node is not slot_nodes[0]:\n 2216 |                 # The MOVED error resulted from a failover, and the new slot owner\n 2217 |                 # had previously been a replica.\n 2218 |                 old_primary = slot_nodes[0]\n 2219 |                 # Update the old primary to be a replica and add it to the end of\n 2220 |                 # the slot's node list\n 2221 |                 old_primary.server_type = REPLICA\n 2222 |                 slot_nodes.append(old_primary)\n 2223 |                 # Remove the old replica, which is now a primary, from the slot's\n 2224 |                 # node list\n 2225 |                 slot_nodes.remove(redirected_node)\n 2226 |                 # Override the old primary with the new one\n 2227 |                 slot_nodes[0] = redirected_node\n 2228 |                 if self.default_node == old_primary:\n 2229 |                     # Update the default node with the new primary\n 2230 |                     self.default_node = redirected_node\n 2231 |                 node_changed = True\n 2232 |             # else: circular MOVED to current primary -> no-op","lines":25,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L2208-L2232"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"The `geo()` query-string helper declares its signature as `geo(lat, lon, radius, unit)` but immediately forwards the arguments positionally to `GeoValue(lat, lon, radius, unit)`, whose own constructor is `GeoValue(lon, lat, radius, unit)`. RediSearch geo query syntax is `@field:[lon lat radius unit]` (longitude first). Because the parameter names in `geo()` are swapped relative to both the wire format and `GeoValue`'s parameter names, a caller who reads the `geo(lat, lon, ...)` signature and supplies latitude then longitude will produce a query string with the coordinates in the wrong order (`[lat lon ...]`), silently returning wrong/empty geo results. Either `geo()` should be `geo(lon, lat, ...)` or it should pass `GeoValue(lon, lat, ...)` explicitly by keyword.","fix":"Make the names and order consistent with the lon-first wire format, e.g. `def geo(lon, lat, radius, unit=\"km\"): return GeoValue(lon, lat, radius, unit)`, or pass by keyword.","locations":[{"ref":"redis/commands/search/querystring.py:56-60","code":"   56 | def geo(lat, lon, radius, unit=\"km\"):\n   57 |     \"\"\"\n   58 |     Indicate that value is a geo region\n   59 |     \"\"\"\n   60 |     return GeoValue(lat, lon, radius, unit)","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/search/querystring.py#L56-L60"},{"ref":"redis/commands/search/querystring.py:128-136","code":"  128 | class GeoValue(Value):\n  129 |     def __init__(self, lon, lat, radius, unit=\"km\"):\n  130 |         self.lon = lon\n  131 |         self.lat = lat\n  132 |         self.radius = radius\n  133 |         self.unit = unit\n  134 | \n  135 |     def to_string(self):\n  136 |         return f\"[{self.lon} {self.lat} {self.radius} {self.unit}]\"","lines":9,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/search/querystring.py#L128-L136"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"CacheProxyConnection._host_error does not return the inner value. It calls 'self._conn._host_error()' but omits 'return', so it always returns None. Any caller relying on the host-error string (e.g. building error messages) gets None. This is a copy-paste/omission bug compared to _connect just above which correctly delegates without a return because it has no return value.","fix":"Change the body to 'return self._conn._host_error()'.","locations":[{"ref":"redis/connection.py:1965-1966","code":" 1965 |     def _host_error(self):\n 1966 |         self._conn._host_error()","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L1965-L1966"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"Lock.LUA_EXTEND_SCRIPT builds the new ttl by string/number concatenation in Lua: `newttl = ARGV[2] + expiration`. ARGV[2] (additional milliseconds) arrives as a string and `expiration` is an integer from pttl. In Lua `'5000' + 3000` coerces the string to a number so it usually works, but the resulting value when replace_ttl is false relies on implicit string-to-number coercion; more importantly when replace_ttl is true, `newttl = ARGV[2]` remains a string and is passed to pexpire. This works today due to Redis/Lua coercion but is fragile. (Lower-confidence; flagged as a robustness concern rather than a confirmed runtime failure.)","fix":"Coerce ARGV[2] to a number explicitly in the script: `local add = tonumber(ARGV[2])` and compute newttl from `add` to avoid relying on implicit coercion.","locations":[{"ref":"redis/lock.py:45-64","code":"   45 |     LUA_EXTEND_SCRIPT = \"\"\"\n   46 |         local token = redis.call('get', KEYS[1])\n   47 |         if not token or token ~= ARGV[1] then\n   48 |             return 0\n   49 |         end\n   50 |         local expiration = redis.call('pttl', KEYS[1])\n   51 |         if not expiration then\n   52 |             expiration = 0\n   53 |         end\n   54 |         if expiration < 0 then\n   55 |             return 0\n   56 |         end\n   57 | \n   58 |         local newttl = ARGV[2]\n   59 |         if ARGV[3] == \"0\" then\n   60 |             newttl = ARGV[2] + expiration\n   61 |         end\n   62 |         redis.call('pexpire', KEYS[1], newttl)\n   63 |         return 1\n   64 |     \"\"\"","lines":20,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/lock.py#L45-L64"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"TemporaryUnavailableException is not retryable by the default command_retry, so failover-while-unavailable propagates immediately to the user. DefaultFailoverStrategyExecutor.execute() raises TemporaryUnavailableException to signal 'retry later' and relies on the outer command_retry catching it and retrying until a database becomes available (or failover_attempts is exhausted). But TemporaryUnavailableException subclasses plain Exception, and the default Retry supports only (ConnectionError, TimeoutError, socket.timeout); the multidb clients additionally add only ConnectionRefusedError. The default MultiDbConfig.command_retry therefore never catches TemporaryUnavailableException, so the whole failover-backoff loop is dead by default and the exception surfaces to the caller on the first transient unavailability. The scenario tests only work because they manually pass supported_errors=(TemporaryUnavailableException,). Either the default command_retry must include TemporaryUnavailableException, or the clients should add it via update_supported_errors like they do for ConnectionRefusedError.","fix":"Add TemporaryUnavailableException to the default command_retry supported_errors (e.g. self._command_retry.update_supported_errors((ConnectionRefusedError, TemporaryUnavailableException)) in both clients), or document that callers must configure it. Currently the retry/backoff loop in DefaultFailoverStrategyExecutor cannot function with the shipped defaults.","locations":[{"ref":"redis/multidb/failover.py:101-121","code":"  101 |     def execute(self) -> SyncDatabase:\n  102 |         try:\n  103 |             database = self._strategy.database()\n  104 |             self._reset()\n  105 |             return database\n  106 |         except NoValidDatabaseException as e:\n  107 |             if self._next_attempt_ts == 0:\n  108 |                 self._next_attempt_ts = time.time() + self._failover_delay\n  109 |                 self._failover_counter += 1\n  110 |             elif time.time() >= self._next_attempt_ts:\n  111 |                 self._next_attempt_ts += self._failover_delay\n  112 |                 self._failover_counter += 1\n  113 | \n  114 |             if self._failover_counter > self._failover_attempts:\n  115 |                 self._reset()\n  116 |                 raise e\n  117 |             else:\n  118 |                 raise TemporaryUnavailableException(\n  119 |                     \"No database connections currently available. \"\n  120 |                     \"This is a temporary condition - please retry the operation.\"\n  121 |                 )","lines":21,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/failover.py#L101-L121"},{"ref":"redis/multidb/client.py:68-69","code":"   68 |         self._command_retry = config.command_retry\n   69 |         self._command_retry.update_supported_errors((ConnectionRefusedError,))","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/client.py#L68-L69"},{"ref":"redis/multidb/config.py:143-148","code":"  143 |     command_retry: Retry = Retry(\n  144 |         backoff=ExponentialWithJitterBackoff(\n  145 |             base=DEFAULT_RETRY_BASE, cap=DEFAULT_RETRY_CAP\n  146 |         ),\n  147 |         retries=DEFAULT_RETRY_COUNT,\n  148 |     )","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/config.py#L143-L148"},{"ref":"redis/asyncio/multidb/failover.py:101-121","code":"  101 |     async def execute(self) -> AsyncDatabase:\n  102 |         try:\n  103 |             database = await self._strategy.database()\n  104 |             self._reset()\n  105 |             return database\n  106 |         except NoValidDatabaseException as e:\n  107 |             if self._next_attempt_ts == 0:\n  108 |                 self._next_attempt_ts = time.time() + self._failover_delay\n  109 |                 self._failover_counter += 1\n  110 |             elif time.time() >= self._next_attempt_ts:\n  111 |                 self._next_attempt_ts += self._failover_delay\n  112 |                 self._failover_counter += 1\n  113 | \n  114 |             if self._failover_counter > self._failover_attempts:\n  115 |                 self._reset()\n  116 |                 raise e\n  117 |             else:\n  118 |                 raise TemporaryUnavailableException(\n  119 |                     \"No database connections currently available. \"\n  120 |                     \"This is a temporary condition - please retry the operation.\"\n  121 |                 )","lines":21,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/failover.py#L101-L121"},{"ref":"redis/asyncio/multidb/client.py:65-66","code":"   65 |         self._command_retry = config.command_retry\n   66 |         self._command_retry.update_supported_errors([ConnectionRefusedError])","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/client.py#L65-L66"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Async and sync push handlers diverge for the SMIGRATED (oss cluster) message. The sync handler (base.py:368-381) fires when EITHER `oss_cluster_maint_push_handler_func` OR `maintenance_push_handler_func` is set, and invokes both handlers. The async handler (base.py:464-473) only fires when `oss_cluster_maint_push_handler_func` is set and never invokes `maintenance_push_handler_func`. A user who set only the generic maintenance handler gets SMIGRATED notifications on the sync stack but silently not on the async stack. The sync/async stacks are required to stay in lockstep.","fix":"Mirror the sync condition/dispatch in the async handler (fire when either handler is set; await both that are present).","locations":[{"ref":"redis/_parsers/base.py:368-381","code":"  368 |             if msg_type == _SMIGRATED_MESSAGE and (\n  369 |                 self.oss_cluster_maint_push_handler_func\n  370 |                 or self.maintenance_push_handler_func\n  371 |             ):\n  372 |                 parser_function = MSG_TYPE_TO_MAINT_NOTIFICATION_PARSER_MAPPING[\n  373 |                     msg_type\n  374 |                 ][1]\n  375 |                 notification = parser_function(response)\n  376 | \n  377 |                 if notification is not None:\n  378 |                     if self.maintenance_push_handler_func:\n  379 |                         self.maintenance_push_handler_func(notification)\n  380 |                     if self.oss_cluster_maint_push_handler_func:\n  381 |                         self.oss_cluster_maint_push_handler_func(notification)","lines":14,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/base.py#L368-L381"},{"ref":"redis/_parsers/base.py:464-473","code":"  464 |             if (\n  465 |                 msg_type == _SMIGRATED_MESSAGE\n  466 |                 and self.oss_cluster_maint_push_handler_func\n  467 |             ):\n  468 |                 parser_function = MSG_TYPE_TO_MAINT_NOTIFICATION_PARSER_MAPPING[\n  469 |                     msg_type\n  470 |                 ][1]\n  471 |                 notification = parser_function(response)\n  472 |                 if notification is not None:\n  473 |                     return await self.oss_cluster_maint_push_handler_func(notification)","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/base.py#L464-L473"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In the sync RESP3 parser, after a push message is consumed inline (not a push_request), the recursive call that reads the *actual* response drops the caller-supplied `timeout`. Every other recursion in this function forwards `timeout=timeout`; this one falls back to the SENTINEL default. The result is that when an out-of-band push arrives interleaved before a command reply, the per-call read timeout is silently lost for the rest of that reply, so a blocking-timeout read can hang on the default socket timeout instead. The async mirror (resp3.py:279-281) has no timeout parameter so this is a sync-only divergence.","fix":"Pass `timeout=timeout` to the trailing recursive `self._read_response(...)` call, matching the other recursions.","locations":[{"ref":"redis/_parsers/resp3.py:153-156","code":"  153 |             return self._read_response(\n  154 |                 disable_decoding=disable_decoding,\n  155 |                 push_request=push_request,\n  156 |             )","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/resp3.py#L153-L156"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In SocketBuffer._read_from_socket the NONBLOCKING_EXCEPTIONS handler can raise ConnectionError for what is actually a benign non-blocking 'would block' condition. When ex.errno matches the allowed errno and raise_on_timeout is True but timeout != 0, none of the inner branches return/raise, so control falls through to 'raise ConnectionError(...)'. A spurious EWOULDBLOCK (e.g. SSL renegotiation / partial read) is thus reported as a connection error instead of being retried, tearing down an otherwise healthy connection.","fix":"After confirming ex.errno == allowed, only raise ConnectionError if it is genuinely unexpected. For the matched-errno case, either retry the recv loop or return False; reserve the ConnectionError raise for the 'errno does not match allowed' case.","locations":[{"ref":"redis/_parsers/socket.py:79-90","code":"   79 |         except NONBLOCKING_EXCEPTIONS as ex:\n   80 |             # if we're in nonblocking mode and the recv raises a\n   81 |             # blocking error, simply return False indicating that\n   82 |             # there's no data to be read. otherwise raise the\n   83 |             # original exception.\n   84 |             allowed = NONBLOCKING_EXCEPTION_ERROR_NUMBERS.get(ex.__class__, -1)\n   85 |             if ex.errno == allowed:\n   86 |                 if not raise_on_timeout:\n   87 |                     return False\n   88 |                 if timeout == 0:\n   89 |                     raise TimeoutError(\"Timeout reading from socket\")\n   90 |             raise ConnectionError(f\"Error while reading from socket: {ex.args}\")","lines":12,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/socket.py#L79-L90"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"SocketBuffer.read adds 2 for the CRLF terminator and returns data[:-2], but if the underlying _read_from_socket cannot fully satisfy the request (e.g. on a non-raising path) 'data' may be shorter than length. data[:-2] on a too-short buffer silently drops bytes or returns wrong content rather than detecting truncation. The code assumes _read_from_socket always fills 'missing' bytes, but with raise_on_timeout defaulting True it raises TimeoutError, yet a returned-False path (custom callers) could yield a short read that is then mis-sliced.","fix":"After reading, assert/verify len(data) == length before slicing, and raise ConnectionError on short reads to avoid silently returning corrupted/truncated data.","locations":[{"ref":"redis/_parsers/socket.py:101-110","code":"  101 |     def read(self, length: int, timeout: Union[float, object] = SENTINEL) -> bytes:\n  102 |         length = length + 2  # make sure to read the \\r\\n terminator\n  103 |         # BufferIO will return less than requested if buffer is short\n  104 |         data = self._buffer.read(length)\n  105 |         missing = length - len(data)\n  106 |         if missing:\n  107 |             # fill up the buffer and read the remainder\n  108 |             self._read_from_socket(length=missing, timeout=timeout)\n  109 |             data += self._buffer.read(missing)\n  110 |         return data[:-2]","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/socket.py#L101-L110"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"PubSub.get_message() computes `block=(timeout is None)` and passes the same `timeout` through to parse_response(). When timeout is None, block=True and parse_response ignores timeout (blocks forever via math.inf) - correct. But the default timeout is 0.0, giving block=False, timeout=0.0, i.e. a true non-blocking poll - correct. The latent issue: get_message documents 'Timeout should be specified as None to wait indefinitely', but a caller passing timeout=0 (int) vs 0.0 behaves as non-blocking while None blocks; there is no way to request 'block with a finite timeout' through get_message because any non-None timeout sets block=False and a finite timeout, whereas block=True path discards the finite timeout. This makes finite-timeout blocking reads impossible and is easy to misuse.","fix":"Document explicitly that get_message supports only non-blocking-with-timeout or block-forever modes, or rework parse_response so block=True honors a finite timeout (currently math.inf hard-codes 'forever').","locations":[{"ref":"redis/asyncio/client.py:1455-1468","code":" 1455 |     async def get_message(\n 1456 |         self, ignore_subscribe_messages: bool = False, timeout: Optional[float] = 0.0\n 1457 |     ):\n 1458 |         \"\"\"\n 1459 |         Get the next message if one is available, otherwise None.\n 1460 | \n 1461 |         If timeout is specified, the system will wait for `timeout` seconds\n 1462 |         before returning. Timeout should be specified as a floating point\n 1463 |         number or None to wait indefinitely.\n 1464 |         \"\"\"\n 1465 |         response = await self.parse_response(block=(timeout is None), timeout=timeout)\n 1466 |         if response:\n 1467 |             return await self.handle_message(response, ignore_subscribe_messages)\n 1468 |         return None","lines":14,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/client.py#L1455-L1468"},{"ref":"redis/asyncio/client.py:1229-1306","code":" 1229 |     async def parse_response(self, block: bool = True, timeout: float = 0):\n 1230 |         \"\"\"\n 1231 |         Parse the response from a publish/subscribe command.\n 1232 | \n 1233 |         Args:\n 1234 |             block: If True, block indefinitely until a message is available.\n 1235 |                    If False, return immediately if no message is available.\n 1236 |                    Default: True\n 1237 |             timeout: The timeout in seconds for reading a response when block=False.\n 1238 |                      This parameter is ignored when block=True.\n 1239 |                      Default: 0 (return immediately if no data available)\n 1240 | \n 1241 |         Returns:\n 1242 |             The parsed response from the server, or None if no message is available\n 1243 |             within the timeout period (when block=False).\n 1244 | \n 1245 |         Important:\n 1246 |             The block and timeout parameters work together:\n 1247 |             - When block=True: timeout is IGNORED, method blocks indefinitely\n 1248 |             - When block=False: timeout is USED, method returns after timeout expires\n 1249 | \n 1250 |             Typically, you should use get_message(timeout=X) instead of calling\n 1251 |             parse_response() directly. The get_message() method automatically sets\n 1252 |             block=False when a timeout is provided, and block=True when timeout=None.\n 1253 | \n 1254 |         Example:\n 1255 |             # Block indefinitely (timeout is ignored)\n 1256 |             response = await pubsub.parse_response(block=True, timeout=0.1)\n 1257 | \n 1258 |             # Non-blocking with 0.1 second timeout\n 1259 |             response = await pubsub.parse_response(block=False, timeout=0.1)\n 1260 | \n 1261 |             # Non-blocking, return immediately\n 1262 |             response = await pubsub.parse_response(block=False, timeout=0)\n 1263 | \n 1264 |             # Recommended: use get_message() instead\n 1265 |             msg = await pubsub.get_message(timeout=0.1)  # automatically sets block=False\n 1266 |             msg = await pubsub.get_message(timeout=None)  # automatically sets block=True\n 1267 |         \"\"\"\n 1268 |         conn = self.connection\n 1269 |         if conn is None:\n 1270 |             raise RuntimeError(\n 1271 |                 \"pubsub connection not set: \"\n 1272 |                 \"did you forget to call subscribe() or psubscribe()?\"\n 1273 |             )\n 1274 | \n 1275 |         await self.check_health()\n 1276 | \n 1277 |         if not conn.is_connected:\n 1278 |             await conn.connect()\n 1279 | \n 1280 |         # Block=True: signal \"no timeout\" to conn.read_response via\n 1281 |         # math.inf. The connection treats math.inf as the per-read\n 1282 |         # opt-in for blocking indefinitely without falling back to\n 1283 |         # self.socket_timeout. Reconnect/AUTH/HELLO/resubscribe\n 1284 |         # operations performed by the retry layer continue to honor\n 1285 |         # self.socket_timeout because they do not pass math.inf.\n 1286 |         #\n 1287 |         # TODO(next-major): when the async Connection.read_response\n 1288 |         # default for ``timeout`` is changed to S
