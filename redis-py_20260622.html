in the subcommand branch. If the command exists but has no `subcommands` key in its parsed dict (parse_subcommand only sets it for rows of len>7), this raises KeyError; if the command is missing entirely, `.get()` returns None and indexing raises TypeError instead of the documented ValueError. The docstring promises a ValueError for the not-found case.","fix":"Check the command exists and has a 'subcommands' entry before iterating, raising ValueError otherwise, consistent with the docstring and the else-branch.","locations":[{"ref":"redis/_parsers/commands.py:240-247","code":"  240 |         if subcommand_name:\n  241 |             for subcommand in self.commands.get(command_name)[\"subcommands\"]:\n  242 |                 if str_if_bytes(subcommand[0]) == subcommand_name:\n  243 |                     parsed_subcmd = self.parse_subcommand(subcommand)\n  244 |                     return parsed_subcmd[\"first_key_pos\"] <= 0\n  245 |             raise ValueError(\n  246 |                 f\"Subcommand {subcommand_name} not found in command {command_name}\"\n  247 |             )","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/commands.py#L240-L247"},{"ref":"redis/_parsers/commands.py:537-544","code":"  537 |         if subcommand_name:\n  538 |             for subcommand in self.commands.get(command_name)[\"subcommands\"]:\n  539 |                 if str_if_bytes(subcommand[0]) == subcommand_name:\n  540 |                     parsed_subcmd = self.parse_subcommand(subcommand)\n  541 |                     return parsed_subcmd[\"first_key_pos\"] <= 0\n  542 |             raise ValueError(\n  543 |                 f\"Subcommand {subcommand_name} not found in command {command_name}\"\n  544 |             )","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/commands.py#L537-L544"}]},{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"`parse_xpending` (non-detail branch) indexes response[0..3] unconditionally and iterates `response[3] or []`. For a malformed/short XPENDING summary reply this raises IndexError. Minor, but it is one of several response_callbacks that assume exact shape without guarding length; combined with the fact a ResponseError instance can be returned in-band by the parser, callbacks generally trust positional structure.","fix":"Validate len(response) >= 4 (or wrap) before positional access, or rely on the command layer to guarantee shape.","locations":[{"ref":"redis/_parsers/helpers.py:854-863","code":"  854 | def parse_xpending(response, **options):\n  855 |     if options.get(\"parse_detail\", False):\n  856 |         return parse_xpending_range(response)\n  857 |     consumers = [{\"name\": n, \"pending\": int(p)} for n, p in response[3] or []]\n  858 |     return {\n  859 |         \"pending\": response[0],\n  860 |         \"min\": response[1],\n  861 |         \"max\": response[2],\n  862 |         \"consumers\": consumers,\n  863 |     }","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/helpers.py#L854-L863"}]},{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"get_random_primary_node() / get_random_node() call random.choice() on the result of get_primaries()/nodes_cache.values(). If the cluster currently has no primaries (e.g. transient state right after aclose() set default_node=None and before reinitialization, or all-replica view) random.choice([]) raises IndexError rather than a meaningful cluster exception, surfacing an opaque error from the keyless/random routing path.","fix":"Guard against an empty node list and raise RedisClusterException/SlotNotCoveredError (or trigger reinitialization) instead of letting random.choice raise IndexError.","locations":[{"ref":"redis/asyncio/cluster.py:684-686","code":"  684 |     def get_random_node(self) -> \"ClusterNode\":\n  685 |         \"\"\"Get a random node of the cluster.\"\"\"\n  686 |         return random.choice(list(self.nodes_manager.nodes_cache.values()))","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L684-L686"},{"ref":"redis/asyncio/cluster.py:749-753","code":"  749 |     def get_random_primary_node(self) -> \"ClusterNode\":\n  750 |         \"\"\"\n  751 |         Returns a random primary node\n  752 |         \"\"\"\n  753 |         return random.choice(self.get_primaries())","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L749-L753"}]},{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"Connection._connect() sets self._reader/self._writer BEFORE attempting to apply TCP keepalive options. If setsockopt raises (OSError/TypeError) it calls writer.close() and re-raises, but self._reader and self._writer remain assigned, so is_connected returns True for a connection whose transport was just closed. The disconnect()/retry path may then skip reconnect or operate on a closed writer. The sync mirror builds the socket and only assigns after success.","fix":"On the keepalive setsockopt failure path, reset self._reader = self._writer = None (or assign them only after keepalive setup succeeds) so is_connected reflects the closed transport.","locations":[{"ref":"redis/asyncio/connection.py:971-993","code":"  971 |     async def _connect(self):\n  972 |         \"\"\"Create a TCP socket connection\"\"\"\n  973 |         async with async_timeout(self.socket_connect_timeout):\n  974 |             reader, writer = await asyncio.open_connection(\n  975 |                 **self._connection_arguments()\n  976 |             )\n  977 |         self._reader = reader\n  978 |         self._writer = writer\n  979 |         sock = writer.transport.get_extra_info(\"socket\")\n  980 |         if sock:\n  981 |             sock.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)\n  982 |             try:\n  983 |                 # TCP_KEEPALIVE\n  984 |                 if self.socket_keepalive:\n  985 |                     sock.setsockopt(socket.SOL_SOCKET, socket.SO_KEEPALIVE, 1)\n  986 |                     for k, v in self.socket_keepalive_options.items():\n  987 |                         sock.setsockopt(socket.SOL_TCP, k, v)\n  988 | \n  989 |             except (OSError, TypeError):\n  990 |                 # `socket_keepalive_options` might contain invalid options\n  991 |                 # causing an error. Do not leave the connection open.\n  992 |                 writer.close()\n  993 |                 raise","lines":23,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L971-L993"}]},{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"Async aclose() awaits health_check_policy.close() and active client aclose() after cancelling tasks but does not await the cancelled tasks, so cancellation may not have propagated. _recurring_hc_task / _half_open_state_task / _hc_tasks are .cancel()'d but never awaited; pending health-check tasks may still hold/clean up connection pools concurrently with _health_check_policy.close(), and 'Task was destroyed but it is pending' warnings can appear. The sync close() relies on BackgroundScheduler.stop() which at least signals the loops to stop.","fix":"After cancelling, await the tasks with asyncio.gather(..., return_exceptions=True) before closing the health-check policy and the active client.","locations":[{"ref":"redis/asyncio/multidb/client.py:90-104","code":"   90 |     async def aclose(self):\n   91 |         # Cancel background tasks\n   92 |         if self._recurring_hc_task:\n   93 |             self._recurring_hc_task.cancel()\n   94 |         if self._half_open_state_task:\n   95 |             self._half_open_state_task.cancel()\n   96 |         for hc_task in self._hc_tasks:\n   97 |             hc_task.cancel()\n   98 | \n   99 |         # Close health check connection pools\n  100 |         await self._health_check_policy.close()\n  101 | \n  102 |         # Close database client\n  103 |         if self.command_executor.active_database:\n  104 |             await self.command_executor.active_database.client.aclose()","lines":15,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/client.py#L90-L104"}]},{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"Sentinel.execute_command gathers tasks with asyncio.gather(*tasks) without return_exceptions=True. If one sentinel raises (and the error is not one of the caught ConnectionError/TimeoutError types - e.g. any other exception), gather propagates the first exception while the other tasks are left running/un-awaited, producing 'Task was destroyed but it is pending' / 'exception was never retrieved' warnings and leaking the in-flight commands. The fan-out command path is meant to tolerate individual sentinel failures.","fix":"Either gather with return_exceptions=True and aggregate, or wrap gather in try/finally that cancels and awaits remaining tasks on failure.","locations":[{"ref":"redis/asyncio/sentinel.py:244-253","code":"  244 |         tasks = [\n  245 |             asyncio.Task(sentinel.execute_command(*args, **kwargs))\n  246 |             for sentinel in self.sentinels\n  247 |         ]\n  248 |         responses = await asyncio.gather(*tasks)\n  249 | \n  250 |         if return_responses:\n  251 |             return responses\n  252 | \n  253 |         return all(responses)","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/sentinel.py#L244-L253"}]},{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"TokenManager.__del__ calls self.stop(), but stop() accesses self._init_timer/self._next_timer. If __init__ raised before those attributes were set (e.g. partway), __del__ -> stop() would raise AttributeError during garbage collection. More practically, __del__ logging 'Token manager are disposed' (grammatically wrong) runs at interpreter shutdown when asyncio internals may already be torn down, and cancelling a timer whose loop is gone can raise. Relying on __del__ for resource cleanup of event-loop timers is fragile.","fix":"Make stop() defensive (getattr with None default) and avoid relying on __del__ for loop/timer teardown; fix the log message grammar to 'Token manager is disposed'.","locations":[{"ref":"redis/auth/token_manager.py:132-134","code":"  132 |     def __del__(self):\n  133 |         logger.info(\"Token manager are disposed\")\n  134 |         self.stop()","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/auth/token_manager.py#L132-L134"},{"ref":"redis/auth/token_manager.py:208-212","code":"  208 |     def stop(self):\n  209 |         if self._init_timer is not None:\n  210 |             self._init_timer.cancel()\n  211 |         if self._next_timer is not None:\n  212 |             self._next_timer.cancel()","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/auth/token_manager.py#L208-L212"}]},{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"PubSub.parse_response decrements self.health_check_response_counter when a health-check response is observed, but does not floor it at zero. Combined with clean_health_check_responses (which can also decrement) and the resets to 0 in subscribe/psubscribe/ssubscribe, the counter can be driven negative or out of sync, which then makes `health_check_response_counter > 0` checks behave incorrectly (skip draining).","fix":"Clamp decrements with max(0, counter - 1) or centralize counter bookkeeping in one place.","locations":[{"ref":"redis/client.py:1269-1272","code":" 1269 |         if self.is_health_check_response(response):\n 1270 |             # ignore the health check message as user might not expect it\n 1271 |             self.health_check_response_counter -= 1\n 1272 |             return None","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L1269-L1272"},{"ref":"redis/client.py:1102-1118","code":" 1102 |     def clean_health_check_responses(self) -> None:\n 1103 |         \"\"\"\n 1104 |         If any health check responses are present, clean them\n 1105 |         \"\"\"\n 1106 |         ttl = 10\n 1107 |         conn = self.connection\n 1108 |         while conn and self.health_check_response_counter > 0 and ttl > 0:\n 1109 |             if self._execute(conn, conn.can_read, timeout=conn.socket_timeout):\n 1110 |                 response = self._execute(conn, conn.read_response)\n 1111 |                 if self.is_health_check_response(response):\n 1112 |                     self.health_check_response_counter -= 1\n 1113 |                 else:\n 1114 |                     raise PubSubError(\n 1115 |                         \"A non health check response was cleaned by \"\n 1116 |                         \"execute_command: {}\".format(response)\n 1117 |                     )\n 1118 |             ttl -= 1","lines":17,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L1102-L1118"}]},{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"PubSubWorkerThread.run catches BaseException (including KeyboardInterrupt/SystemExit/GeneratorExit) and routes it to exception_handler instead of letting it terminate the thread/process. If exception_handler does not re-raise, KeyboardInterrupt is swallowed and the loop continues, making the worker thread effectively un-interruptible from within.","fix":"Catch Exception rather than BaseException, or explicitly re-raise KeyboardInterrupt/SystemExit before delegating to exception_handler.","locations":[{"ref":"redis/client.py:1641-1654","code":" 1641 |         while self._running.is_set():\n 1642 |             try:\n 1643 |                 if not self.sharded_pubsub:\n 1644 |                     pubsub.get_message(\n 1645 |                         ignore_subscribe_messages=True, timeout=sleep_time\n 1646 |                     )\n 1647 |                 else:\n 1648 |                     pubsub.get_sharded_message(\n 1649 |                         ignore_subscribe_messages=True, timeout=sleep_time\n 1650 |                     )\n 1651 |             except BaseException as e:\n 1652 |                 if self.exception_handler is None:\n 1653 |                     raise\n 1654 |                 self.exception_handler(e, pubsub, self)","lines":14,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L1641-L1654"}]},{"id":"ERR_25","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"get_connection (module function, line 115) returns `redis_node.connection or redis_node.connection_pool.get_connection()` but the deprecated_args decorator only allows `redis_node`. Callers in this file invoke it as `get_connection(redis_node)`. When `redis_node.connection` is a falsy-but-present sentinel it would be bypassed, but more importantly the function silently returns a pooled connection that the caller is responsible for releasing; the single-connection `redis_node.connection` branch returns a connection that must NOT be released to the pool, yet _execute_command's finally block unconditionally calls `redis_node.connection_pool.release(connection)` (line 1887). If a node ever has a standalone `connection` set, that connection would be wrongly released into the pool.","fix":"Either guarantee cluster nodes never use the single `connection` attribute, or track in _execute_command whether the connection came from the pool and only release pooled connections.","locations":[{"ref":"redis/cluster.py:115-116","code":"  115 | def get_connection(redis_node: Redis, *args, **options) -> Connection:\n  116 |     return redis_node.connection or redis_node.connection_pool.get_connection()","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L115-L116"},{"ref":"redis/cluster.py:1885-1887","code":" 1885 |             finally:\n 1886 |                 if connection is not None:\n 1887 |                     redis_node.connection_pool.release(connection)","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L1885-L1887"}]},{"id":"ERR_26","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"ClusterNode.__init__ performs a blocking DNS resolution (socket.gethostbyname) for host == 'localhost' (line 2024-2025), and NodesManager.get_node does the same (line 2181-2182). These calls happen while holding no timeout and, for get_node, can be reached on the command hot path. A slow or misconfigured resolver blocks the calling thread indefinitely, and any resolution failure raises socket.gaierror (not a RedisError), which is not caught by the cluster retry layer. This couples node identity to DNS at construction time and can surface as an unexpected, non-retryable exception.","fix":"Resolve localhost once at a well-defined point with error handling, or avoid forcing resolution of 'localhost' in the hot path; at minimum wrap gethostbyname so failures map to a RedisClusterException/ConnectionError.","locations":[{"ref":"redis/cluster.py:2023-2025","code":" 2023 |     def __init__(self, host, port, server_type=None, redis_connection=None):\n 2024 |         if host == \"localhost\":\n 2025 |             host = socket.gethostbyname(host)","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L2023-L2025"},{"ref":"redis/cluster.py:2179-2184","code":" 2179 |         if host and port:\n 2180 |             # the user passed host and port\n 2181 |             if host == \"localhost\":\n 2182 |                 host = socket.gethostbyname(host)\n 2183 |             with self._lock:\n 2184 |                 return self.nodes_cache.get(get_node_name(host=host, port=port))","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L2179-L2184"}]},{"id":"ERR_27","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In initialize(), cluster_slots may be referenced before assignment if the first startup node connection succeeds at the redis_connection level but CLUSTER SLOTS itself is reached via a node whose `r.execute_command('CLUSTER SLOTS')` succeeds while a later block references `cluster_slots`. More concretely: the variable `cluster_slots` is assigned inside the try at line 2554; if `startup_node.redis_connection` already existed and the inner try succeeds, fine - but the slot-parsing code at line 2581+ runs unconditionally after the except/continue, relying on cluster_slots being set. If `disconnect_startup_nodes_pools` cleanup or any code between assignment and use raised and were caught upstream, cluster_slots would be stale from a previous iteration. The reachability is narrow but the variable lifetime spanning the per-node try/except is fragile.","fix":"Scope cluster_slots strictly to the current iteration (initialize to None at loop top and guard the parsing block), so a stale value from a previous startup node can never be parsed.","locations":[{"ref":"redis/cluster.py:2552-2586","code":" 2552 |                     try:\n 2553 |                         # Make sure cluster mode is enabled on this node\n 2554 |                         cluster_slots = str_if_bytes(r.execute_command(\"CLUSTER SLOTS\"))\n 2555 |                         if disconnect_startup_nodes_pools:\n 2556 |                             with r.connection_pool._lock:\n 2557 |                                 # take care to clear connections before we move on\n 2558 |                                 # mark all active connections for reconnect - they will be\n 2559 |                                 # reconnected on next use, but will allow current in flight commands to complete first\n 2560 |                                 r.connection_pool.update_active_connections_for_reconnect()\n 2561 |                                 # Needed to clear READONLY state when it is no longer applicable\n 2562 |                                 r.connection_pool.disconnect_free_connections()\n 2563 |                     except ResponseError:\n 2564 |                         raise RedisClusterException(\n 2565 |                             \"Cluster mode is not enabled on this node\"\n 2566 |                         )\n 2567 |                     startup_nodes_reachable = True\n 2568 |                 except Exception as e:\n 2569 |                     # Try the next startup node.\n 2570 |                     # The exception is saved and raised only if we have no more nodes.\n 2571 |                     exception = e\n 2572 |                     continue\n 2573 | \n 2574 |                 # CLUSTER SLOTS command results in the following output:\n 2575 |                 # [[slot_section[from_slot,to_slot,master,replica1,...,replicaN]]]\n 2576 |                 # where each node contains the following list: [IP, port, node_id]\n 2577 |                 # Therefore, cluster_slots[0][2][0] will be the IP address of the\n 2578 |                 # primary node of the first slot section.\n 2579 |                 # If there's only one server in the cluster, its ``host`` is ''\n 2580 |                 # Fix it to the host in startup_nodes\n 2581 |                 if (\n 2582 |                     len(cluster_slots) == 1\n 2583 |                     and len(cluster_slots[0][2][0]) == 0\n 2584 |                     and len(self.startup_nodes) == 1\n 2585 |                 ):\n 2586 |                     cluster_slots[0][2][0] = startup_node.host","lines":35,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L2552-L2586"}]},{"id":"ERR_28","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":true,"description":"In client_pause the args list (which contains str(timeout)) is built before the type validation runs. If timeout is not an int, str(timeout) has already been computed and placed into args, then the DataError is raised - but more importantly the validation is dead-weight ordering: the guard should run before constructing the command. As written str(timeout) on a non-int (e.g. a float or str) silently succeeds at list-construction time and the only thing that catches it is the isinstance check on the next line. The ordering is backwards and brittle; the str() conversion of a bad value happens before validation.","fix":"Validate `isinstance(timeout, int)` first, then build `args = ['CLIENT PAUSE', str(timeout)]`.","locations":[{"ref":"redis/commands/core.py:1232-1237","code":" 1232 |         args = [\"CLIENT PAUSE\", str(timeout)]\n 1233 |         if not isinstance(timeout, int):\n 1234 |             raise DataError(\"CLIENT PAUSE timeout must be an integer\")\n 1235 |         if not all:\n 1236 |             args.append(\"WRITE\")\n 1237 |         return self.execute_command(*args, **kwargs)","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L1232-L1237"}]},{"id":"ERR_29","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In xautoclaim, the count validation reuses the wrong command name in its error: `raise DataError('XPENDING count must be a integer >= 0')` inside XAUTOCLAIM. Copy-paste leftover from xpending_range; the message should reference XAUTOCLAIM. Also both use the grammatically-off 'must be a integer'.","fix":"Change the message to reference XAUTOCLAIM (e.g. 'XAUTOCLAIM count must be an integer >= 0').","locations":[{"ref":"redis/commands/core.py:6988-6990","code":" 6988 |         try:\n 6989 |             if int(count) < 0:\n 6990 |                 raise DataError(\"XPENDING count must be a integer >= 0\")","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L6988-L6990"}]},{"id":"ERR_30","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"xnack validates retrycount with `if retrycount < 0` but does not check isinstance(retrycount, int), unlike xclaim which validates `not isinstance(retrycount, int)`. A non-int, non-None retrycount (e.g. a string) would either raise an opaque TypeError on the comparison or be sent raw to the server. Inconsistent validation between sibling stream commands.","fix":"Add an isinstance(retrycount, int) check matching xclaim, raising a clear DataError.","locations":[{"ref":"redis/commands/core.py:7473-7476","code":" 7473 |         if retrycount is not None:\n 7474 |             if retrycount < 0:\n 7475 |                 raise DataError(\"XNACK retrycount must be >= 0\")\n 7476 |             pieces.extend([b\"RETRYCOUNT\", retrycount])","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L7473-L7476"},{"ref":"redis/commands/core.py:7097-7100","code":" 7097 |         if retrycount is not None:\n 7098 |             if not isinstance(retrycount, int):\n 7099 |                 raise DataError(\"XCLAIM retrycount must be an integer\")\n 7100 |             pieces.extend((b\"RETRYCOUNT\", str(retrycount)))","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L7097-L7100"}]},{"id":"ERR_31","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"get_protocol_version returns None implicitly when the client is neither a Redis nor an AbstractRedisCluster (no else / no default), whereas the sibling get_legacy_responses explicitly returns True for the same fall-through. Callers that pair these two (the docstring says they mirror each other) get an inconsistent default: a None protocol but a True legacy flag for an unrecognized client type, which can route through apply_module_callbacks' `user_protocol is None` branch unexpectedly.","fix":"Make get_protocol_version return an explicit default for unrecognized client types to match get_legacy_responses, or document the asymmetry.","locations":[{"ref":"redis/commands/helpers.py:128-147","code":"  128 | def get_protocol_version(client):\n  129 |     if isinstance(client, redis.Redis) or isinstance(client, redis.asyncio.Redis):\n  130 |         return client.connection_pool.connection_kwargs.get(\"protocol\")\n  131 |     elif isinstance(client, redis.cluster.AbstractRedisCluster):\n  132 |         return client.nodes_manager.connection_kwargs.get(\"protocol\")\n  133 | \n  134 | \n  135 | def get_legacy_responses(client):\n  136 |     \"\"\"Return the user-supplied ``legacy_responses`` flag for ``client``.\n  137 | \n  138 |     Defaults to ``True`` when the flag is not present in the client's\n  139 |     ``connection_kwargs``. Mirrors :func:`get_protocol_version` so module\n  140 |     command bases can read both the protocol and the response-shape\n  141 |     selection from the same place.\n  142 |     \"\"\"\n  143 |     if isinstance(client, redis.Redis) or isinstance(client, redis.asyncio.Redis):\n  144 |         return client.connection_pool.connection_kwargs.get(\"legacy_responses\", True)\n  145 |     elif isinstance(client, redis.cluster.AbstractRedisCluster):\n  146 |         return client.nodes_manager.connection_kwargs.get(\"legacy_responses\", True)\n  147 |     return True","lines":20,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/helpers.py#L128-L147"}]},{"id":"ERR_32","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"`_parse_spellcheck` (RESP2 legacy) guards with `if res == 0: return corrections`, but FT.SPELLCHECK never returns the integer 0 (it returns a list); meanwhile the inner loop also tolerates `isinstance(_correction, int) and _correction == 0`. This dead/incorrect sentinel handling does not match the actual protocol and obscures the parser's contract. If `res` is unexpectedly None it would still raise TypeError rather than be handled.","fix":"Remove the int-0 sentinel checks and handle the real empty case (`if not res: return corrections`), so None/empty responses are handled uniformly.","locations":[{"ref":"redis/commands/search/commands.py:312-319","code":"  312 |     def _parse_spellcheck(self, res, **kwargs):\n  313 |         corrections = {}\n  314 |         if res == 0:\n  315 |             return corrections\n  316 | \n  317 |         for _correction in res:\n  318 |             if isinstance(_correction, int) and _correction == 0:\n  319 |                 continue","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/search/commands.py#L312-L319"}]},{"id":"ERR_33","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"timeseries.utils.list_to_dict assumes every element of aList is an indexable 2-tuple/pair (`aList[i][0]`, `aList[i][1]`). It is fed TSInfo labels and m_get/m_range label lists. If the labels arrive as a flat alternating list (as TS.MGET WITHLABELS can on some wire shapes) rather than a list of pairs, this raises IndexError/TypeError instead of a clear error. The companion _pairs_to_dict has the same assumption.","fix":"Validate the element shape or document the required nested-pair input; consider handling the flat-alternating-list form defensively.","locations":[{"ref":"redis/commands/timeseries/utils.py:4-10","code":"    4 | def list_to_dict(aList):\n    5 |     return {nativestr(aList[i][0]): nativestr(aList[i][1]) for i in range(len(aList))}\n    6 | \n    7 | \n    8 | def _pairs_to_dict(pairs):\n    9 |     \"\"\"Convert a list of [key, value] pairs to a dict without forcing str.\"\"\"\n   10 |     return {pairs[i][0]: pairs[i][1] for i in range(len(pairs))}","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/timeseries/utils.py#L4-L10"}]},{"id":"ERR_34","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"HiredisRespSerializer.pack indexes args[0] (lines 129-131) without checking that args is non-empty. Calling pack() with no arguments raises IndexError instead of a meaningful DataError/ValueError. PythonRespSerializer.pack has the identical issue. Empty command packing is a programming error, but the exception type is misleading.","fix":"Add an explicit guard raising DataError when not args, before indexing args[0].","locations":[{"ref":"redis/connection.py:129-132","code":"  129 |         if isinstance(args[0], str):\n  130 |             args = tuple(args[0].encode().split()) + args[1:]\n  131 |         elif b\" \" in args[0]:\n  132 |             args = tuple(args[0].split()) + args[1:]","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L129-L132"},{"ref":"redis/connection.py:159-162","code":"  159 |         if isinstance(args[0], str):\n  160 |             args = tuple(args[0].encode().split()) + args[1:]\n  161 |         elif b\" \" in args[0]:\n  162 |             args = tuple(args[0].split()) + args[1:]","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L159-L162"}]},{"id":"ERR_35","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"_enable_maintenance_notifications swallows only ResponseError when config.enabled == 'auto', but other transient errors during the handshake (e.g. ConnectionError, TimeoutError on send_command/read_response) are re-raised and will fail the entire connection even in 'auto' mode, where the intent is best-effort. A flaky network during the MAINT_NOTIFICATIONS handshake therefore breaks connection establishment despite 'auto' being meant to degrade gracefully.","fix":"In 'auto' mode, also catch (ConnectionError, TimeoutError) and log+continue, only re-raising when enabled is strictly True.","locations":[{"ref":"redis/connection.py:640-651","code":"  640 |         except Exception as e:\n  641 |             if (\n  642 |                 isinstance(e, ResponseError)\n  643 |                 and maint_notifications_config.enabled == \"auto\"\n  644 |             ):\n  645 |                 # Log warning but don't fail the connection\n  646 |                 import logging\n  647 | \n  648 |                 logger = logging.getLogger(__name__)\n  649 |                 logger.debug(f\"Failed to enable maintenance notifications: {e}\")\n  650 |             else:\n  651 |                 raise","lines":12,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L640-L651"}]},{"id":"ERR_36","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In on_connect_check_health, the HELLO-with-AUTH branch reads the handshake response but the RESP-version validation is fully commented out (lines 1124-1127), while the non-auth HELLO branch (1155-1159) does validate the negotiated proto. This is an inconsistency: when authenticating via HELLO the client never verifies the server actually honored the requested protocol version, so a server downgrade goes undetected on the auth path only.","fix":"Either enable equivalent proto validation for the HELLO+AUTH branch (matching lines 1155-1159) or remove the dead commented block and document why validation is skipped for that path.","locations":[{"ref":"redis/connection.py:1123-1127","code":" 1123 |             self.handshake_metadata = self.read_response()\n 1124 |             # if response.get(b\"proto\") != self.protocol and response.get(\n 1125 |             #     \"proto\"\n 1126 |             # ) != self.protocol:\n 1127 |             #     raise ConnectionError(\"Invalid RESP version\")","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L1123-L1127"}]},{"id":"ERR_37","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"ConnectionPool.re_auth_callback builds closures inside a for-loop that capture the loop variable 'conn' by reference (late binding): 'lambda: conn.send_command(...)' and 'lambda: conn.read_response()'. Because retry.call_with_retry invokes the lambda immediately within the same iteration, this happens to work, but it is a fragile late-binding-closure pattern that breaks the moment the call is deferred. Same anti-pattern, easy to regress.","fix":"Bind conn explicitly as a default argument in the lambdas (lambda c=conn: c.send_command(...)) to avoid late-binding surprises.","locations":[{"ref":"redis/connection.py:3307-3318","code":" 3307 |     def re_auth_callback(self, token: TokenInterface):\n 3308 |         with self._lock:\n 3309 |             for conn in self._available_connections:\n 3310 |                 conn.retry.call_with_retry(\n 3311 |                     lambda: conn.send_command(\n 3312 |                         \"AUTH\", token.try_get(\"oid\"), token.get_value()\n 3313 |                     ),\n 3314 |                     lambda error: self._mock(error),\n 3315 |                 )\n 3316 |                 conn.retry.call_with_retry(\n 3317 |                     lambda: conn.read_response(), lambda error: self._mock(error)\n 3318 |                 )","lines":12,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L3307-L3318"}]},{"id":"ERR_38","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In BlockingConnectionPool.get_connection, the 'except Empty' branch (lines 3571-3574) contains a comment that is truncated mid-sentence ('If you want never to') and then raises ConnectionError. Beyond the dangling comment, the connection-readiness retry block (3613-3620) lacks the cache/maint-notifications guard that the base ConnectionPool.get_connection has (3169-3173), so for a blocking pool with client-side caching or maintenance notifications enabled, a connection legitimately holding buffered push data is wrongly treated as 'has data' and forced to reconnect.","fix":"Mirror the base pool's guard: only raise 'Connection has data' when self.cache is None and not self.maint_notifications_enabled(). Fix the truncated comment.","locations":[{"ref":"redis/connection.py:3571-3574","code":" 3571 |             except Empty:\n 3572 |                 # Note that this is not caught by the redis client and will be\n 3573 |                 # raised unless handled by application code. If you want never to\n 3574 |                 raise ConnectionError(\"No connection available.\")","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L3571-L3574"},{"ref":"redis/connection.py:3613-3620","code":" 3613 |             try:\n 3614 |                 if connection.can_read():\n 3615 |                     raise ConnectionError(\"Connection has data\")\n 3616 |             except (ConnectionError, TimeoutError, OSError):\n 3617 |                 connection.disconnect()\n 3618 |                 connection.connect()\n 3619 |                 if connection.can_read():\n 3620 |                     raise ConnectionError(\"Connection not ready\")","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L3613-L3620"}]},{"id":"ERR_39","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"HttpClient.request: when verify_tls is False it creates a default context and disables hostname checking and verification (CERT_NONE). This is an intentional opt-out, but the default-constructed HttpClient used by auth flows relies on the caller passing verify_tls; there is no warning logged when TLS verification is disabled, making accidental insecure usage (e.g. verify_tls=False in production) silent. Tokens/credentials transit this client.","fix":"Emit a warning (logging.warning or warnings.warn) when verify_tls is False so disabling certificate verification is not silent, given this client carries auth material.","locations":[{"ref":"redis/http/http_client.py:257-277","code":"  257 |         context: Optional[ssl.SSLContext] = None\n  258 |         if url.lower().startswith(\"https\"):\n  259 |             if self.verify_tls:\n  260 |                 # Use provided CA material if any; fall back to system defaults\n  261 |                 context = ssl.create_default_context(\n  262 |                     cafile=self.ca_file,\n  263 |                     capath=self.ca_path,\n  264 |                     cadata=self.ca_data,\n  265 |                 )\n  266 |                 # Load client certificate for mTLS if configured\n  267 |                 if self.client_cert_file:\n  268 |                     context.load_cert_chain(\n  269 |                         certfile=self.client_cert_file,\n  270 |                         keyfile=self.client_key_file,\n  271 |                         password=self.client_key_password,\n  272 |                     )\n  273 |             else:\n  274 |                 # Verification disabled\n  275 |                 context = ssl.create_default_context()\n  276 |                 context.check_hostname = False\n  277 |                 context.verify_mode = ssl.CERT_NONE","lines":21,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/http/http_client.py#L257-L277"}]},{"id":"ERR_40","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"HttpClient._json_call raises HttpError for any status outside 200-399 using resp.text() as the message, which includes the full response body. For auth endpoints this body can contain error detail including sensitive tokens or credentials, which then propagates into exception messages/logs/tracebacks. Combined with the retry layer, error bodies are read and surfaced verbatim.","fix":"Avoid embedding the raw response body in the exception message for auth flows, or truncate/redact it; expose the body via a separate attribute the caller can opt into logging.","locations":[{"ref":"redis/http/http_client.py:346-350","code":"  346 |         if not (200 <= resp.status < 400):\n  347 |             raise HttpError(resp.status, resp.url, resp.text())\n  348 |         if expect_json:\n  349 |             return resp.json()\n  350 |         return resp","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/http/http_client.py#L346-L350"}]},{"id":"ERR_41","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":true,"description":"add_debug_log_for_notification computes socket_address as connection._sock.getsockname() then indexes [1] (the port) assuming an AF_INET/AF_INET6 tuple. For AF_UNIX sockets getsockname() returns a path string, so socket_address[1] would be the second character of the path rather than a port. The except clause only catches AttributeError/OSError, not IndexError/TypeError, so a non-tuple result could raise inside a debug-logging helper.","fix":"Guard the [1] index (check isinstance tuple / length) or broaden the except to include TypeError/IndexError so debug logging can never raise.","locations":[{"ref":"redis/maint_notifications.py:591-609","code":"  591 | def add_debug_log_for_notification(\n  592 |     connection: \"MaintNotificationsAbstractConnection\",\n  593 |     notification: Union[str, MaintenanceNotification],\n  594 | ):\n  595 |     if logger.isEnabledFor(logging.DEBUG):\n  596 |         socket_address = None\n  597 |         try:\n  598 |             socket_address = (\n  599 |                 connection._sock.getsockname() if connection._sock else None\n  600 |             )\n  601 |             socket_address = socket_address[1] if socket_address else None\n  602 |         except (AttributeError, OSError):\n  603 |             pass\n  604 | \n  605 |         logger.debug(\n  606 |             f\"Handling maintenance notification: {notification}, \"\n  607 |             f\"with connection: {connection}, connected to ip {connection.get_resolved_ip()}, \"\n  608 |             f\"local socket port: {socket_address}\",\n  609 |         )","lines":19,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/maint_notifications.py#L591-L609"}]},{"id":"ERR_42","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"OCSP _verify_response raises ConnectionError('failed to valid ocsp response') - grammatically broken message ('failed to valid') that will appear in user-facing connection errors during TLS/OCSP validation, making diagnosis harder.","fix":"Fix the message to e.g. 'failed to validate ocsp response signature'.","locations":[{"ref":"redis/ocsp.py:46-47","code":"   46 |     except InvalidSignature:\n   47 |         raise ConnectionError(\"failed to valid ocsp response\")","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/ocsp.py#L46-L47"}]},{"id":"ERR_43","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"extract_expire_flags uses elif chaining for ex/px/exat/pxat, so if a caller passes more than one of them only the first (in ex>px>exat>pxat priority) is honored and the others are silently ignored rather than raising. A user setting both ex and px would expect an error or both flags; instead px is dropped silently.","fix":"Validate that at most one of ex/px/exat/pxat is provided and raise DataError otherwise, or document the silent precedence.","locations":[{"ref":"redis/utils.py:358-392","code":"  358 | def extract_expire_flags(\n  359 |     ex: Optional[ExpiryT] = None,\n  360 |     px: Optional[ExpiryT] = None,\n  361 |     exat: Optional[AbsExpiryT] = None,\n  362 |     pxat: Optional[AbsExpiryT] = None,\n  363 | ) -> List[EncodableT]:\n  364 |     exp_options: list[EncodableT] = []\n  365 |     if ex is not None:\n  366 |         exp_options.append(\"EX\")\n  367 |         if isinstance(ex, datetime.timedelta):\n  368 |             exp_options.append(int(ex.total_seconds()))\n  369 |         elif isinstance(ex, int):\n  370 |             exp_options.append(ex)\n  371 |         elif isinstance(ex, str) and ex.isdigit():\n  372 |             exp_options.append(int(ex))\n  373 |         else:\n  374 |             raise DataError(\"ex must be datetime.timedelta or int\")\n  375 |     elif px is not None:\n  376 |         exp_options.append(\"PX\")\n  377 |         if isinstance(px, datetime.timedelta):\n  378 |             exp_options.append(int(px.total_seconds() * 1000))\n  379 |         elif isinstance(px, int):\n  380 |             exp_options.append(px)\n  381 |         else:\n  382 |             raise DataError(\"px must be datetime.timedelta or int\")\n  383 |     elif exat is not None:\n  384 |         if isinstance(exat, datetime.datetime):\n  385 |             exat = int(exat.timestamp())\n  386 |         exp_options.extend([\"EXAT\", exat])\n  387 |     elif pxat is not None:\n  388 |         if isinstance(pxat, datetime.datetime):\n  389 |             pxat = int(pxat.timestamp() * 1000)\n  390 |         exp_options.extend([\"PXAT\", pxat])\n  391 | \n  392 |     return exp_options","lines":35,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/utils.py#L358-L392"}]},{"id":"ERR_44","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","easy":true,"description":"restore() raises DataError('idletimemust be an integer') - missing space between 'idletime' and 'must'. Cosmetic but user-facing error string typo.","fix":"Fix the message to 'idletime must be an integer'.","locations":[{"ref":"redis/commands/core.py:4137-4138","code":" 4137 |             except ValueError:\n 4138 |                 raise DataError(\"idletimemust be an integer\")","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L4137-L4138"}]},{"id":"ERR_45","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","easy":true,"description":"zadd raises DataError(\"Only one of 'nx', 'lt', or 'gr' may be defined.\") - typo 'gr' should be 'gt'. The check is `if nx and (gt or lt)`, so the message wrongly references 'gr'.","fix":"Change 'gr' to 'gt' in the error message.","locations":[{"ref":"redis/commands/core.py:8023-8024","code":" 8023 |         if nx and (gt or lt):\n 8024 |             raise DataError(\"Only one of 'nx', 'lt', or 'gr' may be defined.\")","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L8023-L8024"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":false,"description":"NodesManager.move_node_to_end_of_cached_nodes mutates shared state without holding the lock. The method pops and re-inserts entries in both self.startup_nodes and self.nodes_cache (lines 2333-2341), but, unlike most other NodesManager methods, it does not acquire self._lock. It is called from _execute_command's ConnectionError/TimeoutError handler (line 1742) concurrently with initialize() (which replaces nodes_cache/startup_nodes wholesale under the lock) and with get_nodes/get_node iterating those dicts. Mutating a dict during another thread's iteration raises `RuntimeError: dictionary changed size during iteration`, and the pop/re-insert can also race with initialize()'s assignment.","fix":"Wrap the body of move_node_to_end_of_cached_nodes in `with self._lock:` to match the locking discipline used by the other nodes_cache/startup_nodes mutators.","locations":[{"ref":"redis/cluster.py:2326-2341","code":" 2326 |     def move_node_to_end_of_cached_nodes(self, node_name: str) -> None:\n 2327 |         \"\"\"\n 2328 |         Move a failing node to the end of startup_nodes and nodes_cache so it's\n 2329 |         tried last during reinitialization and when selecting the default node.\n 2330 |         If the node is not in the respective list, nothing is done.\n 2331 |         \"\"\"\n 2332 |         # Move in startup_nodes\n 2333 |         if node_name in self.startup_nodes and len(self.startup_nodes) > 1:\n 2334 |             node = self.startup_nodes.pop(node_name)\n 2335 |             self.startup_nodes[node_name] = node  # Re-insert at end\n 2336 | \n 2337 |         # Move in nodes_cache - this affects get_nodes_by_server_type ordering\n 2338 |         # which is used to select the default_node during initialize()\n 2339 |         if node_name in self.nodes_cache and len(self.nodes_cache) > 1:\n 2340 |             node = self.nodes_cache.pop(node_name)\n 2341 |             self.nodes_cache[node_name] = node  # Re-insert at end","lines":16,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L2326-L2341"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":false,"description":"JSON.get wraps execute_command in `try/except TypeError` to convert a decode failure on a missing key into `None`. For the async client (AsyncJSON), execute_command is a coroutine and returns immediately without running the response callback, so the decode-time TypeError is raised only when the coroutine is awaited, outside this try block. The fallback-to-None behaviour therefore silently does not work for async, breaking sync/async parity for missing keys.","fix":"Handle the missing-key case in the response callback (_decode already returns obj unchanged when obj is None) rather than catching TypeError around execute_command, or override get() in AsyncJSON to await and catch TypeError.","locations":[{"ref":"redis/commands/json/commands.py:430-435","code":"  430 |         # Handle case where key doesn't exist. The JSONDecoder would raise a\n  431 |         # TypeError exception since it can't decode None\n  432 |         try:\n  433 |             return self.execute_command(\"JSON.GET\", *pieces, keys=[name])\n  434 |         except TypeError:\n  435 |             return None","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/json/commands.py#L430-L435"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":true,"description":"`IndexDefinition.__init__` uses a mutable default argument `prefix=[]`. While the current code does not append to this exact object (it rebuilds via `list_or_args`), a shared mutable default is a latent bug and a code smell; any future change that mutates `prefix` in place would leak state across instances.","fix":"Use `prefix=None` and initialise `prefix = [] if prefix is None else prefix` inside the body.","locations":[{"ref":"redis/commands/search/index_definition.py:17-19","code":"   17 |     def __init__(\n   18 |         self,\n   19 |         prefix=[],","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/search/index_definition.py#L17-L19"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":false,"description":"AsyncSentinelCommands.sentinel is declared `async def` but its body calls the synchronous super().sentinel(*args), which only issues a DeprecationWarning and returns None (it never returns or awaits anything). The async override therefore returns a coroutine that resolves to None and emits the warning; it does not behave like the other async sentinel_* methods (which return awaitables from execute_command). The override exists solely to change the signature to a coroutine, which is misleading since the base method does no I/O.","fix":"Either drop the async override entirely (the warning-only base method is sync and harmless) or make it consistent. As written the `async def` adds no value and produces a coroutine that must be awaited just to get a warning.","locations":[{"ref":"redis/commands/sentinel.py:255-258","code":"  255 | class AsyncSentinelCommands(SentinelCommands):\n  256 |     async def sentinel(self, *args) -> None:\n  257 |         \"\"\"Redis Sentinel's SENTINEL command.\"\"\"\n  258 |         super().sentinel(*args)","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/sentinel.py#L255-L258"},{"ref":"redis/commands/sentinel.py:18-20","code":"   18 |     def sentinel(self, *args):\n   19 |         \"\"\"Redis Sentinel's SENTINEL command.\"\"\"\n   20 |         warnings.warn(DeprecationWarning(\"Use the individual sentinel_* methods\"))","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/sentinel.py#L18-L20"}]},{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"Mutable default argument: __init__ has `policy_resolver: AsyncPolicyResolver = AsyncStaticPolicyResolver()`. The default instance is created once at function-definition time and shared by every RedisCluster created without an explicit resolver. AsyncStaticPolicyResolver is currently read-only so the practical impact is low, but a shared mutable default is an anti-pattern that becomes a cross-client state-bleed bug the moment the resolver gains mutable state.","fix":"Default to None and instantiate AsyncStaticPolicyResolver() inside __init__ when not provided.","locations":[{"ref":"redis/asyncio/cluster.py:380","code":"  380 |         policy_resolver: AsyncPolicyResolver = AsyncStaticPolicyResolver(),","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L380"}]},{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"_socket_is_empty() reaches into the asyncio.StreamReader private attribute self._reader._buffer to test for buffered data. This is an undocumented CPython internal with no stability guarantee; a stdlib change to StreamReader's internals breaks process_invalidation_messages() (client-side caching invalidation draining) with an AttributeError. There is no equivalent in the sync mirror to cross-check against.","fix":"Prefer the parser's can_read() abstraction (as can_read()/ensure_connection() already do) to detect pending data instead of touching StreamReader._buffer directly.","locations":[{"ref":"redis/asyncio/connection.py:903-905","code":"  903 |     def _socket_is_empty(self):\n  904 |         \"\"\"Check if the socket is empty\"\"\"\n  905 |         return len(self._reader._buffer) == 0","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L903-L905"}]},{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"asyncio.Task(...) is used to schedule sentinel commands instead of asyncio.ensure_future / loop.create_task. Direct construction of asyncio.Task is discouraged and binds the coroutine to the current loop implicitly; ensure_future/create_task is the documented API. Functionally works today but is the kind of construct that breaks across event-loop/policy changes.","fix":"Use `tasks = [asyncio.ensure_future(sentinel.execute_command(*args, **kwargs)) for sentinel in self.sentinels]` (or loop.create_task).","locations":[{"ref":"redis/asyncio/sentinel.py:244-248","code":"  244 |         tasks = [\n  245 |             asyncio.Task(sentinel.execute_command(*args, **kwargs))\n  246 |             for sentinel in self.sentinels\n  247 |         ]\n  248 |         responses = await asyncio.gather(*tasks)","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/sentinel.py#L244-L248"}]},{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"parse_cluster_shards assumes resp[0] exists. `parse_cluster_shards` (line 167) indexes `resp[0]` without checking for an empty response, unlike parse_cluster_shards_with_str_keys and parse_cluster_shards_unified which guard with `if not resp`. A CLUSTER SHARDS call returning an empty list (a cluster with no shards / mid-bootstrap) would raise IndexError instead of returning an empty result.","fix":"Add `if not resp: return resp` at the top of parse_cluster_shards, matching the other two parsers.","locations":[{"ref":"redis/cluster.py:163-182","code":"  163 | def parse_cluster_shards(resp, **options):\n  164 |     \"\"\"\n  165 |     Parse CLUSTER SHARDS response.\n  166 |     \"\"\"\n  167 |     if isinstance(resp[0], dict):\n  168 |         return resp\n  169 |     shards = []\n  170 |     for x in resp:\n  171 |         shard = {\"slots\": [], \"nodes\": []}\n  172 |         for i in range(0, len(x[1]), 2):\n  173 |             shard[\"slots\"].append((x[1][i], (x[1][i + 1])))\n  174 |         nodes = x[3]\n  175 |         for node in nodes:\n  176 |             dict_node = {}\n  177 |             for i in range(0, len(node), 2):\n  178 |                 dict_node[node[i]] = node[i + 1]\n  179 |             shard[\"nodes\"].append(dict_node)\n  180 |         shards.append(shard)\n  181 | \n  182 |     return shards","lines":20,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L163-L182"}]},{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"CMSCommands.merge uses a mutable default argument `weights=[]` (in both @overload stubs and the implementation). While append_weights only reads it, a shared mutable default is a latent footgun and a lint smell flagged across the codebase elsewhere.","fix":"Default to `weights=None` and treat None as empty inside the method (e.g. `weights = weights or []`).","locations":[{"ref":"redis/commands/bf/commands.py:962-972","code":"  962 |     @overload\n  963 |     def merge(\n  964 |         self: SyncClientProtocol, destKey, numKeys, srcKeys, weights=[]\n  965 |     ) -> bool: ...\n  966 | \n  967 |     @overload\n  968 |     def merge(\n  969 |         self: AsyncClientProtocol, destKey, numKeys, srcKeys, weights=[]\n  970 |     ) -> Awaitable[bool]: ...\n  971 | \n  972 |     def merge(self, destKey, numKeys, srcKeys, weights=[]) -> bool | Awaitable[bool]:","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/bf/commands.py#L962-L972"}]},{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"ClusterManagementCommands.readonly only sets self.read_from_replicas = True when target_nodes is the literal string 'replicas' or 'all'. If a user passes the node-flag constants (e.g. RedisCluster.REPLICAS / ALL_NODES) or a list of replica ClusterNodes, the READONLY command is still sent but read_from_replicas stays False, so subsequent reads are not actually routed to replicas. The condition relies on a stringly-typed comparison that does not cover the documented target_nodes flag forms.","fix":"Compare against the actual node-flag constants used elsewhere (PRIMARIES/REPLICAS/ALL_NODES) rather than hard-coded lowercase strings, or document that read_from_replicas auto-enable only works with the string forms.","locations":[{"ref":"redis/commands/cluster.py:1027-1039","code":" 1027 |     def readonly(self, target_nodes: \"TargetNodesT\" | None = None) -> ResponseT:\n 1028 |         \"\"\"\n 1029 |         Enables read queries.\n 1030 |         The command will be sent to the default cluster node if target_nodes is\n 1031 |         not specified.\n 1032 | \n 1033 |         For more information see https://redis.io/commands/readonly\n 1034 |         \"\"\"\n 1035 |         if target_nodes == \"replicas\" or target_nodes == \"all\":\n 1036 |             # read_from_replicas will only be enabled if the READONLY command\n 1037 |             # is sent to all replicas\n 1038 |             self.read_from_replicas = True\n 1039 |         return self.execute_command(\"READONLY\", target_nodes=target_nodes)","lines":13,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/cluster.py#L1027-L1039"}]},{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"_georadiusgeneric and _geosearchgeneric forward the entire kwargs dict (containing unit, withdist, withcoord, withhash, count, sort, store, store_dist, any, member, longitude, latitude, radius, width, height) straight into self.execute_command(command, *pieces, **kwargs). These option keys are passed through as response-callback options; many are meaningless to the parser and rely on the callback ignoring unknown keys. This is brittle: any of these names colliding with a real execute_command/option name (e.g. 'store', 'count', 'any') could be misinterpreted. The cleaner pattern (used elsewhere) is to pass only the specific options the callback needs.","fix":"Forward only the response-relevant options (e.g. withcoord/withdist/withhash/store/keys) rather than splatting the full kwargs dict.","locations":[{"ref":"redis/commands/core.py:11349-11393","code":"11349 |     def _georadiusgeneric(\n11350 |         self, command: str, *args: EncodableT, **kwargs: Union[EncodableT, None]\n11351 |     ) -> ResponseT:\n11352 |         pieces = list(args)\n11353 |         if kwargs[\"unit\"] and kwargs[\"unit\"] not in (\"m\", \"km\", \"mi\", \"ft\"):\n11354 |             raise DataError(\"GEORADIUS invalid unit\")\n11355 |         elif kwargs[\"unit\"]:\n11356 |             pieces.append(kwargs[\"unit\"])\n11357 |         else:\n11358 |             pieces.append(\"m\")\n11359 | \n11360 |         if kwargs[\"any\"] and kwargs[\"count\"] is None:\n11361 |             raise DataError(\"``any`` can't be provided without ``count``\")\n11362 | \n11363 |         for arg_name, byte_repr in (\n11364 |             (\"withdist\", \"WITHDIST\"),\n11365 |             (\"withcoord\", \"WITHCOORD\"),\n11366 |             (\"withhash\", \"WITHHASH\"),\n11367 |         ):\n11368 |             if kwargs[arg_name]:\n11369 |                 pieces.append(byte_repr)\n11370 | \n11371 |         if e DataError(\"GEOSEARCH ``any`` can't be provided without count\")\n11648 | \n11649 |         # other properties\n11650 |         for arg_name, byte_repr in (\n11651 |             (\"withdist\", b\"WITHDIST\"),\n11652 |             (\"withcoord\", b\"WITHCOORD\"),\n11653 |             (\"withhash\", b\"WITHHASH\"),\n11654 |             (\"store_dist\", b\"STOREDIST\"),\n11655 |         ):\n11656 |             if kwargs[arg_name]:\n11657 |                 pieces.append(byte_repr)\n11658 | \n11659 |         kwargs[\"keys\"] = [args[0] if command == \"GEOSEARCH\" else args[1]]\n11660 | \n11661 |         return self.execute_command(command, *pieces, **kwargs)","lines":65,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L11597-L11661"}]},{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"RedisModuleCommands.json/ft use mutable default arguments (encoder=JSONEncoder(), decoder=JSONDecoder()). A single JSONEncoder/JSONDecoder instance is shared across every call that omits the arguments, for the lifetime of the process. JSONEncoder/JSONDecoder are effectively stateless for typical use so this is usually benign, but it is the classic mutable-default-argument anti-pattern and means custom subclasses with instance state would be silently shared. AsyncRedisModuleCommands.json repeats it.","fix":"Default to None and instantiate inside the method body (encoder = encoder or JSONEncoder()).","locations":[{"ref":"redis/commands/redismodules.py:30","code":"   30 |     def json(self, encoder=JSONEncoder(), decoder=JSONDecoder()) -> JSON:","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/redismodules.py#L30"},{"ref":"redis/commands/redismodules.py:106","code":"  106 |     def json(self, encoder=JSONEncoder(), decoder=JSONDecoder()) -> AsyncJSON:","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/redismodules.py#L106"}]},{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"SSLConnection._wrap_socket_with_ssl, in the stapled-OCSP path, opens a brand new OpenSSL socket via socket.socket(), connects, does the handshake and shuts it down (lines 2165-2169) but never closes the underlying socket created by socket.socket(). The OpenSSL.SSL.Connection wraps an unreferenced socket that is only shut down, not closed, leaking a file descriptor on every stapled-OCSP validation.","fix":"Keep a reference to the raw socket passed to OpenSSL.SSL.Connection and close it (and the OpenSSL connection) in a finally block after do_handshake/shutdown.","locations":[{"ref":"redis/connection.py:2164-2170","code":" 2164 |             #  need another socket\n 2165 |             con = OpenSSL.SSL.Connection(staple_ctx, socket.socket())\n 2166 |             con.request_ocsp()\n 2167 |             con.connect((self.host, self.port))\n 2168 |             con.do_handshake()\n 2169 |             con.shutdown()\n 2170 |             return sslsock","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L2164-L2170"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","easy":false,"description":"CacheProxyConnection.read_response calls self._cache.get(self._current_command_cache_key) up to three times in the cache-hit fast path (once in the condition, once for .status, once for .cache_value) under the lock. Each get is a dict/structure lookup and the redundant lookups add overhead on the hot read path, plus they create a TOCTOU window where the entry could theoretically change between calls if get() is not perfectly atomic.","fix":"Fetch the entry once into a local variable and reuse it for the status check and cache_value read.","locations":[{"ref":"redis/connection.py:1786-1802","code":" 1786 |             if self._current_command_cache_key is not None:\n 1787 |                 if (\n 1788 |                     self._cache.get(self._current_command_cache_key) is not None\n 1789 |                     and self._cache.get(self._current_command_cache_key).status\n 1790 |                     != CacheEntryStatus.IN_PROGRESS\n 1791 |                 ):\n 1792 |                     res = copy.deepcopy(\n 1793 |                         self._cache.get(self._current_command_cache_key).cache_value\n 1794 |                     )\n 1795 |                     self._current_command_cache_key = None\n 1796 |                     record_csc_request(\n 1797 |                         result=CSCResult.HIT,\n 1798 |                     )\n 1799 |                     record_csc_network_saved(\n 1800 |                         bytes_saved=len(res) if hasattr(res, \"__len__\") else 0,\n 1801 |                     )\n 1802 |                     return res","lines":17,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L1786-L1802"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","easy":false,"description":"Sync recorder: when observability is disabled, _metrics_collector stays None and _get_or_create_collector() is re-invoked on EVERY record_* call (every command, pubsub message, etc.). _get_or_create_collector calls get_observability_instance().get_provider_manager() and checks config each time. The docstrings claim 'Try to initialize (only once)' and 'zero overhead', but there is no negative cache: a disabled-observability deployment pays this lookup cost per operation forever. The async recorder has the same pattern.","fix":"Cache a tri-state (uninitialized / disabled / collector) so the disabled state short-circuits without repeatedly re-querying the provider manager, or set a module-level boolean _initialized flag.","locations":[{"ref":"redis/observability/recorder.py:88-95","code":"   88 |     global _metrics_collector\n   89 | \n   90 |     # Fast path: if collector not initialized, observability is disabled\n   91 |     if _metrics_collector is None:\n   92 |         # Try to initialize (only once)\n   93 |         _metrics_collector = _get_or_create_collector()\n   94 |         if _metrics_collector is None:\n   95 |             return  # Observability not enabled","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/observability/recorder.py#L88-L95"},{"ref":"redis/asyncio/observability/recorder.py:47-77","code":"   47 | def _get_or_create_collector() -> Optional[RedisMetricsCollector]:\n   48 |     \"\"\"\n   49 |     Get or create the global metrics collector.\n   50 | \n   51 |     Returns:\n   52 |         RedisMetricsCollector instance if observability is enabled, None otherwise\n   53 |     \"\"\"\n   54 |     global _async_metrics_collector\n   55 | \n   56 |     if _async_metrics_collector is not None:\n   57 |         return _async_metrics_collector\n   58 | \n   59 |     try:\n   60 |         manager = get_observability_instance().get_provider_manager()\n   61 |         if manager is None or not manager.config.enabled_telemetry:\n   62 |             return None\n   63 | \n   64 |         # Get meter from the global MeterProvider\n   65 |         meter = manager.get_meter_provider().get_meter(\n   66 |             RedisMetricsCollector.METER_NAME, RedisMetricsCollector.METER_VERSION\n   67 |         )\n   68 | \n   69 |         _async_metrics_collector = RedisMetricsCollector(meter, manager.config)\n   70 |         return _async_metrics_collector\n   71 | \n   72 |     except ImportError:\n   73 |         # Observability module not available\n   74 |         return None\n   75 |     except Exception:\n   76 |         # Any other error - don't break Redis operations\n   77 |         return None","lines":31,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/observability/recorder.py#L47-L77"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"Async `_AsyncRESPBase._read` / `_readline` accumulate raw socket chunks in `self._chunks` and, on the next `read_response`, rebuild the whole parse buffer with `self._buffer += b''.join(self._chunks)`. For a large multi-bulk reply spread across many recv chunks this is repeated bytes concatenation/copies of the entire accumulated buffer on every response. The pure-python async parser is already the slow path, but this is a quadratic-ish allocation pattern in the hot read loop for large replies.","fix":"Prefer the hiredis parser for large payloads; if optimizing the pure-python path, accumulate into a single bytearray and track an offset rather than re-joining a chunk list each call.","locations":[{"ref":"redis/_parsers/base.py:548-584","code":"  548 |     async def _read(self, length: int) -> bytes:\n  549 |         \"\"\"\n  550 |         Read `length` bytes of data.  These are assumed to be followed\n  551 |         by a '\\r\\n' terminator which is subsequently discarded.\n  552 |         \"\"\"\n  553 |         want = length + 2\n  554 |         end = self._pos + want\n  555 |         if len(self._buffer) >= end:\n  556 |             result = self._buffer[self._pos : end - 2]\n  557 |         else:\n  558 |             tail = self._buffer[self._pos :]\n  559 |             try:\n  560 |                 data = await self._stream.readexactly(want - len(tail))\n  561 |             except IncompleteReadError as error:\n  562 |                 raise ConnectionError(SERVER_CLOSED_CONNECTION_ERROR) from error\n  563 |             result = (tail + data)[:-2]\n  564 |             self._chunks.append(data)\n  565 |         self._pos += want\n  566 |         return result\n  567 | \n  568 |     async def _readline(self) -> bytes:\n  569 |         \"\"\"\n  570 |         read an unknown number of bytes up to us to clear our parsing buffer\n  189 |         self._clear()\n  190 |         return response","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/resp3.py#L180-L190"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"On a MovedError, _execute_command recomputes the slot via `await self._determine_slot(*args)` before retrying on the new node. _determine_slot can issue a network round-trip (COMMAND GETKEYS via commands_parser.get_keys) for commands whose keys aren't special-cased. The slot was already known when the command was first dispatched; recomputing it (potentially with a server round-trip) on every MOVED retry adds avoidable latency under MOVED storms.","fix":"Cache the slot computed on the initial dispatch and reuse it in the MOVED branch instead of re-deriving it (and possibly re-querying the server).","locations":[{"ref":"redis/asyncio/cluster.py:1114-1125","code":" 1114 |                 elif moved:\n 1115 |                     # MOVED occurred and the slots cache was updated,\n 1116 |                     # refresh the target node\n 1117 |                     slot = await self._determine_slot(*args)\n 1118 |                     target_node = self.nodes_manager.get_node_from_slot(\n 1119 |                         slot,\n 1120 |                         self.read_from_replicas and args[0] in READ_COMMANDS,\n 1121 |                         self.load_balancing_strategy\n 1122 |                         if args[0] in READ_COMMANDS\n 1123 |                         else None,\n 1124 |                     )\n 1125 |                     moved = False","lines":12,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L1114-L1125"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"send_packed_command() wraps the write in asyncio.wait_for(self._send_packed_command(command), self.socket_timeout) when socket_timeout is set. asyncio.wait_for schedules an extra task and timer per command write; on the hot send path (every command) this adds measurable overhead versus the async_timeout context manager used elsewhere in this module (read_response, _connect, disconnect).","fix":"Use `async with async_timeout(self.socket_timeout):` around the writelines/drain, matching the timeout style used by read_response()/_connect()/disconnect() and avoiding the per-write wait_for task allocation.","locations":[{"ref":"redis/asyncio/connection.py:685-691","code":"  685 |             if self.socket_timeout:\n  686 |                 await asyncio.wait_for(\n  687 |                     self._send_packed_command(command), self.socket_timeout\n  688 |                 )\n  689 |             else:\n  690 |                 self._writer.writelines(command)\n  691 |                 await self._writer.drain()","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L685-L691"}]},{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"AsyncHTTPClientWrapper.* use asyncio.get_event_loop() to obtain the loop for run_in_executor. get_event_loop() is deprecated when there is no running loop and emits DeprecationWarning on modern Python; inside an async method the correct call is asyncio.get_running_loop(), which is also faster and unambiguous.","fix":"Replace asyncio.get_event_loop() with asyncio.get_running_loop() in all six methods.","locations":[{"ref":"redis/asyncio/http/http_client.py:143","code":"  143 |         loop = asyncio.get_event_loop()","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/http/http_client.py#L143"},{"ref":"redis/asyncio/http/http_client.py:158","code":"  158 |         loop = asyncio.get_event_loop()","lines":1,"link":"h
