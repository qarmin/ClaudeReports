xt time that they are used.\n  149 |                 await self.disconnect(inuse_connections=False)\n  150 |         return master_address","lines":20,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/sentinel.py#L131-L150"},{"ref":"redis/sentinel.py:112-125","code":"  112 |     def reset(self):\n  113 |         self.master_address = None\n  114 |         self.slave_rr_counter = None\n  115 | \n  116 |     def get_master_address(self):\n  117 |         master_address = self.sentinel_manager.discover_master(self.service_name)\n  118 |         if self.is_master and self.master_address != master_address:\n  119 |             self.master_address = master_address\n  120 |             # disconnect any idle connections so that they reconnect\n  121 |             # to the new master the next time that they are used.\n  122 |             connection_pool = self.connection_pool_ref()\n  123 |             if connection_pool is not None:\n  124 |                 connection_pool.disconnect(inuse_connections=False)\n  125 |         return master_address","lines":14,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/sentinel.py#L112-L125"}]},{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"_calculate_renewal_delay returns delay in seconds (delay/1000) and callers pass it to loop.call_later (seconds) - correct. But _delay_for_lower_refresh and _delay_for_ratio_refresh both independently call datetime.now() at slightly different instants, then min() is taken; the two 'now' reads differ, so the chosen delay can be marginally inconsistent. More notable: if get_lower_refresh_bound_millis is 0 (documented as 'no lower bound'), _delay_for_lower_refresh returns expire_date - now which is the FULL time to expiry, so min() would pick the ratio refresh as intended - but if the ratio is also effectively disabled the token could be refreshed t recently created timer; timers from earlier run_once/run_recurring calls (running on their own loops) are not cancelled via _next_timer (they are stopped only because their loops are stopped). For run_recurring_async (same loop), scheduling a second recurring task overwrites _next_timer and the first task's pending timer can no longer be cancelled, leaking a recurring callback.","fix":"Track timer handles per scheduled task (e.g. a list/set) and cancel all of them in stop(), rather than a single _next_timer slot.","locations":[{"ref":"redis/background.py:382-416","code":"  382 |                 if self._stopped:\n  383 |                     return\n  384 |             self._next_timer = loop.call_later(interval, execute_and_reschedule)\n  385 | \n  386 |         def execute_and_reschedule():\n  387 |             \"\"\"Execute the coroutine and schedule next run after completion.\"\"\"\n  388 |             with self._lock:\n  389 |                 if self._stopped:\n  390 |                     return\n  391 | \n  392 |             def on_complete(task: asyncio.Task):\n  393 |                 \"\"\"Callback when coroutine completes - schedule next execution.\"\"\"\n  394 |                 # Log any exceptions (prevents \"Task exception was never retrieved\")\n  395 |                 if task.cancelled():\n  396 |                     pass\n  397 |                 elif task.exception() is not None:\n  398 |                     logging.getLogger(__name__).debug(\n  399 |                         \"Recurring async coroutine raised exception\",\n  400 |                         exc_info=task.exception(),\n  401 |                     )\n  402 |                 # Schedule next execution AFTER this one completes\n  403 |                 schedule_next()\n  404 | \n  405 |             try:\n  406 |                 task = asyncio.ensure_future(coro(*args))\n  407 |                 task.add_done_callback(on_complete)\n  408 |             except Exception:\n  409 |                 # If scheduling fails, still try to schedule next run\n  410 |                 logging.getLogger(__name__).debug(\n  411 |                     \"Failed to schedule recurring async coroutine\", exc_info=True\n  412 |                 )\n  413 |                 schedule_next()\n  414 | \n  415 |         # Schedule first execution\n  416 |         self._next_timer = loop.call_later(interval, execute_and_reschedule)","lines":35,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/background.py#L382-L416"},{"ref":"redis/background.py:35-44","code":"   35 |             if self._next_timer:\n   36 |                 self._next_timer.cancel()\n   37 |                 self._next_timer = None\n   38 | \n   39 |             # Stop all event loops\n   40 |             for loop in self._event_loops:\n   41 |                 if loop.is_running():\n   42 |                     loop.call_soon_threadsafe(loop.stop)\n   43 | \n   44 |             self._event_loops.clear()","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/background.py#L35-L44"}]},{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"clean_health_check_responses() loops with a fixed ttl=10 and decrements ttl each iteration regardless of whether a response was actually read. If can_read() keeps returning False (no data) but health_check_response_counter stays > 0, the loop exits after 10 iterations leaving the counter positive, so a stale health-check accounting persists; conversely if there are more than 10 pending health checks they will not all be drained. The magic constant 10 is unexplained.","fix":"Decrement ttl only when no readable data was found (to bound idle spins) and/or size the bound off health_check_response_counter; document the intent of the constant.","locations":[{"ref":"redis/client.py:1102-1118","code":" 1102 |     def clean_health_check_responses(self) -> None:\n 1103 |         \"\"\"\n 1104 |         If any health check responses are present, clean them\n 1105 |         \"\"\"\n 1106 |         ttl = 10\n 1107 |         conn = self.connection\n 1108 |         while conn and self.health_check_response_counter > 0 and ttl > 0:\n 1109 |             if self._execute(conn, conn.can_read, timeout=conn.socket_timeout):\n 1110 |                 response = self._execute(conn, conn.read_response)\n 1111 |                 if self.is_health_check_response(response):\n 1112 |                     self.health_check_response_counter -= 1\n 1113 |                 else:\n 1114 |                     raise PubSubError(\n 1115 |                         \"A non health check response was cleaned by \"\n 1116 |                         \"execute_command: {}\".format(response)\n 1117 |                     )\n 1118 |             ttl -= 1","lines":17,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L1102-L1118"}]},{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In handle_message, a bare bytes response is special-cased as a health-check/pong: `response = [b'pong', response] if response != b'PONG' else [b'pong', b'']`. A legitimate non-pubsub bulk-string reply that happens to be bytes (e.g. from an out-of-band command on the same connection) would be misinterpreted as a pong message rather than surfaced/erroring, silently swallowing data.","fix":"Restrict this coercion to the known health-check value(s) instead of all bytes responses, or assert the response matches an expected health-check payload.","locations":[{"ref":"redis/client.py:1503-1504","code":" 1503 |         if isinstance(response, bytes):\n 1504 |             response = [b\"pong\", response] if response != b\"PONG\" else [b\"pong\", b\"\"]","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L1503-L1504"}]},{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"Pipeline.unwatch() uses Python operator precedence such that `self.watching and self.execute_command('UNWATCH') or True` always evaluates to True, because the trailing `or True` masks any falsy result. The return value therefore conveys no information (it is documented as -> bool but is a constant True). If UNWATCH's actual reply mattered to a caller, it is discarded.","fix":"Rewrite explicitly: `if self.watching: return self.execute_command('UNWATCH')` and `return True` otherwise, or return the command result directly.","locations":[{"ref":"redis/client.py:2118-2120","code":" 2118 |     def unwatch(self) -> bool:\n 2119 |         \"\"\"Unwatches all previously specified keys\"\"\"\n 2120 |         return self.watching and self.execute_command(\"UNWATCH\") or True","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L2118-L2120"}]},{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"get_node_from_slot's deprecated server_type path can return the primary even when a replica was requested. When server_type is REPLICA but the slot has more than one node AND a load_balancing_strategy is active, the first branch (line 2281) wins and uses round-robin/random across all nodes including index 0 (the primary), so a caller asking for a replica may still hit the primary. Conversely the replica branch (line 2294-2297) is only reached when no load_balancing_strategy is set. The interaction between the deprecated server_type arg and load_balancing_strategy is inconsistent.","fix":"When server_type == REPLICA is explicitly requested, restrict selection to replica indices (>= 1) regardless of load_balancing_strategy, or document/deprecate the conflicting combination clearly.","locations":[{"ref":"redis/cluster.py:2281-2299","code":" 2281 |             if len(self.slots_cache[slot]) > 1 and load_balancing_strategy:\n 2282 |                 # get the server index using the strategy defined in load_balancing_strategy\n 2283 |                 primary_name = self.slots_cache[slot][0].name\n 2284 |                 node_idx = self.read_load_balancer.get_server_index(\n 2285 |                     primary_name, len(self.slots_cache[slot]), load_balancing_strategy\n 2286 |                 )\n 2287 |             elif (\n 2288 |                 server_type is None\n 2289 |                 or server_type == PRIMARY\n 2290 |                 or len(self.slots_cache[slot]) == 1\n 2291 |             ):\n 2292 |                 # return a primary\n 2293 |                 node_idx = 0\n 2294 |             else:\n 2295 |                 # return a replica\n 2296 |                 # randomly choose one of the replicas\n 2297 |                 node_idx = random.randint(1, len(self.slots_cache[slot]) - 1)\n 2298 | \n 2299 |             return self.slots_cache[slot][node_idx]","lines":19,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L2281-L2299"}]},{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"ClusterPubSub.execute_command selects the pubsub node via get_node_from_slot using `self.cluster.read_from_replicas` / `load_balancing_strategy` (lines 2922-2926). For regular (non-shard) pubsub a SUBSCRIBE routed to a replica is valid, but if a replica is chosen and later fails over, the channel binding is to a node that no longer serves it; there is no rebinding for classic (non-shard) channels comparable to the shard reconciliation path. This silently drops classic subscriptions on failover without surfacing an error to the caller.","fix":"Document the non-shard pubsub failover limitation explicitly at this call site, or add reconnection/rebinding handling for classic channels analogous to the shard reconciliation in reinitialize_shard_subscriptions.","locations":[{"ref":"redis/cluster.py:2915-2933","code":" 2915 |         if self.connection is None:\n 2916 |             if self.connection_pool is None:\n 2917 |                 if len(args) > 1:\n 2918 |                     # Hash the first channel and get one of the nodes holding\n 2919 |                     # this slot\n 2920 |                     channel = args[1]\n 2921 |                     slot = self.cluster.keyslot(channel)\n 2922 |                     node = self.cluster.nodes_manager.get_node_from_slot(\n 2923 |                         slot,\n 2924 |                         self.cluster.read_from_replicas,\n 2925 |                         self.cluster.load_balancing_strategy,\n 2926 |                     )\n 2927 |                 else:\n 2928 |                     # Get a random node\n 2929 |                     node = self.cluster.get_random_node()\n 2930 |                 self.node = node\n 2931 |                 redis_connection = self.cluster.get_redis_connection(node)\n 2932 |                 self.connection_pool = redis_connection.connection_pool\n 2933 |             self.connection = self.connection_pool.get_connection()","lines":19,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L2915-L2933"}]},{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"PipelineStrategy.send_cluster_commands retry loop swallows the loop exit semantics. In send_cluster_commands (lines 4046-4060), on a retryable error it decrements retry_attempts and falls through the `pass` to loop again, but there is no backoff/sleep between attempts and, when retry_attempts hits 0, it `raise e` - however the `while True` has no other exit, so a persistently retryable error spins as fast as possible with zero delay (unlike _execute_command which sleeps on TryAgain/ClusterDown). This can hammer a recovering cluster.","fix":"Apply the configured        Set hash slots as unbound in the cluster.\n 1185 |         It determines by it self what node the slot is in and sends it there\n 1186 | \n 1187 |         Returns a list of the results for each processed slot.\n 1188 | \n 1189 |         For more information see https://redis.io/commands/cluster-delslots\n 1190 |         \"\"\"\n 1191 |         return await asyncio.gather(\n 1192 |             *(\n 1193 |                 asyncio.create_task(self.execute_command(\"CLUSTER DELSLOTS\", slot))\n 1194 |                 for slot in slots\n 1195 |             )\n 1196 |         )","lines":15,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/cluster.py#L1182-L1196"}]},{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"client_kill_filter accepts a `laddr: bool | None` typed parameter but treats it as an address value: the type hint says bool while it is appended as `(b'LADDR', laddr)` exactly like addr (a str address). The overload/signature type annotation (`laddr: bool | None = None`) is wrong - LADDR takes a 'local-address:port' string, not a bool. Misleading type hint that will mislead callers and type checkers.","fix":"Change laddr's type annotation from `bool | None` to `str | None`.","locations":[{"ref":"redis/commands/core.py:719-796","code":"  719 |     def client_kill_filter(\n  720 |         self: SyncClientProtocol,\n  721 |         _id: str | None = None,\n  722 |         _type: str | None = None,\n  723 |         addr: str | None = None,\n  724 |         skipme: bool | None = None,\n  725 |         laddr: bool | None = None,\n  726 |         user: str | None = None,\n  727 |         maxage: int | None = None,\n  728 |         **kwargs,\n  729 |     ) -> int: ...\n  730 | \n  731 |     @overload\n  732 |     def client_kill_filter(\n  733 |         self: AsyncClientProtocol,\n  734 |         _id: str | None = None,\n  735 |         _type: str | N ","code":" 4489 |         try:\n 4490 |             int(minmatchlen)\n 4491 |             pieces.extend([b\"MINMATCHLEN\", minmatchlen])\n 4492 |         except TypeError:\n 4493 |             pass","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L4489-L4493"}]},{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"lcs ignores minmatchlen only when it equals 0 (`if minmatchlen is not None and minmatchlen != 0`). A caller explicitly passing minmatchlen=0 (the documented default meaning 'no minimum') silently omits the clause, which is correct, but a negative minmatchlen would be sent verbatim with no validation. More notably lcs (unlike stralgo) performs no validation that idx is set when minmatchlen/withmatchlen are used, so MINMATCHLEN/WITHMATCHLEN can be emitted without IDX, yielding a server error rather than a clear client-side DataError.","fix":"Validate that minmatchlen/withmatchlen require idx (matching stralgo's intent) and reject negative minmatchlen with a clear DataError.","locations":[{"ref":"redis/commands/core.py:4653-4662","code":" 4653 |         pieces: list[str | int] = [key1, key2]\n 4654 |         if len:\n 4655 |             pieces.append(\"LEN\")\n 4656 |         if idx:\n 4657 |             pieces.append(\"IDX\")\n 4658 |         if minmatchlen is not None and minmatchlen != 0:\n 4659 |             pieces.extend([\"MINMATCHLEN\", minmatchlen])\n 4660 |         if withmatchlen:\n 4661 |             pieces.append(\"WITHMATCHLEN\")\n 4662 |         return self.execute_command(\"LCS\", *pieces, keys=[key1, key2])","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L4653-L4662"}]},{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"scan_iter / sscan_iter / hscan_iter / zscan_iter (sync and async) om data.items()","lines":9,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L6126-L6134"},{"ref":"redis/commands/core.py:6201-6210","code":" 6201 |         cursor = \"0\"\n 6202 |         while cursor != 0:\n 6203 |             cursor, data = self.zscan(\n 6204 |                 name,\n 6205 |                 cursor=cursor,\n 6206 |                 match=match,\n 6207 |                 count=count,\n 6208 |                 score_cast_func=score_cast_func,\n 6209 |             )\n 6210 |             yield from data","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L6201-L6210"}]},{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"xinfo_stream rebinds `options = {}` then `options = {'full': full}` inside the `if full:` block, discarding the initial empty dict (harmless) but the pattern is misleading. More importantly when full is False, options stays {} and 'full' is never passed, so the response callback cannot distinguish summary vs full; this is fine for current callbacks but the asymmetric handling (only setting the option when True) is a latent inconsistency with how other commands always pass their flag.","fix":"Always pass full to options (options = {'full': full}) and append b'FULL' conditionally, for consistency.","locations":[{"ref":"redis/commands/core.py:7390-7395","code":" 7390 |         pieces = [name]\n 7391 |         options = {}\n 7392 |         if full:\n 7393 |             pieces.append(b\"FULL\")\n 7394 |             options = {\"full\": full}\n 7395 |         return self.execute_command(\"XINFO STREAM\", *pieces, **options)","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L7390-L7395"}]},{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"georadius _georadiusgeneric checks `if kwargs['count'] is not None` for COUNT (correct) but geosearch _geosearchgeneric checks `if kwargs['count']` (truthiness). A count of 0 is treated differently by the two code paths: georadius would emit `COUNT 0` while geosearch drops it. Inconsistent handling of the same parameter between two sibling helpers; count=0 is nonsensical but the divergence is a latent copy-paste inconsistency.","fix":"Use a consistent `is not None` test for count in both helpers.","locations":[{"ref":"redis/commands/core.py:11371-11374","code":"11371 |         if kwargs[\"count\"] is not None:\n11372 |             pieces.extend([\"COUNT\", kwargs[\"count\"]])\n11373 |             if kwargs[\"any\"]:\n11374 |                 pieces.append(\"ANY\")","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L11371-L11374"},{"ref":"redis/commands/core.py:11642-11647","code":"11642 |         if kwargs[\"count\"]:\n11643 |             pieces.extend([b\"COUNT\", kwargs[\"count\"]])\n11644 |             if kwargs[\"any\"]:\n11645 |                 pieces.append(b\"ANY\")\n11646 |         elif kwargs[\"any\"]:\n11647 |             raise DataError(\"GEOSEARCH ``any`` can't be provided without count\")","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L11642-L11647"}]},{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"parse_to_list converts booleans through the int branch: bool is a subclass of int, so a True/False item (or a numeric item that is actually a flag) becomes 1/0. More importantly, the float fast-path (`isinstance(item, float)`) preserves floats but the subsequent int(item) attempt on a string like \"3.0\" raises ValueError and falls through to float, while \"3\" becomes int 3 - so semantically-float values that arrive as the string \"3\" are silently coerced to int, changing the response type depending on server formatting.","fix":"Decide on a single numeric type policy independent of the server's textual formatting, and avoid int() coercion of values that the caller expects as float.","locations":[{"ref":"redis/commands/helpers.py:73-106","code":"   73 | def parse_to_list(response):\n   74 |     \"\"\"Optimistically parse the response to a list.\"\"\"\n   75 |     res = []\n   76 | \n   77 |     special_values = {\"infinity\", \"nan\", \"-infinity\"}\n   78 | \n   79 |     if response is None:\n   80 |         return res\n   81 | \n   82 |     for item in response:\n   83 |         if item is None:\n   84 |             res.append(None)\n   85 |             continue\n   86 |         if isinstance(item, float):\n   87 |             res.append(item)\n   88 |             continue\n   89 |         try:\n   90 |             item_str = nativestr(item)\n   91 |         except TypeError:\n   92 |             res.append(None)\n   93 |             continue\n   94 | \n   95 |         if isinstance(item_str, str) and item_str.lower() in special_values:\n   96 |             res.append(item_str)  # Keep as string\n   97 |         else:\n   98 |             try:\n   99 |                 res.append(int(item))\n  100 |             except (ValueError, OverflowError, TypeError):\n  101 |                 try:\n  102 |                     res.append(float(item))\n  103 |                 except (ValueError, TypeError):\n  104 |                     res.append(item_str)\n  105 | \n  106 |     return res","lines":34,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/helpers.py#L73-L106"}]},{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"When a client is constructed with an explicit protocol=3 AND legacy_responses=True (the default), apply_module_callbacks selects the `resp3` dict, which is `{}` for the timeseries, json {"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"json _convert_resp_floats (used for JSON.RESP unified) converts any string leaf that parses as float into a native float. This will also convert intentional numeric-looking JSON string values (e.g. a stored string \"3.14\") into floats, losing the distinction between a JSON string and a JSON number in the RESP-tree representation.","fix":"Rely on the wire-level type information (only convert leaves that JSON.RESP marks as doubles) rather than best-effort float() parsing of arbitrary strings, or document the lossy behaviour.","locations":[{"ref":"redis/commands/json/__init__.py:196-213","code":"  196 |     @staticmethod\n  197 |     def _convert_resp_floats(obj):\n  198 |         \"\"\"Recursively convert string-encoded JSON floats.\n  199 | \n  200 |         RESP2 has no native double type, so JSON.RESP returns JSON floats as\n  201 |         bulk strings. Any string/bytes leaf that parses as ``float`` is the\n  202 |         unified representation of such a value; non-numeric strings are left\n  203 |         untouched.\n  204 |         \"\"\"\n  205 |         if isinstance(obj, list):\n  206 |             return [_JSONBase._convert_resp_floats(item) for item in obj]\n  207 |         if isinstance(obj, (str, bytes)):\n  208 |             value = obj.decode() if isinstance(obj, bytes) else obj\n  209 |             try:\n  210 |                 return float(value)\n  211 |             except (ValueError, OverflowError):\n  212 |                 return obj\n  213 |         return obj","lines":18,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/json/__init__.py#L196-L213"}]},{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"JSON.arrindex silently drops `stop` when `start` is None. The `if start is not None:` block nests the `stop` append inside it, s ,{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"parse_m_get_unified RESP2 branch keys the result dict with the raw `item[0]` (bytes when decode_responses is False) while the RESP3 branch keys by the already-decoded name, and the legacy parse_m_get uses nativestr(item[0]). The unified RESP2 path is the odd one out, so dict keys differ by wire format for the same logical data.","fix":"Apply nativestr to item[0] in the RESP2 branch of parse_m_get_unified (and likewise parse_m_range_unified at line 160) so keys are protocol-independent.","locations":[{"ref":"redis/commands/timeseries/utils.py:98-107","code":"   98 |     res = {}\n   99 |     for item in response:\n  100 |         if not item[2]:\n  101 |             res[item[0]] = [_pairs_to_dict(item[1]), []]\n  102 |         else:\n  103 |             res[item[0]] = [\n  104 |                 _pairs_to_dict(item[1]),\n  105 |                 [int(item[2][0]), float(item[2][1])],\n  106 |             ]\n  107 |     return res","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/timeseries/utils.py#L98-L107"}]},{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"parse_m_range_unified RESP3 branch computes `metadata = item[1] if len(item) > 2 else []`, but the RESP3 MRANGE element layout is [labels, metadata, samples] (3 elements). The condition `len(item) > 2` only holds when metadata IS present, but when metadata is absent (2-element [labels, samples]) it returns [] for metadata AND uses item[-1] for samples — which is correct only by luck. If a 3-element form without real aggregator metadata ever appears the indexing assumptions are fragile and inconsistent with the synthesized RESP2 metadata path.","fix":"Make the RESP3 branch explicit about the element arity (distinguish 2- vs 3-element rows) and align the emitted metadata structure with _m_range_metadata used on the RESP2 path.","locations":[{"ref":"redis/commands/timeseries/utils.py:151-156","code":"  151 |     if isinstance(response, dict):\n  152 |         res = {}\n  153 |         for key, item in response.items():\n  154 |             metadata = item[1] if len(item) > 2 else []\n  155 |             res[key] = [item[0], metadata, parse_range_unified(item[-1])]\n  156 |         return res","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/timeseries/utils.py#L151-L156"}]},{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"VectorSet vadd/vsim use truthiness tests for numeric options: `if reduce_dim:`, `if count:`, `if ef:`, `if epsilon:`. A value of 0 is silently dropped. While 0 is meaningless for most, `epsilon` is documented as a float between 0 and 1 and `ef`/`count` could conceivably be 0 in edge cases; the silent drop differs from the explicit `is not None` checks used elsewhere (e.g. vrange/vrandmember count).","fix":"Use `is not None` checks for numeric options (reduce_dim, count, ef, epsilon) for consistency, matching vrange/vrandmember which correctly test `if count is not None`.","locations":[{"ref":"redis/commands/vectorset/commands.py:144-145","code":"  144 |         if reduce_dim:\n  145 |             pieces.extend([\"REDUCE\", reduce_dim])","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/vectorset/commands.py#L144-L145"},{"ref":"redis/commands/vectorset/commands.py:278-285","code":"  278 |         if count:\n  279 |             pieces.extend([\"COUNT\", count])\n  280 | \n  281 |         if epsilon:\n  282 |             pieces.extend([\"EPSILON\", epsilon])\n  283 | \n  284 |         if ef:\n  285 |             pieces.extend([\"EF\", ef])","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/vectorset/commands.py#L278-L285"}]},{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"update_current_socket_timeout interprets a relaxed_timeout of -1 as 'use self.socket_timeout', and set_tmp_settings/reset use -1 as a sentinel too, while None means something different in some callers. Mixing None and -1 as distinct sentinels for the same timeout concept across set_tmp_settings (line 768 checks '!= -1'), update_current_socket_timeout (line 740 checks '!= -1'), and update_connection_settings (lines 2673-2674 check 'is not None') is inconsistent and error-prone: passing relaxed_timeout=None to update_current_socket_timeout sets the socket timeout to None (infinite/blocking) rather than restoring socket_timeout, which may be unintended.","fix":"Standardize on a single sentinel (e.g. SENTINEL) for 'do not change' across all these timeout-handling methods, and document None vs -1 semantics explicitly.","locations":[{"ref":"redis/connection.py:737-748","code":"  737 |     def update_current_socket_timeout(self, relaxed_timeout: Optional[float] = None):\n  738 |         conn_socket = self._get_socket()\n  739 |         if conn_socket:\n  740 |             timeout = relaxed_timeout if relaxed_timeout != -1 else self.socket_timeout\n  741 |             # if the current timeout is 0 it means we are in the middle of a can_read call\n  742 |             # in this case we don't want to change the timeout because the operation\n  743 |             # is non-blocking and should return immediately\n  744 |             # Changing the state from non-blocking to blocking in the middle of a read operation\n  745 |             # will lead to a deadlock\n  746 |             if conn_socket.gettimeout() != 0:\n  747 |                 conn_socket.settimeout(timeout)\n  748 |             self.update_parser_timeout(timeout)","lines":12,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L737-L748"},{"ref":"redis/connection.py:758-770","code":"  758 |     def set_tmp_settings(\n  759 |         self,\n  760 |         tmp_host_address: Optional[Union[str, object]] = SENTINEL,\n  761 |         tmp_relaxed_timeout: Optional[float] = None,\n  762 |     ):\n  763 |         \"\"\"\n  764 |         The value of SENTINEL is used to indicate that the property should not be updated.\n  765 |         \"\"\"\n  766 |         if tmp_host_address and tmp_host_address != SENTINEL:\n  767 |             self.host = str(tmp_host_address)\n  768 |         if tmp_relaxed_timeout != -1:\n  769 |             self.socket_timeout = tmp_relaxed_timeout\n  770 |             self.socket_connect_timeout = tmp_relaxed_timeout","lines":13,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L758-L770"},{"ref":"redis/connection.py:2670-2682","code":" 2670 |         if host_address is not None:\n 2671 |             conn.set_tmp_settings(tmp_host_address=host_address)\n 2672 | \n 2673 |         if relaxed_timeout is not None:\n 2674 |             conn.set_tmp_settings(tmp_relaxed_timeout=relaxed_timeout)\n 2675 | \n 2676 |         if reset_relaxed_timeout or reset_host_address:\n 2677 |             conn.reset_tmp_settings(\n 2678 |                 reset_host_address=reset_host_address,\n 2679 |                 reset_relaxed_timeout=reset_relaxed_timeout,\n 2680 |             )\n 2681 | \n 2682 |         conn.update_current_socket_timeout(relaxed_timeout)","lines":13,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L2670-L2682"}]},{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In Connection.__init__, protocol parsing does 'try: p = int(protocol)' catching TypeError to default and ValueError to error. But int(protocol) where protocol is a bool (True/False) succeeds silently (int(True)==1, int(False)==0), then the range check p<2 raises 'protocol must be either 2 or 3'. More subtly, a float like 2.9 becomes 2 silently. Passing protocol=2.9 is accepted as 2 without warning.","fix":"Validate that protocol is an int (or int-like string) explicitly before coercion, rejecting bool and non-integral floats with a clear message.","locations":[{"ref":"redis/connection.py:905-914","code":"  905 |         try:\n  906 |             p = int(protocol)\n  907 |         except TypeError:\n  908 |             p = DEFAULT_RESP_VERSION\n  909 |         except ValueError:\n  910 |             raise ConnectionError(\"protocol must be an integer\")\n  911 |         else:\n  912 |             if p < 2 or p > 3:\n  913 |                 raise ConnectionError(\"protocol must be either 2 or 3\")\n  914 |         self.protocol = p","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L905-L914"}]},{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"AbstractConnection.connect_check_health stores per-call retry state in a list 'actual_retry_attempts = [0]' captured by the failure_callback closure. This works for a single in-flight connect, but the pattern of using a mutable list cell to smuggle a counter out of a callback is fragile, and on the non-retry path (retry_socket_connect=False, used by connect()) failure_callback is never invoked so actual_retry_attempts stays 0 even though the outer self.retry.call_with_retry in connect() may have retried multiple times; the error metric then under-reports retry_attempts.","fix":"Thread the retry count through the retry machinery's return/exception rather than a closure-captured list, and ensure the count reflects the outer retry loop in connect().","locations":[{"ref":"redis/connection.py:1003-1056","code":" 1003 |     def connect(self):\n 1004 |         \"Connects to the Redis server if not already connected\"\n 1005 |         # try once the socket connect with the handshake, retry the whole\n 1006 |         # connect/handshake flow based on retry policy\n 1007 |         self.retry.call_with_retry(\n 1008 |             lambda: self.connect_check_health(\n 1009 |                 check_health=True, retry_socket_connect=False\n 1010 |             ),\n 1011 |             lambda error: self.disconnect(error),\n 1012 |         )\n 1013 | \n 1014 |     def connect_check_health(\n 1015 |         self, check_health: bool = True, retry_socket_connect: bool = True\n 1016 |     ):\n 1017 |         if self._sock:\n 1018 |             return\n 1019 |         # Track actual retry attempts for error reporting\n 1020 |         actual_retry_attempts = [0]\n 1021 | \n 1022 |         def failure_callback(error, failure_count):\n 1023 |             actual_retry_attempts[0] = failure_count\n 1024 |             self.disconnect(error=error, failure_count=failure_count)\n 1025 | \n 1026 |         try:\n 1027 |             if retry_socket_connect:\n 1028 |                 sock = self.retry.call_with_retry(\n 1029 |                     self._connect,\n 1030 |                     failure_callback,\n 1031 |                     with_failure_count=True,\n 1032 |                 )\n 1033 |             else:\n 1034 |                 sock = self._connect()\n 1035 |         except socket.timeout:\n 1036 |             e = TimeoutError(\"Timeout connecting to server\")\n 1037 |             record_error_count(\n 1038 |                 server_address=self.host,\n 1039 |                 server_port=self.port,\n 1040 |                 network_peer_address=self.host,\n 1041 |                 network_peer_port=self.port,\n 1042 |                 error_type=e,\n 1043 |                 retry_attempts=actual_retry_attempts[0],\n 1044 |             )\n 1045 |             raise e\n 1046 |         except OSError as e:\n 1047 |             e = ConnectionError(self._error_message(e))\n 1048 |             record_error_count(\n 1049 L2288"},{"ref":"redis/connection.py:2251","code":" 2251 |     \"retry_on_error\": list,","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L2251"}]},{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"UsernamePasswordCredentialProvider.get_credentials returns a 1-tuple (password,) when username is falsy, but treats an empty-string password as a valid single credential. With username='' and password='' it returns ('',), causing an AUTH with an empty password rather than skipping auth. Constructor coerces None to '' (username or '', password or ''), losing the distinction between 'no credentials' and 'empty credentials'.","fix":"Preserve None vs empty-string distinction, and skip returning a credential tuple when no password/username was actually supplied.","locations":[{"ref":"redis/credentials.py:55-62","code":"   55 |     def __init__(self, username: Optional[str] = None, password: Optional[str] = None):\n   56 |         self.username = username or \"\"\n   57 |         self.password = password or \"\"\n   58 | \n   59 |     def get_credentials(self):\n   60 |         if self.username:\n   61 |             return self.username, self.password\n   62 |         return (self.password,)","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/credentials.py#L55-L62"}]},{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"WeightedList.update_weight has its docstring placed as the first statement inside `with self._lock:` rather than directly under the def, so it is a no-op string expression, not a docstring (help()/__doc__ will not show it). Cosmetic but a copy/placement bug.","fix":"Move the '''Update weight of an item''' string to be the first line of the method body, above `with self._lock:`.","locations":[{"ref":"redis/data_structure.py:57-62","code":"   57 |     def update_weight(self, item, new_weight: float):\n   58 |         with self._lock:\n   59 |             \"\"\"Update weight of an item\"\"\"\n   60 |             old_weight = self.remove(item)\n   61 |             self.add(item, new_weight)\n   62 |             return old_weight","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/data_structure.py#L57-L62"}]},{"id":"LOGIC_102","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"EventDispatcher.dispatch_async lazily creates self._async_lock without synchronization: `if self._async_lock is None: self._async_lock = asyncio.Lock()`. If dispatch_async is invoked concurrently from multiple tasks before the lock is first created, two asyncio.Lock instances can be created (last write wins) and the snapshot section briefly runs without mutual exclusion. Low impact because the lock only guards a snapshot copy, but it defeats the intended exclusion on first use.","fix":"Create the asyncio.Lock in __init__ (bound to the running loop lazily but guarded), or document that concurrent first-use is acceptable since only a snapshot is protected.","locations":[{"ref":"redis/event.py:134-144","code":"  134 |     async def dispatch_async(self, event: object):\n  135 |         if self._async_lock is None:\n  136 |             self._async_lock = asyncio.Lock()\n  137 | \n  138 |         # Snapshot listeners under the lock, then release it before awaiting\n  139 |         # them. See the note in dispatch(); the same rationale applies here\n  140 |         # for dispatch_async re-entry from within a listener.\n  141 |         async with self._async_lock:\n  142 |             listeners = list(self._event_listeners_mapping.get(type(event), []))\n  143 |         for listener in listeners:\n  144 |             await listener.listen(event)","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/event.py#L134-L144"}]},{"id":"LOGIC_103","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"EventDispatcher.register_listeners merges listener lists via set() (`list(set(existing + new))`). This deduplicates by listener identity/hash but also discards ordering (set iteration order is arbitrary) and silently drops listeners that compare equal / hash equal even if they are distinct intended registrations. unregister_listeners deliberately uses identity ('is') to avoid relying on __eq__, but register uses set() which DOES rely on __hash__/__eq__, an inconsistency that can drop or reorder listeners.","fix":"Make register_listeners use identity-based dedup (append if not already present by `is`) to match unregister_listeners semantics and preserve order.","locations":[{"ref":"redis/event.py:146-163","code":"  146 |     def register_listeners(\n  147 |         self,\n  148 |         mappings: Dict[\n  149 |             Type[object],\n  150 |             List[Union[EventListenerInterface, AsyncEventListenerInterface]],\n  151 |         ],\n  152 |     ):\n  153 |         with self._lock:\n  154 |             for event_type in mappings:\n  155 |                 if event_type in self._event_listeners_mapping:\n  156 |                     self._event_listeners_mapping[event_type] = list(\n  157 |                         set(\n  158 |                             self._event_listeners_mapping[event_type]\n  159 |                             + mappings[event_type]\n  160 |                         )\n  161 |                     )\n  162 |                 else:\n  163 |                     self._event_listeners_mapping[event_type] = mappings[event_type]","lines":18,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/event.py#L146-L163"},{"ref":"redis/event.py:165-183","code":"  165 |     def unregister_listeners(\n  166 |         self,\n  167 |         mappings: Dict[\n  168 |             Type[object],\n  169 |             List[Union[EventListenerInterface, AsyncEventListenerInterface]],\n  170 |         ],\n  171 |     ):\n  172 |         with self._lock:\n  173 |             for event_type, to_remove in mappings.items():\n  174 |                 current = self._event_listeners_mapping.get(event_type)\n  175 |                 if not current:\n  176 |                     continue\n  177 |                 # Remove by identity to match register semantics and to avoid\n  178 |                 # reliance on listener __eq__ implementations.\n  179 |                 self._event_listeners_mapping[event_type] = [\n  180 |                     listener\n  181 |                     for listener in current\n  182 |                     if all(listener is not target for target in to_remove)\n  183 |                 ]","lines":19,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/event.py#L165-L183"}]},{"id":"LOGIC_104","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"HttpClient base_url normalization uses base_url.rstrip() with no argument, which strips ALL trailing whitespace (spaces, tabs, newlines) then appends '/'. rstrip() does not strip a trailing slash, so a base_url already ending in non-whitespace is fine, but the intent was almost certainly rstrip('/') to avoid double slashes when joining. As written, a base_url like 'http://h/api/' is left unchanged (correct), but 'http://h/api' becomes 'http://h/api/' - which combined with urljoin and an absolute-looking path can drop the '/api' segment. The bare rstrip() is a likely typo for rstrip('/').","fix":"Confirm intent; if the goal is to ensure exactly one trailing slash, use base_url.rstrip('/') + '/' or simply ensure it ends with '/'. Note urljoin semantics: relative path joining requires the base to end in '/'.","locations":[{"ref":"redis/http/http_client.py:110-114","code":"  110 |         self.base_url = (\n  111 |             base_url.rstrip() + \"/\"\n  112 |             if base_url and not base_url.endswith(\"/\")\n  113 |             else base_url\n  114 |         )","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/http/http_client.py#L110-L114"}]},{"id":"LOGIC_105","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"HttpClient retry: the request() method retries the underlying _make_request via self.retry.call_with_retry, but only HTTPError 5xx/429 are retried (via _is_retryable_http_error). However, after retries are exhausted, HTTPError is caught at line 285 and converted into a successful-looking HttpResponse (not re-raised), so a 500 after exhausted retries returns an HttpResponse with status 500 which _json_call then turns into HttpError. URLError/ssl.SSLError are registered as supported errors for retry but are NOT in _is_retryable_http_error (which returns False for non-HTTPError), so they are never actually retried despite being registered - dead retry configuration for network errors.","fix":"Make _is_retryable_http_error also return True for transient URLError/SSLError if they are meant to be retried, or remove them from update_supported_errors to avoid the misleading configuration.","locations":[{"ref":"redis/http/http_client.py:118-118","code":"  118 |         self.retry.update_supported_errors((HTTPError, URLError, ssl.SSLError))","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/http/http_client.py#L118"},{"ref":"redis/http/http_client.py:279-323","code":"  279 |         try:\n  280 |             return self.retry.call_with_retry(\n  281 |                 lambda: self._make_request(req, context=context, timeout=timeout),\n  282 |                 lambda _: dummy_fail(),\n  283 |                 lambda error: self._is_retryable_http_error(error),\n  284 |             )\n  285 |         except HTTPError as e:
