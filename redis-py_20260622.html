ENTINEL, passing\n 1289 |         # ``timeout=None`` from this method will become the natural\n 1290 |         # \"no timeout\" signal and the math.inf hand-off can be\n 1291 |         # removed. That swap is a breaking change to the\n 1292 |         # Connection.read_response signature so it must wait for a\n 1293 |         # major release.\n 1294 |         read_timeout = math.inf if block else timeout\n 1295 |         response = await self._execute(\n 1296 |             conn,\n 1297 |             conn.read_response,\n 1298 |             timeout=read_timeout,\n 1299 |             disconnect_on_error=False,\n 1300 |             push_request=True,\n 1301 |         )\n 1302 | \n 1303 |         if conn.health_check_interval and response in self.health_check_response:\n 1304 |             # ignore the health check message as user might not expect it\n 1305 |             return None\n 1306 |         return response","lines":78,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/client.py#L1229-L1306"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"RedisCluster.transaction() calls the blocking `time.sleep(watch_delay)` inside an async coroutine on a WatchError retry, blocking the entire event loop for the duration of watch_delay. Every other await elsewhere in the file uses `await asyncio.sleep(...)`.","fix":"Replace `time.sleep(watch_delay)` with `await asyncio.sleep(watch_delay)`.","locations":[{"ref":"redis/asyncio/cluster.py:1453-1454","code":" 1453 |                     if watch_delay is not None and watch_delay > 0:\n 1454 |                         time.sleep(watch_delay)","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L1453-L1454"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In TransactionStrategy._reinitialize_on_error, after incrementing the cluster client's reinitialize_counter, the reset assigns `self.reinitialize_counter = 0` on the TransactionStrategy instance instead of the cluster client (`self._pipe.cluster_client.reinitialize_counter`). The counter that was incremented (cluster_client.reinitialize_counter) is therefore never reset, so once it first crosses a multiple of reinitialize_steps it keeps satisfying the modulo condition on subsequent errors (and creates a stray attribute on the strategy). This mirrors the same bug in the sync version (redis/cluster.py:4593), i.e. a copy-paste of an existing defect.","fix":"Reset the correct counter: `self._pipe.cluster_client.reinitialize_counter = 0`.","locations":[{"ref":"redis/asyncio/cluster.py:2992-3000","code":" 2992 |             self._pipe.cluster_client.reinitialize_counter += 1\n 2993 |             if (\n 2994 |                 self._pipe.cluster_client.reinitialize_steps\n 2995 |                 and self._pipe.cluster_client.reinitialize_counter\n 2996 |                 % self._pipe.cluster_client.reinitialize_steps\n 2997 |                 == 0\n 2998 |             ):\n 2999 |                 await self._pipe.cluster_client.nodes_manager.initialize()\n 3000 |                 self.reinitialize_counter = 0","lines":9,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L2992-L3000"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"move_slot() permanently rewrites the slots cache for AskError just like for MovedError. _reinitialize_on_error (transaction path) calls `await ...nodes_manager.move_slot(error)` for AskError, and move_slot sets the redirected node's server_type to PRIMARY and reassigns slots_cache[slot_id] to it. An ASK redirect is meant to be temporary (single-command redirect during slot migration) and should not durably change slot ownership or promote the target to PRIMARY. This corrupts the topology view until the next full refresh. The behavior mirrors the sync version, but is still incorrect.","fix":"Do not call move_slot for AskError; ASK should result in an ASKING redirect to the target node for that command only, without mutating slots_cache/server_type. Reserve move_slot for MovedError.","locations":[{"ref":"redis/asyncio/cluster.py:3002-3003","code":" 3002 |                 if isinstance(error, AskError):\n 3003 |                     await self._pipe.cluster_client.nodes_manager.move_slot(error)","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L3002-L3003"},{"ref":"redis/asyncio/cluster.py:1882-1919","code":" 1882 |     async def move_slot(self, e: AskError | MovedError):\n 1883 |         node_changed = False\n 1884 |         redirected_node = self.get_node(host=e.host, port=e.port)\n 1885 |         if redirected_node:\n 1886 |             # The node already exists\n 1887 |             if redirected_node.server_type != PRIMARY:\n 1888 |                 # Update the node's server type\n 1889 |                 redirected_node.server_type = PRIMARY\n 1890 |         else:\n 1891 |             # This is a new node, we will add it to the nodes cache\n 1892 |             redirected_node = ClusterNode(\n 1893 |                 e.host, e.port, PRIMARY, **self.connection_kwargs\n 1894 |             )\n 1895 |             self.set_nodes(self.nodes_cache, {redirected_node.name: redirected_node})\n 1896 |         slot_nodes = self.slots_cache[e.slot_id]\n 1897 |         if redirected_node not in slot_nodes:\n 1898 |             # The new slot owner is a new server, or a server from a different\n 1899 |             # shard. We need to remove all current nodes from the slot's list\n 1900 |             # (including replications) and add just the new node.\n 1901 |             self.slots_cache[e.slot_id] = [redirected_node]\n 1902 |             node_changed = True\n 1903 |         elif redirected_node is not slot_nodes[0]:\n 1904 |             # The MOVED error resulted from a failover, and the new slot owner\n 1905 |             # had previously been a replica.\n 1906 |             old_primary = slot_nodes[0]\n 1907 |             # Update the old primary to be a replica and add it to the end of\n 1908 |             # the slot's node list\n 1909 |             old_primary.server_type = REPLICA\n 1910 |             slot_nodes.append(old_primary)\n 1911 |             # Remove the old replica, which is now a primary, from the slot's\n 1912 |             # node list\n 1913 |             slot_nodes.remove(redirected_node)\n 1914 |             # Override the old primary with the new one\n 1915 |             slot_nodes[0] = redirected_node\n 1916 |             if self.default_node == old_primary:\n 1917 |                 # Update the default node with the new primary\n 1918 |                 self.default_node = redirected_node\n 1919 |             node_changed = True","lines":38,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L1882-L1919"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In on_connect_check_health(), the RESP3 HELLO-without-auth branch has its protocol-verification commented out (lines 525-528), while the HELLO-with-auth branch (lines 494-497) does verify response proto. So when no credentials are configured but protocol=3 is requested, a server that responds with a different/older proto is silently accepted, and the client proceeds believing it is on RESP3. This is dead commented-out code masking a real verification gap and diverges in behavior from the authenticated path.","fix":"Either restore the proto verification for the no-auth HELLO branch (mirroring lines 494-497, handling both b'proto' and 'proto' keys) or remove the misleading commented block and document why verification is intentionally skipped.","locations":[{"ref":"redis/asyncio/connection.py:523-528","code":"  523 |             await self.send_command(\"HELLO\", self.protocol, check_health=check_health)\n  524 |             response = await self.read_response()\n  525 |             # if response.get(b\"proto\") != self.protocol and response.get(\n  526 |             #     \"proto\"\n  527 |             # ) != self.protocol:\n  528 |             #     raise ConnectionError(\"Invalid RESP version\")","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L523-L528"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"AsyncClusterKeyspaceNotifications.get_message never (re)discovers nodes on its own; it only polls self._node_pubsubs, which is populated by subscribe()/refresh_subscriptions(). If the cluster starts with subscriptions tracked (_subscribed_patterns non-empty) but _node_pubsubs has been fully cleaned up after errors, get_message with total_nodes==0 just sleeps and returns None forever - it does not call refresh_subscriptions to rebuild the node pubsubs. The 'subscribed' property is based on tracked patterns, so listen()/run() will spin (sleep+return None) indefinitely without ever attempting to re-establish connections.","fix":"When total_nodes == 0 but there are tracked subscriptions and not closed, attempt self._refresh_subscriptions_on_error() (or refresh_subscriptions) before sleeping so the node pubsubs can be rebuilt after a full cleanup.","locations":[{"ref":"redis/asyncio/keyspace_notifications.py:826-836","code":"  826 |         if self._closed:\n  827 |             return None\n  828 | \n  829 |         total_nodes = len(self._node_pubsubs)\n  830 |         if total_nodes == 0:\n  831 |             # Sleep for the requested timeout so callers that loop\n  832 |             # (run(), listen) don't spin the CPU when all node\n  833 |             # connections have been cleaned up.\n  834 |             if timeout > 0:\n  835 |                 await asyncio.sleep(timeout)\n  836 |             return None","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/keyspace_notifications.py#L826-L836"},{"ref":"redis/asyncio/keyspace_notifications.py:656-660","code":"  656 |     def subscribed(self) -> bool:\n  657 |         \"\"\"Check if there are any active subscriptions and not closed.\"\"\"\n  658 |         return not self._closed and bool(\n  659 |             self._subscribed_patterns or self._subscribed_channels\n  660 |         )","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/keyspace_notifications.py#L656-L660"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Async Lock.release() clears self.local.token when do_release() raises LockNotOwnedError (lines 281-284), but the sync Lock.release() never clears the token on failure - it clears before calling do_release and lets the error propagate. More importantly, the async release docstring claims 'The token is only cleared after the Redis release operation completes successfully' (lines 269-271), which directly contradicts the except-branch that clears the token on the LockNotOwnedError failure path. The token-clearing behavior on a not-owned error also diverges from the sync mirror.","fix":"Reconcile the two stacks: either also clear-then-call in sync, or keep token on every failure in async. At minimum fix the docstring so it does not claim the token is only cleared on success when the LockNotOwnedError path clears it too.","locations":[{"ref":"redis/asyncio/lock.py:266-286","code":"  266 |     async def release(self) -> None:\n  267 |         \"\"\"Releases the already acquired lock.\n  268 | \n  269 |         The token is only cleared after the Redis release operation completes\n  270 |         successfully. This ensures that if the release is cancelled mid-operation,\n  271 |         the lock state remains consistent and can be retried.\n  272 |         \"\"\"\n  273 |         expected_token = self.local.token\n  274 |         if expected_token is None:\n  275 |             raise LockError(\n  276 |                 \"Cannot release a lock that's not owned or is already unlocked.\",\n  277 |                 lock_name=self.name,\n  278 |             )\n  279 |         try:\n  280 |             await self.do_release(expected_token)\n  281 |         except LockNotOwnedError:\n  282 |             # Lock doesn't exist in Redis, safe to clear token\n  283 |             self.local.token = None\n  284 |             raise\n  285 |         # Only clear token after successful release\n  286 |         self.local.token = None","lines":21,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/lock.py#L266-L286"},{"ref":"redis/lock.py:265-276","code":"  265 |     def release(self) -> None:\n  266 |         \"\"\"\n  267 |         Releases the already acquired lock\n  268 |         \"\"\"\n  269 |         expected_token = self.local.token\n  270 |         if expected_token is None:\n  271 |             raise LockError(\n  272 |                 \"Cannot release a lock that's not owned or is already unlocked.\",\n  273 |                 lock_name=self.name,\n  274 |             )\n  275 |         self.local.token = None\n  276 |         self.do_release(expected_token)","lines":12,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/lock.py#L265-L276"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Async _check_db_health reads self._health_checks without holding _hc_lock, racing with add_health_check. add_health_check acquires self._hc_lock before appending to self._health_checks, and ith call_soon_threadsafe onto that same running loop, but init_done.wait() then blocks that very thread, deadlocking if the loop cannot make progress because the calling thread is blocked. The sync start() is only safe when no loop runs in the calling thread.","fix":"Document/enforce that synchronous start() must not be called from a thread running an asyncio loop, or detect that case and use start_async instead of blocking on init_done.wait().","locations":[{"ref":"redis/auth/token_manager.py:136-182","code":"  136 |     def start(\n  137 |         self,\n  138 |         listener: CredentialsListener,\n  139 |         skip_initial: bool = False,\n  140 |     ) -> Callable[[], None]:\n  141 |         self._listener = listener\n  142 | \n  143 |         try:\n  144 |             loop = asyncio.get_running_loop()\n  145 |         except RuntimeError:\n  146 |             # Run loop in a separate thread to unblock main thread.\n  147 |             loop = asyncio.new_event_loop()\n  148 | \n  149 |             # Use threading.Event to signal when loop is ready\n  150 |             loop_ready = threading.Event()\n  151 | \n  152 |             def start_loop():\n  153 |                 # This runs in the background thread. First, bind the event loop to\n  154 |                 # this thread, then signal that the loop is ready so the calling\n  155 |                 # thread can safely schedule work (via call_soon_threadsafe) before\n  156 |                 # we block in run_forever().\n  157 |                 asyncio.set_event_loop(loop)\n  158 |                 loop_ready.set()  # Signal that loop is ready for cross-thread use\n  159 |                 loop.run_forever()\n  160 | \n  161 |             thread = threading.Thread(target=start_loop, daemon=True)\n  162 |             thread.start()\n  163 | \n  164 |             # Wait for the loop to be ready before scheduling\n  165 |             loop_ready.wait()\n  166 | \n  167 |         # Use thread-safe Event for cross-      try:\n  277 |             token_res = self.acquire_token(force_refresh=True)\n  278 |             delay = self._calculate_renewal_delay(\n  279 |                 token_res.get_token().get_expires_at_ms(),\n  280 |                 token_res.get_token().get_received_at_ms(),\n  281 |             )\n  282 | \n  283 |             if token_res.get_token().is_expired():\n  284 |                 raise TokenRenewalErr(\"Requested token is expired\")\n  285 | \n  286 |             if self._listener.on_next is None:\n  287 |                 logger.warning(\n  288 |                     \"No registered callback for token renewal task. Renewal cancelled\"\n  289 |                 )\n  290 |                 return\n  291 | \n  292 |             if not skip_initial:\n  293 |                 try:\n  294 |                     self._listener.on_next(token_res.get_token())\n  295 |                 except Exception as e:\n  296 |                     raise TokenRenewalErr(e)\n  297 | \n  298 |             if delay <= 0:\n  299 |                 return\n  300 | \n  301 |             loop = asyncio.get_running_loop()\n  302 |             self._next_timer = loop.call_later(delay, self._renew_token)\n  303 |             logger.info(f\"Next token renewal scheduled in {delay} seconds\")\n  304 |             return token_res\n  305 |         except Exception as e:\n  306 |             if self._listener.on_error is None:\n  307 |                 raise e\n  308 | \n  309 |             self._listener.on_error(e)","lines":40,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/auth/token_manager.py#L270-L309"},{"ref":"redis/auth/token_manager.py:311-352","code":"  311 |     async def _renew_token_async(\n  312 |         self, skip_initial: bool = False, init_event: asyncio.Event = None\n  313 |     ):\n  314 |         \"\"\"\n  315 |         Async task to renew tokens from identity provider.\n  316 |         Schedules renewal tasks based on token TTL.\ loop can set self._health_check_loop = None on a start timeout (raising). In run_coro_fire_and_forget and run_recurring_coro the loop variable is captured after _ensure_health_check_loop returns successfully, which is fine, but there is no re-check that loop is not None and is_running before call_soon_threadsafe / run_coroutine_threadsafe; if the loop was stopped between the lock release and the schedule call (e.g. stop() racing), run_coroutine_threadsafe will raise RuntimeError('Event loop is closed') with no handling, surfacing as an unexpected error to the caller.","fix":"Hold the operation under the lock or re-validate loop.is_running() and handle the closed-loop race (catch RuntimeError) before scheduling.","locations":[{"ref":"redis/background.py:104-110","code":"  104 |         with self._lock:\n  105 |             loop = self._health_check_loop\n  106 | \n  107 |         # Schedule recurring execution in the shared loop\n  108 |         loop.call_soon_threadsafe(\n  109 |             self._call_later_recurring_coro, loop, interval, coro, *args\n  110 |         )","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/background.py#L104-L110"},{"ref":"redis/background.py:148-158","code":"  148 |         with self._lock:\n  149 |             loop = self._health_check_loop\n  150 | \n  151 |         # Submit the coroutine to the shared loop and wait for result\n  152 |         future = asyncio.run_coroutine_threadsafe(coro(*args), loop)\n  153 |         try:\n  154 |             return future.result(timeout=timeout)\n  155 |         except TimeoutError:\n  156 |             # Cancel the future to avoid leaving orphaned tasks\n  157 |             future.cancel()\n  158 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/background.py#L148-L158"},{"ref":"redis/background.py:180-196","code":"  180 | \n  181 |         with self._lock:\n  182 |             loop = self._health_check_loop\n  183 | \n  184 |         def on_complete(future: asyncio.Future):\n  185 |             \"\"\"Log any exceptions from the coroutine.\"\"\"\n  186 |             if future.cancelled():\n  187 |                 logging.getLogger(__name__).debug(\"Fire-and-forget coroutine cancelled\")\n  188 |             elif future.exception() is not None:\n  189 |                 logging.getLogger(__name__).debug(\n  190 |                     \"Fire-and-forget coroutine raised exception\",\n  191 |                     exc_info=future.exception(),\n  192 |                 )\n  193 | \n  194 |         # Schedule on the shared loop without waiting\n  195 |         future = asyncio.run_coroutine_threadsafe(coro(*args), loop)\n  196 |         future.add_done_callback(on_complete)","lines":17,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/background.py#L180-L196"}]},{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"CacheEntry.__eq__ compares by hash equality (`hash(self) == hash(other)`) instead of comparing field values. Two distinct entries that happen to collide on the 64-bit hash will be considered equal, and __eq__ does not even check that `other` is a CacheEntry, so any object whose hash collides compares equal. This is a latent correctness bug for any set/dict membership or equality test on CacheEntry.","fix":"Implement __eq__ by comparing the actual fields (cache_key, cache_value, status, connection_ref) and return NotImplemented for non-CacheEntry operands.","locations":[{"ref":"redis/cache.py:52-58","code":"   52 |     def __hash__(self):\n   53 |         return hash(\n   54 |             (self.cache_key, self.cache_value, self.status, self.connection_ref)\n   55 |         )\n   56 | \n   57 |     def __eq__(self, other):\n   58 |         return hash(self) == hash(other)","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cache.py#L52-L58"}]},{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"CacheProxy.set evicts at most one entry after an insertion, so the cache can permanently exceed max_size. is_exceeds_max_size uses `count > max_size` and only a single evict_next() is performed per set(). If the cache is somehow over capacity by more than one (e.g. max_size lowered at runtime, or concurrent inserts), it will never shrink back to the limit because each set() removes exactly one item while potentially adding one. Eviction should loop until size <= max_size.","fix":"Loop while self.config.is_exceeds_max_size(self.size): evict_next(), recording the eviction count, instead of a single conditional evict_next().","locations":[{"ref":"redis/cache.py:277-290","code":"  277 |     def set(self, entry: CacheEntry) -> bool:\n  278 |         is_set = self._cache.set(entry)\n  279 | \n  280 |         if self.config.is_exceeds_max_size(self.size):\n  281 |             # Lazy import to avoid circular dependency\n  282 |             from redis.observability.recorder import record_csc_eviction\n  283 | \n  284 |             record_csc_eviction(\n  285 |                 count=1,\n  286 |                 reason=CSCReason.FULL,\n  287 |             )\n  288 |             self.eviction_policy.evict_next()\n  289 | \n  290 |         return is_set","lines":14,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cache.py#L277-L290"},{"ref":"redis/cache.py:457-458","code":"  457 |     def is_exceeds_max_size(self, count: int) -> bool:\n  458 |         return count > self._max_size","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cache.py#L457-L458"}]},{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"_execute_transaction releases via self.connection.disconnect() on a length-mismatch error (line 1928), but uses the parameter `connection` everywhere else in the method. If self.connection was reassigned or differs from the passed-in connection, the wrong connection is disconnected; more importantly self.connection could be None here in some call paths (the method receives connection explicitly), causing AttributeError instead of the intended ResponseError.","fix":"Use the local `connection` parameter consistently: `connection.disconnect()`.","locations":[{"ref":"redis/client.py:1927-1931","code":" 1927 |         if len(response) != len(commands):\n 1928 |             self.connection.disconnect()\n 1929 |             raise ResponseError(\n 1930 |                 \"Wrong number of response items from pipeline execution\"\n 1931 |             )","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L1927-L1931"}]},{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"determine_slot returns a random slot for EVAL/EVALSHA/FCALL with zero keys, which is non-deterministic and can route to a node that does not have the script loaded. For EVALSHA in particular, picking `random.randrange(0, REDIS_CLUSTER_HASH_SLOTS)` (lines 1422, 1430) sends the command to an arbitrary node; if the script was loaded only on some nodes (e.g. via SCRIPT LOAD which is broadcast to PRIMARIES), a keyless EVALSHA may still hit a node missing the SHA on retry randomness, producing intermittent NOSCRIPT errors that are not deterministically reproducible.","fix":"For keyless scripts, prefer a stable default node (or broadcast/replicate as appropriate) rather than a fresh random slot per call, so behavior is deterministic and consistent with where scripts are loaded.","locations":[{"ref":"redis/cluster.py:1419-1430","code":" 1419 |             # if there are 0 keys, that means the script can be run on any node\n 1420 |             # so we can just return a random slot\n 1421 |             if len(eval_keys) == 0:\n 1422 |                 return random.randrange(0, REDIS_CLUSTER_HASH_SLOTS)\n 1423 |             keys = eval_keys\n 1424 |         else:\n 1425 |             keys = self._get_command_keys(*args)\n 1426 |             if keys is None or len(keys) == 0:\n 1427 |                 # FCALL can call a function with 0 keys, that means the function\n 1428 |                 #  can be run on any node so we can just return a random slot\n 1429 |                 if command.upper() in (\"FCALL\", \"FCALL_RO\"):\n 1430 |                     return random.randrange(0, REDIS_CLUSTER_HASH_SLOTS)","lines":12,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L1419-L1430"}]},{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"PipelineStrategy._determine_nodes stores FT.AGGREGATE target nodes on the wrong object. At line 4362 it assigns `self._aggregate_nodes = nodes` where `self` is the PipelineStrategy, but the SPECIAL-policy callback get_special_nodes (used for FT.CURSOR) is bound to `self._pipe.get_special_nodes` and reads `self._pipe._aggregate_nodes`. The strategy never sets the attribute on the pipe (and the pipe never initializes `_aggregate_nodes`), so a pipelined FT.AGGREGATE followed by FT.CURSOR will fail with `Cannot execute FT.CURSOR commands without FT.AGGREGATE` or AttributeError, even though FT.AGGREGATE ran.","fix":"Assign to the pipe (e.g. `self._pipe._aggregate_nodes = nodes`) and ensure ClusterPipeline initializes `_aggregate_nodes = None`.","locations":[{"ref":"redis/cluster.py:4361-4362","code":" 4361 |         if args[0].lower() == \"ft.aggregate\":\n 4362 |             self._aggregate_nodes = nodes","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L4361-L4362"},{"ref":"redis/cluster.py:1099-1108","code":" 1099 |     def get_special_nodes(self) -> Optional[list[\"ClusterNode\"]]:\n 1100 |         \"\"\"\n 1101 |         Returns a list of nodes for commands with a special policy.\n 1102 |         \"\"\"\n 1103 |         if not self._aggregate_nodes:\n 1104 |             raise RedisClusterException(\n 1105 |                 \"Cannot execute FT.CURSOR commands without FT.AGGREGATE\"\n 1106 |             )\n 1107 | \n 1108 |         return self._aggregate_nodes","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L1099-L1108"}]},{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"TransactionStrategy._reinitialize_on_error resets the wrong attribute. After incrementing `self._pipe.reinitialize_counter` (line 4590) and conditionally reinitializing, it sets `self.reinitialize_counter = 0` (line 4593) which creates/mutates a brand-new attribute on the TransactionStrategy object instead of resetting `self._pipe.reinitialize_counter`. Consequently the pipe's reinitialize counter is never reset after a forced reinitialization, so `_should_reinitialized()` (which computes `reinitialize_counter % reinitialize_steps == 0`) drifts and the topology will be force-reinitialized on a different cadence than intended. Compare with RedisCluster._execute_command (line 1778) and PipelineStrategy which correctly reset the counter on the pipe.","fix":"Change line 4593 to `self._pipe.reinitialize_counter = 0` to reset the same counter that was incremented.","locations":[{"ref":"redis/cluster.py:4590-4593","code":" 4590 |             self._pipe.reinitialize_counter += 1\n 4591 |             if self._pipe._should_reinitialized():\n 4592 |                 self._nodes_manager.initialize()\n 4593 |                 self.reinitialize_counter = 0","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L4590-L4593"}]},{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"TransactionStrategy._execute_transaction mixes bare exceptions and (index, exception) tuples in the `errors` list, then unpacks all of them as tuples. Lines 4670, 4684, 4690 append bare exception objects (`errors.append(e)` / `errors.append(slot_error)`), while line 4678 appends a tuple `(i, command.options[EMPTY_RESPONSE])`. Later, line 4718 does `for i, e in errors: response.insert(i, e)`, which unpacks every element as a 2-tuple. If a bare exception object (e.g. a ResponseError from parsing MULTI at line 4670) is present while EXEC still returns a non-None response, the unpack raises TypeError (or silently iterates the exception's args), corrupting error reporting for the transaction.","fix":"Make the `errors` list homogeneous: always append `(index, exception)` tuples (e.g. `errors.append((0, e))` for MULTI and `errors.append((i + 1, e))` for per-command errors), or separate the two error categories into distinct lists and handle each appropriately before inserting into the response.","locations":[{"ref":"redis/cluster.py:4668-4690","code":" 4668 |         except ResponseError as e:\n 4669 |             self.annotate_exception(e, 0, \"MULTI\")\n 4670 |             errors.append(e)\n 4671 |         except self.CONNECTION_ERRORS as cluster_error:\n 4672 |             self.annotate_exception(cluster_error, 0, \"MULTI\")\n 4673 |             raise\n 4674 | \n 4675 |         # and all the other commands\n 4676 |         for i, command in enumerate(self._command_queue):\n 4677 |             if EMPTY_RESPONSE in command.options:\n 4678 |                 errors.append((i, command.options[EMPTY_RESPONSE]))\n 4679 |             else:\n 4680 |                 try:\n 4681 |                     _ = redis_node.parse_response(connection, \"_\")\n 4682 |                 except self.SLOT_REDIRECT_ERRORS as slot_error:\n 4683 |                     self.annotate_exception(slot_error, i + 1, command.args)\n 4684 |                     errors.append(slot_error)\n 4685 |                 except self.CONNECTION_ERRORS as cluster_error:\n 4686 |                     self.annotate_exception(cluster_error, i + 1, command.args)\n 4687 |                     raise\n 4688 |                 except ResponseError as e:\n 4689 |                     self.annotate_exception(e, i + 1, command.args)\n 4690 |                     errors.append(e)","lines":23,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L4668-L4690"},{"ref":"redis/cluster.py:4717-4719","code":" 4717 |         # put any parse errors into the response\n 4718 |         for i, e in errors:\n 4719 |             response.insert(i, e)","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L4717-L4719"}]},{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"mget_nonatomic collapses duplicate keys via a dict in _reorder_keys_by_command, but the partitioning de-duplicates inconsistently. _partition_keys_by_slot appends every occurrence of a key (including duplicates) to its slot list, so MGET is sent the key twice and the response has two values; _reorder_keys_by_command then builds `results` as a dict keyed by key, so the last value wins and the per-key value is still correct. However if the same key appears in the user's list and the MGET response order is positional, the zip(slot_values, response) still aligns. The real defect is subtler: when the SAME key is requested multiple times, the second occurrence's value silently overwrites the first in the dict, which is fine for MGET (same value) but for `_split_command_across_slots`-style summing semantics duplicate keys are NOT de-duplicated, so EXISTS/TOUCH/DEL count a duplicated key more than once - matching server EXISTS semantics but DEL/UNLINK/TOUCH would double-count if a key appears twice in a single slot batch (server returns count of distinct deleted keys per call, so summing is correct; but a key duplicated across the SAME slot is sent twice in one command and counted once by the server, while the user passed it twice). This is an edge inconsistency between the two reorder/sum paths.","fix":"Document that duplicate keys are not well-defined for these helpers, or de-duplicate keys per slot before issuing commands so behavior is deterministic across mget/exists/delete.","locations":[{"ref":"redis/commands/cluster.py:218-229","code":"  218 |     def _reorder_keys_by_command(\n  219 |         self,\n  220 |         keys: Iterable[KeyT],\n  221 |         slots_to_args: Mapping[int, Iterable[EncodableT]],\n  222 |         responses: Iterable[Any],\n  223 |     ) -> List[Any]:\n  224 |         results = {\n  225 |             k: v\n  226 |             for slot_values, response in zip(slots_to_args.values(), responses)\n  227 |             for k, v in zip(slot_values, response)\n  228 |         }\n  229 |         return [results[key] for key in keys]","lines":12,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/cluster.py#L218-L229"},{"ref":"redis/commands/cluster.py:179-187","code":"  179 |     def _partition_keys_by_slot(self, keys: Iterable[KeyT]) -> Dict[int, List[KeyT]]:\n  180 |         \"\"\"Split keys into a dictionary that maps a slot to a list of keys.\"\"\"\n  181 | \n  182 |         slots_to_keys = {}\n  183 |         for key in keys:\n  184 |             slot = key_slot(self.encoder.encode(key))\n  185 |             slots_to_keys.setdefault(slot, []).append(key)\n  186 | \n  187 |         return slots_to_keys","lines":9,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/cluster.py#L179-L187"}]},{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"hscan passes NOVALUES to the server only when `no_values is not None` (i.e. when it is True OR False). Passing no_values=False explicitly will still append b'NOVALUES' to the wire command, because the guard tests `is not None` rather than truthiness, turning an explicit 'I want values' into 'no values'. The response-parsing path receives no_values=False but the server was told NOVALUES, so values are dropped. Should test `if no_values:`.","fix":"Change `if no_values is not None:` to `if no_values:` so NOVALUES is only sent when truthy.","locations":[{"ref":"redis/commands/core.py:6105-6107","code":" 6105 |         if no_values is not None:\n 6106 |             pieces.extend([b\"NOVALUES\"])\n 6107 |         return self.execute_command(\"HSCAN\", *pieces, no_values=no_values)","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L6105-L6107"}]},{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"geosearch / _geosearchgeneric build the BYBOX clause with `if kwargs['width'] and kwargs['height']`, and the FROMLONLAT validation uses truthiness too. A width or height of 0 (a degenerate but representable box edge) is falsy, so BYBOX is silently dropped and the earlier guard `if kwargs['radius'] is None: if kwargs['width'] is None or kwargs['height'] is None` does NOT catch width=0/height=0 (0 is not None), producing a malformed GEOSEARCH command with no shape clause. Same truthiness pitfall affects longitude/latitude == 0 in FROMLONLAT: `if kwargs['longitude'] or kwargs['latitude']` and `if kwargs['member']` paths, though the FROMLONLAT add uses `is not None` correctly, the member/lonlat conflict check uses truthiness so a longitude of 0.0 with a member set would not be detected as a conflict.","fix":"Use explicit `is not None` checks for width/height/longitude/latitude instead of truthiness when deciding whether the user supplied them.","locations":[{"ref":"redis/commands/core.py:11606-11630","code":"11606 |         if kwargs[\"member\"]:\n11607 |             if kwargs[\"longitude\"] or kwargs[\"latitude\"]:\n11608 |                 raise DataError(\n11609 |                     \"GEOSEARCH member and longitude or latitude can't be set together\"\n11610 |                 )\n11611 |             pieces.extend([b\"FROMMEMBER\", kwargs[\"member\"]])\n11612 |         if kwargs[\"longitude\"] is not None and kwargs[\"latitude\"] is not None:\n11613 |             pieces.extend([b\"FROMLONLAT\", kwargs[\"longitude\"], kwargs[\"latitude\"]])\n11614 | \n11615 |         # BYRADIUS or BYBOX\n11616 |         if kwargs[\"radius\"] is None:\n11617 |             if kwargs[\"width\"] is None or kwargs[\"height\"] is None:\n11618 |                 raise DataError(\"GEOSEARCH must have radius or width and height\")\n11619 |         if kwargs[\"unit\"] is None:\n11620 |             raise DataError(\"GEOSEARCH must have unit\")\n11621 |         if kwargs[\"unit\"].lower() not in (\"m\", \"km\", \"mi\", \"ft\"):\n11622 |             raise DataError(\"GEOSEARCH invalid unit\")\n11623 |         if kwargs[\"radius\"]:\n11624 |             if kwargs[\"width\"] or kwargs[\"height\"]:\n11625 |                 raise DataError(\n11626 |                     \"GEOSEARCH radius and width or height can't be set together\"\n11627 |                 )\n11628 |             pieces.extend([b\"BYRADIUS\", kwargs[\"radius\"], kwargs[\"unit\"]])\n11629 |         if kwargs[\"width\"] and kwargs[\"height\"]:\n11630 |             pieces.extend([b\"BYBOX\", kwargs[\"width\"], kwargs[\"height\"], kwargs[\"unit\"]])","lines":25,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L11606-L11630"}]},{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"function_list always sends `LIBRARYNAME <library>` because library defaults to '*' and the code unconditionally does `args = ['LIBRARYNAME', library]`. The FUNCTION LIST command's LIBRARYNAME filter expects a specific library name, not a glob pattern; sending `LIBRARYNAME *` filters for a library literally named '*' on servers that do not treat it as a wildcard, so the default call may return nothing instead of listing all libraries. The optional filter should be omitted entirely when no library is requested.","fix":"Only append `['LIBRARYNAME', library]` when `library` is not None / not the sentinel '*'; otherwise send FUNCTION LIST with no LIBRARYNAME clause.","locations":[{"ref":"redis/commands/core.py:11926-11941","code":"11926 |     def function_list(\n11927 |         self, library: str | None = \"*\", withcode: bool | None = False\n11928 |     ) -> list[Any] | Awaitable[list[Any]]:\n11929 |         \"\"\"\n11930 |         Return information about the functions and libraries.\n11931 | \n11932 |         Args:\n11933 | \n11934 |             library: specify a pattern for matching library names\n11935 |             withcode: cause the server to include the libraries source implementation\n11936 |                 in the reply\n11937 |         \"\"\"\n11938 |         args = [\"LIBRARYNAME\", library]\n11939 |         if withcode:\n11940 |             args.append(\"WITHCODE\")\n11941 |         return self.execute_command(\"FUNCTION LIST\", *args)","lines":16,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L11926-L11941"}]},{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"nativestr() silently converts the literal string/bytes value \"null\" into Python None. Any genuine field whose value is the text \"null\" (e.g. a JSON string field, a tag value, a stored value that happens to be \"null\") is destroyed and indistinguishable from a real missing value. This is used widely by module response parsing (search/json) and delist()/parse_to_list build on it.","fix":"Do not special-case the string \"null\" inside the generic decoder. Handle JSON-null conversion only where the protocol actually represents null as the literal \"null\", not in a shared string-decoding utility.","locations":[{"ref":"redis/commands/helpers.py:58-63","code":"   58 | def nativestr(x):\n   59 |     \"\"\"Return the decoded binary string, or a string, depending on type.\"\"\"\n   60 |     r = x.decode(\"utf-8\", \"replace\") if isinstance(x, bytes) else x\n   61 |     if r == \"null\":\n   62 |         return\n   63 |     return r","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/helpers.py#L58-L63"}]},{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"JSON.set_path / async set_path derive the stored key with `file_path.rsplit(\".\")[0]`, which splits on every dot, so a path like `/data/v1.2/report.json` yields the key `/data/v1` instead of `/data/v1.2/report`. The TODO comment acknowledges this but the bug ships. Files in dotted directories get wrong (and colliding) keys.","fix":"Use `file_path.rsplit(\".\", 1)[0]` (or os.path.splitext) to strip only the final extension. Apply to both the sync and async copies.","locations":[{"ref":"redis/commands/json/commands.py:707-710","code":"  707 |                     # TODO: rsplit(\".\") splits on all dots, mishandling paths\n  708 |                     # with dots in directories (e.g. /data/v1.2/file.json).\n  709 |                     # Should be rsplit(\".\", 1) — fix in a separate PR.\n  710 |                     file_name = file_path.rsplit(\".\")[0]","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/json/commands.py#L707-L710"},{"ref":"redis/commands/json/__init__.py:349-352","code":"  349 |                 # TODO: rsplit(\".\") splits on all dots, mishandling paths\n  350 |                 # with dots in directories (e.g. /data/v1.2/file.json).\n  351 |                 # Should be rsplit(\".\", 1) — fix in a separate PR.\n  352 |                 file_name = file_path.rsplit(\".\")[0]","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/json/__init__.py#L349-L352"}]},{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"TSInfo declares class-level default attributes `last_time_stamp` and `first_time_stamp` (note the extra underscore/word split), but __init__ sets the instance attributes `last_timestamp` and `first_timestamp`. The misspelled class defaults are therefore dead, and worse: if a TS.INFO response omits `lastTimestamp`/`firstTimestamp`, `info.last_timestamp` raises AttributeError (no instance attr and no correctly-named class default) instead of returning the intended `None`. Also note `source_key` has no class default at all, unlike the other fields.","fix":"Rename the class-level defaults to `last_timestamp = None` and `first_timestamp = None` (matching what __init__ assigns), and add `source_key = None`. Remove the misspelled `last_time_stamp`/`first_time_stamp` attributes.","locations":[{"ref":"redis/commands/timeseries/info.py:37-38","code":"   37 |     last_time_stamp = None\n   38 |     first_time_stamp = None","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/timeseries/info.py#L37-L38"},{"ref":"redis/commands/timeseries/info.py:90-96","code":"   90 |         self.source_key = response.get(\"sourceKey\")\n   91 |         self.chunk_count = response.get(\"chunkCount\")\n   92 |         self.memory_usage = response.get(\"memoryUsage\")\n   93 |         self.total_samples = response.get(\"totalSamples\")\n   94 |         self.retention_msecs = response.get(\"retentionTime\")\n   95 |         self.last_timestamp = response.get(\"lastTimestamp\")\n   96 |  immediately calls self._parser.can_read(timeout). connect() establishes self._sock and wires the parser via on_connect, but if connect() somehow leaves the parser without a socket buffer this dereferences a parser with no _sock. More importantly, after connecting, the method proceeds to poll a freshly connected socket for readable data which is conceptually the right behavior, but the 'if not sock: self.connect()' branch silently reconnects inside a readiness probe, which can mask logic errors and surprise callers expecting can_read on a closed connection to be cheap/non-reconnecting.","fix":"After self.connect(), refresh the local 'sock' reference and guard the subsequent parser.can_read call; or document/limit the implicit reconnect. At minimum, avoid relying on the stale 'sock' local after connecting.","locations":[{"ref":"redis/connection.py:1341-1356","code":" 1341 |     def can_read(self, timeout: float = 0) -> bool:\n 1342 |         \"\"\"Poll the socket to see if there's data that can be read.\"\"\"\n 1343 |         # TODO: Rename this API; it detects pending data or dirty/closed\n 1344 |         # connection state, not only whether application data can be read.\n 1345 |         sock = self._sock\n 1346 |         if not sock:\n 1347 |             self.connect()\n 1348 | \n 1349 |         host_error = self._host_error()\n 1350 | \n 1351 |         try:\n 1352 |             return self._parser.can_read(timeout)\n 1353 | \n 1354 |         except OSError as e:\n 1355 |             self.disconnect()\n 1356 |             raise ConnectionError(f\"Error while reading from {host_error}: {e.args}\")","lines":16,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L1341-L1356"}]},{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"BlockingConnectionPool uses a single shared self._locked boolean flag across the reset/make_connection/get_connection/release/ emaining weight regardless of whether the removed DB was actually the active database. This can force an unnecessary failover (and its connection-teardown side effects) when removing a non-active database.","fix":"Only re-elect the active database when the removed database was the current active one (or when the current active DB is no longer present/healthy), rather than purely on weight comparison.","locations":[{"ref":"redis/multidb/client.py:234-248","code":"  234 |     def remove_database(self, database: Database):\n  235 |         \"\"\"\n  236 |         Removes a database from the database list.\n  237 |         \"\"\"\n  238 |         weight = self._databases.remove(database)\n  239 |         highest_weighted_db, highest_weight = self._databases.get_top_n(1)[0]\n  240 | \n  241 |         if (\n  242 |             highest_weight <= weight\n  243 |             and highest_weighted_db.circuit.state == CBState.CLOSED\n  244 |         ):\n  245 |             self.command_executor.active_database = (\n  246 |                 highest_weighted_db,\n  247 |                 GeoFailoverReason.MANUAL,\n  248 |             )","lines":15,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/client.py#L234-L248"},{"ref":"redis/asyncio/multidb/client.py:238-251","code":"  238 |     async def remove_database(self, database: AsyncDatabase):\n  239 |         \"\"\"\n  240 |         Removes a database from the database list.\n  241 |         \"\"\"\n  242 |         weight = self._databases.remove(database)\n  243 |         highest_weighted_db, highest_weight = self._databases.get_top_n(1)[0]\n  244 | \n  245 |         if (\n  246 |             highest_weight <= weight\n  247 |             and highest_weighted_db.circuit.state == CBState.CLOSED\n  248 |         ):\n  249 |             await self.command_executor.set_active_database(\n  250 |                 highest_weighted_db, GeoFailoverReason.MANUAL\n  251 |             )","lines":14,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/client.py#L238-L251"}]},{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Failure-rate window is only advanced/reset on command execution, not on failures, so failures accumulate across stale windows. register_command_execution() checks 'if not start_time < now < end_time: reset()' before counting an execution, but register_failure() never performs this window check and simply increments _failures_count and calls _check_threshold(). If failures arrive in a window where few/no successful executions have advanced the window, or after the window has logically expired but no execution reset it, the failure count is evaluated against a stale _commands_executed and a stale window. This makes the sliding-window failure-rate semantics inaccurate (failures from an old window can trip the threshold).","fix":"Perform the same window-expiry check (and _reset) inside register_failure() before incrementing _failures_count, so failures and executions share a consistent sliding window.","locations":[{"ref":"redis/multidb/failure_detector.py:68-93","code":"   68 |     def register_failure(self, exception: Exception, cmd: tuple) -> None:\n   69 |         with self._lock:\n   70 |             if self._error_types:\n   71 |                 if type(exception) in self._error_types:\n   72 |                     self._failures_count += 1\n   73 |             else:\n   74 |                 self._failures_count += 1\n   75 | \n   76 |             self._check_threshold()\n   77 | \n   78 |     def set_command_executor(self, command_executor) -> None:\n   79 |         self._command_executor = command_executor\n   80 | \n   81 |     def register_command_execution(self, cmd: tuple) -> None:\n   82 |         with self._lock:\n   83 |             if not self._start_time < datetime.now() < self._end_time:\n   84 |                 self._reset()\n   85 | \n   86 |             self._commands_executed += 1\n   87 | \n   88 |     def _check_threshold(self):\n   89 |         if self._failures_count >= self._min_num_failures and self._failures_count >= (\n   90 |             math.ceil(self._commands_executed * self._failure_rate_threshold)\n   91 |         ):\n   92 |             self._command_executor.active_database.circuit.state = CBState.OPEN\n   93 |             self._reset()","lines":26,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/failure_detector.py#L68-L93"}]},{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"record_streaming_lag_from_response uses datetime.now().timestamp() (local naive time) as 'now' and subtracts the stream message timestamp which is epoch-milliseconds (UTC). datetime.now() returns local time; .timestamp() on a naive datetime interprets it as local time and converts to a POSIX (UTC) timestamp, so this happens to be UTC-correct - but it is fragile and inconsistent with the rest of the codebase that uses datetime.now(timezone.utc). More importantly, message_id.split('-') with int(timestamp) will raise ValueError on malformed/non-standard IDs; the whole loop is wrapped in a bare except that silently drops ALL lag recording for the batch on the first bad ID. Both sync and async copies share this.","fix":"Use datetime.now(timezone.utc).timestamp() for clarity, and parse/record per-message inside an inner try/except so one malformed message ID does not discard lag for the entire response.","locations":[{"ref":"redis/observability/recorder.py:568-613","code":"  568 |     try:\n  569 |         now = datetime.now().timestamp()\n  570 | \n  571 |         # Check if stream names should be hidden\n  572 |         config = _get_config()\n  573 |         hide_stream_names = config is not None and config.hide_stream_names\n  574 | \n  575 |         # RESP3 format: dict\n  576 |         if isinstance(response, dict):\n  577 |             for stream_name, stream_messages in response.items():\n  578 |                 effective_stream_name = (\n  579 |                     None if hide_stream_names else str_if_bytes(stream_name)\n  580 |                 )\n  581 |                 for messages in stream_messages:\n  582 |                     for message in messages:\n  583 |                         message_id, _ = message\n  584 |                         message_id = str_if_bytes(message_id)\n  585 |                         timestamp, _ = message_id.split(\"-\")\n  586 |                         # Ensure lag is non-negative (clock skew can cause negative values)\n  587 |                         lag_seconds = max(0.0, now - int(timestamp) / 1000)\n  588 | \n  589 |                         _metrics_collector.record_streaming_lag(\n  590 |                             lag_seconds=lag_seconds,\n  591 |                             stream_name=effective_stream_name,\n  592 |                             consumer_group=consumer_group,\n  593 |                         )\n  594 |         else:\n  595 |             # RESP2 format: list\n  596 |             for stream_entry in response:\n  597 |                 stream_name = str_if_bytes(stream_entry[0])\n  598 |                 effective_stream_name = None if hide_stream_names else stream_name\n  599 | \n  600 |                 for message in stream_entry[1]:\n  601 |                     message_id, _ = message\n  602 |                     message_id = str_if_bytes(message_id)\n  603 |                     timestamp, _ = message_id.split(\"-\")\n  604 |                     # Ensure lag is non-negative (clock skew can cause negative values)\n  605 |                     lag_seconds = max(0.0, now - int(timestamp) / 1000)\n  606 | \n  607 |                     _metrics_collector.record_streaming_lag(\n  608 |                         lag_seconds=lag_seconds,\n  609 |                         stream_name=effective_stream_name,\n  610 |                         consumer_group=consumer_group,\n  611 |                     )\n  612 |     except Exception:\n  613 |         pass","lines":46,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/observability/recorder.py#L568-L613"},{"ref":"redis/asyncio/observability/recorder.py:511-556","code":"  511 |     try:\n  512 |         now = datetime.now().timestamp()\n  513 | \n  514 |         # Check if stream names should be hidden\n  515 |         config = await _get_config()\n  516 |         hide_stream_names = config is not None and config.hide_stream_names\n  517 | \n  518 |         # RESP3 format: dict\n  519 |         if isinstance(response, dict):\n  520 |             for stream_name, stream_messages in response.items():\n  521 |                 effective_stream_name = (\n  522 |                     None if hide_stream_names else str_if_bytes(stream_name)\n  523 |                 )\n  524 |                 for messages in stream_messages:\n  525 |                     for message in messages:\n  526 |                         message_id, _ = message\n  527 |                         message_id = str_if_bytes(message_id)\n  528 |                         timestamp, _ = message_id.split(\"-\")\n  529 |                         # Ensure lag is non-negative (clock skew can cause negative values)\n  530 |                         lag_seconds = max(0.0, now - int(timestamp) / 1000)\n  531 | \n  532 |                         collector.record_streaming_lag(\n  533 |                             lag_seconds=lag_seconds,\n  534 |                             stream_name=effective_stream_name,\n  535 |                             consumer_group=consumer_group,\n  536 |                         )\n  537 |         else:\n  538 |             # RESP2 format: list\n  539 |             for stream_entry in response:\n  540 |                 stream_name = str_if_bytes(stream_entry[0])\n  541 |                 effective_stream_name = None if hide_stream_names else stream_name\n  542 | \n  543 |                 for message in stream_entry[1]:\n  544 |                     message_id, _ = message\n  545 |                     message_id = str_if_bytes(message_id)\n  546 |                     timestamp, _ = message_id.split(\"-\")\n  547 |                     # Ensure lag is non-negative (clock skew can cause negative values)\n  548 |                     lag_seconds = max(0.0, now - int(timestamp) / 1000)\n  549 | \n  550 |                     collector.record_streaming_lag(\n  551 |                         lag_seconds=lag_seconds,\n  552 |                         stream_name=effective_stream_name,\n  553 |                         consumer_group=consumer_group,\n  554 |                     )\n  555 |     except Exception:\n  556 |         pass","lines":46,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/observability/recorder.py#L511-L556"}]},{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"OCSP _check_certificate responder-selection condition relies on Python operator precedence in a way that is almost certainly not intended: `responder_name is not None and responder_name == issuer_cert.subject or responder_hash == issuer_hash` parses as `(responder_name is not None and responder_name == issuer_cert.subject) or (responder_hash == issuer_hash)`. If both responder_hash and issuer_hash are None (responder identified by name but no key hash present), the right operand `None == None` is True, so the issuer cert is trusted as the OCSP signer without checking the name. This is a security-relevant validation gap.","fix":"Add explicit parentheses and guard against None hashes: only treat issuer as signer when responder_hash is not None and equals issuer_hash, or when responder_name matches issuer subject.","locations":[{"ref":"redis/ocsp.py:82-87","code":"   82 |     if (\n   83 |         responder_name is not None\n   84 |         and responder_name == issuer_cert.subject\n   85 |         or responder_hash == issuer_hash\n   86 |     ):\n   87 |         cert_to_validate = issuer_cert","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/ocsp.py#L82-L87"}]},{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"OCSPVerifier.is_valid catches AuthorizationError from socket-based validation and retries via components_from_direct_connection(). AuthorizationError means the OCSP responder returned UNAUTHORIZED (response status), which is a definitive responder answer, not a transient socket issue; retrying against a freshly fetched server certificate masks an authoritative UNAUTHORIZED and can turn a legitimate failure into a success if the second path produces a different (e.g. GOOD) response. This weakens revocation enforcement.","fix":"Do not treat responder UNAUTHORIZED as a retry trigger; only retry on socket/connection-level errors, and propagate AuthorizationError.","locations":[{"ref":"redis/ocsp.py:298-308","code":"  298 |         # validate the certificate\n  299 |         try:\n  300 |             cert, issuer_url, ocsp_server = self.components_from_socket()\n  301 |             if issuer_url is None:\n  302 |                 raise ConnectionError(\"no issuers found in certificate chain\")\n  303 |             return self.check_certificate(ocsp_server, cert, issuer_url)\n  304 |         except AuthorizationError:\n  305 |             cert, issuer_url, ocsp_server = self.components_from_direct_connection()\n  306 |             if issuer_url is None:\n  307 |                 raise ConnectionError(\"no issuers found in certificate chain\")\n  308 |             return self.check_certificate(ocsp_server, cert, issuer_url)","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/ocsp.py#L298-L308"}]},{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Retry.call_with_retry off-by-one / semantics: with retries=N the loop executes the operation up to N+1 times (initial attempt + N retries) because the check is `if self._retries >= 0 and failures > self._retries`. The class docstring says 'retries a maximum of retries times'. Depending on interpretation this is one more attempt than 'retries' implies. This is consistent with the existing library convention but the AbstractRetry docstring ('retries a maximum of `retries` times') is misleading.","fix":"Clarify the docstring to state total attempts = retries + 1, or adjust the comparison to `failures >= self._retries` if the intent is exactly `retries` attempts.","locations":[{"ref":"redis/retry.py:118-135","code":"  118 |         while True:\n  119 |             try:\n  120 |                 return do()\n  121 |             except self._supported_errors as error:\n  122 |                 if is_retryable and not is_retryable(error):\n  123 |                     raise\n  124 |                 failures += 1\n  125 | \n  126 |                 if with_failure_count:\n  127 |                     fail(error, failures)\n  128 |                 else:\n  129 |                     fail(error)\n  130 | \n  131 |                 if self._retries >= 0 and failures > self._retries:\n  132 |                     raise error\n  133 |                 backoff = self._backoff.compute(failures)\n  134 |                 if backoff > 0:\n  135 |                     sleep(backoff)","lines":18,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/retry.py#L118-L135"},{"ref":"redis/retry.py:31-43","code":"   31 |     def __init__(\n   32 |         self,\n   33 |         backoff: \"AbstractBackoff\",\n   34 |         retries: int,\n   35 |         supported_errors: Tuple[Type[E], ...],\n   36 |     ):\n   37 |         \"\"\"\n   38 |         Initialize a `Retry` object with a `Backoff` object\n   39 |         that retries a maximum of `retries` times.\n   40 |         `retries` can be negative to retry forever.\n   41 |         You can specify the types of supported errors which trigger\n   42 |         a retry with the `supported_errors` parameter.\n   43 |         \"\"\"","lines":13,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/retry.py#L31-L43"}]},{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Sentinel.discover_master swaps the matching sentinel to the front of the list using `self.sentinels[0], self.sentinels[sentinel_no] = sentinel, self.sentinels[0]`. When sentinel_no == 0 this assigns self.sentinels[0] = sentinel (fine) and self.sentinels[0] (the RHS second element, already overwritten conceptually) - tuple assignment evaluates RHS first so it is actually safe, but when sentinel_no != 0 the element formerly at index 0 is moved to sentinel_no, which is correct. No bug in the swap itself; however the comment 'Put this sentinel at the top of the list' combined with the swap means the previously-first sentinel is demoted to sentinel_no rather than shifted, changing ordering semantics versus a rotate. This is intended behavior but worth noting as non-obvious.","fix":"No change required; optionally document that this is a swap, not a stable move-to-front, so iteration order after several failovers can reorder arbitrarily.","locations":[{"ref":"redis/sentinel.py:322-326","code":"  322 |                 # Put this sentinel at the top of the list\n  323 |                 self.sentinels[0], self.sentinels[sentinel_no] = (\n  324 |                     sentinel,\n  325 |                     self.sentinels[0],\n  326 |                 )","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/sentinel.py#L322-L326"}]},{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"`get_command_policies` extract_policies splits a policy string on ':' and takes index [1] (`policy.split(\":\")[1]`). A policy tip of the exact form `request_policy` or `response_policy` with no colon raises IndexError, which is not caught here and would propagate out of the (otherwise robust) recursive traversal. A value with extra colons is also mis-parsed since only `[1]` is used.","fix":"Use `policy.split(':', 1)` and verify the split yielded two parts before indexing; skip/log malformed tips rather than indexing blindly.","locations":[{"ref":"redis/_parsers/commands.py:290-311","code":"  290 |                         policy_type = policy.split(\":\")[1]\n  291 | \n  292 |                         try:\n  293 |                             command_with_policies[module_name][\n  294 |                                 command_name\n  295 |                             ].request_policy = RequestPolicy(policy_type)\n  296 |                         except ValueError:\n  297 |                             raise IncorrectPolicyType(\n  298 |                                 f\"Incorrect request policy type: {policy_type}\"\n  299 |                             )\n  300 | \n  301 |                     if policy.startswith(\"response_policy\"):\n  302 |                         policy_type = policy.split(\":\")[1]\n  303 | \n  304 |                         try:\n  305 |                             command_with_policies[module_name][\n  306 |                                 command_name\n  307 |                             ].response_policy = ResponsePolicy(policy_type)\n  308 |                         except ValueError:\n  309 |                             raise IncorrectPolicyType(\n  310 |                                 f\"Incorrect response policy type: {policy_type}\"\n  311 |                             )","lines":22,"link":"https://github.com/redis/redis-py/blob/8  |                     timeout=timeout,\n  144 |                 )\n  145 |                 for _ in range(int(response))\n  146 |             ]","lines":46,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/resp3.py#L101-L146"},{"ref":"redis/_parsers/resp3.py:235-276","code":"  235 |         # bulk response\n  236 |         elif byte == b\"$\":\n  237 |             response = await self._read(int(response))\n  238 |         # verbatim string response\n  239 |         elif byte == b\"=\":\n  240 |             response = (await self._read(int(response)))[4:]\n  241 |         # array response\n  242 |         elif byte == b\"*\":\n  243 |             response = [\n  244 |                 (await self._read_response(disable_decoding=disable_decoding))\n  245 |                 for _ in range(int(response))\n  246 |             ]\n  247 |         # set response\n  248 |         elif byte == b\"~\":\n  249 |             # redis can return unhashable types (like dict) in a set,\n  250 |             # so we always convert to a list, to have predictable return types\n  251 |             response = [\n  252 |                 (await self._read_response(disable_decoding=disable_decoding))\n  253 |                 for _ in range(int(response))\n  254 |             ]\n  255 |         # map response\n  256 |         elif byte == b\"%\":\n  257 |             # We cannot use a dict-comprehension to parse stream.\n  258 |             # Evaluation order of key:val expression in dict comprehension only\n  259 |             # became defined to be left-right in version 3.8\n  260 |             resp_dict = {}\n  261 |             for _ in range(int(response)):\n  262 |                 key = await self._read_response(disable_decoding=disable_decoding)\n  263 |                 resp_dict[key] = await self._read_response(\n  264 |                     disable_decoding=disable_decoding, push_request=push_request\n  265 |                 )\n  266 |             response = resp_dict\n  267 |         # push response\n  268 |         elif byte == b\">\":\n  269 |             response = [\n  270 |                 (\n  271 |                     await self._read_response(\n  272 |                         disable_decoding=disable_decoding, push_request=push_request\n  273 |                     )\n  274 |                 )\n  275 |                 for _ in range(int(response))\n  276 |             ]","lines":42,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/resp3.py#L235-L276"}]},{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"Pipeline._execute_transaction(): after a short/long response from EXEC it disconnects via `self.connection` (line 1919-1920) rather than the `connection` argument it was given. _execute_transaction is invoked through conn.retry.call_with_retry(lambda: execute(conn, ...)) where conn is a local that equals self.connection at call time, so today they coincide; but relying on self.connection inside a method that otherwise operates on the passed-in `connection` is fragile and inconsistent with the rest of the method (which uses `connection`).","fix":"Use the `connection` parameter for the disconnect (await connection.disconnect()) to stay consistent with the rest of _execute_transaction and avoid coupling to self.connection.","locations":[{"ref":"redis/asyncio/client.py:1918-1923","code":" 1918 |         if len(response) != len(commands):\n 1919 |             if self.connection:\n 1920 |                 await self.connection.disconnect()\n 1921 |             raise ResponseError(\n 1922 |                 \"Wrong number of response items from pipeline execution\"\n 1923 |             ) from None","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/client.py#L1918-L1923"}]},{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"PipelineStrategy._execute filters commands to (re)run with `not cmd.result or isinstance(cmd.result, Exception)`. A successful command whose result is a falsy value (e.g. 0, '', None, [], False) is treated as not-yet-executed and gets re-run on a retry pass, because `not cmd.result` is True for any falsy successful response. The intended condition is 'no result yet OR errored', but PipelineCommand.result defaults to None and many valid responses are falsy.","fix":"Track execution with an explicit sentinel/flag (e.g. a dedicated 'unset' marker or a `executed` bool) rather than truthiness of result; re-run only when result is the sentinel or an Exception.","locations":[{"ref":"redis/asyncio/cluster.py:2620-2622","code":" 2620 |         todo = [\n 2621 |             cmd for cmd in stack if not cmd.result or isinstance(cmd.result, Exception)\n 2622 |         ]","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L2620-L2622"}]},{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"ConnectionPool.release() removes the connection from _in_use_connections and, if should_reconnect(), disconnects it, then appends it back to _available_connections and records USED->IDLE. There is no guard against double-release: if release() is called twice for the same connection (e.g. a caller error or a cancellation that retries cleanup), the first call's _in_use_connections.remove() succeeds and the second raises KeyError, but only AFTER the connection may already have been appended to _available_connections once - and the metric counters are decremented/incremented again, drifting. release() is also not protected by _lock in the base pool (only BlockingConnectionPool wraps it in _condition), so concurrent release/get racing on the same lists is possible.","fix":"Make release() idempotent/lock-protected: check membership before remove, and perform the in-use/available mutations under self._lock so they are atomic with get_available_connection().","locations":[{"ref":"redis/asyncio/connection.py:1646-1671","code":" 1646 |     async def release(self, connection: AbstractConnection):\n 1647 |         \"\"\"Releases the connection back to the pool\"\"\"\n 1648 |         # Connections should always be returned to the correct pool,\n 1649 |         # not doing so is an error that will cause an exception here.\n 1650 |         self._in_use_connections.remove(connection)\n 1651 | \n 1652 |         if connection.should_reconnect():\n 1653 |             await connection.disconnect()\n 1654 | \n 1655 |         self._available_connections.append(connection)\n 1656 |         await self._event_dispatcher.dispatch_async(\n 1657 |             AsyncAfterConnectionReleasedEvent(connection)\n 1658 |         )\n 1659 | \n 1660 |         # Record state transition: USED -> IDLE\n 1661 |         pool_name = get_pool_name(self)\n 1662 |         await record_connection_count(\n 1663 |             pool_name=pool_name,\n 1664 |             connection_state=ConnectionState.USED,\n 1665 |             counter=-1,\n 1666 |         )\n 1667 |         await record_connection_count(\n 1668 |             pool_name=pool_name,\n 1669 |             connection_state=ConnectionState.IDLE,\n 1670 |             counter=1,\n 1671 |         )","lines":26,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L1646-L1671"}]},{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"AsyncClusterKeyspaceNotifications.get_message with timeout>0 distributes the wait across nodes but caps per_node_timeout at min(0.1, timeout/total_nodes). With many nodes timeout/total_nodes is already tiny, so the cap is harmless, but the loop re-lists self._node_pubsubs every iteration and recomputes nothing about the shrinking remaining time - each poll always waits up to per_node_timeout regardless of how little wall-clock time is left before end_time, so the method can overshoot the caller's timeout by up to per_node_timeout. Minor but it means timeout is a soft lower-ish bound, not an upper bound.","fix":"Clamp per_node_timeout to the remaining time: `per_node_timeout = min(per_node_timeout, end_time - time.monotonic())` and skip the poll if it is <= 0.","locations":[{"ref":"redis/asyncio/keyspace_notifications.py:845-878","code":"  845 |         # Calculate per-node timeout for each poll\n  846 |         per_node_timeout = min(0.1, timeout / max(total_nodes, 1))\n  847 | \n  848 |         start_time = time.monotonic()\n  849 |         end_time = start_time + timeout\n  850 | \n  851 |         while True:\n  852 |             if time.monotonic() >= end_time:\n  853 |                 return None\n  854 | \n  855 |             pubsubs = list(self._node_pubsubs.values())\n  856 |             if not pubsubs:\n  857 |                 return None\n  858 | \n  859 |             # Round-robin polling\n  860 |             self._poll_index = self._poll_index % len(pubsubs)\n  861 |             pubsub = pubsubs[self._poll_index]\n  862 |             self._poll_index += 1\n  863 | \n  864 |             try:\n  865 |                 message = await pubsub.get_message(\n  866 |                     ignore_subscribe_messages=ignore_subscribe_messages,\n  867 |                     timeout=per_node_timeout,\n  868 |                 )\n  869 |             except (ConnectionError, TimeoutError, RedisError):\n  870 |                 await self._refresh_subscriptions_on_error()\n  871 |                 continue\n  872 | \n  873 |             if message is not None:\n  874 |                 notification = KeyNotification.from_message(\n  875 |                     message, key_prefix=self.key_prefix\n  876 |                 )\n  877 |                 if notification is not None:\n  878 |                     return notification","lines":34,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/keyspace_notifications.py#L845-L878"}]},{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"Async ResubscribeOnActiveDatabaseChanged does not copy shard_channels, unlike the sync listener. Sync listener copies channels, patterns, and shard_channels onto the new pubsub before reconnecting; the async listener copies only channels and patterns. After a failover, shard channel subscriptions are silently lost for async pubsub users.","fix":"Copy new_pubsub.shard_channels = old_pubsub.shard_channels in the async listener to match sync behavior.","locations":[{"ref":"redis/asyncio/multidb/event.py:48-58","code":"   48 |     async def listen(self, event: AsyncActiveDatabaseChanged):\n   49 |         old_pubsub = event.command_executor.active_pubsub\n   50 | \n   51 |         if old_pubsub is not None:\n   52 |             # Re-assign old channels and patterns so they will be automatically subscribed on connection.\n   53 |             new_pubsub = event.new_database.client.pubsub(**event.kwargs)\n   54 |             new_pubsub.channels = old_pubsub.channels\n   55 |             new_pubsub.patterns = old_pubsub.patterns\n   56 |             await new_pubsub.on_connect(None)\n   57 |             event.command_executor.active_pubsub = new_pubsub\n   58 |             await old_pubsub.aclose()","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/event.py#L48-L58"},{"ref":"redis/multidb/event.py:48-59","code":"   48 |     def listen(self, event: ActiveDatabaseChanged):\n   49 |         old_pubsub = event.command_executor.active_pubsub\n   50 | \n   51 |         if old_pubsub is not None:\n   52 |             # Re-assign old channels and patterns so they will be automatically subscribed on connection.\n   53 |
