s_coverage(self, slots_cache):\n 2344 |         # Validate if all slots are covered or if we should try next\n 2345 |         # startup node\n 2346 |         for i in range(0, REDIS_CLUSTER_HASH_SLOTS):\n 2347 |             if i not in slots_cache:\n 2348 |                 return False\n 2349 |         return True","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L2343-L2349"},{"ref":"redis/cluster.py:2631","code":" 2631 |                 fully_covered = self.check_slots_coverage(tmp_slots)","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L2631"}]},{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"Sync ClusterManagementCommands.cluster_delslots issues CLUSTER DELSLOTS once per slot serially in a list comprehension, while the async override (AsyncClusterManagementCommands.cluster_delslots) parallelizes the same work with asyncio.gather. For large slot counts the sync path is markedly slower with no functional reason; it could at least be pipelined.","fix":"Pipeline the per-slot DELSLOTS commands in the sync path (or note the intentional serial behavior).","locations":[{"ref":"redis/commands/cluster.py:583-592","code":"  583 |     def cluster_delslots(self, *slots: EncodableT) -> List[bool]:\n  584 |         \"\"\"\n  585 |         Set hash slots as unbound in the cluster.\n  586 |         It determines by it self what node the slot is in and sends it there\n  587 | \n  588 |         Returns a list of the results for each processed slot.\n  589 | \n  590 |         For more information see https://redis.io/commands/cluster-delslots\n  591 |         \"\"\"\n  592 |         return [self.execute_command(\"CLUSTER DELSLOTS\", slot) for slot in slots]","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/cluster.py#L583-L592"},{"ref":"redis/commands/cluster.py:1182-1196","code":" 1182 |     async def cluster_delslots(self, *slots: EncodableT) -> List[bool]:\n 1183 |         \"\"\"\n 1184 |         Set hash slots as unbound in the cluster.\n 1185 |         It determines by it self what node the slot is in and sends it there\n 1186 | \n 1187 |         Returns a list of the results for each processed slot.\n 1188 | \n 1189 |         For more information see https://redis.io/commands/cluster-delslots\n 1190 |         \"\"\"\n 1191 |         return await asyncio.gather(\n 1192 |             *(\n 1193 |                 asyncio.create_task(self.execute_command(\"CLUSTER DELSLOTS\", slot))\n 1194 |                 for slot in slots\n 1195 |             )\n 1196 |         )","lines":15,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/cluster.py#L1182-L1196"}]},{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"ConnectionPool._get_in_use_connections and BlockingConnectionPool._get_in_use_connections / _get_free_connections rebuild full sets from self.pool.queue / self._connections on every call while holding the lock. These are invoked from update_connections_settings and observability counting which can run frequently during maintenance windows, and BlockingConnectionPool._get_in_use_connections is O(n*m) due to the 'conn not in connections_in_queue' membership test being inside a comprehension over self._connections (it is a set lookup so O(1), but the queue snapshot set is rebuilt each call).","fix":"Cache the queue snapshot once per maintenance pass, or maintain in-use membership incrementally rather than recomputing set differences on every call.","locations":[{"ref":"redis/connection.py:3329-3331","code":" 3329 |     def _get_in_use_connections(self):\n 3330 |         with self._lock:\n 3331 |             return set(self._in_use_connections)","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L3329-L3331"},{"ref":"redis/connection.py:3715-3727","code":" 3715 |     def _get_free_connections(self):\n 3716 |         with self._lock:\n 3717 |             return {conn for conn in self.pool.queue if conn}\n 3718 | \n 3719 |     def _get_in_use_connections(self):\n 3720 |         with self._lock:\n 3721 |             # free connections\n 3722 |             connections_in_queue = {conn for conn in self.pool.queue if conn}\n 3723 |             # in self._connections we keep all created connections\n 3724 |             # so the ones that are not in the queue are the in use ones\n 3725 |             return {\n 3726 |                 conn for conn in self._connections if conn not in connections_in_queue\n 3727 |             }","lines":13,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L3715-L3727"}]},{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"WeightedList.get_by_weight_range scans the entire list linearly even though items are maintained in sorted (descending weight) order. For large lists a binary search to find the weight-range boundaries would be O(log n) instead of O(n). Also get_top_n returns highest-weighted first only because add() inserts in descending order; correct, but relies on that invariant implicitly.","fix":"Use bisect over the sorted weights to bound the scan for get_by_weight_range; document the descending-order invariant relied on by get_top_n.","locations":[{"ref":"redis/data_structure.py:41-50","code":"   41 |     def get_by_weight_range(\n   42 |         self, min_weight: float, max_weight: float\n   43 |     ) -> List[tuple[Any, Number]]:\n   44 |         \"\"\"Get all items within weight range\"\"\"\n   45 |         with self._lock:\n   46 |             result = []\n   47 |             for item, weight in self._items:\n   48 |                 if min_weight <= weight <= max_weight:\n   49 |                     result.append((item, weight))\n   50 |             return result","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/data_structure.py#L41-L50"}]},{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"run_in_thread / KeyspaceWorkerThread default poll_timeout is 0.0, which the docstring itself warns 'causes a CPU spin-loop'. Shipping a CPU-burning default and only warning about it in prose is a foot-gun: a user who calls run_in_thread() with no args gets a busy loop pegging a core.","fix":"Default poll_timeout to a small positive value (e.g. 0.1 or 1.0) so the out-of-the-box behavior does not spin the CPU; keep 0.0 available for advanced callers.","locations":[{"ref":"redis/keyspace_notifications.py:1461-1521","code":" 1461 |     def run_in_thread(\n 1462 |         self,\n 1463 |         poll_timeout: float = 0.0,\n 1464 |         daemon: bool = False,\n 1465 |         exception_handler: Callable[\n 1466 |             [\n 1467 |                 BaseException,\n 1468 |                 KeyspaceNotificationsInterface,\n 1469 |                 KeyspaceWorkerThread,\n 1470 |             ],\n 1471 |             None,\n 1472 |         ]\n 1473 |         | None = None,\n 1474 |     ) -> KeyspaceWorkerThread:\n 1475 |         \"\"\"\n 1476 |         Start a background thread that polls for notifications and triggers handlers.\n 1477 | \n 1478 |         This method spawns a thread that continuously calls get_message() to\n 1479 |         process incoming notifications. When a notification arrives, any\n 1480 |         registered handler for that channel/pattern is invoked automatically.\n 1481 | \n 1482 |         All subscriptions must have handlers registered before calling this method.\n 1483 | \n 1484 |         Args:\n 1485 |             poll_timeout: Timeout in seconds for get_message() calls. When no message\n 1486 |                          is available, the thread waits up to this long before checking\n 1487 |                          again. Default 0.0 (non-blocking). WARNING: the default\n 1488 |                          causes a CPU spin-loop. It is preferred to pass a positive\n 1489 |                          value (e.g. 0.1 or 1.0).\n 1490 |             daemon: If True, the thread will be a daemon thread and will be\n 1491 |                    terminated when the main program exits. Default False.\n 1492 |             exception_handler: Optional callback invoked when an exception occurs\n 1493 |                               in the worker thread. Receives (exception, notifications,\n 1494 |                               thread) as arguments. If None, exceptions are raised.\n 1495 | \n 1496 |         Returns:\n 1497 |             KeyspaceWorkerThread: The started worker thread. Call stop() on it\n 1498 |                                  to stop the thread and close the notifications.\n 1499 | \n 1500 |         Raises:\n 1501 |             RedisError: If any subscription doesn't have a handler registered.\n 1502 | \n 1503 |         Example:\n 1504 |             >>> def my_handler(notification):\n 1505 |             ...     print(f\"Got: {notification.key} - {notification.event_type}\")\n 1506 |             >>>\n 1507 |             >>> notifications.subscribe(KeyspaceChannel(\"user:*\"), handler=my_handler)\n 1508 |             >>> thread = notifications.run_in_thread(poll_timeout=0.1, daemon=True)\n 1509 |             >>> # ... handlers are called automatically ...\n 1510 |             >>> thread.stop()\n 1511 |         \"\"\"\n 1512 |         self._validate_all_handlers()\n 1513 | \n 1514 |         thread = KeyspaceWorkerThread(\n 1515 |             self,\n 1516 |             poll_timeout,\n 1517 |             daemon=daemon,\n 1518 |             exception_handler=exception_handler,\n 1519 |         )\n 1520 |         thread.start()\n 1521 |         return thread","lines":61,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/keyspace_notifications.py#L1461-L1521"},{"ref":"redis/keyspace_notifications.py:1569-1585","code":" 1569 |     def run(self) -> None:\n 1570 |         \"\"\"Main loop that polls for notifications and triggers handlers.\"\"\"\n 1571 |         if self._running.is_set():\n 1572 |             return\n 1573 |         self._running.set()\n 1574 |         notifications = self.notifications\n 1575 |         poll_timeout = self.poll_timeout\n 1576 |         while self._running.is_set():\n 1577 |             try:\n 1578 |                 notifications.get_message(\n 1579 |                     ignore_subscribe_messages=True, timeout=poll_timeout\n 1580 |                 )\n 1581 |             except BaseException as e:\n 1582 |                 if self.exception_handler is None:\n 1583 |                     raise\n 1584 |                 self.exception_handler(e, notifications, self)\n 1585 |         notifications.close()","lines":17,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/keyspace_notifications.py#L1569-L1585"}]},{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"_check_active_database calls failover_strategy_executor.execute() on the normal path whenever auto_fallback_interval has elapsed, even when the current active database is healthy. When _auto_fallback_interval > 0 and _next_fallback_attempt has passed, the condition is true even if the active DB circuit is CLOSED, so every command after the interval triggers a full failover-strategy evaluation (iterate databases) and a set_active_database call. set_active_database is a no-op for metrics/events when the DB is unchanged (old is new), but the strategy iteration and reschedule run on the hot command path on each elapsed interval.","fix":"This is acceptable but consider short-circuiting when the active DB is healthy and the failover would select the same database, to avoid per-command work after the interval elapses.","locations":[{"ref":"redis/multidb/command_executor.py:329-345","code":"  329 |     def _check_active_database(self):\n  330 |         \"\"\"\n  331 |         Checks if active a database needs to be updated.\n  332 |         \"\"\"\n  333 |         if (\n  334 |             self._active_database is None\n  335 |             or self._active_database.circuit.state != CBState.CLOSED\n  336 |             or (\n  337 |                 self._auto_fallback_interval > 0\n  338 |                 and self._next_fallback_attempt <= datetime.now()\n  339 |             )\n  340 |         ):\n  341 |             self.active_database = (\n  342 |                 self._failover_strategy_executor.execute(),\n  343 |                 GeoFailoverReason.AUTOMATIC,\n  344 |             )\n  345 |             self._schedule_next_fallback()","lines":17,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/command_executor.py#L329-L345"},{"ref":"redis/asyncio/multidb/command_executor.py:314-330","code":"  314 |     async def _check_active_database(self):\n  315 |         \"\"\"\n  316 |         Checks if active a database needs to be updated.\n  317 |         \"\"\"\n  318 |         if (\n  319 |             self._active_database is None\n  320 |             or self._active_database.circuit.state != CBState.CLOSED\n  321 |             or (\n  322 |                 self._auto_fallback_interval > 0\n  323 |                 and self._next_fallback_attempt <= datetime.now()\n  324 |             )\n  325 |         ):\n  326 |             await self.set_active_database(\n  327 |                 await self._failover_strategy_executor.execute(),\n  328 |                 GeoFailoverReason.AUTOMATIC,\n  329 |             )\n  330 |             self._schedule_next_fallback()","lines":17,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/command_executor.py#L314-L330"}]},{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"OCSPVerifier.check_certificate and build_certificate_url issue synchronous blocking requests.get() calls to the issuer URL and OCSP responder with no timeout. A slow or hanging OCSP/issuer endpoint will block the connection-establishment thread indefinitely (default requests timeout is None).","fix":"Pass an explicit timeout=... to both requests.get() calls.","locations":[{"ref":"redis/ocsp.py:272-288","code":"  272 |         r = requests.get(issuer_url)\n  273 |         if not r.ok:\n  274 |             raise ConnectionError(\"failed to fetch issuer certificate\")\n  275 |         der = r.content\n  276 |         issuer_cert = self._bin2ascii(der)\n  277 | \n  278 |         ocsp_url = self.build_certificate_url(server, cert, issuer_cert)\n  279 | \n  280 |         # HTTP 1.1 mandates the addition of the Host header in ocsp responses\n  281 |         header = {\n  282 |             \"Host\": urlparse(ocsp_url).netloc,\n  283 |             \"Content-Type\": \"application/ocsp-request\",\n  284 |         }\n  285 |         r = requests.get(ocsp_url, headers=header)\n  286 |         if not r.ok:\n  287 |             raise ConnectionError(\"failed to fetch ocsp certificate\")\n  288 |         return _check_certificate(issuer_cert, r.content, True)","lines":17,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/ocsp.py#L272-L288"}]},{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"negligible","easy":false,"description":"`_socket_can_read` constructs a fresh `select.poll()` object (or DefaultSelector) and registers the fd on every readiness check in the poll() branch. This is the documented intent (avoid per-call fd allocation that epoll/kqueue selectors incur), and poll() allocates no fd, but the poll object + register/unregister still happens per call in the hot can_read path. For very high call rates a cached poller would avoid the per-call Python object churn.","fix":"Optional: cache a per-parser poll object and re-register lazily; current code is already a deliberate trade-off for fd-exhaustion safety.","locations":[{"ref":"redis/_parsers/hiredis.py:31-52","code":"   31 | def _socket_can_read(sock, timeout: float) -> bool:\n   32 |     # SSL sockets can have decrypted bytes buffered above the OS socket layer.\n   33 |     if hasattr(sock, \"pending\") and sock.pending():\n   34 |         return True\n   35 |     # timeout=0 must be a non-blocking readiness check only; both branches\n   36 |     # below are non-destructive and have no FD_SETSIZE limit (select.select\n   37 |     # raises ValueError for fds >= 1024).\n   38 |     if _HAS_POLL:\n   39 |         # Prefer poll() over selectors.DefaultSelector: epoll/kqueue selectors\n   40 |         # allocate a file descriptor per check and so fail with EMFILE under\n   41 |         # fd exhaustion - the very condition that pushes sockets onto high\n   42 |         # fds. poll() allocates nothing.\n   43 |         poller = select.poll()\n   44 |         poller.register(sock, select.POLLIN)\n   45 |         # poll() takes milliseconds (None blocks forever). POLLHUP/POLLERR/\n   46 |         # POLLNVAL are always reported regardless of the registered mask, so\n   47 |         # closed or errored sockets still count as readable, like select().\n   48 |         poll_timeout = None if timeout is None else timeout * 1000\n   49 |         return bool(poller.poll(poll_timeout))\n   50 |     with selectors.DefaultSelector() as selector:\n   51 |         selector.register(sock, selectors.EVENT_READ)\n   52 |         return bool(selector.select(timeout))","lines":22,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/hiredis.py#L31-L52"}]},{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"negligible","easy":false,"description":"_normalize_keys builds a brand-new dict via {decode(encode(k)): v ...} on every subscribe/unsubscribe call, encoding then immediately decoding each key. For unsubscribe-all paths the keys already come from self.channels (already normalized), so the round-trip is wasted work, though typically on small channel sets.","fix":"Skip normalization when the source is already an internal normalized dict (e.g. when unsubscribing from all).","locations":[{"ref":"redis/client.py:1310-1318","code":" 1310 |     def _normalize_keys(self, data) -> Dict:\n 1311 |         \"\"\"\n 1312 |         normalize channel/pattern names to be either bytes or strings\n 1313 |         based on whether responses are automatically decoded. this saves us\n 1314 |         from coercing the value for each message coming in.\n 1315 |         \"\"\"\n 1316 |         encode = self.encoder.encode\n 1317 |         decode = self.encoder.decode\n 1318 |         return {decode(encode(k)): v for k, v in data.items()}","lines":9,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L1310-L1318"}]},{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"negligible","easy":false,"description":"RedisCluster.__init__ uses a class-default mutable/shared instance as a parameter default: `policy_resolver: PolicyResolver = StaticPolicyResolver()` (line 717), and ClusterPipeline.__init__ does the same (line 3418). The StaticPolicyResolver() is instantiated once at function-definition time and shared across all clients that don't pass their own. If StaticPolicyResolver were ever to carry mutable per-client state this would cause cross-client interference; even as-is it is a Python anti-pattern (mutable default argument) that masks intent.","fix":"Default to None and instantiate StaticPolicyResolver() inside the body when not provided.","locations":[{"ref":"redis/cluster.py:717","code":"  717 |         policy_resolver: PolicyResolver = StaticPolicyResolver(),","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L717"},{"ref":"redis/cluster.py:3418","code":" 3418 |         policy_resolver: PolicyResolver = StaticPolicyResolver(),","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L3418"}]},{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"negligible","easy":false,"description":"json.decoders.unstring recompiles the same regexes (`^\\d+.\\d+$`, `^\\d+$`) on every call via re.findall with a string pattern, and uses `.` unescaped in the float regex so it also matches strings like `12x34`. decode_list calls this per element of a list. Both the per-call compile and the loose `.` are minor issues.","fix":"Precompile module-level compiled patterns with the dot escaped (`^\\d+\\.\\d+$`) and use match()/fullmatch() instead of findall().","locations":[{"ref":"redis/commands/json/decoders.py:31-46","code":"   31 | def unstring(obj):\n   32 |     \"\"\"\n   33 |     Attempt to parse string to native integer formats.\n   34 |     One can't simply call int/float in a try/catch because there is a\n   35 |     semantic difference between (for example) 15.0 and 15.\n   36 |     \"\"\"\n   37 |     floatreg = \"^\\\\d+.\\\\d+$\"\n   38 |     match = re.findall(floatreg, obj)\n   39 |     if match != []:\n   40 |         return float(match[0])\n   41 | \n   42 |     intreg = \"^\\\\d+$\"\n   43 |     match = re.findall(intreg, obj)\n   44 |     if match != []:\n   45 |         return int(match[0])\n   46 |     return obj","lines":16,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/json/decoders.py#L31-L46"}]},{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"negligible","easy":false,"description":"BasePolicyResolver.resolve / AsyncBasePolicyResolver.resolve perform redundant dict lookups: self._policies.get(module) is computed up to three times and .get(command) twice on the resolve path. These are hot per-command lookups in the cluster routing path.","fix":"Fetch `module_policies = self._policies.get(module)` once and `policy = module_policies.get(command)` once, then branch on the locals.","locations":[{"ref":"redis/commands/policies.py:191-211","code":"  191 |     def resolve(self, command_name: str) -> Optional[CommandPolicies]:\n  192 |         parts = command_name.split(\".\")\n  193 | \n  194 |         if len(parts) > 2:\n  195 |             raise ValueError(f\"Wrong command or module name: {command_name}\")\n  196 | \n  197 |         module, command = parts if len(parts) == 2 else (\"core\", parts[0])\n  198 | \n  199 |         if self._policies.get(module, None) is None:\n  200 |             if self._fallback is not None:\n  201 |                 return self._fallback.resolve(command_name)\n  202 |             else:\n  203 |                 return None\n  204 | \n  205 |         if self._policies.get(module).get(command, None) is None:\n  206 |             if self._fallback is not None:\n  207 |                 return self._fallback.resolve(command_name)\n  208 |             else:\n  209 |                 return None\n  210 | \n  211 |         return self._policies.get(module).get(command)","lines":21,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/policies.py#L191-L211"},{"ref":"redis/commands/policies.py:229-249","code":"  229 |     async def resolve(self, command_name: str) -> Optional[CommandPolicies]:\n  230 |         parts = command_name.split(\".\")\n  231 | \n  232 |         if len(parts) > 2:\n  233 |             raise ValueError(f\"Wrong command or module name: {command_name}\")\n  234 | \n  235 |         module, command = parts if len(parts) == 2 else (\"core\", parts[0])\n  236 | \n  237 |         if self._policies.get(module, None) is None:\n  238 |             if self._fallback is not None:\n  239 |                 return await self._fallback.resolve(command_name)\n  240 |             else:\n  241 |                 return None\n  242 | \n  243 |         if self._policies.get(module).get(command, None) is None:\n  244 |             if self._fallback is not None:\n  245 |                 return await self._fallback.resolve(command_name)\n  246 |             else:\n  247 |                 return None\n  248 | \n  249 |         return self._policies.get(module).get(command)","lines":21,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/policies.py#L229-L249"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"high","easy":true,"description":"SocketBuffer.purge() is broken. The first guard 'if unread > 0: return' returns whenever there is unread data, so the body never runs while data remains. Then the very next block 'if unread > 0:' is unreachable dead code (it can only be reached when unread == 0, contradicting its own condition). The net effect is that purge() only ever truncates when the buffer is fully read, and the data-compaction branch (moving unread data to the front) is completely dead. The original intent was almost certainly 'if unread > 0: <compact>' as the active path. As written, the compaction logic never executes and the comment 'move unread data to the front' is misleading.","fix":"Remove the first early-return guard (or invert it) so the compaction branch actually runs when unread > 0: move 'view[:unread] = view[-unread:]' under a real 'if unread > 0:' check, then truncate to 'unread' and seek to 0. Delete the duplicated dead 'if unread > 0:' block.","locations":[{"ref":"redis/_parsers/socket.py:134-151","code":"  134 |     def purge(self) -> None:\n  135 |         \"\"\"\n  136 |         After a successful read, purge the read part of buffer\n  137 |         \"\"\"\n  138 |         unread = self.unread_bytes()\n  139 | \n  140 |         # Only if we have read all of the buffer do we truncate, to\n  141 |         # reduce the amount of memory thrashing.  This heuristic\n  142 |         # can be changed or removed later.\n  143 |         if unread > 0:\n  144 |             return\n  145 | \n  146 |         if unread > 0:\n  147 |             # move unread data to the front\n  148 |             view = self._buffer.getbuffer()\n  149 |             view[:unread] = view[-unread:]\n  150 |         self._buffer.truncate(unread)\n  151 |         self._buffer.seek(0)","lines":18,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/socket.py#L134-L151"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"RedisCluster._evaluate_all_succeeded is never called. It is documented as evaluating ResponsePolicy.ALL_SUCCEEDED results, but no code path references it (the policies callback mapping only wires DEFAULT_KEYLESS/DEFAULT_KEYED, and ONE_SUCCEEDED is handled inline). It is dead code that suggests an incomplete ALL_SUCCEEDED response-policy implementation.","fix":"Either wire _evaluate_all_succeeded into _process_result/_policies_callback_mapping for ResponsePolicy.ALL_SUCCEEDED, or remove the method.","locations":[{"ref":"redis/cluster.py:1116-1138","code":" 1116 |     def _evaluate_all_succeeded(self, res):\n 1117 |         \"\"\"\n 1118 |         Evaluate the result of a command with ResponsePolicy.ALL_SUCCEEDED\n 1119 |         \"\"\"\n 1120 |         first_successful_response = None\n 1121 | \n 1122 |         if isinstance(res, dict):\n 1123 |             for key, value in res.items():\n 1124 |                 if value:\n 1125 |                     if first_successful_response is None:\n 1126 |                         first_successful_response = {key: value}\n 1127 |                 else:\n 1128 |                     return {key: False}\n 1129 |         else:\n 1130 |             for response in res:\n 1131 |                 if response:\n 1132 |                     if first_successful_response is None:\n 1133 |                         # Dynamically resolve type\n 1134 |                         first_successful_response = type(response)(response)\n 1135 |                 else:\n 1136 |                     return type(response)(False)\n 1137 | \n 1138 |         return first_successful_response","lines":23,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L1116-L1138"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"highest_weighted_db computed but never used in set_active_database. In both sync and async set_active_database, after the health check succeeds the code does 'highest_weighted_db, _ = self._databases.get_top_n(1)[0]' but never references highest_weighted_db before setting the active database to the requested one. Dead computation.","fix":"Remove the unused get_top_n(1) call, or use it if a weight comparison was intended.","locations":[{"ref":"redis/multidb/client.py:154-160","code":"  154 |         if database.circuit.state == CBState.CLOSED:\n  155 |             highest_weighted_db, _ = self._databases.get_top_n(1)[0]\n  156 |             self.command_executor.active_database = (\n  157 |                 database,\n  158 |                 GeoFailoverReason.MANUAL,\n  159 |             )\n  160 |             return","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/client.py#L154-L160"},{"ref":"redis/asyncio/multidb/client.py:167-172","code":"  167 |         if database.circuit.state == CBState.CLOSED:\n  168 |             highest_weighted_db, _ = self._databases.get_top_n(1)[0]\n  169 |             await self.command_executor.set_active_database(\n  170 |                 database, GeoFailoverReason.MANUAL\n  171 |             )\n  172 |             return","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/client.py#L167-L172"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","easy":false,"description":"SentinelConnectionManagedConnection._connect_retry has `raise SlaveNotFoundError  # Never be here` after the for-loop over rotate_slaves(). rotate_slaves() itself always raises SlaveNotFoundError at the end of its generator (sentinel.py:141) if no slave/master yields, so the for-loop will propagate that exception and the trailing raise is unreachable. The comment 'Never be here' confirms it is dead code.","fix":"Remove the unreachable `raise SlaveNotFoundError` line; the exception is already raised by rotate_slaves().","locations":[{"ref":"redis/sentinel.py:54-60","code":"   54 |         else:\n   55 |             for slave in self.connection_pool.rotate_slaves():\n   56 |                 try:\n   57 |                     return self.connect_to(slave)\n   58 |                 except ConnectionError:\n   59 |                     continue\n   60 |             raise SlaveNotFoundError  # Never be here","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/sentinel.py#L54-L60"}]},{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","easy":false,"description":"AbstractBloom.append_values_and_weights is defined but never used anywhere in the bf package (CMS.merge uses append_weights; INCRBY uses append_items_and_increments). It is dead code.","fix":"Remove append_values_and_weights, or wire it into the command that was intended to use it.","locations":[{"ref":"redis/commands/bf/__init__.py:77-82","code":"   77 |     @staticmethod\n   78 |     def append_values_and_weights(params, items, weights):\n   79 |         \"\"\"Append pairs of items and weights to params.\"\"\"\n   80 |         for i in range(len(items)):\n   81 |             params.append(items[i])\n   82 |             params.append(weights[i])","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/bf/__init__.py#L77-L82"}]},{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","easy":false,"description":"BasePolicyResolver and AsyncBasePolicyResolver redeclare with_fallback as @abstractmethod even though they are concrete-enough to be the resolve implementation. The abstract redeclaration is only there to force subclasses to implement with_fallback, but BasePolicyResolver inherits PolicyResolver which already declares it abstract; the redeclaration adds nothing and the class can never be instantiated directly, making the standalone Base classes effectively unused except as a mixin base for Dynamic/Static.","fix":"Drop the redundant abstract with_fallback redeclaration in the Base classes; the parent ABC already enforces it.","locations":[{"ref":"redis/commands/policies.py:213-215","code":"  213 |     @abstractmethod\n  214 |     def with_fallback(self, fallback: \"PolicyResolver\") -> \"PolicyResolver\":\n  215 |         pass","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/policies.py#L213-L215"},{"ref":"redis/commands/policies.py:251-253","code":"  251 |     @abstractmethod\n  252 |     def with_fallback(self, fallback: \"AsyncPolicyResolver\") -> \"AsyncPolicyResolver\":\n  253 |         pass","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/policies.py#L251-L253"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","easy":false,"description":"In both `AggregateRequest.apply` and `HybridPostProcessingConfig.apply`, the loop iterates `kwexpr.items()` and then checks `if alias is not None`. `alias` is a dict key from `**kwexpr`, which is always a non-None string, so the `is n ":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/helpers.py#L118-L125"}]},{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"high","easy":false,"description":"TransactionStrategy.execute_command runs each command in a brand-new thread via `asyncio.run(self._execute_command(...))`, creating a fresh event loop per command. The transaction's pooled connection (`self._transaction_connection`, an asyncio Connection bound to a specific event loop) is acquired in one such loop and then reused by subsequent commands running in different threads/event loops. Reusing an asyncio stream/transport across event loops leads to 'attached to a different loop' errors or undefined behavior. The whole sync-over-async-via-thread bridge for cluster transactions is fragile.","fix":"Provide a genuinely async transaction API (await-able execute_command) instead of spinning a new event loop per command in a thread, or at minimum bind/recreate the transaction connection per loop. Reconsider sharing _transaction_connection across asyncio.run() invocations.","locations":[{"ref":"redis/asyncio/cluster.py:2841-2861","code":" 2841 |     def execute_command(self, *args: Union[KeyT, EncodableT], **kwargs: Any) -> \"Any\":\n 2842 |         # Given the limitation of ClusterPipeline sync API, we have to run it in thread.\n 2843 |         response = None\n 2844 |         error = None\n 2845 | \n 2846 |         def runner():\n 2847 |             nonlocal response\n 2848 |             nonlocal error\n 2849 |             try:\n 2850 |                 response = asyncio.run(self._execute_command(*args, **kwargs))\n 2851 |             except Exception as e:\n 2852 |                 error = e\n 2853 | \n 2854 |         thread = threading.Thread(target=runner)\n 2855 |         thread.start()\n 2856 |         thread.join()\n 2857 | \n 2858 |         if error:\n 2859 |             raise error\n 2860 | \n 2861 |         return response","l   search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(), easyOnly: false,
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.easyOnly)          p.set('e',   '1');
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('e'))   S.easyOnly = p.get('e') === '1';
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report (mirrors to_markdown in Python).
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      const easyStr = f.easy ? ' ⚡ easy' : '';
      out += '### ' + f.id + sevStr + easyStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist (mirrors to_md_short in Python).
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    const easyStr = f.easy ? ' ⚡' : '';
    lines.push('- [ ] - ' + f.id + sevStr + easyStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.easy) lns.push(pad('easy') + '= true');
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + (f.easy ? ' ⚡ easy' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.easy ? 'easy quick win' : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.easyOnly && !f.easy)                   return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.easy ? '<span class="badge easy-badge" style="cursor:default" title="Easy to verify &amp; fix - no deep knowledge of the code, SDK or technology required">\u26a1 Easy</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_EASY)
    h += '<div class="filter-row"><span class="filter-lbl">Quick wins:</span>'
       + '<button class="badge easy-badge" data-easy="1">\u26a1 Easy only</button></div>';

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-easy]'))   b.classList.toggle('off', !S.easyOnly);
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Event delegation
document.getElementById('filterbar').addEventListener('click', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-easy]');
  if (!b) return;
  if (b.dataset.easy) {
    S.easyOnly = !S.easyOnly;
  }
  else if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES    : STATUSES;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
