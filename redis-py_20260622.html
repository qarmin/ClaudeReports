ing_notification, when proactive_reconnect is True but notification.new_node_host is None, a threading.Timer fires run_proactive_reconnect after ttl/2 (lines 824-828). At that point the connection host was never updated (the 'host' kwarg is only added when new_node_host is not None, lines 838-846), so the reconnect targets the same old address. If the timer thread runs after the maintenance window has already been reverted by handle_node_moved_notification (scheduled at ttl, but ttl/2 < ttl so it fires first - ordering is fine), there is still no check that the moving notification is still the current one before reconnecting, so a superseded notification's delayed timer can disconnect connections that have since been re-pointed by a newer MOVING notification.","fix":"In the delayed run_proactive_reconnect path, re-check that the pool's current maintenance_notification_hash still matches this notification before disconnecting/marking connections.","locations":[{"ref":"redis/maint_notifications.py:820-828","code":"  820 |                     if self.config.proactive_reconnect:\n  821 |                         if notification.new_node_host is not None:\n  822 |                             self.run_proactive_reconnect(moving_address_src)\n  823 |                         else:\n  824 |                             threading.Timer(\n  825 |                                 notification.ttl / 2,\n  826 |                                 self.run_proactive_reconnect,\n  827 |                                 args=(moving_address_src,),\n  828 |                             ).start()","lines":9,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/maint_notifications.py#L820-L828"},{"ref":"redis/maint_notifications.py:871-888","code":"  871 |     def run_proactive_reconnect(self, moving_address_src: Optional[str] = None):\n  872 |         \"\"\"\n  873 |         Run proactive reconnect for the pool.\n  874 |         Active connections are marked for reconnect after they complete the current command.\n  875 |         Inactive connections are disconnected and will be connected on next use.\n  876 |         \"\"\"\n  877 |         with self._lock:\n  878 |             with self.pool._lock:\n  879 |                 # take care for the active connections in the pool\n  880 |                 # mark them for reconnect after they complete the current command\n  881 |                 self.pool.update_active_connections_for_reconnect(\n  882 |                     moving_address_src=moving_address_src,\n  883 |                 )\n  884 |                 # take care for the inactive connections in the pool\n  885 |                 # delete them and create new ones\n  886 |                 self.pool.disconnect_free_connections(\n  887 |                     moving_address_src=moving_address_src,\n  888 |                 )","lines":18,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/maint_notifications.py#L871-L888"}]},{"id":"LOGIC_107","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"DefaultFailoverStrategyExecutor._next_attempt_ts typed/initialized as int but assigned float time.time() values, and the delay accumulation can drift. self._next_attempt_ts is annotated int and initialized 0, but execute() assigns time.time() + failover_delay (float). More importantly, on the first NoValidDatabaseException it sets _next_attempt_ts and increments the counter, but the counter is only incremented again once time crosses _next_attempt_ts; with many rapid retries between intervals the counter stays low, so the effective time to exhaust failover_attempts is roughly failover_attempts * failover_delay regardless of retry frequency. The annotation is misleading and the timing semantics are subtle/undocumented.","fix":"Annotate _next_attempt_ts as float; document that failover exhaustion is time-based (attempts * delay), not retry-count based, to avoid confusion.","locations":[{"ref":"redis/multidb/failover.py:86-121","code":"   86 |         self._next_attempt_ts: int = 0\n   87 |         self._failover_counter: int = 0\n   88 | \n   89 |     @property\n   90 |     def failover_attempts(self) -> int:\n   91 |         return self._failover_attempts\n   92 | \n   93 |     @property\n   94 |     def failover_delay(self) -> float:\n   95 |         return self._failover_delay\n   96 | \n   97 |     @property\n   98 |     def strategy(self) -> FailoverStrategy:\n   99 |         return self._strategy\n  100 | \n  101 |     def execute(self) -> SyncDatabase:\n  102 |         try:\n  103 |             database = self._strategy.database()\n  104 |             self._reset()\n  105 |             return database\n  106 |         except NoValidDatabaseException as e:\n  107 |             if self._next_attempt_ts == 0:\n  108 |                 self._next_attempt_ts = time.time() + self._failover_delay\n  109 |                 self._failover_counter += 1\n  110 |             elif time.time() >= self._next_attempt_ts:\n  111 |                 self._next_attempt_ts += self._failover_delay\n  112 |                 self._failover_counter += 1\n  113 | \n  114 |             if self._failover_counter > self._failover_attempts:\n  115 |                 self._reset()\n  116 |                 raise e\n  117 |             else:\n  118 |                 raise TemporaryUnavailableException(\n  119 |                     \"No database connections currently available. \"\n  120 |                     \"This is a temporary condition - please retry the operation.\"\n  121 |                 )","lines":36,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/failover.py#L86-L121"},{"ref":"redis/asyncio/multidb/failover.py:86-121","code":"   86 |         self._next_attempt_ts: int = 0\n   87 |         self._failover_counter: int = 0\n   88 | \n   89 |     @property\n   90 |     def failover_attempts(self) -> int:\n   91 |         return self._failover_attempts\n   92 | \n   93 |     @property\n   94 |     def failover_delay(self) -> float:\n   95 |         return self._failover_delay\n   96 | \n   97 |     @property\n   98 |     def strategy(self) -> AsyncFailoverStrategy:\n   99 |         return self._strategy\n  100 | \n  101 |     async def execute(self) -> AsyncDatabase:\n  102 |         try:\n  103 |             database = await self._strategy.database()\n  104 |             self._reset()\n  105 |             return database\n  106 |         except NoValidDatabaseException as e:\n  107 |             if self._next_attempt_ts == 0:\n  108 |                 self._next_attempt_ts = time.time() + self._failover_delay\n  109 |                 self._failover_counter += 1\n  110 |             elif time.time() >= self._next_attempt_ts:\n  111 |                 self._next_attempt_ts += self._failover_delay\n  112 |                 self._failover_counter += 1\n  113 | \n  114 |             if self._failover_counter > self._failover_attempts:\n  115 |                 self._reset()\n  116 |                 raise e\n  117 |             else:\n  118 |                 raise TemporaryUnavailableException(\n  119 |                     \"No database connections currently available. \"\n  120 |                     \"This is a temporary condition - please retry the operation.\"\n  121 |                 )","lines":36,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/failover.py#L86-L121"}]},{"id":"LOGIC_108","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"AttributeBuilder.build_error_attributes accesses error_type.status_code and error_type.error_type via hasattr. error_type is typed as Exception; arbitrary exceptions having a 'status_code'/'error_type' attribute is incidental. hasattr swallows any exception raised by a property getter on the exception object (in 3.x hasattr only catches AttributeError, so a property that raises another exception would propagate) - low risk but the attribute probing is brittle and would mislabel unrelated exceptions that happen to expose these attribute names.","fix":"Probe a known redis exception base type / explicit interface instead of duck-typing arbitrary attribute names on Exception.","locations":[{"ref":"redis/observability/attributes.py:232-246","code":"  232 |         if error_type is not None:\n  233 |             attrs[ERROR_TYPE] = error_type.__class__.__name__\n  234 | \n  235 |             if (\n  236 |                 hasattr(error_type, \"status_code\")\n  237 |                 and error_type.status_code is not None\n  238 |             ):\n  239 |                 attrs[DB_RESPONSE_STATUS_CODE] = error_type.status_code\n  240 |             else:\n  241 |                 attrs[DB_RESPONSE_STATUS_CODE] = \"error\"\n  242 | \n  243 |             if hasattr(error_type, \"error_type\") and error_type.error_type is not None:\n  244 |                 attrs[REDIS_CLIENT_ERROR_CATEGORY] = error_type.error_type.value\n  245 |             else:\n  246 |                 attrs[REDIS_CLIENT_ERROR_CATEGORY] = \"other\"","lines":15,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/observability/attributes.py#L232-L246"}]},{"id":"LOGIC_109","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"OTelConfig uses mutable default argument evaluation: buckets_operation_duration=default_operation_duration_buckets() and the histogram buckets default are evaluated ONCE at function-definition time. Since the helpers return fresh lists each call this avoids shared-mutable-default aliasing of the SAME list across instances only because a new list is produced per def-evaluation - but all OTelConfig instances that omit the argument share the identical list object. If any code mutates config.buckets_operation_duration in place, it mutates the shared default for all instances. Idiomatic Python would default to None and build inside __init__.","fix":"Default the bucket parameters to None and assign 'self.buckets_x = buckets_x if buckets_x is not None else default_...()' inside __init__.","locations":[{"ref":"redis/observability/config.py:118-125","code":"  118 |         buckets_operation_duration: Sequence[\n  119 |             float\n  120 |         ] = default_operation_duration_buckets(),\n  121 |         buckets_stream_processing_duration: Sequence[\n  122 |             float\n  123 |         ] = default_histogram_buckets(),\n  124 |         buckets_connection_create_time: Sequence[float] = default_histogram_buckets(),\n  125 |         buckets_connection_wait_time: Sequence[float] = default_histogram_buckets(),","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/observability/config.py#L118-L125"}]},{"id":"LOGIC_110","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"OCSP _check_certificate checks `if ocsp_response.this_update >= datetime.datetime.now(): raise 'issued in the future'`. Using >= rejects a response whose this_update is exactly the current instant (vanishingly rare but logically wrong) and, more importantly, datetime.datetime.now() returns naive local time while OCSP this_update/next_update are UTC. Comparing a UTC timestamp against local now() will be off by the local UTC offset, incorrectly accepting or rejecting responses depending on timezone.","fix":"Compare against datetime.datetime.now(datetime.timezone.utc) (and make this_update/next_update timezone-aware), and use > rather than >= for the future check.","locations":[{"ref":"redis/ocsp.py:68-75","code":"   68 |     if ocsp_response.this_update >= datetime.datetime.now():\n   69 |         raise ConnectionError(\"ocsp certificate was issued in the future\")\n   70 | \n   71 |     if (\n   72 |         ocsp_response.next_update\n   73 |         and ocsp_response.next_update < datetime.datetime.now()\n   74 |     ):\n   75 |         raise ConnectionError(\"ocsp certificate has invalid update - in the past\")","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/ocsp.py#L68-L75"}]},{"id":"LOGIC_111","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"compare_versions returns -1 when version1 > version2 and 1 when version1 < version2, which is the inverse of the conventional comparator contract (and of Python's __lt__/sort expectations). The docstring documents this inverted behavior, but any caller assuming standard cmp semantics (negative => first is smaller) will get reversed results. This is a footgun used across the codebase.","fix":"Either rename/redocument prominently, or invert the return values to match the conventional contract (-1 when version1 < version2).","locations":[{"ref":"redis/utils.py:319-346","code":"  319 | def compare_versions(version1: str, version2: str) -> int:\n  320 |     \"\"\"\n  321 |     Compare two versions.\n  322 | \n  323 |     :return: -1 if version1 > version2\n  324 |              0 if both versions are equal\n  325 |              1 if version1 < version2\n  326 |     \"\"\"\n  327 | \n  328 |     num_versions1 = list(map(int, version1.split(\".\")))\n  329 |     num_versions2 = list(map(int, version2.split(\".\")))\n  330 | \n  331 |     if len(num_versions1) > len(num_versions2):\n  332 |         diff = len(num_versions1) - len(num_versions2)\n  333 |         for _ in range(diff):\n  334 |             num_versions2.append(0)\n  335 |     elif len(num_versions1) < len(num_versions2):\n  336 |         diff = len(num_versions2) - len(num_versions1)\n  337 |         for _ in range(diff):\n  338 |             num_versions1.append(0)\n  339 | \n  340 |     for i, ver in enumerate(num_versions1):\n  341 |         if num_versions1[i] > num_versions2[i]:\n  342 |             return -1\n  343 |         elif num_versions1[i] < num_versions2[i]:\n  344 |             return 1\n  345 | \n  346 |     return 0","lines":28,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/utils.py#L319-L346"}]},{"id":"LOGIC_112","type":"logic_error","type_label":"Logic Error","severity":"negligible","easy":false,"description":"`_score_to_resp2_bytes` uses `format(float(value), '.17g')` to re-encode scores to the bytes form Redis sends on RESP2. Redis actually formats doubles with up to 17 significant digits via `%.17Lg` on long double in some paths, but more importantly integer-valued scores on the RESP2 wire are sent without a decimal/exponent (e.g. b'3') whereas float(3) formatted with '.17g' yields b'3'. However for special values float('inf') formats to 'inf' which matches Redis, but float('nan') -> 'nan'. This re-encoding is best-effort and can produce a byte string that differs from what the actual RESP2 wire would carry for certain magnitudes, so a custom score_cast_func relying on exact wire bytes may observe a slightly different input under legacy-on-RESP3 than on a true RESP2 connection.","fix":"Document the approximation, or reuse the same formatting Redis uses; for parity-critical casts prefer passing through float() consistently.","locations":[{"ref":"redis/_parsers/helpers.py:428-440","code":"  428 | def _score_to_resp2_bytes(value):\n  429 |     \"\"\"Re-encode a score back to the bytes form Redis returns on the RESP2\n  430 |     wire so that custom ``score_cast_func`` callables observe the same\n  431 |     input type they would receive on a RESP2 connection when the wire\n  432 |     protocol is RESP3 but legacy response shapes are requested.\n  433 |     \"\"\"\n  434 |     if isinstance(value, bytes):\n  435 |         return value\n  436 |     if isinstance(value, str):\n  437 |         return value.encode()\n  438 |     if isinstance(value, bool):\n  439 |         return b\"1\" if value else b\"0\"\n  440 |     return format(float(value), \".17g\").encode()","lines":13,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/helpers.py#L428-L440"}]},{"id":"LOGIC_113","type":"logic_error","type_label":"Logic Error","severity":"negligible","easy":false,"description":"object() forwards `infotype=infotype` into execute_command as an option in addition to the positional infotype argument. This duplicate passing relies on the response callback consuming the 'infotype' option; it is fragile and undocumented why the value is sent both positionally and as a kwarg.","fix":"Confirm the callback genuinely needs the infotype option; if not, drop the redundant kwarg.","locations":[{"ref":"redis/commands/core.py:1853-1859","code":" 1853 |     def object(self, infotype: str, key: KeyT, **kwargs) -> Any | Awaitable[Any]:\n 1854 |         \"\"\"\n 1855 |         Return the encoding, idletime, or refcount about the key\n 1856 |         \"\"\"\n 1857 |         return self.execute_command(\n 1858 |             \"OBJECT\", infotype, key, infotype=infotype, **kwargs\n 1859 |         )","lines":7,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L1853-L1859"}]},{"id":"LOGIC_114","type":"logic_error","type_label":"Logic Error","severity":"negligible","easy":false,"description":"RedisError and subclasses declare `status_code: str = None` as a default for a str-typed parameter, which is a mutable-default-style typing inconsistency (should be Optional[str] = None). Purely a type-annotation correctness issue, no runtime effect.","fix":"Annotate as Optional[str] = None.","locations":[{"ref":"redis/exceptions.py:14-17","code":"   14 |     def __init__(self, *args, status_code: str = None):\n   15 |         super().__init__(*args)\n   16 |         self.error_type = ExceptionType.SERVER\n   17 |         self.status_code = status_code","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/exceptions.py#L14-L17"},{"ref":"redis/exceptions.py:23-25","code":"   23 | class ConnectionError(RedisError):\n   24 |     def __init__(self, *args, status_code: str = None):\n   25 |         super().__init__(*args, status_code=status_code)","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/exceptions.py#L23-L25"}]},{"id":"LOGIC_115","type":"logic_error","type_label":"Logic Error","severity":"negligible","easy":false,"description":"ClusterDownError.__init__ sets self.args = (resp,) and bypasses super().__init__, so RedisError.__init__ (which sets error_type and status_code) is not called; it manually sets those fields. This works but is fragile: any future field added to RedisError.__init__ will not be initialized for ClusterDownError. Same pattern in AskError where it calls super().__init__ then re-sets self.args.","fix":"Call super().__init__(resp, status_code=status_code) and let it set the base fields, then only override what is genuinely different.","locations":[{"ref":"redis/exceptions.py:177-181","code":"  177 |     def __init__(self, resp, status_code: str = None):\n  178 |         self.args = (resp,)\n  179 |         self.message = resp\n  180 |         self.error_type = ExceptionType.SERVER\n  181 |         self.status_code = status_code","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/exceptions.py#L177-L181"},{"ref":"redis/exceptions.py:200-208","code":"  200 |     def __init__(self, resp, status_code: str = None):\n  201 |         \"\"\"should only redirect to master node\"\"\"\n  202 |         super().__init__(resp, status_code=status_code)\n  203 |         self.args = (resp,)\n  204 |         self.message = resp\n  205 |         slot_id, new_node = resp.split(\" \")\n  206 |         host, port = new_node.rsplit(\":\", 1)\n  207 |         self.slot_id = int(slot_id)\n  208 |         self.node_addr = self.host, self.port = host, int(port)","lines":9,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/exceptions.py#L200-L208"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","easy":true,"description":"UnixDomainSocketConnection._connect() calls `await self.on_connect()` at the end, but on_connect is ALSO invoked by connect_check_health() right after _connect() returns (it calls on_connect_check_health() at the bottom of the socket-connect block). This means every Unix-domain-socket connection runs the full handshake (HELLO/AUTH/CLIENT SETNAME/SETINFO/SELECT) TWICE on connect, doubling startup round-trips and potentially desynchronizing the request/response stream (extra unread responses left on the socket). The sync mirror's UnixDomainSocketConnection._connect() does NOT call on_connect() (see redis/connection.py:2198-2213) - the async copy diverged. The TCP Connection._connect() (line 971) correctly does not call on_connect().","fix":"Remove the `await self.on_connect()` call from UnixDomainSocketConnection._connect(); the handshake is performed by connect_check_health() after _connect() returns, matching the TCP connection and the sync mirror.","locations":[{"ref":"redis/asyncio/connection.py:1188-1193","code":" 1188 |     async def _connect(self):\n 1189 |         async with async_timeout(self.socket_connect_timeout):\n 1190 |             reader, writer = await asyncio.open_unix_connection(path=self.path)\n 1191 |         self._reader = reader\n 1192 |         self._writer = writer\n 1193 |         await self.on_connect()","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L1188-L1193"},{"ref":"redis/asyncio/connection.py:412-415","code":"  412 |         try:\n  413 |             if not self.redis_connect_func:\n  414 |                 # Use the default on_connect function\n  415 |                 await self.on_connect_check_health(check_health=check_health)","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L412-L415"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","easy":false,"description":"Async CloseConnectionOnActiveDatabaseChanged does not disconnect cluster connection pools, unlike the sync version. The sync listener (event.py) handles both standalone Redis and RedisCluster: for clusters it iterates nodes_manager.nodes_cache and calls update_active_connections_for_reconnect()/disconnect() on each node's pool. The async listener only handles the standalone Redis branch (isinstance check) and has no else branch for clusters, so when the active database is a RedisCluster and failover occurs, the old cluster's per-node connection pools are never marked for reconnect/disconnected. This is both a resource leak (lingering connections to the failed cluster) and a behavioral divergence from sync.","fix":"Mirror the sync else-branch in the async listener: for RedisCluster, iterate event.old_database.client.nodes_manager.nodes_cache.values() and await each node.redis_connection.connection_pool.update_active_connections_for_reconnect() / disconnect().","locations":[{"ref":"redis/asyncio/multidb/event.py:61-71","code":"   61 | class CloseConnectionOnActiveDatabaseChanged(AsyncEventListenerInterface):\n   62 |     \"\"\"\n   63 |     Close connection to the old active database.\n   64 |     \"\"\"\n   65 | \n   66 |     async def listen(self, event: AsyncActiveDatabaseChanged):\n   67 |         await event.old_database.client.aclose()\n   68 | \n   69 |         if isinstance(event.old_database.client, Redis):\n   70 |             await event.old_database.client.connection_pool.update_active_connections_for_reconnect()\n   71 |             await event.old_database.client.connection_pool.disconnect()","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/event.py#L61-L71"},{"ref":"redis/multidb/event.py:62-76","code":"   62 | class CloseConnectionOnActiveDatabaseChanged(EventListenerInterface):\n   63 |     \"\"\"\n   64 |     Close connection to the old active database.\n   65 |     \"\"\"\n   66 | \n   67 |     def listen(self, event: ActiveDatabaseChanged):\n   68 |         event.old_database.client.close()\n   69 | \n   70 |         if isinstance(event.old_database.client, Redis):\n   71 |             event.old_database.client.connection_pool.update_active_connections_for_reconnect()\n   72 |             event.old_database.client.connection_pool.disconnect()\n   73 |         else:\n   74 |             for node in event.old_database.client.nodes_manager.nodes_cache.values():\n   75 |                 node.redis_connection.connection_pool.update_active_connections_for_reconnect()\n   76 |                 node.redis_connection.connection_pool.disconnect()","lines":15,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/event.py#L62-L76"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","easy":true,"description":"zrevrange sets options['keys'] = name (a bare key) instead of options['keys'] = [name] (a list of one key). Every sibling range command (zrange via _zrange, zrangebyscore, zrevrangebyscore, zrangebylex, zrevrangebylex, zscore, zcount, etc.) passes keys=[name]. Passing a bare string means the cluster key-extraction / keys option receives a string that will be iterated character-by-character rather than treated as a single key, which can break cluster routing/key tracking for ZREVRANGE.","fix":"Change `options['keys'] = name` to `options['keys'] = [name]` to match all sibling commands.","locations":[{"ref":"redis/commands/core.py:8706-8711","code":" 8706 |         pieces = [\"ZREVRANGE\", name, start, end]\n 8707 |         if withscores:\n 8708 |             pieces.append(b\"WITHSCORES\")\n 8709 |         options = {\"withscores\": withscores, \"score_cast_func\": score_cast_func}\n 8710 |         options[\"keys\"] = name\n 8711 |         return self.execute_command(*pieces, **options)","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L8706-L8711"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","easy":false,"description":"The async recorder.record_pubsub_message normalizes bytes channels to str (str_if_bytes) only in the else branch (when hide is disabled), while the sync recorder.record_pubsub_message does NOT normalize bytes at all. So sync metrics may carry raw bytes channel names as OTel attributes (invalid attribute type), and the two stacks behave differently for the same input - a copy-paste divergence between the sync and async mirrors.","fix":"Apply str_if_bytes consistently in both recorders for the channel name regardless of the hide flag, matching behavior across the sync/async mirror.","locations":[{"ref":"redis/observability/recorder.py:476-490","code":"  476 |     # Check if channel names should be hidden\n  477 |     effective_channel = channel\n  478 |     if channel is not None:\n  479 |         config = _get_config()\n  480 |         if config is not None and config.hide_pubsub_channel_names:\n  481 |             effective_channel = None\n  482 | \n  483 |     try:\n  484 |         _metrics_collector.record_pubsub_message(\n  485 |             direction=direction,\n  486 |             channel=effective_channel,\n  487 |             sharded=sharded,\n  488 |         )\n  489 |     except Exception:\n  490 |         pass","lines":15,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/observability/recorder.py#L476-L490"},{"ref":"redis/asyncio/observability/recorder.py:437-454","code":"  437 |     # Check if channel names should be hidden\n  438 |     effective_channel = channel\n  439 |     if channel is not None:\n  440 |         config = await _get_config()\n  441 |         if config is not None and config.hide_pubsub_channel_names:\n  442 |             effective_channel = None\n  443 |         else:\n  444 |             # Normalize bytes to str for OTel attributes\n  445 |             effective_channel = str_if_bytes(channel)\n  446 | \n  447 |     try:\n  448 |         collector.record_pubsub_message(\n  449 |             direction=direction,\n  450 |             channel=effective_channel,\n  451 |             sharded=sharded,\n  452 |         )\n  453 |     except Exception:\n  454 |         pass","lines":18,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/observability/recorder.py#L437-L454"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":false,"description":"In async `handle_push_response`, `msg_type` is decoded from bytes twice: once at the top (lines 422-423) and again redundantly inside the try block (lines 440-441 `if isinstance(msg_type, bytes): msg_type = msg_type.decode()`). The second decode is dead since msg_type is already a str by then. The sync `handle_push_response` does not have this duplicate, confirming it is a copy/paste leftover.","fix":"Remove the redundant second isinstance/decode block in the async handler.","locations":[{"ref":"redis/_parsers/base.py:440-441","code":"  440 |             if isinstance(msg_type, bytes):\n  441 |                 msg_type = msg_type.decode()","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/base.py#L440-L441"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":false,"description":"The async Lock.acquire() lost the `sleep` keyword argument that the sync Lock.acquire() supports (sync signature: acquire(self, sleep=None, blocking=None, blocking_timeout=None, token=None)). In the async version `sleep` is hard-bound to `self.sleep` and cannot be overridden per-call. This is an API divergence between the two parallel stacks that must stay in lockstep, and breaks code that passes `sleep=` to acquire().","fix":"Add a `sleep: Optional[Number] = None` parameter to the async acquire() and set `sleep = self.sleep if sleep is None else sleep` at the top, mirroring the sync implementation.","locations":[{"ref":"redis/asyncio/lock.py:185-232","code":"  185 |     async def acquire(\n  186 |         self,\n  187 |         blocking: Optional[bool] = None,\n  188 |         blocking_timeout: Optional[Number] = None,\n  189 |         token: Optional[Union[str, bytes]] = None,\n  190 |     ):\n  191 |         \"\"\"\n  192 |         Use Redis to hold a shared, distributed lock named ``name``.\n  193 |         Returns True once the lock is acquired.\n  194 | \n  195 |         If ``blocking`` is False, always return immediately. If the lock\n  196 |         was acquired, return True, otherwise return False.\n  197 | \n  198 |         ``blocking_timeout`` specifies the maximum number of seconds to\n  199 |         wait trying to acquire the lock.\n  200 | \n  201 |         ``token`` specifies the token value to be used. If provided, token\n  202 |         must be a bytes object or a string that can be encoded to a bytes\n  203 |         object with the default encoding. If a token isn't specified, a UUID\n  204 |         will be generated.\n  205 |         \"\"\"\n  206 |         sleep = self.sleep\n  207 |         if token is None:\n  208 |             token = uuid.uuid1().hex.encode()\n  209 |         else:\n  210 |             try:\n  211 |                 encoder = self.redis.connection_pool.get_encoder()\n  212 |             except AttributeError:\n  213 |                 # Cluster\n  214 |                 encoder = self.redis.get_encoder()\n  215 |             token = encoder.encode(token)\n  216 |         if blocking is None:\n  217 |             blocking = self.blocking\n  218 |         if blocking_timeout is None:\n  219 |             blocking_timeout = self.blocking_timeout\n  220 |         stop_trying_at = None\n  221 |         if blocking_timeout is not None:\n  222 |             stop_trying_at = asyncio.get_running_loop().time() + blocking_timeout\n  223 |         while True:\n  224 |             if await self.do_acquire(token):\n  225 |                 self.local.token = token\n  226 |                 return True\n  227 |             if not blocking:\n  228 |                 return False\n  229 |             next_try_at = asyncio.get_running_loop().time() + sleep\n  230 |             if stop_trying_at is not None and next_try_at > stop_trying_at:\n  231 |                 return False\n  232 |             await asyncio.sleep(sleep)","lines":48,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/lock.py#L185-L232"},{"ref":"redis/lock.py:190-235","code":"  190 |     def acquire(\n  191 |         self,\n  192 |         sleep: Optional[Number] = None,\n  193 |         blocking: Optional[bool] = None,\n  194 |         blocking_timeout: Optional[Number] = None,\n  195 |         token: Optional[str] = None,\n  196 |     ):\n  197 |         \"\"\"\n  198 |         Use Redis to hold a shared, distributed lock named ``name``.\n  199 |         Returns True once the lock is acquired.\n  200 | \n  201 |         If ``blocking`` is False, always return immediately. If the lock\n  202 |         was acquired, return True, otherwise return False.\n  203 | \n  204 |         ``blocking_timeout`` specifies the maximum number of seconds to\n  205 |         wait trying to acquire the lock.\n  206 | \n  207 |         ``token`` specifies the token value to be used. If provided, token\n  208 |         must be a bytes object or a string that can be encoded to a bytes\n  209 |         object with the default encoding. If a token isn't specified, a UUID\n  210 |         will be generated.\n  211 |         \"\"\"\n  212 |         if sleep is None:\n  213 |             sleep = self.sleep\n  214 |         if token is None:\n  215 |             token = uuid.uuid1().hex.encode()\n  216 |         else:\n  217 |             encoder = self.redis.get_encoder()\n  218 |             token = encoder.encode(token)\n  219 |         if blocking is None:\n  220 |             blocking = self.blocking\n  221 |         if blocking_timeout is None:\n  222 |             blocking_timeout = self.blocking_timeout\n  223 |         stop_trying_at = None\n  224 |         if blocking_timeout is not None:\n  225 |             stop_trying_at = mod_time.monotonic() + blocking_timeout\n  226 |         while True:\n  227 |             if self.do_acquire(token):\n  228 |                 self.local.token = token\n  229 |                 return True\n  230 |             if not blocking:\n  231 |                 return False\n  232 |             next_try_at = mod_time.monotonic() + sleep\n  233 |             if stop_trying_at is not None and next_try_at > stop_trying_at:\n  234 |                 return False\n  235 |             mod_time.sleep(sleep)","lines":46,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/lock.py#L190-L235"}]},{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":true,"description":"The async Lock raises LockError/LockNotOwnedError without the `lock_name` keyword that the sync mirror passes everywhere. Sync release() (LockError), do_release(), extend()/do_extend(), reacquire()/do_reacquire() all pass `lock_name=self.name`; the async equivalents omit it in most places (only async release() passes it). Callers inspecting exception.lock_name will get None from the async client, diverging from sync behavior.","fix":"Add `lock_name=self.name` to every LockError and LockNotOwnedError constructed in the async lock, matching redis/lock.py.","locations":[{"ref":"redis/asyncio/lock.py:294","code":"  294 |             raise LockNotOwnedError(\"Cannot release a lock that's no longer owned\")","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/lock.py#L294"},{"ref":"redis/asyncio/lock.py:310-312","code":"  310 |             raise LockError(\"Cannot extend an unlocked lock\")\n  311 |         if self.timeout is None:\n  312 |             raise LockError(\"Cannot extend a lock with no timeout\")","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/lock.py#L310-L312"},{"ref":"redis/asyncio/lock.py:324","code":"  324 |             raise LockNotOwnedError(\"Cannot extend a lock that's no longer owned\")","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/lock.py#L324"},{"ref":"redis/asyncio/lock.py:331-334","code":"  331 |         if self.local.token is None:\n  332 |             raise LockError(\"Cannot reacquire an unlocked lock\")\n  333 |         if self.timeout is None:\n  334 |             raise LockError(\"Cannot reacquire a lock with no timeout\")","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/lock.py#L331-L334"},{"ref":"redis/asyncio/lock.py:344","code":"  344 |             raise LockNotOwnedError(\"Cannot reacquire a lock that's no longer owned\")","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/lock.py#L344"}]},{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":false,"description":"zmpop omits the COUNT clause when count == 1 (`if count != 1: args.extend(['COUNT', count])`), while its blocking sibling bzmpop always appends `['COUNT', count]` unconditionally. Same divergence exists between lmpop (skips COUNT when count == 1) and blmpop (always sends COUNT). The behavior is harmless when count is the server default of 1, but if a caller explicitly passes count=1 the wire command differs between the blocking and non-blocking variants, and any future change to the server default of 1 would silently desync. These near-identical command builders should be consistent.","fix":"Make the COUNT handling identical across the blocking/non-blocking pairs (either always send COUNT or never send it for the default).","locations":[{"ref":"redis/commands/core.py:8474-8475","code":" 8474 |         if count != 1:\n 8475 |             args.extend([\"COUNT\", count])","lines":2,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L8474-L8475"},{"ref":"redis/commands/core.py:8529","code":" 8529 |         args.extend([\"COUNT\", count])","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L8529"},{"ref":"redis/commands/core.py:4852-4854","code":" 4852 |         cmd_args = [num_keys] + list(args) + [direction]\n 4853 |         if count != 1:\n 4854 |             cmd_args.extend([\"COUNT\", count])","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L4852-L4854"},{"ref":"redis/commands/core.py:4817","code":" 4817 |         cmd_args = [timeout, numkeys, *args, direction, \"COUNT\", count]","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L4817"}]},{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":false,"description":"Sync client.py imports HealthCheck/HealthCheckPolicy from the ASYNC healthcheck module. The synchronous MultiDBClient imports 'from redis.asyncio.multidb.healthcheck import HealthCheck, HealthCheckPolicy', and config.py (sync) imports its health-check defaults from redis.asyncio.multidb.healthcheck as well. The sync stack therefore has no sync-native health check module and drives async health-check coroutines through BackgroundScheduler. While functional, this couples the sync client to the asyncio package and is an architectural smell / divergence from the documented 'parallel sync and async stacks' design; it also means installing/using the sync client always pulls in the async http client wrapper.","fix":"Either document this intentional reuse explicitly, or provide a sync-native health check module mirroring the async one to keep the stacks decoupled as the rest of the library does.","locations":[{"ref":"redis/multidb/client.py:6","code":"    6 | from redis.asyncio.multidb.healthcheck import HealthCheck, HealthCheckPolicy","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/client.py#L6"},{"ref":"redis/multidb/config.py:9-18","code":"    9 | from redis.asyncio.multidb.healthcheck import (\n   10 |     DEFAULT_HEALTH_CHECK_DELAY,\n   11 |     DEFAULT_HEALTH_CHECK_INTERVAL,\n   12 |     DEFAULT_HEALTH_CHECK_POLICY,\n   13 |     DEFAULT_HEALTH_CHECK_PROBES,\n   14 |     DEFAULT_HEALTH_CHECK_TIMEOUT,\n   15 |     HealthCheck,\n   16 |     HealthCheckPolicies,\n   17 |     PingHealthCheck,\n   18 | )","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/config.py#L9-L18"}]},{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","easy":false,"description":"Async SentinelManagedConnection.__repr__ diverges from the sync mirror and is also malformed: it builds `s = '<module.Class'`, optionally appends `,host=..,port=..`, then returns `s + ')>'` - producing '<module.Class,host=h,port=p)>' with an unmatched closing paren and no '(' opener, unlike the sync repr which produces '<module.Class(service=svc,host=..,port=..)>'. The service name (available via self.connection_pool) is dropped entirely.","fix":"Mirror the sync __repr__: include the service name and balanced parentheses, e.g. f'<{module}.{name}(service={pool.service_name},host={host},port={port})>'.","locations":[{"ref":"redis/asyncio/sentinel.py:35-40","code":"   35 |     def __repr__(self):\n   36 |         s = f\"<{self.__class__.__module__}.{self.__class__.__name__}\"\n   37 |         if self.host:\n   38 |             host_info = f\",host={self.host},port={self.port}\"\n   39 |             s += host_info\n   40 |         return s + \")>\"","lines":6,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/sentinel.py#L35-L40"},{"ref":"redis/sentinel.py:30-39","code":"   30 |     def __repr__(self):\n   31 |         pool = self.connection_pool\n   32 |         s = (\n   33 |             f\"<{type(self).__module__}.{type(self).__name__}\"\n   34 |             f\"(service={pool.service_name}%s)>\"\n   35 |         )\n   36 |         if self.host:\n   37 |             host_info = f\",host={self.host},port={self.port}\"\n   38 |             s = s % host_info\n   39 |         return s","lines":10,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/sentinel.py#L30-L39"}]},{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","easy":true,"description":"The async `AsyncSearchCommands.aggregate` type hint annotates `query` as `Union[AggregateResult, Cursor]`, but the parameter must be an `AggregateRequest` (or `Cursor`) - `AggregateResult` is the return type, not an accepted input. The sync `SearchCommands.aggregate` correctly uses `Union[AggregateRequest, Cursor]`. Misleading type hint copied incorrectly.","fix":"Change the async annotation to `Union[AggregateRequest, Cursor]` to match the sync signature and actual handling.","locations":[{"ref":"redis/commands/search/commands.py:1848-1851","code":" 1848 |     async def aggregate(\n 1849 |         self,\n 1850 |         query: Union[AggregateResult, Cursor],\n 1851 |         query_params: Optional[Dict[str, Union[str, int, float, bytes]]] = None,","lines":4,"link":"ht self._in_progress\n 1103 |                 or notification in self._processed_notifications\n 1104 |             ):\n 1105 |                 # we are already handling this notification or it has already been processed\n 1106 |                 # we should skip in_progress notification since when we reinitialize the cluster\n 1107 |                 # we execute a CLUSTER SLOTS command that can use a different connection\n 1108 |                 # that has also has the notification and we don't want to\n 1109 |                 # process the same notification twice\n 1110 |                 return\n 1111 | \n 1112 |             if logger.isEnabledFor(logging.DEBUG):\n 1113 |                 logger.debug(f\"Handling SMIGRATED notification: {notification}\")\n 1114 |             self._in_progress.add(notification)\n 1115 | \n 1116 |             # Extract the information about the src and destination nodes that are affected\n 1117 |             # by the maintenance. nodes_to_slots_mapping structure:\n 1118 |             # {\n 1119 |             #     \"src_host:port\": [\n 1120 |             #         {\"dest_host:port\": \"slot_range\"},\n 1121 |             #         ...\n 1122 |             #     ],\n 1123 |             #     ...\n 1124 |             # }\n 1125 |             additional_startup_nodes_info = []\n 1126 |             affected_nodes = set()\n 1127 |             for (\n 1128 |                 src_address,\n 1129 |                 dest_mappings,\n 1130 |             ) in notification.nodes_to_slots_mapping.items():\n 1131 |                 src_host, src_port = src_address.split(\":\")\n 1132 |                 src_node = self.cluster_client.nodes_manager.get_node(\n 1133 |                     host=src_host, port=src_port\n 1134 |                 )\n 1135 |                 if src_node is not None:\n 1136 |                     affected_nodes.add(src_node)\n 1137 | \n 1138 |                 for dest_mapping in dest_mappings:\n 1139 |                     for dest_address in dest_mapping.keys():\n 1140 |                         dest_host, dest_port = dest_address.split(\":\")\n 1141 |                         additional_startup_nodes_info.append(\n 1142 |                             (dest_host, int(dest_port))\n 1143 |                         )\n 1144 | \n 1145 |             # Updates the cluster slots cache with the new slots mapping\n 1146 |             # This will also update the nodes cache with the new nodes mapping\n 1147 |             self.cluster_client.nodes_manager.initialize(\n 1148 |                 disconnect_startup_nodes_pools=False,\n 1149 |                 additional_startup_nodes_info=additional_startup_nodes_info,\n 1150 |             )\n 1151 | \n 1152 |             all_nodes = set(affected_nodes)\n 1153 |             all_nodes = all_nodes.union(\n 1154 |                 self.cluster_client.nodes_manager.nodes_cache.values()\n 1155 |             )\n 1156 | \n 1157 |             for current_node in all_nodes:\n 1158 |                 if current_node.redis_connection is None:\n 1159 |                     continue\n 1160 |                 with current_node.redis_connection.connection_pool._lock:\n 1161 |                     handoff_recorded = False\n 1162 |                     if current_node in affected_nodes:\n 1163 |                         # mark for reconnect all in use connections to the node - this will force them to\n 1164 |                         # disconnect after they complete their current commands\n 1165 |                         # Some of them might be used by sub sub and we don't know which ones - so we disconnect\n 1166 |                         # all in flight connections after they are done with current command execution\n 1167 |                         for conn in current_node.redis_connection.connection_pool._get_in_use_connections():\n 1168 |                             add_debug_log_for_notification(\n 1169 |                                 conn, \"SMIGRATED - mark for reconnect\"\n 1170 |                             )\n 1171 |                             conn.mark_for_reconnect()\n 1172 | \n 1173 |                         record_connection_handoff(\n 1174 |                             pool_name=get_pool_name(\n 1175 |                                 current_node.redis_connection.connection_pool\n 1176 |                             )\n 1177 |                         )\n 1178 |                         handoff_recorded = True\n 1179 |                     else:\n 1180 |                         if logger.isEnabledFor(logging.DEBUG):\n 1181 |                             logger.debug(\n 1182 |                                 f\"SMIGRATED: Node {current_node.name} not affected by maintenance, \"\n 1183 |                                 f\"skipping mark for reconnect\"\n 1184 |                             )\n 1185 | \n 1186 |                     if (\n 1187 |                         current_node\n 1188 |                         not in self.cluster_client.nodes_manager.nodes_cache.values()\n 1189 |                     ):\n 1190 |                         # disconnect all free connections to the node - this node will be dropped\n 1191 |                         # from the cluster, so we don't need to revert the timeouts\n 1192 |                         for conn in current_node.redis_connection.connection_pool._get_free_connections():\n 1193 |                             conn.disconnect()\n 1194 | \n 1195 |                         # Only record handoff if not already recorded for this node\n 1196 |                         if not handoff_recorded:\n 1197 |                             record_connection_handoff(\n 1198 |                                 pool_name=get_pool_name(\n 1199 |                                     current_node.redis_connection.connection_pool\n 1200 |                                 )\n 1201 |                             )\n 1202 | \n 1203 |             # mark the notification as processed\n 1204 |             self._processed_notifications.add(notification)\n 1205 |             self._in_progress.remove(notification)","lines":106,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/maint_notifications.py#L1100-L1205"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"`parse_moving_msg` parses the endpoint with `host, port = value.split(\":\")`. This raises ValueError if the endpoint has no colon, or more than one colon (IPv6 literals such as `2001:db8::1:6379`). Although it is wrapped by the try/except in handle_push_response (which only logs and drops the notification), a malformed/IPv6 MOVING endpoint silently discards the maintenance notification. Additionally `port = int(port) if port is not None else None` is dead defensive code: after a successful 2-way split, `port` is always a (possibly empty) str, never None, so the None branch is unreachable and an empty port string would raise ValueError instead.","fix":"Use `value.rsplit(':', 1)` to tolerate IPv6 hosts, validate the split produced two parts, and drop the unreachable `is not None` guard around the int() conversion.","locations":[{"ref":"redis/_parsers/base.py:248-259","code":"  248 |     def parse_moving_msg(response):\n  249 |         # Expected message format is: MOVING <seq_number> <time> <endpoint>\n  250 |         id = response[1]\n  251 |         ttl = response[2]\n  252 |         if response[3] is None:\n  253 |             host, port = None, None\n  254 |         else:\n  255 |             value = safe_str(response[3])\n  256 |             host, port = value.split(\":\")\n  257 |             port = int(port) if port is not None else None\n  258 | \n  259 |         return NodeMovingNotification(id, host, port, ttl)","lines":12,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/_parsers/base.py#L248-L259"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"Redis.execute_command() catches `except Exception` (line 856) to record error metrics and re-raise, but asyncio.CancelledError is a BaseException (Python 3.8+), so a cancellation during call_with_retry is NOT recorded - acceptable - yet the broader concern is the metrics path: record_error_count itself is awaited inside the except handler. If the task is cancelled while awaiting record_error_count, the original exception is replaced by CancelledError and lost. The same pattern is repeated in PubSub._execute (1217-1227), Pipeline.immediate_execute_command (1841-1851) and Pipeline.execute (2094-2104).","fix":"Guard the awaited record_error_count() in these handlers (e.g. shield it or wrap in try/except so a cancellation during metric recording does not swallow/replace the in-flight RedisError) before re-raising.","locations":[{"ref":"redis/asyncio/client.py:856-866","code":"  856 |         except Exception as e:\n  857 |             await record_error_count(\n  858 |                 server_address=getattr(conn, \"host\", None),\n  859 |                 server_port=getattr(conn, \"port\", None),\n  860 |                 network_peer_address=getattr(conn, \"host\", None),\n  861 |                 network_peer_port=getattr(conn, \"port\", None),\n  862 |                 error_type=e,\n  863 |                 retry_attempts=actual_retry_attempts,\n  864 |                 is_internal=False,\n  865 |             )\n  866 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/client.py#L856-L866"},{"ref":"redis/asyncio/client.py:1217-1227","code":" 1217 |         except Exception as e:\n 1218 |             await record_error_count(\n 1219 |                 server_address=getattr(conn, \"host\", None),\n 1220 |                 server_port=getattr(conn, \"port\", None),\n 1221 |                 network_peer_address=getattr(conn, \"host\", None),\n 1222 |                 network_peer_port=getattr(conn, \"port\", None),\n 1223 |                 error_type=e,\n 1224 |                 retry_attempts=actual_retry_attempts,\n 1225 |                 is_internal=False,\n 1226 |             )\n 1227 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/client.py#L1217-L1227"},{"ref":"redis/asyncio/client.py:1841-1851","code":" 1841 |         except Exception as e:\n 1842 |             await record_error_count(\n 1843 |                 server_address=getattr(conn, \"host\", None),\n 1844 |                 server_port=getattr(conn, \"port\", None),\n 1845 |                 network_peer_address=getattr(conn, \"host\", None),\n 1846 |                 network_peer_port=getattr(conn, \"port\", None),\n 1847 |                 error_type=e,\n 1848 |                 retry_attempts=actual_retry_attempts,\n 1849 |                 is_internal=False,\n 1850 |             )\n 1851 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/client.py#L1841-L1851"},{"ref":"redis/asyncio/client.py:2094-2104","code":" 2094 |         except Exception as e:\n 2095 |             await record_error_count(\n 2096 |                 server_address=getattr(conn, \"host\", None),\n 2097 |                 server_port=getattr(conn, \"port\", None),\n 2098 |                 network_peer_address=getattr(conn, \"host\", None),\n 2099 |                 network_peer_port=getattr(conn, \"port\", None),\n 2100 |                 error_type=e,\n 2101 |                 retry_attempts=actual_retry_attempts,\n 2102 |                 is_internal=False,\n 2103 |             )\n 2104 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/client.py#L2094-L2104"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"NodesManager.aclose calls asyncio.gather over node.disconnect() tasks without return_exceptions=True. If any single node.disconnect() raises, gather propagates the first exception and the remaining disconnect tasks are abandoned/cancelled, so other nodes' connections may not be cleanly disconnected during shutdown/reinitialization. Other gather sites in this file (disconnect, disconnect_free_connections) correctly pass return_exceptions=True.","fix":"Pass return_exceptions=True to gather and optionally re-raise after all disconnects complete, matching ClusterNode.disconnect().","locations":[{"ref":"redis/asyncio/cluster.py:2183-2190","code":" 2183 |     async def aclose(self, attr: str = \"nodes_cache\") -> None:\n 2184 |         self.default_node = None\n 2185 |         await asyncio.gather(\n 2186 |             *(\n 2187 |                 asyncio.create_task(node.disconnect())\n 2188 |                 for node in getattr(self, attr).values()\n 2189 |             )\n 2190 |         )","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/cluster.py#L2183-L2190"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"AbstractConnection.disconnect() takes an early-return fast path when asyncio.current_task() is None (GC/finalizer context), doing only a synchronous _close(). On that path it skips the observability recording (record_error_count / record_connection_closed) that the normal path performs, so connection-closed and error metrics are silently dropped for any disconnect that happens outside a running task (e.g. errors surfaced during finalization, or callers invoking disconnect from a non-task context). This makes the connection-state counters drift over time.","fix":"Record the connection-closed/error metrics (using the sync recorder functions, as reset()/__del__ do) on the current_task() is None fast path as well, or document that metrics are intentionally skipped there.","locations":[{"ref":"redis/asyncio/connection.py:592-596","code":"  592 |         if asyncio.current_task() is None:\n  593 |             self._parser.on_disconnect()\n  594 |             self.reset_should_reconnect()\n  595 |             self._close()\n  596 |             return","lines":5,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L592-L596"},{"ref":"redis/asyncio/connection.py:621-644","code":"  621 |         if error:\n  622 |             if health_check_failed:\n  623 |                 close_reason = CloseReason.HEALTHCHECK_FAILED\n  624 |             else:\n  625 |                 close_reason = CloseReason.ERROR\n  626 | \n  627 |             if failure_count is not None and failure_count > self.retry.get_retries():\n  628 |                 await record_error_count(\n  629 |                     server_address=getattr(self, \"host\", None),\n  630 |                     server_port=getattr(self, \"port\", None),\n  631 |                     network_peer_address=getattr(self, \"host\", None),\n  632 |                     network_peer_port=getattr(self, \"port\", None),\n  633 |                     error_type=error,\n  634 |                     retry_attempts=failure_count,\n  635 |                 )\n  636 | \n  637 |             await record_connection_closed(\n  638 |                 close_reason=close_reason,\n  639 |                 error_type=error,\n  640 |             )\n  641 |         else:\n  642 |             await record_connection_closed(\n  643 |                 close_reason=CloseReason.APPLICATION_CLOSE,\n  644 |             )","lines":24,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/connection.py#L621-L644"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"_close_connection / _reconnect / _disconnect_reset_raise_on_watching / _disconnect_raise_on_watching all dereference failure_count with `failure_count <= conn.retry.get_retries()` after only checking `error`. Their signatures declare failure_count: Optional[int] = None. These are always invoked from failure_callback with an int today, but the default-None signature plus the `if error and failure_count <= ...` pattern means any future/alternate caller passing error without failure_count raises TypeError ('<=' not supported between NoneType and int). The Optional typing advertises an unsafe contract.","fix":"Either make failure_count a required int parameter, or guard with `if error and failure_count is not None and failure_count <= conn.retry.get_retries()`.","locations":[{"ref":"redis/client.py:783","code":"  783 |         if error and failure_count <= conn.retry.get_retries():","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L783"},{"ref":"redis/client.py:1134","code":" 1134 |         if error and failure_count <= conn.retry.get_retries():","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L1134"},{"ref":"redis/client.py:1786","code":" 1786 |         if error and failure_count <= conn.retry.get_retries():","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L1786"},{"ref":"redis/client.py:2020","code":" 2020 |         if error and failure_count <= conn.retry.get_retries():","lines":1,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L2020"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"In _execute_command's finally block, after a successful or failed call, if conn.should_reconnect() is true it calls self._close_connection(conn) then conn.connect(). If conn.connect() raises (e.g. server still unreachable), that exception propagates out of the finally block. When the try body already raised, the new exception from the finally replaces/masks the original error that the caller cares about, and the subsequent `pool.release(conn)` line (854-855) is skipped, leaking the connection back-reference is avoided only because release is after connect. Reconnecting eagerly inside finally is also redundant with the connection-level lazy reconnect on next send_command.","fix":"Wrap the reconnect attempt in try/except (log and swallow, or at least ensure pool.release still runs), or drop the eager connect() and rely on lazy reconnect. Ensure pool.release(conn) always runs regardless of connect() outcome.","locations":[{"ref":"redis/client.py:848-855","code":"  848 |         finally:\n  849 |             if conn and conn.should_reconnect():\n  850 |                 self._close_connection(conn)\n  851 |                 conn.connect()\n  852 |             if self._single_connection_client:\n  853 |                 self.single_connection_lock.release()\n  854 |             if not self.connection:\n  855 |                 pool.release(conn)","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/client.py#L848-L855"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"RedisCluster._internal_execute_command never raises a final error after exhausting retries in some edge cases. The retry loop `for _ in range(execute_attempts)` returns on success and re-raises non-retryable exceptions, but if a retryable exception (in ERRORS_ALLOW_RETRY) is thrown on the final iteration when `retry_attempts` has already reached 0, the `if retry_attempts > 0` branch is false, so it falls to the `else` and re-raises - that path is fine. However if every iteration decrements retry_attempts and `continue`s, after the loop completes there is no fallback `raise`, so the function falls off the end and returns None implicitly. This can only happen if the last attempt's exception is caught by the retry branch while retry_attempts just became 0 mid-iteration; given the decrement happens inside the branch the loop body still continues. The net effect: under a precise interleaving the method can return None instead of raising, masking a hard failure.","fix":"Add an explicit `raise` (or `raise last_exception`) after the for-loop to guarantee the method never silently returns None when all attempts were consumed by retries.","locations":[{"ref":"redis/cluster.py:1562-1628","code":" 1562 |         for _ in range(execute_attempts):\n 1563 |             try:\n 1564 |                 res = {}\n 1565 |                 if not target_nodes_specified:\n 1566 |                     # Determine the nodes to execute the command on\n 1567 |                     target_nodes = self._determine_nodes(\n 1568 |                         *args,\n 1569 |                         request_policy=command_policies.request_policy,\n 1570 |                         nodes_flag=passed_targets,\n 1571 |                     )\n 1572 | \n 1573 |                     if not target_nodes:\n 1574 |                         raise RedisClusterException(\n 1575 |                             f\"No targets were found to execute {args} command on\"\n 1576 |                         )\n 1577 |                     if (\n 1578 |                         len(target_nodes) == 1\n 1579 |                         and target_nodes[0] == self.get_default_node()\n 1580 |                     ):\n 1581 |                         is_default_node = True\n 1582 |                 for node in target_nodes:\n 1583 |                     res[node.name] = self._execute_command(node, *args, **kwargs)\n 1584 | \n 1585 |                     if command_policies.response_policy == ResponsePolicy.ONE_SUCCEEDED:\n 1586 |                         break\n 1587 | \n 1588 |                 # Return the processed result\n 1589 |                 return self._process_result(\n 1590 |                     args[0],\n 1591 |                     res,\n 1592 |                     response_policy=command_policies.response_policy,\n 1593 |                     **kwargs,\n 1594 |                 )\n 1595 |             except Exception as e:\n 1596 |                 if retry_attempts > 0 and type(e) in self.__class__.ERRORS_ALLOW_RETRY:\n 1597 |                     if is_default_node:\n 1598 |                         # Replace the default cluster node\n 1599 |                         self.replace_default_node()\n 1600 |                     # The nodes and slots cache were reinitialized.\n 1601 |                     # Try again with the new cluster setup.\n 1602 |                     retry_attempts -= 1\n 1603 |                     failure_count += 1\n 1604 | \n 1605 |                     if hasattr(e, \"connection\"):\n 1606 |                         self._record_command_metric(\n 1607 |                             command_name=args[0],\n 1608 |                             duration_seconds=time.monotonic() - start_time,\n 1609 |                             connection=e.connection,\n 1610 |                             error=e,\n 1611 |                         )\n 1612 | \n 1613 |                         self._record_error_metric(\n 1614 |                             error=e,\n 1615 |                             connection=e.connection,\n 1616 |                             retry_attempts=failure_count,\n 1617 |                         )\n 1618 |                     continue\n 1619 |                 else:\n 1620 |                     # raise the exception\n 1621 |                     if hasattr(e, \"connection\"):\n 1622 |                         self._record_error_metric(\n 1623 |                             error=e,\n 1624 |                             connection=e.connection,\n 1625 |                             retry_attempts=failure_count,\n 1626 |                             is_internal=False,\n 1627 |                         )\n 1628 |                     raise e","lines":67,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/cluster.py#L1562-L1628"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"AbstractBloom.append_items_and_increments and append_values_and_weights iterate `range(len(items))` and index into increments/weights without checking equal length. If the caller passes mismatched-length lists (e.g. items longer than increments), this raises an IndexError deep in arg construction; if increments is longer, extra values are silently dropped. TOPK.INCRBY and CMS.INCRBY both flow through here.","fix":"Validate `len(items) == len(increments)` (raise DataError on mismatch) before zipping, and iterate with zip() instead of index-based range(len()).","locations":[{"ref":"redis/commands/bf/__init__.py:70-82","code":"   70 |     @staticmethod\n   71 |     def append_items_and_increments(params, items, increments):\n   72 |         \"\"\"Append pairs of items and increments to params.\"\"\"\n   73 |         for i in range(len(items)):\n   74 |             params.append(items[i])\n   75 |             params.append(increments[i])\n   76 | \n   77 |     @staticmethod\n   78 |     def append_values_and_weights(params, items, weights):\n   79 |         \"\"\"Append pairs of items and weights to params.\"\"\"\n   80 |         for i in range(len(items)):\n   81 |             params.append(items[i])\n   82 |             params.append(weights[i])","lines":13,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/bf/__init__.py#L70-L82"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":true,"description":"zmpop raises a bare `raise DataError` with no message when neither or both of min/max are set, whereas its blocking sibling bzmpop raises DataError('Either min or max, but not both must be set'). The user gets an empty, unhelpful exception from zmpop. Copy-paste inconsistency between the two near-identical methods.","fix":"Add the same message: raise DataError('Either min or max, but not both must be set').","locations":[{"ref":"redis/commands/core.py:8467-8469","code":" 8467 |         args = [num_keys] + keys\n 8468 |         if (min and max) or (not min and not max):\n 8469 |             raise DataError","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L8467-L8469"},{"ref":"redis/commands/core.py:8522-8524","code":" 8522 |         args = [timeout, numkeys, *keys]\n 8523 |         if (min and max) or (not min and not max):\n 8524 |             raise DataError(\"Either min or max, but not both must be set\")","lines":3,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/core.py#L8522-L8524"}]},{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"`TextField.__init__` silently ignores an invalid `phonetic_matcher`. The PHONETIC token is only appended when `phonetic_matcher in [\"dm:en\", \"dm:fr\", \"dm:pt\", \"dm:es\"]`; any other truthy value (e.g. a typo like \"dm:de\" or \"en\") is dropped without error, so the field is created without phonetics and the user gets no feedback that their option was discarded.","fix":"Raise a DataError/ValueError when `phonetic_matcher` is set but not one of the supported values, instead of silently skipping it.","locations":[{"ref":"redis/commands/search/field.py:100-107","code":"  100 |         if phonetic_matcher and phonetic_matcher in [\n  101 |             \"dm:en\",\n  102 |             \"dm:fr\",\n  103 |             \"dm:pt\",\n  104 |             \"dm:es\",\n  105 |         ]:\n  106 |             Field.append_arg(self, self.PHONETIC)\n  107 |             Field.append_arg(self, phonetic_matcher)","lines":8,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/commands/search/field.py#L100-L107"}]},{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"CacheProxyConnection.send_packed_command ignores the check_health argument. It accepts 'check_health=True' but calls 'self._conn.send_packed_command(command)' without forwarding it, so health checks are always performed with the underlying default regardless of what the caller requested. This can cause unwanted PING recursion or health checks during handshake paths that explicitly pass check_health=False.","fix":"Forward the flag: 'self._conn.send_packed_command(command, check_health=check_health)'.","locations":[{"ref":"redis/connection.py:1707-1710","code":" 1707 |     def send_packed_command(self, command, check_health=True):\n 1708 |         # TODO: Investigate if it's possible to unpack command\n 1709 |         #  or extract keys from packed command\n 1710 |         self._conn.send_packed_command(command)","lines":4,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/connection.py#L1707-L1710"}]},{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"add_database catches only UnhealthyDatabaseException but the health check / failover path can raise other exceptions, and on the skip-path the unhealthy database is still added and may be auto-promoted. _check_db_health -> health_check_policy.execute raises UnhealthyDatabaseException for probe exceptions, but get_client() can raise ValueError/TypeError (unsupported client type, cluster with no nodes) which are not caught, so add_database fails hard even with skip_initial_health_check=True. Additionally, when the health check is skipped due to UnhealthyDatabaseException, the database is added with whatever circuit state it has and _change_active_database may still promote it if its weight is highest and circuit happens to be CLOSED.","fix":"Broaden/clarify exception handling around the initial health check when skip_initial_health_check is True, and ensure a database that failed (or skipped) its health check is left with circuit OPEN so it cannot be auto-promoted.","locations":[{"ref":"redis/multidb/client.py:212-220","code":"  212 |         try:\n  213 |             self._bg_scheduler.run_coro_sync(self._check_db_health, database)\n  214 |         except UnhealthyDatabaseException:\n  215 |             if not skip_initial_health_check:\n  216 |                 raise\n  217 | \n  218 |         highest_weighted_db, highest_weight = self._databases.get_top_n(1)[0]\n  219 |         self._databases.add(database, database.weight)\n  220 |         self._change_active_database(database, highest_weighted_db)","lines":9,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/multidb/client.py#L212-L220"},{"ref":"redis/asyncio/multidb/client.py:217-225","code":"  217 |         try:\n  218 |             await self._check_db_health(database)\n  219 |         except UnhealthyDatabaseException:\n  220 |             if not skip_initial_health_check:\n  221 |                 raise\n  222 | \n  223 |         highest_weighted_db, highest_weight = self._databases.get_top_n(1)[0]\n  224 |         self._databases.add(database, database.weight)\n  225 |         await self._change_active_database(database, highest_weighted_db)","lines":9,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/asyncio/multidb/client.py#L217-L225"}]},{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"RedisMetricsCollector.init_csc_items reads self.csc_items before it is ever assigned. _init_csc_metrics() creates csc_requests/csc_evictions/csc_network_saved but never csc_items, and __init__ does not set it either. The guard 'if MetricGroup.CSC not in self.config.metric_groups and not self.csc_items' evaluates 'not self.csc_items' whenever CSC is not in metric_groups, raising AttributeError. The recorder wrapper swallows the exception, so the CSC items observable gauge is silently never created - the metric is dead.","fix":"Initialize self.csc_items = None in __init__ (or in _init_csc_metrics), and fix the guard precedence: 'if MetricGroup.CSC not in self.config.metric_groups: return' on its own line. The 'and not self.csc_items' clause is also logically wrong (short-circuit evaluation makes it never reached when CSC IS enabled).","locations":[{"ref":"redis/observability/metrics.py:401-419","code":"  401 |     def init_csc_items(\n  402 |         self,\n  403 |         callback: Callable,\n  404 |     ) -> None:\n  405 |         \"\"\"\n  406 |         Initialize observable gauge for CSC items metric.\n  407 | \n  408 |         Args:\n  409 |             callback: Callback function to retrieve CSC items count\n  410 |         \"\"\"\n  411 |         if MetricGroup.CSC not in self.config.metric_groups and not self.csc_items:\n  412 |             return\n  413 | \n  414 |         self.csc_items = self.meter.create_observable_gauge(\n  415 |             name=\"redis.client.csc.items\",\n  416 |             unit=\"{item}\",\n  417 |             description=\"The total number of cached responses currently stored\",\n  418 |             callbacks=[callback],\n  419 |         )","lines":19,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/observability/metrics.py#L401-L419"}]},{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"SentinelConnectionPoolProxy.rotate_slaves is a generator that always `raise SlaveNotFoundError` after yielding the master fallback. Because it is a generator, the final `raise` only executes when the consumer exhausts all yields (i.e. tries every slave and the master and none connect). discover_slaves and connect_to consume it correctly, but the master fallback yields get_master_address() even for slave pools, meaning a slave_for() client can silently connect to the master. This may be intended fallback behavior but is undocumented and can surprise users expecting read-only routing.","fix":"Document the master-fallback behavior for slave pools, or make it opt-in; ensure callers that require a true replica do not silently get the master.","locations":[{"ref":"redis/sentinel.py:127-141","code":"  127 |     def rotate_slaves(self):\n  128 |         slaves = self.sentinel_manager.discover_slaves(self.service_name)\n  129 |         if slaves:\n  130 |             if self.slave_rr_counter is None:\n  131 |                 self.slave_rr_counter = random.randint(0, len(slaves) - 1)\n  132 |             for _ in range(len(slaves)):\n  133 |                 self.slave_rr_counter = (self.slave_rr_counter + 1) % len(slaves)\n  134 |                 slave = slaves[self.slave_rr_counter]\n  135 |                 yield slave\n  136 |         # Fallback to the master connection\n  137 |         try:\n  138 |             yield self.get_master_address()\n  139 |         except MasterNotFoundError:\n  140 |             pass\n  141 |         raise SlaveNotFoundError(f\"No slave found for {self.service_name!r}\")","lines":15,"link":"https://github.com/redis/redis-py/blob/83c2541001fd898190b3617786d5734f8954f179/redis/sentinel.py#L127-L141"}]},{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"`_is_keyless_command` (and its async twin) calls `self.commands.get(command_name)[\"subcommands\"]`
