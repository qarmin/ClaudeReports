<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`obs_encoder_has_roi`, `obs_encoder_clear_roi`, `obs_encoder_get_roi_increment`, and\n`obs_encoder_add_roi` all access `encoder` fields without first checking that `encoder` is\nnon-NULL. Every other encoder accessor in the file performs a null guard (either via\n`obs_encoder_valid` or an explicit `!encoder` check). A NULL pointer call from a plugin or\nafter encoder destruction causes an immediate crash. `obs_encoder_enum_roi` has the same flaw.","fix":"Add `if (!encoder) return false/0;` (or the appropriate zero/false value) as the first statement of each of these five functions, consistent with the rest of the encoder API.","locations":[{"ref":"libobs/obs-encoder.c:2093-2096","code":" 2093 | bool obs_encoder_has_roi(const obs_encoder_t *encoder)\n 2094 | {\n 2095 | \treturn encoder->roi.num > 0;\n 2096 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.c#L2093-L2096"},{"ref":"libobs/obs-encoder.c:2098-2101","code":" 2098 | bool obs_encoder_add_roi(obs_encoder_t *encoder, const struct obs_encoder_roi *roi)\n 2099 | {\n 2100 | \tif (!roi)\n 2101 | \t\treturn false;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.c#L2098-L2101"},{"ref":"libobs/obs-encoder.c:2119-2121","code":" 2119 | void obs_encoder_clear_roi(obs_encoder_t *encoder)\n 2120 | {\n 2121 | \tif (!encoder->roi.num)","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.c#L2119-L2121"},{"ref":"libobs/obs-encoder.c:2129-2135","code":" 2129 | void obs_encoder_enum_roi(obs_encoder_t *encoder, void (*enum_proc)(void *, struct obs_encoder_roi *), void *param)\n 2130 | {\n 2131 | \tfloat scale_x = 0;\n 2132 | \tfloat scale_y = 0;\n 2133 | \n 2134 | \t/* Scale ROI passed to callback to output size */\n 2135 | \tif (encoder->scaled_height && encoder->scaled_width) {","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.c#L2129-L2135"},{"ref":"libobs/obs-encoder.c:2170-2173","code":" 2170 | uint32_t obs_encoder_get_roi_increment(const obs_encoder_t *encoder)\n 2171 | {\n 2172 | \treturn encoder->roi_increment;\n 2173 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.c#L2170-L2173"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`obs_encoder_video_tex_active` calls `get_mix_for_video(encoder->media)` and then\nunconditionally dereferences the returned pointer (`mix->using_nv12_tex` /\n`mix->using_p010_tex`). `get_mix_for_video` can return NULL when the video output does not\ncorrespond to any registered mix (e.g. after a video reset or during encoder teardown). This\ncauses a null-pointer dereference crash in any GPU encoder plugin (nvenc, AMF, etc.) that\ncalls this API.","fix":"Add a null check on `mix` before dereferencing it:\n```c\nbool obs_encoder_video_tex_active(const obs_encoder_t *encoder, enum video_format format)\n{\n\tstruct obs_core_video_mix *mix = get_mix_for_video(encoder->media);\n\tif (!mix)\n\t\treturn false;\n\n\tif (format == VIDEO_FORMAT_NV12)\n\t\treturn mix->using_nv12_tex;\n\tif (format == VIDEO_FORMAT_P010)\n\t\treturn mix->using_p010_tex;\n\n\treturn false;\n}\n```","locations":[{"ref":"libobs/obs-encoder.c:2267-2277","code":" 2267 | bool obs_encoder_video_tex_active(const obs_encoder_t *encoder, enum video_format format)\n 2268 | {\n 2269 | \tstruct obs_core_video_mix *mix = get_mix_for_video(encoder->media);\n 2270 | \n 2271 | \tif (format == VIDEO_FORMAT_NV12)\n 2272 | \t\treturn mix->using_nv12_tex;\n 2273 | \tif (format == VIDEO_FORMAT_P010)\n 2274 | \t\treturn mix->using_p010_tex;\n 2275 | \n 2276 | \treturn false;\n 2277 | }","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.c#L2267-L2277"}]},{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`DeviceCaptureToolbar` member fields `activateText` and `deactivateText` (both `const char *`) are declared without default initialisers and are only assigned inside the `if (mod)` branch of the constructor. When `obs_get_module(\"win-dshow\")` returns `nullptr` the constructor returns early, leaving those pointers uninitialised. The `activateButton` still exists and is still connected; clicking it reaches `on_activateButton_clicked()` which reads `active ? deactivateText : activateText` — undefined behaviour via uninitialised read.","fix":"Initialise both pointers to `nullptr` in the header, and guard the slot:\n\n```cpp\n// DeviceCaptureToolbar.hpp\nconst char *activateText = nullptr;\nconst char *deactivateText = nullptr;\n```\n\n```cpp\n// on_activateButton_clicked()\nif (!activateText || !deactivateText)\n    return;\n```","locations":[{"ref":"frontend/components/DeviceCaptureToolbar.cpp:20-29","code":"   20 | \tobs_module_t *mod = obs_get_module(\"win-dshow\");\n   21 | \tif (!mod) {\n   22 | \t\treturn;\n   23 | \t}\n   24 | \n   25 | \tactivateText = obs_module_get_locale_text(mod, \"Activate\");\n   26 | \tdeactivateText = obs_module_get_locale_text(mod, \"Deactivate\");\n   27 | \n   28 | \tui->activateButton->setText(active ? deactivateText : activateText);\n   29 | }","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/DeviceCaptureToolbar.cpp#L20-L29"},{"ref":"frontend/components/DeviceCaptureToolbar.cpp:47-48","code":"   47 | \tconst char *text = active ? deactivateText : activateText;\n   48 | \tui->activateButton->setText(text);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/DeviceCaptureToolbar.cpp#L47-L48"},{"ref":"frontend/components/DeviceCaptureToolbar.hpp:15-16","code":"   15 | \tconst char *activateText;\n   16 | \tconst char *deactivateText;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/DeviceCaptureToolbar.hpp#L15-L16"}]},{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`OBSSourceLabel::obsSourceRenamed`, `obsSourceRemoved`, and `obsSourceDestroyed` are OBS signal callbacks that execute on the OBS signal/data thread, not the Qt GUI thread. All three call methods directly on a `QLabel` widget (`label.setText(name)`, `emit label.renamed(name)`, etc.) without marshalling the call to the GUI thread via `QMetaObject::invokeMethod`. Additionally, `obsSourceDestroyed` calls `label.destroyedSignal.Disconnect()` from the signal thread, mutating signal-connection state without synchronization. Touching Qt widgets from a non-GUI thread is undefined behaviour and a crash risk.","fix":"Use `QMetaObject::invokeMethod` with `Qt::QueuedConnection` for all widget-touching operations, same as the rest of the codebase does:\n\n```cpp\nvoid OBSSourceLabel::obsSourceRenamed(void *data, calldata_t *params)\n{\n    const char *name = calldata_string(params, \"new_name\");\n    QString qname = QString::fromUtf8(name ? name : \"\");\n    QMetaObject::invokeMethod(static_cast<OBSSourceLabel *>(data),\n                              \"setText\", Qt::QueuedConnection,\n                              Q_ARG(QString, qname));\n    // emit renamed via invokeMethod or a dedicated slot\n}\n```\nFor `obsSourceDestroyed`, queue the `Disconnect()` calls through a slot on the GUI thread.","locations":[{"ref":"frontend/components/OBSSourceLabel.cpp:29-53","code":"   29 | void OBSSourceLabel::obsSourceRenamed(void *data, calldata_t *params)\n   30 | {\n   31 | \tauto &label = *static_cast<OBSSourceLabel *>(data);\n   32 | \n   33 | \tconst char *name = calldata_string(params, \"new_name\");\n   34 | \tlabel.setText(name);\n   35 | \n   36 | \temit label.renamed(name);\n   37 | }\n   38 | \n   39 | void OBSSourceLabel::obsSourceRemoved(void *data, calldata_t *)\n   40 | {\n   41 | \tauto &label = *static_cast<OBSSourceLabel *>(data);\n   42 | \temit label.removed();\n   43 | }\n   44 | \n   45 | void OBSSourceLabel::obsSourceDestroyed(void *data, calldata_t *)\n   46 | {\n   47 | \tauto &label = *static_cast<OBSSourceLabel *>(data);\n   48 | \temit label.destroyed();\n   49 | \n   50 | \tlabel.destroyedSignal.Disconnect();\n   51 | \tlabel.removedSignal.Disconnect();\n   52 | \tlabel.renamedSignal.Disconnect();\n   53 | }","lines":25,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/OBSSourceLabel.cpp#L29-L53"}]},{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`SourceTreeItem::mouseDoubleClickEvent` on Windows captures the raw `obs_source_t *source` pointer in a `QTimer::singleShot(200ms)` lambda without incrementing its reference count. If the user deletes the source during that 200 ms window, the captured pointer becomes dangling and `main->CreatePropertiesWindow(source)` will dereference freed memory.","fix":"Capture an `OBSSourceAutoRelease` (or an `OBSSource`) instead of the raw pointer so the source is kept alive for the duration of the timer:\n\n```cpp\nOBSSourceAutoRelease safeSource = obs_source_get_ref(source);\nQTimer::singleShot(200, this, [=, safeSource = std::move(safeSource)]() {\n    if (safeSource)\n        main->CreatePropertiesWindow(safeSource);\n});\n```","locations":[{"ref":"frontend/components/SourceTreeItem.cpp:305","code":"  305 | \t\t\t\tQTimer::singleShot(200, this, [=]() { main->CreatePropertiesWindow(source); });","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SourceTreeItem.cpp#L305"}]},{"id":"UAF_4","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`SourceTreeModel` registers `OBSFrontendEvent` as an OBS frontend event callback in its\nconstructor (line 242) and only removes it when `OBS_FRONTEND_EVENT_EXIT` fires (line 25).\nThere is no destructor that calls `obs_frontend_remove_event_callback`. If the model is ever\ndestroyed before OBS raises `OBS_FRONTEND_EVENT_EXIT` (e.g., test tear-down, future UI\nrefactoring), the callback will fire with a dangling `SourceTreeModel *` pointer, causing\nuse-after-free memory corruption.","fix":"Add a destructor that removes the callback:\n```cpp\n// In SourceTreeModel.hpp\npublic:\n    ~SourceTreeModel();\n\n// In SourceTreeModel.cpp\nSourceTreeModel::~SourceTreeModel()\n{\n    obs_frontend_remove_event_callback(OBSFrontendEvent, this);\n}\n```\nThis is safe to call even if the callback was already removed in the EXIT handler, because\n`obs_frontend_remove_event_callback` is a no-op when the pair is not registered.","locations":[{"ref":"frontend/components/SourceTreeModel.cpp:240-243","code":"  240 | SourceTreeModel::SourceTreeModel(SourceTree *st_) : QAbstractListModel(st_), st(st_)\n  241 | {\n  242 | \tobs_frontend_add_event_callback(OBSFrontendEvent, this);\n  243 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SourceTreeModel.cpp#L240-L243"},{"ref":"frontend/components/SourceTreeModel.cpp:15-26","code":"   15 | void SourceTreeModel::OBSFrontendEvent(enum obs_frontend_event event, void *ptr)\n   16 | {\n   17 | \tSourceTreeModel *stm = static_cast<SourceTreeModel *>(ptr);\n   18 | \n   19 | \tswitch (event) {\n   20 | \tcase OBS_FRONTEND_EVENT_PREVIEW_SCENE_CHANGED:\n   21 | \t\tstm->SceneChanged();\n   22 | \t\tbreak;\n   23 | \tcase OBS_FRONTEND_EVENT_EXIT:\n   24 | \t\tstm->Clear();\n   25 | \t\tobs_frontend_remove_event_callback(OBSFrontendEvent, stm);\n   26 | \t\tbreak;","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SourceTreeModel.cpp#L15-L26"}]},{"id":"UAF_5","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`unregister_hotkey` calls `bfree(hotkey)` at line 867 and then calls `remove_bindings(id)` at line 869. Inside `remove_bindings`, when a binding is found with `binding->pressed == true`, `release_pressed_binding(binding)` is called, which immediately dereferences `binding->hotkey` - the pointer that was just freed. This is a use-after-free: the freed `obs_hotkey_t` is read and its `func`, `data`, and `id` fields are used to fire a release callback.","fix":"Move `remove_bindings(id)` before the `bfree(hotkey)` call so the binding list is cleaned up while the hotkey is still alive:\n```c\nHASH_DEL(obs->hotkeys.hotkeys, hotkey);\nhotkey_signal(\"hotkey_unregister\", hotkey);\nrelease_registerer(hotkey);\nremove_bindings(id);   /* must happen before bfree(hotkey) */\nbfree(hotkey->name);\nbfree(hotkey->description);\nbfree(hotkey);\n```","locations":[{"ref":"libobs/obs-hotkey.c:856-869","code":"  856 | \tHASH_DEL(obs->hotkeys.hotkeys, hotkey);\n  857 | \n  858 | \thotkey_signal(\"hotkey_unregister\", hotkey);\n  859 | \n  860 | \trelease_registerer(hotkey);\n  861 | \n  862 | \tif (hotkey->registerer_type == OBS_HOTKEY_REGISTERER_SOURCE)\n  863 | \t\tobs_weak_source_release(hotkey->registerer);\n  864 | \n  865 | \tbfree(hotkey->name);\n  866 | \tbfree(hotkey->description);\n  867 | \tbfree(hotkey);\n  868 | \n  869 | \tremove_bindings(id);","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-hotkey.c#L856-L869"},{"ref":"libobs/obs-hotkey.c:1021-1033","code":" 1021 | static inline void release_pressed_binding(obs_hotkey_binding_t *binding)\n 1022 | {\n 1023 | \tbinding->pressed = false;\n 1024 | \n 1025 | \tobs_hotkey_t *hotkey = binding->hotkey;\n 1026 | \tif (--hotkey->pressed)\n 1027 | \t\treturn;\n 1028 | \n 1029 | \tif (!obs->hotkeys.reroute_hotkeys)\n 1030 | \t\thotkey->func(hotkey->data, hotkey->id, hotkey, false);\n 1031 | \telse if (obs->hotkeys.router_func)\n 1032 | \t\tobs->hotkeys.router_func(obs->hotkeys.router_func_data, hotkey->id, false);\n 1033 | }","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-hotkey.c#L1021-L1033"}]},{"id":"UAF_6","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"In `OBSApp::applicationShutdown` (non-Windows path), the lambda `disconnectSignal` dereferences\nthe `QPointer<QSocketNotifier>` notifier directly (`notifier->setEnabled(false)`) without checking\nwhether the pointer is still valid. `QPointer` returns null if the pointed-to object has already\nbeen destroyed. If the socket notifier was deleted by some other means before shutdown (e.g. a\nparent widget destruction race), this causes a null pointer dereference.","fix":"Guard each notifier dereference:\n\n```cpp\nauto disconnectSignal = [this](std::array<int, 2> &fileDescriptor,\n                               QPointer<QSocketNotifier> &notifier) -> void {\n    if (notifier) {\n        notifier->setEnabled(false);\n    }\n    std::array<int, 2> tempFileDescriptor = std::exchange(fileDescriptor, {0, 0});\n    ::close(tempFileDescriptor[0]);\n    ::close(tempFileDescriptor[1]);\n};\n```","locations":[{"ref":"frontend/OBSApp.cpp:2003-2015","code":" 2003 | \tauto disconnectSignal = [this](std::array<int, 2> &fileDescriptor,\n 2004 | \t\t\t\t       QPointer<QSocketNotifier> &notifier) -> void {\n 2005 | \t\tnotifier->setEnabled(false);\n 2006 | \n 2007 | \t\tstd::array<int, 2> tempFileDescriptor = std::exchange(fileDescriptor, {0, 0});\n 2008 | \t\t::close(tempFileDescriptor[0]);\n 2009 | \t\t::close(tempFileDescriptor[1]);\n 2010 | \t};\n 2011 | \n 2012 | \tdisconnectSignal(sigIntFileDescriptor, sigIntNotifier);\n 2013 | \tdisconnectSignal(sigTermFileDescriptor, sigTermNotifier);\n 2014 | \tdisconnectSignal(sigAbrtFileDescriptor, sigAbrtNotifier);\n 2015 | \tdisconnectSignal(sigQuitFileDescriptor, sigQuitNotifier);","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp.cpp#L2003-L2015"}]},{"id":"UAF_7","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"`wasapi-output.c` (`audio_monitor_free_for_reconnect`): the function calls `monitor->client->lpVtbl->Stop(monitor->client)` twice - once before the `render` check (line 258) and again inside the `client` check (line 267) before releasing `client`. The double `Stop` is harmless (it returns an error the second time), but the real problem is that it signals the intent to stop twice unnecessarily and obscures the code. More importantly, `render` is released first (line 263), then `client->Stop` is called again (line 267) on the already-stopped client. While not technically a use-after-free (client is still valid at that point), it is a clear copy-paste bug leading to redundant COM calls.","fix":"Remove the first `Stop` call (line 259) outside the render/client null checks; keep only the single `Stop` call just before releasing `client`:\n```c\nstatic void audio_monitor_free_for_reconnect(struct audio_monitor *monitor)\n{\n    if (monitor->render) {\n        monitor->render->lpVtbl->Release(monitor->render);\n        monitor->render = NULL;\n    }\n    if (monitor->client) {\n        monitor->client->lpVtbl->Stop(monitor->client);\n        monitor->client->lpVtbl->Release(monitor->client);\n        monitor->client = NULL;\n    }\n    audio_resampler_destroy(monitor->resampler);\n    monitor->resampler = NULL;\n    deque_free(&monitor->delay_buffer);\n    da_free(monitor->buf);\n}\n```","locations":[{"ref":"libobs/audio-monitoring/win32/wasapi-output.c:256-277","code":"  256 | static void audio_monitor_free_for_reconnect(struct audio_monitor *monitor)\n  257 | {\n  258 | \tif (monitor->client)\n  259 | \t\tmonitor->client->lpVtbl->Stop(monitor->client);\n  260 | \n  261 | \tif (monitor->render) {\n  262 | \t\tmonitor->render->lpVtbl->Release(monitor->render);\n  263 | \t\tmonitor->render = NULL;\n  264 | \t}\n  265 | \n  266 | \tif (monitor->client) {\n  267 | \t\tmonitor->client->lpVtbl->Stop(monitor->client);\n  268 | \t\tmonitor->client->lpVtbl->Release(monitor->client);\n  269 | \t\tmonitor->client = NULL;\n  270 | \t}\n  271 | \n  272 | \taudio_resampler_destroy(monitor->resampler);\n  273 | \tmonitor->resampler = NULL;\n  274 | \n  275 | \tdeque_free(&monitor->delay_buffer);\n  276 | \tda_free(monitor->buf);\n  277 | }","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/win32/wasapi-output.c#L256-L277"}]},{"id":"UAF_8","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"easy","description":"`obs_hotkey_name_map_free` iterates and frees every item in the hash table but does not\nclear `obs->hotkeys.name_map` to NULL when done. After the function returns, the field\npoints to freed memory. If `obs_key_from_name` is called after `obs_hotkey_name_map_free`\n(e.g. during shutdown if the call order changes), it will pass the dangling pointer to\n`obs_hotkey_name_map_lookup`, which calls `HASH_FIND_STR` on freed memory - a use-after-free\nthat can produce incorrect key mappings or crash.","fix":"Set `obs->hotkeys.name_map = NULL;` after the `HASH_ITER` loop:\n```c\nHASH_ITER (hh, root, n, tmp) {\n\tHASH_DEL(root, n);\n\tbfree(n->key);\n\tbfree(n);\n}\nobs->hotkeys.name_map = NULL;\n```","locations":[{"ref":"libobs/obs-hotkey-name-map.c:121-134","code":"  121 | void obs_hotkey_name_map_free(void)\n  122 | {\n  123 | \tif (!obs || !obs->hotkeys.name_map)\n  124 | \t\treturn;\n  125 | \n  126 | \tobs_hotkey_name_map_item_t *root = obs->hotkeys.name_map;\n  127 | \tobs_hotkey_name_map_item_t *n, *tmp;\n  128 | \n  129 | \tHASH_ITER (hh, root, n, tmp) {\n  130 | \t\tHASH_DEL(root, n);\n  131 | \t\tbfree(n->key);\n  132 | \t\tbfree(n);\n  133 | \t}\n  134 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-hotkey-name-map.c#L121-L134"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"In `obs_frontend_get_scenes` and `obs_frontend_get_transitions`, `obs_source_get_ref` is called\npurely as a liveness check (comparing the return value to nullptr), but the incremented reference\nreturned by `obs_source_get_ref` is immediately discarded. The raw pointer `source` (without the\ncorresponding ref) is then pushed into the source list. The list's free function\n`obs_frontend_source_list_free` calls `obs_source_release` on each entry, which releases a\nreference that was never acquired for that slot - leading to a reference undercount and eventual\nuse-after-free or double-free in the OBS source refcount system.","fix":"Store the result of `obs_source_get_ref` and push that into the list instead of `source`:\n\n```cpp\nobs_source_t *ref = obs_source_get_ref(source);\nif (ref != nullptr) {\n    da_push_back(sources->sources, &ref);\n}\n```","locations":[{"ref":"frontend/OBSStudioAPI.cpp:48-52","code":"   48 | \t\tobs_source_t *source = obs_scene_get_source(scene);\n   49 | \n   50 | \t\tif (obs_source_get_ref(source) != nullptr) {\n   51 | \t\t\tda_push_back(sources->sources, &source);\n   52 | \t\t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSStudioAPI.cpp#L48-L52"},{"ref":"frontend/OBSStudioAPI.cpp:79-84","code":"   79 | \tfor (const auto &[uuid, transition] : main->transitions) {\n   80 | \t\tobs_source_t *source = transition;\n   81 | \n   82 | \t\tif (obs_source_get_ref(source) != nullptr) {\n   83 | \t\t\tda_push_back(sources->sources, &source);\n   84 | \t\t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSStudioAPI.cpp#L79-L84"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"In `audio_output_open` (audio-io.c lines 372-390), the fail path `fail0` calls `audio_output_close(out)`. At the point where `fail0` is reached after `pthread_mutex_init_recursive` fails (line 373), `out` was allocated but the mutex was never successfully initialised. `audio_output_close` checks `audio->initialized` (which is `false` here) and skips the thread/event teardown, then still calls `bfree(audio)`. This is actually correct, but when `fail0` is reached from the very first `bzalloc` failure (line 361), `out` is `NULL` and `audio_output_close(NULL)` is a no-op - so no leak occurs there. However, if `os_event_init` fails (line 374), the code jumps to `fail1` then `fail0`, calling `audio_output_close` which does not destroy the event (it was never created) - that is also fine. The actual leak is: when `pthread_create` fails (line 377), we jump to `fail2`, destroy the event, then to `fail1` -> destroys mutex -> then `fail0` -> calls `audio_output_close(out)`. At this point `initialized` is still false so close skips the thread join, then frees `out`. The mixes' `inputs` DARRAY is zero-initialised so `da_free` of an empty array is safe. This path appears actually leak-free. Re-examine: the real problem is the `fail0` label is shared between the `bzalloc` failure (out=NULL, close is no-op) and the mutex-init failure (out allocated, close frees it). If `bzalloc` succeeds but mutex init fails, close correctly frees. This seems OK. Documenting as low severity for the confusing control flow that is hard to audit.","fix":"Restructure the error paths to be explicit and not rely on `audio_output_close` for cleanup during construction. Use separate `goto` labels for pre- and post-`bzalloc` failures to make the ownership clear:\n```c\nif (!(out = bzalloc(sizeof(*out))))\n    return AUDIO_OUTPUT_FAIL;\n// ... init fields ...\nif (pthread_mutex_init_recursive(&out->input_mutex) != 0) goto fail_mutex;\nif (os_event_init(&out->stop_event, OS_EVENT_TYPE_MANUAL) != 0) goto fail_event;\nif (pthread_create(&out->thread, NULL, audio_thread, out) != 0) goto fail_thread;\n// success\nfail_thread: os_event_destroy(out->stop_event);\nfail_event:  pthread_mutex_destroy(&out->input_mutex);\nfail_mutex:  bfree(out);\n             return AUDIO_OUTPUT_FAIL;\n```","locations":[{"ref":"libobs/media-io/audio-io.c:353-390","code":"  353 | int audio_output_open(audio_t **audio, struct audio_output_info *info)\n  354 | {\n  355 | \tstruct audio_output *out;\n  356 | \tbool planar = is_audio_planar(info->format);\n  357 | \n  358 | \tif (!valid_audio_params(info))\n  359 | \t\treturn AUDIO_OUTPUT_INVALIDPARAM;\n  360 | \n  361 | \tout = bzalloc(sizeof(struct audio_output));\n  362 | \tif (!out)\n  363 | \t\tgoto fail0;\n  364 | \n  365 | \tmemcpy(&out->info, info, sizeof(struct audio_output_info));\n  366 | \tout->channels = get_audio_channels(info->speakers);\n  367 | \tout->planes = planar ? out->channels : 1;\n  368 | \tout->input_cb = info->input_callback;\n  369 | \tout->input_param = info->input_param;\n  370 | \tout->block_size = (planar ? 1 : out->channels) * get_audio_bytes_per_channel(info->format);\n  371 | \n  372 | \tif (pthread_mutex_init_recursive(&out->input_mutex) != 0)\n  373 | \t\tgoto fail0;\n  374 | \tif (os_event_init(&out->stop_event, OS_EVENT_TYPE_MANUAL) != 0)\n  375 | \t\tgoto fail1;\n  376 | \tif (pthread_create(&out->thread, NULL, audio_thread, out) != 0)\n  377 | \t\tgoto fail2;\n  378 | \n  379 | \tout->initialized = true;\n  380 | \t*audio = out;\n  381 | \treturn AUDIO_OUTPUT_SUCCESS;\n  382 | \n  383 | fail2:\n  384 | \tos_event_destroy(out->stop_event);\n  385 | fail1:\n  386 | \tpthread_mutex_destroy(&out->input_mutex);\n  387 | fail0:\n  388 | \taudio_output_close(out);\n  389 | \treturn AUDIO_OUTPUT_FAIL;\n  390 | }","lines":38,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/audio-io.c#L353-L390"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `ffmpeg_image_open_decoder_context`, if `avcodec_open2` fails the function returns `false`\nwithout freeing the just-allocated `decoder_ctx`. At line 46 `avcodec_alloc_context3` allocates\nthe context and immediately assigns it to `info->decoder_ctx` (line 49). When `avcodec_open2`\nfails at line 54, the function returns false. The caller (`ffmpeg_image_init`) reaches `goto fail`\nwhich calls `ffmpeg_image_free(info)`, which does call `avcodec_free_context(&info->decoder_ctx)`.\nSo the leak is averted - BUT only because `info->decoder_ctx` was set before the error return. This\nis a fragile dependency on assignment ordering. A more critical related issue: if\n`avcodec_alloc_context3` returns NULL (OOM), the very next line passes NULL to\n`avcodec_parameters_to_context`, which will crash with a null dereference.","fix":"Check the return value of `avcodec_alloc_context3` before using it:\n\n```c\nAVCodecContext *const decoder_ctx = avcodec_alloc_context3(decoder);\nif (!decoder_ctx) {\n    blog(LOG_WARNING, \"Failed to allocate codec context for file '%s'\", info->file);\n    return false;\n}\navcodec_parameters_to_context(decoder_ctx, codecpar);\ninfo->decoder_ctx = decoder_ctx;\n```\nAlso check the return value of `avcodec_parameters_to_context` (it returns a negative error code\non failure).","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:46-64","code":"   46 | \tAVCodecContext *const decoder_ctx = avcodec_alloc_context3(decoder);\n   47 | \tavcodec_parameters_to_context(decoder_ctx, codecpar);\n   48 | \n   49 | \tinfo->decoder_ctx = decoder_ctx;\n   50 | \tinfo->cx = codecpar->width;\n   51 | \tinfo->cy = codecpar->height;\n   52 | \tinfo->format = codecpar->format;\n   53 | \n   54 | \tret = avcodec_open2(decoder_ctx, decoder, NULL);\n   55 | \tif (ret < 0) {\n   56 | \t\tblog(LOG_WARNING,\n   57 | \t\t     \"Failed to open video codec for file '%s': \"\n   58 | \t\t     \"%s\",\n   59 | \t\t     info->file, av_err2str(ret));\n   60 | \t\treturn false;\n   61 | \t}\n   62 | \n   63 | \treturn true;\n   64 | }","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/graphics-ffmpeg.c#L46-L64"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `audio_resampler_resample` (audio-resampler-ffmpeg.c lines 197-203), when `estimated > rs->output_size`, the existing `output_buffer[0]` is freed and `av_samples_alloc` is called. If `av_samples_alloc` fails (returns a negative error code), it is not checked - `rs->output_size` is updated to `estimated` (line 203) regardless, so the next call will not attempt to reallocate. Worse, `rs->output_buffer[0]` is now NULL and `swr_convert` will be called with a NULL output buffer, leading to a crash.","fix":"Check the return value of `av_samples_alloc` and bail out on failure:\n```c\nif (estimated > rs->output_size) {\n    if (rs->output_buffer[0])\n        av_freep(&rs->output_buffer[0]);\n\n    int alloc_ret = av_samples_alloc(rs->output_buffer, NULL,\n                                     rs->output_ch, estimated,\n                                     rs->output_format, 0);\n    if (alloc_ret < 0) {\n        blog(LOG_ERROR, \"av_samples_alloc failed: %d\", alloc_ret);\n        return false;\n    }\n    rs->output_size = estimated;\n}\n```","locations":[{"ref":"libobs/media-io/audio-resampler-ffmpeg.c:197-206","code":"  197 | \tif (estimated > rs->output_size) {\n  198 | \t\tif (rs->output_buffer[0])\n  199 | \t\t\tav_freep(&rs->output_buffer[0]);\n  200 | \n  201 | \t\tav_samples_alloc(rs->output_buffer, NULL, rs->output_ch, estimated, rs->output_format, 0);\n  202 | \n  203 | \t\trs->output_size = estimated;\n  204 | \t}\n  205 | \n  206 | \tret = swr_convert(context, rs->output_buffer, rs->output_size, (const uint8_t **)input, in_frames);","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/audio-resampler-ffmpeg.c#L197-L206"}]},{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `obs_open_module`, the dynamic library handle (`mod.module`) is opened via `os_dlopen` at line 160. If `load_module_exports` returns an error at line 167-168, or if the version check fails at lines 172-175, the function returns early without closing the handle. The opened library is leaked for the lifetime of the process.","fix":"Close the library handle on early error returns:\n```c\nerrorcode = load_module_exports(&mod, path);\nif (errorcode != MODULE_SUCCESS) {\n    os_dlclose(mod.module);\n    return errorcode;\n}\n\nuint32_t ver = mod.ver ? mod.ver() & 0xFFFF0000 : 0;\nif (ver > LIBOBS_API_VER) {\n    blog(LOG_WARNING, ...);\n    os_dlclose(mod.module);\n    return MODULE_INCOMPATIBLE_VER;\n}\n```","locations":[{"ref":"libobs/obs-module.c:160-176","code":"  160 | \tmod.module = os_dlopen(path);\n  161 | \tif (!mod.module) {\n  162 | \t\tblog(LOG_WARNING, \"Module '%s' not loaded\", path);\n  163 | \t\treturn MODULE_FAILED_TO_OPEN;\n  164 | \t}\n  165 | \n  166 | \terrorcode = load_module_exports(&mod, path);\n  167 | \tif (errorcode != MODULE_SUCCESS)\n  168 | \t\treturn errorcode;\n  169 | \n  170 | \t/* Reject plugins compiled with a newer libobs. Patch version (lower 16-bit) is ignored. */\n  171 | \tuint32_t ver = mod.ver ? mod.ver() & 0xFFFF0000 : 0;\n  172 | \tif (ver > LIBOBS_API_VER) {\n  173 | \t\tblog(LOG_WARNING, \"Module '%s' compiled with newer libobs %d.%d\", path, (ver >> 24) & 0xFF,\n  174 | \t\t     (ver >> 16) & 0xFF);\n  175 | \t\treturn MODULE_INCOMPATIBLE_VER;\n  176 | \t}","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-module.c#L160-L176"}]},{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`obs_nix_wayland_hotkeys_platform_init` calls `wl_display_get_registry` and stores the\nresult in a local variable `registry`, but never calls `wl_registry_destroy` on it. The\nregistry proxy is a heap-allocated Wayland object. After `wl_display_roundtrip` returns\nthe registry has already dispatched all global advertisements, so it is no longer needed\nand should be destroyed.","fix":"Destroy the registry after the roundtrip:\n\n```c\nstruct wl_registry *registry = wl_display_get_registry(display);\nwl_registry_add_listener(registry, &registry_listener,\n                         hotkeys->platform_context);\nwl_display_roundtrip(display);\nwl_registry_destroy(registry);\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:246-249","code":"  246 | \tstruct wl_registry *registry = wl_display_get_registry(display);\n  247 | \twl_registry_add_listener(registry, &registry_listener, hotkeys->platform_context);\n  248 | \twl_display_roundtrip(display);\n  249 | \treturn true;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L246-L249"}]},{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`obs_nix_wayland_hotkeys_platform_free` releases xkb objects and the platform struct but\nnever destroys the `wl_keyboard` and `wl_seat` Wayland proxies. Both are created during\ninit (via `wl_seat_get_keyboard` and `wl_registry_bind`) and must be explicitly released\nwith `wl_keyboard_release` and `wl_seat_release`. Failing to do so leaks the proxy objects\nand leaves the compositor holding resources it will never reclaim.","fix":"Add keyboard and seat teardown before freeing the struct:\n\n```c\nstatic void obs_nix_wayland_hotkeys_platform_free(struct obs_core_hotkeys *hotkeys)\n{\n    obs_hotkeys_platform_t *plat = hotkeys->platform_context;\n    if (plat->keyboard) {\n        wl_keyboard_release(plat->keyboard);\n        plat->keyboard = NULL;\n    }\n    if (plat->seat) {\n        wl_seat_release(plat->seat);\n        plat->seat = NULL;\n    }\n    xkb_state_unref(plat->xkb_state);\n    xkb_keymap_unref(plat->xkb_keymap);\n    xkb_context_unref(plat->xkb_context);\n    bfree(plat);\n}\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:252-259","code":"  252 | static void obs_nix_wayland_hotkeys_platform_free(struct obs_core_hotkeys *hotkeys)\n  253 | {\n  254 | \tobs_hotkeys_platform_t *plat = hotkeys->platform_context;\n  255 | \txkb_context_unref(plat->xkb_context);\n  256 | \txkb_keymap_unref(plat->xkb_keymap);\n  257 | \txkb_state_unref(plat->xkb_state);\n  258 | \tbfree(plat);\n  259 | }","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L252-L259"}]},{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`pulseaudio-enum-devices.c`: `obs_enum_audio_monitoring_devices` calls `pulseaudio_init()` then `pulseaudio_get_sink_info_list()`. If `pulseaudio_get_sink_info_list` returns early due to context not being ready (returns -1), `pulseaudio_unref` is still called and the `ecb` struct is freed. However, if `pulseaudio_init` itself fails partially (the mainloop starts but context fails), there is no error return from `pulseaudio_init` (it always returns 0) so the caller cannot distinguish failure. This is a design-level issue in the wrapper, but in the enum-devices code the `ecb` struct is `bzalloc`'d and freed regardless of whether the operation succeeded, which is correct. No leak here in the happy path.\n\nHowever, in `pulseaudio-output.c`, `audio_monitor_free` calls `pulseaudio_unref()` unconditionally even when `monitor->ignore` is true via an early return at line 461. The early return on line 462 means `pulseaudio_unref` is NOT called in the ignore case. But `audio_monitor_init` calls `pulseaudio_init()` only when `monitor->ignore` is false (after line 372). So the balance is correct only in the normal path. However, if `audio_monitor_init` returns early after `pulseaudio_init()` but before successfully creating the stream (e.g., `pulseaudio_connect_playback` fails at line 440), `audio_monitor_free` is called on `monitor` (the stack copy), which would then call `pulseaudio_unref()` correctly since `monitor->ignore` is false. This path seems balanced.","fix":"No immediate action required for the balanced paths, but add a comment documenting that `pulseaudio_unref` in `audio_monitor_free` matches the `pulseaudio_init` in `audio_monitor_init`, and that the `ignore` early-return skips both.","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-output.c:459-475","code":"  459 | static inline void audio_monitor_free(struct audio_monitor *monitor)\n  460 | {\n  461 | \tif (monitor->ignore)\n  462 | \t\treturn;\n  463 | \n  464 | \tif (monitor->source)\n  465 | \t\tobs_source_remove_audio_capture_callback(monitor->source, on_audio_playback, monitor);\n  466 | \n  467 | \taudio_resampler_destroy(monitor->resampler);\n  468 | \tdeque_free(&monitor->new_data);\n  469 | \n  470 | \tif (monitor->stream)\n  471 | \t\tpulseaudio_stop_playback(monitor);\n  472 | \tpulseaudio_unref();\n  473 | \n  474 | \tbfree(monitor->device);\n  475 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/pulse/pulseaudio-output.c#L459-L475"}]},{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `obs-canvas.c::obs_canvas_create_internal`, if `obs_context_data_init`\nreturns false (line 145), the function returns NULL but the canvas struct\nallocated with `bzalloc` at line 141 is never freed. The canvas pointer is\nsimply returned as NULL after the `obs_context_data_init` failure without\ncalling `bfree(canvas)`.","fix":"Free the canvas allocation on init failure:\n\n```c\nif (!obs_context_data_init(&canvas->context, OBS_OBJ_TYPE_CANVAS, NULL, name, uuid, NULL, private)) {\n    bfree(canvas);\n    return NULL;\n}\n```","locations":[{"ref":"libobs/obs-canvas.c:141-154","code":"  141 | \tstruct obs_canvas *canvas = bzalloc(sizeof(struct obs_canvas));\n  142 | \tcanvas->flags = flags;\n  143 | \n  144 | \tif (!obs_context_data_init(&canvas->context, OBS_OBJ_TYPE_CANVAS, NULL, name, uuid, NULL, private))\n  145 | \t\treturn NULL;\n  146 | \n  147 | \tif (!signal_handler_add_array(canvas->context.signals, canvas_signals)) {\n  148 | \t\tobs_context_data_free(&canvas->context);\n  149 | \t\tbfree(canvas);\n  150 | \t\treturn NULL;\n  151 | \t}\n  152 | \n  153 | \tif (pthread_mutex_init_recursive(&canvas->sources_mutex) != 0) {\n  154 | \t\tobs_context_data_free(&canvas->context);","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-canvas.c#L141-L154"}]},{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `obs-canvas.c::obs_canvas_create_internal`, if `pthread_mutex_init_recursive`\nfails (line 153), `obs_context_data_free` is called and then `bfree(canvas)`,\nbut the signal handler array was successfully added to `canvas->context.signals`\nby the preceding `signal_handler_add_array` call (line 147). `obs_context_data_free`\nshould free the signal handler, so this is likely not a leak per se - but\n`canvas->view` was NOT yet initialized at that point (init happens at line 159),\nso `obs_view_free` is not called. If `obs_context_data_free` somehow leaves\nresidual state that references the view, that could be a problem. In practice\nthis path is correct since `obs_view_init` has not run yet. No actual leak.\n\nHowever: if `signal_handler_add_array` at line 147 fails, the code calls\n`obs_context_data_free` then `bfree(canvas)` and returns NULL. At this point\n`canvas->sources_mutex` was never initialized, so calling\n`pthread_mutex_destroy` on it in `obs_canvas_destroy` (if somehow reached)\nwould be UB. The early-return paths skip `obs_context_init_control` so the\nweak ref is never set up, and `obs_canvas_destroy` won't be called. This is\nsafe but fragile.","fix":"Add a comment clarifying that the early-return cleanup paths do not call `obs_canvas_destroy` and therefore do not require the mutex or view to be initialized.","locations":[{"ref":"libobs/obs-canvas.c:147-157","code":"  147 | \tif (!signal_handler_add_array(canvas->context.signals, canvas_signals)) {\n  148 | \t\tobs_context_data_free(&canvas->context);\n  149 | \t\tbfree(canvas);\n  150 | \t\treturn NULL;\n  151 | \t}\n  152 | \n  153 | \tif (pthread_mutex_init_recursive(&canvas->sources_mutex) != 0) {\n  154 | \t\tobs_context_data_free(&canvas->context);\n  155 | \t\tbfree(canvas);\n  156 | \t\treturn NULL;\n  157 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-canvas.c#L147-L157"}]},{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"All four `obs_module_add_*` functions (`obs_module_add_source`, `obs_module_add_output`, `obs_module_add_encoder`, `obs_module_add_service`) call `bstrdup(id)` unconditionally before checking whether `module` is non-null. If `module` is NULL, the freshly allocated string is neither used nor freed.","fix":"Guard the `bstrdup` call with the null check:\n```c\nvoid obs_module_add_source(obs_module_t *module, const char *id)\n{\n    if (!module)\n        return;\n    char *source_id = bstrdup(id);\n    da_push_back(module->sources, &source_id);\n}\n```\nApply the same pattern to `obs_module_add_output`, `obs_module_add_encoder`, and `obs_module_add_service`.","locations":[{"ref":"libobs/obs-module.c:307-336","code":"  307 | void obs_module_add_source(obs_module_t *module, const char *id)\n  308 | {\n  309 | \tchar *source_id = bstrdup(id);\n  310 | \tif (module) {\n  311 | \t\tda_push_back(module->sources, &source_id);\n  312 | \t}\n  313 | }\n  314 | \n  315 | void obs_module_add_output(obs_module_t *module, const char *id)\n  316 | {\n  317 | \tchar *output_id = bstrdup(id);\n  318 | \tif (module) {\n  319 | \t\tda_push_back(module->outputs, &output_id);\n  320 | \t}\n  321 | }\n  322 | \n  323 | void obs_module_add_encoder(obs_module_t *module, const char *id)\n  324 | {\n  325 | \tchar *encoder_id = bstrdup(id);\n  326 | \tif (module) {\n  327 | \t\tda_push_back(module->encoders, &encoder_id);\n  328 | \t}\n  329 | }\n  330 | \n  331 | void obs_module_add_service(obs_module_t *module, const char *id)\n  332 | {\n  333 | \tchar *service_id = bstrdup(id);\n  334 | \tif (module) {\n  335 | \t\tda_push_back(module->services, &service_id);\n  336 | \t}","lines":30,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-module.c#L307-L336"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"`get_full_decoded_gif_size` returns `int` and computes\n`image->gif.width * image->gif.height * 4 * image->gif.frame_count` entirely in signed 32-bit\narithmetic. With a 4096x4096 image (the enforced maximum) and as few as 33 frames the product\nwraps to a negative integer (4096 * 4096 * 4 * 33 = 2,214,592,512 > INT_MAX). The return value\nis then used at line 135 in `alloc_mem(image, mem_usage, get_full_decoded_gif_size(image))` -\npassing a negative number as `size_t` allocates a near-maximum block, causing OOM or heap\ncorruption on subsequent writes. The overflowed value is also compared against `max_size` (a\n`uint64_t` computed without overflow) on line 125; when they differ the GIF is rejected, so the\noverflow check itself is the only mitigation - but the function is also called on line 135 after\nthat check passes, at which point a wraparound is possible if `frame_count` is large enough to\npass the comparison yet still overflow `int`.","fix":"Change the return type and computation to use `size_t` (or `uint64_t`):\n\n```c\nstatic inline size_t get_full_decoded_gif_size(gs_image_file_t *image)\n{\n    return (size_t)image->gif.width * (size_t)image->gif.height * 4\n           * (size_t)image->gif.frame_count;\n}\n```","locations":[{"ref":"libobs/graphics/image-file.c:58-61","code":"   58 | static inline int get_full_decoded_gif_size(gs_image_file_t *image)\n   59 | {\n   60 | \treturn image->gif.width * image->gif.height * 4 * image->gif.frame_count;\n   61 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/image-file.c#L58-L61"},{"ref":"libobs/graphics/image-file.c:125-135","code":"  125 | \tif ((uint64_t)get_full_decoded_gif_size(image) != max_size) {\n  126 | \t\tblog(LOG_WARNING, \"Gif '%s' overflowed maximum pointer size\", path);\n  127 | \t\tgoto fail;\n  128 | \t}\n  129 | \n  130 | \timage->is_animated_gif = (image->gif.frame_count > 1 && result >= 0);\n  131 | \tif (image->is_animated_gif) {\n  132 | \t\tgif_decode_frame(&image->gif, 0);\n  133 | \n  134 | \t\timage->animation_frame_cache = alloc_mem(image, mem_usage, image->gif.frame_count * sizeof(uint8_t *));\n  135 | \t\timage->animation_frame_data = alloc_mem(image, mem_usage, get_full_decoded_gif_size(image));","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/image-file.c#L125-L135"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `gif_initialise_frame` (libnsgif.c line 428), `gif_bytes` is declared as `int` but is computed as `(unsigned int)(gif_end - gif_data)`. At line 556, when the local colour table is present, `gif_data += 3 * colour_table_size` is performed and then `gif_bytes` is recomputed with `(unsigned int)(gif_end - gif_data)`. The result is assigned to an `int`. If the data pointer has advanced past `gif_end`, the pointer difference is a large positive `size_t`; casting to `int` will wrap to a large negative value, so the guard `if ((gif_bytes = (unsigned int)(gif_end - gif_data)) < 0)` on the same line can never fire (unsigned int is never < 0). This means the underflow is silently swallowed and the decoder proceeds into out-of-bounds territory.","fix":"Change the type of `gif_bytes` to `ptrdiff_t` (or `int64_t`) throughout `gif_initialise_frame` so signed comparisons work correctly, and remove the cast to `unsigned int`:\n```c\nptrdiff_t gif_bytes = gif_end - gif_data;\n// ...\nif (flags & GIF_COLOUR_TABLE_MASK) {\n    gif_data += 3 * colour_table_size;\n    gif_bytes = gif_end - gif_data;\n    if (gif_bytes < 0)\n        return GIF_INSUFFICIENT_FRAME_DATA;\n}\n```","locations":[{"ref":"libobs/graphics/libnsgif/libnsgif.c:554-558","code":"  554 |     if (flags & GIF_COLOUR_TABLE_MASK) {\n  555 |         gif_data += 3 * colour_table_size;\n  556 |         if ((gif_bytes = (unsigned int)(gif_end - gif_data)) < 0)\n  557 |             return GIF_INSUFFICIENT_FRAME_DATA;\n  558 |     }","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L554-L558"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `gif_initialise_frame_extensions` (libnsgif.c line 632), the outer while-loop reads `gif_data[0]` before checking `gif_bytes`. If `gif_data == gif_end` (i.e. `gif_bytes == 0`), this is an out-of-bounds read. The same issue exists in `gif_skip_frame_extensions` at line 1058.","fix":"Add an explicit bounds guard at the top of each outer while-loop:\n```c\nwhile (gif_bytes > 0 && gif_data[0] == GIF_EXTENSION_INTRODUCER) {\n```","locations":[{"ref":"libobs/graphics/libnsgif/libnsgif.c:632","code":"  632 |     while (gif_data[0] == GIF_EXTENSION_INTRODUCER) {","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L632"},{"ref":"libobs/graphics/libnsgif/libnsgif.c:1058","code":" 1058 |     while (gif_data[0] == GIF_EXTENSION_INTRODUCER) {","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L1058"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `gif_initialise_frame_extensions` (libnsgif.c), and in `gif_skip_frame_extensions`, the loops at lines 709-715 and 1084-1090 dereference `gif_data[0]` to check for `GIF_BLOCK_TERMINATOR` before verifying that `gif_data` is still within bounds. If `gif_bytes` drops below zero inside the loop (signed subtraction on an `int`), the next iteration reads `gif_data[0]` past `gif_end`, causing an out-of-bounds read from untrusted GIF data.","fix":"Add a bounds check before reading `gif_data[0]` at the top of each inner while-loop:\n```c\nwhile (gif_bytes > 0 && gif_data[0] != GIF_BLOCK_TERMINATOR) {\n    block_size = gif_data[0] + 1;\n    if ((gif_bytes -= block_size) < 0)\n        return GIF_INSUFFICIENT_FRAME_DATA;\n    gif_data += block_size;\n}\nif (gif_bytes <= 0)\n    return GIF_INSUFFICIENT_FRAME_DATA;\n++gif_data;\n```","locations":[{"ref":"libobs/graphics/libnsgif/libnsgif.c:707-715","code":"  707 |         gif_bytes = (unsigned int)(gif_end - gif_data);\n  708 |         block_size = 0;\n  709 |         while (gif_data[0] != GIF_BLOCK_TERMINATOR) {\n  710 |             block_size = gif_data[0] + 1;\n  711 |             if ((gif_bytes -= block_size) < 0)\n  712 |                 return GIF_INSUFFICIENT_FRAME_DATA;\n  713 |             gif_data += block_size;\n  714 |         }\n  715 |         ++gif_data;","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L707-L715"},{"ref":"libobs/graphics/libnsgif/libnsgif.c:1082-1090","code":" 1082 |         gif_bytes = (unsigned int)(gif_end - gif_data);\n 1083 |         block_size = 0;\n 1084 |         while (gif_data[0] != GIF_BLOCK_TERMINATOR) {\n 1085 |             block_size = gif_data[0] + 1;\n 1086 |             if ((gif_bytes -= block_size) < 0)\n 1087 |                 return GIF_INSUFFICIENT_FRAME_DATA;\n 1088 |             gif_data += block_size;\n 1089 |         }\n 1090 |         ++gif_data;","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L1082-L1090"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`MAKE_SEMANTIC_VERSION` in `obs-config.h` shifts `major` left by 24 bits and\n`minor` left by 16 bits without casting to a wider type first. When the macro\narguments are `int` literals (which they are: 32, 2, 0), `32 << 24` overflows\na 32-bit signed integer (32 * 2^24 = 536870912, which fits, but for any major\nversion >= 128 the shift would set the sign bit, causing undefined behavior in\nC). While the current values are safe, the macro is a latent UB trap: any\nfuture major version >= 128 would trigger signed integer overflow.\n\nAdditionally, using `|` to pack the version creates a non-intuitive API surface.\nIf `patch` ever exceeds 0xFFFF or `minor` exceeds 0xFF, values will overlap.","fix":"Cast to `uint32_t` before shifting:\n\n```c\n#define MAKE_SEMANTIC_VERSION(major, minor, patch) (((uint32_t)(major) << 24) | ((uint32_t)(minor) << 16) | (uint32_t)(patch))\n```","locations":[{"ref":"libobs/obs-config.h:46","code":"   46 | #define MAKE_SEMANTIC_VERSION(major, minor, patch) ((major << 24) | (minor << 16) | patch)","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-config.h#L46"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`MediaControls::MoveSliderFoward` and `MediaControls::MoveSliderBackwards` both store the result of `obs_source_media_get_time(source)` — which returns `int64_t` — in a plain `int`. For media files longer than roughly 24.8 days (INT_MAX milliseconds) the assignment silently truncates the position, causing incorrect seek targets. `MoveSliderBackwards` can also produce a negative `ms` that is passed directly to `obs_source_media_set_time` without clamping.","fix":"Use `int64_t` throughout and clamp to `[0, duration]`:\n\n```cpp\nvoid MediaControls::MoveSliderFoward(int seconds)\n{\n    OBSSource source = OBSGetStrongRef(weakSource);\n    if (!source)\n        return;\n    int64_t duration = obs_source_media_get_duration(source);\n    int64_t ms = obs_source_media_get_time(source);\n    ms = std::clamp(ms + int64_t(seconds) * 1000, int64_t(0), duration);\n    obs_source_media_set_time(source, ms);\n    SetSliderPosition();\n}\n```\nApply the same pattern to `MoveSliderBackwards`.","locations":[{"ref":"frontend/components/MediaControls.cpp:467-472","code":"  467 | \tint ms = obs_source_media_get_time(source);\n  468 | \tms += seconds * 1000;\n  469 | \n  470 | \tobs_source_media_set_time(source, ms);\n  471 | \tSetSliderPosition();\n  472 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/MediaControls.cpp#L467-L472"},{"ref":"frontend/components/MediaControls.cpp:482-487","code":"  482 | \tint ms = obs_source_media_get_time(source);\n  483 | \tms -= seconds * 1000;\n  484 | \n  485 | \tobs_source_media_set_time(source, ms);\n  486 | \tSetSliderPosition();\n  487 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/MediaControls.cpp#L482-L487"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`Multiview::GetSourceByPosition` performs divisions like `(maxX - minX) / 6` (and `/3`, `/4`, `/5`) to compute which scene cell the mouse is in. If the multiview window is extremely narrow (e.g. `maxX - minX < 6`), the division result is 0 and the next division `(x - minX) / ((maxX - minX) / 6)` is a division by zero, which is undefined behaviour causing a crash. The same applies to all `(maxY - minY)` divisors in the many layout branches.","fix":"Guard each case's range computation before dividing. Example for `HORIZONTAL_TOP_18_SCENES`:\n\n```cpp\nint cols = 6, rows = 3;\nint cellW = (maxX - minX) / cols;\nint cellH = (maxY - minY) / rows;\nif (cellW == 0 || cellH == 0)\n    break;\npos = (x - minX) / cellW + ((y - minY) / cellH) * cols;\n```\nApply the same pattern to every layout branch.","locations":[{"ref":"frontend/components/Multiview.cpp:589-590","code":"  589 | \t\tpos = (x - minX) / ((maxX - minX) / 6);\n  590 | \t\tpos += ((y - minY) / ((maxY - minY) / 3)) * 6;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/Multiview.cpp#L589-L590"},{"ref":"frontend/components/Multiview.cpp:609-610","code":"  609 | \t\tpos = (x - minX) / ((maxX - minX) / 6);\n  610 | \t\tpos += ((y - minY) / ((maxY - minY) / 4)) * 6;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/Multiview.cpp#L609-L610"},{"ref":"frontend/components/Multiview.cpp:629","code":"  629 | \t\tpos = 2 * ((y - minY) / ((maxY - minY) / 4));","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/Multiview.cpp#L629"},{"ref":"frontend/components/Multiview.cpp:671","code":"  671 | \t\tpos = (x - minX) / ((maxX - minX) / 4);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/Multiview.cpp#L671"},{"ref":"frontend/components/Multiview.cpp:691-692","code":"  691 | \t\tpos = (x - minX) / ((maxX - minX) / 2);\n  692 | \t\tpos += ((y - minY) / ((maxY - minY) / 2)) * 2;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/Multiview.cpp#L691-L692"},{"ref":"frontend/components/Multiview.cpp:710-711","code":"  710 | \t\tpos = (x - minX) / ((maxX - minX) / 3);\n  711 | \t\tpos += ((y - minY) / ((maxY - minY) / 3)) * 3;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/Multiview.cpp#L710-L711"},{"ref":"frontend/components/Multiview.cpp:729-730","code":"  729 | \t\tpos = (x - minX) / ((maxX - minX) / 4);\n  730 | \t\tpos += ((y - minY) / ((maxY - minY) / 4)) * 4;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/Multiview.cpp#L729-L730"},{"ref":"frontend/components/Multiview.cpp:748-749","code":"  748 | \t\tpos = (x - minX) / ((maxX - minX) / 5);\n  749 | \t\tpos += ((y - minY) / ((maxY - minY) / 5)) * 5;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/Multiview.cpp#L748-L749"},{"ref":"frontend/components/Multiview.cpp:768-769","code":"  768 | \t\tpos = (x - minX) / ((maxX - minX) / 4);\n  769 | \t\tif (y > minY + ((maxY - minY) / 2)) {","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/Multiview.cpp#L768-L769"}]},{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `gif_next_LZW` (libnsgif.c lines 1176-1219), the inner loop that walks the code table uses two accesses per iteration: `gif->table[1][code]` and `gif->table[0][new_code]`. The index `code` is checked against `gif->clear_code` but not against the table bounds `(1 << GIF_MAX_LZW)` before the first `table[1][code]` access at line 1203. A corrupt GIF with a code value >= 4096 but < `max_code` could index out of the 4096-entry table.","fix":"Add an upper-bound check before dereferencing `table[1][code]`:\n```c\nwhile (code >= gif->clear_code) {\n    if (code >= (1 << GIF_MAX_LZW)) {\n        gif->current_error = GIF_FRAME_DATA_ERROR;\n        return false;\n    }\n    // ... existing stack/table accesses\n}\n```","locations":[{"ref":"libobs/graphics/libnsgif/libnsgif.c:1198-1219","code":" 1198 |     while (code >= gif->clear_code) {\n 1199 |         if (gif->stack_pointer >= gif->stack + ((1 << GIF_MAX_LZW) * 2)) {\n 1200 |             gif->current_error = GIF_FRAME_DATA_ERROR;\n 1201 |             return false;\n 1202 |         }\n 1203 |         *gif->stack_pointer++ = gif->table[1][code];\n 1204 |         new_code = gif->table[0][code];\n 1205 |         if (new_code < gif->clear_code) {\n 1206 |             code = new_code;\n 1207 |             break;\n 1208 |         }\n 1209 | \n 1210 |         if (gif->stack_pointer >= gif->stack + ((1 << GIF_MAX_LZW) * 2)) {\n 1211 |             gif->current_error = GIF_FRAME_DATA_ERROR;\n 1212 |             return false;\n 1213 |         }\n 1214 |         *gif->stack_pointer++ = gif->table[1][new_code];\n 1215 |         code = gif->table[0][new_code];\n 1216 |         if (code == new_code) {\n 1217 |               gif->current_error = GIF_FRAME_DATA_ERROR;\n 1218 |             return false;\n 1219 |         }","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L1198-L1219"}]},{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `obs_encoder_add_roi`, the validity check for the ROI rectangle uses unsigned subtraction:\n`roi->bottom - roi->top < 16` and `roi->right - roi->left < 16`. Both fields are `uint32_t`.\nIf `bottom < top` or `right < left` (inverted coordinates), the subtraction wraps around to a\nvery large unsigned value, which is never less than 16. The check therefore passes for\ngeometrically invalid ROIs (inverted rectangles), allowing malformed ROI data to be pushed to\nthe encoder and potentially misinterpreted by hardware encoder APIs.","fix":"Add explicit bounds checks before the size checks:\n```c\nif (roi->bottom <= roi->top || roi->right <= roi->left)\n\treturn false;\nif (roi->bottom - roi->top < 16 || roi->right - roi->left < 16)\n\treturn false;\n```","locations":[{"ref":"libobs/obs-encoder.c:2104-2107","code":" 2104 | \t/* Area smaller than the smallest possible block (16x16) */\n 2105 | \tif (roi->bottom - roi->top < 16 || roi->right - roi->left < 16)\n 2106 | \t\treturn false;\n 2107 | \t/* Other invalid ROIs */","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.c#L2104-L2107"}]},{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `ffmpeg_image_copy_data_straight` the output buffer size is computed as:\n\n    const size_t linesize  = (size_t)info->cx * 4;\n    const size_t totalsize = info->cy * linesize;\n\n`info->cy` is `int`. If `cx` and `cy` each are large (e.g. 32767 pixels), `linesize` can be\ncomputed correctly as `size_t`, but `info->cy * linesize` multiplies a signed `int` by `size_t`;\non platforms where `int` is 32 bits and `size_t` is 64 bits, implicit conversion to `size_t`\nhappens first, so there is no overflow. However the identical pattern appears in\n`ffmpeg_image_reformat_frame` for the RGBA/BGRA premultiply path (line 362-363) where\n`info->cy` is also `int` - same situation. These are safe today but fragile; casting `info->cy`\nto `size_t` explicitly makes the intent clear and guards against future narrowing.","fix":"Cast `info->cy` to `size_t` before multiplying: `const size_t totalsize = (size_t)info->cy * linesize;`","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:115-117","code":"  115 | \tconst size_t linesize = (size_t)info->cx * 4;\n  116 | \tconst size_t totalsize = info->cy * linesize;\n  117 | \tvoid *data = bmalloc(totalsize);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/graphics-ffmpeg.c#L115-L117"},{"ref":"libobs/graphics/graphics-ffmpeg.c:361-363","code":"  361 | \t\t\tconst size_t linesize = (size_t)info->cx * 4;\n  362 | \t\t\tconst size_t totalsize = info->cy * linesize;\n  363 | \t\t\tdata = bmalloc(totalsize);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/graphics-ffmpeg.c#L361-L363"}]},{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`lcm` in `obs-encoder.c` operates on `int` (32-bit signed). The LCM of two frame-rate\ndivisors can overflow a signed 32-bit integer and yield a negative or incorrect value. For\nexample `lcm(65536, 65537)` overflows INT_MAX. The result is stored as\n`frame_rate_divisors_lcm` and used in timing calculations (`int64_t overall_timestep =\nencoder->timebase_num * group->frame_rate_divisors_lcm`). An overflow here can cause\nencoders in a group to never synchronise their reconfigure boundary, stalling bitrate changes\nindefinitely or triggering incorrect integer arithmetic downstream.","fix":"Change `gcd` and `lcm` to use `int64_t` and store `frame_rate_divisors_lcm` as `int64_t`, or cap divisors at a safe maximum (e.g. 256). Simplest fix:\n```c\nstatic int64_t gcd64(int64_t a, int64_t b)\n{\n\twhile (b) { int64_t t = b; b = a % b; a = t; }\n\treturn a;\n}\nstatic int64_t lcm64(int64_t a, int64_t b)\n{\n\treturn (a / gcd64(a, b)) * b;\n}\n```","locations":[{"ref":"libobs/obs-encoder.c:364-367","code":"  364 | static int lcm(int a, int b)\n  365 | {\n  366 | \treturn (a / gcd(a, b)) * b;\n  367 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.c#L364-L367"},{"ref":"libobs/obs-encoder.c:399-400","code":"  399 | \t\tencoder->encoder_group->frame_rate_divisors_lcm =\n  400 | \t\t\tlcm(encoder->encoder_group->frame_rate_divisors_lcm, encoder->frame_rate_divisor);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.c#L399-L400"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `discover_schema_file` (check-jsonschema.py), the local variable `schema_file` (a path string)\nis reused as the loop variable of `with open(schema_file) as schema_file:`. After the `with`\nblock, `schema_file` refers to the closed file object, not the original path string. The function\nthen returns `str(schema_file)` which is the `repr` of the file object (something like\n`<_io.TextIOWrapper name='...' mode='r' ...>`), not the actual file path. This corrupts the schema\ndeduplication key in `main()` so the same schema file may be validated multiple times, and the\nreturned \"path\" string cannot be matched against future `os.path.join` results.","fix":"Use a different variable name for the file handle:\n\n```python\nschema_file_path = os.path.join(os.path.dirname(filename), schema_filename)\n\nwith open(schema_file_path) as schema_fh:\n    schema_data = json.load(schema_fh)\n\nreturn (schema_file_path, schema_data)\n```","locations":[{"ref":".github/scripts/utils.py/check-jsonschema.py:25-30","code":"   25 |     schema_file = os.path.join(os.path.dirname(filename), schema_filename)\n   26 | \n   27 |     with open(schema_file) as schema_file:\n   28 |         schema_data = json.load(schema_file)\n   29 | \n   30 |     return (str(schema_file), schema_data)","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/.github/scripts/utils.py/check-jsonschema.py#L25-L30"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `check-jsonschema.py` `main()`, when `discover_schema_file` returns `(None, None)` (no schema\ndefined in the JSON file), the code at line 102 unconditionally indexes\n`schema_mappings[schema_file]` where `schema_file` is `None`. The key `None` was never inserted\nbecause the guard on line 97 only adds the key `if schema_file`, so this raises `KeyError` and\ncrashes the script for any JSON file that has no `$schema` field.","fix":"Skip the mapping update and file registration when there is no schema:\n\n```python\nif schema_file is None:\n    continue\n\nif schema_file not in schema_mappings:\n    schema_mappings[schema_file] = {\"schema_data\": schema_data, \"files\": set()}\n\nschema_mappings[schema_file][\"files\"].add(json_file)\n```","locations":[{"ref":".github/scripts/utils.py/check-jsonschema.py:97-102","code":"   97 |         if schema_file and schema_file not in schema_mappings.keys():\n   98 |             schema_mappings.update(\n   99 |                 {schema_file: {\"schema_data\": schema_data, \"files\": set()}}\n  100 |             )\n  101 | \n  102 |         schema_mappings[schema_file][\"files\"].add(json_file)","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/.github/scripts/utils.py/check-jsonschema.py#L97-L102"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ResolveVariable` can loop infinitely when two theme alias variables reference each other in a\ncycle (e.g. A aliases B and B aliases A). The loop condition checks\n`vars[key].type == OBSThemeVariable::Alias` and then does `if (!vars.contains(key)) return false;`.\nBut when both A and B exist in `vars`, `contains` returns true and the loop never terminates,\nhanging OBS during theme loading.","fix":"Track visited keys and break on a cycle:\n\n```cpp\nstatic bool ResolveVariable(const QHash<QString, OBSThemeVariable> &vars, OBSThemeVariable &var)\n{\n    if (var.type != OBSThemeVariable::Alias)\n        return true;\n\n    QString key = var.value.toString();\n    QSet<QString> visited;\n    visited.insert(key);\n\n    while (vars[key].type == OBSThemeVariable::Alias) {\n        key = vars[key].value.toString();\n\n        if (!vars.contains(key)) {\n            blog(LOG_ERROR, R\"(Variable \"%s\" does not exist!)\", QT_TO_UTF8(key));\n            return false;\n        }\n        if (visited.contains(key)) {\n            blog(LOG_ERROR, R\"(Alias cycle detected at variable \"%s\"!)\", QT_TO_UTF8(key));\n            return false;\n        }\n        visited.insert(key);\n    }\n\n    var = vars[key];\n    return true;\n}\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:552-571","code":"  552 | static bool ResolveVariable(const QHash<QString, OBSThemeVariable> &vars, OBSThemeVariable &var)\n  553 | {\n  554 | \tif (var.type != OBSThemeVariable::Alias) {\n  555 | \t\treturn true;\n  556 | \t}\n  557 | \n  558 | \tQString key = var.value.toString();\n  559 | \twhile (vars[key].type == OBSThemeVariable::Alias) {\n  560 | \t\tkey = vars[key].value.toString();\n  561 | \n  562 | \t\tif (!vars.contains(key)) {\n  563 | \t\t\tblog(LOG_ERROR, R\"(Variable \"%s\" (ali
