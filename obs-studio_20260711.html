208 | \t\t\tif (range_max) {\n  209 | \t\t\t\tconst float *src_range_max = full_range ? full_max\n  210 | \t\t\t\t\t\t\t\t\t: bpp_info[bpc_index].float_range_max;\n  211 | \t\t\t\tmemcpy(range_max, src_range_max, sizeof(float) * 3);\n  212 | \t\t\t}\n  213 | \n  214 | \t\t\tbreak;\n  215 | \t\t}\n  216 | \t}\n  217 | \n  218 | \treturn success;","lines":50,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-matrices.c#L169-L218"}]},{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `obs-audio-controls.c::iec_db_to_def`, the segment for `db >= -114.0f` uses\nthe formula `(db + 150.0f) / 90.0f * 0.025f`. The corresponding forward\nfunction `iec_def_to_db` uses `(def - 0.025f) / 0.025f * 90.0f - 60.0f` for\n`def >= 0.001f`. The inverse should be `def = (db + 60.0f) / 90.0f * 0.025f +\n0.001f`. The constant 150.0 in the inverse (60 + 90 = 150) is mathematically\nequivalent only if the \"+0.001f\" offset is dropped. This means the inverse\nfunction at `db = -150.0f` gives `def = 0`, but at `db = -60.0f` (the segment\nboundary) `iec_db_to_def(-60.0f)` returns `(−60+150)/90*0.025 = 90/90*0.025 =\n0.025`, matching the boundary. At `db = -114.0f` (the lower boundary) it\nreturns `(−114+150)/90*0.025 = 36/90*0.025 = 0.01`, while the forward segment\nstarts at `def = 0.001f`. The asymmetry means round-tripping a value near the\nbottom of this segment (e.g. `def = 0.001f`) does not exactly recover the\noriginal value. This is a minor precision/accuracy issue rather than a crash.","fix":"Document the intentional approximation, or correct the inverse to `def = (db + 60.0f) / 90.0f * 0.025f + 0.001f` for perfect round-trip accuracy at segment boundaries.","locations":[{"ref":"libobs/obs-audio-controls.c:130-157","code":"  130 | static float iec_db_to_def(const float db)\n  131 | {\n  132 | \tif (db == 0.0f)\n  133 | \t\treturn 1.0f;\n  134 | \telse {\n 1379 | \tif (array) {\n 1380 | \t\tobs_data_release(array->objects.array[idx]);\n 1381 | \t\tda_erase(array->objects, idx);\n 1382 | \t}\n 1383 | }","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-data.c#L1377-L1383"}]},{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`make_frames_per_second` stores the `numerator` and `denominator` fields of\n`media_frames_per_second` (both `uint32_t`) using `obs_data_set_double`, making the JSON\nrepresentation use floating-point numbers. When these values are read back in\n`get_frames_per_second`, `obs_data_item_get_int` is called, which converts the stored double\nback to `long long` via a cast. While this is lossless for values that fit in a double\nmantissa (up to 2^53, far larger than UINT32_MAX), the mismatch produces confusing JSON\noutput such as `{\"numerator\": 60000.0, \"denominator\": 1001.0}` and creates a fragile\ntype-mismatch between the write and read paths. Callers that directly read the JSON and\nassume integer types would get doubles instead.","fix":"Use `obs_data_set_int` instead of `obs_data_set_double` when serialising the numerator and denominator, and change `obs_data_item_get_int` reads to match:\n```c\nobs_data_set_int(obj, \"numerator\", fps.numerator);\nobs_data_set_int(obj, \"denominator\", fps.denominator);\n```","locations":[{"ref":"libobs/obs-data.c:2041-2053","code":" 2041 | static inline obs_data_t *make_frames_per_second(struct media_frames_per_second fps, const char *option)\n 2042 | {\n 2043 | \tobs_data_t *obj = obs_data_create();\n 2044 | \n 2045 | \tif (!option) {\n 2046 | \t\tobs_data_set_double(obj, \"numerator\", fps.numerator);\n 2047 | \t\tobs_data_set_double(obj, \"denominator\", fps.denominator);\n 2048 | \n 2049 | \t} else {\n 2050 | \t\tobs_data_set_string(obj, \"option\", option);\n 2051 | \t}\n 2052 | \n 2053 | \treturn obj;","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-data.c#L2041-L2053"},{"ref":"libobs/obs-data.c:2112-2113","code":" 2112 | \tlong long num_ll = obs_data_item_get_int(num);\n 2113 | \tlong long den_ll = obs_data_item_get_int(den);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-data.c#L2112-L2113"}]},{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `obs_hotkeys_set_translations_s` function processes entries from `struct obs_hotkeys_translations` but never applies translations for `OBS_KEY_LEFT`, `OBS_KEY_RIGHT`, `OBS_KEY_UP`, and `OBS_KEY_DOWN`, even though the struct has `left`, `right`, `up`, and `down` fields (obs-hotkey.h lines 96-99). Callers that populate those fields will have their translations silently ignored.","fix":"Add the four missing `ADD_TRANSLATION` calls after the existing block:\n```c\nADD_TRANSLATION(OBS_KEY_LEFT,  left);\nADD_TRANSLATION(OBS_KEY_RIGHT, right);\nADD_TRANSLATION(OBS_KEY_UP,    up);\nADD_TRANSLATION(OBS_KEY_DOWN,  down);\n```","locations":[{"ref":"libobs/obs-hotkey.c:1246-1265","code":" 1246 | \tADD_TRANSLATION(OBS_KEY_INSERT, insert);\n 1247 | \tADD_TRANSLATION(OBS_KEY_DELETE, del);\n 1248 | \tADD_TRANSLATION(OBS_KEY_HOME, home);\n 1249 | \tADD_TRANSLATION(OBS_KEY_END, end);\n 1250 | \tADD_TRANSLATION(OBS_KEY_PAGEUP, page_up);\n 1251 | \tADD_TRANSLATION(OBS_KEY_PAGEDOWN, page_down);\n 1252 | \tADD_TRANSLATION(OBS_KEY_NUMLOCK, num_lock);\n 1253 | \tADD_TRANSLATION(OBS_KEY_SCROLLLOCK, scroll_lock);\n 1254 | \tADD_TRANSLATION(OBS_KEY_CAPSLOCK, caps_lock);\n 1255 | \tADD_TRANSLATION(OBS_KEY_BACKSPACE, backspace);\n 1256 | \tADD_TRANSLATION(OBS_KEY_TAB, tab);\n 1257 | \tADD_TRANSLATION(OBS_KEY_PRINT, print);\n 1258 | \tADD_TRANSLATION(OBS_KEY_PAUSE, pause);\n 1259 | \tADD_TRANSLATION(OBS_KEY_SHIFT, shift);\n 1260 | \tADD_TRANSLATION(OBS_KEY_ALT, alt);\n 1261 | \tADD_TRANSLATION(OBS_KEY_CONTROL, control);\n 1262 | \tADD_TRANSLATION(OBS_KEY_META, meta);\n 1263 | \tADD_TRANSLATION(OBS_KEY_MENU, menu);\n 1264 | \tADD_TRANSLATION(OBS_KEY_SPACE, space);\n 1265 | \tADD_TRANSLATION(OBS_KEY_ESCAPE, escape);","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-hotkey.c#L1246-L1265"},{"ref":"libobs/obs-hotkey.h:96-99","code":"   96 | \tconst char *print;\n   97 | \tconst char *pause;\n   98 | \tconst char *left;\n   99 | \tconst char *right;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-hotkey.h#L96-L99"}]},{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`obs_missing_files_get_file` takes `int idx` but internally indexes a `DARRAY` whose count is `size_t`. A negative `idx` value would be implicitly converted to a very large `size_t` when used as the array index `files->files.array[idx]`, causing an out-of-bounds read. The public header (`obs-missing-files.h:41`) also declares the parameter as `int`, misleading callers who may pass loop variables of type `int` without bounds checking.","fix":"Change the parameter type to `size_t` in both the declaration and the definition:\n```c\n/* header */\nEXPORT obs_missing_file_t *obs_missing_files_get_file(obs_missing_files_t *files, size_t idx);\n\n/* implementation */\nobs_missing_file_t *obs_missing_files_get_file(obs_missing_files_t *files, size_t idx)\n{\n    return files->files.array[idx];\n}\n```","locations":[{"ref":"libobs/obs-missing-files.c:64-67","code":"   64 | obs_missing_file_t *obs_missing_files_get_file(obs_missing_files_t *files, int idx)\n   65 | {\n   66 | \treturn files->files.array[idx];\n   67 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-missing-files.c#L64-L67"},{"ref":"libobs/obs-missing-files.h:41","code":"   41 | EXPORT obs_missing_file_t *obs_missing_files_get_file(obs_missing_files_t *files, int idx);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-missing-files.h#L41"}]},{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`load_keymap_data` writes to `plat->obs_to_key[obs_key]` even when `obs_key` is\n`OBS_KEY_NONE` (the sentinel value returned by `obs_nix_wayland_key_from_virtual_key` for\nunmapped keysyms). The first unmapped keycode claims slot 0 (`OBS_KEY_NONE`) and prevents\nany subsequent unmapped keycodes from overwriting it (due to the `if (!plat->obs_to_key[obs_key])`\nguard). This means `obs_to_key[OBS_KEY_NONE]` ends up pointing at an arbitrary keycode,\nwhich could produce a spurious label string for `OBS_KEY_NONE` in `obs_nix_wayland_key_to_str`\nbefore the final fallback check on line 374 catches it.","fix":"Skip storing the result when the keysym maps to `OBS_KEY_NONE`:\n\n```c\nobs_key_t obs_key = obs_nix_wayland_key_from_virtual_key(syms[0]);\nif (obs_key != OBS_KEY_NONE && !plat->obs_to_key[obs_key])\n    plat->obs_to_key[obs_key] = key;\nplat->key_to_sym[level][key] = syms[0];\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:60-65","code":"   60 | \t\tobs_key_t obs_key = obs_nix_wayland_key_from_virtual_key(syms[0]);\n   61 | \t\t// This avoids ambiguity where multiple scancodes produce the same symbols.\n   62 | \t\t// e.g. LSGT and Shift+AB08 produce `<` on default US layout.\n   63 | \t\tif (!plat->obs_to_key[obs_key])\n   64 | \t\t\tplat->obs_to_key[obs_key] = key;\n   65 | \t\tplat->key_to_sym[level][key] = syms[0];","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L60-L65"}]},{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`obs_missing_files_destroy` does not check its `files` argument for NULL before dereferencing it. Every other function in the same file that receives an `obs_missing_files_t *` (e.g. `obs_missing_files_count`, `obs_missing_files_add_file`) also lacks a null guard, but `obs_missing_files_destroy` is the most dangerous because it is the cleanup path.","fix":"Add a null guard at the top of the function:\n```c\nvoid obs_missing_files_destroy(obs_missing_files_t *files)\n{\n    if (!files)\n        return;\n    ...\n}\n```","locations":[{"ref":"libobs/obs-missing-files.c:44-52","code":"   44 | void obs_missing_files_destroy(obs_missing_files_t *files)\n   45 | {\n   46 | \tfor (size_t i = 0; i < files->files.num; i++) {\n   47 | \t\tobs_missing_file_release(files->files.array[i]);\n   48 | \t}\n   49 | \n   50 | \tda_free(files->files);\n   51 | \tbfree(files);\n   52 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-missing-files.c#L44-L52"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `obs_module_load_locale`, the path for the default locale is built with `\"locale/\"` (no leading slash, line 861), but the path for the non-default locale is built with `\"/locale/\"` (leading slash, line 879). Since `obs_find_module_file` concatenates `module->data_path` with the given relative path, the leading slash causes the non-default locale path to be wrong, and the file will never be found, silently falling back to the default locale on every launch with a non-default language.","fix":"Remove the leading slash:\n```c\n/* before */\ndstr_copy(&str, \"/locale/\");\n\n/* after */\ndstr_copy(&str, \"locale/\");\n```","locations":[{"ref":"libobs/obs-module.c:861-881","code":"  861 | \tdstr_copy(&str, \"locale/\");\n  862 | \tdstr_cat(&str, default_locale);\n  863 | \tdstr_cat(&str, \".ini\");\n  864 | \n  865 | \tchar *file = obs_find_module_file(module, str.array);\n  866 | \tif (file)\n  867 | \t\tlookup = text_lookup_create(file);\n  868 | \n  869 | \tbfree(file);\n  870 | \n  871 | \tif (!lookup) {\n  872 | \t\tblog(LOG_WARNING, \"Failed to load '%s' text for module: '%s'\", default_locale, module->file);\n  873 | \t\tgoto cleanup;\n  874 | \t}\n  875 | \n  876 | \tif (astrcmpi(locale, default_locale) == 0)\n  877 | \t\tgoto cleanup;\n  878 | \n  879 | \tdstr_copy(&str, \"/locale/\");\n  880 | \tdstr_cat(&str, locale);\n  881 | \tdstr_cat(&str, \".ini\");","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-module.c#L861-L881"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`MediaControls::MoveSliderFoward` contains a typo — \"Foward\" instead of \"Forward\" — that propagates through the method name, a slot declaration in the header, and connections set up in the constructor. The corresponding keyboard shortcut action is also named `sliderFoward`. This misspelling is enshrined as a public slot and is present in four places, making it an API inconsistency for any external caller.","fix":"Rename `MoveSliderFoward` to `MoveSliderForward` and `sliderFoward` to `sliderForward` in both the header and the .cpp file. Update the `connect()` call in the constructor accordingly.","locations":[{"ref":"frontend/components/MediaControls.cpp:459","code":"  459 | void MediaControls::MoveSliderFoward(int seconds)","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/MediaControls.cpp#L459"},{"ref":"frontend/components/MediaControls.hpp:62","code":"   62 | \tvoid MoveSliderFoward(int seconds = 5);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/MediaControls.hpp#L62"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`obs_set_array` passes `sizeof(obs_data_t *)` as the size argument when storing an\n`obs_data_array_t *` value. On all supported platforms `sizeof(obs_data_t *)` equals\n`sizeof(obs_data_array_t *)` (both are generic pointer sizes), so no data is lost.\nHowever the type mismatch is confusing and could become a latent bug on a hypothetical\nplatform with differentiated pointer sizes.","fix":"Change `sizeof(obs_data_t *)` to `sizeof(obs_data_array_t *)`:\n```c\nset_item_(data, item, name, &array, sizeof(obs_data_array_t *), OBS_DATA_ARRAY);\n```","locations":[{"ref":"libobs/obs-data.c:1102-1106","code":" 1102 | static inline void obs_set_array(obs_data_t *data, obs_data_item_t **item, const char *name, obs_data_array_t *array,\n 1103 | \t\t\t\t set_item_t set_item_)\n 1104 | {\n 1105 | \tset_item_(data, item, name, &array, sizeof(obs_data_t *), OBS_DATA_ARRAY);\n 1106 | }","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-data.c#L1102-L1106"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"`ApplicationAudioCaptureToolbar::Init()` calls `obs_module_get_locale_text(mod, \"Window\")` without first checking whether `mod` is `nullptr`. `obs_module_get_locale_text` immediately dereferences `mod->get_string`, which is a null-pointer dereference crash when the `win-wasapi` module is absent. By contrast, the sibling `AudioCaptureToolbar::Init()` and `DisplayCaptureToolbar::Init()` both include a `if (!mod) return;` guard.","fix":"Add the same null check used by the sibling classes:\n\n```cpp\nobs_module_t *mod = obs_get_module(\"win-wasapi\");\nif (!mod) {\n    return;\n}\nconst char *device_str = obs_module_get_locale_text(mod, \"Window\");\n```","locations":[{"ref":"frontend/components/ApplicationAudioCaptureToolbar.cpp:15-19","code":"   15 | \tobs_module_t *mod = obs_get_module(\"win-wasapi\");\n   16 | \tconst char *device_str = obs_module_get_locale_text(mod, \"Window\");\n   17 | \tui->deviceLabel->setText(device_str);\n   18 | \n   19 | \tprop_name = \"window\";","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/ApplicationAudioCaptureToolbar.cpp#L15-L19"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"`ImageSourceToolbar` constructor calls `obs_module_get_locale_text(mod, \"File\")` immediately after `obs_get_module(\"image-source\")` without checking for a `nullptr` return. If the `image-source` plugin is not loaded, `mod` is `nullptr` and `obs_module_get_locale_text` crashes with a null-pointer dereference.","fix":"```cpp\nobs_module_t *mod = obs_get_module(\"image-source\");\nif (mod) {\n    ui->pathLabel->setText(obs_module_get_locale_text(mod, \"File\"));\n}\n```","locations":[{"ref":"frontend/components/ImageSourceToolbar.cpp:14-15","code":"   14 | \tobs_module_t *mod = obs_get_module(\"image-source\");\n   15 | \tui->pathLabel->setText(obs_module_get_locale_text(mod, \"File\"));","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/ImageSourceToolbar.cpp#L14-L15"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `OBSApp::OBSApp` (non-Windows path), the `socketpair` call on line 935 does not check the\nreturn value. If `socketpair` fails (e.g. the file descriptor limit is reached), both descriptors\nin `fileDescriptor` remain 0, so the subsequent `QSocketNotifier` is created with file descriptor\n1 (stdout), and the POSIX signal handler will write to stdout instead of the socket, corrupting\nprocess output and misdirecting signal handling.","fix":"Check the return value and handle failure:\n\n```cpp\nif (socketpair(AF_UNIX, SOCK_STREAM, 0, fileDescriptor.data()) != 0) {\n    blog(LOG_ERROR, \"Failed to create socket pair for signal handling: %s\", strerror(errno));\n    return; // or throw\n}\nnotifier = new QSocketNotifier(fileDescriptor[1], QSocketNotifier::Read, this);\nconnect(notifier, &QSocketNotifier::activated, this, callback);\n```","locations":[{"ref":"frontend/OBSApp.cpp:933-937","code":"  933 | \tauto connectSignal = [this](std::array<int, 2> &fileDescriptor, QPointer<QSocketNotifier> &notifier,\n  934 | \t\t\t\t    SignalCallback callback) -> void {\n  935 | \t\tsocketpair(AF_UNIX, SOCK_STREAM, 0, fileDescriptor.data());\n  936 | \t\tnotifier = new QSocketNotifier(fileDescriptor[1], QSocketNotifier::Read, this);\n  937 | \t\tconnect(notifier, &QSocketNotifier::activated, this, callback);","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp.cpp#L933-L937"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`find_cached_effect` traverses the `first_effect` linked list without holding `effect_mutex`.\nWrites to the list are protected by the mutex in `gs_effect_create` (lines 884-892), but the read\nin `gs_effect_create_from_file` (line 846) is not. If one thread is loading an effect from file\nwhile another thread concurrently calls `gs_effect_create` to add a new effect to the list,\nthe reader can observe a partially updated `next` pointer, leading to a use-after-free or\ninfinite loop.","fix":"Wrap `find_cached_effect` with the effect mutex in `gs_effect_create_from_file`:\n\n```c\npthread_mutex_lock(&thread_graphics->effect_mutex);\neffect = find_cached_effect(file);\npthread_mutex_unlock(&thread_graphics->effect_mutex);\nif (effect)\n    return effect;\n```","locations":[{"ref":"libobs/graphics/graphics.c:825-848","code":"  825 | static inline struct gs_effect *find_cached_effect(const char *filename)\n  826 | {\n  827 | \tstruct gs_effect *effect = thread_graphics->first_effect;\n  828 | \n  829 | \twhile (effect) {\n  830 | \t\tif (strcmp(effect->effect_path, filename) == 0)\n  831 | \t\t\tbreak;\n  832 | \t\teffect = effect->next;\n  833 | \t}\n  834 | \n  835 | \treturn effect;\n  836 | }\n  837 | \n  838 | gs_effect_t *gs_effect_create_from_file(const char *file, char **error_string)\n  839 | {\n  840 | \tchar *file_string;\n  841 | \tgs_effect_t *effect = NULL;\n  842 | \n  843 | \tif (!gs_valid_p(\"gs_effect_create_from_file\", file))\n  844 | \t\treturn NULL;\n  845 | \n  846 | \teffect = find_cached_effect(file);\n  847 | \tif (effect)\n  848 | \t\treturn effect;","lines":24,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/graphics.c#L825-L848"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`gs_image_file_tick` and `gs_image_file2_tick` pass the integer literal `false` (0) as the\n`alpha_mode` argument to `gs_image_file_tick_internal`, which expects `enum gs_image_alpha_mode`.\nValue `0` coincidentally equals `GS_IMAGE_ALPHA_STRAIGHT`, so behaviour is accidentally correct,\nbut the intent is opaque and the enum type is silently truncated. `gs_image_file3_tick` and\n`gs_image_file4_tick` correctly pass the stored `alpha_mode` field.","fix":"Replace `false` with `GS_IMAGE_ALPHA_STRAIGHT` in both calls to `gs_image_file_tick_internal`.","locations":[{"ref":"libobs/graphics/image-file.c:371-372","code":"  371 | {\n  372 | \treturn gs_image_file_tick_internal(image, elapsed_time_ns, false);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/image-file.c#L371-L372"},{"ref":"libobs/graphics/image-file.c:375-377","code":"  375 | bool gs_image_file2_tick(gs_image_file2_t *if2, uint64_t elapsed_time_ns)\n  376 | {\n  377 | \treturn gs_image_file_tick_internal(&if2->image, elapsed_time_ns, false);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/image-file.c#L375-L377"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `obs_module_load_locale`, when `obs_find_module_file` returns NULL (the locale file does not exist), `text_lookup_add(lookup, NULL)` is called at line 885. `text_lookup_add` returns false on NULL input, which then unconditionally logs a warning at line 886. This produces a spurious warning every time a module does not ship a translation for the requested locale, which is the normal case when a translation is simply not yet available.","fix":"Guard the call to skip both the lookup attempt and the warning when no file was found:\n```c\nfile = obs_find_module_file(module, str.array);\n\nif (file && !text_lookup_add(lookup, file))\n    blog(LOG_WARNING, \"Failed to load '%s' text for module: '%s'\",\n         locale, module->file);\n\nbfree(file);\n```","locations":[{"ref":"libobs/obs-module.c:883-886","code":"  883 | \tfile = obs_find_module_file(module, str.array);\n  884 | \n  885 | \tif (!text_lookup_add(lookup, file))\n  886 | \t\tblog(LOG_WARNING, \"Failed to load '%s' text for module: '%s'\", locale, module->file);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-module.c#L883-L886"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`obs_nix_wayland_hotkeys_platform_init` does not check the return value of\n`xkb_context_new`, which can return NULL on failure (e.g. OOM). A NULL context is then\nstored in `plat->xkb_context` and passed unchecked to `xkb_keymap_new_from_string` later\n(in the `keymap` callback), which would crash. Additionally, `wl_display_get_registry` can\nreturn NULL if the display is disconnected, and that NULL is immediately passed to\n`wl_registry_add_listener` without checking.","fix":"Add NULL checks after each fallible allocation:\n\n```c\nhotkeys->platform_context->xkb_context =\n    xkb_context_new(XKB_CONTEXT_NO_FLAGS);\nif (!hotkeys->platform_context->xkb_context) {\n    blog(LOG_ERROR, \"[wayland] failed to create xkb context\");\n    bfree(hotkeys->platform_context);\n    hotkeys->platform_context = NULL;\n    return false;\n}\n\nstruct wl_registry *registry = wl_display_get_registry(display);\nif (!registry) {\n    blog(LOG_ERROR, \"[wayland] failed to get Wayland registry\");\n    // cleanup ...\n    return false;\n}\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:239-250","code":"  239 | static bool obs_nix_wayland_hotkeys_platform_init(struct obs_core_hotkeys *hotkeys)\n  240 | {\n  241 | \tstruct wl_display *display = obs_get_nix_platform_display();\n  242 | \thotkeys->platform_context = bzalloc(sizeof(obs_hotkeys_platform_t));\n  243 | \thotkeys->platform_context->display = display;\n  244 | \thotkeys->platform_context->xkb_context = xkb_context_new(XKB_CONTEXT_NO_FLAGS);\n  245 | \n  246 | \tstruct wl_registry *registry = wl_display_get_registry(display);\n  247 | \twl_registry_add_listener(registry, &registry_listener, hotkeys->platform_context);\n  248 | \twl_display_roundtrip(display);\n  249 | \treturn true;\n  250 | }","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L239-L250"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"`SourceSelectButton::obsSourceRenamed` retrieves the new source name via `calldata_ptr(params, \"new_name\")` (line 154), casting the result to `const char *`. The OBS `rename` signal declares `new_name` as a `string` field, not a `ptr` field. `calldata_ptr` returns `nullptr` for string fields, so `newNamePtr` is always `nullptr` and the rename is silently dropped — source buttons never update their label.","fix":"Replace `calldata_ptr` with `calldata_string`:\n\n```cpp\nconst char *newNamePtr = calldata_string(params, \"new_name\");\n```","locations":[{"ref":"frontend/components/SourceSelectButton.cpp:154-161","code":"  154 | \tconst char *newNamePtr = static_cast<const char *>(calldata_ptr(params, \"new_name\"));\n  155 | \tif (!newNamePtr) {\n  156 | \t\treturn;\n  157 | \t}\n  158 | \n  159 | \tQMetaObject::invokeMethod(static_cast<SourceSelectButton *>(data), \"handleSourceRenamed\", Qt::QueuedConnection,\n  160 | \t\t\t\t  Q_ARG(QString, QString::fromUtf8(newNamePtr)));\n  161 | }","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SourceSelectButton.cpp#L154-L161"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"On macOS, `UIValidation::StreamSettingsConfirmation` maps the Cancel button role to\n`QMessageBox::ResetRole` (line 95) instead of `QMessageBox::RejectRole`. On macOS, Qt follows\nthe Human Interface Guidelines for button placement by role. `ResetRole` is reserved for\ndestructive \"Reset\" actions and is placed on the left side of the dialog, far from where a\nuser expects a Cancel button. `RejectRole` (which maps to standard Cancel placement) should be\nused instead. The current code causes the Cancel button to appear in the wrong position,\nharming macOS usability and violating platform conventions.","fix":"Change `REJECT_BUTTON` to `QMessageBox::RejectRole` on macOS:\n```cpp\n#ifdef __APPLE__\n#define ACCEPT_BUTTON QMessageBox::AcceptRole\n#define REJECT_BUTTON QMessageBox::RejectRole\n#else\n#define ACCEPT_BUTTON QMessageBox::NoRole\n#define REJECT_BUTTON QMessageBox::NoRole\n#endif\n```","locations":[{"ref":"frontend/components/UIValidation.cpp:93-101","code":"   93 | #ifdef __APPLE__\n   94 | #define ACCEPT_BUTTON QMessageBox::AcceptRole\n   95 | #define REJECT_BUTTON QMessageBox::ResetRole\n   96 | #else\n   97 | #define ACCEPT_BUTTON QMessageBox::NoRole\n   98 | #define REJECT_BUTTON QMessageBox::NoRole\n   99 | #endif\n  100 | \tsettings = messageBox.addButton(QTStr(\"Basic.Settings.Stream.StreamSettingsWarning\"), ACCEPT_BUTTON);\n  101 | \tcancel = messageBox.addButton(QTStr(\"Cancel\"), REJECT_BUTTON);","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/UIValidation.cpp#L93-L101"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`obs_missing_file_destroy` is exported as a public API but bypasses the reference count maintained by `obs_missing_file_release`. Since `obs_missing_files_append` increments `file->ref` so the same file can be shared across multiple `obs_missing_files_t` containers, a caller that calls `obs_missing_file_destroy` directly on a file with `ref > 1` will free memory that is still referenced by other containers, leading to use-after-free when those containers later release or access the file.","fix":"Either remove `obs_missing_file_destroy` from the public API and document that `obs_missing_file_release` must be the only way to free a file, or make `obs_missing_file_destroy` delegate to `obs_missing_file_release`:\n```c\n/* Remove EXPORT from obs_missing_file_destroy so it becomes internal only,\n * and update the header to not expose it. Callers should use\n * obs_missing_file_release instead. */\n```","locations":[{"ref":"libobs/obs-missing-files.c:101-121","code":"  101 | void obs_missing_file_release(obs_missing_file_t *file)\n  102 | {\n  103 | \tif (!file)\n  104 | \t\treturn;\n  105 | \n  106 | \tif (os_atomic_dec_long(&file->ref) == 0)\n  107 | \t\tobs_missing_file_destroy(file);\n  108 | }\n  109 | \n  110 | void obs_missing_file_destroy(obs_missing_file_t *file)\n  111 | {\n  112 | \tswitch (file->src_type) {\n  113 | \tcase OBS_MISSING_FILE_SOURCE:\n  114 | \t\tbfree(file->src_name);\n  115 | \t\tbreak;\n  116 | \tcase OBS_MISSING_FILE_SCRIPT:\n  117 | \t\tbreak;\n  118 | \t}\n  119 | \tbfree(file->file_path);\n  120 | \tbfree(file);\n  121 | }","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-missing-files.c#L101-L121"},{"ref":"libobs/obs-missing-files.h:49","code":"   49 | EXPORT void obs_missing_file_destroy(obs_missing_file_t *file);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-missing-files.h#L49"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`platform_keyboard_keymap` ignores the `format` parameter entirely\n(`UNUSED_PARAMETER(format)`). The Wayland `wl_keyboard.keymap` event can carry\n`WL_KEYBOARD_KEYMAP_FORMAT_NO_KEYMAP` (value 0) to indicate that no keymap is associated\nwith the seat and the fd should not be read. When a compositor sends format 0, the spec\nsays the fd is -1. `mmap(NULL, size, PROT_READ, MAP_PRIVATE, -1, 0)` will fail with EBADF\nand the function returns early, accidentally surviving. However, relying on mmap failure\nrather than checking the format is fragile: a future compositor could send a valid fd with\nformat 0 (non-XKB keymap), in which case the code would try to parse a binary blob as\nXKB text and potentially crash or corrupt state.","fix":"Explicitly reject non-XKB formats before processing:\n\n```c\nstatic void platform_keyboard_keymap(void *data, struct wl_keyboard *keyboard,\n                                     uint32_t format, int32_t fd, uint32_t size)\n{\n    UNUSED_PARAMETER(keyboard);\n    if (format != WL_KEYBOARD_KEYMAP_FORMAT_XKB_V1) {\n        close(fd);\n        return;\n    }\n    // ... rest of the function unchanged\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:76-101","code":"   76 | static void platform_keyboard_keymap(void *data, struct wl_keyboard *keyboard, uint32_t format, int32_t fd,\n   77 | \t\t\t\t     uint32_t size)\n   78 | {\n   79 | \tUNUSED_PARAMETER(keyboard);\n   80 | \tUNUSED_PARAMETER(format);\n   81 | \tobs_hotkeys_platform_t *plat = (obs_hotkeys_platform_t *)data;\n   82 | \n   83 | \tchar *keymap_shm = mmap(NULL, size, PROT_READ, MAP_PRIVATE, fd, 0);\n   84 | \tif (keymap_shm == MAP_FAILED) {\n   85 | \t\tclose(fd);\n   86 | \t\treturn;\n   87 | \t}\n   88 | \n   89 | \tstruct xkb_keymap *xkb_keymap = xkb_keymap_new_from_string(\n   90 | \t\tplat->xkb_context, keymap_shm, XKB_KEYMAP_FORMAT_TEXT_V1, XKB_KEYMAP_COMPILE_NO_FLAGS);\n   91 | \tmunmap(keymap_shm, size);\n   92 | \tclose(fd);\n   93 | \n   94 | \t// cleanup old keymap and state\n   95 | \txkb_keymap_unref(plat->xkb_keymap);\n   96 | \txkb_state_unref(plat->xkb_state);\n   97 | \n   98 | \tplat->xkb_keymap = xkb_keymap;\n   99 | \tplat->xkb_state = xkb_state_new(xkb_keymap);\n  100 | \trebuild_keymap_data(plat);\n  101 | }","lines":26,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L76-L101"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"In `AbsoluteSlider::mousePressEvent` and `AbsoluteSlider::mouseMoveEvent`, `posToRangeValue` is\ncalled twice with the same event - once for `setValue` and once for the `emit sliderMoved` call.\n`posToRangeValue` calls `style()->subControlRect(...)` twice internally, making this four style\nqueries per event when two would suffice.","fix":"Cache the result:\n\n```cpp\nvoid AbsoluteSlider::mousePressEvent(QMouseEvent *event)\n{\n    dragging = (event->buttons() & Qt::LeftButton || event->buttons() & Qt::MiddleButton);\n    if (dragging) {\n        int val = posToRangeValue(event);\n        setSliderDown(true);\n        setValue(val);\n        emit AbsoluteSlider::sliderMoved(val);\n    }\n    event->accept();\n}\n```\nApply the same pattern in `mouseMoveEvent`.","locations":[{"ref":"frontend/components/AbsoluteSlider.cpp:23-34","code":"   23 | void AbsoluteSlider::mousePressEvent(QMouseEvent *event)\n   24 | {\n   25 | \tdragging = (event->buttons() & Qt::LeftButton || event->buttons() & Qt::MiddleButton);\n   26 | \n   27 | \tif (dragging) {\n   28 | \t\tsetSliderDown(true);\n   29 | \t\tsetValue(posToRangeValue(event));\n   30 | \t\temit AbsoluteSlider::sliderMoved(posToRangeValue(event));\n   31 | \t}\n   32 | \n   33 | \tevent->accept();\n   34 | }","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/AbsoluteSlider.cpp#L23-L34"},{"ref":"frontend/components/AbsoluteSlider.cpp:43-61","code":"   43 | void AbsoluteSlider::mouseMoveEvent(QMouseEvent *event)\n   44 | {\n   45 | \tint val = posToRangeValue(event);\n   46 | \n   47 | \tif (val > maximum()) {\n   48 | \t\tval = maximum();\n   49 | \t} else if (val < minimum()) {\n   50 | \t\tval = minimum();\n   51 | \t}\n   52 | \n   53 | \temit absoluteSliderHovered(val);\n   54 | \n   55 | \tif (dragging) {\n   56 | \t\tsetValue(posToRangeValue(event));\n   57 | \t\temit AbsoluteSlider::sliderMoved(posToRangeValue(event));\n   58 | \t}\n   59 | \n   60 | \tQSlider::mouseMoveEvent(event);\n   61 | \tevent->accept();","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/AbsoluteSlider.cpp#L43-L61"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`FlowFrame::keyPressEvent` calls `layout->itemAt(i)` up to three times per loop iteration: once to check for a widget, once to get the widget, and inside the condition again. Each call involves a bounds-checked list index. The result should be cached in a local variable.","fix":"Cache the `QLayoutItem*`:\n\n```cpp\nQLayoutItem *layoutItem = layout->itemAt(i);\nQWidget *widget = layoutItem ? layoutItem->widget() : nullptr;\nif (!widget)\n    continue;\n```","locations":[{"ref":"frontend/components/FlowFrame.cpp:37-50","code":"   37 | \tfor (int i = 0; i < layout->count(); ++i) {\n   38 | \t\tif (!layout->itemAt(i)->widget()) {\n   39 | \t\t\tcontinue;\n   40 | \t\t}\n   41 | \n   42 | \t\tauto focusProxy = layout->itemAt(i)->widget()->focusProxy();\n   43 | \t\tif (layout->itemAt(i)->widget() == focused || focusProxy == focused) {\n   44 | \t\t\tif (focusProxy == focused) {\n   45 | \t\t\t\tfocused = layout->itemAt(i)->widget();\n   46 | \t\t\t}\n   47 | \n   48 | \t\t\tindex = i;\n   49 | \t\t\tbreak;\n   50 | \t\t}","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/FlowFrame.cpp#L37-L50"},{"ref":"frontend/components/FlowFrame.cpp:67-113","code":"   67 | \t\tfor (int i = 0; i < layout->count(); ++i) {\n   68 | \t\t\tif (i == index) {\n   69 | \t\t\t\tcontinue;\n   70 | \t\t\t}\n   71 | \n   72 | \t\t\tQWidget *widget = layout->itemAt(i)->widget();\n   73 | \t\t\tconst QRect rect = widget->geometry();\n   74 | \n   75 | \t\t\tbool isCandidate = false;\n   76 | \t\t\tint distance = INT_MAX;\n   77 | \n   78 | \t\t\tswitch (event->key()) {\n   79 | \t\t\tcase Qt::Key_Right:\n   80 | \t\t\t\tif (rect.left() > focusedRect.right()) {\n   81 | \t\t\t\t\tdistance = (rect.left() - focusedRect.right()) +\n   82 | \t\t\t\t\t\t   qAbs(rect.center().y() - focusedRect.center().y());\n   83 | \t\t\t\t\tisCandidate = true;\n   84 | \t\t\t\t}\n   85 | \t\t\t\tbreak;\n   86 | \t\t\tcase Qt::Key_Left:\n   87 | \t\t\t\tif (rect.right() < focusedRect.left()) {\n   88 | \t\t\t\t\tdistance = (focusedRect.left() - rect.right()) +\n   89 | \t\t\t\t\t\t   qAbs(rect.center().y() - focusedRect.center().y());\n   90 | \t\t\t\t\tisCandidate = true;\n   91 | \t\t\t\t}\n   92 | \t\t\t\tbreak;\n   93 | \t\t\tcase Qt::Key_Down:\n   94 | \t\t\t\tif (rect.top() > focusedRect.bottom()) {\n   95 | \t\t\t\t\tdistance = (rect.top() - focusedRect.bottom()) +\n   96 | \t\t\t\t\t\t   qAbs(rect.center().x() - focusedRect.center().x());\n   97 | \t\t\t\t\tisCandidate = true;\n   98 | \t\t\t\t}\n   99 | \t\t\t\tbreak;\n  100 | \t\t\tcase Qt::Key_Up:\n  101 | \t\t\t\tif (rect.bottom() < focusedRect.top()) {\n  102 | \t\t\t\t\tdistance = (focusedRect.top() - rect.bottom()) +\n  103 | \t\t\t\t\t\t   qAbs(rect.center().x() - focusedRect.center().x());\n  104 | \t\t\t\t\tisCandidate = true;\n  105 | \t\t\t\t}\n  106 | \t\t\t\tbreak;\n  107 | \t\t\t}\n  108 | \n  109 | \t\t\tif (isCandidate && distance < bestDistance) {\n  110 | \t\t\t\tbestDistance = distance;\n  111 | \t\t\t\tnextFocus = widget;\n  112 | \t\t\t}\n  113 | \t\t}","lines":47,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/FlowFrame.cpp#L67-L113"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`pulseaudio-wrapper.c` (`pulseaudio_connect_playback`): the function copies the `name` string into a new heap allocation (`bzalloc` + `memcpy`) solely to pass it to `pa_stream_connect_playback`, which accepts a `const char *` and does not require the caller to keep the buffer alive after the call returns. The copy is immediately freed (`bfree(device)`) right after the call. This heap allocation and copy is unnecessary.","fix":"Pass `name` directly to `pa_stream_connect_playback` without copying:\n```c\nint_fast32_t pulseaudio_connect_playback(pa_stream *s, const char *name,\n                                          const pa_buffer_attr *attr,\n                                          pa_stream_flags_t flags)\n{\n    if (pulseaudio_context_ready() < 0)\n        return -1;\n    pulseaudio_lock();\n    int_fast32_t ret = pa_stream_connect_playback(s, name, attr, flags, NULL, NULL);\n    pulseaudio_unlock();\n    return ret;\n}\n```","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-wrapper.c:353-368","code":"  353 | int_fast32_t pulseaudio_connect_playback(pa_stream *s, const char *name, const pa_buffer_attr *attr,\n  354 | \t\t\t\t\t pa_stream_flags_t flags)\n  355 | {\n  356 | \tif (pulseaudio_context_ready() < 0)\n  357 | \t\treturn -1;\n  358 | \n  359 | \tsize_t dev_len = strlen(name);\n  360 | \tchar *device = bzalloc(dev_len + 1);\n  361 | \tmemcpy(device, name, dev_len);\n  362 | \n  363 | \tpulseaudio_lock();\n  364 | \tint_fast32_t ret = pa_stream_connect_playback(s, device, attr, flags, NULL, NULL);\n  365 | \tpulseaudio_unlock();\n  366 | \n  367 | \tbfree(device);\n  368 | \treturn ret;","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/pulse/pulseaudio-wrapper.c#L353-L368"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`effect-parser.c`: the functions `ep_getfunc`, `ep_getstruct`, `ep_getsampler`, `ep_getparam` all perform linear O(n) scans over their respective arrays to find a named item. These are called frequently during parsing and especially during `ep_write_func` dependency resolution. For large shaders with many parameters/functions/structs, this becomes quadratic. A hash map keyed by name would be O(1) per lookup.","fix":"Replace the DARRAY linear-scan lookup pattern with a hash map (e.g., using the existing `util/uthash.h` if available, or a sorted array with binary search as a smaller improvement). This is a medium-complexity refactor but the current `ep_getfunc` / `ep_getstruct` / `ep_getparam` / `ep_getsampler` are the only entry points so the change is self-contained.","locations":[{"ref":"libobs/graphics/effect-parser.c:81-123","code":"   81 | static inline struct ep_func *ep_getfunc(struct effect_parser *ep, const char *name)\n   82 | {\n   83 | \tsize_t i;\n   84 | \tfor (i = 0; i < ep->funcs.num; i++) {\n   85 | \t\tif (strcmp(name, ep->funcs.array[i].name) == 0)\n   86 | \t\t\treturn ep->funcs.array + i;\n   87 | \t}\n   88 | \n   89 | \treturn NULL;\n   90 | }\n   91 | \n   92 | static inline struct ep_struct *ep_getstruct(struct effect_parser *ep, const char *name)\n   93 | {\n   94 | \tsize_t i;\n   95 | \tfor (i = 0; i < ep->structs.num; i++) {\n   96 | \t\tif (strcmp(name, ep->structs.array[i].name) == 0)\n   97 | \t\t\treturn ep->structs.array + i;\n   98 | \t}\n   99 | \n  100 | \treturn NULL;\n  101 | }\n  102 | \n  103 | static inline struct ep_sampler *ep_getsampler(struct effect_parser *ep, const char *name)\n  104 | {\n  105 | \tsize_t i;\n  106 | \tfor (i = 0; i < ep->samplers.num; i++) {\n  107 | \t\tif (strcmp(name, ep->samplers.array[i].name) == 0)\n  108 | \t\t\treturn ep->samplers.array + i;\n  109 | \t}\n  110 | \n  111 | \treturn NULL;\n  112 | }\n  113 | \n  114 | static inline struct ep_param *ep_getparam(struct effect_parser *ep, const char *name)\n  115 | {\n  116 | \tsize_t i;\n  117 | \tfor (i = 0; i < ep->params.num; i++) {\n  118 | \t\tif (strcmp(name, ep->params.array[i].name) == 0)\n  119 | \t\t\treturn ep->params.array + i;\n  120 | \t}\n  121 | \n  122 | \treturn NULL;\n  123 | }","lines":43,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/effect-parser.c#L81-L123"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The `audio_output_active` function (audio-io.c lines 422-435) iterates all `MAX_AUDIO_MIXES` mix slots to check `inputs.num` without holding the `input_mutex`. A concurrent `audio_output_disconnect` could modify `inputs.num` while `audio_output_active` is reading it, causing a data race. All other readers of `mixes[].inputs.num` outside the audio thread hold `input_mutex`.","fix":"Wrap the loop with the mutex:\n```c\nbool audio_output_active(const audio_t *audio)\n{\n    if (!audio)\n        return false;\n    pthread_mutex_lock(&audio->input_mutex);\n    bool active = false;\n    for (size_t mix_idx = 0; mix_idx < MAX_AUDIO_MIXES; mix_idx++) {\n        if (audio->mixes[mix_idx].inputs.num != 0) {\n            active = true;\n            break;\n        }\n    }\n    pthread_mutex_unlock(&audio->input_mutex);\n    return active;\n}\n```\nNote: `input_mutex` is held as `const audio_t *` so a `const_cast` or a non-const overload may be needed depending on the mutex API.","locations":[{"ref":"libobs/media-io/audio-io.c:422-435","code":"  422 | bool audio_output_active(const audio_t *audio)\n  423 | {\n  424 | \tif (!audio)\n  425 | \t\treturn false;\n  426 | \n  427 | \tfor (size_t mix_idx = 0; mix_idx < MAX_AUDIO_MIXES; mix_idx++) {\n  428 | \t\tconst struct audio_mix *mix = &audio->mixes[mix_idx];\n  429 | \n  430 | \t\tif (mix->inputs.num != 0)\n  431 | \t\t\treturn true;\n  432 | \t}\n  433 | \n  434 | \treturn false;\n  435 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/audio-io.c#L422-L435"}]},{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`video-scaler-ffmpeg.c::video_scaler_scale` copies scaled image data from\n`scaler->dst_pointers` to the caller's output buffers line-by-line. This\nintermediate buffer (`dst_pointers`, allocated by `av_image_alloc`) exists\nsolely to perform this copy. For the common case where output buffer linesizes\nmatch the FFmpeg-allocated linesizes, a single `memcpy` is used, but for\nmismatched linesizes a line-by-line copy is used. The intermediate buffer\nadds a full extra copy of the scaled frame on every call. A better design would\npass the caller's output pointers directly to `sws_scale` when the linesizes\nare compatible, avoiding the intermediate buffer entirely.","fix":"For the common path where linesizes match, consider using `sws_scale` directly into the caller's output buffer, falling back to the intermediate buffer only when linesizes differ or the caller's buffer is not suitably aligned for FFmpeg.","locations":[{"ref":"libobs/media-io/video-scaler-ffmpeg.c:143-218","code":"  143 | int video_scaler_create(video_scaler_t **scaler_out, const struct video_scale_info *dst,\n  144 | \t\t\tconst struct video_scale_info *src, enum video_scale_type type)\n  145 | {\n  146 | \tenum AVPixelFormat format_src = get_ffmpeg_video_format(src->format);\n  147 | \tenum AVPixelFormat format_dst = get_ffmpeg_video_format(dst->format);\n  148 | \tint scale_type = get_ffmpeg_scale_type(type);\n  149 | \tconst int *coeff_src = get_ffmpeg_coeffs(src->colorspace);\n  150 | \tconst int *coeff_dst = get_ffmpeg_coeffs(dst->colorspace);\n  151 | \tint range_src = get_ffmpeg_range_type(src->range);\n  152 | \tint range_dst = get_ffmpeg_range_type(dst->range);\n  153 | \tstruct video_scaler *scaler;\n  154 | \tint ret;\n  155 | \n  156 | \tif (!scaler_out)\n  157 | \t\treturn VIDEO_SCALER_FAILED;\n  158 | \n  159 | \tif (format_src == AV_PIX_FMT_NONE || format_dst == AV_PIX_FMT_NONE)\n  160 | \t\treturn VIDEO_SCALER_BAD_CONVERSION;\n  161 | \n  162 | \tscaler = bzalloc(sizeof(struct video_scaler));\n  163 | \tscaler->src_height = src->height;\n  164 | \n  165 | \tconst AVPixFmtDescriptor *desc = av_pix_fmt_desc_get(format_dst);\n  166 | \tbool has_plane[4] = {0};\n  167 | \tfor (size_t i = 0; i < 4; i++)\n  168 | \t\thas_plane[desc->comp[i].plane] = 1;\n  169 | \n  170 | \tscaler->dst_heights[0] = dst->height;\n  171 | \tfor (size_t i = 1; i < 4; ++i) {\n  172 | \t\tif (has_plane[i]) {\n  173 | \t\t\tconst int s = (i == 1 || i == 2) ? desc->log2_chroma_h : 0;\n  174 | \t\t\tscaler->dst_heights[i] = dst->height >> s;\n  175 | \t\t}\n  176 | \t}\n  177 | \n  178 | \tret = av_image_alloc(scaler->dst_pointers, scaler->dst_linesizes, dst->width, dst->height, format_dst, 32);\n  179 | \tif (ret < 0) {\n  180 | \t\tblog(LOG_WARNING, \"video_scaler_create: av_image_alloc failed: %d\", ret);\n  181 | \t\tgoto fail;\n  182 | \t}\n  183 | \n  184 | \tscaler->swscale = sws_alloc_context();\n  185 | \tif (!scaler->swscale) {\n  186 | \t\tblog(LOG_ERROR, \"video_scaler_create: Could not create \"\n  187 | \t\t\t\t\"swscale\");\n  188 | \t\tgoto fail;\n  189 | \t}\n  190 | \n  191 | \tav_opt_set_int(scaler->swscale, \"sws_flags\", scale_type, 0);\n  192 | \tav_opt_set_int(scaler->swscale, \"srcw\", src->width, 0);\n  193 | \tav_opt_set_int(scaler->swscale, \"srch\", src->height, 0);\n  194 | \tav_opt_set_int(scaler->swscale, \"dstw\", dst->width, 0);\n  195 | \tav_opt_set_int(scaler->swscale, \"dsth\", dst->height, 0);\n  196 | \tav_opt_set_int(scaler->swscale, \"src_format\", format_src, 0);\n  197 | \tav_opt_set_int(scaler->swscale, \"dst_format\", format_dst, 0);\n  198 | \tav_opt_set_int(scaler->swscale, \"src_range\", range_src, 0);\n  199 | \tav_opt_set_int(scaler->swscale, \"dst_range\", range_dst, 0);\n  200 | \tif (sws_init_context(scaler->swscale, NULL, NULL) < 0) {\n  201 | \t\tblog(LOG_ERROR, \"video_scaler_create: sws_init_context failed\");\n  202 | \t\tgoto fail;\n  203 | \t}\n  204 | \n  205 | \tret = sws_setColorspaceDetails(scaler->swscale, coeff_src, range_src, coeff_dst, range_dst, 0, FIXED_1_0,\n  206 | \t\t\t\t       FIXED_1_0);\n  207 | \tif (ret < 0) {\n  208 | \t\tblog(LOG_DEBUG, \"video_scaler_create: \"\n  209 | \t\t\t\t\"sws_setColorspaceDetails failed, ignoring\");\n  210 | \t}\n  211 | \n  212 | \t*scaler_out = scaler;\n  213 | \treturn VIDEO_SCALER_SUCCESS;\n  214 | \n  215 | fail:\n  216 | \tvideo_scaler_destroy(scaler);\n  217 | \treturn VIDEO_SCALER_FAILED;\n  218 | }","lines":76,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-scaler-ffmpeg.c#L143-L218"},{"ref":"libobs/media-io/video-scaler-ffmpeg.c:232-270","code":"  232 | bool video_scaler_scale(video_scaler_t *scaler, uint8_t *output[], const uint32_t out_linesize[],\n  233 | \t\t\tconst uint8_t *const input[], const uint32_t in_linesize[])\n  234 | {\n  235 | \tif (!scaler)\n  236 | \t\treturn false;\n  237 | \n  238 | \tint ret = sws_scale(scaler->swscale, input, (const int *)in_linesize, 0, scaler->src_height,\n  239 | \t\t\t    scaler->dst_pointers, scaler->dst_linesizes);\n  240 | \tif (ret <= 0) {\n  241 | \t\tblog(LOG_ERROR, \"video_scaler_scale: sws_scale failed: %d\", ret);\n  242 | \t\treturn false;\n  243 | \t}\n  244 | \n  245 | \tfor (size_t plane = 0; plane < 4; ++plane) {\n  246 | \t\tif (!scaler->dst_pointers[plane])\n  247 | \t\t\tcontinue;\n  248 | \n  249 | \t\tconst size_t scaled_linesize = scaler->dst_linesizes[plane];\n  250 | \t\tconst size_t plane_linesize = out_linesize[plane];\n  251 | \t\tuint8_t *dst = output[plane];\n  252 | \t\tconst uint8_t *src = scaler->dst_pointers[plane];\n  253 | \t\tconst size_t height = scaler->dst_heights[plane];\n  254 | \t\tif (scaled_linesize == plane_linesize) {\n  255 | \t\t\tmemcpy(dst, src, scaled_linesize * height);\n  256 | \t\t} else {\n  257 | \t\t\tsize_t linesize = scaled_linesize;\n  258 | \t\t\tif (linesize > plane_linesize)\n  259 | \t\t\t\tlinesize = plane_linesize;\n  260 | \n  261 | \t\t\tfor (size_t y = 0; y < height; y++) {\n  262 | \t\t\t\tmemcpy(dst, src, linesize);\n  263 | \t\t\t\tdst += plane_linesize;\n  264 | \t\t\t\tsrc += scaled_linesize;\n  265 | \t\t\t}\n  266 | \t\t}\n  267 | \t}\n  268 | \n  269 | \treturn true;\n  270 | }","lines":39,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-scaler-ffmpeg.c#L232-L270"}]},{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The custom `HASH_FUNCTION` used for the hotkey ID hash tables reads only the first byte of the key (`*s % UINT_MAX`, which for a `uint8_t` input is just `*s`). Hotkey IDs are sequential `size_t` values (0, 1, 2, ...). On little-endian platforms the first byte of id N is `N & 0xFF`, so all IDs that share the same low byte land in the same bucket. After 256 hotkeys are registered every new registration hits a bucket that already has at least one entry, and after 512 hotkeys each bucket has at least two. For typical usage (tens of hotkeys) this is harmless, but the hash provides no distribution above id 255.","fix":"Use the full value of the id for the hash. Because ids fit in `size_t`, a simple multiplicative hash works well and requires no dependencies:\n```c\n#define HASH_FUNCTION(s, len, hashv) \\\n    (hashv) = (unsigned)(*(const size_t *)(s) * 2654435761UL)\n```\nOr simply remove the override entirely and let uthash choose its own function.","locations":[{"ref":"libobs/obs-hotkey.c:25-26","code":"   25 | #undef HASH_FUNCTION\n   26 | #define HASH_FUNCTION(s, len, hashv) (hashv) = *s % UINT_MAX","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-hotkey.c#L25-L26"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"very_easy","description":"In `unregister_hotkey`, after `release_registerer(hotkey)` is called at line 860 (which handles `OBS_HOTKEY_REGISTERER_SOURCE` and sets `hotkey->registerer = NULL`), the code at lines 862-863 checks the registerer type again and calls `obs_weak_source_release(hotkey->registerer)` a second time. By that point `hotkey->registerer` is always NULL, so the second release is a no-op. The block is dead code that misleadingly implies a second ownership drop is needed.","fix":"Remove the redundant dead block:\n```c\n/* before */\nrelease_registerer(hotkey);\n\nif (hotkey->registerer_type == OBS_HOTKEY_REGISTERER_SOURCE)\n    obs_weak_source_release(hotkey->registerer);\n\n/* after */\nrelease_registerer(hotkey);\n```","locations":[{"ref":"libobs/obs-hotkey.c:860-863","code":"  860 | \trelease_registerer(hotkey);\n  861 | \n  862 | \tif (hotkey->registerer_type == OBS_HOTKEY_REGISTERER_SOURCE)\n  863 | \t\tobs_weak_source_release(hotkey->registerer);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-hotkey.c#L860-L863"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`build-aux/format-manifest.py` imports `glob` (line 2) and `Any` from `typing` (line 7), but\nneither is used anywhere in the file. The `manifest_path` variable on line 38 is computed but\nalso never used.","fix":"Remove the unused imports and variable:\n\n```python\nimport argparse\nimport json\nimport logging\nimport os\nimport sys\n```\n\nRemove line 38 (`manifest_path = os.path.dirname(manifest_file)`).","locations":[{"ref":"build-aux/format-manifest.py:2","code":"    2 | import glob","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/build-aux/format-manifest.py#L2"},{"ref":"build-aux/format-manifest.py:7","code":"    7 | from typing import Any","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/build-aux/format-manifest.py#L7"},{"ref":"build-aux/format-manifest.py:38","code":"   38 |             manifest_path = os.path.dirname(manifest_file)","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/build-aux/format-manifest.py#L38"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`SceneTree::eventFilter` (lines 60-63) overrides `QObject::eventFilter` but always delegates to the base class without doing any filtering. The widget installs itself as its own event filter in the constructor (`installEventFilter(this)`) so this override adds overhead on every event but does nothing. It can be removed entirely.","fix":"Remove the override and the `installEventFilter(this)` call from the construct al encode time, otherwise if the\n   84 | \t * encode is asynchronous, it measures the pipeline\n   85 | \t * delay between encode request and encode complete.\n   86 | \t * FERC is also captured via os_gettime_ns().\n   87 | \t */\n   88 | \tuint64_t ferc;","lines":15,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-encoder.h#L74-L88"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`effect-parser.c` lines 1096-1099: a block of commented-out code (`/* static bool ep_parse_param_property ... */`) and a commented-out call site (`/* if (...) ... */` at line 1116-1117) have been left in for an unimplemented feature. This is dead code masquerading as comments and adds noise.","fix":"Remove the commented-out code or open a tracked issue and replace it with a single `/* TODO: implement property parsing */` comment on one line.","locations":[{"ref":"libobs/graphics/effect-parser.c:1096-1099","code":" 1096 | /* static bool ep_parse_param_property(struct effect_parser *ep,\n 1097 | \t\tstruct ep_param *param)\n 1098 | {\n 1099 | } */","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/effect-parser.c#L1096-L1099"},{"ref":"libobs/graphics/effect-parser.c:1115-1117","code":" 1115 | \t/*\n 1116 | \tif (cf_token_is(&ep->cfp, \"<\") && !ep_parse_param_property(ep, &param))\n 1117 | \t\tgoto error; */","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/effect-parser.c#L1115-L1117"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `obs-av1.c` line 63, the comment says \"Pass a static 10 byte buffer in.\nThe max size for a leb128.\" A valid leb128 encoding of a 64-bit value requires\nat most 10 bytes (ceil(64/7) = 10). However, the `encode_uleb128` function\nencodes a `uint64_t` and writes into a caller-supplied buffer. The function\nitself does not enforce the 10-byte limit - it will write up to 10 bytes but\ncallers must ensure the buffer is large enough. The comment is accurate but\nthe lack of a bounds check makes it a code smell.\n\nAlso in `obs-av1.c` line 111, a comment says `metdata_obu()` (typo: missing\n'a' in 'metadata').","fix":"Fix the typo `metdata_obu()` -> `metadata_obu()` in the comment at line 115. Consider adding an assertion `assert(*len_out <= 10)` in `encode_uleb128` to catch buffer overflows in debug builds.","locations":[{"ref":"libobs/obs-av1.c:63","code":"   63 | // Pass a static 10 byte buffer in. The max size for a leb128.","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-av1.c#L63"},{"ref":"libobs/obs-av1.c:115","code":"  115 | \t * \tmetdata_obu()","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-av1.c#L115"}]},{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"`AudioCaptureToolbar.cpp` and `DisplayCaptureToolbar.cpp` define identical platform-dispatch macros (`get_os_module` / `get_os_text`) at file scope. These macros are copy-pasted verbatim between the two files. A shared header or a single inline helper function would eliminate the duplication and the risk of divergence.","fix":"Move the macros to a shared internal header (e.g. `ToolbarOSHelpers.hpp`) and include it from both files, or replace them with a small inline function:\n\n```cpp\nstatic inline obs_module_t *get_os_module(const char *win, const char *mac, const char *linux_mod)\n{\n#if defined(_WIN32)\n    return obs_get_module(win);\n#elif defined(__APPLE__)\n    return obs_get_module(mac);\n#else\n    return obs_get_module(linux_mod);\n#endif\n}\n```","locations":[{"ref":"frontend/components/AudioCaptureToolbar.cpp:5-14","code":"    5 | #ifdef _WIN32\n    6 | #define get_os_module(win, mac, linux) obs_get_module(win)\n    7 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, win)\n    8 | #elif __APPLE__\n    9 | #define get_os_module(win, mac, linux) obs_get_module(mac)\n   10 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, mac)\n   11 | #else\n   12 | #define get_os_module(win, mac, linux) obs_get_module(linux)\n   13 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, linux)\n   14 | #endif","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/AudioCaptureToolbar.cpp#L5-L14"},{"ref":"frontend/components/DisplayCaptureToolbar.cpp:5-14","code":"    5 | #ifdef _WIN32\n    6 | #define get_os_module(win, mac, linux) obs_get_module(win)\n    7 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, win)\n    8 | #elif __APPLE__\n    9 | #define get_os_module(win, mac, linux) obs_get_module(mac)\n   10 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, mac)\n   11 | #else\n   12 | #define get_os_module(win, mac, linux) obs_get_module(linux)\n   13 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, linux)\n   14 | #endif","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/DisplayCaptureToolbar.cpp#L5-L14"}]},{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The `audio_monitor_init` pattern - checking `OBS_SOURCE_DO_NOT_SELF_MONITOR`, getting source settings, comparing device IDs with `devices_match`, and setting `monitor->ignore` - is duplicated identically across all three platform implementations: `coreaudio-output.c` (lines 173-183), `pulseaudio-output.c` (lines 359-369), and `wasapi-output.c` (lines 384-394). Any change to this logic must be made in three places.","fix":"Extract this logic into a shared helper in a platform-agnostic file (e.g., `libobs/obs-audio-monitoring.c`) that all three implementations call:\n```c\nstatic bool audio_monitor_check_self_monitor(struct audio_monitor *monitor,\n                                              obs_source_t *source,\n                                              const char *monitoring_id)\n{\n    if (!(source->info.output_flags & OBS_SOURCE_DO_NOT_SELF_MONITOR))\n        return false;\n    obs_data_t *s = obs_source_get_settings(source);\n    const char *s_dev_id = obs_data_get_string(s, \"device_id\");\n    bool match = devices_match(s_dev_id, monitoring_id);\n    obs_data_release(s);\n    return match;\n}\n```","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-output.c:173-183","code":"  173 | \tif (source->info.output_flags & OBS_SOURCE_DO_NOT_SELF_MONITOR) {\n  174 | \t\tobs_data_t *s = obs_source_get_settings(source);\n  175 | \t\tconst char *s_dev_id = obs_data_get_string(s, \"device_id\");\n  176 | \t\tbool match = devices_match(s_dev_id, uid);\n  177 | \t\tobs_data_release(s);\n  178 | \n  179 | \t\tif (match) {\n  180 | \t\t\tmonitor->ignore = true;\n  181 | \t\t\treturn true;\n  182 | \t\t}\n  183 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/osx/coreaudio-output.c#L173-L183"},{"ref":"libobs/audio-monitoring/pulse/pulseaudio-output.c:359-369","code":"  359 | \tif (source->info.output_flags & OBS_SOURCE_DO_NOT_SELF_MONITOR) {\n  360 | \t\tobs_data_t *s = obs_source_get_settings(source);\n  361 | \t\tconst char *s_dev_id = obs_data_get_string(s, \"device_id\");\n  362 | \t\tbool match = devices_match(s_dev_id, id);\n  363 | \t\tobs_data_release(s);\n  364 | \n  365 | \t\tif (match) {\n  366 | \t\t\tmonitor->ignore = true;\n  367 | \t\t\tblog(LOG_INFO, \"Prevented feedback-loop in '%s'\", s_dev_id);\n  368 | \t\t\treturn true;\n  369 | \t\t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/pulse/pulseaudio-output.c#L359-L369"},{"ref":"libobs/audio-monitoring/win32/wasapi-output.c:384-394","code":"  384 | \tif (source->info.output_flags & OBS_SOURCE_DO_NOT_SELF_MONITOR) {\n  385 | \t\tobs_data_t *s = obs_source_get_settings(source);\n  386 | \t\tconst char *s_dev_id = obs_data_get_string(s, \"device_id\");\n  387 | \t\tbool match = devices_match(s_dev_id, id);\n  388 | \t\tobs_data_release(s);\n  389 | \n  390 | \t\tif (match) {\n  391 | \t\t\tmonitor->ignore = true;\n  392 | \t\t\treturn true;\n  393 | \t\t}\n  394 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/win32/wasapi-output.c#L384-L394"}]},{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"high","difficulty":"medium","description":"`VolumeAccessibleInterface` provides `currentValue`, `setCurrentValue`, `maximumValue`,\n`minimumValue`, and `minimumStepSize` methods, but the class only inherits from\n`QAccessibleWidget`. It does NOT inherit from `QAccessibleValueInterface`.\n\nQt's accessibility framework discovers value-interface capability exclusively through\n`QAccessibleInterface::interface_cast<QAccessibleValueInterface>()`. Without the inheritance,\nthe framework never queries these five methods. Screen readers (NVDA, JAWS, VoiceOver,\nOrca) will never receive slider value, minimum, maximum, or step information through the\nproper value interface.\n\nThe `text(QAccessible::Text::Value)` override in `text()` (line 14-22) partially mitigates\nthis for textual value reads, but `setCurrentValue`, `maximumValue`, `minimumValue`, and\n`minimumStepSize` remain completely dead code from the AT framework's point of view.","fix":"Inherit from both `QAccessibleWidget` and `QAccessibleValueInterface`, and override\n`interface_cast` so the framework can discover the value interface:\n\n```cpp\n// VolumeAccessibleInterface.hpp\n#include <QAccessibleWidget>\n\nclass VolumeSlider;\n\nclass VolumeAccessibleInterface : public QAccessibleWidget,\n                                  public QAccessibleValueInterface {\npublic:\n    explicit VolumeAccessibleInterface(QWidget *w);\n\n    // QAccessibleValueInterface\n    QVariant currentValue() const override;\n    void setCurrentValue(const QVariant &value) override;\n    QVariant maximumValue() const override;\n    QVariant minimumValue() const override;\n    QVariant minimumStepSize() const override;\n\n    // QAccessibleWidget\n    void *interface_cast(QAccessible::InterfaceType type) override;\n\nprotected:\n    QAccessible::Role role() const override;\n    QString text(QAccessible::Text t) const override;\n\nprivate:\n    VolumeSlider *slider() const;\n};\n```\n\n```cpp\n// VolumeAccessibleInterface.cpp\nvoid *VolumeAccessibleInterface::interface_cast(QAccessible::InterfaceType type)\n{\n    if (type == QAccessible::ValueInterface)\n        return static_cast<QAccessibleValueInterface *>(this);\n    return QAccessibleWidget::interface_cast(type);\n}\n```","locations":[{"ref":"frontend/components/VolumeAccessibleInterface.hpp:7-26","code":"    7 | class VolumeAccessibleInterface : public QAccessibleWidget {\n    8 | \n    9 | public:\n   10 | \tVolumeAccessibleInterface(QWidget *w);\n   11 | \n   12 | \tQVariant currentValue() const;\n   13 | \tvoid setCurrentValue(const QVariant &value);\n   14 | \n   15 | \tQVariant maximumValue() const;\n   16 | \tQVariant minimumValue() const;\n   17 | \n   18 | \tQVariant minimumStepSize() const;\n   19 | \n   20 | private:\n   21 | \tVolumeSlider *slider() const;\n   22 | \n   23 | protected:\n   24 | \tvirtual QAccessible::Role role() const override;\n   25 | \tvirtual QString text(QAccessible::Text t) const override;\n   26 | };","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/VolumeAccessibleInterface.hpp#L7-L26"},{"ref":"frontend/components/VolumeAccessibleInterface.cpp:39-57","code":"   39 | void VolumeAccessibleInterface::setCurrentValue(const QVariant &value)\n   40 | {\n   41 | \tslider()->setValue(value.toInt());\n   42 | }\n   43 | \n   44 | QVariant VolumeAccessibleInterface::maximumValue() const\n   45 | {\n   46 | \treturn slider()->maximum();\n   47 | }\n   48 | \n   49 | QVariant VolumeAccessibleInterface::minimumValue() const\n   50 | {\n   51 | \treturn slider()->minimum();\n   52 | }\n   53 | \n   54 | QVariant VolumeAccessibleInterface::minimumStepSize() const\n   55 | {\n   56 | \treturn slider()->singleStep();\n   57 | }","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/VolumeAccessibleInterface.cpp#L39-L57"}]},{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`OBSStudioAPI::obs_frontend_set_current_scene_collection` and\n`OBSStudioAPI::obs_frontend_set_current_profile` operate by searching the menu action list for a\nmatching text label and triggering it. This approach is fragile: it depends on the menu being\npopulated, breaks if the display name ever differs from the internal name, and is not locale-safe\n(menu text is translated). Any caller that passes a collection or profile name that does not\nexactly match the displayed menu text will silently fail with no error reported.","fix":"Use a direct lookup by internal/file name rather than UI menu text. Invoke a method on\n`OBSBasic` that accepts the internal name and switches the collection/profile directly, bypassing\nthe menu action indirection. If a direct API is not available, at minimum log a warning when no\nmatching action is found so callers can detect the failure.","locations":[{"ref":"frontend/OBSStudioAPI.cpp:143-159","code":"  143 | void OBSStudioAPI::obs_frontend_set_current_scene_collection(const char *collection)\n  144 | {\n  145 | \tQList<QAction *> menuActions = main->ui->sceneCollectionMenu->actions();\n  146 | \tQString qstrCollection = QT_UTF8(collection);\n  147 | \n  148 | \tfor (int i = 0; i < menuActions.count(); i++) {\n  149 | \t\tQAction *action = menuActions[i];\n  150 | \t\tQVariant v = action->property(\"file_name\");\n  151 | \n  152 | \t\tif (v.typeName() != nullptr) {\n  153 | \t\t\tif (action->text() == qstrCollection) {\n  154 | \t\t\t\taction->trigger();\n  155 | \t\t\t\tbreak;\n  156 | \t\t\t}\n  157 | \t\t}\n  158 | \t}\n  159 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSStudioAPI.cpp#L143-L159"},{"ref":"frontend/OBSStudioAPI.cpp:191-207","code":"  191 | void OBSStudioAPI::obs_frontend_set_current_profile(const char *profile)\n  192 | {\n  193 | \tQList<QAction *> menuActions = main->ui->profileMenu->actions();\n  194 | \tQString qstrProfile = QT_UTF8(profile);\n  195 | \n  196 | \tfor (int i = 0; i < menuActions.count(); i++) {\n  197 | \t\tQAction *action = menuActions[i];\n  198 | \t\tQVariant v = action->property(\"file_name\");\n  199 | \n  200 | \t\tif (v.typeName() != nullptr) {\n  201 | \t\t\tif (action->text() == qstrProfile) {\n  202 | \t\t\t\taction->trigger();\n  203 | \t\t\t\tbreak;\n  204 | \t\t\t}\n  205 | \t\t}\n  206 | \t}\n  207 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSStudioAPI.cpp#L191-L207"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`obs-audio-controls.c` at line 427 uses `printf` (not `blog`) to report a\nmisaligned audio plane. This bypasses OBS's logging system entirely - the\nmessage goes to stdout, which is not captured by OBS log files, and will not\nbe visible in the OBS log window or crash reports. In a production OBS build,\nthis debug message is effectively invisible.","fix":"Replace `printf(...)` with `blog(LOG_WARNING, ...)`.","locations":[{"ref":"libobs/obs-audio-controls.c:424-430","code":"  424 | \t\tif (((uintptr_t)samples & 0xf) > 0) {\n  425 | \t\t\tprintf(\"Audio plane %i is not aligned %p skipping \"\n  426 | \t\t\t       \"peak volume measurement.\\n\",\n  427 | \t\t\t       plane_nr, samples);\n  428 | \t\t\tvolmeter->peak[channel_nr] = 1.0;\n  429 | \t\t\tchannel_nr++;\n  430 | \t\t\tcontinue;","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-audio-controls.c#L424-L430"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`MediaControls` declares `int seek` and `int lastSeek` as member variables without in-class initialisers (header lines 18-19). They are used in `AbsoluteSliderClicked` and `SeekTimerCallback` before any constructor assignment, leading to reads of uninitialised values if a slider event fires before `AbsoluteSliderClicked` sets `seek`. `MediaControls` has no explicit constructor that initialises them (the ctor body only connects signals).","fix":"Add in-class initialisers:\n\n```cpp\nint seek = -1;\nint lastSeek = -1;\n```","locations":[{"ref":"frontend/components/MediaControls.hpp:18-19","code":"   18 | \tint seek;\n   19 | \tint lastSeek;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/MediaControls.hpp#L18-L19"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The local macros `ACCEPT_BUTTON` and `REJECT_BUTTON` defined inside\n`UIValidation::StreamSettingsConfirmation` (lines 94-98) are never `#undef`'d after their use.\nWhile harmless in this translation unit because no other code follows their definition in the\nsame file, leaving function-scoped macros alive pollutes the macro namespace for any he
