e is consistent with its behaviour, but the unused parameter wastes a register and creates confusion.","fix":"Remove the `code_size` parameter and update all call sites (lines 1151, 1162) to call `gif_next_code(gif)`:\n```c\nstatic int gif_next_code(gif_animation *gif) {\n    // use gif->code_size directly\n```","locations":[{"ref":"libobs/graphics/libnsgif/libnsgif.c:1241-1246","code":" 1241 | static int gif_next_code(gif_animation *gif, int code_size) {\n 1242 |     int i, j, end, count, ret;\n 1243 |     unsigned char *b;\n 1244 | \n 1245 |     (void)code_size;\n 1246 | ","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L1241-L1246"}]},{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`polar_to_norm` in math-extra.c converts a 2D polar coordinate (azimuth, elevation) to a 3D unit vector, but the component assignments do not match the inverse function `norm_to_polar`. `norm_to_polar` uses `atan2f(norm->x, norm->z)` for x (azimuth) and `asinf(norm->y)` for y (elevation). The round-trip is broken: `polar_to_norm` sets `dst->x = sinx * cosf(polar->y)` and `dst->y = sinx * sinf(polar->y)` - this interprets polar->y as an azimuthal angle, but `norm_to_polar` stores elevation in y. The Y and Z assignments are effectively swapped relative to what `norm_to_polar` expects.","fix":"Match the convention established by `norm_to_polar`:\n```c\nvoid polar_to_norm(struct vec3 *dst, const struct vec2 *polar)\n{\n    float cosy = cosf(polar->y);  // elevation\n    dst->x = cosy * sinf(polar->x);\n    dst->y = sinf(polar->y);\n    dst->z = cosy * cosf(polar->x);\n}\n```","locations":[{"ref":"libobs/graphics/math-extra.c:58-65","code":"   58 | void polar_to_norm(struct vec3 *dst, const struct vec2 *polar)\n   59 | {\n   60 | \tfloat sinx = sinf(polar->x);\n   61 | \n   62 | \tdst->x = sinx * cosf(polar->y);\n   63 | \tdst->y = sinx * sinf(polar->y);\n   64 | \tdst->z = cosf(polar->x);\n   65 | }","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/math-extra.c#L58-L65"}]},{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`matrix3_transpose` in matrix3.c (lines 106-107) computes `dst->t` by rotating m->t through m and then negating. A pure transpose of a 3x4 transform matrix does not transform the translation vector at all; the `t` row is simply zeroed (or left undefined) in the transposed result. The current code produces a wrong translation component in `dst->t`.","fix":"After transposing the 3x3 rotation block, set `dst->t` to zero:\n```c\nvoid matrix3_transpose(struct matrix3 *dst, const struct matrix3 *m)\n{\n    __m128 tmp1, tmp2;\n    vec3_zero(&dst->t);\n\n    tmp1 = _mm_movelh_ps(m->x.m, m->y.m);\n    tmp2 = _mm_movehl_ps(m->y.m, m->x.m);\n    dst->x.m = _mm_shuffle_ps(tmp1, m->z.m, _MM_SHUFFLE(3, 0, 2, 0));\n    dst->y.m = _mm_shuffle_ps(tmp1, m->z.m, _MM_SHUFFLE(3, 1, 3, 1));\n    dst->z.m = _mm_shuffle_ps(tmp2, m->z.m, _MM_SHUFFLE(3, 2, 2, 0));\n}\n```","locations":[{"ref":"libobs/graphics/matrix3.c:103-113","code":"  103 | void matrix3_transpose(struct matrix3 *dst, const struct matrix3 *m)\n  104 | {\n  105 | \t__m128 tmp1, tmp2;\n  106 | \tvec3_rotate(&dst->t, &m->t, m);\n  107 | \tvec3_neg(&dst->t, &dst->t);\n  108 | \n  109 | \ttmp1 = _mm_movelh_ps(m->x.m, m->y.m);\n  110 | \ttmp2 = _mm_movehl_ps(m->y.m, m->x.m);\n  111 | \tdst->x.m = _mm_shuffle_ps(tmp1, m->z.m, _MM_SHUFFLE(3, 0, 2, 0));\n  112 | \tdst->y.m = _mm_shuffle_ps(tmp1, m->z.m, _MM_SHUFFLE(3, 1, 3, 1));\n  113 | \tdst->z.m = _mm_shuffle_ps(tmp2, m->z.m, _MM_SHUFFLE(3, 2, 2, 0));","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/matrix3.c#L103-L113"}]},{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`matrix3_translate` in matrix3.h subtracts the translation vector instead of adding it. This is the opposite of the conventional definition of a translate operation and is inconsistent with `matrix4_translate3v` which builds a proper translation matrix.","fix":"Change `vec3_sub` to `vec3_add`:\n```c\nstatic inline void matrix3_translate(struct matrix3 *dst, const struct matrix3 *m, const struct vec3 *v)\n{\n    vec3_add(&dst->t, &m->t, v);\n}\n```","locations":[{"ref":"libobs/graphics/matrix3.h:60-63","code":"   60 | static inline void matrix3_translate(struct matrix3 *dst, const struct matrix3 *m, const struct vec3 *v)\n   61 | {\n   62 | \tvec3_sub(&dst->t, &m->t, v);\n   63 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/matrix3.h#L60-L63"}]},{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`quat_set` in quat.h sets the components in the wrong order. `_mm_set_ps` fills the SSE register as (w=arg0, z=arg1, y=arg2, x=arg3), meaning the call `_mm_set_ps(x, y, z, w)` maps: register.w=x, register.z=y, register.y=z, register.x=w - i.e. the x and w arguments are swapped. Every call to `quat_set` therefore produces a quaternion with x and w exchanged.","fix":"Correct the argument order to match the SSE lane convention used everywhere else (e.g. `vec4_set`):\n```c\nstatic inline void quat_set(struct quat *dst, float x, float y, float z, float w)\n{\n    dst->m = _mm_set_ps(w, z, y, x);\n}\n```","locations":[{"ref":"libobs/graphics/quat.h:58-61","code":"   58 | static inline void quat_set(struct quat *dst, float x, float y, float z, float w)\n   59 | {\n   60 | \tdst->m = _mm_set_ps(x, y, z, w);\n   61 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/quat.h#L58-L61"}]},{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`vec3_close` (vec3.h:155-160) and `quat_close` (quat.h:147-151) both check `test.x < epsilon && test.y < epsilon && test.z < epsilon` after subtracting the two vectors. This only tests whether components are *less than* epsilon, not whether they are within [-epsilon, epsilon]. Negative differences larger in magnitude than epsilon will pass the check silently, producing false-positive \"close\" results. `vec4_close` has the same flaw (vec4.h:138-143).","fix":"Use `fabsf` on each component before comparing:\n```c\nstatic inline bool vec3_close(const struct vec3 *v1, const struct vec3 *v2, float epsilon)\n{\n    struct vec3 test;\n    vec3_sub(&test, v1, v2);\n    return fabsf(test.x) < epsilon && fabsf(test.y) < epsilon && fabsf(test.z) < epsilon;\n}\n```\nApply the same fix to `vec4_close` and `quat_close`.","locations":[{"ref":"libobs/graphics/vec3.h:155-160","code":"  155 | static inline bool vec3_close(const struct vec3 *v1, const struct vec3 *v2, float epsilon)\n  156 | {\n  157 | \tstruct vec3 test;\n  158 | \tvec3_sub(&test, v1, v2);\n  159 | \treturn test.x < epsilon && test.y < epsilon && test.z < epsilon;\n  160 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/vec3.h#L155-L160"},{"ref":"libobs/graphics/quat.h:147-151","code":"  147 | {\n  148 | \tstruct quat test;\n  149 | \tquat_sub(&test, q1, q2);\n  150 | \treturn test.x < epsilon && test.y < epsilon && test.z < epsilon && test.w < epsilon;\n  151 | }","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/quat.h#L147-L151"},{"ref":"libobs/graphics/vec4.h:138-143","code":"  138 | static inline int vec4_close(const struct vec4 *v1, const struct vec4 *v2, float epsilon)\n  139 | {\n  140 | \tstruct vec4 test;\n  141 | \tvec4_sub(&test, v1, v2);\n  142 | \treturn test.x < epsilon && test.y < epsilon && test.z < epsilon && test.w < epsilon;\n  143 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/vec4.h#L138-L143"}]},{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `process_packets` (media-remux.c line 200), `pkt.stream_index` from an untrusted input file is used directly to index `job->ofmt_ctx->streams[]` without validating that `pkt.stream_index < job->ofmt_ctx->nb_streams`. A malformed or malicious file with a stream index larger than the number of output streams causes an out-of-bounds array access.","fix":"Add a bounds check before using `pkt.stream_index`:\n```c\nif ((unsigned)pkt.stream_index >= job->ofmt_ctx->nb_streams) {\n    av_packet_unref(&pkt);\n    continue;\n}\nprocess_packet(&pkt, job->ifmt_ctx->streams[pkt.stream_index],\n               job->ofmt_ctx->streams[pkt.stream_index]);\n```","locations":[{"ref":"libobs/media-io/media-remux.c:200-201","code":"  200 | \t\tprocess_packet(&pkt, job->ifmt_ctx->streams[pkt.stream_index],\n  201 | \t\t\t       job->ofmt_ctx->streams[pkt.stream_index]);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/media-remux.c#L200-L201"}]},{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `media_remux_job_process` (media-remux.c lines 238-239), the success condition is `ret >= 0 || ret == AVERROR_EOF`. `AVERROR_EOF` is a negative value (defined as `-(('E'<<24)|...)` in FFmpeg), so `ret == AVERROR_EOF` is already captured by `ret >= 0` being false - but the intent is that EOF is a successful termination. This is correct logic but fragile. More critically, `process_packets` returns `ret` which is the return code of `av_read_frame` after the last iteration. If the loop `break`s due to a callback returning false, `ret` holds the last `av_read_frame` result which was 0 (success), so `success = true` even though processing was intentionally aborted.","fix":"Use a separate sentinel to distinguish \"cancelled by callback\" from \"normal EOF\":\n```c\nstatic inline int process_packets(...) {\n    bool cancelled = false;\n    for (;;) {\n        ret = av_read_frame(job->ifmt_ctx, &pkt);\n        if (ret < 0) break;\n        if (callback && ...) {\n            if (!callback(data, progress)) { cancelled = true; break; }\n        }\n        // ...\n    }\n    return cancelled ? -1 : ret;\n}\n```","locations":[{"ref":"libobs/media-io/media-remux.c:238-239","code":"  238 | \tret = process_packets(job, callback, data);\n  239 | \tsuccess = ret >= 0 || ret == AVERROR_EOF;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/media-remux.c#L238-L239"},{"ref":"libobs/media-io/media-remux.c:177-219","code":"  177 | static inline int process_packets(media_remux_job_t job, media_remux_progress_callback callback, void *data)\n  178 | {\n  179 | \tAVPacket pkt;\n  180 | \n  181 | \tint ret, throttle = 0;\n  182 | \tfor (;;) {\n  183 | \t\tret = av_read_frame(job->ifmt_ctx, &pkt);\n  184 | \t\tif (ret < 0) {\n  185 | \t\t\tif (ret != AVERROR_EOF)\n  186 | \t\t\t\tblog(LOG_ERROR,\n  187 | \t\t\t\t     \"media_remux: Error reading\"\n  188 | \t\t\t\t     \" packet: %s\",\n  189 | \t\t\t\t     av_err2str(ret));\n  190 | \t\t\tbreak;\n  191 | \t\t}\n  192 | \n  193 | \t\tif (callback != NULL && throttle++ > 10) {\n  194 | \t\t\tfloat progress = pkt.pos / (float)job->in_size * 100.f;\n  195 | \t\t\tif (!callback(data, progress))\n  196 | \t\t\t\tbreak;\n  197 | \t\t\tthrottle = 0;\n  198 | \t\t}\n  199 | \n  200 | \t\tprocess_packet(&pkt, job->ifmt_ctx->streams[pkt.stream_index],\n  201 | \t\t\t       job->ofmt_ctx->streams[pkt.stream_index]);\n  202 | \n  203 | \t\tret = av_interleaved_write_frame(job->ofmt_ctx, &pkt);\n  204 | \t\tav_packet_unref(&pkt);\n  205 | \n  206 | \t\tif (ret < 0) {\n  207 | \t\t\tblog(LOG_ERROR, \"media_remux: Error muxing packet: %s\", av_err2str(ret));\n  208 | \n  209 | \t\t\t/* Treat \"Invalid data found when processing input\" and\n  210 | \t\t\t * \"Invalid argument\" as non-fatal */\n  211 | \t\t\tif (ret == AVERROR_INVALIDDATA || ret == -EINVAL)\n  212 | \t\t\t\tcontinue;\n  213 | \n  214 | \t\t\tbreak;\n  215 | \t\t}\n  216 | \t}\n  217 | \n  218 | \treturn ret;\n  219 | }","lines":43,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/media-remux.c#L177-L219"}]},{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`video_frame_copy` in `video-frame.c` checks `if (!heights[i])` but does NOT\ncheck `if (!src->data[i] || !dst->data[i])` before calling `memcpy`. If a\ncaller passes a src or dst frame where a plane pointer is NULL (e.g. a partially\ninitialized frame, or a frame where the format changed), memcpy is called with\na NULL pointer, which is undefined behavior and will crash.\n\n`video_frame_get_plane_heights` can return non-zero heights for planes that\nthe caller's frame doesn't have allocated (e.g. if the format argument passed\nto `video_frame_copy` doesn't match the actual format used to allocate the\nframe). The function documentation does not make this safety contract explicit.","fix":"Add NULL checks before each `memcpy` call:\n\n```c\nfor (uint32_t i = 0; i < MAX_AV_PLANES; i++) {\n    if (!heights[i] || !src->data[i] || !dst->data[i])\n        continue;\n    // ... existing copy logic\n}\n```","locations":[{"ref":"libobs/media-io/video-frame.c:244-262","code":"  244 | \t/* copy each plane */\n  245 | \tfor (uint32_t i = 0; i < MAX_AV_PLANES; i++) {\n  246 | \t\tif (!heights[i])\n  247 | \t\t\tcontinue;\n  248 | \n  249 | \t\tif (src->linesize[i] == dst->linesize[i]) {\n  250 | \t\t\tmemcpy(dst->data[i], src->data[i], src->linesize[i] * heights[i]);\n  251 | \t\t} else { /* linesizes which do not match must be copied line-by-line */\n  252 | \t\t\tsize_t src_linesize = src->linesize[i];\n  253 | \t\t\tsize_t dst_linesize = dst->linesize[i];\n  254 | \t\t\t/* determine how much we can write (frames with different line sizes require more )*/\n  255 | \t\t\tsize_t linesize = src_linesize < dst_linesize ? src_linesize : dst_linesize;\n  256 | \t\t\tfor (uint32_t y = 0; y < heights[i]; y++) {\n  257 | \t\t\t\tuint8_t *src_pos = src->data[i] + (src_linesize * y);\n  258 | \t\t\t\tuint8_t *dst_pos = dst->data[i] + (dst_linesize * y);\n  259 | \t\t\t\tmemcpy(dst_pos, src_pos, linesize);\n  260 | \t\t\t}\n  261 | \t\t}\n  262 | \t}","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-frame.c#L244-L262"}]},{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `video-io.c::init_cache`, `video_frame_init` is called with a cast:\n`frame = (struct video_frame *)&video->cache[i]`. However, `video->cache[i]`\nis a `struct cached_frame_info`, not a `struct video_frame`. `cached_frame_info`\nhas a `struct video_data frame` member (not `struct video_frame`), plus `int\nskipped` and `int count`. `struct video_data` has `uint8_t *data[MAX_AV_PLANES]`\nand `uint32_t linesize[MAX_AV_PLANES]`, which matches the layout of `struct\nvideo_frame`. The cast relies on `struct video_frame` and `struct video_data`\nbeing layout-compatible, which is true today but is not formally guaranteed\n(no `static_assert` enforces it). If either struct is modified, this silently\nbreaks. The proper fix is to use the `frame` member of `cached_frame_info`\ndirectly.\n\nSimilarly in `video_output_close`, `video_frame_free` is called with the same\ncast. This calls `bfree(frame->data[0])` which frees the allocation made by\n`video_frame_init`. This is intentional but relies on the same layout assumption.","fix":"`struct cached_frame_info` currently has `struct video_data frame` but the code\ncasts it to `struct video_frame *`. Add a compile-time assertion or refactor\n`cached_frame_info` to embed `struct video_frame` instead of `struct video_data`:\n\n```c\n// In struct cached_frame_info, change:\n//   struct video_data frame;\n// to:\n//   struct video_frame frame;\n// Then update all accesses to use frame.data / frame.linesize consistently.\n```\n\nAt minimum add:\n```c\nstatic_assert(sizeof(struct video_frame) == offsetof(struct video_data, timestamp),\n              \"video_frame and video_data layout mismatch\");\n```","locations":[{"ref":"libobs/media-io/video-io.c:229-237","code":"  229 | \tfor (size_t i = 0; i < video->info.cache_size; i++) {\n  230 | \t\tstruct video_frame *frame;\n  231 | \t\tframe = (struct video_frame *)&video->cache[i];\n  232 | \n  233 | \t\tvideo_frame_init(frame, video->info.format, video->info.width, video->info.height);\n  234 | \t}\n  235 | \n  236 | \tvideo->available_frames = video->info.cache_size;\n  237 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-io.c#L229-L237"},{"ref":"libobs/media-io/video-io.c:291-292","code":"  291 | \tfor (size_t i = 0; i < video->info.cache_size; i++)\n  292 | \t\tvideo_frame_free((struct video_frame *)&video->cache[i]);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-io.c#L291-L292"}]},{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `video-io.c::video_output_open`, the call to `init_cache` at line 262 is\nmade AFTER the video thread is started at line 259. The video thread immediately\nwaits on `update_semaphore` (which starts at 0), so it won't use the cache\nbefore it is initialized. However, `available_frames` is still 0 at thread\nstart (it is set by `init_cache`), and if anything posts to `update_semaphore`\nbetween thread creation and `init_cache` completing (e.g. via\n`video_output_lock_frame` called from another thread that saw the newly-created\n`video_t` pointer), the video thread could run with a partially-initialized\ncache. The semaphore starts at 0 so the thread will block, but the\n`available_frames` field is 0, and a concurrent `video_output_lock_frame` call\nwould see `available_frames == 0` and increment the skip counter on an\nuninitialized cache entry.\n\nThe fix is to call `init_cache` before starting the thread.","fix":"Move `init_cache(out)` to before `pthread_create`:\n\n```c\ninit_cache(out);\n\nif (pthread_create(&out->thread, NULL, video_thread, out) != 0)\n    goto fail3;\n\n*video = out;\nreturn VIDEO_OUTPUT_SUCCESS;\n\nfail3:\n    os_sem_destroy(out->update_semaphore);\n```\n\nThe `init_cache` function only sets `out->available_frames` and calls\n`video_frame_init` for cache entries - none of which requires the thread to\nbe running, so this reorder is safe.","locations":[{"ref":"libobs/media-io/video-io.c:239-276","code":"  239 | int video_output_open(video_t **video, struct video_output_info *info)\n  240 | {\n  241 | \tstruct video_output *out;\n  242 | \n  243 | \tif (!valid_video_params(info))\n  244 | \t\treturn VIDEO_OUTPUT_INVALIDPARAM;\n  245 | \n  246 | \tout = bzalloc(sizeof(struct video_output));\n  247 | \tif (!out)\n  248 | \t\tgoto fail0;\n  249 | \n  250 | \tmemcpy(&out->info, info, sizeof(struct video_output_info));\n  251 | \tout->frame_time = util_mul_div64(1000000000ULL, info->fps_den, info->fps_num);\n  252 | \n  253 | \tif (pthread_mutex_init_recursive(&out->data_mutex) != 0)\n  254 | \t\tgoto fail0;\n  255 | \tif (pthread_mutex_init_recursive(&out->input_mutex) != 0)\n  256 | \t\tgoto fail1;\n  257 | \tif (os_sem_init(&out->update_semaphore, 0) != 0)\n  258 | \t\tgoto fail2;\n  259 | \tif (pthread_create(&out->thread, NULL, video_thread, out) != 0)\n  260 | \t\tgoto fail3;\n  261 | \n  262 | \tinit_cache(out);\n  263 | \n  264 | \t*video = out;\n  265 | \treturn VIDEO_OUTPUT_SUCCESS;\n  266 | \n  267 | fail3:\n  268 | \tos_sem_destroy(out->update_semaphore);\n  269 | fail2:\n  270 | \tpthread_mutex_destroy(&out->input_mutex);\n  271 | fail1:\n  272 | \tpthread_mutex_destroy(&out->data_mutex);\n  273 | fail0:\n  274 | \tbfree(out);\n  275 | \treturn VIDEO_OUTPUT_FAIL;\n  276 | }","lines":38,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-io.c#L239-L276"}]},{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`video_output_close` in `video-io.c` acquires `input_mutex` while calling\n`video_input_free` (which calls `video_frame_free` and `video_scaler_destroy`),\nand then calls `video_output_stop` first. `video_output_stop` joins the video\nthread. The video thread calls `video_output_cur_frame` which acquires\n`input_mutex`. This ordering (stop -> join -> lock input_mutex -> free) is\ncorrect because the join ensures the thread is dead before the lock is taken.\n\nHowever, `video_output_close` then destroys `data_mutex` and `input_mutex`\nAFTER `pthread_mutex_unlock(&video->input_mutex)` but while still holding\nno lock. If any other thread concurrently calls `video_output_disconnect` or\n`video_output_connect` (which also take `input_mutex`) during close, they will\nbe using a mutex that is in the process of being destroyed. There is no\nreference counting to prevent this race. This is an architecture-level issue\nshared with much of OBS's object lifecycle.","fix":"Ensure callers of `video_output_close` guarantee no concurrent `video_output_connect`/`disconnect` calls are in flight (document this requirement clearly). Alternatively, add a `closing` flag checked under the mutex before `connect`/`disconnect` proceed.","locations":[{"ref":"libobs/media-io/video-io.c:278-300","code":"  278 | void video_output_close(video_t *video)\n  279 | {\n  280 | \tif (!video)\n  281 | \t\treturn;\n  282 | \n  283 | \tvideo_output_stop(video);\n  284 | \n  285 | \tpthread_mutex_lock(&video->input_mutex);\n  286 | \n  287 | \tfor (size_t i = 0; i < video->inputs.num; i++)\n  288 | \t\tvideo_input_free(&video->inputs.array[i]);\n  289 | \tda_free(video->inputs);\n  290 | \n  291 | \tfor (size_t i = 0; i < video->info.cache_size; i++)\n  292 | \t\tvideo_frame_free((struct video_frame *)&video->cache[i]);\n  293 | \n  294 | \tpthread_mutex_unlock(&video->input_mutex);\n  295 | \tos_sem_destroy(video->update_semaphore);\n  296 | \tpthread_mutex_destroy(&video->data_mutex);\n  297 | \tpthread_mutex_destroy(&video->input_mutex);\n  298 | \n  299 | \tbfree(video);\n  300 | }","lines":23,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-io.c#L278-L300"}]},{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `obs-audio-controls.c::volmeter_process_peak`, the loop increments\n`plane_nr` but the termination condition checks `channel_nr < nr_channels`.\nIf `data->data` has a NULL plane in the middle (which is legitimate for sparse\naudio layouts), `plane_nr` advances past the NULL plane but `channel_nr` does\nnot. This means `channel_nr` will eventually consume planes that logically\nbelong to different channel indices, and `plane_nr` can exceed `MAX_AV_PLANES`\nwithout bounds checking, reading `data->data[plane_nr]` out of bounds.\n\n`MAX_AV_PLANES` is 8 (from media-io-defs.h) and `MAX_AUDIO_CHANNELS` is\ntypically 8 as well, but if `nr_channels` (from `get_nr_channels_from_audio_data`)\nis less than the actual non-NULL planes, the loops can desync. Specifically,\n`plane_nr` is never bounded by `MAX_AV_PLANES` in either `volmeter_process_peak`\nor `volmeter_process_magnitude`.","fix":"Add a bounds check on `plane_nr` in both loops:\n\n```c\nfor (int plane_nr = 0; channel_nr < nr_channels && plane_nr < MAX_AV_PLANES; plane_nr++) {\n    float *samples = (float *)data->data[plane_nr];\n    if (!samples)\n        continue;\n    // ...\n    channel_nr++;\n}\n```","locations":[{"ref":"libobs/obs-audio-controls.c:419-454","code":"  419 | \tfor (int plane_nr = 0; channel_nr < nr_channels; plane_nr++) {\n  420 | \t\tfloat *samples = (float *)data->data[plane_nr];\n  421 | \t\tif (!samples) {\n  422 | \t\t\tcontinue;\n  423 | \t\t}\n  424 | \t\tif (((uintptr_t)samples & 0xf) > 0) {\n  425 | \t\t\tprintf(\"Audio plane %i is not aligned %p skipping \"\n  426 | \t\t\t       \"peak volume measurement.\\n\",\n  427 | \t\t\t       plane_nr, samples);\n  428 | \t\t\tvolmeter->peak[channel_nr] = 1.0;\n  429 | \t\t\tchannel_nr++;\n  430 | \t\t\tcontinue;\n  431 | \t\t}\n  432 | \n  433 | \t\t/* volmeter->prev_samples may not be aligned to 16 bytes;\n  434 | \t\t * use unaligned load. */\n  435 | \t\t__m128 previous_samples = _mm_loadu_ps(volmeter->prev_samples[channel_nr]);\n  436 | \n  437 | \t\tfloat peak;\n  438 | \t\tswitch (volmeter->peak_meter_type) {\n  439 | \t\tcase TRUE_PEAK_METER:\n  440 | \t\t\tpeak = get_true_peak(previous_samples, samples, nr_samples);\n  441 | \t\t\tbreak;\n  442 | \n  443 | \t\tcase SAMPLE_PEAK_METER:\n  444 | \t\tdefault:\n  445 | \t\t\tpeak = get_sample_peak(previous_samples, samples, nr_samples);\n  446 | \t\t\tbreak;\n  447 | \t\t}\n  448 | \n  449 | \t\tvolmeter_process_peak_last_samples(volmeter, channel_nr, samples, nr_samples);\n  450 | \n  451 | \t\tvolmeter->peak[channel_nr] = peak;\n  452 | \n  453 | \t\tchannel_nr++;\n  454 | \t}","lines":36,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-audio-controls.c#L419-L454"},{"ref":"libobs/obs-audio-controls.c:466-481","code":"  466 | \tint channel_nr = 0;\n  467 | \tfor (int plane_nr = 0; channel_nr < nr_channels; plane_nr++) {\n  468 | \t\tfloat *samples = (float *)data->data[plane_nr];\n  469 | \t\tif (!samples) {\n  470 | \t\t\tcontinue;\n  471 | \t\t}\n  472 | \n  473 | \t\tfloat sum = 0.0;\n  474 | \t\tfor (size_t i = 0; i < nr_samples; i++) {\n  475 | \t\t\tfloat sample = samples[i];\n  476 | \t\t\tsum += sample * sample;\n  477 | \t\t}\n  478 | \t\tvolmeter->magnitude[channel_nr] = sqrtf(sum / nr_samples);\n  479 | \n  480 | \t\tchannel_nr++;\n  481 | \t}","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-audio-controls.c#L466-L481"}]},{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`obs-avc.c::get_sps_high_params` parses Exp-Golomb coded values from the SPS\nusing `get_ue_golomb`, which returns `uint8_t`. However, `chroma_format_idc`,\n`bit_depth_luma_minus8`, and `bit_depth_chroma_minus8` can legitimately be\nvalues from 0-3, 0-6, and 0-6 respectively according to the H.264 spec, and\nthese are stored in `uint8_t` output parameters, so the type is fine.\n\nThe real issue: `get_ue_golomb` reads up to 32 leading zero bits, then reads\n`i` more bits, and returns `bitstream_reader_read_bits(gb, i) + (1 << i) - 1`.\nIf i=0, this returns `bitstream_reader_read_bits(gb, 0) + 0 = 0`, which is\ncorrect. If i=32, `1 << 32` is undefined behavior for 32-bit int (shift by\nwidth). The function caps `i` at 32 via `i < 32`, but if i reaches 32 the\nexpression `(1 << i)` with i=32 is still UB. In practice SPS values for AVC\nare much smaller, but the UB exists.\n\nAdditionally, `get_sps_high_params` skips profile/constraints/level (3 bytes),\nthen skips seq_parameter_set_id (Golomb), then reads chroma_format_idc. However\nit does NOT skip `separate_colour_plane_flag` if `chroma_format_idc == 3`\nBEFORE reading bit_depth_luma_minus8. The code reads:\n  1. profile+constraints+level (24 bits)\n  2. seq_parameter_set_id (Golomb) - labeled \"id\"\n  3. chroma_format_idc (Golomb)\n  4. if chroma_format_idc==3: skip 1 bit (separate_colour_plane_flag)\n  5. bit_depth_luma = get_ue_golomb()  -- reads bit_depth_luma_minus8\n  6. bit_depth_chroma = get_ue_golomb() -- reads bit_depth_chroma_minus8\n\nThis matches the SPS high profile syntax exactly, so it is correct. But note\nthat the SPS RBSP starts with `forbidden_zero_bit` (1 bit), `nal_ref_idc` (2\nbits), and `nal_unit_type` (5 bits) as part of the NAL unit header BEFORE the\nRBSP. The caller passes `sps + 1` to skip the NAL header byte, which is correct\nsince the NAL header is 1 byte.\n\nThe actual bug: `bitstream_reader_read_bits(gb, i)` where `i==0` returns 0\nand does not advance the bitstream, so the leading-zero count for i=0 is\ncorrect (value = 0+1-1 = 0). This is fine. But `1 << 32` when i==32 is UB.","fix":"Guard against i==32 to avoid the UB shift:\n\n```c\nstatic inline uint8_t get_ue_golomb(struct bitstream_reader *gb)\n{\n    int i = 0;\n    while (i < 31 && !bitstream_reader_read_bits(gb, 1))\n        i++;\n\n    return (uint8_t)(bitstream_reader_read_bits(gb, i) + (1 << i) - 1);\n}\n```\nCapping at 31 keeps the maximum return value at 2^31 - 1, still well above\nany valid AVC SPS Exp-Golomb value, and avoids the UB shift.","locations":[{"ref":"libobs/obs-avc.c:167-173","code":"  167 | static inline uint8_t get_ue_golomb(struct bitstream_reader *gb)\n  168 | {\n  169 | \tint i = 0;\n  170 | \twhile (i < 32 && !bitstream_reader_read_bits(gb, 1))\n  171 | \t\ti++;\n  172 | \n  173 | \treturn bitstream_reader_read_bits(gb, i) + (1 << i) - 1;","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-avc.c#L167-L173"}]},{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `obs-cocoa.m::hotkeys_release`, the refcount starts at 0 (bzalloc\nzero-initializes), and `hotkeys_retain` increments it with `os_atomic_inc_long`.\nThe first `hotkeys_retain` call in `obs_hotkeys_platform_init` is implicit\n(there is none - the platform is just stored without retaining). The `refs`\nfield is 0 after allocation. `hotkeys_release` frees when `refs` drops to -1\n(`os_atomic_dec_long == -1`). This means the initial state has `refs == 0`\nand the object is freed after the first release without a matching retain.\n\nIn `obs_hotkeys_platform_init`: `platform` is allocated (refs=0), stored in\n`hotkeys->platform_context`, and then `currentPlatform` (the old one) is\nreleased. If `currentPlatform` was also at refs=0, releasing it immediately\nfrees it. The new `platform` is also at refs=0. The function `hotkeys_retain`\nis called in `obs_key_to_str` to temporarily bump the refcount before use, and\n`hotkeys_release` is called to drop it. This means:\n- After init: refs=0 (one implicit owner: hotkeys->platform_context)\n- During `obs_key_to_str`: refs bumped to 1, then decremented back to 0\n- When `InputMethodChangedProc` replaces the platform: old platform released\n  (0 -> -1 => freed). This is the expected one-time release for the \"owned\"\n  reference.\n\nSo the convention is: refs=0 means \"owned by one implicit holder\", and -1 is\nthe destroy threshold. This is an unusual but internally consistent design.\nHowever, there is a race: between `hotkeys->platform_context = platform` (where\nrefs=0) and a concurrent `obs_key_to_str` call that reads\n`hotkeys->platform_context` under the mutex, retains it (refs=1), then releases\nit (refs=0). Then `InputMethodChangedProc` runs and releases (refs=-1 -> freed).\nBut `obs_key_to_str` already released back to 0 - `InputMethodChangedProc`\nsees 0 and decrements to -1 AFTER `obs_key_to_str` already decremented to 0.\nThis double-free is a real race condition.\n\nThe retain/release protocol should use 1 as the initial refcount (owned\nreference) and free at 0.","fix":"Initialize `refs` to 1 to represent the initial owner reference, and free when\n`refs` reaches 0:\n\n```objc\nstatic void hotkeys_retain(obs_hotkeys_platform_t *platform)\n{\n    os_atomic_inc_long(&platform->refs);\n}\n\nstatic void hotkeys_release(obs_hotkeys_platform_t *platform)\n{\n    if (os_atomic_dec_long(&platform->refs) == 0) {\n        // ... free resources and bfree(platform)\n    }\n}\n```\n\nAnd in `obs_hotkeys_platform_init`, after `platform = bzalloc(...)`, set\n`platform->refs = 1` to represent the owner reference held by\n`hotkeys->platform_context`.","locations":[{"ref":"libobs/obs-cocoa.m:440-466","code":"  440 | static void hotkeys_retain(obs_hotkeys_platform_t *platform)\n  441 | {\n  442 |     os_atomic_inc_long(&platform->refs);\n  443 | }\n  444 | \n  445 | static void hotkeys_release(obs_hotkeys_platform_t *platform)\n  446 | {\n  447 |     if (os_atomic_dec_long(&platform->refs) == -1) {\n  448 |         if (platform->tis) {\n  449 |             CFRelease(platform->tis);\n  450 |             platform->tis = NULL;\n  451 |         }\n  452 | \n  453 |         if (platform->layout_data) {\n  454 |             CFRelease(platform->layout_data);\n  455 |             platform->layout_data = NULL;\n  456 |         }\n  457 | \n  458 |         if (platform->eventTap) {\n  459 |             CGEventTapEnable(platform->eventTap, false);\n  460 |             CFRelease(platform->eventTap);\n  461 |             platform->eventTap = NULL;\n  462 |         }\n  463 | \n  464 |         bfree(platform);\n  465 |     }\n  466 | }","lines":27,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-cocoa.m#L440-L466"},{"ref":"libobs/obs-cocoa.m:587-657","code":"  587 | bool obs_hotkeys_platform_init(struct obs_core_hotkeys *hotkeys)\n  588 | {\n  589 |     CFNotificationCenterAddObserver(CFNotificationCenterGetDistributedCenter(), hotkeys, InputMethodChangedProc,\n  590 |                                     kTISNotifySelectedKeyboardInputSourceChanged, NULL,\n  591 |                                     CFNotificationSuspensionBehaviorDeliverImmediately);\n  592 | \n  593 |     obs_hotkeys_platform_t *platform = bzalloc(sizeof(obs_hotkeys_platform_t));\n  594 | \n  595 |     const bool has_event_access = CGPreflightListenEventAccess();\n  596 |     if (has_event_access) {\n  597 |         platform->eventTap = CGEventTapCreate(kCGHIDEventTap, kCGHeadInsertEventTap, kCGEventTapOptionListenOnly,\n  598 |                                               CGEventMaskBit(kCGEventKeyDown) | CGEventMaskBit(kCGEventKeyUp) |\n  599 |                                                   CGEventMaskBit(kCGEventFlagsChanged),\n  600 |                                               KeyboardEventProc, platform);\n  601 |         if (!platform->eventTap) {\n  602 |             blog(LOG_WARNING, \"[hotkeys-cocoa]: Couldn't create hotkey event tap.\");\n  603 |             hotkeys_release(platform);\n  604 |             platform = NULL;\n  605 |             return false;\n  606 |         }\n  607 |         CFRunLoopSourceRef source = CFMachPortCreateRunLoopSource(kCFAllocatorDefault, platform->eventTap, 0);\n  608 |         CFRunLoopAddSource(CFRunLoopGetCurrent(), source, kCFRunLoopCommonModes);\n  609 |         CFRelease(source);\n  610 | \n  611 |         CGEventTapEnable(platform->eventTap, true);\n  612 |     } else {\n  613 |         blog(LOG_WARNING, \"[hotkeys-cocoa]: No event permissions, could not add global hotkeys.\");\n  614 |     }\n  615 | \n  616 |     platform->tis = TISCopyCurrentKeyboardLayoutInputSource();\n  617 |     platform->layout_data = (CFDataRef) TISGetInputSourceProperty(platform->tis, kTISPropertyUnicodeKeyLayoutData);\n  618 | \n  619 |     if (!platform->layout_data) {\n  620 |         blog(LOG_ERROR, \"hotkeys-cocoa: Failed to retrieve keyboard layout data\");\n  621 |         hotkeys_release(platform);\n  622 |         platform = NULL;\n  623 |         return false;\n  624 |     }\n  625 | \n  626 |     CFRetain(platform->layout_data);\n  627 |     platform->layout = (UCKeyboardLayout *) CFDataGetBytePtr(platform->layout_data);\n  628 | \n  629 |     obs_hotkeys_platform_t *currentPlatform;\n  630 | \n  631 |     pthread_mutex_lock(&hotkeys->mutex);\n  632 | \n  633 |     currentPlatform = hotkeys->platform_context;\n  634 | \n  635 |     if (platform && currentPlatform && platform->layout_data == currentPlatform->layout_data) {\n  636 |         pthread_mutex_unlock(&hotkeys->mutex);\n  637 |         hotkeys_release(platform);\n  638 |         return true;\n  639 |     }\n  640 | \n  641 |     hotkeys->platform_context = platform;\n  642 | \n  643 |     log_layout_name(platform->tis);\n  644 | \n  645 |     pthread_mutex_unlock(&hotkeys->mutex);\n  646 | \n  647 |     calldata_t parameters = {0};\n  648 |     signal_handler_signal(hotkeys->signals, \"hotkey_layout_change\", &parameters);\n  649 | \n  650 |     if (currentPlatform) {\n  651 |         hotkeys_release(currentPlatform);\n  652 |     }\n  653 | \n  654 |     bool hasPlatformContext = hotkeys->platform_context != NULL;\n  655 | \n  656 |     return hasPlatformContext;\n  657 | }","lines":71,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-cocoa.m#L587-L657"}]},{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `obs-cocoa.m::obs_hotkeys_platform_is_pressed`, the mouse button check uses\n`int button = key - 1`. `OBS_KEY_MOUSE1` has a numeric value (typically 212 or\nsimilar based on the OBS key enum), so `key - OBS_KEY_MOUSE1` is the correct\nzero-based button index, but the code uses `key - 1` instead. This maps\n`OBS_KEY_MOUSE1` to button `OBS_KEY_MOUSE1 - 1`, which is likely another key's\nnumeric value and is almost certainly not 0. The NSEvent button indices are\n0-based (0=left, 1=right, 2=middle, etc.), so this will read the wrong button\nstate for all mouse button hotkeys.","fix":"Use `OBS_KEY_MOUSE1` as the base:\n\n```objc\nint button = key - OBS_KEY_MOUSE1;\n```","locations":[{"ref":"libobs/obs-cocoa.m:686-710","code":"  686 | bool obs_hotkeys_platform_is_pressed(obs_hotkeys_platform_t *platform, obs_key_t key)\n  687 | {\n  688 |     if (key >= OBS_KEY_MOUSE1 && key <= OBS_KEY_MOUSE29) {\n  689 |         int button = key - 1;\n  690 | \n  691 |         NSUInteger buttons = [NSEvent pressedMouseButtons];\n  692 | \n  693 |         if ((buttons & (1 << button)) != 0) {\n  694 |             return true;\n  695 |         } else {\n  696 |             return false;\n  697 |         }\n  698 |     }\n  699 | \n  700 |     if (!platform) {\n  701 |         return false;\n  702 |     }\n  703 | \n  704 |     if (key >= OBS_KEY_LAST_VALUE) {\n  705 |         return false;\n  706 |     }\n  707 | \n  708 |     return platform->is_key_down[key];\n  709 | }\n  710 | ","lines":25,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-cocoa.m#L686-L710"}]},{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`obs_hotkey_set_name` and `obs_hotkey_set_description` are public exported functions that modify hotkey name/description strings while holding no mutex. The hotkey thread (`obs_hotkey_thread`) acquires `obs->hotkeys.mutex` before calling `query_hotkeys`, which reads `hotkey->name` indirectly via signals. A concurrent call to `obs_hotkey_set_name` can free and reallocate `hotkey->name` while the signal handler is reading it, causing a use-after-free or heap corruption.","fix":"Acquire and release the hotkey mutex around the modification:\n```c\nvoid obs_hotkey_set_name(obs_hotkey_id id, const char *name)\n{\n    if (!lock())\n        return;\n    obs_hotkey_t *hotkey;\n    HASH_FIND_HKEY(obs->hotkeys.hotkeys, id, hotkey);\n    if (hotkey) {\n        bfree(hotkey->name);\n        hotkey->name = bstrdup(name);\n    }\n    unlock();\n}\n```\nApply the same change to `obs_hotkey_set_description`.","locations":[{"ref":"libobs/obs-hotkey.c:91-111","code":"   91 | void obs_hotkey_set_name(obs_hotkey_id id, const char *name)\n   92 | {\n   93 | \tobs_hotkey_t *hotkey;\n   94 | \tHASH_FIND_HKEY(obs->hotkeys.hotkeys, id, hotkey);\n   95 | \tif (!hotkey)\n   96 | \t\treturn;\n   97 | \n   98 | \tbfree(hotkey->name);\n   99 | \thotkey->name = bstrdup(name);\n  100 | }\n  101 | \n  102 | void obs_hotkey_set_description(obs_hotkey_id id, const char *desc)\n  103 | {\n  104 | \tobs_hotkey_t *hotkey;\n  105 | \tHASH_FIND_HKEY(obs->hotkeys.hotkeys, id, hotkey);\n  106 | \tif (!hotkey)\n  107 | \t\treturn;\n  108 | \n  109 | \tbfree(hotkey->description);\n  110 | \thotkey->description = bstrdup(desc);\n  111 | }","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-hotkey.c#L91-L111"}]},{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`platform_keyboard_modifiers` calls `xkb_state_update_mask(plat->xkb_state, ...)` without\nchecking whether `plat->xkb_state` is NULL. `xkb_state` starts as NULL (the struct is\nzero-initialised via `bzalloc`) and is only populated after the first `wl_keyboard.keymap`\nevent. The Wayland protocol does not guarantee that `keymap` always precedes `modifiers`\nacross all compositor implementations; if `modifiers` fires first (e.g. after a seat\nhotplug) `xkb_state_update_mask(NULL, ...)` dereferences NULL and crashes.","fix":"Guard the modifier update:\n\n```c\nif (!plat->xkb_state)\n    return;\nxkb_state_update_mask(plat->xkb_state, mods_depressed, mods_latched,\n                      mods_locked, 0, 0, group);\nif (plat->current_layout != group) {\n    plat->current_layout = group;\n    rebuild_keymap_data(plat);\n}\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:103-115","code":"  103 | static void platform_keyboard_modifiers(void *data, struct wl_keyboard *keyboard, uint32_t serial,\n  104 | \t\t\t\t\tuint32_t mods_depressed, uint32_t mods_latched, uint32_t mods_locked,\n  105 | \t\t\t\t\tuint32_t group)\n  106 | {\n  107 | \tUNUSED_PARAMETER(keyboard);\n  108 | \tUNUSED_PARAMETER(serial);\n  109 | \tobs_hotkeys_platform_t *plat = (obs_hotkeys_platform_t *)data;\n  110 | \txkb_state_update_mask(plat->xkb_state, mods_depressed, mods_latched, mods_locked, 0, 0, group);\n  111 | \n  112 | \tif (plat->current_layout != group) {\n  113 | \t\tplat->current_layout = group;\n  114 | \t\trebuild_keymap_data(plat);\n  115 | \t}","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L103-L115"}]},{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"If the compositor advertises more than one `wl_seat` global (which is uncommon but\npermitted), `platform_registry_handler` is called twice. On the second call,\n`plat->seat` is already non-NULL, but the code unconditionally overwrites it with the new\nbinding without releasing the old `wl_seat` or its associated `wl_keyboard`. This leaks\nthe first seat and keyboard proxies and leaves them registered with the compositor.","fix":"Skip subsequent seats (the common case for simple setups) or release the previous one\nbefore binding the new one. The simplest safe fix is to ignore additional seats:\n\n```c\nif (strcmp(interface, wl_seat_interface.name) == 0) {\n    if (plat->seat != NULL)\n        return; // already have a seat\n    if (version < 4) {\n        blog(LOG_WARNING, \"[wayland] hotkeys disabled, compositor is too old\");\n        return;\n    }\n    plat->seat = wl_registry_bind(registry, id, &wl_seat_interface,\n                                  version <= 7 ? version : 7);\n    wl_seat_add_listener(plat->seat, &seat_listener, plat);\n}\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:199-213","code":"  199 | static void platform_registry_handler(void *data, struct wl_registry *registry, uint32_t id, const char *interface,\n  200 | \t\t\t\t      uint32_t version)\n  201 | {\n  202 | \tobs_hotkeys_platform_t *plat = (obs_hotkeys_platform_t *)data;\n  203 | \n  204 | \tif (strcmp(interface, wl_seat_interface.name) == 0) {\n  205 | \t\tif (version < 4) {\n  206 | \t\t\tblog(LOG_WARNING, \"[wayland] hotkeys disabled, compositor is too old\");\n  207 | \t\t\treturn;\n  208 | \t\t}\n  209 | \t\t// Only negotiate up to version 7, the current wl_seat at time of writing.\n  210 | \t\tplat->seat = wl_registry_bind(registry, id, &wl_seat_interface, version <= 7 ? version : 7);\n  211 | \t\twl_seat_add_listener(plat->seat, &seat_listener, plat);\n  212 | \t}\n  213 | }","lines":15,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L199-L213"}]},{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `check-services.py`, the condition `elif is_ok and server[\"url\"] in fail_timestamps:` (line\n263) redundantly includes `is_ok`. At this point in the code, the `if not is_ok:` branch has\nalready been taken or skipped, so we are in the implicit `else` where `is_ok` is guaranteed to\nbe `True`. The extra `is_ok and` is dead code that misleads readers into thinking `is_ok` could\nbe `False` in the `elif` branch.","fix":"Remove the redundant condition:\n\n```python\nelif server[\"url\"] in fail_timestamps:\n```","locations":[{"ref":".github/scripts/utils.py/check-services.py:263","code":"  263 |             elif is_ok and server[\"url\"] in fail_timestamps:","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/.github/scripts/utils.py/check-services.py#L263"}]},{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `AbsoluteSlider::paintEvent`, the tick-drawing loop iterates\n`for (double offset = minimum(); offset <= maximum(); offset += singleStep())`.\nIf `minimum() == maximum()`, the expression `(maximum() - minimum())` on line 154 evaluates to\n0.0, producing a division-by-zero (resulting in NaN/Inf for `tickPercent`), and then\n`std::floor(sliderLength * NaN)` returns an unspecified value that may produce out-of-bounds\npaint coordinates. Additionally, if `singleStep()` is 0, the loop becomes infinite.","fix":"Add guards before the loop:\n\n```cpp\nint range = maximum() - minimum();\nint step = singleStep();\nif (range <= 0 || step <= 0) {\n    QSlider::paintEvent(event);\n    return;\n}\nfor (double offset = minimum(); offset <= maximum(); offset += step) {\n    double tickPercent = (offset - minimum()) / range;\n    ...\n}\n```","locations":[{"ref":"frontend/components/AbsoluteSlider.cpp:153-163","code":"  153 | \tfor (double offset = minimum(); offset <= maximum(); offset += singleStep()) {\n  154 | \t\tdouble tickPercent = (offset - minimum()) / (maximum() - minimum());\n  155 | \t\tconst int tickLineOffset = grooveStart + std::floor(sliderLength * tickPercent) + (handleSize / 2);\n  156 | \n  157 | \t\tconst int xPos = isHorizontal ? tickLineOffset : tickLineStart;\n  158 | \t\tconst int yPos = isHorizontal ? tickLineStart : tickLineOffset;\n  159 | \n  160 | \t\tconst int tickWidth = isHorizontal ? 1 : tickLength;\n  161 | \t\tconst int tickHeight = isHorizontal ? tickLength : 1;\n  162 | \n  163 | \t\tpainter.fillRect(xPos, yPos, tickWidth, tickHeight, tickColor);","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/AbsoluteSlider.cpp#L153-L163"}]},{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`OBSAdvAudioCtrl::OBSSourceBalanceChanged` declares the local variable as `int balance` (line 311), which shadows the member `BalanceSlider *balance`. While the calculation is correct (it's only used as an `int` value to pass via `invokeMethod`), the shadowing is a maintenance hazard: any future reader or refactoring that moves the calculation could accidentally modify the wrong `balance`.","fix":"Rename the local variable to avoid shadowing:\n\n```cpp\nint balanceVal = (int)((float)calldata_float(calldata, \"balance\") * 100.0f);\nQMetaObject::invokeMethod(..., Q_ARG(int, balanceVal));\n```","locations":[{"ref":"frontend/components/OBSAdvAudioCtrl.cpp:311","code":"  311 | \tint balance = (float)calldata_float(calldata, \"balance\") * 100.0f;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/OBSAdvAudioCtrl.cpp#L311"}]},{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SceneTree::dropEvent` (line 133) and `SceneTree::RepositionGrid` (line 173) access `selectedIndexes()[0]` without verifying that the selection is non-empty. In normal drag-and-drop flow at least one item is selected, but if the selection changes between the drag start and the drop event (e.g. via another thread interaction), the access on an empty list is undefined behaviour.","fix":"Check before indexing:\n\n```cpp\nQModelIndexList sel = selectedIndexes();\nif (sel.isEmpty())\n    return;\nQListWidgetItem *item = takeItem(sel[0].row());\n```","locations":[{"ref":"frontend/components/SceneTree.cpp:133","code":"  133 | \t\tQListWidgetItem *item = takeItem(selectedIndexes()[0].row());","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SceneTree.cpp#L133"},{"ref":"frontend/components/SceneTree.cpp:173","code":"  173 | \t\tint orig = selectedIndexes()[0].row();","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SceneTree.cpp#L173"}]},{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`UIValidation::NoSourcesConfirmation` dereferences `parent` unconditionally at line 38\n(`parent->isVisible()`) without a null guard. The parameter type is `QWidget *` with no\ncontract annotation requiring a non-null value. All current call sites pass `this`, so there\nis no immediate crash, but the function's API is misleading: it looks like `parent` is optional\n(it is passed to `QMessageBox` where null is accepted), yet a null value would crash at line 38.\nA future caller passing null would get an instant null-pointer dereference.","fix":"Either add a null guard before the visibility check:\n```cpp\nif (!parent || !parent->isVisible())\n    return true;\n```\nOr document the non-null precondition explicitly and add a debug assert:\n```cpp\nQ_ASSERT(parent != nullptr);\nif (!parent->isVisible())\n    return true;\n```","locations":[{"ref":"frontend/components/UIValidation.cpp:30-40","code":"   30 | bool UIValidation::NoSourcesConfirmation(QWidget *parent)\n   31 | {\n   32 | \t// There are sources, don't need confirmation\n   33 | \tif (CountVideoSources() != 0) {\n   34 | \t\treturn true;\n   35 | \t}\n   36 | \n   37 | \t// Ignore no video if no parent is visible to alert on\n   38 | \tif (!parent->isVisible()) {\n   39 | \t\treturn true;\n   40 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/UIValidation.cpp#L30-L40"}]},{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`VisibilityItemWidget::SetColor` guards against redundant updates by comparing only `active_`\nand `selected_` to their stored counterparts (line 52). If the actual palette color changes\n(e.g., user switches system theme / dark mode while the selection state stays the same), the\nearly return prevents the label and checkbox palette from being updated with the new color.\nThe comment says \"Do not update unless the state has actually changed\", but the relevant state\nfor the update is the *color*, not just the boolean flags.\n\nOn a theme change, Qt repaints all widgets, which triggers `VisibilityItemDelegate::paint` and\nsubsequently `SetColor` with new palette colors. Because selection flags have not changed, the\nearly return fires and the labels stay with stale colors until the user changes selection.","fix":"Include the color in the staleness check:\n```cpp\nvoid VisibilityItemWidget::SetColor(const QColor &color, bool active_, bool selected_)\n{\n    if (active_ == active && selected_ == selected && color == cachedColor)\n        return;\n\n    QPalette pal = vis->palette();\n    pal.setColor(QPalette::WindowText, color);\n    vis->setPalette(pal);\n    label->setStyleSheet(QString(\"color: %1;\").arg(color.name()));\n\n    active = active_;\n    selected = selected_;\n    cachedColor = color;\n}\n```\nAdd `QColor cachedColor` as a private member in `VisibilityItemWidget.hpp`.","locations":[{"ref":"frontend/components/VisibilityItemWidget.cpp:49-64","code":"   49 | void VisibilityItemWidget::SetColor(const QColor &color, bool active_, bool selected_)\n   50 | {\n   51 | \t/* Do not update unless the state has actually changed */\n   52 | \tif (active_ == active && selected_ == selected) {\n   53 | \t\treturn;\n   54 | \t}\n   55 | \n   56 | \tQPalette pal = vis->palette();\n   57 | \tpal.setColor(QPalette::WindowText, color);\n   58 | \tvis->setPalette(pal);\n   59 | \n   60 | \tlabel->setStyleSheet(QString(\"color: %1;\").arg(color.name()));\n   61 | \n   62 | \tactive = active_;\n   63 | \tselected = selected_;\n   64 | }","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/VisibilityItemWidget.cpp#L49-L64"}]},{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`coreaudio-enum-devices.c` (`enum_audio_devices`): if `AudioObjectGetPropertyDataSize` succeeds but returns `size == 0` (no audio devices present), the code calls `malloc(0)`. The return value of `malloc(0)` is implementation-defined (may return NULL or a unique pointer). If NULL is returned, the subsequent `AudioObjectGetPropertyData` call receives a NULL `ids` buffer, which is undefined behaviour. There is also no NULL check after `malloc`.","fix":"Add a check for `size == 0` before `malloc`, and add a NULL check on the result:\n```c\nif (size == 0)\n    return;\nids = malloc(size);\nif (!ids)\n    return;\n```","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-enum-devices.c:75-90","code":"   75 | \tstat = AudioObjectGetPropertyDataSize(kAudioObjectSystemObject, &addr, 0, NULL, &size);\n   76 | \tif (!success(stat, \"get data size\"))\n   77 | \t\treturn;\n   78 | \n   79 | \tids = malloc(size);\n   80 | \tcount = size / sizeof(AudioDeviceID);\n   81 | \n   82 | \tstat = AudioObjectGetPropertyData(kAudioObjectSystemObject, &addr, 0, NULL, &size, ids);\n   83 | \tif (success(stat, \"get data\")) {\n   84 | \t\tfor (UInt32 i = 0; i < count; i++) {\n   85 | \t\t\tif (!obs_enum_audio_monitoring_device(cb, data, ids[i], allow_inputs))\n   86 | \t\t\t\tbreak;\n   87 | \t\t}\n   88 | \t}\n   89 | \n   90 | \tfree(ids);","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/osx/coreaudio-enum-devices.c#L75-L90"}]},{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`coreaudio-enum-devices.c` (`devices_match`): when both `id1` and `id2` are `\"default\"`, `get_default_id` is called twice (lines 155-161) but reuses `default_id`. The second call to `get_default_id` will see `*p_id != NULL` from the first call (line 112-113 of that function) and return early, so `id2` will correctly point to the same string as `id1`. However, the comparison then proceeds through `enum_audio_devices` to look up names by UID for both sides, resulting in two full device enumeration passes when a simple `strcmp(id1, id2)` on the already-resolved strings would suffice.\n\nMore importantly, if `id1 == \"default\"` and `id2 != \"default\"`, `default_id` holds the resolved id for id1 but `id1` is set to point into `default_id`. If `id2 == \"default\"` after the first branch, the second `get_default_id` would be a no-op (because `default_id` already set), so `id2` = `default_id` = `id1`. This is correct but fragile.","fix":"After resolving both IDs, short-circuit the name lookup if both resolved IDs are equal:\n```c\nif (strcmp(id1, id2) == 0) {\n    match = true;\n    goto cleanup;\n}\n```","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-enum-devices.c:143-178","code":"  143 | bool devices_match(const char *id1, const char *id2)\n  144 | {\n  145 | \tstruct device_name_info info = {0};\n  146 | \tchar *default_id = NULL;\n  147 | \tchar *name1 = NULL;\n  148 | \tchar *name2 = NULL;\n  149 | \tbool match;\n  150 | \n  151 | \tif (!id1 || !id2)\n  152 | \t\treturn false;\n  153 | \n  154 | \tif (strcmp(id1, \"default\") == 0) {\n  155 | \t\tget_default_id(&default_id);\n  156 | \t\tid1 = default_id;\n  157 | \t}\n  158 | \tif (strcmp(id2, \"default\") == 0) {\n  159 | \t\tget_default_id(&default_id);\n  160 | \t\tid2 = default_id;\n  161 | \t}\n  162 | \n  163 | \tinfo.id = id1;\n  164 | \tenum_audio_devices(enum_device_name, &info, true);\n  165 | \tname1 = info.name;\n  166 | \n  167 | \tinfo.name = NULL;\n  168 | \tinfo.id = id2;\n  169 | \tenum_audio_devices(enum_device_name, &info, true);\n  170 | \tname2 = info.name;\n  171 | \n  172 | \tmatch = name1 && name2 && strcmp(name1, name2) == 0;\n  173 | \tbfree(default_id);\n  174 | \tbfree(name1);\n  175 | \tbfree(name2);\n  176 | \n  177 | \treturn match;\n  178 | }","lines":36,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/osx/coreaudio-enum-devices.c#L143-L178"}]},{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`coreaudio-output.c` (`audio_monitor_init`): the error message passed to `success()` on line 186 when `AudioQueueNewOutput` fails is `\"AudioStreamBasicDescription\"` - which is the name of the struct passed as the first argument, not the name of the function being called. The message should be `\"AudioQueueNewOutput\"`.","fix":"Change the string literal on line 186:\n```c\nstat = AudioQueueNewOutput(&desc, buffer_audio, monitor, NULL, NULL, 0, &monitor->queue);\nif (!success(stat, \"AudioQueueNewOutput\")) {\n    return false;\n}\n```","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-output.c:185-188","code":"  185 | \tstat = AudioQueueNewOutput(&desc, buffer_audio, monitor, NULL, NULL, 0, &monitor->queue);\n  186 | \tif (!success(stat, \"AudioStreamBasicDescription\")) {\n  187 | \t\treturn false;\n  188 | \t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/osx/coreaudio-output.c#L185-L188"}]},{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`pulseaudio-output.c` (`pulseaudio_sink_info`): the log format at line 311-313 uses `%c` to print `i->sample_spec.channels` (a `uint8_t`) and `channels` (also `uint8_t`). `%c` formats a value as a character, not an integer, so channel count 2 would print as a non-printable STX character. The format should be `%d` or `%u`.","fix":"Replace `%c` with `%u` in both `blog` calls at lines 311-313:\n```c\nblog(LOG_INFO,\n     \"%u channels not supported by OBS,\"\n     \"using %u instead for recording\",\n     i->sample_spec.channels, channels);\n```","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-output.c:310-314","code":"  310 | \t\tblog(LOG_INFO,\n  311 | \t\t     \"%c channels not supported by OBS,\"\n  312 | \t\t     \"using %c instead for recording\",\n  313 | \t\t     i->sample_spec.channels, channels);\n  314 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/pulse/pulseaudio-output.c#L310-L314"}]},{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`signal.c` (`signal_handler_connect_internal`): the handler's `mutex` is used to find the signal (lines 201-203), then released before the signal's own `mutex` is acquired (line 215). Between those two lock/unlock operations, nothing prevents the signal from being removed from the handler's linked list by another thread calling `signal_handler_destroy` or a future `signal_handler_remove` API. The signal pointer `sig` would then become dangling when `sig->mutex` is locked. Currently there is no `signal_handler_remove_signal` public API, so the only way a signal goes away is when the handler is fully destroyed, and `signal_handler_destroy` uses reference counting that prevents premature destruction when `connect_ref` is used. For `signal_handler_connect` (no ref), the handler can be destroyed with signals connected, which is a caller error. This is a latent race but not exploitable with the current API surface.","fix":"Document that `signal_handler_connect` must not race with `signal_handler_destroy` without external synchronisation, or hold `handler->mutex` across the signal's callback list modification (requires making `handler->mutex` recursive or restructuring the locking).","locations":[{"ref":"libobs/callback/signal.c:191-225","code":"  191 | static void signal_handler_connect_internal(signal_handler_t *handler, const char *signal, signal_callback_t callback,\n  192 | \t\t\t\t\t    void *data, bool keep_ref)\n  193 | {\n  194 | \tstruct signal_info *sig, *last;\n  195 | \tstruct signal_callback cb_data = {callback, data, false, keep_ref};\n  196 | \tsize_t idx;\n  197 | \n  198 | \tif (!handler)\n  199 | \t\treturn;\n  200 | \n  201 | \tpthread_mutex_lock(&handler->mutex);\n  202 | \tsig = getsignal(handler, signal, &last);\n  203 | \tpthread_mutex_unlock(&handler->mutex);\n  204 | \n  205 | \tif (!sig) {\n  206 | \t\tblog(LOG_WARNING,\n  207 | \t\t     \"signal_handler_connect: \"\n  208 | \t\t     \"signal '%s' not found\",\n  209 | \t\t     signal);\n  210 | \t\treturn;\n  211 | \t}\n  212 | \n  213 | \t/* -------------- */\n  214 | \n  215 | \tpthread_mutex_lock(&sig->mutex);\n  216 | \n  217 | \tif (keep_ref)\n  218 | \t\tos_atomic_inc_long(&handler->refs);\n  219 | \n  220 | \tidx = signal_get_callback_idx(sig, callback, data);\n  221 | \tif (keep_ref || idx == DARRAY_INVALID)\n  222 | \t\tda_push_back(sig->callbacks, &cb_data);\n  223 | \n  224 | \tpthread_mutex_unlock(&sig->mutex);\n  225 | }","lines":35,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/callback/signal.c#L191-L225"}]},{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`signal.c` (`signal_handler_signal`): the reference count decrement for `keep_ref` callbacks is done non-atomically:\n```c\nos_atomic_set_long(&handler->refs, os_atomic_load_long(&handler->refs) - remove_refs);\n```\nThis is a read-modify-write that is not atomic. If another thread concurrently increments `refs` between the load and the set, that increment is lost, potentially causing the handler to be destroyed while still in use.","fix":"Replace the non-atomic RMW with a loop using `os_atomic_compare_exchange_long`, or (simpler) use a loop of `os_atomic_dec_long` once per removed ref:\n```c\nfor (long i = 0; i < remove_refs; i++) {\n    if (os_atomic_dec_long(&handler->refs) == 0) {\n        signal_handler_actually_destroy(handler);\n        return;\n    }\n}\n```","locations":[{"ref":"libobs/callback/signal.c:348-350","code":"  348 | \tif (remove_refs) {\n  349 | \t\tos_atomic_set_long(&handler->refs, os_atomic_load_long(&handler->refs) - remove_refs);\n  350 | \t}","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/callback/signal.c#L348-L350"}]},{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ep_parse_param_assign_bool` (`effect-parser.c`, lines 985-1003): when neither `\"true\"` nor `\"false\"` is matched, the function calls `cf_adderror_expecting` and then returns `PARSE_EOF`. Returning `PARSE_EOF` on a syntax error (not an end-of-file condition) will cause the caller (`ep_parse_param_assignment_val` -> `ep_parse_param_assign`) to bail out as if the file ended unexpectedly, rather than as a recoverable parse error (`PARSE_CONTINUE`). This can cause the entire effect to fail to load rather than just skipping the bad parameter.","fix":"Return `PARSE_CONTINUE` instead of `PARSE_EOF` to allow parsing to continue after an invalid bool literal:\n```c\ncf_adderror_expecting(&ep->cfp, \"true or false\");\nreturn PARSE_CONTINUE;\n```","locations":[{"ref":"libobs/graphics/effect-parser.c:1000-1002","code":" 1000 | \tcf_adderror_expecting(&ep->cfp, \"true or false\");\n 1001 | \n 1002 | \treturn PARSE_EOF;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/effect-parser.c#L1000-L1002"}]},{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ep_param_init` in `effect-parser.h` sets `epp->writeorder = false` (line 86), but `writeorder` is declared as `int`. Assigning `false` (which equals 0) works, but the intent is clearly an integer ordering value, not a boolean. The field type and the initial value are mismatched in documentation intent.","fix":"Change the initialisation to `epp->writeorder = 0;` to match the declared `int` type and make intent clear.","locations":[{"ref":"libobs/graphics/effect-parser.h:86","code":"   86 | \tepp->writeorder = false;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/effect-parser.h#L86"}]},{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The decoding loop in `ffmpeg_image_decode` can spin indefinitely. When\n`avcodec_send_packet` returns `AVERROR(EAGAIN)` (decoder buffer full) the code sets `ret = 0`\nand loops back. For image decoding there is only one packet, so if the decoder keeps returning\n`EAGAIN` from `avcodec_receive_frame` (e.g. a codec that needs multiple calls to drain), the loop\nwill never make progress. In practice image codecs rarely do this, but it is undefined by the API\ncontract and the loop has no iteration limit.","fix":"Add an iteration guard or break on `AVERROR(EAGAIN)` from `avcodec_receive_frame`\nwhen no new packet is available to send:\n\n```c\nwhile (!got_frame) {\n    ret = avcodec_send_packet(info->decoder_ctx, &packet);\n    if (ret == 0 || ret == AVERROR(EAGAIN))\n        ret = avcodec_receive_frame(info->decoder_ctx, frame);\n\n    got_frame = (ret == 0);\n\n    if (ret == AVERROR_EOF || ret == AVERROR(EAGAIN))\n        break;  /* no more output available */\n\n    if (ret < 0) {\n        blog(LOG_WARNING, \"Failed to decode frame for '%s': %s\",\n             info->file, av_err2str(ret));\n        goto fail;\n    }\n}\n```","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:522-537","code":"  522 | \n  523 | \twhile (!got_frame) {\n  524 | \t\tret = avcodec_send_packet(info->decoder_ctx, &packet);\n  525 | \t\tif (ret == 0)\n  526 | \t\t\tret = avcodec_receive_frame(info->decoder_ctx, frame);\n  527 | \n  528 | \t\tgot_frame = (ret == 0);\n  529 | \n  530 | \t\tif (ret == AVERROR_EOF || ret == AVERROR(EAGAIN))\n  531 | \t\t\tret = 0;\n  532 | \n  533 | \t\tif (ret < 0) {\n  534 | \t\t\tblog(LOG_WARNING, \"Failed to decode frame for '%s': %s\", info->file, av_err2str(ret));\n  535 | \t\t\tgoto fail;\n  536 | \t\t}\n  537 | \t}","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/graphics-ffmpeg.c#L522-L537"}]},{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`plane_tri_inside` and `plane_line_inside` in plane.c are declared as returning `bool` but actually return the `int sides` bitmask (values 0, 1, 2, 3). This is technically defined behaviour in C because any non-zero integer converts to `true`, but it means callers cannot distinguish \"all in front\" from \"straddles the plane\", limiting the usefulness of the functions.","fix":"Either change the return type to `int` and update the header declarations, or change the semantics to return a proper boolean (`sides != 0` or a defined constant). The header `plane.h` (lines 61 and 64) also declares `bool` return type and must be kept in sync.","locations":[{"ref":"libobs/graphics/plane.c:104-150","code":"  104 | bool plane_tri_inside(const struct plane *p, const struct vec3 *v1, const struct vec3 *v2, const struct vec3 *v3,\n  105 | \t\t      float precision)\n  106 | {\n  107 | \t/* bit 1: part or all is behind the plane      */\n  108 | \t/* bit 2: part or all is in front of the plane */\n  109 | \tint sides = 0;\n  110 | \tfloat d1 = vec3_plane_dist(v1, p);\n  111 | \tfloat d2 = vec3_plane_dist(v2, p);\n  112 | \tfloat d3 = vec3_plane_dist(v3, p);\n  113 | \n  114 | \tif (d1 >= precision)\n  115 | \t\tsides = 2;\n  116 | \telse if (d1 <= -precision)\n  117 | \t\tsides = 1;\n  118 | \n  119 | \tif (d2 >= precision)\n  120 | \t\tsides |= 2;\n  121 | \telse if (d2 <= -precision)\n  122 | \t\tsides |= 1;\n  123 | \n  124 | \tif (d3 >= precision)\n  125 | \t\tsides |= 2;\n  126 | \telse if (d3 <= -precision)\n  127 | \t\tsides |= 1;\n  128 | \n  129 | \treturn sides;\n  130 | }\n  131 | \n  132 | bool plane_line_inside(const struct plane *p, const struct vec3 *v1, const struct vec3 *v2, float precision)\n  133 | {\n  134 | \t/* bit 1: part or all is behind the plane      */\n  135 | \t/* bit 2: part or all is in front of the plane */\n  136 | \tint sides = 0;\n  137 | \tfloat d1 = vec3_plane_dist(v1, p);\n  138 | \tfloat d2 = vec3_plane_dist(v2, p);\n  139 | \n  140 | \tif (d1 >= precision)\n  141 | \t\tsides = 2;\n  142 | \telse if (d1 <= -precision)\n  143 | \t\tsides = 1;\n  144 | \n  145 | \tif (d2 >= precision)\n  146 | \t\tsides |= 2;\n  147 | \telse if (d2 <= -precision)\n  148 | \t\tsides |= 1;\n  149 | \n  150 | \treturn sides;","lines":47,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/plane.c#L104-L150"}]},{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `sp_parse_param_assign_intfloat` function (shader-parser.c lines 528-532), integer default values are stored with `da_push_back_array(param->default_val, (uint8_t *)&l, sizeof(long))`. `sizeof(long)` is 4 bytes on Windows but 8 bytes on LP64 Linux/macOS. Downstream consumers that expect 4-byte int defaults will read garbage on 64-bit non-Windows platforms.","fix":"Use a fixed-width type:\n```c\nint32_t val = (int32_t)strtol(sp->cfp.cur_token->str.array, NULL, 10);\nif (is_negative)\n    val = -val;\nda_push_back_array(param->default_val, (uint8_t *)&val, sizeof(int32_t));\n```","locations":[{"ref":"libobs/graphics/shader-parser.c:528-532","code":"  528 | \t} else {\n  529 | \t\tlong l = strtol(sp->cfp.cur_token->str.array, NULL, 10);\n  530 | \t\tif (is_negative)\n  531 | \t\t\tl = -l;\n  532 | \t\tda_push_back_array(param->default_val, (uint8_t *)&l, sizeof(long));","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/shader-parser.c#L528-L532"}]},{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`gs_float_to_u8` in srgb.h adds 0.5 for rounding before truncating, but does not clamp `f` to [0, 1] first. If `f` is negative the cast wraps (UB in C for values outside 0-255 range of `uint8_t`), and if `f > 1` the addition can push `f * 255 + 0.5` above 255, also yielding UB or a truncated wrong value.","fix":"Clamp before casting:\n```c\nstatic inline uint8_t gs_float_to_u8(float f)\n{\n    f = f < 0.0f ? 0.0f : (f > 1.0f ? 1.0f : f);\n    return (uint8_t)(f * 255.0f + 0.5f);\n}\n```","locations":[{"ref":"libobs/graphics/srgb.h:50-53","code":"   50 | static inline uint8_t gs_float_to_u8(float f)\n   51 | {\n   52 | \treturn (uint8_t)(f * 255.0f + 0.5f);\n   53 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/srgb.h#L50-L53"}]},{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`gs_texrender_get_format` in texture-render.c (line 149) does not guard against a NULL `texrender` pointer, unlike all other accessors in the same file which return a safe default when `texrender` is NULL. A NULL dereference here will crash.","fix":"Add a NULL guard:\n```c\nenum gs_color_format gs_texrender_get_format(const gs_texrender_t *texrender)\n{\n    return texrender ? texrender->format : GS_UNKNOWN;\n}\n```","locations":[{"ref":"libobs/graphics/texture-render.c:148-151","code":"  148 | enum gs_color_format gs_texrender_get_format(const gs_texrender_t *texrender)\n  149 | {\n  150 | \treturn texrender->format;\n  151 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/texture-render.c#L148-L151"}]},{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`decompress_420` in format-conversion.c (line 176) does not use `min_uint32` to clamp `width_d2` or the output stride, unlike `decompress_nv12` which does on line 213. If `in_linesize[0]` exceeds `out_linesize`, the inner loop will write past the end of each output scanline row.","fix":"Apply the same clamping used in `decompress_nv12`:\n```c\nuint32_t width_d2 = min_uint32(in_linesize[0], out_linesize) / 2;\n```","locations":[{"ref":"libobs/media-io/format-conversion.c:176-207","code":"  176 | void decompress_420(const uint8_t *const input[], const uint32_t in_linesize[], uint32_t start_y, uint32_t end_y,\n  177 | \t\t    uint8_t *output, uint32_t out_linesize)\n  178 | {\n  179 | \tuint32_t start_y_d2 = start_y / 2;\n  180 | \tuint32_t width_d2 = in_linesize[0] / 2;\n  181 | \tuint32_t height_d2 = end_y / 2;\n  182 | \tuint32_t y;\n  183 | \n  184 | \tfor (y = start_y_d2; y < height_d2; y++) {\n  185 | \t\tconst uint8_t *chroma0 = input[1] + y * in_linesize[1];\n  186 | \t\tconst uint8_t *chroma1 = input[2] + y * in_linesize[2];\n  187 | \t\tregister const uint8_t *lum0, *lum1;\n  188 | \t\tregister uint32_t *output0, *output1;\n  189 | \t\tuint32_t x;\n  190 | \n  191 | \t\tlum0 = input[0] + y * 2 * in_linesize[0];\n  192 | \t\tlum1 = lum0 + in_linesize[0];\n  193 | \t\toutput0 = (uint32_t *)(output + y * 2 * out_linesize);\n  194 | \t\toutput1 = (uint32_t *)((uint8_t *)output0 + out_linesize);\n  195 | \n  196 | \t\tfor (x = 0; x < width_d2; x++) {\n  197 | \t\t\tuint32_t out;\n  198 | \t\t\tout = (*(chroma0++) << 8) | *(chroma1++);\n  199 | \n  200 | \t\t\t*(output0++) = (*(lum0++) << 16) | out;\n  201 | \t\t\t*(output0++) = (*(lum0++) << 16) | out;\n  202 | \n  203 | \t\t\t*(output1++) = (*(lum1++) << 16) | out;\n  204 | \t\t\t*(output1++) = (*(lum1++) << 16) | out;\n  205 | \t\t}\n  206 | \t}\n  207 | }","lines":32,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/format-conversion.c#L176-L207"}]},{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`media_frames_per_second_to_frame_interval` and `media_frames_per_second_to_fps` in frame-rate.h (lines 12-20) perform integer division without guarding against a zero denominator or numerator respectively. Calling either function with a zero denominator/numerator causes a floating-point divide-by-zero, producing infinity or NaN that then silently propagates into frame scheduling.","fix":"Add the same guard already used by `media_frames_per_second_is_valid`:\n```c\nstatic inline double media_frames_per_second_to_fps(struct media_frames_per_second fps)\n{\n    if (!fps.denominator)\n        return 0.0;\n    return (double)fps.numerator / fps.denominator;\n}\n```","locations":[{"ref":"libobs/media-io/frame-rate.h:12-20","code":"   12 | static inline double media_frames_per_second_to_frame_interval(struct media_frames_per_second fps)\n   13 | {\n   14 | \treturn (double)fps.denominator / fps.numerator;\n   15 | }\n   16 | \n   17 | static inline double media_frames_per_second_to_fps(struct media_frames_per_second fps)\n   18 | {\n   19 | \treturn (double)fps.numerator / fps.denominator;\n   20 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/frame-rate.h#L12-L20"}]},{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `video-frame.c`, the `VIDEO_FORMAT_I210` and `VIDEO_FORMAT_I010` cases in\n`video_frame_get_linesizes` both set `linesize[0] = width * 2` (10-bit luma\nstored as 2 bytes per pixel). This is correct for `I010` (4:2:0, 10-bit).\nHowever, for `I210` (4:2:2, 10-bit), the comment says \"three planes: double\nwidth, full width, full width\", yet the chroma planes are set to `width` (not\n`HALF(width)`). For 4:2:2 the chroma planes have the same height as luma but\nhalf the horizontal resolution, so the linesize should be `width` bytes for\n8-bit or `width * 2 / 2 = width` bytes for 10-bit (since horizontal chroma\nresolution is halved). This is actually correct for `I210`: each chroma sample\nis 2 bytes, and there are width/2 chroma samples per row, giving `width` bytes\nper chroma line. The comment is accurate. No bug here.\n\nSeparately, `VIDEO_FORMAT_I010` is 4:2:0 (planar YUV 4:2:0 10-bit). For I010:\nluma linesize = `width * 2` (correct), chroma linesizes = `width` (which is\n`HALF(width) * 2` for even widths - the two factors cancel for even widths but\nnot for odd widths). For an odd width, e.g. width=3: `HALF(3) = 2` chroma\nsamples per row, linesize should be `2 * 2 = 4` bytes, but the code gives\n`width = 3` bytes. This is a linesize underestimate for odd-width I010, leading\nto chroma plane overlap or data truncation.","fix":"For `I010`, chroma linesizes should account for the halved horizontal resolution:\n\n```c\ncase VIDEO_FORMAT_I010:\n    linesize[0] = width * 2;\n    linesize[1] = HALF(width) * 2;\n    linesize[2] = HALF(width) * 2;\n    break;\n```","locations":[{"ref":"libobs/media-io/video-frame.c:60-65","code":"   60 | \tcase VIDEO_FORMAT_I210: /* three planes: double width, full width, full width */\n   61 | \tcase VIDEO_FORMAT_I010:\n   62 | \t\tlinesize[0] = width * 2;\n   63 | \t\tlinesize[1] = width;\n   64 | \t\tlinesize[2] = width;\n   65 | \t\tbreak;","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-frame.c#L60-L65"}]},{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`video-matrices.c::video_format_get_parameters_for_bpc` is not thread-safe.\nThe global `matrices_initialized` flag and the `bpp_info`/`format_info` arrays\nare written in `initialize_matrices` without any synchronization. If two threads\ncall `video_format_get_parameters` simultaneously before initialization, both\nsee `matrices_initialized == false`, both call `initialize_matrices`, and both\nwrite the same data concurrently - a data race. In practice OBS initializes the\nvideo system on
