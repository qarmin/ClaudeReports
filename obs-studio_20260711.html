ased by \"%s\") does not exist!)\", QT_TO_UTF8(key),\n  564 | \t\t\t     QT_TO_UTF8(var.name));\n  565 | \t\t\treturn false;\n  566 | \t\t}\n  567 | \t}\n  568 | \n  569 | \tvar = vars[key];\n  570 | \n  571 | \treturn true;","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp_Themes.cpp#L552-L571"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`isnormal(val)` returns false for +0.0 and -0.0 in addition to infinities and NaNs (per the C\nstandard, subnormals also fail). In `EvalMath`, after a `calc()` subtraction of two equal values\n(e.g. `2px - 2px`), `val` will be 0.0 and `!isnormal(0.0)` is true, so the result is logged as\nan error and the string `'Invalid expression'` is returned. This silently breaks any theme that\nuses `calc()` to produce zero, including cases like centering offsets.","fix":"Replace `isnormal` with an explicit check for non-finite values:\n\n```cpp\nif (!isfinite(val)) {\n    blog(LOG_ERROR, \"Invalid calc() resulted in non-finite number: %f %s %f = %f\", d1,\n         QT_TO_UTF8(opt), d2, val);\n    return \"'Invalid expression'\";\n}\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:681-698","code":"  681 | \tdouble val = numeric_limits<double>::quiet_NaN();\n  682 | \n  683 | \tif (type == OBSThemeVariable::Calc) {\n  684 | \t\tif (opt == \"+\") {\n  685 | \t\t\tval = d1 + d2;\n  686 | \t\t} else if (opt == \"-\") {\n  687 | \t\t\tval = d1 - d2;\n  688 | \t\t} else if (opt == \"*\") {\n  689 | \t\t\tval = d1 * d2;\n  690 | \t\t} else if (opt == \"/\") {\n  691 | \t\t\tval = d1 / d2;\n  692 | \t\t}\n  693 | \n  694 | \t\tif (!isnormal(val)) {\n  695 | \t\t\tblog(LOG_ERROR, \"Invalid calc() resulted in non-normal number: %f %s %f = %f\", d1,\n  696 | \t\t\t     QT_TO_UTF8(opt), d2, val);\n  697 | \t\t\treturn \"'Invalid expression'\";\n  698 | \t\t}","lines":18,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp_Themes.cpp#L681-L698"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`calldata_get_ptr` passes `sizeof(p_ptr)` (the size of the local pointer-to-void* argument on the stack, always 8 on 64-bit) instead of the size of the pointed-to pointer. This means it reads the correct number of bytes on 64-bit platforms by coincidence, but silently fails when the stored pointer size differs or when the API is used in a way that triggers the type-size check inside `calldata_get_data`. The intent is clearly `sizeof(void*)`, not `sizeof(p_ptr)` (which equals `sizeof(void**)`, i.e. 8 bytes either way on LP64, but the semantics are wrong and would break on hypothetical platforms where they differ, and is misleading regardless).","fix":"Change `sizeof(p_ptr)` to `sizeof(void *)` so the size reflects the value being retrieved, not the local pointer argument:\n```c\nstatic inline bool calldata_get_ptr(const calldata_t *data, const char *name, void *p_ptr)\n{\n    return calldata_get_data(data, name, p_ptr, sizeof(void *));\n}\n```","locations":[{"ref":"libobs/callback/calldata.h:119-121","code":"  119 | {\n  120 | \treturn calldata_get_data(data, name, p_ptr, sizeof(p_ptr));\n  121 | }","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/callback/calldata.h#L119-L121"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`gs_effect_set_default` dereferences `param` before any null check. The function passes\n`param->default_val.array` and `param->default_val.num` to `effect_setval_inline`, which does have\nits own null check for param - but the dereference of param happens first in the call expression,\ncausing a null pointer dereference if a caller passes NULL.","fix":"Add a null guard before dereferencing:\n\n```c\nvoid gs_effect_set_default(gs_eparam_t *param)\n{\n    if (!param)\n        return;\n    effect_setval_inline(param, param->default_val.array, param->default_val.num);\n}\n```","locations":[{"ref":"libobs/graphics/effect.c:542-545","code":"  542 | void gs_effect_set_default(gs_eparam_t *param)\n  543 | {\n  544 | \teffect_setval_inline(param, param->default_val.array, param->default_val.num);\n  545 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/effect.c#L542-L545"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The extension guard in `wic_image_init` (Windows-only) has its condition inverted. The intent\nis to bail out early when the file is NOT a `.jxr` file, but the check is:\n\n    if (len <= 4 && astrcmpi(file + len - 4, \".jxr\") != 0)\n\nThis only returns early for filenames of four characters or fewer that do not end in `.jxr`.\nFor any filename longer than four characters (virtually all real filenames), the condition is\nimmediately false and the guard is skipped entirely - meaning every non-JXR file that FFmpeg\ncould not load (e.g. ordinary PNGs) is silently forwarded into the WIC JXR decoder path. As a\nsecondary issue, when `len < 4`, `file + len - 4` is a pointer before the start of the string,\nwhich is undefined behavior.","fix":"The correct guard is: bail out if the filename is too short OR if it does not\nend with `.jxr`:\n\n```c\nif (len < 4 || astrcmpi(file + len - 4, \".jxr\") != 0) {\n    blog(LOG_WARNING, \"WIC: Only handle JXR for WIC images for now\");\n    return NULL;\n}\n```","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:705-709","code":"  705 | \tconst size_t len = strlen(file);\n  706 | \tif (len <= 4 && astrcmpi(file + len - 4, \".jxr\") != 0) {\n  707 | \t\tblog(LOG_WARNING, \"WIC: Only handle JXR for WIC images for now\");\n  708 | \t\treturn NULL;\n  709 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/graphics-ffmpeg.c#L705-L709"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`polar_to_cart` names the first computed value `sinx` but initialises it with `cosf(v->x)`, not `sinf`. The subsequent `sinx_z` and all three output components then use the wrong trig value, producing an incorrect Cartesian vector for any non-trivial polar input.","fix":"Rename and correct the computation:\n```c\n// before\nfloat sinx = cosf(v->x);\n// after\nfloat sinx = sinf(v->x);\n```\nAnd ensure the remaining uses of `sinx` (lines 28, 30, 32) also make sense geometrically - the `w`-component formula on line 32 (`v->z * sinf(v->x)`) is currently computing the Y component with a sine of the elevation that is redundant once `sinx` is fixed. A full cross-check against the inverse `cart_to_polar` is recommended.","locations":[{"ref":"libobs/graphics/math-extra.c:27-34","code":"   27 | \tfloat sinx = cosf(v->x);\n   28 | \tfloat sinx_z = v->z * sinx;\n   29 | \n   30 | \tcart.x = sinx_z * sinf(v->y);\n   31 | \tcart.z = sinx_z * cosf(v->y);\n   32 | \tcart.y = v->z * sinf(v->x);\n   33 | \n   34 | \tvec3_copy(dst, &cart);","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/math-extra.c#L27-L34"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`video_frame_init` computes plane offsets incorrectly. The loop accumulates\n`plane_size` into `size` and then stores the running total as `offsets[i]`,\nso `offsets[0]` is the end of plane 0, not the start. The pointer assignment\nfor plane N then uses `offsets[i-1]`, which is correct for i=1 (offset of\nplane 1 = end of plane 0) but for i=2 it uses `offsets[1]` (end of plane 1),\nskipping past plane 1 entirely. In practice this means plane-2 data pointers\nfor tri-planar formats (I420, I444, etc.) are set to the allocation end rather\nthan the start of plane 2, so writes to plane 2 go out of bounds and reads\nfrom it return garbage.\n\nRoot cause: `offsets[i]` stores the cumulative end of each plane. The pointer\nfor plane i should be `offsets[i-1]` (the end of the previous plane, i.e. the\nstart of this plane), but for plane 0 (the base allocation) the start is simply\n`frame->data[0]`. For plane 1 `offsets[0]` is the end of plane 0 - correct.\nFor plane 2 `offsets[1]` is the end of plane 1 - also correct. Actually on\nre-reading: `offsets[i]` is updated AFTER `size +=` so the loop body is:\n  size += plane_size; offsets[i] = size;\nSo offsets[0] = size_of_plane0, offsets[1] = size_of_plane0 + size_of_plane1,\nand the pointer assignment uses offsets[i-1]:\n  data[1] = data[0] + offsets[0]   -- correct (start of plane 1)\n  data[2] = data[0] + offsets[1]   -- correct (start of plane 2)\nThis is actually correct. However there is still a bug: `linesize[0]` and\n`data[0]` are filled outside the inner loop, but inside the inner loop planes\nwith index >= 1 are filled only if `linesizes[i]` and `heights[i]` are\nnon-zero. For plane 0, if `linesizes[0]` is 0 (VIDEO_FORMAT_NONE), `bmalloc(0)`\nis called, and `frame->data[0]` is set to a zero-byte allocation. The inner\nloop then correctly skips i=0 since linesizes[0]=0, but linesize[0] is still\nset to 0 outside the loop so that's fine. The real issue: `bmalloc(size)` is\ncalled with `size==0` when format is VIDEO_FORMAT_NONE, and then\n`frame->linesize[0]` is still set to `linesizes[0]` (0). The allocation itself\nis technically benign (bmalloc(0) behaviour), but `frame->data[0]` is a\ndangling non-NULL pointer to a zero-byte allocation that is then passed to\n`video_frame_free` -> `bfree(frame->data[0])`, which is fine. The deeper bug:\n`frame->data[0]` is set unconditionally to `bmalloc(size)` even when size==0,\ni.e. for VIDEO_FORMAT_NONE a pointless allocation is made and `linesize[0]` is\nset to 0. Minor resource waste.\n\nThe real bug found: for plane 0, `linesize[0]` is assigned from `linesizes[0]`\nunconditionally, even though linesizes[0] might not have been computed (e.g.\nfor VIDEO_FORMAT_NONE it is 0 by the memset). This is fine. The genuine issue\nis the off-by-one in the loop: planes 1..N-1 get `data[i] = data[0] + offsets[i-1]`\nbut `offsets` is only written for planes that are non-zero. If plane 1 is zero\n(e.g. Y800 has only one plane), then `offsets[0]` is never written, remaining\n0 from the memset, so `data[1] = data[0] + 0 = data[0]` - same address as\nplane 0. Since `linesizes[1]==0` that branch is skipped, so `data[1]` remains\nNULL from the initial memset of `frame`. Actually the inner loop checks\n`if (!linesizes[i] || !heights[i]) continue;` so plane 1 for Y800 is skipped\ncorrectly and `data[1]` stays NULL. This is correct behavior.\n\nREAL BUG: In `video_frame_init` at line 219, `offsets[i] = size` is assigned\ninside the loop that may skip some planes. If plane 1 is empty but plane 2 is\nnot, `offsets[1]` is never written (stays 0), and `data[2] = data[0] + offsets[1]`\n= `data[0]`, aliasing plane 0. This can happen for exotic formats where a middle\nplane is absent. In practice all current formats are contiguous, but the logic\nis fragile.","fix":"Track a separate `offset` accumulator for the next plane's start, distinct from\nthe per-plane `offsets[]` array, so planes are never aliased even if a middle\nplane is skipped:\n\n```c\nsize_t next_offset = 0;\nfor (uint32_t i = 0; i < MAX_AV_PLANES; i++) {\n    if (!linesizes[i] || !heights[i])\n        continue;\n    size_t plane_size = (size_t)linesizes[i] * (size_t)heights[i];\n    align_size(&plane_size, alignment);\n    offsets[i] = next_offset;\n    next_offset += plane_size;\n}\nsize = next_offset;\n\nframe->data[0] = bmalloc(size);\nframe->linesize[0] = linesizes[0];\n\nfor (uint32_t i = 1; i < MAX_AV_PLANES; i++) {\n    if (!linesizes[i] || !heights[i])\n        continue;\n    frame->data[i] = frame->data[0] + offsets[i];\n    frame->linesize[i] = linesizes[i];\n}\n```","locations":[{"ref":"libobs/media-io/video-frame.c:213-232","code":"  213 | \tfor (uint32_t i = 0; i < MAX_AV_PLANES; i++) {\n  214 | \t\tif (!linesizes[i] || !heights[i])\n  215 | \t\t\tcontinue;\n  216 | \t\tsize_t plane_size = (size_t)linesizes[i] * (size_t)heights[i];\n  217 | \t\talign_size(&plane_size, alignment);\n  218 | \t\tsize += plane_size;\n  219 | \t\toffsets[i] = size;\n  220 | \t}\n  221 | \n  222 | \t/* allocate memory */\n  223 | \tframe->data[0] = bmalloc(size);\n  224 | \tframe->linesize[0] = linesizes[0];\n  225 | \n  226 | \t/* apply plane data pointers according to offsets */\n  227 | \tfor (uint32_t i = 1; i < MAX_AV_PLANES; i++) {\n  228 | \t\tif (!linesizes[i] || !heights[i])\n  229 | \t\t\tcontinue;\n  230 | \t\tframe->data[i] = frame->data[0] + offsets[i - 1];\n  231 | \t\tframe->linesize[i] = linesizes[i];\n  232 | \t}","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/media-io/video-frame.c#L213-L232"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `obs-av1.c`, the `leb128` decoder uses a fixed shift of `i * 7` bits into a\n`uint64_t`, but the shift is computed as `(leb128_byte & 0x7f) << (i * 7)`.\nWhen `i >= 9`, `i * 7 = 63`, which is the maximum valid shift for a 64-bit\nvalue. For i=9 the multiplication `9*7=63` is fine, but at i=9 it shifts a\n`uint8_t` value (promoted to `int`) by 63 bits - for a non-zero value this is\nundefined behavior in C (shifting a signed 32-bit value by >= 32 bits).\nAdditionally, leb128 values wider than 63 bits can set bit 63, making the\nresult negative when interpreted as `int64_t`, although `uint64_t` is used here.\n\nThe outer loop runs for `i` in `[0, 7]` (i < 8), so i=7 is the maximum,\nmeaning the shift is at most 49 bits. This is within range. However, the loop\nlimit of 8 iterations only covers 56 bits of leb128 data (7 bits per byte * 8\nbytes = 56 bits), which is insufficient for full 64-bit leb128 values (which\nrequire up to 10 bytes / 70 bits). The documented purpose is correct for AV1\nOBU sizes (which are limited to about 32 bits in practice), but the comment\nclaims to decode `uint64_t` and the cap is inconsistent.\n\nAlso: `size--` on an unsigned `size_t` when `size == 0` wraps to `SIZE_MAX`\nrather than breaking, but the check `if (size-- < 1)` correctly evaluates\n`size < 1` before decrementing via post-decrement, so `size-- < 1` tests the\noriginal value. Wait - in C, `size-- < 1` evaluates `size < 1` (since post-\ndecrement returns the old value) and then decrements. So when `size == 0`,\n`size-- < 1` is `0 < 1 = true`, we break - correct. When `size > 0`, the\ncondition is false, we proceed and `size` has already been decremented. This\nis actually correct behavior. No bug here.\n\nThe real shift issue: when `i = 7` and `leb128_byte & 0x7f` is non-zero,\nthe expression `(leb128_byte & 0x7f) << (i * 7)` is `(uint8_t_val) << 49`.\n`leb128_byte & 0x7f` has type `int` (after integer promotion). Shifting an\n`int` by 49 is UB. The value should be cast to `uint64_t` first.","fix":"Cast to `uint64_t` before shifting, and fix the loop bound to 10 for full\nleb128 support:\n\n```c\nstatic inline uint64_t leb128(const uint8_t *buf, size_t size, size_t *len)\n{\n    uint64_t value = 0;\n    uint8_t leb128_byte;\n\n    *len = 0;\n\n    for (int i = 0; i < 10; i++) {\n        if (size-- < 1)\n            break;\n        (*len)++;\n        leb128_byte = buf[i];\n        value |= (uint64_t)(leb128_byte & 0x7f) << (i * 7);\n        if (!(leb128_byte & 0x80))\n            break;\n    }\n\n    return value;\n}\n```","locations":[{"ref":"libobs/obs-av1.c:9-27","code":"    9 | static inline uint64_t leb128(const uint8_t *buf, size_t size, size_t *len)\n   10 | {\n   11 | \tuint64_t value = 0;\n   12 | \tuint8_t leb128_byte;\n   13 | \n   14 | \t*len = 0;\n   15 | \n   16 | \tfor (int i = 0; i < 8; i++) {\n   17 | \t\tif (size-- < 1)\n   18 | \t\t\tbreak;\n   19 | \t\t(*len)++;\n   20 | \t\tleb128_byte = buf[i];\n   21 | \t\tvalue |= (leb128_byte & 0x7f) << (i * 7);\n   22 | \t\tif (!(leb128_byte & 0x80))\n   23 | \t\t\tbreak;\n   24 | \t}\n   25 | \n   26 | \treturn value;\n   27 | }","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-av1.c#L9-L27"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `obs-av1.c::obs_av1_keyframe`, after `parse_obu_header` returns, the code\nadvances via `start += obu_start + obu_size`. If `parse_obu_header` returns\nwith `obu_size == 0` AND `obu_start == 0` (e.g. on a zero-byte or otherwise\nmalformed trailing OBU), the loop does not advance at all - `start` stays\nunchanged, causing an infinite loop that will hang the encoder thread.\n\n`parse_obu_header` can return `obu_size == 0` and `obu_start > 0` (when the\nOBU header byte is consumed but `has_size_field` yields size 0), so the\nadvance of `obu_start` alone saves it in those cases. But if the buffer starts\nwith a valid 1-byte header (`has_size_field=1`, `size=0`), `obu_start` is\nincremented past the header byte, but `obu_size` is 0 from leb128. That means\nthe loop advances by `obu_start` bytes each iteration and will eventually reach\n`end`. However, if the very first byte is 0x00 (forbidden bit set / garbage),\n`parse_obu_header` returns all zeros immediately (since `size < 1` is false but\nall get_bits calls return 0, obu_type=0, extension_flag=0, has_size_field=0).\nThen `obu_size = size - 1` which for `size=end-start` > 0 gives a non-zero\nvalue, so the advance is fine.\n\nThe actual infinite-loop risk is: if `obu_start == 0` and `obu_size == 0`\nsimultaneously. This happens when `size == 1`, `extension_flag == 0`,\n`has_size_field == 1`, and `leb128` decodes 0 from the remaining 0 bytes\n(because `size - obu_start == 0`). In that case `obu_start = 1`, `obu_size = 0`\n=> advance by 1 byte. Not an infinite loop. But if `size == 0` initially the\nouter check `if (size < 1)` stops it. The pathological case: if `has_size_field=1`\nand the leb128 field encodes a value larger than the remaining buffer, `obu_size`\nwill be a huge value, and `start += obu_start + obu_size` will jump past `end`,\nmaking `start > end`. Then `while (start < end)` terminates correctly. Safe.\n\nThe loop in `obs_extract_av1_headers` has the same pattern. Both functions do\n`da_push_back_array(header, start, obu_start + obu_size)` when `obu_size == 0`\nand `obu_start > 0`, writing non-zero bytes, which is correct. But if\n`obu_size` is a large garbage value from leb128 overflow, the `da_push_back_array`\ncall will attempt to read `obu_start + obu_size` bytes starting from `start`,\nwhich is bounded by `end - start` in the pointer sense but the push_back will\nread beyond the original `packet` buffer, causing an OOB heap read.\n\nThe specific scenario: a crafted AV1 bitstream where an OBU's leb128 size\nfield encodes a value larger than the remaining buffer causes `obu_size` to be\nlarger than `end - start - obu_start`. The `da_push_back_array` call then reads\nmemory past the end of the input buffer.","fix":"After `parse_obu_header`, clamp `obu_size` to the remaining buffer space before\nusing it for array operations:\n\n```c\nconst size_t remaining = (size_t)(end - start);\nif (obu_start > remaining)\n    break;\nif (obu_size > remaining - obu_start)\n    obu_size = remaining - obu_start;\n\n// now safe to use obu_start + obu_size\n```\n\nAlso add a guard against zero advance to prevent potential infinite loops in\nunusual cases:\n\n```c\nif (obu_start + obu_size == 0)\n    break;\nstart += obu_start + obu_size;\n```","locations":[{"ref":"libobs/obs-av1.c:181-208","code":"  181 | void obs_extract_av1_headers(const uint8_t *packet, size_t size, uint8_t **new_packet_data, size_t *new_packet_size,\n  182 | \t\t\t     uint8_t **header_data, size_t *header_size)\n  183 | {\n  184 | \tDARRAY(uint8_t) new_packet;\n  185 | \tDARRAY(uint8_t) header;\n  186 | \tconst uint8_t *start = packet, *end = packet + size;\n  187 | \n  188 | \tda_init(new_packet);\n  189 | \tda_init(header);\n  190 | \n  191 | \twhile (start < end) {\n  192 | \t\tsize_t obu_start, obu_size;\n  193 | \t\tint obu_type;\n  194 | \t\tparse_obu_header(start, end - start, &obu_start, &obu_size, &obu_type);\n  195 | \n  196 | \t\tif (obu_type == OBS_OBU_METADATA || obu_type == OBS_OBU_SEQUENCE_HEADER) {\n  197 | \t\t\tda_push_back_array(header, start, obu_start + obu_size);\n  198 | \t\t}\n  199 | \t\tda_push_back_array(new_packet, start, obu_start + obu_size);\n  200 | \n  201 | \t\tstart += obu_start + obu_size;\n  202 | \t}\n  203 | \n  204 | \t*new_packet_data = new_packet.array;\n  205 | \t*new_packet_size = new_packet.num;\n  206 | \t*header_data = header.array;\n  207 | \t*header_size = header.num;\n  208 | }","lines":28,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-av1.c#L181-L208"},{"ref":"libobs/obs-av1.c:157-179","code":"  157 | bool obs_av1_keyframe(const uint8_t *data, size_t size)\n  158 | {\n  159 | \tconst uint8_t *start = data, *end = data + size;\n  160 | \n  161 | \twhile (start < end) {\n  162 | \t\tsize_t obu_start, obu_size;\n  163 | \t\tint obu_type;\n  164 | \t\tparse_obu_header(start, end - start, &obu_start, &obu_size, &obu_type);\n  165 | \n  166 | \t\tif (obu_size) {\n  167 | \t\t\tif (obu_type == OBS_OBU_FRAME || obu_type == OBS_OBU_FRAME_HEADER) {\n  168 | \t\t\t\tuint8_t val = *(start + obu_start);\n  169 | \t\t\t\tif (!get_bits(val, 0, 1))                // show_existing_frame\n  170 | \t\t\t\t\treturn get_bits(val, 1, 2) == 0; // frame_type\n  171 | \t\t\t\treturn false;\n  172 | \t\t\t}\n  173 | \t\t}\n  174 | \n  175 | \t\tstart += obu_start + obu_size;\n  176 | \t}\n  177 | \n  178 | \treturn false;\n  179 | }","lines":23,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-av1.c#L157-L179"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`item_default_data_addref` guards on `item->data_size` (the user-value size) instead of\n`item->default_size`. When a default `OBS_DATA_OBJECT` or `OBS_DATA_ARRAY` value is set on\nan item that has no user value (`data_size == 0`), the guard causes an early return and the\nreferenced `obs_data_t *` / `obs_data_array_t *` never has its reference count incremented.\nThe matching `item_default_data_release` does run and decrements the reference count, which\ncan drop it to zero and free the object while callers still hold it. This leads to\nuse-after-free if `obs_data_set_default_obj` or `obs_data_set_default_array` is called and\nno user value has been written to the same key.","fix":"Change the guard from `item->data_size` to `item->default_size`:\n```c\nstatic inline void item_default_data_addref(struct obs_data_item *item)\n{\n\tif (!item->default_size)\n\t\treturn;\n\n\tif (item->type == OBS_DATA_OBJECT) {\n\t\tobs_data_t *obj = get_item_default_obj(item);\n\t\tobs_data_addref(obj);\n\t} else if (item->type == OBS_DATA_ARRAY) {\n\t\tobs_data_array_t *array = get_item_default_array(item);\n\t\tobs_data_array_addref(array);\n\t}\n}\n```","locations":[{"ref":"libobs/obs-data.c:237-250","code":"  237 | static inline void item_default_data_addref(struct obs_data_item *item)\n  238 | {\n  239 | \tif (!item->data_size)\n  240 | \t\treturn;\n  241 | \n  242 | \tif (item->type == OBS_DATA_OBJECT) {\n  243 | \t\tobs_data_t *obj = get_item_default_obj(item);\n  244 | \t\tobs_data_addref(obj);\n  245 | \n  246 | \t} else if (item->type == OBS_DATA_ARRAY) {\n  247 | \t\tobs_data_array_t *array = get_item_default_array(item);\n  248 | \t\tobs_data_array_addref(array);\n  249 | \t}\n  250 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-data.c#L237-L250"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`obs_data_item_destroy` performs `HASH_DEL(item->parent->items, item)` to remove the item\nfrom the uthash table but does NOT clear `item->parent` afterwards. It then calls\n`obs_data_item_detach(item)`, which checks `item->parent` and calls `HASH_DEL` a second\ntime on the same item. Calling `HASH_DEL` on a node that has already been removed corrupts\nthe uthash internal linked list (it updates predecessor/successor pointers that no longer\nrefer to this item), silently corrupting the hash table used for all `obs_data` key lookups.","fix":"Clear `item->parent` immediately after the first `HASH_DEL`, making the\nsubsequent `obs_data_item_detach` call a no-op:\n```c\nstatic inline void obs_data_item_destroy(struct obs_data_item *item)\n{\n\tif (item->parent) {\n\t\tHASH_DEL(item->parent->items, item);\n\t\titem->parent = NULL;  /* prevent double-HASH_DEL via obs_data_item_detach */\n\t}\n\n\titem_data_release(item);\n\titem_default_data_release(item);\n\titem_autoselect_data_release(item);\n\tobs_data_item_detach(item);\n\tbfree(item);\n}\n```","locations":[{"ref":"libobs/obs-data.c:341-351","code":"  341 | static inline void obs_data_item_destroy(struct obs_data_item *item)\n  342 | {\n  343 | \tif (item->parent)\n  344 | \t\tHASH_DEL(item->parent->items, item);\n  345 | \n  346 | \titem_data_release(item);\n  347 | \titem_default_data_release(item);\n  348 | \titem_autoselect_data_release(item);\n  349 | \tobs_data_item_detach(item);\n  350 | \tbfree(item);\n  351 | }","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-data.c#L341-L351"},{"ref":"libobs/obs-data.c:305-311","code":"  305 | static inline void obs_data_item_detach(struct obs_data_item *item)\n  306 | {\n  307 | \tif (item->parent) {\n  308 | \t\tHASH_DEL(item->parent->items, item);\n  309 | \t\titem->parent = NULL;\n  310 | \t}\n  311 | }","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-data.c#L305-L311"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `load_binding`, the guard condition `!modifiers` (line 482) tests whether the pointer `modifiers` is null. `modifiers` is `&combo.modifiers` - a pointer to a local stack variable - so it can never be null. The intended check was `!*modifiers` (no modifier flags set). As written, bindings with no key (`OBS_KEY_NONE` or invalid key) and zero modifiers are incorrectly accepted and silently stored as empty bindings, while the filter that was meant to reject them is never triggered.","fix":"Change `!modifiers` to `!*modifiers`:\n```c\n/* before */\nif (!modifiers && (combo.key == OBS_KEY_NONE || combo.key >= OBS_KEY_LAST_VALUE))\n    return;\n\n/* after */\nif (!*modifiers && (combo.key == OBS_KEY_NONE || combo.key >= OBS_KEY_LAST_VALUE))\n    return;\n```","locations":[{"ref":"libobs/obs-hotkey.c:474-485","code":"  474 | \tobs_key_combination_t combo = {0};\n  475 | \tuint32_t *modifiers = &combo.modifiers;\n  476 | \tload_modifier(modifiers, data, \"shift\", INTERACT_SHIFT_KEY);\n  477 | \tload_modifier(modifiers, data, \"control\", INTERACT_CONTROL_KEY);\n  478 | \tload_modifier(modifiers, data, \"alt\", INTERACT_ALT_KEY);\n  479 | \tload_modifier(modifiers, data, \"command\", INTERACT_COMMAND_KEY);\n  480 | \n  481 | \tcombo.key = obs_key_from_name(obs_data_get_string(data, \"key\"));\n  482 | \tif (!modifiers && (combo.key == OBS_KEY_NONE || combo.key >= OBS_KEY_LAST_VALUE))\n  483 | \t\treturn;\n  484 | \n  485 | \tcreate_binding(hotkey, combo);","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-hotkey.c#L474-L485"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`platform_keyboard_keymap` does not check whether `xkb_keymap_new_from_string` returns\nNULL (which it does when the keymap string is malformed or the xkb context is in an error\nstate). After a failure:\n- `plat->xkb_keymap` is set to NULL.\n- `xkb_state_new(NULL)` is called immediately after, which dereferences NULL inside the\n  xkb library and crashes.\n- Even if `xkb_state_new` somehow survived, `rebuild_keymap_data` calls\n  `xkb_keymap_key_for_each(NULL, ...)`, which also dereferences NULL.\nA misbehaving or malicious compositor can send a garbage keymap string and crash OBS.","fix":"Guard against a NULL keymap after `xkb_keymap_new_from_string`:\n\n```c\nstruct xkb_keymap *xkb_keymap = xkb_keymap_new_from_string(\n    plat->xkb_context, keymap_shm, XKB_KEYMAP_FORMAT_TEXT_V1,\n    XKB_KEYMAP_COMPILE_NO_FLAGS);\nmunmap(keymap_shm, size);\nclose(fd);\n\nif (!xkb_keymap) {\n    blog(LOG_WARNING, \"[wayland] failed to compile keymap\");\n    return;\n}\n\nxkb_keymap_unref(plat->xkb_keymap);\nxkb_state_unref(plat->xkb_state);\nplat->xkb_keymap = xkb_keymap;\nplat->xkb_state = xkb_state_new(xkb_keymap);\nrebuild_keymap_data(plat);\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:89-100","code":"   89 | \tstruct xkb_keymap *xkb_keymap = xkb_keymap_new_from_string(\n   90 | \t\tplat->xkb_context, keymap_shm, XKB_KEYMAP_FORMAT_TEXT_V1, XKB_KEYMAP_COMPILE_NO_FLAGS);\n   91 | \tmunmap(keymap_shm, size);\n   92 | \tclose(fd);\n   93 | \n   94 | \t// cleanup old keymap and state\n   95 | \txkb_keymap_unref(plat->xkb_keymap);\n   96 | \txkb_state_unref(plat->xkb_state);\n   97 | \n   98 | \tplat->xkb_keymap = xkb_keymap;\n   99 | \tplat->xkb_state = xkb_state_new(xkb_keymap);\n  100 | \trebuild_keymap_data(plat);","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L89-L100"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`XKB_KEY_XF86AudioRaiseVolume` is mapped to `OBS_KEY_VK_VOLUME_DOWN` and\n`XKB_KEY_XF86AudioLowerVolume` is mapped to `OBS_KEY_VK_VOLUME_UP` -- both swapped.\nThe same inversion exists in the reverse function `obs_nix_wayland_key_to_virtual_key`.\nOn Windows, `OBS_KEY_VK_VOLUME_DOWN` correctly maps to `VK_VOLUME_DOWN` (the volume-down\nkey). On Wayland, however, pressing the physical volume-down key (`XF86AudioLowerVolume`)\nis recorded as `OBS_KEY_VK_VOLUME_UP`, and vice-versa. This breaks cross-platform hotkey\nportability: a hotkey bound to \"Volume Down\" on Windows will fire on the volume-up key\non Wayland.","fix":"Swap the two XKB keysym constants to match the correct semantic:\n\n```c\n// obs_nix_wayland_key_from_virtual_key\ncase XKB_KEY_XF86AudioRaiseVolume:\n    return OBS_KEY_VK_VOLUME_UP;\ncase XKB_KEY_XF86AudioLowerVolume:\n    return OBS_KEY_VK_VOLUME_DOWN;\n\n// obs_nix_wayland_key_to_virtual_key\ncase OBS_KEY_VK_VOLUME_DOWN:\n    return XKB_KEY_XF86AudioLowerVolume;\ncase OBS_KEY_VK_VOLUME_UP:\n    return XKB_KEY_XF86AudioRaiseVolume;\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:1046-1049","code":" 1046 | \tcase XKB_KEY_XF86AudioRaiseVolume:\n 1047 | \t\treturn OBS_KEY_VK_VOLUME_DOWN;\n 1048 | \tcase XKB_KEY_XF86AudioLowerVolume:\n 1049 | \t\treturn OBS_KEY_VK_VOLUME_UP;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L1046-L1049"},{"ref":"libobs/obs-nix-wayland.c:1607-1610","code":" 1607 | \tcase OBS_KEY_VK_VOLUME_DOWN:\n 1608 | \t\treturn XKB_KEY_XF86AudioRaiseVolume;\n 1609 | \tcase OBS_KEY_VK_VOLUME_UP:\n 1610 | \t\treturn XKB_KEY_XF86AudioLowerVolume;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/obs-nix-wayland.c#L1607-L1610"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `handleUncleanShutdown`, when `enableCrashUpload` is false the crash-report checkbox is not\nadded to the dialog, so `crashWarning.checkBox()` returns null. The code correctly guards the\n`setCheckBox` call with `if (enableCrashUpload)`, but then unconditionally evaluates\n`(enableCrashUpload) ? crashWarning.checkBox()->isChecked() : false`. If Qt's\n`QMessageBox::checkBox()` returns null when no checkbox was set, the ternary's `true` branch is\nnever reached when `enableCrashUpload` is false, so the guard works here. However, this relies on\nthe conditional evaluation order rather than an explicit null check, making the code fragile. If\nthe logic is ever refactored so the ternary or the `if` are reordered, a null dereference will\noccur.","fix":"Use an explicit null check:\n\n```cpp\nbool sendCrashReport = false;\nif (enableCrashUpload) {\n    QCheckBox *cb = crashWarning.checkBox();\n    sendCrashReport = cb && cb->isChecked();\n}\n```","locations":[{"ref":"frontend/OBSApp.cpp:106-132","code":"  106 | \tif (enableCrashUpload) {\n  107 | \t\tcrashWarning.setInformativeText(QTStr(\"CrashHandling.Labels.PrivacyNotice\"));\n  108 | \n  109 | \t\tQCheckBox *sendCrashReportCheckbox = new QCheckBox(QTStr(\"CrashHandling.Checkbox.SendReport\"));\n  110 | \t\tcrashWarning.setCheckBox(sendCrashReportCheckbox);\n  111 | \t}\n  112 | \n  113 | \tQPushButton *launchSafeButton =\n  114 | \t\tcrashWarning.addButton(QTStr(\"CrashHandling.Buttons.LaunchSafe\"), QMessageBox::AcceptRole);\n  115 | \tQPushButton *launchNormalButton =\n  116 | \t\tcrashWarning.addButton(QTStr(\"CrashHandling.Buttons.LaunchNormal\"), QMessageBox::RejectRole);\n  117 | \n  118 | \tcrashWarning.setDefaultButton(launchNormalButton);\n  119 | \n  120 | \tcrashWarning.exec();\n  121 | \n  122 | \tbool useSafeMode = crashWarning.clickedButton() == launchSafeButton;\n  123 | \n  124 | \tif (useSafeMode) {\n  125 | \t\tlaunchAction.useSafeMode = true;\n  126 | \n  127 | \t\tblog(LOG_INFO, \"[Safe Mode] Safe mode launch selected, loading third-party plugins is disabled\");\n  128 | \t} else {\n  129 | \t\tblog(LOG_WARNING, \"[Safe Mode] Normal launch selected, loading third-party plugins is enabled\");\n  130 | \t}\n  131 | \n  132 | \tbool sendCrashReport = (enableCrashUpload) ? crashWarning.checkBox()->isChecked() : false;","lines":27,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp.cpp#L106-L132"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`OBSApp::uploadLastAppLog` and `OBSApp::uploadCurrentAppLog` unconditionally dereference the\nresult of `GetMainWindow()` without a null check. `GetMainWindow()` returns\n`mainWindow.data()` from a `QPointer`, which is null after the main window has been destroyed.\nCalling these functions (e.g. from the crash log upload flow) after the window closes will\ncrash OBS.","fix":"Guard the pointer:\n\n```cpp\nvoid OBSApp::uploadLastAppLog() const\n{\n    OBSBasic *basicWindow = static_cast<OBSBasic *>(GetMainWindow());\n    if (!basicWindow)\n        return;\n    basicWindow->UploadLog(\"obs-studio/logs\", GetLastLog(), OBS::LogFileType::LastAppLog);\n}\n```\nApply the same pattern to `uploadCurrentAppLog`.","locations":[{"ref":"frontend/OBSApp.cpp:1420-1431","code":" 1420 | void OBSApp::uploadLastAppLog() const\n 1421 | {\n 1422 | \tOBSBasic *basicWindow = static_cast<OBSBasic *>(GetMainWindow());\n 1423 | \n 1424 | \tbasicWindow->UploadLog(\"obs-studio/logs\", GetLastLog(), OBS::LogFileType::LastAppLog);\n 1425 | }\n 1426 | \n 1427 | void OBSApp::uploadCurrentAppLog() const\n 1428 | {\n 1429 | \tOBSBasic *basicWindow = static_cast<OBSBasic *>(GetMainWindow());\n 1430 | \n 1431 | \tbasicWindow->UploadLog(\"obs-studio/logs\", GetCurrentLog(), OBS::LogFileType::CurrentAppLog);","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp.cpp#L1420-L1431"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `ParseMath` (theme parser), `varType` is declared but not initialized before the\n`if/else if/else if` chain that assigns it. If somehow none of the three branches match (which is\na compiler-visible impossibility given the preceding `cf_token_is` guard, but no `else` exists),\n`varType` is used uninitialized on line 267. Compilers may warn about this, and the logic is\nfragile if the surrounding token checks are refactored.","fix":"Initialize `varType` to a safe default:\n\n```cpp\nOBSThemeVariable::VariableType varType = OBSThemeVariable::Calc;\n```\nOr add an explicit `else` branch that handles the unexpected case with a `blog(LOG_ERROR, ...)` and `return false`.","locations":[{"ref":"frontend/OBSApp_Themes.cpp:254-267","code":"  254 | \t\t\tOBSThemeVariable::VariableType varType;\n  255 | \t\t\tif (cf_token_is(cfp, \"calc\")) {\n  256 | \t\t\t\tvarType = OBSThemeVariable::Calc;\n  257 | \t\t\t} else if (cf_token_is(cfp, \"max\")) {\n  258 | \t\t\t\tvarType = OBSThemeVariable::Max;\n  259 | \t\t\t} else if (cf_token_is(cfp, \"min\")) {\n  260 | \t\t\t\tvarType = OBSThemeVariable::Min;\n  261 | \t\t\t}\n  262 | \n  263 | \t\t\tif (!ParseMath(cfp, subvalues, vars)) {\n  264 | \t\t\t\treturn false;\n  265 | \t\t\t}\n  266 | \n  267 | \t\t\tvar.type = varType;","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp_Themes.cpp#L254-L267"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `ParseThemeVariables`, the OS-prefix stripping logic (`key.startsWith(osPrefix) ->\nvar.name = key.sliced(osPrefix.length())`) runs before the `obs` prefix guard\n(`if (key.startsWith(\"obs\")) continue`). A theme variable named `os_win_obsHidden` (or similar)\nwould have its prefix stripped to `obsHidden`, which would then be allowed through the `obs`\nguard since the check operates on the original `key`, not the renamed `var.name`. This means a\nmalicious or buggy theme could inject a variable starting with `obs` into the variable map.","fix":"Move the `obs` prefix guard to operate on `var.name` after the rename, or re-check `var.name`\nafter stripping:\n\n```cpp\n// After the osPrefix stripping block:\nif (var.name.startsWith(\"obs\")) {\n    blog(LOG_WARNING, \"Theme variable '%s' uses reserved 'obs' prefix, skipping.\",\n         QT_TO_UTF8(var.name));\n    continue;\n}\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:350-375","code":"  350 | #ifdef _WIN32\n  351 | \t\tconst QString osPrefix = \"os_win_\";\n  352 | #elif __APPLE__\n  353 | \t\tconst QString osPrefix = \"os_mac_\";\n  354 | #else\n  355 | \t\tconst QString osPrefix = \"os_lin_\";\n  356 | #endif\n  357 | \n  358 | \t\tif (key.startsWith(osPrefix) && key.length() > osPrefix.length()) {\n  359 | \t\t\tvar.name = key.sliced(osPrefix.length());\n  360 | \t\t}\n  361 | \n  362 | \t\tret = cf_next_token_should_be(cfp, \":\", \";\", nullptr);\n  363 | \t\tif (ret != PARSE_SUCCESS) {\n  364 | \t\t\tcontinue;\n  365 | \t\t}\n  366 | \n  367 | \t\tif (!cf_next_token(cfp)) {\n  368 | \t\t\treturn vars;\n  369 | \t\t}\n  370 | \n  371 | \t\t/* Special values passed to the theme by OBS are prefixed with 'obs', so we\n  372 | \t\t * prevent theme variables from using it as a prefix. */\n  373 | \t\tif (key.startsWith(\"obs\")) {\n  374 | \t\t\tcontinue;\n  375 | \t\t}","lines":26,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp_Themes.cpp#L350-L375"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `OBSApp::SetTheme`, the `QTimer::singleShot` lambda captures `themeWatcher` by reference\n(`[&]`). If `SetTheme` is called again before the 250 ms timer fires (e.g. rapid hot-reload), the\nlambda will execute after `themeWatcher` has been replaced by a new `QFileSystemWatcher*` or even\nset to null, resulting in calling `blockSignals(false)` on the wrong object or crashing via a\ndangling pointer.","fix":"Capture `themeWatcher` by value (as a `QPointer`) instead of by reference:\n\n```cpp\nQPointer<QFileSystemWatcher> watcherPtr = themeWatcher;\nQTimer::singleShot(250, this, [watcherPtr] {\n    if (watcherPtr)\n        watcherPtr->blockSignals(false);\n});\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:1022-1027","code":" 1022 | \tif (themeWatcher) {\n 1023 | \t\tthemeWatcher->addPaths(filenames);\n 1024 | \t\t/* Give it 250 ms before re-enabling the watcher to prevent too\n 1025 | \t\t * many reloads when edited with an auto-saving IDE. */\n 1026 | \t\tQTimer::singleShot(250, this, [&] { themeWatcher->blockSignals(false); });\n 1027 | \t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp_Themes.cpp#L1022-L1027"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `OBSApp::themeFileChanged`, `currentTheme` is dereferenced unconditionally to obtain its `id`.\nHowever, `currentTheme` is a raw pointer that can be null if `SetTheme` was never called\nsuccessfully or if the theme was removed from `themes` in between. A null dereference here crashes\nOBS when the file watcher fires after theme cleanup.","fix":"Guard the dereference:\n\n```cpp\nvoid OBSApp::themeFileChanged(const QString &path)\n{\n    if (!currentTheme)\n        return;\n    blog(LOG_INFO, \"Theme file \"%s\" changed, reloading...\", QT_TO_UTF8(path));\n    SetTheme(currentTheme->id);\n}\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:1032-1036","code":" 1032 | void OBSApp::themeFileChanged(const QString &path)\n 1033 | {\n 1034 | \tblog(LOG_INFO, \"Theme file \\\"%s\\\" changed, reloading...\", QT_TO_UTF8(path));\n 1035 | \tSetTheme(currentTheme->id);\n 1036 | }","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/OBSApp_Themes.cpp#L1032-L1036"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`AccessibleAlignmentSelector::focusChild` calls `child(i)->state()` without checking whether\n`child(i)` returns null. `child(int)` calls `QAccessible::accessibleInterface(id)` which can\nreturn null if the interface was deleted or not yet registered. A null dereference here crashes\nOBS when an accessibility tool queries focus on the alignment selector widget.","fix":"Guard the child pointer:\n\n```cpp\nQAccessibleInterface *AccessibleAlignmentSelector::focusChild() const\n{\n    for (int i = 0; i < childCount(); ++i) {\n        QAccessibleInterface *c = child(i);\n        if (c && c->state().focused)\n            return c;\n    }\n    return nullptr;\n}\n```\nApply the same pattern to `value()` at line 119-122.","locations":[{"ref":"frontend/components/AccessibleAlignmentSelector.cpp:68-76","code":"   68 | QAccessibleInterface *AccessibleAlignmentSelector::focusChild() const\n   69 | {\n   70 | \tfor (int i = 0; i < childCount(); ++i) {\n   71 | \t\tif (child(i)->state().focused) {\n   72 | \t\t\treturn child(i);\n   73 | \t\t}\n   74 | \t}\n   75 | \treturn nullptr;\n   76 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/AccessibleAlignmentSelector.cpp#L68-L76"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`FlowFrame::keyPressEvent` iterates over all layout items looking for focus-navigation candidates (lines 67-113) | \t\t\t\t\tdistance = (focusedRect.top() - rect.bottom()) +\n  103 | \t\t\t\t\t\t   qAbs(rect.center().x() - focusedRect.center().x());\n  104 | \t\t\t\t\tisCandidate = true;\n  105 | \t\t\t\t}\n  106 | \t\t\t\tbreak;\n  107 | \t\t\t}\n  108 | \n  109 | \t\t\tif (isCandidate && distance < bestDistance) {\n  110 | \t\t\t\tbestDistance = distance;\n  111 | \t\t\t\tnextFocus = widget;\n  112 | \t\t\t}\n  113 | \t\t}","lines":47,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/FlowFrame.cpp#L67-L113"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`FlowLayout::doLayout` accesses `wid->style()` (lines 131 and 137) to query `layoutSpacing`, but `wid` can be `nullptr` when a layout item is not a widget (e.g. a `QSpacerItem`). This null pointer dereference would crash whenever a non-widget item is in the layout and `horizontalSpacing()` or `verticalSpacing()` returns -1.","fix":"Guard with a null check before using `wid`:\n\n```cpp\nint spaceX = horizontalSpacing();\nif (spaceX == -1 && wid) {\n    spaceX = wid->style()->layoutSpacing(...);\n}\nif (spaceX == -1)\n    spaceX = 0;\n```","locations":[{"ref":"frontend/components/FlowLayout.cpp:128-139","code":"  128 | \t\tconst QWidget *wid = item->widget();\n  129 | \t\tint spaceX = horizontalSpacing();\n  130 | \t\tif (spaceX == -1) {\n  131 | \t\t\tspaceX = wid->style()->layoutSpacing(QSizePolicy::PushButton, QSizePolicy::PushButton,\n  132 | \t\t\t\t\t\t\t     Qt::Horizontal);\n  133 | \t\t}\n  134 | \n  135 | \t\tint spaceY = verticalSpacing();\n  136 | \t\tif (spaceY == -1) {\n  137 | \t\t\tspaceY = wid->style()->layoutSpacing(QSizePolicy::PushButton, QSizePolicy::PushButton,\n  138 | \t\t\t\t\t\t\t     Qt::Vertical);\n  139 | \t\t}","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/FlowLayout.cpp#L128-L139"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`OBSPreviewScalingComboBox::UpdateSelection` computes `outputScale = float(output_width) / float(canvas_width)` (line 111) without guarding against `canvas_width == 0`. At startup, before the first canvas resize event is received, `canvas_width` is 0, resulting in a division by zero (float Infinity). The comparison `previewScale == outputScale` then never matches, but the Infinity can propagate to other calculations.","fix":"```cpp\nif (canvas_width == 0)\n    return;\nfloat outputScale = float(output_width) / float(canvas_width);\n```","locations":[{"ref":"frontend/components/OBSPreviewScalingComboBox.cpp:111","code":"  111 | \tfloat outputScale = float(output_width) / float(canvas_width);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/OBSPreviewScalingComboBox.cpp#L111"}]},{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SceneTree::resizeEvent` and `SceneTree::dropEvent` call `item(count() - 1)` and `item(0)` inside the `gridMode` branch without first checking that the list is non-empty. When `count() == 0`, `item(-1)` returns `nullptr` and `visualItemRect(nullptr)` invokes undefined behaviour (null dereference or invalid QRect). `RepositionGrid` has the same issue.","fix":"Guard each grid-mode block with a count check:\n\n```cpp\nif (gridMode) {\n    if (count() == 0)\n        return;\n    const QRect lastItem = visualItemRect(item(count() - 1));\n    // ...\n}\n```","locations":[{"ref":"frontend/components/SceneTree.cpp:69-70","code":"   69 | \t\tconst QRect lastItem = visualItemRect(item(count() - 1));\n   70 | \t\tconst int h = lastItem.y() + lastItem.height();","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SceneTree.cpp#L69-L70"},{"ref":"frontend/components/SceneTree.cpp:112-113","code":"  112 | \t\tconst QRect firstItem = visualItemRect(item(0));\n  113 | \t\tconst QRect lastItem = visualItemRect(item(count() - 1));","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SceneTree.cpp#L112-L113"},{"ref":"frontend/components/SceneTree.cpp:152-153","code":"  152 | \tconst QRect firstItem = visualItemRect(item(0));\n  153 | \tconst QRect lastItem = visualItemRect(item(count() - 1));","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SceneTree.cpp#L152-L153"}]},{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SourceTreeModel::data()` accesses `items[index.row()]` without first verifying that `index.isValid()` or that `index.row()` is within bounds. If Qt (or any client code) calls `data()` with an out-of-range index — which can happen during model resets — this causes undefined behaviour. The sibling `flags()` method correctly checks `index.isValid()` first.","fix":"Add a bounds check at the start of `data()`:\n\n```cpp\nQVariant SourceTreeModel::data(const QModelIndex &index, int role) const\n{\n    if (!index.isValid() || index.row() < 0 || index.row() >= items.count())\n        return QVariant();\n    // ...\n}\n```","locations":[{"ref":"frontend/components/SourceTreeModel.cpp:250-258","code":"  250 | QVariant SourceTreeModel::data(const QModelIndex &index, int role) const\n  251 | {\n  252 | \tif (role == Qt::AccessibleTextRole) {\n  253 | \t\tOBSSceneItem item = items[index.row()];\n  254 | \t\tobs_source_t *source = obs_sceneitem_get_source(item);\n  255 | \t\treturn QVariant(QT_UTF8(obs_source_get_name(source)));\n  256 | \t}\n  257 | \n  258 | \treturn QVariant();","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SourceTreeModel.cpp#L250-L258"}]},{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SourceTreeModel::data()` does not validate the index before dereferencing `items[index.row()]`.\nWhen `role == Qt::AccessibleTextRole`, the function unconditionally accesses the items vector\nat `index.row()` with no prior check that the index is valid or within bounds.\nIn contrast, the sibling `flags()` method does check `!index.isValid()` before accessing items.\nWhile Qt's framework normally provides valid indices, accessibility tools and screen readers can\nquery `data()` with stale or synthetic indices, which could cause an out-of-bounds crash.","fix":"Add the same validity guard used in `flags()`:\n```cpp\nQVariant SourceTreeModel::data(const QModelIndex &index, int role) const\n{\n    if (role == Qt::AccessibleTextRole) {\n        if (!index.isValid() || index.row() >= items.count())\n            return QVariant();\n        OBSSceneItem item = items[index.row()];\n        obs_source_t *source = obs_sceneitem_get_source(item);\n        return QVariant(QT_UTF8(obs_source_get_name(source)));\n    }\n    return QVariant();\n}\n```","locations":[{"ref":"frontend/components/SourceTreeModel.cpp:250-258","code":"  250 | QVariant SourceTreeModel::data(const QModelIndex &index, int role) const\n  251 | {\n  252 | \tif (role == Qt::AccessibleTextRole) {\n  253 | \t\tOBSSceneItem item = items[index.row()];\n  254 | \t\tobs_source_t *source = obs_sceneitem_get_source(item);\n  255 | \t\treturn QVariant(QT_UTF8(obs_source_get_name(source)));\n  256 | \t}\n  257 | \n  258 | \treturn QVariant();","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/SourceTreeModel.cpp#L250-L258"}]},{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"TextSourceToolbar uses two different, inconsistent APIs to identify the text_ft2 source type.\nThe constructor (line 25-26) correctly uses `obs_source_get_unversioned_id` plus `strcmp` and\nstores the result in `ft2`. But the color key selection inside the same constructor (line 33-34)\nuses `obs_source_get_id` (versioned) plus `strncmp(..., 15)`, ignoring the already-computed `ft2`.\nThe same `strncmp` pattern appears again in `on_selectColor_clicked` (line 100).\nUsing `strncmp` on a versioned ID with a hardcoded length is fragile: any future source ID\nthat starts with \"text_ft2_source\" would be falsely matched. The correct approach is to use\n`obs_source_get_unversioned_id` + `strcmp` throughout, consistent with the constructor's `ft2`\nvariable that already has the right answer.","fix":"Reuse the already-computed `ft2` variable (derived from `obs_source_get_unversioned_id`) instead\nof re-checking the versioned ID.\n\nIn the constructor, replace the inline `strncmp` on line 34:\n```cpp\n// before\nunsigned int val = (unsigned int)obs_data_get_int(\n    settings, (strncmp(obs_source_get_id(source), \"text_ft2_source\", 15) == 0) ? \"color1\" : \"color\");\n\n// after\nunsigned int val = (unsigned int)obs_data_get_int(settings, ft2 ? \"color1\" : \"color\");\n```\n\nIn `on_selectColor_clicked`, replace line 100:\n```cpp\n// before\nbool freetype = strncmp(obs_source_get_id(source), \"text_ft2_source\", 15) == 0;\n\n// after\nconst char *id = obs_source_get_unversioned_id(source);\nbool freetype = strcmp(id, \"text_ft2_source\") == 0;\n```","locations":[{"ref":"frontend/components/TextSourceToolbar.cpp:25-34","code":"   25 | \tconst char *id = obs_source_get_unversioned_id(source);\n   26 | \tbool ft2 = strcmp(id, \"text_ft2_source\") == 0;\n   27 | \tbool read_from_file = obs_data_get_bool(settings, ft2 ? \"from_file\" : \"read_from_file\");\n   28 | \n   29 | \tOBSDataAutoRelease font_obj = obs_data_get_obj(settings, \"font\");\n   30 | \tMakeQFont(font_obj, font);\n   31 | \n   32 | \t// Use \"color1\" if it's a freetype source and \"color\" elsewise\n   33 | \tunsigned int val = (unsigned int)obs_data_get_int(\n   34 | \t\tsettings, (strncmp(obs_source_get_id(source), \"text_ft2_source\", 15) == 0) ? \"color1\" : \"color\");","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/TextSourceToolbar.cpp#L25-L34"},{"ref":"frontend/components/TextSourceToolbar.cpp:100","code":"  100 | \tbool freetype = strncmp(obs_source_get_id(source), \"text_ft2_source\", 15) == 0;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/TextSourceToolbar.cpp#L100"}]},{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`TextSourceToolbar::on_selectColor_clicked` calls `obs_properties_get(props, ...)` and\nimmediately passes the result to `obs_property_description(p)` without checking for null.\n`obs_properties_get` returns null if the named property does not exist in `props` (which itself\nis initialized from the source's property list and could be empty or missing the color key).\nWhile `obs_property_description` is null-safe (returns null for a null `p`), the null `desc`\nstring is then passed as the title argument to `QColorDialog::getColor`. Qt silently accepts\na null C-string there, so there is no crash, but the dialog shows a generic untranslated title\ninstead of the expected property label. If a future caller checks `desc` before use, this will\nsurface as a latent null-dereference. A guard + fallback title is cleaner.","fix":"Add a null check and supply a fallback:\n```cpp\nobs_property_t *p = obs_properties_get(props, freetype ? \"color1\" : \"color\");\nconst char *desc = obs_property_description(p);\nQString title = desc ? QT_UTF8(desc) : QTStr(\"Basic.Main.Color\");\n// ...\nQColor newColor = QColorDialog::getColor(color, this, title, options);\n```","locations":[{"ref":"frontend/components/TextSourceToolbar.cpp:102-114","code":"  102 | \tobs_property_t *p = obs_properties_get(props, freetype ? \"color1\" : \"color\");\n  103 | \n  104 | \tconst char *desc = obs_property_description(p);\n  105 | \n  106 | \tQColorDialog::ColorDialogOptions options;\n  107 | \n  108 | \toptions |= QColorDialog::ShowAlphaChannel;\n  109 | #ifdef __linux__\n  110 | \t// TODO: Revisit hang on Ubuntu with native dialog\n  111 | \toptions |= QColorDialog::DontUseNativeDialog;\n  112 | #endif\n  113 | \n  114 | \tQColor newColor = QColorDialog::getColor(color, this, desc, options);","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/TextSourceToolbar.cpp#L102-L114"}]},{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`UrlPushButton::mousePressEvent` opens the target URL on mouse *button-down* rather than on a\nfull click (press then release). The base class `QPushButton::mousePressEvent` is never called,\nso the button never enters the visual pressed state and the `clicked()` signal is never emitted.\nThis creates two problems:\n1. The URL opens immediately on press even if the user drags away (they cannot cancel).\n2. Keyboard activation (Space/Enter on focused button) does not work, making the button\n   inaccessible to keyboard-only users and screen reader users.","fix":"Override `clicked()` instead of `mousePressEvent` to get correct press-release semantics and\nfree keyboard activation:\n```cpp\n// In UrlPushButton.hpp - remove the mousePressEvent override, add a slot\npublic slots:\n    void openUrl();\n\n// In UrlPushButton.cpp\nUrlPushButton::UrlPushButton(QWidget *parent) : QPushButton(parent)\n{\n    connect(this, &QPushButton::clicked, this, &UrlPushButton::openUrl);\n}\n\nvoid UrlPushButton::openUrl()\n{\n    if (!m_targetUrl.isEmpty())\n        QDesktopServices::openUrl(m_targetUrl);\n}\n```\nRemove `mousePressEvent` entirely.","locations":[{"ref":"frontend/components/UrlPushButton.cpp:18-27","code":"   18 | void UrlPushButton::mousePressEvent(QMouseEvent *event)\n   19 | {\n   20 | \tQ_UNUSED(event)\n   21 | \tQUrl openUrl = m_targetUrl;\n   22 | \tif (openUrl.isEmpty()) {\n   23 | \t\treturn;\n   24 | \t}\n   25 | \n   26 | \tQDesktopServices::openUrl(openUrl);\n   27 | }","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/frontend/components/UrlPushButton.cpp#L18-L27"}]},{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`coreaudio-output.c` (`audio_monitor_init`): The function initialises `monitor->empty_buffers` with three buffer pointers via `deque_push_back` (lines 214-215) before `pthread_mutex_init` succeeds (line 217). If the mutex init fails and the function returns `false`, `audio_monitor_free` will be called, which calls `deque_free(&monitor->empty_buffers)`. However, the queue references `AudioQueueBufferRef` objects that were allocated by `AudioQueueAllocateBuffer` and are owned by `monitor->queue`. But `audio_monitor_free` also calls `AudioQueueFreeBuffer` for each of `monitor->buffers[i]` *and* then `AudioQueueDispose`. Double-freeing the buffers via both `deque_free` clearing the deque structure and `AudioQueueFreeBuffer` is not an issue because the deque stores copies of the pointer values, not pointers-to-pointers. However, the buffers are enqueued in `empty_buffers` before the queue is started, so if `AudioQueueStart` fails the buffers are already in the deque but never submitted. The `fill_buffer` function will attempt to dequeue and submit them. This path seems safe in practice because `AudioQueueFreeBuffer` frees all buffers when `AudioQueueDispose` is called.\n\nMore critically: `pthread_mutex_init_value` is called at line 166 to set the mutex to an invalid value, but `pthread_mutex_init` is called at line 217 only after the buffers are pushed. Between lines 209-215 (the buffer allocation loop) and line 217 (mutex init), there is no mutex, but `monitor->empty_buffers` is already populated. If `buffer_audio` callback fires on one of the newly allocated buffers before the mutex is initialised, the mutex lock in `buffer_audio` (line 126) will operate on an uninitialised mutex.","fix":"Move `pthread_mutex_init` to before the buffer allocation loop (before line 208) so the mutex exists before any AudioQueue callbacks can fire. Also move `deque_push_back` for the empty buffers to after the mutex is initialised and after `AudioQueueStart`.","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-output.c:208-220","code":"  208 | \tfor (size_t i = 0; i < 3; i++) {\n  209 | \t\tstat = AudioQueueAllocateBuffer(monitor->queue, (UInt32)monitor->buffer_size, &monitor->buffers[i]);\n  210 | \t\tif (!success(stat, \"allocation of buffer\")) {\n  211 | \t\t\treturn false;\n  212 | \t\t}\n  213 | \n  214 | \t\tdeque_push_back(&monitor->empty_buffers, &monitor->buffers[i], sizeof(monitor->buffers[i]));\n  215 | \t}\n  216 | \n  217 | \tif (pthread_mutex_init(&monitor->mutex, NULL) != 0) {\n  218 | \t\tblog(LOG_WARNING, \"%s: %s\", __FUNCTION__, \"Failed to init mutex\");\n  219 | \t\treturn false;\n  220 | \t}","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/osx/coreaudio-output.c#L208-L220"},{"ref":"libobs/audio-monitoring/osx/coreaudio-output.c:166","code":"  166 | \tpthread_mutex_init_value(&monitor->mutex);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/osx/coreaudio-output.c#L166"}]},{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`pulseaudio-output.c` (`audio_monitor_reset`): after calling `audio_monitor_free(monitor)`, which destroys the playback mutex among other resources, the code then calls `pthread_mutex_lock(&monitor->playback_mutex)` on the now-destroyed mutex (line 505). This is undefined behaviour. The `pthread_mutex_init_value` macro used by `audio_monitor_init` initialises the mutex inside `new_monitor`, not `monitor`, so there is nothing valid to lock. By contrast, the WASAPI implementation (`wasapi-output.c`) correctly acquires `monitor->playback_mutex` before freeing, then re-initialises inside `audio_monitor_init` of the new monitor object.","fix":"Acquire the mutex before calling `audio_monitor_free`, then unlock after `audio_monitor_init` returns (mirroring the WASAPI pattern), or protect the reset via an external lock that is not destroyed during the reset:\n```c\nvoid audio_monitor_reset(struct audio_monitor *monitor)\n{\n    struct audio_monitor new_monitor = {0};\n    bool success;\n\n    pthread_mutex_lock(&monitor->playback_mutex);\n    audio_monitor_free(monitor);  /* destroys playback_mutex - do NOT unlock after */\n    /* mutex is gone; must not unlock */\n    success = audio_monitor_init(&new_monitor, monitor->source);\n    if (success) {\n        *monitor = new_monitor;\n        audio_monitor_init_final(monitor);\n    } else {\n        audio_monitor_free(&new_monitor);\n    }\n}\n```\nThe real fix is to hold a separate reset-protection lock that outlives the monitor's internal mutex.","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-output.c:499-514","code":"  499 | void audio_monitor_reset(struct audio_monitor *monitor)\n  500 | {\n  501 | \tstruct audio_monitor new_monitor = {0};\n  502 | \tbool success;\n  503 | \taudio_monitor_free(monitor);\n  504 | \n  505 | \tpthread_mutex_lock(&monitor->playback_mutex);\n  506 | \tsuccess = audio_monitor_init(&new_monitor, monitor->source);\n  507 | \tpthread_mutex_unlock(&monitor->playback_mutex);\n  508 | \n  509 | \tif (success) {\n  510 | \t\t*monitor = new_monitor;\n  511 | \t\taudio_monitor_init_final(monitor);\n  512 | \t} else {\n  513 | \t\taudio_monitor_free(&new_monitor);\n  514 | \t}","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/pulse/pulseaudio-output.c#L499-L514"}]},{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`pulseaudio_wrapper.c`: `get_default_id` allocates a buffer of `strlen(pdo->default_sink_name) + 9` bytes and then copies the sink name into it with `strcat`. However, `strcat` requires the destination to be a null-terminated string before appending, but the freshly `bzalloc`-d buffer is only guaranteed to be zero-initialised, not a valid C string (the first byte is `\\0`, which satisfies the requirement in this case). More importantly, the constant `9` is hardcoded but no `.monitor` suffix is appended here - the size accounting seems to be a leftover from a copy-paste from `devices_match` where `.monitor` is appended. In `get_default_id` only the bare sink name is needed, so `+ 9` is spurious. This wastes 8 bytes but is not a buffer overflow.\n\nIn `devices_match`, the same `+ 9` pattern is used to accommodate `\".monitor\"` (8 chars + NUL = 9). When `id2` is not `\"default\"`, the buffer is `strlen(id2) + 9` and `id2 + \".monitor\"` is concatenated. If `id2` already ends in `\".monitor\"`, the result would be `id2 + \".monitor\"` vs `id2`, so the comparison logic is wrong when the source is already a monitor device and neither side is `\"default\"`. This is a design-level logic error: a source whose `device_id` already is `\"sink.monitor\"` will never match the monitoring sink `\"sink\"` because `name2` becomes `\"sink.monitor.monitor\"`.","fix":"In `get_default_id`, change the allocation size to `strlen(...) + 1` since no suffix is appended. In `devices_match`, before appending `.monitor` to `id2`, check whether it already ends in `.monitor` to avoid double-suffixing.","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-wrapper.c:42-58","code":"   42 | void get_default_id(char **id)\n   43 | {\n   44 | \tpulseaudio_init();\n   45 | \tstruct pulseaudio_default_output *pdo = bzalloc(sizeof(struct pulseaudio_default_output));\n   46 | \tpulseaudio_get_server_info((pa_server_info_cb_t)pulseaudio_default_devices, (void *)pdo);\n   47 | \n   48 | \tif (!pdo->default_sink_name || !*pdo->default_sink_name) {\n   49 | \t\t*id = bzalloc(1);\n   50 | \t} else {\n   51 | \t\t*id = bzalloc(strlen(pdo->default_sink_name) + 9);\n   52 | \t\tstrcat(*id, pdo->default_sink_name);\n   53 | \t\tbfree(pdo->default_sink_name);\n   54 | \t}\n   55 | \n   56 | \tbfree(pdo);\n   57 | \tpulseaudio_unref();\n   58 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/pulse/pulseaudio-wrapper.c#L42-L58"},{"ref":"libobs/audio-monitoring/pulse/pulseaudio-wrapper.c:64-100","code":"   64 | bool devices_match(const char *id1, const char *id2)\n   65 | {\n   66 | \tbool match;\n   67 | \tchar *name_default = NULL;\n   68 | \tchar *name1 = NULL;\n   69 | \tchar *name2 = NULL;\n   70 | \n   71 | \tif (!id1 || !id2)\n   72 | \t\treturn false;\n   73 | \n   74 | \tif (strcmp(id1, \"default\") == 0) {\n   75 | \t\tget_default_id(&name_default);\n   76 | \t\tname1 = bzalloc(strlen(name_default) + 9);\n   77 | \t\tstrcat(name1, name_default);\n   78 | \t\tstrcat(name1, \".monitor\");\n   79 | \t} else {\n   80 | \t\tname1 = bstrdup(id1);\n   81 | \t}\n   82 | \n   83 | \tif (strcmp(id2, \"default\") == 0) {\n   84 | \t\tif (!name_default)\n   85 | \t\t\tget_default_id(&name_default);\n   86 | \t\tname2 = bzalloc(strlen(name_default) + 9);\n   87 | \t\tstrcat(name2, name_default);\n   88 | \t\tstrcat(name2, \".monitor\");\n   89 | \t} else {\n   90 | \t\tname2 = bzalloc(strlen(id2) + 9);\n   91 | \t\tstrcat(name2, id2);\n   92 | \t\tstrcat(name2, \".monitor\");\n   93 | \t}\n   94 | \n   95 | \tmatch = strcmp(name1, name2) == 0;\n   96 | \tbfree(name_default);\n   97 | \tbfree(name1);\n   98 | \tbfree(name2);\n   99 | \treturn match;\n  100 | }","lines":37,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/audio-monitoring/pulse/pulseaudio-wrapper.c#L64-L100"}]},{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`calldata.c` (`calldata_set_data`): when updating an existing parameter that is larger than the new value (the `cur_size > size` branch, lines 204-208), the `memmove` destination and source are computed as:\n```c\nmemmove(pos, pos + offset, bytes - (pos - data->stack));\n```\nHere `bytes = data->size - offset` and `offset = cur_size - size`. This shrinks the region after the parameter being updated. However, `pos` at this point still points to the data-size field of the existing entry (i.e., just after the name field), not to the start of the actual data payload. So the memmove slides the tail of the stack (everything from `pos` onwards) `offset` bytes earlier, overwriting the existing size header and data with the new data. The subsequent `cd_copy_data` then writes the new size and data at `pos`. This is correct *if* `pos` points to the first byte of the size+data field for the parameter found. Looking at `cd_getparam`: on a successful match, `*pos` is advanced past the name, leaving `pos` pointing at the data-size field for that parameter. So the logic is correct. However, the formula `bytes - (pos - data->stack)` computes the number of bytes from `pos` to the end of the stack, which is the correct memmove length. This appears correct on review - no bug here, just complex code.","fix":"No code change needed; consider adding a comment clarifying that `pos` points to the size-prefix of the parameter's data field at this point, and that `bytes` accounts for the full tail from `pos`.","locations":[{"ref":"libobs/callback/calldata.c:191-212","code":"  191 | \tif (cd_getparam(data, name, &pos)) {\n  192 | \t\tsize_t cur_size;\n  193 | \t\tmemcpy(&cur_size, pos, sizeof(size_t));\n  194 | \n  195 | \t\tif (cur_size < size) {\n  196 | \t\t\tsize_t offset = size - cur_size;\n  197 | \t\t\tsize_t bytes = data->size;\n  198 | \n  199 | \t\t\tif (!cd_ensure_capacity(data, &pos, bytes + offset))\n  200 | \t\t\t\treturn;\n  201 | \t\t\tmemmove(pos + offset, pos, bytes - (pos - data->stack));\n  202 | \t\t\tdata->size += offset;\n  203 | \n  204 | \t\t} else if (cur_size > size) {\n  205 | \t\t\tsize_t offset = cur_size - size;\n  206 | \t\t\tsize_t bytes = data->size - offset;\n  207 | \n  208 | \t\t\tmemmove(pos, pos + offset, bytes - (pos - data->stack));\n  209 | \t\t\tdata->size -= offset;\n  210 | \t\t}\n  211 | \n  212 | \t\tcd_copy_data(&pos, in, size);","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/callback/calldata.c#L191-L212"}]},{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `bounds_get_point`, the guard is `if (i > 8) return;` but valid indices are 0-7 (8 corners of a box). Index 8 is out of range and will not be caught. The correct guard should be `i >= 8`.","fix":"Change the guard to `>= 8`:\n```c\nif (i >= 8)\n    return;\n```","locations":[{"ref":"libobs/graphics/bounds.c:50-51","code":"   50 | \tif (i > 8)\n   51 | \t\treturn;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/bounds.c#L50-L51"}]},{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `bounds_plane_test` (`bounds.c`), the function declares return type `bool` but the three return statements return the integer constants `BOUNDS_OUTSIDE` (1), `BOUNDS_PARTIAL` (3), and `BOUNDS_INSIDE` (2). The header (`bounds.h`) also declares the function as returning `bool`. All callers that check for `BOUNDS_OUTSIDE`, `BOUNDS_PARTIAL`, or `BOUNDS_INSIDE` will get `true` for any non-zero value, making it impossible to distinguish the three cases. The return type must be `int` (or an enum) to be useful.","fix":"Change the return type to `int` in both the `.c` implementation and the `.h` declaration:\n```c\n// bounds.h\nEXPORT int bounds_plane_test(const struct bounds *b, const struct plane *p);\n\n// bounds.c\nint bounds_plane_test(const struct bounds *b, const struct plane *p)\n```","locations":[{"ref":"libobs/graphics/bounds.c:228-250","code":"  228 | bool bounds_plane_test(const struct bounds *b, const struct plane *p)\n  229 | {\n  230 | \tstruct vec3 vmin, vmax;\n  231 | \tint i;\n  232 | \n  233 | \tfor (i = 0; i < 3; i++) {\n  234 | \t\tif (p->dir.ptr[i] >= 0.0f) {\n  235 | \t\t\tvmin.ptr[i] = b->min.ptr[i];\n  236 | \t\t\tvmax.ptr[i] = b->max.ptr[i];\n  237 | \t\t} else {\n  238 | \t\t\tvmin.ptr[i] = b->max.ptr[i];\n  239 | \t\t\tvmax.ptr[i] = b->min.ptr[i];\n  240 | \t\t}\n  241 | \t}\n  242 | \n  243 | \tif (vec3_plane_dist(&vmin, p) > 0.0f)\n  244 | \t\treturn BOUNDS_OUTSIDE;\n  245 | \n  246 | \tif (vec3_plane_dist(&vmax, p) >= 0.0f)\n  247 | \t\treturn BOUNDS_PARTIAL;\n  248 | \n  249 | \treturn BOUNDS_INSIDE;\n  250 | }","lines":23,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/bounds.c#L228-L250"},{"ref":"libobs/graphics/bounds.h:71","code":"   71 | EXPORT bool bounds_plane_test(const struct bounds *b, const struct plane *p);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/bounds.h#L71"}]},{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Both `gs_param_get_annotation_by_idx` and `gs_technique_get_pass_by_idx` use `>` instead of\n`>=` for their bounds checks. When the caller passes `annotation e;\n  464 |     gif->frames[frame].frame_delay = 100;\n  465 |     gif->frames[frame].redraw_required = false;\n  466 | \n  467 |     /*    Invalidate any previous decoding we have of this frame\n  468 |     */\n  469 |     if (gif->decoded_frame == frame)\n  470 |         gif->decoded_frame = GIF_INVALID_FRAME;\n  471 | \n  472 |     /*    We pretend to initialise the frames, but really we just skip over all\n  473 |         the data contained within. This is all basically a cut down version of\n  474 |         gif_decode_frame that doesn't have any of the LZW bits in it.\n  475 |     */\n  476 | \n  477 |     /*    Initialise any extensions\n  478 |     */\n  479 |     gif->buffer_position = (unsigned int)(gif_data - gif->gif_data);\n  480 |     if ((return_value = gif_initialise_frame_extensions(gif, frame)) != GIF_OK)\n  481 |         return return_value;\n  482 |     gif_data = (gif->gif_data + gif->buffer_position);\n  483 |     gif_bytes = (unsigned int)(gif_end - gif_data);\n  484 | \n  485 |     /*    Check if we've finished\n  486 |     */\n  487 |     if ((gif_bytes = (unsigned int)(gif_end - gif_data)) < 1)\n  488 |         return GIF_INSUFFICIENT_FRAME_DATA;\n  489 |     else if (gif_data[0] == GIF_TRAILER) {\n  490 |         gif->buffer_position = (unsigned int)(gif_data - gif->gif_data);\n  491 |         gif->frame_count = frame + 1;\n  492 |         return GIF_OK;\n  493 |     }\n  494 | \n  495 |     /*    If we're not done, there should be an image descriptor\n  496 |     */\n  497 |     if (gif_data[0] != GIF_IMAGE_SEPARATOR) return GIF_FRAME_DATA_ERROR;\n  498 | \n  499 |     /*    Do some simple boundary checking\n  500 |     */\n  501 |     offset_x = gif_data[1] | (gif_data[2] << 8);\n  502 |     offset_y = gif_data[3] | (gif_data[4] << 8);\n  503 |     width = gif_data[5] | (gif_data[6] << 8);\n  504 |     height = gif_data[7] | (gif_data[8] << 8);\n  505 | \n  506 |     /*    Set up the redraw characteristics. We have to check for extending  (void *)gif->bitmap_callbacks.bitmap_get_buffer(gif->frame_image);\nif (!frame_data) {\n    return_value = GIF_INSUFFICIENT_MEMORY;\n    goto gif_decode_frame_exit;\n}\n```","locations":[{"ref":"libobs/graphics/libnsgif/libnsgif.c:885-888","code":"  885 |     assert(gif->bitmap_callbacks.bitmap_get_buffer);\n  886 |     frame_data = (void *)gif->bitmap_callbacks.bitmap_get_buffer(gif->frame_image);\n  887 |     if (!frame_data)\n  888 |         return GIF_INSUFFICIENT_MEMORY;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L885-L888"}]},{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `gif_decode_frame` (libnsgif.c line 909), the frame buffer is cleared with `memset((char*)frame_data, GIF_TRANSPARENT_COLOUR, gif->width * gif->height * sizeof(int))`. `GIF_TRANSPARENT_COLOUR` is defined as `0x00`, so this is a zero-fill and happens to be correct for clearing to transparent. However, `sizeof(int)` is used as the element size. The frame_data is a `uint32_t *` (RGBA pixels), and `sizeof(int)` is 4 on all target platforms, so it works today - but using `sizeof(uint32_t)` or `sizeof(*frame_data)` would be more correct and future-proof.","fix":"Replace `sizeof(int)` with `sizeof(uint32_t)` (or `4` explicitly) in the memset calls at lines 909 and 929 to make intent clear.","locations":[{"ref":"libobs/graphics/libnsgif/libnsgif.c:909","code":"  909 |             memset((char*)frame_data, GIF_TRANSPARENT_COLOUR, gif->width * gif->height * sizeof(int));","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L909"}]},{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `gif_decode_frame` (libnsgif.c line 938), after a recursive `gif_decode_frame` call for the GIF_FRAME_RESTORE case, `frame_data` is refreshed from `bitmap_get_buffer`. However if this second call also fails and returns early via the `gif_decode_frame_exit` label, the outer call's `frame_data` pointer is now stale (the buffer may have been reallocated). The outer call continues with a potentially dangling pointer at lines 963-999 after the recursion returns without error.","fix":"After checking `return_value` from the recursive call, also re-fetch `frame_data` before proceeding. The existing code at line 936-938 does re-fetch, but the check for `return_value != GIF_OK` at line 931 uses `goto gif_decode_frame_exit` which skips the re-fetch. Ensure `frame_data` is always re-fetched after any recursive call returns GIF_OK.","locations":[{"ref":"libobs/graphics/libnsgif/libnsgif.c:931-940","code":"  931 |                     if ((return_value = gif_decode_frame(gif, last_undisposed_frame)) != GIF_OK)\n  932 |                         goto gif_decode_frame_exit;\n  933 |                     /*    Get this frame's data\n  934 |                     */\n  935 |                     assert(gif->bitmap_callbacks.bitmap_get_buffer);\n  936 |                     frame_data = (void *)gif->bitmap_callbacks.bitmap_get_buffer(gif->frame_image);\n  937 |                     if (!frame_data)\n  938 |                         return GIF_INSUFFICIENT_MEMORY;\n  939 |                 }\n  940 |         }","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/8a5dab518be6e0ba1298d297f9a04e7dc7029f74/libobs/graphics/libnsgif/libnsgif.c#L931-L940"}]},{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `gif_next_code` (libnsgif.c), the parameter `code_size` is immediately suppressed with `(void)code_size` on line 1245, and `gif->code_size` is used instead throughout the function. The parameter is therefore misleading dead interface. Every caller passes `gif->code_size` anyway, so the function signatur
