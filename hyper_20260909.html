<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `Conn::poll` (client.rs), `set_initial_window_size` returns a `Result` that is propagated via the `?` operator, but the enclosing `Future::poll` signature returns `Poll<Result<(), h2::Error>>`. Specifically, when `Ponged::SizeUpdate` is received, the code calls `this.conn.set_initial_window_size(wnd)?` inside a `match` arm that has no explicit return type annotation - this compiles correctly. However, the error from `set_initial_window_size` will short-circuit the poll and return `Poll::Ready(Err(...))`, bypassing any further connection polling. The connection would then be abandoned mid-stream if the window size update fails, potentially leaving the client stuck waiting for responses that will never come because `ConnTask` returns `Poll::Ready(())` on conn completion, which signals the dispatch task to shut down.","fix":"After returning `Poll::Ready(Err(...))` from the window size failure, log the error explicitly and consider whether the connection should be cleanly shut down rather than just dropped. This is largely a correctness/robustness issue rather than a panic, but the abrupt drop of pending streams should be documented.","locations":[{"ref":"src/proto/h2/client.rs:237-252","code":"  237 |     fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {\n  238 |         let mut this = self.project();\n  239 |         match this.ponger.poll(cx) {\n  240 |             Poll::Ready(ping::Ponged::SizeUpdate(wnd)) => {\n  241 |                 this.conn.set_target_window_size(wnd);\n  242 |                 this.conn.set_initial_window_size(wnd)?;\n  243 |             }\n  244 |             Poll::Ready(ping::Ponged::KeepAliveTimedOut) => {\n  245 |                 debug!(\"connection keep-alive timed out\");\n  246 |                 return Poll::Ready(Ok(()));\n  247 |             }\n  248 |             Poll::Pending => {}\n  249 |         }\n  250 | \n  251 |         Pin::new(&mut this.conn).poll(cx)\n  252 |     }","lines":16,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/client.rs#L237-L252"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `ConnTask::poll` (client.rs), when `drop_rx` becomes ready (signalling the client was dropped), the code calls `this.cancel_tx.take().expect(\"ConnTask Future polled twice\")`. If `poll_next` on `drop_rx` somehow returns `Poll::Ready` a second time (e.g. due to a buggy waker or executor that re-polls after completion), the `expect` will panic. `drop_rx` is a `Receiver<Infallible>`, which is fused after receiving `None`, but if the executor violates the contract of not polling a completed future, this panics in production.","fix":"Guard with `if let Some(cancel_tx) = this.cancel_tx.take()` and drop it, removing the `.expect()`.","locations":[{"ref":"src/proto/h2/client.rs:353-359","code":"  353 |         if !this.drop_rx.is_terminated() && Pin::new(&mut this.drop_rx).poll_next(cx).is_ready() {\n  354 |             // mpsc has been dropped, hopefully polling\n  355 |             // the connection some more should start shutdown\n  356 |             // and then close.\n  357 |             trace!(\"send_request dropped, starting conn shutdown\");\n  358 |             drop(this.cancel_tx.take().expect(\"ConnTask Future polled twice\"));\n  359 |         }","lines":7,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/client.rs#L353-L359"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `PipeMap::poll` (client.rs), when the cancel receiver fires or the pipe completes, the code calls `this.conn_drop_ref.take().expect(\"Future polled twice\")` and `this.ping.take().expect(\"Future polled twice\")`. If an executor polls a completed future a second time, both `expect` calls will panic with an unhelpful message. While well-behaved executors do not do this, the `#[must_use]` comment on other futures and the general defense-in-depth practice in async Rust suggests these should not panic.","fix":"Replace `.expect(\"Future polled twice\")` with `.take()` (silently no-op on second poll) or use `if let Some(x) = x.take()` guards.","locations":[{"ref":"src/proto/h2/client.rs:491-493","code":"  491 |                 drop(this.conn_drop_ref.take().expect(\"Future polled twice\"));\n  492 |                 drop(this.ping.take().expect(\"Future polled twice\"));\n  493 |                 return Poll::Ready(());","lines":3,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/client.rs#L491-L493"},{"ref":"src/proto/h2/client.rs:508-509","code":"  508 |                 drop(this.conn_drop_ref.take().expect(\"Future polled twice\"));\n  509 |                 drop(this.ping.take().expect(\"Future polled twice\"));","lines":2,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/client.rs#L508-L509"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In Connection::send_request (HTTP/1), and identically in the HTTP/2 version, the oneshot receiver returning Err (the sender was dropped without sending) causes a panic: `panic!(\"dispatch dropped without returning error\")`. While the comment says this 'shouldn't happen', it is a panic in stable public API code reachable by any user. If the runtime drops the dispatch task due to a shutdown race, this fires.","fix":"Convert the panic to a proper error return, e.g. `Err(crate::Error::new_user_dispatch_gone())`, consistent with what the Callback::drop impl already sends.","locations":[{"ref":"src/client/conn/http1.rs:240","code":"  240 |                     Err(_canceled) => panic!(\"dispatch dropped without returning error\"),","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/client/conn/http1.rs#L240"},{"ref":"src/client/conn/http2.rs:173","code":"  173 |                     Err(_canceled) => panic!(\"dispatch dropped without returning error\"),","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/client/conn/http2.rs#L173"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In Connection::try_send_request (HTTP/1 and HTTP/2), the same `panic!(\"dispatch dropped without returning error\")` pattern is repeated.","fix":"Same fix as the send_request panics: return a proper error instead of panicking.","locations":[{"ref":"src/client/conn/http1.rs:270","code":"  270 |                     Err(_) => panic!(\"dispatch dropped without returning error\"),","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/client/conn/http1.rs#L270"},{"ref":"src/client/conn/http2.rs:204","code":"  204 |                     Err(_) => panic!(\"dispatch dropped without returning error\"),","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/client/conn/http2.rs#L204"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In SendWhen::poll, `this.call_back.take().expect(\"polled after complete\")` panics if the future is polled again after returning Poll::Ready. The struct stores the callback in an Option that is taken on every poll invocation. Once the future completes and returns Poll::Ready(()), call_back is None; a second poll (which is undefined behavior per the Future contract but still happens with some executors or select! misuse) will panic.","fix":"This is the standard approach for pinned futures, but adding a comment that this future must not be polled after completion would clarify intent. Alternatively, guard with an if-let instead of expect so the second poll is a no-op.","locations":[{"ref":"src/client/dispatch.rs:357","code":"  357 |         let mut call_back = this.call_back.take().expect(\"polled after complete\");","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/client/dispatch.rs#L357"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In common/date.rs, CachedDate::write_str does a direct slice assignment `self.bytes[self.pos..self.pos + len]` with no bounds check. If the formatted HttpDate string is ever longer than DATE_VALUE_LENGTH (29 bytes), this will panic. The debug_assert at line 83 catches this only in debug builds. A non-standard system clock, a date far in the future (year >= 10000, which needs 30 chars), or an httpdate format change would trigger this panic in release builds.","fix":"Add a release-mode bounds check, or use write_to_slice with a proper error path, or assert that the formatted string fits before writing. Document the assumption that HttpDate is always exactly 29 bytes.","locations":[{"ref":"src/common/date.rs:99-103","code":"   99 |         let len = s.len();\n  100 |         self.bytes[self.pos..self.pos + len].copy_from_slice(s.as_bytes());\n  101 |         self.pos += len;\n  102 |         Ok(())\n  103 |     }","lines":5,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/common/date.rs#L99-L103"},{"ref":"src/common/date.rs:83","code":"   83 |         debug_assert_eq!(self.pos, DATE_VALUE_LENGTH);","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/common/date.rs#L83"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In `ResponseFutMap::poll` (client.rs), after the response future resolves, the code calls `this.ping.take().expect(\"Future polled twice\")` and `this.send_stream.take().expect(\"Future polled twice\")`. Same problem as above - if the future is polled after completion, it panics. `ResponseFutMap` is used inside `SendWhen` which should prevent double-polling, but the panic is still a hard crash rather than a graceful failure.","fix":"Use option-based guards instead of `expect`.","locations":[{"ref":"src/proto/h2/client.rs:618-619","code":"  618 |         let ping = this.ping.take().expect(\"Future polled twice\");\n  619 |         let send_stream = this.send_stream.take().expect(\"Future polled twice\");","lines":2,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/client.rs#L618-L619"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"In hyper_request_set_body, the body pointer is consumed via Box::from_raw before the req pointer is null-checked. If body is non-null but req is null, the function takes ownership of body (creating a Box), then returns HYPERE_INVALID_ARG, dropping the Box and freeing the body. The C caller receives an error code but the body has already been freed. If the C caller retries with the same body pointer (reasonable on error), it causes use-after-free. The ownership transfer on error is undocumented.","fix":"Check req for null before taking ownership of body. Either reorder the non_null! checks (check req first using &mut *req before Box::from_raw(body)), or document clearly that body is always consumed even on error.","locations":[{"ref":"src/ffi/http_types.rs:248-253","code":"  248 |     fn hyper_request_set_body(req: *mut hyper_request, body: *mut hyper_body) -> hyper_code {\n  249 |         let body = non_null!(Box::from_raw(body) ?= hyper_code::HYPERE_INVALID_ARG);\n  250 |         let req = non_null!(&mut *req ?= hyper_code::HYPERE_INVALID_ARG);\n  251 |         *req.0.body_mut() = body.0;\n  252 |         hyper_code::HYPERE_OK\n  253 |     }","lines":6,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/http_types.rs#L248-L253"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"hyper_buf_copy does not null-check the buf pointer before calling slice::from_raw_parts(buf, len). If buf is null and len > 0, this is undefined behavior. The ffi_fn! macro has '?= ptr::null_mut()' for panics but cannot catch UB from a null pointer dereference in from_raw_parts.","fix":"Add a null check at the start of hyper_buf_copy: 'if buf.is_null() { return ptr::null_mut(); }'.","locations":[{"ref":"src/ffi/body.rs:261-266","code":"  261 |     fn hyper_buf_copy(buf: *const u8, len: size_t) -> *mut hyper_buf {\n  262 |         let slice = unsafe {\n  263 |             std::slice::from_raw_parts(buf, len)\n  264 |         };\n  265 |         Box::into_raw(Box::new(hyper_buf(Bytes::copy_from_slice(slice))))\n  266 |     } ?= ptr::null_mut()","lines":6,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/body.rs#L261-L266"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"hyper_buf_bytes, hyper_buf_len, and hyper_buf_free dereference the buf pointer without checking for null. hyper_buf_bytes and hyper_buf_len use 'unsafe { (*buf).0... }' directly, while hyper_buf_free uses 'unsafe { Box::from_raw(buf) }'. A null pointer passed by a C caller causes undefined behavior (null pointer dereference). The ffi_fn! catch_unwind does not protect against UB - only panics. Compare with hyper_body_free which correctly uses non_null!.","fix":"Use the non_null! macro in hyper_buf_bytes, hyper_buf_len, and hyper_buf_free, just as hyper_body_free does: 'non_null!(&*buf ?= std::ptr::null())' etc.","locations":[{"ref":"src/ffi/body.rs:277-278","code":"  277 |     fn hyper_buf_bytes(buf: *const hyper_buf) -> *const u8 {\n  278 |         unsafe { (*buf).0.as_ptr() }","lines":2,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/body.rs#L277-L278"},{"ref":"src/ffi/body.rs:284-285","code":"  284 |     fn hyper_buf_len(buf: *const hyper_buf) -> size_t {\n  285 |         unsafe { (*buf).0.len() }","lines":2,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/body.rs#L284-L285"},{"ref":"src/ffi/body.rs:293-295","code":"  293 |     fn hyper_buf_free(buf: *mut hyper_buf) {\n  294 |         drop(unsafe { Box::from_raw(buf) });\n  295 |     }","lines":3,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/body.rs#L293-L295"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"hyper_error_print does not null-check the dst pointer before calling slice::from_raw_parts_mut(dst, dst_len). If dst is null with dst_len > 0, this is undefined behavior. The err pointer is null-checked (via non_null!) but only after the unsafe slice creation from dst.","fix":"Add a null check for dst before calling slice::from_raw_parts_mut, or check dst.is_null() at the start and return 0.","locations":[{"ref":"src/ffi/error.rs:90-95","code":"   90 |     fn hyper_error_print(err: *const hyper_error, dst: *mut u8, dst_len: size_t) -> size_t {\n   91 |         let dst = unsafe {\n   92 |             std::slice::from_raw_parts_mut(dst, dst_len)\n   93 |         };\n   94 |         non_null!(&*err ?= 0).print_to(dst)\n   95 |     }","lines":6,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/error.rs#L90-L95"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"In hyper_request_set_method, slice::from_raw_parts(method, method_len) is called before the req null-check. If method is null with method_len > 0, this is UB. The same pattern appears in hyper_request_set_uri (line 141) and hyper_request_set_uri_parts (lines 176, 182, 188). Also, raw_name_value (called from hyper_headers_set and hyper_headers_add) does no null check on name or value before calling slice::from_raw_parts.","fix":"Add null checks for all data pointer arguments before constructing slices from them. For methods like raw_name_value, validate name and value are non-null at the start.","locations":[{"ref":"src/ffi/http_types.rs:107-111","code":"  107 |     fn hyper_request_set_method(req: *mut hyper_request, method: *const u8, method_len: size_t) -> hyper_code {\n  108 |         let bytes = unsafe {\n  109 |             std::slice::from_raw_parts(method, method_len as usize)\n  110 |         };\n  111 |         let req = non_null!(&mut *req ?= hyper_code::HYPERE_INVALID_ARG);","lines":5,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/http_types.rs#L107-L111"},{"ref":"src/ffi/http_types.rs:139-143","code":"  139 |     fn hyper_request_set_uri(req: *mut hyper_request, uri: *const u8, uri_len: size_t) -> hyper_code {\n  140 |         let bytes = unsafe {\n  141 |             std::slice::from_raw_parts(uri, uri_len as usize)\n  142 |         };\n  143 |         let req = non_null!(&mut *req ?= hyper_code::HYPERE_INVALID_ARG);","lines":5,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/http_types.rs#L139-L143"},{"ref":"src/ffi/http_types.rs:173-192","code":"  173 |         let mut builder = Uri::builder();\n  174 |         if !scheme.is_null() {\n  175 |             let scheme_bytes = unsafe {\n  176 |                 std::slice::from_raw_parts(scheme, scheme_len as usize)\n  177 |             };\n  178 |             builder = builder.scheme(scheme_bytes);\n  179 |         }\n  180 |         if !authority.is_null() {\n  181 |             let authority_bytes = unsafe {\n  182 |                 std::slice::from_raw_parts(authority, authority_len as usize)\n  183 |             };\n  184 |             builder = builder.authority(authority_bytes);\n  185 |         }\n  186 |         if !path_and_query.is_null() {\n  187 |             let path_and_query_bytes = unsafe {\n  188 |                 std::slice::from_raw_parts(path_and_query, path_and_query_len as usize)\n  189 |             };\n  190 |             builder = builder.path_and_query(path_and_query_bytes);\n  191 |         }\n  192 |         let req = non_null!(&mut *req ?= hyper_code::HYPERE_INVALID_ARG);","lines":20,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/http_types.rs#L173-L192"},{"ref":"src/ffi/http_types.rs:559-578","code":"  559 | unsafe fn raw_name_value(\n  560 |     name: *const u8,\n  561 |     name_len: size_t,\n  562 |     value: *const u8,\n  563 |     value_len: size_t,\n  564 | ) -> Result<(HeaderName, HeaderValue, Bytes), hyper_code> {\n  565 |     let name = std::slice::from_raw_parts(name, name_len);\n  566 |     let orig_name = Bytes::copy_from_slice(name);\n  567 |     let name = match HeaderName::from_bytes(name) {\n  568 |         Ok(name) => name,\n  569 |         Err(_) => return Err(hyper_code::HYPERE_INVALID_ARG),\n  570 |     };\n  571 |     let value = std::slice::from_raw_parts(value, value_len);\n  572 |     let value = match HeaderValue::from_bytes(value) {\n  573 |         Ok(val) => val,\n  574 |         Err(_) => return Err(hyper_code::HYPERE_INVALID_ARG),\n  575 |     };\n  576 | \n  577 |     Ok((name, value, orig_name))\n  578 | }","lines":20,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/http_types.rs#L559-L578"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In hyper_io::poll_read, when the C callback returns ok bytes read, buf.advance(ok) is called with no check that ok <= buf.remaining(). If the C callback lies and returns a count larger than the buffer size, advance() will set buf.filled beyond buf.raw.len(). A subsequent call to as_mut() (which slices raw[filled..]) will then panic with an out-of-bounds index. That panic propagates through FuturesUnordered, poisons the executor's driver Mutex, and permanently breaks the executor (every subsequent poll_next call panics via panic_if_poisoned, which is caught by ffi_fn! returning null_mut()).","fix":"After receiving ok from the C callback, validate that ok <= buf.remaining() before calling buf.advance(ok). Return an error if it is out of range.","locations":[{"ref":"src/ffi/io.rs:159-163","code":"  159 |             ok => {\n  160 |                 // We have to trust that the user's read callback actually\n  161 |                 // filled in that many bytes... :(\n  162 |                 unsafe { buf.advance(ok) };\n  163 |                 Poll::Ready(Ok(()))","lines":5,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/io.rs#L159-L163"},{"ref":"src/rt/io.rs:341-343","code":"  341 |     pub unsafe fn advance(&mut self, n: usize) {\n  342 |         self.buf.filled = self.buf.filled.checked_add(n).expect(\"overflow\");\n  343 |         self.buf.init = self.buf.filled.max(self.buf.init);","lines":3,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/rt/io.rs#L341-L343"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `ChunkedState::read_body` (decode.rs lines 483-511), after reading bytes, `*rem -= count as u64` is performed. If `count > usize::MAX` as u64 (impossible on current platforms since count is a usize), this would underflow. However, the real issue is that `to_read = usize::try_from(*rem).unwrap_or(usize::MAX)` caps the request at usize::MAX, but if the underlying `read_mem` returns MORE bytes than requested (which is allowed by the `MemRead` trait contract if the implementation is buggy), then `count as u64 > *rem` could be true and the subtraction `*remaining -= num` in the Length decoder (lines 158-166) handles this with a branch. However in `read_body`, the subtraction on line 504 `*rem -= count as u64` has NO guard: if `count as u64 > *rem`, this underflows and wraps (in release mode) or panics (in debug mode). The check `if count == 0` on line 496 only catches the EOF case.","fix":"Add a guard: `if count as u64 > *rem { *rem = 0; } else { *rem -= count as u64; }` mirroring the Length decoder's pattern at lines 158-160. While the `read_mem` contract should prevent count > to_read, defensive coding is warranted here for correctness.","locations":[{"ref":"src/proto/h1/decode.rs:476-504","code":"  476 |     fn read_body<R: MemRead>(\n  477 |         cx: &mut Context<'_>,\n  478 |         rdr: &mut R,\n  479 |         rem: &mut u64,\n  480 |         buf: &mut Option<Bytes>,\n  481 |     ) -> Poll<Result<ChunkedState, io::Error>> {\n  482 |         trace!(\"Chunked read, remaining={:?}\", rem);\n  483 | \n  484 |         // cap remaining bytes at the max capacity of usize\n  485 |         let to_read = usize::try_from(*rem).unwrap_or(usize::MAX);\n  486 |         let slice = ready!(rdr.read_mem(cx, to_read))?;\n  487 |         let count = slice.len();\n  488 | \n  489 |         if count == 0 {\n  490 |             *rem = 0;\n  491 |             return Poll::Ready(Err(io::Error::new(\n  492 |                 io::ErrorKind::UnexpectedEof,\n  493 |                 IncompleteBody,\n  494 |             )));\n  495 |         }\n  496 |         *buf = Some(slice);\n  497 |         *rem -= count as u64;\n  498 | \n  499 |         if *rem > 0 {\n  500 |             Poll::Ready(Ok(ChunkedState::Body))\n  501 |         } else {\n  502 |             Poll::Ready(Ok(ChunkedState::BodyCr))\n  503 |         }\n  504 |     }","lines":29,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/decode.rs#L476-L504"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `server.rs` `poll_server`, when a CONNECT request has a non-zero Content-Length, the code resets the stream and then returns `Poll::Ready(Ok(()))` (line 293). This causes `poll_server` to return success even though a protocol error was encountered - it terminates the entire server connection accept loop as if it completed gracefully, rather than continuing to accept new streams. All subsequent client requests on this H2 connection are silently dropped.","fix":"Instead of `return Poll::Ready(Ok(()))`, log the error and `continue` the loop (accepting the next stream). The stream was already reset via `respond.send_reset`, so connection is intact. Only the individual stream should be aborted, not the server loop.","locations":[{"ref":"src/proto/h2/server.rs:287-291","code":"  287 |                             if content_length.map_or(false, |len| len != 0) {\n  288 |                                 warn!(\"h2 connect request with non-zero body not supported\");\n  289 |                                 respond.send_reset(h2::Reason::INTERNAL_ERROR);\n  290 |                                 return Poll::Ready(Ok(()));\n  291 |                             }","lines":5,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/server.rs#L287-L291"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In Sender::can_send (HTTP/1 dispatch), after the channel's receiver has been polled once and set buffered_once=true, additional sends are permanently rejected even after the receiver becomes ready again (giver.give() returns true). Looking at the test 'sender_checks_for_want_on_send' (lines 459-467): after the receiver processes item 1 and then wants again, tx.try_send(Custom(2)) is still rejected with 'expect_err(\"2 still not ready\")'. The intent is correct per the test, but it means once the one buffered slot is used, all subsequent sends require the giver to be in the 'wanting' state. However `can_send` returns `true` if `giver.give()` succeeds regardless of `buffered_once`. The comment says 'one message is always allowed', but the boolean is never reset to false when the giver says it's ready, so it is actually providing no benefit after the first buffered send - the logic degenerates to just using the giver. The `buffered_once` flag is set but never cleared, making the buffering truly a one-time thing for the entire channel lifetime, not per-roundtrip as the comment suggests.","fix":"If the intent is to allow one buffer per roundtrip (i.e., one un-acked message at a time), buffered_once should be reset to false when giver.give() succeeds. Document whether one-time-ever or per-roundtrip is intended.","locations":[{"ref":"src/client/dispatch.rs:93-104","code":"   93 |     fn can_send(&mut self) -> bool {\n   94 |         if self.giver.give() || !self.buffered_once {\n   95 |             // If the receiver is ready *now*, then of course we can send.\n   96 |             //\n   97 |             // If the receiver isn't ready yet, but we don't have anything\n   98 |             // in the channel yet, then allow one message.\n   99 |             self.buffered_once = true;\n  100 |             true\n  101 |         } else {\n  102 |             false\n  103 |         }\n  104 |     }","lines":12,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/client/dispatch.rs#L93-L104"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In common/buf.rs BufList::advance, when cnt equals the remaining bytes of the front buffer exactly, the code calls `front.advance(rem)` followed by `self.bufs.pop_front()`. However, the pop happens after the inner scope releases the borrow of front. This is structurally correct in Rust, but the issue is different: if bufs is empty and advance is called with cnt > 0, `self.bufs[0]` will panic with an index out of bounds. The Buf trait requires callers to not advance past remaining(), but there's no assertion or graceful handling here.","fix":"Add a debug_assert at the top of advance: `debug_assert!(cnt <= self.remaining())` to catch misuse early and document the precondition.","locations":[{"ref":"src/common/buf.rs:41-55","code":"   41 |     fn advance(&mut self, mut cnt: usize) {\n   42 |         while cnt > 0 {\n   43 |             {\n   44 |                 let front = &mut self.bufs[0];\n   45 |                 let rem = front.remaining();\n   46 |                 if rem > cnt {\n   47 |                     front.advance(cnt);\n   48 |                     return;\n   49 |                 } else {\n   50 |                     front.advance(rem);\n   51 |                     cnt -= rem;\n   52 |                 }\n   53 |             }\n   54 |             self.bufs.pop_front();\n   55 |         }","lines":15,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/common/buf.rs#L41-L55"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In hyper_headers_foreach when iterating in the ordered path, if headers.headers.get_all(name).iter().nth(*idx) returns None (indicating desync between orig_order and headers), the function silently returns without notifying the caller. The comment says 'something has gone wrong' but provides no error signal. The callback is not invoked for remaining headers, so the C caller receives a silently truncated header list.","fix":"Consider returning an error or calling the callback with whatever data is available. At minimum, document that iteration may stop early without any indication to the caller.","locations":[{"ref":"src/ffi/http_types.rs:473-479","code":"  473 |                 if let Some(value) = headers.headers.get_all(name).iter().nth(*idx) {\n  474 |                     val_ptr = value.as_bytes().as_ptr();\n  475 |                     val_len = value.as_bytes().len();\n  476 |                 } else {\n  477 |                     // Stop iterating, something has gone wrong.\n  478 |                     return;\n  479 |                 }","lines":7,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/http_types.rs#L473-L479"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The IO sentinel values HYPER_IO_PENDING (0xFFFFFFFF = 4294967295) and HYPER_IO_ERROR (0xFFFFFFFE = 4294967294) are 32-bit values but size_t is usize (64-bit on 64-bit platforms). A C callback that legitimately reads or writes exactly 4294967295 bytes will be misinterpreted as PENDING. While extremely unlikely in practice, the values should be SIZE_MAX and SIZE_MAX-1 respectively to be safe on all platforms. The C header exposes them as integer literals (not (size_t)~0), making the collision theoretically possible.","fix":"Define HYPER_IO_PENDING as (size_t)(-1) and HYPER_IO_ERROR as (size_t)(-2) in the C header, and update the Rust constants to usize::MAX and usize::MAX - 1.","locations":[{"ref":"src/ffi/io.rs:11-14","code":"   11 | pub const HYPER_IO_PENDING: size_t = 0xFFFFFFFF;\n   12 | /// Sentinel value to return from a read or write callback that the operation\n   13 | /// has errored.\n   14 | pub const HYPER_IO_ERROR: size_t = 0xFFFFFFFE;","lines":4,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/io.rs#L11-L14"},{"ref":"capi/include/hyper.h:48-53","code":"   48 | #define HYPER_IO_PENDING 4294967295\n   49 | \n   50 | /*\n   51 |  Sentinel value to return from a read or write callback that the operation\n   52 |  */\n   53 | #define HYPER_IO_ERROR 4294967294","lines":6,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/capi/include/hyper.h#L48-L53"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In hyper_io poll_read, when the user's C read callback returns 0 (which happens with the default read_noop), buf.advance(0) is called and Poll::Ready(Ok(())) is returned. Per the Write trait docs, returning Poll::Ready(Ok(())) with no bytes advanced signals EOF to hyper. This means a hyper_io object created with hyper_io_new() but without setting a read callback will immediately signal EOF when hyper attempts to read, causing an unexpected EOF error. Similarly, write_noop returns 0 which means Poll::Ready(Ok(0)) from poll_write, signaling the transport can no longer accept bytes.","fix":"read_noop should return HYPER_IO_PENDING (not 0) to indicate no data yet available, and write_noop should also return HYPER_IO_PENDING. This avoids spurious EOF/closed signals on unconfigured transports.","locations":[{"ref":"src/ffi/io.rs:124-142","code":"  124 | /// cbindgen:ignore\n  125 | extern \"C\" fn read_noop(\n  126 |     _userdata: *mut c_void,\n  127 |     _: *mut hyper_context<'_>,\n  128 |     _buf: *mut u8,\n  129 |     _buf_len: size_t,\n  130 | ) -> size_t {\n  131 |     0\n  132 | }\n  133 | \n  134 | /// cbindgen:ignore\n  135 | extern \"C\" fn write_noop(\n  136 |     _userdata: *mut c_void,\n  137 |     _: *mut hyper_context<'_>,\n  138 |     _buf: *const u8,\n  139 |     _buf_len: size_t,\n  140 | ) -> size_t {\n  141 |     0\n  142 | }","lines":19,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/io.rs#L124-L142"},{"ref":"src/ffi/io.rs:159-165","code":"  159 |             ok => {\n  160 |                 // We have to trust that the user's read callback actually\n  161 |                 // filled in that many bytes... :(\n  162 |                 unsafe { buf.advance(ok) };\n  163 |                 Poll::Ready(Ok(()))\n  164 |             }\n  165 |         }","lines":7,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/io.rs#L159-L165"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"HYPER_POLL_ERROR is defined as 3, skipping value 2. The constants are HYPER_POLL_READY=0, HYPER_POLL_PENDING=1, (gap at 2), HYPER_POLL_ERROR=3. In UserBody::poll_data, any return value other than 0, 1, or 3 falls to the 'unexpected' error arm. A C caller accidentally returning 2 (which might seem like a reasonable constant given the sequence) gets a body write error rather than any meaningful diagnostic. This gap is undocumented in the constants.","fix":"Either assign HYPER_POLL_ERROR = 2 to close the gap, or add a comment explaining why value 2 is intentionally skipped.","locations":[{"ref":"src/ffi/task.rs:22-29","code":"   22 | pub const HYPER_POLL_READY: c_int = 0;\n   23 | /// Return in a poll function to indicate it is still pending.\n   24 | ///\n   25 | /// The passed in `hyper_waker` should be registered to wake up the task at\n   26 | /// some later point.\n   27 | pub const HYPER_POLL_PENDING: c_int = 1;\n   28 | /// Return in a poll function indicate an error.\n   29 | pub const HYPER_POLL_ERROR: c_int = 3;","lines":8,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/task.rs#L22-L29"},{"ref":"src/ffi/body.rs:217-233","code":"  217 |             super::task::HYPER_POLL_READY => {\n  218 |                 if out.is_null() {\n  219 |                     Poll::Ready(None)\n  220 |                 } else {\n  221 |                     let buf = unsafe { Box::from_raw(out) };\n  222 |                     Poll::Ready(Some(Ok(Frame::data(buf.0))))\n  223 |                 }\n  224 |             }\n  225 |             super::task::HYPER_POLL_PENDING => Poll::Pending,\n  226 |             super::task::HYPER_POLL_ERROR => {\n  227 |                 Poll::Ready(Some(Err(crate::Error::new_body_write_aborted())))\n  228 |             }\n  229 |             unexpected => Poll::Ready(Some(Err(crate::Error::new_body_write(format!(\n  230 |                 \"unexpected hyper_body_data_func return code {}\",\n  231 |                 unexpected\n  232 |             ))))),\n  233 |         }","lines":17,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/body.rs#L217-L233"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `ChunkedState::read_trailer_lf`, the counter check `if *trailers_cnt >= h1_max_headers` fires BEFORE the `\\n` byte is appended and BEFORE `*trailers_cnt += 1`, so the limit enforced is `h1_max_headers - 1` successful trailers, not `h1_max_headers`. Concretely, if `h1_max_headers = 10` the 10th trailer header (index 9, i.e. when `trailers_cnt == 9 >= 10` is false) will be accepted, but the 11th will cause the `trailers_cnt == 10 >= 10` check to fire. However, in `poll` in the Chunked arm, the same check `if *trailers_cnt >= h1_max_headers` is applied again. This means a message with exactly `h1_max_headers` trailers is parsed correctly but is then rejected at the outer check in `poll`. This is an off-by-one: the outer guard in `decode` is redundant and confusingly inverts the intent.","fix":"Either remove the redundant check in `poll` (lines 205-209), or change the check in `read_trailer_lf` to `> h1_max_headers` to make the two consistent and match documented semantics.","locations":[{"ref":"src/proto/h1/decode.rs:562-567","code":"  562 |                 if *trailers_cnt >= h1_max_headers {\n  563 |                     return Poll::Ready(Err(io::Error::new(\n  564 |                         io::ErrorKind::InvalidData,\n  565 |                         \"chunk trailers count overflow\",\n  566 |                     )));\n  567 |                 }","lines":6,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/decode.rs#L562-L567"},{"ref":"src/proto/h1/decode.rs:562-566","code":"  562 |                 if *trailers_cnt >= h1_max_headers {\n  563 |                     return Poll::Ready(Err(io::Error::new(\n  564 |                         io::ErrorKind::InvalidData,\n  565 |                         \"chunk trailers count overflow\",\n  566 |                     )));","lines":5,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/decode.rs#L562-L566"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Dispatcher::poll_write` (dispatch.rs lines 353-370), when `body.is_end_stream()` is detected after `poll_frame` returns a data frame, `write_body_and_end` is called. However, `write_body_and_end` calls `encoder.encode_and_end` which, for a `Length` encoder, returns `can_keep_alive = false` if the written bytes are less than the remaining content-length. This is correct behavior. But a subtle issue arises: if `is_end_stream()` returns true but the body's `poll_frame` later yields more frames (which is a contract violation from the body), the dispatcher has already set `*clear_body = true` and will not poll the body again, silently discarding remaining data.","fix":"This is a body contract violation from the user's code, but it may be worth adding a debug assertion or trace log when additional frames are available after `is_end_stream()` returned true.","locations":[{"ref":"src/proto/h1/dispatch.rs:408-418","code":"  408 |                         if frame.is_data() {\n  409 |                             let chunk = frame.into_data().unwrap_or_else(|_| unreachable!());\n  410 |                             let eos = body.is_end_stream();\n  411 |                             if eos {\n  412 |                                 *clear_body = true;\n  413 |                                 if chunk.remaining() == 0 {\n  414 |                                     trace!(\"discarding empty chunk\");\n  415 |                                     self.conn.end_body()?;\n  416 |                                 } else {\n  417 |                                     self.conn.write_body_and_end(chunk);\n  418 |                                 }","lines":11,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/dispatch.rs#L408-L418"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Server::encode_headers`, when a `Content-Length: N` header is encountered and `msg.body` is `None` (no body), and `msg.req_method` is NOT `HEAD`, the code emits a warning when value != b\"0\" but then executes `continue 'headers` WITHOUT writing the header to `dst` and WITHOUT setting `wrote_len = true`. This means a non-zero Content-Length on a body-less response is silently dropped. The `wrote_len` flag is also not set, so the encoder will later write `content-length: 0` automatically (via the `can_have_implicit_zero_content_length` path). The caller supplied a non-zero Content-Length but it is silently replaced with 0. Callers expect their headers to be forwarded, or at minimum to receive an error.","fix":"Either return an error when a non-zero Content-Length is provided with no body (other than for HEAD), or document that the header will be replaced.","locations":[{"ref":"src/proto/h1/role.rs:784-803","code":"  784 |                         None => {\n  785 |                             // We have no body to actually send,\n  786 |                             // but the headers claim a content-length.\n  787 |                             // There's only 2 ways this makes sense:\n  788 |                             //\n  789 |                             // - The header says the length is `0`.\n  790 |                             // - This is a response to a `HEAD` request.\n  791 |                             if msg.req_method == &Some(Method::HEAD) {\n  792 |                                 debug_assert_eq!(encoder, Encoder::length(0));\n  793 |                             } else {\n  794 |                                 if value.as_bytes() != b\"0\" {\n  795 |                                     warn!(\n  796 |                                         \"content-length value found, but empty body provided: {:?}\",\n  797 |                                         value\n  798 |                                     );\n  799 |                                 }\n  800 |                                 continue 'headers;\n  801 |                             }\n  802 |                         }\n  803 |                     }","lines":20,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/role.rs#L784-L803"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `poll_pipe` (client.rs lines 533-563), when `!f.is_connect && !f.eos`, a `PipeToSendStream` is created and eagerly polled once. If the first poll returns `Poll::Ready(_)`, the pipe is dropped without executing `drop(conn_drop_ref)` and `drop(ping)`. The `conn_drop_ref` and `ping` were not moved into `PipeMap` (since we never created one), and were not dropped either - they are still held by `self` (the `ClientTask`). The `conn_drop_ref` is `self.conn_drop_ref.clone()` (line 542), so the clone is just dropped when `pipe` is dropped at the end of the `match` arm. The `ping` clone from line 527 (`let ping = self.ping.clone()`) is also dropped at the end of `poll_pipe`. So both are correctly dropped. However, the `cancel_tx` created at line 531 is dropped without sending, while `cancel_rx` was never moved anywhere (we never entered the `Poll::Pending` branch). This means the cancel channel leaks without being consumed, but since both ends are dropped immediately this is benign.","fix":"This is benign but confusing. Add a comment explaining that when the pipe completes eagerly, the `cancel_rx` is simply dropped along with `cancel_tx` since no `PipeMap` was spawned.","locations":[{"ref":"src/proto/h2/client.rs:526-578","code":"  526 |     fn poll_pipe(&mut self, f: FutCtx<B>, cx: &mut Context<'_>) {\n  527 |         let ping = self.ping.clone();\n  528 | \n  529 |         // A one-shot channel so that send_task can tell pipe_task to\n  530 |         // reset the stream when the client cancels the request.\n  531 |         let (cancel_tx, cancel_rx) = oneshot::channel::<()>();\n  532 | \n  533 |         let send_stream = if !f.is_connect {\n  534 |             if !f.eos {\n  535 |                 let mut pipe = PipeToSendStream::new(f.body, f.body_tx);\n  536 | \n  537 |                 // eagerly see if the body pipe is ready and\n  538 |                 // can thus skip allocating in the executor\n  539 |                 match Pin::new(&mut pipe).poll(cx) {\n  540 |                     Poll::Ready(_) => (),\n  541 |                     Poll::Pending => {\n  542 |                         let conn_drop_ref = self.conn_drop_ref.clone();\n  543 |                         // keep the ping recorder's knowledge of an\n  544 |                         // \"open stream\" alive while this body is\n  545 |                         // still sending...\n  546 |                         let ping = ping.clone();\n  547 | \n  548 |                         let pipe = PipeMap {\n  549 |                             pipe,\n  550 |                             conn_drop_ref: Some(conn_drop_ref),\n  551 |                             ping: Some(ping),\n  552 |                             cancel_rx: Some(cancel_rx),\n  553 |                         };\n  554 |                         // Clear send task\n  555 |                         self.executor\n  556 |                             .execute_h2_future(H2ClientFuture::Pipe { pipe });\n  557 |                     }\n  558 |                 }\n  559 |             }\n  560 | \n  561 |             None\n  562 |         } else {\n  563 |             Some(f.body_tx)\n  564 |         };\n  565 | \n  566 |         self.executor.execute_h2_future(H2ClientFuture::Send {\n  567 |             send_when: SendWhen {\n  568 |                 when: ResponseFutMap {\n  569 |                     fut: f.fut,\n  570 |                     ping: Some(ping),\n  571 |                     send_stream: Some(send_stream),\n  572 |                     exec: self.executor.clone(),\n  573 |                     cancel_tx: Some(cancel_tx),\n  574 |                 },\n  575 |                 call_back: Some(f.cb),\n  576 |             },\n  577 |         });\n  578 |     }","lines":53,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/client.rs#L526-L578"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `PipeToSendStream::poll` (mod.rs), the code polls `me.body_tx.poll_reset(cx)` on every iteration of the outer loop to detect RST_STREAM. When `buffered_data` is `Some` and we are in the inner capacity-waiting loop, the outer RST_STREAM check is only done at the top of the outer loop. After `break`ing out of the inner capacity loop, the code immediately sends the buffered data without re-checking for RST_STREAM. If RST_STREAM arrives while waiting for capacity, it will be missed until the next outer loop iteration (after the send). This means one extra `send_data` call may be made to a reset stream, which the h2 library should handle gracefully with an error, but the RST_STREAM handling is delayed.","fix":"After breaking from the capacity loop (line 175), re-poll `poll_reset` before calling `send_data` on the buffered chunk.","locations":[{"ref":"src/proto/h2/mod.rs:160-187","code":"  160 |             if me.buffered_data.is_some() {\n  161 |                 while me.body_tx.capacity() == 0 {\n  162 |                     match ready!(me.body_tx.poll_capacity(cx)) {\n  163 |                         Some(Ok(0)) => {}\n  164 |                         Some(Ok(_)) => break,\n  165 |                         Some(Err(e)) => return Poll::Ready(Err(crate::Error::new_body_write(e))),\n  166 |                         None => {\n  167 |                             // None means the stream is no longer in a\n  168 |                             // streaming state, we either finished it\n  169 |                             // somehow, or the remote reset us.\n  170 |                             return Poll::Ready(Err(crate::Error::new_body_write(\n  171 |                                 \"send stream capacity unexpectedly closed\",\n  172 |                             )));\n  173 |                         }\n  174 |                     }\n  175 |                 }\n  176 | \n  177 |                 let peeked = me.buffered_data.take().expect(\"checked is_some above\");\n  178 |                 let buf = SendBuf::Buf(peeked.data);\n  179 |                 me.body_tx\n  180 |                     .send_data(buf, peeked.is_eos)\n  181 |                     .map_err(crate::Error::new_body_write)?;\n  182 | \n  183 |                 if peeked.is_eos {\n  184 |                     return Poll::Ready(Ok(()));\n  185 |                 }\n  186 |                 continue;\n  187 |             }","lines":28,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/mod.rs#L160-L187"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Ponger::poll` (ping.rs), when `poll_pong` returns `Poll::Ready(Ok(_pong))` for a BDP ping, the keep-alive state is updated by calling `ka.maybe_schedule(is_idle, &locked)` and `ka.maybe_ping(cx, is_idle, &mut locked)` (lines 291-293). However, `is_idle` was computed at the start of `poll()` before the pong was received. If receiving the pong indicates that a stream just closed (reducing strong_count), the `is_idle` value used for rescheduling the keep-alive is stale. This is a minor timing issue - the keep-alive may be (re)scheduled with a stale idle state.","fix":"Recompute `is_idle` before calling `maybe_schedule`/`maybe_ping` after receiving the pong, or document that a one-poll lag is acceptable.","locations":[{"ref":"src/proto/h2/ping.rs:266-269","code":"  266 |     pub(super) fn poll(&mut self, cx: &mut task::Context<'_>) -> Poll<Ponged> {\n  267 |         let mut locked = self.shared.lock().panic_if_poisoned();\n  268 |         let now = locked.timer.now(); // hoping this is fine to move within the lock\n  269 |         let is_idle = self.is_idle();","lines":4,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/ping.rs#L266-L269"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Ponger::is_idle` (ping.rs), the connection is considered idle when `Arc::strong_count(&self.shared) <= 2`. The count of 2 represents `Ponger` itself plus one `Recorder`. However, if ping is disabled for the body stream (e.g. `Recorder::for_stream` returns `disabled()` when stream is already EOS), the count can drop to 1 (only `Ponger`), which is still `<= 2` and treated as idle - that is correct. But if multiple streams are in flight, each has its own cloned `Recorder` (strong_count increases), so the idle check does work correctly. The concern is: the comment says 'Arc::strong_count <= 2' implies idle, but if somehow there were 2 real recorders plus Ponger (count=3), it would incorrectly be considered not-idle even with 0 open streams, since recorders can outlive streams. This is a minor over-counting scenario but the heuristic is fragile.","fix":"Document the idle-detection heuristic's limitations. Consider tracking open stream count explicitly for more accurate idle detection.","locations":[{"ref":"src/proto/h2/ping.rs:326-328","code":"  326 |     fn is_idle(&self) -> bool {\n  327 |         Arc::strong_count(&self.shared) <= 2\n  328 |     }","lines":3,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/ping.rs#L326-L328"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `KeepAlive::maybe_ping` (ping.rs), when the sleep timer fires in `Scheduled` state, there is a check `if !self.while_idle && is_idle` that causes the function to return without sending a ping and without transitioning state back to `Init`. The state remains `KeepAliveState::Scheduled(at)` with an expired timer, but no new scheduling occurs. On the next poll, `maybe_schedule` sees `Scheduled(..)` state and does nothing (line 447: `KeepAliveState::Scheduled(..) => ()`). This means that after a while-idle=false connection goes idle after the timer fires, keep-alive never resumes even when a new stream starts (making the connection no longer idle).","fix":"When `!self.while_idle && is_idle` and the timer has fired, transition to `KeepAliveState::Init` so that `maybe_schedule` will reschedule when activity resumes.","locations":[{"ref":"src/proto/h2/ping.rs:469-472","code":"  469 |                 if !self.while_idle && is_idle {\n  470 |                     trace!(\"keep-alive no need to ping when idle and while_idle=false\");\n  471 |                     return;\n  472 |                 }","lines":4,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/ping.rs#L469-L472"},{"ref":"src/proto/h2/ping.rs:447","code":"  447 |             KeepAliveState::Scheduled(..) => (),","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/ping.rs#L447"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `H2Stream::poll2` (server.rs), the CONNECT success handling checks for a non-zero Content-Length header and resets the stream. But then after the `if res.status().is_success()` block, execution falls through to the general body-sending code (line 518: `if !body.is_end_stream()`). For a CONNECT response that fails (non-success status), the response is sent through the general path. However, `connect_parts` was taken from the Option at line 488, so if the service returned a non-success response to CONNECT, `connect_parts` is gone and the upgrade never happens - this is correct. But the CONNECT case does not strip the body from the response: a non-success CONNECT response's body is piped through as a normal response body. This is technically valid but could lead to unexpected behavior if the upgrade machinery expects a clean close.","fix":"Document that non-success CONNECT responses have their bodies streamed normally. Consider whether the body should be forcibly empty for non-success CONNECT responses per the HTTP/2 spec.","locations":[{"ref":"src/proto/h2/server.rs:485-528","code":"  485 |                     if let Some(connect_parts) = connect_parts.take() {\n  486 |                         if res.status().is_success() {\n  487 |                             if headers::content_length_parse_all(res.headers())\n  488 |                                 .map_or(false, |len| len != 0)\n  489 |                             {\n  490 |                                 warn!(\"h2 successful response to CONNECT request with body not supported\");\n  491 |                                 me.reply.send_reset(h2::Reason::INTERNAL_ERROR);\n  492 |                                 return Poll::Ready(Err(crate::Error::new_user_header()));\n  493 |                             }\n  494 |                             if res\n  495 |                                 .headers_mut()\n  496 |                                 .remove(::http::header::CONTENT_LENGTH)\n  497 |                                 .is_some()\n  498 |                             {\n  499 |                                 warn!(\"successful response to CONNECT request disallows content-length header\");\n  500 |                             }\n  501 |                             let send_stream = reply!(me, res, false);\n  502 |                             let (h2_up, up_task) = super::upgrade::pair(\n  503 |                                 send_stream,\n  504 |                                 connect_parts.recv_stream,\n  505 |                                 connect_parts.ping,\n  506 |                             );\n  507 |                             connect_parts\n  508 |                                 .pending\n  509 |                                 .fulfill(Upgraded::new(h2_up, Bytes::new()));\n  510 |                             self.exec.execute_upgrade(up_task);\n  511 |                             return Poll::Ready(Ok(()));\n  512 |                         }\n  513 |                     }\n  514 | \n  515 |                     if !body.is_end_stream() {\n  516 |                         // automatically set Content-Length from body...\n  517 |                         if let Some(len) = body.size_hint().exact() {\n  518 |                             headers::set_content_length_if_missing(res.headers_mut(), len);\n  519 |                         }\n  520 | \n  521 |                         let body_tx = reply!(me, res, false);\n  522 |                         H2StreamState::Body {\n  523 |                             pipe: PipeToSendStream::new(body, body_tx),\n  524 |                         }\n  525 |                     } else {\n  526 |                         reply!(me, res, true);\n  527 |                         return Poll::Ready(Ok(()));\n  528 |                     }","lines":44,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/server.rs#L485-L528"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In ext/mod.rs, OriginalHeaderOrder::insert only records a header name the first time it is seen, discarding subsequent inserts of the same name (the early return comment says 'Replacing an already existing element does not change ordering'). However, HeaderCaseMap::append always appends, creating a mismatch in semantics. If a header appears multiple times and the first insertion is via `insert` and subsequent ones via `insert`, the count in num_entries stays at 1 and entry_order only has one entry, but the underlying HeaderMap (used via HeaderCaseMap) may have multiple values. This can produce incorrect index lookups when iterating get_in_order.","fix":"Clarify whether insert is semantically 'upsert first occurrence only' or 'always append'. If it's the former, document it clearly. If callers need to track all occurrences, use append instead of insert, consistent with HeaderCaseMap.","locations":[{"ref":"src/ext/mod.rs:225-234","code":"  225 |     pub(crate) fn insert(&mut self, name: HeaderName) {\n  226 |         if !self.num_entries.contains_key(&name) {\n  227 |             let idx = 0;\n  228 |             self.num_entries.insert(name.clone(), 1);\n  229 |             self.entry_order.push((name, idx));\n  230 |         }\n  231 |         // Replacing an already existing element does not\n  232 |         // change ordering, so we only care if its the first\n  233 |         // header name encountered\n  234 |     }","lines":10,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ext/mod.rs#L225-L234"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In ext/mod.rs, OriginalHeaderOrder::append computes an idx that represents the zero-based occurrence count among previously seen headers with the same name, but the value inserted in the Vacant arm is 1 (the new count after insertion), while the idx used is 0 (correct for the first occurrence). However for the Occupied arm: idx = *entry.get() gives the current count before incrementing, then increments. So for the second occurrence, idx = 1, meaning 'use the second value (index 1) from get_all()'. This is off by one: for the first occurrence, idx = 0 (correct); for the second, idx = 1 (correct); but the semantics depend on the order in which get_all() returns values. The code appears correct but is fragile and the Vacant arm sets the initial count to 1 instead of 0, which works only because the first occurrence uses idx = 0 before inserting.","fix":"Add a comment explaining the indexing scheme explicitly. The Vacant arm inserts 1 (correct - it's the count after this append), and idx = 0 is the first index into get_all() results. This works but is non-obvious.","locations":[{"ref":"src/ext/mod.rs:241-252","code":"  241 |         let idx = match self.num_entries.entry(name.clone()) {\n  242 |             std::collections::hash_map::Entry::Occupied(mut entry) => {\n  243 |                 let idx = *entry.get();\n  244 |                 *entry.get_mut() += 1;\n  245 |                 idx\n  246 |             }\n  247 |             std::collections::hash_map::Entry::Vacant(entry) => {\n  248 |                 entry.insert(1);\n  249 |                 0\n  250 |             }\n  251 |         };\n  252 |         self.entry_order.push((name, idx));","lines":12,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ext/mod.rs#L241-L252"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"hyper_task_value uses 'p == std::ptr::NonNull::<c_void>::dangling().as_ptr()' to detect a ZST output (the () type). NonNull::<c_void>::dangling() returns an address equal to align_of::<c_void>() which is 1. This works for the standard allocator (Box::into_raw for ZSTs produces dangling()) but could fail for custom allocators or if a real allocation happens to land at address 1. The type information should be used instead.","fix":"Check 'val.as_task_type() == hyper_task_return_type::HYPER_TASK_EMPTY' before Box::into_raw, and return null_mut() in that case instead of relying on the dangling pointer address.","locations":[{"ref":"src/ffi/task.rs:417-425","code":"  417 |         if let Some(val) = task.output.take() {\n  418 |             let p = Box::into_raw(val).cast();\n  419 |             // protect from returning fake pointers to empty types\n  420 |             if p == std::ptr::NonNull::<c_void>::dangling().as_ptr() {\n  421 |                 ptr::null_mut()\n  422 |             } else {\n  423 |                 p\n  424 |             }\n  425 |         } else {","lines":9,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/task.rs#L417-L425"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Conn::poll_read_head` (conn.rs lines 311-325), when `msg.expect_continue` is true but `msg.head.version` is exactly HTTP/1.0 (not `> HTTP_10`), the `else` branch is taken and `Reading::Body` is set directly without sending a 100 Continue. The condition `msg.expect_continue && msg.head.version.gt(&Version::HTTP_10)` means HTTP/1.0 requests with `Expect: 100-continue` silently get their body decoded without sending 100 Continue. RFC 2616 says servers SHOULD NOT send 100 Continue to HTTP/1.0 clients, so this behavior is correct. However, the code comment at line 311 does not explain this edge case, making it appear to be a bug when reviewing.","fix":"Add a comment stating that for HTTP/1.0 clients, `Expect: 100-continue` is intentionally ignored per RFC 2616 and the body decoder is started directly.","locations":[{"ref":"src/proto/h1/conn.rs:311-326","code":"  311 |         } else if msg.expect_continue && msg.head.version.gt(&Version::HTTP_10) {\n  312 |             let h1_max_header_size = None; // TODO: remove this when we land h1_max_header_size support\n  313 |             self.state.reading = Reading::Continue(Decoder::new(\n  314 |                 msg.decode,\n  315 |                 self.state.h1_max_headers,\n  316 |                 h1_max_header_size,\n  317 |             ));\n  318 |             wants = wants.add(Wants::EXPECT);\n  319 |         } else {\n  320 |             let h1_max_header_size = None; // TODO: remove this when we land h1_max_header_size support\n  321 |             self.state.reading = Reading::Body(Decoder::new(\n  322 |                 msg.decode,\n  323 |                 self.state.h1_max_headers,\n  324 |                 h1_max_header_size,\n  325 |             ));\n  326 |         }","lines":16,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/conn.rs#L311-L326"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `Dispatcher::poll_read_head` (dispatch.rs line 317), the code has `debug_assert!(!upgrade.is_none(), \"empty upgrade\")`. The method `is_none()` on `OnUpgrade` returns `true` when there is no pending upgrade. The assertion intent is 'upgrade should not be empty/none', but the expression `!upgrade.is_none()` means 'upgrade is Some'. This is correct logically but the double-negative is confusing; `debug_assert!(upgrade.is_some())` or `debug_assert!(!upgrade.is_none())` are equivalent, but the latter is idiomatic in Rust and should be rewritten for clarity.","fix":"Replace `debug_assert!(!upgrade.is_none(), \"empty upgrade\")` with `debug_assert!(!upgrade.is_none(), \"expected non-empty upgrade\")` - or check what `OnUpgrade::is_none()` actually means since it is a custom type; if it has a different meaning than `Option::is_none`, document it.","locations":[{"ref":"src/proto/h1/dispatch.rs:324","code":"  324 |                     debug_assert!(!upgrade.is_none(), \"empty upgrade\");","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/dispatch.rs#L324"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `Http1Transaction` trait has a mutual-recursion between `is_client()` and `is_server()`: `is_client()` returns `!Self::is_server()` and `is_server()` returns `!Self::is_client()`. Neither provides a base case in the trait itself. Any type that implements the trait and does NOT override at least one of these methods will cause infinite mutual recursion at runtime and stack overflow. The concrete `Client` and `Server` types each override one of these methods, but the default implementations are dangerous.","fix":"Change the default implementations so one of them returns a concrete value (e.g. `is_server()` defaults to `false`) or mark the pair as requiring at least one to be overridden via documentation. Alternatively, provide only one method in the trait and derive the other.","locations":[{"ref":"src/proto/h1/mod.rs:40-46","code":"   40 |     fn is_client() -> bool {\n   41 |         !Self::is_server()\n   42 |     }\n   43 | \n   44 |     fn is_server() -> bool {\n   45 |         !Self::is_client()\n   46 |     }","lines":7,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/mod.rs#L40-L46"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `Server::encode` (role.rs line 392-399), when `msg.head.subject.is_informational()` (1xx other than 101), the code sets `msg.body = None` and then returns `Err(...)` at line 469. But before returning the error, the status line has already been partially written to `dst` (lines 415-445). The `rewind` closure is NOT called, so `dst` contains a partial 500 Internal Server Error status line (since `msg.head.subject` was set to INTERNAL_SERVER_ERROR at line 394 before the write loop). Actually looking more carefully: the truncation at `dst.truncate(orig_len)` only happens inside `rewind`, which is only called from inside `encode_headers_with_lower_case` / `encode_headers_with_original_case` when they error. But the 1xx error path sets up the status 500, writes the status line, and eventually calls `encode_headers_with_*`. Inside `encode_headers`, there is no early return before the headers are written, so the status line IS written. When `ret` (which is `Err`) is returned at the end via `ret.map(|()| encoder)`, the caller sees an error but `dst` contains a valid 500 response. This may be intentional (send the 500 and also return an error to the caller), but is confusing and undocumented.","fix":"Add a comment clarifying that a 500 response is intentionally written to `dst` before returning the error, or add a `rewind(dst); return Err(...)` path to suppress the write when that is the desired behavior.","locations":[{"ref":"src/proto/h1/role.rs:403-411","code":"  403 |         } else if msg.head.subject.is_informational() {\n  404 |             warn!(\"response with 1xx status code not supported\");\n  405 |             *msg.head = MessageHead::default();\n  406 |             msg.head.subject = StatusCode::INTERNAL_SERVER_ERROR;\n  407 |             msg.body = None;\n  408 |             (Err(crate::Error::new_user_unsupported_status_code()), true)\n  409 |         } else {\n  410 |             (Ok(()), !msg.keep_alive)\n  411 |         };","lines":9,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/role.rs#L403-L411"},{"ref":"src/proto/h1/role.rs:481","code":"  481 |         ret.map(|()| encoder)","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/role.rs#L481"}]},
