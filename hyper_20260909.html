{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Client::decoder` (role.rs lines 1266-1314), the method number 200-299 range check for CONNECT at line 1282 uses a range pattern `200..=299`, which is correct. However, the decoder for `Method::CONNECT` only returns `DecodedLength::ZERO` for 2xx responses. For CONNECT + non-2xx, the code falls through to the Transfer-Encoding/Content-Length checks. But RFC 7230 does not define body semantics for non-2xx CONNECT responses at all; the fallthrough behavior (read until EOF for responses without C-L or TE) may be reasonable but is not explicitly documented.","fix":"Add a comment explaining that non-2xx CONNECT responses fall through to normal body decoding rules, as this is intentional.","locations":[{"ref":"src/proto/h1/role.rs:1289-1294","code":" 1289 |             }\n 1290 |             Some(Method::CONNECT) => {\n 1291 |                 if let 200..=299 = inc.subject.as_u16() {\n 1292 |                     return Ok(Some((DecodedLength::ZERO, true)));\n 1293 |                 }\n 1294 |             }","lines":6,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/role.rs#L1289-L1294"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `Client::set_length` (role.rs lines 1388-1403), for HTTP/1.1 requests with `BodyLength::Unknown` and no existing Transfer-Encoding header, the code returns `Encoder::length(0)` for GET, HEAD, and CONNECT methods. This is documented behavior but is subtly incorrect for POST/PUT/DELETE/etc. when `BodyLength::Unknown` is returned by a body that actually has no data - the chunked encoder will send `0\\r\\n\\r\\n` unnecessarily. This is a minor performance issue, not a bug per se, but worth noting.","fix":"Document explicitly that `BodyLength::Unknown` always forces chunked for non-GET/HEAD/CONNECT methods, even if the body ends up being empty.","locations":[{"ref":"src/proto/h1/role.rs:1397-1412","code":" 1397 |                 } else if let BodyLength::Unknown = body {\n 1398 |                     // GET, HEAD, and CONNECT almost never have bodies.\n 1399 |                     //\n 1400 |                     // So instead of sending a \"chunked\" body with a 0-chunk,\n 1401 |                     // assume no body here. If you *must* send a body,\n 1402 |                     // set the headers explicitly.\n 1403 |                     match head.subject.0 {\n 1404 |                         Method::GET | Method::HEAD | Method::CONNECT => Some(Encoder::length(0)),\n 1405 |                         _ => {\n 1406 |                             te.insert(HeaderValue::from_static(\"chunked\"));\n 1407 |                             Some(Encoder::chunked())\n 1408 |                         }\n 1409 |                     }\n 1410 |                 } else {\n 1411 |                     None\n 1412 |                 }","lines":16,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/role.rs#L1397-L1412"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Bdp::calculate` (ping.rs), the BDP window update formula uses `(bytes * 2).min(BDP_LIMIT) as WindowSize` where `WindowSize = u32` and `BDP_LIMIT = 16 * 1024 * 1024 = 16_777_216`. Since `bytes` is a `usize`, if `bytes > usize::MAX / 2` (which would require receiving >4GB in a single BDP measurement window - extremely unlikely but theoretically possible on 32-bit targets), `bytes * 2` would overflow. On 64-bit targets the `.min(BDP_LIMIT)` clamps it safely, but on 32-bit targets `usize` is 32-bit so overflow is possible with >2GB received.","fix":"Use `bytes.saturating_mul(2).min(BDP_LIMIT) as WindowSize` to prevent potential overflow on 32-bit targets.","locations":[{"ref":"src/proto/h2/ping.rs:398-399","code":"  398 |         if bytes >= self.bdp as usize * 2 / 3 {\n  399 |             self.bdp = (bytes * 2).min(BDP_LIMIT) as WindowSize;","lines":2,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/ping.rs#L398-L399"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `KeepAlive::schedule` (ping.rs line 452), the scheduled time is `shared.last_read_at() + self.interval`. This schedules the next ping for `interval` time after the last frame was received. However, `last_read_at` is always updated to `now` when any frame is received. If the keep-alive interval is, say, 30 seconds, and the last frame arrived 5 seconds ago, the timer is set for 25 seconds from now (correct). But `schedule` is also called from `maybe_schedule` when in `PingSent` state and `!shared.is_ping_sent()` (meaning the pong was received) - at that point `last_read_at` was already updated by `update_last_read_at()` in the pong handler (line 291). So this is correct. However, `schedule` is also called from `Init` state during `maybe_schedule` even when `last_read_at` is stale (never received any frame since connection). In this case `last_read_at` is `Some(now_at_creation)`, which may cause the first ping to fire later than expected if the connection was idle for a long time before first use.","fix":"This is a minor timing issue. Document that the initial keep-alive timer is based on connection creation time, so the first ping after a dormant period may be delayed by up to `interval` extra time.","locations":[{"ref":"src/proto/h2/ping.rs:451-455","code":"  451 |     fn schedule(&mut self, shared: &Shared) {\n  452 |         let interval = shared.last_read_at() + self.interval;\n  453 |         self.state = KeepAliveState::Scheduled(interval);\n  454 |         self.timer.reset(&mut self.sleep, interval);\n  455 |     }","lines":5,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/ping.rs#L451-L455"},{"ref":"src/proto/h2/ping.rs:72","code":"   72 |     let last_read_at = keep_alive.as_ref().map(|_| now);","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/ping.rs#L72"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `Conn::on_read_head_error` (conn.rs lines 337-361), when `on_parse_error` returns `Ok(())`, the function returns `Poll::Pending` with the comment `// XXX: wat?`. This is semantically incorrect: the connection has encountered a parse error, written an error response, but returns `Poll::Pending` to the caller, which will cause the driver to wait for more I/O events before progressing. The error response that was written to the write buffer will only be flushed when the write side is next polled. However, the connection is in an inconsistent state (read closed, write has pending error response) and returning `Pending` may cause the caller to miss flushing the response if it never polls again. The comment admits this is suspicious behavior.","fix":"After writing an error response, immediately trigger a flush and return an appropriate `Poll::Ready` or ensure the caller will re-poll the write side. The `Poll::Pending` here may leave the error response undelivered if the future is dropped.","locations":[{"ref":"src/proto/h1/conn.rs:333-357","code":"  333 |     fn on_read_head_error<Z>(&mut self, e: crate::Error) -> Poll<Option<crate::Result<Z>>> {\n  334 |         // If we are currently waiting on a message, then an empty\n  335 |         // message should be reported as an error. If not, it is just\n  336 |         // the connection closing gracefully.\n  337 |         let must_error = self.should_error_on_eof();\n  338 |         self.close_read();\n  339 |         self.io.consume_leading_lines();\n  340 |         let was_mid_parse = e.is_parse() || !self.io.read_buf().is_empty();\n  341 |         if was_mid_parse || must_error {\n  342 |             // We check if the buf contains the h2 Preface\n  343 |             debug!(\n  344 |                 \"parse error ({}) with {} bytes\",\n  345 |                 e,\n  346 |                 self.io.read_buf().len()\n  347 |             );\n  348 |             match self.on_parse_error(e) {\n  349 |                 Ok(()) => Poll::Pending, // XXX: wat?\n  350 |                 Err(e) => Poll::Ready(Some(Err(e))),\n  351 |             }\n  352 |         } else {\n  353 |             debug!(\"read eof\");\n  354 |             self.close_write();\n  355 |             Poll::Ready(None)\n  356 |         }\n  357 |     }","lines":25,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/conn.rs#L333-L357"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `server.rs` `poll_server`, when `poll_accept` returns `Some(Err(e))`, the function returns `Poll::Ready(Err(crate::Error::new_h2(e)))`, which exits `poll_server` with an error. In `Server::poll`, this error propagates through `ready!()` and returns from the top-level future as an error. However, the `closing` field is never set in this path - `srv.closing` is only set when... it is never actually set in the code shown. The `closing` field exists and `poll_closed` is called only in the `self.closing.is_some()` branch (line 338-345), but there is no code path that sets `self.closing`. This means `poll_closed` is dead code and `self.closing.take().expect(\"polled after error\")` at line 345 could never be reached (it's unreachable code, though harmless).","fix":"Either remove the dead `closing`/`poll_closed` code path, or add the missing code that sets `srv.closing` when a service error occurs. This appears to be a leftover from refactoring.","locations":[{"ref":"src/proto/h2/server.rs:335-342","code":"  335 |         debug_assert!(\n  336 |             self.closing.is_some(),\n  337 |             \"poll_server broke loop without closing\"\n  338 |         );\n  339 | \n  340 |         ready!(self.conn.poll_closed(cx).map_err(crate::Error::new_h2))?;\n  341 | \n  342 |         Poll::Ready(Err(self.closing.take().expect(\"polled after error\")))","lines":8,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/server.rs#L335-L342"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `H2Upgraded::poll_write` (upgrade.rs), when `send_stream.tx.start_send` fails (because the task dropped), the code polls `error_rx` to check for a task error. However, `error_rx` is polled without any prior `poll_ready`, and importantly the `cx` waker used here was registered by the caller for write readiness, not for error channel readiness. If `error_rx` returns `Poll::Pending`, the function returns `Poll::Pending`, but the waker may never be woken for the error channel specifically - the write caller will be woken only when write capacity is available, potentially causing a deadlock where the write is stuck pending forever because the task dropped without sending an error.","fix":"When `start_send` fails and `error_rx` returns `Poll::Pending`, consider returning `BrokenPipe` immediately rather than `Pending`, since the channel is already closed (task dropped).","locations":[{"ref":"src/proto/h2/upgrade.rs:291-304","code":"  291 |         match self.send_stream.tx.start_send(Cursor::new(buf.into())) {\n  292 |             Ok(()) => Poll::Ready(Ok(n)),\n  293 |             Err(_task_dropped) => {\n  294 |                 // if the task dropped, check if there was an error\n  295 |                 // otherwise i guess its a broken pipe\n  296 |                 match Pin::new(&mut self.send_stream.error_rx).poll(cx) {\n  297 |                     Poll::Ready(Ok(reason)) => Poll::Ready(Err(io_error(reason))),\n  298 |                     Poll::Ready(Err(_task_dropped)) => {\n  299 |                         Poll::Ready(Err(std::io::ErrorKind::BrokenPipe.into()))\n  300 |                     }\n  301 |                     Poll::Pending => Poll::Pending,\n  302 |                 }\n  303 |             }\n  304 |         }","lines":14,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/upgrade.rs#L291-L304"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `H2Upgraded::poll_read` (upgrade.rs), when `recv_stream.poll_data` returns `Some(Err(e))` with reason `CANCEL`, the function returns `Poll::Ready(Ok(()))`, treating it as a clean EOF. RFC 9113 section 8.1 says CANCEL means the stream was reset by the sender. Returning `Ok(())` (EOF) to the reader when the stream was abnormally cancelled may cause the application to treat a truncated response as complete, potentially leading to data corruption if the reader doesn't verify the full content was received.","fix":"Consider returning a broken-pipe or connection-reset error for `CANCEL` reason rather than treating it as a clean EOF, or at minimum document why CANCEL is treated as clean EOF in the upgrade context.","locations":[{"ref":"src/proto/h2/upgrade.rs:245-247","code":"  245 |                         return Poll::Ready(match e.reason() {\n  246 |                             Some(Reason::NO_ERROR) | Some(Reason::CANCEL) => Ok(()),\n  247 |                             Some(Reason::STREAM_CLOSED) => {","lines":3,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/upgrade.rs#L245-L247"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"In `Client::encode` (role.rs line 1233), `msg.head.headers.clear()` is called with the comment `//TODO: remove when switching to drain()`. The Server's `encode_headers` uses `drain()` on the headers, which avoids cloning and is more efficient. The client path still uses `clear()` after writing headers with an immutable reference, which is less efficient as it requires an extra pass over the header map.","fix":"Switch the client encoder to use `drain()` like the server encoder, which would also simplify the code and eliminate the need for the `//TODO` comment.","locations":[{"ref":"src/proto/h1/role.rs:1242","code":" 1242 |         msg.head.headers.clear(); //TODO: remove when switching to drain()","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/role.rs#L1242"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In common/buf.rs, BufList::remaining() calls iter().map(|buf| buf.remaining()).sum() which is O(n) in the number of buffers. This is called by the Buf trait implementation and may be called frequently by callers (e.g., in the copy_to_bytes fallback path at line 85 which calls self.remaining() for an assertion after already consuming data). Caching the total remaining count and updating it incrementally in push() and advance() would make this O(1).","fix":"Add a cached `total: usize` field to BufList, increment in push(), decrement in advance(), and return it from remaining(). This is especially important if BufList is used in hot write paths.","locations":[{"ref":"src/common/buf.rs:31-33","code":"   31 |     fn remaining(&self) -> usize {\n   32 |         self.bufs.iter().map(|buf| buf.remaining()).sum()\n   33 |     }","lines":3,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/common/buf.rs#L31-L33"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In common/date.rs, the buffer() method returns the full 29-byte slice regardless of how many bytes were actually written (tracked by self.pos). If render() writes fewer than 29 bytes (e.g. due to a bug or early return from fmt::Write), stale bytes from a previous render will be included in the HTTP Date header silently.","fix":"Change buffer() to return &self.bytes[..self.pos], or assert self.pos == DATE_VALUE_LENGTH before returning the full slice.","locations":[{"ref":"src/common/date.rs:59-61","code":"   59 |     fn buffer(&self) -> &[u8] {\n   60 |         &self.bytes[..]\n   61 |     }","lines":3,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/common/date.rs#L59-L61"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In hyper_headers_foreach, the ordered path uses headers.headers.get_all(name).iter().nth(*idx) for every header, which is O(idx) for each call (linear scan through a GetAll iterator). For a response with N headers of the same name, this makes the iteration O(N^2) total. The non-ordered path iterates linearly but uses two separate iterators. The ordered path's O(N^2) behavior can be significant for responses with many repeated header names.","fix":"For the ordered path, consider building a mapping from (name, occurrence-index) to value once, then iterate in order. Alternatively, use a vec of pre-fetched (name_ptr, val_ptr) pairs to avoid repeated nth() calls.","locations":[{"ref":"src/ffi/http_types.rs:459-508","code":"  459 |         let mut ordered_iter =  headers.orig_order.get_in_order().peekable();\n  460 |         if ordered_iter.peek().is_some() {\n  461 |             for (name, idx) in ordered_iter {\n  462 |                 let (name_ptr, name_len) = if let Some(orig_name) = headers.orig_casing.get_all(name).nth(*idx) {\n  463 |                     (orig_name.as_ref().as_ptr(), orig_name.as_ref().len())\n  464 |                 } else {\n  465 |                     (\n  466 |                     name.as_str().as_bytes().as_ptr(),\n  467 |                     name.as_str().as_bytes().len(),\n  468 |                     )\n  469 |                 };\n  470 | \n  471 |                 let val_ptr;\n  472 |                 let val_len;\n  473 |                 if let Some(value) = headers.headers.get_all(name).iter().nth(*idx) {\n  474 |                     val_ptr = value.as_bytes().as_ptr();\n  475 |                     val_len = value.as_bytes().len();\n  476 |                 } else {\n  477 |                     // Stop iterating, something has gone wrong.\n  478 |                     return;\n  479 |                 }\n  480 | \n  481 |                 if HYPER_ITER_CONTINUE != func(userdata, name_ptr, name_len, val_ptr, val_len) {\n  482 |                     return;\n  483 |                 }\n  484 |             }\n  485 |         } else {\n  486 |             for name in headers.headers.keys() {\n  487 |                 let mut names = headers.orig_casing.get_all(name);\n  488 | \n  489 |                 for value in headers.headers.get_all(name) {\n  490 |                     let (name_ptr, name_len) = if let Some(orig_name) = names.next() {\n  491 |                         (orig_name.as_ref().as_ptr(), orig_name.as_ref().len())\n  492 |                     } else {\n  493 |                         (\n  494 |                             name.as_str().as_bytes().as_ptr(),\n  495 |                             name.as_str().as_bytes().len(),\n  496 |                         )\n  497 |                     };\n  498 | \n  499 |                     let val_ptr = value.as_bytes().as_ptr();\n  500 |                     let val_len = value.as_bytes().len();\n  501 | \n  502 |                     if HYPER_ITER_CONTINUE != func(userdata, name_ptr, name_len, val_ptr, val_len) {\n  503 |                         return;\n  504 |                     }\n  505 |                 }\n  506 |             }\n  507 |         }\n  508 |     }","lines":50,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/http_types.rs#L459-L508"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `WriteBuf::buffer` with `WriteStrategy::Flatten` (io.rs lines 549-570), the copy loop manually calls `buf.chunk()` and `buf.advance()` in a hand-written loop. The `bytes` crate's `Buf::copy_to_slice` or `bytes::BufMut::put` would be faster because they can take advantage of the concrete type, but the comment says this is already faster than `<Vec as BufMut>::put`. However the inner loop calls `extend_from_slice` with each chunk individually, which may cause repeated bounds checks. This is minor but noted.","fix":"Low priority; the existing loop is already an optimization. No action required unless profiling shows it as a hotspot.","locations":[{"ref":"src/proto/h1/io.rs:550-571","code":"  550 |             WriteStrategy::Flatten => {\n  551 |                 let head = self.headers_mut();\n  552 | \n  553 |                 head.maybe_unshift(buf.remaining());\n  554 |                 trace!(\n  555 |                     self.len = head.remaining(),\n  556 |                     buf.len = buf.remaining(),\n  557 |                     \"buffer.flatten\"\n  558 |                 );\n  559 |                 //perf: This is a little faster than <Vec as BufMut>>::put,\n  560 |                 //but accomplishes the same result.\n  561 |                 loop {\n  562 |                     let adv = {\n  563 |                         let slice = buf.chunk();\n  564 |                         if slice.is_empty() {\n  565 |                             return;\n  566 |                         }\n  567 |                         head.bytes.extend_from_slice(slice);\n  568 |                         slice.len()\n  569 |                     };\n  570 |                     buf.advance(adv);\n  571 |                 }","lines":22,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/io.rs#L550-L571"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `strip_connection_headers` (mod.rs), the function iterates over `CONNECTION_HEADERS` (4 items: keep-alive, proxy-connection, transfer-encoding, upgrade) and removes each from the `HeaderMap` using `headers.remove(header)`. This is up to 4 separate O(1) hash lookups. Additionally, after processing those, it removes the `CONNECTION` header itself and then parses its value to remove any additional headers it references. In practice most HTTP/2 requests won't have these headers, so the removals are no-ops. The overhead is minor, but this function is called for every request and response.","fix":"No change needed for correctness. For high-throughput scenarios, consider checking if any connection-type headers exist before iterating, though this optimization is likely not significant.","locations":[{"ref":"src/proto/h2/mod.rs:50-89","code":"   50 | fn strip_connection_headers(headers: &mut HeaderMap, kind: MessageKind) {\n   51 |     for header in &CONNECTION_HEADERS {\n   52 |         if headers.remove(header).is_some() {\n   53 |             warn!(\"Connection header illegal in HTTP/2: {}\", header.as_str());\n   54 |         }\n   55 |     }\n   56 | \n   57 |     #[cfg(not(feature = \"client\"))]\n   58 |     let _ = kind;\n   59 |     #[cfg(feature = \"client\")]\n   60 |     if matches!(kind, MessageKind::Request) {\n   61 |         if headers\n   62 |             .get(http::header::TE)\n   63 |             .map_or(false, |te_header| te_header != \"trailers\")\n   64 |         {\n   65 |             warn!(\"TE headers not set to \\\"trailers\\\" are illegal in HTTP/2 requests\");\n   66 |             headers.remove(http::header::TE);\n   67 |         }\n   68 |     } else if headers.remove(http::header::TE).is_some() {\n   69 |         warn!(\"TE headers illegal in HTTP/2 responses\");\n   70 |     }\n   71 | \n   72 |     if let Some(header) = headers.remove(CONNECTION) {\n   73 |         warn!(\n   74 |             \"Connection header illegal in HTTP/2: {}\",\n   75 |             CONNECTION.as_str()\n   76 |         );\n   77 |         // A `Connection` header may have a comma-separated list of names of other headers that\n   78 |         // are meant for only this specific connection.\n   79 |         //\n   80 |         // Iterate these names and remove them as headers. Connection-specific headers are\n   81 |         // forbidden in HTTP2, as that information has been moved into frame types of the h2\n   82 |         // protocol.\n   83 |         if let Ok(header_contents) = header.to_str() {\n   84 |             for name in header_contents.split(',') {\n   85 |                 let name = name.trim();\n   86 |                 headers.remove(name);\n   87 |             }\n   88 |         }\n   89 |     }","lines":40,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/mod.rs#L50-L89"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In hyper_headers_foreach, the peekable() check 'if ordered_iter.peek().is_some()' followed by iterating with 'for (name, idx) in ordered_iter' has a double-space on the assignment line (line 459: 'let mut ordered_iter =  headers.orig_order...'). Minor style issue.","fix":"Remove the extra space: 'let mut ordered_iter = headers.orig_order.get_in_order().peekable();'.","locations":[{"ref":"src/ffi/http_types.rs:459","code":"  459 |         let mut ordered_iter =  headers.orig_order.get_in_order().peekable();","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/http_types.rs#L459"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `Serving::closing` field (server.rs) is declared and checked (`self.closing.is_none()`, `self.closing.is_some()`), and `self.closing.take().expect(...)` is called at line 345, but `self.closing` is never actually set to `Some(...)` anywhere in the codebase. The entire `closing` branch in `poll_server` (lines 338-345, the block that calls `poll_closed` and returns `Err(self.closing.take()...)`) is dead code.","fix":"Remove the `closing: Option<crate::Error>` field and its associated dead code, or implement the intended logic that sets `closing` when a graceful shutdown with a pending error is needed.","locations":[{"ref":"src/proto/h2/server.rs:110-118","code":"  110 | struct Serving<T, B>\n  111 | where\n  112 |     B: Body,\n  113 | {\n  114 |     ping: Option<(ping::Recorder, ping::Ponger)>,\n  115 |     conn: Connection<Compat<T>, SendBuf<B::Data>>,\n  116 |     closing: Option<crate::Error>,\n  117 |     date_header: bool,\n  118 | }","lines":9,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/server.rs#L110-L118"},{"ref":"src/proto/h2/server.rs:335-342","code":"  335 |         debug_assert!(\n  336 |             self.closing.is_some(),\n  337 |             \"poll_server broke loop without closing\"\n  338 |         );\n  339 | \n  340 |         ready!(self.conn.poll_closed(cx).map_err(crate::Error::new_h2))?;\n  341 | \n  342 |         Poll::Ready(Err(self.closing.take().expect(\"polled after error\")))","lines":8,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/server.rs#L335-L342"}]},

{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In the C header (capi/include/hyper.h), both HYPER_IO_PENDING and HYPER_IO_ERROR have truncated comments: 'Sentinel value to return from a read or write callback that the operation' - the sentence is cut off and never completed. The Rust source has 'is pending' and 'has errored' as the missing endings.","fix":"Fix the gen_header.sh script or cbindgen configuration to emit the full doc comment for these constants.","locations":[{"ref":"capi/include/hyper.h:45-53","code":"   45 | /*\n   46 |  Sentinel value to return from a read or write callback that the operation\n   47 |  */\n   48 | #define HYPER_IO_PENDING 4294967295\n   49 | \n   50 | /*\n   51 |  Sentinel value to return from a read or write callback that the operation\n   52 |  */\n   53 | #define HYPER_IO_ERROR 4294967294","lines":9,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/capi/include/hyper.h#L45-L53"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In common/io/rewind.rs, the rewind() method has `debug_assert!(self.pre.is_none())` which asserts no pre-buffer exists before rewinding. However the comment in the method is absent; the assertion will silently be dropped in release builds if someone calls rewind() twice, leading to the first rewind data being silently discarded (replaced by the second). There is no production-mode protection against this misuse.","fix":"Add a release-mode check or at least a doc comment explaining that calling rewind() when pre is already Some will silently discard the existing buffered bytes.","locations":[{"ref":"src/common/io/rewind.rs:41-44","code":"   41 |     pub(crate) fn rewind(&mut self, bs: Bytes) {\n   42 |         debug_assert!(self.pre.is_none());\n   43 |         self.pre = Some(bs);\n   44 |     }","lines":4,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/common/io/rewind.rs#L41-L44"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment for hyper_response (struct) contains a typo on line 36: 'polling the executor unntil you get a hyper_task' - 'unntil' should be 'until'.","fix":"Change 'unntil' to 'until'.","locations":[{"ref":"src/ffi/http_types.rs:36","code":"   36 | /// polling the executor unntil you get a `hyper_task` of type","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/http_types.rs#L36"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The documentation for hyper_io_set_write (line 117) says 'If there is an irrecoverable error reading data, then HYPER_IO_ERROR should be the return value.' This is a copy-paste error from hyper_io_set_read - the write callback has nothing to do with reading. It should say 'writing data'.","fix":"Change 'reading data' to 'writing data' in the write callback documentation.","locations":[{"ref":"src/ffi/io.rs:115-118","code":"  115 |     /// for `hyper_waker`.\n  116 |     ///\n  117 |     /// If there is an irrecoverable error reading data, then `HYPER_IO_ERROR`\n  118 |     /// should be the return value.","lines":4,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/ffi/io.rs#L115-L118"}]},

{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `decode.rs` line 19, the comment says `/// This limit is currentlty applied for the entire body, not per chunk.` - the word 'currentlty' is a typo for 'currently'. Minor but indicates the comment was not carefully reviewed.","fix":"Fix the typo: change 'currentlty' to 'currently'.","locations":[{"ref":"src/proto/h1/decode.rs:19","code":"   19 | /// This limit is currentlty applied for the entire body, not per chunk.","lines":1,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h1/decode.rs#L19"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `ping.rs` at lines 277 and 323, there are comments `// XXX: this doesn't register a waker...?` suggesting the author was uncertain whether wakers are properly registered when returning `Poll::Pending`. In `Ponger::poll`, when there is no ping sent (line 276-279) or after processing a pong result without a BDP update (line 322-323), `Poll::Pending` is returned without registering a waker. This means the `Ponger` task will not be woken up by itself - it relies on the parent task (the connection future) to drive it. If the connection has no other pending I/O, the ponger will never be polled again. This could delay keep-alive pings and BDP measurements.","fix":"If the Ponger is meant to wake itself (e.g. when a keep-alive timer fires), ensure the waker is registered. If it relies on the parent connection task's poll loop, document this design dependency explicitly and remove the `XXX` comments.","locations":[{"ref":"src/proto/h2/ping.rs:276-279","code":"  276 |         if !locked.is_ping_sent() {\n  277 |             // XXX: this doesn't register a waker...?\n  278 |             return Poll::Pending;\n  279 |         }","lines":4,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/ping.rs#L276-L279"},{"ref":"src/proto/h2/ping.rs:322-323","code":"  322 |         // XXX: this doesn't register a waker...?\n  323 |         Poll::Pending","lines":2,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/ping.rs#L322-L323"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"In `client.rs`, `ConnMapErr` has a field `is_terminated: bool` annotated with `#[pin]` via pin_project (line 265-267). Booleans are `Unpin` by default and don't need to be pinned - pinning a bool is meaningless and generates unnecessary complexity in the projected types. This is misleading to future maintainers who may wonder why a primitive bool needs to be structurally pinned.","fix":"Remove the `#[pin]` annotation from `is_terminated: bool` - booleans are always `Unpin` and do not need pinning.","locations":[{"ref":"src/proto/h2/client.rs:255-268","code":"  255 | pin_project! {\n  256 |     struct ConnMapErr<T, B>\n  257 |     where\n  258 |         B: Body,\n  259 |         T: Read,\n  260 |         T: Write,\n  261 |         T: Unpin,\n  262 |     {\n  263 |         #[pin]\n  264 |         conn: Either<Conn<T, B>, Connection<Compat<T>, SendBuf<<B as Body>::Data>>>,\n  265 |         #[pin]\n  266 |         is_terminated: bool,\n  267 |     }\n  268 | }","lines":14,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/proto/h2/client.rs#L255-L268"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The OnUpgrade future in upgrade.rs stores its receiver behind Arc<Mutex<oneshot::Receiver<...>>>. The Clone derive on OnUpgrade means multiple clones can all poll the same oneshot::Receiver concurrently after locking. While the Mutex prevents data races, two concurrent polls on the same oneshot::Receiver are semantically problematic: only one will receive the value. The second poll after the first succeeds will return Poll::Pending forever (waker replaced) or get a spurious cancellation error. Since OnUpgrade is Clone and Future, this is a footgun.","fix":"Document clearly that only one clone of OnUpgrade should be awaited, and that cloning is provided for storage/sharing purposes only. Consider making the Future impl take &mut self and not being Clone, or returning an error if the mutex is already being polled by another task.","locations":[{"ref":"src/upgrade.rs:74-76","code":"   74 | pub struct OnUpgrade {\n   75 |     rx: Option<Arc<Mutex<oneshot::Receiver<crate::Result<Upgraded>>>>>,\n   76 | }","lines":3,"link":"https://github.com/hyperium/hyper/blob/a53292651b2ab7d8766e201cceaba63bab8b9f04/src/upgrade.rs#L74-L76"}]}

const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
