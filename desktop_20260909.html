{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"FolderMetadata::initMetadata()/setupExistingMetadata() report E2EeError and return early on several failures (invalid version, bad users array, decrypt failure, signature/checksum failure) but never set _isMetadataValid; however initMetadata() still calls emitSetupComplete() unconditionally. Combined with setupExistingMetadata returning without emitting any failure signal, callers relying solely on isValid() are correct, but the duplicated 'report-and-return' branches make it easy to add a path that leaves _isMetadataValid stale-true after a partial setup. Notably setupExistingMetadata can return after _binaryMetadataKeyForEncryption was set from a previous attempt while signature/key checks failed.","fix":"Explicitly set _isMetadataValid=false at the start of setupExistingMetadata() and only set it true at the very end after all checks pass, so any early return leaves the object invalid.","locations":[{"ref":"src/libsync/foldermetadata.cpp:124-138","code":"  124 | void FolderMetadata::initMetadata()\n  125 | {\n  126 |     if (_initialMetadata.isEmpty()) {\n  127 |         initEmptyMetadata();\n  128 |         return;\n  129 |     }\n  130 | \n  131 |     qCDebug(lcCseMetadata()) << \"Setting up existing metadata\";\n  132 |     setupExistingMetadata(_initialMetadata);\n  133 | \n  134 |     if (binaryMetadataKeyForDecryption().isEmpty() || binaryMetadataKeyForEncryption().isEmpty()) {\n  135 |         qCWarning(lcCseMetadata()) << \"Failed to setup FolderMetadata. Could not parse/create metadataKey!\";\n  136 |     }\n  137 |     emitSetupComplete();\n  138 | }","lines":15,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/foldermetadata.cpp#L124-L138"},{"ref":"src/libsync/foldermetadata.cpp:218-240","code":"  218 |     if (_initialSignature.isEmpty()) {\n  219 |         qCWarning(lcCseMetadata()) << \"Signature is empty\";\n  220 |         _account->reportClientStatus(OCC::ClientStatusReportingStatus::E2EeError_GeneralError);\n  221 |         return;\n  222 |     }\n  223 | \n  224 |     if (_folderUsers.contains(_account->davUser())) {\n  225 |         const auto currentFolderUser = _folderUsers.value(_account->davUser());\n  226 |         const auto currentUserCertificate = QSslCertificate{currentFolderUser.certificatePem};\n  227 |         _binaryMetadataKeyForEncryption = QByteArray::fromBase64(decryptDataWithPrivateKey(currentFolderUser.encryptedMetadataKey, currentUserCertificate.digest(QCryptographicHash::Sha256).toBase64()));\n  228 |         _binaryMetadataKeyForDecryption = _binaryMetadataKeyForEncryption;\n  229 |     }\n  230 | \n  231 |     if (!parseFileDropPart(metaDataDoc)) {\n  232 |         qCWarning(lcCseMetadata()) << \"Could not parse filedrop part\";\n  233 |         return;\n  234 |     }\n  235 | \n  236 |     if (binaryMetadataKeyForDecryption().isEmpty() || binaryMetadataKeyForEncryption().isEmpty()) {\n  237 |         qCWarning(lcCseMetadata()) << \"Could not setup metadata key!\";\n  238 |         _account->reportClientStatus(OCC::ClientStatusReportingStatus::E2EeError_GeneralError);\n  239 |         return;\n  240 |     }","lines":23,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/foldermetadata.cpp#L218-L240"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"FolderMetadata counter handling is effectively a no-op: setupExistingMetadata reads _counter from server metadata (with a TODO admitting it is not validated), and newCounter() simply returns _counter+1. The metadata version 2 anti-rollback/replay protection (X-NC-E2EE-COUNTER) is therefore not enforced on the client: a server replaying old metadata with a lower counter is accepted, since no comparison against a locally persisted counter is performed.","fix":"Persist the last-seen counter (e.g. in SyncJournalDb) and reject metadata whose counter is not strictly greater than the stored value, as the TODO comment describes.","locations":[{"ref":"src/libsync/foldermetadata.cpp:282-288","code":"  282 |     const auto counterVariantFromJson = cipherTextObj.value(counterKey).toVariant();\n  283 |     if (counterVariantFromJson.isValid() && counterVariantFromJson.canConvert<quint64>()) {\n  284 |         // TODO: We need to check counter: new counter must be greater than locally stored counter\n  285 |         // What does that mean? We store the counter in metadata, should we now store it in local database as we do for all file records in SyncJournal?\n  286 |         // What if metadata was not updated for a while? The counter will then not be greater than locally stored (in SyncJournal DB?)\n  287 |         _counter = counterVariantFromJson.value<quint64>();\n  288 |     }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/foldermetadata.cpp#L282-L288"},{"ref":"src/libsync/foldermetadata.cpp:949-952","code":"  949 | quint64 FolderMetadata::newCounter() const\n  950 | {\n  951 |     return _counter + 1;\n  952 | }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/foldermetadata.cpp#L949-L952"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"RequestEtagJob::start() and SimpleFileJob::startRequest() check reply()->error() immediately after sendRequest() and before AbstractNetworkJob::start(). At that point the request has just been queued; reply()->error() is essentially always NoError, so these early error logs/branches are dead and real send-time failures are not caught here. The behaviour is harmless but the check is misleading dead logic copied across jobs.","fix":"Remove the premature reply()->error() checks or move error handling to finished().","locations":[{"ref":"src/libsync/networkjobs.cpp:87-89","code":"   87 |     if (reply()->error() != QNetworkReply::NoError) {\n   88 |         qCWarning(lcEtagJob) << \"request network error: \" << reply()->errorString();\n   89 |     }","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/networkjobs.cpp#L87-L89"},{"ref":"src/libsync/networkjobs.cpp:1285-1289","code":" 1285 |     const auto reply = sendRequest(verb, url, req, requestBody);\n 1286 | \n 1287 |     if (reply->error() != QNetworkReply::NoError) {\n 1288 |         qCWarning(lcSimpleFileJob) << verb << \" Network error: \" << reply->errorString();\n 1289 |     }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/networkjobs.cpp#L1285-L1289"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"LsColXMLParser::parse() dereferences the output pointer fileInfo unconditionally for the 'fileid' property: (*fileInfo)[currentHref].fileId = ... with no null check, while the adjacent 'size' branch correctly guards with 'if (ok && fileInfo)'. If a caller passes fileInfo == nullptr (the signature allows it) and the response contains a fileid element, this is a null-pointer dereference.","fix":"Guard the fileid (and resourcetype/folders) accesses with a fileInfo null check, consistent with the size branch.","locations":[{"ref":"src/libsync/networkjobs.cpp:262-270","code":"  262 |             } else if (name == QLatin1String(\"size\")) {\n  263 |                 bool ok = false;\n  264 |                 auto s = propertyContent.toLongLong(&ok);\n  265 |                 if (ok && fileInfo) {\n  266 |                     (*fileInfo)[currentHref].size = s;\n  267 |                 }\n  268 |             } else if (name == QLatin1String(\"fileid\")) {\n  269 |                 (*fileInfo)[currentHref].fileId = propertyContent.toUtf8();\n  270 |             }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/networkjobs.cpp#L262-L270"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"checkErrorBlacklisting() returns false (treating the item as not blacklisted) whenever item._modtime == 0 or entry._lastTryModtime == 0 for Up items, and similarly for empty etags on Down items. While intended to expire entries when data is unknown, this means an item with a genuinely-zero modtime (which discovery flags elsewhere as an error) bypasses blacklisting entirely and will be retried every sync, potentially hammering the server for a permanently failing file.","fix":"Distinguish 'unknown/zero modtime' from 'changed modtime'; do not unconditionally clear blacklisting when the modtime is zero for items that are otherwise stable.","locations":[{"ref":"src/libsync/syncengine.cpp:155-174","code":"  155 |     if (item._direction == SyncFileItem::Up) { // check the modtime\n  156 |         if (item._modtime == 0 || entry._lastTryModtime == 0) {\n  157 |             return false;\n  158 |         } else if (item._modtime != entry._lastTryModtime) {\n  159 |             qCInfo(lcEngine) << item._file << \" is blacklisted, but has changed mtime!\";\n  160 |             return false;\n  161 |         } else if (item._renameTarget != entry._renameTarget) {\n  162 |             qCInfo(lcEngine) << item._file << \" is blacklisted, but rename target changed from\" << entry._renameTarget;\n  163 |             return false;\n  164 |         }\n  165 |     } else if (item._direction == SyncFileItem::Down) {\n  166 |         // download, check the etag.\n  167 |         if (item._etag.isEmpty() || entry._lastTryEtag.isEmpty()) {\n  168 |             qCInfo(lcEngine) << item._file << \"one ETag is empty, no blacklisting\";\n  169 |             return false;\n  170 |         } else if (item._etag != entry._lastTryEtag) {\n  171 |             qCInfo(lcEngine) << item._file << \" is blacklisted, but has changed etag!\";\n  172 |             return false;\n  173 |         }\n  174 |     }","lines":20,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/syncengine.cpp#L155-L174"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"SyncEngine::startSync() only enables Windows filename compatibility enforcement when ALL four forbidden lists (filenames, basenames, extensions, chars) are non-empty (forbiddenFilenames && forbiddenBasenames && forbiddenExtensions && forbiddenChars). A server that provides only some of these lists (e.g. forbidden chars but no forbidden extensions) will not get enforcement enabled at all, defeating the protection on partially-configured servers.","fix":"Enable enforcement if ANY of the forbidden lists is non-empty (use || instead of &&), or evaluate each list independently.","locations":[{"ref":"src/libsync/syncengine.cpp:676-682","code":"  676 |     if (!forbiddenFilenames.isEmpty() &&\n  677 |         !forbiddenBasenames.isEmpty() &&\n  678 |         !forbiddenExtensions.isEmpty() &&\n  679 |         !forbiddenChars.isEmpty()) {\n  680 |         _shouldEnforceWindowsFileNameCompatibility = true;\n  681 |         _discoveryPhase->_shouldEnforceWindowsFileNameCompatibility = _shouldEnforceWindowsFileNameCompatibility;\n  682 |     }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/syncengine.cpp#L676-L682"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"SyncEngine::finishSync() contains a no-op intended fix: when both _hasDownloadRemovedItems and _hasUploadErrorItems are set, it loops over _syncItems matching ERROR+Up items but the only action (item->_instruction = CSYNC_INSTRUCTION_IGNORE) is commented out. The loop therefore does nothing except set _anotherSyncNeeded = ImmediateFollowUp, while the comment/structure implies upload-error items in a download-removed tree should be suppressed. Either dead code or an unfinished fix that leaves the items in ERROR state.","fix":"Remove the dead loop or restore the intended behavior (uncomment the instruction change) after confirming correctness.","locations":[{"ref":"src/libsync/syncengine.cpp:1072-1079","code":" 1072 |     if (_discoveryPhase && _discoveryPhase->_hasDownloadRemovedItems && _discoveryPhase->_hasUploadErrorItems) {\n 1073 |         for (const auto &item : std::as_const(_syncItems)) {\n 1074 |             if (item->_instruction == CSYNC_INSTRUCTION_ERROR && item->_direction == SyncFileItem::Up) {\n 1075 |                 // item->_instruction = CSYNC_INSTRUCTION_IGNORE;\n 1076 |             }\n 1077 |         }\n 1078 |         _anotherSyncNeeded = ImmediateFollowUp;\n 1079 |     }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/syncengine.cpp#L1072-L1079"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"groupNeededScheduledSyncRuns() copies the bucket value out of the QHash with QHash::value() (auto bucketValue = intervalSyncBuckets.value(key)), mutates the copy, then re-inserts it. This is correct but wasteful; more importantly the surrounding logic re-reads value() after a contains() check (double lookup). The copy-modify-reinsert pattern works but means every additional file in a bucket triggers a full QVector copy of the accumulated file list (O(n^2) for large buckets).","fix":"Use a reference into the hash (auto &bucketValue = intervalSyncBuckets[intervalBucketKey];) and append in place, avoiding repeated copies and the redundant contains()/value() lookups.","locations":[{"ref":"src/libsync/syncengine.cpp:1608-1617","code":" 1608 |         if (!intervalSyncBuckets.contains(intervalBucketKey)) {\n 1609 |             intervalSyncBuckets.insert(intervalBucketKey, {syncScheduledSecs, {file}});\n 1610 |             continue;\n 1611 |         }\n 1612 | \n 1613 |         auto bucketValue = intervalSyncBuckets.value(intervalBucketKey);\n 1614 |         bucketValue.scheduledSyncTimerSecs = qMax(bucketValue.scheduledSyncTimerSecs, syncScheduledSecs);\n 1615 |         bucketValue.files.append(file);\n 1616 |         intervalSyncBuckets.insert(intervalBucketKey, bucketValue);\n 1617 |     }","lines":10,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/syncengine.cpp#L1608-L1617"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"fromProperties() asserts the parsed last-modified date is valid (Q_ASSERT(date.isValid())) but then only assigns _modtime when date.toSecsSinceEpoch() > 0. In release builds the assert is compiled out; if the server sends an unparseable getlastmodified the item silently keeps _modtime == 0, which later causes 'invalid modification time' errors. A malformed/empty date from the server should be handled gracefully, not asserted.","fix":"Remove the Q_ASSERT and handle an invalid/zero date explicitly (log and leave modtime unset, or treat as an error), rather than relying on a debug-only assertion against server-controlled data.","locations":[{"ref":"src/libsync/syncfileitem.cpp:229-235","code":"  229 |     auto getlastmodifiedValue = properties.value(QStringLiteral(\"getlastmodified\"));\n  230 |     getlastmodifiedValue.replace(\"GMT\", \"+0000\");\n  231 |     const auto date = QDateTime::fromString(getlastmodifiedValue, Qt::RFC2822Date);\n  232 |     Q_ASSERT(date.isValid());\n  233 |     if (date.toSecsSinceEpoch() > 0) {\n  234 |         item->_modtime = date.toSecsSinceEpoch();\n  235 |     }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/syncfileitem.cpp#L229-L235"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"xattrGet uses a fixed 256-byte buffer. If the stored attribute value is larger than 256 bytes, getxattr fails with ERANGE and returns -1, which the function maps to 'attribute not present' (returns empty Optional). A placeholder whose marker happens to exceed the buffer would be silently treated as a regular file. The size should be queried first (getxattr with size 0) or ERANGE handled by re-reading with a larger buffer.","fix":"Call getxattr(path, name, nullptr, 0) to obtain the real size, then resize and read; or loop on ERANGE growing the buffer.","locations":[{"ref":"src/libsync/vfs/xattr/xattrwrapper_linux.cpp:21-30","code":"   21 |     constexpr auto bufferSize = 256;\n   22 |     QByteArray result;\n   23 |     result.resize(bufferSize);\n   24 |     const auto count = getxattr(path.constData(), name.constData(), result.data(), bufferSize);\n   25 |     if (count >= 0) {\n   26 |         result.resize(static_cast<int>(count) - 1);\n   27 |         return result;\n   28 |     } else {\n   29 |         return {};\n   30 |     }","lines":10,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/xattr/xattrwrapper_linux.cpp#L21-L30"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ChecksumCalculator::calculate() asserts the algorithm result without distinguishing a genuinely empty file from a failure. For an empty input file (size 0) the crypto branch produces the hash of zero bytes (non-empty hex), but the Adler32 branch returns QByteArray::number(_adlerHash,16) for the initial seed; meanwhile calcCryptoHash() in checksums.cpp returns an EMPTY QByteArray for empty data. These two code paths therefore disagree on the checksum of an empty file (one returns the real digest, the other returns empty), which can cause spurious content-change detection / re-upload.","fix":"Make empty-input handling consistent between ChecksumCalculator and calcCryptoHash (either both return the digest of zero bytes, or both return empty).","locations":[{"ref":"src/common/checksumcalculator.cpp:67-132","code":"   67 | QByteArray ChecksumCalculator::calculate()\n   68 | {\n   69 |     QByteArray result;\n   70 | \n   71 |     if (!_isInitialized) {\n   72 |         return result;\n   73 |     }\n   74 | \n   75 |     Q_ASSERT(!_device->isOpen());\n   76 |     if (_device->isOpen()) {\n   77 |         qCWarning(lcChecksumCalculator) << \"Device already open. Ignoring.\";\n   78 |     }\n   79 | \n   80 |     if (!_device->isOpen() && !_device->open(QIODevice::ReadOnly)) {\n   81 |         if (auto file = qobject_cast<QFile *>(_device.data())) {\n   82 |             qCWarning(lcChecksumCalculator) << \"Could not open file\" << file->fileName() << \"for reading to compute a checksum\" << file->errorString();\n   83 |         } else {\n   84 |             qCWarning(lcChecksumCalculator) << \"Could not open device\" << _device.data() << \"for reading to compute a checksum\" << _device->errorString();\n   85 |         }\n   86 |         return result;\n   87 |     }\n   88 | \n   89 |     for (;;) {\n   90 |         QMutexLocker locker(&_deviceMutex);\n   91 |         if (!_device->isOpen() || _device->atEnd()) {\n   92 |             break;\n   93 |         }\n   94 |         const auto toRead = qMin(_device->bytesAvailable(), bufSize);\n   95 |         if (toRead <= 0) {\n   96 |             break;\n   97 |         }\n   98 |         QByteArray buf(toRead, Qt::Uninitialized);\n   99 |         const auto sizeRead = _device->read(buf.data(), toRead);\n  100 |         if (sizeRead <= 0) {\n  101 |             break;\n  102 |         }\n  103 |         if (!addChunk(buf, sizeRead)) {\n  104 |             break;\n  105 |         }\n  106 |     }\n  107 | \n  108 |     {\n  109 |         QMutexLocker locker(&_deviceMutex);\n  110 |         if (!_device->isOpen()) {\n  111 |             return result;\n  112 |         }\n  113 |     }\n  114 | \n  115 |     if (_algorithmType == AlgorithmType::Adler32) {\n  116 |         result = QByteArray::number(_adlerHash, 16);\n  117 |     } else {\n  118 |         Q_ASSERT(_cryptographicHash);\n  119 |         if (_cryptographicHash) {\n  120 |             result = _cryptographicHash->result().toHex();\n  121 |         }\n  122 |     }\n  123 | \n  124 |     {\n  125 |         QMutexLocker locker(&_deviceMutex);\n  126 |         if (_device->isOpen()) {\n  127 |             _device->close();\n  128 |         }\n  129 |     }\n  130 | \n  131 |     return result;\n  132 | }","lines":66,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/checksumcalculator.cpp#L67-L132"},{"ref":"src/common/checksums.cpp:82-90","code":"   82 | static QByteArray calcCryptoHash(const QByteArray &data, QCryptographicHash::Algorithm algo)\n   83 | {\n   84 |     if (data.isEmpty()) {\n   85 |         return {};\n   86 |     }\n   87 |     QCryptographicHash crypto(algo);\n   88 |     crypto.addData(data);\n   89 |     return crypto.result().toHex();\n   90 | }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac535 {"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"findBestChecksum() searches for the algorithm offset `i` inside a QString (UTF-16 code units) built from _checksums, then uses that index `i` to call _checksums.mid(i, end-i) and _checksums.indexOf(' ', i) on the original QByteArray (bytes). For any non-ASCII bytes preceding the checksum token the QString index and QByteArray byte offset diverge, yielding a wrong/garbled substring. In practice checksum headers are ASCII so this is latent, but the mixed indexing is incorrect.","fix":"Perform all the indexing on a single representation: search and slice on the QByteArray (e.g. using QByteArray::indexOf with case handling) or convert end offsets via the same QString.","locations":[{"ref":"src/common/checksums.cpp:108-132","code":"  108 | QByteArray findBestChecksum(const QByteArray &_checksums)\n  109 | {\n  110 |     if (_checksums.isEmpty()) {\n  111 |         return {};\n  112 |     }\n  113 |     const auto checksums = QString::fromUtf8(_checksums);\n  114 |     int i = 0;\n  115 |     // The order of the searches here defines the preference ordering.\n  116 |     if (-1 != (i = checksums.indexOf(QLatin1String(\"SHA3-256:\"), 0, Qt::CaseInsensitive))\n  117 |         || -1 != (i = checksums.indexOf(QLatin1String(\"SHA256:\"), 0, Qt::CaseInsensitive))\n  118 |         || -1 != (i = checksums.indexOf(QLatin1String(\"SHA1:\"), 0, Qt::CaseInsensitive))\n  119 |         || -1 != (i = checksums.indexOf(QLatin1String(\"MD5:\"), 0, Qt::CaseInsensitive))\n  120 |         || -1 != (i = checksums.indexOf(QLatin1String(\"ADLER32:\"), 0, Qt::CaseInsensitive))) {\n  121 |         // Now i is the start of the best checksum\n  122 |         // Grab it until the next space or end of xml or end of string.\n  123 |         int end = _checksums.indexOf(' ', i);\n  124 |         // workaround for https://github.com/owncloud/core/pull/38304\n  125 |         if (end == -1) {\n  126 |             end = _checksums.indexOf('<', i);\n  127 |         }\n  128 |         return _checksums.mid(i, end - i);\n  129 |     }\n  130 |     qCWarning(lcChecksums) << \"Failed to parse\" << _checksums;\n  131 |     return {};\n  132 | }","lines":25,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/checksums.cpp#L108-L132"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"getRootE2eFolderRecord() returns true (success) after exhausting all path components without finding a top-level encrypted folder record. The output rec is left in whatever state the last getFileRecord() produced (possibly a valid but non-toplevel record, or invalid). Callers checking only the bool return value cannot distinguish 'found root e2ee folder' from 'walked to the top and found nothing', risking acting on a stale/incorrect record.","fix":"Return false (or clear rec) when the loop completes without locating a top-level encrypted folder, so the not-found case is distinguishable from success.","locations":[{"ref":"src/common/syncjournaldb.cpp:1147-1181","code":" 1147 | bool SyncJournalDb::getRootE2eFolderRecord(const QString &remoteFolderPath, SyncJournalFileRecord *rec)\n 1148 | {\n 1149 |     Q_ASSERT(rec);\n 1150 |     rec->_path.clear();\n 1151 |     Q_ASSERT(!rec->isValid());\n 1152 | \n 1153 |     Q_ASSERT(!remoteFolderPath.isEmpty());\n 1154 | \n 1155 |     Q_ASSERT(!remoteFolderPath.isEmpty() && remoteFolderPath != QStringLiteral(\"/\"));\n 1156 |     if (remoteFolderPath.isEmpty() || remoteFolderPath == QStringLiteral(\"/\")) {\n 1157 |         qCWarning(lcDb) << \"Invalid folder path!\";\n 1158 |         return false;\n 1159 |     }\n 1160 | \n 1161 |     auto remoteFolderPathSplit = remoteFolderPath.split(QLatin1Char('/'), Qt::SkipEmptyParts);\n 1162 | \n 1163 |     if (remoteFolderPathSplit.isEmpty()) {\n 1164 |         qCWarning(lcDb) << \"Invalid folder path!\";\n 1165 |         return false;\n 1166 |     }\n 1167 | \n 1168 |     while (!remoteFolderPathSplit.isEmpty()) {\n 1169 |         const auto result = getFileRecord(remoteFolderPathSplit.join(QLatin1Char('/')), rec);\n 1170 |         if (!result) {\n 1171 |             return false;\n 1172 |         }\n 1173 |         if (rec->isE2eEncrypted() && rec->_e2eMangledName.isEmpty()) {\n 1174 |             // it's a toplevel folder record\n 1175 |             return true;\n 1176 |         }\n 1177 |         remoteFolderPathSplit.removeLast();\n 1178 |     }\n 1179 | \n 1180 |     return true;\n 1181 | }","lines":35,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/syncjournaldb.cpp#L1147-L1181"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"listFilesInPath() guards against parent_hash() collisions with `rec._path.indexOf(\"/\", path.size() + 1) > 0`. Using `> 0` instead of `>= 0` (or `!= -1`) means a '/' located exactly at byte offset 0 would be treated as 'no deeper slash'; while offset 0 is unlikely for these relative paths, the idiomatic and correct test for 'contains a separator' is `!= -1`. The current comparison can misclassify edge cases as non-collisions and pass through records that are actually in a sub-directory.","fix":"Use `rec._path.indexOf(\"/\", path.size() + 1) != -1` to detect any deeper path separator.","locations":[{"ref":"src/common/syncjournaldb.cpp:1654-1657","code":" 1654 |         if (!rec._path.startsWith(path) || rec._path.indexOf(\"/\", path.size() + 1) > 0) {\n 1655 |             qWarning(lcDb) << \"hash collision\" << path << rec.path();\n 1656 |             continue;\n 1657 |         }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/syncjournaldb.cpp#L1654-L1657"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"AccountManager::saveAccountState() opens the account group and immediately ends it without writing anything (beginGroup/endGroup with empty body), then syncs. The function is effectively a no-op that only forces a settings->sync() under the misleading name 'saveAccountState'. Either it is dead/ineffective or a save body was lost.","fix":"Remove the function if unused, or implement the intended per-account-state persistence inside the group.","locations":[{"ref":"src/gui/accountmanager.cpp:409-418","code":"  409 | void AccountManager::saveAccountState(AccountState *a)\n  410 | {\n  411 |     qCDebug(lcAccountManager) << \"Saving account state\" << a->account()->url().toString();\n  412 |     const auto settings = ConfigFile::settingsWithGroup(QLatin1String(accountsC));\n  413 |     settings->beginGroup(a->account()->id());\n  414 |     settings->endGroup();\n  415 | \n  416 |     settings->sync();\n  417 |     qCDebug(lcAccountManager) << \"Saved account state settings, status:\" << settings->status();\n  418 | }","lines":10,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/accountmanager.cpp#L409-L418"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AccountManager::account(const QString &name) looks up an account by display name, but display names are not guaranteed unique across accounts (two accounts on the same server with the same user display name). The find_if returns the first match, which may be the wrong account. Callers expecting a specific account by id will silently get an arbitrary one.","fix":"Prefer lookup by stable id / userIdAtHostWithPort (as accountFromUserId does) rather than display name, or document that this is best-effort and may be ambiguous.","locations":[{"ref":"src/gui/accountmanager.cpp:726-732","code":"  726 | AccountStatePtr AccountManager::account(const QString &name)\n  727 | {\n  728 |     const auto it = std::find_if(_accounts.cbegin(), _accounts.cend(), [name](const auto &acc) {\n  729 |         return acc->account()->displayName() == name;\n  730 |     });\n  731 |     return it != _accounts.cend() ? *it : AccountStatePtr();\n  732 | }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/accountmanager.cpp#L726-L732"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Activity::fromActivityJson only parses subject_rich when `richSubjectData.size() > 1`. The server format is `[displayString, paramsObject]`; when there are zero parameters the array may legitimately be `[string]` (size 1) or `[string, {}]`. With size 1 the rich subject (and _subjectDisplay) is dropped entirely, so the activity falls back to the raw _subject. Also, `_subjectRichParameters[word]` inside the replacement loop default-inserts an empty RichSubjectParameter when a placeholder name is absent from the params map.","fix":"Handle size >= 1 (use index 0 as display string, treat missing index 1 as empty params), and use contains()/value() instead of operator[] when substituting placeholders.","locations":[{"ref":"src/gui/activity/activitydata.cpp:94-132","code":"   94 |     auto richSubjectData = json.value(\"subject_rich\"_L1).toArray();\n   95 | \n   96 |     if(richSubjectData.size() > 1) {\n   97 |         activity._subjectRich = richSubjectData[0].toString();\n   98 |         auto parameters = richSubjectData[1].toObject();\n   99 |         // keep the contents inside the {braces} in sync with server's \\OCP\\RichObjectStrings\\IValidator::PLACEHOLDER_REGEX\n  100 |         const QRegularExpression subjectRichParameterRe(uR\"#(({[A-Za-z][A-Za-z0-9\\-_.]+}))#\"_s);\n  101 |         const QRegularExpression subjectRichParameterBracesRe(u\"[{}]\"_s);\n  102 | \n  103 |         for (auto i = parameters.begin(); i != parameters.end(); ++i) {\n  104 |             const auto parameterJsonObject = i.value().toObject();\n  105 | \n  106 |             const auto richParamLink = stringToUrl(account->url(), parameterJsonObject.value(\"link\"_L1).toString());\n  107 |             activity._subjectRichParameters[i.key()] = QVariant::fromValue(Activity::RichSubjectParameter{\n  108 |                 parameterJsonObject.value(\"type\"_L1).toString(),\n  109 |                 parameterJsonObject.value(\"id\"_L1).toString(),\n  110 |                 parameterJsonObject.value(\"name\"_L1).toString(),\n  111 |                 parameterJsonObject.contains(\"path\"_L1) ? parameterJsonObject.value(\"path\"_L1).toString() : QString(),\n  112 |                 richParamLink,\n  113 |             });\n  114 | \n  115 |             if (activity._objectType == \"calendar\"_L1 && activity._link.isEmpty()) {\n  116 |                 activity._link = richParamLink;\n  117 |             }\n  118 |         }\n  119 | \n  120 |         auto displayString = activity._subjectRich;\n  121 |         auto subjectRichParameterMatch = subjectRichParameterRe.globalMatch(displayString);\n  122 | \n  123 |         while (subjectRichParameterMatch.hasNext()) {\n  124 |             const auto match = subjectRichParameterMatch.next();\n  125 |             auto word = match.captured(1);\n  126 |             word.remove(subjectRichParameterBracesRe);\n  127 | \n  128 |             displayString = displayString.replace(match.captured(1), activity._subjectRichParameters[word].value<Activity::RichSubjectParameter>().name);\n  129 |         }\n  130 | \n  131 |         activity._subjectDisplay = displayString;\n  132 |     }","lines":39,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/activity/activitydata.cpp#L94-L132"}]},

{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"SortedActivityListModel::lessThan returns based only on the LEFT operand's type for the dummy rows: DummyFetchingActivityType left always returns true and DummyMoreActivitiesAvailableType left always returns false, without inspecting the right operand. lessThan(x,x) for a dummy-fetching row returns true, violating the irreflexivity required for a strict weak ordering, which is undefined behavior for std::sort/QSortFilterProxyModel and can cause inconsistent ordering.","fix":"Compare both sides, e.g. handle the case where left and right are the same dummy type (return false) and where the right side is a dummy type, before the unconditional returns.","locations":[{"ref":"src/gui/activity/sortedactivitylistmodel.cpp:56-64","code":"   56 |     const auto leftType = leftActivity._type;\n   57 | \n   58 |     if (leftType == Activity::DummyFetchingActivityType) {\n   59 |         // The fetching activities dummy activity always goes at the top\n   60 |         return true;\n   61 |     } else if (leftType == Activity::DummyMoreActivitiesAvailableType) {\n   62 |         // Likewise the dummy \"more activities available\" activity always goes at the bottom\n   63 |         return false;\n   64 |     }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/activity/sortedactivitylistmodel.cpp#L56-L64"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"DateFieldBackend converts msec-since-epoch to a date inconsistently. The getters (dateMsecs/minimumDateMsecs/maximumDateMsecs) and setDateMsecs use UTC (startOfDay(QTimeZone::utc()) / .toUTC()), but setMinimumDateMsecs() and setMaximumDateMsecs() use QDateTime::fromMSecsSinceEpoch() in LOCAL time without .toUTC(). In timezones behind UTC this yields an off-by-one-day minimum/maximum bound, which then feeds validDate() and can wrongly accept/reject an expiry date.","fix":"Use .toUTC() (matching setDateMsecs and the UTC getters) when deriving min/max QDate from milliseconds.","locations":[{"ref":"src/gui/filedetails/datefieldbackend.cpp:118-126","code":"  118 | void DateFieldBackend::setMinimumDateMsecs(const qint64 minimumDateMsecs)\n  119 | {\n  120 |     if (_minimumDate.startOfDay(QTimeZone::utc()).toMSecsSinceEpoch() == minimumDateMsecs) {\n  121 |         return;\n  122 |     }\n  123 | \n  124 |     const auto dt = QDateTime::fromMSecsSinceEpoch(minimumDateMsecs);\n  125 |     setMinimumDate(dt.date());\n  126 | }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/filedetails/datefieldbackend.cpp#L118-L126"},{"ref":"src/gui/filedetails/datefieldbackend.cpp:150-158","code":"  150 | void DateFieldBackend::setMaximumDateMsecs(const qint64 maximumDateMsecs)\n  151 | {\n  152 |     if (_maximumDate.startOfDay(QTimeZone::utc()).toMSecsSinceEpoch() == maximumDateMsecs) {\n  153 |         return;\n  154 |     }\n  155 | \n  156 |     const auto dt = QDateTime::fromMSecsSinceEpoch(maximumDateMsecs);\n  157 |     setMaximumDate(dt.date());\n  158 | }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/filedetails/datefieldbackend.cpp#L150-L158"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"ShareeModel::insertSearchGloballyItem() comment says it removes a stray placeholder \"if it somehow appeared not at the end\", but the guard `foundIt != end && (foundIt+1) != end` erases the placeholder only when it is NOT last, then unconditionally push_back()s the same placeholder pointer. If the placeholder already happens to be the last element it is left in place AND appended again, producing two model rows backed by the identical Sharee pointer.","fix":"Erase the existing placeholder whenever it is found (regardless of position) before appending, or skip the append when it is already last.","locations":[{"ref":"src/gui/filedetails/shareemodel.cpp:267-288","code":"  267 | void ShareeModel::insertSearchGloballyItem(const QVector<ShareePtr> &newShareesFetched)\n  268 | {\n  269 |     const auto foundIt = std::find_if(std::begin(_sharees), std::end(_sharees), [](const ShareePtr &sharee) {\n  270 |         return sharee->type() == Sharee::LookupServerSearch || sharee->type() == Sharee::LookupServerSearchResults;\n  271 |     });\n  272 | \n  273 |     // remove it if it somehow appeared not at the end, to avoid writing complex proxy models for sorting\n  274 |     if (foundIt != std::end(_sharees) && (foundIt + 1) != std::end(_sharees)) {\n  275 |         _sharees.erase(foundIt);\n  276 |     }\n  277 | \n  278 |     _sharees.push_back(_searchGloballyPlaceholder);\n  279 | \n  280 |     if (lookupMode() == LookupMode::GlobalSearch) {\n  281 |         const auto displayName = newShareesFetched.isEmpty() ? tr(\"No results found\") : tr(\"Global search results\");\n  282 |         _searchGloballyPlaceholder->setDisplayName(displayName);\n  283 |         _searchGloballyPlaceholder->setType(Sharee::LookupServerSearchResults);\n  284 |     } else {\n  285 |         _searchGloballyPlaceholder->setDisplayName(tr(\"Search globally\"));\n  286 |         _searchGloballyPlaceholder->setType(Sharee::LookupServerSearch);\n  287 |     }\n  288 | }","lines":22,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/filedetails/shareemodel.cpp#L267-L288"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"SortedShareModel::lessThan() violates strict weak ordering for the placeholder/internal-link special cases. For two TypePlaceholderLink items lessThan(a,b) returns true (leftShareType==TypePlaceholderLink -> return true) and lessThan(b,a) also returns true; symmetrically TypeInternalLink always returns false on the left. Equal elements compared both ways must not both return true; this can yield inconsistent ordering (and is UB for std::sort-style comparators). In practice only single placeholder/internal entries exist, limiting impact.","fix":"Handle the case where both shares are the same special type (return false) before the one-sided returns, so the comparator is antisymmetric.","locations":[{"ref":"src/gui/filedetails/sortedsharemodel.cpp:31-49","code":"   31 |     const auto leftShareType = leftShare->getShareType();\n   32 | \n   33 |     // Placeholder link shares always go at top\n   34 |     if (leftShareType == Share::TypePlaceholderLink) {\n   35 |         return true;\n   36 |     } else if (leftShareType == Share::TypeInternalLink) {\n   37 |         // Internal links always at bottom\n   38 |         return false;\n   39 |     }\n   40 | \n   41 |     const auto rightShareType = rightShare->getShareType();\n   42 | \n   43 |     // Placeholder link shares always go at top\n   44 |     if (rightShareType == Share::TypePlaceholderLink) {\n   45 |         return false;\n   46 |     } else if (rightShareType == Share::TypeInternalLink) {\n   47 |         // Internal links always at bottom\n   48 |         return true;\n   49 |     }","lines":19,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/filedetails/sortedsharemodel.cpp#L31-L49"}]},

src/gui/folder.cpp#L887-L916"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"FolderStatusModel::slotUpdateDirectories selective-sync black-list matching uses `str.startsWith(relativePath)` (line 801) to mark a subfolder PartiallyChecked. Because there is no trailing-slash boundary, a blacklist entry for a sibling whose name is a prefix (e.g. blacklist 'foobar/' while iterating folder 'foo') will incorrectly flag 'foo' as partially checked. The exact-match and '/' cases are handled but the prefix case lacks a separator check.","fix":"Require a path boundary: compare against `relativePath` with a trailing '/' (e.g. `str.startsWith(relativePath + '/')`) for the PartiallyChecked case.","locations":[{"ref":"src/gui/folderstatusmodel.cpp:803-811","code":"  803 |             for (const auto &str : std::as_const(selectiveSyncBlackList)) {\n  804 |                 if (str == relativePath || str == QLatin1String(\"/\")) {\n  805 |                     newInfo._checked = Qt::Unchecked;\n  806 |                     break;\n  807 |                 } else if (str.startsWith(relativePath)) {\n  808 |                     newInfo._checked = Qt::PartiallyChecked;\n  809 |                 }\n  810 |             }\n  811 |         }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderstatusmodel.cpp#L803-L811"}]},

 624 |     }","lines":20,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/owncloudgui.cpp#L605-L624"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"SslButton::updateAccountState() returns early (and only toggles visibility) when accountState is non-null but not connected, BEFORE assigning `_accountState = accountState`. As a result _accountState can remain a stale/previous pointer while the button is shown/hidden, and the subsequent slotUpdateMenu() builds its menu from the stale account.","fix":"Assign _accountState before the connected/visibility checks, or clear it on the disconnected path.","locations":[{"ref":"src/gui/sslbutton.cpp:154-173","code":"  154 | void SslButton::updateAccountState(AccountState *accountState)\n  155 | {\n  156 |     if (!accountState || !accountState->isConnected()) {\n  157 |         setVisible(false);\n  158 |         return;\n  159 |     } else {\n  160 |         setVisible(true);\n  161 |     }\n  162 |     _accountState = accountState;\n  163 | \n  164 |     AccountPtr account = _accountState->account();\n  165 |     if (account->url().scheme() == QLatin1String(\"https\")) {\n  166 |         setIcon(QIcon(QLatin1String(\":/client/theme/lock-https.svg\")));\n  167 |         QSslCipher cipher = account->_sessionCipher;\n  168 |         setToolTip(tr(\"This connection is encrypted using %1 bit %2.\\n\").arg(cipher.usedBits()).arg(cipher.name()));\n  169 |     } else {\n  170 |         setIcon(QIcon(QLatin1String(\":/client/theme/lock-broken.svg\")));\n  171 |         setToolTip(tr(\"This connection is NOT secure as it is not encrypted.\\n\"));\n  172 |     }\n  173 | }","lines":20,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/sslbutton.cpp#L154-L173"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"SyncConflictsModel::flags() returns base flags for top-level (valid-parent == false) indices and the editable/selectable flags only when index.parent().isValid(). But this is a flat list model (rowCount returns 0 for any valid parent), so list items have an INVALID parent. The condition `if (!index.parent().isValid())` therefore matches the real items and returns non-editable base flags, while the editable branch (parent valid) is effectively unreachable for actual rows. This makes the conflict rows non-editable via flags(), contradicting setData() handling ExistingSelected/ConflictSelected as editable.","fix":"Invert the logic: for valid top-level indices (invalid parent) return Selectable|Editable|enabled flags; the parent-valid case is the one that should return empty/base flags.","locations":[{"ref":"src/gui/syncconflictsmodel.cpp:138-149","code":"  138 | Qt::ItemFlags SyncConflictsModel::flags(const QModelIndex &index) const\n  139 | {\n  140 |     auto result = Qt::ItemFlags{};\n  141 | \n  142 |     if (!index.parent().isValid()) {\n  143 |         result = QAbstractListModel::flags(index);\n  144 |         return result;\n  145 |     }\n  146 | \n  147 |     result = Qt::ItemIsSelectable | Qt::ItemIsEditable;\n  148 |     return result;\n  149 | }","lines":12,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/syncconflictsmodel.cpp#L138-L149"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"showDesktopNotification(const ActivityList&) computes notificationId as `-static_cast<int>(qHash(subject))` where subject is the translated '%n notification(s)' string. The id therefore depends only on the COUNT of notifications, not their content, so two distinct batches with the same count share an id and the second batch is suppressed by canShowNotification's _notifiedNotifications dedup.","fix":"Derive the dedup id from the actual activity ids/content, not from the localized count string.","locations":[{"ref":"src/gui/tray/usermodel.cpp:584-609","code":"  584 | void User::showDesktopNotification(const ActivityList &activityList)\n  585 | {\n  586 |     const auto subject = tr(\"%n notification(s)\", nullptr, activityList.count());\n  587 |     const auto notificationId = -static_cast<int>(qHash(subject));\n  588 | \n  589 |     if (!canShowNotification(notificationId)) {\n  590 |         return;\n  591 |     }\n  592 | \n  593 |     const auto multipleAccounts = AccountManager::instance()->accounts().count() > 1;\n  594 |     const auto message = multipleAccounts ? activityList.constFirst()._accName : QString();\n  595 | \n  596 |     // Notification ids are uints, which are 4 bytes. Error activities don't have ids, however, so we generate one.\n  597 |     // To avoid possible collisions between the activity ids which are actually the notification ids received from\n  598 |     // the server (which are always positive) and our \"fake\" error activity ids, we assign a negative id to the\n  599 |     // error notification.\n  600 |     //\n  601 |     // To ensure that we can still treat an unsigned int as normal, we use a long, which is 8 bytes.\n  602 | \n  603 |     Logger::instance()->postGuiLog(subject, message);\n  604 | \n  605 |     for (const auto &activity : activityList) {\n  606 |         _notifiedNotifications.insert(activity._id);\n  607 |         _activityModel->addNotificationToActivityList(activity);\n  608 |     }\n  609 | }","lines":26,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/tray/usermodel.cpp#L584-L609"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"AbstractNetworkJob::slotTimeout() early-returns when the static enableTimeout flag is false, but does NOT set _timedout and does NOT restart any handling, meaning a genuinely stuck request will hang forever with no timeout. The flag is a global workaround (issue 7184) that, when toggled off, disables ALL job timeouts process-wide, which is a heavy-handed and easily-forgotten kill switch.","fix":"Scope the timeout disable per-job or per-account, or document/guard the global flag's lifetime.","locations":[{"ref":"src/libsync/abstractnetworkjob.cpp:395-405","code":"  395 | void AbstractNetworkJob::slotTimeout()\n  396 | {\n  397 |     // TODO: workaround, find cause of https://github.com/nextcloud/desktop/issues/7184\n  398 |     if (!AbstractNetworkJob::enableTimeout) {\n  399 |         return;\n  400 |     }\n  401 | \n  402 |     _timedout = true;\n  403 |     qCWarning(lcNetworkJob) << \"Network job timeout\" << (reply() ? reply()->request().url() : path());\n  404 |     onTimedOut();\n  405 | }","lines":11,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/abstractnetworkjob.cpp#L395-L405"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AccessManager authenticationRequired handler sets a random UUID username when the authenticator user is empty, to avoid Qt re-prompting. This injects a bogus credential into the request which the server will reject; the comment intent is to break Qt's retry loop, but for proxies/servers expecting empty-then-real credentials this can cause spurious 401/407 and confuse the auth-type detection logic that inspects WWW-Authenticate.","fix":"Document the workaround clearly and ensure it does not interfere with DetermineAuthTypeJob (which already sets DontAddCredentialsAttribute).","locations":[{"ref":"src/libsync/accessmanager.cpp:38-45","code":"   38 |     connect(this, &QNetworkAccessManager::authenticationRequired, this, [](QNetworkReply *reply, QAuthenticator *authenticator) {\n   39 |         Q_UNUSED(reply)\n   40 | \n   41 |         if (authenticator->user().isEmpty()) {\n   42 |             qCWarning(lcAccessManager) << \"Server requested authentication and we didn't provide a user\";\n   43 |             authenticator->setUser(QUuid::createUuid().toString());\n   44 |         }\n   45 |     });","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/accessmanager.cpp#L38-L45"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Account::accentColor() casts (1 - getColorDarkness(accentColor)) * 8 to int then squares it. getColorDarkness returns [0,1], so the factor is 0..8; squaring yields up to 64 added to baseAdjustment 125, giving darker(189) max. This is fine for valid colors, but if serverColor() is an invalid QColor (default-constructed from a bad server theming string), getColorDarkness reads red()/green()/blue() of an invalid color (returns -1 each), producing darkness>1 and a negative darknessAdjustment, then darker(negative) which QColor treats as lighter — an unintended inversion for malformed server colors.","fix":"Validate accentColor.isValid() and fall back to a default before computing darkness adjustments.","locations":[{"ref":"src/libsync/account.cpp:262-272","code":"  262 | QColor Account::accentColor() const\n  263 | {\n  264 |     const auto accentColor = serverColor();\n  265 |     constexpr auto effectMultiplier = 8;\n  266 | \n  267 |     auto darknessAdjustment = static_cast<int>((1 - Theme::getColorDarkness(accentColor)) * effectMultiplier);\n  268 |     darknessAdjustment *= darknessAdjustment; // Square the value to pronounce the darkness more in lighter colours\n  269 |     constexpr auto baseAdjustment = 125;\n  270 |     const auto adjusted = Theme::isDarkColor(accentColor) ? accentColor : accentColor.darker(baseAdjustment + darknessAdjustment);\n  271 |     return adjusted;\n  272 | }","lines":11,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/account.cpp#L262-L272"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Account::setUrl() detects public links via regex but on the non-match branch sets _url = url while the match branch sets _url via QUrl::fromUserInput. _userVisibleUrl is always set to the raw url including, for public links, the embedded share token and (set) username — leaking the share token into the user-visible URL used by deprecatedPrivateLinkUrl and display paths.","fix":"Set _userVisibleUrl to the sanitized base URL for public links rather than the full token-bearing input.","locations":[{"ref":"src/libsync/account.cpp:582-597","code":"  582 | void Account::setUrl(const QUrl &url)\n  583 | {\n  584 |     const QRegularExpression discoverPublicLinks(R\"(((https|http)://[^/]*).*/s/([^/]*)$)\");\n  585 |     const auto isPublicLink = discoverPublicLinks.match(url.toString());\n  586 |     if (isPublicLink.hasMatch()) {\n  587 |         _url = QUrl::fromUserInput(isPublicLink.captured(1));\n  588 |         _url.setUserName(isPublicLink.captured(3));\n  589 |         setDavUser(isPublicLink.captured(3));\n  590 |         _isPublicLink = true;\n  591 |         _publicShareLinkUrl = url;\n  592 |     } else {\n  593 |         _url = url;\n  594 |     }\n  595 | \n  596 |     _userVisibleUrl = url;\n  597 | }","lines":16,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/account.cpp#L582-L597"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Account::serverVersionInt() parses serverVersion().split('.') and feeds components.value(0/1/2).toInt() into makeServerVersion. A version string with extra suffix like '28.0.1 (build x)' makes the patch component '1 (build x)'.toInt() return 0 silently, and any non-numeric major yields 0 making the client treat the server as undetected/oldest. No validation/logging of malformed version strings.","fix":"Use QVersionNumber::fromString (which stops at the first non-numeric) or validate components and log on failure.","locations":[{"ref":"src/libsync/account.cpp:813-820","code":"  813 | int Account::serverVersionInt() const\n  814 | {\n  815 |     // FIXME: Use Qt 5.5 QVersionNumber\n  816 |     const auto components = serverVersion().split('.');\n  817 |     return makeServerVersion(components.value(0).toInt(),\n  818 |         components.value(1).toInt(),\n  819 |         components.value(2).toInt());\n  820 | }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/account.cpp#L813-L820"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"BulkPropagatorDownloadJob::addDownloadItem asserts the item is a directory OR a virtual file, but the body then warns and returns for directories (and any non-virtual file). Yet start() Q_ASSERTs fileToDownload->_type == ItemTypeVirtualFile for every queued item. ItemTypeVirtualFileDehydration items are accepted by addDownloadItem but would trip the assert in start(). The accepted-type set is inconsistent between the two methods.","fix":"Make the accepted item types consistent: either reject dehydration items in addDownloadItem, or relax the Q_ASSERT in start() to allow the same types addDownloadItem allows.","locations":[{"ref":"src/libsync/bulkpropagatordownloadjob.cpp:30-38","code":"   30 | void BulkPropagatorDownloadJob::addDownloadItem(const SyncFileItemPtr &item)\n   31 | {\n   32 |     Q_ASSERT(item->isDirectory() || item->_type == ItemTypeVirtualFileDehydration || item->_type == ItemTypeVirtualFile);\n   33 |     if (item->isDirectory() || (item->_type != ItemTypeVirtualFileDehydration && item->_type != ItemTypeVirtualFile)) {\n   34 |         qCWarning(lcBulkPropagatorDownloadJob) << \"Failed to process bulk download for a non-virtual file\" << item->_originalFile;\n   35 |         return;\n   36 |     }\n   37 |     _filesToDownload.push_back(item);\n   38 | }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/bulkpropagatordownloadjob.cpp#L30-L38"},{"ref":"src/libsync/bulkpropagatordownloadjob.cpp:72-73","code":"   72 |     for (const auto &fileToDownload : std::as_const(_filesToDownload)) {\n   73 |         Q_ASSERT(fileToDownload->_type == ItemTypeVirtualFile);","lines":2,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/bulkpropagatordownloadjob.cpp#L72-L73"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Capabilities::clientSideEncryptionAvailable() requires (major >= 1 && minor >= 0) so a future API version like 2.0 with minor==0 still passes, but a version like 1.5 also passes while 0.9 fails as intended; however 'minor >= 0' is always true for unsigned-style parsing and the real intent is 'major >= 1'. More importantly, if api-version is e.g. '2' (no minor), splittedVersion.size()<=1 makes minor=0 with ok=false handling — but the code sets minor only when size>1, otherwise minor stays 0 and ok stays false, causing the function to return false for a valid '2' version.","fix":"Treat a missing minor component as minor=0 with ok=true; only fail when a present minor component fails to parse.","locations":[{"ref":"src/libsync/capabilities.cpp:130-141","code":"  130 |     ok = false;\n  131 |     const auto minor = splittedVersion.size() > 1 ? splittedVersion.at(1).toInt(&ok) : 0;\n  132 |     if (!ok) {\n  133 |         qCWarning(lcServerCapabilities) << \"Didn't understand version scheme (minor), E2EE disabled\" << version;\n  134 |         return false;\n  135 |     }\n  136 | \n  137 |     const auto capabilityAvailable = (major >= 1 && minor >= 0);\n  138 |     if (!capabilityAvailable) {\n  139 |         qCInfo(lcServerCapabilities) << \"Incompatible E2EE API version:\" << version;\n  140 |     }\n  141 |     return capabilityAvailable;","lines":12,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/capabilities.cpp#L130-L141"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"ConfigFile::setupDefaultExcludeFilePaths() logs 'Migrating system list <legacyList> to user list' but uses legacyList in the message while actually copying systemList (QFile::copy(systemList, userList)). Misleading log: it reports the wrong source file when migrating from the system list.","fix":"Log systemList instead of legacyList in the system-list migration branch.","locations":[{"ref":"src/libsync/configfile.cpp:1352-1354","code":" 1352 |         } else if (QFile::copy(systemList, userList)) {\n 1353 |             qCInfo(lcConfigFile) << \"Migrating system list\" << legacyList << \"to user list\" << userList;\n 1354 |         }","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/configfile.cpp#L1352-L1354"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"queryEditorsKeepingFileBusy() hardcodes appending the literal 'PowerPDF.exe' to the matched-editors list whenever any editor matched, in addition to the actual detected process names. This produces a misleading editor name in the user-facing error string ('Could not upload file, because it is open in \"...PowerPDF.exe\"') that may not be the real process, and couples generic logic to one specific product.","fix":"Remove the unconditional push_back of 'PowerPDF.exe' (it is already covered by editorNamesForDelayedUpload matching), or only append it when actually detected.","locations":[{"ref":"src/libsync/discovery.cpp:2198-2200","code":" 2198 |     if (!matchingEditorsKeepingFileBusy.isEmpty()) {\n 2199 |         matchingEditorsKeepingFileBusy.push_back(\"PowerPDF.exe\");\n 2200 |     }","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/discovery.cpp#L2198-L2200"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"DiscoverySingleDirectoryJob::directoryListingIteratedSlot parses the first-directory 'size' property with QString::toInt() into the int64_t _size member, truncating folder sizes above 2GiB. Although _size is only used for the optional folder-size-limit feature, the 32-bit parse can misreport large folders as small and bypass the big-folder confirmation.","fix":"Parse with toLongLong() to match the int64_t _size field.","locations":[{"ref":"src/libsync/discoveryphase.cpp:539-541","code":"  539 |         if (map.contains(\"size\"_L1)) {\n  540 |             _size = map.value(\"size\"_L1).toInt();\n  541 |         }","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/discoveryphase.cpp#L539-L541"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"lsJobFinishedWithErrorSlot() builds an error string with a stray trailing curly closing quote character: tr(\"...reach out to your server administrator.”\") ends with U+201D (right double quotation mark) plus a closing paren, an obvious typo that leaks a stray '”' into the user-visible message.","fix":"Remove the stray U+201D character at the end of the translated string.","locations":[{"ref":"src/libsync/discoveryphase.cpp:617","code":"  617 |         errorString = tr(\"The server returned an unexpected response that couldn’t be read. Please reach out to your server administrator.”\");","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/discoveryphase.cpp#L617"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"setupExistingMetadataLegacy() applies QByteArray::fromBase64 three times for the 1.1/1.2 metadata key and twice for the 1.0 key 'to stick with the old wrong way'. fromBase64 silently ignores invalid input, so a corrupted or attacker-truncated metadata key decodes to a shorter/empty key without any error, and the resulting (possibly empty) key is then used as the AES key. Combined with verifyMetadataKey returning true for legacy versions, there is no integrity check on the legacy metadata key length.","fix":"Validate the decoded metadata key length (must equal metadataKeySize) before using it, and reject metadata when the decoded key is empty/short.","locations":[{"ref":"src/libsync/foldermetadata.cpp:339-377","code":"  339 |     const auto metadataKeyFromJson = fullMetaDataObj[metadataKeyKey].toString().toLocal8Bit();\n  340 |     if (!metadataKeyFromJson.isEmpty()) {\n  341 |         // parse version 1.1 and 1.2 (both must have a single \"metadataKey\"), not \"metadataKeys\" as 1.0\n  342 |         const auto decryptedMetadataKeyBase64 = decryptDataWithPrivateKey(metadataKeyFromJson, _account->e2e()->certificateSha256Fingerprint());\n  343 |         if (!decryptedMetadataKeyBase64.isEmpty()) {\n  344 |             // fromBase64() multiple times just to stick with the old wrong way\n  345 |             _binaryMetadataKeyForDecryption = QByteArray::fromBase64(QByteArray::fromBase64(QByteArray::fromBase64(decryptedMetadataKeyBase64)));\n  346 |         }\n  347 |     }\n  348 | \n  349 |     if (binaryMetadataKeyForDecryption().isEmpty() && _existingMetadataVersion < MetadataVersion::Version1_2) {\n  350 |         // parse version 1.0 (before security-vulnerability fix for metadata keys was released\n  351 |         qCDebug(lcCseMetadata()) << \"Migrating from\" << _existingMetadataVersion << \"to\"\n  352 |                                  << latestSupportedMetadataVersion();\n  353 |         const auto metadataKeys = fullMetaDataObj[\"metadataKeys\"].toObject();\n  354 |         if (metadataKeys.isEmpty()) {\n  355 |             qCWarning(lcCseMetadata()) << \"Could not migrate. No metadata keys found!\";\n  356 |             _account->reportClientStatus(OCC::ClientStatusReportingStatus::E2EeError_GeneralError);\n  357 |             return;\n  358 |         }\n  359 | \n  360 |         const auto &allKeys = metadataKeys.keys();\n  361 |         const auto &lastMetadataKeyFromJson = allKeys.last().toLocal8Bit();\n  362 |         if (!lastMetadataKeyFromJson.isEmpty()) {\n  363 |             const auto lastMetadataKeyValueFromJson = metadataKeys.value(lastMetadataKeyFromJson).toString().toLocal8Bit();\n  364 |             if (!lastMetadataKeyValueFromJson.isEmpty()) {\n  365 |                 const auto lastMetadataKeyValueFromJsonBase64 = decryptDataWithPrivateKey(lastMetadataKeyValueFromJson, _account->e2e()->certificateSha256Fingerprint());\n  366 |                 if (!lastMetadataKeyValueFromJsonBase64.isEmpty()) {\n  367 |                     _binaryMetadataKeyForDecryption = QByteArray::fromBase64(QByteArray::fromBase64(lastMetadataKeyValueFromJsonBase64));\n  368 |                 }\n  369 |             }\n  370 |         }\n  371 |     }\n  372 | \n  373 |     if (binaryMetadataKeyForDecryption().isEmpty()) {\n  374 |         qCWarning(lcCseMetadata()) << \"Could not setup existing metadata with missing metadataKeys!\";\n  375 |         _account->reportClientStatus(OCC::ClientStatusReportingStatus::E2EeError_GeneralError);\n  376 |         return;\n  377 |     }","lines":39,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/foldermetadata.cpp#L339-L377"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"LsColJob::propertyMapToRemoteInfo() asserts Q_ASSERT(date.isValid()) on the parsed getlastmodified value coming straight from the server. A malformed/absent date from a misbehaving server triggers an assertion abort in debug builds; in release the assert is a no-op but modtime silently stays 0. Server-controlled input should not drive an assertion.","fix":"Drop the assert and handle invalid dates gracefully (already partially handled by the toSecsSinceEpoch>0 check).","locations":[{"ref":"src/libsync/networkjobs.cpp:386-393","code":"  386 |         } else if (property == \"getlastmodified\"_L1) {\n  387 |             value.replace(\"GMT\", \"+0000\");\n  388 |             const auto date = QDateTime::fromString(value, Qt::RFC2822Date);\n  389 |             Q_ASSERT(date.isValid());\n  390 |             result.modtime = 0;\n  391 |             if (date.toSecsSinceEpoch() > 0) {\n  392 |                 result.modtime = date.toSecsSinceEpoch();\n  393 |             }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/networkjobs.cpp#L386-L393"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"clearAtEndOfToTimestamp() week handling computes days = Qt::Sunday - QDate::currentDate().dayOfWeek() then addDays(days + 1). Qt::Sunday is 7 and dayOfWeek() returns 1..7 (Mon..Sun). On Sunday this gives days=0, addDays(1)=next Monday; on Monday days=6, addDays(7)=next Monday. The 'end of week' therefore lands on the Monday after next week's start rather than the end of the current week, an off-by-one in the clear-status timing.","fix":"Recompute to target the intended end-of-week boundary (e.g. days to upcoming Sunday/Monday) without the extra +1.","locations":[{"ref":"src/libsync/ocsuserstatusconnector.cpp:110-113","code":"  110 |     } else if (clearAt._endof == \"week\"_L1) {\n  111 |         const auto days = Qt::Sunday - QDate::currentDate().dayOfWeek();\n  112 |         return QDate::currentDate().addDays(days + 1).startOfDay().toSecsSinceEpoch();\n  113 |     }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/ocsuserstatusconnector.cpp#L110-L113"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In conflictChecksumComputed, after FileSystem::getModTime, the code does Q_ASSERT(_item->_modtime > 0) followed by `if (_item->_modtime <= 0) { qCWarning(...); return; }`. The early return on invalid modtime leaves the download silently aborted with no done() call: the PropagateItemJob never reports completion, so the item can hang in a non-finished state for this code path (no done() and no startDownload()).","fix":"Call done() with an appropriate error status before returning when the freshly-read modtime is invalid, instead of returning without finishing the job.","locations":[{"ref":"src/libsync/propagatedownload.cpp:618-625","code":"  618 |         _item->_modtime = FileSystem::getModTime(fn);\n  619 |         Q_ASSERT(_item->_modtime > 0);\n  620 |         if (_item->_modtime <= 0) {\n  621 |             qCWarning(lcPropagateDownload()) << \"invalid modified time\" << _item->_file << _item->_modtime;\n  622 |             return;\n  623 |         }\n  624 |         updateMetadata(/*isConflict=*/false);\n  625 |         return;","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagatedownload.cpp#L618-L625"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"doStartUpload (NG) computes `_transferId = uint(...) ^ (uint(_fileToUpload._size) << 16) ^ ...`. _fileToUpload._size is a qint64; truncating to uint and shifting left by 16 discards the high bytes of the size, so very large files contribute little entropy and the comment elsewhere (slotPropfindFinished line 156-157) claiming 'size is xor'ed with the transfer id, therefore impossible that there is more data on the server than on the file' is not actually guaranteed by this weak hashing.","fix":"Document that _transferId is only a best-effort uniqueness token, and keep the explicit `_sent > _fileToUpload._size` runtime check (which is correctly present) as the real safeguard; do not rely on the XOR for correctness.","locations":[{"ref":"src/libsync/propagateuploadng.cpp:251","code":"  251 |     _transferId = uint(Utility::rand() ^ uint(_item->_modtime) ^ (uint(_fileToUpload._size) << 16) ^ qHash(_fileToUpload._file));","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagateuploadng.cpp#L251"},{"ref":"src/libsync/propagateuploadng.cpp:156-161","code":"  156 |     if (_sent > _fileToUpload._size) {\n  157 |         // Normally this can't happen because the size is xor'ed with the transfer id, and it is\n  158 |         // therefore impossible that there is more data on the server than on the file.\n  159 |         qCCritical(lcPropagateUploadNG) << \"Inconsistency while resuming \" << _item->_file\n  160 |                                       << \": the size on the server (\" << _sent << \") is bigger than the size of the file (\"\n  161 |                                       << _fileToUpload._size << \")\";","lines":6,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagateuploadng.cpp#L156-L161"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"slotUploadProgress reports `_sent + sent - total` as the progress value. _sent was already advanced by _currentChunkSize before the PUT started (startNextChunk increments _sent += _currentChunkSize at line 381), and `sent - total` is negative until the chunk fully uploads, so the reported progress is _sent minus the not-yet-sent remainder. This double-counting/edge arithmetic can momentarily report progress beyond the file size or jump backwards between chunks.","fix":"Track the base offset of the current chunk separately from the post-increment _sent, and report base + sent, clamped to file size.","locations":[{"ref":"src/libsync/propagateuploadng.cpp:561-571","code":"  561 | void PropagateUploadFileNG::slotUploadProgress(qint64 sent, qint64 total)\n  562 | {\n  563 |     // Completion is signaled with sent=0, total=0; avoid accidentally\n  564 |     // resetting progress due to the sent being zero by ignoring it.\n  565 |     // finishedSignal() is bound to be emitted soon anyway.\n  566 |     // See https://bugreports.qt.io/browse/QTBUG-44782.\n  567 |     if (sent == 0 && total == 0) {\n  568 |         return;\n  569 |     }\n  570 |     propagator()->reportProgress(*_item, _sent + sent - total);\n  571 | }","lines":11,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagateuploadng.cpp#L561-L571"},{"ref":"src/libsync/propagateuploadng.cpp:382","code":"  382 |     _sent += _currentChunkSize;","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagateuploadng.cpp#L382"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"cfApiFetchDataCallback connects a readyRead handler to signalSocket that sets hydrationRequestCancelled, but signalSocket's readyRead is connected to capture-by-reference lambda using &loop as context; the connection is never disconnected before the function returns and signalSocket goes out of scope at end of function. While destruction disconnects, the cancellation socket data is only checked opportunistically in the data readyRead handler, so a cancellation that arrives between blocks of data (with no further data) is not acted upon until the next data arrives or the loop exits, potentially sending stale data after a cancel.","fix":"Quit/abort the event loop directly from the cancellation readyRead handler so cancellation is acted on immediately rather than only on the next data chunk.","locations":[{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:332-389","code":"  332 |     auto hydrationRequestCancelled = false;\n  333 |     QObject::connect(&signalSocket, &QLocalSocket::readyRead, &loop, [&] {\n  334 |         hydrationRequestCancelled = true;\n  335 |         qCCritical(lcCfApiWrapper) << \"Hydration canceled for \" << path << requestId;\n  336 |     });\n  337 | \n  338 |     // CFAPI expects sent blocks to be of a multiple of a block size.\n  339 |     // Only the last sent block is allowed to be of a different size than\n  340 |     // a multiple of a block size\n  341 |     constexpr auto cfapiBlockSize = 4096;\n  342 |     qint64 dataOffset = 0;\n  343 |     QByteArray protrudingData;\n  344 | \n  345 |     const auto alignAndSendData = [&](const QByteArray &receivedData) {\n  346 |         QByteArray data = protrudingData + receivedData;\n  347 |         protrudingData.clear();\n  348 |         if (data.size() < cfapiBlockSize) {\n  349 |             protrudingData = data;\n  350 |             return;\n  351 |         }\n  352 |         const auto protudingSize = data.size() % cfapiBlockSize;\n  353 |         protrudingData = data.right(protudingSize);\n  354 |         data.chop(protudingSize);\n  355 |         sendTransferInfo(data, dataOffset);\n  356 |         dataOffset += data.size();\n  357 |     };\n  358 | \n  359 |     QObject::connect(&socket, &QLocalSocket::readyRead, &loop, [&] {\n  360 |         if (hydrationRequestCancelled) {\n  361 |             qCDebug(lcCfApiWrapper) << \"Don't transfer data because request\" << requestId << \"was cancelled\";\n  362 |             return;\n  363 |         }\n  364 | \n  365 |         const auto receivedData = socket.readAll();\n  366 |         if (receivedData.isEmpty()) {\n  367 |             qCWarning(lcCfApiWrapper) << \"Unexpected empty data received\" << requestId;\n  368 |             sendTransferError();\n  369 |             protrudingData.clear();\n  370 |             loop.quit();\n  371 |             return;\n  372 |         }\n  373 |         alignAndSendData(receivedData);\n  374 |     });\n  375 | \n  376 |     QObject::connect(vfs, &OCC::VfsCfApi::hydrationRequestFinished, &loop, [&](const QString &id) {\n  377 |         qDebug(lcCfApiWrapper) << \"Hydration finished for request\" << id;\n  378 |         if (requestId == id) {\n  379 |             loop.quit();\n  380 |         }\n  381 |     });\n  382 | \n  383 |     qCDebug(lcCfApiWrapper) << \"Starting event loop 2\";\n  384 |     loop.exec();\n  385 | \n  386 |     if (!hydrationRequestCancelled && !protrudingData.isEmpty()) {\n  387 |         qDebug(lcCfApiWrapper) << \"Send remaining protruding data. Size:\" << protrudingData.size();\n  388 |         sendTransferInfo(protrudingData, dataOffset);\n  389 |     }","lines":58,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L332-L389"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"getCurrentTokenInformation logs and uses `lastError` captured after the first (size-probe) GetTokenInformation call when the second GetTokenInformation call fails. The error message reports the stale ERROR_INSUFFICIENT_BUFFER from the probe rather than the real failure reason of the second call (GetLastError() is not re-read), producing misleading diagnostics.","fix":"Re-read GetLastError() inside the second failure branch before logging.","locations":[{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:745-761","code":"  745 |     auto tokenInfoSize = DWORD{0};\n  746 | \n  747 |     const auto tokenSizeCallSucceeded = ::GetTokenInformation(tokenHandle, TokenUser, nullptr, 0, &tokenInfoSize);\n  748 |     const auto lastError = GetLastError();\n  749 |     Q_ASSERT(!tokenSizeCallSucceeded && lastError == ERROR_INSUFFICIENT_BUFFER);\n  750 |     if (tokenSizeCallSucceeded || lastError != ERROR_INSUFFICIENT_BUFFER) {\n  751 |         qCCritical(lcCfApiWrapper) << \"GetTokenInformation for token size has failed with error\" << lastError;\n  752 |         return {};\n  753 |     }\n  754 | \n  755 |     std::unique_ptr<TOKEN_USER> tokenInfo;\n  756 | \n  757 |     tokenInfo.reset(reinterpret_cast<TOKEN_USER*>(new char[tokenInfoSize]));\n  758 |     if (!::GetTokenInformation(tokenHandle, TokenUser, tokenInfo.get(), tokenInfoSize, &tokenInfoSize)) {\n  759 |         qCCritical(lcCfApiWrapper) << \"GetTokenInformation failed with error\" << lastError;\n  760 |         return {};\n  761 |     }","lines":17,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L745-L761"}]},
