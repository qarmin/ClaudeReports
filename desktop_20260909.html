{"id":"RES_5","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"ShellExtensionsServer stores per-request lambda connections in _customStateSocketConnections keyed by socket->socketDescriptor(). The entry is only removed inside the directoryListingIterationFinished handler. If that signal is never delivered for a given socket (e.g. the LsColJob never reports for the relevant folderAlias, or the socket/descriptor is closed first), the connection and the captured socket lambda leak; socket descriptors are also reused by the OS, so a new request can collide with a stale key and disconnect/overwrite the wrong entry.","fix":"Track connections by a unique per-request id (not the reusable socketDescriptor), and clean up on socket disconnect/destroyed as well as on completion.","locations":[{"ref":"src/gui/shellextensionsserver.cpp:141-160","code":"  141 |     _customStateSocketConnections.insert(socket->socketDescriptor(), QObject::connect(this, &ShellExtensionsServer::directoryListingIterationFinished, [this, socket, filePathRelative, composeMessageReplyFromRecord](const QString &folderAlias) {\n  142 |         {\n  143 |             const auto connection = _customStateSocketConnections[socket->socketDescriptor()];\n  144 |             if (connection) {\n  145 |                 QObject::disconnect(connection);\n  146 |             }\n  147 |             _customStateSocketConnections.remove(socket->socketDescriptor());\n  148 |         }\n  149 | \n  150 |         const auto folder = FolderMan::instance()->folder(folderAlias);\n  151 |         SyncJournalFileRecord record;\n  152 |         if (!folder || !folder->journalDb()->getFileRecord(filePathRelative, &record) || !record.isValid()) {\n  153 |             qCWarning(lcShellExtServer) << \"Record not found in SyncJournal for: \" << filePathRelative;\n  154 |             sendEmptyDataAndCloseSession(socket);\n  155 |             return;\n  156 |         }\n  157 |         qCInfo(lcShellExtServer) << \"Sending reply from LsColJob for socket: \" << socket->socketDescriptor() << \" and record: \" << record.path();\n  158 |         sendJsonMessageWithVersion(socket, composeMessageReplyFromRecord(record));\n  159 |         closeSession(socket);\n  160 |     }));","lines":20,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/shellextensionsserver.cpp#L141-L160"}]},
{"id":"RES_6","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"easy","description":"ClientSideEncryption::cacheTokenPin() starts a 24h (86400000 ms) QTimer::singleShot capturing `this` to clear the cached PIN. The cached PIN (a sensitive secret) lives in memory for up to a full day, and the timer keeps firing logic tied to the object lifetime. forgetSensitiveData() does not clear _cachedPin, so the token PIN survives a logout/forget-keys operation in process memory until the 24h timer elapses.","fix":"Clear _cachedPin in forgetSensitiveData()/failedToInitialize() and consider a much shorter cache lifetime; zero the QString memory if feasible.","locations":[{"ref":"src/libsync/clientsideencryption.cpp:1897-1903","code":" 1897 | void ClientSideEncryption::cacheTokenPin(const QString pin)\n 1898 | {\n 1899 |     _cachedPin = pin;\n 1900 |     QTimer::singleShot(86400000, this, [this] () {\n 1901 |         _cachedPin.clear();\n 1902 |     });\n 1903 | }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L1897-L1903"},{"ref":"src/libsync/clientsideencryption.cpp:1748-1786","code":" 1748 | void ClientSideEncryption::forgetSensitiveData()\n 1749 | {\n 1750 |     if (!sensitiveDataRemaining()) {\n 1751 |         checkAllSensitiveDataDeleted();\n 1752 |         return;\n 1753 |     }\n 1754 | \n 1755 |     const auto createDeleteJob = [this](const QString user) {\n 1756 |         auto *job = new DeletePasswordJob(Theme::instance()->appName());\n 1757 |         job->setInsecureFallback(false);\n 1758 |         job->setKey(AbstractCredentials::keychainKey(_account->url().toString(), user, _account->id()));\n 1759 |         return job;\n 1760 |     };\n 1761 | \n 1762 |     if (!_account->credentials()) {\n 1763 |         return;\n 1764 |     }\n 1765 | \n 1766 |     const auto user = _account->credentials()->user();\n 1767 |     const auto deletePrivateKeyJob = createDeleteJob(user + e2e_private);\n 1768 |     const auto deleteCertJob = createDeleteJob(user + e2e_cert);\n 1769 |     const auto deleteMnemonicJob = createDeleteJob(user + e2e_mnemonic);\n 1770 | \n 1771 |     connect(deletePrivateKeyJob, &DeletePasswordJob::finished, this, &ClientSideEncryption::handlePrivateKeyDeleted);\n 1772 |     connect(deleteCertJob, &DeletePasswordJob::finished, this, &ClientSideEncryption::handleCertificateDeleted);\n 1773 |     connect(deleteMnemonicJob, &DeletePasswordJob::finished, this, &ClientSideEncryption::handleMnemonicDeleted);\n 1774 |     deletePrivateKeyJob->start();\n 1775 |     deleteCertJob->start();\n 1776 |     deleteMnemonicJob->start();\n 1777 |     _usbTokenInformation.setSha256Fingerprint({});\n 1778 |     _account->setEncryptionCertificateFingerprint({});\n 1779 |     _tokenSlots.reset();\n 1780 |     _encryptionCertificate.clear();\n 1781 |     _otherCertificates.clear();\n 1782 |     _context.clear();\n 1783 |     Q_EMIT canDecryptChanged();\n 1784 |     Q_EMIT canEncryptChanged();\n 1785 |     Q_EMIT userCertificateNeedsMigrationChanged();\n 1786 | }","lines":39,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L1748-L1786"}]},
{"id":"RES_7","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"OcsProfileConnector::startFetchIconJob() creates 'new IconJob{..., this}' and connects its signals but never stores the pointer. IconJob deletes itself on finish via deleteLater(), so on success it is fine; however on the error path IconJob also calls deleteLater() before emitting, so OK. The real issue: these jobs are parented to 'this' and capture hovercardActionIndex by value; if fetchIcons() is called again before previous jobs finish (new hovercard), stale indices may be applied to a replaced _currentHovercard, and many simultaneous jobs accumulate under the parent until completion.","fix":"Track in-flight icon jobs and cancel/clear them when a new hovercard is fetched; validate the icon URL still matches before applying.","locations":[{"ref":"src/libsync/ocsprofileconnector.cpp:149-166","code":"  149 | void OcsProfileConnector::startFetchIconJob(const std::size_t hovercardActionIndex)\n  150 | {\n  151 |     const auto hovercardAction = _currentHovercard._actions[hovercardActionIndex];\n  152 |     const auto iconJob = new IconJob{_account, hovercardAction._iconUrl, this};\n  153 |     connect(iconJob, &IconJob::jobFinished,\n  154 |         [this, hovercardActionIndex](QByteArray iconData) { loadHovercardActionIcon(hovercardActionIndex, iconData); });\n  155 |     connect(iconJob, &IconJob::error, this, [](QNetworkReply::NetworkError errorType) {\n  156 |         qCWarning(lcOcsProfileConnector) << \"Could not fetch icon:\" << errorType;\n  157 |     });\n  158 | }\n  159 | \n  160 | void OcsProfileConnector::fetchIcons()\n  161 | {\n  162 |     for (auto hovercardActionIndex = 0u; hovercardActionIndex < _currentHovercard._actions.size();\n  163 |          ++hovercardActionIndex) {\n  164 |         startFetchIconJob(hovercardActionIndex);\n  165 |     }\n  166 | }","lines":18,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/ocsprofileconnector.cpp#L149-L166"}]},
{"id":"RES_8","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"easy","description":"HydrationJob::onCancellationServerNewConnection asserts !_signalSocket but if a second connection arrives on the cancellation server (asserts disabled in release), the previously stored _signalSocket is overwritten by nextPendingConnection() without closing/deleting it, leaking the QLocalSocket and its underlying pipe handle. Pending connections are parented to the server so they are eventually freed, but the slot's intent (single connection) is not enforced.","fix":"If _signalSocket is already set, close/deleteLater the new pending connection (or ignore it) rather than overwriting the member.","locations":[{"ref":"src/libsync/vfs/cfapi/hydrationjob.cpp:224-230","code":"  224 | void OCC::HydrationJob::onCancellationServerNewConnection()\n  225 | {\n  226 |     Q_ASSERT(!_signalSocket);\n  227 | \n  228 |     qCInfo(lcHydration) << \"Got new connection on cancellation server\" << _requestId << _folderPath;\n  229 |     _signalSocket = _signalServer->nextPendingConnection();\n  230 | }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/hydrationjob.cpp#L224-L230"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In FolderWatcherPrivate::slotReceivedNotification (Linux), `int len = read(...)` may return -1 on error. The EINVAL retry loop only handles the too-small-buffer case; any other error (e.g. EINTR, EBADF) leaves `len` negative. Then `unsigned int ulen = len;` converts the negative value to a huge unsigned number, and the event-parsing loop `for (i = 0; i + sizeof(inotify_event) < ulen; ...)` iterates over the buffer reading out-of-bounds garbage as inotify_event structs, leading to OOB reads / crashes.","fix":"After the retry loop, bail out when `len <= 0` (e.g. `if (len <= 0) return;`) before computing `ulen` and entering the parse loop.","locations":[{"ref":"src/gui/folderwatcher_linux.cpp:132-154","code":"  132 |     len = read(fd, buffer.data(), buffer.size());\n  133 |     error = errno;\n  134 |     /**\n  135 |       * From inotify documentation:\n  136 |       *\n  137 |       * The behavior when the buffer given to read(2) is too\n  138 |       * small to return information about the next event\n  139 |       * depends on the kernel version: in kernels  before 2.6.21,\n  140 |       * read(2) returns 0; since kernel 2.6.21, read(2) fails with\n  141 |       * the error EINVAL.\n  142 |       */\n  143 |     while (len < 0 && error == EINVAL) {\n  144 |         // double the buffer size\n  145 |         buffer.resize(buffer.size() * 2);\n  146 | \n  147 |         /* and try again ... */\n  148 |         len = read(fd, buffer.data(), buffer.size());\n  149 |         error = errno;\n  150 |     }\n  151 | \n  152 |     // iterate events in buffer\n  153 |     unsigned int ulen = len;\n  154 |     for (i = 0; i + sizeof(inotify_event) < ulen; i += sizeof(inotify_event) + (event ? event->len : 0)) {","lines":23,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderwatcher_linux.cpp#L132-L154"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"batchDataSize is declared `auto batchDataSize = 0` (int) and accumulates currentItem->_size which is qint64. Summing several large file sizes can overflow a 32-bit int, producing a negative value that keeps the loop running and pulls the entire queue into a single bulk batch, defeating the maxChunkSize() limit and risking very large POST bodies / memory use (PutMultiFileJob::start reads each device fully into memory).","fix":"Declare batchDataSize as qint64 (e.g. `qint64 batchDataSize = 0`).","locations":[{"ref":"src/libsync/bulkpropagatorjob.cpp:79-100","code":"   79 |     for(auto batchDataSize = 0; batchDataSize <= PropagatorJob::propagator()->syncOptions().maxChunkSize() && !_items.empty(); ) {\n   80 |         const auto currentItem = _items.front();\n   81 |         _items.pop_front();\n   82 |         _pendingChecksumFiles.insert(currentItem->_file);\n   83 | \n   84 |         batchDataSize += currentItem->_size;\n   85 | \n   86 |         QMetaObject::invokeMethod(this, [this, currentItem] {\n   87 |             UploadFileInfo fileToUpload;\n   88 |             fileToUpload._file = currentItem->_file;\n   89 |             fileToUpload._size = currentItem->_size;\n   90 |             fileToUpload._path = propagator()->fullLocalPath(fileToUpload._file);\n   91 | \n   92 |             qCDebug(lcBulkPropagatorJob) << \"Scheduling bulk propagator job:\" << this\n   93 |                                          << \"and starting upload of item\"\n   94 |                                          << \"with file:\" << fileToUpload._file\n   95 |                                          << \"with size:\" << fileToUpload._size\n   96 |                                          << \"with path:\" << fileToUpload._path;\n   97 | \n   98 |             startUploadFile(currentItem, fileToUpload);\n   99 |         }); // We could be in a different thread (neon jobs)\n  100 |     }","lines":22,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/bulkpropagatorjob.cpp#L79-L100"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Updater::Helper::versionToInt() computes `major << 56`. major is a qint64 holding the parsed major version; for major >= 128 the shift sets/overruns the sign bit of the 64-bit result, producing a negative version integer and breaking all currentVersion >= remoteVersion comparisons (updateSucceeded, versionInfoArrived). Not exploitable today but a latent correctness bug as version numbers grow.","fix":"Mask each component to its byte (e.g. (major & 0xFF) << 56) or use a wider/typed packing, and validate parsed components.","locations":[{"ref":"src/gui/updater/updater.cpp:146-149","code":"  146 | qint64 Updater::Helper::versionToInt(qint64 major, qint64 minor, qint64 patch, qint64 build)\n  147 | {\n  148 |     return major << 56 | minor << 48 | patch << 40 | build;\n  149 | }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/updater/updater.cpp#L146-L149"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In AccountManager::restore(), settings->beginGroup(accountId) is called at the start of each loop iteration, but settings->endGroup() is only called inside the if branch (when the account is loaded). When an account is skipped because it is 'too new' (the else branch), endGroup() is never called. Additionally, when loadAccountHelper() returns null and the loop does `continue` (line 142-143), endGroup() is also skipped. Both cases leave QSettings with an unbalanced open group, so all subsequent accountId beginGroup() calls nest inside the previous (e.g. Accounts/0/1), causing those accounts to be read from the wrong/nonexistent group and silently fail to load.","fix":"Use a scope guard or call endGroup() in all paths: move settings->endGroup() out of the if/else so it always runs at the end of the iteration, and ensure the `continue` on null acc also ends the group (e.g. wrap the body and endGroup() before continue).","locations":[{"ref":"src/gui/accountmanager.cpp:137-159","code":"  137 |     for (const auto &accountId : settingsChildGroups) {\n  138 |         settings->beginGroup(accountId);\n  139 |         if (!skipSettingsKeys.contains(settings->group())) {\n  140 |             const auto acc = loadAccountHelper(*settings);\n  141 |             if (!acc) {\n  142 |                 continue;\n  143 |             }\n  144 |             acc->_id = accountId;\n  145 |             const auto accState = new AccountState(acc);\n  146 |             const auto jar = qobject_cast<CookieJar*>(acc->_networkAccessManager->cookieJar());\n  147 |             Q_ASSERT(jar);\n  148 |             if (jar) {\n  149 |                 jar->restore(acc->cookieJarPath());\n  150 |             }\n  151 |             addAccountState(accState);\n  152 |             migrateNetworkSettings(acc, *settings);\n  153 |             settings->endGroup();\n  154 |         } else {\n  155 |             qCInfo(lcAccountManager) << \"Account\" << accountId << \"is too new, ignoring\";\n  156 |             _additionalBlockedAccountIds.insert(accountId);\n  157 |             result = AccountsRestoreSuccessWithSkipped;\n  158 |         }\n  159 |     }","lines":23,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/accountmanager.cpp#L137-L159"},{"ref":"src/gui/accountmanager.cpp:140-143","code":"  140 |             const auto acc = loadAccountHelper(*settings);\n  141 |             if (!acc) {\n  142 |                 continue;\n  143 |             }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/accountmanager.cpp#L140-L143"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"ShareModel duplicate-display-name tracking keys `_duplicateDisplayNameShareIndices` (and the per-bucket QSet) by row index, but slotRemoveShareWithId() removes a row from `_shares` (shifting every subsequent index down by one) without ever re-keying these maps. After any removal the stored indices no longer correspond to the actual rows, so dataChanged() is emitted for wrong rows and the wrong shares are flagged as duplicates (verbose display string applied to the wrong entry). The cleanup at lines 709-719 also only looks up the removed row, never adjusting the others.","fix":"Stop keying duplicate-name tracking by mutable row index; key by share id instead, or fully rebuild _duplicateDisplayNameShareIndices after every insert/remove.","locations":[{"ref":"src/gui/filedetails/sharemodel.cpp:498-531","code":"  498 |     // Perform forward pass on shares and check for duplicate display names; store these indeces so\n  499 |     // we can check for these and display the specific user identifier in the display string later\n  500 |     _duplicateDisplayNameShareIndices.clear();\n  501 |     const auto shareCount = _shares.count();\n  502 |     for (auto i = 0; i < shareCount; ++i) {\n  503 |         if (_duplicateDisplayNameShareIndices.contains(i)) {\n  504 |             continue;\n  505 |         }\n  506 | \n  507 |         const auto sharee = _shares.at(i)->getShareWith();\n  508 |         if (sharee == nullptr) {\n  509 |             continue;\n  510 |         }\n  511 | \n  512 |         const auto duplicateIndices = QSharedPointer<QSet<unsigned int>>::create();\n  513 |         const auto handleDuplicateIndex = [this, duplicateIndices](const unsigned int idx) {\n  514 |             duplicateIndices->insert(idx);\n  515 |             _duplicateDisplayNameShareIndices[idx] = duplicateIndices;\n  516 |             const auto targetIdx = index(idx);\n  517 |             dataChanged(targetIdx, targetIdx, {Qt::DisplayRole});\n  518 |         };\n  519 | \n  520 |         for (auto j = i + 1; j < shareCount; ++j) {\n  521 |             const auto otherSharee = _shares.at(j)->getShareWith();\n  522 |             if (otherSharee == nullptr || sharee->format() != otherSharee->format()) {\n  523 |                 continue;\n  524 |             }\n  525 |             handleDuplicateIndex(j);\n  526 |         }\n  527 | \n  528 |         if (!duplicateIndices->isEmpty()) {\n  529 |             handleDuplicateIndex(i);\n  530 |         }\n  531 |     }","lines":34,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/filedetails/sharemodel.cpp#L498-L531"},{"ref":"src/gui/filedetails/sharemodel.cpp:678-720","code":"  678 | void ShareModel::slotRemoveShareWithId(const QString &shareId)\n  679 | {\n  680 |     if (_shares.empty() || shareId.isEmpty() || !_shareIdIndexHash.contains(shareId)) {\n  681 |         return;\n  682 |     }\n  683 | \n  684 |     _shareIdRecentlySetPasswords.remove(shareId);\n  685 |     const auto shareIndex = _shareIdIndexHash.take(shareId);\n  686 | \n  687 |     if (!checkIndex(shareIndex, QAbstractItemModel::CheckIndexOption::IndexIsValid | QAbstractItemModel::CheckIndexOption::ParentIsInvalid)) {\n  688 |         qCWarning(lcShareModel) << \"Won't remove share with id:\" << shareId\n  689 |                                 << \", invalid share index: \" << shareIndex;\n  690 |         return;\n  691 |     }\n  692 | \n  693 |     const auto share = shareIndex.data(ShareModel::ShareRole).value<SharePtr>();\n  694 |     const auto sharee = share->getShareWith();\n  695 |     slotRemoveSharee(sharee);\n  696 | \n  697 |     const auto shareRow = shareIndex.row();\n  698 |     beginRemoveRows({}, shareRow, shareRow);\n  699 |     _shares.removeAt(shareRow);\n  700 |     endRemoveRows();\n  701 | \n  702 |     // Handle display name duplicates now. First remove the index from the bucket it was in; then,\n  703 |     // check if this removal means the remaining index in the bucket is no longer a duplicate.\n  704 |     // If this is the case then handle the update for this item too.\n  705 |     const auto duplicateShares = _duplicateDisplayNameShareIndices.value(shareRow);\n  706 |     if (duplicateShares) {\n  707 |         duplicateShares->remove(shareRow);\n  708 |         if (duplicateShares->count() == 1) {\n  709 |             const auto noLongerDuplicateIndex = *(duplicateShares->begin());\n  710 |             _duplicateDisplayNameShareIndices.remove(noLongerDuplicateIndex);\n  711 |             const auto noLongerDuplicateModelIndex = index(noLongerDuplicateIndex);\n  712 |             Q_EMIT dataChanged(noLongerDuplicateModelIndex, noLongerDuplicateModelIndex, {Qt::DisplayRole});\n  713 |         }\n  714 |         _duplicateDisplayNameShareIndices.remove(shareRow);\n  715 |     }\n  716 | \n  717 |     handleLinkShare();\n  718 | \n  719 |     Q_EMIT sharesChanged();\n  720 | }","lines":43,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/filedetails/sharemodel.cpp#L678-L720"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"SyncConflictsModel::setData() sets `result = true` for the editable roles (ExistingSelected/ConflictSelected) inside the switch, but immediately after the switch executes `result = false;` unconditionally (line 115). As a result setData() always returns false even when the edit succeeded, violating the QAbstractItemModel contract and breaking views that rely on the boolean return to confirm a successful edit.","fix":"Remove the stray `result = false;` at line 115 (it should not reset the value already set by the matched cases).","locations":[{"ref":"src/gui/syncconflictsmodel.cpp:90-118","code":"   90 |         switch(convertedRole) {\n   91 |         case SyncConflictRoles::ExistingFileName:\n   92 |             break;\n   93 |         case SyncConflictRoles::ExistingSize:\n   94 |             break;\n   95 |         case SyncConflictRoles::ConflictSize:\n   96 |             break;\n   97 |         case SyncConflictRoles::ExistingDate:\n   98 |             break;\n   99 |         case SyncConflictRoles::ConflictDate:\n  100 |             break;\n  101 |         case SyncConflictRoles::ExistingSelected:\n  102 |             setExistingSelected(value.toBool(), index, role);\n  103 |             result = true;\n  104 |             break;\n  105 |         case SyncConflictRoles::ConflictSelected:\n  106 |             setConflictingSelected(value.toBool(), index, role);\n  107 |             result = true;\n  108 |             break;\n  109 |         case SyncConflictRoles::ExistingPreviewUrl:\n  110 |             break;\n  111 |         case SyncConflictRoles::ConflictPreviewUrl:\n  112 |             break;\n  113 |         }\n  114 | \n  115 |         result = false;\n  116 |     }\n  117 | \n  118 |     return result;","lines":29,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/syncconflictsmodel.cpp#L90-L118"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Capabilities::supportedChecksumTypes() constructs the result with QList<QByteArray> list(supportedTypes.count()), which pre-fills the list with N default-constructed (empty) QByteArrays, then push_back() appends the real values after them. The returned list therefore has 2*N entries where the first N are empty. uploadChecksumType() then returns supported.first() which is an empty QByteArray, silently disabling checksum selection.","fix":"Use QList<QByteArray> list; list.reserve(supportedTypes.count()); then push_back, or index-assign instead of push_back.","locations":[{"ref":"src/libsync/capabilities.cpp:185-193","code":"  185 | QList<QByteArray> Capabilities::supportedChecksumTypes() const\n  186 | {\n  187 |     const auto supportedTypes = _capabilities[\"checksums\"].toMap()[\"supportedTypes\"].toList();\n  188 |     QList<QByteArray> list(supportedTypes.count());\n  189 |     for (const auto &t : supportedTypes) {\n  190 |         list.push_back(t.toByteArray());\n  191 |     }\n  192 |     return list;\n  193 | }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/capabilities.cpp#L185-L193"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Capabilities::httpErrorCodesThatResetFailingChunkedUploads() has the same bug: QList<int> list(httpErrorCodes.count()) pre-fills N zeros, then push_back appends the real codes. The returned list contains N spurious leading 0 entries, so HTTP status 0 is incorrectly treated as a code that resets failing chunked uploads.","fix":"Construct an empty list and reserve(count), or assign by index; do not size-construct then push_back.","locations":[{"ref":"src/libsync/capabilities.cpp:368-376","code":"  368 | QList<int> Capabilities::httpErrorCodesThatResetFailingChunkedUploads() const\n  369 | {\n  370 |     const auto httpErrorCodes = _capabilities[\"dav\"].toMap()[\"httpErrorCodesThatResetFailingChunkedUploads\"].toList();\n  371 |     QList<int> list(httpErrorCodes.count());\n  372 |     for (const auto &t : httpErrorCodes) {\n  373 |         list.push_back(t.toInt());\n  374 |     }\n  375 |     return list;\n  376 | }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/capabilities.cpp#L368-L376"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"setupExistingMetadata() only verifies the CMS metadata signature when (_isRootEncryptedFolder && !_initialSignature.isEmpty()). For nested (non-root) encrypted folders in v2, and for any folder where the server supplies an empty signature, the signature is never checked against the folder users. While there is a later guard that aborts when _initialSignature is empty, the verification block itself is gated on _isRootEncryptedFolder, so a malicious/forged metadata blob for a non-root folder is parsed and decrypted without authenticating the signer set.","fix":"Verify the metadata signature for all encrypted folders that are expected to carry one (or explicitly document and enforce that nested folders inherit/require the root signature), and fail closed when verification cannot be performed.","locations":[{"ref":"src/libsync/foldermetadata.cpp:202-222","code":"  202 |     if (_isRootEncryptedFolder && !_initialSignature.isEmpty()) {\n  203 |         const auto metadataForSignature = prepareMetadataForSignature(metaDataDoc);\n  204 | \n  205 |         QVector<QByteArray> certificatePems;\n  206 |         certificatePems.reserve(_folderUsers.size());\n  207 |         for (const auto &folderUser : std::as_const(_folderUsers)) {\n  208 |             certificatePems.push_back(folderUser.certificatePem);\n  209 |         }\n  210 | \n  211 |         if (!_account->e2e()->verifySignatureCryptographicMessageSyntax(QByteArray::fromBase64(_initialSignature), metadataForSignature.toBase64(), certificatePems)) {\n  212 |             qCWarning(lcCseMetadata()) << \"Could not parse encrypred folder metadata. Failed to verify signature!\";\n  213 |             _account->reportClientStatus(OCC::ClientStatusReportingStatus::E2EeError_GeneralError);\n  214 |             return;\n  215 |         }\n  216 |     }\n  217 | \n  218 |     if (_initialSignature.isEmpty()) {\n  219 |         qCWarning(lcCseMetadata()) << \"Signature is empty\";\n  220 |         _account->reportClientStatus(OCC::ClientStatusReportingStatus::E2EeError_GeneralError);\n  221 |         return;\n  222 |     }","lines":21,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/foldermetadata.cpp#L202-L222"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"FolderMetadata::verifyMetadataKey() returns true whenever _keyChecksums is empty (`return _keyChecksums.contains(...) || _keyChecksums.isEmpty();`). For a v2.0+ root folder the keyChecksums come from server-controlled metadata; an attacker who can strip/empty the keyChecksums array causes verification of the metadata key to be unconditionally accepted, defeating the integrity check that the metadata key was not swapped. The accompanying comment even admits '_keyChecksums should not be empty'.","fix":"Do not treat an empty checksum set as success for Version2_0+. Require a non-empty _keyChecksums and a matching checksum; report E2EeError and refuse to use the metadata key otherwise.","locations":[{"ref":"src/libsync/foldermetadata.cpp:1260-1271","code":" 1260 | bool FolderMetadata::verifyMetadataKey(const QByteArray &metadataKey) const\n 1261 | {\n 1262 |     if (_existingMetadataVersion < MetadataVersion::Version2_0) {\n 1263 |         return true;\n 1264 |     }\n 1265 |     if (metadataKey.isEmpty() || metadataKey.size() < metadataKeySize ) {\n 1266 |         return false;\n 1267 |     }\n 1268 |     const QByteArray metadataKeyLimitedLength(metadataKey.data(), metadataKeySize );\n 1269 |     // _keyChecksums should not be empty, fix this by taking a proper _keyChecksums from the topLevelFolder\n 1270 |     return _keyChecksums.contains(calcSha256(metadataKeyLimitedLength)) || _keyChecksums.isEmpty();\n 1271 | }","lines":12,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/foldermetadata.cpp#L1260-L1271"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"PropagateDirectory::slotSubJobsFinished(): in the CSYNC_INSTRUCTION_NEW + Down branch, when _item->_modtime <= 0 it sets status/_item->_status = NormalError and logs, but then falls through and still calls FileSystem::setModTime() with the invalid modtime and continues into the etag/metadata update block, eventually emitting finished() with the error status mixed with a successful metadata update. The error is set but propagation is not actually aborted, so a directory with an invalid modtime is half-processed.","fix":"After setting NormalError for an invalid modtime, emit finished(status) and return instead of proceeding to setModTime and the metadata update.","locations":[{"ref":"src/libsync/owncloudpropagator.cpp:1501-1513","code":" 1501 |         if (_item->_instruction == CSYNC_INSTRUCTION_NEW && _item->_direction == SyncFileItem::Down) {\n 1502 |             // special case for local MKDIR, set local directory mtime\n 1503 |             // (it's not synced later at all, but can be nice to have it set initially)\n 1504 | \n 1505 |             if (_item->_modtime <= 0) {\n 1506 |                 status = _item->_status = SyncFileItem::NormalError;\n 1507 |                 _item->_errorString = tr(\"Error updating metadata due to invalid modification time\");\n 1508 |                 qCWarning(lcDirectory) << \"Error writing to the database for file\" << _item->_file;\n 1509 |             }\n 1510 | \n 1511 |             qCDebug(lcPropagator()) << \"setModTime\" << propagator()->fullLocalPath(_item->destination()) << _item->_modtime;\n 1512 |             FileSystem::setModTime(propagator()->fullLocalPath(_item->destination()), _item->_modtime);\n 1513 |         }","lines":13,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/owncloudpropagator.cpp#L1501-L1513"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Inverted branch when clearing the resumable download info after a successful download. The download info is always stored under _item->_file in startDownload() (line 718). But in updateMetadata, when the item IS encrypted the code clears the download info of _item->_file, and when it is NOT encrypted it clears _item->_encryptedFileName (which is empty for non-encrypted items). For an unencrypted file this clears the wrong (empty) key and leaves the real DownloadInfo for _item->_file stale in the journal, while for encrypted files it never clears the entry that may have been keyed under the plaintext name. The two branches are reversed.","fix":"Always clear the download info under the key that was used to store it (_item->_file), or swap the branches so the encrypted case clears _item->_encryptedFileName and the unencrypted case clears _item->_file, matching how setDownloadInfo() was keyed in startDownload().","locations":[{"ref":"src/libsync/propagatedownload.cpp:1357-1361","code":" 1357 |     if (isEncrypted()) {\n 1358 |         propagator()->_journal->setDownloadInfo(_item->_file, SyncJournalDb::DownloadInfo());\n 1359 |     } else {\n 1360 |         propagator()->_journal->setDownloadInfo(_item->_encryptedFileName, SyncJournalDb::DownloadInfo());\n 1361 |     }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagatedownload.cpp#L1357-L1361"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"SyncOptions::setMinChunkSize() clamps the new value using the current _minChunkSize itself as the lower bound: ::qBound(_minChunkSize, minChunkSize, _maxChunkSize). Because qBound's lower bound is the field being assigned, any requested value smaller than the current _minChunkSize is silently ignored (raised back to the old value). The intent is clearly to bound the requested value between an absolute floor (e.g. chunkV2MinChunkSize) and _maxChunkSize. As written, _minChunkSize can never be lowered, so env/config overrides smaller than the default 5MB are ignored.","fix":"Use a fixed absolute lower bound, e.g. _minChunkSize = ::qBound(chunkV2MinChunkSize, minChunkSize, _maxChunkSize); (and similarly fix setMaxChunkSize).","locations":[{"ref":"src/libsync/syncoptions.cpp:27-30","code":"   27 | void SyncOptions::setMinChunkSize(const qint64 minChunkSize)\n   28 | {\n   29 |     _minChunkSize = ::qBound(_minChunkSize, minChunkSize, _maxChunkSize);\n   30 | }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/syncoptions.cpp#L27-L30"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"SyncOptions::setMaxChunkSize() clamps with ::qBound(_minChunkSize, maxChunkSize, _maxChunkSize), using the current _maxChunkSize as the upper bound. Any requested value larger than the current _maxChunkSize is clamped down to the old value, so the maximum chunk size can only ever be lowered, never raised. This defeats config/env overrides intended to increase the max chunk size.","fix":"Bound against the absolute ceiling, e.g. _maxChunkSize = ::qBound(_minChunkSize, maxChunkSize, chunkV2MaxChunkSize);","locations":[{"ref":"src/libsync/syncoptions.cpp:37-40","code":"   37 | void SyncOptions::setMaxChunkSize(const qint64 maxChunkSize)\n   38 | {\n   39 |     _maxChunkSize = ::qBound(_minChunkSize, maxChunkSize, _maxChunkSize);\n   40 | }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/syncoptions.cpp#L37-L40"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"WordList::getRandomWords() loops while(randomWords.size() != nr) appending unique words. If nr is greater than the wordlist size (2048) the set of unique words can never reach nr and the loop spins forever. If nr is negative the loop also never terminates. No bound check on nr exists.","fix":"Clamp/validate nr against wordList.size() (and reject negatives) before the loop, or break when no new unique word can be found.","locations":[{"ref":"src/libsync/wordlist.cpp:2080-2087","code":" 2080 |     QStringList randomWords;\n 2081 |     while(randomWords.size() != nr) {\n 2082 |         QString currWord = wordList.at(getRandomNumber(wordList.size()));\n 2083 |         if (!randomWords.contains(currWord)) {\n 2084 |             randomWords.append(currWord);\n 2085 |         }\n 2086 |     }\n 2087 |     return randomWords;","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/wordlist.cpp#L2080-L2087"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"PreparedSqlQueryManager::get(key, sql, db) asserts !sqlite3_stmt_busy(query._stmt) at line 35 before checking whether query._stmt is null (lines 37-41). On the first use of a key the SqlQuery is default-constructed with _stmt == nullptr. sqlite3_stmt_busy(nullptr) is being relied upon to return 0; passing a null statement handle to sqlite3 APIs is not contractually defined for all builds and is fragile. The busy check should occur after confirming a prepared statement exists.","fix":"Move the Q_ASSERT(!sqlite3_stmt_busy(query._stmt)) inside the `if (query._stmt)` branch (i.e. only assert when a statement actually exists).","locations":[{"ref":"src/common/preparedsqlquerymanager.cpp:32-43","code":"   32 | const PreparedSqlQuery PreparedSqlQueryManager::get(PreparedSqlQueryManager::Key key, const QByteArray &sql, SqlDatabase &db)\n   33 | {\n   34 |     auto &query = _queries[key];\n   35 |     Q_ASSERT(!sqlite3_stmt_busy(query._stmt));\n   36 |     ENFORCE(!query._sqldb || &db == query._sqldb)\n   37 |     if (!query._stmt) {\n   38 |         query._sqldb = &db;\n   39 |         query._db = db.sqliteDb();\n   40 |         return { &query, query.prepare(sql) == 0 };\n   41 |     }\n   42 |     return { &query };\n   43 | }","lines":12,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/preparedsqlquerymanager.cpp#L32-L43"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"forgetEncryptionOnDeviceForAccount() uses a switch on the QMessageBox result with `case QMessageBox::Ok` and `case QMessageBox::Cancel: break;` followed by a bare `Q_UNREACHABLE();` placed after the Cancel case's break but still inside the switch body with no case label. It is effectively dead/misplaced: it can only be reached by fall-through which never happens (Cancel breaks), and if the dialog ever returned another value the default path silently does nothing instead of asserting. The intent (assert on unexpected values) is not achieved.","fix":"Move Q_UNREACHABLE() into a proper `default:` label, or remove it; ensure unexpected dialog results are handled.","locations":[{"ref":"src/gui/accountsettings.cpp:1292-1302","code":" 1292 |     const auto ret = dialog.exec();\n 1293 |     switch(ret) {\n 1294 |     case QMessageBox::Ok:\n 1295 |         connect(account->e2e(), &ClientSideEncryption::sensitiveDataForgotten,\n 1296 |                 this, &AccountSettings::forgetE2eEncryption);\n 1297 |         account->e2e()->forgetSensitiveData();\n 1298 |         break;\n 1299 |     case QMessageBox::Cancel:\n 1300 |         break;\n 1301 |     Q_UNREACHABLE();\n 1302 |     }","lines":11,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/accountsettings.cpp#L1292-L1302"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"ActivityListModel constructor connects AccountState::stateChanged to the accountStateChanged SIGNAL, whereas setAccountState() connects the same signal to the accountStateHasChanged SLOT (which maintains _durationSinceDisconnection used to decide when to surface network-error activities). For Users created via the AccountState constructor (the normal path in User::User), the disconnection timer is therefore never started/invalidated, so addErrorToActivityList(NetworkError) never satisfies its `_durationSinceDisconnection.isValid() && hasExpired(3min)` guard and network errors are silently dropped.","fix":"In the constructor connect to &ActivityListModel::accountStateHasChanged (the slot), matching setAccountState().","locations":[{"ref":"src/gui/activity/activitylistmodel.cpp:59-63","code":"   59 |     if (_accountState) {\n   60 |         connect(_accountState, &AccountState::stateChanged,\n   61 |                 this, &ActivityListModel::accountStateChanged);\n   62 |         _accountStateWasConnected = false;\n   63 |     }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/activity/activitylistmodel.cpp#L59-L63"},{"ref":"src/gui/activity/activitylistmodel.cpp:112-116","code":"  112 |     if (_accountState) {\n  113 |         connect(_accountState, &AccountState::stateChanged,\n  114 |                 this, &ActivityListModel::accountStateHasChanged);\n  115 |         _accountStateWasConnected = false;\n  116 |     }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/activity/activitylistmodel.cpp#L112-L116"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Folder overlap detection uses raw string prefix matching without path-component boundaries. In isComplete() the checks `targetPath.startsWith(remoteDir)` and `remoteDir.startsWith(targetPath)` treat e.g. '/foobar' as a subfolder of '/foo', producing false 'already syncing' warnings for sibling folders whose names share a prefix. The exact-match branch above correctly uses QDir::cleanPath, but the prefix branches do not normalise or require a trailing '/'.","fix":"Compare cleaned paths and require a path-separator boundary, e.g. treat A as ancestor of B only when `B == A || B.startsWith(A.endsWith('/') ? A : A + '/')` after QDir::cleanPath().","locations":[{"ref":"src/gui/folderwizard.cpp:508-531","code":"  508 |     for (const auto folder : std::as_const(FolderMan::instance()->map())) {\n  509 |         if (folder->accountState()->account() != _account) {\n  510 |             continue;\n  511 |         }\n  512 | \n  513 |         const auto remoteDir = folder->remotePathTrailingSlash();\n  514 |         const auto localDir = folder->cleanPath();\n  515 |         if (QDir::cleanPath(targetPath) == QDir::cleanPath(remoteDir)) {\n  516 |             showWarn(tr(\"Please choose a different location. %1 is already being synced to %2.\").arg(Utility::escape(remoteDir), Utility::escape(localDir)));\n  517 |             break;\n  518 |         }\n  519 | \n  520 |         if (targetPath.startsWith(remoteDir)) {\n  521 |             _ui.warnFrame->show();\n  522 |             _ui.warnLabel->hide();\n  523 |             _ui.infoLabel->setText(tr(\"You are already syncing the subfolder %1 at %2.\").arg(Utility::escape(targetPath), Utility::escape(localDir)));\n  524 |             break;\n  525 |         }\n  526 | \n  527 |         if (remoteDir.startsWith(targetPath)) {\n  528 |             showWarn(tr(\"Please choose a different location. %1 is already being synced to %2.\").arg(Utility::escape(remoteDir), Utility::escape(localDir)));\n  529 |             break;\n  530 |         }\n  531 |     }","lines":24,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderwizard.cpp#L508-L531"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ProxyAuthHandler constructor calls beginGroup(\"Proxy\") then beginGroup(\"Credentials\") on _settings but there is no matching endGroup, and keychainUsernameKey()/keychainPasswordKey() build keys as `<proxy>/username`. The QSettings stays permanently nested in Proxy/Credentials. While intentional for this single-purpose settings object, _settings is also passed to QKeychain ReadPasswordJob::setSettings/WritePasswordJob::setSettings which use it for insecure fallback storage; the permanently-open nested groups mean any other use of this QSettings would read/write under the wrong group. Fragile and easy to misuse.","fix":"Document the invariant clearly or build full key paths explicitly instead of relying on a permanently-open group nesting on a shared QSettings.","locations":[{"ref":"src/gui/proxyauthhandler.cpp:33-37","code":"   33 |     _configFile.reset(new ConfigFile);\n   34 |     _settings.reset(new QSettings(_configFile->configFile(), QSettings::IniFormat));\n   35 |     _settings->beginGroup(QLatin1String(\"Proxy\"));\n   36 |     _settings->beginGroup(QLatin1String(\"Credentials\"));\n   37 | }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/proxyauthhandler.cpp#L33-L37"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"SettingsDialog::accountAdded() always calls `accountAction->trigger()` after inserting each account page at stack index 0. During SettingsDialog construction it iterates all existing accounts (line 205-208) and each one triggers, so the last account page ends up shown; then a QTimer::singleShot to showFirstPage() is queued. The repeated trigger() on every accountAdded (including runtime additions) forcibly switches the visible page to the newly added account, which can yank the user away from whatever page they were viewing.","fix":"Only trigger the action for the initial/explicitly-requested account, or avoid switching pages on runtime account additions unless the dialog has no current selection.","locations":[{"ref":"src/gui/settingsdialog.cpp:348-357","code":"  348 |     auto accountSettings = new AccountSettings(s, this);\n  349 |     QString objectName = QLatin1String(\"accountSettings_\");\n  350 |     objectName += s->account()->displayName();\n  351 |     accountSettings->setObjectName(objectName);\n  352 |     _stack->insertWidget(0 , accountSettings);\n  353 | \n  354 |     _actionGroup->addAction(accountAction);\n  355 |     _actionGroupWidgets.insert(accountAction, accountSettings);\n  356 |     _actionForAccount.insert(s->account().data(), accountAction);\n  357 |     accountAction->trigger();","lines":10,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/settingsdialog.cpp#L348-L357"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In Systray::taskbarOrientation (Linux branch), the minimum distance is computed as `std::min({distRight, distTop, distBottom})` — distLeft is computed but omitted from the set. The following dispatch then tests `else if (minDist == distLeft)`, a branch that can essentially never be taken since distLeft is not part of the minimum. As a result a taskbar on the left edge is mis-detected (the final else returns Right). The tray window can be positioned on the wrong screen edge.","fix":"Include distLeft in the min set: `std::min({distRight, distTop, distBottom, distLeft})`.","locations":[{"ref":"src/gui/systray.cpp:1314-1333","code":" 1314 |     const auto screenRect = currentScreenRect();\n 1315 |     const auto trayIconCenter = calcTrayIconCenter();\n 1316 | \n 1317 |     const auto distBottom = screenRect.bottom() - trayIconCenter.y();\n 1318 |     const auto distRight = screenRect.right() - trayIconCenter.x();\n 1319 |     const auto distLeft = trayIconCenter.x() - screenRect.left();\n 1320 |     const auto distTop = trayIconCenter.y() - screenRect.top();\n 1321 | \n 1322 |     const auto minDist = std::min({distRight, distTop, distBottom});\n 1323 | \n 1324 |     if (minDist == distBottom) {\n 1325 |         return TaskBarPosition::Bottom;\n 1326 |     } else if (minDist == distLeft) {\n 1327 |         return TaskBarPosition::Left;\n 1328 |     } else if (minDist == distTop) {\n 1329 |         return TaskBarPosition::Top;\n 1330 |     } else {\n 1331 |         return TaskBarPosition::Right;\n 1332 |     }\n 1333 | #endif","lines":20,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/systray.cpp#L1314-L1333"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"_currentBatchSize is computed by handleBatchSize() (halving on error) but is never consulted by scheduleSelfOrChild(), which always batches purely by maxChunkSize()/size. As a result the 'cut batch size in half after an error' retry logic has no effect on how many items are actually grouped into the next bulk upload; only the maxChunkSize byte budget governs batching.","fix":"Use _currentBatchSize to cap the number of items pulled into a batch in scheduleSelfOrChild (e.g. break the loop once the count reaches _currentBatchSize), or remove the unused batch-size machinery if byte-based batching is intended.","locations":[{"ref":"src/libsync/bulkpropagatorjob.cpp:69-103","code":"   69 | bool BulkPropagatorJob::scheduleSelfOrChild()\n   70 | {\n   71 |     if (_items.empty() || !_pendingChecksumFiles.empty()) {\n   72 |         return false;\n   73 |     }\n   74 | \n   75 |     _state = Running;\n   76 | \n   77 |     qCDebug(lcBulkPropagatorJob()) << \"max chunk size\" << PropagatorJob::propagator()->syncOptions().maxChunkSize();\n   78 | \n   79 |     for(auto batchDataSize = 0; batchDataSize <= PropagatorJob::propagator()->syncOptions().maxChunkSize() && !_items.empty(); ) {\n   80 |         const auto currentItem = _items.front();\n   81 |         _items.pop_front();\n   82 |         _pendingChecksumFiles.insert(currentItem->_file);\n   83 | \n   84 |         batchDataSize += currentItem->_size;\n   85 | \n   86 |         QMetaObject::invokeMethod(this, [this, currentItem] {\n   87 |             UploadFileInfo fileToUpload;\n   88 |             fileToUpload._file = currentItem->_file;\n   89 |             fileToUpload._size = currentItem->_size;\n   90 |             fileToUpload._path = propagator()->fullLocalPath(fileToUpload._file);\n   91 | \n   92 |             qCDebug(lcBulkPropagatorJob) << \"Scheduling bulk propagator job:\" << this\n   9 {"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"commonErrorHandling() (called from slotPutFinishedOneFile when an individual file reply has _httpErrorCode != 200) calls abortWithError(), which aborts the whole multi-file job and marks ALL files in the batch as failed even though only one file in the bulk reply reported an error. A single 412/precondition failure on one file thus fails the entire batch rather than just that item.","fix":"For per-file errors in a bulk reply, mark only that singleFile._item as errored (set status/errorString) and continue processing the remaining files, instead of aborting the whole job via abortWithError().","locations":[{"ref":"src/libsync/bulkpropagatorjob.cpp:431-437","code":"  431 |     if (singleFile._item->_httpErrorCode != 200) {\n  432 |         commonErrorHandling(singleFile._item, fileReply[QStringLiteral(\"message\")].toString());\n  433 |         const auto exceptionParsed = getExceptionFromReply(job->reply());\n  434 |         singleFile._item->_errorExceptionName = exceptionParsed.first;\n  435 |         singleFile._item->_errorExceptionMessage = exceptionParsed.second;\n  436 |         return;\n  437 |     }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/bulkpropagatorjob.cpp#L431-L437"},{"ref":"src/libsync/bulkpropagatorjob.cpp:702-708","code":"  702 | void BulkPropagatorJob::commonErrorHandling(SyncFileItemPtr item,\n  703 |                                             const QString &errorMessage)\n  704 | {\n  705 |     // Ensure errors that should eventually reset the chunked upload are tracked.\n  706 |     checkResettingErrors(item);\n  707 |     abortWithError(item, SyncFileItem::NormalError, errorMessage);\n  708 | }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/bulkpropagatorjob.cpp#L702-L708"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"ClientProxy::setupQtProxyFromConfig() DefaultProxy branch calls proxies.first() on the result of QNetworkProxyFactory::proxyForQuery() without checking emptiness. QNetworkProxyFactory documents it always returns at least one entry, but if the platform backend returns an empty list this dereferences the first element of an empty QList (undefined behavior / crash).","fix":"Guard: if proxies.isEmpty() use QNetworkProxy::NoProxy, else proxies.first().","locations":[{"ref":"src/libsync/clientproxy.cpp:96-107","code":"   96 |         case QNetworkProxy::DefaultProxy:\n   97 |             qCInfo(lcClientProxy) << \"Set proxy configuration to use the preferred system proxy for http tcp connections\";\n   98 |             {\n   99 |                 QNetworkProxyQuery query;\n  100 |                 query.setProtocolTag(\"http\");\n  101 |                 query.setQueryType(QNetworkProxyQuery::TcpSocket);\n  102 |                 auto proxies = QNetworkProxyFactory::proxyForQuery(query);\n  103 |                 proxy = proxies.first();\n  104 |             }\n  105 |             QNetworkProxyFactory::setUseSystemConfiguration(false);\n  106 |             QNetworkProxy::setApplicationProxy(proxy);\n  107 |             break;","lines":12,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientproxy.cpp#L96-L107"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ClientSideEncryption::decryptPrivateKey() tries three password derivations in sequence, but the fallback chain unconditionally overwrites the private key: if the modern password fails it tries the deprecated-SHA1 password, and if that also fails it stores the result of decryptPrivateKey(deprecatedPassword,...) even when that returns empty. After a wrong passphrase this sets an empty/garbage private key and only the later getPrivateKey().isNull() check saves it; the loop then re-prompts. The nested if/else makes it easy to store a non-empty but wrong-key result on partial base64 success.","fix":"Only assign setPrivateKeyData() when a candidate decryption produced a non-empty result, and verify each candidate with checkEncryptionIsWorking() before committing instead of blindly assigning the last fallback.","locations":[{"ref":"src/libsync/clientsideencryption.cpp:2294-2318","code":" 2294 |             // split off salt\n 2295 |             const auto salt = EncryptionHelper::extractPrivateKeySalt(key);\n 2296 | \n 2297 |             const auto deprecatedPassword = EncryptionHelper::deprecatedGeneratePassword(mnemonic, salt);\n 2298 |             const auto deprecatedSha1Password = EncryptionHelper::deprecatedSha1GeneratePassword(mnemonic, salt);\n 2299 |             const auto password = EncryptionHelper::generatePassword(mnemonic, salt);\n 2300 | \n 2301 |             const auto privateKey = EncryptionHelper::decryptPrivateKey(password, key);\n 2302 |             if (!privateKey.isEmpty()) {\n 2303 |                 _encryptionCertificate.setPrivateKeyData(privateKey);\n 2304 |             } else {\n 2305 |                 const auto deprecatedSha1PrivateKey = EncryptionHelper::decryptPrivateKey(deprecatedSha1Password, key);\n 2306 |                 if (!deprecatedSha1PrivateKey.isEmpty()) {\n 2307 |                     _encryptionCertificate.setPrivateKeyData(deprecatedSha1PrivateKey);\n 2308 |                 } else {\n 2309 |                     _encryptionCertificate.setPrivateKeyData(EncryptionHelper::decryptPrivateKey(deprecatedPassword, key));\n 2310 |                 }\n 2311 |             }\n 2312 | \n 2313 |             if (!getPrivateKey().isNull() && checkEncryptionIsWorking(_encryptionCertificate)) {\n 2314 |                 writePrivateKey();\n 2315 |                 writeCertificate();\n 2316 |                 writeMnemonic([] () {});\n 2317 |                 break;\n 2318 |             }","lines":25,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L2294-L2318"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"processFileAnalyzeRemoteInfo() computes lock expiration timeRemaining with QDateTime::currentDateTime() (local time) versus QDateTime::fromSecsSinceEpoch(lockExpirationTime) (which interprets the epoch seconds in local time too) — using currentDateTime() instead of currentDateTimeUtc() is inconsistent with the rest of the engine that uses UTC, and secsTo across the local/UTC boundary can yield wrong remaining-time scheduling for locked files in non-UTC time zones.","fix":"Use QDateTime::currentDateTimeUtc() and QDateTime::fromSecsSinceEpoch(lockExpirationTime, Qt::UTC) consistently for the lock-expiry computation.","locations":[{"ref":"src/libsync/discovery.cpp:814-821","code":"  814 |     if(serverEntry.locked == SyncFileItem::LockStatus::LockedItem && serverEntry.lockTimeout > 0) {\n  815 |         const auto lockExpirationTime = serverEntry.lockTime + serverEntry.lockTimeout;\n  816 |         const auto timeRemaining = QDateTime::currentDateTime().secsTo(QDateTime::fromSecsSinceEpoch(lockExpirationTime));\n  817 |         // Add on a second as a precaution, sometimes we catch the server before it has had a chance to update\n  818 |         const auto lockExpirationTimeout = qMax(5LL, timeRemaining + 1);\n  819 | \n  820 |         _discoveryData->_anotherSyncNeeded = true;\n  821 |         _discoveryData->_filesNeedingScheduledSync.insert(path._original, lockExpirationTimeout);","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/discovery.cpp#L814-L821"}]},
