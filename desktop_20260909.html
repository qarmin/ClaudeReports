{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"createSyncRootRegistryKeys: on failure to set any registry value it attempts to roll back via registryDeleteKeyTree and then `Q_ASSERT(!deleteKeyResult)`. registryDeleteKeyTree returns true on success, so asserting that the delete result is falsy means a *successful* cleanup trips the assert in debug builds. The assert condition is inverted relative to the function's success semantics.","fix":"Assert the cleanup succeeded: `Q_ASSERT(deleteKeyResult);` (or drop the assert).","locations":[{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:816-818","code":"  816 |             const auto deleteKeyResult = OCC::Utility::registryDeleteKeyTree(HKEY_LOCAL_MACHINE, providerSyncRootIdRegistryKey);\n  817 |             Q_ASSERT(!deleteKeyResult);\n  818 |             return false;","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L816-L818"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"ConfigFile::updateSegment() uses Utility::rand() % 99 producing values 0..98, but the validity check accepts 0..99 inclusive (segment < 0 || segment > 99). A stored value of exactly 99 (which the generator never produces but a manually-edited config could) is accepted while the generator range is 0..98, an inconsistency between the accepted range and the generated range.","fix":"Make the generator and validator agree (e.g. rand()%100 for 0..99, or validate >98).","locations":[{"ref":"src/libsync/configfile.cpp:695-708","code":"  695 | int ConfigFile::updateSegment() const\n  696 | {\n  697 |     QSettings settings(configFile(), QSettings::IniFormat);\n  698 |     int segment = settings.value(QLatin1String(updateSegmentC), -1).toInt();\n  699 | \n  700 |     // Invalid? (Unset at the very first launch)\n  701 |     if(segment < 0 || segment > 99) {\n  702 |         // Save valid segment value, normally has to be done only once.\n  703 |         segment = Utility::rand() % 99;\n  704 |         settings.setValue(QLatin1String(updateSegmentC), segment);\n  705 |     }\n  706 | \n  707 |     return segment;\n  708 | }","lines":14,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/configfile.cpp#L695-L708"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"FileSystem::isFile() initializes its result from fileInfo.isDir() instead of fileInfo.isFile(). On the (common) code path where the passed-in QFileInfo already matches the filename, the function returns whether the path is a directory rather than a file - the exact opposite of what callers expect. The value is only corrected when fileInfo.filePath() differs from filename. This is a clear copy-paste error from isDir().","fix":"Change the initializer to `bool re = fileInfo.isFile();`.","locations":[{"ref":"src/common/filesystembase.cpp:474-491","code":"  474 | bool FileSystem::isFile(const QString &filename, const QFileInfo &fileInfo)\n  475 | {\n  476 | #ifdef Q_OS_WIN\n  477 |     if (isLnkFile(filename)) {\n  478 |         // Use a native check.\n  479 |         return isFileWin(filename);\n  480 |     }\n  481 | #endif\n  482 |     bool re = fileInfo.isDir();\n  483 |     // if the filename is different from the filename in fileInfo, the fileInfo is\n  484 |     // not valid. There needs to be one initialised here. Otherwise the incoming\n  485 |     // fileInfo is re-used.\n  486 |     if (fileInfo.filePath() != filename) {\n  487 |         QFileInfo myFI(filename);\n  488 |         re = myFI.isFile();\n  489 |     }\n  490 |     return re;\n  491 | }","lines":18,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/filesystembase.cpp#L474-L491"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"VfsXAttr::dehydratePlaceholder reads the pin state of item._file but then sets the pin state of item._renameTarget. In the xattr backend there is no rename to a suffix (dehydrate happens in place), so item._renameTarget is typically empty or unrelated, meaning the 'ensure pin state isn't contradictory' fix-up is applied to the wrong path (and a setPinState on an empty path). This logic was copy-pasted from VfsSuffix::dehydratePlaceholder where renameTarget is meaningful.","fix":"Use item._file consistently: `setPinState(item._file, PinState::Unspecified);` (matching the pinState(item._file) check above).","locations":[{"ref":"src/libsync/vfs/xattr/vfs_xattr.cpp:127-132","code":"  127 |     // Ensure the pin state isn't contradictory\n  128 |     const auto pin = pinState(item._file);\n  129 |     if (pin && *pin == PinState::AlwaysLocal) {\n  130 |         setPinState(item._renameTarget, PinState::Unspecified);\n  131 |     }\n  132 |     return {};","lines":6,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/xattr/vfs_xattr.cpp#L127-L132"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"critical","difficulty":"hard","description":"EncryptionHelper::generateRandom() ignores the return value of RAND_bytes(). If the CSPRNG fails (ret != 1) it only logs an info message and returns a buffer that is still all-zeroes (or partially filled). The result is used directly as AES-GCM IVs/nonces, the symmetric metadata key (metadataKeySize=16), per-file content encryption keys and the 40-byte private-key salt. A zeroed/predictable key or a repeated/zeroed GCM nonce catastrophically breaks confidentiality and integrity of E2EE data.","fix":"Return an error (or throw) when RAND_bytes() != 1 and make every caller treat a failure as fatal (abort the encryption operation) instead of silently using a possibly all-zero buffer.","locations":[{"ref":"src/libsync/clientsideencryption.cpp:226-237","code":"  226 | QByteArray generateRandom(int size)\n  227 | {\n  228 |     QByteArray result(size, '\\0');\n  229 | \n  230 |     int ret = RAND_bytes(unsignedData(result), size);\n  231 |     if (ret != 1) {\n  232 |         qCInfo(lcCse()) << \"Random byte generation failed!\";\n  233 |         // Error out?\n  234 |     }\n  235 | \n  236 |     return result;\n  237 | }","lines":12,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L226-L237"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"critical","difficulty":"medium","description":"EncryptionHelper::encryptPrivateKey() checks every OpenSSL return value but on failure only logs qCInfo and continues executing (no return). A failure of EVP_EncryptInit_ex / EVP_CIPHER_CTX_ctrl / EVP_EncryptUpdate / EVP_EncryptFinal_ex / EVP_CTRL_GCM_GET_TAG still produces a 'result' string that is then stored on the server as the user's encrypted private key. This can persist a corrupt/weakly-encrypted or untagged private key, and the all-error path is indistinguishable from success to the caller.","fix":"Return an empty QByteArray (and have encryptPrivateKey()/the StorePrivateKeyApiJob path abort) whenever any OpenSSL call fails, mirroring the early-return pattern already used in encryptStringSymmetric().","locations":[{"ref":"src/libsync/clientsideencryption.cpp:314-387","code":"  314 | QByteArray encryptPrivateKey(\n  315 |     const QByteArray& key,\n  316 |     const QByteArray& privateKey,\n  317 |     const QByteArray& salt\n  318 |     ) {\n  319 | \n  320 |     QByteArray iv = generateRandom(12);\n  321 | \n  322 |     CipherCtx ctx;\n  323 | \n  324 |     /* Create and initialise the context */\n  325 |     if(!ctx) {\n  326 |         qCInfo(lcCse()) << \"Error creating cipher\" << handleErrors();\n  327 |     }\n  328 | \n  329 |     /* Initialise the decryption operation. */\n  330 |     if(!EVP_EncryptInit_ex(ctx, EVP_aes_256_gcm(), nullptr, nullptr, nullptr)) {\n  331 |         qCInfo(lcCse()) << \"Error initializing context with aes_256\" << handleErrors();\n  332 |     }\n  333 | \n  334 |     // No padding\n  335 |     EVP_CIPHER_CTX_set_padding(ctx, 0);\n  336 | \n  337 |     /* Set IV length. */\n  338 |     if(!EVP_CIPHER_CTX_ctrl(ctx, EVP_CTRL_GCM_SET_IVLEN, iv.size(), nullptr)) {\n  339 |         qCInfo(lcCse()) << \"Error setting iv length\" << handleErrors();\n  340 |     }\n  341 | \n  342 |     /* Initialise key and IV */\n  343 |     if(!EVP_EncryptInit_ex(ctx, nullptr, nullptr, reinterpret_cast<const unsigned char*>(key.constData()), reinterpret_cast<const unsigned char*>(iv.constData()))) {\n  344 |         qCInfo(lcCse()) << \"Error initialising key and iv\" << handleErrors();\n  345 |     }\n  346 | \n  347 |     // We write the base64 encoded private key\n  348 |     QByteArray privateKeyB64 = privateKey.toBase64();\n  349 | \n  350 |     // Make sure we have enough room in the cipher text\n  351 |     QByteArray ctext(privateKeyB64.size() + 32, '\\0');\n  352 | \n  353 |     // Do the actual encryption\n  354 |     int len = 0;\n  355 |     if(!EVP_EncryptUpdate(ctx, unsignedData(ctext), &len, reinterpret_cast<const unsigned char*>(privateKeyB64.constData()), privateKeyB64.size())) {\n  356 |         qCInfo(lcCse()) << \"Error encrypting\" << handleErrors();\n  357 |     }\n  358 | \n  359 |     int clen = len;\n  360 | \n  361 |     /* Finalise the encryption. Normally ciphertext bytes may be written at\n  362 |      * this stage, but this does not occur in GCM mode\n  363 |      */\n  364 |     if(1 != EVP_EncryptFinal_ex(ctx, unsignedData(ctext) + len, &len)) {\n  365 |         qCInfo(lcCse()) << \"Error finalizing encryption\" << handleErrors();\n  366 |     }\n  367 |     clen += len;\n  368 | \n  369 |     /* Get the e2EeTag */\n  370 |     QByteArray e2EeTag(OCC::Constants::e2EeTagSize, '\\0');\n  371 |     if(1 != EVP_CIPHER_CTX_ctrl(ctx, EVP_CTRL_GCM_GET_TAG, OCC::Constants::e2EeTagSize, unsignedData(e2EeTag))) {\n  372 |         qCInfo(lcCse()) << \"Error getting the e2EeTag\" << handleErrors();\n  373 |     }\n  374 | \n  375 |     QByteArray cipherTXT;\n  376 |     cipherTXT.reserve(clen + OCC::Constants::e2EeTagSize);\n  377 |     cipherTXT.append(ctext, clen);\n  378 |     cipherTXT.append(e2EeTag);\n  379 | \n  380 |     QByteArray result = cipherTXT.toBase64();\n  381 |     result += '|';\n  382 |     result += iv.toBase64();\n  383 |     result += '|';\n  384 |     result += salt.toBase64();\n  385 | \n  386 |     return result;\n  387 | }","lines":74,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L314-L387"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"SqlQuery::exec() retry loop on SQLITE_LOCKED overwrites rc with the return value of sqlite3_reset(): `rc = sqlite3_reset(_stmt);`. If reset returns SQLITE_OK the loop terminates with rc==SQLITE_OK, which is neither SQLITE_DONE nor SQLITE_ROW, so the statement is reported as failed (exec returns false) and an error is logged, even though the real cause was transient lock contention. The original step result is lost.","fix":"Do not assign the result of sqlite3_reset() to rc; keep stepping. Preserve the SQLITE_LOCKED/BUSY status for the loop condition and only treat genuine error codes as failures.","locations":[{"ref":"src/common/ownsql.cpp:283-319","code":"  283 | bool SqlQuery::exec()\n  284 | {\n  285 |     if (!_stmt) {\n  286 |         qCWarning(lcSql) << \"Can't exec query, statement unprepared.\";\n  287 |         return false;\n  288 |     }\n  289 | \n  290 |     // Don't do anything for selects, that is how we use the lib :-|\n  291 |     if (!isSelect() && !isPragma()) {\n  292 |         int rc = 0, n = 0;\n  293 |         do {\n  294 |             rc = sqlite3_step(_stmt);\n  295 |             if (rc == SQLITE_LOCKED) {\n  296 |                 rc = sqlite3_reset(_stmt); /* This will also return SQLITE_LOCKED */\n  297 |                 n++;\n  298 |                 OCC::Utility::usleep(SQLITE_SLEEP_TIME_USEC);\n  299 |             } else if (rc == SQLITE_BUSY) {\n  300 |                 OCC::Utility::usleep(SQLITE_SLEEP_TIME_USEC);\n  301 |                 n++;\n  302 |             }\n  303 |         } while ((n < SQLITE_REPEAT_COUNT) && ((rc == SQLITE_BUSY) || (rc == SQLITE_LOCKED)));\n  304 |         _errId = rc;\n  305 | \n  306 |         if (_errId != SQLITE_DONE && _errId != SQLITE_ROW) {\n  307 |             _error = QString::fromUtf8(sqlite3_errmsg(_db));\n  308 |             qCWarning(lcSql) << \"Sqlite exec statement error:\" << _errId << _error << \"in\" << _sql;\n  309 |             if (_errId == SQLITE_IOERR) {\n  310 |                 qCWarning(lcSql) << \"IOERR extended errcode: \" << sqlite3_extended_errcode(_db);\n  311 | #if SQLITE_VERSION_NUMBER >= 3012000\n  312 |                 qCWarning(lcSql) << \"IOERR system errno: \" << sqlite3_system_errno(_db);\n  313 | #endif\n  314 |             }\n  315 |         }\n  316 |         return (_errId == SQLITE_DONE); // either SQLITE_ROW or SQLITE_DONE\n  317 |     }\n  318 | \n  319 |     return true;","lines":37,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/ownsql.cpp#L283-L319"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"slotEtagResponseHeaderReceived dereferences the result of qvariant_cast<AccountState*>(sender()->property(...)) without a null check before calling setNotificationsEtagResponseHeader on it. If the property is missing/invalid the cast yields nullptr and this crashes. (slotNotificationsReceived at line 101 reads the same property into `accountState` and likewise uses it unchecked at lines 108/160/186.)","fix":"Null-check the qvariant_cast result (or prefer the already-known _accountState member) before dereferencing.","locations":[{"ref":"src/gui/activity/notificationhandler.cpp:63-70","code":"   63 | void ServerNotificationHandler::slotEtagResponseHeaderReceived(const QByteArray &value, int statusCode)\n   64 | {\n   65 |     if (statusCode == successStatusCode) {\n   66 |         qCInfo(lcServerNotification) << \"New Notification ETag Response Header received \" << value;\n   67 |         auto *account = qvariant_cast<AccountState *>(sender()->property(propertyAccountStateC));\n   68 |         account->setNotificationsEtagResponseHeader(value);\n   69 |     }\n   70 | }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/activity/notificationhandler.cpp#L63-L70"},{"ref":"src/gui/activity/notificationhandler.cpp:101-108","code":"  101 |     auto accountState = qvariant_cast<AccountState *>(sender()->property(propertyAccountStateC));\n  102 | \n  103 |     ActivityList list;\n  104 |     ActivityList callList;\n  105 | \n  106 |     for (const auto &element : notifies) {\n  107 |         const auto json = element.toObject();\n  108 |         auto activity = Activity::fromActivityJson(json, accountState->account());","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/activity/notificationhandler.cpp#L101-L108"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In slotPutFinished, when the server reply does not contain an entry for a file AND there was a network error, abortWithError() is called once per missing file inside the loop. abortWithError -> abort(Synchronous) + done() will be invoked repeatedly for multiple files in the same batch, and done() emits itemCompleted and may trigger propagator()->abort() multiple times. The per-file abort inside the loop combined with the unconditional finalize() afterwards leads to double-processing of items.","fix":"Collect the missing/errored items and report them once, or break out of the loop after the first network-error abort; do not call abortWithError() repeatedly while continuing to iterate and then also call finalize().","locations":[{"ref":"src/libsync/bulkpropagatorjob.cpp:504-516","code":"  504 |     for (const auto &singleFile : _filesToUpload) {\n  505 |         if (!fullReplyObject.contains(singleFile._remotePath)) {\n  506 |             if (jobError != QNetworkReply::NoError) {\n  507 |                 singleFile._item->_status = SyncFileItem::NormalError;\n  508 |                 abortWithError(singleFile._item, SyncFileItem::NormalError, tr(\"Network error: %1\").arg(jobError));\n  509 |             }\n  510 |             continue;\n  511 |         }\n  512 |         const auto singleReplyObject = fullReplyObject[singleFile._remotePath].toObject();\n  513 |         slotPutFinishedOneFile(singleFile, job, singleReplyObject);\n  514 |     }\n  515 | \n  516 |     finalize(fullReplyObject);","lines":13,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/bulkpropagatorjob.cpp#L504-L516"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"generateSignatureCryptographicMessageSyntax() asserts on contentInfo == nullptr but in release builds Q_ASSERT is compiled out; the following `if (!contentInfo) return {};` returns an empty signature. An empty metadata signature is then base64-stored and the v2 metadata is uploaded with an empty X-NC-E2EE-SIGNATURE header (StoreMetaDataApiJob only logs a warning for empty signature, line ~106). This silently disables the metadata signature protection rather than failing the upload.","fix":"Propagate signature-generation failure as a hard error up to the metadata upload path and refuse to upload v2 metadata without a valid signature.","locations":[{"ref":"src/libsync/clientsideencryption.cpp:1443-1473","code":" 1443 | QByteArray ClientSideEncryption::generateSignatureCryptographicMessageSyntax(const QByteArray &data) const\n 1444 | {\n 1445 |     Bio certificateBio;\n 1446 |     const auto certificatePem = _encryptionCertificate.getCertificate().toPem();\n 1447 |     BIO_write(certificateBio, certificatePem.constData(), certificatePem.size());\n 1448 |     const auto x509Certificate = X509Certificate::readCertificate(certificateBio);\n 1449 |     if (!x509Certificate) {\n 1450 |         qCInfo(lcCse()) << \"Client certificate is invalid. Could not check it against the server public key\";\n 1451 |         return {};\n 1452 |     }\n 1453 | \n 1454 |     const auto privateKey = _encryptionCertificate.getEvpPrivateKey();\n 1455 | \n 1456 |     Bio dataBio;\n 1457 |     BIO_write(dataBio, data.constData(), data.size());\n 1458 | \n 1459 |     const auto contentInfo = CMS_sign(x509Certificate, privateKey, nullptr, dataBio, CMS_DETACHED);\n 1460 | \n 1461 |     Q_ASSERT(contentInfo);\n 1462 |     if (!contentInfo) {\n 1463 |         return {};\n 1464 |     }\n 1465 | \n 1466 |     Bio i2dCmsBioOut;\n 1467 |     [[maybe_unused]] auto resultI2dCms = i2d_CMS_bio(i2dCmsBioOut, contentInfo);\n 1468 |     const auto i2dCmsBio = BIO2ByteArray(i2dCmsBioOut);\n 1469 | \n 1470 |     CMS_ContentInfo_free(contentInfo);\n 1471 | \n 1472 |     return i2dCmsBio;\n 1473 | }","lines":31,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L1443-L1473"},{"ref":"src/libsync/clientsideencryptionjobs.cpp:102-108","code":"  102 |     if (_account->capabilities().clientSideEncryptionVersion() >= 2.0) {\n  103 |         if (!_signature.isEmpty()) {\n  104 |             req.setRawHeader(e2eeSignatureHeaderName, _signature);\n  105 |         } else {\n  106 |             qCWarning(lcCseJob()) << \"empty signature for\" << _fileId;\n  107 |         }\n  108 |     }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryptionjobs.cpp#L102-L108"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"EncryptionHelper::fileEncryption() logs but ignores failures to open the input and output QFile (the if-blocks have no return). If the output cannot be opened, encryption proceeds writing to a closed device and the function can still return true with an empty/partial ciphertext, which is then uploaded as the encrypted file.","fix":"Return false immediately if either input->open() or output->open() fails.","locations":[{"ref":"src/libsync/clientsideencryption.cpp:2402-2409","code":" 2402 | bool EncryptionHelper::fileEncryption(const QByteArray &key, const QByteArray &iv, QFile *input, QFile *output, QByteArray& returnTag)\n 2403 | {\n 2404 |     if (!input->open(QIODevice::ReadOnly)) {\n 2405 |         qCWarning(lcCse) << \"Could not open input file for reading\" << input->errorString();\n 2406 |     }\n 2407 |     if (!output->open(QIODevice::WriteOnly)) {\n 2408 |         qCWarning(lcCse) << \"Could not oppen output file for writing\" << output->errorString();\n 2409 |     }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L2402-L2409"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"HttpCredentials::slotReadJobDone uses dynamic_cast<QKeychain::ReadPasswordJob*>(incoming) and then immediately dereferences job (job->error(), job->textData()) without a null check. If the cast ever fails (different job type) this is a null-pointer dereference. Every other slot in this file uses qobject_cast and at least the keychainUnavailableRetryLater path; this one is inconsistent and unguarded.","fix":"Check the cast result before use, or use qobject_cast and bail/log if null, consistent with the other slots.","locations":[{"ref":"src/libsync/creds/httpcredentials.cpp:332-347","code":"  332 | void HttpCredentials::slotReadJobDone(QKeychain::Job *incoming)\n  333 | {\n  334 |     auto *job = dynamic_cast<QKeychain::ReadPasswordJob *>(incoming);\n  335 |     QKeychain::Error error = job->error();\n  336 | \n  337 |     // If we can't find the credentials at the keys that include the account id,\n  338 |     // try to read them from the legacy locations that don't have a account id.\n  339 |     if (!_keychainMigration && error == QKeychain::EntryNotFound) {\n  340 |         qCWarning(lcHttpCredentials)\n  341 |             << \"Could not find keychain entries, attempting to read from legacy locations\";\n  342 |         _keychainMigration = true;\n  343 |         fetchFromKeychainHelper();\n  344 |         return;\n  345 |     }\n  346 | \n  347 |     _password = job->textData();","lines":16,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/creds/httpcredentials.cpp#L332-L347"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"OwncloudPropagator::staticUpdateMetadata() maps Vfs::ConvertToPlaceholderResult::Locked to a successful 'Ok'-style return only via the explicit Locked branch, but the trailing 'return Vfs::ConvertToPlaceholderResult::Ok;' collapses any other non-error result to Ok. More concretely, callers like CleanupPollsJob check only !result (the error), so a 'Locked' placeholder during poll cleanup is treated as full success and the upload info is cleared, potentially losing the in-use state.","fix":"Propagate the Locked result to callers and have CleanupPollsJob::slotPollFinished handle Locked (retry/another sync) rather than treating any non-error as success.","locations":[{"ref":"src/libsync/owncloudpropagator.cpp:1113-1133","code":" 1113 | Result<Vfs::ConvertToPlaceholderResult, QString> OwncloudPropagator::staticUpdateMetadata(const SyncFileItem &item,\n 1114 |                                                                                           const QString localDir,\n 1115 |                                                                                           Vfs *vfs,\n 1116 |                                                                                           SyncJournalDb *const journal,\n 1117 |                                                                                           Vfs::UpdateMetadataTypes updateType)\n 1118 | {\n 1119 |     const QString fsPath = localDir + item.destination();\n 1120 |     auto record = item.toSyncJournalFileRecordWithInode(fsPath);\n 1121 |     const auto dBresult = journal->setFileRecord(record);\n 1122 |     if (!dBresult) {\n 1123 |         return dBresult.error();\n 1124 |     }\n 1125 | \n 1126 |     const auto result = vfs->convertToPlaceholder(fsPath, item, {}, updateType);\n 1127 |     if (!result) {\n 1128 |         return result.error();\n 1129 |     } else if (*result == Vfs::ConvertToPlaceholderResult::Locked) {\n 1130 |         return Vfs::ConvertToPlaceholderResult::Locked;\n 1131 |     }\n 1132 |     return Vfs::ConvertToPlaceholderResult::Ok;\n 1133 | }","lines":21,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/owncloudpropagator.cpp#L1113-L1133"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"fromProperties() parses 'size' with QString::toInt() into a qint64 _size field. toInt() returns a 32-bit int, so files larger than 2GiB overflow/clamp to 0 on parse failure, corrupting the item size used for quota and propagation decisions.","fix":"Use properties.value(QStringLiteral(\"size\")).toLongLong() to match the qint64 _size field.","locations":[{"ref":"src/libsync/syncfileitem.cpp:185","code":"  185 |     item->_size = isDirectory ? 0 : properties.value(QStringLiteral(\"size\")).toInt();","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/syncfileitem.cpp#L185"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"WordList::getRandomNumber() computes num % max but never checks the return value of RAND_bytes(). On RAND_bytes failure the buffer d is uninitialized, yielding non-random output for mnemonic/passphrase generation; with max==0 it would divide by zero. RAND_bytes can fail (e.g. entropy source unavailable).","fix":"Check RAND_bytes return value and abort/retry on failure; guard against max<=0.","locations":[{"ref":"src/libsync/wordlist.cpp:13-25","code":"   13 | int getRandomNumber(int max) {\n   14 |     unsigned char d[8];\n   15 |     RAND_bytes(d, 8);\n   16 | \n   17 |     unsigned int num = 0;\n   18 | \n   19 |     for (unsigned char c : d) {\n   20 |         num = num << 8;\n   21 |         num += c;\n   22 |     }\n   23 | \n   24 |     return static_cast<int>(num % max);\n   25 | }","lines":13,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/wordlist.cpp#L13-L25"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"checkDb() runs `quick_check.next()` and then reads stringValue(0) without checking the NextResult. If next() returned no data (e.g. an empty result on certain error conditions), stringValue(0) reads column 0 of a statement that produced no row, returning an empty/garbage string that then fails the 'ok' comparison and triggers DB deletion. The result of next() should be validated.","fix":"Capture `auto r = quick_check.next();` and treat `!r.hasData` distinctly (do not delete the DB) instead of feeding an unread column into the comparison.","locations":[{"ref":"src/common/ownsql.cpp:90-104","code":"   90 |     if (!quick_check.exec()) {\n   91 |         qCWarning(lcSql) << \"Error running quick_check on database\";\n   92 |         _errId = quick_check.errorId();\n   93 |         _error = quick_check.error();\n   94 |         return CheckDbResult::CantExec;\n   95 |     }\n   96 | \n   97 |     quick_check.next();\n   98 |     QString result = quick_check.stringValue(0);\n   99 |     if (result != QLatin1String(\"ok\")) {\n  100 |         qCWarning(lcSql) << \"quick_check returned failure:\" << result;\n  101 |         return CheckDbResult::NotOk;\n  102 |     }\n  103 | \n  104 |     return CheckDbResult::Ok;","lines":15,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/ownsql.cpp#L90-L104"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"ConnectionValidator::slotCapabilitiesRecieved() only calls slotUserFetched(nullptr) (skipping user fetch) when the account isPublicShareLink(); otherwise the function relies on checkServerTermsOfService() -> termsOfServiceCheckDone() -> fetchUser() chain. However checkServerTermsOfService() is invoked before the isPublicShareLink early return, so for a public share link the terms-of-service job is started AND slotUserFetched(nullptr) is called, racing two completion paths (TermsOfServiceChecker::done and the e2e initializationFinished) both of which can reach reportResult(Connected)/reportConnected. This can produce duplicate connectionResult emissions.","fix":"Return early (and skip checkServerTermsOfService) for public share links, or ensure only one completion path leads to reportResult().","locations":[{"ref":"src/gui/connectionvalidator.cpp:264-287","code":"  264 | void ConnectionValidator::slotCapabilitiesRecieved(const QJsonDocument &json)\n  265 | {\n  266 |     auto caps = json.object().value(\"ocs\").toObject().value(\"data\").toObject().value(\"capabilities\").toObject();\n  267 |     qCInfo(lcConnectionValidator) << \"Server capabilities\" << caps;\n  268 |     _account->setCapabilities(caps.toVariantMap());\n  269 | \n  270 |     // New servers also report the version in the capabilities\n  271 |     QString serverVersion = caps[\"core\"].toObject()[\"status\"].toObject()[\"version\"].toString();\n  272 |     if (!serverVersion.isEmpty() && !setAndCheckServerVersion(serverVersion)) {\n  273 |         return;\n  274 |     }\n  275 | \n  276 |     // Check for the directEditing capability\n  277 |     QUrl directEditingURL = QUrl(caps[\"files\"].toObject()[\"directEditing\"].toObject()[\"url\"].toString());\n  278 |     QString directEditingETag = caps[\"files\"].toObject()[\"directEditing\"].toObject()[\"etag\"].toString();\n  279 |     _account->fetchDirectEditors(directEditingURL, directEditingETag);\n  280 | \n  281 |     checkServerTermsOfService();\n  282 | \n  283 |     if (_account->isPublicShareLink()) {\n  284 |         slotUserFetched(nullptr);\n  285 |         return;\n  286 |     }\n  287 | }","lines":24,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/connectionvalidator.cpp#L264-L287"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"EditLocallyJob::fileLockError() builds the title with `tr(\"File %1 could not be locked.\")` but never calls .arg(_fileName), so the user-visible notification shows a literal \"%1\" instead of the file name.","fix":"Add .arg(_fileName) to the title string, as the other fileLock* handlers do.","locations":[{"ref":"src/gui/editlocallyjob.cpp:540-544","code":"  540 | void EditLocallyJob::fileLockError(const QString &errorMessage)\n  541 | {\n  542 |     qCWarning(lcEditLocallyJob()) << \"File lock failed, showing notification\" << _relPath << errorMessage;\n  543 |     fileLockProcedureComplete(tr(\"File %1 could not be locked.\"), errorMessage, false);\n  544 | }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/editlocallyjob.cpp#L540-L544"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"FolderMan::setupFoldersHelper aborts with qFatal('Could not load plugin') (line 367) when createVfsFromPlugin fails for a configured folder, terminating the whole application. A single unreadable/unavailable VFS plugin (or a folder configured for a VFS mode not available on this machine) brings down the client at startup instead of skipping/disabling that one folder. Note the migration branch a few lines above (line 326-329) handles the same failure with only a warning.","fix":"Log a warning and skip (or fall back to Vfs::Off for) the affected folder instead of qFatal.","locations":[{"ref":"src/gui/folderman.cpp:374-378","code":"  374 |             auto vfs = createVfsFromPlugin(folderDefinition.virtualFilesMode);\n  375 |             if (!vfs) {\n  376 |                 // TODO: Must do better error handling\n  377 |                 qFatal(\"Could not load plugin\");\n  378 |             }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderman.cpp#L374-L378"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"finalize() (success path) calls done() with ErrorCategory::GenericError even when the item succeeded: `done(singleFile._item, singleFile._item->_status, {}, ErrorCategory::GenericError);`. Passing GenericError as the error category for a successful item is misleading and may be propagated to itemCompleted listeners that key behaviour off the category.","fix":"Pass ErrorCategory::NoError when the item status is Success, and GenericError only for actual error statuses.","locations":[{"ref":"src/libsync/bulkpropagatorjob.cpp:593","code":"  593 |         done(singleFile._item, singleFile._item->_status, {}, ErrorCategory::GenericError);","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/bulkpropagatorjob.cpp#L593"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"gzipThenEncryptData() calls EncryptionHelper::dataEncryption() but ignores its bool return value. If encryption fails, outputData may be empty/partial yet the function returns it as if successful, and the caller (encryptedMetadata) base64-encodes and uploads it. dataDecryption() failures are handled, but the encryption side is not.","fix":"Check the return of dataEncryption() and return an empty QByteArray on failure so encryptedMetadata() can abort.","locations":[{"ref":"src/libsync/clientsideencryption.cpp:2754-2777","code":" 2754 | QByteArray EncryptionHelper::gzipThenEncryptData(const QByteArray &key, const QByteArray &inputData, const QByteArray &iv, QByteArray &returnTag)\n 2755 | {\n 2756 |     QBuffer gZipBuffer;\n 2757 |     auto gZipCompressionDevice = KCompressionDevice(&gZipBuffer, false, KCompressionDevice::GZip);\n 2758 |     if (!gZipCompressionDevice.open(QIODevice::WriteOnly)) {\n 2759 |         return {};\n 2760 |     }\n 2761 |     const auto bytesWritten = gZipCompressionDevice.write(inputData);\n 2762 |     gZipCompressionDevice.close();\n 2763 |     if (bytesWritten < 0) {\n 2764 |         return {};\n 2765 |     }\n 2766 | \n 2767 |     if (!gZipBuffer.open(QIODevice::ReadOnly)) {\n 2768 |         return {};\n 2769 |     }\n 2770 | \n 2771 |     QByteArray outputData;\n 2772 |     returnTag.clear();\n 2773 |     const auto gZippedAndNotEncrypted = gZipBuffer.readAll();\n 2774 |     EncryptionHelper::dataEncryption(key, iv, gZippedAndNotEncrypted, outputData, returnTag);\n 2775 |     gZipBuffer.close();\n 2776 |     return outputData;\n 2777 | }","lines":24,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L2754-L2777"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"PropagateRemoteMkdir::slotMkdir uses done(SyncFileItem::NormalError, {}, ...) with an empty error string when getFileRecord for the parent path fails. An empty error message gives the user/log no indication of what went wrong, unlike other failure paths in the same file which provide descriptive tr() strings.","fix":"Provide a descriptive error string, e.g. tr(\"Could not get file %1 from local DB\").arg(parentPath).","locations":[{"ref":"src/libsync/propagateremotemkdir.cpp:200-204","code":"  200 |     bool ok = propagator()->_journal->getFileRecord(parentPath, &parentRec);\n  201 |     if (!ok) {\n  202 |         done(SyncFileItem::NormalError, {}, ErrorCategory::GenericError);\n  203 |         return;\n  204 |     }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagateremotemkdir.cpp#L200-L204"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"PropagateUploadFileCommon constructor reads the parent file record (getFileRecord) and, on failure, simply `return;`s from the constructor. The retrieved parentRec is then discarded entirely and nothing is stored, so the whole block is dead work; the real lookup is redone in start(). This is leftover/duplicated logic that does nothing useful and is misleading.","fix":"Remove the redundant getFileRecord block from the constructor (the same lookup is performed in start()), or actually use/store the result.","locations":[{"ref":"src/libsync/propagateupload.cpp:184-199","code":"  184 | PropagateUploadFileCommon::PropagateUploadFileCommon(OwncloudPropagator *propagator, const SyncFileItemPtr &item)\n  185 |     : PropagateItemJob(propagator, item)\n  186 |     , _finished(false)\n  187 |     , _deleteExisting(false)\n  188 |     , _aborting(false)\n  189 | {\n  190 |     const auto path = _item->_file;\n  191 |     const auto slashPosition = path.lastIndexOf('/');\n  192 |     const auto parentPath = slashPosition >= 0 ? path.left(slashPosition) : QString();\n  193 | \n  194 |     SyncJournalFileRecord parentRec;\n  195 |     bool ok = propagator->_journal->getFileRecord(parentPath, &parentRec);\n  196 |     if (!ok) {\n  197 |         return;\n  198 |     }\n  199 | }","lines":16,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagateupload.cpp#L184-L199"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"PushNotifications::handleNotifyFileId() iterates jsonDoc.array() but reads 'const auto jsonArray = jsonDoc.array()' before checking 'jsonDoc.isArray()' in the same if-statement. While QJsonDocument::array() on a non-array returns an empty array (so no crash), the ordering is misleading and relies on that fallback; additionally each element uses 'fileid = jsonFileid.toInteger()' computed before the 'jsonFileid.isDouble()' guard, so non-numeric entries compute a default before being filtered.","fix":"Check isArray()/isDouble() before extracting values for clarity and correctness.","locations":[{"ref":"src/libsync/pushnotifications.cpp:227-233","code":"  227 |     if (const auto jsonArray = jsonDoc.array(); jsonDoc.isArray()) {\n  228 |         for (const auto& jsonFileid : jsonArray) {\n  229 |             if (const auto fileid = jsonFileid.toInteger(); jsonFileid.isDouble()) {\n  230 |                 fileIds.push_back(fileid);\n  231 |             }\n  232 |         }\n  233 |     }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/pushnotifications.cpp#L227-L233"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"cfApiFetchPlaceHolders dereferences callbackInfo->ProcessInfo->ProcessId (line 528 in debug log and line 560 in the self-hydration check) without the null check that cfApiFetchDataCallback performs. The sync root is connected with CF_CONNECT_FLAG_REQUIRE_PROCESS_INFO so ProcessInfo is normally present, but the inconsistency with the data callback (which explicitly null-checks ProcessInfo) means a null ProcessInfo here is an unguarded null dereference.","fix":"Null-check callbackInfo->ProcessInfo before dereferencing, mirroring cfApiFetchDataCallback (send transfer error and return if missing).","locations":[{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:528-529","code":"  528 |     qDebug(lcCfApiWrapper) << \"Fetch placeholders requested by proccess id:\" << callbackInfo->ProcessInfo->ProcessId;\n  529 |     qDebug(lcCfApiWrapper) << \"Fetch placeholders requested by application id:\" << QString(QString::fromWCharArray(callbackInfo->ProcessInfo->ApplicationId));","lines":2,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L528-L529"},{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:560-564","code":"  560 |     if (QCoreApplication::applicationPid() == callbackInfo->ProcessInfo->ProcessId) {\n  561 |         qCCritical(lcCfApiWrapper) << \"implicit hydration triggered by the client itself. Will lead to a deadlock. Cancel\" << path << requestId;\n  562 |         sendTransferError();\n  563 |         return;\n  564 |     }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L560-L564"}]},
{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"SqlDatabase::error() has the `_error.clear()` line commented out (line 170) with no explanation, while a stale `_error` will persist across queries. Combined with the macro SQLITE_DO only setting _error on failure, a later successful operation that does not touch _error can still report a previous error string via error(). This is a misleading-state hazard noted by the dead/commented code.","fix":"Either remove the commented-out line and document that _error is sticky until next failure, or clear _error at the start of each exec/prepare so error() reflects only the latest operation.","locations":[{"ref":"src/common/ownsql.cpp:167-172","code":"  167 | QString SqlDatabase::error() const\n  168 | {\n  169 |     const QString err(_error);\n  170 |     // _error.clear();\n  171 |     return err;\n  172 | }","lines":6,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/ownsql.cpp#L167-L172"}]},
{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"SslErrorDialog constructor calls okButton->setEnabled(false) at line 84 before the `if (okButton)` null guard at line 90, so the guard is meaningless (a null okButton would already have crashed) and cancelButton is never null-checked at all though both are used.","fix":"Perform the null checks before first use, or drop the redundant guard.","locations":[{"ref":"src/gui/sslerrordialog.cpp:80-94","code":"   80 |     QPushButton *okButton =\n   81 |         _ui->_dialogButtonBox->button(QDialogButtonBox::Ok);\n   82 |     QPushButton *cancelButton =\n   83 |         _ui->_dialogButtonBox->button(QDialogButtonBox::Cancel);\n   84 |     okButton->setEnabled(false);\n   85 | \n   86 |     _ui->_cbTrustConnect->setEnabled(!Theme::instance()->forbidBadSSL());\n   87 |     connect(_ui->_cbTrustConnect, &QAbstractButton::clicked,\n   88 |         okButton, &QWidget::setEnabled);\n   89 | \n   90 |     if (okButton) {\n   91 |         okButton->setDefault(true);\n   92 |         connect(okButton, &QAbstractButton::clicked, this, &QDialog::accept);\n   93 |         connect(cancelButton, &QAbstractButton::clicked, this, &QDialog::reject);\n   94 |     }","lines":15,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/sslerrordialog.cpp#L80-L94"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"Systray::setTrayEngine receives a QQmlApplicationEngine* and does `_trayEngine = std::make_unique<QQmlApplicationEngine>(trayEngine);`. The QQmlApplicationEngine(QObject* parent) constructor treats the passed-in engine as a PARENT object, not as the engine to adopt. So a brand-new engine is created and the caller-supplied engine (created in owncloudgui.cpp:91 as `new QQmlApplicationEngine(this)`) is never used as an engine — it merely becomes the parent. This is confusing/wasteful and likely not the intended behavior; the passed engine's image providers / NAM factory are never configured.","fix":"Either adopt the passed engine directly (`_trayEngine.reset(trayEngine)` with appropriate ownership) or pass a parent QObject rather than an engine instance; do not wrap an engine as the parent of a new engine.","locations":[{"ref":"src/gui/systray.cpp:125-136","code":"  125 | void Systray::setTrayEngine(QQmlApplicationEngine *trayEngine)\n  126 | {\n  127 |     _trayEngine = std::make_unique<QQmlApplicationEngine>(trayEngine);\n  128 | \n  129 |     _trayEngine->setNetworkAccessManagerFactory(&_accessManagerFactory);\n  130 | \n  131 |     _trayEngine->addImportPath(QCoreApplication::applicationDirPath() + \"/qml\");\n  132 |     _trayEngine->addImportPath(\"qrc:/qml/theme\");\n  133 |     _trayEngine->addImageProvider(\"avatars\", new ImageProvider);\n  134 |     _trayEngine->addImageProvider(QLatin1String(\"svgimage-custom-color\"), new OCC::Ui::SvgImageProvider);\n  135 |     _trayEngine->addImageProvider(QLatin1String(\"tray-image-provider\"), new TrayImageProvider);\n  136 | }","lines":12,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/systray.cpp#L125-L136"},{"ref":"src/gui/owncloudgui.cpp:108","code":"  108 |     _tray->setTrayEngine(new QQmlApplicationEngine(this));","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/owncloudgui.cpp#L108"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"checkServerPublicKeyValidity() reads the server's PUBLIC key with PKey::readPrivateKey(serverPublicKeyBio) (PEM_read_bio_PrivateKey). A public key PEM is not a private key, so this normally yields a null/empty PKey; X509_verify() is then called against a likely-null key. The validity check can silently mis-behave (and is misleading to readers), weakening the binding check between the client certificate and the server key.","fix":"Use PKey::readPublicKey() (PEM_read_bio_PUBKEY) for the server public key and check the returned key is non-null before X509_verify().","locations":[{"ref":"src/libsync/clientsideencryption.cpp:1382-1403","code":" 1382 | bool ClientSideEncryption::checkServerPublicKeyValidity(const QByteArray &serverPublicKeyString) const\n 1383 | {\n 1384 |     Bio serverPublicKeyBio;\n 1385 |     BIO_write(serverPublicKeyBio, serverPublicKeyString.constData(), serverPublicKeyString.size());\n 1386 |     const auto serverPublicKey = PKey::readPrivateKey(serverPublicKeyBio);\n 1387 | \n 1388 |     Bio certificateBio;\n 1389 |     const auto certificatePem = _encryptionCertificate.getCertificate().toPem();\n 1390 |     BIO_write(certificateBio, certificatePem.constData(), certificatePem.size());\n 1391 |     const auto x509Certificate = X509Certificate::readCertificate(certificateBio);\n 1392 |     if (!x509Certificate) {\n 1393 |         qCInfo(lcCse()) << \"Client certificate is invalid. Could not check it against the server public key\";\n 1394 |         return false;\n 1395 |     }\n 1396 | \n 1397 |     if (X509_verify(x509Certificate, serverPublicKey) == 0) {\n 1398 |         qCInfo(lcCse()) << \"Client certificate is not valid against the server public key\";\n 1399 |         return false;\n 1400 |     }\n 1401 | \n 1402 |     qCDebug(lcCse()) << \"Client certificate is valid against server public key\";\n 1403 |     return true;","lines":22,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L1382-L1403"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"hard","description":"ClientStatusReportingDatabase uses QSqlQuery with the default database connection (no QSqlDatabase passed) but the DB is created via QSqlDatabase::addDatabase(\"QSQLITE\") with the default connection name. Default QSqlDatabase connections are not safe to use across threads, yet these queries run both on the constructing thread and inside network-reply callbacks. Combined with the missing lock in delete, the SQLite connection can be used from multiple threads.","fix":"Use a uniquely-named connection bound to one thread, or serialize all access through the mutex (and add the missing lock).","locations":[{"ref":"src/libsync/clientstatusreportingdatabase.cpp:24-57","code":"   24 | ClientStatusReportingDatabase::ClientStatusReportingDatabase(const Account *account)\n   25 | {\n   26 |     const auto dbPath = makeDbPath(account);\n   27 |     _database = QSqlDatabase::addDatabase(QStringLiteral(\"QSQLITE\"));\n   28 |     _database.setDatabaseName(dbPath);\n   29 | \n   30 |     if (!_database.open()) {\n   31 |         qCWarning(lcClientStatusReportingDatabase) << \"Could not setup client reporting, database connection error.\";\n   32 |         return;\n   33 |     }\n   34 | \n   35 |     QSqlQuery query;\n   36 |     const auto prepareResult =\n   37 |         query.prepare(QStringLiteral(\"CREATE TABLE IF NOT EXISTS clientstatusreporting(\"\n   38 |                                      \"name VARCHAR(4096) PRIMARY KEY,\"\n   39 |                                      \"status INTEGER(8),\"\n   40 |                                      \"count INTEGER,\"\n   41 |                                      \"lastOccurrence INTEGER(8))\"));\n   42 |     if (!prepareResult || !query.exec()) {\n   43 |         qCWarning(lcClientStatusReportingDatabase) << \"Could not setup client clientstatusreporting table:\" << query.lastError().text();\n   44 |         return;\n   45 |     }\n   46 | \n   47 |     if (!query.prepare(QStringLiteral(\"CREATE TABLE IF NOT EXISTS keyvalue(key VARCHAR(4096), value VARCHAR(4096), PRIMARY KEY(key))\")) || !query.exec()) {\n   48 |         qCWarning(lcClientStatusReportingDatabase) << \"Could not setup client keyvalue table:\" << query.lastError().text();\n   49 |         return;\n   50 |     }\n   51 | \n   52 |     if (!updateStatusNamesHash()) {\n   53 |         return;\n   54 |     }\n   55 | \n   56 |     _isInitialized = true;\n   57 | }","lines":34,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientstatusreportingdatabase.cpp#L24-L57"},{"ref":"src/libsync/clientstatusreportingdatabase.cpp:72-86","code":"   72 |     QSqlQuery query;\n   73 |     if (!query.prepare(QStringLiteral(\"SELECT * FROM clientstatusreporting\")) || !query.exec()) {\n   74 |         qCWarning(lcClientStatusReportingDatabase) << \"Could not get records from clientstatusreporting:\" << query.lastError().text();\n   75 |         return records;\n   76 |     }\n   77 | \n   78 |     while (query.next()) {\n   79 |         ClientStatusReportingRecord record;\n   80 |         record._status = query.value(query.record().indexOf(QStringLiteral(\"status\"))).toLongLong();\n   81 |         record._name = query.value(query.record().indexOf(QStringLiteral(\"name\"))).toByteArray();\n   82 |         record._numOccurences = query.value(query.record().indexOf(QStringLiteral(\"count\"))).toLongLong();\n   83 |         record._lastOccurence = query.value(query.record().indexOf(QStringLiteral(\"lastOccurrence\"))).toLongLong();\n   84 |         records.push_back(record);\n   85 |     }\n   86 |     return records;","lines":15,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientstatusreportingdatabase.cpp#L72-L86"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"PutMultiFileJob::start() reads every upload device fully into memory via oneDevice._device->readAll() and stuffs the bytes into a QHttpPart body. For a bulk batch sized up to maxChunkSize across many files this materializes the whole batch in RAM at once (plus QHttpMultiPart copies). On large batches or low-memory devices this is a significant memory spike compared to streaming the device.","fix":"Stream the device into the QHttpPart (setBodyDevice) instead of readAll() where feasible, or enforce a conservative byte cap on bulk batches so the in-memory body stays bounded.","locations":[{"ref":"src/libsync/putmultifilejob.cpp:35-63","code":"   35 |     for(const auto &oneDevice : _devices) {\n   36 |         // Our rate limits in UploadDevice::readData will cause an application freeze if used here.\n   37 |         // QHttpMultiPart's internal QHttpMultiPartIODevice::readData will loop over and over trying\n   38 |         // to read data from our UploadDevice while there is data left to be read; this will cause\n   39 |         // a deadlock as we will never have a chance to progress the data read\n   40 |         oneDevice._device->setChoked(false);\n   41 |         oneDevice._device->setBandwidthLimited(false);\n   42 | \n   43 |         auto onePart = QHttpPart{};\n   44 | \n   45 |         if (oneDevice._device->size() == 0) {\n   46 |             onePart.setBody({});\n   47 |         } else {\n   48 |             const auto allData = oneDevice._device->readAll();\n   49 |             onePart.setBody(allData);\n   50 |         }\n   51 | \n   52 |         if (oneDevice._device->isOpen()) {\n   53 |             oneDevice._device->close();\n   54 |         }\n   55 | \n   56 |         for (auto it = oneDevice._headers.begin(); it != oneDevice._headers.end(); ++it) {\n   57 |             onePart.setRawHeader(it.key(), it.value());\n   58 |         }\n   59 | \n   60 |         req.setPriority(QNetworkRequest::LowPriority); // Long uploads must not block non-propagation jobs.\n   61 | \n   62 |         _body.append(onePart);\n   63 |     }","lines":29,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/putmultifilejob.cpp#L35-L63"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"IconJob constructor passes 'url' twice: QNetworkRequest request(url) is built, then account->sendRawRequest(\"GET\", url, request) is called. Account::sendRawRequest internally does req.setUrl(url), so the URL set on the locally-built request is redundant; harmless but indicates copy/paste. More notably, RedirectPolicyAttribute is set to 'true' (a bool implicitly converted to QVariant) instead of a QNetworkRequest::RedirectPolicy enum value, which is not the documented way to enable redirect following and may not behave as intended given AccessManager forces ManualRedirectPolicy unless already set.","fix":"Set RedirectPolicyAttribute to a proper QNetworkRequest::RedirectPolicy value (e.g. NoLessSafeRedirectPolicy) and drop the redundant url on the request.","locations":[{"ref":"src/libsync/iconjob.cpp:10-17","code":"   10 | IconJob::IconJob(AccountPtr account, const QUrl &url, QObject *parent)\n   11 |     : QObject(parent)\n   12 | {\n   13 |     QNetworkRequest request(url);\n   14 |     request.setAttribute(QNetworkRequest::RedirectPolicyAttribute, true);\n   15 |     const auto reply = account->sendRawRequest(QByteArrayLiteral(\"GET\"), url, request);\n   16 |     connect(reply, &QNetworkReply::finished, this, &IconJob::finished);\n   17 | }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/iconjob.cpp#L10-L17"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"hard","description":"createPlaceholderInfo sets FileIdentityLength = fileId.length() (raw byte count) while convertToPlaceholder sets it to (wstring length + 1) * sizeof(wchar_t) for a UTF-8-derived wstring, and cfApiSendPlaceholdersTransferInfo uses (length+1)*sizeof(wchar_t) over a byte buffer. These three callers disagree on how FileIdentity/FileIdentityLength is encoded (raw bytes vs wide chars). At minimum this is inconsistent and the wide-char-times-byte-length computation in cfApiSendPlaceholdersTransferInfo over a QByteArray fileId likely over-reports the identity length, which can later mismatch when CfAPI returns the identity.","fix":"Standardize the FileIdentity encoding and length across all create/convert/transfer paths (pick raw bytes consistently and use fileId.size()), so the stored and round-tripped identities match.","locations":[{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:1082-1083","code":" 1082 |     cloudEntry.FileIdentity = fileId.data();\n 1083 |     cloudEntry.FileIdentityLength = static_cast<DWORD>(fileId.length());","lines":2,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L1082-L1083"},{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:158-160","code":"  158 |         const auto fileIdentity = entryInfo.parsedProperties.fileId;\n  159 |         newPlaceholder.FileIdentity = fileIdentity.data();\n  160 |         newPlaceholder.FileIdentityLength = (fileIdentity.length() + 1) * sizeof(wchar_t);","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L158-L160"},{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:1221-1226","code":" 1221 |     const QByteArray &fileId = item._fileId;\n 1222 |     const auto fileIdentity = QString::fromUtf8(fileId).toStdWString();\n 1223 |     const auto fileIdentitySize = (fileIdentity.length() + 1) * sizeof(wchar_t);\n 1224 |     const auto createPlaceholderFlags = CF_CONVERT_FLAG_MARK_IN_SYNC | (item.isDirectory() ? (item._type == ItemType::ItemTypeVirtualDirectory ? CF_CONVERT_FLAG_ENABLE_ON_DEMAND_POPULATION : CF_CONVERT_FLAG_ALWAYS_FULL) : CF_CONVERT_FLAG_MARK_IN_SYNC);\n 1225 | \n 1226 |     const auto result = CfConvertToPlaceholder(handleForPath(path).get(), fileIdentity.data(), sizeToDWORD(fileIdentitySize), createPlaceholderFlags, nullptr, nullptr);","lines":6,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L1221-L1226"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"askExperimentalVirtualFilesFeature() declares `Q_UNREACHABLE()` for the Vfs::XAttr case. On platforms where XAttr is a valid best-available VFS mode, reaching this switch with XAttr would invoke undefined behaviour. While the wizard currently restricts itself to CfApi/WithSuffix paths, the unreachable assumption is fragile if XAttr ever becomes the best mode here.","fix":"Handle Vfs::XAttr explicitly (treat it like WithSuffix, prompting the user) instead of asserting unreachable.","locations":[{"ref":"src/gui/guiutility.cpp:149-152","code":"  149 |     case Vfs::XAttr:\n  150 |     case Vfs::Off:\n  151 |         Q_UNREACHABLE();\n  152 |     }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/guiutility.cpp#L149-L152"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"FolderStatusModel::slotFolderScheduleQueueChanged calls slotFolderSyncStateChange for every folder in the FolderMan map on each schedule-queue change. slotFolderSyncStateChange itself, for NotYetStarted folders, iterates the entire map again (to count running folders) and the schedule queue. This is O(folders^2) work triggered on every queue mutation; with many folders the settings dialog can become sluggish.","fix":"Only update folders belonging to this model's account, and precompute the running-folder count once per queue change rather than per folder.","locations":[{"ref":"src/gui/folderstatusmodel.cpp:1210-1216","code":" 1210 | void FolderStatusModel::slotFolderScheduleQueueChanged()\n 1211 | {\n 1212 |     // Update messages on waiting folders.\n 1213 |     for (const auto folder : FolderMan::instance()->map()) {\n 1214 |         slotFolderSyncStateChange(folder);\n 1215 |     }\n 1216 | }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderstatusmodel.cpp#L1210-L1216"},{"ref":"src/gui/folderstatusmodel.cpp:1184-1194","code":" 1184 |     } else if (state == SyncResult::NotYetStarted) {\n 1185 |         const auto folderMan = FolderMan::instance();\n 1186 |         auto pos = folderMan->scheduleQueue().indexOf(folder);\n 1187 |         for (auto other : folderMan->map()) {\n 1188 |             if (other != folder && other->isSyncRunning()) {\n 1189 |                 pos += 1;\n 1190 |             }\n 1191 |         }\n 1192 |         const auto message = pos <= 0 ? tr(\"About to start syncing\") : tr(\"Waiting for %n other folder(s) …\", \"\", pos);\n 1193 |         pi = SubFolderInfo::Progress();\n 1194 |         pi._overallSyncString = message;","lines":11,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderstatusmodel.cpp#L1184-L1194"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"ClientSideEncryptionTokenSelector::discoverCertificates() calls std::sort on _discoveredCertificates inside the inner per-certificate loop, re-sorting the whole list on every insertion (O(n^2 log n) overall). The sort only needs to happen once after all certificates are collected.","fix":"Move the std::sort call outside the loop, after all certificates have been pushed into _discoveredCertificates.","locations":[{"ref":"src/libsync/clientsideencryptiontokenselector.cpp:202-216","code":"  202 |             _discoveredCertificates.push_back(QVariantMap{\n  203 |                                                           {QStringLiteral(\"label\"), QString::fromLatin1(currentCertificate->label)},\n  204 |                                                           {QStringLiteral(\"subject\"), sslCertificate.subjectDisplayName()},\n  205 |                                                           {QStringLiteral(\"issuer\"), sslCertificate.issuerDisplayName()},\n  206 |                                                           {QStringLiteral(\"serialNumber\"), sslCertificate.serialNumber()},\n  207 |                                                           {QStringLiteral(\"validSince\"), sslCertificate.effectiveDate()},\n  208 |                                                           {QStringLiteral(\"validUntil\"), sslCertificate.expiryDate()},\n  209 |                                                           {QStringLiteral(\"sha256Fingerprint\"), certificateDigest},\n  210 |                                                           {QStringLiteral(\"certificate\"), QVariant::fromValue(sslCertificate)},\n  211 |                                                           });\n  212 | \n  213 |             std::sort(_discoveredCertificates.begin(), _discoveredCertificates.end(), [] (const auto &first, const auto &second) -> bool {\n  214 |                 return first.toMap()[QStringLiteral(\"validSince\")].toDateTime() > second.toMap()[QStringLiteral(\"validSince\")].toDateTime();\n  215 |             });\n  216 |         }","lines":15,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryptiontokenselector.cpp#L202-L216"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"ProcessDirectoryJob::start() recomputes _discoveryData->_noCaseConflictRecordsInDb = caseClashConflictRecordPaths().isEmpty() at the start of every directory job, querying the DB for all case-clash records once per directory during discovery. For deep trees with many directories this repeats an identical DB query that only needs to be evaluated once per sync.","fix":"Compute _noCaseConflictRecordsInDb once when the discovery phase starts (root job) rather than in every ProcessDirectoryJob::start().","locations":[{"ref":"src/libsync/discovery.cpp:77-81","code":"   77 | void ProcessDirectoryJob::start()\n   78 | {\n   79 |     qCInfo(lcDisco) << \"STARTING\" << _currentFolder._server << _queryServer << _currentFolder._local << _queryLocal;\n   80 | \n   81 |     _discoveryData->_noCaseConflictRecordsInDb = _discoveryData->_statedb->caseClashConflictRecordPaths().isEmpty();","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/discovery.cpp#L77-L81"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"DiscoveryPhase::recursiveCheckForDeletedParents() calls _deletedItem.keys() (allocating a full QList copy of all keys) and join()s them into a string on every invocation purely for debug logging, even when the debug category is disabled. recursiveCheckForDeletedParents is called per-file during discovery, so this is a per-item allocation of the entire deleted-items key set plus a string join that runs regardless of logging level.","fix":"Guard the keys()/join() behind lcDiscovery().isDebugEnabled(), and use _deletedItem.contains()/find() directly without materializing all keys.","locations":[{"ref":"src/libsync/discoveryphase.cpp:222-247","code":"  222 | bool DiscoveryPhase::recursiveCheckForDeletedParents(const QString &itemPath) const\n  223 | {\n  224 |     const auto &allKeys = _deletedItem.keys();\n  225 |     qCDebug(lcDiscovery()) << allKeys.join(\", \");\n  226 | \n  227 |     auto result = false;\n  228 |     const auto &pathElements = itemPath.split('/');\n  229 |     auto currentParentFolder = QString{};\n  230 |     for (const auto &onePathComponent : pathElements) {\n  231 |         if (!currentParentFolder.isEmpty()) {\n  232 |             currentParentFolder += '/';\n  233 |         }\n  234 |         currentParentFolder += onePathComponent;\n  235 | \n  236 |         qCDebug(lcDiscovery()) << \"checks\" << currentParentFolder << \"for\" << allKeys.join(\", \");\n  237 |         if (_deletedItem.find(currentParentFolder) == _deletedItem.end()) {\n  238 |             continue;\n  239 |         }\n  240 | \n  241 |         qCDebug(lcDiscovery()) << \"deleted parent found\";\n  242 |         result = true;\n  243 |         break;\n  244 |     }\n  245 | \n  246 |     return result;\n  247 | }","lines":26,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/discoveryphase.cpp#L222-L247"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"SyncEngine::slotItemDiscovered inserts each discovered item into _syncItems using std::lower_bound + vector insert (O(n) shift per insert, O(n^2) total) to keep the vector sorted. For syncs with very large item counts this is a notable cost; items could be appended and sorted once, or a different container used.","fix":"Append items and sort once after discovery (the code already asserts is_sorted later), or use a container with cheaper sorted insertion.","locations":[{"ref":"src/libsync/syncengine.cpp:480-482","code":"  480 |     // Insert sorted\n  481 |     auto it = std::lower_bound( _syncItems.begin(), _syncItems.end(), item ); // the _syncItems is sorted\n  482 |     _syncItems.insert( it, item );","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/syncengine.cpp#L480-L482"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"PlaceHolderInfo's constructor takes an rvalue reference std::vector<char>&& buffer but initializes the member with `_data(buffer)`, which copies (buffer is an lvalue inside the body/init-list) instead of moving. The buffer (placeholder info blob) is needlessly copied even though findPlaceholderInfo passes std::move(buffer).","fix":"Initialize with a move: `: _data(std::move(buffer))`.","locations":[{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:715-718","code":"  715 | OCC::CfApiWrapper::PlaceHolderInfo::PlaceHolderInfo(std::vector<char> &&buffer)\n  716 |     : _data(buffer)\n  717 | {\n  718 | }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L715-L718"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"slotPropfindIterate compares `name == chunkUploadFolderUrl().path()` and slotPropfindFinished/iterate call chunkUploadFolderUrl() repeatedly; each call rebuilds the URL via string concatenation and Utility::concatUrlPath. In the propfind iteration this URL is recomputed for every listed chunk entry.","fix":"Cache chunkUploadFolderUrl() (or its .path()) once per propfind run and reuse it in the iterate callback.","locations":[{"ref":"src/libsync/propagateuploadng.cpp:125-139","code":"  125 | void PropagateUploadFileNG::slotPropfindIterate(const QString &name, const QMap<QString, QString> &properties)\n  126 | {\n  127 |     if (name == chunkUploadFolderUrl().path()) {\n  128 |         return; // skip the info about the path itself\n  129 |     }\n  130 | \n  131 |     bool ok = false;\n  132 |     QString chunkName = name.mid(name.lastIndexOf('/') + 1);\n  133 |     auto chunkId = chunkName.toLongLong(&ok);\n  134 | \n  135 |     if (ok) {\n  136 |         ServerChunkInfo chunkinfo = { properties[\"getcontentlength\"].toLongLong(), chunkName };\n  137 |         _serverChunks[chunkId] = chunkinfo;\n  138 |     }\n  139 | }","lines":15,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagateuploadng.cpp#L125-L139"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"hard","description":"computeRecursiveHydrationAndPinStates recurses over the entire directory tree calling QFileInfo/QDir::entryList and findPlaceholderInfo (which opens a CfAPI handle) for every file on each availability() query. For large sync folders this is an expensive O(tree) filesystem + handle-open walk performed synchronously.","fix":"Consider caching availability/hydration aggregates or limiting recursion depth for interactive availability queries.","locations":[{"ref":"src/libsync/vfs/cfapi/vfs_cfapi.cpp:609-658","code":"  609 | VfsCfApi::HydratationAndPinStates VfsCfApi::computeRecursiveHydrationAndPinStates(const QString &folderPath, const Optional<PinState> &basePinState)\n  610 | {\n  611 |     Q_ASSERT(!folderPath.endsWith('/'));\n  612 |     const auto fullPath = QString{params().filesystemPath + folderPath};\n  613 |     QFileInfo info(params().filesystemPath + folderPath);\n  614 | \n  615 |     if (!FileSystem::fileExists(fullPath)) {\n  616 |         return {};\n  617 |     }\n  618 |     const auto effectivePin = pinState(folderPath);\n  619 |     const auto pinResult = (!effectivePin && !basePinState) ? Optional<PinState>()\n  620 |                          : (!effectivePin || !basePinState) ? PinState::Inherited\n  621 |                          : (*effectivePin == *basePinState) ? *effectivePin\n  622 |                          : PinState::Inherited;\n  623 | \n  624 |     if (FileSystem::isDir(fullPath)) {\n  625 |         const auto dirState = HydratationAndPinStates {\n  626 |             pinResult,\n  627 |             {}\n  628 |         };\n  629 |         const auto dir = QDir(info.absoluteFilePath());\n  630 |         Q_ASSERT(dir.exists());\n  631 |         const auto children = dir.entryList();\n  632 |         return std::accumulate(std::cbegin(children), std::cend(children), dirState, [=, this](const HydratationAndPinStates &currentState, const QString &name) {\n  633 |             if (name == QStringLiteral(\"..\") || name == QStringLiteral(\".\")) {\n  634 |                 return currentState;\n  635 |             }\n  636 | \n  637 |             // if the folderPath.isEmpty() we don't want to end up having path \"/example.file\" because this will lead to double slash later, when appending to \"SyncFolder/\"\n  638 |             const auto path = folderPath.isEmpty() ? name : folderPath + '/' + name;\n  639 |             const auto states = computeRecursiveHydrationAndPinStates(path, currentState.pinState);\n  640 |             return HydratationAndPinStates {\n  641 |                 states.pinState,\n  642 |                 {\n  643 |                     states.hydrationStatus.hasHydrated || currentState.hydrationStatus.hasHydrated,\n  644 |                     states.hydrationStatus.hasDehydrated || currentState.hydrationStatus.hasDehydrated,\n  645 |                 }\n  646 |             };\n  647 |         });\n  648 |     } else { // file case\n  649 |         const auto isDehydrated = isDehydratedPlaceholder(info.absoluteFilePath());\n  650 |         return {\n  651 |             pinResult,\n  652 |             {\n  653 |                 !isDehydrated,\n  654 |                 isDehydrated\n  655 |             }\n  656 |         };\n  657 |     }\n  658 | }","lines":50,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/vfs_cfapi.cpp#L609-L658"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In Flow2Auth::handleResponse() the error-reason if/else chain has an unreachable branch: `else if (jsonParseError.error != NoError || json.isEmpty())` is immediately followed by `else if (json.isEmpty())`. Any case satisfying the second condition was already caught by the first, so the dedicated \"did not contain all expected fields\" message can never be shown.","fix":"Split the conditions: keep `jsonParseError.error != NoError` for the parse-failure message and a separate `json.isEmpty()` branch for the missing-fields message.","locations":[{"ref":"src/gui/creds/flow2auth.cpp:277-285","code":"  277 |         } else if (jsonParseError.error != QJsonParseError::NoError || json.isEmpty()) {\n  278 |             // Could not parse the JSON returned from the server\n  279 |             errorReason = tr(\"We couldn't parse the server response. \"\n  280 |                 \"Please try connecting again later or contact your server administrator if the issue continues.\");\n  281 |         } else if (json.isEmpty()) {\n  282 |             // The reply from the server did not contain all expected fields\n  283 |             errorReason = tr(\"The server did not reply with the expected data. \"\n  284 |                 \"Please try connecting again later or contact your server administrator if the issue continues.\");\n  285 |         }","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/creds/flow2auth.cpp#L277-L285"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"NetworkSettings::saveBWLimitSettings() contains `else if (_account) { useDownloadLimit = -2; }` / `useUploadLimit = -2` branches that can never execute: the download/upload radio buttons live in mutually-exclusive button groups, so exactly one of (limit / noLimit) radio is always checked, meaning the third branch is unreachable. The -2 (LegacyGlobalLimit) value is thus never written from this UI path.","fix":"Remove the unreachable `else if (_account)` branches, or fix the radio-button grouping if a third 'use global' state was actually intended.","locations":[{"ref":"src/gui/networksettings.cpp:206-220","code":"  206 |     if (_ui->downloadLimitRadioButton->isChecked()) {\n  207 |         useDownloadLimit = 1;\n  208 |     } else if (_ui->noDownloadLimitRadioButton->isChecked()) {\n  209 |         useDownloadLimit = 0;\n  210 |     } else if (_account) {\n  211 |         useDownloadLimit = -2;\n  212 |     }\n  213 | \n  214 |     if (_ui->uploadLimitRadioButton->isChecked()) {\n  215 |         useUploadLimit = 1;\n  216 |     } else if (_ui->noUploadLimitRadioButton->isChecked()) {\n  217 |         useUploadLimit = 0;\n  218 |     } else if (_account) {\n  219 |         useUploadLimit = -2;\n  220 |     }","lines":15,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/networksettings.cpp#L206-L220"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"processFileFinalize() has a sanity check built from a chain of '!=' comparisons combined with || that can never be false: (type != VirtualFile || type != VirtualFileDownload || type != VirtualFileDehydration) is always true because a single _type value cannot equal all three at once, so the negation is always false and the qCCritical/Q_ASSERT branch is unreachable dead code. The intended check (warn when type is none of the allowed enum values) is not actually performed.","fix":"Rewrite the condition with && (e.g. !(isDirectory || vfsOn || type==VirtualFile || type==VirtualFileDownload || type==VirtualFileDehydration)) so it actually detects an unexpected type.","locations":[{"ref":"src/libsync/discovery.cpp:1986-1993","code":" 1986 |     if (!(item->isDirectory() ||\n 1987 |           (!_discoveryData->_syncOptions._vfs || _discoveryData->_syncOptions._vfs->mode() != OCC::Vfs::Off) ||\n 1988 |           item->_type != CSyncEnums::ItemTypeVirtualFile ||\n 1989 |           item->_type != CSyncEnums::ItemTypeVirtualFileDownload ||\n 1990 |           item->_type != CSyncEnums::ItemTypeVirtualFileDehydration)) {\n 1991 |         qCCritical(lcDisco()) << \"wong item type for\" << item->_file << item->_type;\n 1992 |         Q_ASSERT(false);\n 1993 |     }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/discovery.cpp#L1986-L1993"}]},
