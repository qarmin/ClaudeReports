<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"Possible null dereference in ActivityListModel::data(). The guard `if (!accountState && _accountState != accountState.data()) return QVariant();` only returns when `accountState` is null AND `_accountState` is non-null. When both `accountState` (lookup by name) and `_accountState` are null, execution falls through and later code dereferences `accountState->account()` (e.g. getFilePath/getDisplayPath via findFileInLocalFolders, and the ActivityIntegrationRole/AccountConnectedRole branches), crashing. The condition does not actually protect the subsequent unconditional `accountState->account()` uses.","fix":"Return early whenever `accountState` is null (`if (!accountState) return QVariant();`) before any `accountState->account()` access.","locations":[{"ref":"src/gui/activity/activitylistmodel.cpp:170-174","code":"  170 |     const auto activity = _finalList.at(index.row());\n  171 |     const auto accountState = AccountManager::instance()->account(activity._accName);\n  172 |     if (!accountState && _accountState != accountState.data()) {\n  173 |         return QVariant();\n  174 |     }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/activity/activitylistmodel.cpp#L170-L174"},{"ref":"src/gui/activity/activitylistmodel.cpp:412-414","code":"  412 |         return QVariant::fromValue(activity);\n  413 |     case ActivityIntegrationRole:\n  414 |         return accountState->account()->serverHasIntegration();","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/activity/activitylistmodel.cpp#L412-L414"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In Folder::startSync, `_folderWatcher->canSetPermissions()` is dereferenced unconditionally. `_folderWatcher` is a QScopedPointer that is only created by registerFolderWatcher(), which bails out early (returns) when the local folder path does not yet exist. FolderMan::slotStartScheduledFolderSync calls registerFolderWatcher() right before startSync(), but if the path does not exist the watcher stays null, so this line null-derefs and crashes. Note the same function null-checks `_folderWatcher` a few lines earlier (line 1210), confirming it can legitimately be null here.","fix":"Guard the call: `_engine->setFilesystemPermissionsReliable(_folderWatcher && _folderWatcher->canSetPermissions());` (or default to false when the watcher is absent).","locations":[{"ref":"src/gui/folder.cpp:1224","code":" 1224 |     _engine->setFilesystemPermissionsReliable(_folderWatcher->canSetPermissions());","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folder.cpp#L1224"},{"ref":"src/gui/folder.cpp:1209-1224","code":" 1209 |     } else if (_folderWatcher && _folderWatcher->isReliable()\n 1210 |         && hasDoneFullLocalDiscovery\n 1211 |         && !periodicFullLocalDiscoveryNow) {\n 1212 |         qCInfo(lcFolder) << \"Allowing local discovery to read from the database\";\n 1213 |         _engine->setLocalDiscoveryOptions(\n 1214 |             LocalDiscoveryStyle::DatabaseAndFilesystem,\n 1215 |             _localDiscoveryTracker->localDiscoveryPaths());\n 1216 |         _localDiscoveryTracker->startSyncPartialDiscovery();\n 1217 |     } else {\n 1218 |         qCInfo(lcFolder) << \"Forbidding local discovery to read from the database\";\n 1219 |         _engine->setLocalDiscoveryOptions(LocalDiscoveryStyle::FilesystemOnly);\n 1220 |         _localDiscoveryTracker->startSyncFullDiscovery();\n 1221 |     }\n 1222 | \n 1223 |     _engine->setIgnoreHiddenFiles(_definition.ignoreHiddenFiles);\n 1224 |     _engine->setFilesystemPermissionsReliable(_folderWatcher->canSetPermissions());","lines":16,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folder.cpp#L1209-L1224"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"SyncConflictsModel::data() and setData() index _conflictData[index.row()] but rowCount() returns _data.size(). _conflictData is (re)built in updateConflictsData(); although it normally mirrors _data (one entry per conflict, including empty placeholders), data() is also gated only by checkIndex against rowCount() which uses _data. If _conflictData and _data ever diverge in size (e.g. updateConflictsData not yet run, or a folder lookup path that pushes fewer entries), the row index can be out of bounds for _conflictData, causing OOB access. The two containers should share a single size source of truth.","fix":"Have rowCount() return _conflictData.size() (the container actually indexed), or assert/guarantee _data.size() == _conflictData.size() and bounds-check index.row() against _conflictData before indexing.","locations":[{"ref":"src/gui/syncconflictsmodel.cpp:21-75","code":"   21 | int SyncConflictsModel::rowCount(const QModelIndex &parent) const\n   22 | {\n   23 |     if (parent.isValid()) {\n   24 |         return 0;\n   25 |     }\n   26 | \n   27 |     return _data.size();\n   28 | }\n   29 | \n   30 | QVariant SyncConflictsModel::data(const QModelIndex &index, int role) const\n   31 | {\n   32 |     auto result = QVariant{};\n   33 | \n   34 |     Q_ASSERT(checkIndex(index, CheckIndexOption::IndexIsValid | CheckIndexOption::ParentIsInvalid));\n   35 | \n   36 |     if (index.parent().isValid()) {\n   37 |         return result;\n   38 |     }\n   39 | \n   40 |     if (role >= static_cast<int>(SyncConflictRoles::ExistingFileName) && role <= static_cast<int>(SyncConflictRoles::ConflictPreviewUrl)) {\n   41 |         const auto convertedRole = static_cast<SyncConflictRoles>(role);\n   42 | \n   43 |         switch (convertedRole) {\n   44 |         case SyncConflictRoles::ExistingFileName:\n   45 |             result = _conflictData[index.row()].mExistingFileName;\n   46 |             break;\n   47 |         case SyncConflictRoles::ExistingSize:\n   48 |             result = _conflictData[index.row()].mExistingSize;\n   49 |             break;\n   50 |         case SyncConflictRoles::ConflictSize:\n   51 |             result = _conflictData[index.row()].mConflictSize;\n   52 |             break;\n   53 |         case SyncConflictRoles::ExistingDate:\n   54 |             result = _conflictData[index.row()].mExistingDate;\n   55 |             break;\n   56 |         case SyncConflictRoles::ConflictDate:\n   57 |             result = _conflictData[index.row()].mConflictDate;\n   58 |             break;\n   59 |         case SyncConflictRoles::ExistingSelected:\n   60 |             result = _conflictData[index.row()].mExistingSelected == ConflictInfo::ConflictSolution::SolutionSelected;\n   61 |             break;\n   62 |         case SyncConflictRoles::ConflictSelected:\n   63 |             result = _conflictData[index.row()].mConflictSelected == ConflictInfo::ConflictSolution::SolutionSelected;\n   64 |             break;\n   65 |         case SyncConflictRoles::ExistingPreviewUrl:\n   66 |             result = _conflictData[index.row()].mExistingPreviewUrl;\n   67 |             break;\n   68 |         case SyncConflictRoles::ConflictPreviewUrl:\n   69 |             result = _conflictData[index.row()].mConflictPreviewUrl;\n   70 |             break;\n   71 |         }\n   72 |     }\n   73 | \n   74 |     return result;\n   75 | }","lines":55,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/syncconflictsmodel.cpp#L21-L75"},{"ref":"src/gui/syncconflictsmodel.cpp:235-274","code":"  235 | void SyncConflictsModel::updateConflictsData()\n  236 | {\n  237 |     _conflictData.clear();\n  238 |     _conflictData.reserve(_data.size());\n  239 | \n  240 |     for (const auto &oneConflict : std::as_const(_data)) {\n  241 |         const auto folder = FolderMan::instance()->folder( p#L235-L274"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Dereference of an error-state Result. When updateMetadata() fails (!result) but the target file does not exist on disk, the first `if (!result && QFileInfo::exists(targetFile))` is skipped, and control falls into the `else if (*result == Vfs::ConvertToPlaceholderResult::Locked)` branch which dereferences `*result` on a Result that holds an error, not a value. This is undefined behaviour / a crash for the (admittedly rare) case where metadata update fails and the renamed target is missing.","fix":"Check `if (!result)` first and handle the error unconditionally (or only dereference *result inside an `else` that is reached only when result holds a value), e.g. `if (!result) { if (QFileInfo::exists(targetFile)) { done(FatalError...); return; } } else if (*result == ...Locked) { ... }`.","locations":[{"ref":"src/libsync/propagateremotemove.cpp:293-300","code":"  293 |     const auto result = propagator()->updateMetadata(newItem);\n  294 |     if (!result && QFileInfo::exists(targetFile)) {\n  295 |         done(SyncFileItem::FatalError, tr(\"Error updating metadata: %1\").arg(result.error()), ErrorCategory::GenericError);\n  296 |         return;\n  297 |     } else if (*result == Vfs::ConvertToPlaceholderResult::Locked) {\n  298 |         done(SyncFileItem::SoftError, tr(\"The file %1 is currently in use\").arg(newItem._file), ErrorCategory::GenericError);\n  299 |         return;\n  300 |     }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagateremotemove.cpp#L293-L300"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"FolderStatusDelegate::sizeHint (line 58) and paint (line 165) call `dynamic_cast<const FolderStatusModel *>(index.model())->classify(index)` without checking the dynamic_cast result. If the view is ever driven by a proxy model or any non-FolderStatusModel, the cast returns nullptr and this crashes. The rest of the file assumes the concrete model unconditionally.","fix":"Null-check the dynamic_cast result and fall back to QStyledItemDelegate default behaviour when it is null.","locations":[{"ref":"src/gui/folderstatusdelegate.cpp:59","code":"   59 |     auto classif = dynamic_cast<const FolderStatusModel *>(index.model())->classify(index);","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderstatusdelegate.cpp#L59"},{"ref":"src/gui/folderstatusdelegate.cpp:176","code":"  176 |     if (dynamic_cast<const FolderStatusModel *>(index.model())->classify(index) != FolderStatusModel::RootFolder) {","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderstatusdelegate.cpp#L176"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"FolderStatusModel::data for the SubFolder case does `static_cast<SubFolderInfo *>(index.internalPointer())->_subs.at(index.row())` with no null check on internalPointer and using QList::at() which asserts/UB on out-of-range index. Elsewhere (infoForIndex) the model carefully bounds-checks index.row() against _subs.size(); this code path does not, so a stale/invalid index (e.g. after model reset while a delegate still references an old index) can read out of bounds.","fix":"Use infoForIndex(index) (which bounds-checks and null-checks) instead of the raw cast + .at(index.row()).","locations":[{"ref":"src/gui/folderstatusmodel.cpp:160-208","code":"  160 |     case SubFolder: {\n  161 |         const auto &subfolderInfo = static_cast<SubFolderInfo *>(index.internalPointer())->_subs.at(index.row());\n  162 |         const auto supportsSelectiveSync = subfolderInfo._folder && subfolderInfo._folder->supportsSelectiveSync();\n  163 | \n  164 |         switch (role) {\n  165 |         case Qt::DisplayRole: {\n  166 |             //: Example text: \"File.txt (23KB)\"\n  167 |             const auto &xParent = static_cast<SubFolderInfo *>(index.internalPointer());\n  168 |             const auto suffix = (subfolderInfo._isNonDecryptable && subfolderInfo._checked && (!xParent || !xParent->isEncrypted()))\n  169 |                 ? QStringLiteral(\" - \") + tr(\"Could not decrypt!\")\n  170 |                 : QString{};\n  171 |             return subfolderInfo._size < 0 ? QString(subfolderInfo._name + suffix) : QString(tr(\"%1 (%2)\").arg(subfolderInfo._name, Utility::octetsToString(subfolderInfo._size)) + suffix);\n  172 |         }\n  173 |         case Qt::ToolTipRole:\n  174 |             return QString(QLatin1String(\"<qt>\") + Utility::escape(subfolderInfo._size < 0 ? subfolderInfo._name : tr(\"%1 (%2)\").arg(subfolderInfo._name, Utility::octetsToString(subfolderInfo._size))) + QLatin1String(\"<\/qt>\"));\n  175 |         case Qt::CheckStateRole:\n  176 |             if (supportsSelectiveSync) {\n  177 |                 return subfolderInfo._checked;\n  178 |             } else {\n  179 |                 return {};\n  180 |             }\n  181 |         case Qt::DecorationRole: {\n  182 |             if (subfolderInfo._isNonDecryptable && subfolderInfo._checked) {\n  183 |                 return QIcon(QLatin1String(\":/client/theme/lock-broken.svg\"));\n  184 |             }\n  185 |             if (subfolderInfo.isEncrypted()) {\n  186 |                 return QIcon(QLatin1String(\":/client/theme/lock-https.svg\"));\n  187 |             } else if (subfolderInfo._size > 0 && isAnyAncestorEncrypted(index)) {\n  188 |                 return QIcon(QLatin1String(\":/client/theme/lock-broken.svg\"));\n  189 |             }\n  190 |             return _fileIconProvider.icon(subfolderInfo._isExternal ? QFileIconProvider::Network : QFileIconProvider::Folder);\n  191 |         }\n  192 |         case Qt::ForegroundRole:\n  193 |             if (subfolderInfo._isUndecided || (subfolderInfo._isNonDecryptable && subfolderInfo._checked)) {\n  194 |                 return QColor(Qt::red);\n  195 |             }\n  196 |             break;\n  197 |         case FileIdRole:\n  198 |             return subfolderInfo._fileId;\n  199 |         case FolderStatusDelegate::FolderPathRole:\n  200 |         {\n  201 |             if (const auto folder = subfolderInfo._folder) {\n  202 |                 return {folder->path() + subfolderInfo._path};\n  203 |             }\n  204 |             return {};\n  205 |         }\n  206 |         }\n  207 |         return {};\n  208 |     }","lines":49,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderstatusmodel.cpp#L160-L208"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"FileActionsModel::createRequest(int row) and processRequest() index _fileActions.at(row) with a row that comes from QML / a stored job property. createRequest is Q_INVOKABLE from QML so an out-of-range row is undefined behaviour. More realistically, parseEndpoints()/resetActions() can clear or shrink _fileActions while a JsonApiJob created by createRequest() is still in flight; when the reply arrives processRequest() reads sender()->property(rowC) and calls _fileActions.at(row) with a now-stale index, causing OOB access/crash.","fix":"Bounds-check row against _fileActions.size() in createRequest and processRequest; capture the needed action data by value when starting the job instead of re-indexing after the async reply.","locations":[{"ref":"src/gui/integration/fileactionsmodel.cpp:344-366","code":"  344 | void FileActionsModel::createRequest(const int row)\n  345 | {\n  346 |     if (!_accountState) {\n  347 |         qCWarning(lcFileActions) << \"No account state for\"\n  348 |                                  << _localPath;\n  349 |         return;\n  350 |     }\n  351 | \n  352 |     auto job = new JsonApiJob(_accountState->account(),\n  353 |                                 _fileActions.at(row).url,\n  354 |                                 this);\n  355 |     connect(job, &JsonApiJob::jsonReceived,\n  356 |             this, &FileActionsModel::processRequest);\n  357 |     for (const auto &param : std::as_const(_fileActions.at(row).params)) {\n  358 |         QUrlQuery query;\n  359 |         query.addQueryItem(param.name, param.value);\n  360 |         job->addQueryParams(query);\n  361 |     }\n  362 |     const auto verb = job->stringToVerb(_fileActions.at(row).method);\n  363 |     job->setVerb(verb);\n  364 |     job->setProperty(rowC, row);\n  365 |     job->start();\n  366 | }","lines":23,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/integration/fileactionsmodel.cpp#L344-L366"},{"ref":"src/gui/integration/fileactionsmodel.cpp:368-371","code":"  368 | void FileActionsModel::processRequest(const QJsonDocument &json, int statusCode)\n  369 | {\n  370 |     const auto row = sender()->property(rowC).toInt();\n  371 |     const auto fileAction = _fileActions.at(row).name;","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/integration/fileactionsmodel.cpp#L368-L371"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"getDirectEditorForLocalFile() dereferences fileData.folder->accountState()->account() on the very first line, BEFORE the null check `if (fileData.folder ...)` on the next line. FileData::get() returns a FileData with folder == nullptr for any path outside a sync root, so calling this with such a path is an immediate null-pointer dereference. The null check that follows is misordered/dead. Current callers (command_EDIT, command_GET_MENU_ITEMS) happen to guard folder beforehand, but the function is unsafe by itself and reachable via untrusted local socket input.","fix":"Move the capabilities lookup inside the `if (fileData.folder && fileData.folder->accountState()->isConnected())` block, after the null check.","locations":[{"ref":"src/gui/socketapi/socketapi.cpp:1567-1572","code":" 1567 | DirectEditor* SocketApi::getDirectEditorForLocalFile(const QString &localFile)\n 1568 | {\n 1569 |     FileData fileData = FileData::get(localFile);\n 1570 |     auto capabilities = fileData.folder->accountState()->account()->capabilities();\n 1571 | \n 1572 |     if (fileData.folder && fileData.folder->accountState()->isConnected()) {","lines":6,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/socketapi/socketapi.cpp#L1567-L1572"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"EncryptedFolderMetadataHandler::slotFolderEncryptedIdReceived() calls list.first() and indexes job->_folderInfos.value(list.first()) without checking that the directoryListingSubfolders list is non-empty. An empty PROPFIND result (e.g. server returns no subfolders) triggers undefined behaviour / crash on QStringList::first().","fix":"Guard for `list.isEmpty()` (and a null `job`) and emit fetchFinished with an error before accessing list.first().","locations":[{"ref":"src/libsync/encryptedfoldermetadatahandler.cpp:144-151","code":"  144 | void EncryptedFolderMetadataHandler::slotFolderEncryptedIdReceived(const QStringList &list)\n  145 | {\n  146 |     qCDebug(lcFetchAndUploadE2eeFolderMetadataJob) << \"Received id of folder. Fetching metadata...\";\n  147 |     const auto job = qobject_cast<LsColJob *>(sender());\n  148 |     const auto &folderInfo = job->_folderInfos.value(list.first());\n  149 |     _folderId = folderInfo.fileId;\n  150 |     startFetchMetadata();\n  151 | }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/encryptedfoldermetadatahandler.cpp#L144-L151"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"Theme::wizardApplicationLogo() in the non-custom-logo branded branch contains 'const auto size = Theme::isHidpi() ?: 200 : 100;' which is a malformed conditional expression (GNU elvis ?: followed by a dangling : 100). This does not compile when built branded without APPLICATION_WIZARD_USE_CUSTOM_LOGO; the intent was a normal ternary 'isHidpi() ? 200 : 100'.","fix":"Replace with: const auto size = Theme::isHidpi() ? 200 : 100;","locations":[{"ref":"src/libsync/theme.cpp:811","code":"  811 |     const auto size = Theme::isHidpi() ?: 200 : 100;","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/theme.cpp#L811"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"VfsCfApi::createPlaceholders dereferences items[0] without first checking that the list is non-empty. An empty items list (a callable public API) causes an out-of-bounds QList access and a crash.","fix":"Guard at the top: `if (items.isEmpty()) { return {}; }` before accessing items[0].","locations":[{"ref":"src/libsync/vfs/cfapi/vfs_cfapi.cpp:214-216","code":"  214 | Result<void, QString> VfsCfApi::createPlaceholders(const QList<SyncFileItemPtr> &items)\n  215 | {\n  216 |     const auto fileInfo = QFileInfo(_setupParams.filesystemPath + items[0]->_file);","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/vfs_cfapi.cpp#L214-L216"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"xattrGet resizes the result to count-1 unconditionally. getxattr returns the raw byte length; if an attribute has a zero-length value (count == 0), QByteArray::resize(-1) is invoked, which is invalid and aborts/asserts. The -1 also silently assumes every stored value is null-terminated (only true for values written by this codebase via xattrSet).","fix":"Clamp the new size: `result.resize(count > 0 ? static_cast<int>(count) - 1 : 0);` and only subtract 1 when a trailing NUL is actually expected.","locations":[{"ref":"src/libsync/vfs/xattr/xattrwrapper_linux.cpp:24-27","code":"   24 |     const auto count = getxattr(path.constData(), name.constData(), result.data(), bufferSize);\n   25 |     if (count >= 0) {\n   26 |         result.resize(static_cast<int>(count) - 1);\n   27 |         return result;","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/xattr/xattrwrapper_linux.cpp#L24-L27"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"WebFlowCredentials::slotReadPasswordJobDone() does `auto job = qobject_cast<ReadPasswordJob*>(incomingJob); QKeychain::Error error = job->error();` with no null check. If the finished signal ever originates from a Job that is not a ReadPasswordJob the cast yields nullptr and job->error() dereferences null. Same unchecked-cast pattern appears in InvalidFilenameDialog::onMoveJobFinished (qobject_cast<MoveJob*>(sender())->reply()).","fix":"Null-check the qobject_cast result before dereferencing.","locations":[{"ref":"src/gui/creds/webflowcredentials.cpp:520-522","code":"  520 | void WebFlowCredentials::slotReadPasswordJobDone(Job *incomingJob) {\n  521 |     auto job = qobject_cast<ReadPasswordJob *>(incomingJob);\n  522 |     QKeychain::Error error = job->error();","lines":3,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/creds/webflowcredentials.cpp#L520-L522"},{"ref":"src/gui/invalidfilenamedialog.cpp:256-259","code":"  256 | void InvalidFilenameDialog::onMoveJobFinished()\n  257 | {\n  258 |     const auto job = qobject_cast<MoveJob *>(sender());\n  259 |     const auto error = job->reply()->error();","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/invalidfilenamedialog.cpp#L256-L259"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"AsyncImageResponse constructor calls `idSplit.last()` after splitting `id` with Qt::SkipEmptyParts. If `id` is non-empty but contains only '/' characters, idSplit is empty and last() dereferences past the end (QList::last on empty list is undefined behavior / assert). The empty-id case is handled earlier but the all-separators case is not.","fix":"Guard with `if (!idSplit.isEmpty())` before calling idSplit.last().","locations":[{"ref":"src/gui/tray/asyncimageresponse.cpp:38-45","code":"   38 |     auto actualId = id;\n   39 |     const auto idSplit = id.split('/'_L1, Qt::SkipEmptyParts);\n   40 |     const auto color = QColor(idSplit.last());\n   41 | \n   42 |     if(color.isValid()) {\n   43 |         _svgRecolor = color;\n   44 |         actualId.remove(\"/\" % idSplit.last());\n   45 |     }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/tray/asyncimageresponse.cpp#L38-L45"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"OCUpdater network reply slots qobject_cast<QNetworkReply*>(sender()) and then dereference the result without a null check (slotVersionInfoArrived calls reply->error()/readAll after reply->deleteLater(); slotDownloadFinished and slotWriteFile likewise). If ever invoked with a non-reply sender these are null derefs. slotWriteFile also assumes _file is non-null.","fix":"Guard each qobject_cast result (and _file) before use.","locations":[{"ref":"src/gui/updater/ocupdater.cpp:261-271","code":"  261 | void OCUpdater::slotVersionInfoArrived()\n  262 | {\n  263 |     qCDebug(lcUpdater) << \"received a reply\";\n  264 |     _timeoutWatchdog->stop();\n  265 |     auto *reply = qobject_cast<QNetworkReply *>(sender());\n  266 |     reply->deleteLater();\n  267 |     if (reply->error() != QNetworkReply::NoError) {\n  268 |         qCWarning(lcUpdater) << \"Failed to reach version check url: \" << reply->errorString();\n  269 |         setDownloadState(DownloadTimedOut);\n  270 |         return;\n  271 |     }","lines":11,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/updater/ocupdater.cpp#L261-L271"},{"ref":"src/gui/updater/ocupdater.cpp:297-303","code":"  297 | void NSISUpdater::slotWriteFile()\n  298 | {\n  299 |     auto *reply = qobject_cast<QNetworkReply *>(sender());\n  300 |     if (_file->isOpen()) {\n  301 |         _file->write(reply->readAll());\n  302 |     }\n  303 | }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/updater/ocupdater.cpp#L297-L303"},{"ref":"src/gui/updater/ocupdater.cpp:314-321","code":"  314 | void NSISUpdater::slotDownloadFinished()\n  315 | {\n  316 |     auto *reply = qobject_cast<QNetworkReply *>(sender());\n  317 |     reply->deleteLater();\n  318 |     if (reply->error() != QNetworkReply::NoError) {\n  319 |         setDownloadState(DownloadFailed);\n  320 |         return;\n  321 |     }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/updater/ocupdater.cpp#L314-L321"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"HttpLogger::requestVerb() falls through to Q_UNREACHABLE() for QNetworkAccessManager::UnknownOperation. If a reply is ever created/logged with UnknownOperation, this aborts the process (in release Q_UNREACHABLE is UB). UnknownOperation is a real enum value that Qt may report.","fix":"Return an empty/placeholder QByteArray for UnknownOperation instead of Q_UNREACHABLE().","locations":[{"ref":"src/libsync/httplogger.cpp:124-128","code":"  124 |     case QNetworkAccessManager::UnknownOperation:\n  125 |         break;\n  126 |     }\n  127 |     Q_UNREACHABLE();\n  128 | }","lines":5,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/httplogger.cpp#L124-L128"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"pathForHandle asserts result < MAX_PATH but does not handle the failure case: GetFinalPathNameByHandle returns 0 on error or a value >= MAX_PATH if the buffer is too small, in which case `buffer` is not null-terminated and std::wstring(buffer) reads out of bounds. In release builds (asserts disabled) this is an OOB read.","fix":"Check the return value: if it is 0 or >= MAX_PATH, return an empty string (or retry with a larger buffer) instead of constructing the wstring.","locations":[{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:662-668","code":"  662 | std::wstring pathForHandle(const OCC::CfApiWrapper::FileHandle &handle)\n  663 | {\n  664 |     wchar_t buffer[MAX_PATH];\n  665 |     const qint64 result = GetFinalPathNameByHandle(handle.get(), buffer, MAX_PATH, VOLUME_NAME_DOS);\n  666 |     Q_ASSERT(result < MAX_PATH);\n  667 |     return std::wstring(buffer);\n  668 | }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L662-L668"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"PlaceHolderInfo::pinState() contains `if (!this) return {};`, which is undefined behavior: calling a non-static member function through a null pointer is UB before the check can execute, and modern compilers may optimize the check away. The function is also effectively dead within this slice (callers read info->PinState directly after an explicit `if (info)` check), so the null-this guard is both unsafe and unnecessary.","fix":"Remove the `if (!this)` check; callers must verify the PlaceHolderInfo via operator bool() before calling pinState().","locations":[{"ref":"src/libsync/vfs/cfapi/cfapiwrapper.cpp:720-727","code":"  720 | OCC::Optional<OCC::PinState> OCC::CfApiWrapper::PlaceHolderInfo::pinState() const\n  721 | {\n  722 |     if (!this) {\n  723 |         return {};\n  724 |     }\n  725 | \n  726 |     return cfPinStateToPinState(get()->PinState);\n  727 | }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/cfapiwrapper.cpp#L720-L727"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"AccountState::checkConnectivity() constructs `ConnectionValidator(AccountStatePtr(this), ...)`. AccountState derives from QSharedData and is normally owned via QExplicitlySharedDataPointer (AccountStatePtr). Wrapping the raw `this` in a fresh AccountStatePtr creates a second, independent refcount over the same object. When that temporary AccountStatePtr chain (held by ConnectionValidator) drops its last reference, it can delete the AccountState even though AccountManager still holds it via its own AccountStatePtr, leading to a double-free / use-after-free of the AccountState.","fix":"Do not synthesize a new AccountStatePtr from raw `this`. Pass the existing shared pointer (e.g. obtained from AccountManager) or change ConnectionValidator to take a QPointer/raw AccountState* that it does not own.","locations":[{"ref":"src/gui/accountstate.cpp:322-323","code":"  322 |     auto *conValidator = new ConnectionValidator(AccountStatePtr(this), _connectionErrors);\n  323 |     _connectionValidator = conValidator;","lines":2,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/accountstate.cpp#L322-L323"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"CloudProviderWrapper shares a single global `actionGroup` (file-scope static) across all instances. getActionGroup() does g_clear_object(&actionGroup) and recreates it bound to `this`, and slotSyncPausedChanged() operates on that global. With more than one sync folder, every wrapper's actions/state target the LAST-created wrapper. Worse, the destructor does g_object_unref(actionGroup); actionGroup = nullptr — so destroying one wrapper releases and nulls the GObject still referenced by the others, then their own destructors call g_object_unref(nullptr) / operate on a freed object.","fix":"Make the GSimpleActionGroup a per-instance member (e.g. _actionGroup) instead of a global, create/own/unref it per wrapper, and reference the per-instance group in slotSyncPausedChanged().","locations":[{"ref":"src/gui/cloudproviders/cloudproviderwrapper.cpp:26","code":"   26 | GSimpleActionGroup *actionGroup = nullptr;","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/cloudproviders/cloudproviderwrapper.cpp#L26"},{"ref":"src/gui/cloudproviders/cloudproviderwrapper.cpp:65-72","code":"   65 | CloudProviderWrapper::~CloudProviderWrapper()\n   66 | {\n   67 |     g_object_unref(_cloudProviderAccount);\n   68 |     g_object_unref(_mainMenu);\n   69 |     g_object_unref(actionGroup);\n   70 |     actionGroup = nullptr;\n   71 |     g_object_unref(_recentMenu);\n   72 | }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/cloudproviders/cloudproviderwrapper.cpp#L65-L72"},{"ref":"src/gui/cloudproviders/cloudproviderwrapper.cpp:370-388","code":"  370 | GActionGroup* CloudProviderWrapper::getActionGroup()\n  371 | {\n  372 |     g_clear_object (&actionGroup);\n  373 |     actionGroup = g_simple_action_group_new ();\n  374 |     g_action_map_add_action_entries (G_ACTION_MAP (actionGroup), actions, G_N_ELEMENTS (actions), this);\n  375 |     bool state = _folder->syncPaused();\n  376 |     GAction *pause = g_action_map_lookup_action(G_ACTION_MAP(actionGroup), \"pause\");\n  377 |     g_simple_action_set_state(G_SIMPLE_ACTION(pause), g_variant_new_boolean(state));\n  378 |     return G_ACTION_GROUP (g_object_ref (actionGroup));\n  379 | }\n  380 | \n  381 | void CloudProviderWrapper::slotSyncPausedChanged(Folder *folder, bool state)\n  382 | {\n  383 |     Q_UNUSED(folder);\n  384 |     _paused = state;\n  385 |     GAction *pause = g_action_map_lookup_action(G_ACTION_MAP(actionGroup), \"pause\");\n  386 |     g_simple_action_set_state (G_SIMPLE_ACTION(pause), g_variant_new_boolean(state));\n  387 |     updatePauseStatus();\n  388 | }","lines":19,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/cloudproviders/cloudproviderwrapper.cpp#L370-L388"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"In VfsCfApi::createPlaceholders the local fileInfo is std::move'd into emplace_back as the first argument while fileInfo.fileName() and QDir::toNativeSeparators(fileInfo.fileName()) are read as later arguments to the same call. The order of evaluation of function arguments is unspecified in C++, so fileInfo may already be moved-from (left in a valid-but-unspecified state) when fileName() is read. This can produce empty/garbage relative file names and native paths for placeholders, corrupting the on-demand population entries.","fix":"Compute the dependent values into named locals before the move, e.g. `auto name = fileInfo.fileName(); auto nativeName = QDir::toNativeSeparators(name).toStdWString(); allPlaceholdersInfo.emplace_back(std::move(fileInfo), name, std::move(nativeName), ...);`","locations":[{"ref":"src/libsync/vfs/cfapi/vfs_cfapi.cpp:220-223","code":"  220 |     for (const auto &oneItem : items) {\n  221 |         auto fileInfo = QFileInfo(_setupParams.filesystemPath + oneItem->_file);\n  222 |         allPlaceholdersInfo.emplace_back(std::move(fileInfo), fileInfo.fileName(), QDir::toNativeSeparators(fileInfo.fileName()).toStdWString(), oneItem->_fileId, oneItem->_modtime, oneItem->_size);\n  223 |     }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/vfs_cfapi.cpp#L220-L223"}]},
{"id":"UAF_4","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"Folder::slotFilesLockReleased connects two one-shot lambdas to Account::lockFileSuccess and Account::lockFileError. The success lambda only `disconnect(_officeFileLockReleaseUnlockSuccess)` — it never disconnects the failure connection, and the failure lambda only disconnects itself. So after a successful unlock the failure connection lingers and will fire on the next unrelated lockFileError, calling a stale captured `remoteFilePath`. Compare slotLockedFilesFound (lines 820-830) which correctly disconnects BOTH connections in each lambda.","fix":"In each lambda disconnect both _officeFileLockReleaseUnlockSuccess and _officeFileLockReleaseUnlockFailure, mirroring slotLockedFilesFound.","locations":[{"ref":"src/gui/folder.cpp:773-781","code":"  773 |         _officeFileLockReleaseUnlockSuccess = connect(_accountState->account().data(), &Account::lockFileSuccess, this, [this, remoteFilePath]() {\n  774 |             disconnect(_officeFileLockReleaseUnlockSuccess);\n  775 |             qCDebug(lcFolder) << \"Unlocking an office file succeeded\" << remoteFilePath;\n  776 |             startSync();\n  777 |         });\n  778 |         _officeFileLockReleaseUnlockFailure = connect(_accountState->account().data(), &Account::lockFileError, this, [this, remoteFilePath](const QString &message) {\n  779 |             disconnect(_officeFileLockReleaseUnlockFailure);\n  780 |             qCWarning(lcFolder) << \"Failed to unlock a file:\" << remoteFilePath << message;\n  781 |         });","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folder.cpp#L773-L781"}]},
{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"very_easy","description":"ClientStatusReportingDatabase::deleteClientStatusReportingRecords() is the only DB accessor that does NOT take QMutexLocker(&_mutex), unlike getClientStatusReportingRecords/setClientStatusReportingRecord/get/setStatusNamesHash. It executes a DELETE on the shared default QSqlDatabase connection and is called from reportToServerSentSuccessfully() (network reply callback) and updateStatusNamesHash(), which can race with concurrently-locked readers/writers on the same connection.","fix":"Add QMutexLocker locker(&_mutex); at the start of deleteClientStatusReportingRecords().","locations":[{"ref":"src/libsync/clientstatusreportingdatabase.cpp:89-98","code":"   89 | Result<void, QString> ClientStatusReportingDatabase::deleteClientStatusReportingRecords() const\n   90 | {\n   91 |     QSqlQuery query;\n   92 |     if (!query.prepare(QStringLiteral(\"DELETE FROM clientstatusreporting\")) || !query.exec()) {\n   93 |         const auto errorMessage = query.lastError().text();\n   94 |         qCWarning(lcClientStatusReportingDatabase) << \"Could not delete records from clientstatusreporting:\" << errorMessage;\n   95 |         return errorMessage;\n   96 |     }\n   97 |     return {};\n   98 | }","lines":10,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientstatusreportingdatabase.cpp#L89-L98"}]},
{"id":"RACE_2","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"medium","description":"TOCTOU in maybeMigrateDb(): each old DB file (db, -wal, -shm) is checked for existence (FileSystem::fileExists) and unconditionally renamed afterwards. The main db existence is checked but the -wal/-shm old files are renamed without verifying they exist; if the old -wal/-shm files do not exist (common when WAL was checkpointed), FileSystem::rename will fail and the whole migration aborts returning false, even though the migration of the main db already succeeded. This leaves migration half-done.","fix":"Only attempt to rename the -wal/-shm side files if the corresponding old file exists; treat a missing side file as success rather than a hard failure.","locations":[{"ref":"src/common/syncjournaldb.cpp:151-210","code":"  151 | bool SyncJournalDb::maybeMigrateDb(const QString &localPath, const QString &absoluteJournalPath)\n  152 | {\n  153 |     const QString oldDbName = localPath + QLatin1String(\".csync_journal.db\");\n  154 |     if (!FileSystem::fileExists(oldDbName)) {\n  155 |         return true;\n  156 |     }\n  157 |     const QString oldDbNameShm = oldDbName + QStringLiteral(\"-shm\");\n  158 |     const QString oldDbNameWal = oldDbName + QStringLiteral(\"-wal\");\n  159 | \n  160 |     const QString newDbName = absoluteJournalPath;\n  161 |     const QString newDbNameShm = newDbName + QStringLiteral(\"-shm\");\n  162 |     const QString newDbNameWal = newDbName + QStringLiteral(\"-wal\");\n  163 | \n  164 |     // Whenever there is an old db file, migrate it to the new db path.\n  165 |     // This is done to make switching from older versions to newer versions\n  166 |     // work correctly even if the user had previously used a new version\n  167 |     // and therefore already has an (outdated) new-style db file.\n  168 |     QString error;\n  169 | \n  170 |     if (FileSystem::fileExists(newDbName)) {\n  171 |         if (!FileSystem::remove(newDbName, &error)) {\n  172 |             qCWarning(lcDb) << \"Database migration: Could not remove db file\" << newDbName\n  173 |                             << \"due to\" << error;\n  174 |             return false;\n  175 |         }\n  176 |     }\n  177 |     if (FileSystem::fileExists(newDbNameWal)) {\n  178 |         if (!FileSystem::remove(newDbNameWal, &error)) {\n  179 |             qCWarning(lcDb) << \"Database migration: Could not remove db WAL file\" << newDbNameWal\n  180 |                             << \"due to\" << error;\n  181 |             return false;\n  182 |         }\n  183 |     }\n  184 |     if (FileSystem::fileExists(newDbNameShm)) {\n  185 |         if (!FileSystem::remove(newDbNameShm, &error)) {\n  186 |             qCWarning(lcDb) << \"Database migration: Could not remove db SHM file\" << newDbNameShm\n  187 |                             << \"due to\" << error;\n  188 |             return false;\n  189 |         }\n  190 |     }\n  191 | \n  192 |     if (!FileSystem::rename(oldDbName, newDbName, &error)) {\n  193 |         qCWarning(lcDb) << \"Database migration: could not rename\" << oldDbName\n  194 |                         << \"to\" << newDbName << \":\" << error;\n  195 |         return false;\n  196 |     }\n  197 |     if (!FileSystem::rename(oldDbNameWal, newDbNameWal, &error)) {\n  198 |         qCWarning(lcDb) << \"Database migration: could not rename\" << oldDbNameWal\n  199 |                         << \"to\" << newDbNameWal << \":\" << error;\n  200 |         return false;\n  201 |     }\n  202 |     if (!FileSystem::rename(oldDbNameShm, newDbNameShm, &error)) {\n  203 |         qCWarning(lcDb) << \"Database migration: could not rename\" << oldDbNameShm\n  204 |                         << \"to\" << newDbNameShm << \":\" << error;\n  205 |         return false;\n  206 |     }\n  207 | \n  208 |     qCInfo(lcDb) << \"Journal successfully migrated from\" << oldDbName << \"to\" << newDbName;\n  209 |     return true;\n  210 | }","lines":60,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/syncjournaldb.cpp#L151-L210"}]},
{"id":"RACE_3","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"very_easy","description":"WatcherThread::watchChanges (Windows) declares `OVERLAPPED overlapped;` on the stack and only sets `overlapped.hEvent`. The remaining fields (Internal, InternalHigh, Offset, OffsetHigh) are left uninitialized. ReadDirectoryChangesW requires the Offset/OffsetHigh fields to be zero for directory change reads; passing garbage is undefined behavior and can cause missed or corrupted notifications.","fix":"Zero-initialize the structure: `OVERLAPPED overlapped{};` then set hEvent.","locations":[{"ref":"src/gui/folderwatcher_win.cpp:46-47","code":"   46 |     OVERLAPPED overlapped;\n   47 |     overlapped.hEvent = _resultEvent;","lines":2,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderwatcher_win.cpp#L46-L47"}]},
{"id":"RACE_4","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"medium","description":"ClientSideEncryption::sslEngine() returns ENGINE_get_default_RSA() and the result is passed to PKeyCtx::forKey without ever calling ENGINE_finish/ENGINE_free. ENGINE_get_default_RSA increments the engine's structural/functional reference count; repeatedly fetching it for each asymmetric encrypt/decrypt leaks engine references over the lifetime of the process.","fix":"Cache the engine once, or release the reference (ENGINE_finish/ENGINE_free) after use; verify reference-count semantics of ENGINE_get_default_RSA in the targeted OpenSSL version.","locations":[{"ref":"src/libsync/clientsideencryption.cpp:982-985","code":"  982 | ENGINE* ClientSideEncryption::sslEngine() const\n  983 | {\n  984 |     return ENGINE_get_default_RSA();\n  985 | }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/clientsideencryption.cpp#L982-L985"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In FolderMan::slotWipeFolderForAccount, folders are unloaded via unloadFolder(f) but only deleted `if (currentlyRunning)`. For folders that are NOT the current running sync folder (the common case), `f` is removed from the map but never deleted, leaking the Folder QObject and its SyncEngine/journal/watcher resources. Contrast with removeFolder() which deletes non-running folders directly.","fix":"Delete (or deleteLater) the folder in the non-running branch as well, mirroring removeFolder().","locations":[{"ref":"src/gui/folderman.cpp:1702-1705","code":" 1702 |         unloadFolder(f);\n 1703 |         if (currentlyRunning) {\n 1704 |             delete f;\n 1705 |         }","lines":4,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/folderman.cpp#L1702-L1705"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"FileProviderXPC is double-allocated. `_xpc = std::make_unique<FileProviderXPC>(new FileProviderXPC(this));` constructs an inner `FileProviderXPC(this)` and passes its pointer as the `QObject *parent` argument of the outer FileProviderXPC. This creates two FileProviderXPC objects (the inner one is leaked/owned only as the parent of the outer, inverting the intended parent relationship) instead of one parented to the FileProvider instance.","fix":"Construct a single object with the correct parent: `_xpc = std::make_unique<FileProviderXPC>(this);`.","locations":[{"ref":"src/gui/macOS/fileprovider_mac.mm:69","code":"   69 |     _xpc = std::make_unique<FileProviderXPC>(new FileProviderXPC(this));","lines":1,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/macOS/fileprovider_mac.mm#L69"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"Objective-C retain leak in processClientCommunicationConnections(). The remote service object is retained with `[clientCommService retain]`, but if the subsequent getFileProviderDomainIdentifier() returns nil the code `continue`s to the next connection without ever releasing clientCommService, leaking the retained object. The other early-`continue` (clientCommService == nil) is fine because retain happens after it, but the domainIdentifier == nil path leaks.","fix":"Release before continuing on the nil-domainIdentifier path, e.g. add `[clientCommService release];` immediately before the `continue;` at line 285.","locations":[{"ref":"src/gui/macOS/fileproviderxpc_mac_utils.mm:293-300","code":"  293 |         [clientCommService retain];\n  294 | \n  295 |         const auto domainIdentifier = getFileProviderDomainIdentifier(clientCommService);\n  296 | \n  297 |         if (domainIdentifier == nil) {\n  298 |             qCWarning(lcFileProviderXPCUtils) << \"Could not retrieve domain id from file provider service\";\n  299 |             continue;\n  300 |         }","lines":8,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/macOS/fileproviderxpc_mac_utils.mm#L293-L300"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In hBitmapAndAlphaTypeFromData the Gdiplus::Bitmap returned by Bitmap::FromStream is never deleted, and the IStream returned by SHCreateMemStream is never Released. Both leak on every thumbnail request. The leak occurs on every code path (success and the GetHBITMAP-failure path).","fix":"Wrap the IStream in a smart COM pointer (or call stream->Release()) and `delete gdiPlusBitmap;` before returning on all paths; prefer RAII to also cover the GdiplusShutdown.","locations":[{"ref":"src/libsync/vfs/cfapi/shellext/thumbnailprovider.cpp:64-83","code":"   64 |     const std::vector<unsigned char> bitmapData(thumbnailData.begin(), thumbnailData.end());\n   65 |     auto const stream{::SHCreateMemStream(&bitmapData[0], static_cast<UINT>(bitmapData.size()))};\n   66 | \n   67 |     if (!stream) {\n   68 |         return handleFailure();\n   69 |     }\n   70 |     gdiPlusBitmap = Gdiplus::Bitmap::FromStream(stream);\n   71 | \n   72 |     auto hasAlpha = false;\n   73 |     HBITMAP hBitmap = NULL;\n   74 |     if (gdiPlusBitmap) {\n   75 |         hasAlpha = Gdiplus::IsAlphaPixelFormat(gdiPlusBitmap->GetPixelFormat());\n   76 |         if (gdiPlusBitmap->GetHBITMAP(Gdiplus::Color(0, 0, 0), &hBitmap) != Gdiplus::Status::Ok) {\n   77 |             return handleFailure();\n   78 |         }\n   79 |     }\n   80 | \n   81 |     Gdiplus::GdiplusShutdown(gdiPlusToken);\n   82 | \n   83 |     return {hBitmap, hasAlpha ? WTSAT_ARGB : WTSAT_RGB};","lines":20,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/shellext/thumbnailprovider.cpp#L64-L83"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"ThumbnailProvider::Initialize obtains the display name via IShellItem::GetDisplayName, which allocates pszName with CoTaskMemAlloc, but never calls CoTaskMemFree(pszName). Leaks the path string each time a thumbnail item is initialized.","fix":"After copying into _shellItemPath, call CoTaskMemFree(pszName); free it on the error path too.","locations":[{"ref":"src/libsync/vfs/cfapi/shellext/thumbnailprovider.cpp:127-135","code":"  127 |     LPWSTR pszName = NULL;\n  128 |     hresult = _shellItem->GetDisplayName(SIGDN_FILESYSPATH, &pszName);\n  129 |     if (FAILED(hresult)) {\n  130 |         return hresult;\n  131 |     }\n  132 | \n  133 |     _shellItemPath = QString::fromWCharArray(pszName);\n  134 | \n  135 |     return S_OK;","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/vfs/cfapi/shellext/thumbnailprovider.cpp#L127-L135"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"ConfigFile::setProxyType() and proxyPassword() create 'new KeychainChunk::WriteJob/ReadJob/DeleteJob(...)' on the heap, call job->exec() synchronously, but never delete the job. Unless KeychainChunk jobs self-delete (they are not parented here and exec() is synchronous), these are leaked on every proxy save/read.","fix":"Wrap jobs in a smart pointer / give them a parent, or delete after exec().","locations":[{"ref":"src/libsync/configfile.cpp:873-882","code":"  873 |             auto job = new KeychainChunk::DeleteJob(keychainProxyPasswordKey());\n  874 |             job->exec();\n  875 |         } else {\n  876 |             // Write password to keychain\n  877 |             auto job = new KeychainChunk::WriteJob(keychainProxyPasswordKey(), pass.toUtf8());\n  878 |             if (job->exec()) {\n  879 |                 // Security: Don't keep password in config file\n  880 |                 settings.remove(QLatin1String(proxyPassC));\n  881 |             }\n  882 |         }","lines":10,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/configfile.cpp#L873-L882"},{"ref":"src/libsync/configfile.cpp:966-977","code":"  966 |         auto job = new KeychainChunk::WriteJob(key, pass.toUtf8());\n  967 |         if (job->exec()) {\n  968 |             QSettings settings(configFile(), QSettings::IniFormat);\n  969 |             settings.remove(QLatin1String(proxyPassC));\n  970 |             qCInfo(lcConfigFile()) << \"Migrated proxy password to keychain\";\n  971 |         }\n  972 |     } else {\n  973 |         // Read password from keychain\n  974 |         auto job = new KeychainChunk::ReadJob(key);\n  975 |         if (job->exec()) {\n  976 |             pass = job->textData();\n  977 |         }","lines":12,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/configfile.cpp#L966-L977"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"medium","description":"AccountManager::loadAccountHelper() starts a QKeychain::ReadPasswordJob to load the proxy password and captures the raw AccountPtr `acc` in the finished-lambda. The job is parented to `this` (AccountManager, a process-lifetime singleton) and is never explicitly cleaned; more importantly the lambda keeps a strong AccountPtr reference to the account for the lifetime of the job. If the account is deleted before the keychain job completes, the job still holds the account alive and writes setProxyPassword into an otherwise-removed account. Combined with the per-account read on every restore, multiple long-lived jobs accumulate on the singleton.","fix":"Use QPointer/weak capture or check account liveness in the lambda, and ensure the ReadPasswordJob auto-deletes; avoid keeping a strong AccountPtr capture for the job's whole lifetime.","locations":[{"ref":"src/gui/accountmanager.cpp:699-712","code":"  699 |     const auto job = new QKeychain::ReadPasswordJob(appName, this);\n  700 |     job->setKey(proxyPasswordKey);\n  701 |     connect(job, &QKeychain::Job::finished, this, [acc](const QKeychain::Job *const incomingJob) {\n  702 |         const auto incomingReadJob = qobject_cast<const QKeychain::ReadPasswordJob *>(incomingJob);\n  703 |         if (incomingReadJob->error() == QKeychain::NoError) {\n  704 |             qCInfo(lcAccountManager) << \"Read proxy password to keychain for\" << acc->userIdAtHostWithPort();\n  705 |             const auto passwordData = incomingReadJob->binaryData();\n  706 |             const auto password = QString::fromUtf8(passwordData);\n  707 |             acc->setProxyPassword(password);\n  708 |         } else {\n  709 |             qCWarning(lcAccountManager) << \"Failed to read proxy password to keychain\" << incomingJob->errorString();\n  710 |         }\n  711 |     });\n  712 |     job->start();","lines":14,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/gui/accountmanager.cpp#L699-L712"}]},
{"id":"RES_2","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"easy","description":"createDownloadTmpFileName uses Utility::rand() % 0xFFFFFFFF to build a unique suffix. rand() returns an int (typically 31-bit positive), so the high bit and the full 32-bit range are never produced, and `% 0xFFFFFFFF` (not 0x100000000) biases/limits the value. The collision space is far smaller than the 8 hex digits suggest, increasing the chance of temporary-file name collisions for parallel downloads of similarly named files.","fix":"Use a wider/better entropy source (e.g. QRandomGenerator::global()->generate() for a full 32-bit value) and mask with 0xFFFFFFFF rather than modulo by 0xFFFFFFFF.","locations":[{"ref":"src/libsync/propagatedownload.cpp:54-60","code":"   54 |     int overhead = 1 + 1 + 2 + 8; // slash dot dot-tilde ffffffff\"\n   55 |     int spaceForFileName = qMin(254, tmpFileName.length() + overhead) - overhead;\n   56 |     if (tmpPath.length() > 0) {\n   57 |         return tmpPath + '/' + '.' + tmpFileName.left(spaceForFileName) + \".~\" + (QString::number(uint(Utility::rand() % 0xFFFFFFFF), 16));\n   58 |     } else {\n   59 |         return '.' + tmpFileName.left(spaceForFileName) + \".~\" + (QString::number(uint(Utility::rand() % 0xFFFFFFFF), 16));\n   60 |     }","lines":7,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/libsync/propagatedownload.cpp#L54-L60"}]},
{"id":"RES_3","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"easy","description":"openAndSeekFileSharedRead (Windows branch): after the QFile successfully adopts the fd, SetFilePointer is called on the raw fileHandle. On failure it sets the error string and returns false, but the QFile (owning the fd/handle) is a caller-provided pointer that remains open. More importantly the early-return paths before file->open close the handle, but once ownership is transferred to QFile, a failed seek returns false while leaving the file open with the file pointer in an undefined position; callers that ignore the bool may read from offset 0. The handle itself is not leaked, but the half-open state on seek failure is mishandled.","fix":"On SetFilePointer failure, explicitly close the QFile (file->close()) before returning false so the caller cannot accidentally use a wrongly-positioned open file.","locations":[{"ref":"src/common/filesystembase.cpp:293-301","code":"  293 |     // Seek to the right spot\n  294 |     auto li = reinterpret_cast<LARGE_INTEGER *>(&seek);\n  295 |     DWORD newFilePointer = SetFilePointer(fileHandle, li->LowPart, &li->HighPart, FILE_BEGIN);\n  296 |     if (newFilePointer == 0xFFFFFFFF && GetLastError() != NO_ERROR) {\n  297 |         error = qt_error_string();\n  298 |         return false;\n  299 |     }\n  300 | \n  301 |     return true;","lines":9,"link":"https://github.com/nextcloud/desktop/blob/8ebaec4178cd25a058c729b0595f2a13dac5352f/src/common/filesystembase.cpp#L293-L301"}]},
{"id":"RES_4","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"Folder::slotFilesLockReleased / slotLockedFilesFound register a new lambda connection on every invocation via member QMetaObject::Connection handles, but these connections are not Qt::UniqueConnection and the disconnect only fires when the signal arrives. If a lock/unlock request never produces lockFileSuccess/lockFileError (e.g. the request is dropped), the connection and its captured state accumulate across repeated lock-state changes.","fix":"Disconnect any prior pending connection before establishing a new one, or use a single persistent slot that looks up state rather than per-call lambdas.","locations":[{"ref":"src/gui/folder.cpp:773-790","code":"  773 |         _officeFileLockReleaseUnlockSuccess = connect(_accountState->account().data(), &Account::lockFileSuccess, this, [this, remoteFilePath]() {\n  774 |             disconnect(_officeFileLockReleaseUnlockSuccess);\n  775 |             qCDebug(lcFolder) << \"Unlocking an office file succeeded\" << remoteFilePath;\n  776 |             startSync();\n  777 |         });\n  778 |         _officeFileLockReleaseUnlockFailure = connect(_accountState->account().data(), &Account::lockFileError, this, [this, remoteFilePath](const QString &message) {\n  779 |             disconnect(_officeFileLockReleaseUnlockFailure);\n  780 |             qCWarning(lcFolder) << \"Failed to unlock a file:\" << remoteFilePath << message;\n  781 |         });\n  782 |         const auto lockOwnerType = static_cast<SyncFileItem::LockOwnerType>(rec._lockstate._lockOwnerType);\n  783 |         _accountState->account()->setLockFileState(remoteFilePath,\n  784 |                                                    remotePathTrailingSlash(),\n  785 |                                                    path(),\n  786 |                                                    rec._etag,\n  787 |
