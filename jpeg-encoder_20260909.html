<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"`encode_image_progressive` produces an invalid JPEG when `set_progressive_scans(scans)` is called with `scans` in 34..=64. With `scans = scans - 1` AC scans and `values_per_scan = 64 / scans`, once `scans-1 >= 33`, `values_per_scan` is 1. The first iteration then computes `start = (0 * 1).max(1) = 1` and `end = 1 * 1 = 1`, so it writes a scan header with `Ss=1, Se=end-1=0` (Ss > Se). Per the JPEG spec (T.81 Annex B) this is illegal and most decoders will reject the file. The public `set_progressive_scans` API accepts values up to 64 (documented), so this is reachable via supported configuration.","fix":"Either tighten the `set_progressive_scans` precondition to scans <= 33 (max 32 AC scans for 64 coefficients), or compute `values_per_scan` with a `max(2)` floor (the first AC band must span at least Ss=1..=Se=1 i.e. 2 indices), or treat the first AC scan specially so that it always spans at least one index. Whatever fix is chosen, also apply to the mirror logic in `optimize_huffman_table` at src/encoder.rs:1122-1162 so the frequency counts match what is actually encoded.","locations":[{"ref":"src/encoder.rs:968-987","code":"  968 |         let scans = scans as usize - 1;\n  969 | \n  970 |         let values_per_scan = 64 / scans;\n  971 | \n  972 |         for scan in 0..scans {\n  973 |             let start = (scan * values_per_scan).max(1);\n  974 |             let end = if scan == scans - 1 {\n  975 |                 // ensure last scan is always transfers the remaining coefficients\n  976 |                 64\n  977 |             } else {\n  978 |                 (scan + 1) * values_per_scan\n  979 |             };\n  980 | \n  981 |             for (i, component) in self.components.iter().enumerate() {\n  982 |                 let restart_interval = self.restart_interval.unwrap_or(0);\n  983 |                 let mut restarts = 0;\n  984 |                 let mut restarts_to_go = restart_interval;\n  985 | \n  986 |                 self.writer\n  987 |                     .write_scan_header(&[component], Some((start as u8, end as u8 - 1)))?;","lines":20,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L968-L987"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`bits[size] += 1` indexes into a fixed `[0u8; 33]` array using the canonical Huffman code size produced by the K.2 algorithm. With 257 input symbols and skewed frequencies (worst case is Fibonacci-like with magnitudes up to u32::MAX), the resulting tree depth can exceed 32, causing an out-of-bounds array access (panic / abort). libjpeg's own implementation uses the same size and explicitly checks for this overflow; this port omits the check. Triggering requires adversarial image content but is theoretically reachable in optimized-huffman mode.","fix":"Either bump `bits` to `[0u32; 257]` (matching libjpeg's MAX_CLEN budget and treating all plausible depths) and clamp afterward, or before the loop assert/error when any `codesize[i] > 32`. The K.3 length-limiting pass that follows already assumes lengths fit in `bits[1..=32]`, so the cleanest fix is to detect the overflow up front and return a default (non-optimized) table when it would happen.","locations":[{"ref":"src/huffman.rs:159-165","code":"  159 |         let mut bits = [0u8; 33];\n  160 | \n  161 |         for &size in codesize.iter() {\n  162 |             if size > 0 {\n  163 |                 bits[size] += 1;\n  164 |             }\n  165 |         }","lines":7,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/huffman.rs#L159-L165"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`while bits[i] == 0 { i -= 1; }` has no underflow guard except a `debug_assert!`. If all entries of `bits` happen to be zero (which would mean the K.2 loop produced no codes at all — possible only when the input frequency array is degenerate, e.g. nothing but the sentinel `freq[256]=1`), then `i` is decremented past 0, wrapping to `usize::MAX` and indexing OOB in release builds. Currently `optimize_huffman_table` always feeds at least one real frequency in addition to the sentinel, so this is not reachable today, but the assertion shows the author was aware of the risk and a future caller change could expose it.","fix":"Replace the `debug_assert!` with a real check that returns the default table (or an error) when no non-zero entries remain instead of underflowing `i`.","locations":[{"ref":"src/huffman.rs:188-192","code":"  188 |         while bits[i] == 0 {\n  189 |             debug_assert!(i > 0, \"Error creating codesizes for frequency {:?}\", freq);\n  190 |             i -= 1;\n  191 |         }\n  192 |         bits[i] -= 1;","lines":5,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/huffman.rs#L188-L192"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`required_data_len = width as usize * height as usize * color_type.get_bytes_per_pixel()` can overflow `usize` on 32-bit targets. With width = height = 65535 and 4 bpp (RGBA/CMYK) the product is ≈ 1.7e10, far above `usize::MAX` on 32-bit. The wrapped, much smaller value then silently passes the `data.len() < required_data_len` check, and downstream `get_block` / `get_line` can read out of bounds of `data`, panicking (or worse, returning garbage if the caller passes an oversize buffer). The crate's MSRV/feature set does not exclude 32-bit targets.","fix":"Use `checked_mul`: `let required = (width as usize).checked_mul(height as usize).and_then(|p| p.checked_mul(bpp)).ok_or(EncodingError::BadImageData{ length: data.len(), required: usize::MAX })?;` and compare against `data.len()` only when the multiplication succeeded.","locations":[{"ref":"src/encoder.rs:478-484","code":"  478 |         let required_data_len = width as usize * height as usize * color_type.get_bytes_per_pixel();\n  479 | \n  480 |         if data.len() < required_data_len {\n  481 |             return Err(EncodingError::BadImageData {\n  482 |                 length: data.len(),\n  483 |                 required: required_data_len,\n  484 |             });","lines":7,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L478-L484"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"On 32-bit targets `BUFFER_SIZE = mem::size_of::<usize>() * 8 = 32`. `write_bits` is called with `size` up to 32 (Huffman code 16 bits + DC/AC extension bits up to 16). When the buffer is full and a full-width (size = 32) write happens, `self.bit_buffer << (size + free_bits)` becomes `<< 0` and `value >> -free_bits` becomes `value >> 32` on a `usize` that is 32 bits wide — this is a shift-by-bit-width which Rust panics on in debug and gives an implementation-defined result in release (LLVM `poison`). On 64-bit targets the value can never reach 64 with current callers, so this is only a 32-bit hazard.","fix":"Pre-handle the `size == BUFFER_SIZE` case explicitly (flush a full buffer, then store `value` directly) before doing the variable-width shift, or compute the high part with `if -free_bits >= BUFFER_SIZE { 0 } else { value >> -free_bits }`.","locations":[{"ref":"src/writer.rs:186-202","code":"  186 |     pub fn write_bits(&mut self, value: u32, size: u8) -> Result<(), EncodingError> {\n  187 |         let size = size as i8;\n  188 |         let value = value as usize;\n  189 | \n  190 |         let free_bits = self.free_bits - size;\n  191 | \n  192 |         if free_bits < 0 {\n  193 |             self.bit_buffer = (self.bit_buffer << (size + free_bits)) | (value >> -free_bits);\n  194 |             self.write_bit_buffer()?;\n  195 |             self.bit_buffer = value;\n  196 |             self.free_bits = free_bits + BUFFER_SIZE as i8;\n  197 |         } else {\n  198 |             self.free_bits = free_bits;\n  199 |             self.bit_buffer = (self.bit_buffer << size) | value;\n  200 |         }\n  201 |         Ok(())\n  202 |     }","lines":17,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/writer.rs#L186-L202"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`get_num_bits(i16::MIN)` and `get_code(i16::MIN)` both negate the input with `-value` / `value.abs()`, which on i16 overflows for `MIN` (panic in debug, identity wrap in release). The coefficient stream after FDCT and quantization is bounded by ~16k in magnitude, so `i16::MIN` is not reachable from any current code path, but the footgun is unguarded.","fix":"Use widened arithmetic: `let v = (value as i32).unsigned_abs() as u32;` then count bits on that, avoiding the i16 negation entirely.","locations":[{"ref":"src/encoder.rs:1323-1336","code":" 1323 | fn get_num_bits(mut value: i16) -> u8 {\n 1324 |     if value < 0 {\n 1325 |         value = -value;\n 1326 |     }\n 1327 | \n 1328 |     let mut num_bits = 0;\n 1329 | \n 1330 |     while value > 0 {\n 1331 |         num_bits += 1;\n 1332 |         value >>= 1;\n 1333 |     }\n 1334 | \n 1335 |     num_bits\n 1336 | }","lines":14,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L1323-L1336"},{"ref":"src/writer.rs:456-470","code":"  456 | pub(crate) fn get_code(value: i16) -> (u8, u16) {\n  457 |     let temp = value - (value.is_negative() as i16);\n  458 |     let temp2 = value.abs();\n  459 | \n  460 |     /*\n  461 |      * Doing this instead of 16 - temp2.leading_zeros()\n  462 |      * Gives the compiler the information that leadings_zeros\n  463 |      * is always called on a non zero value, which removes a branch on x86\n  464 |      */\n  465 |     let num_bits = 15 - (temp2 << 1 | 1).leading_zeros() as u16;\n  466 | \n  467 |     let coefficient = temp & ((1 << num_bits as usize) - 1);\n  468 | \n  469 |     (num_bits as u8, coefficient as u16)\n  470 | }","lines":15,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/writer.rs#L456-L470"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`Adobe` APP14 segment writes the Version field as `\\0\\0` instead of the conventional `\\x01\\x00` (Adobe's documented \"100\"). Some strict CMYK/YCCK readers may reject or warn on version 0. The ColorTransform byte (last byte) is correct (0 for CMYK, 2 for YCCK).","fix":"Use `b\"Adobe\\x00\\x64\\x00\\x00\\x00\\x00\\x00\"` for CMYK and `b\"Adobe\\x00\\x64\\x00\\x00\\x00\\x00\\x02\"` for YCCK so the Version field is 100 like libjpeg/Photoshop emit.","locations":[{"ref":"src/encoder.rs:571-581","code":"  571 |         if jpeg_color_type == JpegColorType::Cmyk {\n  572 |             //Set ColorTransform info to \"Unknown\"\n  573 |             let app_14 = b\"Adobe\\0\\0\\0\\0\\0\\0\\0\";\n  574 |             self.writer\n  575 |                 .write_segment(Marker::APP(14), app_14.as_ref())?;\n  576 |         } else if jpeg_color_type == JpegColorType::Ycck {\n  577 |             //Set ColorTransform info to YCCK\n  578 |             let app_14 = b\"Adobe\\0\\0\\0\\0\\0\\0\\x02\";\n  579 |             self.writer\n  580 |                 .write_segment(Marker::APP(14), app_14.as_ref())?;\n  581 |         }","lines":11,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L571-L581"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`From<Marker> for u8` does no validation on the embedded `u8`. `RST(v) => 0xD0 + v` silently wraps into other markers when `v > 7` (e.g. RST(8) becomes 0xD8 which is SOI). Likewise `APP(v) => 0xE0 + v` for v > 15 collides with `JPGn`, and `JPGn(v)` with v > 15 wraps past 0xFF. All current internal callers mask via `& 7` or validate, but the type itself accepts illegal values and would emit corrupted JPEGs if a future caller forgot to mask.","fix":"Either change `RST(v)` to `RST(u8 /* 0..=7 */)` with a constructor that masks, or assert/debug_assert `v` is within the legal range inside the `From` impl.","locations":[{"ref":"src/marker.rs:101-111","code":"  101 |             RST(v) => 0xD0 + v,\n  102 |             SOI => 0xD8,\n  103 |             EOI => 0xD9,\n  104 |             SOS => 0xDA,\n  105 |             DQT => 0xDB,\n  106 |             DNL => 0xDC,\n  107 |             DRI => 0xDD,\n  108 |             DHP => 0xDE,\n  109 |             EXP => 0xDF,\n  110 |             APP(v) => 0xE0 + v,\n  111 |             JPGn(v) => 0xF0 + v,","lines":11,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/marker.rs#L101-L111"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment for `add_icc_profile` claims a maximum data length of 16,707,345 bytes (= 255 × 65,519), but the validation `if num_chunks >= 255 { return Err(...) }` rejects exactly 255 chunks, so the true maximum is 254 × 65,519 = 16,641,826 bytes. Anyone right at the documented limit will get an unexpected `IccTooLarge` error.","fix":"Either change the limit check to `> 255` (matching the doc, since chunk indices 1..=255 fit in `u8`), or update the doc to read \"16,641,826 bytes\". The chunk index field is u8 and goes 1..=num_chunks, so 255 chunks is actually representable; the off-by-one rejection is the bug.","locations":[{"ref":"src/encoder.rs:416-448","code":"  416 |     /// Add an ICC profile\n  417 |     ///\n  418 |     /// The maximum allowed data length is 16,707,345 bytes.\n  419 |     ///\n  420 |     /// # Errors\n  421 |     ///\n  422 |     /// Returns an Error if the data exceeds the maximum size for the ICC profile\n  423 |     pub fn add_icc_profile(&mut self, data: &[u8]) -> Result<(), EncodingError> {\n  424 |         // Based on https://www.color.org/ICC_Minor_Revision_for_Web.pdf\n  425 |         // B.4  Embedding ICC profiles in JFIF files\n  426 | \n  427 |         const MARKER: &[u8; 12] = b\"ICC_PROFILE\\0\";\n  428 |         const MAX_CHUNK_LENGTH: usize = 65535 - 2 - 12 - 2;\n  429 | \n  430 |         let num_chunks = data.len().div_ceil(MAX_CHUNK_LENGTH);\n  431 | \n  432 |         // Sequence number is stored as a byte and starts with 1\n  433 |         if num_chunks >= 255 {\n  434 |             return Err(EncodingError::IccTooLarge(data.len()));\n  435 |         }\n  436 | \n  437 |         for (i, data) in data.chunks(MAX_CHUNK_LENGTH).enumerate() {\n  438 |             let mut chunk_data = Vec::with_capacity(MAX_CHUNK_LENGTH);\n  439 |             chunk_data.extend_from_slice(MARKER);\n  440 |             chunk_data.push(i as u8 + 1);\n  441 |             chunk_data.push(num_chunks as u8);\n  442 |             chunk_data.extend_from_slice(data);\n  443 | \n  444 |             self.add_app_segment(2, chunk_data)?;\n  445 |         }\n  446 | \n  447 |         Ok(())\n  448 |     }","lines":33,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L416-L448"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Doc comment for `new_file` says \"Create a new decoder\" but the function returns an `Encoder`. Likely copy-paste from a sibling decoder crate.","fix":"Change \"decoder\" to \"encoder\" in the doc comment.","locations":[{"ref":"src/encoder.rs:1249-1264","code":" 1249 | impl Encoder<BufWriter<File>> {\n 1250 |     /// Create a new decoder that writes into a file\n 1251 |     ///\n 1252 |     /// See [new](Encoder::new) for further information.\n 1253 |     ///\n 1254 |     /// # Errors\n 1255 |     ///\n 1256 |     /// Returns an `IoError(std::io::Error)` if the file can't be created\n 1257 |     pub fn new_file<P: AsRef<Path>>(\n 1258 |         path: P,\n 1259 |         quality: u8,\n 1260 |     ) -> Result<Encoder<BufWriter<File>>, EncodingError> {\n 1261 |         let file = File::create(path)?;\n 1262 |         let buf = BufWriter::new(file);\n 1263 |         Ok(Self::new(buf, quality))\n 1264 |     }","lines":16,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L1249-L1264"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `image_buffer.rs` the macro body uses the identifier `chuck` instead of `chunk` for the loop variable. This is a misspelling of an existing word and propagates through the generated code; not a bug, but harms readability. Comment at line 156 also says \"convertion\" instead of \"conversion\".","fix":"Rename `chuck` → `chunk` and fix the spelling \"convertion\" → \"conversion\".","locations":[{"ref":"src/image_buffer.rs:156-180","code":"  156 |                 // Doing the convertion in chunks allows the compiler to vectorize the code\n  157 |                 // A size of 16 seems optimal for SSE and AVX capable hardware\n  158 |                 const CHUNK_SIZE: usize = 16;\n  159 | \n  160 |                 let mut y_buffer = [0; CHUNK_SIZE];\n  161 |                 let mut cb_buffer = [0; CHUNK_SIZE];\n  162 |                 let mut cr_buffer = [0; CHUNK_SIZE];\n  163 | \n  164 |                 for chuck in line.chunks_exact($num_colors * CHUNK_SIZE) {\n  165 |                     for i in (0..CHUNK_SIZE) {\n  166 |                         let (y, cb, cr) = rgb_to_ycbcr(\n  167 |                             chuck[i * $num_colors + $o1],\n  168 |                             chuck[i * $num_colors + $o2],\n  169 |                             chuck[i * $num_colors + $o3],\n  170 |                         );\n  171 | \n  172 |                         y_buffer[i] = y;\n  173 |                         cb_buffer[i] = cb;\n  174 |                         cr_buffer[i] = cr;\n  175 |                     }\n  176 | \n  177 |                     buffers[0].extend_from_slice(&y_buffer);\n  178 |                     buffers[1].extend_from_slice(&cb_buffer);\n  179 |                     buffers[2].extend_from_slice(&cr_buffer);\n  180 |                 }","lines":25,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/image_buffer.rs#L156-L180"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`let z = ZIGZAG[i] as usize & 0x3f;` — the `& 0x3f` mask is a no-op because every entry in `ZIGZAG` is in `0..=63` (verified by the table contents in `writer.rs`). The mask reads as if it were defensive but adds no safety; it just obscures intent and slightly muddies optimizer analysis.","fix":"Drop the `& 0x3f`: `let z = ZIGZAG[i] as usize;`.","locations":[{"ref":"src/encoder.rs:1345-1350","code":" 1345 |     fn quantize_block(block: &AlignedBlock, q_block: &mut AlignedBlock, table: &QuantizationTable) {\n 1346 |         for i in 0..64 {\n 1347 |             let z = ZIGZAG[i] as usize & 0x3f;\n 1348 |             q_block.data[i] = table.quantize(block.data[z], z);\n 1349 |         }\n 1350 |     }","lines":6,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L1345-L1350"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`QuantizationTableType::index()` has a `Custom(_) => panic!(\"Custom types not supported\")` arm. The only caller (`QuantizationTable::new_with_quality`) handles the `Custom` variant through a different match arm and never calls `.index()` on a `Custom`. The panic is unreachable.","fix":"Either move `index()` into a sealed helper that takes a non-Custom enum and remove the panic arm, or document the invariant with `unreachable!(\"Custom handled separately\")`.","locations":[{"ref":"src/quantization.rs:42-58","code":"   42 | impl QuantizationTableType {\n   43 |     fn index(&self) -> usize {\n   44 |         use QuantizationTableType::*;\n   45 | \n   46 |         match self {\n   47 |             Default => 0,\n   48 |             Flat => 1,\n   49 |             CustomMsSsim => 2,\n   50 |             CustomPsnrHvs => 3,\n   51 |             ImageMagick => 4,\n   52 |             KleinSilversteinCarney => 5,\n   53 |             DentalXRays => 6,\n   54 |             VisualDetectionModel => 7,\n   55 |             ImprovedDetectionModel => 8,\n   56 |             Custom(_) => panic!(\"Custom types not supported\"),\n   57 |         }\n   58 |     }","lines":17,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/quantization.rs#L42-L58"},{"ref":"src/quantization.rs:221-230","code":"  221 |         let table = match table {\n  222 |             QuantizationTableType::Custom(table) => Self::get_user_table(table),\n  223 |             table => {\n  224 |                 let table = if luma {\n  225 |                     &DEFAULT_LUMA_TABLES[table.index()]\n  226 |                 } else {\n  227 |                     &DEFAULT_CHROMA_TABLES[table.index()]\n  228 |                 };\n  229 |                 Self::get_with_quality(table, quality)\n  230 |             }","lines":10,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/quantization.rs#L221-L230"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`compute_reciprocal` has a `if divisor <= 1 { return (1, 0) }` early return, but every caller goes through `QuantizationTable::new_with_quality`, which always pre-multiplies the table value by 8 (`<< 3`). So `divisor` is always ≥ 8 in practice — the `divisor <= 1` branch is unreachable.","fix":"Either delete the early-return and add a debug_assert that divisor >= 2 (matching the SHIFT == 15 invariant), or remove the dead branch entirely.","locations":[{"ref":"src/quantization.rs:187-190","code":"  187 | fn compute_reciprocal(divisor: u32) -> (i32, i32) {\n  188 |     if divisor <= 1 {\n  189 |         return (1, 0);\n  190 |     }","lines":4,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/quantization.rs#L187-L190"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`get_user_table` clamps each table value to `1..=2048` then shifts left by 3 (max 16384, fits in u16). After the clamp the value is always ≥ 8, so `NonZeroU16::new(...)` always returns `Some`, and the `None => panic!(\"Invalid quantization table value: {}\")` branch is unreachable.","fix":"Replace the `match`/panic with `NonZeroU16::new(...).unwrap()` (still panics on logic error but is shorter), or use the unchecked constructor with a comment explaining the post-clamp invariant.","locations":[{"ref":"src/quantization.rs:250-259","code":"  250 |     fn get_user_table(table: &[u16; 64]) -> [NonZeroU16; 64] {\n  251 |         let mut q_table = [NonZeroU16::new(1).unwrap(); 64];\n  252 |         for (i, &v) in table.iter().enumerate() {\n  253 |             q_table[i] = match NonZeroU16::new(v.clamp(1, 2 << 10) << 3) {\n  254 |                 Some(v) => v,\n  255 |                 None => panic!(\"Invalid quantization table value: {}\", v),\n  256 |             };\n  257 |         }\n  258 |         q_table\n  259 |     }","lines":10,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/quantization.rs#L250-L259"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`add_icc_profile` does `Vec::with_capacity(MAX_CHUNK_LENGTH)` (= 65,519), but the chunk content is `MARKER (12) + 2 sequence bytes + up to MAX_CHUNK_LENGTH data` = up to 65,533 bytes, so for any non-trivial ICC profile the Vec reallocates at least once per chunk.","fix":"Use `Vec::with_capacity(MARKER.len() + 2 + data.len())` (or `MAX_CHUNK_LENGTH + 14`) so the chunk vec is sized exactly.","locations":[{"ref":"src/encoder.rs:437-444","code":"  437 |         for (i, data) in data.chunks(MAX_CHUNK_LENGTH).enumerate() {\n  438 |             let mut chunk_data = Vec::with_capacity(MAX_CHUNK_LENGTH);\n  439 |             chunk_data.extend_from_slice(MARKER);\n  440 |             chunk_data.push(i as u8 + 1);\n  441 |             chunk_data.push(num_chunks as u8);\n  442 |             chunk_data.extend_from_slice(data);\n  443 | \n  444 |             self.add_app_segment(2, chunk_data)?;","lines":8,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L437-L444"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"The padding loop appends one byte per channel per padding column, iterating up to 4 channels per iteration even when only 1 or 3 channels are active. For odd-width images this is invoked once per row of the MCU strip; cumulatively it is many small `push` calls in the hot path.","fix":"Replace the per-pixel push loop with a single `channel.resize(channel.len() + pad, last_value)` per channel after the row is filled.","locations":[{"ref":"src/encoder.rs:769-775","code":"  769 |                 for _ in usize::from(width)..buffer_width {\n  770 |                     for channel in &mut row {\n  771 |                         if !channel.is_empty() {\n  772 |                             channel.push(channel[channel.len() - 1]);\n  773 |                         }\n  774 |                     }\n  775 |                 }","lines":7,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L769-L775"},{"ref":"src/encoder.rs:1046-1052","code":" 1046 |             for _ in usize::from(width)..num_cols * 8 {\n 1047 |                 for channel in &mut row {\n 1048 |                     if !channel.is_empty() {\n 1049 |                         channel.push(channel[channel.len() - 1]);\n 1050 |                     }\n 1051 |                 }\n 1052 |             }","lines":7,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L1046-L1052"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`HuffmanTable::default_*` allocates a fresh `Vec<u8>` for `values` each time. Called 4× in every `Encoder::new`, so ~4 small heap allocations per encoder instance. For batch encoding of many images this is observable.","fix":"Store default tables in static `OnceLock<HuffmanTable>` (or, in no_std, accept this), or change `values: Vec<u8>` to `values: Cow<'static, [u8]>` so the defaults can hold a `&'static [u8]` slice with no heap allocation.","locations":[{"ref":"src/huffman.rs:81-95","code":"   81 |     pub fn default_luma_dc() -> HuffmanTable {\n   82 |         Self::new(&DEFAULT_LUMA_DC_CODE_LENGTHS, &DEFAULT_LUMA_DC_VALUES)\n   83 |     }\n   84 | \n   85 |     pub fn default_luma_ac() -> HuffmanTable {\n   86 |         Self::new(&DEFAULT_LUMA_AC_CODE_LENGTHS, &DEFAULT_LUMA_AC_VALUES)\n   87 |     }\n   88 | \n   89 |     pub fn default_chroma_dc() -> HuffmanTable {\n   90 |         Self::new(&DEFAULT_CHROMA_DC_CODE_LENGTHS, &DEFAULT_CHROMA_DC_VALUES)\n   91 |     }\n   92 | \n   93 |     pub fn default_chroma_ac() -> HuffmanTable {\n   94 |         Self::new(&DEFAULT_CHROMA_AC_CODE_LENGTHS, &DEFAULT_CHROMA_AC_VALUES)\n   95 |     }","lines":15,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/huffman.rs#L81-L95"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`set_progressive_scans` panics via `assert!` on bad input. Other configuration setters in the same struct return `Result` (`add_app_segment`, `add_icc_profile`), so this is an inconsistent API: a value passed from user input (e.g. parsed from a CLI flag) will crash the program rather than producing a recoverable error. The panic is documented but still inconsistent with the rest of the builder.","fix":"Either change the signature to `pub fn set_progressive_scans(&mut self, scans: u8) -> Result<(), EncodingError>` with a new `EncodingError::InvalidProgressiveScans(u8)` variant, or have it clamp silently with a debug_assert.","locations":[{"ref":"src/encoder.rs:352-366","code":"  352 |     /// Set number of scans per component for progressive encoding\n  353 |     ///\n  354 |     /// Number of scans must be between 2 and 64.\n  355 |     /// There is at least one scan for the DC coefficients and one for the remaining 63 AC coefficients.\n  356 |     ///\n  357 |     /// # Panics\n  358 |     /// If number of scans is not within valid range\n  359 |     pub fn set_progressive_scans(&mut self, scans: u8) {\n  360 |         assert!(\n  361 |             (2..=64).contains(&scans),\n  362 |             \"Invalid number of scans: {}\",\n  363 |             scans\n  364 |         );\n  365 |         self.progressive_scans = Some(scans);\n  366 |     }","lines":15,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L352-L366"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`init_rows` and `init_block_buffers` are line-for-line identical except for the element type (`u8` vs `AlignedBlock`). Both have the same 1/3/4 component branching, the same `unreachable!` arm, and the same comment about giving the compiler info.","fix":"Replace both with a single generic helper `fn init_buffers<T>(&self, buffer_size: usize) -> [Vec<T>; 4]`. The two callers just differ in the inferred type.","locations":[{"ref":"src/encoder.rs:700-725","code":"  700 |     fn init_rows(&mut self, buffer_size: usize) -> [Vec<u8>; 4] {\n  701 |         // To simplify the code and to give the compiler more infos to optimize stuff we always initialize 4 components\n  702 |         // Resource overhead should be minimal because an empty Vec doesn't allocate\n  703 | \n  704 |         match self.components.len() {\n  705 |             1 => [\n  706 |                 Vec::with_capacity(buffer_size),\n  707 |                 Vec::new(),\n  708 |                 Vec::new(),\n  709 |                 Vec::new(),\n  710 |             ],\n  711 |             3 => [\n  712 |                 Vec::with_capacity(buffer_size),\n  713 |                 Vec::with_capacity(buffer_size),\n  714 |                 Vec::with_capacity(buffer_size),\n  715 |                 Vec::new(),\n  716 |             ],\n  717 |             4 => [\n  718 |                 Vec::with_capacity(buffer_size),\n  719 |                 Vec::with_capacity(buffer_size),\n  720 |                 Vec::with_capacity(buffer_size),\n  721 |                 Vec::with_capacity(buffer_size),\n  722 |             ],\n  723 |             len => unreachable!(\"Unsupported component length: {}\", len),\n  724 |         }\n  725 |     }","lines":26,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/encoder.rs#L700-L725"},{"ref":"src/encoder.rs:1103-1128","co {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"hard","description":"The AC frequency-counting block inside `optimize_huffman_table` duplicates the structure of the encoding loop in `encode_image_progressive`/`write_ac_block`: both walk `&block.data[start..end]`, accumulate zero runs, emit a 0xF0 every 16 zeros, and end with 0x00 on trailing zeros. The two must stay in sync — a future change to one and not the other would silently produce wrong Huffman tables.","fix":"Extract a single helper that takes either a `&mut [u32; 257]` (counting) or a `&mut JfifWriter<W>` (emitting) and walks the block coefficients with the same logic. Or have the writer call a small visitor callback. At minimum, add a regression test that round-trips a known image with `optimize_huffman_tables(true)` + `progressive(true)` and asserts byte-for-byte stability.","locations":[{"ref":"src/encoder.rs:1164-1233","code":" 1164 |                 if component.ac_huffman_table == table {\n 1165 |                     had_ac = true;\n 1166 | \n 1167 |                     if let Some(scans) = self.progressive_scans {\n 1168 |                         let scans = scans as usize - 1;\n 1169 | \n 1170 |                         let values_per_scan = 64 / scans;\n 1171 | \n 1172 |                         for scan in 0..scans {\n 1173 |                             let start = (scan * values_per_scan).max(1);\n 1174 |                             let end = if scan == scans - 1 {\n 1175 |                                 // Due to rounding we might need to transfer more than values_per_scan values in the last scan\n 1176 |                                 64\n 1177 |                             } else {\n 1178 |                                 (scan + 1) * values_per_scan\n 1179 |                             };\n 1180 | \n 1181 |                             debug_assert!(!blocks[i].is_empty());\n 1182 | \n 1183 |                             for block in &blocks[i] {"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The `RgbImageAVX2` family is exported as a `pub struct` (under benchmark feature) but its three tuple fields (data slice, width, height) are public via positional access only — the slice is `pub`. Users of the public API have no way to construct one outside the macro, but inside the macro it works. The public-yet-undocumented interface is fragile (any field reorder is a breaking change for anyone who built one positionally).","fix":"Either add a constructor `pub fn new(data: &'a [u8], width: u16, height: u16) -> Self` and make the fields private, or document the positional contract explicitly.","locations":[{"ref":"src/avx2/ycbcr.rs:21","code":"   21 |         pub struct $name<'a>(pub &'a [u8], pub u16, pub u16);","lines":1,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/avx2/ycbcr.rs#L21"},{"ref":"src/avx2/ycbcr.rs:151-154","code":"  151 | ycbcr_image_avx2!(RgbImageAVX2, 3, 0, 1, 2);\n  152 | ycbcr_image_avx2!(RgbaImageAVX2, 4, 0, 1, 2);\n  153 | ycbcr_image_avx2!(BgrImageAVX2, 3, 2, 1, 0);\n  154 | ycbcr_image_avx2!(BgraImageAVX2, 4, 2, 1, 0);","lines":4,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/avx2/ycbcr.rs#L151-L154"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"hard","description":"`cmyk_to_ycck` computes `(Y, Cb, Cr) = rgb_to_ycbcr(c, m, y)` directly from raw CMY values, but the Adobe YCCK convention (the format the encoder advertises via APP14 ColorTransform = 2) expects YCbCr to be computed from the *inverted* CMY (i.e. (255-C, 255-M, 255-Y) treated as RGB). Concretely, this encoder emits a JPEG where \"white CMYK\" maps to Y=0 instead of the Adobe-standard Y=255. The crate's own round-trip test passes because `jpeg-decoder` happens to use the same inverted convention, but standards-compliant Adobe-aware decoders (Photoshop, libjpeg-turbo, ImageMagick with `-define jpeg:dct-method=...`) will decode the K channel correctly but produce inverted-luma CMY output.","fix":"Match libjpeg-turbo: compute Y = 255 - rgb_to_ycbcr(c,m,y).0 (and likewise mirror Cb/Cr), so the YCC components are derived from the inverted (255-C, 255-M, 255-Y) RGB equivalent. Concretely something like `let (y, cb, cr) = rgb_to_ycbcr(255-c, 255-m, 255-y); (y, cb, cr, 255-k)`. Add an end-to-end test that decodes the encoded YCCK using a libjpeg-turbo-based decoder if one is available, or at least verify against published Adobe test vectors.","locations":[{"ref":"src/image_buffer.rs:33-38","code":"   33 | /// Conversion from CMYK to YCCK (YCbCrK)\n   34 | #[inline]\n   35 | pub fn cmyk_to_ycck(c: u8, m: u8, y: u8, k: u8) -> (u8, u8, u8, u8) {\n   36 |     let (y, cb, cr) = rgb_to_ycbcr(c, m, y);\n   37 |     (y, cb, cr, 255 - k)\n   38 | }","lines":6,"link":"https://github.com/vstroebel/jpeg-encoder/blob/b2bbd6f78d576a51fd80321d94f120290f9f3b9a/src/image_buffer.rs#L33-L38"}]},

  <div id="progress-bar"><div id="progress-fill"></div></div>

  <button class="action-btn" data-action="expand-all">⊞ Expand all</button>

  <button class="action-btn" data-action="download-md-short">&#11015; MD Short</button>

</div>

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
