{"id":"ERR_26","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`read_os_string_lines` converts each byte line with `os_string_from_vec(bl).expect(\"UTF-8\nerror\")`. On non-Unix/non-WASI platforms `os_string_from_vec` returns `Err` for invalid UTF-8,\nso this `.expect` will panic on input that contains non-UTF-8 bytes, despite the surrounding\nAPI (`read_byte_lines`) being explicitly designed to avoid panicking on non-UTF-8 input. The\ndoc comment even claims it \"won't panic on non UTF-8 characters on Unix, but it still will on\nWindows\" - so the panic is acknowledged but it is still a hard crash on otherwise-valid file\ncontents on Windows.","fix":"Propagate the conversion error as an `io::Error` (map the `UError` into\n`io::ErrorKind::InvalidData`) instead of `.expect`, so callers can handle non-UTF-8 lines on\nnon-Unix platforms gracefully.","locations":[{"ref":"src/uucore/src/lib/lib.rs:586-591","code":"  586 | pub fn read_os_string_lines<R: std::io::Read>(\n  587 |     buf_reader: BufReader<R>,\n  588 | ) -> impl Iterator<Item = std::io::Result<OsString>> {\n  589 |     read_byte_lines(buf_reader)\n  590 |         .map(|byte_line_res| byte_line_res.map(|bl| os_string_from_vec(bl).expect(\"UTF-8 error\")))\n  591 | }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/lib.rs#L586-L591"}]},
{"id":"ERR_27","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"In nohup, after `libc::signal(SIGHUP, SIG_IGN)` the return value is discarded with no check. If SIG_IGN installation fails (returns SIG_ERR), nohup proceeds to exec the child without actually ignoring SIGHUP, defeating its sole purpose, without any diagnostic.","fix":"Check the return of `libc::signal` against `SIG_ERR` and emit a warning (or fail) if installing the SIGHUP ignore handler did not succeed.","locations":[{"ref":"src/uu/nohup/src/nohup.rs:81","code":"   81 |     unsafe { libc::signal(libc::SIGHUP, libc::SIG_IGN) };","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/nohup/src/nohup.rs#L81"}]},
{"id":"ERR_28","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"`Output::into_write` truncates an existing output file with\n`let _ = file.set_len(0);`, discarding any error. If truncation fails (e.g. the\nfile became read-only between open and write), stale trailing bytes from a\nprevious longer file can remain after the freshly written sorted content,\nproducing silently corrupt output.","fix":"Propagate the `set_len(0)` error (return `UResult`) or at least `show_error!`\nthe failure rather than ignoring it, so a failed truncate does not yield\ncorrupt output.","locations":[{"ref":"src/uu/sort/src/sort.rs:258-266","code":"  258 |     fn into_write(self) -> BufWriter<Box<dyn Write>> {\n  259 |         BufWriter::new(match self.file {\n  260 |             Some((_name, file)) => {\n  261 |                 // truncate the file\n  262 |                 let _ = file.set_len(0);\n  263 |                 Box::new(file)\n  264 |             }\n  265 |             None => Box::new(stdout()),\n  266 |         })","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/sort.rs#L258-L266"}]},
{"id":"ERR_29","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"Benchmark helpers pervasively use .unwrap() on File::create/write_all/sync_all/create_dir/set_permissions. Acceptable in bench-only code, but create_test_file does an extra File::open(&file_path).unwrap().sync_all() after already flushing and dropping the BufWriter; the reopen+sync_all is redundant with the writer's drop on most platforms and adds an unnecessary syscall round-trip. The comment \"Ensure data is fully written to disk\" overstates what flush() (which does not fsync) guarantees, so the reopen is the only real durability step but is awkwardly placed.","fix":"Call file.sync_all() (or writer.get_ref().sync_all()) directly via the original handle before drop instead of reopening; or keep the BufWriter, flush, then sync_all on the inner File, avoiding a second open.","locations":[{"ref":"src/uucore/src/lib/features/benchmark.rs:23-26","code":"   23 |     writer.flush().unwrap();\n   24 |     // Ensure data is fully written to disk before returning\n   25 |     drop(writer);\n   26 |     File::open(&file_path).unwrap().sync_all().unwrap();","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/benchmark.rs#L23-L26"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Source::stdin_as_file` does `File::from_raw_fd(io::stdin().as_raw_fd())`, taking ownership of fd 0 via `FromRawFd`. When this `File` (held inside `Source::StdinFile`) is dropped it will `close(0)`, closing the process stdin file descriptor even though `io::Stdin` does not own it being closed here. This is the classic double-ownership-of-fd hazard; subsequent code/libraries expecting fd 0 open could misbehave. dd typically runs to process exit so it is usually benign, but it is unsound fd ownership.","fix":"Use `BorrowedFd`/`try_clone_to_owned()` (as the windows path does with as_handle().try_clone_to_owned()) or wrap in `ManuallyDrop`/`std::mem::forget` semantics so the borrowed stdin fd is not closed by File::drop.","locations":[{"ref":"src/uu/dd/src/dd.rs:239-244","code":"  239 |     #[cfg(unix)]\n  240 |     fn stdin_as_file() -> Self {\n  241 |         let fd = io::stdin().as_raw_fd();\n  242 |         let f = unsafe { File::from_raw_fd(fd) };\n  243 |         Self::StdinFile(f)\n  244 |     }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/dd.rs#L239-L244"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"RingBuffer uses VecDeque::with_capacity(size) and then enforces its size limit via self.data.capacity() in push_back. The std contract for with_capacity only guarantees room for AT LEAST `size` elements; the allocator is free to return a larger capacity. If it ever does, the ring buffer will silently hold MORE than `size` elements before it starts evicting, breaking the documented fixed-size / last-N semantics (e.g. tail -n). It happens to be exact for small sizes on the current allocator, so this is a latent correctness bug rather than a guaranteed one.","fix":"Store the requested size in a dedicated field (e.g. `size: usize`) and compare self.data.len() against that stored size instead of self.data.capacity(). Keep with_capacity only as an allocation hint.","locations":[{"ref":"src/uucore/src/lib/features/ringbuffer.rs:50-53","code":"   50 |     pub fn new(size: usize) -> Self {\n   51 |         Self {\n   52 |             data: VecDeque::with_capacity(size),\n   53 |         }","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/ringbuffer.rs#L50-L53"},{"ref":"src/uucore/src/lib/features/ringbuffer.rs:98-109","code":"   98 |     pub fn push_back(&mut self, value: T) -> Option<T> {\n   99 |         if self.data.capacity() == 0 {\n  100 |             return Some(value);\n  101 |         }\n  102 |         let result = if self.data.len() == self.data.capacity() {\n  103 |             self.data.pop_front()\n  104 |         } else {\n  105 |             None\n  106 |         };\n  107 |         self.data.push_back(value);\n  108 |         result\n  109 |     }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/ringbuffer.rs#L98-L109"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"unpredictable_function_pointer_comparisons is suppressed and FormatWriter derives PartialEq/Eq over function pointers. Equality of fn pointers is not guaranteed to be meaningful (the compiler may merge/deduplicate identical functions or emit distinct thunks), so comparing two FormatterItemInfo for equality (used heavily in parse_formats tests) can in principle yield false negatives/positives. It happens to work today because each formatter is a distinct function, but the equality semantics are relying on unspecified behavior.","fix":"Avoid deriving Eq/PartialEq on the fn-pointer-containing enum for production logic; for tests compare a stable discriminant/identifier (e.g. byte_size + print_width + a format-type tag) instead of the raw fn pointers.","locations":[{"ref":"src/uu/od/src/formatter_item_info.rs:9-18","code":"    9 | #[allow(clippy::enum_variant_names)]\n   10 | #[allow(unpredictable_function_pointer_comparisons)]\n   11 | #[derive(Clone, Copy, PartialEq, Eq)]\n   12 | pub enum FormatWriter {\n   13 |     IntWriter(fn(u64) -> String),\n   14 |     FloatWriter(fn(f64) -> String),\n   15 |     LongDoubleWriter(fn(f64) -> String), // On most platforms, long double is f64 or emulated\n   16 |     BFloatWriter(fn(f64) -> String),\n   17 |     MultibyteWriter(fn(&[u8]) -> String),\n   18 | }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/formatter_item_info.rs#L9-L18"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"WithEnvVarSet sets the FILE env var via unsafe env::set_var and restores it on Drop, but in FilterWriter::new the guard is bound to `_with_env_var_set`, a name that begins with underscore. A binding named exactly `_` would drop immediately; `_with_env_var_set` does live until end of scope, so this happens to be correct - but it is a well-known footgun and the process-global env mutation is not thread-safe (split is single-threaded today, so impact is low). Worth a comment that the binding name is load-bearing.","fix":"Keep the non-underscore-prefixed-or-bare binding and add a brief comment that the guard must outlive the spawn; the env mutation is sound only because the program is single-threaded.","locations":[{"ref":"src/uu/split/src/platform/unix.rs:88-100","code":"   88 |     fn new(command: &str, filepath: &OsStr) -> Result<Self> {\n   89 |         // set $FILE, save previous value (if there was one)\n   90 |         let _with_env_var_set = WithEnvVarSet::new(\"FILE\", filepath);\n   91 | \n   92 |         let shell_process =\n   93 |             Command::new(env::var(\"SHELL\").unwrap_or_else(|_| \"/bin/sh\".to_owned()))\n   94 |                 .arg(\"-c\")\n   95 |                 .arg(command)\n   96 |                 .stdin(Stdio::piped())\n   97 |                 .spawn()?;\n   98 | \n   99 |         Ok(Self { shell_process })\n  100 |     }","lines":13,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/platform/unix.rs#L88-L100"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Observer::start` matches the \"too many open files\" condition by string-comparing the error display\n(`e.to_string().starts_with(\"Too many open files\")`). This is locale/version fragile - the notify\ncrate or underlying OS message wording can change, and a localized libc could produce a different\nstring, silently breaking the fallback-to-polling path. The adjacent comment even acknowledges the\nproper ErrorKind is `Uncategorized` and unmatchable, but string matching is not a robust substitute.","fix":"Match on `notify::ErrorKind::MaxFilesWatch` / `Io(e)` with `e.raw_os_error() == Some(libc::EMFILE | libc::ENFILE)` instead of the localized message text.","locations":[{"ref":"src/uu/tail/src/follow/watch.rs:215-231","code":"  215 |             match RecommendedWatcher::new(tx, notify::Config::default()) {\n  216 |                 Ok(w) => watcher = Box::new(w),\n  217 |                 Err(e) if e.to_string().starts_with(\"Too many open files\") => {\n  218 |                     /*\n  219 |                     NOTE: This ErrorKind is `Uncategorized`, but it is not recommended\n  220 |                     to match an error against `Uncategorized`\n  221 |                     NOTE: Could be tested with decreasing `max_user_instances`, e.g.:\n  222 |                     `sudo sysctl fs.inotify.max_user_instances=64`\n  223 |                     */\n  224 |                     show_error!(\n  225 |                         \"{}\",\n  226 |                         translate!(\"tail-error-backend-cannot-be-used-too-many-files\", \"backend\" => text::BACKEND)\n  227 |                     );\n  228 |                     set_exit_code(1);\n  229 |                     self.use_polling = true;\n  230 |                     watcher = Box::new(notify::PollWatcher::new(tx_clone, watcher_config).unwrap());\n  231 |                 }","lines":17,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/follow/watch.rs#L215-L231"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`write_legacy_checksum` computes the SysV/BSD block count with `size.div_ceil(options.algo_kind.bitlen())`.\n`SizedAlgoKind::bitlen()` is documented and used elsewhere as the digest *bit length*; for Sysv it returns\n512 and for Bsd 1024. The legacy formats actually need the block *size in bytes* (512 for sysv, 1024 for\nbsd). The two values happen to coincide, so the output is currently correct, but this couples the block-size\narithmetic to an unrelated \"bit length\" accessor. Any future correction of `bitlen()` to a real digest bit\nlength (sysv/bsd produce a 16-bit sum) would silently corrupt the block counts.","fix":"Use explicit block-size constants (512 for Sysv, 1024 for Bsd) in `write_legacy_checksum` instead of\nreusing `bitlen()`, and/or rename/repurpose `bitlen()` so its name reflects what it returns.","locations":[{"ref":"src/uucore/src/lib/features/checksum/compute.rs:153-165","code":"  153 |         (SizedAlgoKind::Sysv, DigestOutput::U16(sum)) => write!(\n  154 |             w,\n  155 |             \"{prefix}{sum} {}\",\n  156 |             size.div_ceil(options.algo_kind.bitlen()),\n  157 |         )?,\n  158 |         (SizedAlgoKind::Bsd, DigestOutput::U16(sum)) => {\n  159 |             // The BSD checksum output is 5 digit integer\n  160 |             let bsd_width = 5;\n  161 |             write!(\n  162 |                 w,\n  163 |                 \"{prefix}{sum:0bsd_width$} {:bsd_width$}\",\n  164 |                 size.div_ceil(options.algo_kind.bitlen()),\n  165 |             )?;","lines":13,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/checksum/compute.rs#L153-L165"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The Locate macro `f!` reads the raw passwd/group struct via `ptr::read(data.cast_const())`\nunder PW_LOCK, then constructs the owned Passwd/Group inside the unsafe block while the\npointed-to C strings are still owned by libc's static buffer - this is correct only as\nlong as no other code calls getpw*/getgr* without taking PW_LOCK. The comment at\nlines 246-248 explicitly notes this invariant is not enforced. Any direct libc::getpwuid\ncall elsewhere in the codebase (or in a dependency) races with this and can yield\nuse-after-overwrite of the static buffer. This is an architectural fragility, not a\nguaranteed bug.","fix":"Prefer the reentrant getpwuid_r/getgrgid_r variants (caller-supplied buffer) to\neliminate the global-lock invariant entirely.","locations":[{"ref":"src/uucore/src/lib/features/entries.rs:242-310","code":"  242 | // These functions are not thread-safe:\n  243 | // > The return value may point to a static area, and may be\n  244 | // > overwritten by subsequent calls to getpwent(3), getpwnam(),\n  245 | // > or getpwuid().\n  246 | // This applies not just to the struct but also the strings it points\n  247 | // to, so we must copy all the data we want before releasing the lock.\n  248 | // (Technically we must also ensure that the raw functions aren't being called\n  249 | // anywhere else in the program.)\n  250 | static PW_LOCK: Mutex<()> = Mutex::new(());\n  251 | \n  252 | macro_rules! f {\n  253 |     ($fnam:ident, $fid:ident, $t:ident, $st:ident) => {\n  254 |         impl Locate<$t> for $st {\n  255 |             fn locate(k: $t) -> IOResult<Self> {\n  256 |                 let _guard = PW_LOCK.lock();\n  257 |                 // SAFETY: We're holding PW_LOCK.\n  258 |                 unsafe {\n  259 |                     let data = $fid(k);\n  260 |                     if !data.is_null() {\n  261 |                         Ok($st::from_raw(ptr::read(data.cast_const())))\n  262 |                     } else {\n  263 |                         // FIXME: Resource limits, signals and I/O failure may\n  264 |                         // cause this too. See getpwnam(3).\n  265 |                         // errno must be set to zero before the call. We can\n  266 |                         // use libc::__errno_location() on some platforms.\n  267 |                         // The same applies for the two cases below.\n  268 |                         Err(IOError::new(\n  269 |                             ErrorKind::NotFound,\n  270 |                             format!(\"No such id: {k}\"),\n  271 |                         ))\n  272 |                     }\n  273 |                 }\n  274 |             }\n  275 |         }\n  276 | \n  277 |         impl<'a> Locate<&'a str> for $st {\n  278 |             fn locate(k: &'a str) -> IOResult<Self> {\n  279 |                 let _guard = PW_LOCK.lock();\n  280 |                 // SAFETY: We're holding PW_LOCK.\n  281 |                 unsafe {\n  282 |                     let cstring = CString::new(k)?;\n  283 |                     // try to get user or group with name matching the input with these tow lines:\n  284 |                     // f!(getpwnam, getpwuid, uid_t, Passwd);\n  285 |                     // f!(getgrnam, getgrgid, gid_t, Group);\n  286 |                     let data = $fnam(cstring.as_ptr());\n  287 |                     if !data.is_null() {\n  288 |                         return Ok($st::from_raw(ptr::read(data.cast_const())));\n  289 |                     }\n  290 |                     if let Ok(id) = k.parse::<$t>() {\n  291 |                         let data = $fid(id);\n  292 |                         if !data.is_null() {\n  293 |                             Ok($st::from_raw(ptr::read(data.cast_const())))\n  294 |                         } else {\n  295 |                             Err(IOError::new(\n  296 |                                 ErrorKind::NotFound,\n  297 |                                 format!(\"No such id: {id}\"),\n  298 |                             ))\n  299 |                         }\n  300 |                     } else {\n  301 |                         Err(IOError::new(ErrorKind::NotFound, format!(\"Not found: {k}\")))\n  302 |                     }\n  303 |                 }\n  304 |             }\n  305 |         }\n  306 |     };\n  307 | }\n  308 | \n  309 | f!(getpwnam, getpwuid, uid_t, Passwd);\n  310 | f!(getgrnam, getgrgid, gid_t, Group);","lines":69,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/entries.rs#L242-L310"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"DirFd::from_raw_fd takes a RawFd and wraps it in OwnedFd via from_raw_fd after only a\n`fd < 0` check. It does not verify the fd is actually a directory (O_DIRECTORY), so a\nDirFd built from an arbitrary fd will later fail opaquely in read_dir/openat. Given the\ntype's safety purpose (directory traversal), accepting a non-directory fd is an API\nfoot-gun; the public constructor should fstat and reject non-directories.","fix":"fstat the fd and return InvalidInput if it is not S_IFDIR, mirroring DirFd::open's\nO_DIRECTORY guarantee.","locations":[{"ref":"src/uucore/src/lib/features/safe_traversal.rs:478-489","code":"  478 |     /// Create a DirFd from an existing file descriptor (takes ownership)\n  479 |     pub fn from_raw_fd(fd: RawFd) -> io::Result<Self> {\n  480 |         if fd < 0 {\n  481 |             return Err(io::Error::new(\n  482 |                 io::ErrorKind::InvalidInput,\n  483 |                 translate!(\"safe-traversal-error-invalid-fd\"),\n  484 |             ));\n  485 |         }\n  486 |         // SAFETY: We've verified fd >= 0, and the caller is transferring ownership\n  487 |         let owned_fd = unsafe { OwnedFd::from_raw_fd(fd) };\n  488 |         Ok(Self { fd: owned_fd })\n  489 |     }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/safe_traversal.rs#L478-L489"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"into_f64 calls `bd.to_f64().unwrap()`. BigDecimal::to_f64 returns Option and, while it currently\nyields Some for all finite BigDecimals, relying on unwrap couples correctness to an external crate's\nimplementation detail; a future bigdecimal change returning None would turn a parse into a panic in\ncore shared code used by many utilities.","fix":"Handle the None case explicitly (e.g. map to Overflow(inf) with appropriate sign, or NotNumeric)\ninstead of unwrap.","locations":[{"ref":"src/uucore/src/lib/features/parser/num_parser.rs:252-260","code":"  252 |                 ExtendedBigDecimal::BigDecimal(bd) => {\n  253 |                     let f = bd.to_f64().unwrap();\n  254 |                     if f.is_infinite() {\n  255 |                         return Err(ExtendedParserError::Overflow(f));\n  256 |                     }\n  257 |                     if f.is_zero() && !bd.is_zero() {\n  258 |                         return Err(ExtendedParserError::Underflow(f));\n  259 |                     }\n  260 |                     f","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/parser/num_parser.rs#L252-L260"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"preserve_inherited_sigpipe calls libc::signal and std::env::remove_var inside unsafe blocks during startup. remove_var is process-global and unsound if other threads exist; relying on the RUST_SIGPIPE env var as an out-of-band channel (set by env.rs) is a fragile cross-module coupling. This is by design but the remove_var is the documented-unsafe-in-multithread API and there is no guarantee no threads have been spawned yet at the call site.","fix":"Document the single-threaded-startup invariant at the call site, and consider gating the remove_var on actually being early in main before any thread spawn; or pass the intent through a non-env mechanism.","locations":[{"ref":"src/uucore/src/lib/mods/panic.rs:51-60","code":"   51 | pub fn preserve_inherited_sigpipe() {\n   52 |     use nix::libc;\n   53 | \n   54 |     // Check if parent specified that SIGPIPE should be default\n   55 |     if std::env::var_os(\"RUST_SIGPIPE\").is_some_and(|v| v == \"default\") {\n   56 |         unsafe { libc::signal(libc::SIGPIPE, libc::SIG_DFL) };\n   57 |         // Remove the environment variable so child processes don't inherit it incorrectly\n   58 |         unsafe { std::env::remove_var(\"RUST_SIGPIPE\") };\n   59 |     }\n   60 | }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/mods/panic.rs#L51-L60"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`Table::write_to` allocates a fresh `Vec<u8>` for every padding run via\n`iter::repeat_n(b' ', pad_width).collect::<Vec<_>>()` and writes it. This happens for every\nleft- and right-aligned cell of every row, allocating once per cell purely to emit spaces.","fix":"Write padding without allocating, e.g. keep a static/`const` buffer of spaces and write slices\nof it in a loop, or use `write!` with a width specifier. Avoid the per-cell heap allocation.","locations":[{"ref":"src/uu/df/src/table.rs:548-554","code":"  548 |                             writer\n  549 |                                 .write_all(&iter::repeat_n(b' ', pad_width).collect::<Vec<_>>())?;\n  550 |                         }\n  551 |                     }\n  552 |                     Some(Alignment::Right) => {\n  553 |                         writer.write_all(&iter::repeat_n(b' ', pad_width).collect::<Vec<_>>())?;\n  554 |                         writer.write_all(&elem.bytes)?;","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/df/src/table.rs#L548-L554"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"In display_items, every entry name is escaped twice for the non-long formats. First all names are escaped just to compute the `quoted` flag (`items.iter().any(|item| { let name = escape_name_with_locale(...); ... })`), then each name is escaped again inside display_item_name. For Columns/Across/Commas/OneLine output this is a redundant per-entry allocation+escape over the whole listing.","fix":"Escape each name once, cache the escaped OsString (e.g. compute names_vec first and derive `quoted` from it), or short-circuit the `quoted` probe to only test the leading byte without allocating when the quoting style cannot produce a leading quote.","locations":[{"ref":"src/uu/ls/src/display.rs:396-399","code":"  396 |     let quoted = items.iter().any(|item| {\n  397 |         let name = escape_name_with_locale(item.display_name(), config);\n  398 |         os_str_starts_with(&name, b\"'\")\n  399 |     });","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/display.rs#L396-L399"},{"ref":"src/uu/ls/src/display.rs:756","code":"  756 |     let mut name = escape_name_with_locale(path.display_name(), config);","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/display.rs#L756"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"enter_directory opens every recursed child directory twice. For each child it calls `fs::read_dir(&child_path)` solely to test accessibility and immediately discards the handle (`Ok(_) => ...`); the directory is then re-opened with `fs::read_dir(&entry.path)` when the stack entry is later processed. This doubles the directory-open (and first-readdir) syscalls for every directory in a recursive (`-R`) traversal.","fix":"Push the already-opened `ReadDir` handle onto the stack alongside the path (or carry it via an `Option<ReadDir>` like the `initial_read_dir` handling) instead of opening, dropping, and reopening.","locations":[{"ref":"src/uu/ls/src/ls.rs:1406-1423","code":" 1406 |         let mut current_read_dir = if entry.is_first {\n 1407 |             initial_read_dir\n 1408 |                 .take()\n 1409 |                 .expect(\"initial read_dir is present for first entry\")\n 1410 |         } else {\n 1411 |             match fs::read_dir(&entry.path) {\n 1412 |                 Err(err) => {\n 1413 |                     output.flush()?;\n 1414 |                     show!(LsError::IOErrorContext(\n 1415 |                         entry.path.clone(),\n 1416 |                         err,\n 1417 |                         entry.command_line,\n 1418 |                     ));\n 1419 |                     continue;\n 1420 |                 }\n 1421 |                 Ok(rd) => rd,\n 1422 |             }\n 1423 |         };","lines":18,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/ls.rs#L1406-L1423"},{"ref":"src/uu/ls/src/ls.rs:1438-1462","code":" 1438 |                 match fs::read_dir(&child_path) {\n 1439 |                     Err(err) => {\n 1440 |                         output.flush()?;\n 1441 |                         show!(LsError::IOErrorContext(\n 1442 |                             child_path.clone(),\n 1443 |                             err,\n 1444 |                             child_command_line,\n 1445 |                         ));\n 1446 |                     }\n 1447 |                     Ok(_) => {\n 1448 |                         if listed_ancestors.insert(FileInformation::from_path(\n 1449 |                             &child_path,\n 1450 |                             child_must_dereference,\n 1451 |                         )?) {\n 1452 |                             stack.push(StackEntry {\n 1453 |                                 path: child_path,\n 1454 |                                 command_line: child_command_line,\n 1455 |                                 is_first: false,\n 1456 |                             });\n 1457 |                         } else {\n 1458 |                             output.flush()?;\n 1459 |                             show!(LsError::AlreadyListedError(child_path));\n 1460 |                         }\n 1461 |                     }\n 1462 |                 }","lines":25,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/ls.rs#L1438-L1462"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"tac regex mode is O(n^2) on the input size. For every byte index i from the end of the buffer down to 0, it calls pattern.find_at(&data[..this_line_end], i), which performs a regex scan that can examine the whole remaining prefix. On a large file with the -r option this becomes quadratic and effectively hangs on multi-megabyte inputs, even though the non-regex path (memmem::rfind_iter) is linear.","fix":"Use regex find_iter over the whole buffer once to collect all match (start,end) positions (left-to-right), then iterate that collected list in reverse to emit lines, instead of re-running find_at for every byte offset.","locations":[{"ref":"src/uu/tac/src/tac.rs:147-168","code":"  147 |     for i in (0..data.len()).rev() {\n  148 |         // Determine if there is a match for `pattern` starting at index\n  149 |         // `i` in `data`. Only search up to the line ending that was\n  150 |         // found previously.\n  151 |         if let Some(match_) = pattern.find_at(&data[..this_line_end], i)\n  152 |             && match_.start() == i\n  153 |         {\n  154 |             // Record this index as the ending of the current line.\n  155 |             this_line_end = i;\n  156 | \n  157 |             // The length of the match (that is, the line separator), in bytes.\n  158 |             let slen = match_.end() - match_.start();\n  159 | \n  160 |             if before {\n  161 |                 out.write_all(&data[i..following_line_start])?;\n  162 |                 following_line_start = i;\n  163 |             } else {\n  164 |                 out.write_all(&data[i + slen..following_line_start])?;\n  165 |                 following_line_start = i + slen;\n  166 |             }\n  167 |         }\n  168 |     }","lines":22,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tac/src/tac.rs#L147-L168"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"build_tz_abbrev_map iterates every zone in the IANA database and builds a HashMap on first use of try_parse_with_abbreviation, even when the input contains no abbreviation. Because the abbreviation path runs for every parsed line, the OnceLock amortizes construction, but the per-line split_whitespace().last() + uppercase scan still runs for every date; for the FIXED_OFFSET_ABBREVIATIONS hot set this is acceptable, but the cache build pulls in the entire tzdb the first time any 2-5 char uppercase token (even a non-tz one) is seen.","fix":"Only build the IANA map after FIXED_OFFSET_ABBREVIATIONS misses AND the token passes a cheaper pre-filter; consider building the map lazily keyed only on demand or replacing the full-db scan with a static curated table.","locations":[{"ref":"src/uu/date/src/date.rs:1043-1066","code":" 1043 | fn build_tz_abbrev_map() -> HashMap<String, String> {\n 1044 |     let mut map = HashMap::new();\n 1045 | \n 1046 |     let tzdb = TimeZoneDatabase::from_env(); // spell-checker:disable-line\n 1047 |     // spell-checker:disable-next-line\n 1048 |     for tz_name in tzdb.available() {\n 1049 |         let tz_str = tz_name.as_str();\n 1050 |         // Use last component as potential abbreviation\n 1051 |         // e.g., \"Pacific/Fiji\" could map to \"FIJI\"\n 1052 |         if let Some(last_part) = tz_str.split('/').next_back() {\n 1053 |             let potential_abbrev = last_part.to_uppercase();\n 1054 |             // Only add if it looks like an abbreviation (2-5 uppercase chars)\n 1055 |             if potential_abbrev.len() >= 2\n 1056 |                 && potential_abbrev.len() <= 5\n 1057 |                 && potential_abbrev.chars().all(|c| c.is_ascii_uppercase())\n 1058 |             {\n 1059 |                 map.entry(potential_abbrev)\n 1060 |                     .or_insert_with(|| tz_str.to_string());\n 1061 |             }\n 1062 |         }\n 1063 |     }\n 1064 | \n 1065 |     map\n 1066 | }","lines":24,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/date/src/date.rs#L1043-L1066"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`write_result` builds the non-exponent factorization output with\n`format!(\" {factor}\").repeat(n)`. For a `BigUint` input that is a large power of a small\nprime (e.g. a huge power of 2), `n` (the multiplicity) can be enormous, so `repeat(n)`\nallocates a single gigantic string in memory before writing. The exponent-printing path\n(`-h`) avoids this. A loop writing `n` times would bound memory.","fix":"Write the factor `n` times in a loop (`for _ in 0..n { write!(w, \" {factor}\")?; }`) instead\nof materializing `format!(...).repeat(n)`.","locations":[{"ref":"src/uu/factor/src/factor.rs:142","code":"  142 |             w.write_all(format!(\" {factor}\").repeat(n).as_bytes())?;","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/factor/src/factor.rs#L142"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In fold, `emit_output` recomputes the column count of the entire remaining buffer from scratch via `compute_col_count(ctx.output, ctx.mode)` after every emitted line. With `-s` (where the remainder is retained) and many short folds on a long line, this is repeated full re-scans of the residual buffer, giving roughly O(n^2) behavior on pathological inputs.","fix":"Track the residual column count incrementally (subtract the consumed prefix's contribution) instead of rescanning the whole remaining buffer each emit.","locations":[{"ref":"src/uu/fold/src/fold.rs:339","code":"  339 |     *ctx.col_count = compute_col_count(ctx.output, ctx.mode);","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/fold/src/fold.rs#L339"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Strings mode reads the input one byte at a time via `mf.read(&mut buf)` with a 1-byte buffer, calling through MultifileReader (and ultimately a raw unbuffered file/stdin read) for every single byte. For large inputs this is extremely slow compared to the main od path, which uses a BufReader. The non-strings path is buffered; the strings path is not.","fix":"Wrap the MultifileReader in a BufReader (as open_input_peek_reader does) or read into a larger buffer and iterate over it, instead of issuing one syscall-sized read per byte.","locations":[{"ref":"src/uu/od/src/od.rs:639-686","code":"  639 |     let mut buf = [0u8; 1];\n  640 | \n  641 |     loop {\n  642 |         // Check if we've reached the read_bytes limit\n  643 |         if read_bytes.is_some_and(|l| bytes_read >= l) {\n  644 |             // Special case: when -N limit is reached with a pending string\n  645 |             // that meets min_length, output it even without null terminator\n  646 |             if current_string.len() >= min_length {\n  647 |                 print_string(string_start_offset, &current_string)?;\n  648 |             }\n  649 |             break;\n  650 |         }\n  651 | \n  652 |         // Read one byte at a time\n  653 |         match mf.read(&mut buf) {\n  654 |             Ok(0) => break, // EOF\n  655 |             Ok(_) => {\n  656 |                 bytes_read += 1;\n  657 |                 let byte = buf[0];\n  658 | \n  659 |                 // Check if it's a printable character (including space)\n  660 |                 if (0x20..=0x7E).contains(&byte) {\n  661 |                     if current_string.is_empty() {\n  662 |                         string_start_offset = current_offset;\n  663 |                     }\n  664 |                     current_string.push(byte);\n  665 |                 } else {\n  666 |                     // Either null terminator or non-printable character\n  667 |                     if byte == 0 && current_string.len() >= min_length {\n  668 |                         // Null terminator found with valid string\n  669 |                         print_string(string_start_offset, &current_string)?;\n  670 |                     }\n  671 |                     current_string.clear();\n  672 |                 }\n  673 | \n  674 |                 current_offset += 1;\n  675 |             }\n  676 |             Err(e) => {\n  677 |                 // Note: GNU od does not output unterminated strings at EOF\n  678 |                 // Strings must be null-terminated to be output\n  679 |                 if mf.has_error() {\n  680 |                     show_error!(\"{e}\");\n  681 |                     return Err(1.into());\n  682 |                 }\n  683 |                 break;\n  684 |             }\n  685 |         }\n  686 |     }","lines":48,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/od.rs#L639-L686"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"write_bytes builds each output line by repeatedly push_str-ing freshly allocated String results returned by the per-item formatter functions (format_item_oct16 etc. each allocate and return a String per element). For wide lines and large inputs this allocates one String per formatted item per line. The leading spacing is also emitted via write!(\"{:>width$}\", \"\") formatting an empty string for padding on every item.","fix":"Have formatters write into a provided &mut String / fmt::Write target instead of returning owned Strings, to avoid per-item allocation in the hot loop.","locations":[{"ref":"src/uu/od/src/od.rs:706-742","code":"  706 |     for f in output_info.spaced_formatters_iter() {\n  707 |         let mut output_text = String::new();\n  708 | \n  709 |         let mut b = 0;\n  710 |         while b < input_decoder.length() {\n  711 |             write!(\n  712 |                 output_text,\n  713 |                 \"{:>width$}\",\n  714 |                 \"\",\n  715 |                 width = f.spacing[b % output_info.byte_size_block]\n  716 |             )\n  717 |             .unwrap();\n  718 | \n  719 |             match f.formatter_item_info.formatter {\n  720 |                 FormatWriter::IntWriter(func) => {\n  721 |                     let p = input_decoder.read_uint(b, f.formatter_item_info.byte_size);\n  722 |                     output_text.push_str(&func(p));\n  723 |                 }\n  724 |                 FormatWriter::FloatWriter(func) => {\n  725 |                     let p = input_decoder.read_float(b, f.formatter_item_info.byte_size);\n  726 |                     output_text.push_str(&func(p));\n  727 |                 }\n  728 |                 FormatWriter::LongDoubleWriter(func) => {\n  729 |                     let p = input_decoder.read_long_double(b);\n  730 |                     output_text.push_str(&func(p));\n  731 |                 }\n  732 |                 FormatWriter::BFloatWriter(func) => {\n  733 |                     let p = input_decoder.read_bfloat(b);\n  734 |                     output_text.push_str(&func(p));\n  735 |                 }\n  736 |                 FormatWriter::MultibyteWriter(func) => {\n  737 |                     output_text.push_str(&func(input_decoder.get_full_buffer(b)));\n  738 |                 }\n  739 |             }\n  740 | \n  741 |             b += f.formatter_item_info.byte_size;\n  742 |         }","lines":37,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/od.rs#L706-L742"},{"ref":"src/uu/od/src/prn_int.rs:31-63","code":"   31 | macro_rules! int_writer_unsigned {\n   32 |     ($NAME:ident, $byte_size:expr, $print_width:expr, $function:ident, $format_str:expr) => {\n   33 |         fn $function(p: u64) -> String {\n   34 |             format!($format_str, p, width = $print_width - 1)\n   35 |         }\n   36 | \n   37 |         pub static $NAME: FormatterItemInfo = FormatterItemInfo {\n   38 |             byte_size: $byte_size,\n   39 |             print_width: $print_width,\n   40 |             formatter: FormatWriter::IntWriter($function),\n   41 |         };\n   42 |     };\n   43 | }\n   44 | \n   45 | /// defines a static struct of type `FormatterItemInfo` called `$NAME`\n   46 | ///\n   47 | /// Used to format signed integer types with help of a function called `$function`\n   48 | /// `$byte_size` is the size of the type, `$print_width` is the maximum width in\n   49 | /// human-readable format. `$format_str` should be DEC\n   50 | macro_rules! int_writer_signed {\n   51 |     ($NAME:ident, $byte_size:expr, $print_width:expr, $function:ident, $format_str:expr) => {\n   52 |         fn $function(p: u64) -> String {\n   53 |             let s = sign_extend(p, $byte_size);\n   54 |             format!($format_str, s, width = $print_width - 1)\n   55 |         }\n   56 | \n   57 |         pub static $NAME: FormatterItemInfo = FormatterItemInfo {\n   58 |             byte_size: $byte_size,\n   59 |             print_width: $print_width,\n   60 |             formatter: FormatWriter::IntWriter($function),\n   61 |         };\n   62 |     };\n   63 | }","lines":33,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/prn_int.rs#L31-L63"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In ptx `format_dumb_line`, the padding computation uses `left_part_len` (length excluding a single trunc_str) for the subtraction but compares `left_part.len()` (the full length) against `half_width` to decide whether to pad. These two lengths can differ when the trunc_str is present, so the padding amount and the pad/no-pad decision are computed from inconsistent values, which can yield slightly misaligned columns.","fix":"Use a single consistent length (presumably `left_part_len`) for both the `<` comparison and the subtraction.","locations":[{"ref":"src/uu/ptx/src/ptx.rs:674-687","code":"  674 |     let half_width = cmp::max(config.line_width / 2, config.gap_size);\n  675 | \n  676 |     let left_part_len = if left_part.contains(&config.trunc_str) {\n  677 |         left_part.len() - config.trunc_str.len()\n  678 |     } else {\n  679 |         left_part.len()\n  680 |     };\n  681 | \n  682 |     // Right-justify the left part within the left half\n  683 |     let padding = if left_part.len() < half_width {\n  684 |         half_width - left_part_len\n  685 |     } else {\n  686 |         0\n  687 |     };","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ptx/src/ptx.rs#L674-L687"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In ptx `format_dumb_line`, `left_part.contains(&config.trunc_str)` searches the whole left part for the truncation string, but truncation strings are only ever prepended (at the start). For long lines this is a needless full-substring scan; `starts_with` would suffice and also avoids false positives where trunc_str legitimately appears inside the text.","fix":"Use `left_part.starts_with(&config.trunc_str)` to match the actual placement of the truncation marker.","locations":[{"ref":"src/uu/ptx/src/ptx.rs:676-680","code":"  676 |     let left_part_len = if left_part.contains(&config.trunc_str) {\n  677 |         left_part.len() - config.trunc_str.len()\n  678 |     } else {\n  679 |         left_part.len()\n  680 |     };","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ptx/src/ptx.rs#L676-L680"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`desired_file_buffer_bytes` returns `quarter.max(max)` for inputs larger than\n`MAX_AUTOMATIC_BUF_SIZE`, but every caller funnels the result through\n`clamp_hint`, which clamps to `[MIN, MAX]`. Any value above `max` (the entire\n`quarter`/large-input branch) is therefore immediately clamped back down to\n`max`, making the branch's computation dead - it can never produce a buffer\nlarger than `max`. The function's apparent intent (scale buffer with very large\ninputs) is silently defeated.","fix":"Either drop the unused `quarter` branch and just return `max` for large inputs,\nor stop clamping the file hint to `max` in `clamp_hint`/`file_size_hint` so the\nintended scaling actually takes effect. As written the code is misleading.","locations":[{"ref":"src/uu/sort/src/buffer_hint.rs:71-84","code":"   71 | fn desired_file_buffer_bytes(total_bytes: u128) -> u128 {\n   72 |     if total_bytes == 0 {\n   73 |         return 0;\n   74 |     }\n   75 | \n   76 |     let max = crate::MAX_AUTOMATIC_BUF_SIZE as u128;\n   77 | \n   78 |     if total_bytes <= max {\n   79 |         return total_bytes.saturating_mul(12).clamp(total_bytes, max);\n   80 |     }\n   81 | \n   82 |     let quarter = total_bytes / 4;\n   83 |     quarter.max(max)\n   84 | }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/buffer_hint.rs#L71-L84"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Line::write_debug` re-runs `tokenize` for every selector-bearing line and\nallocates a fresh `Vec` for the transformed line plus `\" \".repeat(indent)` /\n`\"_\".repeat(len)` strings per selector. Although debug output is documented as\nnon-performance-critical, the per-line re-tokenization duplicates work already\ndone during `Line::create` for the same line, and the comment claiming \"there\naren't any special performance optimizations here\" understates that the cost is\nsuper-linear in number of selectors.","fix":"If debug output ever needs to scale, reuse the already-computed token buffer /\nselections instead of re-tokenizing per line. Otherwise the comment is fine but\nthe re-tokenization is genuinely redundant.","locations":[{"ref":"src/uu/sort/src/sort.rs:759-765","code":"  759 |         let mut fields = vec![];\n  760 |         tokenize(\n  761 |             self.line,\n  762 |             settings.separator,\n  763 |             &mut fields,\n  764 |             &settings.precomputed,\n  765 |         );","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/sort.rs#L759-L765"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"n_chunks_by_line_round_robin allocates a fresh `Vec` for every single input line (`let line = &mut Vec::new();` inside the loop). For inputs with many short lines this is one heap allocation per line. The buffer could be allocated once outside the loop and cleared each iteration.","fix":"Hoist `let mut line = Vec::new();` above the loop and call `line.clear();` at the start of each iteration before `read_until`.","locations":[{"ref":"src/uu/split/src/split.rs:1237-1239","code":" 1237 |     loop {\n 1238 |         let line = &mut Vec::new();\n 1239 |         let num_bytes_read = reader.by_ref().read_until(sep, line)?;","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/split.rs#L1237-L1239"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The follow loop drains pending events with a fixed 100-iteration busy spin that combines\n`std::thread::yield_now()` and `std::hint::spin_loop()` on every outer event. When events arrive\nsteadily this burns CPU yielding 100 times per batch even after the queue is empty, and the\ncomment's justification (\"give the notify background thread chances to deliver\") is a timing hack\nrather than a synchronization mechanism - it can both waste CPU and still miss events under load.","fix":"Drain with a short blocking `recv_timeout` (e.g. a few ms) instead of a 100x spin, or break out of the drain loop as soon as `try_recv` returns `Empty` once rather than spinning a fixed count.","locations":[{"ref":"src/uu/tail/src/follow/watch.rs:591-601","code":"  591 |                 // background thread chances to deliver pending events.\n  592 |                 for _ in 0..100 {\n  593 |                     while let Ok(Ok(event)) =\n  594 |                         observer.watcher_rx.as_mut().unwrap().receiver.try_recv()\n  595 |                     {\n  596 |                         process_event(&mut observer, event, settings, &mut paths)?;\n  597 |                     }\n  598 |                     // Use both yield and spin hint for broader CPU support\n  599 |                     std::thread::yield_now();\n  600 |                     std::hint::spin_loop();\n  601 |                 }","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/follow/watch.rs#L591-L601"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"numbered_backup_path performs a linear scan calling fs::symlink_metadata for every\ncandidate index starting at 1, on each invocation. existing_backup_path also probes\n\".~1~\" and then re-runs the full scan from 1. For a target that already has many\nnumbered backups (N existing), creating one backup is O(N) stat syscalls, and a\nbatch of M files becomes O(M*N). This matches GNU's simple approach but is a known\nquadratic cost for large backup counts.","fix":"Acceptable for typical use; if hot, cache the last used index per directory or\nprobe with exponential search before linear refinement.","locations":[{"ref":"src/uucore/src/lib/features/backup_control.rs:443-456","code":"  443 | fn numbered_backup_path(path: &Path) -> PathBuf {\n  444 |     let mut i: u64 = 1;\n  445 |     loop {\n  446 |         let new_path = simple_backup_path(path, OsString::from(format!(\".~{i}~\")));\n  447 |         // Use `symlink_metadata` rather than `exists()` so that a dangling\n  448 |         // symlink still counts as an existing backup (avoiding a silent\n  449 |         // overwrite), and so we do not report a live symlink as missing when\n  450 |         // the target cannot be stat'd.\n  451 |         if fs::symlink_metadata(&new_path).is_err() {\n  452 |             return new_path;\n  453 |         }\n  454 |         i += 1;\n  455 |     }\n  456 | }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/backup_control.rs#L443-L456"},{"ref":"src/uucore/src/lib/features/backup_control.rs:458-464","code":"  458 | fn existing_backup_path<S: AsRef<OsStr>>(path: &Path, suffix: S) -> PathBuf {\n  459 |     let test_path = simple_backup_path(path, OsString::from(\".~1~\"));\n  460 |     if fs::symlink_metadata(&test_path).is_ok() {\n  461 |         return numbered_backup_path(path);\n  462 |     }\n  463 |     simple_backup_path(path, suffix.as_ref())\n  464 | }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/backup_control.rs#L458-L464"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`LineFormat::validate_checksum_format` loops `for index in 0..checksum.len()` and on each iteration\nre-slices `checksum[index..]` and pattern-matches it. This is O(n) overall (each match only inspects the\nfirst 1-3 bytes), so it is not quadratic, but reslicing the whole tail every iteration and matching against\nthe 3 explicit `[b'=', ...]` end-padding patterns (which require the remaining slice length to equal the\npattern length) is needlessly indirect. A single pass over the bytes with index-based lookahead for the\ntrailing `=` run is clearer and avoids constructing tail subslices.","fix":"Iterate over bytes directly, tracking whether base64-specific chars were seen, and validate the trailing\n'=' padding (1-3 chars, only at end) with an explicit suffix check rather than per-index tail slicing.","locations":[{"ref":"src/uucore/src/lib/features/checksum/validate.rs:398-435","code":"  398 |     fn validate_checksum_format(checksum: &[u8]) -> Option<String> {\n  399 |         if checksum.is_empty() {\n  400 |             return None;\n  401 |         }\n  402 | \n  403 |         let mut is_base64 = false;\n  404 | \n  405 |         for index in 0..checksum.len() {\n  406 |             match checksum[index..] {\n  407 |                 // ASCII alphanumeric\n  408 |                 [b'A'..=b'Z' | b'a'..=b'z' | b'0'..=b'9', ..] => (),\n  409 |                 // Base64 special character\n  410 |                 [b'+' | b'/', ..] => is_base64 = true,\n  411 |                 // Base64 end of string padding\n  412 |                 [b'='] | [b'=', b'='] | [b'=', b'=', b'='] => {\n  413 |                     is_base64 = true;\n  414 |                     break;\n  415 |                 }\n  416 |                 // Any other character means the checksum is wrong\n  417 |                 _ => return None,\n  418 |             }\n  419 |         }\n  420 | \n  421 |         // If base64 characters were encountered, make sure the checksum has a\n  422 |         // length multiple of 4.\n  423 |         //\n  424 |         // This check is not enough because it may allow base64-encoded\n  425 |         // checksums that are fully alphanumeric. Another check happens later\n  426 |         // when we are provided with a length hint to detect ambiguous\n  427 |         // base64-encoded checksums.\n  428 |         if is_base64 && !checksum.len().is_multiple_of(4) {\n  429 |             return None;\n  430 |         }\n  431 | \n  432 |         // SAFETY: we just validated the contents of checksum, we can unsafely make a\n  433 |         // String from it\n  434 |         Some(unsafe { String::from_utf8_unchecked(checksum.to_vec()) })\n  435 |     }","lines":38,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/checksum/validate.rs#L398-L435"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Both CQuoter (push_char) and LiteralQuoter (push_char) collect each escaped character into a freshly heap-allocated String and then copy its bytes into the output buffer. This allocates and frees a String for every single character of every filename, and CQuoter::push_invalid does the same per invalid byte. On large directory listings (ls) this is a hot path; the intermediate String is pure overhead since the iterator yields chars that could be written straight into the buffer.","fix":"Write the EscapedChar iterator output directly into self.buffer without an intermediate String, e.g. iterate and push each char's UTF-8 bytes via a small `[u8; 4]` encode buffer (or a reusable scratch String stored on the quoter).","locations":[{"ref":"src/uucore/src/lib/features/quoting_style/c_quoter.rs:35-47","code":"   35 |     fn push_char(&mut self, input: char) {\n   36 |         let escaped: String = EscapedChar::new_c(input, self.quotes, self.dirname)\n   37 |             .hide_control()\n   38 |             .collect();\n   39 |         self.buffer.extend_from_slice(escaped.as_bytes());\n   40 |     }\n   41 | \n   42 |     fn push_invalid(&mut self, input: &[u8]) {\n   43 |         for b in input {\n   44 |             let escaped: String = EscapedChar::new_octal(*b).hide_control().collect();\n   45 |             self.buffer.extend_from_slice(escaped.as_bytes());\n   46 |         }\n   47 |     }","lines":13,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/quoting_style/c_quoter.rs#L35-L47"},{"ref":"src/uucore/src/lib/features/quoting_style/literal_quoter.rs:17-22","code":"   17 |     fn push_char(&mut self, input: char) {\n   18 |         let escaped = EscapedChar::new_literal(input)\n   19 |             .hide_control()\n   20 |             .collect::<String>();\n   21 |         self.0.extend(escaped.as_bytes());\n   22 |     }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/quoting_style/literal_quoter.rs#L17-L22"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The `Quoter::push_char` implementations build a temporary `String` for every single character\nvia `escaped.collect::<String>()` (and `x.to_string()`), then copy its bytes into the buffer.\nFor typical filenames this allocates and frees a small `String` per char. On the hot path of\n`ls` listing many entries this is measurable overhead compared to extending the buffer with\nthe char's UTF-8 encoding directly.","fix":"Write characters directly into the byte buffer using `char::encode_utf8` into a small stack\nbuffer (or `buffer.extend_from_slice(c.encode_utf8(&mut [0;4]).as_bytes())`) and push the\nescaped-char iterator's chars without an intermediate heap `String`.","locations":[{"ref":"src/uucore/src/lib/features/quoting_style/shell_quoter.rs:66-72","code":"   66 |             EscapeState::ForceQuote(x) => {\n   67 |                 self.must_quote = true;\n   68 |                 self.buffer.extend(x.to_string().as_bytes());\n   69 |             }\n   70 |             _ => {\n   71 |                 self.buffer.extend(escaped.collect::<String>().as_bytes());\n   72 |             }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/quoting_style/shell_quoter.rs#L66-L72"},{"ref":"src/uucore/src/lib/features/quoting_style/shell_quoter.rs:142-160","code":"  142 |                 self.buffer.extend(x.to_string().as_bytes());\n  143 |             }\n  144 |             EscapeState::ForceQuote(x) => {\n  145 |                 self.exit_dollar();\n  146 |                 self.must_quote = true;\n  147 |                 self.buffer.extend(x.to_string().as_bytes());\n  148 |             }\n  149 |             // Single quotes are not put in dollar expressions, but are escaped\n  150 |             // if the string also contains double quotes. In that case, they\n  151 |             // must be handled separately.\n  152 |             EscapeState::Backslash('\\'') => {\n  153 |                 self.must_quote = true;\n  154 |                 self.in_dollar = false;\n  155 |                 self.buffer.extend(b\"'\\\\''\");\n  156 |             }\n  157 |             _ => {\n  158 |                 self.enter_dollar();\n  159 |                 self.must_quote = true;\n  160 |                 self.buffer.extend(escaped.collect::<String>().as_bytes());","lines":19,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/quoting_style/shell_quoter.rs#L142-L160"}]},
{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"read_dir_entries dup()s the directory fd and builds a fresh nix::dir::Dir on every\nDirFd::read_dir call. In recursive chown (safe_traverse_dir) this is one extra dup + a\nfull directory open per directory visited. The dup is needed because Dir takes\nownership, but a single read could reuse the fd via fdopendir semantics or read entries\nwith getdents directly to avoid the dup and the second open of the directory stream.","fix":"Minor; if profiling shows it matters, read entries with rustix::fs::Dir/getdents\non a borrowed fd instead of dup + nix::dir::Dir.","locations":[{"ref":"src/uucore/src/lib/features/safe_traversal.rs:114-130","code":"  114 | fn read_dir_entries(fd: &OwnedFd) -> io::Result<Vec<OsString>> {\n  115 |     let mut entries = Vec::new();\n  116 | \n  117 |     // Duplicate the fd for Dir (it takes ownership)\n  118 |     let dup_fd = nix::unistd::dup(fd).map_err(|e| io::Error::from_raw_os_error(e as i32))?;\n  119 |     let mut dir = Dir::from_fd(dup_fd).map_err(|e| io::Error::from_raw_os_error(e as i32))?;\n  120 |     for entry_result in dir.iter() {\n  121 |         let entry = entry_result.map_err(|e| io::Error::from_raw_os_error(e as i32))?;\n  122 |         let name = entry.file_name();\n  123 |         let name_os = OsStr::from_bytes(name.to_bytes());\n  124 |         if name_os != \".\" && name_os != \"..\" {\n  125 |             entries.push(name_os.to_os_string());\n  126 |         }\n  127 |     }\n  128 | \n  129 |     Ok(entries)\n  130 | }","lines":17,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/safe_traversal.rs#L114-L130"}]},
{"id":"PERF_21","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"escape_invalid_bytes builds a Vec<u8> per byte via flat_map returning vec![b] or format!(\"\\\\{b:03o}\").into_bytes(), allocating a small Vec for every single byte of the input. This is only on the invalid-UTF-8 error path so impact is negligible, but it is needlessly allocation-heavy.","fix":"Build a single String with a reserved capacity and push chars / write octal escapes directly, avoiding a per-byte Vec allocation.","locations":[{"ref":"src/uu/date/src/date.rs:232-246","code":"  232 | fn escape_invalid_bytes(bytes: &[u8]) -> String {\n  233 |     let escaped = bytes\n  234 |         .iter()\n  235 |         .flat_map(|&b| {\n  236 |             // Preserve printable ASCII except backslash\n  237 |             if (0x20..0x7f).contains(&b) && b != b'\\\\' {\n  238 |                 vec![b]\n  239 |             } else {\n  240 |                 // Escape as octal: \\NNN\n  241 |                 format!(\"\\\\{b:03o}\").into_bytes()\n  242 |             }\n  243 |         })\n  244 |         .collect::<Vec<u8>>();\n  245 |     String::from_utf8_lossy(&escaped).into_owned()\n  246 | }","lines":15,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/date/src/date.rs#L232-L246"}]},
{"id":"PERF_22","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`draw_lines` clones each visible line on every redraw (`self.lines[index].clone()`) even when there\nis no pattern to highlight, and `search_pattern_in_file` clones the whole pattern string on every\ncall. For large screens / frequent redraws this is unnecessary allocation. The pattern-replace path\nalso re-runs `String::replace` (allocating) for every visible line each frame.","fix":"Only clone/allocate when a pattern is present (write the borrowed line directly otherwise), and take\nthe pattern by reference instead of cloning it in `search_pattern_in_file`.","locations":[{"ref":"src/uu/more/src/more.rs:606-607","code":"  606 |     fn search_pattern_in_file(&mut self) -> Option<usize> {\n  607 |         let pattern = self.pattern.clone().expect(\"pattern should be set\");","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/more/src/more.rs#L606-L607"},{"ref":"src/uu/more/src/more.rs:819-824","code":"  819 |             let mut line = self.lines[index].clone();\n  820 |             if let Some(pattern) = &self.pattern {\n  821 |                 let highlighted = self.highlight_text(pattern);\n  822 |                 line = line.replace(pattern, &highlighted);\n  823 |             }\n  824 |             self.stdout.write_all(format!(\"\\r{line}\\n\").as_bytes())?;","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/more/src/more.rs#L819-L824"}]},
{"id":"PERF_23","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`si_bases_f64()` and `iec_bases_f64()` recompute the 11-element f64 conversion of the base\narrays on every call. They are invoked inside hot paths (`remove_suffix`, `consider_suffix`,\n`transform_*`) once per formatted field. The arrays are constant, so this is redundant work\non each line.","fix":"Cache the converted arrays in a `static`/`OnceLock<[f64; 11]>` (or make them `const` with\nexplicit literals) and return a reference, avoiding per-call recomputation.","locations":[{"ref":"src/uu/numfmt/src/units.rs:10-17","code":"   10 | pub fn si_bases_f64() -> [f64; 11] {\n   11 |     SI_BASES.map(|b| b as f64)\n   12 | }\n   13 | \n   14 | /// `f64` view of [`uucore::parser::parse_size::IEC_BASES`].\n   15 | pub fn iec_bases_f64() -> [f64; 11] {\n   16 |     IEC_BASES.map(|b| b as f64)\n   17 | }","lines":8,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/units.rs#L10-L17"}]},
{"id":"PERF_24","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In `chunks::read`, when the carry-over is larger than the recycled buffer, the\nbuffer is grown with `extend_from_slice(&carry_over[buffer.len()..])`\n(chunks.rs:206) and then the full carry-over is copied again over\n`buffer[..carry_over.len()]` (chunks.rs:208). The bytes appended by the\n`extend` are immediately overwritten by the second copy, so the tail of the\ncarry-over is copied twice.","fix":"Grow the buffer with `buffer.resize(carry_over.len(), 0)` (no data copy) before\nthe single `copy_from_slice`, avoiding the duplicated tail copy.","locations":[{"ref":"src/uu/sort/src/chunks.rs:203-207","code":"  203 |     if buffer.len() < carry_over.len() {\n  204 |         // Separate carry_over and copy them to avoid cost of 0 fill buffer\n  205 |         buffer.extend_from_slice(&carry_over[buffer.len()..]);\n  206 |     }\n  207 |     buffer[..carry_over.len()].copy_from_slice(carry_over);","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/chunks.rs#L203-L207"}]},
{"id":"PERF_25","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"LinesWithSep::next and LinesWithNewlines::next both allocate a new Vec per line read. Same per-line allocation pattern as above; acceptable for correctness but a measurable cost on large line-heavy inputs.","fix":"Consider reusing a buffer where the iterator contract allows, or document that the allocation is intentional.","locations":[{"ref":"src/uu/split/src/split.rs:1283-1290","code":" 1283 |     fn next(&mut self) -> Option<Self::Item> {\n 1284 |         let mut buf = vec![];\n 1285 |         match self.inner.read_until(self.separator, &mut buf) {\n 1286 |             Ok(0) => None,\n 1287 |             Ok(_) => Some(Ok(buf)),\n 1288 |             Err(e) => Some(Err(e)),\n 1289 |         }\n 1290 |     }","lines":8,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/split.rs#L1283-L1290"},{"ref":"src/uu/csplit/src/csplit.rs:88-101","code":"   88 |     fn next(&mut self) -> Option<Self::Item> {\n   89 |         fn ret(v: Vec<u8>) -> io::Result<String> {\n   90 |             String::from_utf8(v).map_err(|_| {\n   91 |                 io::Error::new(ErrorKind::InvalidData, translate!(\"csplit-stream-not-utf8\"))\n   92 |             })\n   93 |         }\n   94 | \n   95 |         let mut v = Vec::new();\n   96 |         match self.inner.read_until(b'\\n', &mut v) {\n   97 |             Ok(0) => None,\n   98 |             Ok(_) => Some(ret(v)),\n   99 |             Err(e) => Some(Err(e)),\n  100 |         }\n  101 |     }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/csplit/src/csplit.rs#L88-L101"}]},
{"id":"PERF_26","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`find_mount_point` calls `p.as_ref().canonicalize()` on every `%m` directive evaluation for\nevery file. The mount list itself is cached via `OnceCell`, but the per-file canonicalize plus\nthe linear scan over all mount points is not a concern for typical use; flagged only as a minor\nnote for very large file lists.","fix":"Acceptable as-is; no change required unless profiling shows it matters.","locations":[{"ref":"src/uu/stat/src/stat.rs:1125-1149","code":" 1125 |     fn find_mount_point<P: AsRef<Path>>(&self, p: P) -> Option<&OsString> {\n 1126 |         if !self.mount_list_needed {\n 1127 |             return None;\n 1128 |         }\n 1129 | \n 1130 |         let mount_list = self.mount_list.get_or_init(|| {\n 1131 |             match Self::populate_mount_list() {\n 1132 |                 Ok(list) => Some(list),\n 1133 |                 Err(e) => {\n 1134 |                     // Show warning like GNU does when mount information cannot be read\n 1135 |                     show_warning!(\n 1136 |                         \"{}\",\n 1137 |                         translate!(\"stat-error-cannot-read-filesystem\", \"error\" => e.to_string())\n 1138 |                     );\n 1139 |                     None\n 1140 |                 }\n 1141 |             }\n 1142 |         });\n 1143 | \n 1144 |         let path = p.as_ref().canonicalize().ok()?;\n 1145 |         mount_list\n 1146 |             .as_ref()?\n 1147 |             .iter()\n 1148 |             .find(|root| path.starts_with(root))\n 1149 |     }","lines":25,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/stat/src/stat.rs#L1125-L1149"}]},
{"id":"PERF_27","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In sum, the SysV checksum path reads into an 8 KiB buffer and folds bytes into a u32 with `wrapping_add`; this is fine, but `bsd_sum` and `sysv_sum` both ignore the `ErrorKind::Interrupted` case by doing `()` and looping, which can busy-spin if the reader persistently returns Interrupted. In practice EINTR is rare, so impact is negligible.","fix":"No change needed in practice; optionally add a bounded retry, though the standard pattern is acceptable.","locations":[{"ref":"src/uu/sum/src/sum.rs:36","code":"   36 |             Err(e) if e.kind() == ErrorKind::Interrupted => (),","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sum/src/sum.rs#L36"},{"ref":"src/uu/sum/src/sum.rs:60","code":"   60 |             Err(e) if e.kind() == ErrorKind::Interrupted => (),","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sum/src/sum.rs#L60"}]},
{"id":"PERF_28","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"get_sign_indicator allocates a fresh heap String for every formatted number just to carry a 0- or\n1-character sign. In hot loops (seq, printf with many specifiers) this is a needless allocation;\na &'static str or a small stack type would avoid it.","fix":"Return a `&'static str` (\"\", \"+\", \" \", \"-\") instead of String, and adjust write_output to take\na &str sign indicator.","locations":[{"ref":"src/uucore/src/lib/features/format/num_format.rs:388-398","code":"  388 | fn get_sign_indicator(sign: PositiveSign, negative: bool) -> String {\n  389 |     if negative {\n  390 |         String::from(\"-\")\n  391 |     } else {\n  392 |         match sign {\n  393 |             PositiveSign::None => String::new(),\n  394 |             PositiveSign::Plus => String::from(\"+\"),\n  395 |             PositiveSign::Space => String::from(\" \"),\n  396 |         }\n  397 |     }\n  398 | }","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/format/num_format.rs#L388-L398"}]},
{"id":"PERF_29","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`stat_split` allocates an owned `String::from(stat)` copy of the whole stat line at the very start\n(line 375) even though the input is already `&str` and the early branch only needs to read it. The owned\ncopy is only ever used through `&str` views; the function then also does `.replace(' ', \"$$\")` and a second\n`.replace(\"$$\", \" \")` per field. For the dead-code `walk_process` path this is minor, but the leading\n`String::from` is pure waste.","fix":"Drop the `let stat = String::from(stat);` copy and operate on the `&str` directly; the buffer `buf` already\nholds the only owned data that is needed.","locations":[{"ref":"src/uucore/src/lib/features/proc_info.rs:374-397","code":"  374 | fn stat_split(stat: &str) -> Vec<String> {\n  375 |     let stat = String::from(stat);\n  376 | \n  377 |     let mut buf = String::with_capacity(stat.len());\n  378 | \n  379 |     let l = stat.find('(');\n  380 |     let r = stat.find(')');\n  381 |     let content = if let (Some(l), Some(r)) = (l, r) {\n  382 |         let replaced = stat[(l + 1)..r].replace(' ', \"$$\");\n  383 | \n  384 |         buf.push_str(&stat[..l]);\n  385 |         buf.push_str(&replaced);\n  386 |         buf.push_str(&stat[(r + 1)..stat.len()]);\n  387 | \n  388 |         &buf\n  389 |     } else {\n  390 |         &stat\n  391 |     };\n  392 | \n  393 |     content\n  394 |         .split_whitespace()\n  395 |         .map(|it| it.replace(\"$$\", \" \"))\n  396 |         .collect()\n  397 | }","lines":24,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/proc_info.rs#L374-L397"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"Inside `safe_du`, the branch that skips symlinks when `options.dereference == Deref::All`\n(the `is_symlink && options.dereference == Deref::All` check) can never be taken. `safe_du`\nis only invoked when `use_safe_traversal` is true, and that is defined as\n`traversal_options.dereference != Deref::All`. Therefore `options.dereference` is guaranteed\nto not be `Deref::All` for the entire `safe_du` call tree, making this conditional and its\ncomment unreachable dead code.","fix":"Remove the `is_symlink && options.dereference == Deref::All` block from `safe_du` (and its\nmisleading comment), since `Deref::All` is always handled by the regular traversal path.","locations":[{"ref":"src/uu/du/src/du.rs:469-476","code":"  469 |         // Handle symlinks with -L option\n  470 |         // For safe traversal with -L, we skip symlinks to directories entirely\n  471 |         // and let the non-safe traversal handle them at the top level\n  472 |         if is_symlink && options.dereference == Deref::All {\n  473 |             // Skip symlinks to directories when using safe traversal with -L\n  474 |             // They will be handled by regular traversal\n  475 |             continue;\n  476 |         }","lines":8,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/du/src/du.rs#L469-L476"},{"ref":"src/uu/du/src/du.rs:1192-1196","code":" 1192 |         // Determine which traversal method to use\n 1193 |         #[cfg(all(unix, not(target_os = \"redox\")))]\n 1194 |         let use_safe_traversal = traversal_options.dereference != Deref::All;\n 1195 |         #[cfg(not(all(unix, not(target_os = \"redox\"))))]\n 1196 |         let use_safe_traversal = false;","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/du/src/du.rs#L1192-L1196"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The `num_chunks_written` field of ByteChunkWriter is incremented (split.rs:758) and initialized but never read anywhere; likewise LineChunkWriter.num_chunks_written is incremented (split.rs:889) and never read. They are write-only counters with no effect on output or diagnostics.","fix":"Remove the unused `num_chunks_written` fields and their increments, or actually use them (e.g. for verbose/error reporting) if intended.","locations":[{"ref":"src/uu/split/src/split.rs:686","code":"  686 |     num_chunks_written: u64,","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/split.rs#L686"},{"ref":"src/uu/split/src/split.rs:686","code":"  686 |     num_chunks_written: u64,","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/split.rs#L686"}]},
