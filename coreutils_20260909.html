<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`Utmpx::login_time()` calls `.unwrap()` on `time::OffsetDateTime::from_unix_timestamp_nanos(ts_nanos)`.\nThe nanosecond timestamp is computed from the raw `ut_tv.tv_sec`/`tv_usec` fields read directly out of\nthe utmp/utmpx file via an unsafe `ptr::read`. A corrupt or hostile utmp record (or simply a record with\nan out-of-range tv_sec on a system with a 64-bit time_t) can produce a timestamp outside the range that\n`time` accepts, which makes this `.unwrap()` panic and abort utilities like `who`, `uptime`, `last`, etc.\nNote the systemd equivalent (`systemd_logind.rs:314-318`) deliberately uses `unwrap_or_else`, so the\nbehavior is also inconsistent between the two backends.","fix":"Replace `.unwrap()` with a graceful fallback, mirroring `SystemdLoginRecord::login_time_offset`\n(e.g. `.unwrap_or_else(|_| OffsetDateTime::UNIX_EPOCH)` or clamp ts_nanos to the valid range), so a\nmalformed utmp entry cannot crash the process.","locations":[{"ref":"src/uucore/src/lib/features/utmpx.rs:257-267","code":"  257 |     pub fn login_time(&self) -> time::OffsetDateTime {\n  258 |         #[allow(clippy::unnecessary_cast)]\n  259 |         let ts_nanos: i128 = (1_000_000_000_i64 * self.inner.ut_tv.tv_sec as i64\n  260 |             + 1_000_i64 * self.inner.ut_tv.tv_usec as i64)\n  261 |             .into();\n  262 |         let local_offset = time::OffsetDateTime::now_local()\n  263 |             .map_or_else(|_| time::UtcOffset::UTC, time::OffsetDateTime::offset);\n  264 |         time::OffsetDateTime::from_unix_timestamp_nanos(ts_nanos)\n  265 |             .unwrap()\n  266 |             .to_offset(local_offset)\n  267 |     }","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/utmpx.rs#L257-L267"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In usage(), the terminal width is computed as `cmp::min(textwrap::termwidth(), 100) - 8`. `textwrap::termwidth()` returns the real terminal column count (falling back to 80 only when no terminal is detected). On a terminal narrower than 8 columns the subtraction underflows: it panics in debug builds and wraps to a gigantic usize in release builds (then passed to textwrap::fill as the wrap width). Running `coreutils --help` (or any path that calls usage) under a very narrow terminal therefore aborts or produces broken wrapping.","fix":"Use a saturating/clamped width, e.g. `let width = cmp::min(textwrap::termwidth(), 100).saturating_sub(8).max(1);` so the width is never zero or wrapped.","locations":[{"ref":"src/bin/coreutils.rs:20-21","code":"   20 |     let width = cmp::min(textwrap::termwidth(), 100) - 8; // (opinion/heuristic) max 100 chars wide with 4 character side indentions\n   21 |     let indent_list = textwrap::indent(&textwrap::fill(&display_list, width), \"    \");","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/coreutils.rs#L20-L21"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Same underflow as in coreutils.rs: `std::cmp::min(termwidth(), 100) - 4 * 2` underflows when the terminal is narrower than 8 columns, panicking in debug or producing a huge wrap width in release when `uudoc --help` is run in a narrow terminal.","fix":"Clamp with saturating_sub and a minimum, e.g. `let width = std::cmp::min(termwidth(), 100).saturating_sub(8).max(1);`.","locations":[{"ref":"src/bin/uudoc.rs:108","code":"  108 |     let width = std::cmp::min(termwidth(), 100) - 4 * 2;","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/uudoc.rs#L108"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In CopyMode::Link, when dereferencing a symlinked source, canonicalize(source, MissingHandling::Missing, ResolveMode::Physical).unwrap() is called. canonicalize can return Err (e.g. inaccessible parent component, ELOOP), which panics instead of producing a diagnostic. Elsewhere in this file canonicalize results are handled with .ok() fallbacks.","fix":"Handle the canonicalize error: propagate it as a CpError, or fall back to hard-linking the source path directly as done in the dereference attribute path (line 2644).","locations":[{"ref":"src/uu/cp/src/cp.rs:2414-2417","code":" 2414 |             if options.dereference(source_in_command_line) && source.is_symlink() {\n 2415 |                 let resolved =\n 2416 |                     canonicalize(source, MissingHandling::Missing, ResolveMode::Physical).unwrap();\n 2417 |                 fs::hard_link(resolved, dest)","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cp/src/cp.rs#L2414-L2417"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In parse_time_style, when both `--full-time` and a time style are present, the code does `options.indices_of(options::TIME_STYLE).unwrap()`. The `field` value can originate from the `TIME_STYLE` environment variable (via the `.env(\"TIME_STYLE\")` on the arg or the explicit `or_else` env read). clap does not assign command-line indices to env-sourced values, so `indices_of` can return `None`, making the `unwrap()` panic. (The companion `indices_of(FULL_TIME).unwrap()` is safe because it is guarded by `get_flag(FULL_TIME)`.)","fix":"Use `options.indices_of(options::TIME_STYLE).and_then(|mut it| it.next_back())` (returning `Option`) and compare the two Options directly, treating a missing index (env-sourced) as \"older\" than an explicit CLI `--full-time`.","locations":[{"ref":"src/uu/ls/src/config.rs:1090-1092","code":" 1090 |         if options.get_flag(options::FULL_TIME)\n 1091 |             && options.indices_of(options::FULL_TIME).unwrap().next_back()\n 1092 |                 > options.indices_of(options::TIME_STYLE).unwrap().next_back()","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/config.rs#L1090-L1092"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"is_hidden on Windows unwraps the result of `file_path.metadata()`. A DirEntry whose metadata cannot be read (e.g. a dangling symlink, a file deleted between readdir and the stat, or a permission error) makes ls panic instead of degrading gracefully. The Unix branch correctly avoids any metadata call.","fix":"Replace `.unwrap()` with a fallback, e.g. `file_path.metadata().map_or(false, |m| (m.file_attributes() & 0x2) > 0)`, treating unreadable entries as non-hidden.","locations":[{"ref":"src/uu/ls/src/display.rs:1281-1287","code":" 1281 | fn is_hidden(file_path: &DirEntry) -> bool {\n 1282 |     #[cfg(windows)]\n 1283 |     {\n 1284 |         let metadata = file_path.metadata().unwrap();\n 1285 |         let attr = metadata.file_attributes();\n 1286 |         (attr & 0x2) > 0\n 1287 |     }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/display.rs#L1281-L1287"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`page_up` indexes `self.lines.get(self.upper_mark).expect(\"line should exist\")` while squeezing.\n`upper_mark` is only guaranteed to be a valid index for lines that have already been read into\n`self.lines`. After navigation patterns that leave `upper_mark >= self.lines.len()` (for example a\npage_down that hit EOF then a page_up that does not reduce far enough, or content shorter than the\nwindow), the `expect` will panic and tear down the terminal via the loose panic hook. The squeeze\nloop should bound-check instead of asserting the line exists.","fix":"Replace the `expect` with a graceful check: `let Some(line) = self.lines.get(self.upper_mark) else { break; };`\nso an out-of-range upper_mark stops the loop instead of panicking.","locations":[{"ref":"src/uu/more/src/more.rs:765-774","code":"  765 |         if self.squeeze {\n  766 |             // Move upper mark to the first non-empty line\n  767 |             while self.upper_mark > 0 {\n  768 |                 let line = self.lines.get(self.upper_mark).expect(\"line should exist\");\n  769 |                 if !line.trim().is_empty() {\n  770 |                     break;\n  771 |                 }\n  772 |                 self.upper_mark = self.upper_mark.saturating_sub(1);\n  773 |             }\n  774 |         }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/more/src/more.rs#L765-L774"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`chunks::read` unwraps the result of `sender.send(payload?)`. If the receiving\nthread (sorter/merger/checker) has already terminated - e.g. because it hit an\nerror and dropped its receiver - this `unwrap()` panics on the reader thread\ninstead of returning gracefully. The threaded ext_sort `sorter` deliberately\nhandles this exact situation by returning silently on send failure, but the\nreader side does not, so a panic (and the accompanying \"thread panicked\" noise\nplus possible abort) can replace clean error propagation.","fix":"Return a `UResult` error (or simply `Ok(false)`/stop) when `sender.send` fails\ninstead of `unwrap()`, mirroring how the sorter thread treats a closed channel\nas a benign shutdown signal.","locations":[{"ref":"src/uu/sort/src/chunks.rs:256","code":"  256 |         sender.send(payload?).unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/chunks.rs#L256"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`handle_event` calls `self.files.get(event_path)` (line 307) and later `get_mut`/`remove` which all\n`.unwrap()` on the `HashMap` lookup. While the primary caller (`process_event`) guards with\n`contains_key`, the `RenameMode::Both` branch (lines 460-473) removes `event_path` and inserts under\n`new_path`, then for descriptor-follow watches `new_path`'s parent. A subsequent event for the old\n`event_path` (still possible due to queued inotify events on the parent dir) would hit\n`self.files.get(event_path)` at line 307 and panic, because the entry was removed. The\n`display_name` fetch at 307 happens before any kind-specific guard.","fix":"Fetch the entry once with a fallible lookup at the top of `handle_event` and return early (Ok(vec![])) when the path is no longer tracked, instead of unwrapping via `get`.","locations":[{"ref":"src/uu/tail/src/follow/watch.rs:304-306","code":"  304 |         let event_path = event.paths.first().unwrap();\n  305 |         let mut paths: Vec<PathBuf> = vec![];\n  306 |         let display_name = self.files.get(event_path).display_name.clone();","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/follow/watch.rs#L304-L306"},{"ref":"src/uu/tail/src/follow/watch.rs:476-489","code":"  476 |                 if self.follow_descriptor() => {\n  477 |                     let new_path = event.paths.last().unwrap();\n  478 |                     paths.push(new_path.clone());\n  479 | \n  480 |                     let new_data = PathData::from_other_with_path(self.files.remove(event_path), new_path);\n  481 |                     self.files.insert(\n  482 |                         new_path,\n  483 |                         new_data,\n  484 |                         self.files.get_last().unwrap() == event_path\n  485 |                     );\n  486 | \n  487 | {"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"MountInfo::new for /proc/self/mountinfo unwraps the position of the `-` separator\nfield: `.position(|c| *c == b\"-\").unwrap()`. A malformed or truncated mountinfo\nline (or one that does not contain a standalone \"-\" token after FIELDS_OFFSET, e.g.\nbecause of unexpected kernel formatting or a short line) makes the unwrap panic,\ntaking down df/any caller of read_fs_list. Real-world mountinfo is normally\nwell-formed, but this is parsing untrusted-ish system input with an unchecked unwrap.","fix":"Replace the unwrap with a `?`/early-return None when the separator or required\nfields are absent, so a bad line is skipped (consistent with filter_map in read_fs_list).","locations":[{"ref":"src/uucore/src/lib/features/fsext.rs:230-235","code":"  230 |                 let after_fields = raw[FIELDS_OFFSET..]\n  231 |                     .iter()\n  232 |                     .position(|c| *c == b\"-\")\n  233 |                     .unwrap()\n  234 |                     + FIELDS_OFFSET\n  235 |                     + 1;","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/fsext.rs#L230-L235"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`ProcessInformation::run_state()` does `self.stat().get(2).unwrap()`. Every other accessor in this file\n(`start_time`, `ppid`, `get_uid_or_gid_field`, etc.) returns `io::Error` when the expected stat field is\nmissing, but `run_state` panics instead. A truncated or unusual `/proc/<pid>/stat` (which can legitimately\nhappen for kernel threads/zombies, or be raced away mid-read) makes this index `.unwrap()` panic rather\nthan return the declared `Err`.","fix":"Return an error instead of unwrapping, e.g.\n`RunState::try_from(self.stat().get(2).ok_or(io::ErrorKind::InvalidData)?.as_str())`.","locations":[{"ref":"src/uucore/src/lib/features/proc_info.rs:295-297","code":"  295 |     pub fn run_state(&mut self) -> Result<RunState, io::Error> {\n  296 |         RunState::try_from(self.stat().get(2).unwrap().as_str())\n  297 |     }","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/proc_info.rs#L295-L297"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"gen_manpage and several MDWriter methods unwrap/expect liberally: `String::from_utf8(buffer).expect(\"Invalid UTF-8 in manpage\")` (line 169), `man.render(...).expect(...)` (166), `io::stdout().write_all(...).unwrap()` and `flush().unwrap()` (177-179), and `self.command.render_version().split_once(' ').unwrap().1` (515). The version().unwrap() in particular panics if render_version() ever returns a string without a space. These are documented as panics in some doc-comments but make uudoc abort with a panic (and a broken-pipe write_all also panics) rather than returning the io::Result the surrounding code uses.","fix":"Propagate errors via `?` where the function returns io::Result, and replace the version split_once unwrap with a graceful fallback (e.g. strip a known prefix or default to the full string) so malformed/edge version strings do not abort the generator.","locations":[{"ref":"src/bin/uudoc.rs:165-178","code":"  165 |     man.render(&mut buffer).expect(\"Man page generation failed\");\n  166 | \n  167 |     // Convert to string for processing\n  168 |     let manpage = String::from_utf8(buffer).expect(\"Invalid UTF-8 in manpage\");\n  169 | \n  170 |     // Post-process the manpage to fix mandoc lint issues\n  171 |     let date = Zoned::now().strftime(\"%Y-%m-%d\").to_string();\n  172 |     let processed_manpage = post_process_manpage(manpage, &date);\n  173 | \n  174 |     // Write the processed manpage to stdout\n  175 |     io::stdout()\n  176 |         .write_all(processed_manpage.as_bytes())\n  177 |         .unwrap();\n  178 |     io::stdout().flush().unwrap();","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/uudoc.rs#L165-L178"},{"ref":"src/bin/uudoc.rs:516-522","code":"  516 |     fn version(&mut self) -> io::Result<()> {\n  517 |         writeln!(\n  518 |             self.w,\n  519 |             \"<div class=\\\"version\\\">v{}<\/div>\",\n  520 |             self.command.render_version().split_once(' ').unwrap().1\n  521 |         )\n  522 |     }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/uudoc.rs#L516-L522"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The Linux/Android non-musl binary_path() does `let argv0 = args.next().unwrap();` and will panic if the argument iterator is empty. The other (musl / non-Linux) implementation of the same function deliberately handles the empty case by falling back to `std::env::current_exe()`. This inconsistency means an empty argv aborts with a Rust panic on Linux glibc instead of using the kernel execfn fallback that is otherwise available here.","fix":"Fall back to the kernel execfn when argv is empty, e.g. `let argv0 = args.next().unwrap_or_else(|| exec_path.as_os_str().to_owned());`, matching the graceful handling in the other cfg branch.","locations":[{"ref":"src/common/validation.rs:128","code":"  128 |     let argv0 = args.next().unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/common/validation.rs#L128"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"InputSplitter::shrink_buffer_to_size and drain_buffer call `line.unwrap()` on the buffered `UResult<String>`, and add_line_to_buffer stores `Ok(line)` then later unwraps. If a buffered item were ever an `Err`, these would panic. In practice an Err line is consumed and `?`-propagated before being buffered, so the invariant holds, but it is an unchecked assumption that a future refactor could break, and it is undocumented.","fix":"Buffer plain `String` values rather than `UResult<String>` (the iterator yields the result; unwrap/propagate the error once at buffering time), eliminating the later unwraps.","locations":[{"ref":"src/uu/csplit/src/csplit.rs:565-579","code":"  565 |     fn shrink_buffer_to_size(&mut self) -> impl Iterator<Item = String> + '_ {\n  566 |         let shrink_offset = if self.buffer.len() > self.size {\n  567 |             self.buffer.len() - self.size\n  568 |         } else {\n  569 |             0\n  570 |         };\n  571 |         self.buffer\n  572 |             .drain(..shrink_offset)\n  573 |             .map(|(_, line)| line.unwrap())\n  574 |     }\n  575 | \n  576 |     /// Drain the content of the buffer.\n  577 |     fn drain_buffer(&mut self) -> impl Iterator<Item = String> + '_ {\n  578 |         self.buffer.drain(..).map(|(_, line)| line.unwrap())\n  579 |     }","lines":15,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/csplit/src/csplit.rs#L565-L579"},{"ref":"src/uu/csplit/src/csplit.rs:589-601","code":"  589 |     fn add_line_to_buffer(&mut self, ln: usize, line: String) -> Option<String> {\n  590 |         if self.rewind {\n  591 |             self.buffer.insert(0, (ln, Ok(line)));\n  592 |             None\n  593 |         } else if self.buffer.len() >= self.size {\n  594 |             let (_, head_line) = self.buffer.remove(0);\n  595 |             self.buffer.push((ln, Ok(line)));\n  596 |             Some(head_line.unwrap())\n  597 |         } else {\n  598 |             self.buffer.push((ln, Ok(line)));\n  599 |             None\n  600 |         }\n  601 |     }","lines":13,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/csplit/src/csplit.rs#L589-L601"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`BufferedOutput::flush` does `let n = wstat.bytes_total.try_into().unwrap()` converting a u128 to usize and then `self.buf.drain(0..n)`. The buffer is at most `obs` bytes so n fits in practice, but the unwrap is an unguarded u128->usize narrowing, and if `write_blocks` ever reported more bytes than buffered (it should not), `drain(0..n)` would panic on an out-of-range range.","fix":"Use `usize::try_from(wstat.bytes_total).unwrap_or(self.buf.len()).min(self.buf.len())` for the drain bound to be robust.","locations":[{"ref":"src/uu/dd/src/bufferedoutput.rs:47-51","code":"   47 |     pub(crate) fn flush(&mut self) -> std::io::Result<WriteStat> {\n   48 |         let wstat = self.inner.write_blocks(&self.buf)?;\n   49 |         let n = wstat.bytes_total.try_into().unwrap();\n   50 |         self.buf.drain(0..n);\n   51 |         Ok(wstat)","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/bufferedoutput.rs#L47-L51"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Several `n.try_into().unwrap()` / `.try_into().unwrap()` calls convert u64 offsets to i64 for seeking and will panic if the value exceeds i64::MAX. `Source::skip` for plain files (line 296) and `Dest::seek` for files (line 665) rely on parseargs having already rejected skip/seek > i64::MAX, but the conversion is unguarded. The `discard_cache` offset conversions at lines 1234, 1258-1259 convert accumulated `write_offset`/lengths with `.unwrap()` and have no such guarantee; with a transfer larger than i64::MAX bytes (u64 counters) they would panic.","fix":"Use checked/`try_into()` with proper error propagation (return an io::Error) instead of `.unwrap()` for these offset conversions, especially the discard_cache offsets which are derived from runtime byte counts.","locations":[{"ref":"src/uu/dd/src/dd.rs:308","code":"  308 |             Self::File(f) => f.seek(SeekFrom::Current(n.try_into().unwrap())),","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/dd.rs#L308"},{"ref":"src/uu/dd/src/dd.rs:681","code":"  681 |                 f.seek(SeekFrom::Current(n.try_into().unwrap()))","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/dd.rs#L681"},{"ref":"src/uu/dd/src/dd.rs:1252","code":" 1252 |                 o.discard_cache(write_offset.try_into().unwrap(), 0);","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/dd.rs#L1252"},{"ref":"src/uu/dd/src/dd.rs:1278-1279","code":" 1278 |             let offset = write_offset.try_into().unwrap();\n 1279 |             let len = write_len.try_into().unwrap();","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/dd.rs#L1278-L1279"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `SuffixType::base_and_suffix`, the loop `while bases[i + 1] - bases[i] < n && i < suffixes.len()` evaluates the array index `bases[i + 1]` BEFORE the bound check `i < suffixes.len()`, and increments `i` inside the body. `bases`/`SI_BASES`/`IEC_BASES` have length 11 but `suffixes` has length 9. If the loop ever advances `i` to 9 (requires `n` larger than the gap `bases[9]-bases[8]`, i.e. ~9e26 for SI), the function returns `suffixes[9]`, which is out of bounds (valid indices 0..=8) and panics. `bytes_total` is a `u128`, so although unrealistic for real transfers it is reachable for huge values. The bound check should also use `i + 1 < bases.len()` and `i < suffixes.len() - 1`.","fix":"Clamp the index: loop while `i + 1 < suffixes.len() && bases[i + 1] <= n` (or `bases[i+1]-bases[i] < n`), so `i` can never exceed `suffixes.len() - 1`, and check the bound before indexing.","locations":[{"ref":"src/uu/dd/src/numbers.rs:26-31","code":"   26 |         let mut i = 0;\n   27 |         while bases[i + 1] - bases[i] < n && i < suffixes.len() {\n   28 |             i += 1;\n   29 |         }\n   30 |         (bases[i], suffixes[i])\n   31 |     }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/numbers.rs#L26-L31"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In display_items (non-long path) leading info is rendered into a byte buffer and then converted with `String::from_utf8(s).unwrap()`. The comment asserts it is \"Should always be UTF-8\". Today the only leading info is inode/allocation-size digits (ASCII), so it holds, but it is a latent panic: any future leading-info field that can contain non-UTF-8 bytes would crash ls.","fix":"Use `String::from_utf8_lossy(&s).into_owned()` (or keep the bytes as an OsString) instead of `unwrap()`.","locations":[{"ref":"src/uu/ls/src/display.rs:443-447","code":"  443 |             let more_info = if should_display_leading_info {\n  444 |                 let mut s = Vec::new();\n  445 |                 display_additional_leading_info(i, &padding, config, &mut s)?;\n  446 |                 Some(String::from_utf8(s).unwrap()) // Should always be UTF-8\n  447 |             } else {","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/display.rs#L443-L447"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`NumberFormat::RightZero::format_to` calls `number.abs()` on the negative branch. If the line number is `i64::MIN` (reachable via `nl -v -9223372036854775808 -n rz`), `i64::abs` overflows and panics in debug builds (wraps to a negative in release, producing a malformed number).","fix":"Use `number.unsigned_abs()` (returns u64) for formatting the magnitude, which handles `i64::MIN` without overflow.","locations":[{"ref":"src/uu/nl/src/nl.rs:143-145","code":"  143 |             Self::RightZero if number < 0 => {\n  144 |                 writer.write_all(b\"-\")?;\n  145 |                 let num = buffer.format(number.abs());","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/nl/src/nl.rs#L143-L145"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `find_stdout()`, `home_out.to_str().unwrap()` panics if the `HOME` environment variable contains non-UTF-8 bytes (legal on Unix). nohup would abort with a Rust panic (exit 101) instead of producing the intended nohup error/exit code when falling back to $HOME/nohup.out.","fix":"Avoid the lossy `to_str().unwrap()`. Work with the `PathBuf`/`OsStr` directly (e.g. open via the path, and use `home_out.to_string_lossy()` only for the error message), so a non-UTF-8 HOME does not panic.","locations":[{"ref":"src/uu/nohup/src/nohup.rs:151-152","code":"  151 |         let home_out = PathBuf::from(home).join(NOHUP_OUT);\n  152 |         let home_out = home_out.to_str().unwrap();","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/nohup/src/nohup.rs#L151-L152"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`find_valid_number_with_suffix` mixes byte length and char count. `numeric_part.len()` is a\nbyte count, but it is used in `s.chars().skip(numeric_part.len())` (char-based skip) and in\nthe inclusive slice `&s[..=numeric_part.len()]` / `&s[..numeric_part.len() + 2]`. These are\nonly safe because the numeric prefix is currently expected to be pure ASCII. The locale\ndecimal separator returned by ICU can be multibyte (e.g. it is not guaranteed ASCII); if a\nmultibyte separator ends up inside `numeric_part`, the inclusive slice can land in the middle\nof a UTF-8 sequence and panic, and the `skip` count becomes wrong.","fix":"Index by bytes consistently: instead of `s.chars().skip(numeric_part.len())`, work from\n`s[numeric_part.len()..].chars()`, and build the returned slices with explicit byte ranges\nvalidated to fall on char boundaries (or use `s.get(..end)`).","locations":[{"ref":"src/uu/numfmt/src/format.rs:54-80","code":"   54 | fn find_valid_number_with_suffix(s: &str, unit: Unit) -> Option<&str> {\n   55 |     let numeric_part = find_numeric_beginning(s)?;\n   56 | \n   57 |     let accepts_suffix = unit != Unit::None;\n   58 |     let accepts_i = [Unit::Auto, Unit::Iec(true)].contains(&unit);\n   59 | \n   60 |     let mut characters = s.chars().skip(numeric_part.len());\n   61 |     let potential_suffix = characters.next();\n   62 |     let potential_i = characters.next();\n   63 | \n   64 |     if !accepts_suffix {\n   65 |         return Some(numeric_part);\n   66 |     }\n   67 | \n   68 |     match (potential_suffix, potential_i) {\n   69 |         (Some(suffix), None) if RawSuffix::try_from(&suffix).is_ok() => {\n   70 |             Some(&s[..=numeric_part.len()])\n   71 |         }\n   72 |         (Some(suffix), Some('i')) if accepts_i && RawSuffix::try_from(&suffix).is_ok() => {\n   73 |             Some(&s[..numeric_part.len() + 2])\n   74 |         }\n   75 |         (Some(suffix), Some(_)) if RawSuffix::try_from(&suffix).is_ok() => {\n   76 |             Some(&s[..=numeric_part.len()])\n   77 |         }\n   78 |         _ => Some(numeric_part),\n   79 |     }\n   80 | }","lines":27,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L54-L80"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"format_item_c indexes bytes[0] without checking that the slice is non-empty. It is reached via MultibyteWriter with get_full_buffer(b), and in normal operation b < length so the slice is non-empty, but the function is a public-ish formatter taking an arbitrary &[u8] and will panic on an empty slice. The accompanying doc comment \"item-bytes == 1\" documents the precondition but it is not enforced.","fix":"Guard against an empty slice (e.g. `let Some(&b) = bytes.first() else { return String::new(); }`) or document/assert the invariant explicitly.","locations":[{"ref":"src/uu/od/src/prn_char.rs:48-50","code":"   48 | fn format_item_c(bytes: &[u8]) -> String {\n   49 |     // item-bytes == 1\n   50 |     let b = bytes[0];","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/prn_char.rs#L48-L50"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"shred `wipe_name` panics via `.expect()` if the renamed file cannot be opened or synced during WipeSync (lines 820-821), and calls `orig_path.file_name().unwrap()` (line 790) which panics if the path ends in `..` or is the root. Additionally the `Err` branch of `fs::rename` calls `std::process::exit(1)` directly (line 831) rather than returning an error, bypassing the caller`s error handling and any cleanup; this is also flagged by an in-code TODO.","fix":"Propagate these as `io::Error`/`UResult` instead of `.expect()` and `process::exit`. Guard `file_name()` against `None`. Let `wipe_file`/`do_remove` surface the error to the per-file `show_if_err!` loop.","locations":[{"ref":"src/uu/shred/src/shred.rs:799","code":"  799 |     let file_name_len = orig_path.file_name().unwrap().len();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/shred/src/shred.rs#L799"},{"ref":"src/uu/shred/src/shred.rs:826-830","code":"  826 |                         let new_file = OpenOptions::new()\n  827 |                             .write(true)\n  828 |                             .open(new_path.clone())\n  829 |                             .expect(\"Failed to open renamed file for syncing\");\n  830 |                         new_file.sync_all().expect(\"Failed to sync renamed file\");","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/shred/src/shred.rs#L826-L830"},{"ref":"src/uu/shred/src/shred.rs:836-841","code":"  836 |                 Err(e) => {\n  837 |                     let msg = translate!(\"shred-couldnt-rename\", \"file\" => last_path.maybe_quote(), \"new_name\" => new_path.quote(), \"error\" => e);\n  838 |                     show_error!(\"{msg}\");\n  839 |                     // TODO: replace with our error management\n  840 |                     std::p {"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`ReverseChunks::new` unconditionally unwraps several seek/stream_position calls\n(`file.stream_position().unwrap()`, `file.seek(SeekFrom::End(0)).unwrap()`), and `next()` unwraps\n`seek` and `read_exact`. `backwards_thru_file` likewise unwraps every `file.seek(...).unwrap()`.\nThese are reached from `bounded_tail`, which is only entered after `is_seekable` succeeded, so in\nthe common case they hold. However a concurrent truncation/replacement of the file between the\nseekability probe and these reads (a real possibility for the files tail targets) turns a transient\nI/O error into a process abort instead of a graceful error. `read_exact` will also panic-abort if\nthe file shrinks mid-read.","fix":"Propagate errors instead of unwrapping. `ReverseChunks::next` and `backwards_thru_file` should return `io::Result` (the latter already returns nothing) and `bounded_tail` should forward the error via `?` rather than aborting.","locations":[{"ref":"src/uu/tail/src/chunks.rs:50-55","code":"   50 |         let current = if cfg!(unix) {\n   51 |             file.stream_position().unwrap()\n   52 |         } else {\n   53 |             0\n   54 |         };\n   55 |         let size = file.seek(SeekFrom::End(0)).unwrap() - current;","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/chunks.rs#L50-L55"},{"ref":"src/uu/tail/src/tail.rs:409-447","code":"  409 | fn backwards_thru_file(file: &mut File, num_delimiters: u64, delimiter: u8) {\n  410 |     if num_delimiters == 0 {\n  411 |         file.seek(SeekFrom::End(0)).unwrap();\n  412 |         return;\n  413 |     }\n  414 |     // This variable counts the number of delimiters found in the file\n  415 |     // so far (reading from the end of the file toward the beginning).\n  416 |     let mut counter = 0;\n  417 |     let mut first_slice = true;\n  418 |     for slice in ReverseChunks::new(file) {\n  419 |         // Iterate over each byte in the slice in reverse order.\n  420 |         let mut iter = memrchr_iter(delimiter, &slice);\n  421 | \n  422 |         // Ignore a trailing newline in the last block, if there is one.\n  423 |         if first_slice {\n  424 |             if slice.last().is_some_and(|&c| c == delimiter) {\n  425 |                 iter.next();\n  426 |             }\n  427 |             first_slice = false;\n  428 |         }\n  429 | \n  430 |         // For each byte, increment the count of the number of\n  431 |         // delimiters found. If we have found more than the specified\n  432 |         // number of delimiters, terminate the search and seek to the\n  433 |         // appropriate location in the file.\n  434 |         for i in iter {\n  435 |             counter += 1;\n  436 |             if counter >= num_delimiters {\n  437 |                 // We should never over-count - assert that.\n  438 |                 assert_eq!(counter, num_delimiters);\n  439 |                 // After each iteration of the outer loop, the\n  440 |                 // cursor in the file is at the *beginning* of the\n  441 |                 // block, so seeking forward by `i + 1` bytes puts\n  442 |                 // us right after the found delimiter.\n  443 |                 file.seek(SeekFrom::Current((i + 1) as i64)).unwrap();\n  444 |                 return;\n  445 |             }\n  446 |         }\n  447 |     }","lines":39,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/tail.rs#L409-L447"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In test, the `-nt` and `-ot` file comparison operators call `f_a.modified().unwrap()` / `f_b.modified().unwrap()`. `Metadata::modified()` returns an error on platforms/filesystems that do not expose a modification time, which would panic instead of producing a clean error. The same pattern appears in `path()` for `-N` (`accessed().unwrap()` and `modified().unwrap()`).","fix":"Handle the `Err` case of `modified()`/`accessed()` gracefully (treat the comparison as false / unsupported) instead of unwrapping, or map it to a ParseError.","locations":[{"ref":"src/uu/test/src/test.rs:312-315","code":"  312 |         (Some(\"-nt\"), Ok(f_a), Ok(f_b)) => f_a.modified().unwrap() > f_b.modified().unwrap(),\n  313 |         (Some(\"-nt\"), Ok(_), _) => true,\n  314 |         (Some(\"-ot\"), Ok(f_a), Ok(f_b)) => f_a.modified().unwrap() < f_b.modified().unwrap(),\n  315 |         (Some(\"-ot\"), _, Ok(_)) => true,","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/test/src/test.rs#L312-L315"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"tr `parse_octal_up_to_three_digits_with_warning` indexes `input[0..2]` and `input[2]` (and `char::from_u32(input[2]).unwrap()`) inside the warning branch. This relies on `input` having at least 3 bytes, which currently holds because the branch only fires after `recognize(many_m_n(1,3,...))` matched 3 octal digits, but the slicing is done on the original `input` rather than the recognized span, so the coupling is fragile and would panic if the parser combinator is ever refactored.","fix":"Use the recognized digit slice (the `out` argument already in scope is the matched bytes) for indexing/length checks instead of re-slicing the raw `input`, and use `.get(..)`/pattern matching rather than direct indexing.","locations":[{"ref":"src/uu/tr/src/operation.rs:500-522","code":"  500 |     fn parse_octal_up_to_three_digits_with_warning(input: &[u8]) -> IResult<&[u8], u8> {\n  501 |         map_opt(\n  502 |             recognize(many_m_n(1, 3, one_of(\"01234567\"))),\n  503 |             |out: &[u8]| {\n  504 |                 let str_to_parse = std::str::from_utf8(out).unwrap();\n  505 |                 let result = u8::from_str_radix(str_to_parse, 8).ok();\n  506 |                 if result.is_none() {\n  507 |                     if let Ok(origin_octal) = std::str::from_utf8(input) {\n  508 |                         let actual_octal_tail: &str = std::str::from_utf8(&input[0..2]).unwrap();\n  509 |                         let outstand_char: char = char::from_u32(input[2] as u32).unwrap();\n  510 |                         show_warning!(\n  511 |                             \"{}\",\n  512 |                             translate!(\"tr-warning-ambiguous-octal-escape\", \"origin_octal\" => origin_octal, \"actual_octal_tail\" => actual_octal_tail, \"outstand_char\" => outstand_char)\n  513 |                         );\n  514 |                     } else {\n  515 |                         show_warning!(\"{}\", translate!(\"tr-warning-invalid-utf8\"));\n  516 |                     }\n  517 |                 }\n  518 |                 result\n  519 |             },\n  520 |         )\n  521 |         .parse(input)\n  522 |     }","lines":23,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tr/src/operation.rs#L500-L522"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Passwd::belongs_to uses `ngroups.try_into().unwrap()` and `vec![0; ngroups...]`\nwhere ngroups is c_int. getgrouplist is documented to possibly leave ngroups\nunchanged on some platforms; the loop doubles it, but if a buggy libc set ngroups\nnegative, try_into::<usize>() unwraps to a panic. Also the final\n`assert!(ngroups <= groups.len())` will abort the process if libc reports more\ngroups than the buffer (should not happen, but it is an assert in a library path).","fix":"Clamp ngroups to a sane non-negative range and replace the assert with a\nsaturating truncate (`groups.truncate(ngroups.min(groups.len()))`).","locations":[{"ref":"src/uucore/src/lib/features/entries.rs:184-212","code":"  184 |     pub fn belongs_to(&self) -> Vec<gid_t> {\n  185 |         let mut ngroups: c_int = 8;\n  186 |         let mut ngroups_old: c_int;\n  187 |         let mut groups = vec![0; ngroups.try_into().unwrap()];\n  188 |         let name = CString::new(self.name.as_bytes()).unwrap();\n  189 |         loop {\n  190 |             ngroups_old = ngroups;\n  191 |             if unsafe {\n  192 |                 getgrouplist(\n  193 |                     name.as_ptr(),\n  194 |                     self.gid,\n  195 |                     groups.as_mut_ptr(),\n  196 |                     &raw mut ngroups,\n  197 |                 )\n  198 |             } == -1\n  199 |             {\n  200 |                 if ngroups == ngroups_old {\n  201 |                     ngroups *= 2;\n  202 |                 }\n  203 |                 groups.resize(ngroups.try_into().unwrap(), 0);\n  204 |             } else {\n  205 |                 break;\n  206 |             }\n  207 |         }\n  208 |         let ngroups = ngroups.try_into().unwrap();\n  209 |         assert!(ngroups <= groups.len());\n  210 |         groups.truncate(ngroups);\n  211 |         groups\n  212 |     }","lines":29,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/entries.rs#L184-L212"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"EscapeOctal::from_char calls c.encode_utf8(&mut buf) into a fixed `[u8; 2]` buffer (line 91-92). char::encode_utf8 panics if the buffer is too small, so passing any 3- or 4-byte char panics rather than 'silently truncating'. The doc comment 'Only supports characters up to 2 bytes long in UTF-8' understates this: it is a hard panic, not a soft limitation. Currently unreachable because the only callers pass chars that are is_control() (C0/C1, at most 2 bytes in UTF-8), but it is a latent panic with no guard, and any future reuse of from_char with a wider char would crash.","fix":"Size the buffer to char::MAX (`let mut buf = [0u8; 4];`) and store all len_utf8() bytes, or debug_assert!(c.len_utf8() <= 2) plus a documented invariant; emit octal for every byte of the encoding instead of only two.","locations":[{"ref":"src/uucore/src/lib/features/quoting_style/escaped_char.rs:85-98","code":"   85 | impl EscapeOctal {\n   86 |     fn from_char(c: char) -> Self {\n   87 |         if c.len_utf8() == 1 {\n   88 |             return Self::from_byte(c as u8);\n   89 |         }\n   90 | \n   91 |         let mut buf = [0; 2];\n   92 |         let _s = c.encode_utf8(&mut buf);\n   93 |         Self {\n   94 |             c: buf,\n   95 |             idx: 2,\n   96 |             state: EscapeOctalState::FirstBackslash,\n   97 |         }\n   98 |     }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/quoting_style/escaped_char.rs#L85-L98"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"SplitWriter::writeln panics with `panic!(...)` if called while current_writer is None and not dev_null. This is an internal-invariant assertion (a writer is always created before writeln), but it is a hard panic reachable only via a logic bug; it is acceptable defensively but worth noting as a potential abort path rather than a returned error.","fix":"Return an io::Error / CsplitError instead of panicking, or convert to debug_assert! if the invariant is guaranteed.","locations":[{"ref":"src/uu/csplit/src/csplit.rs:296-307","code":"  296 |     fn writeln(&mut self, line: &str) -> io::Result<()> {\n  297 |         if !self.dev_null {\n  298 |             if let Some(ref mut current_writer) = self.current_writer {\n  299 |                 let bytes = line.as_bytes();\n  300 |                 current_writer.write_all(bytes)?;\n  301 |                 self.size += bytes.len();\n  302 |             } else {\n  303 |                 panic!(\"{}\", translate!(\"csplit-write-split-not-created\"))\n  304 |             }\n  305 |         }\n  306 |         Ok(())\n  307 |     }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/csplit/src/csplit.rs#L296-L307"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"TextOutput::new computes `SystemTime::now() - Duration::new(31_556_952 / 2, 0)` for the recent-time range. If the system clock is set to within ~6 months of the Unix epoch (or earlier), this SystemTime subtraction can panic on platforms where SystemTime cannot represent pre-epoch instants. Extremely unlikely in practice but unguarded.","fix":"Use `SystemTime::now().checked_sub(Duration::new(31_556_952 / 2, 0)).unwrap_or(UNIX_EPOCH)` to avoid the potential panic.","locations":[{"ref":"src/uu/ls/src/ls.rs:1053-1054","code":" 1053 |                 recent_time_range: (SystemTime::now() - Duration::new(31_556_952 / 2, 0))\n 1054 |                     ..=SystemTime::now(),","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/ls.rs#L1053-L1054"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"In mktemp `exec`, after creating the temp file/dir, `path.file_name()` is `.unwrap()`ed and then `.to_str().unwrap()` is called. If tempfile ever returns a path whose final component is non-UTF-8 (possible when prefix/suffix carry non-UTF-8 via the `-t` lossy path), `to_str().unwrap()` panics. The Params path uses lossy conversion for `-t`, so the random part is ASCII and prefix/suffix are already valid UTF-8 strings, making this currently unreachable, but it is a latent panic.","fix":"Handle the non-UTF-8 case by joining the OsStr file_name directly instead of converting through `to_str().unwrap()`.","locations":[{"ref":"src/uu/mktemp/src/mktemp.rs:631-632","code":"  631 |     let filename = path.file_name();\n  632 |     let filename = filename.unwrap().to_str().unwrap();","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mktemp/src/mktemp.rs#L631-L632"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"In ptx `write_traditional_output`, `Regex::new(&config.context_regex).unwrap()` will panic if the context regex is invalid. The default and `--traditional` values are valid, and there is no CLI option that sets `context_regex` to arbitrary user input, so this is currently unreachable, but the `.unwrap()` is a latent panic if a future option ever feeds user input into `context_regex`.","fix":"Propagate the error instead of unwrapping, or document the invariant.","locations":[{"ref":"src/uu/ptx/src/ptx.rs:792","code":"  792 |     let context_reg = Regex::new(&config.context_regex).unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ptx/src/ptx.rs#L792"}]},
{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"translate_regex_flavor ends with String::from_utf8(result).expect(\"produces ASCII bytes\"). The invariant holds today (all pushed bytes are ASCII or ASCII hex escapes), but it is an unchecked expect tied to a non-local invariant: any future edit that pushes a raw non-ASCII byte into `result` turns a bad regex into a process panic instead of a clean error.","fix":"Build the result as a String directly (push chars / write! into a String) so the type system guarantees valid UTF-8, removing the runtime expect.","locations":[{"ref":"src/uu/tac/src/tac.rs:319","code":"  319 |     String::from_utf8(result).expect(\"produces ASCII bytes\")","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tac/src/tac.rs#L319"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"In `report_if_verbose`, `signal_list_name_by_value(signal).unwrap()` will panic if called with a signal value that has no name. The current call sites pass either SIGKILL or a value derived from a received signal / configured signal, so in practice the value is always valid, but an out-of-range realtime/unknown signal forwarded via the external-signal path (`received_sig as usize`) could in principle yield `None`.","fix":"Use `unwrap_or_else(|| signal.to_string())` so an unnamed signal degrades to its numeric form instead of panicking.","locations":[{"ref":"src/uu/timeout/src/timeout.rs:182-185","code":"  182 |             \"0\".to_string()\n  183 |         } else {\n  184 |             signal_list_name_by_value(signal).unwrap()\n  185 |         };","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/timeout/src/timeout.rs#L182-L185"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`Row::from_filesystem` computes byte totals as `blocks * blocksize`, `bused * blocksize`, and\n`bavail * blocksize`, all `u64 * u64` with no overflow protection. For large filesystems these\nproducts can exceed `u64::MAX` (e.g. a multi-exabyte reported size, or bogus values from a\nbuggy/remote statfs). In debug builds this panics; in release it silently wraps to a wrong size.\nGNU df clamps such values rather than wrapping.","fix":"Use `saturating_mul` (or compute in u128 then clamp) for `blocks * blocksize`,\n`bused * blocksize`, and `bavail * blocksize`.","locations":[{"ref":"src/uu/df/src/table.rs:159-168","code":"  159 |         let bused = blocks.saturating_sub(bfree);\n  160 |         let fused = files.saturating_sub(ffree);\n  161 |         Self {\n  162 |             file: fs.file,\n  163 |             fs_device: dev_name,\n  164 |             fs_type,\n  165 |             fs_mount: mount_dir,\n  166 |             bytes: BytesCell::new(blocks * blocksize, row_block_size),\n  167 |             bytes_used: BytesCell::new(bused * blocksize, row_block_size),\n  168 |             bytes_avail: BytesCell::new(bavail * blocksize, row_block_size),","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/df/src/table.rs#L159-L168"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `calc_loop_bsize`, the Blocks branch computes `rremain * ibs as u64` with an unchecked multiply. `rremain` is bounded by `count` and `ibs` is bounded by usize, but a large `count=` combined with a large `ibs=` can overflow u64 (panic in debug, wrap in release). The result is only used via `cmp::min` against `ideal_bsize`, but a wrapped value can produce a too-small or zero loop buffer size.","fix":"Use `rremain.saturating_mul(ibs as u64)` so the min() with ideal_bsize still yields the correct (clamped) value.","locations":[{"ref":"src/uu/dd/src/dd.rs:1475-1479","code":" 1475 |         Some(Num::Blocks(rmax)) => {\n 1476 |             let rsofar = rstat.reads_complete + rstat.reads_partial;\n 1477 |             let rremain = rmax - rsofar;\n 1478 |             cmp::min(ideal_bsize as u64, rremain * ibs as u64) as usize\n 1479 |         }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/dd.rs#L1475-L1479"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`BytesCell::add` and the `inodes`/`inodes_used`/`inodes_free` additions in `Row::add_assign`\nadd raw `u64`/`u128` totals with the `+` operator across all filesystems for the `--total`\nrow. The `BytesCell { bytes, scaled }` additions are plain `u64 + u64`; summing many large\nfilesystems can overflow u64 (panic in debug, wrap in release). The inode sums use u128 so are\neffectively safe, but the byte sums are not.","fix":"Use `saturating_add` for the `bytes`/`scaled` fields in `BytesCell::add`, matching the\nsaturating handling already used elsewhere, so the total row cannot overflow.","locations":[{"ref":"src/uu/df/src/table.rs:226-235","code":"  226 | impl Add for BytesCell {\n  227 |     type Output = Self;\n  228 | \n  229 |     fn add(self, rhs: Self) -> Self {\n  230 |         Self {\n  231 |             bytes: self.bytes + rhs.bytes,\n  232 |             scaled: self.scaled + rhs.scaled,\n  233 |         }\n  234 |     }\n  235 | }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/df/src/table.rs#L226-L235"},{"ref":"src/uu/df/src/table.rs:103-108","code":"  103 |     fn add_assign(&mut self, rhs: Self) {\n  104 |         let bytes = self.bytes + rhs.bytes;\n  105 |         let bytes_used = self.bytes_used + rhs.bytes_used;\n  106 |         let bytes_avail = self.bytes_avail + rhs.bytes_avail;\n  107 |         let inodes = self.inodes + rhs.inodes;\n  108 |         let inodes_used = self.inodes_used + rhs.inodes_used;","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/df/src/table.rs#L103-L108"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`parse_unit_size_suffix` casts the u128 base array entries to usize: `SI_BASES[i + 1] as usize`\nand `IEC_BASES[i + 1] as usize`. On a 32-bit target `usize` is 32 bits and any suffix from\n`T`/`Ti` upward (1e12 / 1024^4 and larger) silently truncates, yielding a wrong (small)\nmultiplier with no error. On 64-bit targets the `E` value (1e18) still fits, but the cast is\nfragile and platform-dependent.","fix":"Compute in u128 (or u64) and convert with `usize::try_from(...).ok()?`, returning None on\noverflow so the caller emits an invalid-unit-size error rather than silently truncating.","locations":[{"ref":"src/uu/numfmt/src/numfmt.rs:296-300","code":"  296 |     match s.len() {\n  297 |         1 => Some(SI_BASES[i + 1] as usize),\n  298 |         2 if s.ends_with('i') => Some(IEC_BASES[i + 1] as usize),\n  299 |         _ => None,\n  300 |     }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/numfmt.rs#L296-L300"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"InputOffset::increase_position does self.byte_pos += n and label = Some(l + n) with unchecked u64 additions. byte_pos starts at skip_bytes (which may be up to u64::MAX from a label/offset operand) and increases by each line length. With a very large --skip-bytes or label plus a large file, these additions can overflow and panic in debug builds (silently wrap in release). The label addition in particular combines a user-supplied label with the running position.","fix":"Use wrapping_add or saturating_add (GNU od wraps the printed offset), or document and bound the inputs so overflow cannot occur.","locations":[{"ref":"src/uu/od/src/input_offset.rs:37-42","code":"   37 |     pub fn increase_position(&mut self, n: u64) {\n   38 |         self.byte_pos += n;\n   39 |         if let Some(l) = self.label {\n   40 |             self.label = Some(l + n);\n   41 |         }\n   42 |     }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/input_offset.rs#L37-L42"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"parse_number_of_bytes does `len -= 1` (and `len -= 2` for the B-suffix case) on the byte length. For the B-suffix branch with a single-character-after-prefix input these decrements could underflow usize if `len` were < 2, but in practice `len` always includes the leading 0/0x so it is >= 2 before any decrement. The B-branch then parses `s[start..len]`; if the input is exactly \"0B\" this yields start=0,len=0 and `s[0..0]` parses as an error (empty), so no panic. The arithmetic is safe today only because of the guaranteed prefix length, which is an implicit invariant.","fix":"Use checked_sub or validate the remaining length before subtracting, to make the suffix-stripping robust against malformed short inputs independent of the prefix invariant.","locations":[{"ref":"src/uu/od/src/parse_nrofbytes.rs:54-68","code":"   54 |         Some('B') if radix != 16 => {\n   55 |             len -= 2;\n   56 |             multiply = match ends_with.next() {\n   57 |                 Some('k' | 'K') => 1000,\n   58 |                 Some('m' | 'M') => 1000 * 1000,\n   59 |                 Some('G') => 1000 * 1000 * 1000,\n   60 |                 #[cfg(target_pointer_width = \"64\")]\n   61 |                 Some('T') => 1000 * 1000 * 1000 * 1000,\n   62 |                 #[cfg(target_pointer_width = \"64\")]\n   63 |                 Some('P') => 1000 * 1000 * 1000 * 1000 * 1000,\n   64 |                 #[cfg(target_pointer_width = \"64\")]\n   65 |                 Some('E') => 1000 * 1000 * 1000 * 1000 * 1000 * 1000,\n   66 |                 _ => return Err(ParseSizeError::ParseFailure(s.to_string())),\n   67 |             }\n   68 |         }","lines":15,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/parse_nrofbytes.rs#L54-L68"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`bounded_tail` computes `file.seek(SeekFrom::End(-(*count as i64)))` for `Bytes(Negative(count))`.\n`count` is a `u64`; for values above `i64::MAX` the `as i64` cast wraps to a negative number and\n`-(...)` may overflow/produce an unintended offset. Similarly `backwards_thru_file` casts the\nin-block index `(i + 1) as i64` (bounded, safe) but the byte-count path relies on the seek. With a\npathological `-c` value the seek offset is wrong rather than failing cleanly; in practice the\n`is_err()` branch only catches genuine seek failures, not the silent wrap.","fix":"Clamp `count` to the file size (or to `i64::MAX`) before negating, e.g. seek from Start using `size.saturating_sub(count)` instead of negating a possibly-overflowing `i64`.","locations":[{"ref":"src/uu/tail/src/tail.rs:471-476","code":"  471 |         FilterMode::Bytes(Signum::Negative(count)) => {\n  472 |             if file.seek(SeekFrom::End(-(*count as i64))).is_err() {\n  473 |                 file.seek(SeekFrom::Start(0)).unwrap();\n  474 |             }\n  475 |             limit = Some(*count);\n  476 |         }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/tail.rs#L471-L476"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"size_mb * 1024 * 1024 can overflow usize on 32-bit targets and will panic in debug or wrap in release. While these are benchmark helpers, the multiplication is unchecked and a large size_mb passed by a caller silently produces a wrong-sized allocation (release) or panics. Same pattern in text_data::generate_by_size (size_mb * 1024 * 1024).","fix":"Use checked_mul or compute as `(size_mb as u64) * 1024 * 1024` with an explicit conversion/assert, or document the precondition. For bench code low priority, but at minimum prefer saturating/checked arithmetic.","locations":[{"ref":"src/uucore/src/lib/features/benchmark.rs:314","code":"  314 |         let buffer = vec![pattern; size_mb * 1024 * 1024];","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/benchmark.rs#L314"},{"ref":"src/uucore/src/lib/features/benchmark.rs:65","code":"   65 |         let total_size = size_mb * 1024 * 1024;","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/benchmark.rs#L65"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"fast_inc performs `inc[inc_pos] + carry` and `new_val += val[pos] - b'0'` on u8 values with no checked/wrapping handling. The function documents the precondition that val and inc are well-formed ASCII digits, under which no overflow occurs; but if a caller violates the contract (non-digit byte, or a digit < b'0' making the subtraction underflow), this silently wraps in release builds and panics only in debug. There is no validation, so malformed input corrupts the buffer silently in release.","fix":"If misuse is a realistic risk, use wrapping_/checked_ arithmetic with a debug_assert on the digit range, or add a debug_assert!(inc[inc_pos].is_ascii_digit()) and debug_assert!(val[pos].is_ascii_digit()) to surface contract violations during development.","locations":[{"ref":"src/uucore/src/lib/features/fast_inc.rs:45-56","code":"   45 |         let mut new_val = inc[inc_pos] + carry;\n   46 |         // Be careful here, only add existing digit of val.\n   47 |         if pos >= *start {\n   48 |             new_val += val[pos] - b'0';\n   49 |         }\n   50 |         if new_val > b'9' {\n   51 |             carry = 1;\n   52 |             new_val -= 10;\n   53 |         } else {\n   54 |             carry = 0;\n   55 |         }\n   56 |         val[pos] = new_val;","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/fast_inc.rs#L45-L56"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"medium","description":"comm total counters total_col_1/2/3 are inferred as i32 (from the `0` literals and `+= 1`). With more than 2^31 lines in a column they overflow, panicking in debug builds and wrapping in release. GNU comm uses an unsigned max-width integer for --total.","fix":"Declare the counters as u64 (e.g. `let mut total_col_1: u64 = 0;`).","locations":[{"ref":"src/uu/comm/src/comm.rs:183-185","code":"  183 |     let mut total_col_1 = 0;\n  184 |     let mut total_col_2 = 0;\n  185 |     let mut total_col_3 = 0;","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/comm/src/comm.rs#L183-L185"},{"ref":"src/uu/comm/src/comm.rs:264-272","code":"  264 |     if opts.get_flag(options::TOTAL) {\n  265 |         let line_ending = LineEnding::from_zero_flag(opts.get_flag(options::ZERO_TERMINATED));\n  266 |         write!(\n  267 |             writer,\n  268 |             \"{total_col_1}{delim}{total_col_2}{delim}{total_col_3}{delim}{}{line_ending}\",\n  269 |             translate!(\"comm-total\")\n  270 |         )\n  271 |         .map_err_context(|| translate!(\"comm-error-write\"))?;\n  272 |     }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/comm/src/comm.rs#L264-L272"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"FilterWriter::drop claims to close the child shell stdin by dropping it, but `let _stdin = self.shell_process.stdin.as_mut();` only takes (and immediately drops) an `Option<&mut ChildStdin>` borrow. The actual ChildStdin is never taken/dropped, so the write end of the pipe stays open inside `shell_process`. The subsequent `self.shell_process.wait()` can therefore block forever for any filter command that reads its stdin to EOF (e.g. `--filter=cat`), because the child never sees EOF. To actually close stdin the code must `self.shell_process.stdin.take()` (and drop the owned value), not borrow it.","fix":"Replace the borrow with an owned take so the pipe is closed before wait: `{ let _stdin = self.shell_process.stdin.take(); }` then `self.shell_process.wait()`.","locations":[{"ref":"src/uu/split/src/platform/unix.rs:105-109","code":"  105 |     fn drop(&mut self) {\n  106 |         {\n  107 |             // close stdin by dropping it\n  108 |             let _stdin = self.shell_process.stdin.as_mut();\n  109 |         }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/platform/unix.rs#L105-L109"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In base32/base_common `fast_decode_stream`, when an invalid (non-alphabet, non-garbage) byte is encountered, the code first flushes/decodes already-buffered chunks and then returns the \"invalid input\" error. But in the non-partial-decode branch it drains in units of `decode_in_chunks_of_size` via `while buffer.len() >= decode_in_chunks_of_size`, leaving a partial (already-valid) remainder in `buffer` undecoded and silently dropped before the error return. The buffer-based `fast_decode_buffer` does not have this pre-error flush at all, so the two paths emit different amounts of valid output before reporting the same error, an inconsistency.","fix":"Make the pre-error flush behavior consistent between the streaming and buffered decoders (either both flush all decodable bytes before erroring, or neither does), matching GNU base32/base64 output-on-error semantics.","locations":[{"ref":"src/uu/base32/src/base_common.rs:823-844","code":"  823 |                 } else {\n  824 |                     if supports_partial_decode {\n  825 |                         flush_ready_chunks(\n  826 |                             &mut buffer,\n  827 |                             decode_in_chunks_of_size,\n  828 |                             valid_multiple,\n  829 |                             supports_fast_decode_and_encode,\n  830 |                             &mut decoded_buffer,\n  831 |                             output,\n  832 |                         )?;\n  833 |                     } else {\n  834 |                         while buffer.len() >= decode_in_chunks_of_size {\n  835 |                             decode_in_chunks_to_buffer(\n  836 |                                 supports_fast_decode_and_encode,\n  837 |                                 &buffer[..decode_in_chunks_of_size],\n  838 |                                 &mut decoded_buffer,\n  839 |                             )?;\n  840 |                             write_to_output(&mut decoded_buffer, output)?;\n  841 |                             buffer.drain(..decode_in_chunks_of_size);\n  842 |                         }\n  843 |                     }\n  844 |                     return Err(USimpleError::new(1, \"error: invalid input\"));","lines":22,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/base32/src/base_common.rs#L823-L844"},{"ref":"src/uu/base32/src/base_common.rs:722-786","code":"  722 |         for &byte in &input {\n  723 |             if byte == b'\\n' || byte == b'\\r' {\n  724 |                 continue;\n  725 |             }\n  726 | \n  727 |             if alphabet_table[usize::from(byte)] {\n  728 |                 buffer.push(byte);\n  729 |             } else if ignore_garbage {\n  730 |                 continue;\n  731 |             } else {\n  732 |                 return Err(USimpleError::new(1, \"error: invalid input\"));\n  733 |             }\n  734 | \n  735 |             if supports_partial_decode {\n  736 |                 flush_ready_chunks(\n  737 |                     &mut buffer,\n  738 |                     decode_in_chunks_of_size,\n  739 |                     valid_multiple,\n  740 |                     supports_fast_decode_and_encode,\n  741 |                     &mut decoded_buffer,\n  742 |                     output,\n  743 |                 )?;\n  744 |             } else if buffer.len() == decode_in_chunks_of_size {\n  745 |                 decode_in_chunks_to_buffer(\n  746 |                     supports_fast_decode_and_encode,\n  747 |                     &buffer,\n  748 |                     &mut decoded_buffer,\n  749 |                 )?;\n  750 |                 write_to_output(&mut decoded_buffer, output)?;\n  751 |                 buffer.clear();\n  752 |             }\n  753 |         }\n  754 | \n  755 |         if supports_partial_decode {\n  756 |             flush_ready_chunks(\n  757 |                 &mut buffer,\n  758 |                 decode_in_chunks_of_size,\n  759 |                 valid_multiple,\n  760 |                 supports_fast_decode_and_encode,\n  761 |                 &mut decoded_buffer,\n  762 |                 output,\n  763 |             )?;\n  764 |         }\n  765 | \n  766 |         if !buffer.is_empty() {\n  767 |             let mut owned_chunk: Option<Vec<u8>> = None;\n  768 |             let mut had_invalid_tail = false;\n  769 | \n  770 |             if let Some(pad_result) = supports_fast_decode_and_encode.pad_remainder(&buffer) {\n  771 |                 had_invalid_tail = pad_result.had_invalid_tail;\n  772 |                 owned_chunk = Some(pad_result.chunk);\n  773 |             }\n  774 | \n  775 |             let final_chunk = owned_chunk.as_deref().unwrap_or(&buffer);\n  776 | \n  777 |             supports_fast_decode_and_encode.decode_into_vec(final_chunk, &mut decoded_buffer)?;\n  778 |             write_to_output(&mut decoded_buffer, output)?;\n  779 | \n  780 |             if had_invalid_tail {\n  781 |                 return Err(USimpleError::new(1, \"error: invalid input\"));\n  782 |             }\n  783 |         }\n  784 | \n  785 |         Ok(())\n  786 |     }","lines":65,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/base32/src/base_common.rs#L722-L786"}]},
