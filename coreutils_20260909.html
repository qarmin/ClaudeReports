{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In install standard(), the SameFile guard in copy_file uses canonicalize on both paths, but the fd-based fast path (copy_file_safe) compares only dev+ino of the target obtained via stat_at with SymlinkBehavior::Follow against the source metadata. When the source itself is a symlink, copy_file_safe uses metadata(from) (follows the link) while the path-based copy_file canonicalizes; the two code paths can disagree about what counts as the same file, and copy_file_safe additionally unlinks the destination (line 780) before this check is fully equivalent. The inconsistency is subtle but means -D installs into a freshly created leading dir can behave differently from ordinary installs for symlinked sources.","fix":"Unify the same-file detection used by copy_file and copy_file_safe (resolve the source consistently and compare dev/ino in both), or document why the divergence is acceptable.","locations":[{"ref":"src/uu/install/src/install.rs:985-991","code":"  985 | fn copy_file(from: &Path, to: &Path) -> UResult<()> {\n  986 |     use std::os::unix::fs::OpenOptionsExt;\n  987 |     if let Ok(to_abs) = to.canonicalize()\n  988 |         && from.canonicalize()? == to_abs\n  989 |     {\n  990 |         return Err(InstallError::SameFile(from.to_path_buf(), to.to_path_buf()).into());\n  991 |     }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/install/src/install.rs#L985-L991"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `normalize_list_signal_value`, the low-8-bits branch (`signal_value & 0xff`) is checked first and returns whenever the masked value is <= upper bound. For inputs in [128,159] that GNU treats as \"128 + signal\" exit statuses, the `& 0xff` of e.g. 130 is 130 which is > typical upper bound so it falls through to the checked_sub(128) branch correctly; but for an input like 256 (0x100), `256 & 0xff == 0`, which is <= upper bound and returns signal 0, masking the intended out-of-range error. GNU `kill -l 256` reports an invalid signal rather than printing signal 0.","fix":"Only apply the low-8-bits masking for values that are not already representable as a direct/offset signal, or reject values where `signal_value > 0xff` unless they decode via the 128+ offset rule, to match GNU error reporting.","locations":[{"ref":"src/uu/kill/src/kill.rs:186-197","code":"  186 | fn normalize_list_signal_value(signal_value: usize) -> Option<usize> {\n  187 |     // `kill -l` also accepts wait-status-like values and decodes the signal\n  188 |     // number from the low 8 bits.\n  189 |     let lower_8_bits = signal_value & 0xff;\n  190 |     if lower_8_bits <= signal_number_upper_bound() {\n  191 |         return Some(lower_8_bits);\n  192 |     }\n  193 | \n  194 |     signal_value\n  195 |         .checked_sub(OFFSET)\n  196 |         .filter(|value| *value <= signal_number_upper_bound())\n  197 | }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/kill/src/kill.rs#L186-L197"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"mknod parses MAJOR and MINOR with clap value_parser!(u32) and then casts to makedev(maj as _, min as _). On systems where device numbers are encoded with more than 32 bits, or simply for major/minor values that GNU mknod accepts (it parses as uintmax and validates against dev_t), large but valid arguments are rejected at parse time with a generic clap error rather than mknod's own range diagnostic. This is a behavioral divergence from GNU mknod for large device numbers.","fix":"Parse major/minor as the widest integer type and validate the resulting dev_t range explicitly, matching GNU mknod error messages.","locations":[{"ref":"src/uu/mknod/src/mknod.rs:267-278","code":"  267 |         .arg(\n  268 |             Arg::new(options::MAJOR)\n  269 |                 .value_name(options::MAJOR)\n  270 |                 .help(translate!(\"mknod-help-major\"))\n  271 |                 .value_parser(value_parser!(u32)),\n  272 |         )\n  273 |         .arg(\n  274 |             Arg::new(options::MINOR)\n  275 |                 .value_name(options::MINOR)\n  276 |                 .help(translate!(\"mknod-help-minor\"))\n  277 |                 .value_parser(value_parser!(u32)),\n  278 |         )","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mknod/src/mknod.rs#L267-L278"},{"ref":"src/uu/mknod/src/mknod.rs:195-214","code":"  195 |     let dev = match (\n  196 |         file_type,\n  197 |         matches.get_one::<u32>(options::MAJOR),\n  198 |         matches.get_one::<u32>(options::MINOR),\n  199 |     ) {\n  200 |         (FileType::Fifo, None, None) => 0,\n  201 |         (FileType::Fifo, _, _) => {\n  202 |             return Err(UUsageError::new(\n  203 |                 1,\n  204 |                 translate!(\"mknod-error-fifo-no-major-minor\"),\n  205 |             ));\n  206 |         }\n  207 |         (_, Some(&major), Some(&minor)) => makedev(major as _, minor as _) as u64,\n  208 |         _ => {\n  209 |             return Err(UUsageError::new(\n  210 |                 1,\n  211 |                 translate!(\"mknod-error-special-require-major-minor\"),\n  212 |             ));\n  213 |         }\n  214 |     };","lines":20,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mknod/src/mknod.rs#L195-L214"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The status-bar percentage uses `lower_mark = (upper_mark + content_rows).min(lines.len() - 1)` and\nindexes `cumulative_line_sizes[lower_mark]`. When `--squeeze` collapses blank lines, the number of\ninput lines consumed to fill the screen is larger than `content_rows` (the squeezed lines are\ncounted in `lines_squeezed`, not added here), so the reported percentage lags behind the actual\nread position. The computation ignores `lines_squeezed`.","fix":"Account for squeezed lines when computing `lower_mark`, e.g. add `self.lines_squeezed` to the\nwindow span before clamping, mirroring how `page_up` already incorporates `lines_squeezed`.","locations":[{"ref":"src/uu/more/src/more.rs:848-880","code":"  848 |     fn draw_status_bar(&mut self, wrong_key: Option<char>) -> std::io::Result<()> {\n  849 |         // Calculate the index of the last visible line\n  850 |         let lower_mark =\n  851 |             (self.upper_mark + self.content_rows).min(self.lines.len().saturating_sub(1));\n  852 |         // Determine progress information to display\n  853 |         // - Show next file name when at EOF and there is a next file\n  854 |         // - Otherwise show percentage of the file read (if available)\n  855 |         let progress_info = if self.eof_reached {\n  856 |             self.next_file\n  857 |                 .as_ref()\n  858 |                 .map(|next_file| format!(\" (Next file: {next_file})\"))\n  859 |                 .unwrap_or_default()\n  860 |         } else if let Some(file_size) = self.input.len() {\n  861 |             // For files, show percentage or END\n  862 |             let position = self\n  863 |                 .cumulative_line_sizes\n  864 |                 .get(lower_mark)\n  865 |                 .copied()\n  866 |                 .unwrap_or_default();\n  867 |             if file_size == 0 {\n  868 |                 \" (END)\".to_string()\n  869 |             } else {\n  870 |                 let percentage = (position as f64 / file_size as f64 * 100.0).round() as u16;\n  871 |                 if percentage >= 100 {\n  872 |                     \" (END)\".to_string()\n  873 |                 } else {\n  874 |                     format!(\" ({percentage}%)\")\n  875 |                 }\n  876 |             }\n  877 |         } else {\n  878 |             // For stdin, don't show percentage\n  879 |             String::new()\n  880 |         };","lines":33,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/more/src/more.rs#L848-L880"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `draw_status_bar`, when EOF is reached but there is no next file, `progress_info` becomes the\nempty string (the `next_file` map/`unwrap_or_default`), so the status bar shows neither a percentage\nnor \"(END)\". GNU more shows \"(END)\" at end-of-file. The END marker is only produced in the\nnon-EOF percentage branch (when `percentage >= 100`), which is not taken once `eof_reached` is set.","fix":"When `eof_reached` and there is no next file, fall back to displaying the \"(END)\" marker instead of\nan empty progress string.","locations":[{"ref":"src/uu/more/src/more.rs:855-880","code":"  855 |         let progress_info = if self.eof_reached {\n  856 |             self.next_file\n  857 |                 .as_ref()\n  858 |                 .map(|next_file| format!(\" (Next file: {next_file})\"))\n  859 |                 .unwrap_or_default()\n  860 |         } else if let Some(file_size) = self.input.len() {\n  861 |             // For files, show percentage or END\n  862 |             let position = self\n  863 |                 .cumulative_line_sizes\n  864 |                 .get(lower_mark)\n  865 |                 .copied()\n  866 |                 .unwrap_or_default();\n  867 |             if file_size == 0 {\n  868 |                 \" (END)\".to_string()\n  869 |             } else {\n  870 |                 let percentage = (position as f64 / file_size as f64 * 100.0).round() as u16;\n  871 |                 if percentage >= 100 {\n  872 |                     \" (END)\".to_string()\n  873 |                 } else {\n  874 |                     format!(\" ({percentage}%)\")\n  875 |                 }\n  876 |             }\n  877 |         } else {\n  878 |             // For stdin, don't show percentage\n  879 |             String::new()\n  880 |         };","lines":26,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/more/src/more.rs#L855-L880"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"assert_not_same_file calls absolute(source)? / absolute(target)? up to four times each (lines 470-499) and canonicalize repeatedly, doing redundant filesystem work and re-deriving the same absolute paths. Besides the performance cost, the repeated `absolute(target)?` in the `_ =>` fallback (line 499) can diverge from the value computed at line 493 if the cwd-relative resolution is non-deterministic under concurrent cwd changes (it is not, but the duplication is fragile).","fix":"Compute absolute(source) and absolute(target) once into locals and reuse them.","locations":[{"ref":"src/uu/mv/src/mv.rs:490-528","code":"  490 | fn assert_not_same_file(\n  491 |     source: &Path,\n  492 |     target: &Path,\n  493 |     target_is_dir: bool,\n  494 |     opts: &Options,\n  495 | ) -> UResult<()> {\n  496 |     // we'll compare canonicalized_source and canonicalized_target for same file detection\n  497 |     let canonicalized_source = match canonicalize(\n  498 |         absolute(source)?,\n  499 |         MissingHandling::Normal,\n  500 |         ResolveMode::Logical,\n  501 |     ) {\n  502 |         Ok(source) if source.exists() => source,\n  503 |         _ => absolute(source)?, // file or symlink target doesn't exist but its absolute path is still used for comparison\n  504 |     };\n  505 | \n  506 |     // special case if the target exists, is a directory, and the `-T` flag wasn't used\n  507 |     let target_is_dir = target_is_dir && !opts.no_target_dir;\n  508 |     let canonicalized_target = if target_is_dir {\n  509 |         // `mv source_file target_dir` => target_dir/source_file\n  510 |         // canonicalize the path that exists (target directory) and join the source file name\n  511 |         canonicalize(\n  512 |             absolute(target)?,\n  513 |             MissingHandling::Normal,\n  514 |             ResolveMode::Logical,\n  515 |         )?\n  516 |         .join(source.file_name().unwrap_or_default())\n  517 |     } else {\n  518 |         // `mv source target_dir/target` => target_dir/target\n  519 |         // we canonicalize target_dir and join /target\n  520 |         match absolute(target)?.parent() {\n  521 |             Some(parent) if parent.to_str() != Some(\"\") => {\n  522 |                 canonicalize(parent, MissingHandling::Normal, ResolveMode::Logical)?\n  523 |                     .join(target.file_name().unwrap_or_default())\n  524 |             }\n  525 |             // path.parent() returns Some(\"\") or None if there's no parent\n  526 |             _ => absolute(target)?, // absolute paths should always have a parent, but we'll fall back just in case\n  527 |         }\n  528 |     };","lines":39,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mv/src/mv.rs#L490-L528"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In rename_with_fallback the decision to fall back to copy+delete is `matches!(err.raw_os_error(), Some(EXDEV)) || (from.is_file() && can_delete_file(from))`. On non-windows can_delete_file always returns false, so the second clause is dead on unix; but on windows the clause `from.is_file() && can_delete_file(from)` triggers a copy+delete fallback for ANY rename error on a file that is openable with DELETE access, including transient errors that should propagate. This can convert a recoverable rename failure into a destructive copy+delete.","fix":"On Windows, restrict the fallback to the specific access-denied/sharing-violation case described in the comment rather than any error when the file is delete-openable.","locations":[{"ref":"src/uu/mv/src/mv.rs:945-953","code":"  945 |         // We will only copy if:\n  946 |         // 1. Files are on different devices (EXDEV error)\n  947 |         // 2. On Windows, if the target file exists and source file is opened by another process\n  948 |         //    (MoveFileExW fails with \"Access Denied\" even if the source file has FILE_SHARE_DELETE permission)\n  949 |         let should_fallback =\n  950 |             matches!(err.raw_os_error(), Some(EXDEV)) || (from.is_file() && can_delete_file(from));\n  951 |         if !should_fallback {\n  952 |             return Err(err);\n  953 |         }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mv/src/mv.rs#L945-L953"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"rename_fifo_fallback (cross-device fifo move) creates a new fifo at dest with a hardcoded mode 0o666 (subject to umask) and then removes the source, discarding the source fifo permissions and ownership entirely. Unlike copy_file_with_hardlinks_helper which calls preserve_ownership after mkfifo, this standalone fallback does not preserve ownership or mode, silently changing the moved fifo metadata.","fix":"After mkfifo, restore source mode and ownership (mirror copy_file_with_hardlinks_helper) before removing the source.","locations":[{"ref":"src/uu/mv/src/mv.rs:1001-1009","code":" 1001 | #[cfg(unix)]\n 1002 | fn rename_fifo_fallback(from: &Path, to: &Path) -> io::Result<()> {\n 1003 |     if to.try_exists()? {\n 1004 |         fs::remove_file(to)?;\n 1005 |     }\n 1006 |     // rustix::fs::mkfifoat is linux only\n 1007 |     nix::unistd::mkfifo(to, nix::sys::stat::Mode::from_bits_truncate(0o666))?;\n 1008 |     fs::remove_file(from)\n 1009 | }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mv/src/mv.rs#L1001-L1009"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"read_long_double reads 16 bytes as a u128 and converts an IEEE binary128 (quad) bit pattern to f64 via u128_to_f64. Real C `long double` on x86/x86-64 is the 80-bit extended format (different exponent/mantissa layout), not binary128, and on many platforms long double is just f64. Interpreting the 16 raw bytes as binary128 will produce incorrect values on the common x86 80-bit case (the bytes are an 80-bit value padded to 16, not a 128-bit quad). The comment claims this \"ensures endianness swapping works correctly\" but it does not make the numeric interpretation correct for the platform long double layout.","fix":"Decode according to the actual platform long double format (or document that od only supports the binary128 interpretation), and fix the comment to not overstate correctness.","locations":[{"ref":"src/uu/od/src/input_decoder.rs:152-206","code":"  152 |     /// Returns a long double from the internal buffer at position `start`.\n  153 |     /// We read 16 bytes as u128 (respecting endianness) and convert to f64.\n  154 |     /// This ensures that endianness swapping works correctly even if we lose precision.\n  155 |     pub fn read_long_double(&self, start: usize) -> f64 {\n  156 |         let bits = self.byte_order.read_u128(&self.data[start..start + 16]);\n  157 |         u128_to_f64(bits)\n  158 |     }\n  159 | }\n  160 | \n  161 | fn u128_to_f64(u: u128) -> f64 {\n  162 |     let sign = (u >> 127) as u64;\n  163 |     let exp = ((u >> 112) & 0x7FFF) as u64;\n  164 |     let mant = u & ((1 << 112) - 1);\n  165 | \n  166 |     if exp == 0x7FFF {\n  167 |         // Infinity or NaN\n  168 |         if mant == 0 {\n  169 |             if sign == 0 {\n  170 |                 f64::INFINITY\n  171 |             } else {\n  172 |                 f64::NEG_INFINITY\n  173 |             }\n  174 |         } else {\n  175 |             f64::NAN\n  176 |         }\n  177 |     } else if exp == 0 {\n  178 |         // Subnormal or zero\n  179 |         if mant == 0 {\n  180 |             if sign == 0 { 0.0 } else { -0.0 }\n  181 |         } else {\n  182 |             // Subnormal f128 is too small for f64, flush to zero\n  183 |             if sign == 0 { 0.0 } else { -0.0 }\n  184 |         }\n  185 |     } else {\n  186 |         // Normal\n  187 |         let new_exp = exp as i64 - 16383 + 1023;\n  188 |         if new_exp >= 2047 {\n  189 |             // Overflow to infinity\n  190 |             if sign == 0 {\n  191 |                 f64::INFINITY\n  192 |             } else {\n  193 |                 f64::NEG_INFINITY\n  194 |             }\n  195 |         } else if new_exp <= 0 {\n  196 |             // Underflow to zero\n  197 |             if sign == 0 { 0.0 } else { -0.0 }\n  198 |         } else {\n  199 |             // Normal f64\n  200 |             // Mantissa: take top 52 bits of 112-bit mantissa\n  201 |             let new_mant = (mant >> (112 - 52)) as u64;\n  202 |             let bits = (sign << 63) | ((new_exp as u64) << 52) | new_mant;\n  203 |             f64::from_bits(bits)\n  204 |         }\n  205 |     }\n  206 | }","lines":55,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/input_decoder.rs#L152-L206"},{"ref":"src/uu/od/src/prn_float.rs:285-311","code":"  285 | fn format_long_double(f: f64) -> String {\n  286 |     // On most platforms, long double is either 64-bit (same as f64) or 80-bit/128-bit\n  287 |     // Since we're reading it as f64, we format it with extended precision\n  288 |     // Width is 39 (40 - 1 for leading space), precision is 21 significant digits\n  289 |     let width: usize = 39;\n  290 |     let precision: usize = 21;\n  291 | \n  292 |     // Handle special cases\n  293 |     if f.is_nan() {\n  294 |         return format!(\"{:>width$}\", \"NaN\");\n  295 |     }\n  296 |     if f.is_infinite() {\n  297 |         if f.is_sign_negative() {\n  298 |             return format!(\"{:>width$}\", \"-inf\");\n  299 |         }\n  300 |         return format!(\"{:>width$}\", \"inf\");\n  301 |     }\n  302 |     if f == 0.0 {\n  303 |         if f.is_sign_negative() {\n  304 |             return format!(\"{:>width$}\", \"-0\");\n  305 |         }\n  306 |         return format!(\"{:>width$}\", \"0\");\n  307 |     }\n  308 | \n  309 |     // For normal numbers, format with appropriate precision using exponential notation\n  310 |     format!(\"{f:>width$.precision$e}\")\n  311 | }","lines":27,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/prn_float.rs#L285-L311"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"option_display_name scans args for a token starting with the short form (e.g. \"-j\") to decide whether to echo the short or long flag in error messages. The check `!arg.starts_with(\"--\") && arg.starts_with(&short_form)` will match a clustered/unrelated argument that merely begins with the same letter combination (e.g. for short \"-w\" it would match \"-width\"-like tokens, or a bundled \"-vw16\" matches \"-w\"? no, but \"-j...\" for skip would match any arg starting \"-j\"). More notably, for an option whose value is given separately it matches the flag token, which is fine, but for bundled short flags the heuristic can misattribute which flag triggered the error. This only affects the cosmetic flag name shown in error messages.","fix":"Match the short flag more precisely (e.g. ensure the matched character is an actual cluster member), or derive the display name from the clap matched argument id rather than re-scanning raw args.","locations":[{"ref":"src/uu/od/src/od.rs:807-826","code":"  807 | fn option_display_name(args: &[String], option_name: &str, short: Option<char>) -> String {\n  808 |     let long_form = format!(\"--{option_name}\");\n  809 |     let long_form_with_eq = format!(\"{long_form}=\");\n  810 |     if let Some(short_char) = short {\n  811 |         let short_form = format!(\"-{short_char}\");\n  812 |         for arg in args.iter().skip(1) {\n  813 |             if !arg.starts_with(\"--\") && arg.starts_with(&short_form) {\n  814 |                 return short_form;\n  815 |             }\n  816 |         }\n  817 |         for arg in args.iter().skip(1) {\n  818 |             if arg == &long_form || arg.starts_with(&long_form_with_eq) {\n  819 |                 return long_form;\n  820 |             }\n  821 |         }\n  822 |         short_form\n  823 |     } else {\n  824 |         long_form\n  825 |     }\n  826 | }","lines":20,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/od.rs#L807-L826"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In parse_inputs, when an offset-like operand fails to parse, the code reconstructs the expected ERANGE message string via std::io::Error::from_raw_os_error(libc::ERANGE) and compares the localized/stripped error string to decide whether to propagate an overflow error or fall through to treating it as a filename. This string-equality dispatch is fragile: parse_offset_operand already knows whether the failure was an overflow vs a parse failure, but that information is discarded and then reconstructed by comparing human-readable (potentially localized) strings. A locale change or message-format change in either place silently breaks the overflow-detection branch.","fix":"Have parse_offset_operand return a typed error (e.g. an enum distinguishing Overflow from ParseFailure) instead of a pre-formatted String, and branch on the variant in parse_inputs rather than comparing reconstructed message strings.","locations":[{"ref":"src/uu/od/src/parse_inputs.rs:87-98","code":"   87 |                 Err(e) => {\n   88 |                     // If it's an overflow error, propagate it\n   89 |                     // Otherwise, treat it as a filename\n   90 |                     let err = std::io::Error::from_raw_os_error(libc::ERANGE);\n   91 |                     let msg = err.to_string();\n   92 |                     let expected_msg = msg.split(\" (os error\").next().unwrap_or(&msg).to_string();\n   93 | \n   94 |                     if e == expected_msg {\n   95 |                         return Err(format!(\"{}: {e}\", input_strings[input_strings.len() - 1]));\n   96 |                     }\n   97 |                 }\n   98 |             }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/parse_inputs.rs#L87-L98"},{"ref":"src/uu/od/src/parse_inputs.rs:207-234","code":"  207 |     match u64::from_str_radix(&s[start..len], radix) {\n  208 |         Ok(i) => {\n  209 |             // Check for overflow during multiplication\n  210 |             if let Some(result) = i.checked_mul(multiply) {\n  211 |                 Ok(result)\n  212 |             } else {\n  213 |                 let err = std::io::Error::from_raw_os_error(libc::ERANGE);\n  214 |                 let msg = err.to_string();\n  215 |                 // Strip \"(os error N)\" if present to match Perl's $!\n  216 |                 let msg = msg.split(\" (os error\").next().unwrap_or(&msg).to_string();\n  217 |                 Err(msg)\n  218 |             }\n  219 |         }\n  220 |         Err(e) => {\n  221 |             // Distinguish between overflow and parse failure\n  222 |             // from_str_radix returns IntErrorKind::PosOverflow for overflow\n  223 |             use std::num::IntErrorKind;\n  224 |             match e.kind() {\n  225 |                 IntErrorKind::PosOverflow => {\n  226 |                     let err = std::io::Error::from_raw_os_error(libc::ERANGE);\n  227 |                     let msg = err.to_string();\n  228 |                     let msg = msg.split(\" (os error\").next().unwrap_or(&msg).to_string();\n  229 |                     Err(msg)\n  230 |                 }\n  231 |                 _ => Err(translate!(\"od-error-parse-failed\")),\n  232 |             }\n  233 |         }\n  234 |     }","lines":28,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/parse_inputs.rs#L207-L234"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"format_ascii_dump indexes C_CHARS[*c as usize] directly for bytes in 0x20..=0x7e. This is safe because C_CHARS has 128 entries and the range is within bounds, but it is inconsistent with format_item_c which uses C_CHARS.get(...) defensively. The direct index relies on the exact magic range matching the table size; a future edit to the range bound (e.g. raising to 0x7f or 0x80) would introduce an out-of-bounds panic that the .get() pattern would have avoided.","fix":"Use C_CHARS.get(*c as usize) with a fallback, mirroring format_item_c, to make the bounds safety independent of the literal range check.","locations":[{"ref":"src/uu/od/src/prn_char.rs:64-78","code":"   64 | pub fn format_ascii_dump(bytes: &[u8]) -> String {\n   65 |     let mut result = String::new();\n   66 | \n   67 |     result.push('>');\n   68 |     for c in bytes {\n   69 |         if *c >= 0x20 && *c <= 0x7e {\n   70 |             result.push_str(C_CHARS[*c as usize]);\n   71 |         } else {\n   72 |             result.push('.');\n   73 |         }\n   74 |     }\n   75 |     result.push('<');\n   76 | \n   77 |     result\n   78 | }","lines":15,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/prn_char.rs#L64-L78"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"format_f32_exp / format_f64_exp use `f.abs().log10() < 0.0` to decide whether to reserve a column for the exponent plus sign. For values whose log10 floors to exactly 0 due to floating rounding near powers of ten (e.g. just under 1.0 vs just at 1.0), the branch boundary at log10 == 0.0 can pick the wrong width, producing a value formatted one character too wide or with inconsistent plus-sign placement. This is the same class of precision-at-boundary issue the format_float code explicitly works around with its `r > f` correction, but the exp helpers do not apply any such correction.","fix":"Use the sign of the actual exponent that will be emitted (or compare against 1.0 directly with care) rather than log10 < 0.0, to make the +/- column reservation robust to rounding at powers of ten.","locations":[{"ref":"src/uu/od/src/prn_float.rs:109-134","code":"  109 | fn format_f32_exp(f: f32, width: usize) -> String {\n  110 |     if f.abs().log10() < 0.0 {\n  111 |         return format!(\"{f:width$e}\");\n  112 |     }\n  113 |     // Leave room for the '+' sign\n  114 |     let formatted = format!(\"{f:width$e}\", width = width - 1);\n  115 |     formatted.replace('e', \"e+\")\n  116 | }\n  117 | \n  118 | fn format_f64_exp(f: f64, width: usize) -> String {\n  119 |     if f.abs().log10() < 0.0 {\n  120 |         return format!(\"{f:width$e}\");\n  121 |     }\n  122 |     // Leave room for the '+' sign\n  123 |     let formatted = format!(\"{f:width$e}\", width = width - 1);\n  124 |     formatted.replace('e', \"e+\")\n  125 | }\n  126 | \n  127 | fn format_f64_exp_precision(f: f64, width: usize, precision: usize) -> String {\n  128 |     if f.abs().log10() < 0.0 {\n  129 |         return format!(\"{f:width$.precision$e}\");\n  130 |     }\n  131 |     // Leave room for the '+' sign\n  132 |     let formatted = format!(\"{f:width$.precision$e}\", width = width - 1);\n  133 |     formatted.replace('e', \"e+\")\n  134 | }","lines":26,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/prn_float.rs#L109-L134"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`pathchk` builds path components from `p.to_string_lossy()` and then measures POSIX path/name\nlength limits with `.len()` on those (possibly lossy) UTF-8 strings. For non-UTF8 file names,\ninvalid bytes are replaced by U+FFFD (3 bytes each), so the measured length no longer matches\nthe real byte length GNU pathchk would check, and the portable-character check operates on the\nreplacement character rather than the original bytes. The operands are accepted as `OsString`\nspecifically to preserve raw bytes, but that fidelity is discarded here.","fix":"Operate on the raw bytes of the `OsStr` (e.g. via `OsStrExt::as_bytes` on unix) when splitting\non `/` and measuring lengths, instead of going through `to_string_lossy()`.","locations":[{"ref":"src/uu/pathchk/src/pathchk.rs:77-84","code":"   77 |     for p in paths.unwrap() {\n   78 |         let path_str = p.to_string_lossy();\n   79 |         let mut path = Vec::new();\n   80 |         for path_segment in path_str.split('/') {\n   81 |             path.push(path_segment.to_string());\n   82 |         }\n   83 |         res &= check_path(&mode, &path);\n   84 |     }","lines":8,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/pathchk/src/pathchk.rs#L77-L84"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In pinky long format `write_long`, when `Passwd::locate` succeeds the project and plan files are copied to the writer via `io::copy` with no length/trust limits and without checking that the file is regular. A user could point their home directory `.project`/`.plan` at a FIFO or huge/streaming file (e.g. a symlink to /dev/zero), causing pinky to block or stream unbounded output. GNU pinky reads these but the lack of any file-type guard is a mild robustness issue.","fix":"Open with O_NONBLOCK / check file type, or bound the copy, to avoid blocking on FIFOs and unbounded special files.","locations":[{"ref":"src/uu/pinky/src/platform/unix.rs:295-310","code":"  295 |                 if self.include_project {\n  296 |                     let mut p = PathBuf::from(&user_dir);\n  297 |                     p.push(\".project\");\n  298 |                     if let Ok(mut reader) = File::open(p) {\n  299 |                         write!(writer, \"{} \", translate!(\"pinky-project-label\"))?;\n  300 |                         io::copy(&mut reader, writer)?;\n  301 |                     }\n  302 |                 }\n  303 |                 if self.include_plan {\n  304 |                     let mut p = PathBuf::from(&user_dir);\n  305 |                     p.push(\".plan\");\n  306 |                     if let Ok(mut reader) = File::open(p) {\n  307 |                         writeln!(writer, \"{}:\", translate!(\"pinky-plan-label\"))?;\n  308 |                         io::copy(&mut reader, writer)?;\n  309 |                     }\n  310 |                 }","lines":16,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/pinky/src/platform/unix.rs#L295-L310"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`canonicalize_relative` only forces the \"not a directory\" error (`abs.read_dir()?`) when\n`can_mode == MissingHandling::Existing` (realpath `-e`). For the default mode and `-m`, a\n`--relative-to`/`--relative-base` argument that resolves to a regular file is silently accepted\nas a directory base, whereas GNU realpath rejects a non-directory `--relative-base`/`--relative-to`.\nThis can yield surprising relative paths instead of a clear diagnostic.","fix":"Verify `abs.is_dir()` (and raise the not-a-directory error) regardless of `can_mode`, matching\nGNU behavior, rather than gating it behind `MissingHandling::Existing`.","locations":[{"ref":"src/uu/realpath/src/realpath.rs:267-277","code":"  267 | fn canonicalize_relative(\n  268 |     r: &Path,\n  269 |     can_mode: MissingHandling,\n  270 |     resolve: ResolveMode,\n  271 | ) -> std::io::Result<PathBuf> {\n  272 |     let abs = canonicalize(r, can_mode, resolve)?;\n  273 |     if can_mode == MissingHandling::Existing && !abs.is_dir() {\n  274 |         abs.read_dir()?; // raise not a directory error\n  275 |     }\n  276 |     Ok(abs)\n  277 | }","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/realpath/src/realpath.rs#L267-L277"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"count_files (used only to size the --progress bar) double-walks the tree: count_files / count_files_in_directory does a full recursive read_dir of every directory before the actual removal also reads every directory. Besides the extra I/O, the count and the real traversal can disagree (TOCTOU between counting and removing), so the progress bar can finish early or never reach 100%. Not a correctness bug for the removal itself, but the pre-walk roughly doubles syscalls for large trees when -g is set.","fix":"Make the progress bar use an indeterminate spinner, or increment a running total during the single real traversal instead of pre-counting.","locations":[{"ref":"src/uu/rm/src/rm.rs:511-528","code":"  511 | fn count_files(paths: &[&OsStr], recursive: bool) -> u64 {\n  512 |     let mut total = 0;\n  513 |     for p in paths {\n  514 |         let path = Path::new(p);\n  515 |         if let Ok(md) = fs::symlink_metadata(path) {\n  516 |             if md.is_dir() && !is_symlink_dir(&md) {\n  517 |                 if recursive {\n  518 |                     total += count_files_in_directory(path);\n  519 |                 }\n  520 |             } else {\n  521 |                 total += 1;\n  522 |             }\n  523 |         }\n  524 |         // If we can't access the file, skip it for counting\n  525 |         // This matches the behavior where -f suppresses errors for missing files\n  526 |     }\n  527 |     total\n  528 | }","lines":18,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/rm/src/rm.rs#L511-L528"},{"ref":"src/uu/rm/src/rm.rs:531-544","code":"  531 | fn count_files_in_directory(p: &Path) -> u64 {\n  532 |     let entries_count = fs::read_dir(p).map_or(0, |entries| {\n  533 |         entries\n  534 |             .flatten()\n  535 |             .map(|entry| match entry.file_type() {\n  536 |                 Ok(ft) if ft.is_dir() => count_files_in_directory(&entry.path()),\n  537 |                 Ok(_) => 1,\n  538 |                 Err(_) => 0,\n  539 |             })\n  540 |             .sum()\n  541 |     });\n  542 | \n  543 |     1 + entries_count\n  544 | }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/rm/src/rm.rs#L531-L544"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In shuf, `head_count` is computed by taking the `min()` of all `-n` values (GNU bug-compatible per the comment) defaulting to `u64::MAX`. With `Mode::InputRange` and `--repeat`, `head_count` defaults to `u64::MAX` and `shuf_exec` loops `for _ in 0..opts.head_count`, i.e. up to 2^64 iterations producing effectively infinite output. This matches GNU `shuf -r -i...` (infinite), so it is intended, but combined with the `usize::try_from(amount).unwrap_or(usize::MAX)` saturations elsewhere, the u64/usize boundary on 32-bit targets silently caps output at usize::MAX rather than erroring.","fix":"No action required for GNU compatibility; document the 32-bit saturation behavior.","locations":[{"ref":"src/uu/shuf/src/shuf.rs:110-115","code":"  110 |         head_count: matches\n  111 |             .get_many::<u64>(options::HEAD_COUNT)\n  112 |             .unwrap_or_default()\n  113 |             .copied()\n  114 |             .min()\n  115 |             .unwrap_or(u64::MAX),","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/shuf/src/shuf.rs#L110-L115"},{"ref":"src/uu/shuf/src/shuf.rs:429-433","code":"  429 |         for _ in 0..opts.head_count {\n  430 |             let r = input.choose(rng)?;\n  431 |             r.write_all_to(output).map_err(handle_write_error)?;\n  432 |             output.write_all(&sep).map_err(handle_write_error)?;\n  433 |         }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/shuf/src/shuf.rs#L429-L433"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In shuf `parse_range`, the accepted condition is `begin <= end || begin == end + 1`. The `begin == end + 1` clause is intentional (an empty range like 5-4 is allowed per GNU), but `begin == end + 1` will overflow/panic check is avoided only because `end + 1` cannot overflow for typical inputs; however if `to` parses to `u64::MAX`, `end + 1` overflows and panics in debug builds (wraps in release). E.g. `shuf -i 0-18446744073709551615` is fine, but `shuf -i 18446744073709551615-18446744073709551614` triggers `end + 1` where end = u64::MAX-1 (ok); the genuine overflow is `shuf -i X-18446744073709551615` with begin>end requiring `end+1` = MAX+1.","fix":"Use `begin == end.wrapping_add(1)` or restructure as `begin <= end || begin.checked_sub(1) == Some(end)` to avoid the potential overflow panic in debug builds.","locations":[{"ref":"src/uu/shuf/src/shuf.rs:452-456","code":"  452 |         if begin <= end || begin == end + 1 {\n  453 |             Ok(begin..=end)\n  454 |         } else {\n  455 |             Err(translate!(\"shuf-error-start-exceeds-end\"))\n  456 |         }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/shuf/src/shuf.rs#L452-L456"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The automatic buffer-size heuristic test `desired_buffer_caps_at_max_for_large_inputs`\nand the `desired_file_buffer_bytes` \"small input\" branch multiply by 12\n(`total_bytes.saturating_mul(12)`) which can overflow into the `clamp` argument\nordering: `clamp(total_bytes, max)`. If `total_bytes > max` the `.clamp(low=total_bytes, high=max)`\nhas `low > high`, which panics in `u128::clamp`. This branch is only reached\nwhen `total_bytes <= max`, so it is currently safe, but the invariant is\nimplicit and fragile - a future change to the `total_bytes <= max` guard would\nturn this into a panic.","fix":"Use `total_bytes.saturating_mul(12).min(max).max(total_bytes)` or assert the\n`total_bytes <= max` precondition explicitly to make the no-panic invariant\nrobust against refactoring.","locations":[{"ref":"src/uu/sort/src/buffer_hint.rs:78-80","code":"   78 |     if total_bytes <= max {\n   79 |         return total_bytes.saturating_mul(12).clamp(total_bytes, max);\n   80 |     }","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/buffer_hint.rs#L78-L80"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_range`'s `resolve_index` applies the character offset by counting raw\nbytes (`.nth(position.char - 1)`) and similarly skips blanks byte-by-byte. For\nmulti-byte UTF-8 input a character key offset (e.g. `-k1.3`) lands on a byte\nboundary, not a character boundary, so `-k` char positions disagree with GNU\nsort in non-ASCII data and can split a slice mid-codepoint (the resulting\nsub-slice may not be valid UTF-8, though comparisons operate on bytes so it does\nnot panic). This is consistent within the byte-oriented design but is a real\nbehavioral divergence worth documenting or fixing.","fix":"If GNU char-offset semantics are desired, iterate by UTF-8 char boundaries when\nthe input is valid UTF-8; otherwise document explicitly that char offsets are\nbyte offsets.","locations":[{"ref":"src/uu/sort/src/sort.rs:1415-1432","code":" 1415 |                 if position.ignore_blanks {\n 1416 |                     idx += line[idx..]\n 1417 |                         .iter()\n 1418 |                         .enumerate()\n 1419 |                         .find(|(_, c)| !c.is_ascii_whitespace())\n 1420 |                         .map_or(line[idx..].len(), |(idx, _)| idx);\n 1421 |                 }\n 1422 |                 // apply the character index\n 1423 |                 idx += line[idx..]\n 1424 |                     .iter()\n 1425 |                     .enumerate()\n 1426 |                     .nth(position.char - 1)\n 1427 |                     .map_or(line[idx..].len(), |(idx, _)| idx);\n 1428 |                 if idx >= line.len() {\n 1429 |                     Resolution::TooHigh\n 1430 |                 } else {\n 1431 |                     Resolution::StartOfChar(idx)\n 1432 |                 }","lines":18,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/sort.rs#L1415-L1432"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`general_numeric_compare` does `a.partial_cmp(b).unwrap()`. This relies on the\nderived `PartialOrd` for `GeneralBigDecimalParseResult` never returning `None`.\nToday that holds because every variant (including `BigDecimal`) is totally\nordered, but the `unwrap` encodes an invariant that is not enforced by the type\n(the enum derives `PartialOrd`, not `Ord`). A future variant carrying an\n`f64`/NaN-like payload would turn this into a panic in the hot comparison path.","fix":"Either derive `Ord` for `GeneralBigDecimalParseResult` and use `cmp`, or fall\nback to a defined ordering (e.g. `Ordering::Equal`) instead of `unwrap()` so an\naccidental partial order cannot panic the sorter.","locations":[{"ref":"src/uu/sort/src/sort.rs:3113-3118","code":" 3113 | fn general_numeric_compare(\n 3114 |     a: &GeneralBigDecimalParseResult,\n 3115 |     b: &GeneralBigDecimalParseResult,\n 3116 | ) -> Ordering {\n 3117 |     a.partial_cmp(b).unwrap()\n 3118 | }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/sort.rs#L3113-L3118"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The auto-width suffix-length pre-calculation uses floating-point `((start + chunks) as f64).log(radix).ceil() as usize` to compute the required suffix length. For large chunk counts near f64 precision limits, log/ceil rounding can yield a length that is off by one (either too small, allowing a later overflow on FilenameIterator, or too large). GNU computes this with integer arithmetic. Realistic chunk counts are small so impact is low, but the float path is imprecise by construction.","fix":"Compute the required width with an integer loop (repeatedly divide (start+chunks-1) by radix) instead of f64 log/ceil.","locations":[{"ref":"src/uu/split/src/filenames.rs:202-218","code":"  202 |             let required_length = ((start as u64 + chunks) as f64)\n  203 |                 .log(stype.radix() as f64)\n  204 |                 .ceil() as usize;\n  205 | \n  206 |             if (start as u64) < chunks && !(is_length_cmd_opt && length > 0) {\n  207 |                 // with auto-width ON the auto-widening is OFF\n  208 |                 auto_widening = false;\n  209 | \n  210 |                 // do not reduce suffix length with auto-width\n  211 |                 if length < required_length {\n  212 |                     length = required_length;\n  213 |                 }\n  214 |             }\n  215 | \n  216 |             if length < required_length {\n  217 |                 return Err(SuffixError::TooSmall(required_length));\n  218 |             }","lines":17,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/filenames.rs#L202-L218"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"SettingsError::requires_usage returns true for Suffix(ContainsSeparator) so a usage message is shown, but the other SuffixError variants (NotParsable, TooSmall) and StrategyError variants other than MultipleWays do not. GNU split prints a usage hint for invalid suffix length too. This is a behavioral nit: some argument-validation errors get a usage message and similar ones do not, which is inconsistent.","fix":"Audit which SettingsError variants should trigger a usage message to match GNU behavior and make the set consistent.","locations":[{"ref":"src/uu/split/src/split.rs:285-294","code":"  285 | impl SettingsError {\n  286 |     /// Whether the error demands a usage message.\n  287 |     fn requires_usage(&self) -> bool {\n  288 |         matches!(\n  289 |             self,\n  290 |             Self::Strategy(StrategyError::MultipleWays)\n  291 |                 | Self::Suffix(SuffixError::ContainsSeparator(_))\n  292 |         )\n  293 |     }\n  294 | }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/split.rs#L285-L294"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In n_chunks_by_line the separator is re-appended to a line only when `(num_bytes_written + line.len()) < num_bytes`. `reader.split(sep)` strips the separator from every record, so for a genuine middle line whose end coincides exactly with the running total reaching num_bytes (possible when chunk accounting and the final line boundary align) the condition can be false and the separator is dropped even though the original input had one there. The intended check is \"is this the final record and did the input lack a trailing separator\", but it is approximated purely by byte position, which is fragile. GNU split keys this off whether the split iterator actually consumed a delimiter.","fix":"Use a lines iterator that reports whether the delimiter was present (like the LinesWithSep helper already in this file) instead of inferring it from byte offsets.","locations":[{"ref":"src/uu/split/src/split.rs:1123-1131","code":" 1123 |     for line_result in reader.split(sep) {\n 1124 |         let mut line = line_result?;\n 1125 |         // add separator back in at the end of the line,\n 1126 |         // since `reader.split(sep)` removes it,\n 1127 |         // except if the last line did not end with separator character\n 1128 |         if (num_bytes_written + line.len() as u64) < num_bytes {\n 1129 |             line.push(sep);\n 1130 |         }\n 1131 |         let bytes = line.as_slice();","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/split.rs#L1123-L1131"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The non-`--all` branch of `print_control_chars` prints control chars that differ from their sane\ndefaults but never prints the `min`/`time` (VMIN/VTIME) pair, whereas the `--all` branch does\n(lines 883-886). GNU stty prints `min N; time N;` in the default output too when they differ from\nsane values, so the default listing can omit information GNU shows.","fix":"In the non-all branch, also compare VMIN/VTIME against their sane defaults and emit the min/time line\nwhen they differ, consistent with the --all branch and GNU.","locations":[{"ref":"src/uu/stty/src/stty.rs:860-876","code":"  860 |     if !opts.all {\n  861 |         // Print only control chars that differ from sane defaults\n  862 |         let mut printer = WrappedPrinter::new(term_size);\n  863 |         for (text, cc_index) in CONTROL_CHARS {\n  864 |             let current_val = termios.control_chars[*cc_index as usize];\n  865 |             let sane_val = get_sane_control_char(*cc_index);\n  866 | \n  867 |             if current_val != sane_val {\n  868 |                 printer.print(&format!(\n  869 |                     \"{text} = {};\",\n  870 |                     control_char_to_string(current_val)?\n  871 |                 ));\n  872 |             }\n  873 |         }\n  874 |         printer.flush();\n  875 |         return Ok(());\n  876 |     }","lines":17,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/stty/src/stty.rs#L860-L876"},{"ref":"src/uu/stty/src/stty.rs:885-888","code":"  885 |     printer.print(&translate!(\"stty-output-min-time\",\n  886 |         \"min\" => termios.control_chars[S::VMIN as usize],\n  887 |         \"time\" => termios.control_chars[S::VTIME as usize]\n  888 |     ));","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/stty/src/stty.rs#L885-L888"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`string_to_control_char` recognizes an octal prefix via `strip_prefix(\"0\")` and a hex prefix via\n`strip_prefix(\"0x\")`, but only lowercase `0x` is handled. An input like `0X41` falls through to the\noctal branch (`strip_prefix(\"0\")` -> `\"X41\"`), which fails to parse as octal and is then treated as a\nliteral multi-char string error rather than a hex value. GNU stty accepts upper-case `0X`.","fix":"Match the hex prefix case-insensitively, e.g. test both `0x` and `0X` (or lowercase the input prefix)\nbefore falling back to the octal branch.","locations":[{"ref":"src/uu/stty/src/stty.rs:1085-1096","code":" 1085 |     // try to parse integer (hex, octal, or decimal)\n 1086 |     let ascii_num = if let Some(hex) = s.strip_prefix(\"0x\") {\n 1087 |         u32::from_str_radix(hex, 16).ok()\n 1088 |     } else if let Some(octal) = s.strip_prefix(\"0\") {\n 1089 |         if octal.is_empty() {\n 1090 |             Some(0)\n 1091 |         } else {\n 1092 |             u32::from_str_radix(octal, 8).ok()\n 1093 |         }\n 1094 |     } else {\n 1095 |         s.parse::<u32>().ok()\n 1096 |     };","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/stty/src/stty.rs#L1085-L1096"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"tac translate_regex_flavor silently DROPS any non-ASCII byte that appears inside a [...] character class (the first match arm `inside_brackets && !b.is_ascii()` does `i += 1; continue;` without emitting anything). A user separator regex like `-r` with a class containing a multibyte UTF-8 char will have those bytes removed from the class, changing the matched set without any error. The doc comment claims it leaves \"only ASCII bytes inside []\" which is accurate but the silent removal can produce a surprising/incorrect pattern.","fix":"Either error out on non-ASCII bytes inside a bracket class, or translate them to an explicit byte escape inside the class, rather than silently discarding them.","locations":[{"ref":"src/uu/tac/src/tac.rs:248-251","code":"  248 |             _ if inside_brackets && !b.is_ascii() => {\n  249 |                 i += 1;\n  250 |                 continue;\n  251 |             }","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tac/src/tac.rs#L248-L251"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Settings::from` sets `verbose` twice. Line 227 initializes `verbose` from the `--verbose` flag in\nthe struct literal, then lines 282-285 overwrite it with\n`(verbose_flag || inputs.len() > 1) && !quiet_flag`. The first assignment at 227 is entirely dead -\nits value is unconditionally replaced. Harmless but confusing; a reader may believe the 227 value\nmatters.","fix":"Drop `verbose` from the struct literal at line 227 (it is set unconditionally afterwards), or fold the final computation into the literal.","locations":[{"ref":"src/uu/tail/src/args.rs:244","code":"  244 |             verbose: matches.get_flag(options::verbosity::VERBOSE),","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/args.rs#L244"},{"ref":"src/uu/tail/src/args.rs:299-301","code":"  299 |         settings.verbose = (matches.get_flag(options::verbosity::VERBOSE)\n  300 |             || settings.inputs.len() > 1)\n  301 |             && !matches.get_flag(options::verbosity::QUIET);","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/args.rs#L299-L301"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`tail_file` always calls `file.metadata()?` (line 169) and computes `blksize_limit` and seekability,\nbut for an explicitly `--presume-input-pipe` run the seekable/bounded path is skipped anyway\n(line 173 short-circuits on `!settings.presume_input_pipe`). More importantly, `is_seekable` (and\nhead's `is_seekable`) performs a real `seek(End(0))` then restores position as a *side effect* just\nto test seekability; for a growing followed file this races with appends - the End(0) probe and the\nrestore bracket a window in which `bounded_tail` then re-derives size, so the \"last N\" computation\ncan be based on a size that changed between probe and read.","fix":"Probe seekability without moving the cursor where possible (e.g. attempt `stream_position`/`fstat` and rely on metadata().is_file()), and read the size once and reuse it through bounded_tail rather than re-seeking End(0) multiple times.","locations":[{"ref":"src/uu/tail/src/paths.rs:149-157","code":"  149 | impl FileExtTail for File {\n  150 |     /// Test if File is seekable.\n  151 |     /// Set the current position offset to `current_offset`.\n  152 |     fn is_seekable(&mut self, current_offset: u64) -> bool {\n  153 |         self.stream_position().is_ok()\n  154 |             && self.seek(SeekFrom::End(0)).is_ok()\n  155 |             && self.seek(SeekFrom::Start(current_offset)).is_ok()\n  156 |     }\n  157 | }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/paths.rs#L149-L157"},{"ref":"src/uu/tail/src/tail.rs:173-186","code":"  173 |                 let st = file.metadata()?;\n  174 |                 let blksize_limit = uucore::fs::sane_blksize::sane_blksize_from_metadata(&st);\n  175 |                 header_printer.print_input(input);\n  176 |                 let mut reader;\n  177 |                 if !settings.presume_input_pipe\n  178 |                     && file.is_seekable(if input.is_stdin() { offset } else { 0 })\n  179 |                     && (!st.is_file() || st.len() > blksize_limit)\n  180 |                 {\n  181 |                     bounded_tail(&mut file, settings)?;\n  182 |                     reader = BufReader::new(file);\n  183 |                 } else {\n  184 |                     reader = BufReader::new(file);\n  185 |                     unbounded_tail(&mut reader, settings)?;\n  186 |                 }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/tail.rs#L173-L186"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`MetadataExtTail::got_truncated` returns `other.len() < self.len() && other.modified()? != self.modified()?`.\nThis requires the modified time to differ to treat a shrink as truncation. On filesystems with\ncoarse mtime granularity (1s), a truncate-and-rewrite within the same second leaves an unchanged\nmtime, so a genuinely truncated file whose new length is smaller is NOT detected as truncated, and\ntail will not reset the reader to offset 0 - silently skipping data or printing stale offsets. GNU\ntail keys truncation detection on size decrease alone.","fix":"Detect truncation on size decrease alone (`Ok(other.len() < self.len())`), matching GNU, or additionally compare inode/size rather than relying on mtime resolution.","locations":[{"ref":"src/uu/tail/src/paths.rs:181-184","code":"  181 |     #[cfg(not(target_os = \"wasi\"))]\n  182 |     fn got_truncated(&self, other: &Metadata) -> UResult<bool> {\n  183 |         Ok(other.len() < self.len() && other.modified()? != self.modified()?)\n  184 |     }","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/paths.rs#L181-L184"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`PathExtTail::is_stdin` compares the path against the *localized* stdin header\n(`translate!(\"tail-stdin-header\")`, paths.rs:220). The stdin header is a translated, user-facing\nstring (\"standard input\" in en-US). Using a localized display string as a path-identity check is\nfragile: under a non-English locale the comparison silently stops matching, so a path that should be\ntreated as stdin no longer is. Path identity should not depend on the UI language.","fix":"Compare only against the stable sentinels (DASH, DEV_STDIN, FD0) and drop the localized-header comparison, or track stdin via the InputKind enum rather than by string-matching a translated label.","locations":[{"ref":"src/uu/tail/src/paths.rs:217-221","code":"  217 |     fn is_stdin(&self) -> bool {\n  218 |         self.eq(Self::new(text::DASH))\n  219 |             || self.eq(Self::new(text::DEV_STDIN))\n  220 |             || self.eq(Self::new(&translate!(\"tail-stdin-header\")))\n  221 |     }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/paths.rs#L217-L221"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"is_first_filename_timestamp / parse_timestamp two-digit-year handling: get_year subtracts b prime0 from raw bytes assuming ASCII digits, and is_timestamp gates len==10 on (69..=99).contains(get_year), but the 8-digit case (MMDDhhmm with current year) is accepted unconditionally for the obsolete POSIX path. A purely numeric 8-char filename (e.g. \"12345678\") is silently consumed as a timestamp operand instead of a file when _POSIX2_VERSION=199209, even if it was meant as a filename. This matches obscure POSIX behavior but get_year is only valid for digit strings; callers must guarantee all_digits first (they do via is_timestamp), so it is correct but fragile.","fix":"Add a debug_assert!(all_digits(s)) in get_year to document the precondition and prevent future misuse from underflowing the b prime0 subtraction.","locations":[{"ref":"src/uu/touch/src/touch.rs:161-188","code":"  161 | fn get_year(s: &str) -> u8 {\n  162 |     let bytes = s.as_bytes();\n  163 |     let n = bytes.len();\n  164 |     let y1 = bytes[n - 2] - b'0';\n  165 |     let y2 = bytes[n - 1] - b'0';\n  166 |     10 * y1 + y2\n  167 | }\n  168 | \n  169 | /// Whether the first filename should be interpreted as a timestamp.\n  170 | fn is_first_filename_timestamp(\n  171 |     reference: Option<&OsString>,\n  172 |     date: Option<&str>,\n  173 |     timestamp: Option<&str>,\n  174 |     files: &[&OsString],\n  175 | ) -> bool {\n  176 |     timestamp.is_none()\n  177 |         && reference.is_none()\n  178 |         && date.is_none()\n  179 |         && files.len() >= 2\n  180 |         // env check is last as the slowest op\n  181 |         && matches!(std::env::var(\"_POSIX2_VERSION\").as_deref(), Ok(\"199209\"))\n  182 |         && files[0].to_str().is_some_and(is_timestamp)\n  183 | }\n  184 | \n  185 | // Check if string is a valid POSIX timestamp (8 digits or 10 digits with valid year range)\n  186 | fn is_timestamp(s: &str) -> bool {\n  187 |     all_digits(s) && (s.len() == 8 || (s.len() == 10 && (69..=99).contains(&get_year(s))))\n  188 | }","lines":28,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/touch/src/touch.rs#L161-L188"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"tr equivalence class `[=c=]` is parsed by `parse_char_equal` into a single `Sequence::Char(c)`, i.e. it is treated as exactly the one character `c`. POSIX specifies an equivalence class expands to all characters collating equally to `c`. In the C/POSIX locale this happens to be just `c` so behavior is correct there, but the implementation silently ignores locale-based equivalence entirely; the name \"equivalence class\" is misleading for any non-C locale.","fix":"Document that only C-locale single-character equivalence is supported, or expand the equivalence class using locale collation data if locale awareness is intended.","locations":[{"ref":"src/uu/tr/src/operation.rs:656-685","code":"  656 |     fn parse_char_equal(input: &[u8]) -> IResult<&[u8], Result<Self, BadSequence>> {\n  657 |         preceded(\n  658 |             tag(\"[=\"),\n  659 |             (\n  660 |                 alt((\n  661 |                     value(Err(()), peek(tag(\"=]\"))),\n  662 |                     map(Self::parse_backslash_or_char, Ok),\n  663 |                 )),\n  664 |                 map(terminated(take_until(\"=]\"), tag(\"=]\")), |v: &[u8]| {\n  665 |                     if v.is_empty() { Ok(()) } else { Err(v) }\n  666 |                 }),\n  667 |             ),\n  668 |         )\n  669 |         .parse(input)\n  670 |         .map(|(l, (a, b))| {\n  671 |             (\n  672 |                 l,\n  673 |                 match (a, b) {\n  674 |                     (Err(()), _) => Err(BadSequence::MissingEquivalentClassChar),\n  675 |                     (Ok(c), Ok(())) => Ok(Self::Char(c)),\n  676 |                     (Ok(c), Err(v)) => Err(BadSequence::MultipleCharInEquivalence(format!(\n  677 |                         \"{}{}\",\n  678 |                         String::from_utf8_lossy(&[c]),\n  679 |                         String::from_utf8_lossy(v),\n  680 |                     ))),\n  681 |                 },\n  682 |             )\n  683 |         })\n  684 |     }\n  685 | }","lines":30,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tr/src/operation.rs#L656-L685"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In who (unix) `idle_string`, the hours computation `seconds_idle / 3600` is formatted as `{:02}` but is not capped; the guard `now - 24*3600 < when` ensures seconds_idle < 86400 so hours < 24, which is fine. However `current_tty()` strips only a leading \"/dev/\" prefix; if ttyname returns a path not under /dev (rare), the comparison `cur_tty == ut.tty_device()` silently never matches and `-m`/two-file mode prints nothing with no diagnostic.","fix":"No fix needed for the common case; consider documenting that non-/dev ttynames are unsupported for -m.","locations":[{"ref":"src/uu/who/src/platform/unix.rs:223-227","code":"  223 | fn current_tty() -> String {\n  224 |     rustix::termios::ttyname(std::io::stdin(), Vec::with_capacity(16))\n  225 |         .map(|s| s.to_string_lossy().trim_start_matches(\"/dev/\").to_owned())\n  226 |         .unwrap_or_default()\n  227 | }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/who/src/platform/unix.rs#L223-L227"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In yes `repeat_content_to_capacity`, `target_size = line_len * (buf.capacity() / line_len)` can overflow `usize` if `line_len` is very large relative to capacity (it cannot exceed capacity here so it is bounded), but more importantly when `line_len > buf.capacity()` the expression yields 0 and the function silently does nothing - which is intended - yet the buffer was allocated with `Vec::with_capacity(BUF_SIZE)` while `buf.len()` (a single very long line) may already exceed BUF_SIZE, so `capacity()` may be larger than BUF_SIZE and the doubling loop still runs; behavior is correct but the reliance on `capacity()` (an allocator-defined value) rather than a fixed target makes the output buffer size non-deterministic across allocators.","fix":"Base the target size on a fixed constant (e.g. BUF_SIZE) rather than the allocator-reported `capacity()` to keep behavior deterministic.","locations":[{"ref":"src/uu/yes/src/yes.rs:71-81","code":"   71 | fn repeat_content_to_capacity(buf: &mut Vec<u8>) {\n   72 |     let line_len = buf.len();\n   73 |     debug_assert!(line_len > 0, \"buffer is not empty since we have newline\");\n   74 |     let target_size = line_len * (buf.capacity() / line_len); // 0 if line_len is already large enough\n   75 | \n   76 |     while buf.len() < target_size {\n   77 |         let to_copy = std::cmp::min(target_size - buf.len(), buf.len());\n   78 |         debug_assert_eq!(to_copy % line_len, 0);\n   79 |         buf.extend_from_within(..to_copy);\n   80 |     }\n   81 | }","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/yes/src/yes.rs#L71-L81"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`unescape_filename` silently drops a trailing lone backslash: when the final byte is `\\` and\n`byte_iter.next()` returns `None`, the `_ => {}` arm discards it entirely. GNU's checksum reader treats a\ndangling backslash literally. Combined with `escape_filename`, a filename ending in a single backslash will\nnot round-trip (it is doubled on escape but the lone-trailing case on the unescape side is lost), which can\ncause a `--check` line for such a file to mismatch its computed name.","fix":"In the `_ => {}` arm (when `\\` is the last byte), push the literal backslash:\n`None => unescaped.push(b'\\\\')`.","locations":[{"ref":"src/uucore/src/lib/features/checksum/compute.rs:638-659","code":"","lines":22,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/checksum/compute.rs#L638-L659"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"next_char coerces a char argument to a byte with `*c as u8`, silently truncating any non-ASCII\ncode point (e.g. 'é' (U+00E9) becomes 0xE9, '€' becomes 0x20AC truncated to 0xAC). For `%c` GNU\nprintf emits the full multibyte encoding of the character. Truncating to a single byte produces\nincorrect output for non-ASCII char arguments.","fix":"Either encode the char as UTF-8 bytes (c.encode_utf8) when writing %c, or document/normalize that\nonly the first byte is used. At minimum avoid the lossy `as u8` cast for multibyte chars.","locations":[{"ref":"src/uucore/src/lib/features/format/argument.rs:76-85","code":"   76 |     pub fn next_char(&mut self, position: ArgumentLocation) -> u8 {\n   77 |         match self.next_arg(position) {\n   78 |             Some(FormatArgument::Char(c)) => *c as u8,\n   79 |             Some(FormatArgument::Unparsed(os)) => match os_str_as_bytes(os) {\n   80 |                 Ok(bytes) => bytes.first().copied().unwrap_or(b'\\0'),\n   81 |                 Err(_) => b'\\0',\n   82 |             },\n   83 |             _ => b'\\0',\n   84 |         }\n   85 |     }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/format/argument.rs#L76-L85"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"canonicalize: at line 421 `FileInformation::from_path(result.parent().unwrap(), false).unwrap()`\ndouble-unwraps inside the symlink-loop-detection branch. If `result` has no parent (e.g. the\nsymlink resolved to a bare root component) parent() is None and this panics; likewise from_path\ncan fail (race / permission) and the unwrap aborts. This is on the >20-symlink slow path so it\nis rarely hit, but it is a panic in a core path-resolution routine used by realpath/readlink/ln.","fix":"Handle None parent and from_path errors by returning an io::Error (the loop-detection\npath can conservatively treat failure as \"too many levels\" or propagate the io error).","locations":[{"ref":"src/uucore/src/lib/features/fs.rs:419-434","code":"  419 |                 if followed_symlinks < SYMLINKS_TO_LOOK_FOR_LOOPS {\n  420 |                     followed_symlinks += 1;\n  421 |                 } else {\n  422 |                     let file_info =\n  423 |                         FileInformation::from_path(result.parent().unwrap(), false).unwrap();\n  424 |                     let mut path_to_follow = PathBuf::new();\n  425 |                     for part in &parts {\n  426 |                         path_to_follow.push(part.as_os_str());\n  427 |                     }\n  428 |                     if !visited_files.insert((file_info, path_to_follow)) {\n  429 |                         return Err(Error::new(\n  430 |                             ErrorKind::InvalidInput,\n  431 |                             \"Too many levels of symbolic links\",\n  432 |                         )); // TODO use ErrorKind::FilesystemLoop when stable\n  433 |                     }\n  434 |                 }","lines":16,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/fs.rs#L419-L434"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"mount_dev_id casts the device id to i32 before stringifying: `(stat.dev() as i32).to_string()`\nwith the literal comment \"Why do we cast this to i32?\". dev_t is 64-bit on Linux; truncating\nto i32 (and signed) can collapse distinct devices to the same dev_id string or produce a\nnegative id, which df uses to deduplicate mount entries. Two filesystems whose dev_t differ\nonly in the high 32 bits would be treated as the same device.","fix":"Use the full dev_t (e.g. `stat.dev().to_string()`); investigate why the i32 cast was\nadded (likely to match a historical GNU/coreutils representation) and document or remove it.","locations":[{"ref":"src/uucore/src/lib/features/fsext.rs:417-427","code":"  417 | #[cfg(all(unix, not(any(target_os = \"aix\", target_os = \"redox\"))))]\n  418 | fn mount_dev_id(mount_dir: &OsStr) -> String {\n  419 |     use std::os::unix::fs::MetadataExt;\n  420 | \n  421 |     if let Ok(stat) = std::fs::metadata(mount_dir) {\n  422 |         // Why do we cast this to i32?\n  423 |         (stat.dev() as i32).to_string()\n  424 |     } else {\n  425 |         String::new()\n  426 |     }\n  427 | }","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/fsext.rs#L417-L427"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"determine_number_system / parse only support a \"0x\"/\"0X\" lowercase-prefix check via\n`size.starts_with(\"0x\")`, but the numeric extraction in parse() for Hexadecimal takes\n`size.chars().take(2)` and later trims with `trim_start_matches(\"0x\")`. An uppercase \"0X\" prefix\nis never detected (determine_number_system only checks \"0x\"), so \"0XACDB...\" falls through to the\noctal/decimal path. This is an inconsistency with the documented hex support and with num_parser\n(which accepts both 0x and 0X).","fix":"Match both cases, e.g. `size.starts_with(\"0x\") || size.starts_with(\"0X\")` in determine_number_system\nand trim_start_matches([\"0x\", \"0X\"]) (or lowercase the prefix) when extracting the hex digits.","locations":[{"ref":"src/uucore/src/lib/features/parser/parse_size.rs:437-439","code":"  437 |         if size.starts_with(\"0x\") {\n  438 |             return NumberSystem::Hexadecimal;\n  439 |         }","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/parser/parse_size.rs#L437-L439"},{"ref":"src/uucore/src/lib/features/parser/parse_size.rs:373-376","code":"  373 |             NumberSystem::Hexadecimal => {\n  374 |                 let trimmed_string = numeric_string.trim_start_matches(\"0x\");\n  375 |                 Self::parse_number(trimmed_string, 16, size)?\n  376 |             }","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/parser/parse_size.rs#L373-L376"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"configure_symlink_and_recursion: when not recursive, traverse_symlinks is forced to\nNone but `dereference` is left as the user/default value and the function returns\n`dereference.unwrap_or(true)`. For a non-recursive `-h`/`--no-dereference` chgrp on a\nsymlink this is fine, but the interaction `-R --dereference` requiring `-H`/`-L`\n(line 864-866) only errors when traverse_symlinks==None AND dereference==Some(true);\nif the user passes `-R -L --dereference` it is allowed (correct), but `-R -H\n--no-dereference` silently keeps dereference=false with TraverseSymlinks::First,\nwhich GNU may treat differently. Worth confirming against GNU's matrix.","fix":"Verify the full -R/-H/-L/--dereference/--no-dereference matrix against GNU chown\nand add tests for the corner combinations.","locations":[{"ref":"src/uucore/src/lib/features/perms.rs:854-889","code":"  854 | pub fn configure_symlink_and_recursion(\n  855 |     matches: &ArgMatches,\n  856 |     default_traverse_symlinks: TraverseSymlinks,\n  857 | ) -> Result<(bool, bool, TraverseSymlinks), Box<dyn crate::error::UError>> {\n  858 |     let mut dereference = if matches.get_flag(options::dereference::DEREFERENCE) {\n  859 |         Some(true) // Follow symlinks\n  860 |     } else if matches.get_flag(options::dereference::NO_DEREFERENCE) {\n  861 |         Some(false) // Do not follow symlinks\n  862 |     } else {\n  863 |         None // Default behavior\n  864 |     };\n  865 | \n  866 |     let mut traverse_symlinks = if matches.get_flag(\"L\") {\n  867 |         TraverseSymlinks::All\n  868 |     } else if matches.get_flag(\"H\") {\n  869 |         TraverseSymlinks::First\n  870 |     } else if matches.get_flag(\"P\") {\n  871 |         TraverseSymlinks::None\n  872 |     } else {\n  873 |         default_traverse_symlinks\n  874 |     };\n  875 | \n  876 |     let recursive = matches.get_flag(options::RECURSIVE);\n  877 |     if recursive {\n  878 |         if traverse_symlinks == TraverseSymlinks::None {\n  879 |             if dereference == Some(true) {\n  880 |                 return Err(USimpleError::new(1, \"-R --dereference requires -H or -L\"));\n  881 |             }\n  882 |             dereference = Some(false);\n  883 |         }\n  884 |     } else {\n  885 |         traverse_symlinks = TraverseSymlinks::None;\n  886 |     }\n  887 | \n  888 |     Ok((recursive, dereference.unwrap_or(true), traverse_symlinks))\n  889 | }","lines":36,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/perms.rs#L854-L889"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`finalize_shell_quoter` mixes a bitwise OR with `&&`: `if must_quote | contains_quote_chars\n&& quotes != Quotes::None`. Rust precedence makes this `(must_quote | contains_quote_chars)\n&& (quotes != Quotes::None)`. Since `contains_quote_chars` is itself defined two lines above\nas `must_quote || bytes_start_with(...)`, the `must_quote |` term is fully redundant, and the\nuse of the bitwise `|` operator on bools (instead of `||`) is misleading. It happens to\nproduce the correct result today, but the expression is fragile and obscures intent.","fix":"Simplify to `if contains_quote_chars && quotes != Quotes::None` (the `must_quote` is already\nfolded into `contains_quote_chars`), and use logical `||`/`&&` consistently rather than `|`.","locations":[{"ref":"src/uucore/src/lib/features/quoting_style/shell_quoter.rs:231-233","code":"  231 |     let contains_quote_chars = must_quote || bytes_start_with(reference, SPECIAL_SHELL_CHARS_START);\n  232 | \n  233 |     if must_quote | contains_quote_chars && quotes != Quotes::None {","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/quoting_style/shell_quoter.rs#L231-L233"}]},
