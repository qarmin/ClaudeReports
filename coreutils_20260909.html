{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In copy() the dest-collision guard builds `dest` with construct_dest_path(...).unwrap_or_else(|_| target.to_path_buf()). On error it silently falls back to the bare target path, so the subsequent \"will not overwrite just created\" check and copied_destinations bookkeeping operate on the wrong path. This can both miss a genuine just-created collision and record an incorrect destination, weakening the safety check that prevents overwriting a file created earlier in the same cp invocation.","fix":"Propagate the construct_dest_path error (or skip the collision bookkeeping for that source) instead of substituting target and proceeding as if the path were valid.","locations":[{"ref":"src/uu/cp/src/cp.rs:1481-1526","code":" 1481 |             let dest = construct_dest_path(source, target, target_type, options)\n 1482 |                 .unwrap_or_else(|_| target.to_path_buf());\n 1483 | \n 1484 |             if FileInformation::from_path(&dest, true).is_ok()\n 1485 |                 && !fs::symlink_metadata(&dest).is_ok_and(|m| m.file_type().is_symlink())\n 1486 |                 // if both `source` and `dest` are symlinks, it should be considered as an overwrite.\n 1487 |                 || fs::metadata(source).is_ok()\n 1488 |                     && fs::symlink_metadata(source)?.file_type().is_symlink()\n 1489 |                 || matches!(options.copy_mode, CopyMode::SymLink)\n 1490 |             {\n 1491 |                 // There is already a file and it isn't a symlink (managed in a different place)\n 1492 |                 if copied_destinations.contains(&dest) && options.backup != BackupMode::Numbered {\n 1493 |                     // If the target was already created in this cp call, check if it's a directory.\n 1494 |                     // Directories should be merged (GNU cp behavior), but files should not be overwritten.\n 1495 |                     let dest_is_dir = fs::metadata(&dest).is_ok_and(|m| m.is_dir());\n 1496 |                     let source_is_dir = fs::metadata(source).is_ok_and(|m| m.is_dir());\n 1497 | \n 1498 |                     // Only prevent overwriting if both source and dest are files (not directories)\n 1499 |                     // Directories should be merged, which is handled by copy_directory\n 1500 |                     if !dest_is_dir || !source_is_dir {\n 1501 |                         // If the target file was already created in this cp call, do not overwrite\n 1502 |                         return Err(CpError::Error(\n 1503 |                             translate!(\"cp-error-will-not-overwrite-just-created\", \"dest\" => dest.quote(), \"source\" => source.quote()),\n 1504 |                         ));\n 1505 |                     }\n 1506 |                 }\n 1507 |             }\n 1508 | \n 1509 |             if let Err(error) = copy_source(\n 1510 |                 progress_bar.as_ref(),\n 1511 |                 source,\n 1512 |                 target,\n 1513 |                 target_type,\n 1514 |                 options,\n 1515 |                 &mut symlinked_files,\n 1516 |                 &copied_destinations,\n 1517 |                 &mut copied_files,\n 1518 |                 &mut created_parent_dirs,\n 1519 |             ) {\n 1520 |                 show_error_if_needed(&error);\n 1521 |                 if !matches!(error, CpError::Skipped(false)) {\n 1522 |                     non_fatal_errors = true;\n 1523 |                 }\n 1524 |             } else {\n 1525 |                 copied_destinations.insert(dest.clone());\n 1526 |             }","lines":46,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cp/src/cp.rs#L1481-L1526"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"handle_copy_mode CopyMode::Link backup path calls backup_dest then fs::remove_file(dest), and separately if overwrite is Force it calls fs::remove_file(dest) AGAIN. If both a backup is configured AND force is set, the second remove_file targets an already-removed path; it is not guarded with NotFound tolerance (unlike delete_path), so it returns an error and aborts the hard-link creation even though the backup/removal already succeeded.","fix":"Skip the force remove_file when the backup branch already removed dest, or tolerate NotFound as delete_path does.","locations":[{"ref":"src/uu/cp/src/cp.rs:2402-2413","code":" 2402 |         CopyMode::Link => {\n 2403 |             if dest.exists() {\n 2404 |                 let backup_path =\n 2405 |                     backup_control::get_backup_path(options.backup, dest, &options.backup_suffix);\n 2406 |                 if let Some(backup_path) = backup_path {\n 2407 |                     backup_dest(dest, &backup_path, dest.is_symlink())?;\n 2408 |                     fs::remove_file(dest)?;\n 2409 |                 }\n 2410 |                 if options.overwrite == OverwriteMode::Clobber(ClobberMode::Force) {\n 2411 |                     fs::remove_file(dest)?;\n 2412 |                 }\n 2413 |             }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cp/src/cp.rs#L2402-L2413"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"disk_usage / disk_usage_directory (used to size the --progress bar) use fs::metadata (follows symlinks) and recurse into entry.file_type().is_dir(). With symlinks in the tree this can follow symlinked directories and even loop infinitely on a symlink cycle, hanging cp before any copying starts. WalkDir-based copying does not follow links by default, so the size estimate and the actual traversal disagree, and a malicious/looping symlink directory causes a denial-of-service / stack overflow in disk_usage_directory.","fix":"Use symlink_metadata and skip (or do not recurse into) symlinked directories, matching the WalkDir traversal semantics; guard against cycles.","locations":[{"ref":"src/uu/cp/src/cp.rs:3102-3131","code":" 3102 | fn disk_usage(paths: &[PathBuf], recursive: bool) -> io::Result<u64> {\n 3103 |     let mut total = 0;\n 3104 |     for p in paths {\n 3105 |         let md = fs::metadata(p)?;\n 3106 |         if md.file_type().is_dir() {\n 3107 |             if recursive {\n 3108 |                 total += disk_usage_directory(p)?;\n 3109 |             }\n 3110 |         } else {\n 3111 |             total += md.len();\n 3112 |         }\n 3113 |     }\n 3114 |     Ok(total)\n 3115 | }\n 3116 | \n 3117 | /// A helper for `disk_usage` specialized for directories.\n 3118 | fn disk_usage_directory(p: &Path) -> io::Result<u64> {\n 3119 |     let mut total = 0;\n 3120 | \n 3121 |     for entry in fs::read_dir(p)? {\n 3122 |         let entry = entry?;\n 3123 |         if entry.file_type()?.is_dir() {\n 3124 |             total += disk_usage_directory(&entry.path())?;\n 3125 |         } else {\n 3126 |             total += entry.metadata()?.len();\n 3127 |         }\n 3128 |     }\n 3129 | \n 3130 |     Ok(total)\n 3131 | }","lines":30,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cp/src/cp.rs#L3102-L3131"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `buffered` setting is computed as `self.bs.is_none() || self.is_conv_specified`, and `is_conv_specified` is set to true for ANY `conv=` operand (see parse_operand `\"conv\"` arm). But GNU dd only buffers partial blocks when a *data-transforming* conv is given. Output-only / non-transforming conv flags such as `conv=notrunc`, `conv=nocreat`, `conv=excl`, `conv=sparse`, `conv=noerror`, `conv=fsync`, `conv=fdatasync` are not data transformations. With e.g. `dd bs=N conv=notrunc`, GNU copies each (possibly partial) read straight to output, but this code enables partial-block buffering, changing record-out accounting and write timing versus GNU.","fix":"Set `is_conv_specified` (or a separate `is_data_transforming_conv`) only when one of the transforming convs is present: ascii/ebcdic/ibm/block/unblock/lcase/ucase/swab/sync. Non-transforming convs should not force buffering.","locations":[{"ref":"src/uu/dd/src/parseargs.rs:260-268","code":"  260 |         // Whether to buffer partial output blocks until they are completed.\n  261 |         //\n  262 |         // From the GNU `dd` documentation for the `bs=BYTES` option:\n  263 |         //\n  264 |         // > [...] if no data-transforming 'conv' option is specified,\n  265 |         // > input is copied to the output as soon as it's read, even if\n  266 |         // > it is smaller than the block size.\n  267 |         //\n  268 |         let buffered = self.bs.is_none() || self.is_conv_specified;","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/parseargs.rs#L260-L268"},{"ref":"src/uu/dd/src/parseargs.rs:319-322","code":"  319 |                 \"conv\" => {\n  320 |                     self.is_conv_specified = true;\n  321 |                     self.parse_conv_flags(v)?;\n  322 |                 }","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/parseargs.rs#L319-L322"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `process_all_string_arguments`, the loop that detects whether a clustered short-option argument expects a following value overwrites `expecting_arg` on every character instead of OR-ing. For an arg like `-iu` (or any cluster where a value-taking short flag is not the last char), only the last character decides `expecting_arg`, so e.g. `-ufoo` style detection across clusters can be wrong and the next token may be mis-treated as a program/positional instead of the option value.","fix":"Accumulate with `expecting_arg |= short_flags_with_args.contains(&c);` (or break once set) instead of `expecting_arg = short_flags_with_args.contains(&c);`.","locations":[{"ref":"src/uu/env/src/env.rs:733-737","code":"  733 |                     } else if let Some(flag) = arg_str.strip_prefix(\"-\") {\n  734 |                         for c in flag.chars() {\n  735 |                             expecting_arg = short_flags_with_args.contains(&c);\n  736 |                         }\n  737 |                     }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/env/src/env.rs#L733-L737"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `HeadError::ParseError` and `HeadError::Clap` variants interpolate a literal `0` into their\ntranslation messages instead of the actual error. The translation strings `head-error-parse-error`\n(`parse error: {$err}`) and `head-error-clap` (`clap error: {$err}`) expect the `err` value, but the\nattribute passes `\"err\" => 0`. As a result every parse/clap error is rendered as \"parse error: 0\" /\n\"clap error: 0\", discarding the real diagnostic that the code carefully built (e.g. the translated\nmessage constructed at arg_iterate, head.rs:113-115). User-facing error messages are useless.","fix":"Interpolate the actual payload, e.g. `\"err\" => 0` should be the variant field. For the tuple variant use a named field and reference it: `ParseError { err: String }` with `\"err\" => err`, and `Clap { err }` with `\"err\" => err`. The `MatchOption(String)` variant at line 53-54 already does this correctly with `\"{0}\"`.","locations":[{"ref":"src/uu/head/src/head.rs:47-48","code":"   47 |     #[error(\"{}\", translate!(\"head-error-parse-error\", \"err\" => 0))]\n   48 |     ParseError(String),","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/head/src/head.rs#L47-L48"},{"ref":"src/uu/head/src/head.rs:53-54","code":"   53 |     #[error(\"{}\", translate!(\"head-error-clap\", \"err\" => 0))]\n   54 |     Clap(#[from] clap::Error),","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/head/src/head.rs#L53-L54"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`uu_head` toggles `first` in two places that fight each other. Inside `print_header` (a closure),\n`first` is only set to `false` when a header is actually printed (line 465), and that only happens\nwhen the header condition holds. But at the end of the per-file loop body, `first = false` is set\nunconditionally (line 529). For the stdin branch the header is printed using a separate code path\n(lines 408-413) that never updates `first`. The net effect: when the first file is stdin printed\nwithout a header (single `-`, not verbose), the separator-newline logic for a subsequent file may be\ncomputed from a stale `first`. The header/separator placement across mixed stdin+file inputs is\nfragile and not clearly correct.","fix":"Unify header bookkeeping: have a single place that decides whether a leading newline is needed and that flips `first`, used by both the stdin and file branches, rather than mutating `first` from inside the closure and again at loop end.","locations":[{"ref":"src/uu/head/src/head.rs:449-457","code":"  449 |     let mut first = true;\n  450 |     for file in &options.files {\n  451 |         let res = if file == \"-\" {\n  452 |             if (options.files.len() > 1 && !options.quiet) || options.verbose {\n  453 |                 if !first {\n  454 |                     writeln!(stdout)?;\n  455 |                 }\n  456 |                 writeln!(stdout, \"{}\", translate!(\"head-header-stdin\"))?;\n  457 |             }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/head/src/head.rs#L449-L457"},{"ref":"src/uu/head/src/head.rs:509","code":"  509 |                     first = false;","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/head/src/head.rs#L509"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"On a panic, the installed panic hook only prints `\\r` and the panic message; it never calls\n`reset_term()`. Because `std::panic` unwinding does run `Drop` for `TerminalGuard`, the guard would\nnormally restore the terminal - but the guard is created inside `more()` and any panic before/outside\nthat scope (e.g. in `setup_term`, argument handling, or after `setup_term` succeeds but before the\nguard is constructed at line 434-436) leaves the terminal in raw mode / alternate screen with the\ncursor hidden. The window between `setup_term()?` (line 434) and `let _guard = TerminalGuard;`\n(line 436) is a real gap where a panic leaves the tty corrupted.","fix":"Construct the `TerminalGuard` before (or in the same statement as) `setup_term`, and/or have the\npanic hook call `reset_term()` so the terminal is always restored regardless of where the panic\noriginates.","locations":[{"ref":"src/uu/more/src/more.rs:150-153","code":"  150 |     set_hook(Box::new(|panic_info| {\n  151 |         print!(\"\\r\");\n  152 |         println!(\"{panic_info}\");\n  153 |     }));","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/more/src/more.rs#L150-L153"},{"ref":"src/uu/more/src/more.rs:433-435","code":"  433 |     let out = setup_term()?;\n  434 |     // Ensure raw mode is disabled on drop\n  435 |     let _guard = TerminalGuard;","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/more/src/more.rs#L433-L435"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In rename() the IfOlder update check uses fs::metadata(from) and fs::metadata(to) which both follow symlinks. When moving a symlink (mv preserves symlinks elsewhere via symlink_metadata), the timestamp comparison is taken from the link targets, not the links, so an up-to-date symlink pointing at an old target may be wrongly skipped, or vice versa. handle_two_paths uses symlink_metadata to detect source existence but rename then dereferences.","fix":"Use symlink_metadata for the source/target modification-time comparison so symlinks are compared as links, consistent with mv preserving them.","locations":[{"ref":"src/uu/mv/src/mv.rs:815-819","code":"  815 |         if (opts.update == UpdateMode::IfOlder)\n  816 |             && fs::metadata(from)?.modified()? <= fs::metadata(to)?.modified()?\n  817 |         {\n  818 |             return Ok(());\n  819 |         }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mv/src/mv.rs#L815-L819"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"copy_dir_contents only performs the recursive copy when both hardlink_tracker and hardlink_scanner are Some (the `if let (Some(tracker), Some(scanner))` arm). On unix, if either is None the function silently creates the empty destination directory, preserves its ownership, and returns Ok(()) without copying any directory contents - a silent data loss on the cross-device directory move path. The non-unix branch always copies. Given rename_dir_fallback then removes the source directory, contents could be lost.","fix":"Always perform the recursive copy on unix; fall back to with_optional_hardlink_context or a dummy tracker/scanner when none is supplied, rather than skipping the copy entirely.","locations":[{"ref":"src/uu/mv/src/mv.rs:1259-1282","code":" 1259 |     #[cfg(unix)]\n 1260 |     {\n 1261 |         // Preserve ownership (uid/gid) of the top-level directory\n 1262 |         let _ = preserve_ownership(from, to);\n 1263 | \n 1264 |         if let (Some(tracker), Some(scanner)) = (hardlink_tracker, hardlink_scanner) {\n 1265 |             copy_dir_contents_recursive(\n 1266 |                 from,\n 1267 |                 to,\n 1268 |                 tracker,\n 1269 |                 scanner,\n 1270 |                 verbose,\n 1271 |                 progress_bar,\n 1272 |                 display_manager,\n 1273 |             )?;\n 1274 |         }\n 1275 |     }\n 1276 |     #[cfg(not(unix))]\n 1277 |     {\n 1278 |         copy_dir_contents_recursive(from, to, verbose, progress_bar, display_manager)?;\n 1279 |     }\n 1280 | \n 1281 |     Ok(())\n 1282 | }","lines":24,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mv/src/mv.rs#L1259-L1282"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Duplicate-line detection compares `memory_decoder.get_buffer(0) == &previous_bytes[..]` only when `length == line_bytes`, and stores previous_bytes only for full lines. A subtle correctness point: previous_bytes is cloned via clone_buffer which resizes to used_normal_length, but get_buffer(0) returns a slice of len used_normal_length. On the very first full line, previous_bytes is empty so the comparison is false (correct). However, the \"*\" duplicate suppression compares the raw decoded buffer bytes, which for the final partial line is zero-padded by zero_out_buffer before the comparison branch is even reached (the length != line_bytes branch runs first and mutates the buffer); since the duplicate check requires length == line_bytes it never sees padded data, so this is fine. No bug, but the ordering coupling (zero_out_buffer mutating the shared buffer before the duplicate comparison) is fragile and undocumented.","fix":"Add a comment documenting that the partial-line zero-fill must precede, and is mutually exclusive with, the full-line duplicate comparison; or restructure so the duplicate check operates on an explicitly full-length buffer.","locations":[{"ref":"src/uu/od/src/od.rs:550-574","code":"  550 |                 // not enough byte for a whole element, this should only happen on the last line.\n  551 |                 if length != line_bytes {\n  552 |                     // set zero bytes in the part of the buffer that will be used, but is not filled.\n  553 |                     let mut max_used = length + output_info.byte_size_block;\n  554 |                     if max_used > line_bytes {\n  555 |                         max_used = line_bytes;\n  556 |                     }\n  557 | \n  558 |                     memory_decoder.zero_out_buffer(length, max_used);\n  559 |                 }\n  560 | \n  561 |                 if !output_info.output_duplicates\n  562 |                     && length == line_bytes\n  563 |                     && memory_decoder.get_buffer(0) == &previous_bytes[..]\n  564 |                 {\n  565 |                     if !duplicate_line {\n  566 |                         duplicate_line = true;\n  567 |                         writeln!(writer, \"*\")?;\n  568 |                     }\n  569 |                 } else {\n  570 |                     duplicate_line = false;\n  571 |                     if length == line_bytes {\n  572 |                         // save a copy of the input unless it is the last line\n  573 |                         memory_decoder.clone_buffer(&mut previous_bytes);\n  574 |                     }","lines":25,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/od.rs#L550-L574"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Round-robin chunking miscounts closed writers. `closed_writers` is incremented every time `custom_write_all` returns false (a BrokenPipe on a `--filter` child), but the same broken writer is written to once per full round (every `num_chunks` lines). A single permanently-closed filter pipe therefore keeps incrementing `closed_writers` on each round and can reach `num_chunks` while the other N-1 writers are still open, causing the loop to terminate early and silently drop the rest of the input. The intended semantics is to stop only when ALL distinct writers are closed; counting per-write rather than per-writer is wrong.","fix":"Track closed state per writer index (e.g. a `vec![false; num_chunks]` set on first BrokenPipe for that index) and only increment the closed count on the transition from open to closed, then break when every index is marked closed.","locations":[{"ref":"src/uu/split/src/split.rs:1234-1263","code":" 1234 |     let mut closed_writers = 0;\n 1235 | \n 1236 |     let mut i = 0;\n 1237 |     loop {\n 1238 |         let line = &mut Vec::new();\n 1239 |         let num_bytes_read = reader.by_ref().read_until(sep, line)?;\n 1240 | \n 1241 |         // if there is nothing else to read - exit the loop\n 1242 |         if num_bytes_read == 0 {\n 1243 |             break;\n 1244 |         }\n 1245 | \n 1246 |         let bytes = line.as_slice();\n 1247 |         if let Some(chunk_number) = kth_chunk {\n 1248 |             if (i % num_chunks) == (chunk_number - 1) as usize {\n 1249 |                 stdout_writer.write_all(bytes)?;\n 1250 |             }\n 1251 |         } else {\n 1252 |             let writer = out_files.get_writer(i % num_chunks, settings)?;\n 1253 |             let writer_stdin_open = custom_write_all(bytes, writer, settings)?;\n 1254 |             if !writer_stdin_open {\n 1255 |                 closed_writers += 1;\n 1256 |             }\n 1257 |         }\n 1258 |         i += 1;\n 1259 |         if closed_writers == num_chunks {\n 1260 |             // all writers are closed - stop reading\n 1261 |             break;\n 1262 |         }\n 1263 |     }","lines":30,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/split.rs#L1234-L1263"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`FileHandling::contains_key` (files.rs:81-83) does NOT canonicalize its key, unlike every other\naccessor (`insert`, `get`, `get_mut`, `remove` all call `canonicalize_path`). In `follow()`,\n`process_event` gates `handle_event` on `observer.files.contains_key(event_path)` using the raw\nevent path, then `handle_event` immediately calls `self.files.get(event_path)` which DOES\ncanonicalize. If the watcher delivers a non-canonical path (e.g. via a symlinked/relative parent\ndir, common since watches are installed on parent directories), `contains_key` can return true/false\ninconsistently with `get`, leading either to a missed event or to a panic in `get().unwrap()`.","fix":"Make `contains_key` canonicalize the path like the other accessors: `self.map.contains_key(&Self::canonicalize_path(k))`.","locations":[{"ref":"src/uu/tail/src/follow/files.rs:82-84","code":"   82 |     pub fn contains_key(&self, k: &Path) -> bool {\n   83 |         self.map.contains_key(k)\n   84 |     }","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/follow/files.rs#L82-L84"},{"ref":"src/uu/tail/src/follow/watch.rs:304-306","code":"  304 |         let event_path = event.paths.first().unwrap();\n  305 |         let mut paths: Vec<PathBuf> = vec![];\n  306 |         let display_name = self.files.get(event_path).display_name.clone();","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/follow/watch.rs#L304-L306"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `follow()`, when `use_polling` is true the code overwrites `paths` with *all* watched keys on\nevery loop iteration (lines 631-636), then `tail_file`s each. This is the documented PollWatcher\nrename workaround, but combined with `BytesChunkBuffer::new(u64::MAX)` in `tail_file`\n(files.rs:139), each poll re-reads from the current reader position. If the reader was reset to None\n(reset_reader) but the file later reappears without `update_reader` being driven (e.g. descriptor\nmode where reset happens but reopen does not), `tail_file` returns false silently and the appeared\ndata is lost. The polling path's \"consider all files dirty\" also defeats the per-event header\ndedup, since header logic relies on `last` ordering across many forced reads.","fix":"In the polling fan-out, skip paths whose reader is None (nothing to read) and ensure reset readers are re-opened before being re-tailed; only mark a file dirty when its metadata actually changed.","locations":[{"ref":"src/uu/tail/src/follow/watch.rs:647-657","code":"  647 |         if observer.use_polling && settings.follow.is_some() {\n  648 |             // Consider all files to potentially have new content.\n  649 |             // This is a workaround because `Notify::PollWatcher`\n  650 |             // does not recognize the \"renaming\" of files.\n  651 |             paths = observer.files.keys().cloned().collect::<Vec<_>>();\n  652 |         }\n  653 | \n  654 |         // main print loop\n  655 |         for path in &paths {\n  656 |             _read_some = observer.files.tail_file(path, settings.verbose)?;\n  657 |         }","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/follow/watch.rs#L647-L657"},{"ref":"src/uu/tail/src/follow/files.rs:139-160","code":"  139 |     pub fn tail_file(&mut self, path: &Path, verbose: bool) -> UResult<bool> {\n  140 |         let mut chunks = BytesChunkBuffer::new(u64::MAX);\n  141 |         if let Some(reader) = self.get_mut(path).reader.as_mut() {\n  142 |             chunks.fill(reader)?;\n  143 |         }\n  144 |         if chunks.has_data() {\n  145 |             if self.needs_header(path, verbose) {\n  146 |                 let display_name = self.get(path).display_name.clone();\n  147 |                 self.header_printer.print(display_name.as_str());\n  148 |             }\n  149 | \n  150 |             let mut writer = BufWriter::new(stdout().lock());\n  151 |             chunks.write(&mut writer)?;\n  152 |             writer.flush()?;\n  153 | \n  154 |             self.last.replace(path.to_owned());\n  155 |             self.update_metadata(path, None);\n  156 |             Ok(true)\n  157 |         } else {\n  158 |             Ok(false)\n  159 |         }\n  160 |     }","lines":22,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/follow/files.rs#L139-L160"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `tail_stdin`, after `input.resolve()` returns `None` (the pipe/FIFO branch), the code re-checks\n`paths::stdin_is_bad_fd()` at line 304. But the very top of the function (line 274) already returned\nearly with the same bad-fd handling for *all* stdin cases. Since `stdin_is_bad_fd()` is a pure\nfunction of process state that cannot change between line 274 and line 304, the inner check at\n304-315 is dead code: it can never be true. The follow-specific \"reading file\" message it guards is\ntherefore unreachable.","fix":"Remove the redundant `stdin_is_bad_fd()` block at 304-315 (keep the `else` body), or, if the intent was to emit the follow-mode \"reading\" message for a bad stdin fd, move that logic into the single early-return at 274-282.","locations":[{"ref":"src/uu/tail/src/tail.rs:271-280","code":"  271 |     // Check if stdin was closed before Rust reopened it as /dev/null\n  272 |     if paths::stdin_is_bad_fd() {\n  273 |         set_exit_code(1);\n  274 |         show_error!(\n  275 |             \"{}\",\n  276 |             translate!(\"tail-error-cannot-fstat\", \"file\" => translate!(\"tail-stdin-header\").quote(), \"error\" => translate!(\"tail-bad-fd\"))\n  277 |         );\n  278 |         show_error!(\"{}\", translate!(\"tail-no-files-remaining\"));\n  279 |         return Ok(());\n  280 |     }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/tail.rs#L271-L280"},{"ref":"src/uu/tail/src/tail.rs:300-311","code":"  300 |         if paths::stdin_is_bad_fd() {\n  301 |             set_exit_code(1);\n  302 |             show_error!(\n  303 |                 \"{}\",\n  304 |                 translate!(\"tail-error-cannot-fstat\", \"file\" => translate!(\"tail-stdin-header\"), \"error\" => translate!(\"tail-bad-fd\"))\n  305 |             );\n  306 |             if settings.follow.is_some() {\n  307 |                 show_error!(\n  308 |                     \"{}\",\n  309 |                     translate!(\"tail-error-reading-file\", \"file\" => translate!(\"tail-stdin-header\"), \"error\" => translate!(\"tail-bad-fd\"))\n  310 |                 );\n  311 |             }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/tail.rs#L300-L311"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"update_times for ChangeTimes::AtimeOnly/MtimeOnly re-stats the file with stat(path, !opts.no_deref) to fetch the time being preserved, but this happens AFTER touch_file may have just created the file. For a freshly created file the preserved time is read back from disk; this is generally fine, but if the file was created via create_without_truncate and then a TOCTOU symlink swap occurs, the stat here follows a possibly different target than the one created, and the preserved time could come from an attacker-controlled file. The earlier create path was hardened against truncation but this re-stat path is not similarly hardened.","fix":"Open the file once (O_NOFOLLOW where appropriate) and operate on the FD for both the stat-to-preserve and the futimens call, rather than re-resolving the path, to keep the create/stat/set sequence race-free.","locations":[{"ref":"src/uu/touch/src/touch.rs:585-596","code":"  585 |             stat(path, !opts.no_deref)\n  586 |                 .map_err_context(\n  587 |                     || translate!(\"touch-error-failed-to-get-attributes\", \"path\" => path.quote()),\n  588 |                 )?\n  589 |                 .1,\n  590 |         ),\n  591 |         ChangeTimes::MtimeOnly => (\n  592 |             stat(path, !opts.no_deref)\n  593 |                 .map_err_context(\n  594 |                     || translate!(\"touch-error-failed-to-get-attributes\", \"path\" => path.quote()),\n  595 |                 )?\n  596 |                 .0,","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/touch/src/touch.rs#L585-L596"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"tsort detect_cycle shares a single `stack` Vec across all DFS root iterations, but `dfs` pushes the root node onto the stack BEFORE checking if it is already Closed and returns early (without popping) when it is. After the first full DFS pass closes many nodes, every subsequent `dfs(root)` call on an already-Closed node leaves a stale `(node, successors)` entry on the shared stack. These stale entries are never cleared and get drained into a later traversal, so the eventually-reported cycle path can contain unrelated nodes. This corrupts the cycle list printed on stderr when the graph has a cycle.","fix":"Pop the just-pushed entry before the early `return false` at the Closed check (or clear/reset `stack` at the start of each outer loop iteration in `detect_cycle`). E.g. `if state == VisitedState::Closed { stack.pop(); return false; }`.","locations":[{"ref":"src/uu/tsort/src/tsort.rs:314-327","code":"  314 |         let mut visited = FxHashMap::default();\n  315 |         let mut stack = Vec::with_capacity(self.nodes.len());\n  316 |         for &node in &nodes {\n  317 |             if self.dfs(node, &mut visited, &mut stack) {\n  318 |                 let (loop_entry, _) = stack.pop().expect(\"loop is not empty\");\n  319 | \n  320 |                 return stack\n  321 |                     .into_iter()\n  322 |                     .map(|(node, _)| node)\n  323 |                     .skip_while(|&node| node != loop_entry)\n  324 |                     .collect();\n  325 |             }\n  326 |         }\n  327 |         unreachable!(\"detect_cycle is expected to be called only on graphs with cycles\");","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tsort/src/tsort.rs#L314-L327"},{"ref":"src/uu/tsort/src/tsort.rs:336-346","code":"  336 |         stack.push((\n  337 |             node,\n  338 |             self.nodes\n  339 |                 .get(&node)\n  340 |                 .map_or(&[], |n: &Node| &n.successor_tokens),\n  341 |         ));\n  342 |         let state = *visited.entry(node).or_insert(VisitedState::Opened);\n  343 | \n  344 |         if state == VisitedState::Closed {\n  345 |             return false;\n  346 |         }","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tsort/src/tsort.rs#L336-L346"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Operator-precedence bug in remote-filesystem detection. The expression\n`dev_name.starts_with(\"//\") && fs_type == \"smbfs\" || fs_type == \"cifs\"` parses\nas `(dev_name.starts_with(\"//\") && fs_type == \"smbfs\") || (fs_type == \"cifs\")`.\nGNU's `me_remote` intends `dev_name.starts_with(\"//\") && (fs_type == \"smbfs\" || fs_type == \"cifs\")`.\nAs written, every cifs filesystem is reported remote regardless of dev_name, and\nthe `//` requirement is silently dropped for cifs. This affects `df` remote/local\nclassification and any caller relying on MountInfo.remote.","fix":"Group the disjunction: `dev_name.starts_with(\"//\") && (fs_type == \"smbfs\" || fs_type == \"cifs\")`.","locations":[{"ref":"src/uucore/src/lib/features/fsext.rs:411-415","code":"  411 | fn is_remote_filesystem(dev_name: &str, fs_type: &str) -> bool {\n  412 |     dev_name.find(':').is_some()\n  413 |         || (dev_name.starts_with(\"//\") && fs_type == \"smbfs\" || fs_type == \"cifs\")\n  414 |         || dev_name == \"-hosts\"\n  415 | }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/fsext.rs#L411-L415"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"get_locale_from_env does not skip empty environment variables. find_map uses std::env::var(key).ok() with no emptiness filter, so an empty LC_ALL (i.e. LC_ALL=\"\") is accepted as the locale source and stops the LC_ALL/LC_COLLATE/LANG search chain. An empty variable then parses to (DEFAULT_LOCALE, Ascii). POSIX/glibc treat an empty locale variable as unset and fall through to the next variable. Notably the sibling module charmap.rs::get_encoding does filter empties (.filter(|v| !v.is_empty())), so the two locale resolvers disagree on the same environment, producing inconsistent encoding decisions for collation/numeric vs. charmap.","fix":"Filter out empty values when scanning env vars, matching charmap.rs: `.find_map(|&key| std::env::var(key).ok().filter(|v| !v.is_empty()))`.","locations":[{"ref":"src/uucore/src/lib/features/i18n/mod.rs:38-41","code":"   38 | pub fn get_locale_from_env(locale_name: &str) -> (Locale, UEncoding) {\n   39 |     let locale_var = [\"LC_ALL\", locale_name, \"LANG\"]\n   40 |         .iter()\n   41 |         .find_map(|&key| std::env::var(key).ok());","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/i18n/mod.rs#L38-L41"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"parse_change handles the 'u'/'g'/'o' copy-source operands by breaking out of the\nloop after the first one and setting pos=1, so a symbolic clause like \"u=go\" or\n\"a+ug\" silently ignores everything after the first copy letter rather than erroring\nor combining. Also, a copy letter that is not the first character (pos != 0) is\nsilently dropped (the `break` at pos!=0 leaves srwx from prior r/w/x bits but\ndiscards the copy semantics). GNU chmod treats e.g. \"u+rg\" by combining, and rejects\nsome of these. The single-letter restriction comment acknowledges this is a partial\nimplementation, but the silent truncation can produce a wrong mode without an error.","fix":"Match GNU semantics: when a copy operand (u/g/o) appears, it must be the sole\n\"perms\" token; otherwise error. Verify against GNU chmod for mixed forms like \"u+rg\".","locations":[{"ref":"src/uucore/src/lib/features/mode.rs:283-318","code":"  283 | fn parse_change(mode: &str, fperm: u32, considering_dir: bool) -> (u32, usize) {\n  284 |     let mut srwx = 0;\n  285 |     let mut pos = 0;\n  286 |     for ch in mode.chars() {\n  287 |         match ch {\n  288 |             'r' => srwx |= 0o444,\n  289 |             'w' => srwx |= 0o222,\n  290 |             'x' => srwx |= 0o111,\n  291 |             'X' => {\n  292 |                 if considering_dir || (fperm & 0o0111) != 0 {\n  293 |                     srwx |= 0o111;\n  294 |                 }\n  295 |             }\n  296 |             's' => srwx |= 0o4000 | 0o2000,\n  297 |             't' => srwx |= 0o1000,\n  298 |             'u' => srwx = (fperm & 0o700) | ((fperm >> 3) & 0o070) | ((fperm >> 6) & 0o007),\n  299 |             'g' => srwx = ((fperm << 3) & 0o700) | (fperm & 0o070) | ((fperm >> 3) & 0o007),\n  300 |             'o' => srwx = ((fperm << 6) & 0o700) | ((fperm << 3) & 0o070) | (fperm & 0o007),\n  301 |             _ => break,\n  302 |         }\n  303 |         if ch == 'u' || ch == 'g' || ch == 'o' {\n  304 |             // symbolic modes only allows perms to be a single letter of 'ugo'\n  305 |             // therefore this must either be the first char or it is unexpected\n  306 |             if pos != 0 {\n  307 |                 break;\n  308 |             }\n  309 |             pos = 1;\n  310 |             break;\n  311 |         }\n  312 |         pos += 1;\n  313 |     }\n  314 |     if pos == 0 {\n  315 |         srwx = 0;\n  316 |     }\n  317 |     (srwx, pos)\n  318 | }","lines":36,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/mode.rs#L283-L318"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"parse_signed_num does NOT strip leading zeros before calling parse_size_u64, while its sibling\nparse_signed_num_max DOES (size_string.trim_start_matches('0')). Because parse_size interprets a\nleading-zero decimal string as octal, the two entry points disagree: parse_signed_num(\"010\")\nreturns 8 (octal), but parse_signed_num_max(\"010\") returns 10 (decimal). head/tail style args such\nas \"-010\" would therefore be interpreted differently depending on which function the caller uses,\nwhich is almost certainly unintended and diverges from GNU behavior (these args are decimal).","fix":"Make parse_signed_num strip leading zeros the same way parse_signed_num_max does (trim_start_matches('0')\nwith an all-zeros special case), so both paths treat the value as decimal consistently.","locations":[{"ref":"src/uucore/src/lib/features/parser/parse_signed_num.rs:139-153","code":"  139 | pub fn parse_signed_num(src: &str) -> Result<SignedNum, ParseSizeError> {\n  140 |     let (sign, size_string) = strip_sign_prefix(src);\n  141 | \n  142 |     // Empty string after stripping sign is an error\n  143 |     if size_string.is_empty() {\n  144 |         return Err(ParseSizeError::ParseFailure(src.to_string()));\n  145 |     }\n  146 | \n  147 |     // Use parse_size_u64 but on failure, create our own error with the raw string\n  148 |     // (without quotes) so callers can format it as needed\n  149 |     let value = parse_size_u64(size_string)\n  150 |         .map_err(|_| ParseSizeError::ParseFailure(size_string.to_string()))?;\n  151 | \n  152 |     Ok(SignedNum { value, sign })\n  153 | }","lines":15,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/parser/parse_signed_num.rs#L139-L153"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"create_dest_restrictive documents that on a pre-existing file O_TRUNC empties contents\nwhile the existing inode mode is preserved (0o600 only applies to freshly created\ninodes). This is correct, but safe_copy_file relies on it: when the destination already\nexists with a permissive mode (e.g. 0o666 world-writable), safe_copy_file truncates and\nwrites through it WITHOUT narrowing the mode, defeating the documented anti-leak\nguarantee for the pre-existing-file case. The security comment in the module header\nimplies the destination is always created restrictively, but the existing-inode path\nsilently retains whatever mode was there.","fix":"Document this caveat at safe_copy_file too, and have security-sensitive callers\nfchmod the fd to 0o600 immediately after open when the dest pre-existed, or unlink-then-create.","locations":[{"ref":"src/uucore/src/lib/features/safe_copy.rs:59-80","code":"   59 | /// Create `path` with the restrictive [`DEST_INITIAL_MODE`].\n   60 | ///\n   61 | /// On a pre-existing file `O_TRUNC` empties the contents but the existing\n   62 | /// inode's mode is preserved; the restrictive mode only applies to a\n   63 | /// freshly created inode. Callers that need to widen the destination to\n   64 | /// the source's permissions should do so via `set_permissions` *after*\n   65 | /// the content copy completes.\n   66 | ///\n   67 | /// With `nofollow = true`, an existing symlink at `path` causes `ELOOP`\n   68 | /// rather than truncating the symlink's target. Pass `true` whenever the\n   69 | /// caller has not just unlinked `path` itself: without it, an attacker\n   70 | /// who plants `path` as a symlink between the caller's check and this\n   71 | /// open can redirect the truncate (and the subsequent write) to any file\n   72 | /// the caller has permission to write.\n   73 | pub fn create_dest_restrictive<P: AsRef<Path>>(path: P, nofollow: bool) -> io::Result<File> {\n   74 |     let mut flags = DEST_FLAGS;\n   75 |     if nofollow {\n   76 |         flags |= OFlags::NOFOLLOW;\n   77 |     }\n   78 |     let fd: OwnedFd = open(path.as_ref(), flags, Mode::RUSR.union(Mode::WUSR))?;\n   79 |     Ok(File::from(fd))\n   80 | }","lines":22,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/safe_copy.rs#L59-L80"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"find_existing_ancestor + create_dir_all_safe: when the deepest existing ancestor is\nreached via a pre-existing symlink-to-directory, DirFd::open(existing_ancestor,\nSymlinkBehavior::Follow) follows it (intended, GNU behavior). But find_existing_ancestor\nuses fs::metadata (follows symlinks) to classify each ancestor, so a dangling symlink in\nthe middle of the path is classified as NotFound and recorded as a component-to-create;\nopen_or_create_subdir then stat_at's it NoFollow, sees S_IFLNK, and tries\nopen_subdir(Follow) which fails on the dangling target. The error path is correct, but\nthe residual TOCTOU window between find_existing_ancestor's path-based metadata and the\nsubsequent fd-anchored open is wider than the doc comment implies for the ancestor\ndiscovery phase (the ancestor itself is resolved purely by path, not fd).","fix":"Acceptable trade-off (documented), but the doc on create_dir_all_safe should make\nexplicit that ancestor discovery is fully path-based and only the creation phase is\nfd-anchored.","locations":[{"ref":"src/uucore/src/lib/features/safe_traversal.rs:497-559","code":"  497 | fn find_existing_ancestor(path: &Path) -> io::Result<(PathBuf, Vec<OsString>)> {\n  498 |     let mut current = path.to_path_buf();\n  499 |     let mut components: Vec<OsString> = Vec::new();\n  500 | \n  501 |     loop {\n  502 |         // Use metadata (follow symlinks) so that symlinks to directories are\n  503 |         // treated as existing ancestors rather than components to create.\n  504 |         match fs::metadata(&current) {\n  505 |             Ok(meta) => {\n  506 |                 if meta.is_dir() {\n  507 |                     // Found a directory (real or via symlink)\n  508 |                     components.reverse();\n  509 |                     return Ok((current, components));\n  510 |                 }\n  511 |                 // It's a file or other non-directory - treat as needing creation\n  512 |                 if let Some(file_name) = current.file_name() {\n  513 |                     components.push(file_name.to_os_string());\n  514 |                 }\n  515 |                 if let Some(parent) = current.parent() {\n  516 |                     if parent.as_os_str().is_empty() {\n  517 |                         // Reached empty parent (for relative paths), use \".\"\n  518 |                         components.reverse();\n  519 |                         return Ok((PathBuf::from(\".\"), components));\n  520 |                     }\n  521 |                     current = parent.to_path_buf();\n  522 |                 } else {\n  523 |                     // Reached filesystem root\n  524 |                     let root = if path.is_absolute() {\n  525 |                         PathBuf::from(\"/\")\n  526 |                     } else {\n  527 |                         PathBuf::from(\".\")\n  528 |                     };\n  529 |                     components.reverse();\n  530 |                     return Ok((root, components));\n  531 |                 }\n  532 |             }\n  533 |             Err(e) if e.kind() == io::ErrorKind::NotFound => {\n  534 |                 // Doesn't exist, record component and move up to parent\n  535 |                 if let Some(file_name) = current.file_name() {\n  536 |                     components.push(file_name.to_os_string());\n  537 |                 }\n  538 |                 if let Some(parent) = current.parent() {\n  539 |                     if parent.as_os_str().is_empty() {\n  540 |                         // Reached empty parent (for relative paths), use \".\"\n  541 |                         components.reverse();\n  542 |                         return Ok((PathBuf::from(\".\"), components));\n  543 |                     }\n  544 |                     current = parent.to_path_buf();\n  545 |                 } else {\n  546 |                     // Reached filesystem root\n  547 |                     let root = if path.is_absolute() {\n  548 |                         PathBuf::from(\"/\")\n  549 |                     } else {\n  550 |                         PathBuf::from(\".\")\n  551 |                     };\n  552 |                     components.reverse();\n  553 |                     return Ok((root, components));\n  554 |                 }\n  555 |             }\n  556 |             Err(e) => return Err(e),\n  557 |         }\n  558 |     }\n  559 | }","lines":63,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/safe_traversal.rs#L497-L559"},{"ref":"src/uucore/src/lib/features/safe_traversal.rs:630-639","code":"  630 | pub fn create_dir_all_safe(path: &Path, mode: u32) -> io::Result<DirFd> {\n  631 |     let (existing_ancestor, components_to_create) = find_existing_ancestor(path)?;\n  632 |     let mut dir_fd = DirFd::open(&existing_ancestor, SymlinkBehavior::Follow)?;\n  633 | \n  634 |     for component in &components_to_create {\n  635 |         dir_fd = open_or_create_subdir(&dir_fd, component.as_os_str(), mode)?;\n  636 |     }\n  637 | \n  638 |     Ok(dir_fd)\n  639 | }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/safe_traversal.rs#L630-L639"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The multicall name resolution treats any binary whose stem ends with the literal string \"utils\" as the coreutils dispatcher (`is_coreutils = binary_as_util.ends_with(\"utils\")`) and any stem ending with \"box\" as a busybox-style dispatcher. A user hardlink/rename such as `myutils`, `cutils`, or `toolbox` is therefore silently interpreted as the multi-call binary (consuming argv[1] as the util name) rather than reporting 'unknown program'. The intent is to match exactly `coreutils`/`*box`, not an arbitrary `*utils` suffix.","fix":"Match the dispatcher name explicitly (e.g. `binary_as_util == \"coreutils\"`) instead of a broad `ends_with(\"utils\")`, and similarly tighten the `*box` check, or document that the suffix match is intentional.","locations":[{"ref":"src/bin/coreutils.rs:63","code":"   63 |     let is_coreutils = binary_as_util.ends_with(\"utils\");","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/coreutils.rs#L63"},{"ref":"src/bin/coreutils.rs:71","code":"   71 |     } else if is_coreutils || binary_as_util.ends_with(\"box\") {","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/coreutils.rs#L71"},{"ref":"src/bin/coreutils.rs:137","code":"  137 |     if binary_as_util.ends_with(\"box\") {","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/coreutils.rs#L137"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"post_process_manpage's escape-sequence fix does two sequential string replacements: `replace(\"\\\\\\\\0\", \"\\e0\")` then `replace(\"\\\\0\", \"\\e0\")`. Because the four-backslash pattern is a superset prefix of the two-backslash pattern, runs of backslashes are collapsed in an order-dependent way (e.g. an odd run of >4 backslashes before a 0 leaves stray backslashes), so the rewrite is not robust for inputs other than the exact cases covered by the tests. It happens to pass the current tests but is fragile.","fix":"Use a single regex that matches one-or-more backslashes followed by 0 and emits the intended `\\e0`, e.g. `Regex::new(r\"\\\\+0\")`, to make the transformation unambiguous.","locations":[{"ref":"src/bin/uudoc.rs:81-85","code":"   81 |     // Fix escape sequence issues\n   82 |     // \\\\\\\\0 appears when trying to represent literal \\0 string\n   83 |     // In man pages, use \\e for literal backslash\n   84 |     result = result.replace(\"\\\\\\\\\\\\\\\\0\", \"\\\\e0\");\n   85 |     result = result.replace(\"\\\\\\\\0\", \"\\\\e0\");","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/uudoc.rs#L81-L85"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"comm LineReader::read_line unconditionally pushes a line terminator onto buf, including at EOF when read_until returns 0 and buf is empty. This injects a spurious \"\\n\" (or \"\\0\") into an otherwise empty buffer. It is currently masked because callers gate on the returned byte count (na/nb != 0) and never read the buffer when the count is 0, but it is a latent trap: any future caller that inspects buf after a 0-length read will see phantom content.","fix":"Only append the terminator when bytes were actually read, e.g. guard with `if result.as_ref().is_ok_and(|&n| n > 0) && !buf.ends_with(&[line_ending])`.","locations":[{"ref":"src/uu/comm/src/comm.rs:100-113","code":"  100 |     fn read_line(&mut self, buf: &mut Vec<u8>) -> io::Result<usize> {\n  101 |         let line_ending = self.line_ending.into();\n  102 | \n  103 |         let result = match &mut self.input {\n  104 |             Input::Stdin(r) => r.read_until(line_ending, buf),\n  105 |             Input::FileIn(r) => r.read_until(line_ending, buf),\n  106 |         };\n  107 | \n  108 |         if !buf.ends_with(&[line_ending]) {\n  109 |             buf.push(line_ending);\n  110 |         }\n  111 | \n  112 |         result\n  113 |     }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/comm/src/comm.rs#L100-L113"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"aligned_ancestors slices source_ancestors[1..n-1] and dest_ancestors[1..=k]. If source has only one component (n == 1), `n - 1 == 0` and the range 1..0 would panic (slice index start > end) / or for n==0 underflow. source.ancestors() always yields at least the path itself plus \"\" so n>=2 in normal use, but a source like an empty path or root could make n==1, panicking. This is reachable via --parents with unusual source paths.","fix":"Guard against source_ancestors.len() < 2 (and dest shorter than k) before slicing, returning an empty vec.","locations":[{"ref":"src/uu/cp/src/cp.rs:2313-2340","code":" 2313 | fn aligned_ancestors<'a>(source: &'a Path, dest: &'a Path) -> Vec<(&'a Path, &'a Path)> {\n 2314 |     // Collect the ancestors of each. For example, if `source` is\n 2315 |     // \"a/b/c\", then the ancestors are \"a/b/c\", \"a/b\", \"a/\", and \"\".\n 2316 |     let source_ancestors: Vec<&Path> = source.ancestors().collect();\n 2317 |     let dest_ancestors: Vec<&Path> = dest.ancestors().collect();\n 2318 | \n 2319 |     // For this particular application, we don't care about the null\n 2320 |     // path \"\" and we don't care about the full path (e.g. \"a/b/c\"),\n 2321 |     // so we exclude those.\n 2322 |     let n = source_ancestors.len();\n 2323 |     let source_ancestors = &source_ancestors[1..n - 1];\n 2324 | \n 2325 |     // Get the matching number of elements from the ancestors of the\n 2326 |     // destination path (for example, get \"d/a\" and \"d/a/b\").\n 2327 |     let k = source_ancestors.len();\n 2328 |     let dest_ancestors = &dest_ancestors[1..=k];\n 2329 | \n 2330 |     // Now we have two slices of the same length, so we zip them.\n 2331 |     let mut result = vec![];\n 2332 |     for (x, y) in source_ancestors\n 2333 |         .iter()\n 2334 |         .rev()\n 2335 |         .zip(dest_ancestors.iter().rev())\n 2336 |     {\n 2337 |         result.push((*x, *y));\n 2338 |     }\n 2339 |     result\n 2340 | }","lines":28,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cp/src/cp.rs#L2313-L2340"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"copy_file dangling-symlink protection special-cases std::env::var_os(\"POSIXLY_CORRECT\").is_none(): when POSIXLY_CORRECT is set, cp proceeds to write through a dangling dest symlink without the safety error. Reading process env on every file copy is also a per-file syscall-ish cost. More importantly the behavior flip is undocumented in the surrounding error message and could surprise users into following a dangling link.","fix":"Read POSIXLY_CORRECT once into Options at startup and document the behavior; verify it matches GNU semantics.","locations":[{"ref":"src/uu/cp/src/cp.rs:2614-2627","code":" 2614 |         let copy_contents = options.dereference(source_in_command_line) || !source_is_symlink;\n 2615 |         if copy_contents\n 2616 |             && !dest_target_exists\n 2617 |             && !matches!(\n 2618 |                 options.overwrite,\n 2619 |                 OverwriteMode::Clobber(ClobberMode::RemoveDestination)\n 2620 |             )\n 2621 |             && !is_symlink_loop(dest)\n 2622 |             && std::env::var_os(\"POSIXLY_CORRECT\").is_none()\n 2623 |         {\n 2624 |             return Err(CpError::Error(\n 2625 |                 translate!(\"cp-error-not-writing-dangling-symlink\", \"dest\" => dest.quote()),\n 2626 |             ));\n 2627 |         }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cp/src/cp.rs#L2614-L2627"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The \"1-2 digits for hour offset\" comment is not enforced consistently. additional_hours is produced by parsing the entire remaining substring with chars.as_str().parse(), but the only length guard is s.len() > 3. A 2-digit value like 99 is accepted, and the digit-count is never actually capped at the documented 1-2 range in a meaningful way (e.g. it permits hour offsets far outside any real military-zone usage), feeding the DayDelta bug above.","fix":"Validate that the digit portion is at most 2 digits and within a sane range, or treat values that cross more than one day boundary explicitly (see the DayDelta finding).","locations":[{"ref":"src/uu/date/src/date.rs:309-317","code":"  309 |     // Parse optional digits (1-2 digits for hour offset)\n  310 |     let additional_hours: i32 = if let Some(rest) = chars.as_str().chars().next() {\n  311 |         if !rest.is_ascii_digit() {\n  312 |             return None;\n  313 |         }\n  314 |         chars.as_str().parse().ok()?\n  315 |     } else {\n  316 |         0\n  317 |     };","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/date/src/date.rs#L309-L317"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"parse_military_timezone_with_offset computes DayDelta as a single-day step (Same/Previous/Next), but when the additional hour offset is large the true UTC time can cross more than one day boundary. For input \"m99\" the length check (s.len() > 3) accepts it: tz_offset=12, additional_hours=99, so the true offset from local midnight is 99-12=87 hours (~3.6 days), yet day_delta only yields DayDelta::Next (advances exactly one day). The composed date is therefore off by ~2 days. The same single-step limitation applies to other letter/offset combinations whose magnitude exceeds 24h.","fix":"Compute the number of whole days to shift from (additional_hours - tz_offset).div_euclid(24) and apply that many days to the base date, instead of a one-of-three DayDelta enum. Alternatively, restrict additional_hours to a single digit (GNU only allows a small offset) and reject 2-digit values that overflow a day.","locations":[{"ref":"src/uu/date/src/date.rs:328-336","code":"  328 |     let day_delta = match additional_hours - tz_offset {\n  329 |         h if h < 0 => DayDelta::Previous,\n  330 |         h if h >= 24 => DayDelta::Next,\n  331 |         _ => DayDelta::Same,\n  332 |     };\n  333 | \n  334 |     // Calculate total hours: midnight (0) + tz_offset + additional_hours\n  335 |     // Midnight in timezone X converted to UTC\n  336 |     let hours_from_midnight = (0 - tz_offset + additional_hours).rem_euclid(24);","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/date/src/date.rs#L328-L336"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In date.rs uumain, the OPT_ISO_8601 default uses iter.next().unwrap_or(&DATE.to_string()) which allocates a temporary String(\"date\") and takes a reference to it inside unwrap_or; this borrows a value that is dropped at the end of the statement only because .as_str().into() converts immediately. It works but relies on temporary-lifetime extension and is fragile/confusing; clippy may flag the needless allocation on the default path.","fix":"Use unwrap_or(DATE) with a &str default (DATE is already &str) instead of &DATE.to_string(): map(|mut iter| iter.next().map(String::as_str).unwrap_or(DATE).into()).","locations":[{"ref":"src/uu/date/src/date.rs:392-393","code":"  392 |         .get_many::<String>(OPT_ISO_8601)\n  393 |         .map(|mut iter| iter.next().unwrap_or(&DATE.to_string()).as_str().into())","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/date/src/date.rs#L392-L393"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In apply_modifiers the swap-case (#) branch lowercases when every char is non-alpha-or-uppercase and uppercases only when not every char is non-alpha-or-lowercase. For an all-numeric value (e.g. \"%#m\" -> \"06\") the first predicate is true, so to_lowercase() runs (a no-op), but for mixed/empty results the two predicates can both be false, leaving the string unchanged. The logic is convoluted and the # flag on numeric specifiers silently does nothing rather than being rejected, diverging subtly from GNU which applies case only to text fields.","fix":"Apply case transforms only for text specifiers (is_text_specifier), and simplify the swap-case to a per-character case flip, which is what GNU # actually does.","locations":[{"ref":"src/uu/date/src/format_modifiers.rs:412-424","code":"  412 |     } else if swap_case {\n  413 |         if result\n  414 |             .chars()\n  415 |             .all(|c| !c.is_alphabetic() || c.is_uppercase())\n  416 |         {\n  417 |             result = result.to_lowercase();\n  418 |         } else if !result\n  419 |             .chars()\n  420 |             .all(|c| !c.is_alphabetic() || c.is_lowercase())\n  421 |         {\n  422 |             result = result.to_uppercase();\n  423 |         }\n  424 |     }","lines":13,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/date/src/format_modifiers.rs#L412-L424"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ensure_timezone_in_format inserts \"%Z \" before the first %Y/%y, but if the locale format already contains %z (lowercase numeric offset) and not %Z, it still appends/inserts a literal %Z, producing duplicated timezone output (numeric offset plus abbreviation). The check only looks for \"%Z\", not \"%z\".","fix":"Treat both %Z and %z as already containing timezone info: if format.contains(\"%Z\") || format.contains(\"%z\") return unchanged.","locations":[{"ref":"src/uu/date/src/locale.rs:88-104","code":"   88 |     fn ensure_timezone_in_format(format: &str) -> String {\n   89 |         if format.contains(\"%Z\") {\n   90 |             return format.to_string();\n   91 |         }\n   92 | \n   93 |         // Try to insert %Z before year specifier (%Y or %y)\n   94 |         if let Some(pos) = format.find(\"%Y\").or_else(|| format.find(\"%y\")) {\n   95 |             let mut result = String::with_capacity(format.len() + 3);\n   96 |             result.push_str(&format[..pos]);\n   97 |             result.push_str(\"%Z \");\n   98 |             result.push_str(&format[pos..]);\n   99 |             result\n  100 |         } else {\n  101 |             // No year found, append %Z at the end\n  102 |             format.to_string() + \" %Z\"\n  103 |         }\n  104 |     }","lines":17,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/date/src/locale.rs#L88-L104"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Source::skip` for `StdinFile`, after a successful seek the code checks `if pos > file_len` and prints \"cannot skip to specified offset\", then still returns `Ok(n)` (the requested amount) rather than the bytes actually skipped. `file_len` is fetched as `f.metadata().map_or(u64::MAX, ...)`; if metadata fails it defaults to u64::MAX, suppressing the warning entirely. Returning `Ok(n)` (not the real position) can mis-report records when seeking past EOF on a seekable stdin.","fix":"Return the actual seeked distance (or clamp to file_len) instead of the requested `n`, and treat a metadata failure as not-skippable rather than silently assuming u64::MAX.","locations":[{"ref":"src/uu/dd/src/dd.rs:273-285","code":"  273 |                 // Get file length before seeking to avoid race condition\n  274 |                 let file_len = f.metadata().as_ref().map_or(u64::MAX, Metadata::len);\n  275 |                 // Try seek first; fall back to read if not seekable\n  276 |                 match n.try_into().ok().map(|n| f.seek(SeekFrom::Current(n))) {\n  277 |                     Some(Ok(pos)) => {\n  278 |                         if pos > file_len {\n  279 |                             show_error!(\n  280 |                                 \"{}\",\n  281 |                                 translate!(\"dd-error-cannot-skip-offset\", \"file\" => \"standard input\")\n  282 |                             );\n  283 |                         }\n  284 |                         Ok(n)\n  285 |                     }","lines":13,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/dd.rs#L273-L285"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `numbers::SuffixType::base_and_suffix`, the comparison `bases[i + 1] - bases[i] < n` tests the *gap* between successive bases rather than `bases[i + 1] <= n`. This only coincidentally produces correct suffix selection because each base is large relative to its predecessor (gap ~= bases[i+1]). It is misleading and could select the wrong suffix near boundary values, and it is the same expression that risks the OOB noted above.","fix":"Compare against the next base directly: `while i + 1 < suffixes.len() && bases[i + 1] <= n { i += 1; }`.","locations":[{"ref":"src/uu/dd/src/numbers.rs:27","code":"   27 |         while bases[i + 1] - bases[i] < n && i < suffixes.len() {","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/numbers.rs#L27"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`to_magnitude_and_suffix` evaluates `bases[i + 1] - bases[i]` before the `i < suffixes.len()`\nbound in the loop condition `while bases[i + 1] - bases[i] < n && i < suffixes.len()`. It\nhappens to stay in-bounds today only because `bases` has 11 elements and `suffixes` has 9, so\n`i` stops at 9 and `bases[10]` is the last valid index. This is fragile: the index bound that\nkeeps it safe is on the right-hand side of the `&&` and is checked second, while the array\naccess is on the left. Any change to the suffix/base table lengths could turn this into an\nout-of-bounds panic. The comparison `bases[i+1] - bases[i] < n` is also a non-obvious\nexpression (it relies on the gap between consecutive powers approximating the next power).","fix":"Reorder the condition so the bound is checked first, e.g.\n`while i + 1 < suffixes.len() && bases[i + 1] - bases[i] < n`, and consider a clearer\ncomparison against the threshold value.","locations":[{"ref":"src/uu/df/src/blocks.rs:62-66","code":"   62 |     let mut i = 0;\n   63 | \n   64 |     while bases[i + 1] - bases[i] < n && i < suffixes.len() {\n   65 |         i += 1;\n   66 |     }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/df/src/blocks.rs#L62-L66"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In dirname `dirname_string_manipulation`, the condition at the `/.`-stripping step is `if bytes.ends_with(b\".\") && bytes.len() >= 2`. The `ends_with(b\".\")` matches any path ending in a literal dot, but the intent (per the doc comment) is only the `/.` pattern; a path like \"a.b\" ending in \"b\" is not matched, but a path like \"foo.\" (ending in plain dot, not `/.`) falls through correctly because `bytes[dot_pos-1] != b\\x27/\\x27`. The logic is correct but the ordering of the `&& bytes.len() >= 2` after `ends_with` reads as a redundant guard (ends_with(\".\") already implies len>=1; the real need is len>=2 before indexing dot_pos-1). Cosmetic but the guard could be clearer.","fix":"Reorder to `if bytes.len() >= 2 && bytes.ends_with(b\".\")` so the length precondition for `bytes[dot_pos - 1]` is established first; functionally equivalent but clearer.","locations":[{"ref":"src/uu/dirname/src/dirname.rs:60-79","code":"   60 |     if bytes.ends_with(b\".\") && bytes.len() >= 2 {\n   61 |         let dot_pos = bytes.len() - 1;\n   62 |         if bytes[dot_pos - 1] == b'/' {\n   63 |             // Find where the slashes before the dot start\n   64 |             let mut slash_start = dot_pos - 1;\n   65 |             while slash_start > 0 && bytes[slash_start - 1] == b'/' {\n   66 |                 slash_start -= 1;\n   67 |             }\n   68 |             // Return the stripped result\n   69 |             if slash_start == 0 {\n   70 |                 // Result would be empty\n   71 |                 return if path_bytes.starts_with(b\"/\") {\n   72 |                     b\"/\"\n   73 |                 } else {\n   74 |                     b\".\"\n   75 |                 };\n   76 |             }\n   77 |             return &bytes[..slash_start];\n   78 |         }\n   79 |     }","lines":20,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dirname/src/dirname.rs#L60-L79"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`du_regular` adds each directory's inode to the shared `seen_inodes` set (via the generic\ninode-dedup at the entry level) AND, separately, never removes directory inodes from\n`seen_inodes` (only `ancestors` is cleaned up on the way out). The `seen_inodes` set is meant\nfor hardlink dedup of files; directories cannot be hardlinked, so inserting them is harmless\nfor counting but means directory inodes accumulate in `seen_inodes` for the whole run. More\nimportantly, the inode-dedup check at lines 670-678 runs for directories too: if the same\ndirectory is reachable twice through different argument paths, the second visit is silently\nskipped even without `-l`, which can differ from GNU behavior for repeated/overlapping\narguments.","fix":"Confirm intended behavior for repeated directory arguments; if directories should not be\nsubject to the file-hardlink dedup, skip the `seen_inodes` insert/check for directory entries\n(they are already protected against cycles by the `ancestors` set in `du_regular`).","locations":[{"ref":"src/uu/du/src/du.rs:707-715","code":"  707 |                             if let Some(inode) = this_stat.inode {\n  708 |                                 // Check if the inode has been seen before and if we should skip it\n  709 |                                 if seen_inodes.contains(&inode) && !options.count_links {\n  710 |                                     // Skip further processing for this inode\n  711 |                                     continue;\n  712 |                                 }\n  713 |                                 // Mark this inode as seen\n  714 |                                 seen_inodes.insert(inode);\n  715 |                             }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/du/src/du.rs#L707-L715"},{"ref":"src/uu/du/src/du.rs:539-545","code":"  539 |         // Handle inodes\n  540 |         if let Some(inode) = this_stat.inode {\n  541 |             if seen_inodes.contains(&inode) && !options.count_links {\n  542 |                 continue;\n  543 |             }\n  544 |             seen_inodes.insert(inode);\n  545 |         }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/du/src/du.rs#L539-L545"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"head's `print_but_last_n_bytes` returns early-OK with `bytes_written = 0` when\n`catch_too_large_numbers_in_backwards_bytes_or_lines(n)` returns None (i.e. `n` does not fit in\nusize, only reachable on 32-bit targets with a 64-bit byte count). In that case the function\nsilently writes nothing and never reads/drains the input, yet returns Ok(0) as if it succeeded.\nThe same pattern exists in `print_but_last_n_lines` (lines 243-253). For a 32-bit build, `head -c -N`\nwith a huge N produces no output and no error instead of the GNU behavior of printing nothing only\nwhen N >= file size.","fix":"When `n` exceeds usize, clamp behavior to \"hold back everything\" only if n >= input length; otherwise it is effectively \"hold back more than the file has\", which already yields empty output - but the function should still consume stdin if needed and the misleading helper name/behavior should be documented or the branch handled explicitly.","locations":[{"ref":"src/uu/head/src/head.rs:262-279","code":"  262 | fn print_but_last_n_bytes(mut input: impl Read, n: u64) -> io::Result<u64> {\n  263 |     let mut bytes_written: u64 = 0;\n  264 |     if let Some(n) = catch_too_large_numbers_in_backwards_bytes_or_lines(n) {\n  265 |         let stdout = io::stdout();\n  266 |         let mut stdout = stdout.lock();\n  267 | \n  268 |         bytes_written = copy_all_but_n_bytes(&mut input, &mut stdout, n)\n  269 |             .map_err(wrap_in_stdout_error)?\n  270 |             .try_into()\n  271 |             .unwrap();\n  272 | \n  273 |         // Make sure we finish writing everything to the target before\n  274 |         // exiting. Otherwise, when Rust is implicitly flushing, any\n  275 |         // error will be silently ignored.\n  276 |         stdout.flush().map_err(wrap_in_stdout_error)?;\n  277 |     }\n  278 |     Ok(bytes_written)\n  279 | }","lines":18,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/head/src/head.rs#L262-L279"},{"ref":"src/uu/head/src/head.rs:281-299","code":"  281 | fn print_but_last_n_lines(mut input: impl Read, n: u64, separator: u8) -> io::Result<u64> {\n  282 |     let stdout = io::stdout();\n  283 |     let mut stdout = stdout.lock();\n  284 |     if n == 0 {\n  285 |         return io::copy(&mut input, &mut stdout).map_err(wrap_in_stdout_error);\n  286 |     }\n  287 |     let mut bytes_written: u64 = 0;\n  288 |     if let Some(n) = catch_too_large_numbers_in_backwards_bytes_or_lines(n) {\n  289 |         bytes_written = copy_all_but_n_lines(input, &mut stdout, n, separator)\n  290 |             .map_err(wrap_in_stdout_error)?\n  291 |             .try_into()\n  292 |             .unwrap();\n  293 |         // Make sure we finish writing everything to the target before\n  294 |         // exiting. Otherwise, when Rust is implicitly flushing, any\n  295 |         // error will be silently ignored.\n  296 |         stdout.flush().map_err(wrap_in_stdout_error)?;\n  297 |     }\n  298 |     Ok(bytes_written)\n  299 | }","lines":19,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/head/src/head.rs#L281-L299"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In hostname `--ip-address`, addresses are obtained by resolving \"hostname:1\" and then stripping a trailing \":1\" from the string form. For IPv6 results the string form is \"[::1]:1\"; stripping \":1\" leaves \"[::1]\" with surrounding brackets, producing malformed output. The de-duplication HashSet also keys on the SocketAddr (which always has port 1), and the \"XXX: not sure why this is necessary\" comment indicates the author was unsure of the logic.","fix":"Iterate over `addr.ip()` (an IpAddr) directly instead of the SocketAddr string, format that, and de-duplicate on the IpAddr. This avoids the fragile \":1\" port suffix stripping entirely.","locations":[{"ref":"src/uu/hostname/src/hostname.rs:100-112","code":"  100 |         for addr in addresses {\n  101 |             // XXX: not sure why this is necessary...\n  102 |             if !hashset.contains(&addr) {\n  103 |                 let mut ip = addr.to_string();\n  104 |                 if ip.ends_with(\":1\") {\n  105 |                     let len = ip.len();\n  106 |                     ip.truncate(len - 2);\n  107 |                 }\n  108 |                 output.push_str(&ip);\n  109 |                 output.push(' ');\n  110 |                 hashset.insert(addr);\n  111 |             }\n  112 |         }","lines":13,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/hostname/src/hostname.rs#L100-L112"}]},
