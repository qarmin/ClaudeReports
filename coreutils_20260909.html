{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"init_collator is a public function that is never called anywhere in the workspace (only try_init_collator and init_locale_collation are used). It duplicates try_init_collator except for panicking when the collator was already set. As exported-but-unused API it is effectively dead code.","fix":"Remove init_collator, or document why a panicking variant is retained; if kept, route try_init_collator and init_collator through a shared private constructor to avoid the duplicated try_new call.","locations":[{"ref":"src/uucore/src/lib/features/i18n/collator.rs:26-31","code":"   26 | /// Will initialize the collator and panic if already initialized.\n   27 | pub fn init_collator(opts: CollatorOptions) {\n   28 |     COLLATOR\n   29 |         .set(CollatorBorrowed::try_new(get_collating_locale().0.clone().into(), opts).unwrap())\n   30 |         .expect(\"Collator already initialized\");\n   31 | }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/i18n/collator.rs#L26-L31"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"into_stdio for the `#[cfg(not(target_os = \"wasi\"))]` build contains an inner `#[cfg(target_os = \"wasi\")]` block. Because the entire function is already compiled only when NOT wasi, the inner wasi branch is unreachable/never compiled and is pure dead code. The wasi case is handled by the separate into_stdio below it (lines 113-116), so this inner cfg branch is confusing and serves no purpose.","fix":"Drop the inner cfg blocks in the non-wasi into_stdio and just write `Stdio::from(self.fx)`; the dedicated wasi implementation already covers the wasi path.","locations":[{"ref":"src/uucore/src/lib/mods/os.rs:100-110","code":"","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/mods/os.rs#L100-L110"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`Num::Bytes`-aware `force_bytes_if` and the `count_bytes` handling are fine, but `IFlags`/`OFlags` carry fields (`cio`, `nolinks`, `binary`, `text`) that are never read - the corresponding parse arms always return `ParseError::Unimplemented` before setting them, so these struct fields can never be true and are pure dead state.","fix":"Remove the unused `cio`, `nolinks`, `binary`, `text` fields from IFlags/OFlags since the parser never sets them (they are rejected as Unimplemented).","locations":[{"ref":"src/uu/dd/src/datastructures.rs:51-87","code":"   51 |     pub cio: bool,\n   52 |     pub direct: bool,\n   53 |     pub directory: bool,\n   54 |     pub dsync: bool,\n   55 |     pub sync: bool,\n   56 |     pub nocache: bool,\n   57 |     pub nonblock: bool,\n   58 |     pub noatime: bool,\n   59 |     pub noctty: bool,\n   60 |     pub nofollow: bool,\n   61 |     pub nolinks: bool,\n   62 |     pub binary: bool,\n   63 |     pub text: bool,\n   64 |     pub fullblock: bool,\n   65 |     pub count_bytes: bool,\n   66 |     pub skip_bytes: bool,\n   67 | }\n   68 | \n   69 | /// Stores all Flags that apply to the output\n   70 | #[derive(Debug, Default, PartialEq, Eq)]\n   71 | pub struct OFlags {\n   72 |     pub append: bool,\n   73 |     pub cio: bool,\n   74 |     pub direct: bool,\n   75 |     pub directory: bool,\n   76 |     pub dsync: bool,\n   77 |     pub sync: bool,\n   78 |     pub nocache: bool,\n   79 |     pub nonblock: bool,\n   80 |     pub noatime: bool,\n   81 |     pub noctty: bool,\n   82 |     pub nofollow: bool,\n   83 |     pub nolinks: bool,\n   84 |     pub binary: bool,\n   85 |     pub text: bool,\n   86 |     pub seek_bytes: bool,\n   87 | }","lines":37,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/datastructures.rs#L51-L87"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"The `#[allow(unused_assignments)]` on `fold_file` suggests a leftover assignment that is never read. The `last_space = None` initialization and reassignments are all consumed through the `FoldContext`, but the attribute indicates either a stale suppression or a genuinely dead write; worth confirming and removing the allow if no longer needed.","fix":"Audit the assignments in `fold_file`; if none are actually unused, remove the `#[allow(unused_assignments)]` attribute.","locations":[{"ref":"src/uu/fold/src/fold.rs:679","code":"  679 | #[allow(unused_assignments)]","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/fold/src/fold.rs#L679"},{"ref":"src/uu/fold/src/fold.rs:690","code":"  690 |     let mut last_space = None;","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/fold/src/fold.rs#L690"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"The `#[allow(dead_code)]` enum SizeOrDeviceId is fine, but the explicit `#[allow(dead_code)]` annotation hides that on non-unix builds the `Device` variant is never constructed (display_len_or_rdev only produces `Device` under `#[cfg(unix)]`). This is intentional cross-platform code, noted only so the allow is not mistaken for a forgotten cleanup.","fix":"No action required; optionally scope the allow with a comment explaining it is non-unix-only.","locations":[{"ref":"src/uu/ls/src/display.rs:143-147","code":"  143 | #[allow(dead_code)]\n  144 | enum SizeOrDeviceId {\n  145 |     Size(String),\n  146 |     Device(String, String),\n  147 | }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/display.rs#L143-L147"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"HardlinkGroupScanner.source_files is populated (scan_files stores files.to_vec(), and the non-unix stub also sets it) but is never read anywhere in the module or crate. It is pure overhead (clones every source PathBuf) with no consumer.","fix":"Remove the source_files field and its assignments, or actually use it for destination mapping as the comment suggests.","locations":[{"ref":"src/uu/mv/src/hardlink.rs:30-31","code":"   30 |     /// List of source files/directories being moved (for destination mapping)\n   31 |     source_files: Vec<PathBuf>,","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mv/src/hardlink.rs#L30-L31"},{"ref":"src/uu/mv/src/hardlink.rs:180-181","code":"  180 |         // Store the source files for destination mapping\n  181 |         self.source_files = files.to_vec();","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mv/src/hardlink.rs#L180-L181"},{"ref":"src/uu/mv/src/hardlink.rs:262","code":"  262 |         self.source_files = files.to_vec();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mv/src/hardlink.rs#L262"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"HardlinkError variants Scan, Preservation, and Metadata, the From<io::Error> impl, the std::error::Error impl, and HardlinkTracker::new / HardlinkGroupScanner::new are defined but the rich error type is never returned by any function in the move path (functions return io::Result and use io::Error directly). The elaborate HardlinkError enum and its conversions are effectively dead.","fix":"Either route hardlink failures through HardlinkError or delete the unused variants/impls to reduce maintenance surface.","locations":[{"ref":"src/uu/mv/src/hardlink.rs:43-107","code":"   43 | /// Errors that can occur during hardlink operations\n   44 | #[derive(Debug)]\n   45 | pub enum HardlinkError {\n   46 |     Io(io::Error),\n   47 |     Scan(String),\n   48 |     Preservation { source: PathBuf, target: PathBuf },\n   49 |     Metadata { path: PathBuf, error: io::Error },\n   50 | }\n   51 | \n   52 | impl std::fmt::Display for HardlinkError {\n   53 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n   54 |         match self {\n   55 |             Self::Io(e) => write!(f, \"I/O error during hardlink operation: {e}\"),\n   56 |             Self::Scan(msg) => {\n   57 |                 write!(f, \"Failed to scan files for hardlinks: {msg}\")\n   58 |             }\n   59 |             Self::Preservation { source, target } => {\n   60 |                 write!(\n   61 |                     f,\n   62 |                     \"Failed to preserve hardlink: {} -> {}\",\n   63 |                     source.quote(),\n   64 |                     target.quote()\n   65 |                 )\n   66 |             }\n   67 |             Self::Metadata { path, error } => {\n   68 |                 write!(f, \"Metadata access error for {}: {error}\", path.quote())\n   69 |             }\n   70 |         }\n   71 |     }\n   72 | }\n   73 | \n   74 | impl std::error::Error for HardlinkError {\n   75 |     fn source(&self) -> Option<&(dyn std::error::Error + 'static)> {\n   76 |         match self {\n   77 |             Self::Io(e) => Some(e),\n   78 |             Self::Metadata { error, .. } => Some(error),\n   79 |             _ => None,\n   80 |         }\n   81 |     }\n   82 | }\n   83 | \n   84 | impl From<io::Error> for HardlinkError {\n   85 |     fn from(error: io::Error) -> Self {\n   86 |         Self::Io(error)\n   87 |     }\n   88 | }\n   89 | \n   90 | impl From<HardlinkError> for io::Error {\n   91 |     fn from(error: HardlinkError) -> Self {\n   92 |         match error {\n   93 |             HardlinkError::Io(e) => e,\n   94 |             HardlinkError::Scan(msg) => Self::other(msg),\n   95 |             HardlinkError::Preservation { source, target } => Self::other(format!(\n   96 |                 \"Failed to preserve hardlink: {} -> {}\",\n   97 |                 source.quote(),\n   98 |                 target.quote()\n   99 |             )),\n  100 | \n  101 |             HardlinkError::Metadata { path, error } => Self::other(format!(\n  102 |                 \"Metadata access error for {}: {error}\",\n  103 |                 path.quote(),\n  104 |             )),\n  105 |         }\n  106 |     }\n  107 | }","lines":65,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/mv/src/hardlink.rs#L43-L107"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"PartialReader, when given Some(0) limit, returns Ok(0) immediately (line 72), but the main path constructs PartialReader with read_bytes which, if the user passes -N0, would yield an empty output. The Some(0) arm is reachable. Separately, the CommandLineOpts trait and its ArgMatches impl reference \"getopts\" in doc comments though od uses clap; the trait is a thin wrapper kept only for parse_inputs testability. The doc comments (\"Abstraction for getopts\", \"Implementation for getopts\") are stale/misleading since the codebase migrated to clap.","fix":"Update the stale \"getopts\" doc comments to reflect clap, or remove the trait if the indirection is no longer needed for testing.","locations":[{"ref":"src/uu/od/src/parse_inputs.rs:9-29","code":"    9 | /// Abstraction for getopts\n   10 | pub trait CommandLineOpts {\n   11 |     /// returns all command line parameters which do not belong to an option.\n   12 |     fn inputs(&self) -> Vec<&str>;\n   13 |     /// tests if any of the specified options is present.\n   14 |     fn opts_present(&self, _: &[&str]) -> bool;\n   15 | }\n   16 | \n   17 | /// Implementation for `getopts`\n   18 | impl CommandLineOpts for ArgMatches {\n   19 |     fn inputs(&self) -> Vec<&str> {\n   20 |         self.get_many::<String>(options::FILENAME)\n   21 |             .map(|values| values.map(String::as_str).collect())\n   22 |             .unwrap_or_default()\n   23 |     }\n   24 | \n   25 |     fn opts_present(&self, opts: &[&str]) -> bool {\n   26 |         opts.iter()\n   27 |             .any(|opt| self.value_source(opt) == Some(clap::parser::ValueSource::CommandLine))\n   28 |     }\n   29 | }","lines":21,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/parse_inputs.rs#L9-L29"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`chunks.rs` carries a module-level `#![allow(dead_code)]` (with a comment that\nonly mentions `borrow_buffer` in `Chunk`). This blanket allow suppresses\ndead-code warnings for the entire file, so genuinely unused items (e.g. helper\nmethods, the `line_count_hint` plumbing on non-threaded paths) can accumulate\nundetected.","fix":"Replace the file-wide `#![allow(dead_code)]` with a targeted\n`#[allow(dead_code)]` on the specific item(s) that are conditionally unused so\nthe rest of the module keeps dead-code detection.","locations":[{"ref":"src/uu/sort/src/chunks.rs:9-10","code":"    9 | #![allow(dead_code)]\n   10 | // Ignores non-used warning for `borrow_buffer` in `Chunk`","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/chunks.rs#L9-L10"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"Number::digits is annotated `#[allow(dead_code)]` and is only used by unit tests; the production code never calls it. The allow attribute masks that the method is non-test dead code.","fix":"Move the method behind #[cfg(test)] alongside the tests that use it, or remove it if not needed.","locations":[{"ref":"src/uu/split/src/number.rs:103-109","code":"  103 |     #[allow(dead_code)]\n  104 |     fn digits(&self) -> Vec<u8> {\n  105 |         match self {\n  106 |             Self::FixedWidth(number) => number.digits(),\n  107 |             Self::DynamicWidth(number) => number.digits(),\n  108 |         }\n  109 |     }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/number.rs#L103-L109"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In `control_char_to_string`, after the `cc >= 0x80` adjustment `code` is at most `0xff - 0x80 = 0x7f`,\nand when `cc < 0x80` `code == cc <= 0x7f`. Therefore the `_ => Err(nix::errno::Errno::ERANGE)` arm\nmatching codes above `0x7f` is unreachable; the function can never return ERANGE. The comment\n\"Out of range (above 8 bits)\" is also misleading since `cc_t` is 8 bits here.","fix":"Drop the unreachable ERANGE arm (and make the match exhaustive over 0..=0x7f), or document why it is\nretained for non-u8 cc_t platforms; update the misleading \"above 8 bits\" comment.","locations":[{"ref":"src/uu/stty/src/stty.rs:841-850","code":"  841 |     let (ctrl_prefix, character) = match code {\n  842 |         // Control characters in ASCII range\n  843 |         0..=0x1f => Ok((\"^\", (b'@' + code) as char)),\n  844 |         // Printable ASCII characters\n  845 |         0x20..=0x7e => Ok((\"\", code as char)),\n  846 |         // DEL character\n  847 |         0x7f => Ok((\"^\", '?')),\n  848 |         // Out of range (above 8 bits)\n  849 |         _ => Err(nix::errno::Errno::ERANGE),\n  850 |     }?;","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/stty/src/stty.rs#L841-L850"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"The `follow()` loop maintains `timeout_counter` (incremented on every RecvTimeout, reset on event)\nand compares it to `settings.max_unchanged_stats` at line 643, but the body of that `if` is empty\n(only a TODO comment). The entire `timeout_counter` machinery and the `max-unchanged-stats` option\nhave no observable effect; `--max-unchanged-stats` is silently accepted and ignored.","fix":"Either implement the per-file re-stat-on-rotation behavior described in the TODO, or document that the option is a no-op. As-is it is dead code carrying an unused counter.","locations":[{"ref":"src/uu/tail/src/follow/watch.rs:505","code":"  505 |     let mut timeout_counter = 0;","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/follow/watch.rs#L505"},{"ref":"src/uu/tail/src/follow/watch.rs:631-632","code":"  631 |             Err(mpsc::RecvTimeoutError::Timeout) => {\n  632 |                 timeout_counter += 1;","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/follow/watch.rs#L631-L632"},{"ref":"src/uu/tail/src/follow/watch.rs:659-671","code":"  659 |         if timeout_counter == settings.max_unchanged_stats {\n  660 |             /*\n  661 |             TODO: [2021-10; jhscheer] implement timeout_counter for each file.\n  662 |             '--max-unchanged-stats=n'\n  663 |             When tailing a file by name, if there have been n (default n=5) consecutive iterations\n  664 |             for which the file has not changed, then open/fstat the file to determine if that file\n  665 |             name is still associated with the same device/inode-number pair as before. When\n  666 |             following a log file that is rotated, this is approximately the number of seconds\n  667 |             between when tail prints the l {"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"The InputFile enum and Stdout variant doc comment says \"--no-dereference will be ignored in this case\", and pathbuf_from_stdout has a target_os = \"wasi\" arm, but uu_app/uumain build InputFile only from filenames; the WASI arm and several cfg branches are only reachable on platforms not built/tested here. Not a bug, but the WASI branch duplicates the unix \"/dev/stdout\" path and could be merged.","fix":"Merge the wasi and unix arms (both return /dev/stdout) to reduce duplication.","locations":[{"ref":"src/uu/touch/src/touch.rs:84","code":"   84 |     /// Touch stdout. `--no-dereference` will be ignored in this case.","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/touch/src/touch.rs#L84"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"Length enum and Spec::parse_length parse and then discard all C length modifiers (h, hh, l, ll, j,\nz, t, L). The result is `let _ = Self::parse_length(...)` and the Length variants are never read.\nThis is intentional per the comments, but the entire enum + parser is effectively dead state today;\nflagging because the loop runs unbounded over repeated modifiers and the value is unused.","fix":"Either consume length modifiers without materializing a Length value (simple skip loop), or add\n`#[allow(dead_code)]` / a doc note clarifying the variants are deliberately retained for future use.","locations":[{"ref":"src/uucore/src/lib/features/format/spec.rs:86-107","code":"   86 | /// Size of the expected type (ignored)\n   87 | ///\n   88 | /// We ignore this parameter entirely, but we do parse it.\n   89 | /// It could be used in the future if the need arises.\n   90 | enum Length {\n   91 |     /// signed/unsigned char (\"hh\")\n   92 |     Char,\n   93 |     /// signed/unsigned short int (\"h\")\n   94 |     Short,\n   95 |     /// signed/unsigned long int (\"l\")\n   96 |     Long,\n   97 |     /// signed/unsigned long long int (\"ll\")\n   98 |     LongLong,\n   99 |     /// intmax_t (\"j\")\n  100 |     IntMaxT,\n  101 |     /// size_t (\"z\")\n  102 |     SizeT,\n  103 |     /// ptrdiff_t (\"t\")\n  104 |     PtfDiffT,\n  105 |     /// long double (\"L\")\n  106 |     LongDouble,\n  107 | }","lines":22,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/format/spec.rs#L86-L107"},{"ref":"src/uucore/src/lib/features/format/spec.rs:192","code":"  192 |         let _ = Self::parse_length(rest, &mut index);","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/format/spec.rs#L192"},{"ref":"src/uucore/src/lib/features/format/spec.rs:298-340","code":"  298 |     fn parse_length(rest: &mut &[u8], index: &mut usize) -> Option<Length> {\n  299 |         // Parse 0..N length options, keep the last one\n  300 |         // Even though it is just ignored. We might want to use it later and we\n  301 |         // should parse those characters.\n  302 |         //\n  303 |         // TODO: This needs to be configurable: `seq` accepts only one length\n  304 |         //       param\n  305 |         let mut length = None;\n  306 |         loop {\n  307 |             let new_length = rest.get(*index).and_then(|c| {\n  308 |                 Some(match c {\n  309 |                     b'h' => {\n  310 |                         if let Some(b'h') = rest.get(*index + 1) {\n  311 |                             *index += 1;\n  312 |                             Length::Char\n  313 |                         } else {\n  314 |                             Length::Short\n  315 |                         }\n  316 |                     }\n  317 |                     b'l' => {\n  318 |                         if let Some(b'l') = rest.get(*index + 1) {\n  319 |                             *index += 1;\n  320 |                             Length::Long\n  321 |                         } else {\n  322 |                             Length::LongLong\n  323 |                         }\n  324 |                     }\n  325 |                     b'j' => Length::IntMaxT,\n  326 |                     b'z' => Length::SizeT,\n  327 |                     b't' => Length::PtfDiffT,\n  328 |                     b'L' => Length::LongDouble,\n  329 |                     _ => return None,\n  330 |                 })\n  331 |             });\n  332 |             if new_length.is_some() {\n  333 |                 *index += 1;\n  334 |                 length = new_length;\n  335 |             } else {\n  336 |                 break;\n  337 |             }\n  338 |         }\n  339 |         length\n  340 |     }","lines":43,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/format/spec.rs#L298-L340"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"The parse_glob::from_str doctest imports `use std::time::Duration;` which is never used in the example. It is harmless but is dead in the documentation example and can mislead readers into thinking glob parsing involves a duration.","fix":"Remove the unused `use std::time::Duration;` line from the doc example.","locations":[{"ref":"src/uucore/src/lib/features/parser/parse_glob.rs:50","code":"   50 | /// use std::time::Duration;","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/parser/parse_glob.rs#L50"}]},
{"id":"DEAD_18","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In CQuoter::push_invalid, EscapedChar::new_octal(*b).hide_control() applies hide_control to an Octal escape state, but hide_control only rewrites EscapeState::Char(control) -> Char('?') and is a no-op for the Octal variant. The .hide_control() call here is dead/pointless and may mislead a reader into thinking control handling differs for invalid bytes.","fix":"Drop the .hide_control() from the octal path: `let escaped: String = EscapedChar::new_octal(*b).collect();`.","locations":[{"ref":"src/uucore/src/lib/features/quoting_style/c_quoter.rs:42-47","code":"   42 |     fn push_invalid(&mut self, input: &[u8]) {\n   43 |         for b in input {\n   44 |             let escaped: String = EscapedChar::new_octal(*b).hide_control().collect();\n   45 |             self.buffer.extend_from_slice(escaped.as_bytes());\n   46 |         }\n   47 |     }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/quoting_style/c_quoter.rs#L42-L47"}]},
{"id":"DEAD_19","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`bytes_start_with` re-implements a prefix-membership check that is only ever called once\n(`finalize_shell_quoter`) with `SPECIAL_SHELL_CHARS_START`. It is a trivial helper duplicating\n`pattern.contains(&bytes[0])` guarded by `!bytes.is_empty()`; standard `bytes.first().is_some_and(...)`\nexpresses this directly. Minor maintainability nit.","fix":"Inline as `reference.first().is_some_and(|b| SPECIAL_SHELL_CHARS_START.contains(b))` at the\ncall site and remove the helper.","locations":[{"ref":"src/uucore/src/lib/features/quoting_style/shell_quoter.rs:209-212","code":"  209 | /// Check whether `bytes` starts with any byte in `pattern`.\n  210 | fn bytes_start_with(bytes: &[u8], pattern: &[u8]) -> bool {\n  211 |     !bytes.is_empty() && pattern.contains(&bytes[0])\n  212 | }","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/quoting_style/shell_quoter.rs#L209-L212"}]},
{"id":"DEAD_20","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`SystemdUtmpxIter` exposes `reset()` and `get_all_records()` plus `next_record()` as public API, but the\nonly consumer (`utmpx.rs` `UtmpxIter::next`) drives it purely through the `Iterator` impl. `reset()` and\n`get_all_records()` appear unused. `SystemdLoginRecord::session_leader_pid` is populated but never read\n(records always set pid/session_leader_pid to 0). Likewise `get_session_type` is called and its result\nimmediately discarded into `_session_type` (line 431-434).","fix":"Drop the unused helpers/fields or wire them into the consumers; if intentionally kept for future use,\nannotate with a comment explaining why.","locations":[{"ref":"src/uucore/src/lib/features/systemd_logind.rs:626-638","code":"  626 |     /// Get all records at once\n  627 |     pub fn get_all_records(&self) -> Vec<SystemdUtmpxCompat> {\n  628 |         self.records\n  629 |             .iter()\n  630 |             .cloned()\n  631 |             .map(SystemdUtmpxCompat::new)\n  632 |             .collect()\n  633 |     }\n  634 | \n  635 |     /// Reset iterator to beginning\n  636 |     pub fn reset(&mut self) {\n  637 |         self.current_index = 0;\n  638 |     }","lines":13,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/systemd_logind.rs#L626-L638"},{"ref":"src/uucore/src/lib/features/systemd_logind.rs:431-434","code":"  431 |         let _session_type = login::get_session_type(&session_id)\n  432 |             .ok()\n  433 |             .flatten()\n  434 |             .unwrap_or_default();","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/systemd_logind.rs#L431-L434"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment for parse_military_timezone_with_offset states that \"a5\" -> 04:00 UTC \"next day\", but both the implementation and the unit test (test_parse_military_timezone_with_offset) return DayDelta::Same for \"a5\". The comment contradicts the actual behavior and the asserted test value.","fix":"Fix the comment to say \"a5\" stays on the same day (04:00 UTC), matching the code and test.","locations":[{"ref":"src/uu/date/src/date.rs:294-295","code":"  294 | /// The hour offset from digits is added to the base military timezone offset.\n  295 | /// Examples: \"m\" -> 12 (noon UTC), \"m9\" -> 21 (9pm UTC), \"a5\" -> 4 (4am UTC next day)","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/date/src/date.rs#L294-L295"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment on need_copy states \"Crashes the program if a nonexistent owner or group is specified in _b_.\" This is stale: behavior() now falls back to parsing the owner/group as a numeric id and only returns an InvalidUser/InvalidGroup error (no crash). The comment misleads readers into thinking need_copy can abort.","fix":"Remove or rewrite the \"# Errors / Crashes the program\" note to reflect that invalid users/groups are rejected earlier in behavior().","locations":[{"ref":"src/uu/install/src/install.rs:1238-1255","code":" 1238 | /// Return true if a file is necessary to copy. This is the case when:\n 1239 | ///\n 1240 | /// - _from_ or _to_ is nonexistent;\n 1241 | /// - either file has a sticky bit or set\\[ug\\]id bit, or the user specified one;\n 1242 | /// - either file isn't a regular file;\n 1243 | /// - the sizes of _from_ and _to_ differ;\n 1244 | /// - _to_'s owner differs from intended; or\n 1245 | /// - the contents of _from_ and _to_ differ.\n 1246 | ///\n 1247 | /// # Parameters\n 1248 | ///\n 1249 | /// _from_ and _to_, if existent, must be non-directories.\n 1250 | ///\n 1251 | /// # Errors\n 1252 | ///\n 1253 | /// Crashes the program if a nonexistent owner or group is specified in _b_.\n 1254 | ///\n 1255 | fn need_copy(from: &Path, to: &Path, b: &Behavior) -> bool {","lines":18,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/install/src/install.rs#L1238-L1255"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Several format_f* helper comments mislabel branches as \"subnormal numbers\". In format_float the final `else` branch (general exponential formatting for large/small normal magnitudes) is annotated \"// subnormal numbers\", and the earlier `format_f64_exp(f, width)` call for non-normal finite values is also labeled \"// subnormal numbers\". These branches handle normal numbers outside the fixed-notation range, not subnormals; the misleading comments make the precision/exponent logic harder to reason about.","fix":"Replace the \"subnormal numbers\" comments with accurate descriptions (e.g. \"values needing exponential notation\" / \"subnormal/denormal special case\" only where genuinely subnormal).","locations":[{"ref":"src/uu/od/src/prn_float.rs:265-281","code":"  265 |         return format_f64_exp(f, width); // subnormal numbers\n  266 |     }\n  267 | \n  268 |     let mut l = f.abs().log10().floor() as i32;\n  269 | \n  270 |     let r = 10f64.powi(l);\n  271 |     if (f > 0.0 && r > f) || (f < 0.0 && -r < f) {\n  272 |         // fix precision error\n  273 |         l -= 1;\n  274 |     }\n  275 | \n  276 |     if l >= 0 && l <= (precision as i32 - 1) {\n  277 |         format!(\"{f:width$.dec$}\", dec = (precision - 1) - l as usize)\n  278 |     } else if l == -1 {\n  279 |         format!(\"{f:width$.precision$}\")\n  280 |     } else {\n  281 |         format_f64_exp_precision(f, width, precision - 1) // subnormal numbers","lines":17,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/prn_float.rs#L265-L281"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comment \"// close stdin by dropping it\" is misleading/incorrect: the following statement (`self.shell_process.stdin.as_mut()`) does not drop or close stdin, it merely creates a temporary mutable borrow. The comment documents behavior the code does not perform.","fix":"Either fix the code to actually take/drop the owned stdin and keep the comment, or correct the comment to match reality.","locations":[{"ref":"src/uu/split/src/platform/unix.rs:106-109","code":"  106 |         {\n  107 |             // close stdin by dropping it\n  108 |             let _stdin = self.shell_process.stdin.as_mut();\n  109 |         }","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/platform/unix.rs#L106-L109"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment on `BytesChunk::from_chunk` says \"If the offset is larger or equal to `chunk.lines`\nthen a new empty `BytesChunk` is returned.\" `BytesChunk` has no `lines` field; the code compares\nagainst `chunk.bytes` (line 161). The comment is copy-pasted from the line-oriented variant and is\nmisleading.","fix":"Change 'chunk.lines' to 'chunk.bytes' in the comment.","locations":[{"ref":"src/uu/tail/src/chunks.rs:133-136","code":"  133 |     /// Create a new chunk from an existing chunk. The new chunk's buffer will be copied from the\n  134 |     /// old chunk's buffer, copying the slice `[offset..old_chunk.bytes]` into the new chunk's\n  135 |     /// buffer but starting at 0 instead of offset. If the offset is larger or equal to\n  136 |     /// `chunk.lines` then a new empty `BytesChunk` is returned.","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/chunks.rs#L133-L136"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment for compute_number_width / the Inputs::Files0From branch says \"[Inputs::Files0From], [MINIMUM_WIDTH] is returned\", but the code returns 1 for the Files0From case, not MINIMUM_WIDTH. The comment contradicts the implementation.","fix":"Update the doc comment to say that Files0From returns a width of 1, or change the code if MINIMUM_WIDTH was intended.","locations":[{"ref":"src/uu/wc/src/wc.rs:713","code":"  713 | /// For [`Inputs::Files0From`], [`MINIMUM_WIDTH`] is returned.","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/wc/src/wc.rs#L713"},{"ref":"src/uu/wc/src/wc.rs:729","code":"  729 |         Inputs::Files0From(_) => 1,","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/wc/src/wc.rs#L729"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment claims start is updated \"if we have a carry, or if inc > start\". `inc` is the increment byte slice and `start` is a buffer index, so \"inc > start\" is a meaningless/incorrect comparison. The actual condition is that start shrinks when the incremented number needs more digits than the current [start..end] region (i.e. when inc is longer than the current number, or a carry overflows it). The same wrong phrasing is duplicated in fast_inc_one.","fix":"Reword to: \"Updates `start` if the result needs more digits than the current [start..end] region (carry overflow or inc longer than the current number).\"","locations":[{"ref":"src/uucore/src/lib/features/fast_inc.rs:11","code":"   11 | /// Updates `start` if we have a carry, or if inc > start.","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/fast_inc.rs#L11"},{"ref":"src/uucore/src/lib/features/fast_inc.rs:73","code":"   73 | /// Updates `start` if we have a carry, or if inc > start.","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/fast_inc.rs#L73"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The `Digest::output_bits()` implementations for the legacy algorithms report values that do not match the\nactual emitted output. `Bsd::output_bits` returns 128 (line 334-336) for a 16-bit checksum, `SysV` returns\n512 (line 367-369) for a 16-bit checksum, and `Crc` returns 256 (line 262-264) for a 32-bit value. These\ntypes override `result()` so the wrong value is not currently used for buffer sizing, but the default\n`result()`/`output_bytes()` path (`vec![0; output_bytes()]` then `hash_finalize`) would `copy_from_slice`\na 2-byte value into a much larger buffer and panic if ever invoked. The numbers are misleading and a latent\nhazard.","fix":"Make `output_bits()` return the true output width (16 for Bsd/SysV, 32 for Crc), or document why these\nreturn block-size-related values; ensure the default `result()` path would not be misused.","locations":[{"ref":"src/uucore/src/lib/features/sum.rs:345-347","code":"  345 |     fn output_bits(&self) -> usize {\n  346 |         128\n  347 |     }","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/sum.rs#L345-L347"},{"ref":"src/uucore/src/lib/features/sum.rs:378-380","code":"  378 |     fn output_bits(&self) -> usize {\n  379 |         512\n  380 |     }","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/sum.rs#L378-L380"},{"ref":"src/uucore/src/lib/features/sum.rs:273-275","code":"  273 |     fn output_bits(&self) -> usize {\n  274 |         256\n  275 |     }","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/sum.rs#L273-L275"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"determine_update_mode doc comment states that \"the `ReplaceAll` mode is returned unconditionally\" when the required options are absent. There is no `ReplaceAll` variant in UpdateMode; the function actually returns UpdateMode::All. The comment is also imprecise: All is returned only in the no-option branch, not unconditionally.","fix":"Replace \"ReplaceAll\" with \"All\" and clarify that All is the default when neither --update nor -u is present.","locations":[{"ref":"src/uucore/src/lib/features/update_control.rs:104-105","code":"  104 | /// from [`arguments::update()`] or [`arguments::update_no_args()`]. Otherwise\n  105 | /// the `ReplaceAll` mode is returned unconditionally.","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/update_control.rs#L104-L105"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment for post_process_manpage claims it 'Removes trailing whitespace from all lines' and 'Fixes the TH header by uppercasing command names and adding a proper date', but the bullet also says it removes the date, while the code actually *replaces* the existing TH trailing content with a fresh quoted date (it does not merely remove it). The first test's comment (line 712) even says 'date is removed', which contradicts the expected output that adds a date. Minor doc/comment drift that can mislead future readers about behavior.","fix":"Reword the comments to state that the TH header's trailing fields are replaced with `1 \"<date>\"`, not that the date is removed.","locations":[{"ref":"src/bin/uudoc.rs:39-45","code":"   39 | /// This function:\n   40 | /// - Fixes the TH header by uppercasing command names and adding a proper date\n   41 | /// - Removes trailing whitespace from all lines\n   42 | /// - Fixes redundant .br paragraph macros that cause mandoc warnings\n   43 | /// - Removes .br before empty lines to avoid \"br before sp\" warnings\n   44 | /// - Removes .br after empty lines to avoid \"br after sp\" warnings\n   45 | /// - Fixes escape sequences (e.g., \\\\\\\\0 to \\\\0) to avoid \"undefined escape\" warnings","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/uudoc.rs#L39-L45"},{"ref":"src/bin/uudoc.rs:716-717","code":"  716 |     fn test_post_process_manpage_fixes_th_header() {\n  717 |         // Test that command names are uppercased and date is removed","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/uudoc.rs#L716-L717"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In cat, the comment for `LINE_NUMBER_BUF_SIZE` claims 32 digits is \"enough for billions of universe lifetimes\"; the buffer is 32 bytes total but holds the leading spaces, the digits, and the trailing tab, so the usable digit capacity is less than 32. The fast_inc logic moves `print_start` so overflow past the initial width is handled, but the comment overstates the fixed-size guarantee.","fix":"Clarify the comment to reflect that the buffer grows leftward via fast_inc and 32 bytes is simply a generous fixed allocation.","locations":[{"ref":"src/uu/cat/src/cat.rs:26-29","code":"   26 | // Allocate 32 digits for the line number.\n   27 | // An estimate is that we can print about 1e8 lines/seconds, so 32 digits\n   28 | // would be enough for billions of universe lifetimes.\n   29 | const LINE_NUMBER_BUF_SIZE: usize = 32;","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cat/src/cat.rs#L26-L29"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doctest-style example comment for `ProgUpdate::write_io_lines` shows expected output `b\"1+2 records in\\n3 truncated records\\n4+5 records out\\n\"` (truncated-records line between in and out), but the actual implementation writes read_stat, then write_stat, then the truncated-records line last. The real ordering (verified by test_prog_update_write_io_lines) is `1+2 records in\\n4+5 records out\\n3 truncated records\\n`. The doc comment is wrong about ordering.","fix":"Update the example comment to match the actual order: records in, records out, then truncated records.","locations":[{"ref":"src/uu/dd/src/progress.rs:78-98","code":"   78 |     /// ```rust,ignore\n   79 |     /// use std::io::Cursor;\n   80 |     /// use std::time::Duration;\n   81 |     /// use crate::progress::{ProgUpdate, ReadStat, WriteStat};\n   82 |     ///\n   83 |     /// let read_stat = ReadStat::new(1, 2, 3, 999);\n   84 |     /// let write_stat = WriteStat::new(4, 5, 6);\n   85 |     /// let duration = Duration::new(789, 0);\n   86 |     /// let prog_update = ProgUpdate {\n   87 |     ///     read_stat,\n   88 |     ///     write_stat,\n   89 |     ///     duration,\n   90 |     /// };\n   91 |     ///\n   92 |     /// let mut cursor = Cursor::new(vec![]);\n   93 |     /// prog_update.write_io_lines(&mut cursor).unwrap();\n   94 |     /// assert_eq!(\n   95 |     ///     cursor.get_ref(),\n   96 |     ///     b\"1+2 records in\\n3 truncated records\\n4+5 records out\\n\"\n   97 |     /// );\n   98 |     /// ```","lines":21,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/progress.rs#L78-L98"},{"ref":"src/uu/dd/src/progress.rs:99-110","code":"   99 |     fn write_io_lines(&self, w: &mut impl Write) -> std::io::Result<()> {\n  100 |         self.read_stat.report(w)?;\n  101 |         self.write_stat.report(w)?;\n  102 |         match self.read_stat.records_truncated {\n  103 |             0 => {}\n  104 |             count => {\n  105 |                 let message = translate!(\"dd-progress-truncated-record\", \"count\" => count);\n  106 |                 writeln!(w, \"{message}\")?;\n  107 |             }\n  108 |         }\n  109 |         Ok(())\n  110 |     }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/progress.rs#L99-L110"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The comment block above `du_regular` states it is \"Only used on non-Linux platforms\" and\n\"Used on non-Linux platforms and as fallback for symlinks on Linux\". This is misleading: on\nLinux/Unix `du_regular` is the path taken whenever `-L`/`--dereference` is used (the entire\n`Deref::All` traversal), not merely a \"fallback for symlinks\". The function is the primary\ndereferencing traversal on all platforms.","fix":"Update the comment to reflect that `du_regular` is used on non-Unix platforms and for the\n`-L`/`--dereference` (Deref::All) case on Unix.","locations":[{"ref":"src/uu/du/src/du.rs:604-607","code":"  604 | // this takes `my_stat` to avoid having to stat files multiple times.\n  605 | // Only used on non-Linux platforms\n  606 | // Regular traversal using std::fs\n  607 | // Used on non-Linux platforms and as fallback for symlinks on Linux","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/du/src/du.rs#L604-L607"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"A stale leftover debugging comment `// BUG?  printing egid={euid} ?` sits above the `egid`\nprint block. The code is in fact correct (it prints `egid={egid}` using the egid value), so the\ncomment is misleading and should be removed.","fix":"Delete the misleading `// BUG?` comment.","locations":[{"ref":"src/uu/id/src/id.rs:707","code":"  707 |         // BUG?  printing egid={euid} ?","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/id/src/id.rs#L707"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment in `write_line` claims it writes \"prefix bytes + line bytes + newline\", but the function only writes the line bytes and a newline; there is no prefix handling here (the prefix/padding is written separately by the caller in `nl`). The comment is misleading.","fix":"Update the comment to \"Write line bytes followed by a newline.\" to match the implementation.","locations":[{"ref":"src/uu/nl/src/nl.rs:383-387","code":"  383 | /// Helper to write: prefix bytes + line bytes + newline\n  384 | fn write_line(writer: &mut impl Write, line: &[u8]) -> io::Result<()> {\n  385 |     writer.write_all(line)?;\n  386 |     writeln!(writer)\n  387 | }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/nl/src/nl.rs#L383-L387"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment on `ascii_case_insensitive_cmp` says \"We upper each byte on the\nfly so that binary input (including NUL) stays untouched\" - but `fold` calls\n`to_ascii_uppercase`, which does transform ASCII letters; only non-letter bytes\nare untouched. The phrase \"stays untouched\" is misleading about what folding\ndoes to the comparison.","fix":"Reword to clarify that only the comparison key is folded (ASCII letters\nupper-cased) while non-ASCII/NUL bytes pass through unchanged and the original\nline bytes are never mutated.","locations":[{"ref":"src/uu/sort/src/sort.rs:2969-2976","code":" 2969 | /// Compare two byte slices in ASCII case-insensitive order without allocating.\n 2970 | /// We upper each byte on the fly so that binary input (including `NUL`) stays\n 2971 | /// untouched and we avoid locale-sensitive routines such as `strcasecmp`.\n 2972 | fn ascii_case_insensitive_cmp(a: &[u8], b: &[u8]) -> Ordering {\n 2973 |     #[inline]\n 2974 |     fn fold(byte: u8) -> u8 {\n 2975 |         byte.to_ascii_uppercase()\n 2976 |     }","lines":8,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/sort.rs#L2969-L2976"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment on `parse_rows_cols` says it \"Returns `None` if parsing fails or value exceeds\nu32::MAX\", but the code parses into `u64` and rejects values that do not fit in `u32`\n(`u32::try_from(n).is_ok()`). So the real bound is `> u32::MAX`, not `u64`; the phrase \"exceeds\nu32::MAX\" is correct but the surrounding text implying it parses u32 then wraps is slightly\ninconsistent with the u64 parse. Minor wording mismatch with the implementation.","fix":"Reword the comment to state it parses as u64 and rejects anything that does not fit in u32 before\nwrapping to u16, so the doc matches the code.","locations":[{"ref":"src/uu/stty/src/stty.rs:503-512","code":"  503 | /// Parse an integer with hex (0x/0X) and octal (0) prefix support, wrapping to u16.\n  504 | ///\n  505 | /// GNU stty uses an unsigned 32-bit integer for row/col sizes, then wraps to 16 bits.\n  506 | /// Returns `None` if parsing fails or value exceeds u32::MAX.\n  507 | fn parse_rows_cols(arg: &str) -> Option<u16> {\n  508 |     u64::extended_parse(arg)\n  509 |         .ok()\n  510 |         .filter(|&n| u32::try_from(n).is_ok())\n  511 |         .map(|n| (n % (u16::MAX as u64 + 1)) as u16)\n  512 | }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/stty/src/stty.rs#L503-L512"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment on `wait_or_kill_process` states \"If the child process terminates within the given time period and `preserve_status` is `false`, then 124 is returned\" and \"If the child does not terminate within the time period, then 137 is returned\". The 124 claim contradicts the actual code path that returns `CommandTimedOut` (124) only when preserve_status is false, and the 137 claim is unconditional regardless of preserve_status, which the function's own preserve_status parameter contradicts (see related logic finding).","fix":"Rewrite the docstring to match actual behavior (and fix the behavior so preserve_status is honored on the kill path).","locations":[{"ref":"src/uu/timeout/src/timeout.rs:196-215","code":"  196 | /// Wait for a child process and send a kill signal if it does not terminate.\n  197 | ///\n  198 | /// This function waits for the child `process` for the time period\n  199 | /// given by `duration`. If the child process does not terminate\n  200 | /// within that time, we send the `SIGKILL` signal to it. If `verbose`\n  201 | /// is `true`, then a message is printed to `stderr` when that\n  202 | /// happens.\n  203 | ///\n  204 | /// If the child process terminates within the given time period and\n  205 | /// `preserve_status` is `true`, then the status code of the child\n  206 | /// process is returned. If the child process terminates within the\n  207 | /// given time period and `preserve_status` is `false`, then 124 is\n  208 | /// returned. If the child does not terminate within the time period,\n  209 | /// then 137 is returned. Finally, if there is an error while waiting\n  210 | /// for the child process to terminate, then 124 is returned.\n  211 | ///\n  212 | /// # Errors\n  213 | ///\n  214 | /// If there is a problem sending the `SIGKILL` signal or waiting for\n  215 | /// the process after that signal is sent.","lines":20,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/timeout/src/timeout.rs#L196-L215"}]},
{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In the format module, the doc comments mis-describe lengths/contents: YYYYMMDDHHMMSS is commented \"%Y-%m-%d %H:%M:%S.%SS 12 chars\" but the constant is \"%Y-%m-%d %H:%M:%S.%f\" and is far more than 12 chars; YYYYMMDDHHMMS is commented \"12 chars\" but is \"%Y-%m-%d %H:%M:%S\" (17 chars). The \"%SS\" notation is also not a real specifier. These comments are misleading.","fix":"Correct the comments to reflect the actual format strings and lengths, and remove the bogus \"%SS\" notation.","locations":[{"ref":"src/uu/touch/src/touch.rs:132-135","code":"  132 |     // \"%Y-%m-%d %H:%M:%S.%SS\" 12 chars\n  133 |     pub(crate) const YYYYMMDDHHMMSS: &str = \"%Y-%m-%d %H:%M:%S.%f\";\n  134 |     // \"%Y-%m-%d %H:%M:%S\" 12 chars\n  135 |     pub(crate) const YYYYMMDDHHMMS: &str = \"%Y-%m-%d %H:%M:%S\";","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/touch/src/touch.rs#L132-L135"}]},
{"id":"CMT_20","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment \"-b doesn't ignores the VERSION_CONTROL environment variable\" has a\ndouble-negative/grammar error; the test actually asserts -b DOES honor the env var.","fix":"Reword to \"-b does not ignore the VERSION_CONTROL environment variable\".","locations":[{"ref":"src/uucore/src/lib/features/backup_control.rs:626","code":"  626 |     // -b doesn't ignores the \"VERSION_CONTROL\" environment variable","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/backup_control.rs#L626"}]},
{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment says \"Vary line length slightly for realism\" implying lines get both longer and shorter than avg_line_length. The expression `avg_line_length + (line_num % 40).saturating_sub(20)` only ever adds 0..=19 (the saturating_sub clamps the negative half to 0), so line length is never reduced below avg_line_length and is biased upward; it does not vary symmetrically as the comment suggests.","fix":"Either compute a signed offset (e.g. `avg_line_length as isize + ((line_num % 40) as isize - 20)` clamped to >=1) to vary both directions, or fix the comment to state that length only increases.","locations":[{"ref":"src/uucore/src/lib/features/benchmark.rs:96-97","code":"   96 |             // Vary line length slightly for realism\n   97 |             let line_length = avg_line_length + (line_num % 40).saturating_sub(20);","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/benchmark.rs#L96-L97"}]},
{"id":"CMT_22","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment on ExtendedParserError::Underflow uses `//` line comments (lines 120-121) instead\nof `///` doc comments, unlike the other variants which use `///`. As written the comment does not\ndocument the variant. Minor but inconsistent and the rustdoc for the variant is silently missing.","fix":"Change the two `//` lines to `///` so the Underflow variant is documented like the others.","locations":[{"ref":"src/uucore/src/lib/features/parser/num_parser.rs:120-122","code":"  120 |     // The value has underflowed the float storage (and is now 0.0 or -0.0).\n  121 |     // Does not apply to integer parsing.\n  122 |     Underflow(T),","lines":3,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/parser/num_parser.rs#L120-L122"}]},
{"id":"CMT_23","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment \"Only return true  we're about to \"accidentally\" recurse on \"/\".\" in the\ntest is grammatically broken (missing \"if\") and a duplicated/garbled version of the\ncomment above it; minor, but it obscures intent of test_symlink_no_slash.","fix":"Reword to \"Only return true if we're about to accidentally recurse on '/'.\"","locations":[{"ref":"src/uucore/src/lib/features/perms.rs:1086","code":" 1086 |         // Only return true  we're about to \"accidentally\" recurse on \"/\".","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/perms.rs#L1086"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The same `get_last_index` / `get_last` closure (check value_source == CommandLine, then index_of(flag).unwrap_or(0)) is re-defined verbatim in extract_files, extract_sort, extract_color, and Config::from (as `get_last`). Four identical copies of the same option-index helper.","fix":"Extract a single free function `fn last_cli_index(options: &ArgMatches, flag: &str) -> usize` and call it from all four sites.","locations":[{"ref":"src/uu/ls/src/config.rs:299-305","code":"  299 |     let get_last_index = |flag: &str| -> usize {\n  300 |         if options.value_source(flag) == Some(clap::parser::ValueSource::CommandLine) {\n  301 |             options.index_of(flag).unwrap_or(0)\n  302 |         } else {\n  303 |             0\n  304 |         }\n  305 |     };","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/config.rs#L299-L305"},{"ref":"src/uu/ls/src/config.rs:299-305","code":"  299 |     let get_last_index = |flag: &str| -> usize {\n  300 |         if options.value_source(flag) == Some(clap::parser::ValueSource::CommandLine) {\n  301 |             options.index_of(flag).unwrap_or(0)\n  302 |         } else {\n  303 |             0\n  304 |         }\n  305 |     };","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/config.rs#L299-L305"},{"ref":"src/uu/ls/src/config.rs:445-451","code":"  445 |     let get_last_index = |flag: &str| -> usize {\n  446 |         if options.value_source(flag) == Some(clap::parser::ValueSource::CommandLine) {\n  447 |             options.index_of(flag).unwrap_or(0)\n  448 |         } else {\n  449 |             0\n  450 |         }\n  451 |     };","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/config.rs#L445-L451"},{"ref":"src/uu/ls/src/config.rs:925-931","code":"  925 |         let get_last = |flag: &str| -> usize {\n  926 |             if options.value_source(flag) == Some(clap::parser::ValueSource::CommandLine) {\n  927 |                 options.index_of(flag).unwrap_or(0)\n  928 |             } else {\n  929 |                 0\n  930 |             }\n  931 |         };","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ls/src/config.rs#L925-L931"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"medium","description":"The `is_seekable` logic exists in two near-identical copies: head's free function\n(head.rs:346-351) and tail's `FileExtTail::is_seekable` (paths.rs:152-156). Both probe by\nstream_position + seek(End(0)) + seek(Start(pos)). The duplication invites the two to drift (head\nrestores to the original position; tail restores to a caller-supplied `current_offset`).","fix":"Factor a shared seekability helper into uucore::fs and have both head and tail call it, parameterizing the restore offset.","locations":[{"ref":"src/uu/head/src/head.rs:390-395","code":"  390 | fn is_seekable(input: &mut File) -> bool {\n  391 |     let current_pos = input.stream_position();\n  392 |     current_pos.is_ok()\n  393 |         && input.seek(SeekFrom::End(0)).is_ok()\n  394 |         && input.seek(SeekFrom::Start(current_pos.unwrap())).is_ok()\n  395 | }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/head/src/head.rs#L390-L395"},{"ref":"src/uu/tail/src/paths.rs:149-157","code":"  149 | impl FileExtTail for File {\n  150 |     /// Test if File is seekable.\n  151 |     /// Set the current position offset to `current_offset`.\n  152 |     fn is_seekable(&mut self, current_offset: u64) -> bool {\n  153 |         self.stream_position().is_ok()\n  154 |             && self.seek(SeekFrom::End(0)).is_ok()\n  155 |             && self.seek(SeekFrom::Start(current_offset)).is_ok()\n  156 |     }\n  157 | }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/paths.rs#L149-L157"}]},
{"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"medium","description":"parse_formats.rs duplicates float byte-size handling: parse_type_string contains an inline match for B/H/F/D float variants (lines 304-317) that overlaps with the is_format_size_char Float arms (lines 238-253). The inline match exists to capture float_variant for bf16/f16, but the F/D cases just set byte_size and duplicate what is_format_size_char already does, making it easy for the two size tables to drift out of sync.","fix":"Unify the float-size parsing so byte_size and the bf16/f16 variant selection are derived from a single table rather than two parallel matches.","locations":[{"ref":"src/uu/od/src/parse_formats.rs:283-317","code":"  283 |         if type_cat == FormatTypeCategory::Float {\n  284 |             match ch {\n  285 |                 Some(var @ ('B' | 'H')) => {\n  286 |                     byte_size = 2;\n  287 |                     float_variant = Some(var);\n  288 |                     ch = chars.next();\n  289 |                 }\n  290 |                 Some('F') => {\n  291 |                     byte_size = 4;\n  292 |                     ch = chars.next();\n  293 |                 }\n  294 |                 Some('D') => {\n  295 |                     byte_size = 8;\n  296 |                     ch = chars.next();\n  297 |                 }\n  298 |                 _ => {\n  299 |                     if is_format_size_char(ch, type_cat, &mut byte_size) {\n  300 |                         ch = chars.next();\n  301 |                     } else {\n  302 |                         let mut decimal_size = String::new();\n  303 |                         while is_format_size_decimal(ch, type_cat, &mut decimal_size) {\n  304 |                             ch = chars.next();\n  305 |                         }\n  306 |                         if !decimal_size.is_empty() {\n  307 |                             byte_size = decimal_size.parse().map_err(|_| {\n  308 |                                 translate!(\n  309 |                                     \"od-error-invalid-number\",\n  310 |                                     \"number\" => decimal_size.quote(),\n  311 |                                     \"spec\" => params.quote()\n  312 |                                 )\n  313 |                             })?;\n  314 |                         }\n  315 |                     }\n  316 |                 }\n  317 |             }","lines":35,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/parse_formats.rs#L283-L317"}]},
{"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"medium","description":"The ERANGE-message construction-and-strip idiom (`std::io::Error::from_raw_os_error(libc::ERANGE)`, to_string, split off \" (os error\") is duplicated three times: once in parse_inputs and twice in parse_offset_operand. parse_offset_operand also reimplements offset parsing (radix/prefix/suffix handling, checked_mul) that closely parallels parse_number_of_bytes in parse_nrofbytes.rs.","fix":"Extract a single helper that produces the ERANGE message string, and consider unifying the offset/byte-count parsing logic.","locations":[{"ref":"src/uu/od/src/parse_inputs.rs:90-96","code":"   90 |                     let err = std::io::Error::from_raw_os_error(libc::ERANGE);\n   91 |                     let msg = err.to_string();\n   92 |                     let expected_msg = msg.split(\" (os error\").next().unwrap_or(&msg).to_string();\n   93 | \n   94 |                     if e == expected_msg {\n   95 |                         return Err(format!(\"{}: {e}\", input_strings[input_strings.len() - 1]));\n   96 |                     }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/od/src/parse_inputs.rs#L90-L96"},{"ref":"src/uu/od/src/parse_inputs.rs:212-229","code":"  212 |             } else {\n  213 |                 let err = std::io::Error::from_raw_os_error(libc::ERANGE);\n  214 |                 let msg = err.to_string();\n  215 |                 // Strip \"(os error N)\" if present to match Perl's $!\n  216 |                 let msg = msg.split(\" (os error\").next().unwrap_or(&msg).to_string();\n  217 |                 Err(msg)\n  218 |             }\n  219 |         }\n  220 |         Err(e) => {\n  221 |             // Distinguish between overflow and parse failure\n  222 |             // from_str_radix returns IntErrorKind::PosOverflow for overflow\n  223 |             use std::nu {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"medium","description":"Both src/bin/coreutils.rs and src/bin/uudoc.rs use `include!(concat!(env!(\"OUT_DIR\"), \"/uutils_map.rs\"))` to textually inline the generated util map, and each re-declares the same `UtilityMap`/`util_map` definitions. The generated file is shared by include rather than via a real module/crate item, so the type and function are duplicated into every binary and cannot be referenced through a normal path. This is a deliberate codegen pattern but couples both binaries tightly to the exact generated symbol names (UtilityMap, util_map, Command, Args), which the build script must keep in lockstep.","fix":"Consider generating the map into a small generated module type-checked once (e.g. via a generated lib module) instead of include!-ing raw source into multiple binaries, to reduce the implicit name coupling.","locations":[{"ref":"src/bin/coreutils.rs:16","code":"   16 | include!(concat!(env!(\"OUT_DIR\"), \"/uutils_map.rs\"));","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/coreutils.rs#L16"},{"ref":"src/bin/uudoc.rs:35","code":"   35 | include!(concat!(env!(\"OUT_DIR\"), \"/uutils_map.rs\"));","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/uudoc.rs#L35"},{"ref":"build.rs:66-111","code":"   66 |     let mut mf = File::create(Path::new(&out_dir).join(\"uutils_map.rs\")).unwrap();\n   67 | \n   68 |     mf.write_all(\n   69 |         \"type UtilityMap<T> = phf::OrderedMap<&'static str, (fn(T) -> i32, fn() -> Command)>;\\n\\\n   70 |          \\n\\\n   71 |          #[allow(clippy::too_many_lines)]\n   72 |          #[allow(clippy::unreadable_literal)]\n   73 |          fn util_map<T: Args>() -> UtilityMap<T> {\\n\"\n   74 |             .as_bytes(),\n   75 |     )\n   76 |     .unwrap();\n   77 | \n   78 |     let mut phf_map = p
