{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"selinux_error_description walks only `error.source()` chains and never includes the\ntop-level error's own message - it starts by immediately calling error.source(), so\nthe description of the passed-in error is dropped and only its causes are recorded.\nFor an error with no source, the returned description is an empty string, producing\nempty SELinux error messages like \"Failed to set context: \".","fix":"Seed the description with `error.to_string()` (trimmed of the os-error suffix)\nbefore iterating sources, or append the final source's message when the chain is empty.","locations":[{"ref":"src/uucore/src/lib/features/selinux.rs:189-202","code":"  189 | pub fn selinux_error_description(mut error: &dyn Error) -> String {\n  190 |     let mut description = String::new();\n  191 |     while let Some(source) = error.source() {\n  192 |         let error_text = source.to_string();\n  193 |         // Check if this is an OS error and trim it\n  194 |         if let Some(idx) = error_text.find(\" (os error \") {\n  195 |             description.push_str(&error_text[..idx]);\n  196 |         } else {\n  197 |             description.push_str(&error_text);\n  198 |         }\n  199 |         error = source;\n  200 |     }\n  201 |     description\n  202 | }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/selinux.rs#L189-L202"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"get_smack_label_for_self / get_smack_label_for_path normalize the label with str::trim(), which strips ASCII/Unicode whitespace but NOT a trailing NUL byte. Kernel SMACK label sources (/proc/self/attr/current and the security.SMACK64 xattr) can include a trailing NUL terminator; from_utf8_lossy keeps it and trim() does not remove it, so the returned label may carry a spurious '\\0' and fail subsequent equality/label comparisons.","fix":"Trim interior/trailing NULs explicitly, e.g. label.trim_matches(|c: char| c.is_whitespace() || c == '\\0'), or split on the first '\\0' before trimming whitespace.","locations":[{"ref":"src/uucore/src/lib/features/smack.rs:61-68","code":"   61 |     let mut label = String::new();\n   62 |     fs::File::open(\"/proc/self/attr/current\")\n   63 |         .map_err(SmackError::LabelRetrievalFailure)?\n   64 |         .read_to_string(&mut label)\n   65 |         .map_err(SmackError::LabelRetrievalFailure)?;\n   66 | \n   67 |     Ok(label.trim().to_string())\n   68 | }","lines":8,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/smack.rs#L61-L68"},{"ref":"src/uucore/src/lib/features/smack.rs:87-88","code":"   87 |     match xattr::get(path, \"security.SMACK64\") {\n   88 |         Ok(Some(value)) => Ok(String::from_utf8_lossy(&value).trim().to_string()),","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/smack.rs#L87-L88"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`read_login_records` strips a leading '?' from `tty` and `seat` (lines 411-416), then later\nre-prefixes the seat with '?' via `format!(\"?{seat}\")` (lines 477, 494). The earlier stripping is therefore\npointless for seats whose systemd value legitimately starts with '?', and for a TTY that starts with '?'\nthe '?' is silently removed and never restored, changing the device name. Given systemd seat/tty values do\nnot normally start with '?', this stripping looks like dead/incorrect normalization that can corrupt unusual\nvalues.","fix":"Remove the unconditional '?' stripping (or document the exact systemd value it is meant to handle); rely on\nthe explicit formatting performed later when records are created.","locations":[{"ref":"src/uucore/src/lib/features/systemd_logind.rs:410-416","code":"  410 |         // Strip any existing prefixes from systemd values (if any)\n  411 |         if tty.starts_with('?') {\n  412 |             tty = tty[1..].to_string();\n  413 |         }\n  414 |         if seat.starts_with('?') {\n  415 |             seat = seat[1..].to_string();\n  416 |         }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/systemd_logind.rs#L410-L416"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"system_time_to_sec encodes pre-epoch times ambiguously: for a time less than one second before UNIX_EPOCH it returns secs == 0 with a positive nsecs magnitude (e.g. -0.5s yields (0, 500000000)), losing the sign. The Float fallback in format_system_time only corrects the sign when secs < 0, so a sub-second negative timestamp prints as a positive value (\"0.500000000\" instead of \"-0.500000000\"). Only reachable via the out-of-jiff-range fallback path, hence low impact, but the (secs, nsecs) contract is broken for the (-1s, 0s) open interval.","fix":"Either return a signed nanosecond component, or document/handle the case where secs == 0 but the time is before the epoch (e.g. by normalizing to secs = -1, nsecs = 1e9 - frac when the original time < UNIX_EPOCH and the fractional part is non-zero).","locations":[{"ref":"src/uucore/src/lib/features/time.rs:29-37","code":"   29 | pub fn system_time_to_sec(time: SystemTime) -> (i64, u32) {\n   30 |     if time > UNIX_EPOCH {\n   31 |         let d = time.duration_since(UNIX_EPOCH).unwrap();\n   32 |         (d.as_secs() as i64, d.subsec_nanos())\n   33 |     } else {\n   34 |         let d = UNIX_EPOCH.duration_since(time).unwrap();\n   35 |         (-(d.as_secs() as i64), d.subsec_nanos())\n   36 |     }\n   37 | }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/time.rs#L29-L37"},{"ref":"src/uucore/src/lib/features/time.rs:77-83","code":"   77 |             FormatSystemTimeFallback::Float => {\n   78 |                 if secs < 0 && nsecs != 0 {\n   79 |                     secs -= 1;\n   80 |                     nsecs = 1_000_000_000 - nsecs;\n   81 |                 }\n   82 |                 out.write_fmt(format_args!(\"{secs}.{nsecs:09}\"))?;\n   83 |             }","lines":7,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/time.rs#L77-L83"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`chars2string!` builds the string with `*i as u8 as char`, mapping each `c_char` byte directly to a\n`char` codepoint (Latin-1 style), not decoding UTF-8. Any utmp field (user, host, tty, id) containing\nmultibyte UTF-8 will be mangled into mojibake instead of the correct characters. GNU `who`/`uptime`\noutput UTF-8 hostnames/usernames verbatim, so this diverges for non-ASCII data.","fix":"Collect the bytes up to the first NUL into a Vec<u8> and decode with `String::from_utf8_lossy` (or\n`OsStr`-based handling) instead of casting each byte to `char`.","locations":[{"ref":"src/uucore/src/lib/features/utmpx.rs:77-85","code":"   77 | // In case the c_char array doesn't end with NULL\n   78 | macro_rules! chars2string {\n   79 |     ($arr:expr) => {\n   80 |         $arr.iter()\n   81 |             .take_while(|i| **i > 0)\n   82 |             .map(|&i| i as u8 as char)\n   83 |             .collect::<String>()\n   84 |     };\n   85 | }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/utmpx.rs#L77-L85"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`canon_host` returns the bare `hostname` (without re-attaching the `:display` suffix) when `getaddrinfo`\nfails (line 316-319), but returns the full original `host` (with suffix) when `getaddrinfo` succeeds yet\nyields no `canonname`. So for an input like \"host:0\", a DNS failure yields \"host\" while a DNS success with\nno canonical name yields \"host:0\". The display-suffix handling is inconsistent across the two non-canonical\npaths.","fix":"Make the fallback paths consistent: either always reattach `:display` or never do, matching GNU `who --lookup`\nbehavior for both the getaddrinfo-error and no-canonname cases.","locations":[{"ref":"src/uucore/src/lib/features/utmpx.rs:291-323","code":"  291 |     /// Canonicalize host name using DNS\n  292 |     pub fn canon_host(&self) -> IOResult<String> {\n  293 |         let host = self.host();\n  294 | \n  295 |         let (hostname, display) = host.split_once(':').unwrap_or((&host, \"\"));\n  296 | \n  297 |         if !hostname.is_empty() {\n  298 |             use dns_lookup::{AddrInfoHints, getaddrinfo};\n  299 | \n  300 |             const AI_CANONNAME: i32 = 0x2;\n  301 |             let hints = AddrInfoHints {\n  302 |                 flags: AI_CANONNAME,\n  303 |                 ..AddrInfoHints::default()\n  304 |             };\n  305 |             if let Ok(sockets) = getaddrinfo(Some(hostname), None, Some(hints)) {\n  306 |                 let sockets = sockets.collect::<IOResult<Vec<_>>>()?;\n  307 |                 for socket in sockets {\n  308 |                     if let Some(ai_canonname) = socket.canonname {\n  309 |                         return Ok(if display.is_empty() {\n  310 |                             ai_canonname\n  311 |                         } else {\n  312 |                             format!(\"{ai_canonname}:{display}\")\n  313 |                         });\n  314 |                     }\n  315 |                 }\n  316 |             } else {\n  317 |                 // GNU coreutils has this behavior\n  318 |                 return Ok(hostname.to_string());\n  319 |             }\n  320 |         }\n  321 | \n  322 |         Ok(host)\n  323 |     }","lines":33,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/utmpx.rs#L291-L323"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the numeric phase of `version_cmp`, after the non-digit prefixes compare Equal, the code\nadvances `b` using `a`'s numeric-start index: `b = &b[a_numerical_start..];` (line 130). This\nrelies on the unstated invariant that equal non-digit prefixes implies\n`a_numerical_start == b_numerical_start`. The invariant holds today (equal prefixes have equal\nlength), but `b_numerical_start` is computed and then never used, which is a code smell and a\ntrap: any future change to `version_non_digit_cmp` that allows differing-length \"equal\"\nprefixes would silently mis-slice `b` (potential wrong ordering or out-of-bounds panic).","fix":"Use `b = &b[b_numerical_start..];` so each slice is advanced by its own computed index, or add\na `debug_assert_eq!(a_numerical_start, b_numerical_start)` to document and enforce the\ninvariant.","locations":[{"ref":"src/uucore/src/lib/features/version_cmp.rs:117-129","code":"  117 |         let a_numerical_start = a.iter().position(u8::is_ascii_digit).unwrap_or(a.len());\n  118 |         let b_numerical_start = b.iter().position(u8::is_ascii_digit).unwrap_or(b.len());\n  119 | \n  120 |         let a_str = &a[..a_numerical_start];\n  121 |         let b_str = &b[..b_numerical_start];\n  122 | \n  123 |         match version_non_digit_cmp(a_str, b_str) {\n  124 |             Ordering::Equal => {}\n  125 |             ord => return ord,\n  126 |         }\n  127 | \n  128 |         a = &a[a_numerical_start..];\n  129 |         b = &b[a_numerical_start..];","lines":13,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/version_cmp.rs#L117-L129"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`handle_missing_required` and `print_clap_tips` localize clap output by string-matching the\n*English* rendered text: it checks `first_line.starts_with(\"error: the following required\narguments were not provided:\")`, breaks on lines starting with `\"Usage:\"` / `\"For more\ninformation\"`, and matches `\"For more information, try '--help'.\"` verbatim. Because\n`configure_localized_command` and the templates localize clap's own strings, and clap's color\nmode wraps text in ANSI escapes, these literal English prefixes can fail to match (e.g. when\ncolors are enabled the line may begin with an escape sequence, not `error:`), causing the\nlocalized formatting to silently fall through to raw clap output.","fix":"Drive these branches off clap's structured error context (ContextKind) and ErrorKind rather\nthan parsing rendered English strings; if string inspection is unavoidable, strip ANSI escapes\nfirst and avoid hard-coding English sentence prefixes.","locations":[{"ref":"src/uucore/src/lib/mods/clap_localization.rs:250-293","code":"  250 |     fn handle_missing_required(&self, err: &Error, exit_code: i32) -> i32 {\n  251 |         let rendered_str = err.render().to_string();\n  252 |         let lines: Vec<&str> = rendered_str.lines().collect();\n  253 | \n  254 |         match lines.first() {\n  255 |             Some(first_line)\n  256 |                 if first_line\n  257 |                     .starts_with(\"error: the following required arguments were not provided:\") =>\n  258 |             {\n  259 |                 let error_word = translate!(\"common-error\");\n  260 |                 let _ = writeln!(\n  261 |                     stderr(),\n  262 |                     \"{}\",\n  263 |                     translate!(\n  264 |                         \"clap-error-missing-required-arguments\",\n  265 |                         \"error_word\" => self.color_mgr.colorize(&error_word, Color::Red)\n  266 |                     )\n  267 |                 );\n  268 | \n  269 |                 // Print the missing arguments\n  270 |                 for line in lines.iter().skip(1) {\n  271 |                     if line.starts_with(\"  \") {\n  272 |                         let _ = writeln!(stderr(), \"{line}\");\n  273 |                     } else if line.starts_with(\"Usage:\") || line.starts_with(\"For more information\")\n  274 |                     {\n  275 |                         break;\n  276 |                     }\n  277 |                 }\n  278 |                 let _ = writeln!(stderr());\n  279 | \n  280 |                 // Print usage\n  281 |                 lines\n  282 |                     .iter()\n  283 |                     .skip_while(|line| !line.starts_with(\"Usage:\"))\n  284 |                     .for_each(|line| {\n  285 |                         if line.starts_with(\"For more information, try '--help'.\") {\n  286 |                             let _ = writeln!(stderr(), \"{}\", translate!(\"common-help-suggestion\"));\n  287 |                         } else {\n  288 |                             let _ = writeln!(stderr(), \"{line}\");\n  289 |                         }\n  290 |                     });\n  291 |             }\n  292 |             _ => eprint!(\"{}\", err.render()),\n  293 |         }","lines":44,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/mods/clap_localization.rs#L250-L293"},{"ref":"src/uucore/src/lib/mods/clap_localization.rs:333-352","code":"  333 |     fn print_clap_tips(&self, err: &Error) {\n  334 |         let rendered_str = err.render().to_string();\n  335 |         for line in rendered_str.lines() {\n  336 |             let trimmed = line.trim_start();\n  337 |             if trimmed.starts_with(\"tip:\") && !line.contains(\"similar argument\") {\n  338 |                 let tip_word = translate!(\"common-tip\");\n  339 |                 if let Some(colon_pos) = trimmed.find(':') {\n  340 |                     let after_colon = &trimmed[colon_pos..];\n  341 |                     let _ = writeln!(\n  342 |                         stderr(),\n  343 |                         \"  {}{after_colon}\",\n  344 |                         self.color_mgr.colorize(&tip_word, Color::Green)\n  345 |                     );\n  346 |                 } else {\n  347 |                     let _ = writeln!(stderr(), \"{line}\");\n  348 |                 }\n  349 |                 let _ = writeln!(stderr());\n  350 |             }\n  351 |         }\n  352 |     }","lines":20,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/mods/clap_localization.rs#L333-L352"}]},
{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`create_english_bundle_from_embedded` decides whether to also load checksum_common strings\nwith `util_name.ends_with(\"sum\")`, whereas the filesystem path `create_bundle` uses an\nexplicit allow-list of the eight checksum utilities. The `ends_with(\"sum\")` heuristic will\nalso match unrelated future utilities whose names end in \"sum\" (and conceptually any util the\nuser names so), loading checksum strings into their bundle. The two code paths therefore use\ninconsistent logic for the same decision.","fix":"Share one predicate (e.g. a single `is_checksum_util(util_name)` helper using the explicit\nallow-list) between the embedded and filesystem bundle builders.","locations":[{"ref":"src/uucore/src/lib/mods/locale.rs:261-274","code":"  261 |     if [\n  262 |         \"cksum\",\n  263 |         \"b2sum\",\n  264 |         \"md5sum\",\n  265 |         \"sha1sum\",\n  266 |         \"sha224sum\",\n  267 |         \"sha256sum\",\n  268 |         \"sha384sum\",\n  269 |         \"sha512sum\",\n  270 |     ]\n  271 |     .contains(&util_name)\n  272 |     {\n  273 |         try_add_resource_from(get_locales_dir(\"checksum_common\").ok());\n  274 |     }","lines":14,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/mods/locale.rs#L261-L274"},{"ref":"src/uucore/src/lib/mods/locale.rs:390-395","code":"  390 |     if util_name.ends_with(\"sum\")\n  391 |         && let Some(uucore_content) = get_embedded_locale(\"checksum_common/en-US.ftl\")\n  392 |     {\n  393 |         let uucore_resource = parse_fluent_resource(uucore_content, &CHECKSUM_FLUENT)?;\n  394 |         bundle.add_resource_overriding(uucore_resource);\n  395 |     }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/mods/locale.rs#L390-L395"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"is_broken_pipe only inspects panic payloads that downcast to String, but std panics from broken-pipe I/O errors (e.g. unwrap() on an io::Result, or the default panic message produced by libstd flushing stdout) often carry a &'static str payload rather than a String. A &str payload (downcast_ref::<&str>()) is never checked, so some genuine BrokenPipe panics are not silenced by mute_sigpipe_panic, causing a spurious panic backtrace and a non-zero exit instead of clean termination. The doc example `seq inf | head -n 1` relies on this working.","fix":"Also attempt to downcast the payload to &'static str (and check that string), e.g. match both String and &str payloads: `if let Some(s) = info.payload().downcast_ref::<String>() { ... } else if let Some(s) = info.payload().downcast_ref::<&str>() { ... }` and apply the same contains() checks.","locations":[{"ref":"src/uucore/src/lib/mods/panic.rs:19-23","code":"   19 | fn is_broken_pipe(info: &PanicHookInfo) -> bool {\n   20 |     info.payload()\n   21 |         .downcast_ref::<String>()\n   22 |         .is_some_and(|res| res.contains(\"BrokenPipe\") || res.contains(\"Broken pipe\"))\n   23 | }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/mods/panic.rs#L19-L23"}]},
{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"In chroot `parse_group_list`, the heuristic for an invalid numeric group name (`trimmed_name.starts_with(char::is_numeric) && trimmed_name.ends_with(|c| !c.is_numeric())`) flags only names that start numeric and end non-numeric (e.g. \"0trail\"), but accepts mixed names like \"0tr8\" (ends in a digit) or \"1a2\" as valid group names, which GNU would treat as invalid. The code itself notes \"TODO Figure out a better condition here.\"","fix":"Use a stricter rule: if the name starts with a digit it must be fully numeric to be treated as a GID; otherwise report InvalidGroup. Aligns with GNU's name-then-numeric resolution.","locations":[{"ref":"src/uu/chroot/src/chroot.rs:109-116","code":"  109 |                 // TODO Figure out a better condition here.\n  110 |                 if trimmed_name.starts_with(char::is_numeric)\n  111 |                     && trimmed_name.ends_with(|c: char| !c.is_numeric())\n  112 |                 {\n  113 |                     // --groups=\"0trail\"\n  114 |                     // chroot: invalid group '0trail'\n  115 |                     show!(ChrootError::InvalidGroup(name.to_string()));\n  116 |                     err = true;","lines":8,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/chroot/src/chroot.rs#L109-L116"}]},
{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"In cut_fields_explicit_out_delim, inside the inner `for _ in 0..=high-low` loop the assignment `fields_pos = high + 1;` is executed on every iteration (line 163) rather than once after the range is fully consumed. It is harmless because the loop count is fixed and the value is identical each time, but it is redundant work and slightly obscures the field-tracking invariant.","fix":"Move `fields_pos = high + 1;` out of the inner loop to after it, for clarity.","locations":[{"ref":"src/uu/cut/src/cut.rs:516-532","code":"  516 |         for _ in 0..=high - low {\n  517 |             // skip printing delimiter if this is the first matching field for this line\n  518 |             if print_delim {\n  519 |                 out.write_all(out_delim)?;\n  520 |             } else {\n  521 |                 print_delim = true;\n  522 |             }\n  523 | \n  524 |             if let Some((first, last)) = delim_search.next() {\n  525 |                 // print the current field up to the next field delim\n  526 |                 let segment = &line[low_idx..first];\n  527 | \n  528 |                 out.write_all(segment)?;\n  529 | \n  530 |                 low_idx = last;\n  531 |                 fields_pos = high + 1;\n  532 |             } else {","lines":17,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cut/src/cut.rs#L516-L532"}]},
{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"expr substr evaluation computes `length.checked_sub(1)` purely as a guard to reject length == 0 (returning the empty string), then discards the result and passes the original `length` to `locale_aware_substr`. This works but is non-obvious: the `Some(_)` binding is a length>=1 test in disguise. A future edit could mistakenly use the subtracted value.","fix":"Replace the `checked_sub(1)` guard with an explicit `pos >= 1 && length >= 1` check (using `pos - 1` for the 0-based start) to make the intent clear.","locations":[{"ref":"src/uu/expr/src/syntax_tree.rs:734-750","code":"  734 |                     let pos = pos?\n  735 |                         .eval_as_bigint()\n  736 |                         .ok()\n  737 |                         .and_then(|n| n.to_usize())\n  738 |                         .unwrap_or(0);\n  739 |                     let length = length?\n  740 |                         .eval_as_bigint()\n  741 |                         .ok()\n  742 |                         .and_then(|n| n.to_usize())\n  743 |                         .unwrap_or(0);\n  744 | \n  745 |                     if let (Some(pos), Some(_)) = (pos.checked_sub(1), length.checked_sub(1)) {\n  746 |                         let result = locale_aware_substr(string, pos, length);\n  747 |                         result_stack.insert(node.id, Ok(result.into()));\n  748 |                     } else {\n  749 |                         result_stack.insert(node.id, Ok(String::new().into()));\n  750 |                     }","lines":17,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/expr/src/syntax_tree.rs#L734-L750"}]},
{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"In logname, `get_userlogin` uses libc::getlogin() and converts via `String::from_utf8_lossy`, which replaces invalid bytes with U+FFFD. A login name with non-UTF-8 bytes would be printed lossily rather than verbatim, unlike most other utils here that use println_verbatim/OsString to preserve raw bytes. Minor, since login names are essentially always ASCII.","fix":"Preserve raw bytes by emitting the CStr bytes verbatim instead of lossy UTF-8 conversion, for consistency.","locations":[{"ref":"src/uu/logname/src/logname.rs:14-21","code":"   14 | fn get_userlogin() -> Option<String> {\n   15 |     let login_ptr = unsafe { libc::getlogin() };\n   16 |     if login_ptr.is_null() {\n   17 |         None\n   18 |     } else {\n   19 |         Some(String::from_utf8_lossy(unsafe { CStr::from_ptr(login_ptr) }.to_bytes()).to_string())\n   20 |     }\n   21 | }","lines":8,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/logname/src/logname.rs#L14-L21"}]},
{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"parse_special_value lowercases the whole input with input.to_ascii_lowercase() and matches the\nprefix against the lowercase table, but then slices the ORIGINAL input with `&input[str.len()..]`\nto parse the suffix multiplier. This is correct only because the matched prefixes are pure ASCII\n(same byte length lowercase/uppercase); it is a latent coupling that would break if a non-ASCII\nor case-changing-length token were ever added to MATCH_TABLE. Worth a guard/comment.","fix":"Slice the lowercased copy (input_lc) for the remainder, or add an assertion/comment that table\nentries must be ASCII so prefix byte-lengths match between cases.","locations":[{"ref":"src/uucore/src/lib/features/parser/num_parser.rs:353-369","code":"  353 |     let input_lc = input.to_ascii_lowercase();\n  354 | \n  355 |     for (str, ebd) in MATCH_TABLE {\n  356 |         if input_lc.starts_with(str) {\n  357 |             let mut special = ebd.clone();\n  358 |             if negative {\n  359 |                 special = -special;\n  360 |             }\n  361 | \n  362 |             // \"infs\" is a valid duration, so parse suffix multiplier in the original input string, but ignore the multiplier.\n  363 |             let (_, rest) = parse_suffix_multiplier(&input[str.len()..], allowed_suffixes);\n  364 | \n  365 |             return if rest.is_empty() {\n  366 |                 Ok(special)\n  367 |             } else {\n  368 |                 Err(ExtendedParserError::PartialMatch(special, rest.to_string()))\n  369 |             };","lines":17,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/parser/num_parser.rs#L353-L369"}]},
{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"Teletype::try_from(PathBuf) decides between ttyS and tty using `path.contains(\"ttyS\")` / `path.contains(\"tty\")` over the WHOLE path string, but the numeric suffix is extracted from only the LAST path component via the `f` closure. For pathological paths where the discriminating substring appears in a non-final component (e.g. \"/dev/ttyS0/tty1\"), the branch chosen by `contains` and the component parsed by `f` can disagree, yielding Err for an otherwise-parseable last component. Not a real-world device path, hence negligible.","fix":"Base both the discrimination and extraction on the final path component (value.iter().next_back()) so the substring check and prefix-strip operate on the same string.","locations":[{"ref":"src/uucore/src/lib/features/tty.rs:71-92","code":"   71 |         let path = value.to_str().ok_or(())?;\n   72 | \n   73 |         let f = |prefix: &str| {\n   74 |             value\n   75 |                 .iter()\n   76 |                 .next_back()?\n   77 |                 .to_str()?\n   78 |                 .strip_prefix(prefix)?\n   79 |                 .parse::<u64>()\n   80 |                 .ok()\n   81 |         };\n   82 | \n   83 |         if path.contains(\"ttyS\") {\n   84 |             // Case 2\n   85 |             f(\"ttyS\").ok_or(()).map(Teletype::TtyS)\n   86 |         } else if path.contains(\"tty\") {\n   87 |             // Case 3\n   88 |             f(\"tty\").ok_or(()).map(Teletype::Tty)\n   89 |         } else {\n   90 |             Err(())\n   91 |         }\n   92 |     }","lines":22,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/tty.rs#L71-L92"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"On Cygwin, `__stdbuf_get_stderr()` returns the `_stderr` field of the reentrant struct, but the code returns `(*__getreent())._stdin` instead. This is a copy-paste error: stderr buffering requests (`_STDBUF_E`) would be applied to the stdin stream rather than stderr, silently breaking `stdbuf -e ... cmd` on Cygwin and potentially mis-buffering stdin.","fix":"Return `(*__getreent())._stderr` in `__stdbuf_get_stderr()` for the cygwin branch.","locations":[{"ref":"src/uu/stdbuf/src/libstdbuf/src/libstdbuf.rs:190","code":"  190 |         unsafe { (*__getreent())._stdin }","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/stdbuf/src/libstdbuf/src/libstdbuf.rs#L190"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"In the macOS copy_on_write path, after calling clonefile via the dynamically resolved function pointer (error = pfn(...)), the code unconditionally inspects std::io::Error::last_os_error().kind() == AlreadyExists. last_os_error() reads the thread-global errno, which is only meaningful when pfn actually failed (returned -1). When pfn succeeds (error == 0) errno may hold a stale AlreadyExists value from an unrelated earlier syscall, causing the code to spuriously remove the destination file and re-clone, or to mis-handle the result. The errno check should be guarded by error != 0.","fix":"Only consult last_os_error() when the clonefile call failed, e.g. `if error != 0 && std::io::Error::last_os_error().kind() == AlreadyExists && source != dest { ... }`.","locations":[{"ref":"src/uu/cp/src/platform/macos.rs:69-96","code":"   69 |             error = pfn(src.as_ptr(), dst.as_ptr(), 0);\n   70 |             if std::io::Error::last_os_error().kind() == std::io::ErrorKind::AlreadyExists\n   71 |                 // Only remove the `dest` if the `source` and `dest` are not the same\n   72 |                 && source != dest\n   73 |             {\n   74 |                 // clonefile(2) fails if the destination exists.  Remove it and try again.  Do not\n   75 |                 // bother to check if removal worked because we're going to try to clone again.\n   76 |                 // first lets make sure the dest file is not read only.\n   77 |                 //\n   78 |                 // If dest is a symlink, GNU cp follows it and writes through to\n   79 |                 // the target rather than replacing the link itself. Removing\n   80 |                 // dest here would unlink the symlink and the retry would\n   81 |                 // clonefile a regular file in its place. Skip the retry — the\n   82 |                 // AlreadyExists error stays in `error` and we fall through to\n   83 |                 // fs::copy below, which follows the symlink via O_TRUNC.\n   84 |                 let dest_is_symlink =\n   85 |                     fs::symlink_metadata(dest).is_ok_and(|md| md.file_type().is_symlink());\n   86 |                 if !dest_is_symlink\n   87 |                     && fs::metadata(dest).is_ok_and(|md| !md.permissions().readonly())\n   88 |                 {\n   89 |                     // remove and copy again\n   90 |                     // TODO: rewrite this to better match linux behavior\n   91 |                     // linux first opens the source file and destination file then uses the file\n   92 |                     // descriptors to do the clone.\n   93 |                     let _ = fs::remove_file(dest);\n   94 |                     error = pfn(src.as_ptr(), dst.as_ptr(), 0);\n   95 |                 }\n   96 |             }","lines":28,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cp/src/platform/macos.rs#L69-L96"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"The numfmt output writers call `writer.write_all(...).unwrap()` in many places even\nthough both functions return `Result<()>` precisely so I/O errors can be propagated.\nAny write failure (most commonly a broken pipe, e.g. `numfmt ... | head`) will panic\nthe process instead of producing a clean error/exit. GNU numfmt exits gracefully on a\nbroken pipe. Affected calls write the delimiter, formatted fields, unselected fields,\nthe inter-field space, and the EOL byte.","fix":"Replace each `write_all(...).unwrap()` with `write_all(...).map_err(|e| e.to_string())?`\n(or convert the functions to return `std::io::Result` and `?` the errors), so the error\nflows back up through `format_and_write`/`uumain` and is reported instead of panicking.","locations":[{"ref":"src/uu/numfmt/src/format.rs:923","code":"  923 |             writer.write_all(delimiter).unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L923"},{"ref":"src/uu/numfmt/src/format.rs:932","code":"  932 |             writer.write_all(formatted.as_bytes()).unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L932"},{"ref":"src/uu/numfmt/src/format.rs:935","code":"  935 |             writer.write_all(field).unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L935"},{"ref":"src/uu/numfmt/src/format.rs:940","code":"  940 |         writer.write_all(&[eol]).unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L940"},{"ref":"src/uu/numfmt/src/format.rs:963","code":"  963 |                 writer.write_all(b\" \").unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L963"},{"ref":"src/uu/numfmt/src/format.rs:932","code":"  932 |             writer.write_all(formatted.as_bytes()).unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L932"},{"ref":"src/uu/numfmt/src/format.rs:963","code":"  963 |                 writer.write_all(b\" \").unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L963"},{"ref":"src/uu/numfmt/src/format.rs:986-987","code":"  986 |             writer.write_all(prefix.as_bytes()).unwrap();\n  987 |             writer.write_all(field.as_bytes()).unwrap();","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L986-L987"},{"ref":"src/uu/numfmt/src/format.rs:940","code":"  940 |         writer.write_all(&[eol]).unwrap();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/numfmt/src/format.rs#L940"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"paste opens all input files eagerly before producing any output: the loop in `paste()` calls `File::open(path)?` for every filename up front. A failure to open the Nth file aborts with `?` before any of the already-openable inputs are processed, and the error is the raw `std::io::Error` rather than a context-quoted message like the other utilities produce. GNU paste reports the per-file error (with the filename) and continues/handles streaming. Opening everything up front also defeats streaming for the multi-file case.","fix":"Open each file lazily as it is consumed, and wrap open errors with `.map_err_context(|| filename.maybe_quote().to_string())` so the offending filename is reported.","locations":[{"ref":"src/uu/paste/src/paste.rs:110","code":"  110 |             let file = File::open(path)?;","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/paste/src/paste.rs#L110"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`check_child_success` treats both `Err(_)` from `child.wait()` and a `None`\nexit code (terminated by signal) as success via the\n`Ok(Some(0) | None) | Err(_)` match. A compression program that fails to be\nwaited on, or that is killed by a signal (e.g. SIGSEGV), is therefore reported\nas having succeeded, so corrupted/incomplete temp data can be silently used as\nif it were valid sorted output.","fix":"Only treat `Ok(Some(0))` as success. Map signal terminations (`Ok(None)`) and\nwait errors (`Err(_)`) to `CompressProgTerminatedAbnormally` (or a dedicated\nerror) so abnormal compressor exits abort the sort instead of being ignored.","locations":[{"ref":"src/uu/sort/src/merge.rs:447-456","code":"  447 | fn check_child_success(mut child: Child, program: &str) -> UResult<()> {\n  448 |     if matches!(child.wait().map(|e| e.code()), Ok(Some(0) | None) | Err(_)) {\n  449 |         Ok(())\n  450 |     } else {\n  451 |         Err(SortError::CompressProgTerminatedAbnormally {\n  452 |             prog: program.to_owned(),\n  453 |         }\n  454 |         .into())\n  455 |     }\n  456 | }","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/sort/src/merge.rs#L447-L456"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"get_input_size treats a finite input whose size is exactly equal to read_limit as \"could not determine size\". When `num_bytes == read_limit` for stdin (\"-\"), the function returns the \"cannot determine input size\" error even though the stream actually EOFed at exactly read_limit bytes (read_to_end returns once EOF is hit, and take() merely caps the maximum). A piped input whose total length happens to equal the block size limit is wrongly rejected.","fix":"Distinguish \"hit the limit but more data may remain\" from \"reached EOF exactly at the limit\". For example read up to read_limit+1, or after filling to read_limit attempt one more `read` and only error if it returns >0 bytes.","locations":[{"ref":"src/uu/split/src/split.rs:452-471","code":"  452 |     let num_bytes = reader\n  453 |         .by_ref()\n  454 |         .take(read_limit)\n  455 |         .read_to_end(buf)\n  456 |         .map(|n| n as u64)?;\n  457 | \n  458 |     if num_bytes < read_limit {\n  459 |         // Finite file or STDIN stream that fits entirely\n  460 |         // into a buffer within the limit\n  461 |         // Note: files like /dev/null or similar,\n  462 |         // empty STDIN stream,\n  463 |         // and files with true file size 0\n  464 |         // will also fit here\n  465 |         Ok(num_bytes)\n  466 |     } else if input == \"-\" {\n  467 |         // STDIN stream that did not fit all content into a buffer\n  468 |         // Most likely continuous/infinite input stream\n  469 |         Err(io::Error::other(\n  470 |             translate!(\"split-error-cannot-determine-input-size\", \"input\" => input.maybe_quote()),\n  471 |         ))","lines":20,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/split/src/split.rs#L452-L471"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In touch::parse_date the ISO_8601 branch and the POSIX/other-format branches use TimeZone::UTC for the first set of formats but TimeZone::system() for the ISO 8601 (%Y-%m-%d) branch. This means a bare \"2023-05-10\" is interpreted in the local zone while \"2023-05-10 12:00:00\" is interpreted as UTC. The same logical date string yields timestamps that differ by the local UTC offset depending only on whether a time component is present, which is an inconsistent and surprising timezone semantics for -d.","fix":"Use a single consistent timezone interpretation (GNU touch -d uses local time) for all of these strtime fallback formats, or document and justify why the date-only form differs.","locations":[{"ref":"src/uu/touch/src/touch.rs:794-803","code":"  794 |     if let Ok(filetime) = strtime::parse(format::ISO_8601, s)\n  795 |         .and_then(|tm| tm.to_date())\n  796 |         .and_then(|date| {\n  797 |             TimeZone::system()\n  798 |                 .to_ambiguous_zoned(date.to_datetime(Time::midnight()))\n  799 |                 .unambiguous()\n  800 |         })\n  801 |         .map(|zdt| timestamp_to_filetime(zdt.timestamp()))\n  802 |     {\n  803 |         return Ok(filetime);","lines":10,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/touch/src/touch.rs#L794-L803"},{"ref":"src/uu/touch/src/touch.rs:769-773","code":"  769 |     if let Ok(parsed) = strtime::parse(format::POSIX_LOCALE, s)\n  770 |         .and_then(|tm| tm.to_datetime())\n  771 |         .and_then(|dt| TimeZone::UTC.to_zoned(dt))\n  772 |     {\n  773 |         return Ok(timestamp_to_filetime(parsed.timestamp()));","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/touch/src/touch.rs#L769-L773"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `process_checksum_file`, the per-line `FileNotFound` outcome is only counted as a failed open when\n`!opts.ignore_missing` (line 938). But the `total` counter is incremented for `FileNotFound` lines because\nthe first match arm (line 908-912) increments `total` for everything that is not `UError`/`Skipped`. With\n`--ignore-missing`, a checksum file consisting solely of lines whose files are missing yields\n`total_properly_formatted() > 0` and `correct == 0`, which then takes the `ignore_missing && correct == 0`\nbranch (line 965) and reports \"no file was verified\" + failure. That matches GNU, but a missing file under\n`--ignore-missing` still inflates `total`, so a file mixing one good line and many ignored-missing lines is\nfine, yet the bookkeeping (missing counted toward `total` but never toward `failed_open_file`) is fragile and\neasy to break. Worth a hard look / explicit test because the dual-match structure hides the coupling.","fix":"Handle the `FileNotFound` + `ignore_missing` case explicitly (e.g. treat it like `Skipped` so it does not\ncontribute to `total`), or add a comment/test pinning the intended counting semantics.","locations":[{"ref":"src/uucore/src/lib/features/checksum/validate.rs:904-939","code":"  904 |         // Match a first time to elude critical UErrors, and increment the total\n  905 |         // in all cases except on skipped.\n  906 |         match line_result {\n  907 |             Err(UError(e)) => return Err(e.into()),\n  908 |             Err(Skipped) => (),\n  909 |             _ => res.total += 1,\n  910 |         }\n  911 | \n  912 |         // Match a second time to update the right field of `res`.\n  913 |         match line_result {\n  914 |             Ok(()) => res.correct += 1,\n  915 |             Err(DigestMismatch) => res.failed_cksum += 1,\n  916 |             Err(ImproperlyFormatted) => {\n  917 |                 res.bad_format += 1;\n  918 | \n  919 |                 if opts.verbose.at_least_warning() {\n  920 |                     let algo = if let Some(algo_name_input) = cli_algo_kind {\n  921 |                         algo_name_input.to_uppercase()\n  922 |                     } else if let Some(algo) = &last_algo {\n  923 |                         algo.as_str()\n  924 |                     } else {\n  925 |                         \"Unknown algorithm\"\n  926 |                     };\n  927 |                     let _ = writeln!(\n  928 |                         stderr(),\n  929 |                         \"{}: {}\",\n  930 |                         util_name(),\n  931 |                         translate!(\"checksum-error-algo-bad-format\", \"file\" => filename_input.maybe_quote(), \"line\" => i + 1, \"algo\" => algo)\n  932 |                     );\n  933 |                 }\n  934 |             }\n  935 |             Err(CantOpenFile | FileIsDirectory) => res.failed_open_file += 1,\n  936 |             Err(FileNotFound) if !opts.ignore_missing => res.failed_open_file += 1,\n  937 |             _ => (),\n  938 |         }\n  939 |     }","lines":36,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/checksum/validate.rs#L904-L939"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"try_init_collator and init_collator call CollatorBorrowed::try_new(...).unwrap()/.expect on the ICU result. If ICU cannot construct a collator for the resolved locale (e.g. missing/unsupported collation data), the process panics. init_locale_collation feeds these with a locale derived from arbitrary user-controlled env vars (any UTF-8 locale), so a hostile or unusual LC_COLLATE could turn a graceful sort into a panic. This also contradicts the documented contract of locale_cmp ('Fall back to byte comparison if collator is not available'), which implies graceful degradation rather than an init-time panic.","fix":"Handle the try_new error instead of unwrapping: return false (no collator initialized) on Err so callers fall back to byte comparison, e.g. `match CollatorBorrowed::try_new(...) { Ok(c) => COLLATOR.set(c).is_ok(), Err(_) => false }`.","locations":[{"ref":"src/uucore/src/lib/features/i18n/collator.rs:20-31","code":"   20 | pub fn try_init_collator(opts: CollatorOptions) -> bool {\n   21 |     COLLATOR\n   22 |         .set(CollatorBorrowed::try_new(get_collating_locale().0.clone().into(), opts).unwrap())\n   23 |         .is_ok()\n   24 | }\n   25 | \n   26 | /// Will initialize the collator and panic if already initialized.\n   27 | pub fn init_collator(opts: CollatorOptions) {\n   28 |     COLLATOR\n   29 |         .set(CollatorBorrowed::try_new(get_collating_locale().0.clone().into(), opts).unwrap())\n   30 |         .expect(\"Collator already initialized\");\n   31 | }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/i18n/collator.rs#L20-L31"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In ChownExecutor::traverse, when the path is a directory on Linux and DirFd::open\nfails (e.g. permission denied opening the directory itself), the error arm returns\n`Ok(String::new())` and the directory chown is silently treated as success, with a\ncomment claiming safe_dive_into will report the error. But safe_dive_into calls\ntry_open_dir which opens with SymlinkBehavior::Follow and only reports if it also\nfails; if the directory is openable for reading but the *root* chown via fchown\nwould have failed, that root failure is masked. The net effect is the top-level\ndirectory's own ownership-change failure is never reported when DirFd::open errors\nyet later succeeds, diverging from the non-Linux path which reports via wrap_chown.","fix":"Distinguish \"cannot open dir\" (report and set ret=1) from \"dir opened, chown the\nfd\". Do not swallow DirFd::open errors as Ok; surface them like wrap_chown does.","locations":[{"ref":"src/uucore/src/lib/features/perms.rs:312-323","code":"  312 |             let chown_result = if meta.is_dir() {\n  313 |                 // For directories on Linux, use safe traversal from the start\n  314 |                 match DirFd::open(path, SymlinkBehavior::Follow) {\n  315 |                     Ok(dir_fd) => self\n  316 |                         .safe_chown_dir(&dir_fd, path, &meta)\n  317 |                         .map(|_| String::new()),\n  318 |                     Err(_e) => {\n  319 |                         // Don't show error here - let safe_dive_into handle directory traversal errors\n  320 |                         // This prevents duplicate error messages\n  321 |                         Ok(String::new())\n  322 |                     }\n  323 |                 }","lines":12,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/perms.rs#L312-L323"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`detect_system_locale` only consults the `LANG` environment variable. POSIX locale resolution\ngives precedence to `LC_ALL`, then the specific category (here `LC_MESSAGES` for translated\nprogram messages), and only then `LANG`. As a result, a user who sets `LC_ALL=fr_FR.UTF-8`\n(or `LC_MESSAGES`) but leaves `LANG` unset/`C` will get untranslated output, contrary to\nstandard locale behavior and to what GNU coreutils does. Note this is inconsistent with\n`get_time_locale`/`get_locale_from_env` elsewhere in the crate which read specific LC_*\nvariables.","fix":"Resolve the locale following POSIX precedence: check `LC_ALL`, then `LC_MESSAGES`, then `LANG`,\nfalling back to `DEFAULT_LOCALE`, before splitting off the `.<codeset>` suffix.","locations":[{"ref":"src/uucore/src/lib/mods/locale.rs:544-554","code":"  544 | fn detect_system_locale() -> Result<LanguageIdentifier, LocalizationError> {\n  545 |     let locale_str = std::env::var(\"LANG\")\n  546 |         .unwrap_or_else(|_| DEFAULT_LOCALE.to_string())\n  547 |         .split('.')\n  548 |         .next()\n  549 |         .unwrap_or(DEFAULT_LOCALE)\n  550 |         .to_string();\n  551 |     LanguageIdentifier::from_str(&locale_str).map_err(|_| {\n  552 |         LocalizationError::ParseLocale(format!(\"Failed to parse locale: {locale_str}\"))\n  553 |     })\n  554 | }","lines":11,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/mods/locale.rs#L544-L554"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"uudoc's main() collects args via `uucore::args_os_filtered()`, which silently drops empty arguments. The dispatch then keys off `args.get(1)` as the subcommand. An invocation like `uudoc \"\" manpage cat` (empty first real arg) has its empty arg filtered out, shifting `manpage` into the argv[1] slot and changing which mode runs. For a documentation generator this is benign, but the filtering is an unexpected, undocumented argument-shifting behavior at the dispatch layer.","fix":"Use unfiltered `uucore::args_os()` for command dispatch in uudoc, or document that empty arguments are intentionally ignored.","locations":[{"ref":"src/bin/uudoc.rs:220","code":"  220 |     let args: Vec<OsString> = uucore::args_os_filtered().collect();","lines":1,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/uudoc.rs#L220"},{"ref":"src/bin/uudoc.rs:227-228","code":"  227 |     if args.len() > 1 {\n  228 |         let command = args.get(1).and_then(|s| s.to_str()).unwrap_or_default();","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/bin/uudoc.rs#L227-L228"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"copy_socket binds a UnixListener at dest to \"copy\" a socket, but the listener is dropped immediately at end of function. Depending on platform, dropping the listener may not unlink the socket file (Rust does not unlink AF_UNIX paths on drop), but the resulting dest is a fresh listening socket inode rather than a faithful copy; more importantly any bind error is wrapped only as a bare io error without the source/dest context other copy paths provide.","fix":"Wrap the bind error with context (cp-error-cannot-create...) consistent with copy_fifo/copy_node; confirm the intended semantics of recreating a socket file.","locations":[{"ref":"src/uu/cp/src/cp.rs:3016-3024","code":" 3016 | fn copy_socket(dest: &Path, overwrite: OverwriteMode, debug: bool) -> CopyResult<()> {\n 3017 |     if dest.exists() {\n 3018 |         overwrite.verify(dest, debug)?;\n 3019 |         fs::remove_file(dest)?;\n 3020 |     }\n 3021 | \n 3022 |     UnixListener::bind(dest)?;\n 3023 |     Ok(())\n 3024 | }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/cp/src/cp.rs#L3016-L3024"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In the `count=0` early-exit path, `dd_copy` calls `flush_caches_full_length` but never installs the SIGUSR1 handler nor spawns the alarm, which is fine; however it returns via `finalize` which sends a Final ProgUpdate and joins the output thread. The progress thread for non-progress status levels is correct, but note the SIGUSR1 handler is only installed AFTER the count=0 check, so a `count=0` invocation cannot report status on SIGUSR1. This is a minor behavioral divergence rather than a crash.","fix":"If matching GNU behavior for SIGUSR1 on count=0 matters, install the handler before the early return; otherwise document the intentional difference.","locations":[{"ref":"src/uu/dd/src/dd.rs:1166-1199","code":" 1166 |     if let Some(Num::Blocks(0) | Num::Bytes(0)) = i.settings.count {\n 1167 |         // Even though we are not reading anything from the input\n 1168 |         // file, we still need to honor the `nocache` flag, which\n 1169 |         // requests that we inform the system that we no longer\n 1170 |         // need the contents of the input file in a system cache.\n 1171 |         //\n 1172 |         flush_caches_full_length(&i, &o);\n 1173 |         return finalize(\n 1174 |             BlockWriter::Unbuffered(o),\n 1175 |             rstat,\n 1176 |             wstat,\n 1177 |             start,\n 1178 |             &prog_tx,\n 1179 |             output_thread,\n 1180 |             truncate,\n 1181 |         );\n 1182 |     }\n 1183 | \n 1184 |     // Spawn a timer thread to provide a scheduled signal indicating when we\n 1185 |     // should send an update of our progress to the reporting thread.\n 1186 |     //\n 1187 |     // This avoids the need to query the OS monotonic clock for every block.\n 1188 |     let alarm = Alarm::with_interval(Duration::from_secs(1));\n 1189 | \n 1190 |     #[cfg(target_os = \"linux\")]\n 1191 |     if let Err(e) = install_sigusr1_handler()\n 1192 |         && i.settings.status != Some(StatusLevel::None)\n 1193 |     {\n 1194 |         let _ = writeln!(\n 1195 |             io::stderr(),\n 1196 |             \"{}\\n\\t{e}\",\n 1197 |             translate!(\"dd-warning-signal-handler\")\n 1198 |         );\n 1199 |     }","lines":34,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/dd/src/dd.rs#L1166-L1199"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In ptx `create_word_set`, if either the word regex or the context regex fails to compile, the function returns an empty `BTreeSet` (`return BTreeSet::new()`) and the program then produces no output and exits successfully, silently hiding an invalid regex supplied via `--word-regexp`. A user-supplied invalid regex should be a hard error.","fix":"Propagate a UResult error when regex compilation fails rather than returning an empty set.","locations":[{"ref":"src/uu/ptx/src/ptx.rs:332-337","code":"  332 |     let Some(reg) = Regex::new(&filter.word_regex).ok() else {\n  333 |         return BTreeSet::new();\n  334 |     };\n  335 |     let Some(ref_reg) = Regex::new(&config.context_regex).ok() else {\n  336 |         return BTreeSet::new();\n  337 |     };","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/ptx/src/ptx.rs#L332-L337"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In the settings parser, an unrecognized token that happens to parse as a saved-state string is\naccepted, but if `parse_saved_state` returns `None` the code falls through the `if let Some(state)`\ninto the control-char / baud / flag / combo chain. That is intended, but note the saved-state branch\nsilently swallows malformed-but-colon-containing tokens: any token with the wrong number of colon\nparts is not reported as \"invalid saved state\", it is reinterpreted as a (likely invalid) flag,\nproducing a confusing \"invalid argument\" error rather than a saved-state-specific diagnostic. This is\nan error-message-quality issue versus GNU.","fix":"Distinguish \"looks like a saved state but is malformed\" (contains ':') from \"ordinary token\" so a\nclearer error can be emitted, matching GNU's behavior for invalid saved states.","locations":[{"ref":"src/uu/stty/src/stty.rs:365-418","code":"  365 |                 _ => {\n  366 |                     // Try to parse saved format (hex string like \"6d02:5:4bf:8a3b:...\")\n  367 |                     if let Some(state) = parse_saved_state(arg) {\n  368 |                         valid_args.push(ArgOptions::SavedState(state));\n  369 |                     }\n  370 |                     // control char\n  371 |                     else if let Some(char_index) = cc_to_index(arg) {\n  372 |                         if let Some(mapping) = args_iter.next() {\n  373 |                             let cc_mapping = string_to_control_char(mapping).map_err(|e| {\n  374 |                                 let message = match e {\n  375 |                                     ControlCharMappingError::IntOutOfRange(val) => {\n  376 |                                         translate!(\n  377 |                                             \"stty-error-invalid-integer-argument-value-too-large\",\n  378 |                                             \"value\" => format!(\"'{val}'\")\n  379 |                                         )\n  380 |                                     }\n  381 |                                     ControlCharMappingError::MultipleChars(val) => {\n  382 |                                         translate!(\n  383 |                                             \"stty-error-invalid-integer-argument\",\n  384 |                                             \"value\" => format!(\"'{val}'\")\n  385 |                                         )\n  386 |                                     }\n  387 |                                 };\n  388 |                                 UUsageError::new(1, message)\n  389 |                             })?;\n  390 |                             valid_args.push(ArgOptions::Mapping((char_index, cc_mapping)));\n  391 |                         } else {\n  392 |                             return missing_arg(arg);\n  393 |                         }\n  394 |                     // baud rate\n  395 |                     } else if let Some(baud_flag) = string_to_baud(arg, flags::BaudType::Both) {\n  396 |                         valid_args.push(ArgOptions::Flags(baud_flag));\n  397 |                     // non control char flag\n  398 |                     } else if let Some(flag) = string_to_flag(arg) {\n  399 |                         let remove_group = match flag {\n  400 |                             AllFlags::Baud(_, _) => false,\n  401 |                             AllFlags::ControlFlags((flag, remove)) => {\n  402 |                                 check_flag_group(flag, remove)\n  403 |                             }\n  404 |                             AllFlags::InputFlags((flag, remove)) => check_flag_group(flag, remove),\n  405 |                             AllFlags::LocalFlags((flag, remove)) => check_flag_group(flag, remove),\n  406 |                             AllFlags::OutputFlags((flag, remove)) => check_flag_group(flag, remove),\n  407 |                         };\n  408 |                         if remove_group {\n  409 |                             return invalid_arg(arg);\n  410 |                         }\n  411 |                         valid_args.push(flag.into());\n  412 |                     // combination setting\n  413 |                     } else if let Some(combo) = string_to_combo(arg) {\n  414 |                         valid_args.append(&mut combo_to_flags(combo));\n  415 |                     } else {\n  416 |                         return invalid_arg(arg);\n  417 |                     }\n  418 |                 }","lines":54,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/stty/src/stty.rs#L365-L418"},{"ref":"src/uu/stty/src/stty.rs:523-549","code":"  523 | fn parse_saved_state(arg: &str) -> Option<Vec<u32>> {\n  524 |     let parts: Vec<&str> = arg.split(':').collect();\n  525 |     let expected_parts = 4 + nix::libc::NCCS;\n  526 | \n  527 |     // GNU requires exactly the right number of parts for this platform\n  528 |     if parts.len() != expected_parts {\n  529 |         return None;\n  530 |     }\n  531 | \n  532 |     // Validate all parts are non-empty valid hex\n  533 |     let mut values = Vec::with_capacity(expected_parts);\n  534 |     for (i, part) in parts.iter().enumerate() {\n  535 |         if part.is_empty() {\n  536 |             return None; // GNU rejects empty hex values\n  537 |         }\n  538 |         let val = u32::from_str_radix(part, 16).ok()?;\n  539 | \n  540 |         // Control characters (indices 4+) must fit in u8\n  541 |         if i >= 4 && val > 255 {\n  542 |             return None;\n  543 |         }\n  544 | \n  545 |         values.push(val);\n  546 |     }\n  547 | \n  548 |     Some(values)\n  549 | }","lines":27,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/stty/src/stty.rs#L523-L549"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`forwards_thru_file` is called in `bounded_tail` with `.unwrap()` (tail.rs:469), turning any read\nerror while scanning forward for `+N` line mode into a panic-abort. `bounded_tail` returns\n`UResult<()>` and could propagate the error. The seek that follows is also unwrapped (line 470).\nThis contradicts the careful error propagation elsewhere in `tail_file`.","fix":"Propagate with `?` instead of `.unwrap()` on `forwards_thru_file` and `seek` in `bounded_tail`.","locations":[{"ref":"src/uu/tail/src/tail.rs:464-467","code":"  464 |         FilterMode::Lines(Signum::Positive(count), delimiter) if count > &1 => {\n  465 |             let i = forwards_thru_file(file, *count - 1, *delimiter).unwrap();\n  466 |             file.seek(SeekFrom::Start(i as u64)).unwrap();\n  467 |         }","lines":4,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/tail/src/tail.rs#L464-L467"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In timeout `wait_or_kill_process`, the final `Err(_)` arm of `process.wait_or_timeout` maps any wait error to `ExitStatus::CommandTimedOut` (124). An error while waiting for the child is not a timeout; GNU returns 125 (TimeoutFailed) for internal failures. The same questionable mapping appears in the docstring (\"if there is an error while waiting ... then 124 is returned\").","fix":"Return `ExitStatus::TimeoutFailed` (125) for the wait-error case to distinguish an internal failure from a genuine timeout, and update the docstring.","locations":[{"ref":"src/uu/timeout/src/timeout.rs:248-249","code":"  248 |         Err(_) => Ok(ExitStatus::CommandTimedOut.into()),\n  249 |     }","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/timeout/src/timeout.rs#L248-L249"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In touch::touch the Source::Now Linux branch sets atime=mtime=UTIME_NOW only when opts.date.is_none(). When a date IS given, it uses Timestamp::now() and then parse_date offsets from that. But filetime_to_zoned(&atime) is called on the UTIME_NOW sentinel only in the no-date case (where the date block is skipped), so it is fine; however if opts.date is Some and the Now branch produced a real timestamp, both atime and mtime are the same now value, and parse_date is applied independently to each, doubling the relative-date parse cost. Minor duplicate work, not a correctness bug.","fix":"When atime == mtime and date is Some, parse the date once and reuse the result for both.","locations":[{"ref":"src/uu/touch/src/touch.rs:396-401","code":"  396 |             {\n  397 |                 if opts.date.is_none() {\n  398 |                     now = FileTime::from_unix_time(0, libc::UTIME_NOW as u32);\n  399 |                 } else {\n  400 |                     now = timestamp_to_filetime(Timestamp::now());\n  401 |                 }","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/touch/src/touch.rs#L396-L401"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"try_futimens_via_write_fd opens the file write-only and on success returns Ok, on any error returns Err and the caller silently falls back to set_file_times. This means real errors (e.g. EACCES on the FD open for a file the user can stat but not open write) are masked: the open failure is discarded and the slower path is taken, which may then succeed or fail with a different error message. The fast path swallows the original errno.","fix":"Only fall back to set_file_times for the specific errors that justify it (e.g. ENOSYS, EISDIR, ETXTBSY, open-for-write not permitted); propagate other errors instead of silently retrying.","locations":[{"ref":"src/uu/touch/src/touch.rs:697-715","code":"  697 | fn try_futimens_via_write_fd(path: &Path, atime: FileTime, mtime: FileTime) -> std::io::Result<()> {\n  698 |     let file = OpenOptions::new()\n  699 |         .write(true)\n  700 |         // Avoid blocking on special files (e.g. FIFOs) before we can inspect metadata.\n  701 |         .custom_flags(O_NONBLOCK)\n  702 |         .open(path)?;\n  703 | \n  704 |     let timestamps = Timestamps {\n  705 |         last_access: rustix::fs::Timespec {\n  706 |             tv_sec: atime.unix_seconds(),\n  707 |             tv_nsec: atime.nanoseconds() as _,\n  708 |         },\n  709 |         last_modification: rustix::fs::Timespec {\n  710 |             tv_sec: mtime.unix_seconds(),\n  711 |             tv_nsec: mtime.nanoseconds() as _,\n  712 |         },\n  713 |     };\n  714 | \n  715 |     futimens(&file, &timestamps).map_err(|e| Error::from_raw_os_error(e.raw_os_error()))","lines":19,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/touch/src/touch.rs#L697-L715"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In wc(), when print_stats fails for a single input (e.g. broken pipe), the code shows the error and then `return Ok(())`, abandoning all remaining inputs and skipping the total line, yet exiting with success unless set_exit_code was set elsewhere. A transient write error on one file silently drops the rest of the work.","fix":"Either propagate a non-zero exit code on print failure, or continue with the next input rather than returning Ok(()) early.","locations":[{"ref":"src/uu/wc/src/wc.rs:987-991","code":"  987 |             if let Err(err) = print_stats(settings, &word_count, maybe_title_str, number_width) {\n  988 |                 let title = maybe_title_str.unwrap_or(OsStr::new(\"<stdin>\"));\n  989 |                 show!(err.map_err_context(|| translate!(\"wc-error-failed-to-print-result\", \"title\" => title.to_string_lossy())));\n  990 |                 return Ok(());\n  991 |             }","lines":5,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uu/wc/src/wc.rs#L987-L991"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"read_fs_list on Windows can spin in an infinite loop. When a volume name fails the\n`starts_with(\"\\\\\\\\?\\\\\") || ends_with('\\\\')` validation, it `continue`s the loop\nWITHOUT calling FindNextVolumeW first, so volume_name_buf is never advanced and the\nsame bad volume is re-validated forever (also re-emitting the warning endlessly).","fix":"On the bad-path branch, call FindNextVolumeW (and break on ERROR_NO_MORE_FILES)\nbefore continuing, or restructure the loop so the advance always happens.","locations":[{"ref":"src/uucore/src/lib/features/fsext.rs:506-514","code":"  506 |         loop {\n  507 |             let volume_name = LPWSTR2String(&volume_name_buf);\n  508 |             if !volume_name.starts_with(\"\\\\\\\\?\\\\\") || !volume_name.ends_with('\\\\') {\n  509 |                 show_warning!(\"A bad path was skipped: {volume_name}\");\n  510 |                 continue;\n  511 |             }\n  512 |             if let Some(m) = MountInfo::new(volume_name) {\n  513 |                 mounts.push(m);\n  514 |             }","lines":9,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/fsext.rs#L506-L514"}]},
{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Both separator lookups call `icu_decimal::provider::Baked.load(request).unwrap()`. For an unusual/unsupported numeric locale the load can fail, panicking the process during number formatting instead of degrading (e.g. to the 'und'/default separators). The locale originates from user-controlled LC_NUMERIC/LANG.","fix":"Fall back to the default/und locale (or '.'/'') on load error rather than unwrapping, so number formatting never panics on an exotic locale.","locations":[{"ref":"src/uucore/src/lib/features/i18n/decimal.rs:23-24","code":"   23 |     let response: DataResponse<DecimalSymbolsV1> =\n   24 |         icu_decimal::provider::Baked.load(request).unwrap();","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/i18n/decimal.rs#L23-L24"},{"ref":"src/uucore/src/lib/features/i18n/decimal.rs:49-50","code":"   49 |     let response: DataResponse<DecimalSymbolsV1> =\n   50 |         icu_decimal::provider::Baked.load(request).unwrap();","lines":2,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/i18n/decimal.rs#L49-L50"}]},
{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"send_signal_group temporarily installs SigHandler::SigIgn, sends the signal to the process group, then restores the previous handler with `let _ = unsafe { signal(...) }`, silently discarding any error from the restore. If restoring the original disposition fails, the process is left ignoring that signal permanently with no indication, which can mask later signal-delivery bugs in long-running utilities (timeout, etc.).","fix":"At minimum log/propagate the restore failure; ideally use an RAII guard that restores the handler on drop so the restore happens even on early return/panic.","locations":[{"ref":"src/uucore/src/lib/features/process/unix.rs:118-123","code":"  118 |         let old_handler = unsafe { nix_signal::signal(signal, SigHandler::SigIgn) }\n  119 |             .map_err(|e| io::Error::from_raw_os_error(e as i32))?;\n  120 |         let result = nix_signal::kill(Pid::from_raw(0), Some(signal));\n  121 |         // Restore the old handler\n  122 |         let _ = unsafe { nix_signal::signal(signal, old_handler) };\n  123 |         result.map_err(|e| io::Error::from_raw_os_error(e as i32))","lines":6,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/process/unix.rs#L118-L123"}]},
{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"preserve_security_context's doc comment says \"If SELinux is not enabled ... the\nfunction returns success without making any changes\", but the implementation returns\n`Err(SeLinuxError::SELinuxNotEnabled)` when SELinux is disabled. The comment directly\ncontradicts the code, and the function name/return contract is misleading for callers\nthat copied the documented behavior.","fix":"Either return Ok(()) when SELinux is disabled (matching the doc) or fix the doc\ncomment to state it errors with SELinuxNotEnabled.","locations":[{"ref":"src/uucore/src/lib/features/selinux.rs:475-495","code":"  475 | ///\n  476 | /// * `Ok(())` - If the context was successfully preserved or if SELinux is not enabled.\n  477 | /// * `Err(SeLinuxError)` - If an error occurred during context retrieval or application.\n  478 | ///\n  479 | /// # Examples\n  480 | ///\n  481 | /// ```\n  482 | /// use std::path::Path;\n  483 | /// use uucore::selinux::preserve_security_context;\n  484 | ///\n  485 | /// // Preserve the SELinux context from source to destination\n  486 | /// match preserve_security_context(Path::new(\"/path/to/source\"), Path::new(\"/path/to/destination\")) {\n  487 | ///     Ok(_) => println!(\"Context preserved successfully (or SELinux is not enabled)\"),\n  488 | ///     Err(err) => eprintln!(\"Failed to preserve context: {err}\"),\n  489 | /// }\n  490 | /// ```\n  491 | pub fn preserve_security_context(from_path: &Path, to_path: &Path) -> Result<(), SeLinuxError> {\n  492 |     // If SELinux is not enabled, return success without doing anything\n  493 |     if !is_selinux_enabled() {\n  494 |         return Err(SeLinuxError::SELinuxNotEnabled);\n  495 |     }","lines":21,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/selinux.rs#L475-L495"}]},
{"id":"ERR_25","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`iter_all_records_from` does `CString::new(path.as_ref().as_os_str().as_bytes()).unwrap()`. A path\ncontaining an interior NUL byte makes `CString::new` return `Err`, so this `.unwrap()` panics. Paths are\nuser-controllable (e.g. `who <file>`), so a crafted argument with an embedded NUL crashes the utility\ninstead of producing the \"pray\"/no-error behavior the surrounding comment promises.","fix":"Handle the `CString::new` error gracefully (return an empty iterator or skip the `utmpxname` call) instead\nof unwrapping.","locations":[{"ref":"src/uucore/src/lib/features/utmpx.rs:367-393","code":"  367 |     pub fn iter_all_records_from<P: AsRef<Path>>(path: P) -> UtmpxIter {\n  368 |         #[cfg(feature = \"feat_systemd_logind\")]\n  369 |         {\n  370 |             // Use systemd-logind for default utmp file when feature is enabled\n  371 |             if path.as_ref() == Path::new(DEFAULT_FILE) {\n  372 |                 return UtmpxIter::new_systemd();\n  373 |             }\n  374 |         }\n  375 | \n  376 |         let iter = UtmpxIter::new();\n  377 |         let path = CString::new(path.as_ref().as_os_str().as_bytes()).unwrap();\n  378 |         unsafe {\n  379 |             // In glibc, utmpxname() only fails if there's not enough memory\n  380 |             // to copy the string.\n  381 |             // Solaris returns 1 on success instead of 0. Supposedly there also\n  382 |             // exist systems where it returns void.\n  383 |             // GNU who on Debian seems to output nothing if an invalid filename\n  384 |             // is specified, no warning or anything.\n  385 |             // So this function is pretty crazy and we don't try to detect errors.\n  386 |             // Not much we can do besides pray.\n  387 |             #[cfg_attr(target_env = \"musl\", allow(deprecated))]\n  388 |             utmpxname(path.as_ptr());\n  389 |             #[cfg_attr(target_env = \"musl\", allow(deprecated))]\n  390 |             setutxent();\n  391 |         }\n  392 |         iter\n  393 |     }","lines":27,"link":"https://github.com/uutils/coreutils/blob/8118c243f7517b0c1fcf142249ef9b11a87351ad/src/uucore/src/lib/features/utmpx.rs#L367-L393"}]},
