<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"easy","description":"`callback__debug_message` reads `string_address` straight from `args_and_results[0].i32`, which is a value chosen entirely by the running WASM module (this callback backs the `tree_sitter_debug_message` import that any external scanner can call), and immediately does `printf(\"DEBUG: %s %u\\n\", &memory[string_address], value)` with no bounds check whatsoever. Unlike every other host-side reader in this file (`wasm_memory__read`, `wasm_memory__string_length`, `copy_string`, `copy`), this function never validates `string_address` against the WASM linear memory size before treating `&memory[string_address]` as a NUL-terminated C string. A malicious or buggy scanner can pass an out-of-range address, causing the host process to read (and print) memory past the end of the WASM heap allocation - anywhere from adjacent heap metadata to an unmapped page (crash) - directly defeating the sandbox boundary this file is supposed to enforce.","fix":"Bounds-check `string_address` before dereferencing it, exactly like `copy_string` does with `wasm_memory__string_length`:\n```c\nstatic wasm_trap_t *callback__debug_message(\n  void *env,\n  wasmtime_caller_t* caller,\n  wasmtime_val_raw_t *args_and_results,\n  size_t args_and_results_len\n) {\n  wasmtime_context_t *context = wasmtime_caller_context(caller);\n  TSWasmStore *store = env;\n  ts_assert(args_and_results_len == 2);\n  uint32_t string_address = args_and_results[0].i32;\n  uint32_t value = args_and_results[1].i32;\n  uint8_t *memory = wasmtime_memory_data(context, &store->memory);\n  size_t memory_size = wasmtime_memory_data_size(context, &store->memory);\n  WasmMemory wasm_memory = { .data = memory, .size = memory_size };\n  size_t len;\n  if (!wasm_memory__string_length(&wasm_memory, (int32_t)string_address, &len)) {\n    return wasmtime_trap_new(\"debug_message: string out of bounds\", 34);\n  }\n  printf(\"DEBUG: %.*s %u\\n\", (int)len, &memory[string_address], value);\n  return NULL;\n}\n```","locations":[{"ref":"lib/src/wasm_store.c:267-281","code":"  267 | static wasm_trap_t *callback__debug_message(\n  268 |   void *env,\n  269 |   wasmtime_caller_t* caller,\n  270 |   wasmtime_val_raw_t *args_and_results,\n  271 |   size_t args_and_results_len\n  272 | ) {\n  273 |   wasmtime_context_t *context = wasmtime_caller_context(caller);\n  274 |   TSWasmStore *store = env;\n  275 |   ts_assert(args_and_results_len == 2);\n  276 |   uint32_t string_address = args_and_results[0].i32;\n  277 |   uint32_t value = args_and_results[1].i32;\n  278 |   uint8_t *memory = wasmtime_memory_data(context, &store->memory);\n  279 |   printf(\"DEBUG: %s %u\\n\", &memory[string_address], value);\n  280 |   return NULL;\n  281 | }","lines":15,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L267-L281"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `parse_file_at_path`, when printing the parse-time summary line, `parse_duration.as_nanos()` (a `u128`) is used directly as the divisor in `(source_code.len() as u128 * 1_000_000) / parse_duration.as_nanos()`. Integer division by zero always panics in Rust, and `parse_duration` can legitimately be `0` for very small/trivial inputs (or on platforms/timers with coarse resolution). This code path runs whenever `first_error.is_some()` (i.e. on essentially every file with a parse error) or when `--time` is passed, so a fast parse of a tiny malformed file crashes `tree-sitter parse` instead of printing a result. Notably, `Stats::fmt` in the same file (lines 42-49) already special-cases a zero duration to avoid exactly this problem, but this code path was not given the same treatment.","fix":"Guard against a zero duration the same way `Stats::fmt` does, e.g.:\n```rust\nlet bytes_per_ms = if parse_duration.as_nanos() == 0 {\n    0\n} else {\n    (source_code.len() as u128 * 1_000_000) / parse_duration.as_nanos()\n};\nwrite!(&mut stdout, \"{:width$}\\tParse: {parse_duration_ms:>7.2} ms\\t{bytes_per_ms:>6} bytes/ms\", name, width = max_path_length)?;\n```","locations":[{"ref":"crates/cli/src/parse.rs:665-673","code":"  665 |         if first_error.is_some() || opts.print_time {\n  666 |             let path = path.to_string_lossy();\n  667 |             write!(\n  668 |                 &mut stdout,\n  669 |                 \"{:width$}\\tParse: {parse_duration_ms:>7.2} ms\\t{:>6} bytes/ms\",\n  670 |                 name,\n  671 |                 (source_code.len() as u128 * 1_000_000) / parse_duration.as_nanos(),\n  672 |                 width = max_path_length\n  673 |             )?;","lines":9,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/parse.rs#L665-L673"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`intern_symbols` unconditionally indexes `grammar.variables[0]` to check whether the start rule is hidden: `if variable_type_for_name(&grammar.variables[0].name) == VariableType::Hidden`. If the grammar has zero rules, `grammar.variables` is empty and this indexing panics with `index out of bounds: the len is 0 but the index is 0`, crashing the whole `tree-sitter generate` process instead of producing a clean diagnostic.\n\nThis is reachable from real, plausible user input: `crates/generate/src/generate.rs::load_grammar_file` reads a `.json` grammar file verbatim (`fs::read_to_string`) and feeds it straight into `parse_grammar` and then `prepare_grammar`/`intern_symbols`, completely bypassing the `dsl.js` JS-side guard `\"Grammar must have at least one rule.\"` that only runs for `.js` grammars evaluated through the JS runtime. `crates/generate/src/parse_grammar.rs`'s `GrammarJSON::rules` field has no non-empty validation either (`rules: Map<String, Value>` with no `#[serde(default)]` requiring non-emptiness, just requiring the key to be present as e.g. `{}`).\n\nVerified experimentally: calling `tree_sitter_generate::generate_parser_for_grammar(r#\"{\"name\":\"empty_test\",\"rules\":{}}\"#, None, &mut diagnostics)` panics with:\n```\nthread '...' panicked at crates/generate/src/prepare_grammar/intern_symbols.rs:33:49:\nindex out of bounds: the len is 0 but the index is 0\n```","fix":"Add an explicit check before indexing, returning a proper `InternSymbolsResult` error instead of panicking, e.g.:\n```rust\nlet Some(first_variable) = grammar.variables.first() else {\n    return Err(InternSymbolsError::NoRules);\n};\nif variable_type_for_name(&first_variable.name) == VariableType::Hidden {\n    Err(InternSymbolsError::HiddenStartRule)?;\n}\n```\n(add a new `NoRules` variant to `InternSymbolsError`, or validate this earlier in `parse_grammar` right after deserializing `GrammarJSON`, so `.json`-sourced grammars get the same \"grammar must have at least one rule\" guarantee that `dsl.js` gives `.js`-sourced grammars).","locations":[{"ref":"crates/generate/src/prepare_grammar/intern_symbols.rs:33-35","code":"   33 |     if variable_type_for_name(&grammar.variables[0].name) == VariableType::Hidden {\n   34 |         Err(InternSymbolsError::HiddenStartRule)?;\n   35 |     }","lines":3,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/prepare_grammar/intern_symbols.rs#L33-L35"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"When `tree-sitter init` runs on a directory that already has a `tree-sitter.json`, `Init::run` deserializes it into `TreeSitterJSON` and then does `json.grammars.swap_remove(0).name` without checking that `grammars` is non-empty. `TreeSitterJSON::grammars` has no `#[serde(default)]` or minimum-length validation, so a hand-edited or externally-generated `tree-sitter.json` containing `\"grammars\": []` deserializes successfully and then causes `swap_remove(0)` to panic with an index-out-of-bounds message instead of a clean error. The same unchecked-index pattern (`tree_sitter_config.grammars[0]`) is repeated throughout `generate_grammar_files` in `init.rs`, which is reachable from the same code path.","fix":"Validate `grammars` is non-empty right after parsing `tree-sitter.json` and return a proper `anyhow!` error (e.g. `\"tree-sitter.json must declare at least one grammar\"`) instead of letting the later indexing operations panic.","locations":[{"ref":"crates/cli/src/main.rs:918","code":"  918 |             (json.grammars.swap_remove(0).name, None)","lines":1,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/main.rs#L918"},{"ref":"crates/cli/src/init.rs:282-339","code":"  282 |     let camel_name = tree_sitter_config.grammars[0]\n  283 |         .camelcase\n  284 |         .take()\n  285 |         .unwrap_or_else(|| language_name.to_upper_camel_case());\n  286 |     let title_name = tree_sitter_config.grammars[0]\n  287 |         .title\n  288 |         .take()\n  289 |         .unwrap_or_else(|| language_name.to_upper_camel_case());\n  290 |     let class_name = tree_sitter_config.grammars[0]\n  291 |         .class_name\n  292 |         .take()\n  293 |         .unwrap_or_else(|| format!(\"TreeSitter{}\", language_name.to_upper_camel_case()));\n  294 | \n  295 |     let authors = tree_sitter_config.metadata.authors.as_ref();\n  296 | \n  297 |     let default_highlights_path = Path::new(\"queries\").join(DEFAULT_HIGHLIGHTS_QUERY_FILE_NAME);\n  298 |     let default_injections_path = Path::new(\"queries\").join(DEFAULT_INJECTIONS_QUERY_FILE_NAME);\n  299 |     let default_locals_path = Path::new(\"queries\").join(DEFAULT_LOCALS_QUERY_FILE_NAME);\n  300 |     let default_tags_path = Path::new(\"queries\").join(DEFAULT_TAGS_QUERY_FILE_NAME);\n  301 | \n  302 |     let generate_opts = GenerateOpts {\n  303 |         author_name: authors\n  304 |             .map(|a| a.first().map(|a| a.name.as_str()))\n  305 |             .unwrap_or_default(),\n  306 |         author_email: authors\n  307 |             .map(|a| a.first().and_then(|a| a.email.as_deref()))\n  308 |             .unwrap_or_default(),\n  309 |         author_url: authors\n  310 |             .map(|a| a.first().and_then(|a| a.url.as_deref()))\n  311 |             .unwrap_or_default(),\n  312 |         license: tree_sitter_config.metadata.license.as_deref(),\n  313 |         description: tree_sitter_config.metadata.description.as_deref(),\n  314 |         repository: tree_sitter_config\n  315 |             .metadata\n  316 |             .links\n  317 |             .as_ref()\n  318 |             .map(|l| l.repository.as_str()),\n  319 |         funding: tree_sitter_config\n  320 |             .metadata\n  321 |             .links\n  322 |             .as_ref()\n  323 |             .and_then(|l| l.funding.as_deref()),\n  324 |         version: &tree_sitter_config.metadata.version,\n  325 |         camel_parser_name: &camel_name,\n  326 |         title_parser_name: &title_name,\n  327 |         class_name: &class_name,\n  328 |         highlights_query_path: tree_sitter_config.grammars[0]\n  329 |             .highlights\n  330 |             .to_variable_value(&default_highlights_path),\n  331 |         injections_query_path: tree_sitter_config.grammars[0]\n  332 |             .injections\n  333 |             .to_variable_value(&default_injections_path),\n  334 |         locals_query_path: tree_sitter_config.grammars[0]\n  335 |             .locals\n  336 |             .to_variable_value(&default_locals_path),\n  337 |         tags_query_path: tree_sitter_config.grammars[0]\n  338 |             .tags\n  339 |             .to_variable_value(&default_tags_path),","lines":58,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/init.rs#L282-L339"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Config::add` calls `self.config.as_object_mut().unwrap()` on the JSON value that was loaded from the user's `config.json`. `Config::load` never validates that the top-level JSON value is an object -- it accepts whatever `serde_json::from_str` parses. If a user's config file is valid JSON but not an object (e.g. `[]`, `null`, or a bare string, which can happen from manual editing or a botched merge), every subsequent call to `Config::add` (used by `tree-sitter init-config` and any command that persists loader/highlight config) panics instead of reporting a clear configuration error.","fix":"Return a proper `ConfigError` instead of unwrapping, e.g. add a `ConfigError` variant for \"config root is not a JSON object\" and use `.ok_or_else(...)?` in place of `.unwrap()` in both places `as_object_mut()` is called in `add`.","locations":[{"ref":"crates/config/src/tree_sitter_config.rs:192-202","code":"  192 |     pub fn add<C>(&mut self, config: C) -> ConfigResult<()>\n  193 |     where\n  194 |         C: Serialize,\n  195 |     {\n  196 |         let mut config = serde_json::to_value(&config)?;\n  197 |         self.config\n  198 |             .as_object_mut()\n  199 |             .unwrap()\n  200 |             .append(config.as_object_mut().unwrap());\n  201 |         Ok(())\n  202 |     }","lines":11,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/config/src/tree_sitter_config.rs#L192-L202"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `Loader::select_language`, the error-mapping closure for `language_configuration_for_file_name` does `path.file_name().unwrap().to_string_lossy().to_string()`. `Path::file_name()` returns `None` for paths that are empty, `.`, `..`, or end in `..` (e.g. a CLI r {\n        kind: WasmErrorKind::Other,\n        message: \"language name must not contain a NUL byte\".to_string(),\n    })?;\n    ...\n```","locations":[{"ref":"lib/binding_rust/wasm_language.rs:64-81","code":"   64 |     pub fn load_language(&mut self, name: &str, bytes: &[u8]) -> Result<Language, WasmError> {\n   65 |         let name = CString::new(name).unwrap();\n   66 |         unsafe {\n   67 |             let mut error = MaybeUninit::<ffi::TSWasmError>::uninit();\n   68 |             let language = ffi::ts_wasm_store_load_language(\n   69 |                 self.0,\n   70 |                 name.as_ptr(),\n   71 |                 bytes.as_ptr().cast::<c_char>(),\n   72 |                 bytes.len() as u32,\n   73 |                 error.as_mut_ptr(),\n   74 |             );\n   75 |             if language.is_null() {\n   76 |                 Err(WasmError::new(error.assume_init()))\n   77 |             } else {\n   78 |                 Ok(Language(language))\n   79 |             }\n   80 |         }\n   81 |     }","lines":18,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_rust/wasm_language.rs#L64-L81"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"hard","description":"`stack_node_release` and `stack_node_add_link` in `lib/src/stack.c` both use native C recursion to walk the predecessor graph of `StackNode`s, and only the `links[0]` chain is flattened into an iterative `goto recur` loop; every other link (`links[1] .. links[link_count-1]`) is released or merged via a genuine recursive call (`stack_node_release(link.node, pool, subtree_pool)` at `lib/src/stack.c:105`, and `stack_node_add_link(existing_link->node, link.node->links[j], subtree_pool)` at `lib/src/stack.c:235`). For grammars/inputs that produce many GLR merges where the *non-primary* link forms a long chain (rather than the primary `links[0]` chain), this recursion depth tracks the depth of the parse stack and is effectively unbounded, since neither `MAX_LINK_COUNT` nor any other constant caps how many `StackNode`s can be chained together through secondary links. A sufficiently deep/ambiguous input (e.g. deeply nested expressions that create alternate merge paths) can therefore exhaust the native call stack and crash the process (stack overflow) when the stack node is eventually released or when nodes are merged, even though ordinary long single-path chains are safe because of the `goto recur` trampoline.","fix":"Extend the iterative work-list technique already used for the primary (`links[0]`) chain to the secondary links as well, e.g. push `link.node` for `i >= 1` onto an explicit heap-allocated/stack-allocated worklist (`StackNodeArray`) instead of recursing, and drain that worklist in the same function, so total stack depth stays `O(1)` regardless of how deep secondary merge chains become.","locations":[{"ref":"lib/src/stack.c:90-122","code":"   90 | static void stack_node_release(\n   91 |   StackNode *self,\n   92 |   StackNodeArray *pool,\n   93 |   SubtreePool *subtree_pool\n   94 | ) {\n   95 | recur:\n   96 |   ts_assert(self->ref_count != 0);\n   97 |   self->ref_count--;\n   98 |   if (self->ref_count > 0) return;\n   99 | \n  100 |   StackNode *first_predecessor = NULL;\n  101 |   if (self->link_count > 0) {\n  102 |     for (unsigned i = self->link_count - 1; i > 0; i--) {\n  103 |       StackLink link = self->links[i];\n  104 |       if (link.subtree.ptr) ts_subtree_release(subtree_pool, link.subtree);\n  105 |       stack_node_release(link.node, pool, subtree_pool);\n  106 |     }\n  107 |     StackLink link = self->links[0];\n  108 |     if (link.subtree.ptr) ts_subtree_release(subtree_pool, link.subtree);\n  109 |     first_predecessor = self->links[0].node;\n  110 |   }\n  111 | \n  112 |   if (pool->size < MAX_NODE_POOL_SIZE) {\n  113 |     array_push(pool, self);\n  114 |   } else {\n  115 |     ts_free(self);\n  116 |   }\n  117 | \n  118 |   if (first_predecessor) {\n  119 |     self = first_predecessor;\n  120 |     goto recur;\n  121 |   }\n  122 | }","lines":33,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/stack.c#L90-L122"},{"ref":"lib/src/stack.c:200-264","code":"  200 | static void stack_node_add_link(\n  201 |   StackNode *self,\n  202 |   StackLink link,\n  203 |   SubtreePool *subtree_pool\n  204 | ) {\n  205 |   if (link.node == self) return;\n  206 | \n  207 |   for (int i = 0; i < self->link_count; i++) {\n  208 |     StackLink *existing_link = &self->links[i];\n  209 |     if (stack__subtree_is_equivalent(existing_link->subtree, link.subtree)) {\n  210 |       // In general, we preserve ambiguities until they are removed from the stack\n  211 |       // during a pop operation where multiple paths lead to the same node. But in\n  212 |       // the special case where two links directly connect the same pair of nodes,\n  213 |       // we can safely remove the ambiguity ahead of time without changing behavior.\n  214 |       if (existing_link->node == link.node) {\n  215 |         if (\n  216 |           ts_subtree_dynamic_precedence(link.subtree) >\n  217 |           ts_subtree_dynamic_precedence(existing_link->subtree)\n  218 |         ) {\n  219 |           ts_subtree_retain(link.subtree);\n  220 |           ts_subtree_release(subtree_pool, existing_link->subtree);\n  221 |           existing_link->subtree = link.subtree;\n  222 |           self->dynamic_precedence =\n  223 |             link.node->dynamic_precedence + ts_subtree_dynamic_precedence(link.subtree);\n  224 |         }\n  225 |         return;\n  226 |       }\n  227 | \n  228 |       // If the previous nodes are mergeable, merge them recursively.\n  229 |       if (\n  230 |         existing_link->node->state == link.node->state &&\n  231 |         existing_link->node->position.bytes == link.node->position.bytes &&\n  232 |         existing_link->node->err ps panic during `drop`, which is risky: a panic while already unwinding from another panic aborts the process instead of failing gracefully, and even in the normal case it turns an environment/tooling failure (missing `dot`, I/O race) into an uncontrolled panic rather than the `error!(...)` logging path already used a few lines below for the non-success case.","fix":"Replace the `unwrap()` calls in `Drop for LogSession` with pattern matches that log via `error!` and return early on failure, mirroring the existing `else { error!(...) }` branch, instead of panicking.","locations":[{"ref":"crates/cli/src/util.rs:113-131","code":"  113 | impl Drop for LogSession {\n  114 |     fn drop(&mut self) {\n  115 |         use std::fs;\n  116 | \n  117 |         drop(self.dot_process_stdin.take().unwrap());\n  118 |         let output = self.dot_process.take().unwrap().wait_with_output().unwrap();\n  119 |         if output.status.success() {\n  120 |             if self.open_log && fs::metadata(&self.path).unwrap().len() > HTML_HEADER.len() as u64 {\n  121 |                 webbrowser::open(&self.path.to_string_lossy()).unwrap();\n  122 |             }\n  123 |         } else {\n  124 |             error!(\n  125 |                 \"Dot failed: {} {}\",\n  126 |                 String::from_utf8_lossy(&output.stdout),\n  127 |                 String::from_utf8_lossy(&output.stderr)\n  128 |             );\n  129 |         }\n  130 |     }\n  131 | }","lines":19,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/util.rs#L113-L131"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`TagsConfiguration::syntax_type_name(&self, id: u32)` indexes `self.syntax_type_names[id as usize]` with no bounds check. Any caller of this public API that passes an `id` outside `0..syntax_type_names.len()` (e.g. a stale or foreign `syntax_type_id`) triggers an index-out-of-bounds panic instead of a graceful error/`None`.","fix":"Return `Option<&str>` and check bounds first: `self.syntax_type_names.get(id as usize).map(|name| ...)`.","locations":[{"ref":"crates/tags/src/tags.rs:250-261","code":"  250 |     #[must_use]\n  251 |     pub fn syntax_type_name(&self, id: u32) -> &str {\n  252 |         unsafe {\n  253 |             let cstr = CStr::from_ptr(\n  254 |                 self.syntax_type_names[id as usize]\n  255 |                     .as_ptr()\n  256 |                     .cast::<c_char>(),\n  257 |             )\n  258 |             .to_bytes();\n  259 |             str::from_utf8(cstr).expect(\"syntax type name was not valid utf-8\")\n  260 |         }\n  261 |     }","lines":12,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/tags/src/tags.rs#L250-L261"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Both `check_wasm_exports::check_wasm_exports` and `build_wasm::run_wasm_stdlib` parse a text file of quoted, comma-terminated symbol names (`lib/binding_web/lib/exports.txt` and `lib/src/wasm/stdlib-symbols.txt`) with the exact same fragile pattern: `.map(|s| s[1..s.len() - 2].to_string())` / `.map(|line| format!(\"-Wl,--export={}\", &line[1..line.len() - 2]))`. Neither guards against a line shorter than 2 bytes (e.g. a blank trailing line, or a stray comment/line without the expected `\"symbol\",` shape). `line.len() - 2` underflows `usize` for such a line, and the subsequent slice indexing panics regardless of build profile (Rust always bounds-checks string slicing). Both files currently happen to have no such short lines, but the check is one accidental blank line (or manual edit) away from making these dev-tool subcommands (`xtask check-wasm-exports`, `xtask build-wasm-stdlib`) crash instead of failing gracefully.","fix":"Replace the raw slicing with a resilient trim, e.g. `s.trim_matches(['\"', ',']).to_string()` (or skip/`filter` out lines that don't start with `\"` and are shorter than 2 characters before slicing), so a malformed or blank line is handled gracefully instead of panicking.","locations":[{"ref":"crates/xtask/src/check_wasm_exports.rs:62-67","code":"   62 |     let mut wasm_exports = std::fs::read_to_string(\"lib/binding_web/lib/exports.txt\")?\n   63 |         .lines()\n   64 |         .map(|s| s.replace(\"_wasm\", \"\").replace(\"byte\", \"index\"))\n   65 |         // remove leading and trailing quotes, trailing comma\n   66 |         .map(|s| s[1..s.len() - 2].to_string())\n   67 |         .collect::<HashSet<_>>();","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/xtask/src/check_wasm_exports.rs#L62-L67"},{"ref":"crates/xtask/src/build_wasm.rs:602-606","code":"  602 | pub fn run_wasm_stdlib() -> Result<()> {\n  603 |     let export_flags = include_str!(\"../../../lib/src/wasm/stdlib-symbols.txt\")\n  604 |         .lines()\n  605 |         .map(|line| format!(\"-Wl,--export={}\", &line[1..line.len() - 2]))\n  606 |         .collect::<Vec<String>>();","lines":5,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/xtask/src/build_wasm.rs#L602-L606"}]},{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"Several `Language`/`Node`/`TreeCursor`/`LookaheadIterator` accessors in `lib/binding_rust/lib.rs` return string slices with an unconditional `'static` lifetime that is decoupled from `&self`, e.g. `pub fn name(&self) -> Option<&'static str>` (`Language::name`), `Language::node_kind_for_id`, `Language::field_name_for_id`, `Node::kind`, `Node::grammar_name`, `Node::field_name_for_child`/`field_name_for_named_child`, `TreeCursor::field_name`, and `LookaheadIterator::current_symbol_name`. This is sound only for statically-linked/compiled-in languages, whose `TSLanguage` data lives for the process lifetime. For languages loaded via `wasm_language::WasmStore::load_language` (the `wasm` feature), the picture is different: `ts_language_delete` (`lib/src/language.c`) calls `ts_wasm_language_release` (`lib/src/wasm_store.c`), which, once the language's ref-count reaches zero, calls `ts_free` on `self->name`, `self->field_names`, `self->symbol_names`, `module->field_name_buffer`, and `module->symbol_name_buffer` -- exactly the backing storage for the strings these accessors return. Because the returned lifetime is `'static` rather than tied to `self`, ordinary safe Rust can outlive the underlying buffer: call `language.name()` (or `node.kind()`, etc.) to obtain a `&'static str`, then drop the last `Language`/`Tree` referencing that Wasm-loaded language (invoking `Drop for Language` -> `ffi::ts_language_delete`), and the previously obtained slice now points at freed memory -- a use-after-free with no `unsafe` block required by the caller.","fix":"Tie these return lifetimes to the borrow of the owning object instead of claiming `'static`, e.g. `pub fn name(&self) -> Option<&str>` (elided lifetime bound to `&self`), and propagate the same change through `Node<'tree>`, `TreeCursor<'tree>`, and `LookaheadIterator` so the compiler enforces that the string cannot outlive the `Language`/`Tree`/iterator it came from. If the `'static` claim is intentionally kept for the common statically-linked-language case, gate it behind a safety invariant documented on `WasmStore::load_language`/`Language` (or make the wasm-loaded path return owned `String`s) so the unsoundness is not reachable from safe code.","locations":[{"ref":"lib/binding_rust/lib.rs:503-508","code":"  503 |     #[doc(alias = \"ts_language_name\")]\n  504 |     #[must_use]\n  505 |     pub fn name(&self) -> Option<&'static str> {\n  506 |         let ptr = unsafe { ffi::ts_language_name(self.0) };\n  507 |         (!ptr.is_null()).then(|| unsafe { CStr::from_ptr(ptr) }.to_str().unwrap())\n  508 |     }","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_rust/lib.rs#L503-L508"},{"ref":"lib/binding_rust/lib.rs:576-582","code":"  576 |     /// Get the name of the node kind for the given numerical id.\n  577 |     #[doc(alias = \"ts_language_symbol_name\")]\n  578 |     #[must_use]\n  579 |     pub fn node_kind_for_id(&self, id: u16) -> Option<&'static str> {\n  580 |         let ptr = unsafe { ffi::ts_language_symbol_name(self.0, id) };\n  581 |         (!ptr.is_null()).then(|| unsafe { CStr::from_ptr(ptr) }.to_str().unwrap())\n  582 |     }","lines":7,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_rust/lib.rs#L576-L582"},{"ref":"lib/binding_rust/lib.rs:625-631","code":"  625 |     /// Get the field name for the given numerical id.\n  626 |     #[doc(alias = \"ts_language_field_name_for_id\")]\n  627 |     #[must_use]\n  628 |     pub fn field_name_for_id(&self, field_id: u16) -> Option<&'static str> {\n  629 |         let ptr = unsafe { ffi::ts_language_field_name_for_id(self.0, field_id) };\n  630 |         (!ptr.is_null()).then(|| unsafe { CStr::from_ptr(ptr) }.to_str().unwrap())\n  631 |     }","lines":7,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_rust/lib.rs#L625-L631"},{"ref":"lib/binding_rust/lib.rs:1599-1606","code":" 1599 |     /// Get this node's type as a string.\n 1600 |     #[doc(alias = \"ts_node_type\")]\n 1601 |     #[must_use]\n 1602 |     pub fn kind(&self) -> &'static str {\n 1603 |         unsafe { CStr::from_ptr(ffi::ts_node_type(self.0)) }\n 1604 |             .to_str()\n 1605 |             .unwrap()\n 1606 |     }","lines":8,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_rust/lib.rs#L1599-L1606"}]},{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"`ts_stack_copy_version` copies an entire `StackHead` by value (`StackHead version_head = *array_get(&self->heads, version);`) and then only fixes up the fields that use shared/refcounted ownership or exclusive ownership: it retains `head->last_external_token` and explicitly sets `head->summary = NULL` (since `summary` is exclusively owned and must not be shared between two heads). It does the same fix-up for `node` via `stack_node_retain(head->node)`. However it forgets the fourth field with special ownership, `lookahead_when_paused`: this `Subtree` is transferred (not refcounted) into a head by `ts_stack_pause` and transferred back out by `ts_stack_resume`, and `stack_head_delete` unconditionally calls `ts_subtree_release` on it whenever `lookahead_when_paused.ptr` is set. If `ts_stack_copy_version` is ever called on a version whose head is currently paused (`status == StackStatusPaused`, so `lookahead_when_paused.ptr != NULL`), both the original and the copied head end up pointing at the same `Subtree` with only one owning reference between them; when both heads are eventually deleted (e.g. via `ts_stack_remove_version`/`stack_head_delete`), the subtree is released twice, corrupting the subtree pool / causing a use-after-free on the second release. Today the single call site (`lib/src/parser.c:1515`, inside `ts_parser__handle_error`) only ever invokes this on versions that were just resumed via `ts_stack_resume` (which clears `lookahead_when_paused`) or on freshly-created reduction versions, so the bug is not currently triggered, but the function itself does not enforce or assert this invariant, making it a latent trap for any future caller (or refactor of `ts_parser__handle_error`).","fix":"Either retain `lookahead_when_paused` the same way `last_external_token` is retained, or explicitly null it out after the copy (mirroring what is already done for `summary`), and/or add `ts_assert(version_head.lookahead_when_paused.ptr == NULL)` (i.e. assert the source head is not paused) to make the precondition explicit:\n```c\nStackVersion ts_stack_copy_version(Stack *self, StackVersion version) {\n  ts_assert(version < self->heads.size);\n  StackHead version_head = *array_get(&self->heads, version);\n  array_push(&self->heads, version_head);\n  StackHead *head = array_back(&self->heads);\n  stack_node_retain(head->node);\n  if (head->last_external_token.ptr) ts_subtree_retain(head->last_external_token);\n  if (head->lookahead_when_paused.ptr) ts_subtree_retain(head->lookahead_when_paused);\n  head->summary = NULL;\n  return self->heads.size - 1;\n}\n```","locations":[{"ref":"lib/src/stack.c:697-706","code":"  697 | StackVersion ts_stack_copy_version(Stack *self, StackVersion version) {\n  698 |   ts_assert(version < self->heads.size);\n  699 |   StackHead version_head = *array_get(&self->heads, version);\n  700 |   array_push(&self->heads, version_head);\n  701 |   StackHead *head = array_back(&self->heads);\n  702 |   stack_node_retain(head->node);\n  703 |   if (head->last_external_token.ptr) ts_subtree_retain(head->last_external_token);\n  704 |   head->summary = NULL;\n  705 |   return self->heads.size - 1;\n  706 | }","lines":10,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/stack.c#L697-L706"},{"ref":"lib/src/stack.c:266-284","code":"  266 | static void stack_head_delete(\n  267 |   StackHead *self,\n  268 |   StackNodeArray *pool,\n  269 |   SubtreePool *subtree_pool\n  270 | ) {\n  271 |   if (self->node) {\n  272 |     if (self->last_external_token.ptr) {\n  273 |       ts_subtree_release(subtree_pool, self->last_external_token);\n  274 |     }\n  275 |     if (self->lookahead_when_paused.ptr) {\n  276 |       ts_subtree_release(subtree_pool, self->lookahead_when_paused);\n  277 |     }\n  278 |     if (self->summary) {\n  279 |       array_delete(self->summary);\n  280 |       ts_free(self->summary);\n  281 |     }\n  282 |     stack_node_release(self->node, pool, subtree_pool);\n  283 |   }\n  284 | }","lines":19,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/stack.c#L266-L284"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"`Parser.getIncludedRanges` (`lib/binding_web/src/parser.ts`) and `Tree.getIncludedRanges` (`lib/binding_web/src/tree.ts`) both call `C._ts_parser_included_ranges_wasm`/`C._ts_tree_included_ranges_wasm`, which on the C side always allocate a buffer via `ts_calloc(self->included_range_count, sizeof(TSRange))` (see `ts_tree_included_ranges` in `lib/src/tree.c`) even when `included_range_count` is `0` - `calloc(0, size)` returns a valid, unique, must-be-freed pointer on the allocator used by the Wasm build. Both JS methods only call `C._free(buffer)` inside the `if (count > 0)` branch, so whenever a parser/tree has no included ranges set (the common default case - parsing the whole document), the allocated buffer is never freed and leaks on every single call to `getIncludedRanges()`.","fix":"Free the buffer unconditionally after use instead of only inside the `count > 0` branch, e.g.:\n```ts\ngetIncludedRanges(): Range[] {\n  C._ts_parser_included_ranges_wasm(this[0]);\n  const count = C.getValue(TRANSFER_BUFFER, 'i32');\n  const buffer = C.getValue(TRANSFER_BUFFER + SIZE_OF_INT, 'i32');\n  const result = new Array<Range>(count);\n\n  let address = buffer;\n  for (let i = 0; i < count; i++) {\n    result[i] = unmarshalRange(address);\n    address += SIZE_OF_RANGE;\n  }\n  C._free(buffer);\n\n  return result;\n}\n```","locations":[{"ref":"lib/binding_web/src/parser.ts:274-291","code":"  274 |   /** Get the ranges of text that the parser will include when parsing. */\n  275 |   getIncludedRanges(): Range[] {\n  276 |     C._ts_parser_included_ranges_wasm(this[0]);\n  277 |     const count = C.getValue(TRANSFER_BUFFER, 'i32');\n  278 |     const buffer = C.getValue(TRANSFER_BUFFER + SIZE_OF_INT, 'i32');\n  279 |     const result = new Array<Range>(count);\n  280 | \n  281 |     if (count > 0) {\n  282 |       let address = buffer;\n  283 |       for (let i = 0; i < count; i++) {\n  284 |         result[i] = unmarshalRange(address);\n  285 |         address += SIZE_OF_RANGE;\n  286 |       }\n  287 |       C._free(buffer);\n  288 |     }\n  289 | \n  290 |     return result;\n  291 |   }","lines":18,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/src/parser.ts#L274-L291"},{"ref":"lib/binding_web/src/tree.ts:136-152","code":"  136 |   /** Get the included ranges that were used to parse the syntax tree. */\n  137 |   getIncludedRanges(): Range[] {\n  138 |     C._ts_tree_included_ranges_wasm(this[0]);\n  139 |     const count = C.getValue(TRANSFER_BUFFER, 'i32');\n  140 |     const buffer = C.getValue(TRANSFER_BUFFER + SIZE_OF_INT, 'i32');\n  141 |     const result = new Array<Range>(count);\n  142 | \n  143 |     if (count > 0) {\n  144 |       let address = buffer;\n  145 |       for (let i = 0; i < count; i++) {\n  146 |         result[i] = unmarshalRange(address);\n  147 |         address += SIZE_OF_RANGE;\n  148 |       }\n  149 |       C._free(buffer);\n  150 |     }\n  151 |     return result;\n  152 |   }","lines":17,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/src/tree.ts#L136-L152"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`ts_wasm_store_new` allocates `const_i32_type` (a `wasm_globaltype_t *`, via `wasm_globaltype_new`) and, inside the `*self = (TSWasmStore) {...}` initializer, `self->stdlib_fn_indices` (via `ts_calloc`). Both are stored on `self` at lines 855-867. Every failure that happens afterwards (e.g. the 'unexpected import in Wasm stdlib' error, the stdlib instantiate/trap errors, the 'missing malloc reset function' error, the 'missing exported symbol' error, or the table-grow failure) jumps to the shared `error:` label, which only does `ts_free(self)` - it never calls `wasm_globaltype_delete(self->const_i32_type)` nor `ts_free(self->stdlib_fn_indices)`. Both allocations are therefore leaked on any of these initialization-failure paths (reachable whenever the bundled WASM stdlib fails to instantiate, or wasmtime memory/table/global allocation fails, e.g. under memory pressure).","fix":"Free the two allocations in the `error:` label before `ts_free(self)`, guarding on non-NULL, e.g.:\n```c\nerror:\n  if (self->const_i32_type) wasm_globaltype_delete(self->const_i32_type);\n  ts_free(self->stdlib_fn_indices);\n  ts_free(self);\n  ...\n```\n(Since `self` was `ts_calloc`'d, these fields are NULL until the struct-literal assignment runs, so the guarded frees are safe even for earlier failure paths.)","locations":[{"ref":"lib/src/wasm_store.c:846-867","code":"  846 |   wasm_globaltype_t *const_i32_type = wasm_globaltype_new(wasm_valtype_new_i32(), WASM_CONST);\n  847 |   wasm_globaltype_t *var_i32_type = wasm_globaltype_new(wasm_valtype_new_i32(), WASM_VAR);\n  848 | \n  849 |   wasmtime_val_t stack_pointer_value = WASM_I32_VAL(0);\n  850 |   wasmtime_global_t stack_pointer_global;\n  851 |   error = wasmtime_global_new(context, var_i32_type, &stack_pointer_value, &stack_pointer_global);\n  852 |   wasm_globaltype_delete(var_i32_type);\n  853 |   ts_assert(!error);\n  854 | \n  855 |   *self = (TSWasmStore) {\n  856 |     .engine = wasmtime_engine_clone(engine),\n  857 |     .store = store,\n  858 |     .memory = memory,\n  859 |     .function_table = function_table,\n  860 |     .language_instances = array_new(),\n  861 |     .stdlib_fn_indices = ts_calloc(stdlib_symbols_len, sizeof(wasmtime_func_t)),\n  862 |     .builtin_fn_indices = builtin_fn_indices,\n  863 |     .stack_pointer_global = stack_pointer_global,\n  864 |     .current_memory_offset = 0,\n  865 |
