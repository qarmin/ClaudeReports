n traps while iterating exports (line 1194-1203), `goto error` is taken before line 1212, leaking `export_types` too. Both leaks are reachable from the public `ts_wasm_store_load_language`/`ts_wasm_store_add_language` entry points whenever a scanner module has a bad import or a failing initializer, i.e. from ordinary malformed or malicious external-scanner WASM input, and repeated failures (e.g. in a loop trying to load many bad modules) would leak proportionally.","fix":"Delete both vectors in the shared `error:` label (guarded, since they may not be populated yet on very early failures):\n```c\nerror:\n  if (language_function_name) ts_free(language_function_name);\n  if (message.size) wasm_byte_vec_delete(&message);\n  if (error) wasmtime_error_delete(error);\n  if (trap) wasm_trap_delete(trap);\n  if (imports) ts_free(imports);\n  wasm_importtype_vec_delete(&import_types);\n  wasm_exporttype_vec_delete(&export_types);\n  return false;\n```\n(`WASM_EMPTY_VEC`-initialized vectors are safe to delete even if never populated; alternatively track a bool/size check like the other cleanups in this file.)","locations":[{"ref":"lib/src/wasm_store.c:1116-1153","code":" 1116 |   wasm_importtype_vec_t import_types = WASM_EMPTY_VEC;\n 1117 |   wasmtime_module_imports(module, &import_types);\n 1118 |   imports = ts_calloc(import_types.size, sizeof(wasmtime_extern_t));\n 1119 | \n 1120 |   for (unsigned i = 0; i < import_types.size; i++) {\n 1121 |     const wasm_importtype_t *import_type = import_types.data[i];\n 1122 |     const wasm_name_t *import_name = wasm_importtype_name(import_type);\n 1123 |     if (import_name->size == 0) {\n 1124 |       format(error_message, \"empty import name\");\n 1125 |       goto error;\n 1126 |     }\n 1127 | \n 1128 |     if (ts_wasm_store__provide_builtin_import(self, import_name, &imports[i])) {\n 1129 |       continue;\n 1130 |     }\n 1131 | \n 1132 |     bool defined_in_stdlib = false;\n 1133 |     for (unsigned j = 0; j < array_len(STDLIB_SYMBOLS); j++) {\n 1134 |       if (name_eq(import_name, STDLIB_SYMBOLS[j])) {\n 1135 |         imports[i] = (wasmtime_extern_t) {.kind = WASMTIME_EXTERN_FUNC, .of.func = self->stdlib_fn_indices[j]};\n 1136 |         defined_in_stdlib = true;\n 1137 |         break;\n 1138 |       }\n 1139 |     }\n 1140 | \n 1141 |     if (!defined_in_stdlib) {\n 1142 |       format(\n 1143 |         error_message,\n 1144 |         \"invalid import '%.*s'\\n\",\n 1145 |         (int)import_name->size, import_name->data\n 1146 |       );\n 1147 |       goto error;\n 1148 |     }\n 1149 |   }\n 1150 | \n 1151 |   wasmtime_instance_t instance;\n 1152 |   error = wasmtime_instance_new(context, module, imports, import_types.size, &instance, &trap);\n 1153 |   wasm_importtype_vec_delete(&import_types);","lines":38,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1116-L1153"},{"ref":"lib/src/wasm_store.c:1181-1212","code":" 1181 |   wasm_exporttype_vec_t export_types = WASM_EMPTY_VEC;\n 1182 |   wasmtime_module_exports(module, &export_types);\n 1183 |   for (unsigned i = 0; i < export_types.size; i++) {\n 1184 |     wasm_exporttype_t *export_type = export_types.data[i];\n 1185 |     const wasm_name_t *name = wasm_exporttype_name(export_type);\n 1186 | \n 1187 |     size_t name_len;\n 1188 |     char *export_name;\n 1189 |     wasmtime_extern_t export = {.kind = WASM_EXTERN_GLOBAL};\n 1190 |     bool exists = wasmtime_instance_export_nth(context, &instance, i, &export_name, &name_len, &export);\n 1191 |     ts_assert(exists);\n 1192 | \n 1193 |     // If the module exports an initialization or data-relocation function, call it.\n 1194 |     if (ts_wasm_store__call_module_initializer(self, name, &export, &trap)) {\n 1195 |       if (trap) {\n 1196 |         wasm_trap_message(trap, &message);\n 1197 |         format(\n 1198 |           error_message,\n 1199 |           \"trap when calling data relocation function: %.*s\\n\",\n 1200 |           (int)message.size, message.data\n 1201 |         );\n 1202 |         goto error;\n 1203 |       }\n 1204 |     }\n 1205 | \n 1206 |     // Find the main language function for the module.\n 1207 |     else if (name_eq(name, language_function_name)) {\n 1208 |       language_extern = export;\n 1209 |       found_language = true;\n 1210 |     }\n 1211 |   }\n 1212 |   wasm_exporttype_vec_delete(&export_types);","lines":32,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1181-L1212"},{"ref":"lib/src/wasm_store.c:1252-1258","code":" 1252 | error:\n 1253 |   if (language_function_name) ts_free(language_function_name);\n 1254 |   if (message.size) wasm_byte_vec_delete(&message);\n 1255 |   if (error) wasmtime_error_delete(error);\n 1256 |   if (trap) wasm_trap_delete(trap);\n 1257 |   if (imports) ts_free(imports);\n 1258 |   return false;","lines":7,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1252-L1258"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `Parser.parse` (`lib/binding_web/src/parser.ts`), when `options.includedRanges` is an explicit empty array (`[]`, which is truthy), `rangeCount` is set to `0` and `rangeAddress = C._calloc(rangeCount, SIZE_OF_RANGE)` still allocates a heap buffer (calloc with a 0 count still returns a valid pointer that must be freed). This `rangeAddress` is passed to `C._ts_parser_parse_wasm`, whose C implementation (`ts_parser_parse_wasm` in `lib/binding_web/lib/tree-sitter.c`) only calls `free(ranges)` inside the `if (range_count)` branch; when `range_count` is `0` it takes the `else` branch (`ts_parser_set_included_ranges(self, NULL, 0)`) and never frees the buffer that was allocated on the JS side. Every call to `parse(text, oldTree, { includedRanges: [] })` therefore leaks a small Wasm heap allocation.","fix":"Only allocate `rangeAddress` when there is at least one range to marshal, e.g.:\n```ts\nlet rangeCount = 0;\nlet rangeAddress = 0;\nif (options?.includedRanges && options.includedRanges.length > 0) {\n  rangeCount = options.includedRanges.length;\n  rangeAddress = C._calloc(rangeCount, SIZE_OF_RANGE);\n  ...\n}\n```","locations":[{"ref":"lib/binding_web/src/parser.ts:223-233","code":"  223 |     let rangeCount = 0;\n  224 |     let rangeAddress = 0;\n  225 |     if (options?.includedRanges) {\n  226 |       rangeCount = options.includedRanges.length;\n  227 |       rangeAddress = C._calloc(rangeCount, SIZE_OF_RANGE);\n  228 |       let address = rangeAddress;\n  229 |       for (let i = 0; i < rangeCount; i++) {\n  230 |         marshalRange(address, options.includedRanges[i]);\n  231 |         address += SIZE_OF_RANGE;\n  232 |       }\n  233 |     }","lines":11,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/src/parser.ts#L223-L233"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"easy","description":"The hand-written `strncpy` in `stdio.c` writes one byte past the caller-specified `n`-byte destination whenever `src` is longer than `n`. The loop `while (n-- && (*d++ = *s++));` decrements `n` one extra time when it hits the `n`-th byte without copying a `\\0` (wrapping `n` to `SIZE_MAX`), and the following `if (n == (size_t)-1) *d = '\\0';` then fires and writes `dest[n]`, i.e. one byte beyond the `n`-byte contract of `strncpy` (real `strncpy` never null-terminates when truncating). Confirmed with a standalone repro: calling this exact loop with `dest` sized exactly 3 bytes and `src = \"abcdef\"`, `n = 3` clobbers the byte immediately following the 3-byte buffer. Since this `strncpy` is the libc implementation linked into every compiled external-scanner wasm module, any grammar scanner C code that calls `strncpy(buf, src, n)` with a tightly-sized `buf` and a longer `src` (the single most common `strncpy` usage pattern) overflows the destination by one byte.","fix":"Only write the extra terminator when copying stopped because of an embedded `\\0` in `src`, not because `n` was exhausted. For example, track whether the loop consumed all of `n` versus hit a null terminator explicitly, e.g.:\n```c\nchar *strncpy(char *dest, const char *src, size_t n) {\n  size_t i = 0;\n  for (; i < n && src[i] != '\\0'; i++) dest[i] = src[i];\n  for (; i < n; i++) dest[i] = '\\0';\n  return dest;\n}\n```\nThis matches real `strncpy` semantics (pads with `\\0` only up to `n`, never writes past `dest[n-1]`).","locations":[{"ref":"crates/language/wasm/src/stdio.c:109-115","code":"  109 | char *strncpy(char *dest, const char *src, size_t n) {\n  110 |   char *d = dest;\n  111 |   const char *s = src;\n  112 |   while (n-- && (*d++ = *s++));\n  113 |   if (n == (size_t)-1) *d = '\\0';\n  114 |   return dest;\n  115 | }","lines":7,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/language/wasm/src/stdio.c#L109-L115"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"easy","description":"In `vsnprintf_impl`'s `%s` handler, `precision` is parsed directly from the format string with no upper bound (see `parse_format_spec`), and is then used as the length argument to `strncpy(temp_buf, str, precision)` followed by `temp_buf[precision] = '\\0';`, where `temp_buf` is a fixed 64-byte stack array (`char temp_buf[64];`). Any format string such as `\"%.100s\"` combined with a source string at least that long overflows `temp_buf` by writing past its 64-byte bound, corrupting adjacent stack memory inside the compiled external-scanner wasm module. This libc shim is linked into every user-supplied external scanner compiled to wasm, so any grammar author's scanner code that calls `snprintf`/`vsnprintf` with an over-long precision specifier triggers a real stack buffer overflow.","fix":"Clamp `precision` (and the resulting write index) to `sizeof(temp_buf) - 1` before calling `strncpy`/writing the terminator, e.g.:\n```c\nint copy_len = precision;\nif (copy_len > (int)sizeof(temp_buf) - 1) copy_len = sizeof(temp_buf) - 1;\nstrncpy(temp_buf, str, copy_len);\ntemp_buf[copy_len] = '\\0';\n```","locations":[{"ref":"crates/language/wasm/src/stdio.c:174-191","code":"  174 |       char temp_buf[64];\n  175 |       const char *output_str = temp_buf;\n  176 | \n  177 |       switch (*p) {\n  178 |         case 's': {\n  179 |           const char *str = va_arg(args, const char*);\n  180 |           if (!str) str = \"(null)\";\n  181 | \n  182 |           int str_len = strlen(str);\n  183 |           if (precision >= 0 && str_len > precision) {\n  184 |             strncpy(temp_buf, str, precision);\n  185 |             temp_buf[precision] = '\\0';\n  186 |             output_str = temp_buf;\n  187 |           } else {\n  188 |             output_str = str;\n  189 |           }\n  190 |           break;\n  191 |         }","lines":18,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/language/wasm/src/stdio.c#L174-L191"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"medium","description":"When constructing the native `TSLanguage` from a compiled WASM language module, several buffer sizes for `copy()`/`copy_strings()` are computed by multiplying or adding two independent `uint32_t` fields (`large_state_count`, `symbol_count`, `alias_count`) that are read verbatim out of untrusted WASM linear memory (the `LanguageInWasmMemory` struct, `wasm_language`), *before* the result is widened by `sizeof(...)`. Because both operands are `uint32_t`, the sub-expression `wasm_language.large_state_count * wasm_language.symbol_count` (and likewise `wasm_language.symbol_count + wasm_language.alias_count`) is evaluated in 32-bit unsigned arithmetic and silently wraps around on overflow, only afterwards being multiplied by the (64-bit) `sizeof(...)`. A malicious language module can pick `large_state_count`/`symbol_count`/`alias_count` such that the true product/sum is huge but wraps to a tiny value; `copy()`/`copy_strings()` will then allocate and fill an undersized host buffer for `parse_table`, `symbol_metadata`, `public_symbol_map`, or `symbol_names`, while the rest of the `TSLanguage` (using the real, non-wrapped `symbol_count`/`state_count` fields) will later index into that undersized buffer during ordinary parsing, causing a host heap out-of-bounds read.","fix":"Promote to `size_t`/`uint64_t` before multiplying/adding, and reject sizes that don't fit, e.g.:\n```c\nsize_t parse_table_size = (size_t)wasm_language.large_state_count * (size_t)wasm_language.symbol_count * sizeof(uint16_t);\n...\nsize_t symbol_total = (size_t)wasm_language.symbol_count + (size_t)wasm_language.alias_count;\n```\nand pass `parse_table_size`/`symbol_total * sizeof(...)` to `copy()`/`copy_strings()` instead of the raw 32-bit expressions.","locations":[{"ref":"lib/src/wasm_store.c:1380-1385","code":" 1380 |     .parse_table = copy(\n 1381 |       &wasm_memory,\n 1382 |       wasm_language.parse_table,\n 1383 |       wasm_language.large_state_count * wasm_language.symbol_count * sizeof(uint16_t),\n 1384 |       &valid_wasm_memory\n 1385 |     ),","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1380-L1385"},{"ref":"lib/src/wasm_store.c:1393-1399","code":" 1393 |     .symbol_names = copy_strings(\n 1394 |       &wasm_memory,\n 1395 |       wasm_language.symbol_names,\n 1396 |       wasm_language.symbol_count + wasm_language.alias_count,\n 1397 |       &symbol_name_buffer,\n 1398 |       &valid_wasm_memory\n 1399 |     ),","lines":7,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1393-L1399"},{"ref":"lib/src/wasm_store.c:1400-1405","code":" 1400 |     .symbol_metadata = copy(\n 1401 |       &wasm_memory,\n 1402 |       wasm_language.symbol_metadata,\n 1403 |       (wasm_language.symbol_count + wasm_language.alias_count) * sizeof(TSSymbolMetadata),\n 1404 |       &valid_wasm_memory\n 1405 |     ),","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1400-L1405"},{"ref":"lib/src/wasm_store.c:1406-1411","code":" 1406 |     .public_symbol_map = copy(\n 1407 |       &wasm_memory,\n 1408 |       wasm_language.public_symbol_map,\n 1409 |       (wasm_language.symbol_count + wasm_language.alias_count) * sizeof(TSSymbol),\n 1410 |       &valid_wasm_memory\n 1411 |     ),","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1406-L1411"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In `ts_tree_cursor_child_iterator_previous`, the \"no more children\" sentinel check truncates `self->child_index` (a `uint32_t`) down to 8 bits before comparing it to `-1`: `(int8_t)self->child_index == -1`. This is meant to detect the underflow that happens after stepping past child index `0` (where `self->child_index` wraps to `UINT32_MAX`), but the cast only inspects the low byte. Any legitimate, non-underflowed index that is congruent to `255` mod `256` (i.e. `255`, `511`, `767`, ...) also satisfies `(int8_t)x == -1`, since `(int8_t)255 == -1`. Any node with 256 or more children (a long statement list, a large array/object literal, etc.) will therefore have its backward sibling iteration stop prematurely at those indices, silently skipping the remaining earlier siblings. This is reachable directly from the public `ts_tree_cursor_goto_previous_sibling` API.","fix":"Compare the full 32-bit value instead of truncating to `int8_t`:\n```c\n// before\nif (!self->parent.ptr || (int8_t)self->child_index == -1) return false;\n\n// after\nif (!self->parent.ptr || self->child_index == UINT32_MAX) return false;\n```","locations":[{"ref":"lib/src/tree_cursor.c:127","code":"  127 |   if (!self->parent.ptr || (int8_t)self->child_index == -1) return false;","lines":1,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/tree_cursor.c#L127"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `ts_wasm_store__instantiate`, `needed_memory_size` is computed as `ts_wasm_store__heap_address(self) + dylink_info->memory_size`, both `uint32_t`. `dylink_info->memory_size` comes straight from the attacker-controlled `dylink.0` custom section of the WASM module being loaded (via `wasm_dylink_info__parse`) and is never validated against any sane upper bound. If `memory_size` is close to `UINT32_MAX`, the addition wraps around to a small value, so the `needed_memory_size > current_memory_size` check below can spuriously evaluate false and skip growing the WASM linear memory - even though `self->current_memory_offset` is unconditionally advanced by the full (unwrapped) `dylink_info->memory_size` a few lines later (`self->current_memory_offset += dylink_info->memory_size;`). This desynchronizes the store's bookkeeping of 'where the next module's memory region starts' from the actual size of the underlying WASM linear memory, so a subsequently loaded/instantiated module can be placed at an address range that was never actually grown into, corrupting the sandboxed heap layout (one module's statics can overlap another's, or a module's linked address range can fall outside the real backing buffer).","fix":"Do the size arithmetic in a 64-bit type and reject implausible sizes before using them, e.g.:\n```c\nuint64_t needed_memory_size = (uint64_t)ts_wasm_store__heap_address(self) + dylink_info->memory_size;\nif (needed_memory_size > (uint64_t)MAX_MEMORY_SIZE * MEMORY_PAGE_SIZE) {\n  format(error_message, \"invalid memory size %u\", dylink_info->memory_size);\n  goto error;\n}\n```\nand use the checked 64-bit value for the subsequent `pages_to_grow` computation.","locations":[{"ref":"lib/src/wasm_store.c:1097-1110","code":" 1097 |   // Grow the memory to make room for the new data.\n 1098 |   uint32_t needed_memory_size = ts_wasm_store__heap_address(self) + dylink_info->memory_size;\n 1099 |   uint32_t current_memory_size = wasmtime_memory_data_size(context, &self->memory);\n 1100 |   if (needed_memory_size > current_memory_size) {\n 1101 |     uint32_t pages_to_grow = (\n 1102 |       needed_memory_size - current_memory_size + MEMORY_PAGE_SIZE - 1) /\n 1103 |       MEMORY_PAGE_SIZE;\n 1104 |     uint64_t prev_memory_size;\n 1105 |     error = wasmtime_memory_grow(context, &self->memory, pages_to_grow, &prev_memory_size);\n 1106 |     if (error) {\n 1107 |       format(error_message, \"invalid memory size %u\", dylink_info->memory_size);\n 1108 |       goto error;\n 1109 |     }\n 1110 |   }","lines":14,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1097-L1110"},{"ref":"lib/src/wasm_store.c:1175-1176","code":" 1175 |   self->current_memory_offset += dylink_info->memory_size;\n 1176 |   self->current_function_table_offset += dylink_info->table_size;","lines":2,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1175-L1176"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`reserved_word_count` is computed as `(max_reserved_word_set_id + 1) * language->max_reserved_word_set_size`. Both `max_reserved_word_set_id` and `max_reserved_word_set_size` are `uint16_t`, which C promotes to plain `int` for the multiplication; their product can reach roughly `65536 * 65535 ≈ 4.29e9`, which exceeds `INT_MAX` (about 2.15e9). This is a signed integer overflow, which is undefined behavior in C (not merely a wraparound), triggered by attacker-controlled fields (`max_reserved_word_set_id` is derived from `lex_modes`/`reserved_word_set_id` values copied straight out of the WASM module, and `max_reserved_word_set_size` is read directly from the language struct in WASM memory). The resulting `reserved_word_count` then feeds directly into the size passed to `copy()` for `language->reserved_words`, so the UB can also manifest as an undersized allocation that is later indexed using the real (non-overflowed) `max_reserved_word_set_id`/`max_reserved_word_set_size`.","fix":"Compute the product in an unsigned 32-bit (or wider) type to avoid signed overflow, e.g.:\n```c\nuint32_t reserved_word_count =\n  ((uint32_t)max_reserved_word_set_id + 1) * (uint32_t)language->max_reserved_word_set_size;\n```\nand consider also checking this against a sane upper bound before calling `copy()`.","locations":[{"ref":"lib/src/wasm_store.c:1570-1578","code":" 1570 |     if (max_reserved_word_set_id > 0 && language->max_reserved_word_set_size > 0) {\n 1571 |       uint32_t reserved_word_count =\n 1572 |         (max_reserved_word_set_id + 1) * language->max_reserved_word_set_size;\n 1573 |       language->reserved_words = copy(\n 1574 |           &wasm_memory,\n 1575 |           wasm_language.reserved_words,\n 1576 |           reserved_word_count * sizeof(TSSymbol),\n 1577 |           &valid_wasm_memory\n 1578 |       );","lines":9,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1570-L1578"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`read_uleb128` accumulates `shift` by 7 on every continuation byte with no upper bound, then computes `(uint64_t)(**p & 0x7f) << shift`. Since the loop only stops when it hits a byte with the high bit clear or reaches `end`, a crafted `dylink.0` custom section (fully attacker-controlled, since it comes straight from the WASM module bytes passed to `ts_wasm_store_load_language`) can supply an overlong ULEB128 encoding with many continuation bytes, driving `shift` past 63. Shifting a 64-bit value by an amount >= 64 is undefined behavior in C. This is used to parse `section_length`, subsection sizes, and the `memory_size`/`memory_align`/`table_size`/`table_align` fields that later feed directly into the memory/table growth arithmetic in `ts_wasm_store__instantiate`.","fix":"Bound the shift and reject overlong/overflowing encodings:\n```c\nstatic inline uint64_t read_uleb128(const uint8_t **p, const uint8_t *end) {\n  uint64_t value = 0;\n  unsigned shift = 0;\n  do {\n    if (*p == end) return UINT64_MAX;\n    if (shift >= 64) return UINT64_MAX;\n    value += (uint64_t)(**p & 0x7f) << shift;\n    shift += 7;\n  } while (*((*p)++) >= 128);\n  return value;\n}\n```","locations":[{"ref":"lib/src/wasm_store.c:190-199","code":"  190 | static inline uint64_t read_uleb128(const uint8_t **p, const uint8_t *end) {\n  191 |   uint64_t value = 0;\n  192 |   unsigned shift = 0;\n  193 |   do {\n  194 |     if (*p == end)  return UINT64_MAX;\n  195 |     value += (uint64_t)(**p & 0x7f) << shift;\n  196 |     shift += 7;\n  197 |   } while (*((*p)++) >= 128);\n  198 |   return value;\n  199 | }","lines":10,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L190-L199"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`offset_for_position` (used to translate a `--edit \"ROW,COL LEN TEXT\"` CLI edit position into a byte offset via `parse_edit_flag`) is off by one for any edit targeting row `0`. The loop always calls `iter.next()` once per iteration as the left operand of the let-chain `if let Some(pos) = iter.next() && row < position.row`, and after the loop it unconditionally does `offset += 1`, intending to skip past the newline byte that was just consumed. But when `position.row == 0`, no newline was ever consumed to set `offset`, yet the `offset += 1` still executes, so the returned offset is 1 byte too high. Verified by extracting the function logic and running it standalone: for input `b\"abc\\ndef\"`, `(row: 0, column: 0)` returns `Ok(1)` instead of the correct `Ok(0)`, `(row: 0, column: 3)` returns `Ok(4)` instead of `Ok(3)`; row `1` onward is unaffected. This means `tree-sitter parse file --edit \"0,N M text\"` (the common case of editing the first line) silently applies the edit one byte too far right, corrupting the edited tree/text for exactly the case most users hit first.","fix":"Only advance `offset` when a newline was actually consumed, and set it to `pos + 1` (start of the next row) instead of `pos`, removing the always-on `offset += 1`:\n```rust\npub fn offset_for_position(input: &[u8], position: Point) -> Result<usize> {\n    let mut row = 0;\n    let mut offset = 0;\n    let mut iter = memchr::memchr_iter(b'\\n', input);\n    while row < position.row {\n        match iter.next() {\n            Some(pos) => {\n                row += 1;\n                offset = pos + 1;\n            }\n            None => break,\n        }\n    }\n    if position.row - row > 0 {\n        return Err(anyhow!(\"Failed to address a row: {}\", position.row));\n    }\n    if let Some(pos) = iter.next() {\n        if (pos - offset < position.column) || (input[offset] == b'\\n' && position.column > 0) {\n            return Err(anyhow!(\"Failed to address a column: {}\", position.column));\n        }\n    } else if input.len() - offset < position.column {\n        return Err(anyhow!(\"Failed to address a column over the end\"));\n    }\n    Ok(offset + position.column)\n}\n```\nThis was confirmed to produce the correct offsets for every case previously tested (both row 0 and later rows, with and without trailing newlines).","locations":[{"ref":"crates/cli/src/parse.rs:1138-1164","code":" 1138 | pub fn offset_for_position(input: &[u8], position: Point) -> Result<usize> {\n 1139 |     let mut row = 0;\n 1140 |     let mut offset = 0;\n 1141 |     let mut iter = memchr::memchr_iter(b'\\n', input);\n 1142 |     loop {\n 1143 |         if let Some(pos) = iter.next()\n 1144 |             && row < position.row\n 1145 |         {\n 1146 |             row += 1;\n 1147 |             offset = pos;\n 1148 |             continue;\n 1149 |         }\n 1150 |         offset += 1;\n 1151 |         break;\n 1152 |     }\n 1153 |     if position.row - row > 0 {\n 1154 |         return Err(anyhow!(\"Failed to address a row: {}\", position.row));\n 1155 |     }\n 1156 |     if let Some(pos) = iter.next() {\n 1157 |         if (pos - offset < position.column) || (input[offset] == b'\\n' && position.column > 0) {\n 1158 |             return Err(anyhow!(\"Failed to address a column: {}\", position.column));\n 1159 |         }\n 1160 |     } else if input.len() - offset < position.column {\n 1161 |         return Err(anyhow!(\"Failed to address a column over the end\"));\n 1162 |     }\n 1163 |     Ok(offset + position.column)\n 1164 | }","lines":27,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/parse.rs#L1138-L1164"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `vsnprintf_impl`'s main loop, when the format string ends in a lone trailing `%` (e.g. `\"abc%\"`), `p` is advanced past the `%` to the string's NUL terminator (`p++` at the top of the `if (*p == '%')` branch), none of the `switch (*p)` cases match `'\\0'` so the `default:` branch runs, and then execution falls through to the unconditional `p++;` at the bottom of the `while (*p)` loop. This advances `p` one byte past the NUL terminator, and the outer `while (*p)` then reads memory beyond the format string's buffer -- an out-of-bounds read that continues scanning arbitrary adjacent memory as if it were more format-string bytes until it happens to hit a zero byte.","fix":"Break out of the loop (or return) when `*p == '\\0'` is reached right after consuming the `%`, before falling into the common `p++` at the bottom of the loop, e.g. check `if (*p == '\\0') break;` immediately after `p = parse_format_spec(...)` and before the `switch`.","locations":[{"ref":"crates/language/wasm/src/stdio.c:160-255","code":"  160 |   while (*p) {\n  161 |     if (*p == '%') {\n  162 |       p++;\n  163 |       if (*p == '%') {\n  164 |         if (pos < buffsz - 1) buffer[pos++] = '%';\n  165 |         total_chars++;\n  166 |         p++;\n  167 |         continue;\n  168 |       }\n  169 | \n  170 |       int width, precision;\n  171 |       format_flags_t flags;\n  172 |       p = parse_format_spec(p, &width, &precision, &flags);\n  173 | \n  174 |       char temp_buf[64];\n  175 |       const char *output_str = temp_buf;\n  176 | \n  177 |       switch (*p) {\n  178 |         case 's': {\n  179 |           const char *str = va_arg(args, const char*);\n  180 |           if (!str) str = \"(null)\";\n  181 | \n  182 |           int str_len = strlen(str);\n  183 |           if (precision >= 0 && str_len > precision) {\n  184 |             strncpy(temp_buf, str, precision);\n  185 |             temp_buf[precision] = '\\0';\n  186 |             output_str = temp_buf;\n  187 |           } else {\n  188 |             output_str = str;\n  189 |           }\n  190 |           break;\n  191 |         }\n  192 |         case 'd':\n  193 |         case 'i': {\n  194 |           int value = va_arg(args, int);\n  195 |           int_to_str(value, temp_buf, 10, true, false);\n  196 |           break;\n  197 |         }\n  198 |         case 'u': {\n  199 |           unsigned int value = va_arg(args, unsigned int);\n  200 |           int_to_str(value, temp_buf, 10, false, false);\n  201 |           break;\n  202 |         }\n  203 |         case 'x': {\n  204 |           unsigned int value = va_arg(args, unsigned int);\n  205 |           int_to_str(value, temp_buf, 16, false, false);\n  206 |           break;\n  207 |         }\n  208 |         case 'X': {\n  209 |           unsigned int value = va_arg(args, unsigned int);\n  210 |           int_to_str(value, temp_buf, 16, false, true);\n  211 |           break;\n  212 |         }\n  213 |         case 'p': {\n  214 |           void *ptr = va_arg(args, void*);\n  215 |           ptr_to_str(ptr, temp_buf);\n  216 |           break;\n  217 |         }\n  218 |         case 'c': {\n  219 |           int c = va_arg(args, int);\n  220 |           temp_buf[0] = (char)c;\n  221 |           temp_buf[1] = '\\0';\n  222 |           break;\n  223 |         }\n  224 |         case 'z': {\n  225 |           if (*(p + 1) == 'u') {\n  226 |             size_t value = va_arg(args, size_t);\n  227 |             int_to_str(value, temp_buf, 10, false, false);\n  228 |             p++;\n  229 |           } else {\n  230 |             temp_buf[0] = 'z';\n  231 |             temp_buf[1] = '\\0';\n  232 |           }\n  233 |           break;\n  234 |         }\n  235 |         default:\n  236 |           temp_buf[0] = '%';\n  237 |           temp_buf[1] = *p;\n  238 |           temp_buf[2] = '\\0';\n  239 |           break;\n  240 |       }\n  241 | \n  242 |       int str_len = strlen(output_str);\n  243 |       int formatted_len = (width > str_len) ? width : str_len;\n  244 |       total_chars += formatted_len;\n  245 | \n  246 |       if (pos < buffsz - 1) {\n  247 |         write_formatted_to_buffer(buffer, buffsz, &pos, output_str, width, &flags);\n  248 |       }\n  249 | \n  250 |     } else {\n  251 |       if (pos < buffsz - 1) buffer[pos++] = *p;\n  252 |       total_chars++;\n  253 |     }\n  254 |     p++;\n  255 |   }","lines":96,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/language/wasm/src/stdio.c#L160-L255"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `ts_query_matches_wasm`, the code explicitly special-cases a `match_limit` of `0` to mean \"unlimited\" by translating it to `UINT32_MAX` via `ts_query_cursor_set_match_limit(scratch_query_cursor, UINT32_MAX)`. A few lines later, however, `ts_query_cursor_set_match_limit(scratch_query_cursor, match_limit)` is called again with the original, untranslated `match_limit` value, silently overwriting the special-case result. Since `ts_query_cursor_set_match_limit` sets `capture_list_pool.max_capture_list_count = limit` directly (see `lib/src/query.c`), passing the raw `0` back in means the cursor ends up with `max_capture_list_count == 0`, so `ts_query_cursor_next_match` can never produce a match. Any web-binding caller who passes `matchLimit: 0` intending \"no limit\" instead silently gets zero query matches back, with no error indication.","fix":"Remove the redundant second call (or guard it the same way as the first), e.g.:\n```c\n  ts_query_cursor_set_containing_byte_range(\n    scratch_query_cursor,\n    start_containing_index,\n    end_containing_index\n  );\n  ts_query_cursor_set_max_start_depth(scratch_query_cursor, max_start_depth);\n```\n(i.e. delete the line `ts_query_cursor_set_match_limit(scratch_query_cursor, match_limit);` that immediately precedes `ts_query_cursor_set_max_start_depth`).","locations":[{"ref":"lib/binding_web/lib/tree-sitter.c:886-913","code":"  886 |   if (!scratch_query_cursor) {\n  887 |     scratch_query_cursor = ts_query_cursor_new();\n  888 |   }\n  889 |   if (match_limit == 0) {\n  890 |     ts_query_cursor_set_match_limit(scratch_query_cursor, UINT32_MAX);\n  891 |   } else {\n  892 |     ts_query_cursor_set_match_limit(scratch_query_cursor, match_limit);\n  893 |   }\n  894 | \n  895 |   TSNode node = unmarshal_node(tree);\n  896 |   TSPoint start_point = {start_row, code_unit_to_byte(start_column)};\n  897 |   TSPoint end_point = {end_row, code_unit_to_byte(end_column)};\n  898 |   TSPoint start_containing_point = {start_containing_row, code_unit_to_byte(start_containing_column)};\n  899 |   TSPoint end_containing_point = {end_containing_row, code_unit_to_byte(end_containing_column)};\n  900 |   ts_query_cursor_set_point_range(scratch_query_cursor, start_point, end_point);\n  901 |   ts_query_cursor_set_byte_range(scratch_query_cursor, start_index, end_index);\n  902 |   ts_query_cursor_set_containing_point_range(\n  903 |     scratch_query_cursor,\n  904 |     start_containing_point,\n  905 |     end_containing_point\n  906 |   );\n  907 |   ts_query_cursor_set_containing_byte_range(\n  908 |     scratch_query_cursor,\n  909 |     start_containing_index,\n  910 |     end_containing_index\n  911 |   );\n  912 |   ts_query_cursor_set_match_limit(scratch_query_cursor, match_limit);\n  913 |   ts_query_cursor_set_max_start_depth(scratch_query_cursor, max_start_depth);","lines":28,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/lib/tree-sitter.c#L886-L913"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ts_tree_cursor_child_iterator_next` (used when walking forward) populates the produced `TreeCursorEntry.descendant_index` from `self->descendant_index` and then advances `self->descendant_index` by the visited child's contribution (`ts_subtree_visible_descendant_count` plus 1 if visible), so callers always get a correct running descendant index. `ts_tree_cursor_child_iterator_previous` (used when walking backward, i.e. by `ts_tree_cursor_goto_previous_sibling`) never does either of these things: its designated initializer for `result` at lines 129-134 omits the `.descendant_index`
