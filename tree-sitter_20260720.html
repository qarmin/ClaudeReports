(TreeCursorEntry) {\n   73 |     .subtree = child,\n   74 |     .position = self->position,\n   75 |     .child_index = self->child_index,\n   76 |     .structural_child_index = self->structural_child_index,\n   77 |     .descendant_index = self->descendant_index,\n   78 |   };\n   79 |   *visible = ts_subtree_visible(*child);\n   80 |   bool extra = ts_subtree_extra(*child);\n   81 |   if (!extra) {\n   82 |     if (self->alias_sequence) {\n   83 |       *visible |= self->alias_sequence[self->structural_child_index];\n   84 |     }\n   85 |     self->structural_child_index++;\n   86 |   }\n   87 | \n   88 |   self->descendant_index += ts_subtree_visible_descendant_count(*child);\n   89 |   if (*visible) {\n   90 |     self->descendant_index += 1;\n   91 |   }\n   92 | \n   93 |   self->position = length_add(self->position, ts_subtree_size(*child));\n   94 |   self->child_index++;\n   95 | \n   96 |   if (self->child_index < self->parent.ptr->child_count) {\n   97 |     Subtree next_child = ts_subtree_children(self->parent)[self->child_index];\n   98 |     self->position = length_add(self->position, ts_subtree_padding(next_child));\n   99 |   }\n  100 | \n  101 |   return true;\n  102 | }","lines":38,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/tree_cursor.c#L65-L102"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`update_gitignore` in `init.rs` reads `.gitignore`, mutates the local `contents` variable to append the Zig-related entries, logs `\"Adding zig entries to .gitignore\"`, and returns `Ok(())` — but it never calls `write_file` to persist the change. The bug is even flagged by a comment directly above the function (`// NOTE: this modifies contents but never calls write_file (pre-existing bug)`), yet it has never been fixed. This means `tree-sitter init --update` claims to update `.gitignore` but silently leaves the file unchanged.","fix":"Add a `write_file(path, contents)?;` call before returning, mirroring the sibling function `update_gitattributes` immediately below it:\n```rust\nfn update_gitignore(path: &Path) -> Result<()> {\n    let mut contents = fs::read_to_string(path)?;\n    if !contents.contains(\"Zig artifacts\") {\n        info!(\"Adding zig entries to .gitignore\");\n        contents.push('\\n');\n        contents.push_str(indoc! {\"\n        # Zig artifacts\n        .zig-cache/\n        zig-cache/\n        zig-out/\n        \"});\n        write_file(path, contents)?;\n    }\n    Ok(())\n}\n```","locations":[{"ref":"crates/cli/src/init.rs:879-893","code":"  879 | fn update_gitignore(path: &Path) -> Result<()> {\n  880 |     // NOTE: this modifies `contents` but never calls `write_file` (pre-existing bug)\n  881 |     let mut contents = fs::read_to_string(path)?;\n  882 |     if !contents.contains(\"Zig artifacts\") {\n  883 |         info!(\"Adding zig entries to .gitignore\");\n  884 |         contents.push('\\n');\n  885 |         contents.push_str(indoc! {\"\n  886 |         # Zig artifacts\n  887 |         .zig-cache/\n  888 |         zig-cache/\n  889 |         zig-out/\n  890 |         \"});\n  891 |     }\n  892 |     Ok(())\n  893 | }","lines":15,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/init.rs#L879-L893"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`get_input` in `input.rs` implements a `!path` negation feature (a path prefixed with `!` should remove a previously-added path from the result set), but it tests for the prefix with `path.starts_with(\"!\")` and strips it with `path.strip_prefix(\"!\").unwrap()`. `Path::starts_with`/`Path::strip_prefix` compare whole path *components*, not raw string prefixes, so for any realistic input like `!foo.js` (a single path component `\"!foo.js\"`) the check is always `false` — it only matches if `!` is its own path component (e.g. `!/foo.js`, which nobody would type). As a result, the exclusion feature is a complete no-op for real usage: the leading `!` is left in the path, `positive` stays `true`, and the literal (non-existent) file `!foo.js` is looked up instead of excluding `foo.js`. Verified empirically: `PathBuf::from(\"!foo.js\").starts_with(\"!\")` returns `false`.","fix":"Compare the string representation instead of the `Path` component representation, e.g.:\n```rust\nfor mut path in paths {\n    let mut positive = true;\n    if let Some(s) = path.to_str() && let Some(rest) = s.strip_prefix('!') {\n        positive = false;\n        path = PathBuf::from(rest);\n    }\n    ...\n}\n```","locations":[{"ref":"crates/cli/src/input.rs:80-98","code":"   80 |         for mut path in paths {\n   81 |             let mut positive = true;\n   82 |             if path.starts_with(\"!\") {\n   83 |                 positive = false;\n   84 |                 path = path.strip_prefix(\"!\").unwrap().to_path_buf();\n   85 |             }\n   86 | \n   87 |             if path.exists() {\n   88 |                 incorporate_path(path, positive);\n   89 |             } else {\n   90 |                 let Some(path_str) = path.to_str() else {\n   91 |                     bail!(\"Invalid path: {}\", path.display());\n   92 |                 };\n   93 |                 let paths = glob(path_str)\n   94 |                     .with_context(|| format!(\"Invalid glob pattern {}\", path.display()))?;\n   95 |                 for path in paths {\n   96 |                     incorporate_path(path?, positive);\n   97 |                 }\n   98 |             }","lines":19,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/input.rs#L80-L98"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`BitVec::resize` in `bitvec.rs` fails to set newly-added bits to `1` when the growth stays within the current last word. The function only fills bits when `new_words > old_words` (i.e. a brand-new word is allocated); when `new_len` grows past `num_bits` but the bit index still falls in the same 64-bit word (e.g. growing from 5 bits to 10 bits, both `div_ceil(64) == 1`), the `if new_words > old_words` branch at `bitvec.rs:199` is skipped entirely, so the bits between the old and new length are left at their previous value (`0`) instead of being set to `1` as `resize(new_len, true)` promises. This silently produces a `BitVec`/`TokenSet` whose contents do not match what the caller asked for. The bug is currently latent because the only call site in the crate (`rules.rs:401`, inside `TokenSet::insert`) always passes `val = false`, but `resize` is a `pub` method on a data structure that is otherwise treated as a general-purpose bitset, so any new caller (or future refactor) that resizes-and-fills with `true` will silently get wrong bits.","fix":"Handle the \"grow within the same word\" case explicitly instead of only handling the \"grow into new words\" case. For example:\n```rust\npub fn resize(&mut self, new_len: usize, val: bool) {\n    let old_len = self.num_bits as usize;\n    let new_words = new_len.div_ceil(64);\n    let old_words = self.words_in_use();\n    self.ensure_words(new_words);\n    let words = self.as_full_slice_mut();\n    if new_len > old_len {\n        if val {\n            // Set every bit in [old_len, new_len), which may all live in the\n            // same word as old_len (no new word allocated).\n            for i in old_len..new_len {\n                words[i / 64] |= 1u64 << (i % 64);\n            }\n        }\n        // When val == false the newly-covered bits are already zero, either\n        // because they were untouched or because the arena pre-zeroes memory.\n    } else if new_words < old_words {\n        words[new_words..old_words].fill(0);\n    }\n    self.num_bits = new_len as u32;\n}\n```\nThis keeps the invariant that bits `>= num_bits` are always zero while correctly filling bits that stay within the current last word.","locations":[{"ref":"crates/generate/src/bitvec.rs:193-213","code":"  193 |     pub fn resize(&mut self, new_len: usize, val: bool) {\n  194 |         let new_words = new_len.div_ceil(64);\n  195 |         let old_words = self.words_in_use();\n  196 |         self.ensure_words(new_words);\n  197 |         let fill = if val { !0u64 } else { 0u64 };\n  198 |         let words = self.as_full_slice_mut();\n  199 |         if new_words > old_words {\n  200 |             words[old_words..new_words].fill(fill);\n  201 |             // When setting bits to true, clear any bits in the last word that\n  202 |             // fall beyond new_len to preserve the invariant that bits >= num_bits\n  203 |             // are always zero.\n  204 |             if val && !new_len.is_multiple_of(64) {\n  205 |                 let mask = (1u64 << (new_len % 64)) - 1;\n  206 |                 words[new_words - 1] &= mask;\n  207 |             }\n  208 |         } else if new_words < old_words {\n  209 |             // Zero out truncated words so stale data is never visible.\n  210 |             words[new_words..old_words].fill(0);\n  211 |         }\n  212 |         self.num_bits = new_len as u32;\n  213 |     }","lines":21,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/bitvec.rs#L193-L213"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`resolve_module_path` in `quickjs.rs` implements `require()` resolution for the native QuickJS grammar runtime. For a bare (non-relative) `module_path`, it builds a `node_modules_target` as `Path::new(\"node_modules\").join(module_path)` - this is a path relative to the process's *current working directory*, not to `base_path` (the directory of the module that issued the `require()` call), and there is no walking up parent directories the way Node.js's module resolution algorithm does (checking `<dir>/node_modules`, then `<parent>/node_modules`, etc. up to the filesystem root). As a result, a grammar file that lives in a different directory than the process's CWD (e.g. `tree-sitter generate` invoked from a monorepo root, or a module nested a few directories below the grammar root doing `require('some-package')`) will fail to resolve dependencies that Node/Bun/Deno (the other supported `js_runtime` backends, which use real module resolution) would resolve correctly. This makes the `native` QuickJS runtime silently behave differently from the other supported runtimes for the same grammar sources.","fix":"When resolving a bare specifier, search for `node_modules` starting at `base_path` and walking up through each ancestor directory (matching Node's resolution algorithm) instead of only checking a single `node_modules` path relative to the process's current working directory, e.g.:\n```rust\nlet mut dir = Some(base_path.to_path_buf());\nwhile let Some(d) = dir {\n    let candidate = d.join(\"node_modules\").join(module_path);\n    // try candidate.with_extension(\"js\"), .with_extension(\"json\"), candidate itself\n    dir = d.parent().map(Path::to_path_buf);\n}\n```","locations":[{"ref":"crates/generate/src/quickjs.rs:171-204","code":"  171 | fn resolve_module_path(base_path: &Path, module_path: &str) -> rquickjs::Result<PathBuf> {\n  172 |     let candidates = if module_path.starts_with(\"./\") || module_path.starts_with(\"../\") {\n  173 |         let target = base_path.join(module_path);\n  174 |         vec![\n  175 |             target.with_extension(\"js\"),\n  176 |             target.with_extension(\"json\"),\n  177 |             target.clone(),\n  178 |         ]\n  179 |     } else {\n  180 |         let local_target = base_path.join(module_path);\n  181 |         let node_modules_target = Path::new(\"node_modules\").join(module_path);\n  182 | \n  183 |         vec![\n  184 |             local_target.with_extension(\"js\"),\n  185 |             local_target.with_extension(\"json\"),\n  186 |             local_target.clone(),\n  187 |             node_modules_target.with_extension(\"js\"),\n  188 |             node_modules_target.with_extension(\"json\"),\n  189 |             node_modules_target,\n  190 |         ]\n  191 |     };\n  192 | \n  193 |     for candidate in candidates {\n  194 |         if let Ok(resolved) = try_resolve_path(&candidate) {\n  195 |             return Ok(resolved);\n  196 |         }\n  197 |     }\n  198 | \n  199 |     Err(rquickjs::Error::new_from_js_message(\n  200 |         \"Error\",\n  201 |         \"ModuleNotFound\",\n  202 |         format!(\"Module not found: {module_path}\"),\n  203 |     ))\n  204 | }","lines":34,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/quickjs.rs#L171-L204"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`external_files` entries are stored already fully joined with `parser_path` (`let path = parser_path.join(path);` in `find_language_configurations_at_path`). Later, in `load_language_at_path_with_name`, they are joined a *second* time with `config.src_path`: `.map(|p| config.src_path.join(p))`. When `parser_path` is an absolute path, `Path::join` with an absolute `p` silently discards the `src_path` prefix (masking the bug); when `parser_path` is exactly `\".\"`, the extra `.` component is harmless (also masking the bug). But when `parser_path` is a genuine relative, non-dot path -- the normal case when `Loader::find_language_configurations_at_path`/`languages_at_path` is invoked directly on a relative directory argument, or when `Config::parser_directories` contains a relative entry -- the result is a bogus doubly-nested path like `vendor/tree-sitter-foo/src/vendor/tree-sitter-foo/some_header.h`. `needs_recompile` then calls `mtime()` on this nonexistent path, which returns an IO error that propagates via `?` and makes `load_language_at_path_with_name` fail outright for any grammar that declares `external-files` and is loaded via a relative, non-`.` path.","fix":"Do not re-join `config.src_path` onto entries that are already fully-qualified; use the stored external-file paths as-is:\n```rust\npaths_to_check.extend(config.external_files.unwrap_or_default().iter().cloned());\n```","locations":[{"ref":"crates/loader/src/loader.rs:1118-1133","code":" 1118 |         let parser_path = config.src_path.join(\"parser.c\");\n 1119 |         config.scanner_path = self.get_scanner_path(config.src_path);\n 1120 | \n 1121 |         let mut paths_to_check = vec![parser_path];\n 1122 | \n 1123 |         if let Some(scanner_path) = config.scanner_path.as_ref() {\n 1124 |             paths_to_check.push(scanner_path.clone());\n 1125 |         }\n 1126 | \n 1127 |         paths_to_check.extend(\n 1128 |             config\n 1129 |                 .external_files\n 1130 |                 .unwrap_or_default()\n 1131 |                 .iter()\n 1132 |                 .map(|p| config.src_path.join(p)),\n 1133 |         );","lines":16,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/loader/src/loader.rs#L1118-L1133"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`find_language_configurations_at_path` builds each `external-files` entry as `let path = parser_path.join(path); if path.starts_with(parser_path) { Ok(path) } else { Err(LoaderError::ExternalFile(...)) }`, with the comment `// prevent p being above/outside of parser_path`. This check does not defend against traversal: `Path::starts_with` compares path *components* without resolving `..`, so `parser_path.join(\"../../../etc/passwd\")` still `starts_with(parser_path)` (verified: `\"/home/user/tree-sitter-foo/../../../etc/passwd\".starts_with(\"/home/user/tree-sitter-foo\")` returns `true`). A malicious or careless `tree-sitter.json` can therefore declare an `external-files` entry that escapes `parser_path` entirely, defeating the intended containment check; the resulting path is later `fs::metadata()`-ed (via `needs_recompile`) for arbitrary files outside the grammar directory.","fix":"Reject `..` components explicitly instead of relying on `starts_with` on the joined-but-unresolved path, e.g.:\n```rust\nif path.components().any(|c| matches!(c, std::path::Component::ParentDir)) {\n    return Err(LoaderError::ExternalFile(...));\n}\n```\nor canonicalize both `path` and `parser_path` before comparing with `starts_with`.","locations":[{"ref":"crates/loader/src/loader.rs:1814-1841","code":" 1814 |                         self.languages_by_id.push((\n 1815 |                             language_path,\n 1816 |                             OnceCell::new(),\n 1817 |                             grammar\n 1818 |                                 .external_files\n 1819 |                                 .clone()\n 1820 |                                 .into_vec()\n 1821 |                                 .map(|files| {\n 1822 |                                     files\n 1823 |                                         .into_iter()\n 1824 |                                         .map(|path| {\n 1825 |                                             let path = parser_path.join(path);\n 1826 |                                             // prevent p being above/outside of parser_path\n 1827 |                                             if path.starts_with(parser_path) {\n 1828 |                                                 Ok(path)\n 1829 |                                             } else {\n 1830 |                                                 Err(LoaderError::ExternalFile(\n 1831 |                                                     path.to_string_lossy().to_string(),\n 1832 |                                                     parser_path.to_string_lossy().to_string(),\n 1833 |                                                 ))\n 1834 |                                             }\n 1835 |                                         })\n 1836 |                                         .collect::<LoaderResult<Vec<_>>>()\n 1837 |                                 })\n 1838 |                                 .transpose()?,\n 1839 |                         ));\n 1840 |                         self.languages_by_id.len() - 1\n 1841 |                     };","lines":28,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/loader/src/loader.rs#L1814-L1841"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `bump::run`, the sanity check that compares the latest git tag's version against the workspace `Cargo.toml` version uses `&&` instead of `||`: `if current_version.major != workspace_toml_version.major && current_version.minor != workspace_toml_version.minor`. This only warns and bails out when BOTH `major` and `minor` differ simultaneously. If only the `major` differs (e.g. tag `1.9.0` vs toml `2.9.0`) or only the `minor` differs (e.g. tag `1.2.0` vs toml `1.3.0`), the mismatch is silently missed and the release-bump tooling proceeds with `update_crates`, `update_makefile`, etc. using an already-inconsistent baseline, defeating the purpose of the guard.","fix":"Use `||` so any mismatch in either `major` or `minor` triggers the warning:\n```rust\nif current_version.major != workspace_toml_version.major\n    || current_version.minor != workspace_toml_version.minor\n{\n```","locations":[{"ref":"crates/xtask/src/bump.rs:54-65","code":"   54 |     if current_version.major != workspace_toml_version.major\n   55 |         && current_version.minor != workspace_toml_version.minor\n   56 |     {\n   57 |         eprintln!(\n   58 |             indoc! {\"\n   59 |             Seems like the workspace Cargo.toml ({}) version does not match up with the latest git tag ({}).\n   60 |             Please ensure you don't change that yourself, this subcommand will handle this for you.\n   61 |         \"},\n   62 |             workspace_toml_version, latest_tag\n   63 |         );\n   64 |         return Ok(());\n   65 |     }","lines":12,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/xtask/src/bump.rs#L54-L65"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Edit.editRange()` and `Edit.editPoint()`-adjacent range logic in `lib/binding_web/src/edit.ts` use `Number.MAX_SAFE_INTEGER` (2^53-1) as the sentinel for an \"unbounded\" range end/start, mirroring the native C `ts_range_edit()` in `lib/src/get_changed_ranges.c`, which uses `UINT32_MAX` (2^32-1, i.e. `4294967295`) for the same purpose. But `Range.startIndex`/`endIndex` are marshalled to and from the Wasm heap as 32-bit integers via `marshalRange`/`unmarshalRange` in `lib/binding_web/src/marshal.ts` (`C.setValue(address, range.endIndex, 'i32')`, `C.getValue(address, 'i32') >>> 0`). Two problems follow from this mismatch: (1) if an `Edit`-produced range with `endIndex === Number.MAX_SAFE_INTEGER` is ever marshalled into Wasm memory, the value silently truncates/wraps when coerced to a 32-bit int, corrupting the intended \"unbounded\" marker; (2) a range obtained via `unmarshalRange()` that actually carries the native sentinel `4294967295` will NOT satisfy `range.endIndex !== Number.MAX_SAFE_INTEGER`, so `editRange()`'s \"already unbounded, don't touch it\" guard never triggers for such ranges, and the sentinel gets incorrectly recomputed via ordinary arithmetic instead of being preserved.","fix":"Use the same 32-bit sentinel the native binding and marshalling code use, e.g. replace `Number.MAX_SAFE_INTEGER` with `0xFFFFFFFF` (and `{ row: 0xFFFFFFFF, column: 0xFFFFFFFF }` for the point) throughout `edit.ts` so the sentinel round-trips correctly through `marshalRange`/`unmarshalRange`.","locations":[{"ref":"lib/binding_web/src/edit.ts:87-100","code":"   87 |     if (range.endIndex >= this.oldEndIndex) {\n   88 |       if (range.endIndex !== Number.MAX_SAFE_INTEGER) {\n   89 |         newRange.endIndex = this.newEndIndex + (range.endIndex - this.oldEndIndex);\n   90 |         newRange.endPosition = {\n   91 |           row: this.newEndPosition.row + (range.endPosition.row - this.oldEndPosition.row),\n   92 |           column: range.endPosition.row === this.oldEndPosition.row\n   93 |             ? this.newEndPosition.column + (range.endPosition.column - this.oldEndPosition.column)\n   94 |             : range.endPosition.column,\n   95 |         };\n   96 |         if (newRange.endIndex < this.newEndIndex) {\n   97 |           newRange.endIndex = Number.MAX_SAFE_INTEGER;\n   98 |           newRange.endPosition = { row: Number.MAX_SAFE_INTEGER, column: Number.MAX_SAFE_INTEGER };\n   99 |         }\n  100 |       }","lines":14,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/src/edit.ts#L87-L100"},{"ref":"lib/binding_web/src/edit.ts:106-121","code":"  106 |     if (range.startIndex >= this.oldEndIndex) {\n  107 |       newRange.startIndex = this.newEndIndex + (range.startIndex - this.oldEndIndex);\n  108 |       newRange.startPosition = {\n  109 |         row: this.newEndPosition.row + (range.startPosition.row - this.oldEndPosition.row),\n  110 |         column: range.startPosition.row === this.oldEndPosition.row\n  111 |           ? this.newEndPosition.column + (range.startPosition.column - this.oldEndPosition.column)\n  112 |           : range.startPosition.column,\n  113 |       };\n  114 |       if (newRange.startIndex < this.newEndIndex) {\n  115 |         newRange.startIndex = Number.MAX_SAFE_INTEGER;\n  116 |         newRange.startPosition = { row: Number.MAX_SAFE_INTEGER, column: Number.MAX_SAFE_INTEGER };\n  117 |       }\n  118 |     } else if (range.startIndex > this.startIndex) {\n  119 |       newRange.startIndex = this.startIndex;\n  120 |       newRange.startPosition = { ...this.startPosition };\n  121 |     }","lines":16,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/src/edit.ts#L106-L121"},{"ref":"lib/binding_web/src/marshal.ts:132-151","code":"  132 | export function marshalRange(address: number, range: Range): void {\n  133 |   marshalPoint(address, range.startPosition); address += SIZE_OF_POINT;\n  134 |   marshalPoint(address, range.endPosition); address += SIZE_OF_POINT;\n  135 |   C.setValue(address, range.startIndex, 'i32'); address += SIZE_OF_INT;\n  136 |   C.setValue(address, range.endIndex, 'i32'); address += SIZE_OF_INT;\n  137 | }\n  138 | \n  139 | /**\n  140 |  * @internal\n  141 |  *\n  142 |  * Unmarshals a {@link Range} from the transfer buffer.\n  143 |  */\n  144 | export function unmarshalRange(address: number): Range {\n  145 |   const result = {} as Range;\n  146 |   result.startPosition = unmarshalPoint(address); address += SIZE_OF_POINT;\n  147 |   result.endPosition = unmarshalPoint(address); address += SIZE_OF_POINT;\n  148 |   result.startIndex = C.getValue(address, 'i32') >>> 0; address += SIZE_OF_INT;\n  149 |   result.endIndex = C.getValue(address, 'i32') >>> 0;\n  150 |   return result;\n  151 | }","lines":20,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/src/marshal.ts#L132-L151"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`Node.descendantsOfType()` builds the `symbols` array by first pushing the sentinel `65535` (for `\"ERROR\"`) and only afterward pushing the matched, ascending node-type ids. The resulting array is therefore not sorted ascending (e.g. `[65535, 3, 5, 7]`). This array is passed to the C helper `symbols_contain()` in `lib/binding_web/lib/tree-sitter.c`, which assumes an ascending-sorted array and exits its scan early via `if (set[i] > value) break;`. Because `65535` is always greater than any realistic node-type id, the very first comparison triggers the early break, so `symbols_contain` returns `false` for every symbol except an actual `ERROR` node -- effectively silently dropping all non-ERROR types whenever `\"ERROR\"` is combined with other type names in the `types` argument. This was introduced in commit 3b67861d (`fix(wasm): restore passing in ERROR to descendantsOfType`), and the accompanying test only exercises `descendantsOfType('ERROR')` alone, so the regression for combined lookups (e.g. `descendantsOfType(['ERROR', 'identifier'])`) is untested and silently wrong.","fix":"Sort the symbols array before copying it to the Wasm heap, e.g. in `lib/binding_web/src/node.ts`:\n```ts\n    for (let i = 0, n = typesBySymbol.length; i < n; i++) {\n      if (types.includes(typesBySymbol[i])) {\n        symbols.push(i);\n      }\n    }\n\n    symbols.sort((a, b) => a - b);\n```\nAlternatively, drop the sorted-array early-exit optimization in `symbols_contain()` in `tree-sitter.c` and always scan the full array.","locations":[{"ref":"lib/binding_web/src/node.ts:411-436","code":"  411 |   descendantsOfType(\n  412 |     types: string | string[],\n  413 |     startPosition: Point = ZERO_POINT,\n  414 |     endPosition: Point = ZERO_POINT\n  415 |   ): Node[] {\n  416 |     if (!Array.isArray(types)) types = [types];\n  417 | \n  418 |     // Convert the type strings to numeric type symbols\n  419 |     const symbols: number[] = [];\n  420 |     const typesBySymbol = this.tree.language.types;\n  421 |     for (const node_type of types) {\n  422 |       if (node_type == \"ERROR\") {\n  423 |         symbols.push(65535); // Internally, ts_builtin_sym_error is -1, which is UINT_16MAX\n  424 |       }\n  425 |     }\n  426 |     for (let i = 0, n = typesBySymbol.length; i < n; i++) {\n  427 |       if (types.includes(typesBySymbol[i])) {\n  428 |         symbols.push(i);\n  429 |       }\n  430 |     }\n  431 | \n  432 |     // Copy the array of symbols to the Wasm heap\n  433 |     const symbolsAddress = C._malloc(SIZE_OF_INT * symbols.length);\n  434 |     for (let i = 0, n = symbols.length; i < n; i++) {\n  435 |       C.setValue(symbolsAddress + i * SIZE_OF_INT, symbols[i], 'i32');\n  436 |     }","lines":26,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/src/node.ts#L411-L436"},{"ref":"lib/binding_web/lib/tree-sitter.c:735-745","code":"  735 | bool symbols_contain(const uint32_t *set, uint32_t length, uint32_t value) {\n  736 |   for (unsigned i = 0; i < length; i++) {\n  737 |     if (set[i] == value) {\n  738 |       return true;\n  739 |     }\n  740 |     if (set[i] > value) {\n  741 |       break;\n  742 |     }\n  743 |   }\n  744 |   return false;\n  745 | }","lines":11,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/lib/tree-sitter.c#L735-L745"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `TableEntrySyntheticProvider.get_child_at_index` (LLDB pretty printer for `TableEntry`), the header occupies exactly 2 logical child slots (`is_reusable` at index 0, `action_count` at index 1), and `num_children()` returns `2 + action_count` when `action_count > 0`, meaning the action elements occupy logical indices `2 .. action_count + 1`. However, the element `offset` is computed as `index - 3` instead of `index - 2`. As a result, the first request (logical index `2`) computes `offset = -1`, causing `address = start + (-1) * element_type_size` - reading memory *before* the `actions` array and displaying it as `action[-1]` - while the true last action (which should be at `offset = action_count - 1`) is never reached, since the index range only goes up to `action_count - 2` in the shifted scheme. Every `TableEntry` with at least one action is displayed with one bogus, out-of-bounds `action[-1]` entry and is missing its real last action.","fix":"Use the same header offset as the other array-like providers in this directory (`ts_array.py`, `ts_tree.py`), i.e. `offset = index - 2`:\n```python\nelse:\n    if self.action_count.GetValueAsUnsigned() == 0:\n        return self.actions\n    offset: int = index - 2\n    start: int = self.actions.GetValueAsUnsigned()\n```","locations":[{"ref":"lib/lldb_pretty_printers/table_entry.py:40-49","code":"   40 |         else:\n   41 |             if self.action_count.GetValueAsUnsigned() == 0:\n   42 |                 return self.actions\n   43 |             offset: int = index - 3\n   44 |             start: int = self.actions.GetValueAsUnsigned()\n   45 |             address: int = start + offset * self.element_type_size\n   46 |             element: SBValue = self.actions.CreateValueFromAddress(\n   47 |                 \"action[%s]\" % (offset), address, self.element_type\n   48 |             )\n   49 |             return element","lines":10,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/lldb_pretty_printers/table_entry.py#L40-L49"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`color_enabled` in `paint.rs` is supposed to implement the `NO_COLOR` convention (https://no-color.org), which states color must be disabled whenever the variable is *present*, regardless of its value. The current check `std::env::var_os(\"NO_COLOR\").is_none_or(|v| v.is_empty())` only disables color when `NO_COLOR` is set to a *non-empty* value; running with `NO_COLOR=` (present but empty, a common way to set an env var in shell scripts/CI) leaves color enabled, silently violating the convention the code is trying to implement.","fix":"Treat mere presence of the variable as disabling color:\n```rust\npub fn color_enabled() -> bool {\n    static ENABLED: std::sync::OnceLock<bool> = std::sync::OnceLock::new();\n    *ENABLED.get_or_init(|| std::env::var_os(\"NO_COLOR\").is_none())\n}\n```","locations":[{"ref":"crates/cli/src/paint.rs:10-13","code":"   10 | pub fn color_enabled() -> bool {\n   11 |     static ENABLED: std::sync::OnceLock<bool> = std::sync::OnceLock::new();\n   12 |     *ENABLED.get_or_init(|| std::env::var_os(\"NO_COLOR\").is_none_or(|v| v.is_empty()))\n   13 | }","lines":4,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/paint.rs#L10-L13"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `TestSummary::fmt_parse_results`, `avg` is computed as `total_adj_parse_time / count as f64` and `std_dev` similarly divides by `count as f64`, with no check for `count == 0`. If a test run produces no parse-test results (e.g. a corpus directory containing only highlight/tag/query tests, or an empty corpus), this yields `0.0 / 0.0 = NaN`, which then silently propagates into the \"Warning: Slow parse rate\" comparisons (always false against `NaN`, so no crash, but the underlying statistics are garbage rather than being skipped).","fix":"Skip the outlier-statistics computation entirely when `count == 0`, e.g. wrap the `avg`/`std_dev` calculation and the later `stat_display` logic in `if count > 0 { ... }`, defaulting to no slow-parse warnings when there are zero parse results.","locations":[{"ref":"crates/cli/src/test.rs:438-465","code":"  438 |     fn fmt_parse_results(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  439 |         let (count, total_adj_parse_time) = self\n  440 |             .parse_results\n  441 |             .iter()\n  442 |             .filter_map(|(_, result)| match result.info {\n  443 |                 TestInfo::Group { .. } => None,\n  444 |                 TestInfo::ParseTest { parse_rate, .. } => parse_rate,\n  445 |                 TestInfo::AssertionTest { .. } => unreachable!(),\n  446 |             })\n  447 |             .fold((0usize, 0.0f64), |(count, rate_accum), (_, adj_rate)| {\n  448 |                 (count + 1, rate_accum + adj_rate)\n  449 |             });\n  450 | \n  451 |         let avg = total_adj_parse_time / count as f64;\n  452 |         let std_dev = {\n  453 |             let variance = self\n  454 |                 .parse_results\n  455 |                 .iter()\n  456 |                 .filter_map(|(_, result)| match result.info {\n  457 |                     TestInfo::Group { .. } => None,\n  458 |                     TestInfo::ParseTest { parse_rate, .. } => parse_rate,\n  459 |                     TestInfo::AssertionTest { .. } => unreachable!(),\n  460 |                 })\n  461 |                 .map(|(_, rate_i)| (rate_i - avg).powi(2))\n  462 |                 .sum::<f64>()\n  463 |                 / count as f64;\n  464 |             variance.sqrt()\n  465 |         };","lines":28,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/test.rs#L438-L465"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`compute_conflict_status` in `token_conflicts.rs` de-duplicates the BFS worklist of NFA state sets using `hash_state_set`, which folds each `Vec<u32>` of NFA state ids down to a single `u64` via `FxHasher` (`token_conflicts.rs:328-334`) and only tracks that `u64` in `visited_state_sets`, instead of the actual state-id vector. As the comment on `hash_state_set` itself acknowledges, two distinct state sets that happen to hash to the same `u64` will be treated as \"already visited\" and the second one will be silently skipped, which can make `compute_conflict_status` miss a real lexical conflict between two tokens (`TokenConflictStatus` bits under-reported), so `does_conflict`/`does_overlap` could return `false` for a token pair that genuinely conflicts. The probability of an `FxHasher` collision for any given pair of distinct inputs is low but non-negligible compared to a cryptographic hash (`FxHash` is explicitly a fast, non-collision-resistant hash), and this runs once per token pair per grammar compile across every tree-sitter grammar ever generated, so it is a real (if rare) correctness hazard rather than a purely theoretical one.","fix":"Track the actual state-id vectors in the visited set (e.g. `FxHashSet<Vec<u32>>` or a `FxHashSet<Box<[u32]>>`) instead of collapsing them to a `u64` hash, or at minimum fall back to a full equality check on hash collision (e.g. store `(u64, Vec<u32>)` and compare the vector when the hash matches) so a collision can never cause a state set to be skipped.","locations":[{"ref":"crates/generate/src/build_tables/token_conflicts.rs:320-334","code":"  320 | /// Hash a sorted slice of NFA state IDs to a single `u64` for use as a\n  321 | /// visited-set key.\n  322 | ///\n  323 | /// NOTE: This trades exact equality for speed. Two distinct state sets that\n  324 | /// hash to the same `u64` will be treated as \"already visited,\" potentially\n  325 | /// causing the BFS to skip a state set. In practice the collision probability\n  326 | /// is negligible (1 in 2^64 per comparison), but this is technically a\n  327 | /// probabilistic optimization rather than an exact one.\n  328 | #[inline]\n  329 | fn hash_state_set(states: &[u32]) -> u64 {\n  330 |     use std::hash::{Hash, Hasher};\n  331 |     let mut h = rustc_hash::FxHasher::default();\n  332 |     states.hash(&mut h);\n  333 |     h.finish()\n  334 | }","lines":15,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/build_tables/token_conflicts.rs#L320-L334"},{"ref":"crates/generate/src/build_tables/token_conflicts.rs:481","code":"  481 |             if can_advance && visited_state_sets.insert(hash_state_set(&transition.states)) {","lines":1,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/build_tables/token_conflicts.rs#L481"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`colorForCaptureName` looks up `capture` with `query.captureNames.indexOf(capture)`. `CAPTURE_REGEX` (`/@\\s*([\\w\\._-]+)/g`) scans the raw query text line-by-line and can match `@`-prefixed text inside string literals or predicate arguments (e.g. `(#match? @foo \"^@bar\")`) that are not actual capture names. When `indexOf` returns `-1` for such a false match, `colors[id % colors.length]` evaluates to `colors[-1]` (JavaScript's `%` preserves the sign of the dividend), which is `undefined`, producing an invalid `color: undefined` CSS declaration instead of a real highlight color.","fix":"Guard against a missing capture before indexing, e.g.:\n```javascript\nfunction colorForCaptureName(capture) {\n  const id = query.captureNames.indexOf(capture);\n  if (id === -1) return undefined;\n  const isDark = ...\n  const colors = isDark ? DARK_COLORS : LIGHT_COLORS;\n  return colors[id % colors.length];\n}\n```","locations":[{"ref":"docs/src/assets/js/playground.js:591-599","code":"  591 |   function colorForCaptureName(capture) {\n  592 |     const id = query.captureNames.indexOf(capture);\n  593 |     const isDark = document.querySelector('html').classList.contains('ayu') ||\n  594 |       document.querySelector('html').classList.contains('coal') ||\n  595 |       document.querySelector('html').classList.contains('navy');\n  596 | \n  597 |     const colors = isDark ? DARK_COLORS : LIGHT_COLORS;\n  598 |     return colors[id % colors.length];\n  599 |   }","lines":9,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/docs/src/assets/js/playground.js#L591-L599"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `get_child_index` methods of `ArraySyntheticProvider` (`ts_array.py`), `TableEntrySyntheticProvider` (`table_entry.py`), and `TSTreeSyntheticProvider` (`ts_tree.py`) are supposed to be the inverse of `get_child_at_index`: the header fields occupy the first N logical indices (2 for `ArraySyntheticProvider`/`TableEntrySyntheticProvider`, 3 for `TSTreeSyntheticProvider`), and element `k` lives at logical index `N + k` (matching `offset = index - N` in `get_child_at_index`). But `get_child_index` returns the bare parsed element number (`int(index)`) instead of `int(index) + N`. So looking up a child by its displayed name, e.g. `\"[3]\"` or `\"included_ranges[3]\"`, returns the wrong logical index (off by the header size), which `get_child_at_index` then resolves to the wrong field (e.g. `size`/`root`/`is_reusable` instead of the requested element, or the wrong element).","fix":"Add the header offset when converting the parsed element number back to a logical index, mirroring `get_child_at_index`. For example in `ts_array.py`:\n```python\nindex = name.lstrip(\"[\").rstrip(\"]\")\nif index.isdigit():\n    return int(index) + 2\nelse:\n    return -1\n```\nand analogously `+ 2` in `table_entry.py` and `+ 3` in `ts_tree.py`.","locations":[{"ref":"lib/lldb_pretty_printers/ts_array.py:20-32","code":"   20 |     def get_child_index(self, name: str) -> int:\n   21 |         if name == \"size\":\n   22 |             return 0\n   23 |         elif name == \"capacity\":\n   24 |             return 1\n   25 |         else:\n   26 |             if self.size.GetValueAsUnsigned() == 0:\n   27 |                 return 2\n   28 |             index = name.lstrip(\"[\").rstrip(\"]\")\n   29 |             if index.isdigit():\n   30 |                 return int(index)\n   31 |             else:\n   32 |                 return -1","lines":13,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/lldb_pretty_printers/ts_array.py#L20-L32"},{"ref":"lib/lldb_pretty_printers/table_entry.py:21-33","code":"   21 |     def get_child_index(self, name: str) -> int:\n   22 |         if name == \"is_reusable\":\n   23 |             return 0\n   24 |         elif name == \"action_count\":\n   25 |             return 1\n   26 |         else:\n   27 |             if self.action_count.GetValueAsUnsigned() == 0:\n   28 |                 return 2\n   29 |             index = name.lstrip(\"actions[\").rstrip(\"]\")\n   30 |             if index.isdigit():\n   31 |                 return int(index)\n   32 |             else:\n   33 |                 return -1","lines":13,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/lldb_pretty_printers/table_entry.py#L21-L33"},{"ref":"lib/lldb_pretty_printers/ts_tree.py:53-67","code":"   53 |     def get_child_index(self, name: str) -> int:\n   54 |         if name == \"root\":\n   55 |             return 0\n   56 |         elif name == \"language\":\n   57 |             return 1\n   58 |         elif name == \"included_range_count\":\n   59 |             return 2\n   60 |         else:\n   61 |             if self.included_range_count.GetValueAsUnsigned() == 0:\n   62 |                 return 3\n   63 |             index = name.lstrip(\"included_ranges[\").rstrip(\"]\")\n   64 |             if index.isdigit():\n   65 |                 return int(index)\n   66 |             else:\n   67 |                 return -1","lines":15,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/lldb_pretty_printers/ts_tree.py#L53-L67"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `dsl.js`'s `grammar()` function, the `reserved` word-set map is not copied before being mutated when a grammar extends a base grammar. `let reserved = baseGrammar.reserved;` at `dsl.js:337` binds `reserved` directly to the base grammar's own object (no clone), and then the loop at `dsl.js:349-355` does `reserved[reservedWordSetName] = reservedTokens.map(normalize);`, which mutates that shared object in place. Every other overridable map on `baseGrammar` is copied before being mutated the same way — e.g. `const rules = Object.assign({}, baseGrammar.rules);` at `dsl.js:318` — so this is a copy-paste omission. In any scenario where the same base-grammar module object is reused (module caching when multiple derived grammars `require`/`import` a shared base within one JS runtime invocation, e.g. via the native `qjs-rt` runtime that can process more than one grammar per process), the base grammar's `reserved` object gets permanently polluted with the first extending grammar's reserved-word overrides, corrupting subsequent lookups against the \"clean\" base grammar.","fix":"Copy `reserved` the same way `rules` is copied:\n```js\n// before\nlet reserved = baseGrammar.reserved;\n\n// after\nlet reserved = Object.assign({}, baseGrammar.reserved);\n```","locations":[{"ref":"crates/generate/src/dsl.js:337-357","code":"  337 |   let reserved = baseGrammar.reserved;\n  338 |   if (options.reserved) {\n  339 |     if (typeof options.reserved !== \"object\") {\n  340 |       throw new Error(\"Grammar's 'reserved' property must be an object.\");\n  341 |     }\n  342 | \n  343 |     for (const reservedWordSetName of Object.keys(options.reserved)) {\n  344 |       const reservedWordSetFn = options.reserved[reservedWordSetName]\n  345 |       if (typeof reservedWordSetFn !== \"function\") {\n  346 |         throw new Error(`Grammar reserved word sets must all be functions. '${reservedWordSetName}' is not.`);\n  347 |       }\n  348 | \n  349 |       const reservedTokens = reservedWordSetFn.call(ruleBuilder, ruleBuilder, baseGrammar.reserved[reservedWordSetName]);\n  350 | \n  351 |       if (!Array.isArray(reservedTokens)) {\n  352 |         throw new Error(`Grammar's reserved word set functions must all return arrays of rules. '${reservedWordSetName}' does not.`);\n  353 |       }\n  354 | \n  355 |       reserved[reservedWordSetName] = reservedTokens.map(normalize);\n  356 |     }\n  357 |   }","lines":21,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/dsl.js#L337-L357"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`language->supertype_map_entries` has type `const TSSymbol *` (per `struct TSLanguage` in `lib/src/parser.h`, `TSSymbol` is `uint16_t`), but the size passed to `copy()` uses `sizeof(char *)` (8 bytes on LP64) instead of `sizeof(TSSymbol)` (2 bytes). Every other array of `TSSymbol` in this same function (e.g. `alias_sequences`, `supertype_symbols`) correctly multiplies the element count by `sizeof(TSSymbol)`. This copy-paste mistake makes the code request/allocate/read 4x more bytes than the real array occupies in WASM memory: it wastes memory, and - because the oversized read must still fit inside the actual WASM linear memory buffer (`wasm_memory__contains`) - it can spuriously reject perfectly valid language modules whose `supertype_map_entries` array happens to sit near the end of the module's allocated memory (the real 2-byte-per-entry data fits, but the requested 8-byte-per-entry read does not), turning a valid load into an `invalid_language_memory` error.","fix":"Use the correct element size:\n```c\nlanguage->supertype_map_entries = copy(\n  &wasm_memory,\n  wasm_language.supertype_map_entries,\n  supertype_map_entry_count * sizeof(TSSymbol),\n  &valid_wasm_memory\n);\n```","locations":[{"ref":"lib/src/wasm_store.c:1488-1493","code":" 1488 |     language->supertype_map_entries = copy(\n 1489 |       &wasm_memory,\n 1490 |       wasm_language.supertype_map_entries,\n 1491 |       supertype_map_entry_count * sizeof(char *),\n 1492 |       &valid_wasm_memory\n 1493 |     );","lines":6,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1488-L1493"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `HighlightConfiguration::new`, the pattern-index counting loop has a redundant nested condition: `if pattern_offset < highlights_query_offset { if pattern_offset < highlights_query_offset { highlights_pattern_index += 1; } ... }`. The inner `if` duplicates the exact condition of the enclosing `if`, so it is always true whenever reached and adds nothing but confusion -- a leftover copy-paste artifact (the inner check was presumably meant to test something else, analogous to the `locals_query_offset` check right below it).","fix":"Remove the redundant inner check:\n```rust\nfor i in 0..(query.pattern_count()) {\n    let pattern_offset = query.start_byte_for_pattern(i);\n    if pattern_offset < highlights_query_offset {\n        highlights_pattern_index += 1;\n        if pattern_offset < locals_query_offset {\n            locals_pattern_index += 1;\n        }\n    }\n}\n```","locations":[{"ref":"crates/highlight/src/highlight.rs:375-385","code":"  375 |         for i in 0..(query.pattern_count()) {\n  376 |             let pattern_offset = query.start_byte_for_pattern(i);\n  377 |             if pattern_offset < highlights_query_offset {\n  378 |                 if pattern_offset < highlights_query_offset {\n  379 |                     highlights_pattern_index += 1;\n  380 |                 }\n  381 |                 if pattern_offset < locals_query_offset {\n  382 |                     locals_pattern_index += 1;\n  383 |                 }\n  384 |             }\n  385 |         }","lines":11,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/highlight/src/highlight.rs#L375-L385"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The ESLint flat config object in `crates/cli/eslint/index.js` sets the `camelcase` rule twice: once at `'camelcase': ['error', { properties: 'never' }]` and again a few lines later as `'camelcase': 'off'`. Because both are keys of the same object literal, the second assignment silently overwrites the first, making the first one dead/misleading configuration.","fix":"Remove one of the two `camelcase` entries; keep whichever behavior (`'never'` properties check vs fully `'off'`) is actually intended.","locations":[{"ref":"crates/cli/eslint/index.js:40-48","code":"   40 |       'camelcase': ['error', { properties: 'never' }],\n   41 |       'comma-dangle': ['error', 'always-multiline'],\n   42 |       'comma-spacing': 'error',\n   43 |       'comma-style': 'error',\n   44 |       'computed-property-spacing': 'error',\n   45 |       'eol-last': 'error',\n   46 |       'func-call-spacing': 'error',\n   47 | \n   48 |       'camelcase': 'off',","lines":9,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/eslint/index.js#L40-L48"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `extract_tokens`, when interning reserved-word contexts, the inner `Vec` is pre-sized using the wrong length. `let mut reserved_words = Vec::with_capacity(reserved_word_contexts.len());` uses `reserved_word_contexts` (the *outer* accumulator vector, which starts empty and only grows across outer-loop iterations) instead of `reserved_word_context.reserved_words.len()` (the number of items about to be pushed in the following inner loop). The analogous, correctly-sized code in `intern_symbols.rs` (`Vec::with_capacity(reserved_word_set.reserved_words.len())`) shows what this was meant to look like. Functionally harmless since `Vec` grows automatically, but the capacity hint is always wrong (usually far too small, occasionally coincidentally right), defeating the point of pre-sizing.","fix":"Size the inner vector from the context currently being processed:\n```rust\n// before\nfor reserved_word_context in grammar.reserved_word_sets {\n    let mut reserved_words = Vec::with_capacity(reserved_word_contexts.len());\n\n// after\nfor reserved_word_context in grammar.reserved_word_sets {\n    let mut reserved_words = Vec::with_capacity(reserved_word_context.reserved_words.len());\n```","locations":[{"ref":"crates/generate/src/prepare_grammar/extract_tokens.rs:212-215","code":"  212 |     let mut reserved_word_contexts = Vec::with_capacity(grammar.reserved_word_sets.len());\n  213 |     for reserved_word_context in grammar.reserved_word_sets {\n  214 |         let mut reserved_words = Vec::with_capacity(reserved_word_contexts.len());\n  215 |         for reserved_rule in reserved_word_context.reserved_words {","lines":4,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/prepare_grammar/extract_tokens.rs#L212-L215"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"In the `Query` constructor, when `ts_query_new` fails (`address` is falsy), the code reads `errorId` from the transfer buffer and `switch`es on it, but the `switch` only has cases for `QueryErrorKind.Syntax/NodeName/FieldName/CaptureName/PatternStructure` (C values 1-5) and has no `default` case. The C API can also return `TSQueryErrorLanguage` (value 6, defined in `lib/src/query.c`'s `ts_query_new`, returned whenever the language is `NULL` or has an incompatible ABI version). When that happens, none of the `case` branches match, the `switch` silently falls through, and execution continues past the `if (!address)` block using `address = 0`. The constructor then calls `C._ts_query_string_count(address)`, `C._ts_query_capture_count(address)`, `C._ts_query_pattern_count(address)`, etc. with a null/zero pointer, which is passed straight into the Wasm module's native code as a `TSQuery*`. This is reachable from ordinary API misuse (constructing a `Query` for a `Language` whose ABI version is outside the compatible range), and results in either garbage data or a Wasm trap/crash instead of a clean `QueryError` being thrown.","fix":"Add a `default` (or an explicit `case QueryErrorKind`-equivalent for the C `TSQueryErrorLanguage` value) that throws a `QueryError`/generic `Error` instead of falling through, e.g.:\n```ts\nswitch (errorId) {\n  case QueryErrorKind.Syntax:\n    throw new QueryError(QueryErrorKind.Syntax, { suffix: `${errorIndex}: '${suffix}'...` }, errorIndex, 0);\n  case QueryErrorKind.NodeName:\n  case QueryErrorKind.FieldName:\n  case QueryErrorKind.CaptureName:\n    throw new QueryError(errorId, { word }, errorIndex, word.length);\n  case QueryErrorKind.PatternStructure:\n    throw new QueryError(errorId, { suffix: `${errorIndex}: '${suffix}'...` }, errorIndex, 0);\n  default:\n    throw new Error(`Failed to create query: incompatible or invalid language (error code ${errorId})`);\n}\n```","locations":[{"ref":"lib/binding_web/src/query.ts:576-596","code":"  576 |     if (!address) {\n  577 |       const errorId = C.getValue(TRANSFER_BUFFER + SIZE_OF_INT, 'i32') as QueryErrorKind;\n  578 |       const errorByte = C.getValue(TRANSFER_BUFFER, 'i32');\n  579 |       const errorIndex = C.UTF8ToString(sourceAddress, errorByte).length;\n  580 |       const suffix = source.slice(errorIndex, errorIndex + 100).split('\\n')[0];\n  581 |       const word = suffix.match(QUERY_WORD_REGEX)?.[0] ?? '';\n  582 |       C._free(sourceAddress);\n  583 | \n  584 |       switch (errorId) {\n  585 |         case QueryErrorKind.Syntax:\n  586 |           throw new QueryError(QueryErrorKind.Syntax, { suffix: `${errorIndex}: '${suffix}'...` }, errorIndex, 0);\n  587 |         case QueryErrorKind.NodeName:\n  588 |           throw new QueryError(errorId, { word }, errorIndex, word.length);\n  589 |         case QueryErrorKind.FieldName:\n  590 |           throw new QueryError(errorId, { word }, errorIndex, word.length);\n  591 |         case QueryErrorKind.CaptureName:\n  592 |           throw new QueryError(errorId, { word }, errorIndex, word.length);\n  593 |         case QueryErrorKind.PatternStructure:\n  594 |           throw new QueryError(errorId, { suffix: `${errorIndex}: '${suffix}'...` }, errorIndex, 0);\n  595 |       }\n  596 |     }","lines":21,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/binding_web/src/query.ts#L576-L596"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`load_language_wasm_file` calls `get_grammar_name(language_dir).with_context(...).unwrap()` even though the enclosing function returns `Result<(String, Vec<u8>)>`. `with_context` turns the `Result` into one with a nicer error message, but the immediate `.unwrap()` then discards that `Result` handling and panics instead of propagating the error. Any user running a command that hits this path (e.g. `tree-sitter build --wasm` or `tree-sitter playground`) against a directory with a missing or invalid `src/grammar.json` gets an ugly panic/backtrace instead of the intended friendly `anyhow` error message.","fix":"Replace `.unwrap()` with `?` so the context-wrapped error is returned normally:\n```rust\nlet grammar_name = get_grammar_name(language_dir)\n    .with_context(|| \"Failed to get Wasm filename\")?;\n```","locations":[{"ref":"crates/cli/src/wasm.rs:12-15","code":"   12 | pub fn load_language_wasm_file(language_dir: &Path) -> Result<(String, Vec<u8>)> {\n   13 |     let grammar_name = get_grammar_name(language_dir)\n   14 |         .with_context(|| \"Failed to get Wasm filename\")\n   15 |         .unwrap();","lines":4,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/wasm.rs#L12-L15"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The `optional_resource!` macro used to embed/load `playground.js`, `web-tree-sitter.js`, and `web-tree-sitter.wasm` calls `fs::read(tree_sitter_dir.join($path)).unwrap()` whenever the `TREE_SITTER_BASE_DIR` environment variable is set. If that variable points at a directory that doesn't contain the expected files (a typo, stale checkout, or partial build), `tree-sitter playground` / `tree-sitter playground export` panics instead of surfacing a clear `anyhow` error like the rest of `export`/`serve` do via `.with_context(...)`.","fix":"Have the macro-generated functions return `Result<Cow<'static, [u8]>>` and use `.with_context(|| format!(\"Failed to read {}\", $path))?` instead of `.unwrap()`, propagating the error to `export`/`serve` callers.","locations":[{"ref":"crates/cli/src/playground.rs:15-35","code":"   15 | macro_rules! optional_resource {\n   16 |     ($name:tt, $path:tt) => {\n   17 |         #[cfg(TREE_SITTER_EMBED_WASM_BINDING)]\n   18 |         fn $name(tree_sitter_dir: Option<&Path>) -> Cow<'static, [u8]> {\n   19 |             if let Some(tree_sitter_dir) = tree_sitter_dir {\n   20 |                 Cow::Owned(fs::read(tree_sitter_dir.join($path)).unwrap())\n   21 |             } else {\n   22 |                 Cow::Borrowed(include_bytes!(concat!(\"../../../\", $path)))\n   23 |             }\n   24 |         }\n   25 | \n   26 |         #[cfg(not(TREE_SITTER_EMBED_WASM_BINDING))]\n   27 |         fn $name(tree_sitter_dir: Option<&Path>) -> Cow<'static, [u8]> {\n   28 |             if let Some(tree_sitter_dir) = tree_sitter_dir {\n   29 |                 Cow::Owned(fs::read(tree_sitter_dir.join($path)).unwrap())\n   30 |             } else {\n   31 |                 Cow::Borrowed(&[])\n   32 |             }\n   33 |         }\n   34 |     };\n   35 | }","lines":21,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/playground.rs#L15-L35"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`ts_wasm_store_call_scanner_serialize` validates that the scanner-reported `length` fits within `TREE_SITTER_SERIALIZATION_BUFFER_SIZE` before touching the buffer (`if (length > TREE_SITTER_SERIALIZATION_BUFFER_SIZE) { self->has_error = true; return 0; }`), but its counterpart `ts_wasm_store_call_scanner_deserialize` performs no equivalent check: it unconditionally does `memcpy(&memory_data[serialization_buffer_address], buffer, length)` for whatever `length` the caller passes in. Today the only caller (`ts_parser__external_scanner_deserialize` in `lib/src/parser.c`) sources `length` from a previously-serialized `Subtree` that was itself bounded at serialize time, so this is not currently reachable with an out-of-range value, but the function is exported from `wasm_store.h` as a general API with no documented precondition, and the asymmetry with `scanner_serialize` (which does defend itself) is a latent footgun: any future/alternate caller supplying a too-large `length` would write past the dedicated serialization-buffer region into (or beyond) the WASM heap.","fix":"Mirror the check used in `ts_wasm_store_call_scanner_serialize`:\n```c\nvoid ts_wasm_store_call_scanner_deserialize(\n  TSWasmStore *self,\n  uint32_t scanner_address,\n  const char *buffer,\n  unsigned length\n) {\n  if (length > TREE_SITTER_SERIALIZATION_BUFFER_SIZE) {\n    self->has_error = true;\n    return;\n  }\n  ...\n}\n```","locations":[{"ref":"lib/src/wasm_store.c:1919-1943","code":" 1919 | void ts_wasm_store_call_scanner_deserialize(\n 1920 |   TSWasmStore *self,\n 1921 |   uint32_t scanner_address,\n 1922 |   const char *buffer,\n 1923 |   unsigned length\n 1924 | ) {\n 1925 |   wasmtime_context_t *context = wasmtime_store_context(self->store);\n 1926 |   uint8_t *memory_data = wasmtime_memory_data(context, &self->memory);\n 1927 |   uint32_t serialization_buffer_address = ts_wasm_store__serialization_buffer_address(self);\n 1928 | \n 1929 |   if (length > 0) {\n 1930 |     memcpy(\n 1931 |       &memory_data[serialization_buffer_address],\n 1932 |       buffer,\n 1933 |       length\n 1934 |     );\n 1935 |   }\n 1936 | \n 1937 |   wasmtime_val_raw_t args[3] = {\n 1938 |     {.i32 = scanner_address},\n 1939 |     {.i32 = serialization_buffer_address},\n 1940 |     {.i32 = length},\n 1941 |   };\n 1942 |   ts_wasm_store__call(self, self->current_instance->scanner_deserialize_fn_index, args, 3);\n 1943 | }","lines":25,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/lib/src/wasm_store.c#L1919-L1943"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Minimizer::remove_unused_states` in `minimize_parse_table.rs` filters out unused parse states by calling `self.parse_table.states.remove(state_id)` inside a `while` loop (`minimize_parse_table.rs:636-638`). `Vec::remove` is O(n) because it shifts every following element down by one, so removing `k` unused states out of `n` total states costs O(n*k) in the worst case instead of the O(n) that a single `retain`/filter pass would cost. This runs unconditionally on every grammar compile (not gated by `OptLevel::MergeStates`), so for grammars that produce many states (real-world grammars can have several thousand parse states) this turns an otherwise-linear cleanup pass into a quadratic one.","fix":"Replace the manual index-juggling + `Vec::remove` loop with a single `retain` pass plus a separate pass to remap referenced state ids, e.g.:\n```rust\nlet mut i = 0;\nself.parse_table.states.retain(|_| {\n    let keep = state_usage_map[i];\n    i += 1;\n    keep\n});\nfor state in &mut self.parse_table.states {\n    state.update_referenced_states(|other_state_id, _| state_replacement_map[other_state_id]);\n}\n```\nThis performs the same filtering in a single O(n) pass instead of O(n) `remove` calls that are each themselves O(n).","locations":[{"ref":"crates/generate/src/build_tables/minimize_parse_table.rs:609-641","code":"  609 |     fn remove_unused_states(&mut self) {\n  610 |         let mut state_usage_map = vec![false; self.parse_table.states.len()];\n  611 | \n  612 |         state_usage_map[0] = true;\n  613 |         state_usage_map[1] = true;\n  614 | \n  615 |         for state in &self.parse_table.states {\n  616 |             for referenced_state in state.referenced_states() {\n  617 |                 state_usage_map[referenced_state] = true;\n  618 |             }\n  619 |         }\n  620 |         let mut removed_predecessor_count = 0;\n  621 |         let mut state_replacement_map = vec![0; self.parse_table.states.len()];\n  622 |         for state_id in 0..self.parse_table.states.len() {\n  623 |             state_replacement_map[state_id] = state_id - removed_predecessor_count;\n  624 |             if !state_usage_map[state_id] {\n  625 |                 removed_predecessor_count += 1;\n  626 |             }\n  627 |         }\n  628 |         let mut state_id = 0;\n  629 |         let mut original_state_id = 0;\n  630 |         while state_id < self.parse_table.states.len() {\n  631 |             if state_usage_map[original_state_id] {\n  632 |                 self.parse_table.states[state_id].update_referenced_states(|other_state_id, _| {\n  633 |                     state_replacement_map[other_state_id]\n  634 |                 });\n  635 |                 state_id += 1;\n  636 |             } else {\n  637 |                 self.parse_table.states.remove(state_id);\n  638 |             }\n  639 |             original_state_id += 1;\n  640 |         }\n  641 |     }","lines":33,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/build_tables/minimize_parse_table.rs#L609-L641"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `generate_node_types_json`, `subtype_map.sort_by` computes each comparison key with `sorted_kinds.iter().position(...)`, which is an `O(n)` linear scan. Since `sort_by` performs `O(n log n)` comparisons, the whole sort is effectively `O(n^2 log n)` in the number of supertype/subtype pairs, instead of the `O(n log n)` achievable with a precomputed index map. For grammars with many supertypes this does unnecessary repeated scanning of `sorted_kinds`.","fix":"Build a `HashMap<&str, usize>` (or `FxHashMap`) once from `sorted_kinds` mapping each kind name to its position, then use that map inside the `sort_by` comparator instead of calling `.position()` on every comparison.","locations":[{"ref":"crates/generate/src/node_types.rs:704-730","code":"  704 |     let mut sorted_kinds = Vec::with_capacity(subtype_map.len());\n  705 |     let mut top_sort = topological_sort::TopologicalSort::<String>::new();\n  706 |     for (supertype, subtypes) in &subtype_map {\n  707 |         for subtype in subtypes {\n  708 |             top_sort.add_dependency(subtype.kind.clone(), supertype.kind.clone());\n  709 |         }\n  710 |     }\n  711 |     loop {\n  712 |         let mut next_kinds = top_sort.pop_all();\n  713 |         match (next_kinds.is_empty(), top_sort.is_empty()) {\n  714 |             (true, true) => break,\n  715 |             (true, false) => {\n  716 |                 let mut items = top_sort.collect::<Vec<String>>();\n  717 |                 items.sort();\n  718 |                 return Err(SuperTypeCycleError { items });\n  719 |             }\n  720 |             (false, _) => {\n  721 |                 next_kinds.sort();\n  722 |                 sorted_kinds.extend(next_kinds);\n  723 |             }\n  724 |         }\n  725 |     }\n  726 |     subtype_map.sort_by(|a, b| {\n  727 |         let a_idx = sorted_kinds.iter().position(|n| n.eq(&a.0.kind)).unwrap();\n  728 |         let b_idx = sorted_kinds.iter().position(|n| n.eq(&b.0.kind)).unwrap();\n  729 |         a_idx.cmp(&b_idx)\n  730 |     });","lines":27,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/node_types.rs#L704-L730"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Generator::get_field_map_id` in `render.rs` deduplicates field maps with a linear scan over `flat_field_maps` (`flat_field_maps.iter().find(|(_, e)| *e == *flat_field_map)`) for every production that has fields, making dedup `O(productions * distinct_field_maps)`. This is inconsistent with the sibling dedup helper `get_parse_action_list_id` in the same file, which does the equivalent job in O(1) amortized time using a proper `FxHashMap<ParseTableEntry, usize>`. For grammars with a large number of distinct field-name combinations (large real-world grammars can have thousands of productions with fields), this comparison-by-vector-equality scan can become a noticeable chunk of `tree-sitter generate` time, and it grows quadratically instead of linearly.","fix":"Mirror the `get_parse_action_list_id` approach: key a `FxHashMap<Vec<(String, FieldLocation)>, usize>` (or a hashable wrapper) by the flattened field map instead of doing a linear `Vec` scan. This requires `FieldLocation` (in `crates/generate/src/tables.rs`) to derive `Hash` in addition to its existing `PartialEq, Eq` derives, and `String`/`Vec` already hash structurally, so the map lookup becomes O(1) amortized instead of O(n) per production.","locations":[{"ref":"crates/generate/src/render.rs:1699-1712","code":" 1699 |     fn get_field_map_id(\n 1700 |         flat_field_map: Vec<(String, FieldLocation)>,\n 1701 |         flat_field_maps: &mut Vec<(usize, Vec<(String, FieldLocation)>)>,\n 1702 |         next_flat_field_map_index: &mut usize,\n 1703 |     ) -> usize {\n 1704 |         if let Some((index, _)) = flat_field_maps.iter().find(|(_, e)| *e == *flat_field_map) {\n 1705 |             return *index;\n 1706 |         }\n 1707 | \n 1708 |         let result = *next_flat_field_map_index;\n 1709 |         *next_flat_field_map_index += flat_field_map.len();\n 1710 |         flat_field_maps.push((result, flat_field_map));\n 1711 |         result\n 1712 |     }","lines":14,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/render.rs#L1699-L1712"},{"ref":"crates/generate/src/render.rs:683-713","code":"  683 |     fn add_field_sequences(&mut self) {\n  684 |         let mut flat_field_maps = vec![];\n  685 |         let mut next_flat_field_map_index = 0;\n  686 |         Self::get_field_map_id(\n  687 |             Vec::new(),\n  688 |             &mut flat_field_maps,\n  689 |             &mut next_flat_field_map_index,\n  690 |         );\n  691 | \n  692 |         let mut field_map_ids = Vec::with_capacity(self.parse_table.production_infos.len());\n  693 |         for production_info in &self.parse_table.production_infos {\n  694 |             if production_info.field_map.is_empty() {\n  695 |                 field_map_ids.push((0, 0));\n  696 |             } else {\n  697 |                 let mut flat_field_map = Vec::with_capacity(production_info.field_map.len());\n  698 |                 for (field_name, locations) in &production_info.field_map {\n  699 |                     for location in locations {\n  700 |                         flat_field_map.push((field_name.clone(), *location));\n  701 |                     }\n  702 |                 }\n  703 |                 let field_map_len = flat_field_map.len();\n  704 |                 field_map_ids.push((\n  705 |                     Self::get_field_map_id(\n  706 |                         flat_field_map,\n  707 |                         &mut flat_field_maps,\n  708 |                         &mut next_flat_field_map_index,\n  709 |                     ),\n  710 |                     field_map_len,\n  711 |                 ));\n  712 |             }\n  713 |         }","lines":31,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/generate/src/render.rs#L683-L713"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`symbol_table_insert_name` (used for every capture name, predicate identifier, and predicate string literal parsed out of a query) calls `symbol_table_id_for_name`, which does a linear scan over `self->slices` (`for (unsigned i = 0; i < self->slices.size; i++)`) comparing each existing name with `strncmp`. Since every distinct name/value insertion during `ts_query_new` re-scans all previously-inserted names, building a query with `N` distinct capture/predicate names costs `O(N^2)` string comparisons. Real-world query files (e.g. editor highlight/injection queries with hundreds of captures and predicates) can make query compilation noticeably slower than necessary.","fix":"Maintain a hash map (name/length -> id) alongside `SymbolTable.slices` so `symbol_table_id_for_name` is O(1) amortized instead of O(n), or at minimum keep the lookup path but avoid re-scanning entries that were already deduplicated in the same parse pass.","locations":[{"ref":"lib/src/query.c:920-933","code":"  920 | static int symbol_table_id_for_name(\n  921 |   const SymbolTable *self,\n  922 |   const char *name,\n  923 |   uint32_t length\n  924 | ) {\n  925 |   for (unsigned i = 0; i < self->slices.size; i++) {\n  926 |     Slice slice = *array_get(&self->slices, i);\n  927 |     if (\n  928 | rc/main.rs:2053-2056","code":" 2053 |     let version = BUILD_SHA.map_or_else(\n 2054 |         || BUILD_VERSION.to_string(),\n 2055 |         |build_sha| format!(\"{BUILD_VERSION} ({build_sha})\"),\n 2056 |     );","lines":4,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/cli/src/main.rs#L2053-L2056"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The `Region` struct is defined via an untagged `typedef struct { ...; struct Region *next; ... } Region;`. Because the outer struct has no tag, `struct Region` inside the body refers to a completely different, forward-declared, permanently-incomplete struct tag, not the `Region` typedef being defined. `next` therefore has type `struct Region *` (pointer to an incomplete, unrelated type) rather than `Region *`, while every use site (`free_list`, `curr`, `prev`, etc.) is typed `Region *`. The code only works because pointer representations happen to coincide; strict compilers will warn about incompatible pointer type assignments (e.g. `region->next = free_list;`, `curr = curr->next;`) and a stricter build (e.g. `-Werror=incompatible-pointer-types`) would fail to compile this file.","fix":"Use the typedef name directly for the self-referential pointer:\n```c\ntypedef struct {\n  size_t size;\n  struct Region *next;\n  char data[0];\n} Region;\n```\n->\n```c\ntypedef struct Region {\n  size_t size;\n  struct Region *next;\n  char data[0];\n} Region;\n```\n(giving the struct a matching tag so `struct Region` and `Region` refer to the same type), or simply declare `next` as `void *next;` and cast at use sites.","locations":[{"ref":"crates/language/wasm/src/stdlib.c:18-22","code":"   18 | typedef struct {\n   19 |   size_t size;\n   20 |   struct Region *next;\n   21 |   char data[0];\n   22 | } Region;","lines":5,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/language/wasm/src/stdlib.c#L18-L22"}]},{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`compile_parser_to_wasm` only serializes wasi-sdk/binaryen tool discovery with the in-process `WASM_TOOL_LOCK` mutex, then drops it before `download_tool` extracts the archive into the shared cache directory (`~/.cache/tree-sitter/<toolchain>/`). Unlike parser compilation, which uses a cross-process `LockFile` specifically to guard against concurrent `tree-sitter` invocations racing on the same output, no such file-based lock protects the toolchain download/extraction path. Two separate `tree-sitter` processes doing a first-time wasm build concurrently can both download and `tar -xzf --strip-components=1` into the same `tool_dir` at once, potentially interleaving/corrupting the extracted toolchain.","fix":"Guard `get_existing_tool`/`download_tool` with the same `LockFile` mechanism already used for parser compilation (keyed on the toolchain directory), so concurrent processes serialize the download/extract step instead of only threads within one process.","locations":[{"ref":"crates/loader/src/loader.rs:1415-1426","code":" 1415 |     pub fn compile_parser_to_wasm(\n 1416 |         &self,\n 1417 |         language_name: &str,\n 1418 |         src_path: &Path,\n 1419 |         scanner_filename: Option<&Path>,\n 1420 |         output_path: &Path,\n 1421 |     ) -> LoaderResult<()> {\n 1422 |         let tool_lock = WASM_TOOL_LOCK.lock().expect(\"Wasm tool mutex poisoned\");\n 1423 |         let clang_exe = Self::ensure_wasi_sdk_exists()?;\n 1424 |         let wasm_opt_exe = Self::ensure_binaryen_exists()?;\n 1425 |         drop(tool_lock);\n 1426 | ","lines":12,"link":"https://github.com/tree-sitter/tree-sitter/blob/f45a488dea5c98a93721566a2098a658dea73ecd/crates/loader/src/loader.rs#L1415-L1426"},{"ref":"crates/loader/src/loader.rs:1681-1745","code":" 1681 |     fn download_tool(\n 1682 |         tool_name: &'static str <script>
(function(){

// Data

const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};

const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {

}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;

  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
