<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The `man` subcommand calls `.expect(\"failed to open man page\")` on the result of spawning the external `man` binary. If `man` is not installed (common on minimal Linux/container images), `Command::status()` returns `Err` and rustup panics with a backtrace instead of returning a clean error. User-triggerable via `rustup man <cmd>`.","fix":"Replace `.expect(...)` with `?`-based error handling, e.g. `.status().context(\"failed to open man page; is `man` installed?\")?;` and propagate a `Result`.","locations":[{"ref":"src/cli/docs.rs:268-272","code":"  268 |     std::process::Command::new(\"man\")\n  269 |         .env(\"MANPATH\", manpaths)\n  270 |         .arg(command)\n  271 |         .status()\n  272 |         .expect(\"failed to open man page\");","lines":5,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/docs.rs#L268-L272"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"ImmediateUnpacker::deque calls `state.item.take().unwrap()` when `state.finished` is true. `finished` is set to true inside IncrementalFileWriter::write/chunk_submit on EOF or on a write error, which can occur before dispatch() stores the Item into `state.item` (the chunk submit callback and the dispatch of the IncrementalFile Item are independent code paths). If finished is observed with `item == None`, this unwrap panics during extraction.","fix":"Handle `state.item` being `None` gracefully (return an empty iterator / defer) instead of unwrapping, or guarantee the Item is stored before any chunk can mark the state finished.","locations":[{"ref":"src/diskio/immediate.rs:35-36","code":"   35 |             if state.finished {\n   36 |                 let mut item = state.item.take().unwrap();","lines":2,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/immediate.rs#L35-L36"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Manifest::query_components` uses `.expect(...)`/`panic!` in four places when looking up the `rust` package, the toolchain target, each component's package, and each component's target. These read an installed manifest; if it is hand-edited, partially written, or comes from a non-standard channel layout, any of these lookups can be `None` and crash rustup rather than surfacing a recoverable error.","fix":"Replace the `.expect`/`panic!` calls with `ok_or_else(|| anyhow!(...))?` and make `query_components` return the error to the caller.","locations":[{"ref":"src/dist/manifest.rs:466-492","code":"  466 |         let rust_pkg = self\n  467 |             .packages\n  468 |             .get(\"rust\")\n  469 |             .expect(\"manifest should contain a rust package\");\n  470 |         let targ_pkg = rust_pkg\n  471 |             .targets\n  472 |             .get(&desc.target)\n  473 |             .expect(\"installed manifest should have a known target\");\n  474 | \n  475 |         for component in &targ_pkg.components {\n  476 |             let installed = component.contained_within(&config.components);\n  477 | \n  478 |             let component_target = TargetTuple::new(component.target());\n  479 | \n  480 |             // Get the component so we can check if it is available\n  481 |             let component_pkg = self\n  482 |                 .get_package(component.short_name())\n  483 |                 .unwrap_or_else(|_| {\n  484 |                     panic!(\n  485 |                         \"manifest should contain component {}\",\n  486 |                         self.short_name(component)\n  487 |                     )\n  488 |                 });\n  489 |             let component_target_pkg = component_pkg\n  490 |                 .targets\n  491 |                 .get(&component_target)\n  492 |                 .expect(\"component should have target toolchain\");","lines":27,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/dist/manifest.rs#L466-L492"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`DistributableToolchain::add_components` uses `.expect(\"manifest should contain a rust package\")` and `.expect(\"installed manifest should have a known target\")` on manifest lookups. A corrupt or unexpected installed manifest (hand-edited, partial install, or a server-supplied manifest missing the `rust` package / the toolchain's own target) would panic the process instead of returning a `RustupError`.","fix":"Replace these `expect`s with proper error returns (e.g. `RustupError::CorruptComponent`/`MissingPackageForComponent`) so malformed manifests degrade gracefully.","locations":[{"ref":"src/toolchain/distributable.rs:75-82","code":"   75 |         let rust_pkg = manifest\n   76 |             .packages\n   77 |             .get(\"rust\")\n   78 |             .expect(\"manifest should contain a rust package\");\n   79 |         let targ_pkg = rust_pkg\n   80 |             .targets\n   81 |             .get(&self.desc.target)\n   82 |             .expect(\"installed manifest should have a known target\");","lines":8,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/toolchain/distributable.rs#L75-L82"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`rustc_or_cargo_exists_in_path` does `path.to_str().unwrap()` when constructing the error message. A `PATH` entry containing non-UTF-8 bytes (possible on Unix) would panic during the pre-install Rust-existence check.","fix":"Use `path.display()` instead of `path.to_str().unwrap()` so non-UTF-8 paths are rendered lossily rather than panicking.","locations":[{"ref":"src/cli/self_update.rs:630-632","code":"  630 |             if rustc.exists() || cargo.exists() {\n  631 |                 return Err(anyhow!(\"{}\", path.to_str().unwrap().to_owned()));\n  632 |             }","lines":3,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/self_update.rs#L630-L632"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`try_install_msvc` calls `exit_status.code().unwrap()` on the Visual Studio installer's exit status. On Windows a process terminated by a signal/exception can yield `None` from `code()`, panicking instead of reporting an install failure.","fix":"Handle the `None` case explicitly, e.g. `match exit_status.code() { Some(c) => VsInstallError(c), None => return Err(...) }`.","locations":[{"ref":"src/cli/self_update/windows.rs:308","code":"  308 |         match VsInstallError(exit_status.code().unwrap()) {","lines":1,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/self_update/windows.rs#L308"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Threaded::find_bucket panics via the trailing `assert!(capacity <= pool.size, ...)` for any capacity larger than the largest bucket (16 MiB). The loop only `break`s when a bucket's size >= capacity; for an oversized request it falls through to SixteenM and then asserts, aborting the process instead of returning an error. get_buffer/buffer_available/reclaim all route through this.","fix":"Either cap requested buffer sizes to IO_CHUNK_SIZE before calling find_bucket, or return a Result/clamp to the largest bucket instead of asserting.","locations":[{"ref":"src/diskio/threaded.rs:206-222","code":"  206 |     fn find_bucket(&self, capacity: usize) -> Bucket {\n  207 |         let mut bucket = Bucket::FourK;\n  208 |         for (next_bucket, pool) in &self.vec_pools {\n  209 |             bucket = next_bucket;\n  210 |             if pool.size >= capacity {\n  211 |                 break;\n  212 |             }\n  213 |         }\n  214 |         let pool = &self.vec_pools[bucket];\n  215 |         assert!(\n  216 |             capacity <= pool.size,\n  217 |             \"capacity <= pool.size: {} > {}\",\n  218 |             capacity,\n  219 |             pool.size\n  220 |         );\n  221 |         bucket\n  222 |     }","lines":17,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/threaded.rs#L206-L222"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`ToolchainDesc::manifest_v1_url` calls `panic!(\"not a real-world case\")` for the `(Some(date), do_staging=true)` branch. `do_manifest_staging` is driven by the `RUSTUP_STAGED_MANIFEST` env var; a user setting that var while also using a dated toolchain (e.g. `nightly-2024-01-01`) reaches this branch and aborts the process.","fix":"Return a normal error or build a sensible staged+dated URL instead of panicking on user-controllable input.","locations":[{"ref":"src/dist/mod.rs:300-308","code":"  300 |     pub(crate) fn manifest_v1_url(&self, dist_root: &str, process: &Process) -> String {\n  301 |         let do_manifest_staging = process.var(\"RUSTUP_STAGED_MANIFEST\").is_ok();\n  302 |         match (self.date.as_ref(), do_manifest_staging) {\n  303 |             (None, false) => format!(\"{}/channel-rust-{}\", dist_root, self.channel),\n  304 |             (Some(date), false) => format!(\"{}/{}/channel-rust-{}\", dist_root, date, self.channel),\n  305 |             (None, true) => format!(\"{}/staging/channel-rust-{}\", dist_root, self.channel),\n  306 |             (Some(_), true) => panic!(\"not a real-world case\"),\n  307 |         }\n  308 |     }","lines":9,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/dist/mod.rs#L300-L308"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`component.target.expect(\"component target should be known\")` is used in both `add_components` and `remove_component`. A component without a target (which the type system permits, `target: Option<...>`) reaching these paths panics. Reachability depends on manifest contents.","fix":"Convert to a `RustupError` (e.g. CorruptComponent) rather than panicking on a `None` target.","locations":[{"ref":"src/toolchain/distributable.rs:122","code":"  122 |             let target = component.target.expect(\"component target should be known\");","lines":1,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/toolchain/distributable.rs#L122"},{"ref":"src/toolchain/distributable.rs:414","code":"  414 |                         target: component.target.expect(\"component target should be known\"),","lines":1,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/toolchain/distributable.rs#L414"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`get_component_suggestion` calls `.expect(\"There should be always at least one component\")` on `min_by_key` over the component list. If `manifest.query_components` ever returns an empty list (e.g. an empty/edge-case manifest), both `min_by_key().expect(...)` calls panic. The surrounding code already tolerates a query error (returns None), but not an empty-but-Ok result.","fix":"Return `None` when the components iterator is empty instead of `expect`-ing a minimum element.","locations":[{"ref":"src/toolchain/distributable.rs:262-289","code":"  262 |         let components = manifest.query_components(&self.desc, config);\n  263 |         if let Ok(components) = components {\n  264 |             let short_name_distance = components\n  265 |                 .iter()\n  266 |                 .filter(|c| !only_installed || c.installed)\n  267 |                 .map(|c| {\n  268 |                     (\n  269 |                         damerau_levenshtein(\n  270 |                             &manifest.name(&c.component)[..],\n  271 |                             &manifest.name(component)[..],\n  272 |                         ),\n  273 |                         c,\n  274 |                     )\n  275 |                 })\n  276 |                 .min_by_key(|t| t.0)\n  277 |                 .expect(\"There should be always at least one component\");\n  278 | \n  279 |             let long_name_distance = components\n  280 |                 .iter()\n  281 |                 .filter(|c| !only_installed || c.installed)\n  282 |                 .map(|c| {\n  283 |                     (\n  284 |                         damerau_levenshtein(&c.component.name()[..], &manifest.name(component)[..]),\n  285 |                         c,\n  286 |                     )\n  287 |                 })\n  288 |                 .min_by_key(|t| t.0)\n  289 |                 .expect(\"There should be always at least one component\");","lines":28,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/toolchain/distributable.rs#L262-L289"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Pool::reclaim unconditionally does `*self.in_use.borrow_mut() -= self.size;`. If reclaim is ever called more times than claim (e.g. a completed Item whose buffer was never claimed via get_buffer, or double-completion through both the SubmitIterator and JoinIterator paths), this underflows `in_use` (usize) and panics in debug / wraps to a huge value in release, after which buffer_available math (`total_used + size < ram_budget`) and claim's watermark logic become meaningless. reclaim is driven from CompletedIo size classification, decoupled from how the buffer was actually allocated.","fix":"Use `saturating_sub` or assert in_use >= size with a clear message; ensure every reclaim is paired with exactly one claim, ideally by tracking the bucket on the buffer itself rather than re-deriving it from the completed item's length.","locations":[{"ref":"src/diskio/threaded.rs:79-81","code":"   79 |     fn reclaim(&self) {\n   80 |         *self.in_use.borrow_mut() -= self.size;\n   81 |     }","lines":3,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/threaded.rs#L79-L81"},{"ref":"src/diskio/threaded.rs:176-188","code":"  176 |     fn reclaim(&self, op: &CompletedIo) {\n  177 |         let size = match &op {\n  178 |             CompletedIo::Item(op) => match &op.kind {\n  179 |                 super::Kind::Directory => return,\n  180 |                 super::Kind::File(content) => content.len(),\n  181 |                 super::Kind::IncrementalFile(_) => return,\n  182 |             },\n  183 |             CompletedIo::Chunk(_) => super::IO_CHUNK_SIZE,\n  184 |         };\n  185 |         let bucket = self.find_bucket(size);\n  186 |         let pool = &self.vec_pools[bucket];\n  187 |         pool.reclaim();\n  188 |     }","lines":13,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/threaded.rs#L176-L188"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`env_var::inc` parses the existing recursion count and computes `old_value + 1` with no saturating/checked arithmetic. The parse type is inferred (i32). A maliciously or accidentally large RUST_RECURSION_COUNT (near i32::MAX) would overflow and panic in debug builds / wrap in release. Practically bounded by RUST_RECURSION_COUNT_MAX checks elsewhere, but `inc` itself does not enforce that bound.","fix":"Use `old_value.saturating_add(1)` and an explicit integer type (e.g. u32 to match RUST_RECURSION_COUNT_MAX).","locations":[{"ref":"src/env_var.rs:41-49","code":"   41 | pub(crate) fn inc(name: &str, cmd: &mut Command, process: &Process) {\n   42 |     let old_value = process\n   43 |         .var(name)\n   44 |         .ok()\n   45 |         .and_then(|v| v.parse().ok())\n   46 |         .unwrap_or(0);\n   47 | \n   48 |     cmd.env(name, (old_value + 1).to_string());\n   49 | }","lines":9,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/env_var.rs#L41-L49"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Windows PATH membership check in `_add_to_path` uses a raw UTF-16 substring scan (`old_path.windows(path_str.len()).any(...)`). It matches the cargo-bin path even when it appears as a substring of an unrelated, longer directory (e.g. existing entry `C:\\Users\\me\\.cargo\\binx` would make rustup believe `C:\\Users\\me\\.cargo\\bin` is already present and skip adding it). It ignores `;` delimiters entirely.","fix":"Split `old_path` on `;` and compare whole entries, rather than doing a delimiter-agnostic substring search.","locations":[{"ref":"src/cli/self_update/windows.rs:518-532","code":"  518 | fn _add_to_path(old_path: HSTRING, path_str: HSTRING) -> Option<HSTRING> {\n  519 |     if old_path.is_empty() {\n  520 |         Some(path_str)\n  521 |     } else if old_path\n  522 |         .windows(path_str.len())\n  523 |         .any(|path| *path == *path_str)\n  524 |     {\n  525 |         None\n  526 |     } else {\n  527 |         let mut new_path = path_str.to_os_string();\n  528 |         new_path.push(\";\");\n  529 |         new_path.push(old_path.to_os_string());\n  530 |         Some(HSTRING::from(new_path))\n  531 |     }\n  532 | }","lines":15,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/self_update/windows.rs#L518-L532"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Windows PATH removal in `_remove_from_path` has the same delimiter-agnostic substring problem: it finds the cargo-bin path anywhere in the PATH string and only checks the single character following it for a `;`. It does not verify that the match begins at an entry boundary, so a longer path that merely contains the cargo-bin substring can be partially mangled.","fix":"Tokenize PATH on `;` and remove the exact matching entry instead of a positional substring splice.","locations":[{"ref":"src/cli/self_update/windows.rs:535-556","code":"  535 | fn _remove_from_path(old_path: HSTRING, path_str: HSTRING) -> Option<HSTRING> {\n  536 |     let idx = old_path\n  537 |         .windows(path_str.len())\n  538 |         .position(|path| *path == *path_str)?;\n  539 |     // If there's a trailing semicolon (likely, since we probably added one\n  540 |     // during install), include that in the substring to remove. We don't search\n  541 |     // for that to find the string, because if it's the last string in the path,\n  542 |     // there may not be.\n  543 |     let mut len = path_str.len();\n  544 |     if old_path.get(idx + path_str.len()) == Some(&(b';' as u16)) {\n  545 |         len += 1;\n  546 |     }\n  547 | \n  548 |     let mut new_path = old_path[..idx].to_owned();\n  549 |     new_path.extend_from_slice(&old_path[idx + len..]);\n  550 |     // Don't leave a trailing ; though, we don't want an empty string in the\n  551 |     // path.\n  552 |     if new_path.last() == Some(&(b';' as u16)) {\n  553 |         new_path.pop();\n  554 |     }\n  555 |     Some(HSTRING::from_wide(&new_path))\n  556 | }","lines":22,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/self_update/windows.rs#L535-L556"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`ToolchainSection::is_empty` ignores the `profile` field. An override file (e.g. rust-toolchain.toml) that sets only `profile = \"default\"` and nothing else is treated as empty and rejected with `OverrideFileConfigError::Invalid`, even though `profile` is a real toolchain property the struct accepts. The sibling `OverrideFile::is_empty` delegates to this, so the inconsistency propagates.","fix":"Include `&& self.profile.is_none()` in `ToolchainSection::is_empty`, or document/decide that a profile-only override is deliberately disallowed and return a clearer error.","locations":[{"ref":"src/config.rs:70-77","code":"   70 | impl ToolchainSection {\n   71 |     fn is_empty(&self) -> bool {\n   72 |         self.channel.is_none()\n   73 |             && self.components.is_none()\n   74 |             && self.targets.is_none()\n   75 |             && self.path.is_none()\n   76 |     }\n   77 | }","lines":8,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/config.rs#L70-L77"},{"ref":"src/config.rs:50-54","code":"   50 | impl OverrideFile {\n   51 |     fn is_empty(&self) -> bool {\n   52 |         self.toolchain.is_empty()\n   53 |     }\n   54 | }","lines":5,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/config.rs#L50-L54"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `OverrideCfg::from_file`, when only a `path` is given but `targets`/`components`/`profile` are also present, it bails with an error. But the `profile` check is the only one of the three that is actually surfaced; more importantly, the path branch returns early via `return Ok(Self::PathBased(...))` before the `Official`/`Custom` match, so a path toolchain silently drops any validation that the path resolves to an installed toolchain here (validation only happens later). The combined-channel-and-path case (Some, Some) is handled, but a path plus options error message lists only generic 'toolchain options are ignored', which can confuse users who set just a profile.","fix":"Make the error message enumerate which options were ignored, and ensure path-based toolchains get the same existence validation as custom ones.","locations":[{"ref":"src/config.rs:202-220","code":"  202 |             (None, Some(path)) => {\n  203 |                 if file.toolchain.targets.is_some()\n  204 |                     || file.toolchain.components.is_some()\n  205 |                     || file.toolchain.profile.is_some()\n  206 |                 {\n  207 |                     bail!(\n  208 |                         \"toolchain options are ignored for path toolchain ({})\",\n  209 |                         path.display()\n  210 |                     )\n  211 |                 }\n  212 |                 // We -do not- support relative paths, they permit trivial\n  213 |                 // completely arbitrary code execution in a directory.\n  214 |                 // Longer term we'll not support path based toolchains at\n  215 |                 // all, because they also permit arbitrary code execution,\n  216 |                 // though with more challenges to exploit.\n  217 |                 return Ok(Self::PathBased(PathBasedToolchainName::try_from(\n  218 |                     &path as &Path,\n  219 |                 )?));\n  220 |             }","lines":19,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/config.rs#L202-L220"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `find_override_from_dir_walk`, when both `rust-toolchain` and `rust-toolchain.toml` exist, a warning is emitted and `path_rust_toolchain` (the legacy file) is used with `ParseMode::Both`. The warning text uses `{0}` to say 'using contents of {0}' referencing the legacy file — correct — but silently ignoring `rust-toolchain.toml` means a project that migrated to the `.toml` form while leaving a stale legacy file will use the stale config. This is by-design precedence but is a foot-gun worth surfacing more loudly (warn is easy to miss) given the TOML is the documented modern format.","fix":"Consider preferring `rust-toolchain.toml` when both exist (or at minimum elevating the diagnostic), aligning with the documented modern format.","locations":[{"ref":"src/config.rs:707-723","code":"  707 |                 (Ok(contents), Ok(_)) => {\n  708 |                     // both `rust-toolchain` and `rust-toolchain.toml` exist\n  709 | \n  710 |                     warn!(\n  711 |                         \"both {} and {} exist; using contents of {0}\",\n  712 |                         path_rust_toolchain\n  713 |                             .canonicalize()\n  714 |                             .unwrap_or_else(|_| PathBuf::from(&path_rust_toolchain))\n  715 |                             .display(),\n  716 |                         path_rust_toolchain_toml\n  717 |                             .canonicalize()\n  718 |                             .unwrap_or_else(|_| PathBuf::from(&path_rust_toolchain_toml))\n  719 |                             .display(),\n  720 |                     );\n  721 | \n  722 |                     (path_rust_toolchain, Ok(contents), ParseMode::Both)\n  723 |                 }","lines":17,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/config.rs#L707-L723"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`rustc_version` reads only the first line of stdout via `read_line`, but on the timeout path (`Ok(None)`) it kills the child and returns a timeout string; on `Ok(Some(_))` non-success or `Err(_)` it falls through to return '(error reading rustc version)'. However, when `read_line` returns Ok(0) (empty stdout but success), `line` is empty and `line1 = Some(\"\")` — the function then returns an empty string as the version rather than an error marker. An empty success-but-no-output case yields a misleading empty version string.","fix":"Treat an empty read result as the '(error reading rustc version)' case (check `line.is_empty()` / read count > 0 before setting `line1`).","locations":[{"ref":"src/toolchain.rs:300-327","code":"  300 |                 let mut line1 = None;\n  301 |                 if let Ok(mut child) = cmd.spawn() {\n  302 |                     let timeout = Duration::new(10, 0);\n  303 |                     match child.wait_timeout(timeout) {\n  304 |                         Ok(Some(status)) if status.success() => {\n  305 |                             let out = child\n  306 |                                 .stdout\n  307 |                                 .expect(\"Child::stdout requested but not present\");\n  308 |                             let mut line = String::new();\n  309 |                             if BufReader::new(out).read_line(&mut line).is_ok() {\n  310 |                                 let lineend = line.trim_end_matches(&['\\r', '\\n'][..]).len();\n  311 |                                 line.truncate(lineend);\n  312 |                                 line1 = Some(line);\n  313 |                             }\n  314 |                         }\n  315 |                         Ok(None) => {\n  316 |                             let _ = child.kill();\n  317 |                             return String::from(\"(timeout reading rustc version)\");\n  318 |                         }\n  319 |                         Ok(Some(_)) | Err(_) => {}\n  320 |                     }\n  321 |                 }\n  322 | \n  323 |                 if let Some(line1) = line1 {\n  324 |                     line1\n  325 |                 } else {\n  326 |                     String::from(\"(error reading rustc version)\")\n  327 |                 }","lines":28,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/toolchain.rs#L300-L327"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Toolchain::ensure_removed` handles a dangling symlink by calling `fs::remove_dir_all(&path)`. If the toolchain path is a symlink to (or itself is) a file rather than a directory, `remove_dir_all` fails with an error on most platforms, leaving the dangling link in place and surfacing a confusing error. The branch assumes a dangling *directory* symlink.","fix":"Use `fs::remove_file` for symlinks (removing the link itself, not its target), or detect file-vs-dir symlink and dispatch accordingly.","locations":[{"ref":"src/toolchain.rs:570-574","code":"  570 |                 // Might be a dangling symlink\n  571 |                 if path.is_symlink() {\n  572 |                     info!(\"uninstalling toolchain {name}\");\n  573 |                     fs::remove_dir_all(&path)?;\n  574 |                     true","lines":5,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/toolchain.rs#L570-L574"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"format_path_for_display locates the UNC prefix `\\\\?\\` anywhere in the string with `path.find`, but then unconditionally strips the first 4 bytes via `path[4..]`, ignoring the actual match position. If the prefix is not at byte 0 (or appears after other characters), the wrong 4 bytes are removed, corrupting the displayed path. The match index returned by `find` is discarded.","fix":"Only strip when the prefix is at the start, e.g. `path.strip_prefix(r\"\\\\?\\\").map(str::to_owned).unwrap_or_else(|| path.to_owned())`, or use the returned index from `find` instead of the hardcoded `4`.","locations":[{"ref":"src/utils/mod.rs:413-420","code":"  413 | pub(crate) fn format_path_for_display(path: &str) -> String {\n  414 |     let unc_present = path.find(r\"\\\\?\\\");\n  415 | \n  416 |     match unc_present {\n  417 |         None => path.to_owned(),\n  418 |         Some(_) => path[4..].to_owned(),\n  419 |     }\n  420 | }","lines":8,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/utils/mod.rs#L413-L420"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`confirm` treats any unrecognized answer as `false` (decline) rather than re-prompting or honoring the default. Typing e.g. `Y ` (trailing space), `yes please`, or a typo silently aborts the action even though the prompt implies a default. The empty-input case respects the default, but a non-empty non-matching input ignores it. Compare `question_bool`, which falls back to the default for unrecognized input - the two helpers are inconsistent.","fix":"For unrecognized non-empty input, either re-prompt or fall back to `default`, matching `question_bool` semantics.","locations":[{"ref":"src/cli/common.rs:37-42","code":"   37 |     let r = match &*input.to_lowercase() {\n   38 |         \"y\" | \"yes\" => true,\n   39 |         \"n\" | \"no\" => false,\n   40 |         \"\" => default,\n   41 |         _ => false,\n   42 |     };","lines":6,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/common.rs#L37-L42"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_target` is named/typed as returning `Option<TargetTuple>` but can never return `None`: when `target` is `None` it falls back to `Some(distributable.desc().target.clone())`. The `Option` wrapper is misleading - callers always get `Some`, so component-add/remove can never operate target-agnostically even if that were intended.","fix":"If a wildcard (None) target is never desired, change the return type to `TargetTuple`; otherwise add a code path that yields `None`.","locations":[{"ref":"src/cli/rustup_mode.rs:1612-1619","code":" 1612 | fn get_target(\n 1613 |     target: Option<String>,\n 1614 |     distributable: &DistributableToolchain<'_>,\n 1615 | ) -> Option<TargetTuple> {\n 1616 |     target\n 1617 |         .map(TargetTuple::new)\n 1618 |         .or_else(|| Some(distributable.desc().target.clone()))\n 1619 | }","lines":8,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/rustup_mode.rs#L1612-L1619"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SelfUpdateMode::update` early-returns success when invoked with `Self::Disable` (the `_ => return Ok(SUCCESS)` arm) but only enters the actual update flow for `Self::Enable if should_self_update`. The CheckOnly arm runs `check_rustup_update` ignoring `should_self_update`; this means `--no-self-update` does NOT suppress the network check when auto-self-update mode is `check-only`, which is surprising given the flag's name.","fix":"If `should_self_update` is false, skip even the CheckOnly network probe (return early), or document that `--no-self-update` does not affect check-only mode.","locations":[{"ref":"src/cli/self_update.rs:517-524","code":"  517 |         match self {\n  518 |             Self::Enable if should_self_update => (),\n  519 |             Self::CheckOnly => {\n  520 |                 check_rustup_update(dl_cfg).await?;\n  521 |                 return Ok(ExitCode::SUCCESS);\n  522 |             }\n  523 |             _ => return Ok(ExitCode::SUCCESS),\n  524 |         }","lines":8,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/self_update.rs#L517-L524"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`parse_new_rustup_version` uses regex `[0-9]+.[0-9]+.[0-9]+[0-9a-zA-Z-]*` where the `.` separators are unescaped and thus match any character. A `--version` string like `1x2y3` would be accepted as a version. Cosmetic but the comment/intent is to match dotted semver.","fix":"Escape the dots: `r\"[0-9]+\\.[0-9]+\\.[0-9]+[0-9a-zA-Z-]*\"`.","locations":[{"ref":"src/cli/self_update.rs:1206-1207","code":" 1206 |     static RE: LazyLock<Regex> =\n 1207 |         LazyLock::new(|| Regex::new(r\"[0-9]+.[0-9]+.[0-9]+[0-9a-zA-Z-]*\").unwrap());","lines":2,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/self_update.rs#L1206-L1207"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"is_network_failure only returns true for the Reqwest variant gated behind `#[cfg(any(reqwest-rustls-tls, reqwest-native-tls))]`; with neither TLS feature the function is compiled to always return false. download() uses this to decide whether to preserve a partial download on resume failure. If a build ever lacks both features (or for the file: scheme path, where errors are never Reqwest), a transient failure is misclassified as fatal and the cached partial download is deleted, defeating resume.","fix":"Also classify io::Error kinds (TimedOut, ConnectionReset, etc.) as network failures so resume works regardless of the TLS backend.","locations":[{"ref":"src/download/mod.rs:335-341","code":"  335 | pub(crate) fn is_network_failure(err: &anyhow::Error) -> bool {\n  336 |     match err.downcast_ref::<DownloadError>() {\n  337 |         #[cfg(any(feature = \"reqwest-rustls-tls\", feature = \"reqwest-native-tls\"))]\n  338 |         Some(DownloadError::Reqwest(e)) => e.is_timeout() || e.is_connect(),\n  339 |         _ => false,\n  340 |     }\n  341 | }","lines":7,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/download/mod.rs#L335-L341"},{"ref":"src/download/mod.rs:147-153","code":"  147 |         let e = if !(self.resume && is_network_failure(&err))\n  148 |             && let Err(file_err) = remove_file(self.path).context(\"cleaning up cached downloads\")\n  149 |         {\n  150 |             file_err.context(err)\n  151 |         } else {\n  152 |             err\n  153 |         };","lines":7,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/download/mod.rs#L147-L153"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_component_suggestion`: the `closest_match` selection logic is convoluted and has an asymmetry. In the `short > long` branch it may set `closest_match` to a *target* string (`long_name_distance.1.component.target()`) when only targets differ; in the `else` branch it likewise may set a target. But `closest_distance` is only reassigned in the `short > long` branch, so the final `MAX_DISTANCE` comparison can use `short_name_distance` while `closest_match` was derived from logic that conflated short-name and target suggestions. The result can suggest a target string while gating on a short-name distance, producing an inconsistent suggestion.","fix":"Compute the chosen (distance, match) pair atomically (pick the smaller of short/long once, then derive the display string from that same choice) so the gating distance and the suggested string always come from the same candidate.","locations":[{"ref":"src/toolchain/distributable.rs:291-320","code":"  291 |             let mut closest_distance = short_name_distance;\n  292 |             let mut closest_match = manifest\n  293 |                 .short_name(&short_name_distance.1.component)\n  294 |                 .to_owned();\n  295 | \n  296 |             // Find closer suggestion\n  297 |             if short_name_distance.0 > long_name_distance.0 {\n  298 |                 closest_distance = long_name_distance;\n  299 | \n  300 |                 // Check if only targets differ\n  301 |                 if closest_distance.1.component.short_name() == component.short_name() {\n  302 |                     closest_match = long_name_distance.1.component.target();\n  303 |                 } else {\n  304 |                     closest_match = long_name_distance.1.component.short_name().to_string();\n  305 |                 }\n  306 |             } else {\n  307 |                 // Check if only targets differ\n  308 |                 if manifest.short_name(&closest_distance.1.component)\n  309 |                     == manifest.short_name(component)\n  310 |                 {\n  311 |                     closest_match = short_name_distance.1.component.target();\n  312 |                 }\n  313 |             }\n  314 | \n  315 |             // If suggestion is too different don't suggest anything\n  316 |             if closest_distance.0 > MAX_DISTANCE {\n  317 |                 None\n  318 |             } else {\n  319 |                 Some(closest_match)\n  320 |             }","lines":30,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/toolchain/distributable.rs#L291-L320"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"In `show`, `last_index = installed_toolchains.len().wrapping_sub(1)` is used to decide whether to print a trailing blank line between verbose entries. If there are zero installed toolchains, `wrapping_sub(1)` yields `usize::MAX`; harmless here because the loop body never runs with an empty list, but the `wrapping_sub` obscures intent and would misbehave if the loop were ever entered.","fix":"Use `len().saturating_sub(1)` or guard the empty case explicitly for clarity.","locations":[{"ref":"src/cli/rustup_mode.rs:1302-1328","code":" 1302 |     let last_index = installed_toolchains.len().wrapping_sub(1);\n 1303 |     for (n, toolchain_name) in installed_toolchains.into_iter().enumerate() {\n 1304 |         let is_default_toolchain = default_toolchain_name.as_ref() == Some(&toolchain_name);\n 1305 |         let is_active_toolchain = active_toolchain_name == Some(&toolchain_name);\n 1306 | \n 1307 |         let status_str = match (is_active_toolchain, is_default_toolchain) {\n 1308 |             (true, true) => \" (active, default)\",\n 1309 |             (true, false) => \" (active)\",\n 1310 |             (false, true) => \" (default)\",\n 1311 |             (false, false) => \"\",\n 1312 |         };\n 1313 | \n 1314 |         let mut t = t.lock();\n 1315 | \n 1316 |         writeln!(t, \"{toolchain_name}{CONTEXT}{status_str}{CONTEXT:#}\")?;\n 1317 | \n 1318 |         if verbose {\n 1319 |             let toolchain = Toolchain::new(cfg, toolchain_name.into())?;\n 1320 |             writeln!(\n 1321 |                 t,\n 1322 |                 \"  {}\\n  path: {}\",\n 1323 |                 toolchain.rustc_version(),\n 1324 |                 toolchain.path().display()\n 1325 |             )?;\n 1326 |             if n != last_index {\n 1327 |                 writeln!(t)?;\n 1328 |             }","lines":27,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/rustup_mode.rs#L1302-L1328"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`do_remove_from_path` and `remove_legacy_source_command` unwrap `String::from_utf8(new_bytes)` of rewritten rcfile contents. An rcfile containing valid-but-non-UTF-8 bytes (e.g. a latin-1 comment) that was read via `utils::read_file` would already have errored, but if read succeeds and the splice lands on a char boundary incorrectly this `.unwrap()` could panic. Low likelihood but it is a hard unwrap on user file content.","fix":"Operate on the `String` directly (line-based) so re-encoding is unnecessary, or use `String::from_utf8_lossy`/propagate the error.","locations":[{"ref":"src/cli/self_update/unix.rs:66","code":"   66 |                 let new_file = String::from_utf8(new_bytes).unwrap();","lines":1,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/self_update/unix.rs#L66"},{"ref":"src/cli/self_update/unix.rs:155","code":"  155 |             let new_file = String::from_utf8(new_bytes).unwrap();","lines":1,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/self_update/unix.rs#L155"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"write_file_incremental does `let contents = recv.recv().unwrap();` in the threaded write loop. The comment justifies it by saying the sender only closes on a tar read failure that propagates in the main thread, but a panic in the producer thread (or any future refactor that drops the sender early) turns a recoverable I/O path into a hard panic inside a pool worker thread.","fix":"Treat `recv.recv()` returning Err as a clean termination (break) or convert it into an io::Error returned from the function, instead of unwrapping.","locations":[{"ref":"src/diskio/mod.rs:417-421","code":"  417 |     if let IncrementalFile::ThreadedReceiver(recv) = content_callback {\n  418 |         loop {\n  419 |             // We unwrap here because the documented only reason for recv to fail is a close by the sender, which is reading\n  420 |             // from the tar file: a failed read there will propagate the error in the main thread directly.\n  421 |             let contents = recv.recv().unwrap();","lines":5,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/mod.rs#L417-L421"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `download` (cached-file path), a checksum mismatch on a cached file triggers `fs::remove_file(&target_file)` and then falls through to re-download. But if `file_hash` returned a wrong hash due to a swallowed read error (see the `file_hash` finding), a perfectly good cached file is deleted and re-downloaded without any error being reported, masking the underlying I/O problem.","fix":"Once `file_hash` propagates read errors, surface them here instead of treating every non-match as a stale cache; only delete on a genuine content mismatch.","locations":[{"ref":"src/dist/download.rs:68-78","code":"   68 |         if target_file.exists() {\n   69 |             let cached_result = file_hash(&target_file)?;\n   70 |             if hash == cached_result {\n   71 |                 debug!(\"reusing previously downloaded file\");\n   72 |                 debug!(url = url.as_ref(), \"checksum passed\");\n   73 |                 return Ok(File { path: target_file });\n   74 |             } else {\n   75 |                 warn!(\"bad checksum for cached download\");\n   76 |                 fs::remove_file(&target_file).context(\"cleaning up previous download\")?;\n   77 |             }\n   78 |         }","lines":11,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/dist/download.rs#L68-L78"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `Toolchain::new`, when the toolchain does not exist it calls `cfg.active_toolchain()` to compute `is_active`, discarding any error with `matches!(cfg.active_toolchain(), Ok(Some((t, _))) if t == name)`. An error determining the active toolchain is silently treated as 'not active'. This is only for an error message field, but a failing settings read here is masked.","fix":"This is acceptable for a cosmetic flag, but consider logging at trace level when `active_toolchain()` errors so the masked failure is diagnosable.","locations":[{"ref":"src/toolchain.rs:116-117","code":"  116 |                     let is_active = matches!(cfg.active_toolchain(), Ok(Some((t, _))) if t == name);\n  117 |                     RustupError::ToolchainNotInstalled { name, is_active }","lines":2,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/toolchain.rs#L116-L117"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"canonicalize_path silently swallows all canonicalization errors and returns the original path after a warn! log. Callers cannot distinguish a successfully canonicalized path from a fallback, which can mask real filesystem problems (e.g. permission errors) and lead to later operations acting on a non-canonical path.","fix":"Where the caller needs correctness, return a Result; otherwise document clearly that the fallback is best-effort and ensure callers tolerate a non-canonical path.","locations":[{"ref":"src/utils/mod.rs:162-167","code":"  162 | pub(crate) fn canonicalize_path(path: &Path) -> PathBuf {\n  163 |     fs::canonicalize(path).unwrap_or_else(|_| {\n  164 |         warn!(\"could not canonicalize path {}\", path.display());\n  165 |         PathBuf::from(path)\n  166 |     })\n  167 | }","lines":6,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/utils/mod.rs#L162-L167"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"Pool::claim and buffer_available compare RefCell<usize> values directly (`self.in_use == self.high_watermark`, `pool.in_use < pool.high_watermark`). These rely on RefCell's PartialEq/PartialOrd, which transparently borrow the cells. It works today, but it obscures that a runtime borrow occurs and will panic at runtime if any of these cells is already mutably borrowed on the same thread during the comparison. The intent (compare inner counts) is far from obvious.","fix":"Read the values explicitly (`*self.in_use.borrow() == *self.high_watermark.borrow()`) so the borrows are visible, or switch these counters to Cell<usize> which is the correct primitive for single-threaded Copy counters.","locations":[{"ref":"src/diskio/threaded.rs:72-77","code":"   72 |     fn claim(&self) {\n   73 |         if self.in_use == self.high_watermark {\n   74 |             *self.high_watermark.borrow_mut() += self.size;\n   75 |         }\n   76 |         *self.in_use.borrow_mut() += self.size;\n   77 |     }","lines":6,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/threaded.rs#L72-L77"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`ColorableTerminal::width` always queries `Term::stdout().size().1` as the fallback width, even when the terminal instance is a stderr stream (`ColorableTerminal::stderr`). The width of stderr's terminal can differ from stdout's (or stdout may be redirected while stderr is a tty), so progress bars/wrapping on stderr can use the wrong width.","fix":"Track which stream the terminal wraps and query `Term::stderr().size()` for stderr terminals, or store the stream selector.","locations":[{"ref":"src/process/terminal_source.rs:110-116","code":"  110 | impl TermLike for ColorableTerminal {\n  111 |     fn width(&self) -> u16 {\n  112 |         match self.width {\n  113 |             Some(n) => n.get(),\n  114 |             None => Term::stdout().size().1,\n  115 |         }\n  116 |     }","lines":7,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/process/terminal_source.rs#L110-L116"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`find_override_from_dir_walk` reads both `rust-toolchain` and `rust-toolchain.toml` from disk on every directory in the walk up the tree, for every directory, even when neither is present. Each iteration issues two `read_file` syscalls (open+read) regardless. For deep directory trees this multiplies filesystem traffic; a stat/exists check first, or short-circuiting, would avoid the redundant reads.","fix":"Probe existence (or read lazily) and avoid attempting to read the second file once the first is found, reducing two reads-per-dir to the minimum needed.","locations":[{"ref":"src/config.rs:695-724","code":"  695 |             let (toolchain_file, contents, parse_mode) = match (\n  696 |                 utils::read_file(\"toolchain file\", &path_rust_toolchain),\n  697 |                 utils::read_file(\"toolchain file\", &path_rust_toolchain_toml),\n  698 |             ) {\n  699 |                 (contents, Err(_)) => {\n  700 |                     // no `rust-toolchain.toml` exists\n  701 |                     (path_rust_toolchain, contents, ParseMode::Both)\n  702 |                 }\n  703 |                 (Err(_), Ok(contents)) => {\n  704 |                     // only `rust-toolchain.toml` exists\n  705 |                     (path_rust_toolchain_toml, Ok(contents), ParseMode::OnlyToml)\n  706 |                 }\n  707 |                 (Ok(contents), Ok(_)) => {\n  708 |                     // both `rust-toolchain` and `rust-toolchain.toml` exist\n  709 | \n  710 |                     warn!(\n  711 |                         \"both {} and {} exist; using contents of {0}\",\n  712 |                         path_rust_toolchain\n  713 |                             .canonicalize()\n  714 |                             .unwrap_or_else(|_| PathBuf::from(&path_rust_toolchain))\n  715 |                             .display(),\n  716 |                         path_rust_toolchain_toml\n  717 |                             .canonicalize()\n  718 |                             .unwrap_or_else(|_| PathBuf::from(&path_rust_toolchain_toml))\n  719 |                             .display(),\n  720 |                     );\n  721 | \n  722 |                     (path_rust_toolchain, Ok(contents), ParseMode::Both)\n  723 |                 }\n  724 |             };","lines":30,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/config.rs#L695-L724"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In write_file and write_file_incremental (and IncrementalFileWriter::new), `let path_display = format!(\"{}\", path.display());` allocates a String for every file written, even though it is only consumed by trace_scoped! macros that are no-ops unless tracing is enabled. For the docs workload (~20k files) this is 20k+ needless allocations on the hot extraction path.","fix":"Compute path_display lazily inside the trace_scoped! invocation, or guard it behind the same cfg/condition that enables tracing.","locations":[{"ref":"src/diskio/mod.rs:380","code":"  380 |     let path_display = format!(\"{}\", path.display());","lines":1,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/mod.rs#L380"},{"ref":"src/diskio/mod.rs:412","code":"  412 |     let path_display = format!(\"{}\", path.display());","lines":1,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/mod.rs#L412"},{"ref":"src/diskio/immediate.rs:159","code":"  159 |         let path_display = format!(\"{}\", path.display());","lines":1,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/immediate.rs#L159"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In `target_remove`, the `has_at_most_one_target` check re-fetches and re-iterates `distributable.components()?` on every loop iteration (once per target being removed), even though the component set only meaningfully changes after a removal. For many targets this repeatedly parses the manifest component list.","fix":"Compute the installed-target count once before the loop (or recompute only when needed) instead of inside every iteration.","locations":[{"ref":"src/cli/rustup_mode.rs:1522-1543","code":" 1522 |     for target in targets {\n 1523 |         let target = TargetTuple::new(target);\n 1524 |         let default_target = cfg.default_host_tuple()?;\n 1525 |         if target == default_target {\n 1526 |             warn!(\n 1527 |                 \"removing the default host target; proc-macros and build scripts might no longer build\"\n 1528 |             );\n 1529 |         }\n 1530 |         // Whether we have at most 1 component target that is not `None` (wildcard).\n 1531 |         let has_at_most_one_target = distributable\n 1532 |             .components()?\n 1533 |             .into_iter()\n 1534 |             .filter_map(|c| match (c.installed, c.component.target) {\n 1535 |                 (true, Some(t)) => Some(t),\n 1536 |                 _ => None,\n 1537 |             })\n 1538 |             .unique()\n 1539 |             .at_most_one()\n 1540 |             .is_ok();\n 1541 |         if has_at_most_one_target {\n 1542 |             warn!(\"removing the last target; no build targets will be available\");\n 1543 |         }","lines":22,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/rustup_mode.rs#L1522-L1543"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`toolchain_link` contains an `if true { ... } else { ... }` where the `else` branch (the `InstallMethod::Copy` path) is unreachable dead code. The `Copy` install method is never exercised here.","fix":"Remove the `if true`/`else` scaffolding and keep only the `InstallMethod::Link` branch, or restore a real condition if a copy mode is intended.","locations":[{"ref":"src/cli/rustup_mode.rs:1680-1690","code":" 1680 |     if true {\n 1681 |         InstallMethod::Link {\n 1682 |             src: &cfg.current_dir.join(src),\n 1683 |             dest,\n 1684 |             cfg,\n 1685 |         }\n 1686 |         .install(None)\n 1687 |         .await?;\n 1688 |     } else {\n 1689 |         InstallMethod::Copy { src, dest, cfg }.install(None).await?;\n 1690 |     }","lines":11,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/rustup_mode.rs#L1680-L1690"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`MetadataVersion::V12` arm in `upgrade_data` is `unreachable!()`. While reachable-in-theory only if `default()` changes, the match is exhaustive over just V2/V12 and the early-return at the top already handles the `current == default` (V12) case, so the V12 arm is structurally dead. If a future V13 default is added without revisiting this, the `unreachable!()` becomes an actual panic path for V12-on-disk upgrades.","fix":"Replace the `unreachable!()` with a real no-op/error message, and add a compile-time reminder (or handle all known versions) so adding a new default version forces updating this match.","locations":[{"ref":"src/config.rs:537-573","code":"  537 |         let current_version = self.settings_file.with(|s| Ok(s.version))?;\n  538 |         if current_version == MetadataVersion::default() {\n  539 |             info!(\"nothing to upgrade: metadata version is already '{current_version}'\");\n  540 |             return Ok(());\n  541 |         }\n  542 | \n  543 |         info!(\n  544 |             \"upgrading metadata version from {current_version} to {}\",\n  545 |             MetadataVersion::default()\n  546 |         );\n  547 |         match current_version {\n  548 |             MetadataVersion::V2 => {\n  549 |                 // The toolchain installation format changed. Just delete them all.\n  550 |                 warn!(\n  551 |                     \"this upgrade will remove all existing toolchains; you will need to reinstall them\"\n  552 |                 );\n  553 | \n  554 |                 let dirs = utils::read_dir(\"toolchains\", &self.toolchains_dir)?;\n  555 |                 for dir in dirs {\n  556 |                     let dir = dir.context(\"IO Error reading toolchains\")?;\n  557 |                     utils::remove_dir(\"toolchain\", &dir.path())?;\n  558 |                 }\n  559 | \n  560 |                 // Also delete the update hashes\n  561 |                 let files = utils::read_dir(\"update hashes\", &self.update_hash_dir)?;\n  562 |                 for file in files {\n  563 |                     let file = file.context(\"IO Error reading update hashes\")?;\n  564 |                     utils::remove_file(\"update hash\", &file.path())?;\n  565 |                 }\n  566 | \n  567 |                 self.settings_file.with_mut(|s| {\n  568 |                     s.version = MetadataVersion::default();\n  569 |                     Ok(())\n  570 |                 })\n  571 |             }\n  572 |             MetadataVersion::V12 => unreachable!(),\n  573 |         }","lines":37,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/config.rs#L537-L573"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In ImmediateUnpacker::deque, the inner `if state.finished` at line 52 is nested directly inside the outer `if state.finished` block (line 43) and `state.finished` is never mutated in between, so the inner condition is always true. The guard around `*guard = None;` is redundant. The `// Case 1: pending errors` comment is also misleading: this branch handles the finished case, where an error is only optionally present.","fix":"Remove the redundant inner `if state.finished` and unconditionally set `*guard = None;`. Fix the comment to describe the finished case rather than 'pending errors'.","locations":[{"ref":"src/diskio/immediate.rs:35-46","code":"   35 |             if state.finished {\n   36 |                 let mut item = state.item.take().unwrap();\n   37 |                 if state.err.is_some() {\n   38 |                     let err = state.err.take().unwrap();\n   39 |                     item.result = err;\n   40 |                 }\n   41 |                 item.finish = item\n   42 |                     .start\n   43 |                     .map(|s| Instant::now().saturating_duration_since(s));\n   44 |                 if state.finished {\n   45 |                     *guard = None;\n   46 |                 }","lines":12,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/immediate.rs#L35-L46"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The `panic!(\"RUSTUP_UNPACK_RAM must be larger than {minimum_ram}\")` at the end of unpack_ram is unreachable: every branch that produces `unpack_ram` already guarantees it is >= minimum_ram (the Some branch clamps to [minimum_ram, default_max_unpack_ram], and default_max_unpack_ram is itself >= minimum_ram in all cases). The final `if minimum_ram > unpack_ram` can never be true.","fix":"Drop the unreachable panic and just return `unpack_ram`, or convert the invariant into a debug_assert.","locations":[{"ref":"src/diskio/mod.rs:525-530","code":"  525 |     if minimum_ram > unpack_ram {\n  526 |         panic!(\"RUSTUP_UNPACK_RAM must be larger than {minimum_ram}\");\n  527 |     } else {\n  528 |         unpack_ram\n  529 |     }\n  530 | }","lines":6,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/diskio/mod.rs#L525-L530"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`PackageTargets::get_mut` is a public-in-crate method that returns a mutable `TargetedPackage`, but no caller in this layer uses it (only `get`, `get_target`, and direct field access are used). If unused project-wide it is dead API surface.","fix":"Remove `get_mut` if it has no callers, or document why it is retained.","locations":[{"ref":"src/dist/manifest.rs:533-538","code":"  533 |     pub fn get_mut<'a>(&'a mut self, target: &TargetTuple) -> Option<&'a mut TargetedPackage> {\n  534 |         match self {\n  535 |             Self::Wildcard(tpkg) => Some(tpkg),\n  536 |             Self::Targeted(tpkgs) => tpkgs.get_mut(target),\n  537 |         }\n  538 |     }","lines":6,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/dist/manifest.rs#L533-L538"}]},

{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment on `from_host`'s Windows `arch_fallback` says it uses `GetNativeSystemInfo` and 'Does not support detecting aarch64', and returns only AMD64/INTEL. That is accurate, but the outer comment 'Default to msvc' at the tuple-construction site is the only place the gnu-vs-msvc decision is documented; meanwhile `can_run` treats windows-gnu and windows-msvc as interchangeable. Not a code bug, but the 'Default to msvc' rationale (host is always reported as msvc even on a gnu host) is undocumented and surprising for readers tracing host detection.","fix":"Add a short comment explaining that the host tuple is always synthesized as `-msvc` and why (gnu/msvc are run-compatible per `can_run`), so the hardcoded `msvc` suffix is not mistaken for a bug.","locations":[{"ref":"src/dist/mod.rs:544-568","code":"  544 |             /// Get the host architecture using `GetNativeSystemInfo`.\n  545 |             /// Does not support detecting aarch64.\n  546 |             fn arch_fallback() -> Option<&'static str> {\n  547 |                 use windows_sys::Win32::System::SystemInformation::GetNativeSystemInfo;\n  548 | \n  549 |                 const PROCESSOR_ARCHITECTURE_AMD64: u16 = 9;\n  550 |                 const PROCESSOR_ARCHITECTURE_INTEL: u16 = 0;\n  551 | \n  552 |                 let mut sys_info;\n  553 |                 unsafe {\n  554 |                     sys_info = mem::zeroed();\n  555 |                     GetNativeSystemInfo(&mut sys_info);\n  556 |                 }\n  557 | \n  558 |                 match unsafe { sys_info.Anonymous.Anonymous }.wProcessorArchitecture {\n  559 |                     PROCESSOR_ARCHITECTURE_AMD64 => Some(\"x86_64\"),\n  560 |                     PROCESSOR_ARCHITECTURE_INTEL => Some(\"i686\"),\n  561 |                     _ => None,\n  562 |                 }\n  563 |             }\n  564 | \n  565 |             // Default to msvc\n  566 |             let arch = arch_primary().or_else(arch_fallback)?;\n  567 |             let msvc_tuple = format!(\"{arch}-pc-windows-msvc\");\n  568 |             Some(TargetTuple(msvc_tuple))","lines":25,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/dist/mod.rs#L544-L568"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment on `Toolchain::ensure_removed` is empty (just `/// Remove the toolchain from disk` followed by two blank doc lines), and `installed_paths`/`get_hash_file` etc. carry stale 'XXX'/'TODO' breadcrumbs. Minor, but the empty trailing doc lines are noise.","fix":"Trim the empty doc lines; convert actionable TODO/XXX notes into tracked issues.","locations":[{"ref":"src/toolchain.rs:543-546","code":"  543 |     /// Remove the toolchain from disk\n  544 |     ///\n  545 |     ///\n  546 |     pub fn ensure_removed(cfg: &Cfg<'_>, name: LocalToolchainName) -> anyhow::Result<()> {","lines":4,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/toolchain.rs#L543-L546"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"In the topical_doc documentation table comment, several example rows are inconsistent/typo'd: 'std::AAA::FFF std/AAA/fn.FFF9.html' has a stray '9'; 'alloc::module ... alloc/core/module' and 'core:AAA::SSS std/AAA/struct.SSS.html root/coreAAA' have garbled directory columns. These mislead readers about the resolution logic.","fix":"Correct the example rows to reflect actual path resolution (e.g. `fn.FFF.html`, `root/alloc/module`, `root/core/AAA`).","locations":[{"ref":"src/cli/topical_doc.rs:92-107","code":"   92 |     alloc::module alloc/module/index.html alloc/core/module\n   93 | \n   94 |     # len() == 2, ending with ::\n   95 |     std::module   std/module/index.html   root/std/module\n   96 |     core::module  core/module/index.html  root/core/module\n   97 |     alloc::module alloc/module/index.html alloc/core/module\n   98 | \n   99 |     # len() > 2\n  100 |     # search for index.html in rel_path\n  101 |     std::AAA::MMM std/AAA/MMM/index.html     root/std/AAA/MMM\n  102 | \n  103 |     # OR check if parent() dir exists and search for fn/struct/etc\n  104 |     std::AAA::FFF std/AAA/fn.FFF9.html       root/std/AAA\n  105 |     std::AAA::SSS std/AAA/struct.SSS.html    root/std/AAA\n  106 |     core:AAA::SSS std/AAA/struct.SSS.html    root/coreAAA\n  107 |     alloc:AAA::SSS std/AAA/struct.SSS.html   root/coreAAA","lines":16,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/topical_doc.rs#L92-L107"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The active/default status-string match and the toolchain-listing scaffolding are duplicated between `show` (rustup_mode.rs) and `list_toolchains::print_toolchain` (common.rs). Both compute the same `(is_active, is_default) -> \" (active, default)\"` mapping and iterate installed toolchains with near-identical formatting.","fix":"Extract the status-string mapping into a shared helper and reuse it in both places.","locations":[{"ref":"src/cli/rustup_mode.rs:1307-1316","code":" 1307 |         let status_str = match (is_active_toolchain, is_default_toolchain) {\n 1308 |             (true, true) => \" (active, default)\",\n 1309 |             (true, false) => \" (active)\",\n 1310 |             (false, true) => \" (default)\",\n 1311 |             (false, false) => \"\",\n 1312 |         };\n 1313 | \n 1314 |         let mut t = t.lock();\n 1315 | \n 1316 |         writeln!(t, \"{toolchain_name}{CONTEXT}{status_str}{CONTEXT:#}\")?;","lines":10,"link":"https://github.com/rust-lang/rustup/blob/6a21fc9bb4e00860c9ca85a4d8859b7980606e81/src/cli/rustup_mode.rs#L1307-L1316"},{"ref":"src/cli/common.rs:365-387","code":"  365 |         let status_str = match (is_default, is_active) {\n  366 |             (true, true) => \" (active, default)\",\n  367 |             (true, false) => \" (default)\",\n  368 |             (false, true) => \" (active)\",\n  369 |             (false, false) => \"\",\n  370 |         };\n  371 | \n  372 |         let toolchain_path = cfg.toolchains_dir.join(toolchain);\n  373 |         let toolchain_meta = fs::symlink_metadata(&toolchain_path)?;\n  374 |         let toolchain_path = if verbose {\n  375 |             if toolchain_meta.is_dir() {\n  376 |                 format!(\" {}\", toolchain_path.display())\n  377 |             } else {\n  378 |                 format!(\" {}\", fs::read_link(toolchain_path)?.display())\n  379 |
