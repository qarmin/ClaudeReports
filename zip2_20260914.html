{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Drop for ZipWriter calls finalize() and only writes the error to stderr, silently dropping I/O failures (e.g. disk full while writing the central directory). This is documented ('may silently fail') but means a dropped, unfinished writer can produce a truncated/corrupt archive with no programmatic signal.","fix":"Cannot return errors from Drop, but consider a debug_assert in tests and ensure docs strongly steer users to call finish()/finalize() explicitly; optionally expose a flag the user can poll after drop is impossible — at minimum keep this caveat prominent.","locations":[{"ref":"src/write.rs:1543-1554","code":" 1543 | impl<W: Write + Seek> Drop for ZipWriter<W> {\n 1544 |     fn drop(&mut self) {\n 1545 |         if !self.inner.is_closed()\n 1546 |             && let Err(e) = self.finalize()\n 1547 |         {\n 1548 |             let _ = write!(\n 1549 |                 io::stderr(),\n 1550 |                 \"ZipWriter::drop: failed to finalize archive: {e:?}\"\n 1551 |             );\n 1552 |         }\n 1553 |     }\n 1554 | }","lines":12,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/write.rs#L1543-L1554"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Trailing/undocumented bytes are skipped by allocating a throwaway heap buffer\n`vec![0; bytes_to_read]` and reading into it. This allocates on every extended\ntimestamp parse that has leftover bytes; the data is immediately discarded.","fix":"Skip the bytes without allocation, e.g.\n`std::io::copy(&mut reader.take(bytes_to_read as u64), &mut std::io::sink())` (and\nverify the copied count to detect truncation), or read into a small fixed stack\nbuffer in a loop.","locations":[{"ref":"src/extra_fields/extended_timestamp.rs:137-140","code":"  137 |         if bytes_to_read > 0 {\n  138 |             // ignore undocumented bytes\n  139 |             reader.read_exact(&mut vec![0; bytes_to_read])?;\n  140 |         }","lines":4,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/extra_fields/extended_timestamp.rs#L137-L140"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The overlapping-copy fallbacks push one byte at a time inside `for _ in 0..len { dst.push(dst[dst.len()-dist]) }`.\nFor long highly-overlapping back-references this is a hot byte-by-byte loop with a bounds check and\na `dst.len()` recomputation per iteration. The same byte-at-a-time pattern is duplicated in the\nimplicit-zero path. These dominate decompression time for adversarial inputs that maximize overlap.","fix":"Use a chunked copy (e.g. copy `dist` bytes at a time doubling the run) or `Vec` capacity reservation + `copy_within` in segments to amortize bounds checks.","locations":[{"ref":"src/legacy/reduce.rs:158-174","code":"  158 |                 let copy_len = len.min(uncomp_len - dst.len());\n  159 |                 for _ in 0..copy_len {\n  160 |                     let byte = dst[dst.len() - dist];\n  161 |                     dst.push(byte);\n  162 |                 }\n  163 |             }\n  164 |         } else {\n  165 |             // Copy with implicit zeros\n  166 |             let copy_len = len.min(uncomp_len - dst.len());\n  167 |             for _ in 0..copy_len {\n  168 |                 if dist > dst.len() {\n  169 |                     dst.push(0);\n  170 |                 } else {\n  171 |                     let byte = dst[dst.len() - dist];\n  172 |                     dst.push(byte);\n  173 |                 }\n  174 |             }","lines":17,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/reduce.rs#L158-L174"},{"ref":"src/legacy/implode.rs:153-169","code":"  153 |             } else {\n  154 |                 // Overlapping copy\n  155 |                 for _ in 0..len {\n  156 |                     let byte = dst[dst.len() - dist as usize];\n  157 |                     dst.push(byte);\n  158 |                 }\n  159 |             }\n  160 |         } else {\n  161 |             // Copy with implicit zeros\n  162 |             for _ in 0..len {\n  163 |                 if dist as usize > dst.len() {\n  164 |                     dst.push(0);\n  165 |                 } else {\n  166 |                     let byte = dst[dst.len() - dist as usize];\n  167 |                     dst.push(byte);\n  168 |                 }\n  169 |             }","lines":17,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/implode.rs#L153-L169"},{"ref":"src/legacy/shrink.rs:173-175","code":"  173 |         for i in ct.last_dst_pos..ct.last_dst_pos + ct.len as usize {\n  174 |             dst.push(dst[i]);\n  175 |         }","lines":3,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L173-L175"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"All three decoders read the entire compressed stream into memory with `read_to_end` and decode\nthe entire output into `self.stream` on the first `read()` call, ignoring `uncompressed_size` as a\nhard cap on allocation. `dst.reserve(uncompressed_size)` / `stream.reserve(uncompressed_size)` is\ncalled with the attacker-supplied `uncompressed_size` (cast from `u64` to `usize`), allowing a\ncrafted header to request a huge up-front allocation (memory-amplification DoS) before any data is\nvalidated.","fix":"Cap the initial reservation to a sane bound (e.g. min(uncompressed_size, compressed_len * factor)) and grow as needed; validate uncompressed_size against the compressed size.","locations":[{"ref":"src/legacy/shrink.rs:233-234","code":"  233 | fn hwunshrink(src: &[u8], uncompressed_size: usize, dst: &mut Vec<u8>) -> io::Result<()> {\n  234 |     dst.reserve(uncompressed_size);","lines":2,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L233-L234"},{"ref":"src/legacy/shrink.rs:346-352","code":"  346 |             self.compressed_reader.read_to_end(&mut compressed_bytes)?;\n  347 |             self.stream.reserve(self.uncompressed_size as usize);\n  348 |             hwunshrink(\n  349 |                 &compressed_bytes,\n  350 |                 self.uncompressed_size as usize,\n  351 |                 &mut self.stream,\n  352 |             )?;","lines":7,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L346-L352"},{"ref":"src/legacy/reduce.rs:106-107","code":"  106 |     // Pre-allocate to avoid reallocations\n  107 |     dst.reserve(uncomp_len);","lines":2,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/reduce.rs#L106-L107"},{"ref":"src/legacy/implode.rs:96-97","code":"   96 |     // Pre-allocate capacity\n   97 |     dst.reserve(uncomp_len);","lines":2,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/implode.rs#L96-L97"},{"ref":"src/legacy/implode.rs:213-214","code":"  213 |             // Pre-allocate stream buffer\n  214 |             self.stream.reserve(self.uncompressed_size as usize);","lines":2,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/implode.rs#L213-L214"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`Decompressor::new` includes match arms for `CompressionMethod::Lzma` (line 518) producing a Lzma decompressor, but there is no corresponding `CompressionMethod::Lzma => ...` decoding path inconsistency: more notably, the `Decompressor` enum and the `Read`/`into_inner` impls handle Lzma, yet `SUPPORTED_COMPRESSION_METHODS` (lines 291-305) omits Lzma and Deflate64 even though decoders exist for them. This makes `SUPPORTED_COMPRESSION_METHODS` an unreliable indicator of which methods can actually be read, which callers may use for capability checks.","fix":"Either document that SUPPORTED_COMPRESSION_METHODS lists only round-trippable (write+read) methods, or add the read-only-supported methods (Lzma, Deflate64) so the list reflects decode capability. Clarify the constant's contract.","locations":[{"ref":"src/compression.rs:339-353","code":"  339 | pub const SUPPORTED_COMPRESSION_METHODS: &[CompressionMethod] = &[\n  340 |     CompressionMethod::Stored,\n  341 |     #[cfg(feature = \"_deflate-any\")]\n  342 |     CompressionMethod::Deflated,\n  343 |     #[cfg(feature = \"deflate64\")]\n  344 |     CompressionMethod::Deflate64,\n  345 |     #[cfg(feature = \"_bzip2_any\")]\n  346 |     CompressionMethod::Bzip2,\n  347 |     #[cfg(feature = \"zstd\")]\n  348 |     CompressionMethod::Zstd,\n  349 |     #[cfg(feature = \"xz\")]\n  350 |     CompressionMethod::Xz,\n  351 |     #[cfg(feature = \"ppmd\")]\n  352 |     CompressionMethod::Ppmd,\n  353 | ];","lines":15,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/compression.rs#L339-L353"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In the all-ASCII branch (`!self.iter().any(|c| *c >= 0x80)`), every byte is < 0x80,\nwhich is always valid UTF-8. Therefore `std::str::from_utf8` can never fail here and\nthe `map_err(...)` / `InvalidData` error construction is unreachable. The error\nmessage \"Cannot translate path from cp437\" can never be produced.","fix":"Replace the fallible conversion with the infallible\n`std::str::from_utf8` over guaranteed-ASCII bytes (e.g. via `unsafe`/`from_utf8_unchecked`\nwith a comment, or keep `from_utf8` but drop the unreachable error mapping), or use\n`Cow::Borrowed(std::str::from_utf8(self).expect(\"ascii is valid utf8\"))` style with a\nclear invariant comment.","locations":[{"ref":"src/cp437.rs:17-31","code":"   17 |     fn from_cp437(self) -> Self::Target {\n   18 |         let target = if self.iter().any(|c| *c >= 0x80) {\n   19 |             let s = self.iter().copied().map(to_char).collect::<String>();\n   20 |             std::borrow::Cow::Owned(s)\n   21 |         } else {\n   22 |             let s = std::str::from_utf8(self).map_err(|e| {\n   23 |                 std::io::Error::new(\n   24 |                     std::io::ErrorKind::InvalidData,\n   25 |                     format!(\"Cannot translate path from cp437: {e}\"),\n   26 |                 )\n   27 |             })?;\n   28 |             std::borrow::Cow::Borrowed(s)\n   29 |         };\n   30 |         Ok(target)\n   31 |     }","lines":15,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/cp437.rs#L17-L31"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"Several leftover items: commented-out `HASH_BITS`/`HASHTAB_SIZE` constants (shrink.rs:17-18),\nthe commented `// num_syms:usize` field (huffman.rs:29) and its commented assert (huffman.rs:164)\nwhich were actually load-bearing for bounds safety, and the `pk101_bug_compat` parameter of\n`hwexplode` which is always passed `false` from `ImplodeDecoder` (implode.rs:221) so the\n`min_len`-related branch for it (implode.rs:108) is unreachable in production.","fix":"Remove dead constants/fields, and either wire up `pk101_bug_compat` properly or drop it; restore the `num_syms` bounds check rather than leaving it commented.","locations":[{"ref":"src/legacy/shrink.rs:17-18","code":"   17 | // const HASH_BITS: usize = MAX_CODE_SIZE + 1; /* For a load factor of 0.5. */\n   18 | // const HASHTAB_SIZE: usize = 1 << HASH_BITS;","lines":2,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L17-L18"},{"ref":"src/legacy/huffman.rs:29","code":"   29 |     // num_syms:usize","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/huffman.rs#L29"},{"ref":"src/legacy/huffman.rs:164","code":"  164 |                 //assert(sym_idx < self.num_syms);","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/huffman.rs#L164"},{"ref":"src/legacy/implode.rs:108-112","code":"  108 |     let min_len = if (pk101_bug_compat && large_wnd) || (!pk101_bug_compat && lit_tree) {\n  109 |         3\n  110 |     } else {\n  111 |         2\n  112 |     };","lines":5,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/implode.rs#L108-L112"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`UnixFileModes::add_mode` is annotated `#[cfg_attr(not(debug_assertions), allow(unused))]`\nand its only non-debug effect is `self.map.insert(...)` whose return value is solely used by\n`debug_assert_eq!(old_entry, None)`. The comment above the assert says receiving two modes\nfor the same path is \"not remotely out of the ordinary\" and that the later one is taken — yet\nthe debug_assert will panic in debug builds exactly when that ordinary situation occurs\n(two entries with the same extracted path). The comment and the assertion contradict each\nother.","fix":"Remove the contradictory `debug_assert_eq!`, or change the comment; duplicate paths from a crafted archive should not panic even in debug builds.","locations":[{"ref":"src/read/mod.rs:178-184","code":"  178 |     #[cfg_attr(not(debug_assertions), allow(unused))]\n  179 |     pub fn add_mode(&mut self, path: std::path::PathBuf, mode: u32) {\n  180 |         // We don't print a warning or consider it remotely out of the ordinary to receive two\n  181 |         // separate modes for the same path: just take the later one.\n  182 |         let old_entry = self.map.insert(path, mode);\n  183 |         debug_assert_eq!(old_entry, None);\n  184 |     }","lines":7,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/mod.rs#L178-L184"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`ZipCryptoKeys::encrypt_byte` is marked `#[allow(dead_code)]` and `ZipCryptoWriter` / `CHUNK_SIZE` are gated behind `#[allow(unused)]`, indicating the ZipCrypto write path may be compiled but unused in some configurations. Dead/optionally-dead crypto code paths are easy to leave untested and can drift from the read path; the `encrypt_byte` correctness is only exercised indirectly. Worth confirming these are actually reachable/tested in the shipping configuration.","fix":"Remove the allow attributes and the dead code if the ZipCrypto writer is unused, or ensure it is compiled and covered by round-trip tests in the relevant feature configuration.","locations":[{"ref":"src/zipcrypto.rs:93-98","code":"   93 |     #[allow(dead_code)]\n   94 |     fn encrypt_byte(&mut self, plain_byte: u8) -> u8 {\n   95 |         let cipher_byte: u8 = self.stream_byte() ^ plain_byte;\n   96 |         self.update(plain_byte);\n   97 |         cipher_byte\n   98 |     }","lines":6,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/zipcrypto.rs#L93-L98"},{"ref":"src/zipcrypto.rs:183-188","code":"  183 | #[allow(unused)]\n  184 | pub(crate) struct ZipCryptoWriter<W> {\n  185 |     pub(crate) writer: W,\n  186 |     pub(crate) keys: ZipCryptoKeys,\n  187 |     pub(crate) buffer: [u8; CHUNK_SIZE],\n  188 | }","lines":6,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/zipcrypto.rs#L183-L188"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `Display` impl claims to \"duplicate what the Debug format looks like, i.e, the enum key\", but it maps the numeric method to a name via `name_from_u16`. For `CompressionMethod::Unsupported(v)` and `CompressionMethod::Reduce(n)` the Debug output (e.g. `Unsupported(99)`, `Reduce(2)`) differs from Display (`name_from_u16` gives `Aes` for 99, `Reduce(1)` for serialize value 2 of Reduce(1)). The comment is therefore misleading; the unit test `to_display_fmt` only checks SUPPORTED methods so the divergence is untested.","fix":"Correct the comment to note Display uses the canonical method name (not the Rust enum Debug form) and that Unsupported/Reduce variants will differ from Debug. Optionally implement Display to honor Debug for non-named variants.","locations":[{"ref":"src/compression.rs:329-336","code":"  329 | impl fmt::Display for CompressionMethod {\n  330 |     fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  331 |         // Just duplicate what the Debug format looks like, i.e, the enum key:\n  332 |         let method_u16 = self.serialize_to_u16();\n  333 |         let name = Self::name_from_u16(method_u16);\n  334 |         write!(f, \"{name}\")\n  335 |     }\n  336 | }","lines":8,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/compression.rs#L329-L336"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comments are inaccurate/leftover from a C port. `CodeQueue::next` says it returns\n\"INVALID_CODE if the queue is empty\" but it returns `Option<u16>` (`None`); there is no\n`INVALID_CODE`. `read_follower_sets`'s comment \"Returns true on success\" (reduce.rs:22) is wrong —\nit returns `io::Result<FollowerSetArray>`. `read_huffman_code`'s comment \"Returns false if the\ninput is invalid\" (implode.rs:19) is likewise wrong — it returns a `Result`.","fix":"Update the comments to describe the actual `Option`/`Result` return types.","locations":[{"ref":"src/legacy/shrink.rs:35-46","code":"   35 |     // Return the next code in the queue, or INVALID_CODE if the queue is empty.\n   36 |     fn next(&self) -> Option<u16> {\n   37 |         //   assert(q->next_idx < sizeof(q->codes) / sizeof(q->codes[0]));\n   38 |         if let Some(Some(next)) = self.codes.get(self.next_idx) {\n   39 |             Some(*next)\n   40 |         } else {\n   41 |             None\n   42 |         }\n   43 |     }\n   44 | \n   45 |     /// Return and remove the next code from the queue, or return INVALID_CODE if\n   46 |     /// the queue is empty.","lines":12,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L35-L46"},{"ref":"src/legacy/reduce.rs:22","code":"   22 | /// Read the follower sets from is into fsets. Returns true on success.","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/reduce.rs#L22"},{"ref":"src/legacy/implode.rs:18-19","code":"   18 | /// Initialize the Huffman decoder d with num_lens codeword lengths read from is.\n   19 | /// Returns false if the input is invalid.","lines":2,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/implode.rs#L18-L19"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comments for `OptimisticMagicFinder` and the inline comment at line 282 state that a\nmandatory initial guess will \"produce an error\" if it does not match. The code instead\nreturns `Ok(None)` in every mandatory-failure branch (lines 269 and 283-285), never an\n`Err`. The comment is misleading about the actual control flow.","fix":"Fix the comments to say it yields `Ok(None)` (no further searching), or change the code to actually return an error when a mandatory guess fails.","locations":[{"ref":"src/read/magic_finder.rs:223-224","code":"  223 | /// The guess can be marked as mandatory to produce an error. This is useful\n  224 | /// if the `ArchiveOffset` is known and auto-detection is not desired.","lines":2,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/magic_finder.rs#L223-L224"},{"ref":"src/read/magic_finder.rs:282-285","code":"  282 |             // If a match is not found, but the initial guess was mandatory, return an error.\n  283 |             if mandatory {\n  284 |                 return Ok(None);\n  285 |             }","lines":4,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/magic_finder.rs#L282-L285"},{"ref":"src/read/magic_finder.rs:268-270","code":"  268 |                         if mandatory {\n  269 |                             return Ok(None);\n  270 |                         }","lines":3,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/magic_finder.rs#L268-L270"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `KEYSTREAM_BITMASK` doc comment claims masking the low bits \"corresponding to the step described in the ZipCrypto specification variously as `| 2` or `| 3`\", but the constant is `2` and applied as `| Wrapping(2)`, which sets only bit 1 and never forces bit 0. The justification that `| 2` and `| 3` \"give the same keystream\" is asserted without the masking actually being `| 3`; the standard ZipCrypto computation uses `temp | 2` then `(temp * (temp ^ 1)) >> 8`, which the code does implement correctly, but the comment's `| 3` equivalence claim is misleading and unverified in-code.","fix":"Tighten the comment to state exactly that bit 1 is set (`| 2`) per the standard formula, and drop or rigorously justify the `| 3` equivalence claim.","locations":[{"ref":"src/zipcrypto.rs:51-55","code":"   51 |     /// Bitmask applied to the lower 2 bits of `key_2` when computing the\n   52 |     /// `ZipCrypto` keystream base, corresponding to the step described\n   53 |     /// in the `ZipCrypto` specification variously as `| 2` or `| 3` (both give the same keystream\n   54 |     /// due to the use of `keystream_base * (keystream_base ^ Wrapping(1))` and a quirk of CRC32).\n   55 |     const KEYSTREAM_BITMASK: u16 = 2;","lines":5,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/zipcrypto.rs#L51-L55"},{"ref":"src/zipcrypto.rs:81-85","code":"   81 |     fn stream_byte(&mut self) -> u8 {\n   82 |         let keystream_base: Wrapping<u16> =\n   83 |             Wrapping((self.key_2.0 & 0xFFFF) as u16) | Wrapping(Self::KEYSTREAM_BITMASK);\n   84 |         ((keystream_base * (keystream_base ^ Wrapping(1))) >> 8).0 as u8\n   85 |     }","lines":5,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/zipcrypto.rs#L81-L85"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Format specifier '{header_id:#06}' formats the id as zero-padded decimal (the '#' has no effect without a type like x/b), not as the intended hex; the hex form is printed separately right after, so the first number is redundant/misleading in the error message.","fix":"Use a single clear representation, e.g. format!(\"Extra data header ID 0x{header_id:04x} requires crate feature \\\"unreserved\\\"\").","locations":[{"ref":"src/write.rs:662-665","code":"  662 |                         return Err(ZipError::Io(io::Error::other(format!(\n  663 |                             \"Extra data header ID {header_id:#06} (0x{header_id:x}) \\\n  664 |                             requires crate feature \\\"unreserved\\\"\",\n  665 |                         ))));","lines":4,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/write.rs#L662-L665"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"hard","description":"The back-reference copy logic (non-overlapping `extend_from_within`, overlapping byte loop, and\nimplicit-zero fill) is duplicated almost verbatim between `reduce.rs` and `implode.rs`, and the\n`Read` impls of all three decoders (`stream_read` one-shot decode + `read_pos` slicing) are\nnear-identical copies. Bug fixes (e.g. the `saturating_sub` issue above) must be applied in\nmultiple places.","fix":"Extract a shared `copy_backref(dst, dist, len, uncomp_len)` helper and a shared decoder `Read` adapter.","locations":[{"ref":"src/legacy/reduce.rs:149-175","code":"  149 |         // Output the back reference.\n  150 |         if dist <= dst.len() {\n  151 |             // Optimize for non-overlapping copies\n  152 |             if dist >= len {\n  153 |                 // No overlap, can use extend_from_within\n  154 |                 let start = dst.len() - dist;\n  155 |                 dst.extend_from_within(start..start + len.min(uncomp_len - dst.len()));\n  156 |             } else {\n  157 |                 // Overlapping copy\n  158 |                 let copy_len = len.min(uncomp_len - dst.len());\n  159 |                 for _ in 0..copy_len {\n  160 |                     let byte = dst[dst.len() - dist];\n  161 |                     dst.push(byte);\n  162 |                 }\n  163 |             }\n  164 |         } else {\n  165 |             // Copy with implicit zeros\n  166 |             let copy_len = len.min(uncomp_len - dst.len());\n  167 |             for _ in 0..copy_len {\n  168 |                 if dist > dst.len() {\n  169 |                     dst.push(0);\n  170 |                 } else {\n  171 |                     let byte = dst[dst.len() - dist];\n  172 |                     dst.push(byte);\n  173 |                 }\n  174 |             }\n  175 |         }","lines":27,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/reduce.rs#L149-L175"},{"ref":"src/legacy/implode.rs:147-170","code":"  147 |         // Optimize the copy loop using extend_from_within when possible\n  148 |         if dist as usize <= dst.len() {\n  149 |             if dist as usize >= len {\n  150 |                 // No overlap in copy, can use extend_from_within\n  151 |                 let start = dst.len() - dist as usize;\n  152 |                 dst.extend_from_within(start..start + len);\n  153 |             } else {\n  154 |                 // Overlapping copy\n  155 |                 for _ in 0..len {\n  156 |                     let byte = dst[dst.len() - dist as usize];\n  157 |                     dst.push(byte);\n  158 |                 }\n  159 |             }\n  160 |         } else {\n  161 |             // Copy with implicit zeros\n  162 |             for _ in 0..len {\n  163 |                 if dist as usize > dst.len() {\n  164 |                     dst.push(0);\n  165 |                 } else {\n  166 |                     let byte = dst[dst.len() - dist as usize];\n  167 |                     dst.push(byte);\n  168 |                 }\n  169 |             }\n  170 |         }","lines":24,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/implode.rs#L147-L170"},{"ref":"src/legacy/shrink.rs:341-363","code":"  341 | impl<R: Read> Read for ShrinkDecoder<R> {\n  342 |     fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> {\n  343 |         if !self.stream_read {\n  344 |             self.stream_read = true;\n  345 |             let mut compressed_bytes = Vec::new();\n  346 |             self.compressed_reader.read_to_end(&mut compressed_bytes)?;\n  347 |             self.stream.reserve(self.uncompressed_size as usize);\n  348 |             hwunshrink(\n  349 |                 &compressed_bytes,\n  350 |                 self.uncompressed_size as usize,\n  351 |                 &mut self.stream,\n  352 |             )?;\n  353 |         }\n  354 |         let available = self.stream.len().saturating_sub(self.read_pos);\n  355 |         if available == 0 {\n  356 |             return Ok(0);\n  357 |         }\n  358 |         let n = available.min(buf.len());\n  359 |         buf[..n].copy_from_slice(&self.stream[self.read_pos..self.read_pos + n]);\n  360 |         self.read_pos += n;\n  361 |         Ok(n)\n  362 |     }\n  363 | }","lines":23,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L341-L363"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`extract_internal` is a large method that mixes many responsibilities: root-dir detection,\npath simplification, per-entry symlink/dir/file dispatch, in-loop nested symlink resolution\n(via `safe_prepare_path`), timestamp setting, and a deferred unix-permissions pass. The\nin-source TODO at lines 393-396 explicitly flags that the control flow is \"extremely\ndifficult to follow\" and questions the duplicated directory arguments and nested loop. This\nhampers auditing the security-critical extraction path.","fix":"Split into helpers (resolve_output_path, extract_symlink, extract_dir, extract_file, apply_permissions) and clarify the dual `directory` / `outpath` arguments.","locations":[{"ref":"src/read/mod.rs:349-432","code":"  349 |     fn extract_internal<P: AsRef<Path>>(\n  350 |         &mut self,\n  351 |         directory: P,\n  352 |         root_dir_filter: Option<impl RootDirFilter>,\n  353 |     ) -> ZipResult<()> {\n  354 |         use std::fs;\n  355 | \n  356 |         fs::create_dir_all(&directory)?;\n  357 |         let directory = directory.as_ref().canonicalize()?;\n  358 | \n  359 |         let root_dir = root_dir_filter\n  360 |             .and_then(|filter| {\n  361 |                 self.root_dir(&filter)\n  362 |                     .transpose()\n  363 |                     .map(|root_dir| root_dir.map(|root_dir| (root_dir, filter)))\n  364 |             })\n  365 |             .transpose()?;\n  366 | \n  367 |         // If we have a root dir, simplify the path components to be more\n  368 |         // appropriate for passing to `safe_prepare_path`\n  369 |         let root_dir = root_dir\n  370 |             .as_ref()\n  371 |             .map(|(root_dir, filter)| {\n  372 |                 crate::path::simplified_components(root_dir)\n  373 |                     .ok_or_else(|| {\n  374 |                         // Should be unreachable\n  375 |                         debug_assert!(false, \"Invalid root dir path\");\n  376 | \n  377 |                         invalid!(\"Invalid root dir path\")\n  378 |                     })\n  379 |                     .map(|root_dir| (root_dir, filter))\n  380 |             })\n  381 |             .transpose()?;\n  382 | \n  383 |         #[cfg(unix)]\n  384 |         let mut files_by_unix_mode = UnixFileModes::default();\n  385 | \n  386 |         for i in 0..self.len() {\n  387 |             let mut file = self.by_index(i)?;\n  388 | \n  389 |             let mut outpath = directory.clone();\n  390 |             /* TODO: the control flow of this method call and subsequent expectations about the\n  391 |              *       values in this loop is extremely difficult to follow. It also appears to\n  392 |              *       perform a nested loop upon extracting every single file entry? Why does it\n  393 |              *       accept two arguments that point to the same directory path, one mutable? */\n  394 |             file.safe_prepare_path(directory.as_ref(), &mut outpath, root_dir.as_ref())?;\n  395 | \n  396 |             #[cfg(any(unix, windows))]\n  397 |             if file.is_symlink() {\n  398 |                 let mut target = Vec::with_capacity(file.size() as usize);\n  399 |                 file.read_to_end(&mut target)?;\n  400 |                 drop(file);\n  401 |                 make_symlink(&outpath, &target, &self.shared.files)?;\n  402 |                 continue;\n  403 |             } else if file.is_dir() {\n  404 |                 make_writable_dir_all(&outpath)?;\n  405 |                 continue;\n  406 |             }\n  407 |             let mut outfile = fs::File::create(&outpath)?;\n  408 |             io::copy(&mut file, &mut outfile)?;\n  409 | \n  410 |             // Check for real permissions, which we'll set in a second pass.\n  411 |             #[cfg(unix)]\n  412 |             if let Some(mode) = file.unix_mode <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
