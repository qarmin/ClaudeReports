<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}

.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`AesReader::new` computes `data_length` as `compressed_size - (PWD_VERIFY_LENGTH + AUTH_CODE_LENGTH + aes_mode.salt_length())` using plain `u64` subtraction. `compressed_size` comes directly from untrusted archive metadata (`data.compressed_size`, see src/read/readers.rs:220 and src/read/zip_archive.rs:239). For any AES entry whose declared compressed size is smaller than the fixed AES overhead (e.g. salt 8/12/16 + 2 verify + 10 auth = 20/24/28 bytes), this subtraction underflows: in debug builds it panics, and in release builds it wraps to a near-`u64::MAX` value. A wrapped `data_length` then makes `AesReaderValid::read` try to read an essentially unbounded amount of data, turning a malformed entry into a denial-of-service / huge allocation vector instead of a clean error.","fix":"Make `new` fallible (return `ZipResult`) and use `compressed_size.checked_sub(overhead)`, returning an `InvalidArchive`/`InvalidData` error when the declared size is smaller than the required AES overhead instead of subtracting unconditionally.","locations":[{"ref":"src/aes.rs:143-152","code":"  143 |     pub const fn new(reader: R, aes_mode: AesMode, compressed_size: u64) -> AesReader<R> {\n  144 |         let data_length = compressed_size\n  145 |             - (PWD_VERIFY_LENGTH + AUTH_CODE_LENGTH + aes_mode.salt_length()) as u64;\n  146 | \n  147 |         Self {\n  148 |             reader,\n  149 |             aes_mode,\n  150 |             data_length,\n  151 |         }\n  152 |     }","lines":10,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/aes.rs#L143-L152"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`sym_idx` is computed as `(offset_first_sym_idx[l] as usize + bits as usize) & 0xFFFF` and then\nused to index `self.syms`, which has only `MAX_HUFFMAN_SYMBOLS == 288` entries. `offset_first_sym_idx`\nis stored via `wrapping_sub` (huffman.rs:86) so it can be any 16-bit value; masking to `0xFFFF`\nkeeps the index in `0..=65535`, far beyond the 288-element array. The original C code had an\n`assert(sym_idx < num_syms)` here but it is commented out (line 164), and `num_syms` is not even\nstored. A crafted-but-\"full\" Huffman table can drive `sym_idx >= 288`, causing an out-of-bounds\nindex panic.","fix":"Store `num_syms` (= n) in the decoder during `init` and return an InvalidData error when `sym_idx >= num_syms` instead of indexing blindly; the `& 0xFFFF` mask hides the bug rather than fixing it.","locations":[{"ref":"src/legacy/huffman.rs:160-168","code":"  160 |         for l in (HUFFMAN_LOOKUP_TABLE_BITS as usize + 1)..=MAX_HUFFMAN_BITS {\n  161 |             if u32::from(bits) < self.sentinel_bits[l] {\n  162 |                 bits >>= MAX_HUFFMAN_BITS - l;\n  163 |                 let sym_idx = (self.offset_first_sym_idx[l] as usize + bits as usize) & 0xFFFF;\n  164 |                 //assert(sym_idx < self.num_syms);\n  165 |                 is.seek_bits(io::SeekFrom::Current(\n  166 |                     -(read_bits1 as i64 + read_bits2 as i64) + l as i64,\n  167 |                 ))?;\n  168 |                 return Ok(self.syms[sym_idx]);","lines":9,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/huffman.rs#L160-L168"},{"ref":"src/legacy/huffman.rs:28","code":"   28 |     pub syms: [u16; MAX_HUFFMAN_SYMBOLS],","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/huffman.rs#L28"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In the known-length branch of `output_code`, the table entry's `last_dst_pos`/`len` are trusted\nand used to index `dst` directly: `for i in ct.last_dst_pos..ct.last_dst_pos + ct.len` then\n`dst.push(dst[i])`, followed by `dst[ct.last_dst_pos]`. After a PARTIAL_CLEAR the code table can\nhold stale `last_dst_pos`/`len` pairs that point past the current end of `dst`, so `dst[i]` /\n`dst[ct.last_dst_pos]` can index out of bounds and panic on crafted shrink data.","fix":"Bounds-check `ct.last_dst_pos + ct.len as usize <= dst.len()` before the copy loop and return InvalidData otherwise.","locations":[{"ref":"src/legacy/shrink.rs:170-177","code":"  170 |     if codetab[code as usize].len != UNKNOWN_LEN {\n  171 |         // Output string with known length (the common case).\n  172 |         let ct = &codetab[code as usize];\n  173 |         for i in ct.last_dst_pos..ct.last_dst_pos + ct.len as usize {\n  174 |             dst.push(dst[i]);\n  175 |         }\n  176 |         return Ok(dst[ct.last_dst_pos]);\n  177 |     }","lines":8,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L170-L177"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In the unknown-length branch of `output_code`, `let first = dst[start];` and\n`dst.extend_from_within(start..start + len)` use `start = prefix entry.last_dst_pos` and\n`len = prefix entry.len` taken straight from the (attacker-influenced, possibly partially-cleared)\ncode table without verifying `start < dst.len()` or `start + len <= dst.len()`. Crafted shrink\ndata can make `start`/`len` reference positions beyond `dst`, causing an out-of-bounds panic.","fix":"Validate `start < dst.len()` and `start + len <= dst.len()` before reading/extending; return an InvalidData error on violation.","locations":[{"ref":"src/legacy/shrink.rs:217-223","code":"  217 |     let ct = codetab[prefix_code as usize];\n  218 |     let last_dst_pos = dst.len();\n  219 |     let start = ct.last_dst_pos;\n  220 |     let len = ct.len as usize;\n  221 |     let first = dst[start];\n  222 |     dst.extend_from_within(start..start + len);\n  223 |     dst.push(codetab[code as usize].ext_byte);","lines":7,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L217-L223"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"During extraction, symlink targets are read into a buffer pre-sized with the\nattacker-controlled uncompressed size: `Vec::with_capacity(file.size() as usize)`.\n`file.size()` is the uncompressed_size field straight from the (ZIP64) header and can be\nset to an enormous value (up to u64::MAX) independent of the actual stored data, causing a\nhuge speculative allocation / capacity-overflow panic (memory-exhaustion DoS) from a tiny\ncrafted archive. The same pattern exists in the streaming extractor.","fix":"Do not pre-size from the declared size; use `Vec::new()` (or cap the pre-allocation, e.g. `min(size, reasonable_limit)`) and let `read_to_end` grow it, optionally enforcing a maximum symlink length.","locations":[{"ref":"src/read/mod.rs:397-399","code":"  397 |             if file.is_symlink() {\n  398 |                 let mut target = Vec::with_capacity(file.size() as usize);\n  399 |                 file.read_to_end(&mut target)?;","lines":3,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/mod.rs#L397-L399"},{"ref":"src/read/mod.rs:397-399","code":"  397 |             if file.is_symlink() {\n  398 |                 let mut target = Vec::with_capacity(file.size() as usize);\n  399 |                 file.read_to_end(&mut target)?;","lines":3,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/mod.rs#L397-L399"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"set_raw_comment uses comment.split_at(max_comment_len). split_at panics if max_comment_len > comment.len(), but here it is only reached when comment.len() > max_comment_len, so it is safe; however the function still assigns self.comment to the truncated prefix AND returns an Err. Callers that ignore the error see a silently truncated comment, while callers that treat it as failure get an inconsistent state (comment already mutated). This is misleading error handling, not a clean failure.","fix":"Either truncate-and-return-Ok, or return Err WITHOUT mutating self.comment. Do not do both. Document the chosen behavior.","locations":[{"ref":"src/write.rs:551-563","code":"  551 |     pub fn set_raw_comment(&mut self, comment: Box<[u8]>) -> ZipResult<()> {\n  552 |         let max_comment_len = u16::MAX as usize; // 65,535\n  553 |         if comment.len() <= max_comment_len {\n  554 |             self.comment = comment;\n  555 |             return Ok(());\n  556 |         }\n  557 |         let (allowed, rest) = comment.split_at(max_comment_len);\n  558 |         self.comment = allowed.into();\n  559 |         Err(ZipError::Io(std::io::Error::new(\n  560 |             std::io::ErrorKind::InvalidData,\n  561 |             format!(\"Unexpected data comment - {} bytes too long\", rest.len()),\n  562 |         )))\n  563 |     }","lines":13,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/write.rs#L551-L563"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`AesReaderValid::read` advances the HMAC and decrypts based on `read = self.reader.read(...)`, where `read <= bytes_to_read <= data_remaining`, so `data_remaining -= read as u64` cannot underflow given a well-behaved inner reader. However, a misbehaving inner `Read` implementation that returns a `count` larger than the provided buffer length would cause `&buf[0..read]` slicing to panic and `data_remaining` accounting to go wrong. This is a contract-violation edge but, in a security module handling untrusted/streamed data through arbitrary reader stacks, defensively clamping `read` would harden it.","fix":"Clamp/assert `read <= bytes_to_read` before slicing and subtracting, e.g. `let read = read.min(bytes_to_read);` to avoid panics or accounting corruption from a non-conforming inner reader.","locations":[{"ref":"src/aes.rs:253-261","code":"  253 |         let bytes_to_read = self.data_remaining.min(buf.len() as u64) as usize;\n  254 |         let read = self.reader.read(&mut buf[0..bytes_to_read])?;\n  255 |         self.data_remaining -= read as u64;\n  256 | \n  257 |         // Update the hmac with the encrypted data\n  258 |         self.hmac.update(&buf[0..read]);\n  259 | \n  260 |         // decrypt the data\n  261 |         self.cipher.crypt_in_place(&mut buf[0..read]);","lines":9,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/aes.rs#L253-L261"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`from_date_and_time` uses `_ => unreachable!()` in the month-to-max-day match (line 293). It is guarded by `(1..=12).contains(&month)` checked just above, so it is currently unreachable. However it is a latent panic: any future edit that reorders the validation, or that calls this match logic from another path without the 1..=12 guard, turns malformed input into a panic. Defensive code parsing untrusted ZIP fields should avoid unreachable!() on value-derived branches.","fix":"Return Err(DateTimeRangeError) in the fallthrough arm instead of unreachable!(), keeping the function total over all u8 month values.","locations":[{"ref":"src/datetime.rs:288-294","code":"  288 |             let max_day = match month {\n  289 |                 1 | 3 | 5 | 7 | 8 | 10 | 12 => 31,\n  290 |                 4 | 6 | 9 | 11 => 30,\n  291 |                 2 if Self::is_leap_year(year) => 29,\n  292 |                 2 => 28,\n  293 |                 _ => unreachable!(),\n  294 |             };","lines":7,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/datetime.rs#L288-L294"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`ReduceDecoder::read` and `ImplodeDecoder::read` compute `available = self.stream.len() - self.read_pos`\nwith plain subtraction. `ShrinkDecoder::read` correctly uses `saturating_sub`. While `read_pos`\nis only advanced by `bytes_to_read <= available`, the inconsistency is fragile; any future change\nthat lets `read_pos` exceed `stream.len()` (or a 0-length buffer edge case) panics here whereas\nshrink does not.","fix":"Use `saturating_sub` consistently as in `ShrinkDecoder::read` (shrink.rs:354).","locations":[{"ref":"src/legacy/reduce.rs:221","code":"  221 |         let available = self.stream.len() - self.read_pos;","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/reduce.rs#L221"},{"ref":"src/legacy/implode.rs:226","code":"  226 |         let available = self.stream.len() - self.read_pos;","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/implode.rs#L226"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`safe_prepare_path` computes `i == components_len - 1` inside the iterator map. If\n`components` is empty, `components_len - 1` underflows (panics in debug, wraps to\nusize::MAX in release). The enumerate/map closure is only invoked when there is at least one\nelement, so the immediate body is safe, but the expression is evaluated lazily per element;\nthe real risk is the brittleness of `components_len - 1`. An empty component list can arise\nfrom `simplified_components` of a degenerate name.","fix":"Use `components.len().checked_sub(1)` or compare with `i + 1 == components_len` to avoid the underflow entirely.","locations":[{"ref":"src/read/zipfile.rs:280-286","code":"  280 |         let components_len = components.len();\n  281 | \n  282 |         for (is_last, component) in components\n  283 |             .iter()\n  284 |             .enumerate()\n  285 |             .map(|(i, c)| (i == components_len - 1, c))\n  286 |         {","lines":7,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/zipfile.rs#L280-L286"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"`ZipFile::drop` only drains the reader (to position the underlying stream past the entry)\nwhen `self.data` is `Cow::Owned` (the streaming case). For the seekable `ZipArchive` case\n`data` is `Cow::Borrowed`, so dropping a partially-read `ZipFile` leaves the shared reader at\nan arbitrary position. That is by design (next `by_index` seeks explicitly), but combined\nwith `take_raw_reader` swapping in `NoReader`, any decompression/decryption error mid-read\nleaves no draining and relies entirely on callers re-seeking — worth documenting; a caller\nmixing `by_index_seek`/manual seeks after a dropped partial read can read from the wrong\noffset.","fix":"Document the invariant clearly, or always reset/seek the borrowed reader to a known state on drop in debug builds to catch misuse.","locations":[{"ref":"src/read/zipfile.rs:461-472","code":"  461 | impl<R: Read + ?Sized> Drop for ZipFile<'_, R> {\n  462 |     fn drop(&mut self) {\n  463 |         // self.data is Owned, this reader is constructed by a streaming reader.\n  464 |         // In this case, we want to exhaust the reader so that the next file is accessible.\n  465 |         if let Cow::Owned(_) = self.data {\n  466 |             // Get the inner `Take` reader so all decryption, decompression and CRC calculation is skipped.\n  467 |             if let Ok(mut inner) = self.take_raw_reader() {\n  468 |                 let _ = copy(&mut inner, &mut sink());\n  469 |             }\n  470 |         }\n  471 |     }\n  472 | }","lines":12,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/zipfile.rs#L461-L472"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`length - is.position_in_bits()?` is an unchecked `u64` subtraction. `length` is the total\nbit length of the stream. After the lookup-table branch seeks forward by\n`-(read_bits1) + table[..].len` (line 146-148), the bit position can be advanced *past* the\nend of the stream when fewer than `table.len` bits remained (read_bits1 was clamped to the\nremaining bits, but the codeword length used to advance is not). On the next call to\n`huffman_decode`, `position_in_bits() > length`, so this subtraction underflows and panics\n(debug) / produces a huge `read_var` count (release). Reachable from crafted imploded data\nnear the end of the stream.","fix":"Use `length.saturating_sub(is.position_in_bits()?)` and treat a zero remainder as end-of-stream (return an InvalidData error) instead of continuing to decode.","locations":[{"ref":"src/legacy/huffman.rs:141-148","code":"  141 |         let read_bits1 = u64::from(HUFFMAN_LOOKUP_TABLE_BITS).min(length - is.position_in_bits()?);\n  142 |         let lookup_bits = !is.read_var::<u8>(read_bits1 as u32)? as usize;\n  143 |         debug_assert!(lookup_bits < self.table.len());\n  144 |         if self.table[lookup_bits].len != 0 {\n  145 |             debug_assert!(self.table[lookup_bits].len <= HUFFMAN_LOOKUP_TABLE_BITS);\n  146 |             is.seek_bits(io::SeekFrom::Current(\n  147 |                 -(read_bits1 as i64) + i64::from(self.table[lookup_bits].len),\n  148 |             ))?;","lines":8,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/huffman.rs#L141-L148"},{"ref":"src/legacy/huffman.rs:153","code":"  153 |         let read_bits2 = u64::from(HUFFMAN_LOOKUP_TABLE_BITS).min(length - is.position_in_bits()?);","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/huffman.rs#L153"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"`has_overlapping_files` computes `let end = start + file.compressed_size;` with a plain\nunchecked addition. Both `start` (the data offset, derived from attacker-controlled\nheader_start / file name / extra-field lengths) and `compressed_size` (attacker-controlled,\nup to u64::MAX via a ZIP64 extra field) come from the archive. In a release build this wraps,\nproducing a bogus (possibly tiny) `end`, which then makes the overlap detection give wrong\nresults; in a debug build it panics. This is reachable from any caller of\n`has_overlapping_files` on a crafted archive.","fix":"Use `start.checked_add(file.compressed_size).ok_or(invalid!(\"overlap offset overflow\"))?` and treat overflow as an invalid archive.","locations":[{"ref":"src/read/zip_archive.rs:379-394","code":"  379 |     pub fn has_overlapping_files(&mut self) -> ZipResult<bool> {\n  380 |         let mut ranges = Vec::<Range<u64>>::with_capacity(self.shared.files.len());\n  381 |         for file in self.shared.files.values() {\n  382 |             if file.compressed_size == 0 {\n  383 |                 continue;\n  384 |             }\n  385 |             let start = file.data_start(&mut self.reader)?;\n  386 |             let end = start + file.compressed_size;\n  387 |             if ranges\n  388 |                 .iter()\n  389 |                 .any(|range| range.start <= end && start <= range.end)\n  390 |             {\n  391 |                 return Ok(true);\n  392 |             }\n  393 |             ranges.push(start..end);\n  394 |         }","lines":16,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/zip_archive.rs#L379-L394"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`SeekableTake::seek` performs `self.inner_starting_offset + clamped_offset` with an\nunchecked addition. `inner_starting_offset` is the data start within the file and\n`clamped_offset` is a user-supplied seek position clamped only to `self.length` (the\nattacker-controlled compressed_size). For a large compressed_size and large starting\noffset this overflows u64 (panic in debug, wrap in release leading to a seek to the wrong\nabsolute position).","fix":"Use `inner_starting_offset.checked_add(clamped_offset)` and return an `InvalidInput` io::Error on overflow.","locations":[{"ref":"src/read/readers.rs:45-52","code":"   45 |             Some(offset) => {\n   46 |                 let clamped_offset = std::cmp::min(self.length, offset);\n   47 |                 let new_inner_offset = self\n   48 |                     .inner\n   49 |                     .seek(SeekFrom::Start(self.inner_starting_offset + clamped_offset))?;\n   50 |                 self.current_offset = new_inner_offset - self.inner_starting_offset;\n   51 |                 Ok(self.current_offset)\n   52 |             }","lines":8,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/readers.rs#L45-L52"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`try_read_eocd64` computes `z64.record_size + Zip64CentralDirectoryEnd::RECORD_OVERHEAD` with unchecked addition. record_size is attacker-controlled (parsed from the file). It is bounded earlier in `Zip64CentralDirectoryEnd::parse` by `record_size.saturating_add(RECORD_OVERHEAD) > max_size`, so in practice it cannot reach u64::MAX, making a real overflow unreachable; however the unchecked `+` relies on that distant invariant and would wrap in debug builds if the bound were ever relaxed.","fix":"Use `z64.record_size.checked_add(Zip64CentralDirectoryEnd::RECORD_OVERHEAD)` and treat overflow as an inconsistent-length error, or compare via subtraction against expected_length to avoid the add.","locations":[{"ref":"src/format/find_central_directory.rs:150-168","code":"  150 |         fn try_read_eocd64<R: Read + Seek + ?Sized>(\n  151 |             reader: &mut R,\n  152 |             locator64: &Zip64CentralDirectoryEndLocator,\n  153 |             expected_length: u64,\n  154 |         ) -> ZipResult<Zip64CentralDirectoryEnd> {\n  155 |             let z64 = Zip64CentralDirectoryEnd::parse(reader, expected_length)?;\n  156 | \n  157 |             // Consistency check: EOCD64 locator should agree with the EOCD64\n  158 |             if z64.disk_with_central_directory != locator64.disk_with_central_directory {\n  159 |                 return Err(invalid!(\"Invalid EOCD64: inconsistency with Locator data\"));\n  160 |             }\n  161 | \n  162 |             // Consistency check: the EOCD64 must have the expected length\n  163 |             if z64.record_size + Zip64CentralDirectoryEnd::RECORD_OVERHEAD != expected_length {\n  164 |                 return Err(invalid!(\"Invalid EOCD64: inconsistent length\"));\n  165 |             }\n  166 | \n  167 |             Ok(z64)\n  168 |         }","lines":19,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/format/find_central_directory.rs#L150-L168"},{"ref":"src/format/blocks.rs:576-580","code":"  576 |         if record_size < (Self::MIN_SIZE - size_of::<Magic>()) as u64 {\n  577 |             return Err(invalid!(\"Low EOCD64 record size\"));\n  578 |         } else if record_size.saturating_add(Self::RECORD_OVERHEAD) > max_size {\n  579 |             return Err(invalid!(\"EOCD64 extends beyond EOCD64 locator\"));\n  580 |         }","lines":5,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/format/blocks.rs#L576-L580"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`codetab[prev_code as usize].len + 1` (and the analogous `prev_entry.len + 1`) add 1 to a `u16`\nlength without checking for `u16::MAX`. With `UNKNOWN_LEN == u16::MAX`, a chain that legitimately\nor maliciously builds a string of length `u16::MAX - 1` would wrap to 0 (release) or panic\n(debug). The same unchecked `+1` appears in three places.","fix":"Use `checked_add` / `saturating_add` and reject lengths that reach `UNKNOWN_LEN`, or bound the total output by `uncompressed_size` so such lengths are unreachable.","locations":[{"ref":"src/legacy/shrink.rs:204","code":"  204 |             len: codetab[prev_code as usize].len + 1,","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L204"},{"ref":"src/legacy/shrink.rs:280","code":"  280 |                 len: codetab[prev_code as usize].len + 1,","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L280"},{"ref":"src/legacy/shrink.rs:299","code":"  299 |                     prev_entry.len + 1","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L299"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`SeekableTake::read` computes the remaining length as `self.length - self.current_offset`.\nThis relies on the invariant `current_offset <= length`. `seek` clamps to `length`, but\n`current_offset` is set from `new_inner_offset - self.inner_starting_offset` where\n`new_inner_offset` is whatever the underlying reader returns; a misbehaving/odd inner\nreader (or one seeked before the starting offset) can make this subtraction underflow and\nthen the read length subtraction underflow as well.","fix":"Use saturating/checked subtraction for both `current_offset` computation and the remaining-length calculation, and validate that `new_inner_offset >= inner_starting_offset`.","locations":[{"ref":"src/read/readers.rs:50","code":"   50 |                 self.current_offset = new_inner_offset - self.inner_starting_offset;","lines":1,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/readers.rs#L50"},{"ref":"src/read/readers.rs:57-65","code":"   57 | impl<R: Read + ?Sized> Read for SeekableTake<'_, R> {\n   58 |     fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> {\n   59 |         let written = self\n   60 |             .inner\n   61 |             .take(self.length - self.current_offset)\n   62 |             .read(buf)?;\n   63 |         self.current_offset += written as u64;\n   64 |         Ok(written)\n   65 |     }","lines":9,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/readers.rs#L57-L65"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"`Crc32Reader::read` only validates the CRC32 when a `read` call returns `count == 0` with a non-empty buffer (`if count == 0 && !buf.is_empty() && !self.check_matches()`). This means integrity is only verified if the consumer keeps calling `read` until it observes a final 0-length return. Many consumers stop reading once they have the expected number of bytes (e.g. reading exactly `uncompressed_size`) and never issue the trailing 0-read, so a corrupted/tampered payload passes with no CRC error. Additionally, an inner reader that legitimately returns 0 mid-stream (allowed by the `Read` contract) would trigger a spurious checksum failure. The CRC enforcement is thus both unreliable (can be bypassed) and fragile.","fix":"Drive verification off a known expected length (compare bytes consumed against the entry's uncompressed size) and verify the CRC when that length is reached, rather than relying on the consumer to observe a terminal 0-length read. Do not treat any mid-stream 0-byte read as EOF.","locations":[{"ref":"src/crc32.rs:46-57","code":"   46 | impl<R: Read> Read for Crc32Reader<R> {\n   47 |     fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> {\n   48 |         let count = self.inner.read(buf)?;\n   49 | \n   50 |         if self.enabled {\n   51 |             if count == 0 && !buf.is_empty() && !self.check_matches() {\n   52 |                 return Err(invalid_checksum!());\n   53 |             }\n   54 |             self.hasher.update(&buf[..count]);\n   55 |         }\n   56 |         Ok(count)\n   57 |     }","lines":12,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/crc32.rs#L46-L57"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`path_to_string` uses `str::contains` with array arguments to try to detect the\nsubstrings \"//\", \"/./\" and \"/../\", but the array pattern `['x','y',...]` matches\nANY of the listed *single chars*, not the sequence. So\n`original.contains([MAIN_SEPARATOR, MAIN_SEPARATOR])` is equivalent to\n`original.contains(MAIN_SEPARATOR)`, and `original.contains([MAIN_SEPARATOR, '.', MAIN_SEPARATOR])`\nis true whenever the string contains a separator OR a dot. Verified with rustc:\n`\"abc/def\".contains(['/', '.', '/'])` returns `true` even though there is no \"/./\".\nThe net effect is that for any path that contains a separator (essentially every\nmulti-component path with a leading separator), the `maybe_original` fast path is\nnever taken and the function always falls back to recreating from components. The\nintended substring checks are dead, and the fast-path optimization is effectively\ndisabled.","fix":"Use real substring checks against the separator string, e.g. build\n`let sep = MAIN_SEPARATOR.to_string();` and test\n`!original.contains(&format!(\"{sep}{sep}\"))`, `!original.contains(&format!(\"{sep}.{sep}\"))`,\n`!original.contains(&format!(\"{sep}..{sep}\"))`. Or normalize once via the component\nloop and drop the brittle fast path entirely.","locations":[{"ref":"src/unstable.rs:98-105","code":"   98 |             } else if (MAIN_SEPARATOR == '/' || !original[1..].contains(MAIN_SEPARATOR))\n   99 |                 && !original.ends_with('.')\n  100 |                 && !original.contains([MAIN_SEPARATOR, MAIN_SEPARATOR])\n  101 |                 && !original.contains([MAIN_SEPARATOR, '.', MAIN_SEPARATOR])\n  102 |                 && !original.contains([MAIN_SEPARATOR, '.', '.', MAIN_SEPARATOR])\n  103 |             {\n  104 |                 maybe_original = Some(&original[1..]);\n  105 |             }","lines":8,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/unstable.rs#L98-L105"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`Crc32Reader::read` skips both CRC updating and the final check whenever `buf.is_empty()` (the `count == 0 && !buf.is_empty()` guard). More importantly, when `enabled` is true but the consumer reads via plain `read` and finishes exactly at the buffer boundary, the hasher is only `update`d for non-terminal reads and the comparison is gated on a 0-length terminal read. Combined with the streaming `read` path (vs. `read_to_end`/`read_to_string`, which do verify), this means the integrity guarantee depends entirely on read pattern. The `read_to_end`/`read_to_string` overrides verify correctly, but the base `read` is the one used by most generic copy loops only if they hit the terminal 0-read, which is not guaranteed.","fix":"Unify verification so the CRC is checked deterministically once all expected bytes have passed through, independent of whether the caller uses `read`, `read_to_end`, or `read_to_string`, and independent of observing a terminal zero-length read.","locations":[{"ref":"src/crc32.rs:46-86","code":"   46 | impl<R: Read> Read for Crc32Reader<R> {\n   47 |     fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> {\n   48 |         let count = self.inner.read(buf)?;\n   49 | \n   50 |         if self.enabled {\n   51 |             if count == 0 && !buf.is_empty() && !self.check_matches() {\n   52 |                 return Err(invalid_checksum!());\n   53 |             }\n   54 |             self.hasher.update(&buf[..count]);\n   55 |         }\n   56 |         Ok(count)\n   57 |     }\n   58 | \n   59 |     fn read_to_end(&mut self, buf: &mut Vec<u8>) -> io::Result<usize> {\n   60 |         let start = buf.len();\n   61 |         let n = self.inner.read_to_end(buf)?;\n   62 | \n   63 |         if self.enabled {\n   64 |             self.hasher.update(&buf[start..]);\n   65 |             if !self.check_matches() {\n   66 |                 return Err(invalid_checksum!());\n   67 |             }\n   68 |         }\n   69 | \n   70 |         Ok(n)\n   71 |     }\n   72 | \n   73 |     fn read_to_string(&mut self, buf: &mut String) -> io::Result<usize> {\n   74 |         let start = buf.len();\n   75 |         let n = self.inner.read_to_string(buf)?;\n   76 | \n   77 |         if self.enabled {\n   78 |             self.hasher.update(&buf.as_bytes()[start..]);\n   79 |             if !self.check_matches() {\n   80 |                 return Err(invalid_checksum!());\n   81 |             }\n   82 |         }\n   83 | \n   84 |         Ok(n)\n   85 |     }\n   86 | }","lines":41,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/crc32.rs#L46-L86"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`try_from_msdos` cannot round-trip all values produced by `from_date_and_time`/`from_msdos_unchecked` and silently rejects legitimately-stored timestamps. The 5-bit seconds field holds seconds/2 (0..=31), so the decoded `seconds` value at line 246 ranges 0..=62. But `from_date_and_time` (called at the end of `try_from_msdos`) rejects any `second > 60` (line 284). Therefore an MS-DOS timepart whose seconds field is 31 (=> 62 seconds) is rejected as invalid, even though such a value is representable and may appear in real archives. Concretely `is_valid()` returns false and `last_modified_time` becomes `None` for these entries.","fix":"In try_from_msdos, clamp/round the decoded seconds (e.g. `seconds.min(58)`) before calling from_date_and_time, or relax the second<=60 bound so the full 0..=62 decoded range is accepted. The seconds value is internal-format-derived and should not be re-validated with the user-facing 0..=60 rule.","locations":[{"ref":"src/datetime.rs:245-260","code":"  245 |     pub fn try_from_msdos(datepart: u16, timepart: u16) -> Result<DateTime, DateTimeRangeError> {\n  246 |         let seconds = (timepart & 0b0000_0000_0001_1111) << 1;\n  247 |         let minutes = (timepart & 0b0000_0111_1110_0000) >> 5;\n  248 |         let hours = (timepart & 0b1111_1000_0000_0000) >> 11;\n  249 |         let days = datepart & 0b0000_0000_0001_1111;\n  250 |         let months = (datepart & 0b0000_0001_1110_0000) >> 5;\n  251 |         let years = (datepart & 0b1111_1110_0000_0000) >> 9;\n  252 |         Self::from_date_and_time(\n  253 |             years.checked_add(1980).ok_or(DateTimeRangeError)?,\n  254 |             months.try_into()?,\n  255 |             days.try_into()?,\n  256 |             hours.try_into()?,\n  257 |             minutes.try_into()?,\n  258 |             seconds.try_into()?,\n  259 |         )\n  260 |     }","lines":16,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/datetime.rs#L245-L260"},{"ref":"src/datetime.rs:279-305","code":"  279 |         if (1980..=2107).contains(&year)\n  280 |             && (1..=12).contains(&month)\n  281 |             && (1..=31).contains(&day)\n  282 |             && hour <= 23\n  283 |             && minute <= 59\n  284 |             && second <= 60\n  285 |         {\n  286 |             // DOS/ZIP timestamp stores seconds/2 in 5 bits and cannot represent 59 or 60 seconds (incl. leap seconds)\n  287 |             let second = second.min(58);\n  288 |             let max_day = match month {\n  289 |                 1 | 3 | 5 | 7 | 8 | 10 | 12 => 31,\n  290 |                 4 | 6 | 9 | 11 => 30,\n  291 |                 2 if Self::is_leap_year(year) => 29,\n  292 |                 2 => 28,\n  293 |                 _ => unreachable!(),\n  294 |             };\n  295 |             if day > max_day {\n  296 |                 return Err(DateTimeRangeError);\n  297 |             }\n  298 |             let datepart = u16::from(day) | (u16::from(month) << 5) | ((year - 1980) << 9);\n  299 |             let timepart =\n  300 |                 (u16::from(second) >> 1) | (u16::from(minute) << 5) | (u16::from(hour) << 11);\n  301 |             Ok(DateTime { datepart, timepart })\n  302 |         } else {\n  303 |             Err(DateTimeRangeError)\n  304 |         }\n  305 |     }","lines":27,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/datetime.rs#L279-L305"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`CodeQueue::new()` populates codes for the range `(CONTROL_CODE+1)..=(MAX_CODE-1)`, i.e. it\nomits `MAX_CODE` (8191) from the free-code queue entirely. The original unshrink algorithm makes\ncodes `257..=MAX_CODE` available. If this exclusion is intentional it is undocumented and\ninconsistent with `unshrink_partial_clear`, which uses `(CONTROL_CODE+1)..MAX_CODE` (also\nexcluding MAX_CODE) — but both differ from the constant `FREE_CODE_QUEUE_SIZE`, leaving two\ntrailing queue slots permanently unused. At minimum this is an off-by-one inconsistency that may\ndrop a usable dictionary code.","fix":"Decide the intended inclusive upper bound for free codes and make `CodeQueue::new`, `unshrink_partial_clear`, and `FREE_CODE_QUEUE_SIZE` consistent; document why MAX_CODE is reserved if it is.","locations":[{"ref":"src/legacy/shrink.rs:29-31","code":"   29 |         for (i, code) in ((CONTROL_CODE as u16 + 1)..=(MAX_CODE as u16 - 1)).enumerate() {\n   30 |             codes[i] = Some(code);\n   31 |         }","lines":3,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L29-L31"},{"ref":"src/legacy/shrink.rs:91-98","code":"   91 |     for i in (CONTROL_CODE + 1)..MAX_CODE {\n   92 |         if !is_prefix[i] {\n   93 |             codetab[i].prefix_code = None;\n   94 |             queue.codes[code_queue_size] = Some(i as u16);\n   95 |             code_queue_size += 1;\n   96 |         }\n   97 |     }\n   98 |     queue.codes[code_queue_size] = None; // End-of-queue marker.","lines":8,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L91-L98"},{"ref":"src/legacy/shrink.rs:13-15","code":"   13 | /// Number of codes available for the LZW dictionary (excluding control codes)\n   14 | /// These are the codes from CONTROL_CODE+1 to MAX_CODE\n   15 | const FREE_CODE_QUEUE_SIZE: usize = MAX_CODE - CONTROL_CODE + 1;","lines":3,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L13-L15"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`read_code` recurses on every control code (INC_CODE_SIZE / PARTIAL_CLEAR) via the tail call\n`return read_code(...)` (line 141). A crafted stream consisting of an unbounded run of\nPARTIAL_CLEAR control codes causes unbounded recursion with no tail-call-optimization guarantee\nin Rust, which can exhaust the stack and abort the process (stack overflow is not a catchable\npanic). This is a denial-of-service on untrusted input.","fix":"Convert the recursion into a loop so repeated control codes are processed iteratively without growing the call stack.","locations":[{"ref":"src/legacy/shrink.rs:119-143","code":"  119 |     // Handle control codes.\n  120 |     if let Ok(control_code) = is.read_var::<u16>(u32::from(*code_size)) {\n  121 |         match control_code {\n  122 |             INC_CODE_SIZE => {\n  123 |                 if *code_size >= MAX_CODE_SIZE {\n  124 |                     return Err(io::Error::new(\n  125 |                         io::ErrorKind::InvalidData,\n  126 |                         \"tried to increase code size when already at maximum\",\n  127 |                     ));\n  128 |                 }\n  129 |                 *code_size += 1;\n  130 |             }\n  131 |             PARTIAL_CLEAR => {\n  132 |                 unshrink_partial_clear(codetab, queue);\n  133 |             }\n  134 |             _ => {\n  135 |                 return Err(io::Error::new(\n  136 |                     io::ErrorKind::InvalidData,\n  137 |                     format!(\"Invalid control code {}\", control_code),\n  138 |                 ));\n  139 |             }\n  140 |         }\n  141 |         return read_code(is, code_size, codetab, queue);\n  142 |     }\n  143 |     Ok(None)","lines":25,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L119-L143"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`ZipStreamReader::visit` drains the central directory with\n`while let Ok(metadata) = self.parse_central_directory() { ... }`. Using `while let Ok` means\nthe loop terminates on the *first* error and discards it entirely, including real parse\nerrors (truncated/corrupt central headers) — they are indistinguishable from the normal\n\"reached end of central directory\" termination. A malformed central directory is therefore\nsilently treated as a successful, complete visit.","fix":"Loop until a sentinel/EOF is reached and propagate genuine parse errors instead of treating every `Err` as a clean stop; e.g. detect the end-of-central-directory signature explicitly.","locations":[{"ref":"src/read/stream.rs:56-58","code":"   56 |         while let Ok(metadata) = self.parse_central_directory() {\n   57 |             visitor.visit_additional_metadata(&metadata)?;\n   58 |         }","lines":3,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/stream.rs#L56-L58"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `read_central_header`, the over-allocation guard compares the declared file count against\n`dir_info.directory_start` (an absolute byte offset that already includes `archive_offset`):\n`if dir_info.number_of_files > dir_info.directory_start as usize { 0 }`. The intent (per the\ntests) is to bound the count by how many central-directory entries could plausibly fit, but\ncomparing a count to a byte offset is a weak/incorrect heuristic: with `archive_offset`\nprepended the offset is inflated, so the guard can be bypassed (allowing a large\n`Vec::with_capacity`) while the real central directory is tiny. The subsequent\n`file_capacity * size_of::<ZipFileData>()` check is the only real backstop.","fix":"Bound the capacity by the actual available bytes between `directory_start` and the EOCD position divided by the minimum central-directory entry size, rather than by the raw byte offset value.","locations":[{"ref":"src/read/zip_archive.rs:186-203","code":"  186 |         // something fishy is going on and we shouldn't trust number_of_files.\n  187 |         let file_capacity = if dir_info.number_of_files > dir_info.directory_start as usize {\n  188 |             0\n  189 |         } else {\n  190 |             dir_info.number_of_files\n  191 |         };\n  192 | \n  193 |         if dir_info.disk_number != dir_info.disk_with_central_directory {\n  194 |             return Err(ZipError::UnsupportedArchive(\n  195 |                 \"Support for multi-disk files is not implemented\",\n  196 |             ));\n  197 |         }\n  198 | \n  199 |         if file_capacity.saturating_mul(size_of::<ZipFileData>()) > isize::MAX as usize {\n  200 |             return Err(ZipError::UnsupportedArchive(\"Oversized central directory\"));\n  201 |         }\n  202 | \n  203 |         let mut files = Vec::with_capacity(file_capacity);","lines":18,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/zip_archive.rs#L186-L203"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"deep_copy_file silently mutates the SOURCE file's compressed_size when it appears larger than the bytes available on disk. If a caller deep-copies a file while another shallow copy still references the original (or before finalize), this overwrites the legitimate metadata of the source entry, corrupting the central-directory record of the original file in the produced archive.","fix":"Compute a local clamped copy length for the read/copy without writing back into src_data.compressed_size; only adjust new_data.compressed_size on the destination clone.","locations":[{"ref":"src/write.rs:410-414","code":"  410 |         let mut compressed_size = src_data.compressed_size;\n  411 |         if compressed_size > (write_position - src_data_start) {\n  412 |             compressed_size = write_position - src_data_start;\n  413 |             src_data.compressed_size = compressed_size;\n  414 |         }","lines":5,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/write.rs#L410-L414"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The 2-byte password verification value is compared with `!=` (`pwd_verification_value != pwd_verify`), a non-constant-time comparison, unlike the auth-code path which correctly uses `constant_time_eq`. While only a 2-byte / 1-in-65536 check (the real integrity guarantee is the HMAC), comparing it in variable time over a `Vec<u8>` provides a marginal timing side channel on the derived verification bytes. For consistency and defense in depth in a security-sensitive module it should also be constant-time.","fix":"Use `constant_time_eq(&pwd_verification_value, pwd_verify)` (or the fixed-size `constant_time_eq_n`) for the password verification comparison as well.","locations":[{"ref":"src/aes.rs:184-187","code":"  184 |         if pwd_verification_value != pwd_verify {\n  185 |             // wrong password\n  186 |             return Err(ZipError::InvalidPassword);\n  187 |         }","lines":4,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/aes.rs#L184-L187"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `central_header`, the header_start condition is\n`header_start != 0 && header_start >= ZIP64_BYTES_THR`. The `!= 0` term is dead:\n`ZIP64_BYTES_THR == u32::MAX`, so `header_start >= u32::MAX` already implies it is\nnon-zero. The redundant clause suggests confused intent (the surrounding\nuncompressed/compressed conditions do not have it).","fix":"Remove the redundant `header_start != 0 &&` and keep `header_start >= ZIP64_BYTES_THR`\nfor consistency with the other two fields.","locations":[{"ref":"src/extra_fields/zip64_extended_information.rs:87-92","code":"   87 |         let header_start = if header_start != 0 && header_start >= ZIP64_BYTES_THR {\n   88 |             size += mem::size_of::<u64>() as u16;\n   89 |             Some(header_start)\n   90 |         } else {\n   91 |             None\n   92 |         };","lines":6,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/extra_fields/zip64_extended_information.rs#L87-L92"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Zip32CentralDirectoryEnd::into_block_and_comment` truncates the comment length with `zip_file_comment.len() as u16` (line 441). The over-length guard in `write` (line 482) is applied to the still-correct `comment` slice afterward and aborts before the truncated block is written, so the bug is currently masked. But `into_block_and_comment` is a standalone method; any future caller that uses the returned block without re-checking comment length would emit a header with a wrong (truncated) `zip_file_comment_length`.","fix":"Validate comment length (<= u16::MAX) inside into_block_and_comment and return a Result, or use try_into() instead of `as u16` so truncation cannot silently happen.","locations":[{"ref":"src/format/blocks.rs:353-375","code":"  353 | impl Zip32CentralDirectoryEnd {\n  354 |     fn into_block_and_comment(self) -> (Zip32CDEBlock, Box<[u8]>) {\n  355 |         let Self {\n  356 |             disk_number,\n  357 |             disk_with_central_directory,\n  358 |             number_of_files_on_this_disk,\n  359 |             number_of_files,\n  360 |             central_directory_size,\n  361 |             central_directory_offset,\n  362 |             zip_file_comment,\n  363 |         } = self;\n  364 |         let block = Zip32CDEBlock {\n  365 |             disk_number,\n  366 |             disk_with_central_directory,\n  367 |             number_of_files_on_this_disk,\n  368 |             number_of_files,\n  369 |             central_directory_size,\n  370 |             central_directory_offset,\n  371 |             zip_file_comment_length: zip_file_comment.len() as u16,\n  372 |         };\n  373 | \n  374 |         (block, zip_file_comment)\n  375 |     }","lines":23,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/format/blocks.rs#L353-L375"},{"ref":"src/format/blocks.rs:411-421","code":"  411 |     pub fn write<T: Write>(self, writer: &mut T) -> ZipResult<()> {\n  412 |         let (block, comment) = self.into_block_and_comment();\n  413 | \n  414 |         if comment.len() > u16::MAX as usize {\n  415 |             return Err(invalid!(\"EOCD comment length exceeds u16::MAX\"));\n  416 |         }\n  417 | \n  418 |         block.write(writer)?;\n  419 |         writer.write_all(&comment)?;\n  420 |         Ok(())\n  421 |     }","lines":11,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/format/blocks.rs#L411-L421"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`max_len`/`max_dist` and the `debug_assert!(len <= max_len(...))` / `debug_assert!(dist <= ...)`\nchecks are only active in debug builds. In release builds there is no validation that a decoded\nback-reference `len`/`dist` is within the algorithm's legal range; correctness/robustness relies\nsolely on the `len.min(uncomp_len - dst.len())` clamp and the implicit-zero fill path. The\nasserts therefore document invariants that are not actually enforced against malicious input.","fix":"Either remove the misleading debug_asserts or convert the bounds checks into real validation that returns InvalidData.","locations":[{"ref":"src/legacy/reduce.rs:146-147","code":"  146 |         debug_assert!(len <= max_len(comp_factor));\n  147 |         debug_assert!(dist <= max_dist(comp_factor));","lines":2,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/reduce.rs#L146-L147"},{"ref":"src/legacy/reduce.rs:79-91","code":"   79 | fn max_len(comp_factor: u8) -> usize {\n   80 |     debug_assert!((1..=4).contains(&comp_factor));\n   81 |     let v_len_bits = (8 - comp_factor) as usize;\n   82 |     // Bits in V + extra len byte + implicit 3.\n   83 |     ((1 << v_len_bits) - 1) + u8::MAX as usize + 3\n   84 | }\n   85 | \n   86 | fn max_dist(comp_factor: u8) -> usize {\n   87 |     debug_assert!((1..=4).contains(&comp_factor));\n   88 |     let v_dist_bits = comp_factor as usize;\n   89 |     // Bits in V * 256 + W byte + implicit 1. */\n   90 |     1 << (v_dist_bits + 8)\n   91 | }","lines":13,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/reduce.rs#L79-L91"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`CentralDirectoryInfo::try_from` validates the ZIP64 case\n(`number_of_files_on_this_disk > number_of_files`) but for the non-ZIP64 fallback it takes\n`number_of_files_on_this_disk` as the authoritative count (line 152) while ignoring the\nEOCD's separate total `number_of_files` field. For a multi-segment-style EOCD where\non-this-disk differs from the total, this silently uses the per-disk count even though the\ndisk-number checks later assume single-disk. Inconsistent with the ZIP64 branch which uses\nthe archive-wide total.","fix":"Use the archive-wide total (or validate that the two counts agree) in the non-ZIP64 branch as well, consistent with the ZIP64 branch.","locations":[{"ref":"src/read/mod.rs:132-153","code":"  132 |         let (relative_cd_offset, number_of_files, disk_number, disk_with_central_directory) =\n  133 |             match &value.eocd64 {\n  134 |                 Some(DataAndPosition { data: eocd64, .. }) => {\n  135 |                     if eocd64.number_of_files_on_this_disk > eocd64.number_of_files {\n  136 |                         return Err(invalid!(\n  137 |                             \"ZIP64 footer indicates more files on this disk than in the whole archive\"\n  138 |                         ));\n  139 |                     }\n  140 |                     (\n  141 |                         eocd64.central_directory_offset,\n  142 |                         eocd64.number_of_files as usize,\n  143 |                         eocd64.disk_number,\n  144 |                         eocd64.disk_with_central_directory,\n  145 |                     )\n  146 |                 }\n  147 |                 _ => (\n  148 |                     u64::from(value.eocd.data.central_directory_offset),\n  149 |                     value.eocd.data.number_of_files_on_this_disk as usize,\n  150 |                     u32::from(value.eocd.data.disk_number),\n  151 |                     u32::from(value.eocd.data.disk_with_central_directory),\n  152 |                 ),\n  153 |             };","lines":22,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/read/mod.rs#L132-L153"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"new_append sets writing_raw = true but writing_to_file = false. The comment says this avoids recomputing the last file's header. If a caller then immediately calls a method that inspects writing_raw without an active file (some abort/finish paths), the stale writing_raw=true could cause finish_file to skip size/CRC fixups for a subsequently started entry if writing_raw is not reset; start_file_with_options resets it (line 1507) but start_entry/finish_file ordering means an abort between new_append and the first start_file leaves writing_raw=true.","fix":"Initialize writing_raw=false in new_append (the last-file header is already correct on disk for an appended archive) or explicitly reset writing_raw at the start of finish_file when writing_to_file is false.","locations":[{"ref":"src/write.rs:365-376","code":"  365 |         Ok(ZipWriter {\n  366 |             inner: GenericZipWriter::Storer(MaybeEncrypted::Unencrypted(readwriter)),\n  367 |             files: shared.files,\n  368 |             stats: ZipWriterStats::default(),\n  369 |             writing_to_file: false,\n  370 |             comment: shared.comment,\n  371 |             zip64_extensible_data_sector: shared.zip64_extensible_data_sector,\n  372 |             writing_raw: true, // avoid recomputing the last file's header\n  373 |             flush_on_finish_file: false,\n  374 |             seek_possible: true,\n  375 |             auto_large_file: false,\n  376 |         })","lines":12,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/write.rs#L365-L376"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"switch_to_non_encrypting_writer uses unreachable!() if inner is not a Storer variant (e.g. a Deflater/Bzip2 still active). finish_file calls switch_to(Stored) first so it is normally a Storer, but abort_file and add_directory rely on the same invariant; any future path that calls switch_to_non_encrypting_writer without first reducing to Storer will panic instead of returning a recoverable error.","fix":"Replace the unreachable!() arm with returning a ZipError (e.g. invalid!/io::Error) so a broken invariant degrades to an error rather than a panic in release-reachable code.","locations":[{"ref":"src/write.rs:853-872","code":"  853 |     fn switch_to_non_encrypting_writer(&mut self) -> Result<(), ZipError> {\n  854 |         self.inner = GenericZipWriter::Storer(\n  855 |             match mem::replace(&mut self.inner, GenericZipWriter::Closed) {\n  856 |                 #[cfg(feature = \"aes-crypto\")]\n  857 |                 GenericZipWriter::Storer(MaybeEncrypted::Aes(writer)) => {\n  858 |                     MaybeEncrypted::Unencrypted(writer.finish()?)\n  859 |                 }\n  860 |                 GenericZipWriter::Storer(MaybeEncrypted::ZipCrypto(writer)) => {\n  861 |                     MaybeEncrypted::Unencrypted(writer.finish()?)\n  862 |                 }\n  863 |                 GenericZipWriter::Storer(MaybeEncrypted::Unencrypted(w)) => {\n  864 |                     MaybeEncrypted::Unencrypted(w)\n  865 |                 }\n  866 |                 _ => unreachable!(\n  867 |                     \"switch_to_non_encrypting_writer called with incompatible GenericZipWriter variant\"\n  868 |                 ),\n  869 |             },\n  870 |         );\n  871 |         Ok(())\n  872 |     }","lines":20,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/write.rs#L853-L872"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ZipCryptoReader::validate` checks only a single byte of the CRC/time check value (`(crc32_plaintext >> 24) as u8 != header_buf[11]`). This is inherent to the legacy ZipCrypto design (1-byte check, ~1/256 false-accept), but the comparison is also non-constant-time. ZipCrypto is cryptographically broken regardless, so impact is minimal, but the byte comparison leaks via timing and the module does not warn callers that a successful `validate` provides essentially no integrity/authentication guarantee.","fix":"This is a limitation of legacy ZipCrypto; document clearly that ZipCrypto provides no authentication and that validate() is a weak 1-byte check. Optionally use a constant-time byte comparison for consistency.","locations":[{"ref":"src/zipcrypto.rs:151-173","code":"  151 |         match validator {\n  152 |             ZipCryptoValidator::PkzipCrc32(crc32_plaintext) => {\n  153 |                 // PKZIP before 2.0 used 2 byte CRC check.\n  154 |                 // PKZIP 2.0+ used 1 byte CRC check. It's more secure.\n  155 |                 // We also use 1 byte CRC.\n  156 | \n  157 |                 if (crc32_plaintext >> 24) as u8 != header_buf[11] {\n  158 |                     return Err(ZipError::InvalidPassword);\n  159 |                 }\n  160 |             }\n  161 |             ZipCryptoValidator::InfoZipMsdosTime(last_mod_time) => {\n  162 |                 // Info-ZIP modification to ZipCrypto format:\n  163 |                 // If bit 3 of the general purpose bit flag is set\n  164 |                 // (indicates that the file uses a data-descriptor section),\n  165 |                 // it uses high byte of 16-bit File Time.\n  166 |                 // Info-ZIP code probably writes 2 bytes of File Time.\n  167 |                 // We check only 1 byte.\n  168 | \n  169 |                 if (last_mod_time >> 8) as u8 != header_buf[11] {\n  170 |                     return Err(ZipError::InvalidPassword);\n  171 |                 }\n  172 |             }\n  173 |         }","lines":23,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/zipcrypto.rs#L151-L173"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"hard","description":"`AesReaderValid::read` only verifies the HMAC authentication code when `data_remaining` reaches 0. The HMAC verification is therefore skipped in two ways that silently return success on unauthenticated data:\n1. Empty payload: if `data_remaining == 0` on entry (an AES entry whose plaintext length is 0), the function returns `Ok(0)` at the top before reading or checking the 10-byte auth code at all.\n2. Truncated stream: if the underlying `self.reader.read(...)` returns 0 before `data_remaining` hits 0 (truncated/short ciphertext), `data_remaining -= 0` leaves it non-zero forever, so the HMAC block is never entered. The reader yields all decrypted bytes it could read and reports clean EOF, so a truncated/tampered file is accepted without the integrity check ever running.\nIn both cases an attacker can deliver data that decrypts and is accepted without MAC verification, defeating the AE-2 authentication guarantee.","fix":"Track total expected bytes and detect a premature 0-length read from the inner reader as an error (truncated data). For the empty-payload case, still read and verify the auth code on the first `read`/at finalize even when `data_remaining == 0`. Consider a dedicated `finalize`/`Drop`-checked path so the MAC is always verified before EOF is reported.","locations":[{"ref":"src/aes.rs:246-293","code":"  246 |     fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> {\n  247 |         if self.data_remaining == 0 {\n  248 |             return Ok(0);\n  249 |         }\n  250 | \n  251 |         // get the number of bytes to read, compare as u64 to make sure we can read more than\n  252 |         // 2^32 bytes even on 32 bit systems.\n  253 |         let bytes_to_read = self.data_remaining.min(buf.len() as u64) as usize;\n  254 |         let read = self.reader.read(&mut buf[0..bytes_to_read])?;\n  255 |         self.data_remaining -= read as u64;\n  256 | \n  257 |         // Update the hmac with the encrypted data\n  258 |         self.hmac.update(&buf[0..read]);\n  259 | \n  260 |         // decrypt the data\n  261 |         self.cipher.crypt_in_place(&mut buf[0..read]);\n  262 | \n  263 |         // if there is no data left to read, check the integrity of the data\n  264 |         if self.data_remaining == 0 {\n  265 |             debug_assert!(\n  266 |                 !self.finalized,\n  267 |                 \"Tried to use an already finalized HMAC. This is a bug!\"\n  268 |             );\n  269 |             if self.finalized {\n  270 |                 return Err(Error::new(\n  271 |                     ErrorKind::InvalidData,\n  272 |                     \"Tried to use an already finalized HMAC\",\n  273 |                 ));\n  274 |             }\n  275 |             self.finalized = true;\n  276 | \n  277 |             // Zip uses HMAC-Sha1-80, which only uses the first half of the hash\n  278 |             // see https://www.winzip.com/win/en/aes_info.html#auth-faq\n  279 |             let mut read_auth_code = [0; AUTH_CODE_LENGTH];\n  280 |             self.reader.read_exact(&mut read_auth_code)?;\n  281 |             let computed_auth_code = &self.hmac.finalize_reset().into_bytes()[0..AUTH_CODE_LENGTH];\n  282 | \n  283 |             // use constant time comparison to mitigate timing attacks\n  284 |             if !constant_time_eq(computed_auth_code, &read_auth_code) {\n  285 |                 return Err(Error::new(\n  286 |                     ErrorKind::InvalidData,\n  287 |                     \"Invalid authentication code, this could be due to an invalid password or errors in the data\",\n  288 |                 ));\n  289 |             }\n  290 |         }\n  291 | \n  292 |         Ok(read)\n  293 |     }","lines":48,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/aes.rs#L246-L293"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"hard","description":"`AesWriter::write` always reports `Ok(buf.len())` even though it ignores the actual outcome granularity: it buffers `buf`, encrypts in place, updates the HMAC, then calls `self.writer.write_all`. If `write_all` succeeds for part and then the buffer is zeroized/cleared, that is fine, but the cipher keystream and HMAC have already been advanced over `buf`. If `write_all` returns an error after the keystream/HMAC have consumed those bytes, the cipher and HMAC state are now irrecoverably ahead of what was actually written, so any retry or subsequent write produces a corrupt, unverifiable archive. There is no way to roll back the CTR counter or HMAC, and the caller is given no indication that the encrypted stream is now inconsistent.","fix":"Advance the cipher and HMAC only after `write_all` has fully succeeded, or document/guarantee that the writer must be abandoned on any write error (and have higher layers discard the entry). At minimum, return the error before mutating long-lived keystream/HMAC state when possible.","locations":[{"ref":"src/aes.rs:399-421","code":"  399 | impl<W: Write> Write for AesWriter<W> {\n  400 |     fn write(&mut self, buf: &[u8]) -> io::Result<usize> {\n  401 |         self.write_encrypted_file_header()?;\n  402 | \n  403 |         // Fill the internal buffer and encrypt it in-place.\n  404 |         self.buffer.extend_from_slice(buf);\n  405 |         self.cipher.crypt_in_place(&mut self.buffer[..]);\n  406 | \n  407 |         // Update the hmac with the encrypted data.\n  408 |         self.hmac.update(&self.buffer[..]);\n  409 | \n  410 |         // Write the encrypted buffer to the inner writer.  We need to use `write_all` here as if\n  411 |         // we only write parts of the data we can't easily reverse the keystream in the cipher\n  412 |         // implementation.\n  413 |         self.writer.write_all(&self.buffer[..])?;\n  414 | \n  415 |         // Zeroize the backing memory before clearing the buffer to prevent cleartext data from\n  416 |         // being left in memory.\n  417 |         self.buffer.zeroize();\n  418 |         self.buffer.clear();\n  419 | \n  420 |         Ok(buf.len())\n  421 |     }","lines":23,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/aes.rs#L399-L421"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"After reading the known ZIP64 fields, the parser drains the remaining declared\nbytes with `copy(&mut reader.take(leftover_len), &mut sink())` and then checks for\n`ErrorKind::UnexpectedEof`. `std::io::copy` over a `Take` never returns\n`UnexpectedEof` when the underlying reader ends early; it simply stops and returns\n`Ok(bytes_copied)` (verified with rustc: `copy(take(100), sink)` on a 3-byte reader\nreturns `Ok(3)`). Consequences: (1) the `UnexpectedEof` branch at lines 221-223 is\ndead code, and (2) a ZIP64 extra field whose declared `len` claims more leftover\nbytes than actually exist is silently accepted instead of being rejected as a\ntruncated/invalid archive.","fix":"Read the leftover bytes with a method that detects short reads, e.g.\n`let mut buf = vec![0u8; leftover_len]; reader.read_exact(&mut buf)` and map\n`UnexpectedEof` to the truncation error; or compare the count returned by `copy`\nagainst `leftover_len` and error if it is smaller.","locations":[{"ref":"src/extra_fields/zip64_extended_information.rs:226-235","code":"  226 |         let Some(leftover_len) = (len as usize).checked_sub(consumed_len) else {\n  227 |             return Err(invalid!(\"ZIP64 extra-data field is the wrong length\"));\n  228 |         };\n  229 |         let mut limited = reader.take(leftover_len as u64);\n  230 |         if let Err(e) = copy(&mut limited, &mut sink()) {\n  231 |             if e.kind() == ErrorKind::UnexpectedEof {\n  232 |                 return Err(invalid!(\"ZIP64 extra field truncated\"));\n  233 |             }\n  234 |             return Err(e.into());\n  235 |         }","lines":10,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/extra_fields/zip64_extended_information.rs#L226-L235"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Inside the main decode loop a read error from `read_code` is silently swallowed with\n`Err(_) => break`, deliberately discarding the underlying I/O / InvalidData error and relying on\nthe post-loop length check to report a generic UnexpectedEof. This masks the real cause of\nfailure (e.g. malformed control codes) and the comment even admits it (\"treat read error as\nend-of-stream for now\"). A genuine I/O error on the underlying reader is also turned into a\nmisleading \"unexpected end of compressed stream\".","fix":"Propagate the error with `?` instead of `break`, or only break on EOF (`Ok(None)`) while returning genuine errors.","locations":[{"ref":"src/legacy/shrink.rs:257-260","code":"  257 |         let curr_opt = match read_code(&mut is, &mut code_size, &mut codetab, &mut queue) {\n  258 |             Ok(c) => c,\n  259 |             Err(_) => break, // treat read error as end-of-stream for now; validated after loop\n  260 |         };","lines":4,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L257-L260"},{"ref":"src/legacy/shrink.rs:307-312","code":"  307 |     if dst.len() != uncompressed_size {\n  308 |         return Err(io::Error::new(\n  309 |             io::ErrorKind::UnexpectedEof,\n  310 |             \"unexpected end of compressed stream\",\n  311 |         ));\n  312 |     }","lines":6,"link":"https://github.com/zip-rs/zip2/blob/5a4f79868cd6abceac84d786c851d648a17c7af1/src/legacy/shrink.rs#L307-L312"}]},
