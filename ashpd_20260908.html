  219 |     /// Ends the update monitoring and cancels any ongoing installation.\n  220 |     ///\n  221 |     /// # Specifications\n  222 |     ///\n  223 |     /// See also [`Close`](https://docs.flatpak.org/en/latest/portal-api-reference.html#gdbus-method-org-freedesktop-portal-Flatpak-UpdateMonitor.Close).\n  224 |     #[doc(alias = \"Close\")]\n  225 |     pub async fn close(&self) -> Result<(), Error> {\n  226 |         self.0.call(\"Close\", &()).await\n  227 |     }\n  228 | }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/update_monitor.rs#L219-L228"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`wayland_export_handle` leaks Wayland protocol objects on the application's connection:\n\n- The `wl_registry` created by `display.get_registry(&qhandle, ())` is never destroyed; its `WlRegistry` proxy is\n  dropped immediately (the return value is discarded), so the server-side object stays alive for the lifetime of the\n  connection. On the `new()` path that is the application's own long-lived connection, so every\n  `WindowIdentifier::from_wayland` call permanently adds one registry object.\n- When the compositor advertises both exporters, the code binds `zxdg_exporter_v1` (line 197) and then discards it\n  because V2 wins (`state.exporter = Some(Exporter::V2(..))`). Only the selected exporter gets `destroy()`d, so the\n  V1 exporter object is leaked too. Note the order dependency: the V1 global is usually advertised before V2, so this\n  leak happens on essentially every call on a compositor supporting both.","fix":"Keep the `WlRegistry` returned by `get_registry` and call `registry.destroy()` before returning; and in the\n`\"zxdg_exporter_v1\"` arm only `bind` after checking that no V2 exporter is present (or `destroy()` the V1 exporter when\nV2 later replaces it, storing both and destroying the unused one in `wayland_export_handle`).","locations":[{"ref":"client/src/window_identifier/wayland.rs:194-207","code":"  194 |                 \"zxdg_exporter_v1\" => {\n  195 |                     #[cfg(feature = \"tracing\")]\n  196 |                     tracing::info!(\"Found wayland interface {interface} v{version}\");\n  197 |                     let exporter = registry.bind::<ZxdgExporterV1, (), State>(\n  198 |                         name,\n  199 |                         version.min(ZXDG_EXPORTER_V1),\n  200 |                         qhandle,\n  201 |                         (),\n  202 |                     );\n  203 |                     match state.exporter {\n  204 |                         Some(Exporter::V2(_)) => (),\n  205 |                         _ => state.exporter = Some(Exporter::V1(exporter)),\n  206 |                     }\n  207 |                 }","lines":14,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L194-L207"},{"ref":"client/src/window_identifier/wayland.rs:232-237","code":"  232 |     let display = conn.display();\n  233 |     let mut event_queue = conn.new_event_queue();\n  234 |     let qhandle = event_queue.handle();\n  235 |     let mut state = State::default();\n  236 |     display.get_registry(&qhandle, ());\n  237 |     event_queue.roundtrip(&mut state)?;","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L232-L237"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In the X11 branch of `set_parent_of` the property value passed to `XChangeProperty` is built as\n`let data: *const u8 = &(net_wm_window_type_dialog_atom as u8);`. Two defects:\n\n1. Truncating cast: `net_wm_window_type_dialog_atom` is an `xlib::Atom` (`c_ulong`); `as u8` keeps only the low 8 bits,\n   so the value written is not the atom at all.\n2. Out-of-bounds read: the call passes `format = 32` and `nelements = 1`. Xlib's contract for `format == 32` is that\n   `data` points to an array of `nelements` C `long`s, so `XChangeProperty` reads 8 bytes (on LP64) starting at a\n   pointer to a one-byte temporary. That is a 7-byte out-of-bounds read of the stack inside an `unsafe` block, and the\n   uninitialised bytes end up in the property.\n\n`x11_dl`'s signature confirms the parameter is `*const c_uchar` with a separate `format`/`nelements` pair\n(`XChangeProperty(_8: *mut Display, _7: c_ulong, _6: c_ulong, _5: c_ulong, _4: c_int, _3: c_int, _2: *const c_uchar,\n_1: c_int)`), so no automatic size handling happens.","fix":"Keep the atom in a named `xlib::Atom` binding and pass a pointer to it, without truncating:\n\n```rust\nlet dialog_atom: xlib::Atom = net_wm_window_type_dialog_atom;\nlet data = &dialog_atom as *const xlib::Atom as *const u8;\n(xlib_handle.XChangeProperty)(\n    xdisplay,\n    surface.xid(),\n    net_wm_window_type_atom,\n    xlib::XA_ATOM,\n    32,\n    xlib::PropModeReplace,\n    data,\n    1,\n);\n```\n\n`dialog_atom` must outlive the call (it does, being a local binding rather than a temporary).","locations":[{"ref":"client/src/window_identifier/mod.rs:446-456","code":"  446 |                     let data: *const u8 = &(net_wm_window_type_dialog_atom as u8);\n  447 |                     (xlib_handle.XChangeProperty)(\n  448 |                         xdisplay,\n  449 |                         surface.xid(),\n  450 |                         net_wm_window_type_atom,\n  451 |                         xlib::XA_ATOM,\n  452 |                         32,\n  453 |                         xlib::PropModeReplace,\n  454 |                         data,\n  455 |                         1,\n  456 |                     );","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L446-L456"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The per-toplevel export refcount stored under `WINDOW_HANDLE_KEY` is a `u8` and is incremented with `*ref_count += 1`\nwith no overflow check. Creating more than 255 live `Gtk4WindowIdentifier`s for the same toplevel (a plausible outcome\nof a leak or of a loop that keeps identifiers alive, since the type is `Clone`-free but cheap to construct) panics in\ndebug builds and wraps to 0 in release builds. Wrapping is the dangerous case: the next `Drop` sees `ref_count == 0`,\ntakes the `unexport_handle()` branch and steals the qdata while other identifiers are still alive, so the remaining\nidentifiers reference an unexported handle and their `Drop` then hits `top_level.data(...).unwrap()`.","fix":"Use `usize` (or `u32`) for the refcount and saturating/checked arithmetic:\n\n```rust\nlet (handle, ref_count): &mut (Option<String>, usize) = handle.as_mut();\n*ref_count = ref_count.saturating_add(1);\n```\n\nupdating the two `set_data`/`steal_data`/`data` type annotations accordingly.","locations":[{"ref":"client/src/window_identifier/gtk4.rs:39-45","code":"   39 |                 let handle = unsafe {\n   40 |                     if let Some(mut handle) = top_level.data(WINDOW_HANDLE_KEY) {\n   41 |                         let (handle, ref_count): &mut (Option<String>, u8) = handle.as_mut();\n   42 |                         *ref_count += 1;\n   43 |                         handle.clone()\n   44 |                     } else {\n   45 |                         let (sender, receiver) =","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L39-L45"},{"ref":"client/src/window_identifier/gtk4.rs:179-185","code":"  179 |                 unsafe {\n  180 |                     let (_handle, ref_count): &mut (Option<String>, u8) =\n  181 |                         top_level.data(WINDOW_HANDLE_KEY).unwrap().as_mut();\n  182 |                     if ref_count > &mut 1 {\n  183 |                         *ref_count -= 1;\n  184 |                         return;\n  185 |                     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L179-L185"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"`Pid` is `u32` (`client/src/lib.rs`) but the GameMode interface takes `i` (`i32`), and every call\nsite uses a silent `as i32` cast. A `Pid` above `i32::MAX` wraps to a negative pid and is sent to\nthe portal as a valid-looking argument instead of being rejected. Linux pids never get that large\ntoday, so the practical impact is nil, but the cast hides the conversion rather than validating it.","fix":"Convert fallibly once per method, e.g.\n```rust\nlet pid = i32::try_from(pid).map_err(|_| Error::ParseError(\"pid out of range\"))?;\nself.0.call(\"QueryStatus\", &pid).await\n```\ninstead of `self.0.call(\"QueryStatus\", &(pid as i32)).await`.","locations":[{"ref":"client/src/desktop/game_mode.rs:111-113","code":"  111 |     pub async fn query_status(&self, pid: Pid) -> Result<Status, Error> {\n  112 |         self.0.call(\"QueryStatus\", &(pid as i32)).await\n  113 |     }","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/game_mode.rs#L111-L113"},{"ref":"client/src/desktop/game_mode.rs:151-155","code":"  151 |     pub async fn query_status_by_pid(&self, target: Pid, requester: Pid) -> Result<Status, Error> {\n  152 |         self.0\n  153 |             .call(\"QueryStatusByPid\", &(target as i32, requester as i32))\n  154 |             .await\n  155 |     }","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/game_mode.rs#L151-L155"},{"ref":"client/src/desktop/game_mode.rs:171-172","code":"  171 |     pub async fn register(&self, pid: Pid) -> Result<(), Error> {\n  172 |         let status = self.0.call(\"RegisterGame\", &(pid as i32)).await?;","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/game_mode.rs#L171-L172"},{"ref":"client/src/desktop/game_mode.rs:305-309","code":"  305 |     pub async fn unregister_by_pid(&self, target: Pid, requester: Pid) -> Result<(), Error> {\n  306 |         let status = self\n  307 |             .0\n  308 |             .call(\"UnregisterGameByPid\", &(target as i32, requester as i32))\n  309 |             .await?;","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/game_mode.rs#L305-L309"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"easy","description":"`Settings` and `PageSetup` derive `Deserialize` but **not one** of their fields carries `#[serde(default)]`\n(and there is no container-level `#[serde(default)]` either). Both are `#[zvariant(signature = \"dict\")]`\nstructs, i.e. they are deserialized from an `a{sv}` vardict through serde's map/struct visitor, which\nerrors with `missing field ...` for every key that is absent from the dict.\n\nThe xdg-desktop-portal `PreparePrint` reply only contains the print settings/page-setup keys that GTK\nactually produced - never all 28 `Settings` keys and never all 10 `PageSetup` keys. Consequently\n`PrintProxy::prepare_print(..).await?.response()` fails with a zbus deserialization error for\nessentially every real invocation, making the whole Print portal client API unusable. The same happens\non the backend side (`PrintImpl::prepare_print` receives `Settings` / `PageSetup` from the frontend).\n\nVerified experimentally with `zvariant` 5.13: a `#[zvariant(signature = \"dict\")]` struct whose fields use\n`#[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]` *without* `default` fails with\n`Err(Message(\"missing field `paper-format`\"))` when the dict omits that key, while the identical struct\nwith `#[serde(default, ...)]` deserializes fine. Note that every other options/response struct in the\ncrate (e.g. `OpenFileOptions` in `file_chooser.rs`, `SelectedDevices` in `remote_desktop.rs`, and even\n`PreparePrintOptions` in this very file) does use `#[serde(default, ...)]` - only `Settings` and\n`PageSetup` were forgotten.","fix":"Add `default` to the `serde` attribute of every field of `Settings` and `PageSetup`, e.g.\n\n```rust\n#[serde(default, with = \"optional\", skip_serializing_if = \"Option::is_none\")]\npub orientation: Option<Orientation>,\n```\n\nand for the string-wrapped ones\n\n```rust\n#[serde(default, with = \"string_u32\", skip_serializing_if = \"Option::is_none\")]\npub n_copies: Option<u32>,\n```\n\n(both structs already derive `Default`, so no extra work is needed). Add a unit test that deserializes a\npartially populated `a{sv}` into `Settings` and `PageSetup`.","locations":[{"ref":"client/src/desktop/print.rs:371-390","code":"  371 | #[derive(Serialize, Deserialize, Type, Debug, Default)]\n  372 | /// Print settings to set in the print dialog.\n  373 | #[zvariant(signature = \"dict\")]\n  374 | #[serde(rename_all = \"kebab-case\")]\n  375 | pub struct Settings {\n  376 |     /// One of landscape, portrait, reverse_landscape or reverse_portrait.\n  377 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  378 |     pub orientation: Option<Orientation>,\n  379 |     /// A paper name according to [PWG 5101.1-2002](ftp://ftp.pwg.org/pub/pwg/candidates/cs-pwgmsn10-20020226-5101.1.pdf)\n  380 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  381 |     pub paper_format: Option<String>,\n  382 |     /// Paper width, in millimeters.\n  383 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  384 |     pub paper_width: Option<String>,\n  385 |     /// Paper height, in millimeters.\n  386 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  387 |     pub paper_height: Option<String>,\n  388 |     /// The number of copies to print.\n  389 |     #[serde(with = \"string_u32\", skip_serializing_if = \"Option::is_none\")]\n  390 |     pub n_copies: Option<u32>,","lines":20,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L371-L390"},{"ref":"client/src/desktop/print.rs:666-686","code":"  666 | #[derive(Serialize, Deserialize, Type, Debug, Default)]\n  667 | /// Setup the printed pages.\n  668 | #[zvariant(signature = \"dict\")]\n  669 | #[serde(rename_all = \"PascalCase\")]\n  670 | pub struct PageSetup {\n  671 |     /// the PPD name. It's the name to select a given driver.\n  672 |     #[serde(rename = \"PPDName\")]\n  673 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  674 |     pub ppdname: Option<String>,\n  675 |     /// The name of the page setup.\n  676 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  677 |     pub name: Option<String>,\n  678 |     /// The user-visible name of the page setup.\n  679 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  680 |     pub display_name: Option<String>,\n  681 |     /// Paper width in millimeters.\n  682 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  683 |     pub width: Option<f64>,\n  684 |     /// Paper height in millimeters.\n  685 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  686 |     pub height: Option<f64>,","lines":21,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L666-L686"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Gtk4WindowIdentifier::as_raw_window_handle` and `as_raw_display_handle` `match self.type_` with arms that are\nindividually gated on `feature = \"gtk4_wayland\"` / `feature = \"gtk4_x11\"`, but `WindowIdentifierType` declares both\n`X11` and `Wayland` variants unconditionally (`client/src/window_identifier/mod.rs:282-288`). Therefore the match is\nnon-exhaustive whenever only one of the two gtk4 backends is enabled together with `raw_handle`, and the crate does not\ncompile. Verified:\n\n```\ncargo check -p ashpd --no-default-features --features tokio,raw_handle,gtk4_wayland\nerror[E0004]: non-exhaustive patterns: `WindowIdentifierType::X11(_)` not covered\n  --> client/src/window_identifier/gtk4.rs:99:36\nerror[E0004]: non-exhaustive patterns: `WindowIdentifierType::X11(_)` not covered\n  --> client/src/window_identifier/gtk4.rs:126:36\n```\n\nThe symmetric combination `raw_handle,gtk4_x11` fails the same way (missing `Wayland` arm). The same build also warns\n`unused imports: XlibDisplayHandle and XlibWindowHandle` because the `raw_window_handle` imports at\n`client/src/window_identifier/gtk4.rs:12-16` are not split per backend feature.","fix":"Add a fallback arm to both matches so every `WindowIdentifierType` variant is covered regardless of the enabled\nfeatures, e.g.:\n\n```rust\n#[cfg(not(all(feature = \"gtk4_wayland\", feature = \"gtk4_x11\")))]\n_ => unreachable!(\"identifier kind not supported by the enabled features\"),\n```\n\n(or better, return a `Result`/`Option` instead of panicking) and gate the `XlibDisplayHandle`/`XlibWindowHandle` and\n`WaylandDisplayHandle`/`WaylandWindowHandle` imports on `feature = \"gtk4_x11\"` / `feature = \"gtk4_wayland\"`\nrespectively. Add `--features raw_handle,gtk4_wayland` and `--features raw_handle,gtk4_x11` to CI.","locations":[{"ref":"client/src/window_identifier/gtk4.rs:96-158","code":"   96 |     #[cfg(feature = \"raw_handle\")]\n   97 |     pub fn as_raw_window_handle(&self) -> WindowHandle<'_> {\n   98 |         unsafe {\n   99 |             let raw_handle = match self.type_ {\n  100 |                 #[cfg(feature = \"gtk4_wayland\")]\n  101 |                 WindowIdentifierType::Wayland(_) => {\n  102 |                     let surface = self.native.surface().unwrap();\n  103 |                     RawWindowHandle::Wayland(WaylandWindowHandle::new(\n  104 |                         NonNull::new(gdk4wayland::ffi::gdk_wayland_surface_get_wl_surface(\n  105 |                             surface\n  106 |                                 .downcast_ref::<gdk4wayland::WaylandSurface>()\n  107 |                                 .unwrap()\n  108 |                                 .to_glib_none()\n  109 |                                 .0,\n  110 |                         ))\n  111 |                         .expect(\"Identifier must be attached to a wl_surface\"),\n  112 |                     ))\n  113 |                 }\n  114 |                 #[cfg(feature = \"gtk4_x11\")]\n  115 |                 WindowIdentifierType::X11(xid) => RawWindowHandle::Xlib(XlibWindowHandle::new(xid)),\n  116 |             };\n  117 |             WindowHandle::borrow_raw(raw_handle)\n  118 |         }\n  119 |     }\n  120 | \n  121 |     #[cfg(feature = \"raw_handle\")]\n  122 |     pub fn as_raw_display_handle(&self) -> DisplayHandle<'_> {\n  123 |         let surface = self.native.surface().unwrap();\n  124 |         let display = surface.display();\n  125 |         unsafe {\n  126 |             let raw_handle = match self.type_ {\n  127 |                 #[cfg(feature = \"gtk4_wayland\")]\n  128 |                 WindowIdentifierType::Wayland(_) => {\n  129 |                     RawDisplayHandle::Wayland(WaylandDisplayHandle::new(\n  130 |                         NonNull::new(gdk4wayland::ffi::gdk_wayland_display_get_wl_display(\n  131 |                             display\n  132 |                                 .downcast_ref::<gdk4wayland::WaylandDisplay>()\n  133 |                                 .unwrap()\n  134 |                                 .to_glib_none()\n  135 |                                 .0,\n  136 |                         ))\n  137 |                         .expect(\"Identifier must be attached to a wl_display\"),\n  138 |                     ))\n  139 |                 }\n  140 |                 #[cfg(feature = \"gtk4_x11\")]\n  141 |                 WindowIdentifierType::X11(_xid) => RawDisplayHandle::Xlib(XlibDisplayHandle::new(\n  142 |                     NonNull::new(gdk4x11::ffi::gdk_x11_display_get_xdisplay(\n  143 |                         display\n  144 |                             .downcast_ref::<gdk4x11::X11Display>()\n  145 |                             .unwrap()\n  146 |                             .to_glib_none()\n  147 |                             .0,\n  148 |                     )),\n  149 |                     display\n  150 |                         .downcast_ref::<gdk4x11::X11Display>()\n  151 |                         .unwrap()\n  152 |                         .screen()\n  153 |                         .screen_number(),\n  154 |                 )),\n  155 |             };\n  156 |             DisplayHandle::borrow_raw(raw_handle)\n  157 |         }\n  158 |     }","lines":63,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L96-L158"},{"ref":"client/src/window_identifier/gtk4.rs:12-16","code":"   12 | #[cfg(feature = \"raw_handle\")]\n   13 | use raw_window_handle::{\n   14 |     DisplayHandle, RawDisplayHandle, RawWindowHandle, WaylandDisplayHandle, WaylandWindowHandle,\n   15 |     WindowHandle, XlibDisplayHandle, XlibWindowHandle,\n   16 | };","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L12-L16"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Even after fixing the pointer cast, `.parent()` looks at the wrong class. `g_type_class_peek_parent`\nreturns the parent of the object's *runtime* class; the `get_startup_notify_id` vfunc override lives\nin the runtime class itself (`GdkWaylandAppLaunchContextClass` / `GdkX11AppLaunchContextClass` -\n`gdk_x11_app_launch_context_get_type` is an exported GTK4 symbol), while the parent\n(`GdkAppLaunchContextClass`, ultimately `GAppLaunchContextClass`) leaves that slot NULL. A child\nclass always inherits the parent's slot, so taking `.parent()` can never find an implementation the\nobject's own class lacks - it can only lose the override. The result is that `from_window` returns\n`None` on glib 2.76-2.81 even though XDG activation is supported there, silently defeating the whole\nfallback path the comment above it describes.","fix":"Drop the `.parent()` call and use the instance's own class: `let klass: *const\ngio::ffi::GAppLaunchContextClass = context.class().as_ref();`. This mirrors what\n`g_app_launch_context_get_startup_notify_id()` does internally\n(`G_APP_LAUNCH_CONTEXT_GET_CLASS (context)->get_startup_notify_id`).","locations":[{"ref":"client/src/activation_token/gtk4.rs:23-29","code":"   23 |         // g_app_launch_context_get_startup_notify_id only accepts nullable\n   24 |         // parameters since 2.82. On older versions we use the vfunc.\n   25 |         if glib::check_version(2, 82, 0).is_some() {\n   26 |             unsafe {\n   27 |                 let klass: *mut gtk4::gio::ffi::GAppLaunchContextClass =\n   28 |                     &context.class().parent()? as *const _ as *mut _;\n   29 |                 let get_startup_notify_id = (*klass).get_startup_notify_id.as_ref()?;","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/activation_token/gtk4.rs#L23-L29"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`create_session` releases the `sessions` mutex after the duplicate check, awaits the (potentially\nlong, user-interactive) request, and only then re-locks to `add()` the session. Two concurrent\n`CreateSession` calls carrying the same `session_handle` both pass the `contains()` check and both\ninsert; `SessionManager::add` silently overwrites the first entry (as its own doc-comment admits),\nso the first session is dropped from tracking while its `SessionInterface` stays registered on the\nobject server - `Close()` on it will then report `NotFound` and the backend's `session_closed` is\ncalled for a session that the other task believes it owns.","fix":"Reserve the token before awaiting: insert a placeholder/`Pending` entry into `SessionManager` while\nstill holding the lock in the duplicate check, and have `add()` return an error (or use\n`HashMap::entry`) instead of silently overwriting an existing token. Remove the reservation if the\nrequest fails.","locations":[{"ref":"client/src/backend/screencast.rs:120-129","code":"  120 |         let session_token = HandleToken::try_from(&session_handle).unwrap();\n  121 |         {\n  122 |             let sessions = self.sessions.lock().unwrap();\n  123 |             if sessions.contains(&session_token) {\n  124 |                 let errormsg = format!(\"A session with handle `{session_token}` already exists\");\n  125 |                 #[cfg(feature = \"tracing\")]\n  126 |                 tracing::error!(\"ScreencastInterface::create_session: {}\", errormsg);\n  127 |                 return Err(PortalError::Exist(errormsg));\n  128 |             }\n  129 |         }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/screencast.rs#L120-L129"},{"ref":"client/src/backend/session.rs:159-167","code":"  159 |     /// Adds a session to the list of tracked sessions.\n  160 |     /// Assumes that no session with the same handle token is already tracked\n  161 |     /// (if there was one, it is silently discarded and backends are not\n  162 |     /// notified). To avoid such a situation, it is recommended to call\n  163 |     /// `contains()` prior to instantiating and adding a session.\n  164 |     pub fn add(&mut self, session: Session) {\n  165 |         let token = session.token();\n  166 |         let _ = self.sessions.insert(token.clone(), session);\n  167 |     }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/session.rs#L159-L167"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ScreencastInterface::create_session` registers and serves the `Session` object whenever\n`result.is_ok()`. `Request::spawn` returns `Ok(Response::cancelled())` both when the user cancelled\nand when the implementation returned `PortalError::Cancelled`, so a session object is created,\nserved on the bus and inserted into the `SessionManager` even for a *rejected* CreateSession\nrequest. The frontend will never use or `Close()` that session, so the object stays registered on\nthe object server and in the manager map for the process lifetime (leak), and a subsequent\nCreateSession with the same token is refused with `PortalError::Exist`.","fix":"Only create the session for a successful response:\n\n```rust\nmatch &result {\n    Ok(Response::Ok(_)) => { /* serve + add the session */ }\n    _ => { /* log */ }\n}\n```\n\ni.e. match on the `Response` variant instead of using `result.is_ok()`.","locations":[{"ref":"client/src/backend/screencast.rs:151-172","code":"  151 |         if result.is_ok() {\n  152 |             #[cfg(feature = \"tracing\")]\n  153 |             tracing::debug!(\n  154 |                 \"ScreencastInterface::create_session: session with handle `{session_token}` created\"\n  155 |             );\n  156 | \n  157 |             let session = Session::new(\n  158 |                 session_handle,\n  159 |                 Arc::clone(&self.sessions),\n  160 |                 Some(Arc::clone(&self.imp) as Arc<dyn SessionImpl>),\n  161 |             );\n  162 |             session.serve(self.cnx.clone()).await?;\n  163 |             {\n  164 |                 let mut sessions = self.sessions.lock().unwrap();\n  165 |                 sessions.add(session);\n  166 |             }\n  167 |         } else {\n  168 |             #[cfg(feature = \"tracing\")]\n  169 |             tracing::error!(\n  170 |                 \"ScreencastInterface::create_session: failed to create a session with handle `{session_token}`\"\n  171 |             );\n  172 |         }","lines":22,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/screencast.rs#L151-L172"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`camera::request()` (both the `pipewire` and the non-`pipewire` variant) calls\n`proxy.request_access(Default::default()).await?` and throws the returned `Request<()>` away. The\n`?` only reports transport failures - the actual user decision lives in `Request::response()`, so a\ndenied (\"cancelled\"/\"other\") camera permission is silently ignored and the code goes on to call\n`OpenPipeWireRemote`, surfacing a confusing secondary error (or an unusable fd) instead of\n`Error::Response(ResponseError::Cancelled)`. The module-level doc example (lines 10-17) shows the\nsame incorrect usage.","fix":"Check the response before continuing:\n\n```rust\n// before\nproxy.request_access(Default::default()).await?;\n// after\nproxy.request_access(Default::default()).await?.response()?;\n```\n\nin both `request()` implementations, and update the module doc example accordingly.","locations":[{"ref":"client/src/desktop/camera.rs:279-287","code":"  279 | pub async fn request() -> Result<Option<OwnedFd>, Error> {\n  280 |     let proxy = Camera::new().await?;\n  281 |     proxy.request_access(Default::default()).await?;\n  282 |     if proxy.is_present().await? {\n  283 |         Ok(Some(proxy.open_pipe_wire_remote(Default::default()).await?))\n  284 |     } else {\n  285 |         Ok(None)\n  286 |     }\n  287 | }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/camera.rs#L279-L287"},{"ref":"client/src/desktop/camera.rs:293-303","code":"  293 | pub async fn request() -> Result<Option<(OwnedFd, Vec<Stream>)>, Error> {\n  294 |     let proxy = Camera::new().await?;\n  295 |     proxy.request_access(Default::default()).await?;\n  296 |     if proxy.is_present().await? {\n  297 |         let fd = proxy.open_pipe_wire_remote(Default::default()).await?;\n  298 |         let streams = pipewire_streams(fd.try_clone()?).await?;\n  299 |         Ok(Some((fd, streams)))\n  300 |     } else {\n  301 |         Ok(None)\n  302 |     }\n  303 | }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/camera.rs#L293-L303"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`EmailRequest::attach_multiple` *overwrites* `self.options.attachment_fds` instead of appending,\nwhile `attach`/`add_attachment` push. Its doc says \"Attaches multiple files to the email\", so\n`request.attach(a).attach_multiple([b, c])` silently loses `a` (and closes its file descriptor when\nthe old `Vec<zvariant::OwnedFd>` is dropped), and two consecutive `attach_multiple` calls keep only\nthe last batch. The user gets an email with missing attachments and no error.","fix":"Append instead of replacing:\n```rust\nself.options.attachment_fds.extend(\n    attachments\n        .into_iter()\n        .map(|fd| zvariant::OwnedFd::from(fd.into())),\n);\n```\n(replacing `self.options.attachment_fds = attachments.into_iter().map(...).collect();`).","locations":[{"ref":"client/src/desktop/email.rs:257-268","code":"  257 |     #[must_use]\n  258 |     /// Attaches multiple files to the email.\n  259 |     pub fn attach_multiple(\n  260 |         mut self,\n  261 |         attachments: impl IntoIterator<Item = impl Into<OwnedFd>>,\n  262 |     ) -> Self {\n  263 |         self.options.attachment_fds = attachments\n  264 |             .into_iter()\n  265 |             .map(|fd| zvariant::OwnedFd::from(fd.into()))\n  266 |             .collect();\n  267 |         self\n  268 |     }","lines":12,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/email.rs#L257-L268"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SelectedFiles::current_filter` and `SelectedFiles::writable` are marked `skip_deserializing`, and\nthe only accessors (`current_filter()`, `writable()`) are `#[cfg(feature = \"backend\")]` *setters*.\n`SelectedFiles` is however the response type of the client-side `OpenFile`/`SaveFile` requests, and\nthe portal does return `current_filter (sa(us))` and `writable (b)` in those results. As written, a\nclient silently loses both results: the values are dropped at deserialization time and there is no\ngetter to read them even if they were kept. The comment `// Backend-only fields` documents the\nintent but the fields are part of a bidirectional type.","fix":"Drop `skip_deserializing` from both fields (keep `default` + `skip_serializing_if`) and add\nnon-`cfg`-gated getters, e.g.\n```rust\npub fn selected_filter(&self) -> Option<&FileFilter> { self.current_filter.as_ref() }\npub fn is_writable(&self) -> Option<bool> { self.writable }\n```\nso that clients can read the filter the user ended up with and whether the file is writable.","locations":[{"ref":"client/src/desktop/file_chooser.rs:583-600","code":"  583 |     // Backend-only fields\n  584 |     /// Not relevant for SaveFiles\n  585 |     #[serde(\n  586 |         default,\n  587 |         with = \"optional\",\n  588 |         skip_serializing_if = \"Option::is_none\",\n  589 |         skip_deserializing\n  590 |     )]\n  591 |     current_filter: Option<FileFilter>,\n  592 |     /// Only relevant for OpenFile\n  593 |     #[serde(\n  594 |         default,\n  595 |         with = \"optional\",\n  596 |         skip_serializing_if = \"Option::is_none\",\n  597 |         skip_deserializing\n  598 |     )]\n  599 |     writable: Option<bool>,\n  600 | }","lines":18,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/file_chooser.rs#L583-L600"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`Activated::timestamp()` and `Deactivated::timestamp()` interpret the D-Bus `t` timestamp as\nmilliseconds (`Duration::from_millis`), while the doc comment right above them (and the\n`org.freedesktop.portal.GlobalShortcuts` specification) state the value is\n\"the timestamp, as seconds and microseconds since the Unix epoch\", i.e. microseconds.\nEvery value returned to the user is therefore 1000x too large (a 2024 timestamp becomes\n~55000 years), silently corrupting any time arithmetic done by the caller.","fix":"Use microseconds in both accessors:\n```rust\n// before\nDuration::from_millis(self.2)\n// after\nDuration::from_micros(self.2)\n```","locations":[{"ref":"client/src/desktop/global_shortcuts.rs:178-181","code":"  178 |     /// The timestamp, as seconds and microseconds since the Unix epoch.\n  179 |     pub fn timestamp(&self) -> Duration {\n  180 |         Duration::from_millis(self.2)\n  181 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/global_shortcuts.rs#L178-L181"},{"ref":"client/src/desktop/global_shortcuts.rs:204-207","code":"  204 |     /// The timestamp, as seconds and microseconds since the Unix epoch.\n  205 |     pub fn timestamp(&self) -> Duration {\n  206 |         Duration::from_millis(self.2)\n  207 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/global_shortcuts.rs#L204-L207"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Orientation`'s `AsRef<str>`, `Display` and `From<Orientation> for &'static str` all produce\n`\"Reverse Landscape\"` / `\"Reverse Portrait\"` (with a space), but `FromStr` only accepts\n`\"ReverseLandscape\" | \"reverse_landscape\"` and `\"ReversePortrait\" | \"reverse_portrait\"`. So\n`Orientation::ReverseLandscape.as_ref().parse::<Orientation>()` returns `Err(Error::ParseError(..))` -\nthe conversions do not round-trip.\n\nWorse, none of these string forms is the wire format: `#[serde(rename_all = \"snake_case\")]` means the\nD-Bus value is `reverse_landscape`. A user who builds a settings value with `orientation.as_ref()` or\n`orientation.to_string()` therefore gets a string the portal does not understand. `Quality` has the same\nthree-way duplication; it round-trips only by accident because `FromStr` accepts both cases there.","fix":"Make the string representation the single source of truth and equal to the serde representation. E.g. make\n`AsRef<str>`/`Display`/`From<Orientation> for &'static str` all return `\"landscape\"`, `\"portrait\"`,\n`\"reverse_landscape\"`, `\"reverse_portrait\"`, implement `Display` as\n`f.write_str(self.as_ref())` and `From<Orientation> for &'static str` as `o.as_ref()`, and add\n`\"Reverse Landscape\"` / `\"Reverse Portrait\"` to the `FromStr` match arms (or drop them). Add a\n`for v in [..] { assert_eq!(v.as_ref().parse::<Orientation>().unwrap(), v) }` round-trip test.","locations":[{"ref":"client/src/desktop/print.rs:79-115","code":"   79 | impl AsRef<str> for Orientation {\n   80 |     fn as_ref(&self) -> &str {\n   81 |         match self {\n   82 |             Self::Landscape => \"Landscape\",\n   83 |             Self::Portrait => \"Portrait\",\n   84 |             Self::ReverseLandscape => \"Reverse Landscape\",\n   85 |             Self::ReversePortrait => \"Reverse Portrait\",\n   86 |         }\n   87 |     }\n   88 | }\n   89 | \n   90 | impl From<Orientation> for &'static str {\n   91 |     fn from(o: Orientation) -> Self {\n   92 |         match o {\n   93 |             Orientation::Landscape => \"Landscape\",\n   94 |             Orientation::Portrait => \"Portrait\",\n   95 |             Orientation::ReverseLandscape => \"Reverse Landscape\",\n   96 |             Orientation::ReversePortrait => \"Reverse Portrait\",\n   97 |         }\n   98 |     }\n   99 | }\n  100 | \n  101 | impl FromStr for Orientation {\n  102 |     type Err = Error;\n  103 | \n  104 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  105 |         match s {\n  106 |             \"Landscape\" | \"landscape\" => Ok(Orientation::Landscape),\n  107 |             \"Portrait\" | \"portrait\" => Ok(Orientation::Portrait),\n  108 |             \"ReverseLandscape\" | \"reverse_landscape\" => Ok(Orientation::ReverseLandscape),\n  109 |             \"ReversePortrait\" | \"reverse_portrait\" => Ok(Orientation::ReversePortrait),\n  110 |             _ => Err(Error::ParseError(\n  111 |                 \"Failed to parse orientation, invalid value\",\n  112 |             )),\n  113 |         }\n  114 |     }\n  115 | }","lines":37,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L79-L115"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`PreparePrintOptions::supported_output_file_formats`, `has_current_page` and `has_selected_pages` (and\n`PrintOptions::supported_output_file_formats`) are marked `skip_deserializing` and have no\n`#[cfg(feature = \"backend\")]` getters, unlike their siblings `modal()` and `accept_label()`. A backend\nimplementing `PrintImpl::prepare_print` therefore can never observe these three options: they are\ndropped during deserialization and unreachable anyway. That defeats the purpose of the v3/v4 options -\na backend cannot know which output file formats the app supports nor whether \"current page\"/\"selection\"\nare meaningful.","fix":"Remove `skip_deserializing` from `supported_output_file_formats`, `has_current_page` and\n`has_selected_pages` (keeping `default`) and add the missing accessors:\n\n```rust\n#[cfg(feature = \"backend\")]\npub fn supported_output_file_formats(&self) -> &[OutputFileFormat] {\n    &self.supported_output_file_formats\n}\n#[cfg(feature = \"backend\")]\npub fn has_current_page(&self) -> Option<bool> { self.has_current_page }\n#[cfg(feature = \"backend\")]\npub fn has_selected_pages(&self) -> Option<bool> { self.has_selected_pages }\n```","locations":[{"ref":"client/src/desktop/print.rs:790-816","code":"  790 |     /// File formats supported by the app for print-to-file.\n  791 |     /// Added in version 3.\n  792 |     #[serde(\n  793 |         default,\n  794 |         with = \"as_value\",\n  795 |         skip_serializing_if = \"Vec::is_empty\",\n  796 |         skip_deserializing\n  797 |     )]\n  798 |     supported_output_file_formats: Vec<OutputFileFormat>,\n  799 |     /// Whether it makes sense to return \"current\" for the print-pages setting.\n  800 |     /// Added in version 4.\n  801 |     #[serde(\n  802 |         default,\n  803 |         with = \"optional\",\n  804 |         skip_serializing_if = \"Option::is_none\",\n  805 |         skip_deserializing\n  806 |     )]\n  807 |     has_current_page: Option<bool>,\n  808 |     /// Whether it makes sense to return \"selection\" for the print-pages\n  809 |     /// setting. Added in version 4.\n  810 |     #[serde(\n  811 |         default,\n  812 |         with = \"optional\",\n  813 |         skip_serializing_if = \"Option::is_none\",\n  814 |         skip_deserializing\n  815 |     )]\n  816 |     has_selected_pages: Option<bool>,","lines":27,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L790-L816"},{"ref":"client/src/desktop/print.rs:889-897","code":"  889 |     /// File formats supported by the app for print-to-file.\n  890 |     /// Added in version 3.\n  891 |     #[serde(\n  892 |         default,\n  893 |         with = \"as_value\",\n  894 |         skip_serializing_if = \"Vec::is_empty\",\n  895 |         skip_deserializing\n  896 |     )]\n  897 |     supported_output_file_formats: Vec<OutputFileFormat>,","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L889-L897"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The session bus connection is memoised in a `static SESSION: OnceLock<zbus::Connection>` that is never invalidated.\nOnce the connection dies (dbus-daemon restart, the client being disconnected for exceeding limits, or - a very real\ncase with `feature = \"tokio\"` - the Tokio runtime that hosted zbus' internal socket task being shut down),\n`Proxy::connection()` keeps handing out the dead `Connection` clone for the rest of the process lifetime and every\nsubsequent portal call fails permanently with no way to recover. The crate already knows about\n`Connection::closed()` (used in `client/src/backend/builder.rs:453`) but does not use it here.","fix":"Replace the `OnceLock` with something re-creatable, e.g. an `async_lock::Mutex<Option<zbus::Connection>>` (or\n`OnceLock<Mutex<Option<..>>>`): on each call, drop the cached connection if it is closed and build a fresh one.\nAlternatively spawn a task awaiting `connection.closed()` that clears the cache.","locations":[{"ref":"client/src/proxy.rs:27-44","code":"   27 | static SESSION: OnceLock<zbus::Connection> = OnceLock::new();\n   28 | \n   29 | #[derive(Debug, Clone)]\n   30 | pub struct Proxy<'a> {\n   31 |     inner: zbus::Proxy<'a>,\n   32 |     version: u32,\n   33 | }\n   34 | \n   35 | impl<'a> Proxy<'a> {\n   36 |     pub(crate) async fn connection() -> zbus::Result<zbus::Connection> {\n   37 |         if let Some(cnx) = SESSION.get() {\n   38 |             Ok(cnx.clone())\n   39 |         } else {\n   40 |             let cnx = zbus::Connection::session().await?;\n   41 |             // during `await` another task may have initialized the cell\n   42 |             Ok(SESSION.get_or_init(|| cnx).clone())\n   43 |         }\n   44 |     }","lines":18,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L27-L44"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Proxy::request` computes the `org.freedesktop.portal.Request` object path itself from the connection's unique name and\nthe `handle_token` (`Request::from_unique_name` -> `Proxy::unique_name`) and then throws away the method reply: the\n`Message` returned by `self.call_method(...)` inside the `try_join!` is discarded. The portal's reply contains the\nauthoritative request handle (`o`). If the peer returns a different path - an xdg-desktop-portal older than the\n`handle_token` convention, a third-party/backend implementation, or a caller that forgot to put `handle_token` into the\noptions dict it passes as `body` (nothing in `request()` verifies that the token in `handle_token` is actually present\nin `body`) - the `Response` signal is emitted on a path nobody is subscribed to and `prepare_response()` awaits\nforever. There is no timeout, so the whole portal call hangs silently.","fix":"Capture the reply of `call_method`, deserialize the returned `ObjectPath`, and compare it with\n`request.path()`; on mismatch either re-create the `Request` on the returned path (re-subscribing before reading, which\nis safe because the portal will not emit `Response` before the method returns for legacy portals) or fail fast with a\ndescriptive `Error`. At minimum log a warning so the hang is diagnosable.","locations":[{"ref":"client/src/proxy.rs:206-224","code":"  206 |     pub async fn request<T>(\n  207 |         &self,\n  208 |         handle_token: &HandleToken,\n  209 |         method_name: &'static str,\n  210 |         body: impl Serialize + Type + Debug,\n  211 |     ) -> Result<Request<T>, Error>\n  212 |     where\n  213 |         T: for<'de> Deserialize<'de> + Type + Debug,\n  214 |     {\n  215 |         let connection = self.inner.connection();\n  216 |         let mut request = Request::from_unique_name(connection.clone(), handle_token).await?;\n  217 |         futures_util::try_join!(request.prepare_response(), async {\n  218 |             self.call_method(method_name, &body)\n  219 |                 .await\n  220 |                 .map_err::<PortalError, _>(From::from)\n  221 |                 .map_err(From::from)\n  222 |         })?;\n  223 |         Ok(request)\n  224 |     }","lines":19,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L206-L224"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Gtk4WindowIdentifier::new` caches the export result on the toplevel under `WINDOW_HANDLE_KEY` even when the export\n*failed*: `top_level.set_data(WINDOW_HANDLE_KEY, (handle.clone(), 1))` runs with `handle == None`. Two bugs follow:\n\n1. The failure is cached permanently. Every later `Gtk4WindowIdentifier::new` for that toplevel takes the \"already\n   exported\" fast path, bumps the refcount and returns the cached `None`, so a transient export failure is never\n   retried for the lifetime of the window.\n2. The refcount is then leaked forever: because `exported` is `handle.is_some() == false`, `Drop` returns immediately\n   at `if !self.exported { return; }` and never decrements nor steals the data. The `(None, u8)` entry keeps growing\n   with every identifier created (see also the `u8` overflow finding).","fix":"Only store the qdata when the export succeeded, and return `None` from `new` otherwise:\n\n```rust\nlet handle = receiver.await.ok().flatten()?;\ntop_level.set_data(WINDOW_HANDLE_KEY, (Some(handle.clone()), 1u8));\nSome(handle)\n```\n\nand in the cached branch only bump the refcount when the cached handle is `Some`.","locations":[{"ref":"client/src/window_identifier/gtk4.rs:67-79","code":"   67 |                         if !result {\n   68 |                             return None;\n   69 |                         }\n   70 |                         let handle = receiver.await.ok().flatten();\n   71 |                         top_level.set_data(WINDOW_HANDLE_KEY, (handle.clone(), 1));\n   72 |                         handle\n   73 |                     }\n   74 |                 };\n   75 |                 Some(Gtk4WindowIdentifier {\n   76 |                     native: native.clone().upcast(),\n   77 |                     exported: handle.is_some(),\n   78 |                     type_: WindowIdentifierType::Wayland(handle.unwrap_or_default()),\n   79 |                 })","lines":13,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L67-L79"},{"ref":"client/src/window_identifier/gtk4.rs:168-171","code":"  168 |     fn drop(&mut self) {\n  169 |         if !self.exported {\n  170 |             return;\n  171 |         }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L168-L171"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When the Wayland export fails, `Gtk4WindowIdentifier::new` still returns `Some`, with\n`type_: WindowIdentifierType::Wayland(handle.unwrap_or_default())`, i.e. an empty handle that formats as the string\n`\"wayland:\"`. Callers get a `WindowIdentifier` that looks valid, pass it to portals, and the portal fails to find the\nparent surface instead of falling back to the well-defined \"no parent\" path. The `exported: handle.is_some()` field\nshows the code already knows the export failed at this point.","fix":"Return `None` when the handle is missing, e.g. `let handle = handle?;` before constructing the struct, and drop the\nnow-redundant `exported` flag / `unwrap_or_default()`.","locations":[{"ref":"client/src/window_identifier/gtk4.rs:75-79","code":"   75 |                 Some(Gtk4WindowIdentifier {\n   76 |                     native: native.clone().upcast(),\n   77 |                     exported: handle.is_some(),\n   78 |                     type_: WindowIdentifierType::Wayland(handle.unwrap_or_default()),\n   79 |                 })","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L75-L79"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`wayland_export_handle` returns `Ok` as soon as an exporter was found, using `state.handle` unconditionally. `State`\nderives `Default`, so `handle` is `String::new()` until the `handle` event arrives. If the compositor does not answer\nwithin the single `roundtrip` (or answers with an error/no handle), the function still returns a\n`WindowIdentifierType::Wayland(\"\")`, which serialises to the identifier string `\"wayland:\"`. Portals receive a\nsyntactically valid but meaningless parent identifier and will fail to parent the dialog instead of falling back to the\n\"no parent\" behaviour that `Option<&WindowIdentifier>` provides.","fix":"Validate the handle before constructing the identifier:\n\n```rust\nif let Some(exported) = exported {\n    if state.handle.is_empty() {\n        return Err(Box::new(crate::Error::NoResponse));\n    }\n    Ok(WaylandWindowIdentifier { exported, type_: WindowIdentifierType::Wayland(state.handle) })\n} else { ... }\n```\n\n(destroying `exported` on that path), and/or loop the roundtrip until the handle event arrives.","locations":[{"ref":"client/src/window_identifier/wayland.rs:263-270","code":"  263 |     if let Some(exported) = exported {\n  264 |         Ok(WaylandWindowIdentifier {\n  265 |             exported,\n  266 |             type_: WindowIdentifierType::Wayland(state.handle),\n  267 |         })\n  268 |     } else {\n  269 |         Err(Box::new(crate::Error::NoResponse))\n  270 |     }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L263-L270"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`update-interfaces.py` only globs `org.freedesktop.portal.*.xml` and `org.freedesktop.impl.portal.*.xml`, so two\ninterfaces the crate actually implements have no reference XML in `interfaces/` and silently drift:\n\n- `org.freedesktop.Flatpak.Development` (used by `client/src/flatpak/development.rs`) lives in the flatpak repo as\n  `data/org.freedesktop.Flatpak.xml`; `interfaces/org.freedesktop.portal.Flatpak.xml` only contains\n  `org.freedesktop.portal.Flatpak` and `org.freedesktop.portal.Flatpak.UpdateMonitor`.\n- `org.freedesktop.host.portal.Registry` (used by `client/src/registry.rs`) is not matched by either pattern.\n\nSince the XML in `interfaces/` is the crate's only guard against D-Bus signature mismatches, those two proxies are\nunverified.","fix":"Add the missing patterns, e.g. `process_and_format_each_file(\"org.freedesktop.Flatpak.xml\", FLATPAK_TEMP_DIR,\nPORTAL_OUTPUT_DIR)` and `process_and_format_each_file(\"org.freedesktop.host.portal.*.xml\", XDG_PORTAL_TEMP_DIR,\nPORTAL_OUTPUT_DIR)`, or broaden the glob to `org.freedesktop.*.xml` with an explicit exclude list.","locations":[{"ref":"update-interfaces.py:148-170","code":"  148 |     # --- Part 2: Process the files individually from both repositories ---\n  149 | \n  150 |     # Process portal files from xdg-desktop-portal repo\n  151 |     process_and_format_each_file(\n  152 |         \"org.freedesktop.portal.*.xml\", XDG_PORTAL_TEMP_DIR, PORTAL_OUTPUT_DIR\n  153 |     )\n  154 | \n  155 |     # Process impl files from xdg-desktop-portal repo\n  156 |     process_and_format_each_file(\n  157 |         \"org.freedesktop.impl.portal.*.xml\",\n  158 |         XDG_PORTAL_TEMP_DIR,\n  159 |         IMPL_OUTPUT_DIR,\n  160 |     )\n  161 | \n  162 |     # Process portal files from flatpak repo\n  163 |     process_and_format_each_file(\n  164 |         \"org.freedesktop.portal.*.xml\", FLATPAK_TEMP_DIR, PORTAL_OUTPUT_DIR\n  165 |     )\n  166 | \n  167 |     # Process impl files from flatpak repo\n  168 |     process_and_format_each_file(\n  169 |         \"org.freedesktop.impl.portal.*.xml\", FLATPAK_TEMP_DIR, IMPL_OUTPUT_DIR\n  170 |     )","lines":23,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L148-L170"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `name_lost` callback is invoked for *every* `org.freedesktop.DBus.NameLost` signal received,\nwithout checking that the lost name is `self.name`. Since `Builder::build()` runs on the\nprocess-wide shared session connection returned by `crate::proxy::Proxy::connection()`, that\nconnection may own other well-known names (or acquire/lose them elsewhere in the app), in which case\nthe backend's `name_lost` hook fires spuriously and the backend may shut itself down while it still\nowns its portal name.","fix":"Filter on the signal argument, e.g.\n\n```rust\nlet name = self.name.clone();\nwhile let Some(signal) = name_lost_stream.next().await {\n    if signal.args().map(|a| a.name == name.inner()).unwrap_or(false) {\n        name_lost();\n    }\n}\n```","locations":[{"ref":"client/src/backend/builder.rs:231-241","code":"  231 |         if let Some(name_lost) = self.name_lost {\n  232 |             let proxy = zbus::fdo::DBusProxy::new(&connection).await?;\n  233 |             let mut name_lost_stream = proxy.receive_name_lost().await?;\n  234 |             if let Err(error) = spawn.spawn(async move {\n  235 |                 while (name_lost_stream.next().await).is_some() {\n  236 |                     name_lost();\n  237 |                 }\n  238 |             }) {\n  239 |                 return Err(crate::PortalError::Failed(error.to_string()));\n  240 |             }\n  241 |         }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/builder.rs#L231-L241"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Several builder setters take `impl Into<Option<P>>` but silently ignore `None`: `EmailRequest::\naddresses`/`cc`/`bcc` and `SaveFilesRequest::files` only assign inside `if let Some(..)`, so\npassing `None` neither clears nor reports anything. This contradicts the sibling setters in the very\nsame builders (`address`, `subject`, `body`, `current_folder`) where `None` does clear the value, so\n`req.addresses(Some([..])).addresses(None::<[&str; 0]>)` keeps the old recipients - surprising for a\nsetter whose signature advertises `None` as meaningful input.","fix":"Make `None` reset the list, e.g. in `EmailRequest::addresses`:\n```rust\nself.options.addresses = addresses\n    .into()\n    .map(|a| a.into_iter().map(|s| s.as_ref().to_owned()).collect())\n    .unwrap_or_default();\n```\nand the equivalent for `cc`, `bcc` and `SaveFilesRequest::files`; alternatively take a plain\n`impl IntoIterator<Item = ..>` and drop the misleading `Option` wrapper.","locations":[{"ref":"client/src/desktop/email.rs:209-217","code":"  209 |     pub fn addresses<P: IntoIterator<Item = I>, I: AsRef<str> + Type + Serialize>(\n  210 |         mut self,\n  211 |         addresses: impl Into<Option<P>>,\n  212 |     ) -> Self {\n  213 |         if let Some(a) = addresses.into() {\n  214 |             self.options.addresses = a.into_iter().map(|s| s.as_ref().to_owned()).collect();\n  215 |         }\n  216 |         self\n  217 |     }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/email.rs#L209-L217"},{"ref":"client/src/desktop/email.rs:221-229","code":"  221 |     pub fn bcc<P: IntoIterator<Item = I>, I: AsRef<str> + Type + Serialize>(\n  222 |         mut self,\n  223 |         bcc: impl Into<Option<P>>,\n  224 |     ) -> Self {\n  225 |         if let Some(a) = bcc.into() {\n  226 |             self.options.bcc = a.into_iter().map(|s| s.as_ref().to_owned()).collect();\n  227 |         }\n  228 |         self\n  229 |     }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/email.rs#L221-L229"},{"ref":"client/src/desktop/email.rs:233-241","code":"  233 |     pub fn cc<P: IntoIterator<Item = I>, I: AsRef<str> + Type + Serialize>(\n  234 |         mut self,\n  235 |         cc: impl Into<Option<P>>,\n  236 |     ) -> Self {\n  237 |         if let Some(a) = cc.into() {\n  238 |             self.options.cc = a.into_iter().map(|s| s.as_ref().to_owned()).collect();\n  239 |         }\n  240 |         self\n  241 |     }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/email.rs#L233-L241"},{"ref":"client/src/desktop/file_chooser.rs:936-947","code":"  936 |     pub fn files<P: IntoIterator<Item = impl AsRef<Path>>>(\n  937 |         mut self,\n  938 |         files: impl Into<Option<P>>,\n  939 |     ) -> Result<Self, crate::Error> {\n  940 |         if let Some(f) = files.into() {\n  941 |             self.options.files = f\n  942 |                 .into_iter()\n  943 |                 .map(|s| FilePath::new(s))\n  944 |                 .collect::<Result<Vec<_>, _>>()?;\n  945 |         }\n  946 |         Ok(self)\n  947 |     }","lines":12,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/file_chooser.rs#L936-L947"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `Timestamp` key of the `LocationUpdated` vardict is `(tt)` - seconds *and microseconds* since\nthe Unix epoch - and `LocationInner::timestamp` correctly models it as `(u64, u64)`. But\n`Location::timestamp()` builds the returned `std::time::Duration` from\n`Duration::from_secs(self.1.timestamp.0)` only, silently discarding the microsecond component.\n`Duration` can represent sub-second precision, so the loss is gratuitous: two location updates\ninside the same second are indistinguishable, which matters for consumers computing speed or\nupdate rate from consecutive fixes.","fix":"```rust\n// before\npub fn timestamp(&self) -> std::time::Duration {\n    std::time::Duration::from_secs(self.1.timestamp.0)\n}\n\n// after\npub fn timestamp(&self) -> std::time::Duration {\n    std::time::Duration::from_secs(self.1.timestamp.0)\n        + std::time::Duration::from_micros(self.1.timestamp.1)\n}\n```","locations":[{"ref":"client/src/desktop/location.rs:179-182","code":"  179 |     /// The timestamp when the location was retrieved.\n  180 |     pub fn timestamp(&self) -> std::time::Duration {\n  181 |         std::time::Duration::from_secs(self.1.timestamp.0)\n  182 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/location.rs#L179-L182"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `usb` module's documented usage pattern subscribes to `DeviceEvents` *after* `create_session()`\nreturns. The signal stream (and its bus match rule) only exists from `receive_device_events().await`\nonwards, so every event the portal emits for the freshly created session - including the initial\n`add` events describing already-connected devices - is lost. The `location` module documents the correct\npattern (set up the stream first, then `futures_util::join!` it with the call that starts producing\nevents).","fix":"Rewrite the example so the stream is created before the session:\n```rust\nlet usb = UsbProxy::new().await?;\nlet mut events = usb.receive_device_events().await?;\nlet _session = usb.create_session(Default::default()).await?;\nif let Some(response) = events.next().await { /* ... */ }\n```","locations":[{"ref":"client/src/desktop/usb.rs:13-25","code":"   13 | //! async fn watch_devices() -> ashpd::Result<()> {\n   14 | //!     let usb = UsbProxy::new().await?;\n   15 | //!     let session = usb.create_session(Default::default()).await?;\n   16 | //!     if let Some(response) = usb.receive_device_events().await?.next().await {\n   17 | //!         let events = response.events();\n   18 | //!         for ev in events {\n   19 | //!             println!(\n   20 | //!                 \"Received event: {:#?} for device {}\",\n   21 | //!                 ev.action(),\n   22 | //!                 ev.device_id()\n   23 | //!             );\n   24 | //!         }\n   25 | //!     }","lines":13,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/usb.rs#L13-L25"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The `FinishAcquireDevices` loop in `acquire_devices` has no termination guard: a portal that keeps\nanswering `finished = false` (with or without new devices) makes the client spin forever issuing D-Bus\ncalls, with `devices` growing unboundedly.","fix":"Bail out when the portal makes no progress:\n```rust\nlet (mut new_devices, finished) = self.finish_acquire_devices(path, Default::default()).await?;\nif new_devices.is_empty() && !finished {\n    return Err(Error::NoResponse); // portal is not making progress\n}\n```","locations":[{"ref":"client/src/desktop/usb.rs:393-401","code":"  393 |             loop {\n  394 |                 let (mut new_devices, finished) = self\n  395 |                     .finish_acquire_devices(path, Default::default())\n  396 |                     .await?;\n  397 |                 devices.append(&mut new_devices);\n  398 |                 if finished {\n  399 |                     break;\n  400 |                 }\n  401 |             }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/usb.rs#L393-L401"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`SetOn`'s `FromStr` only accepts the capitalised spellings `Lockscreen`/`Background`/`Both`, while\n`Serialize`/`Deserialize` use `rename_all = \"lowercase\"` and therefore emit/expect\n`lockscreen`/`background`/`both` (asserted by the test at\n`client/src/desktop/wallpaper.rs:292-300`). So the value that appears on the wire, in the portal's\n`set-on` option and in the crate's own JSON test cannot be parsed back with `str::parse::<SetOn>()`.\nThe analogous `documents::Permission::from_str` deliberately accepts both spellings\n(`client/src/documents/mod.rs:120-124`), so this is an inconsistency, not a design choice.","fix":"Accept both forms, mirroring `Permission::from_str`:\n```rust\nmatch s {\n    \"Lockscreen\" | \"lockscreen\" => Ok(SetOn::Lockscreen),\n    \"Background\" | \"background\" => Ok(SetOn::Background),\n    \"Both\" | \"both\" => Ok(SetOn::Both),\n    _ => Err(Error::ParseError(\"Failed to parse SetOn, invalid value\")),\n}\n```","locations":[{"ref":"client/src/desktop/wallpaper.rs:98-109","code":"   98 | impl FromStr for SetOn {\n   99 |     type Err = Error;\n  100 | \n  101 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  102 |         match s {\n  103 |             \"Lockscreen\" => Ok(SetOn::Lockscreen),\n  104 |             \"Background\" => Ok(SetOn::Background),\n  105 |             \"Both\" => Ok(SetOn::Both),\n  106 |             _ => Err(Error::ParseError(\"Failed to parse SetOn, invalid value\")),\n  107 |         }\n  108 |     }\n  109 | }","lines":12,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/wallpaper.rs#L98-L109"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Permission`'s string conversions are mutually inconsistent. `Display`, `AsRef<str>` and\n`From<Permission> for &'static str` all render `Permission::GrantPermissions` as\n`\"Grant Permissions\"` (with a space), but `FromStr` only accepts `\"GrantPermissions\"` and\n`\"grant-permissions\"`. So `Permission::from_str(p.as_ref())` fails for that variant, i.e. the\ndocumented-looking round trip `as_ref()` -> `from_str()` is broken, and `FromStr` also does not\naccept the wire form emitted by `Serialize` for the other variants either\n(serde uses `rename_all = \"kebab-case\"`).","fix":"Make `AsRef<str>`/`From<Permission> for &str` return the wire values\n(`\"read\"`, `\"write\"`, `\"grant-permissions\"`, `\"delete\"`) and leave the human readable\n`\"Grant Permissions\"` text to `Display` only; alternatively add `\"Grant Permissions\"` to the\n`FromStr` match arm so `as_ref()` -> `from_str()` round-trips.","locations":[{"ref":"client/src/documents/mod.rs:94-127","code":"   94 | impl AsRef<str> for Permission {\n   95 |     fn as_ref(&self) -> &str {\n   96 |         match self {\n   97 |             Self::Read => \"Read\",\n   98 |             Self::Write => \"Write\",\n   99 |             Self::GrantPermissions => \"Grant Permissions\",\n  100 |             Self::Delete => \"Delete\",\n  101 |         }\n  102 |     }\n  103 | }\n  104 | \n  105 | impl From<Permission> for &'static str {\n  106 |     fn from(p: Permission) -> Self {\n  107 |         match p {\n  108 |             Permission::Read => \"Read\",\n  109 |             Permission::Write => \"Write\",\n  110 |             Permission::GrantPermissions => \"Grant Permissions\",\n  111 |             Permission::Delete => \"Delete\",\n  112 |         }\n  113 |     }\n  114 | }\n  115 | \n  116 | impl FromStr for Permission {\n  117 |     type Err = Error;\n  118 | \n  119 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  120 |         match s {\n  121 |             \"Read\" | \"read\" => Ok(Permission::Read),\n  122 |             \"Write\" | \"write\" => Ok(Permission::Write),\n  123 |             \"GrantPermissions\" | \"grant-permissions\" => Ok(Permission::GrantPermissions),\n  124 |             \"Delete\" | \"delete\" => Ok(Permission::Delete),\n  125 |             _ => Err(Error::ParseError(\"Failed to parse priority, invalid value\")),\n  126 |         }\n  127 |     }","lines":34,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/mod.rs#L94-L127"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`main()` prints \"Cleanup complete.\" as its last statement, but nothing is cleaned up at that point: the two shallow\nclones in `/tmp/flatpak-interfaces` and `/tmp/xdg-portal-interfaces` (tens of MB each) are created at the start and\nleft behind on exit. They are only removed on the *next* run, and only if that run reaches the removal code. The\nmessage actively misleads whoever runs the script.","fix":"Wrap the body of `main()` in `try/finally` and `shutil.rmtree(..., ignore_errors=True)` both temp dirs in the\n`finally` block (or use `tempfile.TemporaryDirectory()`), then keep the \"Cleanup complete.\" message; otherwise change\nthe message to \"Done.\".","locations":[{"ref":"update-interfaces.py:115-119","code":"  115 |     # Clean temporary directories\n  116 |     if FLATPAK_TEMP_DIR.exists():\n  117 |         shutil.rmtree(FLATPAK_TEMP_DIR)\n  118 |     if XDG_PORTAL_TEMP_DIR.exists():\n  119 |         shutil.rmtree(XDG_PORTAL_TEMP_DIR)","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L115-L119"},{"ref":"update-interfaces.py:172","code":"  172 |     print(\"Cleanup complete.\")","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L172"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"`WindowIdentifierType::from_str` strips the optional hex prefix with `handle.trim_start_matches(\"0x\")`, which removes\n*every* repetition of the prefix. `x11:0x0x0x502a` is therefore accepted and parsed as `0x502a` instead of being\nrejected as malformed.","fix":"```rust\n// before\nlet handle = handle.trim_start_matches(\"0x\");\n// after\nlet handle = handle.strip_prefix(\"0x\").unwrap_or(handle);\n```","locations":[{"ref":"client/src/window_identifier/mod.rs:326-331","code":"  326 |             \"x11\" => {\n  327 |                 let handle = handle.trim_start_matches(\"0x\");\n  328 |                 Ok(Self::X11(\n  329 |                     std::os::raw::c_ulong::from_str_radix(handle, 16)\n  330 |                         .map_err(|_| PortalError::InvalidArgument(format!(\"Wrong XID {handle}\")))?,\n  331 |                 ))","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L326-L331"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`SettingsInterface::accent_color_changed` emits the `accent-color` setting as\n`OwnedValue::try_from(color)`. Because `Color` is declared `#[zvariant(signature = \"dict\")]` with a\nsingle `color` field, the derived `zvariant::OwnedValue` conversion produces\n`{\"color\": <(ddd)>}` (verified: `sig=a{sv} value=Dict({Str(\"color\"): Structure([F64, F64, F64])})`),\nnot the `(ddd)` tuple the `org.freedesktop.appearance` spec (and ashpd's own client,\n`Settings::accent_color()` / `receive_accent_color_changed()`, which read `(f64, f64, f64)`)\nexpects. Any client listening for accent colour changes fails to deserialize the signal payload.\nThe `.unwrap()` on the fallible `OwnedValue::try_from` is a further (currently unreachable) panic.","fix":"Emit the plain RGB tuple, e.g.\n\n```rust\npub async fn accent_color_changed(&self, color: Color) -> zbus::Result<()> {\n    let rgb = (color.red(), color.green(), color.blue());\n    self.changed(APPEARANCE_NAMESPACE, ACCENT_COLOR_SCHEME_KEY, Value::from(rgb))\n        .await\n}\n```\n\nwhich also removes the `unwrap()`.","locations":[{"ref":"client/src/backend/settings.rs:75-82","code":"   75 |     pub async fn accent_color_changed(&self, color: Color) -> zbus::Result<()> {\n   76 |         self.changed(\n   77 |             APPEARANCE_NAMESPACE,\n   78 |             ACCENT_COLOR_SCHEME_KEY,\n   79 |             OwnedValue::try_from(color).unwrap().into(),\n   80 |         )\n   81 |         .await\n   82 |     }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/settings.rs#L75-L82"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"`DisplayHint` relies on `#[serde(rename_all = \"kebab-case\")]` to produce the portal's option\nvalues, but serde's kebab-case rule inserts a separator at every word boundary, so\n`HideOnLockScreen` becomes `hide-on-lock-screen` and `HideContentOnLockScreen` becomes\n`hide-content-on-lock-screen`. The portal (and the crate's own `#[doc(alias = ...)]` on those very\nvariants) expects `hide-on-lockscreen` and `hide-content-on-lockscreen`.\n\nVerified by serializing a `Notification` and re-decoding it as `a{sv}`:\n\n```\ndisplay-hint = Array([Str(\"hide-on-lock-screen\"), Str(\"hide-content-on-lock-screen\"), Str(\"show-as-new\")])\n```\n\n`xdg-desktop-portal` validates `display-hint` values, so `AddNotification` either rejects the whole\nnotification or silently discards the hint - either way the two lock-screen hints are unusable.\nThey are reachable from the shipped demo (`demo/client/src/portals/desktop/notification.rs:264-267`).\nThe other four variants (`transient`, `tray`, `persistent`, `show-as-new`) happen to round-trip\ncorrectly, which is why the bug is easy to miss.","fix":"Pin the wire values explicitly instead of relying on `rename_all`:\n\n```rust\n// before\n    /// Hide on lockscreen.\n    #[doc(alias = \"hide-on-lockscreen\")]\n    HideOnLockScreen,\n    /// Enable speakerphone.\n    #[doc(alias = \"hide-content-on-lockscreen\")]\n    HideContentOnLockScreen,\n\n// after\n    /// Hide on lockscreen.\n    #[doc(alias = \"hide-on-lockscreen\")]\n    #[serde(rename = \"hide-on-lockscreen\")]\n    HideOnLockScreen,\n    /// Hide the notification content on the lockscreen.\n    #[doc(alias = \"hide-content-on-lockscreen\")]\n    #[serde(rename = \"hide-content-on-lockscreen\")]\n    HideContentOnLockScreen,\n```\n\nAdd a test asserting the serialized strings for every `DisplayHint` variant.","locations":[{"ref":"client/src/desktop/notification.rs:235-256","code":"  235 | #[serde(rename_all = \"kebab-case\")]\n  236 | /// Ways to display a notification.\n  237 | pub enum DisplayHint {\n  238 |     /// Transient.\n  239 |     #[doc(alias = \"transient\")]\n  240 |     Transient,\n  241 |     /// Tray.\n  242 |     #[doc(alias = \"tray\")]\n  243 |     Tray,\n  244 |     /// Persistent.\n  245 |     #[doc(alias = \"persistent\")]\n  246 |     Persistent,\n  247 |     /// Hide on lockscreen.\n  248 |     #[doc(alias = \"hide-on-lockscreen\")]\n  249 |     HideOnLockScreen,\n  250 |     /// Enable speakerphone.\n  251 |     #[doc(alias = \"hide-content-on-lockscreen\")]\n  252 |     HideContentOnLockScreen,\n  253 |     /// Show as new.\n  254 |     #[doc(alias = \"show-as-new\")]\n  255 |     ShowAsNew,\n  256 | }","lines":22,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L235-L256"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`SupportedOptions` is read through `Proxy::property_versioned`, which resolves to\n`zbus::Proxy::get_property::<T>()` and therefore uses the **`TryFrom<OwnedValue>`** impl produced\nby `#[derive(OwnedValue)]` - *not* the `Deserialize` impl. The `OwnedValue`/`Value` derive macros\nonly read `#[zvariant(...)]` / `#[zbus(...)]` attributes (`zvariant_derive`'s\n`def_attrs! { crate zbus, zvariant; ... }`); `#[serde(rename_all = \"kebab-case\")]` is invisible to\nthem. The generated code therefore looks up the raw Rust field names, i.e. `fields.remove(\"category\")`\nand `fields.remove(\"button_purpose\")`, while the portal sends the key `button-purpose`.\n\nSince `button_purpose` is not an `Option`, the derive emits\n`.ok_or_else(|| zvariant::Error::IncorrectType)?`, so `NotificationProxy::supported_options()`\n**always** fails with `Error::Zbus(Variant(IncorrectType))` against a conforming portal.\nVerified empirically with `zvariant 5.13`:\n\n```\nkebab keys -> Err(IncorrectType)\nsnake keys -> Ok(SupportedOptions { category: [..], button_purpose: [..] })\n```\n\nTwo secondary consequences of the same root cause: the `#[serde(default, ...)]` attributes are\nalso ineffective (a portal that omits `category` still yields `IncorrectType` instead of an empty\nvector), and the `Deserialize` derive on `SupportedOptions` is dead code because nothing ever\ndeserializes this type.","fix":"Tell the `zvariant` derive about the key names as well (verified to fix the failure):\n\n```rust\n// before\n#[derive(Deserialize, Type, Debug, OwnedValue)]\n#[zvariant(signature = \"dict\")]\n#[serde(rename_all = \"kebab-case\")]\nstruct SupportedOptions { .. }\n\n// after\n#[derive(Type, Debug, OwnedValue)]\n#[zvariant(signature = \"dict\", rename_all = \"kebab-case\")]\nstruct SupportedOptions {\n    category: Vec<String>,\n    #[zvariant(rename = \"button-purpose\")] // redundant
