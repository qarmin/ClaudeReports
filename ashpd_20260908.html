{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"All three property getters of the `Realtime` portal declare the wrong Rust type, so every one of them\nfails at runtime with `zvariant::Error::IncorrectType`. `Proxy::property::<T>` goes through\n`TryFrom<OwnedValue> for T`, which in zvariant is generated by a macro that matches the exact\n`Value` variant and returns `Err(Error::IncorrectType)` otherwise - there is no widening/narrowing.\n\nPer `interfaces/org.freedesktop.portal.Realtime.xml`:\n\n- `MaxRealtimePriority` is `i` (`i32`), the code asks for `i64`\n- `MinNiceLevel` is `i` (`i32`), the code asks for `u32` (nice levels are negative, so `u32` is wrong\n  semantically too)\n- `RTTimeUSecMax` is `x` (`i64`), the code asks for `u32`","fix":"Change the return types to match the XML:\n\n```rust\npub async fn max_realtime_priority(&self) -> Result<i32, Error> { ... }\npub async fn min_nice_level(&self) -> Result<i32, Error> { ... }\npub async fn rt_time_usec_max(&self) -> Result<i64, Error> { ... }\n```","locations":[{"ref":"client/src/desktop/realtime.rs:66-82","code":"   66 |     #[doc(alias = \"MaxRealtimePriority\")]\n   67 |     #[allow(missing_docs)]\n   68 |     pub async fn max_realtime_priority(&self) -> Result<i64, Error> {\n   69 |         self.0.property(\"MaxRealtimePriority\").await\n   70 |     }\n   71 | \n   72 |     #[doc(alias = \"MinNiceLevel\")]\n   73 |     #[allow(missing_docs)]\n   74 |     pub async fn min_nice_level(&self) -> Result<u32, Error> {\n   75 |         self.0.property(\"MinNiceLevel\").await\n   76 |     }\n   77 | \n   78 |     #[doc(alias = \"RTTimeUSecMax\")]\n   79 |     #[allow(missing_docs)]\n   80 |     pub async fn rt_time_usec_max(&self) -> Result<u32, Error> {\n   81 |         self.0.property(\"RTTimeUSecMax\").await\n   82 |     }","lines":17,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/realtime.rs#L66-L82"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"`Response<T>` declares `#[zvariant(signature = \"(ua{sv})\")]` unconditionally, but its `Serialize` impl\nwrites `response` verbatim in the `Ok` arm. For `T = ()` (used by the backend as `Result<Response<()>>`\nin `backend/print.rs::print` and `backend/email.rs::send_email`) `serialize_element(&())` hits zvariant's\n`serialize_unit`, which writes **zero** bytes. The reply therefore claims the signature `ua{sv}` while the\nbody only contains the 4-byte `u32` response code, so the peer (xdg-desktop-portal, GDBus) cannot\ndemarshal the reply and the backend method effectively fails.\n\nVerified experimentally with `zvariant` 5.13: a type with `#[zvariant(signature = \"(ua{sv})\")]` whose\n`Serialize` does `serialize_tuple(2)` + `serialize_element(&0u32)` + `serialize_element(&())` produces a\n4-byte body, whereas using an empty `HashMap<&str, Value>` for the second element produces the correct\n8 bytes.","fix":"Do not allow `T = ()` to reach the `Ok` arm. Introduce a dedicated empty-results type in this module and\nuse it in the backend instead of `()`:\n\n```rust\n#[derive(Debug, Default, Serialize, Deserialize, Type)]\n#[zvariant(signature = \"dict\")]\npub struct NoResults {}\n```\n\nthen change `backend/print.rs` and `backend/email.rs` to return `Response<NoResults>`. Alternatively add\na `T: Type` bound assertion that `T::SIGNATURE == \"a{sv}\"`, or special-case the empty payload by\nserializing `HashMap::<&str, Value>::new()` whenever `T::SIGNATURE` is not a dict. Add a round-trip test\nthat serializes `Response::<()>::ok(())` and checks the encoded length is 8, not 4.","locations":[{"ref":"client/src/desktop/request.rs:109-130","code":"  109 | impl<T> Serialize for Response<T>\n  110 | where\n  111 |     T: Serialize + Type,\n  112 | {\n  113 |     fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>\n  114 |     where\n  115 |         S: serde::Serializer,\n  116 |     {\n  117 |         let mut map = serializer.serialize_tuple(2)?;\n  118 |         match self {\n  119 |             Self::Err(err) => {\n  120 |                 map.serialize_element(&ResponseType::from(*err))?;\n  121 |                 map.serialize_element(&HashMap::<&str, Value<'_>>::new())?;\n  122 |             }\n  123 |             Self::Ok(response) => {\n  124 |                 map.serialize_element(&ResponseType::Success)?;\n  125 |                 map.serialize_element(response)?;\n  126 |             }\n  127 |         };\n  128 |         map.end()\n  129 |     }\n  130 | }","lines":22,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/request.rs#L109-L130"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"`From<ColorScheme> for OwnedValue`, `From<Contrast> for OwnedValue` and `From<ReducedMotion> for\nOwnedValue` build the value from an *unannotated* integer literal. Because both `From<i32>` and\n`From<u32>` exist for `OwnedValue`, Rust's integer fallback picks `i32`, so the produced value is\n`Value::I32` (D-Bus signature `i`) while `org.freedesktop.appearance` specifies `u` and the inverse\n`TryFrom<Value<'_>>` impls in this same file do `u32::try_from(value)?`, which returns\n`Error::IncorrectType` for `Value::I32`. Consequences: (1) round-tripping\n`ColorScheme::try_from(OwnedValue::from(scheme))` always fails; (2) `client/src/backend/settings.rs`\nuses exactly these impls (`OwnedValue::from(contrast)`, `OwnedValue::from(scheme)`) to emit the\n`SettingChanged` signal, so an ashpd-based backend emits `color-scheme`/`contrast` as a signed int and\nevery spec-conforming client (including ashpd's own `Settings::color_scheme()`) rejects it.","fix":"Annotate the literals as `u32` in all three impls, e.g.:\n```rust\nimpl From<ColorScheme> for OwnedValue {\n    fn from(value: ColorScheme) -> Self {\n        match value {\n            ColorScheme::PreferDark => 1u32,\n            ColorScheme::PreferLight => 2u32,\n            _ => 0u32,\n        }\n        .into()\n    }\n}\n```\nDo the same for `Contrast` (`1u32` / `0u32`) and `ReducedMotion` (`1u32` / `0u32`), and add a unit test\nasserting `ColorScheme::try_from(OwnedValue::from(ColorScheme::PreferDark)).unwrap() == ColorScheme::PreferDark`.","locations":[{"ref":"client/src/desktop/settings.rs:86-95","code":"   86 | impl From<ColorScheme> for OwnedValue {\n   87 |     fn from(value: ColorScheme) -> Self {\n   88 |         match value {\n   89 |             ColorScheme::PreferDark => 1,\n   90 |             ColorScheme::PreferLight => 2,\n   91 |             _ => 0,\n   92 |         }\n   93 |         .into()\n   94 |     }\n   95 | }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/settings.rs#L86-L95"},{"ref":"client/src/desktop/settings.rs:129-137","code":"  129 | impl From<Contrast> for OwnedValue {\n  130 |     fn from(value: Contrast) -> Self {\n  131 |         match value {\n  132 |             Contrast::High => 1,\n  133 |             _ => 0,\n  134 |         }\n  135 |         .into()\n  136 |     }\n  137 | }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/settings.rs#L129-L137"},{"ref":"client/src/desktop/settings.rs:170-178","code":"  170 | impl From<ReducedMotion> for OwnedValue {\n  171 |     fn from(value: ReducedMotion) -> Self {\n  172 |         match value {\n  173 |             ReducedMotion::ReducedMotion => 1,\n  174 |             _ => 0,\n  175 |         }\n  176 |         .into()\n  177 |     }\n  178 | }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/settings.rs#L170-L178"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`OpenURIProxy::scheme_supported` calls the `SchemeSupported` method through `Proxy::call`, with no\nversion gate. `SchemeSupported` is a late addition to `org.freedesktop.portal.OpenURI` (it does not\nexist in older portal implementations), so on an older portal the caller gets an opaque\n`PortalError`/`UnknownMethod` D-Bus error instead of the crate's dedicated\n`Error::RequiresVersion(required, actual)`.\n\nEvery other version-gated entry point in the crate uses `call_versioned` /\n`property_versioned` / `request_versioned` for exactly this purpose - e.g.\n`network_monitor.rs:138` (`CanReach`, 3), `network_monitor.rs:157` (`GetAvailable`, 2),\n`notification.rs:665` (`SupportedOptions`, 2), `documents/mod.rs:513` (`GetHostPaths`, 5). Callers\ncannot do feature detection here, which defeats the purpose of this method.","fix":"Gate the call and document the requirement, matching the surrounding convention:\n\n```rust\n// before\nself.0.call(\"SchemeSupported\", &(schema, &options)).await\n\n// after\nself.0\n    .call_versioned(\"SchemeSupported\", &(scheme, &options), 5)\n    .await\n```\n\nAlso add the standard `# Required version` doc paragraph used by the other versioned methods, and\naudit `open_directory` the same way (`OpenDirectory` is likewise not available in the oldest\n`OpenURI` versions).","locations":[{"ref":"client/src/desktop/open_uri.rs:213-230","code":"  213 |     /// Whether a scheme is supported or not.\n  214 |     ///\n  215 |     /// # Arguments\n  216 |     ///\n  217 |     /// * `scheme` - URI protocol scheme to check.\n  218 |     /// * `options` - The options to pass to the request.\n  219 |     ///\n  220 |     /// # Specifications\n  221 |     ///\n  222 |     /// See also [`SchemeSupported`](https://flatpak.github.io/xdg-desktop-portal/docs/doc-org.freedesktop.portal.OpenURI.html#org-freedesktop-portal-openuri-schemesupported).\n  223 |     #[doc(alias = \"SchemeSupported\")]\n  224 |     pub async fn scheme_supported(\n  225 |         &self,\n  226 |         schema: &str,\n  227 |         options: SchemeSupportedOptions,\n  228 |     ) -> Result<bool, Error> {\n  229 |         self.0.call(\"SchemeSupported\", &(schema, &options)).await\n  230 |     }","lines":18,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/open_uri.rs#L213-L230"}]},
{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Error::PortalNotFound` is detected by string-matching the D-Bus error *message*: `details.contains(interface)` where\n`details` is the human-readable text of `org.freedesktop.DBus.Error.InvalidArgs`. This depends on GDBus' exact wording\n(`No such interface 'org.freedesktop.portal.X'`) and on it not being localised or reworded. Any change upstream makes\n`PortalNotFound` silently degrade into `version = 1` (see the `_ => Ok(1)` arm), i.e. \"portal missing\" is reported as\n\"portal too old\". Conversely a legitimate `InvalidArgs` from an unrelated argument whose text happens to embed the\ninterface name is misreported as `PortalNotFound`.","fix":"Do not parse error strings. Either query `org.freedesktop.DBus.Introspectable.Introspect` / `NameHasOwner` once to\ndecide whether the portal interface exists, or treat any of `UnknownInterface`/`UnknownProperty`/`InvalidArgs` as\n\"no version property\" and detect a missing portal from `ServiceUnknown`/`NameHasNoOwner` on the first real method call.\nIf string matching must stay, at least anchor it (`details.contains(&format!(\"interface '{interface}'\"))`) and add a\nregression test.","locations":[{"ref":"client/src/proxy.rs:93-103","code":"   93 |             Err(zbus::fdo::Error::InvalidArgs(details)) => {\n   94 |                 if details.contains(interface) {\n   95 |                     Err(crate::Error::PortalNotFound(\n   96 |                         // We are sure it is a valid interface name, should fix the type system\n   97 |                         // here\n   98 |                         zbus::names::OwnedInterfaceName::try_from(interface).unwrap(),\n   99 |                     ))\n  100 |                 } else {\n  101 |                     Ok(1)\n  102 |                 }\n  103 |             }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L93-L103"}]},
{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`ashpd` relies on `BitFlags<T>` implementing `serde::Serialize`/`Deserialize`\n(`DocumentFlags`, `SpawnFlags`, `SandboxFlags`, `SupportsFlags`, `HostCommandFlags`, ...), but\ndeclares `enumflags2 = \"0.7\"` without the `serde` feature. The build only works because\n`zvariant`/`zbus` happen to enable `enumflags2/serde` transitively\n(`cargo tree -i enumflags2 -e features` shows `enumflags2 feature \"serde\"` coming from\n`zbus`/`zvariant`, not from `ashpd`). If those crates ever stop needing it, `ashpd` breaks at\ncompile time for a feature it actually depends on directly.","fix":"Declare the dependency ashpd actually needs:\n```toml\nenumflags2 = { version = \"0.7\", features = [\"serde\"] }\n```","locations":[{"ref":"client/Cargo.toml:71","code":"   71 | enumflags2 = \"0.7\"","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/Cargo.toml#L71"},{"ref":"client/src/documents/mod.rs:46-59","code":"   46 | #[bitflags]\n   47 | #[derive(Serialize_repr, Deserialize_repr, PartialEq, Eq, Copy, Clone, Debug, Type)]\n   48 | #[repr(u32)]\n   49 | /// Document flags\n   50 | pub enum DocumentFlags {\n   51 |     /// Reuse the existing document store entry for the file.\n   52 |     ReuseExisting,\n   53 |     /// Persistent file.\n   54 |     Persistent,\n   55 |     /// Depends on the application needs.\n   56 |     AsNeededByApp,\n   57 |     /// Export a directory.\n   58 |     ExportDirectory,\n   59 | }","lines":14,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/mod.rs#L46-L59"}]},
{"id":"API_15","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`with_spawn` is compiled out whenever the `tokio` feature is enabled, so a user who wants their own\nexecutor (or who merely has `tokio` pulled in through feature unification by another crate) cannot\noverride the spawner at all, while `build_with_connection` still pretends the field may be set with\n`self.spawn.unwrap_or(...)`. The gate `cfg(not(any(feature = \"tokio\")))` also wraps a single feature\nin a pointless `any(...)`, and `unwrap_or(Arc::new(...))` allocates the `TokioSpawner` eagerly even\nwhen a spawner is present.","fix":"Make `with_spawn` unconditional (remove the `#[cfg(not(any(feature = \"tokio\")))]` line) and use\n`self.spawn.unwrap_or_else(|| Arc::new(super::spawn::TokioSpawner))` so an explicitly provided\nspawner always wins and nothing is allocated needlessly.","locations":[{"ref":"client/src/backend/builder.rs:95-102","code":"   95 |     #[cfg(not(any(feature = \"tokio\")))]\n   96 |     pub fn with_spawn(\n   97 |         mut self,\n   98 |         spawn: impl futures_util::task::Spawn + Send + Sync + 'static,\n   99 |     ) -> Self {\n  100 |         self.spawn = Some(Arc::new(spawn));\n  101 |         self\n  102 |     }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/builder.rs#L95-L102"},{"ref":"client/src/backend/builder.rs:223-224","code":"  223 |         #[cfg(feature = \"tokio\")]\n  224 |         let spawn = self.spawn.unwrap_or(Arc::new(super::spawn::TokioSpawner));","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/builder.rs#L223-L224"}]},
{"id":"API_16","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"All seven Lockdown property setters manually emit a `PropertiesChanged` signal\n(`self.<prop>_changed(ctxt).await?`). zbus already does this automatically: for a property whose\n`emits_changed_signal` is the default `true`, the generated `set` implementation calls\n`<prop>_changed(&signal_emitter)` right after the setter returns `Ok`\n(`zbus_macros/src/iface.rs`, `PropertyEmitsChangedSignal::True` branch). Every property write\ntherefore emits two identical `PropertiesChanged` signals and performs an extra object-server\ninterface lookup per call.","fix":"Delete the `object_server()`/`interface::<_, Self>()`/`signal_emitter()` dance and the\n`self.<prop>_changed(ctxt).await?` call from all seven setters, leaving only e.g.\n\n```rust\n    #[zbus(property, name = \"disable-printing\")]\n    async fn set_disable_printing(&self, disable_printing: bool) -> zbus::Result<()> {\n        self.imp.set_disable_printing(disable_printing).await\n    }\n```","locations":[{"ref":"client/src/backend/lockdown.rs:76-87","code":"   76 |     #[zbus(property, name = \"disable-printing\")]\n   77 |     async fn set_disable_printing(&self, disable_printing: bool) -> zbus::Result<()> {\n   78 |         let object_server = self.cnx.object_server();\n   79 |         let iface_ref = object_server\n   80 |             .interface::<_, Self>(crate::proxy::DESKTOP_PATH)\n   81 |             .await?;\n   82 |         let ctxt = iface_ref.signal_emitter();\n   83 | \n   84 |         self.imp.set_disable_printing(disable_printing).await?;\n   85 |         self.disable_printing_changed(ctxt).await?;\n   86 |         Ok(())\n   87 |     }","lines":12,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/lockdown.rs#L76-L87"},{"ref":"client/src/backend/lockdown.rs:191-204","code":"  191 |     #[zbus(property, name = \"disable-sound-output\")]\n  192 |     async fn set_disable_sound_output(&self, disable_sound_output: bool) -> zbus::Result<()> {\n  193 |         let object_server = self.cnx.object_server();\n  194 |         let iface_ref = object_server\n  195 |             .interface::<_, Self>(crate::proxy::DESKTOP_PATH)\n  196 |             .await?;\n  197 |         let ctxt = iface_ref.signal_emitter();\n  198 | \n  199 |         self.imp\n  200 |             .set_disable_sound_output(disable_sound_output)\n  201 |             .await?;\n  202 |         self.disable_sound_output_changed(ctxt).await?;\n  203 |         Ok(())\n  204 |     }","lines":14,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/lockdown.rs#L191-L204"}]},
{"id":"API_17","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`PermissionStoreInterface` exposes a `GetPermission` method (and `PermissionStoreImpl` forces every\nbackend to implement `get_permission`) that is not part of\n`interfaces/backend/org.freedesktop.impl.portal.PermissionStore.xml` - the spec only has `Lookup`,\n`Set`, `Delete`, `SetValue`, `List`, `SetPermission`, `DeletePermission` and the `Changed` signal.\nxdg-desktop-portal will never call it, so it is dead weight in the public trait and misleads\nbackend authors into thinking permission lookups go through it.","fix":"Drop `get_permission` from `PermissionStoreImpl` and the `GetPermission` D-Bus method, or - if it\nis intentionally an ashpd extension - document it as such and mark it `#[doc(hidden)]` with a\ndefault trait implementation that derives the answer from `lookup`, so existing backends keep\ncompiling.","locations":[{"ref":"client/src/backend/permission_store.rs:58-64","code":"   58 |     #[doc(alias = \"GetPermission\")]\n   59 |     async fn get_permission(\n   60 |         &self,\n   61 |         table: &str,\n   62 |         id: DocumentID,\n   63 |         app: MaybeAppID,\n   64 |     ) -> Result<Vec<Permission>, PortalError>;","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/permission_store.rs#L58-L64"},{"ref":"client/src/backend/permission_store.rs:215-230","code":"  215 |     #[zbus(out_args(\"permissions\"))]\n  216 |     async fn get_permission(\n  217 |         &self,\n  218 |         table: &str,\n  219 |         id: DocumentID,\n  220 |         app: MaybeAppID,\n  221 |     ) -> Result<Vec<Permission>, PortalError> {\n  222 |         #[cfg(feature = \"tracing\")]\n  223 |         tracing::debug!(\"PermissionStore::GetPermission\");\n  224 | \n  225 |         let response = self.imp.get_permission(table, id, app).await;\n  226 | \n  227 |         #[cfg(feature = \"tracing\")]\n  228 |         tracing::debug!(\"PermissionStore::GetPermission returned {:#?}\", response);\n  229 |         response\n  230 |     }","lines":16,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/permission_store.rs#L215-L230"}]},
{"id":"API_18","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Icon::inner_bytes()` panics with `panic!(\"Only bytes icons can be converted to a bytes variant\")`\nfor every non-`Bytes` variant, i.e. it uses a panic as its error path. It is only safe today\nbecause callers guard with `is_bytes()` (`dynamic_launcher.rs:299`, `:325`) or match on\n`Self::Bytes` first; a future caller that forgets the guard gets an abort instead of a compile\nerror or an `Err`.","fix":"Make the function total, e.g. change the signature to\n`pub(crate) fn inner_bytes(&self) -> Option<Value<'_>>` returning `None` for other variants (or\ntake `&[u8]` directly and call it only from the `Self::Bytes(bytes)` arms, which removes the\n`_ => panic!(...)` branch entirely).","locations":[{"ref":"client/src/desktop/icon.rs:40-52","code":"   40 |     pub(crate) fn inner_bytes<'a>(&'a self) -> Value<'a> {\n   41 |         match self {\n   42 |             Self::Bytes(bytes) => {\n   43 |                 let mut array = zvariant::Array::new(u8::SIGNATURE);\n   44 |                 for byte in bytes.iter() {\n   45 |                     // Safe to unwrap because we are sure it is of the correct type\n   46 |                     array.append(Value::from(*byte)).unwrap();\n   47 |                 }\n   48 |                 Value::from(array)\n   49 |             }\n   50 |             _ => panic!(\"Only bytes icons can be converted to a bytes variant\"),\n   51 |         }\n   52 |     }","lines":13,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/icon.rs#L40-L52"}]},
{"id":"API_19","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`ActivatedOptions::cursor_position` (and the public `Activated::cursor_position()`) is typed\n`Option<(f32, f32)>`, while the D-Bus type of the `cursor_position` key is `(dd)` (D-Bus has no\n32-bit float; `zvariant` maps `f32` onto `d` and truncates on the way in). The very same key is\ncorrectly typed `Option<(f64, f64)>` in `ReleaseOptions`, so the round trip\n\"read `Activated` position -> pass it back to `release()`\" is lossy and forces the casts seen\nin the module example (`let (x, y) = (x as f64, y as f64);`). In addition, `zvariant`'s\n`deserialize_f32` returns an error for any double larger than `f32::MAX`, which would make the\nwhole `Activated` signal silently unparseable (the signal stream drops undeserializable\nmessages).","fix":"Change the field and accessor to `Option<(f64, f64)>` to match the `(dd)` wire type and\n`ReleaseOptions::cursor_position`, and drop the `as f64` casts from the module-level example.","locations":[{"ref":"client/src/desktop/input_capture.rs:530-537","code":"  530 | struct ActivatedOptions {\n  531 |     #[serde(default, with = \"optional\")]\n  532 |     activation_id: Option<u32>,\n  533 |     #[serde(default, with = \"optional\")]\n  534 |     cursor_position: Option<(f32, f32)>,\n  535 |     #[serde(default, with = \"optional\")]\n  536 |     barrier_id: Option<ActivatedBarrier>,\n  537 | }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L530-L537"},{"ref":"client/src/desktop/input_capture.rs:555-558","code":"  555 |     /// The current cursor position in the same coordinate space as the zones.\n  556 |     pub fn cursor_position(&self) -> Option<(f32, f32)> {\n  557 |         self.1.cursor_position\n  558 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L555-L558"},{"ref":"client/src/desktop/input_capture.rs:461-463","code":"  461 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  462 |     cursor_position: Option<(f64, f64)>,\n  463 | }","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L461-L463"}]},
{"id":"API_20","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"The four `InputCapture::receive_*` methods return `impl Stream<Item = ...>` without a\n`use<>` precise-capturing bound. Under edition 2024 the opaque type captures the `&self`\nlifetime, so the returned stream borrows the `InputCapture` proxy even though\n`Proxy::signal()` returns `impl Stream<Item = I> + use<I>` and needs no borrow. Callers cannot\nmove or drop the `InputCapture` while holding the stream (e.g. `tokio::spawn` of an owned\ntask). The sibling portals already do this right (`inhibit.rs:242`,\n`global_shortcuts.rs:346`, `usb.rs:460`, `location.rs:259`).","fix":"Add the precise-capturing bound on all four signatures, e.g.\n```rust\n// before\npub async fn receive_activated(&self) -> Result<impl Stream<Item = Activated>, Error> {\n// after\npub async fn receive_activated(&self) -> Result<impl Stream<Item = Activated> + use<>, Error> {\n```","locations":[{"ref":"client/src/desktop/input_capture.rs:1064","code":" 1064 |     pub async fn receive_disabled(&self) -> Result<impl Stream<Item = Disabled>, Error> {","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L1064"},{"ref":"client/src/desktop/input_capture.rs:1075","code":" 1075 |     pub async fn receive_activated(&self) -> Result<impl Stream<Item = Activated>, Error> {","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L1075"},{"ref":"client/src/desktop/input_capture.rs:1086","code":" 1086 |     pub async fn receive_deactivated(&self) -> Result<impl Stream<Item = Deactivated>, Error> {","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L1086"},{"ref":"client/src/desktop/input_capture.rs:1096","code":" 1096 |     pub async fn receive_zones_changed(&self) -> Result<impl Stream<Item = ZonesChanged>, Error> {","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L1096"}]},
{"id":"API_21","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Proxy::signal` deliberately returns `impl Stream<Item = I> + use<I>` so the produced stream does\n*not* borrow the proxy (`client/src/proxy.rs:332-350`). Three of the public wrappers in this slice\ndrop the `use<>` bound, so under edition 2024 their return type implicitly captures the `&self`\nlifetime and the stream keeps the proxy borrowed for its whole life. That makes ergonomic patterns\nimpossible, e.g. a helper cannot create a proxy, return its signal stream and drop the proxy:\n\n```rust\nasync fn warnings() -> ashpd::Result<impl Stream<Item = u8>> {\n    let proxy = MemoryMonitor::new().await?;\n    proxy.receive_low_memory_warning().await // error: `proxy` does not live long enough\n}\n```\n\n`location.rs:257-261`, `global_shortcuts.rs:346`, `inhibit.rs:242` and `usb.rs:460` already add\n`+ use<>`, so this is an inconsistency rather than a deliberate design.","fix":"Add the `use<>` precise-capturing bound to match `LocationProxy::receive_location_updated`:\n\n```rust\n// before\npub async fn receive_action_invoked(&self) -> Result<impl Stream<Item = Action>, Error> {\n\n// after\npub async fn receive_action_invoked(&self) -> Result<impl Stream<Item = Action> + use<>, Error> {\n```\n\nSame for `receive_low_memory_warning` and `receive_changed` (and, for consistency, the remaining\n`impl Stream` returns in `session.rs`, `settings.rs`, `input_capture.rs` and `flatpak/`).","locations":[{"ref":"client/src/desktop/notification.rs:606-610","code":"  606 |     #[doc(alias = \"ActionInvoked\")]\n  607 |     #[doc(alias = \"XdpPortal::notification-action-invoked\")]\n  608 |     pub async fn receive_action_invoked(&self) -> Result<impl Stream<Item = Action>, Error> {\n  609 |         self.0.signal(\"ActionInvoked\").await\n  610 |     }","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L606-L610"},{"ref":"client/src/desktop/memory_monitor.rs:62-65","code":"   62 |     #[doc(alias = \"LowMemoryWarning\")]\n   63 |     pub async fn receive_low_memory_warning(&self) -> Result<impl Stream<Item = i32>, Error> {\n   64 |         self.0.signal(\"LowMemoryWarning\").await\n   65 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/memory_monitor.rs#L62-L65"},{"ref":"client/src/desktop/network_monitor.rs:215-218","code":"  215 |     #[doc(alias = \"changed\")]\n  216 |     pub async fn receive_changed(&self) -> Result<impl Stream<Item = ()>, Error> {\n  217 |         self.0.signal(\"changed\").await\n  218 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/network_monitor.rs#L215-L218"}]},
{"id":"API_22","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Settings` types its numeric fields inconsistently: `n_copies`, `scale` and `number_up` are `Option<u32>`\nserialized through `string_u32`, `resolution_x`/`resolution_y` are `Option<i32>` through `string_i32`, but\n`resolution` (documented as \"sets both resolution-x & resolution-y\"), `printer_lpi`, `paper_width` and\n`paper_height` are raw `Option<String>` even though they are numbers too. Callers must know which fields\nthey may pass a number to and which need manual `to_string()`, and nothing validates the string ones.","fix":"Type them like their siblings: `resolution: Option<u32>` with `with = \"string_u32\"`,\n`printer_lpi: Option<f64>` with a new `string_f64` helper module, and\n`paper_width`/`paper_height: Option<f64>` with `string_f64`. Keep the string setters as\n`#[deprecated]` shims if the breaking change is a concern.","locations":[{"ref":"client/src/desktop/print.rs:382-399","code":"  382 |     /// Paper width, in millimeters.\n  383 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  384 |     pub paper_width: Option<String>,\n  385 |     /// Paper height, in millimeters.\n  386 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  387 |     pub paper_height: Option<String>,\n  388 |     /// The number of copies to print.\n  389 |     #[serde(with = \"string_u32\", skip_serializing_if = \"Option::is_none\")]\n  390 |     pub n_copies: Option<u32>,\n  391 |     /// The default paper source.\n  392 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  393 |     pub default_source: Option<String>,\n  394 |     /// Print quality.\n  395 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  396 |     pub quality: Option<Quality>,\n  397 |     /// The resolution, sets both resolution-x & resolution-y\n  398 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  399 |     pub resolution: Option<String>,","lines":18,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L382-L399"},{"ref":"client/src/desktop/print.rs:442-450","code":"  442 |     /// The horizontal resolution in dpi.\n  443 |     #[serde(with = \"string_i32\", skip_serializing_if = \"Option::is_none\")]\n  444 |     pub resolution_x: Option<i32>,\n  445 |     /// The vertical resolution in dpi.\n  446 |     #[serde(with = \"string_i32\", skip_serializing_if = \"Option::is_none\")]\n  447 |     pub resolution_y: Option<i32>,\n  448 |     /// The resolution in lpi (lines per inch).\n  449 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  450 |     pub printer_lpi: Option<String>,","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L442-L450"}]},
{"id":"API_23","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"The builder setters in `remote_desktop.rs` (`NotifyPointerAxisOptions::set_finish`,\n`SelectDevicesOptions::set_devices`, `set_persist_mode`, `set_restore_token`) are consuming builders that\nreturn `Self` but are missing `#[must_use]`, unlike the equivalent setters in `print.rs`. Writing\n`options.set_finish(true);` as a statement compiles with no diagnostic and silently drops the option.","fix":"Add `#[must_use]` above each of `set_finish`, `set_devices`, `set_persist_mode` and `set_restore_token`,\nmatching the style used by `Settings`/`PageSetup`/`PreparePrintOptions` in `print.rs`.","locations":[{"ref":"client/src/desktop/remote_desktop.rs:210-216","code":"  210 | impl NotifyPointerAxisOptions {\n  211 |     /// Sets whether the axis event is the last one in a sequence.\n  212 |     pub fn set_finish(mut self, finish: bool) -> Self {\n  213 |         self.finish = finish;\n  214 |         self\n  215 |     }\n  216 | }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/remote_desktop.rs#L210-L216"},{"ref":"client/src/desktop/remote_desktop.rs:232-250","code":"  232 | impl SelectDevicesOptions {\n  233 |     /// Sets the device types to request remote controlling of.\n  234 |     pub fn set_devices(mut self, types: impl Into<Option<BitFlags<DeviceType>>>) -> Self {\n  235 |         self.types = types.into();\n  236 |         self\n  237 |     }\n  238 | \n  239 |     /// Sets the persist mode.\n  240 |     pub fn set_persist_mode(mut self, persist_mode: impl Into<Option<PersistMode>>) -> Self {\n  241 |         self.persist_mode = persist_mode.into();\n  242 |         self\n  243 |     }\n  244 | \n  245 |     /// Sets the restore token.\n  246 |     pub fn set_restore_token<'a>(mut self, token: impl Into<Option<&'a str>>) -> Self {\n  247 |         self.restore_token = token.into().map(ToOwned::to_owned);\n  248 |         self\n  249 |     }\n  250 | }","lines":19,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/remote_desktop.rs#L232-L250"}]},
{"id":"API_24","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"On the non-`tokio` (i.e. `async-io`) code path, `secret::retrieve()` performs a blocking\n`read_to_end` directly inside the async function, blocking the executor thread until the portal writes\nthe secret and closes its end of the socket pair (potentially forever if the portal misbehaves). The\n`tokio` path is also fragile: `client/Cargo.toml` declares `tokio` with `default-features = false` and no\n`rt` feature, so `tokio::task::spawn_blocking` only compiles because `zbus/tokio` happens to enable\n`tokio/rt` through feature unification.","fix":"Use the executor-appropriate off-thread read (e.g. `blocking::unblock` for the `async-io` path, or\nconvert the socket with `async_io::Async<UnixStream>` and use `futures_util::AsyncReadExt`), and add\n`\"rt\"` explicitly to the `tokio` dependency features in `client/Cargo.toml`.","locations":[{"ref":"client/src/desktop/secret.rs:129-134","code":"  129 |     #[cfg(not(feature = \"tokio\"))]\n  130 |     let buf = {\n  131 |         let mut buf = Vec::with_capacity(64);\n  132 |         x1.read_to_end(&mut buf)?;\n  133 |         buf\n  134 |     };","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/secret.rs#L129-L134"}]},
{"id":"API_25","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`UpdateMonitor::version()` always reports a fabricated `1`. The\n`org.freedesktop.portal.Flatpak.UpdateMonitor` interface has no `version` property (see\n`interfaces/org.freedesktop.portal.Flatpak.xml:35-48`), but `Proxy::with_connection`\nunconditionally issues `org.freedesktop.DBus.Properties.Get(.., \"version\")` and falls back to\n`Ok(1)` on any error it does not recognise (`client/src/proxy.rs:87-105`). Consequently every\n`Flatpak::create_update_monitor()` pays for an extra, always-failing D-Bus round trip and hands\nback an object whose `version()` accessor is meaningless.","fix":"Remove `UpdateMonitor::version()` (the interface is unversioned), and add a `Proxy` constructor\nvariant that skips the `version` property fetch for path-scoped, unversioned interfaces such as\n`org.freedesktop.portal.Flatpak.UpdateMonitor` and `org.freedesktop.portal.Request`.","locations":[{"ref":"client/src/flatpak/update_monitor.rs:172-175","code":"  172 |     /// Returns the version of the portal interface.\n  173 |     pub fn version(&self) -> u32 {\n  174 |         self.0.version()\n  175 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/update_monitor.rs#L172-L175"}]},
{"id":"API_26","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`WindowIdentifier::from_raw_handle` is a *safe* `async fn` that calls the `unsafe fn from_wayland_raw`, whose safety\ncontract is documented as \"Both surface and display pointers have to be valid. You must ensure the `display_ptr` lives\nlonger than the returned `WindowIdentifier`\". `RawWindowHandle`/`RawDisplayHandle` are plain `Copy` data with no\nlifetime tie to the window (that is the whole reason `raw_window_handle` 0.6 introduced the borrowed\n`WindowHandle<'_>`/`DisplayHandle<'_>` wrappers), so a caller can hand in handles obtained from an already-destroyed\nwindow and get UB from safe code. The unsafe requirement is silently laundered and not repeated in\n`from_raw_handle`'s documentation.","fix":"Take the borrowed wrappers instead of the raw enums - `pub async fn from_window_handle(window: WindowHandle<'_>,\ndisplay: Option<DisplayHandle<'_>>)` - so the borrow checker enforces that the window/display outlive the call, or make\n`from_raw_handle` `unsafe` and document the same invariant as `from_wayland_raw`.","locations":[{"ref":"client/src/window_identifier/mod.rs:168-196","code":"  168 |     #[cfg(feature = \"raw_handle\")]\n  169 |     #[cfg_attr(docsrs, doc(cfg(feature = \"raw_handle\")))]\n  170 |     /// Create an instance of [`WindowIdentifier`] from a\n  171 |     /// [`RawWindowHandle`](raw_window_handle::RawWindowHandle).\n  172 |     ///\n  173 |     /// The constructor returns a valid handle under both Wayland & X11.\n  174 |     ///\n  175 |     /// This method is only async and requires a `RawDisplayHandle` only for\n  176 |     /// Wayland handles.\n  177 |     pub async fn from_raw_handle(\n  178 |         window_handle: &RawWindowHandle,\n  179 |         display_handle: Option<&RawDisplayHandle>,\n  180 |     ) -> Option<Self> {\n  181 |         use raw_window_handle::RawWindowHandle::{Xcb, Xlib};\n  182 |         #[cfg(feature = \"wayland\")]\n  183 |         use raw_window_handle::{\n  184 |             RawDisplayHandle::Wayland as DisplayHandle, RawWindowHandle::Wayland,\n  185 |         };\n  186 |         match (window_handle, display_handle) {\n  187 |             #[cfg(feature = \"wayland\")]\n  188 |             (Wayland(wl_handle), Some(DisplayHandle(wl_display))) => unsafe {\n  189 |                 Self::from_wayland_raw(wl_handle.surface.as_ptr(), wl_display.display.as_ptr())\n  190 |                     .await\n  191 |             },\n  192 |             (Xlib(x_handle), _) => Some(Self::from_xid(x_handle.window)),\n  193 |             (Xcb(x_handle), _) => Some(Self::from_xid(x_handle.window.get().into())),\n  194 |             _ => None,\n  195 |         }\n  196 |     }","lines":29,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L168-L196"}]},
{"id":"API_27","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`From<Color> for gtk4::gdk::RGBA` never sets `alpha`; it relies on `RGBA::builder()` defaulting to\n`RGBA::WHITE` (alpha `1.0`). That default is an implementation detail of `gdk4` (`impl Default for\nRGBABuilder`), not part of a documented contract - if it ever becomes `RGBA::TRANSPARENT`/zeroed,\nevery picked colour silently turns fully transparent. The `f64 as f32` narrowing is also silent.","fix":"Be explicit about the alpha channel:\n```rust\ngtk4::gdk::RGBA::new(\n    color.red() as f32,\n    color.green() as f32,\n    color.blue() as f32,\n    1.0,\n)\n```","locations":[{"ref":"client/src/desktop/color.rs:47-56","code":"   47 | #[cfg(feature = \"gtk4\")]\n   48 | impl From<Color> for gtk4::gdk::RGBA {\n   49 |     fn from(color: Color) -> Self {\n   50 |         gtk4::gdk::RGBA::builder()\n   51 |             .red(color.red() as f32)\n   52 |             .green(color.green() as f32)\n   53 |             .blue(color.blue() as f32)\n   54 |             .build()\n   55 |     }\n   56 | }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/color.rs#L47-L56"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`Proxy::with_connection` is the single constructor for every proxy in the crate and it always performs\n`inner.get_property::<u32>(\"version\")`. Two consequences:\n\n1. The proxy is built with zbus' default `CacheProperties::Lazily` (verified in `zbus-5.x` `proxy/builder.rs`:\n   `Lazily` is `#[default]`), so the first `get_property` spins up a properties-cache task that issues an\n   `AddMatch` for `PropertiesChanged` **and** a `GetAll` call, then `get_property` may still issue a `Get`. That is\n   2-3 extra D-Bus round trips plus a long-lived match rule and a spawned task per proxy.\n2. It is done even for interfaces that have no `version` property and for objects that do not exist yet. Notably\n   `Request::with_connection` -> `Proxy::new_desktop_with_path(\"org.freedesktop.portal.Request\", path)` is on the hot\n   path of *every* portal request (`Proxy::request`), and `interfaces/org.freedesktop.portal.Request.xml` has no\n   `version` property; worse, the request object does not exist on the bus until the portal method call completes, so\n   `GetAll` and `Get` both fail and the result is discarded via the `_ => Ok(1)` arm. Every single portal request\n   therefore pays for two guaranteed-to-fail round trips and a leaked match rule.\n\nA side effect of caching is that `Proxy::property` returns cached values and, if the initial `GetAll` failed,\n`PropertiesCache::ready()` returns the stored error forever, so `property()` fails even when a plain `Get` would\nsucceed.","fix":"Build the inner proxy with `.cache_properties(zbus::proxy::CacheProperties::No)` and fetch `version` with an explicit\n`Get` (or via `zbus::fdo::PropertiesProxy`) only when a version is actually needed. Additionally give\n`Request`/`Session` a constructor that skips version negotiation entirely (e.g. `Proxy::without_version`), since\n`org.freedesktop.portal.Request` has no `version` property and the object does not exist when the proxy is created.\nConsider making `version` lazily fetched (`OnceCell<u32>`) so proxies that never call `*_versioned` cost zero extra\nround trips.","locations":[{"ref":"client/src/proxy.rs:80-107","code":"   80 |         let inner: zbus::Proxy = zbus::proxy::Builder::new(&connection)\n   81 |             .interface(interface)?\n   82 |             .path(path)?\n   83 |             .destination(destination)?\n   84 |             .build()\n   85 |             .await?;\n   86 | \n   87 |         let version = match inner\n   88 |             .get_property::<u32>(\"version\")\n   89 |             .await\n   90 |             .map_err(zbus::fdo::Error::from)\n   91 |         {\n   92 |             Ok(v) => Ok(v),\n   93 |             Err(zbus::fdo::Error::InvalidArgs(details)) => {\n   94 |                 if details.contains(interface) {\n   95 |                     Err(crate::Error::PortalNotFound(\n   96 |                         // We are sure it is a valid interface name, should fix the type system\n   97 |                         // here\n   98 |                         zbus::names::OwnedInterfaceName::try_from(interface).unwrap(),\n   99 |                     ))\n  100 |                 } else {\n  101 |                     Ok(1)\n  102 |                 }\n  103 |             }\n  104 |             _ => Ok(1),\n  105 |         }?;\n  106 |         Ok(Self { inner, version })\n  107 |     }","lines":28,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L80-L107"},{"ref":"client/src/proxy.rs:214-217","code":"  214 |     {\n  215 |         let connection = self.inner.connection();\n  216 |         let mut request = Request::from_unique_name(connection.clone(), handle_token).await?;\n  217 |         futures_util::try_join!(request.prepare_response(), async {","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L214-L217"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`SessionManager::try_contains` uses `ok_or(PortalError::NotFound(format!(...)))`, whose argument is\nevaluated eagerly. The error string is therefore allocated and formatted on *every* lookup,\nincluding the common success path, and `contains()` - which only wants a `bool` - goes through the\nsame allocation.","fix":"Use the lazy variant:\n\n```rust\nself.sessions\n    .get(token)\n    .ok_or_else(|| PortalError::NotFound(format!(\"Unknown session: `{token}`\")))\n```\n\nand implement `contains` as `self.sessions.contains_key(token)`.","locations":[{"ref":"client/src/backend/session.rs:146-157","code":"  146 |     pub fn try_contains(&self, token: &HandleToken) -> crate::backend::Result<&Session> {\n  147 |         self.sessions\n  148 |             .get(token)\n  149 |             .ok_or(PortalError::NotFound(format!(\"Unknown session: `{token}`\")))\n  150 |     }\n  151 | \n  152 |     /// Tests whether a session with the given handle token already exists.\n  153 |     pub fn contains(&self, token: &HandleToken) -> bool {\n  154 |         #[cfg(feature = \"tracing\")]\n  155 |         tracing::debug!(\"SessionManager::contains: tracked sessions: {:?}\", &self);\n  156 |         self.try_contains(token).is_ok()\n  157 |     }","lines":12,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/session.rs#L146-L157"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`camera::Stream::properties` returns `HashMap<String, String>` by value, deep-cloning every\nproperty string on each call, whereas `node_id()` returns a copy of a `u32`. Callers that only want\nto look one key up pay a full map clone.","fix":"Return a reference:\n\n```rust\npub fn properties(&self) -> &HashMap<String, String> {\n    &self.properties\n}\n```","locations":[{"ref":"client/src/desktop/camera.rs:155-158","code":"  155 |     /// The node properties.\n  156 |     pub fn properties(&self) -> HashMap<String, String> {\n  157 |         self.properties.clone()\n  158 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/camera.rs#L155-L158"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Both clipboard signal streams rebuild a `Session<T>` for *every* incoming signal via\n`Session::with_connection`, which goes through `Proxy::with_connection` and performs a blocking\n`Get(\"version\")` D-Bus round trip to `org.freedesktop.portal.Desktop` before the item is yielded.\n`SelectionTransfer` is emitted once per clipboard read request by a peer, so a busy clipboard\nsession pays an extra request/reply (plus a new `zbus::Proxy` with its own signal registration) per\nevent, serialized inside the stream.","fix":"Yield the `OwnedObjectPath` (or a cheap borrowed session handle) instead of constructing a fresh\n`Session<T>` per signal, or construct the `Session` once outside the `filter_map` closure and\ncompare `session.path()` with the signal's path, only forwarding signals that belong to it.","locations":[{"ref":"client/src/desktop/clipboard.rs:169-186","code":"  169 |     pub async fn receive_selection_owner_changed<T: IsClipboardSession>(\n  170 |         &self,\n  171 |     ) -> Result<impl Stream<Item = (Session<T>, SelectionOwnerChanged)>> {\n  172 |         let connection = self.connection().clone();\n  173 |         Ok(self\n  174 |             .0\n  175 |             .signal::<(OwnedObjectPath, SelectionOwnerChanged)>(\"SelectionOwnerChanged\")\n  176 |             .await?\n  177 |             .filter_map(move |(p, o)| {\n  178 |                 let connection = connection.clone();\n  179 |                 async move {\n  180 |                     Session::with_connection(connection, p)\n  181 |                         .await\n  182 |                         .map(|s| (s, o))\n  183 |                         .ok()\n  184 |                 }\n  185 |             }))\n  186 |     }","lines":18,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/clipboard.rs#L169-L186"},{"ref":"client/src/desktop/clipboard.rs:192-209","code":"  192 |     pub async fn receive_selection_transfer<T: IsClipboardSession>(\n  193 |         &self,\n  194 |     ) -> Result<impl Stream<Item = (Session<T>, String, u32)>> {\n  195 |         let connection = self.connection().clone();\n  196 |         Ok(self\n  197 |             .0\n  198 |             .signal::<(OwnedObjectPath, String, u32)>(\"SelectionTransfer\")\n  199 |             .await?\n  200 |             .filter_map(move |(p, mime_type, serial)| {\n  201 |                 let connection = connection.clone();\n  202 |                 async move {\n  203 |                     Session::with_connection(connection, p)\n  204 |                         .await\n  205 |                         .map(|session| (session, mime_type, serial))\n  206 |                         .ok()\n  207 |                 }\n  208 |             }))\n  209 |     }","lines":18,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/clipboard.rs#L192-L209"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`PrepareInstallResponse::icon()` deep-copies the icon value twice: `downcast_ref::<Value>()` on an\n`OwnedValue` that is not a nested variant falls through to `Value::try_from(&self)`, i.e.\n`try_clone()`, and `Icon::try_from(&Value<'_>)` then calls `value.try_to_owned()` - another full\nclone. Because `ay` arrays are stored as `Vec<Value>` (one `Value` per byte), a 100 KB icon is\ncopied as millions of bytes of `Value` nodes, twice, and the manual `Debug` impl triggers it on\nevery `{:?}`.","fix":"Use the `&OwnedValue` conversion directly and skip the intermediate clone:\n```rust\nIcon::try_from(&self.icon)\n```\ninstead of\n```rust\nlet inner = self.icon.downcast_ref::<Value>().unwrap();\nIcon::try_from(inner).unwrap()\n```","locations":[{"ref":"client/src/desktop/dynamic_launcher.rs:190-194","code":"  190 |     /// The user selected icon or a predefined one\n  191 |     pub fn icon(&self) -> Icon {\n  192 |         let inner = self.icon.downcast_ref::<Value>().unwrap();\n  193 |         Icon::try_from(inner).unwrap()\n  194 |     }","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/dynamic_launcher.rs#L190-L194"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Serializing an `Icon::Bytes` materialises one `zvariant::Value` per byte: `inner_bytes()` loops\nover the payload calling `Value::from(*byte)` and `array.append(...)`, and `append` compares the\nelement signature against the array signature on every single byte. A 100 KiB PNG icon\n(the normal `DynamicLauncher` use case) therefore allocates a `Vec` of 100k `Value` enums\n(several MiB) and performs 100k signature comparisons before anything is written to the wire.\n`Icon::Names` has the same shape but with a negligible element count.","fix":"In `impl Serialize for Icon`, avoid the intermediate `Array` entirely by serializing the slice\nas a variant: `tuple.serialize_element(&zvariant::as_value::Serialize(&bytes.as_slice()))?`.\nFor the `as_value()` path (which must yield a `Value`), build the array in one shot with\n`Value::from(zvariant::Array::from(bytes.as_slice()))` instead of the per-byte\n`append` loop.","locations":[{"ref":"client/src/desktop/icon.rs:40-52","code":"   40 |     pub(crate) fn inner_bytes<'a>(&'a self) -> Value<'a> {\n   41 |         match self {\n   42 |             Self::Bytes(bytes) => {\n   43 |                 let mut array = zvariant::Array::new(u8::SIGNATURE);\n   44 |                 for byte in bytes.iter() {\n   45 |                     // Safe to unwrap because we are sure it is of the correct type\n   46 |                     array.append(Value::from(*byte)).unwrap();\n   47 |                 }\n   48 |                 Value::from(array)\n   49 |             }\n   50 |             _ => panic!(\"Only bytes icons can be converted to a bytes variant\"),\n   51 |         }\n   52 |     }","lines":13,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/icon.rs#L40-L52"},{"ref":"client/src/desktop/icon.rs:93-96","code":"   93 |             Self::Bytes(_) => {\n   94 |                 tuple.serialize_element(\"bytes\")?;\n   95 |                 tuple.serialize_element(&self.inner_bytes())?;\n   96 |             }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/icon.rs#L93-L96"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`create_session2` awaits `Session::from_unique_name(...)` *before* issuing the versioned call.\n`Session::from_unique_name` builds a `zbus::Proxy` and does a `Get(\"version\")` D-Bus round trip\non a session object path that does not exist yet (the error is swallowed and the version\ndefaults to 1 in `Proxy::with_connection`). Consequently, on a version-1 portal - the documented\nfallback path in this very method's example - the code pays a full round trip only to then\nreturn `Error::RequiresVersion` from a purely local version check, and on the success path the\ntwo round trips are serialized instead of being joined as in `create_session`.","fix":"Check the version first and only then create the session proxy, e.g. call\n`self.0.call_versioned::<CreateSession2Results>(...)` inside a\n`futures_util::try_join!` with `Session::from_unique_name(...)`, or guard with\n`if self.version() < 2 { return Err(Error::RequiresVersion(2, self.version())); }` before\nbuilding the proxy.","locations":[{"ref":"client/src/desktop/input_capture.rs:904-917","code":"  904 |     pub async fn create_session2(\n  905 |         &self,\n  906 |         options: CreateSession2Options,\n  907 |     ) -> Result<Session<Self>, Error> {\n  908 |         let proxy =\n  909 |             Session::from_unique_name(self.0.connection().clone(), &options.session_handle_token)\n  910 |                 .await?;\n  911 |         let response = self\n  912 |             .0\n  913 |             .call_versioned::<CreateSession2Results>(\"CreateSession2\", &options, 2)\n  914 |             .await?;\n  915 |         assert_eq!(proxy.path(), &response.session_handle.as_ref());\n  916 |         Ok(proxy)\n  917 |     }","lines":14,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L904-L917"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Request::with_connection` builds the request proxy via `Proxy::new_desktop_with_path`, and\n`Proxy::with_connection` unconditionally performs a `org.freedesktop.DBus.Properties.Get(\"version\")`\nround trip. `org.freedesktop.portal.Request` has **no** `version` property\n(see `interfaces/org.freedesktop.portal.Request.xml`: only `Close` and the `Response` signal), and the\nrequest object is not even exported by the portal until the actual portal method is invoked - which\nhappens *after* this call in `Proxy::request`. So every single portal request pays for one extra\nround trip whose error is then swallowed by the `_ => Ok(1)` arm in `Proxy::with_connection`, and the\nresulting `version` value is never read by `Request`.","fix":"Add a constructor to `Proxy` that skips the `version` fetch (e.g.\n`Proxy::new_desktop_with_path_no_version`, storing `version: 0`) and use it from\n`Request::with_connection`; do the same for `Session` if its version is likewise unused.","locations":[{"ref":"client/src/desktop/request.rs:214-228","code":"  214 |     pub(crate) async fn with_connection<P>(\n  215 |         connection: zbus::Connection,\n  216 |         path: P,\n  217 |     ) -> Result<Request<T>, Error>\n  218 |     where\n  219 |         P: TryInto<ObjectPath<'static>>,\n  220 |         P::Error: Into<zbus::Error>,\n  221 |     {\n  222 |         let proxy =\n  223 |             Proxy::new_desktop_with_path(connection, \"org.freedesktop.portal.Request\", path)\n  224 |                 .await?;\n  225 |         // Start listening for a response signal the moment request is created\n  226 |         let stream = proxy.receive_signal(\"Response\").await?;\n  227 |         Ok(Self(proxy, stream, Default::default(), PhantomData))\n  228 |     }","lines":15,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/request.rs#L214-L228"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Every `Session` creation performs an extra, always-failing D-Bus round trip. `Session::with_connection`\ngoes through `Proxy::with_connection`, which unconditionally does `get_property::<u32>(\"version\")`. In\n`from_unique_name` the session object does not exist yet (it is created concurrently by the portal's\n`CreateSession` call in the `try_join!`), so the Get fails, falls into `Proxy`'s catch-all `_ => Ok(1)`\narm and the stored version is always a bogus `1` - a wasted request/response for every session created.","fix":"Add a `Proxy` constructor that skips the `version` probe (e.g. `Proxy::new_desktop_with_path_unversioned`)\nand use it for `org.freedesktop.portal.Session`, or fetch `version` lazily on first use.","locations":[{"ref":"client/src/desktop/session.rs:35-62","code":"   35 |     pub(crate) async fn with_connection<P>(\n   36 |         connection: zbus::Connection,\n   37 |         path: P,\n   38 |     ) -> Result<Self, Error>\n   39 |     where\n   40 |         P: TryInto<ObjectPath<'static>>,\n   41 |         P::Error: Into<zbus::Error>,\n   42 |     {\n   43 |         let proxy =\n   44 |             Proxy::new_desktop_with_path(connection, \"org.freedesktop.portal.Session\", path)\n   45 |                 .await?;\n   46 |         Ok(Self(proxy, PhantomData))\n   47 |     }\n   48 | \n   49 |     pub(crate) async fn from_unique_name(\n   50 |         connection: zbus::Connection,\n   51 |         handle_token: &HandleToken,\n   52 |     ) -> Result<Self, crate::Error> {\n   53 |         let path = Proxy::unique_name(\n   54 |             &connection,\n   55 |             \"/org/freedesktop/portal/desktop/session\",\n   56 |             handle_token,\n   57 |         )\n   58 |         .await?;\n   59 |         #[cfg(feature = \"tracing\")]\n   60 |         tracing::info!(\"Creating a org.freedesktop.portal.Session {}\", path);\n   61 |         Self::with_connection(connection, path).await\n   62 |     }","lines":28,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/session.rs#L35-L62"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Settings::read` deep-copies the received value twice. `value.downcast_ref::<Value>()` resolves to\n`TryFrom<&Value> for Value`, which is `value.try_clone()` (a full recursive clone), and it succeeds for\n*every* non-fd value - so the `else` branch is effectively unreachable dead code. The result is then\ncloned a second time by `v.try_to_owned()?`. For a large dictionary/array setting this doubles the work\nof every `read()`.","fix":"Unwrap the (xdp-specific) double-wrapped variant explicitly and clone at most once:\n```rust\nlet value = self.0.call::<OwnedValue>(\"Read\", &(namespace, key)).await?;\n// xdg-desktop-portal's `Read` wraps the value in an extra variant; `ReadOne` does not.\nlet value = match &*value {\n    Value::Value(inner) => inner.try_to_owned()?,\n    _ => value,\n};\nT::try_from(value).map_err(From::from)\n```","locations":[{"ref":"client/src/desktop/settings.rs:285-291","code":"  285 |         let value = self.0.call::<OwnedValue>(\"Read\", &(namespace, key)).await?;\n  286 |         if let Ok(v) = value.downcast_ref::<Value>() {\n  287 |             T::try_from(v.try_to_owned()?).map_err(From::from)\n  288 |         } else {\n  289 |             T::try_from(value).map_err(From::from)\n  290 |         }\n  291 |     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/settings.rs#L285-L291"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`Documents::list()` deserializes the `a{say}` reply into `HashMap<String, FilePath>` and then\nbuilds a *second* `HashMap<DocumentID, FilePath>` entry by entry, doubling the allocations and\nrehashing every key for no reason. `DocumentID` derives `Deserialize` and implements\n`Basic` with `String`'s signature (`client/src/app_id.rs:162-168`), and the unit test in the same\nfile asserts `HashMap::<DocumentID, FilePath>::SIGNATURE == \"a{say}\"`\n(`client/src/documents/mod.rs:545`). `Documents::host_paths()` a few lines below already\ndeserializes straight into `HashMap<DocumentID, FilePath>`, proving the intermediate map is dead\nwork.","fix":"Replace the body with a direct call:\n```rust\nlet app_id = app_id.map(|id| id.as_ref()).unwrap_or(\"\");\nself.0.call(\"List\", &(app_id)).await\n```","locations":[{"ref":"client/src/documents/mod.rs:425-438","code":"  425 |     pub async fn list(\n  426 |         &self,\n  427 |         app_id: Option<&AppID>,\n  428 |     ) -> Result<HashMap<DocumentID, FilePath>, Error> {\n  429 |         let app_id = app_id.map(|id| id.as_ref()).unwrap_or(\"\");\n  430 |         let response: HashMap<String, FilePath> = self.0.call(\"List\", &(app_id)).await?;\n  431 | \n  432 |         let mut new_response: HashMap<DocumentID, FilePath> = HashMap::new();\n  433 |         for (key, file_name) in response {\n  434 |             new_response.insert(DocumentID::from(key), file_name);\n  435 |         }\n  436 | \n  437 |         Ok(new_response)\n  438 |     }","lines":14,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/mod.rs#L425-L438"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`WaylandWindowIdentifier::new_inner` spawns a fresh OS thread (`std::thread::spawn`) for every window-identifier\ncreation just to run two blocking `event_queue.roundtrip()` calls, and communicates the result back over a oneshot\nchannel. Besides the thread-creation cost on what is a UI-latency-sensitive path, the blocking roundtrips run\nconcurrently with the application's own event loop on the same `wl_display`, and the thread outlives the future when\nthe future is dropped (nothing cancels it). The `gtk4` path solves the same problem without a thread.","fix":"Either drive the export from the caller's async context (register the exporter and poll the event queue via\n`wayland_client::EventQueue::prepare_read` + an async fd readiness future from `tokio`/`async-io`), or hand the\nblocking work to the runtime's blocking pool (`tokio::task::spawn_blocking` / `blocking::unblock`) instead of a raw\n`std::thread::spawn`, so threads are reused and cancellation is handled by the runtime.","locations":[{"ref":"client/src/window_identifier/wayland.rs:83-99","code":"   83 |     async fn new_inner(conn: wayland_client::Connection, surface: &WlSurface) -> Option<Self> {\n   84 |         let (sender, receiver) =\n   85 |             futures_channel::oneshot::channel::<Option<WaylandWindowIdentifier>>();\n   86 | \n   87 |         // Cheap clone, protocol objects are essentially smart pointers\n   88 |         let surface = surface.clone();\n   89 |         std::thread::spawn(move || match wayland_export_handle(conn, &surface) {\n   90 |             Ok(window_handle) => sender.send(Some(window_handle)).unwrap(),\n   91 |             Err(_err) => {\n   92 |                 #[cfg(feature = \"tracing\")]\n   93 |                 tracing::info!(\"Could not get wayland window identifier: {_err}\");\n   94 |                 sender.send(None).unwrap();\n   95 |             }\n   96 |         });\n   97 | \n   98 |         receiver.await.unwrap()\n   99 |     }","lines":17,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L83-L99"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`Serialize for MaybeAppID` formats the value into a freshly allocated `String`\n(`self.to_string()`) on every serialization, although both variants already hold a `String` that can\nbe borrowed.","fix":"```rust\n        match &self.0 {\n            Ok(app_id) => serializer.serialize_str(app_id),\n            Err(app_id) => serializer.serialize_str(app_id),\n        }\n```","locations":[{"ref":"client/src/app_id.rs:133-140","code":"  133 | impl Serialize for MaybeAppID {\n  134 |     fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>\n  135 |     where\n  136 |         S: serde::Serializer,\n  137 |     {\n  138 |         serializer.serialize_str(self.to_string().as_str())\n  139 |     }\n  140 | }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/app_id.rs#L133-L140"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`is_valid_app_id` allocates a `Vec<&str>` just to learn how many `.`-separated segments there are;\nthe subsequent loop only needs the segment count and an iterator.","fix":"```rust\n    let segments = string.split('.').count();\n    if segments < 2 {\n        return false;\n    }\n    for (idx_segment, element) in string.split('.').enumerate() {\n```","locations":[{"ref":"client/src/app_id.rs:218-225","code":"  218 |     let elements: Vec<&str> = string.split('.').collect();\n  219 |     let segments = elements.len();\n  220 | \n  221 |     if segments < 2 {\n  222 |         return false;\n  223 |     }\n  224 | \n  225 |     for (idx_segment, element) in elements.iter().enumerate() {","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/app_id.rs#L218-L225"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`access::Choice::pairs()` allocates a new `Vec` on every call even though the data is already stored\nas `Vec<(String, String)>` in the struct.","fix":"Return a borrow instead: `pub fn pairs(&self) -> &[(String, String)] { &self.2 }` (or an\n`impl Iterator<Item = (&str, &str)> + '_`).","locations":[{"ref":"client/src/backend/access.rs:48-54","code":"   48 |     /// Pairs of choices.\n   49 |     pub fn pairs(&self) -> Vec<(&str, &str)> {\n   50 |         self.2\n   51 |             .iter()\n   52 |             .map(|(x, y)| (x.as_str(), y.as_str()))\n   53 |             .collect::<Vec<_>>()\n   54 |     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/access.rs#L48-L54"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"The `AvailableSourceTypes` / `AvailableCursorModes` property getters clone the `Arc` before calling\na method that only needs `&self`, bumping the reference count twice per property read for no\nreason. `ScreenshotInterface::available_targets` (`client/src/backend/screenshot.rs:64-67`) shows\nthe correct form.","fix":"Call the implementation directly:\n\n```rust\nfn available_source_types(&self) -> u32 {\n    self.imp.available_source_types().bits()\n}\n```\n\nand likewise for `available_cursor_mode`.","locations":[{"ref":"client/src/backend/screencast.rs:88-104","code":"   88 |     #[zbus(\n   89 |         property(emits_changed_signal = \"const\"),\n   90 |         name = \"AvailableSourceTypes\"\n   91 |     )]\n   92 |     fn available_source_types(&self) -> u32 {\n   93 |         let imp = Arc::clone(&self.imp);\n   94 |         imp.available_source_types().bits()\n   95 |     }\n   96 | \n   97 |     #[zbus(\n   98 |         property(emits_changed_signal = \"const\"),\n   99 |         name = \"AvailableCursorModes\"\n  100 |     )]\n  101 |     fn available_cursor_mode(&self) -> u32 {\n  102 |         let imp = Arc::clone(&self.imp);\n  103 |         imp.available_cursor_mode().bits()\n  104 |     }","lines":17,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/screencast.rs#L88-L104"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`Display for Color` builds a temporary `String` with `format!` and then hands it to\n`f.write_str`, allocating on every formatting operation for no reason.","fix":"Write straight into the formatter:\n```rust\nwrite!(f, \"({}, {}, {})\", self.red(), self.green(), self.blue())\n```\ninstead of `f.write_str(&format!(\"({}, {}, {})\", ...))`.","locations":[{"ref":"client/src/desktop/color.rs:68-77","code":"   68 | impl std::fmt::Display for Color {\n   69 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n   70 |         f.write_str(&format!(\n   71 |             \"({}, {}, {})\",\n   72 |             self.red(),\n   73 |             self.green(),\n   74 |             self.blue()\n   75 |         ))\n   76 |     }\n   77 | }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/color.rs#L68-L77"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`FileFilter::mimetype_filters`, `FileFilter::pattern_filters` and `Choice::pairs` allocate a fresh\n`Vec` on every call even though they only re-borrow data that is already owned by `self`. Callers\nthat inspect filters in a loop (typical in a backend implementation) allocate per iteration.","fix":"Return iterators instead of vectors, e.g.\n```rust\npub fn mimetype_filters(&self) -> impl Iterator<Item = &str> + '_ {\n    self.1\n        .iter()\n        .filter_map(|(t, s)| t.is_mimetype().then_some(s.as_str()))\n}\n```\n(same shape for `pattern_filters` and `Choice::pairs`), or keep the `Vec` versions as thin wrappers\nfor backwards compatibility.","locations":[{"ref":"client/src/desktop/file_chooser.rs:149-163","code":"  149 |     /// List of mimetypes filters.\n  150 |     pub fn mimetype_filters(&self) -> Vec<&str> {\n  151 |         self.1\n  152 |             .iter()\n  153 |             .filter_map(|(type_, string)| type_.is_mimetype().then_some(string.as_str()))\n  154 |             .collect()\n  155 |     }\n  156 | \n  157 |     /// List of glob patterns filters.\n  158 |     pub fn pattern_filters(&self) -> Vec<&str> {\n  159 |         self.1\n  160 |             .iter()\n  161 |             .filter_map(|(type_, string)| type_.is_pattern().then_some(string.as_str()))\n  162 |             .collect()\n  163 |     }","lines":15,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/file_chooser.rs#L149-L163"},{"ref":"client/src/desktop/file_chooser.rs:215-221","code":"  215 |     /// Pairs of choices.\n  216 |     pub fn pairs(&self) -> Vec<(&str, &str)> {\n  217 |         self.2\n  218 |             .iter()\n  219 |             .map(|(x, y)| (x.as_str(), y.as_str()))\n  220 |             .collect::<Vec<_>>()\n  221 |     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/file_chooser.rs#L215-L221"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`impl TryFrom<&Value<'_>> for Icon` deep-copies the whole value with `value.try_to_owned()?`\nbefore inspecting it, and `impl TryFrom<Value<'_>> for Icon` routes through the reference impl,\nso it also deep-copies a value it already owns. For an `Icon::Bytes` this duplicates the entire\nbyte array (as a `Vec<Value>`); for `Icon::FileDescriptor` it performs an extra `dup(2)` that is\nimmediately closed again.","fix":"Extract the decoding logic into a helper taking `&Value<'_>` and have all four `TryFrom` impls\ncall it, so no `try_to_owned()` (and no fd `dup`) is needed just to read the value.","locations":[{"ref":"client/src/desktop/icon.rs:201-212","code":"  201 | impl TryFrom<Value<'_>> for Icon {\n  202 |     type Error = crate::Error;\n  203 |     fn try_from(value: Value<'_>) -> Result<Self, Self::Error> {\n  204 |         Self::try_from(&value)\n  205 |     }\n  206 | }\n  207 | impl TryFrom<&Value<'_>> for Icon {\n  208 |     type Error = crate::Error;\n  209 |     fn try_from(value: &Value<'_>) -> Result<Self, Self::Error> {\n  210 |         Self::try_from(value.try_to_owned()?)\n  211 |     }\n  212 | }","lines":12,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/icon.rs#L201-L212"}]},
{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"Minor needless allocations in the USB portal: `vendor()`/`model()` use `downcast_ref::<String>()`, which\ngoes through `TryFrom<&Value> for String` and clones the string even when the caller only needs a\n`&str`; `acquire_devices` renders the window identifier with `i.to_string()` into an owned `String`\ninstead of using `Optional::from(identifier)` like every other portal in the crate.","fix":"Use `downcast_ref::<&str>()` and return `Option<&str>` from `vendor()` (letting `model()` own the string\nonly because it rewrites it), and serialize the identifier with\n`let parent_window = Optional::from(parent_window);` as `screencast.rs`/`screenshot.rs` do.","locations":[{"ref":"client/src/desktop/usb.rs:146-151","code":"  146 |     pub fn vendor(&self) -> Option<String> {\n  147 |         self.properties\n  148 |             .get(\"ID_VENDOR_FROM_DATABASE\")\n  149 |             .or_else(|| self.properties.get(\"ID_VENDOR_ENC\"))\n  150 |             .and_then(|v| v.downcast_ref::<String>().ok())\n  151 |     }","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/usb.rs#L146-L151"},{"ref":"client/src/desktop/usb.rs:373-375","code":"  373 |     ) -> Result<Vec<(DeviceID, Result<OwnedFd, UsbError>)>, Error> {\n  374 |         let parent_window = parent_window.map(|i| i.to_string()).unwrap_or_default();\n  375 |         let acquire_devices: Vec<(DeviceID, AcquireDevice)> = devices","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/usb.rs#L373-L375"}]},
{"id":"PERF_21","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`is_flatpak` heap-allocates a `PathBuf` for a string literal just to call `exists()`.","fix":"Use a borrowed path:\n```rust\npub(crate) fn is_flatpak() -> bool {\n    std::path::Path::new(\"/.flatpak-info\").exists()\n}\n```","locations":[{"ref":"client/src/helpers.rs:3-5","code":"    3 | pub(crate) fn is_flatpak() -> bool {\n    4 |     std::path::PathBuf::from(\"/.flatpak-info\").exists()\n    5 | }","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/helpers.rs#L3-L5"}]},
