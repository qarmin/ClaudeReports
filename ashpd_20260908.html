 with rename_all, kept for clarity\n    button_purpose: Vec<String>,\n}\n```\n\nMake both fields `Option<Vec<String>>` (or keep them required only if the portal guarantees them)\nso an absent key yields `None` instead of `IncorrectType`, and drop the now-unused `Deserialize`\nderive plus the `#[serde(...)]` attributes. Add a unit test that builds an\n`OwnedValue` dict with the keys `category` and `button-purpose` and asserts\n`SupportedOptions::try_from(...)` succeeds.","locations":[{"ref":"client/src/desktop/notification.rs:548-557","code":"  548 | #[derive(Deserialize, Type, Debug, OwnedValue)]\n  549 | #[zvariant(signature = \"dict\")]\n  550 | #[serde(rename_all = \"kebab-case\")]\n  551 | // TODO: figure out why this can't use the enums\n  552 | struct SupportedOptions {\n  553 |     #[serde(default, with = \"as_value\")]\n  554 |     category: Vec<String>,\n  555 |     #[serde(default, with = \"as_value\")]\n  556 |     button_purpose: Vec<String>,\n  557 | }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L548-L557"},{"ref":"client/src/desktop/notification.rs:662-678","code":"  662 |     pub async fn supported_options(&self) -> Result<(Vec<Category>, Vec<ButtonPurpose>), Error> {\n  663 |         let options = self\n  664 |             .0\n  665 |             .property_versioned::<SupportedOptions>(\"SupportedOptions\", 2)\n  666 |             .await?;\n  667 |         let categories = options\n  668 |             .category\n  669 |             .into_iter()\n  670 |             .map(|c| Category::from_str(&c).unwrap())\n  671 |             .collect();\n  672 |         let purposes = options\n  673 |             .button_purpose\n  674 |             .into_iter()\n  675 |             .map(|c| ButtonPurpose::from_str(&c).unwrap())\n  676 |             .collect();\n  677 |         Ok((categories, purposes))\n  678 |     }","lines":17,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L662-L678"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`PreparePrintOptions` carries `#[serde(rename_all = \"kebab-case\")]`, which looks copy-pasted from the\n`Settings` struct above it (where kebab-case *is* correct). The xdg-desktop-portal `Print` interface uses\nsnake_case *option* keys, so this silently renames four options on the wire:\n\n- `accept_label` -> `accept-label`\n- `supported_output_file_formats` -> `supported-output-file-formats`\n- `has_current_page` -> `has-current-page`\n- `has_selected_pages` -> `has-selected-pages`\n\nThe portal ignores unknown option keys, so `set_accept_label`, `set_supported_output_file_formats`,\n`set_has_current_page` and `set_has_selected_pages` are all silent no-ops. The fact that `handle_token`\ncarries an explicit `#[serde(rename = \"handle_token\")]` to undo the container rule is direct evidence\nthat the `rename_all` was not intended. Every other options struct in the crate that needs snake_case\nkeys (e.g. `OpenFileOptions` in `file_chooser.rs`) simply has no `rename_all` at all.","fix":"Drop `#[serde(rename_all = \"kebab-case\")]` from `PreparePrintOptions` and then also drop the now\nredundant `#[serde(rename = \"handle_token\")]` on the `handle_token` field:\n\n```rust\n#[derive(Serialize, Deserialize, Type, Debug, Default)]\n#[zvariant(signature = \"dict\")]\npub struct PreparePrintOptions {\n    #[serde(with = \"as_value\", skip_deserializing)]\n    handle_token: HandleToken,\n    ...\n}\n```","locations":[{"ref":"client/src/desktop/print.rs:776-817","code":"  776 | #[derive(Serialize, Deserialize, Type, Debug, Default)]\n  777 | /// Specified options for a [`PrintProxy::prepare_print`] request.\n  778 | #[zvariant(signature = \"dict\")]\n  779 | #[serde(rename_all = \"kebab-case\")]\n  780 | pub struct PreparePrintOptions {\n  781 |     /// A string that will be used as the last element of the handle.\n  782 |     #[serde(rename = \"handle_token\", with = \"as_value\", skip_deserializing)]\n  783 |     handle_token: HandleToken,\n  784 |     /// Whether to make the dialog modal.\n  785 |     #[serde(default, with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  786 |     modal: Option<bool>,\n  787 |     /// Label for the accept button. Mnemonic underlines are allowed.\n  788 |     #[serde(default, with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  789 |     accept_label: Option<String>,\n  790 |     /// File formats supported by the app for print-to-file.\n  791 |     /// Added in version 3.\n  792 |     #[serde(\n  793 |         default,\n  794 |         with = \"as_value\",\n  795 |         skip_serializing_if = \"Vec::is_empty\",\n  796 |         skip_deserializing\n  797 |     )]\n  798 |     supported_output_file_formats: Vec<OutputFileFormat>,\n  799 |     /// Whether it makes sense to return \"current\" for the print-pages setting.\n  800 |     /// Added in version 4.\n  801 |     #[serde(\n  802 |         default,\n  803 |         with = \"optional\",\n  804 |         skip_serializing_if = \"Option::is_none\",\n  805 |         skip_deserializing\n  806 |     )]\n  807 |     has_current_page: Option<bool>,\n  808 |     /// Whether it makes sense to return \"selection\" for the print-pages\n  809 |     /// setting. Added in version 4.\n  810 |     #[serde(\n  811 |         default,\n  812 |         with = \"optional\",\n  813 |         skip_serializing_if = \"Option::is_none\",\n  814 |         skip_deserializing\n  815 |     )]\n  816 |     has_selected_pages: Option<bool>,\n  817 | }","lines":42,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L776-L817"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"`WindowIdentifierType::set_parent_of` looks up the EWMH atom `\"_NET_WM_WINDOW_DIALOG_TYPE\"`, which does not exist. The\ncorrect EWMH atom (and the one used by the referenced libgxdp code) is `_NET_WM_WINDOW_TYPE_DIALOG`. Because\n`x11_get_xatom_by_name_for_display` interns unknown names, the call succeeds and a meaningless atom is stored in\n`_NET_WM_WINDOW_TYPE`, so window managers do not treat the backend dialog as a dialog (no dialog decorations, wrong\nstacking/placement) while `set_parent_of` still returns `true`.","fix":"Rename the atom:\n\n```rust\n// before\nlet net_wm_window_type_dialog_atom = gdk4x11::x11_get_xatom_by_name_for_display(\n    &display,\n    \"_NET_WM_WINDOW_DIALOG_TYPE\",\n);\n// after\nlet net_wm_window_type_dialog_atom = gdk4x11::x11_get_xatom_by_name_for_display(\n    &display,\n    \"_NET_WM_WINDOW_TYPE_DIALOG\",\n);\n```","locations":[{"ref":"client/src/window_identifier/mod.rs:441-445","code":"  441 |                         gdk4x11::x11_get_xatom_by_name_for_display(&display, \"_NET_WM_WINDOW_TYPE\");\n  442 |                     let net_wm_window_type_dialog_atom = gdk4x11::x11_get_xatom_by_name_for_display(\n  443 |                         &display,\n  444 |                         \"_NET_WM_WINDOW_DIALOG_TYPE\",\n  445 |                     );","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L441-L445"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"Same defect as in `PreparePrintOptions`: `PrintOptions` has `#[serde(rename_all = \"kebab-case\")]`, which\nturns the `supported_output_file_formats` option key into `supported-output-file-formats`. The portal\nignores the unknown key, so `PrintOptions::set_supported_output_file_formats` is a silent no-op.\n`modal` and `token` happen to survive only because they contain no underscore.","fix":"Remove `#[serde(rename_all = \"kebab-case\")]` from `PrintOptions` and the now redundant\n`#[serde(rename = \"handle_token\")]` on its `handle_token` field.","locations":[{"ref":"client/src/desktop/print.rs:874-898","code":"  874 | #[derive(Serialize, Deserialize, Type, Debug, Default)]\n  875 | /// Specified options for a [`PrintProxy::print`] request.\n  876 | #[zvariant(signature = \"dict\")]\n  877 | #[serde(rename_all = \"kebab-case\")]\n  878 | pub struct PrintOptions {\n  879 |     /// A string that will be used as the last element of the handle.\n  880 |     #[serde(rename = \"handle_token\", with = \"as_value\", skip_deserializing)]\n  881 |     handle_token: HandleToken,\n  882 |     /// Whether to make the dialog modal.\n  883 |     #[serde(default, with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  884 |     modal: Option<bool>,\n  885 |     /// Token that was returned by a previous [`PrintProxy::prepare_print`]\n  886 |     /// call.\n  887 |     #[serde(default, with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  888 |     token: Option<u32>,\n  889 |     /// File formats supported by the app for print-to-file.\n  890 |     /// Added in version 3.\n  891 |     #[serde(\n  892 |         default,\n  893 |         with = \"as_value\",\n  894 |         skip_serializing_if = \"Vec::is_empty\",\n  895 |         skip_deserializing\n  896 |     )]\n  897 |     supported_output_file_formats: Vec<OutputFileFormat>,\n  898 | }","lines":25,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L874-L898"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`flatpak/development.rs` was clearly copied from `flatpak/mod.rs` and three names were not\nupdated for the `org.freedesktop.Flatpak.Development` interface:\n\n- `host_command_signal()` carries `#[doc(alias = \"SpawnSignal\")]` and\n  `#[doc(alias = \"xdp_portal_spawn_signal\")]`, which are the D-Bus member / libportal symbol of\n  `Flatpak::spawn_signal`, not of `HostCommandSignal`.\n- `host_command()` has no `#[doc(alias = \"HostCommand\")]` at all, so searching the docs for the\n  D-Bus member name does not find it (every other wrapper in the crate has this alias).\n- The `HostCommandExited` signal wrapper is named `receive_spawn_exited()`, the name used for the\n  unrelated `Flatpak::SpawnExited` signal in `flatpak/mod.rs:320`.\n\nBecause there is no `interfaces/org.freedesktop.Flatpak.Development.xml`, the\n`all_interfaces_have_implementations` test in `client/src/lib.rs:267` cannot catch any of this.","fix":"Replace the aliases on `host_command_signal` with\n`#[doc(alias = \"HostCommandSignal\")]`, add `#[doc(alias = \"HostCommand\")]` above\n`host_command`, and rename `receive_spawn_exited` to `receive_host_command_exited` (keeping a\ndeprecated alias if the old name has to stay for backwards compatibility).","locations":[{"ref":"client/src/flatpak/development.rs:115-117","code":"  115 |     #[doc(alias = \"SpawnSignal\")]\n  116 |     #[doc(alias = \"xdp_portal_spawn_signal\")]\n  117 |     pub async fn host_command_signal(","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/development.rs#L115-L117"},{"ref":"client/src/flatpak/development.rs:59-62","code":"   59 |     #[doc(alias = \"HostCommandExited\")]\n   60 |     pub async fn receive_spawn_exited(&self) -> Result<impl Stream<Item = (u32, u32)>, Error> {\n   61 |         self.0.signal(\"HostCommandExited\").await\n   62 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/development.rs#L59-L62"},{"ref":"client/src/flatpak/development.rs:83-84","code":"   83 |     /// See also [`HostCommand`](https://docs.flatpak.org/en/latest/libflatpak-api-reference.html#gdbus-method-org-freedesktop-Flatpak-Development.HostCommand).\n   84 |     pub async fn host_command(","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/development.rs#L83-L84"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The public constant for the `accent-color` key is named `ACCENT_COLOR_SCHEME_KEY` - the `_SCHEME` part is\na copy-paste leftover from `COLOR_SCHEME_KEY` right above it. The key it holds is `accent-color`, which\nhas nothing to do with a color *scheme*, so the name is actively misleading in user code\n(`settings.read(APPEARANCE_NAMESPACE, ACCENT_COLOR_SCHEME_KEY)`).","fix":"Introduce `pub const ACCENT_COLOR_KEY: &str = \"accent-color\";` and turn `ACCENT_COLOR_SCHEME_KEY` into\n`#[deprecated(note = \"use ACCENT_COLOR_KEY\")] pub const ACCENT_COLOR_SCHEME_KEY: &str = ACCENT_COLOR_KEY;`\nso the rename is not a hard break.","locations":[{"ref":"client/src/desktop/settings.rs:201-204","code":"  201 | /// Color scheme key\n  202 | pub const COLOR_SCHEME_KEY: &str = \"color-scheme\";\n  203 | /// Accent color key\n  204 | pub const ACCENT_COLOR_SCHEME_KEY: &str = \"accent-color\";","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/settings.rs#L201-L204"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`read_all`'s doc comment is a copy of `read`'s: it claims \"Reads a single value. Returns an error on any\nunknown namespace or key.\", while the method actually reads *all* settings of the given namespaces and\nreturns a `HashMap<String, Namespace>`. The rest of the comment (`# Arguments`, `# Returns`) correctly\ndescribes `read_all`, which makes the first line clearly a copy-paste leftover.","fix":"Replace the first doc line of `read_all` with something like\n`/// Reads all the settings of the given namespaces.` and keep `read`'s wording only on `read`.","locations":[{"ref":"client/src/desktop/settings.rs:239-241","code":"  239 |     /// Reads a single value. Returns an error on any unknown namespace or key.\n  240 |     ///\n  241 |     /// # Arguments","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/settings.rs#L239-L241"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`UsbDevice::vendor()` and `UsbDevice::model()` were written from the same template but only `model()`\nun-escapes the udev encoding. `ID_VENDOR_ENC` and `ID_MODEL_ENC` are both udev *escaped* properties\n(spaces appear as the literal `\\x20`), so `vendor()` returns strings such as `SanDisk\\x20Corp.` while\n`model()` returns `SanDisk Corp.`. Both getters are documented as being \"for display\".","fix":"Factor the un-escaping into a helper and use it in both getters:\n```rust\nfn display_property(&self, from_db: &str, enc: &str) -> Option<String> {\n    let value = self.properties.get(from_db).or_else(|| self.properties.get(enc))?;\n    let value = value.downcast_ref::<&str>().ok()?;\n    Some(value.replace(\"\\\\x20\", \" \").split_whitespace().collect::<Vec<_>>().join(\" \"))\n}\n```\nthen `vendor()` = `self.display_property(\"ID_VENDOR_FROM_DATABASE\", \"ID_VENDOR_ENC\")` and `model()` =\n`self.display_property(\"ID_MODEL_FROM_DATABASE\", \"ID_MODEL_ENC\")`.","locations":[{"ref":"client/src/desktop/usb.rs:145-166","code":"  145 |     /// Return the vendor string property for display.\n  146 |     pub fn vendor(&self) -> Option<String> {\n  147 |         self.properties\n  148 |             .get(\"ID_VENDOR_FROM_DATABASE\")\n  149 |             .or_else(|| self.properties.get(\"ID_VENDOR_ENC\"))\n  150 |             .and_then(|v| v.downcast_ref::<String>().ok())\n  151 |     }\n  152 | \n  153 |     /// Return the model string property for display.\n  154 |     pub fn model(&self) -> Option<String> {\n  155 |         self.properties\n  156 |             .get(\"ID_MODEL_FROM_DATABASE\")\n  157 |             .or_else(|| self.properties.get(\"ID_MODEL_ENC\"))\n  158 |             .and_then(|v| v.downcast_ref::<String>().ok())\n  159 |             .map(|model| {\n  160 |                 model\n  161 |                     .replace(\"\\\\x20\", \" \") // Unescape the literal \\x20 to space\n  162 |                     .split_whitespace()\n  163 |                     .collect::<Vec<_>>()\n  164 |                     .join(\" \")\n  165 |             })\n  166 |     }","lines":22,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/usb.rs#L145-L166"}]},
{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"`UsbProxy::create_session` reuses the shared `CreateSessionOptions`, which always serializes a\n`handle_token` key. `org.freedesktop.portal.Usb.CreateSession` is a plain method (it returns the session\nhandle directly, not a `Request` object path), so `handle_token` is meaningless there and is never used by\n`UsbProxy`. Compare `location.rs`, which defines its own `CreateSessionOptions` containing only\n`session_handle_token` for exactly the same reason. Sending unknown/unused option keys relies on the\nportal silently filtering them.","fix":"Either give the `usb` module its own options struct holding only `session_handle_token`, or split the\nshared type into `CreateSessionOptions` (session token only) plus a request-flavoured variant used by\n`screencast`/`remote_desktop`/`global_shortcuts`.","locations":[{"ref":"client/src/desktop/usb.rs:334-340","code":"  334 |     pub async fn create_session(\n  335 |         &self,\n  336 |         options: CreateSessionOptions,\n  337 |     ) -> Result<Session<Self>, Error> {\n  338 |         let session: OwnedObjectPath = self.0.call(\"CreateSession\", &(&options)).await?;\n  339 |         Session::with_connection(self.0.connection().clone(), session).await\n  340 |     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/usb.rs#L334-L340"},{"ref":"client/src/desktop/session.rs:163-171","code":"  163 | #[derive(Serialize, Deserialize, Type, Debug, Default)]\n  164 | #[zvariant(signature = \"dict\")]\n  165 | /// Specified options for creating a session.\n  166 | pub struct CreateSessionOptions {\n  167 |     #[serde(default, with = \"as_value\", skip_deserializing)]\n  168 |     pub(crate) handle_token: HandleToken,\n  169 |     #[serde(default, with = \"as_value\", skip_deserializing)]\n  170 |     pub(crate) session_handle_token: HandleToken,\n  171 | }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/session.rs#L163-L171"}]},
{"id":"CPY_12","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The parse error produced by `Permission::from_str` says `Failed to parse priority, invalid\nvalue`. `priority` is a leftover from the notification portal's `Priority` enum; this function\nparses a document `Permission`. Users see a misleading message when an invalid permission string\nis parsed.","fix":"Change\n```rust\n_ => Err(Error::ParseError(\"Failed to parse priority, invalid value\")),\n```\nto\n```rust\n_ => Err(Error::ParseError(\"Failed to parse permission, invalid value\")),\n```","locations":[{"ref":"client/src/documents/mod.rs:119-127","code":"  119 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  120 |         match s {\n  121 |             \"Read\" | \"read\" => Ok(Permission::Read),\n  122 |             \"Write\" | \"write\" => Ok(Permission::Write),\n  123 |             \"GrantPermissions\" | \"grant-permissions\" => Ok(Permission::GrantPermissions),\n  124 |             \"Delete\" | \"delete\" => Ok(Permission::Delete),\n  125 |             _ => Err(Error::ParseError(\"Failed to parse priority, invalid value\")),\n  126 |         }\n  127 |     }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/mod.rs#L119-L127"}]},
{"id":"CPY_13","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`PortalError::Exist` is derived with `#[zbus(prefix = \"org.freedesktop.portal.Error\")]`, so it\nmaps to the D-Bus error name `org.freedesktop.portal.Error.Exist`. The upstream\n`xdg-desktop-portal` error domain referenced right above the enum registers the entry for\n`XDG_DESKTOP_PORTAL_ERROR_EXISTS` under the name `org.freedesktop.portal.Error.Exists` (plural),\nwhich is also what the doc comment (`Exists already.`) implies. With the singular name the\nmapping never matches and a real `Exists` failure falls through to the catch-all\n`PortalError::ZBus(zbus::Error::MethodError(..))`, so callers cannot match on it. Note this is\nalso the variant the crate's own backend builds when it wants to report the condition\n(`client/src/backend/screencast.rs:125`), which would then be sent out under a name the client\nside is unable to recognise.","fix":"Rename the variant so the generated name matches upstream, keeping the enum in sync with\n`xdp-utils.h`:\n```rust\n/// Exists already.\nExists(String),\n```\n(verify the exact registered name in the pinned `xdg-desktop-portal` release before applying).","locations":[{"ref":"client/src/error.rs:23-24","code":"   23 |     /// Exists already.\n   24 |     Exist(String),","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/error.rs#L23-L24"}]},
{"id":"CPY_14","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The in-argument names exported in introspection do not match the reference XML: the parent-window\nargument is called `window_identifier` in `access.rs`, `email.rs` and `file_chooser.rs` where\n`interfaces/backend/*.xml` says `parent_window`, and `window` for\n`org.freedesktop.impl.portal.Account.GetUserInformation`. `app_chooser.rs` gets it right\n(`parent_window`), which shows the inconsistency is accidental. Only introspection/documentation is\naffected, not the wire format.","fix":"Rename the parameters to `parent_window` in `access.rs`, `email.rs`, `file_chooser.rs` (three\nmethods) and to `window` in `account.rs`, matching `interfaces/backend/*.xml`.","locations":[{"ref":"client/src/backend/access.rs:141-149","code":"  141 |     async fn access_dialog(\n  142 |         &self,\n  143 |         handle: OwnedObjectPath,\n  144 |         app_id: Optional<MaybeAppID>,\n  145 |         window_identifier: Optional<WindowIdentifierType>,\n  146 |         title: String,\n  147 |         subtitle: String,\n  148 |         body: String,\n  149 |         options: AccessOptions,","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/access.rs#L141-L149"},{"ref":"client/src/backend/email.rs:51-56","code":"   51 |     async fn compose_email(\n   52 |         &self,\n   53 |         handle: OwnedObjectPath,\n   54 |         app_id: Optional<MaybeAppID>,\n   55 |         window_identifier: Optional<WindowIdentifierType>,\n   56 |         options: EmailOptions,","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/email.rs#L51-L56"},{"ref":"client/src/backend/file_chooser.rs:76-82","code":"   76 |     async fn open_file(\n   77 |         &self,\n   78 |         handle: OwnedObjectPath,\n   79 |         app_id: Optional<MaybeAppID>,\n   80 |         window_identifier: Optional<WindowIdentifierType>,\n   81 |         title: String,\n   82 |         options: OpenFileOptions,","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/file_chooser.rs#L76-L82"},{"ref":"client/src/backend/account.rs:56-61","code":"   56 |     async fn get_user_information(\n   57 |         &self,\n   58 |         handle: OwnedObjectPath,\n   59 |         app_id: Optional<MaybeAppID>,\n   60 |         window_identifier: Optional<WindowIdentifierType>,\n   61 |         options: UserInformationOptions,","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/account.rs#L56-L61"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`secret::retrieve()` (and the module-level doc example) drop the `Request<()>` returned by\n`Secret::retrieve` without ever calling `Request::response()`. `Proxy::request` only awaits the\n`Response` signal and *stores* the result; the `?` on `retrieve(...)` therefore only catches D-Bus\ntransport errors. If the portal answers with `ResponseType::Cancelled`/`Other` (no secret written, write\nend closed), `read_to_end` immediately hits EOF and the function returns `Ok(vec![])`. Callers get an\nempty \"secret\" and no error, and are very likely to use it as a key.","fix":"Check the portal response before reading:\n```rust\nlet request = proxy.retrieve(&x2, Default::default()).await?;\nrequest.response()?;\ndrop(x2);\n```\nAlso fix the doc example the same way, and consider returning an error when the read yields 0 bytes.","locations":[{"ref":"client/src/desktop/secret.rs:112-117","code":"  112 | pub async fn retrieve() -> Result<Vec<u8>, Error> {\n  113 |     let proxy = Secret::new().await?;\n  114 | \n  115 |     let (mut x1, x2) = UnixStream::pair()?;\n  116 |     proxy.retrieve(&x2, Default::default()).await?;\n  117 |     drop(x2);","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/secret.rs#L112-L117"},{"ref":"client/src/desktop/secret.rs:10-15","code":"   10 | //!\n   11 | //!     let (mut x1, x2) = std::os::unix::net::UnixStream::pair()?;\n   12 | //!     secret.retrieve(&x2, Default::default()).await?;\n   13 | //!     drop(x2);\n   14 | //!     let mut buf = Vec::new();\n   15 | //!     x1.read_to_end(&mut buf)?;","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/secret.rs#L10-L15"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`UsbProxy::acquire_devices` throws away the portal's `Response` error: `if request.response().is_ok()`\nconsumes the `Result<(), Error>` and only uses it as a boolean. When the user denies/cancels the\npermission dialog (`ResponseError::Cancelled`) or the portal replies with `ResponseType::Other`, the\nfunction returns `Ok(vec![])` - an empty success - instead of propagating the error, so callers cannot\ndistinguish \"user said no\" from \"no devices were acquired\". Additionally `Request::response()` is\nimplemented as `self.2.lock().unwrap().take().unwrap()`, i.e. it *consumes* the stored response, so any\nfuture refactor that calls `request.response()` a second time panics.","fix":"Propagate the response error instead of testing it:\n```rust\nlet mut devices: Vec<(DeviceID, Result<OwnedFd, UsbError>)> = vec![];\nrequest.response()?;\nlet path = request.path();\nloop {\n    let (mut new_devices, finished) = self.finish_acquire_devices(path, Default::default()).await?;\n    devices.append(&mut new_devices);\n    if finished {\n        break;\n    }\n}\nOk(devices)\n```","locations":[{"ref":"client/src/desktop/usb.rs:390-403","code":"  390 |         let mut devices: Vec<(DeviceID, Result<OwnedFd, UsbError>)> = vec![];\n  391 |         if request.response().is_ok() {\n  392 |             let path = request.path();\n  393 |             loop {\n  394 |                 let (mut new_devices, finished) = self\n  395 |                     .finish_acquire_devices(path, Default::default())\n  396 |                     .await?;\n  397 |                 devices.append(&mut new_devices);\n  398 |                 if finished {\n  399 |                     break;\n  400 |                 }\n  401 |             }\n  402 |         }\n  403 |         Ok(devices)","lines":14,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/usb.rs#L390-L403"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`SessionInterface::close` discards both fallible operations with `let _ = ...`:\n`manager.remove(&token)` (which reports an untracked session) and, more importantly,\n`monitor.session_closed(token).await`, which is the backend's own teardown hook. If the backend\nfails to release resources the error is silently dropped and `Close()` still replies success, so\nneither the caller nor the log ever learns about it.","fix":"Propagate or at least log the failures, e.g.\n\n```rust\nif let Err(err) = manager.remove(&token) {\n    #[cfg(feature = \"tracing\")]\n    tracing::warn!(\"Closing an untracked session: {err}\");\n}\n...\nif let Some(monitor) = &self.monitor {\n    monitor.session_closed(token).await.map_err(|e| zbus::fdo::Error::Failed(e.to_string()))?;\n}\n```","locations":[{"ref":"client/src/backend/session.rs:95-105","code":"   95 |         {\n   96 |             // Let the session manager know so it can update\n   97 |             // its internal map of tracked sessions.\n   98 |             let mut manager = self.manager.lock().unwrap();\n   99 |             let _ = manager.remove(&token);\n  100 |         }\n  101 |         if let Some(monitor) = &self.monitor {\n  102 |             // The backend implements the `SessionImpl` trait,\n  103 |             // it wants to be notified that the session was closed.\n  104 |             let _ = monitor.session_closed(token).await;\n  105 |         }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/session.rs#L95-L105"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`Request<T>` is not `#[must_use]`, and for `T = ()` (`Proxy::empty_request`) the returned `Request` is\nalmost always dropped without calling `response()`. Because `Proxy::request` only propagates *D-Bus\ntransport* errors and stores the portal's `Response` signal payload inside the `Request`, dropping it\nsilently discards `ResponseError::Cancelled` / `ResponseError::Other`. The crate's own doc examples do\nexactly this: `proxy.print(..).await?;` and `remote_desktop.select_devices(..).await?;` both look like they\nsucceeded even when the user cancelled the dialog or the portal refused, which is then copied verbatim\ninto user code.","fix":"Add `#[must_use = \"the portal response (including cancellation) is only observable via `Request::response()`\"]`\nto `pub struct Request<T>`, and change the doc examples to `.await?.response()?;` so the cancelled case\nis propagated.","locations":[{"ref":"client/src/desktop/request.rs:200-208","code":"  200 | #[doc(alias = \"org.freedesktop.portal.Request\")]\n  201 | pub struct Request<T>(\n  202 |     Proxy<'static>,\n  203 |     SignalStream<'static>,\n  204 |     Mutex<Option<Result<T, Error>>>,\n  205 |     PhantomData<T>,\n  206 | )\n  207 | where\n  208 |     T: for<'de> Deserialize<'de> + Type + Debug;","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/request.rs#L200-L208"},{"ref":"client/src/desktop/print.rs:25-34","code":"   25 | //!     proxy\n   26 | //!         .print(\n   27 | //!             None,\n   28 | //!             \"test\",\n   29 | //!             &file.as_fd(),\n   30 | //!             PrintOptions::default()\n   31 | //!                 .set_token(pre_print.token)\n   32 | //!                 .set_modal(true),\n   33 | //!         )\n   34 | //!         .await?;","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/print.rs#L25-L34"},{"ref":"client/src/desktop/remote_desktop.rs:12-18","code":"   12 | //!     proxy\n   13 | //!         .select_devices(\n   14 | //!             &session,\n   15 | //!             SelectDevicesOptions::default()\n   16 | //!                 .set_devices(DeviceType::Keyboard | DeviceType::Pointer),\n   17 | //!         )\n   18 | //!         .await?;","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/remote_desktop.rs#L12-L18"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`From<AcquiredDevice> for Result<OwnedFd, UsbError>` inverts the checks: it looks at `v.fd` first, so when\nthe portal reports a failure *without* an fd (the normal failure shape: `success = false`, `error = \"...\"`,\nno fd) the branch `Err(UsbError(None))` is taken and the portal's error message in `v.error` is silently\ndiscarded. `UsbError`'s `Display` then prints an empty string, so the user gets a completely\ninformation-free error.","fix":"Test `success` first and only then the fd:\n```rust\nimpl From<AcquiredDevice> for Result<OwnedFd, UsbError> {\n    fn from(v: AcquiredDevice) -> Result<OwnedFd, UsbError> {\n        if !v.success {\n            return Err(UsbError(v.error));\n        }\n        v.fd.ok_or_else(|| UsbError(Some(\"no file descriptor returned\".to_owned())))\n    }\n}\n```","locations":[{"ref":"client/src/desktop/usb.rs:186-198","code":"  186 | impl From<AcquiredDevice> for Result<OwnedFd, UsbError> {\n  187 |     fn from(v: AcquiredDevice) -> Result<OwnedFd, UsbError> {\n  188 |         if let Some(fd) = v.fd {\n  189 |             if v.success {\n  190 |                 Ok(fd)\n  191 |             } else {\n  192 |                 Err(UsbError(v.error))\n  193 |             }\n  194 |         } else {\n  195 |             Err(UsbError(None))\n  196 |         }\n  197 |     }\n  198 | }","lines":13,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/usb.rs#L186-L198"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Documents::info()` and `Documents::list()` deserialize the portal reply into `Permissions`\n(`HashMap<AppID, Vec<Permission>>`). `AppID` has a hand-written `Deserialize` impl\n(`client/src/app_id.rs:78-88`) that runs `is_valid_app_id()` and turns any non-conforming string\ninto a hard `serde` error. The document portal is free to return application identifiers that do\nnot satisfy the strict GNOME app-id grammar (the empty string is used for the host/unsandboxed\napp, and legacy entries may contain other shapes). A single such key makes the whole\n`info()` call fail with `Error::Zbus(zbus::Error::Variant(..))` instead of returning the other,\nperfectly valid entries. The crate already has `MaybeAppID` for exactly this situation\n(`client/src/app_id.rs:90-97` documents it as the lenient variant for this case).","fix":"Change the alias to a lenient key type, e.g.\n```rust\npub type Permissions = HashMap<MaybeAppID, Vec<Permission>>;\n```\n(or `HashMap<String, Vec<Permission>>`) so a single malformed app id cannot make `info()` fail.\n`MaybeAppID` already implements `Type`/`Eq`/`Hash`/`Deserialize` and exposes `inner()` returning\n`&Result<AppID, String>`.","locations":[{"ref":"client/src/documents/mod.rs:61-63","code":"   61 | /// A [`HashMap`] mapping application IDs to the permissions for that\n   62 | /// application\n   63 | pub type Permissions = HashMap<AppID, Vec<Permission>>;","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/mod.rs#L61-L63"},{"ref":"client/src/documents/mod.rs:400-405","code":"  400 |     pub async fn info(\n  401 |         &self,\n  402 |         doc_id: impl Into<DocumentID>,\n  403 |     ) -> Result<(FilePath, Permissions), Error> {\n  404 |         self.0.call(\"Info\", &(doc_id.into())).await\n  405 |     }","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/mod.rs#L400-L405"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The version-negotiation `match` in `Proxy::with_connection` maps *every* failure other than a specific `InvalidArgs`\nto `Ok(1)`. This swallows real, actionable errors: `org.freedesktop.DBus.Error.ServiceUnknown` /\n`NameHasNoOwner` (xdg-desktop-portal not installed or not running), `Disconnected`, timeouts, and deserialization\nfailures all silently yield `version == 1`. Proxy construction then succeeds and the user only sees a confusing failure\non the first method call; worse, `request_versioned`/`call_versioned`/`property_versioned` will report\n`Error::RequiresVersion(n, 1)` (\"requires version n, current 1\") for a portal that is simply absent.","fix":"Distinguish \"interface has no `version` property\" (map to `Ok(1)`) from transport/service errors (propagate). E.g.\nmatch on `zbus::fdo::Error::InvalidArgs` / `UnknownProperty` / `UnknownInterface` for the `Ok(1)` fallback and return\n`Err(e.into())` for every other variant instead of the blanket `_ => Ok(1)`.","locations":[{"ref":"client/src/proxy.rs:87-105","code":"   87 |         let version = match inner\n   88 |             .get_property::<u32>(\"version\")\n   89 |             .await\n   90 |             .map_err(zbus::fdo::Error::from)\n   91 |         {\n   92 |             Ok(v) => Ok(v),\n   93 |             Err(zbus::fdo::Error::InvalidArgs(details)) => {\n   94 |                 if details.contains(interface) {\n   95 |                     Err(crate::Error::PortalNotFound(\n   96 |                         // We are sure it is a valid interface name, should fix the type system\n   97 |                         // here\n   98 |                         zbus::names::OwnedInterfaceName::try_from(interface).unwrap(),\n   99 |                     ))\n  100 |                 } else {\n  101 |                     Ok(1)\n  102 |                 }\n  103 |             }\n  104 |             _ => Ok(1),\n  105 |         }?;","lines":19,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L87-L105"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Request::spawn` ignores the `bool` returned by `server.at(&path, request)`. `ObjectServer::at`\nreturns `Ok(false)` when an interface of that type is already registered at the path: the new\n`Request` is then *not* served (so `Close()` will abort the wrong request), and the unconditional\n`server.remove::<Self, _>(&path)` at the end of `spawn` unregisters the *other*, still running\nrequest's interface, making it impossible to cancel.","fix":"Treat a duplicate handle as an error:\n\n```rust\nif !server.at(&path, request).await? {\n    return Err(PortalError::Exist(format!(\"A request for `{}` already exists\", path.as_str())));\n}\n```\n\nand only call `server.remove` when the interface was actually registered by this call.","locations":[{"ref":"client/src/backend/request.rs:60-75","code":"   60 |         let request = Request::new(close_cb, path.clone(), abort_handle, cnx.clone());\n   61 |         let server = cnx.object_server();\n   62 |         #[cfg(feature = \"tracing\")]\n   63 |         tracing::debug!(\n   64 |             \"Serving `org.freedesktop.impl.portal.Request` at {:?}\",\n   65 |             path.as_str()\n   66 |         );\n   67 |         server.at(&path, request).await?;\n   68 | \n   69 |         let result = fut.await;\n   70 | \n   71 |         #[cfg(feature = \"tracing\")]\n   72 |         tracing::debug!(\"{_method} returned {:#?}\", result);\n   73 |         #[cfg(feature = \"tracing\")]\n   74 |         tracing::debug!(\"Releasing request {:?}\", path.as_str());\n   75 |         server.remove::<Self, _>(&path).await?;","lines":16,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/request.rs#L60-L75"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`Clipboard::request` calls `self.0.call_method(...)` (the raw `zbus::Proxy` method reached through\n`Deref`) instead of `Proxy::call`, which is what every other method in the file uses. `Proxy::call`\nmaps the reply error through `PortalError`, so D-Bus errors become\n`Error::Portal(PortalError::NotAllowed(..))` etc.; `call_method` returns a raw `zbus::Error`, which\n`?` converts into `Error::Zbus(zbus::Error::MethodError(..))`. A caller matching on\n`Error::Portal(..)` (the documented portal error) will therefore never match for\n`RequestClipboard`, unlike for `SetSelection` two functions below. The returned `Message` is also\ndiscarded.","fix":"Use the crate's wrapper like the neighbouring methods do:\n```rust\nself.0\n    .call::<()>(\"RequestClipboard\", &(session, options))\n    .await\n```\ninstead of `self.0.call_method(\"RequestClipboard\", &(session, options)).await?; Ok(())`.","locations":[{"ref":"client/src/desktop/clipboard.rs:95-99","code":"   95 |         self.0\n   96 |             .call_method(\"RequestClipboard\", &(session, options))\n   97 |             .await?;\n   98 |         Ok(())\n   99 |     }","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/clipboard.rs#L95-L99"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In both clipboard signal streams the per-signal `Session::with_connection(...)` result is discarded\nwith `.ok()` inside `filter_map`, so a failure (e.g. the `version` property round trip failing\nbecause the session was just closed) makes the whole signal disappear silently. For\n`SelectionTransfer` that means the application never learns it must call `selection_write`, and the\nrequesting peer waits forever with no error surfaced anywhere.","fix":"Do not make delivery of the signal depend on a fallible D-Bus call: yield the session path (see the\nrelated performance finding), or yield `Result<(Session<T>, String, u32), Error>` so the consumer\ncan observe and log the failure instead of `.map(|session| (session, mime_type, serial)).ok()`.","locations":[{"ref":"client/src/desktop/clipboard.rs:200-208","code":"  200 |             .filter_map(move |(p, mime_type, serial)| {\n  201 |                 let connection = connection.clone();\n  202 |                 async move {\n  203 |                     Session::with_connection(connection, p)\n  204 |                         .await\n  205 |                         .map(|session| (session, mime_type, serial))\n  206 |                         .ok()\n  207 |                 }\n  208 |             }))","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/clipboard.rs#L200-L208"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`LocationInner` requires every one of its eight keys to be present: none of the fields is\n`Option<_>` and none carries `#[serde(default)]`. If a portal backend omits any key (e.g. no\n`Heading`/`Speed` from a backend that cannot provide them), deserialization of the whole\n`LocationUpdated` signal fails - and because `Proxy::signal` drops decode failures with\n`filter_map(|msg| ready(msg.body().deserialize().ok()))` (`client/src/proxy.rs:339-349`), the\nupdate is discarded *silently*, with no error and no log line (outside the `tracing` feature).\nThe application just sees a stream that stops producing locations, which is essentially\nundebuggable.\n\nNote the accessors already encode \"absent\" as sentinel values (`-f64::MAX` altitude, `-1.0`\nspeed/heading, empty description), so making the fields defaultable is a natural, non-breaking\nextension of the existing design.","fix":"Make the optional-in-practice keys tolerant, e.g.\n\n```rust\n#[serde(default = \"unknown_altitude\", with = \"as_value\")]\naltitude: f64,\n#[serde(default = \"minus_one\", with = \"as_value\")]\nspeed: f64,\n#[serde(default = \"minus_one\", with = \"as_value\")]\nheading: f64,\n#[serde(default, with = \"as_value\")]\ndescription: String,\n```\n\nwith `fn unknown_altitude() -> f64 { -f64::MAX }` and `fn minus_one() -> f64 { -1.0 }`, so the\nexisting `Option`-returning accessors keep working. Keep `latitude`/`longitude`/`accuracy`/\n`timestamp` mandatory.","locations":[{"ref":"client/src/desktop/location.rs:200-220","code":"  200 | #[derive(Debug, Serialize, Deserialize, Type)]\n  201 | #[zvariant(signature = \"dict\")]\n  202 | #[serde(rename_all = \"PascalCase\")]\n  203 | struct LocationInner {\n  204 |     #[serde(with = \"as_value\")]\n  205 |     accuracy: f64,\n  206 |     #[serde(with = \"as_value\")]\n  207 |     altitude: f64,\n  208 |     #[serde(with = \"as_value\")]\n  209 |     speed: f64,\n  210 |     #[serde(with = \"as_value\")]\n  211 |     heading: f64,\n  212 |     #[serde(with = \"as_value\")]\n  213 |     description: String,\n  214 |     #[serde(with = \"as_value\")]\n  215 |     latitude: f64,\n  216 |     #[serde(with = \"as_value\")]\n  217 |     longitude: f64,\n  218 |     #[serde(with = \"as_value\")]\n  219 |     timestamp: (u64, u64),\n  220 | }","lines":21,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/location.rs#L200-L220"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Both `wallpaper` module examples end with `.build_file(..).await?` / `.build_uri(..).await?` and\ndrop the returned `Request<()>`. `Proxy::request` already awaits the `Response` signal and stores\nthe outcome inside the `Request` (`client/src/proxy.rs:206-224`), so the value that is thrown\naway here is precisely the user-cancelled / failed status: `build_file(..).await?` returns `Ok`\neven when the user dismissed the wallpaper dialog. Every other portal example in the crate that\nexposes a response ends with `.response()?` (`account.rs:16`, `background.rs:21`,\n`screenshot.rs:18`, `file_chooser.rs:30`, ...).","fix":"Terminate both examples with the response check so cancellation surfaces:\n```rust\nWallpaperRequest::default()\n    .set_on(SetOn::Both)\n    .show_preview(true)\n    .build_file(&file.as_fd())\n    .await?\n    .response()?;\n```","locations":[{"ref":"client/src/desktop/wallpaper.rs:14-21","code":"   14 | //! async fn run() -> ashpd::Result<()> {\n   15 | //!     let file = File::open(\"/home/bilelmoussaoui/adwaita-day.jpg\").unwrap();\n   16 | //!     WallpaperRequest::default()\n   17 | //!         .set_on(SetOn::Both)\n   18 | //!         .show_preview(true)\n   19 | //!         .build_file(&file.as_fd())\n   20 | //!         .await?;\n   21 | //!     Ok(())","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/wallpaper.rs#L14-L21"},{"ref":"client/src/desktop/wallpaper.rs:30-38","code":"   30 | //! async fn run() -> ashpd::Result<()> {\n   31 | //!     let uri =\n   32 | //!         ashpd::Uri::parse(\"file:///home/bilelmoussaoui/Downloads/adwaita-night.jpg\").unwrap();\n   33 | //!     WallpaperRequest::default()\n   34 | //!         .set_on(SetOn::Both)\n   35 | //!         .show_preview(true)\n   36 | //!         .build_uri(&uri)\n   37 | //!         .await?;\n   38 | //!     Ok(())","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/wallpaper.rs#L30-L38"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Error` implements `std::error::Error` with an empty body, so `source()` returns `None` for every\nvariant even though `Zbus`, `IO`, `Portal`, `Pipewire` and `Uri` all wrap a real inner error.\nAnything that walks the error chain (`anyhow`'s `{:#}` / `Report`, `eyre`, `tracing`'s\n`error.cause_chain`, `std::error::Error::sources`) loses the root cause and shows only the\ntop-level text.","fix":"Implement `source()`:\n```rust\nimpl std::error::Error for Error {\n    fn source(&self) -> Option<&(dyn std::error::Error + 'static)> {\n        match self {\n            Self::Zbus(e) => Some(e),\n            Self::Portal(e) => Some(e),\n            Self::IO(e) => Some(e),\n            #[cfg(feature = \"pipewire\")]\n            Self::Pipewire(e) => Some(e),\n            _ => None,\n        }\n    }\n}\n```","locations":[{"ref":"client/src/error.rs:73","code":"   73 | impl std::error::Error for Error {}","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/error.rs#L73"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Proxy::signal` and `Proxy::signal_with_args` use `filter_map(|msg| ready(msg.body().deserialize().ok()))` when the\n`tracing` feature is off. A signal whose body does not match the expected type is silently dropped, so a signature\nmismatch between the crate's types and the running portal manifests as \"the stream never yields\", i.e. an\nindistinguishable hang, with no diagnostics at all. With `tracing` on, the message is at least logged as a warning,\nwhich means the failure mode differs by feature flag.","fix":"Either yield `Result<I, Error>` from these streams so callers can observe deserialization failures, or log\nunconditionally (e.g. via a `#[cfg(not(feature = \"tracing\"))]` `debug_assert!`/`eprintln!`-free hook) instead of\ndropping messages silently. At minimum, extract the shared closure into one helper so both methods behave identically.","locations":[{"ref":"client/src/proxy.rs:315-329","code":"  315 |         Ok(self\n  316 |             .inner\n  317 |             .receive_signal_with_args(name, args)\n  318 |             .await?\n  319 |             .filter_map({\n  320 |                 #[cfg(not(feature = \"tracing\"))]\n  321 |                 {\n  322 |                     move |msg| ready(msg.body().deserialize().ok())\n  323 |                 }\n  324 |                 #[cfg(feature = \"tracing\")]\n  325 |                 {\n  326 |                     let ifc = self.interface().to_owned();\n  327 |                     move |msg| ready(trace_body(name, &ifc, msg))\n  328 |                 }\n  329 |             }))","lines":15,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L315-L329"},{"ref":"client/src/proxy.rs:339-349","code":"  339 |         Ok(self.inner.receive_signal(name).await?.filter_map({\n  340 |             #[cfg(not(feature = \"tracing\"))]\n  341 |             {\n  342 |                 move |msg| ready(msg.body().deserialize().ok())\n  343 |             }\n  344 |             #[cfg(feature = \"tracing\")]\n  345 |             {\n  346 |                 let ifc = self.interface().to_owned();\n  347 |                 move |msg| ready(trace_body(name, &ifc, msg))\n  348 |             }\n  349 |         }))","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L339-L349"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`RegistryProxy::register` calls `self.0.call_method(\"Register\", ...)` - the raw `zbus::Proxy` method reached through\n`Deref` - instead of the crate's own `Proxy::call` helper. Consequences: the D-Bus error is converted straight into\n`Error::Zbus`/`Error::Portal` via the generic `From` chain instead of being mapped through\n`PortalError` like every other portal call in the crate (so e.g. `NotAllowed`/`Failed` from the Registry portal are not\nsurfaced as `PortalError` variants), and the `tracing` instrumentation in `Proxy::call` (\"Calling method ...\") is\nskipped, making `register_host_app` invisible in logs. The returned `Message` is also discarded.","fix":"Use the crate helper so the error mapping and tracing match the rest of the codebase:\n\n```rust\nself.0.call::<()>(\"Register\", &(&app_id, &options)).await\n```","locations":[{"ref":"client/src/registry.rs:25-28","code":"   25 |     pub async fn register(&self, app_id: AppID, options: RegisterOptions) -> Result<(), Error> {\n   26 |         self.0.call_method(\"Register\", &(&app_id, &options)).await?;\n   27 |         Ok(())\n   28 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/registry.rs#L25-L28"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"When no `zxdg_exporter` global is available, `wayland_export_handle` returns\n`Err(Box::new(crate::Error::NoResponse))`. `Error::NoResponse` displays as \"Portal request didn't receive a response\",\nwhich is unrelated to \"the compositor does not implement xdg-foreign\" and is actively misleading in the\n`tracing::info!(\"Could not get wayland window identifier: {_err}\")` message printed by the caller. The boxed error is\nalso allocated only to be discarded (`Err(_err) => ... send(None)`), and `wayland_export_handle` returns\n`Box<dyn Error>` even though `crate::Error` would do.","fix":"Change the return type to `Result<WaylandWindowIdentifier, crate::Error>` and return a variant that says what actually\nhappened (e.g. a new `Error::Unsupported(\"xdg-foreign not supported by the compositor\")` or reuse\n`PortalError::NotFound`). That also removes the `Box` allocation.","locations":[{"ref":"client/src/window_identifier/wayland.rs:254-270","code":"  254 |         None => {\n  255 |             #[cfg(feature = \"tracing\")]\n  256 |             tracing::error!(\n  257 |                 \"The compositor does not support the zxdg_exporter_v1 nor zxdg_exporter_v2 protocols\"\n  258 |             );\n  259 |             None\n  260 |         }\n  261 |     };\n  262 | \n  263 |     if let Some(exported) = exported {\n  264 |         Ok(WaylandWindowIdentifier {\n  265 |             exported,\n  266 |             type_: WindowIdentifierType::Wayland(state.handle),\n  267 |         })\n  268 |     } else {\n  269 |         Err(Box::new(crate::Error::NoResponse))\n  270 |     }","lines":17,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L254-L270"},{"ref":"client/src/window_identifier/wayland.rs:228-231","code":"  228 | fn wayland_export_handle(\n  229 |     conn: wayland_client::Connection,\n  230 |     surface: &WlSurface,\n  231 | ) -> Result<WaylandWindowIdentifier, Box<dyn std::error::Error>> {","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L228-L231"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`format_xml_content` catches `FileNotFoundError` and `subprocess.CalledProcessError`, prints a line and returns the\n*unformatted* XML. The consequences are invisible in the exit status: the script exits 0 while producing\nsingle-line, unreviewable XML files that differ structurally from the committed ones (a huge, meaningless diff), and\n`xmllint`'s stderr - the only clue about *why* it failed - is captured by `capture_output=True` and thrown away.\nBecause the failure mode is per-file, a partial failure yields a mix of formatted and unformatted files.","fix":"Print `e.stderr.decode()` in the handler, and fail loudly: either `raise SystemExit(1)` (the generated files are\ncommitted, so silently producing differently-formatted output is worse than stopping), or check for `xmllint` once with\n`shutil.which(\"xmllint\")` at the start of `main()` and abort with a clear message if it is missing.","locations":[{"ref":"update-interfaces.py:26-36","code":"   26 |     try:\n   27 |         result = subprocess.run(\n   28 |             [\"xmllint\", \"--format\", \"-\"],\n   29 |             input=unformatted_xml.encode(\"utf-8\"),\n   30 |             capture_output=True,\n   31 |             check=True,\n   32 |         )\n   33 |         return result.stdout.decode(\"utf-8\")\n   34 |     except (FileNotFoundError, subprocess.CalledProcessError) as e:\n   35 |         print(f\"Error calling xmllint: {e}. Returning unformatted XML.\")\n   36 |         return unformatted_xml","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L26-L36"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"critical","difficulty":"easy","description":"`PrintInterface::print` returns `Result<Response<()>>`. `Response<T>` claims the signature\n`(ua{sv})` unconditionally, but for `T = ()` the success arm serializes `()`, which emits *nothing*\nfor the `a{sv}` out arg. Verified with `zvariant` 5.8: a `Response`-shaped value serializes to\n8 bytes when the second element is an empty `HashMap` and to only **4 bytes** when it is `()`.\nThe reply message therefore advertises the body signature `ua{sv}` while carrying only the 4-byte\nresponse code, so the peer (xdg-desktop-portal) rejects it as a truncated/invalid message. Every\nsuccessful `org.freedesktop.impl.portal.Print.Print` reply is malformed. (The same\n`Response<()>` pattern exists in `client/src/backend/email.rs:57`.)","fix":"Never instantiate `Response<()>`. Introduce an empty dict response type and use it for the results\nout arg:\n\n```rust\n#[derive(Serialize, Type, Debug, Default)]\n#[zvariant(signature = \"dict\")]\npub struct PrintResponse {}\n```\n\nthen make `PrintImpl::print` return `Result<PrintResponse>` and the interface method return\n`Result<Response<PrintResponse>>` (same shape as `SelectSourcesResponse`). Alternatively fix\n`Response<T>`'s `Serialize` impl to emit an empty `a{sv}` whenever `T`'s signature is not a dict.","locations":[{"ref":"client/src/backend/print.rs:105-115","code":"  105 |     #[allow(clippy::too_many_arguments)]\n  106 |     #[zbus(out_args(\"response\", \"results\"))]\n  107 |     async fn print(\n  108 |         &self,\n  109 |         handle: OwnedObjectPath,\n  110 |         app_id: Optional<MaybeAppID>,\n  111 |         window_identifier: Optional<WindowIdentifierType>,\n  112 |         title: String,\n  113 |         fd: zvariant::OwnedFd,\n  114 |         options: PrintOptions,\n  115 |     ) -> Result<Response<()>> {","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/print.rs#L105-L115"},{"ref":"client/src/backend/print.rs:34-43","code":"   34 |     #[doc(alias = \"Print\")]\n   35 |     async fn print(\n   36 |         &self,\n   37 |         token: HandleToken,\n   38 |         app_id: Option<MaybeAppID>,\n   39 |         parent_window: Option<WindowIdentifierType>,\n   40 |         title: String,\n   41 |         fd: zvariant::OwnedFd,\n   42 |         options: PrintOptions,\n   43 |     ) -> Result<()>;","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/print.rs#L34-L43"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"critical","difficulty":"easy","description":"`UsbInterface::acquire_devices` returns `Response<Vec<(String, AccessOptions)>>`. `Response<T>` declares a\n*fixed* zvariant signature of `(ua{sv})` (see `client/src/desktop/request.rs`, `#[zvariant(signature = \"(ua{sv})\")]`),\nbut its `Serialize` impl writes the inner `T` verbatim, i.e. an array of structs `a(sa{sv})`.\nThe declared signature and the serialized body therefore disagree, and zvariant's serializer is\nsignature-driven, so the reply cannot be marshalled at all. Reproduced with `zvariant` 5.8:\n\n```\nERR Signature mismatch: got `s`, expected a struct, array, u8 or variant\n```\n\n`interfaces/backend/org.freedesktop.impl.portal.Usb.xml` also states the second out arg is\n`a{sv} results`, and upstream `xdg-desktop-portal` looks the approved devices up under the\n`devices` key of that vardict. So `org.freedesktop.impl.portal.Usb.AcquireDevices` implemented via\nashpd can never return successfully - every call fails with a marshalling error.","fix":"Wrap the device list in a vardict-shaped response type instead of returning the bare `Vec`, e.g.\n\n```rust\n#[derive(Debug, Serialize, Type)]\n#[zvariant(signature = \"dict\")]\npub struct AcquireDevicesResponse {\n    #[serde(with = \"as_value\")]\n    devices: Vec<(String, AccessOptions)>,\n}\n```\n\nand change `UsbImpl::acquire_devices` plus the interface method to return\n`Result<Response<AcquireDevicesResponse>>`, mirroring `SelectSourcesResponse` in\n`client/src/backend/screencast.rs`.","locations":[{"ref":"client/src/backend/usb.rs:75-105","code":"   75 |     #[zbus(name = \"AcquireDevices\")]\n   76 |     #[zbus(out_args(\"response\", \"results\"))]\n   77 |     async fn acquire_devices(\n   78 |         &self,\n   79 |         handle: OwnedObjectPath,\n   80 |         window_identifier: Optional<WindowIdentifierType>,\n   81 |         app_id: Optional<MaybeAppID>,\n   82 |         devices: Vec<(String, UsbDevice, AccessOptions)>,\n   83 |         options: AcquireDevicesOptions,\n   84 |     ) -> Result<Response<Vec<(String, AccessOptions)>>> {\n   85 |         let imp = Arc::clone(&self.imp);\n   86 | \n   87 |         Request::spawn(\n   88 |             \"Usb::AcquireDevices\",\n   89 |             &self.cnx,\n   90 |             handle.clone(),\n   91 |             Arc::clone(&self.imp),\n   92 |             Arc::clone(&self.spawn),\n   93 |             async move {\n   94 |                 imp.acquire_devices(\n   95 |                     HandleToken::try_from(&handle).unwrap(),\n   96 |                     window_identifier.into(),\n   97 |                     app_id.into(),\n   98 |                     devices,\n   99 |                     options,\n  100 |                 )\n  101 |                 .await\n  102 |             },\n  103 |         )\n  104 |         .await\n  105 |     }","lines":31,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/usb.rs#L75-L105"},{"ref":"client/src/backend/usb.rs:39-50","code":"   39 | #[async_trait]\n   40 | pub trait UsbImpl: RequestImpl {\n   41 |     #[doc(alias = \"AcquireDevices\")]\n   42 |     async fn acquire_devices(\n   43 |         &self,\n   44 |         token: HandleToken,\n   45 |         window_identifier: Option<WindowIdentifierType>,\n   46 |         app_id: Option<MaybeAppID>,\n   47 |         devices: Vec<(String, UsbDevice, AccessOptions)>,\n   48 |         options: AcquireDevicesOptions,\n   49 |     ) -> Result<Vec<(String, AccessOptions)>>;\n   50 | }","lines":12,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/usb.rs#L39-L50"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"`&context.class().parent()? as *const _ as *mut _` does not produce a pointer to the GObject class\nstruct. `glib::Class::<T>::parent()` returns `Option<ClassRef<'_, T>>` **by value**\n(`ClassRef(NonNull<Class<T>>, bool, PhantomData)`), so `&...?` yields a reference to a stack\ntemporary holding a pointer, and the cast makes `klass` point at that 16-byte temporary. Reading\n`(*klass).get_startup_notify_id` then reads ~144 bytes into the stack (that field sits after the\nembedded `GObjectClass` in `GAppLaunchContextClass`), i.e. an out-of-bounds read of unrelated stack\nmemory. If the garbage happens to be non-null it is then **called as a function pointer**. This is\nundefined behaviour, reachable on any glib >= 2.76 and < 2.82 with the `gtk4_wayland`/`gtk4_x11`\nfeatures.","fix":"Bind the `ClassRef` to a variable and go through `Deref`/`AsRef` instead of casting a reference to\nthe `ClassRef` itself:\n\n```rust\nlet class = context.class();                       // &Class<AppLaunchContext>\nlet klass: *const gio::ffi::GAppLaunchContextClass = class.as_ref();\nlet get_startup_notify_id = (*klass).get_startup_notify_id.as_ref()?;\n```\n\n(`impl<T: IsClass> AsRef<T::GlibClassType> for Class<T>` gives the correctly typed pointer, no\nmanual cast needed.)","locations":[{"ref":"client/src/activation_token/gtk4.rs:25-35","code":"   25 |         if glib::check_version(2, 82, 0).is_some() {\n   26 |             unsafe {\n   27 |                 let klass: *mut gtk4::gio::ffi::GAppLaunchContextClass =\n   28 |                     &context.class().parent()? as *const _ as *mut _;\n   29 |                 let get_startup_notify_id = (*klass).get_startup_notify_id.as_ref()?;\n   30 |                 from_glib_full::<_, Option<String>>(get_startup_notify_id(\n   31 |                     context.as_ptr().cast(),\n   32 |                     std::ptr::null_mut(),\n   33 |                     std::ptr::null_mut(),\n   34 |                 ))\n   35 |             }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/activation_token/gtk4.rs#L25-L35"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"`Background::GetAppState` is declared in `interfaces/backend/org.freedesktop.impl.portal.Background.xml`\nas `<arg type=\"a{sv}\" name=\"apps\" direction=\"out\"/>`, but the Rust method returns\n`HashMap<MaybeAppID, AppState>`. `AppState` derives `Type` on a `#[repr(u32)]` enum, so its signature\nis `u` and the exported method signature becomes `a{su}` instead of `a{sv}` (verified with\n`zvariant` 5.13: `<HashMap<String, AppState> as Type>::SIGNATURE == \"a{su}\"`).\n`xdg-desktop-portal` will reject the reply (\"value has type a{su} but expected a{sv}\"), so\n`GetAppState` is unusable. Note how the sibling `Background` results struct on the very same page\ndoes it correctly by wrapping the value with `#[serde(with = \"as_value\")]`.","fix":"Wrap the values in variants on the wire while keeping the nice typed trait API, e.g. keep\n`BackgroundImpl::get_app_state` returning `HashMap<MaybeAppID, AppState>` and convert in the\ninterface method:\n\n```rust\n#[zbus(out_args(\"apps\"))]\nasync fn get_app_state(&self) -> Result<HashMap<MaybeAppID, zvariant::Value<'static>>, PortalError> {\n    let response = self.imp.get_app_state().await?;\n    Ok(response\n        .into_iter()\n        .map(|(id, state)| (id, zvariant::Value::from(state as u32)))\n        .collect())\n}\n```","locations":[{"ref":"client/src/backend/background.rs:122-132","code":"  122 |     #[zbus(out_args(\"apps\"))]\n  123 |     async fn get_app_state(&self) -> Result<HashMap<MaybeAppID, AppState>, PortalError> {\n  124 |         #[cfg(feature = \"tracing\")]\n  125 |         tracing::debug!(\"Background::GetAppState\");\n  126 | \n  127 |         let response = self.imp.get_app_state().await;\n  128 | \n  129 |         #[cfg(feature = \"tracing\")]\n  130 |         tracing::debug!(\"Background::GetAppState returned {:#?}\", response);\n  131 |         response\n  132 |     }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/background.rs#L122-L132"},{"ref":"client/src/backend/background.rs:60-61","code":"   60 |     #[doc(alias = \"GetAppState\")]\n   61 |     async fn get_app_state(&self) -> Result<HashMap<MaybeAppID, AppState>, PortalError>;","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/background.rs#L60-L61"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"`EmailInterface::compose_email` returns `Response<()>`, but `Response<T>` hardcodes the D-Bus\nsignature `(ua{sv})` (see `desktop::request::Response`, `#[zvariant(signature = \"(ua{sv})\")]`).\nSerializing `Response::Ok(())` writes only the 4-byte response code because zvariant's\n`serialize_unit` is a no-op, so the reply body is 4 bytes long while its declared signature claims\n`u` + `a{sv}` (which needs at least 8 bytes: the `u` plus the array's 4-byte length prefix).\nVerified experimentally with `zvariant` 5.13:\n\n```\nto_bytes_for_signature(\"(ua{sv})\", (0u32, ()))            -> [0, 0, 0, 0]           // what we send\nto_bytes_for_signature(\"(ua{sv})\", (0u32, HashMap::new())) -> [0, 0, 0, 0, 0, 0, 0, 0] // correct\n```\n\nAny frontend (`xdg-desktop-portal`'s gdbus-codegen client) that reads the `(ua{sv})` reply of\n`org.freedesktop.impl.portal.Email.ComposeEmail` will fail with a truncated/invalid-body error, so\nthe success path of the Email backend never works. The `Response::Err` path is fine because it\nexplicitly serializes an empty `HashMap`. The same mistake exists in `backend/print.rs` for\n`Response<()>`.","fix":"Never instantiate `Response<T>` with `T = ()`. Either introduce an empty dict payload type and use\nit, e.g.\n\n```rust\n#[derive(Serialize, Debug, zvariant::Type, Default)]\n#[zvariant(signature = \"dict\")]\npub struct EmailResponse {}\n```\n\nand return `Result<Response<EmailResponse>>`, or make `Response<T>`'s `Serialize` impl emit an empty\n`HashMap<&str, Value<'_>>` when `T`'s signature is `Signature::Unit`. A quick alternative is\n`Response<std::collections::HashMap<String, zvariant::OwnedValue>>`.","locations":[{"ref":"client/src/backend/email.rs:50-57","code":"   50 |     #[zbus(out_args(\"response\", \"results\"))]\n   51 |     async fn compose_email(\n   52 |         &self,\n   53 |         handle: OwnedObjectPath,\n   54 |         app_id: Optional<MaybeAppID>,\n   55 |         window_identifier: Optional<WindowIdentifierType>,\n   56 |         options: EmailOptions,\n   57 |     ) -> Result<Response<()>> {","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/email.rs#L50-L57"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"`contrast_changed` and `color_scheme_changed` build the signal payload with\n`OwnedValue::from(contrast)` / `OwnedValue::from(scheme)`. Those `From` impls\n(`client/src/desktop/settings.rs:86-95` and `129-135`) do `match value { ... => 1, _ => 0 }.into()`,\nwhere the integer literal defaults to `i32`, so the emitted variant has signature `i`, not the `u`\nrequired by the `org.freedesktop.appearance` spec. Verified: `OwnedValue(I32(1)) sig=i` and\n`u32::try_from(value) => Err(IncorrectType)`, i.e. ashpd's own\n`TryFrom<Value> for ColorScheme` / `for Contrast` (used by `receive_color_scheme_changed` and\n`receive_contrast_changed`) cannot parse what the backend emits.","fix":"Force the unsigned type in the conversions, e.g. in `client/src/desktop/settings.rs` change\n`ColorScheme::PreferDark => 1,` … `_ => 0,` followed by `.into()` into\n`match value { ColorScheme::PreferDark => 1u32, ColorScheme::PreferLight => 2u32, _ => 0u32 }.into()`\n(same for `Contrast` and `ReducedMotion`), or build the value explicitly with\n`OwnedValue::from(1u32)`.","locations":[{"ref":"client/src/backend/settings.rs:66-73","code":"   66 |     pub async fn contrast_changed(&self, contrast: Contrast) -> zbus::Result<()> {\n   67 |         self.changed(\n   68 |             APPEARANCE_NAMESPACE,\n   69 |             CONTRAST_KEY,\n   70 |             OwnedValue::from(contrast).into(),\n   71 |         )\n   72 |         .await\n   73 |     }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/settings.rs#L66-L73"},{"ref":"client/src/backend/settings.rs:84-91","code":"   84 |     pub async fn color_scheme_changed(&self, scheme: ColorScheme) -> zbus::Result<()> {\n   85 |         self.changed(\n   86 |             APPEARANCE_NAMESPACE,\n   87 |             COLOR_SCHEME_KEY,\n   88 |             OwnedValue::from(scheme).into(),\n   89 |         )\n   90 |         .await\n   91 |     }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/settings.rs#L84-L91"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"`MemoryMonitor::receive_low_memory_warning` declares the signal payload as `i32`, but\n`interfaces/org.freedesktop.portal.MemoryMonitor.xml` declares\n`<signal name=\"LowMemoryWarning\"><arg name=\"level\" type=\"y\"/><\/signal>` - a single byte (`u8`).\n\n`Proxy::signal` deserializes the message body with `msg.body().deserialize()`, which drives\ndeserialization from the *actual* body signature (`y`, 1 byte) while asking for an `i32`\n(4 bytes). zvariant's `deserialize_i32` calls `next_const_size_slice::<i32>()` and runs off the\nend of the 1-byte body, so every `LowMemoryWarning` signal fails to decode. Because\n`Proxy::signal` swallows decode errors via `filter_map(|msg| ready(msg.body().deserialize().ok()))`,\nthe failure is silent: the returned stream simply *never yields an item*. The module's own doc\nexample (`.next().await.expect(\"Stream exhausted\")`) therefore hangs forever, and the only\nfeature this portal offers is completely non-functional.\n\nThe neighbouring doc comment (`0 being the lowest ... 255 being the highest`) confirms the\nintended type is `u8`.","fix":"Change the item type to `u8`:\n\n```rust\n// before\npub async fn receive_low_memory_warning(&self) -> Result<impl Stream<Item = i32>, Error> {\n    self.0.signal(\"LowMemoryWarning\").await\n}\n\n// after\npub async fn receive_low_memory_warning(&self) -> Result<impl Stream<Item = u8> + use<>, Error> {\n    self.0.signal(\"LowMemoryWarning\").await\n}\n```","locations":[{"ref":"client/src/desktop/memory_monitor.rs:55-65","code":"   55 |     /// Signal emitted when a particular low memory situation happens\n   56 |     /// with 0 being the lowest level of memory availability warning, and 255\n   57 |     /// being the highest.\n   58 |     ///\n   59 |     /// # Specifications\n   60 |     ///\n   61 |     /// See also [`LowMemoryWarning`](https://flatpak.github.io/xdg-desktop-portal/docs/doc-org.freedesktop.portal.MemoryMonitor.html#org-freedesktop-portal-memorymonitor-lowmemorywarning).\n   62 |     #[doc(alias = \"LowMemoryWarning\")]\n   63 |     pub async fn receive_low_memory_warning(&self) -> Result<impl Stream<Item = i32>, Error> {\n   64 |         self.0.signal(\"LowMemoryWarning\").await\n   65 |     }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/memory_monitor.rs#L55-L65"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"`Notification::sound` serializes the sound as a bare file-descriptor variant:\n`Value::from(Fd::from(s.as_fd()))`, i.e. the `sound` option key gets D-Bus type `h`.\n\nThe portal's `sound` option is documented to be either a string (`\"default\"` or `\"silent\"`) or a\n`(sv)` tuple tagging the payload - exactly the same tagged form this crate already implements for\n`Icon` (`client/src/desktop/icon.rs:54-70` emits `(\"file-descriptor\", h)`, `(\"file\", s)`,\n`(\"bytes\", ay)`). A bare `h` matches neither form, so a conforming implementation cannot interpret\nit and `AddNotification` fails or drops the sound. This path is exercised by the shipped demo\n(`demo/client/src/portals/desktop/notification.rs:305`).\n\nAdditionally the API has no way at all to express the two plain-string values `\"default\"` and\n`\"silent\"`, and no way to pass a sound file by URI or by bytes, so the whole `sound` feature is\neffectively unusable.","fix":"Introduce a dedicated `Sound` enum mirroring `Icon`'s tagged serialization and store it instead of\na raw `OwnedValue`:\n\n```rust\npub enum Sound {\n    Default,                              // serializes as the string \"default\"\n    Silent,                               // serializes as the string \"silent\"\n    Uri(Uri),                             // (\"file\", s)\n    Bytes(Vec<u8>),                       // (\"bytes\", ay)\n    FileDescriptor(std::os::fd::OwnedFd), // (\"file-descriptor\", h)\n}\n```\n\nGive `Sound` a hand-written `Serialize` that emits a plain string for `Default`/`Silent` and a\n2-element tuple `(tag, Value)` otherwise (copy the shape of `impl Serialize for Icon`), change the\nfield to `sound: Option<Sound>`, and keep a convenience `Notification::sound(impl AsFd)` overload\nthat wraps into `Sound::FileDescriptor`.","locations":[{"ref":"client/src/desktop/notification.rs:291-292","code":"  291 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n  292 |     sound: Option<OwnedValue>,","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L291-L292"},{"ref":"client/src/desktop/notification.rs:338-350","code":"  338 |     /// Sets the notification sound.\n  339 |     #[must_use]\n  340 |     pub fn sound<S>(mut self, sound: impl Into<Option<S>>) -> Self\n  341 |     where\n  342 |         S: AsFd,\n  343 |     {\n  344 |         self.sound = sound.into().map(|s| {\n  345 |             zbus::zvariant::Value::from(zbus::zvariant::Fd::from(s.as_fd()))\n  346 |                 .try_to_owned()\n  347 |                 .unwrap()\n  348 |         });\n  349 |         self\n  350 |     }","lines":13,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L338-L350"}]},
