{"id":"PERF_22","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`cgroup_v2_is_snap` builds an intermediate `Option<bool>` per line via `map` and then collapses it\nwith `any(|x| x.unwrap_or(false))`. A single `any` closure expresses the same thing without the\nextra layer and lets the iterator short-circuit more obviously.","fix":"Replace `.map(|line| { .. }).any(|x| x.unwrap_or(false))` with\n`.any(|line| { .. }.unwrap_or(false))`, keeping the closure body unchanged.","locations":[{"ref":"client/src/helpers.rs:22-40","code":"   22 | fn cgroup_v2_is_snap(cgroups: &str) -> bool {\n   23 |     cgroups\n   24 |         .lines()\n   25 |         .map(|line| {\n   26 |             let (n, rest) = line.split_once(':')?;\n   27 |             // Check that n is a number.\n   28 |             n.parse::<u32>().ok()?;\n   29 |             let unit = match rest.split_once(':') {\n   30 |                 Some((\"\", unit)) => Some(unit),\n   31 |                 Some((\"freezer\", unit)) => Some(unit),\n   32 |                 Some((\"name=systemd\", unit)) => Some(unit),\n   33 |                 _ => None,\n   34 |             }?;\n   35 |             let scope = std::path::Path::new(unit).file_name()?.to_str()?;\n   36 | \n   37 |             Some(scope.starts_with(\"snap.\"))\n   38 |         })\n   39 |         .any(|x| x.unwrap_or(false))\n   40 | }","lines":19,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/helpers.rs#L22-L40"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"high","difficulty":"medium","description":"`SettingsImpl::set_signal_emitter` and `PermissionStoreImpl::set_signal_emitter` are mandatory trait\nmethods, but nothing in the crate ever calls them (`grep -rn set_signal_emitter` only matches the\ntwo declarations, `BackgroundImpl`'s declaration and the demo backend's implementation).\n`backend::Builder` wraps the implementation in an `Arc` (`client/src/backend/builder.rs:160`,\n`197`) and never hands out the emitter, and `SettingsInterface` / `PermissionStoreInterface` are\n`pub(crate)`, so their `changed()` / `document_changed()` helpers are unreachable from outside the\ncrate too. Consequence: a backend can never emit `org.freedesktop.impl.portal.Settings.SettingChanged`\nor `...PermissionStore.Changed`, so the entire signal half of both portals is dead code.","fix":"After registering the interface in `backend::Builder::build`, hand the emitter to the\nimplementation, e.g. keep the `impl` as `Arc<dyn SettingsImpl>` created *before* the interface,\nthen call `set_signal_emitter` through interior mutability (change the trait method to\n`&self` + `OnceLock`/`Mutex`), or expose the interface reference by fetching it from the object\nserver: `object_server.interface::<_, SettingsInterface>(DESKTOP_PATH)` and passing an\n`Arc<dyn SettingsSignalEmitter>` to the implementation. Add a regression test that emits a\n`SettingChanged` signal from a backend.","locations":[{"ref":"client/src/backend/settings.rs:18-40","code":"   18 | #[async_trait]\n   19 | pub trait SettingsSignalEmitter: Send + Sync {\n   20 |     #[doc(alias = \"SettingChanged\")]\n   21 |     async fn emit_changed(&self, namespace: &str, key: &str, value: Value<'_>) -> zbus::Result<()>;\n   22 |     async fn emit_contrast_changed(&self, contrast: Contrast) -> zbus::Result<()>;\n   23 |     async fn emit_accent_color_changed(&self, color: Color) -> zbus::Result<()>;\n   24 |     async fn emit_color_scheme_changed(&self, scheme: ColorScheme) -> zbus::Result<()>;\n   25 | }\n   26 | \n   27 | #[async_trait]\n   28 | pub trait SettingsImpl: Send + Sync {\n   29 |     #[doc(alias = \"ReadAll\")]\n   30 |     async fn read_all(\n   31 |         &self,\n   32 |         namespaces: Vec<String>,\n   33 |     ) -> Result<HashMap<String, Namespace>, PortalError>;\n   34 | \n   35 |     #[doc(alias = \"Read\")]\n   36 |     async fn read(&self, namespace: &str, key: &str) -> Result<OwnedValue, PortalError>;\n   37 | \n   38 |     // Set the signal emitter, allowing to notify of changes.\n   39 |     fn set_signal_emitter(&mut self, signal_emitter: Arc<dyn SettingsSignalEmitter>);\n   40 | }","lines":23,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/settings.rs#L18-L40"},{"ref":"client/src/backend/permission_store.rs:84-86","code":"   84 |     // Set the signal emitter, allowing to notify of changes.\n   85 |     fn set_signal_emitter(&mut self, signal_emitter: Arc<dyn PermissionStoreSignalEmitter>);\n   86 | }","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/permission_store.rs#L84-L86"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"medium","description":"`BackgroundImpl::set_signal_emitter` is never called anywhere in the crate (`Builder::background()`\nimmediately wraps the implementation in `Arc<dyn BackgroundImpl>` and `build_with_connection` only\nconstructs `BackgroundInterface`). Consequently a backend can never obtain a\n`BackgroundSignalEmitter`, and `BackgroundInterface::changed()` /\n`BackgroundInterface::emit_changed()` are unreachable from user code (the struct is\n`pub(crate)`), so the `RunningApplicationsChanged` signal declared at line 178 can never be emitted.\nThe trait method's explanatory comment also uses `//` instead of `///`, so it is not even part of\nthe docs. The same dead wiring exists for `SettingsImpl` and `PermissionStoreImpl`.","fix":"Wire the emitter up in `Builder::build_with_connection`: build the `BackgroundInterface` first, then\ncall `set_signal_emitter` on the implementation before it is shared, e.g. take\n`impl BackgroundImpl + 'static` by value in `Builder::background`, keep it as\n`Box<dyn BackgroundImpl>` until `build_with_connection`, do\n`imp.set_signal_emitter(Arc::clone(&iface_as_emitter))` there and only then store it in the `Arc`.\nAlternatively drop `set_signal_emitter`/`BackgroundSignalEmitter` and expose a\n`Builder`-returned handle that can emit the signal.","locations":[{"ref":"client/src/backend/background.rs:80-82","code":"   80 |     // Set the signal emitter, allowing to notify of changes.\n   81 |     fn set_signal_emitter(&mut self, signal_emitter: Arc<dyn BackgroundSignalEmitter>);\n   82 | }","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/background.rs#L80-L82"},{"ref":"client/src/backend/background.rs:99-113","code":"   99 |     pub async fn changed(&self) -> zbus::Result<()> {\n  100 |         let object_server = self.cnx.object_server();\n  101 |         let iface_ref = object_server\n  102 |             .interface::<_, Self>(crate::proxy::DESKTOP_PATH)\n  103 |             .await?;\n  104 |         Self::running_applications_changed(iface_ref.signal_emitter()).await\n  105 |     }\n  106 | }\n  107 | \n  108 | #[async_trait]\n  109 | impl BackgroundSignalEmitter for BackgroundInterface {\n  110 |     async fn emit_changed(&self) -> zbus::Result<()> {\n  111 |         self.changed().await\n  112 |     }\n  113 | }","lines":15,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/background.rs#L99-L113"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"medium","description":"`SessionInterface` declares the `Closed` signal (matching\n`interfaces/backend/org.freedesktop.impl.portal.Session.xml`) but nothing in the crate ever emits\nit: `close()` explicitly does not, and there is no other emitter (`grep` for `closed(` only finds\nthe declaration and the unrelated `SessionImpl::session_closed`). A backend that wants to tear a\nsession down on its own side (e.g. the screen cast stream died) therefore has no way to notify\nxdg-desktop-portal, which will keep the session alive forever.","fix":"Expose a way for backends to close a session from their side: add a `close()`/`emit_closed()`\nhelper on `Session`/`SessionInterface` that looks the interface up on the object server, calls the\ngenerated `SessionInterface::closed(signal_emitter)`, removes the session from the\n`SessionManager` and unregisters the object; then surface it to backends (e.g. via a\n`SessionSignalEmitter` trait analogous to `SettingsSignalEmitter`).","locations":[{"ref":"client/src/backend/session.rs:106-113","code":"  106 |         // This method intentionally does *not* emit the `Closed` signal.\n  107 |         server.remove::<Self, _>(&self.path).await?;\n  108 |         Ok(())\n  109 |     }\n  110 | \n  111 |     #[zbus(signal)]\n  112 |     async fn closed(signal_emitter: &SignalEmitter<'_>) -> zbus::Result<()>;\n  113 | }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/session.rs#L106-L113"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`Builder::sessions` is allocated unconditionally but read only inside the\n`#[cfg(feature = \"screencast\")]` block, so any build without the `screencast` feature carries a\nnever-read `Arc<Mutex<SessionManager>>` (plus a `dead_code` warning for the field and a pointless\nallocation per builder).","fix":"Gate the field and its initialisation with `#[cfg(feature = \"screencast\")]`, matching how\n`screencast_impl` is already gated.","locations":[{"ref":"client/src/backend/builder.rs:39-42","code":"   39 |     spawn: Option<Arc<dyn futures_util::task::Spawn + Send + Sync + 'static>>,\n   40 |     name_lost: Option<Arc<dyn Fn() + Send + Sync + 'static>>,\n   41 |     sessions: Arc<Mutex<SessionManager>>,\n   42 | }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/builder.rs#L39-L42"},{"ref":"client/src/backend/builder.rs:84-87","code":"   84 |             spawn: None,\n   85 |             name_lost: None,\n   86 |             sessions: Arc::new(Mutex::new(SessionManager::default())),\n   87 |         })","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/builder.rs#L84-L87"}]},

{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`FromStr for Category` and `FromStr for ButtonPurpose` never return `Err` - every unmatched string\nfalls through to `Ok(Self::Other(s.to_owned()))` - yet both declare `type Err = crate::Error`.\nConsequences:\n\n- The `.map_err(|_e| serde::de::Error::custom(\"Failed to parse category\"))` / `\"Failed to parse\n  purpose\"` arms in the two `Deserialize` impls are unreachable dead code.\n- `supported_options()` calls `Category::from_str(&c).unwrap()` and\n  `ButtonPurpose::from_str(&c).unwrap()`. These happen to be safe today only because of that\n  hidden infallibility; the code reads like an unchecked `unwrap` on remote input, and would\n  become a real panic the moment anyone makes `FromStr` strict.\n- The fallible signature misleads callers into writing error handling that can never fire.","fix":"Use `type Err = std::convert::Infallible` for both `FromStr` impls (making the infallibility part\nof the type), simplify the two `Deserialize` impls to\n`Ok(String::deserialize(deserializer)?.parse().unwrap_or_else(|e| match e {}))` - or just build the\nvalue directly - and replace the two `unwrap()` calls in `supported_options` with\n`Category::from(c.as_str())` / `ButtonPurpose::from(c.as_str())` infallible conversions.","locations":[{"ref":"client/src/desktop/notification.rs:133-165","code":"  133 | impl FromStr for Category {\n  134 |     type Err = crate::Error;\n  135 | \n  136 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  137 |         match s {\n  138 |             \"im.message\" => Ok(Self::ImMessage),\n  139 |             \"alarm.ringing\" => Ok(Self::AlarmRinging),\n  140 |             \"call.incoming\" => Ok(Self::IncomingCall),\n  141 |             \"call.ongoing\" => Ok(Self::OngoingCall),\n  142 |             \"call.missed\" => Ok(Self::MissedCall),\n  143 |             \"weather.warning.extreme\" => Ok(Self::ExtremeWeather),\n  144 {"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`RetrieveOptions::token` can never be set: the field is private, `RetrieveOptions` has no builder method\nfor it and no `Deserialize` impl, so it is always `None` and the `skip_serializing_if` branch always\nfires. The field only exists to carry a `TODO` note.","fix":"Either add the setter, e.g.\n```rust\nimpl RetrieveOptions {\n    #[must_use]\n    pub fn set_token<'a>(mut self, token: impl Into<Option<&'a str>>) -> Self {\n        self.token = token.into().map(ToOwned::to_owned);\n        self\n    }\n}\n```\nor delete the field and keep the `TODO` as a comment on the struct.","locations":[{"ref":"client/src/desktop/secret.rs:38-45","code":"   38 | pub struct RetrieveOptions {\n   39 |     #[serde(with = \"as_value\")]\n   40 |     handle_token: HandleToken,\n   41 |     /// A string returned by a previous call to `retrieve`.\n   42 |     /// TODO: seems to not be used by the portal...\n   43 |     #[serde(with = \"optional\", skip_serializing_if = \"Option::is_none\")]\n   44 |     token: Option<String>,\n   45 | }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/secret.rs#L38-L45"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`FilePath` is exported unconditionally from `lib.rs`, but its only constructor\n`FilePath::new` is `pub(crate)` and is only used by the `documents` and `flatpak` modules, which\nare feature-gated. Building without those features produces a real compiler warning, reproduced\nwith `cargo check -p ashpd --no-default-features --features tokio,screenshot`:\n`warning: associated function 'new' is never used --> client/src/file_path.rs:22:19`.\nAs a side effect users of the public `FilePath` type cannot construct one at all (e.g. for tests\nor for their own portal calls) - the only public API is `AsRef<Path>`.","fix":"Make the constructor public and fallible-by-contract, e.g.\n```rust\nimpl FilePath {\n    pub fn new<T: AsRef<Path>>(s: T) -> Result<Self, crate::Error> { .. }\n}\n```\nor gate the whole module with `#[cfg(any(feature = \"documents\", feature = \"flatpak\"))]` the way\n`proxy.rs`'s `DOCUMENTS_*`/`FLATPAK_*` constants should be.","locations":[{"ref":"client/src/file_path.rs:21-28","code":"   21 | impl FilePath {\n   22 |     pub(crate) fn new<T: AsRef<Path>>(s: T) -> Result<Self, crate::Error> {\n   23 |         let c_string = CString::new(s.as_ref().as_os_str().as_bytes())\n   24 |             .map_err(|err| crate::Error::NulTerminated(err.nul_position()))?;\n   25 | \n   26 |         Ok(Self(c_string))\n   27 |     }\n   28 | }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/file_path.rs#L21-L28"},{"ref":"client/src/lib.rs:41-42","code":"   41 | mod file_path;\n   42 | pub use self::file_path::FilePath;","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/lib.rs#L41-L42"}]},

{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`impl std::ops::Deref for RegistryProxy` is never used: `RegistryProxy` is a private type, its only method `register`\ngoes through `self.0` directly, and neither `register_host_app` nor `register_host_app_with_connection` dereferences\nthe proxy. It is a copy of the `Deref` impl that public portal proxies have (e.g.\n`client/src/desktop/wallpaper.rs:213`), pasted where it serves no purpose.","fix":"Delete the `impl std::ops::Deref for RegistryProxy` block.","locations":[{"ref":"client/src/registry.rs:31-37","code":"   31 | impl std::ops::Deref for RegistryProxy {\n   32 |     type Target = zbus::Proxy<'static>;\n   33 | \n   34 |     fn deref(&self) -> &Self::Target {\n   35 |         &self.0\n   36 |     }\n   37 | }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/registry.rs#L31-L37"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`activation_token/wayland.rs` is only compiled through `#[cfg(feature = \"wayland\")] mod wayland;`\n(`activation_token/mod.rs:9-10`), yet every public method inside it repeats\n`#[cfg(feature = \"wayland\")]`. The inner attributes can never be false and just add noise.","fix":"Delete the four redundant `#[cfg(feature = \"wayland\")]` lines (at lines 31, 41, 64 and 95), keeping\nthe `#[cfg_attr(docsrs, doc(cfg(feature = \"wayland\")))]` attributes.","locations":[{"ref":"client/src/activation_token/wayland.rs:31-32","code":"   31 |     #[cfg(feature = \"wayland\")]\n   32 |     #[cfg_attr(docsrs, doc(cfg(feature = \"wayland\")))]","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/activation_token/wayland.rs#L31-L32"},{"ref":"client/src/activation_token/mod.rs:9-10","code":"    9 | #[cfg(feature = \"wayland\")]\n   10 | mod wayland;","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/activation_token/mod.rs#L9-L10"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`impl PartialEq for Request` / `impl Eq for Request` and `impl PartialEq for Session` are never\nused anywhere in the crate (requests and sessions are keyed by their `HandleToken` in\n`SessionManager`, and `Request` is only stored in the zbus object server). They are unreachable\nAPI surface on `pub(crate)`/rarely used types that also invite comparing two distinct requests that\nhappen to share a path.","fix":"Delete the three impls, or derive `PartialEq`/`Eq` on the `path` field only if a real caller\nappears.","locations":[{"ref":"client/src/backend/request.rs:107-112","code":"  107 | impl PartialEq for Request {\n  108 |     fn eq(&self, other: &Self) -> bool {\n  109 |         self.path == other.path\n  110 |     }\n  111 | }\n  112 | impl Eq for Request {}","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/request.rs#L107-L112"},{"ref":"client/src/backend/session.rs:48-52","code":"   48 | impl PartialEq for Session {\n   49 |     fn eq(&self, other: &Self) -> bool {\n   50 |         self.path == other.path\n   51 |     }\n   52 | }","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/session.rs#L48-L52"}]},

{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `TryFrom<&OwnedObjectPath> for HandleToken`, `.split('/').next_back().expect(\"A valid request\nObjectPath\")` can never fail: `str::split` always yields at least one item (even for an empty\nstring), so the `expect` is unreachable and its message misleadingly suggests it validates the\nobject path. The actual validation happens in `Self::try_from(base_segment)` on the next line.","fix":"Drop the unreachable `expect`:\n```rust\n// before\nlet base_segment = value.as_str().split('/').next_back().expect(\"A valid request ObjectPath\");\n// after\nlet base_segment = value.as_str().rsplit('/').next().unwrap_or_default();\n```","locations":[{"ref":"client/src/desktop/handle_token.rs:110-117","code":"  110 |     fn try_from(value: &zbus::zvariant::OwnedObjectPath) -> Result<Self, Self::Error> {\n  111 |         let base_segment = value\n  112 |             .as_str()\n  113 |             .split('/')\n  114 |             .next_back()\n  115 |             .expect(\"A valid request ObjectPath\");\n  116 |         Self::try_from(base_segment)\n  117 |     }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/handle_token.rs#L110-L117"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`LocationInner` derives `Serialize` but is a private type that is only ever produced by\ndeserializing the `LocationUpdated` signal - there is no constructor, no public accessor returning\nit, and no code path that serializes it. The derive is dead weight that also implies the type is\npart of some wire-out path, which it is not.","fix":"```rust\n// before\n#[derive(Debug, Serialize, Deserialize, Type)]\n\n// after\n#[derive(Debug, Deserialize, Type)]\n```\n\n(`Serialize` remains imported for `CreateSessionOptions`/`StartOptions`, so no import change is\nneeded.)","locations":[{"ref":"client/src/desktop/location.rs:200-203","code":"  200 | #[derive(Debug, Serialize, Deserialize, Type)]\n  201 | #[zvariant(signature = \"dict\")]\n  202 | #[serde(rename_all = \"PascalCase\")]\n  203 | struct LocationInner {","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/location.rs#L200-L203"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The first `remote_desktop` module doc example imports `PersistMode` but never uses it (only the second\nexample needs it), producing an `unused_imports` warning when doc tests are compiled.","fix":"Drop `PersistMode,` from the first example's `use ashpd::desktop::{ ... }`, leaving\n`use ashpd::desktop::remote_desktop::{DeviceType, KeyState, RemoteDesktop, SelectDevicesOptions};`.","locations":[{"ref":"client/src/desktop/remote_desktop.rs:4-7","code":"    4 | //! use ashpd::desktop::{\n    5 | //!     PersistMode,\n    6 | //!     remote_desktop::{DeviceType, KeyState, RemoteDesktop, SelectDevicesOptions},\n    7 | //! };","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/remote_desktop.rs#L4-L7"}]},
{"id":"DEAD_18","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"Cosmetic dead weight in `Request<T>`: (a) the 4th field `PhantomData<T>` is redundant because `T` already\nappears in the 3rd field `Mutex<Option<Result<T, Error>>>`; (b) `Request` is a positional tuple struct, so\nthe implementation reads `self.0` (proxy), `self.1` (signal stream), `self.2` (result) with no names;\n(c) `let r = response as Result<T, Error>;` is a no-op coercion cast of a value that already has exactly\nthat type (it only survives because `trivial_casts` is allow-by-default).","fix":"Convert `Request` into a named-field struct and drop the `PhantomData`:\n\n```rust\npub struct Request<T> where T: for<'de> Deserialize<'de> + Type + Debug {\n    proxy: Proxy<'static>,\n    stream: SignalStream<'static>,\n    response: Mutex<Option<Result<T, Error>>>,\n}\n```\n\nand replace `let r = response as Result<T, Error>; *self.2.get_mut().unwrap() = Some(r);` with\n`*self.response.get_mut().unwrap() = Some(response);`.","locations":[{"ref":"client/src/desktop/request.rs:201-208","code":"  201 | pub struct Request<T>(\n  202 |     Proxy<'static>,\n  203 |     SignalStream<'static>,\n  204 |     Mutex<Option<Result<T, Error>>>,\n  205 |     PhantomData<T>,\n  206 | )\n  207 | where\n  208 |     T: for<'de> Deserialize<'de> + Type + Debug;","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/request.rs#L201-L208"},{"ref":"client/src/desktop/request.rs:255-256","code":"  255 |         let r = response as Result<T, Error>;\n  256 |         *self.2.get_mut().unwrap() = Some(r);","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/request.rs#L255-L256"}]},
{"id":"DEAD_19","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `request.rs`'s test module, `use zbus::zvariant::Value;` duplicates the `Value` already brought in by\n`use super::*;`, and the single test is entirely gated on `#[cfg(feature = \"account\")]`. Without that\nfeature the module compiles to nothing but still holds two unused imports (`Value`, and `HashMap` via the\nglob), producing `unused_imports` warnings. Two of the three assertions (`Response::<()>::SIGNATURE`) do\nnot need the `account` feature at all and are therefore never exercised in a default `cargo test`.","fix":"Drop the redundant `use zbus::zvariant::Value;`, move the `account`-specific assertion into its own\n`#[cfg(feature = \"account\")]` test, and keep the feature-independent assertions\n(`<(ResponseType, HashMap<&str, Value<'_>>)>::SIGNATURE == Response::<()>::SIGNATURE` and\n`Response::<()>::SIGNATURE == \"(ua{sv})\"`) in an ungated test.","locations":[{"ref":"client/src/desktop/request.rs:301-321","code":"  301 | #[cfg(test)]\n  302 | mod tests {\n  303 |     use zbus::zvariant::Value;\n  304 | \n  305 |     use super::*;\n  306 | \n  307 |     #[cfg(feature = \"account\")]\n  308 |     #[test]\n  309 |     fn response_signature() {\n  310 |         use crate::desktop::account::UserInformation;\n  311 |         assert_eq!(\n  312 |             <(ResponseType, HashMap<&str, Value<'_>>)>::SIGNATURE,\n  313 |             Response::<()>::SIGNATURE,\n  314 |         );\n  315 |         assert_eq!(\n  316 |             <(ResponseType, UserInformation)>::SIGNATURE,\n  317 |             Response::<UserInformation>::SIGNATURE,\n  318 |         );\n  319 |         assert_eq!(Response::<()>::SIGNATURE, \"(ua{sv})\");\n  320 |     }\n  321 | }","lines":21,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/request.rs#L301-L321"}]},
{"id":"DEAD_20","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`is_sandboxed` checks the `OnceLock` twice: the early `if let Some(cached_value) =\nIS_SANDBOXED.get()` fast path is fully redundant because `get_or_init` already avoids\nre-evaluating the initialiser. Worse, in the current shape `new_value` is computed *before*\n`get_or_init`, so the file-system probes run on every call that reaches that line even when the\ncell is already initialised - the opposite of what the doc comment promises about caching.","fix":"Collapse to a single lazily-initialised read:\n```rust\npub fn is_sandboxed() -> bool {\n    *IS_SANDBOXED.get_or_init(|| crate::helpers::is_flatpak() || crate::helpers::is_snap())\n}\n```","locations":[{"ref":"client/src/lib.rs:72-79","code":"   72 | pub fn is_sandboxed() -> bool {\n   73 |     if let Some(cached_value) = IS_SANDBOXED.get() {\n   74 |         return *cached_value;\n   75 |     }\n   76 |     let new_value = crate::helpers::is_flatpak() || crate::helpers::is_snap();\n   77 | \n   78 |     *IS_SANDBOXED.get_or_init(|| new_value)\n   79 | }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/lib.rs#L72-L79"}]},
{"id":"DEAD_21","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`#[allow(dead_code)]` sits on the public `WindowIdentifierType::Wayland` variant of a public enum. The attribute is\nstale on two counts: `dead_code` never fires for `pub` items reachable from the crate root, and the variant *is*\nconstructed in several places (`client/src/window_identifier/mod.rs:209`,\n`client/src/window_identifier/gtk4.rs:78`, `client/src/window_identifier/wayland.rs:266`). It is also placed before\nthe doc comment, which is unconventional and easy to misread as documenting the attribute.","fix":"Delete the `#[allow(dead_code)]` line so the variant reads:\n\n```rust\n/// Wayland.\nWayland(String),\n```","locations":[{"ref":"client/src/window_identifier/mod.rs:285-287","code":"  285 |     #[allow(dead_code)]\n  286 |     /// Wayland.\n  287 |     Wayland(String),","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L285-L287"}]},
{"id":"DEAD_22","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`if IMPL_OUTPUT_DIR.exists(): shutil.rmtree(IMPL_OUTPUT_DIR)` can never run: `IMPL_OUTPUT_DIR` is\n`interfaces/backend`, a child of `PORTAL_OUTPUT_DIR` (`interfaces`), which was just removed recursively by the\npreceding two lines. The branch is dead.","fix":"Delete the `IMPL_OUTPUT_DIR` removal block, or make the two output directories independent if `interfaces/backend`\nis ever moved out of `interfaces/`.","locations":[{"ref":"update-interfaces.py:109-113","code":"  109 |     # Clean previous output directories to avoid stale files\n  110 |     if PORTAL_OUTPUT_DIR.exists():\n  111 |         shutil.rmtree(PORTAL_OUTPUT_DIR)\n  112 |     if IMPL_OUTPUT_DIR.exists():\n  113 |         shutil.rmtree(IMPL_OUTPUT_DIR)","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L109-L113"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"The `filters()` and `choices()` builder methods are documented as \"Adds a list of files filters\" /\n\"Adds a list of choices\" but they *assign* the vector, discarding anything added earlier by\n`filter()` / `choice()`. Following the crate's own module example\n(`.choice(...).choice(...).filter(...)`) with a `choices([...])` call silently drops the previously\nadded entries, so the dialog is shown without the expected filters/choices.","fix":"Either fix the docs to say \"Sets the list of files filters\" / \"Sets the list of choices\", or make\nthe behaviour match the docs, e.g. change\n```rust\nself.options.filters = filters.into_iter().collect();\n```\nto\n```rust\nself.options.filters.extend(filters);\n```\nand likewise `self.options.choices.extend(choices);`. Apply the same change to all five sites\n(`OpenFileRequest`, `SaveFilesRequest`, `SaveFileRequest`).","locations":[{"ref":"client/src/desktop/file_chooser.rs:808-813","code":"  808 |     #[must_use]\n  809 |     /// Adds a list of files filters.\n  810 |     pub fn filters(mut self, filters: impl IntoIterator<Item = FileFilter>) -> Self {\n  811 |         self.options.filters = filters.into_iter().collect();\n  812 |         self\n  813 |     }","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/file_chooser.rs#L808-L813"},{"ref":"client/src/desktop/file_chooser.rs:829-834","code":"  829 |     #[must_use]\n  830 |     /// Adds a list of choices.\n  831 |     pub fn choices(mut self, choices: impl IntoIterator<Item = Choice>) -> Self {\n  832 |         self.options.choices = choices.into_iter().collect();\n  833 |         self\n  834 |     }","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/file_chooser.rs#L829-L834"},{"ref":"client/src/desktop/file_chooser.rs:916-921","code":"  916 |     #[must_use]\n  917 |     /// Adds a list of choices.\n  918 |     pub fn choices(mut self, choices: impl IntoIterator<Item = Choice>) -> Self {\n  919 |         self.options.choices = choices.into_iter().collect();\n  920 |         self\n  921 |     }","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/file_chooser.rs#L916-L921"},{"ref":"client/src/desktop/file_chooser.rs:1045-1050","code":" 1045 |     #[must_use]\n 1046 |     /// Adds a list of files filters.\n 1047 |     pub fn filters(mut self, filters: impl IntoIterator<Item = FileFilter>) -> Self {\n 1048 |         self.options.filters = filters.into_iter().collect();\n 1049 |         self\n 1050 |     }","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/file_chooser.rs#L1045-L1050"},{"ref":"client/src/desktop/file_chooser.rs:1066-1071","code":" 1066 |     #[must_use]\n 1067 |     /// Adds a list of choices.\n 1068 |     pub fn choices(mut self, choices: impl IntoIterator<Item = Choice>) -> Self {\n 1069 |         self.options.choices = choices.into_iter().collect();\n 1070 |         self\n 1071 |     }","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/file_chooser.rs#L1066-L1071"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The rustdoc of `is_sandboxed()` states that the function checks `/.flatpak-info`, whether the app\nis a snap, *and* whether the environment variable `GTK_USE_PORTAL` is set to `1`. The\nimplementation only calls `crate::helpers::is_flatpak()` and `crate::helpers::is_snap()`;\n`GTK_USE_PORTAL` is never read anywhere in the crate (`grep` for it matches only this doc\ncomment). Callers who read the docs and rely on `GTK_USE_PORTAL=1` forcing the sandboxed\ncode-path silently get `false`.","fix":"Either drop the claim from the doc comment, or implement it:\n```rust\nlet new_value = crate::helpers::is_flatpak()\n    || crate::helpers::is_snap()\n    || std::env::var(\"GTK_USE_PORTAL\").as_deref() == Ok(\"1\");\n```","locations":[{"ref":"client/src/lib.rs:66-79","code":"   66 | /// Check whether the application is running inside a sandbox.\n   67 | ///\n   68 | /// The function checks whether the file `/.flatpak-info` exists, or if the app\n   69 | /// is running as a snap, or if the environment variable `GTK_USE_PORTAL` is set\n   70 | /// to `1`. As the return value of this function will not change during the\n   71 | /// runtime of a program; it is cached for future calls.\n   72 | pub fn is_sandboxed() -> bool {\n   73 |     if let Some(cached_value) = IS_SANDBOXED.get() {\n   74 |         return *cached_value;\n   75 |     }\n   76 |     let new_value = crate::helpers::is_flatpak() || crate::helpers::is_snap();\n   77 | \n   78 |     *IS_SANDBOXED.get_or_init(|| new_value)\n   79 | }","lines":14,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/lib.rs#L66-L79"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for the command-line setters is an unfinished sentence: \"If this is not specified,\nthe [`Exec`] line from the [desktop file]\" - the verb is missing. It is duplicated verbatim in both\n`BackgroundRequestOptions::set_command` and `BackgroundRequest::command`, while the module-level\ndoc (lines 30-31) has the complete wording (\"... will be used\").","fix":"Finish the sentence in both places, e.g. `/// file](...) will be used.` matching the module\ndocumentation.","locations":[{"ref":"client/src/desktop/background.rs:81-85","code":"   81 |     #[must_use]\n   82 |     /// Specifies the command line to execute.\n   83 |     /// If this is not specified, the [`Exec`](https://specifications.freedesktop.org/desktop-entry-spec/desktop-entry-spec-latest.html#exec-variables) line from the [desktop\n   84 |     /// file](https://specifications.freedesktop.org/desktop-entry-spec/desktop-entry-spec-latest.html#introduction)\n   85 |     pub fn set_command<P: IntoIterator<Item = I>, I: AsRef<str> + Type + Serialize>(","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/background.rs#L81-L85"},{"ref":"client/src/desktop/background.rs:257-261","code":"  257 |     #[must_use]\n  258 |     /// Specifies the command line to execute.\n  259 |     /// If this is not specified, the [`Exec`](https://specifications.freedesktop.org/desktop-entry-spec/desktop-entry-spec-latest.html#exec-variables) line from the [desktop\n  260 |     /// file](https://specifications.freedesktop.org/desktop-entry-spec/desktop-entry-spec-latest.html#introduction)\n  261 |     pub fn command<P: IntoIterator<Item = I>, I: AsRef<str> + Type + Serialize>(","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/background.rs#L257-L261"} {"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The camera module documentation contains a grammatical error and a misleading word: \"Although the\nexamples are primary focus is screen casting, stream connection logic remains the same -- with one\naccessibility change\" - the change being described is setting `MEDIA_ROLE` to `Camera`, which has\nnothing to do with accessibility.","fix":"Reword, e.g. \"Although those examples focus on screen casting, the stream connection logic is the\nsame - with one change: set `MEDIA_ROLE` to `Camera`.\"","locations":[{"ref":"client/src/desktop/camera.rs:19-21","code":"   19 | //! An example on how to connect with Pipewire can be found [here](https://github.com/bilelmoussaoui/ashpd/blob/main/examples/screen_cast_pw.rs), and with GStreamer [here](https://github.com/bilelmoussaoui/ashpd/blob/main/examples/screen_cast_gstreamer.rs).\n   20 | //! Although the examples are primary focus is screen casting, stream connection\n   21 | //! logic remains the same -- with one accessibility change:","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/camera.rs#L19-L21"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The module-level example teaches broken icon loading: `f.read(&mut buffer)` may fill only part of\nthe buffer and its return value is discarded (the `expect(\"buffer overflow\")` message is also\nnonsense - `read` never overflows), so the example can send a truncated icon to the portal. It also\nstats the file separately (`std::fs::metadata`) and casts `metadata.len() as usize`, which truncates\non 32-bit targets.","fix":"Replace the whole read block with the one-liner that cannot truncate:\n```rust\nlet bytes = std::fs::read(filename).expect(\"failed to read the icon\");\nlet icon = Icon::Bytes(bytes);\n```\nand drop the now-unused `use std::io::Read;` from the example.","locations":[{"ref":"client/src/desktop/dynamic_launcher.rs:18-24","code":"   18 | //!     let filename = \"/home/bilalelmoussaoui/Projects/ashpd/ashpd-demo/data/icons/com.belmoussaoui.ashpd.demo.svg\";\n   19 | //!     let mut f = std::fs::File::open(&filename).expect(\"no file found\");\n   20 | //!     let metadata = std::fs::metadata(&filename).expect(\"unable to read metadata\");\n   21 | //!     let mut buffer = vec![0; metadata.len() as usize];\n   22 | //!     f.read(&mut buffer).expect(\"buffer overflow\");\n   23 | //!\n   24 | //!     let icon = Icon::Bytes(buffer);","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/dynamic_launcher.rs#L18-L24"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Copy-paste leftovers in the `input_capture` doc comments: `ZonesChanged::session_handle()` is\ndocumented as \"Session that was deactivated.\" (copied from `Deactivated`) although the signal\nmeans the session's zones changed, and `StartResponse` is documented as\n\"Response of [`InputCapture::create_session`] request\" although it is the response of\n`InputCapture::start` (`create_session` returns `(Session, BitFlags<Capabilities>)`).\nThe second one renders a misleading link in the public API docs.","fix":"```rust\n// line 621\n/// Session whose zones changed.\n// line 402\n/// Response of [`InputCapture::start`] request.\n```","locations":[{"ref":"client/src/desktop/input_capture.rs:620-623","code":"  620 | impl ZonesChanged {\n  621 |     /// Session that was deactivated.\n  622 |     pub fn session_handle(&self) -> ObjectPath<'_> {\n  623 |         self.0.as_ref()","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L620-L623"},{"ref":"client/src/desktop/input_capture.rs:400-403","code":"  400 | #[derive(Debug, Deserialize, Type)]\n  401 | #[zvariant(signature = \"dict\")]\n  402 | /// Response of [`InputCapture::create_session`] request.\n  403 | pub struct StartResponse {","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L400-L403"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The crate-level doc example for the notification portal cannot work as written: it sets\n`.default_action_target(100)` (and `Button::target(32)` / `Button::target(40)`), where the integer\nliterals infer to `i32` and therefore become `Value::I32`, but then reads the payload back with\n`action.parameter().get(0).unwrap().downcast_ref::<u32>()`, which can never succeed. Copy-pasting\nthe example gives users a silent `Err` and the impression that `parameter()` is broken. The\nexample also uses `.get(0).unwrap()` (a panic if the portal sends an empty `av`, plus a\n`clippy::get_first` lint) where `.first()` would do.","fix":"Make the types agree and avoid the `unwrap`:\n\n```rust\n//!                 .default_action_target(100u32)\n//!                 .button(Button::new(\"Copy\", \"copy\").target(32u32))\n//!                 .button(Button::new(\"Delete\", \"delete\").target(40u32))\n...\n//!     if let Some(param) = action.parameter().first() {\n//!         println!(\"{:#?}\", param.downcast_ref::<u32>());\n//!     }\n```","locations":[{"ref":"client/src/desktop/notification.rs:22-46","code":"   22 | //!                 .default_action_target(100)\n   23 | //!                 .body(\"color copied to clipboard\")\n   24 | //!                 .priority(Priority::High)\n   25 | //!                 .icon(Icon::with_names(&[\"dialog-question-symbolic\"]))\n   26 | //!                 .button(Button::new(\"Copy\", \"copy\").target(32))\n   27 | //!                 .button(Button::new(\"Delete\", \"delete\").target(40)),\n   28 | //!         )\n   29 | //!         .await?;\n   30 | //!\n   31 | //!     let action = proxy\n   32 | //!         .receive_action_invoked()\n   33 | //!         .await?\n   34 | //!         .next()\n   35 | //!         .await\n   36 | //!         .expect(\"Stream exhausted\");\n   37 | //!     match action.name() {\n   38 | //!         \"copy\" => (),   // Copy something to clipboard\n   39 | //!         \"delete\" => (), // Delete the file\n   40 | //!         _ => (),\n   41 | //!     };\n   42 | //!     println!(\"{:#?}\", action.id());\n   43 | //!     println!(\n   44 | //!         \"{:#?}\",\n   45 | //!         action.parameter().get(0).unwrap().downcast_ref::<u32>()\n   46 | //!     );","lines":25,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L22-L46"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`DisplayHint::HideContentOnLockScreen` carries the doc comment `/// Enable speakerphone.`, copied\nverbatim from `ButtonPurpose::CallEnableSpeakerphone` (`client/src/desktop/notification.rs:416-418`).\nThe rendered public API docs therefore describe a lock-screen privacy hint as a telephony action.","fix":"```rust\n// before\n    /// Enable speakerphone.\n    #[doc(alias = \"hide-content-on-lockscreen\")]\n    HideContentOnLockScreen,\n\n// after\n    /// Hide the notification content while the screen is locked.\n    #[doc(alias = \"hide-content-on-lockscreen\")]\n    HideContentOnLockScreen,\n```","locations":[{"ref":"client/src/desktop/notification.rs:250-252","code":"  250 |     /// Enable speakerphone.\n  251 |     #[doc(alias = \"hide-content-on-lockscreen\")]\n  252 |     HideContentOnLockScreen,","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L250-L252"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `open_uri` doc comment says `Asks to open a local file.` - copy-pasted from `open_file`\ndirectly above it (`client/src/desktop/open_uri.rs:154`). It is actively contradicted three lines\nlater by its own note: `*Note* that `file` uris are explicitly not supported by this method.`\n`open_uri` opens a URI, not a local file.","fix":"```rust\n// before\n    /// Asks to open a local file.\n\n// after\n    /// Asks to open a URI with the user's preferred application.\n```","locations":[{"ref":"client/src/desktop/open_uri.rs:182-191","code":"  182 |     /// Asks to open a local file.\n  183 |     ///\n  184 |     /// # Arguments\n  185 |     ///\n  186 |     /// * `identifier` - Identifier for the application window.\n  187 |     /// * `uri` - The uri to open.\n  188 |     /// * `options` - The options to pass to the request.\n  189 |     ///\n  190 |     /// *Note* that `file` uris are explicitly not supported by this method.\n  191 |     /// Use [`Self::open_file`] or [`Self::open_directory`] instead.","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/open_uri.rs#L182-L191"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Both `remote_desktop` module doc examples say `// 13 for Enter key code` before calling\n`notify_keyboard_keycode(&session, 13, KeyState::Pressed, ..)`. `NotifyKeyboardKeycode` takes a Linux\nevdev keycode, where `13` is `KEY_EQUAL`; `KEY_ENTER` is `28`. Anyone copying the example gets `=`\ninstead of Return.","fix":"Change both comments/values to `// 28 for the Enter key (KEY_ENTER)` and pass `28`.","locations":[{"ref":"client/src/desktop/remote_desktop.rs:26-28","code":"   26 | //!     // 13 for Enter key code\n   27 | //!     proxy\n   28 | //!         .notify_keyboard_keycode(&session, 13, KeyState::Pressed, Default::default())","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/remote_desktop.rs#L26-L28"},{"ref":"client/src/desktop/remote_desktop.rs:78-80","code":"   78 | //!     // 13 for Enter key code\n   79 | //!     remote_desktop\n   80 | //!         .notify_keyboard_keycode(&session, 13, KeyState::Pressed, Default::default())","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/remote_desktop.rs#L78-L80"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `RemoteDesktop::select_devices` documents an argument `types` that does not exist in\nthe signature; the device types are passed inside `SelectDevicesOptions` via\n`SelectDevicesOptions::set_devices`. The `options` parameter is undocumented.","fix":"Replace `* \\`types\\` - The device types to request remote controlling of.` with\n`* \\`options\\` - [\\`SelectDevicesOptions\\`]; use [\\`SelectDevicesOptions::set_devices\\`] to pick the device types.`","locations":[{"ref":"client/src/desktop/remote_desktop.rs:355-360","code":"  355 |     /// # Arguments\n  356 |     ///\n  357 |     /// * `session` - A [`Session`], created with\n  358 |     ///   [`create_session()`][`RemoteDesktop::create_session`].\n  359 |     /// * `types` - The device types to request remote controlling of.\n  360 |     ///","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/remote_desktop.rs#L355-L360"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `RemoteDesktop::notify_pointer_axis` still lists `* \\`finish\\` - Whether it is the\nlast axis event.` as a function argument, but `finish` was moved into `NotifyPointerAxisOptions`\n(`set_finish`) and is no longer a parameter. The `# Arguments` list no longer matches the signature.","fix":"Replace the `finish` bullet with `* \\`options\\` - [\\`NotifyPointerAxisOptions\\`], use\n[\\`NotifyPointerAxisOptions::set_finish\\`] to mark the last event of a sequence.`","locations":[{"ref":"client/src/desktop/remote_desktop.rs:685-692","code":"  685 |     /// # Arguments\n  686 |     ///\n  687 |     /// * `session` - A [`Session`], created with\n  688 |     ///   [`create_session()`][`RemoteDesktop::create_session`].\n  689 |     /// * `dx` - Relative axis movement on the x axis.\n  690 |     /// * `dy` - Relative axis movement on the y axis.\n  691 |     /// * `finish` - Whether it is the last axis event.\n  692 |     ///","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/remote_desktop.rs#L685-L692"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`Screencast::select_sources` documents three arguments it does not have. Since the options were moved\ninto `SelectSourcesOptions` the signature is `(session, options)`, but the `# Arguments` list still\ndescribes `cursor_mode`, `types` and `multiple` as parameters of the method.","fix":"Replace the stale entries with a single `options` entry:\n```rust\n/// # Arguments\n///\n/// * `session` - A [`Session`], created with\n///   [`create_session()`][`Screencast::create_session`].\n/// * `options` - The [`SelectSourcesOptions`] describing what to record.\n```","locations":[{"ref":"client/src/desktop/screencast.rs:541-549","code":"  541 |     /// # Arguments\n  542 |     ///\n  543 |     /// * `session` - A [`Session`], created with\n  544 |     ///   [`create_session()`][`Screencast::create_session`].\n  545 |     /// * `cursor_mode` - Sets how the cursor will be drawn on the screen cast\n  546 |     ///   stream.\n  547 |     /// * `types` - Sets the types of content to record.\n  548 |     /// * `multiple`- Sets whether to allow selecting multiple sources.\n  549 |     ///","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/screencast.rs#L541-L549"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment justifying the `spawn_blocking` in `secret::retrieve()` states the opposite of the real\nreason: \"Read the secret on a blocking thread since it's a small amount of data\". Being a small amount of\ndata is an argument *against* moving the work to a blocking thread; the actual reason is that `x1` is a\nsynchronous `std::os::unix::net::UnixStream` whose `read_to_end` would block the async executor.","fix":"Reword to something accurate, e.g.\n`// `x1` is a blocking std UnixStream, so the read must not happen on the executor thread.`","locations":[{"ref":"client/src/desktop/secret.rs:119-127","code":"  119 |     // Read the secret on a blocking thread since it's a small amount of data\n  120 |     #[cfg(feature = \"tokio\")]\n  121 |     let buf = tokio::task::spawn_blocking(move || {\n  122 |         let mut buf = Vec::with_capacity(64);\n  123 |         x1.read_to_end(&mut buf)?;\n  124 |         Ok::<_, std::io::Error>(buf)\n  125 |     })\n  126 |     .await\n  127 |     .map_err(|e| Error::from(std::io::Error::other(e)))??;","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/secret.rs#L119-L127"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `flatpak` module example header says `Spawn a process inside of the sandbox, only works in a\nFlatpak.` `Flatpak::spawn` does the opposite of running something inside the current sandbox: as\nits own rustdoc says (`client/src/flatpak/mod.rs:324-325`) it `let you start a new instance of\nyour application, optionally enabling a tighter sandbox`, i.e. a brand new sandbox on the host.\n`lib.rs:53-56` describes the same module as `Spawn commands outside the sandbox`, so the two doc\ncomments directly contradict each other.","fix":"Change line 3 to something like\n`//! Spawn a new sandboxed instance of the application; only works inside a Flatpak.`","locations":[{"ref":"client/src/flatpak/mod.rs:1-4","code":"    1 | //! # Examples\n    2 | //!\n    3 | //! Spawn a process inside of the sandbox, only works in a Flatpak.\n    4 | //!","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/mod.rs#L1-L4"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `update_monitor` module example is wrong in two ways: `receive_update_available()` returns a\n`Stream`, but the result is bound to a variable called `info` and then never polled (it also\ntriggers an `unused_variables` warning when the doctest is compiled), and `monitor.update(..)` is\nissued unconditionally without ever having observed an available update. Copying this example\ngives code that never learns about updates.","fix":"Poll the stream before updating, e.g.\n```rust\nlet mut updates = monitor.receive_update_available().await?;\nlet info = updates.next().await.expect(\"Stream exhausted\");\nprintln!(\"{info:#?}\");\nmonitor.update(None, Default::default()).await?;\n```","locations":[{"ref":"client/src/flatpak/update_monitor.rs:13-16","code":"   13 | //!     let monitor = proxy.create_update_monitor(Default::default()).await?;\n   14 | //!     let info = monitor.receive_update_available().await?;\n   15 | //!\n   16 | //!     monitor.update(None, Default::default()).await?;","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/update_monitor.rs#L13-L16"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`cgroup_v2_is_snap` is named after cgroup v2 only, but it deliberately also parses cgroup v1\nlines - the match arms accept `freezer` and `name=systemd` controller names, and the unit test\nright below feeds it a full cgroup v1 hierarchy dump. The misleading name invites a future reader\nto add a `cgroup_v1_is_snap` or to delete the v1 arms as unreachable.","fix":"Rename to `cgroups_is_snap` (and update the call site in `is_snap` at\n`client/src/helpers.rs:17` and the test name at `client/src/helpers.rs:47`), or add a one-line\ncomment stating that both cgroup v1 and v2 layouts are handled.","locations":[{"ref":"client/src/helpers.rs:22-40","code":"   22 | fn cgroup_v2_is_snap(cgroups: &str) -> bool {\n   23 |     cgroups\n   24 |         .lines()\n   25 |         .map(|line| {\n   26 |             let (n, rest) = line.split_once(':')?;\n   27 |             // Check that n is a number.\n   28 |             n.parse::<u32>().ok()?;\n   29 |             let unit = match rest.split_once(':') {\n   30 |                 Some((\"\", unit)) => Some(unit),\n   31 |                 Some((\"freezer\", unit)) => Some(unit),\n   32 |                 Some((\"name=systemd\", unit)) => Some(unit),\n   33 |                 _ => None,\n   34 |             }?;\n   35 |             let scope = std::path::Path::new(unit).file_name()?.to_str()?;\n   36 | \n   37 |             Some(scope.starts_with(\"snap.\"))\n   38 |         })\n   39 |         .any(|x| x.unwrap_or(false))\n   40 | }","lines":19,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/helpers.rs#L22-L40"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`Uri`'s documentation contradicts the code. `Uri::parse` says it does \"only two validations: - Ensuring it is not an\nempty string - That it contains the schema part by checking for `://`\", and `ParseError::MissingScheme` says\n\"The URI is missing a scheme (must contain `://`)\". The implementation performs *three* checks and never looks for\n`://` - it checks `!s.contains(\":\") | s.starts_with(':')`. So `mailto:foo@bar` (no `//`) is accepted although the docs\nsay it is rejected, and the struct-level docs (lines 12-13) state the real rule, contradicting the method docs.","fix":"Reword to match the code:\n\n```rust\n/// Parses the URI, doing only minimal validation:\n///\n/// - Ensuring it is not an empty string\n/// - Ensuring it contains a `:`\n/// - Ensuring it does not start with `:`\n```\n\nand change `MissingScheme`'s doc to \"The URI is missing a scheme (must contain `:` and not start with it)\".","locations":[{"ref":"client/src/uri.rs:19-25","code":"   19 |     /// Parses the URI, doing only two validations:\n   20 |     ///\n   21 |     /// - Ensuring it is not an empty string\n   22 |     /// - That it contains the schema part by checking for `://`\n   23 |     pub fn parse(uri: &str) -> Result<Self, ParseError> {\n   24 |         Self::from_str(uri)\n   25 |     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/uri.rs#L19-L25"},{"ref":"client/src/uri.rs:77-79","code":"   77 |     Empty,\n   78 |     /// The URI is missing a scheme (must contain `://`).\n   79 |     MissingScheme,","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/uri.rs#L77-L79"}]},
{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`set_parent_of`'s doc claims \"Returns `true` on success\", but the X11 arm ends with a hard-coded `true` inside the\n`unsafe` block: neither `XSetTransientForHint` nor `XChangeProperty` results are inspected (both return `c_int` status\ncodes), so `true` is returned even when the X server rejected the requests. The Wayland arm, in contrast, propagates\n`toplevel.set_transient_for_exported(handle)`. The return value is therefore not a reliable success indicator on X11.","fix":"Either check the Xlib return codes and return `false` on failure, or change the doc to state that on X11 the requests\nare fire-and-forget and `true` only means \"the request was submitted\".","locations":[{"ref":"client/src/window_identifier/mod.rs:386","code":"  386 |     /// Returns `true` on success.","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L386"},{"ref":"client/src/window_identifier/mod.rs:447-458","code":"  447 |                     (xlib_handle.XChangeProperty)(\n  448 |                         xdisplay,\n  449 |                         surface.xid(),\n  450 |                         net_wm_window_type_atom,\n  451 |                         xlib::XA_ATOM,\n  452 |                         32,\n  453 |                         xlib::PropModeReplace,\n  454 |                         data,\n  455 |                         1,\n  456 |                     );\n  457 |                     true\n  458 |                 }","lines":12,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L447-L458"}]},
{"id":"CMT_20","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The safety comment of `from_wayland_raw_with_serial` says \"Both surface, display, and seat pointers\nhave to be valid\" - \"Both\" for three pointers, and it contradicts the implementation, which\nexplicitly supports a null `seat_ptr` (falling back to not setting the serial at all).","fix":"Reword to: \"The surface and display pointers have to be valid. `seat_ptr` may be null, in which case\nthe serial is ignored.\" - and consider documenting that a null `seat_ptr` silently drops `serial`.","locations":[{"ref":"client/src/activation_token/wayland.rs:106-119","code":"  106 |     ///\n  107 |     /// # Safety\n  108 |     ///\n  109 |     /// Both surface, display, and seat pointers have to be valid.\n  110 |     pub async unsafe fn from_wayland_raw_with_serial(\n  111 |         app_id: Option<AppID>,\n  112 |         surface_ptr: *mut std::ffi::c_void,\n  113 |         display_ptr: *mut std::ffi::c_void,\n  114 |         serial: u32,\n  115 |         seat_ptr: *mut std::ffi::c_void,\n  116 |     ) -> Option<Self> {\n  117 |         if surface_ptr.is_null() || display_ptr.is_null() {\n  118 |             return None;\n  119 |         }","lines":14,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/activation_token/wayland.rs#L106-L119"}]},
{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `email` module example throws away the result of `send()` with a bare `;` (`.send().await;`),\nso it demonstrates ignoring both the transport error and the portal `Request`. Every other portal\nexample in the crate ends with `.await?.response()?`. It is also inconsistent with the surrounding\n`async fn run() -> ashpd::Result<()>` signature, which exists precisely to propagate the error.","fix":"End the example with `.send().await?;` (optionally `.response()?;`) instead of `.send().await;`.","locations":[{"ref":"client/src/desktop/email.rs:15-23","code":"   15 | //!     let file = File::open(\"/home/bilelmoussaoui/Downloads/adwaita-night.jpg\").unwrap();\n   16 | //!     EmailRequest::default()\n   17 | //!         .address(\"test@gmail.com\")\n   18 | //!         .subject(\"email subject\")\n   19 | //!         .body(\"the pre-filled email body\")\n   20 | //!         .attach(OwnedFd::from(file))\n   21 | //!         .send()\n   22 | //!         .await;\n   23 | //!     Ok(())","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/email.rs#L15-L23"}]},
{"id":"CMT_22","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Grammar slip in `LocationProxy::start`'s public documentation: `An application can only attempt\nstart a session once.` is missing `to`.","fix":"```rust\n// before\n    /// An application can only attempt start a session once.\n\n// after\n    /// An application can only attempt to start a session once.\n```","locations":[{"ref":"client/src/desktop/location.rs:289-290","code":"  289 |     /// Start the location session.\n  290 |     /// An application can only attempt start a session once.","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/location.rs#L289-L290"}]},
{"id":"CMT_23","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typos in `NetworkMonitor`'s public documentation:\n\n- `The method requires the 3nd version implementation` - should be `3rd` (two occurrences, on\n  `can_reach` and `status`).\n- `whether the system as a default route` - should be `has a default route`.\n- `whether the system as traffic flowing through the default connection` - should be\n  `has traffic flowing`.","fix":"Replace `3nd` with `3rd` in both `# Required version` paragraphs and `the system as` with\n`the system has` in the `is_available` and `is_metered` doc comments.","locations":[{"ref":"client/src/desktop/network_monitor.rs:127-131","code":"  127 |     /// # Required version\n  128 |     ///\n  129 |     /// The method requires the 3nd version implementation of the portal and\n  130 |     /// would fail with [`Error::RequiresVersion`] otherwise.\n  131 |     ///","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/network_monitor.rs#L127-L131"},{"ref":"client/src/desktop/network_monitor.rs:142-144","code":"  142 |     /// Returns whether the network is considered available.\n  143 |     /// That is, whether the system as a default route for at least one of IPv4\n  144 |     /// or IPv6.","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/network_monitor.rs#L142-L144"},{"ref":"client/src/desktop/network_monitor.rs:176-179","code":"  176 |     /// Returns whether the network is considered metered.\n  177 |     /// That is, whether the system as traffic flowing through the default\n  178 |     /// connection that is subject to limitations by service providers.\n  179 |     ///","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/network_monitor.rs#L176-L179"},{"ref":"client/src/desktop/network_monitor.rs:196-200","code":"  196 |     /// # Required version\n  197 |     ///\n  198 |     /// The method requires the 3nd version implementation of the portal and\n  199 |     /// would fail with [`Error::RequiresVersion`] otherwise.\n  200 |     ///","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/network_monitor.rs#L196-L200"}]},
{"id":"CMT_24","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `NotificationProxy` type-level documentation misspells the interface name as\n`#org.freedeskop.portal.Notification::ActionInvoked` (missing the `t` in `freedesktop`). It also\nuses a GTK-Doc style `#`/`::` cross-reference that renders as literal text in rustdoc instead of\nlinking to `NotificationProxy::receive_action_invoked`. A leftover indentation on the following\nline makes rustdoc render it as a code block.","fix":"```rust\n// before\n/// Other actions are activated by sending the\n///  `#org.freedeskop.portal.Notification::ActionInvoked` signal to the\n/// application.\n\n// after\n/// Other actions are activated by sending the `ActionInvoked` signal to the\n/// application, see [`NotificationProxy::receive_action_invoked`].\n```","locations":[{"ref":"client/src/desktop/notification.rs:569-575","code":"  569 | /// Notifications can specify actions that can be activated by the user.\n  570 | /// Actions whose name starts with 'app.' are assumed to be exported and will be\n  571 | /// activated via the ActivateAction() method in the org.freedesktop.Application\n  572 | /// interface. Other actions are activated by sending the\n  573 | ///  `#org.freedeskop.portal.Notification::ActionInvoked` signal to the\n  574 | /// application.\n  575 | ///","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L569-L575"}]},

{"id":"CMT_26","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `# Returns` doc of `ProxyResolver::lookup` describes the format as\n`protocol://[user[:password]host:port` - the bracket is never closed and the `@` separating credentials\nfrom the host is missing, so the documented grammar is nonsense.","fix":"Change the line to\n`/// A list of proxy uris of the form \\`protocol://[user[:password]@]host:port\\``.","locations":[{"ref":"client/src/desktop/proxy_resolver.rs:54","code":"   54 |     /// A list of proxy uris of the form `protocol://[user[:password]host:port`","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/proxy_resolver.rs#L54"}]},

{"id":"CMT_33","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `documents` module example binds `host_path` in the `for` loop and never uses it, which emits\nan `unused_variables` warning when the doctest is compiled and suggests to readers that the\nvariable is needed.","fix":"Change\n```rust\nfor (doc_id, host_path) in proxy.list(Some(&app_id)).await? {\n```\nto\n```rust\nfor (doc_id, _host_path) in proxy.list(Some(&app_id)).await? {\n```","locations":[{"ref":"client/src/documents/mod.rs:16-21","code":"   16 | //!     for (doc_id, host_path) in proxy.list(Some(&app_id)).await? {\n   17 | //!         if doc_id == \"f2ee988d\".into() {\n   18 | //!             let info = proxy.info(doc_id).await?;\n   19 | //!             println!(\"{:#?}\", info);\n   20 | //!         }\n   21 | //!     }","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/mod.rs#L16-L21"}]},
{"id":"CMT_34","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typo in the `add_named_full` rustdoc: `the 3nd version implementation` should be `the 3rd\nversion`. The neighbouring `add_full` doc correctly says `2nd`.","fix":"Replace `The method requires the 3nd version implementation` with\n`The method requires the 3rd version implementation`.","locations":[{"ref":"client/src/documents/mod.rs:297-300","code":"  297 |     /// # Required version\n  298 |     ///\n  299 |     /// The method requires the 3nd version implementation of the portal and\n  300 |     /// would fail with [`Error::RequiresVersion`] otherwise.","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/mod.rs#L297-L300"}]},
{"id":"CMT_35","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The \"Other Toolkits\" doc example does not match the real signature of `from_raw_handle`, which is\n`async fn from_raw_handle(window_handle: &RawWindowHandle, display_handle: Option<&RawDisplayHandle>) -> Option<Self>`.\nThe example passes `handle` by value, omits `.await`, and uses `XlibHandle::empty()`, a constructor that no longer\nexists in `raw-window-handle` 0.6 (the crate now has `XlibWindowHandle::new(..)`). Because the block is\n```rust, ignore``` it is never compiled, so it silently rotted.","fix":"Update the snippet to something like\n\n```rust\nlet handle = RawWindowHandle::Xlib(XlibWindowHandle::new(xid));\nlet identifier = WindowIdentifier::from_raw_handle(&handle, None).await;\n```","locations":[{"ref":"client/src/window_identifier/mod.rs:80-90","code":"   80 | /// ## Other Toolkits\n   81 | ///\n   82 | /// If you have access to `RawWindowHandle` you can convert it to a\n   83 | /// [`WindowIdentifier`] with\n   84 | ///\n   85 | /// ```rust, ignore\n   86 | /// let handle = RawWindowHandle::Xlib(XlibHandle::empty());\n   87 | /// let identifier = WindowIdentifier::from_raw_handle(handle, None);\n   88 | ///\n   89 | /// /// Open some portals\n   90 | /// ```","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L80-L90"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"The object path `\"/org/freedesktop/portal/desktop\"` is hardcoded 15 times in\n`build_with_connection`, while `crate::proxy::DESKTOP_PATH` (the same string) is what\n`LockdownInterface`'s setters and `BackgroundInterface::changed()` use to look the interfaces back\nup. If one side is ever changed the property-change signals and `changed()` silently start failing\nat runtime with `InterfaceNotFound`.","fix":"Replace every `.at(\"/org/freedesktop/portal/desktop\", portal)` with\n`.at(crate::proxy::DESKTOP_PATH, portal)`.","locations":[{"ref":"client/src/backend/builder.rs:253-255","code":"  253 |             object_server\n  254 |                 .at(\"/org/freedesktop/portal/desktop\", portal)\n  255 |                 .await?;","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/builder.rs#L253-L255"},{"ref":"client/src/backend/builder.rs:334-336","code":"  334 |             object_server\n  335 |                 .at(\"/org/freedesktop/portal/desktop\", portal)\n  336 |                 .await?;","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/builder.rs#L334-L336"}]},

{"id":"DUP_14","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`ashpd::FilePath` is a from-scratch reimplementation of `zvariant::FilePath`, which is already in\nthe dependency tree (`zvariant-5.13.1/src/file_path.rs`). Both are `#[zvariant(signature = \"ay\")]`\nnewtypes over a nul-terminated `CStr`/`CString` with the same purpose (non-UTF-8-safe path\ntransport), the same doc rationale, and the same serialization strategy. The upstream type is\nstrictly richer: `Clone`, `Eq`, `Ord`, `to_string_lossy()`, borrowed `Cow<'f, CStr>` (no\nallocation for already-nul-terminated input), and conversions from `Path`/`PathBuf`/`OsStr`/\n`OsString`/`CStr`/`CString`/`&str`.","fix":"Drop `client/src/file_path.rs` and re-export the upstream type instead\n(`pub use zbus::zvariant::FilePath;`), or at minimum document in the module why a separate type\nexists (the only behavioural difference is that ashpd *rejects* interior nul bytes with\n`Error::NulTerminated` whereas zvariant truncates/appends).","locations":[{"ref":"client/src/file_path.rs:10-50","code":"   10 | /// A file name represented as a nul-terminated byte array.\n   11 | #[derive(Type, Debug, Default, PartialEq)]\n   12 | #[zvariant(signature = \"ay\")]\n   13 | pub struct FilePath(CString);\n   14 | \n   15 | impl AsRef<Path> for FilePath {\n   16 |     fn as_ref(&self) -> &Path {\n   17 |         OsStr::from_bytes(self.0.as_bytes()).as_ref()\n   18 |     }\n   19 | }\n   20 | \n   21 | impl FilePath {\n   22 |     pub(crate) fn new<T: AsRef<Path>>(s: T) -> Result<Self, crate::Error> {\n   23 |         let c_string = CString::new(s.as_ref().as_os_str().as_bytes())\n   24 |             .map_err(|err| crate::Error::NulTerminated(err.nul_position()))?;\n   25 | \n   26 |         Ok(Self(c_string))\n   27 |     }\n   28 | }\n   29 | \n   30 | impl Serialize for FilePath {\n   31 |     fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>\n   32 |     where\n   33 |         S: serde::Serializer,\n   34 |     {\n   35 |         serializer.serialize_bytes(self.0.as_bytes_with_nul())\n   36 |     }\n   37 | }\n   38 | \n   39 | impl<'de> Deserialize<'de> for FilePath {\n   40 |     fn deserialize<D>(deserializer: D) -> Result<Self, D::Error>\n   41 |     where\n   42 |         D: serde::Deserializer<'de>,\n   43 |     {\n   44 |         let bytes = <Vec<u8>>::deserialize(deserializer)?;\n   45 |         let c_string = CString::from_vec_with_nul(bytes)\n   46 |             .map_err(|_| serde::de::Error::custom(\"Bytes are not nul-terminated\"))?;\n   47 | \n   48 |         Ok(Self(c_string))\n   49 |     }\n   50 | }","lines":41,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/file_path.rs#L10-L50"}]},
