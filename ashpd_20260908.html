{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`new_wayland_inner` spawns a fresh OS thread for every activation-token request and the thread does\ntwo blocking `event_queue.roundtrip()` calls with no timeout. If the compositor never answers (no\n`xdg_activation_v1` global, or a stalled compositor), the thread blocks forever, the oneshot\n`receiver.await` never resolves, and the caller's future hangs - one leaked thread per call. A\nGTK/wayland client calling this per window activation pays a full thread spawn plus an extra event\nqueue each time.","fix":"Drive the Wayland queue asynchronously instead of on a thread (`wayland_client` supports\n`read_events`/`dispatch_pending` on a non-blocking fd registered with the async runtime), or at\nminimum bail out early when the registry roundtrip did not produce an `xdg_activation_v1` global and\nadd a deadline around the second `roundtrip`.","locations":[{"ref":"client/src/activation_token/wayland.rs:149-173","code":"  149 |     async fn new_wayland_inner(\n  150 |         app_id: Option<AppID>,\n  151 |         conn: wayland_client::Connection,\n  152 |         surface: &WlSurface,\n  153 |         serial: Option<u32>,\n  154 |         seat: Option<&WlSeat>,\n  155 |     ) -> Option<Self> {\n  156 |         let (sender, receiver) = futures_channel::oneshot::channel::<Option<Self>>();\n  157 | \n  158 |         // Cheap clone, protocol objects are essentially smart pointers\n  159 |         let surface = surface.clone();\n  160 |         let seat = seat.cloned();\n  161 |         std::thread::spawn(move || {\n  162 |             match wayland_export_token(app_id, conn, &surface, serial, seat.as_ref()) {\n  163 |                 Ok(window_handle) => sender.send(Some(window_handle)).unwrap(),\n  164 |                 Err(_err) => {\n  165 |                     #[cfg(feature = \"tracing\")]\n  166 |                     tracing::info!(\"Could not get wayland window identifier: {_err}\");\n  167 |                     sender.send(None).unwrap();\n  168 |                 }\n  169 |             }\n  170 |         });\n  171 | \n  172 |         receiver.await.unwrap()\n  173 |     }","lines":25,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/activation_token/wayland.rs#L149-L173"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The Wayland handle callback in `Gtk4WindowIdentifier::new` wraps a `futures_channel::oneshot::Sender` in\n`Arc<futures_util::lock::Mutex<Option<..>>>` and then `glib::spawn_future_local`s a task whose only job is to lock the\nmutex and call the non-blocking `Sender::send`. Nothing here needs an async mutex or a spawned future - `send` consumes\nthe sender and never blocks. The construction has a real cost: `glib::spawn_future_local` requires a *running* glib\nmain context on the calling thread, so if `from_native` is awaited on a plain executor (e.g. a `tokio` worker) the\nspawned future is never polled and `receiver.await` hangs forever instead of returning `None`.","fix":"Send directly from the `export_handle` callback using a `std::cell::Cell<Option<Sender<..>>>` (or\n`std::sync::Mutex`), e.g.:\n\n```rust\nlet sender = std::cell::Cell::new(Some(sender));\nlet result = top_level.export_handle(move |_, handle| {\n    if let Some(s) = sender.take() {\n        let _ = s.send(handle.map(|h| h.to_string()).ok());\n    }\n});\n```\n\nwhich removes the `Arc`, the async `Mutex` and the `spawn_future_local` dependency on a running main loop.","locations":[{"ref":"client/src/window_identifier/gtk4.rs:45-70","code":"   45 |                         let (sender, receiver) =\n   46 |                             futures_channel::oneshot::channel::<Option<String>>();\n   47 |                         let sender = Arc::new(Mutex::new(Some(sender)));\n   48 | \n   49 |                         let result = top_level.export_handle(glib::clone!(#[strong] sender, move |_, handle| {\n   50 |                             let handle = handle.map(ToOwned::to_owned);\n   51 |                             glib::spawn_future_local(glib::clone!(#[strong] sender, #[strong] handle, async move {\n   52 |                                 if let Some(m) = sender.lock().await.take() {\n   53 |                                     match handle {\n   54 |                                         Ok(h) => {\n   55 |                                             let _ = m.send(Some(h.to_string()));\n   56 |                                         },\n   57 |                                         Err(_err) => {\n   58 |                                             let _ = m.send(None);\n   59 |                                             #[cfg(feature = \"tracing\")]\n   60 |                                             tracing::warn!(\"Failed to export window identifier. The compositor doesn't support xdg-foreign protocol. {_err}\");\n   61 |                                         }\n   62 |                                     }\n   63 |                                 }\n   64 |                             }));\n   65 |                         }));\n   66 | \n   67 |                         if !result {\n   68 |                             return None;\n   69 |                         }\n   70 |                         let handle = receiver.await.ok().flatten();","lines":26,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L45-L70"}]},

{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"easy","description":"`lib.rs` interleaves `mod`, `pub use`, `static` and `use` declarations in essentially random\norder: `static IS_SANDBOXED: OnceLock<bool>` is declared at line 17 while the `use\nstd::sync::OnceLock;` it needs sits at line 58, buried between a `pub mod flatpak;` and\n`mod helpers;`. There are five separate `pub use self::..` blocks scattered between module\ndeclarations. This makes it hard to see what the crate root actually exports and which items are\nfeature-gated.","fix":"Reorder the crate root into the conventional grouping: inner attributes, then all `use`\nstatements, then `mod`/`pub mod` declarations, then `pub use` re-exports, then the crate-level\nitems (`Result`, `Pid`, `IS_SANDBOXED`, `is_sandboxed`, `sealed`).","locations":[{"ref":"client/src/lib.rs:14-64","code":"   14 | /// Alias for a [`Result`] with the error type `ashpd::Error`.\n   15 | pub type Result<T> = std::result::Result<T, Error>;\n   16 | \n   17 | static IS_SANDBOXED: OnceLock<bool> = OnceLock::new();\n   18 | \n   19 | mod activation_token;\n   20 | /// Interact with the user's desktop such as taking a screenshot, setting a\n   21 | /// background or querying the user's location.\n   22 | pub mod desktop;\n   23 | /// Interact with the documents store or transfer files across apps.\n   24 | #[cfg(feature = \"documents\")]\n   25 | #[cfg_attr(docsrs, doc(cfg(feature = \"documents\")))]\n   26 | pub mod documents;\n   27 | mod error;\n   28 | mod window_identifier;\n   29 | \n   30 | pub use self::{activation_token::ActivationToken, window_identifier::WindowIdentifier};\n   31 | mod app_id;\n   32 | mod registry;\n   33 | mod uri;\n   34 | #[cfg(feature = \"backend\")]\n   35 | pub use self::app_id::MaybeAppID;\n   36 | pub use self::{\n   37 |     app_id::AppID,\n   38 |     registry::{register_host_app, register_host_app_with_connection},\n   39 |     uri::Uri,\n   40 | };\n   41 | mod file_path;\n   42 | pub use self::file_path::FilePath;\n   43 | \n   44 | mod proxy;\n   45 | \n   46 | pub use self::window_identifier::WindowIdentifierType;\n   47 | #[cfg(feature = \"backend\")]\n   48 | #[cfg_attr(docsrs, doc(cfg(feature = \"backend\")))]\n   49 | #[allow(missing_docs)]\n   50 | /// Build your custom portals backend.\n   51 | pub mod backend;\n   52 | /// Spawn commands outside the sandbox or monitor if the running application has\n   53 | /// received an update & install it.\n   54 | #[cfg(feature = \"flatpak\")]\n   55 | #[cfg_attr(docsrs, doc(cfg(feature = \"flatpak\")))]\n   56 | pub mod flatpak;\n   57 | mod helpers;\n   58 | use std::sync::OnceLock;\n   59 | \n   60 | #[cfg(feature = \"backend\")]\n   61 | #[cfg_attr(docsrs, doc(cfg(feature = \"backend\")))]\n   62 | pub use async_trait;\n   63 | pub use enumflags2;\n   64 | pub use zbus::{self, zvariant};","lines":51,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/lib.rs#L14-L64"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"hard","description":"`unsafe impl Send for WindowIdentifier {}` / `unsafe impl Sync for WindowIdentifier {}` are unsound. The\n`WindowIdentifier::Gtk4` variant holds a `Gtk4WindowIdentifier`, whose `native: gtk4::Native` field is a GObject\nwrapper that is deliberately `!Send + !Sync`. `Gtk4WindowIdentifier::drop`\n(`client/src/window_identifier/gtk4.rs:167-195`) calls `self.native.surface()`, `downcast_ref::<WaylandToplevel>()`,\n`top_level.data()/steal_data()` and `top_level.unexport_handle()`. With these blanket `unsafe impl`s a\n`WindowIdentifier` can legally be moved to any thread (e.g. `tokio::spawn`) and dropped there, running GDK/GTK code and\nmutating the toplevel's unsynchronised qdata refcount off the GTK main thread. That is a data race / UB, not merely a\nGTK \"thread affinity\" warning. `as_raw_window_handle`/`as_raw_display_handle` have the same problem through `&self`\nacross threads (`Sync`).","fix":"Remove the blanket `unsafe impl Send`/`unsafe impl Sync` for `WindowIdentifier`. If `Send` is required by callers,\neither (a) do not store `gtk4::Native` in `Gtk4WindowIdentifier` - capture only the exported handle string plus a\n`glib::MainContext`/`glib::WeakRef` and perform the unexport by dispatching a closure to the main context in `Drop`, or\n(b) keep `WindowIdentifier` `!Send` and expose a separate owned `WindowIdentifierType` (which is plain data and\nnaturally `Send`) for cross-thread use.","locations":[{"ref":"client/src/window_identifier/mod.rs:122-123","code":"  122 | unsafe impl Send for WindowIdentifier {}\n  123 | unsafe impl Sync for WindowIdentifier {}","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L122-L123"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"very_easy","description":"The two `Realtime` methods are named `max_thread_realtime_with_pid` and\n`max_thread_high_priority_with_pid`, but they wrap `MakeThreadRealtimeWithPID` and\n`MakeThreadHighPriorityWithPID`. `max` is a typo for `make`; the names read as getters for a maximum\nvalue, which is especially confusing next to the real getter `max_realtime_priority`. These are public\nAPI names, so fixing them is a (small) breaking change that gets more expensive over time.","fix":"Rename to `make_thread_realtime_with_pid` and `make_thread_high_priority_with_pid`, keeping the old names\nas `#[deprecated]` forwarding wrappers for one release.","locations":[{"ref":"client/src/desktop/realtime.rs:36","code":"   36 |     pub async fn max_thread_realtime_with_pid(","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/realtime.rs#L36"},{"ref":"client/src/desktop/realtime.rs:52","code":"   52 |     pub async fn max_thread_high_priority_with_pid(","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/realtime.rs#L52"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"The per-application master secret is handled in plain, non-zeroized memory. `secret::retrieve()` reads it\ninto a `Vec<u8>` created with `Vec::with_capacity(64)`; `read_to_end` grows that buffer as soon as the\n64 bytes are consumed (it always needs one extra read to observe EOF), so the reallocation leaves a full\ncopy of the secret in freed heap memory that is never wiped, and the returned `Vec<u8>` is not wiped on\ndrop either. The workspace already depends on `zeroize` (`Cargo.toml:33`, currently unused by any member).","fix":"Return a wiping container and avoid reallocation, e.g. depend on `zeroize` in `client/Cargo.toml` and use\n`zeroize::Zeroizing<Vec<u8>>`, pre-reserving enough capacity (or reading into a fixed-size buffer with\n`read` in a loop and `zeroize()`-ing every temporary). At minimum document that the caller must wipe the\nreturned buffer.","locations":[{"ref":"client/src/desktop/secret.rs:112-137","code":"  112 | pub async fn retrieve() -> Result<Vec<u8>, Error> {\n  113 |     let proxy = Secret::new().await?;\n  114 | \n  115 |     let (mut x1, x2) = UnixStream::pair()?;\n  116 |     proxy.retrieve(&x2, Default::default()).await?;\n  117 |     drop(x2);\n  118 | \n  119 |     // Read the secret on a blocking thread since it's a small amount of data\n  120 |     #[cfg(feature = \"tokio\")]\n  121 |     let buf = tokio::task::spawn_blocking(move || {\n  122 |         let mut buf = Vec::with_capacity(64);\n  123 |         x1.read_to_end(&mut buf)?;\n  124 |         Ok::<_, std::io::Error>(buf)\n  125 |     })\n  126 |     .await\n  127 |     .map_err(|e| Error::from(std::io::Error::other(e)))??;\n  128 | \n  129 |     #[cfg(not(feature = \"tokio\"))]\n  130 |     let buf = {\n  131 |         let mut buf = Vec::with_capacity(64);\n  132 |         x1.read_to_end(&mut buf)?;\n  133 |         buf\n  134 |     };\n  135 | \n  136 |     Ok(buf)\n  137 | }","lines":26,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/secret.rs#L112-L137"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"All 57 generated files under `interfaces/` are not well-formed XML, so the script's own output cannot be re-parsed by\nthe script (nor by `zbus-xmlgen` or any other consumer). `format_xml_content` returns the `xmllint --format` output,\nwhich begins with `<?xml version=\"1.0\"?>`, and then `final_output = f\"{XML_HEADER}\\n{formatted_xml}\"` prepends the\nDOCTYPE, putting the XML declaration on line 3. Verified:\n\n```\n$ python3 -c \"import glob,xml.etree.ElementTree as ET; [ET.parse(f) for f in glob.glob('interfaces/**/*.xml', recursive=True)]\"\nxml.etree.ElementTree.ParseError: XML or text declaration not at start of entity: line 3, column 0\n```\n\n57/57 files fail to parse. Ironically the failure only occurs on the success path: when `xmllint` is missing,\n`format_xml_content` returns the unformatted string that has no declaration.","fix":"Strip the declaration that `xmllint` emits before prepending the DOCTYPE, so the DOCTYPE is the first thing in the\nfile (a bare DOCTYPE with no XML declaration is well-formed):\n\n```python\nformatted_xml = format_xml_content(unformatted_xml)\nif formatted_xml.startswith(\"<?xml\"):\n    formatted_xml = formatted_xml.split(\"\\n\", 1)[1]\nfinal_output = f\"{XML_HEADER}\\n{formatted_xml}\"\n```\n\nAlternatively move `<?xml version=\"1.0\"?>` to the top of `XML_HEADER` and keep stripping it from the `xmllint` output.\nEither way, add a post-generation check that every produced file parses with `ET.parse`.","locations":[{"ref":"update-interfaces.py:17-18","code":"   17 | XML_HEADER = \"\"\"<!DOCTYPE node PUBLIC \"-//freedesktop//DTD D-BUS Object Introspection 1.0//EN\"\n   18 |                     \"http://www.freedesktop.org/standards/dbus/1.0/introspect.dtd\">\"\"\"","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L17-L18"},{"ref":"update-interfaces.py:95-99","code":"   95 |             formatted_xml = format_xml_content(unformatted_xml)\n   96 |             final_output = f\"{XML_HEADER}\\n{formatted_xml}\"\n   97 | \n   98 |             with open(output_file, \"w\") as f:\n   99 |                 f.write(final_output)","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L95-L99"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The crate sets `#![deny(missing_docs)]`, but every public item of the `Realtime` portal is annotated with\n`#[allow(missing_docs)]` instead of being documented. The five public methods therefore have no\ndescription of their parameters (`thread` is a *thread id*, not an index; `priority` semantics differ\nbetween the realtime and the nice-level call), no `# Specifications` links and no note that the portal is\na thin wrapper over RealtimeKit - unlike every other portal module in `desktop/`.","fix":"Remove the five `#[allow(missing_docs)]` attributes and write real doc comments, following the pattern of\ne.g. `print.rs` (`# Arguments` + `# Specifications` with a link to\n`doc-org.freedesktop.portal.Realtime.html`).","locations":[{"ref":"client/src/desktop/realtime.rs:34-82","code":"   34 |     #[doc(alias = \"MakeThreadRealtimeWithPID\")]\n   35 |     #[allow(missing_docs)]\n   36 |     pub async fn max_thread_realtime_with_pid(\n   37 |         &self,\n   38 |         process: Pid,\n   39 |         thread: u64,\n   40 |         priority: u32,\n   41 |     ) -> Result<(), Error> {\n   42 |         self.0\n   43 |             .call(\n   44 |                 \"MakeThreadRealtimeWithPID\",\n   45 |                 &(process as u64, thread, priority),\n   46 |             )\n   47 |             .await\n   48 |     }\n   49 | \n   50 |     #[doc(alias = \"MakeThreadHighPriorityWithPID\")]\n   51 |     #[allow(missing_docs)]\n   52 |     pub async fn max_thread_high_priority_with_pid(\n   53 |         &self,\n   54 |         process: Pid,\n   55 |         thread: u64,\n   56 |         priority: i32,\n   57 |     ) -> Result<(), Error> {\n   58 |         self.0\n   59 |             .call(\n   60 |                 \"MakeThreadHighPriorityWithPID\",\n   61 |                 &(process as u64, thread, priority),\n   62 |             )\n   63 |             .await\n   64 |     }\n   65 | \n   66 |     #[doc(alias = \"MaxRealtimePriority\")]\n   67 |     #[allow(missing_docs)]\n   68 |     pub async fn max_realtime_priority(&self) -> Result<i64, Error> {\n   69 |         self.0.property(\"MaxRealtimePriority\").await\n   70 |     }\n   71 | \n   72 |     #[doc(alias = \"MinNiceLevel\")]\n   73 |     #[allow(missing_docs)]\n   74 |     pub async fn min_nice_level(&self) -> Result<u32, Error> {\n   75 |         self.0.property(\"MinNiceLevel\").await\n   76 |     }\n   77 | \n   78 |     #[doc(alias = \"RTTimeUSecMax\")]\n   79 |     #[allow(missing_docs)]\n   80 |     pub async fn rt_time_usec_max(&self) -> Result<u32, Error> {\n   81 |         self.0.property(\"RTTimeUSecMax\").await\n   82 |     }","lines":49,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/realtime.rs#L34-L82"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`Streams::persist_mode()` and `Streams::restore_data()` are gated behind `#[cfg(feature = \"backend\")]`,\neven though `persist_mode` and `restore_data` are part of the *client-facing* `Start` response of\n`org.freedesktop.portal.ScreenCast` (the struct deserializes them unconditionally, and the fields are\nonly marked `allow(dead_code)` for non-backend builds). A plain client that wants to know which persist\nmode the portal actually granted cannot read it without enabling the backend feature.","fix":"Drop the `#[cfg(feature = \"backend\")]` on `Streams::persist_mode()` (and, if the type is useful to\nclients, on `restore_data()`), then remove the now-unnecessary `cfg_attr(..., allow(dead_code))` on the\ncorresponding fields.","locations":[{"ref":"client/src/desktop/screencast.rs:231-241","code":"  231 |     /// The session's persist mode.\n  232 |     #[cfg(feature = \"backend\")]\n  233 |     pub fn persist_mode(&self) -> Option<PersistMode> {\n  234 |         self.persist_mode\n  235 |     }\n  236 | \n  237 |     /// The session restore data.\n  238 |     #[cfg(feature = \"backend\")]\n  239 |     pub fn restore_data(&self) -> Option<&(String, u32, OwnedValue)> {\n  240 |         self.restore_data.as_ref()\n  241 |     }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/screencast.rs#L231-L241"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`UsbProxy` is the only portal type in this module that lacks the `impl std::ops::Deref for X { type\nTarget = zbus::Proxy<'static>; }` escape hatch that `Screencast`, `ScreenshotProxy`, `Secret`, `Settings`\nand `TrashProxy` all provide, so users of the USB portal have no way to reach the underlying\n`zbus::Proxy` (for custom calls, `inner().destination()`, etc.).","fix":"Add the same impl as the neighbouring modules:\n```rust\nimpl std::ops::Deref for UsbProxy {\n    type Target = zbus::Proxy<'static>;\n\n    fn deref(&self) -> &Self::Target {\n        &self.0\n    }\n}\n```","locations":[{"ref":"client/src/desktop/usb.rs:463-466","code":"  463 | }\n  464 | \n  465 | impl crate::Sealed for UsbProxy {}\n  466 | impl SessionPortal for UsbProxy {}","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/usb.rs#L463-L466"}]},
{"id":"OTHER_8","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`Documents::host_paths` calls the `GetHostPaths` member (gated on interface version 5), but\n`interfaces/org.freedesktop.portal.Documents.xml` does not declare it, so the vendored\nintrospection XML that the test suite validates against is stale. Nothing in the repository pins\nthe argument count/signature of this call, and the `all_interfaces_have_implementations` test\nsilently passes because it only walks XML -> Rust.","fix":"Add the method to `interfaces/org.freedesktop.portal.Documents.xml`:\n```xml\n<method name=\"GetHostPaths\">\n  <arg type=\"as\" name=\"doc_ids\" direction=\"in\"/>\n  <arg type=\"a{say}\" name=\"paths\" direction=\"out\"/>\n<\/method>\n```","locations":[{"ref":"client/src/documents/mod.rs:505-514","code":"  505 |     /// # Specifications\n  506 |     ///\n  507 |     /// See also [`GetHostPaths`](https://flatpak.github.io/xdg-desktop-portal/docs/doc-org.freedesktop.portal.Documents.html#org-freedesktop-portal-documents-gethostpaths).\n  508 |     #[doc(alias = \"GetHostPaths\")]\n  509 |     pub async fn host_paths(\n  510 |         &self,\n  511 |         doc_ids: &[DocumentID],\n  512 |     ) -> Result<HashMap<DocumentID, FilePath>, Error> {\n  513 |         self.0.call_versioned(\"GetHostPaths\", &(doc_ids,), 5).await\n  514 |     }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/mod.rs#L505-L514"}]},
{"id":"OTHER_9","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`Error::NulTerminated(usize)` is named as if it reported success (a nul-terminated value) while\nits own doc comment and its only construction site say the opposite: `FilePath::new` returns it\nwhen `CString::new` finds an *interior* nul byte at `nul_position()`\n(`client/src/file_path.rs:22-27`). The `Display` text (`Nul byte found in provided data at\nposition {u}`) is correct; only the variant name is inverted, which makes `match` arms read\nbackwards.","fix":"Rename the variant to something that matches the meaning, e.g.\n```rust\n/// An error indicating that an interior nul byte was found\nInteriorNul(usize),\n```\nkeeping `NulTerminated` as a deprecated alias if the public API must not break.","locations":[{"ref":"client/src/error.rs:56-57","code":"   56 |     /// An error indicating that an interior nul byte was found\n   57 |     NulTerminated(usize),","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/error.rs#L56-L57"}]},
{"id":"OTHER_10","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`FilePath` is a public value type returned by `Documents::mount_point`, `Documents::list`,\n`Documents::info` and `Documents::host_paths`, yet it derives only\n`Type, Debug, Default, PartialEq`. It is not `Clone`, not `Eq`, not `Hash`, has no `Display`, and\nexposes no way to reach the raw bytes. That means users cannot store it in a `HashSet`, cannot\nclone a returned path out of the map without going through `AsRef<Path>` + `to_path_buf()`, and\ncannot recover a non-UTF-8 path as bytes at all.","fix":"Extend the derive list and add accessors:\n```rust\n#[derive(Type, Debug, Default, Clone, PartialEq, Eq, Hash)]\n#[zvariant(signature = \"ay\")]\npub struct FilePath(CString);\n\nimpl FilePath {\n    pub fn as_bytes(&self) -> &[u8] { self.0.as_bytes() }\n}\n\nimpl std::fmt::Display for FilePath { /* to_string_lossy */ }\n```","locations":[{"ref":"client/src/file_path.rs:11-19","code":"   11 | #[derive(Type, Debug, Default, PartialEq)]\n   12 | #[zvariant(signature = \"ay\")]\n   13 | pub struct FilePath(CString);\n   14 | \n   15 | impl AsRef<Path> for FilePath {\n   16 |     fn as_ref(&self) -> &Path {\n   17 |         OsStr::from_bytes(self.0.as_bytes()).as_ref()\n   18 |     }\n   19 | }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/file_path.rs#L11-L19"}]},
{"id":"OTHER_11","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The crate defines `pub type Pid = u32;` (`client/src/lib.rs:91-94`) and uses it for the *input*\nof `Flatpak::spawn_signal` and `Development::host_command_signal`, but the functions that\n*produce* a pid return a bare `u32`, and the `SpawnStarted`/`SpawnExited`/`HostCommandExited`\nsignal streams yield `(u32, u32)`. The alias therefore documents nothing at the point where it\nmatters most, and the first element of the signal tuples is indistinguishable from the second\n(`relpid` / `exit_status`) in the type system.","fix":"Use the alias consistently: `-> Result<Pid, Error>` for `Flatpak::spawn` and\n`Development::host_command`, and `impl Stream<Item = (Pid, u32)>` for `receive_spawn_started`,\n`receive_spawn_exited` and the `HostCommandExited` stream.","locations":[{"ref":"client/src/flatpak/mod.rs:347-355","code":"  347 |     pub async fn spawn(\n  348 |         &self,\n  349 |         cwd_path: impl AsRef<Path>,\n  350 |         argv: &[impl AsRef<Path>],\n  351 |         fds: HashMap<u32, impl AsFd>,\n  352 |         envs: HashMap<&str, &str>,\n  353 |         flags: BitFlags<SpawnFlags>,\n  354 |         options: SpawnOptions,\n  355 |     ) -> Result<u32, Error> {","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/mod.rs#L347-L355"},{"ref":"client/src/flatpak/mod.rs:308-322","code":"  308 |     pub async fn receive_spawn_started(&self) -> Result<impl Stream<Item = (u32, u32)>, Error> {\n  309 |         self.0.signal(\"SpawnStarted\").await\n  310 |     }\n  311 | \n  312 |     /// Emitted when a process started by [`spawn()`][`Flatpak::spawn`]\n  313 |     /// exits.\n  314 |     ///\n  315 |     /// # Specifications\n  316 |     ///\n  317 |     /// See also [`SpawnExited`](https://docs.flatpak.org/en/latest/portal-api-reference.html#gdbus-signal-org-freedesktop-portal-Flatpak.SpawnExited).\n  318 |     #[doc(alias = \"SpawnExited\")]\n  319 |     #[doc(alias = \"XdpPortal::spawn-exited\")]\n  320 |     pub async fn receive_spawn_exited(&self) -> Result<impl Stream<Item = (u32, u32)>, Error> {\n  321 |         self.0.signal(\"SpawnExited\").await\n  322 |     }","lines":15,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/mod.rs#L308-L322"},{"ref":"client/src/flatpak/development.rs:84-91","code":"   84 |     pub async fn host_command(\n   85 |         &self,\n   86 |         cwd_path: impl AsRef<Path>,\n   87 |         argv: &[impl AsRef<Path>],\n   88 |         fds: HashMap<u32, impl AsFd>,\n   89 |         envs: HashMap<&str, &str>,\n   90 |         flags: BitFlags<HostCommandFlags>,\n   91 |     ) -> Result<u32, Error> {","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/development.rs#L84-L91"}]},
{"id":"OTHER_12","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The `all_interfaces_have_implementations` / `all_interfaces_have_backend_implementations` tests\nverify the doc aliases with a plain substring search over the whole file\n(`rust_content.contains(\"#[doc(alias = \\\"Name\\\")]\")`). The check therefore passes as long as the\nalias string appears *anywhere* in the file, regardless of which item it is attached to - or even\nif it is attached to the wrong method. It is exactly this blind spot that lets the mismatched\n`#[doc(alias = \"SpawnSignal\")]` in `flatpak/development.rs` survive. The test also only checks\nXML -> Rust, so a Rust wrapper calling a D-Bus member that does not exist in the XML (e.g.\n`GetHostPaths`) is never validated.","fix":"Parse the Rust sources (e.g. with `syn`) and assert that the alias is attached to a method of the\nexpected impl block, and add the reverse direction: collect every `self.0.call(\"X\", ..)` /\n`self.0.signal(\"X\", ..)` / `self.0.property(\"X\", ..)` literal per file and assert `X` exists in\nthe corresponding XML interface.","locations":[{"ref":"client/src/lib.rs:222-232","code":"  222 |                     // Assert that each name has a corresponding doc alias\n  223 |                     for name in &names_to_check {\n  224 |                         let alias_str = format!(\"#[doc(alias = \\\"{}\\\")]\", name);\n  225 |                         assert!(\n  226 |                             rust_content.contains(&alias_str),\n  227 |                             \"Missing doc alias '{}' for interface '{}' in file {}\",\n  228 |                             alias_str,\n  229 |                             interface_name,\n  230 |                             rust_path.display()\n  231 |                         );\n  232 |                     }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/lib.rs#L222-L232"}]},
{"id":"OTHER_13","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"All paths in the script are relative to the *current working directory*, not to the script location, and the very\nfirst thing `main()` does is `shutil.rmtree(PORTAL_OUTPUT_DIR)` where `PORTAL_OUTPUT_DIR = Path(\"interfaces\")`. Running\n`python3 /path/to/ashpd/update-interfaces.py` from any other directory recursively deletes an unrelated `interfaces/`\ndirectory in the cwd and then writes the regenerated files there, leaving the repository untouched and the user with\nsilent data loss.","fix":"Anchor the output paths to the script:\n\n```python\nREPO_ROOT = Path(__file__).resolve().parent\nPORTAL_OUTPUT_DIR = REPO_ROOT / \"interfaces\"\nIMPL_OUTPUT_DIR = PORTAL_OUTPUT_DIR / \"backend\"\n```","locations":[{"ref":"update-interfaces.py:12-14","code":"   12 | # --- Output Definitions ---\n   13 | PORTAL_OUTPUT_DIR = Path(\"interfaces\")\n   14 | IMPL_OUTPUT_DIR = Path(\"interfaces/backend\")","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L12-L14"},{"ref":"update-interfaces.py:107-113","code":"  107 | def main():\n  108 |     \"\"\"Main function to run the update process.\"\"\"\n  109 |     # Clean previous output directories to avoid stale files\n  110 |     if PORTAL_OUTPUT_DIR.exists():\n  111 |         shutil.rmtree(PORTAL_OUTPUT_DIR)\n  112 |     if IMPL_OUTPUT_DIR.exists():\n  113 |         shutil.rmtree(IMPL_OUTPUT_DIR)","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L107-L113"}]},
{"id":"OTHER_14","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`open(output_file, \"w\")` uses the platform's locale encoding. The content was explicitly decoded from UTF-8 in\n`format_xml_content`, and D-Bus introspection XML contains non-ASCII characters (author names, typographic characters\nin descriptions). Under a non-UTF-8 locale (`LC_ALL=C` is still the default in many CI images and containers) the write\nraises `UnicodeEncodeError` mid-run, leaving a truncated file behind, or silently mangles characters.","fix":"```python\n# before\nwith open(output_file, \"w\") as f:\n# after\nwith open(output_file, \"w\", encoding=\"utf-8\", newline=\"\\n\") as f:\n```","locations":[{"ref":"update-interfaces.py:98-99","code":"   98 |             with open(output_file, \"w\") as f:\n   99 |                 f.write(final_output)","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/update-interfaces.py#L98-L99"}]},
{"id":"OTHER_15","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`MaybeAppID` is the only ID newtype in this module that does not derive `Clone` (`AppID` and\n`DocumentID` both do), even though it is handed to backend implementations by value in trait methods\nsuch as `BackgroundImpl::notify_background` and is used as a `HashMap` key. Implementations that want\nto keep a copy must go through `to_string()` + reparse.","fix":"Add `Clone` to the derive list: `#[derive(Debug, Clone, Eq, Hash, PartialEq, Type)]`.","locations":[{"ref":"client/src/app_id.rs:95-97","code":"   95 | #[derive(Debug, Eq, Hash, PartialEq, Type)]\n   96 | #[zvariant(signature = \"s\")]\n   97 | pub struct MaybeAppID(Result<AppID, String>);","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/app_id.rs#L95-L97"}]},
{"id":"OTHER_16","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`ScreencastImpl::available_cursor_mode` is singular while the D-Bus property it backs is\n`AvailableCursorModes` and it returns a `BitFlags<CursorMode>` (a *set* of modes); the neighbouring\n`available_source_types` is correctly plural. The mismatch makes the public backend trait read as\nif only one mode can be reported.","fix":"Rename the trait method (and the interface getter) to `available_cursor_modes`, keeping the\n`#[doc(alias = \"AvailableCursorModes\")]`.","locations":[{"ref":"client/src/backend/screencast.rs:31-32","code":"   31 |     #[doc(alias = \"AvailableCursorModes\")]\n   32 |     fn available_cursor_mode(&self) -> BitFlags<CursorMode>;","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/screencast.rs#L31-L32"}]},
{"id":"OTHER_17","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`SettingsSignalEmitter` provides `emit_contrast_changed`, `emit_accent_color_changed` and\n`emit_color_scheme_changed` but no helper for the `reduced-motion` key, even though the crate\ndefines `REDUCED_MOTION_KEY`, `ReducedMotion`, `From<ReducedMotion> for OwnedValue` and the client\nside `Settings::reduced_motion()` / `receive_reduced_motion_changed()`. Backends have to fall back\nto the generic `emit_changed` for that one key, which is easy to get wrong.","fix":"Add `async fn emit_reduced_motion_changed(&self, motion: ReducedMotion) -> zbus::Result<()>` to\n`SettingsSignalEmitter` plus a matching `reduced_motion_changed` helper on `SettingsInterface`\nusing `REDUCED_MOTION_KEY`, mirroring `color_scheme_changed`.","locations":[{"ref":"client/src/backend/settings.rs:18-25","code":"   18 | #[async_trait]\n   19 | pub trait SettingsSignalEmitter: Send + Sync {\n   20 |     #[doc(alias = \"SettingChanged\")]\n   21 |     async fn emit_changed(&self, namespace: &str, key: &str, value: Value<'_>) -> zbus::Result<()>;\n   22 |     async fn emit_contrast_changed(&self, contrast: Contrast) -> zbus::Result<()>;\n   23 |     async fn emit_accent_color_changed(&self, color: Color) -> zbus::Result<()>;\n   24 |     async fn emit_color_scheme_changed(&self, scheme: ColorScheme) -> zbus::Result<()>;\n   25 | }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/settings.rs#L18-L25"}]},
{"id":"OTHER_18","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`UsbImpl::acquire_devices` types device identifiers as bare `String`, both for the incoming device\nlist and the returned selection, while the client side of the very same portal uses the\n`DeviceID` newtype (`client/src/desktop/usb.rs`). Backends therefore get untyped strings and cannot\nreuse the parsing/validation that `DeviceID` provides.","fix":"Use `crate::desktop::usb::DeviceID` for the identifier in both the argument and the return type of\n`UsbImpl::acquire_devices` and in `UsbInterface::acquire_devices` (its zvariant signature is `s`,\nso the wire format is unchanged).","locations":[{"ref":"client/src/backend/usb.rs:39-49","code":"   39 | #[async_trait]\n   40 | pub trait UsbImpl: RequestImpl {\n   41 |     #[doc(alias = \"AcquireDevices\")]\n   42 |     async fn acquire_devices(\n   43 |         &self,\n   44 |         token: HandleToken,\n   45 |         window_identifier: Option<WindowIdentifierType>,\n   46 |         app_id: Option<MaybeAppID>,\n   47 |         devices: Vec<(String, UsbDevice, AccessOptions)>,\n   48 |         options: AcquireDevicesOptions,\n   49 |     ) -> Result<Vec<(String, AccessOptions)>>;","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/usb.rs#L39-L49"}]},
{"id":"OTHER_19","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`SetStatusOptions::set_message` is the only builder-style setter in\n`client/src/desktop/background.rs` without `#[must_use]`, so\n`options.set_message(\"x\");` silently compiles to a no-op (the modified value is dropped).\nAdditionally, unlike every other setter in the file, it does not accept an `impl Into<Option<...>>`.","fix":"Add the attribute:\n\n```rust\n#[must_use]\npub fn set_message(mut self, message: &str) -> Self {\n```","locations":[{"ref":"client/src/desktop/background.rs:139-145","code":"  139 | impl SetStatusOptions {\n  140 |     /// Sets the message to be displayed to the user.\n  141 |     pub fn set_message(mut self, message: &str) -> Self {\n  142 |         self.message = message.to_owned();\n  143 |         self\n  144 |     }\n  145 | }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/background.rs#L139-L145"}]},
{"id":"OTHER_20","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`BackgroundRequest` cannot be told which `zbus::Connection` to use - unlike\n`UserInformationRequest` (`client/src/desktop/account.rs:166`, `184-197`), which has a\n`connection()` setter and honours it in `send()`. `BackgroundProxy::with_connection` therefore\nexists but is unreachable through the documented builder entry point (`Background::request()`).","fix":"Add `connection: Option<zbus::Connection>` to `BackgroundRequest` with a `connection()` setter and\nuse it in `send()`:\n\n```rust\nlet proxy = if let Some(connection) = self.connection {\n    BackgroundProxy::with_connection(connection).await?\n} else {\n    BackgroundProxy::new().await?\n};\n```","locations":[{"ref":"client/src/desktop/background.rs:229-233","code":"  229 | #[derive(Debug, Default)]\n  230 | pub struct BackgroundRequest {\n  231 |     identifier: Option<WindowIdentifier>,\n  232 |     options: BackgroundRequestOptions,\n  233 | }","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/background.rs#L229-L233"},{"ref":"client/src/desktop/background.rs:276-283","code":"  276 |     /// Build the [`Background`].\n  277 |     pub async fn send(self) -> Result<Request<Background>, Error> {\n  278 |         let proxy = BackgroundProxy::new().await?;\n  279 |         proxy\n  280 |             .request_background(self.identifier.as_ref(), self.options)\n  281 |             .await\n  282 |     }\n  283 | }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/background.rs#L276-L283"}]},
{"id":"OTHER_21","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"Typo in a user-visible error message: a stray backtick is appended inside the string of\n`unregister_by_pidfd`, producing `Failed to unregister by pidfd``. The sibling\n`register_by_pidfd` message has no such character.","fix":"Change `\"Failed to unregister by pidfd`\".to_string(),` to\n`\"Failed to unregister by pidfd\".to_string(),`.","locations":[{"ref":"client/src/desktop/game_mode.rs:286-290","code":"  286 |             RegisterStatus::Success => Ok(()),\n  287 |             RegisterStatus::Rejected => Err(Error::Portal(PortalError::Failed(\n  288 |                 \"Failed to unregister by pidfd`\".to_string(),\n  289 |             ))),\n  290 |         }","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/game_mode.rs#L286-L290"}]},
{"id":"OTHER_22","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`HandleToken::default()` maps random bytes onto a 62-character alphabet with\n`(*byte as usize) % ALPHANUMERIC.len()`. Since `256 % 62 == 8`, the first 8 characters\n(`A`..`H`) are ~1.6x more likely than the rest, so the generated tokens are not uniformly\ndistributed. Handle tokens end up in publicly visible request/session object paths, and other\nclients on the bus can enumerate them, so predictability is not purely cosmetic.","fix":"Use rejection sampling to remove the bias:\n```rust\nlet mut i = 0;\nwhile i < 10 {\n    let mut b = [0u8; 1];\n    getrandom::fill(&mut b).expect(\"failed to generate random bytes\");\n    if b[0] < 248 {\n        // 248 == 4 * 62, so the modulo is unbiased\n        token.push(ALPHANUMERIC[(b[0] % 62) as usize] as char);\n        i += 1;\n    }\n}\n```\nor draw 6 random bits at a time and reject values `>= 62`.","locations":[{"ref":"client/src/desktop/handle_token.rs:43-49","code":"   43 |         let mut rnd_bytes = [0u8; 10];\n   44 |         getrandom::fill(&mut rnd_bytes).expect(\"failed to generate random bytes\");\n   45 | \n   46 |         for byte in rnd_bytes.iter() {\n   47 |             let idx = (*byte as usize) % ALPHANUMERIC.len();\n   48 |             token.push(ALPHANUMERIC[idx] as char);\n   49 |         }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/handle_token.rs#L43-L49"}]},
{"id":"OTHER_23","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`InputCapture` is the only session portal wrapper in this slice (and one of the very few in the\ncrate) that does not derive `Debug`; `GlobalShortcuts`, `InhibitProxy` and `RemoteDesktop` all\ndo. That makes `InputCapture` unusable inside any user struct that derives `Debug`, for no\nreason - the wrapped `Proxy<'static>` is `Debug`.","fix":"```rust\n// before\n#[doc(alias = \"org.freedesktop.portal.InputCapture\")]\npub struct InputCapture(Proxy<'static>);\n// after\n#[derive(Debug)]\n#[doc(alias = \"org.freedesktop.portal.InputCapture\")]\npub struct InputCapture(Proxy<'static>);\n```","locations":[{"ref":"client/src/desktop/input_capture.rs:804-806","code":"  804 | /// Wrapper of the DBus interface: [`org.freedesktop.portal.InputCapture`](https://flatpak.github.io/xdg-desktop-portal/docs/doc-org.freedesktop.portal.InputCapture.html).\n  805 | #[doc(alias = \"org.freedesktop.portal.InputCapture\")]\n  806 | pub struct InputCapture(Proxy<'static>);","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L804-L806"}]},
{"id":"OTHER_24","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`OpenURIProxy::scheme_supported` names its first parameter `schema`, but the argument is a URI\n*scheme* (`http`, `mailto`, ...), which is what both the doc comment (`* `scheme` - URI protocol\nscheme to check.`) and the D-Bus signature (`<arg type=\"s\" name=\"scheme\" .../>` in\n`interfaces/org.freedesktop.portal.OpenURI.xml`) call it. Since Rust shows parameter names in\nrustdoc and in IDE hints, the mismatch is user-visible and the doc's `# Arguments` list does not\nmatch the signature.","fix":"```rust\n// before\npub async fn scheme_supported(&self, schema: &str, options: SchemeSupportedOptions) -> Result<bool, Error> {\n    self.0.call(\"SchemeSupported\", &(schema, &options)).await\n\n// after\npub async fn scheme_supported(&self, scheme: &str, options: SchemeSupportedOptions) -> Result<bool, Error> {\n    self.0.call(\"SchemeSupported\", &(scheme, &options)).await\n```","locations":[{"ref":"client/src/desktop/open_uri.rs:224-230","code":"  224 |     pub async fn scheme_supported(\n  225 |         &self,\n  226 |         schema: &str,\n  227 |         options: SchemeSupportedOptions,\n  228 |     ) -> Result<bool, Error> {\n  229 |         self.0.call(\"SchemeSupported\", &(schema, &options)).await\n  230 |     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/open_uri.rs#L224-L230"}]},
{"id":"OTHER_25","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`Stream`'s hand-written `Debug` impl was not updated when the `mapping_id` property was added: it prints\n`pipewire_node_id`, `position`, `size`, `source_type` and `id` but silently omits `mapping_id`. The\n`Streams` `Debug` impl has the same problem (it prints only `restore_token` and `streams`, in reverse\nfield order, and skips `persist_mode`/`restore_data`), which makes debug logs misleading.","fix":"Add the missing fields, e.g. in `Debug for Stream` insert\n`.field(\"mapping_id\", &self.mapping_id())` before `.finish()`, and add\n`.field(\"persist_mode\", &self.persist_mode)` / `.field(\"restore_data\", &self.restore_data)` to\n`Debug for Streams` (or simply `#[derive(Debug)]` both types).","locations":[{"ref":"client/src/desktop/screencast.rs:354-364","code":"  354 | impl Debug for Stream {\n  355 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  356 |         f.debug_struct(\"Stream\")\n  357 |             .field(\"pipewire_node_id\", &self.pipe_wire_node_id())\n  358 |             .field(\"position\", &self.position())\n  359 |             .field(\"size\", &self.size())\n  360 |             .field(\"source_type\", &self.source_type())\n  361 |             .field(\"id\", &self.id())\n  362 |             .finish()\n  363 |     }\n  364 | }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/screencast.rs#L354-L364"},{"ref":"client/src/desktop/screencast.rs:244-251","code":"  244 | impl Debug for Streams {\n  245 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  246 |         f.debug_tuple(\"Streams\")\n  247 |             .field(&self.restore_token)\n  248 |             .field(&self.streams)\n  249 |             .finish()\n  250 |     }\n  251 | }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/screencast.rs#L244-L251"}]},
{"id":"OTHER_26","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`WallpaperProxy` is the only proxy in this slice without `#[derive(Debug)]` (`Documents`,\n`Flatpak`, `FileTransfer`, `Development`, `UpdateMonitor` and most `desktop::*Proxy` types all\nhave it). Users therefore cannot put a `WallpaperProxy` inside their own\n`#[derive(Debug)]` struct.","fix":"Add the derive:\n```rust\n#[derive(Debug)]\n#[doc(alias = \"org.freedesktop.portal.Wallpaper\")]\npub struct WallpaperProxy(Proxy<'static>);\n```","locations":[{"ref":"client/src/desktop/wallpaper.rs:152-154","code":"  152 | /// Wrapper of the DBus interface: [`org.freedesktop.portal.Wallpaper`](https://flatpak.github.io/xdg-desktop-portal/docs/doc-org.freedesktop.portal.Wallpaper.html).\n  153 | #[doc(alias = \"org.freedesktop.portal.Wallpaper\")]\n  154 | pub struct WallpaperProxy(Proxy<'static>);","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/wallpaper.rs#L152-L154"}]},
{"id":"OTHER_27","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`FileTransfer::transfer_closed` is the only signal wrapper in the crate that does not follow the\n`receive_*` convention used everywhere else (`receive_spawn_started`, `receive_spawn_exited`,\n`receive_progress`, `receive_update_available`, ...), so it reads like a state query rather than a\nstream constructor.","fix":"Rename to `receive_transfer_closed`, keeping `#[doc(alias = \"TransferClosed\")]` (add a\n`#[deprecated]` re-export of the old name if the public API must stay stable).","locations":[{"ref":"client/src/documents/file_transfer.rs:225-228","code":"  225 |     #[doc(alias = \"TransferClosed\")]\n  226 |     pub async fn transfer_closed(&self) -> Result<impl Stream<Item = String>, Error> {\n  227 |         self.0.signal(\"TransferClosed\").await\n  228 |     }","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/documents/file_transfer.rs#L225-L228"}]},
{"id":"OTHER_28","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`Proxy::unique_name` is declared `async` but contains no `.await`; it is pure string manipulation plus\n`ObjectPath::try_from`. Every caller pays for an extra future/state machine and must be async itself\n(`Request::from_unique_name`, `client/src/desktop/session.rs:53`) for no reason.","fix":"Drop the `async` keyword and the `.await`s at the two call sites:\n\n```rust\n// before\npub async fn unique_name(...) -> Result<ObjectPath<'static>, Error> {\n// after\npub fn unique_name(...) -> Result<ObjectPath<'static>, Error> {\n```","locations":[{"ref":"client/src/proxy.rs:46-55","code":"   46 |     pub async fn unique_name(\n   47 |         connection: &zbus::Connection,\n   48 |         prefix: &str,\n   49 |         handle_token: &HandleToken,\n   50 |     ) -> Result<ObjectPath<'static>, Error> {\n   51 |         let unique_name = connection.unique_name().unwrap();\n   52 |         let unique_identifier = unique_name.trim_start_matches(':').replace('.', \"_\");\n   53 |         ObjectPath::try_from(format!(\"{prefix}/{unique_identifier}/{handle_token}\"))\n   54 |             .map_err(From::from)\n   55 |     }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L46-L55"}]},
{"id":"OTHER_29","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`Uri::from_str` uses the bitwise OR `|` on two booleans instead of the logical `||`:\n`if !s.contains(\":\") | s.starts_with(':')`. It happens to produce the right answer for `bool`, but it defeats\nshort-circuiting and reads like a typo (clippy's `nonminimal_bool`/`bad_bit_mask` family flags this pattern).","fix":"```rust\n// before\nif !s.contains(\":\") | s.starts_with(':') {\n// after\nif !s.contains(':') || s.starts_with(':') {\n```\n(also prefer the `char` pattern `':'` over the one-character string `\":\"`).","locations":[{"ref":"client/src/uri.rs:40-42","code":"   40 |         if !s.contains(\":\") | s.starts_with(':') {\n   41 |             return Err(ParseError::MissingScheme);\n   42 |         }","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/uri.rs#L40-L42"}]},
{"id":"OTHER_30","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`Gtk4WindowIdentifier::drop` compares references instead of values: `if ref_count > &mut 1`. This relies on\n`PartialOrd for &mut T` forwarding to the referent, and needlessly creates a `&mut` to a temporary just to compare.\nIt reads like a mistake and is easy for a future reader to \"fix\" into a pointer comparison.","fix":"```rust\n// before\nif ref_count > &mut 1 {\n// after\nif *ref_count > 1 {\n```","locations":[{"ref":"client/src/window_identifier/gtk4.rs:180-185","code":"  180 |                     let (_handle, ref_count): &mut (Option<String>, u8) =\n  181 |                         top_level.data(WINDOW_HANDLE_KEY).unwrap().as_mut();\n  182 |                     if ref_count > &mut 1 {\n  183 |                         *ref_count -= 1;\n  184 |                         return;\n  185 |                     }","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L180-L185"}]}
