<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`new_wayland_inner` unwraps both halves of the oneshot channel. If the returned future is dropped\nbefore completion (any `select!`/timeout/cancelled task), `receiver` is gone and\n`sender.send(...)` returns `Err`, so `.unwrap()` panics inside the spawned OS thread. Conversely, if\nthe worker thread panics, the sender is dropped and `receiver.await.unwrap()` panics in the caller's\nasync context. Both are avoidable: cancellation is a normal event, not a bug.","fix":"Ignore the send result and treat a dropped sender as \"no token\":\n\n```rust\n            match wayland_export_token(app_id, conn, &surface, serial, seat.as_ref()) {\n                Ok(window_handle) => { let _ = sender.send(Some(window_handle)); }\n                Err(_err) => { let _ = sender.send(None); }\n            }\n...\n        receiver.await.ok().flatten()\n```","locations":[{"ref":"client/src/activation_token/wayland.rs:156-173","code":"  156 |         let (sender, receiver) = futures_channel::oneshot::channel::<Option<Self>>();\n  157 | \n  158 |         // Cheap clone, protocol objects are essentially smart pointers\n  159 |         let surface = surface.clone();\n  160 |         let seat = seat.cloned();\n  161 |         std::thread::spawn(move || {\n  162 |             match wayland_export_token(app_id, conn, &surface, serial, seat.as_ref()) {\n  163 |                 Ok(window_handle) => sender.send(Some(window_handle)).unwrap(),\n  164 |                 Err(_err) => {\n  165 |                     #[cfg(feature = \"tracing\")]\n  166 |                     tracing::info!(\"Could not get wayland window identifier: {_err}\");\n  167 |                     sender.send(None).unwrap();\n  168 |                 }\n  169 |             }\n  170 |         });\n  171 | \n  172 |         receiver.await.unwrap()\n  173 |     }","lines":18,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/activation_token/wayland.rs#L156-L173"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Every backend interface method does `HandleToken::try_from(&handle).unwrap()` on an object path that\ncomes straight off the bus. `TryFrom<&OwnedObjectPath> for HandleToken` takes the last `/`-separated\nsegment and rejects it when empty, so a peer that calls e.g.\n`org.freedesktop.impl.portal.Access.AccessDialog` with `handle = \"/\"` (a perfectly valid\n`ObjectPath`, so zvariant accepts it) makes the unwrap panic inside the D-Bus method handler,\nkilling the request task / connection handler of the portal backend. Any D-Bus client on the session\nbus can trigger it, so this is a trivially reachable remote DoS. `Request::spawn` repeats the very\nsame unwrap at `client/src/backend/request.rs:50`, which also means the token is parsed twice per\nrequest.","fix":"Parse once and fail gracefully. Have `Request::spawn` do the parsing and hand the `HandleToken` to\nthe callback, and convert the error into a D-Bus error instead of panicking, e.g.\n\n```rust\nlet token = HandleToken::try_from(&path)\n    .map_err(|e| PortalError::InvalidArgument(format!(\"invalid request handle: {e}\")))?;\n```\n\nthen pass `token` into the async block rather than calling `HandleToken::try_from(&handle).unwrap()`\nin each of the nine interface methods.","locations":[{"ref":"client/src/backend/access.rs:159-163","code":"  159 |             async move {\n  160 |                 imp.access_dialog(\n  161 |                     HandleToken::try_from(&handle).unwrap(),\n  162 |                     app_id.into(),\n  163 |                     window_identifier.into(),","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/access.rs#L159-L163"},{"ref":"client/src/backend/account.rs:71-75","code":"   71 |             async move {\n   72 |                 imp.get_user_information(\n   73 |                     HandleToken::try_from(&handle).unwrap(),\n   74 |                     app_id.into(),\n   75 |                     window_identifier.into(),","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/account.rs#L71-L75"},{"ref":"client/src/backend/app_chooser.rs:146-150","code":"  146 |             async move {\n  147 |                 imp.choose_application(\n  148 |                     HandleToken::try_from(&handle).unwrap(),\n  149 |                     app_id.into(),\n  150 |                     parent_window.into(),","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/app_chooser.rs#L146-L150"},{"ref":"client/src/backend/app_chooser.rs:168-169","code":"  168 |         let token = HandleToken::try_from(&handle).unwrap();\n  169 |         let response = self.imp.update_choices(token, choices).await;","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/app_chooser.rs#L168-L169"},{"ref":"client/src/backend/background.rs:149-152","code":"  149 |             async move {\n  150 |                 imp.notify_background(HandleToken::try_from(&handle).unwrap(), app_id, &name)\n  151 |                     .await\n  152 |             },","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/background.rs#L149-L152"},{"ref":"client/src/backend/email.rs:66-70","code":"   66 |             async move {\n   67 |                 imp.compose(\n   68 |                     HandleToken::try_from(&handle).unwrap(),\n   69 |                     app_id.into(),\n   70 |                     window_identifier.into(),","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/email.rs#L66-L70"},{"ref":"client/src/backend/file_chooser.rs:92-96","code":"   92 |             async move {\n   93 |                 imp.open_file(\n   94 |                     HandleToken::try_from(&handle).unwrap(),\n   95 |                     app_id.into(),\n   96 |                     window_identifier.into(),","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/file_chooser.rs#L92-L96"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Every backend interface method converts the incoming request/session object path with\n`HandleToken::try_from(&path).unwrap()`. `HandleToken::from_str` rejects an empty string\n(`HandleTokenParseError::Empty`), and the last `/`-separated segment of the perfectly valid D-Bus\nobject path `\"/\"` is empty. Since the `handle` / `session_handle` arguments are plain `o` arguments\ncoming from the bus, any peer that calls e.g.\n`org.freedesktop.impl.portal.Screenshot.Screenshot(\"/\", \"\", \"\", {})` panics the backend's method\nhandler task - a remotely triggerable DoS of the portal backend.","fix":"Parse the token once, at the interface boundary, and turn a failure into a D-Bus error instead of a\npanic, e.g.\n\n```rust\nlet token = HandleToken::try_from(&handle)\n    .map_err(|e| PortalError::InvalidArgument(format!(\"Invalid request handle: {e}\")))?;\n```\n\nthen pass `token` into the closure. Same for `Session::token()`, which should return\n`crate::backend::Result<HandleToken>` or store the token next to the path so it is validated only\nonce, when the session is created.","locations":[{"ref":"client/src/backend/request.rs:49-50","code":"   49 |         let (fut, abort_handle) = abortable(callback);\n   50 |         let token = HandleToken::try_from(&path).unwrap();","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/request.rs#L49-L50"},{"ref":"client/src/backend/session.rs:34-36","code":"   34 |     pub fn token(&self) -> HandleToken {\n   35 |         HandleToken::try_from(&self.path).unwrap()\n   36 |     }","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/session.rs#L34-L36"},{"ref":"client/src/backend/screencast.rs:119-120","code":"  119 |     ) -> Result<Response<CreateSessionResponse>> {\n  120 |         let session_token = HandleToken::try_from(&session_handle).unwrap();","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/screencast.rs#L119-L120"},{"ref":"client/src/backend/screenshot.rs:91-93","code":"   91 |             async move {\n   92 |                 imp.screenshot(\n   93 |                     HandleToken::try_from(&handle).unwrap(),","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/screenshot.rs#L91-L93"},{"ref":"client/src/backend/print.rs:89-91","code":"   89 |             async move {\n   90 |                 imp.prepare_print(\n   91 |                     HandleToken::try_from(&handle).unwrap(),","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/print.rs#L89-L91"},{"ref":"client/src/backend/usb.rs:93-95","code":"   93 |             async move {\n   94 |                 imp.acquire_devices(\n   95 |                     HandleToken::try_from(&handle).unwrap(),","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/usb.rs#L93-L95"},{"ref":"client/src/backend/secret.rs:65-67","code":"   65 |             async move {\n   66 |                 imp.retrieve(\n   67 |                     HandleToken::try_from(&handle).unwrap(),","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/secret.rs#L65-L67"},{"ref":"client/src/backend/wallpaper.rs:69-71","code":"   69 |             async move {\n   70 |                 imp.with_uri(\n   71 |                     HandleToken::try_from(&handle).unwrap(),","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/wallpaper.rs#L69-L71"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`pipewire_streams` awaits `receiver.await.unwrap()`. The oneshot sender is only used from the\n`done_callback` (or from the error path), so if the PipeWire main loop stops without ever\ndelivering a `done` event - or if the worker thread panics, e.g. on the\n`core.sync(0).expect(\"sync failed\")` a few lines above - the sender is dropped without sending and\n`receiver.await` yields `Err(Canceled)`, so the `unwrap()` panics inside the caller's async task\ninstead of returning an error.","fix":"Replace both panics with error propagation: turn `core.sync(0).expect(\"sync failed\")` into\n`core.sync(0)?` (it already returns `pipewire::Error`), and map the cancelled oneshot to an error,\ne.g. `receiver.await.map_err(|_| pipewire::Error::CreationFailed)??;` (or change the function's\nerror type to a local enum that can represent \"the PipeWire thread died\").","locations":[{"ref":"client/src/desktop/camera.rs:255-262","code":"  255 |             let mut guard = sender.lock().unwrap();\n  256 |             if let Some(sender) = guard.take() {\n  257 |                 let _ = sender.send(Err(err));\n  258 |             }\n  259 |         }\n  260 |     });\n  261 | \n  262 |     receiver.await.unwrap()?;","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/camera.rs#L255-L262"},{"ref":"client/src/desktop/camera.rs:170-172","code":"  170 |     let registry = core.get_registry()?;\n  171 | \n  172 |     let pending = core.sync(0).expect(\"sync failed\");","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/camera.rs#L170-L172"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`LauncherIcon::icon()` and `PrepareInstallResponse::icon()` `unwrap()` a `Result` that is built from\ndata received over D-Bus, so any icon value the portal sends that `Icon::try_from` does not accept\naborts the caller's process instead of returning an error. `Icon::try_from(&OwnedValue)` itself is\npanic-happy (it does `value.downcast_ref::<zvariant::Structure>().unwrap()`, indexes `fields[0]` /\n`fields[1]` and `unwrap()`s every `downcast_ref`), and it *returns* `Err` for an unknown type tag or\nfor a `\"file\"` icon whose URI does not parse - both of which then hit the `.unwrap()` here. Worse,\n`impl Debug for PrepareInstallResponse` calls `self.icon()`, so merely logging a response with\n`{:?}` can panic. Both `icon()` methods are documented as plain accessors, so callers have no way to\nguard against this.","fix":"Make the accessors fallible and stop panicking on remote data:\n```rust\npub fn icon(&self) -> Result<Icon, Error> {\n    Icon::try_from(&self.0)\n}\n```\nand for `PrepareInstallResponse`:\n```rust\npub fn icon(&self) -> Result<Icon, Error> {\n    Icon::try_from(&self.icon)\n}\n```\nThen change the manual `Debug` impl to print `&self.icon` (the raw `OwnedValue`) instead of calling\n`self.icon()`, or simply `#[derive(Debug)]`.","locations":[{"ref":"client/src/desktop/dynamic_launcher.rs:99-114","code":"   99 | impl LauncherIcon {\n  100 |     /// The actual icon.\n  101 |     pub fn icon(&self) -> Icon {\n  102 |         Icon::try_from(&self.0).unwrap()\n  103 |     }\n  104 | \n  105 |     /// The icon type.\n  106 |     pub fn type_(&self) -> IconType {\n  107 |         self.1\n  108 |     }\n  109 | \n  110 |     /// The icon size.\n  111 |     pub fn size(&self) -> u32 {\n  112 |         self.2\n  113 |     }\n  114 | }","lines":16,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/dynamic_launcher.rs#L99-L114"},{"ref":"client/src/desktop/dynamic_launcher.rs:190-194","code":"  190 |     /// The user selected icon or a predefined one\n  191 |     pub fn icon(&self) -> Icon {\n  192 |         let inner = self.icon.downcast_ref::<Value>().unwrap();\n  193 |         Icon::try_from(inner).unwrap()\n  194 |     }","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/dynamic_launcher.rs#L190-L194"},{"ref":"client/src/desktop/dynamic_launcher.rs:197-205","code":"  197 | impl std::fmt::Debug for PrepareInstallResponse {\n  198 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  199 |         f.debug_struct(\"PrepareInstallResponse\")\n  200 |             .field(\"name\", &self.name())\n  201 |             .field(\"icon\", &self.icon())\n  202 |             .field(\"token\", &self.token())\n  203 |             .finish()\n  204 |     }\n  205 | }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/dynamic_launcher.rs#L197-L205"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`impl TryFrom<&OwnedValue> for Icon` is a `TryFrom` that panics instead of returning\n`Err`: `value.downcast_ref::<zvariant::Structure>().unwrap()` panics when the value is not a\nstruct, `fields[0]` / `fields[1]` panic with an index-out-of-bounds when the struct has fewer\nthan two fields, and every `downcast_ref::<...>().unwrap()` inside the arms panics when the\ninner type is not the expected one (e.g. `(\"themed\", <\"single-name\">)` instead of an array,\nor `(\"bytes\", <\"foo\">)`). This data comes straight off the bus: `dynamic_launcher.rs` calls\n`Icon::try_from(&self.0).unwrap()` on portal-supplied values in `LauncherIcon::icon()` and\n`PreparedAppLaunchInfo::icon()`, so a buggy or hostile portal implementation aborts the\nclient application instead of producing an `Error`.","fix":"Return `Error::ParseError` instead of panicking, e.g.:\n```rust\nlet structure = value\n    .downcast_ref::<zvariant::Structure>()\n    .map_err(|_| Error::ParseError(\"Icon is not a (sv) struct\"))?;\nlet fields = structure.fields();\nlet [type_, data] = fields else {\n    return Err(Error::ParseError(\"Icon must have exactly two fields\"));\n};\nlet type_ = type_\n    .downcast_ref::<zvariant::Str>()\n    .map_err(|_| Error::ParseError(\"Icon type is not a string\"))?;\n```\nand replace each remaining `downcast_ref::<T>().unwrap()` in the arms with\n`.map_err(|_| Error::ParseError(...))?`.","locations":[{"ref":"client/src/desktop/icon.rs:151-192","code":"  151 |     fn try_from(value: &OwnedValue) -> Result<Self, Self::Error> {\n  152 |         let structure = value.downcast_ref::<zvariant::Structure>().unwrap();\n  153 |         let fields = structure.fields();\n  154 |         let type_ = fields[0].downcast_ref::<zvariant::Str>().unwrap();\n  155 |         match type_.as_str() {\n  156 |             \"file\" => {\n  157 |                 let uri_str = fields[1]\n  158 |                     .downcast_ref::<zvariant::Str>()\n  159 |                     .unwrap()\n  160 |                     .to_owned();\n  161 |                 let uri = Uri::parse(uri_str.as_str()).map_err(crate::Error::Uri)?;\n  162 |                 Ok(Self::Uri(uri))\n  163 |             }\n  164 |             \"bytes\" => {\n  165 |                 let array = fields[1].downcast_ref::<zvariant::Array>().unwrap();\n  166 |                 let mut bytes = Vec::with_capacity(array.len());\n  167 |                 for byte in array.inner() {\n  168 |                     bytes.push(byte.downcast_ref::<u8>().unwrap());\n  169 |                 }\n  170 |                 Ok(Self::Bytes(bytes))\n  171 |             }\n  172 |             \"themed\" => {\n  173 |                 let array = fields[1].downcast_ref::<zvariant::Array>().unwrap();\n  174 |                 let mut names = Vec::with_capacity(array.len());\n  175 |                 for value in array.inner() {\n  176 |                     let name = value.downcast_ref::<zvariant::Str>().unwrap();\n  177 |                     names.push(name.as_str().to_owned());\n  178 |                 }\n  179 |                 Ok(Self::Names(names))\n  180 |             }\n  181 |             \"file-descriptor\" => {\n  182 |                 let fd = fields[1].downcast_ref::<zvariant::Fd>().unwrap();\n  183 |                 Ok(Self::FileDescriptor(\n  184 |                     fd.as_fd()\n  185 |                         .try_clone_to_owned()\n  186 |                         .expect(\"Failed to clone file descriptor\"),\n  187 |                 ))\n  188 |             }\n  189 |             _ => Err(Error::ParseError(\"Invalid Icon type\")),\n  190 |         }\n  191 |     }\n  192 | }","lines":42,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/icon.rs#L151-L192"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"All session-creating methods `assert_eq!` that the session object path returned by the portal\nequals the locally predicted path. A portal implementation that does not honour\n`session_handle_token` (this has happened in real implementations, see the note in\n`client/src/desktop/session.rs` about `session_handle` being returned as `s` instead of `o`)\nmakes the whole application panic/abort from inside a library call instead of receiving a\nrecoverable `Error`. `assert_eq!` is not compiled out in release builds.","fix":"Turn the invariant into an error, e.g. add a dedicated variant (or reuse\n`Error::ParseError`) and write:\n```rust\nif proxy.path() != &response.session_handle.as_ref() {\n    return Err(Error::ParseError(\"portal returned an unexpected session handle\"));\n}\n```\nAlternatively build the `Session` from the returned `session_handle` instead of predicting it.","locations":[{"ref":"client/src/desktop/inhibit.rs:199-202","code":"  199 |             Session::from_unique_name(self.0.connection().clone(), &options.session_handle_token),\n  200 |         )?;\n  201 |         assert_eq!(proxy.path(), &monitor.response()?.session_handle.as_ref());\n  202 |         Ok(proxy)","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/inhibit.rs#L199-L202"},{"ref":"client/src/desktop/global_shortcuts.rs:276-278","code":"  276 |         )?;\n  277 |         assert_eq!(proxy.path(), &request.response()?.session_handle.as_ref());\n  278 |         Ok(proxy)","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/global_shortcuts.rs#L276-L278"},{"ref":"client/src/desktop/input_capture.rs:848-850","code":"  848 |         let response = request.response()?;\n  849 |         assert_eq!(proxy.path(), &response.session_handle.as_ref());\n  850 |         Ok((proxy, response.capabilities))","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L848-L850"},{"ref":"client/src/desktop/input_capture.rs:914-916","code":"  914 |             .await?;\n  915 |         assert_eq!(proxy.path(), &response.session_handle.as_ref());\n  916 |         Ok(proxy)","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L914-L916"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`RemoteDesktop::create_session` uses `assert_eq!` to compare the session object path it derived locally\nwith the one the portal returned. `assert_eq!` is *not* compiled out in release builds, so a portal\nimplementation that returns a different (or unexpected) `session_handle` aborts the calling application\ninstead of producing an `Error`. A library should never panic on remote input it does not control. The\nsame pattern is repeated in `screencast.rs`, `global_shortcuts.rs`, `inhibit.rs`, `input_capture.rs` and\n`location.rs`.","fix":"Replace the assertion with a real error, e.g.\n\n```rust\nlet response = request.response()?;\nif proxy.path() != &response.session_handle.as_ref() {\n    return Err(Error::UnexpectedSessionHandle); // new variant, or reuse Error::NoResponse\n}\n```","locations":[{"ref":"client/src/desktop/remote_desktop.rs:341-350","code":"  341 |         let (request, proxy) = futures_util::try_join!(\n  342 |             self.0.request::<CreateSessionResponse>(\n  343 |                 &options.handle_token,\n  344 |                 \"CreateSession\",\n  345 |                 &options\n  346 |             ),\n  347 |             Session::from_unique_name(self.0.connection().clone(), &options.session_handle_token)\n  348 |         )?;\n  349 |         assert_eq!(proxy.path(), &request.response()?.session_handle.as_ref());\n  350 |         Ok(proxy)","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/remote_desktop.rs#L341-L350"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Request::response()` does `self.2.lock().unwrap().take().unwrap()`: it *moves* the stored result out\nwhile taking `&self`. A second call to `response()` on the same `Request` panics with\n`called \\`Option::unwrap()\\` on a \\`None\\` value`. The `&self` receiver actively invites this - nothing in\nthe signature or the docs says the method is single-shot. The inline comment (\"It should be safe to\nunwrap here as we are sure we have received a response by the time the user calls response\") only\njustifies the *first* call and is therefore misleading.","fix":"Either take ownership - `pub fn response(self) -> Result<T, Error>` - or keep `&self` and return a clone /\na borrowed reference, or at minimum turn the second `unwrap` into a real error:\n\n```rust\npub fn response(&self) -> Result<T, Error> {\n    self.2.lock().unwrap().take().ok_or(Error::NoResponse)?\n}\n```\n\nand update the comment to state that the method consumes the stored response.","locations":[{"ref":"client/src/desktop/request.rs:266-270","code":"  266 |     pub fn response(&self) -> Result<T, Error> {\n  267 |         // It should be safe to unwrap here as we are sure we have received a response\n  268 |         // by the time the user calls response\n  269 |         self.2.lock().unwrap().take().unwrap()\n  270 |     }","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/request.rs#L266-L270"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Screencast::create_session` ends with `assert_eq!(proxy.path(), &request.response()?.session_handle.as_ref())`.\nThe right-hand side is the object path chosen by the portal implementation; the left-hand side is the\npath ashpd guessed from `session_handle_token`. A portal that returns a different (but perfectly usable)\nsession path aborts the whole application, in release builds too, instead of returning an `Error`. This\npattern is copied across the crate (`remote_desktop.rs:349`, `global_shortcuts.rs:277`, `inhibit.rs:201`,\n`input_capture.rs:849`), but `usb.rs::create_session` shows the correct approach: use the path the portal\nactually returned.","fix":"Replace the assertion with either a real error or trust the returned handle, e.g.\n```rust\nlet session_handle = request.response()?.session_handle;\nif proxy.path() != &session_handle.as_ref() {\n    return Err(Error::UnexpectedResponse); // or build the Session from `session_handle`\n}\nOk(proxy)\n```","locations":[{"ref":"client/src/desktop/screencast.rs:500-503","code":"  500 |             Session::from_unique_name(self.0.connection().clone(), &options.session_handle_token),\n  501 |         )?;\n  502 |         assert_eq!(proxy.path(), &request.response()?.session_handle.as_ref());\n  503 |         Ok(proxy)","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/screencast.rs#L500-L503"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`CreateSessionResponse`'s hand-written `Deserialize` calls `ObjectPath::try_from(object_path_str).unwrap()`.\n`session_handle` is attacker/peer-controlled data coming from the portal implementation over D-Bus; any\nstring that is not a valid object path (empty string, `foo`, a path with invalid characters) aborts the\nclient process instead of producing a `serde::de::Error`. The surrounding code already reports a clean\nerror for the \"wrong type\" case, so the panic is clearly unintended.","fix":"Convert the failure into a serde error:\n```rust\nlet path = if let Ok(object_path_str) = session_handle.downcast_ref::<&str>() {\n    ObjectPath::try_from(object_path_str).map_err(serde::de::Error::custom)?\n} else if let Ok(object_path) = session_handle.downcast_ref::<ObjectPath<'_>>() {\n    object_path\n} else {\n    return Err(serde::de::Error::custom(\"Wrong session_handle type. Expected `s` or `o`.\"));\n};\n```","locations":[{"ref":"client/src/desktop/session.rs:147-149","code":"  147 |         let path = if let Ok(object_path_str) = session_handle.downcast_ref::<&str>() {\n  148 |             ObjectPath::try_from(object_path_str).unwrap()\n  149 |         } else if let Ok(object_path) = session_handle.downcast_ref::<ObjectPath<'_>>() {","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/session.rs#L147-L149"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `Gtk4WindowIdentifier::new`, the Wayland branch does\n`surface.downcast_ref::<gdk4wayland::WaylandToplevel>().unwrap()`. `gtk4::Native` is implemented by widgets whose\nsurface is *not* a toplevel - `gtk4::Popover` (a `WaylandPopup`), tooltips, drag icons. Calling\n`WindowIdentifier::from_native(&some_widget.native().unwrap())` from inside a popover therefore panics instead of\nreturning `None`. Note the X11 branch a few lines below handles exactly this case gracefully with\n`.downcast_ref::<gdk4x11::X11Surface>().map(|w| w.xid())?`, so the behaviour is inconsistent between backends.","fix":"Use the same fallible pattern as the X11 branch:\n\n```rust\nlet top_level = surface.downcast_ref::<gdk4wayland::WaylandToplevel>()?;\n```","locations":[{"ref":"client/src/window_identifier/gtk4.rs:34-42","code":"   34 |             #[cfg(feature = \"gtk4_wayland\")]\n   35 |             Backend::Wayland => {\n   36 |                 let top_level = surface\n   37 |                     .downcast_ref::<gdk4wayland::WaylandToplevel>()\n   38 |                     .unwrap();\n   39 |                 let handle = unsafe {\n   40 |                     if let Some(mut handle) = top_level.data(WINDOW_HANDLE_KEY) {\n   41 |                         let (handle, ref_count): &mut (Option<String>, u8) = handle.as_mut();\n   42 |                         *ref_count += 1;","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L34-L42"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Gtk4WindowIdentifier::drop` calls `self.native.surface().unwrap()` and then\n`top_level.data(WINDOW_HANDLE_KEY).unwrap()`. Both return `None` once the window has been unrealized/destroyed\n(`gtk4::Native::surface()` yields `None` after unrealize, and GObject qdata is freed when the object is finalized).\nA very ordinary sequence - build the identifier, `window.close()`/`destroy()`, then drop the identifier (or drop it at\nthe end of the async block after the portal dialog closed the window) - panics inside `Drop`, which aborts the process\nif it happens while another panic is unwinding. The same `self.native.surface().unwrap()` appears in\n`as_raw_window_handle` and `as_raw_display_handle`.","fix":"Make `Drop` tolerant:\n\n```rust\nlet Some(surface) = self.native.surface() else { return };\nlet Some(top_level) = surface.downcast_ref::<gdk4wayland::WaylandToplevel>() else { return };\nlet Some(mut data) = top_level.data::<(Option<String>, u8)>(WINDOW_HANDLE_KEY) else { return };\n```\n\nand have `as_raw_window_handle`/`as_raw_display_handle` return `Result<_, HandleError>` (which is what the\n`HasWindowHandle`/`HasDisplayHandle` traits already expect) instead of unwrapping.","locations":[{"ref":"client/src/window_identifier/gtk4.rs:172-190","code":"  172 |         match self.type_ {\n  173 |             #[cfg(feature = \"gtk4_wayland\")]\n  174 |             WindowIdentifierType::Wayland(_) => {\n  175 |                 let surface = self.native.surface().unwrap();\n  176 |                 let top_level = surface\n  177 |                     .downcast_ref::<gdk4wayland::WaylandToplevel>()\n  178 |                     .unwrap();\n  179 |                 unsafe {\n  180 |                     let (_handle, ref_count): &mut (Option<String>, u8) =\n  181 |                         top_level.data(WINDOW_HANDLE_KEY).unwrap().as_mut();\n  182 |                     if ref_count > &mut 1 {\n  183 |                         *ref_count -= 1;\n  184 |                         return;\n  185 |                     }\n  186 |                     top_level.unexport_handle();\n  187 |                     #[cfg(feature = \"tracing\")]\n  188 |                     tracing::debug!(\"Unexporting handle: {_handle:?}\");\n  189 |                     let _ = top_level.steal_data::<(Option<String>, u8)>(WINDOW_HANDLE_KEY);\n  190 |                 }","lines":19,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L172-L190"},{"ref":"client/src/window_identifier/gtk4.rs:121-124","code":"  121 |     #[cfg(feature = \"raw_handle\")]\n  122 |     pub fn as_raw_display_handle(&self) -> DisplayHandle<'_> {\n  123 |         let surface = self.native.surface().unwrap();\n  124 |         let display = surface.display();","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/gtk4.rs#L121-L124"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`HasDisplayHandle::display_handle` and `HasWindowHandle::window_handle` for `WindowIdentifier` end with\n`_ => unreachable!()`. The `Raw` variant exists unconditionally and the `Wayland` variant exists with\n`feature = \"wayland\"`, so any identifier built with the documented constructors `WindowIdentifier::from_xid`,\n`from_xdg_foreign_exported`, `from_raw_handle` or `from_wayland` panics when passed to code that is generic over\n`HasWindowHandle` (which is the whole point of implementing those traits). Both trait methods return\n`Result<_, HandleError>`, so an error is available and no panic is necessary; the doc comment merely says \"# Panics\",\nwhich does not make an `unreachable!()` in a public trait impl acceptable.","fix":"Return an error instead of panicking:\n\n```rust\n_ => Err(HandleError::NotSupported),\n```\n\nand update the doc comments from \"# Panics\" to describe the returned `HandleError`.","locations":[{"ref":"client/src/window_identifier/mod.rs:251-257","code":"  251 |     fn display_handle(&self) -> Result<DisplayHandle<'_>, HandleError> {\n  252 |         match self {\n  253 |             #[cfg(feature = \"gtk4\")]\n  254 |             Self::Gtk4(identifier) => Ok(identifier.as_raw_display_handle()),\n  255 |             _ => unreachable!(),\n  256 |         }\n  257 |     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L251-L257"},{"ref":"client/src/window_identifier/mod.rs:270-276","code":"  270 |     fn window_handle(&self) -> Result<WindowHandle<'_>, HandleError> {\n  271 |         match self {\n  272 |             #[cfg(feature = \"gtk4\")]\n  273 |             Self::Gtk4(identifier) => Ok(identifier.as_raw_window_handle()),\n  274 |             _ => unreachable!(),\n  275 |         }\n  276 |     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L270-L276"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`WindowIdentifierType::set_parent_of` calls `xlib::Xlib::open().unwrap()`. `Xlib::open()` dlopen()s `libX11.so.6` at\nruntime and returns `Err` when it is not present or has an unexpected soname - a real possibility in minimal\ncontainers/flatpaks that ship only a Wayland stack while GTK still reports an X11 display (XWayland-less setups, or\n`gdk4-x11` linked but `libX11.so.6` absent because only `libX11.so.6.4.0` is installed without the dev symlink).\n`set_parent_of` returns `bool` and already returns `false` for other failures, so panicking here is inconsistent as\nwell as avoidable. Secondarily, this dlopen()s and relocates Xlib on *every* call rather than once.","fix":"Handle the error and cache the handle:\n\n```rust\nstatic XLIB: OnceLock<Option<xlib::Xlib>> = OnceLock::new();\nlet Some(xlib_handle) = XLIB.get_or_init(|| xlib::Xlib::open().ok()).as_ref() else {\n    #[cfg(feature = \"tracing\")]\n    tracing::warn!(\"Failed to load Xlib\");\n    return false;\n};\n```","locations":[{"ref":"client/src/window_identifier/mod.rs:434-439","code":"  434 |                 unsafe {\n  435 |                     // Based on GNOME's libgxdp -\n  436 |                     // https://gitlab.gnome.org/GNOME/libgxdp/-/blob/e6c11f2812cad0a43e847ec97bfc1c67bf50be52/src/gxdp-external-window-x11.c#L90-105\n  437 |                     let xdisplay = display.xdisplay();\n  438 |                     let xlib_handle = xlib::Xlib::open().unwrap();\n  439 |                     (xlib_handle.XSetTransientForHint)(xdisplay, surface.xid(), *xid);","lines":6,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/mod.rs#L434-L439"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`WaylandWindowIdentifier::new_inner` spawns a thread that calls `sender.send(...).unwrap()` on a\n`futures_channel::oneshot::Sender`. `send` returns `Err` whenever the receiver has been dropped, which happens any time\nthe caller drops the `from_wayland`/`from_raw` future - `tokio::select!`, `futures::future::select`, a timeout, or a\ncancelled task. The panic then happens on a detached thread (aborting the whole process under `panic = \"abort\"`, which\nis a common release profile) for a completely benign situation.","fix":"Ignore the send result:\n\n```rust\n// before\nOk(window_handle) => sender.send(Some(window_handle)).unwrap(),\n// after\nOk(window_handle) => { let _ = sender.send(Some(window_handle)); }\n```\n\nand likewise `let _ = sender.send(None);` in the error arm.","locations":[{"ref":"client/src/window_identifier/wayland.rs:89-96","code":"   89 |         std::thread::spawn(move || match wayland_export_handle(conn, &surface) {\n   90 |             Ok(window_handle) => sender.send(Some(window_handle)).unwrap(),\n   91 |             Err(_err) => {\n   92 |                 #[cfg(feature = \"tracing\")]\n   93 |                 tracing::info!(\"Could not get wayland window identifier: {_err}\");\n   94 |                 sender.send(None).unwrap();\n   95 |             }\n   96 |         });","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L89-L96"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`build_with_connection` panics via `.expect(\"Must provide a spawner when not using tokio\")` when the\n`tokio` feature is off and `with_spawn` was never called, even though the function returns\n`Result<()>` and could report the misconfiguration as an error. A library should not abort the\ncaller's process for a recoverable API misuse.","fix":"Return an error instead:\n\n```rust\n        #[cfg(not(feature = \"tokio\"))]\n        let spawn = self.spawn.ok_or_else(|| {\n            crate::PortalError::Failed(\"A spawner must be provided via `Builder::with_spawn`\".into())\n        })?;\n```","locations":[{"ref":"client/src/backend/builder.rs:222-229","code":"  222 |     pub async fn build_with_connection(self, connection: zbus::Connection) -> Result<()> {\n  223 |         #[cfg(feature = \"tokio\")]\n  224 |         let spawn = self.spawn.unwrap_or(Arc::new(super::spawn::TokioSpawner));\n  225 | \n  226 |         #[cfg(not(feature = \"tokio\"))]\n  227 |         let spawn = self\n  228 |             .spawn\n  229 |             .expect(\"Must provide a spawner when not using tokio\");","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/builder.rs#L222-L229"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`TokioSpawner::spawn_obj` unconditionally returns `Ok(())` and calls `tokio::spawn`, which panics\nwhen there is no entered Tokio runtime. Since the spawner is only used from `Request`'s close\ncallback (`client/src/backend/request.rs:51-59`), which explicitly handles\n`Err(SpawnError)` by logging, a missing runtime turns a recoverable condition into a panic inside a\nD-Bus method handler.","fix":"Check for a runtime handle first:\n\n```rust\nmatch tokio::runtime::Handle::try_current() {\n    Ok(handle) => { handle.spawn(future); Ok(()) }\n    Err(_) => Err(futures_util::task::SpawnError::shutdown()),\n}\n```","locations":[{"ref":"client/src/backend/spawn.rs:4-13","code":"    4 | #[cfg(feature = \"tokio\")]\n    5 | impl futures_util::task::Spawn for TokioSpawner {\n    6 |     fn spawn_obj(\n    7 |         &self,\n    8 |         future: futures_util::task::FutureObj<'static, ()>,\n    9 |     ) -> std::result::Result<(), futures_util::task::SpawnError> {\n   10 |         tokio::spawn(future);\n   11 |         Ok(())\n   12 |     }\n   13 | }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/backend/spawn.rs#L4-L13"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`HandleToken::default()` calls `getrandom::fill(&mut rnd_bytes).expect(\"failed to generate\nrandom bytes\")`. `Default::default()` for the various `*Options` structs is on the hot path of\nessentially every portal call in the crate, so an OS entropy failure (e.g. a sandbox that\nblocks `getrandom`/`/dev/urandom`, seccomp-filtered syscall) aborts the whole application from\ninside an infallible-looking `Default` impl.","fix":"Add a fallible constructor (`HandleToken::try_new() -> Result<Self, Error>`) used by the\noption builders, or fall back to a non-cryptographic but unique token\n(process id + monotonically increasing counter) when `getrandom::fill` fails, instead of\npanicking inside `Default`.","locations":[{"ref":"client/src/desktop/handle_token.rs:35-52","code":"   35 | impl Default for HandleToken {\n   36 |     fn default() -> Self {\n   37 |         const ALPHANUMERIC: &[u8] =\n   38 |             b\"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789\";\n   39 | \n   40 |         let mut token = String::with_capacity(16); // \"ashpd_\" + 10 chars\n   41 |         token.push_str(\"ashpd_\");\n   42 | \n   43 |         let mut rnd_bytes = [0u8; 10];\n   44 |         getrandom::fill(&mut rnd_bytes).expect(\"failed to generate random bytes\");\n   45 | \n   46 |         for byte in rnd_bytes.iter() {\n   47 |             let idx = (*byte as usize) % ALPHANUMERIC.len();\n   48 |             token.push(ALPHANUMERIC[idx] as char);\n   49 |         }\n   50 | \n   51 |         Self(token)\n   52 |     }","lines":18,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/handle_token.rs#L35-L52"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"The `Deserialize` impl for `Icon` panics on malformed input instead of returning a serde error:\n`data.downcast_ref::<zvariant::Str>().unwrap()` (line 114),\n`data.downcast_ref::<zvariant::Array>().unwrap()` (lines 120 and 128),\n`byte.downcast_ref::<u8>().unwrap()` (line 123),\n`value.downcast_ref::<zvariant::Str>().unwrap()` (line 131) and\n`data.downcast_ref::<zvariant::Fd>().unwrap()` (line 137).\n`Icon` is a public type implementing `Deserialize`, so any user deserializing an\nuntrusted/foreign `(sv)` (e.g. a portal backend reading an app-provided notification icon)\ngets a panic rather than a `Result::Err`, even though the function already returns\n`Result<Self, D::Error>` and the fallback arm at line 144 correctly uses `de::Error::custom`.","fix":"Replace each `downcast_ref::<T>().unwrap()` with\n`.map_err(|e| serde::de::Error::custom(format!(\"invalid icon payload: {e}\")))?`, matching the\nstyle already used for `Uri::parse` on line 116.","locations":[{"ref":"client/src/desktop/icon.rs:111-144","code":"  111 |         let (type_, data) = <(String, OwnedValue)>::deserialize(deserializer)?;\n  112 |         match type_.as_str() {\n  113 |             \"file\" => {\n  114 |                 let uri_str = data.downcast_ref::<zvariant::Str>().unwrap();\n  115 |                 let uri = Uri::parse(uri_str.as_str())\n  116 |                     .map_err(|e| serde::de::Error::custom(format!(\"Invalid URI: {}\", e)))?;\n  117 |                 Ok(Self::Uri(uri))\n  118 |             }\n  119 |             \"bytes\" => {\n  120 |                 let array = data.downcast_ref::<zvariant::Array>().unwrap();\n  121 |                 let mut bytes = Vec::with_capacity(array.len());\n  122 |                 for byte in array.inner() {\n  123 |                     bytes.push(byte.downcast_ref::<u8>().unwrap());\n  124 |                 }\n  125 |                 Ok(Self::Bytes(bytes))\n  126 |             }\n  127 |             \"themed\" => {\n  128 |                 let array = data.downcast_ref::<zvariant::Array>().unwrap();\n  129 |                 let mut names = Vec::with_capacity(array.len());\n  130 |                 for value in array.inner() {\n  131 |                     let name = value.downcast_ref::<zvariant::Str>().unwrap();\n  132 |                     names.push(name.as_str().to_owned());\n  133 |                 }\n  134 |                 Ok(Self::Names(names))\n  135 |             }\n  136 |             \"file-descriptor\" => {\n  137 |                 let fd = data.downcast_ref::<zvariant::Fd>().unwrap();\n  138 |                 Ok(Self::FileDescriptor(\n  139 |                     fd.as_fd()\n  140 |                         .try_clone_to_owned()\n  141 |                         .expect(\"Failed to clone file descriptor\"),\n  142 |                 ))\n  143 |             }\n  144 |             _ => Err(de::Error::custom(\"Invalid Icon type\")),","lines":34,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/icon.rs#L111-L144"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Decoding an `Icon::FileDescriptor` calls\n`fd.as_fd().try_clone_to_owned().expect(\"Failed to clone file descriptor\")` in two places.\n`try_clone_to_owned` performs `dup`/`F_DUPFD_CLOEXEC`, which fails with `EMFILE`/`ENFILE` when\nthe process hits its file-descriptor limit - a realistic condition for long-running apps -\nand both call sites are inside functions that already return `Result`.","fix":"Propagate the error instead of panicking: in the `Deserialize` impl use\n`.map_err(serde::de::Error::custom)?`, and in `TryFrom<&OwnedValue>` map it to a\n`crate::Error` variant (e.g. via `Error::IO`/`Error::ParseError`).","locations":[{"ref":"client/src/desktop/icon.rs:136-143","code":"  136 |             \"file-descriptor\" => {\n  137 |                 let fd = data.downcast_ref::<zvariant::Fd>().unwrap();\n  138 |                 Ok(Self::FileDescriptor(\n  139 |                     fd.as_fd()\n  140 |                         .try_clone_to_owned()\n  141 |                         .expect(\"Failed to clone file descriptor\"),\n  142 |                 ))\n  143 |             }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/icon.rs#L136-L143"},{"ref":"client/src/desktop/icon.rs:181-188","code":"  181 |             \"file-descriptor\" => {\n  182 |                 let fd = fields[1].downcast_ref::<zvariant::Fd>().unwrap();\n  183 |                 Ok(Self::FileDescriptor(\n  184 |                     fd.as_fd()\n  185 |                         .try_clone_to_owned()\n  186 |                         .expect(\"Failed to clone file descriptor\"),\n  187 |                 ))\n  188 |             }","lines":8,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/icon.rs#L181-L188"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`LocationProxy::create_session` locally predicts the session object path from the\n`session_handle_token` and then asserts that the portal returned exactly that path with\n`assert_eq!(proxy.path(), &path.into_inner())`. A portal implementation that returns a different\n(but perfectly usable) object path aborts the calling task with a panic instead of surfacing a\nrecoverable `Error`. The crate is a client for an out-of-process, third-party-implementable\nservice, so remote input must not be able to panic the client. The same anti-pattern exists in six\nsibling portals (`screencast.rs:479`, `remote_desktop.rs:349`, `global_shortcuts.rs:277`,\n`inhibit.rs:201`, `input_capture.rs:849`/`915`), so a shared fix is worthwhile.","fix":"Replace the assertion with an error return, e.g.\n\n```rust\nlet path = path.into_inner();\nif proxy.path() != &path {\n    return Err(Error::UnexpectedSessionHandle); // or reuse Error::ParseError(\"...\")\n}\n```\n\nBetter still, build the `Session` from the path the portal actually returned instead of guessing it\nlocally, and factor the check into one helper shared by all six session portals.","locations":[{"ref":"client/src/desktop/location.rs:281-287","code":"  281 |         let (path, proxy) = futures_util::try_join!(\n  282 |             self.0.call::<OwnedObjectPath>(\"CreateSession\", &(options)),\n  283 |             Session::from_unique_name(self.0.connection().clone(), &options.session_handle_token),\n  284 |         )?;\n  285 |         assert_eq!(proxy.path(), &path.into_inner());\n  286 |         Ok(proxy)\n  287 |     }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/location.rs#L281-L287"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Three builder setters call `.try_to_owned().unwrap()` on a `Value`. For `Notification::sound` the\nvalue wraps a *borrowed* file descriptor, and `Value::try_to_owned` on an `Fd` performs a\n`dup(2)` (`BorrowedFd::try_clone_to_owned`), which fails with `EMFILE`/`ENFILE` when the process or\nsystem fd table is full. On that path the setter panics instead of returning an error. The same\n`unwrap()` in `Notification::default_action_target` and `Button::target` is reachable whenever the\ncaller passes a `Value` that contains an `Fd` (both are generic over `T: Into<Value<'a>>`).","fix":"Either store the value lazily and let serialization report the error, or store an owned fd up\nfront so no `dup` is needed:\n\n```rust\npub fn sound(mut self, sound: impl Into<Option<std::os::fd::OwnedFd>>) -> Self { .. }\n```\n\nAt minimum, replace `.unwrap()` with `.expect(\"failed to duplicate the sound file descriptor\")` so\nthe panic message is diagnosable, or change the setters to return\n`Result<Self, Error>`.","locations":[{"ref":"client/src/desktop/notification.rs:344-348","code":"  344 |         self.sound = sound.into().map(|s| {\n  345 |             zbus::zvariant::Value::from(zbus::zvariant::Fd::from(s.as_fd()))\n  346 |                 .try_to_owned()\n  347 |                 .unwrap()\n  348 |         });","lines":5,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L344-L348"},{"ref":"client/src/desktop/notification.rs:386-389","code":"  386 |         self.default_action_target = default_action_target\n  387 |             .into()\n  388 |             .map(|t| t.into().try_to_owned().unwrap());\n  389 |         self","lines":4,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L386-L389"},{"ref":"client/src/desktop/notification.rs:514-516","code":"  514 |     pub fn target<'a, T: Into<Value<'a>>>(mut self, target: impl Into<Option<T>>) -> Self {\n  515 |         self.target = target.into().map(|t| t.into().try_to_owned().unwrap());\n  516 |         self","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/notification.rs#L514-L516"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"The `proxy_resolver` module doc example does `ashpd::Uri::parse(\"www.google.com\").unwrap()`.\n`Uri::from_str` rejects any string that does not contain `:`, so this returns\n`Err(ParseError::MissingScheme)` and the example panics if anyone runs it. It is marked `no_run`, so CI\nnever catches it, but users copy-paste doc examples verbatim.","fix":"Use a URI with a scheme:\n\n```rust\nlet url = ashpd::Uri::parse(\"https://www.google.com\").unwrap();\n```","locations":[{"ref":"client/src/desktop/proxy_resolver.rs:9","code":"    9 | //!     let url = ashpd::Uri::parse(\"www.google.com\").unwrap();","lines":1,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/proxy_resolver.rs#L9"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`impl From<(ResponseType, Option<T>)> for Response<T>` calls `.expect(\"Expected a valid response, found\nnothing.\")` when the tuple is `(ResponseType::Success, None)`. The impl is `#[doc(hidden)]` but still\n`pub`, so any downstream code (and any future in-crate caller) that constructs the tuple by hand gets a\npanic instead of an error.","fix":"Make the conversion fallible - `impl TryFrom<(ResponseType, Option<T>)> for Response<T>` returning\n`Err(Error::NoResponse)` for the `(Success, None)` case - and use `?` in the `Deserialize` impl, or make\nthe impl `pub(crate)` by moving the logic into a private helper function.","locations":[{"ref":"client/src/desktop/request.rs:133-143","code":"  133 | impl<T> From<(ResponseType, Option<T>)> for Response<T> {\n  134 |     fn from(f: (ResponseType, Option<T>)) -> Self {\n  135 |         match f.0 {\n  136 |             ResponseType::Success => {\n  137 |                 Response::Ok(f.1.expect(\"Expected a valid response, found nothing.\"))\n  138 |             }\n  139 |             ResponseType::Cancelled => Response::Err(ResponseError::Cancelled),\n  140 |             ResponseType::Other => Response::Err(ResponseError::Other),\n  141 |         }\n  142 |     }\n  143 | }","lines":11,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/request.rs#L133-L143"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Proxy::unique_name` does `connection.unique_name().unwrap()`. `zbus::Connection::unique_name()` returns `None` for\npeer-to-peer connections (`Connection::builder().p2p()`) and for connections that have not completed the `Hello`\nhandshake. The crate exposes `*_with_connection` constructors everywhere and lets the caller supply an arbitrary\n`zbus::Connection`, so a p2p connection - exactly what the `backend` feature encourages for portal backend\nimplementations talking directly to a peer - turns a request into a panic instead of an `Error`.","fix":"Return an error instead:\n\n```rust\nlet unique_name = connection\n    .unique_name()\n    .ok_or_else(|| Error::InvalidObjectPath(\"connection has no unique name\".into()))?;\n```\n\n(using whatever existing `Error` variant fits, e.g. wrapping `zbus::Error::MissingParameter`).","locations":[{"ref":"client/src/proxy.rs:46-55","code":"   46 |     pub async fn unique_name(\n   47 |         connection: &zbus::Connection,\n   48 |         prefix: &str,\n   49 |         handle_token: &HandleToken,\n   50 |     ) -> Result<ObjectPath<'static>, Error> {\n   51 |         let unique_name = connection.unique_name().unwrap();\n   52 |         let unique_identifier = unique_name.trim_start_matches(':').replace('.', \"_\");\n   53 |         ObjectPath::try_from(format!(\"{prefix}/{unique_identifier}/{handle_token}\"))\n   54 |             .map_err(From::from)\n   55 |     }","lines":10,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/proxy.rs#L46-L55"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`WaylandWindowIdentifier::new_inner` ends with `receiver.await.unwrap()`. The oneshot `Receiver` resolves to `Err`\nwhen the sender is dropped without sending, which happens if the spawned thread panics - and it can, e.g. through the\n`sender.send(..).unwrap()` on the same lines, or any panic inside `wayland_export_handle`. The result is a second\npanic in the caller's async context rather than a graceful `None`.","fix":"```rust\n// before\nreceiver.await.unwrap()\n// after\nreceiver.await.ok().flatten()\n```","locations":[{"ref":"client/src/window_identifier/wayland.rs:98-99","code":"   98 |         receiver.await.unwrap()\n   99 |     }","lines":2,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L98-L99"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"very_easy","description":"The module-level example unwraps an optional value that the specification explicitly marks as\noptional: `let (x, y) = activated.cursor_position().unwrap();`. A portal that omits the\n`cursor_position` key from the `Activated` signal makes this copy-pasted-by-users code panic\ninside the capture loop.","fix":"Handle the `None` case in the example, e.g.\n```rust\nlet Some((x, y)) = activated.cursor_position() else {\n    input_capture.release(&session, ReleaseOptions::default()\n        .set_activation_id(activated.activation_id())).await?;\n    continue;\n};\n```","locations":[{"ref":"client/src/desktop/input_capture.rs:274-276","code":"  274 | //!         eprintln!(\"releasing input capture\");\n  275 | //!         let (x, y) = activated.cursor_position().unwrap();\n  276 | //!         let (x, y) = (x as f64, y as f64);","lines":3,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/input_capture.rs#L274-L276"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"`Drop for WaylandHandle` exists precisely to `destroy()` the `xdg_activation_token_v1` object, but\n`wayland_export_token` does `state.wl_token.take()`, moving the proxy out of the state so `Drop`\nnever sees it. wayland-client's generated proxies have no `Drop` impl (destructors must be sent\nexplicitly), so the `xdg_activation_token_v1` object is never destroyed: every call to\n`ActivationToken::from_surface`/`from_wayland_raw*` leaks one protocol object (client-side id +\ncompositor-side resource) on the application's long-lived Wayland connection.","fix":"Borrow instead of taking, so the `Drop` impl still owns and destroys it:\n\n```rust\n    if let Some(wl_token) = state.wl_token.as_ref() {\n```\n\n(everything in the block already works through `&XdgActivationTokenV1`; note `state` must stay alive\nuntil after the second `roundtrip`, which it does.)","locations":[{"ref":"client/src/activation_token/wayland.rs:246-261","code":"  246 |     event_queue.roundtrip(&mut state)?;\n  247 | \n  248 |     if let Some(wl_token) = state.wl_token.take() {\n  249 |         if let Some(app_id) = app_id {\n  250 |             wl_token.set_app_id(app_id.to_string());\n  251 |         }\n  252 |         wl_token.set_surface(surface);\n  253 |         if let Some(serial) = serial\n  254 |             && let Some(seat) = seat\n  255 |         {\n  256 |             wl_token.set_serial(serial, seat);\n  257 |         }\n  258 |         wl_token.commit();\n  259 | \n  260 |         event_queue.roundtrip(&mut state)?;\n  261 |     };","lines":16,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/activation_token/wayland.rs#L246-L261"},{"ref":"client/src/activation_token/wayland.rs:22-28","code":"   22 | impl Drop for WaylandHandle {\n   23 |     fn drop(&mut self) {\n   24 |         if let Some(wl_token) = self.wl_token.take() {\n   25 |             wl_token.destroy();\n   26 |         }\n   27 |     }\n   28 | }","lines":7,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/activation_token/wayland.rs#L22-L28"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"hard","description":"`Session<T>` has no `Drop` implementation and `close()` is the only way to end a session. If a caller\ndrops a `Session` (early return, `?`, panic, or simply forgetting), the portal-side session object stays\nalive for the whole lifetime of the D-Bus connection - for ScreenCast/RemoteDesktop that means an active\ncapture and compositor resources are never released. There is also no state tracking, so `close()` may be\ncalled twice (the second call fails with an `UnknownObject`/`UnknownMethod` D-Bus error) and calling it on\na session the portal already closed via the `Closed` signal produces the same confusing error.","fix":"Add a `Drop` impl that fires `Close` in a detached task (the crate already carries a\n`futures_util::task::Spawn` in the backend, and `zbus::Connection` can `spawn` a send-only method call),\nand keep an `AtomicBool`/`is_closed()` flag so `close()` is idempotent and `Closed` signal handling can\nmark the session dead. If closing on drop is deliberately not wanted, document it explicitly on\n`Session` and provide `is_closed()`.","locations":[{"ref":"client/src/desktop/session.rs:76-90","code":"   76 |     /// Closes the portal session to which this object refers and ends all\n   77 |     /// related user interaction (dialogs, etc).\n   78 |     ///\n   79 |     /// # Specifications\n   80 |     ///\n   81 |     /// See also [`Close`](https://flatpak.github.io/xdg-desktop-portal/docs/doc-org.freedesktop.portal.Session.html#org-freedesktop-portal-session-close).\n   82 |     #[doc(alias = \"Close\")]\n   83 |     pub async fn close(&self) -> Result<(), Error> {\n   84 |         self.0.call(\"Close\", &()).await\n   85 |     }\n   86 | \n   87 |     pub(crate) fn path(&self) -> &ObjectPath<'_> {\n   88 |         self.0.path()\n   89 |     }\n   90 | }","lines":15,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/session.rs#L76-L90"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`WaylandWindowIdentifier` documents that \"the exported surface handle will be unexported on `Drop`\"\n(`client/src/window_identifier/mod.rs:42-43`), but for the `from_raw` path it never is:\n\n- `wayland_export_handle(conn, surface)` takes the `Connection` **by value** and drops it (together with the\n  `EventQueue`) when it returns. Only `exported` is kept in the returned struct, and wayland-client protocol objects\n  hold a `WeakBackend`.\n- For `from_raw` the backend is a brand new one created by `Backend::from_foreign_display`, so that `Connection` holds\n  the *only* strong reference. Dropping it runs `ConnectionState::drop`, which calls `wl_proxy_destroy` on every known\n  proxy - including the `zxdg_exported_v1/v2` object - **without** sending the protocol `destroy` request. The\n  compositor therefore keeps the export alive forever, and the later `Exported::destroy()` in `Drop` is a silent no-op\n  because `backend.upgrade()` fails (`wayland_client::Weak::upgrade` returns `InvalidId`). The\n  `tracing::debug!(\"Unexporting handle: {handle}\")` line then logs a lie.\n- Even on the `new()` path (where the application keeps the backend alive) `destroy()` is only buffered: there is no\n  `conn.flush()`, so the unexport happens only if/when the application's own event loop flushes.","fix":"Store the `wayland_client::Connection` inside `WaylandWindowIdentifier` so the backend outlives the exported object,\nand flush after destroying:\n\n```rust\npub struct WaylandWindowIdentifier {\n    conn: wayland_client::Connection,\n    exported: Exported,\n    type_: WindowIdentifierType,\n}\n\nimpl Drop for WaylandWindowIdentifier {\n    fn drop(&mut self) {\n        self.exported.destroy();\n        let _ = self.conn.flush();\n    }\n}\n```","locations":[{"ref":"client/src/window_identifier/wayland.rs:228-271","code":"  228 | fn wayland_export_handle(\n  229 |     conn: wayland_client::Connection,\n  230 |     surface: &WlSurface,\n  231 | ) -> Result<WaylandWindowIdentifier, Box<dyn std::error::Error>> {\n  232 |     let display = conn.display();\n  233 |     let mut event_queue = conn.new_event_queue();\n  234 |     let qhandle = event_queue.handle();\n  235 |     let mut state = State::default();\n  236 |     display.get_registry(&qhandle, ());\n  237 |     event_queue.roundtrip(&mut state)?;\n  238 | \n  239 |     let exported = match state.exporter.take() {\n  240 |         Some(Exporter::V2(exporter)) => {\n  241 |             let exp = exporter.export_toplevel(surface, &qhandle, ());\n  242 |             event_queue.roundtrip(&mut state)?;\n  243 |             exporter.destroy();\n  244 | \n  245 |             Some(Exported::V2(exp))\n  246 |         }\n  247 |         Some(Exporter::V1(exporter)) => {\n  248 |             let exp = exporter.export(surface, &qhandle, ());\n  249 |             event_queue.roundtrip(&mut state)?;\n  250 |             exporter.destroy();\n  251 | \n  252 |             Some(Exported::V1(exp))\n  253 |         }\n  254 |         None => {\n  255 |             #[cfg(feature = \"tracing\")]\n  256 |             tracing::error!(\n  257 |                 \"The compositor does not support the zxdg_exporter_v1 nor zxdg_exporter_v2 protocols\"\n  258 |             );\n  259 |             None\n  260 |         }\n  261 |     };\n  262 | \n  263 |     if let Some(exported) = exported {\n  264 |         Ok(WaylandWindowIdentifier {\n  265 |             exported,\n  266 |             type_: WindowIdentifierType::Wayland(state.handle),\n  267 |         })\n  268 |     } else {\n  269 |         Err(Box::new(crate::Error::NoResponse))\n  270 |     }\n  271 | }","lines":44,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L228-L271"},{"ref":"client/src/window_identifier/wayland.rs:108-116","code":"  108 | impl Drop for WaylandWindowIdentifier {\n  109 |     fn drop(&mut self) {\n  110 |         self.exported.destroy();\n  111 |         #[cfg(feature = \"tracing\")]\n  112 |         if let WindowIdentifierType::Wayland(ref handle) = self.type_ {\n  113 |             tracing::debug!(\"Unexporting handle: {handle}\");\n  114 |         }\n  115 |     }\n  116 | }","lines":9,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/window_identifier/wayland.rs#L108-L116"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"hard","description":"`Request<T>` has no `Drop` impl and never calls `Close` automatically. If the future returned by\n`Proxy::request` is dropped before the `Response` signal arrives (task cancellation, `select!`, timeout),\nthe portal-side `Request` object and its dialog stay alive forever: the client is gone but the portal\nnever learns it should end the interaction. The doc comment on `close()` documents the manual path but\nnothing wires it to cancellation.","fix":"Give `Request<T>` a `Drop` impl that spawns a fire-and-forget `Close` call when no response has been\nstored yet (`self.2.get_mut().is_none()`), or wrap the await in `Proxy::request` in a guard that calls\n`close()` on cancellation.","locations":[{"ref":"client/src/desktop/request.rs:210-228","code":"  210 | impl<T> Request<T>\n  211 | where\n  212 |     T: for<'de> Deserialize<'de> + Type + Debug,\n  213 | {\n  214 |     pub(crate) async fn with_connection<P>(\n  215 |         connection: zbus::Connection,\n  216 |         path: P,\n  217 |     ) -> Result<Request<T>, Error>\n  218 |     where\n  219 |         P: TryInto<ObjectPath<'static>>,\n  220 |         P::Error: Into<zbus::Error>,\n  221 |     {\n  222 |         let proxy =\n  223 |             Proxy::new_desktop_with_path(connection, \"org.freedesktop.portal.Request\", path)\n  224 |                 .await?;\n  225 |         // Start listening for a response signal the moment request is created\n  226 |         let stream = proxy.receive_signal(\"Response\").await?;\n  227 |         Ok(Self(proxy, stream, Default::default(), PhantomData))\n  228 |     }","lines":19,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/desktop/request.rs#L210-L228"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`UpdateMonitor` wraps a portal-side object created by `CreateUpdateMonitor` that is only released\nby `Close` (`client/src/flatpak/update_monitor.rs:225-227`). There is no `Drop` impl and the\nmodule example never calls `monitor.close()`, so every dropped `UpdateMonitor` leaves an object\nregistered in the flatpak portal (and a live `Progress`/`UpdateAvailable` match rule on the bus)\nuntil the whole D-Bus connection goes away. Long-running apps that create monitors repeatedly\naccumulate them.","fix":"Add `monitor.close().await?;` to the module example, and document on the type that `close()` must\nbe called; alternatively spawn a detached `Close` call from a `Drop` impl the way the crate does\nfor `WaylandWindowIdentifier` (`client/src/window_identifier/wayland.rs:108`).","locations":[{"ref":"client/src/flatpak/update_monitor.rs:6-27","code":"    6 | //! ```rust,no_run\n    7 | //! use ashpd::flatpak::Flatpak;\n    8 | //! use futures_util::StreamExt;\n    9 | //!\n   10 | //! async fn run() -> ashpd::Result<()> {\n   11 | //!     let proxy = Flatpak::new().await?;\n   12 | //!\n   13 | //!     let monitor = proxy.create_update_monitor(Default::default()).await?;\n   14 | //!     let info = monitor.receive_update_available().await?;\n   15 | //!\n   16 | //!     monitor.update(None, Default::default()).await?;\n   17 | //!     let progress = monitor\n   18 | //!         .receive_progress()\n   19 | //!         .await?\n   20 | //!         .next()\n   21 | //!         .await\n   22 | //!         .expect(\"Stream exhausted\");\n   23 | //!     println!(\"{:#?}\", progress);\n   24 | //!\n   25 | //!     Ok(())\n   26 | //! }\n   27 | //! ```","lines":22,"link":"https://github.com/bilelmoussaoui/ashpd/blob/000a5ca994c19c95c3adb505df5db89670015a7d/client/src/flatpak/update_monitor.rs#L6-L27"},{"ref":"client/src/flatpak/update_monitor.rs:219-228","code":"
