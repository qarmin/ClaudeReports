<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`child.registry_key().unwrap()` panics if `CM_Open_DevNode_Key` fails. `registry_key()` returns `Option<RegKey>` (returning `None` on any `CONFIGRET` failure or `INVALID_HANDLE_VALUE`), which is a genuinely fallible enumeration/TOCTOU path (the device can be removed between discovery and this call). An enumeration/claim operation should surface an `Error`, not abort the whole process.","fix":"Replace the `.unwrap()` with error propagation, e.g.:\n```rust\nlet reg_key = child.registry_key().ok_or_else(|| Error::new(\n    ErrorKind::Unsupported,\n    \"could not open registry key for interface\",\n))?;\n```","locations":[{"ref":"src/platform/windows_winusb/enumeration.rs:275","code":"  275 |     let reg_key = child.registry_key().unwrap();","lines":1,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/enumeration.rs#L275"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"If epoll initialization fails, `create_inner` panics while returning an error instead of propagating\nit. `create_inner` builds the `Arc<LinuxDevice>` (via `Arc::new_cyclic`, which already inserted the\ndevice into `DEVICES`) and then calls `events::register_fd`. The first `register_fd` call is what\nlazily initializes `EPOLL_FD` via `get_or_try_init`; if `epoll::create` fails, `register_fd` returns\n`Err` and the `?` drops the freshly-created `arc`. `LinuxDevice::drop` then calls\n`events::unregister_fd(self.fd.as_fd())`, which does `EPOLL_FD.get().unwrap()`. Since `EPOLL_FD` was\nnever initialized, `.get()` returns `None` and `.unwrap()` panics. The same panic occurs in any code\npath that reaches `unregister_fd` before `EPOLL_FD` is set.","fix":"Make `unregister_fd` tolerate an uninitialized epoll:\n```rust\npub(super) fn unregister_fd(fd: BorrowedFd) {\n    if let Some(epoll_fd) = EPOLL_FD.get() {\n        epoll::delete(epoll_fd, fd).ok();\n    }\n}\n```","locations":[{"ref":"src/platform/linux_usbfs/events.rs:82-85","code":"   82 | pub(super) fn unregister_fd(fd: BorrowedFd) {\n   83 |     let epoll_fd = EPOLL_FD.get().unwrap();\n   84 |     epoll::delete(epoll_fd, fd).ok();\n   85 | }","lines":4,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/events.rs#L82-L85"},{"ref":"src/platform/linux_usbfs/device.rs:620-627","code":"  620 | impl Drop for LinuxDevice {\n  621 |     fn drop(&mut self) {\n  622 |         debug!(\"Closing device {}\", self.events_id);\n  623 |         events::unregister_fd(self.fd.as_fd());\n  624 |         events::unregister_fd(self.timerfd.as_fd());\n  625 |         DEVICES.lock().unwrap().remove(self.events_id);\n  626 |     }\n  627 | }","lines":8,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/device.rs#L620-L627"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`event_loop` panics (`panic!(\"epoll::wait failed: {e}\")`) on any `epoll::wait` error other than\n`EINTR`, and `register_fd` panics via `.spawn(event_loop).unwrap()` if the event thread fails to spawn.\nBecause there is exactly one global event thread, if it panics or fails to start, every pending and\nfuture transfer on every device hangs forever (their wakers/threads are never notified) rather than\nfailing cleanly. A `reap`/dispatch panic inside a handler would have the same effect.","fix":"Handle `epoll::wait` errors without aborting the loop (log and `continue`, treating unexpected errnos\nlike `EINTR`), and propagate a thread-spawn failure as an `Error` from `register_fd` instead of\n`unwrap()`. Consider catching panics in the per-event dispatch so one bad event cannot take down the\nwhole loop.","locations":[{"ref":"src/platform/linux_usbfs/events.rs:87-95","code":"   87 | fn event_loop() {\n   88 |     let epoll_fd = EPOLL_FD.get().unwrap();\n   89 |     let mut event_buf = [MaybeUninit::<epoll::Event>::uninit(); 4];\n   90 |     loop {\n   91 |         let events = match epoll::wait(epoll_fd, &mut event_buf, None) {\n   92 |             Ok((events, _)) => events,\n   93 |             Err(Errno::INTR) => &mut [],\n   94 |             Err(e) => panic!(\"epoll::wait failed: {e}\"),\n   95 |         };","lines":9,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/events.rs#L87-L95"},{"ref":"src/platform/linux_usbfs/events.rs:69-74","code":"   69 |     if start_thread {\n   70 |         thread::Builder::new()\n   71 |             .name(\"nusb-events\".into())\n   72 |             .spawn(event_loop)\n   73 |             .unwrap();\n   74 |     }","lines":6,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/events.rs#L69-L74"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`control_in`/`control_out` compute the timeout with `timeout.as_millis().try_into().expect(\"timeout too long\")`. `Duration::as_millis()` returns `u128` and the target field `IOUSBDevRequestTO::completionTimeout` is `UInt32` (`u32`), so any timeout greater than ~49.7 days panics. A caller that passes a very large or effectively \"infinite\" `Duration` (e.g. `Duration::from_secs(u64::MAX)`) will crash instead of getting a long/never timeout.","fix":"Saturate instead of panicking, e.g. `let timeout = timeout.as_millis().min(u32::MAX as u128) as u32;` (IOKit treats `0` as no-timeout, and any large value is effectively unbounded), so oversized durations clamp rather than abort the process.","locations":[{"ref":"src/platform/macos_iokit/device.rs:275","code":"  275 |         let timeout = timeout.as_millis().try_into().expect(\"timeout too long\");","lines":1,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/device.rs#L275"},{"ref":"src/platform/macos_iokit/device.rs:305","code":"  305 |         let timeout = timeout.as_millis().try_into().expect(\"timeout too long\");","lines":1,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/device.rs#L305"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Drop for WindowsInterface` calls `panic!(\"missing handle that should be open\")` when the expected `first_interface_number` entry is absent from `device.handles`. Panicking inside a `Drop` impl is dangerous: if the drop runs during unwinding of another panic, the process aborts. While the map invariant is expected to hold, a `Drop` should not panic; a lost/duplicate entry (e.g. from a future refactor or an unexpected state) would abort rather than degrade gracefully.","fix":"Replace the `panic!` with a logged error and early return, e.g. `let Entry::Occupied(mut entry) = ... else { log::error!(\"missing handle that should be open\"); return; };` so cleanup never aborts during unwinding.","locations":[{"ref":"src/platform/windows_winusb/device.rs:503-521","code":"  503 |         let mut handles = self.device.handles.lock().unwrap();\n  504 |         let Entry::Occupied(mut entry) = handles.entry(self.first_interface_number) else {\n  505 |             panic!(\"missing handle that should be open\")\n  506 |         };\n  507 | \n  508 |         entry\n  509 |             .get_mut()\n  510 |             .claimed_interfaces\n  511 |             .clear(self.interface_number);\n  512 | \n  513 |         if entry.get().claimed_interfaces.is_empty() {\n  514 |             entry.remove();\n  515 |         } else if is_first_interface {\n  516 |             log::debug!(\n  517 |                 \"Released interface {}, but retaining handle for shared use\",\n  518 |                 self.interface_number\n  519 |             );\n  520 |         }\n  521 |     }","lines":19,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/device.rs#L503-L521"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Every control transfer creates a threadpool timer via `Timer::new(...).expect(\"failed to create timer for control transfer\")`. `Timer::new` returns `Err(())` when `CreateThreadpoolTimer` fails (resource exhaustion). A failed timer creation aborts the process instead of failing the transfer with `TransferError`, turning a transient resource condition into a panic on a hot path.","fix":"Handle the `Err` case by completing the transfer with an error instead of panicking: on `Timer::new` failure set `t.error_from_submit = Err(TransferError::Unknown(...))` and `return t.simulate_complete();` (mirroring the invalid-argument early-return path above).","locations":[{"ref":"src/platform/windows_winusb/device.rs:725-728","code":"  725 |         let timer = unsafe {\n  726 |             Timer::new(timer_callback, ptr as *mut c_void)\n  727 |                 .expect(\"failed to create timer for control transfer\")\n  728 |         };","lines":4,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/device.rs#L725-L728"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Buffer::drop` for the `Mmap` allocator calls `rustix::mm::munmap(...).unwrap()`, so a failing `munmap` panics inside `Drop`. A panic in a destructor is especially bad (it can abort during unwinding). While `munmap` on a pointer/length that came from a successful `mmap` should not normally fail, an unexpected failure (e.g. a stale/partially-remapped region) becomes an abort rather than a logged error.","fix":"Avoid panicking in `Drop`; on `munmap` error, log it (e.g. via `tracing`/`log`) and continue instead of `.unwrap()`.","locations":[{"ref":"src/transfer/buffer.rs:289-293","code":"  289 |             #[cfg(any(target_os = \"linux\", target_os = \"android\"))]\n  290 |             Allocator::Mmap => unsafe {\n  291 |                 rustix::mm::munmap(self.ptr as *mut _, self.capacity as usize).unwrap();\n  292 |             },\n  293 |         }","lines":5,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/transfer/buffer.rs#L289-L293"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`ControlOut::setup_packet` panics via `expect` if the caller's data slice is longer than `u16::MAX`, since `wLength` is a `u16`:\n```\nself.data.len().try_into().expect(\"length must fit in u16\"),\n```\nA control-transfer OUT payload larger than 65535 bytes is invalid per USB, but taking user data directly and panicking (rather than returning a `TransferError::InvalidArgument`) turns an ordinary caller mistake into a process abort. `ControlIn::length` avoids this by being typed `u16`, so the asymmetry is a footgun.","fix":"Validate the length and surface it as an error (e.g. map to `TransferError::InvalidArgument`) rather than `expect`-panicking, or document the panic prominently on `ControlOut` as is already done for `Buffer::new`.","locations":[{"ref":"src/transfer/control.rs:85-95","code":"   85 |     pub(crate) fn setup_packet(&self) -> [u8; SETUP_PACKET_SIZE] {\n   86 |         pack_setup(\n   87 |             Direction::Out,\n   88 |             self.control_type,\n   89 |             self.recipient,\n   90 |             self.request,\n   91 |             self.value,\n   92 |             self.index,\n   93 |             self.data.len().try_into().expect(\"length must fit in u16\"),\n   94 |         )\n   95 |     }","lines":11,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/transfer/control.rs#L85-L95"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`TransferData::status` computes `self.urb().status.abs()` where `status` is a `c_int`. If the kernel\never reported `i32::MIN` as the status, `.abs()` panics in debug builds (overflow) and returns\n`i32::MIN` in release. Real usbfs statuses are small negative errnos so this is practically\nunreachable, but `abs()` on a `c_int` of unknown provenance is fragile.","fix":"Use `self.urb().status.unsigned_abs() as i32` or `wrapping_abs`, or clamp/handle `i32::MIN` explicitly,\nso an unexpected status value cannot panic.","locations":[{"ref":"src/platform/linux_usbfs/transfer.rs:149-158","code":"  149 |     pub fn status(&self) -> Result<(), TransferError> {\n  150 |         if self.urb().status == 0 {\n  151 |             return Ok(());\n  152 |         }\n  153 | \n  154 |         // It's sometimes positive, sometimes negative, but rustix panics if negative.\n  155 |         Err(errno_to_transfer_error(Errno::from_raw_os_error(\n  156 |             self.urb().status.abs(),\n  157 |         )))\n  158 |     }","lines":10,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/transfer.rs#L149-L158"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`add_event_source` panics with `\"source already registered\"` if a `CFRunLoopSource` is added to the run loop twice, and `EventRegistration::drop` does `event_loop.count -= 1` plus an `.expect(\"runloop should exist while events are registered\")`. These are internal invariants that should hold, but they turn any bookkeeping mistake (or a caller adding the same source object twice) into a hard process abort inside library code rather than a recoverable error.","fix":"These panics are defensible as invariant checks; if hardening is desired, downgrade the duplicate-source case to a `debug_assert!`/logged no-op and guard the `count -= 1` with a `saturating_sub` so a bookkeeping bug degrades gracefully instead of aborting.","locations":[{"ref":"src/platform/macos_iokit/events.rs:25-73","code":"   25 | pub(crate) fn add_event_source(source: CFRunLoopSource) -> EventRegistration {\n   26 |     let mut event_loop = EVENT_LOOP.lock().unwrap();\n   27 |     if let Some(runloop) = event_loop.runloop.as_ref() {\n   28 |         if runloop.contains_source(&source, unsafe { kCFRunLoopCommonModes }) {\n   29 |             panic!(\"source already registered\");\n   30 |         }\n   31 |         runloop.add_source(&source, unsafe { kCFRunLoopCommonModes });\n   32 |         event_loop.count += 1;\n   33 |     } else {\n   34 |         let (tx, rx) = mpsc::channel();\n   35 |         let source = SendCFRunLoopSource(source.clone());\n   36 |         info!(\"starting event loop thread\");\n   37 | \n   38 |         thread::Builder::new()\n   39 |             .name(\"nusb-events\".into())\n   40 |             .spawn(move || {\n   41 |                 let runloop = CFRunLoop::get_current();\n   42 |                 let source = source;\n   43 |                 runloop.add_source(&source.0, unsafe { kCFRunLoopCommonModes });\n   44 |                 tx.send(runloop).unwrap();\n   45 |                 CFRunLoop::run_current();\n   46 |                 info!(\"event loop thread exited\");\n   47 |             })\n   48 |             .unwrap();\n   49 | \n   50 |         event_loop.runloop = Some(rx.recv().expect(\"failed to start run loop thread\"));\n   51 |         event_loop.count = 1;\n   52 |     }\n   53 |     EventRegistration(SendCFRunLoopSource(source))\n   54 | }\n   55 | pub(crate) struct EventRegistration(SendCFRunLoopSource);\n   56 | \n   57 | impl Drop for EventRegistration {\n   58 |     fn drop(&mut self) {\n   59 |         let mut event_loop = EVENT_LOOP.lock().unwrap();\n   60 |         event_loop.count -= 1;\n   61 | \n   62 |         let runloop = event_loop\n   63 |             .runloop\n   64 |             .as_ref()\n   65 |             .expect(\"runloop should exist while events are registered\");\n   66 |         runloop.remove_source(&self.0 .0, unsafe { kCFRunLoopCommonModes });\n   67 | \n   68 |         if event_loop.count == 0 {\n   69 |             runloop.stop();\n   70 |             event_loop.runloop.take();\n   71 |         }\n   72 |     }\n   73 | }","lines":49,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/events.rs#L25-L73"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"hard","description":"In-flight control transfers do not keep the `LinuxDevice` alive, so dropping the last\n`Device`/`Interface` handle while a control transfer future is still pending permanently leaks the\ntransfer allocation (the `Box<TransferInner<TransferData>>` and its `Buffer`).\n\nEndpoint transfers keep the device alive through the transfer's `notify` field, which is an\n`Arc<EndpointInner>` (`get_transfer` does `Idle::new(self.inner.clone(), ...)` in `device.rs`), and\n`EndpointInner` holds `interface: Arc<LinuxInterface>` -> `device: Arc<LinuxDevice>`. A control\ntransfer, however, is created by `TransferFuture::new` which builds a fresh `Arc<Notify>` as the\n`notify`; the only `Arc<LinuxDevice>` lives in the `.map(move |t| { drop(self); ... })` closure of\n`control_in`/`control_out`. When that future is dropped before completion, `Pending::drop` swaps the\ntransfer to `STATE_ABANDONED` (kernel still owns it) and the closure's `Arc<LinuxDevice>` is dropped.\nIf it was the last reference, `LinuxDevice::drop` runs, `events::unregister_fd` removes the fd from\nepoll and the fd is closed. The timeout entry lived in `self.timeouts` (dropped with the device) and\nthe `timerfd` is closed, so nothing ever cancels or reaps the URB. Because `notify_completion` (the\nonly path that frees an `STATE_ABANDONED` transfer) is only ever called from the event thread on\n`reap_urb_ndelay`, the abandoned allocation is orphaned forever.","fix":"Make an in-flight control transfer keep the device alive until it is reaped, mirroring the endpoint\npath. For example, give the control `TransferData` a `notify` that owns an `Arc<LinuxDevice>` (a small\nwrapper implementing `AsRef<Notify>`), so the device fd cannot be closed while a URB it submitted is\nstill pending. Alternatively, have the control future's `Drop` explicitly `discard_urb` and, more\nimportantly, ensure the fd is not closed until all abandoned URBs have been reaped.","locations":[{"ref":"src/platform/linux_usbfs/device.rs:379-403","code":"  379 |     pub fn control_in(\n  380 |         self: Arc<Self>,\n  381 |         data: ControlIn,\n  382 |         timeout: Duration,\n  383 |     ) -> impl MaybeFuture<Output = Result<Vec<u8>, TransferError>> {\n  384 |         let t = TransferData::new_control_in(data);\n  385 |         TransferFuture::new(t, |t| self.submit_timeout(t, timeout)).map(move |t| {\n  386 |             drop(self); // ensure device stays alive\n  387 |             t.status()?;\n  388 |             Ok(t.control_in_data().to_owned())\n  389 |         })\n  390 |     }\n  391 | \n  392 |     pub fn control_out(\n  393 |         self: Arc<Self>,\n  394 |         data: ControlOut,\n  395 |         timeout: Duration,\n  396 |     ) -> impl MaybeFuture<Output = Result<(), TransferError>> {\n  397 |         let t = TransferData::new_control_out(data);\n  398 |         TransferFuture::new(t, |t| self.submit_timeout(t, timeout)).map(move |t| {\n  399 |             drop(self); // ensure device stays alive\n  400 |             t.status()?;\n  401 |             Ok(())\n  402 |         })\n  403 |     }","lines":25,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/device.rs#L379-L403"},{"ref":"src/platform/linux_usbfs/device.rs:506-530","code":"  506 |     fn submit_timeout(\n  507 |         &self,\n  508 |         mut transfer: Idle<TransferData>,\n  509 |         timeout: Duration,\n  510 |     ) -> Pending<TransferData> {\n  511 |         let urb = transfer.urb_ptr();\n  512 |         let now = Instant::now();\n  513 |         let deadline = now + timeout;\n  514 |         transfer.deadline = Some(deadline);\n  515 | \n  516 |         // Hold the lock across `submit`, so that it can't complete before we\n  517 |         // insert the timeout entry.\n  518 |         let mut timeouts = self.timeouts.lock().unwrap();\n  519 | \n  520 |         let r = self.submit(transfer);\n  521 | \n  522 |         // This can only be false if submit failed, because we hold the timeouts lock\n  523 |         // and would block the completion handler.\n  524 |         if !r.is_complete() {\n  525 |             timeouts.insert(TimeoutEntry { deadline, urb }, ());\n  526 |             self.update_timeouts(timeouts, now);\n  527 |         }\n  528 | \n  529 |         r\n  530 |     }","lines":25,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/device.rs#L506-L530"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"hard","description":"Control transfers do not keep the `MacDevice` alive across an in-flight transfer the way endpoint transfers do, so cancelling a pending control transfer can leak the transfer allocation and orphan the IOKit completion callback (with a UAF risk on the released device interface). In `control_in`/`control_out` the device is kept alive only by the outer `.map` closure capturing `self: Arc<MacDevice>` (see the `drop(self); // ensure device stays alive` lines). The `TransferFuture` built by `submit_control` boxes the transfer with a fresh `Arc<Notify>` (`TransferFuture::new` calls `Idle::new(notify.clone(), transfer)`), so the transfer box does NOT hold an `Arc<MacDevice>`. By contrast, endpoint `submit` builds the box via `Idle::new(self.inner.clone(), ...)`, where `EndpointInner` holds `Arc<MacInterface> -> Arc<MacDevice>`, guaranteeing the device outlives every pending transfer. If a user drops the last device `Arc` and then drops the pending control future (cancellation), `Pending::drop` marks the transfer `STATE_ABANDONED` while the kernel request is still in flight, and `MacDevice::drop` runs: it drops `_event_registration` (removing the device's async event source from the run loop) and then releases the `IoKitDevice`. With the event source gone, `transfer_callback` can never be delivered, so `notify_completion` never runs and the abandoned box (including its heap `Buffer` and `Arc<Notify>`) is leaked forever; worse, IOKit may still hold the request/`pData` against a released device interface. This is a control-path-only asymmetry (bulk/interrupt endpoints are protected).","fix":"Make the control transfer box own an `Arc<MacDevice>` so the device (and thus its async event source) cannot be torn down while a control transfer is pending, mirroring the endpoint path. For example, give `MacDevice` (or a per-device inner) an `AsRef<Notify>` and build the control transfer with `Idle::new(self.clone(), t)` instead of using `TransferFuture`'s standalone `Notify`, or otherwise store the `Arc<MacDevice>` inside `TransferData` for control transfers. Then the abandoned box keeps the device alive until the callback fires, and dropping the future before completion no longer leaks the allocation or orphans the callback.","locations":[{"ref":"src/platform/macos_iokit/device.rs:270-360","code":"  270 |     pub fn control_in(\n  271 |         self: Arc<Self>,\n  272 |         data: ControlIn,\n  273 |         timeout: Duration,\n  274 |     ) -> impl MaybeFuture<Output = Result<Vec<u8>, TransferError>> {\n  275 |         let timeout = timeout.as_millis().try_into().expect(\"timeout too long\");\n  276 | \n  277 |         let mut t = TransferData::new();\n  278 |         t.put_buffer(Buffer::new(data.length as usize), Direction::In);\n  279 | \n  280 |         let req = IOUSBDevRequestTO {\n  281 |             bmRequestType: data.request_type(),\n  282 |             bRequest: data.request,\n  283 |             wValue: data.value,\n  284 |             wIndex: data.index,\n  285 |             wLength: data.length,\n  286 |             pData: t.buf as *mut c_void,\n  287 |             wLenDone: 0,\n  288 |             completionTimeout: timeout,\n  289 |             noDataTimeout: timeout,\n  290 |         };\n  291 | \n  292 |         TransferFuture::new(t, |t| self.submit_control(Direction::In, t, req)).map(move |mut t| {\n  293 |             drop(self); // ensure device stays alive\n  294 |             let c = unsafe { t.take_completion(Direction::In) };\n  295 |             c.status?;\n  296 |             Ok(c.buffer.into_vec())\n  297 |         })\n  298 |     }\n  299 | \n  300 |     pub fn control_out(\n  301 |         self: Arc<Self>,\n  302 |         data: ControlOut,\n  303 |         timeout: Duration,\n  304 |     ) -> impl MaybeFuture<Output = Result<(), TransferError>> {\n  305 |         let timeout = timeout.as_millis().try_into().expect(\"timeout too long\");\n  306 | \n  307 |         let mut t = TransferData::new();\n  308 |         t.put_buffer(Buffer::from(data.data), Direction::Out);\n  309 | \n  310 |         let req = IOUSBDevRequestTO {\n  311 |             bmRequestType: data.request_type(),\n  312 |             bRequest: data.request,\n  313 |             wValue: data.value,\n  314 |             wIndex: data.index,\n  315 |             wLength: u16::try_from(data.data.len()).expect(\"request too long\"),\n  316 |             pData: t.buf as *mut c_void,\n  317 |             wLenDone: 0,\n  318 |             completionTimeout: timeout,\n  319 |             noDataTimeout: timeout,\n  320 |         };\n  321 | \n  322 |         TransferFuture::new(t, |t| self.submit_control(Direction::Out, t, req)).map(move |mut t| {\n  323 |             drop(self); // ensure device stays alive\n  324 |             let c = unsafe { t.take_completion(Direction::Out) };\n  325 |             c.status\n  326 |         })\n  327 |     }\n  328 | \n  329 |     fn submit_control(\n  330 |         &self,\n  331 |         dir: Direction,\n  332 |         mut t: Idle<TransferData>,\n  333 |         mut req: IOUSBDevRequestTO,\n  334 |     ) -> Pending<TransferData> {\n  335 |         t.actual_len = 0;\n  336 |         assert!(req.pData == t.buf.cast());\n  337 | \n  338 |         let t = t.pre_submit();\n  339 |         let ptr = t.as_ptr();\n  340 | \n  341 |         let res = unsafe {\n  342 |             call_iokit_function!(\n  343 |                 self.device.raw,\n  344 |                 DeviceRequestAsyncTO(&mut req, Some(transfer_callback), ptr as *mut c_void)\n  345 |             )\n  346 |         };\n  347 | \n  348 |         if res == kIOReturnSuccess {\n  349 |             debug!(\"Submitted control {dir:?} {ptr:?}\");\n  350 |         } else {\n  351 |             error!(\"Failed to submit control {dir:?} {ptr:?}: {res:x}\");\n  352 |             unsafe {\n  353 |                 // Complete the transfer in the place of the callback\n  354 |                 (*ptr).status = res;\n  355 |                 notify_completion::<TransferData>(ptr);\n  356 |             }\n  357 |         }\n  358 | \n  359 |         t\n  360 |     }","lines":91,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/device.rs#L270-L360"},{"ref":"src/platform/macos_iokit/device.rs:530-588","code":"  530 |     fn make_transfer(&mut self, buffer: Buffer) -> Idle<TransferData> {\n  531 |         let mut transfer = self\n  532 |             .idle_transfer\n  533 |             .take()\n  534 |             .unwrap_or_else(|| Idle::new(self.inner.clone(), TransferData::new()));\n  535 |         transfer.put_buffer(buffer, Direction::from_address(self.inner.address));\n  536 |         transfer\n  537 |     }\n  538 | \n  539 |     pub(crate) fn submit(&mut self, buffer: Buffer) {\n  540 |         let transfer = self.make_transfer(buffer);\n  541 |         let endpoint = self.inner.address;\n  542 |         let dir = Direction::from_address(endpoint);\n  543 |         let req_len = transfer.requested_len;\n  544 |         let buf_ptr = transfer.buf;\n  545 | \n  546 |         let transfer = transfer.pre_submit();\n  547 |         let ptr = transfer.as_ptr();\n  548 | \n  549 |         let res = unsafe {\n  550 |             match dir {\n  551 |                 Direction::Out => call_iokit_function!(\n  552 |                     self.inner.interface.interface.raw,\n  553 |                     WritePipeAsync(\n  554 |                         self.inner.pipe_ref,\n  555 |                         buf_ptr as *mut c_void,\n  556 |                         req_len,\n  557 |                         Some(transfer_callback),\n  558 |                         ptr as *mut c_void\n  559 |                     )\n  560 |                 ),\n  561 |                 Direction::In => call_iokit_function!(\n  562 |                     self.inner.interface.interface.raw,\n  563 |                     ReadPipeAsync(\n  564 |                         self.inner.pipe_ref,\n  565 |                         buf_ptr as *mut c_void,\n  566 |                         req_len,\n  567 |                         Some(transfer_callback),\n  568 |                         ptr as *mut c_void\n  569 |                     )\n  570 |                 ),\n  571 |             }\n  572 |         };\n  573 | \n  574 |         if res == kIOReturnSuccess {\n  575 |             debug!(\n  576 |                 \"Submitted {dir:?} transfer {ptr:?} of len {req_len} on endpoint {endpoint:02X}\"\n  577 |             );\n  578 |         } else {\n  579 |             error!(\"Failed to submit {dir:?} transfer {ptr:?} of len {req_len} on endpoint {endpoint:02X}: {res:x}\");\n  580 |             unsafe {\n  581 |                 // Complete the transfer in the place of the callback\n  582 |                 (*ptr).status = res;\n  583 |                 notify_completion::<TransferData>(ptr);\n  584 |             }\n  585 |         }\n  586 | \n  587 |         self.pending.push_back(transfer);\n  588 |     }","lines":59,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/device.rs#L530-L588"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"medium","description":"In `add_event_source`, the very first source is cloned before being handed to the event-loop thread: `let source = SendCFRunLoopSource(source.clone());`. The thread only needs the clone to call `runloop.add_source(&source.0, ...)`, after which the run loop holds its own retain. The thread then keeps that extra `CFRunLoopSource` retain alive for the entire lifetime of the event loop (it is only dropped when `run_current()` returns after the last `EventRegistration` triggers `runloop.stop()`), even though the corresponding `EventRegistration` may have long since removed that source from the run loop. This over-retains the first device's/hotplug source object until the whole event loop shuts down.","fix":"Have the spawned thread drop its `CFRunLoopSource` clone immediately after `add_source` returns (the run loop retains its own reference), or restructure so the thread receives only what it needs to add the source and does not hold a long-lived clone. E.g. inside the closure, after `runloop.add_source(&source.0, ...)`, explicitly `drop(source);` before `CFRunLoop::run_current()`.","locations":[{"ref":"src/platform/macos_iokit/events.rs:34-52","code":"   34 |         let (tx, rx) = mpsc::channel();\n   35 |         let source = SendCFRunLoopSource(source.clone());\n   36 |         info!(\"starting event loop thread\");\n   37 | \n   38 |         thread::Builder::new()\n   39 |             .name(\"nusb-events\".into())\n   40 |             .spawn(move || {\n   41 |                 let runloop = CFRunLoop::get_current();\n   42 |                 let source = source;\n   43 |                 runloop.add_source(&source.0, unsafe { kCFRunLoopCommonModes });\n   44 |                 tx.send(runloop).unwrap();\n   45 |                 CFRunLoop::run_current();\n   46 |                 info!(\"event loop thread exited\");\n   47 |             })\n   48 |             .unwrap();\n   49 | \n   50 |         event_loop.runloop = Some(rx.recv().expect(\"failed to start run loop thread\"));\n   51 |         event_loop.count = 1;\n   52 |     }","lines":19,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/events.rs#L34-L52"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`set_buffer` and `take_completion` cast `u32` buffer lengths to `i32` (`buffer_length` is `c_int`) with\nplain `as` casts. For a buffer whose `len`/`requested_len` exceeds `i32::MAX` (2 GiB), the cast wraps to\na negative `buffer_length`, which is then handed to the kernel. This is not memory-unsafe (the kernel\nrejects it with `EINVAL`), but it silently turns an oversized transfer into a confusing invalid-argument\nfailure instead of a clear length error.","fix":"Validate the length against `i32::MAX` up front (e.g. `i32::try_from(len).expect(\"transfer too large\")`\nor return an error) before assigning to `buffer_length`, rather than relying on a wrapping `as i32` cast.","locations":[{"ref":"src/platform/linux_usbfs/transfer.rs:91-102","code":"   91 |     pub fn set_buffer(&mut self, buf: Buffer) {\n   92 |         debug_assert!(self.capacity == 0);\n   93 |         let buf = ManuallyDrop::new(buf);\n   94 |         self.capacity = buf.capacity;\n   95 |         self.urb_mut().buffer = buf.ptr;\n   96 |         self.urb_mut().actual_length = 0;\n   97 |         self.urb_mut().buffer_length = match Direction::from_address(self.urb().endpoint) {\n   98 |             Direction::Out => buf.len as i32,\n   99 |             Direction::In => buf.requested_len as i32,\n  100 |         };\n  101 |         self.allocator = buf.allocator;\n  102 |     }","lines":12,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/transfer.rs#L91-L102"},{"ref":"src/platform/linux_usbfs/transfer.rs:104-118","code":"  104 |     pub fn take_completion(&mut self) -> Completion {\n  105 |         let status = self.status();\n  106 |         let requested_len = self.urb().buffer_length as u32;\n  107 |         let actual_len = self.urb().actual_length as usize;\n  108 |         let len = match Direction::from_address(self.urb().endpoint) {\n  109 |             Direction::Out => self.urb().buffer_length as u32,\n  110 |             Direction::In => self.urb().actual_length as u32,\n  111 |         };\n  112 | \n  113 |         let mut empty = ManuallyDrop::new(Vec::new());\n  114 |         let ptr = mem::replace(&mut self.urb_mut().buffer, empty.as_mut_ptr());\n  115 |         let capacity = mem::replace(&mut self.capacity, 0);\n  116 |         self.urb_mut().buffer_length = 0;\n  117 |         self.urb_mut().actual_length = 0;\n  118 |         let allocator = mem::replace(&mut self.allocator, Allocator::Default);","lines":15,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/transfer.rs#L104-L118"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"Lost-wakeup race in the transfer completion protocol can permanently hang a transfer future (async) or block a thread forever (blocking `wait`). `notify_completion` takes the waker/thread out of the shared `Notify` **before** it publishes completion by swapping the per-transfer `state` to `STATE_IDLE`:\n```\nlet wake = (*transfer).notify.deref().as_ref().take_notify_state(); // step A: take waker\nmatch (*transfer).state.swap(STATE_IDLE, Ordering::AcqRel) {          // step B: publish completion\n    STATE_PENDING => wake.notify(),\n    ...\n```\nMeanwhile the consumer (`TransferFuture::poll`, `Notify::wait`, and platform `poll_next_complete`/`wait_next_complete`) does the opposite crossing order: it `subscribe`s its waker **then** checks the state via `is_complete`. The correct Dekker-style crossing requires the producer to *publish the flag first, then read the waker*. With the current (reversed) producer order the following interleaving loses the wakeup:\n1. Completion thread runs `take_notify_state()` and gets `NotifyState::None` (consumer has not subscribed yet).\n2. Consumer runs `subscribe(cx)` / sets `NotifyState::Thread`, storing waker `W`.\n3. Consumer calls `is_complete()` and loads `state == STATE_PENDING` (the swap in step B has not happened yet), so it returns `Poll::Pending` / parks.\n4. Completion thread performs `state.swap(STATE_IDLE)`, sees the prior `STATE_PENDING`, and calls `wake.notify()` on the `None` it captured in step 1, which does nothing.\nWaker `W` is never woken and the transfer state atomic is per-transfer, so nothing else will ever wake it: the future hangs forever (and its buffer is effectively leaked), or `Notify::wait` parks permanently. This affects all backends (`linux_usbfs`, `macos_iokit`, `windows_winusb`) which all use this shared `Notify` + per-transfer state protocol.","fix":"Publish completion (`state.swap`) **before** reading/waking the waker, so it forms a correct crossing pattern with `subscribe`-then-check on the consumer side. Because a concurrent `Pending::drop` may free the `TransferInner` box as soon as the state becomes `STATE_IDLE`, clone the `Arc<Notify>` (which keeps the `Notify` alive independently of the box) *before* the swap, then wake through the clone:\n```\npub(crate) unsafe fn notify_completion<P>(transfer: *mut P) {\n    unsafe {\n        let transfer = transfer as *mut TransferInner<P>;\n        // Keep the Notify alive even if a racing Pending::drop frees the box after we publish.\n        let notify = (*transfer).notify.clone();\n        match (*transfer).state.swap(STATE_IDLE, Ordering::AcqRel) {\n            STATE_PENDING => notify.as_ref().as_ref().take_notify_state().notify(),\n            STATE_ABANDONED => drop(Box::from_raw(transfer)),\n            s => panic!(\"Completing transfer in unexpected state {s}\"),\n        }\n    }\n}\n```\nNote that for the crossing to be watertight the flag store in `notify_completion` and the flag load in `is_complete` should be `SeqCst` (or paired with an explicit fence); `AcqRel`/`Acquire` on the state alone does not order the store relative to the separate mutex-guarded waker access.","locations":[{"ref":"src/transfer/internal.rs:262-274","code":"  262 | pub(crate) unsafe fn notify_completion<P>(transfer: *mut P) {\n  263 |     unsafe {\n  264 |         let transfer = transfer as *mut TransferInner<P>;\n  265 |         let wake = (*transfer).notify.deref().as_ref().take_notify_state();\n  266 |         match (*transfer).state.swap(STATE_IDLE, Ordering::AcqRel) {\n  267 |             STATE_PENDING => wake.notify(),\n  268 |             STATE_ABANDONED => {\n  269 |                 drop(Box::from_raw(transfer));\n  270 |             }\n  271 |             s => panic!(\"Completing transfer in unexpected state {s}\"),\n  272 |         }\n  273 |     }\n  274 | }","lines":13,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/transfer/internal.rs#L262-L274"},{"ref":"src/transfer/internal.rs:56-58","code":"   56 |     pub fn subscribe(&self, cx: &mut Context) {\n   57 |         *self.state.lock().unwrap() = NotifyState::Waker(cx.waker().clone());\n   58 |     }","lines":3,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/transfer/internal.rs#L56-L58"},{"ref":"src/transfer/internal.rs:60-68","code":"   60 |     pub fn wait<T>(&self, mut check: impl FnMut() -> Option<T>) -> T {\n   61 |         loop {\n   62 |             *self.state.lock().unwrap() = NotifyState::Thread(thread::current());\n   63 |             if let Some(result) = check() {\n   64 |                 return result;\n   65 |             }\n   66 |             thread::park();\n   67 |         }\n   68 |     }","lines":9,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/transfer/internal.rs#L60-L68"},{"ref":"src/transfer/internal.rs:295-299","code":"  295 |     fn poll(mut self: Pin<&mut Self>, cx: &mut Context) -> Poll<Self::Output> {\n  296 |         self.notify.subscribe(cx);\n  297 |         take_completed_from_option(&mut self.transfer).map_or(Poll::Pending, Poll::Ready)\n  298 |     }\n  299 | }","lines":5,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/transfer/internal.rs#L295-L299"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The fuzzing entry point `fuzz_parse_concatenated_config_descriptors` declares the return type `impl Iterator<Item = &[u8]>`, but its body returns `parse_concatenated_config_descriptors(buf)`, whose item type is `ConfigurationDescriptor<'_>`, not `&[u8]`. These item types are not the same and do not coerce, so the function does not compile under `#[cfg(fuzzing)]`. The matching fuzz target (`fuzz/fuzz_targets/descriptors.rs`) compounds this: it calls `nusb::descriptors::Configuration::new(config)`, but no type named `Configuration` exists (it is `ConfigurationDescriptor`). The result is that the fuzz harness for descriptor parsing - the most security-critical code path, handling untrusted device input - is completely broken and cannot be built or run.","fix":"Make the wrapper's item type match, and update the target. In `src/descriptors.rs`:\n```rust\n#[cfg(fuzzing)]\npub fn fuzz_parse_concatenated_config_descriptors(buf: &[u8]) -> impl Iterator<Item = &[u8]> {\n    parse_concatenated_config_descriptors(buf).map(|d| d.as_bytes())\n}\n```\nand in the fuzz target replace `Configuration::new` with a call that constructs a `ConfigurationDescriptor` (e.g. `ConfigurationDescriptor::new(config)` and `format!` its `Debug`). Alternatively return `impl Iterator<Item = ConfigurationDescriptor<'_>>` and drive `Debug` directly in the target.","locations":[{"ref":"src/descriptors.rs:737-741","code":"  737 | /// Make public when fuzzing\n  738 | #[cfg(fuzzing)]\n  739 | pub fn fuzz_parse_concatenated_config_descriptors(buf: &[u8]) -> impl Iterator<Item = &[u8]> {\n  740 |     parse_concatenated_config_descriptors(buf)\n  741 | }","lines":5,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/descriptors.rs#L737-L741"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `BufRead::consume` implementation for `EndpointReadUntilShortPacket` has its branches inverted, causing a panic on normal use. `fill_buf` for this adapter loops `while !self.reader.has_data_or_short_end()`, so when it returns data `has_data_or_short_end()` is always `true`. `consume` then hits the `assert!(len == 0, ...)` branch whenever data is available:\n```\nfn consume(&mut self, len: usize) {\n    if self.reader.has_data_or_short_end() {\n        assert!(len == 0, \"consumed more than available\"); // taken when data IS present -> panics for len > 0\n    } else {\n        self.reader.consume(len);\n    }\n}\n```\nSo a caller using the `BufRead` trait (`let n = r.fill_buf()?.len(); r.consume(n);`) panics for any non-zero `n`. The plain `EndpointRead::consume` (`src/io/read.rs:242-248`) and the async `poll_read`/`Read::read` paths (which call `self.reader.consume(len)` directly) work correctly, confirming the branches here are swapped.","fix":"Swap the branches so data is consumed when present (or simply forward to `self.reader.consume(len)`, which already asserts internally):\n```\nfn consume(&mut self, len: usize) {\n    if self.reader.has_data_or_short_end() {\n        self.reader.consume(len);\n    } else {\n        assert!(len == 0, \"consumed more than available\");\n    }\n}\n```","locations":[{"ref":"src/io/read.rs:477-484","code":"  477 |     #[inline]\n  478 |     fn consume(&mut self, len: usize) {\n  479 |         if self.reader.has_data_or_short_end() {\n  480 |             assert!(len == 0, \"consumed more than available\");\n  481 |         } else {\n  482 |             self.reader.consume(len);\n  483 |         }\n  484 |     }","lines":8,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/io/read.rs#L477-L484"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `AsyncBufRead` implementations for `EndpointReadUntilShortPacket` (both `tokio` and `smol`) call the non-short-aware `reader.poll_fill_buf`, so they ignore short-packet boundaries - defeating the entire purpose of the `until_short_packet()` adapter. The adapter's docs state it \"observes packet boundaries instead of ignoring them\", and its `AsyncRead::poll_read` correctly uses `poll_fill_buf_until_short` (`src/io/read.rs:495`, `src/io/read.rs:525`) and the sync `BufRead::fill_buf` is short-aware (`src/io/read.rs:465-475`). Only the `AsyncBufRead::poll_fill_buf` impls use the plain variant:\n```\nPin::into_inner(self).reader.poll_fill_buf(cx)   // should be poll_fill_buf_until_short\n```\nThis makes `poll_read` and `poll_fill_buf` on the same adapter behave inconsistently, and any code driving the adapter via `AsyncBufRead` will read past short-packet delimiters.","fix":"In both `AsyncBufRead::poll_fill_buf` impls for `EndpointReadUntilShortPacket`, call `Pin::into_inner(self).reader.poll_fill_buf_until_short(cx)` instead of `reader.poll_fill_buf(cx)`.","locations":[{"ref":"src/io/read.rs:505-510","code":"  505 |     fn poll_fill_buf(\n  506 |         self: Pin<&mut Self>,\n  507 |         cx: &mut Context<'_>,\n  508 |     ) -> Poll<Result<&[u8], std::io::Error>> {\n  509 |         Pin::into_inner(self).reader.poll_fill_buf(cx)\n  510 |     }","lines":6,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/io/read.rs#L505-L510"},{"ref":"src/io/read.rs:536-541","code":"  536 |     fn poll_fill_buf(\n  537 |         self: Pin<&mut Self>,\n  538 |         cx: &mut Context<'_>,\n  539 |     ) -> Poll<Result<&[u8], std::io::Error>> {\n  540 |         Pin::into_inner(self).reader.poll_fill_buf(cx)\n  541 |     }","lines":6,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/io/read.rs#L536-L541"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"Isochronous transfers are silently broken even though the code and comments claim to support them.\n`TransferData::new` always allocates a fixed-size `Box::new(Urb { ... number_of_packets_or_stream_id: 0, ... })`\nand never allocates the trailing variable-length `iso_packet_desc` array, and `number_of_packets` is\nleft at `0`. For `TransferType::Isochronous` the URB type is set to `USBDEVFS_URB_TYPE_ISO`, but the\nkernel's usbfs `SUBMITURB` rejects an ISO URB with `number_of_packets == 0` (returns `EINVAL`), so any\nisochronous transfer created via `Interface::endpoint()` -> `submit` will always fail. The doc comment\non `TransferData` explicitly states the out-of-line `urb` allocation exists \"to enable isochronous\ntransfers to allocate the variable-length `iso_packet_desc` array\", which is misleading since no such\nallocation is ever performed.","fix":"Either implement ISO properly (allocate `Urb` plus `number_of_packets` trailing\n`usbdevfs_iso_packet_desc` entries and populate `number_of_packets_or_stream_id`), or reject\nisochronous endpoints early (e.g. in `LinuxInterface::endpoint`) with a clear error and remove the\nmisleading comment claiming ISO support.","locations":[{"ref":"src/platform/linux_usbfs/transfer.rs:26-72","code":"   26 | /// Linux-specific transfer state.\n   27 | ///\n   28 | /// This logically contains a `Vec` with urb.buffer and capacity.\n   29 | /// It also owns the `urb` allocation itself, which is stored out-of-line\n   30 | /// to enable isochronous transfers to allocate the variable-length\n   31 | /// `iso_packet_desc` array.\n   32 | pub struct TransferData {\n   33 |     urb: *mut Urb,\n   34 |     capacity: u32,\n   35 |     allocator: Allocator,\n   36 |     pub(crate) deadline: Option<Instant>,\n   37 | }\n   38 | \n   39 | unsafe impl Send for TransferData {}\n   40 | unsafe impl Sync for TransferData {}\n   41 | \n   42 | impl TransferData {\n   43 |     pub(super) fn new(endpoint: u8, ep_type: TransferType) -> TransferData {\n   44 |         let ep_type = match ep_type {\n   45 |             TransferType::Control => USBDEVFS_URB_TYPE_CONTROL,\n   46 |             TransferType::Interrupt => USBDEVFS_URB_TYPE_INTERRUPT,\n   47 |             TransferType::Bulk => USBDEVFS_URB_TYPE_BULK,\n   48 |             TransferType::Isochronous => USBDEVFS_URB_TYPE_ISO,\n   49 |         };\n   50 | \n   51 |         let mut empty = ManuallyDrop::new(Vec::new());\n   52 | \n   53 |         TransferData {\n   54 |             urb: Box::into_raw(Box::new(Urb {\n   55 |                 ep_type,\n   56 |                 endpoint,\n   57 |                 status: 0,\n   58 |                 flags: 0,\n   59 |                 buffer: empty.as_mut_ptr(),\n   60 |                 buffer_length: 0,\n   61 |                 actual_length: 0,\n   62 |                 start_frame: 0,\n   63 |                 number_of_packets_or_stream_id: 0,\n   64 |                 error_count: 0,\n   65 |                 signr: 0,\n   66 |                 usercontext: null_mut(),\n   67 |             })),\n   68 |             capacity: 0,\n   69 |             allocator: Allocator::Default,\n   70 |             deadline: None,\n   71 |         }\n   72 |     }","lines":47,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/transfer.rs#L26-L72"},{"ref":"src/platform/linux_usbfs/usbfs.rs:203-208","code":"  203 |     pub number_of_packets_or_stream_id: c_uint, // a union in C\n  204 |     pub error_count: c_int,\n  205 |     pub signr: c_uint,\n  206 |     pub usercontext: *mut c_void,\n  207 |     // + variable size array of iso_packet_desc\n  208 | }","lines":6,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/usbfs.rs#L203-L208"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`WindowsHotplugWatch::poll_next` pops exactly one event and, when a `Action::Connect` event's `probe_device` returns `None` (device already gone / probe failed), it consumes the event and falls through to `Poll::Pending` without waking again. Any further events still queued in `self.inner().events` will not be processed until an entirely new hotplug callback fires and wakes the stored waker. This can stall or effectively lose queued hotplug events (e.g. a rapid disconnect queued behind a failed connect probe).","fix":"Loop until an event is produced or the queue is drained instead of returning `Poll::Pending` after discarding an event. Wrap the pop/match in a `loop`, `continue` when `probe_device` returns `None`, and only `return Poll::Pending` when `pop_front()` yields `None`.","locations":[{"ref":"src/platform/windows_winusb/hotplug.rs:99-118","code":"   99 |     pub fn poll_next(&mut self, cx: &mut Context) -> Poll<HotplugEvent> {\n  100 |         self.inner()\n  101 |             .waker\n  102 |             .lock()\n  103 |             .unwrap()\n  104 |             .replace(cx.waker().clone());\n  105 |         let event = self.inner().events.lock().unwrap().pop_front();\n  106 |         match event {\n  107 |             Some((Action::Connect, devinst)) => {\n  108 |                 if let Some(dev) = probe_device(devinst) {\n  109 |                     return Poll::Ready(HotplugEvent::Connected(dev));\n  110 |                 };\n  111 |             }\n  112 |             Some((Action::Disconnect, devinst)) => {\n  113 |                 return Poll::Ready(HotplugEvent::Disconnected(DeviceId(devinst)));\n  114 |             }\n  115 |             None => {}\n  116 |         }\n  117 |         Poll::Pending\n  118 |     }","lines":20,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/hotplug.rs#L99-L118"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`EndpointBitSet::mask` computes the bit as `((ep & 0x0f) << 1) | (ep >> 7)`, which only looks at the low nibble (`ep & 0x0f`) and the top direction bit (`ep >> 7`). Bits 4-6 of `ep` are silently ignored, so any two addresses that differ only in those bits alias to the same bit. This is fine for the documented endpoint-address range (`0x00..=0x0f` and `0x80..=0x8f`), but the same type is reused on Windows to track claimed interfaces (`self.claimed_interfaces.is_set(interface_number)` in `windows_winusb/device.rs`), and `interface_number` is a raw `u8` (USB `bNumInterfaces` permits up to 255). An interface numbered `16` (`0x10`) aliases onto interface `0`, and an interface `>= 0x80` is treated as an IN endpoint bit. On a composite device with more than 16 interfaces, `claim_interface` can therefore wrongly report `ErrorKind::Busy` for a distinct, unclaimed interface. There is no validation or `debug_assert!` guarding the input range.","fix":"Either restrict/validate inputs or widen the storage for the interface use case. At minimum add a debug assertion in `mask` documenting the invariant, e.g.:\n```rust\npub fn mask(ep: u8) -> u32 {\n    debug_assert!(ep & 0x70 == 0, \"value {ep:#x} outside EndpointBitSet range\");\n    let bit = ((ep & 0x0f) << 1) | (ep >> 7);\n    1 << bit\n}\n```\nFor tracking interface numbers that may exceed 15, use a separate bitset keyed on the full interface number (e.g. a `u128`/`[u64; 4]` or a `HashSet<u8>`) rather than reusing `EndpointBitSet`.","locations":[{"ref":"src/bitset.rs:6-9","code":"    6 |     pub fn mask(ep: u8) -> u32 {\n    7 |         let bit = ((ep & 0x0f) << 1) | (ep >> 7);\n    8 |         1 << bit\n    9 |     }","lines":4,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/bitset.rs#L6-L9"},{"ref":"src/platform/windows_winusb/device.rs:349-350","code":"  349 |         if self.claimed_interfaces.is_set(interface_number) {\n  350 |             return Err(Error::new(ErrorKind::Busy, \"interface is already claimed\"));","lines":2,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/device.rs#L349-L350"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`update_timeouts` disarms the timerfd when the next deadline is exactly equal to `now`.\n`deadline.checked_duration_since(now)` returns `Some(Duration::ZERO)` (not `None`) when\n`deadline == now`, producing `Timespec { tv_sec: 0, tv_nsec: 0 }`. Passing an all-zero `it_value` to\n`timerfd_settime` *disarms* the timer rather than firing it immediately, so a timeout whose deadline\nlands exactly on `now` would not fire from this call (it would only be handled if another\nsubmit/reap re-arms the timer). The `.unwrap_or(Duration::from_nanos(1))` guard only covers the\n`deadline < now` (`None`) case.","fix":"Clamp a zero duration up to a minimum non-zero value, e.g. use\n`deadline.checked_duration_since(now).filter(|d| !d.is_zero()).unwrap_or(Duration::from_nanos(1))`,\nso an equal/past deadline always produces a non-zero `it_value` that arms the timer.","locations":[{"ref":"src/platform/linux_usbfs/device.rs:296-307","code":"  296 |         let next = if let Some((TimeoutEntry { deadline, .. }, _)) = timeouts.first_key_value() {\n  297 |             let duration = deadline\n  298 |                 .checked_duration_since(now)\n  299 |                 .unwrap_or(Duration::from_nanos(1));\n  300 |             log::debug!(\"Next timeout in {duration:?}\");\n  301 |             Timespec {\n  302 |                 tv_sec: duration.as_secs() as i64,\n  303 |                 tv_nsec: duration.subsec_nanos() as i64,\n  304 |             }\n  305 |         } else {\n  306 |             TIMESPEC_ZERO\n  307 |         };","lines":12,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/device.rs#L296-L307"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`MacHotplugWatch::poll_next` always fully services `matched_iter` before ever looking at `terminated_iter` (the `while let` drains matched connect events and returns, and only if matched is empty does the single `if let` handle one terminated event). Under a sustained stream of connect events this can starve `Disconnected` events indefinitely. Additionally, a connected device whose `probe_device` returns `None` is silently skipped and its `HotplugEvent::Connected` is lost permanently (the iterator has already advanced past it), so a transient property-read failure drops the event with no retry.","fix":"Interleave the two iterators (e.g. alternate or check `terminated_iter` before returning a matched event, or round-robin between them) so disconnects cannot be starved. For the probe-failure case, consider retaining the `IoService` and retrying, or at minimum emit a distinct diagnostic so a dropped `Connected` event is observable rather than silently lost.","locations":[{"ref":"src/platform/macos_iokit/hotplug.rs:117-139","code":"  117 |     pub fn poll_next(&mut self, cx: &mut Context) -> Poll<HotplugEvent> {\n  118 |         self.waker_id.register(cx.waker());\n  119 | \n  120 |         while let Some(s) = self.matched_iter.next() {\n  121 |             if let Some(dev) = probe_device(s) {\n  122 |                 return Poll::Ready(HotplugEvent::Connected(dev));\n  123 |             } else {\n  124 |                 debug!(\"failed to probe connected device\");\n  125 |             }\n  126 |         }\n  127 | \n  128 |         if let Some(s) = self.terminated_iter.next() {\n  129 |             if let Some(registry_id) = get_registry_id(&s) {\n  130 |                 debug!(\"device {registry_id} disconnected\");\n  131 |                 let id = DeviceId(registry_id);\n  132 |                 return Poll::Ready(HotplugEvent::Disconnected(id));\n  133 |             } else {\n  134 |                 debug!(\"failed to get registry ID for disconnected device\")\n  135 |             }\n  136 |         }\n  137 | \n  138 |         Poll::Pending\n  139 |     }","lines":23,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/hotplug.rs#L117-L139"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `HubHandle::get_descriptor`, the returned length is computed as `end.offset_from(start)` where `end = (req as *mut u8).offset(bytes_returned as isize)` and `start = &(*req).Data[0]`. If the driver reports `bytes_returned` smaller than `size_of::<USB_DESCRIPTOR_REQUEST>()` (the header), `end < start`, so `offset_from` is negative and `as usize` produces an enormous length, and `slice::from_raw_parts` then reads far out of bounds. `bytes_returned` is trusted without validation. Additionally `alloc::alloc(layout)` is not checked for null before `req.write(...)`.","fix":"Validate `bytes_returned as usize >= mem::size_of::<USB_DESCRIPTOR_REQUEST>()` (return an error otherwise) and compute `len = bytes_returned as usize - mem::size_of::<USB_DESCRIPTOR_REQUEST>()` (accounting for the `Data` offset) instead of using `offset_from`. Also check `req.is_null()` after `alloc::alloc` and call `alloc::handle_alloc_error(layout)` on failure.","locations":[{"ref":"src/platform/windows_winusb/hub.rs:161-192","code":"  161 |             let req = alloc::alloc(layout).cast::<USB_DESCRIPTOR_REQUEST>();\n  162 | \n  163 |             req.write(USB_DESCRIPTOR_REQUEST {\n  164 |                 ConnectionIndex: port_number,\n  165 |                 SetupPacket: USB_DESCRIPTOR_REQUEST_0 {\n  166 |                     bmRequest: 0x80,\n  167 |                     bRequest: 0x06,\n  168 |                     wValue: ((descriptor_type as u16) << 8) | descriptor_index as u16,\n  169 |                     wIndex: language_id,\n  170 |                     wLength: length as u16,\n  171 |                 },\n  172 |                 Data: [0],\n  173 |             });\n  174 | \n  175 |             let mut bytes_returned: u32 = 0;\n  176 |             let r = DeviceIoControl(\n  177 |                 raw_handle(&self.0),\n  178 |                 IOCTL_USB_GET_DESCRIPTOR_FROM_NODE_CONNECTION,\n  179 |                 req as *const c_void,\n  180 |                 layout.size() as u32,\n  181 |                 req as *mut c_void,\n  182 |                 layout.size() as u32,\n  183 |                 &mut bytes_returned,\n  184 |                 null_mut(),\n  185 |             );\n  186 | \n  187 |             let res = if r == TRUE {\n  188 |                 let start = addr_of!((*req).Data[0]);\n  189 |                 let end = (req as *mut u8).offset(bytes_returned as isize);\n  190 |                 let len = end.offset_from(start) as usize;\n  191 |                 let vec = slice::from_raw_parts(start, len).to_owned();\n  192 |                 Ok(vec)","lines":32,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/hub.rs#L161-L192"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`decode_string_descriptor` uses `data[2..].chunks_exact(2)`, which silently discards a trailing odd byte. `validate_string_descriptor` only enforces `data[0] as usize == data.len()` and `data[1] == DESCRIPTOR_TYPE_STRING`; it does not require the length to be even. A malformed device reporting an odd `bLength` (e.g. 5) has its final byte dropped without any warning, so the decoded string silently loses data rather than being rejected or logged.","fix":"Add an even-length requirement to `validate_string_descriptor` (e.g. `data.len() % 2 == 0`) so odd-length string descriptors are rejected, or `warn!` when `data[2..].len()` is odd before decoding.","locations":[{"ref":"src/descriptors.rs:719-735","code":"  719 | pub(crate) fn validate_string_descriptor(data: &[u8]) -> bool {\n  720 |     data.len() >= 2 && data[0] as usize == data.len() && data[1] == DESCRIPTOR_TYPE_STRING\n  721 | }\n  722 | \n  723 | pub(crate) fn decode_string_descriptor(data: &[u8]) -> Result<String, ()> {\n  724 |     if !validate_string_descriptor(data) {\n  725 |         return Err(());\n  726 |     }\n  727 | \n  728 |     Ok(char::decode_utf16(\n  729 |         data[2..]\n  730 |             .chunks_exact(2)\n  731 |             .map(|c| u16::from_le_bytes(c.try_into().unwrap())),\n  732 |     )\n  733 |     .map(|r| r.unwrap_or(char::REPLACEMENT_CHARACTER))\n  734 |     .collect::<String>())\n  735 | }","lines":17,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/descriptors.rs#L719-L735"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`detach_and_claim_interface` simply forwards to `claim_interface`, silently ignoring the \"detach kernel driver\" intent. On macOS there is no per-interface detach equivalent to Linux's `USBDEVFS_DISCONNECT`, so aliasing the two is arguably acceptable, but there is no comment documenting that the detach is intentionally a no-op, which could mislead a maintainer into thinking detaching is implemented.","fix":"Add a one-line comment on `detach_and_claim_interface` explaining that macOS/IOKit has no interface-level driver detach, so this intentionally behaves identically to `claim_interface`.","locations":[{"ref":"src/platform/macos_iokit/device.rs:263-268","code":"  263 |     pub(crate) fn detach_and_claim_interface(\n  264 |         self: Arc<Self>,\n  265 |         interface: u8,\n  266 |     ) -> impl MaybeFuture<Output = Result<Arc<MacInterface>, Error>> {\n  267 |         self.claim_interface(interface)\n  268 |     }","lines":6,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/device.rs#L263-L268"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `ConfigurationDescriptor::new`, the warning for a wrong descriptor type checks `buf[1]` (the `bDescriptorType` field) but logs `buf[0]` (the `bLength` field). The message claims to report the offending `bDescriptorType` value yet prints the length instead, producing misleading diagnostics for malformed devices.","fix":"Change the logged value from `buf[0]` to `buf[1]`:\n\nBefore:\n```rust\nwarn!(\n    \"config bDescriptorType is {}, not a configuration descriptor\",\n    buf[0]\n);\n```\nAfter:\n```rust\nwarn!(\n    \"config bDescriptorType is {}, not a configuration descriptor\",\n    buf[1]\n);\n```","locations":[{"ref":"src/descriptors.rs:372-378","code":"  372 |         if buf[1] != DESCRIPTOR_TYPE_CONFIGURATION {\n  373 |             warn!(\n  374 |                 \"config bDescriptorType is {}, not a configuration descriptor\",\n  375 |                 buf[0]\n  376 |             );\n  377 |             return None;\n  378 |         }","lines":7,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/descriptors.rs#L372-L378"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`RegQueryValueExW` returns its error code directly as an `LSTATUS`/`WIN32_ERROR` return value and does NOT set the thread's last-error. In `query_value_guid` the code correctly branches on the returned `r != ERROR_SUCCESS`, but then builds the `Error` with `GetLastError()` (three separate call sites), so the reported OS error code is whatever stale value happened to be in the thread's last-error slot, not the actual registry failure code. The `ty != REG_MULTI_SZ && ty != REG_SZ` branch is even worse: `RegQueryValueExW` succeeded there, so `GetLastError()` is entirely unrelated.","fix":"Capture the returned code and pass it to `Error::new_os` instead of calling `GetLastError()`. For example the first call becomes:\n```rust\nlet r = RegQueryValueExW(self.0, value_name.as_ptr(), null_mut(), &mut ty, null_mut(), &mut size);\nif r != ERROR_SUCCESS {\n    return Err(Error::new_os(crate::ErrorKind::Other, \"failed to read registry value\", r));\n}\n```\nDo the same for the second `RegQueryValueExW` (use `r`), and for the type-mismatch branch use a non-OS `Error::new` since there is no OS error.","locations":[{"ref":"src/platform/windows_winusb/registry.rs:37-75","code":"   37 |             let r = RegQueryValueExW(\n   38 |                 self.0,\n   39 |                 value_name.as_ptr(),\n   40 |                 null_mut(),\n   41 |                 &mut ty,\n   42 |                 null_mut(),\n   43 |                 &mut size,\n   44 |             );\n   45 | \n   46 |             if r != ERROR_SUCCESS {\n   47 |                 return Err(Error::new_os(\n   48 |                     crate::ErrorKind::Other,\n   49 |                     \"failed to read registry value\",\n   50 |                     GetLastError(),\n   51 |                 ));\n   52 |             }\n   53 | \n   54 |             if ty != REG_MULTI_SZ && ty != REG_SZ {\n   55 |                 return Err(Error::new_os(\n   56 |                     crate::ErrorKind::Other,\n   57 |                     \"failed to read registry value: expected string\",\n   58 |                     GetLastError(),\n   59 |                 ));\n   60 |             }\n   61 | \n   62 |             let layout = Layout::from_size_align(size as usize, mem::align_of::<u16>()).unwrap();\n   63 | \n   64 |             let buf = alloc::alloc(layout);\n   65 | \n   66 |             let r = RegQueryValueExW(self.0, value_name.as_ptr(), null(), &mut ty, buf, &mut size);\n   67 | \n   68 |             if r != ERROR_SUCCESS {\n   69 |                 alloc::dealloc(buf, layout);\n   70 |                 return Err(Error::new_os(\n   71 |                     crate::ErrorKind::Other,\n   72 |                     \"failed to read registry value data\",\n   73 |                     GetLastError(),\n   74 |                 ));\n   75 |             }","lines":39,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/registry.rs#L37-L75"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"hard","description":"`From<ActiveConfigurationError> for Error` discards the `configuration_value` when `!= 0`, producing the static message `\"no descriptor found for active configuration\"` without the offending configuration number. The richer `Display` impl for `ActiveConfigurationError` (line 106-118) does include the number, so information is lost when the error is converted into the crate's `Error`. This is a con
