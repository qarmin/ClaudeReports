sequence of `Error.message` being `&'static str`, which cannot embed a runtime value.","fix":"If preserving the configuration number matters for diagnostics, change `Error.message` from `&'static str` to an owned `String` (or add an optional `Cow<'static, str>`) so the conversion can format `format!(\"no descriptor found for active configuration {}\", value.configuration_value)`. Otherwise document that the number is intentionally dropped on conversion.","locations":[{"ref":"src/error.rs:122-131","code":"  122 | impl From<ActiveConfigurationError> for Error {\n  123 |     fn from(value: ActiveConfigurationError) -> Self {\n  124 |         let message = if value.configuration_value == 0 {\n  125 |             \"device is not configured\"\n  126 |         } else {\n  127 |             \"no descriptor found for active configuration\"\n  128 |         };\n  129 |         Error::new(ErrorKind::Other, message)\n  130 |     }\n  131 | }","lines":10,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/error.rs#L122-L131"},{"ref":"src/error.rs:106-118","code":"  106 | impl Display for ActiveConfigurationError {\n  107 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  108 |         if self.configuration_value == 0 {\n  109 |             write!(f, \"device is not configured\")\n  110 |         } else {\n  111 |             write!(\n  112 |                 f,\n  113 |                 \"no descriptor found for active configuration {}\",\n  114 |                 self.configuration_value\n  115 |             )\n  116 |         }\n  117 |     }\n  118 | }","lines":13,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/error.rs#L106-L118"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`BlockingTask`'s tokio `poll` returns `Poll::Pending` when the underlying `JoinHandle` reports the task was cancelled (`Poll::Ready(Err(e)) if e.is_cancelled() => Poll::Pending`), but does not register the waker before doing so. A future that returns `Pending` without arranging for its waker to be called will never be polled again and stalls forever. In practice `spawn_blocking` tasks are only cancelled during runtime shutdown (as the comment notes), when the future is being dropped anyway, so the hang is currently benign - but it is a latent correctness trap if tokio's cancellation semantics ever broaden.","fix":"Prefer surfacing the cancellation as a distinct outcome instead of silently stalling. Since the `Output` is just `R`, one option is to `panic!` on cancellation outside shutdown, or to document loudly that this arm relies on the future being dropped. If `Pending` must be returned, wake the task so the executor does not hang: call `cx.waker().wake_by_ref()` before returning `Poll::Pending`.","locations":[{"ref":"src/maybe_future.rs:126-134","code":"  126 |         fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {\n  127 |             match Pin::new(&mut self.0).poll(cx) {\n  128 |                 Poll::Pending => Poll::Pending,\n  129 |                 Poll::Ready(Ok(r)) => Poll::Ready(r),\n  130 |                 Poll::Ready(Err(e)) if e.is_cancelled() => Poll::Pending, // Can happen during runtime shutdown\n  131 |                 Poll::Ready(Err(e)) if e.is_panic() => std::panic::resume_unwind(e.into_panic()),\n  132 |                 Poll::Ready(Err(e)) => panic!(\"Error from tokio blocking task: {e}\"),\n  133 |             }\n  134 |         }","lines":9,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/maybe_future.rs#L126-L134"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`take_completion` discards the `BOOL` return of `GetOverlappedResult` and derives the transfer status purely from a subsequent `GetLastError()`. This depends on `GetOverlappedResult` reliably calling `SetLastError` (including `ERROR_SUCCESS` on success). If `GetOverlappedResult` itself fails for a reason unrelated to the transfer (e.g. `ERROR_IO_INCOMPLETE` if ever called before completion, or an invalid handle), that error is silently reported as the transfer result. The completion status (`overlapped.Internal`) is authoritative and the return value should be checked.","fix":"Check the return value of `GetOverlappedResult`; on `TRUE` treat as success, and only map `GetLastError()` when it returns `FALSE`. Alternatively decode `overlapped.Internal` (the NTSTATUS) directly rather than relying on ambient last-error state.","locations":[{"ref":"src/platform/windows_winusb/transfer.rs:67-85","code":"   67 |     pub fn take_completion(&mut self, intf: &Interface) -> Completion {\n   68 |         let mut actual_len: u32 = 0;\n   69 | \n   70 |         let status = self.error_from_submit.and_then(|()| {\n   71 |             unsafe { GetOverlappedResult(intf.handle, &self.overlapped, &mut actual_len, 0) };\n   72 | \n   73 |             match unsafe { GetLastError() } {\n   74 |                 ERROR_SUCCESS => Ok(()),\n   75 |                 ERROR_GEN_FAILURE => Err(TransferError::Stall),\n   76 |                 ERROR_REQUEST_ABORTED\n   77 |                 | ERROR_TIMEOUT\n   78 |                 | ERROR_SEM_TIMEOUT\n   79 |                 | ERROR_OPERATION_ABORTED => Err(TransferError::Cancelled),\n   80 |                 ERROR_FILE_NOT_FOUND | ERROR_DEVICE_NOT_CONNECTED | ERROR_NO_SUCH_DEVICE => {\n   81 |                     Err(TransferError::Disconnected)\n   82 |                 }\n   83 |                 e => Err(TransferError::Unknown(e)),\n   84 |             }\n   85 |         });","lines":19,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/transfer.rs#L67-L85"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`ConfigurationDescriptor::new_unchecked` bypasses every bounds and content check that `ConfigurationDescriptor::new` performs, yet it is used in production on macOS (`src/platform/macos_iokit/device.rs:152`) and Windows (`src/platform/windows_winusb/device.rs:136`) with descriptor bytes that ultimately originate from the (untrusted) device. Once constructed, the field accessors generated by `descriptor_fields!` index fixed offsets up to byte 8 with `self.0[$pos..$pos + size]` and no length guard, and `descriptors()` computes `&self.0[self.0[0] as usize..]`. If the OS ever hands back a buffer shorter than `bLength` (or shorter than 9 bytes), calling `num_interfaces()`, `max_power()`, `descriptors()`, etc. will panic with an out-of-bounds slice index. The `new_unchecked` API places the whole validation burden on callers handling device-controlled data.","fix":"Have `new_unchecked` callers go through `ConfigurationDescriptor::new` (which validates `bLength`, `bDescriptorType`, and `wTotalLen`), or add a minimum-length assertion inside `new_unchecked` (e.g. debug/runtime check that `d.len() >= DESCRIPTOR_LEN_CONFIGURATION as usize` and `d.len() >= d[0] as usize`) so that later fixed-offset accesses and the `descriptors()` slice cannot go out of bounds.","locations":[{"ref":"src/descriptors.rs:392-395","code":"  392 |     #[allow(unused)]\n  393 |     pub(crate) fn new_unchecked(d: &'a [u8]) -> Self {\n  394 |         Self(d)\n  395 |     }","lines":4,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/descriptors.rs#L392-L395"},{"ref":"src/descriptors.rs:403-405","code":"  403 |     pub fn descriptors(&self) -> DescriptorIter<'a> {\n  404 |         DescriptorIter(&self.0[self.0[0] as usize..])\n  405 |     }","lines":3,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/descriptors.rs#L403-L405"},{"ref":"src/descriptors.rs:434-458","code":"  434 | descriptor_fields! {\n  435 |     impl<'a> ConfigurationDescriptor<'a> {\n  436 |         /// `bNumInterfaces` descriptor field: Number of interfaces.\n  437 |         #[doc(alias = \"bNumInterfaces\")]\n  438 |         pub fn num_interfaces at 4 -> u8;\n  439 | \n  440 |         /// `bConfigurationValue` descriptor field: Identifier for the configuration.\n  441 |         ///\n  442 |         /// Pass this value to\n  443 |         /// [`Device::set_configuration`][crate::Device::set_configuration] to\n  444 |         /// select this configuration.\n  445 |         #[doc(alias = \"bConfigurationValue\")]\n  446 |         pub fn configuration_value at 5 -> u8;\n  447 | \n  448 |         fn string_index_raw at 6 -> u8;\n  449 | \n  450 |         /// `bmAttributes` descriptor field: Bitmap of configuration attributes.\n  451 |         #[doc(alias = \"bmAttributes\")]\n  452 |         pub fn attributes at 7 -> u8;\n  453 | \n  454 |         /// `bMaxPower` descriptor field: Maximum power, in units of **2** milliamps.\n  455 |         #[doc(alias = \"bMaxPower\")]\n  456 |         pub fn max_power at 8 -> u8;\n  457 |     }\n  458 | }","lines":25,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/descriptors.rs#L434-L458"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`IOUSBEndpointProperties` is declared `#[repr(C, packed)]`, but Apple's `IOUSBEndpointProperties` in `IOUSBLib.h` is a normally-aligned struct (no `#pragma pack`). With `packed`, the trailing `wBytesPerInterval: UInt16` lands at offset `13` and the struct is `15` bytes, whereas the real C struct puts `wBytesPerInterval` at offset `14` and is `16` bytes. When this type is passed by pointer to `GetPipePropertiesV3`/`GetEndpointPropertiesV3`, IOKit would write `wBytesPerInterval` at offset `14-15` of a `15`-byte Rust allocation (a 1-byte out-of-bounds write) and every reader would decode `wBytesPerInterval` from the wrong offset. This is currently latent because `nusb` only calls the older `GetPipeProperties` (see `src/platform/macos_iokit/iokit_usb.rs:301`) and never constructs `IOUSBEndpointProperties`, but the binding is wrong and unsafe to use as written.","fix":"Drop the `packed` qualifier so the layout matches the C header (natural alignment, size `16`):\n```rust\n#[repr(C)]\n#[derive(Debug, Copy, Clone)]\npub struct IOUSBEndpointProperties {\n    // ... same fields ...\n}\n```\nUnlike USB wire descriptors (which are genuinely packed), `IOUSBEndpointProperties` is an in-memory API struct and must use the compiler's default alignment.","locations":[{"ref":"src/platform/macos_iokit/iokit_c.rs:80-96","code":"   80 | #[repr(C, packed)]\n   81 | #[derive(Debug, Copy, Clone)]\n   82 | pub struct IOUSBEndpointProperties {\n   83 |     pub bVersion: UInt8,\n   84 |     pub bAlternateSetting: UInt8,\n   85 |     pub bDirection: UInt8,\n   86 |     pub bEndpointNumber: UInt8,\n   87 |     pub bTransferType: UInt8,\n   88 |     pub bUsageType: UInt8,\n   89 |     pub bSyncType: UInt8,\n   90 |     pub bInterval: UInt8,\n   91 |     pub wMaxPacketSize: UInt16,\n   92 |     pub bMaxBurst: UInt8,\n   93 |     pub bMaxStreams: UInt8,\n   94 |     pub bMult: UInt8,\n   95 |     pub wBytesPerInterval: UInt16,\n   96 | }","lines":17,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/iokit_c.rs#L80-L96"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`ULONG` is aliased to `::std::os::raw::c_ulong`, which is 64-bit on macOS (LP64) for both `x86_64` and `arm64`. Apple's COM emulation (`CFPlugInCOM.h`) defines `typedef UInt32 ULONG;`, i.e. 32-bit. `ULONG` is used as the return type of `AddRef` and `Release` in all three vtables (`IOCFPlugInInterfaceStruct`, `IOUSBDeviceStruct650`, `IOUSBInterfaceStruct700`), so the declared return width (64-bit) does not match the actual C ABI return width (32-bit); the upper 32 bits of the returned value are undefined per the C ABI. Impact is limited only because every call site discards the result (e.g. `call_iokit_function!(self.interface, Release())` in `src/platform/macos_iokit/iokit.rs:97`), but the FFI signature is nonetheless incorrect.","fix":"Change the alias to a 32-bit type. Before:\n```rust\npub(crate) type ULONG = ::std::os::raw::c_ulong;\n```\nAfter:\n```rust\npub(crate) type ULONG = ::std::os::raw::c_uint;\n```\n(equivalently `UInt32`).","locations":[{"ref":"src/platform/macos_iokit/iokit_c.rs:74","code":"   74 | pub(crate) type ULONG = ::std::os::raw::c_ulong;","lines":1,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/iokit_c.rs#L74"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"hard","description":"In `post_submit`, when the submit call returns `TRUE` (synchronous completion) the code only logs `error!(\"Transfer submit completed synchronously\")` and then falls through to test `GetLastError()`. Because the file handle is bound to the threadpool IO via `CreateThreadpoolIo` and `FILE_SKIP_COMPLETION_PORT_ON_SUCCESS` is not set, a completion packet is still queued and `io_callback` will run. If `GetLastError()` happens not to equal `ERROR_IO_PENDING` (its value is unspecified after a successful call), the code wrongly takes the failure branch: it calls `CancelThreadpoolIo` on an IO that already generated a completion and calls `notify_completion` a second time, racing the threadpool callback. Two `notify_completion` calls on the same transfer hit the `s => panic!(\"Completing transfer in unexpected state\")` arm in `internal.rs`. This is latent because WinUSB pipe/control operations return `FALSE`+`ERROR_IO_PENDING` in practice, but the handling is incorrect.","fix":"Treat `r == TRUE` explicitly as an already-completed submission that the threadpool callback will still service (return `t` without touching the threadpool or calling `notify_completion`), and only inspect `GetLastError()` when `r == FALSE`. e.g. `if r == TRUE { return t; }` before reading `err`.","locations":[{"ref":"src/platform/windows_winusb/device.rs:761-793","code":"  761 |     fn post_submit(&self, r: i32, t: Pending<TransferData>) -> Pending<TransferData> {\n  762 |         if r == TRUE {\n  763 |             error!(\"Transfer submit completed synchronously\")\n  764 |         }\n  765 | \n  766 |         let err = unsafe { GetLastError() };\n  767 | \n  768 |         if err != ERROR_IO_PENDING {\n  769 |             error!(\"submit failed: {}\", io::Error::from_raw_os_error(err as _));\n  770 | \n  771 |             unsafe {\n  772 |                 CancelThreadpoolIo(self.threadpool_io);\n  773 |             }\n  774 | \n  775 |             // Safety: Transfer was not submitted, so we still own it\n  776 |             // and must complete it in place of the event thread.\n  777 |             unsafe {\n  778 |                 if let Some(ref timer) = (*t.as_ptr()).timeout {\n  779 |                     timer.cancel_and_wait();\n  780 |                 }\n  781 |                 (*t.as_ptr()).error_from_submit = match err {\n  782 |                     ERROR_BAD_COMMAND\n  783 |                     | ERROR_FILE_NOT_FOUND\n  784 |                     | ERROR_DEVICE_NOT_CONNECTED\n  785 |                     | ERROR_NO_SUCH_DEVICE => Err(TransferError::Disconnected),\n  786 |                     other => Err(TransferError::Unknown(other)),\n  787 |                 };\n  788 |                 notify_completion::<TransferData>(t.as_ptr());\n  789 |             }\n  790 |         }\n  791 | \n  792 |         t\n  793 |     }","lines":33,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/device.rs#L761-L793"}]},{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`claim_interface` increments the counter with `self.claimed_interfaces.fetch_add(1, Ordering::Acquire)`. `Acquire` orders the load side of a read-modify-write, but here the value is only used as an advisory count (read with `Ordering::Relaxed` in `require_open_exclusive` and decremented with `Ordering::Release` in `MacInterface::drop`). The `Acquire` on a store-oriented increment is meaningless and inconsistent with the rest of the code.","fix":"Before: `self.claimed_interfaces.fetch_add(1, Ordering::Acquire);`\nAfter:  `self.claimed_interfaces.fetch_add(1, Ordering::Relaxed);`\n(or use `Ordering::AcqRel` consistently on both the add and the `fetch_sub` if the count is meant to establish happens-before with interface state).","locations":[{"ref":"src/platform/macos_iokit/device.rs:251","code":"  251 |             self.claimed_interfaces.fetch_add(1, Ordering::Acquire);","lines":1,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/device.rs#L251"}]},{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`get_configuration_descriptor` reads the on-the-wire (little-endian) `wTotalLength` field with `u16::to_le((*ptr).wTotalLength)`. `to_le` converts a host-order value *to* little-endian, whereas reading a little-endian field into host order should use `from_le`. The two are bitwise identical, so this is only a semantic/readability defect on the little-endian macOS targets (x86_64/aarch64) where nusb runs, but the intent is inverted.","fix":"Before: `let len = u16::to_le((*ptr).wTotalLength) as usize;`\nAfter:  `let len = u16::from_le((*ptr).wTotalLength) as usize;`","locations":[{"ref":"src/platform/macos_iokit/iokit_usb.rs:187","code":"  187 |             let len = u16::to_le((*ptr).wTotalLength) as usize;","lines":1,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/macos_iokit/iokit_usb.rs#L187"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`handle_events` reaps at most one URB per epoll wakeup. The device fd is registered level-triggered\n(`EventFlags::OUT`, no `EPOLLET`), so when many URBs complete the event thread must make a full\n`epoll::wait` round-trip for every single completion (each returning the same fd ready again). Under\nhigh transfer throughput, or with the shared 4-slot `event_buf` and many active devices, this wastes a\nsyscall per completion. libusb drains completions in a loop until `EAGAIN`.","fix":"In `handle_events`, loop calling `reap_urb_ndelay` and dispatching completions until it returns\n`Errno::AGAIN` (or `Errno::NODEV`), so all currently-completed URBs are drained in one wakeup.","locations":[{"ref":"src/platform/linux_usbfs/device.rs:215-256","code":"  215 |     fn handle_events(&self) {\n  216 |         debug!(\"Handling events for device {}\", self.events_id);\n  217 |         match usbfs::reap_urb_ndelay(&self.fd) {\n  218 |             Ok(urb) => {\n  219 |                 let transfer_data: *mut TransferData = unsafe { &(*urb) }.usercontext.cast();\n  220 | \n  221 |                 {\n  222 |                     let transfer = unsafe { &*transfer_data };\n  223 |                     debug_assert!(transfer.urb_ptr() == urb);\n  224 |                     debug!(\n  225 |                         \"URB {:?} for ep {:x} completed, status={} actual_length={}\",\n  226 |                         transfer.urb_ptr(),\n  227 |                         transfer.urb().endpoint,\n  228 |                         transfer.urb().status,\n  229 |                         transfer.urb().actual_length\n  230 |                     );\n  231 | \n  232 |                     if let Some(deadline) = transfer.deadline {\n  233 |                         let mut timeouts = self.timeouts.lock().unwrap();\n  234 |                         timeouts.remove(&TimeoutEntry { deadline, urb });\n  235 |                         self.update_timeouts(timeouts, Instant::now());\n  236 |                     }\n  237 |                 };\n  238 | \n  239 |                 // SAFETY: pointer came from submit via kernel and we're now done with it\n  240 |                 unsafe { notify_completion::<super::TransferData>(transfer_data) }\n  241 |             }\n  242 |             Err(Errno::AGAIN) => {}\n  243 |             Err(Errno::NODEV) => {\n  244 |                 debug!(\"Device {} disconnected\", self.events_id);\n  245 | \n  246 |                 // epoll returns events continuously on a disconnected device, and REAPURB\n  247 |                 // only returns ENODEV after all events are received, so unregister to\n  248 |                 // keep the event thread from spinning because we won't receive further events.\n  249 |                 // The drop impl will try to unregister again, but that's ok.\n  250 |                 events::unregister_fd(self.fd.as_fd());\n  251 |             }\n  252 |             Err(e) => {\n  253 |                 error!(\"Unexpected error {e} from REAPURBNDELAY\");\n  254 |             }\n  255 |         }\n  256 |     }","lines":42,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/device.rs#L215-L256"},{"ref":"src/platform/linux_usbfs/events.rs:87-110","code":"   87 | fn event_loop() {\n   88 |     let epoll_fd = EPOLL_FD.get().unwrap();\n   89 |     let mut event_buf = [MaybeUninit::<epoll::Event>::uninit(); 4];\n   90 |     loop {\n   91 |         let events = match epoll::wait(epoll_fd, &mut event_buf, None) {\n   92 |             Ok((events, _)) => events,\n   93 |             Err(Errno::INTR) => &mut [],\n   94 |             Err(e) => panic!(\"epoll::wait failed: {e}\"),\n   95 |         };\n   96 |         for event in events {\n   97 |             match Tag::from_event_data(event.data) {\n   98 |                 Tag::Device(id) => Device::handle_usb_epoll(id),\n   99 |                 Tag::DeviceTimer(id) => Device::handle_timer_epoll(id),\n  100 |                 Tag::Waker(id) => {\n  101 |                     if let Some(waker) = WAKERS.lock().unwrap().get_mut(id) {\n  102 |                         if let Some(w) = waker.take() {\n  103 |                             w.wake();\n  104 |                         }\n  105 |                     }\n  106 |                 }\n  107 |             }\n  108 |         }\n  109 |     }\n  110 | }","lines":24,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/events.rs#L87-L110"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"In `UsbControllerType::from_str`, the input is allocated twice: `s.to_owned()` produces a `String`, and `.to_ascii_lowercase()` (which is a `str` method reachable via deref) then allocates a second `String`. The intermediate `to_owned()` is entirely redundant because `str::to_ascii_lowercase` already returns an owned `String`.","fix":"Drop the redundant clone.\nBefore:\n```rust\nlet lower_s = s.to_owned().to_ascii_lowercase();\n```\nAfter:\n```rust\nlet lower_s = s.to_ascii_lowercase();\n```","locations":[{"ref":"src/enumeration.rs:456","code":"  456 |         let lower_s = s.to_owned().to_ascii_lowercase();","lines":1,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/enumeration.rs#L456"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In `Endpoint::submit`, the IN-direction validation calls `self.max_packet_size()` once for the modulo check and again inside the `warn!` format arguments, and `self.endpoint_address()` in the log path. Each accessor reads through `self.backend`. This is trivial, but the value could be bound once for clarity and to avoid recomputation on the (already slow) error path.","fix":"Bind `let mps = self.max_packet_size();` at the top of the IN branch and reuse it in the modulo test and the `warn!` message.","locations":[{"ref":"src/device.rs:748-763","code":"  748 |     pub fn submit(&mut self, buf: Buffer) {\n  749 |         if Dir::DIR == Direction::In {\n  750 |             let req_len = buf.requested_len();\n  751 |             if req_len == 0 || req_len % self.max_packet_size() != 0 {\n  752 |                 warn!(\n  753 |                     \"Submitting transfer with length {req_len} which is not a multiple of max packet size {} on IN endpoint {:02x}\",\n  754 |                     self.max_packet_size(),\n  755 |                     self.endpoint_address(),\n  756 |                 );\n  757 | \n  758 |                 return self.backend.submit_err(buf, TransferError::InvalidArgument);\n  759 |             }\n  760 |         }\n  761 | \n  762 |         self.backend.submit(buf)\n  763 |     }","lines":16,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/device.rs#L748-L763"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`Notify::subscribe` unconditionally clones the waker and replaces the stored `NotifyState` on every poll: `*self.state.lock().unwrap() = NotifyState::Waker(cx.waker().clone());`. For a hot polled transfer this clones a waker each poll even when it is the same waker. This is a minor allocation/refcount cost on the poll hot path.","fix":"Check the existing stored waker with `Waker::will_wake` before cloning/replacing, only storing a new clone when the waker actually changed.","locations":[{"ref":"src/transfer/internal.rs:56-58","code":"   56 |     pub fn subscribe(&self, cx: &mut Context) {\n   57 |         *self.state.lock().unwrap() = NotifyState::Waker(cx.waker().clone());\n   58 |     }","lines":3,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/transfer/internal.rs#L56-L58"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`MaybeFuture::map` requires `T: FnOnce(Self::Output) -> R + Unpin + NonWasmSend`, but the `Unpin` bound is never needed: the `IntoFuture` and `MaybeFuture` impls for `Map` do not require it, and `MapFut::poll` accesses `func` via `get_unchecked_mut` (line 199) so it is never pinned. The extra bound needlessly rejects non-`Unpin` closures from a public API method.","fix":"Remove the unused `Unpin` bound.\n\nBefore:\n```rust\n    fn map<T: FnOnce(Self::Output) -> R + Unpin + NonWasmSend, R>(self, f: T) -> Map<Self, T>\n```\nAfter:\n```rust\n    fn map<T: FnOnce(Self::Output) -> R + NonWasmSend, R>(self, f: T) -> Map<Self, T>\n```","locations":[{"ref":"src/maybe_future.rs:18-27","code":"   18 |     fn map<T: FnOnce(Self::Output) -> R + Unpin + NonWasmSend, R>(self, f: T) -> Map<Self, T>\n   19 |     where\n   20 |         Self: Sized,\n   21 |     {\n   22 |         Map {\n   23 |             wrapped: self,\n   24 |             func: f,\n   25 |         }\n   26 |     }\n   27 | }","lines":10,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/maybe_future.rs#L18-L27"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `readlink_attr_filename`, the expression `s.to_str().to_owned()` calls `.to_owned()` on an\n`Option<&str>`, which resolves to the blanket `ToOwned for T: Clone` impl and simply clones the\n`Option<&str>` into another `Option<&str>` - a confusing no-op. The subsequent `.map(str::to_owned)`\nis what actually produces the `String`.","fix":"Remove the redundant call. Before:\n```rust\n.and_then(|s| s.to_str().to_owned())\n```\nAfter:\n```rust\n.and_then(|s| s.to_str())\n```","locations":[{"ref":"src/platform/linux_usbfs/enumeration.rs:71-85","code":"   71 |     pub(crate) fn readlink_attr_filename(&self, attr: &str) -> Result<String, SysfsError> {\n   72 |         self.readlink_attr(attr).map(|p| {\n   73 |             p.file_name()\n   74 |                 .and_then(|s| s.to_str().to_owned())\n   75 |                 .map(str::to_owned)\n   76 |                 .ok_or_else(|| {\n   77 |                     SysfsError(\n   78 |                         p,\n   79 |                         SysfsErrorKind::Parse(format!(\n   80 |                             \"Failed to read filename for readlink attribute {attr}\",\n   81 |                         )),\n   82 |                     )\n   83 |                 })\n   84 |         })?\n   85 |     }","lines":15,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/enumeration.rs#L71-L85"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`WCStr::as_slice` is defined but never used anywhere in the crate (only `as_slice_without_nul`, `as_ptr`, and the `Display`/conversion impls are used).","fix":"Remove the unused method:\n```rust\n    pub fn as_slice(&self) -> &[u16] {\n        &self.0\n    }\n```\nor annotate it `#[allow(dead_code)]` if intended as public API.","locations":[{"ref":"src/platform/windows_winusb/util.rs:110-112","code":"  110 |     pub fn as_slice(&self) -> &[u16] {\n  111 |         &self.0\n  112 |     }","lines":3,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/util.rs#L110-L112"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`packets_per_microframe` is documented to return `(1, 2, or 3)`, but the implementation computes `((self.max_packet_size_raw() >> 11) & 0b11) as u8 + 1`. The mask `& 0b11` keeps two bits (values 0..=3), so for a malformed device that sets the reserved bit pattern `0b11`, the function returns `4`, which the doc says is impossible. Callers trusting the documented range could mis-size buffers or index arrays.","fix":"Either clamp/validate the field (treat the reserved `0b11` value explicitly) or update the doc comment to state the returned value is `1..=4` for the raw field. If only the two valid bits are intended, mask with a single bit or saturate: `((self.max_packet_size_raw() >> 11) & 0b11).min(2) as u8 + 1`.","locations":[{"ref":"src/descriptors.rs:646-649","code":"  646 |     /// For isochronous endpoints at high speed, get the number of packets per microframe (1, 2, or 3).\n  647 |     pub fn packets_per_microframe(&self) -> u8 {\n  648 |         ((self.max_packet_size_raw() >> 11) & 0b11) as u8 + 1\n  649 |     }","lines":4,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/descriptors.rs#L646-L649"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `Timer::new` says `Create and arm a timer`, but `new` only calls `CreateThreadpoolTimer` and never calls `SetThreadpoolTimer`; the timer is armed separately by `set`. The comment is misleading about the object's state after construction.","fix":"Change the comment from `/// Create and arm a timer.` to `/// Create a timer (not yet armed; call `set` to arm).`","locations":[{"ref":"src/platform/windows_winusb/threadpool.rs:24-42","code":"   24 | impl Timer {\n   25 |     /// Create and arm a timer.\n   26 |     ///\n   27 |     /// SAFETY: the caller must ensure that it is safe for the callback to be\n   28 |     /// called with the given data on another thread, and must remain valid\n   29 |     /// at any time the timer may trigger.\n   30 |     pub unsafe fn new(\n   31 |         callback: unsafe extern \"system\" fn(PTP_CALLBACK_INSTANCE, *mut c_void, PTP_TIMER),\n   32 |         callback_data: *mut c_void,\n   33 |     ) -> Result<Self, ()> {\n   34 |         let timer =\n   35 |             unsafe { CreateThreadpoolTimer(Some(callback), callback_data, ptr::null_mut()) };\n   36 |         if timer == 0 {\n   37 |             let e = unsafe { GetLastError() };\n   38 |             log::error!(\"CreateThreadpoolTimer failed with error {e}\");\n   39 |             return Err(());\n   40 |         }\n   41 |         Ok(Timer { timer })\n   42 |     }","lines":19,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/windows_winusb/threadpool.rs#L24-L42"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`EndpointBitSet::is_set`, `set`, and `clear` name their parameter `bit: u8`, implying the caller passes a precomputed bit index, but the value is actually a raw endpoint/interface address that is run through `Self::mask`. The sibling `mask` function names the same argument `ep`. The inconsistent naming is misleading given all call sites pass endpoint addresses or interface numbers.","fix":"Rename the parameter to `ep` for consistency, e.g.:\n\nBefore:\n```rust\n    pub fn is_set(&self, bit: u8) -> bool {\n        self.0 & Self::mask(bit) != 0\n    }\n```\nAfter:\n```rust\n    pub fn is_set(&self, ep: u8) -> bool {\n        self.0 & Self::mask(ep) != 0\n    }\n```\n(apply the same rename to `set` and `clear`).","locations":[{"ref":"src/bitset.rs:11-25","code":"   11 |     pub fn is_set(&self, bit: u8) -> bool {\n   12 |         self.0 & Self::mask(bit) != 0\n   13 |     }\n   14 | \n   15 |     pub fn is_empty(&self) -> bool {\n   16 |         self.0 == 0\n   17 |     }\n   18 | \n   19 |     pub fn set(&mut self, bit: u8) {\n   20 |         self.0 |= Self::mask(bit)\n   21 |     }\n   22 | \n   23 |     pub fn clear(&mut self, bit: u8) {\n   24 |         self.0 &= !Self::mask(bit)\n   25 |     }","lines":15,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/bitset.rs#L11-L25"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `Debug` impls format the 64-bit `registry_id` field with `0x{:08X}`, the same width used for the 32-bit `location_id`. Since `registry_id` is a `u64` IOKit Registry Entry ID, an 8-hex-digit minimum width is misleading (it implies a 32-bit value); a full value wider than 8 digits still prints but with inconsistent alignment. Use `{:016X}` for the `u64` to reflect its actual width. This affects both `DeviceInfo` and `BusInfo`.","fix":"Format the `u64` `registry_id` with a 16-digit width, e.g. `&format_args!(\"0x{:016X}\", self.registry_id)`, while keeping `location_id` at `0x{:08X}`.","locations":[{"ref":"src/enumeration.rs:337-340","code":"  337 |             s.field(\n  338 |                 \"registry_entry_id\",\n  339 |                 &format_args!(\"0x{:08X}\", self.registry_id),\n  340 |             );","lines":4,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/enumeration.rs#L337-L340"},{"ref":"src/enumeration.rs:668-671","code":"  668 |             s.field(\n  669 |                 \"registry_entry_id\",\n  670 |                 &format_args!(\"0x{:08X}\", self.registry_id),\n  671 |             );","lines":4,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/enumeration.rs#L668-L671"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `Speed::SuperPlus` reads `/// Super speed (10000 Mbit)`, duplicating the wording of `Speed::Super` (`/// Super speed (5000 Mbit)`). The `SuperPlus` variant is USB SuperSpeed+ (Gen 2), so the prose should say `SuperSpeed+` to distinguish it from `Super`.","fix":"Change the comment to `/// SuperSpeed+ (10000 Mbit)` to match the variant name and disambiguate from `Super`.","locations":[{"ref":"src/enumeration.rs:365-366","code":"  365 |     /// Super speed (10000 Mbit)\n  366 |     SuperPlus,","lines":2,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/enumeration.rs#L365-L366"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`Endpoint::transfer_blocking` can block indefinitely. After the initial `timeout` expires it calls `self.cancel_all()` and then `loop`s calling `wait_next_complete(Duration::from_secs(1))` forever until the transfer is returned. If a cancelled transfer never comes back (e.g. a wedged driver or a device that was forcibly removed and whose completion is never delivered), this method hangs the calling thread permanently with only a repeated `warn!` log. The doc comment advertises the method as timeout-bounded (`cancelling it if the timeout is reached`), so callers do not expect an unbounded block.","fix":"Bound the post-cancel wait (e.g. cap total retries or accumulated wait time) and return a synthetic `Completion` with `TransferError::Cancelled` if the cancelled transfer still has not returned, or document explicitly that the method may block indefinitely after a timeout while awaiting cancellation.","locations":[{"ref":"src/device.rs:824-838","code":"  824 |     pub fn transfer_blocking(&mut self, buf: Buffer, timeout: Duration) -> Completion {\n  825 |         assert!(self.pending() == 0, \"a transfer is already pending\");\n  826 |         self.submit(buf);\n  827 |         if let Some(completion) = self.wait_next_complete(timeout) {\n  828 |             return completion;\n  829 |         }\n  830 | \n  831 |         self.cancel_all();\n  832 |         loop {\n  833 |             if let Some(completion) = self.wait_next_complete(Duration::from_secs(1)) {\n  834 |                 return completion;\n  835 |             }\n  836 |             log::warn!(\"cancelled transfer due to timeout, but it has not yet returned\");\n  837 |         }\n  838 |     }","lines":15,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/device.rs#L824-L838"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"hard","description":"Stale epoll events combined with `Slab` id reuse can dispatch to the wrong device/waker. When a\n`LinuxDevice` is dropped, its `events_id` slot in `DEVICES` (and a `Waker` slot in `WAKERS`) is freed\nand may be immediately reused by a newly created device/`Async`. If the single event thread has already\nfetched a batch of up to 4 events (`event_buf`) that contains a now-stale id, it will look the id up in\nthe reused slot and call `handle_usb_epoll`/wake on the wrong object. For devices this only causes a\nspurious extra `reap_urb_ndelay` on an unrelated device (harmless because reaping is idempotent and uses\nthat device's own fd); for wakers it causes a spurious wakeup. It is not memory-unsafe, but it is a\nlatent correctness hazard of identifying epoll registrations by reusable slab indices rather than by a\nvalue tied to the fd's lifetime.","fix":"Use a generation counter or monotonically increasing id (never reused) for epoll tags, or delete the\nfd from epoll and drain/ignore already-queued events for a freed id before allowing the slot to be\nreused, so a stale event can never be attributed to a different object.","locations":[{"ref":"src/platform/linux_usbfs/events.rs:96-110","code":"   96 |         for event in events {\n   97 |             match Tag::from_event_data(event.data) {\n   98 |                 Tag::Device(id) => Device::handle_usb_epoll(id),\n   99 |                 Tag::DeviceTimer(id) => Device::handle_timer_epoll(id),\n  100 |                 Tag::Waker(id) => {\n  101 |                     if let Some(waker) = WAKERS.lock().unwrap().get_mut(id) {\n  102 |                         if let Some(w) = waker.take() {\n  103 |                             w.wake();\n  104 |                         }\n  105 |                     }\n  106 |                 }\n  107 |             }\n  108 |         }\n  109 |     }\n  110 | }","lines":15,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/events.rs#L96-L110"},{"ref":"src/platform/linux_usbfs/device.rs:208-213","code":"  208 |     pub(crate) fn handle_usb_epoll(id: usize) {\n  209 |         let device = DEVICES.lock().unwrap().get(id).and_then(|w| w.upgrade());\n  210 |         if let Some(device) = device {\n  211 |             device.handle_events();\n  212 |         }\n  213 |     }","lines":6,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/platform/linux_usbfs/device.rs#L208-L213"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"Numerous `#[cfg(any(target_os = \"linux\"))]` attributes wrap a single predicate in `any(...)`, which is pointless - `any` with one argument is equivalent to the predicate alone. This is dead syntactic noise and inconsistent with the multi-target `any(...)` uses elsewhere in the same file.","fix":"Replace `#[cfg(any(target_os = \"linux\"))]` with `#[cfg(target_os = \"linux\")]` at each site.","locations":[{"ref":"src/enumeration.rs:4","code":"    4 | #[cfg(any(target_os = \"linux\"))]","lines":1,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/enumeration.rs#L4"},{"ref":"src/enumeration.rs:120","code":"  120 |     #[cfg(any(target_os = \"linux\"))]","lines":1,"link":"https://github.com/kevinmehall/nusb/blob/b494a205d039ac3d13b43adc5ce91dcb69230f2c/src/enumeration.rs#L120"},{"ref":"src/enumeration.rs:480","code":"  480 |     #[cfg(any(target_os = \"linux\"))]","lines":1,"link":"https://github.com/kevinmehal (function(){

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};

// State

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;

    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);

}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
