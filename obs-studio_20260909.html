{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`video_frame_copy` in `video-frame.c` checks `if (!heights[i])` but does NOT\ncheck `if (!src->data[i] || !dst->data[i])` before calling `memcpy`. If a\ncaller passes a src or dst frame where a plane pointer is NULL (e.g. a partially\ninitialized frame, or a frame where the format changed), memcpy is called with\na NULL pointer, which is undefined behavior and will crash.\n\n`video_frame_get_plane_heights` can return non-zero heights for planes that\nthe caller's frame doesn't have allocated (e.g. if the format argument passed\nto `video_frame_copy` doesn't match the actual format used to allocate the\nframe). The function documentation does not make this safety contract explicit.","fix":"Add NULL checks before each `memcpy` call:\n\n```c\nfor (uint32_t i = 0; i < MAX_AV_PLANES; i++) {\n    if (!heights[i] || !src->data[i] || !dst->data[i])\n        continue;\n    // ... existing copy logic\n}\n```","locations":[{"ref":"libobs/media-io/video-frame.c:244-262","code":"  244 | \t/* copy each plane */\n  245 | \tfor (uint32_t i = 0; i < MAX_AV_PLANES; i++) {\n  246 | \t\tif (!heights[i])\n  247 | \t\t\tcontinue;\n  248 | \n  249 | \t\tif (src->linesize[i] == dst->linesize[i]) {\n  250 | \t\t\tmemcpy(dst->data[i], src->data[i], src->linesize[i] * heights[i]);\n  251 | \t\t} else { /* linesizes which do not match must be copied line-by-line */\n  252 | \t\t\tsize_t src_linesize = src->linesize[i];\n  253 | \t\t\tsize_t dst_linesize = dst->linesize[i];\n  254 | \t\t\t/* determine how much we can write (frames with different line sizes require more )*/\n  255 | \t\t\tsize_t linesize = src_linesize < dst_linesize ? src_linesize : dst_linesize;\n  256 | \t\t\tfor (uint32_t y = 0; y < heights[i]; y++) {\n  257 | \t\t\t\tuint8_t *src_pos = src->data[i] + (src_linesize * y);\n  258 | \t\t\t\tuint8_t *dst_pos = dst->data[i] + (dst_linesize * y);\n  259 | \t\t\t\tmemcpy(dst_pos, src_pos, linesize);\n  260 | \t\t\t}\n  261 | \t\t}\n  262 | \t}","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-frame.c#L244-L262"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `video-io.c::init_cache`, `video_frame_init` is called with a cast:\n`frame = (struct video_frame *)&video->cache[i]`. However, `video->cache[i]`\nis a `struct cached_frame_info`, not a `struct video_frame`. `cached_frame_info`\nhas a `struct video_data frame` member (not `struct video_frame`), plus `int\nskipped` and `int count`. `struct video_data` has `uint8_t *data[MAX_AV_PLANES]`\nand `uint32_t linesize[MAX_AV_PLANES]`, which matches the layout of `struct\nvideo_frame`. The cast relies on `struct video_frame` and `struct video_data`\nbeing layout-compatible, which is true today but is not formally guaranteed\n(no `static_assert` enforces it). If either struct is modified, this silently\nbreaks. The proper fix is to use the `frame` member of `cached_frame_info`\ndirectly.\n\nSimilarly in `video_output_close`, `video_frame_free` is called with the same\ncast. This calls `bfree(frame->data[0])` which frees the allocation made by\n`video_frame_init`. This is intentional but relies on the same layout assumption.","fix":"`struct cached_frame_info` currently has `struct video_data frame` but the code\ncasts it to `struct video_frame *`. Add a compile-time assertion or refactor\n`cached_frame_info` to embed `struct video_frame` instead of `struct video_data`:\n\n```c\n// In struct cached_frame_info, change:\n//   struct video_data frame;\n// to:\n//   struct video_frame frame;\n// Then update all accesses to use frame.data / frame.linesize consistently.\n```\n\nAt minimum add:\n```c\nstatic_assert(sizeof(struct video_frame) == offsetof(struct video_data, timestamp),\n              \"video_frame and video_data layout mismatch\");\n```","locations":[{"ref":"libobs/media-io/video-io.c:229-237","code":"  229 | \tfor (size_t i = 0; i < video->info.cache_size; i++) {\n  230 | \t\tstruct video_frame *frame;\n  231 | \t\tframe = (struct video_frame *)&video->cache[i];\n  232 | \n  233 | \t\tvideo_frame_init(frame, video->info.format, video->info.width, video->info.height);\n  234 | \t}\n  235 | \n  236 | \tvideo->available_frames = video->info.cache_size;\n  237 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-io.c#L229-L237"},{"ref":"libobs/media-io/video-io.c:291-292","code":"  291 | \tfor (size_t i = 0; i < video->info.cache_size; i++)\n  292 | \t\tvideo_frame_free((struct video_frame *)&video->cache[i]);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-io.c#L291-L292"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `video-io.c::video_output_open`, the call to `init_cache` at line 262 is\nmade AFTER the video thread is started at line 259. The video thread immediately\nwaits on `update_semaphore` (which starts at 0), so it won't use the cache\nbefore it is initialized. However, `available_frames` is still 0 at thread\nstart (it is set by `init_cache`), and if anything posts to `update_semaphore`\nbetween thread creation and `init_cache` completing (e.g. via\n`video_output_lock_frame` called from another thread that saw the newly-created\n`video_t` pointer), the video thread could run with a partially-initialized\ncache. The semaphore starts at 0 so the thread will block, but the\n`available_frames` field is 0, and a concurrent `video_output_lock_frame` call\nwould see `available_frames == 0` and increment the skip counter on an\nuninitialized cache entry.\n\nThe fix is to call `init_cache` before starting the thread.","fix":"Move `init_cache(out)` to before `pthread_create`:\n\n```c\ninit_cache(out);\n\nif (pthread_create(&out->thread, NULL, video_thread, out) != 0)\n    goto fail3;\n\n*video = out;\nreturn VIDEO_OUTPUT_SUCCESS;\n\nfail3:\n    os_sem_destroy(out->update_semaphore);\n```\n\nThe `init_cache` function only sets `out->available_frames` and calls\n`video_frame_init` for cache entries - none of which requires the thread to\nbe running, so this reorder is safe.","locations":[{"ref":"libobs/media-io/video-io.c:239-276","code":"  239 | int video_output_open(video_t **video, struct video_output_info *info)\n  240 | {\n  241 | \tstruct video_output *out;\n  242 | \n  243 | \tif (!valid_video_params(info))\n  244 | \t\treturn VIDEO_OUTPUT_INVALIDPARAM;\n  245 | \n  246 | \tout = bzalloc(sizeof(struct video_output));\n  247 | \tif (!out)\n  248 | \t\tgoto fail0;\n  249 | \n  250 | \tmemcpy(&out->info, info, sizeof(struct video_output_info));\n  251 | \tout->frame_time = util_mul_div64(1000000000ULL, info->fps_den, info->fps_num);\n  252 | \n  253 | \tif (pthread_mutex_init_recursive(&out->data_mutex) != 0)\n  254 | \t\tgoto fail0;\n  255 | \tif (pthread_mutex_init_recursive(&out->input_mutex) != 0)\n  256 | \t\tgoto fail1;\n  257 | \tif (os_sem_init(&out->update_semaphore, 0) != 0)\n  258 | \t\tgoto fail2;\n  259 | \tif (pthread_create(&out->thread, NULL, video_thread, out) != 0)\n  260 | \t\tgoto fail3;\n  261 | \n  262 | \tinit_cache(out);\n  263 | \n  264 | \t*video = out;\n  265 | \treturn VIDEO_OUTPUT_SUCCESS;\n  266 | \n  267 | fail3:\n  268 | \tos_sem_destroy(out->update_semaphore);\n  269 | fail2:\n  270 | \tpthread_mutex_destroy(&out->input_mutex);\n  271 | fail1:\n  272 | \tpthread_mutex_destroy(&out->data_mutex);\n  273 | fail0:\n  274 | \tbfree(out);\n  275 | \treturn VIDEO_OUTPUT_FAIL;\n  276 | }","lines":38,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-io.c#L239-L276"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`video_output_close` in `video-io.c` acquires `input_mutex` while calling\n`video_input_free` (which calls `video_frame_free` and `video_scaler_destroy`),\nand then calls `video_output_stop` first. `video_output_stop` joins the video\nthread. The video thread calls `video_output_cur_frame` which acquires\n`input_mutex`. This ordering (stop -> join -> lock input_mutex -> free) is\ncorrect because the join ensures the thread is dead before the lock is taken.\n\nHowever, `video_output_close` then destroys `data_mutex` and `input_mutex`\nAFTER `pthread_mutex_unlock(&video->input_mutex)` but while still holding\nno lock. If any other thread concurrently calls `video_output_disconnect` or\n`video_output_connect` (which also take `input_mutex`) during close, they will\nbe using a mutex that is in the process of being destroyed. There is no\nreference counting to prevent this race. This is an architecture-level issue\nshared with much of OBS's object lifecycle.","fix":"Ensure callers of `video_output_close` guarantee no concurrent `video_output_connect`/`disconnect` calls are in flight (document this requirement clearly). Alternatively, add a `closing` flag checked under the mutex before `connect`/`disconnect` proceed.","locations":[{"ref":"libobs/media-io/video-io.c:278-300","code":"  278 | void video_output_close(video_t *video)\n  279 | {\n  280 | \tif (!video)\n  281 | \t\treturn;\n  282 | \n  283 | \tvideo_output_stop(video);\n  284 | \n  285 | \tpthread_mutex_lock(&video->input_mutex);\n  286 | \n  287 | \tfor (size_t i = 0; i < video->inputs.num; i++)\n  288 | \t\tvideo_input_free(&video->inputs.array[i]);\n  289 | \tda_free(video->inputs);\n  290 | \n  291 | \tfor (size_t i = 0; i < video->info.cache_size; i++)\n  292 | \t\tvideo_frame_free((struct video_frame *)&video->cache[i]);\n  293 | \n  294 | \tpthread_mutex_unlock(&video->input_mutex);\n  295 | \tos_sem_destroy(video->update_semaphore);\n  296 | \tpthread_mutex_destroy(&video->data_mutex);\n  297 | \tpthread_mutex_destroy(&video->input_mutex);\n  298 | \n  299 | \tbfree(video);\n  300 | }","lines":23,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-io.c#L278-L300"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `obs-audio-controls.c::volmeter_process_peak`, the loop increments\n`plane_nr` but the termination condition checks `channel_nr < nr_channels`.\nIf `data->data` has a NULL plane in the middle (which is legitimate for sparse\naudio layouts), `plane_nr` advances past the NULL plane but `channel_nr` does\nnot. This means `channel_nr` will eventually consume planes that logically\nbelong to different channel indices, and `plane_nr` can exceed `MAX_AV_PLANES`\nwithout bounds checking, reading `data->data[plane_nr]` out of bounds.\n\n`MAX_AV_PLANES` is 8 (from media-io-defs.h) and `MAX_AUDIO_CHANNELS` is\ntypically 8 as well, but if `nr_channels` (from `get_nr_channels_from_audio_data`)\nis less than the actual non-NULL planes, the loops can desync. Specifically,\n`plane_nr` is never bounded by `MAX_AV_PLANES` in either `volmeter_process_peak`\nor `volmeter_process_magnitude`.","fix":"Add a bounds check on `plane_nr` in both loops:\n\n```c\nfor (int plane_nr = 0; channel_nr < nr_channels && plane_nr < MAX_AV_PLANES; plane_nr++) {\n    float *samples = (float *)data->data[plane_nr];\n    if (!samples)\n        continue;\n    // ...\n    channel_nr++;\n}\n```","locations":[{"ref":"libobs/obs-audio-controls.c:419-454","code":"  419 | \tfor (int plane_nr = 0; channel_nr < nr_channels; plane_nr++) {\n  420 | \t\tfloat *samples = (float *)data->data[plane_nr];\n  421 | \t\tif (!samples) {\n  422 | \t\t\tcontinue;\n  423 | \t\t}\n  424 | \t\tif (((uintptr_t)samples & 0xf) > 0) {\n  425 | \t\t\tprintf(\"Audio plane %i is not aligned %p skipping \"\n  426 | \t\t\t       \"peak volume measurement.\\n\",\n  427 | \t\t\t       plane_nr, samples);\n  428 | \t\t\tvolmeter->peak[channel_nr] = 1.0;\n  429 | \t\t\tchannel_nr++;\n  430 | \t\t\tcontinue;\n  431 | \t\t}\n  432 | \n  433 | \t\t/* volmeter->prev_samples may not be aligned to 16 bytes;\n  434 | \t\t * use unaligned load. */\n  435 | \t\t__m128 previous_samples = _mm_loadu_ps(volmeter->prev_samples[channel_nr]);\n  436 | \n  437 | \t\tfloat peak;\n  438 | \t\tswitch (volmeter->peak_meter_type) {\n  439 | \t\tcase TRUE_PEAK_METER:\n  440 | \t\t\tpeak = get_true_peak(previous_samples, samples, nr_samples);\n  441 | \t\t\tbreak;\n  442 | \n  443 | \t\tcase SAMPLE_PEAK_METER:\n  444 | \t\tdefault:\n  445 | \t\t\tpeak = get_sample_peak(previous_samples, samples, nr_samples);\n  446 | \t\t\tbreak;\n  447 | \t\t}\n  448 | \n  449 | \t\tvolmeter_process_peak_last_samples(volmeter, channel_nr, samples, nr_samples);\n  450 | \n  451 | \t\tvolmeter->peak[channel_nr] = peak;\n  452 | \n  453 | \t\tchannel_nr++;\n  454 | \t}","lines":36,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-audio-controls.c#L419-L454"},{"ref":"libobs/obs-audio-controls.c:466-481","code":"  466 | \tint channel_nr = 0;\n  467 | \tfor (int plane_nr = 0; channel_nr < nr_channels; plane_nr++) {\n  468 | \t\tfloat *samples = (float *)data->data[plane_nr];\n  469 | \t\tif (!samples) {\n  470 | \t\t\tcontinue;\n  471 | \t\t}\n  472 | \n  473 | \t\tfloat sum = 0.0;\n  474 | \t\tfor (size_t i = 0; i < nr_samples; i++) {\n  475 | \t\t\tfloat sample = samples[i];\n  476 | \t\t\tsum += sample * sample;\n  477 | \t\t}\n  478 | \t\tvolmeter->magnitude[channel_nr] = sqrtf(sum / nr_samples);\n  479 | \n  480 | \t\tchannel_nr++;\n  481 | \t}","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-audio-controls.c#L466-L481"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`obs-avc.c::get_sps_high_params` parses Exp-Golomb coded values from the SPS\nusing `get_ue_golomb`, which returns `uint8_t`. However, `chroma_format_idc`,\n`bit_depth_luma_minus8`, and `bit_depth_chroma_minus8` can legitimately be\nvalues from 0-3, 0-6, and 0-6 respectively according to the H.264 spec, and\nthese are stored in `uint8_t` output parameters, so the type is fine.\n\nThe real issue: `get_ue_golomb` reads up to 32 leading zero bits, then reads\n`i` more bits, and returns `bitstream_reader_read_bits(gb, i) + (1 << i) - 1`.\nIf i=0, this returns `bitstream_reader_read_bits(gb, 0) + 0 = 0`, which is\ncorrect. If i=32, `1 << 32` is undefined behavior for 32-bit int (shift by\nwidth). The function caps `i` at 32 via `i < 32`, but if i reaches 32 the\nexpression `(1 << i)` with i=32 is still UB. In practice SPS values for AVC\nare much smaller, but the UB exists.\n\nAdditionally, `get_sps_high_params` skips profile/constraints/level (3 bytes),\nthen skips seq_parameter_set_id (Golomb), then reads chroma_format_idc. However\nit does NOT skip `separate_colour_plane_flag` if `chroma_format_idc == 3`\nBEFORE reading bit_depth_luma_minus8. The code reads:\n  1. profile+constraints+level (24 bits)\n  2. seq_parameter_set_id (Golomb) - labeled \"id\"\n  3. chroma_format_idc (Golomb)\n  4. if chroma_format_idc==3: skip 1 bit (separate_colour_plane_flag)\n  5. bit_depth_luma = get_ue_golomb()  -- reads bit_depth_luma_minus8\n  6. bit_depth_chroma = get_ue_golomb() -- reads bit_depth_chroma_minus8\n\nThis matches the SPS high profile syntax exactly, so it is correct. But note\nthat the SPS RBSP starts with `forbidden_zero_bit` (1 bit), `nal_ref_idc` (2\nbits), and `nal_unit_type` (5 bits) as part of the NAL unit header BEFORE the\nRBSP. The caller passes `sps + 1` to skip the NAL header byte, which is correct\nsince the NAL header is 1 byte.\n\nThe actual bug: `bitstream_reader_read_bits(gb, i)` where `i==0` returns 0\nand does not advance the bitstream, so the leading-zero count for i=0 is\ncorrect (value = 0+1-1 = 0). This is fine. But `1 << 32` when i==32 is UB.","fix":"Guard against i==32 to avoid the UB shift:\n\n```c\nstatic inline uint8_t get_ue_golomb(struct bitstream_reader *gb)\n{\n    int i = 0;\n    while (i < 31 && !bitstream_reader_read_bits(gb, 1))\n        i++;\n\n    return (uint8_t)(bitstream_reader_read_bits(gb, i) + (1 << i) - 1);\n}\n```\nCapping at 31 keeps the maximum return value at 2^31 - 1, still well above\nany valid AVC SPS Exp-Golomb value, and avoids the UB shift.","locations":[{"ref":"libobs/obs-avc.c:167-173","code":"  167 | static inline uint8_t get_ue_golomb(struct bitstream_reader *gb)\n  168 | {\n  169 | \tint i = 0;\n  170 | \twhile (i < 32 && !bitstream_reader_read_bits(gb, 1))\n  171 | \t\ti++;\n  172 | \n  173 | \treturn bitstream_reader_read_bits(gb, i) + (1 << i) - 1;","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-avc.c#L167-L173"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `obs-cocoa.m::hotkeys_release`, the refcount starts at 0 (bzalloc\nzero-initializes), and `hotkeys_retain` increments it with `os_atomic_inc_long`.\nThe first `hotkeys_retain` call in `obs_hotkeys_platform_init` is implicit\n(there is none - the platform is just stored without retaining). The `refs`\nfield is 0 after allocation. `hotkeys_release` frees when `refs` drops to -1\n(`os_atomic_dec_long == -1`). This means the initial state has `refs == 0`\nand the object is freed after the first release without a matching retain.\n\nIn `obs_hotkeys_platform_init`: `platform` is allocated (refs=0), stored in\n`hotkeys->platform_context`, and then `currentPlatform` (the old one) is\nreleased. If `currentPlatform` was also at refs=0, releasing it immediately\nfrees it. The new `platform` is also at refs=0. The function `hotkeys_retain`\nis called in `obs_key_to_str` to temporarily bump the refcount before use, and\n`hotkeys_release` is called to drop it. This means:\n- After init: refs=0 (one implicit owner: hotkeys->platform_context)\n- During `obs_key_to_str`: refs bumped to 1, then decremented back to 0\n- When `InputMethodChangedProc` replaces the platform: old platform released\n  (0 -> -1 => freed). This is the expected one-time release for the \"owned\"\n  reference.\n\nSo the convention is: refs=0 means \"owned by one implicit holder\", and -1 is\nthe destroy threshold. This is an unusual but internally consistent design.\nHowever, there is a race: between `hotkeys->platform_context = platform` (where\nrefs=0) and a concurrent `obs_key_to_str` call that reads\n`hotkeys->platform_context` under the mutex, retains it (refs=1), then releases\nit (refs=0). Then `InputMethodChangedProc` runs and releases (refs=-1 -> freed).\nBut `obs_key_to_str` already released back to 0 - `InputMethodChangedProc`\nsees 0 and decrements to -1 AFTER `obs_key_to_str` already decremented to 0.\nThis double-free is a real race condition.\n\nThe retain/release protocol should use 1 as the initial refcount (owned\nreference) and free at 0.","fix":"Initialize `refs` to 1 to represent the initial owner reference, and free when\n`refs` reaches 0:\n\n```objc\nstatic void hotkeys_retain(obs_hotkeys_platform_t *platform)\n{\n    os_atomic_inc_long(&platform->refs);\n}\n\nstatic void hotkeys_release(obs_hotkeys_platform_t *platform)\n{\n    if (os_atomic_dec_long(&platform->refs) == 0) {\n        // ... free resources and bfree(platform)\n    }\n}\n```\n\nAnd in `obs_hotkeys_platform_init`, after `platform = bzalloc(...)`, set\n`platform->refs = 1` to represent the owner reference held by\n`hotkeys->platform_context`.","locations":[{"ref":"libobs/obs-cocoa.m:440-466","code":"  440 | static void hotkeys_retain(obs_hotkeys_platform_t *platform)\n  441 | {\n  442 |     os_atomic_inc_long(&platform->refs);\n  443 | }\n  444 | \n  445 | static void hotkeys_release(obs_hotkeys_platform_t *platform)\n  446 | {\n  447 |     if (os_atomic_dec_long(&platform->refs) == -1) {\n  448 |         if (platform->tis) {\n  449 |             CFRelease(platform->tis);\n  450 |             platform->tis = NULL;\n  451 |         }\n  452 | \n  453 |         if (platform->layout_data) {\n  454 |             CFRelease(platform->layout_data);\n  455 |             platform->layout_data = NULL;\n  456 |         }\n  457 | \n  458 |         if (platform->eventTap) {\n  459 |             CGEventTapEnable(platform->eventTap, false);\n  460 |             CFRelease(platform->eventTap);\n  461 |             platform->eventTap = NULL;\n  462 |         }\n  463 | \n  464 |         bfree(platform);\n  465 |     }\n  466 | }","lines":27,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-cocoa.m#L440-L466"},{"ref":"libobs/obs-cocoa.m:587-657","code":"  587 | bool obs_hotkeys_platform_init(struct obs_core_hotkeys *hotkeys)\n  588 | {\n  589 |     CFNotificationCenterAddObserver(CFNotificationCenterGetDistributedCenter(), hotkeys, InputMethodChangedProc,\n  590 |                                     kTISNotifySelectedKeyboardInputSourceChanged, NULL,\n  591 |                                     CFNotificationSuspensionBehaviorDeliverImmediately);\n  592 | \n  593 |     obs_hotkeys_platform_t *platform = bzalloc(sizeof(obs_hotkeys_platform_t));\n  594 | \n  595 |     const bool has_event_access = CGPreflightListenEventAccess();\n  596 |     if (has_event_access) {\n  597 |         platform->eventTap = CGEventTapCreate(kCGHIDEventTap, kCGHeadInsertEventTap, kCGEventTapOptionListenOnly,\n  598 |                                               CGEventMaskBit(kCGEventKeyDown) | CGEventMaskBit(kCGEventKeyUp) |\n  599 |                                                   CGEventMaskBit(kCGEventFlagsChanged),\n  600 |                                               KeyboardEventProc, platform);\n  601 |         if (!platform->eventTap) {\n  602 |             blog(LOG_WARNING, \"[hotkeys-cocoa]: Couldn't create hotkey event tap.\");\n  603 |             hotkeys_release(platform);\n  604 |             platform = NULL;\n  605 |             return false;\n  606 |         }\n  607 |         CFRunLoopSourceRef source = CFMachPortCreateRunLoopSource(kCFAllocatorDefault, platform->eventTap, 0);\n  608 |         CFRunLoopAddSource(CFRunLoopGetCurrent(), source, kCFRunLoopCommonModes);\n  609 |         CFRelease(source);\n  610 | \n  611 |         CGEventTapEnable(platform->eventTap, true);\n  612 |     } else {\n  613 |         blog(LOG_WARNING, \"[hotkeys-cocoa]: No event permissions, could not add global hotkeys.\");\n  614 |     }\n  615 | \n  616 |     platform->tis = TISCopyCurrentKeyboardLayoutInputSource();\n  617 |     platform->layout_data = (CFDataRef) TISGetInputSourceProperty(platform->tis, kTISPropertyUnicodeKeyLayoutData);\n  618 | \n  619 |     if (!platform->layout_data) {\n  620 |         blog(LOG_ERROR, \"hotkeys-cocoa: Failed to retrieve keyboard layout data\");\n  621 |         hotkeys_release(platform);\n  622 |         platform = NULL;\n  623 |         return false;\n  624 |     }\n  625 | \n  626 |     CFRetain(platform->layout_data);\n  627 |     platform->layout = (UCKeyboardLayout *) CFDataGetBytePtr(platform->layout_data);\n  628 | \n  629 |     obs_hotkeys_platform_t *currentPlatform;\n  630 | \n  631 |     pthread_mutex_lock(&hotkeys->mutex);\n  632 | \n  633 |     currentPlatform = hotkeys->platform_context;\n  634 | \n  635 |     if (platform && currentPlatform && platform->layout_data == currentPlatform->layout_data) {\n  636 |         pthread_mutex_unlock(&hotkeys->mutex);\n  637 |         hotkeys_release(platform);\n  638 |         return true;\n  639 |     }\n  640 | \n  641 |     hotkeys->platform_context = platform;\n  642 | \n  643 |     log_layout_name(platform->tis);\n  644 | \n  645 |     pthread_mutex_unlock(&hotkeys->mutex);\n  646 | \n  647 |     calldata_t parameters = {0};\n  648 |     signal_handler_signal(hotkeys->signals, \"hotkey_layout_change\", &parameters);\n  649 | \n  650 |     if (currentPlatform) {\n  651 |         hotkeys_release(currentPlatform);\n  652 |     }\n  653 | \n  654 |     bool hasPlatformContext = hotkeys->platform_context != NULL;\n  655 | \n  656 |     return hasPlatformContext;\n  657 | }","lines":71,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-cocoa.m#L587-L657"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `obs-cocoa.m::obs_hotkeys_platform_is_pressed`, the mouse button check uses\n`int button = key - 1`. `OBS_KEY_MOUSE1` has a numeric value (typically 212 or\nsimilar based on the OBS key enum), so `key - OBS_KEY_MOUSE1` is the correct\nzero-based button index, but the code uses `key - 1` instead. This maps\n`OBS_KEY_MOUSE1` to button `OBS_KEY_MOUSE1 - 1`, which is likely another key's\nnumeric value and is almost certainly not 0. The NSEvent button indices are\n0-based (0=left, 1=right, 2=middle, etc.), so this will read the wrong button\nstate for all mouse button hotkeys.","fix":"Use `OBS_KEY_MOUSE1` as the base:\n\n```objc\nint button = key - OBS_KEY_MOUSE1;\n```","locations":[{"ref":"libobs/obs-cocoa.m:686-709","code":"  686 | bool obs_hotkeys_platform_is_pressed(obs_hotkeys_platform_t *platform, obs_key_t key)\n  687 | {\n  688 |     if (key >= OBS_KEY_MOUSE1 && key <= OBS_KEY_MOUSE29) {\n  689 |         int button = key - 1;\n  690 | \n  691 |         NSUInteger buttons = [NSEvent pressedMouseButtons];\n  692 | \n  693 |         if ((buttons & (1 << button)) != 0) {\n  694 |             return true;\n  695 |         } else {\n  696 |             return false;\n  697 |         }\n  698 |     }\n  699 | \n  700 |     if (!platform) {\n  701 |         return false;\n  702 |     }\n  703 | \n  704 |     if (key >= OBS_KEY_LAST_VALUE) {\n  705 |         return false;\n  706 |     }\n  707 | \n  708 |     return platform->is_key_down[key];\n  709 | }","lines":24,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-cocoa.m#L686-L709"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`obs_hotkey_set_name` and `obs_hotkey_set_description` are public exported functions that modify hotkey name/description strings while holding no mutex. The hotkey thread (`obs_hotkey_thread`) acquires `obs->hotkeys.mutex` before calling `query_hotkeys`, which reads `hotkey->name` indirectly via signals. A concurrent call to `obs_hotkey_set_name` can free and reallocate `hotkey->name` while the signal handler is reading it, causing a use-after-free or heap corruption.","fix":"Acquire and release the hotkey mutex around the modification:\n```c\nvoid obs_hotkey_set_name(obs_hotkey_id id, const char *name)\n{\n    if (!lock())\n        return;\n    obs_hotkey_t *hotkey;\n    HASH_FIND_HKEY(obs->hotkeys.hotkeys, id, hotkey);\n    if (hotkey) {\n        bfree(hotkey->name);\n        hotkey->name = bstrdup(name);\n    }\n    unlock();\n}\n```\nApply the same change to `obs_hotkey_set_description`.","locations":[{"ref":"libobs/obs-hotkey.c:91-111","code":"   91 | void obs_hotkey_set_name(obs_hotkey_id id, const char *name)\n   92 | {\n   93 | \tobs_hotkey_t *hotkey;\n   94 | \tHASH_FIND_HKEY(obs->hotkeys.hotkeys, id, hotkey);\n   95 | \tif (!hotkey)\n   96 | \t\treturn;\n   97 | \n   98 | \tbfree(hotkey->name);\n   99 | \thotkey->name = bstrdup(name);\n  100 | }\n  101 | \n  102 | void obs_hotkey_set_description(obs_hotkey_id id, const char *desc)\n  103 | {\n  104 | \tobs_hotkey_t *hotkey;\n  105 | \tHASH_FIND_HKEY(obs->hotkeys.hotkeys, id, hotkey);\n  106 | \tif (!hotkey)\n  107 | \t\treturn;\n  108 | \n  109 | \tbfree(hotkey->description);\n  110 | \thotkey->description = bstrdup(desc);\n  111 | }","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-hotkey.c#L91-L111"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`platform_keyboard_modifiers` calls `xkb_state_update_mask(plat->xkb_state, ...)` without\nchecking whether `plat->xkb_state` is NULL. `xkb_state` starts as NULL (the struct is\nzero-initialised via `bzalloc`) and is only populated after the first `wl_keyboard.keymap`\nevent. The Wayland protocol does not guarantee that `keymap` always precedes `modifiers`\nacross all compositor implementations; if `modifiers` fires first (e.g. after a seat\nhotplug) `xkb_state_update_mask(NULL, ...)` dereferences NULL and crashes.","fix":"Guard the modifier update:\n\n```c\nif (!plat->xkb_state)\n    return;\nxkb_state_update_mask(plat->xkb_state, mods_depressed, mods_latched,\n                      mods_locked, 0, 0, group);\nif (plat->current_layout != group) {\n    plat->current_layout = group;\n    rebuild_keymap_data(plat);\n}\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:103-115","code":"  103 | static void platform_keyboard_modifiers(void *data, struct wl_keyboard *keyboard, uint32_t serial,\n  104 | \t\t\t\t\tuint32_t mods_depressed, uint32_t mods_latched, uint32_t mods_locked,\n  105 | \t\t\t\t\tuint32_t group)\n  106 | {\n  107 | \tUNUSED_PARAMETER(keyboard);\n  108 | \tUNUSED_PARAMETER(serial);\n  109 | \tobs_hotkeys_platform_t *plat = (obs_hotkeys_platform_t *)data;\n  110 | \txkb_state_update_mask(plat->xkb_state, mods_depressed, mods_latched, mods_locked, 0, 0, group);\n  111 | \n  112 | \tif (plat->current_layout != group) {\n  113 | \t\tplat->current_layout = group;\n  114 | \t\trebuild_keymap_data(plat);\n  115 | \t}","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L103-L115"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"If the compositor advertises more than one `wl_seat` global (which is uncommon but\npermitted), `platform_registry_handler` is called twice. On the second call,\n`plat->seat` is already non-NULL, but the code unconditionally overwrites it with the new\nbinding without releasing the old `wl_seat` or its associated `wl_keyboard`. This leaks\nthe first seat and keyboard proxies and leaves them registered with the compositor.","fix":"Skip subsequent seats (the common case for simple setups) or release the previous one\nbefore binding the new one. The simplest safe fix is to ignore additional seats:\n\n```c\nif (strcmp(interface, wl_seat_interface.name) == 0) {\n    if (plat->seat != NULL)\n        return; // already have a seat\n    if (version < 4) {\n        blog(LOG_WARNING, \"[wayland] hotkeys disabled, compositor is too old\");\n        return;\n    }\n    plat->seat = wl_registry_bind(registry, id, &wl_seat_interface,\n                                  version <= 7 ? version : 7);\n    wl_seat_add_listener(plat->seat, &seat_listener, plat);\n}\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:199-213","code":"  199 | static void platform_registry_handler(void *data, struct wl_registry *registry, uint32_t id, const char *interface,\n  200 | \t\t\t\t      uint32_t version)\n  201 | {\n  202 | \tobs_hotkeys_platform_t *plat = (obs_hotkeys_platform_t *)data;\n  203 | \n  204 | \tif (strcmp(interface, wl_seat_interface.name) == 0) {\n  205 | \t\tif (version < 4) {\n  206 | \t\t\tblog(LOG_WARNING, \"[wayland] hotkeys disabled, compositor is too old\");\n  207 | \t\t\treturn;\n  208 | \t\t}\n  209 | \t\t// Only negotiate up to version 7, the current wl_seat at time of writing.\n  210 | \t\tplat->seat = wl_registry_bind(registry, id, &wl_seat_interface, version <= 7 ? version : 7);\n  211 | \t\twl_seat_add_listener(plat->seat, &seat_listener, plat);\n  212 | \t}\n  213 | }","lines":15,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L199-L213"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`aja_source_update` uses a function-scope `static bool initialized`, so the flag is shared across every AJA capture source instance rather than being per-source. It is consulted in `if (!initialized || want_props != ajaSource->GetSourceProps())` and reset to `false` whenever a source's card ID changes. With two or more AJA sources, one source resetting `initialized` (e.g. on a card change/removal) forces an unrelated source to tear down and restart its capture thread on its next update even when nothing changed for it, and conversely one source setting `initialized = true` can suppress the intended `!initialized` fast-path of another. State that is logically per-instance is being kept as global plugin state.","fix":"Store `initialized` as a member of `AJASource` (e.g. `mInitialized`) with accessors, instead of a `static` local in `aja_source_update`, so each source tracks its own initialization state.","locations":[{"ref":"plugins/aja/aja-source.cpp:854-856","code":"  854 | static void aja_source_update(void *data, obs_data_t *settings)\n  855 | {\n  856 | \tstatic bool initialized = false;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/aja/aja-source.cpp#L854-L856"},{"ref":"plugins/aja/aja-source.cpp:877-880","code":"  877 | \tif (wantCardID != currentCardID) {\n  878 | \t\tinitialized = false;\n  879 | \t\tajaSource->Deactivate();\n  880 | \t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/aja/aja-source.cpp#L877-L880"},{"ref":"plugins/aja/aja-source.cpp:992-999","code":"  992 | \tif (!initialized || want_props != ajaSource->GetSourceProps()) {\n  993 | \t\tajaSource->ClearConnections();\n  994 | \t\tNTV2XptConnections xpt_cnx;\n  995 | \t\taja::Routing::ConfigureSourceRoute(want_props, NTV2_MODE_CAPTURE, card, xpt_cnx);\n  996 | \t\tajaSource->CacheConnections(xpt_cnx);\n  997 | \t\tajaSource->Deactivate();\n  998 | \t\tinitialized = true;\n  999 | \t}","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/aja/aja-source.cpp#L992-L999"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `OBSVideoFrame::~OBSVideoFrame` the buffer is freed with scalar `delete` even though it was allocated with array `new[]` (`new unsigned char[width * height * bpp + 1]`). Mismatched `new[]`/`delete` is undefined behavior (only the first element's destructor / an incorrect deallocation size is assumed), and can corrupt the heap or leak with debug allocators.","fix":"Use the array form:\n```cpp\ndelete[] this->data;\n```","locations":[{"ref":"plugins/decklink/OBSVideoFrame.cpp:9-16","code":"    9 | \tthis->data = new unsigned char[width * height * bpp + 1];\n   10 | \tthis->pixelFormat = pixelFormat;\n   11 | }\n   12 | \n   13 | OBSVideoFrame::~OBSVideoFrame()\n   14 | {\n   15 | \tdelete this->data;\n   16 | }","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/decklink/OBSVideoFrame.cpp#L9-L16"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `xcb_xcursor_create` the size-comparison used to decide whether to reuse the existing cursor texture swaps width and height: it checks `data->last_height == xc->width && data->last_width == xc->height` instead of `data->last_width == xc->width && data->last_height == xc->height`. For any non-square cursor whose size does NOT change (e.g. a 32x24 cursor), the condition is false every update, so the texture is destroyed and recreated with `gs_texture_create` on every cursor refresh instead of taking the fast `gs_texture_set_image` path (needless per-frame reallocation). Conversely, if a cursor's dimensions become the transpose of the previous ones, it wrongly reuses the old texture and uploads with the wrong line size, corrupting the cursor image.","fix":"Compare matching axes:\n```c\nif (data->tex && data->last_width == xc->width && data->last_height == xc->height) {\n```","locations":[{"ref":"plugins/linux-capture/xcursor-xcb.c:35","code":"   35 | \tif (data->tex && data->last_height == xc->width && data->last_width == xc->height) {","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-capture/xcursor-xcb.c#L35"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `jack_process_callback` the fallback timestamp branch divides by `data->samples_per_sec`, but that field is never assigned anywhere in the plugin (`bzalloc` leaves it 0, and only `out.samples_per_sec` is set from `jack_get_sample_rate`). `util_mul_div64` computes `num % div` and `num / div`, so a `div` of 0 is an integer division by zero (SIGFPE / UB). This path is taken whenever `jack_get_cycle_times` fails.","fix":"Use the sample rate that was just fetched into `out`:\n```c\nout.timestamp = now - util_mul_div64(nframes, 1000000000ULL, out.samples_per_sec);\n```\n(Alternatively populate `data->samples_per_sec` in `jack_init`.)","locations":[{"ref":"plugins/linux-jack/jack-wrapper.c:89","code":"   89 | \t\tout.timestamp = now - util_mul_div64(nframes, 1000000000ULL, data->samples_per_sec);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-jack/jack-wrapper.c#L89"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `v4l2_thread`, `timeout_usec` is computed as `(1000000 * data->timeout_frames) / ffps` and assigned directly to `tv.tv_usec`. `tv_usec` must be in the range `[0, 999999]`; when the value reaches or exceeds one second (e.g. a low-framerate device, or a large `timeout_frames` setting - the property allows up to 120), `select()` returns `EINVAL`. That is not `EINTR`, so the code logs `select failed` and breaks out of the loop, terminating capture. For example a 5 fps device with the default `timeout_frames=5` yields `timeout_usec == 1000000`.","fix":"Split the timeout into seconds and microseconds:\n```c\ntv.tv_sec = timeout_usec / 1000000;\ntv.tv_usec = timeout_usec % 1000000;\n```","locations":[{"ref":"plugins/linux-v4l2/v4l2-input.c:184-207","code":"  184 | \ttimeout_usec = (1000000 * data->timeout_frames) / ffps;\n  185 | \tblog(LOG_INFO, \"%s: select timeout set to %\" PRIu64 \" (%dx frame periods)\", data->device_id, timeout_usec,\n  186 | \t     data->timeout_frames);\n  187 | \n  188 | \tif (v4l2_start_capture(data->dev, &data->buffers) < 0)\n  189 | \t\tgoto exit;\n  190 | \n  191 | \tblog(LOG_DEBUG, \"%s: new capture started\", data->device_id);\n  192 | \n  193 | \tframes = 0;\n  194 | \tfirst_ts = 0;\n  195 | \tv4l2_prep_obs_frame(data, &out, plane_offsets);\n  196 | \n  197 | \tblog(LOG_DEBUG, \"%s: obs frame prepared\", data->device_id);\n  198 | \n  199 | \twhile (os_event_try(data->event) == EAGAIN) {\n  200 | \t\tFD_ZERO(&fds);\n  201 | \t\tFD_SET(data->dev, &fds);\n  202 | \n  203 | \t\t/* Set timeout timevalue. */\n  204 | \t\ttv.tv_sec = 0;\n  205 | \t\ttv.tv_usec = timeout_usec;\n  206 | \n  207 | \t\tr = select(data->dev + 1, &fds, NULL, NULL, &tv);","lines":24,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-v4l2/v4l2-input.c#L184-L207"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `switch (subtype)` in `bitsPerPixel` has no `break` statements. Every non-default case sets `value` and then falls through to the next case, ultimately reaching `default:` which sets `value = 32`. As a result `bitsPerPixel` always returns 32 regardless of the actual pixel format, defeating its purpose (e.g. for format sorting/bandwidth comparisons).","fix":"Add a `break;` after each case body (after `value = 16;`, `value = 32;`, `value = 12;`, `value = 24;`).","locations":[{"ref":"plugins/mac-avcapture/AVCaptureDeviceFormat+OBSListable.m:93-111","code":"   93 |         switch (subtype) {\n   94 |             case kCVPixelFormatType_422YpCbCr8:\n   95 |             case kCVPixelFormatType_422YpCbCr8_yuvs:\n   96 |                 //2x2 block, 4 bytes luma, 2 bytes Cr, 2 bytes Cb; 64 / 4\n   97 |                 value = 16;\n   98 |             case kCVPixelFormatType_32BGRA:\n   99 |                 value = 32;\n  100 |             case kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange:\n  101 |             case kCVPixelFormatType_420YpCbCr8BiPlanarFullRange:\n  102 |                 //2x2 block, 4 bytes luma, 1 byte Cr, 1 byte Cb; 48 / 4\n  103 |                 value = 12;\n  104 |             case kCVPixelFormatType_420YpCbCr10BiPlanarFullRange:\n  105 |             case kCVPixelFormatType_420YpCbCr10BiPlanarVideoRange:\n  106 |                 //2x2 block, 8 bytes luma, 2 bytes Cr, 2 bytes Cb; 96 / 4\n  107 |                 value = 24;\n  108 |             default:\n  109 |                 //what other formats do we need to possibly account for?\n  110 |                 value = 32;\n  111 |         }","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-avcapture/AVCaptureDeviceFormat+OBSListable.m#L93-L111"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`ca->active` is declared and read in `coreaudio_start` (`if (ca->active) return true;`) and `coreaudio_stop` (`if (!ca->active) return;`) but is NEVER assigned `true` anywhere in the file. Consequently `coreaudio_stop` always hits the early `return` and never calls `AudioOutputUnitStop`. `coreaudio_stop` is effectively dead code, and the running `AudioUnit` is never explicitly stopped before `AudioUnitUninitialize`/`AudioComponentInstanceDispose` (it only works because uninitialize tears the unit down). The `notification_callback` path that calls `coreaudio_stop` expecting the unit to stop is silently broken.","fix":"Set the flag on successful start, e.g. after `AudioOutputUnitStart` succeeds:\n```c\nstat = AudioOutputUnitStart(ca->unit);\nif (!ca_success(stat, ca, \"coreaudio_start\", \"start audio\"))\n    return false;\nca->active = true;\nreturn true;\n```","locations":[{"ref":"plugins/mac-capture/mac-audio.c:602-624","code":"  602 | static bool coreaudio_start(struct coreaudio_data *ca)\n  603 | {\n  604 | \tOSStatus stat;\n  605 | \n  606 | \tif (ca->active)\n  607 | \t\treturn true;\n  608 | \n  609 | \tstat = AudioOutputUnitStart(ca->unit);\n  610 | \treturn ca_success(stat, ca, \"coreaudio_start\", \"start audio\");\n  611 | }\n  612 | \n  613 | static void coreaudio_stop(struct coreaudio_data *ca)\n  614 | {\n  615 | \tOSStatus stat;\n  616 | \n  617 | \tif (!ca->active)\n  618 | \t\treturn;\n  619 | \n  620 | \tca->active = false;\n  621 | \n  622 | \tstat = AudioOutputUnitStop(ca->unit);\n  623 | \tca_success(stat, ca, \"coreaudio_stop\", \"stop audio\");\n  624 | }","lines":23,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-capture/mac-audio.c#L602-L624"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`nvidia_audio_destroy` acquires `ng->nvafx_mutex` (line 137) and only releases it after `pthread_join(ng->nvafx_thread, ...)` (lines 165-166). The joined thread runs `nvidia_audio_initialize`, whose first action is `pthread_mutex_lock(&ng->nvafx_mutex)` (line 403). If the filter is destroyed while the init thread has been created but has not yet acquired the mutex (a race window that exists because `nvidia_audio_update` spawns the thread and returns), `destroy` wins the lock, then blocks forever in `pthread_join` waiting for a thread that is itself blocked on the same mutex. Classic lock-held-across-join deadlock that hangs the thread tearing the filter down (e.g. on scene/source removal or shutdown during the ~2s FX load).","fix":"Join the init thread before taking the mutex (or release the mutex before joining). For example, move `pthread_join(ng->nvafx_thread, NULL);` to before `pthread_mutex_lock(&ng->nvafx_mutex);`, so the worker can complete and release the mutex before destroy acquires it.","locations":[{"ref":"plugins/nv-filters/nvidia-audiofx-filter.c:136-168","code":"  136 | \tif (ng->nvidia_sdk_dir_found)\n  137 | \t\tpthread_mutex_lock(&ng->nvafx_mutex);\n  138 | \n  139 | \tif (nvafx_new_sdk)\n  140 | \t\tNvAFX_UninitializeLogger();\n  141 | \n  142 | \tfor (size_t i = 0; i < ng->channels; i++) {\n  143 | \t\tif (ng->handle[0]) {\n  144 | \t\t\tif (NvAFX_DestroyEffect) {\n  145 | \t\t\t\tNvAFX_Status err = NvAFX_DestroyEffect(ng->handle[i]);\n  146 | \t\t\t\tif (err != NVAFX_STATUS_SUCCESS) {\n  147 | \t\t\t\t\tdo_log(LOG_ERROR, \"NvAFX_Release() failed\");\n  148 | \t\t\t\t}\n  149 | \t\t\t}\n  150 | \t\t}\n  151 | \t\tdeque_free(&ng->input_buffers[i]);\n  152 | \t\tdeque_free(&ng->output_buffers[i]);\n  153 | \t}\n  154 | \n  155 | \tbfree(ng->nvafx_segment_buffers[0]);\n  156 | \n  157 | \tif (ng->nvafx_resampler) {\n  158 | \t\taudio_resampler_destroy(ng->nvafx_resampler);\n  159 | \t\taudio_resampler_destroy(ng->nvafx_resampler_back);\n  160 | \t}\n  161 | \tbfree(ng->model);\n  162 | \tbfree(ng->sdk_path);\n  163 | \tbfree((void *)ng->fx);\n  164 | \tif (ng->nvidia_sdk_dir_found) {\n  165 | \t\tpthread_join(ng->nvafx_thread, NULL);\n  166 | \t\tpthread_mutex_unlock(&ng->nvafx_mutex);\n  167 | \t\tpthread_mutex_destroy(&ng->nvafx_mutex);\n  168 | \t}","lines":33,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-audiofx-filter.c#L136-L168"},{"ref":"plugins/nv-filters/nvidia-audiofx-filter.c:403-404","code":"  403 | \tpthread_mutex_lock(&ng->nvafx_mutex);\n  404 | \tpthread_mutex_lock(&nvidia_afx_initializer_mutex);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-audiofx-filter.c#L403-L404"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`get_rc_mode()` never applies its intended fallback. After the `while` loop, `rc_mode` points either to a matching entry or to the terminating sentinel `{0}` (whose `.name` is `NULL`); it is never `NULL`, so `return rc_mode ? rc_mode : RC_MODES;` always returns whatever `rc_mode` points at, including the sentinel. When `rate_control` is empty or unknown (e.g. `vaapi_defaults_internal` bailed early because `vaapi_open_device` failed, leaving `rate_control` = \"\"), `get_rc_mode` returns the sentinel and callers dereference `rc_mode->name`. In `vaapi_update` line 246 this becomes `strcmp(NULL, \"CBR\")`, crashing while creating the encoder.","fix":"Test the sentinel's `name`, not the never-null pointer:\n```c\n-\treturn rc_mode ? rc_mode : RC_MODES;\n+\treturn rc_mode->name ? rc_mode : RC_MODES;\n```","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c:230-235","code":"  230 | \tconst rc_mode_t *rc_mode = RC_MODES;\n  231 | \n  232 | \twhile (!!rc_mode->name && astrcmpi(rc_mode->name, name) != 0)\n  233 | \t\trc_mode++;\n  234 | \n  235 | \treturn rc_mode ? rc_mode : RC_MODES;","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c#L230-L235"},{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c:246","code":"  246 | \tbool cbr = strcmp(rc_mode->name, \"CBR\") == 0;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c#L246"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `make_clut_texture_png` the vertical macro-cell offset for slice `z` is computed with `macro_height` in the divisor instead of `macro_width`. The LUT PNG holds `LUT_WIDTH` (64) slices laid out row-major in a `macro_width` x `macro_height` grid of 64x64 cells, so the cell row must be `z / macro_width`, not `z / macro_height`. For square layouts (e.g. 512x512, `macro_width == macro_height == 8`) it happens to work, but for any accepted non-square layout (the guard only requires both dimensions to be multiples of 64 and `image_width*image_height == 64^3`, e.g. a 4096x64 strip) `z_y` grows far beyond the image height, making `index` read past the end of `data` (out-of-bounds heap read, potential crash) and producing a corrupt LUT.","fix":"```c\nconst int z_x = (z % macro_width) * LUT_WIDTH;\nconst int z_y = (z / macro_width) * LUT_WIDTH;\n```","locations":[{"ref":"plugins/obs-filters/color-grade-filter.c:78-79","code":"   78 | \t\tconst int z_x = (z % macro_width) * LUT_WIDTH;\n   79 | \t\tconst int z_y = (z / macro_height) * LUT_WIDTH;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-filters/color-grade-filter.c#L78-L79"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `mp4_write_tfhd` the loop that decides whether a single `default_sample_duration`/`default_sample_size` can be used overwrites `durations_match`/`sizes_match` on every iteration instead of accumulating them: `durations_match = frag_duration == duration;` and `sizes_match = frag_size == sample_size;`. As written the flags only reflect whether the LAST sample matches sample[0], not whether ALL samples match. If a middle sample differs but the last one happens to equal sample[0], the code wrongly sets `DEFAULT_SAMPLE_DURATION_PRESENT`/`DEFAULT_SAMPLE_SIZE_PRESENT` and writes a single default that does not apply to every sample (and `mp4_write_trun` never emits per-sample durations), corrupting fragment timing/sizes for VFR or mixed-size fragments.","fix":"Accumulate with logical AND and break early:\n```c\nfor (size_t idx = 1; idx < track->fragment_samples.num; idx++) {\n    uint32_t frag_duration = track->fragment_samples.array[idx].duration;\n    uint32_t frag_size = track->fragment_samples.array[idx].size;\n    if (frag_duration != duration) durations_match = false;\n    if (frag_size != sample_size) sizes_match = false;\n}\n```","locations":[{"ref":"plugins/obs-outputs/mp4-mux.c:2263-2269","code":" 2263 | \t\tfor (size_t idx = 1; idx < track->fragment_samples.num; idx++) {\n 2264 | \t\t\tuint32_t frag_duration = track->fragment_samples.array[idx].duration;\n 2265 | \t\t\tuint32_t frag_size = track->fragment_samples.array[idx].size;\n 2266 | \n 2267 | \t\t\tdurations_match = frag_duration == duration;\n 2268 | \t\t\tsizes_match = frag_size == sample_size;\n 2269 | \t\t}","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/mp4-mux.c#L2263-L2269"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`oss_start_reader` calls `pthread_create` (line 281) BEFORE assigning `handle->notify_pipe[0]`/`[1]` (lines 288-289). The reader thread copies `fds[1].fd = handle->notify_pipe[0]` at its very start (line 220). Because of the data race, if the new thread is scheduled before the parent's assignment it reads the stale value `-1` (set in `oss_create`), so `poll` ignores the notify pipe entirely. `oss_stop_reader` then writes to `notify_pipe[1]` to signal exit, but the reader never observes it and `pthread_join` blocks forever, hanging source destruction/update.","fix":"Assign `handle->notify_pipe[0]`/`[1]` before `pthread_create`:\n```c\nhandle->notify_pipe[0] = pfd[0];\nhandle->notify_pipe[1] = pfd[1];\nerr = pthread_create(&thr, NULL, oss_reader_thr, handle);\nif (err) { close(pfd[0]); close(pfd[1]); handle->notify_pipe[0] = handle->notify_pipe[1] = -1; return -1; }\nhandle->reader_thr = thr;\n```","locations":[{"ref":"plugins/oss-audio/oss-input.c:271-291","code":"  271 | static int oss_start_reader(struct oss_input_data *handle)\n  272 | {\n  273 | \tint pfd[2];\n  274 | \tint err;\n  275 | \tpthread_t thr;\n  276 | \n  277 | \terr = pipe(pfd);\n  278 | \tif (err)\n  279 | \t\treturn -1;\n  280 | \n  281 | \terr = pthread_create(&thr, NULL, oss_reader_thr, handle);\n  282 | \tif (err) {\n  283 | \t\tclose(pfd[0]);\n  284 | \t\tclose(pfd[1]);\n  285 | \t\treturn -1;\n  286 | \t}\n  287 | \n  288 | \thandle->notify_pipe[0] = pfd[0];\n  289 | \thandle->notify_pipe[1] = pfd[1];\n  290 | \thandle->reader_thr = thr;\n  291 | \treturn 0;","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/oss-audio/oss-input.c#L271-L291"},{"ref":"plugins/oss-audio/oss-input.c:218-221","code":"  218 | \tfds[0].fd = handle->dsp_fd;\n  219 | \tfds[0].events = POLLIN;\n  220 | \tfds[1].fd = handle->notify_pipe[0];\n  221 | \tfds[1].events = POLLIN;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/oss-audio/oss-input.c#L218-L221"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `game_capture_render`, the cursor is drawn using `default_effect` (`gs_effect_loop(default_effect, cursor_tech_name)`), but the multiplier value is set on the wrong effect handle: `gs_effect_set_float(gs_effect_get_param_by_name(effect, \"multiplier\"), cursor_multiplier)` uses `effect`, which is `OBS_EFFECT_OPAQUE` whenever `allow_transparency` is false (the default). Thus in scRGB/HDR output the `DrawMultiply` technique of `default_effect` never receives `cursor_multiplier`, so the captured cursor is rendered at the wrong brightness. It only coincidentally works when `allow_transparency` is true (then `effect == default_effect`).","fix":"Set the parameter on the effect actually being used:\n```c\n-\t\t\tgs_effect_set_float(gs_effect_get_param_by_name(effect, \"multiplier\"), cursor_multiplier);\n+\t\t\tgs_effect_set_float(gs_effect_get_param_by_name(default_effect, \"multiplier\"), cursor_multiplier);\n```","locations":[{"ref":"plugins/win-capture/game-capture.c:2068-2083","code":" 2068 | \tif (gc->config.cursor && !gc->cursor_hidden) {\n 2069 | \t\tgs_effect_t *const default_effect = obs_get_base_effect(OBS_EFFECT_DEFAULT);\n 2070 | \n 2071 | \t\tconst char *cursor_tech_name = \"Draw\";\n 2072 | \t\tfloat cursor_multiplier = 1.f;\n 2073 | \t\tif (current_space == GS_CS_709_SCRGB) {\n 2074 | \t\t\tcursor_tech_name = \"DrawMultiply\";\n 2075 | \t\t\tcursor_multiplier = obs_get_video_sdr_white_level() / 80.f;\n 2076 | \t\t}\n 2077 | \n 2078 | \t\tconst bool previous = gs_set_linear_srgb(true);\n 2079 | \n 2080 | \t\twhile (gs_effect_loop(default_effect, cursor_tech_name)) {\n 2081 | \t\t\tgs_effect_set_float(gs_effect_get_param_by_name(effect, \"multiplier\"), cursor_multiplier);\n 2082 | \t\t\tgame_capture_render_cursor(gc);\n 2083 | \t\t}","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/game-capture.c#L2068-L2083"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`update_save_metadata()` builds the `meta.json` output path by directly concatenating `info->cache` and `\"meta.json\"` with no path separator (`dstr_copy(&path, info->cache); dstr_cat(&path, \"meta.json\")`), whereas every other place reads that file via `get_package(info->cache, \"meta.json\")`, and `get_package()` uses `get_path()` which inserts a `/` when the base dir does not already end in a separator. `cache_dir` is not guaranteed to end in a slash (the sibling temp-dir code in `update_info_create` explicitly checks for and appends a separator, confirming this). As a result the ETag is written to `<cache>meta.json` but read back from `<cache>/meta.json`, so the `If-None-Match` header is never sent and the remote package (and all files) are re-downloaded on every launch instead of using HTTP 304 caching.","fix":"Use the same path helper as the read side, e.g. replace the manual concatenation with:\n```c\nchar *full_path = get_path(info->cache, \"meta.json\");\nobs_data_save_json(data, full_path);\nbfree(full_path);\n```\nor insert a separator before catting `\"meta.json\"`.","locations":[{"ref":"shared/file-updater/file-updater/file-updater.c:371-388","code":"  371 | static void update_save_metadata(struct update_info *info)\n  372 | {\n  373 | \tstruct dstr path = {0};\n  374 | \n  375 | \tif (!info->etag_remote)\n  376 | \t\treturn;\n  377 | \n  378 | \tdstr_copy(&path, info->cache);\n  379 | \tdstr_cat(&path, \"meta.json\");\n  380 | \n  381 | \tobs_data_t *data;\n  382 | \tdata = obs_data_create();\n  383 | \tobs_data_set_string(data, \"etag\", info->etag_remote);\n  384 | \tobs_data_save_json(data, path.array);\n  385 | \tobs_data_release(data);\n  386 | \n  387 | \tdstr_free(&path);\n  388 | }","lines":18,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/file-updater/file-updater/file-updater.c#L371-L388"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`Row::keyReleaseEvent` emits `clicked()` only for `Qt::Key_Space` and `Qt::Key_Enter`. In Qt, `Qt::Key_Enter` is the numeric-keypad Enter; the main keyboard Return key is `Qt::Key_Return`. As written, pressing the primary Enter/Return key on a focused row does nothing, which breaks keyboard activation/accessibility for the common case.","fix":"Include `Qt::Key_Return`:\n```cpp\nif (event->key() == Qt::Key_Space || event->key() == Qt::Key_Enter || event->key() == Qt::Key_Return) {\n\temit clicked();\n}\n```","locations":[{"ref":"shared/qt/idian/widgets/Row.cpp:201-207","code":"  201 | void Row::keyReleaseEvent(QKeyEvent *event)\n  202 | {\n  203 | \tif (event->key() == Qt::Key_Space || event->key() == Qt::Key_Enter) {\n  204 | \t\temit clicked();\n  205 | \t}\n  206 | \tQFrame::keyReleaseEvent(event);\n  207 | }","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/qt/idian/widgets/Row.cpp#L201-L207"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `check-services.py`, the condition `elif is_ok and server[\"url\"] in fail_timestamps:` (line\n263) redundantly includes `is_ok`. At this point in the code, the `if not is_ok:` branch has\nalready been taken or skipped, so we are in the implicit `else` where `is_ok` is guaranteed to\nbe `True`. The extra `is_ok and` is dead code that misleads readers into thinking `is_ok` could\nbe `False` in the `elif` branch.","fix":"Remove the redundant condition:\n\n```python\nelif server[\"url\"] in fail_timestamps:\n```","locations":[{"ref":".github/scripts/utils.py/check-services.py:263","code":"  263 |             elif is_ok and server[\"url\"] in fail_timestamps:","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/.github/scripts/utils.py/check-services.py#L263"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `AbsoluteSlider::paintEvent`, the tick-drawing loop iterates\n`for (double offset = minimum(); offset <= maximum(); offset += singleStep())`.\nIf `minimum() == maximum()`, the expression `(maximum() - minimum())` on line 154 evaluates to\n0.0, producing a division-by-zero (resulting in NaN/Inf for `tickPercent`), and then\n`std::floor(sliderLength * NaN)` returns an unspecified value that may produce out-of-bounds\npaint coordinates. Additionally, if `singleStep()` is 0, the loop becomes infinite.","fix":"Add guards before the loop:\n\n```cpp\nint range = maximum() - minimum();\nint step = singleStep();\nif (range <= 0 || step <= 0) {\n    QSlider::paintEvent(event);\n    return;\n}\nfor (double offset = minimum(); offset <= maximum(); offset += step) {\n    double tickPercent = (offset - minimum()) / range;\n    ...\n}\n```","locations":[{"ref":"frontend/components/AbsoluteSlider.cpp:153-163","code":"  153 | \tfor (double offset = minimum(); offset <= maximum(); offset += singleStep()) {\n  154 | \t\tdouble tickPercent = (offset - minimum()) / (maximum() - minimum());\n  155 | \t\tconst int tickLineOffset = grooveStart + std::floor(sliderLength * tickPercent) + (handleSize / 2);\n  156 | \n  157 | \t\tconst int xPos = isHorizontal ? tickLineOffset : tickLineStart;\n  158 | \t\tconst int yPos = isHorizontal ? tickLineStart : tickLineOffset;\n  159 | \n  160 | \t\tconst int tickWidth = isHorizontal ? 1 : tickLength;\n  161 | \t\tconst int tickHeight = isHorizontal ? tickLength : 1;\n  162 | \n  163 | \t\tpainter.fillRect(xPos, yPos, tickWidth, tickHeight, tickColor);","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/AbsoluteSlider.cpp#L153-L163"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`OBSAdvAudioCtrl::OBSSourceBalanceChanged` declares the local variable as `int balance` (line 311), which shadows the member `BalanceSlider *balance`. While the calculation is correct (it's only used as an `int` value to pass via `invokeMethod`), the shadowing is a maintenance hazard: any future reader or refactoring that moves the calculation could accidentally modify the wrong `balance`.","fix":"Rename the local variable to avoid shadowing:\n\n```cpp\nint balanceVal = (int)((float)calldata_float(calldata, \"balance\") * 100.0f);\nQMetaObject::invokeMethod(..., Q_ARG(int, balanceVal));\n```","locations":[{"ref":"frontend/components/OBSAdvAudioCtrl.cpp:294","code":"  294 | \tint balance = (float)calldata_float(calldata, \"balance\") * 100.0f;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/OBSAdvAudioCtrl.cpp#L294"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SceneTree::dropEvent` (line 133) and `SceneTree::RepositionGrid` (line 173) access `selectedIndexes()[0]` without verifying that the selection is non-empty. In normal drag-and-drop flow at least one item is selected, but if the selection changes between the drag start and the drop event (e.g. via another thread interaction), the access on an empty list is undefined behaviour.","fix":"Check before indexing:\n\n```cpp\nQModelIndexList sel = selectedIndexes();\nif (sel.isEmpty())\n    return;\nQListWidgetItem *item = takeItem(sel[0].row());\n```","locations":[{"ref":"frontend/components/SceneTree.cpp:133","code":"  133 | \t\tQListWidgetItem *item = takeItem(selectedIndexes()[0].row());","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SceneTree.cpp#L133"},{"ref":"frontend/components/SceneTree.cpp:173","code":"  173 | \t\tint orig = selectedIndexes()[0].row();","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SceneTree.cpp#L173"}]},
{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`UIValidation::NoSourcesConfirmation` dereferences `parent` unconditionally at line 38\n(`parent->isVisible()`) without a null guard. The parameter type is `QWidget *` with no\ncontract annotation requiring a non-null value. All current call sites pass `this`, so there\nis no immediate crash, but the function's API is misleading: it looks like `parent` is optional\n(it is passed to `QMessageBox` where null is accepted), yet a null value would crash at line 38.\nA future caller passing null would get an instant null-pointer dereference.","fix":"Either add a null guard before the visibility check:\n```cpp\nif (!parent || !parent->isVisible())\n    return true;\n```\nOr document the non-null precondition explicitly and add a debug assert:\n```cpp\nQ_ASSERT(parent != nullptr);\nif (!parent->isVisible())\n    return true;\n```","locations":[{"ref":"frontend/components/UIValidation.cpp:30-40","code":"   30 | bool UIValidation::NoSourcesConfirmation(QWidget *parent)\n   31 | {\n   32 | \t// There are sources, don't need confirmation\n   33 | \tif (CountVideoSources() != 0) {\n   34 | \t\treturn true;\n   35 | \t}\n   36 | \n   37 | \t// Ignore no video if no parent is visible to alert on\n   38 | \tif (!parent->isVisible()) {\n   39 | \t\treturn true;\n   40 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/UIValidation.cpp#L30-L40"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`VisibilityItemWidget::SetColor` guards against redundant updates by comparing only `active_`\nand `selected_` to their stored counterparts (line 52). If the actual palette color changes\n(e.g., user switches system theme / dark mode while the selection state stays the same), the\nearly return prevents the label and checkbox palette from being updated with the new color.\nThe comment says \"Do not update unless the state has actually changed\", but the relevant state\nfor the update is the *color*, not just the boolean flags.\n\nOn a theme change, Qt repaints all widgets, which triggers `VisibilityItemDelegate::paint` and\nsubsequently `SetColor` with new palette colors. Because selection flags have not changed, the\nearly return fires and the labels stay with stale colors until the user changes selection.","fix":"Include the color in the staleness check:\n```cpp\nvoid VisibilityItemWidget::SetColor(const QColor &color, bool active_, bool selected_)\n{\n    if (active_ == active && selected_ == selected && color == cachedColor)\n        return;\n\n    QPalette pal = vis->palette();\n    pal.setColor(QPalette::WindowText, color);\n    vis->setPalette(pal);\n    label->setStyleSheet(QString(\"color: %1;\").arg(color.name()));\n\n    active = active_;\n    selected = selected_;\n    cachedColor = color;\n}\n```\nAdd `QColor cachedColor` as a private member in `VisibilityItemWidget.hpp`.","locations":[{"ref":"frontend/components/VisibilityItemWidget.cpp:49-64","code":"   49 | void VisibilityItemWidget::SetColor(const QColor &color, bool active_, bool selected_)\n   50 | {\n   51 | \t/* Do not update unless the state has actually changed */\n   52 | \tif (active_ == active && selected_ == selected) {\n   53 | \t\treturn;\n   54 | \t}\n   55 | \n   56 | \tQPalette pal = vis->palette();\n   57 | \tpal.setColor(QPalette::WindowText, color);\n   58 | \tvis->setPalette(pal);\n   59 | \n   60 | \tlabel->setStyleSheet(QString(\"color: %1;\").arg(color.name()));\n   61 | \n   62 | \tactive = active_;\n   63 | \tselected = selected_;\n   64 | }","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/VisibilityItemWidget.cpp#L49-L64"}]},
{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The member `showVisible` is not initialized in the constructor initializer list (only `showInactive(false)` is set) and is first assigned inside `SetIconsVisible`. `SetShowInactive(true)` reads it via `SetIconsVisible(showVisible)` before any prior call to `SetIconsVisible` may have set it, resulting in an uninitialized-value read that controls whether header/icons are shown.","fix":"Initialize `showVisible` (e.g. `bool showVisible = true;` in the header, or add it to the constructor initializer list).","locations":[{"ref":"frontend/dialogs/OBSBasicAdvAudio.hpp:18","code":"   18 | \tbool showVisible;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicAdvAudio.hpp#L18"},{"ref":"frontend/dialogs/OBSBasicAdvAudio.cpp:10-11","code":"   10 | OBSBasicAdvAudio::OBSBasicAdvAudio(QWidget *parent) : QDialog(parent), ui(new Ui::OBSAdvAudio), showInactive(false)\n   11 | {","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicAdvAudio.cpp#L10-L11"},{"ref":"frontend/dialogs/OBSBasicAdvAudio.cpp:160-166","code":"  160 | \tif (showInactive) {\n  161 | \t\tsigs.emplace_back(sh, \"source_create\", OBSSourceAdded, this);\n  162 | \t\tsigs.emplace_back(sh, \"source_remove\", OBSSourceRemoved, this);\n  163 | \n  164 | \t\tobs_enum_sources(EnumSources, this);\n  165 | \n  166 | \t\tSetIconsVisible(showVisible);","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicAdvAudio.cpp#L160-L166"}]},
{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `create_data_item` the guard against a missing `:` is broken because the subtraction happens before the `npos` comparison: `size_t end_pos = line.find(':') - 1;` then `if (end_pos == string::npos) return;`. When `:` is absent, `line.find(':')` returns `string::npos` (`SIZE_MAX`), so `end_pos` becomes `SIZE_MAX - 1`, which is never equal to `string::npos`; the early return never fires. Execution then continues with `line.substr(start_pos, end_pos - start_pos)` and `line.substr(end_pos + 3)` using a garbage `end_pos`, producing corrupted keys/values instead of safely bailing out. (Ironically a `:` at index 0 does trigger the guard, since `0 - 1 == npos`, but the missing-colon case it was meant to catch does not.)","fix":"Compute and validate the colon position first, then subtract:\n```cpp\nsize_t colon = line.find(':');\nif (colon == string::npos || colon == 0)\n    return;\nsize_t end_pos = colon - 1;\n```","locations":[{"ref":"frontend/importers/classic.cpp:346-348","code":"  346 | \tsize_t end_pos = line.find(':') - 1;\n  347 | \n  348 | \tif (end_pos == string::npos) {","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/importers/classic.cpp#L346-L348"}]},
{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `translate_screen_capture`, the monitor branch assigns `out_settings[\"monitor\"] = subtype_info.substr(pos);` where `pos` is the index of the `:` separator in `capture_source_list` (e.g. `\"monitor:0\"`). `substr(pos)` keeps the leading `:` (yielding `\":0\"`) instead of the value after it. The `window` branch a few lines below correctly uses a separate value field. The monitor id is almost certainly meant to be the text after the colon.","fix":"Skip the delimiter: `out_settings[\"monitor\"] = subtype_info.substr(pos + 1);` (guarding for `pos == string::npos`).","locations":[{"ref":"frontend/importers/sl.cpp:233-235","code":"  233 | \t} else if (subtype == \"monitor\") {\n  234 | \t\ttype = \"monitor_capture\";\n  235 | \t\tout_settings[\"monitor\"] = subtype_info.substr(pos);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/importers/sl.cpp#L233-L235"}]},
{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SLImporter::FindFiles` tests the file extension with `name.find_last_of(\".json\")`, but `find_last_of` matches the last occurrence of ANY character in the set `{'.', 'j', 's', 'o', 'n'}`, not the substring `\".json\"`. Combined with `pos == name.size() - 1` this accepts any filename whose last character is one of those characters (e.g. a file literally named `photos` or `foo.moos` would be treated as a scene collection), and could reject some intended files. The suffix check is semantically wrong.","fix":"Check the actual suffix, e.g.:\n```cpp\nstatic const std::string ext = \".json\";\nif (name.size() >= ext.size() && name.compare(name.size() - ext.size(), ext.size(), ext) == 0) {\n    string str = dst + name;\n    res.push_back(str);\n}\n```","locations":[{"ref":"frontend/importers/sl.cpp:515-517","code":"  515 | \t\tsize_t pos = name.find_last_of(\".json\");\n  516 | \t\tsize_t end_pos = name.size() - 1;\n  517 | \t\tif (pos != string::npos && pos == end_pos) {","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/importers/sl.cpp#L515-L517"}]},
{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`hex_string_to_int` only decodes digits `0-9` and uppercase `A-F`; any other character (including lowercase `a-f`) falls into the `else` branch computing `str[0] - 'A' + 10`, which yields wrong values for lowercase hex (e.g. `'a'` -> `42`). XSplit color strings that use lowercase hex would import with corrupted colors. There is also no validation of non-hex input.","fix":"Handle lowercase (and reject invalid) digits, e.g.\n```cpp\nchar c = str[0];\nif (c >= '0' && c <= '9') res += c - '0';\nelse if (c >= 'A' && c <= 'F') res += c - 'A' + 10;\nelse if (c >= 'a' && c <= 'f') res += c - 'a' + 10;\n```","locations":[{"ref":"frontend/importers/xsplit.cpp:26-47","code":"   26 | static int hex_string_to_int(string str)\n   27 | {\n   28 | \tint res = 0;\n   29 | \n   30 | \tif (str[0] == '#') {\n   31 | \t\tstr = str.substr(1);\n   32 | \t}\n   33 | \n   34 | \tfor (size_t i = 0, l = str.size(); i < l; i++) {\n   35 | \t\tres *= 16;\n   36 | \n   37 | \t\tif (str[0] >= '0' && str[0] <= '9') {\n   38 | \t\t\tres += str[0] - '0';\n   39 | \t\t} else {\n   40 | \t\t\tres += str[0] - 'A' + 10;\n   41 | \t\t}\n   42 | \n   43 | \t\tstr = str.substr(1);\n   44 | \t}\n   45 | \n   46 | \treturn res;\n   47 | }","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/importers/xsplit.cpp#L26-L47"}]},
{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`PopulateSimpleBitrates` and `PopulateAdvancedBitrates` add their items with only display text (`box->addItem(QString::number(...))`) and never set any `Qt::UserRole` data, yet they later test `box->findData(currentBitrate)` to decide whether the previously-selected bitrate is still present. `findData` searches `Qt::UserRole` data, which is never set, so it always returns `-1`; the `else` branch that would restore the exact current text (`box->setCurrentText(currentBitrate)`) is dead code and the closest-bitrate path is always taken. It happens to produce the same value because `FindClosestAvailableAudioBitrate` returns `bitrate` unchanged when present, but the intent (`findText`) is not what is written.","fix":"Use `findText` instead of `findData`, e.g. change `if (box->findData(currentBitrate) == -1) {` to `if (box->findText(currentBitrate) == -1) {` in both functions.","locations":[{"ref":"frontend/settings/OBSBasicSettings.cpp:239-244","code":"  239 | \tif (box->findData(currentBitrate) == -1) {\n  240 | \t\tint bitrate = FindClosestAvailableAudioBitrate(box, currentBitrate.toInt());\n  241 | \t\tbox->setCurrentText(QString::number(bitrate));\n  242 | \t} else {\n  243 | \t\tbox->setCurrentText(currentBitrate);\n  244 | \t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/settings/OBSBasicSettings.cpp#L239-L244"},{"ref":"frontend/settings/OBSBasicSettings.cpp:272-277","code":"  272 | \t\tif (box->findData(currentBitrate) == -1) {\n  273 | \t\t\tint bitrate = FindClosestAvailableAudioBitrate(box, currentBitrate.toInt());\n  274 | \t\t\tbox->setCurrentText(QString::number(bitrate));\n  275 | \t\t} else {\n  276 | \t\t\tbox->setCurrentText(currentBitrate);\n  277 | \t\t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/settings/OBSBasicSettings.cpp#L272-L277"}]},
{"id":"LOGIC_102","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `on_advOutFFFormat_currentIndexChanged`, the `else` branch (taken when the selected item has no `FFmpegFormat` data, i.e. the `AVFormatDefault` entry at index 0) calls `ui->advOutFFAEncoder->blockSignals(true)` and `ui->advOutFFVEncoder->blockSignals(true)` but never re-enables signals with `blockSignals(false)`. The non-default branch avoids this because it delegates to `ReloadCodecs`, which balances its own `blockSignals(true)`/`blockSignals(false)`. As a result, after the user selects the default FFmpeg format the two encoder combo boxes have their signals left permanently blocked until a subsequent real format selection runs `ReloadCodecs` again, suppressing `on_advOutFFAEncoder_currentIndexChanged` / `on_advOutFFVEncoder_currentIndexChanged` in the meantime.","fix":"Unblock the signals at the end of the else branch:\n```cpp\n} else {\n    ui->advOutFFAEncoder->blockSignals(true);\n    ui->advOutFFVEncoder->blockSignals(true);\n    ui->advOutFFAEncoder->clear();\n    ui->advOutFFVEncoder->clear();\n    ui->advOutFFAEncoder->blockSignals(false);\n    ui->advOutFFVEncoder->blockSignals(false);\n    ui->advOutFFFormatDesc->setText(DEFAULT_CONTAINER_STR);\n}\n```","locations":[{"ref":"frontend/settings/OBSBasicSettings.cpp:4140-4147","code":" 4140 | \t} else {\n 4141 | \t\tui->advOutFFAEncoder->blockSignals(true);\n 4142 | \t\tui->advOutFFVEncoder->blockSignals(true);\n 4143 | \t\tui->advOutFFAEncoder->clear();\n 4144 | \t\tui->advOutFFVEncoder->clear();\n 4145 | \n 4146 | \t\tui->advOutFFFormatDesc->setText(DEFAULT_CONTAINER_STR);\n 4147 | \t}","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/settings/OBSBasicSettings.cpp#L4140-L4147"}]},
