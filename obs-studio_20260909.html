<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `TaskbarOverlaySetStatus`, when `CoCreateInstance` fails, the code calls `taskbarIcon->Release()` on the just-passed-out pointer. `IID_PPV_ARGS(&taskbarIcon)` sets `taskbarIcon` to `nullptr` on failure (and it is otherwise uninitialized), so `taskbarIcon->Release()` dereferences a null/invalid COM pointer and crashes. Additionally, the branch that returns early when `qt_pixmapToWinHICON` yields a null `hicon` (lines 426-428) returns without calling `taskbarIcon->Release()`, leaking the COM object.","fix":"On `FAILED(hr)` from `CoCreateInstance`, just `return;` without calling `Release()`. Before the `if (!hicon) return;` early-return, call `taskbarIcon->Release();` (or wrap `taskbarIcon` in a `ComPtr`/RAII to release on all paths).","locations":[{"ref":"frontend/utility/platform-windows.cpp:394-406","code":"  394 | \tauto hr = CoCreateInstance(CLSID_TaskbarList, NULL, CLSCTX_INPROC_SERVER, IID_PPV_ARGS(&taskbarIcon));\n  395 | \n  396 | \tif (FAILED(hr)) {\n  397 | \t\ttaskbarIcon->Release();\n  398 | \t\treturn;\n  399 | \t}\n  400 | \n  401 | \thr = taskbarIcon->HrInit();\n  402 | \n  403 | \tif (FAILED(hr)) {\n  404 | \t\ttaskbarIcon->Release();\n  405 | \t\treturn;\n  406 | \t}","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/platform-windows.cpp#L394-L406"},{"ref":"frontend/utility/platform-windows.cpp:422-429","code":"  422 | \tHICON hicon = nullptr;\n  423 | \tif (!qicon.isNull()) {\n  424 | \t\tQ_GUI_EXPORT HICON qt_pixmapToWinHICON(const QPixmap &p);\n  425 | \t\thicon = qt_pixmapToWinHICON(qicon.pixmap(GetSystemMetrics(SM_CXSMICON)));\n  426 | \t\tif (!hicon) {\n  427 | \t\t\treturn;\n  428 | \t\t}\n  429 | \t}","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/platform-windows.cpp#L422-L429"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`get_processor_info` returns early (without writing `*name` or `*speed`) when `RegOpenKeyW` fails. Its caller in `system_info` declares `DWORD processorSpeed; char *processorName;` uninitialized, then reads `if (processorSpeed)`, `if (processorName)` and calls `bfree(processorName)`. If the registry key cannot be opened, both locals are garbage: `processorName` may be a non-null junk pointer used as a C-string for `cpu_data.name` and then passed to `bfree`, causing a crash. This is undefined behavior on the registry-failure path.","fix":"Initialize the caller's locals (`DWORD processorSpeed = 0; char *processorName = nullptr;`) and/or have `get_processor_info` unconditionally set `*name = nullptr; *speed = 0;` at entry before the early return.","locations":[{"ref":"frontend/utility/system-info-windows.cpp:83-86","code":"   83 | \tstatus = RegOpenKeyW(HKEY_LOCAL_MACHINE, L\"HARDWARE\\\\DESCRIPTION\\\\System\\\\CentralProcessor\\\\0\", &key);\n   84 | \tif (status != ERROR_SUCCESS) {\n   85 | \t\treturn;\n   86 | \t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/system-info-windows.cpp#L83-L86"},{"ref":"frontend/utility/system-info-windows.cpp:223-232","code":"  223 | \t\tDWORD processorSpeed;\n  224 | \t\tchar *processorName;\n  225 | \t\tget_processor_info(&processorName, &processorSpeed);\n  226 | \t\tif (processorSpeed) {\n  227 | \t\t\tcpu_data.speed = processorSpeed;\n  228 | \t\t}\n  229 | \t\tif (processorName) {\n  230 | \t\t\tcpu_data.name = processorName;\n  231 | \t\t}\n  232 | \t\tbfree(processorName);","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/system-info-windows.cpp#L223-L232"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`get_egl_display` calls `strstr(egl_client_extensions, \"EGL_EXT_platform_base\")` without checking whether `egl_client_extensions` is `NULL`. `eglQueryString(EGL_NO_DISPLAY, EGL_EXTENSIONS)` is only guaranteed to return a valid string when the `EGL_EXT_client_extensions` extension is supported; on implementations that do not support querying client extensions it returns `NULL`, and `strstr(NULL, ...)` dereferences a null pointer, crashing GL initialization.","fix":"Guard the `strstr` with a null check, e.g. `(egl_client_extensions && strstr(egl_client_extensions, \"EGL_EXT_platform_base\")) ? eglGetProcAddress(\"eglGetPlatformDisplayEXT\") : NULL`.","locations":[{"ref":"libobs-opengl/gl-x11-egl.c:146-153","code":"  146 | \tconst char *egl_client_extensions = NULL;\n  147 | \n  148 | \tegl_client_extensions = eglQueryString(EGL_NO_DISPLAY, EGL_EXTENSIONS);\n  149 | \n  150 | \tPFNEGLGETPLATFORMDISPLAYEXTPROC eglGetPlatformDisplayEXT =\n  151 | \t\t(PFNEGLGETPLATFORMDISPLAYEXTPROC)(strstr(egl_client_extensions, \"EGL_EXT_platform_base\")\n  152 | \t\t\t\t\t\t\t  ? eglGetProcAddress(\"eglGetPlatformDisplayEXT\")\n  153 | \t\t\t\t\t\t\t  : NULL);","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-x11-egl.c#L146-L153"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`obs_encoder_has_roi`, `obs_encoder_clear_roi`, `obs_encoder_get_roi_increment`, and\n`obs_encoder_add_roi` all access `encoder` fields without first checking that `encoder` is\nnon-NULL. Every other encoder accessor in the file performs a null guard (either via\n`obs_encoder_valid` or an explicit `!encoder` check). A NULL pointer call from a plugin or\nafter encoder destruction causes an immediate crash. `obs_encoder_enum_roi` has the same flaw.","fix":"Add `if (!encoder) return false/0;` (or the appropriate zero/false value) as the first statement of each of these five functions, consistent with the rest of the encoder API.","locations":[{"ref":"libobs/obs-encoder.c:2093-2096","code":" 2093 | bool obs_encoder_has_roi(const obs_encoder_t *encoder)\n 2094 | {\n 2095 | \treturn encoder->roi.num > 0;\n 2096 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L2093-L2096"},{"ref":"libobs/obs-encoder.c:2098-2101","code":" 2098 | bool obs_encoder_add_roi(obs_encoder_t *encoder, const struct obs_encoder_roi *roi)\n 2099 | {\n 2100 | \tif (!roi)\n 2101 | \t\treturn false;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L2098-L2101"},{"ref":"libobs/obs-encoder.c:2119-2121","code":" 2119 | void obs_encoder_clear_roi(obs_encoder_t *encoder)\n 2120 | {\n 2121 | \tif (!encoder->roi.num)","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L2119-L2121"},{"ref":"libobs/obs-encoder.c:2129-2135","code":" 2129 | void obs_encoder_enum_roi(obs_encoder_t *encoder, void (*enum_proc)(void *, struct obs_encoder_roi *), void *param)\n 2130 | {\n 2131 | \tfloat scale_x = 0;\n 2132 | \tfloat scale_y = 0;\n 2133 | \n 2134 | \t/* Scale ROI passed to callback to output size */\n 2135 | \tif (encoder->scaled_height && encoder->scaled_width) {","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L2129-L2135"},{"ref":"libobs/obs-encoder.c:2170-2173","code":" 2170 | uint32_t obs_encoder_get_roi_increment(const obs_encoder_t *encoder)\n 2171 | {\n 2172 | \treturn encoder->roi_increment;\n 2173 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L2170-L2173"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`obs_encoder_video_tex_active` calls `get_mix_for_video(encoder->media)` and then\nunconditionally dereferences the returned pointer (`mix->using_nv12_tex` /\n`mix->using_p010_tex`). `get_mix_for_video` can return NULL when the video output does not\ncorrespond to any registered mix (e.g. after a video reset or during encoder teardown). This\ncauses a null-pointer dereference crash in any GPU encoder plugin (nvenc, AMF, etc.) that\ncalls this API.","fix":"Add a null check on `mix` before dereferencing it:\n```c\nbool obs_encoder_video_tex_active(const obs_encoder_t *encoder, enum video_format format)\n{\n\tstruct obs_core_video_mix *mix = get_mix_for_video(encoder->media);\n\tif (!mix)\n\t\treturn false;\n\n\tif (format == VIDEO_FORMAT_NV12)\n\t\treturn mix->using_nv12_tex;\n\tif (format == VIDEO_FORMAT_P010)\n\t\treturn mix->using_p010_tex;\n\n\treturn false;\n}\n```","locations":[{"ref":"libobs/obs-encoder.c:2267-2277","code":" 2267 | bool obs_encoder_video_tex_active(const obs_encoder_t *encoder, enum video_format format)\n 2268 | {\n 2269 | \tstruct obs_core_video_mix *mix = get_mix_for_video(encoder->media);\n 2270 | \n 2271 | \tif (format == VIDEO_FORMAT_NV12)\n 2272 | \t\treturn mix->using_nv12_tex;\n 2273 | \tif (format == VIDEO_FORMAT_P010)\n 2274 | \t\treturn mix->using_p010_tex;\n 2275 | \n 2276 | \treturn false;\n 2277 | }","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L2267-L2277"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `DeckLinkDevice::Init`, `attributes` is obtained via `QueryInterface(IID_IDeckLinkProfileAttributes, ...)` and only its result is stored in `result`. It is guarded by `if (result == S_OK)` only for the auto-mode block, but is then dereferenced unconditionally at `attributes->GetInt(...)` / `attributes->GetFlag(...)` (lines 69-108). If the query failed, `attributes` is null and these calls crash. The code clearly intended to handle failure (there is an `if (result != S_OK) return true;` at line 127) but that guard runs far too late, after the null dereference.","fix":"Bail out (or skip the attribute-dependent block) immediately when `result != S_OK`, before any `attributes->...` call, e.g. move the `if (result != S_OK)` early-return up to right after the `QueryInterface`, or wrap lines 69-108 in `if (result == S_OK) { ... }`.","locations":[{"ref":"plugins/decklink/decklink-device.cpp:36-108","code":"   36 | \tComPtr<IDeckLinkProfileAttributes> attributes;\n   37 | \tconst HRESULT result = device->QueryInterface(IID_IDeckLinkProfileAttributes, (void **)&attributes);\n   38 | \tif (result == S_OK) {\n   39 | \t\tdecklink_bool_t detectable = false;\n   40 | \t\tif (attributes->GetFlag(BMDDeckLinkSupportsInputFormatDetection, &detectable) == S_OK && !!detectable) {\n   41 | \t\t\tDeckLinkDeviceMode *mode = new DeckLinkDeviceMode(\"Auto\", MODE_ID_AUTO);\n   42 | \t\t\tinputModes.push_back(mode);\n   43 | \t\t\tinputModeIdMap[MODE_ID_AUTO] = mode;\n   44 | \t\t}\n   45 | \t}\n   46 | \n   47 | \t// Find input modes\n   48 | \tComPtr<IDeckLinkInput> input;\n   49 | \tif (device->QueryInterface(IID_IDeckLinkInput, (void **)&input) == S_OK) {\n   50 | \t\tComPtr<IDeckLinkDisplayModeIterator> modeIterator;\n   51 | \t\tif (input->GetDisplayModeIterator(&modeIterator) == S_OK) {\n   52 | \t\t\tComPtr<IDeckLinkDisplayMode> displayMode;\n   53 | \t\t\tlong long modeId = pportsInternalKeyer);\n  101 | \n  102 | \tattributes->GetFlag(BMDDeckLinkSupportsHDRMetadata, &supportsHDRMetadata);\n  103 | \n  104 | \t// Sub Device Counts\n  105 | \tattributes->GetInt(BMDDeckLinkSubDeviceIndex, &subDeviceIndex);\n  106 | \tattributes->GetInt(BMDDeckLinkNumberOfSubDevices, &numSubDevices);\n  107 | \n  108 | \tif (FAILED(attributes->GetInt(BMDDeckLinkMinimumPrerollFrames, &minimumPrerollFrames))) {","lines":73,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/decklink/decklink-device.cpp#L36-L108"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`device->FindOutputMode(modeID)` returns `outputModeIdMap[id]` (a `std::map::operator[]`) which yields `nullptr` for an unknown id. In both `decklink_output_create` and `decklink_output_start` the returned `mode` is dereferenced without a null check: `mode->GetWidth()`/`GetHeight()` at create, and `mode->IsEqualFrameRate(...)` / `mode->GetWidth()` at start. A saved/stale `MODE_ID` (e.g. after the device's mode list changes) produces a null `mode` and crashes. (`operator[]` also silently inserts a null entry into the map.)","fix":"Check `if (!mode) { return nullptr; }` (create) and `if (!mode) { LOG(...); return false; }` (start) after each `FindOutputMode` call before dereferencing; consider using `map::find` in `FindOutputMode`/`FindInputMode` to avoid inserting null entries.","locations":[{"ref":"plugins/decklink/decklink-output.cpp:31-42","code":"   31 | \tif (device) {\n   32 | \t\tDeckLinkDeviceMode *mode = device->FindOutputMode(decklinkOutput->modeID);\n   33 | \n   34 | \t\tstruct video_scale_info to = {};\n   35 | \t\tto.format = VIDEO_FORMAT_BGRA;\n   36 | \t\tto.width = mode->GetWidth();\n   37 | \t\tto.height = mode->GetHeight();\n   38 | \t\tto.range = VIDEO_RANGE_FULL;\n   39 | \t\tto.colorspace = (device->GetSupportsHDRMetadata() && !decklinkOutput->force_sdr) ? VIDEO_CS_2100_PQ\n   40 | \t\t\t\t\t\t\t\t\t\t\t\t : VIDEO_CS_709;\n   41 | \n   42 | \t\tobs_output_set_video_conversion(output, &to);","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/decklink/decklink-output.cpp#L31-L42"},{"ref":"plugins/decklink/decklink-output.cpp:86-99","code":"   86 | \tDeckLinkDeviceMode *mode = device->FindOutputMode(decklink->modeID);\n   87 | \n   88 | \tstruct obs_video_info ovi;\n   89 | \tif (!obs_get_video_info(&ovi)) {\n   90 | \t\tLOG(LOG_ERROR, \"Start failed: could not retrieve obs_video_info!\");\n   91 | \t\treturn false;\n   92 | \t}\n   93 | \n   94 | \tif (!mode->IsEqualFrameRate(ovi.fps_num, ovi.fps_den)) {\n   95 | \t\tLOG(LOG_ERROR, \"Start failed: FPS mismatch!\");\n   96 | \t\treturn false;\n   97 | \t}\n   98 | \n   99 | \tdecklink->SetSize(mode->GetWidth(), mode->GetHeight());","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/decklink/decklink-output.cpp#L86-L99"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In the camera portal's `on_pipewire_remote_opened_cb`, `obs_pipewire_connect_fd` can return `NULL` (thread-loop start failure or `pw_context_connect_fd` failure), yet the code immediately calls `obs_pipewire_roundtrip(connection->obs_pw)`, which dereferences `obs_pw->thread_loop` with no NULL check. The screencast equivalent guards this with `if (!capture->obs_pw) return;`, but the camera path does not, so a failed connect crashes.","fix":"Guard the roundtrip:\n```c\nconnection->obs_pw = obs_pipewire_connect_fd(pipewire_fd, &registry_events, connection);\nif (!connection->obs_pw)\n\treturn;\nobs_pipewire_roundtrip(connection->obs_pw);\n```","locations":[{"ref":"plugins/linux-pipewire/camera-portal.c:1075-1077","code":" 1075 | \tconnection->obs_pw = obs_pipewire_connect_fd(pipewire_fd, &registry_events, connection);\n 1076 | \n 1077 | \tobs_pipewire_roundtrip(connection->obs_pw);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-pipewire/camera-portal.c#L1075-L1077"},{"ref":"plugins/linux-pipewire/pipewire.c:1168-1176","code":" 1168 | void obs_pipewire_roundtrip(obs_pipewire *obs_pw)\n 1169 | {\n 1170 | \tpw_thread_loop_lock(obs_pw->thread_loop);\n 1171 | \n 1172 | \tobs_pw->sync_id = pw_core_sync(obs_pw->core, PW_ID_CORE, obs_pw->sync_id);\n 1173 | \tpw_thread_loop_wait(obs_pw->thread_loop);\n 1174 | \n 1175 | \tpw_thread_loop_unlock(obs_pw->thread_loop);\n 1176 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-pipewire/pipewire.c#L1168-L1176"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `ffmpeg_mpegts_data_init`, `avformat_alloc_output_context2` can fail and leave `data->output` set to `NULL`. The two `av_dict_set(&data->output->metadata, ...)` calls dereference `data->output` **before** the `if (!data->output)` null check that follows them. On allocation failure this dereferences a `NULL` pointer and crashes. The null check is effectively dead because it runs only after the pointer has already been used.","fix":"Move the null check before the `av_dict_set` calls:\n```c\navformat_alloc_output_context2(&data->output, output_format, NULL, data->config.url);\nif (!data->output) {\n\tffmpeg_mpegts_log_error(LOG_WARNING, data, \"Couldn't create avformat context\");\n\tgoto fail;\n}\nav_dict_set(&data->output->metadata, \"service_provider\", \"obs-studio\", 0);\nav_dict_set(&data->output->metadata, \"service_name\", \"mpegts output\", 0);\n```","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-mpegts.c:632-639","code":"  632 | \tavformat_alloc_output_context2(&data->output, output_format, NULL, data->config.url);\n  633 | \tav_dict_set(&data->output->metadata, \"service_provider\", \"obs-studio\", 0);\n  634 | \tav_dict_set(&data->output->metadata, \"service_name\", \"mpegts output\", 0);\n  635 | \n  636 | \tif (!data->output) {\n  637 | \t\tffmpeg_mpegts_log_error(LOG_WARNING, data, \"Couldn't create avformat context\");\n  638 | \t\tgoto fail;\n  639 | \t}","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-mpegts.c#L632-L639"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Redundant and unsafe `av_frame_unref()` immediately before `av_frame_free()`. `av_frame_free(&x)` already calls `av_frame_unref(*x)` internally (after guarding against `NULL`), so the explicit `av_frame_unref` is dead work. Worse, `av_frame_unref` itself does not guard against a `NULL` argument, so on error paths where the frame was never allocated it dereferences `NULL`. In `vaapi_destroy` this is reachable: if `vaapi_init_codec` fails before `av_frame_alloc` (e.g. `av_hwdevice_ctx_create`/`av_hwframe_ctx_init` fails), `enc->vframe` is still `NULL`, then `vaapi_create_internal` calls `vaapi_destroy` -> `av_frame_unref(NULL)`. In `ffmpeg_video_encoder_free` it is reachable when `avcodec_open2` fails (bad settings) leaving `enc->vframe == NULL`.","fix":"Drop the explicit `av_frame_unref(...)` line and rely on `av_frame_free(&...)`, which unrefs and NULL-checks. For example in `ffmpeg_video_encoder_free`:\n```c\n-\tav_frame_unref(enc->vframe);\n\tav_frame_free(&enc->vframe);\n```\nApply the same removal in `vaapi_destroy` and `close_video`.","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c:490-491","code":"  490 | \tav_frame_unref(enc->vframe);\n  491 | \tav_frame_free(&enc->vframe);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c#L490-L491"},{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-video-encoders.c:138-139","code":"  138 | \tav_frame_unref(enc->vframe);\n  139 | \tav_frame_free(&enc->vframe);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-video-encoders.c#L138-L139"},{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-output.c:443-450","code":"  443 | \tav_frame_unref(data->vframe);\n  444 | \n  445 | \t// This format for some reason derefs video frame\n  446 | \t// too many times\n  447 | \tif (data->vcodec->id == AV_CODEC_ID_A64_MULTI || data->vcodec->id == AV_CODEC_ID_A64_MULTI5)\n  448 | \t\treturn;\n  449 | \n  450 | \tav_frame_free(&data->vframe);","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-output.c#L443-L450"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"The Linux `loadEffect()` calls `plugin = mainEntryPoint(hostCallback_static);` and immediately dereferences it with `plugin->user = this;` without checking for `nullptr`. A malformed or incompatible `.so` whose entry point returns null causes a null-pointer dereference crash. The macOS (`VSTPlugin-osx.mm`) and Windows (`VSTPlugin-win.cpp`) implementations both null-check the return value before assigning `->user`; the Linux path omits this check.","fix":"Guard the return value before use:\n```cpp\nplugin = mainEntryPoint(hostCallback_static);\nif (plugin == nullptr) {\n    blog(LOG_WARNING, \"Couldn't create instance for '%s'\", pluginPath.c_str());\n    return nullptr;\n}\nplugin->user = this;\n```","locations":[{"ref":"plugins/obs-vst/linux/VSTPlugin-linux.cpp:52-55","code":"   52 | \t// Instantiate the plug-in\n   53 | \tplugin = mainEntryPoint(hostCallback_static);\n   54 | \tplugin->user = this;\n   55 | \treturn plugin;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-vst/linux/VSTPlugin-linux.cpp#L52-L55"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `DShowInput::OnAudioData`, `block_size` is computed as `get_audio_bytes_per_channel(audio.format) * get_audio_channels(audio.speakers)` and then used immediately in `audio.frames = (uint32_t)(size / block_size)`. When the DirectShow device delivers PCM audio in a format that `ConvertAudioFormat` does not recognize (anything other than `Wave16bit`/`WaveFloat`, e.g. `AudioFormat::Unknown`), `audio.format` becomes `AUDIO_FORMAT_UNKNOWN`, for which `get_audio_bytes_per_channel` returns `0`, making `block_size == 0` and causing an integer division-by-zero (SIGFPE / crash). The guarding `if (audio.format != AUDIO_FORMAT_UNKNOWN)` check happens only afterwards at line 679, too late to prevent the crash.","fix":"Bail out (or skip the division) when the format is unusable, before computing `audio.frames`:\n```cpp\naudio.format = ConvertAudioFormat(config.format);\nif (audio.format == AUDIO_FORMAT_UNKNOWN)\n    return;\nblock_size = get_audio_bytes_per_channel(audio.format) * get_audio_channels(audio.speakers);\nif (block_size == 0)\n    return;\naudio.frames = (uint32_t)(size / block_size);\n```","locations":[{"ref":"plugins/win-dshow/win-dshow.cpp:669-677","code":"  669 | \taudio.speakers = convert_speaker_layout((uint8_t)config.channels);\n  670 | \taudio.format = ConvertAudioFormat(config.format);\n  671 | \taudio.samples_per_sec = (uint32_t)config.sampleRate;\n  672 | \taudio.data[0] = data;\n  673 | \n  674 | \tblock_size = get_audio_bytes_per_channel(audio.format) * get_audio_channels(audio.speakers);\n  675 | \n  676 | \taudio.frames = (uint32_t)(size / block_size);\n  677 | \taudio.timestamp = (uint64_t)startTime * 100;","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-dshow/win-dshow.cpp#L669-L677"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `load_python_script`, the `script_description` handler is called with `PyObject_CallObject(func, NULL)` and the result `py_ret` is passed directly to `PyUnicode_AsUTF8String(py_ret)` without a NULL check. If the user's `script_description()` raises an exception, `PyObject_CallObject` returns `NULL`, `py_error()` prints/clears it but its return value is ignored, and `PyUnicode_AsUTF8String(NULL)` dereferences the NULL object (via the internal `PyUnicode_Check`), crashing the whole application. This is reachable from any buggy user Python script.","fix":"Guard the result before converting:\n```c\nfunc = PyObject_GetAttrString(py_module, \"script_description\");\nif (func) {\n\tPyObject *py_ret = PyObject_CallObject(func, NULL);\n\tif (!py_error() && py_ret) {\n\t\tPyObject *py_desc = PyUnicode_AsUTF8String(py_ret);\n\t\tif (py_desc) {\n\t\t\tconst char *desc = PyBytes_AS_STRING(py_desc);\n\t\t\tif (desc)\n\t\t\t\tdstr_copy(&data->base.desc, desc);\n\t\t\tPy_DECREF(py_desc);\n\t\t}\n\t}\n\tPy_XDECREF(py_ret);\n\tPy_DECREF(func);\n} else {\n\tPyErr_Clear();\n}\n```","locations":[{"ref":"shared/obs-scripting/obs-scripting-python.c:233-248","code":"  233 | \tfunc = PyObject_GetAttrString(py_module, \"script_description\");\n  234 | \tif (func) {\n  235 | \t\tPyObject *py_ret = PyObject_CallObject(func, NULL);\n  236 | \t\tpy_error();\n  237 | \t\tPyObject *py_desc = PyUnicode_AsUTF8String(py_ret);\n  238 | \t\tif (py_desc) {\n  239 | \t\t\tconst char *desc = PyBytes_AS_STRING(py_desc);\n  240 | \t\t\tif (desc)\n  241 | \t\t\t\tdstr_copy(&data->base.desc, desc);\n  242 | \t\t\tPy_DECREF(py_desc);\n  243 | \t\t}\n  244 | \t\tPy_XDECREF(py_ret);\n  245 | \t\tPy_DECREF(func);\n  246 | \t} else {\n  247 | \t\tPyErr_Clear();\n  248 | \t}","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/obs-scripting/obs-scripting-python.c#L233-L248"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`header_write` calls `str.back()` without first checking that `str` is non-empty. If curl invokes the header callback with `total == 0`, `str` is empty and `str.back()` is undefined behavior. Even when non-empty, a header body consisting solely of `\"\\n\"` is reduced to an empty string by the first `resize`, after which the subsequent `str.back()` for the `'\\r'` check reads from an empty string. In practice HTTP header lines terminate with `\"\\r\\n\"` so this is rarely hit, but it is a latent out-of-bounds read.","fix":"Guard the accesses, e.g. `if (str.empty()) { list.push_back(std::move(str)); return total; }` before the trimming, and re-check emptiness between the `'\\n'` and `'\\r'` removals: `if (!str.empty() && str.back() == '\\n') str.pop_back(); if (!str.empty() && str.back() == '\\r') str.pop_back();`.","locations":[{"ref":"frontend/utility/RemoteTextThread.cpp:104-122","code":"  104 | static size_t header_write(char *ptr, size_t size, size_t nmemb, vector<string> &list)\n  105 | {\n  106 | \tstring str;\n  107 | \n  108 | \tsize_t total = size * nmemb;\n  109 | \tif (total) {\n  110 | \t\tstr.append(ptr, total);\n  111 | \t}\n  112 | \n  113 | \tif (str.back() == '\\n') {\n  114 | \t\tstr.resize(str.size() - 1);\n  115 | \t}\n  116 | \tif (str.back() == '\\r') {\n  117 | \t\tstr.resize(str.size() - 1);\n  118 | \t}\n  119 | \n  120 | \tlist.push_back(std::move(str));\n  121 | \treturn total;\n  122 | }","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/RemoteTextThread.cpp#L104-L122"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`GetDefaultVideoSavePath` (X11) does `return string(getenv(\"HOME\"));` unconditionally. If `HOME` is unset, `getenv` returns `nullptr` and constructing `std::string` from a null pointer is undefined behavior (crash). The macOS variant has the same problem in its fallback path (`return getenv(\"HOME\");`).","fix":"Guard against null, e.g. `const char *home = getenv(\"HOME\"); return home ? std::string(home) : std::string();`.","locations":[{"ref":"frontend/utility/platform-x11.cpp:227-230","code":"  227 | string GetDefaultVideoSavePath()\n  228 | {\n  229 | \treturn string(getenv(\"HOME\"));\n  230 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/platform-x11.cpp#L227-L230"},{"ref":"frontend/utility/platform-osx.mm:60-63","code":"   60 |     if (!url)\n   61 |         return getenv(\"HOME\");\n   62 | \n   63 |     return url.path.fileSystemRepresentation;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/platform-osx.mm#L60-L63"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`device_set_cube_render_target` dereferences `tex->type` without a null check. If there is no active swap chain (`device->curSwapChain == nullptr`) the block that substitutes the swap-chain target is skipped, and a null `tex` argument reaches `tex->type` and crashes. The analogous `device_set_render_target_internal` guards this with `if (tex && tex->type != ...)`.","fix":"Guard the type check with a null test: `if (tex && tex->type != GS_TEXTURE_CUBE) { ... }`, matching `device_set_render_target_internal`.","locations":[{"ref":"libobs-d3d11/d3d11-subsystem.cpp:2097","code":" 2097 | \tif (tex->type != GS_TEXTURE_CUBE) {","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-d3d11/d3d11-subsystem.cpp#L2097"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `OBSShader.buildMetadata`, the `descriptorMapper` for a `TEXCOORD` mapping does `type[type.index(type.startIndex, offsetBy: 5)].wholeNumberValue`. For a scalar texcoord whose type string is exactly `\"float\"` (5 characters), `offsetBy: 5` yields `endIndex` and subscripting it is a fatal runtime trap (out-of-bounds). It only works for `\"floatN\"` (6+ chars). Additionally the `case 0: .float` branch is unreachable, because reaching a `numCoordinates` of `0` would require a non-digit character (whose `wholeNumberValue` is `nil`, taking the guard's `else`) - dead code that also documents the unhandled scalar case.","fix":"Guard the string length / index validity before subscripting (e.g. check `type.count > 5`), and handle a scalar `\"float\"` texcoord explicitly instead of relying on the unreachable `case 0`.","locations":[{"ref":"libobs-metal/OBSShader.swift:273-293","code":"  273 |             case _ where mapping.hasPrefix(\"TEXCOORD\"):\n  274 |                 guard let numCoordinates = type[type.index(type.startIndex, offsetBy: 5)].wholeNumberValue else {\n  275 |                     assertionFailure(\"Unsupported type \\(type) for texture parameter\")\n  276 |                     return nil\n  277 |                 }\n  278 | \n  279 |                 let format: MTLVertexFormat =\n  280 |                     switch numCoordinates {\n  281 |                     case 0: .float\n  282 |                     case 2: .float2\n  283 |                     case 3: .float3\n  284 |                     case 4: .float4\n  285 |                     default: .invalid\n  286 |                     }\n  287 | \n  288 |                 guard format != .invalid else {\n  289 |                     assertionFailure(\"OBSShader: Unsupported amount of texture coordinates '\\(numCoordinates)'\")\n  290 |                     return nil\n  291 |                 }\n  292 | \n  293 |                 return (format, MemoryLayout<Float32>.size * numCoordinates)","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/OBSShader.swift#L273-L293"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`get_atom` dereferences `atom_r->atom` without checking that `xcb_intern_atom_reply` succeeded (NULL is passed for the error out-param and the reply is not null-checked). If interning fails and the reply is NULL, this dereferences NULL. All atoms in `xcomp_gather_atoms` go through this helper during module load.","fix":"Null-check the reply: `if (!atom_r) return XCB_ATOM_NONE;` before reading `atom_r->atom`.","locations":[{"ref":"plugins/linux-capture/xcomposite-input.c:74-81","code":"   74 | xcb_atom_t get_atom(xcb_connection_t *conn, const char *name)\n   75 | {\n   76 | \txcb_intern_atom_cookie_t atom_c = xcb_intern_atom(conn, 1, strlen(name), name);\n   77 | \txcb_intern_atom_reply_t *atom_r = xcb_intern_atom_reply(conn, atom_c, NULL);\n   78 | \txcb_atom_t a = atom_r->atom;\n   79 | \tfree(atom_r);\n   80 | \treturn a;\n   81 | }","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-capture/xcomposite-input.c#L74-L81"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`check_compatibility` reads optional JSON string fields with `get_string_val` (which returns NULL when the key is missing) and then, when the corresponding match flag bit is set, passes them straight into string functions without a NULL check: `strcmp(win_class, j_class)`, `astrcmpi(exe, j_exe)`, and especially `strlen(j_title)` inside the `astrcmpi_n` call. A `compatibility.json` entry that sets `match_flags` bits but omits `window_class`/`executable`/`window_title` dereferences NULL and crashes. Since `compatibility.json` can be replaced by a downloaded/updated file, a malformed entry can crash the capture source.","fix":"Guard each field before use, e.g. treat a NULL `j_class`/`j_exe`/`j_title` as a non-match: `if ((match_flags & MATCH_CLASS) && (!win_class || !j_class || strcmp(win_class, j_class) != 0)) continue;` and similarly for exe/title (checking `j_title` before `strlen(j_title)`).","locations":[{"ref":"plugins/win-capture/compat-helpers.c:143-150","code":"  143 | \t\tif ((match_flags & MATCH_CLASS) && (!win_class || strcmp(win_class, j_class) != 0))\n  144 | \t\t\tcontinue;\n  145 | \t\tif ((match_flags & MATCH_EXE) && (!exe || astrcmpi(exe, j_exe) != 0))\n  146 | \t\t\tcontinue;\n  147 | \t\t/* Title supports partial matches as some games append additional\n  148 | \t\t * information after the title, e.g., \"Minecraft 1.18\". */\n  149 | \t\tif ((match_flags & MATCH_TITLE) && (!win_title || astrcmpi_n(win_title, j_title, strlen(j_title)) != 0))\n  150 | \t\t\tcontinue;","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/compat-helpers.c#L143-L150"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`SetComboItemEnabled` dereferences the result of `dynamic_cast<QStandardItemModel *>(c->model())` without a null check, and then `model->item(idx)` without checking the returned `QStandardItem *`. If the combo box uses a non-`QStandardItemModel` model, `model` is `nullptr` and the code crashes; if `idx` is out of range, `item` is `nullptr` and `item->setFlags(...)` crashes.","fix":"Guard both pointers:\n```cpp\nQStandardItemModel *model = dynamic_cast<QStandardItemModel *>(c->model());\nif (!model)\n\treturn;\nQStandardItem *item = model->item(idx);\nif (!item)\n\treturn;\nitem->setFlags(enabled ? Qt::ItemIsSelectable | Qt::ItemIsEnabled : Qt::NoItemFlags);\n```","locations":[{"ref":"shared/qt/wrappers/qt-wrappers.cpp:305-310","code":"  305 | void SetComboItemEnabled(QComboBox *c, int idx, bool enabled)\n  306 | {\n  307 | \tQStandardItemModel *model = dynamic_cast<QStandardItemModel *>(c->model());\n  308 | \tQStandardItem *item = model->item(idx);\n  309 | \titem->setFlags(enabled ? Qt::ItemIsSelectable | Qt::ItemIsEnabled : Qt::NoItemFlags);\n  310 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/qt/wrappers/qt-wrappers.cpp#L305-L310"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`DeviceCaptureToolbar` member fields `activateText` and `deactivateText` (both `const char *`) are declared without default initialisers and are only assigned inside the `if (mod)` branch of the constructor. When `obs_get_module(\"win-dshow\")` returns `nullptr` the constructor returns early, leaving those pointers uninitialised. The `activateButton` still exists and is still connected; clicking it reaches `on_activateButton_clicked()` which reads `active ? deactivateText : activateText` — undefined behaviour via uninitialised read.","fix":"Initialise both pointers to `nullptr` in the header, and guard the slot:\n\n```cpp\n// DeviceCaptureToolbar.hpp\nconst char *activateText = nullptr;\nconst char *deactivateText = nullptr;\n```\n\n```cpp\n// on_activateButton_clicked()\nif (!activateText || !deactivateText)\n    return;\n```","locations":[{"ref":"frontend/components/DeviceCaptureToolbar.cpp:20-29","code":"   20 | \tobs_module_t *mod = obs_get_module(\"win-dshow\");\n   21 | \tif (!mod) {\n   22 | \t\treturn;\n   23 | \t}\n   24 | \n   25 | \tactivateText = obs_module_get_locale_text(mod, \"Activate\");\n   26 | \tdeactivateText = obs_module_get_locale_text(mod, \"Deactivate\");\n   27 | \n   28 | \tui->activateButton->setText(active ? deactivateText : activateText);\n   29 | }","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/DeviceCaptureToolbar.cpp#L20-L29"},{"ref":"frontend/components/DeviceCaptureToolbar.cpp:47-48","code":"   47 | \tconst char *text = active ? deactivateText : activateText;\n   48 | \tui->activateButton->setText(text);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/DeviceCaptureToolbar.cpp#L47-L48"},{"ref":"frontend/components/DeviceCaptureToolbar.hpp:15-16","code":"   15 | \tconst char *activateText;\n   16 | \tconst char *deactivateText;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/DeviceCaptureToolbar.hpp#L15-L16"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`OBSSourceLabel::obsSourceRenamed`, `obsSourceRemoved`, and `obsSourceDestroyed` are OBS signal callbacks that execute on the OBS signal/data thread, not the Qt GUI thread. All three call methods directly on a `QLabel` widget (`label.setText(name)`, `emit label.renamed(name)`, etc.) without marshalling the call to the GUI thread via `QMetaObject::invokeMethod`. Additionally, `obsSourceDestroyed` calls `label.destroyedSignal.Disconnect()` from the signal thread, mutating signal-connection state without synchronization. Touching Qt widgets from a non-GUI thread is undefined behaviour and a crash risk.","fix":"Use `QMetaObject::invokeMethod` with `Qt::QueuedConnection` for all widget-touching operations, same as the rest of the codebase does:\n\n```cpp\nvoid OBSSourceLabel::obsSourceRenamed(void *data, calldata_t *params)\n{\n    const char *name = calldata_string(params, \"new_name\");\n    QString qname = QString::fromUtf8(name ? name : \"\");\n    QMetaObject::invokeMethod(static_cast<OBSSourceLabel *>(data),\n                              \"setText\", Qt::QueuedConnection,\n                              Q_ARG(QString, qname));\n    // emit renamed via invokeMethod or a dedicated slot\n}\n```\nFor `obsSourceDestroyed`, queue the `Disconnect()` calls through a slot on the GUI thread.","locations":[{"ref":"frontend/components/OBSSourceLabel.cpp:29-53","code":"   29 | void OBSSourceLabel::obsSourceRenamed(void *data, calldata_t *params)\n   30 | {\n   31 | \tauto &label = *static_cast<OBSSourceLabel *>(data);\n   32 | \n   33 | \tconst char *name = calldata_string(params, \"new_name\");\n   34 | \tlabel.setText(name);\n   35 | \n   36 | \temit label.renamed(name);\n   37 | }\n   38 | \n   39 | void OBSSourceLabel::obsSourceRemoved(void *data, calldata_t *)\n   40 | {\n   41 | \tauto &label = *static_cast<OBSSourceLabel *>(data);\n   42 | \temit label.removed();\n   43 | }\n   44 | \n   45 | void OBSSourceLabel::obsSourceDestroyed(void *data, calldata_t *)\n   46 | {\n   47 | \tauto &label = *static_cast<OBSSourceLabel *>(data);\n   48 | \temit label.destroyed();\n   49 | \n   50 | \tlabel.destroyedSignal.Disconnect();\n   51 | \tlabel.removedSignal.Disconnect();\n   52 | \tlabel.renamedSignal.Disconnect();\n   53 | }","lines":25,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/OBSSourceLabel.cpp#L29-L53"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`SourceTreeItem::mouseDoubleClickEvent` on Windows captures the raw `obs_source_t *source` pointer in a `QTimer::singleShot(200ms)` lambda without incrementing its reference count. If the user deletes the source during that 200 ms window, the captured pointer becomes dangling and `main->CreatePropertiesWindow(source)` will dereference freed memory.","fix":"Capture an `OBSSourceAutoRelease` (or an `OBSSource`) instead of the raw pointer so the source is kept alive for the duration of the timer:\n\n```cpp\nOBSSourceAutoRelease safeSource = obs_source_get_ref(source);\nQTimer::singleShot(200, this, [=, safeSource = std::move(safeSource)]() {\n    if (safeSource)\n        main->CreatePropertiesWindow(safeSource);\n});\n```","locations":[{"ref":"frontend/components/SourceTreeItem.cpp:308","code":"  308 | \t\t\t\tQTimer::singleShot(200, this, [=]() { main->CreatePropertiesWindow(source); });","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SourceTreeItem.cpp#L308"}]},
{"id":"UAF_4","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`SourceTreeModel` registers `OBSFrontendEvent` as an OBS frontend event callback in its\nconstructor (line 242) and only removes it when `OBS_FRONTEND_EVENT_EXIT` fires (line 25).\nThere is no destructor that calls `obs_frontend_remove_event_callback`. If the model is ever\ndestroyed before OBS raises `OBS_FRONTEND_EVENT_EXIT` (e.g., test tear-down, future UI\nrefactoring), the callback will fire with a dangling `SourceTreeModel *` pointer, causing\nuse-after-free memory corruption.","fix":"Add a destructor that removes the callback:\n```cpp\n// In SourceTreeModel.hpp\npublic:\n    ~SourceTreeModel();\n\n// In SourceTreeModel.cpp\nSourceTreeModel::~SourceTreeModel()\n{\n    obs_frontend_remove_event_callback(OBSFrontendEvent, this);\n}\n```\nThis is safe to call even if the callback was already removed in the EXIT handler, because\n`obs_frontend_remove_event_callback` is a no-op when the pair is not registered.","locations":[{"ref":"frontend/components/SourceTreeModel.cpp:240-243","code":"  240 | SourceTreeModel::SourceTreeModel(SourceTree *st_) : QAbstractListModel(st_), st(st_)\n  241 | {\n  242 | \tobs_frontend_add_event_callback(OBSFrontendEvent, this);\n  243 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SourceTreeModel.cpp#L240-L243"},{"ref":"frontend/components/SourceTreeModel.cpp:15-26","code":"   15 | void SourceTreeModel::OBSFrontendEvent(enum obs_frontend_event event, void *ptr)\n   16 | {\n   17 | \tSourceTreeModel *stm = static_cast<SourceTreeModel *>(ptr);\n   18 | \n   19 | \tswitch (event) {\n   20 | \tcase OBS_FRONTEND_EVENT_PREVIEW_SCENE_CHANGED:\n   21 | \t\tstm->SceneChanged();\n   22 | \t\tbreak;\n   23 | \tcase OBS_FRONTEND_EVENT_EXIT:\n   24 | \t\tstm->Clear();\n   25 | \t\tobs_frontend_remove_event_callback(OBSFrontendEvent, stm);\n   26 | \t\tbreak;","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SourceTreeModel.cpp#L15-L26"}]},
{"id":"UAF_5","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`unregister_hotkey` calls `bfree(hotkey)` at line 867 and then calls `remove_bindings(id)` at line 869. Inside `remove_bindings`, when a binding is found with `binding->pressed == true`, `release_pressed_binding(binding)` is called, which immediately dereferences `binding->hotkey` - the pointer that was just freed. This is a use-after-free: the freed `obs_hotkey_t` is read and its `func`, `data`, and `id` fields are used to fire a release callback.","fix":"Move `remove_bindings(id)` before the `bfree(hotkey)` call so the binding list is cleaned up while the hotkey is still alive:\n```c\nHASH_DEL(obs->hotkeys.hotkeys, hotkey);\nhotkey_signal(\"hotkey_unregister\", hotkey);\nrelease_registerer(hotkey);\nremove_bindings(id);   /* must happen before bfree(hotkey) */\nbfree(hotkey->name);\nbfree(hotkey->description);\nbfree(hotkey);\n```","locations":[{"ref":"libobs/obs-hotkey.c:856-869","code":"  856 | \tHASH_DEL(obs->hotkeys.hotkeys, hotkey);\n  857 | \n  858 | \thotkey_signal(\"hotkey_unregister\", hotkey);\n  859 | \n  860 | \trelease_registerer(hotkey);\n  861 | \n  862 | \tif (hotkey->registerer_type == OBS_HOTKEY_REGISTERER_SOURCE)\n  863 | \t\tobs_weak_source_release(hotkey->registerer);\n  864 | \n  865 | \tbfree(hotkey->name);\n  866 | \tbfree(hotkey->description);\n  867 | \tbfree(hotkey);\n  868 | \n  869 | \tremove_bindings(id);","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-hotkey.c#L856-L869"},{"ref":"libobs/obs-hotkey.c:1021-1033","code":" 1021 | static inline void release_pressed_binding(obs_hotkey_binding_t *binding)\n 1022 | {\n 1023 | \tbinding->pressed = false;\n 1024 | \n 1025 | \tobs_hotkey_t *hotkey = binding->hotkey;\n 1026 | \tif (--hotkey->pressed)\n 1027 | \t\treturn;\n 1028 | \n 1029 | \tif (!obs->hotkeys.reroute_hotkeys)\n 1030 | \t\thotkey->func(hotkey->data, hotkey->id, hotkey, false);\n 1031 | \telse if (obs->hotkeys.router_func)\n 1032 | \t\tobs->hotkeys.router_func(obs->hotkeys.router_func_data, hotkey->id, false);\n 1033 | }","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-hotkey.c#L1021-L1033"}]},
{"id":"UAF_6","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"In `nvvfx_filter_create_internal`, the error handler `log_nverror_destroy(filter, ...)` is called but its result is ignored and execution continues. `log_nverror_destroy` calls `nvvfx_filter_destroy(filter)`, which queues `nvvfx_filter_actual_destroy` (that does `bfree(filter)`) on the graphics thread. After queuing the destroy, `nvvfx_filter_create_internal` still returns `true` (line 280), so `nvvfx_filter_create` keeps dereferencing `filter` (e.g. `obs_enter_graphics`, `gs_effect_create_from_file`, `NvVFX_AllocateState`) and finally returns the already-queued-for-destruction pointer to OBS. This is a use-after-free / double-free: the queued task frees `filter` while it is still in use and OBS will later destroy it again. The pattern is used correctly elsewhere (line 349/352 do `return log_nverror_destroy(...)`), but the three sites inside `nvvfx_filter_create_internal` do not return `false`.","fix":"Make each failure inside `nvvfx_filter_create_internal` return `false` instead of falling through, e.g.\n```c\nif (NVCV_SUCCESS != vfxErr) {\n    log_nverror_destroy(filter, vfxErr);\n    return false;\n}\n```\nand have the caller stop touching `filter` once `nvvfx_filter_create_internal` returns false (it already returns NULL in that case).","locations":[{"ref":"plugins/nv-filters/nvidia-videofx-filter.c:235-244","code":"  235 | \t\tvfxErr = NvVFX_CreateEffect(NVVFX_FX_GREEN_SCREEN, &filter->handle);\n  236 | \t\tif (NVCV_SUCCESS != vfxErr)\n  237 | \t\t\tlog_nverror_destroy(filter, vfxErr);\n  238 | \t\tvfxErr = NvVFX_CreateEffect(NVVFX_FX_BGBLUR, &filter->handle_blur);\n  239 | \t\tbreak;\n  240 | \tdefault:\n  241 | \t\treturn false;\n  242 | \t}\n  243 | \tif (NVCV_SUCCESS != vfxErr)\n  244 | \t\tlog_nverror_destroy(filter, vfxErr);","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-videofx-filter.c#L235-L244"},{"ref":"plugins/nv-filters/nvidia-videofx-filter.c:259-261","code":"  259 | \tvfxErr = NvVFX_CudaStreamCreate(&filter->stream);\n  260 | \tif (NVCV_SUCCESS != vfxErr)\n  261 | \t\tlog_nverror_destroy(filter, vfxErr);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-videofx-filter.c#L259-L261"},{"ref":"plugins/nv-filters/nvidia-videofx-filter.c:280","code":"  280 | \treturn true;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-videofx-filter.c#L280"}]},
{"id":"UAF_7","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"In `OBSApp::applicationShutdown` (non-Windows path), the lambda `disconnectSignal` dereferences\nthe `QPointer<QSocketNotifier>` notifier directly (`notifier->setEnabled(false)`) without checking\nwhether the pointer is still valid. `QPointer` returns null if the pointed-to object has already\nbeen destroyed. If the socket notifier was deleted by some other means before shutdown (e.g. a\nparent widget destruction race), this causes a null pointer dereference.","fix":"Guard each notifier dereference:\n\n```cpp\nauto disconnectSignal = [this](std::array<int, 2> &fileDescriptor,\n                               QPointer<QSocketNotifier> &notifier) -> void {\n    if (notifier) {\n        notifier->setEnabled(false);\n    }\n    std::array<int, 2> tempFileDescriptor = std::exchange(fileDescriptor, {0, 0});\n    ::close(tempFileDescriptor[0]);\n    ::close(tempFileDescriptor[1]);\n};\n```","locations":[{"ref":"frontend/OBSApp.cpp:2003-2015","code":" 2003 | \tauto disconnectSignal = [this](std::array<int, 2> &fileDescriptor,\n 2004 | \t\t\t\t       QPointer<QSocketNotifier> &notifier) -> void {\n 2005 | \t\tnotifier->setEnabled(false);\n 2006 | \n 2007 | \t\tstd::array<int, 2> tempFileDescriptor = std::exchange(fileDescriptor, {0, 0});\n 2008 | \t\t::close(tempFileDescriptor[0]);\n 2009 | \t\t::close(tempFileDescriptor[1]);\n 2010 | \t};\n 2011 | \n 2012 | \tdisconnectSignal(sigIntFileDescriptor, sigIntNotifier);\n 2013 | \tdisconnectSignal(sigTermFileDescriptor, sigTermNotifier);\n 2014 | \tdisconnectSignal(sigAbrtFileDescriptor, sigAbrtNotifier);\n 2015 | \tdisconnectSignal(sigQuitFileDescriptor, sigQuitNotifier);","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp.cpp#L2003-L2015"}]},
{"id":"UAF_8","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"`wasapi-output.c` (`audio_monitor_free_for_reconnect`): the function calls `monitor->client->lpVtbl->Stop(monitor->client)` twice - once before the `render` check (line 258) and again inside the `client` check (line 267) before releasing `client`. The double `Stop` is harmless (it returns an error the second time), but the real problem is that it signals the intent to stop twice unnecessarily and obscures the code. More importantly, `render` is released first (line 263), then `client->Stop` is called again (line 267) on the already-stopped client. While not technically a use-after-free (client is still valid at that point), it is a clear copy-paste bug leading to redundant COM calls.","fix":"Remove the first `Stop` call (line 259) outside the render/client null checks; keep only the single `Stop` call just before releasing `client`:\n```c\nstatic void audio_monitor_free_for_reconnect(struct audio_monitor *monitor)\n{\n    if (monitor->render) {\n        monitor->render->lpVtbl->Release(monitor->render);\n        monitor->render = NULL;\n    }\n    if (monitor->client) {\n        monitor->client->lpVtbl->Stop(monitor->client);\n        monitor->client->lpVtbl->Release(monitor->client);\n        monitor->client = NULL;\n    }\n    audio_resampler_destroy(monitor->resampler);\n    monitor->resampler = NULL;\n    deque_free(&monitor->delay_buffer);\n    da_free(monitor->buf);\n}\n```","locations":[{"ref":"libobs/audio-monitoring/win32/wasapi-output.c:256-277","code":"  256 | static void audio_monitor_free_for_reconnect(struct audio_monitor *monitor)\n  257 | {\n  258 | \tif (monitor->client)\n  259 | \t\tmonitor->client->lpVtbl->Stop(monitor->client);\n  260 | \n  261 | \tif (monitor->render) {\n  262 | \t\tmonitor->render->lpVtbl->Release(monitor->render);\n  263 | \t\tmonitor->render = NULL;\n  264 | \t}\n  265 | \n  266 | \tif (monitor->client) {\n  267 | \t\tmonitor->client->lpVtbl->Stop(monitor->client);\n  268 | \t\tmonitor->client->lpVtbl->Release(monitor->client);\n  269 | \t\tmonitor->client = NULL;\n  270 | \t}\n  271 | \n  272 | \taudio_resampler_destroy(monitor->resampler);\n  273 | \tmonitor->resampler = NULL;\n  274 | \n  275 | \tdeque_free(&monitor->delay_buffer);\n  276 | \tda_free(monitor->buf);\n  277 | }","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/win32/wasapi-output.c#L256-L277"}]},
{"id":"UAF_9","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"In `InitScripts` (macOS path migration) `python_path` is reassigned to `_temp.c_str()` where `_temp` is a `std::string` local to the inner `if (pos != std::string::npos)` block. `_temp` (and the enclosing `_python_path`) are destroyed when their scopes end, so at the later use `obs_scripting_load_python(python_path)` the pointer dangles into freed heap memory. Additionally, even ignoring `_temp`, the original `python_path` (returned by `config_get_string`) may be invalidated by the intervening `config_set_string`. Only affects macOS.","fix":"After writing the migrated value back to config, re-fetch it from config instead of pointing at a temporary, e.g. replace `python_path = _temp.c_str();` with a re-read after the block: `python_path = config_get_string(config, \"Python\", \"Path\" ARCH_NAME);` performed once after the migration `if`.","locations":[{"ref":"plugins/frontend-tools/scripts.cpp:654-669","code":"  654 | #ifdef __APPLE__\n  655 | \tif (python_path && *python_path) {\n  656 | \t\tstd::string _python_path(python_path);\n  657 | \t\tstd::size_t pos = _python_path.find(\"/Python.framework/Versions\");\n  658 | \n  659 | \t\tif (pos != std::string::npos) {\n  660 | \t\t\tstd::string _temp = _python_path.substr(0, pos);\n  661 | \t\t\tconfig_set_string(config, \"Python\", \"Path\" ARCH_NAME, _temp.c_str());\n  662 | \t\t\tconfig_save(config);\n  663 | \t\t\tpython_path = _temp.c_str();\n  664 | \t\t}\n  665 | \t}\n  666 | #endif\n  667 | \n  668 | \tif (!obs_scripting_python_loaded() && python_path && *python_path) {\n  669 | \t\tobs_scripting_load_python(python_path);","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/frontend-tools/scripts.cpp#L654-L669"}]},
{"id":"UAF_10","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"In `sndio_apply`, after `data->sock = socks[0]` (line 264), any later failure (`sio_open`, `sio_setpar`, `sio_start`, `pthread_create`) jumps to `error:` which does `close(socks[0])` (== `data->sock`) but leaves `data->sock` still holding that now-closed descriptor number. A subsequent `sndio_update` (which does `if (data->sock != -1) close(data->sock)`, line 262-263) or `sndio_destroy` (`close(data->sock)`, line 235) then double-closes that fd. If the fd number was recycled by another `socketpair`/`open` in between, the wrong (unrelated) descriptor is closed.","fix":"In the `error:` path, reset `data->sock` to `-1` when it aliases `socks[0]` (and avoid closing it twice), e.g. after closing set `data->sock = -1;`, or only assign `data->sock = socks[0]` after all setup has succeeded.","locations":[{"ref":"plugins/sndio/sndio-input.c:262-307","code":"  262 | \tif (data->sock != -1)\n  263 | \t\tclose(data->sock);\n  264 | \tdata->sock = socks[0];\n  265 | \tthrdata->sock = socks[1];\n  266 | \tthrdata->source = data->source;\n  267 | \n  268 | \tthrdata->hdl = sio_open(devname, SIO_REC, 0);\n  269 | \tif (!thrdata->hdl) {\n  270 | \t\tberr(LOG_ERROR, \"could not open %s sndio device\", devname);\n  271 | \t\tgoto error;\n  272 | \t}\n  273 | \n  274 | \tsio_initpar(&thrdata->par);\n  275 | \tthrdata->par.bits = obs_data_get_int(settings, \"bits\");\n  276 | \tthrdata->par.bps = SIO_BPS(thrdata->par.bits);\n  277 | \tthrdata->par.sig = thrdata->par.bits > 8;\n  278 | \tthrdata->par.le = 1;\n  279 | \tthrdata->par.rate = obs_data_get_int(settings, \"rate\");\n  280 | \tthrdata->par.rchan = obs_data_get_int(settings, \"channels\");\n  281 | \tthrdata->par.xrun = SIO_SYNC; // makes timestamping easy\n  282 | \tif (!sio_setpar(thrdata->hdl, &thrdata->par)) {\n  283 | \t\tberr(LOG_ERROR, \"could not set parameters for %s sndio device\", devname);\n  284 | \t\tgoto error;\n  285 | \t}\n  286 | \tblog(LOG_INFO, \"after initial sio_setpar(): appbufsz=%u bps=%u\", thrdata->par.appbufsz, thrdata->par.bps);\n  287 | \n  288 | \tif (!sio_start(thrdata->hdl)) {\n  289 | \t\tberr(LOG_ERROR, \"could not start recording on %s sndio device\", devname);\n  290 | \t\tgoto error;\n  291 | \t}\n  292 | \n  293 | \tec = pthread_create(&thread, &data->attr, sndio_thread, thrdata);\n  294 | \tif (ec != 0) {\n  295 | \t\tblog(LOG_ERROR, \"could not start thread\");\n  296 | \t\tgoto error;\n  297 | \t}\n  298 | \n  299 | \treturn;\n  300 | \n  301 | error:\n  302 | \tif (thrdata->hdl != NULL)\n  303 | \t\tsio_close(thrdata->hdl);\n  304 | \tclose(socks[0]);\n  305 | \tclose(socks[1]);\n  306 | \tbfree(thrdata);\n  307 | }","lines":46,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/sndio/sndio-input.c#L262-L307"},{"ref":"plugins/sndio/sndio-input.c:235","code":"  235 | \tclose(data->sock);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/sndio/sndio-input.c#L235"}]},
{"id":"UAF_11","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"The data callbacks generated by `DEFINE_VOID_DATA_CALLBACK` (`obs_lua_source_activate`, `obs_lua_source_deactivate`, `obs_lua_source_show`, `obs_lua_source_hide`) neither lock `ls->definition_mutex` nor check `if (!ls->script)` before running, unlike every other source data callback in this file (`obs_lua_source_get_width`, `obs_lua_source_update`, `obs_lua_source_video_tick`, `obs_lua_source_video_render`, `obs_lua_source_save`, `obs_lua_source_load`, etc.). `undef_source_type` and `obs_lua_source_free_type_data` mutate `ls->func_*` and `ls->script` (and ultimately `bfree(ls)`) while holding `definition_mutex`. Because these four callbacks ignore that mutex, they can read `ls->func_activate`/`ls->script` while they are being written (data race) and, if `obs_lua_source_free_type_data` reaches `bfree(ls)`, use the freed `ls` (use-after-free).","fix":"Make the macro match the other callbacks - acquire `ls->definition_mutex` and bail out when `ls->script` is NULL:\n```c\n#define DEFINE_VOID_DATA_CALLBACK(name)               \\\n\tstatic void obs_lua_source_##name(void *data) \\\n\t{                                             \\\n\t\tstruct obs_lua_data *ld = data;       \\\n\t\tstruct obs_lua_source *ls = ld->ls;   \\\n\t\tpthread_mutex_lock(&ls->definition_mutex); \\\n\t\tif (ls->script && have_func(name)) {  \\\n\t\t\tlock_script();                \\\n\t\t\tls_push_data();               \\\n\t\t\tcall_func(name, 1, 0);        \\\n\t\t\tunlock_script();              \\\n\t\t}                                     \\\n\t\tpthread_mutex_unlock(&ls->definition_mutex); \\\n\t}\n```","locations":[{"ref":"shared/obs-scripting/obs-scripting-lua-source.c:381-397","code":"  381 | #define DEFINE_VOID_DATA_CALLBACK(name)               \\\n  382 | \tstatic void obs_lua_source_##name(void *data) \\\n  383 | \t{                                             \\\n  384 | \t\tstruct obs_lua_data *ld = data;       \\\n  385 | \t\tstruct obs_lua_source *ls = ld->ls;   \\\n  386 | \t\tif (!have_func(name))                 \\\n  387 | \t\t\treturn;                       \\\n  388 | \t\tlock_script();                        \\\n  389 | \t\tls_push_data();                       \\\n  390 | \t\tcall_func(name, 1, 0);                \\\n  391 | \t\tunlock_script();                      \\\n  392 | \t}\n  393 | DEFINE_VOID_DATA_CALLBACK(activate)\n  394 | DEFINE_VOID_DATA_CALLBACK(deactivate)\n  395 | DEFINE_VOID_DATA_CALLBACK(show)\n  396 | DEFINE_VOID_DATA_CALLBACK(hide)\n  397 | #undef DEFINE_VOID_DATA_CALLBACK","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/obs-scripting/obs-scripting-lua-source.c#L381-L397"}]},
{"id":"UAF_12","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"very_easy","description":"`Group::setCheckable` disable branch calls `toggleSwitch->deleteLater()` but does not reset `toggleSwitch` to `nullptr`. The `toggleSwitch` member is then a dangling pointer. If `setCheckable(true)` is later called, the guard `checkable && !toggleSwitch` evaluates false (pointer still non-null) so the switch is never recreated; and if `setCheckable(false)` is called again, `controlLayout->removeWidget(toggleSwitch)` and a second `deleteLater()` operate on an already-deleted object (use-after-free / double delete).","fix":"```cpp\nif (!checkable && toggleSwitch) {\n\tcontrolLayout->removeWidget(toggleSwitch);\n\ttoggleSwitch->deleteLater();\n\ttoggleSwitch = nullptr;\n}\n```","locations":[{"ref":"shared/qt/idian/widgets/Group.cpp:122-125","code":"  122 | \tif (!checkable && toggleSwitch) {\n  123 | \t\tcontrolLayout->removeWidget(toggleSwitch);\n  124 | \t\ttoggleSwitch->deleteLater();\n  125 | \t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/qt/idian/widgets/Group.cpp#L122-L125"}]},
{"id":"UAF_13","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"very_easy","description":"In `CollapsibleRow::setCheckable`, the disable branch calls `actionRow->suffix()->deleteLater()` (which deletes the `toggleSwitch` widget) but never resets the `toggleSwitch` member to `nullptr`. After this, `toggleSwitch` is a dangling pointer. Because `CollapsibleRow::setChecked` derefs it (`toggleSwitch->setChecked(checked)`) and `Row::isChecked()` derefs it (`toggleSwitch->isChecked()`), any later call is a use-after-free once the deferred deletion runs. Additionally, re-enabling via `setCheckable(true)` sees `!toggleSwitch` as false (dangling non-null) and silently fails to recreate the switch. The same disable branch also leaves `actionRow->suffix_` dangling since `Row::setSuffix` is never told the widget is gone.","fix":"Reset the pointer after scheduling deletion:\n```cpp\nif (!checkable && toggleSwitch) {\n\tpropertyList->setEnabled(true);\n\tUtils::polishChildren(propertyList);\n\n\tactionRow->suffix()->deleteLater();\n\ttoggleSwitch = nullptr;\n}\n```\nAlso clear the suffix in `Row` (e.g. add a `Row::clearSuffix()` that resets `suffix_`) so `actionRow->suffix_` does not dangle.","locations":[{"ref":"shared/qt/idian/widgets/Row.cpp:329-334","code":"  329 | \tif (!checkable && toggleSwitch) {\n  330 | \t\tpropertyList->setEnabled(true);\n  331 | \t\tUtils::polishChildren(propertyList);\n  332 | \n  333 | \t\tactionRow->suffix()->deleteLater();\n  334 | \t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/qt/idian/widgets/Row.cpp#L329-L334"}]},
{"id":"UAF_14","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"easy","description":"`obs_hotkey_name_map_free` iterates and frees every item in the hash table but does not\nclear `obs->hotkeys.name_map` to NULL when done. After the function returns, the field\npoints to freed memory. If `obs_key_from_name` is called after `obs_hotkey_name_map_free`\n(e.g. during shutdown if the call order changes), it will pass the dangling pointer to\n`obs_hotkey_name_map_lookup`, which calls `HASH_FIND_STR` on freed memory - a use-after-free\nthat can produce incorrect key mappings or crash.","fix":"Set `obs->hotkeys.name_map = NULL;` after the `HASH_ITER` loop:\n```c\nHASH_ITER (hh, root, n, tmp) {\n\tHASH_DEL(root, n);\n\tbfree(n->key);\n\tbfree(n);\n}\nobs->hotkeys.name_map = NULL;\n```","locations":[{"ref":"libobs/obs-hotkey-name-map.c:121-134","code":"  121 | void obs_hotkey_name_map_free(void)\n  122 | {\n  123 | \tif (!obs || !obs->hotkeys.name_map)\n  124 | \t\treturn;\n  125 | \n  126 | \tobs_hotkey_name_map_item_t *root = obs->hotkeys.name_map;\n  127 | \tobs_hotkey_name_map_item_t *n, *tmp;\n  128 | \n  129 | \tHASH_ITER (hh, root, n, tmp) {\n  130 | \t\tHASH_DEL(root, n);\n  131 | \t\tbfree(n->key);\n  132 | \t\tbfree(n);\n  133 | \t}\n  134 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-hotkey-name-map.c#L121-L134"}]},
{"id":"UAF_15","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"`screen_capture_build_content_list` does `[sc->shareable_content release];` and then issues the async `getShareableContentExcludingDesktopWindows` request. The completion block only reassigns `sc->shareable_content` on success (`error == nil`); on the error path (e.g. screen-capture permission denied/revoked) it leaves `sc->shareable_content` pointing at the just-released object and never nils it. A subsequent call then does `[sc->shareable_content release]` again (and `destroy` releases it too), over-releasing a freed object. Under MRC (this target is not built with `-fobjc-arc`) this is a genuine over-release/UAF once a prior successful fetch has occurred.","fix":"Set `sc->shareable_content = nil;` immediately after releasing it, and/or only release inside the success branch after confirming a new object was stored.","locations":[{"ref":"plugins/mac-capture/mac-sck-common.m:58-77","code":"   58 |     shareable_content_callback new_content_received = ^void(SCShareableContent *shareable_content, NSError *error) {\n   59 |         if (error == nil && sc->shareable_content_available != NULL) {\n   60 |             sc->shareable_content = [shareable_content retain];\n   61 |         } else {\n   62 | #ifdef DEBUG\n   63 |             MACCAP_ERR(\"screen_capture_properties: Failed to get shareable content with error %s\\n\",\n   64 |                        [[error localizedFailureReason] cStringUsingEncoding:NSUTF8StringEncoding]);\n   65 | #endif\n   66 |             MACCAP_LOG(LOG_WARNING, \"Unable to get list of available applications or windows. \"\n   67 |                                     \"Please check if OBS has necessary screen capture permissions.\");\n   68 |         }\n   69 |         os_sem_post(sc->shareable_content_available);\n   70 |     };\n   71 | \n   72 |     os_sem_wait(sc->shareable_content_available);\n   73 |     [sc->shareable_content release];\n   74 |     BOOL onScreenWindowsOnly = (display_capture) ? NO : !sc->show_hidden_windows;\n   75 |     [SCShareableContent getShareableContentExcludingDesktopWindows:YES onScreenWindowsOnly:onScreenWindowsOnly\n   76 |                                                  completionHandler:new_content_received];\n   77 | }","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-capture/mac-sck-common.m#L58-L77"}]},
{"id":"UAF_16","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"very_easy","description":"In `happy_eyeballs_create()` the failure/cleanup branch dereferences `(*context)` (the caller's output pointer) even though `*context` is only assigned on the success path (`*context = ctx;`). On the error path `*context` still holds whatever the caller initialized it to (typically `NULL` or garbage), so `os_event_destroy((*context)->race_completed_event)`, `pthread_mutex_destroy(&(*context)->winner_mutex)` and `&(*context)->candidate_mutex` dereference an unset pointer, causing a null/garbage dereference. The guard on the line above correctly uses `ctx->race_completed_event`, making this an obvious typo. Reached only when `os_event_init`/`pthread_mutex_init` fail (rare resource exhaustion), but it is a genuine crash.","fix":"Use `ctx` instead of `(*context)` in the cleanup block:\n```c\nif (ctx->race_completed_event)\n\tos_event_destroy(ctx->race_completed_event);\nif (have_winner_mutex)\n\tpthread_mutex_destroy(&ctx->winner_mutex);\nif (have_candidate_mutex)\n\tpthread_mutex_destroy(&ctx->candidate_mutex);\n```","locations":[{"ref":"shared/happy-eyeballs/happy-eyeballs.c:504-512","code":"  504 | \t/* Failure, cleanup */\n  505 | \tif (ctx->race_completed_event)\n  506 | \t\tos_event_destroy((*context)->race_completed_event);\n  507 | \n  508 | \tif (have_winner_mutex)\n  509 | \t\tpthread_mutex_destroy(&(*context)->winner_mutex);\n  510 | \n  511 | \tif (have_candidate_mutex)\n  512 | \t\tpthread_mutex_destroy(&(*context)->candidate_mutex);","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/happy-eyeballs/happy-eyeballs.c#L504-L512"}]},
