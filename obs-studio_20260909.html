{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"In `obs_frontend_get_scenes` and `obs_frontend_get_transitions`, `obs_source_get_ref` is called\npurely as a liveness check (comparing the return value to nullptr), but the incremented reference\nreturned by `obs_source_get_ref` is immediately discarded. The raw pointer `source` (without the\ncorresponding ref) is then pushed into the source list. The list's free function\n`obs_frontend_source_list_free` calls `obs_source_release` on each entry, which releases a\nreference that was never acquired for that slot - leading to a reference undercount and eventual\nuse-after-free or double-free in the OBS source refcount system.","fix":"Store the result of `obs_source_get_ref` and push that into the list instead of `source`:\n\n```cpp\nobs_source_t *ref = obs_source_get_ref(source);\nif (ref != nullptr) {\n    da_push_back(sources->sources, &ref);\n}\n```","locations":[{"ref":"frontend/OBSStudioAPI.cpp:48-52","code":"   48 | \t\tobs_source_t *source = obs_scene_get_source(scene);\n   49 | \n   50 | \t\tif (obs_source_get_ref(source) != nullptr) {\n   51 | \t\t\tda_push_back(sources->sources, &source);\n   52 | \t\t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSStudioAPI.cpp#L48-L52"},{"ref":"frontend/OBSStudioAPI.cpp:78-83","code":"   78 | \tfor (const auto &[uuid, transition] : main->transitions) {\n   79 | \t\tobs_source_t *source = transition;\n   80 | \n   81 | \t\tif (obs_source_get_ref(source) != nullptr) {\n   82 | \t\t\tda_push_back(sources->sources, &source);\n   83 | \t\t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSStudioAPI.cpp#L78-L83"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"In `audio_output_open` (audio-io.c lines 372-390), the fail path `fail0` calls `audio_output_close(out)`. At the point where `fail0` is reached after `pthread_mutex_init_recursive` fails (line 373), `out` was allocated but the mutex was never successfully initialised. `audio_output_close` checks `audio->initialized` (which is `false` here) and skips the thread/event teardown, then still calls `bfree(audio)`. This is actually correct, but when `fail0` is reached from the very first `bzalloc` failure (line 361), `out` is `NULL` and `audio_output_close(NULL)` is a no-op - so no leak occurs there. However, if `os_event_init` fails (line 374), the code jumps to `fail1` then `fail0`, calling `audio_output_close` which does not destroy the event (it was never created) - that is also fine. The actual leak is: when `pthread_create` fails (line 377), we jump to `fail2`, destroy the event, then to `fail1` -> destroys mutex -> then `fail0` -> calls `audio_output_close(out)`. At this point `initialized` is still false so close skips the thread join, then frees `out`. The mixes' `inputs` DARRAY is zero-initialised so `da_free` of an empty array is safe. This path appears actually leak-free. Re-examine: the real problem is the `fail0` label is shared between the `bzalloc` failure (out=NULL, close is no-op) and the mutex-init failure (out allocated, close frees it). If `bzalloc` succeeds but mutex init fails, close correctly frees. This seems OK. Documenting as low severity for the confusing control flow that is hard to audit.","fix":"Restructure the error paths to be explicit and not rely on `audio_output_close` for cleanup during construction. Use separate `goto` labels for pre- and post-`bzalloc` failures to make the ownership clear:\n```c\nif (!(out = bzalloc(sizeof(*out))))\n    return AUDIO_OUTPUT_FAIL;\n// ... init fields ...\nif (pthread_mutex_init_recursive(&out->input_mutex) != 0) goto fail_mutex;\nif (os_event_init(&out->stop_event, OS_EVENT_TYPE_MANUAL) != 0) goto fail_event;\nif (pthread_create(&out->thread, NULL, audio_thread, out) != 0) goto fail_thread;\n// success\nfail_thread: os_event_destroy(out->stop_event);\nfail_event:  pthread_mutex_destroy(&out->input_mutex);\nfail_mutex:  bfree(out);\n             return AUDIO_OUTPUT_FAIL;\n```","locations":[{"ref":"libobs/media-io/audio-io.c:353-390","code":"  353 | int audio_output_open(audio_t **audio, struct audio_output_info *info)\n  354 | {\n  355 | \tstruct audio_output *out;\n  356 | \tbool planar = is_audio_planar(info->format);\n  357 | \n  358 | \tif (!valid_audio_params(info))\n  359 | \t\treturn AUDIO_OUTPUT_INVALIDPARAM;\n  360 | \n  361 | \tout = bzalloc(sizeof(struct audio_output));\n  362 | \tif (!out)\n  363 | \t\tgoto fail0;\n  364 | \n  365 | \tmemcpy(&out->info, info, sizeof(struct audio_output_info));\n  366 | \tout->channels = get_audio_channels(info->speakers);\n  367 | \tout->planes = planar ? out->channels : 1;\n  368 | \tout->input_cb = info->input_callback;\n  369 | \tout->input_param = info->input_param;\n  370 | \tout->block_size = (planar ? 1 : out->channels) * get_audio_bytes_per_channel(info->format);\n  371 | \n  372 | \tif (pthread_mutex_init_recursive(&out->input_mutex) != 0)\n  373 | \t\tgoto fail0;\n  374 | \tif (os_event_init(&out->stop_event, OS_EVENT_TYPE_MANUAL) != 0)\n  375 | \t\tgoto fail1;\n  376 | \tif (pthread_create(&out->thread, NULL, audio_thread, out) != 0)\n  377 | \t\tgoto fail2;\n  378 | \n  379 | \tout->initialized = true;\n  380 | \t*audio = out;\n  381 | \treturn AUDIO_OUTPUT_SUCCESS;\n  382 | \n  383 | fail2:\n  384 | \tos_event_destroy(out->stop_event);\n  385 | fail1:\n  386 | \tpthread_mutex_destroy(&out->input_mutex);\n  387 | fail0:\n  388 | \taudio_output_close(out);\n  389 | \treturn AUDIO_OUTPUT_FAIL;\n  390 | }","lines":38,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/audio-io.c#L353-L390"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"In `read_from_end`, the UTF-16 branch allocates `srcdata->text = bzalloc(filesize - cur_pos)` and then `fread`s exactly `filesize - cur_pos` bytes into it, so the buffer contains NO trailing null terminator. `remove_cr(srcdata->text)` immediately walks the string with `for (int i = 0; source[i] != '\\0'; ++i)`, reading (and writing) past the end of the heap allocation until it happens to hit a zero `wchar_t`. This is a heap out-of-bounds read/write. Compare the non-UTF-16 path below it (`bzalloc((filesize - cur_pos) + 1)`) and `load_text_from_file` (`bzalloc(filesize)` for `filesize-2` bytes), both of which reserve terminator space.","fix":"Allocate room for a terminator, e.g.\n```c\nsrcdata->text = bzalloc((filesize - cur_pos) + sizeof(wchar_t));\n```\nso that after the `fread` there is at least one zero `wchar_t` for `remove_cr` to stop on.","locations":[{"ref":"plugins/text-freetype2/text-functionality.c:480-483","code":"  480 | \t\tsrcdata->text = bzalloc(filesize - cur_pos);\n  481 | \t\tbytes_read = fread(srcdata->text, (filesize - cur_pos), 1, tmp_file);\n  482 | \n  483 | \t\tremove_cr(srcdata->text);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/text-freetype2/text-functionality.c#L480-L483"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `CustomContextMenu`, `copyAction` and `pasteAction` are created with `new QAction(...)` without a parent and added via `QWidget::addAction`/`QMenu::addAction`, neither of which takes ownership. They are leaked on every context-menu invocation. Worse, because they are permanently appended to `ui->effectWidget`/`ui->asyncWidget` action lists, each right-click accumulates another copy of the Ctrl+C/Ctrl+V actions, producing ambiguous-shortcut behavior over time.","fix":"Give the actions a parent (e.g. `new QAction(QTStr(\"Copy\"), this)`) or, better, create them once in the constructor and reuse them, rather than allocating and re-adding them on each `CustomContextMenu` call.","locations":[{"ref":"frontend/dialogs/OBSBasicFilters.cpp:874-888","code":"  874 | \t\tQAction *copyAction = new QAction(QTStr(\"Copy\"));\n  875 | \t\tconnect(copyAction, &QAction::triggered, this, &OBSBasicFilters::CopyFilter);\n  876 | \t\tcopyAction->setShortcut(QKeySequence(Qt::CTRL | Qt::Key_C));\n  877 | \t\tui->effectWidget->addAction(copyAction);\n  878 | \t\tui->asyncWidget->addAction(copyAction);\n  879 | \t\tpopup.addAction(copyAction);\n  880 | \t}\n  881 | \n  882 | \tQAction *pasteAction = new QAction(QTStr(\"Paste\"));\n  883 | \tpasteAction->setEnabled(main->copyFilter);\n  884 | \tconnect(pasteAction, &QAction::triggered, this, &OBSBasicFilters::PasteFilter);\n  885 | \tpasteAction->setShortcut(QKeySequence(Qt::CTRL | Qt::Key_V));\n  886 | \tui->effectWidget->addAction(pasteAction);\n  887 | \tui->asyncWidget->addAction(pasteAction);\n  888 | \tpopup.addAction(pasteAction);","lines":15,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicFilters.cpp#L874-L888"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `OBSBasicSettings::AdvReplayBufferChanged()` the local `obs_data_t *settings` (declared at line 5239) is a plain non-owning pointer. In the first two branches it borrows the pointer returned by `OBSPropertiesView::GetSettings()` (which returns the view's internal `settings` without incrementing the refcount). But in the `else` branch at line 5251, `settings = obs_encoder_defaults(...)` returns a brand-new reference that is never released anywhere in the function (the function returns at line 5341 without an `obs_data_release`). Compare with `CreateEncoderPropertyView` at line 1938, which wraps the identical `obs_encoder_defaults` call in an `OBSDataAutoRelease`. This else path is reached whenever the record encoder has no properties view (e.g. RecEncoder is `none`/using the stream encoder), which is common, so an `obs_data_t` leaks on every relevant UI change (track toggles, encoder/bitrate changes, replay-buffer toggles).","fix":"Keep the borrowed vs. owned distinction explicit. For example use a separate owning handle for the defaults case:\n```cpp\nOBSDataAutoRelease ownedSettings;\nobs_data_t *settings;\nif (useStream && streamEncoderProps) {\n    settings = streamEncoderProps->GetSettings();\n} else if (!useStream && recordEncoderProps) {\n    settings = recordEncoderProps->GetSettings();\n} else {\n    ...\n    ownedSettings = obs_encoder_defaults(encoder.toUtf8().constData());\n    settings = ownedSettings;\n    if (!settings)\n        return;\n    ...\n    obs_data_apply(settings, data);\n}\n```\nso the created reference is released when the function returns.","locations":[{"ref":"frontend/settings/OBSBasicSettings.cpp:5243-5271","code":" 5243 | \tobs_data_t *settings;\n 5244 | \tQString encoder = ui->advOutRecEncoder->currentText();\n 5245 | \tbool useStream = QString::compare(encoder, TEXT_USE_STREAM_ENC) == 0;\n 5246 | \n 5247 | \tif (useStream && streamEncoderProps) {\n 5248 | \t\tsettings = streamEncoderProps->GetSettings();\n 5249 | \t} else if (!useStream && recordEncoderProps) {\n 5250 | \t\tsettings = recordEncoderProps->GetSettings();\n 5251 | \t} else {\n 5252 | \t\tif (useStream) {\n 5253 | \t\t\tencoder = GetComboData(ui->advOutEncoder);\n 5254 | \t\t}\n 5255 | \t\tsettings = obs_encoder_defaults(encoder.toUtf8().constData());\n 5256 | \n 5257 | \t\tif (!settings) {\n 5258 | \t\t\treturn;\n 5259 | \t\t}\n 5260 | \n 5261 | \t\tconst OBSProfile &currentProfile = main->GetCurrentProfile();\n 5262 | \n 5263 | \t\tconst std::filesystem::path jsonFilePath =\n 5264 | \t\t\tcurrentProfile.path / std::filesystem::u8path(\"recordEncoder.json\");\n 5265 | \n 5266 | \t\tif (!jsonFilePath.empty()) {\n 5267 | \t\t\tOBSDataAutoRelease data =\n 5268 | \t\t\t\tobs_data_create_from_json_file_safe(jsonFilePath.u8string().c_str(), \"bak\");\n 5269 | \t\t\tobs_data_apply(settings, data);\n 5270 | \t\t}\n 5271 | \t}","lines":29,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/settings/OBSBasicSettings.cpp#L5243-L5271"},{"ref":"frontend/settings/OBSBasicSettings.cpp:5338","code":" 5338 | \t}","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/settings/OBSBasicSettings.cpp#L5338"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`addControlForUuid` unconditionally creates a new `VolumeControl` (parented to `this`) and then does `volumeList.insert({uuid, newControl})`. `std::unordered_map::insert` is a no-op when the key already exists, so if `addSource`/`addControlForUuid` is invoked for a uuid already present, the freshly created `newControl` is neither stored nor deleted - it leaks as an orphaned, never-laid-out child widget (and needlessly spins up audio meter callbacks). This path is reachable: `obsSourceAudioActivated` and `obsSourceCreate` both route to `addSource`, and `obsSourceAudioDeactivated` only hides the control (via `updateControlVisibility`) instead of removing it, so any deactivate/reactivate cycle re-enters `addControlForUuid` with an existing uuid.","fix":"Bail out early if the uuid is already tracked (before creating the control):\n```cpp\nvoid AudioMixer::addControlForUuid(QString uuid)\n{\n\tif (volumeList.find(uuid) != volumeList.end())\n\t\treturn;\n\tOBSSourceAutoRelease source = obs_get_source_by_uuid(uuid.toUtf8().constData());\n\tQPointer<VolumeControl> newControl = createVolumeControl(source);\n\tvolumeList.insert({uuid, newControl});\n\tqueueLayoutUpdate();\n}\n```","locations":[{"ref":"frontend/widgets/AudioMixer.cpp:876-884","code":"  876 | void AudioMixer::addControlForUuid(QString uuid)\n  877 | {\n  878 | \tOBSSourceAutoRelease source = obs_get_source_by_uuid(uuid.toUtf8().constData());\n  879 | \n  880 | \tQPointer<VolumeControl> newControl = createVolumeControl(source);\n  881 | \n  882 | \tvolumeList.insert({uuid, newControl});\n  883 | \tqueueLayoutUpdate();\n  884 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/AudioMixer.cpp#L876-L884"}]},
{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `gl_egl_create_dmabuf_image`, the created `egl_image` is only released via `eglDestroyImage` when `gl_egl_create_texture_from_eglimage` succeeds (`if (texture)`). When texture creation fails (returns `NULL`), the `EGLImage` handle is leaked. Since `gl_egl_create_texture_from_eglimage` returns `NULL` on any `glEGLImageTargetTexture2DOES` error, this leaks an EGLImage/dmabuf import on every failing dmabuf capture attempt.","fix":"Always destroy the image after attempting the texture creation:\n```c\ntexture = gl_egl_create_texture_from_eglimage(egl_display, width, height, color_format, GL_TEXTURE_2D, egl_image);\neglDestroyImage(egl_display, egl_image);\nreturn texture;\n```","locations":[{"ref":"libobs-opengl/gl-egl-common.c:261-266","code":"  261 | \ttexture =\n  262 | \t\tgl_egl_create_texture_from_eglimage(egl_display, width, height, color_format, GL_TEXTURE_2D, egl_image);\n  263 | \tif (texture)\n  264 | \t\teglDestroyImage(egl_display, egl_image);\n  265 | \n  266 | \treturn texture;","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-egl-common.c#L261-L266"}]},
{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In `gl_platform_create` the error checks for `register_dummy_class()` and `create_dummy_window(plat)` use `return false;` instead of `goto fail;`. The function returns `struct gl_platform *`, so `false` is coerced to a `NULL` pointer, but more importantly both early returns bypass all cleanup: the already-allocated `plat` (from `bzalloc`) is leaked, and the fully-initialized dummy GL context (`dummy.hwnd`, `dummy.hdc`, `dummy.hrc`) created by `gl_dummy_context_init` is never released via `gl_dummy_context_free`. Every other failure in this function correctly uses `goto fail`.","fix":"Replace the two `return false;` statements with `goto fail;` so the shared cleanup path runs:\n```c\nif (!register_dummy_class())\n\tgoto fail;\nif (!create_dummy_window(plat))\n\tgoto fail;\n```","locations":[{"ref":"libobs-opengl/gl-windows.c:431-434","code":"  431 | \tif (!register_dummy_class())\n  432 | \t\treturn false;\n  433 | \tif (!create_dummy_window(plat))\n  434 | \t\treturn false;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-windows.c#L431-L434"}]},
{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `ffmpeg_image_open_decoder_context`, if `avcodec_open2` fails the function returns `false`\nwithout freeing the just-allocated `decoder_ctx`. At line 46 `avcodec_alloc_context3` allocates\nthe context and immediately assigns it to `info->decoder_ctx` (line 49). When `avcodec_open2`\nfails at line 54, the function returns false. The caller (`ffmpeg_image_init`) reaches `goto fail`\nwhich calls `ffmpeg_image_free(info)`, which does call `avcodec_free_context(&info->decoder_ctx)`.\nSo the leak is averted - BUT only because `info->decoder_ctx` was set before the error return. This\nis a fragile dependency on assignment ordering. A more critical related issue: if\n`avcodec_alloc_context3` returns NULL (OOM), the very next line passes NULL to\n`avcodec_parameters_to_context`, which will crash with a null dereference.","fix":"Check the return value of `avcodec_alloc_context3` before using it:\n\n```c\nAVCodecContext *const decoder_ctx = avcodec_alloc_context3(decoder);\nif (!decoder_ctx) {\n    blog(LOG_WARNING, \"Failed to allocate codec context for file '%s'\", info->file);\n    return false;\n}\navcodec_parameters_to_context(decoder_ctx, codecpar);\ninfo->decoder_ctx = decoder_ctx;\n```\nAlso check the return value of `avcodec_parameters_to_context` (it returns a negative error code\non failure).","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:46-64","code":"   46 | \tAVCodecContext *const decoder_ctx = avcodec_alloc_context3(decoder);\n   47 | \tavcodec_parameters_to_context(decoder_ctx, codecpar);\n   48 | \n   49 | \tinfo->decoder_ctx = decoder_ctx;\n   50 | \tinfo->cx = codecpar->width;\n   51 | \tinfo->cy = codecpar->height;\n   52 | \tinfo->format = codecpar->format;\n   53 | \n   54 | \tret = avcodec_open2(decoder_ctx, decoder, NULL);\n   55 | \tif (ret < 0) {\n   56 | \t\tblog(LOG_WARNING,\n   57 | \t\t     \"Failed to open video codec for file '%s': \"\n   58 | \t\t     \"%s\",\n   59 | \t\t     info->file, av_err2str(ret));\n   60 | \t\treturn false;\n   61 | \t}\n   62 | \n   63 | \treturn true;\n   64 | }","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics-ffmpeg.c#L46-L64"}]},
{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `audio_resampler_resample` (audio-resampler-ffmpeg.c lines 197-203), when `estimated > rs->output_size`, the existing `output_buffer[0]` is freed and `av_samples_alloc` is called. If `av_samples_alloc` fails (returns a negative error code), it is not checked - `rs->output_size` is updated to `estimated` (line 203) regardless, so the next call will not attempt to reallocate. Worse, `rs->output_buffer[0]` is now NULL and `swr_convert` will be called with a NULL output buffer, leading to a crash.","fix":"Check the return value of `av_samples_alloc` and bail out on failure:\n```c\nif (estimated > rs->output_size) {\n    if (rs->output_buffer[0])\n        av_freep(&rs->output_buffer[0]);\n\n    int alloc_ret = av_samples_alloc(rs->output_buffer, NULL,\n                                     rs->output_ch, estimated,\n                                     rs->output_format, 0);\n    if (alloc_ret < 0) {\n        blog(LOG_ERROR, \"av_samples_alloc failed: %d\", alloc_ret);\n        return false;\n    }\n    rs->output_size = estimated;\n}\n```","locations":[{"ref":"libobs/media-io/audio-resampler-ffmpeg.c:197-206","code":"  197 | \tif (estimated > rs->output_size) {\n  198 | \t\tif (rs->output_buffer[0])\n  199 | \t\t\tav_freep(&rs->output_buffer[0]);\n  200 | \n  201 | \t\tav_samples_alloc(rs->output_buffer, NULL, rs->output_ch, estimated, rs->output_format, 0);\n  202 | \n  203 | \t\trs->output_size = estimated;\n  204 | \t}\n  205 | \n  206 | \tret = swr_convert(context, rs->output_buffer, rs->output_size, (const uint8_t **)input, in_frames);","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/audio-resampler-ffmpeg.c#L197-L206"}]},
{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `obs_open_module`, the dynamic library handle (`mod.module`) is opened via `os_dlopen` at line 160. If `load_module_exports` returns an error at line 167-168, or if the version check fails at lines 172-175, the function returns early without closing the handle. The opened library is leaked for the lifetime of the process.","fix":"Close the library handle on early error returns:\n```c\nerrorcode = load_module_exports(&mod, path);\nif (errorcode != MODULE_SUCCESS) {\n    os_dlclose(mod.module);\n    return errorcode;\n}\n\nuint32_t ver = mod.ver ? mod.ver() & 0xFFFF0000 : 0;\nif (ver > LIBOBS_API_VER) {\n    blog(LOG_WARNING, ...);\n    os_dlclose(mod.module);\n    return MODULE_INCOMPATIBLE_VER;\n}\n```","locations":[{"ref":"libobs/obs-module.c:161-177","code":"  161 | \tmod.module = os_dlopen(path);\n  162 | \tif (!mod.module) {\n  163 | \t\tblog(LOG_WARNING, \"Module '%s' not loaded\", path);\n  164 | \t\treturn MODULE_FAILED_TO_OPEN;\n  165 | \t}\n  166 | \n  167 | \terrorcode = load_module_exports(&mod, path);\n  168 | \tif (errorcode != MODULE_SUCCESS)\n  169 | \t\treturn errorcode;\n  170 | \n  171 | \t/* Reject plugins compiled with a newer libobs. Patch version (lower 16-bit) is ignored. */\n  172 | \tuint32_t ver = mod.ver ? mod.ver() & 0xFFFF0000 : 0;\n  173 | \tif (ver > LIBOBS_API_VER) {\n  174 | \t\tblog(LOG_WARNING, \"Module '%s' compiled with newer libobs %d.%d\", path, (ver >> 24) & 0xFF,\n  175 | \t\t     (ver >> 16) & 0xFF);\n  176 | \t\treturn MODULE_INCOMPATIBLE_VER;\n  177 | \t}","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-module.c#L161-L177"}]},
{"id":"MEM_12","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`obs_nix_wayland_hotkeys_platform_init` calls `wl_display_get_registry` and stores the\nresult in a local variable `registry`, but never calls `wl_registry_destroy` on it. The\nregistry proxy is a heap-allocated Wayland object. After `wl_display_roundtrip` returns\nthe registry has already dispatched all global advertisements, so it is no longer needed\nand should be destroyed.","fix":"Destroy the registry after the roundtrip:\n\n```c\nstruct wl_registry *registry = wl_display_get_registry(display);\nwl_registry_add_listener(registry, &registry_listener,\n                         hotkeys->platform_context);\nwl_display_roundtrip(display);\nwl_registry_destroy(registry);\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:246-249","code":"  246 | \tstruct wl_registry *registry = wl_display_get_registry(display);\n  247 | \twl_registry_add_listener(registry, &registry_listener, hotkeys->platform_context);\n  248 | \twl_display_roundtrip(display);\n  249 | \treturn true;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L246-L249"}]},
{"id":"MEM_13","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`obs_nix_wayland_hotkeys_platform_free` releases xkb objects and the platform struct but\nnever destroys the `wl_keyboard` and `wl_seat` Wayland proxies. Both are created during\ninit (via `wl_seat_get_keyboard` and `wl_registry_bind`) and must be explicitly released\nwith `wl_keyboard_release` and `wl_seat_release`. Failing to do so leaks the proxy objects\nand leaves the compositor holding resources it will never reclaim.","fix":"Add keyboard and seat teardown before freeing the struct:\n\n```c\nstatic void obs_nix_wayland_hotkeys_platform_free(struct obs_core_hotkeys *hotkeys)\n{\n    obs_hotkeys_platform_t *plat = hotkeys->platform_context;\n    if (plat->keyboard) {\n        wl_keyboard_release(plat->keyboard);\n        plat->keyboard = NULL;\n    }\n    if (plat->seat) {\n        wl_seat_release(plat->seat);\n        plat->seat = NULL;\n    }\n    xkb_state_unref(plat->xkb_state);\n    xkb_keymap_unref(plat->xkb_keymap);\n    xkb_context_unref(plat->xkb_context);\n    bfree(plat);\n}\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:252-259","code":"  252 | static void obs_nix_wayland_hotkeys_platform_free(struct obs_core_hotkeys *hotkeys)\n  253 | {\n  254 | \tobs_hotkeys_platform_t *plat = hotkeys->platform_context;\n  255 | \txkb_context_unref(plat->xkb_context);\n  256 | \txkb_keymap_unref(plat->xkb_keymap);\n  257 | \txkb_state_unref(plat->xkb_state);\n  258 | \tbfree(plat);\n  259 | }","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L252-L259"}]},
{"id":"MEM_14","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `create_encoder`, `AudioConverterNew(in, out, &ca->converter)` allocates a CoreAudio converter into `ca->converter`. If any subsequent step fails - the `STATUS_CHECK(AudioConverterSetProperty(... kAudioCodecPropertyBitRateControlMode ...))` or the `bitrate_valid()` check returning false - the function returns `false` without disposing `ca->converter`. The caller `aac_create` then loops to the next format and calls `create_encoder` again, which overwrites `ca->converter` with a fresh converter via `AudioConverterNew`, orphaning the previous one; only the final `ca->converter` is freed in `~ca_encoder`. For the common stereo 128 kbps case with `allow he-aac` enabled, `aac_formats` tries `kAudioFormatMPEG4AAC_HE_V2` and `kAudioFormatMPEG4AAC_HE` first; those typically do not support 128 kbps so `bitrate_valid` fails and their converters leak on every encoder creation (i.e. every stream/recording start).","fix":"Dispose and null the converter before returning failure from `create_encoder`. For example, after the `AudioConverterNew` STATUS_CHECK, guard the remaining failure paths:\n```cpp\nif (!bitrate_valid(log, ca, ca->converter, bitrate)) {\n    log_to_dstr(...);\n    AudioConverterDispose(ca->converter);\n    ca->converter = nullptr;\n    return false;\n}\n```\nand likewise dispose `ca->converter` (if non-null) in the `STATUS_CHECK` failure macro used after `AudioConverterNew`.","locations":[{"ref":"plugins/coreaudio-encoder/encoder.cpp:414-425","code":"  414 | \tSTATUS_CHECK(AudioConverterNew(in, out, &ca->converter))\n  415 | \n  416 | \tSTATUS_CHECK(AudioConverterSetProperty(ca->converter, kAudioCodecPropertyBitRateControlMode,\n  417 | \t\t\t\t\t       sizeof(rate_control), &rate_control));\n  418 | \n  419 | \tif (!bitrate_valid(log, ca, ca->converter, bitrate)) {\n  420 | \t\tlog_to_dstr(log, ca,\n  421 | \t\t\t    \"Encoder does not support bitrate %u \"\n  422 | \t\t\t    \"for format %s (0x%x)\\n\",\n  423 | \t\t\t    (uint32_t)bitrate, format_id_to_str(format_id), (uint32_t)format_id);\n  424 | \t\treturn false;\n  425 | \t}","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/coreaudio-encoder/encoder.cpp#L414-L425"},{"ref":"plugins/coreaudio-encoder/encoder.cpp:512-522","code":"  512 | \tfor (UInt32 format_id : *ca->allowed_formats) {\n  513 | \t\tlog_to_dstr(log, ca.get(), \"Trying format %s (0x%x)\\n\", format_id_to_str(format_id),\n  514 | \t\t\t    (uint32_t)format_id);\n  515 | \n  516 | \t\tif (!create_encoder(log, ca.get(), &in, &out, format_id, bitrate, samplerate, rate_control)) {\n  517 | \t\t\tcontinue;\n  518 | \t\t}\n  519 | \n  520 | \t\tencoder_created = true;\n  521 | \t\tbreak;\n  522 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/coreaudio-encoder/encoder.cpp#L512-L522"}]},
{"id":"MEM_15","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `GetCurrentWindowTitle` (Linux/X11) the `data` buffer returned by `XGetWindowProperty` is never released with `XFree`, unlike `getTopLevelWindows` which does. Since this runs on every scene-switcher poll interval it leaks repeatedly. Additionally the `XGetWindowProperty` return status is ignored and `data` (initialized to `0`) is dereferenced at `if (!data[0])`; when `_NET_ACTIVE_WINDOW` is absent/query fails, `data` stays NULL and `data[0]` dereferences a null pointer, crashing the switcher thread.","fix":"Check the `XGetWindowProperty` return value and `data != nullptr` before touching `data[0]`, and call `XFree(data)` before returning (all paths).","locations":[{"ref":"plugins/frontend-tools/auto-scene-switcher-nix.cpp:170-199","code":"  170 | \tWindow *data = 0;\n  171 | \tchar *name;\n  172 | \n  173 | \tWindow rootWin = RootWindow(disp(), 0);\n  174 | \tif (!rootWin) {\n  175 | \t\treturn;\n  176 | \t}\n  177 | \n  178 | \tXGetWindowProperty(disp(), rootWin, active, 0L, ~0L, false, AnyPropertyType, &actualType, &format, &num, &bytes,\n  179 | \t\t\t   (uint8_t **)&data);\n  180 | \n  181 | \tif (!data[0]) {\n  182 | \t\treturn;\n  183 | \t}\n  184 | \tint status = XFetchName(disp(), data[0], &name);\n  185 | \n  186 | \tif (status >= Success && name != nullptr) {\n  187 | \t\tstd::string str(name);\n  188 | \t\ttitle = str;\n  189 | \t} else {\n  190 | \t\tXTextProperty xtp_new_name;\n  191 | \t\tif (XGetWMName(disp(), data[0], &xtp_new_name) != 0 && xtp_new_name.value != nullptr) {\n  192 | \t\t\tstd::string str((const char *)xtp_new_name.value);\n  193 | \t\t\ttitle = str;\n  194 | \t\t\tXFree(xtp_new_name.value);\n  195 | \t\t}\n  196 | \t}\n  197 | \n  198 | \tXFree(name);\n  199 | }","lines":30,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/frontend-tools/auto-scene-switcher-nix.cpp#L170-L199"}]},
{"id":"MEM_16","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`portal_signal_subscribe` takes a reference on the `GCancellable` with `g_object_ref(cancellable)` and stores it in `call->cancellable`, but `portal_signal_call_free` only disconnects the `cancelled` signal handler and never drops that reference. Every subscribed portal request (create-session, select-source, start, etc.) leaks one `GCancellable` reference for the life of the process.","fix":"In `portal_signal_call_free`, after disconnecting the handler, release the reference, e.g. `g_clear_object(&call->cancellable);` (which also handles the NULL case).","locations":[{"ref":"plugins/linux-pipewire/portal.c:129-139","code":"  129 | static void portal_signal_call_free(struct portal_signal_call *call)\n  130 | {\n  131 | \tif (call->signal_id)\n  132 | \t\tg_dbus_connection_signal_unsubscribe(portal_get_dbus_connection(), call->signal_id);\n  133 | \n  134 | \tif (call->cancelled_id > 0)\n  135 | \t\tg_signal_handler_disconnect(call->cancellable, call->cancelled_id);\n  136 | \n  137 | \tg_clear_pointer(&call->request_path, bfree);\n  138 | \tbfree(call);\n  139 | }","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-pipewire/portal.c#L129-L139"},{"ref":"plugins/linux-pipewire/portal.c:183-185","code":"  183 | \tcall->cancellable = cancellable ? g_object_ref(cancellable) : NULL;\n  184 | \tcall->cancelled_id = cancellable ? g_signal_connect(cancellable, \"cancelled\", G_CALLBACK(on_cancelled_cb), call)\n  185 | \t\t\t\t\t : 0;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-pipewire/portal.c#L183-L185"}]},
{"id":"MEM_17","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`CMFormatDescriptionCreate` returns a +1-retained Core Foundation object stored in `_captureInfo->sampleBufferDescription`. On every error frame a new description is created, but everywhere the field is overwritten or cleared it is set to `NULL` (or overwritten by a fresh create) without a `CFRelease`, e.g. in `updateSessionwithError:` and in the delegate callback. If a device continuously delivers an unsupported format/colorspace, one `CMFormatDescription` is leaked per frame (tens per second).","fix":"Release the previous description before overwriting/clearing it, e.g. wrap assignments in a helper that does `if (info->sampleBufferDescription) CFRelease(info->sampleBufferDescription);` before storing the new value (or `NULL`).","locations":[{"ref":"plugins/mac-avcapture/OBSAVCapture.m:1263-1264","code":" 1263 |                     CMFormatDescriptionCreate(kCFAllocatorDefault, mediaType, mediaSubType, NULL,\n 1264 |                                               &_captureInfo->sampleBufferDescription);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-avcapture/OBSAVCapture.m#L1263-L1264"},{"ref":"plugins/mac-avcapture/OBSAVCapture.m:1318-1319","code":" 1318 |                     CMFormatDescriptionCreate(kCFAllocatorDefault, mediaType, mediaSubType, NULL,\n 1319 |                                               &_captureInfo->sampleBufferDescription);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-avcapture/OBSAVCapture.m#L1318-L1319"},{"ref":"plugins/mac-avcapture/OBSAVCapture.m:1375-1376","code":" 1375 |                                 CMFormatDescriptionCreate(kCFAllocatorDefault, mediaType, mediaSubType, NULL,\n 1376 |                                                           &_captureInfo->sampleBufferDescription);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-avcapture/OBSAVCapture.m#L1375-L1376"},{"ref":"plugins/mac-avcapture/OBSAVCapture.m:594-595","code":"  594 |                 self.captureInfo->lastError = OBSAVCaptureError_NoError;\n  595 |                 self.captureInfo->sampleBufferDescription = NULL;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-avcapture/OBSAVCapture.m#L594-L595"}]},
{"id":"MEM_18","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In `vt_encode`, a pixel buffer is obtained from the session pool via `get_cached_pixel_buffer` (retain count 1). On the success path ownership is transferred to the session and released later in `sample_encoded_callback`. But on every `goto fail` after the buffer was created (`CVPixelBufferLockBaseAddress` failure, `CVPixelBufferUnlockBaseAddress` failure, or `VTCompressionSessionEncodeFrame` failure), the function `return false;` without releasing `pixbuf`. Since the encode callback is not invoked on synchronous failure, each failed frame leaks an entire `CVPixelBuffer`.","fix":"Release the pixel buffer in the failure path, guarding for NULL:\n```c\nfail:\n    if (pixbuf)\n        CFRelease(pixbuf);\n    return false;\n```\n(and set `pixbuf = NULL` after ownership is handed to `VTCompressionSessionEncodeFrame` on the success path so it is not double-released).","locations":[{"ref":"plugins/mac-videotoolbox/encoder.c:1122-1169","code":" 1122 | \tCVPixelBufferRef pixbuf = NULL;\n 1123 | \n 1124 | \tif (!get_cached_pixel_buffer(enc, &pixbuf)) {\n 1125 | \t\tVT_BLOG(LOG_ERROR, \"Unable to create pixel buffer\");\n 1126 | \t\tgoto fail;\n 1127 | \t}\n 1128 | \n 1129 | \tcode = CVPixelBufferLockBaseAddress(pixbuf, 0);\n 1130 | \tif (code != noErr) {\n 1131 | \t\tgoto fail;\n 1132 | \t}\n 1133 | \n 1134 | \tfor (int i = 0; i < MAX_AV_PLANES; i++) {\n 1135 | \t\tif (frame->data[i] == NULL)\n 1136 | \t\t\tbreak;\n 1137 | \t\tuint8_t *p = (uint8_t *)CVPixelBufferGetBaseAddressOfPlane(pixbuf, i);\n 1138 | \t\tuint8_t *f = frame->data[i];\n 1139 | \t\tsize_t plane_linesize = CVPixelBufferGetBytesPerRowOfPlane(pixbuf, i);\n 1140 | \t\tsize_t plane_height = CVPixelBufferGetHeightOfPlane(pixbuf, i);\n 1141 | \n 1142 | \t\tfor (size_t j = 0; j < plane_height; j++) {\n 1143 | \t\t\tmemcpy(p, f, frame->linesize[i]);\n 1144 | \t\t\tp += plane_linesize;\n 1145 | \t\t\tf += frame->linesize[i];\n 1146 | \t\t}\n 1147 | \t}\n 1148 | \n 1149 | \tcode = CVPixelBufferUnlockBaseAddress(pixbuf, 0);\n 1150 | \tif (code != noErr) {\n 1151 | \t\tgoto fail;\n 1152 | \t}\n 1153 | \n 1154 | \tcode = VTCompressionSessionEncodeFrame(enc->session, pixbuf, pts, dur, NULL, pixbuf, NULL);\n 1155 | \tif (code != noErr) {\n 1156 | \t\tgoto fail;\n 1157 | \t}\n 1158 | \n 1159 | \tCMSampleBufferRef buffer = (CMSampleBufferRef)CMSimpleQueueDequeue(enc->queue);\n 1160 | \n 1161 | \t// No samples waiting in the queue\n 1162 | \tif (buffer == NULL)\n 1163 | \t\treturn true;\n 1164 | \n 1165 | \t*received_packet = true;\n 1166 | \treturn parse_sample(enc, buffer, packet, off);\n 1167 | \n 1168 | fail:\n 1169 | \treturn false;","lines":48,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-videotoolbox/encoder.c#L1122-L1169"}]},
{"id":"MEM_19","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In `virtualcam_output_start` (CMIO path) the pixel buffer pool is created at line 364, but several later `return false` paths never release it (and also leak `formatDescription` and the buffer `queue`). Because OBS does not call the `stop` callback when `start` returns false, `CVPixelBufferPoolRelease(vcam->pool)` in `virtualcam_output_stop` is never reached. Reachable when the virtual camera device UID is not found (line 417), when fewer than two streams are reported (line 428), when `CMIODeviceStartStream` fails (line 442), or when `obs_output_begin_data_capture` fails (line 448). Each failed start attempt leaks a CVPixelBufferPool (and on the later paths a CMFormatDescription and CMSimpleQueue too).","fix":"Release already-acquired resources on every failure path before `return false` (release `vcam->pool`, and where applicable `vcam->formatDescription` and `vcam->queue`), or restructure with a single error label that performs the cleanup.","locations":[{"ref":"plugins/mac-virtualcam/src/obs-plugin/plugin-main.mm:364-370","code":"  364 |     CVReturn status = CVPixelBufferPoolCreate(kCFAllocatorDefault, (__bridge CFDictionaryRef) pAttr,\n  365 |                                               (__bridge CFDictionaryRef) pbAttr, &vcam->pool);\n  366 | \n  367 |     if (status != kCVReturnSuccess) {\n  368 |         blog(LOG_ERROR, \"unable to allocate pixel buffer pool (error %d)\", status);\n  369 |         return false;\n  370 |     }","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-virtualcam/src/obs-plugin/plugin-main.mm#L364-L370"},{"ref":"plugins/mac-virtualcam/src/obs-plugin/plugin-main.mm:414-442","code":"  414 |         if (!vcam->deviceID) {\n  415 |             obs_output_set_last_error(vcam->output, obs_module_text(\"Error.SystemExtension.CameraUnavailable\"));\n  416 |             return false;\n  417 |         }\n  418 | \n  419 |         address.mSelector = kCMIODevicePropertyStreams;\n  420 |         CMIOObjectGetPropertyDataSize(vcam->deviceID, &address, 0, NULL, &size);\n  421 |         NSMutableData *streamIds = [NSMutableData dataWithLength:size];\n  422 |         void *stream_data = [streamIds mutableBytes];\n  423 |         CMIOObjectGetPropertyData(vcam->deviceID, &address, 0, NULL, size, &used, stream_data);\n  424 | \n  425 |         if (size < (2 * sizeof(CMIOStreamID))) {\n  426 |             obs_output_set_last_error(vcam->output, obs_module_text(\"Error.SystemExtension.CameraNotStarted\"));\n  427 |             return false;\n  428 |         }\n  429 |         [streamIds getBytes:&vcam->streamID range:NSMakeRange(sizeof(CMIOStreamID), sizeof(CMIOStreamID))];\n  430 | \n  431 |         CMIOStreamCopyBufferQueue(\n  432 |             vcam->streamID, [](CMIOStreamID, void *, void *) {\n  433 |             }, NULL, &vcam->queue);\n  434 |         CMVideoFormatDescriptionCreate(kCFAllocatorDefault, video_format, vcam->videoInfo.output_width,\n  435 |                                        vcam->videoInfo.output_height, NULL, &vcam->formatDescription);\n  436 | \n  437 |         OSStatus result = CMIODeviceStartStream(vcam->deviceID, vcam->streamID);\n  438 | \n  439 |         if (result != noErr) {\n  440 |             obs_output_set_last_error(vcam->output, obs_module_text(\"Error.SystemExtension.CameraNotStarted\"));\n  441 |             return false;\n  442 |         }","lines":29,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-virtualcam/src/obs-plugin/plugin-main.mm#L414-L442"},{"ref":"plugins/mac-virtualcam/src/obs-plugin/plugin-main.mm:447-449","code":"  447 |     if (!obs_output_begin_data_capture(vcam->output, 0)) {\n  448 |         return false;\n  449 |     }","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08
