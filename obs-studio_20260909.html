{"id":"MEM_20","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `copy_frame`, host memory is page-locked with `cu->cuMemHostRegister` using the `CU_CHECK` macro (which jumps to the `unmap:` label to unregister the memory and pop the CUDA context on error), but every subsequent `cu->cuMemcpy2D(&m)` call uses `CU_FAILED`, which does `return false` immediately. If any `cuMemcpy2D` fails after the host memory has been registered, control never reaches the `unmap:` label, so `cu->cuMemHostUnregister` is never called (the frame buffers stay page-locked forever) and `cu->cuCtxPopCurrent(NULL)` is never called (the CUDA context stack is left imbalanced, likely breaking all subsequent encodes on this thread). All the `cuMemcpy2D` calls in this function have the same defect.","fix":"Use `CU_CHECK` (goto `unmap`) instead of `CU_FAILED` for the copy calls so cleanup runs, e.g. change\n```c\nCU_FAILED(cu->cuMemcpy2D(&m))\n```\nto\n```c\nCU_CHECK(cu->cuMemcpy2D(&m))\n```\nfor each of the `cuMemcpy2D` invocations (lines 237, 243, 253, 259, 267, 272, 277).","locations":[{"ref":"plugins/obs-nvenc/nvenc-cuda.c:232-278","code":"  232 | \t\tCU_CHECK(cu->cuMemHostRegister(frame->data[0], frame->linesize[0] * height, 0))\n  233 | \t\tCU_CHECK(cu->cuMemHostRegister(frame->data[1], frame->linesize[1] * height / 2, 0))\n  234 | \n  235 | \t\tm.srcPitch = frame->linesize[0];\n  236 | \t\tm.srcHost = frame->data[0];\n  237 | \t\tCU_FAILED(cu->cuMemcpy2D(&m))\n  238 | \n  239 | \t\tm.srcPitch = frame->linesize[1];\n  240 | \t\tm.srcHost = frame->data[1];\n  241 | \t\tm.dstY += height;\n  242 | \t\tm.Height /= 2;\n  243 | \t\tCU_FAILED(cu->cuMemcpy2D(&m))\n  244 | \t} else if (enc->surface_format == NV_ENC_BUFFER_FORMAT_YUV420_10BIT) {\n  245 | \t\tCU_CHECK(cu->cuMemHostRegister(frame->data[0], frame->linesize[0] * height, 0))\n  246 | \t\tCU_CHECK(cu->cuMemHostRegister(frame->data[1], frame->linesize[1] * height / 2, 0))\n  247 | \n  248 | \t\t// P010 lines are double the size (16 bit per pixel)\n  249 | \t\tm.WidthInBytes *= 2;\n  250 | \n  251 | \t\tm.srcPitch = frame->linesize[0];\n  252 | \t\tm.srcHost = frame->data[0];\n  253 | \t\tCU_FAILED(cu->cuMemcpy2D(&m))\n  254 | \n  255 | \t\tm.srcPitch = frame->linesize[1];\n  256 | \t\tm.srcHost = frame->data[1];\n  257 | \t\tm.dstY += height;\n  258 | \t\tm.Height /= 2;\n  259 | \t\tCU_FAILED(cu->cuMemcpy2D(&m))\n  260 | \t} else { // I444\n  261 | \t\tCU_CHECK(cu->cuMemHostRegister(frame->data[0], frame->linesize[0] * height, 0))\n  262 | \t\tCU_CHECK(cu->cuMemHostRegister(frame->data[1], frame->linesize[1] * height, 0))\n  263 | \t\tCU_CHECK(cu->cuMemHostRegister(frame->data[2], frame->linesize[2] * height, 0))\n  264 | \n  265 | \t\tm.srcPitch = frame->linesize[0];\n  266 | \t\tm.srcHost = frame->data[0];\n  267 | \t\tCU_FAILED(cu->cuMemcpy2D(&m))\n  268 | \n  269 | \t\tm.srcPitch = frame->linesize[1];\n  270 | \t\tm.srcHost = frame->data[1];\n  271 | \t\tm.dstY += height;\n  272 | \t\tCU_FAILED(cu->cuMemcpy2D(&m))\n  273 | \n  274 | \t\tm.srcPitch = frame->linesize[2];\n  275 | \t\tm.srcHost = frame->data[2];\n  276 | \t\tm.dstY += height;\n  277 | \t\tCU_FAILED(cu->cuMemcpy2D(&m))\n  278 | \t}","lines":47,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-nvenc/nvenc-cuda.c#L232-L278"}]},
{"id":"MEM_21","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In `QSV_Encoder_Internal::ClearData()` the per-surface `Data.Y` buffers and the per-task `mfxBS.Data` buffers are freed with scalar `delete` even though they were allocated with array `new[]`. In `AllocateSurfaces()` the system-memory path does `mfxU8 *pSurface = (mfxU8 *)new mfxU8[surfaceSize]; ... m_pmfxSurfaces[i]->Data.Y = pSurface;` (line 527) and `InitBitstream()` does `m_pTaskPool[i].mfxBS.Data = new mfxU8[...]` (line 614), but `ClearData()` frees them via `delete m_pmfxSurfaces[i]->Data.Y;` (line 901) and `delete m_pTaskPool[i].mfxBS.Data;` (line 911). Mismatched `new[]`/`delete` is undefined behavior (heap corruption / partial free) on many allocators. Note the same buffer type `m_outBitstream.Data` is correctly freed with `delete[]` at line 917, confirming the intent.","fix":"Use array delete to match the array new:\n```cpp\ndelete[] m_pmfxSurfaces[i]->Data.Y;\n...\ndelete[] m_pTaskPool[i].mfxBS.Data;\n```","locations":[{"ref":"plugins/obs-qsv11/QSV_Encoder_Internal.cpp:901","code":"  901 | \t\t\t\tdelete m_pmfxSurfaces[i]->Data.Y;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/QSV_Encoder_Internal.cpp#L901"},{"ref":"plugins/obs-qsv11/QSV_Encoder_Internal.cpp:911","code":"  911 | \t\t\tdelete m_pTaskPool[i].mfxBS.Data;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/QSV_Encoder_Internal.cpp#L911"}]},
{"id":"MEM_22","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `oss_create`, once `handle->device` has been assigned with `bstrdup`, the failure paths for `oss_setup_device` (line 365-367) and `oss_start_reader` (line 368-372) `goto failed_state`, which only calls `bfree(handle)` and never frees `handle->device`. Opening a busy/wrong DSP device is a common failure, so this leaks the device string on every failed source creation. (Note the sibling `oss_update` does free `handle->device` in its `failed_state`, confirming the intent.)","fix":"Free the device string in the create failure path:\n```c\nfailed_state:\n\tbfree(handle->device);\n\tbfree(handle);\n\treturn NULL;\n```","locations":[{"ref":"plugins/oss-audio/oss-input.c:355-378","code":"  355 | \t\thandle->device = bstrdup(custom_dsp);\n  356 | \t} else\n  357 | \t\thandle->device = bstrdup(dsp);\n  358 | \tif (handle->device == NULL)\n  359 | \t\tgoto failed_state;\n  360 | \n  361 | \thandle->channels = obs_data_get_int(settings, OBS_PROPS_CHANNELS);\n  362 | \thandle->rate = obs_data_get_int(settings, OBS_PROPS_RATE);\n  363 | \thandle->sample_fmt = obs_data_get_int(settings, OBS_PROPS_SAMPLE_FMT);\n  364 | \n  365 | \tint err = oss_setup_device(handle);\n  366 | \tif (err)\n  367 | \t\tgoto failed_state;\n  368 | \terr = oss_start_reader(handle);\n  369 | \tif (err) {\n  370 | \t\toss_close_device(handle);\n  371 | \t\tgoto failed_state;\n  372 | \t}\n  373 | \n  374 | \treturn handle;\n  375 | \n  376 | failed_state:\n  377 | \tbfree(handle);\n  378 | \treturn NULL;","lines":24,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/oss-audio/oss-input.c#L355-L378"}]},
{"id":"MEM_23","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In the macOS `VerifySignature`, `CFErrorRef errRef;` is declared uninitialized and passed to `SecKeyVerifySignature`. When verification fails the API allocates a `CFError` and stores it in `errRef`; the caller owns that object but it is never `CFRelease`d, leaking a `CFError` on every failed signature verification. Additionally, `errRef` is never inspected. (Minor related concern: `CFArrayGetValueAtIndex(items, 0)` assumes at least one imported item.)","fix":"Initialize `CFErrorRef errRef = nullptr;` and after the call do `if (errRef) CFRelease(errRef);` before returning.","locations":[{"ref":"frontend/utility/crypto-helpers-mac.mm:22-27","code":"   22 |     CFErrorRef errRef;\n   23 |     bool result = SecKeyVerifySignature(pubKeyRef, kSecKeyAlgorithmRSASignatureMessagePKCS1v15SHA512,\n   24 |                                         (__bridge CFDataRef) signedData, (__bridge CFDataRef) signature, &errRef);\n   25 | \n   26 |     CFRelease(items);\n   27 |     return result;","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/crypto-helpers-mac.mm#L22-L27"}]},
{"id":"MEM_24","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In `device_create`, the `fail:` path does `bfree(device)` without calling `gl_platform_destroy(device->plat)`. If initialization fails after `gl_platform_create` succeeds (e.g. `gl_init_extensions` returns false), the platform context (NSOpenGLContext / EGL platform) and its resources are leaked.","fix":"In the `fail` path, destroy the platform if it was created before freeing the device: `if (device->plat) gl_platform_destroy(device->plat);` prior to `bfree(device);` (and release `raw_load_sampler`/`empty_vao` if they were created).","locations":[{"ref":"libobs-opengl/gl-subsystem.c:271-324","code":"  271 | \tdevice->plat = gl_platform_create(device, adapter);\n  272 | \tif (!device->plat)\n  273 | \t\tgoto fail;\n  274 | \n  275 | \tconst char *glVendor = (const char *)glGetString(GL_VENDOR);\n  276 | \tconst char *glRenderer = (const char *)glGetString(GL_RENDERER);\n  277 | \n  278 | \tblog(LOG_INFO, \"Loading up OpenGL on adapter %s %s\", glVendor, glRenderer);\n  279 | \n  280 | \tif (!gl_init_extensions(device)) {\n  281 | \t\terrorcode = GS_ERROR_NOT_SUPPORTED;\n  282 | \t\tgoto fail;\n  283 | \t}\n  284 | \n  285 | \tconst char *glVersion = (const char *)glGetString(GL_VERSION);\n  286 | \tconst char *glShadingLanguage = (const char *)glGetString(GL_SHADING_LANGUAGE_VERSION);\n  287 | \n  288 | \tblog(LOG_INFO,\n  289 | \t     \"OpenGL loaded successfully, version %s, shading \"\n  290 | \t     \"language %s\",\n  291 | \t     glVersion, glShadingLanguage);\n  292 | \n  293 | \tgl_enable(GL_CULL_FACE);\n  294 | \tgl_gen_vertex_arrays(1, &device->empty_vao);\n  295 | \n  296 | \tstruct gs_sampler_info raw_load_info;\n  297 | \traw_load_info.filter = GS_FILTER_POINT;\n  298 | \traw_load_info.address_u = GS_ADDRESS_BORDER;\n  299 | \traw_load_info.address_v = GS_ADDRESS_BORDER;\n  300 | \traw_load_info.address_w = GS_ADDRESS_BORDER;\n  301 | \traw_load_info.max_anisotropy = 1;\n  302 | \traw_load_info.border_color = 0;\n  303 | \tdevice->raw_load_sampler = device_samplerstate_create(device, &raw_load_info);\n  304 | \n  305 | \tgl_clear_context(device);\n  306 | \tdevice->cur_swap = NULL;\n  307 | \n  308 | #ifdef _WIN32\n  309 | \tblog(LOG_INFO, \"Warning: The OpenGL renderer is currently in use.  \"\n  310 | \t\t       \"On windows, the OpenGL renderer can decrease \"\n  311 | \t\t       \"capture performance due to the lack of specific \"\n  312 | \t\t       \"features used to maximize capture performance.  \"\n  313 | \t\t       \"The Direct3D 11 renderer is recommended instead.\");\n  314 | #endif\n  315 | \n  316 | \t*p_device = device;\n  317 | \treturn GS_SUCCESS;\n  318 | \n  319 | fail:\n  320 | \tblog(LOG_ERROR, \"device_create (GL) failed\");\n  321 | \tbfree(device);\n  322 | \n  323 | \t*p_device = NULL;\n  324 | \treturn errorcode;","lines":54,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-subsystem.c#L271-L324"}]},
{"id":"MEM_25","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In `create_buffers`, when `gl_create_buffer` for a texcoord array fails partway (e.g. `gl_gen_buffers` succeeded but `glBufferData` failed), the function returns false without pushing the freshly generated `tex_buffer` into `vb->uv_buffers`. `gs_vertexbuffer_destroy` only deletes buffers tracked in `uv_buffers`, so that one GL buffer object is leaked. The named buffers (`normal_buffer` etc.) are stored on the struct and get cleaned up, but the loop-local `tex_buffer` is not.","fix":"Push the buffer id into `vb->uv_buffers` immediately after `gl_gen_buffers` (or track/delete it on the failure path) so cleanup can delete a partially-created texcoord buffer.","locations":[{"ref":"libobs-opengl/gl-vertexbuffer.c:51-61","code":"   51 | \tfor (i = 0; i < vb->data->num_tex; i++) {\n   52 | \t\tGLuint tex_buffer;\n   53 | \t\tstruct gs_tvertarray *tv = vb->data->tvarray + i;\n   54 | \t\tsize_t size = vb->data->num * sizeof(float) * tv->width;\n   55 | \n   56 | \t\tif (!gl_create_buffer(GL_ARRAY_BUFFER, &tex_buffer, size, tv->array, usage))\n   57 | \t\t\treturn false;\n   58 | \n   59 | \t\tda_push_back(vb->uv_buffers, &tex_buffer);\n   60 | \t\tda_push_back(vb->uv_sizes, &tv->width);\n   61 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-vertexbuffer.c#L51-L61"}]},
{"id":"MEM_26","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `gl_x11_egl_platform_create`, if `gl_context_create` succeeds (which initializes and stores `plat->edisplay`) but the subsequent `eglMakeCurrent` fails, control jumps to `fail_make_current` which calls `gl_context_destroy(plat)` (only `eglDestroyContext`) but never calls `eglTerminate(plat->edisplay)`. The EGL display connection is leaked. The normal `gl_x11_egl_platform_destroy` path does call `eglTerminate`.","fix":"Add `eglTerminate(plat->edisplay);` on the `fail_make_current` path after `gl_context_destroy(plat)` (or restructure the fail labels so the display is terminated before `bfree(plat)`).","locations":[{"ref":"libobs-opengl/gl-x11-egl.c:336-378","code":"  336 | \tif (!eglMakeCurrent(plat->edisplay, plat->pbuffer, plat->pbuffer, plat->context)) {\n  337 | \t\tblog(LOG_ERROR, \"Failed to make context current: %s\", get_egl_error_string());\n  338 | \t\tgoto fail_make_current;\n  339 | \t}\n  340 | \n  341 | \tif (!gladLoadGL()) {\n  342 | \t\tblog(LOG_ERROR, \"Failed to load OpenGL entry functions.\");\n  343 | \t\tgoto fail_load_gl;\n  344 | \t}\n  345 | \n  346 | \tplat->drm_fd = get_drm_render_node_fd(plat->edisplay);\n  347 | \tif (plat->drm_fd < 0) {\n  348 | \t\tblog(LOG_WARNING, \"Unable to open DRM render node.\");\n  349 | \t}\n  350 | \n  351 | \tgoto success;\n  352 | \n  353 | fail_make_current:\n  354 | \tgl_context_destroy(plat);\n  355 | fail_context_create:\n  356 | fail_load_gl:\n  357 | \tif (plat->close_xdisplay)\n  358 | \t\tXCloseDisplay(plat->xdisplay);\n  359 | fail_display_open:\n  360 | \tbfree(plat);\n  361 | \tplat = NULL;\n  362 | success:\n  363 | \tUNUSED_PARAMETER(adapter);\n  364 | \treturn plat;\n  365 | }\n  366 | \n  367 | static void gl_x11_egl_platform_destroy(struct gl_platform *plat)\n  368 | {\n  369 | \tif (!plat)\n  370 | \t\treturn;\n  371 | \n  372 | \tgl_context_destroy(plat);\n  373 | \teglTerminate(plat->edisplay);\n  374 | \tif (plat->close_xdisplay)\n  375 | \t\tXCloseDisplay(plat->xdisplay);\n  376 | \tclose_drm_render_node_fd(plat->drm_fd);\n  377 | \tbfree(plat);\n  378 | }","lines":43,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-x11-egl.c#L336-L378"}]},
{"id":"MEM_27","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`pulseaudio-enum-devices.c`: `obs_enum_audio_monitoring_devices` calls `pulseaudio_init()` then `pulseaudio_get_sink_info_list()`. If `pulseaudio_get_sink_info_list` returns early due to context not being ready (returns -1), `pulseaudio_unref` is still called and the `ecb` struct is freed. However, if `pulseaudio_init` itself fails partially (the mainloop starts but context fails), there is no error return from `pulseaudio_init` (it always returns 0) so the caller cannot distinguish failure. This is a design-level issue in the wrapper, but in the enum-devices code the `ecb` struct is `bzalloc`'d and freed regardless of whether the operation succeeded, which is correct. No leak here in the happy path.\n\nHowever, in `pulseaudio-output.c`, `audio_monitor_free` calls `pulseaudio_unref()` unconditionally even when `monitor->ignore` is true via an early return at line 461. The early return on line 462 means `pulseaudio_unref` is NOT called in the ignore case. But `audio_monitor_init` calls `pulseaudio_init()` only when `monitor->ignore` is false (after line 372). So the balance is correct only in the normal path. However, if `audio_monitor_init` returns early after `pulseaudio_init()` but before successfully creating the stream (e.g., `pulseaudio_connect_playback` fails at line 440), `audio_monitor_free` is called on `monitor` (the stack copy), which would then call `pulseaudio_unref()` correctly since `monitor->ignore` is false. This path seems balanced.","fix":"No immediate action required for the balanced paths, but add a comment documenting that `pulseaudio_unref` in `audio_monitor_free` matches the `pulseaudio_init` in `audio_monitor_init`, and that the `ignore` early-return skips both.","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-output.c:459-475","code":"  459 | static inline void audio_monitor_free(struct audio_monitor *monitor)\n  460 | {\n  461 | \tif (monitor->ignore)\n  462 | \t\treturn;\n  463 | \n  464 | \tif (monitor->source)\n  465 | \t\tobs_source_remove_audio_capture_callback(monitor->source, on_audio_playback, monitor);\n  466 | \n  467 | \taudio_resampler_destroy(monitor->resampler);\n  468 | \tdeque_free(&monitor->new_data);\n  469 | \n  470 | \tif (monitor->stream)\n  471 | \t\tpulseaudio_stop_playback(monitor);\n  472 | \tpulseaudio_unref();\n  473 | \n  474 | \tbfree(monitor->device);\n  475 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/pulse/pulseaudio-output.c#L459-L475"}]},
{"id":"MEM_28","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `obs-canvas.c::obs_canvas_create_internal`, if `obs_context_data_init`\nreturns false (line 145), the function returns NULL but the canvas struct\nallocated with `bzalloc` at line 141 is never freed. The canvas pointer is\nsimply returned as NULL after the `obs_context_data_init` failure without\ncalling `bfree(canvas)`.","fix":"Free the canvas allocation on init failure:\n\n```c\nif (!obs_context_data_init(&canvas->context, OBS_OBJ_TYPE_CANVAS, NULL, name, uuid, NULL, private)) {\n    bfree(canvas);\n    return NULL;\n}\n```","locations":[{"ref":"libobs/obs-canvas.c:141-154","code":"  141 | \tstruct obs_canvas *canvas = bzalloc(sizeof(struct obs_canvas));\n  142 | \tcanvas->flags = flags;\n  143 | \n  144 | \tif (!obs_context_data_init(&canvas->context, OBS_OBJ_TYPE_CANVAS, NULL, name, uuid, NULL, private))\n  145 | \t\treturn NULL;\n  146 | \n  147 | \tif (!signal_handler_add_array(canvas->context.signals, canvas_signals)) {\n  148 | \t\tobs_context_data_free(&canvas->context);\n  149 | \t\tbfree(canvas);\n  150 | \t\treturn NULL;\n  151 | \t}\n  152 | \n  153 | \tif (pthread_mutex_init_recursive(&canvas->sources_mutex) != 0) {\n  154 | \t\tobs_context_data_free(&canvas->context);","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-canvas.c#L141-L154"}]},
{"id":"MEM_29","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `obs-canvas.c::obs_canvas_create_internal`, if `pthread_mutex_init_recursive`\nfails (line 153), `obs_context_data_free` is called and then `bfree(canvas)`,\nbut the signal handler array was successfully added to `canvas->context.signals`\nby the preceding `signal_handler_add_array` call (line 147). `obs_context_data_free`\nshould free the signal handler, so this is likely not a leak per se - but\n`canvas->view` was NOT yet initialized at that point (init happens at line 159),\nso `obs_view_free` is not called. If `obs_context_data_free` somehow leaves\nresidual state that references the view, that could be a problem. In practice\nthis path is correct since `obs_view_init` has not run yet. No actual leak.\n\nHowever: if `signal_handler_add_array` at line 147 fails, the code calls\n`obs_context_data_free` then `bfree(canvas)` and returns NULL. At this point\n`canvas->sources_mutex` was never initialized, so calling\n`pthread_mutex_destroy` on it in `obs_canvas_destroy` (if somehow reached)\nwould be UB. The early-return paths skip `obs_context_init_control` so the\nweak ref is never set up, and `obs_canvas_destroy` won't be called. This is\nsafe but fragile.","fix":"Add a comment clarifying that the early-return cleanup paths do not call `obs_canvas_destroy` and therefore do not require the mutex or view to be initialized.","locations":[{"ref":"libobs/obs-canvas.c:147-157","code":"  147 | \tif (!signal_handler_add_array(canvas->context.signals, canvas_signals)) {\n  148 | \t\tobs_context_data_free(&canvas->context);\n  149 | \t\tbfree(canvas);\n  150 | \t\treturn NULL;\n  151 | \t}\n  152 | \n  153 | \tif (pthread_mutex_init_recursive(&canvas->sources_mutex) != 0) {\n  154 | \t\tobs_context_data_free(&canvas->context);\n  155 | \t\tbfree(canvas);\n  156 | \t\treturn NULL;\n  157 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-canvas.c#L147-L157"}]},
{"id":"MEM_30","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"All four `obs_module_add_*` functions (`obs_module_add_source`, `obs_module_add_output`, `obs_module_add_encoder`, `obs_module_add_service`) call `bstrdup(id)` unconditionally before checking whether `module` is non-null. If `module` is NULL, the freshly allocated string is neither used nor freed.","fix":"Guard the `bstrdup` call with the null check:\n```c\nvoid obs_module_add_source(obs_module_t *module, const char *id)\n{\n    if (!module)\n        return;\n    char *source_id = bstrdup(id);\n    da_push_back(module->sources, &source_id);\n}\n```\nApply the same pattern to `obs_module_add_output`, `obs_module_add_encoder`, and `obs_module_add_service`.","locations":[{"ref":"libobs/obs-module.c:308-337","code":"  308 | void obs_module_add_source(obs_module_t *module, const char *id)\n  309 | {\n  310 | \tchar *source_id = bstrdup(id);\n  311 | \tif (module) {\n  312 | \t\tda_push_back(module->sources, &source_id);\n  313 | \t}\n  314 | }\n  315 | \n  316 | void obs_module_add_output(obs_module_t *module, const char *id)\n  317 | {\n  318 | \tchar *output_id = bstrdup(id);\n  319 | \tif (module) {\n  320 | \t\tda_push_back(module->outputs, &output_id);\n  321 | \t}\n  322 | }\n  323 | \n  324 | void obs_module_add_encoder(obs_module_t *module, const char *id)\n  325 | {\n  326 | \tchar *encoder_id = bstrdup(id);\n  327 | \tif (module) {\n  328 | \t\tda_push_back(module->encoders, &encoder_id);\n  329 | \t}\n  330 | }\n  331 | \n  332 | void obs_module_add_service(obs_module_t *module, const char *id)\n  333 | {\n  334 | \tchar *service_id = bstrdup(id);\n  335 | \tif (module) {\n  336 | \t\tda_push_back(module->services, &service_id);\n  337 | \t}","lines":30,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-module.c#L308-L337"}]},
{"id":"MEM_31","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In `on_registry_global_cb`, when `pw_registry_bind` fails the code frees the device with `bfree(device)`. But `camera_device_new` already allocated `device->properties` via `pw_properties_new_dict`, which `bfree` does not release, leaking a `pw_properties` object on every failed bind.","fix":"Use the proper destructor that frees `properties`:\n```c\nif (!device->proxy) {\n\tblog(LOG_WARNING, \"[camera-portal] Failed to bind device %s\", device_id);\n\tcamera_device_free(device);\n\treturn;\n}\n```","locations":[{"ref":"plugins/linux-pipewire/camera-portal.c:1000-1005","code":" 1000 | \tdevice->proxy = pw_registry_bind(registry, id, type, version, 0);\n 1001 | \tif (!device->proxy) {\n 1002 | \t\tblog(LOG_WARNING, \"[camera-portal] Failed to bind device %s\", device_id);\n 1003 | \t\tbfree(device);\n 1004 | \t\treturn;\n 1005 | \t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-pipewire/camera-portal.c#L1000-L1005"}]},
{"id":"MEM_32","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`v4l2_init_udev` uses a single `fail` label that only unlocks the mutex, so several error paths leak resources: if `eventfd()` fails the already-initialized `udev_event` is never destroyed; if `pthread_create` fails `udev_event` is leaked; if `signal_handler_create` fails the worker thread has already been started and is left running (with `udev_signalhandler == NULL`) and is never joined because `udev_refs` stays 0. These paths are rare but leak an OS event and potentially a live thread.","fix":"On each error path unwind what was already created (destroy `udev_event`, signal+join the thread, close the eventfd) before `goto fail`, or use staged cleanup labels.","locations":[{"ref":"plugins/linux-v4l2/v4l2-udev.c:152-178","code":"  152 | void v4l2_init_udev(void)\n  153 | {\n  154 | \tpthread_mutex_lock(&udev_mutex);\n  155 | \n  156 | \t/* set up udev */\n  157 | \tif (udev_refs == 0) {\n  158 | \t\tif (os_event_init(&udev_event, OS_EVENT_TYPE_MANUAL) != 0)\n  159 | \t\t\tgoto fail;\n  160 | \t\tif ((udev_event_fd = eventfd(0, EFD_CLOEXEC)) < 0)\n  161 | \t\t\tgoto fail;\n  162 | \t\tif (pthread_create(&udev_thread, NULL, udev_event_thread, NULL) != 0) {\n  163 | \t\t\tclose(udev_event_fd);\n  164 | \t\t\tgoto fail;\n  165 | \t\t}\n  166 | \n  167 | \t\tudev_signalhandler = signal_handler_create();\n  168 | \t\tif (!udev_signalhandler) {\n  169 | \t\t\tclose(udev_event_fd);\n  170 | \t\t\tgoto fail;\n  171 | \t\t}\n  172 | \t\tsignal_handler_add_array(udev_signalhandler, udev_signals);\n  173 | \t}\n  174 | \tudev_refs++;\n  175 | \n  176 | fail:\n  177 | \tpthread_mutex_unlock(&udev_mutex);\n  178 | }","lines":27,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-v4l2/v4l2-udev.c#L152-L178"}]},
{"id":"MEM_33","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`coreaudio_set_channels` unconditionally does `ca->channel_map = bzalloc(sizeof(SInt32) * MAX_AUDIO_CHANNELS);` without freeing any previous allocation. It is called from `coreaudio_update` every time settings change with downmix disabled, so each such update leaks the previously allocated `channel_map` (it is only freed in `coreaudio_destroy`).","fix":"Free the old map before reallocating: `bfree(ca->channel_map); ca->channel_map = bzalloc(sizeof(SInt32) * MAX_AUDIO_CHANNELS);` (or reuse the existing buffer).","locations":[{"ref":"plugins/mac-capture/mac-audio.c:795-808","code":"  795 | static void coreaudio_set_channels(struct coreaudio_data *ca, obs_data_t *settings)\n  796 | {\n  797 | \tca->channel_map = bzalloc(sizeof(SInt32) * MAX_AUDIO_CHANNELS);\n  798 | \n  799 | \tchar *device_config_name = sanitize_device_name(ca->device_uid);\n  800 | \tfor (uint8_t i = 0; i < MAX_AUDIO_CHANNELS; i++) {\n  801 | \t\tchar setting_name[128];\n  802 | \t\tsnprintf(setting_name, 128, \"output-%s-%i\", device_config_name, i + 1);\n  803 | \t\tint64_t found = obs_data_has_user_value(settings, setting_name)\n  804 | \t\t\t\t\t? obs_data_get_int(settings, setting_name)\n  805 | \t\t\t\t\t: -1L;\n  806 | \t\tint64_t adjusted = found > 0 ? found - 1 : -1;\n  807 | \t\tca->channel_map[i] = (int32_t)adjusted;\n  808 | \t}","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-capture/mac-audio.c#L795-L808"},{"ref":"plugins/mac-capture/mac-audio.c:825-829","code":"  825 | \tca->enable_downmix = obs_data_get_bool(settings, \"enable_downmix\");\n  826 | \n  827 | \tif (!ca->enable_downmix) {\n  828 | \t\tcoreaudio_set_channels(ca, settings);\n  829 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-capture/mac-audio.c#L825-L829"}]},
{"id":"MEM_34","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`set_nv_model` unconditionally assigns `ng->model = buffer;` without freeing the previously allocated string. It is called once in `nvidia_audio_create` (fine) but also in the FX-swap path of `nvidia_audio_update` (line 555), where `ng->model` already holds an allocation from the previous method. Every time the user changes the method (denoiser/dereverb/etc.) the old model path string is leaked.","fix":"Free the old buffer before overwriting:\n```c\nbfree(ng->model);\nng->model = buffer;\n```","locations":[{"ref":"plugins/nv-filters/nvidia-audiofx-filter.c:484-486","code":"  484 | \tstrcpy(buffer, ng->sdk_path);\n  485 | \tstrcat(buffer, file);\n  486 | \tng->model = buffer;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-audiofx-filter.c#L484-L486"},{"ref":"plugins/nv-filters/nvidia-audiofx-filter.c:555","code":"  555 | \t\t\tset_nv_model(ng, method);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-audiofx-filter.c#L555"}]},
{"id":"MEM_35","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In `ffmpeg_mpegts_create` the failure path (`fail:`) destroys `write_mutex`, `stop_event`, and `start_stop_mutex`, but never destroys `write_sem`. If `os_sem_init(&data->write_sem, 0)` succeeds but the subsequent `pthread_mutex_init(&data->start_stop_mutex, ...)` fails, the created semaphore is leaked.","fix":"Add `os_sem_destroy(data->write_sem);` in the `fail:` cleanup block alongside the other destroy calls:\n```c\nfail:\n\tpthread_mutex_destroy(&data->write_mutex);\n\tos_event_destroy(data->stop_event);\n\tos_sem_destroy(data->write_sem);\n\tpthread_mutex_destroy(&data->start_stop_mutex);\n\tbfree(data);\n\treturn NULL;\n```","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-mpegts.c:679-694","code":"  679 | \tif (os_sem_init(&data->write_sem, 0) != 0)\n  680 | \t\tgoto fail;\n  681 | \tif (pthread_mutex_init(&data->start_stop_mutex, NULL) != 0)\n  682 | \t\tgoto fail;\n  683 | \n  684 | \tav_log_set_callback(ffmpeg_mpegts_log_callback);\n  685 | \n  686 | \tUNUSED_PARAMETER(settings);\n  687 | \treturn data;\n  688 | \n  689 | fail:\n  690 | \tpthread_mutex_destroy(&data->write_mutex);\n  691 | \tos_event_destroy(data->stop_event);\n  692 | \tpthread_mutex_destroy(&data->start_stop_mutex);\n  693 | \tbfree(data);\n  694 | \treturn NULL;","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-mpegts.c#L679-L694"}]},
{"id":"MEM_36","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In `open_output_file`, when `avformat_write_header` fails the function returns `false` without freeing `dict`. `avformat_write_header` leaves unconsumed options in `dict`, and the `av_dict_free(&dict)` call at the end is only reached on success, so the dictionary leaks on every header-write failure.","fix":"Free the dict before returning on failure:\n```c\n\tret = avformat_write_header(data->output, &dict);\n\tif (ret < 0) {\n\t\tffmpeg_log_error(LOG_WARNING, data, \"Error opening '%s': %s\", data->config.url, av_err2str(ret));\n+\t\tav_dict_free(&dict);\n\t\treturn false;\n\t}\n```","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-output.c:418-422","code":"  418 | \tret = avformat_write_header(data->output, &dict);\n  419 | \tif (ret < 0) {\n  420 | \t\tffmpeg_log_error(LOG_WARNING, data, \"Error opening '%s': %s\", data->config.url, av_err2str(ret));\n  421 | \t\treturn false;\n  422 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-output.c#L418-L422"}]},
{"id":"MEM_37","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`SRTContext` fields `localip`, `localport` (allocated via `av_strndup` in `libsrt_open`) and `smoother` are never freed on the normal close path. `libsrt_close` frees only `streamid` and `passphrase`; the `err:` path in `libsrt_open` frees `smoother`/`streamid` but not `localip`/`localport`/`passphrase`. Each SRT session therefore leaks these strings.","fix":"In `libsrt_close`, also `av_freep(&s->smoother); av_freep(&s->localip); av_freep(&s->localport);` (and free `passphrase`/`localip`/`localport` on the `err:` path of `libsrt_open`).","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-srt.h:801-806","code":"  801 | \t\tif (av_find_info_tag(buf, sizeof(buf), \"localip\", p)) {\n  802 | \t\t\ts->localip = av_strndup(buf, strlen(buf));\n  803 | \t\t}\n  804 | \t\tif (av_find_info_tag(buf, sizeof(buf), \"localport\", p)) {\n  805 | \t\t\ts->localport = av_strndup(buf, strlen(buf));\n  806 | \t\t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-srt.h#L801-L806"},{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-srt.h:884-919","code":"  884 | static int libsrt_close(URLContext *h)\n  885 | {\n  886 | \tSRTContext *s = (SRTContext *)h->priv_data;\n  887 | \tif (!s)\n  888 | \t\treturn 0;\n  889 | \tif (s->streamid)\n  890 | \t\tav_freep(&s->streamid);\n  891 | \tif (s->passphrase)\n  892 | \t\tav_freep(&s->passphrase);\n  893 | \t/* Log stream stats. */\n  894 | \tSRT_TRACEBSTATS perf = {0};\n  895 | \tsrt_bstats(s->fd, &perf, 1);\n  896 | \tblog(LOG_INFO, \"---------------------------------\");\n  897 | \tblog(LOG_INFO,\n  898 | \t     \"[obs-ffmpeg mpegts muxer / libsrt]: Session Summary\\n\"\n  899 | \t     \"\\ttime elapsed [%.1f sec]\\n\"\n  900 | \t     \"\\tmean speed [%.1f Mbp]\\n\"\n  901 | \t     \"\\ttotal bytes sent [%.1f MB]\\n\"\n  902 | \t     \"\\tbytes retransmitted [%.1f %%]\\n\"\n  903 | \t     \"\\tbytes dropped [%.1f %%]\\n\",\n  904 | \t     (double)perf.msTimeStamp / 1000.0, perf.mbpsSendRate, (double)perf.byteSentTotal / 1000000.0,\n  905 | \t     perf.byteSentTotal ? perf.byteRetransTotal / perf.byteSentTotal * 100.0 : 0,\n  906 | \t     perf.byteSentTotal ? perf.byteSndDropTotal / perf.byteSentTotal * 100.0 : 0);\n  907 | \n  908 | \tsrt_epoll_release(s->eid);\n  909 | \tint err = srt_close(s->fd);\n  910 | \tif (err < 0) {\n  911 | \t\tblog(LOG_ERROR, \"[obs-ffmpeg mpegts muxer / libsrt]: %s\", srt_getlasterror_str());\n  912 | \t\treturn -1;\n  913 | \t}\n  914 | \n  915 | \tsrt_cleanup();\n  916 | \tblog(LOG_INFO, \"[obs-ffmpeg mpegts muxer / libsrt]: SRT connection closed\");\n  917 | \n  918 | \treturn 0;\n  919 | }","lines":36,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-srt.h#L884-L919"}]},
{"id":"MEM_38","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In `vaapi_encode_tex`, if `texture->tex[i]` is unexpectedly `NULL` mid-loop, the code logs a warning, calls `obs_leave_graphics()` and `goto fail`, which only frees `surface.frame`. The already-created GPU textures `surface.textures[i..num_textures-1]` (including the current one) are never destroyed, leaking graphics resources; additionally the graphics context has already been left, so they could not be destroyed at `fail:` anyway.","fix":"Before leaving graphics on this error branch, destroy all remaining `surface.textures[i]` (or call `vaapi_destroy_surface(&surface)` while still holding the graphics lock) instead of only freeing `surface.frame`.","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c:783-813","code":"  783 | \tfor (uint32_t i = 0; i < surface.num_textures; ++i) {\n  784 | \t\tif (!texture->tex[i]) {\n  785 | \t\t\twarn(\"vaapi_encode_tex: unexpected number of textures\");\n  786 | \t\t\tobs_leave_graphics();\n  787 | \t\t\tgoto fail;\n  788 | \t\t}\n  789 | \t\tgs_copy_texture(surface.textures[i], texture->tex[i]);\n  790 | \t\tgs_texture_destroy(surface.textures[i]);\n  791 | \t}\n  792 | \n  793 | \tgs_flush();\n  794 | \n  795 | \tobs_leave_graphics();\n  796 | \n  797 | \tenc->vframe->pts = pts;\n  798 | \n  799 | \tret = av_frame_copy_props(surface.frame, enc->vframe);\n  800 | \tif (ret < 0) {\n  801 | \t\twarn(\"vaapi_encode_tex: failed to copy props to hw frame: %s\", av_err2str(ret));\n  802 | \t\tgoto fail;\n  803 | \t}\n  804 | \n  805 | \tif (!vaapi_encode_internal(enc, surface.frame, packet, received_packet))\n  806 | \t\tgoto fail;\n  807 | \n  808 | \tav_frame_free(&surface.frame);\n  809 | \treturn true;\n  810 | \n  811 | fail:\n  812 | \tav_frame_free(&surface.frame);\n  813 | \treturn false;","lines":31,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c#L783-L813"}]},
{"id":"MEM_39","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`vaapi_open_display_drm` opens the DRM device fd (`*fd = open(...)`) and, if `vaGetDisplayDRM` returns `NULL`, returns `NULL` without closing that fd. Its caller `vaapi_open_device` returns `NULL` on a `NULL` display, and the enumeration helpers (`vaapi_device_h264_supported`, `vaapi_device_av1_supported`, `vaapi_device_hevc_supported`) then return without ever calling `vaapi_close_device`, so the open file descriptor leaks. Reachable whenever `vaGetDisplayDRM` fails after a successful `open`.","fix":"Close the fd on the failure path, e.g. before `return NULL;` in the `!va_dpy` branch add `close(*fd); *fd = -1;` (or call `vaapi_close_display_drm(fd)`).","locations":[{"ref":"plugins/obs-ffmpeg/vaapi-utils.c:32-39","code":"   32 | \tva_dpy = vaGetDisplayDRM(*fd);\n   33 | \n   34 | \tif (!va_dpy) {\n   35 | \t\tblog(LOG_ERROR, \"VAAPI: Failed to initialize DRM display\");\n   36 | \t\treturn NULL;\n   37 | \t}\n   38 | \n   39 | \treturn va_dpy;","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/vaapi-utils.c#L32-L39"}]},
{"id":"MEM_40","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `mp4_output_start`, when BPM is enabled the code registers the `bpm_inject` packet callback (line 313) before opening the output file. If `buffered_file_serializer_init` then fails (line 316), the function returns `false` without calling `obs_output_remove_packet_callback(out->output, bpm_inject, NULL)` and without `bpm_destroy`, leaking the BPM registration/state on the failure path.","fix":"On the serializer-init failure path, undo the BPM registration before returning, e.g.:\n```c\nif (!buffered_file_serializer_init(...)) {\n    warn(\"Unable to open file '%s'\", out->path.array);\n    if (out->enable_bpm) {\n        obs_output_remove_packet_callback(out->output, bpm_inject, NULL);\n        bpm_destroy(out->output);\n    }\n    return false;\n}\n```","locations":[{"ref":"plugins/obs-outputs/mp4-output.c:312-320","code":"  312 | \tif (out->enable_bpm) {\n  313 | \t\tinfo(\"Enabling BPM\");\n  314 | \t\tobs_output_add_packet_callback(out->output, bpm_inject, NULL);\n  315 | \t}\n  316 | \n  317 | \tif (!buffered_file_serializer_init(&out->serializer, out->path.array, out->buffer_size, out->chunk_size)) {\n  318 | \t\twarn(\"Unable to open file '%s'\", out->path.array);\n  319 | \t\treturn false;\n  320 | \t}","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/mp4-output.c#L312-L320"}]},
{"id":"MEM_41","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"The `QSV_Encoder_Internal` constructor calls `mfxLoader loader = MFXLoad();` and `MFXCreateConfig(loader)`, then `MFXCreateSession(loader, 0, &m_session)`. On the success branch it calls `MFXClose(m_session)` and `MFXUnload(loader)` before returning (lines 116-117). But when `MFXCreateSession` returns `sts != MFX_ERR_NONE`, the function simply falls off the end without ever calling `MFXUnload(loader)`, leaking the loader (and any partially created session/config) on every failed initialization.","fix":"Add an else/cleanup path that calls `MFXUnload(loader)` (and closes the session if created) when `MFXCreateSession` fails, before returning from the constructor.","locations":[{"ref":"plugins/obs-qsv11/QSV_Encoder_Internal.cpp:113-124","code":"  113 | \tsts = MFXCreateSession(loader, 0, &m_session);\n  114 | \tif (sts == MFX_ERR_NONE) {\n  115 | \t\tMFXQueryVersion(m_session, &version);\n  116 | \t\tMFXClose(m_session);\n  117 | \t\tMFXUnload(loader);\n  118 | \n  119 | \t\tblog(LOG_INFO, \"\\tsurf:           %s\", m_bUseTexAlloc ? \"Texture\" : \"SysMem\");\n  120 | \n  121 | \t\tm_ver = version;\n  122 | \t\treturn;\n  123 | \t}\n  124 | }","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/QSV_Encoder_Internal.cpp#L113-L124"}]},
{"id":"MEM_42","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In `_simple_alloc()` several early-return error paths leak already-allocated memory. When `mids[i] = (CustomMemId *)calloc(...)` fails (line 184-186) the function returns `MFX_ERR_MEMORY_ALLOC` without freeing the outer `mids` array or the `mids[0..i-1]` entries. Likewise, failed `CreateBuffer`/`CreateTexture2D` calls (lines 210, 254, 272) return without releasing the previously created textures or freeing `mids`. Each failed allocation leaks the container and any surfaces created so far.","fix":"On each error path free the already-allocated `mids[j]` entries, release any created `ID3D11Texture2D` objects, and `free(mids)` before returning the error status (e.g. via a shared cleanup label).","locations":[{"ref":"plugins/obs-qsv11/common_directx11.cpp:177-278","code":"  177 | \tCustomMemId **mids = (CustomMemId **)calloc(request->NumFrameSuggested, sizeof(CustomMemId *));\n  178 | \tif (!mids) {\n  179 | \t\treturn MFX_ERR_MEMORY_ALLOC;\n  180 | \t}\n  181 | \n  182 | \tfor (int i = 0; i < request->NumFrameSuggested; i++) {\n  183 | \t\tmids[i] = (CustomMemId *)calloc(1, sizeof(CustomMemId));\n  184 | \t\tif (!mids[i]) {\n  185 | \t\t\treturn MFX_ERR_MEMORY_ALLOC;\n  186 | \t\t}\n  187 | \t\tmids[i]->rw = request->Type & 0xF000; // Set intended read/write operation\n  188 | \t}\n  189 | \n  190 | \trequest->Type = request->Type & 0x0FFF;\n  191 | \n  192 | \t// because P8 data (bitstream) for h264 encoder should be allocated by CreateBuffer()\n  193 | \t// but P8 data (MBData) for MPEG2 encoder should be allocated by CreateTexture2D()\n  194 | \tif (request->Info.FourCC == MFX_FOURCC_P8) {\n  195 | \t\tD3D11_BUFFER_DESC desc = {0};\n  196 | \n  197 | \t\tif (!request->NumFrameSuggested) {\n  198 | \t\t\treturn MFX_ERR_MEMORY_ALLOC;\n  199 | \t\t}\n  200 | \n  201 | \t\tdesc.ByteWidth = request->Info.Width * request->Info.Height;\n  202 | \t\tdesc.Usage = D3D11_USAGE_STAGING;\n  203 | \t\tdesc.BindFlags = 0;\n  204 | \t\tdesc.CPUAccessFlags = D3D11_CPU_ACCESS_READ;\n  205 | \t\tdesc.MiscFlags = 0;\n  206 | \t\tdesc.StructureByteStride = 0;\n  207 | \n  208 | \t\tID3D11Buffer *buffer = 0;\n  209 | \t\thRes = g_pD3D11Device->CreateBuffer(&desc, 0, &buffer);\n  210 | \t\tif (FAILED(hRes)) {\n  211 | \t\t\treturn MFX_ERR_MEMORY_ALLOC;\n  212 | \t\t}\n  213 | \n  214 | \t\tmids[0]->memId = reinterpret_cast<ID3D11Texture2D *>(buffer);\n  215 | \t} else {\n  216 | \t\tD3D11_TEXTURE2D_DESC desc = {0};\n  217 | \n  218 | \t\tdesc.Width = request->Info.Width;\n  219 | \t\tdesc.Height = request->Info.Height;\n  220 | \t\tdesc.MipLevels = 1;\n  221 | \t\tdesc.ArraySize = 1; // number of subresources is 1 in this case\n  222 | \t\tdesc.Format = format;\n  223 | \t\tdesc.SampleDesc.Count = 1;\n  224 | \t\tdesc.Usage = D3D11_USAGE_DEFAULT;\n  225 | \t\tdesc.BindFlags = D3D11_BIND_DECODER;\n  226 | \t\tdesc.MiscFlags = 0;\n  227 | \t\t//desc.MiscFlags            = D3D11_RESOURCE_MISC_SHARED;\n  228 | \n  229 | \t\tif ((MFX_MEMTYPE_FROM_VPPIN & request->Type) && (DXGI_FORMAT_B8G8R8A8_UNORM == desc.Format)) {\n  230 | \t\t\tdesc.BindFlags = D3D11_BIND_RENDER_TARGET;\n  231 | \t\t\tif (desc.ArraySize > 2) {\n  232 | \t\t\t\treturn MFX_ERR_MEMORY_ALLOC;\n  233 | \t\t\t}\n  234 | \t\t}\n  235 | \n  236 | \t\tif ((MFX_MEMTYPE_FROM_VPPOUT & request->Type) ||\n  237 | \t\t    (MFX_MEMTYPE_VIDEO_MEMORY_PROCESSOR_TARGET & request->Type)) {\n  238 | \t\t\tdesc.BindFlags = D3D11_BIND_RENDER_TARGET;\n  239 | \t\t\tif (desc.ArraySize > 2) {\n  240 | \t\t\t\treturn MFX_ERR_MEMORY_ALLOC;\n  241 | \t\t\t}\n  242 | \t\t}\n  243 | \n  244 | \t\tif (DXGI_FORMAT_P8 == desc.Format) {\n  245 | \t\t\tdesc.BindFlags = 0;\n  246 | \t\t}\n  247 | \n  248 | \t\tID3D11Texture2D *pTexture2D;\n  249 | \n  250 | \t\t// Create surface textures\n  251 | \t\tfor (size_t i = 0; i < request->NumFrameSuggested / desc.ArraySize; i++) {\n  252 | \t\t\thRes = g_pD3D11Device->CreateTexture2D(&desc, NULL, &pTexture2D);\n  253 | \n  254 | \t\t\tif (FAILED(hRes)) {\n  255 | \t\t\t\treturn MFX_ERR_MEMORY_ALLOC;\n  256 | \t\t\t}\n  257 | \n  258 | \t\t\tmids[i]->memId = pTexture2D;\n  259 | \t\t}\n  260 | \n  261 | \t\tdesc.ArraySize = 1;\n  262 | \t\tdesc.Usage = D3D11_USAGE_STAGING;\n  263 | \t\tdesc.CPUAccessFlags = D3D11_CPU_ACCESS_READ; // | D3D11_CPU_ACCESS_WRITE;\n  264 | \t\tdesc.BindFlags = 0;\n  265 | \t\tdesc.MiscFlags = 0;\n  266 | \t\t//desc.MiscFlags        = D3D11_RESOURCE_MISC_SHARED;\n  267 | \n  268 | \t\t// Create surface staging textures\n  269 | \t\tfor (size_t i = 0; i < request->NumFrameSuggested; i++) {\n  270 | \t\t\thRes = g_pD3D11Device->CreateTexture2D(&desc, NULL, &pTexture2D);\n  271 | \n  272 | \t\t\tif (FAILED(hRes)) {\n  273 | \t\t\t\treturn MFX_ERR_MEMORY_ALLOC;\n  274 | \t\t\t}\n  275 | \n  276 | \t\t\tmids[i]->memIdStage = pTexture2D;\n  277 | \t\t}\n  278 | \t}","lines":102,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/common_directx11.cpp#L177-L278"}]},
{"id":"MEM_43","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"On the error paths in `simple_alloc` (when `vaExportSurfaceHandle` fails or a texture fails to create) the function returns `MFX_ERR_MEMORY_ALLOC` without freeing the already-allocated `mids` and `surfaces` buffers, without destroying the textures created for earlier surfaces, and without destroying the VA surfaces created by `vaCreateSurfaces`. These resources leak whenever surface export/import partially fails.","fix":"On each early-return error path, free `mids`, `surfaces`, destroy any textures already created, close exported fds, and call `vaDestroySurfaces` for the surfaces created by `vaCreateSurfaces`.","locations":[{"ref":"plugins/obs-qsv11/common_utils_linux.cpp:118-152","code":"  118 | \t\tVADRMPRIMESurfaceDescriptor surfDesc = {0};\n  119 | \t\tif (vaExportSurfaceHandle(display, surfaces[i].id, VA_SURFACE_ATTRIB_MEM_TYPE_DRM_PRIME_2,\n  120 | \t\t\t\t\t  VA_EXPORT_SURFACE_READ_WRITE, &surfDesc) != VA_STATUS_SUCCESS) {\n  121 | \t\t\treturn MFX_ERR_MEMORY_ALLOC;\n  122 | \t\t}\n  123 | \n  124 | \t\tobs_enter_graphics();\n  125 | \t\t// TODO: P010 format support\n  126 | \t\tassert(surfDesc.num_objects == 1);\n  127 | \t\tint fds[4] = {0};\n  128 | \t\tuint32_t strides[4] = {0};\n  129 | \t\tuint32_t offsets[4] = {0};\n  130 | \t\tuint64_t modifiers[4] = {0};\n  131 | \t\tfds[0] = surfDesc.objects[surfDesc.layers[0].object_index[0]].fd;\n  132 | \t\tfds[1] = surfDesc.objects[surfDesc.layers[1].object_index[0]].fd;\n  133 | \t\tstrides[0] = surfDesc.layers[0].pitch[0];\n  134 | \t\tstrides[1] = surfDesc.layers[1].pitch[0];\n  135 | \t\toffsets[0] = surfDesc.layers[0].offset[0];\n  136 | \t\toffsets[1] = surfDesc.layers[1].offset[0];\n  137 | \t\tmodifiers[0] = surfDesc.objects[surfDesc.layers[0].object_index[0]].drm_format_modifier;\n  138 | \t\tmodifiers[1] = surfDesc.objects[surfDesc.layers[1].object_index[0]].drm_format_modifier;\n  139 | \ ion-stinger.c#L181-L194"}]},
{"id":"MEM_45","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `WHIPOutput::Connect` the `CURLU *url_builder` is allocated at line 493 but the two error returns inside the resource-URL block leak it: when `effective_url == nullptr` (line 516-520) and when `curl_url_get` fails (line 531-535) the code calls `doCleanup(true)` (which only frees the easy handle and header list) and returns without `curl_url_cleanup(url_builder)`. The success path frees it at line 540.","fix":"Call `curl_url_cleanup(url_builder);` before both `return false;` statements in that block (or fold it into `doCleanup`).","locations":[{"ref":"plugins/obs-webrtc/whip-output.cpp:493-540","code":"  493 | \tCURLU *url_builder = curl_url();\n  494 | \n  495 | \t// Parse Link headers to extract STUN/TURN server configuration URLs\n  496 | \tstd::vector<rtc::IceServer> iceServers;\n  497 | \tfor (auto &http_header : http_headers) {\n  498 | \t\tauto value = value_for_header(\"link\", http_header);\n  499 | \t\tif (value.empty()) {\n  500 | \t\t\tcontinue;\n  501 | \t\t}\n  502 | \n  503 | \t\t// Parse multiple links separated by ','\n  504 | \t\tfor (auto end = value.find(\",\"); end != std::string::npos; end = value.find(\",\")) {\n  505 | \t\t\tthis->ParseLinkHeader(value.substr(0, end), iceServers);\n  506 | \t\t\tvalue = value.substr(end + 1);\n  507 | \t\t}\n  508 | \t\tthis->ParseLinkHeader(value, iceServers);\n  509 | \t}\n  510 | \n  511 | \t// If Location header doesn't start with `http` it is a relative URL.\n  512 | \t// Construct a absolute URL using the host of the effective URL\n  513 | \tif (last_location_header.find(\"http\") != 0) {\n  514 | \t\tchar *effective_url = nullptr;\n  515 | \t\tcurl_easy_getinfo(c, CURLINFO_EFFECTIVE_URL, &effective_url);\n  516 | \t\tif (effective_url == nullptr) {\n  517 | \t\t\tdo_log(LOG_ERROR, \"Failed to build Resource URL\");\n  518 | \t\t\tdoCleanup(true);\n  519 | \t\t\treturn false;\n  520 | \t\t}\n  521 | \n  522 | \t\tcurl_url_set(url_builder, CURLUPART_URL, effective_url, 0);\n  523 | \t\tcurl_url_set(url_builder, CURLUPART_PATH, last_location_header.c_str(), 0);\n  524 | \t\tcurl_url_set(url_builder, CURLUPART_QUERY, \"\", 0);\n  525 | \t} else {\n  526 | \t\tcurl_url_set(url_builder, CURLUPART_URL, last_location_header.c_str(), 0);\n  527 | \t}\n  528 | \n  529 | \tchar *url = nullptr;\n  530 | \tCURLUcode rc = curl_url_get(url_builder, CURLUPART_URL, &url, CURLU_NO_DEFAULT_PORT);\n  531 | \tif (rc) {\n  532 | \t\tdo_log(LOG_ERROR, \"WHIP server provided a invalid resource URL via the Location header\");\n  533 | \t\tdoCleanup(true);\n  534 | \t\treturn false;\n  535 | \t}\n  536 | \n  537 | \tresource_url = url;\n  538 | \tcurl_free(url);\n  539 | \tdo_log(LOG_DEBUG, \"WHIP Resource URL is: %s\", resource_url.c_str());\n  540 | \tcurl_url_cleanup(url_builder);","lines":48,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-webrtc/whip-output.cpp#L493-L540"}]},
{"id":"MEM_46","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In `copy_from_mask`, `mask` is allocated by `get_bitmap_data`, but the early-return path taken when the (halved) bitmap has zero pixels returns `NULL` without freeing `mask`, leaking the buffer. Every other exit from the function frees `mask`.","fix":"```c\n\tpixels = bmp.bmHeight * bmp.bmWidth;\n\tif (!pixels) {\n\t\tbfree(mask);\n\t\treturn NULL;\n\t}\n```","locations":[{"ref":"plugins/win-capture/cursor-capture.c:104-107","code":"  104 | \tpixels = bmp.bmHeight * bmp.bmWidth;\n  105 | \tif (!pixels) {\n  106 | \t\treturn NULL;\n  107 | \t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/cursor-capture.c#L104-L107"}]},
{"id":"MEM_47","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`WASAPINotify` assigns a freshly `new`-ed `NotificationClient` (constructed with `refs = 1`) into the `ComPtr<NotificationClient> notificationClient` member using `operator=`. That operator goes through `ComPtr::Replace()`, which calls `AddRef()` on the incoming pointer, bumping the refcount to 2. `IMMDeviceEnumerator::RegisterEndpointNotificationCallback` does not take a persistent reference, and the destructor only performs a single `notificationClient.Clear()` (one `Release`), so the refcount drops to 1 and the `NotificationClient` is never deleted. The correct idiom for adopting a freshly allocated object is `ComPtr::Set()` (which does not `AddRef`). Leaks one `NotificationClient` (holding a `std::function`) per `WASAPINotify` instance.","fix":"Adopt the object without an extra AddRef, e.g.:\n```cpp\nnotificationClient.Set(new NotificationClient(std::bind(&WASAPINotify::OnDefaultDeviceChanged, this,\n\tstd::placeholders::_1, std::placeholders::_2, std::placeholders::_3)));\nenumerator->RegisterEndpointNotificationCallback(notificationClient);\n```","locations":[{"ref":"plugins/win-wasapi/wasapi-notify.cpp:64-67","code":"   64 | \t\tnotificationClient = new NotificationClient(std::bind(&WASAPINotify::OnDefaultDeviceChanged, this,\n   65 | \t\t\t\t\t\t\t\t      std::placeholders::_1, std::placeholders::_2,\n   66 | \t\t\t\t\t\t\t\t      std::placeholders::_3));\n   67 | \t\tenumerator->RegisterEndpointNotificationCallback(notificationClient);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-wasapi/wasapi-notify.cpp#L64-L67"}]},
{"id":"MEM_48","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In `process_metrics()`, the local `DARRAY(uint8_t) out_data` is allocated and filled (`da_push_back_array` for the fake refcount header and the original packet data) before the codec is known. When the packet's codec is none of h264/av1/hevc, the function falls through to `return false` at the end. On the success path `out->data` is repointed into `out_data.array` and the caller takes ownership, but the `return false` path leaves `out_data` never freed and only referenced via a repointed `out` that the caller treats as a failed injection, leaking the buffer. Also, `da_init(out_data)` output and the `data`/`sei` resources are only handled inside the per-SEI loop. This path is unlikely for real video keyframes (which are always avc/hevc/av1), so severity is low.","fix":"Free `out_data` (and avoid repointing `out`) when the codec is unrecognized, e.g. detect the unsupported-codec case early and `return false` before building `out_data`, or `da_free(out_data)` on the non-avc/hevc/av1 return path.","locations":[{"ref":"shared/bpm/bpm.c:376-473","code":"  376 | \t// Create array for the original packet data + the SEI appended data\n  377 | \tDARRAY(uint8_t) out_data;\n  378 | \tda_init(out_data);\n  379 | \n  380 | \t// Copy the original packet\n  381 | \tda_push_back_array(out_data, (uint8_t *)&ref, sizeof(ref));\n  382 | \tda_push_back_array(out_data, out->data, out->size);\n  383 | \n  384 | \t// Build the SEI metrics message payload\n  385 | \tbpm_ts_sei_render(m_track);\n  386 | \tbpm_sm_sei_render(m_track);\n  387 | \tbpm_erm_sei_render(m_track);\n  388 | \n  389 | \t// Iterate over all the BPM SEI types\n  390 | \tfor (uint8_t i = 0; i < BPM_MAX_SEI; ++i) {\n  391 | \t\t// Create and inject the syntax specific SEI messages in the bitstream if the rendering was successful\n  392 | \t\tif (m_track->sei_rendered[i]) {\n  393 | \t\t\t// Send one SEI message per NALU or OBU\n  394 | \t\t\tsei_init(&sei, 0.0);\n  395 | \n  396 | \t\t\t// Generate the formatted SEI message\n  397 | \t\t\tsei_message_t *msg = sei_message_new(sei_type_user_data_unregistered,\n  398 | \t\t\t\t\t\t\t     m_track->sei_payload[i].bytes.array,\n  399 | \t\t\t\t\t\t\t     m_track->sei_payload[i].bytes.num);\n  400 | \t\t\tsei_message_append(&sei, msg);\n  401 | \n  402 | \t\t\t// Free the SEI payload buffer in the metrics track\n  403 | \t\t\tarray_output_serializer_free(&m_track->sei_payload[i]);\n  404 | \n  405 | \t\t\t// Update for any codec specific syntax and add to the output bitstream\n  406 | \t\t\tif (avc || hevc || av1) {\n  407 | \t\t\t\tif (avc || hevc) {\n  408 | \t\t\t\t\tdata = bmalloc(sei_render_size(&sei));\n  409 | \t\t\t\t\tsize = sei_render(&sei, data);\n  410 | \t\t\t\t}\n  411 | \t\t\t\t/* In each of these specs there is an identical structure that\n  412 | \t\t\t\t * carries user private metadata. We have an AVC SEI wrapped\n  413 | \t\t\t\t * version of that here. We will strip it out and repackage\n  414 | \t\t\t\t * it slightly to fit the different codec carrying mechanisms.\n  415 | \t\t\t\t * A slightly modified SEI for HEVC and a metadata OBU for AV1.\n  416 | \t\t\t\t */\n  417 | \t\t\t\tif (avc) {\n  418 | \t\t\t\t\t/* TODO: SEI should come after AUD/SPS/PPS,\n  419 | \t\t\t\t\t * but before any VCL */\n  420 | \t\t\t\t\tda_push_back_array(out_data, nal_start, 4);\n  421 | \t\t\t\t\tda_push_back_array(out_data, data, size);\n  422 | #ifdef ENABLE_HEVC\n  423 | \t\t\t\t} else if (hevc) {\n  424 | \t\t\t\t\t/* Only first NAL (VPS/PPS/SPS) should use the 4 byte\n  425 | \t\t\t\t\t * start code. SEIs use 3 byte version */\n  426 | \t\t\t\t\tda_push_back_array(out_data, nal_start + 1, 3);\n  427 | \t\t\t\t\t/* nal_unit_header( ) {\n  428 | \t\t\t\t\t * forbidden_zero_bit       f(1)\n  429 | \t\t\t\t\t * nal_unit_type            u(6)\n  430 | \t\t\t\t\t * nuh_layer_id             u(6)\n  431 | \t\t\t\t\t * nuh_temporal_id_plus1    u(3)\n  432 | \t\t\t\t\t * }\n  433 | \t\t\t\t\t */\n  434 | \t\t\t\t\tconst uint8_t suffix_sei_nal_type = 40;\n  435 | \t\t\t\t\t/* The first bit is always 0, so we just need to\n  436 | \t\t\t\t\t * save the last bit off the original header and\n  437 | \t\t\t\t\t * add the SEI NAL type. */\n  438 | \t\t\t\t\tuint8_t first_byte = (suffix_sei_nal_type << 1) | (0x01 & hevc_nal_header[0]);\n  439 | \t\t\t\t\thevc_nal_header[0] = first_byte;\n  440 | \t\t\t\t\t/* The HEVC NAL unit header is 2 byte instead of\n  441 | \t\t\t\t\t * one, otherwise everything else is the\n  442 | \t\t\t\t\t * same. */\n  443 | \t\t\t\t\tda_push_back_array(out_data, hevc_nal_header, 2);\n  444 | \t\t\t\t\tda_push_back_array(out_data, &data[1], size - 1);\n  445 | #endif\n  446 | \t\t\t\t} else if (av1) {\n  447 | \t\t\t\t\tuint8_t *obu_buffer = NULL;\n  448 | \t\t\t\t\tsize_t obu_buffer_size = 0;\n  449 | \t\t\t\t\tsize = extract_buffer_from_sei(&sei, &data);\n  450 | \t\t\t\t\tmetadata_obu(data, size, &obu_buffer, &obu_buffer_size,\n  451 | \t\t\t\t\t\t     METADATA_TYPE_USER_PRIVATE_6);\n  452 | \t\t\t\t\tif (obu_buffer) {\n  453 | \t\t\t\t\t\tda_push_back_array(out_data, obu_buffer, obu_buffer_size);\n  454 | \t\t\t\t\t\tbfree(obu_buffer);\n  455 | \t\t\t\t\t}\n  456 | \t\t\t\t}\n  457 | \t\t\t\tif (data) {\n  458 | \t\t\t\t\tbfree(data);\n  459 | \t\t\t\t}\n  460 | \t\t\t}\n  461 | \t\t\tsei_free(&sei);\n  462 | \t\t}\n  463 | \t}\n  464 | \tobs_encoder_packet_release(out);\n  465 | \n  466 | \t*out = backup;\n  467 | \tout->data = (uint8_t *)out_data.array + sizeof(ref);\n  468 | \tout->size = out_data.num - sizeof(ref);\n  469 | \n  470 | \tif (avc || hevc || av1) {\n  471 | \t\treturn true;\n  472 | \t}\n  473 | \treturn false;","lines":98,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/bpm/bpm.c#L376-L473"}]},
{"id":"MEM_49","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"easy","description":"`RestartAsAdmin` opens a child process (`SEE_MASK_NOCLOSEPROCESS` sets `shExInfo.hProcess`) and only calls `CloseHandle(shExInfo.hProcess)` on the fall-through path. When `GetExitCodeProcess` succeeds and `exitCode == 1`, it `return exitCode;` before the `CloseHandle`, leaking the process handle. Impact is negligible because the process is exiting shortly afterward, but it is a genuine handle leak on that path.","fix":"Close the handle before returning, e.g. capture the return value, `CloseHandle(shExInfo.hProcess);` unconditionally after `GetExitCodeProcess`, then `return`.","locations":[{"ref":"frontend/updater/updater.cpp:2046-2052","code":" 2046 | \t\tif (GetExitCodeProcess(shExInfo.hProcess, &exitCode)) {\n 2047 | \t\t\tif (exitCode == 1) {\n 2048 | \t\t\t\treturn exitCode;\n 2049 | \t\t\t}\n 2050 | \t\t}\n 2051 | \t\tCloseHandle(shExInfo.hProcess);\n 2052 | \t}","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/updater/updater.cpp#L2046-L2052"}]},
{"id":"MEM_50","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"easy","description":"In `xcb_xcursor_offset_win`, the `xcb_generic_error_t *err` is reused for both `xcb_get_geometry_reply` and `xcb_translate_coordinates_reply` but is never freed. XCB error replies are heap-allocated and must be `free()`d; on the translate-coordinates failure path `err` leaks (and `coords` is used to compute the offset only when `!err`, but `err` itself is dropped).","fix":"`free(err)` on each error path (and reset `err = NULL` between the two reply calls).","locations":[{"ref":"plugins/linux-capture/xcursor-xcb.c:127-147","code":"  127 | void xcb_xcursor_offset_win(xcb_connection_t *xcb, xcb_xcursor_t *data, xcb_window_t win)\n  128 | {\n  129 | \tif (!win)\n  130 | \t\treturn;\n  131 | \n  132 | \txcb_generic_error_t *err = NULL;\n  133 | \txcb_get_geometry_cookie_t geom_cookie = xcb_get_geometry(xcb, win);\n  134 | \txcb_get_geometry_reply_t *geom = xcb_get_geometry_reply(xcb, geom_cookie, &err);\n  135 | \tif (err) {\n  136 | \t\tfree(geom);\n  137 | \t\treturn;\n  138 | \t}\n  139 | \n  140 | \txcb_translate_coordinates_cookie_t coords_cookie = xcb_translate_coordinates(xcb, win, geom->root, 0, 0);\n  141 | \txcb_translate_coordinates_reply_t *coords = xcb_translate_coordinates_reply(xcb, coords_cookie, &err);\n  142 | \tif (!err)\n  143 | \t\txcb_xcursor_offset(data, coords->dst_x, coords->dst_y);\n  144 | \n  145 | \tfree(coords);\n  146 | \tfree(geom);\n  147 | }","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-capture/xcursor-xcb.c#L127-L147"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`MAKE_SEMANTIC_VERSION` in `obs-config.h` shifts `major` left by 24 bits and\n`minor` left by 16 bits without casting to a wider type first. When the macro\narguments are `int` literals (which they are: 32, 2, 0), `32 << 24` overflows\na 32-bit signed integer (32 * 2^24 = 536870912, which fits, but for any major\nversion >= 128 the shift would set the sign bit, causing undefined behavior in\nC). While the current values are safe, the macro is a latent UB trap: any\nfuture major version >= 128 would trigger signed integer overflow.\n\nAdditionally, using `|` to pack the version creates a non-intuitive API surface.\nIf `patch` ever exceeds 0xFFFF or `minor` exceeds 0xFF, values will overlap.","fix":"Cast to `uint32_t` before shifting:\n\n```c\n#define MAKE_SEMANTIC_VERSION(major, minor, patch) (((uint32_t)(major) << 24) | ((uint32_t)(minor) << 16) | (uint32_t)(patch))\n```","locations":[{"ref":"libobs/obs-config.h:46","code":"   46 | #define MAKE_SEMANTIC_VERSION(major, minor, patch) ((major << 24) | (minor << 16) | patch)","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-config.h#L46"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In `simple_alloc` the `mids` array is meant to hold `num_surfaces` `mfxMemId` pointers plus one extra slot for the stuffed `surfaces` pointer (written at `mids[num_surfaces]`). The allocation `bmalloc(sizeof(mfxMemId) * num_surfaces + 1)` binds `*` before `+`, so it reserves only `num_surfaces` pointers plus 1 byte instead of `num_surfaces + 1` pointers. The write `mids[num_surfaces] = surfaces;` therefore overruns the buffer by 7 bytes (on 64-bit) every time the Linux QSV texture allocator runs. This is a heap buffer overflow on the main encode path.","fix":"Add parentheses so the extra slot is a full pointer:\n```c\nmfxMemId *mids = (mfxMemId *)bmalloc(sizeof(mfxMemId) * (num_surfaces + 1));\n```","locations":[{"ref":"plugins/obs-qsv11/common_utils_linux.cpp:108-111","code":"  108 | \tmfxMemId *mids = (mfxMemId *)bmalloc(sizeof(mfxMemId) * num_surfaces + 1);\n  109 | \tstruct surface_info *surfaces = (struct surface_info *)bmalloc(sizeof(struct surface_info) * num_surfaces);\n  110 | \n  111 | \tmids[num_surfaces] = surfaces; // stuff it","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/common_utils_linux.cpp#L108-L111"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`MediaControls::MoveSliderFoward` and `MediaControls::MoveSliderBackwards` both store the result of `obs_source_media_get_time(source)` — which returns `int64_t` — in a plain `int`. For media files longer than roughly 24.8 days (INT_MAX milliseconds) the assignment silently truncates the position, causing incorrect seek targets. `MoveSliderBackwards` can also produce a negative `ms` that is passed directly to `obs_source_media_set_time` without clamping.","fix":"Use `int64_t` throughout and clamp to `[0, duration]`:\n\n```cpp\nvoid MediaControls::MoveSliderFoward(int seconds)\n{\n    OBSSource source = OBSGetStrongRef(weakSource);\n    if (!source)\n        return;\n    int64_t duration = obs_source_media_get_duration(source);\n    int64_t ms = obs_source_media_get_time(source);\n    ms = std::clamp(ms + int64_t(seconds) * 1000, int64_t(0), duration);\n    obs_source_media_set_time(source, ms);\n    SetSliderPosition();\n}\n```\nApply the same pattern to `MoveSliderBackwards`.","locations":[{"ref":"frontend/components/MediaControls.cpp:467-472","code":"  467 | \tint ms = obs_source_media_get_time(source);\n  468 | \tms += seconds * 1000;\n  469 | \n  470 | \tobs_source_media_set_time(source, ms);\n  471 | \tSetSliderPosition();\n  472 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/MediaControls.cpp#L467-L472"},{"ref":"frontend/components/MediaControls.cpp:482-487","code":"  482 | \tint ms = obs_source_media_get_time(source);\n  483 | \tms -= seconds * 1000;\n  484 | \n  485 | \tobs_source_media_set_time(source, ms);\n  486 | \tSetSliderPosition();\n  487 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/MediaControls.cpp#L482-L487"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`Multiview::GetSourceByPosition` performs divisions like `(maxX - minX) / 6` (and `/3`, `/4`, `/5`) to compute which scene cell the mouse is in. If the multiview window is extremely narrow (e.g. `maxX - minX < 6`), the division result is 0 and the next division `(x - minX) / ((maxX - minX) / 6)` is a division by zero, which is undefined behaviour causing a crash. The same applies to all `(maxY - minY)` divisors in the many layout branches.","fix":"Guard each case's range computation before dividing. Example for `HORIZONTAL_TOP_18_SCENES`:\n\n```cpp\nint cols = 6, rows = 3;\nint cellW = (maxX - minX) / cols;\nint cellH = (maxY - minY) / rows;\nif (cellW == 0 || cellH == 0)\n    break;\npos = (x - minX) / cellW + ((y - minY) / cellH) * cols;\n```\nApply the same pattern to every layout branch.","locations":[{"ref":"frontend/components/Multiview.cpp:589-590","code":"  589 | \t\tpos = (x - minX) / ((maxX - minX) / 6);\n  590 | \t\tpos += ((y - minY) / ((maxY - minY) / 3)) * 6;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/Multiview.cpp#L589-L590"},{"ref":"frontend/components/Multiview.cpp:609-610","code":"  609 | \t\tpos = (x - minX) / ((maxX - minX) / 6);\n  610 | \t\tpos += ((y - minY) / ((maxY - minY) / 4)) * 6;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/Multiview.cpp#L609-L610"},{"ref":"frontend/components/Multiview.cpp:629","code":"  629 | \t\tpos = 2 * ((y - minY) / ((maxY - minY) / 4));","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/Multiview.cpp#L629"},{"ref":"frontend/components/Multiview.cpp:671","code":"  671 | \t\tpos = (x - minX) / ((maxX - minX) / 4);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/Multiview.cpp#L671"},{"ref":"frontend/components/Multiview.cpp:691-692","code":"  691 | \t\tpos = (x - minX) / ((maxX - minX) / 2);\n  692 | \t\tpos += ((y - minY) / ((maxY - minY) / 2)) * 2;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/Multiview.cpp#L691-L692"},{"ref":"frontend/components/Multiview.cpp:710-711","code":"  710 | \t\tpos = (x - minX) / ((maxX - minX) / 3);\n  711 | \t\tpos += ((y - minY) / ((maxY - minY) / 3)) * 3;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/Multiview.cpp#L710-L711"},{"ref":"frontend/components/Multiview.cpp:729-730","code":"  729 | \t\tpos = (x - minX) / ((maxX - minX) / 4);\n  730 | \t\tpos += ((y - minY) / ((maxY - minY) / 4)) * 4;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/Multiview.cpp#L729-L730"},{"ref":"frontend/components/Multiview.cpp:748-749","code":"  748 | \t\tpos = (x - minX) / ((maxX - minX) / 5);\n  749 | \t\tpos += ((y - minY) / ((maxY - minY) / 5)) * 5;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/Multiview.cpp#L748-L749"},{"ref":"frontend/components/Multiview.cpp:768-769","code":"  768 | \t\tpos = (x - minX) / ((maxX - minX) / 4);\n  769 | \t\tif (y > minY + ((maxY - minY) / 2)) {","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/Multiview.cpp#L768-L769"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `YoutubeApiWrappers::InsertCommand`, the local `long error_code;` is left uninitialized and then read at `if (error_code == 401)`. `TryInsertCommand` only writes through the `error_code` out-parameter at the very end of its body; when `token.empty()` it returns `false` early (line 77-79) *before* assigning `*error_code`. In that case `InsertCommand` reads an uninitialized `error_code`, which is undefined behavior and may spuriously trigger `UpdateAccessToken()` (if garbage happens to equal 401) or skip a legitimate retry. This path is reachable whenever the OAuth token has not yet been obtained or was cleared.","fix":"Initialize the variable and/or always set `*error_code` early in `TryInsertCommand`. Simplest: change `long error_code;` to `long error_code = 0;` in `InsertCommand`.","locations":[{"ref":"frontend/utility/YoutubeApiWrappers.cpp:139-142","code":"  139 | \tlong error_code;\n  140 | \tbool success = TryInsertCommand(url, content_type, request_type, data, json_out, &error_code, data_size);\n  141 | \n  142 | \tif (error_code == 401) {","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/YoutubeApiWrappers.cpp#L139-L142"},{"ref":"frontend/utility/YoutubeApiWrappers.cpp:77-88","code":"   77 | \tif (token.empty()) {\n   78 | \t\treturn false;\n   79 | \t}\n   80 | \tstd::string output;\n   81 | \tstd::string error;\n   82 | \t// Increase timeout by the time it takes to transfer `data_size` at 1 Mbps\n   83 | \tint timeout = 60 + data_size / 125000;\n   84 | \tbool success = GetRemoteFile(url, output, error, &httpStatusCode, content_type, request_type, data,\n   85 | \t\t\t\t     {\"Authorization: Bearer \" + token}, nullptr, timeout, false, data_size);\n   86 | \tif (error_code) {\n   87 | \t\t*error_code = httpStatusCode;\n   88 | \t}","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/YoutubeApiWrappers.cpp#L77-L88"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `obs_encoder_add_roi`, the validity check for the ROI rectangle uses unsigned subtraction:\n`roi->bottom - roi->top < 16` and `roi->right - roi->left < 16`. Both fields are `uint32_t`.\nIf `bottom < top` or `right < left` (inverted coordinates), the subtraction wraps around to a\nvery large unsigned value, which is never less than 16. The check therefore passes for\ngeometrically invalid ROIs (inverted rectangles), allowing malformed ROI data to be pushed to\nthe encoder and potentially misinterpreted by hardware encoder APIs.","fix":"Add explicit bounds checks before the size checks:\n```c\nif (roi->bottom <= roi->top || roi->right <= roi->left)\n\treturn false;\nif (roi->bottom - roi->top < 16 || roi->right - roi->left < 16)\n\treturn false;\n```","locations":[{"ref":"libobs/obs-encoder.c:2104-2107","code":" 2104 | \t/* Area smaller than the smallest possible block (16x16) */\n 2105 | \tif (roi->bottom - roi->top < 16 || roi->right - roi->left < 16)\n 2106 | \t\treturn false;\n 2107 | \t/* Other invalid ROIs */","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L2104-L2107"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`HandleCaptionPacket` reads `cc_count` (5 bits, up to 31) from an externally supplied SDI ancillary packet and then `memcpy(outData, anc + reader.pos, cc_count * 3)` without verifying that `reader.pos + cc_count * 3 <= size`. A malformed/short caption packet causes an out-of-bounds read of up to ~93 bytes past the packet buffer (and `bitstream_reader` reads beyond the buffer are not bounds-checked either).","fix":"Before the `memcpy`, validate bounds: `if ((size_t)reader.pos + (size_t)cc_count * 3 > size) return;` (and generally guard the bitstream reads against `size`).","locations":[{"ref":"plugins/decklink/decklink-device-instance.cpp:252-336","code":"  252 | void DeckLinkDeviceInstance::HandleCaptionPacket(IDeckLinkAncillaryPacket *packet, const uint64_t timestamp)\n  253 | {\n  254 | \tconst void *data;\n  255 | \tuint32_t size;\n  256 | \tpacket->GetBytes(bmdAncillaryPacketFormatUInt8, &data, &size);\n  257 | \n  258 | \tauto anc = (uint8_t *)data;\n  259 | \tstruct bitstream_reader reader;\n  260 | \tbitstream_reader_init(&reader, anc, size);\n  261 | \n  262 | \t// header1\n  263 | \tbitstream_reader_r8(&reader);\n  264 | \t// header2\n  265 | \tbitstream_reader_r8(&reader);\n  266 | \n  267 | \t// length\n  268 | \tbitstream_reader_r8(&reader);\n  269 | \t// frameRate\n  270 | \tbitstream_reader_read_bits(&reader, 4);\n  271 | \t//reserved\n  272 | \tbitstream_reader_read_bits(&reader, 4);\n  273 | \n  274 | \tauto cdp_timecode_added = bitstream_reader_read_bits(&reader, 1);\n  275 | \t// cdp_data_block_added\n  276 | \tbitstream_reader_read_bits(&reader, 1);\n  277 | \t// cdp_service_info_added\n  278 | \tbitstream_reader_read_bits(&reader, 1);\n  279 | \t// cdp_service_info_start\n  280 | \tbitstream_reader_read_bits(&reader, 1);\n  281 | \t// cdp_service_info_changed\n  282 | \tbitstream_reader_read_bits(&reader, 1);\n  283 | \t// cdp_service_info_end\n  284 | \tbitstream_reader_read_bits(&reader, 1);\n  285 | \tauto cdp_contains_captions = bitstream_reader_read_bits(&reader, 1);\n  286 | \t//reserved\n  287 | \tbitstream_reader_read_bits(&reader, 1);\n  288 | \n  289 | \t// cdp_counter\n  290 | \tbitstream_reader_r8(&reader);\n  291 | \t// cdp_counter2\n  292 | \tbitstream_reader_r8(&reader);\n  293 | \n  294 | \tif (cdp_timecode_added) {\n  295 | \t\t// timecodeSectionID\n  296 | \t\tbitstream_reader_r8(&reader);\n  297 | \t\t//reserved\n  298 | \t\tbitstream_reader_read_bits(&reader, 2);\n  299 | \t\tbitstream_reader_read_bits(&reader, 2);\n  300 | \t\tbitstream_reader_read_bits(&reader, 4);\n  301 | \t\t// reserved\n  302 | \t\tbitstream_reader_read_bits(&reader, 1);\n  303 | \t\tbitstream_reader_read_bits(&reader, 3);\n  304 | \t\tbitstream_reader_read_bits(&reader, 4);\n  305 | \t\tbitstream_reader_read_bits(&reader, 1);\n  306 | \t\tbitstream_reader_read_bits(&reader, 3);\n  307 | \t\tbitstream_reader_read_bits(&reader, 4);\n  308 | \t\tbitstream_reader_read_bits(&reader, 1);\n  309 | \t\tbitstream_reader_read_bits(&reader, 1);\n  310 | \t\tbitstream_reader_read_bits(&reader, 3);\n  311 | \t\tbitstream_reader_read_bits(&reader, 4);\n  312 | \t}\n  313 | \n  314 | \tif (cdp_contains_captions) {\n  315 | \t\t// cdp_data_section\n  316 | \t\tbitstream_reader_r8(&reader);\n  317 | \n  318 | \t\t//process_em_data_flag\n  319 | \t\tbitstream_reader_read_bits(&reader, 1);\n  320 | \t\t// process_cc_data_flag\n  321 | \t\tbitstream_reader_read_bits(&reader, 1);\n  322 | \t\t//additional_data_flag\n  323 | \t\tbitstream_reader_read_bits(&reader, 1);\n  324 | \n  325 | \t\tauto cc_count = bitstream_reader_read_bits(&reader, 5);\n  326 | \n  327 | \t\tauto *outData = (uint8_t *)bzalloc(sizeof(uint8_t) * cc_count * 3);\n  328 | \t\tmemcpy(outData, anc + reader.pos, cc_count * 3);\n  329 | \n  330 | \t\tcurrentCaptions.data = outData;\n  331 | \t\tcurrentCaptions.timestamp = timestamp;\n  332 | \t\tcurrentCaptions.packets = cc_count;\n  333 | \n  334 | \t\tobs_source_output_cea708(static_cast<DeckLinkInput *>(decklink)->GetSource(), &currentCaptions);\n  335 | \t\tbfree(outData);\n  336 | \t}","lines":85,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/decklink/decklink-device-instance.cpp#L252-L336"}]},
