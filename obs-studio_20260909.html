{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`load_1d_lut` and `load_3d_lut` compute `data_size = 4 * width * width * width * sizeof(struct half)` in 32-bit arithmetic, where `width` comes unbounded from the `.cube` file's `LUT_1D_SIZE`/`LUT_3D_SIZE` parsed by `sscanf(\"%u\")` in `load_cube_file`. A crafted (or simply large) `.cube` file can make `width` big enough that `4*width^3*2` overflows `uint32_t`, causing `bmalloc` to allocate a tiny buffer while the fill loop keeps writing `values[offset++]` entries, giving a heap buffer overflow. There is no upper bound check on `width_1d`/`width_3d`.","fix":"Validate `width_1d`/`width_3d` against a sane maximum (e.g. reject values above 256) before calling `load_1d_lut`/`load_3d_lut`, and/or compute `data_size` in `size_t` with an explicit overflow check before `bmalloc`.","locations":[{"ref":"plugins/obs-filters/color-grade-filter.c:113-116","code":"  113 | static void *load_1d_lut(FILE *const file, const uint32_t width, float red, float green, float blue)\n  114 | {\n  115 | \tconst uint32_t data_size = 4 * width * width * width * sizeof(struct half);\n  116 | \tstruct half *values = bmalloc(data_size);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-filters/color-grade-filter.c#L113-L116"},{"ref":"plugins/obs-filters/color-grade-filter.c:138-141","code":"  138 | static void *load_3d_lut(FILE *const file, const uint32_t width, float red, float green, float blue)\n  139 | {\n  140 | \tconst uint32_t data_size = 4 * width * width * width * sizeof(struct half);\n  141 | \tstruct half *values = bmalloc(data_size);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-filters/color-grade-filter.c#L138-L141"},{"ref":"plugins/obs-filters/color-grade-filter.c:192-196","code":"  192 | \t\t\t} else if (sscanf(line, \"LUT_1D_SIZE %u\", &u) == 1) {\n  193 | \t\t\t\twidth_1d = u;\n  194 | \t\t\t} else if (sscanf(line, \"LUT_3D_SIZE %u\", &u) == 1) {\n  195 | \t\t\t\twidth_3d = u;\n  196 | \t\t\t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-filters/color-grade-filter.c#L192-L196"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `mp4_write_mdhd`, the 64-bit (`version == 1`) branch writes the media duration with `s_wb64(s, (uint32_t)duration)`. The `(uint32_t)` cast truncates `duration` to 32 bits before it is zero-extended back to 64 bits, defeating the entire purpose of the extended box. `version == 1` is chosen precisely when `duration > UINT32_MAX` (line 277), so this branch always corrupts the duration it is meant to represent (e.g. recordings longer than ~20 hours of 60 fps video or ~24 hours of 48 kHz audio). Compare `mp4_write_tkhd` (line 226) which correctly writes `s_wb64(s, duration)`.","fix":"Remove the truncating cast:\n```c\ns_wb64(s, duration); // duration\n```","locations":[{"ref":"plugins/obs-outputs/mp4-mux.c:293","code":"  293 | \t\ts_wb64(s, (uint32_t)duration); // duration","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/mp4-mux.c#L293"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`num_surfaces` is `request->NumFrameSuggested` and is written into the fixed-size stack array `VASurfaceID temp_surfaces[MAX_ALLOCABLE_SURFACES]` (128 entries) in both `simple_alloc` and `simple_free`. The only guard is `assert(num_surfaces < MAX_ALLOCABLE_SURFACES)`, which is compiled out in release builds (`NDEBUG`). The code comment itself notes the count reaches ~72 for 1440p@120 AV1 and may hit the limit in practice, so a driver suggesting >=128 surfaces produces a stack buffer overflow with no runtime check.","fix":"Replace the `assert` with a real runtime check that fails allocation (return `MFX_ERR_MEMORY_ALLOC`) when `num_surfaces >= MAX_ALLOCABLE_SURFACES`, or heap-allocate `temp_surfaces` sized to `num_surfaces`.","locations":[{"ref":"plugins/obs-qsv11/common_utils_linux.cpp:97-105","code":"   97 | \tunsigned int num_surfaces = request->NumFrameSuggested;\n   98 | \tVASurfaceID temp_surfaces[MAX_ALLOCABLE_SURFACES] = {0};\n   99 | \tassert(num_surfaces < MAX_ALLOCABLE_SURFACES);\n  100 | \tVAStatus vasts;\n  101 | \tif ((vasts = vaCreateSurfaces(display, rt_format, request->Info.Width, request->Info.Height, temp_surfaces,\n  102 | \t\t\t\t      num_surfaces, attrs, num_attrs)) != VA_STATUS_SUCCESS) {\n  103 | \t\tblog(LOG_ERROR, \"failed to create surfaces: %d\", vasts);\n  104 | \t\treturn MFX_ERR_MEMORY_ALLOC;\n  105 | \t}","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/common_utils_linux.cpp#L97-L105"},{"ref":"plugins/obs-qsv11/common_utils_linux.cpp:211-217","code":"  211 | \tVASurfaceID temp_surfaces[MAX_ALLOCABLE_SURFACES] = {0};\n  212 | \tobs_enter_graphics();\n  213 | \tfor (int i = 0; i < response->NumFrameActual; i++) {\n  214 | \t\ttemp_surfaces[i] = *(VASurfaceID *)response->mids[i];\n  215 | \t\tgs_texture_destroy(surfs[i].tex_y);\n  216 | \t\tgs_texture_destroy(surfs[i].tex_uv);\n  217 | \t}","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/common_utils_linux.cpp#L211-L217"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`obsqsv->params.nTargetBitRate` and `nMaxBitRate` are `mfxU16` (max 65535) in `QSV_Encoder.h`, but the `bitrate`/`max_bitrate` properties allow up to 10000000 Kbps. `update_params` and `obs_qsv_update` cast the int bitrate directly to `mfxU16`, and `QSV_Encoder_Internal.cpp` copies the value straight into `mfx.TargetKbps` with no `BitRateMultiplier`. Any configured bitrate above 65535 Kbps silently wraps (e.g. 100000 Kbps becomes 34464), so high-bitrate recording/streaming targets are truncated without warning.","fix":"Widen the bitrate fields (and `mfx.TargetKbps`/`MaxKbps` handling with `BitRateMultiplier`) to represent bitrates above 65535 Kbps, or clamp/validate the property range so it cannot exceed what `mfxU16` can hold.","locations":[{"ref":"plugins/obs-qsv11/obs-qsv11.c:629-630","code":"  629 | \tobsqsv->params.nTargetBitRate = (mfxU16)target_bitrate;\n  630 | \tobsqsv->params.nMaxBitRate = (mfxU16)max_bitrate;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/obs-qsv11.c#L629-L630"},{"ref":"plugins/obs-qsv11/obs-qsv11.c:738","code":"  738 | \tobsqsv->params.nTargetBitRate = (mfxU16)obs_data_get_int(settings, \"bitrate\");","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/obs-qsv11.c#L738"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `sfnt_name_to_utf8`, after `iconv` succeeds, `*conv_out = 0` (line 126) writes the NUL terminator at `conv_out`. If `iconv` filled the entire `utf8[256]` buffer, `out_len` becomes 0 and `conv_out == utf8 + 256`, so the write lands at `utf8[256]` - one byte past the 256-byte stack array. iconv only returns `-1`/`E2BIG` when it cannot fit remaining input; a name whose UTF-8 form is exactly 256 bytes converts successfully with `out_len == 0`, so this 1-byte stack overflow is reachable with a crafted/corrupt font name.","fix":"Reserve room for the terminator, e.g. use `char utf8[257]` with `out_len = 256;` (or bail out when `out_len == 0`) before writing `*conv_out = 0`.","locations":[{"ref":"plugins/text-freetype2/find-font-iconv.c:91-127","code":"   91 | \tchar utf8[256];\n   92 | \tchar *conv_in, *conv_out;\n   93 | \tsize_t in_len, out_len;\n   94 | \n   95 | \tif (!charset) {\n   96 | \t\tblog(LOG_DEBUG,\n   97 | \t\t     \"invalid character set found, \"\n   98 | \t\t     \"platform_id: %d, encoding_id: %d, \"\n   99 | \t\t     \"language_id: %d\",\n  100 | \t\t     sfnt_name->platform_id, sfnt_name->encoding_id, sfnt_name->language_id);\n  101 | \t\treturn NULL;\n  102 | \t}\n  103 | \n  104 | \ticonv_t ic = iconv_open(\"UTF-8\", charset);\n  105 | \tif (ic == (iconv_t)-1) {\n  106 | \t\tblog(LOG_DEBUG,\n  107 | \t\t     \"couldn't intialize font code page \"\n  108 | \t\t     \"conversion:  '%s' to 'utf-8': errno = %d\",\n  109 | \t\t     charset, (int)errno);\n  110 | \t\treturn NULL;\n  111 | \t}\n  112 | \n  113 | \tconv_in = (char *)sfnt_name->string;\n  114 | \tconv_out = utf8;\n  115 | \tin_len = sfnt_name->string_len;\n  116 | \tout_len = 256;\n  117 | \n  118 | \tsize_t n = iconv(ic, &conv_in, &in_len, &conv_out, &out_len);\n  119 | \tif (n == (size_t)-1) {\n  120 | \t\tblog(LOG_WARNING, \"couldn't convert font name text: errno = %d\", (int)errno);\n  121 | \t\ticonv_close(ic);\n  122 | \t\treturn NULL;\n  123 | \t}\n  124 | \n  125 | \ticonv_close(ic);\n  126 | \t*conv_out = 0;\n  127 | \treturn bstrdup(utf8);","lines":37,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/text-freetype2/find-font-iconv.c#L91-L127"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"The glyph cache macro `src_glyph` expands to `srcdata->cacheglyphs[glyph_index]`, where `cacheglyphs` has exactly `num_cache_slots` (65535) entries, but `glyph_index` comes from `FT_Get_Char_Index`, which returns the font's internal glyph index and can exceed 65534 for large fonts (many CJK/emoji fonts have >65535 glyphs). `cache_glyphs` both reads (`if (src_glyph != NULL)`) and writes (`src_glyph = init_glyph(...)`) at that index, causing an out-of-bounds heap read/write. The same unchecked indexing occurs in `fill_vertex_buffer`, `set_up_vertex_buffer`, and `get_ft2_text_width`.","fix":"Bounds-check `glyph_index` against `num_cache_slots` before using it as an index (skip or clamp glyphs whose index is `>= num_cache_slots`), or size `cacheglyphs` to the font's actual glyph count (`face->num_glyphs`).","locations":[{"ref":"plugins/text-freetype2/text-functionality.c:290-316","code":"  290 | \t\tconst FT_UInt glyph_index = FT_Get_Char_Index(srcdata->font_face, cache_glyphs[i]);\n  291 | \n  292 | \t\tif (src_glyph != NULL) {\n  293 | \t\t\tcontinue;\n  294 | \t\t}\n  295 | \n  296 | \t\tload_glyph(srcdata, glyph_index, render_mode);\n  297 | \t\tFT_Render_Glyph(slot, render_mode);\n  298 | \n  299 | \t\tconst uint32_t g_w = slot->bitmap.width;\n  300 | \t\tconst uint32_t g_h = slot->bitmap.rows;\n  301 | \n  302 | \t\tif (srcdata->max_h < g_h) {\n  303 | \t\t\tsrcdata->max_h = g_h;\n  304 | \t\t}\n  305 | \n  306 | \t\tif (dx + g_w >= texbuf_w) {\n  307 | \t\t\tdx = 0;\n  308 | \t\t\tdy += srcdata->max_h + 1;\n  309 | \t\t}\n  310 | \n  311 | \t\tif (dy + g_h >= texbuf_h) {\n  312 | \t\t\tblog(LOG_WARNING, \"Out of space trying to render glyphs\");\n  313 | \t\t\tbreak;\n  314 | \t\t}\n  315 | \n  316 | \t\tsrc_glyph = init_glyph(slot, dx, dy, g_w, g_h);","lines":27,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/text-freetype2/text-functionality.c#L290-L316"},{"ref":"plugins/text-freetype2/text-functionality.c:117-119","code":"  117 | \t\tglyph_index = FT_Get_Char_Index(srcdata->font_face, srcdata->text[i]);\n  118 | \t\tif (src_glyph)\n  119 | \t\t\tword_width += src_glyph->xadv;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/text-freetype2/text-functionality.c#L117-L119"},{"ref":"plugins/text-freetype2/text-functionality.c:166-168","code":"  166 | \t\tglyph_index = FT_Get_Char_Index(srcdata->font_face, srcdata->text[i]);\n  167 | \t\tif (src_glyph == NULL)\n  168 | \t\t\tgoto skip_glyph;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/text-freetype2/text-functionality.c#L166-L168"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The patch new-size sanity check `if (newsize < 0 || newsize >= 0x7ffffffff)` uses the constant `0x7ffffffff` (9 hex digits, ~34 GB), almost certainly a typo for `0x7fffffff` (`INT_MAX`, ~2 GB). `newsize` is later passed to `WriteFile(hTarget, newData.data(), (DWORD)newsize, ...)`, and `(DWORD)newsize` truncates a 64-bit value to 32 bits, so a `newsize` between 4 GB and 34 GB would either be truncated or (more likely) fail the earlier `newData.resize()` allocation. The mismatched bound defeats the intended guard.","fix":"Use the intended 32-bit bound: change `newsize >= 0x7ffffffff` to `newsize >= 0x7fffffff` (or explicitly `newsize > INT_MAX`), keeping it consistent with the `(DWORD)newsize` write.","locations":[{"ref":"frontend/updater/patch.cpp:84","code":"   84 | \tif (newsize < 0 || newsize >= 0x7ffffffff) {","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/updater/patch.cpp#L84"},{"ref":"frontend/updater/patch.cpp:141-142","code":"  141 | \tsuccess = !!WriteFile(hTarget, newData.data(), (DWORD)newsize, &written, nullptr);\n  142 | \tif (!success || written != newsize) {","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/updater/patch.cpp#L141-L142"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `EstimateBitrateVal`, the local variable is declared `long fps` instead of `long double fps`, so the result of the floating-point division `(long double)fps_num / (long double)fps_den` is truncated to an integer before being used in `sqrt(pow(fps, 1.1l))`. For fractional framerates (e.g. NTSC 60000/1001 = 59.94 becomes 59, 30000/1001 = 29.97 becomes 29, 24000/1001 = 23.976 becomes 23) this discards the fractional part and skews the bitrate estimate. The type is clearly meant to be `long double` like every other `fps` variable in the file (see lines 602 and 801). It affects the min/upper bitrate estimates that gate which resolution/fps combinations get tested.","fix":"Change the declaration type:\n```cpp\nlong double fps = (long double)fps_num / (long double)fps_den;\n```","locations":[{"ref":"frontend/wizards/AutoConfigTestPage.cpp:434-439","code":"  434 | static long double EstimateBitrateVal(int cx, int cy, int fps_num, int fps_den)\n  435 | {\n  436 | \tlong fps = (long double)fps_num / (long double)fps_den;\n  437 | \tlong double areaVal = pow((long double)(cx * cy), 0.85l);\n  438 | \treturn areaVal * sqrt(pow(fps, 1.1l));\n  439 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/wizards/AutoConfigTestPage.cpp#L434-L439"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `ffmpeg_image_copy_data_straight` the output buffer size is computed as:\n\n    const size_t linesize  = (size_t)info->cx * 4;\n    const size_t totalsize = info->cy * linesize;\n\n`info->cy` is `int`. If `cx` and `cy` each are large (e.g. 32767 pixels), `linesize` can be\ncomputed correctly as `size_t`, but `info->cy * linesize` multiplies a signed `int` by `size_t`;\non platforms where `int` is 32 bits and `size_t` is 64 bits, implicit conversion to `size_t`\nhappens first, so there is no overflow. However the identical pattern appears in\n`ffmpeg_image_reformat_frame` for the RGBA/BGRA premultiply path (line 362-363) where\n`info->cy` is also `int` - same situation. These are safe today but fragile; casting `info->cy`\nto `size_t` explicitly makes the intent clear and guards against future narrowing.","fix":"Cast `info->cy` to `size_t` before multiplying: `const size_t totalsize = (size_t)info->cy * linesize;`","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:115-117","code":"  115 | \tconst size_t linesize = (size_t)info->cx * 4;\n  116 | \tconst size_t totalsize = info->cy * linesize;\n  117 | \tvoid *data = bmalloc(totalsize);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics-ffmpeg.c#L115-L117"},{"ref":"libobs/graphics/graphics-ffmpeg.c:361-363","code":"  361 | \t\t\tconst size_t linesize = (size_t)info->cx * 4;\n  362 | \t\t\tconst size_t totalsize = info->cy * linesize;\n  363 | \t\t\tdata = bmalloc(totalsize);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics-ffmpeg.c#L361-L363"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`lcm` in `obs-encoder.c` operates on `int` (32-bit signed). The LCM of two frame-rate\ndivisors can overflow a signed 32-bit integer and yield a negative or incorrect value. For\nexample `lcm(65536, 65537)` overflows INT_MAX. The result is stored as\n`frame_rate_divisors_lcm` and used in timing calculations (`int64_t overall_timestep =\nencoder->timebase_num * group->frame_rate_divisors_lcm`). An overflow here can cause\nencoders in a group to never synchronise their reconfigure boundary, stalling bitrate changes\nindefinitely or triggering incorrect integer arithmetic downstream.","fix":"Change `gcd` and `lcm` to use `int64_t` and store `frame_rate_divisors_lcm` as `int64_t`, or cap divisors at a safe maximum (e.g. 256). Simplest fix:\n```c\nstatic int64_t gcd64(int64_t a, int64_t b)\n{\n\twhile (b) { int64_t t = b; b = a % b; a = t; }\n\treturn a;\n}\nstatic int64_t lcm64(int64_t a, int64_t b)\n{\n\treturn (a / gcd64(a, b)) * b;\n}\n```","locations":[{"ref":"libobs/obs-encoder.c:364-367","code":"  364 | static int lcm(int a, int b)\n  365 | {\n  366 | \treturn (a / gcd(a, b)) * b;\n  367 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L364-L367"},{"ref":"libobs/obs-encoder.c:399-400","code":"  399 | \t\tencoder->encoder_group->frame_rate_divisors_lcm =\n  400 | \t\t\tlcm(encoder->encoder_group->frame_rate_divisors_lcm, encoder->frame_rate_divisor);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L399-L400"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`OBSVideoFrame` hardcodes `bpp = 2` and computes `rowBytes = width * bpp` and buffer size `width * height * bpp + 1` regardless of the actual `pixelFormat`. This is only correct for 8-bit YUV (`UYVY`). When the frame is constructed for `bmdFormat8BitBGRA` (4 bytes/pixel), `bmdFormat10BitRGBXLE` (4 bytes/pixel) or `bmdFormat10BitYUV`/`v210` (packed), both `rowBytes` and the allocated buffer are far too small. It is currently latent because `convertFrame` is always created to match the active `pixelFormat` so `IDeckLinkVideoConversion::ConvertFrame` (`decklink-device-instance.cpp:202`) writing into this undersized buffer is not normally reached, but it is a heap-overflow landmine.","fix":"Derive bytes-per-pixel / row stride from `pixelFormat` (e.g. 4 for `bmdFormat8BitBGRA` and `bmdFormat10BitRGBXLE`, the v210 stride formula for `bmdFormat10BitYUV`, 2 for `bmdFormat8BitYUV`) and size `rowBytes`/`data` accordingly.","locations":[{"ref":"plugins/decklink/OBSVideoFrame.cpp:3-11","code":"    3 | OBSVideoFrame::OBSVideoFrame(long width, long height, BMDPixelFormat pixelFormat)\n    4 | {\n    5 | \tint bpp = 2;\n    6 | \tthis->width = width;\n    7 | \tthis->height = height;\n    8 | \tthis->rowBytes = width * bpp;\n    9 | \tthis->data = new unsigned char[width * height * bpp + 1];\n   10 | \tthis->pixelFormat = pixelFormat;\n   11 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/decklink/OBSVideoFrame.cpp#L3-L11"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`convert_encoded_window_id` computes `wname`/`wcls` sizes as `secondMark - secondStr` and `strEnd - thirdStr` after only checking `if (!firstMark)`. If the input contains exactly one `WIN_STRING_DIV` separator, `secondMark` is NULL, so `secondMark - secondStr` is a large negative pointer difference; `bzalloc(secondMark - secondStr + 1)` requests a huge (wrapped) size and `memcpy` then reads/writes out of bounds. Well-formed strings from the plugin always contain two separators, but a corrupted/hand-edited scene-collection value would trigger this.","fix":"After the `if (!firstMark)` early return, also validate `secondMark` before computing name/class sizes; if `!secondMark`, set `*p_wname`/`*p_wcls` to NULL and return `(xcb_window_t)atol(str)` (or bail out) instead of doing the pointer subtraction.","locations":[{"ref":"plugins/linux-capture/xcomposite-input.c:259-287","code":"  259 | static xcb_window_t convert_encoded_window_id(const char *str, char **p_wname, char **p_wcls)\n  260 | {\n  261 | \tsize_t markSize = strlen(WIN_STRING_DIV);\n  262 | \n  263 | \tconst char *firstMark = strstr(str, WIN_STRING_DIV);\n  264 | \tconst char *secondMark = firstMark ? strstr(firstMark + markSize, WIN_STRING_DIV) : NULL;\n  265 | \tconst char *strEnd = str + strlen(str);\n  266 | \n  267 | \tconst char *secondStr = firstMark + markSize;\n  268 | \tconst char *thirdStr = secondMark + markSize;\n  269 | \n  270 | \t// wstr only consists of the window-id\n  271 | \tif (!firstMark) {\n  272 | \t\t*p_wname = NULL;\n  273 | \t\t*p_wcls = NULL;\n  274 | \t\treturn (xcb_window_t)atol(str);\n  275 | \t}\n  276 | \n  277 | \t// wstr also contains window-name and window-class\n  278 | \tchar *wname = bzalloc(secondMark - secondStr + 1);\n  279 | \tchar *wcls = bzalloc(strEnd - thirdStr + 1);\n  280 | \tmemcpy(wname, secondStr, secondMark - secondStr);\n  281 | \tmemcpy(wcls, thirdStr, strEnd - thirdStr);\n  282 | \txcb_window_t ret = (xcb_window_t)strtol(str, NULL, 10);\n  283 | \n  284 | \t*p_wname = wname;\n  285 | \t*p_wcls = wcls;\n  286 | \treturn ret;\n  287 | }","lines":29,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-capture/xcomposite-input.c#L259-L287"}]},
{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `mp4_write_sbgp_sbgp_opus`, the second sample-to-group entry writes `s_wb32(s, (uint32_t)track->samples - preroll_count)`. If the Opus track has fewer samples than `preroll_count` (a very short recording of under ~4 packets / 80 ms), this unsigned subtraction underflows to a huge `sample_count`, producing a corrupt `sbgp` box.","fix":"Clamp `preroll_count` to `track->samples` before writing, e.g. `uint32_t remaining = (uint32_t)track->samples > preroll_count ? (uint32_t)track->samples - preroll_count : 0;` and write `remaining`, or skip the second entry when `track->samples <= preroll_count`.","locations":[{"ref":"plugins/obs-outputs/mp4-mux.c:1615-1619","code":" 1615 | \ts_wb32(s, preroll_count); // sample_count\n 1616 | \ts_wb32(s, 0);             // group_description_index\n 1617 | \t// entry 1\n 1618 | \ts_wb32(s, (uint32_t)track->samples - preroll_count); // sample_count\n 1619 | \ts_wb32(s, 1);                                        // group_description_index","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/mp4-mux.c#L1615-L1619"}]},
{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `netif_convert_to_string`, the final `strncpy(dest, temp_char, INET6_ADDRSTRLEN)` always writes `INET6_ADDRSTRLEN` (46) bytes into `dest` (strncpy pads with NUL up to n). `netif_addr_to_str` accepts and validates buffers as small as `INET_ADDRSTRLEN` (16) for `AF_INET`, so a caller passing a 16-byte buffer for an IPv4 address (permitted by the guard at lines 92-94) triggers a ~30-byte stack/heap buffer overflow. The only in-tree caller passes an `INET6_ADDRSTRLEN` buffer, so it is currently latent, but the API contract is unsafe.","fix":"Copy only up to the destination capacity, e.g. pass the real buffer length into `netif_convert_to_string` and use `strncpy(dest, temp_char, dest_len)` with explicit NUL-termination, or size the copy by `strlen(temp_char) + 1` after bounds-checking against the caller-provided length.","locations":[{"ref":"plugins/obs-outputs/net-if.c:47-64","code":"   47 | static void netif_convert_to_string(char *dest, struct sockaddr_storage *byte_address)\n   48 | {\n   49 | \tint family = byte_address->ss_family;\n   50 | \tchar temp_char[INET6_ADDRSTRLEN] = {0};\n   51 | \n   52 | #ifndef _WIN32\n   53 | \tif (family == AF_INET)\n   54 | \t\tinet_ntop(family, &(((struct sockaddr_in *)byte_address)->sin_addr), temp_char, INET6_ADDRSTRLEN);\n   55 | \telse if (family == AF_INET6)\n   56 | \t\tinet_ntop(family, &(((struct sockaddr_in6 *)byte_address)->sin6_addr), temp_char, INET6_ADDRSTRLEN);\n   57 | #else\n   58 | \tif (family == AF_INET)\n   59 | \t\tInetNtopA(family, &(((SOCKADDR_IN *)byte_address)->sin_addr), temp_char, INET6_ADDRSTRLEN);\n   60 | \telse if (family == AF_INET6)\n   61 | \t\tInetNtopA(family, &(((SOCKADDR_IN6 *)byte_address)->sin6_addr), temp_char, INET6_ADDRSTRLEN);\n   62 | #endif\n   63 | \tstrncpy(dest, temp_char, INET6_ADDRSTRLEN);\n   64 | }","lines":18,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/net-if.c#L47-L64"}]},
{"id":"OVF_22","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`video_queue_write` copies `size = linesize[0] * qh->cy` bytes for the Y plane and `size / 2` bytes for the UV plane into a per-slot buffer that was allocated in `video_queue_create` as `frame_size = cx * cy * 3 / 2` (based on width `cx`, not stride). The code implicitly assumes `linesize[0] == cx`. If the source frame stride exceeds the width (e.g. when the output width is not a multiple of the internal alignment), the copy both overruns the mapped shared-memory slot and produces a corrupted image, since the reader (`nv12_do_scale`) treats the data as tightly packed with stride `cx`.","fix":"Copy row-by-row using `linesize[0]` as the source stride while writing packed `cx`-width rows (and clamp/validate that `linesize[0] >= cx`), or size the shared buffer using the actual stride so the packed assumption holds.","locations":[{"ref":"plugins/win-dshow/shared-memory-queue.c:159-173","code":"  159 | void video_queue_write(video_queue_t *vq, uint8_t **data, uint32_t *linesize, uint64_t timestamp)\n  160 | {\n  161 | \tstruct queue_header *qh = vq->header;\n  162 | \tlong inc = ++qh->write_idx;\n  163 | \n  164 | \tunsigned long idx = get_idx(inc);\n  165 | \tsize_t size = linesize[0] * qh->cy;\n  166 | \n  167 | \t*vq->ts[idx] = timestamp;\n  168 | \tmemcpy(vq->frame[idx], data[0], size);\n  169 | \tmemcpy(vq->frame[idx] + size, data[1], size / 2);\n  170 | \n  171 | \tqh->read_idx = inc;\n  172 | \tqh->state = SHARED_QUEUE_STATE_READY;\n  173 | }","lines":15,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-dshow/shared-memory-queue.c#L159-L173"},{"ref":"plugins/win-dshow/shared-memory-queue.c:45-63","code":"   45 | \tDWORD frame_size = cx * cy * 3 / 2;\n   46 | \tuint32_t offset_frame[3];\n   47 | \tDWORD size;\n   48 | \n   49 | \tsize = sizeof(struct queue_header);\n   50 | \n   51 | \tALIGN_SIZE(size, 32);\n   52 | \n   53 | \toffset_frame[0] = size;\n   54 | \tsize += frame_size + FRAME_HEADER_SIZE;\n   55 | \tALIGN_SIZE(size, 32);\n   56 | \n   57 | \toffset_frame[1] = size;\n   58 | \tsize += frame_size + FRAME_HEADER_SIZE;\n   59 | \tALIGN_SIZE(size, 32);\n   60 | \n   61 | \toffset_frame[2] = size;\n   62 | \tsize += frame_size + FRAME_HEADER_SIZE;\n   63 | \tALIGN_SIZE(size, 32);","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-dshow/shared-memory-queue.c#L45-L63"}]},
{"id":"OVF_23","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `script_log_va`, `start_len` receives the return value of `snprintf`, which is the number of characters that *would* have been written (excluding the NUL), not the number actually written. If the prefix `\"[%s: %s] \"` (containing `script->file.array`) is longer than `sizeof(msg)` (2048), `start_len` exceeds 2048. Then `msg + start_len` (lines 48 and 51) points past the buffer and `sizeof(msg) - start_len` underflows to a huge `size_t`, so `vsnprintf` receives an out-of-bounds destination with an enormous size - a buffer overflow. Reachable only with a pathologically long script filename, hence low severity.","fix":"Clamp `start_len` before using it as an offset, e.g. `if (start_len >= sizeof(msg)) start_len = sizeof(msg) - 1;` after the prefix `snprintf`, before the `vsnprintf`/`callback` calls.","locations":[{"ref":"shared/obs-scripting/obs-scripting-logging.c:43-51","code":"   43 | \t\tstart_len = snprintf(msg, sizeof(msg), \"[%s: %s] \", lang, script->file.array);\n   44 | \t} else {\n   45 | \t\tstart_len = snprintf(msg, sizeof(msg), \"[Unknown Script] \");\n   46 | \t}\n   47 | \n   48 | \tvsnprintf(msg + start_len, sizeof(msg) - start_len, format, args);\n   49 | \n   50 | \tif (callback)\n   51 | \t\tcallback(param, script, level, msg + start_len);","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/obs-scripting/obs-scripting-logging.c#L43-L51"}]},
{"id":"OVF_24","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `UpdateRationalFPSWidgets` the bounds check `if (fpsProps->fps_ranges.size() < idx) continue;` is off-by-one: when `idx == size` the condition is false, so execution falls through to `fpsProps->fps_ranges[idx]` (via `matches_range`), reading one past the end of the vector. The analogous check in `UpdateMinMaxLabels` correctly uses `if (idx >= w->fps_ranges.size())`. In practice the stored indices are always `0..size-1`, so it is latent, but the check is incorrect.","fix":"Change `if (fpsProps->fps_ranges.size() < idx)` to `if (idx >= fpsProps->fps_ranges.size())`.","locations":[{"ref":"shared/properties-view/properties-view.cpp:1139-1140","code":" 1139 | \t\tif (fpsProps->fps_ranges.size() < idx) {\n 1140 | \t\t\tcontinue;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/properties-view/properties-view.cpp#L1139-L1140"}]},
{"id":"OVF_25","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"In `read_change_file`, `resize_buf_resize(filename, size + 1)` is called where `size` is a `uint32_t` taken from the pipe protocol. If `size == UINT32_MAX`, `size + 1` wraps to `0`, so `resize_buf_resize` allocates a zero-length (or unchanged) buffer, and the subsequent `safe_read(filename->buf, size)` then reads up to `UINT32_MAX` bytes into it, plus `filename->buf[size] = 0` writes out of bounds. The size is supplied by the trusted parent OBS process, so exploitability is minimal, but the arithmetic is still an unchecked overflow.","fix":"Validate `size` before adding, e.g. reject `size` at or near `UINT32_MAX` (`if (size >= UINT32_MAX) return false;`) before calling `resize_buf_resize(filename, size + 1)`.","locations":[{"ref":"plugins/obs-ffmpeg/ffmpeg-mux/ffmpeg-mux.c:1106-1113","code":" 1106 | static inline bool read_change_file(struct ffmpeg_mux *ffm, uint32_t size, struct resize_buf *filename, int argc,\n 1107 | \t\t\t\t    char **argv)\n 1108 | {\n 1109 | \tresize_buf_resize(filename, size + 1);\n 1110 | \tif (safe_read(filename->buf, size) != size) {\n 1111 | \t\treturn false;\n 1112 | \t}\n 1113 | \tfilename->buf[size] = 0;","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/ffmpeg-mux/ffmpeg-mux.c#L1106-L1113"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `discover_schema_file` (check-jsonschema.py), the local variable `schema_file` (a path string)\nis reused as the loop variable of `with open(schema_file) as schema_file:`. After the `with`\nblock, `schema_file` refers to the closed file object, not the original path string. The function\nthen returns `str(schema_file)` which is the `repr` of the file object (something like\n`<_io.TextIOWrapper name='...' mode='r' ...>`), not the actual file path. This corrupts the schema\ndeduplication key in `main()` so the same schema file may be validated multiple times, and the\nreturned \"path\" string cannot be matched against future `os.path.join` results.","fix":"Use a different variable name for the file handle:\n\n```python\nschema_file_path = os.path.join(os.path.dirname(filename), schema_filename)\n\nwith open(schema_file_path) as schema_fh:\n    schema_data = json.load(schema_fh)\n\nreturn (schema_file_path, schema_data)\n```","locations":[{"ref":".github/scripts/utils.py/check-jsonschema.py:25-30","code":"   25 |     schema_file = os.path.join(os.path.dirname(filename), schema_filename)\n   26 | \n   27 |     with open(schema_file) as schema_file:\n   28 |         schema_data = json.load(schema_file)\n   29 | \n   30 |     return (str(schema_file), schema_data)","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/.github/scripts/utils.py/check-jsonschema.py#L25-L30"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `check-jsonschema.py` `main()`, when `discover_schema_file` returns `(None, None)` (no schema\ndefined in the JSON file), the code at line 102 unconditionally indexes\n`schema_mappings[schema_file]` where `schema_file` is `None`. The key `None` was never inserted\nbecause the guard on line 97 only adds the key `if schema_file`, so this raises `KeyError` and\ncrashes the script for any JSON file that has no `$schema` field.","fix":"Skip the mapping update and file registration when there is no schema:\n\n```python\nif schema_file is None:\n    continue\n\nif schema_file not in schema_mappings:\n    schema_mappings[schema_file] = {\"schema_data\": schema_data, \"files\": set()}\n\nschema_mappings[schema_file][\"files\"].add(json_file)\n```","locations":[{"ref":".github/scripts/utils.py/check-jsonschema.py:97-102","code":"   97 |         if schema_file and schema_file not in schema_mappings.keys():\n   98 |             schema_mappings.update(\n   99 |                 {schema_file: {\"schema_data\": schema_data, \"files\": set()}}\n  100 |             )\n  101 | \n  102 |         schema_mappings[schema_file][\"files\"].add(json_file)","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/.github/scripts/utils.py/check-jsonschema.py#L97-L102"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ResolveVariable` can loop infinitely when two theme alias variables reference each other in a\ncycle (e.g. A aliases B and B aliases A). The loop condition checks\n`vars[key].type == OBSThemeVariable::Alias` and then does `if (!vars.contains(key)) return false;`.\nBut when both A and B exist in `vars`, `contains` returns true and the loop never terminates,\nhanging OBS during theme loading.","fix":"Track visited keys and break on a cycle:\n\n```cpp\nstatic bool ResolveVariable(const QHash<QString, OBSThemeVariable> &vars, OBSThemeVariable &var)\n{\n    if (var.type != OBSThemeVariable::Alias)\n        return true;\n\n    QString key = var.value.toString();\n    QSet<QString> visited;\n    visited.insert(key);\n\n    while (vars[key].type == OBSThemeVariable::Alias) {\n        key = vars[key].value.toString();\n\n        if (!vars.contains(key)) {\n            blog(LOG_ERROR, R\"(Variable \"%s\" does not exist!)\", QT_TO_UTF8(key));\n            return false;\n        }\n        if (visited.contains(key)) {\n            blog(LOG_ERROR, R\"(Alias cycle detected at variable \"%s\"!)\", QT_TO_UTF8(key));\n            return false;\n        }\n        visited.insert(key);\n    }\n\n    var = vars[key];\n    return true;\n}\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:552-571","code":"  552 | static bool ResolveVariable(const QHash<QString, OBSThemeVariable> &vars, OBSThemeVariable &var)\n  553 | {\n  554 | \tif (var.type != OBSThemeVariable::Alias) {\n  555 | \t\treturn true;\n  556 | \t}\n  557 | \n  558 | \tQString key = var.value.toString();\n  559 | \twhile (vars[key].type == OBSThemeVariable::Alias) {\n  560 | \t\tkey = vars[key].value.toString();\n  561 | \n  562 | \t\tif (!vars.contains(key)) {\n  563 | \t\t\tblog(LOG_ERROR, R\"(Variable \"%s\" (aliased by \"%s\") does not exist!)\", QT_TO_UTF8(key),\n  564 | \t\t\t     QT_TO_UTF8(var.name));\n  565 | \t\t\treturn false;\n  566 | \t\t}\n  567 | \t}\n  568 | \n  569 | \tvar = vars[key];\n  570 | \n  571 | \treturn true;","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp_Themes.cpp#L552-L571"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`isnormal(val)` returns false for +0.0 and -0.0 in addition to infinities and NaNs (per the C\nstandard, subnormals also fail). In `EvalMath`, after a `calc()` subtraction of two equal values\n(e.g. `2px - 2px`), `val` will be 0.0 and `!isnormal(0.0)` is true, so the result is logged as\nan error and the string `'Invalid expression'` is returned. This silently breaks any theme that\nuses `calc()` to produce zero, including cases like centering offsets.","fix":"Replace `isnormal` with an explicit check for non-finite values:\n\n```cpp\nif (!isfinite(val)) {\n    blog(LOG_ERROR, \"Invalid calc() resulted in non-finite number: %f %s %f = %f\", d1,\n         QT_TO_UTF8(opt), d2, val);\n    return \"'Invalid expression'\";\n}\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:681-698","code":"  681 | \tdouble val = numeric_limits<double>::quiet_NaN();\n  682 | \n  683 | \tif (type == OBSThemeVariable::Calc) {\n  684 | \t\tif (opt == \"+\") {\n  685 | \t\t\tval = d1 + d2;\n  686 | \t\t} else if (opt == \"-\") {\n  687 | \t\t\tval = d1 - d2;\n  688 | \t\t} else if (opt == \"*\") {\n  689 | \t\t\tval = d1 * d2;\n  690 | \t\t} else if (opt == \"/\") {\n  691 | \t\t\tval = d1 / d2;\n  692 | \t\t}\n  693 | \n  694 | \t\tif (!isnormal(val)) {\n  695 | \t\t\tblog(LOG_ERROR, \"Invalid calc() resulted in non-normal number: %f %s %f = %f\", d1,\n  696 | \t\t\t     QT_TO_UTF8(opt), d2, val);\n  697 | \t\t\treturn \"'Invalid expression'\";\n  698 | \t\t}","lines":18,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp_Themes.cpp#L681-L698"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `SetupDuplicateSceneCollection` and `SetupRenameSceneCollection`, the JSON file is read/written with `newCollection.getFileName()`, which returns only the bare filename (e.g. `MyCollection.json`), not the full path. `getFilePathString()` returns the full path; `getFileName()` returns `filePath_.filename()`. `obs_data_create_from_json_file`/`obs_data_save_json_safe` resolve relative to the working directory, so these calls open/write the wrong location. This is a regression: the pre-refactor code used `newCollection.collectionFile.u8string()` (the full path). Consequences: for duplicate, `obs_data_create_from_json_file` returns `NULL`, so the source UUID regeneration loop is skipped (duplicated sources keep the ORIGINAL UUIDs, causing collisions) and a stray/near-empty file may be written to the CWD; for rename, the copied file never gets its internal `\"name\"` field updated, so after the next `RefreshSceneCollectionCache` the collection reappears under its OLD name (`candidateName` is read from the JSON `\"name\"`).","fix":"Use the full path instead of the bare filename at all four sites. E.g.:\n```cpp\n// before\nOBSDataAutoRelease collection = obs_data_create_from_json_file(newCollection.getFileName().c_str());\n...\nobs_data_save_json_safe(collection, newCollection.getFileName().c_str(), \"tmp\", nullptr);\n// after\nOBSDataAutoRelease collection = obs_data_create_from_json_file(newCollection.getFilePathString().c_str());\n...\nobs_data_save_json_safe(collection, newCollection.getFilePathString().c_str(), \"tmp\", nullptr);\n```","locations":[{"ref":"frontend/widgets/OBSBasic_SceneCollections.cpp:175","code":"  175 | \tOBSDataAutoRelease collection = obs_data_create_from_json_file(newCollection.getFileName().c_str());","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_SceneCollections.cpp#L175"},{"ref":"frontend/widgets/OBSBasic_SceneCollections.cpp:198","code":"  198 | \tobs_data_save_json_safe(collection, newCollection.getFileName().c_str(), \"tmp\", nullptr);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_SceneCollections.cpp#L198"},{"ref":"frontend/widgets/OBSBasic_SceneCollections.cpp:226","code":"  226 | \tOBSDataAutoRelease collection = obs_data_create_from_json_file(newCollection.getFileName().c_str());","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_SceneCollections.cpp#L226"},{"ref":"frontend/widgets/OBSBasic_SceneCollections.cpp:229","code":"  229 | \tobs_data_save_json_safe(collection, newCollection.getFileName().c_str(), \"tmp\", nullptr);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_SceneCollections.cpp#L229"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"The `gs_index_type.mtlType` mapping is inverted. `libobs` defines `enum gs_index_type { GS_UNSIGNED_SHORT, GS_UNSIGNED_LONG }` where `GS_UNSIGNED_SHORT` is a 16-bit index and `GS_UNSIGNED_LONG` is a 32-bit index. This extension maps `GS_UNSIGNED_LONG` to `.uint16` and `GS_UNSIGNED_SHORT` to `.uint32` - exactly backwards. The correct round-trip mapping is confirmed by `gs_indexbuffer_get_type` in `metal-indexbuffer.swift` (`.uint16 -> GS_UNSIGNED_SHORT`, `.uint32 -> GS_UNSIGNED_LONG`), which contradicts this extension. Because `MetalIndexBuffer.setupBuffers` computes `byteSize` from `type` (`.uint16` -> `2 * count`, `.uint32` -> `4 * count`) and `MetalDevice.draw` passes `indexBuffer.type` to `drawIndexedPrimitives`, a 16-bit index buffer created by `libobs` is treated as 32-bit (reading `4 * count` bytes from a `2 * count`-byte allocation -> buffer over-read and corrupt indices) and vice versa. Any indexed draw is rendered with the wrong index width.","fix":"Swap the two cases:\n```swift\nvar mtlType: MTLIndexType? {\n    switch self {\n    case GS_UNSIGNED_SHORT:\n        return .uint16\n    case GS_UNSIGNED_LONG:\n        return .uint32\n    default:\n        return nil\n    }\n}\n```","locations":[{"ref":"libobs-metal/libobs+Extensions.swift:413-423","code":"  413 | extension gs_index_type {\n  414 |     var mtlType: MTLIndexType? {\n  415 |         switch self {\n  416 |         case GS_UNSIGNED_LONG:\n  417 |             return .uint16\n  418 |         case GS_UNSIGNED_SHORT:\n  419 |             return .uint32\n  420 |         default:\n  421 |             return nil\n  422 |         }\n  423 |     }","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/libobs+Extensions.swift#L413-L423"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`calldata_get_ptr` passes `sizeof(p_ptr)` (the size of the local pointer-to-void* argument on the stack, always 8 on 64-bit) instead of the size of the pointed-to pointer. This means it reads the correct number of bytes on 64-bit platforms by coincidence, but silently fails when the stored pointer size differs or when the API is used in a way that triggers the type-size check inside `calldata_get_data`. The intent is clearly `sizeof(void*)`, not `sizeof(p_ptr)` (which equals `sizeof(void**)`, i.e. 8 bytes either way on LP64, but the semantics are wrong and would break on hypothetical platforms where they differ, and is misleading regardless).","fix":"Change `sizeof(p_ptr)` to `sizeof(void *)` so the size reflects the value being retrieved, not the local pointer argument:\n```c\nstatic inline bool calldata_get_ptr(const calldata_t *data, const char *name, void *p_ptr)\n{\n    return calldata_get_data(data, name, p_ptr, sizeof(void *));\n}\n```","locations":[{"ref":"libobs/callback/calldata.h:119-121","code":"  119 | {\n  120 | \treturn calldata_get_data(data, name, p_ptr, sizeof(p_ptr));\n  121 | }","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/callback/calldata.h#L119-L121"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`gs_effect_set_default` dereferences `param` before any null check. The function passes\n`param->default_val.array` and `param->default_val.num` to `effect_setval_inline`, which does have\nits own null check for param - but the dereference of param happens first in the call expression,\ncausing a null pointer dereference if a caller passes NULL.","fix":"Add a null guard before dereferencing:\n\n```c\nvoid gs_effect_set_default(gs_eparam_t *param)\n{\n    if (!param)\n        return;\n    effect_setval_inline(param, param->default_val.array, param->default_val.num);\n}\n```","locations":[{"ref":"libobs/graphics/effect.c:542-545","code":"  542 | void gs_effect_set_default(gs_eparam_t *param)\n  543 | {\n  544 | \teffect_setval_inline(param, param->default_val.array, param->default_val.num);\n  545 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/effect.c#L542-L545"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The extension guard in `wic_image_init` (Windows-only) has its condition inverted. The intent\nis to bail out early when the file is NOT a `.jxr` file, but the check is:\n\n    if (len <= 4 && astrcmpi(file + len - 4, \".jxr\") != 0)\n\nThis only returns early for filenames of four characters or fewer that do not end in `.jxr`.\nFor any filename longer than four characters (virtually all real filenames), the condition is\nimmediately false and the guard is skipped entirely - meaning every non-JXR file that FFmpeg\ncould not load (e.g. ordinary PNGs) is silently forwarded into the WIC JXR decoder path. As a\nsecondary issue, when `len < 4`, `file + len - 4` is a pointer before the start of the string,\nwhich is undefined behavior.","fix":"The correct guard is: bail out if the filename is too short OR if it does not\nend with `.jxr`:\n\n```c\nif (len < 4 || astrcmpi(file + len - 4, \".jxr\") != 0) {\n    blog(LOG_WARNING, \"WIC: Only handle JXR for WIC images for now\");\n    return NULL;\n}\n```","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:705-709","code":"  705 | \tconst size_t len = strlen(file);\n  706 | \tif (len <= 4 && astrcmpi(file + len - 4, \".jxr\") != 0) {\n  707 | \t\tblog(LOG_WARNING, \"WIC: Only handle JXR for WIC images for now\");\n  708 | \t\treturn NULL;\n  709 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics-ffmpeg.c#L705-L709"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`polar_to_cart` names the first computed value `sinx` but initialises it with `cosf(v->x)`, not `sinf`. The subsequent `sinx_z` and all three output components then use the wrong trig value, producing an incorrect Cartesian vector for any non-trivial polar input.","fix":"Rename and correct the computation:\n```c\n// before\nfloat sinx = cosf(v->x);\n// after\nfloat sinx = sinf(v->x);\n```\nAnd ensure the remaining uses of `sinx` (lines 28, 30, 32) also make sense geometrically - the `w`-component formula on line 32 (`v->z * sinf(v->x)`) is currently computing the Y component with a sine of the elevation that is redundant once `sinx` is fixed. A full cross-check against the inverse `cart_to_polar` is recommended.","locations":[{"ref":"libobs/graphics/math-extra.c:27-34","code":"   27 | \tfloat sinx = cosf(v->x);\n   28 | \tfloat sinx_z = v->z * sinx;\n   29 | \n   30 | \tcart.x = sinx_z * sinf(v->y);\n   31 | \tcart.z = sinx_z * cosf(v->y);\n   32 | \tcart.y = v->z * sinf(v->x);\n   33 | \n   34 | \tvec3_copy(dst, &cart);","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/math-extra.c#L27-L34"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`video_frame_init` computes plane offsets incorrectly. The loop accumulates\n`plane_size` into `size` and then stores the running total as `offsets[i]`,\nso `offsets[0]` is the end of plane 0, not the start. The pointer assignment\nfor plane N then uses `offsets[i-1]`, which is correct for i=1 (offset of\nplane 1 = end of plane 0) but for i=2 it uses `offsets[1]` (end of plane 1),\nskipping past plane 1 entirely. In practice this means plane-2 data pointers\nfor tri-planar formats (I420, I444, etc.) are set to the allocation end rather\nthan the start of plane 2, so writes to plane 2 go out of bounds and reads\nfrom it return garbage.\n\nRoot cause: `offsets[i]` stores the cumulative end of each plane. The pointer\nfor plane i should be `offsets[i-1]` (the end of the previous plane, i.e. the\nstart of this plane), but for plane 0 (the base allocation) the start is simply\n`frame->data[0]`. For plane 1 `offsets[0]` is the end of plane 0 - correct.\nFor plane 2 `offsets[1]` is the end of plane 1 - also correct. Actually on\nre-reading: `offsets[i]` is updated AFTER `size +=` so the loop body is:\n  size += plane_size; offsets[i] = size;\nSo offsets[0] = size_of_plane0, offsets[1] = size_of_plane0 + size_of_plane1,\nand the pointer assignment uses offsets[i-1]:\n  data[1] = data[0] + offsets[0]   -- correct (start of plane 1)\n  data[2] = data[0] + offsets[1]   -- correct (start of plane 2)\nThis is actually correct. However there is still a bug: `linesize[0]` and\n`data[0]` are filled outside the inner loop, but inside the inner loop planes\nwith index >= 1 are filled only if `linesizes[i]` and `heights[i]` are\nnon-zero. For plane 0, if `linesizes[0]` is 0 (VIDEO_FORMAT_NONE), `bmalloc(0)`\nis called, and `frame->data[0]` is set to a zero-byte allocation. The inner\nloop then correctly skips i=0 since linesizes[0]=0, but linesize[0] is still\nset to 0 outside the loop so that's fine. The real issue: `bmalloc(size)` is\ncalled with `size==0` when format is VIDEO_FORMAT_NONE, and then\n`frame->linesize[0]` is still set to `linesizes[0]` (0). The allocation itself\nis technically benign (bmalloc(0) behaviour), but `frame->data[0]` is a\ndangling non-NULL pointer to a zero-byte allocation that is then passed to\n`video_frame_free` -> `bfree(frame->data[0])`, which is fine. The deeper bug:\n`frame->data[0]` is set unconditionally to `bmalloc(size)` even when size==0,\ni.e. for VIDEO_FORMAT_NONE a pointless allocation is made and `linesize[0]` is\nset to 0. Minor resource waste.\n\nThe real bug found: for plane 0, `linesize[0]` is assigned from `linesizes[0]`\nunconditionally, even though linesizes[0] might not have been computed (e.g.\nfor VIDEO_FORMAT_NONE it is 0 by the memset). This is fine. The genuine issue\nis the off-by-one in the loop: planes 1..N-1 get `data[i] = data[0] + offsets[i-1]`\nbut `offsets` is only written for planes that are non-zero. If plane 1 is zero\n(e.g. Y800 has only one plane), then `offsets[0]` is never written, remaining\n0 from the memset, so `data[1] = data[0] + 0 = data[0]` - same address as\nplane 0. Since `linesizes[1]==0` that branch is skipped, so `data[1]` remains\nNULL from the initial memset of `frame`. Actually the inner loop checks\n`if (!linesizes[i] || !heights[i]) continue;` so plane 1 for Y800 is skipped\ncorrectly and `data[1]` stays NULL. This is correct behavior.\n\nREAL BUG: In `video_frame_init` at line 219, `offsets[i] = size` is assigned\ninside the loop that may skip some planes. If plane 1 is empty but plane 2 is\nnot, `offsets[1]` is never written (stays 0), and `data[2] = data[0] + offsets[1]`\n= `data[0]`, aliasing plane 0. This can happen for exotic formats where a middle\nplane is absent. In practice all current formats are contiguous, but the logic\nis fragile.","fix":"Track a separate `offset` accumulator for the next plane's start, distinct from\nthe per-plane `offsets[]` array, so planes are never aliased even if a middle\nplane is skipped:\n\n```c\nsize_t next_offset = 0;\nfor (uint32_t i = 0; i < MAX_AV_PLANES; i++) {\n    if (!linesizes[i] || !heights[i])\n        continue;\n    size_t plane_size = (size_t)linesizes[i] * (size_t)heights[i];\n    align_size(&plane_size, alignment);\n    offsets[i] = next_offset;\n    next_offset += plane_size;\n}\nsize = next_offset;\n\nframe->data[0] = bmalloc(size);\nframe->linesize[0] = linesizes[0];\n\nfor (uint32_t i = 1; i < MAX_AV_PLANES; i++) {\n    if (!linesizes[i] || !heights[i])\n        continue;\n    frame->data[i] = frame->data[0] + offsets[i];\n    frame->linesize[i] = linesizes[i];\n}\n```","locations":[{"ref":"libobs/media-io/video-frame.c:213-232","code":"  213 | \tfor (uint32_t i = 0; i < MAX_AV_PLANES; i++) {\n  214 | \t\tif (!linesizes[i] || !heights[i])\n  215 | \t\t\tcontinue;\n  216 | \t\tsize_t plane_size = (size_t)linesizes[i] * (size_t)heights[i];\n  217 | \t\talign_size(&plane_size, alignment);\n  218 | \t\tsize += plane_size;\n  219 | \t\toffsets[i] = size;\n  220 | \t}\n  221 | \n  222 | \t/* allocate memory */\n  223 | \tframe->data[0] = bmalloc(size);\n  224 | \tframe->linesize[0] = linesizes[0];\n  225 | \n  226 | \t/* apply plane data pointers according to offsets */\n  227 | \tfor (uint32_t i = 1; i < MAX_AV_PLANES; i++) {\n  228 | \t\tif (!linesizes[i] || !heights[i])\n  229 | \t\t\tcontinue;\n  230 | \t\tframe->data[i] = frame->data[0] + offsets[i - 1];\n  231 | \t\tframe->linesize[i] = linesizes[i];\n  232 | \t}","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-frame.c#L213-L232"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `obs-av1.c`, the `leb128` decoder uses a fixed shift of `i * 7` bits into a\n`uint64_t`, but the shift is computed as `(leb128_byte & 0x7f) << (i * 7)`.\nWhen `i >= 9`, `i * 7 = 63`, which is the maximum valid shift for a 64-bit\nvalue. For i=9 the multiplication `9*7=63` is fine, but at i=9 it shifts a\n`uint8_t` value (promoted to `int`) by 63 bits - for a non-zero value this is\nundefined behavior in C (shifting a signed 32-bit value by >= 32 bits).\nAdditionally, leb128 values wider than 63 bits can set bit 63, making the\nresult negative when interpreted as `int64_t`, although `uint64_t` is used here.\n\nThe outer loop runs for `i` in `[0, 7]` (i < 8), so i=7 is the maximum,\nmeaning the shift is at most 49 bits. This is within range. However, the loop\nlimit of 8 iterations only covers 56 bits of leb128 data (7 bits per byte * 8\nbytes = 56 bits), which is insufficient for full 64-bit leb128 values (which\nrequire up to 10 bytes / 70 bits). The documented purpose is correct for AV1\nOBU sizes (which are limited to about 32 bits in practice), but the comment\nclaims to decode `uint64_t` and the cap is inconsistent.\n\nAlso: `size--` on an unsigned `size_t` when `size == 0` wraps to `SIZE_MAX`\nrather than breaking, but the check `if (size-- < 1)` correctly evaluates\n`size < 1` before decrementing via post-decrement, so `size-- < 1` tests the\noriginal value. Wait - in C, `size-- < 1` evaluates `size < 1` (since post-\ndecrement returns the old value) and then decrements. So when `size == 0`,\n`size-- < 1` is `0 < 1 = true`, we break - correct. When `size > 0`, the\ncondition is false, we proceed and `size` has already been decremented. This\nis actually correct behavior. No bug here.\n\nThe real shift issue: when `i = 7` and `leb128_byte & 0x7f` is non-zero,\nthe expression `(leb128_byte & 0x7f) << (i * 7)` is `(uint8_t_val) << 49`.\n`leb128_byte & 0x7f` has type `int` (after integer promotion). Shifting an\n`int` by 49 is UB. The value should be cast to `uint64_t` first.","fix":"Cast to `uint64_t` before shifting, and fix the loop bound to 10 for full\nleb128 support:\n\n```c\nstatic inline uint64_t leb128(const uint8_t *buf, size_t size, size_t *len)\n{\n    uint64_t value = 0;\n    uint8_t leb128_byte;\n\n    *len = 0;\n\n    for (int i = 0; i < 10; i++) {\n        if (size-- < 1)\n            break;\n        (*len)++;\n        leb128_byte = buf[i];\n        value |= (uint64_t)(leb128_byte & 0x7f) << (i * 7);\n        if (!(leb128_byte & 0x80))\n            break;\n    }\n\n    return value;\n}\n```","locations":[{"ref":"libobs/obs-av1.c:9-27","code":"    9 | static inline uint64_t leb128(const uint8_t *buf, size_t size, size_t *len)\n   10 | {\n   11 | \tuint64_t value = 0;\n   12 | \tuint8_t leb128_byte;\n   13 | \n   14 | \t*len = 0;\n   15 | \n   16 | \tfor (int i = 0; i < 8; i++) {\n   17 | \t\tif (size-- < 1)\n   18 | \t\t\tbreak;\n   19 | \t\t(*len)++;\n   20 | \t\tleb128_byte = buf[i];\n   21 | \t\tvalue |= (leb128_byte & 0x7f) << (i * 7);\n   22 | \t\tif (!(leb128_byte & 0x80))\n   23 | \t\t\tbreak;\n   24 | \t}\n   25 | \n   26 | \treturn value;\n   27 | }","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-av1.c#L9-L27"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `obs-av1.c::obs_av1_keyframe`, after `parse_obu_header` returns, the code\nadvances via `start += obu_start + obu_size`. If `parse_obu_header` returns\nwith `obu_size == 0` AND `obu_start == 0` (e.g. on a zero-byte or otherwise\nmalformed trailing OBU), the loop does not advance at all - `start` stays\nunchanged, causing an infinite loop that will hang the encoder thread.\n\n`parse_obu_header` can return `obu_size == 0` and `obu_start > 0` (when the\nOBU header byte is consumed but `has_size_field` yields size 0), so the\nadvance of `obu_start` alone saves it in those cases. But if the buffer starts\nwith a valid 1-byte header (`has_size_field=1`, `size=0`), `obu_start` is\nincremented past the header byte, but `obu_size` is 0 from leb128. That means\nthe loop advances by `obu_start` bytes each iteration and will eventually reach\n`end`. However, if the very first byte is 0x00 (forbidden bit set / garbage),\n`parse_obu_header` returns all zeros immediately (since `size < 1` is false but\nall get_bits calls return 0, obu_type=0, extension_flag=0, has_size_field=0).\nThen `obu_size = size - 1` which for `size=end-start` > 0 gives a non-zero\nvalue, so the advance is fine.\n\nThe actual infinite-loop risk is: if `obu_start == 0` and `obu_size == 0`\nsimultaneously. This happens when `size == 1`, `extension_flag == 0`,\n`has_size_field == 1`, and `leb128` decodes 0 from the remaining 0 bytes\n(because `size - obu_start == 0`). In that case `obu_start = 1`, `obu_size = 0`\n=> advance by 1 byte. Not an infinite loop. But if `size == 0` initially the\nouter check `if (size < 1)` stops it. The pathological case: if `has_size_field=1`\nand the leb128 field encodes a value larger than the remaining buffer, `obu_size`\nwill be a huge value, and `start += obu_start + obu_size` will jump past `end`,\nmaking `start > end`. Then `while (start < end)` terminates correctly. Safe.\n\nThe loop in `obs_extract_av1_headers` has the same pattern. Both functions do\n`da_push_back_array(header, start, obu_start + obu_size)` when `obu_size == 0`\nand `obu_start > 0`, writing non-zero bytes, which is correct. But if\n`obu_size` is a large garbage value from leb128 overflow, the `da_push_back_array`\ncall will attempt to read `obu_start + obu_size` bytes starting from `start`,\nwhich is bounded by `end - start` in the pointer sense but the push_back will\nread beyond the original `packet` buffer, causing an OOB heap read.\n\nThe specific scenario: a crafted AV1 bitstream where an OBU's leb128 size\nfield encodes a value larger than the remaining buffer causes `obu_size` to be\nlarger than `end - start - obu_start`. The `da_push_back_array` call then reads\nmemory past the end of the input buffer.","fix":"After `parse_obu_header`, clamp `obu_size` to the remaining buffer space before\nusing it for array operations:\n\n```c\nconst size_t remaining = (size_t)(end - start);\nif (obu_start > remaining)\n    break;\nif (obu_size > remaining - obu_start)\n    obu_size = remaining - obu_start;\n\n// now safe to use obu_start + obu_size\n```\n\nAlso add a guard against zero advance to prevent potential infinite loops in\nunusual cases:\n\n```c\nif (obu_start + obu_size == 0)\n    break;\nstart += obu_start + obu_size;\n```","locations":[{"ref":"libobs/obs-av1.c:181-208","code":"  181 | void obs_extract_av1_headers(const uint8_t *packet, size_t size, uint8_t **new_packet_data, size_t *new_packet_size,\n  182 | \t\t\t     uint8_t **header_data, size_t *header_size)\n  183 | {\n  184 | \tDARRAY(uint8_t) new_packet;\n  185 | \tDARRAY(uint8_t) header;\n  186 | \tconst uint8_t *start = packet, *end = packet + size;\n  187 | \n  188 | \tda_init(new_packet);\n  189 | \tda_init(header);\n  190 | \n  191 | \twhile (start < end) {\n  192 | \t\tsize_t obu_start, obu_size;\n  193 | \t\tint obu_type;\n  194 | \t\tparse_obu_header(start, end - start, &obu_start, &obu_size, &obu_type);\n  195 | \n  196 | \t\tif (obu_type == OBS_OBU_METADATA || obu_type == OBS_OBU_SEQUENCE_HEADER) {\n  197 | \t\t\tda_push_back_array(header, start, obu_start + obu_size);\n  198 | \t\t}\n  199 | \t\tda_push_back_array(new_packet, start, obu_start + obu_size);\n  200 | \n  201 | \t\tstart += obu_start + obu_size;\n  202 | \t}\n  203 | \n  204 | \t*new_packet_data = new_packet.array;\n  205 | \t*new_packet_size = new_packet.num;\n  206 | \t*header_data = header.array;\n  207 | \t*header_size = header.num;\n  208 | }","lines":28,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-av1.c#L181-L208"},{"ref":"libobs/obs-av1.c:157-179","code":"  157 | bool obs_av1_keyframe(const uint8_t *data, size_t size)\n  158 | {\n  159 | \tconst uint8_t *start = data, *end = data + size;\n  160 | \n  161 | \twhile (start < end) {\n  162 | \t\tsize_t obu_start, obu_size;\n  163 | \t\tint obu_type;\n  164 | \t\tparse_obu_header(start, end - start, &obu_start, &obu_size, &obu_type);\n  165 | \n  166 | \t\tif (obu_size) {\n  167 | \t\t\tif (obu_type == OBS_OBU_FRAME || obu_type == OBS_OBU_FRAME_HEADER) {\n  168 | \t\t\t\tuint8_t val = *(start + obu_start);\n  169 | \t\t\t\tif (!get_bits(val, 0, 1))                // show_existing_frame\n  170 | \t\t\t\t\treturn get_bits(val, 1, 2) == 0; // frame_type\n  171 | \t\t\t\treturn false;\n  172 | \t\t\t}\n  173 | \t\t}\n  174 | \n  175 | \t\tstart += obu_start + obu_size;\n  176 | \t}\n  177 | \n  178 | \treturn false;\n  179 | }","lines":23,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-av1.c#L157-L179"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`item_default_data_addref` guards on `item->data_size` (the user-value size) instead of\n`item->default_size`. When a default `OBS_DATA_OBJECT` or `OBS_DATA_ARRAY` value is set on\nan item that has no user value (`data_size == 0`), the guard causes an early return and the\nreferenced `obs_data_t *` / `obs_data_array_t *` never has its reference count incremented.\nThe matching `item_default_data_release` does run and decrements the reference count, which\ncan drop it to zero and free the object while callers still hold it. This leads to\nuse-after-free if `obs_data_set_default_obj` or `obs_data_set_default_array` is called and\nno user value has been written to the same key.","fix":"Change the guard from `item->data_size` to `item->default_size`:\n```c\nstatic inline void item_default_data_addref(struct obs_data_item *item)\n{\n\tif (!item->default_size)\n\t\treturn;\n\n\tif (item->type == OBS_DATA_OBJECT) {\n\t\tobs_data_t *obj = get_item_default_obj(item);\n\t\tobs_data_addref(obj);\n\t} else if (item->type == OBS_DATA_ARRAY) {\n\t\tobs_data_array_t *array = get_item_default_array(item);\n\t\tobs_data_array_addref(array);\n\t}\n}\n```","locations":[{"ref":"libobs/obs-data.c:237-250","code":"  237 | static inline void item_default_data_addref(struct obs_data_item *item)\n  238 | {\n  239 | \tif (!item->data_size)\n  240 | \t\treturn;\n  241 | \n  242 | \tif (item->type == OBS_DATA_OBJECT) {\n  243 | \t\tobs_data_t *obj = get_item_default_obj(item);\n  244 | \t\tobs_data_addref(obj);\n  245 | \n  246 | \t} else if (item->type == OBS_DATA_ARRAY) {\n  247 | \t\tobs_data_array_t *array = get_item_default_array(item);\n  248 | \t\tobs_data_array_addref(array);\n  249 | \t}\n  250 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-data.c#L237-L250"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`obs_data_item_destroy` performs `HASH_DEL(item->parent->items, item)` to remove the item\nfrom the uthash table but does NOT clear `item->parent` afterwards. It then calls\n`obs_data_item_detach(item)`, which checks `item->parent` and calls `HASH_DEL` a second\ntime on the same item. Calling `HASH_DEL` on a node that has already been removed corrupts\nthe uthash internal linked list (it updates predecessor/successor pointers that no longer\nrefer to this item), silently corrupting the hash table used for all `obs_data` key lookups.","fix":"Clear `item->parent` immediately after the first `HASH_DEL`, making the\nsubsequent `obs_data_item_detach` call a no-op:\n```c\nstatic inline void obs_data_item_destroy(struct obs_data_item *item)\n{\n\tif (item->parent) {\n\t\tHASH_DEL(item->parent->items, item);\n\t\titem->parent = NULL;  /* prevent double-HASH_DEL via obs_data_item_detach */\n\t}\n\n\titem_data_release(item);\n\titem_default_data_release(item);\n\titem_autoselect_data_release(item);\n\tobs_data_item_detach(item);\n\tbfree(item);\n}\n```","locations":[{"ref":"libobs/obs-data.c:341-351","code":"  341 | static inline void obs_data_item_destroy(struct obs_data_item *item)\n  342 | {\n  343 | \tif (item->parent)\n  344 | \t\tHASH_DEL(item->parent->items, item);\n  345 | \n  346 | \titem_data_release(item);\n  347 | \titem_default_data_release(item);\n  348 | \titem_autoselect_data_release(item);\n  349 | \tobs_data_item_detach(item);\n  350 | \tbfree(item);\n  351 | }","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-data.c#L341-L351"},{"ref":"libobs/obs-data.c:305-311","code":"  305 | static inline void obs_data_item_detach(struct obs_data_item *item)\n  306 | {\n  307 | \tif (item->parent) {\n  308 | \t\tHASH_DEL(item->parent->items, item);\n  309 | \t\titem->parent = NULL;\n  310 | \t}\n  311 | }","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-data.c#L305-L311"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `load_binding`, the guard condition `!modifiers` (line 482) tests whether the pointer `modifiers` is null. `modifiers` is `&combo.modifiers` - a pointer to a local stack variable - so it can never be null. The intended check was `!*modifiers` (no modifier flags set). As written, bindings with no key (`OBS_KEY_NONE` or invalid key) and zero modifiers are incorrectly accepted and silently stored as empty bindings, while the filter that was meant to reject them is never triggered.","fix":"Change `!modifiers` to `!*modifiers`:\n```c\n/* before */\nif (!modifiers && (combo.key == OBS_KEY_NONE || combo.key >= OBS_KEY_LAST_VALUE))\n    return;\n\n/* after */\nif (!*modifiers && (combo.key == OBS_KEY_NONE || combo.key >= OBS_KEY_LAST_VALUE))\n    return;\n```","locations":[{"ref":"libobs/obs-hotkey.c:474-485","code":"  474 | \tobs_key_combination_t combo = {0};\n  475 | \tuint32_t *modifiers = &combo.modifiers;\n  476 | \tload_modifier(modifiers, data, \"shift\", INTERACT_SHIFT_KEY);\n  477 | \tload_modifier(modifiers, data, \"control\", INTERACT_CONTROL_KEY);\n  478 | \tload_modifier(modifiers, data, \"alt\", INTERACT_ALT_KEY);\n  479 | \tload_modifier(modifiers, data, \"command\", INTERACT_COMMAND_KEY);\n  480 | \n  481 | \tcombo.key = obs_key_from_name(obs_data_get_string(data, \"key\"));\n  482 | \tif (!modifiers && (combo.key == OBS_KEY_NONE || combo.key >= OBS_KEY_LAST_VALUE))\n  483 | \t\treturn;\n  484 | \n  485 | \tcreate_binding(hotkey, combo);","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-hotkey.c#L474-L485"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`platform_keyboard_keymap` does not check whether `xkb_keymap_new_from_string` returns\nNULL (which it does when the keymap string is malformed or the xkb context is in an error\nstate). After a failure:\n- `plat->xkb_keymap` is set to NULL.\n- `xkb_state_new(NULL)` is called immediately after, which dereferences NULL inside the\n  xkb library and crashes.\n- Even if `xkb_state_new` somehow survived, `rebuild_keymap_data` calls\n  `xkb_keymap_key_for_each(NULL, ...)`, which also dereferences NULL.\nA misbehaving or malicious compositor can send a garbage keymap string and crash OBS.","fix":"Guard against a NULL keymap after `xkb_keymap_new_from_string`:\n\n```c\nstruct xkb_keymap *xkb_keymap = xkb_keymap_new_from_string(\n    plat->xkb_context, keymap_shm, XKB_KEYMAP_FORMAT_TEXT_V1,\n    XKB_KEYMAP_COMPILE_NO_FLAGS);\nmunmap(keymap_shm, size);\nclose(fd);\n\nif (!xkb_keymap) {\n    blog(LOG_WARNING, \"[wayland] failed to compile keymap\");\n    return;\n}\n\nxkb_keymap_unref(plat->xkb_keymap);\nxkb_state_unref(plat->xkb_state);\nplat->xkb_keymap = xkb_keymap;\nplat->xkb_state = xkb_state_new(xkb_keymap);\nrebuild_keymap_data(plat);\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:89-100","code":"   89 | \tstruct xkb_keymap *xkb_keymap = xkb_keymap_new_from_string(\n   90 | \t\tplat->xkb_context, keymap_shm, XKB_KEYMAP_FORMAT_TEXT_V1, XKB_KEYMAP_COMPILE_NO_FLAGS);\n   91 | \tmunmap(keymap_shm, size);\n   92 | \tclose(fd);\n   93 | \n   94 | \t// cleanup old keymap and state\n   95 | \txkb_keymap_unref(plat->xkb_keymap);\n   96 | \txkb_state_unref(plat->xkb_state);\n   97 | \n   98 | \tplat->xkb_keymap = xkb_keymap;\n   99 | \tplat->xkb_state = xkb_state_new(xkb_keymap);\n  100 | \trebuild_keymap_data(plat);","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L89-L100"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`XKB_KEY_XF86AudioRaiseVolume` is mapped to `OBS_KEY_VK_VOLUME_DOWN` and\n`XKB_KEY_XF86AudioLowerVolume` is mapped to `OBS_KEY_VK_VOLUME_UP` -- both swapped.\nThe same inversion exists in the reverse function `obs_nix_wayland_key_to_virtual_key`.\nOn Windows, `OBS_KEY_VK_VOLUME_DOWN` correctly maps to `VK_VOLUME_DOWN` (the volume-down\nkey). On Wayland, however, pressing the physical volume-down key (`XF86AudioLowerVolume`)\nis recorded as `OBS_KEY_VK_VOLUME_UP`, and vice-versa. This breaks cross-platform hotkey\nportability: a hotkey bound to \"Volume Down\" on Windows will fire on the volume-up key\non Wayland.","fix":"Swap the two XKB keysym constants to match the correct semantic:\n\n```c\n// obs_nix_wayland_key_from_virtual_key\ncase XKB_KEY_XF86AudioRaiseVolume:\n    return OBS_KEY_VK_VOLUME_UP;\ncase XKB_KEY_XF86AudioLowerVolume:\n    return OBS_KEY_VK_VOLUME_DOWN;\n\n// obs_nix_wayland_key_to_virtual_key\ncase OBS_KEY_VK_VOLUME_DOWN:\n    return XKB_KEY_XF86AudioLowerVolume;\ncase OBS_KEY_VK_VOLUME_UP:\n    return XKB_KEY_XF86AudioRaiseVolume;\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:1046-1049","code":" 1046 | \tcase XKB_KEY_XF86AudioRaiseVolume:\n 1047 | \t\treturn OBS_KEY_VK_VOLUME_DOWN;\n 1048 | \tcase XKB_KEY_XF86AudioLowerVolume:\n 1049 | \t\treturn OBS_KEY_VK_VOLUME_UP;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L1046-L1049"},{"ref":"libobs/obs-nix-wayland.c:1607-1610","code":" 1607 | \tcase OBS_KEY_VK_VOLUME_DOWN:\n 1608 | \t\treturn XKB_KEY_XF86AudioRaiseVolume;\n 1609 | \tcase OBS_KEY_VK_VOLUME_UP:\n 1610 | \t\treturn XKB_KEY_XF86AudioLowerVolume;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L1607-L1610"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The capture guard `if (data.handle != nullptr && capture_ready())` was added (commit `0b87f533b2`) to guard against uninitialized captures, but `data.handle` in `struct d3d9_data` is a standalone field that is assigned only in the shared-texture path (`d3d9_shtex_init_shtex` via `res->GetSharedHandle(&data.handle)`). In shared-memory mode (`d3d9_shmem_init` / `d3d9_shmem_init_buffers`) `data.handle` is never set, so it stays `NULL` after the `memset(&data, 0, ...)` in `d3d9_free`. Unlike `d3d10_data`/`d3d11_data`/`d3d12_data`, where `handle` lives in a `union` overlapping a `copy_surfaces`/`copy_tex` pointer that is non-null in shmem mode, `d3d9_data` has no such union. As a result `data.handle` is always `nullptr` in d3d9 shmem mode and `d3d9_shmem_capture` is never invoked, completely breaking d3d9 shared-memory capture (used when `force_shmem` is set, or for non-`IDirect3DDevice9Ex` devices with no available patch offset).","fix":"Guard on a condition that is valid in both modes instead of `data.handle`. For example:\n```cpp\nconst bool initialized = data.using_shtex ? (data.handle != nullptr) : (data.copy_surfaces[0] != nullptr);\nif (initialized && capture_ready()) {\n```\nor set/track a dedicated `bool` initialized flag that both `d3d9_shtex_init` and `d3d9_shmem_init` set on success.","locations":[{"ref":"plugins/win-capture/graphics-hook/d3d9-capture.cpp:555","code":"  555 | \tif (data.handle != nullptr && capture_ready()) {","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/graphics-hook/d3d9-capture.cpp#L555"},{"ref":"plugins/win-capture/graphics-hook/d3d9-capture.cpp:26-53","code":"   26 | struct d3d9_data {\n   27 | \tHMODULE d3d9;\n   28 | \tIDirect3DDevice9 *device; /* do not release */\n   29 | \tuint32_t cx;\n   30 | \tuint32_t cy;\n   31 | \tD3DFORMAT d3d9_format;\n   32 | \tDXGI_FORMAT dxgi_format;\n   33 | \tbool using_shtex;\n   34 | \n   35 | \t/* shared texture */\n   36 | \tIDirect3DSurface9 *d3d9_copytex;\n   37 | \tID3D11Device *d3d11_device;\n   38 | \tID3D11DeviceContext *d3d11_context;\n   39 | \tID3D11Resource *d3d11_tex;\n   40 | \tstruct shtex_data *shtex_info;\n   41 | \tHANDLE handle;\n   42 | \tint patch;\n   43 | \n   44 | \t/* shared memory */\n   45 | \tIDirect3DSurface9 *copy_surfaces[NUM_BUFFERS];\n   46 | \tIDirect3DQuery9 *queries[NUM_BUFFERS];\n   47 | \tstruct shmem_data *shmem_info;\n   48 | \tbool texture_mapped[NUM_BUFFERS];\n   49 | \tvolatile bool issued_queries[NUM_BUFFERS];\n   50 | \tuint32_t pitch;\n   51 | \tint cur_tex;\n   52 | \tint copy_wait;\n   53 | };","lines":28,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/graphics-hook/d3d9-capture.cpp#L26-L53"},{"ref":"plugins/win-capture/graphics-hook/d3d9-capture.cpp:294-343","code":"  294 | static bool d3d9_shmem_init_buffers(size_t buffer)\n  295 | {\n  296 | \tHRESULT hr;\n  297 | \n  298 | \thr = data.device->CreateOffscreenPlainSurface(data.cx, data.cy, data.d3d9_format, D3DPOOL_SYSTEMMEM,\n  299 | \t\t\t\t\t\t      &data.copy_surfaces[buffer], nullptr);\n  300 | \tif (FAILED(hr)) {\n  301 | \t\thlog_hr(\"d3d9_shmem_init_buffers: Failed to create surface\", hr);\n  302 | \t\treturn false;\n  303 | \t}\n  304 | \n  305 | \tif (buffer == 0) {\n  306 | \t\tD3DLOCKED_RECT rect;\n  307 | \t\thr = data.copy_surfaces[buffer]->LockRect(&rect, nullptr, D3DLOCK_READONLY);\n  308 | \t\tif (FAILED(hr)) {\n  309 | \t\t\thlog_hr(\"d3d9_shmem_init_buffers: Failed to lock \"\n  310 | \t\t\t\t\"buffer\",\n  311 | \t\t\t\thr);\n  312 | \t\t\treturn false;\n  313 | \t\t}\n  314 | \n  315 | \t\tdata.pitch = rect.Pitch;\n  316 | \t\tdata.copy_surfaces[buffer]->UnlockRect();\n  317 | \t}\n  318 | \n  319 | \thr = data.device->CreateQuery(D3DQUERYTYPE_EVENT, &data.queries[buffer]);\n  32
