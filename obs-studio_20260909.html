{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `qsv_encoder_open()` and `qsv_encoder_close()` the code does `delete pEncoder;` followed by `if (pEncoder) { is_active.store(false); }`. `delete` does not null out the pointer, so `pEncoder` is always non-`NULL` after the delete and the guard is meaningless (and misleadingly implies a real check). The intent (unconditionally mark inactive) is achieved only by accident.","fix":"Drop the useless `if (pEncoder)` guard and store the flag unconditionally, e.g. `delete pEncoder; is_active.store(false);`.","locations":[{"ref":"plugins/obs-qsv11/QSV_Encoder.cpp:129-133","code":"  129 | \t\tdelete pEncoder;\n  130 | \t\tif (pEncoder) {\n  131 | \t\t\tis_active.store(false);\n  132 | \t\t}\n  133 | \t\treturn NULL;","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/QSV_Encoder.cpp#L129-L133"},{"ref":"plugins/obs-qsv11/QSV_Encoder.cpp:202-208","code":"  202 | \tdelete pEncoder;\n  203 | \n  204 | \tif (pEncoder) {\n  205 | \t\tis_active.store(false);\n  206 | \t}\n  207 | \n  208 | \treturn 0;","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/QSV_Encoder.cpp#L202-L208"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`ShowAuthors` sets the text browser to the raw file path (`setPlainText(QString::fromStdString(path))`) and then immediately overwrites it with the file contents on the same synchronous path. The first call is leftover/debug dead code that never becomes visible.","fix":"Remove the line `ui->textBrowser->setPlainText(QString::fromStdString(path));`.","locations":[{"ref":"frontend/dialogs/OBSAbout.cpp:142","code":"  142 | \tui->textBrowser->setPlainText(QString::fromStdString(path));","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSAbout.cpp#L142"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `TwitchAuth::RetryLogin` and `RestreamAuth::RetryLogin` a fresh auth object is allocated (`std::make_shared<TwitchAuth>(twitchDef)` / `std::make_shared<RestreamAuth>(restreamDef)`) but never used - the subsequent `GetToken(...)` is called on `this`, and the local `auth` is discarded at scope exit. This is a pointless heap allocation/construction (each also runs the constructor side effects) with no effect.","fix":"Remove the unused `std::shared_ptr<...> auth = std::make_shared<...>(...)` line in both `RetryLogin` implementations.","locations":[{"ref":"frontend/oauth/TwitchAuth.cpp:460","code":"  460 | \tstd::shared_ptr<TwitchAuth> auth = std::make_shared<TwitchAuth>(twitchDef);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/oauth/TwitchAuth.cpp#L460"},{"ref":"frontend/oauth/RestreamAuth.cpp:230","code":"  230 | \tstd::shared_ptr<RestreamAuth> auth = std::make_shared<RestreamAuth>(restreamDef);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/oauth/RestreamAuth.cpp#L230"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `Decompress`, the error checks are ordered so that `if (result != size) return -9;` runs before `if (ZSTD_isError(result)) return -10;`. When ZSTD fails, `result` is a large error sentinel that is never equal to `size`, so the function always returns `-9` and the `-10`/`ZSTD_isError` branch is unreachable dead code, masking the more specific decompression-error return value.","fix":"Check the error first:\n```cpp\nif (ZSTD_isError(result))\n\treturn -10;\nif (result != size)\n\treturn -9;\n```","locations":[{"ref":"frontend/updater/updater.cpp:410-417","code":"  410 | \tsize_t result = ZSTD_decompressDCtx(ctx, buf.data(), buf.size(), comp.data(), comp.size());\n  411 | \n  412 | \tif (result != size) {\n  413 | \t\treturn -9;\n  414 | \t}\n  415 | \tif (ZSTD_isError(result)) {\n  416 | \t\treturn -10;\n  417 | \t}","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/updater/updater.cpp#L410-L417"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `undo_stack::add_action`, the stack-trim loop copies the back element into an unused local before popping: `undo_redo_t item = undo_items.back(); undo_items.pop_back();`. The copy of a `undo_redo_t` (two `std::string`s plus two `std::function`s) is never used, wasting an allocation/copy per trimmed item.","fix":"Drop the copy: `while (undo_items.size() >= MAX_STACK_SIZE) { undo_items.pop_back(); }`.","locations":[{"ref":"frontend/utility/undo_stack.cpp:41-44","code":"   41 | \twhile (undo_items.size() >= MAX_STACK_SIZE) {\n   42 | \t\tundo_redo_t item = undo_items.back();\n   43 | \t\tundo_items.pop_back();\n   44 | \t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/undo_stack.cpp#L41-L44"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `updatePreviewSources` the null check on `previewScene` is duplicated verbatim: the same `if (!previewScene) { return; }` appears twice back-to-back with no code in between, so the second check is unreachable dead code.","fix":"Delete the second `if (!previewScene) { return; }` block (lines 412-414).","locations":[{"ref":"frontend/widgets/AudioMixer.cpp:407-414","code":"  407 | \t\tobs_scene_t *previewScene = obs_scene_from_source(previewSource);\n  408 | \t\tif (!previewScene) {\n  409 | \t\t\treturn;\n  410 | \t\t}\n  411 | \n  412 | \t\tif (!previewScene) {\n  413 | \t\t\treturn;\n  414 | \t\t}","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/AudioMixer.cpp#L407-L414"}]},
{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`on_actionResetTransform_triggered` enumerates the scene with `reset_tr` a second time (line 998) after the redo snapshot `rwrapper` has already been captured. The first enum (line 990) already performed the reset and `rwrapper` recorded the reset state, so this trailing call is redundant (harmless only because `reset_tr` is idempotent) and looks like a leftover.","fix":"Remove the trailing redundant call:\n```cpp\n// delete this line\nobs_scene_enum_items(GetCurrentScene(), reset_tr, nullptr);\n```","locations":[{"ref":"frontend/widgets/OBSBasic_SceneItems.cpp:983-997","code":"  983 | \tif (source == nullptr) {\n  984 | \t\tOBSSceneItem item = GetCurrentSceneItem();\n  985 | \t\tsource = obs_sceneitem_get_source(item);\n  986 | \t}\n  987 | \tCreateFiltersWindow(source);\n  988 | }\n  989 | \n  990 | void OBSBasic::OpenProperties(OBSSource source)\n  991 | {\n  992 | \tif (source == nullptr) {\n  993 | \t\tOBSSceneItem item = GetCurrentSceneItem();\n  994 | \t\tsource = obs_sceneitem_get_source(item);\n  995 | \t}\n  996 | \tCreatePropertiesWindow(source);\n  997 | }","lines":15,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_SceneItems.cpp#L983-L997"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`basemath.hpp` contains only a TODO comment and no actual code. It is a placeholder file that contributes nothing to the build.","fix":"Either implement the C++ math wrappers as intended, or remove the file if it is no longer planned.","locations":[{"ref":"libobs/graphics/basemath.hpp:1-3","code":"    1 | #pragma once\n    2 | \n    3 | /* TODO: C++ math wrappers */","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/basemath.hpp#L1-L3"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `ffmpeg_image_orient`, the variable `off_src` is declared and zero-initialized at the top\nof the pixel loop (line 315 `size_t off_src = 0;`) but is unconditionally overwritten at the\ntop of the inner loop body (`off_src = (x + y * sx) * 4`). The initializer is dead.","fix":"Declare `off_src` without an initializer: `size_t off_src;`","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:314-315","code":"  314 | \tsize_t off_dst;\n  315 | \tsize_t off_src = 0;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics-ffmpeg.c#L314-L315"}]},
{"id":"DEAD_18","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The three Wayland listener structs `keyboard_listener`, `seat_listener`, and\n`registry_listener` are declared at file scope with external linkage (no `static`), but\nthey are not declared in any header and are never referenced outside `obs-nix-wayland.c`.\nExternal linkage is unnecessary and pollutes the global symbol namespace.","fix":"Add `static` to each listener definition: `static const struct wl_keyboard_listener keyboard_listener = ...`, etc.","locations":[{"ref":"libobs/obs-nix-wayland.c:162-169","code":"  162 | const struct wl_keyboard_listener keyboard_listener = {\n  163 | \t.keymap = platform_keyboard_keymap,\n  164 | \t.enter = platform_keyboard_enter,\n  165 | \t.leave = platform_keyboard_leave,\n  166 | \t.key = platform_keyboard_key,\n  167 | \t.modifiers = platform_keyboard_modifiers,\n  168 | \t.repeat_info = platform_keyboard_repeat_info,\n  169 | };","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L162-L169"},{"ref":"libobs/obs-nix-wayland.c:194-197","code":"  194 | const struct wl_seat_listener seat_listener = {\n  195 | \t.capabilities = platform_seat_capabilities,\n  196 | \t.name = platform_seat_name,\n  197 | };","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L194-L197"},{"ref":"libobs/obs-nix-wayland.c:223-226","code":"  223 | const struct wl_registry_listener registry_listener = {\n  224 | \t.global = platform_registry_handler,\n  225 | \t.global_remove = platform_registry_remover,\n  226 | };","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L223-L226"}]},
{"id":"DEAD_19","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `load_nvidia_vfx`, the local `old_sdk_loaded` is initialized to false (line 1090) and set to true (line 1156) but never read afterwards, so it has no effect.","fix":"Remove the `old_sdk_loaded` variable and its assignment, or use it as intended.","locations":[{"ref":"plugins/nv-filters/nvidia-videofx-filter.c:1090","code":" 1090 | \tbool old_sdk_loaded = false;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-videofx-filter.c#L1090"},{"ref":"plugins/nv-filters/nvidia-videofx-filter.c:1156","code":" 1156 | \told_sdk_loaded = true;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-videofx-filter.c#L1156"}]},
{"id":"DEAD_20","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The packet-flush loops use a variable `r_pkt` that is initialized to 1 and never modified, making `while (r_pkt)` an unconditional loop (exited only by the `break`) and the inner `if (r_pkt)` guard always true. The `r_pkt` variable and its check are pointless and misleading.","fix":"Remove `r_pkt` and write the loop plainly, e.g. `while (avcodec_receive_packet(enc->context, &pkt) >= 0) av_packet_unref(&pkt);`.","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c:468-479","code":"  468 | static inline void flush_remaining_packets(struct vaapi_encoder *enc)\n  469 | {\n  470 | \tint r_pkt = 1;\n  471 | \n  472 | \twhile (r_pkt) {\n  473 | \t\tif (avcodec_receive_packet(enc->context, enc->packet) < 0)\n  474 | \t\t\tbreak;\n  475 | \n  476 | \t\tif (r_pkt)\n  477 | \t\t\tav_packet_unref(enc->packet);\n  478 | \t}\n  479 | }","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-vaapi.c#L468-L479"},{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-video-encoders.c:122-135","code":"  122 | \t\tAVPacket pkt = {0};\n  123 | \t\tint r_pkt = 1;\n  124 | \n  125 | \t\t/* flush remaining data */\n  126 | \t\tavcodec_send_frame(enc->context, NULL);\n  127 | \n  128 | \t\twhile (r_pkt) {\n  129 | \t\t\tif (avcodec_receive_packet(enc->context, &pkt) < 0)\n  130 | \t\t\t\tbreak;\n  131 | \n  132 | \t\t\tif (r_pkt)\n  133 | \t\t\t\tav_packet_unref(&pkt);\n  134 | \t\t}\n  135 | \t}","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-video-encoders.c#L122-L135"}]},
{"id":"DEAD_21","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`last_ts` is computed via `convert_to_amf_ts(enc, pts - 1)` / `convert_to_amf_ts(enc, frame->pts - 1)` but never used in either `amf_encode_tex` or `amf_encode_fallback`.","fix":"Remove the unused `int64_t last_ts = ...;` lines.","locations":[{"ref":"plugins/obs-ffmpeg/texture-amf.cpp:865","code":"  865 | \tint64_t last_ts = convert_to_amf_ts(enc, pts - 1);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/texture-amf.cpp#L865"},{"ref":"plugins/obs-ffmpeg/texture-amf.cpp:970","code":"  970 | \tint64_t last_ts = convert_to_amf_ts(enc, frame->pts - 1);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/texture-amf.cpp#L970"}]},
{"id":"DEAD_22","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `serialize_av1_data()` the `default` case does `s_write(s, buf, len); size += len;`. `size` is the by-value function parameter and `end` was already computed from its original value at function entry, so mutating `size` here has no effect and is dead code that misleads readers into thinking the loop bound changes.","fix":"Remove the `size += len;` statement.","locations":[{"ref":"plugins/obs-outputs/rtmp-av1.c:579-582","code":"  579 | \t\tdefault:\n  580 | \t\t\ts_write(s, buf, len);\n  581 | \t\t\tsize += len;\n  582 | \t\t\tbreak;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/rtmp-av1.c#L579-L582"}]},
{"id":"DEAD_23","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`GetVideoParam()` calls `memset(&m_parameter, 0, sizeof(m_parameter));` twice in a row (lines 542 and 544) with only the unrelated `mfxExtCodingOptionSPSPPS opt;` declaration in between. The second memset is redundant.","fix":"Delete one of the two identical `memset(&m_parameter, 0, sizeof(m_parameter));` calls.","locations":[{"ref":"plugins/obs-qsv11/QSV_Encoder_Internal.cpp:542-544","code":"  542 | \tmemset(&m_parameter, 0, sizeof(m_parameter));\n  543 | \tmfxExtCodingOptionSPSPPS opt;\n  544 | \tmemset(&m_parameter, 0, sizeof(m_parameter));","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-qsv11/QSV_Encoder_Internal.cpp#L542-L544"}]},
{"id":"DEAD_24","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `oss_update` the failure branch contains `goto failed_state;` immediately followed by an unreachable `return;` statement.","fix":"Remove the dead `return;`:\n```c\n\tif (err)\n\t\tgoto failed_state;\n```","locations":[{"ref":"plugins/oss-audio/oss-input.c:427-431","code":"  427 | \tint err = oss_setup_device(handle);\n  428 | \tif (err) {\n  429 | \t\tgoto failed_state;\n  430 | \t\treturn;\n  431 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/oss-audio/oss-input.c#L427-L431"}]},
{"id":"DEAD_25","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `present_end`, the inner `if (!present_recurse)` is nested inside a block already entered under `if (!present_recurse)` with no modification of `present_recurse` in between, so the inner condition is always true and is redundant.","fix":"Remove the redundant inner check:\n```cpp\nif (!present_recurse) {\n\tif (global_hook_info->capture_overlay) {\n\t\td3d9_capture(device, backbuffer);\n\t}\n\tif (backbuffer) {\n\t\tbackbuffer->Release();\n\t}\n}\n```","locations":[{"ref":"plugins/win-capture/graphics-hook/d3d9-capture.cpp:594-601","code":"  594 | \tpresent_recurse--;\n  595 | \n  596 | \tif (!present_recurse) {\n  597 | \t\tif (global_hook_info->capture_overlay) {\n  598 | \t\t\tif (!present_recurse) {\n  599 | \t\t\t\td3d9_capture(device, backbuffer);\n  600 | \t\t\t}\n  601 | \t\t}","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/graphics-hook/d3d9-capture.cpp#L594-L601"}]},
{"id":"DEAD_26","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `GetDShowVideoInfo`, the statements `info->width = info->width;` and `info->height = info->height;` are self-assignments that do nothing (and the values are overwritten a few lines later anyway). They are leftover dead code.","fix":"Remove the two self-assignment lines `info->width = info->width;` and `info->height = info->height;`.","locations":[{"ref":"plugins/win-dshow/win-dshow-encoder.cpp:296-297","code":"  296 | \tinfo->width = info->width;\n  297 | \tinfo->height = info->height;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-dshow/win-dshow-encoder.cpp#L296-L297"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`docs/sphinx/conf.py` has `version = '27.2.0'` and `release = '27.2.0'` (lines 68-70).\nOBS Studio is well past version 31 as of this codebase, so the documented version is severely\nout of date and will mislead anyone referencing the built documentation.","fix":"Update to the current release version or, preferably, derive it automatically:\n\n```python\nimport subprocess\nversion = subprocess.check_output([\"git\", \"describe\", \"--tags\", \"--abbrev=0\"],\n                                   text=True).strip().lstrip(\"v\")\nrelease = version\n```","locations":[{"ref":"docs/sphinx/conf.py:68-70","code":"   68 | version = '27.2.0'\n   69 | # The full version, including alpha/beta/rc tags.\n   70 | release = '27.2.0'","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/docs/sphinx/conf.py#L68-L70"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The corner-mapping comments in `get_dst_position` for orientations 2-8 use bare `w` and `h`\nto describe destination coordinates (e.g. `(0, 0) -> (w, 0)`) but the actual formulas use\n`w - 1` and `h - 1` (zero-indexed). For example orientation 6 says `(0, 0) -> (w, 0)` but\nthe formula gives `res_x = w - 1 - y = w - 1`, `res_y = x = 0`, i.e. `(w-1, 0)`. The comments\nare consistently off by one, which makes them misleading when verifying the transform math.","fix":"Replace all bare `w` and `h` in the destination-coordinate comments with `w-1` and `h-1` to match the zero-indexed arithmetic used in the code.","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:142-291","code":"  142 | \tif (orient == 2) {\n  143 | \t\t/*\n  144 | \t\t * Orientation 2: Flip X\n  145 | \t\t *\n  146 | \t\t * 888888        888888\n  147 | \t\t *     88   ->   88\n  148 | \t\t *   8888   ->   8888\n  149 | \t\t *     88   ->   88\n  150 | \t\t *     88        88\n  151 | \t\t *\n  152 | \t\t * (0, 0) -> (w, 0)\n  153 | \t\t * (0, h) -> (w, h)\n  154 | \t\t * (w, 0) -> (0, 0)\n  155 | \t\t * (w, h) -> (0, h)\n  156 | \t\t *\n  157 | \t\t * (w - x, y)\n  158 | \t\t */\n  159 | \n  160 | \t\tres_x = w - 1 - x;\n  161 | \t\tres_y = y;\n  162 | \n  163 | \t} else if (orient == 3) {\n  164 | \t\t/*\n  165 | \t\t * Orientation 3: 180 degree\n  166 | \t\t *\n  167 | \t\t *     88        888888\n  168 | \t\t *     88   ->   88\n  169 | \t\t *   8888   ->   8888\n  170 | \t\t *     88   ->   88\n  171 | \t\t * 888888        88\n  172 | \t\t *\n  173 | \t\t * (0, 0) -> (w, h)\n  174 | \t\t * (0, h) -> (w, 0)\n  175 | \t\t * (w, 0) -> (0, h)\n  176 | \t\t * (w, h) -> (0, 0)\n  177 | \t\t *\n  178 | \t\t * (w - x, h - y)\n  179 | \t\t */\n  180 | \n  181 | \t\tres_x = w - 1 - x;\n  182 | \t\tres_y = h - 1 - y;\n  183 | \n  184 | \t} else if (orient == 4) {\n  185 | \t\t/*\n  186 | \t\t * Orientation 4: Flip Y\n  187 | \t\t *\n  188 | \t\t * 88            888888\n  189 | \t\t * 88       ->   88\n  190 | \t\t * 8888     ->   8888\n  191 | \t\t * 88       ->   88\n  192 | \t\t * 888888        88\n  193 | \t\t *\n  194 | \t\t * (0, 0) -> (0, h)\n  195 | \t\t * (0, h) -> (0, 0)\n  196 | \t\t * (w, 0) -> (w, h)\n  197 | \t\t * (w, h) -> (w, 0)\n  198 | \t\t *\n  199 | \t\t * (x, h - y)\n  200 | \t\t */\n  201 | \n  202 | \t\tres_x = x;\n  203 | \t\tres_y = h - 1 - y;\n  204 | \n  205 | \t} else if (orient == 5) {\n  206 | \t\t/*\n  207 | \t\t * Orientation 5: Flip Y + 90 degree CW\n  208 | \t\t *\n  209 | \t\t * 8888888888        888888\n  210 | \t\t * 88  88       ->   88\n  211 | \t\t * 88           ->   8888\n  212 | \t\t *              ->   88\n  213 | \t\t *                   88\n  214 | \t\t *\n  215 | \t\t * (0, 0) -> (0, 0)\n  216 | \t\t * (0, h) -> (w, 0)\n  217 | \t\t * (w, 0) -> (0, h)\n  218 | \t\t * (w, h) -> (w, h)\n  219 | \t\t *\n  220 | \t\t * (y, x)\n  221 | \t\t */\n  222 | \n  223 | \t\tres_x = y;\n  224 | \t\tres_y = x;\n  225 | \n  226 | \t} else if (orient == 6) {\n  227 | \t\t/*\n  228 | \t\t * Orientation 6: 90 degree CW\n  229 | \t\t *\n  230 | \t\t * 88                888888\n  231 | \t\t * 88  88       ->   88\n  232 | \t\t * 8888888888   ->   8888\n  233 | \t\t *              ->   88\n  234 | \t\t *                   88\n  235 | \t\t *\n  236 | \t\t * (0, 0) -> (w, 0)\n  237 | \t\t * (0, h) -> (0, 0)\n  238 | \t\t * (w, 0) -> (w, h)\n  239 | \t\t * (w, h) -> (0, h)\n  240 | \t\t *\n  241 | \t\t * (w - y, x)\n  242 | \t\t */\n  243 | \n  244 | \t\tres_x = w - 1 - y;\n  245 | \t\tres_y = x;\n  246 | \n  247 | \t} else if (orient == 7) {\n  248 | \t\t/*\n  249 | \t\t * Orientation 7: Flip Y + 90 degree CCW\n  250 | \t\t *\n  251 | \t\t *         88        888888\n  252 | \t\t *     88  88   ->   88\n  253 | \t\t * 8888888888   ->   8888\n  254 | \t\t *              ->   88\n  255 | \t\t *                   88\n  25 {"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Three functions log the wrong function name in their warning/error messages:\n- `obs_encoder_video()` logs `\"obs_encoder_set_video\"` instead of `\"obs_encoder_video\"`.\n- `obs_encoder_audio()` logs `\"obs_encoder_set_audio\"` instead of `\"obs_encoder_audio\"`.\n- `obs_encoder_get_frame_rate_divisor()` logs and validates under `\"obs_encoder_set_frame_rate_divisor\"`\n  instead of `\"obs_encoder_get_frame_rate_divisor\"`.\nThese wrong names make log-based debugging misleading.","fix":"Replace each wrong string literal with the actual function name:\n- `obs_encoder_video` -> `\"obs_encoder_video\"`\n- `obs_encoder_audio` -> `\"obs_encoder_audio\"`\n- `obs_encoder_get_frame_rate_divisor` both in the `obs_encoder_valid` call and in the `blog` call.","locations":[{"ref":"libobs/obs-encoder.c:1274-1278","code":" 1274 | \t\tblog(LOG_WARNING,\n 1275 | \t\t     \"obs_encoder_set_video: \"\n 1276 | \t\t     \"encoder '%s' is not a video encoder\",\n 1277 | \t\t     obs_encoder_get_name(encoder));\n 1278 | \t\treturn NULL;","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L1274-L1278"},{"ref":"libobs/obs-encoder.c:1304-1308","code":" 1304 | \t\tblog(LOG_WARNING,\n 1305 | \t\t     \"obs_encoder_set_audio: \"\n 1306 | \t\t     \"encoder '%s' is not an audio encoder\",\n 1307 | \t\t     obs_encoder_get_name(encoder));\n 1308 | \t\treturn NULL;","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L1304-L1308"},{"ref":"libobs/obs-encoder.c:1121-1130","code":" 1121 | \tif (!obs_encoder_valid(encoder, \"obs_encoder_set_frame_rate_divisor\"))\n 1122 | \t\treturn 0;\n 1123 | \n 1124 | \tif (encoder->info.type != OBS_ENCODER_VIDEO) {\n 1125 | \t\tblog(LOG_WARNING,\n 1126 | \t\t     \"obs_encoder_set_frame_rate_divisor: \"\n 1127 | \t\t     \"encoder '%s' is not a video encoder\",\n 1128 | \t\t     obs_encoder_get_name(encoder));\n 1129 | \t\treturn 0;\n 1130 | \t}","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.c#L1121-L1130"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment block for the `fer` field in `struct encoder_packet_time` opens with\n\"FERC (Frame Encode Request)\" but `fer` stands for Frame Encode Request, not FERC.\nThe `ferc` field below is correctly named Frame Encode Request Complete. The copy-paste\nerror makes the two fields look identical in description. Additionally, line 82 in the same\ncomment says \"FERC - FEC measures the actual encode time\" but should say \"FERC - FER\"\n(comparing the two timestamps for the same frame event).","fix":"Change the comment header from `FERC (Frame Encode Request)` to `FER (Frame Encode Request)`, and change `FERC - FEC` on line 82 to `FERC - FER`.","locations":[{"ref":"libobs/obs-encoder.h:74-88","code":"   74 | \t/* FERC (Frame Encode Request) is when the frame was\n   75 | \t * submitted to the encoder for encoding via the encode\n   76 | \t * callback (e.g. encode_texture2()), captured via os_gettime_ns().\n   77 | \t */\n   78 | \tuint64_t fer;\n   79 | \n   80 | \t/* FERC (Frame Encode Request Complete) is when\n   81 | \t * the associated FER event completed. If the encode\n   82 | \t * is synchronous with the call, this means FERC - FEC\n   83 | \t * measures the actual encode time, otherwise if the\n   84 | \t * encode is asynchronous, it measures the pipeline\n   85 | \t * delay between encode request and encode complete.\n   86 | \t * FERC is also captured via os_gettime_ns().\n   87 | \t */\n   88 | \tuint64_t ferc;","lines":15,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-encoder.h#L74-L88"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The duplicate log message uses `name.c_str()` (the new filter name) for both the filter name and the 'from' source of the duplication, so it logs `from '<new name>'` instead of the source being duplicated from. Cosmetic logging inaccuracy.","fix":"Pass the intended original source name for the third `%s` (e.g. `sourceName`) rather than repeating `name.c_str()`.","locations":[{"ref":"frontend/dialogs/OBSBasicFilters.cpp:948-951","code":"  948 | \t\tblog(LOG_INFO,\n  949 | \t\t     \"User duplicated filter '%s' (%s) from '%s' \"\n  950 | \t\t     \"to source '%s'\",\n  951 | \t\t     name.c_str(), id, name.c_str(), sourceName);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicFilters.cpp#L948-L951"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment for `censoredJson` says it replaces non-empty `\"authorization\"` property values with `\"CENSORED\"`, but the implementation (`censorRecurse`) actually censors the `\"authentication\"` key, not `\"authorization\"`. The comment names the wrong field, which is misleading for callers reasoning about what is redacted from logs.","fix":"Change the comment to reference `\"authentication\"`:\n```\n * Returns the input serialized to JSON, but any non-empty \"authentication\"\n * properties have their values replaced by \"CENSORED\".\n```","locations":[{"ref":"frontend/utility/GoLiveAPI_CensoredJson.hpp:8-11","code":"    8 | /**\n    9 |  * Returns the input serialized to JSON, but any non-empty \"authorization\"\n   10 |  * properties have their values replaced by \"CENSORED\".\n   11 |  */","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/GoLiveAPI_CensoredJson.hpp#L8-L11"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment for `bitsPerComponent` says \"Returns the bytes used per color component\" but the property returns bits (`bitsPerPixel / componentCount`), and the name itself is `bitsPerComponent`. The comment is misleading.","fix":"Change the comment to \"Returns the bits used per color component of the pixel format\".","locations":[{"ref":"libobs-metal/MTLPixelFormat+Extensions.swift:335","code":"  335 |     /// Returns the bytes used per color component of the pixel format","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/MTLPixelFormat+Extensions.swift#L335"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`effect-parser.c` lines 1096-1099: a block of commented-out code (`/* static bool ep_parse_param_property ... */`) and a commented-out call site (`/* if (...) ... */` at line 1116-1117) have been left in for an unimplemented feature. This is dead code masquerading as comments and adds noise.","fix":"Remove the commented-out code or open a tracked issue and replace it with a single `/* TODO: implement property parsing */` comment on one line.","locations":[{"ref":"libobs/graphics/effect-parser.c:1096-1099","code":" 1096 | /* static bool ep_parse_param_property(struct effect_parser *ep,\n 1097 | \t\tstruct ep_param *param)\n 1098 | {\n 1099 | } */","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/effect-parser.c#L1096-L1099"},{"ref":"libobs/graphics/effect-parser.c:1115-1117","code":" 1115 | \t/*\n 1116 | \tif (cf_token_is(&ep->cfp, \"<\") && !ep_parse_param_property(ep, &param))\n 1117 | \t\tgoto error; */","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/effect-parser.c#L1115-L1117"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `obs-av1.c` line 63, the comment says \"Pass a static 10 byte buffer in.\nThe max size for a leb128.\" A valid leb128 encoding of a 64-bit value requires\nat most 10 bytes (ceil(64/7) = 10). However, the `encode_uleb128` function\nencodes a `uint64_t` and writes into a caller-supplied buffer. The function\nitself does not enforce the 10-byte limit - it will write up to 10 bytes but\ncallers must ensure the buffer is large enough. The comment is accurate but\nthe lack of a bounds check makes it a code smell.\n\nAlso in `obs-av1.c` line 111, a comment says `metdata_obu()` (typo: missing\n'a' in 'metadata').","fix":"Fix the typo `metdata_obu()` -> `metadata_obu()` in the comment at line 115. Consider adding an assertion `assert(*len_out <= 10)` in `encode_uleb128` to catch buffer overflows in debug builds.","locations":[{"ref":"libobs/obs-av1.c:63","code":"   63 | // Pass a static 10 byte buffer in. The max size for a leb128.","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-av1.c#L63"},{"ref":"libobs/obs-av1.c:115","code":"  115 | \t * \tmetdata_obu()","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-av1.c#L115"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`OBS_MODULE_USE_DEFAULT_LOCALE` for the decklink-captions plugin is given the module name `\"decklink-captons\"` (missing the 'i' in \"captions\"). This is the identifier OBS uses to locate the module's locale data; the typo would cause locale lookups to miss if translation data existed under the correct name. Currently the plugin ships no locale data so the effect is only that the misspelled name is cosmetically wrong/inconsistent with the plugin id.","fix":"Change `OBS_MODULE_USE_DEFAULT_LOCALE(\"decklink-captons\", \"en-US\")` to `OBS_MODULE_USE_DEFAULT_LOCALE(\"decklink-captions\", \"en-US\")`.","locations":[{"ref":"plugins/decklink-captions/decklink-captions.cpp:8","code":"    8 | OBS_MODULE_USE_DEFAULT_LOCALE(\"decklink-captons\", \"en-US\")","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/decklink-captions/decklink-captions.cpp#L8"}]},

{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"`AudioCaptureToolbar.cpp` and `DisplayCaptureToolbar.cpp` define identical platform-dispatch macros (`get_os_module` / `get_os_text`) at file scope. These macros are copy-pasted verbatim between the two files. A shared header or a single inline helper function would eliminate the duplication and the risk of divergence.","fix":"Move the macros to a shared internal header (e.g. `ToolbarOSHelpers.hpp`) and include it from both files, or replace them with a small inline function:\n\n```cpp\nstatic inline obs_module_t *get_os_module(const char *win, const char *mac, const char *linux_mod)\n{\n#if defined(_WIN32)\n    return obs_get_module(win);\n#elif defined(__APPLE__)\n    return obs_get_module(mac);\n#else\n    return obs_get_module(linux_mod);\n#endif\n}\n```","locations":[{"ref":"frontend/components/AudioCaptureToolbar.cpp:5-14","code":"    5 | #ifdef _WIN32\n    6 | #define get_os_module(win, mac, linux) obs_get_module(win)\n    7 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, win)\n    8 | #elif __APPLE__\n    9 | #define get_os_module(win, mac, linux) obs_get_module(mac)\n   10 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, mac)\n   11 | #else\n   12 | #define get_os_module(win, mac, linux) obs_get_module(linux)\n   13 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, linux)\n   14 | #endif","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/AudioCaptureToolbar.cpp#L5-L14"},{"ref":"frontend/components/DisplayCaptureToolbar.cpp:5-14","code":"    5 | #ifdef _WIN32\n    6 | #define get_os_module(win, mac, linux) obs_get_module(win)\n    7 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, win)\n    8 | #elif __APPLE__\n    9 | #define get_os_module(win, mac, linux) obs_get_module(mac)\n   10 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, mac)\n   11 | #else\n   12 | #define get_os_module(win, mac, linux) obs_get_module(linux)\n   13 | #define get_os_text(mod, win, mac, linux) obs_module_get_locale_text(mod, linux)\n   14 | #endif","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/DisplayCaptureToolbar.cpp#L5-L14"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The `audio_monitor_init` pattern - checking `OBS_SOURCE_DO_NOT_SELF_MONITOR`, getting source settings, comparing device IDs with `devices_match`, and setting `monitor->ignore` - is duplicated identically across all three platform implementations: `coreaudio-output.c` (lines 173-183), `pulseaudio-output.c` (lines 359-369), and `wasapi-output.c` (lines 384-394). Any change to this logic must be made in three places.","fix":"Extract this logic into a shared helper in a platform-agnostic file (e.g., `libobs/obs-audio-monitoring.c`) that all three implementations call:\n```c\nstatic bool audio_monitor_check_self_monitor(struct audio_monitor *monitor,\n                                              obs_source_t *source,\n                                              const char *monitoring_id)\n{\n    if (!(source->info.output_flags & OBS_SOURCE_DO_NOT_SELF_MONITOR))\n        return false;\n    obs_data_t *s = obs_source_get_settings(source);\n    const char *s_dev_id = obs_data_get_string(s, \"device_id\");\n    bool match = devices_match(s_dev_id, monitoring_id);\n    obs_data_release(s);\n    return match;\n}\n```","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-output.c:173-183","code":"  173 | \tif (source->info.output_flags & OBS_SOURCE_DO_NOT_SELF_MONITOR) {\n  174 | \t\tobs_data_t *s = obs_source_get_settings(source);\n  175 | \t\tconst char *s_dev_id = obs_data_get_string(s, \"device_id\");\n  176 | \t\tbool match = devices_match(s_dev_id, uid);\n  177 | \t\tobs_data_release(s);\n  178 | \n  179 | \t\tif (match) {\n  180 | \t\t\tmonitor->ignore = true;\n  181 | \t\t\treturn true;\n  182 | \t\t}\n  183 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/osx/coreaudio-output.c#L173-L183"},{"ref":"libobs/audio-monitoring/pulse/pulseaudio-output.c:359-369","code":"  359 | \tif (source->info.output_flags & OBS_SOURCE_DO_NOT_SELF_MONITOR) {\n  360 | \t\tobs_data_t *s = obs_source_get_settings(source);\n  361 | \t\tconst char *s_dev_id = obs_data_get_string(s, \"device_id\");\n  362 | \t\tbool match = devices_match(s_dev_id, id);\n  363 | \t\tobs_data_release(s);\n  364 | \n  365 | \t\tif (match) {\n  366 | \t\t\tmonitor->ignore = true;\n  367 | \t\t\tblog(LOG_INFO, \"Prevented feedback-loop in '%s'\", s_dev_id);\n  368 | \t\t\treturn true;\n  369 | \t\t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/pulse/pulseaudio-output.c#L359-L369"},{"ref":"libobs/audio-monitoring/win32/wasapi-output.c:384-394","code":"  384 | \tif (source->info.output_flags & OBS_SOURCE_DO_NOT_SELF_MONITOR) {\n  385 | \t\tobs_data_t *s = obs_source_get_settings(source);\n  386 | \t\tconst char *s_dev_id = obs_data_get_string(s, \"device_id\");\n  387 | \t\tbool match = devices_match(s_dev_id, id);\n  388 | \t\tobs_data_release(s);\n  389 | \n  390 | \t\tif (match) {\n  391 | \t\t\tmonitor->ignore = true;\n  392 | \t\t\treturn true;\n  393 | \t\t}\n  394 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/win32/wasapi-output.c#L384-L394"}]},

{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"high","difficulty":"medium","description":"`VolumeAccessibleInterface` provides `currentValue`, `setCurrentValue`, `maximumValue`,\n`minimumValue`, and `minimumStepSize` methods, but the class only inherits from\n`QAccessibleWidget`. It does NOT inherit from `QAccessibleValueInterface`.\n\nQt's accessibility framework discovers value-interface capability exclusively through\n`QAccessibleInterface::interface_cast<QAccessibleValueInterface>()`. Without the inheritance,\nthe framework never queries these five methods. Screen readers (NVDA, JAWS, VoiceOver,\nOrca) will never receive slider value, minimum, maximum, or step information through the\nproper value interface.\n\nThe `text(QAccessible::Text::Value)` override in `text()` (line 14-22) partially mitigates\nthis for textual value reads, but `setCurrentValue`, `maximumValue`, `minimumValue`, and\n`minimumStepSize` remain completely dead code from the AT framework's point of view.","fix":"Inherit from both `QAccessibleWidget` and `QAccessibleValueInterface`, and override\n`interface_cast` so the framework can discover the value interface:\n\n```cpp\n// VolumeAccessibleInterface.hpp\n#include <QAccessibleWidget>\n\nclass VolumeSlider;\n\nclass VolumeAccessibleInterface : public QAccessibleWidget,\n                                  public QAccessibleValueInterface {\npublic:\n    explicit VolumeAccessibleInterface(QWidget *w);\n\n    // QAccessibleValueInterface\n    QVariant currentValue() const override;\n    void setCurrentValue(const QVariant &value) override;\n    QVariant maximumValue() const override;\n    QVariant minimumValue() const override;\n    QVariant minimumStepSize() const override;\n\n    // QAccessibleWidget\n    void *interface_cast(QAccessible::InterfaceType type) override;\n\nprotected:\n    QAccessible::Role role() const override;\n    QString text(QAccessible::Text t) const override;\n\nprivate:\n    VolumeSlider *slider() const;\n};\n```\n\n```cpp\n// VolumeAccessibleInterface.cpp\nvoid *VolumeAccessibleInterface::interface_cast(QAccessible::InterfaceType type)\n{\n    if (type == QAccessible::ValueInterface)\n        return static_cast<QAccessibleValueInterface *>(this);\n    return QAccessibleWidget::interface_cast(type);\n}\n```","locations":[{"ref":"frontend/components/VolumeAccessibleInterface.hpp:7-26","code":"    7 | class VolumeAccessibleInterface : public QAccessibleWidget {\n    8 | \n    9 | public:\n   10 | \tVolumeAccessibleInterface(QWidget *w);\n   11 | \n   12 | \tQVariant currentValue() const;\n   13 | \tvoid setCurrentValue(const QVariant &value);\n   14 | \n   15 | \tQVariant maximumValue() const;\n   16 | \tQVariant minimumValue() const;\n   17 | \n   18 | \tQVariant minimumStepSize() const;\n   19 | \n   20 | private:\n   21 | \tVolumeSlider *slider() const;\n   22 | \n   23 | protected:\n   24 | \tvirtual QAccessible::Role role() const override;\n   25 | \tvirtual QString text(QAccessible::Text t) const override;\n   26 | };","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/VolumeAccessibleInterface.hpp#L7-L26"},{"ref":"frontend/components/VolumeAccessibleInterface.cpp:39-57","code":"   39 | void VolumeAccessibleInterface::setCurrentValue(const QVariant &value)\n   40 | {\n   41 | \tslider()->setValue(value.toInt());\n   42 | }\n   43 | \n   44 | QVariant VolumeAccessibleInterface::maximumValue() const\n   45 | {\n   46 | \treturn slider()->maximum();\n   47 | }\n   48 | \n   49 | QVariant VolumeAccessibleInterface::minimumValue() const\n   50 | {\n   51 | \treturn slider()->minimum();\n   52 | }\n   53 | \n   54 | QVariant VolumeAccessibleInterface::minimumStepSize() const\n   55 | {\n   56 | \treturn slider()->singleStep();\n   57 | }","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/VolumeAccessibleInterface.cpp#L39-L57"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`OBSStudioAPI::obs_frontend_set_current_scene_collection` and\n`OBSStudioAPI::obs_frontend_set_current_profile` operate by searching the menu action list for a\nmatching text label and triggering it. This approach is fragile: it depends on the menu being\npopulated, breaks if the display name ever differs from the internal name, and is not locale-safe\n(menu text is translated). Any caller that passes a collection or profile name that does not\nexactly match the displayed menu text will silently fail with no error reported.","fix":"Use a direct lookup by internal/file name rather than UI menu text. Invoke a method on\n`OBSBasic` that accepts the internal name and switches the collection/profile directly, bypassing\nthe menu action indirection. If a direct API is not available, at minimum log a warning when no\nmatching action is found so callers can detect the failure.","locations":[{"ref":"frontend/OBSStudioAPI.cpp:142-158","code":"  142 | void OBSStudioAPI::obs_frontend_set_current_scene_collection(const char *collection)\n  143 | {\n  144 | \tQList<QAction *> menuActions = main->ui->sceneCollectionMenu->actions();\n  145 | \tQString qstrCollection = QT_UTF8(collection);\n  146 | \n  147 | \tfor (int i = 0; i < menuActions.count(); i++) {\n  148 | \t\tQAction *action = menuActions[i];\n  149 | \t\tQVariant v = action->property(\"file_name\");\n  150 | \n  151 | \t\tif (v.typeName() != nullptr) {\n  152 | \t\t\tif (action->text() == qstrCollection) {\n  153 | \t\t\t\taction->trigger();\n  154 | \t\t\t\tbreak;\n  155 | \t\t\t}\n  156 | \t\t}\n  157 | \t}\n  158 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSStudioAPI.cpp#L142-L158"},{"ref":"frontend/OBSStudioAPI.cpp:191-207","code":"  191 | void OBSStudioAPI::obs_frontend_set_current_profile(const char *profile)\n  192 | {\n  193 | \tQList<QAction *> menuActions = main->ui->profileMenu->actions();\n  194 | \tQString qstrProfile = QT_UTF8(profile);\n  195 | \n  196 | \tfor (int i = 0; i < menuActions.count(); i++) {\n  197 | \t\tQAction *action = menuActions[i];\n  198 | \t\tQVariant v = action->property(\"file_name\");\n  199 | \n  200 | \t\tif (v.typeName() != nullptr) {\n  201 | \t\t\tif (action->text() == qstrProfile) {\n  202 | \t\t\t\taction->trigger();\n  203 | \t\t\t\tbreak;\n  204 | \t\t\t}\n  205 | \t\t}\n  206 | \t}\n  207 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSStudioAPI.cpp#L191-L207"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`blitSwapChains` mutates `swapChains` inside `swapChainQueue.sync { swapChains = swapChains.filter { ... } }` but then iterates `swapChains` with a `for` loop OUTSIDE the serial queue. `device_swapchain_create` appends to `swapChains` from the main thread inside `swapChainQueue.sync`, while `blitSwapChains` runs on the `CVDisplayLink` thread. The unsynchronized read/iteration of the `swapChains` array concurrently with the synchronized append is a data race on a Swift `Array` (whose reads and writes are not thread-safe), which can crash or corrupt state.","fix":"Perform the filtering and iteration under the same `swapChainQueue.sync` block, e.g. snapshot the array inside the sync block (`let activeChains = swapChainQueue.sync { swapChains = swapChains.filter { !$0.discard }; return swapChains }`) and iterate the local copy.","locations":[{"ref":"libobs-metal/MetalDevice.swift:149-184","code":"  149 |     func blitSwapChains() {\n  150 |         guard swapChains.count > 0 else { return }\n  151 | \n  152 |         guard let commandBuffer = commandQueue.makeCommandBuffer(),\n  153 |             let encoder = commandBuffer.makeBlitCommandEncoder()\n  154 |         else {\n  155 |             return\n  156 |         }\n  157 | \n  158 |         self.swapChainQueue.sync {\n  159 |             swapChains = swapChains.filter { $0.discard == false }\n  160 |         }\n  161 | \n  162 |         for swapChain in swapChains {\n  163 |             guard let renderTarget = swapChain.renderTarget, let drawable = swapChain.layer.nextDrawable() else {\n  164 |                 continue\n  165 |             }\n  166 | \n  167 |             guard renderTarget.texture.width == drawable.texture.width,\n  168 |                 renderTarget.texture.height == drawable.texture.height,\n  169 |                 renderTarget.texture.pixelFormat == drawable.texture.pixelFormat\n  170 |             else {\n  171 |                 continue\n  172 |             }\n  173 | \n  174 |             autoreleasepool {\n  175 |                 encoder.waitForFence(swapChain.fence)\n  176 |                 encoder.copy(from: renderTarget.texture, to: drawable.texture)\n  177 | \n  178 |                 commandBuffer.present(drawable)\n  179 |             }\n  180 |         }\n  181 | \n  182 |         encoder.endEncoding()\n  183 |         commandBuffer.commit()\n  184 |     }","lines":36,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/MetalDevice.swift#L149-L184"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`obs-audio-controls.c` at line 427 uses `printf` (not `blog`) to report a\nmisaligned audio plane. This bypasses OBS's logging system entirely - the\nmessage goes to stdout, which is not captured by OBS log files, and will not\nbe visible in the OBS log window or crash reports. In a production OBS build,\nthis debug message is effectively invisible.","fix":"Replace `printf(...)` with `blog(LOG_WARNING, ...)`.","locations":[{"ref":"libobs/obs-audio-controls.c:424-430","code":"  424 | \t\tif (((uintptr_t)samples & 0xf) > 0) {\n  425 | \t\t\tprintf(\"Audio plane %i is not aligned %p skipping \"\n  426 | \t\t\t       \"peak volume measurement.\\n\",\n  427 | \t\t\t       plane_nr, samples);\n  428 | \t\t\tvolmeter->peak[channel_nr] = 1.0;\n  429 | \t\t\tchannel_nr++;\n  430 | \t\t\tcontinue;","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-audio-controls.c#L424-L430"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`MediaControls` declares `int seek` and `int lastSeek` as member variables without in-class initialisers (header lines 18-19). They are used in `AbsoluteSliderClicked` and `SeekTimerCallback` before any constructor assignment, leading to reads of uninitialised values if a slider event fires before `AbsoluteSliderClicked` sets `seek`. `MediaControls` has no explicit constructor that initialises them (the ctor body only connects signals).","fix":"Add in-class initialisers:\n\n```cpp\nint seek = -1;\nint lastSeek = -1;\n```","locations":[{"ref":"frontend/components/MediaControls.hpp:18-19","code":"   18 | \tint seek;\n   19 | \tint lastSeek;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/MediaControls.hpp#L18-L19"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The local macros `ACCEPT_BUTTON` and `REJECT_BUTTON` defined inside\n`UIValidation::StreamSettingsConfirmation` (lines 94-98) are never `#undef`'d after their use.\nWhile harmless in this translation unit because no other code follows their definition in the\nsame file, leaving function-scoped macros alive pollutes the macro namespace for any headers\nincluded after this point and violates the convention of cleaning up short-lived macros.","fix":"Add `#undef` directives immediately after the macros are no longer needed:\n```cpp\n    messageBox.exec();\n#undef ACCEPT_BUTTON\n#undef REJECT_BUTTON\n```","locations":[{"ref":"frontend/components/UIValidation.cpp:93-101","code":"   93 | #ifdef __APPLE__\n   94 | #define ACCEPT_BUTTON QMessageBox::AcceptRole\n   95 | #define REJECT_BUTTON QMessageBox::ResetRole\n   96 | #else\n   97 | #define ACCEPT_BUTTON QMessageBox::NoRole\n   98 | #define REJECT_BUTTON QMessageBox::NoRole\n   99 | #endif\n  100 | \tsettings = messageBox.addButton(QTStr(\"Basic.Settings.Stream.StreamSettingsWarning\"), ACCEPT_BUTTON);\n  101 | \tcancel = messageBox.addButton(QTStr(\"Cancel\"), REJECT_BUTTON);","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/UIValidation.cpp#L93-L101"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"In `parse_slideshow`, `QString options = config.mid(end + 1);` can produce an empty string when `]` is the last character of `config`, and the following `options[0] = '{';` then writes to index 0 of an empty `QString`. Using the non-const `QString::operator[]` at an index >= `size()` is undefined behavior. This is reachable with truncated/edge XSplit slideshow config data.","fix":"Guard before overwriting, e.g.\n```cpp\nQString options = config.mid(end + 1);\nif (options.isEmpty())\n    return Json::object{};\noptions[0] = '{';\n```","locations":[{"ref":"frontend/importers/xsplit.cpp:186-187","code":"  186 | \tQString options = config.mid(end + 1);\n  187 | \toptions[0] = '{';","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/importers/xsplit.cpp#L186-L187"}]},

{"id":"OTHER_7","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"In `OBSApp::MigrateLegacySettings` (line 656), `hasChanges` is updated via bitwise OR (`|`)\ninstead of logical OR (`||`) or the compound assignment `|=`. While the result is identical for\n`bool` values in C++, bitwise OR on `bool` is unconventional and can confuse static analysis tools\nor readers into thinking the intent was bitwise manipulation.","fix":"Use `|=` or `||=` pattern for clarity:\n\n```cpp\nhasChanges |= layoutUpdated;\n```","locations":[{"ref":"frontend/OBSApp.cpp:656","code":"  656 | \t\thasChanges = hasChanges | layoutUpdated;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp.cpp#L656"}]},
