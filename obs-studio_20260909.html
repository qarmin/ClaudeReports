{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `handleUncleanShutdown`, when `enableCrashUpload` is false the crash-report checkbox is not\nadded to the dialog, so `crashWarning.checkBox()` returns null. The code correctly guards the\n`setCheckBox` call with `if (enableCrashUpload)`, but then unconditionally evaluates\n`(enableCrashUpload) ? crashWarning.checkBox()->isChecked() : false`. If Qt's\n`QMessageBox::checkBox()` returns null when no checkbox was set, the ternary's `true` branch is\nnever reached when `enableCrashUpload` is false, so the guard works here. However, this relies on\nthe conditional evaluation order rather than an explicit null check, making the code fragile. If\nthe logic is ever refactored so the ternary or the `if` are reordered, a null dereference will\noccur.","fix":"Use an explicit null check:\n\n```cpp\nbool sendCrashReport = false;\nif (enableCrashUpload) {\n    QCheckBox *cb = crashWarning.checkBox();\n    sendCrashReport = cb && cb->isChecked();\n}\n```","locations":[{"ref":"frontend/OBSApp.cpp:106-132","code":"  106 | \tif (enableCrashUpload) {\n  107 | \t\tcrashWarning.setInformativeText(QTStr(\"CrashHandling.Labels.PrivacyNotice\"));\n  108 | \n  109 | \t\tQCheckBox *sendCrashReportCheckbox = new QCheckBox(QTStr(\"CrashHandling.Checkbox.SendReport\"));\n  110 | \t\tcrashWarning.setCheckBox(sendCrashReportCheckbox);\n  111 | \t}\n  112 | \n  113 | \tQPushButton *launchSafeButton =\n  114 | \t\tcrashWarning.addButton(QTStr(\"CrashHandling.Buttons.LaunchSafe\"), QMessageBox::AcceptRole);\n  115 | \tQPushButton *launchNormalButton =\n  116 | \t\tcrashWarning.addButton(QTStr(\"CrashHandling.Buttons.LaunchNormal\"), QMessageBox::RejectRole);\n  117 | \n  118 | \tcrashWarning.setDefaultButton(launchNormalButton);\n  119 | \n  120 | \tcrashWarning.exec();\n  121 | \n  122 | \tbool useSafeMode = crashWarning.clickedButton() == launchSafeButton;\n  123 | \n  124 | \tif (useSafeMode) {\n  125 | \t\tlaunchAction.useSafeMode = true;\n  126 | \n  127 | \t\tblog(LOG_INFO, \"[Safe Mode] Safe mode launch selected, loading third-party plugins is disabled\");\n  128 | \t} else {\n  129 | \t\tblog(LOG_WARNING, \"[Safe Mode] Normal launch selected, loading third-party plugins is enabled\");\n  130 | \t}\n  131 | \n  132 | \tbool sendCrashReport = (enableCrashUpload) ? crashWarning.checkBox()->isChecked() : false;","lines":27,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp.cpp#L106-L132"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`OBSApp::uploadLastAppLog` and `OBSApp::uploadCurrentAppLog` unconditionally dereference the\nresult of `GetMainWindow()` without a null check. `GetMainWindow()` returns\n`mainWindow.data()` from a `QPointer`, which is null after the main window has been destroyed.\nCalling these functions (e.g. from the crash log upload flow) after the window closes will\ncrash OBS.","fix":"Guard the pointer:\n\n```cpp\nvoid OBSApp::uploadLastAppLog() const\n{\n    OBSBasic *basicWindow = static_cast<OBSBasic *>(GetMainWindow());\n    if (!basicWindow)\n        return;\n    basicWindow->UploadLog(\"obs-studio/logs\", GetLastLog(), OBS::LogFileType::LastAppLog);\n}\n```\nApply the same pattern to `uploadCurrentAppLog`.","locations":[{"ref":"frontend/OBSApp.cpp:1420-1431","code":" 1420 | void OBSApp::uploadLastAppLog() const\n 1421 | {\n 1422 | \tOBSBasic *basicWindow = static_cast<OBSBasic *>(GetMainWindow());\n 1423 | \n 1424 | \tbasicWindow->UploadLog(\"obs-studio/logs\", GetLastLog(), OBS::LogFileType::LastAppLog);\n 1425 | }\n 1426 | \n 1427 | void OBSApp::uploadCurrentAppLog() const\n 1428 | {\n 1429 | \tOBSBasic *basicWindow = static_cast<OBSBasic *>(GetMainWindow());\n 1430 | \n 1431 | \tbasicWindow->UploadLog(\"obs-studio/logs\", GetCurrentLog(), OBS::LogFileType::CurrentAppLog);","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp.cpp#L1420-L1431"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `ParseMath` (theme parser), `varType` is declared but not initialized before the\n`if/else if/else if` chain that assigns it. If somehow none of the three branches match (which is\na compiler-visible impossibility given the preceding `cf_token_is` guard, but no `else` exists),\n`varType` is used uninitialized on line 267. Compilers may warn about this, and the logic is\nfragile if the surrounding token checks are refactored.","fix":"Initialize `varType` to a safe default:\n\n```cpp\nOBSThemeVariable::VariableType varType = OBSThemeVariable::Calc;\n```\nOr add an explicit `else` branch that handles the unexpected case with a `blog(LOG_ERROR, ...)` and `return false`.","locations":[{"ref":"frontend/OBSApp_Themes.cpp:254-267","code":"  254 | \t\t\tOBSThemeVariable::VariableType varType;\n  255 | \t\t\tif (cf_token_is(cfp, \"calc\")) {\n  256 | \t\t\t\tvarType = OBSThemeVariable::Calc;\n  257 | \t\t\t} else if (cf_token_is(cfp, \"max\")) {\n  258 | \t\t\t\tvarType = OBSThemeVariable::Max;\n  259 | \t\t\t} else if (cf_token_is(cfp, \"min\")) {\n  260 | \t\t\t\tvarType = OBSThemeVariable::Min;\n  261 | \t\t\t}\n  262 | \n  263 | \t\t\tif (!ParseMath(cfp, subvalues, vars)) {\n  264 | \t\t\t\treturn false;\n  265 | \t\t\t}\n  266 | \n  267 | \t\t\tvar.type = varType;","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp_Themes.cpp#L254-L267"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `ParseThemeVariables`, the OS-prefix stripping logic (`key.startsWith(osPrefix) ->\nvar.name = key.sliced(osPrefix.length())`) runs before the `obs` prefix guard\n(`if (key.startsWith(\"obs\")) continue`). A theme variable named `os_win_obsHidden` (or similar)\nwould have its prefix stripped to `obsHidden`, which would then be allowed through the `obs`\nguard since the check operates on the original `key`, not the renamed `var.name`. This means a\nmalicious or buggy theme could inject a variable starting with `obs` into the variable map.","fix":"Move the `obs` prefix guard to operate on `var.name` after the rename, or re-check `var.name`\nafter stripping:\n\n```cpp\n// After the osPrefix stripping block:\nif (var.name.startsWith(\"obs\")) {\n    blog(LOG_WARNING, \"Theme variable '%s' uses reserved 'obs' prefix, skipping.\",\n         QT_TO_UTF8(var.name));\n    continue;\n}\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:350-375","code":"  350 | #ifdef _WIN32\n  351 | \t\tconst QString osPrefix = \"os_win_\";\n  352 | #elif __APPLE__\n  353 | \t\tconst QString osPrefix = \"os_mac_\";\n  354 | #else\n  355 | \t\tconst QString osPrefix = \"os_lin_\";\n  356 | #endif\n  357 | \n  358 | \t\tif (key.startsWith(osPrefix) && key.length() > osPrefix.length()) {\n  359 | \t\t\tvar.name = key.sliced(osPrefix.length());\n  360 | \t\t}\n  361 | \n  362 | \t\tret = cf_next_token_should_be(cfp, \":\", \";\", nullptr);\n  363 | \t\tif (ret != PARSE_SUCCESS) {\n  364 | \t\t\tcontinue;\n  365 | \t\t}\n  366 | \n  367 | \t\tif (!cf_next_token(cfp)) {\n  368 | \t\t\treturn vars;\n  369 | \t\t}\n  370 | \n  371 | \t\t/* Special values passed to the theme by OBS are prefixed with 'obs', so we\n  372 | \t\t * prevent theme variables from using it as a prefix. */\n  373 | \t\tif (key.startsWith(\"obs\")) {\n  374 | \t\t\tcontinue;\n  375 | \t\t}","lines":26,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp_Themes.cpp#L350-L375"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `OBSApp::SetTheme`, the `QTimer::singleShot` lambda captures `themeWatcher` by reference\n(`[&]`). If `SetTheme` is called again before the 250 ms timer fires (e.g. rapid hot-reload), the\nlambda will execute after `themeWatcher` has been replaced by a new `QFileSystemWatcher*` or even\nset to null, resulting in calling `blockSignals(false)` on the wrong object or crashing via a\ndangling pointer.","fix":"Capture `themeWatcher` by value (as a `QPointer`) instead of by reference:\n\n```cpp\nQPointer<QFileSystemWatcher> watcherPtr = themeWatcher;\nQTimer::singleShot(250, this, [watcherPtr] {\n    if (watcherPtr)\n        watcherPtr->blockSignals(false);\n});\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:1022-1027","code":" 1022 | \tif (themeWatcher) {\n 1023 | \t\tthemeWatcher->addPaths(filenames);\n 1024 | \t\t/* Give it 250 ms before re-enabling the watcher to prevent too\n 1025 | \t\t * many reloads when edited with an auto-saving IDE. */\n 1026 | \t\tQTimer::singleShot(250, this, [&] { themeWatcher->blockSignals(false); });\n 1027 | \t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp_Themes.cpp#L1022-L1027"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `OBSApp::themeFileChanged`, `currentTheme` is dereferenced unconditionally to obtain its `id`.\nHowever, `currentTheme` is a raw pointer that can be null if `SetTheme` was never called\nsuccessfully or if the theme was removed from `themes` in between. A null dereference here crashes\nOBS when the file watcher fires after theme cleanup.","fix":"Guard the dereference:\n\n```cpp\nvoid OBSApp::themeFileChanged(const QString &path)\n{\n    if (!currentTheme)\n        return;\n    blog(LOG_INFO, \"Theme file \"%s\" changed, reloading...\", QT_TO_UTF8(path));\n    SetTheme(currentTheme->id);\n}\n```","locations":[{"ref":"frontend/OBSApp_Themes.cpp:1032-1036","code":" 1032 | void OBSApp::themeFileChanged(const QString &path)\n 1033 | {\n 1034 | \tblog(LOG_INFO, \"Theme file \\\"%s\\\" changed, reloading...\", QT_TO_UTF8(path));\n 1035 | \tSetTheme(currentTheme->id);\n 1036 | }","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp_Themes.cpp#L1032-L1036"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`AccessibleAlignmentSelector::focusChild` calls `child(i)->state()` without checking whether\n`child(i)` returns null. `child(int)` calls `QAccessible::accessibleInterface(id)` which can\nreturn null if the interface was deleted or not yet registered. A null dereference here crashes\nOBS when an accessibility tool queries focus on the alignment selector widget.","fix":"Guard the child pointer:\n\n```cpp\nQAccessibleInterface *AccessibleAlignmentSelector::focusChild() const\n{\n    for (int i = 0; i < childCount(); ++i) {\n        QAccessibleInterface *c = child(i);\n        if (c && c->state().focused)\n            return c;\n    }\n    return nullptr;\n}\n```\nApply the same pattern to `value()` at line 119-122.","locations":[{"ref":"frontend/components/AccessibleAlignmentSelector.cpp:68-76","code":"   68 | QAccessibleInterface *AccessibleAlignmentSelector::focusChild() const\n   69 | {\n   70 | \tfor (int i = 0; i < childCount(); ++i) {\n   71 | \t\tif (child(i)->state().focused) {\n   72 | \t\t\treturn child(i);\n   73 | \t\t}\n   74 | \t}\n   75 | \treturn nullptr;\n   76 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/AccessibleAlignmentSelector.cpp#L68-L76"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`FlowFrame::keyPressEvent` iterates over all layout items looking for focus-navigation candidates (lines 67-113) but does **not** skip items that have no associated widget (e.g. spacers). `layout->itemAt(i)->widget()` can return `nullptr` for non-widget layout items, and line 73 then calls `widget->geometry()` on that null pointer, causing a crash whenever the layout contains a spacer.","fix":"Add a null widget guard at the start of the inner loop body:\n\n```cpp\nQWidget *widget = layout->itemAt(i)->widget();\nif (!widget)\n    continue;\nconst QRect rect = widget->geometry();\n```","locations":[{"ref":"frontend/components/FlowFrame.cpp:67-113","code":"   67 | \t\tfor (int i = 0; i < layout->count(); ++i) {\n   68 | \t\t\tif (i == index) {\n   69 | \t\t\t\tcontinue;\n   70 | \t\t\t}\n   71 | \n   72 | \t\t\tQWidget *widget = layout->itemAt(i)->widget();\n   73 | \t\t\tconst QRect rect = widget->geometry();\n   74 | \n   75 | \t\t\tbool isCandidate = false;\n   76 | \t\t\tint distance = INT_MAX;\n   77 | \n   78 | \t\t\tswitch (event->key()) {\n   79 | \t\t\tcase Qt::Key_Right:\n   80 | \t\t\t\tif (rect.left() > focusedRect.right()) {\n   81 | \t\t\t\t\tdistance = (rect.left() - focusedRect.right()) +\n   82 | \t\t\t\t\t\t   qAbs(rect.center().y() - focusedRect.center().y());\n   83 | \t\t\t\t\tisCandidate = true;\n   84 | \t\t\t\t}\n   85 | \t\t\t\tbreak;\n   86 | \t\t\tcase Qt::Key_Left:\n   87 | \t\t\t\tif (rect.right() < focusedRect.left()) {\n   88 | \t\t\t\t\tdistance = (focusedRect.left() - rect.right()) +\n   89 | \t\t\t\t\t\t   qAbs(rect.center().y() - focusedRect.center().y());\n   90 | \t\t\t\t\tisCandidate = true;\n   91 | \t\t\t\t}\n   92 | \t\t\t\tbreak;\n   93 | \t\t\tcase Qt::Key_Down:\n   94 | \t\t\t\tif (rect.top() > focusedRect.bottom()) {\n   95 | \t\t\t\t\tdistance = (rect.top() - focusedRect.bottom()) +\n   96 | \t\t\t\t\t\t   qAbs(rect.center().x() - focusedRect.center().x());\n   97 | \t\t\t\t\tisCandidate = true;\n   98 | \t\t\t\t}\n   99 | \t\t\t\tbreak;\n  100 | \t\t\tcase Qt::Key_Up:\n  101 | \t\t\t\tif (rect.bottom() < focusedRect.top()) {\n  102 | \t\t\t\t\tdistance = (focusedRect.top() - rect.bottom()) +\n  103 | \t\t\t\t\t\t   qAbs(rect.center().x() - focusedRect.center().x());\n  104 | \t\t\t\t\tisCandidate = true;\n  105 | \t\t\t\t}\n  106 | \t\t\t\tbreak;\n  107 | \t\t\t}\n  108 | \n  109 | \t\t\tif (isCandidate && distance < bestDistance) {\n  110 | \t\t\t\tbestDistance = distance;\n  111 | \t\t\t\tnextFocus = widget;\n  112 | \t\t\t}\n  113 | \t\t}","lines":47,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/FlowFrame.cpp#L67-L113"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`FlowLayout::doLayout` accesses `wid->style()` (lines 131 and 137) to query `layoutSpacing`, but `wid` can be `nullptr` when a layout item is not a widget (e.g. a `QSpacerItem`). This null pointer dereference would crash whenever a non-widget item is in the layout and `horizontalSpacing()` or `verticalSpacing()` returns -1.","fix":"Guard with a null check before using `wid`:\n\n```cpp\nint spaceX = horizontalSpacing();\nif (spaceX == -1 && wid) {\n    spaceX = wid->style()->layoutSpacing(...);\n}\nif (spaceX == -1)\n    spaceX = 0;\n```","locations":[{"ref":"frontend/components/FlowLayout.cpp:128-139","code":"  128 | \t\tconst QWidget *wid = item->widget();\n  129 | \t\tint spaceX = horizontalSpacing();\n  130 | \t\tif (spaceX == -1) {\n  131 | \t\t\tspaceX = wid->style()->layoutSpacing(QSizePolicy::PushButton, QSizePolicy::PushButton,\n  132 | \t\t\t\t\t\t\t     Qt::Horizontal);\n  133 | \t\t}\n  134 | \n  135 | \t\tint spaceY = verticalSpacing();\n  136 | \t\tif (spaceY == -1) {\n  137 | \t\t\tspaceY = wid->style()->layoutSpacing(QSizePolicy::PushButton, QSizePolicy::PushButton,\n  138 | \t\t\t\t\t\t\t     Qt::Vertical);\n  139 | \t\t}","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/FlowLayout.cpp#L128-L139"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`OBSPreviewScalingComboBox::UpdateSelection` computes `outputScale = float(output_width) / float(canvas_width)` (line 111) without guarding against `canvas_width == 0`. At startup, before the first canvas resize event is received, `canvas_width` is 0, resulting in a division by zero (float Infinity). The comparison `previewScale == outputScale` then never matches, but the Infinity can propagate to other calculations.","fix":"```cpp\nif (canvas_width == 0)\n    return;\nfloat outputScale = float(output_width) / float(canvas_width);\n```","locations":[{"ref":"frontend/components/OBSPreviewScalingComboBox.cpp:111","code":"  111 | \tfloat outputScale = float(output_width) / float(canvas_width);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/OBSPreviewScalingComboBox.cpp#L111"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SceneTree::resizeEvent` and `SceneTree::dropEvent` call `item(count() - 1)` and `item(0)` inside the `gridMode` branch without first checking that the list is non-empty. When `count() == 0`, `item(-1)` returns `nullptr` and `visualItemRect(nullptr)` invokes undefined behaviour (null dereference or invalid QRect). `RepositionGrid` has the same issue.","fix":"Guard each grid-mode block with a count check:\n\n```cpp\nif (gridMode) {\n    if (count() == 0)\n        return;\n    const QRect lastItem = visualItemRect(item(count() - 1));\n    // ...\n}\n```","locations":[{"ref":"frontend/components/SceneTree.cpp:69-70","code":"   69 | \t\tconst QRect lastItem = visualItemRect(item(count() - 1));\n   70 | \t\tconst int h = lastItem.y() + lastItem.height();","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SceneTree.cpp#L69-L70"},{"ref":"frontend/components/SceneTree.cpp:112-113","code":"  112 | \t\tconst QRect firstItem = visualItemRect(item(0));\n  113 | \t\tconst QRect lastItem = visualItemRect(item(count() - 1));","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SceneTree.cpp#L112-L113"},{"ref":"frontend/components/SceneTree.cpp:152-153","code":"  152 | \tconst QRect firstItem = visualItemRect(item(0));\n  153 | \tconst QRect lastItem = visualItemRect(item(count() - 1));","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SceneTree.cpp#L152-L153"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SourceTreeModel::data()` accesses `items[index.row()]` without first verifying that `index.isValid()` or that `index.row()` is within bounds. If Qt (or any client code) calls `data()` with an out-of-range index — which can happen during model resets — this causes undefined behaviour. The sibling `flags()` method correctly checks `index.isValid()` first.","fix":"Add a bounds check at the start of `data()`:\n\n```cpp\nQVariant SourceTreeModel::data(const QModelIndex &index, int role) const\n{\n    if (!index.isValid() || index.row() < 0 || index.row() >= items.count())\n        return QVariant();\n    // ...\n}\n```","locations":[{"ref":"frontend/components/SourceTreeModel.cpp:250-258","code":"  250 | QVariant SourceTreeModel::data(const QModelIndex &index, int role) const\n  251 | {\n  252 | \tif (role == Qt::AccessibleTextRole) {\n  253 | \t\tOBSSceneItem item = items[index.row()];\n  254 | \t\tobs_source_t *source = obs_sceneitem_get_source(item);\n  255 | \t\treturn QVariant(QT_UTF8(obs_source_get_name(source)));\n  256 | \t}\n  257 | \n  258 | \treturn QVariant();","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SourceTreeModel.cpp#L250-L258"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SourceTreeModel::data()` does not validate the index before dereferencing `items[index.row()]`.\nWhen `role == Qt::AccessibleTextRole`, the function unconditionally accesses the items vector\nat `index.row()` with no prior check that the index is valid or within bounds.\nIn contrast, the sibling `flags()` method does check `!index.isValid()` before accessing items.\nWhile Qt's framework normally provides valid indices, accessibility tools and screen readers can\nquery `data()` with stale or synthetic indices, which could cause an out-of-bounds crash.","fix":"Add the same validity guard used in `flags()`:\n```cpp\nQVariant SourceTreeModel::data(const QModelIndex &index, int role) const\n{\n    if (role == Qt::AccessibleTextRole) {\n        if (!index.isValid() || index.row() >= items.count())\n            return QVariant();\n        OBSSceneItem item = items[index.row()];\n        obs_source_t *source = obs_sceneitem_get_source(item);\n        return QVariant(QT_UTF8(obs_source_get_name(source)));\n    }\n    return QVariant();\n}\n```","locations":[{"ref":"frontend/components/SourceTreeModel.cpp:250-258","code":"  250 | QVariant SourceTreeModel::data(const QModelIndex &index, int role) const\n  251 | {\n  252 | \tif (role == Qt::AccessibleTextRole) {\n  253 | \t\tOBSSceneItem item = items[index.row()];\n  254 | \t\tobs_source_t *source = obs_sceneitem_get_source(item);\n  255 | \t\treturn QVariant(QT_UTF8(obs_source_get_name(source)));\n  256 | \t}\n  257 | \n  258 | \treturn QVariant();","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SourceTreeModel.cpp#L250-L258"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"TextSourceToolbar uses two different, inconsistent APIs to identify the text_ft2 source type.\nThe constructor (line 25-26) correctly uses `obs_source_get_unversioned_id` plus `strcmp` and\nstores the result in `ft2`. But the color key selection inside the same constructor (line 33-34)\nuses `obs_source_get_id` (versioned) plus `strncmp(..., 15)`, ignoring the already-computed `ft2`.\nThe same `strncmp` pattern appears again in `on_selectColor_clicked` (line 100).\nUsing `strncmp` on a versioned ID with a hardcoded length is fragile: any future source ID\nthat starts with \"text_ft2_source\" would be falsely matched. The correct approach is to use\n`obs_source_get_unversioned_id` + `strcmp` throughout, consistent with the constructor's `ft2`\nvariable that already has the right answer.","fix":"Reuse the already-computed `ft2` variable (derived from `obs_source_get_unversioned_id`) instead\nof re-checking the versioned ID.\n\nIn the constructor, replace the inline `strncmp` on line 34:\n```cpp\n// before\nunsigned int val = (unsigned int)obs_data_get_int(\n    settings, (strncmp(obs_source_get_id(source), \"text_ft2_source\", 15) == 0) ? \"color1\" : \"color\");\n\n// after\nunsigned int val = (unsigned int)obs_data_get_int(settings, ft2 ? \"color1\" : \"color\");\n```\n\nIn `on_selectColor_clicked`, replace line 100:\n```cpp\n// before\nbool freetype = strncmp(obs_source_get_id(source), \"text_ft2_source\", 15) == 0;\n\n// after\nconst char *id = obs_source_get_unversioned_id(source);\nbool freetype = strcmp(id, \"text_ft2_source\") == 0;\n```","locations":[{"ref":"frontend/components/TextSourceToolbar.cpp:25-34","code":"   25 | \tconst char *id = obs_source_get_unversioned_id(source);\n   26 | \tbool ft2 = strcmp(id, \"text_ft2_source\") == 0;\n   27 | \tbool read_from_file = obs_data_get_bool(settings, ft2 ? \"from_file\" : \"read_from_file\");\n   28 | \n   29 | \tOBSDataAutoRelease font_obj = obs_data_get_obj(settings, \"font\");\n   30 | \tMakeQFont(font_obj, font);\n   31 | \n   32 | \t// Use \"color1\" if it's a freetype source and \"color\" elsewise\n   33 | \tunsigned int val = (unsigned int)obs_data_get_int(\n   34 | \t\tsettings, (strncmp(obs_source_get_id(source), \"text_ft2_source\", 15) == 0) ? \"color1\" : \"color\");","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/TextSourceToolbar.cpp#L25-L34"},{"ref":"frontend/components/TextSourceToolbar.cpp:100","code":"  100 | \tbool freetype = strncmp(obs_source_get_id(source), \"text_ft2_source\", 15) == 0;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/TextSourceToolbar.cpp#L100"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`TextSourceToolbar::on_selectColor_clicked` calls `obs_properties_get(props, ...)` and\nimmediately passes the result to `obs_property_description(p)` without checking for null.\n`obs_properties_get` returns null if the named property does not exist in `props` (which itself\nis initialized from the source's property list and could be empty or missing the color key).\nWhile `obs_property_description` is null-safe (returns null for a null `p`), the null `desc`\nstring is then passed as the title argument to `QColorDialog::getColor`. Qt silently accepts\na null C-string there, so there is no crash, but the dialog shows a generic untranslated title\ninstead of the expected property label. If a future caller checks `desc` before use, this will\nsurface as a latent null-dereference. A guard + fallback title is cleaner.","fix":"Add a null check and supply a fallback:\n```cpp\nobs_property_t *p = obs_properties_get(props, freetype ? \"color1\" : \"color\");\nconst char *desc = obs_property_description(p);\nQString title = desc ? QT_UTF8(desc) : QTStr(\"Basic.Main.Color\");\n// ...\nQColor newColor = QColorDialog::getColor(color, this, title, options);\n```","locations":[{"ref":"frontend/components/TextSourceToolbar.cpp:102-114","code":"  102 | \tobs_property_t *p = obs_properties_get(props, freetype ? \"color1\" : \"color\");\n  103 | \n  104 | \tconst char *desc = obs_property_description(p);\n  105 | \n  106 | \tQColorDialog::ColorDialogOptions options;\n  107 | \n  108 | \toptions |= QColorDialog::ShowAlphaChannel;\n  109 | #ifdef __linux__\n  110 | \t// TODO: Revisit hang on Ubuntu with native dialog\n  111 | \toptions |= QColorDialog::DontUseNativeDialog;\n  112 | #endif\n  113 | \n  114 | \tQColor newColor = QColorDialog::getColor(color, this, desc, options);","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/TextSourceToolbar.cpp#L102-L114"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`UrlPushButton::mousePressEvent` opens the target URL on mouse *button-down* rather than on a\nfull click (press then release). The base class `QPushButton::mousePressEvent` is never called,\nso the button never enters the visual pressed state and the `clicked()` signal is never emitted.\nThis creates two problems:\n1. The URL opens immediately on press even if the user drags away (they cannot cancel).\n2. Keyboard activation (Space/Enter on focused button) does not work, making the button\n   inaccessible to keyboard-only users and screen reader users.","fix":"Override `clicked()` instead of `mousePressEvent` to get correct press-release semantics and\nfree keyboard activation:\n```cpp\n// In UrlPushButton.hpp - remove the mousePressEvent override, add a slot\npublic slots:\n    void openUrl();\n\n// In UrlPushButton.cpp\nUrlPushButton::UrlPushButton(QWidget *parent) : QPushButton(parent)\n{\n    connect(this, &QPushButton::clicked, this, &UrlPushButton::openUrl);\n}\n\nvoid UrlPushButton::openUrl()\n{\n    if (!m_targetUrl.isEmpty())\n        QDesktopServices::openUrl(m_targetUrl);\n}\n```\nRemove `mousePressEvent` entirely.","locations":[{"ref":"frontend/components/UrlPushButton.cpp:18-27","code":"   18 | void UrlPushButton::mousePressEvent(QMouseEvent *event)\n   19 | {\n   20 | \tQ_UNUSED(event)\n   21 | \tQUrl openUrl = m_targetUrl;\n   22 | \tif (openUrl.isEmpty()) {\n   23 | \t\treturn;\n   24 | \t}\n   25 | \n   26 | \tQDesktopServices::openUrl(openUrl);\n   27 | }","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/UrlPushButton.cpp#L18-L27"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `setupExistingSource`, after duplicating the source the null-check tests the wrong variable. `source` holds the original (already validated non-null), while the duplication result is stored in `temp`. If `obs_source_duplicate` returns null, the guard `if (!source)` still passes and execution continues with `data.source = temp` (null), leading `obs_scene_add` to be called with a null source. Reachable via `sourcePaste` with `duplicate == true`.","fix":"Check the duplicate result: replace `if (!source) {` with `if (!temp) {` after the `obs_source_duplicate` call.","locations":[{"ref":"frontend/dialogs/OBSBasicSourceSelect.cpp:166-174","code":"  166 | \tif (duplicate) {\n  167 | \t\tOBSSource source = temp.Get();\n  168 | \t\tstd::string new_name = getNewSourceName(obs_source_get_name(source));\n  169 | \t\ttemp = obs_source_duplicate(source, new_name.c_str(), false);\n  170 | \n  171 | \t\tif (!source) {\n  172 | \t\t\treturn std::nullopt;\n  173 | \t\t}\n  174 | \t}","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicSourceSelect.cpp#L166-L174"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`requireRestart` is declared as a plain `bool` with no default initializer and is not set in the constructor initializer list. `OutputTypeChanged` only assigns it inside the `if (!vcamActive) return;`-guarded tail, so when the virtual camera is not active `requireRestart` is never initialized. `UpdateConfig` then reads it in `if (requireRestart)`, an uninitialized-value read that may spuriously emit `AcceptedAndRestart` instead of `Accepted`.","fix":"Initialize the member, e.g. `bool requireRestart = false;` in the header, or add `requireRestart(false)` to the constructor initializer list.","locations":[{"ref":"frontend/dialogs/OBSBasicVCamConfig.hpp:16","code":"   16 | \tbool requireRestart;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicVCamConfig.hpp#L16"},{"ref":"frontend/dialogs/OBSBasicVCamConfig.cpp:94-101","code":"   94 | \tif (!vcamActive) {\n   95 | \t\treturn;\n   96 | \t}\n   97 | \n   98 | \trequireRestart = (activeType == VCamOutputType::ProgramView && type != VCamOutputType::ProgramView) ||\n   99 | \t\t\t (activeType != VCamOutputType::ProgramView && type == VCamOutputType::ProgramView);\n  100 | \n  101 | \tui->warningLabel->setVisible(requireRestart);","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicVCamConfig.cpp#L94-L101"},{"ref":"frontend/dialogs/OBSBasicVCamConfig.cpp:124-128","code":"  124 | \tif (requireRestart) {\n  125 | \t\temit AcceptedAndRestart(config);\n  126 | \t} else {\n  127 | \t\temit Accepted(config);\n  128 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicVCamConfig.cpp#L124-L128"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `SaveSettings`, the `\"AutoStop\"` config key is written with `broadcast.auto_start` instead of `broadcast.auto_stop`. This is a copy-paste bug: the auto-stop preference is never persisted correctly, and `LoadSettings` will restore whatever value auto-start had, so the user's AutoStop choice is silently lost/corrupted.","fix":"```cpp\nconfig_set_bool(main->activeConfiguration, \"YouTube\", \"AutoStart\", broadcast.auto_start);\nconfig_set_bool(main->activeConfiguration, \"YouTube\", \"AutoStop\", broadcast.auto_stop);\n```","locations":[{"ref":"frontend/dialogs/OBSYoutubeActions.cpp:644-645","code":"  644 | \tconfig_set_bool(main->activeConfiguration, \"YouTube\", \"AutoStart\", broadcast.auto_start);\n  645 | \tconfig_set_bool(main->activeConfiguration, \"YouTube\", \"AutoStop\", broadcast.auto_start);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSYoutubeActions.cpp#L644-L645"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`YoutubeChatDock::isLoggedIn` is a `bool` member that is never initialized (the constructor `YoutubeChatDock(const QString &title) : BrowserDock(title) {}` does not set it). The first `urlChanged` signal invokes `YoutubeCookieCheck`, whose callback reads `bool previouslyLoggedIn = this_->isLoggedIn;` before it has ever been assigned. Reading an indeterminate `bool` is undefined behavior and, in practice, can make the initial `loginStateChanged` computation compute a bogus transition, spuriously invoking (or failing to invoke) `SettingsUpdated`.","fix":"Initialize the member: change\n```cpp\nbool isLoggedIn;\n```\nto\n```cpp\nbool isLoggedIn = false;\n```","locations":[{"ref":"frontend/docks/YouTubeChatDock.hpp:10","code":"   10 | \tbool isLoggedIn;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/docks/YouTubeChatDock.hpp#L10"},{"ref":"frontend/docks/YouTubeChatDock.cpp:18-22","code":"   18 | \tauto cb = [this_](bool currentlyLoggedIn) {\n   19 | \t\tbool previouslyLoggedIn = this_->isLoggedIn;\n   20 | \t\tthis_->isLoggedIn = currentlyLoggedIn;\n   21 | \t\tbool loginStateChanged = (currentlyLoggedIn && !previouslyLoggedIn) ||\n   22 | \t\t\t\t\t (!currentlyLoggedIn && previouslyLoggedIn);","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/docks/YouTubeChatDock.cpp#L18-L22"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`DeleteSceneCollection(name)` is meant to delete the collection named `name`, but when `name` is not the current collection it fetches `GetCurrentSceneCollection()` and calls `RemoveSceneCollection(currentCollection)` - deleting the CURRENT collection's file from disk - while only erasing `name` from the in-memory `collections` map. The analogous `DeleteProfile` correctly looks up `GetProfileByName(name)` and removes that. This deletes the wrong file on disk (data loss). Currently the method has no caller, but it is declared in the header and mirrors `DeleteProfile` which is invoked via `QMetaObject` from `OBSStudioAPI`, so it is a latent trap.","fix":"Look up the target collection by name and remove that one, like `DeleteProfile`:\n```cpp\nauto foundCollection = GetSceneCollectionByName(name.toStdString());\nif (!foundCollection) {\n    blog(LOG_ERROR, \"Invalid scene collection name: %s\", QT_TO_UTF8(name));\n    return;\n}\nRemoveSceneCollection(foundCollection.value());\ncollections.erase(name.toStdString());\n```","locations":[{"ref":"frontend/widgets/OBSBasic_SceneCollections.cpp:317-336","code":"  317 | void OBSBasic::DeleteSceneCollection(const QString &name)\n  318 | {\n  319 | \tconst std::string_view currentCollectionName{\n  320 | \t\tconfig_get_string(App()->GetUserConfig(), \"Basic\", \"SceneCollection\")};\n  321 | \n  322 | \tif (currentCollectionName == name.toStdString()) {\n  323 | \t\ton_actionRemoveSceneCollection_triggered();\n  324 | \t\treturn;\n  325 | \t}\n  326 | \n  327 | \tSceneCollection currentCollection = GetCurrentSceneCollection();\n  328 | \n  329 | \tRemoveSceneCollection(currentCollection);\n  330 | \n  331 | \tcollections.erase(name.toStdString());\n  332 | \n  333 | \tRefreshSceneCollections();\n  334 | \n  335 | \tOnEvent(OBS_FRONTEND_EVENT_SCENE_COLLECTION_LIST_CHANGED);\n  336 | }","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_SceneCollections.cpp#L317-L336"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`FastClearSupported` compares each version component independently (`aa >= 31 && bb >= 0 && ccccc >= 15 && ddddd >= 2737`) to check for NVIDIA driver `>= 31.0.15.2737`. This is not a valid version comparison. The low 16 bits `ddddd` hold the truncated GeForce build (e.g. driver 527.37 -> `2737`, but an older driver 474.11 -> `7411`), so an older driver whose `ddddd` happens to exceed `2737` passes the check and fast-clear is enabled where it should not be; conversely a newer major version with a small `ddddd` (e.g. a future `32.0.x.y`) fails the check. `bb >= 0` on a `uint16_t` is also always true.","fix":"Compare the version lexicographically as an ordered tuple / single packed value rather than component-wise, e.g. build `uint64_t v = ((uint64_t)aa<<48)|((uint64_t)bb<<32)|((uint64_t)ccccc<<16)|ddddd;` and compare against the packed reference `31.0.15.2737`. Note the low field is a truncated build number, so this only works if the encoding is consistent; if not, the whole heuristic needs the real driver build number.","locations":[{"ref":"libobs-d3d11/d3d11-subsystem.cpp:588-602","code":"  588 | static bool FastClearSupported(UINT vendorId, uint64_t version)\n  589 | {\n  590 | \t/* Always true for non-NVIDIA GPUs */\n  591 | \tif (vendorId != 0x10de) {\n  592 | \t\treturn true;\n  593 | \t}\n  594 | \n  595 | \tconst uint16_t aa = (version >> 48) & 0xffff;\n  596 | \tconst uint16_t bb = (version >> 32) & 0xffff;\n  597 | \tconst uint16_t ccccc = (version >> 16) & 0xffff;\n  598 | \tconst uint16_t ddddd = version & 0xffff;\n  599 | \n  600 | \t/* Check for NVIDIA driver version >= 31.0.15.2737 */\n  601 | \treturn aa >= 31 && bb >= 0 && ccccc >= 15 && ddddd >= 2737;\n  602 | }","lines":15,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-d3d11/d3d11-subsystem.cpp#L588-L602"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `is16Bit`, `.rg16Float` is listed as a 16-bit format, but `.rg16Float` (two 16-bit half floats) is a 32-bit / 4-byte format and is also correctly listed in `is32Bit` (line 71). Because `bitsPerPixel` checks `is8Bit`/`is16Bit` before `is32Bit`, it returns `16` for `.rg16Float` instead of `32`; `bytesPerPixel` returns `2` instead of `4`, and `bitsPerComponent` then returns `8` instead of `16`. Since `.rg16Float` maps to/from `GS_RG16F` in `gsColorFormat`, any pitch/allocation math relying on these properties for an `rg16Float` texture is half the correct size.","fix":"Remove `.rg16Float` from the `is16Bit` switch (it already appears in `is32Bit`):\n```swift\n// before\ncase .rg16Float:\n    return true\n// after: delete this case from is16Bit\n```","locations":[{"ref":"libobs-metal/MTLPixelFormat+Extensions.swift:43","code":"   43 |         case .rg16Float:","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/MTLPixelFormat+Extensions.swift#L43"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`bytesPerPixel` handles 8/16/32/64-bit formats but has no branch for `is128Bit`, so 128-bit formats (`.rgba32Uint`, `.rgba32Sint`, `.rgba32Float`) fall through to `return nil`. This is inconsistent with `bitsPerPixel`, which returns `128` for the same formats. Callers computing byte sizes for a 128-bit (e.g. `rgba32Float`/`GS_RGBA32F`) texture get `nil` instead of `16`.","fix":"Add a 128-bit branch before the final `else`:\n```swift\n} else if self.is64Bit {\n    return 8\n} else if self.is128Bit {\n    return 16\n} else {\n    return nil\n}\n```","locations":[{"ref":"libobs-metal/MTLPixelFormat+Extensions.swift:312-333","code":"  312 |     var bytesPerPixel: Int? {\n  313 |         if self.is8Bit {\n  314 |             return 1\n  315 |         } else if self.is16Bit || self.isPacked16Bit {\n  316 |             return 2\n  317 |         } else if self.is32Bit {\n  318 |             return 4\n  319 |         } else if self.isPacked32Bit {\n  320 |             switch self {\n  321 |             case .rgb10a2Unorm, .rgb10a2Uint, .bgr10a2Unorm, .rg11b10Float, .rgb9e5Float:\n  322 |                 return 4\n  323 |             case .bgr10_xr, .bgr10_xr_srgb:\n  324 |                 return 8\n  325 |             default:\n  326 |                 return nil\n  327 |             }\n  328 |         } else if self.is64Bit {\n  329 |             return 8\n  330 |         } else {\n  331 |             return nil\n  332 |         }\n  333 |     }","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/MTLPixelFormat+Extensions.swift#L312-L333"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`descriptor.maxAnisotropy = max(16, min(1, Int(info.max_anisotropy)))` never clamps to the intended range. `min(1, x)` yields at most `1`, and `max(16, <=1)` is always `16`, so `maxAnisotropy` is forced to `16` for every sampler regardless of the requested value. This ignores `info.max_anisotropy` entirely, forcing maximum anisotropic filtering (a needless performance cost) and diverging from the requested filtering. The `MTLSamplerDescriptor` created inside `OBSShader.buildMetadata` uses the raw value with no such clamp, so behavior is also inconsistent.","fix":"Clamp into the valid `1...16` range:\n```swift\ndescriptor.maxAnisotropy = max(1, min(16, Int(info.max_anisotropy)))\n```","locations":[{"ref":"libobs-metal/metal-samplerstate.swift:54","code":"   54 |     descriptor.maxAnisotropy = max(16, min(1, Int(info.max_anisotropy)))","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-samplerstate.swift#L54"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `device_clear` the clear-flag tests use `== 1` instead of `!= 0`. The flags are bitmasks: `GS_CLEAR_COLOR == 1`, `GS_CLEAR_DEPTH == 2`, `GS_CLEAR_STENCIL == 4`. `(Int32(clearFlags) & GS_CLEAR_DEPTH) == 1` evaluates `(x & 2) == 1`, which is `0` or `2` and thus never equals `1`; likewise `(x & GS_CLEAR_STENCIL) == 1` is `(x & 4) == 1`, never true. Consequently depth and stencil clears are NEVER performed. The color test happens to work only because `GS_CLEAR_COLOR` is `1`. Every other flag test in this codebase (e.g. `MTLTextureDescriptor+Extensions.swift`, `device_indexbuffer_create`) correctly uses `!= 0`.","fix":"Compare against `0` with `!=`:\n```swift\nif (Int32(clearFlags) & GS_CLEAR_COLOR) != 0 { ... }\nif (Int32(clearFlags) & GS_CLEAR_DEPTH) != 0 { ... }\nif (Int32(clearFlags) & GS_CLEAR_STENCIL) != 0 { ... }\n```","locations":[{"ref":"libobs-metal/metal-subsystem.swift:521-545","code":"  521 |     if (Int32(clearFlags) & GS_CLEAR_COLOR) == 1 {\n  522 |         clearState.colorAction = .clear\n  523 |         clearState.clearColor = MTLClearColor(\n  524 |             red: Double(color.pointee.x),\n  525 |             green: Double(color.pointee.y),\n  526 |             blue: Double(color.pointee.z),\n  527 |             alpha: Double(color.pointee.w)\n  528 |         )\n  529 |     } else {\n  530 |         clearState.colorAction = .load\n  531 |     }\n  532 | \n  533 |     if (Int32(clearFlags) & GS_CLEAR_DEPTH) == 1 {\n  534 |         clearState.clearDepth = Double(depth)\n  535 |         clearState.depthAction = .clear\n  536 |     } else {\n  537 |         clearState.depthAction = .load\n  538 |     }\n  539 | \n  540 |     if (Int32(clearFlags) & GS_CLEAR_STENCIL) == 1 {\n  541 |         clearState.clearStencil = UInt32(stencil)\n  542 |         clearState.stencilAction = .clear\n  543 |     } else {\n  544 |         clearState.stencilAction = .load\n  545 |     }","lines":25,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-subsystem.swift#L521-L545"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The bounds check in `device_copy_texture_region` uses `>` where it should use `>=`, rejecting valid exact-fit copies. `destinationRegion.size.width` is set to `destination.texture.width` and `origin.x` to `dst_x`, so the check requires `(destWidth - dst_x) > sourceWidth`. When a region exactly fills the remaining destination space (the common case of copying a full texture into another texture of identical size with `dst_x == 0`, giving `destWidth > destWidth`), the guard fails and the copy is skipped with an error, even though it is perfectly valid.","fix":"Use `>=`:\n```swift\nguard\n    destinationRegion.size.width - destinationRegion.origin.x >= sourceRegion.size.width\n        && destinationRegion.size.height - destinationRegion.origin.y >= sourceRegion.size.height\nelse { ... }\n```","locations":[{"ref":"libobs-metal/metal-texture2d.swift:226-235","code":"  226 |     guard\n  227 |         destinationRegion.size.width - destinationRegion.origin.x > sourceRegion.size.width\n  228 |             && destinationRegion.size.height - destinationRegion.origin.y > sourceRegion.size.height\n  229 |     else {\n  230 |         OBSLog(\n  231 |             .error,\n  232 |             \"device_copy_texture_region: Destination texture \\(destinationRegion.size) is not large enough to hold source region (\\(sourceRegion.size) at origin \\(destinationRegion.origin)\"\n  233 |         )\n  234 |         return\n  235 |     }","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-texture2d.swift#L226-L235"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`gs_texture_map` decides whether to recreate the staging buffer with `texture.stageBuffer!.width != texture.texture.width && texture.stageBuffer!.height != texture.texture.height`. Using `&&` means the buffer is only recreated when BOTH dimensions changed. If a texture is resized such that only one dimension differs (e.g. 100x100 -> 200x100), the condition is `true && false == false`, so the stale, wrongly-sized `MetalStageBuffer` is reused. `linesize` is then reported from the old buffer width and the buffer capacity no longer matches the new texture, leading to incorrect mapping/upload and potential out-of-bounds writes.","fix":"Recreate when either dimension differs:\n```swift\nif texture.stageBuffer == nil\n    || (texture.stageBuffer!.width != texture.texture.width\n        || texture.stageBuffer!.height != texture.texture.height)\n{\n```","locations":[{"ref":"libobs-metal/metal-texture2d.swift:359-361","code":"  359 |     if texture.stageBuffer == nil\n  360 |         || (texture.stageBuffer!.width != texture.texture.width\n  361 |             && texture.stageBuffer!.height != texture.texture.height)","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-texture2d.swift#L359-L361"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `convert_sampler_info`, the call `vec4_from_rgba(&sampler->border_color, info->border_color)` sits *after* the early `return` taken when `max_anisotropy` is already in the valid range `[1, max_anisotropy_max]` (the common case). Because the sampler is `bzalloc`ed, `sampler->border_color` therefore stays `{0,0,0,0}` for every normally-constructed sampler, and the requested `info->border_color` is only honored on the rare path where anisotropy had to be clamped. Any sampler using `GS_ADDRESS_BORDER` with a non-transparent-black border color renders with the wrong (black/transparent) border.","fix":"Move the border-color conversion so it always runs, e.g. compute it before the range check:\n```c\nvec4_from_rgba(&sampler->border_color, info->border_color);\n\nif (1 <= sampler->max_anisotropy && sampler->max_anisotropy <= max_anisotropy_max)\n    return;\n```\nand drop the duplicate call from the clamp branch.","locations":[{"ref":"libobs-opengl/gl-subsystem.c:186-194","code":"  186 | \tif (1 <= sampler->max_anisotropy && sampler->max_anisotropy <= max_anisotropy_max)\n  187 | \t\treturn;\n  188 | \n  189 | \tif (sampler->max_anisotropy < 1)\n  190 | \t\tsampler->max_anisotropy = 1;\n  191 | \telse if (sampler->max_anisotropy > max_anisotropy_max)\n  192 | \t\tsampler->max_anisotropy = max_anisotropy_max;\n  193 | \n  194 | \tvec4_from_rgba(&sampler->border_color, info->border_color);","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-subsystem.c#L186-L194"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`coreaudio-output.c` (`audio_monitor_init`): The function initialises `monitor->empty_buffers` with three buffer pointers via `deque_push_back` (lines 214-215) before `pthread_mutex_init` succeeds (line 217). If the mutex init fails and the function returns `false`, `audio_monitor_free` will be called, which calls `deque_free(&monitor->empty_buffers)`. However, the queue references `AudioQueueBufferRef` objects that were allocated by `AudioQueueAllocateBuffer` and are owned by `monitor->queue`. But `audio_monitor_free` also calls `AudioQueueFreeBuffer` for each of `monitor->buffers[i]` *and* then `AudioQueueDispose`. Double-freeing the buffers via both `deque_free` clearing the deque structure and `AudioQueueFreeBuffer` is not an issue because the deque stores copies of the pointer values, not pointers-to-pointers. However, the buffers are enqueued in `empty_buffers` before the queue is started, so if `AudioQueueStart` fails the buffers are already in the deque but never submitted. The `fill_buffer` function will attempt to dequeue and submit them. This path seems safe in practice because `AudioQueueFreeBuffer` frees all buffers when `AudioQueueDispose` is called.\n\nMore critically: `pthread_mutex_init_value` is called at line 166 to set the mutex to an invalid value, but `pthread_mutex_init` is called at line 217 only after the buffers are pushed. Between lines 209-215 (the buffer allocation loop) and line 217 (mutex init), there is no mutex, but `monitor->empty_buffers` is already populated. If `buffer_audio` callback fires on one of the newly allocated buffers before the mutex is initialised, the mutex lock in `buffer_audio` (line 126) will operate on an uninitialised mutex.","fix":"Move `pthread_mutex_init` to before the buffer allocation loop (before line 208) so the mutex exists before any AudioQueue callbacks can fire. Also move `deque_push_back` for the empty buffers to after the mutex is initialised and after `AudioQueueStart`.","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-output.c:208-220","code":"  208 | \tfor (size_t i = 0; i < 3; i++) {\n  209 | \t\tstat = AudioQueueAllocateBuffer(monitor->queue, (UInt32)monitor->buffer_size, &monitor->buffers[i]);\n  210 | \t\tif (!success(stat, \"allocation of buffer\")) {\n  211 | \t\t\treturn false;\n  212 | \t\t}\n  213 | \n  214 | \t\tdeque_push_back(&monitor->empty_buffers, &monitor->buffers[i], sizeof(monitor->buffers[i]));\n  215 | \t}\n  216 | \n  217 | \tif (pthread_mutex_init(&monitor->mutex, NULL) != 0) {\n  218 | \t\tblog(LOG_WARNING, \"%s: %s\", __FUNCTION__, \"Failed to init mutex\");\n  219 | \t\treturn false;\n  220 | \t}","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/osx/coreaudio-output.c#L208-L220"},{"ref":"libobs/audio-monitoring/osx/coreaudio-output.c:166","code":"  166 | \tpthread_mutex_init_value(&monitor->mutex);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/osx/coreaudio-output.c#L166"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`pulseaudio-output.c` (`audio_monitor_reset`): after calling `audio_monitor_free(monitor)`, which destroys the playback mutex among other resources, the code then calls `pthread_mutex_lock(&monitor->playback_mutex)` on the now-destroyed mutex (line 505). This is undefined behaviour. The `pthread_mutex_init_value` macro used by `audio_monitor_init` initialises the mutex inside `new_monitor`, not `monitor`, so there is nothing valid to lock. By contrast, the WASAPI implementation (`wasapi-output.c`) correctly acquires `monitor->playback_mutex` before freeing, then re-initialises inside `audio_monitor_init` of the new monitor object.","fix":"Acquire the mutex before calling `audio_monitor_free`, then unlock after `audio_monitor_init` returns (mirroring the WASAPI pattern), or protect the reset via an external lock that is not destroyed during the reset:\n```c\nvoid audio_monitor_reset(struct audio_monitor *monitor)\n{\n    struct audio_monitor new_monitor = {0};\n    bool success;\n\n    pthread_mutex_lock(&monitor->playback_mutex);\n    audio_monitor_free(monitor);  /* destroys playback_mutex - do NOT unlock after */\n    /* mutex is gone; must not unlock */\n    success = audio_monitor_init(&new_monitor, monitor->source);\n    if (success) {\n        *monitor = new_monitor;\n        audio_monitor_init_final(monitor);\n    } else {\n        audio_monitor_free(&new_monitor);\n    }\n}\n```\nThe real fix is to hold a separate reset-protection lock that outlives the monitor's internal mutex.","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-output.c:499-514","code":"  499 | void audio_monitor_reset(struct audio_monitor *monitor)\n  500 | {\n  501 | \tstruct audio_monitor new_monitor = {0};\n  502 | \tbool success;\n  503 | \taudio_monitor_free(monitor);\n  504 | \n  505 | \tpthread_mutex_lock(&monitor->playback_mutex);\n  506 | \tsuccess = audio_monitor_init(&new_monitor, monitor->source);\n  507 | \tpthread_mutex_unlock(&monitor->playback_mutex);\n  508 | \n  509 | \tif (success) {\n  510 | \t\t*monitor = new_monitor;\n  511 | \t\taudio_monitor_init_final(monitor);\n  512 | \t} else {\n  513 | \t\taudio_monitor_free(&new_monitor);\n  514 | \t}","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/pulse/pulseaudio-output.c#L499-L514"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`pulseaudio_wrapper.c`: `get_default_id` allocates a buffer of `strlen(pdo->default_sink_name) + 9` bytes and then copies the sink name into it with `strcat`. However, `strcat` requires the destination to be a null-terminated string before appending, but the freshly `bzalloc`-d buffer is only guaranteed to be zero-initialised, not a valid C string (the first byte is `\\0`, which satisfies the requirement in this case). More importantly, the constant `9` is hardcoded but no `.monitor` suffix is appended here - the size accounting seems to be a leftover from a copy-paste from `devices_match` where `.monitor` is appended. In `get_default_id` only the bare sink name is needed, so `+ 9` is spurious. This wastes 8 bytes but is not a buffer overflow.\n\nIn `devices_match`, the same `+ 9` pattern is used to accommodate `\".monitor\"` (8 chars + NUL = 9). When `id2` is not `\"default\"`, the buffer is `strlen(id2) + 9` and `id2 + \".monitor\"` is concatenated. If `id2` already ends in `\".monitor\"`, the result would be `id2 + \".monitor\"` vs `id2`, so the comparison logic is wrong when the source is already a monitor device and neither side is `\"default\"`. This is a design-level logic error: a source whose `device_id` already is `\"sink.monitor\"` will never match the monitoring sink `\"sink\"` because `name2` becomes `\"sink.monitor.monitor\"`.","fix":"In `get_default_id`, change the allocation size to `strlen(...) + 1` since no suffix is appended. In `devices_match`, before appending `.monitor` to `id2`, check whether it already ends in `.monitor` to avoid double-suffixing.","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-wrapper.c:42-58","code":"   42 | void get_default_id(char **id)\n   43 | {\n   44 | \tpulseaudio_init();\n   45 | \tstruct pulseaudio_default_output *pdo = bzalloc(sizeof(struct pulseaudio_default_output));\n   46 | \tpulseaudio_get_server_info((pa_server_info_cb_t)pulseaudio_default_devices, (void *)pdo);\n   47 | \n   48 | \tif (!pdo->default_sink_name || !*pdo->default_sink_name) {\n   49 | \t\t*id = bzalloc(1);\n   50 | \t} else {\n   51 | \t\t*id = bzalloc(strlen(pdo->default_sink_name) + 9);\n   52 | \t\tstrcat(*id, pdo->default_sink_name);\n   53 | \t\tbfree(pdo->default_sink_name);\n   54 | \t}\n   55 | \n   56 | \tbfree(pdo);\n   57 | \tpulseaudio_unref();\n   58 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/pulse/pulseaudio-wrapper.c#L42-L58"},{"ref":"libobs/audio-monitoring/pulse/pulseaudio-wrapper.c:64-100","code":"   64 | bool devices_match(const char *id1, const char *id2)\n   65 | {\n   66 | \tbool match;\n   67 | \tchar *name_default = NULL;\n   68 | \tchar *name1 = NULL;\n   69 | \tchar *name2 = NULL;\n   70 | \n   71 | \tif (!id1 || !id2)\n   72 | \t\treturn false;\n   73 | \n   74 | \tif (strcmp(id1, \"default\") == 0) {\n   75 | \t\tget_default_id(&name_default);\n   76 | \t\tname1 = bzalloc(strlen(name_default) + 9);\n   77 | \t\tstrcat(name1, name_default);\n   78 | \t\tstrcat(name1, \".monitor\");\n   79 | \t} else {\n   80 | \t\tname1 = bstrdup(id1);\n   81 | \t}\n   82 | \n   83 | \tif (strcmp(id2, \"default\") == 0) {\n   84 | \t\tif (!name_default)\n   85 | \t\t\tget_default_id(&name_default);\n   86 | \t\tname2 = bzalloc(strlen(name_default) + 9);\n   87 | \t\tstrcat(name2, name_default);\n   88 | \t\tstrcat(name2, \".monitor\");\n   89 | \t} else {\n   90 | \t\tname2 = bzalloc(strlen(id2) + 9);\n   91 | \t\tstrcat(name2, id2);\n   92 | \t\tstrcat(name2, \".monitor\");\n   93 | \t}\n   94 | \n   95 | \tmatch = strcmp(name1, name2) == 0;\n   96 | \tbfree(name_default);\n   97 | \tbfree(name1);\n   98 | \tbfree(name2);\n   99 | \treturn match;\n  100 | }","lines":37,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/pulse/pulseaudio-wrapper.c#L64-L100"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`calldata.c` (`calldata_set_data`): when updating an existing parameter that is larger than the new value (the `cur_size > size` branch, lines 204-208), the `memmove` destination and source are computed as:\n```c\nmemmove(pos, pos + offset, bytes - (pos - data->stack));\n```\nHere `bytes = data->size - offset` and `offset = cur_size - size`. This shrinks the region after the parameter being updated. However, `pos` at this point still points to the data-size field of the existing entry (i.e., just after the name field), not to the start of the actual data payload. So the memmove slides the tail of the stack (everything from `pos` onwards) `offset` bytes earlier, overwriting the existing size header and data with the new data. The subsequent `cd_copy_data` then writes the new size and data at `pos`. This is correct *if* `pos` points to the first byte of the size+data field for the parameter found. Looking at `cd_getparam`: on a successful match, `*pos` is advanced past the name, leaving `pos` pointing at the data-size field for that parameter. So the logic is correct. However, the formula `bytes - (pos - data->stack)` computes the number of bytes from `pos` to the end of the stack, which is the correct memmove length. This appears correct on review - no bug here, just complex code.","fix":"No code change needed; consider adding a comment clarifying that `pos` points to the size-prefix of the parameter's data field at this point, and that `bytes` accounts for the full tail from `pos`.","locations":[{"ref":"libobs/callback/calldata.c:191-212","code":"  191 | \tif (cd_getparam(data, name, &pos)) {\n  192 | \t\tsize_t cur_size;\n  193 | \t\tmemcpy(&cur_size, pos, sizeof(size_t));\n  194 | \n  195 | \t\tif (cur_size < size) {\n  196 | \t\t\tsize_t offset = size - cur_size;\n  197 | \t\t\tsize_t bytes = data->size;\n  198 | \n  199 | \t\t\tif (!cd_ensure_capacity(data, &pos, bytes + offset))\n  200 | \t\t\t\treturn;\n  201 | \t\t\tmemmove(pos + offset, pos, bytes - (pos - data->stack));\n  202 | \t\t\tdata->size += offset;\n  203 | \n  204 | \t\t} else if (cur_size > size) {\n  205 | \t\t\tsize_t offset = cur_size - size;\n  206 | \t\t\tsize_t bytes = data->size - offset;\n  207 | \n  208 | \t\t\tmemmove(pos, pos + offset, bytes - (pos - data->stack));\n  209 | \t\t\tdata->size -= offset;\n  210 | \t\t}\n  211 | \n  212 | \t\tcd_copy_data(&pos, in, size);","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/callback/calldata.c#L191-L212"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `bounds_get_point`, the guard is `if (i > 8) return;` but valid indices are 0-7 (8 corners of a box). Index 8 is out of range and will not be caught. The correct guard should be `i >= 8`.","fix":"Change the guard to `>= 8`:\n```c\nif (i >= 8)\n    return;\n```","locations":[{"ref":"libobs/graphics/bounds.c:50-51","code":"   50 | \tif (i > 8)\n   51 | \t\treturn;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/bounds.c#L50-L51"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `bounds_plane_test` (`bounds.c`), the function declares return type `bool` but the three return statements return the integer constants `BOUNDS_OUTSIDE` (1), `BOUNDS_PARTIAL` (3), and `BOUNDS_INSIDE` (2). The header (`bounds.h`) also declares the function as returning `bool`. All callers that check for `BOUNDS_OUTSIDE`, `BOUNDS_PARTIAL`, or `BOUNDS_INSIDE` will get `true` for any non-zero value, making it impossible to distinguish the three cases. The return type must be `int` (or an enum) to be useful.","fix":"Change the return type to `int` in both the `.c` implementation and the `.h` declaration:\n```c\n// bounds.h\nEXPORT int bounds_plane_test(const struct bounds *b, const struct plane *p);\n\n// bounds.c\nint bounds_plane_test(const struct bounds *b, const struct plane *p)\n```","locations":[{"ref":"libobs/graphics/bounds.c:228-250","code":"  228 | bool bounds_plane_test(const struct bounds *b, const struct plane *p)\n  229 | {\n  230 | \tstruct vec3 vmin, vmax;\n  231 | \tint i;\n  232 | \n  233 | \tfor (i = 0; i < 3; i++) {\n  234 | \t\tif (p->dir.ptr[i] >= 0.0f) {\n  235 | \t\t\tvmin.ptr[i] = b->min.ptr[i];\n  236 | \t\t\tvmax.ptr[i] = b->max.ptr[i];\n  237 | \t\t} else {\n  238 | \t\t\tvmin.ptr[i] = b->max.ptr[i];\n  239 | \t\t\tvmax.ptr[i] = b->min.ptr[i];\n  240 | \t\t}\n  241 | \t}\n  242 | \n  243 | \tif (vec3_plane_dist(&vmin, p) > 0.0f)\n  244 | \t\treturn BOUNDS_OUTSIDE;\n  245 | \n  246 | \tif (vec3_plane_dist(&vmax, p) >= 0.0f)\n  247 | \t\treturn BOUNDS_PARTIAL;\n  248 | \n  249 | \treturn BOUNDS_INSIDE;\n  250 | }","lines":23,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/bounds.c#L228-L250"},{"ref":"libobs/graphics/bounds.h:71","code":"   71 | EXPORT bool bounds_plane_test(const struct bounds *b, const struct plane *p);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/bounds.h#L71"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Both `gs_param_get_annotation_by_idx` and `gs_technique_get_pass_by_idx` use `>` instead of\n`>=` for their bounds checks. When the caller passes `annotation == param->annotations.num` or\n`pass == technique->passes.num`, the check passes and `params + num` (one element past the end\nof the array) is returned - an out-of-bounds pointer. The analogous function\n`gs_effect_get_param_by_idx` at line 269 correctly uses `>=`.","fix":"Change `>` to `>=` in both guards:\n\n```c\n// gs_param_get_annotation_by_idx\nif (annotation >= param->annotations.num)\n    return NULL;\n\n// gs_technique_get_pass_by_idx\nif (pass >= technique->passes.num)\n    return NULL;\n```","locations":[{"ref":"libobs/graphics/effect.c:303-306","code":"  303 | \tif (annotation > param->annotations.num)\n  304 | \t\treturn NULL;\n  305 | \n  306 | \treturn params + annotation;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/effect.c#L303-L306"},{"ref":"libobs/graphics/effect.c:329-332","code":"  329 | \tif (pass > technique->passes.num)\n  330 | \t\treturn NULL;\n  331 | \n  332 | \treturn passes + pass;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/effect.c#L329-L332"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`gs_reset_blend_state` passes the wrong function name to `gs_valid`. It passes\n`\"gs_preprocessor_name\"` instead of `\"gs_reset_blend_state\"`. If the call is made outside a\ngraphics context, the debug log message will name the wrong function, making diagnostics\nmisleading. The real `gs_preprocessor_name` at line 1309 makes the same call with the same\n(correct) string.","fix":"Change `gs_valid(\"gs_preprocessor_name\")` to `gs_valid(\"gs_reset_blend_state\")`.","locations":[{"ref":"libobs/graphics/graphics.c:1288-1289","code":" 1288 | \tif (!gs_valid(\"gs_preprocessor_name\"))\n 1289 | \t\treturn;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics.c#L1288-L1289"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`polar_to_norm` in math-extra.c converts a 2D polar coordinate (azimuth, elevation) to a 3D unit vector, but the component assignments do not match the inverse function `norm_to_polar`. `norm_to_polar` uses `atan2f(norm->x, norm->z)` for x (azimuth) and `asinf(norm->y)` for y (elevation). The round-trip is broken: `polar_to_norm` sets `dst->x = sinx * cosf(polar->y)` and `dst->y = sinx * sinf(polar->y)` - this interprets polar->y as an azimuthal angle, but `norm_to_polar` stores elevation in y. The Y and Z assignments are effectively swapped relative to what `norm_to_polar` expects.","fix":"Match the convention established by `norm_to_polar`:\n```c\nvoid polar_to_norm(struct vec3 *dst, const struct vec2 *polar)\n{\n    float cosy = cosf(polar->y);  // elevation\n    dst->x = cosy * sinf(polar->x);\n    dst->y = sinf(polar->y);\n    dst->z = cosy * cosf(polar->x);\n}\n```","locations":[{"ref":"libobs/graphics/math-extra.c:58-65","code":"   58 | void polar_to_norm(struct vec3 *dst, const struct vec2 *polar)\n   59 | {\n   60 | \tfloat sinx = sinf(polar->x);\n   61 | \n   62 | \tdst->x = sinx * cosf(polar->y);\n   63 | \tdst->y = sinx * sinf(polar->y);\n   64 | \tdst->z = cosf(polar->x);\n   65 | }","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/math-extra.c#L58-L65"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`matrix3_transpose` in matrix3.c (lines 106-107) computes `dst->t` by rotating m->t through m and then negating. A pure transpose of a 3x4 transform matrix does not transform the translation vector at all; the `t` row is simply zeroed (or left undefined) in the transposed result. The current code produces a wrong translation component in `dst->t`.","fix":"After transposing the 3x3 rotation block, set `dst->t` to zero:\n```c\nvoid matrix3_transpose(struct matrix3 *dst, const struct matrix3 *m)\n{\n    __m128 tmp1, tmp2;\n    vec3_zero(&dst->t);\n\n    tmp1 = _mm_movelh_ps(m->x.m, m->y.m);\n    tmp2 = _mm_movehl_ps(m->y.m, m->x.m);\n    dst->x.m = _mm_shuffle_ps(tmp1, m->z.m, _MM_SHUFFLE(3, 0, 2, 0));\n    dst->y.m = _mm_shuffle_ps(tmp1, m->z.m, _MM_SHUFFLE(3, 1, 3, 1));\n    dst->z.m = _mm_shuffle_ps(tmp2, m->z.m, _MM_SHUFFLE(3, 2, 2, 0));\n}\n```","locations":[{"ref":"libobs/graphics/matrix3.c:103-113","code":"  103 | void matrix3_transpose(struct matrix3 *dst, const struct matrix3 *m)\n  104 | {\n  105 | \t__m128 tmp1, tmp2;\n  106 | \tvec3_rotate(&dst->t, &m->t, m);\n  107 | \tvec3_neg(&dst->t, &dst->t);\n  108 | \n  109 | \ttmp1 = _mm_movelh_ps(m->x.m, m->y.m);\n  110 | \ttmp2 = _mm_movehl_ps(m->y.m, m->x.m);\n  111 | \tdst->x.m = _mm_shuffle_ps(tmp1, m->z.m, _MM_SHUFFLE(3, 0, 2, 0));\n  112 | \tdst->y.m = _mm_shuffle_ps(tmp1, m->z.m, _MM_SHUFFLE(3, 1, 3, 1));\n  113 | \tdst->z.m = _mm_shuffle_ps(tmp2, m->z.m, _MM_SHUFFLE(3, 2, 2, 0));","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/matrix3.c#L103-L113"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`matrix3_translate` in matrix3.h subtracts the translation vector instead of adding it. This is the opposite of the conventional definition of a translate operation and is inconsistent with `matrix4_translate3v` which builds a proper translation matrix.","fix":"Change `vec3_sub` to `vec3_add`:\n```c\nstatic inline void matrix3_translate(struct matrix3 *dst, const struct matrix3 *m, const struct vec3 *v)\n{\n    vec3_add(&dst->t, &m->t, v);\n}\n```","locations":[{"ref":"libobs/graphics/matrix3.h:60-63","code":"   60 | static inline void matrix3_translate(struct matrix3 *dst, const struct matrix3 *m, const struct vec3 *v)\n   61 | {\n   62 | \tvec3_sub(&dst->t, &m->t, v);\n   63 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/matrix3.h#L60-L63"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`quat_set` in quat.h sets the components in the wrong order. `_mm_set_ps` fills the SSE register as (w=arg0, z=arg1, y=arg2, x=arg3), meaning the call `_mm_set_ps(x, y, z, w)` maps: register.w=x, register.z=y, register.y=z, register.x=w - i.e. the x and w arguments are swapped. Every call to `quat_set` therefore produces a quaternion with x and w exchanged.","fix":"Correct the argument order to match the SSE lane convention used everywhere else (e.g. `vec4_set`):\n```c\nstatic inline void quat_set(struct quat *dst, float x, float y, float z, float w)\n{\n    dst->m = _mm_set_ps(w, z, y, x);\n}\n```","locations":[{"ref":"libobs/graphics/quat.h:58-61","code":"   58 | static inline void quat_set(struct quat *dst, float x, float y, float z, float w)\n   59 | {\n   60 | \tdst->m = _mm_set_ps(x, y, z, w);\n   61 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/quat.h#L58-L61"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`vec3_close` (vec3.h:155-160) and `quat_close` (quat.h:147-151) both check `test.x < epsilon && test.y < epsilon && test.z < epsilon` after subtracting the two vectors. This only tests whether components are *less than* epsilon, not whether they are within [-epsilon, epsilon]. Negative differences larger in magnitude than epsilon will pass the check silently, producing false-positive \"close\" results. `vec4_close` has the same flaw (vec4.h:138-143).","fix":"Use `fabsf` on each component before comparing:\n```c\nstatic inline bool vec3_close(const struct vec3 *v1, const struct vec3 *v2, float epsilon)\n{\n    struct vec3 test;\n    vec3_sub(&test, v1, v2);\n    return fabsf(test.x) < epsilon && fabsf(test.y) < epsilon && fabsf(test.z) < epsilon;\n}\n```\nApply the same fix to `vec4_close` and `quat_close`.","locations":[{"ref":"libobs/graphics/vec3.h:155-160","code":"  155 | static inline bool vec3_close(const struct vec3 *v1, const struct vec3 *v2, float epsilon)\n  156 | {\n  157 | \tstruct vec3 test;\n  158 | \tvec3_sub(&test, v1, v2);\n  159 | \treturn test.x < epsilon && test.y < epsilon && test.z < epsilon;\n  160 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/vec3.h#L155-L160"},{"ref":"libobs/graphics/quat.h:147-151","code":"  147 | {\n  148 | \tstruct quat test;\n  149 | \tquat_sub(&test, q1, q2);\n  150 | \treturn test.x < epsilon && test.y < epsilon && test.z < epsilon && test.w < epsilon;\n  151 | }","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/quat.h#L147-L151"},{"ref":"libobs/graphics/vec4.h:138-143","code":"  138 | static inline int vec4_close(const struct vec4 *v1, const struct vec4 *v2, float epsilon)\n  139 | {\n  140 | \tstruct vec4 test;\n  141 | \tvec4_sub(&test, v1, v2);\n  142 | \treturn test.x < epsilon && test.y < epsilon && test.z < epsilon && test.w < epsilon;\n  143 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/vec4.h#L138-L143"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `process_packets` (media-remux.c line 200), `pkt.stream_index` from an untrusted input file is used directly to index `job->ofmt_ctx->streams[]` without validating that `pkt.stream_index < job->ofmt_ctx->nb_streams`. A malformed or malicious file with a stream index larger than the number of output streams causes an out-of-bounds array access.","fix":"Add a bounds check before using `pkt.stream_index`:\n```c\nif ((unsigned)pkt.stream_index >= job->ofmt_ctx->nb_streams) {\n    av_packet_unref(&pkt);\n    continue;\n}\nprocess_packet(&pkt, job->ifmt_ctx->streams[pkt.stream_index],\n               job->ofmt_ctx->streams[pkt.stream_index]);\n```","locations":[{"ref":"libobs/media-io/media-remux.c:200-201","code":"  200 | \t\tprocess_packet(&pkt, job->ifmt_ctx->streams[pkt.stream_index],\n  201 | \t\t\t       job->ofmt_ctx->streams[pkt.stream_index]);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/media-remux.c#L200-L201"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `media_remux_job_process` (media-remux.c lines 238-239), the success condition is `ret >= 0 || ret == AVERROR_EOF`. `AVERROR_EOF` is a negative value (defined as `-(('E'<<24)|...)` in FFmpeg), so `ret == AVERROR_EOF` is already captured by `ret >= 0` being false - but the intent is that EOF is a successful termination. This is correct logic but fragile. More critically, `process_packets` returns `ret` which is the return code of `av_read_frame` after the last iteration. If the loop `break`s due to a callback returning false, `ret` holds the last `av_read_frame` result which was 0 (success), so `success = true` even though processing was intentionally aborted.","fix":"Use a separate sentinel to distinguish \"cancelled by callback\" from \"normal EOF\":\n```c\nstatic inline int process_packets(...) {\n    bool cancelled = false;\n    for (;;) {\n        ret = av_read_frame(job->ifmt_ctx, &pkt);\n        if (ret < 0) break;\n        if (callback && ...) {\n            if (!callback(data, progress)) { cancelled = true; break; }\n        }\n        // ...\n    }\n    return cancelled ? -1 : ret;\n}\n```","locations":[{"ref":"libobs/media-io/media-remux.c:238-239","code":"  238 | \tret = process_packets(job, callback, data);\n  239 | \tsuccess = ret >= 0 || ret == AVERROR_EOF;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/media-remux.c#L238-L239"},{"ref":"libobs/media-io/media-remux.c:177-219","code":"  177 | static inline int process_packets(media_remux_job_t job, media_remux_progress_callback callback, void *data)\n  178 | {\n  179 | \tAVPacket pkt;\n  180 | \n  181 | \tint ret, throttle = 0;\n  182 | \tfor (;;) {\n  183 | \t\tret = av_read_frame(job->ifmt_ctx, &pkt);\n  184 | \t\tif (ret < 0) {\n  185 | \t\t\tif (ret != AVERROR_EOF)\n  186 | \t\t\t\tblog(LOG_ERROR,\n  187 | \t\t\t\t     \"media_remux: Error reading\"\n  188 | \t\t\t\t     \" packet: %s\",\n  189 | \t\t\t\t     av_err2str(ret));\n  190 | \t\t\tbreak;\n  191 | \t\t}\n  192 | \n  193 | \t\tif (callback != NULL && throttle++ > 10) {\n  194 | \t\t\tfloat progress = pkt.pos / (float)job->in_size * 100.f;\n  195 | \t\t\tif (!callback(data, progress))\n  196 | \t\t\t\tbreak;\n  197 | \t\t\tthrottle = 0;\n  198 | \t\t}\n  199 | \n  200 | \t\tprocess_packet(&pkt, job->ifmt_ctx->streams[pkt.stream_index],\n  201 | \t\t\t       job->ofmt_ctx->streams[pkt.stream_index]);\n  202 | \n  203 | \t\tret = av_interleaved_write_frame(job->ofmt_ctx, &pkt);\n  204 | \t\tav_packet_unref(&pkt);\n  205 | \n  206 | \t\tif (ret < 0) {\n  207 | \t\t\tblog(LOG_ERROR, \"media_remux: Error muxing packet: %s\", av_err2str(ret));\n  208 | \n  209 | \t\t\t/* Treat \"Invalid data found when processing input\" and\n  210 | \t\t\t * \"Invalid argument\" as non-fatal */\n  211 | \t\t\tif (ret == AVERROR_INVALIDDATA || ret == -EINVAL)\n  212 | \t\t\t\tcontinue;\n  213 | \n  214 | \t\t\tbreak;\n  215 | \t\t}\n  216 | \t}\n  217 | \n  218 | \treturn ret;\n  219 | }","lines":43,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/media-remux.c#L177-L219"}]},
