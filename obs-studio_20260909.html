{"id":"LOGIC_103","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `ServiceAndVCodecCompatible`, `ServiceAndACodecCompatible`, and `ResetEncoders`, a local `const char *output;` is declared uninitialized and passed by address to `obs_enum_output_types_with_protocol(..., &output, return_first_id)`. `return_first_id` only writes `*output` if the enumeration callback fires at least once; if no output type is registered for the current `protocol`, `output` stays uninitialized and is then dereferenced by `obs_get_output_supported_video_codecs(output)` / `obs_get_output_supported_audio_codecs(output)`, reading a garbage pointer and risking a crash. The value is only assigned on the first callback invocation, so an empty enumeration leaves it indeterminate.","fix":"Initialize the pointer and guard the call, e.g.:\n```cpp\nconst char *output = nullptr;\nobs_enum_output_types_with_protocol(QT_TO_UTF8(protocol), &output, return_first_id);\nif (!output)\n\treturn false; // or skip codec query\noutput_codecs = strlist_split(obs_get_output_supported_video_codecs(output), ';', false);\n```\nApply the same `nullptr` initialization/guard in all four sites.","locations":[{"ref":"frontend/settings/OBSBasicSettings_Stream.cpp:1464-1469","code":" 1464 | \t\tconst char *output;\n 1465 | \t\tchar **output_codecs;\n 1466 | \n 1467 | \t\tobs_enum_output_types_with_protocol(QT_TO_UTF8(protocol), &output, return_first_id);\n 1468 | \n 1469 | \t\toutput_codecs = strlist_split(obs_get_output_supported_video_codecs(output), ';', false);","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/settings/OBSBasicSettings_Stream.cpp#L1464-L1469"},{"ref":"frontend/settings/OBSBasicSettings_Stream.cpp:1499-1503","code":" 1499 | \t\tconst char *output;\n 1500 | \t\tchar **output_codecs;\n 1501 | \n 1502 | \t\tobs_enum_output_types_with_protocol(QT_TO_UTF8(protocol), &output, return_first_id);\n 1503 | \t\toutput_codecs = strlist_split(obs_get_output_supported_audio_codecs(output), ';', false);","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/settings/OBSBasicSettings_Stream.cpp#L1499-L1503"},{"ref":"frontend/settings/OBSBasicSettings_Stream.cpp:1668-1671","code":" 1668 | \t\tconst char *output;\n 1669 | \n 1670 | \t\tobs_enum_output_types_with_protocol(QT_TO_UTF8(protocol), &output, return_first_id);\n 1671 | \t\toutput_vcodecs = strlist_split(obs_get_output_supported_video_codecs(output), ';', false);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/settings/OBSBasicSettings_Stream.cpp#L1668-L1671"},{"ref":"frontend/settings/OBSBasicSettings_Stream.cpp:1676-1679","code":" 1676 | \t\tconst char *output;\n 1677 | \n 1678 | \t\tobs_enum_output_types_with_protocol(QT_TO_UTF8(protocol), &output, return_first_id);\n 1679 | \t\toutput_acodecs = strlist_split(obs_get_output_supported_audio_codecs(output), ';', false);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/settings/OBSBasicSettings_Stream.cpp#L1676-L1679"}]},
{"id":"LOGIC_104","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Status(L\"Update failed: Couldn't connect to %S\", kMSHostname);` uses the `%S` conversion, which in a wide-character `printf` (`StringCbVPrintf`) means a narrow `char*` string. `kMSHostname` is `constexpr const wchar_t *kMSHostname = L\"aka.ms\"`, i.e. a wide string, so `%S` reinterprets the wide bytes as a narrow string and prints only `\"a\"` (stops at the first embedded NUL byte). The analogous CDN message at line 448 correctly uses `%s` for a wide string.","fix":"Change `%S` to `%s`:\n```cpp\nStatus(L\"Update failed: Couldn't connect to %s\", kMSHostname);\n```","locations":[{"ref":"frontend/updater/updater.cpp:1229","code":" 1229 | \t\tStatus(L\"Update failed: Couldn't connect to %S\", kMSHostname);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/updater/updater.cpp#L1229"}]},
{"id":"LOGIC_105","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`CrashHandler`'s move constructor and move assignment only transfer `crashLogUploadThread_` and set `isActiveCrashHandler_ = true` unconditionally; they do not move the other state (`appLaunchUUID_`, `crashSentinelFile_`, `lastCrashLogFile_`, `lastCrashLogURL_`, `lastCrashUploadTime_`, `isSentinelPresent_`). A moved-to handler therefore has `isActiveCrashHandler_ == true` but an empty `crashSentinelFile_`, so its destructor's `applicationShutdownHandler()` bails out at the `crashSentinelFile_.empty()` check and never removes the sentinel file, while the moved-from object has been set inactive. The sentinel would leak, causing a false unclean-shutdown detection on the next launch. Currently latent because the object is only ever built in place inside a `unique_ptr` and never actually moved, but the public move ops are broken and invite misuse.","fix":"Move all members (or `= default` the move ops and give members sane moved-from states), and propagate `other.isActiveCrashHandler_` instead of hardcoding `true`, e.g. move `appLaunchUUID_`, `crashSentinelFile_`, `lastCrashLogFile_`, `lastCrashLogFileName_`, `lastCrashLogURL_`, `lastCrashUploadTime_`, `isSentinelPresent_` and set `isActiveCrashHandler_ = std::exchange(other.isActiveCrashHandler_, false)`.","locations":[{"ref":"frontend/utility/CrashHandler.cpp:120-133","code":"  120 | CrashHandler::CrashHandler(CrashHandler &&other) noexcept\n  121 | {\n  122 | \tcrashLogUploadThread_ = std::exchange(other.crashLogUploadThread_, nullptr);\n  123 | \tisActiveCrashHandler_ = true;\n  124 | \tother.isActiveCrashHandler_ = false;\n  125 | }\n  126 | \n  127 | CrashHandler &CrashHandler::operator=(CrashHandler &&other) noexcept\n  128 | {\n  129 | \tstd::swap(crashLogUploadThread_, other.crashLogUploadThread_);\n  130 | \tisActiveCrashHandler_ = true;\n  131 | \tother.isActiveCrashHandler_ = false;\n  132 | \treturn *this;\n  133 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/CrashHandler.cpp#L120-L133"}]},
{"id":"LOGIC_106","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `SetupOBSOutput`/`PrepareStreaming`, the `recording_canvases` vector is constructed with a size argument `recording_canvases(canvases.size())`, which fills it with `canvases.size()` default-constructed (null) `OBSCanvasAutoRelease` elements, and then the loop `emplace_back`s `canvases.size()` more real refs. The result is a vector of `2 * canvases.size()` entries whose first half are all `nullptr`. This is clearly a copy-paste slip: the adjacent `recording_audio_encoders` code at lines 508-509 correctly uses `.reserve(...)`. The intended call is `reserve`, not the sizing constructor. Functionally the correct refs are still held (so it does not crash), but the vector carries bogus leading null slots and is misleading/incorrect.","fix":"Replace the sizing constructor with a reserve, matching the audio-encoder path:\n```cpp\nstd::vector<OBSCanvasAutoRelease> recording_canvases;\nrecording_canvases.reserve(canvases.size());\nfor (const auto &canvas : canvases) {\n\trecording_canvases.emplace_back(obs_canvas_get_ref(canvas));\n}\n```","locations":[{"ref":"frontend/utility/MultitrackVideoOutput.cpp:514-517","code":"  514 | \t\tstd::vector<OBSCanvasAutoRelease> recording_canvases(canvases.size());\n  515 | \t\tfor (const auto &canvas : canvases) {\n  516 | \t\t\trecording_canvases.emplace_back(obs_canvas_get_ref(canvas));\n  517 | \t\t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/MultitrackVideoOutput.cpp#L514-L517"}]},
{"id":"LOGIC_107","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `HighContrastEnabled` (X11), `if (uint32_t version = reply.value().toUInt() < 2)` binds as `version = (reply.value().toUInt() < 2)` due to operator precedence, so `version` is a bool (0/1), not the portal Settings version. The control flow is coincidentally correct (branch taken iff version < 2), but the subsequent warning log prints `version` as `%u`, which will always be `1`, giving misleading diagnostics and defeating the intent of capturing the real version number.","fix":"```cpp\nif (uint32_t version = reply.value().toUInt(); version < 2) {\n    blog(LOG_WARNING, \"org.freedesktop.portal.Settings version %u does not support ReadOne\", version);\n    return false;\n}\n```","locations":[{"ref":"frontend/utility/platform-x11.cpp:306-308","code":"  306 | \tif (uint32_t version = reply.value().toUInt() < 2) {\n  307 | \t\tblog(LOG_WARNING, \"org.freedesktop.portal.Settings version %u does not support ReadOne\", version);\n  308 | \t\treturn false;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/platform-x11.cpp#L306-L308"}]},
{"id":"LOGIC_108","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `UpdateDroppedFrames` the division `percent = (double)totalDropped / (double)totalFrames * 100.0` is computed on line 328 before the guard `if (!totalFrames) return;` on line 330. The zero-check is placed after the value it is meant to protect is already computed, so when `totalFrames == 0` the code performs a divide-by-zero (well-defined for doubles, yielding inf/NaN) before returning. It is currently benign because `percent` is only consumed after the guard, but the ordering is a bug waiting to be turned into a visible NaN by any future edit that moves the use.","fix":"Move the zero-check above the division:\n```cpp\nint totalDropped = obs_output_get_frames_dropped(output);\nint totalFrames = obs_output_get_total_frames(output);\nif (!totalFrames)\n    return;\ndouble percent = (double)totalDropped / (double)totalFrames * 100.0;\n```","locations":[{"ref":"frontend/widgets/OBSBasicStatusBar.cpp:326-332","code":"  326 | \tint totalDropped = obs_output_get_frames_dropped(output);\n  327 | \tint totalFrames = obs_output_get_total_frames(output);\n  328 | \tdouble percent = (double)totalDropped / (double)totalFrames * 100.0;\n  329 | \n  330 | \tif (!totalFrames) {\n  331 | \t\treturn;\n  332 | \t}","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasicStatusBar.cpp#L326-L332"}]},
{"id":"LOGIC_109","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The system tray text is set to raw translation lookup keys instead of the translated strings. Every other `sysTrayStream->setText(...)` call wraps the key in `QTStr(...)` (e.g. line 41), but these two pass the literal key, so the user sees `Basic.Main.PreparingStream` / `Basic.Main.Connecting` in the tray tooltip instead of localized text.","fix":"Wrap the keys in `QTStr`:\n```cpp\n// before\nsysTrayStream->setText(\"Basic.Main.PreparingStream\");\n...\nsysTrayStream->setText(\"Basic.Main.Connecting\");\n// after\nsysTrayStream->setText(QTStr(\"Basic.Main.PreparingStream\"));\n...\nsysTrayStream->setText(QTStr(\"Basic.Main.Connecting\"));\n```","locations":[{"ref":"frontend/widgets/OBSBasic_Streaming.cpp:80","code":"   80 | \t\tsysTrayStream->setText(\"Basic.Main.PreparingStream\");","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_Streaming.cpp#L80"},{"ref":"frontend/widgets/OBSBasic_Streaming.cpp:96","code":"   96 | \t\t\tsysTrayStream->setText(\"Basic.Main.Connecting\");","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_Streaming.cpp#L96"}]},
{"id":"LOGIC_110","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `gs_device::CopyTex`, when `src_w == 0` the right edge is set to `tex2d->width - 1` (and similarly `tex2d->height - 1` for `src_h == 0`), which drops the last row/column instead of copying the full extent (`width`/`height`). This branch is currently masked because callers (`device_copy_texture_region`) convert a zero width/height to `width - src_x` before calling, but it is a latent off-by-one: any caller passing `src_w == 0` with a non-zero offset would silently lose a pixel.","fix":"```cpp\n// before\nsbox.right = tex2d->width - 1;\n...\nsbox.bottom = tex2d->height - 1;\n// after\nsbox.right = tex2d->width;\n...\nsbox.bottom = tex2d->height;\n```","locations":[{"ref":"libobs-d3d11/d3d11-subsystem.cpp:2145-2153","code":" 2145 | \t\t\tsbox.right = tex2d->width - 1;\n 2146 | \t\t}\n 2147 | \n 2148 | \t\tsbox.top = src_y;\n 2149 | \t\tif (src_h > 0) {\n 2150 | \t\t\tsbox.bottom = src_y + src_h;\n 2151 | \t\t} else {\n 2152 | \t\t\tsbox.bottom = tex2d->height - 1;\n 2153 | \t\t}","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-d3d11/d3d11-subsystem.cpp#L2145-L2153"}]},
{"id":"LOGIC_111","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`bytesPerPixel` returns `8` for `.bgr10_xr` and `.bgr10_xr_srgb`, but these are 32-bit (4-byte) packed formats: they are classified under `isPacked32Bit` (line 91) and `bitsPerPixel` returns `32` for them. So `bitsPerPixel` (32) and `bytesPerPixel` (8) contradict each other for the same format; the 64-bit `.bgra10_xr` variants are the ones that are 8 bytes.","fix":"Return `4` for the `bgr10_xr` packed-32-bit formats (keep `8` only for the 64-bit `bgra10_xr` variants handled by `is64Bit`):\n```swift\ncase .rgb10a2Unorm, .rgb10a2Uint, .bgr10a2Unorm, .rg11b10Float, .rgb9e5Float, .bgr10_xr, .bgr10_xr_srgb:\n    return 4\n```","locations":[{"ref":"libobs-metal/MTLPixelFormat+Extensions.swift:319-327","code":"  319 |         } else if self.isPacked32Bit {\n  320 |             switch self {\n  321 |             case .rgb10a2Unorm, .rgb10a2Uint, .bgr10a2Unorm, .rg11b10Float, .rgb9e5Float:\n  322 |                 return 4\n  323 |             case .bgr10_xr, .bgr10_xr_srgb:\n  324 |                 return 8\n  325 |             default:\n  326 |                 return nil\n  327 |             }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/MTLPixelFormat+Extensions.swift#L319-L327"}]},
{"id":"LOGIC_112","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`device_stencil_function` overwrites BOTH stencil faces on every call and sets the non-targeted face's compare function to `.never`. When called with `GS_STENCIL_FRONT`, the back face compare function is forced to `.never` (all back-facing stencil tests fail), and a subsequent `GS_STENCIL_BACK` call would in turn reset the front to `.never`, so front and back can never be configured independently across two calls. Note the sibling `device_stencil_op` uses the non-destructive `.keep` for the untouched face, making this `.never` choice inconsistent and likely wrong.","fix":"Only modify the requested face(s) (leaving the other unchanged), or at minimum default the untouched face to a non-destructive value consistent with `device_stencil_op`.","locations":[{"ref":"libobs-metal/metal-subsystem.swift:749-765","code":"  749 | @_cdecl(\"device_stencil_function\")\n  750 | public func device_stencil_function(device: UnsafeRawPointer, side: gs_stencil_side, test: gs_depth_test) {\n  751 |     let device: MetalDevice = unretained(device)\n  752 | \n  753 |     let stencilCompareFunction: (MTLCompareFunction, MTLCompareFunction)\n  754 | \n  755 |     if side == GS_STENCIL_FRONT {\n  756 |         stencilCompareFunction = (test.mtlFunction, .never)\n  757 |     } else if side == GS_STENCIL_BACK {\n  758 |         stencilCompareFunction = (.never, test.mtlFunction)\n  759 |     } else {\n  760 |         stencilCompareFunction = (test.mtlFunction, test.mtlFunction)\n  761 |     }\n  762 | \n  763 |     device.renderState.depthStencilDescriptor.frontFaceStencil.stencilCompareFunction = stencilCompareFunction.0\n  764 |     device.renderState.depthStencilDescriptor.backFaceStencil.stencilCompareFunction = stencilCompareFunction.1\n  765 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-subsystem.swift#L749-L765"}]},
{"id":"LOGIC_113","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `gpu_get_smem`, `GLint dmem, total_mem = 0;` only initializes `total_mem`; `dmem` is left uninitialized. On GPUs/drivers without the `NVX_gpu_memory_info` extension, `glGetIntegerv(GL_GPU_MEMORY_INFO_DEDICATED_VIDMEM_NVX, &dmem)` raises `GL_INVALID_ENUM` and does not write to `dmem`, so the subsequent `dmem < 0` check and `(uint64_t)total_mem - dmem` operate on garbage, returning a nonsensical shared-memory value. (The sibling `gpu_get_dmem` correctly writes `GLint dmem = 0;`.)","fix":"Initialize both: change `GLint dmem, total_mem = 0;` to `GLint dmem = 0, total_mem = 0;`.","locations":[{"ref":"libobs-opengl/gl-subsystem.c:246","code":"  246 | \tGLint dmem, total_mem = 0;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-subsystem.c#L246"}]},
{"id":"LOGIC_114","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the dummy-texture branch of `device_voltexture_create`, the return value of `gl_init_volume(...)` is stored in `did_init` and then immediately overwritten by the `gl_tex_param_i(...)` call, so a failure of `gl_init_volume` is silently discarded and never propagated to the `if (!did_init || !did_unbind)` check. The two results should be combined.","fix":"Combine both results, e.g.:\n```c\nbool did_init = gl_init_volume(tex->base.gl_type, 1, tex->base.gl_format, tex->base.gl_internal_format,\n                               compressed, tex->width, tex->height, tex->depth, NULL);\ndid_init = did_init && gl_tex_param_i(GL_TEXTURE_3D, GL_TEXTURE_MAX_LEVEL, 0);\n```","locations":[{"ref":"libobs-opengl/gl-texture3d.c:149-154","code":"  149 | \t\tbool did_init = gl_init_volume(tex->base.gl_type, 1, tex->base.gl_format, tex->base.gl_internal_format,\n  150 | \t\t\t\t\t       compressed, tex->width, tex->height, tex->depth, NULL);\n  151 | \t\tdid_init = gl_tex_param_i(GL_TEXTURE_3D, GL_TEXTURE_MAX_LEVEL, 0);\n  152 | \n  153 | \t\tbool did_unbind = gl_bind_texture(GL_TEXTURE_3D, 0);\n  154 | \t\tif (!did_init || !did_unbind)","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-texture3d.c#L149-L154"}]},
{"id":"LOGIC_115","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`upload_texture_cube` sets `glTexParameteri(GL_TEXTURE_CUBE_MAP, GL_TEXTURE_MAX_LEVEL, num_levels)`, but `GL_TEXTURE_MAX_LEVEL` is the highest mip *index*, which should be `num_levels - 1` (as done consistently in `gl-texture2d.c` and `gl-texture3d.c`). Setting it to `num_levels` advertises one more mip level than was actually uploaded, which can render the cube map mipmap-incomplete when sampled with a mip filter.","fix":"Change `glTexParameteri(GL_TEXTURE_CUBE_MAP, GL_TEXTURE_MAX_LEVEL, num_levels);` to `glTexParameteri(GL_TEXTURE_CUBE_MAP, GL_TEXTURE_MAX_LEVEL, num_levels - 1);`","locations":[{"ref":"libobs-opengl/gl-texturecube.c:50","code":"   50 | \tglTexParameteri(GL_TEXTURE_CUBE_MAP, GL_TEXTURE_MAX_LEVEL, num_levels);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-texturecube.c#L50"}]},
{"id":"LOGIC_116","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`gl_x11_egl_getclientsize` only writes `*width` and `*height` inside `if (geometry)`. When `get_window_geometry` fails and returns `NULL`, the output parameters are left untouched, so callers receive whatever uninitialized/stale values they passed in. The Windows equivalent `gl_getclientsize` explicitly sets both to `0` on failure.","fix":"Add an `else` branch setting `*width = 0; *height = 0;` when `geometry` is `NULL`.","locations":[{"ref":"libobs-opengl/gl-x11-egl.c:474-486","code":"  474 | static void gl_x11_egl_getclientsize(const struct gs_swap_chain *swap, uint32_t *width, uint32_t *height)\n  475 | {\n  476 | \txcb_connection_t *xcb_conn = XGetXCBConnection(swap->device->plat->xdisplay);\n  477 | \txcb_window_t window = swap->wi->window;\n  478 | \n  479 | \txcb_get_geometry_reply_t *geometry = get_window_geometry(xcb_conn, window);\n  480 | \tif (geometry) {\n  481 | \t\t*width = geometry->width;\n  482 | \t\t*height = geometry->height;\n  483 | \t}\n  484 | \n  485 | \tfree(geometry);\n  486 | }","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-x11-egl.c#L474-L486"}]},
{"id":"LOGIC_117","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`coreaudio-enum-devices.c` (`enum_audio_devices`): if `AudioObjectGetPropertyDataSize` succeeds but returns `size == 0` (no audio devices present), the code calls `malloc(0)`. The return value of `malloc(0)` is implementation-defined (may return NULL or a unique pointer). If NULL is returned, the subsequent `AudioObjectGetPropertyData` call receives a NULL `ids` buffer, which is undefined behaviour. There is also no NULL check after `malloc`.","fix":"Add a check for `size == 0` before `malloc`, and add a NULL check on the result:\n```c\nif (size == 0)\n    return;\nids = malloc(size);\nif (!ids)\n    return;\n```","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-enum-devices.c:75-90","code":"   75 | \tstat = AudioObjectGetPropertyDataSize(kAudioObjectSystemObject, &addr, 0, NULL, &size);\n   76 | \tif (!success(stat, \"get data size\"))\n   77 | \t\treturn;\n   78 | \n   79 | \tids = malloc(size);\n   80 | \tcount = size / sizeof(AudioDeviceID);\n   81 | \n   82 | \tstat = AudioObjectGetPropertyData(kAudioObjectSystemObject, &addr, 0, NULL, &size, ids);\n   83 | \tif (success(stat, \"get data\")) {\n   84 | \t\tfor (UInt32 i = 0; i < count; i++) {\n   85 | \t\t\tif (!obs_enum_audio_monitoring_device(cb, data, ids[i], allow_inputs))\n   86 | \t\t\t\tbreak;\n   87 | \t\t}\n   88 | \t}\n   89 | \n   90 | \tfree(ids);","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/osx/coreaudio-enum-devices.c#L75-L90"}]},
{"id":"LOGIC_118","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`coreaudio-enum-devices.c` (`devices_match`): when both `id1` and `id2` are `\"default\"`, `get_default_id` is called twice (lines 155-161) but reuses `default_id`. The second call to `get_default_id` will see `*p_id != NULL` from the first call (line 112-113 of that function) and return early, so `id2` will correctly point to the same string as `id1`. However, the comparison then proceeds through `enum_audio_devices` to look up names by UID for both sides, resulting in two full device enumeration passes when a simple `strcmp(id1, id2)` on the already-resolved strings would suffice.\n\nMore importantly, if `id1 == \"default\"` and `id2 != \"default\"`, `default_id` holds the resolved id for id1 but `id1` is set to point into `default_id`. If `id2 == \"default\"` after the first branch, the second `get_default_id` would be a no-op (because `default_id` already set), so `id2` = `default_id` = `id1`. This is correct but fragile.","fix":"After resolving both IDs, short-circuit the name lookup if both resolved IDs are equal:\n```c\nif (strcmp(id1, id2) == 0) {\n    match = true;\n    goto cleanup;\n}\n```","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-enum-devices.c:143-178","code":"  143 | bool devices_match(const char *id1, const char *id2)\n  144 | {\n  145 | \tstruct device_name_info info = {0};\n  146 | \tchar *default_id = NULL;\n  147 | \tchar *name1 = NULL;\n  148 | \tchar *name2 = NULL;\n  149 | \tbool match;\n  150 | \n  151 | \tif (!id1 || !id2)\n  152 | \t\treturn false;\n  153 | \n  154 | \tif (strcmp(id1, \"default\") == 0) {\n  155 | \t\tget_default_id(&default_id);\n  156 | \t\tid1 = default_id;\n  157 | \t}\n  158 | \tif (strcmp(id2, \"default\") == 0) {\n  159 | \t\tget_default_id(&default_id);\n  160 | \t\tid2 = default_id;\n  161 | \t}\n  162 | \n  163 | \tinfo.id = id1;\n  164 | \tenum_audio_devices(enum_device_name, &info, true);\n  165 | \tname1 = info.name;\n  166 | \n  167 | \tinfo.name = NULL;\n  168 | \tinfo.id = id2;\n  169 | \tenum_audio_devices(enum_device_name, &info, true);\n  170 | \tname2 = info.name;\n  171 | \n  172 | \tmatch = name1 && name2 && strcmp(name1, name2) == 0;\n  173 | \tbfree(default_id);\n  174 | \tbfree(name1);\n  175 | \tbfree(name2);\n  176 | \n  177 | \treturn match;\n  178 | }","lines":36,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/osx/coreaudio-enum-devices.c#L143-L178"}]},
{"id":"LOGIC_119","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`coreaudio-output.c` (`audio_monitor_init`): the error message passed to `success()` on line 186 when `AudioQueueNewOutput` fails is `\"AudioStreamBasicDescription\"` - which is the name of the struct passed as the first argument, not the name of the function being called. The message should be `\"AudioQueueNewOutput\"`.","fix":"Change the string literal on line 186:\n```c\nstat = AudioQueueNewOutput(&desc, buffer_audio, monitor, NULL, NULL, 0, &monitor->queue);\nif (!success(stat, \"AudioQueueNewOutput\")) {\n    return false;\n}\n```","locations":[{"ref":"libobs/audio-monitoring/osx/coreaudio-output.c:185-188","code":"  185 | \tstat = AudioQueueNewOutput(&desc, buffer_audio, monitor, NULL, NULL, 0, &monitor->queue);\n  186 | \tif (!success(stat, \"AudioStreamBasicDescription\")) {\n  187 | \t\treturn false;\n  188 | \t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/osx/coreaudio-output.c#L185-L188"}]},
{"id":"LOGIC_120","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`pulseaudio-output.c` (`pulseaudio_sink_info`): the log format at line 311-313 uses `%c` to print `i->sample_spec.channels` (a `uint8_t`) and `channels` (also `uint8_t`). `%c` formats a value as a character, not an integer, so channel count 2 would print as a non-printable STX character. The format should be `%d` or `%u`.","fix":"Replace `%c` with `%u` in both `blog` calls at lines 311-313:\n```c\nblog(LOG_INFO,\n     \"%u channels not supported by OBS,\"\n     \"using %u instead for recording\",\n     i->sample_spec.channels, channels);\n```","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-output.c:310-314","code":"  310 | \t\tblog(LOG_INFO,\n  311 | \t\t     \"%c channels not supported by OBS,\"\n  312 | \t\t     \"using %c instead for recording\",\n  313 | \t\t     i->sample_spec.channels, channels);\n  314 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/pulse/pulseaudio-output.c#L310-L314"}]},
{"id":"LOGIC_121","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`signal.c` (`signal_handler_connect_internal`): the handler's `mutex` is used to find the signal (lines 201-203), then released before the signal's own `mutex` is acquired (line 215). Between those two lock/unlock operations, nothing prevents the signal from being removed from the handler's linked list by another thread calling `signal_handler_destroy` or a future `signal_handler_remove` API. The signal pointer `sig` would then become dangling when `sig->mutex` is locked. Currently there is no `signal_handler_remove_signal` public API, so the only way a signal goes away is when the handler is fully destroyed, and `signal_handler_destroy` uses reference counting that prevents premature destruction when `connect_ref` is used. For `signal_handler_connect` (no ref), the handler can be destroyed with signals connected, which is a caller error. This is a latent race but not exploitable with the current API surface.","fix":"Document that `signal_handler_connect` must not race with `signal_handler_destroy` without external synchronisation, or hold `handler->mutex` across the signal's callback list modification (requires making `handler->mutex` recursive or restructuring the locking).","locations":[{"ref":"libobs/callback/signal.c:191-225","code":"  191 | static void signal_handler_connect_internal(signal_handler_t *handler, const char *signal, signal_callback_t callback,\n  192 | \t\t\t\t\t    void *data, bool keep_ref)\n  193 | {\n  194 | \tstruct signal_info *sig, *last;\n  195 | \tstruct signal_callback cb_data = {callback, data, false, keep_ref};\n  196 | \tsize_t idx;\n  197 | \n  198 | \tif (!handler)\n  199 | \t\treturn;\n  200 | \n  201 | \tpthread_mutex_lock(&handler->mutex);\n  202 | \tsig = getsignal(handler, signal, &last);\n  203 | \tpthread_mutex_unlock(&handler->mutex);\n  204 | \n  205 | \tif (!sig) {\n  206 | \t\tblog(LOG_WARNING,\n  207 | \t\t     \"signal_handler_connect: \"\n  208 | \t\t     \"signal '%s' not found\",\n  209 | \t\t     signal);\n  210 | \t\treturn;\n  211 | \t}\n  212 | \n  213 | \t/* -------------- */\n  214 | \n  215 | \tpthread_mutex_lock(&sig->mutex);\n  216 | \n  217 | \tif (keep_ref)\n  218 | \t\tos_atomic_inc_long(&handler->refs);\n  219 | \n  220 | \tidx = signal_get_callback_idx(sig, callback, data);\n  221 | \tif (keep_ref || idx == DARRAY_INVALID)\n  222 | \t\tda_push_back(sig->callbacks, &cb_data);\n  223 | \n  224 | \tpthread_mutex_unlock(&sig->mutex);\n  225 | }","lines":35,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/callback/signal.c#L191-L225"}]},
{"id":"LOGIC_122","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`signal.c` (`signal_handler_signal`): the reference count decrement for `keep_ref` callbacks is done non-atomically:\n```c\nos_atomic_set_long(&handler->refs, os_atomic_load_long(&handler->refs) - remove_refs);\n```\nThis is a read-modify-write that is not atomic. If another thread concurrently increments `refs` between the load and the set, that increment is lost, potentially causing the handler to be destroyed while still in use.","fix":"Replace the non-atomic RMW with a loop using `os_atomic_compare_exchange_long`, or (simpler) use a loop of `os_atomic_dec_long` once per removed ref:\n```c\nfor (long i = 0; i < remove_refs; i++) {\n    if (os_atomic_dec_long(&handler->refs) == 0) {\n        signal_handler_actually_destroy(handler);\n        return;\n    }\n}\n```","locations":[{"ref":"libobs/callback/signal.c:348-350","code":"  348 | \tif (remove_refs) {\n  349 | \t\tos_atomic_set_long(&handler->refs, os_atomic_load_long(&handler->refs) - remove_refs);\n  350 | \t}","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/callback/signal.c#L348-L350"}]},
{"id":"LOGIC_123","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ep_parse_param_assign_bool` (`effect-parser.c`, lines 985-1003): when neither `\"true\"` nor `\"false\"` is matched, the function calls `cf_adderror_expecting` and then returns `PARSE_EOF`. Returning `PARSE_EOF` on a syntax error (not an end-of-file condition) will cause the caller (`ep_parse_param_assignment_val` -> `ep_parse_param_assign`) to bail out as if the file ended unexpectedly, rather than as a recoverable parse error (`PARSE_CONTINUE`). This can cause the entire effect to fail to load rather than just skipping the bad parameter.","fix":"Return `PARSE_CONTINUE` instead of `PARSE_EOF` to allow parsing to continue after an invalid bool literal:\n```c\ncf_adderror_expecting(&ep->cfp, \"true or false\");\nreturn PARSE_CONTINUE;\n```","locations":[{"ref":"libobs/graphics/effect-parser.c:1000-1002","code":" 1000 | \tcf_adderror_expecting(&ep->cfp, \"true or false\");\n 1001 | \n 1002 | \treturn PARSE_EOF;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/effect-parser.c#L1000-L1002"}]},
{"id":"LOGIC_124","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ep_param_init` in `effect-parser.h` sets `epp->writeorder = false` (line 86), but `writeorder` is declared as `int`. Assigning `false` (which equals 0) works, but the intent is clearly an integer ordering value, not a boolean. The field type and the initial value are mismatched in documentation intent.","fix":"Change the initialisation to `epp->writeorder = 0;` to match the declared `int` type and make intent clear.","locations":[{"ref":"libobs/graphics/effect-parser.h:86","code":"   86 | \tepp->writeorder = false;","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/effect-parser.h#L86"}]},
{"id":"LOGIC_125","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The decoding loop in `ffmpeg_image_decode` can spin indefinitely. When\n`avcodec_send_packet` returns `AVERROR(EAGAIN)` (decoder buffer full) the code sets `ret = 0`\nand loops back. For image decoding there is only one packet, so if the decoder keeps returning\n`EAGAIN` from `avcodec_receive_frame` (e.g. a codec that needs multiple calls to drain), the loop\nwill never make progress. In practice image codecs rarely do this, but it is undefined by the API\ncontract and the loop has no iteration limit.","fix":"Add an iteration guard or break on `AVERROR(EAGAIN)` from `avcodec_receive_frame`\nwhen no new packet is available to send:\n\n```c\nwhile (!got_frame) {\n    ret = avcodec_send_packet(info->decoder_ctx, &packet);\n    if (ret == 0 || ret == AVERROR(EAGAIN))\n        ret = avcodec_receive_frame(info->decoder_ctx, frame);\n\n    got_frame = (ret == 0);\n\n    if (ret == AVERROR_EOF || ret == AVERROR(EAGAIN))\n        break;  /* no more output available */\n\n    if (ret < 0) {\n        blog(LOG_WARNING, \"Failed to decode frame for '%s': %s\",\n             info->file, av_err2str(ret));\n        goto fail;\n    }\n}\n```","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:523-537","code":"  523 | \twhile (!got_frame) {\n  524 | \t\tret = avcodec_send_packet(info->decoder_ctx, &packet);\n  525 | \t\tif (ret == 0)\n  526 | \t\t\tret = avcodec_receive_frame(info->decoder_ctx, frame);\n  527 | \n  528 | \t\tgot_frame = (ret == 0);\n  529 | \n  530 | \t\tif (ret == AVERROR_EOF || ret == AVERROR(EAGAIN))\n  531 | \t\t\tret = 0;\n  532 | \n  533 | \t\tif (ret < 0) {\n  534 | \t\t\tblog(LOG_WARNING, \"Failed to decode frame for '%s': %s\", info->file, av_err2str(ret));\n  535 | \t\t\tgoto fail;\n  536 | \t\t}\n  537 | \t}","lines":15,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics-ffmpeg.c#L523-L537"}]},
{"id":"LOGIC_126","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`plane_tri_inside` and `plane_line_inside` in plane.c are declared as returning `bool` but actually return the `int sides` bitmask (values 0, 1, 2, 3). This is technically defined behaviour in C because any non-zero integer converts to `true`, but it means callers cannot distinguish \"all in front\" from \"straddles the plane\", limiting the usefulness of the functions.","fix":"Either change the return type to `int` and update the header declarations, or change the semantics to return a proper boolean (`sides != 0` or a defined constant). The header `plane.h` (lines 61 and 64) also declares `bool` return type and must be kept in sync.","locations":[{"ref":"libobs/graphics/plane.c:104-150","code":"  104 | bool plane_tri_inside(const struct plane *p, const struct vec3 *v1, const struct vec3 *v2, const struct vec3 *v3,\n  105 | \t\t      float precision)\n  106 | {\n  107 | \t/* bit 1: part or all is behind the plane      */\n  108 | \t/* bit 2: part or all is in front of the plane */\n  109 | \tint sides = 0;\n  110 | \tfloat d1 = vec3_plane_dist(v1, p);\n  111 | \tfloat d2 = vec3_plane_dist(v2, p);\n  112 | \tfloat d3 = vec3_plane_dist(v3, p);\n  113 | \n  114 | \tif (d1 >= precision)\n  115 | \t\tsides = 2;\n  116 | \telse if (d1 <= -precision)\n  117 | \t\tsides = 1;\n  118 | \n  119 | \tif (d2 >= precision)\n  120 | \t\tsides |= 2;\n  121 | \telse if (d2 <= -precision)\n  122 | \t\tsides |= 1;\n  123 | \n  124 | \tif (d3 >= precision)\n  125 | \t\tsides |= 2;\n  126 | \telse if (d3 <= -precision)\n  127 | \t\tsides |= 1;\n  128 | \n  129 | \treturn sides;\n  130 | }\n  131 | \n  132 | bool plane_line_inside(const struct plane *p, const struct vec3 *v1, const struct vec3 *v2, float precision)\n  133 | {\n  134 | \t/* bit 1: part or all is behind the plane      */\n  135 | \t/* bit 2: part or all is in front of the plane */\n  136 | \tint sides = 0;\n  137 | \tfloat d1 = vec3_plane_dist(v1, p);\n  138 | \tfloat d2 = vec3_plane_dist(v2, p);\n  139 | \n  140 | \tif (d1 >= precision)\n  141 | \t\tsides = 2;\n  142 | \telse if (d1 <= -precision)\n  143 | \t\tsides = 1;\n  144 | \n  145 | \tif (d2 >= precision)\n  146 | \t\tsides |= 2;\n  147 | \telse if (d2 <= -precision)\n  148 | \t\tsides |= 1;\n  149 | \n  150 | \treturn sides;","lines":47,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/plane.c#L104-L150"}]},
{"id":"LOGIC_127","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `sp_parse_param_assign_intfloat` function (shader-parser.c lines 528-532), integer default values are stored with `da_push_back_array(param->default_val, (uint8_t *)&l, sizeof(long))`. `sizeof(long)` is 4 bytes on Windows but 8 bytes on LP64 Linux/macOS. Downstream consumers that expect 4-byte int defaults will read garbage on 64-bit non-Windows platforms.","fix":"Use a fixed-width type:\n```c\nint32_t val = (int32_t)strtol(sp->cfp.cur_token->str.array, NULL, 10);\nif (is_negative)\n    val = -val;\nda_push_back_array(param->default_val, (uint8_t *)&val, sizeof(int32_t));\n```","locations":[{"ref":"libobs/graphics/shader-parser.c:528-532","code":"  528 | \t} else {\n  529 | \t\tlong l = strtol(sp->cfp.cur_token->str.array, NULL, 10);\n  530 | \t\tif (is_negative)\n  531 | \t\t\tl = -l;\n  532 | \t\tda_push_back_array(param->default_val, (uint8_t *)&l, sizeof(long));","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/shader-parser.c#L528-L532"}]},
{"id":"LOGIC_128","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`gs_float_to_u8` in srgb.h adds 0.5 for rounding before truncating, but does not clamp `f` to [0, 1] first. If `f` is negative the cast wraps (UB in C for values outside 0-255 range of `uint8_t`), and if `f > 1` the addition can push `f * 255 + 0.5` above 255, also yielding UB or a truncated wrong value.","fix":"Clamp before casting:\n```c\nstatic inline uint8_t gs_float_to_u8(float f)\n{\n    f = f < 0.0f ? 0.0f : (f > 1.0f ? 1.0f : f);\n    return (uint8_t)(f * 255.0f + 0.5f);\n}\n```","locations":[{"ref":"libobs/graphics/srgb.h:50-53","code":"   50 | static inline uint8_t gs_float_to_u8(float f)\n   51 | {\n   52 | \treturn (uint8_t)(f * 255.0f + 0.5f);\n   53 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/srgb.h#L50-L53"}]},
{"id":"LOGIC_129","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`gs_texrender_get_format` in texture-render.c (line 149) does not guard against a NULL `texrender` pointer, unlike all other accessors in the same file which return a safe default when `texrender` is NULL. A NULL dereference here will crash.","fix":"Add a NULL guard:\n```c\nenum gs_color_format gs_texrender_get_format(const gs_texrender_t *texrender)\n{\n    return texrender ? texrender->format : GS_UNKNOWN;\n}\n```","locations":[{"ref":"libobs/graphics/texture-render.c:148-151","code":"  148 | enum gs_color_format gs_texrender_get_format(const gs_texrender_t *texrender)\n  149 | {\n  150 | \treturn texrender->format;\n  151 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/texture-render.c#L148-L151"}]},
{"id":"LOGIC_130","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`decompress_420` in format-conversion.c (line 176) does not use `min_uint32` to clamp `width_d2` or the output stride, unlike `decompress_nv12` which does on line 213. If `in_linesize[0]` exceeds `out_linesize`, the inner loop will write past the end of each output scanline row.","fix":"Apply the same clamping used in `decompress_nv12`:\n```c\nuint32_t width_d2 = min_uint32(in_linesize[0], out_linesize) / 2;\n```","locations":[{"ref":"libobs/media-io/format-conversion.c:176-207","code":"  176 | void decompress_420(const uint8_t *const input[], const uint32_t in_linesize[], uint32_t start_y, uint32_t end_y,\n  177 | \t\t    uint8_t *output, uint32_t out_linesize)\n  178 | {\n  179 | \tuint32_t start_y_d2 = start_y / 2;\n  180 | \tuint32_t width_d2 = in_linesize[0] / 2;\n  181 | \tuint32_t height_d2 = end_y / 2;\n  182 | \tuint32_t y;\n  183 | \n  184 | \tfor (y = start_y_d2; y < height_d2; y++) {\n  185 | \t\tconst uint8_t *chroma0 = input[1] + y * in_linesize[1];\n  186 | \t\tconst uint8_t *chroma1 = input[2] + y * in_linesize[2];\n  187 | \t\tregister const uint8_t *lum0, *lum1;\n  188 | \t\tregister uint32_t *output0, *output1;\n  189 | \t\tuint32_t x;\n  190 | \n  191 | \t\tlum0 = input[0] + y * 2 * in_linesize[0];\n  192 | \t\tlum1 = lum0 + in_linesize[0];\n  193 | \t\toutput0 = (uint32_t *)(output + y * 2 * out_linesize);\n  194 | \t\toutput1 = (uint32_t *)((uint8_t *)output0 + out_linesize);\n  195 | \n  196 | \t\tfor (x = 0; x < width_d2; x++) {\n  197 | \t\t\tuint32_t out;\n  198 | \t\t\tout = (*(chroma0++) << 8) | *(chroma1++);\n  199 | \n  200 | \t\t\t*(output0++) = (*(lum0++) << 16) | out;\n  201 | \t\t\t*(output0++) = (*(lum0++) << 16) | out;\n  202 | \n  203 | \t\t\t*(output1++) = (*(lum1++) << 16) | out;\n  204 | \t\t\t*(output1++) = (*(lum1++) << 16) | out;\n  205 | \t\t}\n  206 | \t}\n  207 | }","lines":32,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/format-conversion.c#L176-L207"}]},
{"id":"LOGIC_131","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`media_frames_per_second_to_frame_interval` and `media_frames_per_second_to_fps` in frame-rate.h (lines 12-20) perform integer division without guarding against a zero denominator or numerator respectively. Calling either function with a zero denominator/numerator causes a floating-point divide-by-zero, producing infinity or NaN that then silently propagates into frame scheduling.","fix":"Add the same guard already used by `media_frames_per_second_is_valid`:\n```c\nstatic inline double media_frames_per_second_to_fps(struct media_frames_per_second fps)\n{\n    if (!fps.denominator)\n        return 0.0;\n    return (double)fps.numerator / fps.denominator;\n}\n```","locations":[{"ref":"libobs/media-io/frame-rate.h:12-20","code":"   12 | static inline double media_frames_per_second_to_frame_interval(struct media_frames_per_second fps)\n   13 | {\n   14 | \treturn (double)fps.denominator / fps.numerator;\n   15 | }\n   16 | \n   17 | static inline double media_frames_per_second_to_fps(struct media_frames_per_second fps)\n   18 | {\n   19 | \treturn (double)fps.numerator / fps.denominator;\n   20 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/frame-rate.h#L12-L20"}]},
{"id":"LOGIC_132","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `video-frame.c`, the `VIDEO_FORMAT_I210` and `VIDEO_FORMAT_I010` cases in\n`video_frame_get_linesizes` both set `linesize[0] = width * 2` (10-bit luma\nstored as 2 bytes per pixel). This is correct for `I010` (4:2:0, 10-bit).\nHowever, for `I210` (4:2:2, 10-bit), the comment says \"three planes: double\nwidth, full width, full width\", yet the chroma planes are set to `width` (not\n`HALF(width)`). For 4:2:2 the chroma planes have the same height as luma but\nhalf the horizontal resolution, so the linesize should be `width` bytes for\n8-bit or `width * 2 / 2 = width` bytes for 10-bit (since horizontal chroma\nresolution is halved). This is actually correct for `I210`: each chroma sample\nis 2 bytes, and there are width/2 chroma samples per row, giving `width` bytes\nper chroma line. The comment is accurate. No bug here.\n\nSeparately, `VIDEO_FORMAT_I010` is 4:2:0 (planar YUV 4:2:0 10-bit). For I010:\nluma linesize = `width * 2` (correct), chroma linesizes = `width` (which is\n`HALF(width) * 2` for even widths - the two factors cancel for even widths but\nnot for odd widths). For an odd width, e.g. width=3: `HALF(3) = 2` chroma\nsamples per row, linesize should be `2 * 2 = 4` bytes, but the code gives\n`width = 3` bytes. This is a linesize underestimate for odd-width I010, leading\nto chroma plane overlap or data truncation.","fix":"For `I010`, chroma linesizes should account for the halved horizontal resolution:\n\n```c\ncase VIDEO_FORMAT_I010:\n    linesize[0] = width * 2;\n    linesize[1] = HALF(width) * 2;\n    linesize[2] = HALF(width) * 2;\n    break;\n```","locations":[{"ref":"libobs/media-io/video-frame.c:60-65","code":"   60 | \tcase VIDEO_FORMAT_I210: /* three planes: double width, full width, full width */\n   61 | \tcase VIDEO_FORMAT_I010:\n   62 | \t\tlinesize[0] = width * 2;\n   63 | \t\tlinesize[1] = width;\n   64 | \t\tlinesize[2] = width;\n   65 | \t\tbreak;","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-frame.c#L60-L65"}]},
{"id":"LOGIC_133","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`video-matrices.c::video_format_get_parameters_for_bpc` is not thread-safe.\nThe global `matrices_initialized` flag and the `bpp_info`/`format_info` arrays\nare written in `initialize_matrices` without any synchronization. If two threads\ncall `video_format_get_parameters` simultaneously before initialization, both\nsee `matrices_initialized == false`, both call `initialize_matrices`, and both\nwrite the same data concurrently - a data race. In practice OBS initializes the\nvideo system on a single thread before any encoders start, but the API is\npublic (EXPORT) so external callers could trigger this race.","fix":"Use `pthread_once` or an equivalent to guarantee `initialize_matrices` is called exactly once, or initialize the matrices at library load time with a static constructor.","locations":[{"ref":"libobs/media-io/video-matrices.c:169-218","code":"  169 | static bool matrices_initialized = false;\n  170 | \n  171 | static const float full_min[3] = {0.0f, 0.0f, 0.0f};\n  172 | static const float full_max[3] = {1.0f, 1.0f, 1.0f};\n  173 | \n  174 | static bool video_format_get_parameters_for_bpc(enum video_colorspace color_space, enum video_range_type range,\n  175 | \t\t\t\t\t\tfloat matrix[16], float range_min[3], float range_max[3], uint32_t bpc)\n  176 | {\n  177 | \tif (!matrices_initialized) {\n  178 | \t\tinitialize_matrices();\n  179 | \t\tmatrices_initialized = true;\n  180 | \t}\n  181 | \n  182 | \tif ((color_space == VIDEO_CS_DEFAULT) || (color_space == VIDEO_CS_SRGB))\n  183 | \t\tcolor_space = VIDEO_CS_709;\n  184 | \telse if (color_space == VIDEO_CS_2100_HLG)\n  185 | \t\tcolor_space = VIDEO_CS_2100_PQ;\n  186 | \n  187 | \tif (bpc < 8)\n  188 | \t\tbpc = 8;\n  189 | \tif (bpc > 16)\n  190 | \t\tbpc = 16;\n  191 | \tconst uint32_t bpc_index = bpc - 8;\n  192 | \tassert(bpc_index < OBS_COUNTOF(bpp_info));\n  193 | \n  194 | \tbool success = false;\n  195 | \n  196 | \tfor (size_t i = 0; i < NUM_FORMATS; i++) {\n  197 | \t\tsuccess = format_info[i].color_space == color_space;\n  198 | \t\tif (success) {\n  199 | \t\t\tconst bool full_range = range == VIDEO_RANGE_FULL;\n  200 | \t\t\tmemcpy(matrix, format_info[i].matrix[bpc_index][full_range], sizeof(float) * 16);\n  201 | \n  202 | \t\t\tif (range_min) {\n  203 | \t\t\t\tconst float *src_range_min = full_range ? full_min\n  204 | \t\t\t\t\t\t\t\t\t: bpp_info[bpc_index].float_range_min;\n  205 | \t\t\t\tmemcpy(range_min, src_range_min, sizeof(float) * 3);\n  206 | \t\t\t}\n  207 | \n  208 | \t\t\tif (range_max) {\n  209 | \t\t\t\tconst float *src_range_max = full_range ? full_max\n  210 | \t\t\t\t\t\t\t\t\t: bpp_info[bpc_index].float_range_max;\n  211 | \t\t\t\tmemcpy(range_max, src_range_max, sizeof(float) * 3);\n  212 | \t\t\t}\n  213 | \n  214 | \t\t\tbreak;\n  215 | \t\t}\n  216 | \t}\n  217 | \n  218 | \treturn success;","lines":50,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-matrices.c#L169-L218"}]},
{"id":"LOGIC_134","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `obs-audio-controls.c::iec_db_to_def`, the segment for `db >= -114.0f` uses\nthe formula `(db + 150.0f) / 90.0f * 0.025f`. The corresponding forward\nfunction `iec_def_to_db` uses `(def - 0.025f) / 0.025f * 90.0f - 60.0f` for\n`def >= 0.001f`. The inverse should be `def = (db + 60.0f) / 90.0f * 0.025f +\n0.001f`. The constant 150.0 in the inverse (60 + 90 = 150) is mathematically\nequivalent only if the \"+0.001f\" offset is dropped. This means the inverse\nfunction at `db = -150.0f` gives `def = 0`, but at `db = -60.0f` (the segment\nboundary) `iec_db_to_def(-60.0f)` returns `(−60+150)/90*0.025 = 90/90*0.025 =\n0.025`, matching the boundary. At `db = -114.0f` (the lower boundary) it\nreturns `(−114+150)/90*0.025 = 36/90*0.025 = 0.01`, while the forward segment\nstarts at `def = 0.001f`. The asymmetry means round-tripping a value near the\nbottom of this segment (e.g. `def = 0.001f`) does not exactly recover the\noriginal value. This is a minor precision/accuracy issue rather than a crash.","fix":"Document the intentional approximation, or correct the inverse to `def = (db + 60.0f) / 90.0f * 0.025f + 0.001f` for perfect round-trip accuracy at segment boundaries.","locations":[{"ref":"libobs/obs-audio-controls.c:130-157","code":"  130 | static float iec_db_to_def(const float db)\n  131 | {\n  132 | \tif (db == 0.0f)\n  133 | \t\treturn 1.0f;\n  134 | \telse if (db == -INFINITY)\n  135 | \t\treturn 0.0f;\n  136 | \n  137 | \tfloat def;\n  138 | \n  139 | \tif (db >= -9.0f)\n  140 | \t\tdef = (db + 9.0f) / 9.0f * 0.25f + 0.75f;\n  141 | \telse if (db >= -20.0f)\n  142 | \t\tdef = (db + 20.0f) / 11.0f * 0.25f + 0.5f;\n  143 | \telse if (db >= -30.0f)\n  144 | \t\tdef = (db + 30.0f) / 10.0f * 0.2f + 0.3f;\n  145 | \telse if (db >= -40.0f)\n  146 | \t\tdef = (db + 40.0f) / 10.0f * 0.15f + 0.15f;\n  147 | \telse if (db >= -50.0f)\n  148 | \t\tdef = (db + 50.0f) / 10.0f * 0.075f + 0.075f;\n  149 | \telse if (db >= -60.0f)\n  150 | \t\tdef = (db + 60.0f) / 10.0f * 0.05f + 0.025f;\n  151 | \telse if (db >= -114.0f)\n  152 | \t\tdef = (db + 150.0f) / 90.0f * 0.025f;\n  153 | \telse\n  154 | \t\tdef = 0.0f;\n  155 | \n  156 | \treturn def;\n  157 | }","lines":28,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-audio-controls.c#L130-L157"},{"ref":"libobs/obs-audio-controls.c:101-128","code":"  101 | static float iec_def_to_db(const float def)\n  102 | {\n  103 | \tif (def == 1.0f)\n  104 | \t\treturn 0.0f;\n  105 | \telse if (def <= 0.0f)\n  106 | \t\treturn -INFINITY;\n  107 | \n  108 | \tfloat db;\n  109 | \n  110 | \tif (def >= 0.75f)\n  111 | \t\tdb = (def - 1.0f) / 0.25f * 9.0f;\n  112 | \telse if (def >= 0.5f)\n  113 | \t\tdb = (def - 0.75f) / 0.25f * 11.0f - 9.0f;\n  114 | \telse if (def >= 0.3f)\n  115 | \t\tdb = (def - 0.5f) / 0.2f * 10.0f - 20.0f;\n  116 | \telse if (def >= 0.15f)\n  117 | \t\tdb = (def - 0.3f) / 0.15f * 10.0f - 30.0f;\n  118 | \telse if (def >= 0.075f)\n  119 | \t\tdb = (def - 0.15f) / 0.075f * 10.0f - 40.0f;\n  120 | \telse if (def >= 0.025f)\n  121 | \t\tdb = (def - 0.075f) / 0.05f * 10.0f - 50.0f;\n  122 | \telse if (def >= 0.001f)\n  123 | \t\tdb = (def - 0.025f) / 0.025f * 90.0f - 60.0f;\n  124 | \telse\n  125 | \t\tdb = -INFINITY;\n  126 | \n  127 | \treturn db;\n  128 | }","lines":28,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-audio-controls.c#L101-L128"}]},
{"id":"LOGIC_135","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `obs-canvas.c::obs_canvas_scene_create`, the return value of\n`obs_source_create_canvas` is not checked for NULL before dereferencing\n`source->context.data`. If the scene source creation fails (e.g. OOM), this\nwill crash with a NULL pointer dereference.","fix":"```c\nobs_canvas_t *obs_canvas_scene_create(obs_canvas_t *canvas, const char *name)\n{\n    struct obs_source *source = obs_source_create_canvas(canvas, \"scene\", name, NULL, NULL);\n    if (!source)\n        return NULL;\n    return source->context.data;\n}\n```","locations":[{"ref":"libobs/obs-canvas.c:485-488","code":"  485 | {\n  486 | \tstruct obs_source *source = obs_source_create_canvas(canvas, \"scene\", name, NULL, NULL);\n  487 | \treturn source->context.data;\n  488 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-canvas.c#L485-L488"}]},
{"id":"LOGIC_136","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`obs_data_array_erase` does not validate `idx` before accessing\n`array->objects.array[idx]`. If `idx >= array->objects.num` the access is out-of-bounds,\nproducing undefined behaviour (heap read/write beyond the allocated array). The public API\ndocumentation makes no promise that the caller validates the index, and there is no\ncorresponding bounds check in the function.","fix":"Add a bounds check before accessing the array:\n```c\nvoid obs_data_array_erase(obs_data_array_t *array, size_t idx)\n{\n\tif (!array || idx >= array->objects.num)\n\t\treturn;\n\n\tobs_data_release(array->objects.array[idx]);\n\tda_erase(array->objects, idx);\n}\n```","locations":[{"ref":"libobs/obs-data.c:1377-1383","code":" 1377 | void obs_data_array_erase(obs_data_array_t *array, size_t idx)\n 1378 | {\n 1379 | \tif (array) {\n 1380 | \t\tobs_data_release(array->objects.array[idx]);\n 1381 | \t\tda_erase(array->objects, idx);\n 1382 | \t}\n 1383 | }","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-data.c#L1377-L1383"}]},
{"id":"LOGIC_137","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`make_frames_per_second` stores the `numerator` and `denominator` fields of\n`media_frames_per_second` (both `uint32_t`) using `obs_data_set_double`, making the JSON\nrepresentation use floating-point numbers. When these values are read back in\n`get_frames_per_second`, `obs_data_item_get_int` is called, which converts the stored double\nback to `long long` via a cast. While this is lossless for values that fit in a double\nmantissa (up to 2^53, far larger than UINT32_MAX), the mismatch produces confusing JSON\noutput such as `{\"numerator\": 60000.0, \"denominator\": 1001.0}` and creates a fragile\ntype-mismatch between the write and read paths. Callers that directly read the JSON and\nassume integer types would get doubles instead.","fix":"Use `obs_data_set_int` instead of `obs_data_set_double` when serialising the numerator and denominator, and change `obs_data_item_get_int` reads to match:\n```c\nobs_data_set_int(obj, \"numerator\", fps.numerator);\nobs_data_set_int(obj, \"denominator\", fps.denominator);\n```","locations":[{"ref":"libobs/obs-data.c:2041-2053","code":" 2041 | static inline obs_data_t *make_frames_per_second(struct media_frames_per_second fps, const char *option)\n 2042 | {\n 2043 | \tobs_data_t *obj = obs_data_create();\n 2044 | \n 2045 | \tif (!option) {\n 2046 | \t\tobs_data_set_double(obj, \"numerator\", fps.numerator);\n 2047 | \t\tobs_data_set_double(obj, \"denominator\", fps.denominator);\n 2048 | \n 2049 | \t} else {\n 2050 | \t\tobs_data_set_string(obj, \"option\", option);\n 2051 | \t}\n 2052 | \n 2053 | \treturn obj;","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-data.c#L2041-L2053"},{"ref":"libobs/obs-data.c:2112-2113","code":" 2112 | \tlong long num_ll = obs_data_item_get_int(num);\n 2113 | \tlong long den_ll = obs_data_item_get_int(den);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-data.c#L2112-L2113"}]},
{"id":"LOGIC_138","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `obs_hotkeys_set_translations_s` function processes entries from `struct obs_hotkeys_translations` but never applies translations for `OBS_KEY_LEFT`, `OBS_KEY_RIGHT`, `OBS_KEY_UP`, and `OBS_KEY_DOWN`, even though the struct has `left`, `right`, `up`, and `down` fields (obs-hotkey.h lines 96-99). Callers that populate those fields will have their translations silently ignored.","fix":"Add the four missing `ADD_TRANSLATION` calls after the existing block:\n```c\nADD_TRANSLATION(OBS_KEY_LEFT,  left);\nADD_TRANSLATION(OBS_KEY_RIGHT, right);\nADD_TRANSLATION(OBS_KEY_UP,    up);\nADD_TRANSLATION(OBS_KEY_DOWN,  down);\n```","locations":[{"ref":"libobs/obs-hotkey.c:1246-1265","code":" 1246 | \tADD_TRANSLATION(OBS_KEY_INSERT, insert);\n 1247 | \tADD_TRANSLATION(OBS_KEY_DELETE, del);\n 1248 | \tADD_TRANSLATION(OBS_KEY_HOME, home);\n 1249 | \tADD_TRANSLATION(OBS_KEY_END, end);\n 1250 | \tADD_TRANSLATION(OBS_KEY_PAGEUP, page_up);\n 1251 | \tADD_TRANSLATION(OBS_KEY_PAGEDOWN, page_down);\n 1252 | \tADD_TRANSLATION(OBS_KEY_NUMLOCK, num_lock);\n 1253 | \tADD_TRANSLATION(OBS_KEY_SCROLLLOCK, scroll_lock);\n 1254 | \tADD_TRANSLATION(OBS_KEY_CAPSLOCK, caps_lock);\n 1255 | \tADD_TRANSLATION(OBS_KEY_BACKSPACE, backspace);\n 1256 | \tADD_TRANSLATION(OBS_KEY_TAB, tab);\n 1257 | \tADD_TRANSLATION(OBS_KEY_PRINT, print);\n 1258 | \tADD_TRANSLATION(OBS_KEY_PAUSE, pause);\n 1259 | \tADD_TRANSLATION(OBS_KEY_SHIFT, shift);\n 1260 | \tADD_TRANSLATION(OBS_KEY_ALT, alt);\n 1261 | \tADD_TRANSLATION(OBS_KEY_CONTROL, control);\n 1262 | \tADD_TRANSLATION(OBS_KEY_META, meta);\n 1263 | \tADD_TRANSLATION(OBS_KEY_MENU, menu);\n 1264 | \tADD_TRANSLATION(OBS_KEY_SPACE, space);\n 1265 | \tADD_TRANSLATION(OBS_KEY_ESCAPE, escape);","lines":20,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-hotkey.c#L1246-L1265"},{"ref":"libobs/obs-hotkey.h:96-99","code":"   96 | \tconst char *print;\n   97 | \tconst char *pause;\n   98 | \tconst char *left;\n   99 | \tconst char *right;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-hotkey.h#L96-L99"}]},
{"id":"LOGIC_139","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`obs_missing_files_get_file` takes `int idx` but internally indexes a `DARRAY` whose count is `size_t`. A negative `idx` value would be implicitly converted to a very large `size_t` when used as the array index `files->files.array[idx]`, causing an out-of-bounds read. The public header (`obs-missing-files.h:41`) also declares the parameter as `int`, misleading callers who may pass loop variables of type `int` without bounds checking.","fix":"Change the parameter type to `size_t` in both the declaration and the definition:\n```c\n/* header */\nEXPORT obs_missing_file_t *obs_missing_files_get_file(obs_missing_files_t *files, size_t idx);\n\n/* implementation */\nobs_missing_file_t *obs_missing_files_get_file(obs_missing_files_t *files, size_t idx)\n{\n    return files->files.array[idx];\n}\n```","locations":[{"ref":"libobs/obs-missing-files.c:64-67","code":"   64 | obs_missing_file_t *obs_missing_files_get_file(obs_missing_files_t *files, int idx)\n   65 | {\n   66 | \treturn files->files.array[idx];\n   67 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-missing-files.c#L64-L67"},{"ref":"libobs/obs-missing-files.h:41","code":"   41 | EXPORT obs_missing_file_t *obs_missing_files_get_file(obs_missing_files_t *files, int idx);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-missing-files.h#L41"}]},
{"id":"LOGIC_140","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`load_keymap_data` writes to `plat->obs_to_key[obs_key]` even when `obs_key` is\n`OBS_KEY_NONE` (the sentinel value returned by `obs_nix_wayland_key_from_virtual_key` for\nunmapped keysyms). The first unmapped keycode claims slot 0 (`OBS_KEY_NONE`) and prevents\nany subsequent unmapped keycodes from overwriting it (due to the `if (!plat->obs_to_key[obs_key])`\nguard). This means `obs_to_key[OBS_KEY_NONE]` ends up pointing at an arbitrary keycode,\nwhich could produce a spurious label string for `OBS_KEY_NONE` in `obs_nix_wayland_key_to_str`\nbefore the final fallback check on line 374 catches it.","fix":"Skip storing the result when the keysym maps to `OBS_KEY_NONE`:\n\n```c\nobs_key_t obs_key = obs_nix_wayland_key_from_virtual_key(syms[0]);\nif (obs_key != OBS_KEY_NONE && !plat->obs_to_key[obs_key])\n    plat->obs_to_key[obs_key] = key;\nplat->key_to_sym[level][key] = syms[0];\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:60-65","code":"   60 | \t\tobs_key_t obs_key = obs_nix_wayland_key_from_virtual_key(syms[0]);\n   61 | \t\t// This avoids ambiguity where multiple scancodes produce the same symbols.\n   62 | \t\t// e.g. LSGT and Shift+AB08 produce `<` on default US layout.\n   63 | \t\tif (!plat->obs_to_key[obs_key])\n   64 | \t\t\tplat->obs_to_key[obs_key] = key;\n   65 | \t\tplat->key_to_sym[level][key] = syms[0];","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L60-L65"}]},
{"id":"LOGIC_141","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `AJAOutput::OutputThread` the divisor used to convert byte counts into sample-frame counts for the end-of-thread log is computed as `props.audioNumChannels / props.audioSampleSize` instead of `props.audioNumChannels * props.audioSampleSize`. With 8 channels and 4-byte samples this yields `8/4 == 2` rather than `32`, so the logged `qs`/`ws`/`ps` sample counts are off by a large factor. `OutputProps::AudioSize()` elsewhere correctly returns `audioNumChannels * audioSampleSize`.","fix":"Change `uint32_t audioSize = props.audioNumChannels / props.audioSampleSize;` to `uint32_t audioSize = props.audioNumChannels * props.audioSampleSize;`","locations":[{"ref":"plugins/aja/aja-output.cpp:761-768","code":"  761 | \tuint32_t audioSize = props.audioNumChannels / props.audioSampleSize;\n  762 | \tif (audioSize > 0) {\n  763 | \t\tblog(LOG_INFO,\n  764 | \t\t     \"AJAOutput::OutputThread: Thread stopped\\n[Video] qf: %\" PRIu64 \" wf: %\" PRIu64 \" pf: %\" PRIu64\n  765 | \t\t     \"\\n[Audio] qs: %\" PRIu64 \" ws: %\" PRIu64 \" ps: %\" PRIu64,\n  766 | \t\t     ajaOutput->mVideoQueueFrames, ajaOutput->mVideoWriteFrames, ajaOutput->mVideoPlayFrames,\n  767 | \t\t     ajaOutput->mAudioQueueBytes / audioSize, ajaOutput->mAudioWriteBytes / audioSize,\n  768 | \t\t     ajaOutput->mAudioPlayBytes / audioSize);","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/aja/aja-output.cpp#L761-L768"}]},
{"id":"LOGIC_142","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the Linux `GetWindowTitle` and `GetCurrentWindowTitle`, `XFetchName`'s boolean return (`Status`, nonzero on success, 0 on failure) is tested with `status >= Success`. `Success` is the X constant `0`, so `status >= Success` is `status >= 0`, which is always true and the check is dead. It only works because the subsequent `name != nullptr` catches the failure case (`XFetchName` sets `*name = NULL` on failure). The comparison is misleading and semantically wrong.","fix":"Test success correctly, e.g. `if (status != 0 && name != nullptr)` (or just rely on `name != nullptr`).","locations":[{"ref":"plugins/frontend-tools/auto-scene-switcher-nix.cpp:133","code":"  133 | \tif (status >= Success && name != nullptr) {","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/frontend-tools/auto-scene-switcher-nix.cpp#L133"},{"ref":"plugins/frontend-tools/auto-scene-switcher-nix.cpp:186","code":"  186 | \tif (status >= Success && name != nullptr) {","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/frontend-tools/auto-scene-switcher-nix.cpp#L186"}]},
{"id":"LOGIC_143","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`compare_framerates` computes `da - db` as a `double` (e.g. 29.97 vs 30.0) but the function returns `int`, so any fractional difference smaller than 1.0 is truncated to 0 and treated as equal. This makes `g_array_sort` order framerates incorrectly (e.g. 29.97 and 30 are considered equal, and near-neighbours may not be ordered), producing a wrong FPS list ordering in the UI.","fix":"Return a proper sign instead of a truncated difference:\n```c\nreturn (da > db) - (da < db);\n```","locations":[{"ref":"plugins/linux-pipewire/camera-portal.c:630-638","code":"  630 | static int compare_framerates(gconstpointer a, gconstpointer b)\n  631 | {\n  632 | \tconst struct spa_fraction *framerate_a = a;\n  633 | \tconst struct spa_fraction *framerate_b = b;\n  634 | \tdouble da = framerate_a->num / (double)framerate_a->denom;\n  635 | \tdouble db = framerate_b->num / (double)framerate_b->denom;\n  636 | \n  637 | \treturn da - db;\n  638 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-pipewire/camera-portal.c#L630-L638"}]},
{"id":"LOGIC_144","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`v4l2_control_changed` sets its return value `ret = true` only when the `VIDIOC_S_CTRL` ioctl fails (`0 != v4l2_ioctl(...)`), and returns `false` on success. The boolean returned by an `obs_property_set_modified_callback2` handler signals whether the properties UI should be refreshed, so this refreshes the UI precisely when applying the control failed and does nothing when it succeeded - the condition is effectively inverted.","fix":"Either return `false` unconditionally, or set `ret = true` on success: `if (0 == v4l2_ioctl(dev, VIDIOC_S_CTRL, &control)) { ret = true; }` depending on intended refresh semantics.","locations":[{"ref":"plugins/linux-v4l2/v4l2-controls.c:62-64","code":"   62 | \tif (0 != v4l2_ioctl(dev, VIDIOC_S_CTRL, &control)) {\n   63 | \t\tret = true;\n   64 | \t}","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-v4l2/v4l2-controls.c#L62-L64"}]},
{"id":"LOGIC_145","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`virtual_video` loops on partial writes but never advances the source pointer and always passes the full `vcam->frame_size` to `write()`. On a short write it decrements the loop counter `frame_size` by the bytes written, yet the next `write()` re-sends the whole frame from `frame->data[0]` again, sending overlapping/duplicated data and writing more bytes than the frame contains. Only correct when `write()` transfers the entire frame in one call.","fix":"Track an offset and pass the remaining count:\n```c\nuint32_t offset = 0;\nwhile (offset < vcam->frame_size) {\n    ssize_t written = write(vcam->device, frame->data[0] + offset, vcam->frame_size - offset);\n    if (written == -1)\n        break;\n    offset += written;\n}\n```","locations":[{"ref":"plugins/linux-v4l2/v4l2-output.c:304-314","code":"  304 | static void virtual_video(void *param, struct video_data *frame)\n  305 | {\n  306 | \tstruct virtualcam_data *vcam = (struct virtualcam_data *)param;\n  307 | \tuint32_t frame_size = vcam->frame_size;\n  308 | \twhile (frame_size > 0) {\n  309 | \t\tssize_t written = write(vcam->device, frame->data[0], vcam->frame_size);\n  310 | \t\tif (written == -1)\n  311 | \t\t\tbreak;\n  312 | \t\tframe_size -= written;\n  313 | \t}\n  314 | }","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-v4l2/v4l2-output.c#L304-L314"}]},
{"id":"LOGIC_146","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The first `switch (self.captureInfo->lastError)` in `updateSessionwithError:` places the `default:` label inside the braces of `case OBSAVCaptureError_ColorSpace:`, after that case's `break`. Because of this structure, the reset of `lastError` to `OBSAVCaptureError_NoError` and clearing of `sampleBufferDescription` only runs for the `default` path; after handling `OBSAVCaptureError_SampleBufferFormat` or `OBSAVCaptureError_ColorSpace` the error state is never cleared here, which is confusing and likely unintended.","fix":"Move `default:` out to the top level of the switch (dedent it and its body outside the `OBSAVCaptureError_ColorSpace` block) so the control-flow and error reset are explicit and correct for all cases.","locations":[{"ref":"plugins/mac-avcapture/OBSAVCapture.m:578-598","code":"  578 |         case OBSAVCaptureError_ColorSpace: {\n  579 |             if (self.captureInfo->sampleBufferDescription) {\n  580 |                 FourCharCode mediaSubType =\n  581 |                     CMFormatDescriptionGetMediaSubType(self.captureInfo->sampleBufferDescription);\n  582 |                 BOOL isSampleBufferFullRange = [OBSAVCapture isFullRangeFormat:mediaSubType];\n  583 |                 OBSAVCaptureColorSpace sampleBufferColorSpace =\n  584 |                     [OBSAVCapture colorspaceFromDescription:self.captureInfo->sampleBufferDescription];\n  585 |                 OBSAVCaptureVideoRange sampleBufferRangeType = isSampleBufferFullRange ? VIDEO_RANGE_FULL\n  586 |                                                                                        : VIDEO_RANGE_PARTIAL;\n  587 | \n  588 |                 [self AVCaptureLog:LOG_ERROR\n  589 |                         withFormat:@\"Failed to get colorspace parameters for colorspace %u and range %u\",\n  590 |                                    sampleBufferColorSpace, sampleBufferRangeType];\n  591 |             }\n  592 |             break;\n  593 |             default:\n  594 |                 self.captureInfo->lastError = OBSAVCaptureError_NoError;\n  595 |                 self.captureInfo->sampleBufferDescription = NULL;\n  596 |                 break;\n  597 |         }\n  598 |     }","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-avcapture/OBSAVCapture.m#L578-L598"}]},
{"id":"LOGIC_147","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`sample_encoded_callback` tests `if (info_flags == kVTEncodeInfo_FrameDropped)`. `kVTEncodeInfo_FrameDropped` is a bit flag in a bitmask that may also contain `kVTEncodeInfo_Asynchronous`; using `==` instead of a bitwise `&` means the dropped-frame log will not fire whenever another flag bit is also set.","fix":"Use a bit test: `if (info_flags & kVTEncodeInfo_FrameDropped)`.","locations":[{"ref":"plugins/mac-videotoolbox/encoder.c:412-414","code":"  412 | \tif (info_flags == kVTEncodeInfo_FrameDropped) {\n  413 | \t\tVT_LOG(LOG_INFO, \"Frame dropped by encoder\");\n  414 | \t}","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-videotoolbox/encoder.c#L412-L414"}]},
{"id":"LOGIC_148","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`nvidia_audio_destroy` calls `NvAFX_UninitializeLogger()` whenever the global `nvafx_new_sdk` is true, but the NVIDIA logger is a process-global object initialized once per filter in `nvidia_audio_create`. Destroying one filter uninitializes the logger for all remaining filters, and it is also called even in the early-destroy path where this filter never initialized the logger.","fix":"Track logger init/uninit with a reference count or a module-global initialized-once flag instead of initializing/uninitializing it per filter instance.","locations":[{"ref":"plugins/nv-filters/nvidia-audiofx-filter.c:139-140","code":"  139 | \tif (nvafx_new_sdk)\n  140 | \t\tNvAFX_UninitializeLogger();","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-audiofx-filter.c#L139-L140"},{"ref":"plugins/nv-filters/nvidia-audiofx-filter.c:658-665","code":"  658 | \t/* Setup NVIDIA logger */\n  659 | \tif (nvafx_new_sdk) {\n  660 | \t\tNvAFX_Status err = NvAFX_InitializeLogger(NVAFX_LOG_LEVEL_ERROR, LOG_TARGET_CALLBACK, NULL,\n  661 | \t\t\t\t\t\t\t  &nvafx_logger_callback, ng);\n  662 | \t\tif (err != NVAFX_STATUS_SUCCESS) {\n  663 | \t\t\twarn(\"NvAFX logger failed to initialize.\");\n  664 | \t\t}\n  665 | \t}","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-audiofx-filter.c#L658-L665"}]},
{"id":"LOGIC_149","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`setup_audio_settings` reads `aencoders[0]` unconditionally at `config->audio_encoder = obs_encoder_get_codec(aencoders[0])` and `config->frame_size = obs_encoder_get_frame_size(aencoders[0])`, but `aencoders[0]` is only assigned inside the `for` loop that discovers tracks. If the output has no audio encoder, `num_tracks` stays `0` and `aencoders[0]` is an uninitialized stack pointer, which is then passed to `obs_encoder_get_codec` / `obs_encoder_get_frame_size` and dereferenced, causing garbage reads or a crash.","fix":"Guard the audio setup on `num_tracks > 0` (return early or skip codec/frame-size lookup when there are no tracks) so `aencoders[0]` is never read uninitialized, e.g. `if (num_tracks == 0) { config->audio_encoder = NULL; config->frame_size = 0; return true; }` before accessing `aencoders[0]`.","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-mpegts.c:945-973","code":"  945 | \tobs_encoder_t *aencoders[MAX_AUDIO_MIXES];\n  946 | \tint num_tracks = 0;\n  947 | \n  948 | \tfor (;;) {\n  949 | \t\tobs_encoder_t *aencoder = obs_output_get_audio_encoder(stream->output, num_tracks);\n  950 | \t\tif (!aencoder)\n  951 | \t\t\tbreak;\n  952 | \t\taencoders[num_tracks] = aencoder;\n  953 | \t\tnum_tracks++;\n  954 | \t}\n  955 | \n  956 | \tconfig->audio_mix_count = num_tracks;\n  957 | \n  958 | \t/* b) set audio codec & id from audio encoder */\n  959 | \tconfig->audio_encoder = obs_encoder_get_codec(aencoders[0]);\n  960 | \tif (strcmp(config->audio_encoder, \"aac\") == 0)\n  961 | \t\tconfig->audio_encoder_id = AV_CODEC_ID_AAC;\n  962 | \telse if (strcmp(config->audio_encoder, \"opus\") == 0)\n  963 | \t\tconfig->audio_encoder_id = AV_CODEC_ID_OPUS;\n  964 | \n  965 | \t/* c) get audio bitrate from the audio encoder. */\n  966 | \tfor (int idx = 0; idx < num_tracks; idx++) {\n  967 | \t\tobs_data_t *settings = obs_encoder_get_settings(aencoders[idx]);\n  968 | \t\tconfig->audio_bitrates[idx] = (int)obs_data_get_int(settings, \"bitrate\");\n  969 | \t\tobs_data_release(settings);\n  970 | \t}\n  971 | \n  972 | \t/* d) set audio frame size  */\n  973 | \tconfig->frame_size = (int)obs_encoder_get_frame_size(aencoders[0]);","lines":29,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-mpegts.c#L945-L973"}]},
{"id":"LOGIC_150","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The SRT session-summary retransmit/drop percentages are computed with integer division before the multiply. `perf.byteRetransTotal` and `perf.byteSentTotal` are unsigned 64-bit integers, so `perf.byteRetransTotal / perf.byteSentTotal` truncates to 0 (retransmitted bytes are normally far fewer than sent bytes), and multiplying by `100.0` yields `0.0`. The logged \"bytes retransmitted\" and \"bytes dropped\" percentages are therefore effectively always 0%.","fix":"Cast the numerator to double first so the division is floating point, e.g. `perf.byteSentTotal ? (double)perf.byteRetransTotal / (double)perf.byteSentTotal * 100.0 : 0` and likewise for `byteSndDropTotal`.","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg-srt.h:904-906","code":"  904 | \t     (double)perf.msTimeStamp / 1000.0, perf.mbpsSendRate, (double)perf.byteSentTotal / 1000000.0,\n  905 | \t     perf.byteSentTotal ? perf.byteRetransTotal / perf.byteSentTotal * 100.0 : 0,\n  906 | \t     perf.byteSentTotal ? perf.byteSndDropTotal / perf.byteSentTotal * 100.0 : 0);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg-srt.h#L904-L906"}]},
