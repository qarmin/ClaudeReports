{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `log_sdk_version`, `deckLinkAPIInformation->GetString(BMDDeckLinkAPIVersion, &deckLinkVersion)` is called but its result is ignored, and `deckLinkVersion` (uninitialized `decklink_string_t`) is passed to `DeckLinkStringToStdString`. If `GetString` fails, `deckLinkVersion` is an uninitialized pointer that gets dereferenced (`std::string(garbage)` on Linux/Windows, `CFRelease(garbage)` on macOS), which can crash.","fix":"Initialize `deckLinkVersion` to null and check the `GetString` result before converting: `if (deckLinkAPIInformation->GetString(BMDDeckLinkAPIVersion, &deckLinkVersion) == S_OK) { ... }`.","locations":[{"ref":"plugins/decklink/plugin-main.cpp:31-40","code":"   31 | \tif (result == S_OK) {\n   32 | \t\tdecklink_string_t deckLinkVersion;\n   33 | \t\tdeckLinkAPIInformation->GetString(BMDDeckLinkAPIVersion, &deckLinkVersion);\n   34 | \n   35 | \t\tblog(LOG_INFO, \"Decklink API Compiled version %s\", BLACKMAGIC_DECKLINK_API_VERSION_STRING);\n   36 | \n   37 | \t\tstd::string versionString;\n   38 | \t\tDeckLinkStringToStdString(deckLinkVersion, versionString);\n   39 | \n   40 | \t\tblog(LOG_INFO, \"Decklink API Installed version %s\", versionString.c_str());","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/decklink/plugin-main.cpp#L31-L40"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"When loading saved settings, `SaveSceneSwitcher` reconstructs each `SceneSwitch` via `switcher->switches.emplace_back(GetWeakSourceByName(scene), window)`. The `SceneSwitch` constructor builds a `std::regex re(window_)`, which throws `std::regex_error` for an invalid pattern. Unlike `on_add_clicked`, this loading path is not wrapped in a try/catch, so a corrupted/hand-edited saved `window_title` can throw out of the save callback while `switcher->m` is held (locked at line 358), leaving the mutex locked and/or propagating an exception through the frontend save path.","fix":"Wrap the `emplace_back` in a `try { ... } catch (const std::regex_error &) { /* skip invalid entry */ }`, matching the handling in `on_add_clicked`, and ensure the mutex is released via a scoped `lock_guard` rather than manual `lock()`/`unlock()`.","locations":[{"ref":"plugins/frontend-tools/auto-scene-switcher.cpp:379-388","code":"  379 | \t\tfor (size_t i = 0; i < count; i++) {\n  380 | \t\t\tOBSDataAutoRelease array_obj = obs_data_array_item(array, i);\n  381 | \n  382 | \t\t\tconst char *scene = obs_data_get_string(array_obj, \"scene\");\n  383 | \t\t\tconst char *window = obs_data_get_string(array_obj, \"window_title\");\n  384 | \n  385 | \t\t\tswitcher->switches.emplace_back(GetWeakSourceByName(scene), window);\n  386 | \t\t}\n  387 | \n  388 | \t\tswitcher->m.unlock();","lines":10,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/frontend-tools/auto-scene-switcher.cpp#L379-L388"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `_alsa_configure` the return value of `snd_pcm_hw_params_set_format` is discarded: the call is made without assigning to `err`, then `if (err < 0)` tests the stale `err` (which is 0 from the successful `snd_pcm_hw_params_test_format` break). The error branch for `set_format` is therefore dead code and a genuine set-format failure would go unreported and continue with an unconfigured format.","fix":"Assign the result:\n```c\nerr = snd_pcm_hw_params_set_format(data->handle, hwparams, data->format);\nif (err < 0) {\n```","locations":[{"ref":"plugins/linux-alsa/alsa-input.c:457-461","code":"  457 | \tsnd_pcm_hw_params_set_format(data->handle, hwparams, data->format);\n  458 | \tif (err < 0) {\n  459 | \t\tblog(LOG_ERROR, \"snd_pcm_hw_params_set_format failed: %s\", snd_strerror(err));\n  460 | \t\treturn false;\n  461 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-alsa/alsa-input.c#L457-L461"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`randr_screen_geo` returns `0` (which callers treat as success, since `xshm_update_geometry` only checks `< 0`) when `xcb_randr_get_monitors_reply` returns NULL, leaving the caller's `*x/*y/*w/*h` unset. Every other failure path in this function uses `goto fail`, which zeroes the outputs and returns `-1`. This inconsistency can propagate stale/garbage geometry on a monitors-query failure.","fix":"Treat the NULL reply as an error like the other paths:\n```c\nif (!mon_r)\n    goto fail;\n```","locations":[{"ref":"plugins/linux-capture/xhelpers.c:164-165","code":"  164 | \t\tif (!mon_r)\n  165 | \t\t\treturn 0;","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-capture/xhelpers.c#L164-L165"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`xshm_xcb_attach` does not check the result of `shmat`. On failure `shmat` returns `(void*)-1`, but the function still returns a non-NULL `shm` whose `data` is `-1`. `xshm_video_tick` later passes `data->xshm->data` to `gs_texture_set_image`, dereferencing `(void*)-1` and crashing. (The detach path already special-cases `-1`, confirming the value can occur.)","fix":"After `shm->data = shmat(shm->shmid, NULL, 0);` check `if (shm->data == (void *)-1) goto fail;` so callers see NULL and abort capture.","locations":[{"ref":"plugins/linux-capture/xhelpers.c:265-286","code":"  265 | xcb_shm_t *xshm_xcb_attach(xcb_connection_t *xcb, const int w, const int h)\n  266 | {\n  267 | \tif (!xcb)\n  268 | \t\treturn NULL;\n  269 | \n  270 | \txcb_shm_t *shm = bzalloc(sizeof(xcb_shm_t));\n  271 | \tshm->xcb = xcb;\n  272 | \tshm->seg = xcb_generate_id(shm->xcb);\n  273 | \n  274 | \tshm->shmid = shmget(IPC_PRIVATE, w * h * 4, IPC_CREAT | 0777);\n  275 | \tif (shm->shmid == -1)\n  276 | \t\tgoto fail;\n  277 | \n  278 | \txcb_shm_attach(shm->xcb, shm->seg, shm->shmid, false);\n  279 | \n  280 | \tshm->data = shmat(shm->shmid, NULL, 0);\n  281 | \n  282 | \treturn shm;\n  283 | fail:\n  284 | \txshm_xcb_detach(shm);\n  285 | \treturn NULL;\n  286 | }","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/linux-capture/xhelpers.c#L265-L286"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`CVPixelBufferCreateWithIOSurface` return status is ignored and `frame` is declared uninitialized (line 117-118). If the call fails, `frame` holds garbage and is subsequently passed to `CVPixelBufferGetWidth`, the delegate callback, and `CVPixelBufferRelease`, causing a crash / invalid release. This is on the frame-receive hot path; while the surface is validated first (so failure is rare), the missing check makes any failure fatal.","fix":"Check the return value and initialize `frame`:\n```c\nCVPixelBufferRef frame = NULL;\nif (CVPixelBufferCreateWithIOSurface(kCFAllocatorDefault, surface, NULL, &frame) != kCVReturnSuccess || !frame) {\n    IOSurfaceUnlock(...); CFRelease(surface); [framePort invalidate]; ... return;\n}\n```","locations":[{"ref":"plugins/mac-virtualcam/src/dal-plugin/OBSDALMachClient.mm:117-138","code":"  117 |                     CVPixelBufferRef frame;\n  118 |                     CVPixelBufferCreateWithIOSurface(kCFAllocatorDefault, surface, NULL, &frame);\n  119 | #ifndef __aarch64__\n  120 |                     IOSurfaceUnlock(surface, kIOSurfaceLockReadOnly, NULL);\n  121 | #endif\n  122 |                     CFRelease(surface);\n  123 | \n  124 |                     uint64_t timestamp;\n  125 |                     [components[1] getBytes:&timestamp length:sizeof(timestamp)];\n  126 | \n  127 |                     VLog(@\"Received frame data: %zux%zu (%llu)\", CVPixelBufferGetWidth(frame),\n  128 |                          CVPixelBufferGetHeight(frame), timestamp);\n  129 | \n  130 |                     uint32_t fpsNumerator;\n  131 |                     [components[2] getBytes:&fpsNumerator length:sizeof(fpsNumerator)];\n  132 |                     uint32_t fpsDenominator;\n  133 |                     [components[3] getBytes:&fpsDenominator length:sizeof(fpsDenominator)];\n  134 | \n  135 |                     [strongDelegate receivedPixelBuffer:frame timestamp:timestamp fpsNumerator:fpsNumerator\n  136 |                                          fpsDenominator:fpsDenominator];\n  137 | \n  138 |                     CVPixelBufferRelease(frame);","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-virtualcam/src/dal-plugin/OBSDALMachClient.mm#L117-L138"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"Several `blog`/`warn` calls in the AMF encoder use the wrong printf conversion for 64-bit arguments. `amf_set_codec_level` prints `luma_sample_rate` and `luma_pic_size` (both `uint64_t`) with `%u`, and the level-string warnings print `final_level` (`amf_int64`) with `%d`. Passing a 64-bit value to a 32-bit `%u`/`%d` conversion is undefined; it prints truncated/garbage values and, because a `%s` (`level_str`) follows the two `%u` in `amf_set_codec_level`, may misalign the remaining varargs and read a bad pointer.","fix":"Use 64-bit conversions, e.g. `%\" PRIu64 \"` for `luma_sample_rate`/`luma_pic_size` and `%\" PRId64 \"` (or cast to `long long` with `%lld`) for `final_level`.","locations":[{"ref":"plugins/obs-ffmpeg/texture-amf.cpp:1503-1505","code":" 1503 | \t\t     \"%s: Luma sample rate %u or luma pic size %u is greater than maximum \"\n 1504 | \t\t     \"allowed. Setting to level %s.\",\n 1505 | \t\t     __FUNCTION__, luma_sample_rate, luma_pic_size, level_it->level_str);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/texture-amf.cpp#L1503-L1505"},{"ref":"plugins/obs-ffmpeg/texture-amf.cpp:1649","code":" 1649 | \t\twarn(\"AVC level string not found. Level %d may be incorrect.\", final_level);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/texture-amf.cpp#L1649"},{"ref":"plugins/obs-ffmpeg/texture-amf.cpp:2019","code":" 2019 | \t\twarn(\"HEVC level string not found. Level %d may be incorrect.\", final_level);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/texture-amf.cpp#L2019"},{"ref":"plugins/obs-ffmpeg/texture-amf.cpp:2467","code":" 2467 | \t\twarn(\"AV1 level string not found. Level %d may be incorrect.\", final_level);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/texture-amf.cpp#L2467"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`get_protocol` (line 124-127), `update_protocol` (line 563-566) and `is_protocol_available` (line 260-264) call `get_string_val(server, \"url\")` and pass the result straight into `strncmp(url, RTMPS_PREFIX, ...)`. `get_string_val` returns NULL when the `url` key is missing or not a string, causing a NULL dereference in `strncmp`. Input comes from the bundled/downloadable `services.json`, so a malformed or hostile services file crashes the plugin.","fix":"Guard against a NULL url before comparing, e.g. `const char *url = get_string_val(server, \"url\"); if (url && strncmp(url, RTMPS_PREFIX, strlen(RTMPS_PREFIX)) == 0) ...`.","locations":[{"ref":"plugins/rtmp-services/rtmp-common.c:124-127","code":"  124 | \tjson_t *server = json_array_get(servers, 0);\n  125 | \tconst char *url = get_string_val(server, \"url\");\n  126 | \n  127 | \tif (strncmp(url, RTMPS_PREFIX, strlen(RTMPS_PREFIX)) == 0) {","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/rtmp-services/rtmp-common.c#L124-L127"},{"ref":"plugins/rtmp-services/rtmp-common.c:260-265","code":"  260 | \t\turl = get_string_val(server, \"url\");\n  261 | \n  262 | \t\tif (strncmp(url, RTMP_PREFIX, strlen(RTMP_PREFIX)) == 0)\n  263 | \t\t\tret |= obs_is_output_protocol_registered(\"RTMP\");\n  264 | \t\telse if (strncmp(url, RTMPS_PREFIX, strlen(RTMPS_PREFIX)) == 0)\n  265 | \t\t\tret |= obs_is_output_protocol_registered(\"RTMPS\");","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/rtmp-services/rtmp-common.c#L260-L265"},{"ref":"plugins/rtmp-services/rtmp-common.c:563-566","code":"  563 | \tjson_t *server = json_array_get(servers, 0);\n  564 | \tconst char *url = get_string_val(server, \"url\");\n  565 | \n  566 | \tif (strncmp(url, RTMPS_PREFIX, strlen(RTMPS_PREFIX)) == 0) {","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/rtmp-services/rtmp-common.c#L563-L566"}]},
{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `load_ingests`, only `item_name`/`item_url` are checked for presence, not that they are strings. `name_str = json_string_value(item_name)` returns NULL if `item_name` is present but not a string, and `strstr(name_str, \"deprecated\")` (line 68) then dereferences NULL. Reachable via a malformed ingests JSON payload fetched from the network for Twitch/Amazon IVS.","fix":"After `name_str = json_string_value(item_name);` add `if (!name_str) continue;` before using it in `strstr`.","locations":[{"ref":"plugins/rtmp-services/service-specific/service-ingest.c:59-69","code":"   59 | \t\tif (!item_name || !item_url)\n   60 | \t\t\tcontinue;\n   61 | \n   62 | \t\tconst char *url_str = json_string_value(item_url);\n   63 | \t\tconst char *rtmps_url_str = json_string_value(item_rtmps_url);\n   64 | \t\tconst char *name_str = json_string_value(item_name);\n   65 | \n   66 | \t\t/* At the moment they currently mis-spell \"deprecated\",\n   67 | \t\t * but that may change in the future, so blacklist both */\n   68 | \t\tif (strstr(name_str, \"deprecated\") != NULL || strstr(name_str, \"depracated\") != NULL)\n   69 | \t\t\tcontinue;","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/rtmp-services/service-specific/service-ingest.c#L59-L69"}]},
{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`hlog_hr` has the signature `void hlog_hr(const char *text, HRESULT hr)` and does not accept printf-style arguments; it formats the message as `hlog(\"%s (0x%08lX): %s\", text, hr, buffer)`. These two calls pass a `%d` inside the `text` (which is emitted literally, not substituted) and pass `GetLastError()` (a `DWORD`, not an `HRESULT`) as the `hr` argument, so the log line prints a stray `%d` and then interprets the last-error code as an HRESULT message. This is a copy/paste from `hlog_hr` usage where `hlog` was intended.","fix":"Use `hlog` instead, e.g. `hlog(\"copy_thread: Failed to duplicate copy event: %lu\", GetLastError());` and `hlog(\"copy_thread: Failed to duplicate stop event: %lu\", GetLastError());`.","locations":[{"ref":"plugins/win-capture/graphics-hook/graphics-hook.c:583","code":"  583 | \t\thlog_hr(\"copy_thread: Failed to duplicate copy event: %d\", GetLastError());","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/graphics-hook/graphics-hook.c#L583"},{"ref":"plugins/win-capture/graphics-hook/graphics-hook.c:588","code":"  588 | \t\thlog_hr(\"copy_thread: Failed to duplicate stop event: %d\", GetLastError());","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/graphics-hook/graphics-hook.c#L588"}]},
{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`ipc_pipe_internal_ensure_capacity()` reassigns `pipe->read_data = realloc(pipe->read_data, new_size)` and unconditionally sets `pipe->capacity = new_size`. If `realloc` fails it returns `NULL`: the original buffer is leaked, `read_data` becomes `NULL` while `capacity` is left claiming the new (larger) size, and the immediately following `memcpy(pipe->read_data + pipe->size, ...)` in `ipc_pipe_internal_append_bytes` dereferences `NULL`, crashing the server thread. Rare (OOM) but unhandled.","fix":"Use a temporary pointer and only commit on success:\n```c\nvoid *tmp = realloc(pipe->read_data, new_size);\nif (!tmp)\n\treturn; /* or propagate failure */\npipe->read_data = tmp;\npipe->capacity = new_size;\n```\nand have `ipc_pipe_internal_append_bytes` check for capacity growth failure.","locations":[{"ref":"shared/ipc-util/ipc-util/pipe-windows.c:89-105","code":"   89 | static inline void ipc_pipe_internal_ensure_capacity(ipc_pipe_server_t *pipe, size_t new_size)\n   90 | {\n   91 | \tif (pipe->capacity >= new_size) {\n   92 | \t\treturn;\n   93 | \t}\n   94 | \n   95 | \tpipe->read_data = realloc(pipe->read_data, new_size);\n   96 | \tpipe->capacity = new_size;\n   97 | }\n   98 | \n   99 | static inline void ipc_pipe_internal_append_bytes(ipc_pipe_server_t *pipe, uint8_t *bytes, size_t size)\n  100 | {\n  101 | \tsize_t new_size = pipe->size + size;\n  102 | \tipc_pipe_internal_ensure_capacity(pipe, new_size);\n  103 | \tmemcpy(pipe->read_data + pipe->size, bytes, size);\n  104 | \tpipe->size = new_size;\n  105 | }","lines":17,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/ipc-util/ipc-util/pipe-windows.c#L89-L105"}]},
{"id":"ERR_25","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"In `nvvfx_filter_update`, the result of `NvVFX_SetU32(filter->handle, NVVFX_MODE, mode)` is immediately overwritten by the following `NvVFX_Load` call, so a failure to set the mode is silently discarded. Only the (unrelated) load error is reported.","fix":"Check the `NvVFX_SetU32` return value before calling `NvVFX_Load`, or at minimum log it: `if (NVCV_SUCCESS != vfxErr) error(...);` before the load.","locations":[{"ref":"plugins/nv-filters/nvidia-videofx-filter.c:139-142","code":"  139 | \t\t\tvfxErr = NvVFX_SetU32(filter->handle, NVVFX_MODE, mode);\n  140 | \t\t\tvfxErr = NvVFX_Load(filter->handle);\n  141 | \t\t\tif (NVCV_SUCCESS != vfxErr)\n  142 | \t\t\t\terror(\"Error loading AI Greenscreen FX %i\", vfxErr);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-videofx-filter.c#L139-L142"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"On macOS, `UIValidation::StreamSettingsConfirmation` maps the Cancel button role to\n`QMessageBox::ResetRole` (line 95) instead of `QMessageBox::RejectRole`. On macOS, Qt follows\nthe Human Interface Guidelines for button placement by role. `ResetRole` is reserved for\ndestructive \"Reset\" actions and is placed on the left side of the dialog, far from where a\nuser expects a Cancel button. `RejectRole` (which maps to standard Cancel placement) should be\nused instead. The current code causes the Cancel button to appear in the wrong position,\nharming macOS usability and violating platform conventions.","fix":"Change `REJECT_BUTTON` to `QMessageBox::RejectRole` on macOS:\n```cpp\n#ifdef __APPLE__\n#define ACCEPT_BUTTON QMessageBox::AcceptRole\n#define REJECT_BUTTON QMessageBox::RejectRole\n#else\n#define ACCEPT_BUTTON QMessageBox::NoRole\n#define REJECT_BUTTON QMessageBox::NoRole\n#endif\n```","locations":[{"ref":"frontend/components/UIValidation.cpp:93-101","code":"   93 | #ifdef __APPLE__\n   94 | #define ACCEPT_BUTTON QMessageBox::AcceptRole\n   95 | #define REJECT_BUTTON QMessageBox::ResetRole\n   96 | #else\n   97 | #define ACCEPT_BUTTON QMessageBox::NoRole\n   98 | #define REJECT_BUTTON QMessageBox::NoRole\n   99 | #endif\n  100 | \tsettings = messageBox.addButton(QTStr(\"Basic.Settings.Stream.StreamSettingsWarning\"), ACCEPT_BUTTON);\n  101 | \tcancel = messageBox.addButton(QTStr(\"Cancel\"), REJECT_BUTTON);","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/UIValidation.cpp#L93-L101"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`obs_missing_file_destroy` is exported as a public API but bypasses the reference count maintained by `obs_missing_file_release`. Since `obs_missing_files_append` increments `file->ref` so the same file can be shared across multiple `obs_missing_files_t` containers, a caller that calls `obs_missing_file_destroy` directly on a file with `ref > 1` will free memory that is still referenced by other containers, leading to use-after-free when those containers later release or access the file.","fix":"Either remove `obs_missing_file_destroy` from the public API and document that `obs_missing_file_release` must be the only way to free a file, or make `obs_missing_file_destroy` delegate to `obs_missing_file_release`:\n```c\n/* Remove EXPORT from obs_missing_file_destroy so it becomes internal only,\n * and update the header to not expose it. Callers should use\n * obs_missing_file_release instead. */\n```","locations":[{"ref":"libobs/obs-missing-files.c:101-121","code":"  101 | void obs_missing_file_release(obs_missing_file_t *file)\n  102 | {\n  103 | \tif (!file)\n  104 | \t\treturn;\n  105 | \n  106 | \tif (os_atomic_dec_long(&file->ref) == 0)\n  107 | \t\tobs_missing_file_destroy(file);\n  108 | }\n  109 | \n  110 | void obs_missing_file_destroy(obs_missing_file_t *file)\n  111 | {\n  112 | \tswitch (file->src_type) {\n  113 | \tcase OBS_MISSING_FILE_SOURCE:\n  114 | \t\tbfree(file->src_name);\n  115 | \t\tbreak;\n  116 | \tcase OBS_MISSING_FILE_SCRIPT:\n  117 | \t\tbreak;\n  118 | \t}\n  119 | \tbfree(file->file_path);\n  120 | \tbfree(file);\n  121 | }","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-missing-files.c#L101-L121"},{"ref":"libobs/obs-missing-files.h:49","code":"   49 | EXPORT void obs_missing_file_destroy(obs_missing_file_t *file);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-missing-files.h#L49"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`platform_keyboard_keymap` ignores the `format` parameter entirely\n(`UNUSED_PARAMETER(format)`). The Wayland `wl_keyboard.keymap` event can carry\n`WL_KEYBOARD_KEYMAP_FORMAT_NO_KEYMAP` (value 0) to indicate that no keymap is associated\nwith the seat and the fd should not be read. When a compositor sends format 0, the spec\nsays the fd is -1. `mmap(NULL, size, PROT_READ, MAP_PRIVATE, -1, 0)` will fail with EBADF\nand the function returns early, accidentally surviving. However, relying on mmap failure\nrather than checking the format is fragile: a future compositor could send a valid fd with\nformat 0 (non-XKB keymap), in which case the code would try to parse a binary blob as\nXKB text and potentially crash or corrupt state.","fix":"Explicitly reject non-XKB formats before processing:\n\n```c\nstatic void platform_keyboard_keymap(void *data, struct wl_keyboard *keyboard,\n                                     uint32_t format, int32_t fd, uint32_t size)\n{\n    UNUSED_PARAMETER(keyboard);\n    if (format != WL_KEYBOARD_KEYMAP_FORMAT_XKB_V1) {\n        close(fd);\n        return;\n    }\n    // ... rest of the function unchanged\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:76-101","code":"   76 | static void platform_keyboard_keymap(void *data, struct wl_keyboard *keyboard, uint32_t format, int32_t fd,\n   77 | \t\t\t\t     uint32_t size)\n   78 | {\n   79 | \tUNUSED_PARAMETER(keyboard);\n   80 | \tUNUSED_PARAMETER(format);\n   81 | \tobs_hotkeys_platform_t *plat = (obs_hotkeys_platform_t *)data;\n   82 | \n   83 | \tchar *keymap_shm = mmap(NULL, size, PROT_READ, MAP_PRIVATE, fd, 0);\n   84 | \tif (keymap_shm == MAP_FAILED) {\n   85 | \t\tclose(fd);\n   86 | \t\treturn;\n   87 | \t}\n   88 | \n   89 | \tstruct xkb_keymap *xkb_keymap = xkb_keymap_new_from_string(\n   90 | \t\tplat->xkb_context, keymap_shm, XKB_KEYMAP_FORMAT_TEXT_V1, XKB_KEYMAP_COMPILE_NO_FLAGS);\n   91 | \tmunmap(keymap_shm, size);\n   92 | \tclose(fd);\n   93 | \n   94 | \t// cleanup old keymap and state\n   95 | \txkb_keymap_unref(plat->xkb_keymap);\n   96 | \txkb_state_unref(plat->xkb_state);\n   97 | \n   98 | \tplat->xkb_keymap = xkb_keymap;\n   99 | \tplat->xkb_state = xkb_state_new(xkb_keymap);\n  100 | \trebuild_keymap_data(plat);\n  101 | }","lines":26,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L76-L101"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`CaptionStream::GetDefaultFormat(GUID *format, WAVEFORMATEX **co_mem_wfex_out)` names its first parameter `format`, which shadows the member `WAVEFORMATEX format`. As a result `CoTaskMemAlloc(sizeof(format))` allocates `sizeof(GUID*)` (8 bytes) instead of `sizeof(WAVEFORMATEX)`, and `memcpy(wfex, &format, sizeof(format))` copies 8 bytes of the parameter pointer's address rather than the actual wave format. The returned `WAVEFORMATEX*` is undersized and filled with garbage; any SAPI consumer reading its fields reads past the 8-byte allocation. The sibling `GetFormat` (which names its GUID param `guid`) does this correctly.","fix":"Rename the parameter so it no longer shadows the member and copy the member format, e.g.:\n```cpp\nSTDMETHODIMP CaptionStream::GetDefaultFormat(GUID *guid, WAVEFORMATEX **co_mem_wfex_out)\n{\n    if (!guid || !co_mem_wfex_out)\n        return E_POINTER;\n    void *wfex = CoTaskMemAlloc(sizeof(format));\n    memcpy(wfex, &format, sizeof(format));\n    *guid = SPDFID_WaveFormatEx;\n    *co_mem_wfex_out = (WAVEFORMATEX *)wfex;\n    return S_OK;\n}\n```","locations":[{"ref":"plugins/frontend-tools/captions-mssapi-stream.cpp:355-368","code":"  355 | STDMETHODIMP CaptionStream::GetDefaultFormat(GUID *format, WAVEFORMATEX **co_mem_wfex_out)\n  356 | {\n  357 | \tdebugfunc(\"format, co_mem_wfex_out\");\n  358 | \n  359 | \tif (!format || !co_mem_wfex_out) {\n  360 | \t\treturn E_POINTER;\n  361 | \t}\n  362 | \n  363 | \tvoid *wfex = CoTaskMemAlloc(sizeof(format));\n  364 | \tmemcpy(wfex, &format, sizeof(format));\n  365 | \n  366 | \t*format = SPDFID_WaveFormatEx;\n  367 | \t*co_mem_wfex_out = (WAVEFORMATEX *)wfex;\n  368 | \treturn S_OK;","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/frontend-tools/captions-mssapi-stream.cpp#L355-L368"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`session_set_bitrate` creates the `DataRateLimits` numbers with mismatched `CFNumber` types. `cpb_size` is a `double` but is passed to `CFNumberCreate` with `kCFNumberIntType`, which copies only `sizeof(int)` bytes out of an 8-byte `double`, yielding a garbage value. Likewise `max_bitrate_window` is a `double` but is passed with `kCFNumberFloatType` (reads 4 bytes of an 8-byte double). Both entries of the data-rate-limit array are therefore garbage, so bitrate capping (`Use Max Bitrate`) does not work as intended.","fix":"Use matching types. Either make `cpb_size` an `int` and keep `kCFNumberIntType`, and use `kCFNumberDoubleType` for the window:\n```c\nint cpb_size = (int)(max_bitrate * 125 * max_bitrate_window);\nCFNumberRef cf_cpb_size = CFNumberCreate(kCFAllocatorDefault, kCFNumberIntType, &cpb_size);\nCFNumberRef cf_cpb_window_size = CFNumberCreate(kCFAllocatorDefault, kCFNumberDoubleType, &max_bitrate_window);\n```","locations":[{"ref":"plugins/mac-videotoolbox/encoder.c:328-332","code":"  328 | \t\tdouble cpb_size = max_bitrate * 125 * max_bitrate_window;\n  329 | \n  330 | \t\tCFNumberRef cf_cpb_size = CFNumberCreate(kCFAllocatorDefault, kCFNumberIntType, &cpb_size);\n  331 | \t\tCFNumberRef cf_cpb_window_size =\n  332 | \t\t\tCFNumberCreate(kCFAllocatorDefault, kCFNumberFloatType, &max_bitrate_window);","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-videotoolbox/encoder.c#L328-L332"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`read_from_end` opens the file with plain `fopen(filename, \"rb\")`, whereas the sibling function `load_text_from_file` correctly uses `os_fopen`. On Windows `filename` is UTF-8, and `fopen` interprets it as the local ANSI code page, so any text-file path containing non-ASCII characters fails to open (the source silently reports load failure). Both readers should behave identically.","fix":"```c\n-\ttmp_file = fopen(filename, \"rb\");\n+\ttmp_file = os_fopen(filename, \"rb\");\n```","locations":[{"ref":"plugins/text-freetype2/text-functionality.c:434","code":"  434 | \ttmp_file = fopen(filename, \"rb\");","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/text-freetype2/text-functionality.c#L434"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`obs_python_unload` destroys `tick_mutex` and `timer_mutex` at the top whenever `mutexes_loaded` is true, but never resets `mutexes_loaded` to `false`. On the Python-load-failure path, `obs_scripting_load_python` calls `obs_python_unload()` (which destroys the mutexes then returns early because `python_loaded_at_all` is still false). At application shutdown `obs_scripting_unload` calls `obs_python_unload()` again, destroying the same pthread mutexes a second time - undefined behavior. This is reliably reachable on Linux when the `obspython` module fails to import.","fix":"Reset the flag after destroying: after `pthread_mutex_destroy(&timer_mutex);` add `mutexes_loaded = false;` inside the `if (mutexes_loaded)` block.","locations":[{"ref":"shared/obs-scripting/obs-scripting-python.c:1583-1591","code":" 1583 | void obs_python_load(void)\n 1584 | {\n 1585 | \tda_init(python_paths);\n 1586 | \n 1587 | \tpthread_mutex_init(&tick_mutex, NULL);\n 1588 | \tpthread_mutex_init_recursive(&timer_mutex);\n 1589 | \n 1590 | \tmutexes_loaded = true;\n 1591 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/obs-scripting/obs-scripting-python.c#L1583-L1591"},{"ref":"shared/obs-scripting/obs-scripting-python.c:1741-1746","code":" 1741 | void obs_python_unload(void)\n 1742 | {\n 1743 | \tif (mutexes_loaded) {\n 1744 | \t\tpthread_mutex_destroy(&tick_mutex);\n 1745 | \t\tpthread_mutex_destroy(&timer_mutex);\n 1746 | \t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/obs-scripting/obs-scripting-python.c#L1741-L1746"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`IsSafeFilename` calls `isalnum(*p)` where `p` is a `const wchar_t *`. `isalnum` requires an argument representable as `unsigned char` or `EOF`; passing a wide character outside that range (any non-ASCII path component) is undefined behavior and can misclassify characters or trip CRT assertions. Manifest paths are currently ASCII so it rarely bites, but it is incorrect for wide input.","fix":"Use the wide-character classifier `iswalnum(*p)` instead of `isalnum(*p)` (or cast through `unsigned char` only for genuinely narrow data).","locations":[{"ref":"frontend/updater/updater.cpp:236-241","code":"  236 | \twhile (*p) {\n  237 | \t\tif (!isalnum(*p) && *p != '.' && *p != '/' && *p != '_' && *p != '-') {\n  238 | \t\t\treturn false;\n  239 | \t\t}\n  240 | \t\tp++;\n  241 | \t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/updater/updater.cpp#L236-L241"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"In `NtMapViewOfSection_hook`, when a module is blocked the code calls `ntUnmap(ProcessHandle, BaseAddress)`, passing `BaseAddress` (a `PVOID *`) where `NtUnmapViewOfSection` expects the view base `PVOID`. Everywhere else in the function the actual base is `*BaseAddress` (see the PE-header read at line 289 and `K32GetMappedFileNameW` at line 305). Passing the address-of-the-pointer means the unmap targets a stack location, fails with STATUS_NOT_MAPPED_VIEW, and leaves the blocked DLL's view mapped in the address space (a per-block view leak). The load still fails via the returned STATUS_UNSUCCESSFUL, so the block remains effective, but the mapping leaks. (Note: identical to current upstream, so a pre-existing latent defect.)","fix":"Pass the mapped base value: `ntUnmap(ProcessHandle, *BaseAddress);`","locations":[{"ref":"frontend/utility/win-dll-blocklist.c:318-321","code":"  318 | \tif (is_module_blocked(fileName, timestamp)) {\n  319 | \t\tntUnmap(ProcessHandle, BaseAddress);\n  320 | \t\tret = STATUS_UNSUCCESSFUL;\n  321 | \t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/win-dll-blocklist.c#L318-L321"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`gl_init_volume` computes `const uint32_t bpp = gs_get_format_bpp(format);` but `format` here is the *OpenGL* format enum (`tex->base.gl_format`, e.g. `GL_RGBA`) passed down by `upload_texture_3d`/`device_voltexture_create`, not a `gs_color_format`. `gs_get_format_bpp` expects a `gs_color_format`, so `bpp` (and hence `mip_size` for compressed 3D textures) is computed from a meaningless enum value. Only reachable for compressed volume textures, but it is a genuine type/API misuse.","fix":"Pass the real `gs_color_format` (e.g. add a `enum gs_color_format` parameter) or precompute the compressed mip size in the caller from `tex->base.format`, mirroring how `gl_init_face` receives a caller-computed `size`.","locations":[{"ref":"libobs-opengl/gl-texture3d.c:20-31","code":"   20 | static bool gl_init_volume(GLenum type, uint32_t num_levels, GLenum format, GLint internal_format, bool compressed,\n   21 | \t\t\t   uint32_t width, uint32_t height, uint32_t depth, const uint8_t *const **p_data)\n   22 | {\n   23 | \tbool success = true;\n   24 | \tconst uint8_t *const *data = p_data ? *p_data : NULL;\n   25 | \tuint32_t i;\n   26 | \tconst uint32_t bpp = gs_get_format_bpp(format);\n   27 | \n   28 | \tfor (i = 0; i < num_levels; i++) {\n   29 | \t\tif (compressed) {\n   30 | \t\t\tuint32_t mip_size = width * height * depth * bpp / 8;\n   31 | \t\t\tglCompressedTexImage3D(GL_TEXTURE_3D, i, internal_format, width, height, depth, 0, mip_size,","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-opengl/gl-texture3d.c#L20-L31"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`CardManager::begin()` and `CardManager::end()` each take `std::lock_guard<std::mutex>` on `mMutex`, but the guard is destroyed (lock released) the moment the function returns the iterator. Callers such as the range-for loops over `*cardManager` (e.g. in `create_misc_props_ui` and `populate_misc_device_list`) therefore iterate `mCardEntries` completely unlocked, so the locking gives a false sense of thread safety while doing nothing to protect concurrent access against `EnumerateCards`/`ClearCardEntries` which mutate the map under the same mutex. `GetCardEntries()` returning a reference to the internal map under a lock that is immediately released has the same issue.","fix":"Do not expose raw begin()/end() iterators; instead provide a method that performs the iteration while holding the lock (e.g. accepting a callback), or return a copy of the entries under the lock so callers operate on a stable snapshot.","locations":[{"ref":"plugins/aja/aja-card-manager.cpp:561-571","code":"  561 | const CardEntries::iterator CardManager::begin()\n  562 | {\n  563 | \tconst std::lock_guard<std::mutex> lock(mMutex);\n  564 | \treturn mCardEntries.begin();\n  565 | }\n  566 | \n  567 | const CardEntries::iterator CardManager::end()\n  568 | {\n  569 | \tconst std::lock_guard<std::mutex> lock(mMutex);\n  570 | \treturn mCardEntries.end();\n  571 | }","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/aja/aja-card-manager.cpp#L561-L571"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`CFStringGetCStringPtr(uuid_string, kCFStringEncodingUTF8)` is used directly as the value passed to `obs_data_set_default_string` / `obs_property_list_add_string`. `CFStringGetCStringPtr` is documented to return `NULL` when the string's internal storage is not the requested encoding (common for `CFUUIDCreateString` output), which would store a NULL/empty UUID and make the display unselectable. The result is not guaranteed non-NULL and is used without a `CFStringGetCString` fallback.","fix":"Fall back to `CFStringGetCString` into a stack buffer when `CFStringGetCStringPtr` returns NULL, and use the buffer for the property value.","locations":[{"ref":"plugins/mac-capture/mac-display-capture.m:489","code":"  489 |     obs_data_set_default_string(settings, \"display_uuid\", CFStringGetCStringPtr(uuid_string, kCFStringEncodingUTF8));","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-capture/mac-display-capture.m#L489"},{"ref":"plugins/mac-capture/mac-display-capture.m:622","code":"  622 |         obs_property_list_add_string(list, name_buffer, CFStringGetCStringPtr(uuid_string, kCFStringEncodingUTF8));","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-capture/mac-display-capture.m#L622"},{"ref":"plugins/mac-capture/mac-sck-common.m:117-118","code":"  117 |         obs_property_list_add_string(display_list, name_buffer,\n  118 |                                      CFStringGetCStringPtr(uuid_string, kCFStringEncodingUTF8));","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-capture/mac-sck-common.m#L117-L118"}]},
{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`ToggleSwitch::changeEvent` overrides `QWidget::changeEvent` but never calls the base-class implementation. As a result all base handling for `QEvent::EnabledChange`, `FontChange`, `StyleChange`, `PaletteChange`, etc. (e.g. `QAbstractButton` clearing its pressed state on disable and triggering repaints) is dropped. Only the custom `EnabledChange` styling runs; every other change event is silently ignored.","fix":"Forward to the base class, e.g. add `QAbstractButton::changeEvent(event);` at the end of the method (and handle the `EnabledChange` case in addition to, not instead of, the base call).","locations":[{"ref":"shared/qt/idian/components/ToggleSwitch.cpp:102-108","code":"  102 | void ToggleSwitch::changeEvent(QEvent *event)\n  103 | {\n  104 | \tif (event->type() == QEvent::EnabledChange) {\n  105 | \t\tUtils::toggleClass(\"disabled\", !isEnabled());\n  106 | \t\tupdateBackgroundColor();\n  107 | \t}\n  108 | }","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/qt/idian/components/ToggleSwitch.cpp#L102-L108"}]},
{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"`check_comodo()` calls the Winsock function `gethostbyname()` and then reads the error via `GetLastError()`. Winsock reports errors through `WSAGetLastError()`, not `GetLastError()`; the two are not guaranteed to be the same value, so the intended `WSAHOST_NOT_FOUND` comparison may not match and the COMODO-sandbox diagnostic can be missed. The file even defines `GetSockError()` as `WSAGetLastError()` for exactly this purpose.","fix":"Use the Winsock error accessor: `if (!h && WSAGetLastError() == WSAHOST_NOT_FOUND) {` (or `GetSockError()`).","locations":[{"ref":"shared/happy-eyeballs/happy-eyeballs.c:172-174","code":"  172 | \tHOSTENT *h = gethostbyname(\"localhost\");\n  173 | \tif (!h && GetLastError() == WSAHOST_NOT_FOUND) {\n  174 | \t\tcontext->error = WSAHOST_NOT_FOUND;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/happy-eyeballs/happy-eyeballs.c#L172-L174"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`GetWindowList` (Linux/X11) re-enumerates every top-level window through the X server far more than necessary: `getTopLevelWindows()` is called in the loop condition on every iteration (`i < getTopLevelWindows().size()`), and `GetWindowTitle(i)` internally calls `getTopLevelWindows().at(i)` again - and `GetWindowTitle(i)` is itself invoked twice per window (once in the `if` and once in `emplace_back`). This turns listing N windows into roughly O(N^2) full X round-trip enumerations plus redundant title fetches.","fix":"Call `getTopLevelWindows()` once into a local vector, iterate that, and compute each title once (store the result of `GetWindowTitle` in a local before the emptiness test), e.g. `auto wins = getTopLevelWindows(); for (size_t i=0;i<wins.size();++i){ auto t = GetWindowTitle(i); if(!t.empty()) windows.emplace_back(std::move(t)); }`.","locations":[{"ref":"plugins/frontend-tools/auto-scene-switcher-nix.cpp:84-158","code":"   84 | static std::vector<Window> getTopLevelWindows()\n   85 | {\n   86 | \tstd::vector<Window> res;\n   87 | \n   88 | \tres.resize(0);\n   89 | \n   90 | \tif (!ewmhIsSupported()) {\n   91 | \t\treturn res;\n   92 | \t}\n   93 | \n   94 | \tAtom netClList = XInternAtom(disp(), \"_NET_CLIENT_LIST\", true);\n   95 | \tAtom actualType;\n   96 | \tint format;\n   97 | \tunsigned long num, bytes;\n   98 | \tWindow *data = 0;\n   99 | \n  100 | \tfor (int i = 0; i < ScreenCount(disp()); ++i) {\n  101 | \t\tWindow rootWin = RootWindow(disp(), i);\n  102 | \t\tif (!rootWin) {\n  103 | \t\t\tcontinue;\n  104 | \t\t}\n  105 | \n  106 | \t\tint status = XGetWindowProperty(disp(), rootWin, netClList, 0L, ~0L, false, AnyPropertyType,\n  107 | \t\t\t\t\t\t&actualType, &format, &num, &bytes, (uint8_t **)&data);\n  108 | \n  109 | \t\tif (status != Success) {\n  110 | \t\t\tcontinue;\n  111 | \t\t}\n  112 | \n  113 | \t\tfor (unsigned long i = 0; i < num; ++i) {\n  114 | \t\t\tres.emplace_back(data[i]);\n  115 | \t\t}\n  116 | \n  117 | \t\tXFree(data);\n  118 | \t}\n  119 | \n  120 | \treturn res;\n  121 | }\n  122 | \n  123 | static std::string GetWindowTitle(size_t i)\n  124 | {\n  125 | \tWindow w = getTopLevelWindows().at(i);\n  126 | \tif (!w) {\n  127 | \t\treturn \"\";\n  128 | \t}\n  129 | \tstd::string windowTitle;\n  130 | \tchar *name;\n  131 | \n  132 | \tint status = XFetchName(disp(), w, &name);\n  133 | \tif (status >= Success && name != nullptr) {\n  134 | \t\tstd::string str(name);\n  135 | \t\twindowTitle = str;\n  136 | \t\tXFree(name);\n  137 | \t} else {\n  138 | \t\tXTextProperty xtp_new_name;\n  139 | \t\tif (XGetWMName(disp(), w, &xtp_new_name) != 0 && xtp_new_name.value != nullptr) {\n  140 | \t\t\tstd::string str((const char *)xtp_new_name.value);\n  141 | \t\t\twindowTitle = str;\n  142 | \t\t\tXFree(xtp_new_name.value);\n  143 | \t\t}\n  144 | \t}\n  145 | \n  146 | \treturn windowTitle;\n  147 | }\n  148 | \n  149 | void GetWindowList(vector<string> &windows)\n  150 | {\n  151 | \twindows.resize(0);\n  152 | \n  153 | \tfor (size_t i = 0; i < getTopLevelWindows().size(); ++i) {\n  154 | \t\tif (GetWindowTitle(i) != \"\") {\n  155 | \t\t\twindows.emplace_back(GetWindowTitle(i));\n  156 | \t\t}\n  157 | \t}\n  158 | }","lines":75,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/frontend-tools/auto-scene-switcher-nix.cpp#L84-L158"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"In `AbsoluteSlider::mousePressEvent` and `AbsoluteSlider::mouseMoveEvent`, `posToRangeValue` is\ncalled twice with the same event - once for `setValue` and once for the `emit sliderMoved` call.\n`posToRangeValue` calls `style()->subControlRect(...)` twice internally, making this four style\nqueries per event when two would suffice.","fix":"Cache the result:\n\n```cpp\nvoid AbsoluteSlider::mousePressEvent(QMouseEvent *event)\n{\n    dragging = (event->buttons() & Qt::LeftButton || event->buttons() & Qt::MiddleButton);\n    if (dragging) {\n        int val = posToRangeValue(event);\n        setSliderDown(true);\n        setValue(val);\n        emit AbsoluteSlider::sliderMoved(val);\n    }\n    event->accept();\n}\n```\nApply the same pattern in `mouseMoveEvent`.","locations":[{"ref":"frontend/components/AbsoluteSlider.cpp:23-34","code":"   23 | void AbsoluteSlider::mousePressEvent(QMouseEvent *event)\n   24 | {\n   25 | \tdragging = (event->buttons() & Qt::LeftButton || event->buttons() & Qt::MiddleButton);\n   26 | \n   27 | \tif (dragging) {\n   28 | \t\tsetSliderDown(true);\n   29 | \t\tsetValue(posToRangeValue(event));\n   30 | \t\temit AbsoluteSlider::sliderMoved(posToRangeValue(event));\n   31 | \t}\n   32 | \n   33 | \tevent->accept();\n   34 | }","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/AbsoluteSlider.cpp#L23-L34"},{"ref":"frontend/components/AbsoluteSlider.cpp:43-61","code":"   43 | void AbsoluteSlider::mouseMoveEvent(QMouseEvent *event)\n   44 | {\n   45 | \tint val = posToRangeValue(event);\n   46 | \n   47 | \tif (val > maximum()) {\n   48 | \t\tval = maximum();\n   49 | \t} else if (val < minimum()) {\n   50 | \t\tval = minimum();\n   51 | \t}\n   52 | \n   53 | \temit absoluteSliderHovered(val);\n   54 | \n   55 | \tif (dragging) {\n   56 | \t\tsetValue(posToRangeValue(event));\n   57 | \t\temit AbsoluteSlider::sliderMoved(posToRangeValue(event));\n   58 | \t}\n   59 | \n   60 | \tQSlider::mouseMoveEvent(event);\n   61 | \tevent->accept();","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/AbsoluteSlider.cpp#L43-L61"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`FlowFrame::keyPressEvent` calls `layout->itemAt(i)` up to three times per loop iteration: once to check for a widget, once to get the widget, and inside the condition again. Each call involves a bounds-checked list index. The result should be cached in a local variable.","fix":"Cache the `QLayoutItem*`:\n\n```cpp\nQLayoutItem *layoutItem = layout->itemAt(i);\nQWidget *widget = layoutItem ? layoutItem->widget() : nullptr;\nif (!widget)\n    continue;\n```","locations":[{"ref":"frontend/components/FlowFrame.cpp:37-50","code":"   37 | \tfor (int i = 0; i < layout->count(); ++i) {\n   38 | \t\tif (!layout->itemAt(i)->widget()) {\n   39 | \t\t\tcontinue;\n   40 | \t\t}\n   41 | \n   42 | \t\tauto focusProxy = layout->itemAt(i)->widget()->focusProxy();\n   43 | \t\tif (layout->itemAt(i)->widget() == focused || focusProxy == focused) {\n   44 | \t\t\tif (focusProxy == focused) {\n   45 | \t\t\t\tfocused = layout->itemAt(i)->widget();\n   46 | \t\t\t}\n   47 | \n   48 | \t\t\tindex = i;\n   49 | \t\t\tbreak;\n   50 | \t\t}","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/FlowFrame.cpp#L37-L50"},{"ref":"frontend/components/FlowFrame.cpp:67-113","code":"   67 | \t\tfor (int i = 0; i < layout->count(); ++i) {\n   68 | \t\t\tif (i == index) {\n   69 | \t\t\t\tcontinue;\n   70 | \t\t\t}\n   71 | \n   72 | \t\t\tQWidget *widget = layout->itemAt(i)->widget();\n   73 | \t\t\tconst QRect rect = widget->geometry();\n   74 | \n   75 | \t\t\tbool isCandidate = false;\n   76 | \t\t\tint distance = INT_MAX;\n   77 | \n   78 | \t\t\tswitch (event->key()) {\n   79 | \t\t\tcase Qt::Key_Right:\n   80 | \t\t\t\tif (rect.left() > focusedRect.right()) {\n   81 | \t\t\t\t\tdistance = (rect.left() - focusedRect.right()) +\n   82 | \t\t\t\t\t\t   qAbs(rect.center().y() - focusedRect.center().y());\n   83 | \t\t\t\t\tisCandidate = true;\n   84 | \t\t\t\t}\n   85 | \t\t\t\tbreak;\n   86 | \t\t\tcase Qt::Key_Left:\n   87 | \t\t\t\tif (rect.right() < focusedRect.left()) {\n   88 | \t\t\t\t\tdistance = (focusedRect.left() - rect.right()) +\n   89 | \t\t\t\t\t\t   qAbs(rect.center().y() - focusedRect.center().y());\n   90 | \t\t\t\t\tisCandidate = true;\n   91 | \t\t\t\t}\n   92 | \t\t\t\tbreak;\n   93 | \t\t\tcase Qt::Key_Down:\n   94 | \t\t\t\tif (rect.top() > focusedRect.bottom()) {\n   95 | \t\t\t\t\tdistance = (rect.top() - focusedRect.bottom()) +\n   96 | \t\t\t\t\t\t   qAbs(rect.center().x() - focusedRect.center().x());\n   97 | \t\t\t\t\tisCandidate = true;\n   98 | \t\t\t\t}\n   99 | \t\t\t\tbreak;\n  100 | \t\t\tcase Qt::Key_Up:\n  101 | \t\t\t\tif (rect.bottom() < focusedRect.top()) {\n  102 | \t\t\t\t\tdistance = (focusedRect.top() - rect.bottom()) +\n  103 | \t\t\t\t\t\t   qAbs(rect.center().x() - focusedRect.center().x());\n  104 | \t\t\t\t\tisCandidate = true;\n  105 | \t\t\t\t}\n  106 | \t\t\t\tbreak;\n  107 | \t\t\t}\n  108 | \n  109 | \t\t\tif (isCandidate && distance < bestDistance) {\n  110 | \t\t\t\tbestDistance = distance;\n  111 | \t\t\t\tnextFocus = widget;\n  112 | \t\t\t}\n  113 | \t\t}","lines":47,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/FlowFrame.cpp#L67-L113"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`RunDownloadWorkers` launches the download workers with `async(DownloadWorkerThread)` using the default launch policy (`launch::async | launch::deferred`), unlike `RunHasherWorkers` and `RunUpdateWorkers` which explicitly pass `launch::async`. With a deferred policy the tasks would not run until `.get()` is called, serializing the parallel download logic. It works on MSVC's async default today, but the inconsistency is fragile and defeats the intended concurrency guarantee.","fix":"Match the other worker runners:\n```cpp\nresult = async(launch::async, DownloadWorkerThread);\n```","locations":[{"ref":"frontend/updater/updater.cpp:550-552","code":"  550 | \tfor (future<bool> &result : thread_success_results) {\n  551 | \t\tresult = async(DownloadWorkerThread);\n  552 | \t}","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/updater/updater.cpp#L550-L552"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`pulseaudio-wrapper.c` (`pulseaudio_connect_playback`): the function copies the `name` string into a new heap allocation (`bzalloc` + `memcpy`) solely to pass it to `pa_stream_connect_playback`, which accepts a `const char *` and does not require the caller to keep the buffer alive after the call returns. The copy is immediately freed (`bfree(device)`) right after the call. This heap allocation and copy is unnecessary.","fix":"Pass `name` directly to `pa_stream_connect_playback` without copying:\n```c\nint_fast32_t pulseaudio_connect_playback(pa_stream *s, const char *name,\n                                          const pa_buffer_attr *attr,\n                                          pa_stream_flags_t flags)\n{\n    if (pulseaudio_context_ready() < 0)\n        return -1;\n    pulseaudio_lock();\n    int_fast32_t ret = pa_stream_connect_playback(s, name, attr, flags, NULL, NULL);\n    pulseaudio_unlock();\n    return ret;\n}\n```","locations":[{"ref":"libobs/audio-monitoring/pulse/pulseaudio-wrapper.c:353-368","code":"  353 | int_fast32_t pulseaudio_connect_playback(pa_stream *s, const char *name, const pa_buffer_attr *attr,\n  354 | \t\t\t\t\t pa_stream_flags_t flags)\n  355 | {\n  356 | \tif (pulseaudio_context_ready() < 0)\n  357 | \t\treturn -1;\n  358 | \n  359 | \tsize_t dev_len = strlen(name);\n  360 | \tchar *device = bzalloc(dev_len + 1);\n  361 | \tmemcpy(device, name, dev_len);\n  362 | \n  363 | \tpulseaudio_lock();\n  364 | \tint_fast32_t ret = pa_stream_connect_playback(s, device, attr, flags, NULL, NULL);\n  365 | \tpulseaudio_unlock();\n  366 | \n  367 | \tbfree(device);\n  368 | \treturn ret;","lines":16,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/audio-monitoring/pulse/pulseaudio-wrapper.c#L353-L368"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`effect-parser.c`: the functions `ep_getfunc`, `ep_getstruct`, `ep_getsampler`, `ep_getparam` all perform linear O(n) scans over their respective arrays to find a named item. These are called frequently during parsing and especially during `ep_write_func` dependency resolution. For large shaders with many parameters/functions/structs, this becomes quadratic. A hash map keyed by name would be O(1) per lookup.","fix":"Replace the DARRAY linear-scan lookup pattern with a hash map (e.g., using the existing `util/uthash.h` if available, or a sorted array with binary search as a smaller improvement). This is a medium-complexity refactor but the current `ep_getfunc` / `ep_getstruct` / `ep_getparam` / `ep_getsampler` are the only entry points so the change is self-contained.","locations":[{"ref":"libobs/graphics/effect-parser.c:81-123","code":"   81 | static inline struct ep_func *ep_getfunc(struct effect_parser *ep, const char *name)\n   82 | {\n   83 | \tsize_t i;\n   84 | \tfor (i = 0; i < ep->funcs.num; i++) {\n   85 | \t\tif (strcmp(name, ep->funcs.array[i].name) == 0)\n   86 | \t\t\treturn ep->funcs.array + i;\n   87 | \t}\n   88 | \n   89 | \treturn NULL;\n   90 | }\n   91 | \n   92 | static inline struct ep_struct *ep_getstruct(struct effect_parser *ep, const char *name)\n   93 | {\n   94 | \tsize_t i;\n   95 | \tfor (i = 0; i < ep->structs.num; i++) {\n   96 | \t\tif (strcmp(name, ep->structs.array[i].name) == 0)\n   97 | \t\t\treturn ep->structs.array + i;\n   98 | \t}\n   99 | \n  100 | \treturn NULL;\n  101 | }\n  102 | \n  103 | static inline struct ep_sampler *ep_getsampler(struct effect_parser *ep, const char *name)\n  104 | {\n  105 | \tsize_t i;\n  106 | \tfor (i = 0; i < ep->samplers.num; i++) {\n  107 | \t\tif (strcmp(name, ep->samplers.array[i].name) == 0)\n  108 | \t\t\treturn ep->samplers.array + i;\n  109 | \t}\n  110 | \n  111 | \treturn NULL;\n  112 | }\n  113 | \n  114 | static inline struct ep_param *ep_getparam(struct effect_parser *ep, const char *name)\n  115 | {\n  116 | \tsize_t i;\n  117 | \tfor (i = 0; i < ep->params.num; i++) {\n  118 | \t\tif (strcmp(name, ep->params.array[i].name) == 0)\n  119 | \t\t\treturn ep->params.array + i;\n  120 | \t}\n  121 | \n  122 | \treturn NULL;\n  123 | }","lines":43,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/effect-parser.c#L81-L123"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The `audio_output_active` function (audio-io.c lines 422-435) iterates all `MAX_AUDIO_MIXES` mix slots to check `inputs.num` without holding the `input_mutex`. A concurrent `audio_output_disconnect` could modify `inputs.num` while `audio_output_active` is reading it, causing a data race. All other readers of `mixes[].inputs.num` outside the audio thread hold `input_mutex`.","fix":"Wrap the loop with the mutex:\n```c\nbool audio_output_active(const audio_t *audio)\n{\n    if (!audio)\n        return false;\n    pthread_mutex_lock(&audio->input_mutex);\n    bool active = false;\n    for (size_t mix_idx = 0; mix_idx < MAX_AUDIO_MIXES; mix_idx++) {\n        if (audio->mixes[mix_idx].inputs.num != 0) {\n            active = true;\n            break;\n        }\n    }\n    pthread_mutex_unlock(&audio->input_mutex);\n    return active;\n}\n```\nNote: `input_mutex` is held as `const audio_t *` so a `const_cast` or a non-const overload may be needed depending on the mutex API.","locations":[{"ref":"libobs/media-io/audio-io.c:422-435","code":"  422 | bool audio_output_active(const audio_t *audio)\n  423 | {\n  424 | \tif (!audio)\n  425 | \t\treturn false;\n  426 | \n  427 | \tfor (size_t mix_idx = 0; mix_idx < MAX_AUDIO_MIXES; mix_idx++) {\n  428 | \t\tconst struct audio_mix *mix = &audio->mixes[mix_idx];\n  429 | \n  430 | \t\tif (mix->inputs.num != 0)\n  431 | \t\t\treturn true;\n  432 | \t}\n  433 | \n  434 | \treturn false;\n  435 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/audio-io.c#L422-L435"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`video-scaler-ffmpeg.c::video_scaler_scale` copies scaled image data from\n`scaler->dst_pointers` to the caller's output buffers line-by-line. This\nintermediate buffer (`dst_pointers`, allocated by `av_image_alloc`) exists\nsolely to perform this copy. For the common case where output buffer linesizes\nmatch the FFmpeg-allocated linesizes, a single `memcpy` is used, but for\nmismatched linesizes a line-by-line copy is used. The intermediate buffer\nadds a full extra copy of the scaled frame on every call. A better design would\npass the caller's output pointers directly to `sws_scale` when the linesizes\nare compatible, avoiding the intermediate buffer entirely.","fix":"For the common path where linesizes match, consider using `sws_scale` directly into the caller's output buffer, falling back to the intermediate buffer only when linesizes differ or the caller's buffer is not suitably aligned for FFmpeg.","locations":[{"ref":"libobs/media-io/video-scaler-ffmpeg.c:143-218","code":"  143 | int video_scaler_create(video_scaler_t **scaler_out, const struct video_scale_info *dst,\n  144 | \t\t\tconst struct video_scale_info *src, enum video_scale_type type)\n  145 | {\n  146 | \tenum AVPixelFormat format_src = get_ffmpeg_video_format(src->format);\n  147 | \tenum AVPixelFormat format_dst = get_ffmpeg_video_format(dst->format);\n  148 | \tint scale_type = get_ffmpeg_scale_type(type);\n  149 | \tconst int *coeff_src = get_ffmpeg_coeffs(src->colorspace);\n  150 | \tconst int *coeff_dst = get_ffmpeg_coeffs(dst->colorspace);\n  151 | \tint range_src = get_ffmpeg_range_type(src->range);\n  152 | \tint range_dst = get_ffmpeg_range_type(dst->range);\n  153 | \tstruct video_scaler *scaler;\n  154 | \tint ret;\n  155 | \n  156 | \tif (!scaler_out)\n  157 | \t\treturn VIDEO_SCALER_FAILED;\n  158 | \n  159 | \tif (format_src == AV_PIX_FMT_NONE || format_dst == AV_PIX_FMT_NONE)\n  160 | \t\treturn VIDEO_SCALER_BAD_CONVERSION;\n  161 | \n  162 | \tscaler = bzalloc(sizeof(struct video_scaler));\n  163 | \tscaler->src_height = src->height;\n  164 | \n  165 | \tconst AVPixFmtDescriptor *desc = av_pix_fmt_desc_get(format_dst);\n  166 | \tbool has_plane[4] = {0};\n  167 | \tfor (size_t i = 0; i < 4; i++)\n  168 | \t\thas_plane[desc->comp[i].plane] = 1;\n  169 | \n  170 | \tscaler->dst_heights[0] = dst->height;\n  171 | \tfor (size_t i = 1; i < 4; ++i) {\n  172 | \t\tif (has_plane[i]) {\n  173 | \t\t\tconst int s = (i == 1 || i == 2) ? desc->log2_chroma_h : 0;\n  174 | \t\t\tscaler->dst_heights[i] = dst->height >> s;\n  175 | \t\t}\n  176 | \t}\n  177 | \n  178 | \tret = av_image_alloc(scaler->dst_pointers, scaler->dst_linesizes, dst->width, dst->height, format_dst, 32);\n  179 | \tif (ret < 0) {\n  180 | \t\tblog(LOG_WARNING, \"video_scaler_create: av_image_alloc failed: %d\", ret);\n  181 | \t\tgoto fail;\n  182 | \t}\n  183 | \n  184 | \tscaler->swscale = sws_alloc_context();\n  185 | \tif (!scaler->swscale) {\n  186 | \t\tblog(LOG_ERROR, \"video_scaler_create: Could not create \"\n  187 | \t\t\t\t\"swscale\");\n  188 | \t\tgoto fail;\n  189 | \t}\n  190 | \n  191 | \tav_opt_set_int(scaler->swscale, \"sws_flags\", scale_type, 0);\n  192 | \tav_opt_set_int(scaler->swscale, \"srcw\", src->width, 0);\n  193 | \tav_opt_set_int(scaler->swscale, \"srch\", src->height, 0);\n  194 | \tav_opt_set_int(scaler->swscale, \"dstw\", dst->width, 0);\n  195 | \tav_opt_set_int(scaler->swscale, \"dsth\", dst->height, 0);\n  196 | \tav_opt_set_int(scaler->swscale, \"src_format\", format_src, 0);\n  197 | \tav_opt_set_int(scaler->swscale, \"dst_format\", format_dst, 0);\n  198 | \tav_opt_set_int(scaler->swscale, \"src_range\", range_src, 0);\n  199 | \tav_opt_set_int(scaler->swscale, \"dst_range\", range_dst, 0);\n  200 | \tif (sws_init_context(scaler->swscale, NULL, NULL) < 0) {\n  201 | \t\tblog(LOG_ERROR, \"video_scaler_create: sws_init_context failed\");\n  202 | \t\tgoto fail;\n  203 | \t}\n  204 | \n  205 | \tret = sws_setColorspaceDetails(scaler->swscale, coeff_src, range_src, coeff_dst, range_dst, 0, FIXED_1_0,\n  206 | \t\t\t\t       FIXED_1_0);\n  207 | \tif (ret < 0) {\n  208 | \t\tblog(LOG_DEBUG, \"video_scaler_create: \"\n  209 | \t\t\t\t\"sws_setColorspaceDetails failed, ignoring\");\n  210 | \t}\n  211 | \n  212 | \t*scaler_out = scaler;\n  213 | \treturn VIDEO_SCALER_SUCCESS;\n  214 | \n  215 | fail:\n  216 | \tvideo_scaler_destroy(scaler);\n  217 | \treturn VIDEO_SCALER_FAILED;\n  218 | }","lines":76,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-scaler-ffmpeg.c#L143-L218"},{"ref":"libobs/media-io/video-scaler-ffmpeg.c:232-270","code":"  232 | bool video_scaler_scale(video_scaler_t *scaler, uint8_t *output[], const uint32_t out_linesize[],\n  233 | \t\t\tconst uint8_t *const input[], const uint32_t in_linesize[])\n  234 | {\n  235 | \tif (!scaler)\n  236 | \t\treturn false;\n  237 | \n  238 | \tint ret = sws_scale(scaler->swscale, input, (const int *)in_linesize, 0, scaler->src_height,\n  239 | \t\t\t    scaler->dst_pointers, scaler->dst_linesizes);\n  240 | \tif (ret <= 0) {\n  241 | \t\tblog(LOG_ERROR, \"video_scaler_scale: sws_scale failed: %d\", ret);\n  242 | \t\treturn false;\n  243 | \t}\n  244 | \n  245 | \tfor (size_t plane = 0; plane < 4; ++plane) {\n  246 | \t\tif (!scaler->dst_pointers[plane])\n  247 | \t\t\tcontinue;\n  248 | \n  249 | \t\tconst size_t scaled_linesize = scaler->dst_linesizes[plane];\n  250 | \t\tconst size_t plane_linesize = out_linesize[plane];\n  251 | \t\tuint8_t *dst = output[plane];\n  252 | \t\tconst uint8_t *src = scaler->dst_pointers[plane];\n  253 | \t\tconst size_t height = scaler->dst_heights[plane];\n  254 | \t\tif (scaled_linesize == plane_linesize) {\n  255 | \t\t\tmemcpy(dst, src, scaled_linesize * height);\n  256 | \t\t} else {\n  257 | \t\t\tsize_t linesize = scaled_linesize;\n  258 | \t\t\tif (linesize > plane_linesize)\n  259 | \t\t\t\tlinesize = plane_linesize;\n  260 | \n  261 | \t\t\tfor (size_t y = 0; y < height; y++) {\n  262 | \t\t\t\tmemcpy(dst, src, linesize);\n  263 | \t\t\t\tdst += plane_linesize;\n  264 | \t\t\t\tsrc += scaled_linesize;\n  265 | \t\t\t}\n  266 | \t\t}\n  267 | \t}\n  268 | \n  269 | \treturn true;\n  270 | }","lines":39,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/media-io/video-scaler-ffmpeg.c#L232-L270"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The custom `HASH_FUNCTION` used for the hotkey ID hash tables reads only the first byte of the key (`*s % UINT_MAX`, which for a `uint8_t` input is just `*s`). Hotkey IDs are sequential `size_t` values (0, 1, 2, ...). On little-endian platforms the first byte of id N is `N & 0xFF`, so all IDs that share the same low byte land in the same bucket. After 256 hotkeys are registered every new registration hits a bucket that already has at least one entry, and after 512 hotkeys each bucket has at least two. For typical usage (tens of hotkeys) this is harmless, but the hash provides no distribution above id 255.","fix":"Use the full value of the id for the hash. Because ids fit in `size_t`, a simple multiplicative hash works well and requires no dependencies:\n```c\n#define HASH_FUNCTION(s, len, hashv) \\\n    (hashv) = (unsigned)(*(const size_t *)(s) * 2654435761UL)\n```\nOr simply remove the override entirely and let uthash choose its own function.","locations":[{"ref":"libobs/obs-hotkey.c:25-26","code":"   25 | #undef HASH_FUNCTION\n   26 | #define HASH_FUNCTION(s, len, hashv) (hashv) = *s % UINT_MAX","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-hotkey.c#L25-L26"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`load_1d_lut` allocates `4 * width * width * width * sizeof(struct half)` bytes (a full 3D-cube-sized buffer) but only ever fills and uses `4 * width` half-values (the fill loop runs `index < width` and the texture is created as `gs_texture_create(width, 1, ...)`). This is a copy-paste from `load_3d_lut` and wastes large amounts of memory (e.g. ~2 MB allocated for a 64-entry 1D LUT that needs ~512 bytes).","fix":"Allocate only what a 1D LUT needs: `const uint32_t data_size = 4 * width * sizeof(struct half);`.","locations":[{"ref":"plugins/obs-filters/color-grade-filter.c:113-116","code":"  113 | static void *load_1d_lut(FILE *const file, const uint32_t width, float red, float green, float blue)\n  114 | {\n  115 | \tconst uint32_t data_size = 4 * width * width * width * sizeof(struct half);\n  116 | \tstruct half *values = bmalloc(data_size);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-filters/color-grade-filter.c#L113-L116"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `noise_suppress_filter_audio`, `out_size` is a byte count (`info.frames * sizeof(float)`), but it is used both as the element count for `da_resize` on `output_data` (a `DARRAY(float)`) and as a per-channel float offset (`&ng->output_data.array[i * out_size]`). This mixes bytes and float-element counts, so the buffer is allocated 4x larger than needed and each channel is placed at a 4x-too-large stride. It is memory-safe (the over-allocation guarantees the writes of `out_size` bytes fit), but it wastes 4x the memory and is misleading.","fix":"Size/index in float elements, e.g. use `size_t out_floats = info.frames;` then `da_resize(ng->output_data, out_floats * ng->channels);` and `ng->output_audio.data[i] = (uint8_t *)&ng->output_data.array[i * out_floats];` (keeping the `deque_pop_front(..., out_size)` byte count unchanged).","locations":[{"ref":"plugins/obs-filters/noise-suppress-filter.c:458-463","code":"  458 | \tda_resize(ng->output_data, out_size * ng->channels);\n  459 | \n  460 | \tfor (size_t i = 0; i < ng->channels; i++) {\n  461 | \t\tng->output_audio.data[i] = (uint8_t *)&ng->output_data.array[i * out_size];\n  462 | \n  463 | \t\tdeque_pop_front(&ng->output_buffers[i], ng->output_audio.data[i], out_size);","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-filters/noise-suppress-filter.c#L458-L463"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `MetalVertexBuffer.setupBuffers`, `unpackedColors.reserveCapacity(4)` reserves capacity for only 4 elements before appending `numVertices` colors in the loop, causing repeated reallocations for any mesh with more than 4 vertices. The reservation should match the number of vertices being appended.","fix":"Reserve the actual count: `unpackedColors.reserveCapacity(numVertices)`.","locations":[{"ref":"libobs-metal/MetalBuffer.swift:158-159","code":"  158 |             var unpackedColors = [SIMD4<Float>]()\n  159 |             unpackedColors.reserveCapacity(4)","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/MetalBuffer.swift#L158-L159"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In the Linux `nvenc_device_available`, `get_id_from_sys(dirent->d_name, \"class\")` is invoked twice in the same condition, performing two sysfs file reads (each doing an allocation and file open) for every PCI device when the first class does not match `0x030000`.","fix":"Read the class id once into a local variable and compare it against both `0x030000` and `0x030200`.","locations":[{"ref":"plugins/obs-ffmpeg/obs-ffmpeg.c:214-215","code":"  214 | \t\tif (get_id_from_sys(dirent->d_name, \"class\") != 0x030000 &&\n  215 | \t\t    get_id_from_sys(dirent->d_name, \"class\") != 0x030200) { // 0x030000 = VGA compatible controller","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/obs-ffmpeg.c#L214-L215"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"very_easy","description":"In `unregister_hotkey`, after `release_registerer(hotkey)` is called at line 860 (which handles `OBS_HOTKEY_REGISTERER_SOURCE` and sets `hotkey->registerer = NULL`), the code at lines 862-863 checks the registerer type again and calls `obs_weak_source_release(hotkey->registerer)` a second time. By that point `hotkey->registerer` is always NULL, so the second release is a no-op. The block is dead code that misleadingly implies a second ownership drop is needed.","fix":"Remove the redundant dead block:\n```c\n/* before */\nrelease_registerer(hotkey);\n\nif (hotkey->registerer_type == OBS_HOTKEY_REGISTERER_SOURCE)\n    obs_weak_source_release(hotkey->registerer);\n\n/* after */\nrelease_registerer(hotkey);\n```","locations":[{"ref":"libobs/obs-hotkey.c:860-863","code":"  860 | \trelease_registerer(hotkey);\n  861 | \n  862 | \tif (hotkey->registerer_type == OBS_HOTKEY_REGISTERER_SOURCE)\n  863 | \t\tobs_weak_source_release(hotkey->registerer);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-hotkey.c#L860-L863"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`build-aux/format-manifest.py` imports `glob` (line 2) and `Any` from `typing` (line 7), but\nneither is used anywhere in the file. The `manifest_path` variable on line 38 is computed but\nalso never used.","fix":"Remove the unused imports and variable:\n\n```python\nimport argparse\nimport json\nimport logging\nimport os\nimport sys\n```\n\nRemove line 38 (`manifest_path = os.path.dirname(manifest_file)`).","locations":[{"ref":"build-aux/format-manifest.py:2","code":"    2 | import glob","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/build-aux/format-manifest.py#L2"},{"ref":"build-aux/format-manifest.py:7","code":"    7 | from typing import Any","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/build-aux/format-manifest.py#L7"},{"ref":"build-aux/format-manifest.py:38","code":"   38 |             manifest_path = os.path.dirname(manifest_file)","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/build-aux/format-manifest.py#L38"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`SceneTree::eventFilter` (lines 60-63) overrides `QObject::eventFilter` but always delegates to the base class without doing any filtering. The widget installs itself as its own event filter in the constructor (`installEventFilter(this)`) so this override adds overhead on every event but does nothing. It can be removed entirely.","fix":"Remove the override and the `installEventFilter(this)` call from the constructor. If no event filtering is needed, there is no reason to register or override it.","locations":[{"ref":"frontend/components/SceneTree.cpp:60-63","code":"   60 | bool SceneTree::eventFilter(QObject *obj, QEvent *event)\n   61 | {\n   62 | \treturn QObject::eventFilter(obj, event);\n   63 | }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/SceneTree.cpp#L60-L63"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In the XSplit `type == 7` (game capture) branch, `QString name = o_attr.namedItem(\"wndname\").nodeValue();` reads the window name and then it is immediately overwritten by `QString res = name = \"::\" + exec;`, so the `wndname` value is never used. The chained assignment is confusing and the fetched window name is dead. Either `wndname` was intended to be part of the `window` setting (bug) or the read is pointless.","fix":"If the window name is unused, drop line 335 and write `QString res = \"::\" + exec;`. If it was intended to form the window string, use it, e.g. `QString res = name + \"::\" + exec;`.","locations":[{"ref":"frontend/importers/xsplit.cpp:335-338","code":"  335 | \t\t\tQString name = o_attr.namedItem(\"wndname\").nodeValue();\n  336 | \t\t\tQString exec = o_attr.namedItem(\"imagename\").nodeValue();\n  337 | \n  338 | \t\t\tQString res = name = \"::\" + exec;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/importers/xsplit.cpp#L335-L338"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `ThumbnailItem::update`, a default-constructed local `QPixmap pixmap;` is assigned to `this->pixmap` only when `this->pixmap.isNull()` - i.e. it copies a null pixmap onto an already-null pixmap. This is a pure no-op and is confusing dead code; it also shadows the intent of the surrounding logic.","fix":"Remove the block:\n```cpp\nQPixmap pixmap;\nif (this->pixmap.isNull()) {\n    this->pixmap = pixmap;\n}\n```","locations":[{"ref":"frontend/utility/ThumbnailItem.cpp:175-178","code":"  175 | \tQPixmap pixmap;\n  176 | \tif (this->pixmap.isNull()) {\n  177 | \t\tthis->pixmap = pixmap;\n  178 | \t}","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/utility/ThumbnailItem.cpp#L175-L178"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `device_duplicator_get_monitor_index`, the `else if (hr == DXGI_ERROR_NOT_FOUND)` branch is unreachable: `DXGI_ERROR_NOT_FOUND` is already handled by the `break` at line 159, so by the time control reaches line 177 `hr` can never be `DXGI_ERROR_NOT_FOUND`. The branch was evidently intended to log `EnumOutputs` failures other than `NOT_FOUND`, but because the condition is wrong those genuine failures are silently swallowed (the code just does `++output` and loops) and the diagnostic message never fires.","fix":"Replace the dead condition with a plain `else` so real failures are logged:\n```cpp\n} else {\n\tblog(LOG_ERROR,\n\t     \"device_duplicator_get_monitor_index: \"\n\t     \"Failed to get output (%08lX)\",\n\t     hr);\n}\n```","locations":[{"ref":"libobs-d3d11/d3d11-duplicator.cpp:177-182","code":"  177 | \t\t} else if (hr == DXGI_ERROR_NOT_FOUND) {\n  178 | \t\t\tblog(LOG_ERROR,\n  179 | \t\t\t     \"device_duplicator_get_monitor_index: \"\n  180 | \t\t\t     \"Failed to get output (%08lX)\",\n  181 | \t\t\t     hr);\n  182 | \t\t}","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-d3d11/d3d11-duplicator.cpp#L177-L182"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"The `info` parameter of `wic_image_init` (Windows-only) is declared but never referenced inside\nthe function body. The caller passes `&image` after calling `ffmpeg_image_free(&image)`, but\n`wic_image_init` only uses `file`, `format`, `cx_out`, `cy_out`, and `space`. The dead parameter\nis misleading and leaves a pointer to a partially-freed struct in the interface.","fix":"Remove the `info` parameter from `wic_image_init` and update the call site to omit `&image`.","locations":[{"ref":"libobs/graphics/graphics-ffmpeg.c:702-703","code":"  702 | static void *wic_image_init(const struct ffmpeg_image *info, const char *file, enum gs_color_format *format,\n  703 | \t\t\t    uint32_t *cx_out, uint32_t *cy_out, enum gs_color_space *space)","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics-ffmpeg.c#L702-L703"},{"ref":"libobs/graphics/graphics-ffmpeg.c:781-782","code":"  781 | \tif (data == NULL) {\n  782 | \t\tdata = wic_image_init(&image, file, format, cx_out, cy_out, space);","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics-ffmpeg.c#L781-L782"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`input.h` declares `input_getbuttonstate` and the `input_t` type but has a `TODO` comment indicating the subsystem is incomplete and may not be necessary. The struct `input_subsystem` has no definition anywhere in the codebase, making the declared function unusable. This is dead/incomplete code that should either be implemented or removed.","fix":"Remove the file and its CMakeLists.txt entry, or implement the input subsystem. The `TODO` comment has been there since at least the initial import with no progress.","locations":[{"ref":"libobs/graphics/input.h:20-33","code":"   20 | /* TODO: incomplete/may not be necessary */\n   21 | \n   22 | #ifdef __cplusplus\n   23 | extern \"C\" {\n   24 | #endif\n   25 | \n   26 | /* wrapped opaque data types */\n   27 | struct input_subsystem;\n   28 | typedef struct input_subsystem input_t;\n   29 | \n   30 | EXPORT int input_getbuttonstate(input_t *input, uint32_t button);\n   31 | \n   32 | #ifdef __cplusplus\n   33 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/input.h#L20-L33"}]},
