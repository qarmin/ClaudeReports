{"id":"LOGIC_151","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`scroll_filter_tick` only wraps/clamps the positive overflow of `filter->offset` (`if (filter->offset.x > 1.0f) filter->offset.x -= 1.0f;`) but never handles negative underflow. With a negative `speed_x`/`speed_y` (scrolling left/up, a common case) and `loop` enabled, `offset` decreases without bound and is never brought back into `[0,1)`. Over a long-running source the magnitude grows large enough that float32 precision degrades noticeably, producing visible jitter in the scrolled texture.","fix":"Also wrap the negative side for the loop case, e.g. add `if (filter->offset.x < 0.0f) filter->offset.x += 1.0f;` (and the `.y` equivalent), and for the non-loop case clamp at `0.0f` as well.","locations":[{"ref":"plugins/obs-filters/scroll-filter.c:157-167","code":"  157 | \tif (filter->loop) {\n  158 | \t\tif (filter->offset.x > 1.0f)\n  159 | \t\t\tfilter->offset.x -= 1.0f;\n  160 | \t\tif (filter->offset.y > 1.0f)\n  161 | \t\t\tfilter->offset.y -= 1.0f;\n  162 | \t} else {\n  163 | \t\tif (filter->offset.x > 1.0f)\n  164 | \t\t\tfilter->offset.x = 1.0f;\n  165 | \t\tif (filter->offset.y > 1.0f)\n  166 | \t\t\tfilter->offset.y = 1.0f;\n  167 | \t}","lines":11,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-filters/scroll-filter.c#L157-L167"}]},
{"id":"LOGIC_152","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`nvenc_defaults_base` sets the default `rate_control` to the lowercase string `\"cbr\"`, but the property list values and the comparisons elsewhere use uppercase (`\"CBR\"`, `\"CQP\"`, `\"VBR\"`, `\"CQVBR\"`). The compat encoder in `nvenc-compat.c:110` uses `\"CBR\"`. Because `nvenc.c:486` does a case-sensitive `strcmp(enc->props.rate_control, \"CBR\")` to enable the H.264 `outputBufferingPeriodSEI`, the default lowercase `\"cbr\"` never matches, so the buffering-period SEI is silently skipped for the default configuration (the CBR rate-control mode itself still works via the `!vbr` fallback at `nvenc.c:373`). The default should match the list value.","fix":"```c\nobs_data_set_default_string(settings, \"rate_control\", \"CBR\");\n```","locations":[{"ref":"plugins/obs-nvenc/nvenc-properties.c:49","code":"   49 | \tobs_data_set_default_string(settings, \"rate_control\", \"cbr\");","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-nvenc/nvenc-properties.c#L49"}]},
{"id":"LOGIC_153","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`createChannelBuffers` allocates the per-channel `inputs[channel]` buffers with `bmalloc` (uninitialized). In `process`, for any channel index `d` where `audio->data[d]` is null (fewer real channels than the plugin's input count), `channelrefs[d]` is set to `inputs[d]`, which is never silenced/initialized. Uninitialized (possibly NaN/denormal) samples are then fed to `processReplacing`, which for many plugins mixes all input channels and can corrupt the output. Only `outputs` are silenced each pass, not `inputs`.","fix":"Zero the `inputs` buffers (use `bzalloc` at allocation, or `silenceChannel(inputs, numChannels, BLOCK_SIZE)` alongside the outputs silence in each pass) so absent channels feed silence rather than garbage.","locations":[{"ref":"plugins/obs-vst/VSTPlugin.cpp:99-105","code":"   99 | \t\tinputs = (float **)bmalloc(sizeof(float *) * numChannels);\n  100 | \t\toutputs = (float **)bmalloc(sizeof(float *) * numChannels);\n  101 | \t\tchannelrefs = (float **)bmalloc(sizeof(float *) * numChannels);\n  102 | \t\tfor (size_t channel = 0; channel < numChannels; channel++) {\n  103 | \t\t\tinputs[channel] = (float *)bmalloc(sizeof(float) * blocksize);\n  104 | \t\t\toutputs[channel] = (float *)bmalloc(sizeof(float) * blocksize);\n  105 | \t\t}","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-vst/VSTPlugin.cpp#L99-L105"},{"ref":"plugins/obs-vst/VSTPlugin.cpp:244-250","code":"  244 | \t\t\tfor (size_t d = 0; d < numChannels; d++) {\n  245 | \t\t\t\tif (d < MAX_AV_PLANES && audio->data[d] != nullptr) {\n  246 | \t\t\t\t\tchannelrefs[d] = ((float *)audio->data[d]) + (pass * BLOCK_SIZE);\n  247 | \t\t\t\t} else {\n  248 | \t\t\t\t\tchannelrefs[d] = inputs[d];\n  249 | \t\t\t\t}\n  250 | \t\t\t};","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-vst/VSTPlugin.cpp#L244-L250"}]},
{"id":"LOGIC_154","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `ParseLinkHeader`, `extractUrl`/`extractValue` compute `head = input.find(\"<\") + 1` (and `find(\"\\\"\") + 1`). When the character is absent, `find` returns `std::string::npos`, so `head` becomes `npos + 1 == 0`; the subsequent guard `if (head == std::string::npos ...)` can therefore never be true for the head branch, making the intended not-found check dead. It happens to not crash today only because callers guarantee `<` is present and the `tail == npos` check catches the missing-quote case, but the head guard is silently ineffective.","fix":"Check the raw find results before adding 1, e.g. `auto lt = input.find(\"<\"); if (lt == std::string::npos) return \"\"; auto head = lt + 1; auto tail = input.find(\">\"); if (tail == std::string::npos) return \"\"; return input.substr(head, tail - head);` (and analogously for `extractValue`).","locations":[{"ref":"plugins/obs-webrtc/whip-output.cpp:346-364","code":"  346 | \tauto extractUrl = [](std::string input) -> std::string {\n  347 | \t\tauto head = input.find(\"<\") + 1;\n  348 | \t\tauto tail = input.find(\">\");\n  349 | \n  350 | \t\tif (head == std::string::npos || tail == std::string::npos) {\n  351 | \t\t\treturn \"\";\n  352 | \t\t}\n  353 | \t\treturn input.substr(head, tail - head);\n  354 | \t};\n  355 | \n  356 | \tauto extractValue = [](std::string input) -> std::string {\n  357 | \t\tauto head = input.find(\"\\\"\") + 1;\n  358 | \t\tauto tail = input.find_last_of(\"\\\"\");\n  359 | \n  360 | \t\tif (head == std::string::npos || tail == std::string::npos) {\n  361 | \t\t\treturn \"\";\n  362 | \t\t}\n  363 | \t\treturn input.substr(head, tail - head);\n  364 | \t};","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-webrtc/whip-output.cpp#L346-L364"}]},
{"id":"LOGIC_155","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `dc_capture_init` the compatibility path calls `CreateDIBSection(capture->hdc, &bi, ...)`, but `capture->hdc` is still `NULL` at that point (it is only assigned on the following line from the local `hdc`). It happens to work because `DIB_RGB_COLORS` ignores the DC argument, but the intent was clearly to pass the just-created local `hdc`; a future change to `DIB_PAL_COLORS` or reliance on the DC would silently break.","fix":"Pass the local handle: `CreateDIBSection(hdc, &bi, DIB_RGB_COLORS, (void **)&capture->bits, NULL, 0);`","locations":[{"ref":"plugins/win-capture/dc-capture.c:68-75","code":"   68 | \t\tconst HDC hdc = CreateCompatibleDC(NULL);\n   69 | \t\tif (hdc) {\n   70 | \t\t\tconst HBITMAP bmp =\n   71 | \t\t\t\tCreateDIBSection(capture->hdc, &bi, DIB_RGB_COLORS, (void **)&capture->bits, NULL, 0);\n   72 | \t\t\tif (bmp) {\n   73 | \t\t\t\tcapture->hdc = hdc;\n   74 | \t\t\t\tcapture->bmp = bmp;\n   75 | \t\t\t\tcapture->old_bmp = SelectObject(capture->hdc, capture->bmp);","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/dc-capture.c#L68-L75"}]},
{"id":"LOGIC_156","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `DllMain`'s `DLL_PROCESS_ATTACH`, `cur_thread` is declared uninitialized and filled by `DuplicateHandle`. If `DuplicateHandle` fails, the code only logs via `DbgOut` and then proceeds to use `cur_thread` (passed to `CreateThread`, later `WaitForSingleObject`/`CloseHandle` in `wait_for_dll_main_finish`) with an indeterminate handle value. Additionally, if any of `init_signals`/`init_system_path`/`init_hook_info`/`init_mutexes` returns `false`, the function returns without closing the already-duplicated `cur_thread`, leaking the handle.","fix":"Initialize `HANDLE cur_thread = NULL;`, bail out (or skip thread creation) when `DuplicateHandle` fails, and `CloseHandle(cur_thread)` on the early `return false` paths before the `CreateThread` call.","locations":[{"ref":"plugins/win-capture/graphics-hook/graphics-hook.c:840-870","code":"  840 | \t\tHANDLE cur_thread;\n  841 | \t\tbool success = DuplicateHandle(GetCurrentProcess(), GetCurrentThread(), GetCurrentProcess(),\n  842 | \t\t\t\t\t       &cur_thread, SYNCHRONIZE, false, 0);\n  843 | \n  844 | \t\tif (!success)\n  845 | \t\t\tDbgOut(\"[OBS] Failed to get current thread handle\");\n  846 | \n  847 | \t\tif (!init_signals()) {\n  848 | \t\t\treturn false;\n  849 | \t\t}\n  850 | \t\tif (!init_system_path()) {\n  851 | \t\t\treturn false;\n  852 | \t\t}\n  853 | \t\tif (!init_hook_info()) {\n  854 | \t\t\treturn false;\n  855 | \t\t}\n  856 | \t\tif (!init_mutexes()) {\n  857 | \t\t\treturn false;\n  858 | \t\t}\n  859 | \n  860 | \t\t/* this prevents the library from being automatically unloaded\n  861 | \t\t * by the next FreeLibrary call */\n  862 | \t\tGetModuleFileNameW(hinst, name, MAX_PATH);\n  863 | \t\tLoadLibraryW(name);\n  864 | \n  865 | \t\tcapture_thread =\n  866 | \t\t\tCreateThread(NULL, 0, (LPTHREAD_START_ROUTINE)main_capture_thread, (LPVOID)cur_thread, 0, 0);\n  867 | \t\tif (!capture_thread) {\n  868 | \t\t\tCloseHandle(cur_thread);\n  869 | \t\t\treturn false;\n  870 | \t\t}","lines":31,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/graphics-hook/graphics-hook.c#L840-L870"}]},
{"id":"LOGIC_157","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`GetDeviceName` and `GetWASAPIAudioDevices_` size the output `std::string` as `os_wcs_to_utf8(...) + 1` and then `resize(size)`. `os_wcs_to_utf8` returns the byte count excluding the terminating NUL and writes the NUL at index `size-1`, so the resulting `std::string` has length `count + 1` with an embedded trailing `\\0`. This makes `device_name.size()`/`info.id.size()` one larger than the real text and appends a NUL byte to the stored device name/id, which can break equality comparisons and display of these strings.","fix":"Resize to the exact content length, e.g.:\n```cpp\nsize_t size = os_wcs_to_utf8(nameVar.pwszVal, len, nullptr, 0);\ndevice_name.resize(size);\nos_wcs_to_utf8(nameVar.pwszVal, len, &device_name[0], size + 1);\n```\n(and the analogous change for `info.id`), or call `device_name.resize(size)` after writing to strip the trailing NUL.","locations":[{"ref":"plugins/win-wasapi/enum-wasapi.cpp:27-29","code":"   27 | \t\t\tsize = os_wcs_to_utf8(nameVar.pwszVal, len, nullptr, 0) + 1;\n   28 | \t\t\tdevice_name.resize(size);\n   29 | \t\t\tos_wcs_to_utf8(nameVar.pwszVal, len, &device_name[0], size);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-wasapi/enum-wasapi.cpp#L27-L29"},{"ref":"plugins/win-wasapi/enum-wasapi.cpp:79-81","code":"   79 | \t\tsize = os_wcs_to_utf8(w_id, len, nullptr, 0) + 1;\n   80 | \t\tinfo.id.resize(size);\n   81 | \t\tos_wcs_to_utf8(w_id, len, &info.id[0], size);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-wasapi/enum-wasapi.cpp#L79-L81"}]},
{"id":"LOGIC_158","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `import_python`, `struct dstr lib_path;` (line 44) is declared uninitialized and is only initialized by `dstr_init_copy(&lib_path, python_path)` at line 58. If `python_version` is NULL, the code `goto fail` at line 55 before `lib_path` is initialized, and the `fail:` label unconditionally calls `dstr_free(&lib_path)` (line 207), which does `bfree(dstr->array)` on an uninitialized (garbage) pointer - undefined behavior / likely crash.","fix":"Initialize `lib_path` at declaration: change `struct dstr lib_path;` to `struct dstr lib_path = {0};` so `dstr_free` is safe on all `fail` paths.","locations":[{"ref":"shared/obs-scripting/obs-scripting-python-import.c:44-56","code":"   44 | bool import_python(const char *python_path, python_version_t *python_version)\n   45 | {\n   46 | \tstruct dstr lib_path;\n   47 | \tbool success = false;\n   48 | \tvoid *lib = NULL;\n   49 | \n   50 | \tif (!python_path)\n   51 | \t\tpython_path = \"\";\n   52 | \n   53 | \tif (!python_version) {\n   54 | \t\tblog(LOG_DEBUG, \"[Python] Invalid python_version pointer provided.\");\n   55 | \t\tgoto fail;\n   56 | \t}","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/obs-scripting/obs-scripting-python-import.c#L44-L56"},{"ref":"shared/obs-scripting/obs-scripting-python-import.c:203-209","code":"  203 | fail:\n  204 | \tif (!success && lib)\n  205 | \t\tos_dlclose(lib);\n  206 | \n  207 | \tdstr_free(&lib_path);\n  208 | \n  209 | \treturn success;","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/obs-scripting/obs-scripting-python-import.c#L203-L209"}]},
{"id":"LOGIC_159","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SetScrollPos` divides by `old_hend` and `old_vend` (`h * hend / old_hend`) with no zero check. These come from `GetScrollPos`, which computes `maximum() + pageStep()`; for an as-yet-unpopulated/empty scroll area this can be `0`, yielding integer division by zero (SIGFPE). There is no guard, unlike typical defensive code that skips restoration when the previous range was empty.","fix":"Guard each division, e.g. `if (scroll && old_hend) scroll->setValue(h * hend / old_hend);` and likewise for the vertical bar.","locations":[{"ref":"shared/properties-view/properties-view.cpp:168-181","code":"  168 | void OBSPropertiesView::SetScrollPos(int h, int v, int old_hend, int old_vend)\n  169 | {\n  170 | \tQScrollBar *scroll = horizontalScrollBar();\n  171 | \tif (scroll) {\n  172 | \t\tint hend = scroll->maximum() + scroll->pageStep();\n  173 | \t\tscroll->setValue(h * hend / old_hend);\n  174 | \t}\n  175 | \n  176 | \tscroll = verticalScrollBar();\n  177 | \tif (scroll) {\n  178 | \t\tint vend = scroll->maximum() + scroll->pageStep();\n  179 | \t\tscroll->setValue(v * vend / old_vend);\n  180 | \t}\n  181 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/properties-view/properties-view.cpp#L168-L181"}]},
{"id":"LOGIC_160","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"`findButtonForUuid` iterates with `i <= existingFlowLayout->count()`, which reads one index past the end (`itemAt(count)`). It is benign only because `QLayout::itemAt` returns `nullptr` for out-of-range indices and that is null-checked, but the loop bound is an off-by-one.","fix":"```cpp\nfor (int i = 0; i < existingFlowLayout->count(); ++i) {\n```","locations":[{"ref":"frontend/dialogs/OBSBasicSourceSelect.cpp:715","code":"  715 | \tfor (int i = 0; i <= existingFlowLayout->count(); ++i) {","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/dialogs/OBSBasicSourceSelect.cpp#L715"}]},
{"id":"LOGIC_161","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In `LogStringChunk`, the inner `char *nextLine = strchr(str, '\\n');` shadows the outer `char *nextLine = str;`. As a result the loop condition `while (*nextLine)` always tests the ORIGINAL first character (never updated), so the loop is effectively `while (true)` and relies entirely on the inner `break` for termination. It happens to be functionally correct, but the outer variable and its condition are misleading/dead and would be flagged by `-Wshadow`.","fix":"Remove the shadowing declaration inside the loop and update the outer variable, e.g. `nextLine = strchr(str, '\\n');` (no inner `char *`), so the `while (*nextLine)` condition reflects real progress.","locations":[{"ref":"frontend/obs-main.cpp:123-144","code":"  123 | \tchar *nextLine = str;\n  124 | \tstring timeString = CurrentTimeString();\n  125 | \ttimeString += \": \";\n  126 | \n  127 | \twhile (*nextLine) {\n  128 | \t\tchar *nextLine = strchr(str, '\\n');\n  129 | \t\tif (!nextLine) {\n  130 | \t\t\tbreak;\n  131 | \t\t}\n  132 | \n  133 | \t\tif (nextLine != str && nextLine[-1] == '\\r') {\n  134 | \t\t\tnextLine[-1] = 0;\n  135 | \t\t} else {\n  136 | \t\t\tnextLine[0] = 0;\n  137 | \t\t}\n  138 | \n  139 | \t\tLogString(logFile, timeString.c_str(), str, log_level);\n  140 | \t\tnextLine++;\n  141 | \t\tstr = nextLine;\n  142 | \t}\n  143 | \n  144 | \tLogString(logFile, timeString.c_str(), str, log_level);","lines":22,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/obs-main.cpp#L123-L144"}]},
{"id":"LOGIC_162","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`obs_missing_files_destroy` does not check its `files` argument for NULL before dereferencing it. Every other function in the same file that receives an `obs_missing_files_t *` (e.g. `obs_missing_files_count`, `obs_missing_files_add_file`) also lacks a null guard, but `obs_missing_files_destroy` is the most dangerous because it is the cleanup path.","fix":"Add a null guard at the top of the function:\n```c\nvoid obs_missing_files_destroy(obs_missing_files_t *files)\n{\n    if (!files)\n        return;\n    ...\n}\n```","locations":[{"ref":"libobs/obs-missing-files.c:44-52","code":"   44 | void obs_missing_files_destroy(obs_missing_files_t *files)\n   45 | {\n   46 | \tfor (size_t i = 0; i < files->files.num; i++) {\n   47 | \t\tobs_missing_file_release(files->files.array[i]);\n   48 | \t}\n   49 | \n   50 | \tda_free(files->files);\n   51 | \tbfree(files);\n   52 | }","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-missing-files.c#L44-L52"}]},
{"id":"LOGIC_163","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"`TruncateLabel` uses `if (newText.length() < length)` to decide whether to truncate. When the text length equals `length` exactly, the string already fits but the code still truncates to `length` characters (removing nothing) and appends \"...\", and sets a tooltip, showing a misleading ellipsis for text that fit.","fix":"Use `<=`:\n```cpp\nif (newText.length() <= length) {\n```","locations":[{"ref":"shared/qt/wrappers/qt-wrappers.cpp:360-373","code":"  360 | void TruncateLabel(QLabel *label, QString newText, int length)\n  361 | {\n  362 | \tif (newText.length() < length) {\n  363 | \t\tlabel->setToolTip(QString());\n  364 | \t\tSetLabelText(label, newText);\n  365 | \t\treturn;\n  366 | \t}\n  367 | \n  368 | \tlabel->setToolTip(newText);\n  369 | \tnewText.truncate(length);\n  370 | \tnewText += \"...\";\n  371 | \n  372 | \tSetLabelText(label, newText);\n  373 | }","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/qt/wrappers/qt-wrappers.cpp#L360-L373"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `colorspaceFromDescription:`, the HDR/2020 branch fetches `transferFunction` but then null-checks the wrong variable: `if (!matrix)`. Since `matrix` is guaranteed non-NULL at this point (we only reach here after `CFStringCompare(matrix, ...)` matched 2020), the guard never fires. When a device reports the ITU-R 2020 matrix but has no `kCMFormatDescriptionExtension_TransferFunction` extension, `transferFunction` is NULL and the subsequent `CFStringCompare(transferFunction, ...)` is called with a NULL argument, crashing the capture thread.","fix":"Check the variable that was just fetched:\n```objc\nCFPropertyListRef transferFunction =\n    CMFormatDescriptionGetExtension(description, kCMFormatDescriptionExtension_TransferFunction);\n\nif (!transferFunction) {\n    return VIDEO_CS_DEFAULT;\n}\n```","locations":[{"ref":"plugins/mac-avcapture/OBSAVCapture.m:1119-1126","code":" 1119 |         CFPropertyListRef transferFunction =\n 1120 |             CMFormatDescriptionGetExtension(description, kCMFormatDescriptionExtension_TransferFunction);\n 1121 | \n 1122 |         if (!matrix) {\n 1123 |             return VIDEO_CS_DEFAULT;\n 1124 |         }\n 1125 | \n 1126 |         CFComparisonResult isPQ = CFStringCompare(transferFunction, kCVImageBufferTransferFunction_SMPTE_ST_2084_PQ, 0);","lines":8,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-avcapture/OBSAVCapture.m#L1119-L1126"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In `amf_av1_update_data`, `rc` is produced by `get_av1_rate_control`, which returns `AMF_VIDEO_ENCODER_AV1_RATE_CONTROL_METHOD_*` values, but two comparisons use the AVC/generic `AMF_VIDEO_ENCODER_RATE_CONTROL_METHOD_*` enum instead of the AV1 enum. The AV1 rate-control enum ordering differs from AVC (AV1 `CBR`=3 while AVC `CBR`=1, and AV1 `LATENCY_CONSTRAINED_VBR`=1). Consequently the CBR branch at line 2311 never fires when the user actually selects AV1 CBR (the default per `amf_av1_defaults`), so `FILLER_DATA` is not enabled and `pipeline_flush` stays `true` (forcing a pipeline flush + `ReInit` on every dynamic bitrate change, exactly the \"unaligned IDRs\" case the comment warns about). Worse, the branch fires incorrectly when the user selects `VBR_LAT` (which maps to AV1 `LATENCY_CONSTRAINED_VBR`=1, matching AVC `CBR`=1). Every other comparison in the same function correctly uses the `AMF_VIDEO_ENCODER_AV1_RATE_CONTROL_METHOD_*` prefix, confirming these two are copy-paste mistakes.","fix":"Use the AV1 enum values:\n```c\nif (rc == AMF_VIDEO_ENCODER_AV1_RATE_CONTROL_METHOD_CBR) {\n\tset_av1_property(enc, FILLER_DATA, true);\n\tpipeline_flush = false;\n} else if (rc == AMF_VIDEO_ENCODER_AV1_RATE_CONTROL_METHOD_PEAK_CONSTRAINED_VBR ||\n\t   rc == AMF_VIDEO_ENCODER_AV1_RATE_CONTROL_METHOD_HIGH_QUALITY_VBR) {\n```","locations":[{"ref":"plugins/obs-ffmpeg/texture-amf.cpp:2311-2315","code":" 2311 | \t\tif (rc == AMF_VIDEO_ENCODER_RATE_CONTROL_METHOD_CBR) {\n 2312 | \t\t\tset_av1_property(enc, FILLER_DATA, true);\n 2313 | \t\t\tpipeline_flush = false;\n 2314 | \t\t} else if (rc == AMF_VIDEO_ENCODER_RATE_CONTROL_METHOD_PEAK_CONSTRAINED_VBR ||\n 2315 | \t\t\t   rc == AMF_VIDEO_ENCODER_AV1_RATE_CONTROL_METHOD_HIGH_QUALITY_VBR) {","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-ffmpeg/texture-amf.cpp#L2311-L2315"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"`obs_lua_signal_handler_disconnect_global` searches for the Lua callback at stack index `3`, but this function only takes two arguments (the `signal_handler_t` at index 1 and the function at index 2, validated by `is_function(script, 2)`). `obs_lua_signal_handler_connect_global` correctly registers the callback function from index `2` via `add_lua_obs_callback(script, 2)`. Because `find_lua_obs_callback(script, 3)` / `find_next_lua_obs_callback(script, cb, 3)` compare registered functions against the non-existent stack slot 3, `lua_rawequal` never matches, so `find_lua_obs_callback` always returns `NULL` and no callback is ever disconnected. This is a copy-paste from the non-global variant `obs_lua_signal_handler_disconnect` (where the function genuinely is at index 3). Result: `signal_handler_disconnect_global` in obslua is completely non-functional - scripts cannot disconnect a global signal handler they connected, and the callback keeps firing.","fix":"Use stack index `2` (where the function argument actually is):\n```c\nstruct lua_obs_callback *cb = find_lua_obs_callback(script, 2);\nwhile (cb) {\n\tsignal_handler_t *cb_handler = calldata_ptr(&cb->base.extra, \"handler\");\n\tif (handler == cb_handler)\n\t\tbreak;\n\tcb = find_next_lua_obs_callback(script, cb, 2);\n}\n```","locations":[{"ref":"shared/obs-scripting/obs-scripting-lua.c:527-535","code":"  527 | \tstruct lua_obs_callback *cb = find_lua_obs_callback(script, 3);\n  528 | \twhile (cb) {\n  529 | \t\tsignal_handler_t *cb_handler = calldata_ptr(&cb->base.extra, \"handler\");\n  530 | \n  531 | \t\tif (handler == cb_handler)\n  532 | \t\t\tbreak;\n  533 | \n  534 | \t\tcb = find_next_lua_obs_callback(script, cb, 3);\n  535 | \t}","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/obs-scripting/obs-scripting-lua.c#L527-L535"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `isSRGB` the case list `.eac_rgba8_srgb, .etc2_rgb8, .etc2_rgb8a1_srgb` contains `.etc2_rgb8`, which is the non-sRGB variant. The intended value is `.etc2_rgb8_srgb` (which exists and is used in `isCompressed`). As written, a plain `.etc2_rgb8` texture is misreported as sRGB, causing incorrect automatic gamma decode decisions, while the actual sRGB format `.etc2_rgb8_srgb` is not recognized as sRGB.","fix":"```swift\n// before\ncase .eac_rgba8_srgb, .etc2_rgb8, .etc2_rgb8a1_srgb:\n// after\ncase .eac_rgba8_srgb, .etc2_rgb8_srgb, .etc2_rgb8a1_srgb:\n```","locations":[{"ref":"libobs-metal/MTLPixelFormat+Extensions.swift:141","code":"  141 |         case .eac_rgba8_srgb, .etc2_rgb8, .etc2_rgb8a1_srgb:","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/MTLPixelFormat+Extensions.swift#L141"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `obs_module_load_locale`, the path for the default locale is built with `\"locale/\"` (no leading slash, line 861), but the path for the non-default locale is built with `\"/locale/\"` (leading slash, line 879). Since `obs_find_module_file` concatenates `module->data_path` with the given relative path, the leading slash causes the non-default locale path to be wrong, and the file will never be found, silently falling back to the default locale on every launch with a non-default language.","fix":"Remove the leading slash:\n```c\n/* before */\ndstr_copy(&str, \"/locale/\");\n\n/* after */\ndstr_copy(&str, \"locale/\");\n```","locations":[{"ref":"libobs/obs-module.c:862-882","code":"  862 | \tdstr_copy(&str, \"locale/\");\n  863 | \tdstr_cat(&str, default_locale);\n  864 | \tdstr_cat(&str, \".ini\");\n  865 | \n  866 | \tchar *file = obs_find_module_file(module, str.array);\n  867 | \tif (file)\n  868 | \t\tlookup = text_lookup_create(file);\n  869 | \n  870 | \tbfree(file);\n  871 | \n  872 | \tif (!lookup) {\n  873 | \t\tblog(LOG_WARNING, \"Failed to load '%s' text for module: '%s'\", default_locale, module->file);\n  874 | \t\tgoto cleanup;\n  875 | \t}\n  876 | \n  877 | \tif (astrcmpi(locale, default_locale) == 0)\n  878 | \t\tgoto cleanup;\n  879 | \n  880 | \tdstr_copy(&str, \"/locale/\");\n  881 | \tdstr_cat(&str, locale);\n  882 | \tdstr_cat(&str, \".ini\");","lines":21,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-module.c#L862-L882"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`MediaControls::MoveSliderFoward` contains a typo — \"Foward\" instead of \"Forward\" — that propagates through the method name, a slot declaration in the header, and connections set up in the constructor. The corresponding keyboard shortcut action is also named `sliderFoward`. This misspelling is enshrined as a public slot and is present in four places, making it an API inconsistency for any external caller.","fix":"Rename `MoveSliderFoward` to `MoveSliderForward` and `sliderFoward` to `sliderForward` in both the header and the .cpp file. Update the `connect()` call in the constructor accordingly.","locations":[{"ref":"frontend/components/MediaControls.cpp:459","code":"  459 | void MediaControls::MoveSliderFoward(int seconds)","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/MediaControls.cpp#L459"},{"ref":"frontend/components/MediaControls.hpp:62","code":"   62 | \tvoid MoveSliderFoward(int seconds = 5);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/MediaControls.hpp#L62"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The deleted copy/move special members of `struct SceneFindBoxData` reference the wrong type: all four declarations take `SceneFindData` (the neighboring struct) instead of `SceneFindBoxData`. Because a copy constructor for `SceneFindBoxData` must take `const SceneFindBoxData&`, these declarations do NOT actually delete `SceneFindBoxData`'s copy/move constructors - they only declare unusable converting constructors from an unrelated type. The compiler therefore silently generates an implicit copy constructor for `SceneFindBoxData` (which shallow-copies the `sceneItems` vector and rebinds the reference members), defeating the author's clear intent to make the struct non-copyable. It is harmless today only because no copy is ever made, but it is a latent footgun.","fix":"Replace the parameter types with the correct struct name:\n```cpp\nSceneFindBoxData(const SceneFindBoxData &) = delete;\nSceneFindBoxData(SceneFindBoxData &&) = delete;\nSceneFindBoxData &operator=(const SceneFindBoxData &) = delete;\nSceneFindBoxData &operator=(SceneFindBoxData &&) = delete;\n```","locations":[{"ref":"frontend/widgets/OBSBasicPreview.cpp:97-100","code":"   97 | \tSceneFindBoxData(const SceneFindData &) = delete;\n   98 | \tSceneFindBoxData(SceneFindData &&) = delete;\n   99 | \tSceneFindBoxData &operator=(const SceneFindData &) = delete;\n  100 | \tSceneFindBoxData &operator=(SceneFindData &&) = delete;","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasicPreview.cpp#L97-L100"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `OBSShader.init` the `shader_parse` call passes the shader content as BOTH the `shader` and the `file` argument. The signature is `shader_parse(struct shader_parser *sp, const char *shader, const char *file)`, so the second occurrence of `content.cString(using: .utf8)` should be `fileLocation`. The `file` argument is used by the parser for error/location reporting, so parser diagnostics will reference the shader source text instead of the file path.","fix":"Pass the file location:\n```swift\nlet result = shader_parse($0, content.cString(using: .utf8), fileLocation.cString(using: .utf8))\n```","locations":[{"ref":"libobs-metal/OBSShader.swift:138","code":"  138 |             let result = shader_parse($0, content.cString(using: .utf8), content.cString(using: .utf8))","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/OBSShader.swift#L138"}]},

            OBSLog(.error, \"device_vertexshader_create: Device error compiling shader.\\n\\(error.description)\")\n  155 |         default:\n  156 |             OBSLog(.error, \"device_vertexshader_create: Unknown error occurred\")\n  157 |         }","lines":27,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-shader.swift#L131-L157"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The Swift function exported for `gs_stagesurface_get_color_format` is named `gs_stagesurface_get_height` (a copy of the preceding function's name). The `@_cdecl` symbol is correct so the exported C symbol works, but the duplicated Swift name is misleading and only compiles because Swift permits return-type overloading; it is a latent maintenance hazard.","fix":"Rename the Swift function to `gs_stagesurface_get_color_format` to match its `@_cdecl` symbol.","locations":[{"ref":"libobs-metal/metal-stagesurf.swift:88-93","code":"   88 | @_cdecl(\"gs_stagesurface_get_color_format\")\n   89 | public func gs_stagesurface_get_height(stagesurf: UnsafeRawPointer) -> gs_color_format {\n   90 |     let stageSurface: MetalStageBuffer = unretained(stagesurf)\n   91 | \n   92 |     return stageSurface.format.gsColorFormat\n   93 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-stagesurf.swift#L88-L93"}]},
{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"Several texture copy/stage functions log errors with the wrong function name `\"device_clear:\"`. `device_copy_texture_region`, `device_copy_texture`, and `device_stage_texture` all emit `OBSLog(.error, \"device_clear: ...\")`, misattributing failures to `device_clear`.","fix":"Use the correct function name in each log message (`\"device_copy_texture_region:\"`, `\"device_copy_texture:\"`, `\"device_stage_texture:\"`).","locations":[{"ref":"libobs-metal/metal-texture2d.swift:244-247","code":"  244 |         OBSLog(.error, \"device_clear: \\(error.description)\")\n  245 |     } catch {\n  246 |         OBSLog(.error, \"device_clear: Unknown error occurred\")\n  247 |     }","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-texture2d.swift#L244-L247"},{"ref":"libobs-metal/metal-texture2d.swift:270-274","code":"  270 |     } catch let error as MetalError.MTLDeviceError {\n  271 |         OBSLog(.error, \"device_clear: \\(error.description)\")\n  272 |     } catch {\n  273 |         OBSLog(.error, \"device_clear: Unknown error occurred\")\n  274 |     }","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-texture2d.swift#L270-L274"},{"ref":"libobs-metal/metal-texture2d.swift:294-298","code":"  294 |     } catch let error as MetalError.MTLDeviceError {\n  295 |         OBSLog(.error, \"device_clear: \\(error.description)\")\n  296 |     } catch {\n  297 |         OBSLog(.error, \"device_clear: Unknown error occurred\")\n  298 |     }","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-metal/metal-texture2d.swift#L294-L298"}]},
{"id":"CPY_12","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"Three SDI RGB Display routing presets contain a malformed destination token `sdi[{ch1}[0]` (missing the closing `]` after `{ch1}`); it should read `sdi[{ch1}][0]`. Because `Routing::ParseRouteString` only checks that `sscanf(\"%[A-Za-z_0-9][%d][%d]\")` matched at least one field (the acknowledged TODO), the malformed token still partially parses to channel 0 / datastream 0, which happens to coincide with the intended `sdi[0][0]` for ch1 - so it works only by luck and would break if the parser were tightened or the channel placeholder were non-zero.","fix":"Fix the typo in each string, e.g. change `\"dlo[{ch1}][0]->sdi[{ch1}[0];\"` to `\"dlo[{ch1}][0]->sdi[{ch1}][0];\"`.","locations":[{"ref":"plugins/aja/aja-presets.cpp:709-711","code":"  709 | \t\t  \"fb[{ch1}][2]->dlo[{ch1}][0];\"\n  710 | \t\t  \"dlo[{ch1}][0]->sdi[{ch1}[0];\"\n  711 | \t\t  \"dlo[{ch1}][1]->sdi[{ch2}][0];\",","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/aja/aja-presets.cpp#L709-L711"},{"ref":"plugins/aja/aja-presets.cpp:725-727","code":"  725 | \t\t  \"fb[{ch1}][2]->dlo[{ch1}][0];\"\n  726 | \t\t  \"dlo[{ch1}][0]->sdi[{ch1}[0];\"\n  727 | \t\t  \"dlo[{ch1}][1]->sdi[{ch2}][0];\",","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/aja/aja-presets.cpp#L725-L727"},{"ref":"plugins/aja/aja-presets.cpp:741-743","code":"  741 | \t\t  \"fb[{ch1}][2]->dlo[{ch1}][0];\"\n  742 | \t\t  \"dlo[{ch1}][0]->sdi[{ch1}[0];\"\n  743 | \t\t  \"dlo[{ch1}][1]->sdi[{ch2}][0];\",","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/aja/aja-presets.cpp#L741-L743"}]},
{"id":"CPY_13","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the `kWidgetOutputSockets` table the entry for `NTV2_XptLUT1YUV` (a LUT1 widget output) is given the nickname `kSDINickname` (\"sdi\") instead of `kLUTNickname` (\"lut\"). It is a copy-paste error: `WidgetOutputSocket::OutputXptName(NTV2_XptLUT1YUV)` and `GetWidgetOutputSocketByXpt` return the wrong name \"sdi\" for this crosspoint. It is currently harmless because `Find(\"sdi\", ch1, 0)` is shadowed by the earlier `NTV2_XptSDIIn1` entry and no routing string references a `lut` output, but the mislabel is latent and misleading.","fix":"Change `{ NTV2_XptLUT1YUV, NTV2_WgtLUT1, kSDINickname, 0},` to use `kLUTNickname`.","locations":[{"ref":"plugins/aja/aja-widget-io.cpp:173","code":"  173 | \t{ NTV2_XptLUT1YUV,               NTV2_WgtLUT1,                        kSDINickname,                  0},","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/aja/aja-widget-io.cpp#L173"}]},
{"id":"CPY_14","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `init_audio_screen_stream`, the `startCaptureWithCompletionHandler` block parameter is named `error2`, but the failure log reads `[[error localizedFailureReason] ...]` referencing the outer `NSError *error` (which is `nil` after the successful `addStreamOutput` calls) instead of the block's `error2`. The actual capture-start failure reason is never logged (prints nil). The analogous video-capture code uses the block parameter correctly.","fix":"Reference the block parameter: `[[error2 localizedFailureReason] cStringUsingEncoding:NSUTF8StringEncoding]`.","locations":[{"ref":"plugins/mac-capture/mac-sck-audio-capture.m:155-166","code":"  155 |     __block BOOL did_stream_start = false;\n  156 |     [sc->disp startCaptureWithCompletionHandler:^(NSError *_Nullable error2) {\n  157 |         did_stream_start = (BOOL) (error2 == nil);\n  158 |         if (!did_stream_start) {\n  159 |             MACCAP_ERR(\"init_audio_screen_stream: Failed to start capture with error %s\\n\",\n  160 |                        [[error localizedFailureReason] cStringUsingEncoding:NSUTF8StringEncoding]);\n  161 |             // Clean up disp so it isn't stopped\n  162 |             [sc->disp release];\n  163 |             sc->disp = NULL;\n  164 |         }\n  165 |         os_event_signal(sc->stream_start_completed);\n  166 |     }];","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-capture/mac-sck-audio-capture.m#L155-L166"}]},
{"id":"CPY_15","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the destroy loop of `nvidia_audio_destroy`, the guard tests `ng->handle[0]` while the destroyed handle is `ng->handle[i]`. If per-channel effect creation partially failed (e.g. `handle[0]` created but `handle[1]` is NULL), the loop calls `NvAFX_DestroyEffect(ng->handle[i])` with a NULL handle, logging a spurious \"NvAFX_Release() failed\" error. The check should reference `ng->handle[i]`.","fix":"Change `if (ng->handle[0]) {` to `if (ng->handle[i]) {`.","locations":[{"ref":"plugins/nv-filters/nvidia-audiofx-filter.c:142-150","code":"  142 | \tfor (size_t i = 0; i < ng->channels; i++) {\n  143 | \t\tif (ng->handle[0]) {\n  144 | \t\t\tif (NvAFX_DestroyEffect) {\n  145 | \t\t\t\tNvAFX_Status err = NvAFX_DestroyEffect(ng->handle[i]);\n  146 | \t\t\t\tif (err != NVAFX_STATUS_SUCCESS) {\n  147 | \t\t\t\t\tdo_log(LOG_ERROR, \"NvAFX_Release() failed\");\n  148 | \t\t\t\t}\n  149 | \t\t\t}\n  150 | \t\t}","lines":9,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/nv-filters/nvidia-audiofx-filter.c#L142-L150"}]},
{"id":"CPY_16","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`scroll_filter_defaults` sets a default for the setting key `\"limit_size\"`, which does not exist anywhere else in this filter; the actual settings keys are `\"limit_cx\"` and `\"limit_cy\"` (read in `scroll_filter_update`). This is leftover/copy-paste dead code: it has no effect, and the intended `limit_cx`/`limit_cy` keys get no explicit default (they happen to default to false naturally).","fix":"Replace the bogus line with defaults for the real keys, e.g.\n```c\nobs_data_set_default_bool(settings, \"limit_cx\", false);\nobs_data_set_default_bool(settings, \"limit_cy\", false);\n```\nor simply delete it.","locations":[{"ref":"plugins/obs-filters/scroll-filter.c:144","code":"  144 | \tobs_data_set_default_bool(settings, \"limit_size\", false);","lines":1,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-filters/scroll-filter.c#L144"}]},
{"id":"CPY_17","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `mp4_write_track_udta`, when `MP4_WRITE_ENCODER_INFO` is set, the code fetches `id = obs_encoder_get_id(track->encoder)` but then guards writing it with `if (name)` (the previously fetched encoder name) instead of `if (id)`. If `id` is `NULL` while `name` is non-NULL, `mp4_write_udta_atom(mux, \"\\251enc\", id)` calls `strlen(id)`/`s_write` on a NULL pointer and crashes. The guard should test the value actually being written.","fix":"```c\nconst char *id = obs_encoder_get_id(track->encoder);\nif (id)\n    mp4_write_udta_atom(mux, \"\\251enc\", id);\n```","locations":[{"ref":"plugins/obs-outputs/mp4-mux.c:1791-1793","code":" 1791 | \t\tconst char *id = obs_encoder_get_id(track->encoder);\n 1792 | \t\tif (name)\n 1793 | \t\t\tmp4_write_udta_atom(mux, \"\\251enc\", id);","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/mp4-mux.c#L1791-L1793"}]},
{"id":"CPY_18","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `init_send()` the loop that sums audio bitrates for the write-buffer size estimate iterates `for (size_t i = 0; i < MAX_OUTPUT_AUDIO_ENCODERS; i++)` but always queries encoder index `0`: `obs_encoder_t *aencoder = obs_output_get_audio_encoder(context, 0);`. If audio encoder 0 exists, its bitrate is added `MAX_OUTPUT_AUDIO_ENCODERS` times and encoders at other indices are ignored, over-sizing the socket write buffer for the Windows new-socket-loop and mis-estimating the total bitrate.","fix":"Use the loop index:\n```c\nobs_encoder_t *aencoder = obs_output_get_audio_encoder(context, i);\n```","locations":[{"ref":"plugins/obs-outputs/rtmp-stream.c:1037-1050","code":" 1037 | \t\tfor (size_t i = 0; i < MAX_OUTPUT_AUDIO_ENCODERS; i++) {\n 1038 | \t\t\tobs_encoder_t *aencoder = obs_output_get_audio_encoder(context, 0);\n 1039 | \t\t\tif (!aencoder)\n 1040 | \t\t\t\tcontinue;\n 1041 | \n 1042 | \t\t\tobs_data_t *params = obs_encoder_get_settings(aencoder);\n 1043 | \t\t\tif (params) {\n 1044 | \t\t\t\tint bitrate = obs_data_get_int(params, \"bitrate\");\n 1045 | \t\t\t\tif (!bitrate)\n 1046 | \t\t\t\t\tbitrate = 160;\n 1047 | \t\t\t\ttotal_bitrate += bitrate;\n 1048 | \t\t\t\tobs_data_release(params);\n 1049 | \t\t\t}\n 1050 | \t\t}","lines":14,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/rtmp-stream.c#L1037-L1050"}]},
{"id":"CPY_19","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `vk_format_to_dxgi`, the case for `VK_FORMAT_R8G8_SINT` assigns `DXGI_FORMAT_R8G8_UINT` instead of `DXGI_FORMAT_R8G8_SINT`. This is a copy-paste error from the preceding `VK_FORMAT_R8G8_UINT` case (line 395), and yields the wrong (unsigned) DXGI format for a signed Vulkan format when capturing such swapchains.","fix":"Change `dxgi_format = DXGI_FORMAT_R8G8_UINT;` to `dxgi_format = DXGI_FORMAT_R8G8_SINT;` in the `case VK_FORMAT_R8G8_SINT:` branch.","locations":[{"ref":"plugins/win-capture/graphics-hook/vulkan-capture.h:397-399","code":"  397 | \tcase VK_FORMAT_R8G8_SINT:\n  398 | \t\tdxgi_format = DXGI_FORMAT_R8G8_UINT;\n  399 | \t\tbreak;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/graphics-hook/vulkan-capture.h#L397-L399"}]},
{"id":"CPY_20","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `WidgetInfo::ListChanged`, the `OBS_COMBO_FORMAT_BOOL` case extracts the value with `data.value<double>()` instead of `data.value<bool>()`. The variant was stored as a `bool` (see `propertyListToQVariant`), so this reads it as a double and relies on the double->bool conversion in `obs_data_set_bool`. It produces the right result today but is a clear copy-paste from the FLOAT case and is fragile.","fix":"Replace:\n```cpp\ncase OBS_COMBO_FORMAT_BOOL:\n\tobs_data_set_bool(view->settings, setting, data.value<double>());\n```\nwith `obs_data_set_bool(view->settings, setting, data.value<bool>());`","locations":[{"ref":"shared/properties-view/properties-view.cpp:1866-1868","code":" 1866 | \tcase OBS_COMBO_FORMAT_BOOL:\n 1867 | \t\tobs_data_set_bool(view->settings, setting, data.value<double>());\n 1868 | \t\tbreak;","lines":3,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/shared/properties-view/properties-view.cpp#L1866-L1868"}]},
{"id":"CPY_21","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `ChangeSceneCollection`, when the selected collection cannot be found the thrown error message interpolates `currentCollectionName` instead of `selectedCollectionName`, so the diagnostic reports the wrong (currently active) collection name rather than the one that was not found.","fix":"```cpp\n// before\nthrow std::invalid_argument(errorMessage + currentCollectionName.data());\n// after\nthrow std::invalid_argument(errorMessage + selectedCollectionName);\n```","locations":[{"ref":"frontend/widgets/OBSBasic_SceneCollections.cpp:358-362","code":"  358 | \tif (!foundCollection) {\n  359 | \t\tconst std::string errorMessage{\"Selected scene collection not found: \"};\n  360 | \n  361 | \t\tthrow std::invalid_argument(errorMessage + currentCollectionName.data());\n  362 | \t}","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_SceneCollections.cpp#L358-L362"}]},
{"id":"CPY_22","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`obs_set_array` passes `sizeof(obs_data_t *)` as the size argument when storing an\n`obs_data_array_t *` value. On all supported platforms `sizeof(obs_data_t *)` equals\n`sizeof(obs_data_array_t *)` (both are generic pointer sizes), so no data is lost.\nHowever the type mismatch is confusing and could become a latent bug on a hypothetical\nplatform with differentiated pointer sizes.","fix":"Change `sizeof(obs_data_t *)` to `sizeof(obs_data_array_t *)`:\n```c\nset_item_(data, item, name, &array, sizeof(obs_data_array_t *), OBS_DATA_ARRAY);\n```","locations":[{"ref":"libobs/obs-data.c:1102-1106","code":" 1102 | static inline void obs_set_array(obs_data_t *data, obs_data_item_t **item, const char *name, obs_data_array_t *array,\n 1103 | \t\t\t\t set_item_t set_item_)\n 1104 | {\n 1105 | \tset_item_(data, item, name, &array, sizeof(obs_data_t *), OBS_DATA_ARRAY);\n 1106 | }","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-data.c#L1102-L1106"}]},
{"id":"CPY_23","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`remove_free_swap_view_data` and `remove_free_framebuffer_data` cast the node returned by `remove_obj_data` to `struct vk_swap_data *` rather than the matching `struct vk_swap_view_data *` / `struct vk_framebuffer_data *`. It is harmless because `vk_free` only frees the pointer regardless of type, but the mismatched type names are misleading copy/paste from the swap-data helpers.","fix":"Cast to the correct types: `struct vk_swap_view_data *` in `remove_free_swap_view_data` and `struct vk_framebuffer_data *` in `remove_free_framebuffer_data`.","locations":[{"ref":"plugins/win-capture/graphics-hook/vulkan-capture.c:338-343","code":"  338 | static void remove_free_swap_view_data(struct vk_data *data, VkImageView imageView, const VkAllocationCallbacks *ac)\n  339 | {\n  340 | \tstruct vk_swap_data *const swap_view_data =\n  341 | \t\t(struct vk_swap_data *)remove_obj_data(&data->swap_views, (uint64_t)imageView);\n  342 | \tvk_free(ac, swap_view_data);\n  343 | }","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/graphics-hook/vulkan-capture.c#L338-L343"},{"ref":"plugins/win-capture/graphics-hook/vulkan-capture.c:366-372","code":"  366 | static void remove_free_framebuffer_data(struct vk_data *data, VkFramebuffer framebuffer,\n  367 | \t\t\t\t\t const VkAllocationCallbacks *ac)\n  368 | {\n  369 | \tstruct vk_swap_data *const framebuffer_data =\n  370 | \t\t(struct vk_swap_data *)remove_obj_data(&data->framebuffers, (uint64_t)framebuffer);\n  371 | \tvk_free(ac, framebuffer_data);\n  372 | }","lines":7,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/graphics-hook/vulkan-capture.c#L366-L372"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"`ImageSourceToolbar` constructor calls `obs_module_get_locale_text(mod, \"File\")` immediately after `obs_get_module(\"image-source\")` without checking for a `nullptr` return. If the `image-source` plugin is not loaded, `mod` is `nullptr` and `obs_module_get_locale_text` crashes with a null-pointer dereference.","fix":"```cpp\nobs_module_t *mod = obs_get_module(\"image-source\");\nif (mod) {\n    ui->pathLabel->setText(obs_module_get_locale_text(mod, \"File\"));\n}\n```","locations":[{"ref":"frontend/components/ImageSourceToolbar.cpp:14-15","code":"   14 | \tobs_module_t *mod = obs_get_module(\"image-source\");\n   15 | \tui->pathLabel->setText(obs_module_get_locale_text(mod, \"File\"));","lines":2,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/components/ImageSourceToolbar.cpp#L14-L15"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `OBSApp::OBSApp` (non-Windows path), the `socketpair` call on line 935 does not check the\nreturn value. If `socketpair` fails (e.g. the file descriptor limit is reached), both descriptors\nin `fileDescriptor` remain 0, so the subsequent `QSocketNotifier` is created with file descriptor\n1 (stdout), and the POSIX signal handler will write to stdout instead of the socket, corrupting\nprocess output and misdirecting signal handling.","fix":"Check the return value and handle failure:\n\n```cpp\nif (socketpair(AF_UNIX, SOCK_STREAM, 0, fileDescriptor.data()) != 0) {\n    blog(LOG_ERROR, \"Failed to create socket pair for signal handling: %s\", strerror(errno));\n    return; // or throw\n}\nnotifier = new QSocketNotifier(fileDescriptor[1], QSocketNotifier::Read, this);\nconnect(notifier, &QSocketNotifier::activated, this, callback);\n```","locations":[{"ref":"frontend/OBSApp.cpp:933-937","code":"  933 | \tauto connectSignal = [this](std::array<int, 2> &fileDescriptor, QPointer<QSocketNotifier> &notifier,\n  934 | \t\t\t\t    SignalCallback callback) -> void {\n  935 | \t\tsocketpair(AF_UNIX, SOCK_STREAM, 0, fileDescriptor.data());\n  936 | \t\tnotifier = new QSocketNotifier(fileDescriptor[1], QSocketNotifier::Read, this);\n  937 | \t\tconnect(notifier, &QSocketNotifier::activated, this, callback);","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/OBSApp.cpp#L933-L937"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`winrt_capture_device_loss_rebuild` is a device-loss recovery callback registered with `gs_register_loss_callbacks` (invoked from C code in libobs), yet unlike `winrt_capture_init_internal` it has no `try/catch` wrapper and it continues after failures instead of returning. When `d3d_device->QueryInterface(&dxgi_device)` or `CreateDirect3D11DeviceFromDXGIDevice(...)` fail, it only logs and then proceeds to use the null/empty `dxgi_device`/`inspectable`; `inspectable.as<...IDirect3DDevice>()` (and the other WinRT calls such as `RequestAccessAsync().get()` / `Create`) will throw `winrt::hresult_error`, which propagates out of this C callback uncaught and terminates the process. The `init` path returns `nullptr` on the same failures.","fix":"Wrap the body of `winrt_capture_device_loss_rebuild` in a `try { ... } catch (const winrt::hresult_error &err) { ... } catch (...) { ... }` block (mirroring `winrt_capture_init_internal`), and `return` after the `QueryInterface`/`CreateDirect3D11DeviceFromDXGIDevice` failures instead of continuing to use the invalid objects.","locations":[{"ref":"libobs-winrt/winrt-capture.cpp:284-343","code":"  284 | static void winrt_capture_device_loss_rebuild(void *device_void, void *data)\n  285 | {\n  286 | \twinrt_capture *capture = static_cast<winrt_capture *>(data);\n  287 | \n  288 | \tauto activation_factory =\n  289 | \t\twinrt::get_activation_factory<winrt::Windows::Graphics::Capture::GraphicsCaptureItem>();\n  290 | \tauto interop_factory = activation_factory.as<IGraphicsCaptureItemInterop>();\n  291 | \twinrt::Windows::Graphics::Capture::GraphicsCaptureItem item =\n  292 | \t\twinrt_capture_create_item(interop_factory.get(), capture->window, capture->monitor);\n  293 | \tif (!item) {\n  294 | \t\treturn;\n  295 | \t}\n  296 | \n  297 | \tID3D11Device *const d3d_device = (ID3D11Device *)device_void;\n  298 | \tComPtr<IDXGIDevice> dxgi_device;\n  299 | \tif (FAILED(d3d_device->QueryInterface(&dxgi_device))) {\n  300 | \t\tblog(LOG_ERROR, \"Failed to get DXGI device\");\n  301 | \t}\n  302 | \n  303 | \twinrt::com_ptr<IInspectable> inspectable;\n  304 | \tif (FAILED(CreateDirect3D11DeviceFromDXGIDevice(dxgi_device.Get(), inspectable.put()))) {\n  305 | \t\tblog(LOG_ERROR, \"Failed to get WinRT device\");\n  306 | \t}\n  307 | \n  308 | \tconst winrt::Windows::Graphics::DirectX::Direct3D11::IDirect3DDevice device =\n  309 | \t\tinspectable.as<winrt::Windows::Graphics::DirectX::Direct3D11::IDirect3DDevice>();\n  310 | \tconst winrt::Windows::Graphics::Capture::Direct3D11CaptureFramePool frame_pool =\n  311 | \t\twinrt::Windows::Graphics::Capture::Direct3D11CaptureFramePool::Create(\n  312 | \t\t\tdevice, static_cast<winrt::Windows::Graphics::DirectX::DirectXPixelFormat>(capture->format), 2,\n  313 | \t\t\tcapture->last_size);\n  314 | \tconst winrt::Windows::Graphics::Capture::GraphicsCaptureSession session = frame_pool.CreateCaptureSession(item);\n  315 | \n  316 | \tif (winrt_capture_border_toggle_supported()) {\n  317 | \t\twinrt::Windows::Graphics::Capture::GraphicsCaptureAccess::RequestAccessAsync(\n  318 | \t\t\twinrt::Windows::Graphics::Capture::GraphicsCaptureAccessKind::Borderless)\n  319 | \t\t\t.get();\n  320 | \t\tsession.IsBorderRequired(false);\n  321 | \t}\n  322 | \n  323 | \tif (winrt_capture_cursor_toggle_supported()) {\n  324 | \t\tsession.IsCursorCaptureEnabled(capture->capture_cursor && capture->cursor_visible);\n  325 | \t}\n  326 | \n  327 | \tcapture->item = item;\n  328 | \tcapture->device = device;\n  329 | \td3d_device->GetImmediateContext(&capture->context);\n  330 | \tcapture->frame_pool = frame_pool;\n  331 | \tcapture->session = session;\n  332 | \tcapture->frame_arrived =\n  333 | \t\tframe_pool.FrameArrived(winrt::auto_revoke, {capture, &winrt_capture::on_frame_arrived});\n  334 | \n  335 | \ttry {\n  336 | \t\tsession.StartCapture();\n  337 | \t\tcapture->active = TRUE;\n  338 | \t} catch (winrt::hresult_error &err) {\n  339 | \t\tblog(LOG_ERROR, \"StartCapture (0x%08X): %s\", err.code().value, winrt::to_string(err.message()).c_str());\n  340 | \t} catch (...) {\n  341 | \t\tblog(LOG_ERROR, \"StartCapture (0x%08X)\", winrt::to_hresult().value);\n  342 | \t}\n  343 | }","lines":60,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs-winrt/winrt-capture.cpp#L284-L343"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`find_cached_effect` traverses the `first_effect` linked list without holding `effect_mutex`.\nWrites to the list are protected by the mutex in `gs_effect_create` (lines 884-892), but the read\nin `gs_effect_create_from_file` (line 846) is not. If one thread is loading an effect from file\nwhile another thread concurrently calls `gs_effect_create` to add a new effect to the list,\nthe reader can observe a partially updated `next` pointer, leading to a use-after-free or\ninfinite loop.","fix":"Wrap `find_cached_effect` with the effect mutex in `gs_effect_create_from_file`:\n\n```c\npthread_mutex_lock(&thread_graphics->effect_mutex);\neffect = find_cached_effect(file);\npthread_mutex_unlock(&thread_graphics->effect_mutex);\nif (effect)\n    return effect;\n```","locations":[{"ref":"libobs/graphics/graphics.c:825-848","code":"  825 | static inline struct gs_effect *find_cached_effect(const char *filename)\n  826 | {\n  827 | \tstruct gs_effect *effect = thread_graphics->first_effect;\n  828 | \n  829 | \twhile (effect) {\n  830 | \t\tif (strcmp(effect->effect_path, filename) == 0)\n  831 | \t\t\tbreak;\n  832 | \t\teffect = effect->next;\n  833 | \t}\n  834 | \n  835 | \treturn effect;\n  836 | }\n  837 | \n  838 | gs_effect_t *gs_effect_create_from_file(const char *file, char **error_string)\n  839 | {\n  840 | \tchar *file_string;\n  841 | \tgs_effect_t *effect = NULL;\n  842 | \n  843 | \tif (!gs_valid_p(\"gs_effect_create_from_file\", file))\n  844 | \t\treturn NULL;\n  845 | \n  846 | \teffect = find_cached_effect(file);\n  847 | \tif (effect)\n  848 | \t\treturn effect;","lines":24,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/graphics/graphics.c#L825-L848"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`create_encoder` declares `VTCompressionSessionRef s;` uninitialized and, if `VTCompressionSessionCreate` fails, only logs the error and falls through without returning. It then calls `VTSessionCopyProperty(s, ...)` and further `session_set_*` calls on `s`, which is undefined/uninitialized on failure. This can dereference a garbage session pointer.","fix":"Return early on creation failure:\n```c\nif (code != noErr) {\n    log_osstatus(LOG_ERROR, enc, \"VTCompressionSessionCreate\", code);\n    CFRelease(encoder_spec);\n    CFRelease(pixbuf_spec);\n    return code;\n}\n```","locations":[{"ref":"plugins/mac-videotoolbox/encoder.c:507-518","code":"  507 | \tcode = VTCompressionSessionCreate(kCFAllocatorDefault, enc->width, enc->height, enc->codec_type, encoder_spec,\n  508 | \t\t\t\t\t  pixbuf_spec, NULL, &sample_encoded_callback, enc->queue, &s);\n  509 | \n  510 | \tif (code != noErr) {\n  511 | \t\tlog_osstatus(LOG_ERROR, enc, \"VTCompressionSessionCreate\", code);\n  512 | \t}\n  513 | \n  514 | \tCFRelease(encoder_spec);\n  515 | \tCFRelease(pixbuf_spec);\n  516 | \n  517 | \tCFBooleanRef b = NULL;\n  518 | \tcode = VTSessionCopyProperty(s, kVTCompressionPropertyKey_UsingHardwareAcceleratedVideoEncoder, NULL, &b);","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-videotoolbox/encoder.c#L507-L518"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`get_cached_pixel_buffer` is declared to return `bool` but on the `!pool` branch does `return kCVReturnError;`. `kCVReturnError` is `-6660`, which is nonzero and therefore converts to `true` (success). The caller `vt_encode` checks `if (!get_cached_pixel_buffer(enc, &pixbuf))` and thus treats the pool-missing case as success while `*buf` was never written, then proceeds to lock a `NULL`/unset pixel buffer. The intended failure signalling is inverted.","fix":"Return the correct boolean:\n```c\nif (!pool)\n    return false;\n```","locations":[{"ref":"plugins/mac-videotoolbox/encoder.c:1064-1069","code":" 1064 | bool get_cached_pixel_buffer(struct vt_encoder *enc, CVPixelBufferRef *buf)\n 1065 | {\n 1066 | \tOSStatus code;\n 1067 | \tCVPixelBufferPoolRef pool = VTCompressionSessionGetPixelBufferPool(enc->session);\n 1068 | \tif (!pool)\n 1069 | \t\treturn kCVReturnError;","lines":6,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/mac-videotoolbox/encoder.c#L1064-L1069"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `obs_parse_hevc_header()` the local `size` is reused to accumulate the total length of the extracted NAL units (`size += 4 + nal_end - nal_start;`). On the error paths that `goto free` - when `hvcc_add_nal_unit()` fails (line 803) or when the VPS/SPS/PPS counts are invalid (line 825) - the code jumps past the success block (lines 864-865) that assigns `*header` and sets `size = output.bytes.num`. The function then returns the non-zero NAL-accumulation `size` while `*header` was never written. The caller `send_video_header()` uses `packet.data` (still `NULL` from the zero-initialized packet) together with the non-zero `packet.size`, so a malformed/VPS-less HEVC header can cause a bogus non-zero size paired with a `NULL` data pointer to be muxed/sent.","fix":"Reset the return value on the error path, e.g. set `size = 0;` immediately before each `goto free;`, or add a distinct error label that zeroes `size` before falling into the cleanup, so the function returns 0 whenever `*header` was not assigned.","locations":[{"ref":"plugins/obs-outputs/rtmp-hevc.c:800-825","code":"  800 | \t\t\t\tint ps_array_completeness = 1;\n  801 | \t\t\t\tint ret = hvcc_add_nal_unit(buf, len, ps_array_completeness, &hvcc, i);\n  802 | \t\t\t\tif (ret < 0)\n  803 | \t\t\t\t\tgoto free;\n  804 | \t\t\t\tbreak;\n  805 | \t\t\t}\n  806 | \t\t}\n  807 | \n  808 | \t\tbuf += len;\n  809 | \t}\n  810 | \n  811 | \t// write hvcc data\n  812 | \tuint16_t vps_count, sps_count, pps_count;\n  813 | \tif (hvcc.min_spatial_segmentation_idc > 4096) // invalid?\n  814 | \t\thvcc.min_spatial_segmentation_idc = 0;\n  815 | \tif (!hvcc.min_spatial_segmentation_idc)\n  816 | \t\thvcc.parallelismType = 0;\n  817 | \thvcc.avgFrameRate = 0;\n  818 | \thvcc.constantFrameRate = 0;\n  819 | \n  820 | \tvps_count = hvcc.arrays[OBS_VPS_INDEX].numNalus;\n  821 | \tsps_count = hvcc.arrays[OBS_SPS_INDEX].numNalus;\n  822 | \tpps_count = hvcc.arrays[OBS_PPS_INDEX].numNalus;\n  823 | \tif (!vps_count || vps_count > OBS_HEVC_MAX_VPS_COUNT || !sps_count || sps_count > OBS_HEVC_MAX_SPS_COUNT ||\n  824 | \t    !pps_count || pps_count > OBS_HEVC_MAX_PPS_COUNT)\n  825 | \t\tgoto free;","lines":26,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/rtmp-hevc.c#L800-L825"},{"ref":"plugins/obs-outputs/rtmp-hevc.c:864-876","code":"  864 | \t*header = output.bytes.array;\n  865 | \tsize = output.bytes.num;\n  866 | \n  867 | free:\n  868 | \tfor (unsigned i = 0; i < OBS_NB_ARRAYS; i++) {\n  869 | \t\tHVCCNALUnitArray *const array = &hvcc.arrays[i];\n  870 | \t\tarray->numNalus = 0;\n  871 | \t\tarray_output_serializer_free(&array->nalUnitData);\n  872 | \t}\n  873 | \n  874 | done:\n  875 | \tarray_output_serializer_free(&nals);\n  876 | \treturn size;","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/obs-outputs/rtmp-hevc.c#L864-L876"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`dc_capture_capture` acquires the target DC with `hdc_target = GetDC(window)` but releases it with `ReleaseDC(NULL, hdc_target)`. When `window` is a real window handle (window/BitBlt capture), `ReleaseDC` must be called with that same `HWND`; passing `NULL` makes `ReleaseDC` fail and the device context is never released, leaking a GDI DC on every captured frame. It only happens to work when `window` is `NULL` (full-screen/monitor DC).","fix":"```c\n-\tReleaseDC(NULL, hdc_target);\n+\tReleaseDC(window, hdc_target);\n```","locations":[{"ref":"plugins/win-capture/dc-capture.c:169-173","code":"  169 | \thdc_target = GetDC(window);\n  170 | \n  171 | \tBitBlt(hdc, 0, 0, capture->width, capture->height, hdc_target, capture->x, capture->y, SRCCOPY);\n  172 | \n  173 | \tReleaseDC(NULL, hdc_target);","lines":5,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/plugins/win-capture/dc-capture.c#L169-L173"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`YouTubeAppDock::CleanupYouTubeUrls` parses user configuration JSON with `json::parse(jsonStr)` and later dereferences `item[\"url\"].get<std::string>()` without any try/catch. `nlohmann::json::parse` throws `parse_error` on malformed input, and `.get<std::string>()` throws `type_error` if `url` is missing or not a string. Since this runs once at startup, a corrupted `BasicWindow/ExtraBrowserDocks` value would throw an uncaught exception and crash OBS during launch.","fix":"Wrap the parse/iteration in a try/catch (or use the non-throwing `json::parse(str, nullptr, false)` and `item.value(\"url\", std::string())`), logging and bailing out on malformed data instead of propagating the exception.","locations":[{"ref":"frontend/docks/YouTubeAppDock.cpp:426-444","code":"  426 | \tjson array = json::parse(jsonStr);\n  427 | \tif (!array.is_array()) {\n  428 | \t\treturn;\n  429 | \t}\n  430 | \n  431 | \tjson save_array;\n  432 | \tstd::string removedYTUrl;\n  433 | \n  434 | \tfor (json &item : array) {\n  435 | \t\tauto url = item[\"url\"].get<std::string>();\n  436 | \n  437 | \t\tif (url.find(YOUTUBE_VIDEO_URL) != std::string::npos) {\n  438 | \t\t\tblog(LOG_DEBUG, \"YT: found legacy url: %s\", url.c_str());\n  439 | \t\t\tremovedYTUrl += url;\n  440 | \t\t\tremovedYTUrl += \";\\n\";\n  441 | \t\t} else {\n  442 | \t\t\tsave_array.push_back(item);\n  443 | \t\t}\n  444 | \t}","lines":19,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/docks/YouTubeAppDock.cpp#L426-L444"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`logUploadFinished` calls `nlohmann::json::parse(text)` and then `std::string logURL = parsed[\"url\"]` directly on the raw HTTP response body with no exception handling. `nlohmann::json::parse` throws `nlohmann::json::parse_error` on malformed input, and the implicit conversion `parsed[\"url\"]` throws `type_error` if the response lacks a string `url` field. Because this runs in a Qt slot invoked from the log-upload thread result, any such throw propagates out unhandled and terminates the application. A non-JSON error page returned by a proxy or a server-side failure would crash OBS instead of surfacing an upload error.","fix":"Wrap the parse/access in a try/catch and route failures through `logUploadFailed`, e.g.:\n```cpp\ntry {\n    nlohmann::json parsed = nlohmann::json::parse(text);\n    std::string logURL = parsed.at(\"url\").get<std::string>();\n    emit app->logUploadFinished(uploadType, QString::fromStdString(logURL));\n} catch (const std::exception &e) {\n    emit app->logUploadFailed(uploadType, QString::fromStdString(e.what()));\n}\n```","locations":[{"ref":"frontend/widgets/OBSBasic_MainControls.cpp:406-418","code":"  406 | void OBSBasic::logUploadFinished(const std::string &text, const std::string &error, LogUploadType uploadType)\n  407 | {\n  408 | \tOBSApp *app = App();\n  409 | \n  410 | \tif (text.empty()) {\n  411 | \t\temit app->logUploadFailed(uploadType, QString::fromStdString(error));\n  412 | \t} else {\n  413 | \t\tnlohmann::json parsed = nlohmann::json::parse(text);\n  414 | \t\tstd::string logURL = parsed[\"url\"];\n  415 | \n  416 | \t\temit app->logUploadFinished(uploadType, QString::fromStdString(logURL));\n  417 | \t}\n  418 | }","lines":13,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_MainControls.cpp#L406-L418"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `on_actionRemoveProfile_triggered` and `on_actionRemoveSceneCollection_triggered`, the `try` block acquires the current profile/collection and erases it from the map, but the `catch` blocks only log. If `GetCurrentProfile()`/`GetCurrentSceneCollection()` throws (e.g. stale/corrupt `Basic->Profile` config), control falls through past the catch to `profiles.begin()->second` + `ActivateProfile(newProfile, true)` + `RemoveProfile(currentProfile)` with a default-constructed `currentProfile` whose `path` is empty. `RemoveProfile` then calls `std::filesystem::remove_all(\"\")` and throws an uncaught `std::logic_error`, and the just-emitted `OBS_FRONTEND_EVENT_PROFILE_CHANGING` is not balanced by a real change.","fix":"Return early on failure instead of falling through, e.g. set a success flag inside the try (or move the post-processing into the try block) so the activation/removal only runs when a valid current profile/collection was obtained.","locations":[{"ref":"frontend/widgets/OBSBasic_Profiles.cpp:507-552","code":"  507 | void OBSBasic::on_actionRemoveProfile_triggered(bool skipConfirmation)\n  508 | {\n  509 | \tif (profiles.size() < 2) {\n  510 | \t\treturn;\n  511 | \t}\n  512 | \n  513 | \tOBSProfile currentProfile;\n  514 | \n  515 | \ttry {\n  516 | \t\tcurrentProfile = GetCurrentProfile();\n  517 | \n  518 | \t\tif (!skipConfirmation) {\n  519 | \t\t\tconst QString confirmationText =\n  520 | \t\t\t\tQTStr(\"ConfirmRemove.Text\").arg(QString::fromStdString(currentProfile.name));\n  521 | \n  522 | \t\t\tconst QMessageBox::StandardButton button =\n  523 | \t\t\t\tOBSMessageBox::question(this, QTStr(\"ConfirmRemove.Title\"), confirmationText);\n  524 | \n  525 | \t\t\tif (button == QMessageBox::No) {\n  526 | \t\t\t\treturn;\n  527 | \t\t\t}\n  528 | \t\t}\n  529 | \n  530 | \t\tOnEvent(OBS_FRONTEND_EVENT_PROFILE_CHANGING);\n  531 | \n  532 | \t\tprofiles.erase(currentProfile.name);\n  533 | \t} catch (const std::invalid_argument &error) {\n  534 | \t\tblog(LOG_ERROR, \"%s\", error.what());\n  535 | \t} catch (const std::logic_error &error) {\n  536 | \t\tblog(LOG_ERROR, \"%s\", error.what());\n  537 | \t}\n  538 | \n  539 | \tconst OBSProfile &newProfile = profiles.begin()->second;\n  540 | \n  541 | \tActivateProfile(newProfile, true);\n  542 | \tRemoveProfile(currentProfile);\n  543 | \n  544 | #ifdef YOUTUBE_ENABLED\n  545 | \tif (YouTubeAppDock::IsYTServiceSelected() && !youtubeAppDock) {\n  546 | \t\tNewYouTubeAppDock();\n  547 | \t}\n  548 | #endif\n  549 | \n  550 | \tblog(LOG_INFO, \"Switched to profile '%s' (%s)\", newProfile.name.c_str(), newProfile.directoryName.c_str());\n  551 | \tblog(LOG_INFO, \"------------------------------------------------\");\n  552 | }","lines":46,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_Profiles.cpp#L507-L552"},{"ref":"frontend/widgets/OBSBasic_SceneCollections.cpp:594-633","code":"  594 | void OBSBasic::on_actionRemoveSceneCollection_triggered(bool skipConfirmation)\n  595 | {\n  596 | \tif (collections.size() < 2) {\n  597 | \t\treturn;\n  598 | \t}\n  599 | \n  600 | \tSceneCollection currentCollection;\n  601 | \n  602 | \ttry {\n  603 | \t\tcurrentCollection = GetCurrentSceneCollection();\n  604 | \n  605 | \t\tif (!skipConfirmation) {\n  606 | \t\t\tconst QString confirmationText =\n  607 | \t\t\t\tQTStr(\"ConfirmRemove.Text\").arg(QString::fromStdString(currentCollection.getName()));\n  608 | \t\t\tconst QMessageBox::StandardButton button =\n  609 | \t\t\t\tOBSMessageBox::question(this, QTStr(\"ConfirmRemove.Title\"), confirmationText);\n  610 | \n  611 | \t\t\tif (button == QMessageBox::No) {\n  612 | \t\t\t\treturn;\n  613 | \t\t\t}\n  614 | \t\t}\n  615 | \n  616 | \t\tOnEvent(OBS_FRONTEND_EVENT_SCENE_COLLECTION_CHANGING);\n  617 | \n  618 | \t\tcollections.erase(currentCollection.getName());\n  619 | \t} catch (const std::invalid_argument &error) {\n  620 | \t\tblog(LOG_ERROR, \"%s\", error.what());\n  621 | \t} catch (const std::logic_error &error) {\n  622 | \t\tblog(LOG_ERROR, \"%s\", error.what());\n  623 | \t}\n  624 | \n  625 | \tSceneCollection &newCollection = collections.begin()->second;\n  626 | \n  627 | \tActivateSceneCollection(newCollection);\n  628 | \tRemoveSceneCollection(currentCollection);\n  629 | \n  630 | \tblog(LOG_INFO, \"Switched to scene collection '%s' (%s)\", newCollection.getName().c_str(),\n  631 | \t     newCollection.getFileName().c_str());\n  632 | \tblog(LOG_INFO, \"------------------------------------------------\");\n  633 | }","lines":40,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/frontend/widgets/OBSBasic_SceneCollections.cpp#L594-L633"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `obs_module_load_locale`, when `obs_find_module_file` returns NULL (the locale file does not exist), `text_lookup_add(lookup, NULL)` is called at line 885. `text_lookup_add` returns false on NULL input, which then unconditionally logs a warning at line 886. This produces a spurious warning every time a module does not ship a translation for the requested locale, which is the normal case when a translation is simply not yet available.","fix":"Guard the call to skip both the lookup attempt and the warning when no file was found:\n```c\nfile = obs_find_module_file(module, str.array);\n\nif (file && !text_lookup_add(lookup, file))\n    blog(LOG_WARNING, \"Failed to load '%s' text for module: '%s'\",\n         locale, module->file);\n\nbfree(file);\n```","locations":[{"ref":"libobs/obs-module.c:884-887","code":"  884 | \tfile = obs_find_module_file(module, str.array);\n  885 | \n  886 | \tif (!text_lookup_add(lookup, file))\n  887 | \t\tblog(LOG_WARNING, \"Failed to load '%s' text for module: '%s'\", locale, module->file);","lines":4,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-module.c#L884-L887"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`obs_nix_wayland_hotkeys_platform_init` does not check the return value of\n`xkb_context_new`, which can return NULL on failure (e.g. OOM). A NULL context is then\nstored in `plat->xkb_context` and passed unchecked to `xkb_keymap_new_from_string` later\n(in the `keymap` callback), which would crash. Additionally, `wl_display_get_registry` can\nreturn NULL if the display is disconnected, and that NULL is immediately passed to\n`wl_registry_add_listener` without checking.","fix":"Add NULL checks after each fallible allocation:\n\n```c\nhotkeys->platform_context->xkb_context =\n    xkb_context_new(XKB_CONTEXT_NO_FLAGS);\nif (!hotkeys->platform_context->xkb_context) {\n    blog(LOG_ERROR, \"[wayland] failed to create xkb context\");\n    bfree(hotkeys->platform_context);\n    hotkeys->platform_context = NULL;\n    return false;\n}\n\nstruct wl_registry *registry = wl_display_get_registry(display);\nif (!registry) {\n    blog(LOG_ERROR, \"[wayland] failed to get Wayland registry\");\n    // cleanup ...\n    return false;\n}\n```","locations":[{"ref":"libobs/obs-nix-wayland.c:239-250","code":"  239 | static bool obs_nix_wayland_hotkeys_platform_init(struct obs_core_hotkeys *hotkeys)\n  240 | {\n  241 | \tstruct wl_display *display = obs_get_nix_platform_display();\n  242 | \thotkeys->platform_context = bzalloc(sizeof(obs_hotkeys_platform_t));\n  243 | \thotkeys->platform_context->display = display;\n  244 | \thotkeys->platform_context->xkb_context = xkb_context_new(XKB_CONTEXT_NO_FLAGS);\n  245 | \n  246 | \tstruct wl_registry *registry = wl_display_get_registry(display);\n  247 | \twl_registry_add_listener(registry, &registry_listener, hotkeys->platform_context);\n  248 | \twl_display_roundtrip(display);\n  249 | \treturn true;\n  250 | }","lines":12,"link":"https://github.com/obsproject/obs-studio/blob/012c6c23c73283ee5591ae00d08af14d9eeb8279/libobs/obs-nix-wayland.c#L239-L250"}]},
