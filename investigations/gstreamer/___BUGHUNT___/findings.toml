[[finding]]
id          = "ERR_29"
type        = "incorrect_error_handling"
severity    = "low"
difficulty  = "very_easy"
description = "`gst_dash_demux_update_manifest_data` calls `gst_buffer_map (buffer, &mapinfo, GST_MAP_READ);` without checking its boolean return value, unlike the sibling function `gst_dash_demux_process_manifest` which does check it (`if (gst_buffer_map (buf, &mapinfo, GST_MAP_READ)) { ... } else { GST_WARNING_OBJECT (...); }`). If the map fails, `mapinfo.data`/`mapinfo.size` are zeroed by `gst_buffer_map`, and `gst_mpd_client_parse` is then called on an effectively empty buffer, silently masking a mapping failure as a manifest parse failure instead of reporting/handling it explicitly."
