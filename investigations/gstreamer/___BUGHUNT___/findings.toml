[[finding]]
id          = "CPY_17"
type        = "copy_paste"
severity    = "negligible"
difficulty  = "very_easy"
description = "In `_get_supported_sets`, `cpuid.sse2` is assigned twice in a row with the identical expression `regs1[3] >> 26 & sse_state_os_enabled`. The second assignment is a redundant copy-paste leftover that has no effect but obscures intent (and likely another field, e.g. `cpuid.mmx`/`cpuid.sse3`, was meant to use a different bit at that spot)."
locations   = ["subprojects/gstreamer/gst/gstcpuid.c:248-249"]
