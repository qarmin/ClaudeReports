fix         = "Remove the dead `#if 0` blocks entirely (the `index` field in `GstBinPrivate`, the `gst_bin_get_index_func`/`gst_bin_set_index_func` declarations and bodies, their vmethod hookups, and the index-propagation snippet in `gst_bin_add_func`). If `GstIndex` is gone from the public API, there is no reason to keep the disabled implementation around."

[[finding]]
