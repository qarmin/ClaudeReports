[[finding]]
id          = "API_1"
type        = "api_misuse"
severity    = "critical"
difficulty  = "medium"
description = "In `gst_dash_sink_release_pad`, `peer = gst_pad_get_peer (pad)` fetches the *external* peer of the `GstDashSink` ghost pad `pad` (i.e. whatever upstream element is linked to it from outside the bin), not the internal request pad that `gst_element_request_pad_simple (stream->splitmuxsink, split_pad_name)` created inside `gst_dash_sink_request_new_pad`. The code then calls `gst_element_release_request_pad (stream->splitmuxsink, pad)`, passing the *ghost pad itself* (which belongs to `sink`, not to `stream->splitmuxsink`) as the pad to release. Both `gstdashsink.c` and `gstsplitmuxsink.c` register their per-pad context under the exact same `GQuark` string `\"splitmuxsink-pad-context\"` (`PAD_CONTEXT = g_quark_from_static_string (\"splitmuxsink-pad-context\")`). Since `pad`'s qdata for that quark was set to a `GstDashSinkStream *` in `gst_dash_sink_request_new_pad` (`g_object_set_qdata ((GObject *) (pad), PAD_CONTEXT, stream);`), `gst_splitmux_sink_release_pad` (invoked as `element->release_pad(stream->splitmuxsink, pad)`) will do `MqStreamCtx *ctx = g_object_get_qdata ((GObject *) (pad), PAD_CONTEXT);` and misinterpret the `GstDashSinkStream *` as an `MqStreamCtx *`, then dereference `ctx->srcpad`, `ctx->flushing`, `ctx->sink_pad_block_id`, etc. This is type confusion over unrelated struct layouts and will read/write garbage memory whenever a `dashsink` request pad that is actually linked is released (i.e. essentially any normal teardown of a running pipeline)."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstdashsink.c:1116-1163", "subprojects/gst-plugins-bad/ext/dash/gstdashsink.c:1128-1131"]
fix         = "Release the ghost pad's actual internal target pad instead of the ghost pad itself, e.g.:\n\nBefore:\n```c\npeer = gst_pad_get_peer (pad);\nif (peer) {\n    gst_element_release_request_pad (stream->splitmuxsink, pad);\n    gst_object_unref (peer);\n}\n```\n\nAfter:\n```c\nGstPad *target = gst_ghost_pad_get_target (GST_GHOST_PAD (pad));\nif (target) {\n    gst_element_release_request_pad (stream->splitmuxsink, target);\n    gst_object_unref (target);\n}\n```"

[[finding]]
id          = "API_2"
type        = "api_misuse"
severity    = "critical"
difficulty  = "medium"
description = "`gst_gl_differencematte_loader` calls `png_create_read_struct`, `png_read_info`, `png_read_image`, and `png_read_end` without ever calling `setjmp (png_jmpbuf (png_ptr))`. Per libpng's documented API contract, if the caller does not establish this jump target before invoking read functions, any internal `png_error()` call (triggered by a truncated, corrupt, or otherwise malformed PNG supplied via the public `location` property) performs a `longjmp` into an uninitialized `jmp_buf`, which is undefined behaviour and typically crashes the process abnormally instead of being handled by the existing `LOAD_ERROR`/`user_warning_fn` error paths. Unlike the (unbuilt) `gstglbumper.c`, this file is actively compiled into the `opengl` plugin whenever `libpng` is found, so this is reachable in production by pointing `gldifferencematte`'s `location` property at a malformed PNG file."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldifferencematte.c:515-596"]
fix         = "Add the required setjmp/longjmp target right after creating the png_ptr:\n```c\npng_ptr = png_create_read_struct (PNG_LIBPNG_VER_STRING, NULL, NULL, NULL);\nif (png_ptr == NULL) { ... }\nif (setjmp (png_jmpbuf (png_ptr))) {\n  fclose (fp);\n  png_destroy_read_struct (&png_ptr, &info_ptr, NULL);\n  LOAD_ERROR (\"error decoding PNG\");\n}\n```"

[[finding]]
id          = "API_3"
type        = "api_misuse"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_validate_report_new()`, `runner` is obtained via `gst_validate_reporter_get_runner (reporter)`, which is documented as `(transfer full) (nullable)` and is implemented with `g_weak_ref_get()`, so it legitimately returns `NULL` once the runner has been finalized (the surrounding comment in this very function even explains that reports can still be created/used after the reporter's runner is gone). Despite that, `gst_object_unref (runner)` is called unconditionally on line 971 with no `NULL` check, unlike the equivalent call in `gst_validate_report_valist()` (`gst-validate-reporter.c`) which correctly guards with `if (runner) gst_object_unref (runner);`. `gst_object_unref()`/`g_object_unref()` asserts `object != NULL` via `g_return_if_fail`, so this path emits a `G_LOG_LEVEL_CRITICAL`. Since `gst_validate_reporter_set_handle_g_logs()` installs a log handler that turns such criticals back into a new `GST_VALIDATE_REPORT(..., G_LOG_CRITICAL, ...)`, this can trigger reentrant/recursive report generation (which itself calls `gst_validate_report_new()` again) every time a report is created for a reporter whose runner has already disappeared."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-report.c:944-971"]
fix         = "Guard the unref like it is done in `gst_validate_report_valist`. Before: `default_details = gst_validate_runner_get_default_reporting_details (runner);\\n  gst_object_unref (runner);`. After: `default_details = gst_validate_runner_get_default_reporting_details (runner);\\n  if (runner)\\n    gst_object_unref (runner);`"

[[finding]]
id          = "API_4"
type        = "api_misuse"
severity    = "high"
difficulty  = "very_easy"
description = "In `ges_effect_class_register_rate_property()` (`ges-effect.c`), `pspec` is obtained via `g_object_class_find_property (G_OBJECT_GET_CLASS (element), property_name)`, which per GLib docs returns a `(transfer none)` pointer owned by the element's `GObjectClass`. The cleanup code then calls `g_param_spec_unref (pspec)` on it, which decrements the refcount of a `GParamSpec` that is shared by every instance of that `GType` for the lifetime of the process (installed once via `g_object_class_install_property`). This is called for `scaletempo::rate`, `pitch::tempo`, `pitch::rate` and `videorate::rate` from `ges_effect_class_init()`, so on every GES process that constructs a `GESEffect`, four global `GParamSpec`s belonging to unrelated GStreamer elements (`GstPitch`, `GstVideoRate`, `scaletempo`) get their refcount wrongly decremented, which can free them prematurely and cause a use-after-free the next time any code (in GES or elsewhere in the process) queries/uses that property."
locations   = ["subprojects/gst-editing-services/ges/ges-effect.c:468-471", "subprojects/gst-editing-services/ges/ges-effect.c:501-507"]
fix         = "Do not unref a `(transfer none)` result. Change:\n```c\nfail:\n  if (element_factory != NULL)\n    gst_object_unref (element_factory);\n  if (element != NULL)\n    gst_object_unref (element);\n  if (pspec != NULL)\n    g_param_spec_unref (pspec);\n\n  return res;\n```\nto:\n```c\nfail:\n  if (element_factory != NULL)\n    gst_object_unref (element_factory);\n  if (element != NULL)\n    gst_object_unref (element);\n\n  return res;\n```"

[[finding]]
id          = "API_5"
type        = "api_misuse"
severity    = "high"
difficulty  = "medium"
description = "In `ges_pitivi_formatter_init` (`subprojects/gst-editing-services/ges/ges-pitivi-formatter.c:757-758`), `priv->layers_table` is created with `g_hash_table_new_full (g_int_hash, g_str_equal, g_free, gst_object_unref)`. The hash function `g_int_hash` treats keys as pointers to a `gint`, but the equality function `g_str_equal` treats keys as NUL-terminated C strings and calls `strcmp` on them. Since the keys inserted into this table (`gint *`/`guint64 *` priorities, see `ges-pitivi-formatter.c:479-480` and `:634`) are raw binary integers, not NUL-terminated text, `g_str_equal` will run `strcmp` past the end of the small allocated integer buffers looking for a NUL byte, causing undefined behavior/out-of-bounds heap reads, and will also produce incorrect equality results (lookups by priority will essentially never work correctly), causing duplicate `GESLayer` objects to be created for what should be the same priority layer."
locations   = ["subprojects/gst-editing-services/ges/ges-pitivi-formatter.c:757-758"]
fix         = "Use matching hash/equal functions for integer keys, e.g. `priv->layers_table = g_hash_table_new_full (g_int_hash, g_int_equal, g_free, gst_object_unref);` (and make sure all keys inserted are consistently sized `gint` to match `g_int_hash`/`g_int_equal`)."

[[finding]]
id          = "API_6"
type        = "api_misuse"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_ffmpegaudenc_handle_frame`'s `not_negotiated` error path, `gst_buffer_unref (inbuf)` is called on the `inbuf` parameter even though no extra reference has been taken on it yet at that point (the `inbuf = gst_buffer_ref (inbuf);` call happens later in the function, after the `!ffmpegaudenc->context` check that jumps to this label). Per `GstAudioEncoderClass::handle_frame` documented semantics (\"Input data ref management is performed by base class, subclass should not care or intervene\"), the subclass must not unref the buffer it was handed. This extra `gst_buffer_unref` causes a reference-count underflow on the buffer owned by `GstAudioEncoder`, leading to premature destruction / use-after-free of that buffer when the base class subsequently accesses or unrefs it. The equivalent `not_negotiated` handler in `gst_ffmpegauddec_handle_frame` (`gstavauddec.c`) correctly does not unref `inbuf`."
locations   = ["subprojects/gst-libav/ext/libav/gstavaudenc.c:742-748"]
fix         = "Remove the erroneous unref. Before:\n```\nnot_negotiated:\n  {\n    GST_ELEMENT_ERROR (ffmpegaudenc, CORE, NEGOTIATION, (NULL),\n        (\"not configured to input format before data start\"));\n    gst_buffer_unref (inbuf);\n    return GST_FLOW_NOT_NEGOTIATED;\n  }\n```\nAfter:\n```\nnot_negotiated:\n  {\n    GST_ELEMENT_ERROR (ffmpegaudenc, CORE, NEGOTIATION, (NULL),\n        (\"not configured to input format before data start\"));\n    return GST_FLOW_NOT_NEGOTIATED;\n  }\n```"

[[finding]]
id          = "API_7"
type        = "api_misuse"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_avtp_src_fill()`, `gst_buffer_unmap (buffer, &map)` is called unconditionally right after `g_socket_receive()` (line 354), and then it is called a **second time** inside the `if (gerr)` error branch (line 365) on the very same already-unmapped `GstMapInfo`. `gst_buffer_unmap()`/`gst_map_info_clear()` is not designed to be called twice on the same already-cleared `GstMapInfo` (its memory/mapped-count bookkeeping is only guarded against being called on a never-mapped, zero-initialized `GstMapInfo`, not against being called twice on one that was already unmapped). This double-unmap corrupts the `GstMemory` map-count/lock state of `buffer`, which is reachable any time the socket read fails with a non-`BUSY`/`CANCELLED` error (e.g. interface down, permission revoked, `ENETDOWN`), producing `GLib` critical warnings and undefined behaviour on the shared `GstMemory` state (potential use of buffer memory that GStreamer's refcounting now considers unmapped/freed prematurely)."
locations   = ["subprojects/gst-plugins-bad/ext/avtp/gstavtpsrc.c:349-369"]
fix         = "Remove the redundant second call in the error branch, e.g.:\n```c\n  if (gerr) {\n    GST_ELEMENT_ERROR (avtpsrc, RESOURCE, READ, (NULL),\n        (\"Failed to receive AVTPDU: %s\", gerr->message));\n    gst_buffer_unmap (buffer, &map);   /* <-- remove this line */\n    g_clear_error (&gerr);\n\n    return GST_FLOW_ERROR;\n  }\n```\nsince `buffer` was already unmapped a few lines above via `gst_buffer_unmap (buffer, &map);` (line 354)."

[[finding]]
id          = "API_8"
type        = "api_misuse"
severity    = "high"
difficulty  = "easy"
description = "In `add_device`, `card_name` is declared uninitialized (`gchar *card_name, *longname = NULL;`) and `snd_card_get_name (card, &card_name)`'s return value is never checked. If `snd_card_get_name` fails, `card_name` is left pointing at indeterminate stack memory, which is then passed to `gst_structure_new` as a `G_TYPE_STRING` value (read as a NUL-terminated string) and subsequently passed to `free (card_name)`, both of which are undefined behaviour on a garbage pointer."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsadeviceprovider.c:53-75"]
fix         = "Initialize and check the result: ```c\ngchar *card_name = NULL, *longname = NULL;\n...\nif (snd_card_get_name (card, &card_name) < 0)\n  card_name = g_strdup (\"Unknown\");\n```"

[[finding]]
id          = "API_9"
type        = "api_misuse"
severity    = "high"
difficulty  = "medium"
description = "`gst_gl_bumper_init_resources` calls `png_create_read_struct`, `png_read_info`, `png_read_image`, and `png_read_end` without ever calling `setjmp (png_jmpbuf (png_ptr))`. Per libpng's documented contract, if the application does not establish this jump target, any internal `png_error()` (triggered by a truncated/corrupt/malformed PNG file) longjmps into an uninitialized `jmp_buf`, which is undefined behaviour and typically crashes the process instead of being caught by the `user_warning_fn`/error paths already written in this function. (Currently unreachable since `gstglbumper.c` is excluded from the build, see the separate dead-code finding.)"
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglbumper.c:200-245"]
fix         = "Establish the libpng error jump target right after creating the read struct:\n```c\npng_ptr = png_create_read_struct (PNG_LIBPNG_VER_STRING, NULL, NULL, NULL);\nif (png_ptr == NULL) { ... }\nif (setjmp (png_jmpbuf (png_ptr))) {\n  fclose (fp);\n  png_destroy_read_struct (&png_ptr, &info_ptr, NULL);\n  LOAD_ERROR (context, \"error decoding PNG\");\n}\n```"

[[finding]]
id          = "API_10"
type        = "api_misuse"
severity    = "high"
difficulty  = "very_easy"
description = "`GstGLFilterClass::filter_texture` is declared as `gboolean (*filter_texture) (GstGLFilter *filter, GstGLMemory *input, GstGLMemory *output)` in `gstglfilter.h`, but `gstglfilterreflectedscreen.c` declares and installs `gst_gl_filter_reflected_screen_filter_texture` with the incompatible signature `gboolean (GstGLFilter * filter, guint in_tex, guint out_tex)`, assigning it directly to `GST_GL_FILTER_CLASS (klass)->filter_texture`. If this code were ever invoked (it currently is not, since the `.c` file is missing from the build - see the related `dead_code` finding), the base class would call it with two `GstGLMemory *` pointers while the callee treats them as `guint`, truncating/misinterpreting the pointer values as raw GL texture IDs and passing garbage into `gst_gl_context_use_fbo()`."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglfilterreflectedscreen.c:72-73", "subprojects/gst-plugins-base/ext/gl/gstglfilterreflectedscreen.c:104-105", "subprojects/gst-plugins-base/ext/gl/gstglfilterreflectedscreen.c:232-253"]
fix         = "Update the function to match the current `filter_texture` vfunc signature, e.g.:\n```c\nstatic gboolean\ngst_gl_filter_reflected_screen_filter_texture (GstGLFilter * filter,\n    GstGLMemory * in_tex, GstGLMemory * out_tex)\n{\n  ...\n  gst_gl_context_use_fbo (filter->context,\n      GST_VIDEO_INFO_WIDTH (&filter->out_info),\n      GST_VIDEO_INFO_HEIGHT (&filter->out_info),\n      filter->fbo, filter->depthbuffer, out_tex->tex_id,\n      gst_gl_filter_reflected_screen_callback,\n      GST_VIDEO_INFO_WIDTH (&filter->in_info),\n      GST_VIDEO_INFO_HEIGHT (&filter->in_info), in_tex->tex_id,\n      ...);\n  return TRUE;\n}\n```\n(this element also predates the current `GstGLFilter`/FBO API - e.g. `gst_gl_context_use_fbo` no longer exists - so reviving it will need more than the signature fix)."

[[finding]]
id          = "API_11"
type        = "api_misuse"
severity    = "medium"
difficulty  = "easy"
description = "In `check_playback_scenario` and `check_track_selection` (`subprojects/gst-devtools/validate/gst/validate/gst-validate-media-info.c`), if `gst_element_factory_make` fails for `playbin`, `videosink` or `audiosink`, the code only sets `*error_message` but does not return; it then proceeds to call `g_object_set (playbin, ...)`, `gst_pipeline_get_bus (GST_PIPELINE (playbin))`, and `gst_element_set_state (playbin, ...)` with potentially `NULL` element(s), leading to GLib/GStreamer critical warnings and continued execution on invalid objects instead of a clean early failure."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-media-info.c:523-532", "subprojects/gst-devtools/validate/gst/validate/gst-validate-media-info.c:880-889"]
fix         = "Return early after reporting the missing-element error, e.g.:\n```c\n  if (!playbin || !videosink || !audiosink) {\n    *error_message = g_strdup (\"Playbin and/or fakesink not available\");\n    g_clear_object (&playbin);\n    g_clear_object (&videosink);\n    g_clear_object (&audiosink);\n    return FALSE;\n  }\n```"

[[finding]]
id          = "API_12"
type        = "api_misuse"
severity    = "medium"
difficulty  = "easy"
description = "In `_execute_on_sub_scenario`, `gst_validate_action_get_execution_scenario()` sets `*target_scenario` (i.e. `execution_scenario`) to `NULL` via `g_clear_object()` whenever it returns an error (both `err:` paths). The caller then does `gst_object_unref (execution_scenario)` unconditionally in that error branch, which calls `gst_object_unref (NULL)`. `gst_object_unref()` does `g_return_if_fail (object != NULL)`, so this triggers a GLib critical warning (and aborts the process if `G_DEBUG=fatal-warnings` is set, as is common in GStreamer's own test/CI environments) every time the referenced sub-pipeline/scenario cannot be found."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:2916-2931"]
fix         = "Use `gst_clear_object` instead of an unconditional unref. Before: `if (res != GST_VALIDATE_EXECUTE_ACTION_OK) {\\n    GST_ERROR (\"Action %\" GST_PTR_FORMAT \" could not get execution scenario\",\\n        action->structure);\\n\\n    gst_object_unref (execution_scenario);\\n    return res;\\n  }` After: `if (res != GST_VALIDATE_EXECUTE_ACTION_OK) {\\n    GST_ERROR (\"Action %\" GST_PTR_FORMAT \" could not get execution scenario\",\\n        action->structure);\\n\\n    gst_clear_object (&execution_scenario);\\n    return res;\\n  }`"

[[finding]]
id          = "API_13"
type        = "api_misuse"
severity    = "medium"
difficulty  = "very_easy"
description = "In `nle_source_prepare`, the branch that handles `!priv->staticpad && !(get_valid_src_pad (...))` calls `gst_object_unref (parent)` unconditionally, whereas the sibling `!source->element` branch just above correctly guards the same call with `if (parent)`. `parent` comes from `gst_element_get_parent ((GstElement *) object)`, which returns `NULL` whenever the `NleSource` currently has no parent (e.g. it is being prepared/state-changed outside of any bin/composition, which is a supported/tested scenario). `gst_object_unref (NULL)` triggers a `g_return_if_fail` critical warning (and is fatal under `G_DEBUG=fatal-warnings`/`fatal-criticals`, commonly used in GStreamer's own test/CI setups)."
locations   = ["subprojects/gst-editing-services/plugins/nle/nlesource.c:617-621"]
fix         = "Guard the unref like the branch above it:\n```\nif (!priv->staticpad && !(get_valid_src_pad (source, source->element, &pad))) {\n  GST_DEBUG_OBJECT (source, \"Couldn't find a valid source pad\");\n  if (parent)\n    gst_object_unref (parent);\n  return FALSE;\n}\n```"

[[finding]]
id          = "API_14"
type        = "api_misuse"
severity    = "medium"
difficulty  = "medium"
description = "`gst_gtk_wayland_sink_navigation_send_event` calls `gst_gtk_wayland_sink_get_widget (self)` directly instead of the thread-safe wrapper `gst_gtk_wayland_sink_acquire_widget (self)` that every other call site in the file uses (see `gst_gtk_wayland_sink_get_property` and `gst_gtk_wayland_sink_start_on_main`). `gst_gtk_wayland_sink_get_widget` calls GTK API (`gtk_init_check`, `gtk_gst_wayland_widget_new`) and writes `priv->gtk_widget` without holding `GST_OBJECT_LOCK`, relying on being invoked exclusively from the GTK main thread via `gst_gtk_invoke_on_main`. `gst_navigation_send_event_simple` (the `GstNavigation` vfunc implemented here) is a public interface that applications can invoke from any thread, not only from the widget's own GTK event callbacks. When called off the GTK main loop thread, this results in unsynchronized GTK API calls from a non-main thread and an unlocked write to `priv->gtk_widget` racing with the `GST_OBJECT_LOCK`-protected reads/writes in `gst_gtk_wayland_sink_acquire_widget` and `gst_gtk_wayland_sink_set_caps`."
locations   = ["subprojects/gst-plugins-bad/ext/gtk/gstgtkwaylandsink.c:574-576"]
fix         = "Use the thread-safe accessor instead:\n```c\n    GtkGstBaseWidget *widget =\n        GTK_GST_BASE_WIDGET (gst_gtk_wayland_sink_get_widget (self));\n```\nbecomes\n```c\n    GtkGstBaseWidget *widget =\n        GTK_GST_BASE_WIDGET (gst_gtk_wayland_sink_acquire_widget (self));\n```"

[[finding]]
id          = "API_15"
type        = "api_misuse"
severity    = "medium"
difficulty  = "medium"
description = "`build_json_props` in `gstlcevcencoder.c` calls `strtok (priv->plugin_props, \";\")` directly on the stored property string instead of on a copy. `strtok` destructively overwrites the `;` delimiters in-place with `\\0`. As a result, after the first call to `build_json_props` (from `gst_lcevc_encoder_set_format`), `priv->plugin_props` is permanently truncated to only its first `key=value` entry: a subsequent `g_object_get (encoder, \"plugin-props\", ...)` returns a truncated string, and if `set_format` runs again (e.g. on caps renegotiation), only the first plugin property is applied instead of all of them."
locations   = ["subprojects/gst-plugins-bad/ext/lcevcencoder/gstlcevcencoder.c:442-443"]
fix         = "Operate on a duplicate of the string instead of the stored property, e.g.: `gchar *props_copy = g_strdup (priv->plugin_props); key_value = strtok (props_copy, \";\"); ...` and `g_free (props_copy);` when done, leaving `priv->plugin_props` untouched."

[[finding]]
id          = "API_16"
type        = "api_misuse"
severity    = "medium"
difficulty  = "very_easy"
description = "In `rsn_dec_change_state`, `new_child = gst_element_factory_make (\"autoconvert\", NULL);` may return `NULL` (e.g. if the `coreelements`/`autoconvert` plugin is not installed). The code immediately calls `g_object_set (G_OBJECT (new_child), \"factories\", decoder_factories, NULL);` before checking `new_child == NULL` on the following line, so the property is set on a `NULL` `GObject`."
locations   = ["subprojects/gst-plugins-bad/ext/resindvd/rsndec.c:312-316"]
fix         = "Check `new_child` for `NULL` before using it:\n```c\n// Before\nnew_child = gst_element_factory_make (\"autoconvert\", NULL);\ndecoder_factories = klass->get_decoder_factories (klass);\ng_object_set (G_OBJECT (new_child), \"factories\", decoder_factories, NULL);\nif (new_child == NULL || !rsn_dec_set_child (self, new_child))\n  ret = GST_STATE_CHANGE_FAILURE;\n\n// After\nnew_child = gst_element_factory_make (\"autoconvert\", NULL);\nif (new_child == NULL) {\n  ret = GST_STATE_CHANGE_FAILURE;\n  break;\n}\ndecoder_factories = klass->get_decoder_factories (klass);\ng_object_set (G_OBJECT (new_child), \"factories\", decoder_factories, NULL);\nif (!rsn_dec_set_child (self, new_child))\n  ret = GST_STATE_CHANGE_FAILURE;\n```"

[[finding]]
id          = "API_17"
type        = "api_misuse"
severity    = "medium"
difficulty  = "easy"
description = "In `_ensure_gl_setup`'s `context_error` label, `gst_object_unref (ca_sink->context)` is called unconditionally, but `ca_sink->context` is only reached here because `gst_gl_display_create_context` failed - and that function only ever sets its out-parameter `*p_context` on success (see `gst_gl_display_create_context` in `gstgldisplay.c`, which returns `FALSE` without touching `*p_context` on all failure paths). Since `ca_sink->context` was `NULL` before the call (guarded by `if (!ca_sink->context)`), it is still `NULL` here, so this unrefs a NULL pointer; `gst_object_unref`/`g_object_unref` does `g_return_if_fail (object != NULL)`, producing a GLib critical warning (and aborting under `G_DEBUG=fatal-criticals` / typical test harnesses)."
locations   = ["subprojects/gst-plugins-base/ext/gl/caopengllayersink.m:363-394"]
fix         = "Guard the unref or use `g_clear_object`: ```c\ncontext_error:\n{\n  GST_ELEMENT_ERROR (ca_sink, RESOURCE, NOT_FOUND, (\"%s\", error->message), (NULL));\n  g_clear_error (&error);\n  g_clear_object (&ca_sink->context);\n  return FALSE;\n}\n```"

[[finding]]
id          = "API_18"
type        = "api_misuse"
severity    = "medium"
difficulty  = "easy"
description = "`gst_gl_mixer_bin_request_new_pad` releases the freshly requested mixer pad twice on the error path. When `_create_input_chain` fails it calls `gst_element_release_request_pad (self->mixer, mixer_pad)` itself and then calls `_free_input_chain (chain)`, but `_create_input_chain` had already stored the same pointer in `chain->mixer_pad` (unconditionally, before any failure can occur), so `_free_input_chain` calls `gst_element_release_request_pad (chain->self->mixer, chain->mixer_pad)` a second time on the very same, already-released pad before unreffing it. This results in a spurious/incorrect second release of a pad that is no longer owned by the mixer, which is likely to trigger critical warnings or corrupt the mixer's internal pad bookkeeping."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglmixerbin.c:349-358", "subprojects/gst-plugins-base/ext/gl/gstglmixerbin.c:583-587", "subprojects/gst-plugins-base/ext/gl/gstglmixerbin.c:79-112"]
fix         = "Remove the duplicate release from the caller and let `_free_input_chain` be the single place that releases `chain->mixer_pad`:\n```c\nif (!_create_input_chain (self, chain, mixer_pad)) {\n  _free_input_chain (chain);\n  return NULL;\n}\n```\n(`_free_input_chain` already does `gst_element_release_request_pad (chain->self->mixer, chain->mixer_pad)` followed by `gst_object_unref`.)"

[[finding]]
id          = "API_19"
type        = "api_misuse"
severity    = "medium"
difficulty  = "easy"
description = "The `mvp-matrix` property on `gltransformation` is installed with `g_param_spec_boxed (..., G_PARAM_READWRITE | ...)` (`PROP_MVP`), and `gst_gl_transformation_get_property` handles `PROP_MVP`, but `gst_gl_transformation_set_property`'s `switch` statement has no `case PROP_MVP:` at all. Attempting to set the `mvp-matrix` property (e.g. `g_object_set (transformation, \"mvp-matrix\", &m, NULL)`) therefore silently falls through to `default:` and triggers `G_OBJECT_WARN_INVALID_PROPERTY_ID`, meaning a property advertised as read/write is in practice read-only despite no such restriction being documented or enforced via the param flags."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgltransformation.c:407-458", "subprojects/gst-plugins-base/ext/gl/gstgltransformation.c:238-242"]
fix         = "Either make the property explicitly read-only (`G_PARAM_READABLE` instead of `G_PARAM_READWRITE`), or implement the setter, e.g.:\n\n```c\ncase PROP_MVP:\n  graphene_matrix_init_from_matrix (filter->mvp_matrix,\n      (const graphene_matrix_t *) g_value_get_boxed (value));\n  break;\n```"

[[finding]]
id          = "API_20"
type        = "api_misuse"
severity    = "low"
difficulty  = "easy"
description = "In `gst_validate_ssim_compare_frames` (`subprojects/gst-devtools/validate/gst-libs/gst/video/gstvalidatessim.c`), `map1`/`map2` are obtained via `gst_buffer_map (converted_frame1.buffer, &map1, ...)` and `gst_buffer_map (converted_frame2.buffer, &map2, ...)`, but they are later released with `gst_buffer_unmap (ref_frame->buffer, &map1)` and `gst_buffer_unmap (frame->buffer, &map2)`. When a converter is in use (`convinfo1->converter`/`convinfo2->converter` non-NULL), `converted_frame1.buffer`/`converted_frame2.buffer` are freshly-allocated buffers distinct from `ref_frame->buffer`/`frame->buffer`, so the buffer passed to `gst_buffer_unmap` does not match the one that was mapped into the `GstMapInfo`. This currently 'works' only because `gst_buffer_unmap`'s implementation happens not to use its buffer argument beyond a type check, but it is a latent API-contract violation that is fragile against future implementation changes and misleading to maintainers."
locations   = ["subprojects/gst-devtools/validate/gst-libs/gst/video/gstvalidatessim.c:334-347", "subprojects/gst-devtools/validate/gst-libs/gst/video/gstvalidatessim.c:370-371"]
fix         = "Unmap the same buffer object that was mapped:\nBefore:\n```c\ngst_buffer_unmap (ref_frame->buffer, &map1);\ngst_buffer_unmap (frame->buffer, &map2);\n```\nAfter:\n```c\ngst_buffer_unmap (converted_frame1.buffer, &map1);\ngst_buffer_unmap (converted_frame2.buffer, &map2);\n```"

[[finding]]
id          = "API_21"
type        = "api_misuse"
severity    = "low"
difficulty  = "very_easy"
description = "In `buffer_get_meta_string` (`subprojects/gst-devtools/validate/gst/validate/flow/formatting.c`), `validate_flow_get_enum_nickname (GST_TYPE_AUDIO_CHANNEL_POSITION, GST_AUDIO_INFO_POSITION (&audio_meta->info, i))` can return `NULL` when the stored channel-position value does not correspond to any known `GstAudioChannelPosition` enum value (e.g. corrupted/out-of-range metadata). The result is passed straight to `g_string_append (s, position)` without a NULL check; `g_string_append` requires a non-NULL `val` (`g_return_if_fail (val != NULL)`), so this violates the API contract and emits a `g_critical`, which aborts under fatal-warnings mode."
locations   = ["subprojects/gst-devtools/validate/gst/validate/flow/formatting.c:382-386"]
fix         = "Fall back to a placeholder string when the nickname lookup fails:\nBefore:\n```c\ngchar *position =\n    validate_flow_get_enum_nickname (GST_TYPE_AUDIO_CHANNEL_POSITION,\n    GST_AUDIO_INFO_POSITION (&audio_meta->info, i));\ng_string_append (s, position);\ng_free (position);\n```\nAfter:\n```c\ngchar *position =\n    validate_flow_get_enum_nickname (GST_TYPE_AUDIO_CHANNEL_POSITION,\n    GST_AUDIO_INFO_POSITION (&audio_meta->info, i));\ng_string_append (s, position ? position : \"unknown\");\ng_free (position);\n```"

[[finding]]
id          = "API_22"
type        = "api_misuse"
severity    = "low"
difficulty  = "easy"
description = "`gst_validate_media_info_load` (`subprojects/gst-devtools/validate/gst/validate/gst-validate-media-info.c`) allocates and partially initializes `mi`, and on failure to read the mandatory `uri`/`file-size` keys it jumps to `end:` with `*err` set but still returns the non-`NULL`, partially-filled `mi` pointer instead of freeing it and returning `NULL`. This violates the standard GLib convention that a `GError`-reporting function returning a pointer must return `NULL` on error, and can cause callers who only check the return value (not `err`) to use an incomplete `GstValidateMediaInfo`."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-media-info.c:170-226"]
fix         = "Free `mi` and return `NULL` on the error paths, e.g. replace the shared `end:` label handling with a dedicated failure path:\n```c\n  mi->uri = g_key_file_get_string (kf, \"file-info\", \"uri\", err);\n  if (err && *err) {\n    gst_validate_media_info_free (mi);\n    g_key_file_free (kf);\n    return NULL;\n  }\n```\n(and similarly for the `file-size` check)."

[[finding]]
id          = "API_23"
type        = "api_misuse"
severity    = "low"
difficulty  = "medium"
description = "In `gst_validate_media_descriptor_writer_new_discover` (`media-descriptor-writer.c`), `writer` is declared and initialized to `NULL` and is only assigned inside the `if (streaminfo) { ... }` branch. If `gst_discoverer_info_get_stream_info (info)` returns `NULL`, the `else` branch runs `GST_VALIDATE_REPORT (writer, FILE_NO_STREAM_INFO, ...)` with `writer` still `NULL`, i.e. `gst_validate_report()` is called with a `NULL` `GstValidateReporter`. This triggers GLib critical warnings from `g_object_get_data`/`g_object_set_data_full` on a `NULL` object and leaks the freshly allocated `GstValidateReporterPrivate` (hash table + mutex) created inside `gst_validate_reporter_get_priv()` before the `NULL` check aborts the report."
locations   = ["subprojects/gst-devtools/validate/gst/validate/media-descriptor-writer.c:759-814"]
fix         = "Do not report through `writer` before it exists; e.g. use `GST_ERROR (\"Discoverer info does not contain the stream info\");` instead of `GST_VALIDATE_REPORT (writer, FILE_NO_STREAM_INFO, ...)` in that branch, or create `writer` before checking `streaminfo` so a valid reporter is always available."

[[finding]]
id          = "API_24"
type        = "api_misuse"
severity    = "low"
difficulty  = "easy"
description = "`gst_gl_bumper_reset_resources` and `gst_gl_bumper_callback` call the statically-linked `glDeleteTextures` and `gluLookAt` directly instead of going through `context->gl_vtable` (`gl->DeleteTextures`, etc.) like every other call in this file and the rest of the `ext/gl` plugin. Since GStreamer's GL backend dynamically resolves function pointers per-context/per-platform (desktop GL, GLES, different loaders), bypassing the vtable for these two calls is inconsistent with the codebase's abstraction and can call the wrong/unbound entry point on platforms where GL entry points aren't statically linked. `gluLookAt` additionally depends on the deprecated/optional GLU library which is not a declared dependency of this plugin. (Currently unreachable since `gstglbumper.c` is excluded from the build.)"
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglbumper.c:272", "subprojects/gst-plugins-base/ext/gl/gstglbumper.c:483"]
fix         = "Use `gl->DeleteTextures (1, &bumper->bumpmap);` via the resolved vtable, and replace `gluLookAt` with an equivalent manual matrix computation (or `gl->LoadMatrixf`) so the element does not require linking against GLU."

[[finding]]
id          = "API_25"
type        = "api_misuse"
severity    = "low"
difficulty  = "easy"
description = "`gst_glimage_sink_redisplay` calls `g_signal_handler_find (GST_ELEMENT_PARENT (gl_sink), G_SIGNAL_MATCH_ID, ...)` to check whether the surrounding `glsinkbin` has a `client-draw` handler connected. `glimagesink` is also registered standalone as `glimagesinkelement` (`GST_ELEMENT_REGISTER_DEFINE_WITH_CODE (glimagesinkelement, ...)`), in which case it may have no parent bin at all, and `GST_ELEMENT_PARENT (gl_sink)` is `NULL`. Passing `NULL` as the instance to `g_signal_handler_find` violates its `G_IS_OBJECT` precondition and triggers a GLib critical warning on every redisplay when the element is used without the wrapping bin."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglimagesink.c:2579-2596"]
fix         = "Guard the lookup with a `NULL` check on the parent:\n```c\nGstElement *parent = GST_ELEMENT_PARENT (gl_sink);\nhandler_id = parent ? g_signal_handler_find (parent, G_SIGNAL_MATCH_ID,\n    gst_gl_image_sink_bin_signals[SIGNAL_BIN_CLIENT_DRAW], 0,\n    NULL, NULL, NULL) : 0;\n```"

[[finding]]
id          = "API_26"
type        = "api_misuse"
severity    = "low"
difficulty  = "very_easy"
description = "`gst_device_provider_factory_get_metadata` dereferences `factory->metadata` with no argument validation at all, unlike its sibling `gst_device_provider_factory_get_metadata_keys` (and virtually every other public function in this file), which starts with `g_return_val_if_fail (GST_IS_DEVICE_PROVIDER_FACTORY (factory), NULL)`. Passing a `NULL` or invalid `factory` crashes instead of producing the usual `g_critical` diagnostic."
locations   = ["subprojects/gstreamer/gst/gstdeviceproviderfactory.c:418-423"]
fix         = "Add the same guard used elsewhere in the file:\n```c\nconst gchar *\ngst_device_provider_factory_get_metadata (GstDeviceProviderFactory * factory,\n    const gchar * key)\n{\n  g_return_val_if_fail (GST_IS_DEVICE_PROVIDER_FACTORY (factory), NULL);\n  g_return_val_if_fail (key != NULL, NULL);\n\n  return gst_structure_get_string ((GstStructure *) factory->metadata, key);\n}\n```"

[[finding]]
id          = "API_27"
type        = "api_misuse"
severity    = "low"
difficulty  = "medium"
description = "`GstLogContext::lock` (a plain `GMutex`, declared in the struct at `subprojects/gstreamer/gst/gstinfo.c:453-463`) is embedded in a heap-allocated (`g_new0`) structure but is never explicitly initialized with `g_mutex_init()` in `gst_log_context_builder_build()` (`gstinfo.c:3079-3099`), relying implicitly on `g_new0()` zero-filling it. Symmetrically, `_gst_log_context_free()` (`gstinfo.c:2913-2927`) never calls `g_mutex_clear()` on `ctx->lock` before `g_free (ctx)`. Per the documented `GMutex` contract, a dynamically-allocated mutex must be paired `g_mutex_init()`/`g_mutex_clear()`; skipping `g_mutex_clear()` can leak backend resources on platforms where `GMutex` lazily allocates real OS objects."
locations   = ["subprojects/gstreamer/gst/gstinfo.c:453-463", "subprojects/gstreamer/gst/gstinfo.c:2913-2927", "subprojects/gstreamer/gst/gstinfo.c:3079-3099"]
fix         = "Call `g_mutex_init (&ctx->lock);` in `gst_log_context_builder_build()` right after `g_new0`, and `g_mutex_clear (&ctx->lock);` in `_gst_log_context_free()` right before `g_free (ctx)`."

[[finding]]
id          = "API_28"
type        = "api_misuse"
severity    = "negligible"
difficulty  = "very_easy"
description = "`GST_AVTP_BASE_DEPAYLOAD_GET_CLASS` passes the instance-cast macro `GST_AVTP_BASE_DEPAYLOAD` as the `g_type` argument of `G_TYPE_INSTANCE_GET_CLASS`, instead of the GType macro `GST_TYPE_AVTP_BASE_DEPAYLOAD` used by every other `*_GET_CLASS` macro in this codebase (e.g. `GST_AV1_DEC_GET_CLASS` in `gstav1dec.h`). Because `GST_AVTP_BASE_DEPAYLOAD` is only defined as a function-like macro, referencing it bare (without call parentheses) does not expand it, and it happens to compile only because glib's `_G_TYPE_IGC` implementation never actually uses its `gt` parameter. The macro currently still returns the correct class pointer, but it no longer performs any type-checking semantics and is fragile with respect to future glib changes."
locations   = ["subprojects/gst-plugins-bad/ext/avtp/gstavtpbasedepayload.h:38-40"]
fix         = "Use the GType macro instead of the instance-cast macro:\n```\n#define GST_AVTP_BASE_DEPAYLOAD_GET_CLASS(obj) \\\n  (G_TYPE_INSTANCE_GET_CLASS ((obj), GST_AVTP_BASE_DEPAYLOAD, \\\n      GstAvtpBaseDepayloadClass))\n```\nbecomes:\n```\n#define GST_AVTP_BASE_DEPAYLOAD_GET_CLASS(obj) \\\n  (G_TYPE_INSTANCE_GET_CLASS ((obj), GST_TYPE_AVTP_BASE_DEPAYLOAD, \\\n      GstAvtpBaseDepayloadClass))\n```"

[[finding]]
id          = "PERF_1"
type        = "performance"
severity    = "low"
difficulty  = "medium"
description = "`gst_buffer_resize_range()` (and by extension every call to `gst_buffer_resize()` / `gst_buffer_set_size()`) always calls `gst_buffer_get_sizes_range()` first to recompute `bufsize`/`bufoffs`/`bufmax` by walking every `GstMemory` in the requested range and querying each one via `gst_memory_get_sizes()` (`subprojects/gstreamer/gst/gstbuffer.c:1716`), even for the extremely common single-memory buffer case where `gst_buffer_get_sizes_range()` itself already special-cases `length == 1` to a single `gst_memory_get_sizes()` call (`subprojects/gstreamer/gst/gstbuffer.c:1612-1615`). This is not wasteful for `length == 1`, but for larger `length` (post-merge or multi-memory buffers) it means `gst_buffer_resize()` walks the whole memory array twice conceptually once for size accounting and once again in the main trim loop right below it - on a hot path invoked for essentially every buffer that flows through elements doing in-place trimming (e.g. parsers, depayloaders)."
locations   = ["subprojects/gstreamer/gst/gstbuffer.c:1699-1792"]
fix         = "If profiling shows this matters, the size/offset/maxsize accounting for the memory range being resized could be accumulated inline in the same loop that performs the trim (`for (i = idx; i < end; i++) ...` at `subprojects/gstreamer/gst/gstbuffer.c:1738`), avoiding the separate up-front `gst_buffer_get_sizes_range()` pass over the same memory blocks. This is a minor optimization opportunity, not a correctness issue."

[[finding]]
id          = "PERF_2"
type        = "performance"
severity    = "low"
difficulty  = "easy"
description = "In `gst_device_monitor_add_filter_unlocked`, the factory list returned by `gst_device_provider_factory_list_get_device_providers` is drained with `factories = g_list_remove (factories, factory); gst_object_unref (factory);` inside the `while (factories)` loop. `g_list_remove` performs a linear search for `factory` (which is always the current head, `factories->data`) before unlinking it, making the whole drain loop O(n^2) in the number of registered device provider factories instead of O(n)."
locations   = ["subprojects/gstreamer/gst/gstdevicemonitor.c:786-831"]
fix         = "Pop the head directly instead of searching for it, e.g.:\n```c\nwhile (factories) {\n  GstDeviceProviderFactory *factory = factories->data;\n  ...\n  factories = g_list_delete_link (factories, factories);\n  gst_object_unref (factory);\n}\n```"

[[finding]]
id          = "DEAD_1"
type        = "dead_code"
severity    = "low"
difficulty  = "very_easy"
description = "In `ges_command_line_formatter_get_timeline_uri`, the `done:` label unconditionally returns via `return g_string_free (res, FALSE);`, making the subsequent block that builds `uri`/`uri_str` from `res->str` via `gst_uri_from_string`/`gst_uri_to_string` and then `return uri_str;` completely unreachable. This block has existed unreachable since the file was first added to the tree; it also leaks the `GstUri *uri` it creates (never unref'd) and would be doubly-freeing/wrong even if it were reachable. It only exists as dead code today, but its presence (and the naive-looking early `return`) is misleading to future maintainers who may believe URI-encoding of the description is actually happening."
locations   = ["subprojects/gst-editing-services/ges/ges-command-line-formatter.c:1371-1381"]
fix         = "Remove the unreachable block, keeping only the intended return:\nBefore:\n```c\ndone:\n  return g_string_free (res, FALSE);\n  {\n    GstUri *uri = gst_uri_from_string (res->str);\n    gchar *uri_str = gst_uri_to_string (uri);\n\n    g_string_free (res, TRUE);\n\n    return uri_str;\n  }\n}\n```\nAfter:\n```c\ndone:\n  return g_string_free (res, FALSE);\n}\n```"

[[finding]]
id          = "DEAD_2"
type        = "dead_code"
severity    = "low"
difficulty  = "very_easy"
description = "In `read_vts_info`, `src->vts_attrs` is unconditionally freed and set to `NULL` at the top of the function (`resindvdsrc.c:462-465`) before it is ever reassigned. Later, in the `!src->vmg_file->vts_atrt` branch, the code calls `g_array_set_size (src->vts_attrs, 0)` while `src->vts_attrs` is still `NULL`, immediately followed by `src->vts_attrs = NULL;` again. `g_array_set_size` requires a non-`NULL` `GArray` and will emit a `g_critical` warning for a `NULL` input, so this call is both pointless and produces a spurious runtime warning."
locations   = ["subprojects/gst-plugins-bad/ext/resindvd/resindvdsrc.c:478-483"]
fix         = "Remove the meaningless call:\n```c\n// Before\nif (!src->vmg_file->vts_atrt) {\n  GST_INFO (\"No vts_atrt - odd, but apparently OK\");\n  g_array_set_size (src->vts_attrs, 0);\n  src->vts_attrs = NULL;\n  return TRUE;\n}\n\n// After\nif (!src->vmg_file->vts_atrt) {\n  GST_INFO (\"No vts_atrt - odd, but apparently OK\");\n  src->vts_attrs = NULL;\n  return TRUE;\n}\n```"

[[finding]]
id          = "DEAD_3"
type        = "dead_code"
severity    = "low"
difficulty  = "easy"
description = "`gst_alsasrc_open` opens the device with `(alsa->driver_timestamps) ? 0 : SND_PCM_NONBLOCK`, but `alsa->driver_timestamps` is only ever set in `gst_alsasrc_change_state`'s `PAUSED_TO_PLAYING` handler, which runs strictly after `open()`. On a fresh element, `driver_timestamps` is `FALSE` at `open()` time, so the blocking branch never has any effect; and even if it did, `gst_alsasrc_prepare` unconditionally forces `snd_pcm_nonblock (alsa->handle, 1)` right afterwards, so the device always ends up non-blocking regardless."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsasrc.c:772-801", "subprojects/gst-plugins-base/ext/alsa/gstalsasrc.c:803-818"]
fix         = "Either drop the dead ternary and always pass `SND_PCM_NONBLOCK` in `gst_alsasrc_open`, or remove the redundant `snd_pcm_nonblock (alsa->handle, 1)` call in `gst_alsasrc_prepare` if blocking-mode-at-open is actually intended."

[[finding]]
id          = "DEAD_4"
type        = "dead_code"
severity    = "low"
