description = "`gst_gl_test_src_gl_start` assigns `src->fbo = gst_gl_framebuffer_new_with_default_depth (...)` and always returns `TRUE`, without checking whether the framebuffer allocation failed. `gst_gl_framebuffer_new_with_default_depth` can return `NULL` (e.g. if the internal `gst_gl_framebuffer_new` or renderbuffer allocation fails). A `NULL` `src->fbo` is later passed to `gst_gl_framebuffer_draw_to_texture` from `gst_gl_test_src_fill_memory` on every frame, which is not guarded against a `NULL` framebuffer."
