[[finding]]
id          = "ERR_31"
type        = "incorrect_error_handling"
severity    = "low"
difficulty  = "very_easy"
description = "`openni2_initialise_library` in `subprojects/gst-plugins-bad/ext/openni2/gstopenni2src.cpp` is declared to return `gboolean`, but on the `openni::OpenNI::initialize ()` failure path it returns `GST_FLOW_ERROR` (a `GstFlowReturn` value of `-1`), which is a truthy, nonzero value when interpreted as `gboolean`. This inverts the intended success/failure signal (the failure path looks like success to any caller that checks the boolean return). It currently has no runtime effect only because the sole caller in `gst_openjpeg_dec_class_init`-equivalent (`gst_openni2_src_class_init`) discards the return value, but the function is broken and misleading as written."
locations   = ["subprojects/gst-plugins-bad/ext/openni2/gstopenni2src.cpp:517-529"]
fix         = "Return a proper `gboolean` value on failure:\nBefore:\n```c\n  if (rc != openni::STATUS_OK) {\n    GST_ERROR (\"Initialization failed: %s\",\n        openni::OpenNI::getExtendedError ());\n    openni::OpenNI::shutdown ();\n    return GST_FLOW_ERROR;\n  }\n```\nAfter:\n```c\n  if (rc != openni::STATUS_OK) {\n    GST_ERROR (\"Initialization failed: %s\",\n        openni::OpenNI::getExtendedError ());\n    openni::OpenNI::shutdown ();\n    return FALSE;\n  }\n```"

[[finding]]
id          = "ERR_32"
type        = "incorrect_error_handling"
severity    = "low"
difficulty  = "medium"
description = "In `gst_alsasrc_get_timestamp`, `gint err = -EPIPE;` is hardcoded and passed to `xrun_recovery (asrc, asrc->handle, err)` whenever `snd_pcm_status_get_state (status) != SND_PCM_STATE_RUNNING`, regardless of the actual reported PCM state (e.g. `SND_PCM_STATE_SUSPENDED`). `xrun_recovery` branches on `-EPIPE` vs `-ESTRPIPE` to decide between `snd_pcm_prepare` and the `snd_pcm_resume` retry loop, so a genuine suspend condition is always handled as a plain underrun instead of going through the resume path."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsasrc.c:938-971"]
fix         = "Map the actual status to the right error code before calling `xrun_recovery`, e.g. ```c\ngint err = (snd_pcm_status_get_state (status) == SND_PCM_STATE_SUSPENDED) ? -ESTRPIPE : -EPIPE;\n```"

[[finding]]
id          = "ERR_33"
type        = "incorrect_error_handling"
severity    = "low"
difficulty  = "easy"
description = "`_connect_mixer_element` in `gstglmixerbin.c` accumulates failures from `gst_bin_add` and `gst_element_link_pads` into `res`, logs an error if `res` is `FALSE`, but then unconditionally calls `gst_element_sync_state_with_parent (self->mixer)` regardless of `res`, and returns `res` afterwards. If `gst_bin_add` failed, `self->mixer` was never actually added as a child of the bin, so syncing its state with a `\"parent\"` it does not have is meaningless and can trigger a warning from `gst_element_sync_state_with_parent`."
