[[finding]]
id          = "ERR_1"
type        = "incorrect_error_handling"
severity    = "critical"
difficulty  = "very_easy"
description = "In `gme_setup()` (`gstgme.c`), `gme_err = gme_track_info (gme->player, &info, 0);` return value is never checked, and `info` is used unconditionally right after: `if (info->song && *info->song) ...`, `if (info->author && *info->author) ...`, etc. `gme_track_info()` can fail (returning a non-NULL error string) for a malformed/hostile game-music file, in which case `info` is left NULL (or unset), so the very next line dereferences a NULL/garbage pointer and crashes the process. This is directly reachable from untrusted input (any file typed as `audio/x-ay`, `audio/x-gbs`, `audio/x-nsf`, etc. on the sink pad)."
locations   = ["subprojects/gst-plugins-bad/ext/gme/gstgme.c:411-439"]
fix         = "Check the result before dereferencing `info`, e.g.: `gme_err = gme_track_info (gme->player, &info, 0); if (gme_err || !info) { GST_ELEMENT_ERROR (gme, STREAM, DEMUX, (NULL), (\"%s\", gme_err)); return FALSE; }` before any `info->song`/`info->author`/etc. accesses."

[[finding]]
id          = "ERR_2"
type        = "incorrect_error_handling"
severity    = "high"
difficulty  = "medium"
description = "In `ges_effect_create_element()` (`ges-effect.c`), the code assumes that if `ges_effect_from_description()` returns `NULL`, `error` will have been set: `effect = ges_effect_from_description (self->priv->bin_description, type, &error); if (error != NULL) { ...; goto fail; }`. However, when `self->priv->bin_description` is `NULL` (e.g. a `GESEffect` constructed with `g_object_new (GES_TYPE_EFFECT, NULL)`, since `bin-description` is `G_PARAM_CONSTRUCT_ONLY` without `G_PARAM_CONSTRUCT` and defaults to `NULL`), `gst_parse_bin_from_description_full()` (called from `ges_effect_from_description()` in `ges-effect-asset.c`) bails out via `g_return_val_if_fail (bin_description != NULL, NULL)` *without* touching the `GError`. So `effect` is `NULL` but `error` stays `NULL`, the `if (error != NULL)` check is skipped, and execution falls through to `ges_track_element_add_children_props (object, effect, ...)` with `effect == NULL`. That call reaches `ges_track_element_add_child_props()` which does `GST_ELEMENT_GET_CLASS (child)`, and `GST_ELEMENT_GET_CLASS` expands to `((GstElementClass*) (((GTypeInstance*) child)->g_class))`, dereferencing the `NULL` pointer and crashing."
locations   = ["subprojects/gst-editing-services/ges/ges-effect.c:329-339"]
fix         = "Check the returned element directly instead of relying on `error` being set:\n```c\n  effect =\n      ges_effect_from_description (self->priv->bin_description, type, &error);\n  if (effect == NULL) {\n    if (error != NULL) {\n      GST_ERROR (\"An error occurred while creating the GstElement: %s\",\n          error->message);\n      g_error_free (error);\n    } else {\n      GST_ERROR (\"An error occurred while creating the GstElement\");\n    }\n    goto fail;\n  }\n```"

[[finding]]
id          = "ERR_3"
type        = "incorrect_error_handling"
severity    = "high"
difficulty  = "very_easy"
description = "In `_ges_add_remove_keyframe_from_struct` (`ges-structured-interface.c`), when `gst_timed_value_control_source_set`/`gst_timed_value_control_source_unset` fails, `ret` is set to `FALSE` and `*error` is populated. But the very next line unconditionally does `ret = _ges_save_timeline_if_needed (timeline, structure, error);`, which returns `TRUE` whenever the structure has no `project-uri` field (the common case). This silently discards the earlier failure: the function returns `TRUE` to the caller even though the keyframe could not be set/unset, while `*error` is left non-`NULL` on a reported-successful call, violating `GError` conventions (the caller may leak the `GError` or get confused since GLib convention says error should only be set when returning `FALSE`)."
locations   = ["subprojects/gst-editing-services/ges/ges-structured-interface.c:533-539"]
fix         = "Only let `_ges_save_timeline_if_needed` override the result when the previous step succeeded, e.g.:\nBefore:\n```c\n  ret = _ges_save_timeline_if_needed (timeline, structure, error);\n```\nAfter:\n```c\n  if (ret)\n    ret = _ges_save_timeline_if_needed (timeline, structure, error);\n```"

[[finding]]
id          = "ERR_4"
type        = "incorrect_error_handling"
severity    = "high"
difficulty  = "very_easy"
description = "In `_ges_add_clip_from_struct` (`ges-structured-interface.c`), when `ges_timeline_element_set_name` fails, `res` is set to `FALSE` and `*error` is populated (lines `797-803`). However the final `res = _ges_save_timeline_if_needed (timeline, structure, error);` unconditionally overwrites `res`, and `_ges_save_timeline_if_needed` returns `TRUE` whenever there is no `project-uri` field. This means the function reports success (`TRUE`) to the caller even though naming the clip failed, while `*error` remains set - the caller cannot rely on the return value to know whether an error occurred, and a set `GError` may leak or be treated inconsistently."
locations   = ["subprojects/gst-editing-services/ges/ges-structured-interface.c:797-818"]
fix         = "Preserve the earlier failure, e.g.:\nBefore:\n```c\n  res = _ges_save_timeline_if_needed (timeline, structure, error);\n```\nAfter:\n```c\n  if (res)\n    res = _ges_save_timeline_if_needed (timeline, structure, error);\n```"

[[finding]]
id          = "ERR_5"
type        = "incorrect_error_handling"
severity    = "high"
difficulty  = "medium"
description = "In `gst_av1_2_json_handle_one_obu()`, the local stack variables `GstAV1FrameHeaderOBU frame_header;` and `GstAV1FrameOBU frame;` are only populated by `gst_av1_parser_parse_frame_header_obu()` / `gst_av1_parser_parse_frame_obu()` when those calls return `GST_AV1_PARSER_OK`. However, the trailing block that updates reference frames - `if (obu->obu_type == GST_AV1_OBU_FRAME_HEADER || obu->obu_type == GST_AV1_OBU_FRAME || obu->obu_type == GST_AV1_OBU_REDUNDANT_FRAME_HEADER) { GstAV1FrameHeaderOBU *fh = &frame_header; ...; if (!fh->show_existing_frame || fh->frame_type == GST_AV1_KEY_FRAME) pres = gst_av1_parser_reference_frame_update (self->parser, fh); }` - only checks `obu->obu_type`, not whether the corresponding parse call actually succeeded (`pres == GST_AV1_PARSER_OK`). On a malformed/truncated AV1 bitstream (untrusted input from `filesrc`/network), the parse call can fail while `obu->obu_type` still indicates a frame/frame-header OBU, causing `fh->show_existing_frame` and `fh->frame_type` to be read from uninitialized stack memory and passed into `gst_av1_parser_reference_frame_update()`, which then updates the parser's internal reference-frame state based on garbage data."
locations   = ["subprojects/gst-plugins-bad/ext/codec2json/gstav12json.c:782-867"]
fix         = "Track the parse result per OBU type and skip the reference-frame update when parsing failed, e.g.:\n```c\n  if ((obu->obu_type == GST_AV1_OBU_FRAME_HEADER\n          || obu->obu_type == GST_AV1_OBU_FRAME\n          || obu->obu_type == GST_AV1_OBU_REDUNDANT_FRAME_HEADER)\n      && pres == GST_AV1_PARSER_OK) {\n    GstAV1FrameHeaderOBU *fh = &frame_header;\n    ...\n  }\n```"

[[finding]]
id          = "ERR_6"
type        = "incorrect_error_handling"
severity    = "high"
difficulty  = "easy"
description = "`gst_ladspa_class_init()` calls `g_module_open (file_name, ...)` and `g_module_symbol (ladspa_class->plugin, \"ladspa_descriptor\", (gpointer *) &descriptor_function)` without checking either return value, then unconditionally calls `descriptor_function (ix)`. `plugin-filename` comes from `ladspa_meta_all`, which is persisted via `gst_plugin_set_cache_data()`/the GStreamer registry cache; the cached path can point to a LADSPA `.so` that was later removed, moved, or replaced (package upgrade/removal). If `g_module_open()` fails, `g_module_symbol()` is called with a `NULL` module and (per GLib) returns `FALSE` without touching `descriptor_function`, leaving it as uninitialized stack memory. `descriptor_function (ix)` is then called through this garbage pointer, resulting in a crash or worse (call through an arbitrary/uncontrolled address) the first time an element of the affected cached type is instantiated (e.g. via `gst-inspect` or a pipeline)."
locations   = ["subprojects/gst-plugins-bad/ext/ladspa/gstladspautils.c:768-779"]
fix         = "Check both return values before use. For example: `ladspa_class->plugin = g_module_open (file_name, G_MODULE_BIND_LAZY | G_MODULE_BIND_LOCAL);\\nif (!ladspa_class->plugin || !g_module_symbol (ladspa_class->plugin, \"ladspa_descriptor\", (gpointer *) &descriptor_function)) {\\n  GST_ERROR (\"Could not load LADSPA plugin %s\", file_name);\\n  return;\\n}`."

[[finding]]
id          = "ERR_7"
type        = "incorrect_error_handling"
severity    = "high"
difficulty  = "medium"
description = "The `lc3dec` sink pad template declares `channels = [1, MAX]`, so `gst_lc3_dec_set_format()` may receive an arbitrarily large `in_ch` from negotiated caps. The code fills a fixed-size stack array `GstAudioChannelPosition pos[64]` via `gst_audio_channel_positions_from_mask (in_ch, in_chmsk, pos)` and then calls `gst_audio_info_set_format (&info, GST_AUDIO_FORMAT_S16LE, in_rate, in_ch, pos)` without ever checking `in_ch <= 64`. `gst_audio_info_set_format()` itself has the precondition `g_return_if_fail (channels <= 64 || position == NULL);`; when `in_ch > 64` (and `position` is non-`NULL`), this check fails and the function returns *before* calling `gst_audio_info_init(info)`, leaving the local, stack-allocated `GstAudioInfo info` completely uninitialized. The subsequent code (`lc3_dec->rate = GST_AUDIO_INFO_RATE (&info); lc3_dec->channels = GST_AUDIO_INFO_CHANNELS (&info); ...`) then reads uninitialized stack memory and propagates garbage values (including `lc3_dec->channels`, later used to size a `g_new0()` allocation and loop bounds in `gst_lc3_dec_handle_frame()`)."
locations   = ["subprojects/gst-plugins-bad/ext/lc3/gstlc3dec.c:152-188", "subprojects/gst-plugins-bad/ext/lc3/gstlc3dec.c:182-184"]
fix         = "Validate the channel count before using it. For example, after `gst_structure_get_int (s, \"channels\", &in_ch);` add: `if (in_ch <= 0 || in_ch > 64) { GST_ERROR_OBJECT (lc3_dec, \"unsupported channel count %d\", in_ch); return FALSE; }` before calling `gst_audio_channel_positions_from_mask()` / `gst_audio_info_set_format()`."

[[finding]]
id          = "ERR_8"
type        = "incorrect_error_handling"
severity    = "high"
difficulty  = "medium"
description = "`camera_deserialize_undistort_settings()` in `camerautils.cpp` always `return TRUE;` regardless of whether `cv::FileStorage fs (str, cv::FileStorage::READ + cv::FileStorage::MEMORY)` actually succeeded in parsing `str`, and regardless of whether `fs[\"cameraMatrix\"]`/`fs[\"distCoeffs\"]` produced non-empty matrices. This function is invoked from `camera_undistort_run()` with `undist->settings`, which is attacker/user controllable via the read-write `settings` GObject property on `cameraundistort`, or via a `GstEventCalibrated` custom event forwarded from an untrusted upstream `cameracalibrate`-like element. If `str` is not valid OpenCV `FileStorage` XML/YAML (e.g. garbage or truncated data), `camera_deserialize_undistort_settings` still reports success, so `camera_undistort_init_undistort_rectify_map()` proceeds to call `cv::getOptimalNewCameraMatrix()` on an empty/invalid `cameraMatrix`/`distCoeffs`, which throws an OpenCV `cv::Exception` (assertion failure) that is never caught, aborting the process."
locations   = ["subprojects/gst-plugins-bad/ext/opencv/camerautils.cpp:36-45", "subprojects/gst-plugins-bad/ext/opencv/gstcameraundistort.cpp:317-323"]
fix         = "Check `fs.isOpened()` and validate the extracted matrices before returning success. Before: `cv::FileStorage fs (str, cv::FileStorage::READ + cv::FileStorage::MEMORY); fs[\"cameraMatrix\"] >> cameraMatrix; fs[\"distCoeffs\"] >> distCoeffs; return TRUE;`. After: `cv::FileStorage fs (str, cv::FileStorage::READ + cv::FileStorage::MEMORY); if (!fs.isOpened ()) return FALSE; fs[\"cameraMatrix\"] >> cameraMatrix; fs[\"distCoeffs\"] >> distCoeffs; return !cameraMatrix.empty () && !distCoeffs.empty ();` so `camera_undistort_run()` can correctly fall back to `undist->doUndistort = FALSE` instead of feeding invalid matrices into OpenCV calibration calls."

[[finding]]
id          = "ERR_9"
type        = "incorrect_error_handling"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_disparity_chain_left`, `g_mutex_lock (&fs->lock)` is taken, and if `gst_buffer_map` subsequently fails the function returns `GST_FLOW_ERROR` at `gstdisparity.cpp:495` without calling `g_mutex_unlock (&fs->lock)`. This permanently leaves `fs->lock` held, so every future call to `gst_disparity_chain_left` or `gst_disparity_chain_right` (which also takes `fs->lock`) deadlocks the pipeline. Compare with the sibling function `gst_disparity_chain_right`, which correctly unlocks the mutex before returning on the same error path (`gstdisparity.cpp:530-533`). The buffer stored in `fs->buffer_left` is also never unreffed on this path, leaking it in addition to the deadlock."
locations   = ["subprojects/gst-plugins-bad/ext/opencv/gstdisparity.cpp:492-498"]
fix         = "Unlock the mutex (and release the buffer reference) before returning on map failure, mirroring `gst_disparity_chain_right`:\nBefore:\n```\n  fs->buffer_left = buffer;\n\n  if (!gst_buffer_map (buffer, &info, (GstMapFlags) GST_MAP_READWRITE)) {\n    return GST_FLOW_ERROR;\n  }\n```\nAfter:\n```\n  fs->buffer_left = buffer;\n\n  if (!gst_buffer_map (buffer, &info, (GstMapFlags) GST_MAP_READWRITE)) {\n    fs->buffer_left = NULL;\n    g_mutex_unlock (&fs->lock);\n    gst_buffer_unref (buffer);\n    return GST_FLOW_ERROR;\n  }\n```"

[[finding]]
id          = "ERR_10"
type        = "incorrect_error_handling"
severity    = "high"
difficulty  = "very_easy"
description = "`gst_gl_download_element_get_unit_size()` computes `ret = gst_video_info_from_caps (&info, caps)` and only writes `*size` when `ret` is true, but it unconditionally does `return TRUE;` at the end. If `caps` fail to parse, `*size` is left uninitialized while the function reports success, so the `GstBaseTransform` caller will use an uninitialized `gsize` as the buffer's unit size (used for buffer allocation/size checks downstream)."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldownloadelement.c:1129-1141"]
fix         = "Return the actual result instead of always `TRUE`:\n```c\nstatic gboolean\ngst_gl_download_element_get_unit_size (GstBaseTransform * trans, GstCaps * caps,\n    gsize * size)\n{\n  gboolean ret = FALSE;\n  GstVideoInfo info;\n\n  ret = gst_video_info_from_caps (&info, caps);\n  if (ret)\n    *size = GST_VIDEO_INFO_SIZE (&info);\n\n  return ret;\n}\n```"

[[finding]]
id          = "ERR_11"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "very_easy"
description = "In `run_diff` (`subprojects/gst-devtools/validate/gst/validate/flow/gstvalidateflow.c`), `GSubprocess *process = g_subprocess_new (...)` returns `NULL` (with `error` set) if spawning the `diff` executable fails (e.g. not installed, `ENOENT`, permission error). The failure path correctly checks `if (!error)` before using `process`, but at the end of the function `g_object_unref (process)` is called unconditionally, even when `process` is `NULL`. `g_object_unref (NULL)` violates the GObject API contract (`g_return_if_fail (G_IS_OBJECT (object))`) and emits a `g_critical`, which will abort the process when GStreamer/GValidate is run with fatal-warnings enabled (a mode `gst-validate` explicitly supports via `fatal_warnings`)."
locations   = ["subprojects/gst-devtools/validate/gst/validate/flow/gstvalidateflow.c:610-667"]
fix         = "Guard the unref with a NULL check, similar to how `process2` is already handled with `g_clear_object`:\nBefore:\n```c\n  g_object_unref (process);\n  g_free (stdout_text);\n```\nAfter:\n```c\n  if (process)\n    g_object_unref (process);\n  g_free (stdout_text);\n```"

[[finding]]
id          = "ERR_12"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `run_http_request` (`subprojects/gst-devtools/validate/gst/validate/gst-validate-http-actions.c`), after `send_http_request` fails and already populates `*error` (e.g. connection refused, or non-2xx status), the code unconditionally re-checks `expected_response` and, if it doesn't match `response.body` (which is normally `NULL` in the failure case), calls `g_set_error (error, ...)` again on the same `GError **` that may already hold a set `GError`. Calling `g_set_error`/`g_set_error_literal` on an already-set `GError` is a GLib usage violation that triggers a critical warning and discards/leaks the original error, hiding the real failure reason (e.g. connection error) behind a misleading 'Expected response' message."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-http-actions.c:255-267"]
fix         = "Only perform the expected-response comparison when the request actually succeeded. Before:\n```c\n  ret = send_http_request (&params, &response, error);\n\n  const gchar *expected_response =\n      gst_structure_get_string (args, \"expected-response\");\n  if (expected_response) {\n```\nAfter:\n```c\n  ret = send_http_request (&params, &response, error);\n\n  const gchar *expected_response =\n      gst_structure_get_string (args, \"expected-response\");\n  if (ret && expected_response) {\n```"

[[finding]]
id          = "ERR_13"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `HTTPServer.start()`, `os.chdir(self.options.http_server_dir)` is called, and the code relies on `os.chdir(curdir)` right after `subprocess.Popen(...)` to restore the previous working directory. If `subprocess.Popen` raises `OSError` (e.g. `sys.executable` or `RangeHTTPServer.py` cannot be spawned), control jumps directly to the `except OSError as ex:` handler, which never calls `os.chdir(curdir)`. Since the current working directory is process-global state, the whole `gst-validate-launcher` process (and every subsequent relative-path operation, including running the actual tests) is left running inside `self.options.http_server_dir` instead of the original directory."
locations   = ["subprojects/gst-devtools/validate/launcher/httpserver.py:76-100"]
fix         = "Wrap the `os.chdir`/`Popen` pair in a `try`/`finally` that restores the directory, e.g.:\n```python\ncurdir = os.path.abspath(os.curdir)\nos.chdir(self.options.http_server_dir)\ntry:\n    self._process = subprocess.Popen(cmd.split(\" \"), stderr=self._logsfile, stdout=self._logsfile)\nfinally:\n    os.chdir(curdir)\n```\nso `curdir` is restored even when `Popen` raises `OSError`."

[[finding]]
id          = "ERR_14"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "medium"
description = "`ges_formatter_can_load_uri()` in `ges-formatter.c` iterates over all `GESFormatter` assets and calls `class->can_load_uri (dummy_instance, uri, error)` for each candidate using the *same* caller-supplied `error` pointer, without resetting/clearing it between iterations. When `extension` is `NULL` (URIs without a recognizable file extension, e.g. network streams) no filtering happens and every registered formatter (xml formatter, command-line formatter, pitivi formatter, python formatters, ...) is tried in turn. If an earlier formatter's `can_load_uri` implementation sets `*error` on failure (e.g. `GESBaseXmlFormatter`'s `_can_load_uri()` -> `_load_and_parse()` does this), the next loop iteration calls `class->can_load_uri (..., error)` while `*error` is already non-`NULL`, violating the standard GLib contract that a `GError**` output parameter must point to `NULL` before being passed to a function that can set it."
locations   = ["subprojects/gst-editing-services/ges/ges-formatter.c:246-283"]
fix         = "Use a fresh, per-iteration `GError*` and only propagate the last one to the caller:\n```c\nfor (tmp = formatter_assets; tmp; tmp = tmp->next) {\n  GError *iter_error = NULL;\n  ...\n  if (class->can_load_uri (dummy_instance, uri, &iter_error)) {\n    g_clear_error (&iter_error);\n    ...\n    break;\n  }\n  g_clear_error (&iter_error);\n  ...\n}\n```"

[[finding]]
id          = "ERR_15"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `ges_pipeline_save_thumbnail` (`subprojects/gst-editing-services/ges/ges-pipeline.c`), `gst_buffer_unmap (b, &map_info)` is called unconditionally after the `if (gst_buffer_map (b, &map_info, GST_MAP_READ))` block, even when `gst_buffer_map` returned `FALSE`. In that failure case `map_info` was never populated by `gst_buffer_map`, so `gst_buffer_unmap` is invoked with an uninitialized/garbage `GstMapInfo`, which is undefined behavior and can corrupt the `GstBuffer`'s internal mapping state or crash. Additionally, `res` is initialized to `TRUE` and is never set to `FALSE` when `gst_buffer_map` fails, so the function reports success even though no thumbnail data was written to `location`."
locations   = ["subprojects/gst-editing-services/ges/ges-pipeline.c:1463-1499"]
fix         = "Only call `gst_buffer_unmap` when the map succeeded, and treat map failure as an error, e.g.:\n```\nif (gst_buffer_map (b, &map_info, GST_MAP_READ)) {\n  if (!g_file_set_contents (location, (const char *) map_info.data, map_info.size, error)) {\n    res = FALSE;\n  }\n  gst_buffer_unmap (b, &map_info);\n} else {\n  res = FALSE;\n}\n```"

[[finding]]
id          = "ERR_16"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `plugin_init` (subprojects/gst-editing-services/plugins/ges/gesplugin.c), `res` is initialized to `1` (`TRUE`) and then combined with `gst_element_register()` results using bitwise-OR (`res |= ...`). Since `res` starts `TRUE`, OR-ing it with any later boolean result can never turn it back to `FALSE`. This means `plugin_init` always returns `TRUE` regardless of whether `gst_element_register` for `gessrc` or `gesdemux` actually failed, silently masking registration failures instead of reporting them to `gst_plugin_register`/`GST_PLUGIN_DEFINE` machinery."
locations   = ["subprojects/gst-editing-services/plugins/ges/gesplugin.c:33-47"]
fix         = "Use logical AND so any registration failure is actually reported:\nBefore:\n```c\n  gboolean res = 1;\n\n  res |=\n      gst_element_register (plugin, \"gessrc\", GST_RANK_NONE,\n      ges_src_get_type ());\n\n  res |= gst_element_register (plugin, \"gesdemux\", GST_RANK_PRIMARY,\n      ges_demux_get_type ());\n```\nAfter:\n```c\n  gboolean res = TRUE;\n\n  res &=\n      gst_element_register (plugin, \"gessrc\", GST_RANK_NONE,\n      ges_src_get_type ());\n\n  res &= gst_element_register (plugin, \"gesdemux\", GST_RANK_PRIMARY,\n      ges_demux_get_type ());\n```"

[[finding]]
id          = "ERR_17"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_ffmpegdeinterlace_chain` (`gstavdeinterlace.c`), the return value of `process_filter_graph()` is completely ignored. `process_filter_graph()` can fail (e.g. `av_buffersrc_add_frame`, `av_buffersink_get_frame`, or lazy `init_filter_graph` failing) and return early without ever writing to `dst->data` (i.e. `deinterlace->to_frame`, which points into the newly-allocated, uninitialized `outbuf` memory from `gst_buffer_new_and_alloc`). Because the failure is not checked, `outbuf` - containing stale/uninitialized heap memory instead of a deinterlaced frame - is unmapped and pushed downstream via `gst_pad_push` as if it were valid decoded video, silently corrupting the stream instead of reporting a flow error. In addition, `gst_buffer_map()`'s boolean return value is not checked for either `inbuf` or `outbuf`, so a mapping failure would similarly lead to `gst_ffmpeg_avpicture_fill()` and `process_filter_graph()` operating on garbage pointers."
locations   = ["subprojects/gst-libav/ext/libav/gstavdeinterlace.c:426-448"]
fix         = "Check the result of `process_filter_graph()` (and of `gst_buffer_map()`) and bail out with a flow error instead of pushing the buffer:\n\nBefore:\n```c\n  process_filter_graph (deinterlace, &deinterlace->to_frame,\n      &deinterlace->from_frame, deinterlace->pixfmt, deinterlace->width,\n      deinterlace->height);\n  gst_buffer_unmap (outbuf, &to_map);\n  gst_buffer_unmap (inbuf, &from_map);\n\n  gst_buffer_copy_into (outbuf, inbuf, GST_BUFFER_COPY_TIMESTAMPS, 0, -1);\n\n  result = gst_pad_push (deinterlace->srcpad, outbuf);\n```\nAfter:\n```c\n  if (process_filter_graph (deinterlace, &deinterlace->to_frame,\n          &deinterlace->from_frame, deinterlace->pixfmt, deinterlace->width,\n          deinterlace->height) < 0) {\n    gst_buffer_unmap (outbuf, &to_map);\n    gst_buffer_unmap (inbuf, &from_map);\n    gst_buffer_unref (outbuf);\n    gst_buffer_unref (inbuf);\n    return GST_FLOW_ERROR;\n  }\n  gst_buffer_unmap (outbuf, &to_map);\n  gst_buffer_unmap (inbuf, &from_map);\n\n  gst_buffer_copy_into (outbuf, inbuf, GST_BUFFER_COPY_TIMESTAMPS, 0, -1);\n\n  result = gst_pad_push (deinterlace->srcpad, outbuf);\n```"

[[finding]]
id          = "ERR_18"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_aes_dec_transform()`, several error branches (short ciphertext, `gst_aes_dec_init_cipher()` failure, `EVP_CipherUpdate()` failure, invalid/mismatched PKCS7 padding) execute `goto cleanup` after both `inbuf`/`outbuf` have already been successfully mapped via `gst_buffer_map()`, but `cleanup:` never calls `gst_buffer_unmap()` on either buffer. The equivalent branches in `gst_aes_enc_transform()` (`EVP_CipherInit_ex()` failure, `EVP_CipherUpdate()` failures) have the same problem. This leaves the `GstBuffer`/`GstMemory` map count unbalanced, which can trigger `GST_MAP` critical warnings or leave buffers non-freeable/non-writable to other users after these (fairly common, input-dependent) error conditions occur."
locations   = ["subprojects/gst-plugins-bad/ext/aes/gstaesdec.c:459-510", "subprojects/gst-plugins-bad/ext/aes/gstaesenc.c:452-497"]
fix         = "Unmap both buffers before jumping to `cleanup` on every error branch that runs after both maps succeeded, e.g. in `gstaesdec.c`:\n```c\nif (!EVP_CipherUpdate (filter->evp_ctx, plaintext, &plaintext_len, ciphertext, ciphertext_len)) {\n  GST_ELEMENT_ERROR (filter, STREAM, FAILED, (\"Cipher update failed.\"), (...));\n  gst_buffer_unmap (inbuf, &inmap);\n  gst_buffer_unmap (outbuf, &outmap);\n  goto cleanup;\n}\n```\n(and similarly for the other `goto cleanup` sites in both `gst_aes_dec_transform()` and `gst_aes_enc_transform()`), or restructure the function so `cleanup:` itself unconditionally unmaps both buffers once mapped."

[[finding]]
id          = "ERR_19"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "very_easy"
description = "`gst_av1_enc_handle_frame` has return type `GstFlowReturn`, but on `aom_img_alloc` failure it does `return FALSE;`. Since `GST_FLOW_OK` is numerically `0` and `FALSE` is also `0`, this makes the base `GstVideoEncoder` believe the frame was successfully handled even though encoding never happened, silently swallowing the allocation error instead of reporting `GST_FLOW_ERROR`. The same early return also never calls `gst_video_codec_frame_unref (frame)` on this path (unlike every other return path in this function and the equivalent path in `gst_vpx_enc_handle_frame` in `gst-plugins-good/ext/vpx/gstvpxenc.c`), leaking the `GstVideoCodecFrame` reference."
locations   = ["subprojects/gst-plugins-bad/ext/aom/gstav1enc.c:980-984"]
fix         = "Return the correct flow value and release the frame reference:\n```\n  if (!aom_img_alloc (&raw, av1enc->format, av1enc->aom_cfg.g_w,\n          av1enc->aom_cfg.g_h, 1)) {\n    GST_ERROR_OBJECT (encoder, \"Failed to initialize encoder\");\n    return FALSE;\n  }\n```\nbecomes:\n```\n  if (!aom_img_alloc (&raw, av1enc->format, av1enc->aom_cfg.g_w,\n          av1enc->aom_cfg.g_h, 1)) {\n    GST_ERROR_OBJECT (encoder, \"Failed to initialize encoder\");\n    gst_video_codec_frame_unref (frame);\n    return GST_FLOW_ERROR;\n  }\n```"

[[finding]]
id          = "ERR_20"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_nv_comp_video_enc_thread_func`, the return value of `gst_buffer_pool_acquire_buffer (priv->pool, &frame->output_buffer, nullptr)` is not checked. `gst_buffer_pool_acquire_buffer` sets `frame->output_buffer` to `NULL` and returns a non-`GST_FLOW_OK` value on failure (e.g. pool flushing, allocation failure). The code unconditionally proceeds to `gst_buffer_map (frame->output_buffer, &map_info, GST_MAP_WRITE)` and writes the compressed header/data into `map_info.data`, which is unsafe when acquisition failed."
locations   = ["subprojects/gst-plugins-bad/ext/nvcomp/gstnvcompvideoenc.cpp:1775-1820"]
fix         = "Check the return value, e.g.: `if (gst_buffer_pool_acquire_buffer (priv->pool, &frame->output_buffer, nullptr) != GST_FLOW_OK) { GST_ERROR_OBJECT (self, \"Couldn't acquire output buffer\"); gst_video_codec_frame_unref (frame); priv->last_flow = GST_FLOW_ERROR; continue; }` before mapping the buffer."

[[finding]]
id          = "ERR_21"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "`snd_midi_event_new (DEFAULT_BUFSIZE, &alsamidisrc->parser)` in `gst_alsa_midi_src_start` does not check its return value. If it fails (e.g. `-ENOMEM`), `alsamidisrc->parser` is left unset (potentially still holding a stale pointer from a previous run) and the following calls `snd_midi_event_init (alsamidisrc->parser)`, `snd_midi_event_reset_decode (alsamidisrc->parser)` and `snd_midi_event_no_status (alsamidisrc->parser, 1)` are made unconditionally on that invalid pointer."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsamidisrc.c:583-587"]
fix         = "Check the return value: ```c\nret = snd_midi_event_new (DEFAULT_BUFSIZE, &alsamidisrc->parser);\nif (ret < 0) {\n  GST_ERROR_OBJECT (alsamidisrc, \"Cannot create midi event parser: %s\", snd_strerror (ret));\n  goto error_free_seq_ports;\n}\n```"

[[finding]]
id          = "ERR_22"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_gl_alpha_filter_texture`, the return value of `_create_shader (alpha)` is ignored when `alpha->alpha_shader` is `NULL`: `if (!alpha->alpha_shader) _create_shader (alpha);`. If shader (re)compilation fails (e.g. after a GL context loss or driver rejecting the GLSL), `alpha->alpha_shader` and/or `alpha->chroma_key_shader` remain `NULL`, and the code proceeds to call `gst_gl_shader_use (shader)` and `gst_gl_filter_render_to_target_with_shader (filter, in_tex, out_tex, shader)` with a `NULL` shader, silently producing broken/blank output and spamming `g_return_if_fail` critical warnings every frame instead of reporting a pipeline error."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglalpha.c:438-477"]
fix         = "Check the result and bail out (or post an element error) before rendering:\n```c\nif (!alpha->alpha_shader) {\n  if (!_create_shader (alpha))\n    return FALSE;\n}\n```"

[[finding]]
id          = "ERR_23"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_gl_color_balance_filter_texture`, `_create_shader (balance)` is called without checking its return value when `balance->shader` is `NULL`: `if (!balance->shader) _create_shader (balance);`. If shader creation fails, `balance->shader` stays `NULL` and the function immediately calls `gst_gl_shader_use (balance->shader)` and later `gst_gl_filter_render_to_target_with_shader (filter, in_tex, out_tex, balance->shader)` with a `NULL` shader, producing broken output and per-frame critical warnings instead of a proper pipeline error."
