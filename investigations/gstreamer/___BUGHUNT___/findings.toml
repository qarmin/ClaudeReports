[[finding]]
id          = "ERR_36"
type        = "incorrect_error_handling"
severity    = "low"
difficulty  = "medium"
description = "In both `gst_debug_log_full_valist()` (`subprojects/gstreamer/gst/gstinfo.c:912-970`) and `gst_debug_log_literal_full()` (`gstinfo.c:1024-1070`), the `ctx`-based duplicate-check (`_gst_log_ctx_check_id_valist()` / `_gst_log_ctx_check_id_literal()`), which formats/uses `format` or `message_string` as a `%s`/`vprintf` argument, runs *before* the `g_return_if_fail (format != NULL)` / `g_return_if_fail (message_string != NULL)` checks further down. If a caller passes a `NULL` format/message string together with a non-NULL `GstLogContext`, the code will dereference/format the `NULL` value before the defensive check that is supposed to catch this ever runs, defeating the purpose of the guard."
