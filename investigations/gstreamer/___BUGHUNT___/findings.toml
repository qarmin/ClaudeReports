[[finding]]
id          = "CMT_1"
type        = "invalid_comment"
severity    = "low"
difficulty  = "medium"
description = "The `SECTION:gstbin` documentation states that for `%GST_QUERY_DURATION` \"The bin will forward the query to all sink elements contained within and will return the maximum value\". However, `bin_query_duration_fold` returns `FALSE` (stopping the `gst_iterator_fold` early) as soon as *any* queried sink reports an unknown duration (`duration == -1`), which means the remaining, not-yet-visited sink elements are never queried at all in that case. The documented behaviour (\"forward the query to all sink elements\") does not match the early-exit implementation."
locations   = ["subprojects/gstreamer/gst/gstbin.c:114-116", "subprojects/gstreamer/gst/gstbin.c:4061-4091"]
fix         = "Either update the documentation to clarify that the duration query is aborted early and reported as unknown as soon as one sink reports an unknown duration (rather than always visiting every sink), for example:\n```c\n/* * %GST_QUERY_DURATION: The bin queries its sink elements for a duration.\n *   If any sink reports an unknown duration, the overall duration is\n *   reported as unknown without querying the remaining sinks. Otherwise\n *   the maximum of all sink durations is returned. */\n```\nor change `bin_query_duration_fold` to keep querying all sinks and only report unknown at the end if any of them was unknown, matching the current wording."

[[finding]]
id          = "CMT_2"
type        = "invalid_comment"
severity    = "low"
difficulty  = "very_easy"
description = "The gtk-doc comment for `gst_meta_factory_register()` documents `@plugin` as `The #GstPlugin to register @meta_info for` with no `(nullable)` annotation, implying a non-NULL `GstPlugin` is required. But the implementation clearly supports `plugin == NULL`: it is passed straight into `gst_plugin_get_registry (plugin)` (documented itself as `@plugin: (transfer none) (nullable)`, falling back to `gst_registry_get ()`), and `gst_meta_factory_create()` explicitly branches on `if (plugin && plugin->desc.name)`, using `\"NULL\"` as the `plugin_name` otherwise. The documentation is therefore misleading about the accepted contract."
locations   = ["subprojects/gstreamer/gst/gstmetafactory.c:150-158"]
fix         = "Mark the parameter nullable in the doc comment, e.g. `@plugin: (nullable): The #GstPlugin to register @meta_info for, or %NULL`, matching the behavior actually implemented in `gst_meta_factory_create()` and `gst_plugin_get_registry()`."

[[finding]]
id          = "CMT_3"
type        = "invalid_comment"
severity    = "negligible"
difficulty  = "very_easy"
description = "The header guard in `gstglvideomixer.h` is opened as `#ifndef _GST_GL_VIDEO_MIXER_H_` / `#define _GST_GL_VIDEO_MIXER_H_` but the closing `#endif` comment reads `/* _GST_GLFILTERCUBE_H_ */`, a leftover from a copy-pasted template (probably `gstglfiltercube.h`). It has no functional effect but is misleading when reading the header."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglvideomixer.h:21-22", "subprojects/gst-plugins-base/ext/gl/gstglvideomixer.h:161"]
