[[finding]]
id          = "ERR_25"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "medium"
description = "`gst_gl_effects_gl_start()` allocates `effects->midtexture[i]` for `NEEDED_TEXTURES` textures via `gst_gl_base_memory_alloc (base_alloc, params)` but never checks the return value. `gst_gl_base_memory_alloc()` is documented to return `NULL` on failure (e.g. GL/OOM error from the allocator's `alloc` vfunc). If any allocation fails, `effects->midtexture[i]` stays `NULL`, `gl_start` still returns `TRUE`, and the element continues into `filter_texture`/the individual effect implementations which dereference `midtexture[i]` (e.g. its `tex_id`) unconditionally, resulting in a `NULL` pointer dereference instead of a clean startup failure."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgleffects.c:280-312"]
fix         = "Check the allocation result and fail `gl_start` if any texture could not be created:\n```c\n  for (i = 0; i < NEEDED_TEXTURES; i++) {\n    if (effects->midtexture[i])\n      gst_memory_unref (GST_MEMORY_CAST (effects->midtexture[i]));\n\n    effects->midtexture[i] =\n        (GstGLMemory *) gst_gl_base_memory_alloc (base_alloc, params);\n    if (!effects->midtexture[i]) {\n      GST_ERROR_OBJECT (effects, \"Failed to allocate effects texture %d\", i);\n      gst_object_unref (base_alloc);\n      gst_gl_allocation_params_free (params);\n      return FALSE;\n    }\n  }\n```"

[[finding]]
id          = "ERR_26"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_buffer_copy_into()`'s `GST_BUFFER_COPY_META` handling, when a meta's `info->transform_func` returns `FALSE` the code only logs it (`GST_CAT_ERROR (GST_CAT_BUFFER, \"failed to copy meta %p of API type %s\", ...)`) and continues on to the next meta item; it does not `return FALSE` the way every other failure path in this same function does (e.g. failed memory sharing/copy at `subprojects/gstreamer/gst/gstbuffer.c:654-657`, failed merge at `671-674`). Since `gst_buffer_copy_into()` is documented to return `TRUE` only 'if the copying succeeded', a meta that fails to transform is silently dropped while the function still reports overall success to callers such as `gst_buffer_copy_region()` / `gst_buffer_copy_with_flags()`, which then hand back what looks like a fully-successful copy missing some metadata."
locations   = ["subprojects/gstreamer/gst/gstbuffer.c:683-729"]
fix         = "Propagate the failure like the other error paths in the function:\n\n```c\n} else if (info->transform_func) {\n  GstMetaTransformCopy copy_data;\n\n  copy_data.region = region;\n  copy_data.offset = offset;\n  copy_data.size = size;\n\n  if (!info->transform_func (dest, meta, src,\n          _gst_meta_transform_copy, &copy_data)) {\n    GST_CAT_ERROR (GST_CAT_BUFFER,\n        \"failed to copy meta %p of API type %s\", meta,\n        g_type_name (info->api));\n    return FALSE;\n  }\n}\n```"

[[finding]]
id          = "ERR_27"
type        = "incorrect_error_handling"
severity    = "low"
difficulty  = "easy"
description = "In `gst_ffmpegmux_collected` (`gstavmux.c`), the return value of `av_write_frame (ffmpegmux->context, &pkt)` is discarded. If the underlying muxer or I/O layer fails to write a packet (disk full, malformed packet rejected by the muxer, downstream `GST_FFMPEG_URL`-based pad refusing data, etc.), the element has no way of knowing and will keep collecting and silently dropping packets until EOS, ultimately reporting `GST_FLOW_OK`/`GST_FLOW_EOS` for a corrupt or truncated output file instead of surfacing an error to the pipeline."
locations   = ["subprojects/gst-libav/ext/libav/gstavmux.c:725-754"]
fix         = "Check the return value and post an element error:\n\nBefore:\n```c\n    av_write_frame (ffmpegmux->context, &pkt);\n    gst_buffer_unmap (buf, &map);\n    gst_buffer_unref (buf);\n```\nAfter:\n```c\n    if (av_write_frame (ffmpegmux->context, &pkt) < 0) {\n      GST_ELEMENT_ERROR (ffmpegmux, STREAM, MUX, (NULL),\n          (\"Failed to write frame to muxer\"));\n      gst_buffer_unmap (buf, &map);\n      gst_buffer_unref (buf);\n      return GST_FLOW_ERROR;\n    }\n    gst_buffer_unmap (buf, &map);\n    gst_buffer_unref (buf);\n```"

[[finding]]
