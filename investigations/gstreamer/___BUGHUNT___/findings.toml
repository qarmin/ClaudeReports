[[finding]]
id          = "PANIC_1"
type        = "panic"
severity    = "critical"
difficulty  = "very_easy"
description = "In `set_layer_active()` (the executor for the `set-layer-active` validate action), `track_names` is obtained via `gst_validate_utils_get_strv (action->structure, \"tracks\")`, which returns `NULL` when the `tracks` field is absent from the action structure (and `tracks` is declared `.mandatory = FALSE` in `ges_validate_register_action_types()`). The code then unconditionally does `for (i = 0; track_names[i]; i++)`, dereferencing a `NULL` pointer whenever a scenario invokes `set-layer-active` without the optional `tracks` field."
locations   = ["subprojects/gst-editing-services/ges/ges-validate.c:1113-1118"]
fix         = "Guard the loop, e.g.: `for (i = 0; track_names && track_names[i]; i++) { ... }` (before: `for (i = 0; track_names[i]; i++) {`; after: `for (i = 0; track_names && track_names[i]; i++) {`)."

[[finding]]
id          = "PANIC_2"
type        = "panic"
severity    = "critical"
difficulty  = "very_easy"
description = "In `generate_media_seqnums()` (called from `gst_m3u8_update()` when a live media playlist update lacks `EXT-X-MEDIA-SEQUENCE`), if the newly-parsed `self->files` list is empty (e.g. the server/attacker serves an updated playlist with zero media segments) while `previous_files` is non-empty, the first `for (l = self->files; l; l = l->next)` loop never executes. `l` stays `NULL` and `f2` stays `NULL` (its initializer). The code then takes the `else` branch (`if (l) {...} else { mediasequence = f2->sequence + 1; ... }`) and dereferences `f2->sequence` on the `NULL` pointer `f2`, crashing the process. The analogous function `check_media_seqnums()` explicitly guards against this with `if (!self->files) return TRUE;` at its top, but `generate_media_seqnums()` has no such guard even though the `self->files == NULL` check in `gst_m3u8_update()` only happens *after* this call."
locations   = ["subprojects/gst-plugins-bad/ext/hls/m3u8.c:422-481", "subprojects/gst-plugins-bad/ext/hls/m3u8.c:468-473", "subprojects/gst-plugins-bad/ext/hls/m3u8.c:793-799"]
fix         = "Add the same early-return guard used in `check_media_seqnums()`. Before: `g_return_if_fail (previous_files);\\n\\n  /* Find first case of same URI in new playlist. */\\n  for (l = self->files; l; l = l->next) {`. After: `g_return_if_fail (previous_files);\\n\\n  if (!self->files)\\n    return;\\n\\n  /* Find first case of same URI in new playlist. */\\n  for (l = self->files; l; l = l->next) {`. This mirrors the guard already present in `check_media_seqnums()` and prevents dereferencing the `NULL` `f2` pointer."

[[finding]]
id          = "PANIC_3"
type        = "panic"
severity    = "critical"
difficulty  = "medium"
description = "In `rsn_dvdsrc_prepare_streamsinfo_event`, when `src->in_menu` is true or when in the VTS-domain branch, the return value of `get_vts_attr (src, src->vts_n)` is dereferenced (`vts_attr->nr_of_vtsm_audio_streams`, `vts_attr->nr_of_vts_audio_streams`, `vts_attr->nr_of_vts_subp_streams`, etc.) before the `NULL` check (`if (src->vts_n > 0 && vts_attr == NULL) return FALSE;`) is performed a few lines later. `get_vts_attr` legitimately returns `NULL` when `src->vts_attrs == NULL` or `n >= src->vts_attrs->len` (see `resindvdsrc.c:502-509`), which is precisely what happens when `read_vts_info` found no `vts_atrt` table on the disc (it sets `src->vts_attrs = NULL` and returns `TRUE` at `resindvdsrc.c:478-483`). This function is invoked from `rsn_dvdsrc_step` on every `DVDNAV_CELL_CHANGE` event (`resindvdsrc.c:1070`), which is driven directly by data read from the (untrusted) DVD. A disc/IFO structure lacking `vts_atrt`, followed by a title with `vts_n > 0`, causes a `NULL` pointer dereference and crashes the element."
locations   = ["subprojects/gst-plugins-bad/ext/resindvd/resindvdsrc.c:1943-1962"]
fix         = "Check `vts_attr` for `NULL` immediately after calling `get_vts_attr`, before dereferencing it, in both the `src->in_menu` branch and the VTS-domain `else` branch. For example:\n```c\n} else if (src->in_menu) {\n    vts_attr = get_vts_attr (src, src->vts_n);\n    if (vts_attr == NULL)\n      return FALSE;\n    v_attr = &vts_attr->vtsm_video_attr;\n    a_attrs = &vts_attr->vtsm_audio_attr;\n    n_audio = MAX (1, vts_attr->nr_of_vtsm_audio_streams);\n    s_attrs = &vts_attr->vtsm_subp_attr;\n    n_subp = MAX (1, vts_attr->nr_of_vtsm_subp_streams);\n} else {\n    vts_attr = get_vts_attr (src, src->vts_n);\n    if (vts_attr == NULL)\n      return FALSE;\n    v_attr = &vts_attr->vts_video_attr;\n    a_attrs = vts_attr->vts_audio_attr;\n    n_audio = vts_attr->nr_of_vts_audio_streams;\n    s_attrs = vts_attr->vts_subp_attr;\n    n_subp = vts_attr->nr_of_vts_subp_streams;\n}\n```\nand remove (or keep as a defensive no-op) the now-redundant later check."

[[finding]]
id          = "PANIC_4"
type        = "panic"
severity    = "critical"
difficulty  = "medium"
description = "`gst_gl_overlay_load_png` in `gstgloverlay.c` never calls `setjmp (png_jmpbuf (png_ptr))` before invoking libpng read functions (`png_read_info`, `png_read_image`, `png_read_end`, etc.). Standard libpng usage requires the caller to establish this `setjmp` target because, on any decoding error, libpng's default error handler (installed here since `png_set_error_fn` is only given a custom *warning* callback, `user_warning_fn`, and `NULL` for the error callback) calls `longjmp (png_jmpbuf (png_ptr), 1)`. Without a matching `setjmp`, this `longjmp` jumps to whatever garbage/uninitialized `jmp_buf` state happens to be in `png_ptr`, which is undefined behaviour and will typically crash the whole process. Since `location` (the overlay image path) can point to arbitrary, potentially attacker-controlled or corrupted image files, any malformed PNG overlay image triggers this."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgloverlay.c:745-863"]
fix         = "Add the required `setjmp` around the libpng calls:\n```c\npng_ptr = png_create_read_struct (PNG_LIBPNG_VER_STRING, NULL, NULL, NULL);\n...\ninfo_ptr = png_create_info_struct (png_ptr);\n...\nif (setjmp (png_jmpbuf (png_ptr))) {\n  png_destroy_read_struct (&png_ptr, &info_ptr, png_infopp_NULL);\n  GST_ELEMENT_ERROR (overlay, STREAM, DECODE, (\"PNG decoding error\"),\n      (\"File: %s\", overlay->location));\n  return FALSE;\n}\npng_set_error_fn (png_ptr, NULL, NULL, user_warning_fn);\n...\n```"

[[finding]]
id          = "PANIC_5"
type        = "panic"
severity    = "high"
difficulty  = "easy"
description = "In `_execute_appsrc_push`, when the `from-appsink` action field does not contain a `/` (i.e. the appsink is in the main pipeline, not a sub-pipeline), `pipeline_elements[1]` is `NULL` after `g_strsplit (from_appsink, \"/\", 2)`. The code correctly branches on `if (pipeline_elements[1])` to decide whether to look up a sub-pipeline, but then unconditionally calls `gst_bin_get_by_name (GST_BIN (pipeline), pipeline_elements[1])`, passing `NULL` as the element name in the no-slash case instead of `pipeline_elements[0]`. `gst_bin_get_by_name` forwards this to `compare_name()`, which calls `strcmp (GST_ELEMENT_NAME (element), name)` with `name == NULL`, causing a crash (undefined behavior/NULL deref) as soon as the bin has at least one child element."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:4489-4507"]
fix         = "Use `pipeline_elements[0]` as the appsink name when no pipeline prefix was given. Before: `GstElement *appsink =\\n    gst_bin_get_by_name (GST_BIN (pipeline), pipeline_elements[1]);` After: `GstElement *appsink =\\n    gst_bin_get_by_name (GST_BIN (pipeline),\\n        pipeline_elements[1] ? pipeline_elements[1] : pipeline_elements[0]);`"

[[finding]]
id          = "PANIC_6"
type        = "panic"
severity    = "high"
difficulty  = "very_easy"
description = "In `real_main` in `gst-validate-transcoding.c`, the local variable `profile_str` is declared with `const gchar *profile_str;` and never initialized. The `-o`/`--output-format` `GOptionEntry` only writes to `profile_str` if the option is actually passed on the command line. The subsequent check `if (profile_str == NULL) { ... profile_str = \"application/ogg:video/x-theora:audio/x-vorbis\"; }` therefore reads an indeterminate stack value when the user runs the tool without `-o`. Since the garbage value is very unlikely to be exactly `NULL`, the default profile is skipped and the garbage pointer is passed straight into `gst_transcoder_new` and `GST_INFO`, which is undefined behavior and will typically crash or produce nonsensical results."
locations   = ["subprojects/gst-devtools/validate/tools/gst-validate-transcoding.c:232", "subprojects/gst-devtools/validate/tools/gst-validate-transcoding.c:354-360"]
fix         = "Initialize the pointer to `NULL` at declaration:\nBefore:\n```c\nconst gchar *profile_str;\n```\nAfter:\n```c\nconst gchar *profile_str = NULL;\n```"

[[finding]]
id          = "PANIC_7"
type        = "panic"
severity    = "high"
difficulty  = "hard"
description = "In `ges_asset_request_async` (`ges-asset.c`), after looking up the cache with the normalized `real_id`, the code does a second, redundant lookup using the raw, caller-supplied `id` instead of `real_id`: `GESAssetCacheEntry *entry = _lookup_entry (extractable_type, id);`. `ges_asset_request_async()`'s `id` parameter is documented as `(allow-none)`, and many `GESExtractable` types (e.g. those using the default `ges_extractable_check_id_default()`, which ignores the passed `id` and always returns `g_strdup (g_type_name (type))`) are commonly requested with `id == NULL`. `_lookup_entry()` calls `g_hash_table_lookup (entries_table, id)` on a `g_str_hash`/`g_str_equal` table, and once an `entries_table` for that `extractable_type` already exists (e.g. after a prior asset of the same type was cached), passing a `NULL` key crashes inside `g_str_hash` (NULL pointer dereference). Even when it doesn't crash, using `id` instead of `real_id` means the second lookup silently fails to find the very entry that `ges_asset_cache_lookup(extractable_type, real_id)` just found (or could return an unrelated entry for a different, coincidentally-matching `id`), defeating the double-loading protection this code was added for."
locations   = ["subprojects/gst-editing-services/ges/ges-asset.c:1540-1551"]
fix         = "Use the normalized `real_id` consistently for the second lookup, matching the first:\nBefore:\n```c\nasset = ges_asset_cache_lookup (extractable_type, real_id);\nGESAssetCacheEntry *entry = _lookup_entry (extractable_type, id);\n```\nAfter:\n```c\nasset = ges_asset_cache_lookup (extractable_type, real_id);\nGESAssetCacheEntry *entry = _lookup_entry (extractable_type, real_id);\n```"

[[finding]]
id          = "PANIC_8"
type        = "panic"
severity    = "high"
difficulty  = "easy"
description = "`ges_title_clip_get_text`, `ges_title_clip_get_font_desc`, `ges_title_clip_get_halignment`, `ges_title_clip_get_valignment`, `ges_title_clip_get_text_color`, `ges_title_clip_get_background_color`, `ges_title_clip_get_xpos`, and `ges_title_clip_get_ypos` in `ges-title-clip.c` all dereference `self->priv->track_titles->data` without checking whether `self->priv->track_titles` is `NULL`. `track_titles` is only populated once a `GESTitleSource` track element has been added as a child of the clip (via `_child_added`), which happens lazily when the clip is placed into a timeline that has a video track. A freshly created clip from `ges_title_clip_new()` that has not yet been added to a timeline/track has `track_titles == NULL`, so `self->priv->track_titles->data` dereferences a `NULL` `GSList` pointer (`NULL->data`) and crashes. Notably, `ges_title_clip_get_property` (used for the modern GObject property path, lines 73-103) explicitly guards against this same case by constructing a temporary `GESTitleSource` when `priv->track_titles` is empty, showing that the empty-list case is known and expected, but the plain getter functions were never updated to do the same."
locations   = ["subprojects/gst-editing-services/ges/ges-title-clip.c:531-547", "subprojects/gst-editing-services/ges/ges-title-clip.c:560-576", "subprojects/gst-editing-services/ges/ges-title-clip.c:589-605", "subprojects/gst-editing-services/ges/ges-title-clip.c:618-634", "subprojects/gst-editing-services/ges/ges-title-clip.c:647-663", "subprojects/gst-editing-services/ges/ges-title-clip.c:676-692", "subprojects/gst-editing-services/ges/ges-title-clip.c:705-721", "subprojects/gst-editing-services/ges/ges-title-clip.c:733-749"]
fix         = "In each getter, check `self->priv->track_titles` for `NULL` before dereferencing it, falling back to a temporary `GESTitleSource` (mirroring the pattern already used in `ges_title_clip_get_property`). For example, in `ges_title_clip_get_text`:\n```c\nconst gchar *\nges_title_clip_get_text (GESTitleClip * self)\n{\n  gchar *text;\n  GESTimeline *_locked_timeline;\n  GESTimelineElement *child, *tmpsrc = NULL;\n\n  g_return_val_if_fail (GES_IS_TITLE_CLIP (self), NULL);\n\n  _locked_timeline = _ges_timeline_element_lock (GES_TIMELINE_ELEMENT (self));\n\n  if (!self->priv->track_titles)\n    child = tmpsrc = GES_TIMELINE_ELEMENT (ges_title_source_new ());\n  else\n    child = self->priv->track_titles->data;\n\n  ges_timeline_element_get_child_properties (child, \"text\", &text, NULL);\n\n  if (tmpsrc)\n    g_object_unref (tmpsrc);\n\n  _ges_timeline_element_unlock (GES_TIMELINE_ELEMENT (self), _locked_timeline);\n\n  return text;\n}\n```\nApply the analogous `NULL`-check-and-fallback pattern to the other seven getters (`ges_title_clip_get_font_desc`, `ges_title_clip_get_halignment`, `ges_title_clip_get_valignment`, `ges_title_clip_get_text_color`, `ges_title_clip_get_background_color`, `ges_title_clip_get_xpos`, `ges_title_clip_get_ypos`)."

[[finding]]
id          = "PANIC_9"
type        = "panic"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_ffmpegdemux_loop` (`gstavdemux.c`), for streams whose `codecpar->codec_id` is `AV_CODEC_ID_DSD_LSBF_PLANAR` or `AV_CODEC_ID_DSD_MSBF_PLANAR`, `num_channels` is taken directly from the (attacker-controlled) parsed stream metadata (`avstream->codecpar->ch_layout.nb_channels` or `avstream->codecpar->channels`). The code then computes `int num_bytes_per_channel = pkt.size / num_channels;` with no check that `num_channels` is non-zero. A crafted/malformed container that declares a DSD planar stream with `0` channels causes an integer division by zero, which is undefined behavior and reliably crashes the process (`SIGFPE` on common platforms) - a remotely triggerable denial of service simply by demuxing a malicious file."
locations   = ["subprojects/gst-libav/ext/libav/gstavdemux.c:1555-1577"]
fix         = "Guard the division and skip adding the meta when the channel count is invalid.\n\nBefore:\n```c\n      int num_bytes_per_channel = pkt.size / num_channels;\n      GstDsdPlaneOffsetMeta *plane_ofs_meta;\n\n      plane_ofs_meta = gst_buffer_add_dsd_plane_offset_meta (outbuf,\n          num_channels, num_bytes_per_channel, NULL);\n```\nAfter:\n```c\n      int num_bytes_per_channel;\n      GstDsdPlaneOffsetMeta *plane_ofs_meta;\n\n      if (num_channels <= 0)\n        break;\n\n      num_bytes_per_channel = pkt.size / num_channels;\n      plane_ofs_meta = gst_buffer_add_dsd_plane_offset_meta (outbuf,\n          num_channels, num_bytes_per_channel, NULL);\n```"

[[finding]]
id          = "PANIC_10"
type        = "panic"
severity    = "high"
difficulty  = "very_easy"
description = "`gst_aes_dec_prepare_output_buffer()` computes `g_assert (in_size > GST_AES_BLOCK_SIZE);` when `filter->serialize_iv && filter->awaiting_first_buffer`, using a strict `>` instead of `>=`. If the very first buffer received by `aesdec` (with `serialize-iv=true`) is exactly `GST_AES_BLOCK_SIZE` (16) bytes -- i.e. only the serialized IV with no actual ciphertext, which is a perfectly plausible malformed/short network segment -- the assertion fails and aborts the whole process (`g_assert` calls `abort()` when the condition is false). If assertions are compiled out (`G_DISABLE_ASSERT`), the subsequent `out_size -= GST_AES_BLOCK_SIZE;` on a `gsize` when `in_size == GST_AES_BLOCK_SIZE` yields `out_size == 0`, which is comparatively benign, but for the assert-enabled default build this is a remotely triggerable denial-of-service."
locations   = ["subprojects/gst-plugins-bad/ext/aes/gstaesdec.c:539-551"]
fix         = "Replace the strict inequality with a non-fatal check, e.g.:\nBefore:\n```c\n  if (filter->serialize_iv && filter->awaiting_first_buffer) {\n    g_assert (in_size > GST_AES_BLOCK_SIZE);\n    out_size -= GST_AES_BLOCK_SIZE;\n  }\n```\nAfter:\n```c\n  if (filter->serialize_iv && filter->awaiting_first_buffer) {\n    out_size -= MIN (out_size, GST_AES_BLOCK_SIZE);\n  }\n```\nand let `gst_aes_dec_transform()`'s existing `ciphertext_len < GST_AES_BLOCK_SIZE` check (which already runs before any decryption happens) reject the too-short buffer instead of asserting."

[[finding]]
id          = "PANIC_11"
type        = "panic"
severity    = "high"
difficulty  = "easy"
description = "In `gst_dash_demux_parse_isobmff`, when a parsed ISOBMFF box header reports `size == 0` (meaning 'box extends to end of file', legal ISOBMFF syntax for any box, not only `mdat`), the code does `g_assert (dash_stream->isobmff_parser.current_fourcc == GST_ISOFF_FOURCC_MDAT);` before treating it as `mdat`. A malformed or malicious media segment (fetched over the network from the DASH server/CDN, i.e. attacker- or MITM-controlled data) that declares a non-`mdat` box (e.g. `free`/`skip`/anything) with `size == 0` will trigger this assertion and abort the whole process. Similarly, `g_assert (dash_stream->moof == NULL);` right before parsing a `moof` box aborts if two `moof` boxes appear back-to-back in the same downloaded chunk before an `mdat` is seen (also attacker-controllable), since `dash_stream->moof` would already be set from the first one. Both are reachable via untrusted network content and turn a parse error into a crash (denial of service) instead of a graceful `GST_FLOW_ERROR`."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstdashdemux.c:2979-2985", "subprojects/gst-plugins-bad/ext/dash/gstdashdemux.c:3010-3011"]
fix         = "Replace the asserts with graceful error handling so malformed input produces a stream error instead of aborting:\n\nBefore:\n```c\nif (size == 0) {\n  /* We assume this is mdat, anything else with \"size until end\"\n   * does not seem to make sense */\n  g_assert (dash_stream->isobmff_parser.current_fourcc ==\n      GST_ISOFF_FOURCC_MDAT);\n  dash_stream->isobmff_parser.current_size = -1;\n  break;\n}\n```\n\nAfter:\n```c\nif (size == 0) {\n  if (dash_stream->isobmff_parser.current_fourcc != GST_ISOFF_FOURCC_MDAT) {\n    GST_ERROR_OBJECT (stream->pad,\n        \"Unexpected zero-sized box that is not mdat\");\n    gst_buffer_unmap (buffer, &map);\n    gst_buffer_unref (buffer);\n    return GST_FLOW_ERROR;\n  }\n  dash_stream->isobmff_parser.current_size = -1;\n  break;\n}\n```\nand likewise turn `g_assert (dash_stream->moof == NULL);` into an explicit `GST_ERROR_OBJECT`/`GST_FLOW_ERROR` return."

[[finding]]
id          = "PANIC_12"
type        = "panic"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_dash_sink_write_mpd_file`, if the `get-playlist-stream` signal handler returns `NULL` in `file_stream` (e.g. the file could not be opened), the code emits `GST_ELEMENT_ERROR` but does not return. Execution falls through to `g_output_stream_write_all (file_stream, mpd_content, bytes_to_write, NULL, NULL, &error)` with `file_stream == NULL`. `g_output_stream_write_all` guards against a `NULL` stream with `g_return_val_if_fail (G_IS_OUTPUT_STREAM (stream), FALSE)` and returns `FALSE` *without* setting `error`, so `error` stays `NULL`. The subsequent `GST_ERROR (\"Failed to write mpd content: %s\", error->message)` then dereferences the `NULL` `error`, crashing the element. `g_object_unref (file_stream)` at the end of the function would also warn/misbehave on a `NULL` `file_stream`."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstdashsink.c:934-983"]
fix         = "Return early when no output stream was obtained:\n\nBefore:\n```c\ng_signal_emit (sink, signals[SIGNAL_GET_PLAYLIST_STREAM], 0, mpd_filepath,\n    &file_stream);\nif (!file_stream) {\n  GST_ELEMENT_ERROR (sink, RESOURCE, OPEN_WRITE,\n      ((\"Got no output stream for fragment '%s'.\"), mpd_filepath), (NULL));\n}\n\nbytes_to_write = strlen (mpd_content);\nif (!g_output_stream_write_all (file_stream, mpd_content, bytes_to_write,\n        NULL, NULL, &error)) {\n```\n\nAfter:\n```c\ng_signal_emit (sink, signals[SIGNAL_GET_PLAYLIST_STREAM], 0, mpd_filepath,\n    &file_stream);\nif (!file_stream) {\n  GST_ELEMENT_ERROR (sink, RESOURCE, OPEN_WRITE,\n      ((\"Got no output stream for fragment '%s'.\"), mpd_filepath), (NULL));\n  g_free (mpd_content);\n  g_free (mpd_filepath);\n  return;\n}\n\nbytes_to_write = strlen (mpd_content);\nif (!g_output_stream_write_all (file_stream, mpd_content, bytes_to_write,\n        NULL, NULL, &error)) {\n```"

[[finding]]
id          = "PANIC_13"
type        = "panic"
severity    = "high"
difficulty  = "easy"
description = "In `gst_mpeg2enc_loop` (subprojects/gst-plugins-bad/ext/mpeg2enc/gstmpeg2enc.cc), `enc->encoder->init()` is called unconditionally right after `ret = enc->encoder->setup()`, before the `if (!ret)` check that handles setup failure. Looking at `GstMpeg2Encoder::setup()` in subprojects/gst-plugins-bad/ext/mpeg2enc/gstmpeg2encoder.cc, when `options.SetFormatPresets(strm)` fails, `setup()` explicitly sets `reader = NULL` (after deleting it) and returns `FALSE`, leaving `writer`, `quantizer`, `pass1ratectl`, `pass2ratectl` and `seqencoder` all `NULL` as well. `GstMpeg2Encoder::init()` unconditionally dereferences `reader->Init()`, `quantizer->Init()`, and `seqencoder->Init()`. Because `gst_mpeg2enc_loop` calls `enc->encoder->init()` before checking `ret`, a `setup()` failure (which can be triggered simply by negotiating caps/format combination that `SetFormatPresets` rejects, e.g. an unsupported profile/resolution combination) leads to a guaranteed NULL pointer dereference and crash inside `init()`, instead of taking the intended `goto encoder;` error-handling path."
locations   = ["subprojects/gst-plugins-bad/ext/mpeg2enc/gstmpeg2enc.cc:588-624", "subprojects/gst-plugins-bad/ext/mpeg2enc/gstmpeg2encoder.cc:72-119"]
fix         = "Move the `if (!ret) { ...; goto encoder; }` check to immediately after `ret = enc->encoder->setup ();`, before the `g_assert`, latency calculation, and `enc->encoder->init ()` call. For example: `ret = enc->encoder->setup (); if (!ret) { GST_MPEG2ENC_MUTEX_LOCK (enc); enc->srcresult = GST_FLOW_NOT_NEGOTIATED; GST_MPEG2ENC_SIGNAL (enc); GST_MPEG2ENC_MUTEX_UNLOCK (enc); goto encoder; } g_assert (enc->options->max_GOP_size != -1); ... enc->encoder->init ();` This guarantees `enc->encoder->init()` (and thus `reader->Init()`, `quantizer->Init()`, `seqencoder->Init()`) is never called on the NULL members left behind by a failed `setup()`."

[[finding]]
id          = "PANIC_14"
type        = "panic"
severity    = "high"
difficulty  = "medium"
description = "`gst_openexr_dec_negotiate` calls `self->output_state = gst_video_decoder_set_output_state (GST_VIDEO_DECODER (self), format, width, height, self->input_state);` without checking for `NULL`. `gst_video_decoder_set_output_state` is documented as `(nullable)` and returns `NULL` when the requested `width`/`height` are not a valid combination for a `GstVideoInfo` (e.g. because `width` or `height` computed from the attacker-controlled EXR `dataWindow` is `<= 0`, or overflows when implicitly converted from `gint` to the `guint` parameter). The very next line dereferences the result unconditionally: `gst_util_double_to_fraction (par, &self->output_state->info.par_n, &self->output_state->info.par_d);`, which is a `NULL` pointer dereference if `gst_video_decoder_set_output_state` failed."
locations   = ["subprojects/gst-plugins-bad/ext/openexr/gstopenexrdec.cpp:297-302"]
fix         = "Check the return value before using it, e.g.: `self->output_state = gst_video_decoder_set_output_state (...); if (!self->output_state) return GST_FLOW_NOT_NEGOTIATED;` before calling `gst_util_double_to_fraction` on `self->output_state->info`."

[[finding]]
id          = "PANIC_15"
type        = "panic"
severity    = "high"
difficulty  = "very_easy"
description = "In `get_qrcode_content` (`subprojects/gst-plugins-bad/ext/qroverlay/gstdebugqroverlay.c`), the code computes `filter->frame_number % filter->extra_data_interval_buffers`. The `extra-data-interval-buffers` property is declared with a minimum of `0` (`g_param_spec_int64 (..., 0, G_MAXINT64, 60, ...)`), so a user can legally set it to `0`. Once `frame_number != 1`, the modulo operation `frame_number % 0` is evaluated, which is undefined behavior and crashes with `SIGFPE` on common platforms."
locations   = ["subprojects/gst-plugins-bad/ext/qroverlay/gstdebugqroverlay.c:128-134", "subprojects/gst-plugins-bad/ext/qroverlay/gstdebugqroverlay.c:278-282"]
fix         = "Disallow zero for the property (or guard the modulo). E.g.:\nBefore:\n```c\n  g_object_class_install_property (gobject_class,\n      PROP_DATA_INTERVAL_BUFFERS,\n      g_param_spec_int64 (\"extra-data-interval-buffers\",\n          \"extra-data-interval-buffers\",\n          \"Extra data append into the Qrcode at the first buffer of each \"\n          \" interval\", 0, G_MAXINT64, 60,\n          G_PARAM_READWRITE | G_PARAM_STATIC_STRINGS));\n```\nAfter:\n```c\n  g_object_class_install_property (gobject_class,\n      PROP_DATA_INTERVAL_BUFFERS,\n      g_param_spec_int64 (\"extra-data-interval-buffers\",\n          \"extra-data-interval-buffers\",\n          \"Extra data append into the Qrcode at the first buffer of each \"\n          \" interval\", 1, G_MAXINT64, 60,\n          G_PARAM_READWRITE | G_PARAM_STATIC_STRINGS));\n```"

[[finding]]
id          = "PANIC_16"
type        = "panic"
severity    = "high"
difficulty  = "easy"
description = "In `GstQt6D3D11VideoItem::setCaps` (`subprojects/gst-plugins-bad/ext/qt6d3d11/gstqt6d3d11videoitem.cpp`), the return value of `gst_video_calculate_display_ratio` is never checked. That function only writes to `num`/`den` on success (`return TRUE`); on overflow or when the internally computed ratio is `<= 0` it returns `FALSE` without touching its output parameters at all. Since `num` and `den` are uninitialized locals in `setCaps`, a failure leaves them holding indeterminate stack garbage, which is then used in `display_width_ % num` immediately afterwards."
locations   = ["subprojects/gst-plugins-bad/ext/qt6d3d11/gstqt6d3d11videoitem.cpp:145-166"]
fix         = "Check the return value of `gst_video_calculate_display_ratio` and fall back to sane values (and guard against `num == 0`) before using it, e.g.:\n\nBefore:\n```\n  gst_video_calculate_display_ratio (&num, &den, info_.width, info_.height,\n      info_.par_n, info_.par_d, 1, 1);\n\n  display_width_ = info_.width;\n  display_height_ = info_.height;\n\n  if (display_width_ % num == 0) {\n```\nAfter:\n```\n  if (!gst_video_calculate_display_ratio (&num, &den, info_.width,\n          info_.height, info_.par_n, info_.par_d, 1, 1)) {\n    num = info_.width;\n    den = info_.height;\n  }\n\n  display_width_ = info_.width;\n  display_height_ = info_.height;\n\n  if (num != 0 && display_width_ % num == 0) {\n```"

[[finding]]
id          = "PANIC_17"
type        = "panic"
severity    = "high"
difficulty  = "easy"
description = "`gst_gl_effects_get_fragment_shader` can return `NULL` when shader compilation/linking fails (it only reassigns `shader` from `gst_gl_shader_new_link_with_stages` on success and otherwise leaves it `NULL`, posting a `GST_ELEMENT_ERROR` but still returning `NULL`). `gst_gl_effects_blur`, `gst_gl_effects_bulge`, `gst_gl_effects_fisheye`, `gst_gl_effects_glow` and `gst_gl_effects_laplacian` all call this function and then immediately call `gst_gl_shader_use (shader)` and/or `gst_gl_filter_render_to_target_with_shader (filter, ..., shader)` without checking for `NULL`, unlike `gst_gl_effects_identity` which does check its own shader result before use. A GLSL compile/link failure (e.g. on a GLES2-only driver lacking a feature the fragment source needs) will null-pointer-dereference inside the shader-use/render path."
locations   = ["subprojects/gst-plugins-base/ext/gl/effects/gstgleffectblur.c:48-73", "subprojects/gst-plugins-base/ext/gl/effects/gstgleffectbulge.c:26-36", "subprojects/gst-plugins-base/ext/gl/effects/gstgleffectfisheye.c:26-36", "subprojects/gst-plugins-base/ext/gl/effects/gstgleffectglow.c:29-86", "subprojects/gst-plugins-base/ext/gl/effects/gstgleffectlaplacian.c:34-52"]
fix         = "Check the returned shader before use in each effect function, e.g. ```c\nshader = gst_gl_effects_get_fragment_shader (effects, \"bulge\", bulge_fragment_source_gles2);\nif (!shader)\n  return;\ngst_gl_filter_render_to_target_with_shader (filter, effects->intexture, effects->outtexture, shader);\n```"

[[finding]]
id          = "PANIC_18"
type        = "panic"
severity    = "high"
difficulty  = "medium"
description = "`gst_gl_overlay_load_jpeg` installs libjpeg's default error manager via `cinfo.err = jpeg_std_error (&jerr);` and never overrides `jerr.error_exit`. libjpeg's default `error_exit` prints a message and then calls `exit(1)`, terminating the entire process (not just failing the element or the pipeline), whenever it encounters a corrupt/truncated/malformed JPEG. Because `location` can point to arbitrary files, feeding `gloverlay` a malformed JPEG is enough to kill the whole application, not just this element."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgloverlay.c:683-743"]
fix         = "Install a custom error manager that longjmps back into the function instead of calling `exit()`, e.g.:\n```c\nstruct gl_overlay_jpeg_error_mgr {\n  struct jpeg_error_mgr pub;\n  jmp_buf setjmp_buffer;\n};\n\nstatic void\ngl_overlay_jpeg_error_exit (j_common_ptr cinfo)\n{\n  struct gl_overlay_jpeg_error_mgr *err =\n      (struct gl_overlay_jpeg_error_mgr *) cinfo->err;\n  longjmp (err->setjmp_buffer, 1);\n}\n```\nand use `jpeg_std_error (&err.pub); err.pub.error_exit = gl_overlay_jpeg_error_exit;` together with `if (setjmp (err.setjmp_buffer)) { jpeg_destroy_decompress (&cinfo); return FALSE; }` before calling into libjpeg."

[[finding]]
id          = "PANIC_19"
type        = "panic"
severity    = "high"
difficulty  = "easy"
description = "`gst_device_has_classesv` calls `strstr (device->priv->device_class, klass)` without checking whether `device->priv->device_class` is `NULL`. The `device-class` property is declared `G_PARAM_CONSTRUCT_ONLY` (not `G_PARAM_CONSTRUCT`), so if a `GstDevice` subclass never explicitly passes `\"device-class\"` to `g_object_new`, `gst_device_set_property` for `PROP_DEVICE_CLASS` is never invoked and `priv->device_class` stays `NULL` (zero-initialized). Calling `gst_device_has_classesv` (or `gst_device_has_classes`, which forwards to it) on such a device dereferences a `NULL` pointer inside `strstr`, crashing the process. Note that the getter `gst_device_get_device_class` already defends against this exact case (`if (device->priv->device_class != NULL) ... else return g_strdup (\"\")`), showing the class field is known to be nullable, but the classes-matching function was not updated to match."
locations   = ["subprojects/gstreamer/gst/gstdevice.c:356-385"]
fix         = "Guard against a `NULL` device class before calling `strstr`, e.g.:\n```c\nconst gchar *device_class = device->priv->device_class ? device->priv->device_class : \"\";\n...\nfound = strstr (device_class, klass);\n```"

[[finding]]
id          = "PANIC_20"
type        = "panic"
severity    = "medium"
difficulty  = "easy"
description = "In `deserialize_framenode` (`media-descriptor-parser.c`), `framenode->checksum` is only set if the parsed XML `<frame>` element carries a `checksum` attribute; otherwise it stays `NULL` (from `g_new0`). The function then unconditionally calls `gst_buffer_new_wrapped (framenode->checksum, strlen (framenode->checksum) + 1)`, which dereferences `framenode->checksum` via `strlen (NULL)`, crashing the process. Since this code parses externally supplied `.media` descriptor XML files (via `gst_validate_media_descriptor_parser_new`/`_new_from_xml`), a manually edited or corrupted descriptor missing the `checksum` attribute on a `<frame>` element crashes `gst-validate-media-check`/any tool using the parser."
locations   = ["subprojects/gst-devtools/validate/gst/validate/media-descriptor-parser.c:161-214"]
fix         = "Guard against a missing checksum, e.g.: `framenode->buf = gst_buffer_new_wrapped (framenode->checksum ? framenode->checksum : g_strdup (\"\"), framenode->checksum ? strlen (framenode->checksum) + 1 : 1);` or reject the frame element earlier if `checksum` is missing, similarly to how other required attributes should be validated."

[[finding]]
id          = "PANIC_21"
type        = "panic"
severity    = "medium"
difficulty  = "medium"
description = "`on_start_element_cb` in `media-descriptor-parser.c` assumes strict, well-nested XML structure without validating it: for a `<segment>` or `<frame>` element it does `GstValidateMediaStreamNode *streamnode = filenode->streams->data;` without checking that `filenode->streams` is non-NULL, and for a top-level `<tag>` element (outside any `<stream>`) it uses `tagsnode = filenode->tags;` (which is only set once a `<tags>` element has been seen) before doing `tagsnode->tags = g_list_prepend (tagsnode->tags, ...)`. A media descriptor XML file with a `<segment>`, `<frame>`, or `<tag>` element that is not nested under a preceding `<stream>`/`<tags>` element (as `GMarkupParser` only checks well-formedness, not this schema) dereferences a `NULL` `GList`/pointer and crashes the parser."
locations   = ["subprojects/gst-devtools/validate/gst/validate/media-descriptor-parser.c:229-286"]
fix         = "Check for `NULL` before dereferencing, e.g. `if (!filenode->streams) { GST_ERROR (\"<segment> outside of <stream>\"); return; }` (and similarly for `<frame>` and `<tag>`/`tagsnode`), reporting a parse error via `error` instead of dereferencing NULL."

[[finding]]
id          = "PANIC_22"
type        = "panic"
severity    = "medium"
difficulty  = "medium"
description = "In `_create_keyboard_events()` (`gstvalidategtk.c`), the return value of `gdk_keymap_get_entries_for_keyval()` is not checked. GDK documents that when a `keyval` has no matching keymap entries, this function returns `FALSE` and sets `*keys` to `NULL` and `*n_keys` to `0`. The code unconditionally does `kmaps[0].keycode` right after the call, so a character with no keymap entry (`gdk_unicode_to_keyval(string[i])` for an unusual/unsupported Unicode character in a `string=` GstValidate action) dereferences a NULL `kmaps` pointer and crashes the process."
locations   = ["subprojects/gst-devtools/validate/plugins/gtk/gstvalidategtk.c:176-191"]
fix         = "Check the return value before indexing:\nBefore:\n```c\ngdk_keymap_get_entries_for_keyval (gdk_keymap_get_for_display\n    (gdk_display_get_default ()), keyval, &kmaps, &n_keys);\n\nevents =\n    g_list_append (events, _create_key_event (window, etype, keyval,\n        kmaps[0].keycode, 0, device));\n```\nAfter:\n```c\nif (gdk_keymap_get_entries_for_keyval (gdk_keymap_get_for_display\n        (gdk_display_get_default ()), keyval, &kmaps, &n_keys)) {\n  events =\n      g_list_append (events, _create_key_event (window, etype, keyval,\n          kmaps[0].keycode, 0, device));\n  g_free (kmaps);\n}\n```"

[[finding]]
id          = "PANIC_23"
type        = "panic"
severity    = "medium"
difficulty  = "easy"
description = "In `_add_child`, when adding a non-core `GES_IS_EFFECT` element, the code does `const gchar *bindesc = ges_asset_get_id (asset);` followed directly by `strstr (bindesc, \"gesvideoscale\")` without checking whether `bindesc` is `NULL`. `ges_asset_get_id` returns `NULL` if `asset` is `NULL` (via `g_return_val_if_fail (GES_IS_ASSET (self), NULL)`), and `ges_extractable_get_asset` can return `NULL` for an extractable that has no asset set. Passing a `NULL` haystack to `strstr` is undefined behavior and crashes on typical libc implementations. The sibling code in `_remove_child`, added in the very same commit (`bad6b7e60a180db2c0c2d556135d38e263f19fab`), guards this exact case with `if (bindesc && !strstr (bindesc, \"gesvideoscale\"))`, showing the `_add_child` path was simply never given the same guard."
locations   = ["subprojects/gst-editing-services/ges/ges-clip.c:1786-1791"]
fix         = "Add the same NULL guard used in `_remove_child`:\nBefore:\n```c\n    if (GES_IS_EFFECT (element)) {\n      GESAsset *asset = ges_extractable_get_asset (GES_EXTRACTABLE (element));\n      const gchar *bindesc = ges_asset_get_id (asset);\n\n      adding_scale_effect = !strstr (bindesc, \"gesvideoscale\");\n    }\n```\nAfter:\n```c\n    if (GES_IS_EFFECT (element)) {\n      GESAsset *asset = ges_extractable_get_asset (GES_EXTRACTABLE (element));\n      const gchar *bindesc = ges_asset_get_id (asset);\n\n      adding_scale_effect = bindesc && !strstr (bindesc, \"gesvideoscale\");\n    }\n```"

[[finding]]
id          = "PANIC_24"
type        = "panic"
severity    = "medium"
difficulty  = "medium"
description = "In `list_sources` (`subprojects/gst-editing-services/ges/ges-pitivi-formatter.c`), `id` and `filename` are read from the untrusted `.xptv` XML file via `g_hash_table_lookup (table, \"id\")` / `g_hash_table_lookup (table, \"filename\")` with no NULL check. If a malformed/malicious project file has a `<source>` element missing the `id` or `filename` attribute, `g_strdup (id)` (or `filename`) yields `NULL`, and `g_hash_table_insert (priv->sources_table, NULL, table)` (or `priv->source_uris`) is then called on a table created with `g_str_hash`/`g_str_equal`. `g_str_hash` dereferences its argument unconditionally, so hashing a `NULL` key crashes the process (NULL pointer dereference) while parsing an attacker-supplied project file."
locations   = ["subprojects/gst-editing-services/ges/ges-pitivi-formatter.c:253-259"]
fix         = "Validate that `id` and `filename` are non-NULL before inserting/using them, e.g. `if (!id || !filename) { GST_WARNING (\"Skipping malformed <source> element\"); g_hash_table_destroy (table); continue; }` before the `g_hash_table_insert` calls."

[[finding]]
id          = "PANIC_25"
type        = "panic"
severity    = "medium"
difficulty  = "easy"
description = "`find_best_compositor_factory()` calls `gst_registry_feature_filter()` to find any `Compositor`-klass element factory, then does `g_assert (result);` before dereferencing the list. If no such element is registered (e.g. a minimal GStreamer install without `compositor`/`glvideomixer`/etc.), this `g_assert` aborts the whole process. This defeats the caller's own graceful-fallback design: `resolve_video_element_selector()` immediately follows with `if (!self->compositor) goto fallback;`, which can never be reached because the process is already aborted inside `find_best_compositor_factory()`."
locations   = ["subprojects/gst-editing-services/ges/ges-video-element-selector.c:264-279"]
fix         = "Replace the `g_assert` with a graceful `NULL` return so the caller's existing fallback path runs, e.g.:\nbefore:\n```\n  result = g_list_sort (result, gst_plugin_feature_rank_compare_func);\n  g_assert (result);\n\n  factory = gst_object_ref (result->data);\n```\nafter:\n```\n  result = g_list_sort (result, gst_plugin_feature_rank_compare_func);\n  if (!result)\n    return NULL;\n\n  factory = gst_object_ref (result->data);\n```"

[[finding]]
id          = "PANIC_26"
type        = "panic"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_ffmpeg_cfg_install_properties`, if `avcodec_alloc_context3 (in_plugin)` fails and returns `NULL`, the code only logs `g_warning (\"could not get context\")` and then unconditionally continues to use `ctx` via `install_opts ((GObjectClass *) klass, &ctx->av_class, prop_id, flags, ...)`, dereferencing the `NULL` `ctx` pointer (through `av_opt_next`, which dereferences the passed `const AVClass **obj`). This causes a crash instead of gracefully failing when the allocation fails (e.g. under memory pressure)."
locations   = ["subprojects/gst-libav/ext/libav/gstavcfg.c:470-493"]
fix         = "Return early when the context allocation fails instead of merely warning:\n```\nctx = avcodec_alloc_context3 (in_plugin);\nif (!ctx) {\n  g_warning (\"could not get context\");\n  return;\n}\n```\nso `&ctx->av_class` is never computed/dereferenced with a `NULL` `ctx`."

[[finding]]
id          = "PANIC_27"
type        = "panic"
severity    = "medium"
difficulty  = "easy"
description = "`gst_ffmpegvidenc_add_cc()` calls `sd = av_frame_new_side_data (picture, AV_FRAME_DATA_A53_CC, cc_meta->size);` and immediately dereferences `sd->data` in the following `memcpy()` without checking whether `av_frame_new_side_data()` returned `NULL` (which it can on allocation failure). A `GstVideoCaptionMeta` with an unusual/huge `size` (or an allocation failure under memory pressure) causes a `NULL` pointer dereference and crash."
locations   = ["subprojects/gst-libav/ext/libav/gstavvidenc.c:525-541"]
fix         = "Check the return value before using it:\n```c\nsd = av_frame_new_side_data (picture, AV_FRAME_DATA_A53_CC, cc_meta->size);\nif (!sd) {\n  GST_WARNING (\"Failed to allocate side data for closed captions\");\n  continue;\n}\nmemcpy (sd->data, cc_meta->data, cc_meta->size);\n```"

[[finding]]
id          = "PANIC_28"
type        = "panic"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_lcms_set_property` (`subprojects/gst-plugins-bad/ext/colormanagement/gstlcms.c`), the `PROP_DST_FILE` (`dest-profile`) case calls `g_file_test (filename, ...)` without first checking `filename != NULL`, unlike the sibling `PROP_SRC_FILE` case a few lines above which does check `filename &&  g_file_test(...)`. If an application calls `g_object_set (lcms, \"dest-profile\", NULL, NULL)` (a valid way to reset a `G_TYPE_STRING` property, whose default is `NULL`), `g_value_get_string` returns `NULL` and `g_file_test (NULL, ...)` dereferences a NULL pointer inside GLib/libc, crashing the process."
locations   = ["subprojects/gst-plugins-bad/ext/colormanagement/gstlcms.c:341-356"]
fix         = "Add the same NULL guard used for `PROP_SRC_FILE`: change `if (g_file_test (filename, (GFileTest) (G_FILE_TEST_EXISTS | G_FILE_TEST_IS_REGULAR))) {` to `if (filename && g_file_test (filename, (GFileTest) (G_FILE_TEST_EXISTS | G_FILE_TEST_IS_REGULAR))) {`."

[[finding]]
id          = "PANIC_29"
type        = "panic"
severity    = "medium"
difficulty  = "medium"
description = "`gst_qml6_d3d11_sink_do_gpu_copy` and `GstQSG6D3D11Node::SetBuffer` both call `gst_memory_map` on the source/destination D3D11 memories and immediately cast `.data` to `ID3D11Texture2D *` and call virtual methods on it (`GetDesc`), without checking the boolean return value of `gst_memory_map`. If either mapping fails (e.g. concurrent access, device error), `src_info`/`dst_info` are left zero-initialized, so `src_tex`/`dst_tex` end up `nullptr` and the subsequent `src_tex->GetDesc(...)` / `dst_tex->GetDesc(...)` calls dereference a null pointer."
locations   = ["subprojects/gst-plugins-bad/ext/qt6d3d11/gstqml6d3d11sink.cpp:557-569", "subprojects/gst-plugins-bad/ext/qt6d3d11/gstqsg6d3d11node.cpp:226-235"]
fix         = "Check the return value of `gst_memory_map` before dereferencing the mapped pointers, e.g. in `gst_qml6_d3d11_sink_do_gpu_copy`:\n\nBefore:\n```\n    gst_memory_map (src_mem, &src_info,\n        (GstMapFlags) (GST_MAP_READ | GST_MAP_D3D11));\n    gst_memory_map (dst_mem,\n        &dst_info, (GstMapFlags) (GST_MAP_WRITE | GST_MAP_D3D11));\n\n    src_tex = (ID3D11Texture2D *) src_info.data;\n    dst_tex = (ID3D11Texture2D *) dst_info.data;\n```\nAfter:\n```\n    if (!gst_memory_map (src_mem, &src_info,\n            (GstMapFlags) (GST_MAP_READ | GST_MAP_D3D11)) ||\n        !gst_memory_map (dst_mem, &dst_info,\n            (GstMapFlags) (GST_MAP_WRITE | GST_MAP_D3D11))) {\n      GST_ERROR_OBJECT (self, \"Couldn't map d3d11 memory\");\n      gst_buffer_unref (out_buf);\n      return nullptr;\n    }\n\n    src_tex = (ID3D11Texture2D *) src_info.data;\n    dst_tex = (ID3D11Texture2D *) dst_info.data;\n```\nApply the analogous check in `GstQSG6D3D11Node::SetBuffer`."

[[finding]]
id          = "PANIC_30"
type        = "panic"
severity    = "medium"
difficulty  = "medium"
description = "`GstQSG6D3D11Node::resize` (`subprojects/gst-plugins-bad/ext/qt6d3d11/gstqsg6d3d11node.cpp`) calls `gst_buffer_pool_acquire_buffer (pool_, &backbuffer_, nullptr)` without checking the returned `GstFlowReturn`. If acquisition fails (e.g. the D3D11 device is lost/reset or the pool is deactivated concurrently), `backbuffer_` stays `nullptr`, and the following lines unconditionally call `gst_buffer_peek_memory (backbuffer_, 0)` and `gst_d3d11_memory_get_resource_handle (dmem)`, ultimately passing a null texture handle into `QNativeInterface::QSGD3D11Texture::fromNative`, which is not a supported input for that Qt API and can crash the rendering thread."
locations   = ["subprojects/gst-plugins-bad/ext/qt6d3d11/gstqsg6d3d11node.cpp:135-142"]
fix         = "Check the acquisition result before using `backbuffer_`:\n\nBefore:\n```\n  gst_buffer_pool_acquire_buffer (pool_, &backbuffer_, nullptr);\n\n  dmem = (GstD3D11Memory *) gst_buffer_peek_memory (backbuffer_, 0);\n```\nAfter:\n```\n  if (gst_buffer_pool_acquire_buffer (pool_, &backbuffer_, nullptr) !=\n      GST_FLOW_OK) {\n    GST_ERROR (\"Couldn't acquire backbuffer\");\n    return;\n  }\n\n  dmem = (GstD3D11Memory *) gst_buffer_peek_memory (backbuffer_, 0);\n```"

[[finding]]
id          = "PANIC_31"
type        = "panic"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_alsa_device_provider_probe_pcm_sinks`, `name = snd_device_name_get_hint (*n, \"NAME\")` is used directly in `gst_alsa_pcm_name_matches_any_pattern (name, allow_patterns)` without a NULL check, unlike the `desc` hint which is explicitly checked a few lines later (`if (!desc) { ... goto next_hint; }`). `gst_alsa_pcm_name_matches_any_pattern` (via `gst_alsa_pcm_name_matches_pattern`) does `g_assert (name);`, so a hint entry lacking a `NAME` field aborts the process instead of being skipped."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsadeviceprovider.c:190-202"]
fix         = "Check `name` for NULL the same way `desc` is checked: ```c\nif (!name) {\n  free (desc); free (io);\n  continue;\n}\n```"

[[finding]]
id          = "PANIC_32"
type        = "panic"
severity    = "medium"
difficulty  = "easy"
description = "Both `gst_gl_overlay_load_jpeg` and `gst_gl_overlay_load_png` call `gst_gl_base_memory_alloc` and store the result directly in `overlay->image_memory` without checking for `NULL`, then immediately call `gst_memory_map ((GstMemory *) overlay->image_memory, ...)`. If the GL memory allocation fails (OOM, GL error), `overlay->image_memory` is `NULL` and `gst_memory_map` is called on a `NULL` pointer, which dereferences it. Additionally, in `gst_gl_overlay_load_png`, `rows = (guchar **) malloc (sizeof (guchar *) * height);` is used without checking for allocation failure; for a crafted PNG with a very large `height`, `rows` can be `NULL` (or the multiplication can overflow on platforms where `size_t` is 32-bit), and the following `for (y = 0; y < height; ++y) rows[y] = ...;` loop then writes through a `NULL`/wrapped pointer."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgloverlay.c:721-732", "subprojects/gst-plugins-base/ext/gl/gstgloverlay.c:836-849"]
fix         = "Check the allocation results before using them:\n```c\noverlay->image_memory = (GstGLMemory *)\n    gst_gl_base_memory_alloc (mem_allocator, (GstGLAllocationParams *) params);\ngst_gl_allocation_params_free ((GstGLAllocationParams *) params);\ngst_object_unref (mem_allocator);\nif (!overlay->image_memory)\n  return FALSE;\n```\nand for `rows`:\n```c\nrows = (guchar **) g_try_malloc_n (height, sizeof (guchar *));\nif (!rows) {\n  png_destroy_read_struct (&png_ptr, &info_ptr, png_infopp_NULL);\n  return FALSE;\n}\n```"

[[finding]]
id          = "PANIC_33"
type        = "panic"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_visual_setup`, after allocating `visual->actor`, `visual->video` and `visual->audio` via `visual_actor_new()`/`visual_video_new()`/`visual_audio_new()`, only `visual->actor` and `visual->video` are checked for allocation failure (`if (!visual->actor || !visual->video) goto no_actors;`). If `visual_audio_new()` returns `NULL` (e.g. under memory pressure), `visual->audio` stays `NULL` and setup proceeds to return `TRUE`. `gst_visual_render` later dereferences `visual->audio->samplepool` unconditionally, which would crash on a `NULL` `visual->audio`."
locations   = ["subprojects/gst-plugins-base/ext/libvisual/visual.c:171-177", "subprojects/gst-plugins-base/ext/libvisual/visual.c:282-288"]
fix         = "Include `visual->audio` in the failure check:\n\n```c\nif (!visual->actor || !visual->video || !visual->audio)\n  goto no_actors;\n```"

[[finding]]
id          = "PANIC_34"
type        = "panic"
severity    = "medium"
difficulty  = "easy"
description = "`_fallback_mem_copy` in `gstallocator.c` calls `copy = gst_allocator_alloc (allocator, size, &params);` and never checks whether `copy` is `NULL` before using it: `gst_memory_map (copy, &dinfo, GST_MAP_WRITE)` is called unconditionally, and on the failure branch `gst_allocator_free (copy->allocator, copy)` dereferences `copy` directly. `gst_allocator_alloc` can legitimately return `NULL` (allocation failure/OOM, or the allocator's `alloc` vfunc returning `NULL`, e.g. via the overflow guards in `_sysmem_new_block`), which turns a normal allocation failure into a NULL pointer dereference / crash instead of a graceful `NULL` return from `_fallback_mem_copy`."
locations   = ["subprojects/gstreamer/gst/gstallocator.c:91-126"]
fix         = "Check the allocation result before using it:\n```c\ncopy = gst_allocator_alloc (allocator, size, &params);\nif (!copy) {\n  gst_memory_unmap (mem, &sinfo);\n  return NULL;\n}\n\nif (!gst_memory_map (copy, &dinfo, GST_MAP_WRITE)) {\n  ...\n}\n```"

[[finding]]
id          = "PANIC_35"
type        = "panic"
severity    = "medium"
difficulty  = "easy"
description = "`gst_meta_api_type_get_tags` in subprojects/gstreamer/gst/gstmeta.c fetches `tags = g_type_get_qdata (api, _gst_meta_tags_quark);` and immediately dereferences it with `if (!tags[0])` without checking `tags` for `NULL` first. `g_type_get_qdata()` returns `NULL` whenever no such qdata was ever attached to `api` (e.g. an `api` GType that was not created through `gst_meta_api_type_register()`), which causes a `NULL` pointer dereference/crash. The sibling function `gst_meta_api_type_tags_contain_only` (a few lines below) performs the same lookup and correctly guards against this with `if (!tags) return TRUE;`, confirming this is a missing check rather than an invariant that always holds."
locations   = ["subprojects/gstreamer/gst/gstmeta.c:409-421"]
fix         = "Add a NULL check before dereferencing, mirroring `gst_meta_api_type_tags_contain_only`:\n```c\n  tags = g_type_get_qdata (api, _gst_meta_tags_quark);\n\n+  if (!tags)\n+    return NULL;\n+\n  if (!tags[0])\n    return NULL;\n```"

[[finding]]
id          = "PANIC_36"
type        = "panic"
severity    = "low"
difficulty  = "easy"
description = "In `TsPlot.report()` (`subprojects/gst-devtools/tracer/gsttr-tsplot.py`), `self.buf_files` is populated per pad-index by `_log_buffer` while `self.ev_ypos` is populated per pad-index by `_log_event`, independently. `report()` iterates `self.buf_files.items()` and does `ypos_max = (2 + len(self.ev_ypos[ix])) * -10`. If a pad ever receives buffers but no (handled) events at all, `ix` will be present in `self.buf_files` but absent from `self.ev_ypos`, causing an unhandled `KeyError` that crashes the whole report generation."
locations   = ["subprojects/gst-devtools/tracer/gsttr-tsplot.py:240-251"]
fix         = "Use `.get(ix, {})` to fall back to an empty mapping when no events were seen on that pad:\nBefore:\n```python\nypos_max = (2 + len(self.ev_ypos[ix])) * -10\n```\nAfter:\n```python\nypos_max = (2 + len(self.ev_ypos.get(ix, {}))) * -10\n```"

[[finding]]
id          = "PANIC_37"
type        = "panic"
severity    = "low"
difficulty  = "easy"
description = "In `_execute_start_http_server`, `g_data_input_stream_read_line (data_stream, NULL, NULL, &err)` returns `NULL` both on error and on a clean end-of-stream with no data read; in the EOF case `err` stays `NULL` too. The code only checks `REPORT_UNLESS (err == NULL, done, ...)` before calling `sscanf (line, \"PORT: %d\", &port)`, so if the HTTP server subprocess produces no output line before closing its stdout, `line` is `NULL` and `sscanf` is called with a `NULL` format-string argument, which is undefined behavior (typically a crash)."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:8009-8018"]
fix         = "Also check that `line` is non-NULL before parsing it. Before: `REPORT_UNLESS (err == NULL, done, \"Failed to read server output: %s\",\\n      err->message);\\n  REPORT_UNLESS (sscanf (line, \"PORT: %d\", &port) == 1, done,\\n      \"Failed to parse port number from server output: %s\", line);` After: `REPORT_UNLESS (err == NULL, done, \"Failed to read server output: %s\",\\n      err->message);\\n  REPORT_UNLESS (line, done, \"Server closed its output before printing a port\");\\n  REPORT_UNLESS (sscanf (line, \"PORT: %d\", &port) == 1, done,\\n      \"Failed to parse port number from server output: %s\", line);`"

[[finding]]
id          = "PANIC_38"
type        = "panic"
severity    = "low"
difficulty  = "easy"
description = "`_release_pad` in `ges-smart-video-mixer.c` calls `ges_smart_mixer_find_pad_info (self, pad)` and immediately dereferences the result (`info->mixer_pad`, `info->real_mixer_pad`) without checking for `NULL`. If `release_pad` is ever invoked (directly or indirectly through `gst_element_release_request_pad`) with a pad that is not present in `self->pads_infos` (e.g. a pad already released, or a caller bug), this dereferences a `NULL` pointer and crashes the process instead of failing gracefully."
locations   = ["subprojects/gst-editing-services/ges/ges-smart-video-mixer.c:382-407"]
fix         = "Guard against a missing entry:\nBefore:\n```c\n  PadInfos *info = ges_smart_mixer_find_pad_info (self, pad);\n\n  GST_DEBUG_OBJECT (element, \"Releasing pad %\" GST_PTR_FORMAT, pad);\n\n  LOCK (element);\n  g_hash_table_remove (GES_SMART_MIXER (element)->pads_infos, pad);\n  g_hash_table_remove (GES_SMART_MIXER (element)->pads_infos, info->mixer_pad);\n```\nAfter:\n```c\n  PadInfos *info = ges_smart_mixer_find_pad_info (self, pad);\n\n  GST_DEBUG_OBJECT (element, \"Releasing pad %\" GST_PTR_FORMAT, pad);\n\n  if (!info) {\n    GST_WARNING_OBJECT (element, \"Unknown pad %\" GST_PTR_FORMAT, pad);\n    return;\n  }\n\n  LOCK (element);\n  g_hash_table_remove (GES_SMART_MIXER (element)->pads_infos, pad);\n  g_hash_table_remove (GES_SMART_MIXER (element)->pads_infos, info->mixer_pad);\n```"

[[finding]]
id          = "PANIC_39"
type        = "panic"
severity    = "low"
difficulty  = "very_easy"
description = "`gst_mpd_client_set_segment_list()`, `gst_mpd_client_set_segment_template()` and `gst_mpd_client_add_segment_url()` call `gst_mpd_client_get_representation_with_id()` and then immediately dereference the result (`representation->SegmentList`) without checking it for `NULL`, unlike the sibling function `gst_mpd_client_set_representation_node()` which explicitly checks `if (!rep_node)` and creates one. If a caller supplies a `rep_id` for which no `GstMPDRepresentationNode` has been added yet (e.g. via a code path change or a future caller that does not guarantee `gst_mpd_client_set_representation_node()` was called first with the same id), this dereferences a `NULL` pointer."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstmpdclient.c:3305-3308", "subprojects/gst-plugins-bad/ext/dash/gstmpdclient.c:3342-3345", "subprojects/gst-plugins-bad/ext/dash/gstmpdclient.c:3381-3385"]
fix         = "Add a `g_return_val_if_fail (representation != NULL, FALSE);` right after each call to `gst_mpd_client_get_representation_with_id()` in `gst_mpd_client_set_segment_list()`, `gst_mpd_client_set_segment_template()` and `gst_mpd_client_add_segment_url()`, e.g.:\nBefore:\n```\n  representation =\n      gst_mpd_client_get_representation_with_id\n      (adaptation_set->Representations, rep_id);\n  if (!representation->SegmentList) {\n```\nAfter:\n```\n  representation =\n      gst_mpd_client_get_representation_with_id\n      (adaptation_set->Representations, rep_id);\n  g_return_val_if_fail (representation != NULL, FALSE);\n  if (!representation->SegmentList) {\n```"

[[finding]]
id          = "UAF_1"
type        = "use_after_free"
severity    = "critical"
difficulty  = "easy"
description = "In `_save_subproject()`, on the `_save_project()` failure branch, `subproject` (a `(transfer none)` pointer obtained from `ges_extractable_get_asset()`) is unreffed with `g_object_unref (subproject); goto err;`, and the `err:` label unconditionally does `g_object_unref (subproject);` again. This double-unrefs the same `GESAsset` in one code path, which can drop its refcount to zero and finalize it, so the second `g_object_unref` operates on freed memory (use-after-free / refcount underflow). Additionally, the function returns `TRUE` unconditionally (even via `goto err` after a failure), so `_save_assets()`'s check `if (!_save_subproject (...)) { ...; return FALSE; }` never triggers and save failures are silently swallowed."
locations   = ["subprojects/gst-editing-services/ges/ges-xml-formatter.c:1254-1271"]
fix         = "Remove the redundant unref on the failure path and propagate the failure, e.g.:\nbefore:\n```\n  if (!_save_project (GES_FORMATTER (self), substr, GES_PROJECT (subproject),\n          timeline, error, depth)) {\n    g_string_free (substr, TRUE);\n    g_object_unref (subproject);\n    goto err;\n  }\n...\nerr:\n  g_object_unref (subproject);\n\n  return TRUE;\n```\nafter:\n```\n  if (!_save_project (GES_FORMATTER (self), substr, GES_PROJECT (subproject),\n          timeline, error, depth)) {\n    g_string_free (substr, TRUE);\n    return FALSE;\n  }\n...\n  return TRUE;\n```\n(dropping the `err:` label's unref of `subproject` entirely, since it is a borrowed/`transfer none` reference)."

[[finding]]
id          = "UAF_2"
type        = "use_after_free"
severity    = "critical"
difficulty  = "medium"
description = "In `gst_gs_read_stream()` (`gstgssrc.cpp`), `gcs::ObjectReadStream& stream = src->gcs_stream->stream();` binds a reference into the `GSReadStream` object owned by `src->gcs_stream`. Inside the retry loop, on a read error the code does `src->gcs_stream = std::make_unique<GSReadStream>(src, offset);`, which destroys the *previous* `GSReadStream` (and its `~GSReadStream(){ gcs_stream_.Close(); }` destructor tears down the underlying `gcs_stream_` member the `stream` reference points at) and replaces it with a new object. The loop then re-evaluates `!stream.eof()` and, after the loop, calls `stream.gcount()` on the now-dangling reference, i.e. a use-after-free that is reached any time a GCS read hiccups (e.g. transient network error) and the stream is transparently reconnected."
locations   = ["subprojects/gst-plugins-bad/ext/gs/gstgssrc.cpp:402-426"]
fix         = "Do not cache the `stream()` reference across a reconnect. Re-fetch it from `src->gcs_stream` on every loop iteration, e.g.: `while (!src->gcs_stream->stream().eof()) { gcs::ObjectReadStream &stream = src->gcs_stream->stream(); stream.read(sdata, length); if (stream.status().ok()) { gcount = stream.gcount(); break; } GST_ERROR_OBJECT(src, \"Restart after (%s)\", stream.status().message().c_str()); src->gcs_stream = std::make_unique<GSReadStream>(src, offset); }` so that no stale reference into a destroyed `GSReadStream` is ever dereferenced."

[[finding]]
id          = "UAF_3"
type        = "use_after_free"
severity    = "critical"
difficulty  = "easy"
description = "In `gst_onnx_inference_transform_ip`, the local `OrtValue *input_tensor` is released once via `api->ReleaseValue (input_tensor)` right after the successful `api->Run()` call, but `input_tensor` is never set back to `NULL`. If any subsequent step in the function fails (e.g. `gst_buffer_add_tensor_meta`/output-tensor introspection errors, `api->GetTensorTypeAndShape`, `api->GetDimensionsCount`, `api->GetTensorShapeElementCount`, `api->GetTensorMutableData`, or an unsupported output tensor type), execution jumps to the `error:` label, which contains `if (input_tensor) api->ReleaseValue (input_tensor);`. Since `input_tensor` still holds the stale (already freed) pointer, this calls `ReleaseValue` a second time on the same `OrtValue`, causing a double-free / use-after-free inside the ONNX Runtime allocator."
locations   = ["subprojects/gst-plugins-bad/ext/onnx/gstonnxinference.c:2934", "subprojects/gst-plugins-bad/ext/onnx/gstonnxinference.c:3049-3050"]
fix         = "Set `input_tensor` to `NULL` immediately after releasing it, mirroring how `output_tensor_info` is handled elsewhere in the same function (e.g. at `subprojects/gst-plugins-bad/ext/onnx/gstonnxinference.c:2188-2189`). Before: `api->ReleaseValue (input_tensor);` (line 2118) with no reset. After: `api->ReleaseValue (input_tensor); input_tensor = NULL;` so that the `if (input_tensor) api->ReleaseValue (input_tensor);` check in the `error:` label at lines 2230-2231 no longer double-frees it."

[[finding]]
id          = "UAF_4"
type        = "use_after_free"
severity    = "critical"
difficulty  = "easy"
description = "In `gst_gl_dmabuf_buffer_pool_stop()` the pool drops its own reference on `self->priv->eglimage_cache` via `gst_egl_image_cache_unref()` but never sets the field back to `NULL`. `gst_egl_image_cache_unref()` actually frees the `GstEGLImageCache` (via `g_free`) once its internal refcount hits zero (see `gst_egl_image_cache_unref` in `gsteglimagecache.c`). If the same buffer pool is later restarted with `gst_gl_dmabuf_buffer_pool_start()`, that function checks `if (self->priv->eglimage_cache) gst_egl_image_cache_unref (...)` before allocating a new cache; since the pointer was left dangling (non-NULL) by `stop()`, this unrefs an already-freed `GstEGLImageCache`, causing a use-after-free / double-free. `GstBufferPool` supports multiple start/stop cycles, so this is reachable in normal operation (e.g. pipeline PAUSED->READY->PAUSED transitions reusing the same pool)."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldmabufbufferpool.c:184-199", "subprojects/gst-plugins-base/ext/gl/gstgldmabufbufferpool.c:201-215"]
fix         = "Clear the pointer after unreffing in `gst_gl_dmabuf_buffer_pool_stop()`:\n```c\nstatic gboolean\ngst_gl_dmabuf_buffer_pool_stop (GstBufferPool * pool)\n{\n  GstGLDMABufBufferPool *self = GST_GL_DMABUF_BUFFER_POOL (pool);\n\n  if (!gst_buffer_pool_set_active (self->priv->dmabuf_pool, FALSE)) {\n    return FALSE;\n  }\n\n  if (self->priv->eglimage_cache) {\n    gst_egl_image_cache_unref (self->priv->eglimage_cache);\n    self->priv->eglimage_cache = NULL;\n  }\n\n  return GST_BUFFER_POOL_CLASS (parent_class)->stop (pool);\n}\n```"

[[finding]]
id          = "UAF_5"
type        = "use_after_free"
severity    = "critical"
difficulty  = "easy"
description = "In `gst_deinit()` (`gst.c:1128-1130`), the system clock singleton is released twice: `gst_object_unref (clock);` immediately followed by `gst_clear_object (&clock);` (which itself calls `gst_object_unref` on `clock` since the pointer was not set to `NULL` by the first call). This drops the reference count of the `GstSystemClock` singleton one time too many. Since `gst_system_clock_obtain()` only handed out a single extra reference, this double-release can drop the singleton's refcount to zero and free the object while the internal static system-clock instance pointer (inside `gstsystemclock.c`) still refers to it, leaving a dangling pointer / use-after-free for any code path that still expects the system clock singleton to be valid, or triggering a `GLib` critical warning about unreffing an object with a refcount that is already at its floor."
locations   = ["subprojects/gstreamer/gst/gst.c:1128-1130"]
fix         = "Only release the reference once, e.g.:\n```c\nGstClock *clock = gst_system_clock_obtain ();\ngst_clear_object (&clock);\n```\nor keep the explicit unref and drop the `gst_clear_object` call entirely, but do not do both."

[[finding]]
id          = "UAF_6"
type        = "use_after_free"
severity    = "critical"
difficulty  = "hard"
description = "When `_memory_add()` inserts into a `GstBuffer` that already holds `GST_BUFFER_MEM_MAX` (16) memory blocks, it forces a merge to make room: `_replace_memory (buffer, len, 0, len, _get_merged_memory (buffer, 0, len));` followed unconditionally by `len = 1;` (`subprojects/gstreamer/gst/gstbuffer.c:476-478`). `_get_merged_memory()` / `_actual_merged_memory()` can return `NULL` on allocator failure or a failed `gst_memory_map()` (`subprojects/gstreamer/gst/gstbuffer.c:272-278`, `284-291`). When that happens, `_replace_memory()` is invoked with `mem == NULL`: it unrefs (and frees, if refcount was 1) all 16 old `GstMemory` pointers in the array via `gst_memory_unref (old)` but, since `mem != NULL` is false, never overwrites any array slot and never advances `idx`/`length` (`subprojects/gstreamer/gst/gstbuffer.c:335-353`); it then sets `GST_BUFFER_MEM_LEN (buffer) = len - length` which correctly becomes `0`. However, the caller in `_memory_add()` ignores this and still forces the local `len` to `1`, as if the merge had produced one valid memory block. The subsequent insertion code (`subprojects/gstreamer/gst/gstbuffer.c:481-494`) then writes the new memory into `GST_BUFFER_MEM_PTR(buffer, len)` and sets `GST_BUFFER_MEM_LEN (buffer) = len + 1` (i.e. `2`), leaving slot `0` holding the stale pointer to the just-freed `GstMemory` while the buffer's tracked length claims it is a valid entry. Any later access to that buffer (`gst_buffer_get_size()`, `gst_buffer_map()`, `_gst_buffer_free()`, etc.) will dereference or unref this dangling `GstMemory*`, i.e. a use-after-free / double-free. This is reachable purely through the public API (`gst_buffer_insert_memory()` / `gst_buffer_append_memory()`) once a buffer has accumulated 16 memory blocks and the forced merge hits an allocation or mapping failure (e.g. under memory pressure)."
locations   = ["subprojects/gstreamer/gst/gstbuffer.c:323-361", "subprojects/gstreamer/gst/gstbuffer.c:462-495"]
fix         = "Make `_memory_add()` check whether the forced merge actually succeeded instead of blindly assuming `len = 1`:\n\n```c\nif (G_UNLIKELY (len >= GST_BUFFER_MEM_MAX)) {\n  GstMemory *merged = _get_merged_memory (buffer, 0, len);\n\n  if (G_UNLIKELY (merged == NULL)) {\n    GST_CAT_ERROR (GST_CAT_BUFFER,\n        \"failed to merge memory to make room in buffer %p\", buffer);\n    /* buffer memory is now empty/inconsistent; bail out instead of\n     * corrupting the memory array */\n    return;\n  }\n  _replace_memory (buffer, len, 0, len, merged);\n  /* we now have 1 single spanned buffer */\n  len = 1;\n}\n```\n\n`_memory_add()` is `void`, so propagating the failure requires either changing its signature (and that of `gst_buffer_insert_memory()`/`gst_buffer_append_memory()`) to report the error, or at minimum ensuring the local `len` used afterwards always matches `GST_BUFFER_MEM_LEN (buffer)` so the array is never treated as containing more valid entries than it does."

[[finding]]
id          = "UAF_7"
type        = "use_after_free"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_validate_check_num_instances_data_new` (`subprojects/gst-devtools/validate/gst/validate/gst-validate-extra-checks.c`), the `failed:` error path calls `g_free (data)` before dereferencing `data->klass` in the following `g_free (data->klass)` call. This reads a struct member through a pointer that has already been freed (`data`), which is undefined behavior and can crash or corrupt the heap depending on allocator behavior."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-extra-checks.c:53-57"]
fix         = "Free `data->klass` before freeing `data` itself. Before:\n```c\nfailed:\n  g_free (data);\n  g_free (data->klass);\n\n  return NULL;\n```\nAfter:\n```c\nfailed:\n  g_free (data->klass);\n  g_free (data);\n\n  return NULL;\n```"

[[finding]]
id          = "UAF_8"
type        = "use_after_free"
severity    = "high"
difficulty  = "medium"
description = "`remove_element_internal` in `ges-track.c` looks up the `GSequenceIter` for `object` in `priv->trackelements_iter` and calls `g_sequence_remove(it)` (which, per GLib documentation, invalidates and frees the iterator), but it never calls `g_hash_table_remove(priv->trackelements_iter, object)` on the success path. This leaves a stale mapping from `object` to the now-freed `GSequenceIter` sitting in `priv->trackelements_iter`. On the failure path the stale entry is implicitly fixed because `g_hash_table_insert` is called again with the same key, but on the success path (the common case, taken when `remove_object_internal` succeeds and the function returns `TRUE`) nothing purges the dangling entry. If `ges_track_remove_element()` / `ges_track_remove_element_full()` is subsequently called again on the very same still-alive `GESTrackElement` (e.g. a caller mistakenly removes the same element twice, which is exposed as public API), the second call's `g_hash_table_lookup` returns the stale, already-freed iterator, and `g_sequence_remove(it)` is invoked on it, unlinking a freed `GSequenceNode` from the splay tree - a use-after-free that can corrupt the sequence's internal structure or crash."
locations   = ["subprojects/gst-editing-services/ges/ges-track.c:1234-1257"]
fix         = "After calling `g_sequence_remove (it)` on the success path, also remove the stale key from the hash table, and guard against `it` being `NULL` for objects that were never tracked, e.g.:\n```c\nit = g_hash_table_lookup (priv->trackelements_iter, object);\nif (!it) {\n  GST_WARNING_OBJECT (track, \"Object %\" GST_PTR_FORMAT \" is not tracked\", object);\n  return FALSE;\n}\ng_sequence_remove (it);\ng_hash_table_remove (priv->trackelements_iter, object);\n```\nso that a later `g_hash_table_lookup (priv->trackelements_iter, object)` can never return a dangling `GSequenceIter`."

[[finding]]
id          = "UAF_9"
type        = "use_after_free"
severity    = "high"
difficulty  = "medium"
description = "In `bin_element_added` (registered as the `bin-add-post` tracer hook in `ges_validate_activate`), the loop that walks up the parent chain looking for a `GESTrack` calls `gst_object_unref (parent)` and then immediately passes the same now-potentially-freed `parent` pointer to `gst_object_get_parent (parent)` on the next line. `gst_object_get_parent` dereferences its argument to read `GST_OBJECT_PARENT`, so if the `gst_object_unref` call happened to drop the last reference on `parent`, this is a use-after-free. Even when it doesn't crash (because some other owner in the pipeline still holds a reference), this violates GObject/GStreamer refcounting discipline: the reference obtained by `gst_object_get_parent` must remain valid for the duration of its own use, and must not be unreffed before being read from again."
locations   = ["subprojects/gst-editing-services/tools/ges-validate.c:145-170"]
fix         = "Capture the next parent into a separate variable before unreffing the current one, e.g.:\n```\nGstObject *next = gst_object_get_parent (parent);\ngst_object_unref (parent);\nparent = next;\n```\ninstead of:\n```\ngst_object_unref (parent);\nparent = gst_object_get_parent (parent);\n```"

[[finding]]
id          = "UAF_10"
type        = "use_after_free"
severity    = "high"
difficulty  = "hard"
description = "In `gst_ffmpegvidenc_send_frame()`, when `gst_video_frame_map()` fails on `frame->input_buffer`, the function itself calls `gst_video_codec_frame_unref (frame)` (consuming the reference that `handle_frame()` owns on `frame`) and then returns `GST_FLOW_ERROR` (`ret` is never set to anything else on that path). Back in `gst_ffmpegvidenc_handle_frame()`, any non-OK return from `gst_ffmpegvidenc_send_frame()` jumps to `encode_fail`, which unconditionally calls `gst_video_encoder_finish_frame (encoder, frame)` -- passing the very same `frame` whose subclass-owned reference was already released inside `gst_ffmpegvidenc_send_frame()`. `gst_video_encoder_finish_frame()` (via `gst_video_encoder_release_frame_unlocked()`) unrefs `frame` again, resulting in an extra unref of `GstVideoCodecFrame` beyond what it is owed, which can free the frame while it is still referenced/used, or trigger a critical warning/crash from GLib refcount underflow."
locations   = ["subprojects/gst-libav/ext/libav/gstavvidenc.c:597-604", "subprojects/gst-libav/ext/libav/gstavvidenc.c:808-836"]
fix         = "Make `gst_ffmpegvidenc_send_frame()` report the map failure without consuming `frame`'s reference itself, and let the single caller-side error handler own the frame consistently. For example, remove the `gst_video_codec_frame_unref (frame)` call from the `gst_video_frame_map` failure branch:\n```c\nif (!gst_video_frame_map (&buffer_info->vframe, info, frame->input_buffer, GST_MAP_READ)) {\n    GST_ERROR_OBJECT (ffmpegenc, \"Failed to map input buffer\");\n    gst_buffer_unref (buffer_info->buffer);\n    g_free (buffer_info);\n    goto done; /* let handle_frame's encode_fail path finish_frame() once */\n}\n```\nso that `encode_fail`'s single `gst_video_encoder_finish_frame (encoder, frame)` call remains the only place the frame's subclass-owned reference is consumed on this error path."

[[finding]]
id          = "UAF_11"
type        = "use_after_free"
severity    = "high"
difficulty  = "medium"
description = "In `gst_hls_master_playlist_new_from_data()`, while parsing `#EXT-X-I-FRAME-STREAM-INF:` attributes, when the `URI` attribute is handled, `stream->uri = uri_join (base_uri, v);` can return `NULL` (e.g. if `base_uri` has no `/` or no `:` scheme separator, as `uri_join()` returns `NULL` in those cases). On failure the code calls `gst_hls_variant_stream_unref (stream)`, which frees `stream` immediately since its refcount is 1. However, the enclosing `while (data && parse_attributes (&data, &a, &v))` loop keeps running and keeps referencing the now-freed `stream` (e.g. `stream->media_groups[...]` in later branches), and after the loop the code unconditionally dereferences it again via `if (stream->iframe) { if (find_variant_stream_by_uri (playlist->iframe_variants, stream->uri)) ...`. This is a use-after-free triggered purely by parsing a crafted/malformed master playlist."
locations   = ["subprojects/gst-plugins-bad/ext/hls/m3u8.c:1663-1670", "subprojects/gst-plugins-bad/ext/hls/m3u8.c:1686-1693"]
fix         = "Do not keep using `stream` after unreffing it on failure. For example, set a local flag and `break`/`goto` out of the attribute-parsing loop instead of continuing: `} else { gst_hls_variant_stream_unref (stream); stream = NULL; break; }`, and then check `if (stream == NULL) goto next_line;` right after the `while` loop before the `if (stream->iframe)` block."

[[finding]]
id          = "UAF_12"
type        = "use_after_free"
severity    = "high"
difficulty  = "medium"
description = "`camera_undistort_calibration_event()` in `gstcameraundistort.cpp` calls `g_free (undist->settings)` and then `gst_camera_event_parse_calibrated (event, &(undist->settings))`, expecting the parser to always assign a fresh string. However `gst_camera_event_parse_calibrated()` (in `cameraevent.cpp`) only writes to `*settings` on its success path (`*settings = g_strdup (str);`); if the custom `GstEventCalibrated` structure lacks the `undistort-settings` string field it returns `FALSE` without touching `*settings` at all. Because `undist->settings` was already freed just before the call and is never reset to `NULL`, `undist->settings` is left as a dangling pointer. Any later access, such as `gst_camera_undistort_get_property()` for `PROP_SETTINGS` (`g_value_set_string (value, undist->settings)`) or `gst_camera_undistort_dispose()` (`g_free (undist->settings)`), then operates on freed memory, resulting in a use-after-free / double-free. This is reachable simply by sending a custom `GST_EVENT_CUSTOM_BOTH` event named `GstEventCalibrated` without the expected field to the `cameraundistort` element's sink or src pad."
locations   = ["subprojects/gst-plugins-bad/ext/opencv/gstcameraundistort.cpp:359-372", "subprojects/gst-plugins-bad/ext/opencv/cameraevent.cpp:61-83"]
fix         = "Parse into a temporary variable and only replace `undist->settings` once parsing succeeds. Before: `g_free (undist->settings); if (!gst_camera_event_parse_calibrated (event, &(undist->settings))) { return FALSE; }`. After: `gchar *new_settings = NULL; if (!gst_camera_event_parse_calibrated (event, &new_settings)) { return FALSE; } g_free (undist->settings); undist->settings = new_settings;` — this way `undist->settings` is never freed unless a valid replacement is available."

[[finding]]
id          = "UAF_13"
type        = "use_after_free"
severity    = "high"
difficulty  = "hard"
description = "In `gst_handdetect_transform_ip`, at the end of processing a frame the code aliases the tracking pointers with `filter->prev_r = filter->best_r;` (see `gsthanddetect.cpp:450` for the fist branch and the equivalent line in the palm branch). On the next frame, if `hands.size() > 1` (very common, since Haar cascades routinely report multiple candidate rectangles for one gesture), the loop over `hands` executes `delete (filter->best_r); filter->best_r = new Rect (*r);` inside the `if (distance <= min_distance)` block. Because `filter->prev_r` still holds the same pointer value as the just-deleted `filter->best_r`, every subsequent loop iteration dereferences `filter->prev_r->x` / `filter->prev_r->y` on freed memory (`gsthanddetect.cpp:441-442` and the equivalent `gsthanddetect.cpp:530-531` in the palm branch), which is a genuine use-after-free."
locations   = ["subprojects/gst-plugins-bad/ext/opencv/gsthanddetect.cpp:439-450", "subprojects/gst-plugins-bad/ext/opencv/gsthanddetect.cpp:528-539"]
fix         = "Snapshot the coordinates of `filter->prev_r` into a local `cv::Point` before the loop instead of dereferencing the (possibly-freed) pointer on every iteration. For example, before the loop: `Point prev_pt (filter->prev_r->x, filter->prev_r->y);` and inside the loop use `pow ((r->x - prev_pt.x), 2) + pow ((r->y - prev_pt.y), 2)` instead of `pow ((r->x - filter->prev_r->x), 2) + pow ((r->y - filter->prev_r->y), 2)`. Apply the same change to both the fist-detection and palm-detection loops."

[[finding]]
id          = "UAF_14"
type        = "use_after_free"
severity    = "high"
difficulty  = "medium"
description = "`gst_alsa_midi_src_stop` unconditionally does `g_free (alsamidisrc->seq_ports);` without resetting the pointer to `NULL`. `gst_alsa_midi_src_start` only reallocates `seq_ports` via `parse_ports` when `alsamidisrc->ports` is non-NULL; `port_count` is reset to 0 but the stale pointer itself is left untouched. If one start/stop cycle sets the `ports` property (allocating `seq_ports`) and a later cycle runs with `ports` unset/NULL, `stop()` will call `g_free` on the same already-freed pointer a second time, corrupting the heap."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsamidisrc.c:557-568", "subprojects/gst-plugins-base/ext/alsa/gstalsamidisrc.c:625-642"]
fix         = "Set the pointer to NULL after freeing it in `gst_alsa_midi_src_stop`, and/or reset it unconditionally in `gst_alsa_midi_src_start`: ```c\ng_free (alsamidisrc->seq_ports);\nalsamidisrc->seq_ports = NULL;\n```"

[[finding]]
id          = "UAF_15"
type        = "use_after_free"
severity    = "high"
difficulty  = "hard"
description = "`GstGLDeinterlace` tracks the previous frame two different ways: `prev_buffer` (a real ref taken unconditionally every frame in `gst_gl_deinterlace_filter` via `gst_buffer_replace (&deinterlace_filter->prev_buffer, inbuf)`, regardless of the active method) and `prev_tex` (a raw, non-owning `GstGLMemory *` pointer that is only ever written inside `gst_gl_deinterlace_greedyh_callback`, at the end: `deinterlace_filter->prev_tex = in_tex;`). When `method` is switched away from `greedyh` (e.g. to `vfir`) for one or more frames and then back, `prev_buffer` keeps being replaced every frame (dropping the ref that was keeping the old `GstGLMemory` referenced by `prev_tex` alive), while `prev_tex` itself is never updated because `vfir`'s callback never touches it. On the next `greedyh` frame, `gst_gl_deinterlace_greedyh_callback` sees `prev_tex != NULL` and calls `gst_gl_memory_get_texture_id (deinterlace_filter->prev_tex)` on a dangling pointer into a buffer that has already been unreffed (and potentially returned to a buffer pool and reused), i.e. a use-after-free."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldeinterlace.c:404-415", "subprojects/gst-plugins-base/ext/gl/gstgldeinterlace.c:496-547", "subprojects/gst-plugins-base/ext/gl/gstgldeinterlace.h:40-50"]
fix         = "Tie `prev_tex`'s lifetime to `prev_buffer` instead of updating it only from the `greedyh` callback, e.g. reset it whenever `prev_buffer` is replaced and derive it from the currently-held `prev_buffer`:\n```c\nstatic gboolean\ngst_gl_deinterlace_filter (GstGLFilter * filter, GstBuffer * inbuf, GstBuffer * outbuf)\n{\n  GstGLDeinterlace *deinterlace_filter = GST_GL_DEINTERLACE (filter);\n\n  gst_gl_filter_filter_texture (filter, inbuf, outbuf);\n\n  gst_buffer_replace (&deinterlace_filter->prev_buffer, inbuf);\n  /* also refresh prev_tex here so it can never outlive prev_buffer,\n   * regardless of which deinterlace method is active */\n  return TRUE;\n}\n```\nAlternatively, take an explicit `gst_memory_ref()` on the `GstGLMemory` stored in `prev_tex` and release the old one when overwritten, so its lifetime does not depend on `prev_buffer`."

[[finding]]
id          = "UAF_16"
type        = "use_after_free"
severity    = "high"
difficulty  = "hard"
description = "In `monitor_thread_func`, the cleanup path taken when `gst_device_monitor_stop()` races in while the thread is unlocked assumes `started` always points to a node that was freshly prepended in the *current* loop iteration and is not yet published anywhere else, so it does `started->next = NULL; g_slist_free (started);` to free 'just the new node'. This assumption is false whenever the current iteration's `gst_device_provider_start (provider)` call fails: in that case the `else { gst_clear_object (&provider); }` branch runs and `started` is left unchanged from the previous iteration, i.e. it is exactly the same list that may already have been published via `monitor->priv->started_providers = started;` and possibly already stolen into `gst_device_monitor_stop()`'s own local `started` variable (which reads `monitor->priv->started_providers` under the object lock and then works on it after unlocking and joining this thread). Two distinct bad outcomes follow: (1) if this is the very first provider processed and it fails to start while a concurrent stop() races in, `started` is `NULL` and `started->next = NULL` is a `NULL` pointer dereference/crash; (2) if some providers were already started in earlier iterations, `started->next = NULL` truncates the very list object that `gst_device_monitor_stop()` is about to traverse via its own aliased pointer, so `gst_device_monitor_stop()` only sees/stops/unrefs the head provider and silently loses (leaks the `GstDeviceProvider` references of, and never calls `gst_device_provider_stop()` on) every other already-started provider in the chain."
locations   = ["subprojects/gstreamer/gst/gstdevicemonitor.c:504-581"]
fix         = "Only detach/free a node that was actually prepended in the current iteration. Track whether a new node was added this iteration (e.g. keep the previous head pointer before calling `g_slist_prepend`, or a local `gboolean just_prepended`), and skip the `started->next = NULL; g_slist_free (started);` step entirely when the current iteration did not prepend anything (`started` unchanged / still `NULL`):\n```c\nGSList *prev_head = started;\nif (gst_device_provider_start (provider)) {\n  started = g_slist_prepend (started, provider);\n} else {\n  gst_clear_object (&provider);\n}\n...\nif (!monitor->priv->started) {\n  ...\n  if (started != prev_head) {\n    /* we really did add an unpublished node this iteration */\n    started->next = NULL;\n    g_slist_free (started);\n  }\n  started = NULL;\n  goto done;\n}\n```"

[[finding]]
id          = "UAF_17"
type        = "use_after_free"
severity    = "high"
difficulty  = "easy"
description = "`gst_event_new_sink_message` builds the event's `GstStructure` with `gst_structure_new_static_str (name, ...)`, but `name` is a caller-supplied `const gchar *` parameter, not a literal. `gst_structure_new_static_str` (and the underlying `gst_id_str_set_static_str`) stores the pointer *without duplicating it* whenever the string is longer than 15 bytes (see `_gst_id_str_set_static_str_with_len_inline` in `gstidstr-private.h`), documented as requiring the string to be \"valid for the remaining lifetime of the process\". Neither the header doc nor the `.c` doc comment for `gst_event_new_sink_message` mentions this requirement for `name`. A real caller, `gst_ipcpipelinecomm.c` (`gst_ipc_pipeline_comm_read_bus_message` -> `gst_event_new_sink_message (name, message)`), passes a pointer straight into an adapter-mapped network buffer that is unmapped/flushed right after the call, so any later access to the structure's name (e.g. via `gst_event_has_name`, `gst_structure_get_name`, or debug logging) dereferences freed/reused memory."
locations   = ["subprojects/gstreamer/gst/gstevent.c:1675-1691"]
fix         = "Duplicate the name instead of treating it as static, e.g.:\n```c\nstructure =\n    gst_structure_new (name, \"message\", GST_TYPE_MESSAGE, msg,\n    NULL);\n```\nor call `gst_id_str_set` (owned copy) internally instead of the `_static_str` variant, and document that `name` may be a transient string."

[[finding]]
id          = "UAF_18"
type        = "use_after_free"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_validate_pad_monitor_get_range_func` (`subprojects/gst-devtools/validate/gst/validate/gst-validate-pad-monitor.c`), the code safely reads `task->thread` into the local `thread` variable while holding `GST_OBJECT_LOCK (task)`, then unlocks both `task` and `peer`. However, the subsequent `GST_VALIDATE_REPORT` call dereferences `task->thread` again outside of any lock, after `task` (a raw, unreferenced pointer obtained from `GST_PAD_TASK (peer)`) may have already been stopped and freed by another thread. This re-read defeats the very locking/ref discipline the surrounding comment describes and can read freed memory."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-pad-monitor.c:2592-2596"]
fix         = "Use the already-captured `thread` local instead of re-dereferencing `task`. Before:\n```c\n      if (thread && thread != g_thread_self ()) {\n        GST_VALIDATE_REPORT (pad_monitor, PULL_RANGE_FROM_WRONG_THREAD,\n            \"Pulling from wrong thread, expected pad thread: %p, got %p\",\n            task->thread, g_thread_self ());\n      }\n```\nAfter:\n```c\n      if (thread && thread != g_thread_self ()) {\n        GST_VALIDATE_REPORT (pad_monitor, PULL_RANGE_FROM_WRONG_THREAD,\n            \"Pulling from wrong thread, expected pad thread: %p, got %p\",\n            thread, g_thread_self ());\n      }\n```"

[[finding]]
id          = "UAF_19"
type        = "use_after_free"
severity    = "low"
difficulty  = "medium"
description = "In `gst_bus_add_watch_full_unlocked`, `gst_bus_create_watch_unlocked` (called at the top) already assigns the freshly created `GSource` to `bus->priv->gsource` as a side effect. Afterwards, `gst_bus_add_watch_full_unlocked` calls `id = g_source_attach (source, ctx); g_source_unref (source);`, dropping the creation reference. It then only re-assigns `bus->priv->gsource = source;` when `id` is non-zero. If `g_source_attach` were ever to return `0` (attach failure), `g_source_unref` may drop the source's refcount to zero and free it, yet `bus->priv->gsource` is left pointing at the now-freed `source` (it was never cleared, since the `if (id)` branch only handles the success path). Any later use of `bus->priv->gsource` (e.g. `gst_bus_remove_watch`, `gst_bus_create_watch`) would then dereference a dangling pointer."
locations   = ["subprojects/gstreamer/gst/gstbus.c:889-911", "subprojects/gstreamer/gst/gstbus.c:941-977"]
fix         = "Explicitly clear `bus->priv->gsource` on the failure path instead of relying on `if (id)` to be the only mutation:\n\n```c\nid = g_source_attach (source, ctx);\ng_source_unref (source);\n\nif (id) {\n  bus->priv->gsource = source;\n} else {\n  bus->priv->gsource = NULL;\n}\n```\n\nThis makes the failure path consistent with the success path and avoids leaving a dangling pointer in `bus->priv->gsource` if `g_source_attach` ever fails."

[[finding]]
id          = "UAF_20"
type        = "use_after_free"
severity    = "low"
difficulty  = "medium"
description = "`_gst_id_str_set_with_len_inline` guards against re-setting a heap-owned (`t == 1`) `GstIdStr` to the pointer it already owns (`if (sp->s.pointer_string.s == value) return;`) before calling `g_free`. Its sibling `_gst_id_str_set_static_str_with_len_inline` (used by `gst_id_str_set_static_str_with_len` / `gst_id_str_set_static_str`) has no equivalent check: it unconditionally frees `sp->s.pointer_string.s` when `sp->s.string_type.t == 1`, then, if `len > 15`, stores `value` verbatim as the new (unowned) pointer. If a caller passes the string's own current heap-owned buffer as `value` (e.g. `gst_id_str_set_static_str (s, gst_id_str_as_str (s))`), the pointer is freed and then stored dangling, producing a use-after-free on any subsequent read of the string."
locations   = ["subprojects/gstreamer/gst/gstidstr-private.h:116-134"]
fix         = "Mirror the aliasing check from `_gst_id_str_set_with_len_inline` before freeing:\n```c\nstatic inline void\n_gst_id_str_set_static_str_with_len_inline (GstIdStr * s, const gchar * value, gsize len)\n{\n  GstIdStrPrivate *sp = (GstIdStrPrivate *) s;\n\n  g_assert (len <= G_MAXUINT32);\n\n  if (sp->s.string_type.t == 1) {\n    if (sp->s.pointer_string.s == value)\n      return;\n    g_free (sp->s.pointer_string.s);\n  }\n  ...\n}\n```"

[[finding]]
id          = "MEM_1"
type        = "memory_leak"
severity    = "high"
difficulty  = "medium"
description = "In `gst_curl_http_src_do_seek` (`subprojects/gst-plugins-bad/ext/curl/gstcurlhttpsrc.c`), when a seek arrives while `src->transfer_begun` is `TRUE`, the code calls `gst_curl_http_src_wait_until_removed` and then simply sets `src->transfer_begun = FALSE` and frees the pending `src->buffer`. It never calls `gst_curl_http_src_destroy_easy_handle (src)`, unlike every other code path that resets `transfer_begun` (the retry path in `gst_curl_http_src_create`, the EOS path, and `gst_curl_http_src_reset`). Because `transfer_begun` is now `FALSE`, the next call to `gst_curl_http_src_create` re-enters the `if (!src->transfer_begun)` branch and unconditionally overwrites `src->curl_handle` with a brand-new handle from `gst_curl_http_src_create_easy_handle`, without ever calling `curl_easy_cleanup` on the old one - leaking a `CURL*` easy handle on every seek. Additionally, `src->slist` (the `curl_slist` built from `request_headers`) is never freed/reset by `do_seek`, so `_headers_to_curl_slist` (invoked again from `gst_curl_http_src_create_easy_handle`) keeps appending onto the stale, non-NULL `s->slist` via `curl_slist_append`, both leaking the old list nodes and causing duplicate HTTP headers to be sent on every subsequent seek/request."
locations   = ["subprojects/gst-plugins-bad/ext/curl/gstcurlhttpsrc.c:1701-1712", "subprojects/gst-plugins-bad/ext/curl/gstcurlhttpsrc.c:943-950", "subprojects/gst-plugins-bad/ext/curl/gstcurlhttpsrc.c:1455-1468"]
fix         = "In `gst_curl_http_src_do_seek`, call `gst_curl_http_src_destroy_easy_handle (src);` (which cleans up both `src->curl_handle` via `curl_easy_cleanup` and frees `src->slist` via `curl_slist_free_all`) before/alongside setting `src->transfer_begun = FALSE`, e.g.:\n```c\nif (src->transfer_begun) {\n  GST_DEBUG_OBJECT (src, \"stopping existing transfer\");\n  g_mutex_unlock (&src->buffer_mutex);\n  gst_curl_http_src_wait_until_removed (src);\n  g_mutex_lock (&src->buffer_mutex);\n  src->transfer_begun = FALSE;\n  gst_curl_http_src_destroy_easy_handle (src);\n  if (src->buffer_len > 0) {\n    g_free (src->buffer);\n    src->buffer = NULL;\n    src->buffer_len = 0;\n  }\n}\n```"

[[finding]]
id          = "MEM_2"
type        = "memory_leak"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_gtk_wayland_sink_navigation_send_event` (`subprojects/gst-plugins-bad/ext/gtk/gstgtkwaylandsink.c`), the code obtains `GtkGstBaseWidget *widget = GTK_GST_BASE_WIDGET (gst_gtk_wayland_sink_get_widget (self));`. `gst_gtk_wayland_sink_get_widget` returns an owned reference (`return g_object_ref (priv->gtk_widget);`), but `widget` is used only to compute stream coordinates via `gtk_gst_base_widget_display_size_to_stream_size` and is never released with `g_object_unref`. Since this function runs for every navigation event carrying coordinates (mouse motion, button press/release, scroll, touch), the `GtkGstWaylandWidget`/`GtkGstBaseWidget` object's reference count is inflated on every such event, so the widget is effectively never finalized (and the count grows unboundedly with continued user interaction)."
locations   = ["subprojects/gst-plugins-bad/ext/gtk/gstgtkwaylandsink.c:565-604"]
fix         = "Release the reference once it is no longer needed:\n```c\n    gtk_gst_base_widget_display_size_to_stream_size (widget,\n        x, y, &stream_x, &stream_y);\n    gst_navigation_event_set_coordinates (event, stream_x, stream_y);\n```\nbecomes\n```c\n    gtk_gst_base_widget_display_size_to_stream_size (widget,\n        x, y, &stream_x, &stream_y);\n    gst_navigation_event_set_coordinates (event, stream_x, stream_y);\n    g_object_unref (widget);\n```"

[[finding]]
id          = "MEM_3"
type        = "memory_leak"
severity    = "high"
difficulty  = "medium"
description = "In `gst_hls_demux_change_playlist` (`subprojects/gst-plugins-bad/ext/hls/gsthlsdemux.c`), the function takes an extra reference on the current variant at entry via `previous_variant = gst_hls_variant_stream_ref (demux->current_variant);` to be able to revert on failure. When the playlist update fails and the function falls back to `gst_hls_demux_set_current_variant (demux, previous_variant)`, all three exit paths from that branch (`return FALSE;` at the `iframe` check, `return FALSE;` at the non-iframe check, and the tail call `return gst_hls_demux_change_playlist (demux, new_bandwidth - 1, changed);`) return without ever calling `gst_hls_variant_stream_unref (previous_variant)`. The matching `gst_hls_variant_stream_unref (previous_variant);` only exists on the success path at the very end of the function (after the `if (gst_hls_demux_update_playlist (...))` branch). `gst_hls_demux_set_current_variant` takes its own independent reference on the passed variant rather than stealing the caller's, so the caller-owned reference from line 1786 is genuinely leaked on every failed bitrate downgrade attempt."
locations   = ["subprojects/gst-plugins-bad/ext/hls/gsthlsdemux.c:1786", "subprojects/gst-plugins-bad/ext/hls/gsthlsdemux.c:1848-1859"]
fix         = "Unreference `previous_variant` on every exit path of the failure branch, e.g.: change\n```c\n    if (previous_variant->iframe) {\n      lowest_ivariant = demux->master->iframe_variants->data;\n      if (new_bandwidth == lowest_ivariant->bandwidth)\n        return FALSE;\n    } else {\n      lowest_variant = demux->master->variants->data;\n      if (new_bandwidth == lowest_variant->bandwidth)\n        return FALSE;\n    }\n    return gst_hls_demux_change_playlist (demux, new_bandwidth - 1, changed);\n```\nto\n```c\n    if (previous_variant->iframe) {\n      lowest_ivariant = demux->master->iframe_variants->data;\n      if (new_bandwidth == lowest_ivariant->bandwidth) {\n        gst_hls_variant_stream_unref (previous_variant);\n        return FALSE;\n      }\n    } else {\n      lowest_variant = demux->master->variants->data;\n      if (new_bandwidth == lowest_variant->bandwidth) {\n        gst_hls_variant_stream_unref (previous_variant);\n        return FALSE;\n      }\n    }\n    gst_hls_variant_stream_unref (previous_variant);\n    return gst_hls_demux_change_playlist (demux, new_bandwidth - 1, changed);\n```"

[[finding]]
id          = "MEM_4"
type        = "memory_leak"
severity    = "high"
difficulty  = "medium"
description = "In `gst_openjpeg_dec_decode_frame_multiple` (`subprojects/gst-plugins-bad/ext/openjpeg/gstopenjpegdec.c`), when `self->downstream_flow_ret != GST_FLOW_OK`, the function returns immediately without releasing the `frame` reference that was handed to it (transfer-full) by `gst_openjpeg_dec_handle_frame`. The sibling function `gst_openjpeg_dec_handle_frame` handles the exact same condition correctly by calling `gst_video_codec_frame_unref (frame)` before returning `self->downstream_flow_ret`, but `gst_openjpeg_dec_decode_frame_multiple` omits this call. Since this early return happens before `gst_openjpeg_decode_message_new` takes its own separate reference on `frame`, the reference obtained from the base class is never released on this path."
locations   = ["subprojects/gst-plugins-bad/ext/openjpeg/gstopenjpegdec.c:1730-1731"]
fix         = "Unref the frame before returning, mirroring `gst_openjpeg_dec_handle_frame`:\nBefore:\n```c\n  if (self->downstream_flow_ret != GST_FLOW_OK)\n    return self->downstream_flow_ret;\n```\nAfter:\n```c\n  if (self->downstream_flow_ret != GST_FLOW_OK) {\n    gst_video_codec_frame_unref (frame);\n    return self->downstream_flow_ret;\n  }\n```"

[[finding]]
id          = "MEM_5"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_validate_check_num_instances` (`subprojects/gst-devtools/validate/gst/validate/gst-validate-extra-checks.c`), `pname` (from `gst_object_get_name`) and `pipe` (transfer-full from `gst_validate_monitor_get_pipeline`) are only freed/unreffed via the `done:` label. When `gst_validate_element_has_klass (nelem, data->klass)` returns `FALSE`, the function does an early `return;` without going through `done:`, leaking both the pipeline name string and the pipeline reference on every new element that does not match the target klass (i.e. most elements added to the pipeline)."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-extra-checks.c:67-97"]
fix         = "Route the early exit through the cleanup label instead of returning directly. Before:\n```c\n  if (!gst_validate_element_has_klass (nelem, data->klass))\n    return;\n```\nAfter:\n```c\n  if (!gst_validate_element_has_klass (nelem, data->klass))\n    goto done;\n```"

[[finding]]
id          = "MEM_6"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `_run_command`, the `GError *error` set by `g_subprocess_launcher_spawnv()` or `g_subprocess_communicate_utf8()` on failure is referenced in the `REPORT_UNLESS` error message (`error->message`) but never freed with `g_clear_error()`/`g_error_free()` anywhere in the function, including the shared `done:` cleanup block. Additionally, if `g_subprocess_get_exit_status (subproc) != 0`, the function jumps to `done` using the already-allocated `_stderr` string in the report message, but `g_free (_stderr)` is only reached on the success path (line 4058), leaking the stderr buffer on that error path too."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:4017-4069"]
fix         = "Free both resources in the shared cleanup block. Before: `done:\\n  if (argv)\\n    g_strfreev (argv);\\n  g_clear_object (&subproc_launcher);\\n  g_clear_object (&subproc);\\n\\n  return res;` After: `done:\\n  if (argv)\\n    g_strfreev (argv);\\n  g_clear_object (&subproc_launcher);\\n  g_clear_object (&subproc);\\n  g_clear_error (&error);\\n  g_free (_stderr);\\n\\n  return res;` (and remove the now-redundant `g_free (_stderr);` on the success path)."

[[finding]]
id          = "MEM_7"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "`_execute_flush` obtains an owned reference to `target` via `_get_target_element()` (transfer full) but never calls `gst_object_unref (target)` on the success path, leaking a `GstElement` reference every time a `flush` scenario action is executed."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:4720-4764"]
fix         = "Unref `target` before returning. Before: `GST_DEBUG_OBJECT (scenario, \"Sending FLUSH_STOP event returned %s.\",\\n    ret ? \"TRUE\" : \"FALSE\");\\n\\n  return GST_VALIDATE_EXECUTE_ACTION_OK;\\n}` After: `GST_DEBUG_OBJECT (scenario, \"Sending FLUSH_STOP event returned %s.\",\\n    ret ? \"TRUE\" : \"FALSE\");\\n\\n  gst_object_unref (target);\\n  return GST_VALIDATE_EXECUTE_ACTION_OK;\\n}`"

[[finding]]
id          = "MEM_8"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "`ScenarioManager.discover_scenarios()` opens `logs = open(log_path, 'w')` (used as the subprocess's stdout/stderr) and `f = open(scenario_defs)` (parsed via `config.read_file(f)`), but neither file object is ever closed. This method is invoked repeatedly during test discovery (once globally and once per media file that has associated special `.scenario` files via `find_special_scenarios`), so on a large test corpus this leaks a growing number of file descriptors for the lifetime of the launcher process."
locations   = ["subprojects/gst-devtools/validate/launcher/baseclasses.py:2563", "subprojects/gst-devtools/validate/launcher/baseclasses.py:2576-2577"]
fix         = "Close both files (or use `with` blocks):\n```python\nwith open(log_path, 'w') as logs:\n    ...\n    subprocess.check_call(command, stdout=logs, stderr=logs)\n...\nwith open(scenario_defs) as f:\n    config.read_file(f)\n```"

[[finding]]
id          = "MEM_9"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "In `_handle_buffer()` (`gstvalidatessim.c`), `inframe` is successfully mapped with `gst_video_frame_map (&inframe, &priv->in_info, buffer, GST_MAP_READ)`. If the subsequent `gst_video_frame_map (&frame, &priv->out_info, outbuf, GST_MAP_WRITE)` for the output buffer fails, the function reports the error, unrefs `outbuf`, and returns — but never calls `gst_video_frame_unmap (&inframe)`. This leaves `buffer`'s memory mapped (extra map/lock reference held on the `GstMemory`), which can prevent the memory from being reclaimed/reused and corrupts the buffer's map-count bookkeeping."
locations   = ["subprojects/gst-devtools/validate/plugins/ssim/gstvalidatessim.c:681-698"]
fix         = "Unmap `inframe` on the error path too:\nBefore:\n```c\noutbuf = gst_buffer_new_allocate (NULL, priv->out_info.size, NULL);\nif (!gst_video_frame_map (&frame, &priv->out_info, outbuf, GST_MAP_WRITE)) {\n  GST_VALIDATE_REPORT (o, SSIM_CONVERSION_ERROR,\n      \"Could not map the outbuffer %p\", outbuf);\n\n  gst_buffer_unref (outbuf);\n  return;\n}\n```\nAfter:\n```c\noutbuf = gst_buffer_new_allocate (NULL, priv->out_info.size, NULL);\nif (!gst_video_frame_map (&frame, &priv->out_info, outbuf, GST_MAP_WRITE)) {\n  GST_VALIDATE_REPORT (o, SSIM_CONVERSION_ERROR,\n      \"Could not map the outbuffer %p\", outbuf);\n\n  gst_video_frame_unmap (&inframe);\n  gst_buffer_unref (outbuf);\n  return;\n}\n```"

[[finding]]
id          = "MEM_10"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "`ges_base_xml_formatter_add_asset` takes an extra reference on the formatter via `passet->formatter = gst_object_ref (self)`. In `new_asset_cb`, when asset creation permanently fails and is abandoned (`possible_id == NULL`), the code calls `_free_pending_asset (priv, passet)` directly without ever releasing that reference (unlike the success path a few lines below, which calls `gst_object_unref (self)` before `_free_pending_asset`). Since `_free_pending_asset` itself never unrefs `passet->formatter`, every abandoned/failed asset load leaks one reference on the `GESBaseXmlFormatter` object, keeping it alive forever."
locations   = ["subprojects/gst-editing-services/ges/ges-base-xml-formatter.c:694-706", "subprojects/gst-editing-services/ges/ges-base-xml-formatter.c:728-732", "subprojects/gst-editing-services/ges/ges-base-xml-formatter.c:853"]
fix         = "Unref the formatter reference before discarding the pending asset in the abandon path, e.g.: `if (possible_id == NULL) { GST_WARNING_OBJECT (...); gst_object_unref (self); _free_pending_asset (priv, passet); if (!priv->asset_error) priv->asset_error = g_error_copy (error); goto done; }` instead of calling `_free_pending_asset (priv, passet);` alone."

[[finding]]
id          = "MEM_11"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "`ges_clip_get_last_time_effect_filter` calls `ges_clip_get_top_effects (clip)`, which is documented as `(transfer full)` (it appends a `gst_object_ref`'d reference for every top effect). The function only frees this list (`g_list_free_full (topeffects, gst_object_unref);`) on the path where the loop completes without finding a match. On the success path, where a matching `GES_IS_TIME_EFFECT` child in `track` is found, the function does `return element;` from inside the loop without ever freeing `topeffects`, leaking the list node memory and one reference on every `GESTrackElement` contained in it."
locations   = ["subprojects/gst-editing-services/ges/ges-clip.c:1931-1954"]
fix         = "Free `topeffects` before returning from inside the loop, e.g.:\n```c\n    if (GES_IS_TIME_EFFECT (effect)\n        && ges_track_element_get_track (effect) == track) {\n      GstElement *bin = ges_track_element_get_element (effect);\n      GstElement *element =\n          gst_bin_get_by_name (GST_BIN (bin), \"___ges__effectcapsfilter\");\n\n      if (!element) {\n        GST_ERROR_OBJECT (clip, \"Last timeeffect doesn't have a capsfilter \");\n      }\n\n      g_list_free_full (topeffects, gst_object_unref);\n      return element;\n    }\n```"

[[finding]]
id          = "MEM_12"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `ges_project_create_asset_sync`, the retry loop in `subprojects/gst-editing-services/ges/ges-project.c` reassigns `possible_id` (via `ges_project_try_updating_id`) and then does `id = possible_id;`. On a subsequent failed retry, `possible_id` is overwritten with a new string from another call to `ges_project_try_updating_id` without freeing the string it previously held (which is now only reachable through `id`, and `id` itself gets overwritten right after). Each failed retry beyond the first therefore leaks the previous `possible_id`/`id` string. The only `g_free (possible_id)` call is on the success path, so leak paths are: (a) the loop retries 2+ times before eventually succeeding, or (b) `ges_project_try_updating_id` returns `NULL` on a later iteration causing an early `return NULL;` at line 1011 while `id` (the leaked prior allocation) is discarded."
locations   = ["subprojects/gst-editing-services/ges/ges-project.c:1001-1018"]
fix         = "Free the previous `id`/`possible_id` allocation before it is overwritten. For example: `gchar *new_possible_id = ges_project_try_updating_id (project, tmpasset, *error); if (possible_id) g_free (possible_id); possible_id = new_possible_id;` and likewise free `possible_id`/`id` before the early `return NULL;` at line 1011 when it was heap-allocated from a previous iteration."

[[finding]]
id          = "MEM_13"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "In `_ges_add_track_from_struct` (`ges-structured-interface.c`), when the `restrictions` field is a `G_TYPE_STRING` that fails to parse via `gst_caps_from_string`, the function frees `restriction_str` and returns `FALSE` directly, without releasing `track` (created a few lines above via `ges_video_track_new`/`ges_audio_track_new` and never added to the timeline). Every other error path in the same `if`/`else if` chain (e.g. the final `else if` branch at line `880`) correctly calls `g_object_unref (track)` before returning `FALSE`, showing this is an oversight rather than intentional. Additionally the final `else if` branch itself leaks the `tmp` string obtained from `gst_structure_to_string (structure)` (line `875`), since it is used in the error message but never freed."
locations   = ["subprojects/gst-editing-services/ges/ges-structured-interface.c:861-872", "subprojects/gst-editing-services/ges/ges-structured-interface.c:873-881"]
fix         = "Free the leaked objects on the error path:\nBefore:\n```c\n      if (!caps) {\n        g_set_error (error, GES_ERROR, 0, \"Invalid restrictions caps: %s\",\n            restriction_str);\n\n        g_free (restriction_str);\n        return FALSE;\n      }\n```\nAfter:\n```c\n      if (!caps) {\n        g_set_error (error, GES_ERROR, 0, \"Invalid restrictions caps: %s\",\n            restriction_str);\n\n        g_free (restriction_str);\n        g_object_unref (track);\n        return FALSE;\n      }\n```\nAnd free `tmp` in the other branch with `g_free (tmp);` after building the error message."

[[finding]]
id          = "MEM_14"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "In `_ges_container_add_child_from_struct` (`ges-structured-interface.c`), when the child is looked up by name via `ges_timeline_get_element (timeline, child_name)` (line `961`), that call is documented as `(transfer full)` (see `ges_timeline_get_element` in `ges-timeline.c`), i.e. it hands the caller a genuine, non-floating extra reference. Unlike the sibling code path in `ges-timeline.c` (`_add_track_element_to_layer`-style code around line `1807`) which does `gst_object_ref (el); ges_container_add (...); gst_object_unref (el);` to balance ownership, this function never calls `gst_object_unref`/`gst_clear_object` on `child` after a successful `ges_container_add (container, child)` (line `1029`) or `ges_clip_add_top_effect` call. Since `ges_container_add` only sinks a *floating* reference (it does `gst_object_ref_sink` + a matching `gst_object_unref` internally), a non-floating reference obtained via `ges_timeline_get_element` is never released, permanently leaking one reference on `child` every time an existing timeline element is added to a container via the `add-child, child-name=...` structured action."
locations   = ["subprojects/gst-editing-services/ges/ges-structured-interface.c:959-967", "subprojects/gst-editing-services/ges/ges-structured-interface.c:1020-1046"]
fix         = "Unref the local `child` reference once it has been handed to the container, mirroring the pattern used in `ges-timeline.c`:\n```c\nif (GES_IS_CLIP (container) && GES_IS_BASE_EFFECT (child)) {\n  ...\n  res = ges_clip_add_top_effect (GES_CLIP (container), GES_BASE_EFFECT (child), 0, error);\n  ...\n} else {\n  res = ges_container_add (container, child);\n}\n/* child is not floating here (it came from ges_asset_extract or ges_timeline_get_element,\n * both already handled), drop our own reference now that container owns it */\ngst_object_unref (child);\n```\n(care must be taken to keep using the `child` pointer for `g_object_set_qdata (... LAST_CHILD_QDATA, child)` before or without relying on it staying alive via this leaked ref)."

[[finding]]
id          = "MEM_15"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `source_setup_cb()` in `ges-uri-source.c`, `subtimeline` is obtained via `g_object_get (source, \"timeline\", &subtimeline, NULL)`, which returns a new (transfer full) reference to the `GESTimeline`, and `subtimeline_collection` is obtained via `ges_timeline_get_stream_collection (subtimeline)`, whose implementation (`return gst_object_ref (timeline->priv->stream_collection);`) also returns a new reference to the `GstStreamCollection`. Neither reference is ever released with `gst_object_unref()`/`g_object_unref()` in this function, and `ges_track_select_subtimeline_streams()` does not take ownership of either argument. Every time a nested-timeline `gessrc` source fires the `source-setup` signal on the wrapping `uridecodebin`, this callback leaks one reference to the (potentially large) `GESTimeline` and one reference to the `GstStreamCollection`."
locations   = ["subprojects/gst-editing-services/ges/ges-uri-source.c:126-145"]
fix         = "Release both references once they are no longer needed, e.g.:\n```c\n  g_object_get (source, \"timeline\", &subtimeline, NULL);\n  GstStreamCollection *subtimeline_collection =\n      ges_timeline_get_stream_collection (subtimeline);\n\n  ges_track_select_subtimeline_streams (track, subtimeline_collection,\n      GST_ELEMENT (subtimeline));\n  gst_object_unref (subtimeline_collection);\n  gst_object_unref (subtimeline);\n}\n```"

[[finding]]
id          = "MEM_16"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "`prepare_seek_action()` acquires transfer-full references via `scenario = gst_validate_action_get_scenario (action)` and `type = gst_validate_get_action_type (action->type)`, then invokes `DECLARE_AND_GET_TIMELINE (scenario, action)`. That macro expands to code which, when `project-uri` is set on the action but `_ges_load_timeline()` fails to load the timeline, does `return GST_VALIDATE_EXECUTE_ACTION_ERROR_REPORTED;` directly - bypassing the function's own `done:` cleanup label that unrefs `type` and `scenario`. This leaks one `GstValidateActionType` mini-object reference and one `GstValidateScenario` object reference every time a `seek` action with a failing `project-uri` is prepared."
locations   = ["subprojects/gst-editing-services/ges/ges-validate.c:155-171", "subprojects/gst-editing-services/ges/ges-validate.c:1051-1103"]
fix         = "Avoid the bare `return` inside the shared macro for this call site, e.g. by handling the failure explicitly in `prepare_seek_action` instead of relying on `DECLARE_AND_GET_TIMELINE`, such as:\n```\n  GESTimeline *timeline = NULL;\n  GstElement *pipeline = NULL;\n  const gchar *project_uri = gst_structure_get_string (action->structure, \"project-uri\");\n  if (!project_uri) {\n    pipeline = gst_validate_scenario_get_pipeline (scenario);\n    if (!GES_IS_PIPELINE (pipeline)) { res = GST_VALIDATE_EXECUTE_ACTION_ERROR_REPORTED; goto done; }\n    g_object_get (pipeline, \"timeline\", &timeline, NULL);\n  } else {\n    timeline = _ges_load_timeline (scenario, action, project_uri);\n    if (!timeline) { res = GST_VALIDATE_EXECUTE_ACTION_ERROR_REPORTED; goto done; }\n  }\n  if (pipeline)\n    gst_object_unref (pipeline);\n```\nso that the `done:` label (which unrefs `type` and `scenario`) is always reached instead of an early `return`."

[[finding]]
id          = "MEM_17"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "In `_set_rendering_details`, when `prof` is non-`NULL` but either `ges_pipeline_set_render_settings` or `ges_pipeline_set_mode` fails, the code does `goto done;`, skipping the `gst_encoding_profile_unref (prof)` call right below the `if`. The caller-owned `GstEncodingProfile` reference is then leaked on this error path."
locations   = ["subprojects/gst-editing-services/tools/ges-launcher.c:731-740"]
fix         = "Unref `prof` before jumping to `done` on failure, e.g.:\n```\nif (!prof\n    || !ges_pipeline_set_render_settings (self->priv->pipeline,\n        opts->outputuri, prof)\n    || !ges_pipeline_set_mode (self->priv->pipeline,\n        opts->smartrender ? GES_PIPELINE_MODE_SMART_RENDER :\n        GES_PIPELINE_MODE_RENDER)) {\n  if (prof)\n    gst_encoding_profile_unref (prof);\n  goto done;\n}\n```"

[[finding]]
id          = "MEM_18"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_dash_sink_add_splitmuxsink`, `stream->splitmuxsink` is added to the bin and given an extra `gst_object_ref`, and `stream->giostreamsink` is created, *before* `stream->muxer` is created. If `gst_element_factory_make (dash_muxer_list[sink->muxer].element_name, NULL)` fails, `g_return_val_if_fail (stream->muxer != NULL, FALSE)` makes the function return `FALSE` immediately, leaving `stream->splitmuxsink` added to the bin with an un-released extra ref, and `stream->giostreamsink` created as a dangling floating reference. The caller (`gst_dash_sink_request_new_pad`) only calls `gst_dash_sink_stream_free (stream)` on this failure, which frees only the string fields of `GstDashSinkStream` and never touches `splitmuxsink`/`giostreamsink`, leaking both elements."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstdashsink.c:656-688"]
fix         = "Clean up `splitmuxsink`/`giostreamsink` on the muxer-creation failure path, e.g.:\n\nBefore:\n```c\nstream->muxer =\n    gst_element_factory_make (dash_muxer_list[sink->muxer].element_name,\n    NULL);\n\ng_return_val_if_fail (stream->muxer != NULL, FALSE);\n```\n\nAfter:\n```c\nstream->muxer =\n    gst_element_factory_make (dash_muxer_list[sink->muxer].element_name,\n    NULL);\n\nif (!stream->muxer) {\n  gst_object_unref (stream->splitmuxsink); /* drop our extra ref */\n  gst_bin_remove (GST_BIN (sink), stream->splitmuxsink);\n  return FALSE;\n}\n```"

[[finding]]
id          = "MEM_19"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_dash_sink_request_new_pad`, if `gst_element_request_pad_simple (stream->splitmuxsink, split_pad_name)` fails and returns `NULL`, the function does `GST_DASHSINK_UNLOCK (sink); return NULL;` directly, without calling `gst_dash_sink_stream_free (stream)` or undoing the work already performed in `gst_dash_dash_sink_add_splitmuxsink`. At that point `stream` (heap-allocated via `g_new0`), `stream->representation_id`, `stream->mimetype`, and the extra references taken on `stream->splitmuxsink` (`gst_object_ref`) and on the bin-added `stream->splitmuxsink` itself are all leaked; `stream->splitmuxsink` also stays permanently added to `GST_BIN (sink)`."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstdashsink.c:1088-1093"]
fix         = "Free/tear down the partially constructed `stream` before returning on this error path, e.g.:\n\nBefore:\n```c\npeer = gst_element_request_pad_simple (stream->splitmuxsink, split_pad_name);\nif (!peer) {\n  GST_ERROR_OBJECT (sink, \"Unable to request pad name %s\", split_pad_name);\n  GST_DASHSINK_UNLOCK (sink);\n  return NULL;\n}\n```\n\nAfter:\n```c\npeer = gst_element_request_pad_simple (stream->splitmuxsink, split_pad_name);\nif (!peer) {\n  GST_ERROR_OBJECT (sink, \"Unable to request pad name %s\", split_pad_name);\n  gst_element_set_state (stream->splitmuxsink, GST_STATE_NULL);\n  gst_bin_remove (GST_BIN (sink), stream->splitmuxsink);\n  gst_object_unref (stream->splitmuxsink);\n  if (stream->muxer)\n    gst_object_unref (stream->muxer);\n  gst_dash_sink_stream_free (stream);\n  GST_DASHSINK_UNLOCK (sink);\n  return NULL;\n}\n```"

[[finding]]
id          = "MEM_20"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_dfb_buffer_pool_alloc_buffer` (`dfbvideosink.c`), when the `\"format\"` field can't be read from `dfbpool->caps`, the function does `return GST_FLOW_ERROR;` directly instead of `goto beach;`. At this point the function has already: created a `GstBuffer *surface` with a `GstMetaDfbSurface`, taken a ref on `dfbpool->dfbvideosink` (`meta->dfbvideosink`), created a DirectFB surface (`meta->surface`) and locked it (`meta->locked = TRUE`). The `beach:` label is the only place that calls `gst_dfb_buffer_pool_free_buffer()` to release all of that (unlock/Release the DirectFB surface, unref the sink, unref the `GstBuffer`). Returning directly bypasses this cleanup, leaking the locked DirectFB surface, the sink object reference, and the `GstBuffer`."
locations   = ["subprojects/gst-plugins-bad/ext/directfb/dfbvideosink.c:379-385"]
fix         = "Route through the existing cleanup path instead of returning directly:\n```\n/* before */\n  str = gst_structure_get_string (structure, \"format\");\n  if (str == NULL) {\n    GST_WARNING (\"failed grabbing fourcc from caps %\" GST_PTR_FORMAT,\n        dfbpool->caps);\n    return GST_FLOW_ERROR;\n  }\n\n/* after */\n  str = gst_structure_get_string (structure, \"format\");\n  if (str == NULL) {\n    GST_WARNING (\"failed grabbing fourcc from caps %\" GST_PTR_FORMAT,\n        dfbpool->caps);\n    result = GST_FLOW_ERROR;\n    goto beach;\n  }\n```"

[[finding]]
id          = "MEM_21"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_iqa_aggregate_frames()`, `GstMessage *m = gst_message_new_element (GST_OBJECT (self), msg_structure);` is allocated up front. If `compare_frames()` fails (e.g. `do_dssim()` detects a size mismatch or the `dssim` value exceeds `ssim_threshold`), the code does `goto failed;`, which only unlocks the aggregator object and returns `GST_FLOW_ERROR`. The message `m` (and its attached structure) is never posted with `gst_element_post_message()` nor released with `gst_message_unref()`, leaking it every time a comparison fails."
locations   = ["subprojects/gst-plugins-bad/ext/iqa/iqa.c:335-399"]
fix         = "Unref the message on the error path. Before: `failed:\\n  GST_OBJECT_UNLOCK (vagg);\\n\\n  return GST_FLOW_ERROR;`. After: `failed:\\n  GST_OBJECT_UNLOCK (vagg);\\n\\n  gst_message_unref (m);\\n  return GST_FLOW_ERROR;`."

[[finding]]
id          = "MEM_22"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_lc3_dec_handle_frame()`, `outbuf` is allocated via `gst_audio_decoder_allocate_output_buffer()` and then mapped (`gst_buffer_map (outbuf, &out_map, GST_MAP_WRITE)`), while `inbuf` is mapped earlier. If `lc3_decode()` returns a negative value for any channel, the code does `return GST_FLOW_ERROR;` directly from inside the `for` loop, skipping the `gst_buffer_unmap (outbuf, &out_map)` and `gst_buffer_unmap (inbuf, &in_map)` calls that occur later in the normal path, and never calling `gst_buffer_unref (outbuf)`. This leaks the allocated `outbuf` (its only reference is dropped without releasing it) and leaves `inbuf` in a mapped state when the function returns."
locations   = ["subprojects/gst-plugins-bad/ext/lc3/gstlc3dec.c:292-309"]
fix         = "Unmap and unref before returning on error. Before: `if (ret < 0) {\\n      GST_ERROR_OBJECT (lc3_dec,\\n          \"Failed to decode frame for buffer %\" GST_PTR_FORMAT, inbuf);\\n      return GST_FLOW_ERROR;\\n    }`. After: `if (ret < 0) {\\n      GST_ERROR_OBJECT (lc3_dec,\\n          \"Failed to decode frame for buffer %\" GST_PTR_FORMAT, inbuf);\\n      gst_buffer_unmap (outbuf, &out_map);\\n      gst_buffer_unmap (inbuf, &in_map);\\n      gst_buffer_unref (outbuf);\\n      return GST_FLOW_ERROR;\\n    }`."

[[finding]]
id          = "MEM_23"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_lc3_enc_handle_frame()`, `outbuf` is allocated via `gst_audio_encoder_allocate_output_buffer()`. If `lc3_encode()` returns a negative value for any channel, the loop `break`s, the function unmaps buffers and, because `ret < 0`, executes `return GST_FLOW_ERROR;` without ever calling `gst_buffer_unref (outbuf)` or passing it to `gst_audio_encoder_finish_frame()`. The already-allocated output buffer is leaked on every encode failure."
locations   = ["subprojects/gst-plugins-bad/ext/lc3/gstlc3enc.c:383-405"]
fix         = "Unref `outbuf` on the error path. Before: `if (ret < 0)\\n    return GST_FLOW_ERROR;\\n\\n  return gst_audio_encoder_finish_frame (encoder, outbuf, req_samples);`. After: `if (ret < 0) {\\n    gst_buffer_unref (outbuf);\\n    return GST_FLOW_ERROR;\\n  }\\n\\n  return gst_audio_encoder_finish_frame (encoder, outbuf, req_samples);`."

[[finding]]
id          = "MEM_24"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `callback()` in subprojects/gst-plugins-bad/ext/mdns/gstmicrodnsdevice.c, when processing an mDNS `RR_TXT` entry for a new (not-yet-known) `_rtsp._tcp.local` device, `uri` is allocated with `g_strdup_printf`. If `get_factory_for_uri()` fails to find a compatible element factory, the code does `goto done;` directly, which skips the `g_free (uri);` call that follows the `if (dev) {...} else {...}` block, leaking the `uri` string. In addition, `goto done` jumps completely out of the `for (tmp = entry; tmp; tmp = tmp->next)` loop over all received DNS resource records, so any further `RR_TXT` entries in the same mDNS response are silently dropped instead of being processed, even though they may describe unrelated, valid devices."
locations   = ["subprojects/gst-plugins-bad/ext/mdns/gstmicrodnsdevice.c:282-330"]
fix         = "Free `uri` and `continue` the loop instead of jumping past cleanup and out of the loop entirely: replace `if (!(factory = get_factory_for_uri (GST_URI_SRC, uri))) { GST_LOG_OBJECT (self, \"Not registering device %s as no compatible factory was found\", tmp->name); goto done; }` with `if (!(factory = get_factory_for_uri (GST_URI_SRC, uri))) { GST_LOG_OBJECT (self, \"Not registering device %s as no compatible factory was found\", tmp->name); g_free (uri); continue; }`."

[[finding]]
id          = "MEM_25"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `callback` (the mDNS resolution handler) in `gstmicrodnsdevice.c`, when a new RTSP service is seen but `get_factory_for_uri` finds no compatible element factory, the code does `goto done;` instead of skipping just the current entry. This (a) leaks the `uri` string allocated a few lines earlier via `g_strdup_printf`, since the `g_free (uri);` at the end of the `if` block is skipped, and (b) aborts processing of the rest of the `entry` linked list for this callback invocation, so any other TXT/SRV entries in the same mDNS response (which could correspond to distinct, resolvable devices) are silently dropped instead of just the one without a factory."
locations   = ["subprojects/gst-plugins-bad/ext/mdns/gstmicrodnsdevice.c:306-311"]
fix         = "Free `uri` and continue with the next entry instead of jumping past the loop, e.g.: `if (!(factory = get_factory_for_uri (GST_URI_SRC, uri))) { GST_LOG_OBJECT (self, \"Not registering device %s as no compatible factory was found\", tmp->name); g_free (uri); continue; }`"

[[finding]]
id          = "MEM_26"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_onnx_inference_start`, the `GValue v_tensors_set` (a `GST_TYPE_UNIQUE_LIST` holding `GstCaps` entries already appended via `gst_value_unique_list_append_and_take_value`) is only unset with `g_value_unset (&v_tensors_set)` on one specific error path (the `gst_onnx_inference_set_tensordec_datatype` failure at line 1663). Every other `goto error;` inside the per-output-tensor loop (e.g. failures of `api->SessionGetOutputTypeInfo`, `api->CastTypeInfoToTensorInfo`, `api->GetDimensionsCount`, `api->GetTensorElementType`, unsupported `gst_data_type`, `api->GetDimensions`, missing `tensor_name`, missing `tensor_id`, or missing `group_id`) jumps straight to the shared `error:` label at the end of the function without ever unsetting `v_tensors_set`, leaking the boxed unique-list value and any `GstCaps`/`GstStructure` objects already stored in it from prior loop iterations."
locations   = ["subprojects/gst-plugins-bad/ext/onnx/gstonnxinference.c:2423-2427", "subprojects/gst-plugins-bad/ext/onnx/gstonnxinference.c:2447-2451", "subprojects/gst-plugins-bad/ext/onnx/gstonnxinference.c:2568-2578", "subprojects/gst-plugins-bad/ext/onnx/gstonnxinference.c:2588-2595", "subprojects/gst-plugins-bad/ext/onnx/gstonnxinference.c:2655-2665"]
fix         = "Unset `v_tensors_set` on every error exit from the loop, e.g. by checking `if (v_tensors_set.g_type) g_value_unset (&v_tensors_set);` right before the shared `error:` cleanup code (after the `error:` label, guarding against it being called twice), or by adding `g_value_unset (&v_tensors_set);` alongside the existing `g_free`/`api->ReleaseTypeInfo` calls at each of the `goto error;` sites listed above, the same way it is already done at `subprojects/gst-plugins-bad/ext/onnx/gstonnxinference.c:1663`."

[[finding]]
id          = "MEM_27"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "In `MotionCells::performDetectionMotionCells()`, `setMotionCells()` allocates a new `m_pCells` 2D array (`new Cell *[m_gridy]` plus `new Cell[m_gridx]` rows) at the top of the processed-frame branch. That memory is normally freed later in the same call at the `if (m_pCells) { ... delete[] m_pCells[i]; ... delete[] m_pCells; }` block. However, when motion is detected and `saveMotionCells()` is invoked and fails (e.g. disk write error causing `ret != 0`), the function does `return ret;` immediately, skipping the `m_pCells` cleanup block entirely (and also skipping the `m_pprevFrame` update and `m_framecnt` reset). Because `m_pCells` is unconditionally overwritten by `new Cell *[...]` on the next call to `setMotionCells()` without ever checking/freeing the previous allocation, the array allocated in the failed call is permanently leaked."
locations   = ["subprojects/gst-plugins-bad/ext/opencv/MotionCells.cpp:231-235", "subprojects/gst-plugins-bad/ext/opencv/MotionCells.cpp:244-249", "subprojects/gst-plugins-bad/ext/opencv/MotionCells.h:221-239"]
fix         = "Free `m_pCells` before returning on the `saveMotionCells()` failure path, or restructure so cleanup always runs. E.g. before: `if (mc_savefile && m_saveInDatafile) { ret = saveMotionCells (timestamp_millisec); if (ret != 0) return ret; }` followed later by the `m_pCells` free block that is skipped on that early return. After: capture the failure and `goto`/fall through to the existing cleanup block instead of returning immediately, e.g. `if (mc_savefile && m_saveInDatafile) { ret = saveMotionCells (timestamp_millisec); }` and only `return ret;` after the `m_pCells` deletion and `m_pprevFrame`/`m_framecnt` updates have executed."

[[finding]]
id          = "MEM_28"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `resindvdbin.c`, `connect_thru_mq` obtains a new pad reference via `gst_element_request_pad_simple (dvdbin->pieces[DVD_ELEM_MQUEUE], \"sink_%u\")` and stores it in `dvdbin->mq_req_pads`. Per `gst_element_release_request_pad`'s documented contract (\"This does not unref the pad ... needs to be followed by `gst_object_unref()`\"), that reference must be explicitly unreffed. `remove_elements` only calls `gst_element_release_request_pad` on each entry of `mq_req_pads` and then `g_list_free`s the list, never calling `gst_object_unref` on the pads themselves, leaking one `GstPad` reference for every stream connected through the multiqueue each time the bin's elements are created/torn down."
locations   = ["subprojects/gst-plugins-bad/ext/resindvd/resindvdbin.c:661-674", "subprojects/gst-plugins-bad/ext/resindvd/resindvdbin.c:714-743"]
fix         = "Unref each pad after releasing it:\n\nBefore:\n```\n  if (dvdbin->pieces[DVD_ELEM_MQUEUE] != NULL) {\n    for (tmp = dvdbin->mq_req_pads; tmp; tmp = g_list_next (tmp)) {\n      gst_element_release_request_pad (dvdbin->pieces[DVD_ELEM_MQUEUE],\n          GST_PAD (tmp->data));\n    }\n  }\n  g_list_free (dvdbin->mq_req_pads);\n```\nAfter:\n```\n  if (dvdbin->pieces[DVD_ELEM_MQUEUE] != NULL) {\n    for (tmp = dvdbin->mq_req_pads; tmp; tmp = g_list_next (tmp)) {\n      gst_element_release_request_pad (dvdbin->pieces[DVD_ELEM_MQUEUE],\n          GST_PAD (tmp->data));\n      gst_object_unref (GST_PAD (tmp->data));\n    }\n  }\n  g_list_free (dvdbin->mq_req_pads);\n```"

[[finding]]
id          = "MEM_29"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "`gst_alsa_device_new` is documented as 'Takes ownership of @caps and @props', but its early-exit checks `g_return_val_if_fail (device_name, NULL); g_return_val_if_fail (internal_name, NULL); g_return_val_if_fail (caps, NULL);` return `NULL` before `gst_structure_free (props)` / `gst_caps_unref (caps)` are ever reached. Its only caller, `add_device`, can pass `caps == NULL` (when `gst_alsa_probe_supported_formats` fails to detect any format) or `device_name == NULL` (`longname`, if `snd_card_get_longname` fails), causing `props` (and possibly `caps`) to be leaked."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsadeviceprovider.c:483-521", "subprojects/gst-plugins-base/ext/alsa/gstalsadeviceprovider.c:44-98"]
fix         = "Free the owned parameters before the early returns, e.g. ```c\nif (!device_name || !internal_name || !caps) {\n  gst_structure_free (props);\n  gst_clear_caps (&caps);\n  return NULL;\n}\n```"

[[finding]]
id          = "MEM_30"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "`gst_alsasrc_get_timestamp` allocates `status` with `snd_pcm_status_malloc (&status)` but leaks it on two early-return paths: when `snd_pcm_status (asrc->handle, status) != 0` (the first check) and when `tstamp.tv_sec == 0 && tstamp.tv_nsec == 0`. `snd_pcm_status_free (status)` is only reached on the final success path."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsasrc.c:938-997"]
fix         = "Free `status` on every return path, e.g. add `snd_pcm_status_free (status);` before returning `GST_CLOCK_TIME_NONE` in both early-return branches:\n```c\nif (G_UNLIKELY (snd_pcm_status (asrc->handle, status) != 0)) {\n  GST_ERROR_OBJECT (asrc, \"snd_pcm_status failed\");\n  snd_pcm_status_free (status);\n  return GST_CLOCK_TIME_NONE;\n}\n...\nif (tstamp.tv_sec == 0 && tstamp.tv_nsec == 0) {\n  snd_pcm_status_free (status);\n  return GST_CLOCK_TIME_NONE;\n}\n```"

[[finding]]
id          = "MEM_31"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_cd_paranoia_src_open`, if `paranoia_init (src->d)` fails (`src->p == NULL`), the code jumps to the `init_failed` error label which only posts a `GST_ELEMENT_ERROR` and returns `FALSE`. The CD device previously opened via `cdda_identify`/`cdda_open` (`src->d`) is never closed with `cdda_close`, leaking the open device handle/file descriptor, unlike the `open_failed` label a few lines above which correctly does `cdda_close (src->d); src->d = NULL;`."
locations   = ["subprojects/gst-plugins-base/ext/cdparanoia/gstcdparanoiasrc.c:206-301"]
fix         = "Close the device in the `init_failed` path too: ```c\ninit_failed:\n{\n  GST_ELEMENT_ERROR (src, LIBRARY, INIT,\n      (\"failed to initialize paranoia\"), (\"failed to initialize paranoia\"));\n  cdda_close (src->d);\n  src->d = NULL;\n  return FALSE;\n}\n```"

[[finding]]
id          = "MEM_32"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "`ca_sink->other_context` (a `GstGLContext *`) is populated by `gst_gl_ensure_element_data` (in `_ensure_gl_setup`) and by `gst_gl_handle_set_context` (in `gst_ca_opengl_layer_sink_set_context`), both of which hand back a ref'd object, but it is never released anywhere in this file: `gst_ca_opengl_layer_sink_change_state`'s `PAUSED_TO_READY` handler clears and unrefs `ca_sink->context` and `ca_sink->display` but not `ca_sink->other_context`, and `gst_ca_opengl_layer_sink_finalize` only clears the mutex and the `layer`. This leaks a `GstGLContext` reference every time the element is set up."
locations   = ["subprojects/gst-plugins-base/ext/gl/caopengllayersink.h:56-59", "subprojects/gst-plugins-base/ext/gl/caopengllayersink.m:489-522", "subprojects/gst-plugins-base/ext/gl/caopengllayersink.m:264-282"]
fix         = "Release `other_context` alongside `context`/`display`, e.g. in `PAUSED_TO_READY` and/or `finalize`: ```c\nif (ca_sink->other_context) {\n  gst_object_unref (ca_sink->other_context);\n  ca_sink->other_context = NULL;\n}\n```"

[[finding]]
id          = "MEM_33"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_ca_opengl_layer_sink_propose_allocation`, when `need_pool` is true, `pool = gst_gl_buffer_pool_new (ca_sink->context)` creates a new buffer pool; if `gst_buffer_pool_set_config (pool, config)` subsequently fails, the code jumps to the `config_failed` label, which only logs and returns `FALSE` - `pool` is never unreffed, leaking the `GstBufferPool` (and its underlying GL context reference)."
locations   = ["subprojects/gst-plugins-base/ext/gl/caopengllayersink.m:732-794"]
fix         = "Unref the pool on the error path: ```c\nconfig_failed:\n{\n  GST_DEBUG_OBJECT (bsink, \"failed setting config\");\n  if (pool)\n    gst_object_unref (pool);\n  return FALSE;\n}\n```"

[[finding]]
id          = "MEM_34"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_gl_colorscale_gl_start`, when `gst_gl_shader_new_default` fails, `shader` is `NULL` (that is the failure condition), yet the error path calls `gst_object_unref (shader)` on that `NULL` pointer (a no-op that only triggers a `g_return_if_fail` critical warning) instead of freeing the `GError`. The `error` returned by `gst_gl_shader_new_default` is read via `error->message` but never freed with `g_error_free`/`g_clear_error`, leaking it on every failed shader compilation."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglcolorscale.c:161-166"]
fix         = "```c\nif (!(shader = gst_gl_shader_new_default (base_filter->context, &error))) {\n  GST_ERROR_OBJECT (colorscale, \"Failed to initialize shader: %s\",\n      error->message);\n  g_clear_error (&error);\n  return FALSE;\n}\n```"

[[finding]]
id          = "MEM_35"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_gl_differencematte_filter_texture`, when `gst_gl_differencematte_loader (filter)` fails, the code does `differencematte->pixbuf = NULL;` without first freeing whatever `differencematte->pixbuf` currently points to. Because `gst_gl_differencematte_loader` only allocates `pixbuf` near the very end of a successful load (after all of its early-return failure checks), a failure on a *subsequent* call to the loader (e.g. the `location` property is changed to a bad/missing file after a previous successful load) leaves the previously-allocated buffer's pointer overwritten with `NULL`, leaking that earlier allocation."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldifferencematte.c:470-473"]
fix         = "Free the existing buffer before discarding the pointer:\n```c\nif (!gst_gl_differencematte_loader (filter)) {\n  free (differencematte->pixbuf);\n  differencematte->pixbuf = NULL;\n}\n```"

[[finding]]
id          = "MEM_36"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_gl_dmabuf_buffer_pool_acquire_buffer()`, `dmabuf` is acquired via `gst_buffer_pool_acquire_buffer (self->priv->dmabuf_pool, &dmabuf, NULL)`. If `gst_buffer_find_memory()` subsequently fails for a plane, the function does `return GST_FLOW_ERROR;` directly instead of jumping to the `out:` label, so `gst_clear_buffer (&dmabuf)` is never reached and the acquired `dmabuf` buffer (and its dma-buf fd-backed memory) is leaked."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldmabufbufferpool.c:269-375"]
fix         = "Route the error through the common cleanup path instead of returning directly:\n```c\n    if (!gst_buffer_find_memory (dmabuf, GST_VIDEO_INFO_PLANE_OFFSET (v_info,\n                i), 1, &mem_idx, &length, &skip)) {\n      GST_WARNING_OBJECT (self, \"Could not find memory for plane %d\", i);\n      ret = GST_FLOW_ERROR;\n      goto out;\n    }\n```"

[[finding]]
id          = "MEM_37"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "`gst_gl_dmabuf_buffer_pool_new()` takes an extra reference on `dmabuf_caps` with `gst_caps_ref (dmabuf_caps)` and stores it in `pool->priv->dmabuf_caps`, but `gst_gl_dmabuf_buffer_pool_finalize()` never releases it with `gst_caps_unref()`. Every `GstGLDMABufBufferPool` instance therefore leaks a `GstCaps` reference when destroyed."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldmabufbufferpool.c:414-446", "subprojects/gst-plugins-base/ext/gl/gstgldmabufbufferpool.c:454-466"]
fix         = "Release the caps in the finalize function:\n```c\nstatic void\ngst_gl_dmabuf_buffer_pool_finalize (GObject * object)\n{\n  GstGLDMABufBufferPool *self = GST_GL_DMABUF_BUFFER_POOL (object);\n\n  GST_LOG_OBJECT (self, \"finalize GL-DMABuf buffer pool\");\n\n  gst_clear_object (&self->priv->dmabuf_pool);\n  gst_clear_caps (&self->priv->dmabuf_caps);\n  g_clear_pointer ((GstGLAllocationParams **) & self->priv->glparams,\n      gst_gl_allocation_params_free);\n\n  G_OBJECT_CLASS (parent_class)->finalize (object);\n}\n```"

[[finding]]
id          = "MEM_38"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_gl_buffer_pool_nvmm_alloc()` (the NVMM/Jetson dma-buf path, built when `HAVE_NVMM` is defined), `downstream_buf = gst_buffer_new ()` is created and, once `nvmm_mem` (which owns a real dma-buf fd allocated via `NvBufferCreateEx`) is appended to it with `gst_buffer_append_memory (downstream_buf, nvmm_mem)`, the buffer is only ever unreffed on the success path (`gst_buffer_unref (downstream_buf)` right before `ret = GST_FLOW_OK`). Every error path that reaches the `done:` label (failure to get `egl_display`, failure of `NvEGLImageFromFd`, failure of `gst_egl_image_new_wrapped`, or failure of `gst_gl_memory_setup_buffer`) returns without unreffing `downstream_buf`, leaking the buffer, its `GstMemoryNVMM`, and the underlying NvBuffer dma-buf file descriptor. The early `return GST_FLOW_ERROR` when `gst_allocator_nvmm_alloc()` itself fails also leaks the empty `downstream_buf`."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldownloadelement.c:626-726"]
fix         = "Unref `downstream_buf` on every failure path, e.g. by clearing it in the `done:` label when it hasn't been handed off:\n```c\ndone:\n  if (in_map_info.memory)\n    gst_buffer_unmap (downstream_buf, &in_map_info);\n\n  gst_clear_buffer (&downstream_buf);\n  gst_clear_object (&egl_display);\n  gst_clear_object (&allocator);\n\n  return ret;\n```\nand remove the explicit `gst_buffer_unref (downstream_buf)` on the success path (replacing it with `downstream_buf = NULL;` after `gst_buffer_add_nvmm_parent_meta`), plus unref `downstream_buf` before the early `return GST_FLOW_ERROR;` when `nvmm_mem` allocation fails."

[[finding]]
id          = "MEM_39"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `prepare_next_buffer` (`gstglimagesink.c`), when the input is frame-by-frame stereo, `gst_gl_view_convert_get_output` is called twice to fill `next_buffer` and `next_buffer2`. If `next_buffer` comes back `NULL` (`\"Not ready to paint a buffer yet\"`) the function returns early without ever unreffing `next_buffer2`, even though it may have been successfully filled in the previous call. Similarly, if `glimage_sink->overlay_compositor` is `NULL` and `gst_gl_overlay_compositor_new` fails, only `next_buffer` is unreffed via `gst_buffer_unref (next_buffer)` before `goto fail`, while a non-`NULL` `next_buffer2` obtained just above is leaked."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglimagesink.c:1768-1796"]
fix         = "Release `next_buffer2` on both early-exit paths:\n```c\nif (next_buffer == NULL) {\n  gst_buffer_replace (&next_buffer2, NULL);\n  GST_GLIMAGE_SINK_LOCK (glimage_sink);\n  return TRUE;\n}\n...\nif (!(glimage_sink->overlay_compositor =\n        gst_gl_overlay_compositor_new (glimage_sink->context))) {\n  gst_buffer_unref (next_buffer);\n  gst_buffer_replace (&next_buffer2, NULL);\n  goto fail;\n}\n```"

[[finding]]
id          = "MEM_40"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_gl_mixer_bin_set_property`'s `PROP_MIXER` case, `gst_object_ref_sink (mixer)` is called explicitly to take ownership of `self->mixer`, in addition to the reference `_connect_mixer_element` takes via `gst_bin_add`. Unlike `gst_gl_sink_bin_set_sink`/`gst_gl_src_bin_set_src` (which mirror this pattern but do have matching `gst_object_unref` calls in their finalize and error paths), `gst_gl_mixer_bin_dispose`/finalize never call `gst_object_unref` on `self->mixer`, so the extra reference taken here is never released, leaking the mixer element whenever it is set via the `mixer` GObject property."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglmixerbin.c:516-533", "subprojects/gst-plugins-base/ext/gl/gstglmixerbin.c:324-346"]
fix         = "Either drop the extra `gst_object_ref_sink` (relying solely on the bin's own reference, matching the `finish_init_with_element` path), or, if an owned reference is intentionally kept in `self->mixer`, release it in `gst_gl_mixer_bin_dispose`:\n```c\ngst_clear_object (&self->mixer);\n```"

[[finding]]
id          = "MEM_41"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "`gst_gl_mosaic_callback` in `gstglmosaic.c` lazily creates `mosaic->vao`, `mosaic->vertex_buffer` and `mosaic->vbo_indices` GL objects the first time it runs (guarded by `if (!mosaic->vertex_buffer)`), but `gst_gl_mosaic_gl_stop` only releases `mosaic->shader` via `gst_clear_object`; it never calls `gl->DeleteVertexArrays`/`gl->DeleteBuffers` on `vao`/`vertex_buffer`/`vbo_indices`, nor resets those fields to `0`. This both leaks the underlying GL buffer/VAO objects when the GL context is stopped/torn down, and leaves stale (potentially now-invalid, since they belonged to the old context) GL object names in the fields, which will be reused as-is (`if (!mosaic->vertex_buffer)` skips regeneration) if the element is restarted with a new GL context, unlike `gstglimagesink.c`'s `gst_glimage_sink_cleanup_glthread` and `gstgloverlay.c`'s `gst_gl_overlay_gl_stop` which correctly delete and zero their equivalent VAO/VBO fields."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglmosaic.c:190-204", "subprojects/gst-plugins-base/ext/gl/gstglmosaic.c:373-387"]
fix         = "Delete and reset the GL objects in `gst_gl_mosaic_gl_stop`, mirroring `gstgloverlay.c`'s `gst_gl_overlay_gl_stop`:\n```c\nstatic void\ngst_gl_mosaic_gl_stop (GstGLBaseMixer * mixer)\n{\n  GstGLMosaic *mosaic = GST_GL_MOSAIC (mixer);\n  const GstGLFuncs *gl = mixer->context->gl_vtable;\n\n  gst_clear_object (&mosaic->shader);\n\n  if (mosaic->vao) {\n    gl->DeleteVertexArrays (1, &mosaic->vao);\n    mosaic->vao = 0;\n  }\n  if (mosaic->vertex_buffer) {\n    gl->DeleteBuffers (1, &mosaic->vertex_buffer);\n    mosaic->vertex_buffer = 0;\n  }\n  if (mosaic->vbo_indices) {\n    gl->DeleteBuffers (1, &mosaic->vbo_indices);\n    mosaic->vbo_indices = 0;\n  }\n  ...\n}\n```"

[[finding]]
id          = "MEM_42"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "`gst_gl_stereo_mix_process_frames` allocates `inbuf = gst_buffer_new ();` and appends one `GstMemory` (via `gst_buffer_get_memory`, transfer-full) plus a `parent_buffer_meta` per connected sink pad. If, after building `inbuf`, `mixer->mix_info.views != valid_views` (e.g. a pad was added/removed and the mix has not been renegotiated yet), the function logs a warning and returns `FALSE` immediately without ever unreffing `inbuf`, leaking the buffer together with every memory/parent-buffer-meta reference it holds (which in turn keeps the corresponding input buffers alive via the added `parent_buffer_meta`)."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglstereomix.c:669-705"]
fix         = "Release `inbuf` before bailing out:\n```c\nif (mixer->mix_info.views != valid_views) {\n  GST_WARNING_OBJECT (mixer, \"Not enough input views to process\");\n  gst_buffer_unref (inbuf);\n  return FALSE;\n}\n```"

[[finding]]
id          = "MEM_43"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "In `debug_dump_get_object_params`, when a property value holds an enum or flags type, the code calls `g_type_class_ref (G_VALUE_TYPE (&value))` to obtain `e_class` / `f_class` (used to look up the nick names), but never calls the matching `g_type_class_unref`. This leaks a reference to the enum/flags `GTypeClass` every time an enum- or flags-typed, non-default property is dumped. Unlike the deliberate, one-time, explicitly-commented `g_type_class_ref` leak used for permanently-registered plugin-feature types elsewhere in GStreamer (e.g. `gst_element_register` / `gst_device_provider_register`), this function runs on every pipeline dot-dump (potentially very frequently, e.g. once per state change with `GST_DEBUG_DUMP_DOT_DIR` set), so the leak accumulates per call rather than being a bounded, one-off cost."
locations   = ["subprojects/gstreamer/gst/gstdebugutils.c:184-222"]
fix         = "Release the class reference once it is no longer needed, e.g.:\n```c\nif (G_VALUE_HOLDS_ENUM (&value)) {\n  GEnumClass *e_class = g_type_class_ref (G_VALUE_TYPE (&value));\n  ...\n  g_type_class_unref (e_class);\n} else if (G_VALUE_HOLDS_FLAGS (&value)) {\n  GFlagsClass *f_class = g_type_class_ref (G_VALUE_TYPE (&value));\n  ...\n  g_type_class_unref (f_class);\n}\n```"

[[finding]]
id          = "MEM_44"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "`gst_dynamic_type_factory_load` leaks two `GstPluginFeature`-derived references per call. First, `factory = gst_dynamic_type_factory_find (factoryname);` returns a `(transfer full)` reference (via `gst_registry_find_feature`), but this reference is discarded (the `factory` variable is overwritten) without ever calling `gst_object_unref` on it. Second, the result of `gst_plugin_feature_load (GST_PLUGIN_FEATURE (factory))` is also `(transfer full)` per its own documented contract (`gst_plugin_feature_load`'s doc comment explicitly shows the caller must `gst_object_unref` the original feature and take ownership of, and eventually release, the returned one), yet the function only reads `factory->type` and returns it, without ever unreffing `factory`. Every call therefore permanently inflates the refcount of the underlying `GstDynamicTypeFactory`/plugin object by two, preventing it from ever reaching zero and triggering leak warnings/assertions during `gst_deinit()` style cleanup in debug builds."
locations   = ["subprojects/gstreamer/gst/gstdynamictypefactory.c:100-118"]
fix         = "Unref both intermediate references, following the pattern documented on `gst_plugin_feature_load`:\n```c\nGType\ngst_dynamic_type_factory_load (const gchar * factoryname)\n{\n  GstDynamicTypeFactory *factory = gst_dynamic_type_factory_find (factoryname);\n  GstDynamicTypeFactory *loaded;\n  GType type;\n\n  if (factory == NULL)\n    return 0;\n\n  loaded = GST_DYNAMIC_TYPE_FACTORY (gst_plugin_feature_load (GST_PLUGIN_FEATURE (factory)));\n  gst_object_unref (factory);\n  if (loaded == NULL)\n    return 0;\n\n  GST_DEBUG_OBJECT (loaded, \"Loaded type %s\", factoryname);\n  type = loaded->type;\n  gst_object_unref (loaded);\n  return type;\n}\n```"

[[finding]]
id          = "MEM_45"
type        = "memory_leak"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_element_register()` (`subprojects/gstreamer/gst/gstelementfactory.c`), a new floating `GstElementFactory` is allocated with `factory = g_object_new (GST_TYPE_ELEMENT_FACTORY, NULL);` and immediately stored via `g_type_set_qdata (type, __gst_elementclass_factory, factory);`. If registration later fails (missing metadata via `CHECK_METADATA_FIELD` jumping to `detailserror`, or a bad `GstURIHandler` implementation jumping to `urierror`), the error paths only call `gst_element_factory_cleanup (factory)`, which frees the factory's internal fields (`metadata`, `staticpadtemplates`, `uri_protocols`, `interfaces`) but never unrefs/frees the `factory` `GObject` itself. Since the type's qdata still points at it, the floating `GstElementFactory` object is leaked for the remaining lifetime of the process (and if `gst_element_register()` for that same `type` is retried, the qdata pointer is simply overwritten, orphaning the previous leaked object entirely)."
locations   = ["subprojects/gstreamer/gst/gstelementfactory.c:238-329"]
fix         = "In the `urierror:` and `detailserror:` handlers, drop the leaked reference in addition to cleaning up its fields, e.g.:\n```c\nurierror:\n{\n  GST_WARNING_OBJECT (factory, \"error with uri handler!\");\n  gst_element_factory_cleanup (factory);\n  g_type_set_qdata (type, __gst_elementclass_factory, NULL);\n  gst_object_unref (factory);\n  return FALSE;\n}\n\ndetailserror:\n{\n  gst_element_factory_cleanup (factory);\n  g_type_set_qdata (type, __gst_elementclass_factory, NULL);\n  gst_object_unref (factory);\n  return FALSE;\n}\n```"

[[finding]]
id          = "MEM_46"
type        = "memory_leak"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_ring_buffer_logger_free()` (`subprojects/gstreamer/gst/gstinfo.c:4637-4657`), each `GstRingBufferLog` popped from `logger->threads` has its buffered strings freed and is itself `g_free()`'d, but the `GstVecDeque *log->log` container (allocated with `gst_vec_deque_new (2048)` in `gst_ring_buffer_logger_log()`, line 4555) is never released with `gst_vec_deque_free()`. Compare with the thread-timeout eviction path in `gst_ring_buffer_logger_log()` (lines 4538-4544), which correctly calls `gst_vec_deque_free (log->log)` before `g_free (log)`. As a result, every call to `gst_debug_remove_ring_buffer_logger()` (which triggers this destructor via the `GDestroyNotify`) leaks one `GstVecDeque` struct per thread that ever logged through the ring buffer."
locations   = ["subprojects/gstreamer/gst/gstinfo.c:4637-4657"]
fix         = "Free the vec-deque before freeing the `GstRingBufferLog` struct, mirroring the eviction code path:\n```c\nwhile ((log = g_queue_pop_head (&logger->threads))) {\n  gchar *buf;\n  while ((buf = gst_vec_deque_pop_head (log->log)))\n    g_free (buf);\n  gst_vec_deque_free (log->log);\n  g_free (log);\n}\n```"

[[finding]]
id          = "MEM_47"
type        = "memory_leak"
severity    = "medium"
difficulty  = "easy"
description = "`gst_meta_factory_load()` leaks `GstPluginFeature` references. `gst_meta_factory_find()` returns a `(transfer full)` reference (via `gst_registry_find_feature()`), stored in `factory`. That reference is then overwritten by `factory = GST_META_FACTORY (gst_plugin_feature_load (GST_PLUGIN_FEATURE (factory)));` without ever calling `gst_object_unref()` on the original `factory` - the reference is simply dropped, orphaning the ref. `gst_plugin_feature_load()` itself is documented as `(transfer full)` on its return value (its own doc example explicitly shows the caller unreffing the input feature and taking ownership of the returned one), but the new `factory` reference obtained here is also never unreffed - the function returns `factory->meta_info` and simply falls off the end, leaking that second reference too. This runs on the `gst_meta_deserialize()` path (`gstmeta.c:882`) whenever a meta type is not yet present in the direct `metainfo` hash and must be lazily loaded from its owning plugin."
locations   = ["subprojects/gstreamer/gst/gstmetafactory.c:108-123"]
fix         = "Unref the intermediate reference before overwriting it, and unref the final one after extracting `meta_info`:\n\n```c\nconst GstMetaInfo *\ngst_meta_factory_load (const gchar * factoryname)\n{\n  GstMetaFactory *factory = gst_meta_factory_find (factoryname);\n  GstMetaFactory *loaded_factory;\n  const GstMetaInfo *info;\n\n  if (factory == NULL)\n    return NULL;\n\n  loaded_factory =\n      GST_META_FACTORY (gst_plugin_feature_load (GST_PLUGIN_FEATURE (factory)));\n  gst_object_unref (factory);\n  if (loaded_factory == NULL)\n    return NULL;\n\n  GST_DEBUG_OBJECT (loaded_factory, \"Loaded type %s\", factoryname);\n  info = loaded_factory->meta_info;\n  gst_object_unref (loaded_factory);\n\n  return info;\n}\n```"

[[finding]]
id          = "MEM_48"
type        = "memory_leak"
severity    = "low"
difficulty  = "easy"
description = "In `gst_validate_check_num_instances_data_new` (`subprojects/gst-devtools/validate/gst/validate/gst-validate-extra-checks.c`), if the mandatory `element-klass` field is missing, execution jumps to `failed:` after `data->pname` has already been set via `g_strdup`. The `failed:` block only frees `data->klass` (which is `NULL` in this path) and `data`, never `data->pname`, leaking the string."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-extra-checks.c:43-57"]
fix         = "Also free `data->pname` in the `failed:` block, e.g. by calling the existing free function instead of duplicating cleanup:\n```c\nfailed:\n  g_free (data->pname);\n  g_free (data->klass);\n  g_free (data);\n\n  return NULL;\n```"

[[finding]]
id          = "MEM_49"
type        = "memory_leak"
severity    = "low"
difficulty  = "medium"
description = "In `_execute_appsrc_push`'s `from-appsink` handling, `pipeline_elements = g_strsplit (from_appsink, \"/\", 2)` is only freed with `g_strfreev (pipeline_elements)` right before `goto push_sample`. If either `REPORT_UNLESS (pipeline, err, ...)` (sub-pipeline not found) or `REPORT_UNLESS (appsink, err, ...)` (appsink not found) fails, control jumps to `err`/`done` without ever freeing `pipeline_elements`, leaking the string vector on those error paths."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:4491-4512"]
fix         = "Declare `pipeline_elements` at function scope and free it unconditionally in the shared `done:`/`err:` cleanup, e.g. add `g_strfreev (pipeline_elements);` (guarded by NULL-init) alongside the other `g_clear_pointer`/`gst_clear_object` calls at `done:`."

[[finding]]
id          = "MEM_50"
type        = "memory_leak"
severity    = "low"
difficulty  = "medium"
description = "In `_read_builtin` (`gst-validate-utils.c`), the two error paths build a heap string with `g_strdup_printf` and pass it to `_error()`, then call `g_free()` on it immediately afterward: `gchar *tmp = g_strdup_printf (...); _error (parser, tmp); g_free (tmp);` (and similarly `err`/`g_free (err)` in the variable-lookup-failure branch). Because `_error()` calls `longjmp (parser->err_jmp_buf, 1)` and never returns, the subsequent `g_free()` is unreachable dead code, so `tmp`/`err` leak every time an unknown built-in function or undefined variable is used in an `expr(...)` expression."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-utils.c:384-403"]
fix         = "Free the string before calling `_error()` is not possible since `parser->error` needs to keep pointing at valid memory across the `longjmp`; instead duplicate the message where it is consumed and free the original immediately, e.g. call `_error` with a static/format string only, or have `gst_validate_utils_parse_expression` take ownership of `parser->error` (transfer-full) and free it appropriately instead of relying on unreachable `g_free()` calls after `_error()`."

[[finding]]
id          = "MEM_51"
type        = "memory_leak"
severity    = "low"
difficulty  = "medium"
description = "In `_create_keyboard_events()` (`gstvalidategtk.c`), the arrays returned (transfer-full) by `gtk_accelerator_parse_with_keycode()` (`keys`) and `gdk_keymap_get_entries_for_keyval()` (`kmaps`) are never freed with `g_free()`. Since this runs in a loop over every character of the `string` action parameter, sending a long string through a `gtk-put-event` scenario action leaks one allocation per character."
locations   = ["subprojects/gst-devtools/validate/plugins/gtk/gstvalidategtk.c:169-191"]
fix         = "Free `keys` and `kmaps` once no longer needed, e.g.:\nBefore:\n```c\ngtk_accelerator_parse_with_keycode (keyname, &keyval, &keys, &state);\nevents =\n    g_list_append (events, _create_key_event (window, etype, keyval,\n        keys ? keys[0] : 0, state, device));\n```\nAfter:\n```c\ngtk_accelerator_parse_with_keycode (keyname, &keyval, &keys, &state);\nevents =\n    g_list_append (events, _create_key_event (window, etype, keyval,\n        keys ? keys[0] : 0, state, device));\ng_free (keys);\n```\n(and similarly `g_free (kmaps);` after using it in the `string` branch)."

[[finding]]
id          = "MEM_52"
type        = "memory_leak"
severity    = "low"
difficulty  = "medium"
description = "In `real_main()` in `gst-validate.c`, when `gst_element_set_state (pipeline, GST_STATE_PLAYING)` returns `GST_STATE_CHANGE_FAILURE`, the code does `gst_element_set_state (pipeline, GST_STATE_NULL); ret = -1; goto exit;`, jumping past the bus cleanup block (`gst_bus_set_flushing (bus, TRUE); gst_bus_remove_signal_watch (bus); gst_object_unref (bus);`) that follows `g_main_loop_run (mainloop)`. The reference to `bus` obtained via `gst_element_get_bus (pipeline)` is therefore never released and the signal watch on it is never removed on this error path, unlike the normal-completion path just a few lines below."
locations   = ["subprojects/gst-devtools/validate/tools/gst-validate.c:566-567", "subprojects/gst-devtools/validate/tools/gst-validate.c:578-584", "subprojects/gst-devtools/validate/tools/gst-validate.c:604-607"]
fix         = "Release the bus reference (and remove the signal watch) before jumping to `exit`, e.g. move the cleanup into the `exit:` block or add it to the `GST_STATE_CHANGE_FAILURE` case:\nBefore:\n```c\ncase GST_STATE_CHANGE_FAILURE:\n  gst_validate_printf (NULL, \"Pipeline failed to go to PLAYING state\\n\");\n  gst_element_set_state (pipeline, GST_STATE_NULL);\n  ret = -1;\n  goto exit;\n```\nAfter:\n```c\ncase GST_STATE_CHANGE_FAILURE:\n  gst_validate_printf (NULL, \"Pipeline failed to go to PLAYING state\\n\");\n  gst_element_set_state (pipeline, GST_STATE_NULL);\n  gst_bus_set_flushing (bus, TRUE);\n  gst_bus_remove_signal_watch (bus);\n  gst_object_unref (bus);\n  ret = -1;\n  goto exit;\n```"

[[finding]]
id          = "MEM_53"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "`ges_formatter_class_register_metas()` unconditionally overwrites `klass->name`, `klass->description`, `klass->extension` and `klass->mimetype` with newly `g_strdup`'d strings, but `ges_formatter_class_init()` already initialized those same fields with `g_strdup (\"base-formatter\")`, `g_strdup (\"noextension\")`, etc. Since every `GESFormatter` subclass calls `ges_formatter_class_register_metas()` from its own `class_init` (after the base class's `class_init` has run), the previously-allocated default strings are leaked (once per formatter subclass, for the lifetime of the process)."
locations   = ["subprojects/gst-editing-services/ges/ges-formatter.c:516-533"]
fix         = "Free the previous strings before overwriting them:\n```c\nvoid\nges_formatter_class_register_metas (GESFormatterClass * klass,\n    const gchar * name, const gchar * description, const gchar * extensions,\n    const gchar * caps, gdouble version, GstRank rank)\n{\n  g_return_if_fail (klass->name);\n  g_free (klass->name);\n  g_free (klass->description);\n  g_free (klass->extension);\n  g_free (klass->mimetype);\n  klass->name = g_strdup (name);\n  klass->description = g_strdup (description);\n  klass->extension = g_strdup (extensions);\n  klass->mimetype = g_strdup (caps);\n  ...\n```"

[[finding]]
id          = "MEM_54"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "In `_ges_container_add_child_from_struct` (`ges-structured-interface.c`), when neither an asset-based child nor a `child-name` could be resolved, the function does `*error = g_error_new (...); return FALSE;` directly instead of `goto beach;`. This skips the `beach:` label's `gst_clear_object (&container);`, leaking the reference on `container` that was obtained earlier via `_get_last_container` (a `g_weak_ref_get`, transfer full) or `ges_timeline_get_element` (transfer full)."
locations   = ["subprojects/gst-editing-services/ges/ges-structured-interface.c:969-974"]
fix         = "Before:\n```c\n  if (!child) {\n    *error =\n        g_error_new (GES_ERROR, 0, \"Wrong parameters, could not get a child\");\n\n    return FALSE;\n  }\n```\nAfter:\n```c\n  if (!child) {\n    *error =\n        g_error_new (GES_ERROR, 0, \"Wrong parameters, could not get a child\");\n\n    res = FALSE;\n    goto beach;\n  }\n```"

[[finding]]
id          = "MEM_55"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "In `ges_transition_clip_new()` in `ges-transition-clip.c`, `klass` is obtained with `g_type_class_ref (GES_VIDEO_STANDARD_TRANSITION_TYPE_TYPE)`, which takes a reference on the `GEnumClass`. When `g_enum_get_value (klass, vtype)` fails to find a matching value (i.e. an invalid `vtype` was passed in), the function returns `NULL` directly without calling `g_type_class_unref (klass)`, leaking the reference taken on the enum class. The success path a few lines below correctly calls `g_type_class_unref (klass)`."
locations   = ["subprojects/gst-editing-services/ges/ges-transition-clip.c:392-416"]
fix         = "Unref `klass` before returning on the error path:\n```c\n  value = g_enum_get_value (klass, vtype);\n  if (!value) {\n    GST_ERROR (\"Could not find enum value for %i\", vtype);\n    g_type_class_unref (klass);\n    return NULL;\n  }\n```"

[[finding]]
id          = "MEM_56"
type        = "memory_leak"
severity    = "low"
difficulty  = "easy"
description = "In the `nle-add-child` validate action handler `_add_object`, `gst_bin_add (GST_BIN (nleobj), gst_object_ref (child))` takes an extra reference on `child` specifically to hand to `gst_bin_add`. Per `gst_bin_add_func`'s documented contract, on failure (e.g. duplicate child name, or `child` already having a parent) the passed-in reference is *not* consumed by the bin. The `REPORT_UNLESS` macro then jumps to `clean:`, where only `gst_clear_object (&child)` runs, dropping the original variable's reference but never releasing the extra one taken via `gst_object_ref (child)` right before the failing call, leaking one reference on `child` (and thus keeping it alive forever, since it's already been unparented from wherever it came from)."
locations   = ["subprojects/gst-editing-services/plugins/nle/validate.c:106-113"]
fix         = "Only take/keep the extra ref if `gst_bin_add` actually succeeds, e.g.:\n```\nif (!gst_bin_add (GST_BIN (nleobj), gst_object_ref (child))) {\n  gst_object_unref (child);\n  REPORT_UNLESS (FALSE, clean, \"Could not add child to nle object\");\n}\n```\nor explicitly unref the extra reference in the `clean:` path when `gst_bin_add` failed."

[[finding]]
id          = "MEM_57"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "In `gst_segmentation_overlay_set_property` (`PROP_SELECTED_TYPES` case), `gchar **tokens = g_strsplit (selected_types, \";\", -1);` is used to build the type filter list but is never freed with `g_strfreev`, leaking the token array and every substring on each property set. Additionally, `overlay->selected_types_str = selected_types;` overwrites any previously stored string without freeing it first, so setting the `selected-types` property more than once leaks the old value (it is only ever freed once, in `gst_segmentation_overlay_finalize`)."
locations   = ["subprojects/gst-plugins-bad/ext/analyticsoverlay/gstsegmentationoverlay.c:261-278"]
fix         = "Free the previous string and the split array:\n```\n      if (selected_types != NULL) {\n        overlay->selected_types_str = selected_types;\n        gchar **tokens = g_strsplit (selected_types, \";\", -1);\n        if (tokens != NULL && tokens[0] != NULL) {\n          ...\n        }\n      }\n```\nbecomes:\n```\n      if (selected_types != NULL) {\n        g_free (overlay->selected_types_str);\n        overlay->selected_types_str = selected_types;\n        gchar **tokens = g_strsplit (selected_types, \";\", -1);\n        if (tokens != NULL && tokens[0] != NULL) {\n          ...\n        }\n        g_strfreev (tokens);\n      }\n```"

[[finding]]
id          = "MEM_58"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "In `gst_segmentation_overlay_negotiate`, when `gst_pad_peer_query (srcpad, query)` fails while the source pad is flushing, the code does `ret = FALSE; goto done;`, jumping past the `gst_query_unref (query)` call at the end of the `if (upstream_has_meta || caps_has_meta)` block. This leaks the `GstQuery` allocated by `gst_query_new_allocation` every time renegotiation happens to race with a flush. Comparing with the equivalent, non-buggy logic in `gst_ass_render_negotiate` (`subprojects/gst-plugins-bad/ext/assrender/gstassrender.c`), which continues past the failure instead of jumping over the unref, confirms this `goto` was a mistake introduced when this file was adapted from that pattern."
locations   = ["subprojects/gst-plugins-bad/ext/analyticsoverlay/gstsegmentationoverlay.c:385-420"]
fix         = "Unref the query before jumping to `done`:\n```\n      if (GST_PAD_IS_FLUSHING (GST_BASE_TRANSFORM_SRC_PAD (overlay))) {\n        ret = FALSE;\n        goto done;\n      }\n```\nbecomes:\n```\n      if (GST_PAD_IS_FLUSHING (GST_BASE_TRANSFORM_SRC_PAD (overlay))) {\n        ret = FALSE;\n        gst_query_unref (query);\n        goto done;\n      }\n```"

[[finding]]
id          = "MEM_59"
type        = "memory_leak"
severity    = "low"
difficulty  = "easy"
description = "`gst_dfbvideosink_navigation_send_event` implements `GstNavigationInterface::send_event_simple`, whose `event` parameter is documented as `(transfer full)` (see `gst_navigation_send_event_simple` in `navigation.c`), i.e. the implementation must consume/unref `event` exactly once no matter what. The function only calls `gst_event_unref (event)` inside the `if (GST_IS_PAD (pad))` branch. If `gst_pad_get_peer (GST_VIDEO_SINK_PAD (dfbvideosink))` returns `NULL` (sink pad currently unlinked, e.g. during pipeline teardown/relinking while a navigation event is in flight), the `if` block is skipped entirely and `event` is never unreffed, leaking the `GstEvent`."
locations   = ["subprojects/gst-plugins-bad/ext/directfb/dfbvideosink.c:2037-2050"]
fix         = "Unref the event unconditionally after the peer-pad handling:\n```\n/* before */\n  pad = gst_pad_get_peer (GST_VIDEO_SINK_PAD (dfbvideosink));\n\n  if (GST_IS_PAD (pad)) {\n    if (!gst_pad_send_event (pad, gst_event_ref (event))) {\n      gst_element_post_message (GST_ELEMENT_CAST (dfbvideosink),\n          gst_navigation_message_new_event (GST_OBJECT_CAST (dfbvideosink),\n              event));\n    }\n    gst_event_unref (event);\n    gst_object_unref (pad);\n  }\n}\n\n/* after */\n  pad = gst_pad_get_peer (GST_VIDEO_SINK_PAD (dfbvideosink));\n\n  if (GST_IS_PAD (pad)) {\n    if (!gst_pad_send_event (pad, gst_event_ref (event))) {\n      gst_element_post_message (GST_ELEMENT_CAST (dfbvideosink),\n          gst_navigation_message_new_event (GST_OBJECT_CAST (dfbvideosink),\n              event));\n    }\n    gst_object_unref (pad);\n  }\n  gst_event_unref (event);\n}\n```"

[[finding]]
id          = "MEM_60"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "`gst_eil_context_new` in `gstlcevcencoder.c` allocates `ctx` with `g_new0` before validating anything, then returns `NULL` on both the `EIL_OpenSettingsDefault` failure path and the `EIL_Open` failure path without freeing `ctx`, leaking the `GstEILContext` structure each time opening the encoder's EIL backend fails (e.g. due to a bad `plugin-name` or backend init failure), which happens on every failed `gst_lcevc_encoder_start`/state-change retry."
locations   = ["subprojects/gst-plugins-bad/ext/lcevcencoder/gstlcevcencoder.c:90-119"]
fix         = "Free `ctx` before returning `NULL` in the failure paths, e.g.: `if (rc != EIL_RC_Success) { g_free (ctx); return NULL; }` (and similarly for the `EIL_Open` failure)."

[[finding]]
id          = "MEM_61"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "In `lv2_count_ports` in `gstlv2.c`, when a port belongs to an LV2 port group whose URI has already been recorded in `port_groups`, the code does `continue;` before reaching the `lilv_node_free (lv2group)` call a few lines below, leaking the `LilvNode` returned by `lilv_port_get` for every port beyond the first one in a multi-port audio group."
locations   = ["subprojects/gst-plugins-bad/ext/lv2/gstlv2.c:143-151"]
fix         = "Free the node before skipping to the next port: `if (g_hash_table_contains (port_groups, uri)) { lilv_node_free (lv2group); continue; }`"

[[finding]]
id          = "MEM_62"
type        = "memory_leak"
severity    = "low"
difficulty  = "medium"
description = "`gst_mdns_device_provider_start()` in subprojects/gst-plugins-bad/ext/mdns/gstmicrodnsdevice.c calls `g_thread_new (\"MDNS listener\", (GThreadFunc) _listen, ctx);` and discards the returned `GThread *`. Per GLib semantics, `g_thread_new()` always returns a reference-counted, joinable `GThread` that the caller owns and must eventually release with `g_thread_join()` or `g_thread_unref()`; simply dropping the pointer leaks the `GThread` object (and, until unreffed, the associated OS thread resources) every time the device provider is started, which can happen repeatedly over the lifetime of a process (e.g. `gst_device_monitor_start`/`stop` cycles)."
locations   = ["subprojects/gst-plugins-bad/ext/mdns/gstmicrodnsdevice.c:405"]
fix         = "Capture and release the thread handle since it is not going to be joined: `GThread *thread = g_thread_new (\"MDNS listener\", (GThreadFunc) _listen, ctx); g_thread_unref (thread);`."

[[finding]]
id          = "MEM_63"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "In `gst_openjpeg_enc_fill_image` (`subprojects/gst-plugins-bad/ext/openjpeg/gstopenjpegenc.c`), the `comps` array allocated with `g_new0` is only freed with `g_free (comps)` after a successful `opj_image_create` call. If `opj_image_create` returns `NULL`, the function returns early without freeing `comps`, leaking the allocation."
locations   = ["subprojects/gst-plugins-bad/ext/openjpeg/gstopenjpegenc.c:1024-1032"]
fix         = "Free `comps` on the failure path too:\nBefore:\n```c\n  image = opj_image_create (ncomps, comps, colorspace);\n  if (!image) {\n    GST_WARNING_OBJECT (self,\n        \"Unable to create a JPEG image. first component height=%d\",\n        ncomps ? comps[0].h : 0);\n    return NULL;\n  }\n\n  g_free (comps);\n```\nAfter:\n```c\n  image = opj_image_create (ncomps, comps, colorspace);\n  if (!image) {\n    GST_WARNING_OBJECT (self,\n        \"Unable to create a JPEG image. first component height=%d\",\n        ncomps ? comps[0].h : 0);\n    g_free (comps);\n    return NULL;\n  }\n\n  g_free (comps);\n```"

[[finding]]
id          = "MEM_64"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "Two `GError` leaks in `caopengllayersink.m`: in `_ensure_gl_setup`'s `context_error` label, `error->message` is used in `GST_ELEMENT_ERROR` but `error` is never freed; likewise in `gst_ca_opengl_layer_sink_thread_init_redisplay`, `error->message` is logged via `GST_ERROR_OBJECT` after `gst_gl_shader_new_default` fails, but `error` is never freed either."
locations   = ["subprojects/gst-plugins-base/ext/gl/caopengllayersink.m:386-393", "subprojects/gst-plugins-base/ext/gl/caopengllayersink.m:844-850"]
fix         = "Call `g_clear_error (&error)` (or `g_error_free (error)`) right after using `error->message` in both spots."

[[finding]]
id          = "MEM_65"
type        = "memory_leak"
severity    = "low"
difficulty  = "very_easy"
description = "In `gst_gl_effects_identity`, when `gst_gl_shader_new_default` fails, the code logs `error->message` via `GST_ELEMENT_ERROR` but never calls `g_error_free (error)` (or `g_clear_error (&error)`), leaking the `GError`."
locations   = ["subprojects/gst-plugins-base/ext/gl/effects/gstgleffectidentity.c:33-44"]
