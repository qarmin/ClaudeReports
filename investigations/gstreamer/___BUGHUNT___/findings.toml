[[finding]]
id          = "DUP_1"
type        = "duplicate_code"
severity    = "low"
difficulty  = "easy"
description = "`subprojects/gstreamer/gst/gstelement.h` defines twelve near-identical macros for element error/warning/info reporting: `GST_ELEMENT_ERROR`, `GST_ELEMENT_ERROR_WITH_LOG_CTX`, `GST_ELEMENT_ERROR_WITH_DETAILS`, `GST_ELEMENT_ERROR_WITH_DETAILS_AND_LOG_CTX`, and the same four variants each for `WARNING` and `INFO`. Each macro body differs only in the `GST_MESSAGE_*` constant, whether `GST_ELEMENT_MESSAGE_MAKE_DETAILS` is passed, and which logging macro (`GST_WARNING_OBJECT`/`GST_CTX_WARNING_OBJECT`/etc.) is used, but the surrounding boilerplate (computing `__txt`/`__dbg` via `_gst_element_error_printf`, calling `gst_element_message_full[_with_details]`) is copy-pasted twelve times. This is a maintenance risk: a fix or extension (e.g. adding a new field) has to be replicated correctly in all twelve places."
locations   = ["subprojects/gstreamer/gst/gstelement.h:547-912"]
fix         = "Factor the shared body into one parameterized inner macro, e.g.:\n```c\n#define _GST_ELEMENT_NOTIFY(el, msgtype, domain, code, text, debug, details, logfunc) \\\nG_STMT_START { \\\n  gchar *__txt = _gst_element_error_printf text; \\\n  gchar *__dbg = _gst_element_error_printf debug; \\\n  if (__txt) logfunc; \\\n  if (__dbg) logfunc; \\\n  gst_element_message_full_with_details (GST_ELEMENT (el), \\\n      msgtype, GST_ ## domain ## _ERROR, GST_ ## domain ## _ERROR_ ## code, \\\n      __txt, __dbg, __FILE__, GST_FUNCTION, __LINE__, details); \\\n} G_STMT_END\n```\nand define `GST_ELEMENT_ERROR`, `GST_ELEMENT_WARNING`, `GST_ELEMENT_INFO` and their `_WITH_DETAILS`/`_WITH_LOG_CTX` variants in terms of it, passing `NULL` for `details` and the plain `GST_WARNING_OBJECT`-style call where the log-context/details versions aren't needed."

[[finding]]
id          = "DUP_2"
type        = "duplicate_code"
severity    = "negligible"
difficulty  = "very_easy"
description = "In `gst_ca_opengl_layer_sink_prepare`, `ca_sink->next_tex = *(guint *) gl_frame.data[0];` is executed twice with the identical value: once before `GST_CA_OPENGL_LAYER_SINK_LOCK` is taken, and again immediately after taking the lock. The first, unlocked write is redundant and also writes shared state without holding `drawing_lock`."
locations   = ["subprojects/gst-plugins-base/ext/gl/caopengllayersink.m:651-663"]
fix         = "Remove the earlier unlocked assignment and keep only the one performed under `GST_CA_OPENGL_LAYER_SINK_LOCK`:\n```c\nGST_CA_OPENGL_LAYER_SINK_LOCK (ca_sink);\nca_sink->next_tex = *(guint *) gl_frame.data[0];\n```"

[[finding]]
id          = "ARCH_1"
type        = "architecture"
severity    = "medium"
difficulty  = "medium"
description = "`ges_smart_mixer_get_mixer_pad` in `ges-smart-video-mixer.c` reads `self->pads_infos` via a plain `g_hash_table_lookup` without taking `LOCK (self)`, unlike every other accessor of that table (`_request_new_pad`, `_release_pad` via `ges_smart_mixer_find_pad_info`, all of which lock `self->lock` before touching the hash table). Because `GHashTable` is not safe for concurrent unsynchronized access, if another thread concurrently requests/releases a pad (which mutates the same table under the lock), this lookup can race with a table resize/rehash on another thread. In addition, the result `info` is dereferenced (`info->mixer_pad`) without a `NULL` check, so if the lookup fails to find an entry (e.g. due to the race, or simply if `sinkpad` were not created by `_request_new_pad`) this crashes with a `NULL` pointer dereference."
locations   = ["subprojects/gst-editing-services/ges/ges-smart-video-mixer.c:208-223"]
fix         = "Take the lock and check for `NULL`, consistent with `ges_smart_mixer_find_pad_info`:\n```c\nGstPad *\nges_smart_mixer_get_mixer_pad (GESSmartMixer * self, GstPad ** mixerpad)\n{\n  PadInfos *info;\n  GstPad *sinkpad;\n\n  sinkpad = gst_element_request_pad_simple (GST_ELEMENT (self), \"sink_%u\");\n\n  if (sinkpad == NULL)\n    return NULL;\n\n  LOCK (self);\n  info = g_hash_table_lookup (self->pads_infos, sinkpad);\n  *mixerpad = info ? gst_object_ref (info->mixer_pad) : NULL;\n  UNLOCK (self);\n\n  return sinkpad;\n}\n```"

[[finding]]
id          = "ARCH_2"
type        = "architecture"
severity    = "medium"
difficulty  = "medium"
description = "`subprojects/gstreamer/gst/gstelement.c` is nearly 3900 lines and is entirely hand-written (not generated). It mixes many largely independent responsibilities in a single translation unit: pad add/remove/iteration, the full state-change state machine (`gst_element_change_state_func`, `gst_element_set_state_func`, `gst_element_continue_state`, `gst_element_lost_state`), clock/base-time/start-time accessors, bus management, `GstContext` storage, error/warning/info message construction (`gst_element_message_full_with_details`), and property (deep-)notify watch plumbing. This breadth makes the file harder to navigate, review and test in isolation, and increases the chance that changes to one concern (e.g. context handling) accidentally affect unrelated code paths (e.g. the state machine) reviewed in the same diff."
locations   = ["subprojects/gstreamer/gst/gstelement.c:1-3857"]
fix         = "Consider splitting `gstelement.c` along its existing internal section boundaries (already delimited by comments/doc groups) into cohesively-scoped compilation units, e.g. pad management, state-change machinery, clock/context/bus accessors, and error/message helpers, keeping `GstElement` itself declared in one header as today. This is a larger refactor and should be scoped/agreed with maintainers before undertaking it, since it touches one of the most central files in the project."

[[finding]]
id          = "ARCH_3"
type        = "architecture"
severity    = "medium"
difficulty  = "medium"
description = "`gst_format_register` has a check-then-act race: it first calls `gst_format_get_by_nick (nick)` *without* holding `mutex`, and only takes `mutex` afterwards to insert the new `GstFormatDefinition`. If two threads call `gst_format_register` concurrently with the same new `nick`, both can see `GST_FORMAT_UNDEFINED` from the lookup and both proceed to allocate and insert a distinct `GstFormatDefinition` with the same `nick` but different `value`. Both entries remain reachable forever via `_format_to_nick` (keyed by their distinct `value`s) while `_nick_to_format` silently keeps only the last-inserted one, so `gst_format_get_by_nick` and `gst_format_get_details`/`gst_format_get_name` become inconsistent (two different `GstFormat` values report the same nick, and one of them is unreachable by nick lookup)."
locations   = ["subprojects/gstreamer/gst/gstformat.c:142-170"]
fix         = "Perform the existing-nick lookup under the same `mutex` used for insertion, e.g. move the `gst_format_get_by_nick` check inside the `g_mutex_lock (&mutex)` / `g_mutex_unlock (&mutex)` region (using an internal non-locking lookup helper) so the whole check-then-insert sequence is atomic."

[[finding]]
id          = "OTHER_1"
type        = "other"
severity    = "critical"
difficulty  = "hard"
description = "`gst_debug_add_ring_buffer_logger()` (`subprojects/gstreamer/gst/gstinfo.c:4674-4698`) holds `G_LOCK (ring_buffer_logger)` for the entire duration of the call, including the nested call to `gst_debug_add_log_function()`. `gst_debug_add_log_function()` (`gstinfo.c:2124-2144`) registers the new `gst_ring_buffer_logger_log` handler into `__log_functions` and then, if `gst_is_initialized()`, immediately emits `GST_DEBUG (\"prepended log function %p ...\", ...)`. If the `GST_DEBUG` internal category (`_GST_CAT_DEBUG`, aliased as `GST_CAT_DEFAULT` in this file, see line 702) has its threshold at `GST_LEVEL_DEBUG` or higher (e.g. any reasonably verbose `GST_DEBUG` environment setting, which is exactly the scenario a user reaches for a ring-buffer logger in), this `GST_DEBUG()` call flows through `gst_debug_log_full_valist()` and invokes every registered log function, including the `gst_ring_buffer_logger_log` handler that was just prepended. That handler immediately does `G_LOCK (ring_buffer_logger)` again (`gstinfo.c:4524`) on the very same thread that is still holding it from `gst_debug_add_ring_buffer_logger()`. Since `G_LOCK`/`GMutex` is not recursive, this is a guaranteed self-deadlock whenever debug logging for the `GST_DEBUG` category is enabled at the time `gst_debug_add_ring_buffer_logger()` is called."
locations   = ["subprojects/gstreamer/gst/gstinfo.c:4674-4698", "subprojects/gstreamer/gst/gstinfo.c:2124-2144", "subprojects/gstreamer/gst/gstinfo.c:4475-4590"]
fix         = "Do not hold `ring_buffer_logger`'s lock across the call into `gst_debug_add_log_function()`, or avoid emitting a `GST_DEBUG()` message from inside `gst_debug_add_log_function()` while any caller-supplied lock could be re-entered by the very handler being registered. For example, finish setting up `logger` fully, then release `G_LOCK (ring_buffer_logger)` *before* calling `gst_debug_add_log_function()`:\n```c\nlogger->max_size_per_thread = max_size_per_thread;\nlogger->thread_timeout = thread_timeout;\nlogger->thread_index = g_hash_table_new (g_direct_hash, g_direct_equal);\ng_queue_init (&logger->threads);\nG_UNLOCK (ring_buffer_logger);\n\ngst_debug_add_log_function (gst_ring_buffer_logger_log, logger,\n    (GDestroyNotify) gst_ring_buffer_logger_free);\nreturn;\n```\n(with the earlier `if (ring_buffer_logger) { ...; return; }` check still guarding re-entrant/duplicate setup). Alternatively, make `gst_ring_buffer_logger_log()` tolerate re-entrancy with a trylock, or drop the informational `GST_DEBUG()` call in `gst_debug_add_log_function()`."

[[finding]]
id          = "OTHER_2"
type        = "other"
severity    = "high"
difficulty  = "medium"
description = "In `ges_asset_set_id()` (`ges-asset.c`), `LOCK_CACHE` is taken and then `g_return_if_fail (g_hash_table_lookup_extended (entries, priv->id, &orig_id, (gpointer *) &entry));` is used to validate that the asset is present in the cache under its current id. `g_return_if_fail` triggers an immediate `return` (after logging a critical warning) if the condition is false, but that early return happens *before* the matching `UNLOCK_CACHE` call further down. Since `asset_cache_lock` is a process-wide `GRecMutex` guarding every `GESAsset` cache operation (`ges_asset_request`, `ges_asset_cache_put`, `ges_list_assets`, etc.), any call to `ges_asset_set_id()` that hits this failure path (e.g. if `entries` is `NULL` because the type has no cache table yet, or the asset was concurrently removed) permanently leaves the cache lock held, deadlocking all future asset operations on that thread and any other thread."
locations   = ["subprojects/gst-editing-services/ges/ges-asset.c:1265-1279"]
fix         = "Avoid using `g_return_if_fail` while the lock is held; unlock before bailing out, e.g.:\nBefore:\n```c\nLOCK_CACHE;\nentries = g_hash_table_lookup (_get_type_entries (),\n    _extractable_type_name (asset->priv->extractable_type));\n\ng_return_if_fail (g_hash_table_lookup_extended (entries, priv->id, &orig_id,\n        (gpointer *) & entry));\n```\nAfter:\n```c\nLOCK_CACHE;\nentries = g_hash_table_lookup (_get_type_entries (),\n    _extractable_type_name (asset->priv->extractable_type));\n\nif (!entries || !g_hash_table_lookup_extended (entries, priv->id, &orig_id,\n        (gpointer *) & entry)) {\n  UNLOCK_CACHE;\n  g_return_if_reached ();\n}\n```"

[[finding]]
id          = "OTHER_3"
type        = "other"
severity    = "high"
difficulty  = "medium"
description = "`gst_avtp_cvf_depay_validate_avtpdu()` only requires `map->size >= AVTP_CVF_H264_HEADER_SIZE` (`sizeof(struct avtp_stream_pdu) + sizeof(guint32)`), i.e. a packet containing zero bytes of actual H.264 payload after the 4-byte H.264 timestamp header is considered valid (the `STREAM_DATA_LEN` check `map->size < sizeof(*pdu) + val` also allows `val` as small as `0`). `gst_avtp_cvf_depay_process()` then unconditionally calls `gst_avtp_cvf_depay_get_nal_type(&map)`, which dereferences `pay->h264_data[0]` - a byte located exactly at offset `AVTP_CVF_H264_HEADER_SIZE`. When the mapped buffer size equals exactly `AVTP_CVF_H264_HEADER_SIZE`, this reads one byte past the end of the mapped `GstMemory`, an out-of-bounds heap read triggerable by a crafted/truncated AVTPDU received from the network via `avtpsrc`."
locations   = ["subprojects/gst-plugins-bad/ext/avtp/gstavtpcvfdepay.c:192-197", "subprojects/gst-plugins-bad/ext/avtp/gstavtpcvfdepay.c:285-298", "subprojects/gst-plugins-bad/ext/avtp/gstavtpcvfdepay.c:600"]
fix         = "Require at least one payload byte in `gst_avtp_cvf_depay_validate_avtpdu()`, e.g. change the size check to `if (G_UNLIKELY (map->size < AVTP_CVF_H264_HEADER_SIZE + 1))` (or equivalently validate that `STREAM_DATA_LEN` is large enough to include the NAL header byte, `val > sizeof(guint32)`), so `gst_avtp_cvf_depay_get_nal_type()` never reads `pay->h264_data[0]` past the mapped buffer."

[[finding]]
id          = "OTHER_4"
type        = "other"
severity    = "high"
difficulty  = "very_easy"
description = "`gst_curl_tls_sink_set_property` in `subprojects/gst-plugins-bad/ext/curl/gstcurltlssink.c` has an unbalanced `GST_OBJECT_LOCK`/`GST_OBJECT_UNLOCK` pair. When the element is NOT in `GST_STATE_PLAYING`/`GST_STATE_PAUSED`, the `if` branch correctly does `GST_OBJECT_LOCK (sink)` ... `GST_OBJECT_UNLOCK (sink)` ... `return`. But when the element IS in `GST_STATE_PLAYING` or `GST_STATE_PAUSED`, the `if` body is skipped entirely and control falls through directly to the final `GST_OBJECT_UNLOCK (sink);` at line 203, which unlocks the object lock without ever having acquired it in that code path. `GST_OBJECT_UNLOCK` wraps `g_mutex_unlock` (via `GRecMutex`/`GMutex` in `GstObject`), and unlocking a mutex the current thread does not hold is undefined behavior in GLib - this can trip a GLib critical assertion, corrupt the lock's owner/recursion state, or silently release a lock actually held by another thread, causing later race conditions/crashes whenever `curltlssink` properties are set while the pipeline is PLAYING or PAUSED."
locations   = ["subprojects/gst-plugins-bad/ext/curl/gstcurltlssink.c:160-204"]
fix         = "Remove the dangling unlock at the end of the function, mirroring the pattern used by `gst_curl_ssh_sink_set_property`: return early when the state check fails instead of falling through to `GST_OBJECT_UNLOCK`. For example:\nBefore:\n```c\n  if (cur_state != GST_STATE_PLAYING && cur_state != GST_STATE_PAUSED) {\n    GST_OBJECT_LOCK (sink);\n    switch (prop_id) { ... }\n    GST_OBJECT_UNLOCK (sink);\n    return;\n  }\n\n  GST_OBJECT_UNLOCK (sink);\n}\n```\nAfter:\n```c\n  if (cur_state == GST_STATE_PLAYING || cur_state == GST_STATE_PAUSED) {\n    GST_WARNING_OBJECT (sink, \"cannot set property when PLAYING or PAUSED\");\n    return;\n  }\n\n  GST_OBJECT_LOCK (sink);\n  switch (prop_id) { ... }\n  GST_OBJECT_UNLOCK (sink);\n}\n```"

[[finding]]
id          = "OTHER_5"
type        = "other"
severity    = "high"
difficulty  = "very_easy"
description = "`try_parse_number` in `gstlcevcencoder.c` is supposed to skip trailing whitespace after the parsed number by advancing `endptr`, but the loop body increments `value` instead of `endptr`: `while (g_ascii_isspace (*endptr)) value++;`. Since `endptr` (the pointer actually being dereferenced in the loop condition) never advances, the loop never terminates once a trailing space is encountered, hanging the streaming thread forever. This is reachable from `build_json_props`, which is called from `gst_lcevc_encoder_set_format` while parsing the user-supplied `plugin-props` property for any key whose value is not found in `priv->plugin_props_spec` and has a trailing space before the next `;` or the end of string (e.g. `plugin-props=\"foo=123 ;bar=1\"`)."
locations   = ["subprojects/gst-plugins-bad/ext/lcevcencoder/gstlcevcencoder.c:402-404"]
fix         = "Advance `endptr`, not `value`: `while (g_ascii_isspace (*endptr)) endptr++;`"

[[finding]]
id          = "OTHER_6"
type        = "other"
severity    = "high"
difficulty  = "hard"
description = "There is a lock-order inversion (ABBA deadlock potential) between `_gst_log_context_cleanup()` and `_fetch_or_register_once_log_context()`. `_gst_log_context_cleanup()` (`subprojects/gstreamer/gst/gstinfo.c:3376-3398`, called from `_priv_gst_debug_cleanup()`) locks `_log_contexts_registry_lock` first, then `_once_log_contexts_registry_lock`. `_fetch_or_register_once_log_context()` (`gstinfo.c:2943-2967`, invoked by any first hit of a `GST_*_ONCE`-style debug macro) locks `_once_log_contexts_registry_lock` first, then calls `gst_log_context_builder_build()` (`gstinfo.c:3079-3099`), which calls `_register_log_context()` (`gstinfo.c:2929-2941`) and locks `_log_contexts_registry_lock` while still holding `_once_log_contexts_registry_lock`. If one thread is tearing down GStreamer (calling `gst_deinit()`) while another thread hits a `GST_*_ONCE` log statement for the first time for some category, the two threads can deadlock against each other."
locations   = ["subprojects/gstreamer/gst/gstinfo.c:3376-3398", "subprojects/gstreamer/gst/gstinfo.c:2943-2967", "subprojects/gstreamer/gst/gstinfo.c:2929-2941", "subprojects/gstreamer/gst/gstinfo.c:3079-3099"]
fix         = "Acquire the two registry locks in a consistent global order in both places (e.g. always `_log_contexts_registry_lock` before `_once_log_contexts_registry_lock`), or restructure `_fetch_or_register_once_log_context()` to build the context and register it in `_log_contexts_registry` before taking `_once_log_contexts_registry_lock`, so the two locks are never nested in opposite order."

[[finding]]
id          = "OTHER_7"
type        = "other"
severity    = "medium"
difficulty  = "medium"
description = "`monitor->got_error` is written from two different bus-message handlers with inconsistent locking. In the `GST_MESSAGE_ERROR` case it is correctly set under `GST_VALIDATE_MONITOR_LOCK`/`UNLOCK`: `GST_VALIDATE_MONITOR_LOCK (monitor); monitor->got_error = TRUE; GST_VALIDATE_MONITOR_UNLOCK (monitor);`. In the `GST_MESSAGE_STATE_CHANGED` case the same field is set to `FALSE` with no lock at all: `monitor->got_error = FALSE;`. Because `_bus_handler()` is invoked synchronously via `gst_bus_enable_sync_message_emission()`, it can run concurrently on whatever thread posted the message (e.g. a streaming thread posting `ERROR` and the thread driving a state change), so this is a genuine unsynchronized read/write race on the same field."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-pipeline-monitor.c:598-630", "subprojects/gst-devtools/validate/gst/validate/gst-validate-pipeline-monitor.c:654-659"]
fix         = "Wrap the `GST_MESSAGE_STATE_CHANGED` write in the same lock used for the `GST_MESSAGE_ERROR` case, e.g. `GST_VALIDATE_MONITOR_LOCK (monitor); monitor->got_error = FALSE; GST_VALIDATE_MONITOR_UNLOCK (monitor);` instead of the unguarded `monitor->got_error = FALSE;`."

[[finding]]
id          = "OTHER_8"
type        = "other"
severity    = "medium"
difficulty  = "medium"
description = "`runner->priv->expected_issues` is mutated from two different code paths without any common synchronization. `check_report_expected()` (called from `gst_validate_runner_add_report()`, itself reachable from arbitrary streaming/reporter threads any time `GST_VALIDATE_REPORT()` is used) reads the list and, on a match, calls `g_list_remove()` on `runner->priv->expected_issues` with no lock held at all. `gst_validate_runner_exit()` later iterates and eventually frees the very same list (`g_list_free_full`) also without taking `GST_VALIDATE_RUNNER_LOCK`. All other shared runner state (`priv->reports`, `priv->reports_by_type`) is consistently protected with `GST_VALIDATE_RUNNER_LOCK`/`UNLOCK` in this file, but `expected_issues` is not, so a report arriving concurrently with (or racing) `gst_validate_runner_exit()` can corrupt the list or free a node that is being traversed/removed by the other thread."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-runner.c:648-692", "subprojects/gst-devtools/validate/gst/validate/gst-validate-runner.c:943-993"]
fix         = "Protect all accesses to `runner->priv->expected_issues` with `GST_VALIDATE_RUNNER_LOCK`/`GST_VALIDATE_RUNNER_UNLOCK`, the same mutex already used for `priv->reports` and `priv->reports_by_type`, both inside `check_report_expected()` and in the iteration/free loop in `gst_validate_runner_exit()`."

[[finding]]
id          = "OTHER_9"
type        = "other"
severity    = "medium"
difficulty  = "medium"
description = "In `GstValidateListener.handle()`, after reading the 4-byte length prefix, the code loops `while msglen != len(raw_msg): raw_msg += self.request.recv(msglen - len(raw_msg))`. Unlike the length-prefix read just above it (which explicitly checks `if raw_len == b'': return`), this inner loop never checks for a `recv()` returning `b''` (peer closed the connection mid-message). If the remote side (the `gst-validate` subprocess under test) closes or crashes after sending the length header but before sending the full payload, `recv()` keeps returning `b''` forever and this becomes a tight infinite busy-loop in the TCP server thread, consuming a full CPU core and never completing `handle()`."
locations   = ["subprojects/gst-devtools/validate/launcher/baseclasses.py:864-866"]
fix         = "Detect connection close inside the loop and bail out, e.g.:\n```python\nwhile msglen != len(raw_msg):\n    chunk = self.request.recv(msglen - len(raw_msg))\n    if chunk == b'':\n        return\n    raw_msg += chunk\n```"

[[finding]]
id          = "OTHER_10"
type        = "other"
severity    = "medium"
difficulty  = "hard"
description = "`GstAvtpCrfThreadData` fields written by the background `crf_listener_thread_func` / `calculate_average_period` (`current_ts`, `average_period`, `mr`, `num_pkt_tstamps`, etc., see `gstavtpcrfbase.h`) are plain, unsynchronized struct members with no `GMutex` or atomics anywhere in `gstavtpcrfbase.c`/`.h`. They are read directly from a different thread (the streaming thread) via `thread_data->average_period` / `thread_data->current_ts` in `gstavtpcrfsync.c` and `gstavtpcrfcheck.c`. This is a data race: concurrent unsynchronized read/write of multi-word values (`gdouble`, 64-bit `guint64`/`GstClockTime`) is undefined behaviour in C and can yield torn/inconsistent values on the reader side, corrupting CRF-based clock synchronization/validation."
locations   = ["subprojects/gst-plugins-bad/ext/avtp/gstavtpcrfbase.c:420-537", "subprojects/gst-plugins-bad/ext/avtp/gstavtpcrfbase.h:42-65"]
fix         = "Add a `GMutex` to `GstAvtpCrfThreadData` (or `GstAvtpCrfBase`), take it in `crf_listener_thread_func`/`calculate_average_period` around writes to `current_ts`, `average_period`, and `mr`, and have `gstavtpcrfsync.c`/`gstavtpcrfcheck.c` take the same lock (or use a small accessor function that copies the fields out under the lock) instead of dereferencing `thread_data->average_period`/`thread_data->current_ts` directly."

[[finding]]
id          = "OTHER_11"
type        = "other"
severity    = "medium"
difficulty  = "medium"
description = "Several `gchar*` fields of the MPD node GObjects are populated directly from XML attribute parsing via `gst_xml_helper_get_prop_string`/`gst_xml_helper_get_prop_string_no_whitespace` in `gstmpdparser.c`, which internally call `xmlGetProp()` and hand back memory owned by `libxml2` (must be released with `xmlFree`). However, the corresponding `finalize()` (and, for some fields, the GObject `set_property()`) implementations release that same pointer with `g_free()` instead of `xmlFree()`. Concretely: `GstMPDRepresentationBaseNode::profiles/audioSamplingRate/mimeType/segmentProfiles/codecs/scanType` are populated in `gst_mpdparser_parse_representation_base()` (`gstmpdparser.c:523-552`) via `gst_xml_helper_get_prop_string`, but released with `g_free` in `gst_mpd_representation_base_node_finalize()` (`gstmpdrepresentationbasenode.c:193,198-202`) and in `gst_mpd_representation_base_node_set_property()` (`gstmpdrepresentationbasenode.c:58,87,92,96,100,116`). Likewise `GstMPDRepresentationNode::id` is set from `gst_xml_helper_get_prop_string_no_whitespace()` (`gstmpdparser.c:584-588`) but freed with `g_free` (`gstmpdrepresentationnode.c:44,85`), and `GstMPDPeriodNode::id` is set via `gst_xml_helper_get_prop_string()` (`gstmpdparser.c:849`) but freed with `g_free` (`gstmpdperiodnode.c:44,91`). Mixing `xmlMalloc`/`xmlFree` with `g_malloc`/`g_free` is undefined behaviour per each library's API contract; it happens to work only because both currently default to the system `malloc`/`free`, but breaks (heap corruption / crash) whenever libxml2 uses a custom allocator (`xmlMemSetup`), a memory-debugging build, or when the two libraries come from separate CRT heaps (e.g. mixed static/dynamic libxml2 builds on Windows). Other fields in the same files that are never exposed as GObject properties (e.g. `GstMPDContentComponentNode::lang/contentType`, `GstMPDProgramInformationNode::lang/Title/...`) correctly use `xmlFree`, confirming this is an oversight rather than an intentional convention."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstmpdrepresentationbasenode.c:193-202", "subprojects/gst-plugins-bad/ext/dash/gstmpdrepresentationbasenode.c:58-118", "subprojects/gst-plugins-bad/ext/dash/gstmpdrepresentationnode.c:44-45", "subprojects/gst-plugins-bad/ext/dash/gstmpdrepresentationnode.c:85", "subprojects/gst-plugins-bad/ext/dash/gstmpdperiodnode.c:44-45", "subprojects/gst-plugins-bad/ext/dash/gstmpdperiodnode.c:91", "subprojects/gst-plugins-bad/ext/dash/gstmpdparser.c:523-552", "subprojects/gst-plugins-bad/ext/dash/gstmpdparser.c:584-588", "subprojects/gst-plugins-bad/ext/dash/gstmpdparser.c:849"]
fix         = "Either (a) change every `finalize()`/`set_property()` that can hold a value produced by `gst_xml_helper_get_prop_string*()` to release it with `xmlFree()` instead of `g_free()` (and stop using `g_value_dup_string()`/`g_free()` for those same fields in the property setters, switching them to `xmlStrdup`/`xmlFree` as well), or (b) make `gst_xml_helper_get_prop_string*()` immediately convert the result to a GLib-owned string, e.g. replace `*property_value = (gchar *) prop_string;` in `gst_xml_helper_get_prop_validated_string()` (`gstxmlhelper.c:348`) with `*property_value = g_strdup ((gchar *) prop_string); xmlFree (prop_string);`, so every consumer can safely use `g_free()` uniformly."

[[finding]]
id          = "OTHER_12"
type        = "other"
severity    = "medium"
difficulty  = "very_easy"
description = "`gst_lcevc_decode_bin_handle_message` in `gstlcevcdecodebin.c` intercepts `GST_MESSAGE_LATENCY`, unrefs the original message, allocates a replacement with `gst_message_new_latency (GST_OBJECT (bin))`, and then immediately `return`s instead of falling through to post it. The newly created `GstMessage` is never posted (via the chained `GST_BIN_CLASS (parent_class)->handle_message`) nor unreffed, so every latency message is silently dropped (defeating the comment's stated purpose of fixing decodebin3 autoplugging) and the replacement message object leaks."
locations   = ["subprojects/gst-plugins-bad/ext/lcevcdecoder/gstlcevcdecodebin.c:320-334"]
fix         = "Use `break;` instead of `return;` so the new message falls through to the code below that calls `GST_BIN_CLASS (parent_class)->handle_message (bin, message);`, e.g.: `case GST_MESSAGE_LATENCY: gst_message_unref (message); message = gst_message_new_latency (GST_OBJECT (bin)); break;`"

[[finding]]
id          = "OTHER_13"
type        = "other"
severity    = "medium"
difficulty  = "medium"
description = "`alsa->pos_in_buffer`, `alsa->is_paused` and `alsa->after_paused` are written in `gst_alsasink_pause` while holding only `GST_ALSA_SINK_LOCK` (`alsa_lock`), but read/written in `gst_alsasink_delay` while holding only `GST_DELAY_SINK_LOCK` (`delay_lock`). Since these are two different mutexes protecting the same fields, concurrent calls to `gst_alsasink_pause`/`resume` (from the state-change/streaming thread) and `gst_alsasink_delay` (called from the audio ring buffer/clocking thread) race on these fields without synchronization."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsasink.c:1252-1285", "subprojects/gst-plugins-base/ext/alsa/gstalsasink.c:1215-1250"]
fix         = "Protect `pos_in_buffer`/`is_paused`/`after_paused` with a single consistent lock (e.g. also take `GST_DELAY_SINK_LOCK` in `gst_alsasink_pause`/`gst_alsasink_resume` around the field updates), or move them under `alsa_lock` everywhere."

[[finding]]
id          = "OTHER_14"
type        = "other"
severity    = "medium"
difficulty  = "hard"
description = "`gst_clock_adjust_unlocked` is documented as requiring the clock's `GST_OBJECT_LOCK` to be held by the caller (\"This function should be called with the clock's OBJECT_LOCK held\"), and it mutates the shared field `priv->last_time` via `priv->last_time = MAX (ret, priv->last_time);`. However `gst_clock_get_time` calls it without holding `GST_OBJECT_LOCK` at all - it only wraps the call in the lock-free seqlock retry loop (`read_seqbegin`/`read_seqretry`), which only guards the calibration fields (`internal_calibration`, `external_calibration`, `rate_numerator`, `rate_denominator`) read inside `gst_clock_adjust_with_calibration`. Multiple threads calling `gst_clock_get_time` concurrently can therefore race on the non-atomic read-modify-write of `priv->last_time`, which is undefined behavior in C and can produce torn reads/writes or a spurious backwards jump being briefly visible."
locations   = ["subprojects/gstreamer/gst/gstclock.c:955-975", "subprojects/gstreamer/gst/gstclock.c:1112-1134"]
fix         = "Either update the documented contract of `gst_clock_adjust_unlocked` to state that `last_time` is only monotonically clamped best-effort and races are acceptable, or make the update of `priv->last_time` atomic (e.g. with a CAS loop via `g_atomic_pointer_compare_and_exchange`/`g_atomic_int64_...` primitives on a 64-bit aligned field) so `gst_clock_get_time` can safely call it without `GST_OBJECT_LOCK`."

[[finding]]
id          = "OTHER_15"
type        = "other"
severity    = "medium"
difficulty  = "hard"
description = "In `gst_ghost_pad_dispose`, the code clears the reverse-link field on the *internal* pad with `GST_PROXY_PAD_INTERNAL (internal) = NULL;` while holding only `GST_OBJECT_LOCK (pad)` (the ghost pad's own lock), never `GST_OBJECT_LOCK (internal)`. Elsewhere (`gst_proxy_pad_get_internal`, and therefore `GST_PROXY_PAD_ACQUIRE_INTERNAL` used by `gst_proxy_pad_chain_default`, `gst_proxy_pad_chain_list_default`, `gst_proxy_pad_getrange_default`, `gst_ghost_pad_internal_activate_push_default`, etc.) that same field is always read under `GST_OBJECT_LOCK` of `internal` itself. Because the internal pad can be reached independently of the ghost pad (its peer is the target pad inside the bin, so another thread can hold a ref on `internal` via `gst_pad_get_peer(target)` without holding any ref on the ghost pad), a concurrent chain/getrange call on `internal` while the ghost pad is disposing can read/write `internal->priv->internal` under a different lock than the writer in `dispose()`, which is a data race on that field."
locations   = ["subprojects/gstreamer/gst/gstghostpad.c:466-507"]
fix         = "Take `GST_OBJECT_LOCK (internal)` (in addition to / instead of relying solely on `GST_OBJECT_LOCK (pad)`) when clearing `GST_PROXY_PAD_INTERNAL (internal)` in `gst_ghost_pad_dispose`, matching the locking discipline used by readers such as `gst_proxy_pad_get_internal`."

[[finding]]
id          = "OTHER_16"
type        = "other"
severity    = "low"
difficulty  = "very_easy"
description = "`StateItem.get` in `subprojects/gst-devtools/debug-viewer/GstDebugViewer/Common/GUI.py` calls `SectionString.get(self, section)`, but no class named `SectionString` is defined or imported anywhere in the codebase (the class is actually called `StateString`, which `StateItem` inherits from). Any code path that reaches `StateItem.get` (either by directly instantiating `StateItem`, or by a future subclass calling `StateItem.get` via `super()`) will raise `NameError: name 'SectionString' is not defined` instead of returning the stored value. Currently this method is unreachable in practice because the only subclass in use, `StateItemList`, overrides `get()` itself, but the bug is a live landmine for any direct use of `StateItem` or future refactors."
locations   = ["subprojects/gst-devtools/debug-viewer/GstDebugViewer/Common/GUI.py:356-363"]
fix         = "Replace the undefined `SectionString` reference with `StateString`, e.g. change `value = SectionString.get(self, section)` to `value = StateString.get(self, section)` in `StateItem.get`."

[[finding]]
id          = "OTHER_17"
type        = "other"
severity    = "low"
difficulty  = "medium"
description = "In `ges_video_uri_source_create_filters()`, `guint i;` is left uninitialized and only conditionally set by `g_ptr_array_find_with_equal_func (elements, NULL, (GEqualFunc) _find_positioner, &i)`, whose documented contract is that `i` is left undefined when the needle is not found (return value `FALSE`). The return value is not checked, so if no `framepositioner` element is present in `elements` (e.g. a future subclass path where the base `create_filters` didn't add one), `i` is used uninitialized as the insertion index for `g_ptr_array_insert (elements, i, gst_element_factory_make (\"imagefreeze\", NULL))`, which can write far out of bounds of the internal array."
locations   = ["subprojects/gst-editing-services/ges/ges-video-uri-source.c:237-246"]
fix         = "Initialize `i` and check the search result before using it, e.g.:\nbefore:\n```\n  if (ges_uri_source_asset_is_image (GES_URI_SOURCE_ASSET (asset))) {\n    guint i;\n\n    g_ptr_array_find_with_equal_func (elements, NULL,\n        (GEqualFunc) _find_positioner, &i);\n    g_ptr_array_insert (elements, i,\n        gst_element_factory_make (\"imagefreeze\", NULL));\n  }\n```\nafter:\n```\n  if (ges_uri_source_asset_is_image (GES_URI_SOURCE_ASSET (asset))) {\n    guint i = elements->len;\n\n    if (g_ptr_array_find_with_equal_func (elements, NULL,\n            (GEqualFunc) _find_positioner, &i))\n      g_ptr_array_insert (elements, i,\n          gst_element_factory_make (\"imagefreeze\", NULL));\n  }\n```"

[[finding]]
id          = "OTHER_18"
type        = "other"
severity    = "low"
difficulty  = "easy"
description = "In `ges_init_check` (subprojects/gst-editing-services/ges/ges.c), the local variable `gboolean res;` is declared without an initializer. It is only assigned inside the `#ifndef GST_DISABLE_OPTION_PARSING` block via `res = g_option_context_parse (...)`. When GES is built with `GST_DISABLE_OPTION_PARSING` defined, that whole block (including the assignment to `res`) is compiled out, but the subsequent `if (!res) { ... return res; }` still reads `res`, which is uninitialized - undefined behavior that can make `ges_init_check` spuriously fail or succeed."
locations   = ["subprojects/gst-editing-services/ges/ges.c:375-412"]
fix         = "Give `res` a safe default so it is well-defined when option parsing is disabled:\nBefore:\n```c\n  gboolean res;\n\n  G_LOCK (init_lock);\n```\nAfter:\n```c\n  gboolean res = TRUE;\n\n  G_LOCK (init_lock);\n```"

[[finding]]
id          = "OTHER_19"
type        = "other"
severity    = "low"
difficulty  = "very_easy"
description = "`subprojects/gst-plugins-bad/ext/qroverlay/gstqroverlay.h` and `subprojects/gst-plugins-bad/ext/qroverlay/gstqroverlayelements.h` both use the identical include guard macro `__GST_QR_OVERLAY_H__` while being two distinct headers with (currently) duplicated `G_DECLARE_FINAL_TYPE (GstQROverlay, ...)` content. `gstqroverlay.c` includes `gstqroverlayelements.h` first and then `gstqroverlay.h`; because the guard from the first header is already defined, the entire body of `gstqroverlay.h` is skipped by the preprocessor. This currently causes no build failure only because the two files' contents happen to be identical, but it is a latent landmine: any future edit that adds qroverlay-specific declarations to `gstqroverlay.h` will silently never be compiled in translation units that include `gstqroverlayelements.h` first."
locations   = ["subprojects/gst-plugins-bad/ext/qroverlay/gstqroverlay.h:22-23", "subprojects/gst-plugins-bad/ext/qroverlay/gstqroverlayelements.h:22-23"]
fix         = "Give `gstqroverlay.h` its own unique include guard:\nBefore:\n```c\n#ifndef __GST_QR_OVERLAY_H__\n#define __GST_QR_OVERLAY_H__\n```\nAfter:\n```c\n#ifndef __GST_QR_OVERLAY_ELEMENT_H__\n#define __GST_QR_OVERLAY_ELEMENT_H__\n```\n(and update the matching `#endif /* __GST_QR_OVERLAY_H__ */` comment accordingly)."

[[finding]]
id          = "OTHER_20"
type        = "other"
severity    = "low"
difficulty  = "easy"
description = "`gst_gl_effects_glow` lazily initializes its Gaussian kernel using a plain file-static `gboolean kernel_ready` flag and `static float gauss_kernel[7]` with no synchronization: `if (!kernel_ready) { fill_gaussian_kernel (gauss_kernel, 7, 10.0); kernel_ready = TRUE; }`. This is a data race if two `gleffects` elements running the glow effect on different streaming threads call this concurrently. The equivalent lazy-init in `gst_gl_effects_blur_kernel` (same file family) correctly uses a `GOnce` to make the one-time initialization thread-safe."
locations   = ["subprojects/gst-plugins-base/ext/gl/effects/gstgleffectglow.c:26-39", "subprojects/gst-plugins-base/ext/gl/effects/gstgleffectblur.c:28-46"]
fix         = "Use the same `GOnce`-based pattern as `gstgleffectblur.c`: ```c\nstatic gpointer\ninit_glow_kernel (gpointer data)\n{\n  float *kernel = g_malloc (sizeof (gfloat) * 7);\n  fill_gaussian_kernel (kernel, 7, 10.0);\n  return kernel;\n}\n\nstatic const float *\ngst_gl_effects_glow_kernel (void)\n{\n  static GOnce once = G_ONCE_INIT;\n  g_once (&once, init_glow_kernel, NULL);\n  return once.retval;\n}\n```"

[[finding]]
id          = "OTHER_21"
type        = "other"
severity    = "low"
difficulty  = "hard"
description = "`bin->priv->posted_eos` is accessed with two different synchronization strategies: it is read/written with plain (non-atomic) assignment while holding `GST_OBJECT_LOCK` in `gst_bin_change_state_func` (`bin->priv->posted_eos = FALSE;`) and again in `bin_do_eos` (`bin->priv->posted_eos = FALSE;`), but it is also read-and-cleared with `g_atomic_int_compare_and_exchange (&bin->priv->posted_eos, FALSE, TRUE)` in `bin_do_eos` *without* holding `GST_OBJECT_LOCK`. Mixing a lock-protected plain store with a lock-free atomic compare-and-exchange on the same field from different threads is not a safe synchronization pattern: the plain store is not guaranteed to be visible/ordered correctly with respect to the atomic op on all platforms/compilers, so a concurrent state-change thread and an EOS-message-handling thread could race on this flag."
locations   = ["subprojects/gstreamer/gst/gstbin.c:2863", "subprojects/gstreamer/gst/gstbin.c:3516-3517", "subprojects/gstreamer/gst/gstbin.c:3526"]
fix         = "Access `posted_eos` consistently through one mechanism. Either protect every read/write of `posted_eos` (including the check-and-clear in `bin_do_eos`) with `GST_OBJECT_LOCK`/`GST_OBJECT_UNLOCK`, or switch every access site (`gst_bin_change_state_func` and both places in `bin_do_eos`) to use `g_atomic_int_set`/`g_atomic_int_get`/`g_atomic_int_compare_and_exchange` so all readers and writers agree on the synchronization model."

[[finding]]
id          = "OTHER_22"
type        = "other"
severity    = "low"
difficulty  = "easy"
description = "`GST_CONTROL_SOURCE_GET_CLASS` in `gstcontrolsource.h` and `GST_CONTROL_BINDING_GET_CLASS` in `gstcontrolbinding.h` both pass `GST_TYPE_CONTOL_SOURCE` (missing the letter `R`, i.e. not `GST_TYPE_CONTROL_SOURCE`) to `G_TYPE_INSTANCE_GET_CLASS`. This identifier is never defined anywhere in the codebase. It also happens to be semantically wrong for `GST_CONTROL_BINDING_GET_CLASS`, which should reference `GST_TYPE_CONTROL_BINDING`, not a control-source type at all. This currently compiles without error only because `G_TYPE_INSTANCE_GET_CLASS`'s expansion does not actually evaluate its `g_type` argument (it is a plain pointer cast, unlike the `_CAST`/`_TYPE` macros which do call `g_type_check_*`), so the bogus token is silently discarded by the preprocessor/compiler. The same typo is also copy-pasted into `gstargbcontrolbinding.h`, `gstdirectcontrolbinding.h`, and `gstproxycontrolbinding.h` (outside the audited file set)."
locations   = ["subprojects/gstreamer/gst/gstcontrolsource.h:44-45", "subprojects/gstreamer/gst/gstcontrolbinding.h:42-43"]
fix         = "Fix the typo and use the correct type macro for each: `GST_CONTROL_SOURCE_GET_CLASS` should use `GST_TYPE_CONTROL_SOURCE`, and `GST_CONTROL_BINDING_GET_CLASS` should use `GST_TYPE_CONTROL_BINDING`:\n```c\n#define GST_CONTROL_SOURCE_GET_CLASS(obj) \\\n  (G_TYPE_INSTANCE_GET_CLASS ((obj), GST_TYPE_CONTROL_SOURCE, GstControlSourceClass))\n\n#define GST_CONTROL_BINDING_GET_CLASS(obj) \\\n  (G_TYPE_INSTANCE_GET_CLASS ((obj), GST_TYPE_CONTROL_BINDING, GstControlBindingClass))\n```"

[[finding]]
id          = "OTHER_23"
type        = "other"
severity    = "negligible"
difficulty  = "very_easy"
description = "Typo in the debug/warning strings emitted from `gst_bin_sort_iterator_next`: `\"loop dected in graph\"` should read `\"loop detected in graph\"`. The accompanying `g_warning` uses the correctly spelled `\"loop detected in the graph of bin '%s'!!\"`, making the inconsistency obvious."
locations   = ["subprojects/gstreamer/gst/gstbin.c:2332"]
fix         = "Fix the typo: change `GST_WARNING_OBJECT (bin, \"loop dected in graph\");` to `GST_WARNING_OBJECT (bin, \"loop detected in graph\");`."
