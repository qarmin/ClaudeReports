[[finding]]
id          = "DEAD_8"
type        = "dead_code"
severity    = "low"
difficulty  = "medium"
description = "`gstcontrolsource.h` declares `typedef struct _GstValueArray GstValueArray;` and then does `G_DEFINE_AUTOPTR_CLEANUP_FUNC(GstValueArray, gst_object_unref)`. `GstValueArray` is never actually defined as a struct anywhere in the tree (`struct _GstValueArray` has no definition), no function in the public API returns, creates, or refcounts a `GstValueArray` instance, and it is not a `GstObject` subtype. The only other occurrences of the name `GstValueArray` in the codebase (`gstvalue.c`/`gstvalue.h`) refer to an unrelated `GValue`-boxed array concept documented in comments, not this incomplete C type. The `g_autoptr` cleanup declaration is therefore dead/vestigial code that can never be meaningfully used."
locations   = ["subprojects/gstreamer/gst/gstcontrolsource.h:50", "subprojects/gstreamer/gst/gstcontrolsource.h:143"]
fix         = "Remove the unused `GstValueArray` typedef and its `G_DEFINE_AUTOPTR_CLEANUP_FUNC(GstValueArray, gst_object_unref)` declaration from `gstcontrolsource.h`, or if a real `GstValueArray` type was intended, actually define and implement it."

