description = "`gstglbumper.c` (the `glbumper` element source) is not part of the build: `subprojects/gst-plugins-base/ext/gl/meson.build`'s `opengl_sources` list never includes `gstglbumper.c` (only `gstglbumper.h` is listed, and only in `opengl_headers` for documentation generation). The element is therefore never compiled or registered, even though `GST_ELEMENT_REGISTER_DEFINE_WITH_CODE (glbumper, ...)` is present in the file, and it still depends on and links against `libpng` conceptually. All bugs found inside this file are currently unreachable in the shipped binary."
