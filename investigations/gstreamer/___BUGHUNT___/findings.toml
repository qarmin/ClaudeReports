[[finding]]
id          = "ERR_24"
type        = "incorrect_error_handling"
severity    = "medium"
difficulty  = "very_easy"
description = "`gst_gl_color_convert_element_get_unit_size` always returns `TRUE` regardless of whether `gst_video_info_from_caps (&info, caps)` succeeded: `ret` is computed and used only to decide whether to write `*size`, but the function unconditionally `return TRUE;`. If the caps cannot be parsed into a `GstVideoInfo`, `*size` is left unset while the caller (`GstBaseTransform`) is told the call succeeded, so it will use an uninitialized `gsize` value for buffer-size decisions."
