difficulty  = "very_easy"
description = "In `gst_object_detection_overlay_transform_frame_ip()`, the return value of `gst_buffer_map (buffer, &map, GST_MAP_READWRITE);` is discarded; if mapping the freshly allocated `buffer` were to fail, the subsequent `memset (map.data, 0, overlay->render_len);` would dereference an uninitialized/`NULL` `map.data`."
