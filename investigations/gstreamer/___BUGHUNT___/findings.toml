[[finding]]
id          = "DEAD_5"
type        = "dead_code"
severity    = "low"
difficulty  = "easy"
description = "`gstglfilterreflectedscreen.c` (the `glfilterreflectedscreen` element implementation) is never added to `opengl_sources` in `ext/gl/meson.build`; only its header `gstglfilterreflectedscreen.h` appears in `opengl_headers`. As a result the `.c` file is never compiled into the `opengl` plugin, even though `gstglelements.h` still declares `GST_ELEMENT_REGISTER_DECLARE (glfilterreflectedscreen)`. Being excluded from the build also means the file receives no compiler diagnostics and no CI coverage, which is presumably how the `filter_texture` signature bug in the same file (reported separately) has gone unnoticed."
