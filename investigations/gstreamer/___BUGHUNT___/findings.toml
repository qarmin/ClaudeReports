type        = "dead_code"
severity    = "low"
difficulty  = "very_easy"
description = "Several `#if 0`-guarded code blocks related to the removed `GstIndex` API are still present in `gstbin.c`: the `index` field in `struct _GstBinPrivate`, the forward declarations of `gst_bin_set_index_func`/`gst_bin_get_index_func`, the vmethod hookup of `gstelement_class->get_index`/`set_index`, the full bodies of `gst_bin_get_index_func`/`gst_bin_set_index_func`, and the index-propagation snippet inside `gst_bin_add_func`. `GstIndex` was removed from the public API long ago, so none of this code is reachable or ever compiled."
