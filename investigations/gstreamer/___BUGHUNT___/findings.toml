[[finding]]
id          = "MEM_66"
type        = "memory_leak"
severity    = "low"
difficulty  = "easy"
description = "Several shader-compilation error paths obtain a `GError` and only read `error->message` for a `GST_ELEMENT_ERROR`/log message, without ever calling `g_clear_error()`/`g_error_free()`, leaking the `GError` each time shader creation fails: `gst_gl_filter_app_gl_start()` leaks the `error` from `gst_gl_shader_new_default()`, and `_maybe_recompile_shader()` in `gstglfiltershader.c` leaks the `error` set by `gst_glsl_stage_new_with_string()`/`gst_gl_shader_compile_attach_stage()`/`gst_gl_shader_link()` at its `print_error` label."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglfilterapp.c:153-167", "subprojects/gst-plugins-base/ext/gl/gstglfiltershader.c:511-521"]
fix         = "Free the error after using its message, e.g. in `gstglfilterapp.c`:\n```c\n  if (!(filter->default_shader =\n          gst_gl_shader_new_default (base_filter->context, &error))) {\n    GST_ELEMENT_ERROR (filter, RESOURCE, NOT_FOUND, (\"%s\",\n            \"Failed to create the default shader\"), (\"%s\", error->message));\n    g_clear_error (&error);\n    return FALSE;\n  }\n```\nand similarly call `g_clear_error (&error);` right after the `GST_ELEMENT_ERROR` call at the `print_error:` label in `gstglfiltershader.c`."

[[finding]]
id          = "MEM_67"
type        = "memory_leak"
severity    = "low"
difficulty  = "easy"
description = "In `stereosplit_sink_query`'s `GST_QUERY_CAPS` handling, `left` is obtained via `gst_pad_peer_query_caps (split->left_pad, NULL)` and, if that succeeds, `right` is obtained via `gst_pad_peer_query_caps (split->right_pad, NULL)`. If the second call fails (returns `NULL`), the function immediately does `return FALSE;` without unreffing the already-allocated `left` caps, leaking a `GstCaps` reference every time the right pad's peer caps query fails while the left pad's succeeds."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglstereosplit.c:804-807"]
fix         = "Unref `left` before bailing out:\n\n```c\nif (!(left = gst_pad_peer_query_caps (split->left_pad, NULL)))\n  return FALSE;\nif (!(right = gst_pad_peer_query_caps (split->right_pad, NULL))) {\n  gst_caps_unref (left);\n  return FALSE;\n}\n```"

[[finding]]
id          = "MEM_68"
type        = "memory_leak"
severity    = "low"
difficulty  = "medium"
description = "`init_post()` in `gst.c` takes a persistent type-class reference on `gst_clock_get_type ()` (line 687) and `gst_task_pool_get_type ()` (line 747) via `g_type_class_ref`, exactly like dozens of other GStreamer types. However `gst_deinit()` never calls the matching `g_type_class_unref (g_type_class_peek (...))` for these two types (verified by diffing every `g_type_class_ref` call in `init_post` against every `g_type_class_unref`/`g_type_class_peek` call in `gst_deinit` - `gst_clock` and `gst_task_pool` are the only two types referenced but never unreferenced). Every other registered type in this file is symmetrically ref'd/unref'd, so this looks like an oversight rather than an intentional permanent reference, leaking a `GObjectClass` structure on each `gst_init()`/`gst_deinit()` cycle (relevant for tests/tools that repeatedly init/deinit GStreamer to check for leaks)."
locations   = ["subprojects/gstreamer/gst/gst.c:687", "subprojects/gstreamer/gst/gst.c:747", "subprojects/gstreamer/gst/gst.c:1088-1261"]
fix         = "Add the missing unref calls in `gst_deinit()`, alongside the other `gst_clock_*`/`gst_task_*` type unrefs:\n```c\ng_type_class_unref (g_type_class_peek (gst_clock_get_type ()));\ng_type_class_unref (g_type_class_peek (gst_task_pool_get_type ()));\n```"

[[finding]]
id          = "MEM_69"
type        = "memory_leak"
severity    = "low"
difficulty  = "easy"
description = "In `gst_child_proxy_get_valist`, the `cant_copy` error path (triggered when `G_VALUE_LCOPY` fails) does `g_value_unset (&value); return;` but never calls `g_free (error)`, so the error message string allocated by `G_VALUE_LCOPY` is leaked. The sibling function `gst_child_proxy_set_valist` handles the analogous `cant_copy` path correctly with `g_free (error);`, showing this is an inconsistency/omission rather than intentional."
locations   = ["subprojects/gstreamer/gst/gstchildproxy.c:396-402", "subprojects/gstreamer/gst/gstchildproxy.c:508-516"]
fix         = "Add `g_free (error);` in the `cant_copy` block of `gst_child_proxy_get_valist`, mirroring `gst_child_proxy_set_valist`:\n```c\ncant_copy:\n  {\n    g_warning (\"error copying value %s in object %s: %s\", pspec->name,\n        (GST_IS_OBJECT (object) ? GST_OBJECT_NAME (object) : \"\"), error);\n    g_value_unset (&value);\n    g_free (error);\n    return;\n  }\n```"

[[finding]]
id          = "MEM_70"
type        = "memory_leak"
severity    = "low"
difficulty  = "medium"
description = "In `gst_clock_id_wait_async`, when the requested entry time is invalid the code jumps to the `invalid_time` label and invokes `(func) (clock, GST_CLOCK_TIME_NONE, id, user_data)` directly, returning `GST_CLOCK_BADTIME`. This happens *before* `entry->func`, `entry->user_data`, and `entry->destroy_data` are ever assigned (that assignment only happens later, at lines 634-636, after the `invalid_time` check). Consequently the caller-supplied `destroy_data` callback is never stored on the entry and will never be invoked to free `user_data`, even when the `GstClockID` is later freed via `gst_clock_id_unref`/`_gst_clock_id_free` (which only calls `entry->destroy_data` if it was set). Any `user_data` whose ownership was meant to be released exclusively through `destroy_data` is leaked on this path."
locations   = ["subprojects/gstreamer/gst/gstclock.c:606-663"]
fix         = "Store `entry->func`, `entry->user_data`, and `entry->destroy_data` on the entry before checking `GST_CLOCK_TIME_IS_VALID (requested)`, or explicitly invoke `destroy_data (user_data)` in the `invalid_time` error path of `gst_clock_id_wait_async` right after calling `func`."

[[finding]]
id          = "MEM_71"
type        = "memory_leak"
severity    = "low"
difficulty  = "easy"
description = "In `gst_device_provider_register`, the `factory` object is created with `g_object_new (GST_TYPE_DEVICE_PROVIDER_FACTORY, NULL)` (a floating `GstObject`). If any of the `CHECK_METADATA_FIELD` checks fail (missing longname/klass/description/author metadata), execution jumps to the `detailserror` label, which only calls `gst_device_provider_factory_cleanup (factory)` (this frees `factory->metadata` and resets `factory->type`, nothing else) and returns `FALSE`. The floating `factory` `GstObject` itself is never sunk, unparented, or unreffed, so it is leaked on this error path."
locations   = ["subprojects/gstreamer/gst/gstdeviceproviderfactory.c:200-238"]
fix         = "Unref the floating factory object on the error path, e.g. change `gst_device_provider_factory_cleanup` handling or add an explicit `gst_object_unref (factory);` (after sinking it, since it is currently floating) before returning `FALSE` in the `detailserror:` block."

[[finding]]
id          = "MEM_72"
type        = "memory_leak"
severity    = "low"
difficulty  = "easy"
description = "`gst_iterator_push` in subprojects/gstreamer/gst/gstiterator.c unconditionally does `it->pushed = other;` with no check on the previous value of `it->pushed`. If `gst_iterator_push()` is ever called while `it->pushed` is already non-`NULL` (i.e. another iterator was pushed and not yet popped via a `GST_ITERATOR_DONE` result, `gst_iterator_resync()`, or `gst_iterator_free()`), the previously pushed `GstIterator` is silently overwritten and leaked, since nothing calls `gst_iterator_free()` on the old value before replacing it."
locations   = ["subprojects/gstreamer/gst/gstiterator.c:446-453"]
fix         = "Guard against overwriting an existing pushed iterator, e.g.:\n```c\nvoid\ngst_iterator_push (GstIterator * it, GstIterator * other)\n{\n  g_return_if_fail (it != NULL);\n  g_return_if_fail (other != NULL);\n\n+  g_return_if_fail (it->pushed == NULL);\n\n  it->pushed = other;\n}\n```\nor explicitly free/pop the old `it->pushed` first if overwriting is intended to be supported."

[[finding]]
id          = "OVF_1"
type        = "overflow_underflow"
severity    = "critical"
difficulty  = "medium"
description = "In `gst_ffmpegdemux_loop` (`gstavdemux.c`), when a stream is `AV_CODEC_ID_RAWVIDEO`, `outsize` is computed via `gst_ffmpeg_avpicture_get_size (avstream->codecpar->format, avstream->codecpar->width, avstream->codecpar->height)`. This function (`gst_ffmpeg_avpicture_fill` in `gstavutils.c`) returns `-1` for any `pix_fmt` not explicitly handled by its old, very-limited `switch` statement (its `default:` case), which includes many perfectly valid `AVPixelFormat` values (e.g. `AV_PIX_FMT_NV12`, `AV_PIX_FMT_YUVA444P`, 10/16-bit formats, etc.) as well as attacker-controlled garbage values coming straight from the container's per-stream metadata (`avstream->codecpar->format`). The resulting negative `gint outsize` is then passed unchecked to `gst_buffer_new_and_alloc (outsize)`, whose parameter type is `gsize` (unsigned); `-1` becomes `SIZE_MAX`, causing the allocation to fail and `gst_buffer_new_and_alloc` to return `NULL`. The code then calls `gst_buffer_map (outbuf, &map, GST_MAP_WRITE)` on this `NULL` buffer without checking the boolean return value. `gst_buffer_map` fails early (`g_return_val_if_fail (GST_IS_BUFFER (buffer), FALSE)`) *without* touching `*info`, so the stack-local `GstMapInfo map` is left completely uninitialized. The code then does `gst_ffmpeg_avpicture_fill (&dst, map.data, ...)` using this garbage pointer and finally `av_image_copy (dst.data, dst.linesize, ...)`, which writes decoded image-plane data through the uninitialized/garbage `dst.data` pointers - an arbitrary/wild memory write driven entirely by a crafted or simply unusual raw-video container."
locations   = ["subprojects/gst-libav/ext/libav/gstavdemux.c:1504-1536", "subprojects/gst-libav/ext/libav/gstavutils.c:433-439"]
fix         = "Check for a negative/zero size and a failed allocation/mapping before using them, e.g.:\n\nBefore:\n```c\n  if (rawvideo)\n    outsize = gst_ffmpeg_avpicture_get_size (avstream->codecpar->format,\n        avstream->codecpar->width, avstream->codecpar->height);\n  else\n    outsize = pkt.size;\n\n  outbuf = gst_buffer_new_and_alloc (outsize);\n```\nAfter:\n```c\n  if (rawvideo)\n    outsize = gst_ffmpeg_avpicture_get_size (avstream->codecpar->format,\n        avstream->codecpar->width, avstream->codecpar->height);\n  else\n    outsize = pkt.size;\n\n  if (outsize <= 0)\n    goto invalid_frame;\n\n  outbuf = gst_buffer_new_and_alloc (outsize);\n  if (outbuf == NULL)\n    goto invalid_frame;\n```\nand likewise check `gst_buffer_map()`'s return value before using `map.data`, jumping to an error path (e.g. drop the packet, or set `ret = GST_FLOW_ERROR; goto pause;`) instead of falling through with an uninitialized `GstMapInfo`."

[[finding]]
id          = "OVF_2"
type        = "overflow_underflow"
severity    = "critical"
difficulty  = "easy"
description = "`gst_aes_hexstring2bytearray()` in `gstaeshelper.c` writes one output byte to `out` for every two hex characters in the input string `in`, but takes no `out` buffer-size argument and performs no bounds checking whatsoever. It is called from `gst_aes_dec_set_property()`/`gst_aes_enc_set_property()` (in `gstaesdec.c` and `gstaesenc.c`) to fill the fixed-size struct fields `filter->key` (`guchar key[EVP_MAX_KEY_LENGTH]`, i.e. 64 bytes) and `filter->iv` (`guchar iv[GST_AES_BLOCK_SIZE]`, i.e. 16 bytes) directly from the user-supplied `key`/`iv` GObject string properties. Any caller (e.g. a pipeline description or application) that sets the `key` or `iv` property to a hex string longer than the destination buffer causes `gst_aes_hexstring2bytearray()` to write past the end of `filter->key`/`filter->iv`, corrupting adjacent fields of the `GstAesDec`/`GstAesEnc` instance (and beyond, since these are heap-allocated `GObject`s). The length validation (`hex_len != GST_AES_BLOCK_SIZE`, etc.) only happens *after* the overflow has already occurred."
locations   = ["subprojects/gst-plugins-bad/ext/aes/gstaeshelper.c:140-187", "subprojects/gst-plugins-bad/ext/aes/gstaesdec.c:290-301", "subprojects/gst-plugins-bad/ext/aes/gstaesenc.c:284-296"]
fix         = "Add a maximum output length parameter to `gst_aes_hexstring2bytearray()` and bail out once that many bytes have been written, e.g.:\n```c\nguint\ngst_aes_hexstring2bytearray (GstElement * filter, const gchar * in,\n    guchar * out, gsize out_max_len)\n{\n  ...\n  while (*in != 0) {\n    if (hex_count >= out_max_len)\n      return 0;\n    ...\n  }\n```\nand update all call sites (`gst_aes_dec_set_property()`/`gst_aes_enc_set_property()` for both `key` and `iv`) to pass `sizeof (filter->key)` / `sizeof (filter->iv)` respectively, e.g. `gst_aes_hexstring2bytearray (GST_ELEMENT (filter), g_value_get_string (value), filter->key, sizeof (filter->key))`."

[[finding]]
id          = "OVF_3"
type        = "overflow_underflow"
severity    = "critical"
difficulty  = "medium"
description = "In `gst_dfbvideosink_show_frame` (`dfbvideosink.c`), the per-plane memcpy loop that writes decoded video data into the locked DirectFB destination surface uses `||` instead of `&&` in its termination condition: `for (plane_line = 0; line < result.h || plane_line < plane_h; line++, plane_line++)`. Because `||` keeps the loop running as long as *either* the destination-row counter (`line`) is below `result.h` *or* the source-plane-row counter (`plane_line`) is below `plane_h`, the loop actually iterates `max(result.h, plane_h)` times instead of the intended `min(result.h, plane_h)`. When the source plane is taller than the clipped destination rectangle (`plane_h > result.h`), `memcpy` keeps writing to `w_buf` (which is advanced by `stride[plane]` every iteration) past the end of the locked destination sub-surface, corrupting adjacent DirectFB/video memory (heap/video-memory buffer overflow write). When the destination rectangle is taller than the source plane (`result.h > plane_h`), the loop keeps reading `src_frame.data[plane] + plane_line * src_info.stride[plane]` past the mapped `GstVideoFrame` memory (out-of-bounds read). This code path (`mem_cpy == TRUE`) is explicitly the supported \"clipping/centering when the surface size differs from the video size\" path described in the surrounding comments, so it is reachable with ordinary negotiated caps/surface-size mismatches, not just contrived input."
locations   = ["subprojects/gst-plugins-bad/ext/directfb/dfbvideosink.c:1904-1924"]
fix         = "Use `&&` so the copy stops as soon as either the destination or the source bound is reached:\n```\n/* before */\n      for (plane_line = 0; line < result.h || plane_line < plane_h;\n          line++, plane_line++) {\n\n/* after */\n      for (plane_line = 0; line < result.h && plane_line < plane_h;\n          line++, plane_line++) {\n```"

[[finding]]
id          = "OVF_4"
type        = "overflow_underflow"
severity    = "critical"
difficulty  = "medium"
description = "`GstFaad` declares fixed-size channel-position arrays `aac_positions[6]` and `gst_positions[6]` in `gstfaad.h`, but the src pad template in `gstfaad.c` (`STATIC_RAW_CAPS`) advertises `channels = (int) [ 1, 8 ]`. In `gst_faad_update_caps()`, `faad->channels` is taken directly from the decoded `faacDecFrameInfo::channels` (attacker-controlled via a crafted AAC/ADTS stream using a Program Config Element describing 7 or 8 channels) and passed to `gst_faad_chanpos_to_gst (faad, faad->channel_positions, faad->aac_positions, faad->channels)`, which writes `pos[n]` for `n` up to `faad->channels - 1` into the 6-element `faad->aac_positions` array. Worse, immediately after, `gst_faad_update_caps()` does `GstAudioChannelPosition position[6]; ... memcpy (position, faad->aac_positions, sizeof (position)); gst_audio_channel_positions_to_valid_order (position, faad->channels);` — `position` is a 6-element stack array but `gst_audio_channel_positions_to_valid_order()` is told there are `faad->channels` (up to 8) valid entries, causing an out-of-bounds stack write."
locations   = ["subprojects/gst-plugins-bad/ext/faad/gstfaad.h:48", "subprojects/gst-plugins-bad/ext/faad/gstfaad.c:337-421", "subprojects/gst-plugins-bad/ext/faad/gstfaad.c:423-490"]
fix         = "Either restrict the advertised caps to the array capacity, or size the arrays to the advertised maximum and validate before use. E.g. in `gstfaad.h` change `GstAudioChannelPosition aac_positions[6], gst_positions[6];` to `GstAudioChannelPosition aac_positions[8], gst_positions[8];`, and in `gst_faad_update_caps()` change `GstAudioChannelPosition position[6];` to `GstAudioChannelPosition position[8];`, plus add a guard such as `if (info->channels > 8) { GST_ERROR_OBJECT (faad, \"too many channels\"); return FALSE; }` before any array writes, since `info->channels` comes straight from the decoded bitstream and is not otherwise bounds-checked."

[[finding]]
id          = "OVF_5"
type        = "overflow_underflow"
severity    = "critical"
difficulty  = "medium"
description = "`gst_nv_comp_video_dec_parse_header` (used by `gst_nv_comp_video_dec_handle_frame` to parse the custom `video/x-nvcomp-*` batched-chunk header embedded in the input `GstBuffer`) reads a per-chunk `comp_size` (`compressed_chunks[i].comp_size = GST_READ_UINT32_LE (ptr)`) directly from attacker/stream-controlled data, and only verifies that the sum of all `comp_size` values equals the remaining buffer size (`remaining != total_compressed_size`). It never checks that an individual `comp_size` is `<= max_compressed_chunk_size` (also read from the same untrusted header). Later, in `gst_nv_comp_video_dec_handle_frame`, the destination buffer `task->host_compressed` is a pinned host allocation sized as `batch_size * GST_ROUND_UP_8(max_compressed_chunk_size)` (see `DecoderTask::allocate_batched`), and each chunk is copied with `memcpy (task->host_compressed + (i * task->max_compressed_chunk_size), mapped_data + compressed_chunks[i].offset, compressed_chunks[i].comp_size)`. Because `comp_size` is never bounded by `max_compressed_chunk_size`, a single crafted chunk (with a large `comp_size` value but a small declared `max_compressed_chunk_size`) causes `memcpy` to write past the end of the fixed-size per-chunk slot and potentially past the entire `host_compressed` allocation, corrupting adjacent heap memory."
locations   = ["subprojects/gst-plugins-bad/ext/nvcomp/gstnvcompvideodec.cpp:1403-1471", "subprojects/gst-plugins-bad/ext/nvcomp/gstnvcompvideodec.cpp:1565-1570"]
fix         = "In `gst_nv_comp_video_dec_parse_header`, after reading each `compressed_chunks[i].comp_size`, reject the stream if it exceeds `max_compressed_chunk_size`, e.g.: `if (compressed_chunks[i].comp_size > max_compressed_chunk_size) { GST_ERROR_OBJECT (self, \"Invalid chunk size\"); return FALSE; }` before accumulating it into `total_compressed_size`."

[[finding]]
id          = "OVF_6"
type        = "overflow_underflow"
severity    = "critical"
difficulty  = "hard"
description = "In `gst_openexr_dec_handle_frame`, `width` and `height` are computed as `dw.max.x - dw.min.x + 1` / `dw.max.y - dw.min.y + 1` from `file->dataWindow()`, which reflects attacker-controlled header fields of the EXR input. `Rgba *fb = new Rgba[width * height];` computes `width * height` using 32-bit signed `int` arithmetic before it is converted for the array-new machinery, so a crafted data window can make the multiplication silently overflow (undefined behavior) and wrap to a small or negative value. `new` then allocates a buffer far smaller than the real image, but the immediately following `file->setFrameBuffer(fb - dw.min.x - dw.min.y * width, 1, width); file->readPixels(dw.min.y, dw.max.y);` writes the *actual* (non-overflowed) number of scanlines/pixels into `fb`, causing a heap buffer overflow write driven entirely by untrusted file data. In addition, the `new Rgba[...]` call itself is not inside the surrounding `try`/`catch (Iex::BaseExc&)` block, so if it throws (`std::bad_alloc`/`std::bad_array_new_length`) the exception escapes `gst_openexr_dec_handle_frame`, which is invoked as a C function pointer (`GstVideoDecoderClass::handle_frame`) from the GStreamer core — this both leaks `map`, `istr`, `file` and `vframe` and risks process termination."
locations   = ["subprojects/gst-plugins-bad/ext/openexr/gstopenexrdec.cpp:404-421"]
fix         = "Validate `width`/`height` (e.g. reject non-positive values and cap against a sane maximum, and use a 64-bit/`gsize` multiplication guarded against overflow) before allocating `fb`, and wrap the `new Rgba[width * height]` call in the existing `try { ... } catch (Iex::BaseExc&)` (or a `std::bad_alloc` catch) so that allocation failure is handled the same way other decode errors are, releasing `map`, `istr`, `file` and `vframe` instead of leaking/aborting. For example: `if (width <= 0 || height <= 0 || (gint64)width * height > MAX_EXR_PIXELS) { ... error out ... }` before `new Rgba[(gsize)width * height]`."

[[finding]]
id          = "OVF_7"
type        = "overflow_underflow"
severity    = "critical"
difficulty  = "very_easy"
description = "In `gst_meta_serialize` (subprojects/gstreamer/gst/gstmeta.c), `header_size` is declared as `guint8` even though the true header length is `2 * sizeof (guint32) + name_len + 2`, i.e. `name_len + 10`. `name_len` is the strlen of the meta's registered GType name (`g_type_name (meta->info->type)`), which for a custom meta comes from an arbitrary caller-supplied string passed to `gst_meta_register_custom()`/`gst_meta_api_type_register()` with no length limit enforced anywhere. If `name_len >= 246`, `name_len + 10 >= 256` and the assignment to the 1-byte `guint8 header_size` silently truncates modulo 256, producing a small `header_size`. `gst_byte_array_interface_set_size (data, data->len + header_size)` then only grows the buffer by this truncated (too small) amount, but the subsequent `GST_WRITE_UINT32_LE (header + 4, name_len)` and especially `memcpy (header + 8, name, name_len + 1)` still use the real, untruncated `name_len`, writing far past the space that was actually reserved. This is a heap buffer overflow (write) triggered simply by registering/serializing a custom meta with a sufficiently long name."
locations   = ["subprojects/gstreamer/gst/gstmeta.c:763-786"]
fix         = "Declare `header_size` with the same width used on the deserialize side (`guint32`, matching `gst_meta_deserialize`'s `header_size`), e.g.:\n```c\n-    guint8 header_size = 2 * sizeof (guint32) + name_len + 2;\n+    guint32 header_size = 2 * sizeof (guint32) + name_len + 2;\n```\nAlso consider rejecting overly long meta names up front (e.g. reject if `name_len` would make `header_size` exceed a sane bound) so the allocation and the `GST_WRITE_UINT32_LE`/`memcpy` calls stay consistent."

[[finding]]
id          = "OVF_8"
type        = "overflow_underflow"
severity    = "critical"
difficulty  = "medium"
description = "In `gst_meta_deserialize` (subprojects/gstreamer/gst/gstmeta.c), `guint32 header_size = 2 * sizeof (guint32) + name_len + 2;` is computed from `name_len`, which is read directly from untrusted input via `GST_READ_UINT32_LE (data + 4)` and can be up to `0xFFFFFFFF`. Because `header_size` is a `guint32`, the addition wraps around for large `name_len` (e.g. `name_len = 0xFFFFFFF8` yields `header_size == 2`), which defeats the bounds check `if (size < total_size || total_size < header_size) goto bad_header;` (an attacker only needs to also set a small, valid `total_size <= size`). Execution then reaches `if (name[name_len] != '\\0') goto bad_header;` where `name = data + 8`, dereferencing `data + 8 + name_len` — an out-of-bounds read of up to ~4 GB past the buffer, causing a crash (or a read of adjacent memory) using an input as small as 12 bytes. This is reachable through any code path that parses serialized meta data from untrusted sources (files, network streams, IPC)."
locations   = ["subprojects/gstreamer/gst/gstmeta.c:863-876"]
fix         = "Validate `name_len` against `size` before computing `header_size`, and/or compute the header size using a wider, non-wrapping type before checking bounds, e.g.:\n```c\nguint32 total_size = GST_READ_UINT32_LE (data + 0);\nguint32 name_len = GST_READ_UINT32_LE (data + 4);\nif (name_len > size || (guint64) 2 * sizeof (guint32) + name_len + 2 > size)\n  goto bad_header;\nguint32 header_size = 2 * sizeof (guint32) + name_len + 2;\nif (size < total_size || total_size < header_size)\n  goto bad_header;\n```\nThe key point is to reject `name_len` values that would make the subsequent `guint32` addition wrap before that wrapped value is used to bypass bounds checks."

[[finding]]
id          = "OVF_9"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "In `_read_double` and `_read_builtin` (used by `gst_validate_utils_parse_expression` in `gst-validate-utils.c`), digits/identifier characters are copied into a fixed-size stack buffer `gchar token[PARSER_MAX_TOKEN_SIZE]` (256 bytes) with no bounds check on `pos` before writing: `while (isdigit (_peek (parser))) token[pos++] = _next (parser);` (same pattern for the exponent digits and for identifier characters in `_read_builtin`). If the expression contains a numeric literal or identifier/variable name longer than 255 characters (reachable via `expr(...)` fields resolved by `_resolve_expression`/`gst_validate_structure_resolve_variables`, which processes scenario/test-config `GstStructure` fields, i.e. attacker- or test-author-controlled text files), the loop keeps writing past the end of `token`, causing a classic stack buffer overflow (out-of-bounds write)."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-utils.c:100-140", "subprojects/gst-devtools/validate/gst/validate/gst-validate-utils.c:359-410"]
fix         = "Bound every write with the buffer size, e.g. in `_read_double`: `while (isdigit (_peek (parser)) && pos < PARSER_MAX_TOKEN_SIZE - 1) token[pos++] = _next (parser);` and error out via `_error(parser, \"token too long\")` if the loop stops because of the length limit rather than end of digits. Apply the same `pos < PARSER_MAX_TOKEN_SIZE - 1` guard to the identifier-reading loop in `_read_builtin` (`while ((isalpha (c) || isdigit (c) || c == '_' || c == '$') && pos < PARSER_MAX_TOKEN_SIZE - 1) { token[pos++] = _next (parser); c = _peek (parser); }`)."

[[finding]]
id          = "OVF_10"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "very_easy"
description = "In `make_source` (`subprojects/gst-editing-services/ges/ges-pitivi-formatter.c`), `prio` is declared as `gint prio;` (4 bytes), but the key inserted into `priv->layers_table` is built with `g_memdup2 (&prio, sizeof (guint64))`, which copies 8 bytes starting at `&prio`. This reads 4 bytes past the end of the `prio` stack variable (an out-of-bounds stack read) into the newly allocated hash table key."
locations   = ["subprojects/gst-editing-services/ges/ges-pitivi-formatter.c:461", "subprojects/gst-editing-services/ges/ges-pitivi-formatter.c:479-480"]
fix         = "Use the size of the actual variable being copied: `g_hash_table_insert (priv->layers_table, g_memdup2 (&prio, sizeof (prio)), layer);` instead of `g_memdup2 (&prio, sizeof (guint64))`."

[[finding]]
id          = "OVF_11"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "In `gst_aes_dec_transform()` (`per_buffer_padding` path), `padding = plaintext[plaintext_len - 1];` is read without first checking that `plaintext_len` (the number of bytes `EVP_CipherUpdate()` just produced) is non-zero; if the ciphertext chunk fed to `EVP_CipherUpdate()` does not complete a full AES block (openssl buffers partial blocks internally when its own padding is disabled), `plaintext_len` can legitimately be `0`, making `plaintext[plaintext_len - 1]` read `plaintext[-1]`, one byte before the mapped output buffer. Additionally, once `padding` is read, the code only checks `padding == 0 || padding > GST_AES_BLOCK_SIZE` but never checks `padding <= plaintext_len`; the following loop `for (k = 1; k < padding; ++k) if (plaintext[plaintext_len - 1 - k] != padding)` can then read up to 15 bytes before the start of `plaintext` when `plaintext_len` is smaller than `padding`. Because AES-CBC decryption is malleable, an on-path attacker who can flip bits of the ciphertext (without knowing the key) can control the final decrypted byte of a block, i.e. can control `padding`, making this an attacker-triggerable out-of-bounds heap read."
locations   = ["subprojects/gst-plugins-bad/ext/aes/gstaesdec.c:491-510"]
fix         = "Validate `plaintext_len` and `padding` against each other before indexing, e.g.:\n```c\nif (plaintext_len == 0) {\n  GST_ELEMENT_ERROR (filter, STREAM, FAILED, (\"Corrupt cipher text.\"),\n      (\"Ciphertext produced no output\"));\n  goto cleanup;\n}\npadding = plaintext[plaintext_len - 1];\nif (padding == 0 || padding > GST_AES_BLOCK_SIZE || padding > plaintext_len) {\n  GST_ELEMENT_ERROR (filter, STREAM, FAILED, (\"Corrupt cipher text.\"),\n      (\"Illegal PKCS7 padding value %d\", padding));\n  goto cleanup;\n}\n```"

[[finding]]
id          = "OVF_12"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "In `gst_segmentation_overlay_resampling`, the `CTBL_IDX(val)` macro safely bounds a raw mask byte (`mline[val]`, range 0-255) via `% color_count` before indexing `color_table`, but the `MASK_FILTER(val)` macro indexes `mask_filter[mline[val]]` directly with the unbounded raw byte value. `mask_filter` is allocated in `gst_segmentation_overlay_update_mask_filter` with size `gst_analytics_cls_mtd_get_length (cls_mtd) * sizeof (gboolean)`, which can be much smaller than 256. Whenever the segmentation mask (produced by an upstream, potentially adversarial, tensor-decoder/model) contains a pixel value greater than or equal to that class count, `MASK_FILTER` reads out of bounds of the `mask_filter` heap allocation."
locations   = ["subprojects/gst-plugins-bad/ext/analyticsoverlay/gstsegmentationoverlay.c:855-893"]
fix         = "Bound the index by `mask_filter_len` the same way `CTBL_IDX` is bounded by `color_count`, e.g.:\n```\n#define MASK_FILTER(val) (mask_filter == NULL || mask_filter [mline [val]])\n```\nbecomes:\n```\n#define MASK_FILTER(val) (mask_filter == NULL || mline[val] >= mask_filter_len || mask_filter[mline[val]])\n```\n(capturing `gsize mask_filter_len = overlay->mask_filter_len;` alongside the existing `guint32 *color_table = overlay->color_table;` / `gboolean *mask_filter = overlay->mask_filter;` locals)."

[[finding]]
id          = "OVF_13"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_ass_render_handle_tag_sample`, `filename` comes from the `filename` field of a `GST_TAG_ATTACHMENT` sample (populated from demuxer-parsed, file-controlled metadata such as a Matroska attachment name). When the mimetype check fails, the code computes `guint len = strlen (filename); const gchar *extension = filename + len - 4;` without checking that `len >= 4`. Since `len` is a `guint`, `len - 4` underflows to a huge unsigned value when `filename` is shorter than 4 characters (including the empty string), and `filename + (huge value)` produces a wildly out-of-bounds pointer that is then dereferenced by `g_ascii_strcasecmp (extension, extensions[i])`."
locations   = ["subprojects/gst-plugins-bad/ext/assrender/gstassrender.c:1601-1610"]
fix         = "Guard the subtraction with a length check before forming the pointer, e.g. change:\n```\n  if (!valid_mimetype) {\n    guint len = strlen (filename);\n    const gchar *extension = filename + len - 4;\n    for (i = 0; i < G_N_ELEMENTS (extensions); i++) {\n```\nto:\n```\n  if (!valid_mimetype) {\n    guint len = strlen (filename);\n    const gchar *extension = (len >= 4) ? filename + len - 4 : NULL;\n    for (i = 0; extension != NULL && i < G_N_ELEMENTS (extensions); i++) {\n```"

[[finding]]
id          = "OVF_14"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "Both `add_final_boundary_unlocked` and `gst_curl_smtp_sink_flush_data_unlocked` in `subprojects/gst-plugins-bad/ext/curl/gstcurlsmtpsink.c` call `g_base64_encode_close (TRUE, data_out, &state, &save)` and then unconditionally write `data_out[len - 1] = '\\r'; data_out[len] = '\\n';` assuming `len >= 1`. However, `g_base64_encode_close` legitimately returns `0` whenever there is no pending partial group to flush (i.e. `save` indicates 0 leftover bytes, which happens whenever the total amount of data base64-encoded so far is an exact multiple of 3 bytes, or when no data was ever encoded before EOS). In `add_final_boundary_unlocked`, `len` is declared `gsize` (unsigned), so `len - 1` when `len == 0` wraps around to `SIZE_MAX`, making `data_out[len - 1]` write far outside the 6-byte `g_malloc (6)` buffer - a severe heap buffer overflow/underflow. In `gst_curl_smtp_sink_flush_data_unlocked`, `len` is `gint` (signed), so `data_out[len - 1]` becomes `data_out[-1]`, a one-byte heap buffer underflow write. Both are reachable in ordinary use (e.g. an attachment whose encoded byte count is a multiple of 3, or an immediate EOS with no attachment data), not just adversarial input."
locations   = ["subprojects/gst-plugins-bad/ext/curl/gstcurlsmtpsink.c:178-188", "subprojects/gst-plugins-bad/ext/curl/gstcurlsmtpsink.c:798-806"]
fix         = "Guard both call sites against `len == 0` before indexing `data_out`, e.g.:\n```c\nlen = g_base64_encode_close (TRUE, data_out, &state, &save);\nif (len > 0) {\n  data_out[len - 1] = '\\r';\n  data_out[len] = '\\n';\n  len += 1; /* for the appended CR */\n} \ng_byte_array_append (array, (guint8 *) data_out, (guint) len);\n```\napplied symmetrically in both `add_final_boundary_unlocked` and `gst_curl_smtp_sink_flush_data_unlocked`, so the `data_out[len-1]`/`data_out[len]` writes and the corresponding `g_byte_array_append` length only happen when `g_base64_encode_close` actually produced output."

[[finding]]
id          = "OVF_15"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "`gst_xml_helper_get_prop_dateTime` in `gstxmlhelper.c` parses an ISO-8601 `dateTime` attribute (e.g. `availabilityStartTime`, `publishTime`, `mediaPresentationDuration`-adjacent timestamps from an untrusted DASH MPD manifest) by repeatedly doing `pos = strcspn (str, \"-\")` / `strcspn (str, \"T\")` / `strcspn (str, \":\")` followed unconditionally by `str += (pos + 1);`, without ever checking whether the expected separator was actually found. `strcspn` returns `strlen(str)` when the separator is absent, so `str += (pos + 1)` advances the pointer to exactly one byte past the string's NUL terminator (i.e. past the end of the heap buffer returned by `xmlGetProp`). The following `sscanf(str, ...)` call then reads from that out-of-bounds address. This differs from the sibling helpers `gst_xml_helper_get_prop_range` and `gst_xml_helper_get_prop_ratio` in the same file, which both explicitly check `if (pos >= len) goto error;` before doing arithmetic on `pos`, showing the check was simply omitted here."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstxmlhelper.c:830-836", "subprojects/gst-plugins-bad/ext/dash/gstxmlhelper.c:837-843", "subprojects/gst-plugins-bad/ext/dash/gstxmlhelper.c:844-850", "subprojects/gst-plugins-bad/ext/dash/gstxmlhelper.c:851-857", "subprojects/gst-plugins-bad/ext/dash/gstxmlhelper.c:858-864"]
fix         = "Check that the separator was actually found before advancing the pointer, e.g. for the year/month separator:\n```\n/* before */\n    ret = sscanf (str, \"%d\", &year);\n    if (ret != 1 || year <= 0)\n      goto error;\n    pos = strcspn (str, \"-\");\n    str += (pos + 1);\n\n/* after */\n    ret = sscanf (str, \"%d\", &year);\n    if (ret != 1 || year <= 0)\n      goto error;\n    pos = strcspn (str, \"-\");\n    if (str[pos] == '\\0')\n      goto error;\n    str += (pos + 1);\n```\nThe same `if (str[pos] == '\\0') goto error;` guard must be added before each of the other `str += (pos + 1);` occurrences (month/day, day/`T`, hour/minute) in `gst_xml_helper_get_prop_dateTime`."

[[finding]]
id          = "OVF_16"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "In `gst_dtsdec_renegotiate` (`subprojects/gst-plugins-bad/ext/dts/gstdtsdec.c`), `gst_dtsdec_channels()` can legitimately return `7` (e.g. for a `DCA_4F2R | DCA_LFE` channel arrangement decoded from the bitstream: 6 base channels + 1 LFE channel). The guard `if (channels <= 0 || channels > 7) goto done;` accepts `channels == 7` and the function proceeds to call `gst_audio_get_channel_reorder_map (channels, from, to, dts->channel_reorder_map)`, which writes `channels` (i.e. 7) `gint` entries into `dts->channel_reorder_map`. However `channel_reorder_map` is declared as `gint channel_reorder_map[6]` in `subprojects/gst-plugins-bad/ext/dts/gstdtsdec.h`, so this writes one `gint` past the end of the array, corrupting the adjacent `sample_t level` field of the `GstDtsDec` instance. This is reachable directly from an untrusted/malformed DTS bitstream (the channel arrangement flags come straight from `dca_syncinfo`/`dca_frame` parsing of the input data) and happens before the later `gst_audio_decoder_set_output_format()` negotiation call (which would reject 7 channels since the src pad template only allows `channels = (int) [ 1, 6 ]`) — so the out-of-bounds write occurs unconditionally regardless of whether negotiation eventually succeeds."
locations   = ["subprojects/gst-plugins-bad/ext/dts/gstdtsdec.c:401-434", "subprojects/gst-plugins-bad/ext/dts/gstdtsdec.h:59"]
fix         = "Either reject `channels > 6` in `gst_dtsdec_renegotiate` before calling `gst_audio_get_channel_reorder_map` (since the src caps template caps `channels` at 6), e.g. change `if (channels <= 0 || channels > 7) goto done;` to `if (channels <= 0 || channels > 6) goto done;`, or enlarge `gint channel_reorder_map[6];` to `gint channel_reorder_map[7];` in `gstdtsdec.h` to match the true maximum returned by `gst_dtsdec_channels()`."

[[finding]]
id          = "OVF_17"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "hard"
description = "In `subprojects/gst-plugins-bad/ext/hls/gsthlsdemux-util.c`, `handle_pat` and `handle_pmt` skip the MPEG-TS `adaptation_field` using `data += 1 + p[4];` and then the `pointer_field` using `data += 1 + data[0];`, without ever validating that `p[4]` (adaptation_field_len, attacker-controlled, up to 255) and the pointer_field byte (also attacker-controlled) keep `data` within the current 188-byte TS packet, unlike the sibling function `handle_pcr` which explicitly checks `af_len < (1 + 6) || af_len > r->packet_size - (4 + 1)`. Both functions then read `data[0]`, `data[6]`, `data[7]` and `GST_READ_UINT16_BE(data + 1)` from this unbounded pointer. The one bounds check that exists, `slen > (gsize) (p + r->packet_size - (data + 1 + 2))`, computes a pointer difference that becomes negative once `data` has already wandered past `p + r->packet_size`; casting that negative `ptrdiff_t` to `(gsize)` wraps it around to a huge unsigned value, so the check `slen > huge_value` is always false and never rejects the out-of-range access. The subsequent `while (slen >= 4) { ...; data += 4; }` loop (up to `slen` = 0x0FFF) then reads up to ~4KB past the intended packet. Since this data comes directly from the network (an HLS segment claiming to be `video/mpegts`), a malicious/compromised server can trigger a heap buffer over-read past the mapped `GstBuffer` memory, which can crash the demuxer (DoS)."
locations   = ["subprojects/gst-plugins-bad/ext/hls/gsthlsdemux-util.c:114-145", "subprojects/gst-plugins-bad/ext/hls/gsthlsdemux-util.c:147-182"]
fix         = "Add the same adaptation-field-length bound check used in `handle_pcr`, and also bound `pointer_field` and all subsequent offsets against `p + r->packet_size` before dereferencing, e.g. in `handle_pmt`:\n```c\n  data = p + 4;\n  if ((hdr & 0x00000020) != 0) {  /* has_adaptation_field */\n    guint af_len = p[4];\n    if (af_len > (guint) (r->packet_size - (4 + 1)))\n      return FALSE;\n    data += 1 + af_len;\n  }\n  if (data >= p + r->packet_size || data + 1 + data[0] >= p + r->packet_size)\n    return FALSE;\n  data += 1 + data[0];\n  if (data[0] != 0x02)\n    return FALSE;\n```\nand apply the equivalent fix to `handle_pat`."

[[finding]]
id          = "OVF_18"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "`gst_hls_demux_finish_fragment` performs manual PKCS7 unpadding on `hls_stream->pending_decrypted_buffer` by computing `unpadded_size = info.size - info.data[info.size - 1];` where `info.data[info.size - 1]` is the last byte of attacker-controlled decrypted plaintext (the HLS server fully controls both the AES key file and the ciphertext, so it controls the padding byte value). If that byte is greater than `info.size` (e.g. `0xFF`), `unpadded_size` (a `gssize`) becomes negative, and this negative value is passed straight to `gst_buffer_resize (hls_stream->pending_decrypted_buffer, 0, unpadded_size)`. `gst_buffer_resize_range` in `gstbuffer.c` asserts `g_return_val_if_fail (size >= -1, FALSE);`, so this triggers a `GLib` critical warning (an abort under `--gst-fatal-warnings`/`G_DEBUG=fatal-warnings`, common in CI/dev builds) and silently leaves the buffer unresized (unpadded) otherwise, corrupting the demuxed stream."
locations   = ["subprojects/gst-plugins-bad/ext/hls/gsthlsdemux.c:1076-1089"]
fix         = "Validate the padding length before resizing, e.g.:\n```c\n        gst_buffer_map (hls_stream->pending_decrypted_buffer, &info,\n            GST_MAP_READ);\n        unpadded_size = info.size - info.data[info.size - 1];\n        gst_buffer_unmap (hls_stream->pending_decrypted_buffer, &info);\n\n        if (unpadded_size < 0 || (gsize) unpadded_size > info.size) {\n          GST_ELEMENT_ERROR (demux, STREAM, DECRYPT,\n              (\"Invalid PKCS7 padding in decrypted fragment\"), (NULL));\n          gst_buffer_replace (&hls_stream->pending_decrypted_buffer, NULL);\n          return GST_FLOW_ERROR;\n        }\n\n        gst_buffer_resize (hls_stream->pending_decrypted_buffer, 0,\n            unpadded_size);\n```"

[[finding]]
id          = "OVF_19"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "Similar to the `comp_size` issue, `gst_nv_comp_video_dec_parse_header` reads a per-chunk `uncomp_size` (`compressed_chunks[i].uncomp_size`) from the untrusted stream header but never validates it against `uncompressed_chunk_size` (the fixed per-chunk slot size used to allocate `device_uncompressed_temp`/`device_uncompressed` in `DecoderTask::allocate_batched`). In `gst_nv_comp_video_dec_handle_frame`, after decompression the code does `auto size = compressed_chunks[i].uncomp_size; CuMemcpyDtoDAsync ((CUdeviceptr) uncompressed, (CUdeviceptr) task->host_uncompressed_ptrs[i], size, stream); uncompressed += size;`, where `uncompressed` walks sequentially over the `task->device_uncompressed` buffer (sized `batch_size * uncompressed_chunk_size`). A crafted `uncomp_size` larger than the real chunk size causes the device-to-device copy to read/write out of bounds of the allocated CUDA buffers, corrupting device memory."
locations   = ["subprojects/gst-plugins-bad/ext/nvcomp/gstnvcompvideodec.cpp:1403-1471", "subprojects/gst-plugins-bad/ext/nvcomp/gstnvcompvideodec.cpp:1606-1617"]
fix         = "In `gst_nv_comp_video_dec_parse_header`, validate each `compressed_chunks[i].uncomp_size <= uncompressed_chunk_size` (returning `FALSE` otherwise), mirroring the fix used for `comp_size`."

[[finding]]
id          = "OVF_20"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "In `gst_opus_parse_handle_frame` (`subprojects/gst-plugins-bad/ext/opus/gstopusparse.c`), the fallback \"test vector framing\" path reads a 4-byte big-endian `packet_size` from `data[0..3]`, validates only that `packet_size <= size - 4`, and then calls `opus_packet_parse (data + 8, packet_size, ...)`. Because the payload is read starting at offset 8 (skipping an extra 4-byte field after the size), the actual number of bytes required in the buffer is `8 + packet_size`, not `4 + packet_size`. When `size` is between `4 + packet_size` and `7 + packet_size`, the bounds check passes but `opus_packet_parse` reads up to 4 bytes past the end of the mapped input buffer, an out-of-bounds heap read on attacker-controlled/malformed Opus data."
locations   = ["subprojects/gst-plugins-bad/ext/opus/gstopusparse.c:184-204"]
fix         = "Require the extra 4-byte field to be present before reading the payload at `data + 8`, e.g. change the truncation check to account for the full 8-byte header: `if (size < 8 || packet_size > size - 8) goto beach;` (currently `if (packet_size > size - 4)` at `subprojects/gst-plugins-bad/ext/opus/gstopusparse.c:194`), so that `data + 8` through `data + 8 + packet_size` stays within `map.size`."

[[finding]]
id          = "OVF_21"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "In `gst_flups_demux_handle_dvd_event` (`subprojects/gst-plugins-bad/ext/resindvd/gstmpegdemux.c`), handling of the `dvd-set-subpicture-track` application event reads the `physical-id` field from the event structure into `stream_id` and immediately uses it as `demux->streams[(0x20 + stream_id) % GST_FLUPS_DEMUX_MAX_STREAMS]` with no bounds check. `demux->streams` is a heap-allocated array of `GST_FLUPS_DEMUX_MAX_STREAMS` (256) pointers (`g_malloc0` in `gst_flups_demux_init`), not a fixed inline array. If `stream_id` is negative (e.g. `-1`), `(0x20 + stream_id) % 256` yields a negative value in C, so `demux->streams[negative_index]` reads memory *before* the heap allocation and interprets whatever bytes are found there as a `GstFluPSStream *`, which is then dereferenced via `temp->pad`."
locations   = ["subprojects/gst-plugins-bad/ext/resindvd/gstmpegdemux.c:782-807"]
fix         = "Validate `stream_id` before using it as an index:\n\nBefore:\n```\n    if (gst_structure_get_int (structure, \"physical-id\", &stream_id)) {\n      temp = demux->streams[(0x20 + stream_id) % GST_FLUPS_DEMUX_MAX_STREAMS];\n```\nAfter:\n```\n    if (gst_structure_get_int (structure, \"physical-id\", &stream_id) &&\n        stream_id >= 0 &&\n        stream_id < (GST_FLUPS_DEMUX_MAX_STREAMS - 0x20)) {\n      temp = demux->streams[(0x20 + stream_id) % GST_FLUPS_DEMUX_MAX_STREAMS];\n```"

[[finding]]
id          = "OVF_22"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "easy"
description = "`gst_alsa_open_iec958_pcm` formats the device name into a fixed-size stack buffer `devstr[256]` using `sprintf` without any bounds checking: `sprintf (devstr, \"%s:{AES0 0x%02x AES1 0x%02x AES2 0x%02x AES3 0x%02x}\", device, ...)`. Since `device` is the user-configurable `device` property of `alsasink`/`alsasrc` (forwarded here from `gst_alsa_probe_supported_formats`), a device string close to or exceeding 256 bytes causes a classic stack buffer overflow."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsa.c:650-687"]
fix         = "Use `g_strdup_printf` or `snprintf` with the buffer size instead of `sprintf`, e.g. ```c\nchar *iec958_pcm_name = g_strdup_printf(\n    \"%s:{AES0 0x%02x AES1 0x%02x AES2 0x%02x AES3 0x%02x}\",\n    device, IEC958_AES0_CON_EMPHASIS_NONE | IEC958_AES0_NONAUDIO,\n    IEC958_AES1_CON_ORIGINAL | IEC958_AES1_CON_PCM_CODER, 0,\n    IEC958_AES3_CON_FS_48000);\n... \ng_free (iec958_pcm_name);\n```"

[[finding]]
id          = "OVF_23"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "In `gst_gl_differencematte_loader`, `bit_depth` from `png_get_IHDR` is never validated before allocating `differencematte->pixbuf = malloc (sizeof (guchar) * width * height * 4)` (sized for 8 bits/channel RGBA) and calling `png_read_image (png_ptr, rows)`. A `PNG_COLOR_TYPE_RGB`/`PNG_COLOR_TYPE_RGB_ALPHA` PNG with `bit_depth == 16` makes libpng write 2 bytes per channel into `rows`, doubling the per-row size actually written versus what `pixbuf`/`rows` stride assumes (`width * 4` bytes/row), causing a heap buffer overflow. Additionally, the `malloc` calls for `pixbuf` and `rows` are not checked for `NULL`, so on allocation failure (e.g. an attacker-supplied PNG declaring an enormous `width`/`height`) the subsequent `rows[y] = pixbuf + y * width * 4` and `png_read_image` write through an invalid pointer."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldifferencematte.c:561-587"]
fix         = "Validate the bit depth and check allocations before reading:\n```c\nif (bit_depth != 8) {\n  fclose (fp);\n  png_destroy_read_struct (&png_ptr, png_infopp_NULL, png_infopp_NULL);\n  LOAD_ERROR (\"unsupported bit depth\");\n}\ndifferencematte->pixbuf = malloc (sizeof (guchar) * width * height * 4);\nif (!differencematte->pixbuf) { ... }\nrows = malloc (sizeof (guchar *) * height);\nif (!rows) { free (differencematte->pixbuf); differencematte->pixbuf = NULL; ... }\n```"

[[finding]]
id          = "OVF_24"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "medium"
description = "`gst_visual_render` unconditionally reads `VISUAL_SAMPLES` (512) 16-bit samples per channel out of the mapped audio buffer (`ldata[i] = *adata++;` / `rdata[i] = *adata++;` loops), but the actual number of samples delivered per call is controlled by `GstAudioVisualizer::req_spf`, which `gst_visual_setup` never overrides. `GstAudioVisualizer` defaults `req_spf` to `priv->spf = audio_rate * fps_d / fps_n` (samples-per-video-frame, computed in `gst_audio_visualizer_src_setcaps`), and hands `render()` a buffer sized exactly `req_spf * bpf` bytes (see `gst_audio_visualizer_chain`, `sbpf = scope->req_spf * bpf`). For plausible negotiated caps (e.g. `rate=8000` with a `framerate` around `30/1`-`60/1`, both allowed by this element's caps templates), `spf` drops well below 512, so the mapped buffer is smaller than the `512`-sample read performed here, causing a heap buffer over-read past the end of `amap.data`. Sibling elements in the same audio-visualizer family (`gstspectrascope.c`, `gstsynaescope.c`) avoid this by explicitly setting `bscope->req_spf` in their `setup()` to match their fixed-size internal buffers; `gst_visual_setup` has no such assignment."
locations   = ["subprojects/gst-plugins-base/ext/libvisual/visual.c:157-211", "subprojects/gst-plugins-base/ext/libvisual/visual.c:213-249"]
fix         = "Force the base class to always deliver at least `VISUAL_SAMPLES` samples per call, e.g. in `gst_visual_setup`:\n\n```c\nstatic gboolean\ngst_visual_setup (GstAudioVisualizer * bscope)\n{\n  ...\n  bscope->req_spf = MAX (bscope->req_spf, VISUAL_SAMPLES);\n  ...\n}\n```\n(set after `gst_visual_clear_actors`, before returning `TRUE`), matching the pattern already used by `gstspectrascope.c`/`gstsynaescope.c`."

[[finding]]
id          = "OVF_25"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "hard"
description = "In `default_alloc` (`gstallocator.c`), `gsize maxsize = size + params->prefix + params->padding;` is computed with no overflow check before being passed into `_sysmem_new_block`. If `size` is attacker/caller controlled and close to `G_MAXSIZE` (e.g. a huge declared buffer size from untrusted stream data), this addition wraps around to a small value. `_sysmem_new_block` only validates the *already-wrapped* `maxsize` (`if (align > G_MAXSIZE || maxsize > G_MAXSIZE - align)`), so it can never detect the overflow that happened earlier in the caller. The function then allocates a tiny buffer (`slice_size = sizeof(GstMemorySystem) + maxsize`) but initializes the resulting `GstMemory` with the original huge `size`/`offset` via `_sysmem_init(mem, flags, NULL, data, maxsize, align, offset, size, ...)`. Any later reader/writer trusting `mem->size` will read/write far past the tiny real allocation. Additionally, inside `_sysmem_new_block`, `padding = maxsize - (offset + size)` would underflow into a huge unsigned value in this scenario, and if `GST_MEMORY_FLAG_ZERO_PADDED` is set, `memset (data + offset + size, 0, padding)` becomes a massive out-of-bounds write."
locations   = ["subprojects/gstreamer/gst/gstallocator.c:541-549", "subprojects/gstreamer/gst/gstallocator.c:419-470"]
fix         = "Validate the addition in `default_alloc` before calling `_sysmem_new_block`, e.g.:\n```c\nstatic GstMemory *\ndefault_alloc (GstAllocator * allocator, gsize size,\n    GstAllocationParams * params)\n{\n  gsize maxsize;\n\n  if (params->prefix > G_MAXSIZE - params->padding ||\n      size > G_MAXSIZE - params->prefix - params->padding)\n    return NULL;\n\n  maxsize = size + params->prefix + params->padding;\n\n  return (GstMemory *) _sysmem_new_block (params->flags,\n      maxsize, params->align, params->prefix, size);\n}\n```\nThis ensures `_sysmem_new_block` always receives a `maxsize` that has not already silently wrapped around."

[[finding]]
id          = "OVF_26"
type        = "overflow_underflow"
severity    = "high"
difficulty  = "hard"
description = "In `gst_element_is_valid_request_template_name` (`subprojects/gstreamer/gst/gstelement.c`), the postfix-matching branch computes `name_ptr + name_postfix_len - templ_postfix_len` where `name_postfix_len` and `templ_postfix_len` are both `guint`. If a request pad `name` has a shorter literal/digit segment between a `%u`/`%d` specifier and the next `_` (or end of string) than the corresponding literal segment in the pad template's `name_template`, `name_postfix_len < templ_postfix_len` and the unsigned subtraction wraps around to a huge value. The resulting pointer passed to `strncmp` (`name_ptr + name_postfix_len - templ_postfix_len`) is wildly out of bounds, causing an out-of-bounds read (typically a crash). This function is reached unconditionally (not gated behind `G_DISABLE_CHECKS`) from the public API `gst_element_request_pad_simple()`, so an application or element that requests a pad by name against a template whose `name_template` has literal text right after a `%u`/`%d` placeholder (e.g. `\"src_%uabc_end\"`) with a crafted, too-short `name` (e.g. `\"src_ab_end\"`) can trigger the OOB read."
locations   = ["subprojects/gstreamer/gst/gstelement.c:1050-1065"]
fix         = "Guard the subtraction so it can never underflow, e.g.:\n```c\nif (name_postfix_len < templ_postfix_len)\n  return FALSE;\n\nif (strncmp (templ_name_ptr + 2,\n        name_ptr + name_postfix_len - templ_postfix_len,\n        templ_postfix_len) != 0) {\n  return FALSE;\n}\n```\nThis rejects names whose postfix segment cannot possibly match the template's literal postfix instead of performing pointer arithmetic on an unsigned underflow."

[[finding]]
id          = "OVF_27"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "easy"
description = "`switch_stream()` copies matching `GstStream` pointers from `monitor->stream_collection` into a fixed-size stack array `GstStream *streams[256]` without ever checking `n` against the array bound. If the stream collection reported on the bus contains more than 256 streams of the requested type, the loop `streams[n] = s; n++;` writes past the end of the stack buffer, corrupting the stack."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:2087-2115"]
fix         = "Bound the loop by the array size (or allocate dynamically). E.g.: `for (i = 0; i < nb_streams; i++) {\\n    s = gst_stream_collection_get_stream (monitor->stream_collection, i);\\n    if (gst_stream_get_stream_type (s) == type) {\\n      if (n >= G_N_ELEMENTS (streams))\\n        break;\\n      streams[n] = s;\\n      ...\\n    }\\n  }`"

[[finding]]
id          = "OVF_28"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "`_update_our_values()` in `ges-group.c` initializes `min_layer_prio = G_MAXINT32` and `max_layer_prio = 0` (both `guint32`), then only updates them for children that are `GES_IS_GROUP` or `GES_IS_CLIP` *with a non-NULL layer* (clips without a layer `continue` and are skipped). If every clip child of the group currently has no layer assigned (e.g. a group built from clips that were removed from their layer via `ges_layer_remove_clip()`, or a group formed before any of its clips are placed in a layer) and the group has no `GES_IS_GROUP` children, both sentinels remain unchanged. The subsequent `_ges_container_set_height (container, max_layer_prio - min_layer_prio + 1)` then computes `0 - G_MAXINT32 + 1` using unsigned `guint32` arithmetic, which wraps around to a huge garbage value (`2147483650`) instead of a sane height, corrupting the group's (and, via `notify::height`, any parent group's) `height` state."
locations   = ["subprojects/gst-editing-services/ges/ges-group.c:112-155"]
fix         = "Guard against the case where no child contributed a valid priority before computing the height:\n```c\nif (min_layer_prio > max_layer_prio) {\n  /* no child currently has a resolvable layer priority */\n  min_layer_prio = max_layer_prio = _PRIORITY (group);\n}\n...\n_ges_container_set_height (container, max_layer_prio - min_layer_prio + 1);\n```"

[[finding]]
id          = "OVF_29"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "`gst_avtp_cvf_depay_get_nalu_size()` computes `*nalu_size = val - sizeof (guint32);` where `val` comes directly from the attacker-controlled `AVTP_CVF_FIELD_STREAM_DATA_LEN` field. `gst_avtp_cvf_depay_validate_avtpdu()` never enforces `val >= sizeof(guint32)` (it only checks `map->size < sizeof(*pdu) + val`, which is trivially satisfied for small `val`). If a crafted AVTPDU sets `STREAM_DATA_LEN` to less than `4`, the subtraction underflows (unsigned arithmetic) producing a huge bogus `nalu_size`. This value is then passed as the `size` argument to `gst_buffer_copy_into()`/`gst_buffer_copy_region()` in `gst_avtp_cvf_depay_handle_single_nal()` and `gst_avtp_cvf_depay_process_last_fragment()`, whose return values are never checked, silently producing truncated/empty NAL buffers that get pushed downstream while also spamming `g_critical()` warnings from `gst_buffer_copy_into()`'s internal bounds assertion."
locations   = ["subprojects/gst-plugins-bad/ext/avtp/gstavtpcvfdepay.c:380-395", "subprojects/gst-plugins-bad/ext/avtp/gstavtpcvfdepay.c:414-415", "subprojects/gst-plugins-bad/ext/avtp/gstavtpcvfdepay.c:571-572"]
fix         = "Validate `STREAM_DATA_LEN >= sizeof (guint32)` in `gst_avtp_cvf_depay_validate_avtpdu()` before accepting the packet, and check the return value of `gst_buffer_copy_into()` in `gst_avtp_cvf_depay_handle_single_nal()` / `gst_avtp_cvf_depay_process_last_fragment()`, dropping the packet on failure instead of pushing a corrupted buffer."

[[finding]]
id          = "OVF_30"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_avtp_rvf_depay_validate_avtpdu()`, `avtprvfdepay->fragment_size = avtprvfdepay->stream_data_length - sizeof (uint64_t);` is computed the first time the raw-video format parameters are fixed. `stream_data_length` comes directly from the attacker-controlled `AVTP_RVF_FIELD_STREAM_DATA_LEN` field and is never validated to be `>= sizeof(uint64_t)` (8) - the only earlier check, `map->size < sizeof (*pdu) + val`, allows `val` as small as `0`. If a crafted RVF AVTPDU sets `STREAM_DATA_LEN` below `8`, this subtraction underflows `avtprvfdepay->fragment_size` (a `gsize`) to a huge value, which then feeds `avtprvfdepay->fragment_eol_size = avtprvfdepay->line_size % avtprvfdepay->fragment_size;` and is later truncated into the `guint16 *fragment_size` output of `gst_avtp_rvf_depay_get_fragment_size()`, producing a bogus fragment size used for `gst_buffer_copy_into()`."
locations   = ["subprojects/gst-plugins-bad/ext/avtp/gstavtprvfdepay.c:298-320", "subprojects/gst-plugins-bad/ext/avtp/gstavtprvfdepay.c:497-499"]
fix         = "Reject packets where `STREAM_DATA_LEN < sizeof (uint64_t)` before computing `fragment_size`, e.g. add a check alongside the existing `map->size < sizeof (*pdu) + val` validation: `if (val < sizeof (uint64_t)) goto end;`."

[[finding]]
id          = "OVF_31"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_dash_demux_parse_isobmff`, after `gst_isoff_parse_box_header` fills in `header_size` (`guint`) and `size` (`guint64`), the code computes `size - header_size` in `if (gst_byte_reader_get_remaining (&reader) < size - header_size || ...)` without first checking `size >= header_size`. `gst_isoff_parse_box_header` (in `gst-libs/gst/isoff/gstisoff.c`) does not validate that relationship, so a malformed/malicious media segment can declare a box whose `size` field is smaller than its own header (e.g. the 64-bit extended-size form with a bogus small value). This underflows the unsigned subtraction to a huge value close to `G_MAXUINT64`, making the 'do we have the whole box' check always false; the demuxer then treats the box as perpetually incomplete for that box position, and will keep requesting/consuming more chunk data (via `need_another_chunk`) without ever making progress on that fragment."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstdashdemux.c:2973-2997"]
fix         = "Validate `size >= header_size` before subtracting, and treat a violation as a hard parse error:\n\nBefore:\n```c\nif (gst_byte_reader_get_remaining (&reader) < size - header_size ||\n    dash_stream->isobmff_parser.current_fourcc == GST_ISOFF_FOURCC_MDAT) {\n```\n\nAfter:\n```c\nif (size < header_size) {\n  GST_ERROR_OBJECT (stream->pad, \"Invalid box size %\" G_GUINT64_FORMAT\n      \" smaller than header size %u\", size, header_size);\n  gst_buffer_unmap (buffer, &map);\n  gst_buffer_unref (buffer);\n  return GST_FLOW_ERROR;\n}\n\nif (gst_byte_reader_get_remaining (&reader) < size - header_size ||\n    dash_stream->isobmff_parser.current_fourcc == GST_ISOFF_FOURCC_MDAT) {\n```"

[[finding]]
id          = "OVF_32"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_faad_sync()` (`gstfaad.c`), after finding a candidate ADTS sync word at offset `n`, the code checks `if (size - n < 5) { ...; break; }` to ensure enough bytes remain, but then reads `data[n + 5]` (`len = ((data[n + 3] & 0x03) << 11) | (data[n + 4] << 3) | ((data[n + 5] & 0xe0) >> 5);`), which requires `size - n >= 6`, not `>= 5`. When exactly 5 bytes remain after `n`, `data[n + 5]` is read one byte past the end of the `gst_adapter_map()`-mapped buffer."
locations   = ["subprojects/gst-plugins-bad/ext/faad/gstfaad.c:523-529"]
fix         = "Change the guard to require 6 bytes: replace `if (size - n < 5) {` with `if (size - n < 6) {` in `gst_faad_sync()`."

[[finding]]
id          = "OVF_33"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_hlsdemux_tsreader_find_pcrs_id3` (`subprojects/gst-plugins-bad/ext/hls/gsthlsdemux-util.c`), after extracting the ID3 `PRIV` sample's buffer with `tag_buf = gst_sample_get_buffer (priv_data);` and mapping it, the code does `pts = GST_READ_UINT64_BE (info.data);` without first checking that `info.size >= 8`. Since the `PRIV` frame content comes from an attacker-controlled ID3v2 tag embedded in the HLS (ID3/AAC) segment, a malformed tag with a shorter-than-8-byte `com.apple.streaming.transportStreamTimestamp` payload causes this to read past the end of the mapped buffer region."
locations   = ["subprojects/gst-plugins-bad/ext/hls/gsthlsdemux-util.c:328-337"]
fix         = "Check the mapped size before reading 8 bytes, e.g.:\n```c\n  if (!gst_buffer_map (tag_buf, &info, GST_MAP_READ))\n    goto out;\n\n  if (info.size < 8) {\n    gst_buffer_unmap (tag_buf, &info);\n    goto out;\n  }\n\n  pts = GST_READ_UINT64_BE (info.data);\n```"

[[finding]]
id          = "OVF_34"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "`gst_isacdec_plc()` computes `nb_plc_frames = duration / (30 * GST_MSECOND);` from `GST_BUFFER_DURATION (input)`, which is derived from upstream timestamp/gap information and is not sanity-checked. It then allocates `nb_plc_frames * MAX_OUTPUT_SIZE` bytes via `gst_audio_decoder_allocate_output_buffer()`. `nb_plc_frames` is a `guint` and `MAX_OUTPUT_SIZE` is `1920`; for `nb_plc_frames` greater than roughly 2.24 million (i.e. a gap duration of about 18.6 hours), the 32-bit unsigned multiplication wraps around, producing a much smaller allocation than intended. More generally, since there is no upper bound on `duration`/`nb_plc_frames`, a large (attacker- or corruption-induced) gap duration also causes an unbounded, potentially huge allocation (hundreds of MB to GB) purely from a crafted timestamp discontinuity, which is a straightforward memory-exhaustion / integer-overflow risk fed by untrusted stream timing data."
locations   = ["subprojects/gst-plugins-bad/ext/isac/gstisacdec.c:158-186"]
fix         = "Clamp `nb_plc_frames` to a sane maximum before allocating/decoding, e.g.: `nb_plc_frames = duration / (30 * GST_MSECOND);\\nif (nb_plc_frames > MAX_REASONABLE_PLC_FRAMES) {\\n  GST_WARNING_OBJECT (self, \"Clamping excessive PLC frame count %u\", nb_plc_frames);\\n  nb_plc_frames = MAX_REASONABLE_PLC_FRAMES;\\n}` and compute the allocation size using a 64-bit (`gsize`) multiplication explicitly, e.g. `(gsize) nb_plc_frames * MAX_OUTPUT_SIZE`."

[[finding]]
id          = "OVF_35"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_libde265_dec_handle_frame` in `libde265-dec.c`, when parsing packetized (length-prefixed) NAL units, `nal_size` is declared as a signed `int` and built by shifting in up to `dec->length_size` (up to 4, derived from attacker-controlled `hvcC` extradata) bytes: `nal_size = (nal_size << 8) | start_data[i];`. If `dec->length_size == 4` and the top bit of the length field is set (a length >= 0x80000000), `nal_size` becomes negative. The subsequent bounds check `if (start_data + dec->length_size + nal_size > end_data)` then effectively subtracts from the pointer instead of adding, so the intended overflow guard can be bypassed, and a negative `nal_size` is passed straight to `de265_push_NAL`, which can result in an out-of-bounds/oversized read interpreted from crafted/corrupt HEVC bitstream data."
locations   = ["subprojects/gst-plugins-bad/ext/libde265/libde265-dec.c:793-816"]
fix         = "Accumulate the length in an unsigned type and reject values that don't fit, e.g.: `guint32 nal_size = 0; ... nal_size = (nal_size << 8) | start_data[i]; ... if (nal_size > (guint32)(end_data - start_data - dec->length_size)) { /* error */ }` before calling `de265_push_NAL`."

[[finding]]
id          = "OVF_36"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "easy"
description = "The `learning-rate` property of `segmentation` is a `g_param_spec_float` with range `[0, 1]` (see `PROP_LEARNING_RATE` installation), so a user/pipeline can legally set `learning-rate=0`. `gst_segmentation_set_caps` then computes `segmentation->learning_interval = (int) (1.0 / segmentation->learning_rate);`, which divides by zero, producing `+inf` as a `double`, and then casts that `inf` to `int` — converting a floating-point value that is outside the range of the destination integer type is undefined behavior in C++."
locations   = ["subprojects/gst-plugins-bad/ext/opencv/gstsegmentation.cpp:329"]
fix         = "Clamp/validate `learning_rate` before dividing, e.g.: `gdouble rate = segmentation->learning_rate > 0 ? segmentation->learning_rate : DEFAULT_LEARNING_RATE; segmentation->learning_interval = (int) (1.0 / rate);`, or reject `0` in `gst_segmentation_set_property` for `PROP_LEARNING_RATE`."

[[finding]]
id          = "OVF_37"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_openexr_dec_parse`, once a valid header has already been located (`parsed_size != 0`, meaning a previous call already consumed the 8-byte magic/flags via `gst_video_decoder_add_to_frame`), the function calls `gst_adapter_masked_scan_uint32_peek (adapter, 0xffffffff, 0x762f3101, 8, size - 8 - 4, NULL)` where `size = gst_adapter_available (adapter)` is an unsigned `gsize`. If the adapter currently holds fewer than 12 bytes (which is a normal occurrence when upstream delivers data in small chunks, since `parse()` is re-invoked as each new buffer arrives), `size - 8 - 4` underflows to a huge `gsize` value. That bogus size is passed straight into `gst_adapter_masked_scan_uint32_peek`, whose precondition `offset + size <= adapter->size` is violated, tripping a `g_return_val_if_fail` (a `g_critical` that aborts the process under common fuzzing/testing configurations such as `G_DEBUG=fatal-warnings`, and always at least produces incorrect/undefined scanning behavior)."
locations   = ["subprojects/gst-plugins-bad/ext/openexr/gstopenexrdec.cpp:236"]
fix         = "Guard the computation so it can't underflow, e.g.: `if (size < 12) goto need_more_data;` before computing `offset = gst_adapter_masked_scan_uint32_peek (adapter, 0xffffffff, 0x762f3101, 8, size - 12, NULL);`, mirroring the existing `size < 8` check done for the `parsed_size == 0` branch."

[[finding]]
id          = "OVF_38"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "In the same function `gst_flups_demux_handle_dvd_event`, the `dvd-set-audio-track` handler does `stream_id = demux->audio_stream_map[stream_id % MAX_DVD_AUDIO_STREAMS];` with `stream_id` taken directly from the (application/navigation supplied) `physical-id` field of the event, without validating it is non-negative first. A negative `stream_id` produces a negative array index into `demux->audio_stream_map` (an inline `gint[MAX_DVD_AUDIO_STREAMS]` field of `GstFluPSDemux`), reading adjacent struct fields as if they were the mapped stream id. The bogus value is then used unchecked as `demux->streams[stream_id]`, which can be an arbitrary out-of-range index into the heap-allocated `streams` pointer array, and the resulting garbage pointer is subsequently dereferenced (`temp->pad`)."
locations   = ["subprojects/gst-plugins-bad/ext/resindvd/gstmpegdemux.c:808-830"]
fix         = "Validate `stream_id` before indexing `audio_stream_map`:\n\nBefore:\n```\n    if (gst_structure_get_int (structure, \"physical-id\", &stream_id)) {\n      stream_id = demux->audio_stream_map[stream_id % MAX_DVD_AUDIO_STREAMS];\n      temp = demux->streams[stream_id];\n```\nAfter:\n```\n    if (gst_structure_get_int (structure, \"physical-id\", &stream_id) &&\n        stream_id >= 0 && stream_id < MAX_DVD_AUDIO_STREAMS) {\n      stream_id = demux->audio_stream_map[stream_id];\n      temp = demux->streams[stream_id];\n```"

[[finding]]
id          = "OVF_39"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_gl_effects_xray`, the horizontal and vertical 7-tap Gaussian blur passes call `gst_gl_shader_set_uniform_1fv (shader, \"kernel\", 9, gauss_kernel)`, passing a count of `9` while `gauss_kernel` is declared as `static float gauss_kernel[7]` and filled by `fill_gaussian_kernel (gauss_kernel, 7, 1.5)`. This reads 2 floats past the end of the 7-element array and uploads them as part of the `kernel[7]` uniform array declared in `hconv7_fragment_source_gles2` / `vconv7_fragment_source_gles2` (both declare `uniform float kernel[7];`). Sibling effects `gst_gl_effects_blur` (gstgleffectblur.c) and `gst_gl_effects_glow` (gstgleffectglow.c) correctly pass a count of `7` for the same shaders, confirming this is a mismatched count rather than intentional."
locations   = ["subprojects/gst-plugins-base/ext/gl/effects/gstgleffectxray.c:29", "subprojects/gst-plugins-base/ext/gl/effects/gstgleffectxray.c:48-55", "subprojects/gst-plugins-base/ext/gl/effects/gstgleffectxray.c:58-65"]
fix         = "Pass the correct element count matching the array size and shader declaration:\n```c\ngst_gl_shader_set_uniform_1fv (shader, \"kernel\", 7, gauss_kernel);\n```\n(both occurrences, mirroring `gstgleffectblur.c` and `gstgleffectglow.c`)."

[[finding]]
id          = "OVF_40"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_gl_bumper_init_resources`, `raw_data = (guchar *) malloc (sizeof (guchar) * width * height * 3)` and `rows = (guchar **) malloc (sizeof (guchar *) * height)` are never checked for `NULL`; on allocation failure the subsequent `for (y = 0; y < height; ++y) rows[y] = ...` and `png_read_image (png_ptr, rows)` would write through a NULL/invalid pointer. Additionally, `bit_depth` returned by `png_get_IHDR` is never validated: for a 16-bit-per-channel `PNG_COLOR_TYPE_RGB` image, libpng's `png_read_image` writes 6 bytes per pixel into `rows`, but `raw_data` was sized assuming 3 bytes per pixel (8-bit), causing a heap buffer overflow. (This code path is currently dead per the separate `gstglbumper.c` build-exclusion finding, so it is not reachable in the shipped binary today.)"
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglbumper.c:223-262"]
fix         = "Reject unsupported bit depths and check allocations:\n```c\nif (bit_depth != 8) {\n  fclose (fp);\n  png_destroy_read_struct (&png_ptr, png_infopp_NULL, png_infopp_NULL);\n  LOAD_ERROR (context, \"unsupported bit depth\");\n}\nraw_data = malloc (...);\nif (!raw_data) { ... }\nrows = malloc (...);\nif (!rows) { free (raw_data); ... }\n```"

[[finding]]
id          = "OVF_41"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "easy"
description = "`gst_buffer_extract_dup()` computes `alloc_size = MIN (real_size - offset, size)` without ever validating that `offset <= real_size` (unlike sibling functions such as `gst_buffer_copy_into()` which explicitly do `g_return_val_if_fail (bufsize >= offset, FALSE)`). Since `real_size` and `offset` are both `gsize` (unsigned), passing an `offset` larger than the buffer's size makes `real_size - offset` wrap around to a huge value; `MIN()` against `size` then just yields `size`, so the function allocates `size` bytes via `g_malloc()` even though there is no data to extract. `gst_buffer_extract()` subsequently returns `0` (since `offset` is out of range), so `*dest_size` ends up `0` while `*dest` points at a freshly, needlessly allocated (and uninitialized) buffer of `size` bytes instead of `NULL`."
locations   = ["subprojects/gstreamer/gst/gstbuffer.c:2598-2614"]
fix         = "Guard against `offset` exceeding the buffer size before doing the subtraction, mirroring the checks used elsewhere in `gstbuffer.c`:\n\n```c\nvoid\ngst_buffer_extract_dup (GstBuffer * buffer, gsize offset, gsize size,\n    gpointer * dest, gsize * dest_size)\n{\n  gsize real_size, alloc_size;\n\n  real_size = gst_buffer_get_size (buffer);\n\n  if (offset >= real_size) {\n    *dest = NULL;\n    *dest_size = 0;\n    return;\n  }\n\n  alloc_size = MIN (real_size - offset, size);\n  ...\n```"

[[finding]]
id          = "OVF_42"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "`gst_buffer_list_new_sized()` rounds the caller-supplied `size` up with `n_allocated = GST_ROUND_UP_16 (size)`, where `GST_ROUND_UP_16(num)` expands to `(((num)+15)&~15)` (`subprojects/gstreamer/gst/gstutils.h:881`). Both `size` and `n_allocated` are plain `guint`, so a `size` close to `G_MAXUINT` (e.g. `0xFFFFFFF8`) makes `num+15` wrap around, producing an `n_allocated` far smaller than requested (it can even wrap to `0`). The subsequent `slice_size = sizeof (GstBufferList) + (n_allocated - 1) * sizeof (gpointer)` then either silently allocates a much smaller buffer array than the caller asked for, or - if `n_allocated` wraps to `0` - underflows `n_allocated - 1` to `G_MAXUINT` and multiplies it by `sizeof (gpointer)`, requesting a huge allocation that will abort the process via GLib's default out-of-memory behavior. Note that `gst_buffer_list_insert()`'s own growth path explicitly guards against this exact class of overflow with `if (G_UNLIKELY (list->n_allocated > (G_MAXUINT / 2))) g_error (...)` before doubling (`subprojects/gstreamer/gst/gstbufferlist.c:429-430`), but `gst_buffer_list_new_sized()` has no equivalent guard on its own rounding step."
locations   = ["subprojects/gstreamer/gst/gstbufferlist.c:149-170"]
fix         = "Clamp or reject pathologically large `size` values before rounding, e.g.:\n\n```c\nGstBufferList *\ngst_buffer_list_new_sized (guint size)\n{\n  GstBufferList *list;\n  gsize slice_size;\n  guint n_allocated;\n\n  if (size == 0)\n    size = 1;\n\n  if (G_UNLIKELY (size > G_MAXUINT - 15))\n    g_error (\"Requested GstBufferList size would overflow\");\n\n  n_allocated = GST_ROUND_UP_16 (size);\n  ...\n```"

[[finding]]
id          = "OVF_43"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "easy"
description = "`gst_byte_array_interface_append` computes `self->len + size` (both `gsize`) without checking for overflow before calling `gst_byte_array_interface_set_size`. If a caller passes a very large `size` (e.g. derived from an attacker-controlled length field during buffer/format parsing), the addition wraps around to a small value. `gst_byte_array_interface_set_size` then succeeds with a small reallocation, `self->len` is updated to the wrapped (small) value, and `gst_byte_array_interface_append` still returns `self->data + orig` where `orig` is the original, much larger length. The caller (e.g. `gst_byte_array_interface_append_data`, which then does `memcpy (ptr, data, size)` with the original huge `size`) will write far past the actual allocation, corrupting the heap."
locations   = ["subprojects/gstreamer/gst/gstbytearrayinterface.h:99-106", "subprojects/gstreamer/gst/gstbytearrayinterface.h:119-127"]
fix         = "Check for overflow before growing the array:\n\n```c\nstatic inline guint8 *\ngst_byte_array_interface_append (GstByteArrayInterface *self, gsize size)\n{\n  gsize orig = self->len;\n  if (size > G_MAXSIZE - orig)\n    return NULL;\n  if (!gst_byte_array_interface_set_size (self, orig + size))\n    return NULL;\n  return self->data + orig;\n}\n```\n\nThis makes the overflow case fail cleanly via the existing `NULL`/`FALSE` return contract instead of silently under-allocating."

[[finding]]
id          = "OVF_44"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "`gst_element_do_foreach_pad()` in `subprojects/gstreamer/gst/gstelement.c` allocates its snapshot array with `pads = g_newa (GstPad *, n_pads + 1);` where `n_pads` comes directly from the element's live pad count (`element->numpads`/`numsrcpads`/`numsinkpads`, a `guint16`, so up to 65535). `g_newa` expands to `alloca`, so an element with a very large number of pads (e.g. a muxer/demuxer or `funnel`-like element with many thousands of request pads) can allocate hundreds of kilobytes on the calling thread's stack in a single call to the public `gst_element_foreach_pad()` / `gst_element_foreach_sink_pad()` / `gst_element_foreach_src_pad()` APIs, risking stack overflow on threads with a constrained stack size."
locations   = ["subprojects/gstreamer/gst/gstelement.c:1363-1398"]
fix         = "Use heap allocation instead of `alloca` for the pad snapshot, e.g. replace `pads = g_newa (GstPad *, n_pads + 1);` with `pads = g_new (GstPad *, n_pads + 1);` and add a matching `g_free (pads);` before returning, so the size of the temporary array is not bounded by the (potentially unbounded) number of pads on the element."

[[finding]]
id          = "OVF_45"
type        = "overflow_underflow"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_ring_buffer_logger_log()`, the stale-thread eviction check is `if (log->last_use + logger->thread_timeout * G_USEC_PER_SEC >= now)` (`subprojects/gstreamer/gst/gstinfo.c:4535`). `logger->thread_timeout` is a `guint` and `G_USEC_PER_SEC` expands to the `int` literal `1000000`; per the usual arithmetic conversions the multiplication `logger->thread_timeout * G_USEC_PER_SEC` is performed as unsigned 32-bit arithmetic and wraps around (modulo 2^32) once `thread_timeout` exceeds about 4295 seconds (~71.5 minutes). For example `thread_timeout = 4300` yields `4300 * 1000000 = 4300000000`, which wraps to `5000004` (about 5 seconds) instead of the intended ~71.6 minutes. This silently causes per-thread ring-buffer logs to be evicted far sooner than the caller configured for any `thread_timeout` above ~4295, defeating `gst_debug_add_ring_buffer_logger()`'s documented timeout semantics."
locations   = ["subprojects/gstreamer/gst/gstinfo.c:4526-4546"]
fix         = "Force 64-bit arithmetic for the multiplication, e.g.:\n```c\nif (log->last_use + (gint64) logger->thread_timeout * G_USEC_PER_SEC >= now)\n  break;\n```"

[[finding]]
id          = "OVF_46"
type        = "overflow_underflow"
severity    = "low"
difficulty  = "medium"
description = "`ges_multi_file_uri_new` (`subprojects/gst-editing-services/ges/ges-multi-file-source.c`) computes `indices = uri + prefix_size;` (where `prefix_size = strlen (\"multifile://\")`) whenever `uri` contains an `'@'` character, without first checking that `uri` actually starts with (or is at least as long as) the `\"multifile://\"` prefix. `ges_multi_file_source_new()` is a public `GES_API` entry point (declared in `ges-multi-file-source.h`), and while the sole in-tree caller (`ges-uri-asset.c`) always checks `g_str_has_prefix` first, external callers of the public API are not required to do so. If called directly with a short string containing `'@'` but not the expected prefix (e.g. `\"a@b\"`), `uri + prefix_size` produces a pointer past the end of the allocated string, and the subsequent `strchr (indices, ':')` dereferences that out-of-bounds pointer."
locations   = ["subprojects/gst-editing-services/ges/ges-multi-file-source.c:137-169"]
fix         = "Validate the prefix before doing prefix-based pointer arithmetic, e.g.: `if (!g_str_has_prefix (uri, GES_MULTI_FILE_URI_PREFIX)) { GST_ERROR (\"Invalid multifile uri: %s\", uri); uri_data->location = g_strdup (uri); return uri_data; }` before computing `indices = uri + prefix_size;`."

[[finding]]
id          = "OVF_47"
type        = "overflow_underflow"
severity    = "low"
difficulty  = "very_easy"
description = "In `gst_ffmpeg_log_callback`, `len = strlen (fmt); if (fmt[len - 1] == '\\n')` reads `fmt[-1]` (an out-of-bounds read before the start of the buffer) whenever libav/ffmpeg calls the log callback with an empty format string (`fmt[0] == '\\0'`, so `len == 0`)."
locations   = ["subprojects/gst-libav/ext/libav/gstav.c:118-119"]
fix         = "Guard against an empty string before indexing:\n```\nlen = strlen (fmt);\nif (len > 0 && fmt[len - 1] == '\\n') {\n  fmt2 = g_strdup (fmt);\n  fmt2[len - 1] = '\\0';\n}\n```"

[[finding]]
id          = "OVF_48"
type        = "overflow_underflow"
severity    = "low"
difficulty  = "easy"
description = "`GstMPEGDescriptor::data_length` is declared as `guint8` in `gstmpegdesc.h`, but `gst_mpeg_descriptor_parse` computes the total descriptor size as a `guint` (`total`, accumulated over an arbitrary number of descriptors, each up to 255 bytes) and stores it with `result->data_length = total;`. If the combined descriptor data exceeds 255 bytes, the assignment silently truncates, so `gst_mpeg_descriptor_find`/`gst_mpeg_descriptor_nth` (which iterate using `desc->data_length`) will stop scanning long before the end of the actual data that was `memcpy`'d into `result->data`, silently failing to find descriptors located after byte 255."
locations   = ["subprojects/gst-plugins-bad/ext/resindvd/gstmpegdesc.c:93-98", "subprojects/gst-plugins-bad/ext/resindvd/gstmpegdesc.h:236-240"]
fix         = "Widen `data_length` to match the type used to compute it:\n\nBefore (`gstmpegdesc.h`):\n```\ntypedef struct {\n  guint    n_desc;\n  guint8   data_length;\n  guint8  *data;\n} GstMPEGDescriptor;\n```\nAfter:\n```\ntypedef struct {\n  guint    n_desc;\n  guint    data_length;\n  guint8  *data;\n} GstMPEGDescriptor;\n```"

[[finding]]
id          = "OVF_49"
type        = "overflow_underflow"
severity    = "negligible"
difficulty  = "medium"
description = "`gst_event_new_qos` validates `diff` with `g_return_val_if_fail (diff >= 0 || -diff <= timestamp, NULL);`. If `diff` equals `G_MININT64`, negating it (`-diff`) is signed integer overflow, which is undefined behavior in C. This requires an extreme, essentially unreachable `GstClockTimeDiff` value in practice, but the check itself is not overflow-safe."
locations   = ["subprojects/gstreamer/gst/gstevent.c:1223-1245"]
fix         = "Guard against `diff == G_MININT64` before negating, e.g. compare using `diff >= 0 || timestamp >= (guint64) (-(diff + 1)) + 1` or cast to unsigned before negating to avoid signed-overflow UB."

[[finding]]
id          = "LOGIC_1"
type        = "logic_error"
severity    = "high"
difficulty  = "medium"
description = "`send_http_request` in `subprojects/gst-devtools/validate/gst/validate/gst-validate-http-actions.c` builds an `HTTP/1.1` request but never sends a `Connection: close` header, and it does not parse/use the response's `Content-Length` (or handle chunked transfer-encoding). The response-reading loop (`while ((bytes_read = g_input_stream_read (...)) > 0)`) only terminates when the peer closes the socket. Against any compliant HTTP/1.1 server that keeps connections alive by default (the normal case for most real web servers/frameworks), this call will block forever waiting for more bytes that will never arrive, hanging the `http-request` validate action indefinitely."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-http-actions.c:121-133", "subprojects/gst-devtools/validate/gst/validate/gst-validate-http-actions.c:150-159"]
fix         = "Either send `Connection: close\\r\\n` in the request headers so the server closes the socket after responding, or parse the `Content-Length`/chunked-encoding of the response to know exactly how many bytes to read instead of relying on end-of-stream. Minimal fix: add a `Connection: close` header, e.g. change\n```c\n  g_string_append_printf (request,\n      \"%s %s HTTP/1.1\\r\\n\"\n      \"Host: %s:%d\\r\\n\"\n      \"Content-Type: %s\\r\\n\",\n      params->method,\n      params->path, params->host, params->port, params->content_type);\n```\nto also include `\"Connection: close\\r\\n\"` in the format string."

[[finding]]
id          = "LOGIC_2"
type        = "logic_error"
severity    = "high"
difficulty  = "medium"
description = "In `GstValidateEncodingTestInterface.check_encoded_file`, the duration-tolerance check uses a Python chained comparison: `if orig_duration - tolerance >= duration <= orig_duration + tolerance:`. This is evaluated as `(orig_duration - tolerance >= duration) and (duration <= orig_duration + tolerance)`, which is only true when `duration <= orig_duration - tolerance` (i.e. the transcoded file is *too short*). If the transcoded file's duration is *too long* (`duration > orig_duration + tolerance`), the first sub-condition is `False`, so the whole expression is `False` and the code falls through to the `else` branch that only checks caps, silently accepting a badly-too-long transcoded output as if the duration matched."
locations   = ["subprojects/gst-devtools/validate/launcher/baseclasses.py:1530"]
fix         = "Use an explicit range/absolute-difference check instead of the misleading chained comparison, e.g.:\n```python\nif abs(duration - orig_duration) >= tolerance:\n```\ninstead of `if orig_duration - tolerance >= duration <= orig_duration + tolerance:`."

[[finding]]
id          = "LOGIC_3"
type        = "logic_error"
severity    = "high"
difficulty  = "easy"
description = "`ges_auto_transition_set_source` always calls `_disconnect_from_source (self, self->previous_source)` regardless of the `edge` argument, before deciding whether `source` should replace `self->previous_source` or `self->next_source`. When called with `edge == GES_EDGE_END` (as done from `ges-uri-clip.c` when `transition->next_source == orig_source`), the function disconnects the signal handlers from the wrong element (`previous_source`, which is unrelated to this call) and never disconnects `neighbour_changed_cb`/`_track_changed_cb` from the actual element being replaced (`self->next_source`, i.e. `orig_source`). As a result: (1) `previous_source` silently loses its `notify::start`/`notify::priority`/`notify::duration`/`notify::track` connections even though it was not being replaced, breaking auto-transition updates for it; and (2) the old `next_source` (`orig_source`) keeps a dangling signal connection to `self` even after `self->next_source` is overwritten with the new element. If `self` (the `GESAutoTransition`) is later finalized while `orig_source` is still alive and connected, `ges_auto_transition_finalize` will try to disconnect using the now-current `self->next_source` (the new element) instead of `orig_source`, leaving `orig_source` connected to a freed `self` pointer - a use-after-free when `orig_source` next emits `notify::start` etc."
locations   = ["subprojects/gst-editing-services/ges/ges-auto-transition.c:141-152", "subprojects/gst-editing-services/ges/ges-uri-clip.c:404-413"]
fix         = "Disconnect from the source that is actually being replaced, based on `edge`, e.g.: `void ges_auto_transition_set_source (GESAutoTransition * self, GESTrackElement * source, GESEdge edge) { if (edge == GES_EDGE_END) { _disconnect_from_source (self, self->next_source); self->next_source = source; } else { _disconnect_from_source (self, self->previous_source); self->previous_source = source; } _connect_to_source (self, source); }` instead of unconditionally disconnecting `self->previous_source`."

[[finding]]
id          = "LOGIC_4"
type        = "logic_error"
severity    = "high"
difficulty  = "easy"
description = "In `_save_to_uri`, the return value and error of `g_output_stream_write_all()` are discarded: `ret` is immediately overwritten by the subsequent `g_output_stream_close()` call, and `lerror` is reused for `g_output_stream_close()` even if it was already set by a failed `g_output_stream_write_all()`. If writing the serialized project fails but closing the (partially written) stream succeeds, `ret` ends up `TRUE` and the function reports success even though the file was not fully/correctly written, silently corrupting/truncating the saved project. In addition, passing an already-set `lerror` into `g_output_stream_close (..., &lerror)` violates the `GError` contract (a non-`NULL` `*error` must not be passed to a function expecting `GError**`), which can trigger a critical warning and/or leave the close operation not actually performed."
locations   = ["subprojects/gst-editing-services/ges/ges-base-xml-formatter.c:328-336"]
fix         = "Check the write result before closing, and do not reuse an already-set `GError`, e.g.: `if (!g_output_stream_write_all (stream, str->str, str->len, NULL, NULL, &lerror)) { g_output_stream_close (stream, NULL, NULL); ret = FALSE; } else { ret = g_output_stream_close (stream, NULL, &lerror); }` instead of unconditionally doing `ret = g_output_stream_write_all (...); ret = g_output_stream_close (stream, NULL, &lerror);`."

[[finding]]
id          = "LOGIC_5"
type        = "logic_error"
severity    = "high"
difficulty  = "very_easy"
description = "In `_set_duration` (the `GESTimelineElement::set_duration` vmethod for `GESClip`), the code takes a defensive snapshot via `children = ges_container_get_children (container, FALSE);` with the comment `/* get copy of children, since GESContainer may resort the clip */`, but the following loop iterates over the live `container->children` list instead of the `children` snapshot: `for (tmp = container->children; tmp; tmp = g_list_next (tmp))`. Calling `_set_duration0` on each child can trigger notify callbacks that resort/mutate `container->children` (this is exactly the scenario the comment warns about), so iterating the live list while it can be mutated risks skipping elements or walking a `GList` node that has been unlinked/freed. The sibling function `_set_start` (a few lines above, same file) was fixed to loop over the `children` copy in commit `74ae0ba5dfec3e873ec6467e67b267b5a9f2de61`, but `_set_duration` was left iterating `container->children`, which is a copy-paste divergence."
locations   = ["subprojects/gst-editing-services/ges/ges-clip.c:1390-1409"]
fix         = "Iterate over the snapshot list `children`, matching `_set_start`:\nBefore:\n```c\n  for (tmp = container->children; tmp; tmp = g_list_next (tmp)) {\n    GESTimelineElement *child = (GESTimelineElement *) tmp->data;\n\n    if (child != container->initiated_move)\n      _set_duration0 (GES_TIMELINE_ELEMENT (child), duration);\n  }\n```\nAfter:\n```c\n  for (tmp = children; tmp; tmp = g_list_next (tmp)) {\n    GESTimelineElement *child = (GESTimelineElement *) tmp->data;\n\n    if (child != container->initiated_move)\n      _set_duration0 (GES_TIMELINE_ELEMENT (child), duration);\n  }\n```"

[[finding]]
id          = "LOGIC_6"
type        = "logic_error"
severity    = "high"
difficulty  = "medium"
description = "`ges_timeline_element_set_timeline()` is the one public setter in `GESTimelineElement` that was not converted to use the `_LOCK`/`_UNLOCK` (i.e. `_timeline_element_lock`/`_timeline_element_unlock`) scheme that every other public setter (`ges_timeline_element_set_start`, `set_parent`, `set_duration`, `set_name`, etc.) now uses, even though the whole point of the `ges: add internal locking to all public API functions` change was to make every public entry point mutually exclusive on the same per-element lock (the timeline's `dyn_mutex` when parented, or `priv->api_lock` when orphan). Instead, `ges_timeline_element_set_timeline()` only takes the short-lived `priv->timeline_lock` around isolated reads/writes of the `self->timeline` field, and releases it before performing the actual `timeline_add_element()`/`timeline_remove_element()` work. This creates two separate problems: (1) a TOCTOU race - two threads calling `ges_timeline_element_set_timeline()` concurrently (e.g. one adding to `tlA`, one adding to `tlB`) can both observe `self->timeline == NULL` under the lock, both release it, and then both proceed to call `timeline_add_element()`, so `self` ends up registered in two timelines' internal structures even though `self->timeline` can only end up pointing at one of them; (2) `set_timeline()` runs fully unsynchronized with respect to every other locked setter/getter on the same element (`ges_timeline_element_set_start()`, `get_start()`, etc. all take `_LOCK`, which is based on `self->timeline` and the timeline's recursive `dyn_mutex`), so a thread inside e.g. `ges_timeline_element_set_start()` (holding the old timeline's `dyn_mutex`) can race with a concurrent `set_timeline(self, NULL)` mutating `self->timeline` and unregistering `self` from that same timeline, corrupting the tree/list state the other call is relying on."
locations   = ["subprojects/gst-editing-services/ges/ges-timeline-element.c:1170-1221"]
fix         = "Make `ges_timeline_element_set_timeline()` participate in the same locking discipline as every other public setter, e.g. by acquiring `_LOCK(self)`/`_UNLOCK(self)` for the whole check-and-mutate critical section (reading `self->timeline`, calling `timeline_add_element()`/`timeline_remove_element()`, and writing `self->timeline`) instead of only guarding the individual field reads/writes with `priv->timeline_lock`:\n```c\n/* before */\ng_mutex_lock (&self->priv->timeline_lock);\nif (self->timeline == timeline) { g_mutex_unlock (&self->priv->timeline_lock); return TRUE; }\nif (timeline != NULL && G_UNLIKELY (self->timeline != NULL)) { g_mutex_unlock (&self->priv->timeline_lock); goto had_timeline; }\ng_mutex_unlock (&self->priv->timeline_lock);\n/* ... timeline_add_element()/timeline_remove_element() run unlocked ... */\ng_mutex_lock (&self->priv->timeline_lock);\nself->timeline = timeline;\ng_mutex_unlock (&self->priv->timeline_lock);\n```\n```c\n/* after */\n_LOCK (self);\nif (self->timeline == timeline) { _UNLOCK (self); return TRUE; }\nif (timeline != NULL && G_UNLIKELY (self->timeline != NULL)) { _UNLOCK (self); goto had_timeline; }\n/* ... timeline_add_element()/timeline_remove_element(), still under the lock ... */\nself->timeline = timeline;\n_UNLOCK (self);\n```\nThis ensures `set_timeline()` is mutually exclusive with all other locked accessors/mutators on `self`, and that the check-then-act sequence for adding/removing from a timeline is atomic."

[[finding]]
id          = "LOGIC_7"
type        = "logic_error"
severity    = "high"
difficulty  = "medium"
description = "In `ges_demux_adapt_timeline_duration` (subprojects/gst-editing-services/plugins/ges/gesdemux.c), when a nested `GESTimeline` is shorter than the parent `NleObject`'s `inpoint + duration`, a filler `GES_TYPE_TEST_CLIP` is added to pad out the timeline. The clip is set with `\"start\", timeline_duration` and `\"duration\", inpoint + duration`. But `inpoint + duration` is the *absolute end position* required, not the *length* of the gap to fill. Since the clip already starts at `timeline_duration`, its `\"duration\"` property should be `inpoint + duration - timeline_duration` (the actual missing length), matching exactly what the very next `GST_INFO_OBJECT` log line computes and prints (`GST_TIME_ARGS (inpoint + duration - timeline_duration)`). As written, the filler clip's end position becomes `timeline_duration + (inpoint + duration)`, which massively over-extends the nested timeline far beyond what's actually needed."
locations   = ["subprojects/gst-editing-services/plugins/ges/gesdemux.c:360-404"]
fix         = "Use the actual missing length for the clip duration, consistent with the log message right below it:\nBefore:\n```c\ng_object_set (clip, \"start\", timeline_duration, \"duration\",\n    inpoint + duration, \"vpattern\", GES_VIDEO_TEST_PATTERN_SMPTE75, NULL);\n```\nAfter:\n```c\ng_object_set (clip, \"start\", timeline_duration, \"duration\",\n    inpoint + duration - timeline_duration, \"vpattern\",\n    GES_VIDEO_TEST_PATTERN_SMPTE75, NULL);\n```"

[[finding]]
id          = "LOGIC_8"
type        = "logic_error"
severity    = "high"
difficulty  = "hard"
description = "In `refine_start_stop_in_region_above_priority` (subprojects/gst-editing-services/plugins/nle/nlecomposition.c), the out-parameters `rstart`/`rstop` are guarded with `if (*rstart)` / `if (*rstop)` instead of `if (rstart)` / `if (rstop)`. This dereferences the pointer and checks the *value currently pointed to* (which, since `rstart == &start` and `nstart` was initialized from that same `start` value, is simply the value passed in before this function ran any refinement) rather than checking whether the pointer itself is non-NULL. The sole caller, `get_clean_toplevel_stack`, passes `&start`/`&stop` where `start`/`stop` frequently hold `0` (e.g. whenever the earliest active `NleObject` in the composition starts at position 0, which is the common case for a fresh/rewound timeline). When that happens, `*rstart` is `0` (falsy), so `*rstart = nstart;` is skipped even though `nstart` may have been updated by the STOP-list loop to a different, correct refined value - silently discarding a legitimate stack-boundary refinement precisely in the most common playback-start scenario."
locations   = ["subprojects/gst-editing-services/plugins/nle/nlecomposition.c:2333-2337"]
fix         = "Check pointer validity instead of the pointed-to value:\nBefore:\n```c\n  if (*rstart)\n    *rstart = nstart;\n\n  if (*rstop)\n    *rstop = nstop;\n```\nAfter:\n```c\n  if (rstart)\n    *rstart = nstart;\n\n  if (rstop)\n    *rstop = nstop;\n```"

[[finding]]
id          = "LOGIC_9"
type        = "logic_error"
severity    = "high"
difficulty  = "easy"
description = "In `gst_ffmpegaudenc_receive_packet`, when the encoded `AVPacket` carries `AV_PKT_DATA_SKIP_SAMPLES` side data, `av_packet_get_side_data` correctly retrieves a pointer `side_data` and length `side_data_length` pointing at the 10-byte side-data buffer (a separate allocation from the packet's compressed payload). However, the code then builds `GstByteReader reader = GST_BYTE_READER_INIT (pkt->data, pkt->size)` using the packet's compressed payload instead of `side_data`/`side_data_length`, and reads the clip `start`/`end` values with `gst_byte_reader_get_uint32_le_unchecked` from that reader. This both misinterprets the compressed audio payload bytes as clipping metadata (producing bogus `GstAudioClippingMeta` values) and, because the reads are `_unchecked`, can read past the end of `pkt->data` if the encoded packet is smaller than 8 bytes."
locations   = ["subprojects/gst-libav/ext/libav/gstavaudenc.c:619-637"]
fix         = "Initialize the reader from the side-data buffer instead of the packet payload: replace `GstByteReader reader = GST_BYTE_READER_INIT (pkt->data, pkt->size);` with `GstByteReader reader = GST_BYTE_READER_INIT (side_data, side_data_length);` so `start`/`end` are decoded from the actual `AV_PKT_DATA_SKIP_SAMPLES` side data."

[[finding]]
id          = "LOGIC_10"
type        = "logic_error"
severity    = "high"
difficulty  = "very_easy"
description = "In `gst_avtp_rvf_pay_new_caps()`, the pulldown frame-rate branch has a misplaced `goto error;`. The intent is clearly to only fail when the pulldown formula doesn't match (the `else` of the inner `if`), but because the `else` body of the inner `if` is not braced, `goto error;` is executed unconditionally for every `fps_down != fps_up` case - even when `(info.fps_n * 1001) == info.fps_d * 1000 * fps_up` succeeds and `AVTP_RVF_FIELD_PD` was just correctly set to `1`. As a result, any legitimate NTSC/pulldown framerate (e.g. 29.97, 23.976 fps) always causes `gst_avtp_rvf_pay_new_caps()` to fail, making `avtprvfpay` unusable with any pulldown framerate despite the code explicitly trying to support it."
locations   = ["subprojects/gst-plugins-bad/ext/avtp/gstavtprvfpay.c:245-253"]
fix         = "Brace the `else` branch so `goto error;` only runs on the actual failure path:\n```c\n  // before\n  } else {\n    if ((info.fps_n * 1001) == info.fps_d * 1000 * fps_up)\n      avtp_rvf_pdu_set (pdu, AVTP_RVF_FIELD_PD, 1);\n    else\n      GST_ERROR_OBJECT (avtprvfpay, \"Unsupported frame rate\");\n    goto error;\n  }\n\n  // after\n  } else {\n    if ((info.fps_n * 1001) == info.fps_d * 1000 * fps_up) {\n      avtp_rvf_pdu_set (pdu, AVTP_RVF_FIELD_PD, 1);\n    } else {\n      GST_ERROR_OBJECT (avtprvfpay, \"Unsupported frame rate\");\n      goto error;\n    }\n  }\n```"

[[finding]]
id          = "LOGIC_11"
type        = "logic_error"
severity    = "high"
difficulty  = "easy"
description = "In `gst_lcms_process_rgb` (`subprojects/gst-plugins-bad/ext/colormanagement/gstlcms.c`), when transforming into a separate output frame (non-in-place case), the per-component byte offsets `out_offsets[0..3]` are computed with `GST_VIDEO_FRAME_COMP_OFFSET (inframe, ...)` instead of `GST_VIDEO_FRAME_COMP_OFFSET (outframe, ...)`. Since different packed RGB layouts (e.g. `GST_VIDEO_FORMAT_ARGB` vs `GST_VIDEO_FORMAT_RGBA` vs `GST_VIDEO_FORMAT_BGRA`) place their R/G/B/A bytes at different offsets within a pixel, using the input frame's offsets to index the output buffer writes color channel bytes to the wrong position whenever `in_info` and `out_info` use different pixel layouts (this is precisely the case `gst_lcms_set_info` allows, since it only forces in-place processing when `cms_inp_format == cms_dst_format`)."
locations   = ["subprojects/gst-plugins-bad/ext/colormanagement/gstlcms.c:764-798"]
fix         = "Compute `out_offsets` from `outframe` instead of `inframe`: change `out_offsets[0] = GST_VIDEO_FRAME_COMP_OFFSET (inframe, 0);` (and the following three lines for indices 1-3) to `out_offsets[0] = GST_VIDEO_FRAME_COMP_OFFSET (outframe, 0);` etc."

[[finding]]
id          = "LOGIC_12"
type        = "logic_error"
severity    = "high"
difficulty  = "medium"
description = "In `subprojects/gst-plugins-bad/ext/dtls/gstdtlsdec.c`, `create_connection()` connects a `notify::connection-state` signal handler on the newly created `self->connection` via `g_signal_connect (self->connection, \"notify::connection-state\", G_CALLBACK (on_connection_state_changed), self);` but never stores the returned handler id into `self->signal_state_changed` (the field declared for exactly this purpose in `GstDtlsDec` in `gstdtlsdec.h`). As a result `self->signal_state_changed` always stays `0`, and `clear_signals()` (called from `gst_dtls_dec_dispose` and from `create_connection` when replacing an existing connection) can never disconnect this handler because of the `if (self->signal_state_changed) { ... }` guard. Since `self->connection` can be handed to and kept alive by another element (via `gst_dtls_dec_fetch_connection()`, used by `gstdtlsenc.c`) independently of the `GstDtlsDec` instance's lifetime, the connection object can outlive `self`. When that surviving connection later changes state and emits `notify::connection-state`, `on_connection_state_changed()` is invoked with the already-freed `self` pointer as `user_data`, causing a use-after-free."
locations   = ["subprojects/gst-plugins-bad/ext/dtls/gstdtlsdec.c:859-862", "subprojects/gst-plugins-bad/ext/dtls/gstdtlsdec.c:763-782", "subprojects/gst-plugins-bad/ext/dtls/gstdtlsdec.h:69"]
fix         = "Store the signal id returned by `g_signal_connect` in `create_connection`, e.g. change `g_signal_connect (self->connection, \"notify::connection-state\", G_CALLBACK (on_connection_state_changed), self);` to `self->signal_state_changed = g_signal_connect (self->connection, \"notify::connection-state\", G_CALLBACK (on_connection_state_changed), self);` so that `clear_signals()` can actually disconnect it, mirroring how `signal_notify_id` is handled in `gstdtlsenc.c`."

[[finding]]
id          = "LOGIC_13"
type        = "logic_error"
severity    = "high"
difficulty  = "easy"
description = "In `gst_lc3_dec_handle_frame()`, the intended sanity check that the input buffer size equals `frame_bytes * channels` is dead code. The function first returns `GST_FLOW_ERROR` when `in_map.size == 0 && !do_plc`. The very next check reuses the exact same already-falsified condition as part of an `&&`: `if (G_UNLIKELY (in_map.size == 0 && !do_plc) && (in_map.size != (lc3_dec->frame_bytes * lc3_dec->channels))) goto mixed_frames;`. Since execution only reaches this line when `in_map.size == 0 && !do_plc` is already `FALSE` (otherwise it would have returned above), the whole `if` condition is always `FALSE`, so `mixed_frames` can never be reached. This means a buffer whose size does not match `frame_bytes * channels` (e.g. shorter than expected, from a malformed/truncated `audio/x-lc3` stream) is never rejected. The decode loop then reads `lc3_dec->frame_bytes` bytes per channel at `in_map.data + (c * lc3_dec->frame_bytes)` regardless of the real mapped size, causing an out-of-bounds read on `in_map.data` for undersized buffers."
locations   = ["subprojects/gst-plugins-bad/ext/lc3/gstlc3dec.c:271-282", "subprojects/gst-plugins-bad/ext/lc3/gstlc3dec.c:294-300"]
fix         = "Remove the redundant/duplicated clause so the size mismatch is actually checked for non-empty buffers. Before: `if (G_UNLIKELY (in_map.size == 0 && !do_plc) &&\\n      (in_map.size != (lc3_dec->frame_bytes * lc3_dec->channels)))\\n    goto mixed_frames;`. After: `if (!do_plc &&\\n      in_map.size != (lc3_dec->frame_bytes * lc3_dec->channels))\\n    goto mixed_frames;`."

[[finding]]
id          = "LOGIC_14"
type        = "logic_error"
severity    = "high"
difficulty  = "medium"
description = "In `rsn_dvdsrc_do_still`, `src->branch_lock` is locked unconditionally before the timed-still handling (either at `resindvdsrc.c:668` on first entry or `resindvdsrc.c:675` on re-entry). For a finite still (`duration != 255`), the code only unlocks `branch_lock` inside the `if (src->still_time_remaining > 0) { ... }` block (either via the early `return TRUE` at line 744, preceded by `g_mutex_unlock (&src->branch_lock)` at line 724, or naturally falling through after that unlock). If `src->still_time_remaining` is `0` (which happens on the very first call when the DVD supplies a still of `0` seconds, i.e. `duration == 0` from untrusted disc data at `resindvdsrc.c:636`, or after a previous timed-out wait set it to exactly `0`), the whole `if` block at `resindvdsrc.c:710-746` is skipped and execution falls straight through to the `dvdnav_still_skip` / event-push code and returns `TRUE` at `resindvdsrc.c:775` while `branch_lock` remains held forever. Every later caller that takes `branch_lock` (e.g. `rsn_dvdsrc_unlock`, `rsn_dvdsrc_step`, `rsn_dvdsrc_perform_button_action`, another call to `rsn_dvdsrc_do_still`) will then deadlock permanently."
locations   = ["subprojects/gst-plugins-bad/ext/resindvd/resindvdsrc.c:707-773"]
fix         = "Ensure `branch_lock` is always released once the `duration != 255` branch is entered, even when `still_time_remaining` is `0`. For example:\n```c\n    if (src->still_time_remaining > 0) {\n      gint64 end_time;\n      ...\n      if (was_signalled) {\n        ...\n        return TRUE;\n      }\n    } else {\n      g_mutex_unlock (&src->branch_lock);\n    }\n\n    /* Else timed out, end the still */\n    ...\n```\ninstead of only unlocking inside the `still_time_remaining > 0` path."

[[finding]]
id          = "LOGIC_15"
type        = "logic_error"
severity    = "high"
difficulty  = "medium"
description = "`gst_alsasink_prepare` checks `if (alsa->iec958) { snd_pcm_close (alsa->handle); alsa->handle = gst_alsa_open_iec958_pcm (...); ... }` before calling `alsasink_parse_spec (alsa, spec)`, but it is `alsasink_parse_spec` itself that computes and sets `alsa->iec958` for the *current* `spec` (it starts with `alsa->iec958 = FALSE;`). On the very first `prepare()` call for a passthrough format (AC3/EAC3/DTS/MPEG), `alsa->iec958` is still `FALSE` from `gst_alsasink_init`, so the special IEC958 PCM device is never opened for that negotiation; `set_hwparams`/`set_swparams` then configure the regular (non-SPDIF) handle with the S16_BE passthrough format, silently sending garbled data to the wrong ALSA device. It also has no path to switch back to the normal handle if a later `prepare()` moves from passthrough back to raw audio."
locations   = ["subprojects/gst-plugins-base/ext/alsa/gstalsasink.c:938-960"]
fix         = "Parse the spec first, then reopen the device if IEC958 is required: ```c\nif (!alsasink_parse_spec (alsa, spec))\n  goto spec_parse;\n\nif (alsa->iec958) {\n  snd_pcm_close (alsa->handle);\n  alsa->handle = gst_alsa_open_iec958_pcm (GST_OBJECT (alsa), alsa->device);\n  if (G_UNLIKELY (!alsa->handle))\n    goto no_iec958;\n}\n```"

[[finding]]
id          = "LOGIC_16"
type        = "logic_error"
severity    = "high"
difficulty  = "hard"
description = "The background PNG image loaded by `gst_gl_differencematte_loader` into `differencematte->pixbuf` is never uploaded to the GPU. `init_pixbuf_texture` allocates `differencematte->newbgtexture` via `gst_gl_base_memory_alloc (tex_alloc, params)` with `gst_gl_video_allocation_params_new (..., NULL, ...)` (no initial data pointer), and nowhere in the file is there a call that copies `differencematte->pixbuf`'s pixel data into `newbgtexture` (no `gst_gl_memory` map/write, no `glTexImage2D`/`glTexSubImage2D`). Immediately after `init_pixbuf_texture` runs, `gst_gl_differencematte_filter_texture` frees `differencematte->pixbuf` (`free (differencematte->pixbuf); differencematte->pixbuf = NULL;`) without it ever having been used. `gst_gl_differencematte_interp` then binds `differencematte->newbgtexture->tex_id` as the `base` sampler, so the composited output always uses an uninitialized/blank GPU texture instead of the configured background image from `location` -- the element's advertised \"replace background with a loaded image\" feature is non-functional."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldifferencematte.c:326-358", "subprojects/gst-plugins-base/ext/gl/gstgldifferencematte.c:462-505", "subprojects/gst-plugins-base/ext/gl/gstgldifferencematte.c:579-587"]
fix         = "Upload the decoded pixel data into `newbgtexture` after allocation, e.g. via a mapped write:\n```c\ndifferencematte->newbgtexture =\n    (GstGLMemory *) gst_gl_base_memory_alloc (tex_alloc, params);\nif (differencematte->pixbuf) {\n  GstMapInfo map;\n  if (gst_memory_map (GST_MEMORY_CAST (differencematte->newbgtexture), &map, GST_MAP_WRITE)) {\n    memcpy (map.data, differencematte->pixbuf,\n        differencematte->pbuf_width * differencematte->pbuf_height * 4);\n    gst_memory_unmap (GST_MEMORY_CAST (differencematte->newbgtexture), &map);\n  }\n}\n```\n(or pass the data directly through the allocation params' data pointer instead of `NULL`), before freeing `differencematte->pixbuf`."

[[finding]]
id          = "LOGIC_17"
type        = "logic_error"
severity    = "high"
difficulty  = "medium"
description = "`gst_gl_effects_get_fragment_shader()` calls `gst_gl_shader_new_link_with_stages()`; if that fails, `shader` remains `NULL` and a `GST_ELEMENT_ERROR` is emitted, but execution falls through to `filter->draw_attr_position_loc = gst_gl_shader_get_attribute_location (shader, \"a_position\")` with `shader == NULL`, and then `g_hash_table_insert (effects->shaderstable, (gchar *) shader_name, shader)` stores a `NULL` value keyed by `shader_name`. `gst_gl_shader_get_attribute_location()` only guards against `NULL` with `g_return_val_if_fail`, logging a critical warning and corrupting `draw_attr_position_loc`/`draw_attr_texture_loc` to `-1` rather than aborting the operation. Callers of `gst_gl_effects_get_fragment_shader()` receive this `NULL` shader back and later pass it to functions like `gst_gl_shader_use()`, which will dereference it. In addition, the `GError *error` set by the failed link call is never freed (`g_clear_error`/`g_error_free` is never called), leaking it."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgleffects.c:561-600"]
fix         = "Bail out before touching the shader further and free the error:\n```c\n    if (!(shader = gst_gl_shader_new_link_with_stages (context, &error,\n                gst_glsl_stage_new_default_vertex (context),\n                gst_glsl_stage_new_with_strings (context, GL_FRAGMENT_SHADER,\n                    GST_GLSL_VERSION_NONE,\n                    GST_GLSL_PROFILE_ES | GST_GLSL_PROFILE_COMPATIBILITY, 2,\n                    frag_strs), NULL))) {\n      GST_ELEMENT_ERROR (effects, RESOURCE, NOT_FOUND,\n          (\"Failed to initialize %s shader\", shader_name), (\"%s\", error->message));\n      g_clear_error (&error);\n      return NULL;\n    }\n\n    filter->draw_attr_position_loc =\n        gst_gl_shader_get_attribute_location (shader, \"a_position\");\n    filter->draw_attr_texture_loc =\n        gst_gl_shader_get_attribute_location (shader, \"a_texcoord\");\n  }\n\n  g_hash_table_insert (effects->shaderstable, (gchar *) shader_name, shader);\n```"

[[finding]]
id          = "LOGIC_18"
type        = "logic_error"
severity    = "high"
difficulty  = "medium"
description = "`_gst_log_ctx_get_id_literal()` (`subprojects/gstreamer/gst/gstinfo.c:783-795`) builds the throttling hash key with `g_strdup_printf (\"%s:%d/%p/%s/%s\", ..., (ctx->hash_flags & GST_LOG_CONTEXT_IGNORE_OBJECT) ? \"\" : object_id, ...)`. Since `GST_LOG_CONTEXT_DEFAULT` is `0` (no flags set) and `object_id`/`id` is documented and used as nullable throughout this file (\"or NULL if none\"), any log-with-context call made without an explicit id/object string (e.g. `gst_debug_log_with_context()`, `gst_debug_log_id_with_context()`, or the internal `_gst_debug_log_once()`/`_gst_debug_log_once_id()` used for `GST_*_ONCE` style macros) reaches this function with `object_id == NULL` while `GST_LOG_CONTEXT_IGNORE_OBJECT` is not set, passing `NULL` directly as a `%s` argument to `g_strdup_printf`. Passing a null pointer for `%s` is undefined behaviour in C and, unlike glibc, some libc implementations (e.g. musl) do not special-case it and will crash. This is inconsistent with the rest of the file, which elsewhere always guards nullable strings before using them with `%s` (e.g. `s ? s : \"(NULL)\"` in `gst_info_describe_event`/`gst_info_describe_message`/`gst_info_describe_query`)."
locations   = ["subprojects/gstreamer/gst/gstinfo.c:783-795", "subprojects/gstreamer/gst/gstinfo.c:1015-1022", "subprojects/gstreamer/gst/gstinfo.c:3180-3193"]
fix         = "Guard the nullable fields before formatting, e.g.:\n```c\n(ctx->hash_flags & GST_LOG_CONTEXT_IGNORE_OBJECT) ? \"\" : (object_id ? object_id : \"\"),\n```"

[[finding]]
id          = "LOGIC_19"
type        = "logic_error"
severity    = "high"
difficulty  = "very_easy"
description = "In subprojects/gstreamer/gst/gstinfo.h, the macros `GST_ERROR_ONCE_ID`, `GST_WARNING_ONCE_ID`, `GST_INFO_ONCE_ID`, `GST_DEBUG_ONCE_ID`, `GST_LOG_ONCE_ID`, `GST_FIXME_ONCE_ID` and `GST_TRACE_ONCE_ID` expand to calls of `GST_CTX_LEVEL_LOG_ONCE_ID(...)`, but no macro or function named `GST_CTX_LEVEL_LOG_ONCE_ID` is ever defined anywhere in the file (only `GST_CAT_LEVEL_LOG_ONCE_ID`, defined a few lines above at line 1457, exists, and only `GST_CTX_LEVEL_LOG`/`GST_CTX_LEVEL_LOG_ID`, both without the `_ONCE`, exist as the `GST_CTX_` family). Any translation unit that uses one of these seven `*_ONCE_ID` macros (with `GST_DISABLE_GST_DEBUG` undefined, i.e. normal debug builds) will fail to compile with an undeclared-identifier / implicit-function-declaration error, since the preprocessor leaves `GST_CTX_LEVEL_LOG_ONCE_ID(...)` untouched as a literal (non-existent) function call."
locations   = ["subprojects/gstreamer/gst/gstinfo.h:1465-1471"]
fix         = "Fix the typo to reference the macro that actually exists, `GST_CAT_LEVEL_LOG_ONCE_ID`:\n```c\n-#define GST_ERROR_ONCE_ID(id,...)     GST_CTX_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_ERROR,id,__VA_ARGS__)\n-#define GST_WARNING_ONCE_ID(id,...)   GST_CTX_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_WARNING,id,__VA_ARGS__)\n-#define GST_INFO_ONCE_ID(id,...)      GST_CTX_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_INFO,id,__VA_ARGS__)\n-#define GST_DEBUG_ONCE_ID(id,...)     GST_CTX_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_DEBUG,id,__VA_ARGS__)\n-#define GST_LOG_ONCE_ID(id,...)       GST_CTX_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_LOG,id,__VA_ARGS__)\n-#define GST_FIXME_ONCE_ID(id,...)     GST_CTX_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_FIXME,id,__VA_ARGS__)\n-#define GST_TRACE_ONCE_ID(id,...)     GST_CTX_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_TRACE,id,__VA_ARGS__)\n+#define GST_ERROR_ONCE_ID(id,...)     GST_CAT_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_ERROR,id,__VA_ARGS__)\n+#define GST_WARNING_ONCE_ID(id,...)   GST_CAT_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_WARNING,id,__VA_ARGS__)\n+#define GST_INFO_ONCE_ID(id,...)      GST_CAT_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_INFO,id,__VA_ARGS__)\n+#define GST_DEBUG_ONCE_ID(id,...)     GST_CAT_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_DEBUG,id,__VA_ARGS__)\n+#define GST_LOG_ONCE_ID(id,...)       GST_CAT_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_LOG,id,__VA_ARGS__)\n+#define GST_FIXME_ONCE_ID(id,...)     GST_CAT_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_FIXME,id,__VA_ARGS__)\n+#define GST_TRACE_ONCE_ID(id,...)     GST_CAT_LEVEL_LOG_ONCE_ID(GST_CAT_DEFAULT,GST_LEVEL_TRACE,id,__VA_ARGS__)\n```"

[[finding]]
id          = "LOGIC_20"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "`subprojects/gst-devtools/dots-viewer/cargo_wrapper.py` assumes `env[\"RUSTC\"]` (set by Meson via `extra_env = {'RUSTC': ' '.join(rustc.cmd_array())}` in `meson.build`) is a single executable token. When `rustc.cmd_array()` returns more than one token (e.g. when Meson configures a compiler launcher such as `ccache`/`sccache`, or an exe wrapper for cross builds, giving something like `\"sccache rustc\"`), `rustc_cmdline = shlex.split(env[\"RUSTC\"])` becomes `[\"sccache\", \"rustc\"]`. The code then does `rust_flags = rustc_cmdline[1:] + shlex.split(env.get(\"RUSTFLAGS\", \"\"))`, which folds the second token (`\"rustc\"`) into `rust_flags` as if it were a compiler flag, and finally sets `env[\"RUSTC\"] = rustc_cmdline[0]`, i.e. just `\"sccache\"`. This both truncates `RUSTC` to a launcher binary with no real compiler argument, and injects the stray literal `\"rustc\"` into `RUSTFLAGS`, which `cargo`/`rustc` will then try to interpret as a flag/filename, breaking the build whenever the Rust compiler is invoked through a multi-token command line."
locations   = ["subprojects/gst-devtools/dots-viewer/cargo_wrapper.py:94-103", "subprojects/gst-devtools/dots-viewer/meson.build:13"]
fix         = "Only treat trailing `RUSTC` tokens as flags to hunt for `--target` when they actually look like compiler flags (e.g. start with `-`), and keep the rest of `rustc_cmdline` intact in `env[\"RUSTC\"]` instead of collapsing it to `rustc_cmdline[0]`. For example, join back everything except an extracted `--target <value>` pair: `env[\"RUSTC\"] = shlex_join(rustc_cmdline)` after removing only the `--target`/value tokens from `rustc_cmdline` itself, rather than mixing `rustc_cmdline[1:]` into `RUSTFLAGS` and discarding it from `RUSTC`."

[[finding]]
id          = "LOGIC_21"
type        = "logic_error"
severity    = "medium"
difficulty  = "easy"
description = "In `subprojects/gst-devtools/dots-viewer/src/main.rs`, `GstDots::collect_dot_files` explicitly recurses into subdirectories of `gstdot_path` to find `.dot` files, and `relative_dot_path` preserves the subdirectory portion of the name when reporting it to clients. However, `dot_path_for_file` (used by `modify_time`) reconstructs the on-disk path using only `path.file_name()` joined directly onto `self.gstdot_path`, discarding any subdirectory component. For a `.dot` file that actually lives at `gstdot_path/subdir/foo.dot`, `modify_time` will instead stat `gstdot_path/foo.dot`, which either doesn't exist (silently falling back to `std::time::UNIX_EPOCH`, i.e. `creation_time: 0`) or, worse, is a different, unrelated file that happens to share the same basename at the top level, whose mtime would be wrongly reported for `foo.dot`. This corrupts the `creation_time` field sent to viewer clients over the `NewDot`/`DotRemoved` WebSocket messages for any nested `.dot` file."
locations   = ["subprojects/gst-devtools/dots-viewer/src/main.rs:176-190", "subprojects/gst-devtools/dots-viewer/src/main.rs:213-247"]
fix         = "Have `modify_time` stat the actual path it was given instead of reconstructing a flattened path via `dot_path_for_file`, e.g.:\nbefore:\n```rust\nfn modify_time(&self, path: &std::path::Path) -> u128 {\n    self.dot_path_for_file(path)\n        .metadata()\n        .map(|m| m.modified().unwrap_or(std::time::UNIX_EPOCH))\n        .unwrap_or(std::time::UNIX_EPOCH)\n        .duration_since(std::time::UNIX_EPOCH)\n        .unwrap_or_default()\n        .as_millis()\n}\n```\nafter:\n```rust\nfn modify_time(&self, path: &std::path::Path) -> u128 {\n    path.metadata()\n        .map(|m| m.modified().unwrap_or(std::time::UNIX_EPOCH))\n        .unwrap_or(std::time::UNIX_EPOCH)\n        .duration_since(std::time::UNIX_EPOCH)\n        .unwrap_or_default()\n        .as_millis()\n}\n```\nsince all call sites (`list_dots`, and the `notify` watcher callbacks) already pass the real, full filesystem path of the `.dot` file."

[[finding]]
id          = "LOGIC_22"
type        = "logic_error"
severity    = "medium"
difficulty  = "very_easy"
description = "In `_get_ref_frame_cache` (`subprojects/gst-devtools/validate/gst-libs/gst/video/gstvalidatessim.c`), the cache is looked up with `g_hash_table_lookup (self->priv->ref_frames_cache, ref_file)` but populated with `g_hash_table_insert (self->priv->ref_frames_cache, g_strdup (ref_dir), frames)`. Since `ref_file` is a full wildcard path (e.g. `.../ref-*.png`) while `ref_dir` is only its directory name (`g_path_get_dirname (ref_file)`), the lookup key and the insert key never match. As a result the cache lookup always misses, and every call to `gst_validate_ssim_compare_image_file`/`_get_ref_file_path` re-enumerates the reference directory and rebuilds the whole `GArray` of `Frame` entries from scratch, defeating the entire purpose of `_get_ref_frame_cache`."
locations   = ["subprojects/gst-devtools/validate/gst-libs/gst/video/gstvalidatessim.c:621", "subprojects/gst-devtools/validate/gst-libs/gst/video/gstvalidatessim.c:660-661"]
fix         = "Use the same key for lookup and insert, e.g. look up by `ref_dir` instead of `ref_file`:\nBefore:\n```c\nframes = g_hash_table_lookup (self->priv->ref_frames_cache, ref_file);\n```\nAfter:\n```c\nframes = g_hash_table_lookup (self->priv->ref_frames_cache, ref_dir);\n```"

[[finding]]
id          = "LOGIC_23"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "In `_check_directory` (`subprojects/gst-devtools/validate/gst-libs/gst/video/gstvalidatessim.c`), when a corresponding `compared_file` is not found (`!g_file_test (compared_file, G_FILE_TEST_IS_REGULAR)`), the code skips calling `gst_validate_ssim_compare_image_files` (so `*mean`/`*lowest` are left unchanged, i.e. still holding the values from the previous iteration) but then unconditionally executes `min_avg = MIN (min_avg, *mean); min_min = MIN (min_min, *lowest); total_avg += *mean;` right after the `if/else`. This means a missing file's stale/previous-file statistics get folded into `min_avg`, `min_min` and, worse, `total_avg` (which is later divided only by `nfiles`, not counting the skipped file), silently corrupting the reported average/min similarity when any file is missing from the compared directory."
locations   = ["subprojects/gst-devtools/validate/gst-libs/gst/video/gstvalidatessim.c:843-880"]
fix         = "Only update the running statistics when a comparison actually happened, e.g. move the three statistics-update lines inside the `else` branch that performs the comparison, instead of after the whole `if (!g_file_test (...)) { ... } else { ... }` block:\nBefore:\n```c\n} else {\n  ref_file = g_build_path (...);\n  if (!gst_validate_ssim_compare_image_files (...)) { nfailures++; res = FALSE; }\n  else { nfiles++; }\n}\n\nmin_avg = MIN (min_avg, *mean);\nmin_min = MIN (min_min, *lowest);\ntotal_avg += *mean;\n```\nAfter:\n```c\n} else {\n  ref_file = g_build_path (...);\n  if (!gst_validate_ssim_compare_image_files (...)) { nfailures++; res = FALSE; }\n  else { nfiles++; }\n\n  min_avg = MIN (min_avg, *mean);\n  min_min = MIN (min_min, *lowest);\n  total_avg += *mean;\n}\n```"

[[finding]]
id          = "LOGIC_24"
type        = "logic_error"
severity    = "medium"
difficulty  = "very_easy"
description = "`gst_validate_action_get_clocktime` is declared to return `gboolean`, but on one failure path it does `return -1;` instead of `return FALSE;`. Since `gboolean` is a plain `gint`, `-1` is a non-zero (truthy) value. Every caller uses the idiom `if (!gst_validate_action_get_clocktime (...)) { report error; }`, so `!(-1)` evaluates to `FALSE` and the caller believes the call succeeded even though `retval` was never written and an error was logged."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:994-998"]
fix         = "Return `FALSE` instead of `-1`. Before: `if (!tmpvalue) {\\n  GST_INFO_OBJECT (scenario, \"Could not find %s (%\" GST_PTR_FORMAT \")\", name, action->structure);\\n  return -1;\\n}` After: `if (!tmpvalue) {\\n  GST_INFO_OBJECT (scenario, \"Could not find %s (%\" GST_PTR_FORMAT \")\", name, action->structure);\\n  return FALSE;\\n}`"

[[finding]]
id          = "LOGIC_25"
type        = "logic_error"
severity    = "medium"
difficulty  = "very_easy"
description = "In `_execute_wait_for_signal`, `non_blocking` is computed by calling `gst_structure_get_boolean (action->structure, \"non-blocking\", &non_blocking)` and assigning its *return value* (which only indicates whether the field exists and is a boolean) back to `non_blocking`, instead of using the value written through the output pointer. As a result, whenever the `non-blocking` field is explicitly present in the action (with either `true` or `false`), `non_blocking` ends up `TRUE` regardless of the actual value specified, because the function's success return code (`TRUE`) overwrites whatever was just written into `non_blocking`. Explicitly setting `non-blocking=false` therefore silently behaves as `non-blocking=true`."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:3618-3620"]
fix         = "Initialize the flag and ignore the return value. Before: `non_blocking =\\n    gst_structure_get_boolean (action->structure, \"non-blocking\",\\n    &non_blocking);` After: `non_blocking = FALSE;\\ngst_structure_get_boolean (action->structure, \"non-blocking\", &non_blocking);`"

[[finding]]
id          = "LOGIC_26"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "`GstValidateMixerTestsGenerator.populate_tests` calls `range(len(uri_minfo_special_scenarios) / self.num_sources)`. In Python 3, `/` is true division, so this expression is a `float`, and `range()` requires an `int` argument. Whenever this generator is used without an explicit `mixed_srcs` dict (the `if not self.mixed_srcs:` branch), this line raises `TypeError: 'float' object cannot be interpreted as an integer`."
locations   = ["subprojects/gst-devtools/validate/launcher/apps/gstvalidate.py:651"]
fix         = "Use integer division: `range(len(uri_minfo_special_scenarios) // self.num_sources)` (as `for uri, minfo in wanted_ressources` iteration further down suggests `wanted_ressources` should be used here as well, but at minimum the division must be integer)."

[[finding]]
id          = "LOGIC_27"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "`ges_effect_asset_id_get_type_and_bindesc()` in `ges-effect-asset.c` splits `id` with `g_strsplit (id, \" \", 2)`. When `id` is exactly `\"audio\"` or `\"video\"` (no bin description part), `typebin_desc[1]` is `NULL`, so `user_bindesc` becomes `NULL` and `bindesc = g_strdup (user_bindesc)` is `NULL`. This `NULL` `bindesc` is then passed to `gst_parse_bin_from_description()`, which immediately fails its `g_return_val_if_fail (bin_description != NULL, NULL)` guard *without* setting `*error`. The function then returns `NULL` while leaving `*error` untouched, breaking the API contract that callers rely on (e.g. `extractable_check_id()` in `ges-effect.c` propagates this `NULL`/no-error state up through `ges_asset_request()`), leading to silent failures with no diagnostic message for a very plausible malformed effect asset ID (e.g. loaded from an untrusted `.xges` project file)."
locations   = ["subprojects/gst-editing-services/ges/ges-effect-asset.c:391-422"]
fix         = "Validate that a bin description actually follows the `audio`/`video` prefix before using it:\n```c\n  typebin_desc = g_strsplit (id, \" \", 2);\n  if (!g_strcmp0 (typebin_desc[0], \"audio\") && typebin_desc[1]) {\n    *track_type = GES_TRACK_TYPE_AUDIO;\n    user_bindesc = typebin_desc[1];\n  } else if (!g_strcmp0 (typebin_desc[0], \"video\") && typebin_desc[1]) {\n    *track_type = GES_TRACK_TYPE_VIDEO;\n    user_bindesc = typebin_desc[1];\n  } else {\n    *track_type = GES_TRACK_TYPE_UNKNOWN;\n    user_bindesc = id;\n  }\n```\nand/or set `*error` before returning `NULL` when `gst_parse_bin_from_description()` fails."

[[finding]]
id          = "LOGIC_28"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "In `extractable_get_parameters_from_id()` (`ges-effect-clip.c`), the video branch writes the property name using the raw loop index `i` (`params[i].name = \"video-bin-description\";`) while the value is always written using the running valid-parameter count `*n_params - 1` (`g_value_init (&params[*n_params - 1].value, ...)`). These two indices are only equal as long as every iteration successfully matches `GES_TRACK_TYPE_AUDIO`/`GES_TRACK_TYPE_VIDEO`. If an earlier `effects_desc[]` segment fails to resolve to a valid track type (`continue`d, e.g. an id like `\"foo||video some-bin\"` where `\"foo\"` doesn't parse as a `GStreamer` bin), `i` and `*n_params - 1` diverge: the `name` field is written to `params[i]` while the corresponding `value` is written to a different slot `params[*n_params - 1]`. This leaves one `GParameter` with `name == NULL` (from `g_new0`) paired with a valid string `value`, and another slot with a valid `name` but a still-zeroed, uninitialized `GValue`. The caller (`ges_asset_extract_default()` in `ges-asset.c`) then calls `g_object_new_with_properties()` with a `NULL` property name, silently dropping the intended `video-bin-description`/`audio-bin-description` property."
locations   = ["subprojects/gst-editing-services/ges/ges-effect-clip.c:81-101"]
fix         = "Use the same index for both the name and the value, e.g. track a separate write index:\n```c\nfor (i = 0; effects_desc[i] && i < 2; i++) {\n  bin_desc = ges_effect_asset_id_get_type_and_bindesc (effects_desc[i], &ttype, NULL);\n  gint idx;\n\n  if (ttype == GES_TRACK_TYPE_AUDIO || ttype == GES_TRACK_TYPE_VIDEO) {\n    idx = (*n_params)++;\n    params[idx].name = (ttype == GES_TRACK_TYPE_AUDIO) ?\n        \"audio-bin-description\" : \"video-bin-description\";\n    g_value_init (&params[idx].value, G_TYPE_STRING);\n    g_value_set_string (&params[idx].value, bin_desc);\n  } else {\n    GST_ERROR (\"Could not find effect type for %s\", effects_desc[i]);\n  }\n  g_free (bin_desc);\n}\n```"

[[finding]]
id          = "LOGIC_29"
type        = "logic_error"
severity    = "medium"
difficulty  = "easy"
description = "In `find_element_for_property` (`ges-structured-interface.c`), the fallback branch meant to derive the property name from the structure's own name (for a `set-<property>` structure) is broken: `gchar *tmpstr = *property_name;` captures the value that was just tested to be `NULL` (that's how we entered the `if (*property_name == NULL)` branch), and then `*property_name = g_strdup (&tmpstr[4]);` computes `g_strdup(NULL + 4)`, i.e. dereferences an invalid pointer built from a null pointer plus 4, instead of using `&name[4]` (the local `name` variable, which was just verified via `REPORT_UNLESS` to have the `\"set-\"` prefix). Although all three current call sites always populate `property_name` via a mandatory `GET_AND_CHECK` before calling this helper (so the branch is presently unreachable), the branch itself is a clear defect that will crash (or read out-of-bounds memory) as soon as it is exercised, e.g. by a future caller that passes a `NULL` property name."
locations   = ["subprojects/gst-editing-services/ges/ges-structured-interface.c:248-258"]
fix         = "Use the already-validated `name` string instead of the null `tmpstr`:\nBefore:\n```c\n  if (*property_name == NULL) {\n    gchar *tmpstr = *property_name;\n    const gchar *name = gst_structure_get_name (structure);\n\n    REPORT_UNLESS (g_str_has_prefix (name, \"set-\"), err,\n        \"Could not find any property name in %\" GST_PTR_FORMAT, structure);\n\n    *property_name = g_strdup (&tmpstr[4]);\n\n    g_free (tmpstr);\n  }\n```\nAfter:\n```c\n  if (*property_name == NULL) {\n    const gchar *name = gst_structure_get_name (structure);\n\n    REPORT_UNLESS (g_str_has_prefix (name, \"set-\"), err,\n        \"Could not find any property name in %\" GST_PTR_FORMAT, structure);\n\n    *property_name = g_strdup (&name[4]);\n  }\n```"

[[finding]]
id          = "LOGIC_30"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "In `prepare_seek_action()`, `GError *err = NULL;` is declared and later checked with `if (err) { ...report error...; goto done; }` after computing `start`/`stop` via `ges_timeline_get_frame_time (timeline, fstart)`. However `ges_timeline_get_frame_time()` does not take a `GError **` parameter at all, so `err` is never assigned anywhere in the function; the `if (err)` checks are always false (dead code, apparently copy-pasted from `_edit()` which does use a real `err` out-parameter). Consequently an invalid frame number (which makes `ges_timeline_get_frame_time()` return `GST_CLOCK_TIME_NONE` after only logging a `g_return_val_if_fail` critical) is never detected here: the code proceeds to `gst_structure_set (action->structure, \"start\"/\"stop\", G_TYPE_UINT64, GST_CLOCK_TIME_NONE, NULL)` and hands the corrupted seek target to `type->overriden_type->prepare (action)` instead of reporting a validate action error."
locations   = ["subprojects/gst-editing-services/ges/ges-validate.c:1062-1090"]
fix         = "Check the actual return value of `ges_timeline_get_frame_time()`/validity of `start`/`stop` instead of the always-NULL `err`, e.g.:\nbefore:\n```\n    GstClockTime start = ges_timeline_get_frame_time (timeline, fstart);\n\n    if (err) {\n      GST_VALIDATE_REPORT_ACTION (...);\n      goto done;\n    }\n```\nafter:\n```\n    GstClockTime start = ges_timeline_get_frame_time (timeline, fstart);\n\n    if (!GST_CLOCK_TIME_IS_VALID (start)) {\n      GST_VALIDATE_REPORT_ACTION (...);\n      goto done;\n    }\n```\n(and likewise for the `stop` computation)."

[[finding]]
id          = "LOGIC_31"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "In `nle_operation_add_element`, once `GST_BIN_CLASS (parent_class)->add_element (bin, element)` (i.e. `gst_bin_add_func`) succeeds, `element` is already fully parented into the `NleOperation` bin (added to the children list, ref taken, bus/clock/base-time propagated). If `get_src_pad (element)` then returns `NULL` (e.g. the element only exposes its source pad via a `GST_PAD_SOMETIMES`/`GST_PAD_REQUEST` template that hasn't been instantiated yet, even though `element_is_valid_filter` accepted it because it checked pad templates, not just live pads), the function does `return FALSE;` without undoing the `add_element`. The caller of `gst_bin_add()` then believes the element was never added and may treat/free it as still owned by them, while it is actually a permanent, unmanaged child of the bin (`operation->element` is left `NULL`, so `nle_operation_dispose`/`remove_element` will never manage or remove it)."
locations   = ["subprojects/gst-editing-services/plugins/nle/nleoperation.c:406-431"]
fix         = "Roll back the parent `add_element` call before returning `FALSE`, e.g.:\n```\nsrcpad = get_src_pad (element);\nif (!srcpad) {\n  GST_BIN_CLASS (parent_class)->remove_element (bin, element);\n  return FALSE;\n}\n```\nso the bin/element state stays consistent with the reported return value."

[[finding]]
id          = "LOGIC_32"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_mpd_client_parse_default_presentation_delay()`, when the delay string is expressed in fragments (suffix `f`/`F`), the code does `segment_duration = client->mpd_root_node->maxSegmentDuration; value *= segment_duration;` where `segment_duration` is declared as `gint64` but `maxSegmentDuration` is a `guint64` whose 'not set' sentinel is `GST_MPD_DURATION_NONE` (`(guint64)-1`, i.e. `G_MAXUINT64`). When the manifest does not specify `maxSegmentDuration`, this sentinel is reinterpreted as `gint64` `-1`, so `value *= segment_duration` silently negates `value` instead of signalling 'duration unknown'. The resulting bogus (sign-flipped) delay is then used in `gst_dash_demux_manifest_update()`/live-period lookup (`gstdashdemux.c:1027-1032`, `gst_mpd_client_add_time_difference (now, dfp * -1000)`), shifting the reference time in the wrong direction by the wrong amount when computing which live Period is currently active."
locations   = ["subprojects/gst-plugins-bad/ext/dash/gstmpdclient.c:3047-3051"]
fix         = "Check for the 'unset' sentinel before using `maxSegmentDuration`, e.g.:\nBefore:\n```\n    } else if (*endptr == 'f' || *endptr == 'F') {\n      gint64 segment_duration;\n      g_assert (client->mpd_root_node != NULL);\n      segment_duration = client->mpd_root_node->maxSegmentDuration;\n      value *= segment_duration;\n```\nAfter:\n```\n    } else if (*endptr == 'f' || *endptr == 'F') {\n      guint64 segment_duration;\n      g_assert (client->mpd_root_node != NULL);\n      segment_duration = client->mpd_root_node->maxSegmentDuration;\n      if (segment_duration == GST_MPD_DURATION_NONE) {\n        GST_ERROR (\"Cannot compute presentation delay in fragments: maxSegmentDuration is not set\");\n        return 0;\n      }\n      value *= (gint64) segment_duration;\n```"

[[finding]]
id          = "LOGIC_33"
type        = "logic_error"
severity    = "medium"
difficulty  = "very_easy"
description = "`gst_fluid_dec_close()` checks `if (fluiddec->sf) { fluid_synth_sfunload (fluiddec->synth, fluiddec->sf, 1); fluiddec->sf = -1; }`, but the sentinel used everywhere else in the file for \"no soundfont loaded\" is `-1` (set in `gst_fluid_dec_init()` and tested with `fluiddec->sf != -1` in `gst_fluid_dec_open()`), not `0`. Since `-1` is truthy in C, `close()` will call `fluid_synth_sfunload(..., -1, 1)` even when no soundfont was ever successfully loaded, and conversely would skip unloading a legitimately loaded soundfont whose id happens to be `0`."
locations   = ["subprojects/gst-plugins-bad/ext/fluidsynth/gstfluiddec.c:575-583"]
fix         = "Use the same sentinel consistently: change `if (fluiddec->sf) {` to `if (fluiddec->sf != -1) {` in `gst_fluid_dec_close()`."

[[finding]]
id          = "LOGIC_34"
type        = "logic_error"
severity    = "medium"
difficulty  = "very_easy"
description = "In `receive_enhanced_picture` in `gstlcevcdec.c`, when attaching a crop meta the code calls `ensure_output_resolution` passing `lcevc->out_alloc_width` for both the `alloc_width` and `alloc_height` arguments instead of `lcevc->out_alloc_width` and `lcevc->out_alloc_height`. This means the stored `lcevc->out_alloc_height` and the `allocation_caps` `height` field (set inside `ensure_output_resolution`) get incorrectly overwritten with the width value whenever a cropped LCEVC picture is received, corrupting the negotiated output allocation height for any downstream pool that queries it."
locations   = ["subprojects/gst-plugins-bad/ext/lcevcdecoder/gstlcevcdec.c:496-497"]
fix         = "Pass the height accumulator instead of duplicating the width one: `if (!ensure_output_resolution (lcevc, crop_width, crop_height, lcevc->out_alloc_width, lcevc->out_alloc_height)) {`"

[[finding]]
id          = "LOGIC_35"
type        = "logic_error"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_nv_ds_dewarp_set_caps`, the local variables `in_width`, `in_height`, `in_par_n`, `in_par_d` are assigned from the wrong fields of `in_info`: `in_width = in_info->height`, `in_height = in_info->width`, `in_par_n = in_info->par_d`, `in_par_d = in_info->par_n`. This double-swap causes `gst_util_fraction_multiply (in_width, in_height, in_par_n, in_par_d, &from_dar_n, &from_dar_d)` to compute the reciprocal of the actual input display aspect ratio instead of the real DAR. The resulting incorrect `from_dar_n`/`from_dar_d` is then used to decide whether letterbox/pillarbox borders are needed and to size them (`borders_w`/`borders_h`/`priv->out_rect`), producing wrong border geometry (and unnecessary/incorrect `clear_background` triggering) for any input with a non-square aspect ratio."
locations   = ["subprojects/gst-plugins-bad/ext/nvdswrapper/gstnvdsdewarp.cpp:1471-1474"]
fix         = "Assign the fields without swapping, matching the pattern already used elsewhere in the file (e.g. `gst_nv_ds_dewarp_fixate_size`): change\n```\n  in_width = in_info->height;\n  in_height = in_info->width;\n  in_par_n = in_info->par_d;\n  in_par_d = in_info->par_n;\n```\nto\n```\n  in_width = in_info->width;\n  in_height = in_info->height;\n  in_par_n = in_info->par_n;\n  in_par_d = in_info->par_d;\n```"

[[finding]]
id          = "LOGIC_36"
type        = "logic_error"
severity    = "medium"
difficulty  = "easy"
description = "`GstGrabcut::width` and `GstGrabcut::height` (declared in `gstgrabcut.h:72`) are never assigned anywhere in `gstgrabcut.cpp`, so they remain `0` for the lifetime of the element (GObject instance memory is zero-initialized and `gst_grabcut_set_caps` never sets `grabcut->width`/`grabcut->height`, unlike sibling elements such as `gstskindetect.cpp` and `gstsegmentation.cpp`, which do set these fields from `in_width`/`in_height`). As a result the check `alphapixels < (gc->width * gc->height)` in `gst_grabcut_transform_ip` always evaluates `alphapixels < 0`, which is always false since `alphapixels = countNonZero(...)` is non-negative. This makes the documented alpha-mask-driven `grabCut` path (`run_grabcut_iteration`) permanently unreachable dead code; the element always falls back to the bounding-box path regardless of the alpha channel contents."
locations   = ["subprojects/gst-plugins-bad/ext/opencv/gstgrabcut.cpp:264-287", "subprojects/gst-plugins-bad/ext/opencv/gstgrabcut.cpp:321"]
fix         = "Set `grabcut->width` and `grabcut->height` in `gst_grabcut_set_caps`, e.g.:\nBefore:\n```\n  grabcut->cvRGBin.create (size, CV_8UC3);\n```\nAfter:\n```\n  grabcut->width = in_width;\n  grabcut->height = in_height;\n  grabcut->cvRGBin.create (size, CV_8UC3);\n```"

[[finding]]
id          = "LOGIC_37"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "`gst_gl_filter_bin_set_filter()` sinks a floating ref on `filter`, assigns it to `self->filter`, and calls `_connect_filter_element()`, which first does `gst_bin_add (GST_BIN (self), self->filter)` and then links pads. If `gst_bin_add()` succeeds but the subsequent `gst_element_link_pads()` calls fail, `_connect_filter_element()` returns `FALSE` while the element is already a child of the bin. The caller's failure branch only does `gst_object_unref (self->filter); self->filter = NULL;`, dropping the local reference but never calling `gst_bin_remove()`. The half-linked filter element remains a permanent, untracked child of the `GstGLFilterBin`, still receiving state changes even though `self->filter` no longer points to it, and it can never be cleaned up or replaced through `gst_gl_filter_bin_set_filter()` again."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglfilterbin.c:160-203"]
fix         = "Remove the element from the bin before dropping the reference on partial-link failure:\n```c\n  if (filter && !_connect_filter_element (self)) {\n    if (GST_ELEMENT_PARENT (self->filter) == GST_ELEMENT_CAST (self))\n      gst_bin_remove (GST_BIN (self), self->filter);\n    else\n      gst_object_unref (self->filter);\n    self->filter = NULL;\n    return FALSE;\n  }\n```"

[[finding]]
id          = "LOGIC_38"
type        = "logic_error"
severity    = "medium"
difficulty  = "very_easy"
description = "`gst_gl_upload_element_get_unit_size` computes `ret = gst_video_info_from_caps (&info, caps)` and only sets `*size` when `ret` is true, but then unconditionally does `return TRUE;` regardless of `ret`. If `gst_video_info_from_caps` fails (e.g. caps that cannot be parsed as raw video), the function reports success to `GstBaseTransform` while `*size` is left uninitialized, propagating garbage as the negotiated buffer unit size."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgluploadelement.c:153-165"]
fix         = "Return the actual result of the parse:\n\n```c\nstatic gboolean\ngst_gl_upload_element_get_unit_size (GstBaseTransform * trans, GstCaps * caps,\n    gsize * size)\n{\n  gboolean ret;\n  GstVideoInfo info;\n\n  ret = gst_video_info_from_caps (&info, caps);\n  if (ret)\n    *size = GST_VIDEO_INFO_SIZE (&info);\n\n  return ret;\n}\n```"

[[finding]]
id          = "LOGIC_39"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "`gst_visual_setup` derives the libvisual pixel `depth` (in bits) as `depth = bscope->vinfo.finfo->pixel_stride[0]; if (bscope->vinfo.finfo->bits >= 8) depth *= 8;` before calling `visual_video_depth_enum_from_value (depth)`. `finfo->bits` is the per-component bit depth, not the pixel size, and for the `RGB16` format (also advertised in this element's `src_template` caps) it is `6` (from the `DPTH565` descriptor, i.e. max of the 5/6/5 component depths), which is `< 8`. For `RGB16`, the `*8` multiplication is therefore skipped and `depth` ends up as the raw `pixel_stride[0]` value (`2`), instead of the correct pixel depth of `16` bits. This nonsensical depth value of `2` is passed to `visual_video_depth_enum_from_value()`, breaking libvisual actor negotiation whenever downstream negotiates the `RGB16` output format. `BGRx`/`xRGB` (bits=8, pixel_stride=4 -> 32) and `BGR`/`RGB` (bits=8, pixel_stride=3 -> 24) happen to compute correctly only because their component bit depth is exactly 8."
locations   = ["subprojects/gst-plugins-base/ext/libvisual/visual.c:165-169"]
fix         = "Compute the pixel depth directly from the pixel stride (in bytes) instead of gating on the per-component bit depth:\n\n```c\n/* pixel_stride[0] is always the packed pixel size in bytes for the\n * RGB formats supported here */\ndepth = bscope->vinfo.finfo->pixel_stride[0] * 8;\n```"

[[finding]]
id          = "LOGIC_40"
type        = "logic_error"
severity    = "medium"
difficulty  = "hard"
description = "`split_and_iterate()` in `gst.c` (used to parse `--gst-plugin-path`/`GST_PLUGIN_PATH` and `--gst-plugin-load` lists) has an off-by-one bug when a list has more than `MAX_PATH_SPLIT` (16) separator-delimited entries. `g_strsplit (lastlist, separator, MAX_PATH_SPLIT)` returns at most 16 non-NULL entries `strings[0..15]`, where `strings[15]` holds the *unsplit remainder* of the string if there were more than 16 tokens. The inner loop calls `iterator (strings[j], user_data)` for every `j` including `j == 15` *before* checking `++j == MAX_PATH_SPLIT`, so the raw, still-separator-joined remainder is passed to `add_path_func`/`prepare_for_load_plugin_func` as if it were a single path/plugin name. Only after that does the code try `lastlist = g_strdup (strings[j])` with `j == MAX_PATH_SPLIT` (16), but `strings[16]` is always the array's NULL terminator, so `lastlist` becomes `NULL` and the outer `while (lastlist)` loop exits immediately. The intended continuation logic that would re-split the remainder can therefore never run, and any plugin paths/names beyond the 15th get silently mangled into one bogus, unusable entry instead of being processed individually."
locations   = ["subprojects/gstreamer/gst/gst.c:500-524"]
fix         = "Hold back the last slot as the unsplit remainder instead of feeding it to `iterator`, e.g. stop one slot earlier:\n```c\nwhile (strings[j]) {\n  if (j == MAX_PATH_SPLIT - 1 && strings[j + 1] == NULL) {\n    /* last real token, nothing left to split */\n  }\n  if (j == MAX_PATH_SPLIT - 1) {\n    lastlist = g_strdup (strings[j]);\n    j = 0;\n    break;\n  }\n  iterator (strings[j], user_data);\n  j++;\n}\n```\nso the (possibly still-joined) final chunk is only ever re-split, never passed directly to the iterator callback."

[[finding]]
id          = "LOGIC_41"
type        = "logic_error"
severity    = "medium"
difficulty  = "very_easy"
description = "In `gst_caps_features_from_string`, after copying a feature token into `tmp` (`len` bytes, with `tmp[len-1]` set to the NUL terminator), the trailing-space trimming loop initializes `p = tmp + len - 1`, which points at the NUL terminator itself rather than at the last actual character (`tmp + len - 2`). Since `*p` is `'\\0'`, the `while (*p == ' ')` loop condition is false immediately, so the loop body never executes and no trailing spaces are ever stripped. As a result, a feature string with a trailing space before a comma or before the closing parenthesis (e.g. `\"memory:Foo ,memory:Bar\"`) keeps the embedded space in `tmp`, and the very next check `strstr (tmp, \" \") != NULL` then incorrectly rejects the string as unparsable, even though trimming it was clearly the intent."
locations   = ["subprojects/gstreamer/gst/gstcapsfeatures.c:701-711"]
fix         = "Point `p` at the last content character instead of the terminator:\n\n```c\ntmp = g_malloc (len);\nmemcpy (tmp, feature, len - 1);\ntmp[len - 1] = '\\0';\n\np = tmp + len - 2;\nwhile (p >= tmp && *p == ' ') {\n  *p = '\\0';\n  p--;\n}\n```\n\n(The `p >= tmp` guard also protects against a token consisting entirely of spaces.)"

[[finding]]
id          = "LOGIC_42"
type        = "logic_error"
severity    = "medium"
difficulty  = "medium"
description = "In `gst_event_parse_qos`, the \"catch underflows\" adjustment `if (*timestamp > -offset) *timestamp += offset; else *timestamp = 0;` is only correct when `offset` (a `gint64` from `gst_event_get_running_time_offset`) is negative. When `offset` is positive (a perfectly legal value set via `gst_pad_set_offset`), `-offset` is a negative `gint64` which gets converted to `guint64` for the comparison against `*timestamp` (a `GstClockTime`/`guint64`), producing a huge unsigned value close to `G_MAXUINT64`. The comparison `*timestamp > (huge value)` is essentially always false, so the `else` branch fires and `*timestamp` is incorrectly zeroed instead of being increased by the positive offset."
locations   = ["subprojects/gstreamer/gst/gstevent.c:1278-1296"]
fix         = "Branch on the sign of `offset` explicitly instead of relying on unsigned/signed comparison of `-offset`, e.g.:\n```c\nif (offset < 0 && *timestamp < (GstClockTime) (-offset))\n  *timestamp = 0;\nelse\n  *timestamp += offset;\n```"

[[finding]]
id          = "LOGIC_43"
type        = "logic_error"
severity    = "medium"
difficulty  = "easy"
description = "`gst_meta_factory_register()` looks up an existing registry feature with `gst_registry_lookup_feature (registry, name)`, which searches the registry's single, shared `feature_hash` across ALL `GstPluginFeature` subtypes (element factories, typefind factories, device provider factories, tracer factories, other meta factories, etc.) with no type filtering - it is a plain by-name lookup. If any other plugin feature happens to share the same name as `g_type_name (meta_info->type)`, `existing_feature` is that unrelated feature, yet the code unconditionally does `GST_META_FACTORY (existing_feature)->meta_info = meta_info;`. `GST_META_FACTORY()` is a `G_TYPE_CHECK_INSTANCE_CAST`, which in a production build (cast checks disabled) performs a raw pointer reinterpretation with no verification, writing `meta_info` into whatever offset that struct layout has - corrupting an unrelated object. Note that `gst_meta_factory_find()` a few lines above, and `gst_registry_find_feature()` in general, correctly restrict the lookup to `GST_TYPE_META_FACTORY` via `g_type_is_a()`; this function does not follow the same pattern."
locations   = ["subprojects/gstreamer/gst/gstmetafactory.c:159-183"]
fix         = "Use the type-checked lookup already used by `gst_meta_factory_find()` instead of the raw by-name one:\n\n```c\nexisting_feature = gst_registry_find_feature (registry, name, GST_TYPE_META_FACTORY);\nif (existing_feature) {\n  ...\n  gst_object_unref (existing_feature);\n  return TRUE;\n}\n```\n\nThis guarantees `existing_feature` really is a `GstMetaFactory` before the `GST_META_FACTORY()` cast is used to write into it."

[[finding]]
id          = "LOGIC_44"
type        = "logic_error"
severity    = "low"
difficulty  = "easy"
description = "`iter_model_reversed` in `subprojects/gst-devtools/debug-viewer/GstDebugViewer/Plugins/Timeline.py` iterates `for i in range(count - 1, 0, -1)`, which stops at `i == 1` and never yields `model[0]`. It is used by `LineFrequencySentinel.process` to scan backward from the end of the log looking for the last row with a valid (non-zero) timestamp. Because index `0` is never visited, if every row from the end of the model down to index `1` happens to be unparsable/zero-timestamp (e.g. a short or heavily-corrupted log where only the very first line has a valid timestamp), the loop finishes without ever considering the first row, and `last_ts` stays `None`, causing the whole timeline histogram computation to silently bail out (`if last_ts is None or last_ts < first_ts: return`) even though a usable timestamp exists at index 0."
locations   = ["subprojects/gst-devtools/debug-viewer/GstDebugViewer/Plugins/Timeline.py:35-39"]
fix         = "Include index 0 in the reversed range, e.g. change `for i in range(count - 1, 0, -1):` to `for i in range(count - 1, -1, -1):` in `iter_model_reversed`."

[[finding]]
id          = "LOGIC_45"
type        = "logic_error"
severity    = "low"
difficulty  = "very_easy"
description = "In `subprojects/gst-devtools/tracer/tracer/structure.py`, `INT_TYPES` is built with `\"\".join((\"int\", \"uint\", \"int8\", ...))`, which concatenates all the type names into a single string `\"intuintint8uint8int16uint16int32uint32int64uint64\"`. The subsequent check `elif t in INT_TYPES:` therefore performs a *substring* test rather than a membership test against the intended set of type names. Any parsed GstStructure field type string that happens to be a substring of that concatenation (e.g. `\"t8\"`, `\"6\"`, `\"nt3\"`) would be incorrectly classified as an integer type and passed to `int(v)`, which can raise an uncaught `ValueError` on malformed/log input, or silently misclassify a field's type."
locations   = ["subprojects/gst-devtools/tracer/tracer/structure.py:8-10", "subprojects/gst-devtools/tracer/tracer/structure.py:95-96"]
fix         = "Use a tuple (or set/frozenset) instead of a joined string so `in` performs real membership testing:\nBefore:\n```python\nINT_TYPES = \"\".join(\n    (\"int\", \"uint\", \"int8\", \"uint8\", \"int16\", \"uint16\", \"int32\", \"uint32\", \"int64\", \"uint64\")\n)\n```\nAfter:\n```python\nINT_TYPES = (\n    \"int\", \"uint\", \"int8\", \"uint8\", \"int16\", \"uint16\", \"int32\", \"uint32\", \"int64\", \"uint64\"\n)\n```"

[[finding]]
id          = "LOGIC_46"
type        = "logic_error"
severity    = "low"
difficulty  = "very_easy"
description = "In `_check_is_key_unit_cb`, the running delta-frame counter is stored back into the action's structure using post-increment: `gst_structure_set (action->structure, \"__priv_count_bufs\", G_TYPE_INT, count_bufs++, NULL);`. The value passed to `gst_structure_set` is the *pre*-increment value of `count_bufs` (identical to what was just read), so the stored counter never actually advances across probe calls; the local increment is discarded when the function returns. This defeats the `NOT_KF_AFTER_FORCE_KF_EVT_TOLERANCE` check, since `count_bufs` read back on the next call is always the same value instead of growing."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-scenario.c:7233-7234"]
fix         = "Store the incremented value. Before: `gst_structure_set (action->structure, \"__priv_count_bufs\", G_TYPE_INT,\\n    count_bufs++, NULL);` After: `gst_structure_set (action->structure, \"__priv_count_bufs\", G_TYPE_INT,\\n    count_bufs + 1, NULL);`"

[[finding]]
id          = "LOGIC_47"
type        = "logic_error"
severity    = "low"
difficulty  = "easy"
description = "`XunitReporter.set_passed()` overrides `Reporter.set_passed()` but does not call `super().set_passed(test)`; instead it unconditionally does `self.stats['passed'] += 1`. The base class distinguishes `Result.PASSED` from `Result.KNOWN_ERROR` (incrementing `stats['known_error']` for the latter), but the XUnit reporter counts every non-failed test as `passed`, so `stats['known_error']` is never incremented when the XUnit reporter is active and the final report's \"Known error\" statistic is always 0 even though such tests occurred."
locations   = ["subprojects/gst-devtools/validate/launcher/reporters.py:231-245"]
fix         = "Call the parent implementation to keep the `known_error` bookkeeping consistent, e.g.:\n```python\ndef set_passed(self, test):\n    super().set_passed(test)\n    xml_file = codecs.open(self.tmp_xml_file.name, 'a', self.encoding, errors='replace')\n    ...\n```\ninstead of directly doing `self.stats['passed'] += 1`."

[[finding]]
id          = "LOGIC_48"
type        = "logic_error"
severity    = "low"
difficulty  = "medium"
description = "In `_sync_element_to_layer_property_float()` (`ges-audio-source.c`), `value` is an uninitialized local `gfloat`. `ges_meta_container_get_float (GES_META_CONTAINER (layer), meta, &value)` only writes to `*dest` when it returns `TRUE` (i.e. the meta field exists and is of type `G_TYPE_FLOAT`); its return value is discarded here. If the layer's meta field is missing or has the wrong type, `value` retains indeterminate stack contents and is then passed straight to `g_object_set (element, propname, value, NULL)`, setting the element's `volume` (or other float) property to garbage. In current usage `GESLayer` always registers `GES_META_VOLUME` with a default of `1.0` in `_register_metas()`, so this is not hit in the common path, but it becomes reachable if that meta is ever unset/retyped, or for future callers of this static helper with other meta keys."
locations   = ["subprojects/gst-editing-services/ges/ges-audio-source.c:60-77"]
fix         = "Initialize `value` to a sane default and/or check the return value:\nBefore:\n```c\ngfloat value;\n...\nges_meta_container_get_float (GES_META_CONTAINER (layer), meta, &value);\ng_object_set (element, propname, value, NULL);\n```\nAfter:\n```c\ngfloat value = 1.0;\n...\nif (ges_meta_container_get_float (GES_META_CONTAINER (layer), meta, &value))\n  g_object_set (element, propname, value, NULL);\n```"

[[finding]]
id          = "LOGIC_49"
type        = "logic_error"
severity    = "low"
difficulty  = "very_easy"
description = "In `ges_layer_add_clip_full()`, the priority clamp `if (_PRIORITY (clip) > LAYER_HEIGHT) { ...; _set_priority0 (GES_TIMELINE_ELEMENT (clip), LAYER_HEIGHT - 1); }` uses a strict `>` instead of `>=`. Valid in-layer priorities are `[0, LAYER_HEIGHT - 1]` (as used everywhere else, e.g. `layer_set_priority()`'s `max_nle_priority = ((priority + 1) * LAYER_HEIGHT) + MIN_NLE_PRIO`). A clip whose priority is set to exactly `LAYER_HEIGHT` (e.g. via the deprecated `ges_timeline_element_set_priority()`) passes this check unclamped, and its resulting NLE priority (`min_nle_priority + LAYER_HEIGHT`) lands exactly on the neighboring layer's `min_nle_priority`, causing the clip's underlying priority to collide with the priority space of the adjacent layer."
locations   = ["subprojects/gst-editing-services/ges/ges-layer.c:844-851"]
fix         = "Change:\n```c\n  if (_PRIORITY (clip) > LAYER_HEIGHT) {\n```\nto:\n```c\n  if (_PRIORITY (clip) >= LAYER_HEIGHT) {\n```"

[[finding]]
id          = "LOGIC_50"
type        = "logic_error"
severity    = "low"
difficulty  = "easy"
description = "In `ges_marker_list_deserialize` (`subprojects/gst-editing-services/ges/ges-marker-list.c`), when `(caps_len - i) % 2` is non-zero (an odd number of remaining structures, indicating a truncated/malformed serialized marker list), the code logs `GST_ERROR (\"Failed deserializing marker list: incomplete marker caps\")` but does not `goto done;`. Execution falls through to the parsing loop, which silently ignores the last unpaired structure (since the loop condition is `i < caps_len - 1`), and the function still returns `TRUE` at the end, so a caller believes deserialization fully succeeded despite the logged error and dropped data."
locations   = ["subprojects/gst-editing-services/ges/ges-marker-list.c:612-614"]
fix         = "Actually fail on this error condition: \n```\nif (G_UNLIKELY ((caps_len - i) % 2)) {\n  GST_ERROR (\"Failed deserializing marker list: incomplete marker caps\");\n  goto done;\n}\n```"

[[finding]]
id          = "LOGIC_51"
type        = "logic_error"
severity    = "low"
difficulty  = "very_easy"
description = "In `ghostpad_event_function`, the handling of a `GST_EVENT_SEEK` on a src ghost pad with no target uses `g_assert (\"Seeked a pad with no target SHOULD NOT HAPPEN\");`. Since the argument is a non-NULL string literal (always truthy), `g_assert` never actually fires/aborts here regardless of whether the supposedly-impossible condition occurs; the intended debug-time guard is dead and silently does nothing."
locations   = ["subprojects/gst-editing-services/plugins/nle/nleghostpad.c:584"]
fix         = "Use an assertion that actually evaluates the condition, e.g.:\n```\ng_assert_not_reached ();\n```\nor\n```\ng_assert_true (FALSE);\n```\ninstead of `g_assert (\"Seeked a pad with no target SHOULD NOT HAPPEN\");`."

[[finding]]
id          = "LOGIC_52"
type        = "logic_error"
severity    = "low"
difficulty  = "easy"
description = "In `gst_h265_2_json_chain` (`subprojects/gst-plugins-bad/ext/codec2json/gsth2652json.c`), the HEVC (`self->use_hevc`) branch's `do { ... } while (pres == GST_H265_PARSER_OK)` loop only checks `pres` to decide whether to keep iterating; it does not check `ret` (the result of `gst_h265_2_json_decode_nal`) after the inner `for` loop. Unlike the non-HEVC branch just below it, which explicitly does `if (ret != GST_FLOW_OK) break;`, a failure decoding one NAL unit in the HEVC path does not stop further parsing of subsequent NAL chunks in the same buffer - it keeps calling `gst_h265_parser_identify_and_split_nalu_hevc` and decoding more NALs even though an error has already been recorded in `ret`, only being caught by the `if (ret != GST_FLOW_OK) goto err;` check after the whole loop exits."
locations   = ["subprojects/gst-plugins-bad/ext/codec2json/gsth2652json.c:1495-1514"]
fix         = "Break out of the `do { } while` loop as soon as `ret != GST_FLOW_OK`, mirroring the non-HEVC branch, e.g. add `if (ret != GST_FLOW_OK) break;` right after the inner `for` loop, before the `if (pres != GST_H265_PARSER_OK) break;` check."

[[finding]]
id          = "LOGIC_53"
type        = "logic_error"
severity    = "low"
difficulty  = "very_easy"
description = "In `gst_m3u8_get_duration()`, the fallback duration-summing loop iterates the `GList *f` nodes but casts the list node itself instead of its `data` member: `for (f = m3u8->files; f != NULL; f = f->next) m3u8->duration += GST_M3U8_MEDIA_FILE (f)->duration;`. `GST_M3U8_MEDIA_FILE` is just a raw cast (`((GstM3U8MediaFile*)f)`), so this reads the `duration` field at the byte offset of `GstM3U8MediaFile::duration` inside a `GList` struct (whose real fields are `data`/`next`/`prev`), effectively reinterpreting the `next` pointer as a `GstClockTime`, instead of reading the actual media file via `f->data`. In practice `gst_m3u8_update()` always sets `self->duration` to a valid value before this getter can be called with a non-`NULL` `files` list, so this path is currently unreachable dead code, but it is still an incorrect implementation that would silently produce garbage durations if that invariant ever changes."
locations   = ["subprojects/gst-plugins-bad/ext/hls/m3u8.c:1135-1141"]
fix         = "Dereference the list node's data pointer. Before: `for (f = m3u8->files; f != NULL; f = f->next)\\n      m3u8->duration += GST_M3U8_MEDIA_FILE (f)->duration;`. After: `for (f = m3u8->files; f != NULL; f = f->next)\\n      m3u8->duration += GST_M3U8_MEDIA_FILE (f->data)->duration;`."

[[finding]]
id          = "LOGIC_54"
type        = "logic_error"
severity    = "low"
difficulty  = "very_easy"
description = "In `gst_neonhttp_src_set_location`, when the parsed URI has no host (`src->uri.host == NULL`), the code assigns the entire default location string (a full URL, `DEFAULT_LOCATION` = `\"http://localhost:80\"`) to `src->uri.host` instead of just the hostname. This produces a malformed `ne_uri` whose `host` field is `\"http://localhost:80\"`, which is later passed as the hostname to `ne_session_create (src->uri.scheme, src->uri.host, src->uri.port)`, breaking DNS resolution / the HTTP `Host` header for any URI missing an explicit host component."
locations   = ["subprojects/gst-plugins-bad/ext/neon/gstneonhttpsrc.c:737-738"]
fix         = "Use the bare hostname constant instead of the full default location URL: change\n```\n  if (src->uri.host == NULL)\n    src->uri.host = g_strdup (DEFAULT_LOCATION);\n```\nto\n```\n  if (src->uri.host == NULL)\n    src->uri.host = g_strdup (HTTP_DEFAULT_HOST);\n```"

[[finding]]
id          = "LOGIC_55"
type        = "logic_error"
severity    = "low"
difficulty  = "very_easy"
description = "The `kernel-height` property of `cvsmooth` is declared with `g_param_spec_int` allowing values `0` to `G_MAXINT` (`gstcvsmooth.cpp:187-191`), and `0` is a meaningful value for `cv::GaussianBlur`'s `ksize.height` (it means \"derive automatically from sigma\"). However, `gst_cv_smooth_set_property`'s `PROP_KERNELHEIGHT` case only accepts the new value when `prop % 2 == 1`, so `kernel-height=0` is always rejected with the warning \"Ignoring value for kernel-height, not odd nor zero\", even though the warning text itself implies zero should be accepted. This makes it impossible to ever configure the documented/allowed `0` value."
locations   = ["subprojects/gst-plugins-bad/ext/opencv/gstcvsmooth.cpp:309-319"]
fix         = "Accept zero in addition to odd values:\nBefore:\n```\n      if (prop % 2 == 1) {\n        filter->kernelheight = prop;\n      } else {\n        GST_WARNING_OBJECT (filter, \"Ignoring value for kernel-height, not odd\"\n            \" nor zero (%d)\", prop);\n      }\n```\nAfter:\n```\n      if (prop % 2 == 1 || prop == 0) {\n        filter->kernelheight = prop;\n      } else {\n        GST_WARNING_OBJECT (filter, \"Ignoring value for kernel-height, not odd\"\n            \" nor zero (%d)\", prop);\n      }\n```"

[[finding]]
id          = "LOGIC_56"
type        = "logic_error"
severity    = "low"
difficulty  = "medium"
description = "`gst_gl_alpha_update_properties` computes `kgl = sqrt (target_u * target_u + target_v * target_v)` and then divides by `kgl` unconditionally (`glalpha->cb = target_u / kgl * 0.5`, `glalpha->one_over_kc = wrap (2 / kgl - 255, 0, 256)`, `glalpha->kfgy_scale = tmp = 15 * target_y / kgl`). When `method` is `ALPHA_METHOD_CUSTOM` and `target-r`/`target-g`/`target-b` are set to equal values (e.g. any grey, including black or white), `target_u` and `target_v` are both `0`, so `kgl` is `0` and these divisions produce `NaN`/`Inf`, which are then uploaded as shader uniforms (`cb`, `cr`, `one_over_kc`, `kfgy_scale`), corrupting the chroma-key output for that frame and onward."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglalpha.c:284-318"]
fix         = "Guard against a zero-length chroma vector before dividing, e.g.:\n```c\nkgl = sqrt (tmp);\nif (kgl < 1e-6f) kgl = 1e-6f;\n```"

[[finding]]
id          = "LOGIC_57"
type        = "logic_error"
severity    = "low"
difficulty  = "medium"
description = "`gst_gl_deinterlace_get_fragment_shader` inserts `shader` into `deinterlace_filter->shaderstable` even when shader compilation failed and `shader` is `NULL` (`g_hash_table_insert (deinterlace_filter->shaderstable, (gchar *) shader_name, shader);`). Because `g_hash_table_lookup` returns `NULL` both when a key is absent and when it maps to a stored `NULL` value, the next frame's call for the same `shader_name` behaves as if the shader had never been attempted, so `gst_gl_shader_new_link_with_stages` (and the accompanying `GST_ELEMENT_ERROR`) is retried and re-fails on every single frame after the first failure instead of failing once and staying failed."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstgldeinterlace.c:417-457"]
fix         = "Track compile failure separately (e.g. a sentinel value or a second hash table of failed names), or store a boolean alongside the shader, so a permanently-failing shader is not recompiled and re-reported every frame."

[[finding]]
id          = "LOGIC_58"
type        = "logic_error"
severity    = "low"
difficulty  = "medium"
description = "`_gst_id_str_copy_into_inline` (used by `gst_id_str_copy_into`) and `_gst_id_str_move_inline` (used by `gst_id_str_move`) do not guard against `d == s` (copying/moving a `GstIdStr` into itself). Both start by calling `_gst_id_str_clear_inline (d)`, which frees the heap-allocated string and zeroes the struct; since `d` and `s` alias the same memory, the subsequent `*dp = *sp` (or `memcpy`) copies the now-zeroed struct back onto itself, silently turning the string into an empty string instead of leaving it unchanged."
locations   = ["subprojects/gstreamer/gst/gstidstr-private.h:154-184"]
fix         = "Add an early return when `d == s` in both inline helpers, e.g.:\n```c\nstatic inline void\n_gst_id_str_copy_into_inline (GstIdStr * d, const GstIdStr * s)\n{\n  if (d == s)\n    return;\n  ...\n}\n```\nand similarly for `_gst_id_str_move_inline`."

[[finding]]
id          = "LOGIC_59"
type        = "logic_error"
severity    = "low"
difficulty  = "hard"
description = "`gst_debug_message_get()` (`subprojects/gstreamer/gst/gstinfo.c:1133-1146`) caches the formatted string in `message->message`, but on formatting failure it sets `message->message = NULL` again (`if (len < 0) message->message = NULL;`). Since `gst_debug_log_full_valist()` invokes every registered log handler with the same `GstDebugMessage`, and several handlers (via `_gst_debug_log_preamble()`) call `gst_debug_message_get()`, a formatting failure (`__gst_vasprintf_buf()`/`vasnprintf()` returning `NULL`, e.g. on allocation failure) on the first handler leaves `message->message == NULL`, causing the *next* handler's call to `gst_debug_message_get()` to invoke `__gst_vasprintf_buf()` again on the same `message->arguments` `va_list`. A `va_list` that has already been consumed by a `vsnprintf`-family call cannot be safely reused without an intervening `va_copy`, so this second attempt is undefined behaviour."
locations   = ["subprojects/gstreamer/gst/gstinfo.c:1133-1146"]
fix         = "Track formatting failure separately from \"not yet formatted\" (e.g. a tri-state or a `gboolean formatted` flag) so a failed attempt is not retried with an already-consumed `va_list`, or `G_VA_COPY` a fresh copy of `message->arguments` before each `__gst_vasprintf_buf()` attempt."

[[finding]]
id          = "CPY_1"
type        = "copy_paste"
severity    = "high"
difficulty  = "very_easy"
description = "In `check_report_expected()` (used to match reports against user-declared \"expected issues\" from a test file), the innermost `if` that is meant to check the optional `level` field instead re-checks `!detected_on`: `if (!detected_on || !g_strcmp0 (level, report_level))`. Every sibling check in the same chain (`!id`, `!summary`, `!details`, `!detected_on`) follows the pattern \"field absent => don't filter on it, else compare\", but this line was copy-pasted without updating the variable name from `detected_on` to `level`. As a result: (1) if an expected-issue entry specifies `level` but not `detected-on`, the `level` filter is silently bypassed (matches regardless of level); (2) if an expected-issue entry specifies `detected-on` but not `level`, the comparison becomes `g_strcmp0(NULL, report_level)` which is always non-zero, so the match always fails even though the issue actually occurred, causing `gst_validate_runner_exit()` to wrongly report via `gst_validate_error_structure()` that an expected issue 'didn't happen' and abort the test run with exit code -18."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-runner.c:668-673"]
fix         = "Use `level` instead of `detected_on` in the inner condition. Before: `if (!detected_on || !g_strcmp0 (level, report_level)) {`. After: `if (!level || !g_strcmp0 (level, report_level)) {`"

[[finding]]
id          = "CPY_2"
type        = "copy_paste"
severity    = "high"
difficulty  = "very_easy"
description = "In `ges_base_xml_formatter_add_encoding_profile`, the loop that searches for the named parent container profile compares `gst_encoding_profile_get_name (tmpprofile)` against `gst_encoding_profile_get_name (tmpprofile)` (the same value twice) instead of comparing it against the `parent` argument. The condition `g_strcmp0 (gst_encoding_profile_get_name (tmpprofile), gst_encoding_profile_get_name (tmpprofile)) == 0` is a tautology that is always true, so the loop always matches the very first profile in `ges_project_list_encoding_profiles()` as the supposed parent, regardless of its actual name, instead of finding the profile whose name equals `parent`."
locations   = ["subprojects/gst-editing-services/ges/ges-base-xml-formatter.c:1244-1260"]
fix         = "Compare against `parent`: `if (g_strcmp0 (gst_encoding_profile_get_name (tmpprofile), parent) == 0) {` instead of `if (g_strcmp0 (gst_encoding_profile_get_name (tmpprofile), gst_encoding_profile_get_name (tmpprofile)) == 0) {`."

[[finding]]
id          = "CPY_3"
type        = "copy_paste"
severity    = "medium"
difficulty  = "very_easy"
description = "`gst_validate_override_registry_get_override_list` in `subprojects/gst-devtools/validate/gst/validate/gst-validate-override-registry.c` is supposed to collect overrides from all three registries (`name_overrides`, `klass_overrides`, `gtype_overrides`). The third loop mistakenly iterates `registry->name_overrides.head` a second time (instead of `registry->gtype_overrides.head`) while casting the list data to `GstValidateOverrideRegistryGTypeEntry *`. As a result, overrides registered via `gst_validate_override_register_by_type` (e.g. the `num-instances` extra-check override registered on `GST_TYPE_BIN`) are never returned by this function. Since `gst_validate_runner_new` uses this list to call `gst_validate_reporter_set_runner` on every registered override, GType-registered overrides never get a runner attached when a runner is created after they were registered, silently breaking their reporting."
locations   = ["subprojects/gst-devtools/validate/gst/validate/gst-validate-override-registry.c:501-506"]
fix         = "Iterate the correct queue. Before:\n```c\n  for (i = registry->name_overrides.head; i; i = i->next) {\n    GstValidateOverrideRegistryGTypeEntry *entry =\n        (GstValidateOverrideRegistryGTypeEntry *) i->data;\n```\nAfter:\n```c\n  for (i = registry->gtype_overrides.head; i; i = i->next) {\n    GstValidateOverrideRegistryGTypeEntry *entry =\n        (GstValidateOverrideRegistryGTypeEntry *) i->data;\n```"

[[finding]]
id          = "CPY_4"
type        = "copy_paste"
severity    = "medium"
difficulty  = "very_easy"
description = "In `FakeMediaDescriptor.get_tracks_caps`, the code accesses `self._info` instead of `self._infos` (the attribute actually set in `__init__`). Every other accessor in the same class (`get_path`, `get_media_filepath`, `get_caps`, etc.) correctly uses `self._infos`. Calling `get_tracks_caps()` on a `FakeMediaDescriptor` (e.g. via `GstValidateTranscodingTest.set_rendering_info()` or `GstValidateCheckAccurateSeekingTestGenerator.generate_scenario()` when a pipeline-based test has no explicit `media_info`) raises `AttributeError: 'FakeMediaDescriptor' object has no attribute '_info'`."
locations   = ["subprojects/gst-devtools/validate/launcher/apps/gstvalidate.py:157-158"]
fix         = "Change `self._info.get('tracks-caps', [])` to `self._infos.get('tracks-caps', [])`:\n```python\n# before\ndef get_tracks_caps(self):\n    return self._info.get('tracks-caps', [])\n\n# after\ndef get_tracks_caps(self):\n    return self._infos.get('tracks-caps', [])\n```"

[[finding]]
id          = "CPY_5"
type        = "copy_paste"
severity    = "medium"
difficulty  = "easy"
description = "In `gst_lcms_process_rgb` (`subprojects/gst-plugins-bad/ext/colormanagement/gstlcms.c`), the alpha channel is copied to the output buffer using `in_offsets[3]` instead of `out_offsets[3]` to index `out_data`, in three places (the `GST_LCMS_LOOKUP_METHOD_UNCACHED` pixel-by-pixel branch, the `GST_LCMS_LOOKUP_METHOD_PRECALCULATED` branch, and the `GST_LCMS_LOOKUP_METHOD_CACHED` branch). In the `PRECALCULATED` branch the bug is compounded further: `out_data[in_offsets[3]] = in_data[out_offsets[3]];` reads the alpha byte from `in_data` at the *output* offset and writes it into `out_data` at the *input* offset - both operands are transposed. When input and output pixel formats place the alpha byte at different offsets (e.g. `ARGB` alpha at byte 0 vs `RGBA` alpha at byte 3), this corrupts the alpha channel (and, in the `PRECALCULATED` case, reads out of the intended source location too)."
locations   = ["subprojects/gst-plugins-bad/ext/colormanagement/gstlcms.c:822-823", "subprojects/gst-plugins-bad/ext/colormanagement/gstlcms.c:846-848", "subprojects/gst-plugins-bad/ext/colormanagement/gstlcms.c:882-884"]
fix         = "Use `out_offsets[3]` (not `in_offsets[3]`) to index into `out_data` in all three spots, e.g. change `out_data[in_offsets[3]] = alpha;` to `out_data[out_offsets[3]] = alpha;`, and change `out_data[in_offsets[3]] = in_data[out_offsets[3]];` to `out_data[out_offsets[3]] = in_data[in_offsets[3]];`."

[[finding]]
id          = "CPY_6"
type        = "copy_paste"
severity    = "medium"
difficulty  = "very_easy"
description = "In `run_grabcut_iteration`, `cv::grabCut` is invoked as `grabCut (image_c, mask_c, Rect (), bgdModel, bgdModel, 1, GC_INIT_WITH_MASK)`, passing `bgdModel` for both the background-model and foreground-model arguments; the `fgdModel` function parameter is never used. This is inconsistent with the correctly-written `run_grabcut_iteration2`, which passes `bgdModel, fgdModel` (`gstgrabcut.cpp:390`). The background and foreground Gaussian-mixture statistics end up aliased into the same `cv::Mat`, producing incorrect/degenerate segmentation results whenever the mask-based code path is used."
locations   = ["subprojects/gst-plugins-bad/ext/opencv/gstgrabcut.cpp:376-384"]
fix         = "Pass `fgdModel` instead of a second `bgdModel`:\nBefore:\n```\n  if (countNonZero (mask_c))\n    grabCut (image_c, mask_c, Rect (),\n        bgdModel, bgdModel, 1, GC_INIT_WITH_MASK);\n```\nAfter:\n```\n  if (countNonZero (mask_c))\n    grabCut (image_c, mask_c, Rect (),\n        bgdModel, fgdModel, 1, GC_INIT_WITH_MASK);\n```"

[[finding]]
id          = "CPY_7"
type        = "copy_paste"
severity    = "medium"
difficulty  = "medium"
description = "`_connect_sink_element` (`gstglsinkbin.c`), `_connect_src_element` (`gstglsrcbin.c`) and `_connect_mixer_element` (`gstglmixerbin.c`) all share the same bug: they call `gst_bin_add` to add the sink/src/mixer element to the bin and then try to `gst_element_link_pads` it, but if the link fails after the `gst_bin_add` succeeded, the function just returns `FALSE` without calling `gst_bin_remove` to take the element back out of the bin. The respective callers (`gst_gl_sink_bin_set_sink`, `gst_gl_src_bin_set_src`, `gst_gl_mixer_bin_finish_init_with_element`) then only `gst_object_unref` their own tracking pointer (`self->sink`/`self->src`/`self->mixer`) and set it to `NULL`, leaving the element as an orphaned, unlinked child that is still physically part of the bin (kept alive by the bin's own reference) but no longer reachable/manageable through the wrapper object, e.g. a later attempt to set a new sink/src/mixer of the same name would fail because the name is already taken inside the bin."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglsinkbin.c:284-295", "subprojects/gst-plugins-base/ext/gl/gstglsrcbin.c:153-167", "subprojects/gst-plugins-base/ext/gl/gstglmixerbin.c:443-466"]
fix         = "On link failure, remove the element from the bin before returning, e.g. in `_connect_sink_element`:\n```c\nif (gst_bin_add (GST_BIN (self), self->sink)) {\n  if (gst_element_link_pads (self->balance, \"src\", self->sink, \"sink\"))\n    return TRUE;\n  gst_bin_remove (GST_BIN (self), self->sink);\n}\nGST_ERROR_OBJECT (self, \"Failed to link sink element into the pipeline\");\nreturn FALSE;\n```\nApply the analogous fix to `_connect_src_element` and `_connect_mixer_element`."

[[finding]]
id          = "CPY_8"
type        = "copy_paste"
severity    = "medium"
difficulty  = "very_easy"
description = "In `stereosplit_chain`, right before building the `right` output buffer, the code calls `GST_BUFFER_FLAG_UNSET (left, GST_VIDEO_BUFFER_FLAG_FIRST_IN_BUNDLE)` a second time (it was already cleared a few lines earlier for `left`). This is a copy-paste artifact from the block that builds `left`: the `right` buffer is created via `gst_buffer_copy_into (right, buf, GST_BUFFER_COPY_FLAGS | GST_BUFFER_COPY_TIMESTAMPS, 0, -1)`, which copies all of `buf`'s `GstBufferFlags` (including `GST_VIDEO_BUFFER_FLAG_FIRST_IN_BUNDLE`) onto `right`, but that flag is never cleared on `right` because the unset call targets `left` again instead of `right`. As a result, the right-view buffer can incorrectly keep the first-in-bundle marker that downstream multiview-aware consumers rely on to identify the primary/first view of a bundle."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglstereosplit.c:680-688"]
fix         = "Clear the flag on `right`, not `left`, when building the right-view buffer:\n\n```c\nright = gst_buffer_new ();\ngst_buffer_copy_into (right, buf,\n    GST_BUFFER_COPY_FLAGS | GST_BUFFER_COPY_TIMESTAMPS, 0, -1);\nGST_BUFFER_FLAG_UNSET (right, GST_VIDEO_BUFFER_FLAG_FIRST_IN_BUNDLE);\ngst_buffer_add_parent_buffer_meta (right, split_buffer);\n```"

[[finding]]
id          = "CPY_9"
type        = "copy_paste"
severity    = "low"
difficulty  = "easy"
description = "`GstValidateTranscodingTest.__init__` computes `self.extra_env_variables = extra_env_variables or {}` from the constructor argument, but then calls `super().__init__(..., extra_env_variables=None, ...)` with a hardcoded `None` instead of forwarding the actual `extra_env_variables` parameter. Since `Test.__init__`/`GstValidateTest.__init__` set `self.extra_env_variables` from the value they receive, this overwrites the correct value computed just above with `{}`, and any override-file/`GST_VALIDATE_OVERRIDE` or extra env vars passed by a caller of `GstValidateTranscodingTest` would silently never reach the subprocess environment. The line right after the `super()` call, `extra_env_variables = extra_env_variables or {}`, reassigns only the local variable and has no effect, confirming this is leftover/copy-pasted code."
locations   = ["subprojects/gst-devtools/validate/launcher/apps/gstvalidate.py:800-821"]
fix         = "Forward the real value to the parent constructor:\n```python\nsuper(GstValidateTranscodingTest, self).__init__(\n    GstValidateBaseTestManager.TRANSCODING_COMMAND,\n    classname, options, reporter,\n    duration=duration, timeout=timeout, scenario=scenario,\n    media_descriptor=media_descriptor,\n    extra_env_variables=extra_env_variables,\n    expected_issues=expected_issues)\n```\ninstead of hardcoding `extra_env_variables=None`."

[[finding]]
id          = "CPY_10"
type        = "copy_paste"
severity    = "low"
difficulty  = "very_easy"
description = "In `_save_source()`, the field-exclusion list passed to `_serialize_properties()` is missing a comma between `\"track-type\"` and `\"uri\"`. Because of C adjacent-string-literal concatenation, this silently becomes the single bogus field name `\"track-typeuri\"` instead of the two intended exclusions `\"track-type\"` and `\"uri\"`. As a result `gst_structure_remove_fields_valist()` never strips the `track-type` (nor `uri`) property from the serialized `properties='...'` XML attribute of `<source>` elements, corrupting the serialized project's `properties` field with data that should have been excluded."
locations   = ["subprojects/gst-editing-services/ges/ges-xml-formatter.c:1654-1656"]
fix         = "Add the missing comma, e.g.:\nbefore:\n```\n  properties = _serialize_properties (G_OBJECT (element), &n_props,\n      \"in-point\", \"priority\", \"start\", \"duration\", \"track\", \"track-type\"\n      \"uri\", \"name\", \"max-duration\", NULL);\n```\nafter:\n```\n  properties = _serialize_properties (G_OBJECT (element), &n_props,\n      \"in-point\", \"priority\", \"start\", \"duration\", \"track\", \"track-type\",\n      \"uri\", \"name\", \"max-duration\", NULL);\n```"

[[finding]]
id          = "CPY_11"
type        = "copy_paste"
severity    = "low"
difficulty  = "very_easy"
description = "In `post_qos_message()`, both `running_time` and `stream_time` are computed with `gst_segment_to_running_time()`; `stream_time` should be computed with `gst_segment_to_stream_time()`. This is a copy-paste mistake that makes the `stream-time` field of the posted `GST_MESSAGE_QOS` message always equal the running-time instead of the actual stream time, which misleads any consumer (e.g. QoS-aware elements or applications inspecting the message) about the position in the stream."
locations   = ["subprojects/gst-plugins-bad/ext/avtp/gstavtpcrfcheck.c:141-158"]
fix         = "```c\n// before\n  guint64 stream_time =\n      gst_segment_to_running_time (&avtpcrfbase->element.segment,\n      GST_FORMAT_TIME, GST_BUFFER_DTS_OR_PTS (buffer));\n\n// after\n  guint64 stream_time =\n      gst_segment_to_stream_time (&avtpcrfbase->element.segment,\n      GST_FORMAT_TIME, GST_BUFFER_DTS_OR_PTS (buffer));\n```"

[[finding]]
id          = "CPY_12"
type        = "copy_paste"
severity    = "low"
difficulty  = "easy"
description = "In `gst_h265_2_json_parse_sps` (`subprojects/gst-plugins-bad/ext/codec2json/gsth2652json.c`), the loop that fills the `used_by_curr_pic_lt_sps_flag` JSON array iterates with `for (j = 0; j < h265_sps.num_long_term_ref_pics_sps; j++)` but indexes the source array with the stale outer-loop variable `i` (left over from the earlier `short_term_ref_pic_set` loop, `for (i = 0; i < h265_sps.num_short_term_ref_pic_sets; i++)`) instead of `j`: `h265_sps.used_by_curr_pic_lt_sps_flag[i]`. Because `GstH265SPS.num_short_term_ref_pic_sets` can be up to 65 (`short_term_ref_pic_set[65]`) while `used_by_curr_pic_lt_sps_flag` is only `guint8[32]`, this both emits the wrong (constant, non-varying) value for every element of the \"used by curr pic lt sps flag\" JSON array and can read out of the bounds of the `used_by_curr_pic_lt_sps_flag` array (though still within the enclosing `GstH265SPS` struct) when a crafted H.265 SPS sets a large `num_short_term_ref_pic_sets`."
locations   = ["subprojects/gst-plugins-bad/ext/codec2json/gsth2652json.c:562-567"]
fix         = "Index with the loop variable `j` instead of `i`: change `json_array_add_int_element (used_by_curr_pic_lt_sps_flag, h265_sps.used_by_curr_pic_lt_sps_flag[i]);` to `json_array_add_int_element (used_by_curr_pic_lt_sps_flag, h265_sps.used_by_curr_pic_lt_sps_flag[j]);`."

[[finding]]
id          = "CPY_13"
type        = "copy_paste"
severity    = "low"
difficulty  = "easy"
description = "In `gst_gl_video_mixer_pad_class_init`, six of the `GstGLVideoMixerPad` properties (`blend-equation-rgb`, `blend-equation-alpha`, `blend-function-src-rgb`, `blend-function-src-alpha`, `blend-function-dst-rgb`, `blend-function-dst-alpha`) are registered with `g_object_class_install_property` using the `PROP_INPUT_BLEND_EQUATION_RGB`/`PROP_INPUT_BLEND_EQUATION_ALPHA`/`PROP_INPUT_BLEND_FUNCTION_*` identifiers, which belong to the separate `GstGLVideoMixerInput` property enum (used earlier in the file for the ghost-pad proxy object), instead of the pad's own `PROP_PAD_BLEND_EQUATION_RGB`/`PROP_PAD_BLEND_FUNCTION_*` identifiers used everywhere else (including the pad's own `set_property`/`get_property` switches). This currently happens to work only because both enums assign the same numeric values to these entries by coincidence (both start `_0, XPOS, YPOS, WIDTH, HEIGHT, ALPHA` before the blend fields). Any future reordering or insertion into either enum silently breaks property dispatch for these six pad properties, since `g_object_class_install_property`'s id and the pad's `set_property`/`get_property` `switch` cases would then disagree."
locations   = ["subprojects/gst-plugins-base/ext/gl/gstglvideomixer.c:862-903"]
fix         = "Use the pad's own property ids consistently:\n\n```c\ng_object_class_install_property (gobject_class, PROP_PAD_BLEND_EQUATION_RGB, ...);\ng_object_class_install_property (gobject_class, PROP_PAD_BLEND_EQUATION_ALPHA, ...);\ng_object_class_install_property (gobject_class, PROP_PAD_BLEND_FUNCTION_SRC_RGB, ...);\ng_object_class_install_property (gobject_class, PROP_PAD_BLEND_FUNCTION_SRC_ALPHA, ...);\ng_object_class_install_property (gobject_class, PROP_PAD_BLEND_FUNCTION_DST_RGB, ...);\ng_object_class_install_property (gobject_class, PROP_PAD_BLEND_FUNCTION_DST_ALPHA, ...);\n```\ninstead of the `PROP_INPUT_*` identifiers."

[[finding]]
id          = "CPY_14"
type        = "copy_paste"
severity    = "low"
difficulty  = "easy"
description = "In `get_application_dirs()` (`gstandroid.c:391`), `*files_dir = files_dir ? g_strdup (abs_path_str) : NULL;` checks the function parameter `files_dir` (a `gchar **` out-parameter whose address is always non-NULL, since the caller passes `&files_dir_local`), so the ternary is always true. This mirrors the correct pattern used for `cache_dir` a few lines above (`*cache_dir = abs_path ? g_strdup (abs_path_str) : NULL;` at line 356), which checks `abs_path` - the actual value that can be `NULL`. The `files_dir` version was evidently copy-pasted without updating the checked variable, so the intended guard against a `NULL` `abs_path` (e.g. if `File.getAbsolutePath()` ever returned `null`) never applies for the files-dir case."
locations   = ["subprojects/gstreamer/gst/gstandroid.c:391"]
fix         = "Check `abs_path` like the `cache_dir` case does:\n```c\n*files_dir = abs_path ? g_strdup (abs_path_str) : NULL;\n```"

[[finding]]
id          = "CPY_15"
type        = "copy_paste"
severity    = "negligible"
difficulty  = "easy"
description = "`GST_AVTP_VF_DEPAY_BASE_GET_CLASS(obj)` is defined using the undefined identifier `GST_AVTP_VF_DEBAYPAY_BASE` instead of `GST_TYPE_AVTP_VF_DEPAY_BASE`. This currently has no runtime effect only because `G_TYPE_INSTANCE_GET_CLASS()` expands (via `_G_TYPE_IGC`) to a macro body that never references its `g_type` argument, so the bogus token is silently discarded by the preprocessor; but it is dead/incorrect code that would break if GLib's `G_TYPE_INSTANCE_GET_CLASS` ever started using its `g_type` argument (e.g. for debug-mode type checking), and it is confusing/misleading to maintainers."
locations   = ["subprojects/gst-plugins-bad/ext/avtp/gstavtpvfdepaybase.h:40-41"]
fix         = "```c\n// before\n#define GST_AVTP_VF_DEPAY_BASE_GET_CLASS(obj) \\\n  (G_TYPE_INSTANCE_GET_CLASS ((obj), GST_AVTP_VF_DEBAYPAY_BASE, GstAvtpVfDepayBaseClass))\n\n// after\n#define GST_AVTP_VF_DEPAY_BASE_GET_CLASS(obj) \\\n  (G_TYPE_INSTANCE_GET_CLASS ((obj), GST_TYPE_AVTP_VF_DEPAY_BASE, GstAvtpVfDepayBaseClass))\n```"

[[finding]]
id          = "CPY_16"
type        = "copy_paste"
severity    = "negligible"
difficulty  = "very_easy"
description = "In `gst_base_qr_overlay_init` (`subprojects/gst-plugins-bad/ext/qroverlay/gstbaseqroverlay.c`), `priv->y_percent` is initialized from `DEFAULT_PROP_X` instead of `DEFAULT_PROP_Y`. This is a copy-paste mistake; it currently has no visible effect only because `DEFAULT_PROP_X` and `DEFAULT_PROP_Y` both happen to equal `50`, but the code no longer reflects intent and will silently break if either default is changed independently."
