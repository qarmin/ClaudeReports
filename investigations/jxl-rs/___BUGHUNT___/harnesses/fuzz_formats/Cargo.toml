[package]
name = "jxl-fuzz-formats"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
rand = "0.9.2"
rand_xorshift = "0.4.0"
libfuzzer-sys = "0.4"

[dependencies.jxl]
path = "../../../jxl"

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "chunkdiff"
path = "fuzz_targets/chunkdiff.rs"
test = false
doc = false

[[bin]]
name = "seekdiff"
path = "fuzz_targets/seekdiff.rs"
test = false
doc = false

[[bin]]
name = "nolimit"
path = "fuzz_targets/nolimit.rs"
test = false
doc = false

[[bin]]
name = "formats"
path = "fuzz_targets/formats.rs"
test = false
doc = false

[[bin]]
name = "seek"
path = "fuzz_targets/seek.rs"
test = false
doc = false

[[bin]]
name = "chunked"
path = "fuzz_targets/chunked.rs"
test = false
doc = false

[profile.release]
debug = 1
