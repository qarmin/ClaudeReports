[package]
name = "jxl-fuzz-pipe"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = "0.9.2"
rand_xorshift = "0.4.0"

# Needs a jxl checkout where the cfg(test) test_options/SimpleRenderPipeline are exposed with
# `--cfg bh_diff` (see expose_test_options.patch); build with RUSTFLAGS="--cfg bh_diff".
[dependencies.jxl]
path = "../../_reference/wt2/jxl"

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pipediff"
path = "fuzz_targets/pipediff.rs"
test = false
doc = false

[[bin]]
name = "modbufdiff"
path = "fuzz_targets/modbufdiff.rs"
test = false
doc = false

[[bin]]
name = "patches_unit"
path = "fuzz_targets/patches_unit.rs"
test = false
doc = false

[[bin]]
name = "splines_unit"
path = "fuzz_targets/splines_unit.rs"
test = false
doc = false

[profile.release]
debug = 1
