[workspace]

[package]
name = "issue691"
version = "0.1.0"
edition = "2021"

# LTO with this project's `download-gccjit = true` default setup segfaults the compiler for an
# unrelated reason (candidate 001.lto_driver_failure_segfault) - keep it off so this repro isn't
# derailed by that separate, already-tracked bug.
[[bin]]
name = "issue691"
path = "issue691.rs"

[profile.dev]
lto = "off"
codegen-units = 1

[profile.release]
lto = "off"
codegen-units = 1
