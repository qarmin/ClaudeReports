[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
dicom-core = { path = "../clone/core" }
dicom-dictionary-std = { path = "../clone/dictionary-std" }
dicom-object = { path = "../clone/object" }
dicom-pixeldata = { path = "../clone/pixeldata" }

# Run twice: without this feature (the `lib.rs` decode path) and with it
# (the `gdcm.rs` decode path). Both must agree - that is the whole point.
[features]
gdcm = ["dicom-pixeldata/gdcm"]
