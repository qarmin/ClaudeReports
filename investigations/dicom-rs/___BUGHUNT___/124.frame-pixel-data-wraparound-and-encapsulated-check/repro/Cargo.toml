[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wraparound"
path = "src/wraparound.rs"

[[bin]]
name = "encapsulated_offset_table"
path = "src/encapsulated_offset_table.rs"

[dependencies]
dicom-encoding = { path = "../clone/encoding" }

[profile.release]
# Explicit, so this repro's release-mode wraparound demonstration doesn't
# silently depend on whatever profile defaults happen to be inherited from
# any enclosing workspace - overflow-checks off is exactly the condition
# under which `usize` multiplication/addition wraps instead of panicking.
overflow-checks = false
debug-assertions = false
