[workspace]

[package]
name = "vello_hybrid_gpu_bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vello_hybrid = { path = "../clone/sparse_strips/vello_hybrid" }
vello_common = { path = "../clone/sparse_strips/vello_common", features = ["pico_svg"] }
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl", "vulkan"] }
pollster = "0.4.0"
sha2 = "0.10"

[[bin]]
name = "gpu_bench"
path = "src/main.rs"
