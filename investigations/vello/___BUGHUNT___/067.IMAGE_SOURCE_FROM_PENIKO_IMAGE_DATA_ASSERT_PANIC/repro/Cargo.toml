[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[features]
# Enabled for the "reproduce-after" run: the patched `vello_common` changes
# `ImageSource::from_peniko_image_data`'s signature from `-> ImageSource` to
# `-> Option<ImageSource>`, so the two runs need slightly different call sites (see main.rs).
fixed = []

[dependencies]
vello_common = { path = "../clone/sparse_strips/vello_common", features = ["std", "png"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
peniko = { version = "0.6.1", default-features = false, features = ["std"] }
png = "0.18"
