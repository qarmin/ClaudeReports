[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

# Paths track whatever `../clone` currently contains (see candidate justfile: `clone` checks out
# `base_commit` into `../clone`).
[dependencies]
vello_cpu = { path = "../clone/sparse_strips/vello_cpu", features = ["multithreading"] }
static_assertions = "1.1"
