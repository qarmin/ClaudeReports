[workspace]

[package]
name = "repro060"
version = "0.1.0"
edition = "2021"

[dependencies]
# ADAPT (per the candidate's own justfile): while working the candidate live against the main
# project checkout, point these at that checkout directly; the justfile's `clone` recipe expects
# them to point at ./clone instead, so update these two paths together with the justfile if the
# main project's directory layout ever changes.
vello_hybrid = { path = "../clone/sparse_strips/vello_hybrid" }
vello_common = { path = "../clone/sparse_strips/vello_common", features = ["std"] }
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl", "vulkan"] }
pollster = "0.3"
