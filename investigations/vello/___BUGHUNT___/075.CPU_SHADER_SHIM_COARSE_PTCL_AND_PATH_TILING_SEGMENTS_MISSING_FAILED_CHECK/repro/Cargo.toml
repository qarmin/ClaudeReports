[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ptcl_overflow"
path = "src/bin/ptcl_overflow.rs"

[[bin]]
name = "ptcl_dynamic"
path = "src/bin/ptcl_dynamic.rs"

[dependencies]
# Path is relative to `./clone`, created by this candidate's own `just clone`.
vello = { path = "../clone/vello" }

anyhow = "1"
pollster = "0.3"

[profile.release]
opt-level = 3
