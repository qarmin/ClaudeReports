[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# ADAPT (per justfile `clone` step): path is relative to this folder once `clone/` exists next to
# it (see the candidate's own justfile). While working the candidate live against the main project
# checkout, this can instead point at the real worktree's `vello` crate directly.
vello = { path = "../clone/vello" }
pollster = "0.4.0"
futures-intrusive = "0.5.0"
