[workspace]

[package]
name = "colr_blend_mode_incomplete_mapping_repro"
version = "0.1.0"
edition = "2021"

[dependencies]
vello = "0.10.0"
vello_encoding = "0.10.0"
bytemuck = "1.25.0"
pollster = "0.4.0"

# By default this pulls the published crates.io releases, which (as of this candidate) contain
# byte-for-byte the same `vello/src/scene.rs` push_layer mapping as the checked-out base_commit.
# `just test` instead patches these to the freshly-cloned ./clone (checked out at base_commit) so
# the repro always tracks the exact commit under investigation, not whatever happens to be on
# crates.io later.
[patch.crates-io]
vello = { path = "../clone/vello" }
vello_encoding = { path = "../clone/vello_encoding" }
