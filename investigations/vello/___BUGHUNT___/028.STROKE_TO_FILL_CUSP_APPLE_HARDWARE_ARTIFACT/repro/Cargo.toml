[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "repro"

[dependencies]
vello = { path = "../clone/vello", default-features = false, features = ["wgpu", "wgpu_default"] }
vello_shaders = { path = "../clone/vello_shaders", default-features = false, features = ["cpu"] }
bytemuck = "1"
pollster = "0.4"
wgpu = "29"
png = "0.17"

[profile.release]
debug = true
