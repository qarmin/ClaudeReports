[package]
name = "focus_bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "focus_bench"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.0", path = "../clone/api/rs/slint", default-features = false, features = [
  "compat-1-2",
  "std",
  "renderer-software",
  "backend-winit",
] }

[build-dependencies]
slint-build = { version = "=1.18.0", path = "../clone/api/rs/build" }

[workspace]

[profile.rdebug]
inherits = "release"
debug = "full"
debug-assertions = false
overflow-checks = false
strip = "none"
incremental = false
