# Is mimalloc actually faster than glibc for the pattern the property system produces?
# Without this control, "swapping the allocator changed nothing" cannot be read as
# "the allocator is not the cost".
[package]
name = "allocbench-mimalloc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mimalloc = { version = "0.1", default-features = false }

[workspace]

[profile.release]
debug = true
