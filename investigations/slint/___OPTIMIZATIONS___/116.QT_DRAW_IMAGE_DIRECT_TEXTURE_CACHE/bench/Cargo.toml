[package]
name = "qt-draw-image-direct-probe"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "qt_draw_image_direct_probe"
path = "qt_draw_image_direct_probe.rs"

[dependencies]
i-slint-core = { path = "../clone/internal/core", default-features = false, features = [
  "std",
  "svg",
  "image-decoders",
  "shared-parley",
] }
i-slint-backend-qt = { path = "../clone/internal/backends/qt", features = ["bench-probe"] }
euclid = { version = "0.22.1", default-features = false }

# Own workspace: standalone, does not join the main repo's workspace.
[workspace]
