[package]
name = "image-cache-bound-fix-bench"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "make_assets"
path = "make_assets.rs"

[[bin]]
name = "image_probe"
path = "image_probe.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
slint = { path = "../clone/api/rs/slint", default-features = false, features = [
  "compat-1-2",
  "std",
  "backend-winit",
] }

# Own workspace: standalone, does not join the cloned repository's workspace.
[workspace]
