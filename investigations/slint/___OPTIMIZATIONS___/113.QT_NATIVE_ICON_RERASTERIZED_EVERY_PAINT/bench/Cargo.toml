[package]
name = "qt-icon-rasterize-probe"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "qt_icon_probe"
path = "qt_icon_probe.rs"

[dependencies]
i-slint-core = { path = "../clone/internal/core", default-features = false, features = [
  "std",
  "svg",
  "image-decoders",
  "shared-parley",
] }
i-slint-backend-qt = { path = "../clone/internal/backends/qt", features = ["bench-probe"] }

# Own workspace: standalone, does not join the cloned repository's workspace.
[workspace]
