[package]
name = "stroke_alloc_probe"
version = "0.1.0"
edition = "2021"

# Own workspace root: this crate sits next to the kurbo clone but is not a member of its workspace.
[workspace]

[dependencies]
# Filled in by the candidate justfile's `clone` recipe, which puts the kurbo checkout at ../clone.
kurbo = { path = "../clone/kurbo" }

[[bin]]
name = "allocprobe"
path = "src/allocprobe.rs"

[[bin]]
name = "bound"
path = "src/bound.rs"

[profile.release]
debug = true
