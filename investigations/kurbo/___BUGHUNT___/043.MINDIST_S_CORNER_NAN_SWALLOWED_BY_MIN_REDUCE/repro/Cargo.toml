[workspace]

[package]
name = "mindist-s-corner-nan-repro"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
# Only exists so the vendored mindist.rs's `#[cfg(not(feature = "std"))]` import resolves to
# false, matching how the real kurbo crate is normally built.
std = []

[dependencies]
# Path dependency into ./clone (created by `just clone`), so this always tracks whatever state
# the clone is currently in. Only used for the public `Vec2` type here.
kurbo = { path = "../clone/kurbo" }
