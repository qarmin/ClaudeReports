[workspace]

[package]
name = "ccitt_bit_reader_bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

[profile.release]
debug = 1

[dependencies]
# Path dependency on the crate under test. When run inside a fresh `just clone` (see
# ../justfile), this resolves to clone/hayro-ccitt with patch.diff applied. When run
# directly against this checkout during a live session, point this at the real
# ../../hayro-ccitt instead.
hayro-ccitt = { path = "../clone/hayro-ccitt" }
