[package]
name = "scenes"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
egui = { path = "../../../crates/egui" }
egui_extras = { path = "../../../crates/egui_extras" }
egui_demo_lib = { path = "../../../crates/egui_demo_lib" }
criterion = { version = "0.8.2", default-features = false }
mimalloc = { version = "0.1.52", optional = true }

[features]
default = ["mimalloc"]

[[bench]]
name = "scenes"
harness = false

[profile.release]
debug = false
