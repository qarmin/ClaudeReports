[workspace]

[package]
name = "orx015-repro"
version = "0.1.0"
edition = "2024"

# ADAPT (per SKILL.md): while working the candidate live, point this at the main project's own
# working tree (fast, reuses its `target/`); the candidate's own justfile instead builds against
# `../clone/orx-parallel` fetched from `repo_url`/`base_commit` at run time - see the justfile.
[dependencies]
orx-parallel = { path = "../clone/orx-parallel", features = ["experimental"] }

[[bin]]
name = "thread_count_boundary"
path = "src/bin/thread_count_boundary.rs"

[[bin]]
name = "use_none_handling"
path = "src/bin/use_none_handling.rs"

[[bin]]
name = "sort_boundary"
path = "src/bin/sort_boundary.rs"

[[bin]]
name = "miri_sort_boundary"
path = "src/bin/miri_sort_boundary.rs"

[profile.dev]
debug-assertions = true
overflow-checks = true
