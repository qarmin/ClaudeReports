[workspace]

[package]
name = "repro_sse"
version = "0.1.0"
edition = "2021"

[dependencies]
# sse enabled, avx disabled - forces the SSE4.1 path (`sse_unpremultiply_row` in
# src/sse/alpha_u8.rs), which has the same `_mm_rcp_ps`-then-`_mm_cvtps_epi32` shape as the AVX2
# backend.
pic-scale = { path = "../clone", default-features = false, features = ["sse", "threading"] }
