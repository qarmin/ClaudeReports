[workspace]

[package]
name = "repro_scalar"
version = "0.1.0"
edition = "2021"

[dependencies]
# avx/sse/neon disabled - forces the scalar reference path (`unpremultiplication_table` /
# `unpremultiply_alpha_rgba_row_impl` in src/alpha_handle_u8.rs, the crate's own exact
# round-half-up integer ground truth `(pixel*255+alpha/2)/alpha`) for every pixel, on the same
# host.
pic-scale = { path = "../clone", default-features = false, features = ["threading"] }
