[workspace]

[package]
name = "repro_simd"
version = "0.1.0"
edition = "2021"

[dependencies]
# avx/sse/neon enabled (default) - on an x86_64 host with AVX2, this runtime-dispatches
# unpremultiply to `avx_unpremultiply_alpha_rgba_u16_row_avx` (the bug: zero-alpha pixels get
# their color channels wrongly zeroed instead of preserved).
pic-scale = { path = "../clone" }
rand = "0.8"
