[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
# avx (and sse) are deliberately disabled: the AR30/RA30 AVX2-specialized planning
# branch in `Scaler::plan_resize_ar30` (src/scaler.rs) never constructs `Ar30Plan` at
# all - it bypasses the vulnerable `ScratchLayout` arithmetic entirely. This candidate
# is about the scalar/non-AVX2 fallback path (`Ar30Plan`/`Ar30DestructuringImpl` in
# src/plan/ar30_plan.rs), so `avx`/`sse` must stay off to reach it on an AVX2-capable host.
pic-scale = { path = "../clone", default-features = false, features = ["threading"] }

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
