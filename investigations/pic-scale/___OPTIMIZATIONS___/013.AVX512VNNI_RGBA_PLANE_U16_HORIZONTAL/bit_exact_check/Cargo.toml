[workspace]

[package]
name = "correctness_check"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "correctness_check"
path = "src/main.rs"

[dependencies]
pic-scale = { path = "../clone", features = ["avx", "sse", "avx512"], default-features = false }
image = { version = "0.25", features = ["default"] }

[profile.release]
opt-level = 3
