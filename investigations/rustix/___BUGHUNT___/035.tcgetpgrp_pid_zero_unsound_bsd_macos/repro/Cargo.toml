[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# Adapted by this candidate's own justfile to point at ../clone/ (the pristine checkout `just
# clone` makes) when run via `just test`; while working the candidate live, this instead pointed
# at the main project's own worktree directly.
rustix = { path = "../clone", features = ["std", "termios", "process"] }
libc = "0.2"

[[bin]]
name = "before"
path = "src/bin/before.rs"

[[bin]]
name = "after"
path = "src/bin/after.rs"

[[bin]]
name = "miri_ub"
path = "src/bin/miri_ub.rs"
