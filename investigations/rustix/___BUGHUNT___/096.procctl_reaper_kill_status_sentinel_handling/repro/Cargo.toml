[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pid::from_raw is portable (src/pid.rs, no cfg gating) - it's the exact function the
# FreeBSD-only `reaper_kill` (src/process/procctl.rs) calls internally, so it can be exercised
# directly on any host even though `reaper_kill` itself is `#[cfg(freebsdlike)]`-gated and cannot
# be compiled or run on this (Linux) sandbox. See RESULT.md "Fully reproducible" for why.
rustix = { path = "../clone", default-features = false, features = ["std", "process"] }
