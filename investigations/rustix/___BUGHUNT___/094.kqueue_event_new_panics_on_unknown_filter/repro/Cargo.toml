[package]
name = "kq_unknown_filter_repro"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Filled in by `just clone` to point at ./clone (a fresh checkout of repo_url @ base_commit) -
# while working the candidate live against a worktree, this can instead point at that worktree
# directly.
rustix = { path = "../clone", features = ["event", "std", "process", "fs"] }
libc = "0.2"

[features]
# Off = pre-patch behavior (Event::new panics on EventFilter::Unknown).
# On  = post-patch behavior (Event::new returns Result, no panic).
fixed = []
