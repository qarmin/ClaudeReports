[package]
name = "port_event_portev_pad_repro"
version = "0.1.0"
edition = "2021"

# Pinned to the exact `libc` version rustix's own Cargo.lock resolves to at
# base_commit (287214b889865d8e1406a0ee71cc409b6f6191c8): `libc 0.2.189`.
# rustix's `src/backend/libc/c.rs` does `pub(crate) use libc::*;`, so
# rustix's internal `c::port_event` IS this exact `libc::port_event` type -
# not a lookalike. See src/main.rs and ../evidence/ for why this crate talks
# to `libc` directly instead of rustix's own public API (no Miri FFI shim
# exists for `port_create`/`port_get` on illumos, so rustix's real
# `rustix::event::port::get` can't be driven to completion under Miri at
# all - verified in this session with the newest available Miri, see
# RESULT.md).
[dependencies]
libc = "=0.2.189"

[workspace]
