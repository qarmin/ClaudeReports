[package]
name = "sendfile_android_repro"
version = "0.1.0"
edition = "2021"

[dependencies]
# Points at ../clone/ (populated by `just clone` into the candidate folder root, sibling of
# this repro/ directory) - the rustix crate root is at the top of the clone.
rustix = { path = "../clone", default-features = false, features = ["std", "fs", "use-libc"] }

