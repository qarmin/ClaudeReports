[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
rustix = { path = "../clone", features = ["std", "system", "net", "event", "termios", "process", "time", "use-libc"] }

[[bin]]
name = "poison_byte_real_syscalls"
path = "src/bin/poison_byte_real_syscalls.rs"

[[bin]]
name = "uname_public_api"
path = "src/bin/uname_public_api.rs"

[[bin]]
name = "socketpair_public_api"
path = "src/bin/socketpair_public_api.rs"

[[bin]]
name = "kevent_public_api"
path = "src/bin/kevent_public_api.rs"

[[bin]]
name = "port_get_public_api"
path = "src/bin/port_get_public_api.rs"

[[bin]]
name = "tcgetattr_public_api"
path = "src/bin/tcgetattr_public_api.rs"
