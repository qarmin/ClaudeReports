[workspace]

[package]
name = "repro_065"
version = "0.1.0"
edition = "2021"

[dependencies]
# Path filled in relative to this folder: `../clone` is created by `just clone`
# (see the sibling `justfile`), a fresh checkout of `repo_url` at `base_commit`.
rustix = { path = "../clone", default-features = false, features = ["std", "net", "use-libc", "time"] }
libc = "0.2"
