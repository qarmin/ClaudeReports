[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
# Points at ./clone (gitignored), populated by this folder's own justfile's `clone` recipe -
# see SKILL.md's "Why per-candidate folders clone instead of referencing the main project".
rustix = { path = "../clone", features = ["std", "net", "fs"] }

[profile.release]
panic = "unwind"
