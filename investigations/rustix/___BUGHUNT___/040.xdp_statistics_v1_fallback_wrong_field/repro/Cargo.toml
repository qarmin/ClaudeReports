[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Selects which of the two verbatim-transcribed branch bodies in src/main.rs
# runs: default = the real pre-patch (buggy) branch as of base_commit below;
# "fixed" = the real post-patch branch from this candidate's patch.diff.
default = []
fixed = []

[dependencies]
# Pinned to the exact release cut at this candidate's base_commit (287214b8,
# "chore: Release rustix version 1.1.5") so `XdpStatistics`'s field layout is
# guaranteed to match what's being transcribed below, with no local path
# dependency on a clone (not needed - the function under test is `pub(crate)`
# and can't be called from outside the crate regardless of how it's fetched).
rustix = { version = "=1.1.5", default-features = false, features = ["std", "net", "event", "process"] }
linux-raw-sys = { version = "0.12", default-features = false, features = ["general", "no_std", "xdp"] }
libc = "0.2"
