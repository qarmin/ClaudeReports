[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
# Path is filled in by the justfile's `clone` step, which checks out `rustix` at the exact
# `base_commit` this candidate was found against, into ../clone. The whole point of this
# candidate is the *feature selection* below: a real downstream consumer that only wants the
# `net` API, exactly as reported in https://github.com/bytecodealliance/rustix/issues/1689.
rustix = { path = "../clone", default-features = false, features = ["std", "net"] }
