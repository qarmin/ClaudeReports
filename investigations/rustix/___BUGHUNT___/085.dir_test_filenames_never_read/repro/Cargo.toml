[workspace]

[package]
name = "repro-085"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "weak_check"
path = "src/bin/weak_check.rs"

[[bin]]
name = "strong_check"
path = "src/bin/strong_check.rs"

[dependencies]
# Points at the pristine (optionally mutant-patched) clone produced by
# `just clone` / `just mutate` in this folder's own justfile - never at the
# main project checkout this candidate was found in.
rustix = { path = "../clone", features = ["fs"] }
tempfile = "3"
