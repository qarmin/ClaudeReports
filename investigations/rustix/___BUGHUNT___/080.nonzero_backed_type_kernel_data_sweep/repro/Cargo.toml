[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# Adapted by this candidate's own justfile to point at ../clone/ (the pristine checkout `just
# clone` makes) when run via `just test`.
rustix = { path = "../clone", features = ["std", "termios", "process"] }
libc = "0.2"

[[bin]]
name = "real_tcgetsid"
path = "src/bin/real_tcgetsid.rs"

[[bin]]
name = "miri_ub"
path = "src/bin/miri_ub.rs"
