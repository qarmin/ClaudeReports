[workspace]

[package]
name = "kreg_repro"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kreg_repro"
path = "src/main.rs"

[profile.dev]
# opt-level 0 on purpose: at -O rustc's MIR GVN can const-fold the stdarch intrinsics through the
# const-eval interpreter, so the backend never has to codegen the `asm!` blocks at all.
opt-level = 0
