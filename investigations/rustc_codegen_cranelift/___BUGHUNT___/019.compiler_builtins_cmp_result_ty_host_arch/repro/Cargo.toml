[workspace]

[package]
name = "f128_cmp_aarch64"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "f128_cmp_aarch64"
path = "src/main.rs"

# opt-level 0 on purpose: at -O rustc's MIR GVN const-folds f128 comparisons through the
# const-eval interpreter, so a miscompiling backend would still print the right answer.
[profile.dev]
opt-level = 0
panic = "abort"
debug = false
