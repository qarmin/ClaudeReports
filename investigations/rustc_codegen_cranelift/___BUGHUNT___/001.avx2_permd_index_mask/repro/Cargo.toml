[workspace]

[package]
name = "permd_repro"
version = "0.0.0"
edition = "2021"

# opt-level 0 on purpose: at -O rustc's MIR GVN can const-fold SIMD intrinsic calls through the
# const-eval interpreter, so a miscompiling backend would still print the right answer.
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 0
