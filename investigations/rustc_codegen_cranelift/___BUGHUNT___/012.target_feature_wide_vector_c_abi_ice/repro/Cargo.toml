[workspace]

[package]
name = "tf_wide_vector_abi"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wide"
path = "src/bin/wide.rs"

[[bin]]
name = "control"
path = "src/bin/control.rs"

# Keep opt-level 0 on both profiles: at -O rustc's MIR GVN can const-fold SIMD intrinsic calls
# through the const-eval interpreter, which would hide a backend bug behind a compile-time answer.
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 0
