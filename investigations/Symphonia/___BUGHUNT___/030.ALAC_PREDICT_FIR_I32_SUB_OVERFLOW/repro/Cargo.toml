# Standalone repro crate. It depends on the Symphonia checkout that this candidate folder's
# justfile clones into ../clone, so it always builds against whatever state ./clone is in
# (pristine for `reproduce-before`, patched for `reproduce-after`).
[workspace]

[package]
name = "alac-predict-repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia = { path = "../clone/symphonia", default-features = false, features = ["alac", "caf"] }

# The bug manifests as an arithmetic-overflow panic, which is only checked when overflow checks
# are enabled. Cargo's `dev` profile enables them by default; force them on for `release` too so
# the repro behaves the same either way.
[profile.release]
debug-assertions = true
overflow-checks = true
