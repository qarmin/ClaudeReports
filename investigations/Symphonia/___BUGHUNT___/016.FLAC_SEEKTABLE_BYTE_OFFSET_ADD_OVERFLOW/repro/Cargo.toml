[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia-core = { path = "../clone/symphonia-core" }
symphonia-bundle-flac = { path = "../clone/symphonia-bundle-flac" }

[[bin]]
name = "repro"
path = "src/main.rs"

[profile.release]
debug = true
# The bug is a checked-arithmetic overflow panic; without this, a plain `cargo run --release`
# would silently wrap instead of demonstrating the bug (see RESULT.md's release-mode note).
overflow-checks = true
