[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia-core = { path = "../clone/symphonia-core" }
symphonia-format-mkv = { path = "../clone/symphonia-format-mkv" }
env_logger = "0.11"

[[bin]]
name = "repro"
path = "main.rs"

[profile.dev]
overflow-checks = true
debug-assertions = true

[profile.release]
debug = true
overflow-checks = true
debug-assertions = true
