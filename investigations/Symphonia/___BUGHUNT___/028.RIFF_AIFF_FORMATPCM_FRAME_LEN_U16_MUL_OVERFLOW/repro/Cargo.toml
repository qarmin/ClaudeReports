[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia = { path = "../clone/symphonia", default-features = false, features = [
    "aiff",
    "wav",
    "pcm",
] }

[[bin]]
name = "repro"
path = "src/main.rs"

[profile.release]
debug = true
# The bug is a checked-arithmetic overflow panic; without this, a plain `cargo run --release`
# would silently wrap the multiplication to 0 instead of demonstrating the bug (see RESULT.md's
# release-mode note). Cargo's own `dev` profile enables overflow-checks by default, so a plain
# `cargo run` shows the same panic with no extra configuration.
overflow-checks = true
