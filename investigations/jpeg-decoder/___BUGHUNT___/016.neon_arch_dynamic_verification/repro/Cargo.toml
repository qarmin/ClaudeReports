[package]
name = "neon-dynamic-verification-repro"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
jpeg-decoder = { git = "https://github.com/image-rs/jpeg-decoder.git", rev = "eb2d7c0f6a2d0298aba7a7f8b9ca1440353e8f8c", features = ["nightly_aarch64_neon"] }
png = "0.17"
libc = "0.2"

[features]
default = ["nightly_aarch64_neon"]
# Mirrors jpeg-decoder's own feature of the same name purely so this binary's own `cfg!` checks
# (used only to print which arch path is active - not to gate any actual decoding logic) can see
# it; the dependency's NEON code is compiled in regardless, via the `features = [...]` above.
nightly_aarch64_neon = ["jpeg-decoder/nightly_aarch64_neon"]

[profile.release]
opt-level = 2
debug = true
