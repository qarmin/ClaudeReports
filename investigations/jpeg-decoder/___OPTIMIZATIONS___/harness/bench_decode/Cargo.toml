[package]
name = "bench_decode"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# Local-session path: 3 levels up from harness/bench_decode/ lands on the jpeg-decoder repo
# root. A candidate's own justfile copies this whole folder into ./clone/bench_decode and
# rewrites this line to `path = ".."` (the clone root) - see README.md "Instrumentation".
jpeg-decoder = { path = "../../.." }

[profile.release]
debug = true
