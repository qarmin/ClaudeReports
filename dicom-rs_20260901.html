rite_all(&codec.encode(sop_class_uid).context(\n 1021 |                                     EncodeFieldSnafu {\n 1022 |                                         field: \"SOP-class-uid\",\n 1023 |                                     },\n 1024 |                                 )?)\n 1025 |                                 .context(WriteFieldSnafu {\n 1026 |                                     field: \"SOP-class-uid\",\n 1027 |                                 })\n 1028 |                         })\n 1029 |                         .context(WriteChunkSnafu {\n 1030 |                             name: \"SOP-class-uid\",\n 1031 |                         })?;\n 1032 | \n 1033 |                         // xxx-xxx Service-class-application-information - This field shall contain\n 1034 |                         // the application information specific to the Service Class specification\n 1035 |                         // identified by the SOP-class-uid. The semantics and value of this field is\n 1036 |                         // defined in the identified Service Class specification.\n 1037 |                         writer.write_all(data).context(WriteFieldSnafu {\n 1038 |                             field: \"Service-class-application-information\",\n 1039 |                         })\n 1040 |                     })\n 1041 |                     .context(WriteChunkSnafu { name: \"Sub-item\" })?;","lines":188,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/pdu/writer.rs#L854-L1041"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`DataElement::update_value` recomputes the header length as `Length(byte_len as u32)` where `byte_len: usize` comes from `PrimitiveValue::calculate_byte_len()`. On a 64-bit platform with a value larger than `u32::MAX` bytes this truncates the length, producing a header length inconsistent with the actual value size.","fix":"Use a checked conversion (`u32::try_from(byte_len)`) and either saturate to `Length::UNDEFINED` or surface an error when the byte length exceeds `u32::MAX`.","locations":[{"ref":"core/src/header.rs:262-268","code":"  262 |     pub fn update_value(&mut self, mut f: impl FnMut(&mut Value<I, P>)) {\n  263 |         f(&mut self.value);\n  264 |         match &mut self.value {\n  265 |             Value::Primitive(v) => {\n  266 |                 let byte_len = v.calculate_byte_len();\n  267 |                 self.header.len = Length(byte_len as u32);\n  268 |             }","lines":7,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/header.rs#L262-L268"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`Length`'s `Add<i32>` and `SubAssign<i32>` implementations compute `(len as i32 + rhs) as u32` / `(len as i32 - rhs) as u32`. For defined lengths larger than `i32::MAX` (valid up to `0xFFFF_FFFE`), `len as i32` wraps to a negative value and the arithmetic produces an incorrect result. Only a `debug_assert!` guards against colliding with the undefined-length sentinel, so release builds silently produce wrong lengths.","fix":"Perform the arithmetic without the round-trip through `i32`, e.g. use `checked_add_signed`/`checked_sub` on the `u32` (or widen to `i64`) and handle out-of-range results explicitly.","locations":[{"ref":"core/src/header.rs:1237-1254","code":" 1237 | impl std::ops::Add<i32> for Length {\n 1238 |     type Output = Self;\n 1239 | \n 1240 |     fn add(self, rhs: i32) -> Self::Output {\n 1241 |         match self.0 {\n 1242 |             UNDEFINED_LEN => Length::UNDEFINED,\n 1243 |             len => {\n 1244 |                 let o = (len as i32 + rhs) as u32;\n 1245 |                 debug_assert!(\n 1246 |                     o != UNDEFINED_LEN,\n 1247 |                     \"integer overflow (0xFFFF_FFFF reserved for undefined length)\"\n 1248 |                 );\n 1249 | \n 1250 |                 Length(o)\n 1251 |             }\n 1252 |         }\n 1253 |     }\n 1254 | }","lines":18,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/header.rs#L1237-L1254"},{"ref":"core/src/header.rs:1291-1304","code":" 1291 | impl std::ops::SubAssign<i32> for Length {\n 1292 |     fn sub_assign(&mut self, rhs: i32) {\n 1293 |         match self.0 {\n 1294 |             UNDEFINED_LEN => (), // no-op\n 1295 |             len => {\n 1296 |                 self.0 = (len as i32 - rhs) as u32;\n 1297 |                 debug_assert!(\n 1298 |                     self.0 != UNDEFINED_LEN,\n 1299 |                     \"integer overflow (0xFFFF_FFFF reserved for undefined length)\"\n 1300 |                 );\n 1301 |             }\n 1302 |         }\n 1303 |     }\n 1304 | }","lines":14,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/header.rs#L1291-L1304"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Fragments::len` accumulates `acc + fragment.len() as u32 + 8u32` in a `u32`, and the `From<Vec<Fragments>>` conversion accumulates `current_offset + offset` in `u32`. For large fragment data these additions overflow (panic in debug builds, wraparound in release), corrupting the basic offset table.","fix":"Use `checked_add`/`saturating_add` (or accumulate in `u64` and validate the result fits in `u32`) so oversized offsets are detected rather than silently wrapping.","locations":[{"ref":"core/src/value/fragments.rs:82-86","code":"   82 |     pub fn len(&self) -> u32 {\n   83 |         self.fragments\n   84 |             .iter()\n   85 |             .fold(0u32, |acc, fragment| acc + fragment.len() as u32 + 8u32)\n   86 |     }","lines":5,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/fragments.rs#L82-L86"},{"ref":"core/src/value/fragments.rs:112-116","code":"  112 |             if index < last_frame {\n  113 |                 let offset = frame.len();\n  114 |                 offset_table.push(current_offset + offset);\n  115 |                 current_offset += offset;\n  116 |             }","lines":5,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/fragments.rs#L112-L116"}]},{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `update_from_img`, `img.width()` and `img.height()` are `u32` but are cast to `u16` with `width as u16` / `height as u16` when writing the `COLUMNS` and `ROWS` elements. An input image wider or taller than 65535 pixels is silently truncated (wrapping modulo 65536) instead of being rejected, producing a corrupt DICOM object whose `Rows`/`Columns` disagree with the actual pixel data. This is a CLI tool operating on user-supplied images, so impact is limited, but it should error rather than truncate.","fix":"Validate the dimensions before casting, e.g. `let width: u16 = img.width().try_into().unwrap_or_else(|_| { eprintln!(\"image too large: {} columns\", img.width()); std::process::exit(-2) });` (and likewise for height), instead of `width as u16` / `height as u16`.","locations":[{"ref":"fromimage/src/main.rs:272-281","code":"  272 |     obj.put(DataElement::new(\n  273 |         tags::COLUMNS,\n  274 |         VR::US,\n  275 |         PrimitiveValue::from(width as u16),\n  276 |     ));\n  277 |     obj.put(DataElement::new(\n  278 |         tags::ROWS,\n  279 |         VR::US,\n  280 |         PrimitiveValue::from(height as u16),\n  281 |     ));","lines":10,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/fromimage/src/main.rs#L272-L281"},{"ref":"fromimage/src/main.rs:223-226","code":"  223 | fn update_from_img(obj: &mut DefaultDicomObject, img: &DynamicImage, verbose: bool) {\n  224 |     let width = img.width();\n  225 |     let height = img.height();\n  226 |     let color = img.color();","lines":4,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/fromimage/src/main.rs#L223-L226"}]},{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`calculate_information_group_length` sums `dicom_len(...)` (each `(len as u32 + 1) & !1`) plus per-element `+ 8`/`+ 12` overheads into a `u32`. `dicom_len` (meta.rs:1438-1440) and `even_len` (mem.rs:2407-2409) each also do `+ 1` on a `u32` derived from a length. When a file meta group approaches `u32::MAX` bytes (element value lengths are `u32`), these additions can overflow, panicking in debug builds and silently wrapping in release. The values originate from parsed file/network input, so a crafted (very large) file meta group is the trigger. Impact is limited because reaching this requires reading multi-gigabyte inputs.","fix":"Use checked/saturating arithmetic when accumulating the group length and in `dicom_len`/`even_len` (e.g. `saturating_add` and `len.saturating_add(1) & !1`), or perform the accumulation in `u64` and clamp to `u32`.","locations":[{"ref":"object/src/meta.rs:524-566","code":"  524 |     fn calculate_information_group_length(&self) -> u32 {\n  525 |         // determine the expected meta group size based on the given fields.\n  526 |         // attribute FileMetaInformationGroupLength is not included\n  527 |         // in the calculations intentionally\n  528 |         14 + 8\n  529 |             + dicom_len(&self.media_storage_sop_class_uid)\n  530 |             + 8\n  531 |             + dicom_len(&self.media_storage_sop_instance_uid)\n  532 |             + 8\n  533 |             + dicom_len(&self.transfer_syntax)\n  534 |             + 8\n  535 |             + dicom_len(&self.implementation_class_uid)\n  536 |             + self\n  537 |                 .implementation_version_name\n  538 |                 .as_ref()\n  539 |                 .map(|s| 8 + dicom_len(s))\n  540 |                 .unwrap_or(0)\n  541 |             + self\n  542 |                 .source_application_entity_title\n  543 |                 .as_ref()\n  544 |                 .map(|s| 8 + dicom_len(s))\n  545 |                 .unwrap_or(0)\n  546 |             + self\n  547 |                 .sending_application_entity_title\n  548 |                 .as_ref()\n  549 |                 .map(|s| 8 + dicom_len(s))\n  550 |                 .unwrap_or(0)\n  551 |             + self\n  552 |                 .receiving_application_entity_title\n  553 |                 .as_ref()\n  554 |                 .map(|s| 8 + dicom_len(s))\n  555 |                 .unwrap_or(0)\n  556 |             + self\n  557 |                 .private_information_creator_uid\n  558 |                 .as_ref()\n  559 |                 .map(|s| 8 + dicom_len(s))\n  560 |                 .unwrap_or(0)\n  561 |             + self\n  562 |                 .private_information\n  563 |                 .as_ref()\n  564 |                 .map(|x| 12 + ((x.len() as u32 + 1) & !1))\n  565 |                 .unwrap_or(0)\n  566 |     }","lines":43,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/object/src/meta.rs#L524-L566"},{"ref":"object/src/meta.rs:1438-1440","code":" 1438 | fn dicom_len<T: AsRef<str>>(x: T) -> u32 {\n 1439 |     (x.as_ref().len() as u32 + 1) & !1\n 1440 | }","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/object/src/meta.rs#L1438-L1440"},{"ref":"object/src/mem.rs:2407-2409","code":" 2407 | fn even_len(l: u32) -> u32 {\n 2408 |     (l + 1) & !1\n 2409 | }","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/object/src/mem.rs#L2407-L2409"}]},{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `VoiLutTransform::apply`, `(value_rounded - self.lut.min_pixel_value) as usize` subtracts two `i32`s where `value_rounded` can be up to `i32::MAX` and `min_pixel_value` (from the DICOM LUT descriptor) can be as low as `i32::MIN`; the subtraction overflows `i32` (debug panic, silent wrap in release) for adversarial LUT descriptors. This is on the pixel-transform path.","fix":"Use a widening/checked subtraction, e.g. `(value_rounded as i64 - self.lut.min_pixel_value as i64)` and then range-check before `as usize`.","locations":[{"ref":"pixeldata/src/transform.rs:231-241","code":"  231 |     pub fn apply(&self, value: f64) -> f64 {\n  232 |         let value_rounded = value.round().clamp(i32::MIN as f64, i32::MAX as f64) as i32;\n  233 |         let y = (*(if value_rounded <= self.lut.min_pixel_value {\n  234 |             self.lut.data.first().unwrap()\n  235 |         } else {\n  236 |             self.lut\n  237 |                 .data\n  238 |                 .get((value_rounded - self.lut.min_pixel_value) as usize)\n  239 |                 .unwrap_or(self.lut.data.last().unwrap())\n  240 |         })) << self.shift;\n  241 |         y as f64","lines":11,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/transform.rs#L231-L241"}]},{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Presentation context IDs are generated as `id: (2 * i + 1) as u8` where `i` is the zero-based index of proposed presentation contexts. DICOM presentation context IDs are odd values 1..255, so with more than 127 presentation contexts the expression exceeds 255 and the `as u8` cast wraps, producing duplicate/colliding context IDs (and `process_a_association_resp` then matches accepted contexts by id via `find`, which could bind the wrong proposed context). This is client-configuration controlled, not network-triggered, hence low severity.","fix":"Reject or cap the number of proposed presentation contexts (max 128) before building the request, or return an error when `2 * i + 1 > u8::MAX`, e.g. `u8::try_from(2 * i + 1)` with a proper error instead of a truncating `as u8`.","locations":[{"ref":"ul/src/association/client.rs:775-787","code":"  775 |         let presentation_contexts_proposed: Vec<_> = presentation_contexts\n  776 |             .iter()\n  777 |             .enumerate()\n  778 |             .map(|(i, presentation_context)| PresentationContextProposed {\n  779 |                 id: (2 * i + 1) as u8,\n  780 |                 abstract_syntax: presentation_context.0.to_string(),\n  781 |                 transfer_syntaxes: presentation_context\n  782 |                     .1\n  783 |                     .iter()\n  784 |                     .map(|uid| uid.to_string())\n  785 |                     .collect(),\n  786 |             })\n  787 |             .collect();","lines":13,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/association/client.rs#L775-L787"}]},{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`HasLength::length` computes `Length::defined(self.calculate_byte_len() as u32)`, truncating a `usize` byte count to `u32`. For a value whose encoded length exceeds 4 GiB (e.g. a very large `U8`/`OB` pixel-data buffer), the reported length wraps to a wrong small value. This is documented as an estimate not to be relied on for encoding, so impact is limited, but the silent truncating cast can still mislead consumers presenting size to the user.","fix":"Saturate rather than truncate: `Length::defined(self.calculate_byte_len().min(u32::MAX as usize) as u32)`, or use `u32::try_from(...).unwrap_or(u32::MAX)`.","locations":[{"ref":"core/src/value/primitive.rs:4203-4207","code":" 4203 | impl HasLength for PrimitiveValue {\n 4204 |     fn length(&self) -> Length {\n 4205 |         Length::defined(self.calculate_byte_len() as u32)\n 4206 |     }\n 4207 | }","lines":5,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/primitive.rs#L4203-L4207"}]},{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"In the token-generation (writing) path, lengths are computed with truncating/overflowing casts: `OffsetTableItemTokens::next` computes `Length(value.as_ref().len() as u32 * 4)` (both `as u32` truncation and `* 4` can overflow) and `ItemValueTokens::next` computes `Length(value.as_ref().len() as u32)`. These only trigger for in-memory values larger than ~1-4 GiB (not from parsing untrusted input), so the practical impact is low, but the multiplication can wrap in release builds producing a wrong declared length.","fix":"Use checked/saturating arithmetic and validate the length fits in `u32` before casting, e.g. `u32::try_from(value.as_ref().len().checked_mul(4).ok_or(..)?)`, returning an error (or `Length::UNDEFINED`) instead of silently wrapping.","locations":[{"ref":"parser/src/dataset/mod.rs:1019-1033","code":" 1019 |     fn next(&mut self) -> Option<Self::Item> {\n 1020 |         let (out, next_state) = match self {\n 1021 |             OffsetTableItemTokens::Start(value) => {\n 1022 |                 let value = value.take().unwrap();\n 1023 |                 let len = Length(value.as_ref().len() as u32 * 4);\n 1024 | \n 1025 |                 (\n 1026 |                     Some(DataToken::ItemStart { len }),\n 1027 |                     if len == Length(0) {\n 1028 |                         OffsetTableItemTokens::Done\n 1029 |                     } else {\n 1030 |                         OffsetTableItemTokens::Value(value)\n 1031 |                     },\n 1032 |                 )\n 1033 |             }","lines":15,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/dataset/mod.rs#L1019-L1033"},{"ref":"parser/src/dataset/mod.rs:937-956","code":"  937 |     fn next(&mut self) -> Option<Self::Item> {\n  938 |         let (out, next_state) = match self {\n  939 |             ItemValueTokens::Start(value, invalidate_len) => {\n  940 |                 let value = value.take().unwrap();\n  941 |                 let end_item = value.as_ref().is_empty();\n  942 |                 let len = if *invalidate_len && !end_item {\n  943 |                     Length::UNDEFINED\n  944 |                 } else {\n  945 |                     Length(value.as_ref().len() as u32)\n  946 |                 };\n  947 | \n  948 |                 (\n  949 |                     Some(DataToken::ItemStart { len }),\n  950 |                     if end_item {\n  951 |                         ItemValueTokens::Done\n  952 |                     } else {\n  953 |                         ItemValueTokens::Value(value)\n  954 |                     },\n  955 |                 )\n  956 |             }","lines":20,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/dataset/mod.rs#L937-L956"}]},{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"The per-file `message_id: u16` counter is incremented with `message_id += 1` per file with no wrap handling. Sending more than 65535 instances over a single association overflows (debug panic / silent wrap in release).","fix":"Use `message_id = message_id.wrapping_add(1)` (or widen to `u32` with an explicit cap) and note that DIMSE message IDs are only unique within an association.","locations":[{"ref":"storescu/src/store_async.rs:219-256","code":"  219 |     let mut message_id = 1;\n  220 |     loop {\n  221 |         let file = {\n  222 |             let mut files = d_files.lock().await;\n  223 |             files.pop()\n  224 |         };\n  225 |         let mut file = match file {\n  226 |             Some(file) => file,\n  227 |             None => break,\n  228 |         };\n  229 |         let r: Result<_, Error> = check_presentation_contexts(\n  230 |             &file,\n  231 |             scu.presentation_contexts(),\n  232 |             ignore_sop_class,\n  233 |             never_transcode,\n  234 |         );\n  235 |         match r {\n  236 |             Ok((pc, ts)) => {\n  237 |                 if verbose {\n  238 |                     debug!(\n  239 |                         \"{}: Selected presentation context: {:?}\",\n  240 |                         file.file.display(),\n  241 |                         pc\n  242 |                     );\n  243 |                 }\n  244 |                 file.pc_selected = Some(pc);\n  245 |                 file.ts_selected = Some(ts);\n  246 |             }\n  247 |             Err(e) => {\n  248 |                 error!(\"{}\", Report::from_error(e));\n  249 |                 if fail_first {\n  250 |                     let _ = scu.abort().await;\n  251 |                     std::process::exit(-2);\n  252 |                 }\n  253 |             }\n  254 |         }\n  255 |         scu = send_file(scu, file, message_id, pbx.as_ref(), verbose, fail_first).await?;\n  256 |         message_id += 1;","lines":38,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/storescu/src/store_async.rs#L219-L256"},{"ref":"storescu/src/store_sync.rs:220-249","code":"  220 |     for (message_id, mut file) in (1..).zip(d_files) {\n  221 |         // identify the right transfer syntax to use\n  222 |         let r: Result<_, Error> = check_presentation_contexts(\n  223 |             &file,\n  224 |             scu.presentation_contexts(),\n  225 |             ignore_sop_class,\n  226 |             never_transcode,\n  227 |         );\n  228 |         match r {\n  229 |             Ok((pc, ts)) => {\n  230 |                 if verbose {\n  231 |                     debug!(\n  232 |                         \"{}: Selected presentation context: {:?}\",\n  233 |                         file.file.display(),\n  234 |                         pc\n  235 |                     );\n  236 |                 }\n  237 |                 file.pc_selected = Some(pc);\n  238 |                 file.ts_selected = Some(ts);\n  239 |             }\n  240 |             Err(e) => {\n  241 |                 error!(\"{}\", Report::from_error(e));\n  242 |                 if fail_first {\n  243 |                     let _ = scu.abort();\n  244 |                     std::process::exit(-2);\n  245 |                 }\n  246 |             }\n  247 |         }\n  248 |         scu = send_file(scu, file, message_id, pbx.as_ref(), verbose, fail_first)?;\n  249 |     }","lines":30,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/storescu/src/store_sync.rs#L220-L249"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The hand-written `Default` impl for `TlsOptions` sets `peer_cert: PeerCertOption::Ignore` and `enabled: true`, which disables peer certificate verification. This contradicts the clap-derived CLI defaults on the same struct (`enabled = false` at line 61 and `peer_cert = PeerCertOption::Require` at line 106). Any code path that constructs `TlsOptions::default()` and builds a client/server config will silently skip certificate verification, enabling man-in-the-middle attacks.","fix":"Make the `Default` impl match the safe CLI defaults:\n```rust\nSelf {\n    enabled: false,\n    // ...\n    peer_cert: PeerCertOption::Require,\n}\n```","locations":[{"ref":"app-common/src/lib.rs:111-126","code":"  111 | impl Default for TlsOptions {\n  112 |     fn default() -> Self {\n  113 |         Self {\n  114 |             enabled: true,\n  115 |             crypto_provider: CryptoProvider::AwsLC,\n  116 |             cipher_suites: None,\n  117 |             protocol_versions: vec![TlsProtocolVersion::TLS1_2, TlsProtocolVersion::TLS1_3],\n  118 |             key: None,\n  119 |             cert: None,\n  120 |             add_certs: None,\n  121 |             add_crls: None,\n  122 |             system_roots: false,\n  123 |             peer_cert: PeerCertOption::Ignore,\n  124 |         }\n  125 |     }\n  126 | }","lines":16,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/app-common/src/lib.rs#L111-L126"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Fragments::new` computes the fragment count with 32-bit floating point: `(data.len() as f32 / fragment_size as f32).ceil() as u32`. `f32` has only a 24-bit mantissa, so for `data.len() > 2^24` (16 MiB, realistic for pixel data) the conversion `data.len() as f32` loses precision and rounds down. Concretely, `data.len() == 16_777_217`, `fragment_size == 2` yields `number_of_fragments == 8_388_608` instead of `8_388_609`; `encapsulated_size == 16_777_216 < data.len()`, so no padding is added and `chunks_exact(2)` silently drops the trailing byte(s) - a silent data-loss bug. Additionally `fragment_size * number_of_fragments` is computed in `u32` and can overflow for very large inputs (debug panic / release wraparound).","fix":"Use integer ceiling division instead of `f32`, e.g. `let number_of_fragments = data.len().div_ceil(fragment_size as usize) as u32;` and compute `encapsulated_size` using `usize` (`fragment_size as usize * number_of_fragments as usize`) to avoid both precision loss and `u32` overflow.","locations":[{"ref":"core/src/value/fragments.rs:56-67","code":"   56 |         let number_of_fragments = (data.len() as f32 / fragment_size as f32).ceil() as u32;\n   57 | \n   58 |         // Calculate the encapsulated size. If necessary pad the vector with zeroes so all the\n   59 |         // chunks have the same fragment_size\n   60 |         let mut data = data;\n   61 |         let encapsulated_size = (fragment_size * number_of_fragments) as usize;\n   62 |         if encapsulated_size > data.len() {\n   63 |             data.resize(encapsulated_size, 0);\n   64 |         }\n   65 | \n   66 |         let fragments = data\n   67 |             .chunks_exact(fragment_size as usize)","lines":12,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/fragments.rs#L56-L67"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`DicomTime::from_hms_milli` and `DicomTime::from_hms_micro` only validate the sub-second component (`Millisecond` / `Fraction`) and never call `check_component` for `hour`, `minute`, or `second`. Every other constructor (`from_h`, `from_hm`, `from_hms`, `from_hmsf`) validates all supplied components. As a result `DicomTime::from_hms_milli(99, 61, 61, 0)` (or `from_hms_micro`) returns `Ok(...)` holding an out-of-range time, producing a `DicomTimeImpl::Fraction(99, 61, 61, ...)`. Such an invalid value then flows into `Display`/`to_encoded` (emitting bogus strings like `99:61:61...`) and into the `AsRange` conversions (`earliest`/`latest`/`to_naive_time`) where it can silently misbehave or fail. This is a validation gap inconsistent with the rest of the API and with the documented invariants.","fix":"Add the missing checks at the top of both functions, mirroring `from_hms`:\n```rust\ncheck_component(DateComponent::Hour, &hour)?;\ncheck_component(DateComponent::Minute, &minute)?;\ncheck_component(DateComponent::Second, &second)?;\n```\nbefore the existing `check_component(DateComponent::Millisecond, ...)` / `check_component(DateComponent::Fraction, ...)` call.","locations":[{"ref":"core/src/value/partial.rs:432-441","code":"  432 |     pub fn from_hms_milli(hour: u8, minute: u8, second: u8, millisecond: u32) -> Result<DicomTime> {\n  433 |         check_component(DateComponent::Millisecond, &millisecond)?;\n  434 |         Ok(DicomTime(DicomTimeImpl::Fraction(\n  435 |             hour,\n  436 |             minute,\n  437 |             second,\n  438 |             millisecond,\n  439 |             3,\n  440 |         )))\n  441 |     }","lines":10,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/partial.rs#L432-L441"},{"ref":"core/src/value/partial.rs:448-457","code":"  448 |     pub fn from_hms_micro(hour: u8, minute: u8, second: u8, microsecond: u32) -> Result<DicomTime> {\n  449 |         check_component(DateComponent::Fraction, &microsecond)?;\n  450 |         Ok(DicomTime(DicomTimeImpl::Fraction(\n  451 |             hour,\n  452 |             minute,\n  453 |             second,\n  454 |             microsecond,\n  455 |             6,\n  456 |         )))\n  457 |     }","lines":10,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/partial.rs#L448-L457"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `dump_file_impl`, the `DumpFormat::Json` branch writes to `stdout()` instead of the `to` writer that was passed in. Every other branch (and the whole point of the `to_stdout` parameter) uses `&mut to`. As a result, `DumpOptions::dump_file_to(writer, obj)` with JSON format silently ignores `writer` and dumps to the process's standard output, so a library consumer capturing the output into a `Vec`/file/socket gets nothing while stdout is unexpectedly polluted. The equivalent object path `dump_object_impl` (line 297) correctly uses `to`.","fix":"Write to the provided writer instead of stdout:\n```rust\nDumpFormat::Json => {\n    let json_obj = DicomJson::from(obj);\n    serde_json::to_writer_pretty(&mut to, &json_obj)?;\n    Ok(())\n}\n```","locations":[{"ref":"dump/src/lib.rs:239-243","code":"  239 |             DumpFormat::Json => {\n  240 |                 let json_obj = DicomJson::from(obj);\n  241 |                 serde_json::to_writer_pretty(stdout(), &json_obj)?;\n  242 |                 Ok(())\n  243 |             }","lines":5,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/dump/src/lib.rs#L239-L243"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the JSON serializer for a data element, the `DicomValue::PixelSequence(_seq)` arm is completely commented out, so any element holding encapsulated (fragmented) pixel data is serialized as just `{\"vr\": \"OB\"}` with no `Value`/`InlineBinary`, silently discarding all pixel data and the offset table. This is a data-loss bug: opening a DICOM file with encapsulated pixel data and serializing to JSON loses the pixels entirely. Correspondingly, the `impl Serialize for DicomJson<&PixelFragmentSequence<Vec<u8>>>` at lines 288-300 is dead code, since the only call site that would use it (line 221) is disabled (confirmed by grep: the type appears only in the unused impl).","fix":"Wire up the existing `DicomJson<&PixelFragmentSequence<Vec<u8>>>` serializer by replacing the no-op arm with `serializer.serialize_entry(\"Value\", &DicomJson(seq))?;` (or explicitly document and return an error), so encapsulated pixel data is emitted (e.g. as `Offset Table` / `Pixel Fragments`) instead of being dropped.","locations":[{"ref":"json/src/ser/mod.rs:221-223","code":"  221 |             DicomValue::PixelSequence(_seq) => {\n  222 |                 //serializer.serialize_entry(\"Value\", &DicomJson(seq))?;\n  223 |             }","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/json/src/ser/mod.rs#L221-L223"},{"ref":"json/src/ser/mod.rs:288-300","code":"  288 | impl Serialize for DicomJson<&PixelFragmentSequence<Vec<u8>>> {\n  289 |     fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>\n  290 |     where\n  291 |         S: Serializer,\n  292 |     {\n  293 |         let offset_table = self.inner().offset_table();\n  294 |         let fragments = self.inner().fragments();\n  295 |         let mut map = serializer.serialize_map(Some(2))?;\n  296 |         map.serialize_entry(\"Offset Table\", offset_table)?;\n  297 |         map.serialize_entry(\"Pixel Fragments\", fragments)?;\n  298 |         map.end()\n  299 |     }\n  300 | }","lines":13,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/json/src/ser/mod.rs#L288-L300"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`DataSetReaderOptions::base_offset` (and its builder `base_offset()`) sets a field that is never used when constructing the reader. In `new_with_ts_cs_options`, both the `flexible_decoding` branch (`StatefulDecoder::new_with_all_options(source, decoder, basic, cs, options.charset_override, 0)`) and the normal branch (`DynStatefulDecoder::new_with_override(source, ts, cs, options.charset_override, 0)`) pass a hard-coded `0` as the position instead of `options.base_offset`. As a result the documented option (\"The position of the reader as received at building time in bytes\") is silently ignored, so all reported positions in errors (`bytes_read`, `InconsistentSequenceEnd`, etc.) are wrong when the reader is created over a source that is not at offset 0.","fix":"Pass `options.base_offset` as the initial position in both branches instead of `0`, e.g. `StatefulDecoder::new_with_all_options(source, decoder, basic, cs, options.charset_override, options.base_offset)` and `DynStatefulDecoder::new_with_override(source, ts, cs, options.charset_override, options.base_offset)`. Alternatively, if the option is genuinely unused, remove the field and builder to avoid a misleading API.","locations":[{"ref":"parser/src/dataset/read.rs:276-292","code":"  276 |         let parser = if options.flexible_decoding\n  277 |             && ts.endianness() == dicom_encoding::Endianness::Little\n  278 |         {\n  279 |             let basic = ts.basic_decoder();\n  280 |             let decoder: DynDecoder<R> = Box::<StandardAdaptiveVRLittleEndianDecoder>::default();\n  281 |             StatefulDecoder::new_with_all_options(\n  282 |                 source,\n  283 |                 decoder,\n  284 |                 basic,\n  285 |                 cs,\n  286 |                 options.charset_override,\n  287 |                 0,\n  288 |             )\n  289 |         } else {\n  290 |             DynStatefulDecoder::new_with_override(source, ts, cs, options.charset_override, 0)\n  291 |                 .context(CreateDecoderSnafu)?\n  292 |         };","lines":17,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/dataset/read.rs#L276-L292"},{"ref":"parser/src/dataset/read.rs:184-200","code":"  184 | impl DataSetReaderOptions {\n  185 |     /// Replace the value reading strategy of the options.\n  186 |     pub fn value_read(mut self, value_read: ValueReadStrategy) -> Self {\n  187 |         self.value_read = value_read;\n  188 |         self\n  189 |     }\n  190 |     /// Replace the base reader offset of the options.\n  191 |     pub fn base_offset(mut self, base_offset: u64) -> Self {\n  192 |         self.base_offset = base_offset;\n  193 |         self\n  194 |     }\n  195 |     /// Enable or disable flexible VR decoding.\n  196 |     pub fn flexible_decoding(mut self, flexible_decoding: bool) -> Self {\n  197 |         self.flexible_decoding = flexible_decoding;\n  198 |         self\n  199 |     }\n  200 | }","lines":17,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/dataset/read.rs#L184-L200"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `from_hmsf` the digit-count check uses a strict `<`, so a `fraction` equal to `10^frac_precision` (which has one digit too many for its stated precision) is not rejected by `FractionPrecisionMismatch`. For example `fraction = 1000, frac_precision = 3` passes this guard even though `1000` has 4 digits, not 3. In practice the caller is saved by the later `check_component(DateComponent::Fraction, &f)` (the scaled value `f = 10^6` always exceeds `999_999` and errors out), so no invalid value is stored, but the user receives the wrong error variant (`InvalidComponent` instead of `FractionPrecisionMismatch`). The comparison is off by one.","fix":"Reject when `fraction` reaches `10^frac_precision`:\n```rust\n// before\nif u32::pow(10, frac_precision as u32) < fraction {\n// after\nif u32::pow(10, frac_precision as u32) <= fraction {\n```","locations":[{"ref":"core/src/value/partial.rs:629-635","code":"  629 |         if u32::pow(10, frac_precision as u32) < fraction {\n  630 |             return FractionPrecisionMismatchSnafu {\n  631 |                 fraction,\n  632 |                 precision: frac_precision,\n  633 |             }\n  634 |             .fail();\n  635 |         }","lines":7,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/partial.rs#L629-L635"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`to_multi_int` is inconsistent for empty values. The arms for `U8`, `U16`, `I16` and `U32` have no emptiness guard and thus map/collect an empty slice into `Ok(vec![])`, and `PrimitiveValue::Empty` also returns `Ok(Vec::new())`. But the `I32`, `U64` and `I64` arms carry a stray `if !s.is_empty()` guard, so an empty `I32`/`U64`/`I64` value falls through to the catch-all `_ => Err(ConvertValueError { .. cause: None })` and returns an error instead of an empty vector. So `dicom_value!(I32, []).to_multi_int::<i32>()` errors while `dicom_value!(U16, []).to_multi_int::<u16>()` succeeds with `vec![]`. The sibling `to_multi_float32`/`to_multi_float64` have no such guards and are consistent, confirming the guards here are unintended.","fix":"Drop the `if !s.is_empty()` guards on the `I32`, `U64` and `I64` arms so empty collections behave like the other integer variants:\n```rust\n// before\nPrimitiveValue::I32(s) if !s.is_empty() => s\n    .iter()\n// after\nPrimitiveValue::I32(s) => s\n    .iter()\n```\n(and likewise for `PrimitiveValue::U64(s)` and `PrimitiveValue::I64(s)`).","locations":[{"ref":"core/src/value/primitive.rs:1166-1213","code":" 1166 |             PrimitiveValue::I32(s) if !s.is_empty() => s\n 1167 |                 .iter()\n 1168 |                 .map(|v| {\n 1169 |                     T::from(*v).ok_or_else(|| ConvertValueError {\n 1170 |                         requested: \"integer\",\n 1171 |                         original: self.value_type(),\n 1172 |                         cause: Some(\n 1173 |                             NarrowConvertSnafu {\n 1174 |                                 value: v.to_string(),\n 1175 |                             }\n 1176 |                             .build()\n 1177 |                             .into(),\n 1178 |                         ),\n 1179 |                     })\n 1180 |                 })\n 1181 |                 .collect::<Result<Vec<_>, _>>(),\n 1182 |             PrimitiveValue::U64(s) if !s.is_empty() => s\n 1183 |                 .iter()\n 1184 |                 .map(|v| {\n 1185 |                     T::from(*v).ok_or_else(|| ConvertValueError {\n 1186 |                         requested: \"integer\",\n 1187 |                         original: self.value_type(),\n 1188 |                         cause: Some(\n 1189 |                             NarrowConvertSnafu {\n 1190 |                                 value: v.to_string(),\n 1191 |                             }\n 1192 |                             .build()\n 1193 |                             .into(),\n 1194 |                         ),\n 1195 |                     })\n 1196 |                 })\n 1197 |                 .collect::<Result<Vec<_>, _>>(),\n 1198 |             PrimitiveValue::I64(s) if !s.is_empty() => s\n 1199 |                 .iter()\n 1200 |                 .map(|v| {\n 1201 |                     T::from(*v).ok_or_else(|| ConvertValueError {\n 1202 |                         requested: \"integer\",\n 1203 |                         original: self.value_type(),\n 1204 |                         cause: Some(\n 1205 |                             NarrowConvertSnafu {\n 1206 |                                 value: v.to_string(),\n 1207 |                             }\n 1208 |                             .build()\n 1209 |                             .into(),\n 1210 |                         ),\n 1211 |                     })\n 1212 |                 })\n 1213 |                 .collect::<Result<Vec<_>, _>>(),","lines":48,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/primitive.rs#L1166-L1213"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`dump_file_impl` sets the color override purely from `self.color`, ignoring the `to_stdout` flag, whereas `dump_object_impl` (lines 276-281) deliberately disables color when writing to a non-stdout destination in `Auto` mode. Because `owo_colors`' `if_supports_color(Stream::Stdout, ..)` probes the process stdout (not the actual `to` target), calling `dump_file_to(writer, obj)` in `Auto` color mode while the process stdout is a TTY will emit ANSI escape codes into `writer` (e.g. a file or pipe), corrupting the captured text. The `_to` variants are otherwise designed to produce clean output (note `no_text_limit`/`no_limit` are forced true for non-stdout).","fix":"Mirror the logic in `dump_object_impl` by taking `to_stdout` into account, e.g. `match (self.color, to_stdout) { (ColorMode::Never, _) | (ColorMode::Auto, false) => owo_colors::set_override(false), (ColorMode::Always, _) => owo_colors::set_override(true), (ColorMode::Auto, true) => owo_colors::unset_override(), }`.","locations":[{"ref":"dump/src/lib.rs:214-218","code":"  214 |         match self.color {\n  215 |             ColorMode::Never => owo_colors::set_override(false),\n  216 |             ColorMode::Always => owo_colors::set_override(true),\n  217 |             ColorMode::Auto => owo_colors::unset_override(),\n  218 |         }","lines":5,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/dump/src/lib.rs#L214-L218"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"When inferring a VR for a newly-created element, `apply_change_value_impl` and all seven `apply_push_*_impl` helpers hardcode `dicom_dictionary_std::StandardDataDictionary` instead of the object's own dictionary `self.dict`. The main `apply` navigation (line 1536) correctly uses `self.dict.clone()` for the same purpose. For an `InMemDicomObject<D>` built with a custom dictionary `D`, `Set`/`SetStr`/`Push*` actions on an absent tag therefore infer the VR from the standard dictionary rather than the object's dictionary, which can produce the wrong VR (or `VR::UN`) for attributes only known to the custom dictionary.","fix":"Use `self.dict` (cloning where required) for VR inference in these helpers, consistent with `apply`, e.g. replace `dicom_dictionary_std::StandardDataDictionary.by_tag(tag)` with `self.dict.by_tag(tag)`.","locations":[{"ref":"object/src/mem.rs:1677-1681","code":" 1677 |             // infer VR from tag\n 1678 |             let vr = dicom_dictionary_std::StandardDataDictionary\n 1679 |                 .by_tag(tag)\n 1680 |                 .and_then(|entry| entry.vr().exact())\n 1681 |                 .unwrap_or(VR::UN);","lines":5,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/object/src/mem.rs#L1677-L1681"},{"ref":"object/src/mem.rs:1725-1729","code":" 1725 |             // infer VR from tag\n 1726 |             let vr = dicom_dictionary_std::StandardDataDictionary\n 1727 |                 .by_tag(tag)\n 1728 |                 .and_then(|entry| entry.vr().exact())\n 1729 |                 .unwrap_or(VR::UN);","lines":5,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/object/src/mem.rs#L1725-L1729"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`parse_voi_lut_entry` rejects a LUT Descriptor whose first value is 0 via `ensure!(descriptor_elements[0] > 0, ...)`. Per DICOM (PS3.3 C.11.1.1), a first LUT Descriptor value of 0 denotes 65536 entries, so valid full-range LUTs are treated as invalid and their VOI LUT sequence is silently dropped (`parse_voi_lut_entry(e).ok()` swallows the error).","fix":"Interpret a first descriptor value of 0 as 65536 entries: `let expected_lut_len = if descriptor_elements[0] == 0 { 65536 } else { descriptor_elements[0] as usize };` and drop the `> 0` rejection (still rejecting negatives).","locations":[{"ref":"pixeldata/src/attribute.rs:665-672","code":"  665 |     ensure!(\n  666 |         descriptor_elements[0] > 0,\n  667 |         InvalidValueSnafu {\n  668 |             name: AttributeName::LutDescriptor,\n  669 |             value: format!(\"value with LUT length {}\", descriptor_elements[0]),\n  670 |         }\n  671 |     );\n  672 |     let expected_lut_len: usize = descriptor_elements[0] as usize;","lines":8,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/attribute.rs#L665-L672"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`FullAeAddr`/`AeAddr` `Display` escapes `@` inside the AE title as `\\@`, but `FromStr` splits on the first raw `@` via `split_once('@')` and never unescapes. An AE title containing `@` therefore does not round-trip: display produces `A\\@B@addr`, but parsing splits at the first `@` yielding ae_title `A\\` and a wrong socket address. The `// !!! there should be a way to escape the @` comments acknowledge this.","fix":"Make parsing consistent with display: either split on the last unescaped `@` and unescape `\\@` in the AE title, or stop escaping in `Display` and document that AE titles cannot contain `@`.","locations":[{"ref":"ul/src/address.rs:105-117","code":"  105 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  106 |         // !!! there should be a way to escape the `@`\n  107 |         if let Some((ae_title, addr)) = s.split_once('@') {\n  108 |             ensure!(!ae_title.is_empty(), MissingPartSnafu);\n  109 |             Ok(FullAeAddr {\n  110 |                 ae_title: ae_title.to_string(),\n  111 |                 socket_addr: addr.parse().context(ParseSocketAddressSnafu)?,\n  112 |             })\n  113 |         } else {\n  114 |             Err(ParseAeAddressError::MissingPart)\n  115 |         }\n  116 |     }\n  117 | }","lines":13,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/address.rs#L105-L117"},{"ref":"ul/src/address.rs:130-139","code":"  130 | impl<T> std::fmt::Display for FullAeAddr<T>\n  131 | where\n  132 |     T: std::fmt::Display,\n  133 | {\n  134 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  135 |         f.write_str(&self.ae_title.replace('@', \"\\\\@\"))?;\n  136 |         f.write_str(\"@\")?;\n  137 |         std::fmt::Display::fmt(&self.socket_addr, f)\n  138 |     }\n  139 | }","lines":10,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/address.rs#L130-L139"},{"ref":"ul/src/address.rs:316-335","code":"  316 | impl<T> std::fmt::Display for AeAddr<T>\n  317 | where\n  318 |     T: std::fmt::Display,\n  319 | {\n  320 |      // 6 - Positive-response-requested\n  882 |                         if bytes.remaining() < 1 {\n  883 |                             return Ok(None);\n  884 |                         }\n  885 |                         let positive_response_requested = bytes.get_u8();\n  886 | \n  887 |                         // 7-8 - Primary Field Length\n  888 |                         if bytes.remaining() < 2 {\n  889 |                             return Ok(None);\n  890 |                         }\n  891 |                         let primary_field_length = bytes.get_u16();\n  892 | \n  893 |                         // 9-n - Primary Field\n  894 |                         if bytes.remaining() < primary_field_length as usize {\n  895 |                             return Ok(None);\n  896 |                         }\n  897 |                         let primary_field = bytes.copy_to_bytes(primary_field_length as usize);\n  898 |                         // n+1-n+2 - Secondary Field Length\n  899 |                         // Only non-zero if user identity type is 2 (username and password)\n  900 |                         if bytes.remaining() < 2 {\n  901 |                             return Ok(None);\n  902 |                         }\n  903 |                         let secondary_field_length = bytes.get_u16();\n  904 | \n  905 |                         // n+3-m - Secondary Field\n  906 |                         if bytes.remaining() < secondary_field_length as usize {\n  907 |                             return Ok(None);\n  908 |                         }\n  909 |                         let secondary_field = bytes.copy_to_bytes(secondary_field_length as usize);\n  910 | \n  911 |                         match UserIdentityType::from(user_identity_type) {\n  912 |                             Some(user_identity_type) => {\n  913 |                                 user_variables.push(UserVariableItem::UserIdentityItem(\n  914 |                                     UserIdentity::new(\n ype":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In the async establish path, when `read_pdu_from_wire_async` fails and the `async-tls` feature is enabled, the original error `e` is discarded in almost all cases. In the `Err(err)` arm of `LazyConfigAcceptor::new(...).await`, both the `if let Ok(rustls::Error::InappropriateMessage { .. })` branch and the fall-through unconditionally `return super::TlsNotSupportedSnafu.fail()`. Since the server's response to a plaintext DICOM request is not a valid TLS ClientHello, `LazyConfigAcceptor` almost always returns `Err`, so genuine errors (connection closed, timeout, malformed PDU) are masked as `TlsNotSupported`. This also inverts the sync version's logic: sync returns `TlsNotSupported` when `acceptor.accept()` succeeds and returns the real error `e` otherwise (`client.rs:953-969`), whereas the async `Ok(_res)` arm returns the real error and the `Err` arm returns `TlsNotSupported`. There is also commented-out dead code at lines 1484-1487.","fix":"Mirror the sync logic: in the `Err(err)` arm only return `TlsNotSupportedSnafu.fail()` when `err.downcast::<rustls::Error>()` yields `InappropriateMessage`, and otherwise `return Err(e)`. Reconsider whether the `Ok(_res)` arm should return `TlsNotSupported` (as sync does) instead of `Err(e)`. Remove the commented-out block at lines 1484-1487.","locations":[{"ref":"ul/src/association/client.rs:1461-1496","code":" 1461 |         let pdu = match resp {\n 1462 |             Ok(pdu) => pdu,\n 1463 |             Err(e) => {\n 1464 |                 // Attempt to check if the failure was because the client sent a TLS stream\n 1465 |                 #[cfg(feature = \"async-tls\")]\n 1466 |                 {\n 1467 |                     use rustls::server::Acceptor;\n 1468 |                     use tokio_rustls::LazyConfigAcceptor;\n 1469 |                     let cursor = std::io::Cursor::new(read_buffer.to_vec());\n 1470 |                     match LazyConfigAcceptor::new(Acceptor::default(), cursor).await {\n 1471 |                         Ok(_res) => {\n 1472 |                             // This means the server responded with a valid TLS\n 1473 |                             // state, but since we didn't originally send a TLS\n 1474 |                             // ClientHello, that shouldn't be possible\n 1475 |                             return Err(e);\n 1476 |                         }\n 1477 |                         Err(err) => {\n 1478 |                             if let Ok(rustls::Error::InappropriateMessage { .. }) =\n 1479 |                                 err.downcast::<rustls::Error>()\n 1480 |                             {\n 1481 |                                 error!(\"Received TLS response to non-TLS request!\");\n 1482 |                                 return super::TlsNotSupportedSnafu.fail();\n 1483 |                             }\n 1484 |                             // if let rustls::Error::InappropriateMessage{..} = err {\n 1485 |                             //     error!(\"Recieved TLS response to non-TLS request!\");\n 1486 |                             //     return super::TlsNotSupportedSnafu.fail()\n 1487 |                             // }\n 1488 |                             // Recieved a valid TLS message, means the server expects TLS\n 1489 |                             return super::TlsNotSupportedSnafu.fail();\n 1490 |                         }\n 1491 |                     }\n 1492 |                 }\n 1493 |                 #[cfg(not(feature = \"async-tls\"))]\n 1494 |                 return Err(e);\n 1495 |             }\n 1496 |         };","lines":36,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/association/client.rs#L1461-L1496"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the multi-value time/date-time conversion methods, parse errors are wrapped with the wrong SNAFU context selector. `to_multi_naive_time` and `to_multi_time` parse *times* but wrap their string/`U8` parse errors with `.context(ParseDateSnafu)` (producing an `InvalidValueReadError::ParseDate` whose message is \"Failed to read text as a date\"), and `to_multi_datetime` parses *date-times* but likewise uses `.context(ParseDateSnafu)` instead of `ParseDateTimeSnafu`. The single-value counterparts are correct (`to_naive_time`/`to_time` use `ParseTimeSnafu` at lines 2364/2585, `to_datetime` uses `ParseDateTimeSnafu` at 2789), which confirms these are copy-paste slips. Callers that match on the error variant, or users reading the message, get a misleading \"date\" error for a time/date-time value. Functionality on the `Ok` path is unaffected.","fix":"Use the matching context selector in each method. In `to_multi_naive_time` and `to_multi_time` replace `.context(ParseDateSnafu)` with `.context(ParseTimeSnafu)`; in `to_multi_datetime` replace `.context(ParseDateSnafu)` with `.context(ParseDateTimeSnafu)`. Example (to_multi_time, Str arm):\n```rust\n// before\n.map(|(date, _rest)| vec![date])\n.context(ParseDateSnafu)\n// after\n.map(|(date, _rest)| vec![date])\n.context(ParseTimeSnafu)\n```","locations":[{"ref":"core/src/value/primitive.rs:2462-2496","code":" 2462 |             PrimitiveValue::Str(s) => {\n 2463 |                 super::deserialize::parse_time(s.trim_end_matches(whitespace_or_null).as_bytes())\n 2464 |                     .map(|(date, _rest)| vec![date])\n 2465 |                     .context(ParseDateSnafu)\n 2466 |                     .map_err(|err| ConvertValueError {\n 2467 |                         requested: \"NaiveTime\",\n 2468 |                         original: self.value_type(),\n 2469 |                         cause: Some(Box::from(err)),\n 2470 |                     })\n 2471 |             }\n 2472 |             PrimitiveValue::Strs(s) => s\n 2473 | miter before the guard evaluates to `false`, after which control falls through to the generic `Err(e)` arm. The reader is terminated (`hard_break = true`) immediately afterward so the corrupted delimiter stack has no further effect, but the mutation-in-guard is fragile and would cause incorrect state if the control flow ever changed.","fix":"Avoid mutating in the guard: peek with `self.seq_delimiters.last().is_some_and(|t| t.pixel_data)` in the guard, and perform the `pop()` inside the arm body once the branch is confirmed taken.","locations":[{"ref":"parser/src/dataset/read.rs:418-433","code":"  418 |                     Err(DecoderError::DecodeItemHeader {\n  419 |                         source: dicom_encoding::decode::Error::ReadItemHeader { source, .. },\n  420 |                         ..\n  421 |                     }) if source.kind() == std::io::ErrorKind::UnexpectedEof\n  422 |                         && self.seq_delimiters.pop().is_some_and(|t| t.pixel_data) =>\n  423 |                     {\n  424 |                         // Note: if `UnexpectedEof` was reached while inside a\n  425 |                         // PixelData Sequence, then we assume that\n  426 |                         // the end of a DICOM object was reached gracefully.\n  427 |                         self.hard_break = true;\n  428 |                         None\n  429 |                     }\n  430 |                     Err(e) => {\n  431 |                         self.hard_break = true;\n  432 |                         Some(Err(e).context(ReadItemHeaderSnafu))\n  433 |                     }","lines":16,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/dataset/read.rs#L418-L433"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the scpproxy forwarding loop, `write_pdu(&mut buffer, &pdu).unwrap()` and `scu_stream.write_all(&buffer).unwrap()` / `scp_stream.write_all(&buffer).unwrap()` panic on any serialization or I/O error (e.g. the peer closing the connection mid-write). Because `run` is called directly on the main thread from the accept loop, such a panic aborts the whole proxy process rather than terminating just the affected connection.","fix":"Replace the `.unwrap()`s with proper error propagation (map to the existing `Error` variants via `.context(...)` / send a `WriteErr` `ThreadMessage`) so a write failure ends only the current connection.","locations":[{"ref":"scpproxy/src/main.rs:221-231","code":"  221 |                             buffer.clear();\n  222 |                             write_pdu(&mut buffer, &pdu).unwrap();\n  223 |                             scu_stream.write_all(&buffer).unwrap();\n  224 |                         }\n  225 |                         ProviderType::Scp => {\n  226 |                             if verbose {\n  227 |                                 println!(\"scu ----> scp: {}\", pdu.short_description());\n  228 |                             }\n  229 |                             buffer.clear();\n  230 |                             write_pdu(&mut buffer, &pdu).unwrap();\n  231 |                             scp_stream.write_all(&buffer).unwrap();","lines":11,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/scpproxy/src/main.rs#L221-L231"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"`VR::to_string(self) -> &'static str` is an inherent method whose name collides with the `ToString::to_string(&self) -> String` provided by the `Display` impl at line 968. `vr.to_string()` resolves to the inherent method and returns a `&'static str` rather than a `String`, which is surprising to readers and is flagged by clippy's `inherent_to_string`/`should_implement_trait` lints.","fix":"Rename the inherent method (e.g. `as_str`) so it no longer shadows the conventional `ToS _to_vec(len, ..)` only writes `len >> 2` (i.e. `len/4`) `u32` values, this over-reserves by a factor of 4: it allocates `len * 4` bytes when only `len` bytes are needed. With an attacker-controlled item length (up to ~4 GiB) this amplifies the pre-allocation to ~16 GiB, worsening a memory-exhaustion DoS from a tiny crafted file.","fix":"Reserve the number of `u32` elements, not bytes:\n```rust\n// before\nlet mut offset_table = Vec::with_capacity(len);\n// after\nlet mut offset_table = Vec::with_capacity(len / 4);\n```","locations":[{"ref":"parser/src/dataset/read.rs:447-461","code":"  447 |                 if self.offset_table_next {\n  448 |                     // offset table\n  449 |                     let mut offset_table = Vec::with_capacity(len);\n  450 | \n  451 |                     self.offset_table_next = false;\n  452 | \n  453 |                     // need to pop item delimiter on the next iteration\n  454 |                     self.delimiter_check_pending = true;\n  455 | \n  456 |                     Some(\n  457 |                         match self.parser.read_u32_to_vec(len as u32, &mut offset_table) {\n  458 |                             Ok(()) => Ok(DataToken::OffsetTable(offset_table)),\n  459 |                             Err(e) => Err(e).context(ReadItemValueSnafu { len: len as u32 }),\n  460 |                         },\n  461 |                     )","lines":15,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/dataset/read.rs#L447-L461"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`UserIdentity::primary_field()` and `secondary_field()` return `Vec<u8>` by cloning the whole field, and `identity_type()` clones the enum. In the write path `write_pdu_variable_user_variables` calls `user_identity.primary_field().as_slice()` and `secondary_field().as_slice()`, allocating and copying each field only to take a slice and immediat (function(){

// Data
