<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `DataElementVisitor::visit_map`, the conflict guards for the `\"InlineBinary\"` and `\"BulkDataURI\"` keys check `values.is_some()` (lines 173 and 189), but `values` is declared at line 143 and is *never* assigned inside the `while` loop - it is only assigned after the loop during VR-based value processing. The field that actually holds a parsed `\"Value\"` entry is `value` (line 145). Because the guards read the always-`None` `values`, a JSON object that contains both `\"Value\"` and `\"InlineBinary\"` (in that key order) is not rejected: after the loop both `value` and `inline_binary` are `Some`, the VR branch sets `values = Some(..)`, and the final `match (values, inline_binary)` at line 354 hits the `_ => unreachable!()` arm at line 365, panicking. This is reachable from the public deserialization API (`from_str`/`from_slice`/`from_reader`/`from_value`) on attacker-controlled DICOM JSON (e.g. DICOMweb payloads), so a crafted payload like `{\"00080008\":{\"vr\":\"OB\",\"Value\":[1,2],\"InlineBinary\":\"AA==\"}}` crashes the process (DoS). The same wrong-variable bug also silently fails to detect the `\"Value\"`+`\"BulkDataURI\"` conflict.","fix":"Check `value` (the `Option<serde_json::Value>`), not the unrelated `values`, in both arms. In the `\"InlineBinary\"` arm change `if values.is_some() {` to `if value.is_some() {`, and likewise in the `\"BulkDataURI\"` arm change `if values.is_some() {` to `if value.is_some() {`. With those guards fixed, the final `(Some, Some)` case in `match (values, inline_binary)` genuinely becomes unreachable.","locations":[{"ref":"json/src/de/mod.rs:172-201","code":"  172 |                 \"InlineBinary\" => {\n  173 |                     if values.is_some() {\n  174 |                         return Err(A::Error::custom(\n  175 |                             \"\\\"InlineBinary\\\" conflicts with \\\"Value\\\"\",\n  176 |                         ));\n  177 |                     }\n  178 | \n  179 |                     if bulk_data_uri.is_some() {\n  180 |                         return Err(A::Error::custom(\n  181 |                             \"\\\"InlineBinary\\\" conflicts with \\\"BulkDataURI\\\"\",\n  182 |                         ));\n  183 |                     }\n  184 |                     // read value as string\n  185 |                     let val: String = map.next_value()?;\n  186 |                     inline_binary = Some(val);\n  187 |                 }\n  188 |                 \"BulkDataURI\" => {\n  189 |                     if values.is_some() {\n  190 |                         return Err(A::Error::custom(\"\\\"BulkDataURI\\\" conflicts with \\\"Value\\\"\"));\n  191 |                     }\n  192 | \n  193 |                     if inline_binary.is_some() {\n  194 |                         return Err(A::Error::custom(\n  195 |                             \"\\\"BulkDataURI\\\" conflicts with \\\"InlineBinary\\\"\",\n  196 |                         ));\n  197 |                     }\n  198 | \n  199 |                     // read value as string\n  200 |                     let val: BulkDataUri = map.next_value()?;\n  201 |                     bulk_data_uri = Some(val);","lines":30,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/json/src/de/mod.rs#L172-L201"},{"ref":"json/src/de/mod.rs:143-145","code":"  143 |         let mut values: Option<_> = None;\n  144 |         let mut vr = None;\n  145 |         let mut value: Option<serde_json::Value> = None;","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/json/src/de/mod.rs#L143-L145"},{"ref":"json/src/de/mod.rs:354-366","code":"  354 |         let value = match (values, inline_binary) {\n  355 |             (None, None) => PrimitiveValue::Empty.into(),\n  356 |             (None, Some(inline_binary)) => {\n  357 |                 // decode from Base64\n  358 |                 use base64::Engine;\n  359 |                 let data = base64::engine::general_purpose::STANDARD\n  360 |                     .decode(inline_binary)\n  361 |                     .map_err(|_| A::Error::custom(\"inline binary data is not valid base64\"))?;\n  362 |                 PrimitiveValue::from(data).into()\n  363 |             }\n  364 |             (Some(values), None) => values,\n  365 |             _ => unreachable!(),\n  366 |         };","lines":13,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/json/src/de/mod.rs#L354-L366"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`Lut::new_with_fn` starts with `assert!(bits_stored != 0 && bits_stored <= 32);`. `bits_stored` originates directly from the DICOM _Bits Stored_ attribute (`attribute::bits_stored` -> `retrieve_required_u16`, no range validation), and is passed straight into the LUT constructors from `build_monochrome_image` / `convert_pixel_slice` (e.g. `Lut::new_rescale(self.bits_stored, ...)`). A malformed file with `BitsStored` = 0 or > 32 therefore aborts the process with a panic during a normal `to_vec`/`to_dynamic_image` call. This is a DoS reachable from adversarial input on a very common conversion path.","fix":"Validate `bits_stored` up front and return a proper error instead of asserting. Add a fallible check (e.g. a new `CreateLutError` variant or reuse the pixeldata error) so that `bits_stored == 0 || bits_stored > 32` yields `Err(...)` rather than `assert!` aborting. The callers already propagate `Result`, so surfacing an error is straightforward.","locations":[{"ref":"pixeldata/src/lut.rs:108-114","code":"  108 |     pub fn new_with_fn(\n  109 |         bits_stored: u16,\n  110 |         signed: bool,\n  111 |         f: impl Fn(f64) -> f64 + Sync,\n  112 |     ) -> Result<Self, CreateLutError> {\n  113 |         assert!(bits_stored != 0 && bits_stored <= 32);\n  114 |         let size = (1 << bits_stored as u32) as usize;","lines":7,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/lut.rs#L108-L114"},{"ref":"pixeldata/src/lib.rs:1229-1246","code":" 1229 |                                     Lut::new_rescale(self.bits_stored, signed, rescale)\n 1230 |                                 }\n 1231 |                                 (\n 1232 |                                     VoiLutOption::Default | VoiLutOption::First,\n 1233 |                                     _,\n 1234 |                                     Some(voi_lut_sequence),\n 1235 |                                 ) => Lut::new_rescale_and_lut(\n 1236 |                                     self.bits_stored,\n 1237 |                                     signed,\n 1238 |                                     rescale,\n 1239 |                                     VoiLutTransform::new(\n 1240 |                                         if voi_lut_sequence.len() > 1 {\n 1241 |                                             &voi_lut_sequence[frame as usize]\n 1242 |                                         } else {\n 1243 |                                             &voi_lut_sequence[0]\n 1244 |                                         },\n 1245 |                                         self.bits_stored,\n 1246 |                                     ),","lines":18,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/lib.rs#L1229-L1246"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `JpegAdapter::decode`/`decode_frame`, `dst` is pre-sized from the DICOM `Columns`/`Rows`/`SamplesPerPixel`/`BitsAllocated` header, but `decoded_len` comes from the actual embedded JPEG stream, whose real dimensions are attacker-controlled and independent of the header. If the JPEG decodes to more bytes than the header claims, `dst[dst_offset..(dst_offset + decoded_len)]` panics out-of-bounds and `copy_from_slice` panics on length mismatch. This is a panic in the primary pixel-decoding path from a malformed DICOM file.","fix":"Compare `decoded_len` against the remaining space (`dst.len() - dst_offset`) and return a decode error (or clamp) when the decoded frame is larger than expected, instead of slicing/`copy_from_slice` into a fixed-size buffer.","locations":[{"ref":"transfer-syntax-registry/src/adapters/jpeg.rs:76-78","code":"   76 |             let decoded_len = decoded.len();\n   77 |             dst[dst_offset..(dst_offset + decoded_len)].copy_from_slice(&decoded);\n   78 |             dst_offset += decoded_len;","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/transfer-syntax-registry/src/adapters/jpeg.rs#L76-L78"},{"ref":"transfer-syntax-registry/src/adapters/jpeg.rs:227-228","code":"  227 |         let decoded_len = decoded.len();\n  228 |         dst[dst_offset..(dst_offset + decoded_len)].copy_from_slice(&decoded);","lines":2,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/transfer-syntax-registry/src/adapters/jpeg.rs#L227-L228"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"Off-by-one in the component-count guard in `Jpeg2000Adapter::decode_frame`. The check `if component_i > samples_per_pixel as usize` allows `component_i == samples_per_pixel` to proceed (valid indices are `0..samples_per_pixel`). For that extra component the write offset `base_offset + i*samples_per_pixel*bytes_per_sample + component_i*bytes_per_sample` reaches exactly `base_offset + dst_size` on the last pixel, so `dst[offset..offset + bytes_per_sample]` panics out-of-bounds. A JPEG 2000 stream with more components than the DICOM `SamplesPerPixel` (e.g. spp=1, 2 components) triggers it. Separately, if any `component.data()` has more samples than `cols*rows`, the inner write loop also overruns `dst`.","fix":"Use `>=`:\n```rust\nif component_i >= samples_per_pixel as usize {\n```\nand additionally bound the inner loop / write offset against `dst.len()` before `copy_from_slice`.","locations":[{"ref":"transfer-syntax-registry/src/adapters/jpeg2k.rs:74-91","code":"   74 |         for (component_i, component) in components.iter().enumerate() {\n   75 |             if component_i > samples_per_pixel as usize {\n   76 |                 warn!(\n   77 |                     \"JPEG 2000 image has more components than expected ({} > {})\",\n   78 |                     component_i, samples_per_pixel\n   79 |                 );\n   80 |                 break;\n   81 |             }\n   82 | \n   83 |             // write in standard layout\n   84 |             for (i, sample) in component.data().iter().enumerate() {\n   85 |                 let offset = base_offset\n   86 |                     + i * samples_per_pixel as usize * bytes_per_sample as usize\n   87 |                     + component_i * bytes_per_sample as usize;\n   88 |                 dst[offset..offset + bytes_per_sample as usize]\n   89 |                     .copy_from_slice(&sample.to_le_bytes()[..bytes_per_sample as usize]);\n   90 |             }\n   91 |         }","lines":18,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/transfer-syntax-registry/src/adapters/jpeg2k.rs#L74-L91"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In the RLE decode loops, the segment offsets returned by `read_rle_header` are used to index and slice the fragment without validation. `&fragment[offsets[ii] as usize..offsets[ii + 1] as usize]` panics if `offsets[ii] > offsets[ii + 1]` (start > end) or if either exceeds `fragment.len()`; `offsets[ii]`/`offsets[ii + 1]` themselves panic when `nr_segments` is smaller than `samples_per_pixel * bytes_per_sample` (e.g. `nr_segments = 1` but 6 segments expected). Finally `dst[base_offset + dst_index] = decoded_segment[decoded_index]` panics when the PackBits stream decodes to fewer bytes than `rows*cols`, since `decoded_segment[decoded_index]` is unchecked. All are reachable from adversarial RLE Lossless pixel data.","fix":"Bound-check `ii + 1 < offsets.len()`, verify `offsets[ii] <= offsets[ii + 1] <= fragment.len()` (returning a decode error otherwise), and use `.get(decoded_index)` on `decoded_segment` (breaking or erroring when the decoded plane is short) instead of direct indexing.","locations":[{"ref":"transfer-syntax-registry/src/adapters/rle_lossless.rs:78-118","code":"   78 |             for sample_number in 0..samples_per_pixel {\n   79 |                 for byte_offset in (0..bytes_per_sample).rev() {\n   80 |                     // ii is 1, 0, 3, 2, 5, 4 for the example above\n   81 |                     // This is where the segment order correction occurs\n   82 |                     let ii = sample_number * bytes_per_sample + byte_offset;\n   83 |                     let segment = &fragment[offsets[ii] as usize..offsets[ii + 1] as usize];\n   84 |                     let buff = io::Cursor::new(segment);\n   85 |                     let (_, decoder) = PackBitsReader::new(buff, segment.len())\n   86 |                         .whatever_context(\"Failed to read RLE segments\")?;\n   87 |                     let mut decoded_segment = Vec::with_capacity(rows as usize * cols as usize);\n   88 |                     decoder\n   89 |                         .take(rows as u64 * cols as u64)\n   90 |                         .read_to_end(&mut decoded_segment)\n   91 |                         .unwrap();\n   92 | \n   93 |                     // Interleave pixels as described in the example above.\n   94 |                     // in 16-bit, this is:\n   95 |                     // MSB R channel: 1,  7, 13, ...\n   96 |                     // LSB R channel: 0,  6, 12, ecoder) = PackBitsReader::new(buff, segment.len())\n  196 |                     .map_err(|e| Box::new(e) as Box<_>)\n  197 |                     .whatever_context(\"Failed to read RLE segments\")?;\n  198 |                 let mut decoded_segment = Vec::with_capacity(rows as usize * cols as usize);\n  199 |                 decoder\n  200 |                     .take(rows as u64 * cols as u64)\n  201 |                     .read_to_end(&mut decoded_segment)\n  202 |                     .unwrap();\n  203 | \n  204 |                 // Interleave pixels as described in the example above.\n  205 |                 let start = if samples_per_pixel == 3 {\n  206 |                     sample_number * bytes_per_sample + byte_offset\n  207 |                 } else {\n  208 |                     sample_number * bytes_per_sample + samples_per_pixel - byte_offset\n  209 |                 };\n  210 | \n  211 |                 let end = frame_size;\n  212 |                 for (decoded_index, dst_index) in (start..end)\n  213 |                     .step_by(bytes_per_sample * samples_per_pixel)\n  214 |                     .enumerate()\n  215 |                 {\n  216 |                     dst[base_offset + dst_index] = decoded_segment[decoded_index];\n  217 |                 }\n  218 |             }\n  219 |         }","lines":32,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/transfer-syntax-registry/src/adapters/rle_lossless.rs#L188-L219"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`read_rle_header` parses attacker-controlled RLE pixel-data fragments with no bounds or sanity checks, giving several panics reachable from a malformed DICOM file. `LittleEndian::read_u32(&fragment[0..4])` panics if a fragment is shorter than 4 bytes. `nr_segments` is a raw `u32` taken from the file, so `vec![0; nr_segments as usize]` can attempt a multi-gigabyte allocation, and `4 * (nr_segments + 1) as usize` overflows (`nr_segments + 1` wraps on `u32::MAX`, panicking in debug) while the slice `&fragment[4..4 * (nr_segments + 1)]` panics out-of-bounds whenever the fragment is shorter than the header claims. `read_u32_into` additionally panics if the slice length is not a multiple of 4.","fix":"Validate the fragment length before indexing: ensure `fragment.len() >= 4`, read `nr_segments`, cap it to the DICOM RLE limit (15 segments), and ensure `fragment.len() >= 4 * (nr_segments as usize + 1)` before the `read_u32_into` call. Return a `DecodeResult` error instead of slicing/allocating blindly, e.g. `ensure!(fragment.len() >= 4, decode_error::...)` and `let header_len = 4usize.checked_mul(nr_segments as usize + 1).context(...)?;`.","locations":[{"ref":"transfer-syntax-registry/src/adapters/rle_lossless.rs:227-232","code":"  227 | fn read_rle_header(fragment: &[u8]) -> Vec<u32> {\n  228 |     let nr_segments = LittleEndian::read_u32(&fragment[0..4]);\n  229 |     let mut offsets = vec![0; nr_segments as usize];\n  230 |     LittleEndian::read_u32_into(&fragment[4..4 * (nr_segments + 1) as usize], &mut offsets);\n  231 |     offsets\n  232 | }","lines":6,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/transfer-syntax-registry/src/adapters/rle_lossless.rs#L227-L232"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"The P-Data writers compute `total_len = (self.max_pdu_length + PDU_HEADER_SIZE) as usize` and then slice `&buf[..total_len - self.buffer.len()]`. The buffer is pre-seeded with `PDU_PDV_HEADER_SIZE` (12) bytes, so on the first write `self.buffer.len()` is 12. If the negotiated peer maximum PDU length is smaller than the PDU header (i.e. `max_pdu_length < 6`, giving `total_len < 12`), the subtraction `total_len - self.buffer.len()` underflows `usize`, causing a panic (debug) or a huge index and an out-of-bounds slice panic (release). This `max_pdu_length` is the value advertised by the *peer* in the A-ASSOCIATE `MaxLength` user variable, which is fully attacker-controlled. During negotiation the value is only clamped from above (`.min(MAXIMUM_PDU_SIZE)`, with `0` mapped to `MAXIMUM`) and never floored to `MINIMUM_PDU_SIZE`, so a malicious/broken peer advertising e.g. `MaxLength = 1` will crash the local node as soon as it sends any P-Data. Both the sync writer (`PDataWriter::write`) and the async writer (`AsyncPDataWriter::poll_write`) are affected.","fix":"Enforce a lower bound on the negotiated peer max PDU length so it can never be below the header size (ideally `MINIMUM_PDU_SIZE`). For example in `PDataWriter::new`/`AsyncPDataWriter::new` clamp `max_pdu_length = max_pdu_length.max(MINIMUM_PDU_SIZE)`, or during negotiation replace `len.min(MAXIMUM_PDU_SIZE)` with `len.clamp(MINIMUM_PDU_SIZE, MAXIMUM_PDU_SIZE)`. Alternatively guard the slice with `total_len.saturating_sub(self.buffer.len())`.","locations":[{"ref":"ul/src/association/pdata.rs:174-189","code":"  174 |     fn write(&mut self, buf: &[u8]) -> std::io::Result<usize> {\n  175 |         let total_len = (self.max_pdu_length + PDU_HEADER_SIZE) as usize;\n  176 |         if self.buffer.len() + buf.len() <= total_len {\n  177 |             // accumulate into buffer, do nothing\n  178 |             self.buffer.extend(buf);\n  179 |             Ok(buf.len())\n  180 |         } else {\n  181 |             // fill in the rest of the buffer, send PDU,\n  182 |             // and leave out the rest for subsequent writes\n  183 |             let buf = &buf[..total_len - self.buffer.len()];\n  184 |             self.buffer.extend(buf);\n  185 |             debug_assert_eq!(self.buffer.len(), total_len);\n  186 |             self.dispatch_pdu()?;\n  187 |             Ok(buf.len())\n  188 |         }\n  189 |     }","lines":16,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/association/pdata.rs#L174-L189"},{"ref":"ul/src/association/pdata.rs:527-538","code":"  527 |                     let total_len = (self.max_pdu_length + PDU_HEADER_SIZE) as usize;\n  528 |                     if self.buffer.len() + buf.len() <= total_len {\n  529 |                         // Still have space in `self.buffer`, accumulate into buffer\n  530 |                         self.buffer.extend(buf);\n  531 |                         Poll::Ready(Ok(buf.len()))\n  532 |                     } else {\n  533 |                         // `self.buffer` is full, fill in the rest of the\n  534 |                         // buffer, prepare to send PDU\n  535 |                         let slice = &buf[..total_len - self.buffer.len()];\n  536 |                         self.buffer.extend(slice);\n  537 |                         let consumed = slice.len();\n  538 |                         debug_assert_eq!(self.buffer.len(), total_len);","lines":12,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/association/pdata.rs#L527-L538"},{"ref":"ul/src/association/client.rs:866-871","code":"  866 |                 let acceptor_max_pdu_length = if acceptor_max_pdu_length == 0 {\n  867 |                     // treat 0 as the largest we support\n  868 |                     MAXIMUM_PDU_SIZE\n  869 |                 } else {\n  870 |                     acceptor_max_pdu_length.min(MAXIMUM_PDU_SIZE)\n  871 |                 };","lines":6,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/association/client.rs#L866-L871"},{"ref":"ul/src/association/server.rs:851-860","code":"  851 |                         MaxLength(len) => {\n  852 |                             requestor_max_pdu_length = if len == 0 {\n  853 |                                 // treat 0 as the largest we support\n  854 |                                 MAXIMUM_PDU_SIZE\n  855 |                             } else {\n  856 |                                 // Don't accept more than MAXIMUM_PDU_SIZE\n  857 |                                 // as max_pdu_length.\n  858 |                                 len.min(MAXIMUM_PDU_SIZE)\n  859 |                             };\n  860 |                         }","lines":10,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/association/server.rs#L851-L860"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Fragments::new` panics when called with empty `data` and the default `fragment_size` of `0`. With `data.len() == 0` and `fragment_size == 0`, the branch `if fragment_size == 0 { data.len() as u32 }` keeps `fragment_size == 0`, then `number_of_fragments = (0.0/0.0).ceil() as u32` evaluates `NaN as u32 == 0`, `encapsulated_size == 0`, and finally `data.chunks_exact(fragment_size as usize)` is called with a chunk size of `0`, which panics (`chunk size must be non-zero`). An empty pixel-data frame therefore aborts the process.","fix":"Return early (empty `Fragments`) when `data` is empty, or clamp `fragment_size` to at least 1 before calling `chunks_exact`. For example, after computing `fragment_size`, add `if data.is_empty() { return Fragments { fragments: Vec::new() }; }`, and ensure `fragment_size` is never `0`.","locations":[{"ref":"core/src/value/fragments.rs:43-72","code":"   43 |     pub fn new(data: Vec<u8>, fragment_size: u32) -> Self {\n   44 |         let fragment_size: u32 = if fragment_size == 0 {\n   45 |             data.len() as u32\n   46 |         } else {\n   47 |             fragment_size\n   48 |         };\n   49 | \n   50 |         let fragment_size = if fragment_size % 2 == 0 {\n   51 |             fragment_size\n   52 |         } else {\n   53 |             fragment_size + 1\n   54 |         };\n   55 | \n   56 |         let number_of_fragments = (data.len() as f32 / fragment_size as f32).ceil() as u32;\n   57 | \n   58 |         // Calculate the encapsulated size. If necessary pad the vector with zeroes so all the\n   59 |         // chunks have the same fragment_size\n   60 |         let mut data = data;\n   61 |         let encapsulated_size = (fragment_size * number_of_fragments) as usize;\n   62 |         if encapsulated_size > data.len() {\n   63 |             data.resize(encapsulated_size, 0);\n   64 |         }\n   65 | \n   66 |         let fragments = data\n   67 |             .chunks_exact(fragment_size as usize)\n   68 |             .map(|fragment| fragment.to_vec())\n   69 |             .collect::<Vec<InMemFragment>>();\n   70 | \n   71 |         Fragments { fragments }\n   72 |     }","lines":30,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/fragments.rs#L43-L72"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Value::to_tag` indexes `v[0]` on the inner `C<Tag>` (a `SmallVec`) without checking that it is non-empty. A DICOM `AT` element decoded with zero values yields `PrimitiveValue::Tags(smallvec![])`, so calling `to_tag()` on it panics with an out-of-bounds slice index. Since `to_tag` is public API operating on values that come straight from parsed (potentially adversarial) DICOM data, this is a reachable panic.","fix":"Guard against the empty case and return a `CastValueError` instead of indexing. For example:\n```rust\nValue::Primitive(PrimitiveValue::Tags(v)) => v.first().copied().ok_or(CastValueError {\n    requested: \"tag\",\n    got: self.value_type(),\n}),\n```","locations":[{"ref":"core/src/value/mod.rs:746-755","code":"  746 |     /// Retrieves the primitive value as a DICOM tag.\n  747 |     pub fn to_tag(&self) -> Result<Tag, CastValueError> {\n  748 |         match self {\n  749 |             Value::Primitive(PrimitiveValue::Tags(v)) => Ok(v[0]),\n  750 |             _ => Err(CastValueError {\n  751 |                 requested: \"tag\",\n  752 |                 got: self.value_type(),\n  753 |             }),\n  754 |         }\n  755 |     }","lines":10,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/mod.rs#L746-L755"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"hard","description":"The collector builds the object tree by mutual recursion: `collect_to_object` -> `collect_elements` -> (on `DataToken::SequenceStart`) `collect_sequence` -> `collect_to_object` again, with no depth limit. A malformed/adversarial DICOM stream containing deeply nested sequences (`SQ` within `SQ` ...) drives unbounded recursion, one set of stack frames per nesting level, leading to stack overflow and process abort. Because the collector API is explicitly aimed at reading untrusted/large files in chunks, this is a reachable denial-of-service on crafted input.","fix":"Thread a recursion-depth counter through `collect_to_object`/`collect_elements`/`collect_sequence` and return a `PrematureEnd`/dedicated error once a configurable maximum nesting depth is exceeded, or rewrite the traversal iteratively with an explicit stack.","locations":[{"ref":"object/src/collector.rs:1163-1192","code":" 1163 |                 DataToken::SequenceStart { tag, len } => {\n 1164 |                     // stop reading if reached `read_until` tag (exclusive)\n 1165 |                     if read_until.map(|t| t <= tag).unwrap_or(false) {\n 1166 |                         break;\n 1167 |                     }\n 1168 |                     // stop reading if exceeded `read_to` tag (inclusive)\n 1169 |                     if read_to.map(|t| t < tag).unwrap_or(false) {\n 1170 |                         break;\n 1171 |                     }\n 1172 |                     *state = CollectorState::InDataset;\n 1173 | \n 1174 |                     token_src.advance();\n 1175 | \n 1176 |                     // delegate sequence building to another function\n 1177 |                     let mut items = C::new();\n 1178 |                     Self::collect_sequence(\n 1179 |                         &mut *state,\n 1180 |                         tag,\n 1181 |                         len,\n 1182 |                         &mut *token_src,\n 1183 |                         dict,\n 1184 |                         &mut items,\n 1185 |                     )?;\n 1186 |                     DataElement::new_with_len(\n 1187 |                         tag,\n 1188 |                         VR::SQ,\n 1189 |                         len,\n 1190 |                         DicomValue::new_sequence(items, len),\n 1191 |                     )\n 1192 |                 }","lines":30,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/object/src/collector.rs#L1163-L1192"},{"ref":"object/src/collector.rs:1277-1301","code":" 1277 |     fn collect_sequence(\n 1278 |         state: &mut CollectorState,\n 1279 |         _tag: Tag,\n 1280 |         _len: Length,\n 1281 |         token_src: &mut LazyDataSetReader<DynStatefulDecoder<BufReader<S>>>,\n 1282 |         dict: &D,\n 1283 |         items: &mut C<InMemDicomObject<D>>,\n 1284 |     ) -> Result<()> {\n 1285 |         while let Some(token) = token_src.advance() {\n 1286 |             match token.context(ReadTokenSnafu)? {\n 1287 |                 LazyDataToken::ItemStart { len: _ } => {\n 1288 |                     let mut obj = InMemDicomObject::new_empty_with_dict(dict.clone());\n 1289 |                     Self::collect_to_object(state, token_src, true, None, None, &mut obj, dict)?;\n 1290 |                     items.push(obj);\n 1291 |                 }\n 1292 |                 LazyDataToken::SequenceEnd => {\n 1293 |                     return Ok(());\n 1294 |                 }\n 1295 |                 token => return UnexpectedTokenSnafu { token }.fail().map_err(From::from),\n 1296 |             };\n 1297 |         }\n 1298 | \n 1299 |         // iterator fully consumed without a sequence delimiter\n 1300 |         Prematu gth (e.g. `0xFFFFFFF0`, which is not the undefined sentinel `0xFFFFFFFF` so it is treated as a normal element) causes an immediate multi-gigabyte allocation before any bytes are read, leading to OOM/abort. The same unbounded pre-allocation pattern appears in the string/numeric readers (`self.buffer.resize_with(len, ..)`, `smallvec![0; n]`) and in `read.rs` (`Vec::with_capacity(len)` for item values at line 464).","fix":"Cap the initial allocation to a sane maximum and grow incrementally while reading (e.g. reserve `len.min(REASONABLE_CHUNK)` and read in a loop / via `Read::take` + `read_to_end`), or validate the declared length against the remaining bytes of the source when it is a bounded reader. This avoids trusting the header length for the up-front allocation size.","locations":[{"ref":"parser/src/stateful/decode.rs:454-466","code":"  454 |     fn read_value_ob(&mut self, header: &DataElementHeader) -> Result<PrimitiveValue> {\n  455 |         // Note: this function always expects a defined length OB value\n  456 |         // (pixel sequence detection needs to be done by the caller)\n  457 |         let len = self.require_known_length(header)?;\n  458 | \n  459 |         // sequence of 8-bit integers (or arbitrary byte data)\n  460 |         let mut buf = smallvec![0u8; len];\n  461 |         self.from.read_exact(&mut buf).context(ReadValueDataSnafu {\n  462 |             position: self.position,\n  463 |         })?;\n  464 |         self.position += len as u64;\n  465 |         Ok(PrimitiveValue::U8(buf))\n  466 |     }","lines":13,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/stateful/decode.rs#L454-L466"},{"ref":"parser/src/dataset/read.rs:462-475","code":"  462 |                 } else {\n  463 |                     // item value\n  464 |                     let mut value = Vec::with_capacity(len);\n  465 | \n  466 |                     // need to pop item delimiter on the next iteration\n  467 | hunk size. `BitsAllocated` is taken from the file without validation in the GDCM path, so this is reachable from a crafted encapsulated-uncompressed or native object.","fix":"Guard against `frame_size == 0` (return an error such as `InvalidBitsAllocated`/`UnsupportedOther`) before calling `chunks_exact`, or validate `bits_allocated` is one of 8/16 early in the GDCM decode functions as the non-GDCM path does.","locations":[{"ref":"pixeldata/src/gdcm.rs:259-263","code":"  259 |                         let frame_size = cols * rows * samples_per_pixel * (bits_allocated / 8);\n  260 |                         data.chunks_exact(frame_size as usize)\n  261 |                             .nth(frame)\n  262 |                             .map(|frame| frame.to_vec())\n  263 |                             .unwrap_or_default()","lines":5,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/gdcm.rs#L259-L263"},{"ref":"pixeldata/src/gdcm.rs:288-296","code":"  288 |                 let frame_size = cols as usize\n  289 |                     * rows as usize\n  290 |                     * samples_per_pixel as usize\n  291 |                     * (bits_allocated as usize / 8);\n  292 |                 p.to_bytes()\n  293 |                     .chunks_exact(frame_size)\n  294 |                     .nth(frame as usize)\n  295 |                     .map(|frame| frame.to_vec())\n  296 |                     .unwrap_or_default()","lines":9,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/gdcm.rs#L288-L296"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The default trait implementation `PixelDecoder::decode_pixel_data_frame` crops to a frame using unchecked slicing: `data[frame_offset..frame_offset + frame_size]` for both the `Cow::Owned` and `Cow::Borrowed` arms. If `frame` is out of range (or `frame_size`/attributes are inconsistent with the actual data length), these slices panic. Any implementor relying on the default method (rather than the overrides in this crate) is exposed.","fix":"Bounds-check before slicing, e.g. compute `frame_end` and return a `FrameOutOfRange` error when `frame_end > data.len()`, or use `data.get(frame_offset..frame_end)` and map `None` to an error.","locations":[{"ref":"pixeldata/src/lib.rs:2100-2116","code":" 2100 |     fn decode_pixel_data_frame(&self, frame: u32) -> Result<DecodedPixelData<'_>> {\n 2101 |         let mut px = self.decode_pixel_data()?;\n 2102 | \n 2103 |         // calculate frame offset and size\n 2104 |         let frame_size = px.bits_allocated.div_ceil(8) as usize\n 2105 |             * px.samples_per_pixel as usize\n 2106 |             * px.rows as usize\n 2107 |             * px.cols as usize;\n 2108 |         let frame_offset = frame_size * frame as usize;\n 2109 | \n 2110 |         // crop to frame\n 2111 |         match &mut px.data {\n 2112 |             Cow::Owned(data) => *data = data[frame_offset..frame_offset + frame_size].to_vec(),\n 2113 |             Cow::Borrowed(data) => {\n 2114 |                 *data = &data[frame_offset..frame_offset + frame_size];\n 2115 |             }\n 2116 |         }","lines":17,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/lib.rs#L2100-L2116"}]},{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In the non-GDCM `decode_pixel_data_frame`, after checking `number_of_frames as usize == fragments.len()`, the code does `fragments[frame as usize].to_vec()`. The caller-provided `frame` is never checked against `fragments.len()`, so requesting a frame index >= the number of fragments panics with an out-of-bounds slice access.","fix":"Replace `fragments[frame as usize]` with `fragments.get(frame as usize).context(FrameOutOfRangeSnafu { frame_number: frame })?` before calling `.to_vec()`.","locations":[{"ref":"pixeldata/src/lib.rs:2465-2472","code":" 2465 |             DicomValue::PixelSequence(v) => {\n 2466 |                 let fragments = v.fragments();\n 2467 |                 if number_of_frames as usize == fragments.len() {\n 2468 |                     // return a single fragment\n 2469 |                     fragments[frame as usize].to_vec()\n 2470 |                 } else {\n 2471 |                     // not supported, return an error\n 2472 |                     InvalidPixelDataSnafu.fail()?","lines":8,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/lib.rs#L2465-L2472"}]},{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `send_file`, the C-STORE response PDU is handled with `let data_value = &data[0];`. If the peer SCP sends a `Pdu::PData` with an empty `data` vector, this indexing panics. The response comes from a remote peer, so a misbehaving or malicious SCP can crash the SCU.","fix":"Use `data.first()` and handle the empty case, e.g. `let Some(data_value) = data.first() else { error!(\"Empty PData response\"); ... };`.","locations":[{"ref":"storescu/src/store_async.rs:124-126","code":"  124 |             Pdu::PData { data } => {\n  125 |                 let data_value = &data[0];\n  126 | ","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/storescu/src/store_async.rs#L124-L126"},{"ref":"storescu/src/store_sync.rs:125-126","code":"  125 |             Pdu::PData { data } => {\n  126 |                 let data_value = &data[0];","lines":2,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/storescu/src/store_sync.rs#L125-L126"}]},{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`narrow_8bit` iterates `frame_data.chunks(2)` and reads `chunk[1]` unconditionally. This is safe only when `frame_data.len()` is even. On the encode path `frame_size = cols*rows*samples_per_pixel*bytes_per_sample`; if a (malformed) source has `BitsAllocated == 8` (so `bytes_per_sample == 1`) but `BitsStored` in `9..=16`, `narrow_8bit` is still entered with an odd-length `frame_data` (e.g. 1x1x1), and the final one-element chunk makes `chunk[1]` panic.","fix":"Guard the `9..=16` arm on `bytes_per_sample == 2` / even length, or handle the trailing odd byte, e.g. iterate with `chunks_exact(2)` and error on a non-empty remainder.","locations":[{"ref":"transfer-syntax-registry/src/adapters/jpeg.rs:364-378","code":"  364 | fn narrow_8bit(frame_data: &[u8], bits_stored: u16) -> EncodeResult<Cow<'_, [u8]>> {\n  365 |     debug_assert!(bits_stored >= 8);\n  366 |     match bits_stored {\n  367 |         8 => Ok(Cow::Borrowed(frame_data)),\n  368 |         9..=16 => {\n  369 |             let mut v = Vec::with_capacity(frame_data.len() / 2);\n  370 |             for chunk in frame_data.chunks(2) {\n  371 |                 let b = u16::from(chunk[0]) | (u16::from(chunk[1]) << 8);\n  372 |                 v.push((b >> (bits_stored - 8)) as u8);\n  373 |             }\n  374 |             Ok(Cow::Owned(v))\n  375 |         }\n  376 |         b => whatever!(\"Unsupported Bits Stored {}\", b),\n  377 |     }\n  378 | }","lines":15,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/transfer-syntax-registry/src/adapters/jpeg.rs#L364-L378"}]},{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`AsyncPDataWriter`'s `Drop` impl calls `tokio::task::block_in_place(...)` and `tokio::runtime::Handle::current().block_on(...)`. `block_in_place` panics when the current runtime is a current-thread (single-threaded) runtime, and `Handle::current()` panics when there is no runtime in scope. Because the writer flushes its final PDU on drop, dropping an `AsyncPDataWriter` without calling `finish()` (e.g. during error unwinding, or simply on a `#[tokio::main(flavor = \"current_thread\")]` runtime) will panic; a panic during unwinding aborts the process.","fix":"Avoid blocking in `Drop`. Either document that `finish().await` must be called explicitly and make `Drop` a no-op (or only warn), or use `Handle::try_current()` and skip flushing if unavailable / not multi-threaded, so drop can never panic.","locations":[{"ref":"ul/src/association/pdata.rs:646-657","code":"  646 |     impl<W> Drop for AsyncPDataWriter<W>\n  647 |     where\n  648 |         W: AsyncWrite + Unpin,\n  649 |     {\n  650 |         fn drop(&mut self) {\n  651 |             tokio::task::block_in_place(move || {\n  652 |                 tokio::runtime::Handle::current().block_on(async move {\n  653 |                     let _ = self.finish_impl().await;\n  654 |                 })\n  655 |             })\n  656 |         }\n  657 |     }","lines":12,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/association/pdata.rs#L646-L657"}]},{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"The `From<Vec<Fragments>> for PixelFragmentSequence` conversion uses `panic!` to reject a multi-frame sequence where a frame has more than one fragment. This turns a caller data-shape mistake into a hard process abort inside an infallible `From` conversion, which is poor API design for a library; a `TryFrom`/validating constructor returning an error would be safer.","fix":"Either document this as a strict precondition and expose a fallible constructor (`TryFrom`) that returns an error instead of panicking, or handle the case gracefully (e.g. flatten fragments) rather than calling `panic!`.","locations":[{"ref":"core/src/value/fragments.rs:107-110","code":"  107 |         for (index, mut frame) in value.into_iter().enumerate() {\n  108 |             if frame.is_multiframe() && is_multiframe {\n  109 |                 panic!(\"More than 1 fragment per frame is invalid for multi frame pixel data\");\n  110 |             }","lines":4,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/fragments.rs#L107-L110"}]},{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`calculate_byte_len` (reached via `HasLength::length()`) calls `da_byte_len`/`tm_byte_len`/`dt_byte_len`, which `panic!` on precision values they consider \"impossible\": `da_byte_len` panics on any `DateComponent` other than Year/Month/Day, `tm_byte_len` panics on any non Hour/Minute/Second/Fraction and also panics if a `Fraction`-precision `DicomTime` yields `None` from `fraction_and_precision()`. These invariants currently hold because `DicomDate`/`DicomTime` can only be constructed with matching precision, so the panics are effectively unreachable from parsed input today. They are nonetheless landmines: any future `DicomDate`/`DicomTime` construction path (or refactor of `precision()`/`fraction_and_precision()`) that breaks the invariant turns a length query into a crash.","fix":"Return a safe fallback length (e.g. `0` or the largest reasonable size) instead of `panic!` in the `_ =>` and `None =>` arms, or change these helpers to return `Option<usize>`/`Result` and have `calculate_byte_len` treat the impossible case as zero. At minimum, document the invariant with `debug_assert!` rather than an unconditional panic in a non-`unsafe`, input-facing code path.","locations":[{"ref":"core/src/value/primitive.rs:490-522","code":"  490 |     fn da_byte_len(date: &DicomDate) -> usize {\n  491 |         match date.precision() {\n  492 |             DateComponent::Year => 4,\n  493 |             DateComponent::Month => 6,\n  494 |             DateComponent::Day => 8,\n  495 |             _ => panic!(\"Impossible precision for a DicomDate\"),\n  496 |         }\n  497 |     }\n  498 | \n  499 |     fn tm_byte_len(time: &DicomTime) -> usize {\n  500 |         match time.precision() {\n  501 |             DateComponent::Hour => 2,\n  502 |             DateComponent::Minute => 4,\n  503 |             DateComponent::Second => 6,\n  504 |             DateComponent::Fraction => match time.fraction_and_precision() {\n  505 |                 None => panic!(\"DicomTime has fraction precision but no fraction can be retrieved\"),\n  506 |                 Some((_, fp)) => 7 + fp as usize, // 1 is for the '.'\n  507 |             },\n  508 |             _ => panic!(\"Impossible precision for a Dicomtime\"),\n  509 |         }\n  510 |     }\n  511 | \n  512 |     fn dt_byte_len(datetime: &DicomDateTime) -> usize {\n  513 |         PrimitiveValue::da_byte_len(datetime.date())\n  514 |             + match datetime.time() {\n  515 |                 Some(time) => PrimitiveValue::tm_byte_len(time),\n  516 |                 None => 0,\n  517 |             }\n  518 |             + match datetime.has_time_zone() {\n  519 |                 true => 5,\n  520 |                 false => 0,\n  521 |             }\n  522 |     }","lines":33,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/primitive.rs#L490-L522"}]},{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`parse_entries` splits each non-comment line on tabs and immediately accesses `parts[4]` (and later `parts[1]`, `parts[2]`, `parts[3]`) without checking `parts.len()`. Any non-comment, non-empty line in the input `.dic` that does not contain at least 5 tab-separated fields (e.g. a stray blank/whitespace line or a truncated download) causes an index-out-of-bounds panic. This is a devtool, so impact is limited, but it aborts the build tool on mildly malformed input rather than reporting an error.","fix":"Validate the field count first, e.g. `if parts.len() < 5 { continue; }` (or return an `eyre` error) before indexing `parts`.","locations":[{"ref":"devtools/dictionary-builder/src/tags.rs:98-100","code":"   98 |         let parts: Vec<&str> = line.split('\\t').collect();\n   99 | \n  100 |         if parts[4] == \"ILLEGAL\" || parts[4] == \"PRIVATE\" || parts[4] == \"GENERIC\" {","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/devtools/dictionary-builder/src/tags.rs#L98-L100"}]},{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"After receiving a response PDU, `let data_value = &data[0];` indexes the `Vec<PDataValue>` without checking it is non-empty. A conforming-looking but empty `Pdu::PData { data: vec![] }` from the peer SCP (a P-DATA-TF PDU carrying zero PDVs) makes the SCU panic with an index-out-of-bounds instead of returning the `Whatever` error the rest of the function uses. This is reachable from a malicious or buggy remote peer.","fix":"Guard the access, e.g. `let data_value = data.first().whatever_context(\"Empty P-DATA response from SCP\")?;` and derive `v` from it.","locations":[{"ref":"echoscu/src/main.rs:115-117","code":"  115 |         Pdu::PData { data } => {\n  116 |             let data_value = &data[0];\n  117 |             let v = &data_value.data;","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/echoscu/src/main.rs#L115-L117"}]},{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`VR::SQ => unreachable!(\"unexpected VR SQ in primitive value\")` in the element serializer will panic if an element is constructed in memory with `VR::SQ` but a non-empty `PrimitiveValue` (the empty case is handled earlier at line 224). Not reachable from a parsed file (the parser yields a `Sequence` value for SQ), but reachable from the public in-memory building API, turning a `Serialize` call into a panic.","fix":"Replace `unreachable!` with a graceful serializer error (`S::Error::custom(...)`) or serialize the value as an empty `Value` array, so malformed-in-memory objects cannot crash serialization.","locations":[{"ref":"json/src/ser/mod.rs:265","code":"  265 |                 VR::SQ => unreachable!(\"unexpected VR SQ in primitive value\"),","lines":1,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/json/src/ser/mod.rs#L265"}]},{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`AsNumbers::serialize` hard-`panic!`s for `PrimitiveValue::Date`, `DateTime`, `Time`, and `Tags`. This wrapper is selected in `mod.rs` only for numeric VRs (FD/IS/FL/DS/SL/SS/SV/UL/US/UV), so it is not reachable when serializing an object produced by the parser (those VRs never yield date/time/tags primitives). However, a user-constructed `InMemElement` with, e.g., `VR::US` and a `PrimitiveValue::Date` will panic during JSON serialization rather than returning a serialization error, which is inappropriate for a `Serialize` impl.","fix":"Return a serializer error instead of panicking, e.g. `return Err(S::Error::custom(\"cannot encode Date/DateTime/Time/Tags as numbers\"))`, consistent with `AsAttributeTags` which uses `S::Error::custom` for the analogous mismatch.","locations":[{"ref":"json/src/ser/value.rs:64-67","code":"   64 |             PrimitiveValue::Date(_) => panic!(\"wrong impl: cannot encode Date as numbers\"),\n   65 |             PrimitiveValue::DateTime(_) => panic!(\"wrong impl: cannot encode DateTime as numbers\"),\n   66 |             PrimitiveValue::Time(_) => panic!(\"wrong impl: cannot encode Time as numbers\"),\n   67 |             PrimitiveValue::Tags(_) => panic!(\"wrong impl: cannot encode Tags as numbers\"),","lines":4,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/json/src/ser/value.rs#L64-L67"}]},{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the C-STORE handler, `TransferSyntaxRegistry.get(ts).unwrap()` is called on the transfer syntax string taken from a negotiated presentation context received over the network. While the accepted TS should normally be one the server offered (and thus present in the registry), relying on `.unwrap()` for a value derived from peer input means any registry-lookup miss (e.g., unexpected formatting/padding) aborts the whole SCP process instead of failing the association gracefully.","fix":"Replace `.unwrap()` with `.whatever_context(\"unsupported/unknown negotiated transfer syntax\")?` (or a proper error) so a bad transfer syntax terminates the request cleanly rather than panicking.","locations":[{"ref":"movescu/src/store_async.rs:254-258","code":"  254 |                                 let obj = InMemDicomObject::read_dataset_with_ts(\n  255 |                                     instance_buffer.as_slice(),\n  256 |                                     TransferSyntaxRegistry.get(ts).unwrap(),\n  257 |                                 )\n  258 |                                 .whatever_context(\"failed to read DICOM data object\")?;","lines":5,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/movescu/src/store_async.rs#L254-L258"}]},{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the `IntoTokens` state machine for `DataElement`, two `unreachable!()` arms can be reached with a deliberately inconsistent (malformed) in-memory `DataElement` whose VR does not match its value kind. At line 644, the `PixelSequenceStart` branch does `match elem.into_value() { .. Value::Primitive(_) | Value::Sequence { .. } => unreachable!() }`; an element with tag `(7FE0,0010)`, `VR::OB`, undefined length, but a `Value::Primitive` payload maps (via `DataToken::from`) to `PixelSequenceStart` and then panics. At line 656 the `Header` branch panics on `Value::Sequence`/`Value::PixelSequence` for a non-SQ element (e.g. `VR::UN` carrying a `Value::Sequence`). This is not reachable from the file/PDU parser (which never builds such elements), but it is a latent panic for any code that serializes hand-built objects; the existing `bad_element_to_tokens` test does not cover these two combinations.","fix":"Replace the `unreachable!()` arms with graceful handling that mirrors the existing SQ-mismatch handling (emit a `tracing::warn!` and either fall back to an `ElementHeader`+`PrimitiveValue` token pair or end the token stream), so a mismatched VR/value never panics.","locations":[{"ref":"parser/src/dataset/mod.rs:630-645","code":"  630 |                     DataToken::PixelSequenceStart => {\n  631 |                         match elem.into_value() {\n  632 |                             Value::PixelSequence(seq) => {\n  633 |                                 let (offset_table, fragments) = seq.into_parts();\n  634 |                                 (\n  635 |                                     // begin pixel sequence\n  636 |                                     Some(DataToken::PixelSequenceStart),\n  637 |                                     DataElementTokens::PixelData(\n  638 |                                         Some(fragments),\n  639 |                                         OffsetTableItem(offset_table)\n  640 |                                             .into_tokens_with_options(*options),\n  641 |                                     ),\n  642 |                                 )\n  643 |                             }\n  644 |                             Value::Primitive(_) | Value::Sequence { .. } => unreachable!(),\n  645 |                         }","lines":16,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/dataset/mod.rs#L630-L645"},{"ref":"parser/src/dataset/mod.rs:653-662","code":"  653 |             DataElementTokens::Header(elem) => {\n  654 |                 let elem = elem.take().unwrap();\n  655 |                 match elem.into_value() {\n  656 |                     Value::Sequence { .. } | Value::PixelSequence { .. } => unreachable!(),\n  657 |                     Value::Primitive(value) => {\n  658 |                         // return primitive value, done\n  659 |                         let token = DataToken::PrimitiveValue(value);\n  660 |                         (Some(token), DataElementTokens::End)\n  661 |                     }\n  662 |                 }","lines":10,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/dataset/mod.rs#L653-L662"}]},{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`encode_element_as_text` ends with an `unreachable!()` arm covering `Date`/`DateTime`/`Time`/`Tags`/`Strs`/`Str`. `Str`/`Strs` are indeed intercepted earlier, but a caller can construct a `DataElement` with VR `DS`/`IS` and a `PrimitiveValue::Date`/`Time`/`DateTime`/`Tags`, which reaches this arm and panics during encoding. It is a construction/encoding path (less adversarial than parsing), but still a reachable panic.","fix":"Replace the `unreachable!()` with a real fallback: format the value as text (or return an encoding `Error`) for these VR/value combinations instead of panicking.","locations":[{"ref":"parser/src/stateful/encode.rs:409-415","code":"  409 |             PrimitiveValue::Date(_)\n  410 |             | PrimitiveValue::DateTime(_)\n  411 |             | PrimitiveValue::Time(_)\n  412 |             | PrimitiveValue::Tags(_)\n  413 |             | PrimitiveValue::Strs(_)\n  414 |             | PrimitiveValue::Str(_) => unreachable!(),\n  415 |         }","lines":7,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/parser/src/stateful/encode.rs#L409-L415"}]},{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`interleave_planes` performs unchecked indexing (`data[i]`, `data[i + 1]`, `data[i + frame_size]`, `data[i + frame_size + 1]`, `data[i + frame_size * 2]`, `data[i + frame_size * 2 + 1]`) assuming `data.len() >= 3 * frame_size`. `frame_size` is derived from `cols`/`rows`/`bits_allocated` (file attributes) while `data` is the decoder output; if they disagree (short or mismatched buffer), the loop indexes out of bounds and panics. Called for `PlanarConfiguration == 1 && samples_per_pixel == 3`.","fix":"Validate `data.len() == 3 * frame_size` (or `>=`) before interleaving and return an error otherwise; alternatively iterate with checked accesses and bail out on missing bytes.","locations":[{"ref":"pixeldata/src/gdcm.rs:365-390","code":"  365 | fn interleave_planes(cols: usize, rows: usize, bits_allocated: usize, data: Vec<u8>) -> Vec<u8> {\n  366 |     let frame_size = cols * rows * (bits_allocated / 8);\n  367 |     let mut interleaved = Vec::with_capacity(data.len());\n  368 | \n  369 |     let mut i = 0;\n  370 |     while i < frame_size {\n  371 |         interleaved.push(data[i]);\n  372 |         if bits_allocated > 8 {\n  373 |             interleaved.push(data[i + 1])\n  374 |         }\n  375 | \n  376 |         interleaved.push(data[i + frame_size]);\n  377 |         if bits_allocated > 8 {\n  378 |             interleaved.push(data[i + frame_size + 1])\n  379 |         }\n  380 | \n  381 |         interleaved.push(data[i + frame_size * 2]);\n  382 |         if bits_allocated > 8 {\n  383 |             interleaved.push(data[i + frame_size * 2 + 1])\n  384 |         }\n  385 | \n  386 |         i = if bits_allocated > 8 { i + 2 } else { i + 1 };\n  387 |     }\n  388 | \n  389 |     interleaved\n  390 | }","lines":26,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/gdcm.rs#L365-L390"}]},{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`bytes_to_vec_u16` sizes the destination as `data.len() / 2` and only guards the even-length precondition with `debug_assert!`. `NativeEndian::read_u16_into` asserts (in all build modes) that `src.len() == 2 * dst.len()`, so an odd-length `data` panics in release builds. This is reachable through the public `data_ow()` (`bytes_to_vec_u16(&self.data)`) when `self.data` has odd length (e.g. odd-length output from an encapsulated-data decoder).","fix":"Handle odd-length input gracefully instead of relying on `debug_assert!` (e.g. truncate to the largest even prefix, or return a `Result`/error), so release builds do not panic inside `read_u16_into`.","locations":[{"ref":"pixeldata/src/lib.rs:1966-1971","code":" 1966 | fn bytes_to_vec_u16(data: &[u8]) -> Vec<u16> {\n 1967 |     debug_assert!(data.len() % 2 == 0);\n 1968 |     let mut pixel_array: Vec<u16> = vec![0; data.len() / 2];\n 1969 |     NativeEndian::read_u16_into(data, &mut pixel_array);\n 1970 |     pixel_array\n 1971 | }","lines":6,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/lib.rs#L1966-L1971"},{"ref":"pixeldata/src/lib.rs:551-553","code":"  551 |     pub fn data_ow(&self) -> Vec<u16> {\n  552 |         bytes_to_vec_u16(&self.data)\n  553 |     }","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/lib.rs#L551-L553"}]},{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the storescp inner loops, `TransferSyntaxRegistry.get(ts).unwrap()` is used on the negotiated presentation-context transfer syntax. This is normally safe because only registered syntaxes are accepted, but a lookup miss (e.g. a syntax accepted via a path that does not survive the exact-string registry lookup) would panic while handling incoming data.","fix":"Replace `.unwrap()` with `.whatever_context(\"unsupported negotiated transfer syntax\")?` to degrade gracefully.","locations":[{"ref":"storescp/src/store_sync.rs:233-237","code":"  233 |                                 let obj > match end_date {\n  720 |                 Some(ed) => Ok(DateTimeRange::from_end(NaiveDateTime::new(*ed, end_time))),\n  721 |                 None => panic!(\"Impossible combination of two None values for a date range.\"),\n  722 |             },","lines":4,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/core/src/value/range.rs#L719-L722"}]},{"id":"PANIC_37","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`decode_text_trap` indexes `input[0]` unconditionally. It is a `DecoderTrap::Call` callback invoked by the `encoding` crate on undecodable byte sequences; the crate's contract passes a non-empty slice, so this is safe in practice, but it is a latent panic if that contract is ever violated and it processes untrusted DICOM text.","fix":"Guard defensively: `let Some(&c) = input.first() else { return false };` instead of `let c = input[0];`.","locations":[{"ref":"encoding/src/text.rs:329-343","code":"  329 | fn decode_text_trap(\n  330 |     _decoder: &mut dyn RawDecoder,\n  331 |     input: &[u8],\n  332 |     output: &mut dyn StringWriter,\n  333 | ) -> bool {\n  334 |     let c = input[0];\n  335 |     let o0 = c & 7;\n  336 |     let o1 = (c & 56) >> 3;\n  337 |     let o2 = (c & 192) >> 6;\n  338 |     output.write_char('\\\\');\n  339 |     output.write_char((o2 + b'0') as char);\n  340 |     output.write_char((o1 + b'0') as char);\n  341 |     output.write_char((o0 + b'0') as char);\n  342 |     true\n  343 | }","lines":15,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/encoding/src/text.rs#L329-L343"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In the GDCM per-frame decoder, `let frame_size = cols * rows * samples_per_pixel * (bits_allocated / 8);` performs the multiplication entirely in `u16` (all four operands are `u16`). For any realistic image `cols * rows` already exceeds `u16::MAX` (e.g. 256x256 = 65536), so this panics in debug builds and silently wraps to a bogus `frame_size` in release, after which `data.chunks_exact(frame_size as usize)` selects the wrong bytes. The analogous primitive branch a few lines below correctly casts to `usize` first, confirming this is an oversight.","fix":"Cast to `usize` before multiplying: `let frame_size = cols as usize * rows as usize * samples_per_pixel as usize * (bits_allocated as usize / 8);` (and use it as `frame_size` without the later `as usize`).","locations":[{"ref":"pixeldata/src/gdcm.rs:259-260","code":"  259 |                         let frame_size = cols * rows * samples_per_pixel * (bits_allocated / 8);\n  260 |                         data.chunks_exact(frame_size as usize)","lines":2,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/gdcm.rs#L259-L260"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"Several shift expressions use the default `i32` literal `1` while shifting by a file-controlled amount. `let size = (1 << bits_stored as u32) as usize;` overflows: with `bits_stored == 32` this is `1i32 << 32` (shift-amount overflow -> panic in debug, wraps to `1` in release giving a size-1 LUT); with `bits_stored == 31` it is `1i32 << 31 == i32::MIN`, and `as usize` yields ~`1.8e19`, causing a capacity-overflow/OOM abort. The `y_max` computations `((1 << bits_allocated) - 1) as f64` are worse: `bits_allocated = (bits_stored as usize).next_power_of_two()` can be 32, 64, ... for `bits_stored` in 17..=32 or larger, so `1i32 << 32`/`1i32 << 64` panics in debug (and this runs before the `new_with_fn` assert). All are reachable when converting 16-bit pixel data whose `BitsStored` exceeds 16.","fix":"Use a wide unsigned base and validate `bits_stored` first. E.g. change `let size = (1 << bits_stored as u32) as usize;` to `let size = 1usize << bits_stored;`, and `let y_max = ((1 << bits_allocated) - 1) as f64;` to `let y_max = ((1u64 << bits_allocated) - 1) as f64;`, after ensuring `bits_stored` is within `1..=32` (see the assert finding).","locations":[{"ref":"pixeldata/src/lut.rs:114","code":"  114 |         let size = (1 << bits_stored as u32) as usize;","lines":1,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/lut.rs#L114"},{"ref":"pixeldata/src/lut.rs:246-247","code":"  246 |         let bits_allocated = (bits_stored as usize).next_power_of_two();\n  247 |         let y_max = ((1 << bits_allocated) - 1) as f64;","lines":2,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/lut.rs#L246-L247"},{"ref":"pixeldata/src/lut.rs:312-313","code":"  312 |         let bits_allocated = (bits_stored as usize).next_power_of_two();\n  313 |         let y_max = ((1 << bits_allocated) - 1) as f64;","lines":2,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/pixeldata/src/lut.rs#L312-L313"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `JpegLsAdapter::encode_frame`, `near` is computed as `((1 << (bits_stored - 4)) * (100 - quality as i32) / 100).min(4096)`. `bits_stored` is a `u16` from the source object; when `bits_stored < 4` (e.g. 2 or 3, only `bits_stored == 1` is rejected earlier) `bits_stored - 4` underflows (debug panic), and the resulting huge shift amount makes `1 << ..` overflow/panic as well.","fix":"Compute the shift with saturation / an explicit lower-bound check, e.g. `let shift = bits_stored.saturating_sub(4);` after validating `bits_stored >= 4` (or reject `bits_stored < 4` with a `whatever!`).","locations":[{"ref":"transfer-syntax-registry/src/adapters/jpegls.rs:118-120","code":"  118 |         // calculate the maximum acceptable error range\n  119 |         // based on the requested quality and bit depth\n  120 |         let near = ((1 << (bits_stored - 4)) * (100 - quality as i32) / 100).min(4096);","lines":3,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/transfer-syntax-registry/src/adapters/jpegls.rs#L118-L120"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`write_chunk_u16` computes the length prefix with a truncating cast `data.len() as u16` (and `write_chunk_u32` with `data.len() as u32`). If the buffered chunk exceeds `u16::MAX` (65535) bytes, the length silently wraps modulo 65536 instead of erroring, emitting a PDU whose declared item length disagrees with the actual payload and desynchronizing the peer's parser. This wraps `write_pdu_variable_user_variables` (line 854, all user variables), `SopClassExtendedNegotiationSubItem` data (line 1015/1037), and the presentation-context items (line 610). None of these validate the size before casting.","fix":"Before the cast, verify the length fits and return a proper error otherwise, e.g.:\n```rust\nlet length = u16::try_from(data.len())\n    .map_err(|_| /* new WriteChunkError::TooLong variant */)?;\n```\nSame for `write_chunk_u32` with `u32::try_from`.","locations":[{"ref":"ul/src/pdu/writer.rs:59","code":"   59 |     let length = data.len() as u16;","lines":1,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/pdu/writer.rs#L59"},{"ref":"ul/src/pdu/writer.rs:40","code":"   40 |     let length = data.len() as u32;","lines":1,"link":"https://github.com/qarmin/dicom-rs/blob/9b961f02d0598e6a2cddf1f1ad5a45246304b04d/ul/src/pdu/writer.rs#L40"},{"ref":"ul/src/pdu/writer.rs:854-1041","code":"  854 |     write_chunk_u16(writer, |writer| {\n  855 |         // 5-xxx - User-data - This variable field shall contain User-data sub-items as defined by\n  856 |         // the DICOM Application Enti
