<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `resolve_asset_path_from_filesystem`, the incoming asset `path` (which on native platforms comes from a webview custom-protocol request, i.e. untrusted/attacker-influenceable input) is percent-decoded and then `.expect(\"expected URL to be UTF-8 encoded\")`-ed. Any request whose percent-encoding decodes to invalid UTF-8 (e.g. a raw `%ff` byte with no valid continuation) will panic instead of returning `AssetPathError::NotFound` / a 404. Since this runs on the asset-serving path of every native Dioxus desktop/mobile app, a single malformed request (crafted link, redirect, or buggy embedded content) can crash the whole application process.","fix":"Replace the `.expect(...)` with graceful fallback handling, e.g.:\n```rust\nlet mut uri_path = PathBuf::from(\n    percent_encoding::percent_decode_str(path)\n        .decode_utf8()\n        .unwrap_or(std::borrow::Cow::Borrowed(path))\n        .as_ref(),\n);\n```\nor propagate a `None`/`AssetPathError::NotFound` from `resolve_asset_path_from_filesystem` when decoding fails, instead of panicking.","locations":[{"ref":"packages/asset-resolver/src/native.rs:43-48","code":"   43 |     let mut uri_path = PathBuf::from(\n   44 |         percent_encoding::percent_decode_str(path)\n   45 |             .decode_utf8()\n   46 |             .expect(\"expected URL to be UTF-8 encoded\")\n   47 |             .as_ref(),\n   48 |     );","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/asset-resolver/src/native.rs#L43-L48"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`WebAssetResolveError::from_js_value` assumes any JS exception value can be downcast to `js_sys::Error` and calls `unreachable!(\"Expected a js_sys::Error, got: {:?}\", value)` on the else branch. In the browser, `fetch()` rejects with a `DOMException` (e.g. `AbortError` when the request is aborted, or `NetworkError`), and `DOMException` does NOT inherit from JS `Error`, so `value.dyn_ref::<js_sys::Error>()` returns `None` and this `unreachable!()` fires for real, common conditions like an aborted or cancelled fetch, crashing the wasm module.","fix":"Don't assume the rejection value is always a `js_sys::Error`; build a `WebAssetResolveError` from whatever was thrown instead of panicking, e.g. store the `JsValue`/its string representation directly rather than requiring a downcast to `js_sys::Error`:\n```rust\nfn from_js_value(value: JsValue) -> Self {\n    let error = value\n        .dyn_ref::<js_sys::Error>()\n        .cloned()\n        .unwrap_or_else(|| js_sys::Error::new(&format!(\"{value:?}\")));\n    WebAssetResolveError::from(error)\n}\n```","locations":[{"ref":"packages/asset-resolver/src/web.rs:16-24","code":"   16 | impl WebAssetResolveError {\n   17 |     fn from_js_value(value: JsValue) -> Self {\n   18 |         if let Some(error) = value.dyn_ref::<js_sys::Error>() {\n   19 |             WebAssetResolveError::from(error.clone())\n   20 |         } else {\n   21 |             unreachable!(\"Expected a js_sys::Error, got: {:?}\", value)\n   22 |         }\n   23 |     }\n   24 | }","lines":9,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/asset-resolver/src/web.rs#L16-L24"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"hard","description":"In `unparse_expr`'s `ReplaceMacros::visit_macro_mut`, when a nested `rsx!`/`render!` macro is found inside an arbitrary Rust expression, its token stream is parsed with `CallBody::parse_strict.parse2(i.tokens.clone()).unwrap()`. Unlike the top-level `try_fmt_file` path in `lib.rs` (which uses `writer.write_rsx_call(&body).is_err()` and returns a proper `syn::Error` for partially-complete rsx), this nested-macro path panics outright if the inner macro body fails strict parsing (e.g. a user is mid-edit and has an incomplete nested `rsx! { ... }` inside a closure/expression). Because `unparse_expr` is reachable from many `Writer` methods (`write_inline_expr`, `write_spread_attribute`, `retrieve_formatted_expr`, attribute if-chains, etc.), this panic can be triggered by ordinary incremental editing and will crash the whole formatting call - including in the VS Code extension (`packages/extension/src/lib.rs`), which calls `dioxus_autofmt::try_fmt_file`/`fmt_block` directly with no `catch_unwind`, so format-on-save for the extension aborts entirely instead of leaving the file untouched.","fix":"Make the nested-macro parse failure a recoverable condition instead of a panic. For example, track failures on the `ReplaceMacros` visitor (similar to `Writer::invalid_exprs`) and check them after `visit_expr_mut` finishes, returning a `syn::Result<String>` from `unparse_expr` instead of `String`, e.g.:\n```rust\nlet body = match CallBody::parse_strict.parse2(i.tokens.clone()) {\n    Ok(body) => body,\n    Err(err) => {\n        self.error = Some(err);\n        return;\n    }\n};\n```\nthen have `unparse_expr` and its callers propagate the error instead of unwrapping.","locations":[{"ref":"packages/autofmt/src/prettier_please.rs:27-79","code":"   27 |     impl VisitMut for ReplaceMacros<'_> {\n   28 |         fn visit_macro_mut(&mut self, i: &mut syn::Macro) {\n   29 |             // replace the macro with a block that roughly matches the macro\n   30 |             if let Some(\"rsx\" | \"render\") = i\n   31 |                 .path\n   32 |                 .segments\n   33 |                 .last()\n   34 |                 .map(|i| i.ident.to_string())\n   35 |                 .as_deref()\n   36 |             {\n   37 |                 // format the macro in place\n   38 |                 // we'll use information about the macro to replace it with another formatted block\n   39 |                 // once we've written out the unparsed expr from prettyplease, we can replace\n   40 |                 // this dummy block with the actual formatted block\n   41 |                 let body = CallBody::parse_strict.parse2(i.tokens.clone()).unwrap();\n   42 |                 let multiline = !Writer::is_short_rsx_call(&body.body.roots);\n   43 |                 let mut formatted = {\n   44 |                     let mut writer = Writer::new(self.src, self.cfg.clone());\n   45 |                     _ = writer.write_body_nodes(&body.body.roots).ok();\n   46 |                     writer.consume()\n   47 |                 }\n   48 |                 .unwrap();\n   49 | \n   50 |                 i.path = syn::parse_str(MARKER).unwrap();\n   51 |                 i.tokens = Default::default();\n   52 | \n   53 |                 // make sure to transform the delimiter to a brace so the marker can be found\n   54 |                 // an alternative approach would be to use multiple different markers that are not\n   55 |                 // sensitive to the delimiter.\n   56 |                 i.delimiter = MacroDelimiter::Brace(Default::default());\n   57 | \n   58 |                 // Push out the indent level of the formatted block if it's multiline\n   59 |                 if multiline || formatted.contains('\\n') {\n   60 |                     formatted = formatted\n   61 |                         .lines()\n   62 |                         .map(|line| {\n   63 |                             // Don't add indentation to blank lines (avoid trailing whitespace)\n   64 |                             if line.is_empty() {\n   65 |                                 String::new()\n   66 |                             } else {\n   67 |                                 format!(\"{}{line}\", self.cfg.indent_str())\n   68 |                             }\n   69 |                         })\n   70 |                         .collect::<Vec<_>>()\n   71 |                         .join(\"\\n\");\n   72 |                 }\n   73 | \n   74 |                 // Save this formatted block for later, when we apply it to the original expr\n   75 |                 self.formatted_stack.push(formatted)\n   76 |             }\n   77 | \n   78 |             syn::visit_mut::visit_macro_mut(self, i);\n   79 |         }","lines":53,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/autofmt/src/prettier_please.rs#L27-L79"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`compress_png` (and its helper calls) returns `()` instead of `Result` and uses `.unwrap()`/`panic!()` throughout: `liq.set_speed(5).unwrap()`, `liq.set_quality(0, 99).unwrap()`, `liq.new_image(...).unwrap()`, `liq.quantize(&mut img)` explicitly `panic!`s on error, `res.remapped(&mut img).unwrap()`, `std::fs::File::create(output_location).unwrap()`, and several `writer.*().unwrap()` calls. Since this function processes arbitrary user-supplied PNG assets from `process_image`, any edge case (zero-dimension image after `resize_exact`, disk-full/permission error creating the output file, or a quantization failure on unusual color data) crashes the entire `dx build`/`dx serve` process with an unhandled panic instead of surfacing a clean, recoverable error for that one asset.","fix":"Change `compress_png` to return `anyhow::Result<()>` and propagate errors with `?`/`.context(...)` instead of `.unwrap()`/`panic!`, then update the call site in `process_image` to use `compress_png(...)?;` instead of a bare statement.","locations":[{"ref":"packages/cli/src/opt/image.rs:78-125","code":"   78 | pub(crate) fn compress_png(image: DynamicImage, output_location: &Path) {\n   79 |     // Image loading/saving is outside scope of this library\n   80 |     let width = image.width() as usize;\n   81 |     let height = image.height() as usize;\n   82 |     let bitmap: Vec<_> = image\n   83 |         .into_rgba8()\n   84 |         .pixels()\n   85 |         .map(|px| imagequant::RGBA::new(px[0], px[1], px[2], px[3]))\n   86 |         .collect();\n   87 | \n   88 |     // Configure the library\n   89 |     let mut liq = imagequant::new();\n   90 |     liq.set_speed(5).unwrap();\n   91 |     liq.set_quality(0, 99).unwrap();\n   92 | \n   93 |     // Describe the bitmap\n   94 |     let mut img = liq.new_image(&bitmap[..], width, height, 0.0).unwrap();\n   95 | \n   96 |     // The magic happens in quantize()\n   97 |     let mut res = match liq.quantize(&mut img) {\n   98 |         Ok(res) => res,\n   99 |         Err(err) => panic!(\"Quantization failed, because: {err:?}\"),\n  100 |     };\n  101 | \n  102 |     let (palette, pixels) = res.remapped(&mut img).unwrap();\n  103 | \n  104 |     let file = std::fs::File::create(output_location).unwrap();\n  105 |     let w = &mut BufWriter::new(file);\n  106 | \n  107 |     let mut encoder = png::Encoder::new(w, width as u32, height as u32);\n  108 |     encoder.set_color(png::ColorType::Rgba);\n  109 |     let mut flattened_palette = Vec::new();\n  110 |     let mut alpha_palette = Vec::new();\n  111 |     for px in palette {\n  112 |         flattened_palette.push(px.r);\n  113 |         flattened_palette.push(px.g);\n  114 |         flattened_palette.push(px.b);\n  115 |         alpha_palette.push(px.a);\n  116 |     }\n  117 |     encoder.set_palette(flattened_palette);\n  118 |     encoder.set_trns(alpha_palette);\n  119 |     encoder.set_depth(png::BitDepth::Eight);\n  120 |     encoder.set_color(png::ColorType::Indexed);\n  121 |     encoder.set_compression(png::Compression::Best);\n  122 |     let mut writer = encoder.write_header().unwrap();\n  123 |     writer.write_image_data(&pixels).unwrap();\n  124 |     writer.finish().unwrap();\n  125 | }","lines":48,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/opt/image.rs#L78-L125"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`Workspace::find_main_package` resolves `[workspace] default-members` entries with `std::fs::canonicalize(default).unwrap()` where `default` is the raw (workspace-root-relative) string from `Cargo.toml`. It is never joined with `self.workspace_root()` first, so `canonicalize` resolves it relative to the process's current working directory instead. When `dx` is invoked from a subdirectory of the workspace (a very common workflow - running `dx serve`/`dx build` from inside a member crate) and a `default-members` path doesn't happen to also exist relative to that subdirectory, this call fails and `.unwrap()` panics the whole CLI instead of finding the right default package (or it can silently resolve to the wrong directory if a coincidentally-matching path exists under the CWD).","fix":"Join the default-member path with the workspace root before canonicalizing, and propagate errors instead of unwrapping:\n```rust\nlet default_member_path = self.workspace_root().join(default);\nlet default_member_path = std::fs::canonicalize(&default_member_path)\n    .with_context(|| format!(\"Failed to resolve workspace default-member {default}\"))?;\n```","locations":[{"ref":"packages/cli/src/workspace.rs:344-373","code":"  344 |         // if we have default members specified, try them first\n  345 |         if let Some(ws) = &self.cargo_toml.workspace {\n  346 |             for default in &ws.default_members {\n  347 |                 let mut workspace_members = self.krates.workspace_members();\n  348 |                 let default_member_path = std::fs::canonicalize(default).unwrap();\n  349 | \n  350 |                 let found = workspace_members.find_map(|node| {\n  351 |                     if let krates::Node::Krate { id, krate, .. } = node {\n  352 |                         // Skip this default member if it doesn't have any binary targets\n  353 |                         if !krate\n  354 |                             .targets\n  355 |                             .iter()\n  356 |                             .any(|t| t.kind.contains(&krates::cm::TargetKind::Bin))\n  357 |                         {\n  358 |                             return None;\n  359 |                         }\n  360 |                         let member_path =\n  361 |                             std::fs::canonicalize(krate.manifest_path.parent().unwrap()).unwrap();\n  362 |                         if member_path == default_member_path {\n  363 |                             return Some(id);\n  364 |                         }\n  365 |                     }\n  366 |                     None\n  367 |                 });\n  368 | \n  369 |                 if let Some(kid) = found {\n  370 |                     return Ok(self.krates.nid_for_kid(kid).unwrap());\n  371 |                 }\n  372 |             }\n  373 |         }","lines":30,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/workspace.rs#L344-L373"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`ConstVec::push` writes directly to `self.memory[self.len as usize]` with no bounds check against `MAX_SIZE`, unlike every other mutating method on `ConstVec` (`set` uses an explicit `panic!(\"Out of bounds\")`, `swap` and `split_at` use `assert!`). Since `serialize_const`, `write_number`, `write_bytes`, `write_str`, `write_array`, `write_map`, etc. all funnel through `ConstVec<u8>` with the crate-wide `DEFAULT_MAX_SIZE` of 1024 bytes, serializing any value whose CBOR encoding exceeds that (a long string, a large `Vec`/list, a struct with many fields or long field names) causes `push` to index past the end of the fixed-size `memory` array, producing an uncontrolled `index out of bounds` panic instead of a clear diagnostic or graceful `Option`/`Result` failure.","fix":"Add an explicit bounds check with a clear panic message (consistent with `set`), e.g.:\n```rust\npub const fn push(mut self, value: T) -> Self {\n    assert!((self.len as usize) < MAX_SIZE, \"ConstVec is full\");\n    self.memory[self.len as usize] = MaybeUninit::new(value);\n    self.len += 1;\n    self\n}\n```\nConsider also documenting the fixed-capacity limitation prominently since `ConstVec::new()` silently defaults to 1024 bytes.","locations":[{"ref":"packages/const-serialize/src/const_vec.rs:102-106","code":"  102 |     pub const fn push(mut self, value: T) -> Self {\n  103 |         self.memory[self.len as usize] = MaybeUninit::new(value);\n  104 |         self.len += 1;\n  105 |         self\n  106 |     }","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/const-serialize/src/const_vec.rs#L102-L106"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`Effect::run` in `effect.rs` takes a `RefCell::borrow_mut()` on `self.effect` and holds that guard (`effect`) for the entire duration of the loop, including while invoking each user callback `f()`. `Effect::push_back` also needs `self.effect.borrow_mut()`. If any callback executed inside `run` (directly or transitively, e.g. a `use_effect` closure that calls `queue_effect` again for the same scope/order) causes `push_back` to be called on the same `Effect` instance before `run` returns, the second `borrow_mut()` will hit the already-held borrow and panic with `already borrowed: BorrowMutError`. This turns a plausible reentrant effect-scheduling pattern into a hard crash instead of just queuing the new callback for a later pass.","fix":"Release the borrow before invoking the callback so `push_back` can safely re-enter while an effect is running:\n```rust\npub(crate) fn run(&self) {\n    loop {\n        let f = self.effect.borrow_mut().pop_front();\n        match f {\n            Some(f) => f(),\n            None => break,\n        }\n    }\n}\n```\nThis borrows `effect` only long enough to pop the next closure, then drops the guard before calling `f()`, so a reentrant `push_back` from within `f()` no longer panics.","locations":[{"ref":"packages/core/src/effect.rs:27-36","code":"   27 |     pub(crate) fn push_back(&self, f: impl FnOnce() + 'static) {\n   28 |         self.effect.borrow_mut().push_back(Box::new(f));\n   29 |     }\n   30 | \n   31 |     pub(crate) fn run(&self) {\n   32 |         let mut effect = self.effect.borrow_mut();\n   33 |         while let Some(f) = effect.pop_front() {\n   34 |             f();\n   35 |         }\n   36 |     }","lines":10,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/effect.rs#L27-L36"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`App::handle_initialize_msg` calls `self.webviews.get_mut(&id).unwrap()` on the `WindowId` carried by the `initialize` IPC message. This message is sent asynchronously from the webview through `proxy.send_event`, so by the time the event loop processes it the window may already have been removed from `self.webviews` (e.g. the user closed the window immediately after it fired `initialize`, or `handle_close_requested`/`window_destroyed` ran first). When that happens the `unwrap()` panics and takes down the whole desktop app. Note that the sibling handler `handle_query_msg` (just below, `packages/desktop/src/app.rs:309-319`) guards the exact same race with `let Some(view) = self.webviews.get(&id) else { return; };` - `handle_initialize_msg` is the odd one out.","fix":"Mirror the guard used in `handle_query_msg`:\n\n```rust\npub fn handle_initialize_msg(&mut self, id: WindowId) {\n    let Some(view) = self.webviews.get_mut(&id) else {\n        return;\n    };\n    // ... rest of the function unchanged, using `view` instead of re-fetching\n}\n```","locations":[{"ref":"packages/desktop/src/app.rs:290-307","code":"  290 |     pub fn handle_initialize_msg(&mut self, id: WindowId) {\n  291 |         let view = self.webviews.get_mut(&id).unwrap();\n  292 | \n  293 |         view.edits\n  294 |             .wry_queue\n  295 |             .with_mutation_state_mut(|f| view.dom.rebuild(f));\n  296 | \n  297 |         view.edits.wry_queue.send_edits();\n  298 | \n  299 |         #[cfg(not(target_os = \"linux\"))]\n  300 |         {\n  301 |             view.desktop_context\n  302 |                 .window\n  303 |                 .set_visible(self.is_visible_before_start);\n  304 |         }\n  305 | \n  306 |         _ = self.shared.proxy.send_event(UserWindowEvent::Poll(id));\n  307 |     }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/app.rs#L290-L307"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `EditWebsocket::handle_connection`, right after the WebSocket handshake completes, the code does `websocket.send(tungstenite::Message::Text(hex_encoded_server_key.into())).unwrap()`. This call runs directly on the background thread that owns `accept_loop`'s `while let Ok((stream, _)) = server.accept()` loop (the per-connection processing is only spawned onto its own thread *after* this line, at `packages/desktop/src/edits.rs:305`). If the client disconnects (or resets the TCP connection) between completing the handshake and this send - which is a completely normal, attacker/flaky-network-triggerable event, not exotic - `send` returns `Err` and `.unwrap()` panics. Because this runs on the sole accept-loop thread (spawned once in `EditWebsocket::start`, with no `catch_unwind`), the panic kills that thread permanently: the `TcpListener` stops being polled and the app can never accept another edits WebSocket connection again (e.g. the iOS reconnect-after-sleep path described in the module doc comment would then hang forever, or a newly created window's webview could never receive UI edits).","fix":"Replace the `.unwrap()` with graceful error handling so a single bad connection cannot kill the accept loop:\n\n```rust\nif let Err(e) = websocket.send(tungstenite::Message::Text(hex_encoded_server_key.into())) {\n    tracing::error!(\"Error sending server key to websocket client: {}\", e);\n    return;\n}\n```\n\nConsider also wrapping the whole `accept_loop` body in `std::panic::catch_unwind` as defense in depth, since any future panic here has the same fatal, permanent effect on all windows.","locations":[{"ref":"packages/desktop/src/edits.rs:222-291","code":"  222 |     fn handle_connection(\n  223 |         stream: TcpStream,\n  224 |         server_location: Arc<Mutex<ServerLocation>>,\n  225 |         connections: Arc<RwLock<HashMap<u32, WebviewConnectionState>>>,\n  226 |     ) {\n  227 |         use tungstenite::handshake::server::{Request, Response};\n  228 | \n  229 |         let current_server_location = { *server_location.lock().unwrap() };\n  230 |         let hex_encoded_client_key = encode_key_string(&current_server_location.client_key);\n  231 |         let hex_encoded_server_key = encode_key_string(&current_server_location.server_key);\n  232 |         let mut location = None;\n  233 | \n  234 |         #[allow(clippy::result_large_err)]\n  235 |         let on_request = |req: &Request, res| {\n  236 |             // Try to parse the webview id and key from the path\n  237 |             let path = req.uri().path();\n  238 | \n  239 |             // The path should have two parts `/webview_id/key`\n  240 |             let mut segments = path.trim_matches('/').split('/');\n  241 |             let webview_id = segments\n  242 |                 .next()\n  243 |                 .and_then(|s| s.parse::<u32>().ok())\n  244 |                 .ok_or_else(|| {\n  245 |                     Response::builder()\n  246 |                         .status(400)\n  247 |                         .body(Some(\"Bad Request: Invalid webview ID\".to_string()))\n  248 |                         .unwrap()\n  249 |                 })?;\n  250 |             let key = segments.next().ok_or_else(|| {\n  251 |                 Response::builder()\n  252 |                     .status(400)\n  253 |                     .body(Some(\"Bad Request: Missing key\".to_string()))\n  254 |                     .unwrap()\n  255 |             })?;\n  256 | \n  257 |             // Make sure the key matches the expected key.\n  258 |             // VERY IMPORTANT: We cannot use normal string comparison here because it reveals information\n  259 |             // about the key based on timing information. Instead we use a constant time comparison method.\n  260 |             let key_matches: bool =\n  261 |                 subtle::ConstantTimeEq::ct_eq(hex_encoded_client_key.as_ref(), key.as_bytes())\n  262 |                     .into();\n  263 |             if !key_matches {\n  264 |                 return Err(Response::builder()\n  265 |                     .status(403)\n  266 |                     .body(Some(\"Forbidden: Invalid key\".to_string()))\n  267 |                     .unwrap());\n  268 |             }\n  269 | \n  270 |             location = Some(WebviewWebsocketLocation {\n  271 |                 webview_id,\n  272 |                 server: server_location,\n  273 |             });\n  274 | \n  275 |             Ok(res)\n  276 |         };\n  277 | \n  278 |         // Accept the websocket connection while reading the path and setting the location\n  279 |         let mut websocket = match tungstenite::accept_hdr(stream, on_request) {\n  280 |             Ok(ws) => ws,\n  281 |             Err(e) => {\n  282 |                 tracing::error!(\"Error accepting websocket connection: {}\", e);\n  283 |                 return;\n  284 |             }\n  285 |         };\n  286 | \n  287 |         // Immediately send the key to authenticate the server\n  288 |         websocket\n  289 |             .send(tungstenite::Message::Text(hex_encoded_server_key.into()))\n  290 |             .unwrap();\n  291 | ","lines":70,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/edits.rs#L222-L291"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`HTMLData::from_serialized` calls `ciborium::from_reader(Cursor::new(data)).unwrap()` to decode the hydration payload embedded in the server-rendered HTML. This payload is external input from the client's point of view (it round-trips through the DOM/network and can be truncated, corrupted, or mismatched between a stale client bundle and a newer server, or vice versa). Any decode failure panics on the client during hydration setup instead of returning an error, which aborts the entire app boot instead of falling back to a client-side re-render.","fix":"Propagate the decode failure instead of unwrapping:\n\n```rust\nfn from_serialized(\n    data: &[u8],\n    debug_types: Option<Vec<String>>,\n    debug_locations: Option<Vec<String>>,\n) -> Self {\n    let data = ciborium::from_reader(Cursor::new(data)).unwrap_or_default();\n    ...\n```\n\nor change the signature to return a `Result` and have the two callers in `packages/web/src/lib.rs` and `packages/web/src/hydration/hydrate.rs` fall back to a clean client-side render (skip hydration data) when decoding fails, logging a `tracing::error!` instead of crashing the whole app.","locations":[{"ref":"packages/fullstack-core/src/transport.rs:214-220","code":"  214 |     fn from_serialized(\n  215 |         data: &[u8],\n  216 |         debug_types: Option<Vec<String>>,\n  217 |         debug_locations: Option<Vec<String>>,\n  218 |     ) -> Self {\n  219 |         let data = ciborium::from_reader(Cursor::new(data)).unwrap();\n  220 |         Self {","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-core/src/transport.rs#L214-L220"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`FileSystemCache::invalidate` panics with `.unwrap()` if the given route has no cached file (never rendered, or already invalidated). `find_file` returns `None` in that case, so `self.find_file(route).unwrap()` panics.\n\nThis is reachable from the public API: `IncrementalRenderer::invalidate` (re-exported via `pub use isrg::*` in `lib.rs`) calls `self.file_system_cache.invalidate(route)` unconditionally whenever the file-system cache is enabled, with no existence check. Any caller invalidating a route that hasn't been rendered yet (e.g. a webhook that invalidates a page id before it was ever visited) or double-invalidating the same route will panic.","fix":"Make `find_file` failure a no-op instead of a panic:\n```rust\npub fn invalidate(&mut self, route: &str) {\n    let Some(file_path) = self.find_file(route) else { return };\n    if let Err(err) = std::fs::remove_file(file_path.full_path) {\n        tracing::error!(\"Failed to remove file: {}\", err);\n    }\n}\n```","locations":[{"ref":"packages/fullstack-server/src/isrg/fs_cache.rs:78-83","code":"   78 |     pub fn invalidate(&mut self, route: &str) {\n   79 |         let file_path = self.find_file(route).unwrap().full_path;\n   80 |         if let Err(err) = std::fs::remove_file(file_path) {\n   81 |             tracing::error!(\"Failed to remove file: {}\", err);\n   82 |         }\n   83 |     }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/isrg/fs_cache.rs#L78-L83"},{"ref":"packages/fullstack-server/src/isrg/mod.rs:44-48","code":"   44 |     pub fn invalidate(&mut self, route: &str) {\n   45 |         self.memory_cache.invalidate(route);\n   46 |         #[cfg(not(target_arch = \"wasm32\"))]\n   47 |         self.file_system_cache.invalidate(route);\n   48 |     }","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/isrg/mod.rs#L44-L48"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In `Lazy::initialize`, the user-provided async constructor's result is unwrapped with `constructor().unwrap()` instead of being propagated. The enclosing function `initialize` returns `Result<(), CapturedError>` specifically so that constructor errors (e.g. a database pool failing to connect during server startup) can be handled gracefully, but the `.unwrap()` turns any `Err` from the constructor into an immediate panic, crashing the thread (and via `Lazy::get`'s `.expect(\"Failed to initialize lazy value\")`, any `deref` of the `Lazy`) instead of surfacing the real error to the caller.","fix":"Propagate the constructor error instead of unwrapping it:\n```rust\n// before\nself.set(constructor().unwrap())?;\n\n// after\nself.set(constructor()?)?;\n```","locations":[{"ref":"packages/fullstack/src/lazy.rs:88-90","code":"   88 |             // Otherwise, we need to initialize the value\n   89 |             self.set(constructor().unwrap())?;\n   90 |         }","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack/src/lazy.rs#L88-L90"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `req_from::ExtractRequest` (the one-arg `DeserializeOwned` path used when a server function has a single argument implementing `DeserializeOwned`), `Bytes::from_request(request, &()).await.unwrap()` unwraps the result of reading the request body. `Bytes::from_request` can fail on IO errors (client disconnects mid-body, truncated/aborted uploads, chunked-encoding errors), which are entirely client-controlled and reachable in production. Instead of returning a `400`/error response like the rest of the extractor pipeline does (see the `.map_err(|e| e.into_response())?` pattern used one line above for `H::from_request_parts`), this path panics the request-handling task.","fix":"Replace the `unwrap()` with proper error propagation, mirroring the header extraction above:\n```rust\nlet bytes = Bytes::from_request(request, &())\n    .await\n    .map_err(|e| ServerFnError::from(e.into_response()... /* or a dedicated Request error */)\n    .into_response())?;\n```\nor at minimum map the rejection into a `Response` via `.map_err(|e| e.into_response())?` instead of unwrapping.","locations":[{"ref":"packages/fullstack/src/magic.rs:535-557","code":"  535 |             async move {\n  536 |                 let (mut parts, body) = request.into_parts();\n  537 |                 let headers = H::from_request_parts(&mut parts, &_state)\n  538 |                     .await\n  539 |                     .map_err(|e| e.into_response())?;\n  540 | \n  541 |                 let request = Request::from_parts(parts, body);\n  542 |                 let bytes = Bytes::from_request(request, &()).await.unwrap();\n  543 |                 let as_str = String::from_utf8_lossy(&bytes);\n  544 | \n  545 |                 let bytes = if as_str.is_empty() {\n  546 |                     \"{}\".as_bytes()\n  547 |                 } else {\n  548 |                     &bytes\n  549 |                 };\n  550 | \n  551 |                 let out = serde_json::from_slice::<In>(bytes)\n  552 |                     .map(map)\n  553 |                     .map_err(|e| ServerFnError::from(e).into_response())?;\n  554 | \n  555 |                 Ok((out, headers))\n  556 |             }\n  557 |         }","lines":23,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack/src/magic.rs#L535-L557"}]},{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`IntoResponse for FileStream` builds the `Content-Type` and `Content-Disposition` response headers with `.parse().unwrap()` on values that can originate entirely from an untrusted client upload: `content_type` comes verbatim from the incoming request's `Content-Type` header (set in `FromRequest for FileStream`), and `name` comes from parsing the incoming request's `Content-Disposition` header via `content_disposition::parse_content_disposition`. If a client sends a `Content-Type` or filename containing bytes that are invalid in an HTTP header value (e.g. control characters that survive RFC 5987/2231 percent-decoding in the filename), `HeaderValue`'s `.parse()` returns `Err`, and the subsequent `.unwrap()` panics the request-handling task - a remotely triggerable panic in any handler that re-serves an uploaded `FileStream` back to a client (echo/relay/proxy endpoints).","fix":"Sanitize or fall back instead of unwrapping, e.g.:\n```rust\nif let Some(content_type) = &self.content_type {\n    if let Ok(value) = content_type.parse() {\n        res.headers_mut().insert(\"Content-Type\", value);\n    }\n}\n...\nlet disposition = format!(\"attachment; filename=\\\"{}\\\"\", self.name);\nif let Ok(value) = disposition.parse() {\n    res.headers_mut().insert(\"Content-Disposition\", value);\n}\n```\nso a malformed filename/content-type degrades to a missing header rather than crashing the handler.","locations":[{"ref":"packages/fullstack/src/payloads/files.rs:309-340","code":"  309 | #[cfg(feature = \"server\")]\n  310 | impl IntoResponse for FileStream {\n  311 |     fn into_response(self) -> axum::response::Response {\n  312 |         use axum::body::Body;\n  313 | \n  314 |         let Some(body) = self.server_body else {\n  315 |             use dioxus_fullstack_core::HttpError;\n  316 |             return HttpError::new(http::StatusCode::BAD_REQUEST, \"FileStream has no body\")\n  317 |                 .into_response();\n  318 |         };\n  319 | \n  320 |         let mut res = axum::response::Response::new(Body::from_stream(body));\n  321 | \n  322 |         // Set relevant headers if available 8 | fn write_rustc_args(args_dir: &PathBuf, rustc_args: &RustcArgs) {\n   99 |     // Extract the crate name from the args to use as the filename.\n  100 |     // Skip non-sensical args when a build is completely fresh (rustc is invoked with --crate-name ___)\n  101 |     let crate_name = rustc_args\n  102 |         .args\n  103 |         .iter()\n  104 |         .skip_while(|arg| *arg != \"--crate-name\")\n  105 |         .nth(1);\n  106 | \n  107 |     if let Some(crate_name) = crate_name {\n  108 |         if crate_name != \"___\" {\n  109 |             std::fs::create_dir_all(args_dir)\n  110 |                 .expect(\"Failed to create args directory for rustc wrapper\");\n  111 | \n  112 |             let crate_type = rustc_args\n  113 |                 .args\n  114 |                 .iter()\n  115 |                 .skip_while(|arg| *arg != \"--crate-type\")\n  116 |                 .nth(1)\n  117 |                 .map(|s| s.as_str());\n  118 | \n  119 |             let serialized_args =\n  120 |                 serde_json::to_string(rustc_args).expect(\"Failed to serialize rustc args\");\n  121 | \n  122 |             // Write args with an explicit target suffix: {crate_name}.lib.json or\n  123 |             // {crate_name}.bin.json. This avoids the ambiguity of a bare {crate_name}.json\n  124 |             // and ensures lib+bin crates don't overwrite each other.\n  125 |             let suffix = match crate_type {\n  126 |                 Some(\"lib\" | \"rlib\") => \"lib\",\n  127 |                 Some(\"bin\") => \"bin\",\n  128 |                 _ => \"bin\", // proc-macro, cdylib, etc. — treat as bin\n  129 |             };\n  130 | \n  131 |             std::fs::write(\n  132 |                 args_dir.join(format!(\"{crate_name}.{suffix}.json\")),\n  133 |                 &serialized_args,\n  134 |             )\n  135 |             .expect(\"Failed to write rustc args to file\");\n  136 |         }\n  137 |     }\n  138 | }","lines":41,"link":"htt er.rs#L871-L874"}]},{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`WebServer::wait` calls `panic!(\"Could not receive a socket - the devtools could not boot - the port is likely already in use\")` whenever `new_hot_reload_sockets`/`new_build_status_sockets` yields `None`. These channels only close when the router spawned in `devserver_mainloop` (via `tokio::spawn`) exits - e.g. if `axum::serve(...)` or `axum_server::from_tcp_rustls(...)` returns an `Err` after already running successfully for a while (transient I/O error, resource exhaustion, TLS renegotiation failure, etc.), not necessarily a port-already-in-use condition at startup. This turns a recoverable/loggable background-task failure into a hard process panic with a misleading diagnostic message, rather than surfacing a clean error and shutting down gracefully.","fix":"Instead of panicking, treat a closed channel as a fatal-but-clean condition: return a `ServeUpdate::Exit { error: Some(...) }` (or equivalent) so the caller can log the real cause and shut down cleanly instead of panicking with a hardcoded, potentially inaccurate message.","locations":[{"ref":"packages/cli/src/serve/server.rs:144-173","code":"  144 |         tokio::select! {\n  145 |             new_hot_reload_socket = &mut new_hot_reload_socket => {\n  146 |                 if let Some(new_socket) = new_hot_reload_socket {\n  147 |                     let aslr_reference = new_socket.aslr_reference;\n  148 |                     let pid = new_socket.pid;\n  149 |                     let id = new_socket.build_id.unwrap_or(BuildId::PRIMARY);\n  150 | \n  151 |                     drop(new_message);\n  152 |                     self.hot_reload_sockets.push(new_socket);\n  153 | \n  154 |                     return ServeUpdate::NewConnection { aslr_reference, id, pid };\n  155 |                 } else {\n  156 |                     panic!(\"Could not receive a socket - the devtools could not boot - the port is likely already in use\");\n  157 |                 }\n  158 |             }\n  159 |             new_build_status_socket = &mut new_build_status_socket => {\n  160 |                 if let Some(mut new_socket) = new_build_status_socket {\n  161 |                     drop(new_message);\n  162 | \n  163 |                     // Update the socket with project info and current build status\n  164 |                     let project_info = SharedStatus::new(Status::ClientInit { application_name: self.application_name.clone(), bundle: self.bundle });\n  165 |                     if project_info.send_to(&mut new_socket.socket).await.is_ok() {\n  166 |                         _ = self.build_status.send_to(&mut new_socket.socket).await;\n  167 |                         self.build_status_sockets.push(new_socket);\n  168 |                     }\n  169 |                     return future::pending::<ServeUpdate>().await;\n  170 |                 } else {\n  171 |                     panic!(\"Could not receive a socket - the devtools could not boot - the port is likely already in use\");\n  172 |                 }\n  173 |             }","lines":30,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/serve/server.rs#L144-L173"}]},{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`WebServer::new_build_update` computes `progress: (*current as f64 / *total as f64).clamp(0.0, 1.0)` for `BuildStage::Compiling { current, total, .. }` without guarding against `total == 0`. If both `current` and `total` are `0` (plausible during the earliest compiling progress event before the real crate count is known), the division yields `NaN`, and `f64::clamp` leaves `NaN` unchanged. This `Status::Building { progress: NaN, .. }` is later serialized in `SharedStatus::send_to` / `send_build_status` via `serde_json::to_string(&self.get()).unwrap()` - `serde_json` cannot represent non-finite floats and returns an `Err`, so the `.unwrap()` panics and takes down the whole devserver.","fix":"Guard the division, e.g.:\n```rust\nprogress: if *total == 0 { 0.0 } else { (*current as f64 / *total as f64).clamp(0.0, 1.0) },\n```\nand/or replace the `serde_json::to_string(..).unwrap()` calls with graceful error handling so a serialization failure never panics the server.","locations":[{"ref":"packages/cli/src/serve/server.rs:228-243","code":"  228 |                     BuildStage::Compiling {\n  229 |                         current,\n  230 |                         total,\n  231 |                         krate,\n  232 |                         ..\n  233 |                     } if !matches!(\n  234 |                         self.build_status.get(),\n  235 |                         Status::Ready | Status::BuildError { .. }\n  236 |                     ) =>\n  237 |                     {\n  238 |                         self.build_status.set(Status::Building {\n  239 |                             progress: (*current as f64 / *total as f64).clamp(0.0, 1.0),\n  240 |                             build_message: format!(\"{krate} compiling\"),\n  241 |                         });\n  242 |                         self.send_build_status().await;\n  243 |                     }","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/serve/server.rs#L228-L243"},{"ref":"packages/cli/src/serve/server.rs:789-791","code":"  789 |     async fn send_to(&self, socket: &mut WebSocket) -> Result<(), axum::Error> {\n  790 |         let msg = serde_json::to_string(&self.get()).unwrap();\n  791 |         socket.send(Message::Text(msg.into())).await","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/serve/server.rs#L789-L791"}]},{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`WasmOpt::optimize` uses `.unwrap()` on `std::fs::copy` in both the success and failure branches (copying the temp output to `output_path`, or falling back to copying the original input). A full disk, permission error, or another process holding a lock on the destination file (common on Windows) will panic the CLI mid-build instead of surfacing a normal build error, even though the rest of the function propagates errors via `Result`/`?`.","fix":"Propagate the error instead of unwrapping:\n```rust\nif self.input_path != self.output_path {\n    std::fs::copy(&self.input_path, &self.output_path)\n        .context(\"failed to copy original wasm after wasm-opt failure\")?;\n}\n...\nstd::fs::copy(self.temporary_output_path.path(), &self.output_path)\n    .context(\"failed to copy optimized wasm output\")?;\n```","locations":[{"ref":"packages/cli/src/wasm_opt.rs:111-133","code":"  111 |     pub async fn optimize(&self) -> Result<()> {\n  112 |         let mut command = self.build_command();\n  113 |         let res = command.output().await?;\n  114 | \n  115 |         if !res.status.success() {\n  116 |             let err = String::from_utf8_lossy(&res.stderr);\n  117 |             tracing::error!(\n  118 |                 telemetry = %serde_json::json!({ \"event\": \"wasm_opt_failed\" }),\n  119 |                 \"wasm-opt failed with status code {}\\nstderr: {}\\nstdout: {}\",\n  120 |                 res.status,\n  121 |                 err,\n  122 |                 String::from_utf8_lossy(&res.stdout)\n  123 |             );\n  124 |             // A failing wasm-opt execution may leave behind an empty file so copy the original file instead.\n  125 |             if self.input_path != self.output_path {\n  126 |                 std::fs::copy(&self.input_path, &self.output_path).unwrap();\n  127 |             }\n  128 |         } else {\n  129 |             std::fs::copy(self.temporary_output_path.path(), &self.output_path).unwrap();\n  130 |         }\n  131 | \n  132 |         Ok(())\n  133 |     }","lines":23,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/wasm_opt.rs#L111-L133"}]},{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`ReactiveContext::mark_dirty` acquires a write guard (`self_write` from `self.inner.try_write()`) and keeps it alive while calling the arbitrary user-supplied `(self_write.update)()` callback. If that callback (or anything it triggers, e.g. re-entrant work that ends up calling `subscribe()`, `clear_subscribers()`, or `mark_dirty()` again on the very same `ReactiveContext`) tries to acquire another write/borrow of `self.inner`, `subscribe()`'s `Err(expect) => panic!(...)` branch will fire because the box is already mutably borrowed. This makes reentrant dirty-marking on the same context a hard panic instead of a no-op or queued retry.","fix":"Drop the write guard before invoking the callback, e.g. by copying/taking what is needed out of `Inner` first:\n```rust\npub fn mark_dirty(&self) -> bool {\n    let Ok(mut self_write) = self.inner.try_write() else { return false; };\n    // Take the callback out so we don't hold a write borrow while it runs\n    let mut update = std::mem::replace(&mut self_write.update, Box::new(|| {}));\n    drop(self_write);\n    update();\n    // put it back if still needed, or restructure Inner.update as Rc<RefCell<..>> so it can be invoked without holding the whole struct's guard\n    true\n}\n```\nThe important part is that no lock on `self.inner` is held while `update()` executes.","locations":[{"ref":"packages/core/src/reactive_context.rs:217-233","code":"  217 |     pub fn mark_dirty(&self) -> bool {\n  218 |         if let Ok(mut self_write) = self.inner.try_write() {\n  219 |             #[cfg(debug_assertions)]\n  220 |             {\n  221 |                 tracing::trace!(\n  222 |                     \"Marking reactive context created at {} as dirty\",\n  223 |                     self_write.origin\n  224 |                 );\n  225 |             }\n  226 | \n  227 |             (self_write.update)();\n  228 | \n  229 |             true\n  230 |         } else {\n  231 |             false\n  232 |         }\n  233 |     }","lines":17,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/reactive_context.rs#L217-L233"}]},{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`WebviewEdits::handle_html_event` calls `desktop_context.upgrade().unwrap()` after confirming the `Weak` reference was previously set via `set_desktop_context`. The `Weak` can still go dead between that check and the `unwrap()` if the owning `DesktopService`/`WebviewInstance` is dropped concurrently (e.g. the window is closed on the main thread while an in-flight async custom-protocol request for `__events` - dispatched onto the tokio runtime, see `request_handler` in `packages/desktop/src/webview.rs:284-301` - is still being processed). When that race hits, this `unwrap()` panics and crashes the app instead of simply dropping the stale event.","fix":"Return the default (no-op) response instead of panicking when the context has already been dropped:\n\n```rust\nlet Some(desktop_context) = self.desktop_context.get().and_then(|c| c.upgrade()) else {\n    tracing::warn!(\"Dropped HTML event because the window has already closed\");\n    return Default::default();\n};\n```","locations":[{"ref":"packages/desktop/src/webview.rs:101-116","code":"  101 |     pub fn handle_html_event(&self, event: HtmlEvent) -> SynchronousEventResponse {\n  102 |         let HtmlEvent {\n  103 |             element,\n  104 |             name,\n  105 |             bubbles,\n  106 |             data,\n  107 |         } = event;\n  108 |         let Some(desktop_context) = self.desktop_context.get() else {\n  109 |             tracing::error!(\n  110 |
