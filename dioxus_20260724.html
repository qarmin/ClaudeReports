serWindowEvent::Ipc { id: window_id, msg }),\n        Err(err) => tracing::error!(\"Failed to parse IPC message: {err}\"),\n    }\n}\n```","locations":[{"ref":"packages/desktop/src/webview.rs:304-314","code":"  304 |         let ipc_handler = {\n  305 |             let window_id = window.id();\n  306 |             to_owned![shared.proxy];\n  307 |             move |payload: wry::http::Request<String>| {\n  308 |                 // defer the event to the main thread\n  309 |                 let body = payload.into_body();\n  310 |                 if let Ok(msg) = serde_json::from_str(&body) {\n  311 |                     _ = proxy.send_event(UserWindowEvent::Ipc { id: window_id, msg });\n  312 |                 }\n  313 |             }\n  314 |         };","lines":11,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/webview.rs#L304-L314"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`FullstackContext::add_response_header` silently does nothing if `response_headers` has already been taken via `take_response_headers` (i.e. after the response has been committed). A caller that adds a header slightly too late loses the header with no error, warning, or log line, making the bug hard to notice in production.","fix":"Log when a header is dropped so the mistake is visible:\n\n```rust\npub fn add_response_header(\n    &self,\n    key: impl Into<http::header::HeaderName>,\n    value: impl Into<http::header::HeaderValue>,\n) {\n    let mut lock = self.lock.write();\n    match lock.response_headers.as_mut() {\n        Some(headers) => { headers.insert(key.into(), value.into()); }\n        None => tracing::warn!(\"add_response_header called after the response headers were already committed; header dropped\"),\n    }\n}\n```","locations":[{"ref":"packages/fullstack-core/src/streaming.rs:196-205","code":"  196 |     pub fn add_response_header(\n  197 |         &self,\n  198 |         key: impl Into<http::header::HeaderName>,\n  199 |         value: impl Into<http::header::HeaderValue>,\n  200 |     ) {\n  201 |         let mut lock = self.lock.write();\n  202 |         if let Some(headers) = lock.response_headers.as_mut() {\n  203 |             headers.insert(key.into(), value.into());\n  204 |         }\n  205 |     }","lines":10,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-core/src/streaming.rs#L196-L205"}]},{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `Storage::try_read`/`try_write` for both `SyncStorage` and `UnsyncStorage`, a failed downcast (`any.downcast_ref()`/`any.downcast_mut()` returning `Err`) is mapped to `BorrowError::Dropped(ValueDroppedError::new_for_location(pointer.location))` / `BorrowMutError::Dropped(...)`. A downcast failure means the stored `Box<dyn Any>` holds a different concrete type than `T`, i.e. a type-confusion bug, not that the value was dropped. Reporting it as `Dropped` would hide the real cause (a type-safety violation) behind a misleading and unrelated error variant if this code path is ever hit due to an internal invariant break.","fix":"If a downcast failure is believed to be unreachable under the safe public API, replace the silent `Err(..Dropped..)` mapping with a `debug_assert!`/`unreachable!` with a clear message so misuse is caught loudly in debug builds, or add a dedicated `BorrowError` variant (e.g. `TypeMismatch`) instead of reusing `Dropped` for an unrelated failure mode.","locations":[{"ref":"packages/generational-box/src/sync.rs:279-320","code":"  279 | impl<T: Sync + Send + 'static> Storage<T> for SyncStorage {\n  280 |     #[track_caller]\n  281 |     fn try_read(\n  282 |         pointer: GenerationalPointer<Self>,\n  283 |     ) -> Result<Self::Ref<'static, T>, error::BorrowError> {\n  284 |         let (read, pointer) = Self::read(pointer)?;\n  285 | \n  286 |         let read = MappedRwLockReadGuard::try_map(read, |any| {\n  287 |             // Then try to downcast\n  288 |             any.downcast_ref()\n  289 |         });\n  290 |         match read {\n  291 |             Ok(guard) => Ok(GenerationalRef::new(\n  292 |                 guard,\n  293 |                 pointer.storage.borrow_info.borrow_guard(),\n  294 |             )),\n  295 |             Err(_) => Err(error::BorrowError::Dropped(\n  296 |                 ValueDroppedError::new_for_location(pointer.location),\n  297 |             )),\n  298 |         }\n  299 |     }\n  300 | \n  301 |     #[track_caller]\n  302 |     fn try_write(\n  303 |         pointer: GenerationalPointer<Self>,\n  304 |     ) -> Result<Self::Mut<'static, T>, error::BorrowMutError> {\n  305 |         let (write, pointer) = Self::write(pointer)?;\n  306 | \n  307 |         let write = MappedRwLockWriteGuard::try_map(write, |any| {\n  308 |             // Then try to downcast\n  309 |             any.downcast_mut()\n  310 |         });\n  311 |         match write {\n  312 |             Ok(guard) => Ok(GenerationalRefMut::new(\n  313 |                 guard,\n  314 |                 pointer.storage.borrow_info.borrow_mut_guard(),\n  315 |             )),\n  316 |             Err(_) => Err(error::BorrowMutError::Dropped(\n  317 |                 ValueDroppedError::new_for_location(pointer.location),\n  318 |             )),\n  319 |         }\n  320 |     }","lines":42,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/generational-box/src/sync.rs#L279-L320"},{"ref":"packages/generational-box/src/unsync.rs:275-316","code":"  275 | impl<T: 'static> Storage<T> for UnsyncStorage {\n  276 |     #[track_caller]\n  277 |     fn try_read(\n  278 |         pointer: GenerationalPointer<Self>,\n  279 |     ) -> Result<Self::Ref<'static, T>, error::BorrowError> {\n  280 |         let (read, pointer) = Self::read(pointer)?;\n  281 | \n  282 |         let ref_ = Ref::filter_map(read, |any| {\n  283 |             // Then try to downcast\n  284 |             any.downcast_ref()\n  285 |         });\n  286 |         match ref_ {\n  287 |             Ok(guard) => Ok(GenerationalRef::new(\n  288 |                 guard,\n  289 |                 pointer.storage.borrow_info.borrow_guard(),\n  290 |             )),\n  291 |             Err(_) => Err(error::BorrowError::Dropped(\n  292 |                 error::ValueDroppedError::new_for_location(pointer.location),\n  293 |             )),\n  294 |         }\n  295 |     }\n  296 | \n  297 |     #[track_caller]\n  298 |     fn try_write(\n  299 |         pointer: GenerationalPointer<Self>,\n  300 |     ) -> Result<Self::Mut<'static, T>, error::BorrowMutError> {\n  301 |         let (write, pointer) = Self::write(pointer)?;\n  302 | \n  303 |         let ref_mut = RefMut::filter_map(write, |any| {\n  304 |             // Then try to downcast\n  305 |             any.downcast_mut()\n  306 |         });\n  307 |         match ref_mut {\n  308 |             Ok(guard) => Ok(GenerationalRefMut::new(\n  309 |                 guard,\n  310 |                 pointer.storage.borrow_info.borrow_mut_guard(),\n  311 |             )),\n  312 |             Err(_) => Err(error::BorrowMutError::Dropped(\n  313 |                 error::ValueDroppedError::new_for_location(pointer.location),\n  314 |             )),\n  315 |         }\n  316 |     }","lines":42,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/generational-box/src/unsync.rs#L275-L316"}]},{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `change_reference`'s `else` branch (both `sync.rs` and `unsync.rs`), the pattern match `(RwLockStorageEntryData::Reference(reference), RwLockStorageEntryData::Rc(data)) = (&mut write.data, &other_write.data)` fails for two structurally different reasons: (1) `location` (`self`) is not itself an rc-reference box (e.g. it was created via `leak`/`insert` rather than `leak_rc`/`insert_rc`), or (2) `other` does not resolve to an `Rc` entry. The `tracing::trace!` message and returned `BorrowError::Dropped(ValueDroppedError::new_for_location(other_final.location))` unconditionally blame `other_write.data` and report `other_final.location` as the dropped value, even in case (1) where `other` is perfectly valid and the real problem is that `location` itself is the wrong kind of box. This produces a misleading diagnostic and error location when debugging `point_to` misuse.","fix":"Check `write.data` and `other_write.data` separately and produce distinct, accurate diagnostics/locations for each failure case instead of a single combined `else` that always blames `other`, e.g. first match on `&mut write.data` to confirm it is `Reference`, returning an error referencing `location.location` if not, before checking `other_write.data`.","locations":[{"ref":"packages/generational-box/src/sync.rs:375-392","code":"  375 |         if let (RwLockStorageEntryData::Reference(reference), RwLockStorageEntryData::Rc(data)) =\n  376 |             (&mut write.data, &other_write.data)\n  377 |         {\n  378 |             if reference == &other_final {\n  379 |                 return Ok(());\n  380 |             }\n  381 |             drop_ref(*reference);\n  382 |             *reference = other_final;\n  383 |             data.add_ref();\n  384 |         } else {\n  385 |             tracing::trace!(\n  386 |                 \"References should always point to a data entry directly found {:?} instead\",\n  387 |                 other_write.data\n  388 |             );\n  389 |             return Err(BorrowError::Dropped(ValueDroppedError::new_for_location(\n  390 |                 other_final.location,\n  391 |             )));\n  392 |         }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/generational-box/src/sync.rs#L375-L392"},{"ref":"packages/generational-box/src/unsync.rs:371-388","code":"  371 |         if let (RefCellStorageEntryData::Reference(reference), RefCellStorageEntryData::Rc(data)) =\n  372 |             (&mut write.data, &other_write.data)\n  373 |         {\n  374 |             if reference == &other_final {\n  375 |                 return Ok(());\n  376 |             }\n  377 |             drop_ref(*reference);\n  378 |             *reference = other_final;\n  379 |             data.add_ref();\n  380 |         } else {\n  381 |             tracing::trace!(\n  382 |                 \"References should always point to a data entry directly found {:?} instead\",\n  383 |                 other_write.data\n  384 |             );\n  385 |             return Err(BorrowError::Dropped(ValueDroppedError::new_for_location(\n  386 |                 other_final.location,\n  387 |             )));\n  388 |         }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/generational-box/src/unsync.rs#L371-L388"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`ClientRequest` has an unconditional `unsafe impl Send for ClientRequest {}` / `unsafe impl Sync for ClientRequest {}` with no `#[cfg(target_arch = \"wasm32\")]` guard, even though the justifying comment (\"On wasm reqwest not being send/sync gets annoying... it's not relevant since wasm is single-threaded\") only applies to wasm. On native targets this unsafe impl applies too, but is entirely redundant there: every field of `ClientRequest` (`Url`, `HeaderMap`, `Method`, `Extensions`) is already `Send + Sync` on native, so the auto traits would be derived automatically without any `unsafe impl`.\n\nBecause the impl isn't scoped to wasm, if a future field is ever added to `ClientRequest` that is genuinely `!Send`/`!Sync` on native (e.g. holding a native, non-thread-safe handle), this blanket `unsafe impl` would silently paper over it and introduce real undefined behavior/data races on multi-threaded native servers, since the compiler would no longer catch the violation.","fix":"Scope the unsafe impls to wasm only, matching the justification:\n```rust\n#[cfg(target_arch = \"wasm32\")]\nunsafe impl Send for ClientRequest {}\n#[cfg(target_arch = \"wasm32\")]\nunsafe impl Sync for ClientRequest {}\n```\nOr remove them entirely on native builds since the auto traits already hold there without any `unsafe` needed.","locations":[{"ref":"packages/fullstack/src/client.rs:415-417","code":"  415 | // On wasm reqwest not being send/sync gets annoying, but it's not relevant since wasm is single-threaded\n  416 | unsafe impl Send for ClientRequest {}\n  417 | unsafe impl Sync for ClientRequest {}","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack/src/client.rs#L415-L417"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"SCSS/SASS source is compiled twice for every asset: once in `hash_scss` (called from `hash_file_with_options` while computing the asset's content hash) and again in `process_scss` (called from `process_file_to` while actually generating the output file). Both call `compile_scss`, which invokes `grass::from_path` from scratch, including re-parsing and re-resolving all `@import`/`@use` files. For projects with non-trivial SCSS (many partials/imports), this doubles compile time for every asset build and every incremental rebuild that needs to check the hash.","fix":"Compute the compiled CSS once and reuse it for both hashing and writing the output (e.g. have the hashing path return the compiled string so `process_scss` can consume it directly instead of recompiling), or cache the last `compile_scss` result keyed by source path + mtime.","locations":[{"ref":"packages/cli/src/opt/css.rs:146-163","code":"  146 | pub(crate) fn compile_scss(\n  147 |     scss_options: &CssAssetOptions,\n  148 |     source: &Path,\n  149 | ) -> anyhow::Result<String> {\n  150 |     let style = match scss_options.minified() {\n  151 |         true => OutputStyle::Compressed,\n  152 |         false => OutputStyle::Expanded,\n  153 |     };\n  154 | \n  155 |     let options = grass::Options::default()\n  156 |         .style(style)\n  157 |         .quiet(false)\n  158 |         .logger(&ScssLogger {});\n  159 | \n  160 |     let css = grass::from_path(source, &options)\n  161 |         .with_context(|| format!(\"Failed to compile scss file: {}\", source.display()))?;\n  162 |     Ok(css)\n  163 | }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/opt/css.rs#L146-L163"},{"ref":"packages/cli/src/opt/css.rs:166-182","code":"  166 | pub(crate) fn process_scss(\n  167 |     scss_options: &CssAssetOptions,\n  168 |     source: &Path,\n  169 |     output_path: &Path,\n  170 | ) -> anyhow::Result<()> {\n  171 |     let css = compile_scss(scss_options, source)?;\n  172 |     let minified = minify_css(&css)?;\n  173 | \n  174 |     std::fs::write(output_path, minified).with_context(|| {\n  175 |         format!(\n  176 |             \"Failed to write css to output location: {}\",\n  177 |             output_path.display()\n  178 |         )\n  179 |     })?;\n  180 | \n  181 |     Ok(())\n  182 | }","lines":17,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/opt/css.rs#L166-L182"},{"ref":"packages/cli/src/opt/css.rs:210-223","code":"  210 | pub(crate) fn hash_scss(\n  211 |     scss_options: &CssAssetOptions,\n  212 |     source: &Path,\n  213 |     hasher: &mut impl Hasher,\n  214 | ) -> anyhow::Result<()> {\n  215 |     // Grass doesn't expose the ast for us to traverse the imports in the file. Instead of parsing scss ourselves\n  216 |     // we just hash the expanded version of the file for now\n  217 |     let css = compile_scss(scss_options, source)?;\n  218 | \n  219 |     // Hash the compiled css\n  220 |     hasher.write(css.as_bytes());\n  221 | \n  222 |     Ok(())\n  223 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/opt/css.rs#L210-L223"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`document.rs` uses a single process-wide `static RENDERER: LazyLock<RwLock<Renderer>>` to render the `<title>` and collected `<meta>`/`<link>`/`<script>` head elements for every request (`ServerDocument::title`/`render`, lines 38-58). Every call takes `RENDERER.write()`, so all concurrent requests across the whole server serialize through this single lock just to render head content, even though the main body rendering deliberately uses a *pool* of `Renderer`s (`SsrRendererPool::renderers: RwLock<Vec<Renderer>>` in `ssr.rs`) specifically to avoid exactly this kind of contention.\n\nThis is compounded by `SsrRendererPool::render_to`, which calls `Self::render_head` (which in turn calls into this global `RENDERER`) twice per request when incremental caching is enabled: once for the live streamed response (`ssr.rs:306`) and again to build the cached copy after suspense resolves (`ssr.rs:400`), doubling the contention/work on this global lock for cached routes.","fix":"Use a per-request `Renderer` (or pull one from the existing renderer pool) for head-element rendering instead of a single global `static RwLock<Renderer>`, so head rendering scales with concurrency the same way body rendering already does.","locations":[{"ref":"packages/fullstack-server/src/document.rs:17-58","code":"   17 | static RENDERER: LazyLock<RwLock<Renderer>> = LazyLock::new(|| RwLock::new(Renderer::new()));\n   18 | \n   19 | /// Reset the static renderer to a fresh state, clearing its cache.\n   20 | pub(crate) fn reset_renderer() {\n   21 |     RENDERER.write().clear();\n   22 | }\n   23 | \n   24 | #[derive(Default)]\n   25 | struct ServerDocumentInner {\n   26 |     streaming: bool,\n   27 |     title: Option<String>,\n   28 |     meta: Vec<Element>,\n   29 |     link: Vec<Element>,\n   30 |     script: Vec<Element>,\n   31 | }\n   32 | \n   33 | /// A Document provider that collects all contents injected into the head for SSR rendering.\n   34 | #[derive(Default)]\n   35 | pub struct ServerDocument(RefCell<ServerDocumentInner>);\n   36 | \n   37 | impl ServerDocument {\n   38 |     pub(crate) fn title(&self) -> Option<String> {\n   39 |         let myself = self.0.borrow();\n   40 |         myself.title.as_ref().map(|title| {\n   41 |             RENDERER\n   42 |                 .write()\n   43 |                 .render_element(rsx! { title { \"{title}\" } })\n   44 |         })\n   45 |     }\n   46 | \n   47 |     pub(crate) fn render(&self, to: &mut impl std::fmt::Write) -> std::fmt::Result {\n   48 |         let myself = self.0.borrow();\n   49 |         let element = rsx! {\n   50 |             {myself.meta.iter().map(|m| rsx! { {m} })}\n   51 |             {myself.link.iter().map(|l| rsx! { {l} })}\n   52 |             {myself.script.iter().map(|s| rsx! { {s} })}\n   53 |         };\n   54 | \n   55 |         RENDERER.write().render_element_to(to, element)?;\n   56 | \n   57 |         Ok(())\n   58 |     }","lines":42,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/document.rs#L17-L58"},{"ref":"packages/fullstack-server/src/ssr.rs:306","code":"  306 |             if let Err(err) = Self::render_head(&cfg, &mut pre_body, &virtual_dom) {","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/ssr.rs#L306"},{"ref":"packages/fullstack-server/src/ssr.rs:400","code":"  400 |                 if let Err(err) = Self::render_head(&cfg, &mut cached_render, &virtual_dom) {","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/ssr.rs#L400"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"When `invalidate_after` is set, `FileSystemCache::find_file` accumulates stale timestamped cache files on disk indefinitely instead of pruning them. On each call it iterates the directory entries and returns on the *first* still-valid (`elapsed < deadline`) entry it encounters (line 115); only entries visited *before* finding that valid one get deleted (lines 117-120). Directory iteration order from `std::fs::read_dir` is not guaranteed to be chronological, so once a fresh entry exists, older still-on-disk (but now stale) entries that happen to be enumerated after it are never reached and never removed - they just accumulate forever as long as a newer valid file exists in the same folder.\n\nBecause `route_as_path` (`fs_cache.rs:138-148`) creates a brand-new timestamped file on every `cache()`/`put()` call when `track_timestamps()` is true, this leads to unbounded growth of `.html` files per route directory over the lifetime of the server, and every subsequent `get()`/`find_file()` call becomes an O(n) scan over that ever-growing directory.","fix":"When scanning the directory, don't short-circuit on the first valid entry - collect all valid entries, keep the most recent, and delete every other entry (valid or stale) so the folder never holds more than one live cache file per route. For example, iterate all entries, delete anything with `elapsed >= deadline`, and among the remaining valid ones keep only the one with the largest timestamp, deleting the rest.","locations":[{"ref":"packages/fullstack-server/src/isrg/fs_cache.rs:103-136","code":"  103 |     fn find_file(&self, route: &str) -> Option<ValidCachedPath> {\n  104 |         let mut file_path = (self.map_path)(route);\n  105 |         if let Some(deadline) = self.invalidate_after {\n  106 |             // find the first file that matches the route and is a html file\n  107 |             file_path.push(\"index\");\n  108 |             if let Ok(dir) = std::fs::read_dir(file_path) {\n  109 |                 for entry in dir.flatten() {\n  110 |                     if let Some(cached_path) = ValidCachedPath::try_from_path(entry.path()) {\n  111 |                         if let Ok(elapsed) = cached_path.timestamp.elapsed()\n  112 |                             && elapsed < deadline\n  113 |                         {\n  114 |                             // The timestamp is valid, return the file\n  115 |                             return Some(cached_path);\n  116 |                         }\n  117 |                         // if the timestamp is invalid or passed, delete the file\n  118 |                         if let Err(err) = std::fs::remove_file(entry.path()) {\n  119 |                             tracing::error!(\"Failed to remove file: {}\", err);\n  120 |                         }\n  121 |                     }\n  122 |                 }\n  123 |                 None\n  124 |             } else {\n  125 |                 None\n  126 |             }\n  127 |         } else {\n  128 |             file_path.push(\"index.html\");\n  129 |             file_path.exists().then_some({\n  130 |                 ValidCachedPath {\n  131 |                     full_path: file_path,\n  132 |                     timestamp: SystemTime::now(),\n  133 |                 }\n  134 |             })\n  135 |         }\n  136 |     }","lines":34,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/isrg/fs_cache.rs#L103-L136"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`create_element_in_head` re-embeds the entire contents of `head.js` (via `include_str!`) into a freshly formatted JS string on every single call. Every `Meta`, `Script`, `Style`, and `Link` component mounted therefore ships a duplicate copy of the same helper function definition through `Document::eval` instead of defining it once. For pages with many head elements this means redundant string allocation and redundant bytes sent across the eval bridge (JS execution, IPC serialization for desktop, etc.) for no benefit.","fix":"Inject `createElementInHead` once during document/eval-channel initialization (or guard the definition with `if (!window.createElementInHead) { ... }` inside the generated script), and have `create_element_in_head` only emit the `window.createElementInHead(tag, attrs, children);` call on subsequent invocations.","locations":[{"ref":"packages/document/src/document.rs:36-49","code":"   36 | pub fn create_element_in_head(\n   37 |     tag: &str,\n   38 |     attributes: &[(&str, String)],\n   39 |     children: Option<String>,\n   40 | ) -> String {\n   41 |     let helpers = include_str!(\"./js/head.js\");\n   42 |     let attributes = format_attributes(attributes);\n   43 |     let children = children\n   44 |         .as_deref()\n   45 |         .map(format_string_for_js)\n   46 |         .unwrap_or(\"null\".to_string());\n   47 |     let tag = format_string_for_js(tag);\n   48 |     format!(r#\"{helpers};window.createElementInHead({tag}, {attributes}, {children});\"#)\n   49 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/document/src/document.rs#L36-L49"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"medium","description":"`SelfUpdate::nightly` (`update.rs:14`) is parsed from the `--nightly` CLI flag but is never read anywhere inside `self_update()` (or anywhere else in the crate). Running `dx self-update --nightly` behaves identically to `dx self-update` without the flag, silently ignoring the user's request to install a nightly build.","fix":"Either implement nightly-channel selection (e.g. query a separate nightly release feed/tag in `self_update()`), or remove the `nightly` field and flag until the feature is implemented so users aren't misled.","locations":[{"ref":"packages/cli/src/cli/update.rs:10-31","code":"   10 | #[derive(Clone, Debug, Parser)]\n   11 | pub(crate) struct SelfUpdate {\n   12 |     /// Use the latest nightly build.\n   13 |     #[clap(long, default_value = \"false\")]\n   14 |     pub nightly: bool,\n   15 | \n   16 |     /// Specify a version to install.\n   17 |     #[clap(long)]\n   18 |     pub version: Option<String>,\n   19 | \n   20 |     /// Install the update.\n   21 |     #[clap(long, default_value = \"true\", num_args = 0..=1)]\n   22 |     pub install: bool,\n   23 | \n   24 |     /// List available versions.\n   25 |     #[clap(long, default_value = \"false\")]\n   26 |     pub list: bool,\n   27 | \n   28 |     /// Force the update even if the current version is up to date.\n   29 |     #[clap(long, default_value = \"false\")]\n   30 |     pub force: bool,\n   31 | }","lines":22,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/cli/update.rs#L10-L31"},{"ref":"packages/cli/src/cli/update.rs:34-212","code":"   34 |     pub async fn self_update(self) -> Result<StructuredOutput> {\n   35 |         tokio::task::spawn_blocking(move || {\n   36 |             let start = std::time::Instant::now();\n   37 |             if self.list {\n   38 |                 let res = self_update::backends::github::Update::configure()\n   39 |                     .repo_owner(\"dioxuslabs\")\n   40 |                     .repo_name(\"dioxus\")\n   41 |                     .bin_name(\"dx\")\n   42 |                     .current_version(cargo_crate_version!())\n   43 | l content left over from an abandoned design.","fix":"Delete `packages/hooks/src/use_collection.rs` since it is unreferenced and non-functional, or if the `use_map`/`use_collection` hook is still desired, implement it and add `mod use_collection; pub use use_collection::*;` to `lib.rs`.","locations":[{"ref":"packages/hooks/src/use_collection.rs:1-76","code":"    1 | /*\n    2 | a form of use_signal explicitly for map-style collections (BTreeMap, HashMap, etc).\n    3 | \n    4 | Why?\n    5 | ---\n    6 | Traditionally, it's possible to use the \"use_state\" hook for collections in the React world.\n    7 | Adding a new entry would look something similar to:\n    8 | \n    9 | ```js\n   10 | let (map, set_map) = useState({});\n   11 | set_map({ ...map, [key]: value });\n   12 | ```\n   13 | The new value then causes the appropriate update when passed into children.\n   14 | \n   15 | This is moderately efficient because the fields of the map are moved, but the data itself is not cloned.\n   16 | However, if you used similar approach with Dioxus:\n   17 | \n   18 | ```rust\n   19 | let (map, set_map) = use_signal(|| HashMap::new());\n   20 | set_map({\n   21 |     let mut newmap = map.clone();\n   22 |     newmap.set(key, value);\n   23 |     newmap\n   24 | })\n   25 | ```\n   26 | Unfortunately, you'd be cloning the entire state every time a value is changed. The obvious solution is to\n   27 | wrap every element in the HashMap with an Rc. That way, cloning the HashMap is on par with its JS equivalent.\n   28 | \n   29 | Fortunately, we can make this operation even more efficient in Dioxus, leveraging the borrow rules of Rust.\n   30 | \n   31 | This hook provides a memoized collection, memoized setters, and memoized getters. This particular hook is\n   32 | extremely powerful for implementing lists and supporting core state management needs for small apps.\n   33 | \n   34 | If you need something even more powerful, check out the dedicated atomic state management Dioxus Dataflow, which\n   35 | uses the same memoization on top of the use_context API.\n   36 | \n   37 | Here's a fully-functional todo app using the use_map API:\n   38 | ```rust\n   39 | static TodoList: Component = |cx| {\n   40 |     let todos = use_map(|| HashMap::new());\n   41 |     let input = use_signal(|| None);\n   42 | \n   43 |     rsx! {\n   44 |         div {\n   45 |             button {\n   46 |                 \"Add todo\"\n   47 |                 onclick: move |_| {\n   48 |                     let new_todo = TodoItem::new(input.contents());\n   49 |                     todos.insert(new_todo.id.clone(), new_todo);\n   50 |                     input.clear();\n   51 |                 }\n   52 |             }\n   53 |             button {\n   54 |                 \"Clear todos\"\n   55 |                 onclick: move |_| todos.clear()\n   56 |             }\n   57 |             input {\n   58 |                 placeholder: \"What needs to be done?\"\n   59 |                 ref: input\n   60 |             }\n   61 |             ul {\n   62 |                 {todos.iter().map(|todo| rsx!(\n   63 |                     li {\n   64 |                         key: todo.id\n   65 |                         span { \"{todo.content}\" }\n   66 |                         button {\"x\", onclick: move |_| todos.remove(todo.key.clone())}\n   67 |                     }\n   68 |                 ))}\n   69 |             }\n   70 |         }\n   71 |     })\n   72 | }\n   73 | \n   74 | ```\n   75 | \n   76 | */","lines":76,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/hooks/src/use_collection.rs#L1-L76"}]},{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`App::handle_tray_menu_event` takes a `tray_icon::menu::MenuEvent` and immediately discards it with `_ = event;`, doing nothing. Since the general wry event dispatch (`app.tick` -> `WindowEventHandlers::apply_event`, called for every event before this match arm runs) is what actually delivers `TrayMenuEvent` to user code registered via `use_tray_menu_event_handler`, this handler is a no-op stub. It is harmless but reads as if it should do something (mirroring `handle_menu_event`, which does dispatch on well-known IDs) and offers no place to add default tray-menu item behavior without a reviewer noticing it currently does nothing.","fix":"Either remove the empty handler (and the `Event::UserEvent(UserWindowEvent::TrayMenuEvent(evnt)) => app.handle_tray_menu_event(evnt)` dispatch arm in `packages/desktop/src/launch.rs`) if no default behavior is planned, or add a short comment explaining that tray menu events are only consumed via `use_tray_menu_event_handler` and this hook is reserved for future built-in tray menu item IDs.","locations":[{"ref":"packages/desktop/src/app.rs:154-157","code":"  154 |     #[cfg(any(target_os = \"windows\", target_os = \"linux\", target_os = \"macos\"))]\n  155 |     pub fn handle_tray_menu_event(&mut self, event: tray_icon::menu::MenuEvent) {\n  156 |         _ = event;\n  157 |     }","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/app.rs#L154-L157"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"In `use_action`, the comment above the `reader` field construction states `We never set the value back to None, only modify the state of the action`, but the `Err` branch of the same `match result` block just above it (lines 106-110) explicitly calls `value.set(None)`. The code is currently safe only because `Action::value()` checks `self.error` and returns `Err(..)` before ever touching `self.reader`/`self.value` when an error occurred, but the comment's stated invariant is simply false. A future maintainer relying on this comment (e.g. when refactoring `value()` or exposing `reader` more directly) could easily introduce a panic, since `reader` is built as `value.boxed().map(|v| v.as_ref().unwrap())`, which will panic if ever read while the underlying `value` signal is `None`.","fix":"Correct the comment to reflect reality, e.g.: `value is reset to None on error; reader must only be handed out after confirming value.read().is_some() (see value() below), since it unwraps unconditionally.`","locations":[{"ref":"packages/hooks/src/use_action.rs:106-123","code":"  106 |                 Err(err) => {\n  107 |                     error.set(Some(err.into()));\n  108 |                     value.set(None);\n  109 |                     state.set(ActionState::Errored);\n  110 |                 }\n  111 |             }\n  112 | \n  113 |             tx.send(()).ok();\n  114 |         });\n  115 | \n  116 |         task.set(Some(new_task));\n  117 | \n  118 |         rx\n  119 |     });\n  120 | \n  121 |     // Create a reader that maps the Option<T> to T, unwrapping the Option\n  122 |     // This should only be handed out if we know the value is Some. We never set the value back to None, only modify the state of the action\n  123 |     let reader = use_hook(|| value.boxed().map(|v| v.as_ref().unwrap()).boxed());","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/hooks/src/use_action.rs#L106-L123"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The module doc comment for `fastfs.rs` claims: \"Methods for working with the filesystem that are faster than the std fs methods. Uses stuff like rayon, caching, and other optimizations.\" In reality `pre_compress_folder` just does a single-threaded `WalkDir` iteration with no `rayon`, no parallelism, and no caching of any kind - it is a plain sequential loop calling `pre_compress_file` for each entry.","fix":"Update the module doc to describe what the file actually does (sequential brotli pre-compression via `walkdir`), or actually parallelize the folder walk with `rayon` (e.g. `WalkDir::into_iter().par_bridge()`) to match the stated intent and improve performance on large asset folders.","locations":[{"ref":"packages/cli/src/fastfs.rs:1-4","code":"    1 | //! Methods for working with the filesystem that are faster than the std fs methods\n    2 | //! Uses stuff like rayon, caching, and other optimizations\n    3 | //!\n    4 | //! Allows configuration in case you want to do some work while copying and allows you to track progress","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/fastfs.rs#L1-L4"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment on `write_map` says \"We write 2 * len as the length of the map because each key-value pair is a separate entry\" but the code actually writes `len as u64` (the pair count), not `2 * len`. The `2x` multiplication only happens later, in the readers `take_map` and `item_length`, where `items_left = length * 2` is used to skip both key and value of each pair. The comment describing `write_map` itself is simply wrong and misleading about what that function does.","fix":"Correct the comment to describe what `write_map` actually does, e.g.:\n```rust\n/// Write the header and length of a map. The length written is the number of key-value pairs;\n/// readers (`take_map`, `item_length`) multiply it by 2 internally to account for keys and values.\n```","locations":[{"ref":"packages/const-serialize/src/cbor.rs:280-287","code":"  280 | /// Write the header and length of a map.\n  281 | pub(crate) const fn write_map<const MAX_SIZE: usize>(\n  282 |     vec: ConstVec<u8, MAX_SIZE>,\n  283 |     len: usize,\n  284 | ) -> ConstVec<u8, MAX_SIZE> {\n  285 |     // We write 2 * len as the length of the map because each key-value pair is a separate entry.\n  286 |     write_major_type_and_u64(vec, MajorType::Map, len as u64)\n  287 | }","lines":8,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/const-serialize/src/cbor.rs#L280-L287"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The panic message produced by `Runtime::current()` when there is no active runtime includes an example code snippet suggesting the user call `Runtime::current().expect(\"Components run in the Dioxus runtime\")`. But `Runtime::current()` returns `Rc<Runtime>` directly (it panics internally instead of returning an `Option`/`Result`), so `.expect(...)` would not compile against it - the example should use `Runtime::try_current()`, which is the actual fallible accessor defined a few lines below in the same file. The snippet is shown to users precisely in the situation this bug describes (no active runtime), so a user copying it verbatim gets a second, confusing compiler error instead of a fix.","fix":"Change the example in the panic message to use the fallible accessor:\n```text\nlet runtime = Runtime::try_current().expect(\"Components run in the Dioxus runtime\");\n```\ninstead of `Runtime::current().expect(...)`.","locations":[{"ref":"packages/core/src/runtime.rs:112-130","code":"  112 | ```rust\n  113 | use dioxus::prelude::*;\n  114 | static COUNT: GlobalSignal<i32> = Signal::global(|| 0);\n  115 | \n  116 | #[component]\n  117 | fn MyComponent() -> Element {{\n  118 |     use_effect(|| {{\n  119 |         // Grab the runtime from the MyComponent scope\n  120 |         let runtime = Runtime::current().expect(\\\"Components run in the Dioxus runtime\\\");\n  121 |         // Move the runtime into the web-sys closure scope\n  122 |         let web_sys_closure = Closure::new(|| {{\n  123 |             // Then create a guard to provide the runtime to the closure\n  124 |             let _guard = RuntimeGuard::new(runtime);\n  125 |             // and run whatever code needs the runtime\n  126 |             tracing::info!(\\\"The count is: {{COUNT}}\\\");\n  127 |         }});\n  128 |     }})\n  129 | }}\n  130 | ```\"","lines":19,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/runtime.rs#L112-L130"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `IncrementalRendererConfig::clear_cache` says `Clear the cache on startup (default: true)`, but `IncrementalRendererConfig::new()` actually initializes `clear_cache: false`. The documented default is the opposite of the real default, which could mislead users into thinking their ISR cache is being wiped on every restart when it is not (or vice versa).","fix":"```rust\n- /// Clear the cache on startup (default: true)\n+ /// Clear the cache on startup (default: false)\n  pub fn clear_cache(mut self, clear_cache: bool) -> Self {\n```\nOr, if `true` was the intended default, change `Self::new()` to set `clear_cache: true` instead. Pick whichever matches the intended behavior and make the two consistent.","locations":[{"ref":"packages/fullstack-server/src/isrg/config.rs:36-45","code":"   36 |         Self {\n   37 |             static_dir: PathBuf::from(\"./static\"),\n   38 |             memory_cache_limit: 10000,\n   39 |             invalidate_after: None,\n   40 |             clear_cache: false,\n   41 |             pre_render: false,\n   42 |             #[cfg(not(target_arch = \"wasm32\"))]\n   43 |             map_path: None,\n   44 |         }\n   45 |     }","lines":10,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/isrg/config.rs#L36-L45"},{"ref":"packages/fullstack-server/src/isrg/config.rs:47-51","code":"   47 |     /// Clear the cache on startup (default: true)\n   48 |     pub fn clear_c chestration: resolve the project name, run `check_connectivity`, call `resolve_template_and_branch`, `create_dir_all` the destination, build an almost-identical `GenerateArgs` (only `verbose` and `destination` handling differ slightly), call `cargo_generate::generate`, then call `post_create`. Any future fix to this flow (e.g. the `is_workspace`/git-init bug noted separately, or error handling around `cargo_generate::generate`) has to be applied in two places and is easy to forget for the other one.","fix":"Extract a shared helper, e.g. `pub(crate) async fn generate_project(path: PathBuf, name: Option<String>, template: Option<String>, branch: Option<String>, revision: Option<String>, tag: Option<String>, subtemplate: Option<String>, option: Vec<String>, yes: bool, vcs: Option<Vcs>, verbose: bool) -> Result<PathBuf>` that both `Create::create` and `Init::init` call, keeping only their CLI-specific differences (e.g. `Create` requires an explicit path and does the pre-existence `check_path` check, `Init` defaults to `.`) in the two thin wrappers.","locations":[{"ref":"packages/cli/src/cli/create.rs:57-111","code":"   57 | impl Create {\n   58 |     pub async fn create(mut self) -> Result<StructuredOutput> {\n   59 |         // Project name defaults to directory name.\n   60 |         if self.name.is_none() {\n   61 |             self.name = Some(create::name_from_path(&self.path)?);\n   62 |         }\n   63 | \n   64 |         check_path(&self.path).await?;\n   65 | \n   66 |         // Perform a connectivity check so we just don't it around doing nothing if there's a network error\n   67 |         if self.template.is_none() {\n   68 |             check_connectivity().await?;\n   69 |         }\n   70 | \n   71 |         // If no template is specified, use the default one and set the branch to the latest release.\n   72 |         resolve_template_and_branch(&mut self.template, &mut self.branch);\n   73 | \n   74 |         // cargo-generate requires the path to be cre |     fn into_value(self) -> AttributeValue {\n 1183 |         AttributeValue::Int(self as _)\n 1184 |     }\n 1185 | }\n 1186 | impl IntoAttributeValue for u128 {\n 1187 |     fn into_value(self) -> AttributeValue {\n 1188 |         AttributeValue::Int(self as _)\n 1189 |     }\n 1190 | }\n 1191 | ","lines":62,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/nodes.rs#L1130-L1191"}]},{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"high","difficulty":"hard","description":"Most of the new unified per-platform manifest schema in `manifest.rs` is parsed from `Dioxus.toml` but never actually consumed by the build/bundle pipeline. `WindowsConfig` (the whole `[windows]` section: `wix`, `nsis`, `icon_path`, `webview_install_mode`, `allow_downgrades`, `sign_command`, `capabilities`, etc, `manifest.rs:1039-1135`) and `LinuxConfig` (the whole `[linux]` section: `deb`, `flatpak_permissions`, `dbus_access`, `categories`, `keywords`, `mime_types`, `manifest.rs:1309-1377`) have zero readers anywhere in `packages/cli/src` outside of `manifest.rs`/`config/mod.rs` themselves. Likewise `AndroidConfig.signing` (`manifest.rs:589-590`, backed by `AndroidSigningConfig` at `manifest.rs:667-680`) is documented as replacing the deprecated `[bundle.android]` section (see the doc comment at `manifest.rs:533-534`, `\"This replaces the deprecated [bundle.android] section\"`), but the actual Android build code in `packages/cli/src/build/android.rs:183` still reads `self.config.bundle.android` (the legacy `AndroidSettings` from `bundle.rs:344-351`) and feeds it into the `build.gradle.kts.hbs` template (`packages/cli/assets/android/gen/app/build.gradle.kts.hbs:19-25`) - `android.signing` (jks_file/jks_password/key_alias/key_password) is never read. Similarly `bundler/mod.rs:100` and `bundler/mod.rs:425` only read `build.config.bundle.windows`/`.macos`/`.deb` (the legacy `bundle.rs` structs), not the new `WindowsConfig`/`MacosConfig`/`LinuxConfig`. Even `MacosConfig` itself is mostly dead: only `.plist`, `.raw.info_plist`, `.entitlements`, and `.raw.entitlements` are read (`packages/cli/src/build/apple.rs:216-217,495,594`); fields like `signing_identity`, `bundle_version`, `bundle_name`, `provider_short_name`, `hardened_runtime`, `frameworks`, `minimum_system_version`, `info_plist`, `category`, `document_types` etc are parsed but never consulted. A user who configures signing, WiX/NSIS installer options, or Linux packaging using the documented new schema will have that configuration silently ignored, while the legacy/deprecated `[bundle.*]` sections keep controlling the actual build - this is a functional correctness and security-relevant footgun (e.g. an Android release could ship without the intended signing config, with no error or warning).","fix":"Either wire `AndroidConfig.signing`, `WindowsConfig`, `LinuxConfig`, and the unused `MacosConfig` fields into the actual build/bundle pipeline (replacing the reads of `config.bundle.android/windows/macos/deb`), or remove/deprecate the unused fields and update the doc comments so they don't claim functionality that doesn't exist. At minimum, add a startup validation that warns when a user sets `[android.signing]`, `[windows.wix]`, `[windows.nsis]`, `[linux.deb]`, etc. so the config isn't silently a no-op.","locations":[{"ref":"packages/cli/src/config/manifest.rs:589-590","code":"  589 |     #[serde(default)]\n  590 |     pub signing: Option<AndroidSigningConfig>,","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/config/manifest.rs#L589-L590"},{"ref":"packages/cli/src/config/manifest.rs:667-680","code":"  667 | #[derive(Debug, Clone, Serialize, Deserialize, JsonSchema)]\n  668 | pub struct AndroidSigningConfig {\n  669 |     /// Path to the Java keystore file.\n  670 |     pub jks_file: PathBuf,\n  671 | \n  672 |     /// Password for the keystore.\n  673 |   88 |     // [`AppServer::analyze_cargo_toml_change`] / [`AppServer::analyze_dioxus_toml_change`].\n   89 |     pub(crate) cargo_toml_snapshots: HashMap<PathBuf, toml::Value>,\n   90 |     pub(crate) dioxus_toml_snapshots: HashMap<PathBuf, toml::Value>,\n   91 | \n   92 |     // The original target args used to construct the initial `BuildRequest`s, kept so we can\n   93 |     // re-derive fresh requests when a config edit invalidates the cached state.\n   94 |     pub(crate) target_args: CommandWithPlatformOverrides<crate::BuildArgs>,\n   95 | }\n   96 | \n   97 | pub(crate) struct CachedFile {\n   98 |     contents: String,\n   99 |     most_recent: Option<String>,\n  100 |     templates: HashMap<TemplateGlobalKey, HotReloadedTemplate>,\n  101 | }\n  102 | \n  103 | #[derive(PartialEq, Clone, Debug, Copy)]\n  104 | pub(crate) enum HotReloadMode {\n  105 |     Hotpatch,\n  106 |     RsxOnly,\n  107 |     Disabled,\n  108 | }\n  109 | \n  110 | impl AppServer {\n  111 |     /// Create the AppRunner and then initialize the filemap with the crate directory.\n  112 |     pub(crate) async fn new(args: ServeArgs) -> Result<Self> {\n  113 |         let workspace = Workspace::current().await?;\n  114 | \n  115 |         // Resolve the simpler args\n  116 |         let interactive = args.is_interactive_tty();\n  117 |         let force_sequential = args.platform_args.shared.targets.force_sequential_build();\n  118 |         let cross_origin_policy = args.cross_origin_policy;\n  119 | \n  120 |         // Find the launch args for the client and server\n  121 |         let split_args = |args: &str| {\n  122 |             args.split_whitespace()\n  123 |                 .map(|s| s.to_string())\n  124 |                 .collect::<Vec<_>>()\n  125 |         };\n  126 | \n  127 |         let server_args = args.platform_args.with_server_or_shared(|c| &c.args);\n  128 |         let server_args = split_args(server_args);\n  129 |         let client_args = args.platform_args.with_client_or_shared(|c| &c.args);\n  130 |         let client_args = split_args(client_args);\n  131 | \n  132 |         // These come from the args but also might come from the workspace settings\n  133 |         // We opt to use the manually specified args over the workspace settings\n  134 |         let open_browser = args\n  135 |             .open\n  136 |             .unwrap_or_else(|| workspace.settings.always_open_browser.unwrap_or(false))\n  137 |             && interactive;\n  138 | \n  139 |         let wsl_file_poll_interval = args\n  140 |             .wsl_file_poll_interval\n  141 |             .unwrap_or_else(|| workspace.settings.wsl_file_poll_interval.unwrap_or(2));\n  142 | \n  143 |         let always_on_top = args\n  144 |             .always_on_top\n  145 |             .unwrap_or_else(|| workspace.settings.always_on_top.unwrap_or(true));\n  146 | \n  147 |         // Use 127.0.0.1 as the default address if none is specified.\n  148 |         // If the user wants to export on the network, they can use `0.0.0.0` instead.\n  149 |         let devserver_bind_ip = args.address.addr.unwrap_or(WebServer::SELF_IP);\n  150 | \n  151 |         // If the user specified a port, use that, otherwise use any available port, preferring 8080\n  152 |         let devserver_port = args\n  153 |             .address\n  154 |             .port\n  155 |             .unwrap_or_else(|| get_available_port(devserver_bind_ip, Some(8080)).unwrap_or(8080));\n  156 | \n  157 |         // Spin up the file watcher\n  158 |         let (watcher_tx, watcher_rx) = futures_channel::mpsc::unbounded();\n  159 |         let watcher = create_notify_watcher(watcher_tx.clone(), wsl_file_poll_interval as u64);\n  160 | \n  161 |         let ssg = args.platform_args.shared.targets.ssg;\n  162 |         let target_args = CommandWithPlatformOverrides {\n  163 |             shared: args.platform_args.shared.targets,\n  164 |             server: args.platform_args.server.map(|s| s.targets),\n  165 |             client: args.platform_args.client.map(|c| c.targets),\n  166 |         };\n  167 |         // Hold on to the original target args so we can re-derive `BuildRequest`s when a\n  168 |         // Cargo.toml / Dioxus.toml edit invalidates feature resolution, profile flags, or any\n  169 |         // other field cooked into a `BuildRequest` at startup. See `recreate_build_requests`.\n  170 |         let stored_target_args = target_args.clone();\n  171 |         let BuildTargets { client, server } = target_args.into_targets().await?;\n  172 | \n  173 |         // All servers will end up behind us (the devserver) but on a different port\n  174 |         // This is so we can serve a loading screen as well as devtools without anything particularly fancy\n  175 |         let fullstack = server.is_some();\n  176 |         let should_proxy_port = match client.bundle {\n  177 |             BundleFormat::Server => true,\n  178 |             _ => fullstack && !ssg,\n  179 |         };\n  180 | \n  181 |         let proxied_port = should_proxy_port\n  182 |             .then(|| get_available_port(devserver_bind_ip, None))\n  183 |             .flatten();\n  184 | \n  185 |         let watch_fs = args.watch.unwrap_or(true);\n  186 |         let hotreload_mode = if args.hot_patch.unwrap_or(true) {\n  187 |             HotReloadMode::Hotpatch\n  188 |         } else {\n  189 |             HotReloadMode::RsxOnly\n  190 |         };\n  191 | \n  192 |         let client = AppBuilder::new(&client)?;\n  193 |         let server = server.map(|server| AppBuilder::new(&server)).transpose()?;\n  194 | \n  195 |         let tw_watcher = TailwindCli::serve(\n  196 |             client.build.package_manifest_dir(),\n  197 |             client.build.config.application.tailwind_input.clone(),\n  198 |             client.build.config.application.tailwind_output.clone(),\n  199 |         );\n  200 | \n  201 |         _ = client.build.start_simulators().await;\n  202 | \n  203 |         // Encourage the user to update to a new dx version\n  204 |         crate::update::log_if_cli_could_update();\n  205 | \n  206 |         // Create the runner\n  207 |         let mut runner = Self {\n  208 |             file_map: Default::default(),\n  209 |             applied_client_hot_reload_message: Default::default(),\n  210 |             watch_fs,\n  211 |             hotreload_mode,\n  212 |             client,\n  213 |             server,\n  214 |             open_browser,\n  215 |             _wsl_file_poll_interval: wsl_file_poll_interval,\n  216 |             always_on_top,\n  217 |             workspace,\n  218 |             devserver_port,\n  219 |             devserver_bind_ip,\n  220 |             proxied_port,\n  221 |             watcher,\n  222 |             watcher_rx,\n  223 |             _watcher_tx: watcher_tx,\n  224 |             interactive,\n  225 |             _force_sequential: force_sequential,\n  226 |             cross_origin_policy,\n  227 |             fullstack,\n  228 |             ssg,\n  229 |             tw_watcher,\n  230 |             server_args,\n  231 |             client_args,\n  232 |             pending_file_changes: Vec::new(),\n  233 |             cargo_toml_snapshots: HashMap::new(),\n  234 |             dioxus_toml_snapshots: HashMap::new(),\n  235 |             target_args: stored_target_args,\n  236 |         };\n  237 | \n  238 |         // Only register the hot-reload stuff if we're watching the filesystem\n  239 |         if runner.watch_fs {\n  240 |             // Spin up the notify watcher\n  241 |             // When builds load though, we're going to parse their depinfo and add the paths to the watcher\n  242 |             runner.watch_filesystem();\n  243 | \n  244 |             // todo(jon): this might take a while so we should try and background it, or make it lazy somehow\n  245 |             // we could spawn a thread to search the FS and then when it returns we can fill the filemap\n  246 |             // in testing, if this hits a massive directory, it might take several seconds with no feedback.\n  247 |             // really, we should be using depinfo to get the files that are actually used, but the depinfo file might not be around yet\n  248 |             // todo(jon): see if we can just guess the depinfo file before it generates. might be stale but at least it catches most of the files\n  249 |             runner.load_rsx_filemap();\n  250 |         }\n  251 | \n  252 |         // Seed snapshots of every Cargo.toml + Dioxus.toml in the workspace so subsequent\n  253 |         // edits diff against the on-disk state at startup, not against an empty table.\n  254 |         runner.seed_config_snapshots();\n  255 | \n  256 |         Ok(runner)\n  257 |     }\n  258 | \n  259 |     pub(crate) fn initialize(&mut self) {\n  260 |         let build_mode = self.initial_build_mode();\n  261 | \n  262 |         self.client.start(build_mode.clone(), BuildId::PRIMARY);\n  263 |         if let Some(server) = self.server.as_mut() {\n  264 |             server.start(build_mode, BuildId::SECONDARY);\n  265 |         }\n  266 |     }\n  267 | \n  268 |     /// The `BuildMode` that fresh/full rebuilds should start with under the current hotreload mode.\n  269 |     ///\n  270 |     /// Only `Hotpatch` needs the `Fat` build to prime the hotpatch engine; every other mode uses a\n  271 |     /// plain `Base` build.\n  272 |     fn initial_build_mode(&self) -> BuildMode {\n  273 |         match self.hotreload_mode {\n  274 |             HotReloadMode::Hotpatch => BuildMode::Fat,\n  275 |             HotReloadMode::RsxOnly | HotReloadMode::Disabled => BuildMode::Base,\n  276 |         }\n  277 |     }\n  278 | \n  279 |     /// Take any pending file changes that were queued while a build was in progress.\n  280 |     /// Returns the files and clears the pending list.\n  281 |     pub(crate) fn take_pending_file_changes(&mut self) -> Vec<PathBuf> {\n  282 |         std::mem::take(&mut self.pending_file_changes)\n  283 |     }\n  284 | \n  285 |     pub(crate) async fn rebuild_ssg(&mut self, devserver: &WebServer) {\n  286 |         if self.client.stage != BuildStage::Success {\n  287 |             return;\n  288 |         }\n  289 |         // Run SSG and cache static routes if the server build is done\n  290 |         if let Some(server) = self.server.as_mut() {\n  291 |             if !self.ssg || server.stage != BuildStage::Success {\n  292 |                 return;\n  293 |             }\n  294 |             if let Err(err) = server\n  295 |                 .pre_render_static_routes(\n  296 |                     Some(devserver.devserver_address()),\n  297 |                     Some(&server.tx.clone()),\n  298 |                 )\n  299 |                 .await\n  300 |             {\n  301 |                 tracing::error!(\"Failed to pre-render static routes: {err}\");\n  302 |             }\n  303 |         }\n  304 |     }\n  305 | \n  306 |     pub(crate) async fn wait(&mut self) -> ServeUpdate {\n  307 |         let client = &mut self.client;\n  308 |         let server = self.server.as_mut();\n  309 | \n  310 |         let client_wait = client.wait();\n  311 |         let server_wait = OptionFuture::from(server.map(|s| s.wait()));\n  312 |         let watcher_wait = self.watcher_rx.next();\n  313 | \n  314 |         tokio::select! {\n  315 |             // Wait for the client to finish\n  316 |             client_update = client_wait => {\n  317 |                 ServeUpdate::BuilderUpdate {\n  318 |                     id: BuildId::PRIMARY,\n  319 |                     update: client_update,\n  320 |                 }\n  321 |             }\n  322 | \n  323 |             Some(server_update) = server_wait => {\n  324 |                 ServeUpdate::BuilderUpdate {\n  325 |                     id: BuildId::SECONDARY,\n  326 |                     update: server_update,\n  327 |                 }\n  328 |             }\n  329 | \n  330 |             // Wait for the watcher to send us an event\n  331 |             event = watcher_wait => {\n  332 |                 let mut changes: Vec<_> = event.into_iter().collect();\n  333 | \n  334 |                 // Dequeue in bulk if we can, we might've received a lot of events in one go\n  335 |                 while let Ok(event) = self.watcher_rx.try_recv() {\n  336 |                     changes.push(event);\n  337 |                 }\n  338 | \n  339 |                 // Filter the changes\n  340 |                 let mut files: Vec<PathBuf> = vec![];\n  341 | \n  342 |                 // Decompose the events into a list of all the files that have changed\n  343 |                 for event in changes.drain(..) {\n  344 |                     // Make sure we add new folders to the watch list, provided they're not matched by the ignore list\n  345 |                     // We'll only watch new folders that are found under the crate, and then update our watcher to watch them\n  346 |                     // This unfortunately won't pick up new krates added \"at a distance\" - IE krates not within the workspace.\n  347 |                     if let EventKind::Create(_create_kind) = event.kind {\n  348 |                         // If it's a new folder, watch it\n  349 |                         // If it's a new cargo.toml (ie dep on the fly),\n  350 |                         // todo(jon) support new folders on the fly\n  351 |                     }\n  352 | \n  353 |                     for path in event.paths {\n  354 |                         // Workaround for notify and vscode-like editor:\n  355 |                         // - when edit & save a file in vscode, there will be two notifications,\n  356 |                         // - the first one is a file with empty content.\n  357 |                         // - filter the empty file notification to avoid false rebuild during hot-reload\n  358 |                         if let Ok(metadata) = std::fs::metadata(&path) {\n  359 |                             if metadata.len() == 0 {\n  360 |                                 continue;\n  361 |                             }\n  362 |                         }\n  363 | \n  364 |                         files.push(path);\n  365 |                     }\n  366 |                 }\n  367 | \n  368 |                 ServeUpdate::FilesChanged { files }\n  369 |             }\n  370 | \n  371 |         }\n  372 |     }\n  373 | \n  374 |     /// Handle an update from the builder\n  375 |     pub(crate) async fn new_build_update(&mut self, update: &BuilderUpdate, devserver: &WebServer) {\n  376 |         if let BuilderUpdate::BuildReady { .. } = update {\n  377 |             // If the build is ready, we need to check if we need to pre-render with ssg\n  378 |             self.rebuild_ssg(devserver).await;\n  379 |         }\n  380 |     }\n  381 | \n  382 |     /// Handle the list of changed files from the file watcher, attempting to aggressively prevent\n  383 |     /// full rebuilds by hot-reloading RSX and hot-patching Rust code.\n  384 |     ///\n  385 |     /// This will also handle any assets that are linked in the files, and copy them to the bundle\n  386 |     /// and send them to the client.\n  387 |     pub(crate) async fn handle_file_change(&mut self, files: &[PathBuf], server: &mut WebServer) {\n  388 |         // We can attempt to hotpatch if the build is in a bad state, since this patch might be a recovery.\n  389 |         if !matches!(\n  390 |             self.client.stage,\n  391 |             BuildStage::Failed | BuildStage::Aborted | BuildStage::Success\n  392 |         ) {\n  393 |             // Queue file changes that arrive during a build, so we can process them after the build completes.\n  394 |             // This prevents losing changes from tools like stylance, tailwind, or sass that generate files\n  395 |             // in response to source changes.\n  396 |             tracing::debug!(\n  397 |                 \"Queueing file change - client is not ready to receive hotreloads. Files: {:?}\",\n  398 |                 files\n  399 |             );\n  400 |             self.pending_file_changes.extend(files.iter().cloned());\n  401 |             return;\n  402 |         }\n  403 | \n  404 |         // If we have any changes to the rust files, we need to update the file map\n  405 |         let mut templates = vec![];\n  406 | \n  407 |         // Prepare the hotreload message we need to send\n  408 |         let mut assets = Vec::new();\n  409 |         let mut needs_rust_rebuild = false;\n  410 | \n  411 |         // Cargo.toml / Dioxus.toml edits change the dependency graph or build inputs in ways\n  412 |         // hotpatch can't reason about — force a from-scratch rebuild instead of `patch_rebuild`\n  413 |         // when this is true.\n  414 |         let mut needs_deep_rebuild = false;\n  415 | \n  416 |         // We attempt to hotreload rsx blocks without a full rebuild\n  417 |         for path in files {\n  418 |             // for various assets that might be linked in, we just try to hotreloading them forcefully\n  419 |             // That is, unless they appear in an include! macro, in which case we need to a full rebuild....\n  420 |             let ext = path\n  421 |                 .extension()\n  422 |                 .and_then(|v| v.to_str())\n  423 |                 .unwrap_or_default();\n  424 | \n  425 |             // Cargo.toml / Dioxus.toml — field-aware classification decides between full\n  426 |             // rebuild, \"restart required\" warning, and ignore-as-cosmetic. See\n  427 |             // [`AppServer::analyze_cargo_toml_change`] / [`AppServer::analyze_dioxus_toml_change`].\n  428 |             let filename = path\n  429 |                 .file_name()\n  430 |                 .and_then(|v| v.to_str())\n  431 |                 .unwrap_or_default();\n  432 |             match filename {\n  433 |                 \"Cargo.toml\" =>
