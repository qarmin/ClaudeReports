continue;\n  472 |                 };\n  473 | \n  474 |                 // Get the cached file if it exists - ignoring if it doesn't exist\n  475 |                 let Some(cached_file) = self.file_map.get_mut(path) else {\n  476 |                     tracing::debug!(\"No entry for file in filemap: {:?}\", path);\n  477 |                     continue;\n  478 |                 };\n  479 | \n  480 |                 let Ok(local_path) = path.strip_prefix(self.workspace.workspace_root()) else {\n  481 |                     tracing::debug!(\"Skipping file outside workspace dir: {:?}\", path);\n  482 |                     continue;\n  483 |                 };\n  484 | \n  485 |                 // We assume we can parse the old file and the new file, ignoring untracked rust files\n  486 |                 let old_syn = syn::parse_file(&cached_file.contents);\n  487 |                 let new_syn = syn::parse_file(&new_contents);\n  488 |                 let (Ok(old_file), Ok(new_file)) = (old_syn, new_syn) else {\n  489 |                     tracing::debug!(\"Diff rsx returned not parseable\");\n  490 |                     continue;\n  491 |                 };\n  492 | \n  493 |                 // Update the most recent version of the file, so when we force a rebuild, we keep operating on the most recent version\n  494 |                 cached_file.most_recent = Some(new_contents);\n  495 | \n  496 |                 // This assumes the two files are structured similarly. If they're not, we can't diff them\n  497 |                 let Some(changed_rsx) = dioxus_rsx_hotreload::diff_rsx(&new_file, &old_file) else {\n  498 |                     needs_rust_rebuild = true;\n  499 |                     break;\n  500 |                 };\n  501 | \n  502 |                 for ChangedRsx { old, new } in changed_rsx {\n  503 |                     let old_start = old.span().start();\n  504 | \n  505 |                     let old_parsed = syn::parse2::<CallBody>(old.tokens);\n  506 |                     let new_parsed = syn::parse2::<CallBody>(new.tokens);\n  507 |                     let (Ok(old_call_body), Ok(new_call_body)) = (old_parsed, new_parsed) else {\n  508 |                         continue;\n  509 |                     };\n  510 | \n  511 |                     // Format the template location, normalizing the path\n  512 |                     let file_name: String = local_path\n  513 |                         .components()\n  514 |                         .map(|c| c.as_os_str().to_string_lossy())\n  515 |                         .collect::<Vec<_>>()\n  516 |                         .join(\"/\");\n  517 | \n  518 |                     // Returns a list of templates that are hotreloadable\n  519 |                     let results = HotReloadResult::new::<HtmlCtx>(\n  520 |                         &old_call_body.body,\n  521 |                         &new_call_body.body,\n  522 |                         file_name.clone(),\n  523 |                     );\n  524 | \n  525 |                     // If no result is returned, we can't hotreload this file and need to keep the old file\n  526 |                     let Some(results) = results else {\n  527 |                         needs_rust_rebuild = true;\n  528 |                         break;\n  529 |                     };\n  530 | \n  531 |                     // Only send down templates that have roots, and ideally ones that have changed\n  532 |                     // todo(jon): maybe cache these and don't send them down if they're the same\n  533 |                     for (index, template) in results.templates {\n  534 |                         if template.roots.is_empty() {\n  535 |                             continue;\n  536 |                         }\n  537 | \n  538 |                         // Create the key we're going to use to identify this template\n  539 |                         let key = TemplateGlobalKey {\n  540 |                             file: file_name.clone(),\n  541 |                             line: old_start.line,\n  542 |                             column: old_start.column + 1,\n  543 |                             index,\n  544 |                         };\n  545 | \n  546 |                         // if the template is the same, don't send its\n  547 |                         if cached_file.templates.get(&key) == Some(&template) {\n  548 |                             continue;\n  549 |                         };\n  550 | \n  551 |                         cached_file.templates.insert(key.clone(), template.clone());\n  552 |                         templates.push(HotReloadTemplateWithLocation { template, key });\n  553 |                     }\n  554 |                 }\n  555 |             }\n  556 | \n  557 |             // If it's not a rust file, then it might be depended on via include! or similar\n  558 |             if ext != \"rs\" {\n  559 |                 if let Some(artifacts) = self.client.artifacts.as_ref() {\n  560 |                     // Check if the path is directly in depinfo\n  561 |                     if artifacts.depinfo.files.contains(path) {\n  562 |                         needs_rust_rebuild = true;\n  563 |                         break;\n  564 |                     }\n  565 |                     // Also check if the path is under a directory that's in depinfo\n  566 |                     // (for directories added via cargo:rerun-if-changed=dir)\n  567 |                     for dep_path in &artifacts.depinfo.files {\n  568 |                         if dep_path.is_dir() && path.starts_with(dep_path) {\n  569 |                             needs_rust_rebuild = true;\n  570 |                             break;\n  571 |                         }\n  572 |                     }\n  573 |                     if needs_rust_rebuild {\n  574 |                         break;\n  575 |                     }\n  576 |                 }\n  577 |             }\n  578 |         }\n  579 | \n  580 |         // If the client is in a failed state, any changes to rsx should trigger a rebuild/hotpatch\n  581 |         if self.client.stage == BuildStage::Failed && !templates.is_empty() {\n  582 |             needs_rust_rebuild = true\n  583 |         }\n  584 | \n  585 |         // todo - we need to distinguish between hotpatchable rebuilds and true full rebuilds.\n  586 |         //        A full rebuild is required when the user modifies static initializers which we haven't wired up yet.\n  587 |         if needs_rust_rebuild {\n  588 |             // Cargo.toml / Dioxus.toml edits invalidate the cached `BuildRequest`. Refresh\n  589 |             // `cargo metadata` and re-derive the build requests before kicking off the\n  590 |             // rebuild, otherwise cargo would re-read Cargo.toml but dx-side state (features,\n  591 |             // profile, target dirs, DioxusConfig) would stay frozen at startup. If\n  592 |             // recreation fails (e.g. mid-edit broken Cargo.toml), keep the existing requests\n  593 |             // and skip the rebuild — same \"user is mid-edit, will fix\" behavior we use for\n  594 |             // parse failures in `analyze_*_change`.\n  595 |             if needs_deep_rebuild {\n  596 |                 if let Err(err) = self.recreate_build_requests().await {\n  597 |                     tracing::warn!(\n  598 |                         dx_src = ?TraceSrc::Dev,\n  599 |                         \"Skipping rebuild: failed to refresh cargo metadata: {err}\"\n  600 |                     );\n  601 |                     return;\n  602 |                 }\n  603 |             }\n  604 | \n  605 |             match self.hotreload_mode {\n  606 |                 // In hotpatch, we can only issue patches if the original build completed.\n  607 |                 // `force_full_rebuild` is set when a Cargo.toml / Dioxus.toml change rewires the\n  608 |                 // dependency graph or build inputs — patch_rebuild can't handle that, so we go\n  609 |                 // through the fat-rebuild path even when patches are otherwise available.\n  610 |                 HotReloadMode::Hotpatch\n  611 |                     if needs_deep_rebuild || !self.has_hotpatchable_builds() =>\n  612 |                 {\n  613 |                     self.client.start_rebuild(BuildMode::Fat, BuildId::PRIMARY);\n  614 |                     if let Some(server) = self.server.as_mut() {\n  615 |                         server.start_rebuild(BuildMode::Fat, BuildId::SECONDARY);\n  616 |                     }\n  617 |                     self.clear_hot_reload_changes();\n  618 |                     self.clear_cached_rsx();\n  619 |                     if needs_deep_rebuild {\n  620 |                         self.clear_patches();\n  621 |                     }\n  622 |                     server.send_reload_start().await;\n  623 |                 }\n  624 | \n  625 |                 // Otherwise hotpatches go through patching system\n  626 |                 HotReloadMode::Hotpatch => {\n  627 |                     let changed_crates = self.order_changed_crates(files);\n  628 | \n  629 |                     self.client.patch_rebuild(\n  630 |                         files.to_vec(),\n  631 |                         changed_crates.clone(),\n  632 |                         BuildId::PRIMARY,\n  633 |                     );\n  634 | \n  635 |                     if let Some(server) = self.server.as_mut() {\n  636 |                         server.patch_rebuild(files.to_vec(), changed_crates, BuildId::SECONDARY);\n  637 |                     }\n  638 |                     self.clear_hot_reload_changes();\n  639 |                     self.clear_cached_rsx();\n  640 |                     server.send_patch_start().await;\n  641 |                 }\n  642 | \n  643 |                 // Full rust rebuilds with rsx are full builds\n  644 |                 HotReloadMode::RsxOnly => {\n  645 |                     self.client.start_rebuild(BuildMode::Base, BuildId::PRIMARY);\n  646 |                     if let Some(server) = self.server.as_mut() {\n  647 |                         server.start_rebuild(BuildMode::Base, BuildId::SECONDARY);\n  648 |                     }\n  649 |                     self.clear_hot_reload_changes();\n  650 |                     self.clear_cached_rsx();\n  651 |                     server.send_reload_start().await;\n  652 |                 }\n  653 | \n  654 |                 // `Disabled` is filtered out before reaching `handle_file_change`, so the only way\n  655 |                 // we land here is if the user cycled to `Disabled` mid-handler. Treat it as a\n  656 |                 // no-op with a visible warning so the edit isn't silently dropped.\n  657 |                 HotReloadMode::Disabled => {}\n  658 |             }\n  659 |         } else {\n  660 |             let msg = HotReloadMsg {\n  661 |                 templates,\n  662 |                 assets,\n  663 |                 ms_elapsed: 0,\n  664 |                 jump_table: Default::default(),\n  665 |                 for_build_id: None,\n  666 |                 for_pid: None,\n  667 |             };\n  668 | \n  669 |             self.add_hot_reload_message(&msg);\n  670 | \n  671 |             let file = files[0].display().to_string();\n  672 |             let workspace_dir = self.client.build.workspace_dir().display().to_string();\n  673 |             let file = file\n  674 |                 .trim_start_matches(&workspace_dir)\n  675 |                 .trim_start_matches('/');\n  676 | \n  677 |             // Only send a hotreload message for templates and assets - otherwise we'll just get a full rebuild\n  678 |             //\n  679 |             // todo: move the android file uploading out of hotreload_bundled_asset and\n  680 |             //\n  681 |             // Also make sure the builder isn't busy since that might cause issues with hotreloads\n  682 |             // https://github.com/DioxusLabs/dioxus/issues/3361\n  683 |             if !msg.is_empty() && self.client.can_receive_hotreloads() {\n  684 |                 use crate::styles::NOTE_STYLE;\n  685 |                 tracing::info!(dx_src = ?TraceSrc::Dev, \"Hotreloading: {NOTE_STYLE}{}{NOTE_STYLE:#}\", file);\n  686 | \n  687 |                 if !server.has_hotreload_sockets() && self.client.build.bundle != BundleFormat::Web\n  688 |                 {\n  689 |                     tracing::warn!(\"No clients to hotreload - try reloading the app!\");\n  690 |                 }\n  691 | \n  692 |                 server.send_hotreload(msg).await;\n  693 |             } else {\n  694 |                 tracing::debug!(dx_src = ?TraceSrc::Dev, \"Ignoring file change: {}\", file);\n  695 |             }\n  696 |         }\n  697 |     }\n  698 | \n  699 |     /// Finally \"bundle\" this app and return a handle to it\n  700 |     pub(crate) async fn open(\n  701 |         &mut self,\n  702 |         artifacts: &BuildArtifacts,\n  703 |         devserver: &mut WebServer,\n  704 |     ) -> Result<()> {\n  705 |         // Make sure to save artifacts regardless of if we're opening the app or not\n  706 |         match artifacts.build_id {\n  707 |             BuildId::PRIMARY => self.client.artifacts = Some(artifacts.clone()),\n  708 |             BuildId::SECONDARY => {\n  709 |                 if let Some(server) = self.server.as_mut() {\n  710 |                     server.artifacts = Some(artifacts.clone());\n  711 |                 }\n  712 |             }\n  713 |             _ => {}\n  714 |         }\n  715 | \n  716 |         let should_open = self.client.stage == BuildStage::Success\n  717 |             && (self.server.as_ref().map(|s| s.stage == BuildStage::Success)).unwrap_or(true);\n  718 | \n  719 |         use crate::cli::styles::GLOW_STYLE;\n  720 | \n  721 |         if should_open {\n  722 |             let time_taken = self.client.total_build_time().unwrap_or_else(|| {\n  723 |                 artifacts\n  724 |                     .time_end\n  725 |                     .duration_since(artifacts.time_start)\n  726 |                     .unwrap()\n  727 |             });\n  728 | \n  729 |             if self.client.builds_opened == 0 {\n  730 |                 tracing::info!(\n  731 |                     \"Build completed successfully in {GLOW_STYLE}{}{GLOW_STYLE:#}, launching app! 💫\",\n  732 |                     format_duration_ms(time_taken)\n  733 |                 );\n  734 |             } else {\n  735 |                 tracing::info!(\n  736 |                     \"Build completed in {GLOW_STYLE}{}{GLOW_STYLE:#}\",\n  737 |                     format_duration_ms(time_taken)\n  738 |                 );\n  739 |             }\n  740 | \n  741 |             let open_browser = self.client.builds_opened == 0 && self.open_browser;\n  742 |             self.open_all(devserver, open_browser).await?;\n  743 | \n  744 |             // Give a second for the server to boot\n  745 |             tokio::time::sleep(Duration::from_millis(300)).await;\n  746 | \n  747 |             // Update the screen + devserver with the new handle info\n  748 |             devserver.send_reload_command().await\n  749 |         }\n  750 | \n  751 |         Ok(())\n  752 |     }\n  753 | \n  754 |     /// Open an existing app bundle, if it exists\n  755 |     ///\n  756 |     /// Will attempt to open the server and client together, in a coordinated way such that the server\n  757 |     /// opens first, initializes, and then the client opens.\n  758 |     ///\n  759 |     /// There's a number of issues we need to be careful to work around:\n  760 |     /// - The server failing to boot or crashing on startup (and entering a boot loop)\n  761 |     /// -\n  762 |     pub(crate) async fn open_all(\n  763 |         &mut self,\n  764 |         devserver: &WebServer,\n  765 |         open_browser: bool,\n  766 |     ) -> Result<()> {\n  767 |         let devserver_ip = devserver.devserver_address();\n  768 |         let fullstack_address = devserver.proxied_server_address();\n  769 |         let displayed_address = devserver.displayed_address();\n  770 | \n  771 |         // Always open the server first after the client has been built\n  772 |         // Only open the server if it isn't prerendered and finished building\n  773 |         if let Some(server) = self.server.as_mut().filter(|_| !self.ssg) {\n  774 |             if server.stage < BuildStage::Success {\n  775 |                 tracing::trace!(\"Skipping server open: will open once build completes\");\n  776 |             } else {\n  777 |                 tracing::debug!(\"Opening server build\");\n  778 |                 server.soft_kill().await;\n  779 |                 server\n  780 |                     .open(\n  781 |                         devserver_ip,\n  782 |                         displayed_address,\n  783 |                         fullstack_address,\n  784 |                         false,\n  785 |                         false,\n  786 |                         BuildId::SECONDARY,\n  787 |                         &self.server_args,\n  788 |                     )\n  789 |                     .await?;\n  790 |             }\n  791 |         }\n  792 | \n  793 |         // Skip opening native client if still building (web can open anytime)\n  794 |         if self.client.build.bundle != BundleFormat::Web && self.client.stage < BuildStage::Success\n  795 |         {\n  796 |             tracing::trace!(\"Skipping client open: will open once build completes\");\n  797 |             return Ok(());\n  798 |         }\n  799 | \n  800 |         // Start the new app before we kill the old one to give it a little bit of time\n  801 |         self.client.soft_kill().await;\n  802 |         self.client\n  803 |             .open(\n  804 |                 devserver_ip,\n  805 |                 displayed_address,\n  806 |                 fullstack_address,\n  807 |                 open_browser,\n  808 |                 self.always_on_top,\n  809 |                 BuildId::PRIMARY,\n  810 |                 &self.client_args,\n  811 |             )\n  812 |             .await?;\n  813 | \n  814 |         Ok(())\n  815 |     }\n  816 | \n  817 |     /// Shutdown all the running processes\n  818 |     pub(crate) async fn shutdown(&mut self) -> Result<()> {\n  819 |         self.client.soft_kill().await;\n  820 | \n  821 |         if let Some(server) = self.server.as_mut() {\n  822 |             server.soft_kill().await;\n  823 |         }\n  824 | \n  825 |         // If the client is running on Android, we need to remove the port forwarding\n  826 |         // todo: use the android tools \"adb\"\n  827 |         if matches!(self.client.build.bundle, BundleFormat::Android) {\n  828 |             if let Err(err) = Command::new(&self.workspace.android_tools()?.adb)\n  829 |                 .arg(\"reverse\")\n  830 |                 .arg(\"--remove\")\n  831 |                 .arg(format!(\"tcp:{}\", self.devserver_port))\n  832 |                 .output()\n  833 |                 .await\n  834 |             {\n  835 |                 tracing::error!(\n  836 |                     \"failed to remove forwarded port {}: {err}\",\n  837 |                     self.devserver_port\n  838 |                 );\n  839 |             }\n  840 |         }\n  841 | \n  842 |         // force the tailwind watcher to stop - if we don't, it eats our stdin\n  843 |         self.tw_watcher.abort();\n  844 | \n  845 |         Ok(())\n  846 |     }\n  847 | \n  848 |     /// Perform a full rebuild of the app, equivalent to `cargo rustc` from scratch with no incremental\n  849 |     /// hot-patch engine integration.\n  850 |     pub(crate) async fn full_rebuild(&mut self) {\n  851 |         let build_mode = self.initial_build_mode();\n  852 | \n  853 |         self.client\n  854 |             .start_rebuild(build_mode.clone(), BuildId::PRIMARY);\n  855 |         if let Some(s) = self.server.as_mut() {\n  856 |             s.start_rebuild(build_mode, BuildId::SECONDARY);\n  857 |         }\n  858 | \n  859 |         self.clear_hot_reload_changes();\n  860 |         self.clear_cached_rsx();\n  861 |         self.clear_patches();\n  862 |     }\n  863 | \n  864 |     pub(crate) async fn hotpatch(\n  865 |         &mut self,\n  866 |         bundle: &BuildArtifacts,\n  867 |         id: BuildId,\n  868 |         cache: &HotpatchModuleCache,\n  869 |         devserver: &mut WebServer,\n  870 |     ) -> Result<()> {\n  871 |         let elapsed = bundle\n  872 |             .time_end\n  873 |             .duration_since(bundle.time_start)\n  874 |             .unwrap_or_default();\n  875 | \n  876 |         let jump_table = match id {\n  877 |             BuildId::PRIMARY => self.client.hotpatch(bundle, cache).await,\n  878 |             BuildId::SECONDARY => {\n  879 |                 self.server\n  880 |                     .as_mut()\n  881 |                     .context(\"Server not found\")?\n  882 |                     .hotpatch(bundle, cache)\n  883 |                     .await\n  884 |             }\n  885 |             _ => bail!(\"Invalid build id\"),\n  886 |         }?;\n  887 | \n  888 |         if id == BuildId::PRIMARY {\n  889 |             self.applied_client_hot_reload_message.jump_table = self.client.patches.last().cloned();\n  890 |         }\n  891 | \n  892 |         // If no server, just send the patch immediately\n  893 |         let Some(server) = self.server.as_mut() else {\n  894 |             devserver\n  895 |                 .send_patch(jump_table, elapsed, id, self.client.pid)\n  896 |                 .await;\n  897 |             return Ok(());\n  898 |         };\n  899 | \n  900 |         // If we have a server, we need to wait until both the client and server are ready\n  901 |         // Otherwise we end up with an annoying race condition where the client can't actually load the patch\n  902 |         if self.client.stage == BuildStage::Success && server.stage == BuildStage::Success {\n  903 |             let client_jump_table = self\n  904 |                 .client\n  905 |                 .patches\n  906 |                 .last()\n  907 |                 .cloned()\n  908 |                 .context(\"Missing client jump table\")?;\n  909 | \n  910 |             let server_jump_table = server\n  911 |                 .patches\n  912 |                 .last()\n  913 |                 .cloned()\n  914 |                 .context(\"Missing server jump table\")?;\n  915 | \n  916 |             devserver\n  917 |                 .send_patch(server_jump_table, elapsed, BuildId::SECONDARY, server.pid)\n  918 |                 .await;\n  919 | \n  920 |             devserver\n  921 |                 .send_patch(\n  922 |                     client_jump_table,\n  923 |                     elapsed,\n  924 |                     BuildId::PRIMARY,\n  925 |                     self.client.pid,\n  926 |                 )\n  927 |                 .await;\n  928 |         }\n  929 | \n  930 |         Ok(())\n  931 |     }\n  932 | \n  933 |     pub(crate) fn get_build(&self, id: BuildId) -> Option<&AppBuilder> {\n  934 |         match id {\n  935 |             BuildId::PRIMARY => Some(&self.client),\n  936 |             BuildId::SECONDARY => self.server.as_ref(),\n  937 |             _ => None,\n  938 |         }\n  939 |     }\n  940 | \n  941 |     pub(crate) fn client(&self) -> &AppBuilder {\n  942 |         &self.client\n  943 |     }\n  944 | \n  945 |     /// The name of the app being served, to display\n  946 |     pub(crate) fn app_name(&self) -> &str {\n  947 |         self.client.build.executable_name()\n  948 |     }\n  949 | \n  950 |     /// Get any hot reload changes that have been applied since the last full rebuild\n  951 |     pub(crate) fn applied_hot_reload_changes(&mut self, build: BuildId) -> HotReloadMsg {\n  952 |         let mut msg = self.applied_client_hot_reload_message.c n(s: &str, d: &str) -> ConfigChangeOutcome {\n 3073 |         ConfigChangeOutcome::WarnRestart {\n 3074 |             subject: s.into(),\n 3075 |             detail: d.into(),\n 3076 |         }\n 3077 |     }\n 3078 | \n 3079 |     #[test]\n 3080 |     fn escalate_full_rebuild_dominates_warn_restart() {\n 3081 |         let a = rebuild(\"a\", \"changed\");\n 3082 |         let b = warn(\"b\", \"changed\");\n 3083 |         assert_rebuild(&a.clone().escalate(b.clone()));\n 3084 |         assert_rebuild(&b.escalate(a));\n 3085 |     }\n 3086 | \n 3087 |     #[test]\n 3088 |     fn escalate_warn_restart_dominates_ignore() {\n 3089 |         let a = warn(\"a\", \"changed\");\n 3090 |         let b = ConfigChangeOutcome::Ignore { note: None };\n 3091 |         assert_warn(&a.clone().escalate(b.clone()));\n 3092 |         assert_warn(&b.escalate(a));\n 3093 |     }\n 3094 | \n 3095 |     // ============================================================================\n 3096 |     // File-level round-trip (parse-error & no-repeat-rebuild behaviors)\n 3097 |     // ============================================================================\n 3098 |     //\n 3099 |     // These exercise the helpers that load and diff against the on-disk content. They use a\n 3100 |     // standalone `Snapshot` map rather than spinning up an `AppServer`, which keeps tests\n 3101 |     // fast and isolated from the rest of the runner.\n 3102 | \n 3103 |     fn diff_cargo_file(\n 3104 |         snapshots: &mut HashMap<PathBuf, toml::Value>,\n 3105 |         path: &Path,\n 3106 |         ctx: &AnalysisCtx,\n 3107 |     ) -> ConfigChangeOutcome {\n 3108 |         let Ok(new_value) = read_toml_file(path) else {\n 3109 |             return ConfigChangeOutcome::Ignore {\n 3110 |                 note: Some(format!(\n 3111 |                     \"Cargo.toml parse failed at {}, will retry on next save\",\n 3112 |                     path.display()\n 3113 |                 )),\n 3114 |             };\n 3115 |         };\n 3116 |         let old_value = snapshots\n 3117 |             .get(path)\n 3118 |             .cloned()\n 3119 |             .unwrap_or_else(|| toml::Value::Table(Default::default()));\n 3120 |         let outcome = analyze_cargo_value(&old_value, &new_value, ctx);\n 3121 |         snapshots.insert(path.to_path_buf(), new_value);\n 3122 |         outcome\n 3123 |     }\n 3124 | \n 3125 |     fn seed_cargo_into(snapshots: &mut HashMap<PathBuf, toml::Value>, path: &Path) {\n 3126 |         if let Ok(v) = read_toml_file(path) {\n 3127 |             snapshots.insert(path.to_path_buf(), v);\n 3128 |         }\n 3129 |     }\n 3130 | \n 3131 |     #[test]\n 3132 |     fn diff_returns_ignore_for_unchanged_file() {\n 3133 |         let dir = tempfile::tempdir().unwrap();\n 3134 |         let path = dir.path().join(\"Cargo.toml\");\n 3135 |         std::fs::write(&path, CARGO_BASELINE).unwrap();\n 3136 | \n 3137 |         let mut snaps = HashMap::new();\n 3138 |         seed_cargo_into(&mut snaps, &path);\n 3139 |         assert_ignore(&diff_cargo_file(&mut snaps, &path, &ctx_dev_web()));\n 3140 |     }\n 3141 | \n 3142 |     #[test]\n 3143 |     fn diff_detects_added_dependency() {\n 3144 |         let dir = tempfile::tempdir().unwrap();\n 3145 |         let path = dir.path().join(\"Cargo.toml\");\n 3146 |         std::fs::write(&path, CARGO_BASELINE).unwrap();\n 3147 | \n 3148 |         let mut snaps = HashMap::new();\n 3149 |         seed_cargo_into(&mut snaps, &path);\n 3150 | \n 3151 |         let modified = format!(\n 3152 |             r#\"{CARGO_BASELINE}\n 3153 | [dependencies.tokio]\n 3154 | version = \"1\"\n 3155 | \"#\n 3156 |         );\n 3157 |         std::fs::write(&path, &modified).unwrap();\n 3158 |         assert_rebuild(&diff_cargo_file(&mut snaps, &path, &ctx_dev_web()));\n 3159 |     }\n 3160 | \n 3161 |     #[test]\n 3162 |     fn diff_returns_ignore_with_note_on_parse_error_and_keeps_snapshot() {\n 3163 |         let dir = tempfile::tempdir().unwrap();\n 3164 |         let path = dir.path().join(\"Cargo.toml\");\n 3165 |         std::fs::write(&path, CARGO_BASELINE).unwrap();\n 3166 | \n 3167 |         let mut snaps = HashMap::new();\n 3168 |         seed_cargo_into(&mut snaps, &path);\n 3169 | \n 3170 |         // Mid-edit garbage: snapshot must NOT be clobbered.\n 3171 |         std::fs::write(&path, \"[package\\nthis is not valid\").unwrap();\n 3172 |         let outcome = diff_cargo_file(&mut snaps, &path, &ctx_dev_web());\n 3173 |         assert_ignore(&outcome);\n 3174 |         if let ConfigChangeOutcome::Ignore { note: Some(n) } = &outcome {\n 3175 |             assert!(n.contains(\"parse failed\"));\n 3176 |         } else {\n 3177 |             panic!(\"expected Ignore-with-note, got {outcome:?}\");\n 3178 |         }\n 3179 | \n 3180 |         // Subsequent valid save still diffs against the *seeded* baseline.\n 3181 |         let modified = format!(\n 3182 |             r#\"{CARGO_BASELINE}\n 3183 | [dependencies.tokio]\n 3184 | version = \"1\"\n 3185 | \"#\n 3186 |         );\n 3187 |         std::fs::write(&path, &modified).unwrap();\n 3188 |         assert_rebuild(&diff_cargo_file(&mut snaps, &path, &ctx_dev_web()));\n 3189 |     }\n 3190 | \n 3191 |     #[test]\n 3192 |     fn diff_no_repeat_rebuild_for_same_change() {\n 3193 |         let dir = tempfile::tempdir().unwrap();\n 3194 |         let path = dir.path().join(\"Cargo.toml\");\n 3195 |         std::fs::write(&path, CARGO_BASELINE).unwrap();\n 3196 | \n 3197 |         let mut snaps = HashMap::new();\n 3198 |         seed_cargo_into(&mut snaps, &path);\n 3199 | \n 3200 |         let modified = format!(\n 3201 |             r#\"{CARGO_BASELINE}\n 3202 | [dependencies.tokio]\n 3203 | version = \"1\"\n 3204 | \"#\n 3205 |         );\n 3206 |         std::fs::write(&path, &modified).unwrap();\n 3207 |         assert_rebuild(&diff_cargo_file(&mut snaps, &path, &ctx_dev_web()));\n 3208 | \n 3209 |         // Second analyze call against the *same* file content should be Ignore — the\n 3210 |         // snapshot was updated by the first call, so we don't loop on the same edit.\n 3211 |         assert_ignore(&diff_cargo_file(&mut snaps, &path, &ctx_dev_web()));\n 3212 |     }\n 3213 | }","lines":3213,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/serve/runner.rs#L1-L3213"},{"ref":"packages/cli/src/serve/runner.rs:1922-3213","code":" 1922 | // ---------------------------------------------------------------------------------------------\n 1923 | // Cargo.toml / Dioxus.toml live-edit classification\n 1924 | //\n 1925 | // Decides whether an in-flight `dx serve` should respond to an edit of `Cargo.toml` or\n 1926 | // `Dioxus.toml` with a full rebuild, a \"restart required\" warning, or by silently ignoring it.\n 1927 | //\n 1928 | // The classification is field-aware: we parse the file as `toml::Value` and compare a curated\n 1929 | // set of subtrees. Whitespace, comments, key reordering, and edits to fields outside the curated\n 1930 | // set show up as `Ignore`, so a stray edit to e.g. `package.description` doesn't kick off a\n 1931 | // 30-second rebuild.\n 1932 | //\n 1933 | // Profile and platform sections are filtered against the *active* profile and bundle. Editing\n 1934 | // `[profile.release]` while serving in `dev` produces an `Ignore` with a debug note rather\n 1935 | // than a rebuild — likewise for `[ios]` settings while serving for the web.\n 1936 | //\n 1937 | // Parse failures intentionally return `Ignore` and leave the snapshot untouched, so a save\n 1938 | // that's mid-edit (broken syntax) doesn't get diffed and doesn't pollute the baseline. The\n 1939 | // next successful save is what drives a decision.\n 1940 | // ---------------------------------------------------------------------------------------------\n 1941 | \n 1942 | /// What the runner should do in response to a config-file edit.\n 1943 | ///\n 1944 | /// `FullRebuild` and `WarnRestart` carry the human-readable cause split into a `subject`\n 1945 | /// (e.g. `Cargo.toml [dependencies]`) and a `detail` (e.g. `changed` plus any trailing hint).\n 1946 | /// The split lets the log formatter style only the subject, leaving the verb and any\n 1947 | /// follow-on prose in the default color.\n 1948 | #[derive(Debug, Clone, PartialEq, Eq)]\n 1949 | pub(crate) enum ConfigChangeOutcome {\n 1950 |     /// Nothing rebuild-relevant changed (whitespace, comment-only edit, irrelevant field, edit\n 1951 |     /// to an inactive profile/platform). `note` is logged at debug level so silent edits aren't\n 1952 |     /// completely invisible.\n 1953 |     Ignore { note: Option<String> },\n 1954 | \n 1955 |     /// A field that affects compilation changed. The runner should kick off a full rebuild.\n 1956 |     FullRebuild { subject: String, detail: String },\n 1957 | \n 1958 |     /// A field that's only consumed at devserver-startup changed (proxy, https, watch paths).\n 1959 |     /// The runner should warn the user that a `dx serve` restart is required to pick up the\n 1960 |     /// change. No build action is taken.\n 1961 |     WarnRestart { subject: String, detail: String },\n 1962 | }\n 1963 | \n 1964 | impl ConfigChangeOutcome {\n 1965 |     /// Combine two outcomes by keeping the strongest action.\n 1966 |     /// `FullRebuild` > `WarnRestart` > `Ignore`.\n 1967 |     fn escalate(self, other: ConfigChangeOutcome) -> ConfigChangeOutcome {\n 1968 |         use ConfigChangeOutcome::*;\n 1969 |         match (&self, &other) {\n 1970 |             (FullRebuild { .. }, _) => self,\n 1971 |             (_, FullRebuild { .. }) => other,\n 1972 |             (WarnRestart { .. }, _) => self,\n 1973 |             (_, WarnRestart { .. }) => other,\n 1974 |             (Ignore { note: Some(_) }, Ignore { note: None }) => self,\n 1975 |             (Ignore { note: None }, Ignore { note: Some(_) }) => other,\n 1976 |             _ => self,\n 1977 |         }\n 1978 |     }\n 1979 | }\n 1980 | \n 1981 | /// Active build context passed to the pure analysis functions. Lets `[profile.<name>]` and\n 1982 | /// `[<platform>]` edits be classified relative to whatever the running serve session targets.\n 1983 | #[derive(Debug, Clone)]\n 1984 | struct AnalysisCtx {\n 1985 |     active_profile: String,\n 1986 |     active_bundle: BundleFormat,\n 1987 | }\n 1988 | \n 1989 | fn read_toml_file(path: &Path) -> Result<toml::Value, anyhow::Error> {\n 1990 |     let s = std::fs::read_to_string(path)?;\n 1991 |     let v = toml::from_str::<toml::Value>(&s)?;\n 1992 |     Ok(v)\n 1993 | }\n 1994 | \n 1995 | /// Look up `path` (a list of table keys) inside a TOML value. Returns `None` at the first\n 1996 | /// missing key or non-table along the way.\n 1997 | fn toml_get<'a>(value: &'a toml::Value, path: &[&str]) -> Option<&'a toml::Value> {\n 1998 |     let mut current = value;\n 1999 |     for key in path {\n 2000 |         let table = current.as_table()?;\n 2001 |         current = table.get(*key)?;\n 2002 |     }\n 2003 |     Some(current)\n 2004 | }\n 2005 | \n 2006 | fn analyze_cargo_value(\n 2007 |     old: &toml::Value,\n 2008 |     new: &toml::Value,\n 2009 |     ctx: &AnalysisCtx,\n 2010 | ) -> ConfigChangeOutcome {\n 2011 |     if old == new {\n 2012 |         return ConfigChangeOutcome::Ignore { note: None };\n 2013 |     }\n 2014 | \n 2015 |     let mut outcome = ConfigChangeOutcome::Ignore { note: None };\n 2016 | \n 2017 |     // -------- Sections that always force a full rebuild when their contents differ --------\n 2018 |     let rebuild_sections: &[&str] = &[\n 2019 |         \"dependencies\",\n 2020 |         \"dev-dependencies\",\n 2021 |         \"build-dependencies\",\n 2022 |         \"features\",\n 2023 |         \"lib\",\n 2024 |         \"bin\",\n 2025 |         \"example\",\n 2026 |         \"test\",\n 2027 |         \"bench\",\n 2028 |         \"patch\",\n 2029 |         \"replace\",\n 2030 |     ];\n 2031 |     for section in rebuild_sections {\n 2032 |         if toml_get(old, &[section]) != toml_get(new, &[section]) {\n 2033 |             outcome = outcome.escalate(ConfigChangeOutcome::FullRebuild {\n 2034 |                 subject: format!(\"Cargo.toml [{section}]\"),\n 2035 |                 detail: \"changed\".to_string(),\n 2036 |             });\n 2037 |         }\n 2038 |     }\n 2039 | \n 2040 |     // -------- target.<cfg>.dependencies / dev-dependencies / build-dependencies --------\n 2041 |     if toml_get(old, &[\"target\"]) != toml_get(new, &[\"target\"]) {\n 2042 |         outcome = outcome.escalate(ConfigChangeOutcome::FullRebuild {\n 2043 |             subject: \"Cargo.toml [target.*]\".to_string(),\n 2044 |             detail: \"dependencies changed\".to_string(),\n 2045 |         });\n 2046 |     }\n 2047 | \n 2048 |     // -------- [package] subset that affects compilation --------\n 2049 |     let pkg_compile_keys: &[&str] = &[\n 2050 |         \"name\",\n 2051 |         \"version\",\n 2052 |         \"edition\",\n 2053 |         \"rust-version\",\n 2054 |         \"build\",\n 2055 |         \"default-run\",\n 2056 |         \"links\",\n 2057 |         \"autobins\",\n 2058 |         \"autoexamples\",\n 2059 |         \"autotests\",\n 2060 |         \"autobenches\",\n 2061 |         \"resolver\",\n 2062 |     ];\n 2063 |     for key in pkg_compile_keys {\n 2064 |         if toml_get(old, &[\"package\", key]) != toml_get(new, &[\"package\", key]) {\n 2065 |             outcome = outcome.escalate(ConfigChangeOutcome::FullRebuild {\n 2066 |                 subject: format!(\"Cargo.toml [package].{key}\"),\n 2067 |                 detail: \"changed\".to_string(),\n 2068 |             });\n 2069 |         }\n 2070 |     }\n 2071 | \n 2072 |     // -------- [profile.<name>] — only relevant if <name> is in the active profile's chain --------\n 2073 |     if let (Some(old_profiles), Some(new_profiles)) = (\n 2074 |         toml_get(old, &[ _scope_on_stack` so the pop always happens, even across a panic.","locations":[{"ref":"packages/core/src/runtime.rs:231-287","code":"  231 |     /// Call this function with the current scope set to the given scope\n  232 |     #[track_caller]\n  233 |     pub fn in_scope<O>(self: &Rc<Self>, id: ScopeId, f: impl FnOnce() -> O) -> O {\n  234 |         let _runtime_guard = RuntimeGuard::new(self.clone());\n  235 |         {\n  236 |             self.push_scope(id);\n  237 |         }\n  238 |         let o = f();\n  239 |         {\n  240 |             self.pop_scope();\n  241 |         }\n  242 |         o\n  243 |     }\n  244 | \n  245 |     /// Get the current suspense location\n  246 |     pub(crate) fn current_suspense_location(&self) -> Option<SuspenseLocation> {\n  247 |         self.suspense_stack.borrow().last().cloned()\n  248 |     }\n  249 | \n  250 |     /// Run a callback a [`SuspenseLocation`] at the top of the stack\n  251 |     pub(crate) fn with_suspense_location<O>(\n  252 |         &self,\n  253 |         suspense_location: SuspenseLocation,\n  254 |         f: impl FnOnce() -> O,\n  255 |     ) -> O {\n  256 |         self.suspense_stack.borrow_mut().push(suspense_location);\n  257 |         let o = f();\n  258 |         self.suspense_stack.borrow_mut().pop();\n  259 |         o\n  260 |     }\n  261 | \n  262 |     /// Run a callback with the current scope at the top of the stack\n  263 |     pub(crate) fn with_scope_on_stack<O>(&self, scope: ScopeId, f: impl FnOnce() -> O) -> O {\n  264 |         self.push_scope(scope);\n  265 |         let o = f();\n  266 |         self.pop_scope();\n  267 |         o\n  268 |     }\n  269 | \n  270 |     /// Push a scope onto the stack\n  271 |     fn push_scope(&self, scope: ScopeId) {\n  272 |         let suspense_location = self\n  273 |             .scope_states\n  274 |             .borrow()\n  275 |             .get(scope.0)\n  276 |             .and_then(|s| s.as_ref())\n  277 |             .map(|s| s.suspense_location())\n  278 |             .unwrap_or_default();\n  279 |         self.suspense_stack.borrow_mut().push(suspense_location);\n  280 |         self.scope_stack.borrow_mut().push(scope);\n  281 |     }\n  282 | \n  283 |     /// Pop a scope off the stack\n  284 |     fn pop_scope(&self) {\n  285 |         self.scope_stack.borrow_mut().pop();\n  286 |         self.suspense_stack.borrow_mut().pop();\n  287 |     }","lines":57,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/runtime.rs#L231-L287"}]},{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`packages/desktop/build.rs`'s `check_gnu()` unconditionally appends `EXAMPLES_TOML` to `Cargo.toml` in append mode whenever `DIOXUS_RELEASE` is set, with no check for whether the block was already appended. Cargo re-runs build scripts whenever any file in the package changes (this build.rs has no `cargo:rerun-if-changed` directives to narrow that down), so any repeated build with `DIOXUS_RELEASE` set (e.g. re-running `cargo publish --dry-run`, `cargo doc`, or CI retries) will append the `[[example]]` blocks again, growing `Cargo.toml` and eventually producing duplicate `[[example]] name = \"...\"` entries, which Cargo rejects as a manifest error.","fix":"Before appending, check whether `Cargo.toml` already contains the marker (e.g. search for `name = \"video_stream\"` or a dedicated sentinel comment) and skip the append if it's already present, or write to a separate included manifest instead of mutating `Cargo.toml` in place.","locations":[{"ref":"packages/desktop/build.rs:14-38","code":"   14 |     // To prepare for a release, we add extra examples to desktop for doc scraping and copy assets from the workspace to make those examples compile\n   15 |     if option_env!(\"DIOXUS_RELEASE\").is_some() {\n   16 |         // Append EXAMPLES_TOML to the cargo.toml\n   17 |         let cargo_toml = std::fs::OpenOptions::new()\n   18 |             .append(true)\n   19 |             .open(\"Cargo.toml\")\n   20 |             .unwrap();\n   21 |         let mut write = std::io::BufWriter::new(cargo_toml);\n   22 |         write.write_all(EXAMPLES_TOML.as_bytes()).unwrap();\n   23 | \n   24 |         // Copy the assets from the workspace to the examples directory\n   25 |         let crate_dir = PathBuf::from(std::env::var(\"CARGO_MANIFEST_DIR\").unwrap());\n   26 |         let workspace_dir = crate_dir.parent().unwrap().parent().unwrap();\n   27 |         let workspace_assets_dir = workspace_dir.join(\"examples\").join(\"assets\");\n   28 |         let desktop_assets_dir = PathBuf::from(\"examples\").join(\"assets\");\n   29 |         std::fs::create_dir_all(&desktop_assets_dir).unwrap();\n   30 |         // move all files from the workspace assets dir to the desktop assets dir\n   31 |         for entry in std::fs::read_dir(workspace_assets_dir).unwrap() {\n   32 |             let entry = entry.unwrap();\n   33 |             let path = entry.path();\n   34 |             if path.is_file() {\n   35 |                 std::fs::copy(&path, desktop_assets_dir.join(path.file_name().unwrap())).unwrap();\n   36 |             }\n   37 |         }\n   38 |     }","lines":25,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/build.rs#L14-L38"}]},{"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"When `SsrRendererPool::check_cached_route` serves a cache hit for an incrementally-rendered route, it always returns an empty `HeaderMap::new()` (see `ssr.rs:152-165`, and the `Ok(None) => HeaderMap::new()` path used in `FullstackState::render_handler`, `server.rs:343-361`). Only the rendered HTML body is cached (`IncrementalRenderer::cache` in `mod.rs:66-81` only stores `route`/`timestamp`/`html`); any custom response headers set during the original render via `FullstackContext`/`streaming_context.take_response_headers()` (e.g. `Set-Cookie`, custom `Content-Security-Policy`, `Vary`, cache directives set by the app) are silently dropped on every subsequent cache hit.\n\nThis is undocumented behavior: nothing in `ServeConfig`/`IncrementalRendererConfig`'s docs warns that per-response headers set by the application are not replayed on cached (ISR) responses, which could cause subtle bugs for apps that rely on headers set during rendering (e.g. auth-adjacent headers, security headers) being present on every response for a given route.","fix":"Either persist the response headers alongside the cached HTML body (extend `IncrementalRenderer::cache`/`get` to store a `HeaderMap` next to the bytes) so cache hits can replay them, or explicitly document that only static, cacheable-safe headers should be relied on for ISR-cached routes.","locations":[{"ref":"packages/fullstack-server/src/ssr.rs:63-93","code":"   63 |     /// Look for a cached route in the incremental cache and send it into the render channel if it exists\n   64 |     fn check_cached_route(\n   65 |         &self,\n   66 |         route: &str,\n   67 |         render_into: &mut Sender<Result<String, IncrementalRendererError>>,\n   68 |     ) -> Option<RenderFreshness> {\n   69 |         let incremental = self.incremental_cache.as_ref()?;\n   70 | \n   71 |         if let Ok(mut incremental) = incremental.write() {\n   72 |             match incremental.get(route) {\n   73 |                 Ok(Some(cached_render)) => {\n   74 |                     let CachedRender {\n   75 |                         freshness,\n   76 |                         response,\n   77 |                         ..\n   78 |                     } = cached_render;\n   79 |                     _ = render_into.start_send(\n   80 |                         String::from_utf8(response.to_vec())\n   81 |                             .map_err(|err| IncrementalRendererError::Other(err.into())),\n 223,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/suspense/component.rs#L1-L223"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"critical","difficulty":"medium","description":"`deserialize_const_primitive` writes the raw little-endian bytes of a decoded CBOR number directly into the output buffer for any primitive, including `bool` (`impl_serialize_const!(bool)` in the same file). There is no validation that the decoded byte is `0` or `1`. Since `bool` in Rust has only two valid bit patterns (any other byte value is an instantly invalid value), and `deserialize_const_raw` (in `lib.rs`) later does `std::mem::transmute_copy::<[MaybeUninit<u8>; N], T>(&out)` to produce the final `T`, feeding this API attacker-controlled or corrupted bytes (e.g. a struct containing a `bool` field, encoded with CBOR unsigned integer `200`) will transmute an out-of-range byte into a `bool`, which is undefined behavior per Rust's validity invariants - independent of whether the resulting value is ever branched on.","fix":"Reject invalid values before they can be transmuted. Since `PrimitiveLayout` currently only tracks `size` and not the concrete Rust type, either (a) add a `valid_values` check/kind field to `PrimitiveLayout` so `deserialize_const_primitive` can reject out-of-range bytes for `bool` (only 0/1 allowed) and return `None`, or (b) give `bool` its own `SerializeConst` impl with a dedicated deserialize path that validates the byte before accepting it, e.g.:\n```rust\nunsafe impl SerializeConst for bool {\n    const MEMORY_LAYOUT: Layout = Layout::Primitive(PrimitiveLayout { size: 1 });\n}\n// in deserialize_const_primitive, or a bool-specific wrapper:\nif byte > 1 { return None; }\n```","locations":[{"ref":"packages/const-serialize/src/primitive.rs:99-121","code":"   99 | /// Deserialize a primitive type into the out buffer at the offset passed in. Returns a new version of the buffer with the data added.\n  100 | pub(crate) const fn deserialize_const_primitive<'a>(\n  101 |     from: &'a [u8],\n  102 |     layout: &PrimitiveLayout,\n  103 |     out: &mut [MaybeUninit<u8>],\n  104 | ) -> Option<&'a [u8]> {\n  105 |     let mut offset = 0;\n  106 |     let Ok((number, from)) = take_number(from) else {\n  107 |         return None;\n  108 |     };\n  109 |     let bytes = number.to_le_bytes();\n  110 |     while offset < layout.size {\n  111 |         // If the bytes are reversed, walk backwards from the end of the number when filling in bytes\n  112 |         let byte = bytes[offset];\n  113 |         if cfg!(any(target_endian = \"big\", feature = \"test-big-endian\")) {\n  114 |             out[layout.size - offset - 1] = MaybeUninit::new(byte);\n  115 |         } else {\n  116 |             out[offset] = MaybeUninit::new(byte);\n  117 |         }\n  118 |         offset += 1;\n  119 |     }\n  120 |     Some(from)\n  121 | }","lines":23,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/const-serialize/src/primitive.rs#L99-L121"},{"ref":"packages/const-serialize/src/lib.rs:171-184","code":"  171 | pub const unsafe fn deserialize_const_raw<const N: usize, T: SerializeConst>(\n  172 |     from: &[u8],\n  173 | ) -> Option<(&[u8], T)> {\n  174 |     // Create uninitized memory with the size of the type\n  175 |     let mut out = [MaybeUninit::uninit(); N];\n  176 |     // Fill in the bytes into the buffer for the type\n  177 |     let Some(from) = deserialize_const_ptr(from, &T::MEMORY_LAYOUT, &mut out) else {\n  178 |         return None;\n  179 |     };\n  180 |     // Now that the memory is filled in, transmute it into the type\n  181 |     Some((from, unsafe {\n  182 |         std::mem::transmute_copy::<[MaybeUninit<u8>; N], T>(&out)\n  183 |     }))\n  184 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/const-serialize/src/lib.rs#L171-L184"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"In `packages/cli/src/bundler/tools.rs`, only the NSIS (`ensure_nsis`) and WiX (`ensure_wix`) downloads are integrity-checked via `download_and_verify` (SHA1/SHA256 comparison). The `linuxdeploy` AppImage (`ensure_linuxdeploy`, line 187), the WebView2 bootstrapper (`download_webview2_bootstrapper`, line 203), and the WebView2 offline installer (`download_webview2_offline_installer`, line 222) are all fetched with plain `download_bytes` and written straight to disk with no hash or signature verification at all, then later executed as installers/binaries during bundling. A MITM or compromised CDN/redirect for these three URLs would let arbitrary code run on the user's machine during `dx bundle`, with no consistency check to catch it, unlike the NSIS/WiX path which already has the verification machinery in place.","fix":"Add known-good hash constants for the `linuxdeploy` binaries (per-arch) and the WebView2 installers, and route their downloads through `download_and_verify` the same way NSIS and WiX already are.","locations":[{"ref":"packages/cli/src/bundler/tools.rs:170-226","code":"  170 | async fn ensure_linuxdeploy(tools_dir: &Path, arch: &str) -> Result<PathBuf> {\n  171 |     let linuxdeploy_name = format!(\"linuxdeploy-{arch}.AppImage\");\n  172 |     let linuxdeploy_path = tools_dir.join(&linuxdeploy_name);\n  173 | \n  174 |     if linuxdeploy_path.exists() {\n  175 |         return Ok(linuxdeploy_path);\n  176 |     }\n  177 | \n  178 |     if cfg!(feature = \"no-downloads\") {\n  179 |         bail!(\n  180 |             \"linuxdeploy not found and automatic downloads are disabled. Install linuxdeploy manually.\"\n  181 |         );\n  182 |     }\n  183 | \n  184 |     let url = format!(\"{LINUXDEPLOY_URL_BASE}/{linuxdeploy_name}\");\n  185 |     tracing::info!(\"Downloading linuxdeploy from {url}...\");\n  186 | \n  187 |     let data = download_bytes(&url).await?;\n  188 |     std::fs::create_dir_all(tools_dir)?;\n  189 |     std::fs::write(&linuxdeploy_path, &data)?;\n  190 | \n  191 |     #[cfg(unix)]\n  192 |     std::fs::set_permissions(&linuxdeploy_path, std::fs::Permissions::from_mode(0o755))?;\n  193 | \n  194 |     Ok(linuxdeploy_path)\n  195 | }\n  196 | \n  197 | async fn download_webview2_bootstrapper(tools_dir: &Path) -> Result<PathBuf> {\n  198 |     let path = tools_dir.join(\"MicrosoftEdgeWebview2Setup.exe\");\n  199 |     if path.exists() {\n  200 |         return Ok(path);\n  201 |     }\n  202 |     tracing::info!(\"Downloading WebView2 bootstrapper...\");\n  203 |     let data = download_bytes(WEBVIEW2_BOOTSTRAPPER_URL).await?;\n  204 |     std::fs::create_dir_all(tools_dir)?;\n  205 |     std::fs::write(&path, &data).context(\"Failed to write WebView2 bootstrapper\")?;\n  206 |     Ok(path)\n  207 | }\n  208 | \n  209 | async fn download_webview2_offline_installer(tools_dir: &Path, arch: &str) -> Result<PathBuf> {\n  210 |     let name = format!(\"MicrosoftEdgeWebView2RuntimeInstaller_{arch}.exe\");\n  211 |     let path = tools_dir.join(&name);\n  212 |     if path.exists() {\n  213 |         return Ok(path);\n  214 |     }\n  215 |     let url = match arch {\n  216 |         \"x64\" => WEBVIEW2_X64_INSTALLER_URL,\n  217 |         \"x86\" => WEBVIEW2_X86_INSTALLER_URL,\n  218 |         \"arm64\" => WEBVIEW2_ARM64_INSTALLER_URL,\n  219 |         _ => bail!(\"Unsupported architecture for WebView2 offline installer: {arch}\"),\n  220 |     };\n  221 |     tracing::info!(\"Downloading WebView2 offline installer for {arch}...\");\n  222 |     let data = download_bytes(url).await?;\n  223 |     std::fs::create_dir_all(tools_dir)?;\n  224 |     std::fs::write(&path, &data).context(\"Failed to write WebView2 offline installer\")?;\n  225 |     Ok(path)\n  226 | }","lines":57,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/bundler/tools.rs#L170-L226"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"`SyncStorage::change_reference` (used by `GenerationalBox::point_to`) acquires locks in an order that is inconsistent with itself when called with swapped arguments: it first locks `other.storage.data` for read (inside `Self::get_split_ref(other)`, held as `other_write` for the whole function body) and only afterwards locks `location.storage.data` for write. If thread A calls `change_reference(A_ptr, B_ptr)` (locks B then A) while thread B concurrently calls `change_reference(B_ptr, A_ptr)` (locks A then B), this is a classic AB-BA lock-order inversion and can deadlock the two threads holding `parking_lot::RwLock`s on `A_ptr.storage` and `B_ptr.storage` with no timeout or detection. Because `SyncStorage`/`point_to` is precisely the API meant to be used from multiple threads (`SyncSignal`, `SyncStorage`), this concurrent-swap pattern is a realistic trigger, e.g. two threads independently redirecting two signals to point at each other's targets.","fix":"Establish a total lock order independent of argument position before acquiring the two locks, e.g. compare `location.storage as *const SyncStorage as usize` and `other.storage as *const SyncStorage as usize` and always lock the lower address first, or acquire both locks via `try_write`/`try_read` with backoff instead of blocking acquisition.","locations":[{"ref":"packages/generational-box/src/sync.rs:357-395","code":"  357 |     fn change_reference(\n  358 |         location: GenerationalPointer<Self>,\n  359 |         other: GenerationalPointer<Self>,\n  360 |     ) -> BorrowResult {\n  361 |         if location == other {\n  362 |             return Ok(());\n  363 |         }\n  364 | \n  365 |         let (other_final, other_write) = Self::get_split_ref(other)?;\n  366 | \n  367 |         let mut write = location.storage.data.write();\n  368 |         // First check if the generation is still valid\n  369 |         if !write.valid(&location.location) {\n  370 |             return Err(BorrowError::Dropped(ValueDroppedError::new_for_location(\n  371 |                 location.location,\n  372 |             )));\n  373 |         }\n  374 | \n  375 |         if let (RwLockStorageEntryData::Reference(reference), RwLockStorageEntryData::Rc(data)) =\n  376 |             (&mut write.data, &other_write.data)\n  377 |         {\n  378 |             if reference == &other_final {\n  379 |                 return Ok(());\n  380 |             }\n  381 |             drop_ref(*reference);\n  382 |             *reference = other_final;\n  383 |             data.add_ref();\n  384 |         } else {\n  385 |             tracing::trace!(\n  386 |                 \"References should always point to a data entry directly found {:?} instead\",\n  387 |                 other_write.data\n  388 |             );\n  389 |             return Err(BorrowError::Dropped(ValueDroppedError::new_for_location(\n  390 |                 other_final.location,\n  391 |             )));\n  392 |         }\n  393 | \n  394 |         Ok(())\n  395 |     }","lines":39,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/generational-box/src/sync.rs#L357-L395"}]},{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"Several proc-macro parsing paths in `fullstack-macro` use `panic!`/`unimplemented!` instead of returning a `syn::Error`, for conditions that are directly triggerable by ordinary (if mistaken) user code, e.g.:\n- A `#[server]`/`#[get]`/etc. function with a `&self`/`self` receiver hits `FnArg::Receiver(_receiver) => panic!(\"Self type is not supported\")` (three separate copies at different call sites) or `unimplemented!(\"Self type is not supported\")`.\n- `new_from_string` panics on an unrecognized HTTP method string instead of surfacing a compile error.\n- `doc_iter` panics (`panic!(\"doc attribute is not a name-value attribute\")`, etc.) if a `#[doc]` attribute isn't in the expected shape.\n\nBecause these run during macro expansion, a user hitting one of these conditions gets a raw `proc macro panicked` message instead of a normal, span-pointing compiler error, which is a materially worse debugging experience than the `syn::Error` path used elsewhere in the same file (e.g. the path-parameter-not-found errors in `CompiledRoute::from_route`).","fix":"Replace these `panic!`/`unimplemented!` calls with `return Err(syn::Error::new(span, \"...\"))` (propagated through the existing `syn::Result` return types) so misuse produces a normal compile error pointing at the offending code, consistent with the rest of the macro's error handling.","locations":[{"ref":"packages/fullstack-macro/src/lib.rs:235","code":"  235 |             FnArg::Receiver(_receiver) => panic!(\"Self type is not supported\"),","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-macro/src/lib.rs#L235"},{"ref":"packages/fullstack-macro/src/lib.rs:317","code":"  317 |             FnArg::Receiver(_) => panic!(\"Self type is not supported\"),","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-macro/src/lib.rs#L317"},{"ref":"packages/fullstack-macro/src/lib.rs:427-428","code":"  427 |             FnArg::Receiver(_receiver) => panic!(),\n  428 |         };","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-macro/src/lib.rs#L427-L428"},{"ref":"packages/fullstack-macro/src/lib.rs:850","code":"  850 |                     unimplemented!(\"Self type is not supported\")","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-macro/src/lib.rs#L850"},{"ref":"packages/fullstack-macro/src/lib.rs:1463","code":" 1463 |             _ => panic!(\"expected one of (GET, POST, PUT, DELETE, HEAD, CONNECT, OPTIONS, TRACE)\"),","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-macro/src/lib.rs#L1463"},{"ref":"packages/fullstack-macro/src/lib.rs:1317-1325","code":" 1317 |             let Meta::NameValue(meta) = &attr.meta else {\n 1318 |                 panic!(\"doc attribute is not a name-value attribute\");\n 1319 |             };\n 1320 |             let Expr::Lit(lit) = &meta.value else {\n 1321 |                 panic!(\"doc attribute is not a string literal\");\n 1322 |             };\n 1323 |             let Lit::Str(lit_str) = &lit.lit else {\n 1324 |                 panic!(\"doc attribute is not a string literal\");\n 1325 |             };","lines":9,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-macro/src/lib.rs#L1317-L1325"}]},{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"In `RcStorageEntry::drop_ref`, the local variable is named `new_ref_count` but `AtomicU64::fetch_sub` returns the value *before* the subtraction, not after. The subsequent check `new_ref_count == 0` is therefore comparing the pre-decrement count to zero, not the post-decrement count. The logic happens to be self-consistent only because `RcStorageEntry` is initialized at `0` (via `RcStorageEntry::new`) to represent the *first* implicit owner, with each `new_reference()`/clone calling `add_ref()` for every *additional* owner - so \"the count was already 0 before this decrement\" correctly identifies \"this is the last live reference\", relying on the atomic wrapping from `0` to `u64::MAX` on the final decrement. This invariant is undocumented and the misleading variable name (implying a post-decrement value) makes it very easy for a future contributor to \"fix\" this into `new_ref_count == 1` (the conventional Arc-style check), which would silently reintroduce a premature-free / use-after-free bug for any type with more than one reference.","fix":"Rename the variable to reflect what `fetch_sub` actually returns, and document the \"starts at 0 for the implicit first owner\" invariant:\n```rust\npub fn drop_ref(&self) -> bool {\n    // `fetch_sub` returns the value *before* decrementing. `ref_count` starts at 0\n    // (representing the first, implicit owner), and each additional clone calls\n    // `add_ref()`, so seeing a pre-decrement value of 0 means this was the last owner.\n    let prev_ref_count = self.ref_count.fetch_sub(1, Ordering::SeqCst);\n    prev_ref_count == 0\n}\n```","locations":[{"ref":"packages/generational-box/src/entry.rs:23-31","code":"   23 |     pub fn add_ref(&self) {\n   24 |         self.ref_count.fetch_add(1, Ordering::SeqCst);\n   25 |     }\n   26 | \n   27 |     pub fn drop_ref(&self) -> bool {\n   28 |         let new_ref_count = self.ref_count.fetch_sub(1, Ordering::SeqCst);\n   29 |         new_ref_count == 0\n   30 |     }\n   31 | }","lines":9,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/generational-box/src/entry.rs#L23-L31"}]}]</script>

<script>
(function(){

// Data

const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];

const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',

  collapsed: new Set(),

// Persistence

function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history

    const p = new URLSearchParams();

    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);

    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);

}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }

  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
