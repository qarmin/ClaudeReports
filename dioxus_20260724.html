o_string` returns an `Err` and this `unwrap()` panics instead of surfacing a normal CLI error.","fix":"Replace the `unwrap()` with `?` after adding a `.context(\"stdin is not valid UTF-8\")`, since `determine_input` already returns `Result<String>`.","locations":[{"ref":"packages/cli/src/cli/translate.rs:124-131","code":"  124 |     if std::io::stdin().is_terminal() {\n  125 |         bail!(\"No input file, source, or stdin to translate from.\");\n  126 |     }\n  127 | \n  128 |     let mut buffer = String::new();\n  129 |     std::io::stdin().read_to_string(&mut buffer).unwrap();\n  130 | \n  131 |     Ok(buffer.trim().to_string())","lines":8,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/cli/translate.rs#L124-L131"}]},{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the main serve loop, `builder.get_build(id).unwrap().build.bundle` panics if `get_build` ever returns `None` for the `id` carried by a `ServeUpdate::BuilderUpdate` message. While `id` is expected to always be valid today, an `unwrap()` on a value derived from an internal message channel is fragile against future refactors (e.g. a build being torn down concurrently with an in-flight update) and would crash the whole `dx serve` session instead of degrading gracefully.","fix":"Use `if let Some(build) = builder.get_build(id) { ... }` (skipping/logging the update when the build is missing) instead of `.unwrap()`, or add an `.expect(\"build id from BuilderUpdate must be tracked\")` message so a future crash at least self-documents the invariant.","locations":[{"ref":"packages/cli/src/serve/mod.rs:144","code":"  144 |                 let bundle_format = builder.get_build(id).unwrap().build.bundle;","lines":1,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/serve/mod.rs#L144"}]},{"id":"PANIC_39","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`AppServer::handle_file_change`'s non-rebuild branch unconditionally indexes `files[0]` (`let file = files[0].display().to_string();`) after the main loop, relying on the caller never passing an empty slice. Both current call sites in `serve/mod.rs` do check `files.is_empty()`/`pending.is_empty()` before calling, so this isn't reachable today, but the invariant lives in the caller rather than the function itself, so a future call site (or a refactor of the existing guards) could reintroduce a panic here silently.","fix":"Add an explicit early return (`if files.is_empty() { return; }`) at the top of `handle_file_change` so the function is safe on its own instead of depending on caller discipline.","locations":[{"ref":"packages/cli/src/serve/runner.rs:387-402","code":"  387 |     pub(crate) async fn handle_file_change(&mut self, files: &[PathBuf], server: &mut WebServer) {\n  388 |         // We can attempt to hotpatch if the build is in a bad state, since this patch might be a recovery.\n  389 |         if !matches!(\n  390 |             self.client.stage,\n  391 |             BuildStage::Failed | BuildStage::Aborted | BuildStage::Success\n  392 |         ) {\n  393 |             // Queue file changes that arrive during a build, so we can process them after the build completes.\n  394 |             // This prevents losing changes from tools like stylance, tailwind, or sass that generate files\n  395 |             // in response to source changes.\n  396 |             tracing::debug!(\n  397 |                 \"Queueing file change - client is not ready to receive hotreloads. Files: {:?}\",\n  398 |                 files\n  399 |             );\n  400 |             self.pending_file_changes.extend(files.iter().cloned());\n  401 |             return;\n  402 |         }","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/serve/runner.rs#L387-L402"},{"ref":"packages/cli/src/serve/runner.rs:669-676","code":"  669 |             self.add_hot_reload_message(&msg);\n  670 | \n  671 |             let file = files[0].display().to_string();\n  672 |             let workspace_dir = self.client.build.workspace_dir().display().to_string();\n  673 |             let file = file\n  674 |                 .trim_start_matches(&workspace_dir)\n  675 |                 .trim_start_matches('/');\n  676 | ","lines":8,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/serve/runner.rs#L669-L676"}]},{"id":"PANIC_40","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`VNode::find_last_element` computes `let last_root_index = self.template.roots().len() - 1;` before any check that `roots()` is non-empty. Every `Template` constructed by the `rsx!` macro and internal helpers happens to always have at least one root, so this is not currently reachable from generated code, but `Template::new` is a public API (also used directly by `hotreload_utils.rs` and any external code building templates by hand), and nothing enforces the non-empty invariant at that boundary. A `Template` with zero roots would make this line underflow (`0usize - 1`), panicking in debug builds and silently wrapping to `usize::MAX` in release builds, which would then panic again a few lines later when indexing `self.template.roots()[last_root_index]` inside `get_dynamic_root_node_and_id`.","fix":"Guard against the empty case explicitly, e.g.:\n```rust\nlet last_root_index = self.template.roots().len().checked_sub(1).expect(\"template must have at least one root\");\n```\nso the failure mode is a clear, documented panic rather than a silent underflow.","locations":[{"ref":"packages/core/src/diff/node.rs:181-183","code":"  181 |     pub(crate) fn find_last_element(&self, dom: &VirtualDom) -> ElementId {\n  182 |         let mount_id = self.mount.get();\n  183 |         let last_root_index = self.template.roots().len() - 1;","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/diff/node.rs#L181-L183"}]},{"id":"PANIC_41","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `VNode::remove_dynamic_node`, the `Fragment(nodes)` arm does `for node in &nodes[..nodes.len() - 1]`, which underflows and panics if `nodes` is empty. All current construction paths for `DynamicNode::Fragment` in this codebase (the `IntoDynNode` impls in `nodes.rs`, `FromNodeIterator`) avoid ever producing an empty `Vec<VNode>` fragment (an empty iterator becomes `DynamicNode::default()` instead), so this is believed unreachable today, but nothing in the `DynamicNode::Fragment(Vec<VNode>)` type itself enforces non-emptiness, so the invariant is easy to break by future code (or a hand-built `DynamicNode::Fragment(vec![])`) without the compiler catching it.","fix":"Make the non-empty assumption explicit and panic-free, e.g. using `split_last`:\n```rust\nFragment(nodes) => {\n    if let Some((last_node, rest)) = nodes.split_last() {\n        for node in rest {\n            node.remove_node_inner(dom, to.as_deref_mut(), destroy_component_state, None)\n        }\n        last_node.remove_node_inner(dom, to, destroy_component_state, replace_with)\n    }\n}\n```\nwhich degrades gracefully instead of underflowing if `nodes` is ever empty.","locations":[{"ref":"packages/core/src/diff/node.rs:388-395","code":"  388 |             Fragment(nodes) => {\n  389 |                 for node in &nodes[..nodes.len() - 1] {\n  390 |                     node.remove_node_inner(dom, to.as_deref_mut(), destroy_component_state, None)\n  391 |                 }\n  392 |                 if let Some(last_node) = nodes.last() {\n  393 |                     last_node.remove_node_inner(dom, to, destroy_component_state, replace_with)\n  394 |                 }\n  395 |             }","lines":8,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/diff/node.rs#L388-L395"}]},{"id":"PANIC_42","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `packages/core/src/scope_arena.rs::handle_element_return`, when a component suspends, the code does `self.runtime.tasks.borrow().get(task.id).expect(\"Suspended on a task that no longer exists\")`. This assumes the `Task` referenced by a freshly-returned `RenderError::Suspended` future is always still registered in `runtime.tasks` at this point. That invariant holds for the normal code path (the task is spawned synchronously earlier in the same render), but the `.expect()` provides no graceful fallback if a future ever returns a `SuspendedFuture` referencing a task that was concurrently cancelled/removed (e.g. via `Task::cancel()` called from within the same render, or a future stored/reused across renders). If that ever happens, it panics and unwinds through `run_scope`, tearing down the render pass instead of degrading gracefully (e.g. treating the scope as non-suspended or logging an error).","fix":"Replace the `.expect(...)` with a graceful fallback, e.g. `let Some(task_entry) = self.runtime.tasks.borrow().get(task.id) else { tracing::error!(\"suspended on a task that no longer exists\"); return; };` so a stale/cancelled task reference degrades to a no-op instead of panicking and aborting the render.","locations":[{"ref":"packages/core/src/scope_arena.rs:114-134","code":"  114 |             Err(RenderError::Suspended(e)) => {\n  115 |                 let task = e.task();\n  116 |                 // Insert the task into the nearest suspense boundary if it exists\n  117 |                 let boundary = scope.suspense_location();\n  118 |                 let already_suspended = self\n  119 |                     .runtime\n  120 |                     .tasks\n  121 |                     .borrow()\n  122 |                     .get(task.id)\n  123 |                     .expect(\"Suspended on a task that no longer exists\")\n  124 |                     .suspend(boundary.clone());\n  125 |                 if !already_suspended {\n  126 |                     tracing::trace!(\"Suspending {:?} on {:?}\", scope.id, task);\n  127 |                     // Add this task to the suspended tasks list of the boundary\n  128 |                     if let SuspenseLocation::UnderSuspense(boundary) = &boundary {\n  129 |                         boundary.add_suspended_task(e.clone());\n  130 |                     }\n  131 |                     self.runtime\n  132 |                         .suspended_tasks\n  133 |                         .set(self.runtime.suspended_tasks.get() + 1);\n  134 |                 }","lines":21,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/scope_arena.rs#L114-L134"}]},{"id":"PANIC_43","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`NativeFileData::name` calls `self.0.file_name().unwrap()`. `Path::file_name()` returns `None` for paths that end in `..`, or are the root/prefix (e.g. `/` on Unix, `C:\\` on Windows). Such a path can reach here from a native drag-and-drop of a filesystem root (`DesktopFileDragEvent`/`DesktopFileData` wraps whatever `PathBuf` wry hands back from the OS), or from a directory picker (`FileDialogRequest` with `directory: true`) if the user selects a drive root. In that case `.unwrap()` panics instead of falling back to an empty/placeholder name.","fix":"Fall back to a safe default instead of panicking:\n\n```rust\nfn name(&self) -> String {\n    self.0\n        .file_name()\n        .map(|n| n.to_string_lossy().into_owned())\n        .unwrap_or_default()\n}\n```","locations":[{"ref":"packages/desktop/src/file_upload.rs:407-410","code":"  407 | impl NativeFileData for DesktopFileData {\n  408 |     fn name(&self) -> String {\n  409 |         self.0.file_name().unwrap().to_string_lossy().into_owned()\n  410 |     }","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/file_upload.rs#L407-L410"}]},{"id":"PANIC_44","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`index_request` uses `index.find(\"<\/head>\").expect(\"Head element to exist\")` and `index.find(\"<\/body>\").expect(\"Body element to exist\")` when injecting the custom head/module-loader script into a user-supplied `custom_index`/`custom_head` HTML document (set via `Config::with_custom_index`/`with_custom_head`). Any app that supplies a custom index without a literal `<\/head>` or `<\/body>` tag (e.g. self-closing markup, different casing, or a template that assembles the body tag dynamically at runtime) causes this to panic on every request for `/`, taking down the webview instead of surfacing a clear configuration error.","fix":"Return a clear startup error instead of panicking deep inside the HTTP request handler, e.g. validate `custom_index`/`custom_head` once during `WebviewInstance::new` and fail fast with a descriptive message, or fall back to appending the tags when missing:\n\n```rust\nlet head_pos = index.find(\"<\/head>\").unwrap_or_else(|| index.len());\n```\n\nAt minimum, replace `.expect(...)` with a `tracing::error!` + graceful fallback so a malformed custom index doesn't crash the running app.","locations":[{"ref":"packages/desktop/src/protocol.rs:116-131","code":"  116 |     // Load a custom index file if provided\n  117 |     let mut index = custom_index.unwrap_or_else(|| DEFAULT_INDEX.to_string());\n  118 | \n  119 |     // Insert a custom head if provided\n  120 |     // We look just for the closing head tag. If a user provided a custom index with weird syntax, this might fail\n  121 |     if let Some(head) = custom_head {\n  122 |         index.insert_str(index.find(\"<\/head>\").expect(\"Head element to exist\"), &head);\n  123 |     }\n  124 | \n  125 |     // Inject our module loader by looking for a body tag\n  126 |     // A failure mode here, obviously, is if the user provided a custom index without a body tag\n  127 |     // Might want to document this\n  128 |     index.insert_str(\n  129 |         index.find(\"<\/body>\").expect(\"Body element to exist\"),\n  130 |         &module_loader(root_name, headless, edit_state),\n  131 |     );","lines":16,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/protocol.rs#L116-L131"}]},{"id":"PANIC_45","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`impl IntoAccelerator for &str` implements `accelerator()` as `HotKey::from_str(self).unwrap()`. `HotKey::from_str` (from the `global_hotkey` crate) returns `Err` for any string that isn't a valid accelerator syntax. Since this trait is reachable from the public `use_global_shortcut`/`DesktopService::create_shortcut` API with an arbitrary `&str` (e.g. a string built from user preferences, a config file, or a typo), a malformed accelerator string panics instead of surfacing a `ShortcutRegistryError`, even though `add_shortcut` already returns a `Result` specifically to report this kind of failure gracefully.","fix":"Since `IntoAccelerator::accelerator()` returns `HotKey` (not a `Result`), plumb the parse failure through instead of unwrapping, e.g. change the trait to return `Result<HotKey, ShortcutRegistryError>` or document that callers must validate the string first. As a minimal fix that still avoids a hard panic:\n\n```rust\nimpl IntoAccelerator for &str {\n    fn accelerator(&self) -> HotKey {\n        HotKey::from_str(self).unwrap_or_else(|_| {\n            tracing::error!(\"Invalid accelerator string: {self:?}\");\n            HotKey::new(None, Code::Unidentified)\n        })\n    }\n}\n```","locations":[{"ref":"packages/desktop/src/shortcut.rs:155-159","code":"  155 | impl IntoAccelerator for &str {\n  156 |     fn accelerator(&self) -> HotKey {\n  157 |         HotKey::from_str(self).unwrap()\n  158 |     }\n  159 | }","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/shortcut.rs#L155-L159"}]},{"id":"PANIC_46","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`set_server_url` panics via `.unwrap()` if called more than once, because `OnceLock::set` returns `Err` when already initialized. This is inconsistent with the sibling function `set_redirect_hook` in `redirect.rs`, which returns a `Result` to let the caller decide how to handle a repeated call instead of panicking.","fix":"```rust\n- pub fn set_server_url(url: &'static str) {\n-     ROOT_URL.set(url).unwrap();\n- }\n+ pub fn set_server_url(url: &'static str) -> Result<(), &'static str> {\n+     ROOT_URL.set(url)\n+ }\n```\nAlternatively, if panicking is intentional for misuse, replace `.unwrap()` with `.expect(\"set_server_url must only be called once\")` so the panic message is actionable.","locations":[{"ref":"packages/fullstack/src/client.rs:500-502","code":"  500 | pub fn set_server_url(url: &'static str) {\n  501 |     ROOT_URL.set(url).unwrap();\n  502 | }","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack/src/client.rs#L500-L502"}]},{"id":"PANIC_47","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`WebSocketOptions::on_upgrade` calls `self.upgrade.unwrap()`, which panics if `on_upgrade` is called on a `WebSocketOptions` that was not produced by the server-side `FromRequest` extraction path (which is the only place `upgrade` is set to `Some`). A user constructing `WebSocketOptions::new()` manually (e.g. for client-side configuration, matching the type's dual client/server role suggested by `with_automatic_reconnect`) and then mistakenly calling `.on_upgrade(...)` instead of using it purely as request options will panic instead of getting a compile-time or documented runtime error.","fix":"Document clearly on `on_upgrade` that it must only be called on a server-extracted `WebSocketOptions`, or make the invariant safer by returning a `Result`/`HttpError` response when `self.upgrade` is `None` instead of panicking.","locations":[{"ref":"packages/fullstack/src/payloads/websocket.rs:554-581","code":"  554 |     #[cfg(feature = \"server\")]\n  555 |     pub fn on_upgrade<F, Fut, In, Out, Enc>(mut self, callback: F) -> Websocket<In, Out, Enc>\n  556 |     where\n  557 |         F: FnOnce(TypedWebsocket<In, Out, Enc>) -> Fut + Send + 'static,\n  558 |         Fut: Future<Output = ()> + 'static,\n  559 |     {\n  560 |         let on_failed_upgrade = self.on_failed_upgrade.take();\n  561 |         let response = self\n  562 |             .upgrade\n  563 |             .unwrap()\n  564 |             .on_failed_upgrade(|e| {\n  565 |                 if let Some(callback) = on_failed_upgrade {\n  566 |                     callback(e);\n  567 |                 }\n  568 |             })\n  569 |             .on_upgrade(|socket| {\n  570 |                 let res = crate::spawn_platform(move || {\n  571 |                     callback(TypedWebsocket {\n  572 |                         _in: PhantomData,\n  573 |                         _out: PhantomData,\n  574 |                         _enc: PhantomData,\n  575 |                         inner: socket,\n  576 |                     })\n  577 |                 });\n  578 |                 async move {\n  579 |                     let _ = res.await;\n  580 |                 }\n  581 |             });","lines":28,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack/src/payloads/websocket.rs#L554-L581"}]},{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"critical","difficulty":"medium","description":"`MultipartFormData` (default type parameter `MultipartFormData<()>`) contains `_client: Option<Rc<FormData>>`, but the type has manual `unsafe impl Send for MultipartFormData {}` and `unsafe impl Sync for MultipartFormData {}`. `Rc<T>` is never `Send`/`Sync` because its reference count is a plain (non-atomic) integer; forcing `Send`/`Sync` onto a struct that can hold a live `Rc` bypasses that guarantee. If a `MultipartFormData` populated via `From<FormEvent>`/`From<Rc<FormData>>` (i.e. `_client: Some(rc)`) is captured into a future that is actually moved across OS threads (e.g. passed through `IntoRequest::into_request`'s `'static` future on a multi-threaded tokio runtime, or a naive `tokio::spawn` elsewhere that only compiles because of this unsafe impl), concurrent non-atomic increments/decrements of the `Rc`'s strong count from different threads is a data race that can under-count or over-count references, leading to premature deallocation while a live reference still exists (use-after-free) or a double free.","fix":"Do not blanket-implement `Send`/`Sync` for a type holding an `Rc`. Either wrap `_client` in `send_wrapper::SendWrapper<Rc<FormData>>` (already used elsewhere in this crate, e.g. `magic.rs`/`stream.rs`) so misuse panics loudly instead of racing, or switch the client-side storage to `Arc<FormData>` if it must genuinely cross threads, and drop the manual `unsafe impl Send/Sync` entirely so the compiler enforces the real thread-safety of whatever type is chosen.","locations":[{"ref":"packages/fullstack/src/payloads/multipart.rs:43-50","code":"   43 | pub struct MultipartFormData<T = ()> {\n   44 |     #[cfg(feature = \"server\")]\n   45 |     form: Option<axum::extract::Multipart>,\n   46 | \n   47 |     _client: Option<Rc<FormData>>,\n   48 | \n   49 |     _phantom: std::marker::PhantomData<T>,\n   50 | }","lines":8,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack/src/payloads/multipart.rs#L43-L50"},{"ref":"packages/fullstack/src/ = self.as_str();\n    if str.is_empty() {\n        return None;\n    }\n    let mut index = str.len() - 1;\n    ...\n```","locations":[{"ref":"packages/const-serialize/src/str.rs:160-163","code":"  160 |     pub const fn rsplit_once(&self, char: char) -> Option<(Self, Self)> {\n  161 |         let str = self.as_str();\n  162 |         let mut index = str.len() - 1;\n  163 |         // First find the bytes we are searching for","lines":4,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/const-serialize/src/str.rs#L160-L163"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`write_attr_comments` computes `attr_span.start().column - 1` on a `usize` without checking for `column == 0`. `column` is 0-indexed, so any attribute that starts as the very first character of its line (e.g. unformatted/minimally-indented rsx being fed through the autoformatter for the first time, such as `div {\\nattr: 1\\n}`) triggers an underflow. In debug/test builds (this workspace does not set `overflow-checks` in `[profile.dev]`, so it defaults on with `debug-assertions`) this panics; in release it silently wraps to `usize::MAX`, and the subsequent `line.get(..huge_number)` returns `None`, silently skipping comment handling instead of failing loudly.","fix":"Use `saturating_sub` to avoid the underflow:\n```rust\nlet row_start = line\n    .get(..attr_span.start().column.saturating_sub(1))\n    .unwrap_or(\"\");\n```","locations":[{"ref":"packages/autofmt/src/writer.rs:667-690","code":"  667 |     fn write_attr_comments(&mut self, brace: &Brace, attr_span: Span) -> Result {\n  668 |         // There's a chance this line actually shares the same line as the previous\n  669 |         // Only write comments if the comments actually belong to this line\n  670 |         //\n  671 |         // to do this, we check if the attr span starts on the same line as the brace constructor that accepts an arbitrary `size`, and this type is used for enum discriminants (`EnumLayout`) and list length fields, whose size is derived from the real Rust type and is not guaranteed to be `<= 4` bytes.","fix":"Either enforce the 4-byte limit explicitly (e.g. `assert!(self.size <= 4)` in `read`/`write`, or in `PrimitiveLayout::new`), or generalize both functions to operate on `u64`/8 bytes so larger discriminant sizes are handled correctly:\n```rust\npub const unsafe fn read(self, byte_ptr: *const u8) -> u64 { /* accumulate into u64 */ }\npub const fn write(self, value: u64, out: &mut [MaybeUninit<u8>]) { let bytes = value.to_ne_bytes(); /* 8 bytes */ }\n```","locations":[{"ref":"packages/const-serialize/src/primitive.rs:20-48","code":"   20 |     pub const unsafe fn read(self, byte_ptr: *const u8) -> u32 {\n   21 |         let mut value = 0;\n   22 |         let mut offset = 0;\n   23 |         while offset < self.size {\n   24 |             // If the bytes are reversed, walk backwards from the end of the number when pushing bytes\n   25 |             let byte = if cfg!(target_endian = \"big\") {\n   26 |                 unsafe {\n   27 |                     byte_ptr\n   28 |                         .wrapping_byte_add((self.size - offset - 1) as _)\n   29 |                         .read()\n   30 |                 }\n   31 |             } else {\n   32 |                 unsafe { byte_ptr.wrapping_byte_add(offset as _).read() }\n   33 |             };\n   34 |             value |= (byte as u32) << (offset * 8);\n   35 |             offset += 1;\n   36 |         }\n   37 |         value\n   38 |     }\n   39 | \n   40 |     /// Write the value to the given buffer\n   41 |     pub const fn write(self, value: u32, out: &mut [MaybeUninit<u8>]) {\n   42 |         let bytes = value.to_ne_bytes();\n   43 |         let mut offset = 0;\n   44 |         while offset < self.size {\n   45 |             out[offset] = MaybeUninit::new(bytes[offset]);\n   46 |             offset += 1;\n   47 |         }\n   48 |     }","lines":29,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/const-serialize/src/primitive.rs#L20-L48"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `Output::render_log`, `let start = start.min(term_size.height - 1);` subtracts 1 from `term_size.height` without a bounds check. If the terminal reports a height of 0 (e.g. a very small/resizing terminal, or a headless PTY briefly reporting a zero size), this underflows the `u16`, which panics in debug builds and silently wraps to `65535` in release builds, corrupting the cursor position math used afterward.","fix":"Use a saturating subtraction:\n```rust\nlet start = start.min(term_size.height.saturating_sub(1));\n```","locations":[{"ref":"packages/cli/src/serve/output.rs:976-977","code":"  976 |             let start = frame_rect.y + idx as u16;\n  977 |             let start = start.min(term_size.height - 1);","lines":2,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/serve/output.rs#L976-L977"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`HotReloadedTemplate::node_paths` and `attr_paths` build byte paths by doing `path.push(idx as u8)` for each child index while walking the template tree. If any element in hot-reloaded code ends up with more than 255 children at one nesting level, `idx as u8` silently truncates/wraps (e.g. index 256 becomes 0), producing a path that collides with an earlier sibling. `mutations.rs` documents the underlying limit explicitly (\"Templates cannot have more than 255 children per element, hence the use of a single byte\"), but this hot-reload path builder has no assertion, so instead of a clear panic/error during development it would silently generate a corrupted/duplicate path, likely causing the wrong DOM node to be mutated the next time hot reload runs on such a template.","fix":"Add a debug assertion (or a proper error) before truncating:\n```rust\ndebug_assert!(idx <= u8::MAX as usize, \"template has more than 255 children at one level, which is unsupported\");\npath.push(idx as u8);\n```","locations":[{"ref":"packages/core/src/hotreload_utils.rs:387-443","code":"  387 |     fn node_paths(roots: &'static [TemplateNode]) -> &'static [&'static [u8]] {\n  388 |         fn add_node_paths(\n  389 |             roots: &[TemplateNode],\n  390 |             node_paths: &mut Vec<&'static [u8]>,\n  391 |             current_path: Vec<u8>,\n  392 |         ) {\n  393 |             for (idx, node) in roots.iter().enumerate() {\n  394 |                 let mut path = current_path.clone();\n  395 |                 path.push(idx as u8);\n  396 |                 match node {\n  397 |                     TemplateNode::Element { children, .. } => {\n  398 |                         add_node_paths(children, node_paths, path);\n  399 |                     }\n  400 |                     TemplateNode::Text { .. } => {}\n  401 |                     TemplateNode::Dynamic { id } => {\n  402 |                         debug_assert_eq!(node_paths.len(), *id);\n  403 |                         node_paths.push(Box::leak(path.into_boxed_slice()));\n  404 |                     }\n  405 |                 }\n  406 |             }\n  407 |         }\n  408 | \n  409 |         let mut node_paths = Vec::new();\n  410 |         add_node_paths(roots, &mut node_paths, Vec::new());\n  411 |         let leaked: &'static [&'static [u8]] = Box::leak(node_paths.into_boxed_slice());\n  412 |         leaked\n  413 |     }\n  414 | \n  415 |     fn attr_paths(roots: &'static [TemplateNode]) -> &'static [&'static [u8]] {\n  416 |         fn add_attr_paths(\n  417 |             roots: &[TemplateNode],\n  418 |             attr_paths: &mut Vec<&'static [u8]>,\n  419 |             current_path: Vec<u8>,\n  420 |         ) {\n  421 |             for (idx, node) in roots.iter().enumerate() {\n  422 |                 let mut path = current_path.clone();\n  423 |                 path.push(idx as u8);\n  424 |                 if let TemplateNode::Element {\n  425 |                     children, attrs, ..\n  426 |                 } = node\n  427 |                 {\n  428 |                     for attr in *attrs {\n  429 |                         if let TemplateAttribute::Dynamic { id } = attr {\n  430 |                             debug_assert_eq!(attr_paths.len(), *id);\n  431 |                             attr_paths.push(Box::leak(path.clone().into_boxed_slice()));\n  432 |                         }\n  433 |                     }\n  434 |                     add_attr_paths(children, attr_paths, path);\n  435 |                 }\n  436 |             }\n  437 |         }\n  438 | \n  439 |         let mut attr_paths = Vec::new();\n  440 |         add_attr_paths(roots, &mut attr_paths, Vec::new());\n  441 |         let leaked: &'static [&'static [u8]] = Box::leak(attr_paths.into_boxed_slice());\n  442 |         leaked\n  443 |     }","lines":57,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/hotreload_utils.rs#L387-L443"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"In the `SerializeConst` derive macro (`const-serialize-macro`), the discriminant byte size computed from `#[repr(u*)]` is wrong for `u32` and `u64`. The code maps `u8 -> 1`, `u16 -> 2`, `u32 -> 3`, `u64 -> 4` (a sequential counter) instead of the actual byte widths `1, 2, 4, 8`. This `discriminant_size` value is fed directly into `#krate::PrimitiveLayout::new(#discriminant_size as usize)`, which `const-serialize/src/primitive.rs` treats as the number of bytes to read/write for the discriminant (see `PrimitiveLayout::size` and its `read`/`write` methods). For any enum annotated `#[repr(u32, ...)]` this causes the discriminant to be serialized/deserialized using only 3 of its 4 bytes, and for `#[repr(u64, ...)]` only 4 of its 8 bytes. `EnumLayout::new` also uses `discriminant.size` to compute `variants_offset` (where the variant's data starts), so the wrong size additionally misaligns/corrupts the offset used to read the rest of the enum's fields, and `deserialize_const_enum` writes into `MaybeUninit<u8>` output leaving some discriminant bytes uninitialized. This is a silent correctness/memory-safety bug in a public macro (`#[derive(SerializeConst)]`) for any `repr(u32)`/`repr(u64)` enum.","fix":"Use actual byte widths instead of a sequential counter:\n```rust\nif meta.path.is_ident(\"u8\") {\n    discriminant_size = Some(1);\n    return Ok(());\n}\nif meta.path.is_ident(\"u16\") {\n    discriminant_size = Some(2);\n    return Ok(());\n}\nif meta.path.is_ident(\"u32\") {\n    discriminant_size = Some(4);\n    return Ok(());\n}\nif meta.path.is_ident(\"u64\") {\n    discriminant_size = Some(8);\n    return Ok(());\n}\n```","locations":[{"ref":"packages/const-serialize-macro/src/lib.rs:113-136","code":"  113 | \n  114 |                             // #[repr(u8)]\n  115 |                             if meta.path.is_ident(\"u8\") {\n  116 |                                 discriminant_size = Some(1);\n  117 |                                 return Ok(());\n  118 |                             }\n  119 | \n  120 |                             // #[repr(u16)]\n  121 |                             if meta.path.is_ident(\"u16\") {\n  122 |                                 discriminant_size = Some(2);\n  123 |                                 return Ok(());\n  124 |                             }\n  125 | \n  126 |                             // #[repr(u32)]\n  127 |                             if meta.path.is_ident(\"u32\") {\n  128 |                                 discriminant_size = Some(3);\n  129 |
