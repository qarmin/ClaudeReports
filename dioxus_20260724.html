 crate path>` and that the parsed Cargo.toml actually contains a `[workspace]` table before treating it as a workspace.","locations":[{"ref":"packages/cli/src/cli/create.rs:145-219","code":"  145 | pub(crate) fn post_create(path: &Path, vcs: &Vcs) -> Result<()> {\n  146 |     let metadata = if let Some(parent_dir) = path.parent() {\n  147 |         match cargo_metadata::MetadataCommand::new()\n  148 |             .current_dir(parent_dir)\n  149 |             .exec()\n  150 |         {\n  151 |             Ok(v) => Some(v),\n  152 |             // Only 1 error means that CWD isn't a cargo project.\n  153 |             Err(cargo_metadata::Error::CargoMetadata { .. }) => None,\n  154 |             Err(err) => {\n  155 |                 anyhow::bail!(\"Couldn't retrieve cargo metadata: {:?}\", err)\n  156 |             }\n  157 |         }\n  158 |     } else {\n  159 |         None\n  160 |     };\n  161 | \n  162 |     // 1. Add the new project to the workspace, if it exists.\n  163 |     //    This must be executed first in order to run `cargo fmt` on the new project.\n  164 |     let is_workspace = metadata.is_some();\n  165 |     metadata.and_then(|metadata| {\n  166 |         let cargo_toml_path = &metadata.workspace_root.join(\"Cargo.toml\");\n  167 |         let cargo_toml_str = std::fs::read_to_string(cargo_toml_path).ok()?;\n  168 |         let relative_path = path.strip_prefix(metadata.workspace_root).ok()?;\n  169 | \n  170 |         let mut cargo_toml: toml_edit::DocumentMut = cargo_toml_str.parse().ok()?;\n  171 |         cargo_toml\n  172 |             .get_mut(\"workspace\")?\n  173 |             .get_mut(\"members\")?\n  174 |             .as_array_mut()?\n  175 |             .push(relative_path.display().to_string());\n  176 | \n  177 |         std::fs::write(cargo_toml_path, cargo_toml.to_string()).ok()\n  178 |     });\n  179 | \n  180 |     // 2. Run `cargo fmt` on the new project.\n  181 |     let mut cmd = Command::new(\"cargo\");\n  182 |     let cmd = cmd.arg(\"fmt\").current_dir(path);\n  183 |     let output = cmd.output().expect(\"failed to execute process\");\n  184 |     if !output.status.success() {\n  185 |         tracing::error!(dx_src = ?TraceSrc::Dev, \"cargo fmt failed\");\n  186 |         tracing::error!(dx_src = ?TraceSrc::Build, \"stdout: {}\", String::from_utf8_lossy(&output.stdout));\n  187 |         tracing::error!(dx_src = ?TraceSrc::Build, \"stderr: {}\", String::from_utf8_lossy(&output.stderr));\n  188 |     }\n  189 | \n  190 |     // 3. Format the `Cargo.toml` and `Dioxus.toml` files.\n  191 |     let toml_paths = [path.join(\"Cargo.toml\"), path.join(\"Dioxus.toml\")];\n  192 |     for toml_path in &toml_paths {\n  193 |         let Ok(toml) = std::fs::read_to_string(toml_path) else {\n  194 |             continue;\n  195 |         };\n  196 | \n  197 |         let mut toml = toml.parse::<toml_edit::DocumentMut>().map_err(|e| {\n  198 |             anyhow::anyhow!(\"failed to parse toml at {}: {}\", toml_path.display(), e)\n  199 |         })?;\n  200 | \n  201 |         toml.as_table_mut().fmt();\n  202 | \n  203 |         let as_string = toml.to_string();\n  204 |         let new_string = remove_triple_newlines(&as_string);\n  205 |         let mut file = std::fs::File::create(toml_path)?;\n  206 |         file.write_all(new_string.as_bytes())?;\n  207 |     }\n  208 | \n  209 |     // 4. Remove any triple newlines from the readme.\n  210 |     let readme_path = path.join(\"README.md\");\n  211 |     let readme = std::fs::read_to_string(&readme_path)?;\n  212 |     let new_readme = remove_triple_newlines(&readme);\n  213 |     let mut file = std::fs::File::create(readme_path)?;\n  214 |     file.write_all(new_readme.as_bytes())?;\n  215 | \n  216 |     // 5. Run git init\n  217 |     if !is_workspace {\n  218 |         vcs.initialize(path, Some(\"main\"), true)?;\n  219 |     }","lines":75,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/cli/create.rs#L145-L219"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `add_hash_to_asset`, the asset hash bytes are formatted with `format!(\"{byte:x}\")`, which omits the leading zero for byte values below 0x10. Because the per-byte hex strings are concatenated directly (no separator, no fixed width), two different hash byte sequences can produce the *same* string, e.g. bytes `[0x1, 0x23]` -> \"1\"+\"23\" = \"123\" and bytes `[0x12, 0x3]` -> \"12\"+\"3\" = \"123\". This silently reduces the effective collision resistance of the `-dxh<hash>` suffix used to cache-bust and disambiguate bundled asset filenames. Combined with `process_folder`'s parallel (`rayon`) processing in `packages/cli/src/opt/folder.rs`, two differently-hashed assets that collide to the same formatted string can race on the same `partial.<name>` temp file / final output path in `process_file_to` (`packages/cli/src/opt/file.rs`), corrupting one asset with another's contents.","fix":"Zero-pad each byte to two hex digits so the mapping from bytes to string is unambiguous:\n```rust\nlet hash = hash\n    .iter()\n    .map(|byte| format!(\"{byte:02x}\"))\n    .collect::<String>();\n```","locations":[{"ref":"packages/cli/src/opt/hash.rs:155-159","code":"  155 |             let hash = hash.bytes();\n  156 |             let hash = hash\n  157 |                 .iter()\n  158 |                 .map(|byte| format!(\"{byte:x}\"))\n  159 |                 .collect::<String>();","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/opt/hash.rs#L155-L159"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`CargoDependency::Detailed.default_features` is declared as `#[serde(default, skip_serializing_if = \"std::ops::Not::not\")] default_features: bool`. Because plain `#[serde(default)]` on a `bool` yields `false`, any component manifest that specifies a detailed cargo dependency (e.g. `{ name = \"foo\", version = \"1.0\" }`) without explicitly writing `default_features = true` will deserialize `default_features` as `false`. In `CargoDependency::add_command` (`if !*default_features { cmd.arg(\"--no-default-features\"); }`), this silently appends `--no-default-features` to the generated `cargo add` command in `packages/cli/src/cli/component.rs::add_rust_dependencies`, disabling the dependency's default features even though the manifest author never asked for that - the opposite of Cargo's own default behavior (which keeps default features unless explicitly disabled).","fix":"Give `default_features` a `true` default so omitting the field matches Cargo's own semantics:\n```rust\n#[serde(default = \"default_true\", skip_serializing_if = \"std::ops::Not::not\")]\ndefault_features: bool,\n```\nand add `fn default_true() -> bool { true }` (adjusting `skip_serializing_if` if the serialized form should now omit `true` instead of `false`).","locations":[{"ref":"packages/component-manifest/src/lib.rs:49-66","code":"   49 | #[derive(Deserialize, Serialize, JsonSchema, Clone, Debug, PartialEq, Eq, Hash)]\n   50 | #[serde(untagged)]\n   51 | pub enum CargoDependency {\n   52 |     Simple(String),\n   53 |     Detailed {\n   54 |         name: String,\n   55 |         #[serde(default)]\n   56 |         version: Option<String>,\n   57 |         #[serde(default, skip_serializing_if = \"Vec::is_empty\")]\n   58 |         features: Vec<String>,\n   59 |         #[serde(default, skip_serializing_if = \"std::ops::Not::not\")]\n   60 |         default_features: bool,\n   61 |         #[serde(default, skip_serializing_if = \"Option::is_none\")]\n   62 |         git: Option<String>,\n   63 |         #[serde(default, skip_serializing_if = \"Option::is_none\")]\n   64 |         rev: Option<String>,\n   65 |     },\n   66 | }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/component-manifest/src/lib.rs#L49-L66"},{"ref":"packages/component-manifest/src/lib.rs:92-97","code":"   92 |                 if !features.is_empty() {\n   93 |                     cmd.arg(\"--features\").arg(features.join(\",\"));\n   94 |                 }\n   95 |                 if !*default_features {\n   96 |                     cmd.arg(\"--no-default-features\");\n   97 |                 }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/component-manifest/src/lib.rs#L92-L97"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ReactiveContext::run_in` pushes `*self` onto the thread-local `CURRENT` stack, calls `f()`, then pops the stack and calls `self.update_subscribers()`. None of this is panic-safe: if `f()` panics (which is a supported, documented scenario in this codebase - components are rendered inside `std::panic::catch_unwind` in `any_props.rs`, and reactive closures such as `use_memo`/`use_selector` closures run inside `run_in`), the `pop()` call and the `self.update_subscribers()` call are skipped. The stale `ReactiveContext` entry is left on `CURRENT` forever (for the lifetime of the thread), so every subsequent, unrelated call to `ReactiveContext::current()` will return this stale/wrong context until something else happens to push and correctly pop over it. This corrupts subscription bookkeeping silently: unrelated signal reads elsewhere in the app can end up subscribing the wrong (possibly already-dropped) reactive context, causing missed updates or updates delivered to the wrong component.","fix":"Use a drop guard so the stack is always popped, even on panic:\n```rust\npub fn run_in<O>(&self, f: impl FnOnce() -> O) -> O {\n    struct PopOnDrop;\n    impl Drop for PopOnDrop {\n        fn drop(&mut self) {\n            CURRENT.with(|current| { current.borrow_mut().pop(); });\n        }\n    }\n\n    CURRENT.with(|current| current.borrow_mut().push(*self));\n    let _guard = PopOnDrop;\n    let out = f();\n    drop(_guard);\n    self.update_subscribers();\n    out\n}\n```\nAlternatively wrap the call in `std::panic::catch_unwind`/`scopeguard::guard` so the pop always runs before the panic continues to unwind.","locations":[{"ref":"packages/core/src/reactive_context.rs:204-210","code":"  204 |     pub fn run_in<O>(&self, f: impl FnOnce() -> O) -> O {\n  205 |         CURRENT.with(|current| current.borrow_mut().push(*self));\n  206 |         let out = f();\n  207 |         CURRENT.with(|current| current.borrow_mut().pop());\n  208 |         self.update_subscribers();\n  209 |         out\n  210 |     }","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/reactive_context.rs#L204-L210"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `packages/desktop/src/default_icon.rs`, the `path()` implementations for `DioxusTrayIcon`, `DioxusMenuIcon`, and `Icon` accept an optional `size: Option<(u32, u32)>` but never actually resize the decoded image. `load_image_from_path` returns `(img, width, height)` where `img` is an RGBA byte buffer whose length is `width * height * 4`. When `size` is `Some((width, height))`, the code shadows the outer `width`/`height` with the requested size and calls `from_rgba(img, width, height)` - passing the *original*, un-resized pixel buffer together with the *requested* dimensions. Both the `if` and `else` branches are otherwise identical, so the only effect of supplying `size` is to mismatch the buffer length against the claimed width/height. Since icon backends (`tao::window::Icon::from_rgba`, `tray-icon`, etc.) validate that `buffer.len() == width * height * 4`, any call with a `size` different from the source image's actual dimensions will return an `Err` (or otherwise produce a corrupted icon) instead of resizing the image as the API implies. This makes the public `icon_from_path(path, Some(size))` API effectively broken whenever `size` differs from the file's native dimensions.","fix":"Actually resize the decoded image to the requested size before building the icon, e.g.:\n```rust\nfn path<P: AsRef<Path>>(path: P, size: Option<(u32, u32)>) -> Result<Self> {\n    let img = ImageReader::open(path)?.decode()?;\n    let (img, width, height) = match size {\n        Some((w, h)) => (img.resize_exact(w, h, image::imageops::FilterType::Lanczos3), w, h),\n        None => {\n            let (w, h) = img.dimensions();\n            (img, w, h)\n        }\n    };\n    Ok(Icon::from_rgba(img.to_rgba8().to_vec(), width, height)?)\n}\n```\nApply the same fix to all three copies (`DioxusTrayIcon`, `DioxusMenuIcon`, `Icon`), or factor the shared logic into `load_image_from_path` so there is only one implementation to fix.","locations":[{"ref":"packages/desktop/src/default_icon.rs:68-78","code":"   68 |     fn path<P: AsRef<Path>>(path: P, size: Option<(u32, u32)>) -> Result<Self>\n   69 |     where\n   70 |         Self: Sized,\n   71 |     {\n   72 |         let (img, width, height) = load_image_from_path(path)?;\n   73 |         if let Some((width, height)) = size {\n   74 |             Ok(DioxusTrayIcon::from_rgba(img, width, height)?)\n   75 |         } else {\n   76 |             Ok(DioxusTrayIcon::from_rgba(img, width, height)?)\n   77 |         }\n   78 |     }","lines":11,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/default_icon.rs#L68-L78"},{"ref":"packages/desktop/src/default_icon.rs:110-120","code":"  110 |     fn path<P: AsRef<Path>>(path: P, size: Option<(u32, u32)>) -> Result<Self>\n  111 |     where\n  112 |         Self: Sized,\n  113 |     {\n  114 |         let (img, width, height) = load_image_from_path(path)?;\n  115 |         if let Some((width, height)) = size {\n  116 |             Ok(DioxusMenuIcon::from_rgba(img, width, height)?)\n  117 |         } else {\n  118 |             Ok(DioxusMenuIcon::from_rgba(img, width, height)?)\n  119 |         }\n  120 |     }","lines":11,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/default_icon.rs#L110-L120"},{"ref":"packages/desktop/src/default_icon.rs:153-163","code":"  153 |     fn path<P: AsRef<Path>>(path: P, size: Option<(u32, u32)>) -> Result<Self>\n  154 |     where\n  155 |         Self: Sized,\n  156 |     {\n  157 |         let (img, width, height) = load_image_from_path(path)?;\n  158 |         if let Some((width, height)) = size {\n  159 |             Ok(Icon::from_rgba(img, width, height)?)\n  160 |         } else {\n  161 |             Ok(Icon::from_rgba(img, width, height)?)\n  162 |         }\n  163 |     }","lines":11,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/default_icon.rs#L153-L163"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Setting `IncrementalRendererConfig::memory_cache_limit(0)` silently disables reads from the on-disk ISR cache entirely, even though the file system cache is still being written to.\n\n`InMemoryCache::new` stores `lru: None` when `NonZeroUsize::new(memory_cache_limit)` is `None` (i.e. `memory_cache_limit == 0`). In `try_get_or_insert` (`packages/fullstack-server/src/isrg/memory_cache.rs:50-88`), the `or_insert` closure - which is the only place that actually queries `FileSystemCache::get` (see `IncrementalRenderer::get` in `mod.rs:105-146`) - is passed to `self.lru.as_mut()...try_get_or_insert(...)`. When `self.lru` is `None`, that whole branch is skipped and the function falls straight through to `Ok(None)` at the bottom without ever calling `or_insert`.\n\nThis means a user who configures `.memory_cache_limit(0)` (e.g. intending \"don't cache in memory, but keep the persisted file-system cache for durability across restarts\") gets a complete cache miss on every single request: `cache()`/`put()` still writes the html to disk, but `get()` never checks disk when the in-memory LRU is disabled, so every request pays the full render cost and the `IncrementalRendererConfig` feature is effectively broken for that configuration.","fix":"Restructure `IncrementalRenderer::get` so the file-system cache lookup does not depend on the in-memory LRU being enabled - e.g. check the file system cache directly when `self.lru` is `None` (or always check it first, then use the memory cache only for eviction/perf on top), rather than relying on `InMemoryCache::try_get_or_insert`'s closure as the sole trigger for the disk lookup.","locations":[{"ref":"packages/fullstack-server/src/isrg/memory_cache.rs:45-88","code":"   45 |     pub fn try_get_or_insert<'a, F: FnOnce() -> Result<(DateTime<Utc>, Vec<u8>), E>, E>(\n   46 |         &'a mut self,\n   47 |         route: &str,\n   48 |         or_insert: F,\n   49 |     ) -> Result<Option<(RenderFreshness, &'a [u8])>, E> {\n   50 |         if let Some(memory_cache) = self.lru.as_mut() {\n   51 |             let (timestamp, _) = memory_cache.try_get_or_insert(route.to_string(), or_insert)?;\n   52 | \n   53 |             let now = Utc::now();\n   54 |             let elapsed = timestamp.signed_duration_since(now);\n   55 |             let age = elapsed.num_seconds();\n   56 |             // The cache entry is out of date, so we need to remove it.\n   57 |             if let Some(invalidate_after) = self.invalidate_after {\n   58 |                 // If we can't convert to a std duration, the duration is negative and hasn't elapsed yet.\n   59 |                 if let Ok(std_elapsed) = elapsed.to_std()\n   60 |                     && std_elapsed > invalidate_after\n   61 |                 {\n   62 |                     tracing::trace!(\"memory cache out of date\");\n   63 |                     memory_cache.pop(route);\n   64 |                     return Ok(None);\n   65 |                 }\n   66 |             }\n   67 | \n   68 |             // We need to reborrow because we may have invalidated the lifetime if the route was removed.\n   69 |             // We know it wasn't because we returned... but rust doesn't understand that.\n   70 |             let (timestamp, cache_hit) = memory_cache.get(route).unwrap();\n   71 | \n   72 |             return match self.invalidate_after {\n   73 |                 Some(invalidate_after) => {\n   74 |                     tracing::trace!(\"memory cache hit\");\n   75 |                     let max_age = invalidate_after.as_secs();\n   76 |                     let freshness = RenderFreshness::new(age as u64, max_age, *timestamp);\n   77 |                     Ok(Some((freshness, cache_hit)))\n   78 |                 }\n   79 |                 None => {\n   80 |                     tracing::trace!(\"memory cache hit\");\n   81 |                     let freshness = RenderFreshness::new_age(age as u64, *timestamp);\n   82 |                     Ok(Some((freshness, cache_hit)))\n   83 |                 }\n   84 |             };\n   85 |         }\n   86 | \n   87 |         Ok(None)\n   88 |     }","lines":44,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/isrg/memory_cache.rs#L45-L88"},{"ref":"packages/fullstack-server/src/isrg/mod.rs:105-146","code":"  105 |     pub fn get<'a>(\n  106 |         &'a mut self,\n  107 |         route: &str,\n  108 |     ) -> Result<Option<CachedRender<'a>>, IncrementalRendererError> {\n  109 |         let Self {\n  110 |             memory_cache,\n  111 |             #[cfg(not(target_arch = \"wasm32\"))]\n  112 |             file_system_cache,\n  113 |             ..\n  114 |         } = self;\n  115 | \n  116 |         #[allow(unused)]\n  117 |         enum FsGetError {\n  118 |             NotPresent,\n  119 |             Error(IncrementalRendererError),\n  120 |         }\n  121 | \n  122 |         // The borrow checker prevents us from simply using a match/if and returning early. Instead we need to use the more complex closure API\n  123 |         // non lexical lifetimes will make this possible (it works with polonius)\n  124 |         let or_insert = || {\n  125 |             // check the file cache\n  126 |             #[cfg(not(target_arch = \"wasm32\"))]\n  127 |             return match file_system_cache.get(route) {\n  128 |                 Ok(Some((freshness, bytes))) => Ok((freshness.timestamp(), bytes)),\n  129 |                 Ok(None) => Err(FsGetError::NotPresent),\n  130 |                 Err(e) => Err(FsGetError::Error(e)),\n  131 |             };\n  132 | \n  133 |             #[allow(unreachable_code)]\n  134 |             Err(FsGetError::NotPresent)\n  135 |         };\n  136 | \n  137 |         match memory_cache.try_get_or_insert(route, or_insert) {\n  138 |             Ok(Some((freshness, bytes))) => Ok(Some(CachedRender {\n  139 |                 route: route.to_string(),\n  140 |                 freshness,\n  141 |                 response: bytes,\n  142 |             })),\n  143 |             Err(FsGetError::NotPresent) | Ok(None) => Ok(None),\n  144 |             Err(FsGetError::Error(e)) => Err(e),\n  145 |         }\n  146 |     }","lines":42,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/isrg/mod.rs#L105-L146"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `InMemoryCache::try_get_or_insert`, the age/elapsed computation has the subtraction order inverted, which breaks both the `Age` header value and the `invalidate_after` expiry check for the in-memory ISR cache.\n\n`elapsed` is computed as `timestamp.signed_duration_since(now)`, i.e. `timestamp - now`. Since `timestamp` is always the time the entry was *created* (set via `Utc::now()` at write time in `IncrementalRenderer::cache`), by the time `get()` runs later, `timestamp` is always in the past, so `elapsed` is always negative (or zero).\n\nTwo bugs follow from this:\n1. `elapsed.to_std()` (`chrono::TimeDelta::to_std`) returns `Err` for negative durations. Since `elapsed` is essentially always negative for real cache lookups, `if let Ok(std_elapsed) = elapsed.to_std()` is essentially always false, so the `invalidate_after` expiry branch (lines 57-66) never actually fires for normal entries - the memory cache never expires content by age, only by LRU eviction, regardless of the configured `invalidate_after`. The comment on line 58 (\"If we can't convert to a std duration, the duration is negative and hasn't elapsed yet\") states the opposite of reality: a negative `elapsed` here means the timestamp *is* in the past (has elapsed), not that it hasn't.\n2. `age` (`elapsed.num_seconds()`) is negative for real entries, and it is cast directly with `age as u64` at lines 76 and 81. Casting a negative `i64` to `u64` wraps around to a huge number near `u64::MAX`, so the `Age` HTTP header written via `RenderFreshness::write` will contain a nonsensical huge value instead of the number of seconds since the entry was cached.\n\nContrast this with `fs_cache.rs`'s `ValidCachedPath::freshness` (`self.timestamp.elapsed()`, i.e. `now - self`, always positive) and `freshness.rs`'s `RenderFreshness::created_at` (which correctly uses `.unsigned_abs()` to normalize the sign) - both compute the age correctly. `memory_cache.rs` is the only one of the three that gets it wrong.","fix":"Compute elapsed the other way around, e.g.:\n```rust\nlet now = Utc::now();\nlet elapsed = now.signed_duration_since(timestamp);\nlet age = elapsed.num_seconds().max(0) as u64;\n```\nAnd use `elapsed.to_std()` on the now-positive duration (or just compare `elapsed.num_seconds()` against `invalidate_after.as_secs() as i64` directly) so the `invalidate_after` branch actually triggers for aged-out entries. This also fixes the `Age` header wraparound since `age` is guaranteed non-negative before the `as u64` cast.","locations":[{"ref":"packages/fullstack-server/src/isrg/memory_cache.rs:53-66","code":"   53 |             let now = Utc::now();\n   54 |             let elapsed = timestamp.signed_duration_since(now);\n   55 |             let age = elapsed.num_seconds();\n   56 |             // The cache entry is out of date, so we need to remove it.\n   57 |             if let Some(invalidate_after) = self.invalidate_after {\n   58 |                 // If we can't convert to a std duration, the duration is negative and hasn't elapsed yet.\n   59 |                 if let Ok(std_elapsed) = elapsed.to_std()\n   60 |                     && std_elapsed > invalidate_after\n   61 |                 {\n   62 |                     tracing::trace!(\"memory cache out of date\");\n   63 |                     memory_cache.pop(route);\n   64 |                     return Ok(None);\n   65 |                 }\n   66 |             }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/isrg/memory_cache.rs#L53-L66"},{"ref":"packages/fullstack-server/src/isrg/memory_cache.rs:70-84","code":"   70 |             let (timestamp, cache_hit) = memory_cache.get(route).unwrap();\n   71 | \n   72 |             return match self.invalidate_after {\n   73 |                 Some(invalidate_after) => {\n   74 |                     tracing::trace!(\"memory cache hit\");\n   75 |                     let max_age = invalidate_after.as_secs();\n   76 |                     let freshness = RenderFreshness::new(age as u64, max_age, *timestamp);\n   77 |                     Ok(Some((freshness, cache_hit)))\n   78 |                 }\n   79 |                 None => {\n   80 |                     tracing::trace!(\"memory cache hit\");\n   81 |                     let freshness = RenderFreshness::new_age(age as u64, *timestamp);\n   82 |                     Ok(Some((freshness, cache_hit)))\n   83 |                 }\n   84 |             };","lines":15,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-server/src/isrg/memory_cache.rs#L70-L84"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`copy_external_binaries` resolves each configured `external_bin` entry as `PathBuf::from(format!(\"{bin}-{target}\"))` and only checks `src.exists()` relative to the process's current working directory - it never joins the path against `self.build.crate_dir()`. Likewise, in `BundleContext::new`, custom `bundle.resources` entries are inserted into `resources_map` as the raw config string (`resources_map.insert(resource_path.clone(), String::new())`), and later consumed by `copy_resources` via `PathBuf::from(src)` with no `crate_dir()` join either. Every other config-relative path in this same file (`icon_files`, `add_linux_deb_data`'s `deb_settings.files`, `resolve_path`) is explicitly resolved against `crate_dir()`. The CLI never calls `std::env::set_current_dir`, so when `dx bundle` is run from a workspace root (a very common layout for multi-crate Cargo workspaces) rather than from inside the target crate's directory, these two relative-path lookups silently miss (the `if src.exists()` / `if !src_path.exists() { warn!(...); continue; }` guards just skip them), producing a bundle silently missing its configured external binaries and/or extra resources.","fix":"Resolve relative paths against `self.crate_dir()` (mirroring `icon_files()`), e.g. in `copy_external_binaries`:\n```rust\nlet src = self.crate_dir().join(format!(\"{bin}-{target}\"));\n```\nand in the `bundle.resources` merge step in `new()`:\n```rust\nfor resource_path in resources {\n    let abs = if Path::new(resource_path).is_absolute() {\n        PathBuf::from(resource_path)\n    } else {\n        build.crate_dir().join(resource_path)\n    };\n    resources_map.insert(abs.display().to_string(), String::new());\n}\n```","locations":[{"ref":"packages/cli/src/bundler/mod.rs:65-70","code":"   65 |         // Merge in any custom resources from config\n   66 |         if let Some(resources) = &build.config.bundle.resources {\n   67 |             for resource_path in resources {\n   68 |                 resources_map.insert(resource_path.clone(), String::new());\n   69 |             }\n   70 |         }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/bundler/mod.rs#L65-L70"},{"ref":"packages/cli/src/bundler/mod.rs:363-406","code":"  363 |     /// Copy resources to the given path.\n  364 |     pub(crate) fn copy_resources(&self, dest: &Path) -> Result<()> {\n  365 |         for (src, target) in &self.resources_map {\n  366 |             let src_path = PathBuf::from(src);\n  367 |             if !src_path.exists() {\n  368 |                 tracing::warn!(\"Resource not found: {src}\");\n  369 |                 continue;\n  370 |             }\n  371 |             let dest_path = if target.is_empty() {\n  372 |                 dest.join(src_path.file_name().unwrap_or_default())\n  373 |             } else {\n  374 |                 dest.join(target)\n  375 |             };\n  376 |             if let Some(parent) = dest_path.parent() {\n  377 |                 std::fs::create_dir_all(parent)?;\n  378 |             }\n  379 |             std::fs::copy(&src_path, &dest_path).with_context(|| {\n  380 |                 format!(\"Failed to copy resource {src} -> {}\", dest_path.display())\n  381 |             })?;\n  382 |         }\n  383 |         Ok(())\n  384 |     }\n  385 | \n  386 |     /// Copy external binaries to the given path.\n  387 |     pub(crate) fn copy_external_binaries(&self, dest: &Path) -> Result<Vec<PathBuf>> {\n  388 |         let mut paths = Vec::new();\n  389 |         if let Some(bins) = &self.build.config.bundle.external_bin {\n  390 |             let target = self.target();\n  391 |             for bin in bins {\n  392 |                 let src = PathBuf::from(format!(\"{bin}-{target}\"));\n  393 |                 if src.exists() {\n  394 |                     let dest_name = src\n  395 |                         .file_name()\n  396 |                         .unwrap()\n  397 |                         .to_string_lossy()\n  398 |                         .replace(&format!(\"-{target}\"), \"\");\n  399 |                     let dest_path = dest.join(dest_name);\n  400 |                     std::fs::copy(&src, &dest_path)?;\n  401 |                     paths.push(dest_path);\n  402 |                 }\n  403 |             }\n  404 |         }\n  405 |         Ok(paths)\n  406 |     }","lines":44,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/bundler/mod.rs#L363-L406"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `TraceController::enroll_reporter`, the session-refresh check calls `reporter.last_used.duration_since(SystemTime::now())` instead of `SystemTime::now().duration_since(reporter.last_used)`. `SystemTime::duration_since` computes `self - earlier` and returns an `Err` when `self` is earlier than the argument. Since `last_used` is essentially always in the past relative to `now()`, this call almost always returns `Err`, and `.unwrap_or(true)` then treats every invocation as \"older than 30 minutes\", forcing `session_id` to be regenerated on every single CLI run. This defeats the entire purpose of the 30-minute session-continuity window used for telemetry grouping.","fix":"Swap the operands so the duration is computed the correct direction:\n```rust\nif SystemTime::now()\n    .duration_since(reporter.last_used)\n    .map(|d| d.as_secs() > (30 * 60))\n    .unwrap_or(true)\n{\n    ...\n}\n```","locations":[{"ref":"packages/cli/src/logging.rs:616-628","code":"  616 |         // Update the last used time to now, updating the session ID if it's older than 30 minutes.\n  617 |         if reporter\n  618 |             .last_used\n  619 |             .duration_since(SystemTime::now())\n  620 |             .map(|d| d.as_secs() > (30 * 60))\n  621 |             .unwrap_or(true)\n  622 |         {\n  623 |             reporter.created_at = SystemTime::now();\n  624 |             reporter.session_id = Uuid::new_v7(uuid::Timestamp::now(\n  625 |                 uuid::timestamp::context::ContextV7::new(),\n  626 |             ));\n  627 |         }\n  628 |         reporter.last_used = SystemTime::now();","lines":13,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/logging.rs#L616-L628"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `Output::push_ws_message`, `ClientMsg::Log { messages, .. }` can carry multiple log messages, but only `messages.first()` is used and the rest are silently discarded (the author even left a `// FIXME(jon): why are we pulling only the first message here?` marker). Any client-side log call that batches multiple lines into one `ClientMsg::Log` will have all but the first line dropped from the dev-server TUI/log output.","fix":"Iterate over all messages instead of only the first one:\n```rust\nfor content in messages {\n    self.push_log(TraceMsg::text(TraceSrc::App(bundle), level, content));\n}\n```","locations":[{"ref":"packages/cli/src/serve/output.rs:400-417","code":"  400 |         let ClientMsg::Log { level, messages } = msg else {\n  401 |             return;\n  402 |         };\n  403 | \n  404 |         // FIXME(jon): why are we pulling only the first message here?\n  405 |         let content = messages.first().unwrap_or(&String::new()).clone();\n  406 | \n  407 |         let level = match level.as_str() {\n  408 |             \"trace\" => Level::TRACE,\n  409 |             \"debug\" => Level::DEBUG,\n  410 |             \"info\" => Level::INFO,\n  411 |             \"warn\" => Level::WARN,\n  412 |             \"error\" => Level::ERROR,\n  413 |             _ => Level::INFO,\n  414 |         };\n  415 | \n  416 |         // We don't care about logging the app's message so we directly push it instead of using tracing.\n  417 |         self.push_log(TraceMsg::text(TraceSrc::App(bundle), level, content));","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/serve/output.rs#L400-L417"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`VirtualDom::pop_work` decides whether to rerun a dirty scope or poll a queued task by comparing the top `ScopeOrder` of `dirty_scopes` against the top order of `dirty_tasks`. The module-level doc explicitly states dirty scopes are \"the highest priority tasks\" and must run before tasks belonging to the same or a descendant scope, specifically to avoid \"running queued work after it could be dropped\". `ScopeOrder`'s `Ord` impl orders first by `height` then by `id`, so `Ordering::Equal` is only possible when `scope` and `tasks_order` refer to the literal same scope (dirty AND has a queued task at the same time). In that tie case, the match arm groups `Equal` together with `Greater` and chooses `Work::PollTask`, i.e. it polls the task for a scope that is itself due to rerun, before rerunning that scope - the opposite of the documented \"dirty scopes run first\" priority for that scope's own pending work.","fix":"Group the tie case with `Less` (favor rerunning the scope first) instead of `Greater`:\n```rust\nmatch scope.cmp(tasks_order) {\n    std::cmp::Ordering::Less | std::cmp::Ordering::Equal => {\n        let scope = self.dirty_scopes.pop_first().unwrap();\n        Some(Work::RerunScope(scope))\n    }\n    std::cmp::Ordering::Greater => {\n        Some(Work::PollTask(self.pop_task().unwrap()))\n    }\n}\n```\nVerify against the existing scheduler tests/issue references in the module doc comment before changing, since this ordering is security-sensitive for task-cancellation correctness.","locations":[{"ref":"packages/core/src/scheduler.rs:178-223","code":"  178 |     /// Take any work from the highest scope. This may include rerunning the scope and/or running tasks\n  179 |     pub(crate) fn pop_work(&mut self) -> Option<Work> {\n  180 |         let dirty_scope = self.dirty_scopes.first();\n  181 |         // Make sure the top dirty scope is valid\n  182 |         #[cfg(debug_assertions)]\n  183 |         if let Some(scope) = dirty_scope {\n  184 |             assert!(self.scopes.contains(scope.id.0));\n  185 |         }\n  186 | \n  187 |         // Find the height of the highest dirty scope\n  188 |         let dirty_task = {\n  189 |             let mut dirty_tasks = self.runtime.dirty_tasks.borrow_mut();\n  190 |             let mut dirty_task = dirty_tasks.first();\n  191 |             // Pop any invalid tasks off of each dirty scope;\n  192 |             while let Some(task) = dirty_task {\n  193 |                 if task.tasks_queued.borrow().is_empty() {\n  194 |                     dirty_tasks.pop_first();\n  195 |                     dirty_task = dirty_tasks.first()\n  196 |                 } else {\n  197 |                     break;\n  198 |                 }\n  199 |             }\n  200 |             dirty_task.map(|task| task.order)\n  201 |         };\n  202 | \n  203 |         match (dirty_scope, dirty_task) {\n  204 |             (Some(scope), Some(task)) => {\n  205 |                 let tasks_order = task.borrow();\n  206 |                 match scope.cmp(tasks_order) {\n  207 |                     std::cmp::Ordering::Less => {\n  208 |                         let scope = self.dirty_scopes.pop_first().unwrap();\n  209 |                         Some(Work::RerunScope(scope))\n  210 |                     }\n  211 |                     std::cmp::Ordering::Equal | std::cmp::Ordering::Greater => {\n  212 |                         Some(Work::PollTask(self.pop_task().unwrap()))\n  213 |                     }\n  214 |                 }\n  215 |             }\n  216 |             (Some(_), None) => {\n  217 |                 let scope = self.dirty_scopes.pop_first().unwrap();\n  218 |                 Some(Work::RerunScope(scope))\n  219 |             }\n  220 |             (None, Some(_)) => Some(Work::PollTask(self.pop_task().unwrap())),\n  221 |             (None, None) => None,\n  222 |         }\n  223 |     }","lines":46,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/scheduler.rs#L178-L223"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`App::disable_dma_buf` is documented as disabling DMA-BUF rendering \"on Linux Wayland sessions\" and only performs the `/dev/dri` + `XDG_SESSION_TYPE == \"wayland\"` detection to decide whether to set `WEBKIT_DISABLE_DMABUF_RENDERER`. However the following `std::env::set_var(\"GDK_BACKEND\", \"x11\")` call sits *outside* that Wayland check and runs unconditionally whenever `cfg!(target_os = \"linux\")` and `self.disable_dma_buf_on_wayland` (which defaults to `true`) are true - i.e. on every Linux session, Wayland or not. So by default every Dioxus desktop app on Linux forces GTK into the X11/XWayland backend even on machines that aren't running Wayland at all (harmless there) and, more importantly, even on Wayland sessions where the `/dev/dri` + session-type probe fails to detect Wayland for some reason it still forces XWayland - the two checks are inconsistent with each other and with the function's stated purpose.","fix":"Gate the `GDK_BACKEND` override behind the same Wayland detection used for the DMA-BUF env var so the two stay consistent:\n\n```rust\nfn disable_dma_buf(&self) {\n    if cfg!(target_os = \"linux\") && self.disable_dma_buf_on_wayland {\n        static INIT: std::sync::Once = std::sync::Once::new();\n        INIT.call_once(|| {\n            let is_wayland = std::path::Path::new(\"/dev/dri\").exists()\n                && std::env::var(\"XDG_SESSION_TYPE\").unwrap_or_default() == \"wayland\";\n            if is_wayland {\n                unsafe {\n                    std::env::set_var(\"WEBKIT_DISABLE_DMABUF_RENDERER\", \"1\");\n                    std::env::set_var(\"GDK_BACKEND\", \"x11\");\n                }\n            }\n        });\n    }\n}\n```","locations":[{"ref":"packages/desktop/src/app.rs:612-632","code":"  612 |     /// Disable DMA buffer rendering on Linux Wayland sessions to avoid bugs with WebKitGTK\n  613 |     fn disable_dma_buf(&self) {\n  614 |         if cfg!(target_os = \"linux\") && self.disable_dma_buf_on_wayland {\n  615 |             static INIT: std::sync::Once = std::sync::Once::new();\n  616 |             INIT.call_once(|| {\n  617 |                 if std::path::Path::new(\"/dev/dri\").exists()\n  618 |                     && std::env::var(\"XDG_SESSION_TYPE\").unwrap_or_default() == \"wayland\"\n  619 |                 {\n  620 |                     // Gnome Webkit is currently buggy under Wayland and KDE, so we will run it with XWayland mode.\n  621 |                     // See: https://github.com/DioxusLabs/dioxus/issues/3667\n  622 |                     unsafe {\n  623 |                         // Disable explicit sync for NVIDIA drivers on Linux when using Way\n  624 |                         std::env::set_var(\"WEBKIT_DISABLE_DMABUF_RENDERER\", \"1\");\n  625 |                     }\n  626 |                 }\n  627 |                 unsafe {\n  628 |                     std::env::set_var(\"GDK_BACKEND\", \"x11\");\n  629 |                 }\n  630 |             });\n  631 |         }\n  632 |     }","lines":21,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/app.rs#L612-L632"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`HTMLData::create_entry` hands out ids from `self.cursor` (starting at 1) and increments it, but `HTMLData::extend` (used by `HydrationContext::extend`) appends another context's entire `data`/`debug_types`/`debug_locations` vectors without ever advancing `self.cursor`. If `create_entry`/`create_entry_with_id` is called on the same `HydrationContext` again after an `extend`, the returned id can collide with an index that was just populated by the merged-in data, and the later `insert` on that id will silently overwrite the previously extended entry (data corruption between two independently-serialized suspense subtrees). The only current caller (`extract_from_suspense_boundary` in `fullstack-server/src/ssr.rs`) happens to never create further entries on the aggregating context after calling `extend`, so the bug is currently dormant, but nothing in the API prevents it, and `extend`/`create_entry` are both public/`pub(crate)` entry points that can be composed this way in the future.","fix":"Advance `self.cursor` in `extend` to account for the entries just appended (e.g. `self.cursor = self.cursor.max(self.data.len())` after the merge), so any subsequent `create_entry` call on the same context can't collide with previously-extended indices.","locations":[{"ref":"packages/fullstack-core/src/transport.rs:239-243","code":"  239 |     fn create_entry(&mut self) -> usize {\n  240 |         let id = self.cursor;\n  241 |         self.cursor += 1;\n  242 |         self.create_entry_with_id(id)\n  243 |     }","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-core/src/transport.rs#L239-L243"},{"ref":"packages/fullstack-core/src/transport.rs:315-349","code":"  315 |     pub(crate) fn extend(&mut self, other: &Self) {\n  316 |         // Make sure this vectors error entry exists even if it is empty\n  317 |         if self.data.is_empty() {\n  318 |             self.data.push(None);\n  319 |             #[cfg(debug_assertions)]\n  320 |             {\n  321 |                 self.debug_types.push(None);\n  322 |                 self.debug_locations.push(None);\n  323 |             }\n  324 |         }\n  325 | \n  326 |         let mut other_data_iter = other.data.iter().cloned();\n  327 |         #[cfg(debug_assertions)]\n  328 |         let mut other_debug_types_iter = other.debug_types.iter().cloned();\n  329 |         #[cfg(debug_assertions)]\n  330 |         let mut other_debug_locations_iter = other.debug_locations.iter().cloned();\n  331 | \n  332 |         // Merge the error entry from the other context\n  333 |         if let Some(Some(other_error)) = other_data_iter.next() {\n  334 |             self.data[0] = Some(other_error.clone());\n  335 |             #[cfg(debug_assertions)]\n  336 |             {\n  337 |                 self.debug_types[0] = other_debug_types_iter.next().unwrap_or(None);\n  338 |                 self.debug_locations[0] = other_debug_locations_iter.next().unwrap_or(None);\n  339 |             }\n  340 |         }\n  341 | \n  342 |         // Don't copy the error from the other context\n  343 |         self.data.extend(other_data_iter);\n  344 |         #[cfg(debug_assertions)]\n  345 |         {\n  346 |             self.debug_types.extend(other_debug_types_iter);\n  347 |             self.debug_locations.extend(other_debug_locations_iter);\n  348 |         }\n  349 |     }","lines":35,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack-core/src/transport.rs#L315-L349"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `check_connectivity` (`packages/cli/src/cli/create.rs`), the retry loop's fallback timeout uses `if x == 1 { 500 } else { 2000 }` milliseconds (line 267). This gives the *second* connectivity attempt (`x == 1`) a short 500ms timeout while the *first* attempt (`x == 0`) and every attempt after get the longer 2000ms timeout. Given the accompanying messages (`x == 0` prints an initial 'Waiting for...' notice, and this is normally where you'd want the fastest first probe), the special-cased branch looks like an off-by-one: `x == 0` was likely intended to get the short timeout.","fix":"Change the condition to `if x == 0 { 500 } else { 2000 }` (or otherwise clarify the intended backoff schedule) so the first probe uses the shorter timeout as apparently intended.","locations":[{"ref":"packages/cli/src/cli/create.rs:259-278","code":"  259 |     for x in 0..=5 {\n  260 |         tokio::select! {\n  261 |             res = client.head(\"https://github.com/DioxusLabs/\").header(\"User-Agent\", \"dioxus-cli\").send() => {\n  262 |                 if res.is_ok() {\n  263 |                     return Ok(());\n  264 |                 }\n  265 |                 tokio::time::sleep(std::time::Duration::from_millis(2000)).await;\n  266 |             },\n  267 |             _ = tokio::time::sleep(std::time::Duration::from_millis(if x == 1 { 500 } else { 2000 })) => {}\n  268 |         }\n  269 |         if x == 0 {\n  270 |             eprintln!(\n  271 |                 \"{GLOW_STYLE}warning{GLOW_STYLE:#}: Waiting for {LINK_STYLE}https://github.com/dioxuslabs{LINK_STYLE:#}...\"\n  272 |             )\n  273 |         } else {\n  274 |             eprintln!(\n  275 |                 \"{GLOW_STYLE}warning{GLOW_STYLE:#}: ({x}/5) Taking a while, maybe your internet is down?\"\n  276 |             );\n  277 |         }\n  278 |     }","lines":20,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/cli/create.rs#L259-L278"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`compressed_path` in `fastfs.rs` checks whether a file is already a brotli-compressed artifact using `ext.to_string_lossy().to_lowercase().ends_with(\"br\")`. This matches any extension ending in the letters `br`, not just an exact `.br` extension - e.g. a file named `photo.abr` (a Photoshop brush file) or `page.docbr` would be incorrectly treated as already-compressed and skipped by `pre_compress_folder`/`pre_compress_file`, or have its (nonexistent) `.br.br` compressed sibling silently removed during the 'not pre_compress' branch of `pre_compress_folder`.","fix":"Use an exact comparison instead of `ends_with`:\n```rust\n// before\nif ext.to_string_lossy().to_lowercase().ends_with(\"br\") {\n    return None;\n}\n// after\nif ext.eq_ignore_ascii_case(\"br\") {\n    return None;\n}\n```","locations":[{"ref":"packages/cli/src/fastfs.rs:15-29","code":"   15 | fn compressed_path(path: &Path) -> Option<PathBuf> {\n   16 |     let new_extension = match path.extension() {\n   17 |         Some(ext) => {\n   18 |             if ext.to_string_lossy().to_lowercase().ends_with(\"br\") {\n   19 |                 return None;\n   20 |             }\n   21 |             let mut ext = ext.to_os_string();\n   22 |             ext.push(\".br\");\n   23 |             ext\n   24 |         }\n   25 |         None => OsString::from(\"br\"),\n   26 |     };\n   27 | \n   28 |     Some(path.with_extension(new_extension))\n   29 | }","lines":15,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/fastfs.rs#L15-L29"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"On iOS/Android, `mobile_shortcut.rs`'s stub `HotKey::id()` always returns `0` for every `HotKey` instance, regardless of the key/modifiers used to construct it. `ShortcutRegistry::add_shortcut` (`packages/desktop/src/shortcut.rs:76-112`) keys its `shortcuts: RefCell<HashMap<u32, ShortcutInner>>` by this `id()`, so on mobile every distinct shortcut registered through the public `DesktopService::create_shortcut`/`use_global_shortcut` API collapses into the single hash bucket `0`. Callbacks for entirely different key combinations end up sharing one `ShortcutInner.shortcut: HotKey`, so `remove_shortcut` for one accelerator can end up unregistering the underlying stub `HotKey` shared by unrelated shortcuts once its `Slab` empties. This currently has no visible effect (mobile never wires up an event source to call `ShortcutRegistry::call_handlers`), but it silently defeats the registry's per-accelerator bookkeeping the moment mobile shortcut delivery is implemented.","fix":"Give the mobile stub `HotKey` a real, unique id (e.g. hash the `Modifiers`/`Code` pair passed to `HotKey::new`) so the registry's `HashMap` key space matches accelerator identity even before mobile event delivery is implemented:\n\n```rust\nimpl HotKey {\n    pub fn new(mods: Option<Modifiers>, key: Code) -> Self {\n        // store mods/key and derive id() from them instead of hardcoding 0\n        Self { mods, key }\n    }\n}\n```","locations":[{"ref":"packages/desktop/src/mobile_shortcut.rs:15-23","code":"   15 | impl HotKey {\n   16 |     pub fn new(mods: Option<Modifiers>, key: Code) -> Self {\n   17 |         Self\n   18 |     }\n   19 | \n   20 |     pub fn id(&self) -> u32 {\n   21 |         0\n   22 |     }\n   23 | }","lines":9,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/mobile_shortcut.rs#L15-L23"},{"ref":"packages/desktop/src/shortcut.rs:76-112","code":"   76 |     pub(crate) fn add_shortcut(\n   77 |         &self,\n   78 |         hotkey: HotKey,\n   79 |         callback: Box<dyn FnMut(HotKeyState)>,\n   80 |     ) -> Result<ShortcutHandle, ShortcutRegistryError> {\n   81 |         let accelerator_id = hotkey.clone().id();\n   82 | \n   83 |         let mut shortcuts = self.shortcuts.borrow_mut();\n   84 | \n   85 |         if let Some(callbacks) = shortcuts.get_mut(&accelerator_id) {\n   86 |             return Ok(ShortcutHandle {\n   87 |                 id: accelerator_id,\n   88 |                 number: callbacks.callbacks.insert(callback),\n   89 |             });\n   90 |         };\n   91 | \n   92 |         self.manager.register(hotkey).map_err(|e| match e {\n   93 |             HotkeyError::HotKeyParseError(shortcut) => {\n   94 |                 ShortcutRegistryError::InvalidShortcut(shortcut)\n   95 |             }\n   96 |             err => ShortcutRegistryError::Other(Rc::new(err)),\n   97 |         })?;\n   98 | \n   99 |         let mut shortcut = ShortcutInner {\n  100 |             shortcut: hotkey,\n  101 |             callbacks: Slab::new(),\n  102 |         };\n  103 | \n  104 |         let id = shortcut.callbacks.insert(callback);\n  105 | \n  106 |         shortcuts.insert(accelerator_id, shortcut);\n  107 | \n  108 |         Ok(ShortcutHandle {\n  109 |             id: accelerator_id,\n  110 |             number: id,\n  111 |         })\n  112 |     }","lines":37,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/shortcut.rs#L76-L112"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `TailwindCli::run_once`, the code checks `if !output.stderr.is_empty()` but then logs `output.stdout` in the warning message instead of `output.stderr`. Any real tailwind warnings/errors printed to stderr are never shown to the user, while unrelated stdout content (which may be empty) is logged as if it were the warning.","fix":"```rust\nif !output.stderr.is_empty() {\n    tracing::warn!(\n        \"Warnings while running tailwind: {}\",\n        String::from_utf8_lossy(&output.stderr)\n    );\n}\n```","locations":[{"ref":"packages/cli/src  Ok(mime) = content_type.parse::<mime::Mime>() {\n   95 |         mime\n   96 |     } else {\n   97 |         return false;\n   98 |     };\n   99 | \n  100 |     mime.type_() == \"application\"\n  101 |         && (mime.subtype() == \"postcard\" || mime.suffix().is_some_and(|name| name == \"postcard\"))\n  102 | }","lines":22,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack/src/payloads/postcard.rs#L81-L102"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`MemoryLocationBorrowInfo::borrow_error` (used by `try_read` in both `unsync.rs` and presumably `sync.rs`) reads `self.0.read()` and populates `AlreadyBorrowedMutError { borrowed_mut_at: ... }` under `#[cfg(any(debug_assertions, feature = \"debug_ownership\"))]`. But `self.0` (the `parking_lot::RwLock` field of `MemoryLocationBorrowInfo`) only exists under `#[cfg(any(debug_assertions, feature = \"debug_borrows\"))]`, and the `AlreadyBorrowedMutError::borrowed_mut_at` field is likewise only declared under `debug_borrows` (see `error.rs`). This mismatches the sibling function `borrow_mut_error` in the same file, which correctly uses `debug_borrows` throughout. Building with the `debug_borrows` feature alone (no `debug_assertions`, no `debug_ownership`) will fail to compile: `self.0` exists, but the field initializer that would use it is compiled out, leaving `AlreadyBorrowedMutError`'s mandatory `borrowed_mut_at` field unset.","fix":"Change the cfg predicate in `borrow_error` to match `borrow_mut_error` and the struct definition:\n```rust\npub(crate) fn borrow_error(&self) -> BorrowError {\n    BorrowError::AlreadyBorrowedMut(crate::error::AlreadyBorrowedMutError {\n        #[cfg(any(debug_assertions, feature = \"debug_borrows\"))]\n        borrowed_mut_at: self.0.read().borrowed_mut_at.unwrap(),\n    })\n}\n```","locations":[{"ref":"packages/generational-box/src/entry.rs:92-97","code":"   92 |     pub(crate) fn borrow_error(&self) -> BorrowError {\n   93 |         BorrowError::AlreadyBorrowedMut(crate::error::AlreadyBorrowedMutError {\n   94 |             #[cfg(any(debug_assertions, feature = \"debug_ownership\"))]\n   95 |             borrowed_mut_at: self.0.read().borrowed_mut_at.unwrap(),\n   96 |         })\n   97 |     }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/generational-box/src/entry.rs#L92-L97"},{"ref":"packages/generational-box/src/error.rs:107-111","code":"  107 | #[derive(Debug, Copy, Clone, PartialEq)]\n  108 | pub struct AlreadyBorrowedMutError {\n  109 |     #[cfg(any(debug_assertions, feature = \"debug_borrows\"))]\n  110 |     pub(crate) borrowed_mut_at: &'static std::panic::Location<'static>,\n  111 | }","lines":5,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/generational-box/src/error.rs#L107-L111"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`ValueDroppedError::new_for_location` gates its `created_at` field assignment with `#[cfg(any(debug_assertions, feature = \"debug_borrows\"))]`, but the `ValueDroppedError` struct itself declares that same field under `#[cfg(any(debug_assertions, feature = \"debug_ownership\"))]` (and the sibling constructor `ValueDroppedError::new` correctly uses `debug_ownership`). `debug_borrows` and `debug_ownership` are two distinct Cargo features (both defined in `packages/generational-box/Cargo.toml`). Since `new_for_location` is reachable from many call sites in `sync.rs`/`unsync.rs`, building with only the `debug_borrows` feature enabled (and `debug_assertions` off, e.g. a release build) will fail to compile: the struct requires `created_at` (via `debug_ownership`, which is off) to be absent, while the constructor tries to assign it under `debug_borrows` (which is on) - a struct-literal field mismatch.", mplate => {\n   60 |                 tracing::error!(\n   61 |                     \"Error while rendering {component}: The children of {component} must be a single text node\"\n   62 |                 );\n   63 |             }","lines":10,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/document/src/elements/mod.rs#L54-L63"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"In `check_files_and_report` in `packages/cli/src/cli/check.rs`, each file is read with `tokio::fs::read_to_string(&_path).await.map(|contents| crate::check::check_file(_path, &contents))` inside a `tokio::spawn`. The outer `Result` returned by `tokio::spawn(...).await` is a `Result<Result<IssueReport, io::Error>, JoinError>`. The code only checks `res.is_err()` (which is only `true` on a `JoinError`, i.e. a panic inside the task) and logs `\"error checking file: {}\"` in that case. If `tokio::fs::read_to_string` itself fails (permission denied, non-UTF8 file, broken symlink, etc.), the result is `Ok(Err(io::Error))`, so `res.is_err()` is `false` and nothing is logged at all. The inner `io::Error` is then silently discarded by the later `.flatten().flatten()` chain. This means files that fail to read are silently skipped from the `dx check` report with zero indication to the user, which can hide real issues and make `dx check` under-report problems without any warning.","fix":"Match on the inner `Result` explicitly and log both cases, e.g. after the `tokio::spawn(...).await`, check `match res { Ok(Ok(report)) => Some(report), Ok(Err(io_err)) => { tracing::error!(\"error reading file {}: {io_err}\", path.display()); None }, Err(join_err) => { tracing::error!(\"error checking file {}: {join_err}\", path.display()); None } }` so read failures are surfaced instead of vanishing silently.","locations":[{"ref":"packages/cli/src/cli/check.rs:78-106","code":"   78 | async fn check_files_and_report(files_to_check: Vec<PathBuf>) -> Result<()> {\n   79 |     let issue_reports = files_to_check\n   80 |         .into_iter()\n   81 |         .filter(|file| file.components().all(|f| f.as_os_str() != \"target\"))\n   82 |         .map(|path| async move {\n   83 |             let _path = path.clone();\n   84 |             let res = tokio::spawn(async move {\n   85 |                 tokio::fs::read_to_string(&_path)\n   86 |                     .await\n   87 |                     .map(|contents| crate::check::check_file(_path, &contents))\n   88 |             })\n   89 |             .await;\n   90 | \n   91 |             if res.is_err() {\n   92 |                 tracing::error!(\"error checking file: {}\", path.display());\n   93 |             }\n   94 | \n   95 |             res\n   96 |         })\n   97 |         .collect::<FuturesUnordered<_>>()\n   98 |         .collect::<Vec<_>>()\n   99 |         .await;\n  100 | \n  101 |     // remove error results which we've already printed\n  102 |     let issue_reports = issue_reports\n  103 |         .into_iter()\n  104 |         .flatten()\n  105 |         .flatten()\n  106 |         .collect::<Vec<_>>();","lines":29,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/cli/check.rs#L78-L106"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `bundle_linux_rpm`'s inline icon-handling loop, PNG decoding failures are silently swallowed: `if let Ok(file) = fs::File::open(icon_path) { if let Ok(reader) = decoder.read_info() { ... } }` simply drops the icon with no warning if the file can't be opened or its PNG header can't be decoded. This is inconsistent with the copy-pasted twin logic in `copy_linux_icons` (used for `.deb`/AppImage), which propagates the same failures as hard errors via `.with_context(...)?`. As written, an RPM package can silently ship without its icon while the equivalent `.deb`/AppImage build for the same input would fail loudly, which is confusing and makes the RPM icon failure very hard to notice.","fix":"Match the behavior used in `copy_linux_icons`: propagate the error (or at minimum log a `tracing::warn!` when an icon file can't be opened/decoded) instead of silently discarding it, e.g.:\n```rust\n\"png\" => {\n    let file = fs::File::open(icon_path)\n        .with_context(|| format!(\"Failed to open PNG icon: {}\", icon_path.display()))?;\n    let decoder = png::Decoder::new(BufReader::new(file));\n    let reader = decoder.read_info()\n        .with_context(|| format!(\"Failed to decode PNG dimensions: {}\", icon_path.display()))?;\n    ...\n}\n```","locations":[{"ref":"packages/cli/src/bundler/linux.rs:283-300","code":"  283 |                 \"png\" => {\n  284 |                     if let Ok(file) = fs::File::open(icon_path) {\n  285 |                         let decoder = png::Decoder::new(BufReader::new(file));\n  286 |                         if let Ok(reader) = decoder.read_info() {\n  287 |                             let info = reader.info();\n  288 |                             let (w, h) = (info.width, info.height);\n  289 |                             let size = w.max(h);\n  290 |                             let dest =\n  291 |                                 format!(\"/usr/share/icons/hicolor/{size}x{size}/apps/{name}.png\");\n  292 |                             builder = builder\n  293 |                                 .with_file(\n  294 |                                     icon_path,\n  295 |                                     rpm::FileOptions::new(dest).permissions(0o644),\n  296 |                                 )\n  297 |                                 .context(\"Failed to add icon to RPM\")?;\n  298 |                         }\n  299 |                     }\n  300 |                 }","lines":18,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/cli/src/bundler/linux.rs#L283-L300"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`serialize_const_enum` loops over `layout.variants` looking for the one whose `tag` matches the runtime discriminant read from memory. If no variant matches (which should never happen for a correctly generated layout, but would happen if a layout is malformed or hand-constructed incorrectly via the public `EnumLayout::new`/`EnumVariant::new` API), the loop simply finishes without ever writing the map header, key, or struct data for the enum. Unlike `deserialize_const_enum`, which explicitly tracks `matched_variant` and returns `None` on a mismatch, the serialize side has no equivalent signal: it silently returns `to` unchanged, producing truncated/corrupt CBOR output with no panic or error, which will then fail (or worse, misparse) far away at deserialization time.","fix":"Make the missing-variant case observable close to the source, e.g. panic with a clear message after the loop if no match was found:\n```rust\nlet mut matched = false;\nwhile i < layout.variants.len() {\n    ...\n    if discriminant == *tag {\n        ...\n        matched = true;\n        break;\n    }\n    i += 1;\n}\nassert!(matched, \"no enum variant matched the discriminant; the EnumLayout does not match the type\");\nto\n```","locations":[{"ref":"packages/const-serialize/src/enum.rs:4-28","code":"    4 | pub(crate) const unsafe fn serialize_const_enum(\n    5 |     ptr: *const (),\n    6 |     mut to: ConstVec<u8>,\n    7 |     layout: &EnumLayout,\n    8 | ) -> ConstVec<u8> {\n    9 |     let byte_ptr = ptr as *const u8;\n   10 |     let discriminant = unsafe { layout.discriminant.read(byte_ptr) };\n   11 | \n   12 |     let mut i = 0;\n   13 |     while i < layout.variants.len() {\n   14 |         // If the variant is the discriminated one, serialize it\n   15 |         let EnumVariant {\n   16 |             tag, name, data, ..\n   17 |         } = &layout.variants[i];\n   18 |         if discriminant == *tag {\n   19 |             to = write_map(to, 1);\n   20 |             to = write_map_key(to, name);\n   21 |             let data_ptr = ptr.wrapping_byte_offset(layout.variants_offset as _);\n   22 |             to = unsafe { serialize_const_struct(data_ptr, to, data) };\n   23 |             break;\n   24 |         }\n   25 |         i += 1;\n   26 |     }\n   27 |     to\n   28 | }","lines":25,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/const-serialize/src/enum.rs#L4-L28"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The doc comment on `Mutations` says \"Note: this list does not contain any `Any` attribute values\", implying `AttributeValue::Any` is simply excluded/omitted from the mutation stream. But `WriteMutations::set_attribute` for `Mutations` does the opposite of quietly excluding it - it `panic!(\"Cannot serialize attribute value\")` whenever it receives `AttributeValue::Any` (or `AttributeValue::Listener`, which should never reach this path anyway). Since `VNode::write_attribute` in `diff/node.rs` forwards every non-`Listener` attribute value straight into `to.set_attribute(...)`, any renderer/tool that uses the default `Mutations`/`WriteMutations` implementation (used for testing, `render_to_vec`-style utilities, and any custom renderer built on top of it) will crash the whole diffing pass the first time a component uses `AttributeValue::any_value` for a dynamic attribute, instead of the documented behavior of the value simply not appearing in the mutation list.","fix":"Either update the implementation to match the documented contract by skipping `Any` values instead of panicking:\n```rust\nfn set_attribute(\n    &mut self,\n    name: &'static str,\n    ns: Option<&'static str>,\n    value: &AttributeValue,\n    id: ElementId,\n) {\n    let value = match value {\n        AttributeValue::Text(s) => AttributeValue::Text(s.clone()),\n        AttributeValue::Bool(b) => AttributeValue::Bool(*b),\n        AttributeValue::Float(n) => AttributeValue::Float(*n),\n        AttributeValue::Int(n) => AttributeValue::Int(*n),\n        AttributeValue::None => AttributeValue::None,\n        // Any/Listener values can't be represented in the serialized mutation log; skip them per the documented contract\n        AttributeValue::Any(_) | AttributeValue::Listener(_) => return,\n    };\n    self.edits.push(Mutation::SetAttribute { name, ns, value, id })\n}\n```\nor, if panicking really is intended, update the doc comment to say so explicitly instead of describing it as simple omission.","locations":[{"ref":"packages/core/src/mutations.rs:284-289","code":"  284 | /// A static list of mutations that can be applied to the DOM. Note: this list does not contain any `Any` attribute values\n  285 | #[derive(Debug, PartialEq, Default)]\n  286 | pub struct Mutations {\n  287 |     /// Any mutations required to patch the renderer to match the layout of the VirtualDom\n  288 |     pub edits: Vec<Mutation>,\n  289 | }","lines":6,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/mutations.rs#L284-L289"},{"ref":"packages/core/src/mutations.rs:331-351","code":"  331 |     fn set_attribute(\n  332 |         &mut self,\n  333 |         name: &'static str,\n  334 |         ns: Option<&'static str>,\n  335 |         value: &AttributeValue,\n  336 |         id: ElementId,\n  337 |     ) {\n  338 |         self.edits.push(Mutation::SetAttribute {\n  339 |             name,\n  340 |             ns,\n  341 |             value: match value {\n  342 |                 AttributeValue::Text(s) => AttributeValue::Text(s.clone()),\n  343 |                 AttributeValue::Bool(b) => AttributeValue::Bool(*b),\n  344 |                 AttributeValue::Float(n) => AttributeValue::Float(*n),\n  345 |                 AttributeValue::Int(n) => AttributeValue::Int(*n),\n  346 |                 AttributeValue::None => AttributeValue::None,\n  347 |                 _ => panic!(\"Cannot serialize attribute value\"),\n  348 |             },\n  349 |             id,\n  350 |         })\n  351 |     }","lines":21,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/core/src/mutations.rs#L331-L351"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`android_runtime_lock()` in `packages/desktop/src/android_sync_lock.rs` calls `.lock().unwrap()` on a plain `std::sync::Mutex`. This lock is taken around arbitrary user/webview callbacks at several call sites across the desktop crate (`assets.rs::handle_request`, `event_handlers.rs::apply_event`, `webview.rs`, `app.rs`). If any code running while the lock is held panics (e.g. a user-provided asset handler or event callback), the `Mutex` becomes poisoned, and every subsequent call to `android_runtime_lock()` will panic on `.unwrap()` too - turning one recoverable panic into a permanently broken Android app (every future asset request, IPC event, and render pass panics forever).","fix":"Recover from poisoning instead of propagating it, since the guarded data is just `()`:\n```rust\nRUNTIME_LOCK\n    .get_or_init(|| Mutex::new(()))\n    .lock()\n    .unwrap_or_else(|poisoned| poisoned.into_inner())\n```","locations":[{"ref":"packages/desktop/src/android_sync_lock.rs:5-11","code":"    5 | pub fn android_runtime_lock() -> std::sync::MutexGuard<'static, ()> {\n    6 |     use std::sync::{Mutex, OnceLock};\n    7 | \n    8 |     static RUNTIME_LOCK: OnceLock<Mutex<()>> = OnceLock::new();\n    9 | \n   10 |     RUNTIME_LOCK.get_or_init(|| Mutex::new(())).lock().unwrap()\n   11 | }","lines":7,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/desktop/src/android_sync_lock.rs#L5-L11"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`dioxus_devtools::apply_changes` is defined as `try_apply_changes(dom, msg).unwrap()`, discarding the whole point of `try_apply_changes` returning a `Result<(), PatchError>`. Its only caller in the audited scope, `App::handle_hot_reload_msg` (`packages/desktop/src/app.rs:339`), invokes `apply_changes` (not the fallible `try_apply_changes`), so any hot-patch failure - a legitimately expected outcome the fallible API exists to handle (mismatched jump table, ASLR reference mismatch, bad binary patch, etc.) - crashes the entire running desktop app rather than falling back to a full reload or showing an error toast, even though the desktop crate already has toast infrastructure (`send_toast_to_all`) it could use to report the failure gracefully.","fix":"Use `try_apply_changes` in `handle_hot_reload_msg` and report failures through the existing toast mechanism instead of letting the underlying `.unwrap()` in `apply_changes` crash the app:\n\n```rust\nif let Err(err) = dioxus_devtools::try_apply_changes(&webview.dom, &hr_msg) {\n    tracing::error!(\"Failed to hot-patch: {err:?}\");\n    self.send_toast_to_all(\"Hot-patch failed\", &format!(\"{err}\"), \"error\", TOAST_TIMEOUT_LONG, false);\n    continue;\n}\n```","locations":[{"ref":"packages/devtools/src/lib.rs:12-14","code":"   12 | pub fn apply_changes(dom: &VirtualDom, msg: &HotReloadMsg) {\n   13 |     try_apply_changes(dom, msg).unwrap()\n   14 | }","lines":3,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/devtools/src/lib.rs#L12-L14"},{"ref":"packages/desktop/src/app.rs:331-343","code":"  331 |         match msg {\n  332 |             DevserverMsg::HotReload(hr_msg) => {\n  333 |                 for ` to distinguish \"no bytes left\" from \"payload failed to decode\", e.g. return a 3-way enum or keep returning `Option<Result<T, StreamingError>>` but only use `None` for the genuinely-empty case:\n```rust\nlet r = E::decode(frame.slice(offset..offset + payload_len));\nframe.advance(offset + payload_len);\nmatch r {\n    Some(v) => Some(Ok(v)),\n    None => Some(Err(StreamingError::Decoding)),\n}\n```\nso every call site (both `Checked` and `UnChecked`) observes decode failures instead of only the first one.","locations":[{"ref":"packages/fullstack/src/payloads/stream.rs:491-535","code":"  491 | fn byte_stream_to_client_stream<E, T, S, E1>(\n  492 |     stream: S,\n  493 | ) -> Pin<Box<dyn Stream<Item = Result<T, StreamingError>> + Send>>\n  494 | where\n  495 |     S: Stream<Item = Result<Bytes, E1>> + 'static + Send,\n  496 |     E: Encoding,\n  497 |     T: DeserializeOwned + 'static,\n  498 | {\n  499 |     Box::pin(stream.flat_map(|bytes| {\n  500 |         enum DecodeIteratorState {\n  501 |             Empty,\n  502 |             Failed,\n  503 |             Checked(Bytes),\n  504 |             UnChecked(Bytes),\n  505 |         }\n  506 | \n  507 |         let mut state = match bytes {\n  508 |             Ok(bytes) => DecodeIteratorState::UnChecked(bytes),\n  509 |             Err(_) => DecodeIteratorState::Failed,\n  510 |         };\n  511 | \n  512 |         futures::stream::iter(std::iter::from_fn(move || {\n  513 |             match std::mem::replace(&mut state, DecodeIteratorState::Empty) {\n  514 |                 DecodeIteratorState::Empty => None,\n  515 |                 DecodeIteratorState::Failed => Some(Err(StreamingError::Failed)),\n  516 |                 DecodeIteratorState::Checked(mut bytes) => {\n  517 |                     let r = decode_stream_frame_multi::<T, E>(&mut bytes);\n  518 |                     if r.is_some() {\n  519 |                         state = DecodeIteratorState::Checked(bytes)\n  520 |                     }\n  521 |                     r\n  522 |                 }\n  523 |                 DecodeIteratorState::UnChecked(mut bytes) => {\n  524 |                     let r = decode_stream_frame_multi::<T, E>(&mut bytes);\n  525 |                     if r.is_some() {\n  526 |                         state = DecodeIteratorState::Checked(bytes);\n  527 |                         r\n  528 |                     } else {\n  529 |                         Some(Err(StreamingError::Decoding))\n  530 |                     }\n  531 |                 }\n  532 |             }\n  533 |         }))\n  534 |     }))\n  535 | }","lines":45,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack/src/payloads/stream.rs#L491-L535"},{"ref":"packages/fullstack/src/payloads/stream.rs:556-569","code":"  556 | fn decode_stream_frame_multi<T, E>(frame: &mut Bytes) -> Option<Result<T, StreamingError>>\n  557 | where\n  558 |     E: Encoding,\n  559 |     T: DeserializeOwned,\n  560 | {\n  561 |     let (offset, payload_len) = match offset_payload_len(frame)? {\n  562 |         Ok(r) => r,\n  563 |         Err(e) => return Some(Err(e)),\n  564 |     };\n  565 | \n  566 |     let r = E::decode(frame.slice(offset..offset + payload_len));\n  567 |     frame.advance(offset + payload_len);\n  568 |     r.map(|r| Ok(r))\n  569 | }","lines":14,"link":"https://github.com/DioxusLabs/dioxus/blob/cae279ebb68a9ee28485f41f668443e1dfb4b002/packages/fullstack/src/payloads/stream.rs#L556-L569"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `build_doc_fields`, parsing the `#[deprecated]` attribute's meta via `crate::utils::DeprecatedAttribute::from_meta` uses `panic!(\"{}\", e.to_string())` on error instead of propagating a `syn::Error`. Since this executes during proc-macro expansion, a malformed `#[deprecated(...)]` attribute on a component argument crashes the proc macro p
