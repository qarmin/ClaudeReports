<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"hard","description":"`ValueDeserializer::deserialize_tuple` in the hand-written `Path` deserializer contains a reachable `unreachable!()`. It is hit whenever a path-capture value itself needs to be deserialized as a 2-tuple while `self.key` is `None` - which happens when deserializing something like `Path<Vec<(String, (String, String))>>` (a \"capture all as pairs\" `Vec<(K, V)>` whose value type `V` is itself a 2-tuple). The inner `PairDeserializer::next_element_seed` yields the pair's value via `ValueDeserializer { key: None, value }` (extract/path/de.rs:465-469); if that value type also requires `deserialize_tuple` with `len == 2`, execution reaches the `None => unreachable!()` arm at line 480 and the request-handling task panics. This was confirmed by direct reproduction: deserializing `Vec<(String, (String, String))>` from two ordinary url params panics with \"internal error: entered unreachable code\" at axum/src/extract/path/de.rs:480, for every request that matches such a route - it does not depend on the specific/malicious values of the path segments, only on the route's declared extractor type. The comment above the `unreachable!()` (\"`self.key` is only `None` when deserializing maps so `deserialize_seq` wouldn't be called for that\") is also inaccurate: it ignores this nested-tuple-value code path.","fix":"Do not assume `self.key` is always `Some` in `ValueDeserializer::deserialize_tuple`. When `self.key` is `None`, return a proper (non-panicking) error consistent with the other unsupported-shape branches in this impl, e.g.:\n```rust\nif len == 2 {\n    match self.key {\n        Some(key) => visitor.visit_seq(PairDeserializer {\n            key: Some(key),\n            value: Some(self.value),\n        }),\n        None => Err(PathDeserializationError::unsupported_type(type_name::<V::Value>())),\n    }\n} else {\n    Err(PathDeserializationError::unsupported_type(type_name::<V::Value>()))\n}\n```\nAlso update/remove the now-inaccurate comment about `self.key` only being `None` for maps.","locations":[{"ref":"axum/src/extract/path/de.rs:437-487","code":"  437 |     fn deserialize_tuple<V>(self, len: usize, visitor: V) -> Result<V::Value, Self::Error>\n  438 |     where\n  439 |         V: Visitor<'de>,\n  440 |     {\n  441 |         struct PairDeserializer<'de> {\n  442 |             key: Option<KeyOrIdx<'de>>,\n  443 |             value: Option<&'de PercentDecodedStr>,\n  444 |         }\n  445 | \n  446 |         impl<'de> SeqAccess<'de> for PairDeserializer<'de> {\n  447 |             type Error = PathDeserializationError;\n  448 | \n  449 |             fn next_element_seed<T>(&mut self, seed: T) -> Result<Option<T::Value>, Self::Error>\n  450 |             where\n  451 |                 T: DeserializeSeed<'de>,\n  452 |             {\n  453 |                 match self.key.take() {\n  454 |                     Some(KeyOrIdx::Idx { idx: _, key }) => {\n  455 |                         return seed.deserialize(KeyDeserializer { key }).map(Some);\n  456 |                     }\n  457 |                     Some(KeyOrIdx::Key(_)) => {\n  458 |                         return Err(PathDeserializationError::custom(\n  459 |                             \"array types are not supported\",\n  460 |                         ));\n  461 |                     }\n  462 |                     None => {}\n  463 |                 };\n  464 | \n  465 |                 self.value\n  466 |                     .take()\n  467 |                     .map(|value| seed.deserialize(ValueDeserializer { key: None, value }))\n  468 |                     .transpose()\n  469 |             }\n  470 |         }\n  471 | \n  472 |         if len == 2 {\n  473 |             match self.key {\n  474 |                 Some(key) => visitor.visit_seq(PairDeserializer {\n  475 |                     key: Some(key),\n  476 |                     value: Some(self.value),\n  477 |                 }),\n  478 |                 // `self.key` is only `None` when deserializing maps so `deserialize_seq`\n  479 |                 // wouldn't be called for that\n  480 |                 None => unreachable!(),\n  481 |             }\n  482 |         } else {\n  483 |             Err(PathDeserializationError::unsupported_type(type_name::<\n  484 |                 V::Value,\n  485 |             >()))\n  486 |         }\n  487 |     }","lines":51,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum/src/extract/path/de.rs#L437-L487"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Attachment::filename` accepts any `H: TryInto<HeaderValue>`, including a `HeaderValue` passed directly (there is a reflexive `TryFrom<HeaderValue> for HeaderValue` blanket impl). `HeaderValue` construction only rejects control characters; it does not require the bytes to be valid UTF-8. If a caller forwards a `HeaderValue` obtained from an inbound request header (which may legally contain non-UTF-8 obs-text bytes, e.g. Latin-1 encoded filenames), or one built via `HeaderValue::from_bytes` with a byte like `0xFF`, then `Attachment::filename(...)` will accept and store it (the `try_into()` succeeds). Later, in `into_response`, `filename.to_str()` will return `Err` for such a value, and the code does `.expect(\"This was a HeaderValue so this can not fail\")`, which panics. The comment is factually wrong: a `HeaderValue` can be valid while still failing `to_str()`.","fix":"Do not assume `to_str()` succeeds. Fall back gracefully instead of panicking, e.g.:\n```rust\nlet content_disposition = if let Some(filename) = self.filename {\n    match filename.to_str() {\n        Ok(filename_str) => {\n            let value = format!(\n                \"attachment; filename=\\\"{}\\\"\",\n                EscapedQuotedString(filename_str)\n            );\n            HeaderValue::try_from(value).unwrap_or_else(|_| HeaderValue::from_static(\"attachment\"))\n        }\n        Err(_) => HeaderValue::from_static(\"attachment\"),\n    }\n} else {\n    HeaderValue::from_static(\"attachment\")\n};\n```\nAlso correct/remove the misleading comment claiming this conversion \"can not fail\".","locations":[{"ref":"axum-extra/src/response/attachment.rs:91-99","code":"   91 |         let content_disposition = if let Some(filename) = self.filename {\n   92 |             let filename_str = filename\n   93 |                 .to_str()\n   94 |                 .expect(\"This was a HeaderValue so this can not fail\");\n   95 |             let value = format!(\n   96 |                 \"attachment; filename=\\\"{}\\\"\",\n   97 |                 EscapedQuotedString(filename_str)\n   98 |             );\n   99 |             HeaderValue::try_from(value).expect(\"This was a HeaderValue so this can not fail\")","lines":9,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum-extra/src/response/attachment.rs#L91-L99"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`#[derive(TypedPath)]` (axum-macros/src/typed_path.rs) does not validate that a path capture's name is a syntactically valid Rust identifier before feeding it to `format_ident!`. In `parse_path`, the only check performed on a capture's content is `capture.is_empty() || capture.contains('{')` (line 403), which is checked on the *raw* capture text before the leading `*` (wildcard marker) is stripped. This lets clearly malformed but plausible input through, such as an unnamed wildcard capture `{*}` (after stripping `*` the identifier becomes the empty string), or a capture containing spaces/hyphens/other invalid identifier characters (e.g. `{foo-bar}`, `{foo bar}`, `{123abc}`). These strings are later passed straight into `format_ident!` in `captures_from_path` (line 372) and in `expand_unnamed_fields`'s `destructure_self` closure (line 207). `format_ident!`/`Ident::new` panics on empty or invalid identifiers rather than returning a `syn::Result`, so a user writing e.g. `#[typed_path(\"/{*}\")]` or `#[typed_path(\"/{foo bar}\")]` gets a raw proc-macro panic (confusing, ICE-like output with a backtrace notice) instead of a clean `syn::Error` compile message. Verified experimentally: calling `format_ident!(\"{}\", \"\", span)` panics with \"Ident is not allowed to be empty; use Option<Ident>\", and `format_ident!(\"{}\", \"foo bar\", span)` panics with \"\"foo bar\" is not a valid Ident\".","fix":"Validate that each capture name is a legal Rust identifier (and non-empty after stripping the `*` wildcard marker) inside `parse_path`, returning a `syn::Error` instead of letting the bad string reach `format_ident!`. For example, right after computing the capture text:\n```rust\nlet ident_candidate = capture.strip_prefix('*').unwrap_or(capture);\nif ident_candidate.is_empty() || syn::parse_str::<syn::Ident>(ident_candidate).is_err() {\n    return Err(syn::Error::new_spanned(\n        path,\n        format!(\"`{{{capture}}}` is not a valid capture name\"),\n    ));\n}\n```\nThis turns the panic into a normal, actionable compile error.","locations":[{"ref":"axum-macros/src/typed_path.rs:394-424","code":"  394 |     while let Some(start) = find_first_not_double(b'{', rest.as_bytes()) {\n  395 |         if start > 0 {\n  396 |             segments.push(Segment::Static(rest[..start].to_owned()));\n  397 |         }\n  398 | \n  399 |         rest = &rest[start + 1..];\n  400 | \n  401 |         if let Some(end) = rest.find('}') {\n  402 |             let capture = &rest[..end];\n  403 |             if capture.is_empty() || capture.contains('{') {\n  404 |                 return Err(syn::Error::new_spanned(path, \"invalid capture in path\"));\n  405 |             }\n  406 | \n  407 |             segments.push(Segment::Capture(\n  408 |                 capture.strip_prefix('*').unwrap_or(capture).to_owned(),\n  409 |                 path.span(),\n  410 |             ));\n  411 | \n  412 |             rest = &rest[end + 1..];\n  413 |         } else {\n  414 |             segments.push(Segment::Static(format!(\"{{{rest}\")));\n  415 |             rest = \"\";\n  416 |         }\n  417 |     }\n  418 | \n  419 |     if !rest.is_empty() {\n  420 |         segments.push(Segment::Static(rest.to_owned()));\n  421 |     }\n  422 | \n  423 |     Ok(segments)\n  424 | }","lines":31,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum-macros/src/typed_path.rs#L394-L424"},{"ref":"axum-macros/src/typed_path.rs:368-376","code":"  368 | fn captures_from_path(segments: &[Segment]) -> Vec<syn::Ident> {\n  369 |     segments\n  370 |         .iter()\n  371 |         .filter_map(|segment| match segment {\n  372 |             Segment::Capture(capture, span) => Some(format_ident!(\"{}\", capture, span = *span)),\n  373 |             Segment::Static(_) => None,\n  374 |         })\n  375 |         .collect::<Vec<_>>()\n {"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`test_helpers::test_client::spawn_service` binds a fresh TCP listener and does `tokio::spawn(async move { serve(listener, Shared::new(svc)).await; })` without ever keeping the `JoinHandle`. Since `axum::serve(..)`'s future never completes (`Serve::run` returns `-> !` / `Infallible`), every `TestClient::new(..)` call permanently leaks a background task plus its bound listening socket for the remainder of the process's life - `TestClient` has no `Drop` impl to abort the task or close the listener early. `test_helpers` is compiled whenever `cfg(any(test, feature = \"__private\"))` is active (not just under `#[cfg(test)]`), and `TestClient::new` is called from a very large number of tests across the crate and `axum-extra`, so a single test-binary process accumulates one live listening socket and tokio task per test that uses `TestClient`, for the duration of that test binary's run. This is contained by the test process eventually exiting, but can contribute to file-descriptor pressure/flakiness on machines running many test binaries concurrently (e.g. `cargo nextest` with high parallelism), and is inconsistent with `TestClient` otherwise looking like a disposable, scoped test fixture.","fix":"Store the `JoinHandle` returned by `tokio::spawn` in `TestClient` and abort it (and drop the listener) in a `Drop` impl, e.g.:\n```rust\npub struct TestClient {\n    client: reqwest::Client,\n    addr: SocketAddr,\n    server_task: tokio::task::JoinHandle<()>,\n}\n\nimpl Drop for TestClient {\n    fn drop(&mut self) {\n        self.server_task.abort();\n    }\n}\n```","locations":[{"ref":"axum/src/test_helpers/test_client.rs:11-28","code":"   11 | pub(crate) fn spawn_service<S>(svc: S) -> SocketAddr\n   12 | where\n   13 |     S: Service<Request, Response = Response, Error = Infallible> + Clone + Send + 'static,\n   14 |     S::Future: Send,\n   15 | {\n   16 |     let std_listener = std::net::TcpListener::bind(\"127.0.0.1:0\").unwrap();\n   17 |     std_listener.set_nonblocking(true).unwrap();\n   18 |     let listener = TcpListener::from_std(std_listener).unwrap();\n   19 | \n   20 |     let addr = listener.local_addr().unwrap();\n   21 |     println!(\"Listening on {addr}\");\n   22 | \n   23 |     tokio::spawn(async move {\n   24 |         serve(listener, Shared::new(svc)).await;\n   25 |     });\n   26 | \n   27 |     addr\n   28 | }","lines":18,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum/src/test_helpers/test_client.rs#L11-L28"},{"ref":"axum/src/test_helpers/test_client.rs:35-49","code":"   35 | impl TestClient {\n   36 |     pub fn new<S>(svc: S) -> Self\n   37 |     where\n   38 |         S: Service<Request, Response = Response, Error = Infallible> + Clone + Send + 'static,\n   39 |         S::Future: Send,\n   40 |     {\n   41 |         let addr = spawn_service(svc);\n   42 | \n   43 |         let client = reqwest::Client::builder()\n   44 |             .redirect(reqwest::redirect::Policy::none())\n   45 |             .build()\n   46 |             .unwrap();\n   47 | \n   48 |         Self { client, addr }\n   49 |     }","lines":15,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum/src/test_helpers/test_client.rs#L35-L49"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`RouteFuture::poll` detects a response to a `CONNECT` request that violates RFC 9110 (a 2xx response must not carry `Content-Length` or `Transfer-Encoding`), logs an `error!`, and replaces the body with `Body::empty()` - but it never removes the offending `Content-Length` / `Transfer-Encoding` headers from the response. The headers stay in `res.headers()` even though the body is now empty. This \"fix\" does not just leave a cosmetically wrong header: hyper's HTTP/1 server encoder (`hyper::proto::h1::role::Server::encode_headers`) sets `wrote_len = true` before encoding headers for any successful response to `CONNECT`, and then, on encountering a `Content-Length` or `Transfer-Encoding` header with `wrote_len` already true, does `warn!(\"unexpected content-length found, canceling\"); rewind(dst); return Err(crate::Error::new_user_header())` (same for `Transfer-Encoding`, see hyper-1.10.1/src/proto/h1/role.rs lines ~688-813). So instead of silently sending a technically non-compliant but working response, axum's current handling causes hyper to abort encoding the response entirely, which surfaces as `\"failed to serve connection\"` in axum's own connection loop (axum/src/serve/mod.rs) and drops the connection. Any handler or middleware that sets `Content-Length` (very common - many response-building helpers/middleware add it automatically, even for empty bodies) on a successful `CONNECT` response (e.g. WebSocket-over-HTTP/2 or a CONNECT-based proxy handler, both explicitly supported use cases in axum) will have the entire response fail to encode instead of just working.","fix":"Actually strip the forbidden headers in addition to emptying the body, e.g.:\n```rust\nif res.headers().contains_key(&CONTENT_LENGTH)\n    || res.headers().contains_key(&header::TRANSFER_ENCODING)\n    || res.size_hint().lower() != 0\n{\n    error!(\"response to CONNECT with nonempty body\");\n    res.headers_mut().remove(CONTENT_LENGTH);\n    res.headers_mut().remove(header::TRANSFER_ENCODING);\n    res = res.map(|_| Body::empty());\n}\n```","locations":[{"ref":"axum/src/routing/route.rs:151-162","code":"  151 |         if *this.method == Method::CONNECT && res.status().is_success() {\n  152 |             // From https://httpwg.org/specs/rfc9110.html#CONNECT:\n  153 |             // > A server MUST NOT send any Transfer-Encoding or\n  154 |             // > Content-Length header fields in a 2xx (Successful)\n  155 |             // > response to CONNECT.\n  156 |             if res.headers().contains_key(&CONTENT_LENGTH)\n  157 |                 || res.headers().contains_key(&header::TRANSFER_ENCODING)\n  158 |                 || res.size_hint().lower() != 0\n  159 |             {\n  160 |                 error!(\"response to CONNECT with nonempty body\");\n  161 |                 res = res.map(|_| Body::empty());\n  162 |             }","lines":12,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum/src/routing/route.rs#L151-L162"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`FileStream::try_range_response` uses `end == 0` as a sentinel meaning \"unspecified, use file_size - 1\". This collides with a legitimate HTTP range request for exactly the first byte (`Range: bytes=0-0`), which is a valid range meaning \"just byte 0\". When such a request is translated into `start = 0, end = 0`, the function silently treats `end` as \"not specified\" and expands it to `total_size - 1`, returning the entire file instead of the single requested byte. This is a functional/logic bug baked into the API's use of `0` as a magic value instead of an `Option<u64>`.","fix":"Change the `end` parameter to `Option<u64>` so \"unspecified\" and \"explicitly 0\" can be distinguished:\n```rust\npub async fn try_range_response(\n    file_path: impl AsRef<Path>,\n    start: u64,\n    end: Option<u64>,\n) -> io::Result<Response> {\n    ...\n    let end = end.unwrap_or(total_size - 1);\n    ...\n}\n```\nThis requires updating callers (including the doc examples and the `range_stream` test helper) to pass `None` instead of `0` when no explicit end is given.","locations":[{"ref":"axum-extra/src/response/file_stream.rs:184-217","code":"  184 |     pub async fn try_range_response(\n  185 |         file_path: impl AsRef<Path>,\n  186 |         start: u64,\n  187 |         mut end: u64,\n  188 |     ) -> io::Result<Response> {\n  189 |         let mut file = File::open(file_path).await?;\n  190 | \n  191 |         let metadata = file.metadata().await?;\n  192 |         let total_size = metadata.len();\n  193 | \n  194 |         if total_size == 0 {\n  195 |             return Ok((StatusCode::RANGE_NOT_SATISFIABLE, \"Range Not Satisfiable\").into_response());\n  196 |         }\n  197 | \n  198 |         if end == 0 {\n  199 |             end = total_size - 1;\n  200 |         }\n  201 | \n  202 |         if start > total_size {\n  203 |             return Ok((StatusCode::RANGE_NOT_SATISFIABLE, \"Range Not Satisfiable\").into_response());\n  204 |         }\n  205 |         if start > end {\n  206 |             return Ok((StatusCode::RANGE_NOT_SATISFIABLE, \"Range Not Satisfiable\").into_response());\n  207 |         }\n  208 |         if end >= total_size {\n  209 |             return Ok((StatusCode::RANGE_NOT_SATISFIABLE, \"Range Not Satisfiable\").into_response());\n  210 |         }\n  211 | \n  212 |         file.seek(std::io::SeekFrom::Start(start)).await?;\n  213 | \n  214 |         let stream = ReaderStream::new(file.take(end - start + 1));\n  215 | \n  216 |         Ok(FileStream::new(stream).into_range_response(start, end, total_size))\n  217 |     }","lines":34,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum-extra/src/response/file_stream.rs#L184-L217"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Event::data()`/`Event::json_data()` (via `EventDataWriter::write_buf`) are documented as \"Panics if any `data` has already been written before\" (see the doc comments on `Event::data` and `Event::json_data`), but `write_buf` short-circuits on an empty input buffer before the `HAS_DATA` re-entry check runs:\n```rust\nfn write_buf(&mut self, buf: &[u8]) -> usize {\n    if buf.is_empty() {\n        return 0;\n    }\n    ...\n    if !std::mem::replace(&mut self.data_written, true) {\n        if self.event.flags.contains(EventFlags::HAS_DATA) {\n            panic!(\"Called `Event::data*` multiple times\");\n        }\n        ...\n    }\n```\nAs a result, `Event::default().data(\"first\").data(\"\")` does **not** panic even though data was already written, silently violating the documented invariant (verified with a temporary `#[should_panic]` test that failed because no panic occurred). Any caller relying on the documented panic-on-reuse behavior to catch accidental double-writes of `data` can be fooled by passing/receiving an empty string on the second call.","fix":"Move the empty-buffer fast path after the `HAS_DATA`/`data_written` invariant check (or perform the check unconditionally before the early return), e.g.:\n```rust\nfn write_buf(&mut self, buf: &[u8]) -> usize {\n    if !std::mem::replace(&mut self.data_written, true) {\n        if self.event.flags.contains(EventFlags::HAS_DATA) {\n            panic!(\"Called `Event::data*` multiple times\");\n        }\n        if buf.is_empty() {\n            return 0;\n        }\n        let buffer = self.event.buffer.as_mut();\n        let _ = buffer.write_str(\"data: \");\n        self.event.flags.insert(EventFlags::HAS_DATA);\n    } else if buf.is_empty() {\n        return 0;\n    }\n    ...\n}\n```\n(adjust so the `HAS_DATA`/reuse panic always fires on the first write attempt of a new writer, regardless of whether that first write happens to be empty).","locations":[{"ref":"axum/src/response/sse.rs:309-316","code":"  309 |     pub fn data<T>(self, data: T) -> Self\n  310 |     where\n  311 |         T: AsRef<str>,\n  312 |     {\n  313 |         let mut writer = self.into_data_writer();\n  314 |         let _ = writer.write_str(data.as_ref());\n  315 |         writer.into_event()\n  316 |     }","lines":8,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum/src/response/sse.rs#L309-L316"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The error message generated by `check_extractor_count` in axum-macros/src/debug_handler.rs suggests nesting extractors with `(a, b): (ExtractorA, ExtractorA)` - the second element of the example tuple repeats `ExtractorA` instead of using a distinct placeholder name like `ExtractorB`. This is a copy-paste typo in the compiler-facing error message shown to users when a handler/middleware takes more than 16 extractor arguments, making the example slightly confusing (it looks like both extractor types must be the same).","fix":"Rename the second placeholder in the example, e.g.:\n```rust\nlet error_message = format!(\n    \"{} cannot take more than {max_extractors} arguments. \\\n    Use `(a, b): (ExtractorA, ExtractorB)` to further nest extractors\",\n    kind.name_uppercase_plural(),\n);\n```","locations":[{"ref":"axum-macros/src/debug_handler.rs:153-161","code":"  153 |     } else {\n  154 |         let error_message = format!(\n  155 |             \"{} cannot take more than {max_extractors} arguments. \\\n  156 |             Use `(a, b): (ExtractorA, ExtractorA)` to further nest extractors\",\n  157 |             kind.name_uppercase_plural(),\n  158 |         );\n  159 |         let error = syn::Error::new_spanned(&item_fn.sig.inputs, error_message).to_compile_error();\n  160 |         Some(error)\n  161 |     }","lines":9,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum-macros/src/debug_handler.rs#L153-L161"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`set_cookies` silently drops any cookie whose `encoded()` representation fails to parse into a valid `HeaderValue` (e.g. a name/value containing characters that are illegal in an HTTP header). Because `IntoResponseParts::into_response_parts` for the cookie jars uses `Infallible` as its error type, there is no way for the caller to learn that one of the cookies they added via `.add(...)` was never actually sent in the response - it just vanishes from the `Set-Cookie` headers with no error, log, or panic.","fix":"At minimum, emit a `tracing::warn!` (or similar) when a cookie fails to encode into a header value so the failure isn't completely silent, e.g.:\n```rust\nfor cookie in jar.delta() {\n    match cookie.encoded().to_string().parse() {\n        Ok(header_value) => headers.append(SET_COOKIE, header_value),\n        Err(_) => tracing::warn!(\"failed to encode cookie {:?} as a header value\", cookie.name()),\n    }\n}\n```","locations":[{"ref":"axum-extra/src/extract/cookie/mod.rs:231-240","code":"  231 | fn set_cookies(jar: &cookie::CookieJar, headers: &mut HeaderMap) {\n  232 |     for cookie in jar.delta() {\n  233 |         if let Ok(header_value) = cookie.encoded().to_string().parse() {\n  234 |             headers.append(SET_COOKIE, header_value);\n  235 |         }\n  236 |     }\n  237 | \n  238 |     // we don't need to call `jar.reset_delta()` because `into_response_parts` consumes the cookie\n  239 |     // jar so it cannot be called multiple times.\n  240 | }","lines":10,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum-extra/src/extract/cookie/mod.rs#L231-L240"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Path deserialization errors that indicate a route/type-definition problem (a programmer error) are\ninconsistently classified. `ErrorKind::UnsupportedType` (e.g. nested `Vec<Vec<T>>`) is correctly treated\nas `500 Internal Server Error` in `FailedToDeserializePathParams::status` (axum/src/extract/path/mod.rs:\n436-450), since it stems from how the handler declared its extractor type, not from user input. However\nthe \"array types are not supported\" error, raised via `PathDeserializationError::custom(...)` in\n`ValueDeserializer`'s tuple `PairDeserializer::next_element_seed` (axum/src/extract/path/de.rs:456-461)\nfor the exact same class of problem (an unsupported shape for `Path<...>`, as shown by the\n`regression_3038` test with `[char; 2]` fields), is wrapped in `ErrorKind::Message` and is therefore\nclassified as `400 Bad Request` (axum/src/extract/path/mod.rs:439-450). This misleads API clients into\nthinking their request was malformed when the actual cause is the handler's extractor type definition.","fix":"Give this failure its own `ErrorKind` variant (or reuse `UnsupportedType`) instead of routing it through\nthe generic `custom()`/`Message` path, so `FailedToDeserializePathParams::status` classifies it as `500\nInternal Server Error` like other type-shape errors, e.g.:\n```rust\nSome(KeyOrIdx::Key(_)) => {\n    return Err(PathDeserializationError::unsupported_type(\"array (nested tuple value)\"));\n}\n```","locations":[{"ref":"axum/src/extract/path/de.rs:453-461","code":"  453 |                 match self.key.take() {\n  454 |                     Some(KeyOrIdx::Idx { idx: _, key }) => {\n  455 |                         return seed.deserialize(KeyDeserializer { key }).map(Some);\n  456 |                     }\n  457 |                     Some(KeyOrIdx::Key(_)) => {\n  458 |                         return Err(PathDeserializationError::custom(\n  459 |                             \"array types are not supported\",\n  460 |                         ));\n  461 |                     }","lines":9,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum/src/extract/path/de.rs#L453-L461"},{"ref":"axum/src/extract/path/mod.rs:437-451","code":"  437 |     /// Get the status code used for this rejection.\n  438 |     #[must_use]\n  439 |     pub fn status(&self) -> StatusCode {\n  440 |         match self.0.kind {\n  441 |             ErrorKind::Message(_)\n  442 |             | ErrorKind::DeserializeError { .. }\n  443 |             | ErrorKind::InvalidUtf8InPathParam { .. }\n  444 |             | ErrorKind::ParseError { .. }\n  445 |             | ErrorKind::ParseErrorAtIndex { .. }\n  446 |             | ErrorKind::ParseErrorAtKey { .. } => StatusCode::BAD_REQUEST,\n  447 |             ErrorKind::WrongNumberOfParameters { .. } | ErrorKind::UnsupportedType { .. } => {\n  448 |                 StatusCode::INTERNAL_SERVER_ERROR\n  449 |             }\n  450 |         }\n  451 |     }","lines":15,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum/src/extract/path/mod.rs#L437-L451"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`util::Either<A, B>` (a `pin_project!`-generated enum with `#[project = EitherProj]`) is defined but never constructed or referenced anywhere else in the `axum` crate (verified with a repo-wide grep for `Either` and `EitherProj` outside of `util.rs`; the only other `Either` types in the workspace live in the unrelated `axum-extra` crate's `axum_extra::either` module). It is `pub(crate)`, so it cannot be used from outside the crate either. This is leftover/dead code that adds an unused pin-projected type (with its own generated `EitherProj` and `Unpin` impls) to the compiled crate for no benefit, and can confuse future readers into thinking it's used somewhere.","fix":"Remove the unused `Either`/`EitherProj` type from `axum/src/util.rs` (or, if it was added in preparation for a future use, wire it up or move it behind `#[cfg(test)]`/leave a tracking comment).","locations":[{"ref":"axum/src/util.rs:40-46","code":"   40 | pin_project! {\n   41 |     #[project = EitherProj]\n   42 |     pub(crate) enum Either<A, B> {\n   43 |         A { #[pin] inner: A },\n   44 |         B { #[pin] inner: B },\n   45 |     }\n   46 | }","lines":7,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum/src/util.rs#L40-L46"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `# Return Value` doc sections for `serve()`/`Serve` and `WithGracefulShutdown` both still say \"this future resolves to `io::Result<()>`\" (and that it \"will never actually complete or return an error\" / \"returns `Ok(())`\"), but the actual `IntoFuture::Output` types are `Infallible` (for plain `Serve`) and `()` (for `WithGracefulShutdown`) - there is no `Result` involved at all any more. This became stale in commit f3a95d78 (\"Fix return types of serve futures\", #3601), which changed `type Output = io::Result<()>` to `Infallible`/`()` and removed the `.unwrap()` calls from every doctest/example in this file, but left the prose in the two `# Return Value` sections unchanged, so the documentation now contradicts the actual API (callers reading the docs would expect to be able to call `.unwrap()` or match on `Ok`/`Err`, which no longer compiles).","fix":"Update both doc blocks to match the real return types, e.g.:\n```rust\n/// # Return Value\n///\n/// This future's output type is `Infallible`; it never actually completes or returns. Errors on /// the TCP socket will be handled by sleeping for a short while (currently, one second).\n```\nand for `with_graceful_shutdown`:\n```rust\n/// # Return Value\n///\n/// Similarly to [`serve`], this future never returns an error. It resolves to `()` only after /// the `signal` future completes and all in-flight connections have finished.\n```","locations":[{"ref":"axum/src/serve/mod.rs:91-95","code":"   91 | /// # Return Value\n   92 | ///\n   93 | /// Although this future resolves to `io::Result<()>`, it will never actually complete or return an\n   94 | /// error. Errors on the TCP socket will be handled by sleeping for a short while (currently, one\n   95 | /// second).","lines":5,"link":"https://github.com/tokio-rs/axum/blob/9d1849626e8fe557b94c9f2e6732e441dd263825/axum/src/serve/mod.rs#L91-L9 (function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
