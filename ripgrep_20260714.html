n  445 | /// By default, all ignore files found are respected. This includes `.ignore`,\n  446 | /// `.gitignore`, `.git/info/exclude` and even your global gitignore\n  447 | /// globs, usually found in `$XDG_CONFIG_HOME/git/ignore`.\n  448 | ///\n  449 | /// Some standard recursive directory options are also supported, such as\n  450 | /// limiting the recursive depth or whether to follow symbolic links (disabled\n  451 | /// by default).\n  452 | ///\n  453 | /// # Ignore rules\n  454 | ///\n  455 | /// There are many rules that influence whether a particular file or directory\n  456 | /// is skipped by this iterator. Those rules are documented here. Note that\n  457 | /// the rules assume a default configuration.\n  458 | ///\n  459 | /// * First, glob overrides are checked. If a path matches a glob override,\n  460 | /// then matching stops. The path is then only skipped if the glob that matched\n  461 | /// the path is an ignore glob. (An override glob is a whitelist glob unless it\n  462 | /// starts with a `!`, in which case it is an ignore glob.)\n  463 | /// * Second, ignore files are checked. Ignore files currently only come from\n  464 | /// git ignore files (`.gitignore`, `.git/info/exclude` and the configured\n  465 | /// global gitignore file), plain `.ignore` files, which have the same format\n  466 | /// as gitignore files, or explicitly added ignore files. The precedence order\n  467 | /// is: `.ignore`, `.gitignore`, `.git/info/exclude`, global gitignore and\n  468 | /// finally explicitly added ignore files. Note that precedence between\n  469 | /// different types of ignore files is not impacted by the directory hierarchy;\n  470 | /// any `.ignore` file overrides all `.gitignore` files. Within each precedence\n  471 | /// level, more nested ignore files have a higher precedence than less nested\n  472 | /// ignore files.\n  473 | /// * Third, if the previous step yields an ignore match, then all matching\n  474 | /// is stopped and the path is skipped. If it yields a whitelist match, then\n  475 | /// matching continues. A whitelist match can be overridden by a later matcher.\n  476 | /// * Fourth, unless the path is a directory, the file type matcher is run on\n  477 | /// the path. As above, if it yields an ignore match, then all matching is\n  478 | /// stopped and the path is skipped. If it yields a whitelist match, then\n  479 | /// matching continues.\n  480 | /// * Fifth, if the path hasn't been whitelisted and it is hidden, then the\n  481 | /// path is skipped.\n  482 | /// * Sixth, unless the path is a directory, the size of the file is compared\n  483 | /// against the max filesize limit. If it exceeds the limit, it is skipped.\n  484 | /// * Seventh, if the path has made it this far then it is yielded in the\n  485 | /// iterator.\n  486 | #[derive(Clone)]\n  487 | pub struct WalkBuilder {\n  488 |     paths: Vec<PathBuf>,\n  489 |     ig_builder: IgnoreBuilder,\n  490 |     max_depth: Option<usize>,\n  491 |     min_depth: Option<usize>,\n  492 |     max_filesize: Option<u64>,\n  493 |     follow_links: bool,\n  494 |     same_file_system: bool,\n  495 |     sorter: Option<Sorter>,\n  496 |     threads: usize,\n  497 |     skip: Option<Arc<Handle>>,\n  498 |     filter: Option<Filter>,\n  499 |     /// The directory that gitignores should be interpreted relative to.\n  500 |     ///\n  501 |     /// Usually this is the directory containing the gitignore file. But in\n  502 |     /// some cases, like for global gitignores or for gitignores specified\n  503 |     /// explicitly, this should generally be set to the current working\n  504 |     /// directory. This is only used for global gitignores or \"explicit\"\n  505 |     /// gitignores.\n  506 |     ///\n  507 |     /// When `None`, the CWD is fetched from `std::env::current_dir()`. If\n  508 |     /// that fails, then global gitignores are ignored (an error is logged).\n  509 |     global_gitignores_relative_to:\n  510 |         OnceLock<Result<PathBuf, Arc<std::io::Error>>>,\n  511 | }\n  512 | \n  513 | #[derive(Clone)]\n  514 | enum Sorter {\n  515 |     ByName(Arc<dyn Fn(&OsStr, &OsStr) -> Ordering + Send + Sync + 'static>),\n  516 |     ByPath(Arc<dyn Fn(&Path, &Path) -> Ordering + Send + Sync + 'static>),\n  517 | }\n  518 | \n  519 | #[derive(Clone)]\n  520 | struct Filter(Arc<dyn Fn(&DirEntry) -> bool + Send + Sync + 'static>);\n  521 | \n  522 | impl std::fmt::Debug for WalkBuilder {\n  523 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  524 |         f.debug_struct(\"WalkBuilder\")\n  525 |             .field(\"paths\", &self.paths)\n  526 |             .field(\"ig_builder\", &self.ig_builder)\n  527 |             .field(\"max_depth\", &self.max_depth)\n  528 |             .field(\"min_depth\", &self.min_depth)\n  529 |             .field(\"max_filesize\", &self.max_filesize)\n  530 |             .field(\"follow_links\", &self.follow_links)\n  531 |             .field(\"same_file_system\", &self.same_file_system)\n  532 |             .field(\"sorter\", &\"<...>\")\n  533 |             .field(\"threads\", &self.threads)\n  534 |             .field(\"skip\", &self.skip)\n  535 |             .field(\"filter\", &\"<...>\")\n  536 |             .field(\n  537 |                 \"global_gitignores_relative_to\",\n  538 |                 &self.global_gitignores_relative_to,\n  539 |             )\n  540 |             .finish()\n  541 |     }\n  542 | }\n  543 | \n  544 | impl WalkBuilder {\n  545 |     /// Create a new builder for a recursive directory iterator for the\n  546 |     /// directory given.\n  547 |     ///\n  548 |     /// Note that if you want to traverse multiple different directories, it\n  549 |     /// is better to call `add` on this builder than to create multiple\n  550 |     /// `Walk` values.\n  551 |     pub fn new<P: AsRef<Path>>(path: P) -> WalkBuilder {\n  552 |         WalkBuilder::from_iter([path])\n  553 |     }\n  554 | \n  555 |     /// Create an empty builder to which paths can be added.\n  556 |     ///\n  557 |     /// Note that if you call `build` on this instance before calling `add`\n  558 |     /// on it, it will return exactly zero items during iteration.\n  559 |     pub fn empty() -> WalkBuilder {\n  560 |         WalkBuilder {\n  561 |             paths: vec![],\n  562 |             ig_builder: IgnoreBuilder::new(),\n  563 |             max_depth: None,\n  564 |             min_depth: None,\n  565 |             max_filesize: None,\n  566 |             follow_links: false,\n  567 |             same_file_system: false,\n  568 |             sorter: None,\n  569 |             threads: 0,\n  570 |             skip: None,\n  571 |             filter: None,\n  572 |             global_gitignores_relative_to: OnceLock::new(),\n  573 |         }\n  574 |     }\n  575 | \n  576 |     /// Create a new builder for a recursive directory iterator from the\n  577 |     /// sequence of paths.\n  578 |     ///\n  579 |     /// Note that if the iterator is empty, this is the same as\n  580 |     /// `WalkBuilder::empty`.\n  581 |     pub fn from_iter<P: AsRef<Path>, I: IntoIterator<Item = P>>(\n  582 |         paths: I,\n  583 |     ) -> WalkBuilder {\n  584 |         let mut builder = WalkBuilder::empty();\n  585 |         for path in paths.into_iter() {\n  586 |             builder.add(path);\n  587 |         }\n  588 |         builder\n  589 |     }\n  590 | \n  591 |     /// Build a new `Walk` iterator.\n  592 |     pub fn build(&self) -> Walk {\n  593 |         let follow_links = self.follow_links;\n  594 |         let max_depth = self.max_depth;\n  595 |         let min_depth = self.min_depth;\n  596 |         let sorter = self.sorter.clone();\n  597 |         let its = self\n  598 |             .paths\n  599 |             .iter()\n  600 |             .map(move |p| {\n  601 |                 if p == Path::new(\"-\") {\n  602 |                     (p.to_path_buf(), None)\n  603 |                 } else {\n  604 |                     let mut wd = WalkDir::new(p);\n  605 |                     wd = wd.follow_links(follow_links || p.is_file());\n  606 |                     wd = wd.same_file_system(self.same_file_system);\n  607 |                     if let Some(max_depth) = max_depth {\n  608 |                         wd = wd.max_depth(max_depth);\n  609 |                     }\n  610 |                     if let Some(min_depth) = min_depth {\n  611 |                         wd = wd.min_depth(min_depth);\n  612 |                     }\n  613 |                     if let Some(ref sorter) = sorter {\n  614 |                         match sorter.clone() {\n  615 |                             Sorter::ByName(cmp) => {\n  616 |                                 wd = wd.sort_by(move |a, b| {\n  617 |                                     cmp(a.file_name(), b.file_name())\n  618 |                                 });\n  619 |                             }\n  620 |                             Sorter::ByPath(cmp) => {\n  621 |                                 wd = wd.sort_by(move |a, b| {\n  622 |                                     cmp(a.path(), b.path())\n  623 |                                 });\n  624 |                             }\n  625 |                         }\n  626 |                     }\n  627 |                     (p.to_path_buf(), Some(WalkEventIter::from(wd)))\n  628 |                 }\n  629 |             })\n  630 |             .collect::<Vec<_>>()\n  631 |             .into_iter();\n  632 |         let ig_root = self\n  633 |             .get_or_set_current_dir()\n  634 |             .map(|cwd| self.ig_builder.build_with_cwd(Some(cwd.to_path_buf())))\n  635 |             .unwrap_or_else(|| self.ig_builder.build());\n  636 |         Walk {\n  637 |             its,\n  638 |             it: None,\n  639 |             ig_root: ig_root.clone(),\n  640 |             ig: ig_root.clone(),\n  641 |             max_filesize: self.max_filesize,\n  642 |             skip: self.skip.clone(),\n  643 |             filter: self.filter.clone(),\n  644 |         }\n  645 |     }\n  646 | \n  647 |     /// Build a new `WalkParallel` iterator.\n  648 |     ///\n  649 |     /// Note that this *doesn't* return something that implements `Iterator`.\n  650 |     /// Instead, the returned value must be run with a closure. e.g.,\n  651 |     /// `builder.build_parallel().run(|| |path| { println!(\"{path:?}\"); WalkState::Continue })`.\n  652 |     pub fn build_parallel(&self) -> WalkParallel {\n  653 |         let ig_root = self\n  654 |             .get_or_set_current_dir()\n  655 |             .map(|cwd| self.ig_builder.build_with_cwd(Some(cwd.to_path_buf())))\n  656 |             .unwrap_or_else(|| self.ig_builder.build());\n  657 |         WalkParallel {\n  658 |             paths: self.paths.clone().into_iter(),\n  659 |             ig_root,\n  660 |             max_depth: self.max_depth,\n  661 |             min_depth: self.min_depth,\n  662 |             max_filesize: self.max_filesize,\n  663 |             follow_links: self.follow_links,\n  664 |             same_file_system: self.same_file_system,\n  665 |             threads: self.threads,\n  666 |             skip: self.skip.clone(),\n  667 |             filter: self.filter.clone(),\n  668 |         }\n  669 |     }\n  670 | \n  671 |     /// Add a file path to the iterator.\n  672 |     ///\n  673 |     /// Each additional file path added is traversed recursively. This should\n  674 |     /// be preferred over building multiple `Walk` iterators since this\n  675 |     /// enables reusing resources across iteration.\n  676 |     pub fn add<P: AsRef<Path>>(&mut self, path: P) -> &mut WalkBuilder {\n  677 |         self.paths.push(path.as_ref().to_path_buf());\n  678 |         self\n  679 |     }\n  680 | \n  681 |     /// The maximum depth to recurse.\n  682 |     ///\n  683 |     /// The default, `None`, imposes no depth restriction.\n  684 |     pub fn max_depth(&mut self, depth: Option<usize>) -> &mut WalkBuilder {\n  685 |         self.max_depth = depth;\n  686 |         if self.min_depth.is_some()\n  687 |             && self.max_depth.is_some()\n  688 |             && self.max_depth < self.min_depth\n  689 |         {\n  690 |             self.max_depth = self.min_depth;\n  691 |         }\n  692 |         self\n  693 |     }\n  694 | \n  695 |     /// The minimum depth to recurse.\n  696 |     ///\n  697 |     /// The default, `None`, imposes no minimum depth restriction.\n  698 |     pub fn min_depth(&mut self, depth: Option<usize>) -> &mut WalkBuilder {\n  699 |         self.min_depth = depth;\n  700 |         if self.max_depth.is_some()\n  701 |             && self.min_depth.is_some()\n  702 |             && self.min_depth > self.max_depth\n  703 |         {\n  704 |             self.min_depth = self.max_depth;\n  705 |         }\n  706 |         self\n  707 |     }\n  708 | \n  709 |     /// Whether to follow symbolic links or not.\n  710 |     pub fn follow_links(&mut self, yes: bool) -> &mut WalkBuilder {\n  711 |         self.follow_links = yes;\n  712 |         self\n  713 |     }\n  714 | \n  715 |     /// Whether to ignore files above the specified limit.\n  716 |     pub fn max_filesize(&mut self, filesize: Option<u64>) -> &mut WalkBuilder {\n  717 |         self.max_filesize = filesize;\n  718 |         self\n  719 |     }\n  720 | \n  721 |     /// The number of threads to use for traversal.\n  722 |     ///\n  723 |     /// Note that this only has an effect when using `build_parallel`.\n  724 |     ///\n  725 |     /// The default setting is `0`, which chooses the number of threads\n  726 |     /// automatically using heuristics.\n  727 |     pub fn threads(&mut self, n: usize) -> &mut WalkBuilder {\n  728 |         self.threads = n;\n  729 |         self\n  730 |     }\n  731 | \n  732 |     /// Add a global ignore file to the matcher.\n  733 |     ///\n  734 |     /// This has lower precedence than all other sources of ignore rules.\n  735 |     ///\n  736 |     /// # Errors\n  737 |     ///\n  738 |     /// If there was a problem adding the ignore file, then an error is\n  739 |     /// returned. Note that the error may indicate *partial* failure. For\n  740 |     /// example, if an ignore file contains an invalid glob, all other globs\n  741 |     /// are still applied.\n  742 |     ///\n  743 |     /// An error will also occur if this walker could not get the current\n  744 |     /// working directory (and `WalkBuilder::current_dir` isn't set).\n  745 |     pub fn add_ignore<P: AsRef<Path>>(&mut self, path: P) -> Option<Error> {\n  746 |         let path = path.as_ref();\n  747 |         let Some(cwd) = self.get_or_set_current_dir() else {\n  748 |             let err = std::io::Error::other(format!(\n  749 |                 \"CWD is not known, ignoring global gitignore {}\",\n  750 |                 path.display()\n  751 |             ));\n  752 |             return Some(err.into());\n  753 |         };\n  754 |         let mut builder = GitignoreBuilder::new(cwd);\n  755 |         let mut errs = PartialErrorBuilder::default();\n  756 |         errs.maybe_push(builder.add(path));\n  757 |         match builder.build() {\n  758 |             Ok(gi) => {\n  759 |                 self.ig_builder.add_ignore(gi);\n  760 |             }\n  761 |             Err(err) => {\n  762 |                 errs.push(err);\n  763 |             }\n  764 |         }\n  765 |         errs.into_error_option()\n  766 |     }\n  767 | \n  768 |     /// Add a custom ignore file name\n  769 |     ///\n  770 |     /// These ignore files have higher precedence than all other ignore files.\n  771 |     ///\n  772 |     /// When specifying multiple names, earlier names have lower precedence than\n  773 |     /// later names.\n  774 |     pub fn add_custom_ignore_filename<S: AsRef<OsStr>>(\n  775 |         &mut self,\n  776 |         file_name: S,\n  777 |     ) -> &mut WalkBuilder {\n  778 |         self.ig_builder.add_custom_ignore_filename(file_name);\n  779 |         self\n  780 |     }\n  781 | \n  782 |     /// Add an override matcher.\n  783 |     ///\n  784 |     /// By default, no override matcher is used.\n  785 |     ///\n  786 |     /// This overrides any previous setting.\n  787 |     pub fn overrides(&mut self, overrides: Override) -> &mut WalkBuilder {\n  788 |         self.ig_builder.overrides(overrides);\n  789 |         self\n  790 |     }\n  791 | \n  792 |     /// Add a file type matcher.\n  793 |     ///\n  794 |     /// By default, no file type matcher is used.\n  795 |     ///\n  796 |     /// This overrides any previous setting.\n  797 |     pub fn types(&mut self, types: Types) -> &mut WalkBuilder {\n  798 |         self.ig_builder.types(types);\n  799 |         self\n  800 |     }\n  801 | \n  802 |     /// Enables all the standard ignore filters.\n  803 |     ///\n  804 |     /// This toggles, as a group, all the filters that are enabled by default:\n  805 |     ///\n  806 |     /// - [hidden()](#method.hidden)\n  807 |     /// - [parents()](#method.parents)\n  808 |     /// - [ignore()](#method.ignore)\n  809 |     /// - [git_ignore()](#method.git_ignore)\n  810 |     /// - [git_global()](#method.git_global)\n  811 |     /// - [git_exclude()](#method.git_exclude)\n  812 |     ///\n  813 |     /// They may still be toggled individually after calling this function.\n  814 |     ///\n  815 |     /// This is (by definition) enabled by default.\n  816 |     pub fn standard_filters(&mut self, yes: bool) -> &mut WalkBuilder {\n  817 |         self.hidden(yes)\n  818 |             .parents(yes)\n  819 |             .ignore(yes)\n  820 |             .git_ignore(yes)\n  821 |             .git_global(yes)\n  822 |             .git_exclude(yes)\n  823 |     }\n  824 | \n  825 |     /// Enables ignoring hidden files.\n  826 |     ///\n  827 |     /// This is enabled by default.\n  828 |     pub fn hidden(&mut self, yes: bool) -> &mut WalkBuilder {\n  829 |         self.ig_builder.hidden(yes);\n  830 |         self\n  831 |     }\n  832 | \n  833 |     /// Enables reading ignore files from parent directories.\n  834 |     ///\n  835 |     /// If this is enabled, then .gitignore files in parent directories of each\n  836 |     /// file path given are respected. Otherwise, they are ignored.\n  837 |     ///\n  838 |     /// This is enabled by default.\n  839 |     pub fn parents(&mut self, yes: bool) -> &mut WalkBuilder {\n  840 |         self.ig_builder.parents(yes);\n  841 |         self\n  842 |     }\n  843 | \n  844 |     /// Enables reading `.ignore` files.\n  845 |     ///\n  846 |     /// `.ignore` files have the same semantics as `gitignore` files and are\n  847 |     /// supported by search tools such as ripgrep and The Silver Searcher.\n  848 |     ///\n  849 |     /// This is enabled by default.\n  850 |     pub fn ignore(&mut self, yes: bool) -> &mut WalkBuilder {\n  851 |         self.ig_builder.ignore(yes);\n  852 |         self\n  853 |     }\n  854 | \n  855 |     /// Enables reading a global gitignore file, whose path is specified in\n  856 |     /// git's `core.excludesFile` config option.\n  857 |     ///\n  858 |     /// Git's config file location is `$HOME/.gitconfig`. If `$HOME/.gitconfig`\n  859 |     /// does not exist or does not specify `core.excludesFile`, then\n  860 |     /// `$XDG_CONFIG_HOME/git/ignore` is read. If `$XDG_CONFIG_HOME` is not\n  861 |     /// set or is empty, then `$HOME/.config/git/ignore` is used instead.\n  862 |     ///\n  863 |     /// This is enabled by default.\n  864 |     pub fn git_global(&mut self, yes: bool) -> &mut WalkBuilder {\n  865 |         self.ig_builder.git_global(yes);\n  866 |         self\n  867 |     }\n  868 | \n  869 |     /// Enables reading `.gitignore` files.\n  870 |     ///\n  871 |     /// `.gitignore` files have match semantics as described in the `gitignore`\n  872 |     /// man page.\n  873 |     ///\n  874 |     /// This is enabled by // Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
