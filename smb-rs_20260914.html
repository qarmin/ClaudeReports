{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Both directory-listing iterators retry indefinitely after an error instead of terminating the iteration/stream. In the async `QueryDirectoryStream::fetch_loop`, on `Err(e)` the error is forwarded to the channel but the outer `loop` continues and calls `send_query` again on the next notification (`crates/smb/src/resource/directory.rs:706-735`); the sync `QueryDirectoryIterator::next` behaves the same way - on `Err(e)` it returns `Some(Err(e))` without recording that a terminal error occurred, so the following call to `next()` invokes `send_query` again (`crates/smb/src/resource/directory.rs:809-836`). If the underlying error is not transient (e.g. `Error::ConnectionStopped`, permission revoked, or a hard protocol error), a consumer that keeps polling the stream/iterator (a very natural usage pattern, e.g. `while let Some(item) = stream.next().await`) gets an endless sequence of repeated errors instead of the iteration properly ending, and the client keeps re-issuing `QueryDirectory` requests to the server (or repeatedly failing fast in a tight loop for connection-level errors) with no backoff or termination.","fix":"Track whether a terminal error occurred and stop querying afterwards, e.g. in the sync iterator:\n```rust\nstruct QueryDirectoryIterator<'a, T> {\n    ...\n    done: bool,\n}\nfn next(&mut self) -> Option<Self::Item> {\n    if self.done { return None; }\n    ...\n    match query_result {\n        Err(e) => { self.done = true; Some(Err(e)) }\n        ...\n    }\n}\n```\nApply the analogous `break` after sending the error in `fetch_loop` for the async version.","locations":[{"ref":"crates/smb/src/resource/directory.rs:698-735","code":"  698 |         async fn fetch_loop(\n  699 |             directory: Arc<Directory>,\n  700 |             pattern: String,\n  701 |             buffer_size: u32,\n  702 |             sender: mpsc::Sender<crate::Result<T>>,\n  703 |             notify_fetch_next: Arc<tokio::sync::Notify>,\n  704 |         ) {\n  705 |             let mut is_first = true;\n  706 |             loop {\n  707 |                 let result = directory\n  708 |                     .send_query::<T>(&pattern, is_first, buffer_size)\n  709 |                     .await;\n  710 |                 is_first = false;\n  711 | \n  712 |                 match result {\n  713 |                     Ok(items) => {\n  714 |                         if items.is_empty() {\n  715 |                             // No more files, exit the loop\n  716 |                             break;\n  717 |                         }\n  718 |                         for item in items {\n  719 |                             if sender.send(Ok(item)).await.is_err() {\n  720 |                                 return; // Receiver dropped\n  721 |                             }\n  722 |                         }\n  723 |                     }\n  724 |                     Err(e) => {\n  725 |                         if sender.send(Err(e)).await.is_err() {\n  726 |                             return; // Receiver dropped\n  727 |                         }\n  728 |                     }\n  729 |                 }\n  730 | \n  731 |                 // Notify the stream that a new batch is available\n  732 |                 notify_fetch_next.notify_waiters();\n  733 |                 notify_fetch_next.notified().await;\n  734 |             }\n  735 |         }","lines":38,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/directory.rs#L698-L735"},{"ref":"crates/smb/src/resource/directory.rs:803-837","code":"  803 |     impl<'a, T> Iterator for QueryDirectoryIterator<'a, T>\n  804 |     where\n  805 |         T: QueryDirectoryInfoValue + for<'b> binrw::prelude::BinWrite<Args<'b> = ()>,\n  806 |     {\n  807 |         type Item = crate::Result<T>;\n  808 | \n  809 |         fn next(&mut self) -> Option<Self::Item> {\n  810 |             // Pop from backlog if we have any results left.\n  811 |             if !self.backlog.is_empty() {\n  812 |                 return Some(Ok(self.backlog.remove(0)));\n  813 |             }\n  814 | \n  815 |             // If we have no backlog, we need to query the directory again.\n  816 |             let query_result =\n  817 |                 self.directory\n  818 |                     .send_query::<T>(&self.pattern, self.is_first, self.buffer_size);\n  819 |             self.is_first = false;\n  820 |             match query_result {\n  821 |                 Ok(next_backlog) => {\n  822 |                     if next_backlog.is_empty() {\n  823 |                         // No more items\n  824 |                         None\n  825 |                     } else {\n  826 |                         // Store the items in the backlog and return the first one.\n  827 |                         self.backlog = next_backlog;\n  828 |                         self.next()\n  829 |                     }\n  830 |                 }\n  831 |                 Err(e) => {\n  832 |                     // Another error occurred, return it.\n  833 |                     Some(Err(e))\n  834 |                 }\n  835 |             }\n  836 |         }\n  837 |     }","lines":35,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/directory.rs#L803-L837"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Progress reporting in `crates/smb/src/resource/file_util.rs` is optimistic and can report 100% completion before the copy has actually finished. `block_copy_task` (`file_util.rs:497-501`) increments `state.current_block` via `fetch_add` *before* performing the actual `read_at_channel`/`write_at_channel` I/O for that block, so with N parallel workers, up to N blocks can be \"claimed\" (and thus counted) while still in flight. `CopyState::bytes_copied` (`file_util.rs:243-250`) and `CopyState::progress` (`file_util.rs:252-259`) derive progress purely from `current_block`, so they can report the entirety of those in-flight blocks as already copied. In `smb-cli/src/copy.rs`'s `progress_loop` (`smb-cli/src/copy.rs:235-246`), the loop exits and prints \"Copy complete\" as soon as `bytes_copied() >= total_size()`, which can happen slightly before the corresponding write futures actually resolve.","fix":"Track completed bytes with a separate counter incremented *after* the write succeeds, rather than reusing the block-claim counter for progress, e.g. add an `AtomicU64` `completed_bytes` to `CopyState` and `fetch_add(bytes_written, Ordering::SeqCst)` after `to.write_at_channel(...)` succeeds in `block_copy_task`, then have `bytes_copied()` read that counter instead of `current_block * max_chunk_size`.","locations":[{"ref":"crates/smb/src/resource/file_util.rs:236-265","code":"  236 |     impl CopyState {\n  237 |         /// Returns the total size of the file being copied (in bytes).\n  238 |         pub fn total_size(&self) -> u64 {\n  239 |             self.total_size\n  240 |         }\n  241 | \n  242 |         /// Returns the number of bytes copied so far.\n  243 |         pub fn bytes_copied(&self) -> u64 {\n  244 |             let current_block = self.current_block.load(std::sync::atomic::Ordering::SeqCst);\n  245 |             if current_block > self.last_block {\n  246 |                 self.total_size\n  247 |             } else {\n  248 |                 current_block * self.max_chunk_size\n  249 |             }\n  250 |         }\n  251 | \n  252 |         /// Returns the progress of the copy operation as a value between 0.0 and 1.0.\n  253 |         pub fn progress(&self) -> f64 {\n  254 |             if self.total_size == 0 {\n  255 |                 1.0\n  256 |             } else {\n  257 |                 self.bytes_copied() as f64 / self.total_size as f64\n  258 |             }\n  259 |         }\n  260 | \n  261 |         /// Returns the number of parallel jobs being used for the copy operation.\n  262 |         pub fn num_total_jobs(&self) -> usize {\n  263 |             self.channel_jobs.values().sum()\n  264 |         }\n  265 |     }","lines":30,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/file_util.rs#L236-L265"},{"ref":"crates/smb/src/resource/file_util.rs:495-526","code":"  495 |         let mut curr_chunk = vec![0u8; state.max_chunk_size as usize];\n  496 | \n  497 |         loop {\n  498 |             let current_block = state\n  499 |                 .current_block\n  500 |                 .fetch_add(1, std::sync::atomic::Ordering::SeqCst);\n  501 |             if current_block > state.last_block {\n  502 |                 break;\n  503 |             }\n  504 |             let chunk_size = if current_block == state.last_block {\n  505 |                 let last_block_leftover = state.total_size % state.max_chunk_size;\n  506 |                 if last_block_leftover == 0 {\n  507 |                     break;\n  508 |                 }\n  509 |                 last_block_leftover\n  510 |             } else {\n  511 |                 state.max_chunk_size\n  512 |             } as usize;\n  513 | \n  514 |             let offset = current_block * state.max_chunk_size;\n  515 |             let bytes_read = from\n  516 |                 .read_at_channel(&mut curr_chunk[..chunk_size], offset, channel_id)\n  517 |                 .await?;\n  518 |             if bytes_read < chunk_size {\n  519 |                 log::warn!(\n  520 |                     \"Task {task_id}@{channel_id:?}: Read less bytes than expected. File might be corrupt. Expected: {chunk_size}: {bytes_read}\"\n  521 |                 );\n  522 |             }\n  523 |             let valid_chunk_end = bytes_read;\n  524 |             to.write_at_channel(&curr_chunk[..valid_chunk_end], offset, channel_id)\n  525 |                 .await?;\n  526 |         }","lines":32,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/file_util.rs#L495-L526"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`block_copy_channel_progress` (single-threaded copy path) in `crates/smb/src/resource/file_util.rs:564-601` loops `while offset < file_length` and advances via `offset += bytes_read as u64;` where `bytes_read` comes from `from.read_at_channel(...)`. If a read ever legitimately returns `0` bytes without returning an `Err` (e.g. a transient short read, or a `ReadAtChannel` implementation that can return 0 before EOF), the loop does not detect this beyond a warning log and `offset` never advances, resulting in an infinite loop that repeatedly performs zero-length reads/writes and never returns.","fix":"Detect a zero-byte read and turn it into an error rather than looping forever, e.g.:\n```rust\nlet bytes_read = from.read_at_channel(&mut curr_chunk[..chunk_size], offset, channel)?;\nif bytes_read == 0 {\n    return Err(crate::Error::InvalidMessage(\"Unexpected EOF while copying\".to_string()));\n}\n```","locations":[{"ref":"crates/smb/src/resource/file_util.rs:581-599","code":"  581 |         while offset < file_length {\n  582 |             let chunk_size = if offset + curr_chunk.len() as u64 > file_length {\n  583 |                 (file_length - offset) as usize\n  584 |             } else {\n  585 |                 curr_chunk.len()\n  586 |             };\n  587 |             let bytes_read =\n  588 |                 from.read_at_channel(&mut curr_chunk[..chunk_size], offset, channel)?;\n  589 |             if bytes_read < chunk_size {\n  590 |                 log::warn!(\n  591 |                     \"Read less bytes than expected. File might be corrupt. Expected: {chunk_size}: {bytes_read}\"\n  592 |                 );\n  593 |             }\n  594 |             to.write_at(&curr_chunk[..bytes_read], offset)?;\n  595 |             offset += bytes_read as u64;\n  596 |             if let Some(callback) = progress_callback {\n  597 |                 callback(offset);\n  598 |             }\n  599 |         }","lines":19,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/file_util.rs#L581-L599"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SID::from_str` (`crates/smb-dtyp/src/security/sid.rs:55-93`) cannot round-trip the hex `IdentifierAuthority` format that `SID`'s own `Display` impl produces. Per MS-DTYP 2.4.2.1, when the identifier authority is `>= 2^32`, the string form encodes it as a single token `0xNNNNNNNNNNNN` immediately after `S-1-` (no dash between `0x` and the digits) - which is exactly what `Display` writes (`write!(f, \"0x{:x}\", ...)`). But `from_str` splits the string on `-` and only recognizes the hex form when the *entire* dash-delimited token equals the literal string `\"0x\"` (`Some(\"0x\") => { ... s.next() ... }`), i.e. it expects a spurious extra dash between `0x` and the digits (`S-1-0x-NNNN...`) that never actually occurs. As a result, any real-world SID whose identifier authority is `>= 2^32` fails to `Display -> parse` round-trip: `to_string()` produces a string that `from_str` cannot parse back (it falls through to the plain-decimal branch and fails with \"Identifier authority format is incorrect\").","fix":"Match on a prefix instead of requiring `\"0x\"` as its own dash-delimited segment, e.g. peek at the first token and check `token.starts_with(\"0x\")`, parsing the hex digits after the prefix from that same token:\n```rust\nlet identifier_authority = match s.next() {\n    Some(tok) if let Some(hex) = tok.strip_prefix(\"0x\") => {\n        let p = u64::from_str_radix(hex, 16).map_err(|_| \"Identifier authority format is incorrect\")?;\n        if p >> 32 == 0 { return Err(\"Identifier authority format is incorrect\"); }\n        p\n    }\n    Some(x) => x.parse().map_err(|_| \"Identifier authority format is incorrect\")?,\n    None => return Err(\"SID format is incorrect - missing authority\"),\n};\n```","locations":[{"ref":"crates/smb-dtyp/src/security/sid.rs:55-93","code":"   55 | impl FromStr for SID {\n   56 |     type Err = &'static str;\n   57 | \n   58 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n   59 |         // 1. starts with S-1-:\n   60 |         if !s.starts_with(Self::PREFIX) {\n   61 |             return Err(\"SID must start with S-1-\");\n   62 |         }\n   63 |         let mut s = s[Self::PREFIX.len()..].split('-');\n   64 |         // 2. authority is a number, possibly in hex.\n   65 |         let identifier_authority = match s.next() {\n   66 |             Some(\"0x\") => {\n   67 |                 // hex is only for sub-authorities > 32 bits!\n   68 |                 let p = u64::from_str_radix(\n   69 |                     s.next().ok_or(\"Identifier authority format is incorrect\")?,\n   70 |                     16,\n   71 |                 )\n   72 |                 .map_err(|_| \"Identifier authority format is incorrect\")?;\n   73 |                 if p >> 32 == 0 {\n   74 |                     p\n   75 |                 } else {\n   76 |                     return Err(\"Identifier authority format is incorrect\");\n   77 |                 }\n   78 |             }\n   79 |             Some(x) => x\n   80 |                 .parse()\n   81 |                 .map_err(|_| \"Identifier authority format is incorrect\")?,\n   82 |             None => return Err(\"SID format is incorrect - missing authority\"),\n   83 |         };\n   84 |         // 3. sub-authorities are numbers.\n   85 |         let sub_authority = s\n   86 |             .map(|x| x.parse().map_err(|_| \"Sub-authority format is incorrect\"))\n   87 |             .collect::<Result<_, _>>()?;\n   88 |         Ok(SID {\n   89 |             identifier_authority,\n   90 |             sub_authority,\n   91 |         })\n   92 |     }\n   93 | }","lines":39,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-dtyp/src/security/sid.rs#L55-L93"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `common_struct_changes` (`crates/smb-msg-derive/src/lib.rs:156-193`), when renaming a struct field literally named `reserved` to avoid name clashes, the new identifier is derived from `proc_macro2::Span::call_site().start().line` (lines 169-173). `Span::call_site()` is the span of the *macro invocation* (the `#[smb_request(...)]`/`#[smb_response(...)]` attribute on the struct), which is the same for every field in the struct - it does not vary per-field. If a single struct ever has more than one field named `reserved` (a legitimate pattern for structs with multiple distinct padding/reserved regions per MS-SMB2), all of them would be renamed to the exact same identifier (`_reserved<sameLine>`), producing a \"field already declared\" compile error instead of the intended unique-per-field renaming.","fix":"Derive the unique suffix from each field's own index/span instead of the shared macro call-site, e.g.:\n```rust\nfor (idx, field) in fields.named.iter_mut().enumerate() {\n    if field.ident.as_ref().is_some_and(|id| *id == \"reserved\") {\n        field.ident = Some(syn::Ident::new(&format!(\"_reserved{idx}\"), field.ident.span()));\n        ...\n```","locations":[{"ref":"crates/smb-msg-derive/src/lib.rs:156-193","code":"  156 |     if let Fields::Named(ref mut fields) = item.fields {\n  157 |         for field in fields.named.iter_mut() {\n  158 |             if field.ident.as_ref().is_some_and(|id| *id == \"reserved\") {\n  159 |                 if field.vis != syn::Visibility::Inherited {\n  160 |                     return syn::Error::new_spanned(\n  161 |                         &field.vis,\n  162 |                         \"reserved field must have no visibility defined\",\n  163 |                     )\n  164 |                     .to_compile_error()\n  165 |                     .into();\n  166 |                 }\n  167 | \n  168 |                 // Put a new, unique name for the field to avoid conflicts.\n  169 |                 let line_number = proc_macro2::Span::call_site().start().line;\n  170 |                 field.ident = Some(syn::Ident::new(\n  171 |                     &format!(\"_reserved{}\", line_number),\n  172 |                     proc_macro2::Span::call_site(),\n  173 |                 ));\n  174 | \n  175 |                 // Add attributes to the reserved field.\n  176 |                 field.attrs.push(syn::parse_quote! {\n  177 |                     #[br(temp)]\n  178 |                 });\n  179 | \n  180 |                 // If type is [u8; N], we can set it to zeroed array. Otherwise, use Default::default().\n  181 |                 let default_bw_calc = if let syn::Type::Array(arr) = &field.ty {\n  182 |                     let len = arr.len.clone();\n  183 |                     syn::parse_quote! {\n  184 |                         #[bw(calc = [0; #len])]\n  185 |                     }\n  186 |                 } else {\n  187 |                     syn::parse_quote! {\n  188 |                         #[bw(calc = Default::default())]\n  189 |                     }\n  190 |                 };\n  191 | \n  192 |                 field.attrs.push(default_bw_calc);\n  193 |             }","lines":38,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg-derive/src/lib.rs#L156-L193"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`TreeMessageHandler::sendo` in `crates/smb/src/tree.rs:318-332` loads `self.tree_id` and, unless the message is an async command, unconditionally embeds it into the outgoing message header - there is no check that the loaded value is not `Self::INVALID_TREE_ID` (`u32::MAX`, the sentinel set by `disconnect()` at `crates/smb/src/tree.rs:298-307`). If another task concurrently calls `disconnect()` between a caller obtaining the handler and `sendo` running, the request is sent with tree ID `0xFFFFFFFF`, which will simply be rejected by the server rather than caught locally with a clear \"tree already disconnected\" error.","fix":"Check for the sentinel value before sending, similar to how `info()` already does at `crates/smb/src/tree.rs:309-315`:\n```rust\nasync fn sendo(&self, mut msg: OutgoingMessage) -> crate::Result<SendMessageResult> {\n    if !msg.message.header.flags.async_command() {\n        let tree_id = self.tree_id.load(Ordering::SeqCst);\n        if tree_id == Self::INVALID_TREE_ID {\n            return Err(Error::InvalidState(\"Tree is closed\".to_string()));\n        }\n        msg.message.header.tree_id = Some(tree_id);\n        ...\n    }\n    self.upstream.sendo(msg).await\n}\n```","locations":[{"ref":"crates/smb/src/tree.rs:318-332","code":"  318 | impl MessageHandler for TreeMessageHandler {\n  319 |     #[maybe_async]\n  320 |     async fn sendo(\n  321 |         &self,\n  322 |         mut msg: crate::msg_handler::OutgoingMessage,\n  323 |     ) -> crate::Result<crate::msg_handler::SendMessageResult> {\n  324 |         if !msg.message.header.flags.async_command() {\n  325 |             msg.message.header.tree_id = self.tree_id.load(Ordering::SeqCst).into();\n  326 |             if self.info.share_flags.encrypt_data() {\n  327 |                 msg.encrypt = true;\n  328 |             }\n  329 |         }\n  330 | \n  331 |         self.upstream.sendo(msg).await\n  332 |     }","lines":15,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/tree.rs#L318-L332"},{"ref":"crates/smb/src/tree.rs:298-307","code":"  298 |     #[maybe_async]\n  299 |     async fn disconnect(&self) -> crate::Result<()> {\n  300 |         let tree_id = self.tree_id.swap(Self::INVALID_TREE_ID, Ordering::SeqCst);\n  301 |         if tree_id == Self::INVALID_TREE_ID {\n  302 |             // Already disconnected\n  303 |             return Ok(());\n  304 |         }\n  305 |         let encrypt = self.info.share_flags.encrypt_data();\n  306 |         Self::_disconnect(self.upstream.clone(), tree_id, encrypt).await\n  307 |     }","lines":10,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/tree.rs#L298-L307"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"`RdmaTransport::_send_fragmented_data` validates the outgoing message's size against `max_fragmented_recv_size` using the wrong quantity - `message.len()` instead of `message.total_size()`:\n\n```rust\nasync fn _send_fragmented_data(&mut self, message: &IoVec) -> std::result::Result<(), RdmaError> {\n    ...\n    if message.len() > running.max_fragmented_recv_size as usize {\n        return Err(RdmaError::RequestTooLarge(message.len(), running.max_fragmented_recv_size as usize));\n    }\n    ...\n    let total_data_to_send = message.total_size() as u32;\n```\n\n`IoVec` derefs to `[IoVecBuf]`, so `message.len()` returns the *number of buffer segments* (typically a handful), not the payload byte count. `message.total_size()` (used just a few lines later for the actual send loop) is the correct byte-count accessor. Because the check compares a small segment count against a byte-size limit, it will essentially never trigger, so oversized SMB messages silently bypass the fragmentation size guard entirely.","fix":"Use `message.total_size()` for both the check and the log line:\n\n```rust\nif message.total_size() > running.max_fragmented_recv_size as usize {\n    return Err(RdmaError::RequestTooLarge(message.total_size(), running.max_fragmented_recv_size as usize));\n}\n```","locations":[{"ref":"crates/smb-transport/src/rdma/transport.rs:422-437","code":"  422 |     async fn _send_fragmented_data(\n  423 |         &mut self,\n  424 |         message: &IoVec,\n  425 |     ) -> std::result::Result<(), RdmaError> {\n  426 |         log::trace!(\n  427 |             \"RDMA _send_fragmented_data called with message length: {}\",\n  428 |             message.len()\n  429 |         );\n  430 |         let running = self._get_write()?;\n  431 | \n  432 |         if message.len() > running.max_fragmented_recv_size as usize {\n  433 |             return Err(RdmaError::RequestTooLarge(\n  434 |                 message.len(),\n  435 |                 running.max_fragmented_recv_size as usize,\n  436 |             ));\n  437 |         }","lines":16,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-transport/src/rdma/transport.rs#L422-L437"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"When loading `QuicCertValidationOptions::CustomRootCerts`, both the \"file not found\" and \"any other I/O error\" cases are only logged and otherwise silently ignored:\n\n```rust\nmatch std::fs::read(cert) {\n    Ok(cert) => { roots.add(CertificateDer::from(cert))?; }\n    Err(ref e) if e.kind() == std::io::ErrorKind::NotFound => {\n        log::info!(\"local server certificate not found\");\n    }\n    Err(e) => {\n        log::error!(\"failed to open local server certificate: {e}\");\n    }\n}\n```\n\nIf every configured certificate path fails to read (typo'd path, permissions error, etc.), `roots` silently ends up empty and the `QuicTransport` is built with an effectively-unusable (and misleadingly-named) `CustomRootCerts` configuration, with no error surfaced to the caller - only a log line. The caller has no reliable way to detect that its explicit certificate configuration was ignored.","fix":"Propagate a hard error (or at minimum return an error if the resulting `roots` store ends up empty) instead of only logging, e.g.:\n\n```rust\nlet mut any_ok = false;\nfor cert in items {\n    match std::fs::read(cert) {\n        Ok(cert) => { roots.add(CertificateDer::from(cert))?; any_ok = true; }\n        Err(e) => log::error!(\"failed to open local server certificate {cert}: {e}\"),\n    }\n}\nif !any_ok {\n    return Err(QuicError::NoCipherSuitesFound(..)); // or a dedicated `NoCertificatesLoaded` variant\n}\n```","locations":[{"ref":"crates/smb-transport/src/quic/transport.rs:76-89","code":"   76 |                 let mut roots = rustls::RootCertStore::empty();\n   77 |                 for cert in items {\n   78 |                     match std::fs::read(cert) {\n   79 |                         Ok(cert) => {\n   80 |                             roots.add(CertificateDer::from(cert))?;\n   81 |                         }\n   82 |                         Err(ref e) if e.kind() == std::io::ErrorKind::NotFound => {\n   83 |                             log::info!(\"local server certificate not found\");\n   84 |                         }\n   85 |                         Err(e) => {\n   86 |                             log::error!(\"failed to open local server certificate: {e}\");\n   87 |                         }\n   88 |                     }\n   89 |                 }","lines":14,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-transport/src/quic/transport.rs#L76-L89"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`PipeRpcConnection::rpc_rw` in `crates/smb/src/resource/pipe.rs:196-208` always issues the RPC bind read with a hard-coded `length: 1024`. If a server's `BindAck` PDU (e.g. with several context elements/results, or a long `port_spec` / secondary address string) exceeds 1024 bytes, the response is truncated by the server-side `Read` handling (or the read simply returns less data than the full PDU), and `DceRpcCoResponsePkt::try_from(content.buffer.as_ref())` will fail to parse the (truncated) response, causing the RPC bind - and therefore any named-pipe RPC operation (e.g. SAMR/SVCCTL/etc. through `smb-rpc`) - to fail even though the server behaved correctly.","fix":"Use a larger, spec-appropriate max read length for the bind exchange (DCE/RPC frag sizes are commonly up to `DEFAULT_FRAG_LIMIT` = 4280 bytes as already negotiated via `max_recv_frag` in the same function), e.g. `length: DEFAULT_FRAG_LIMIT as u32` instead of the fixed `1024`, or loop/retry on `STATUS_BUFFER_OVERFLOW` to read the remaining fragment.","locations":[{"ref":"crates/smb/src/resource/pipe.rs:196-208","code":"  196 |         let read_result = pipe\n  197 |             .send_recvo(\n  198 |                 ReadRequest {\n  199 |                     flags: Default::default(),\n  200 |                     length: 1024,\n  201 |                     offset: READ_WRITE_PIPE_OFFSET,\n  202 |                     file_id,\n  203 |                     minimum_count: DceRpcCoRequestPkt::COMMON_SIZE_BYTES as u32,\n  204 |                 }\n  205 |                 .into(),\n  206 |                 ReceiveOptions::new().with_allow_async(true),\n  207 |             )\n  208 |             .await?;","lines":13,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/pipe.rs#L196-L208"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`DfsRootTreeRef::dfs_get_referrals` in `crates/smb/src/tree/dfs_tree.rs:28-53` hard-codes `max_input_response: 1024` and `max_output_response: 1024` for the `FSCTL_DFS_GET_REFERRALS` request. A DFS referral response listing several targets (common in DFS namespaces with multiple failover targets, or long UNC target paths) can easily exceed 1024 bytes, in which case the server either truncates the response or signals `STATUS_BUFFER_OVERFLOW`; either way `parse_fsctl::<RespGetDfsReferral>()` can fail to parse a legitimately large referral set, breaking DFS resolution for real-world namespaces.","fix":"Raise the response buffer size to something more generous (e.g. 64KiB, matching the pattern used elsewhere in the crate such as `IpcTreeRef::query_network_interfaces`'s `2u32.pow(16)`), or handle `STATUS_BUFFER_OVERFLOW` by retrying with a larger `max_output_response`.","locations":[{"ref":"crates/smb/src/tree/dfs_tree.rs:28-53","code":"   28 |     pub async fn dfs_get_referrals(&self, path: &str) -> crate::Result<RespGetDfsReferral> {\n   29 |         let res = self\n   30 |             .handler\n   31 |             .send_recvo(\n   32 |                 IoctlRequest {\n   33 |                     ctl_code: FsctlCodes::DfsGetReferrals as u32,\n   34 |                     file_id: FileId::FULL,\n   35 |                     max_input_response: 1024,\n   36 |                     max_output_response: 1024,\n   37 |                     flags: IoctlRequestFlags::new().with_is_fsctl(true),\n   38 |                     buffer: IoctlReqData::FsctlDfsGetReferrals(ReqGetDfsReferral {\n   39 |                         max_referral_level: ReferralLevel::V4,\n   40 |                         request_file_name: path.into(),\n   41 |                     }),\n   42 |                 }\n   43 |                 .into(),\n   44 |                 ReceiveOptions::new().with_allow_async(true),\n   45 |             )\n   46 |             .await?;\n   47 |         let res = res\n   48 |             .message\n   49 |             .content\n   50 |             .to_ioctl()?\n   51 |             .parse_fsctl::<RespGetDfsReferral>()?;\n   52 |         Ok(res)\n   53 |     }","lines":26,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/tree/dfs_tree.rs#L28-L53"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`SetInfoData::to_req` in `crates/smb-msg/src/info/set.rs` panics (`panic!(\"Invalid info class and data combination\")`) if the caller passes a `SetInfoClass`/`SetInfoData` combination that doesn't match (e.g. `File` class with `FileSystem` data). This is documented via a `# Panics` doc comment, but returning a `Result`/`SmbMsgError::UnexpectedContent` (which the crate already defines and uses elsewhere for exactly this kind of mismatch) would be more consistent with the rest of the crate's error-handling style and safer for callers that build the class/data pair from separate, possibly-untrusted-derived code paths.","fix":"```rust\npub fn to_req(\n    self,\n    info_class: SetInfoClass,\n    file_id: FileId,\n    additional_info: AdditionalInfo,\n) -> crate::Result<SetInfoRequest> {\n    match (&info_class, &self) {\n        (SetInfoClass::File(_), SetInfoData::File(_))\n        | (SetInfoClass::FileSystem(_), SetInfoData::FileSystem(_))\n        | (SetInfoClass::Security(_), SetInfoData::Security(_))\n        | (SetInfoClass::Quota(_), SetInfoData::Quota(_)) => Ok(SetInfoRequest {\n            info_class,\n            additional_information: additional_info,\n            file_id,\n            data: self,\n        }),\n        _ => Err(crate::SmbMsgError::UnexpectedContent {\n            expected: \"matching SetInfoClass/SetInfoData\",\n            actual: self.name(),\n        }),\n    }\n}\n```","locations":[{"ref":"crates/smb-msg/src/info/set.rs:96-110","code":"   96 |     pub fn to_req(\n   97 |         self,\n   98 |         info_class: SetInfoClass,\n   99 |         file_id: FileId,\n  100 |         additional_info: AdditionalInfo,\n  101 |     ) -> SetInfoRequest {\n  102 |         // Validate the info class and data combination\n  103 |         // to ensure they are compatible.\n  104 |         match (&info_class, &self) {\n  105 |             (SetInfoClass::File(_), SetInfoData::File(_)) => {}\n  106 |             (SetInfoClass::FileSystem(_), SetInfoData::FileSystem(_)) => {}\n  107 |             (SetInfoClass::Security(_), SetInfoData::Security(_)) => {}\n  108 |             (SetInfoClass::Quota(_), SetInfoData::Quota(_)) => {}\n  109 |             _ => panic!(\"Invalid info class and data combination\"),\n  110 |         }","lines":15,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/info/set.rs#L96-L110"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`kbkdf_hmacsha256` declares a fallible signature (`Result<DerivedKey, CryptoError>`) but its only failure mode is converted into a `.expect(\"Caller must derive with correct parameters!\")` panic rather than an `Err`, so `CryptoError` is never actually returned from this function - the `Result` wrapper is misleading, and any caller mistake in constructing `label`/`context` lengths crashes the process instead of surfacing a `CryptoError` through the existing `Result` machinery that the function signature advertises.","fix":"Propagate the error instead of expecting it away, e.g.:\n```rust\nlet result = counter\n    .derive(Params::builder(key).with_label(label).with_context(context).build())\n    .map_err(|_| CryptoError::InvalidLength(...))?;\n```\n(or adjust `CryptoError` to add a dedicated variant for KBKDF derivation failures), so the documented `Result` return type is honored.","locations":[{"ref":"crates/smb/src/crypto/kbkdf.rs:13-32","code":"   13 | pub fn kbkdf_hmacsha256(\n   14 |     key: &KeyToDerive,\n   15 |     label: &[u8],\n   16 |     context: &[u8],\n   17 | ) -> Result<DerivedKey, CryptoError> {\n   18 |     let counter = Counter::<HmacSha256, Aes128>::default();\n   19 | \n   20 |     let result = counter\n   21 |         .derive(\n   22 |             Params::builder(key)\n   23 |                 .with_label(label)\n   24 |                 .with_context(context)\n   25 |                 .build(),\n   26 |         )\n   27 |         // Derivation may only fail with invalid data lengths,\n   28 |         // which is expected to be correct here.\n   29 |         .expect(\"Caller must derive with correct parameters!\");\n   30 | \n   31 |     Ok(result.into())\n   32 | }","lines":20,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/crypto/kbkdf.rs#L13-L32"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"`BaseSizedString::read_options` (`crates/smb-dtyp/src/binrw_util/sized_string.rs:90-116`) does `Vec::with_capacity(size_chars as usize)` where `size_chars` is derived directly from the caller-supplied `SizedStringSize`, which in turn is populated straight from wire-parsed length fields (all `u32`) with no comparison against the amount of data actually remaining in the reader. This utility backs `SizedWideString` / `SizedAnsiString`, used pervasively throughout `smb-fscc` for attacker-controlled length-prefixed strings: e.g. `FileNameInformation::file_name` (`crates/smb-fscc/src/common_info.rs:150-154`), the `file_name` field shared by every `query_dir_type!`-generated directory-listing struct (`crates/smb-fscc/src/directory_info.rs:94-96`), `FileFsAttributeInformation::file_system_name` and `FileFsVolumeInformation::volume_label` (`crates/smb-fscc/src/filesystem_info.rs`), and `FileStreamInformationInner::stream_name` (`crates/smb-fscc/src/query_file_info.rs`). A malicious server can set any of these 4-byte length fields to a huge value (e.g. `0xFFFFFFFE`) inside an otherwise tiny response; the client will attempt to pre-allocate up to ~4 GiB (`u32::MAX/2` `u16` elements) *before* any read failure can occur. Allocation failure under `Vec::with_capacity` triggers Rust's global `handle_alloc_error`, which aborts the process (not a catchable panic) - i.e. a single malicious packet can cause an unrecoverable crash/OOM of the client, worse than a normal parse error.","fix":"Bound the allocation by the amount of data actually available in the reader before pre-allocating, e.g. seek to end / compare remaining length to `size_to_use` and return a parse error if the declared size exceeds what's actually present, or grow the `Vec` incrementally (`Vec::new()` + `reserve` in small chunks, or read into a byte buffer with `take_seek` first and validate its length) rather than trusting the untrusted length field for a single large `with_capacity` call.","locations":[{"ref":"crates/smb-dtyp/src/binrw_util/sized_string.rs:90-116","code":"   90 |     fn read_options<R: Read + Seek>(\n   91 |         reader: &mut R,\n   92 |         endian: Endian,\n   93 |         args: Self::Args<'_>,\n   94 |     ) -> BinResult<Self> {\n   95 |         let size_to_use = args.size.get_size_bytes::<T>()?;\n   96 |         if size_to_use == 0 {\n   97 |             return Err(binrw::Error::Custom {\n   98 |                 pos: reader.stream_position()?,\n   99 |                 err: Box::new(format!(\n  100 |                     \"BaseSizedString<{}> had invalid read arguments {:?} - all None or zero\",\n  101 |                     std::any::type_name::<T>(),\n  102 |                     args\n  103 |                 )),\n  104 |             });\n  105 |         }\n  106 | \n  107 |         let size_chars = size_to_use / Self::CHAR_WIDTH;\n  108 | \n  109 |         let mut values = Vec::with_capacity(size_chars as usize);\n  110 | \n  111 |         for _ in 0..size_chars {\n  112 |             let val = <T>::read_options(reader, endian, Default::default())?;\n  113 |             values.push(val);\n  114 |         }\n  115 |         Ok(Self { data: values })\n  116 |     }","lines":27,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-dtyp/src/binrw_util/sized_string.rs#L90-L116"},{"ref":"crates/smb-fscc/src/common_info.rs:150-154","code":"  150 |     #[bw(try_calc = file_name.size().try_into())]\n  151 |     file_name_length: u32,\n  152 |     /// The full path name of the file.\n  153 |     #[br(args { size: SizedStringSize::bytes(file_name_length)})]\n  154 |     pub file_name: SizedWideString,","lines":5,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-fscc/src/common_info.rs#L150-L154"},{"ref":"crates/smb-fscc/src/directory_info.rs:94-96","code":"   94 |                 /// The name of the file.\n   95 |                  #[br(args { size: SizedStringSize::bytes(_file_name_length)})]\n   96 |                 pub file_name: SizedWideString,","lines":3,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-fscc/src/directory_info.rs#L94-L96"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"Several response structures read a `Vec<u8>` with `#[br(count = N)]` where `N` is an attacker-controlled `u32` length field that is *not* bounded against the actual amount of data remaining in the message (no `take_seek`-style clamp, no upper-bound assert). `binrw`'s generated code for `Vec<u8>` with a `count` argument calls `bytes.reserve_exact(n)` (see `binrw-0.15.1/src/helpers.rs`, `count()` helper) *before* attempting to read any bytes, so a tiny, well-formed-looking packet (a normal SMB2 header plus a few dozen bytes of body) can force an immediate ~4 GiB (`u32::MAX`) memory reservation attempt. This is a cheap, single-packet amplification/DoS vector against any client (or the affected server-side struct) that parses these responses:\n- `crates/smb-msg/src/file.rs` `ReadResponse::buffer` - only asserted `> 0`, no upper bound.\n- `crates/smb-msg/src/ioctl/msg.rs` `IoctlResponse::out_buffer` - `output_count` is fully attacker-controlled.\n- `crates/smb-msg/src/ioctl/fsctl.rs` `SrvHashRetrieveHashBased::blob` and `SrvHashRetrieveFileBased::buffer` - `buffer_length` unbounded.\n- `crates/smb-msg/src/ioctl/fsctl.rs` `PipePeekResponse::data` - `read_data_available` (u32) cast to `u64` count, unbounded.\n- `crates/smb-msg/src/error.rs` `ErrorResponseContext::error_data` - `_error_data_length` (u32) unbounded; note the surrounding `ErrorResponse::error_data` list is bounded by `_byte_count` via `take_seek`, but that only limits how many bytes can be *read*, not the eager `reserve_exact` for an individual, inner, lying length field.","fix":"Validate length fields against a sane maximum before using them as a `Vec<u8>` `count` (e.g. against the negotiated `max_transact_size`/`max_read_size`, or the number of bytes actually remaining in the bounded sub-stream), or avoid the eager pre-allocation entirely by reading via a bounded stream and `binrw::helpers::until_eof` instead of `count = N`, e.g.:\n```rust\n#[br(map_stream = |s| s.take_seek(_data_length.value as u64), parse_with = binrw::helpers::until_eof)]\npub buffer: Vec<u8>,\n```\nThis makes the amount actually allocated track the amount actually available, so a lying length field can at most cause a short read/error rather than a multi-gigabyte allocation attempt.","locations":[{"ref":"crates/smb-msg/src/file.rs:88-111","code":"   88 | pub struct ReadResponse {\n   89 |     #[br(assert(_data_offset.value as usize >= Header::STRUCT_SIZE + Self::STRUCT_SIZE - 1))]\n   90 |     #[bw(calc = PosMarker::default())]\n   91 |     #[br(temp)]\n   92 |     _data_offset: PosMarker<u8>,\n   93 |     reserved: u8,\n   94 |     #[bw(try_calc = buffer.len().try_into())]\n   95 |     #[br(assert(_data_length > 0))]\n   96 |     #[br(temp)]\n   97 |     _data_length: u32,\n   98 |     #[bw(calc = 0)]\n   99 |     #[br(assert(_data_remaining == 0))]\n  100 |     #[br(temp)]\n  101 |     _data_remaining: u32,\n  102 | \n  103 |     reserved: u32,\n  104 | \n  105 |     /// Data read from the file.\n  106 |     #[br(seek_before = SeekFrom::Start(_data_offset.value as u64))]\n  107 |     #[br(count = _data_length)]\n  108 |     #[bw(assert(!buffer.is_empty()))]\n  109 |     #[bw(write_with = PosMarker::write_aoff, args(&_data_offset))]\n  110 |     pub buffer: Vec<u8>,\n  111 | }","lines":24,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/file.rs#L88-L111"},{"ref":"crates/smb-msg/src/ioctl/msg.rs:206-225","code":"  206 |     #[bw(try_calc = out_buffer.len().try_into())]\n  207 |     #[br(temp)]\n  208 |     output_count: u32,\n  209 | \n  210 |     /// Flags\n  211 |     reserved: u32,\n  212 | \n  213 |     reserved: u32,\n  214 | \n  215 |     /// Input data buffer (typically empty for responses except pass-through operations)\n  216 |     #[br(seek_before = SeekFrom::Start(input_offset.value.into()))]\n  217 |     #[br(count = input_count)]\n  218 |     #[bw(write_with = PosMarker::write_aoff, args(&input_offset))]\n  219 |     pub in_buffer: Vec<u8>,\n  220 | \n  221 |     /// Output data buffer containing results of the FSCTL/IOCTL operation\n  222 |     #[br(seek_before = SeekFrom::Start(output_offset.value.into()))]\n  223 |     #[br(count = output_count)]\n  224 |     #[bw(write_with = PosMarker::write_aoff, args(&output_offset))]\n  225 |     pub out_buffer: Vec<u8>,","lines":20,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/ioctl/msg.rs#L206-L225"},{"ref":"crates/smb-msg/src/ioctl/fsctl.rs:329-342","code":"  329 | #[smb_response_binrw]\n  330 | pub struct SrvHashRetrieveHashBased {\n  331 |     /// The offset, in bytes, from the beginning of the Content Information File\n  332 |     /// to the portion retrieved. This equals the offset field in the SRV_READ_HASH request.\n  333 |     pub offset: u64,\n  334 |     /// The length, in bytes, of the retrieved portion of the Content Information File.\n  335 |     #[bw(try_calc = blob.len().try_into())]\n  336 |     buffer_length: u32,\n  337 |     reserved: u32,\n  338 |     /// A variable-length buffer that contains the retrieved portion of the Content Information File.\n  339 |     /// TODO: Parse as Content Information File as specified in MS-PCCRC section 2.3.\n  340 |     #[br(count = buffer_length)]\n  341 |     blob: Vec<u8>,\n  342 | }","lines":14,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/ioctl/fsctl.rs#L329-L342"},{"ref":"crates/smb-msg/src/ioctl/fsctl.rs:351-366","code":"  351 | #[smb_response_binrw]\n  352 | pub struct SrvHashRetrieveFileBased {\n  353 |     /// File data offset corresponding to the start of the hash data returned.\n  354 |     pub file_data_offset: u64,\n  355 |     /// The length, in bytes, starting from the file_data_offset that is covered\n  356 |     /// by the hash data returned.\n  357 |     pub file_data_length: u64,\n  358 |     /// The length, in bytes, of the retrieved portion of the Content Information File.\n  359 |     #[bw(try_calc = buffer.len().try_into())]\n  360 |     buffer_length: u32,\n  361 |     reserved: u32,\n  362 |     /// A variable-length buffer that contains the retrieved portion of the Content Information File.\n  363 |     /// TODO: Parse as Content Information File as specified in MS-PCCRC section 2.4.\n  364 |     #[br(count = buffer_length)]\n  365 |     pub buffer: Vec<u8>,\n  366 | }","lines":16,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/ioctl/fsctl.rs#L351-L366"},{"ref":"crates/smb-msg/src/ioctl/fsctl.rs:618-632","code":"  618 | #[smb_response_binrw]\n  619 | pub struct PipePeekResponse {\n  620 |     /// The current state of the pipe\n  621 |     pub named_pipe_state: NamedPipeState,\n  622 |     #[bw(calc = data.len() as u32)]\n  623 |     /// The size, in bytes, of the data available to read from the pipe.\n  624 |     read_data_available: u32,\n  625 |     /// Specifies the number of messages available in the pipe if the pipe has been created as a message-type pipe. Otherwise, this field is 0\n  626 |     pub number_of_messages: u32,\n  627 |     /// Specifies the length of the first message available in the pipe if the pipe has been created as a message-type pipe. Otherwise, this field is 0.\n  628 |     pub message_length: u32,\n  629 |     /// The data from the pipe.\n  630 |     #[br(count = read_data_available as u64)]\n  631 |     pub data: Vec<u8>,\n  632 | }","lines":15,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/ioctl/fsctl.rs#L618-L632"},{"ref":"crates/smb-msg/src/error.rs:41-55","code":"   41 | #[smb_response_binrw]\n   42 | pub struct ErrorResponseContext {\n   43 |     // each context item should be aligned to 8 bytes,\n   44 |     // relative to the start of the error context.\n   45 |     // luckily, it appears after the header, which is, itself, aligned to 8 bytes.\n   46 |     #[brw(align_before = 8)]\n   47 |     /// The length, in bytes, of the ErrorContextData field\n   48 |     #[bw(try_calc = error_data.len().try_into())]\n   49 |     _error_data_length: u32,\n   50 |     /// An identifier for the error context\n   51 |     pub error_id: ErrorId,\n   52 |     /// Variable-length error data formatted according to the ErrorId\n   53 |     #[br(count = _error_data_length)]\n   54 |     pub error_data: Vec<u8>,\n   55 | }","lines":15,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/error.rs#L41-L55"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"`SetReparsePointRequest::reparse_data` in `crates/smb-msg/src/ioctl/fsctl.rs` has the same unbounded-`reserve_exact` issue as the client-facing findings above, but on the **server** parsing path (`feature = \"server\"`): `reparse_data_length` is a raw attacker-controlled `u32` read directly from a client's `FSCTL_SET_REPARSE_POINT` IOCTL request, used as `#[br(count = reparse_data_length)]` for `reparse_data: Vec<u8>` with no upper-bound check. A malicious client can send a small IOCTL request that claims a ~4 GiB reparse data buffer, forcing the server to attempt a huge allocation per request.","fix":"Bound `reparse_data_length` (e.g. reject values larger than the IOCTL's own declared input buffer size, or a fixed sane maximum such as 64 KiB) before using it as the vector count, or switch to a bounded-stream + `until_eof` read as suggested for the client-side findings.","locations":[{"ref":"crates/smb-msg/src/ioctl/fsctl.rs:562-577","code":"  562 | #[smb_request_binrw]\n  563 | pub struct SetReparsePointRequest {\n  564 |     /// Contains the reparse point tag that uniquely identifies the owner of the reparse point.\n  565 |     #[bw(assert((reparse_tag & 0x80000000 == 0) == reparse_guid.is_some()))]\n  566 |     pub reparse_tag: u32,\n  567 |     #[bw(calc = reparse_data.len() as u32)]\n  568 |     reparse_data_length: u32,\n  569 |     /// Applicable only for reparse points that have a GUID.\n  570 |     /// See [MS-FSCC 2.1.2.3](https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-fscc/a4d08374-0e92-43e2-8f88-88b94112f070)\n  571 |     // Internal note: (HighBit(arseTag) == 0)Has\n  572 |     #[br(if(reparse_tag & 0x80000000 == 0))]\n  573 |     pub reparse_guid: Option<Guid>,\n  574 |     /// Reparse-specific data for the reparse point\n  575 |     #[br(count = reparse_data_length)]\n  576 |     pub reparse_data: Vec<u8>,\n  577 | }","lines":16,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/ioctl/fsctl.rs#L562-L577"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"The `ReadAtChannel`/`WriteAtChannel` implementations for `Mutex<File>` in `crates/smb/src/resource/file_util.rs:151-188` take the mutex, `seek()` to the requested offset, then perform the `read`/`write`. Because `block_copy_task` spawns many parallel workers (up to 128 per channel, `AUTO_JOBS = 16` by default) that all share the same `Arc<Mutex<File>>` for a local file, every local-side read or write in a \"parallel\" copy is fully serialized on this single mutex (seek+read / seek+write is not atomic without the lock, hence the mutex is required with this approach). This largely defeats the purpose of the multi-worker parallel copy for the local endpoint of a remote<->local copy, since only one worker at a time can touch the local file regardless of how many jobs are configured.","fix":"Use platform positional I/O that doesn't require holding a lock across `seek`+`read`/`write`, e.g. `std::os::unix::fs::FileExt::read_at`/`write_at` on Unix and `std::os::windows::fs::FileExt::seek_read`/`seek_write` on Windows (or `tokio::fs::File`'s equivalent via `spawn_blocking` + these traits), so concurrent workers can perform true positional I/O on the same file handle without contending on a single mutex.","locations":[{"ref":"crates/smb/src/resource/file_util.rs:151-188","code":"  151 |     impl<F: ReadSeek + Send> ReadAtChannel for Mutex<F> {\n  152 |         #[maybe_async]\n  153 |         async fn read_at_channel(\n  154 |             &self,\n  155 |             buf: &mut [u8],\n  156 |             offset: u64,\n  157 |             _channel: Option<u32>,\n  158 |         ) -> crate::Result<usize> {\n  159 |             let mut reader = self\n  160 |                 .lock()\n  161 |                 .await\n  162 |                 .map_err(|e| std::io::Error::other(e.to_string()))?;\n  163 |             reader.seek(std::io::SeekFrom::Start(offset)).await?;\n  164 |             Ok(reader.read(buf).await?)\n  165 |         }\n  166 |     }\n  167 | \n  168 |     #[cfg(feature = \"async\")]\n  169 |     pub trait WriteSeek: AsyncWrite + AsyncSeek + Unpin {}\n  170 |     #[cfg(not(feature = \"async\"))]\n  171 |     pub trait WriteSeek: Write + Seek {}\n  172 |     impl WriteSeek for File {}\n  173 |     impl<F: WriteSeek + Send> WriteAtChannel for Mutex<F> {\n  174 |         #[maybe_async]\n  175 |         async fn write_at_channel(\n  176 |             &self,\n  177 |             buf: &[u8],\n  178 |             offset: u64,\n  179 |             _channel: Option<u32>,\n  180 |         ) -> crate::Result<usize> {\n  181 |             let mut writer = self\n  182 |                 .lock()\n  183 |                 .await\n  184 |                 .map_err(|e| std::io::Error::other(e.to_string()))?;\n  185 |             writer.seek(std::io::SeekFrom::Start(offset)).await?;\n  186 |             Ok(writer.write(buf).await?)\n  187 |         }\n  188 |     }","lines":38,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/file_util.rs#L151-L188"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`start_parallel_copy` (async variant) in `crates/smb/src/resource/file_util.rs:415-445` calls `to.set_len(from.get_len().await?).await?;` at line 426, duplicating work that `prepare_parallel_copy` already performed (`crates/smb/src/resource/file_util.rs:389-390`: `from.get_len().await?` then `to.set_len(file_length).await?`). Every public entry point (`block_copy`, `block_copy_channel`, and `smb-cli`'s `CopyFile::do_copy`) calls `prepare_parallel_copy` and then `start_parallel_copy`, so every copy operation issues the length query and the `set_len`/SetEndOfFile round trip twice against the (possibly remote/SMB) source and destination. This is wasted network I/O on every invocation, and the second call also risks (in principle) reading a different length than the one `CopyState` was computed from if the source changes size concurrently, making `state.total_size` and the actual truncation length inconsistent.","fix":"Remove the redundant call in `start_parallel_copy` since the length was already established by `prepare_parallel_copy` and is available via `state.total_size()`:\n```rust\npub async fn start_parallel_copy<...>(from: F, to: T, state: Arc<CopyState>) -> crate::Result<()> {\n    use tokio::task::JoinSet;\n    // removed: to.set_len(from.get_len().await?).await?;\n    let to = Arc::new(to);\n    ...\n}\n```","locations":[{"ref":"crates/smb/src/resource/file_util.rs:415-445","code":"  415 |     #[cfg(feature = \"async\")]\n  416 |     pub async fn start_parallel_copy<\n  417 |         F: ReadAtChannel + GetLen + Send + Sync + 'static,\n  418 |         T: WriteAtChannel + SetLen + Send + Sync + 'static,\n  419 |     >(\n  420 |         from: F,\n  421 |         to: T,\n  422 |         state: Arc<CopyState>,\n  423 |     ) -> crate::Result<()> {\n  424 |         use tokio::task::JoinSet;\n  425 | \n  426 |         to.set_len(from.get_len().await?).await?;\n  427 | \n  428 |         let to = Arc::new(to);\n  429 |         let from = Arc::new(from);\n  430 | \n  431 |         let mut handles = JoinSet::new();\n  432 |         for (&channel_id, &jobs) in state.channel_jobs.iter() {\n  433 |             for task_id in 0..jobs {\n  434 |                 let from = from.clone();\n  435 |                 let to = to.clone();\n  436 |                 let state = state.clone();\n  437 |                 handles.spawn(async move {\n  438 |                     block_copy_task(from, to, state, task_id, channel_id).await\n  439 |                 });\n  440 |             }\n  441 |         }\n  442 | \n  443 |         handles.join_all().await;\n  444 |         Ok(())\n  445 |     }","lines":31,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/file_util.rs#L415-L445"},{"ref":"crates/smb/src/resource/file_util.rs:387-410","code":"  387 |         const CHUNK_SIZE: u64 = 2u64.pow(16);\n  388 | \n  389 |         let file_length = from.get_len().await?;\n  390 |         to.set_len(file_length).await?;\n  391 | \n  392 |         if file_length == 0 {\n  393 |             log::debug!(\"Source file is empty, nothing to copy.\");\n  394 |             return Ok(CopyState {\n  395 |                 current_block: AtomicU64::new(0),\n  396 |                 last_block: 0,\n  397 |                 total_size: 0,\n  398 |                 max_chunk_size: CHUNK_SIZE,\n  399 |                 channel_jobs,\n  400 |             });\n  401 |         }\n  402 | \n  403 |         Ok(CopyState {\n  404 |             current_block: AtomicU64::new(0),\n  405 |             last_block: file_length / CHUNK_SIZE,\n  406 |             total_size: file_length,\n  407 |             max_chunk_size: CHUNK_SIZE,\n  408 |             channel_jobs,\n  409 |         })\n  410 |     }","lines":24,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/file_util.rs#L387-L410"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`iter_sync::QueryDirectoryIterator::next` pops from the front of the `backlog: Vec<T>` using `self.backlog.remove(0)`, which is O(n) per call (it shifts all remaining elements down by one). For a directory batch of `N` entries this makes iterating a single batch O(N^2) instead of O(N), which can be noticeably slow for large directories with many entries returned per `QueryDirectoryRequest` batch.","fix":"Use a `VecDeque<T>` for `backlog` and call `pop_front()`, or reverse the batch once and `pop()` from the end, both O(1) per item:\n```rust\nbacklog: std::collections::VecDeque<T>,\n...\nif let Some(item) = self.backlog.pop_front() {\n    return Some(Ok(item));\n}\n```","locations":[{"ref":"crates/smb/src/resource/directory.rs:809-813","code":"  809 |         fn next(&mut self) -> Option<Self::Item> {\n  810 |             // Pop from backlog if we have any results left.\n  811 |             if !self.backlog.is_empty() {\n  812 |                 return Some(Ok(self.backlog.remove(0)));\n  813 |             }","lines":5,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/directory.rs#L809-L813"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`FileNotifyInformation` (`crates/smb-fscc/src/notify.rs:12-21`) and `FileGetEaInformation` (`crates/smb-fscc/src/query_file_info.rs:399-409`) both declare `#[bw(import(has_next: bool))]` on the struct, but neither struct's fields ever reference `has_next` in any `#[bw(...)]`/`#[br(...)]` attribute. The parameter is accepted into the generated `BinWrite::Args` signature but is otherwise unused, suggesting leftover/vestigial plumbing (perhaps originally intended to control chained-list padding, which is actually handled independently by `ChainedItemList`'s own `BinWrite` impl in `chained_list.rs`).","fix":"Either remove the unused `#[bw(import(has_next: bool))]` from both structs, or wire it up to whatever it was originally meant to control, and add a short comment explaining why the write-side needs to know about the next chained entry (if that turns out to still be required).","locations":[{"ref":"crates/smb-fscc/src/notify.rs:12-21","code":"   12 | #[binrw::binrw]\n   13 | #[derive(Debug, PartialEq, Eq)]\n   14 | #[bw(import(has_next: bool))]\n   15 | pub struct FileNotifyInformation {\n   16 |     pub action: NotifyAction,\n   17 |     #[bw(try_calc = file_name.size().try_into())]\n   18 |     file_name_length: u32,\n   19 |     #[br(args { size: SizedStringSize::Bytes(file_name_length.into())})]\n   20 |     pub file_name: SizedWideString,\n   21 | }","lines":10,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-fscc/src/notify.rs#L12-L21"},{"ref":"crates/smb-fscc/src/query_file_info.rs:399-409","code":"  399 | #[binrw::binrw]\n  400 | #[derive(Debug, PartialEq, Eq)]\n  401 | #[bw(import(has_next: bool))]\n  402 | pub struct FileGetEaInformation {\n  403 |     // Length does NOT include the null terminator.\n  404 |     #[bw(try_calc = ea_name.len().try_into())]\n  405 |     ea_name_length: u8,\n  40 {"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`self.handler.worker.get().ok_or(\"Worker is uninitialized\").unwrap()` builds an intermediate `Result<_, &str>` purely to immediately `.unwrap()` it, which is functionally identical to `self.handler.worker.get().unwrap()` but noisier and slightly misleading (it looks like an error is being handled, when it is actually still an unconditional panic path on `None`).","fix":"Simplify to a plain `.unwrap()` (or, better, propagate a real error instead of panicking):\n```rust\nself.handler\n    .worker\n    .get()\n    .expect(\"Worker is uninitialized\")\n    .negotaite_complete(&info)\n    .await;\n```","locations":[{"ref":"crates/smb/src/connection.rs:482-488","code":"  482 |         self.handler\n  483 |             .worker\n  484 |             .get()\n  485 |             .ok_or(\"Worker is uninitialized\")\n  486 |             .unwrap()\n  487 |             .negotaite_complete(&info)\n  488 |             .await;","lines":7,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/connection.rs#L482-L488"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"`RespGetDfsReferral` in `crates/smb-msg/src/dfsc.rs` implements `BinWrite` only as a placeholder: `write_options` unconditionally calls `unimplemented!(\"Placeholder trait implementation for RespGetDfsReferral - writing is currently not supported\")`. This type is registered as a normal `FsctlResponseContent`/response type in `ioctl_req_data!` (`DfsGetReferrals`/`DfsGetReferralsEx`), so anything that generically writes an SMB2 response by trait bound (e.g. a server implementation, or generic test/serialization helpers) can hit this panic at runtime instead of a compile error, even though the type otherwise looks like an ordinary `binrw` struct.","fix":"If DFS referral responses are genuinely client-only and writing is never meant to be supported, don't implement `BinWrite` for this type at all - keep only `#[binrw::binread]` - so misuse is a compile-time error rather than a runtime panic. If server-side writing is planned, implement it properly instead of leaving `unimplemented!()` reachable through a public trait impl.","locations":[{"ref":"crates/smb-msg/src/dfsc.rs:79-107","code":"   79 | /// NOTE: This struct currently implements [`BinWrite`] only as a placeholder (calling it will panic).\n   80 | /// [`BinRead`] is implemented and can be used to read DFS referral responses.\n   81 | #[binrw::binread]\n   82 | #[derive(Debug, PartialEq, Eq)]\n   83 | pub struct RespGetDfsReferral {\n   84 |     pub path_consumed: u16,\n   85 |     #[bw(try_calc = referral_entries.len().try_into())]\n   86 |     #[br(temp)]\n   87 |     number_of_referrals: u16,\n   88 |     pub referral_header_flags: ReferralHeaderFlags,\n   89 |     #[br(count = number_of_referrals)]\n   90 |     pub referral_entries: Vec<ReferralEntry>,\n   91 |     // string_buffer is here, but it's use is to provide a buffer for the strings in the referral entries.\n   92 | }\n   93 | \n   94 | impl BinWrite for RespGetDfsReferral {\n   95 |     type Args<'a> = ();\n   96 | \n   97 |     fn write_options<W: binrw::io::Write + binrw::io::Seek>(\n   98 |         &self,\n   99 |         _writer: &mut W,\n  100 |         _endian: binrw::Endian,\n  101 |         _args: Self::Args<'_>,\n  102 |     ) -> binrw::BinResult<()> {\n  103 |         unimplemented!(\n  104 |             \"Placeholder trait implementation for RespGetDfsReferral - writing is currently not supported\"\n  105 |         );\n  106 |     }\n  107 | }","lines":29,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/dfsc.rs#L79-L107"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"`DialectImpl::get_signing_derive_label`, `s2c_encrypt_key_derive_label`, and `c2s_encrypt_key_derive_label` panic (`unimplemented!()`/`panic!()`) for dialects that don't support signing-key-derivation/encryption (SMB 2.0.2/2.1 for signing; anything below SMB 3.0 for encryption). Currently these are only invoked by call sites gated with `dialect_rev.is_smb3()`/`supports_encryption()` checks in `session/state.rs`, so the panics are not presently reachable, but the public API surface itself is a foot-gun: any future caller (including external users of `DialectImpl`, since these are `pub fn`s) that omits the appropriate dialect guard will crash instead of getting a typed error.","fix":"Return `Option<&[u8]>` (or `crate::Result<&[u8]>`) instead of panicking, pushing the \"is this dialect capable of X\" decision to the type system:\n```rust\npub fn get_signing_derive_label(&self) -> Option<&[u8]> {\n    match self.dialect {\n        Dialect::Smb0311 => Some(Smb311::SIGNING_KEY_LABEL),\n        Dialect::Smb0302 | Dialect::Smb030 => Some(Smb30X::SIGNING_KEY_LABEL),\n        _ => None,\n    }\n}\n```","locations":[{"ref":"crates/smb/src/dialects.rs:110-116","code":"  110 |     pub fn get_signing_derive_label(&self) -> &[u8] {\n  111 |         match self.dialect {\n  112 |             Dialect::Smb0311 => Smb311::SIGNING_KEY_LABEL,\n  113 |             Dialect::Smb0302 | Dialect::Smb030 => Smb30X::SIGNING_KEY_LABEL,\n  114 |             _ => unimplemented!(),\n  115 |         }\n  116 |     }","lines":7,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/dialects.rs#L110-L116"},{"ref":"crates/smb/src/dialects.rs:137-150","code":"  137 |     pub fn s2c_encrypt_key_derive_label(&self) -> &[u8] {\n  138 |         match self.dialect {\n  139 |             Dialect::Smb0311 => Smb311::ENCRYPTION_S2C_KEY_LABEL,\n  140 {"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"Both `SessionMessageHandler::drop` (`crates/smb/src/session.rs:374-399`) and `TreeMessageHandler::drop` (`crates/smb/src/tree.rs:372-393`), when built with the `async` feature, spawn a detached `tokio::task` to perform the logoff/tree-disconnect network round trip, since `Drop::drop` cannot `.await`. Nothing tracks or joins these spawned tasks. If the process (or the owning tokio runtime) shuts down shortly after the last `Session`/`Tree` handle is dropped - a common pattern for short-lived CLI invocations like `smb-cli` - the spawned logoff/disconnect task can be aborted mid-flight, silently leaking the session/tree on the server side until the server's own idle timeout reclaims it.","fix":"Document that callers should explicitly call `Session::logoff()`/`Tree::disconnect()` (and `await` them) before dropping/exiting rather than relying on `Drop`, and/or have callers keep a `JoinHandle` registry that is awaited during an explicit `Client::close()` shutdown path so best-effort cleanup actually completes before process exit.","locations":[{"ref":"crates/smb/src/session.rs:374-399","code":"  374 | #[cfg(feature = \"async\")]\n  375 | impl Drop for SessionMessageHandler {\n  376 |     fn drop(&mut self) {\n  377 |         if self\n  378 |             .dropping\n  379 |             .swap(true, std::sync::atomic::Ordering::SeqCst)\n  380 |         {\n  381 |             return;\n  382 |         }\n  383 | \n  384 |         let session_id = self.session_id;\n  385 |         let primary_channel_id = self.primary_channel_id;\n  386 |         let primary_channel = self.primary_channel.clone();\n  387 | \n  388 |         tokio::task::spawn(async move {\n  389 |             let temp_handler = SessionMessageHandler {\n  390 |                 session_id,\n  391 |                 dropping: AtomicBool::new(false),\n  392 |                 primary_channel_id,\n  393 |                 primary_channel,\n  394 |                 channel_handlers: Default::default(),\n  395 |             };\n  396 |             temp_handler.logoff_async().await;\n  397 |         });\n  398 |     }\n  399 | }","lines":26,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/session.rs#L374-L399"},{"ref":"crates/smb/src/tree.rs:372-393","code":"  372 | #[cfg(feature = \"async\")]\n  373 | impl Drop for TreeMessageHandler {\n  374 |     fn drop(&mut self) {\n  375 |         let tree_id = self.tree_id.load(Ordering::SeqCst);\n  376 |         if tree_id == Self::INVALID_TREE_ID {\n  377 |             // Already dropped\n  378 |             return;\n  379 |         }\n  380 | \n  381 |         let upstream = self.upstream.clone();\n  382 |         let tree_name = self.tree_name.clone();\n  383 |         let encrypt = self.info.share_flags.encrypt_data();\n  384 |         tokio::task::spawn(async move {\n  385 |             Self::_disconnect(upstream, tree_id, encrypt)\n  386 |                 .await\n  387 |                 .map_err(|e| {\n  388 |                     log::error!(\"Failed to disconnect from tree {}: {e}\", tree_name);\n  389 |                 })\n  390 |                 .ok();\n  391 |         });\n  392 |     }\n  393 | }","lines":22,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/tree.rs#L372-L393"}]},
{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`SessionSetup::_setup_loop` in `crates/smb/src/session/setup.rs:120-180` loops `while !self.authenticator.is_authenticated()?` exchanging GSS tokens with the server, with no bound on the number of round trips. A malformed or malicious server that keeps returning `STATUS_MORE_PROCESSING_REQUIRED` with fresh tokens indefinitely can keep the client looping (each iteration performs network I/O, so it's not a CPU spin, but there is no cap, timeout, or round counter guarding against a hung/adversarial authentication peer beyond whatever transport-level timeout is separately configured).","fix":"Add an explicit maximum number of authentication round trips (e.g. 10, generous for any real NTLM/Kerberos exchange) and bail out with an error if exceeded:\n```rust\nconst MAX_AUTH_ROUNDS: u32 = 10;\nlet mut rounds = 0;\nwhile !self.authenticator.is_authenticated()? {\n    rounds += 1;\n    if rounds > MAX_AUTH_ROUNDS {\n        return Err(Error::InvalidState(\"Authentication exceeded maximum round trips\".into()));\n    }\n    ...\n}\n```","locations":[{"ref":"crates/smb/src/session/setup.rs:120-180","code":"  120 |     async fn _setup_loop(&mut self) -> crate::Result<()> {\n  121 |         // While there's a response to process, do so.\n  122 |         while !self.authenticator.is_authenticated()? {\n  123 |             let next_buf = match self.last_setup_response.as_ref() {\n  124 |                 Some(response) => self.authenticator.next(&response.buffer).await?,\n  125 |                 None => self.authenticator.next(&[]).await?,\n  126 |             };\n  127 |             let is_auth_done = self.authenticator.is_authenticated()?;\n  128 | \n  129 |             // If keys are exchanged, set them up, to enable validation of next response!\n  130 |             let request = self.send_setup_request(next_buf).await?;\n  131 |             if is_auth_done {\n  132 |                 self.preauth_hash = self.preauth_hash.take().unwrap().finish().into();\n  133 |                 self.make_channel().await?;\n  134 |             }\n  135 | \n  136 |             let response = self.receive_setup_response(request.msg_id).await?;\n  137 |             let message_form = response.form;\n  138 |             let session_id = response.message.header.session_id;\n  139 |             let session_setup_response = response.message.content.to_sessionsetup()?;\n  140 | \n  141 |             // First iteration: construct a session state object.\n  142 |             // TODO: currently, there's a bug which prevents authentication on first attempt\n  143 |             // to complete successfully: since we need the session ID to construct the session state,\n  144 |             // which is required for channel construction and signature validation,\n  145 |             // the first request must arrive here, and then be validated.\n  146 |             if self.result.is_none() {\n  147 |                 log::trace!(\"Creating session state with id {session_id}.\");\n  148 |                 self.set_session(T::init_session(self, session_id).await?)\n  149 |                     .await?;\n  150 |             }\n  151 | \n  152 |             if is_auth_done {\n  153 |                 // Important: If we did NOT make sure the message's signature is valid,\n  154 |                 // we should do it now, as long as the session is not anonymous or guest.\n  155 |                 if !session_setup_response\n  156 |                     .session_flags\n  157 |                     .is_guest_or_null_session()\n  158 |                     && !message_form.signed_or_encrypted()\n  159 |                 {\n  160 |                     return Err(Error::InvalidMessage(\n  161 |                         \"Expected a signed message!\".to_string(),\n  162 |                     ));\n  163 |                 }\n  164 |             } else {\n  165 |                 self.n
