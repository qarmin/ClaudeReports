{"id":"OTHER_1","type":"other","type_label":"Other","severity":"critical","difficulty":"medium","description":"`PatternV1Compression::decompress` expands a fixed 8-byte compressed payload into `repetitions` copies of a single byte, with `repetitions` (a `u32` taken verbatim from the wire) completely unbounded:\n\n```rust\nlet parsed_payload = match PatternV1Payload::read(&mut cursor) { ... };\nout.extend(std::iter::repeat_n(\n    parsed_payload.pattern,\n    parsed_payload.repetitions as usize,\n));\n```\n\nSince `repetitions` can be up to `u32::MAX` (~4.29 billion), an 8-byte compressed chunk can force the client to allocate/extend a buffer by up to ~4 GiB in a single call - a classic \"decompression bomb\" with an amplification ratio in the hundreds of millions. The only bound-check present in the caller (`ChainedCompression::decompress`) - `if len_after > compressed.original_size as usize { return Err(...) }` - happens *after* `out.extend(...)` has already performed the allocation/copy, so it does not prevent the resource exhaustion; it only detects it after the fact.","fix":"Validate `repetitions` against the caller-declared/expected size (or a hard sanity cap) before calling `extend`, e.g. pass the expected `original_size` through and check it up front:\n\n```rust\nconst MAX_PATTERN_REPETITIONS: u32 = 16 * 1024 * 1024; // or derive from the chained item's declared original_size\nif parsed_payload.repetitions > MAX_PATTERN_REPETITIONS {\n    return Err(CompressionError::PatternV1InvalidDecompressedSize);\n}\nout.extend(std::iter::repeat_n(parsed_payload.pattern, parsed_payload.repetitions as usize));\n```","locations":[{"ref":"crates/smb/src/compression.rs:250-271","code":"  250 | impl CompressionAlgorithmImpl for PatternV1Compression {\n  251 |     fn decompress(\n  252 |         &self,\n  253 |         compressed: &[u8],\n  254 |         original_size: Option<u32>,\n  255 |         out: &mut Vec<u8>,\n  256 |     ) -> Result<(), CompressionError> {\n  257 |         debug_assert!(original_size.is_none());\n  258 |         assert!(compressed.len() == 8);\n  259 |         let mut cursor = Cursor::new(&compressed);\n  260 | \n  261 |         let parsed_payload = match PatternV1Payload::read(&mut cursor) {\n  262 |             Ok(p) => p,\n  263 |             Err(e) => return Err(CompressionError::PatternV1InvalidPayload(e)),\n  264 |         };\n  265 |         out.extend(std::iter::repeat_n(\n  266 |             parsed_payload.pattern,\n  267 |             parsed_payload.repetitions as usize,\n  268 |         ));\n  269 | \n  270 |         Ok(())\n  271 |     }","lines":22,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/compression.rs#L250-L271"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"`NdrArray::read_options` allocates two `Vec`s sized by an attacker-controlled element count before any of the actual element data has been validated against the remaining buffer size:\n\n```rust\nlet max_count = *NdrAlign::<u64>::read_options(reader, endian, ())?;\nlet count = args.0;\nif count > max_count { return Err(...); }\nlet mut data = Vec::with_capacity(count as usize);\n...\nlet mut resolved = Vec::with_capacity(count as usize);\n```\n\nBoth `max_count` (read straight off the wire) and `count` (`args.0`) are attacker-controlled: in `crates/smb-rpc/src/interface/srvsvc.rs:62-66`, `ShareInfoContainer::buffer: NdrPtr<NdrArray<T>>` is parsed with `args(None, NdrPtrReadMode::NoArraySupport, (*entries_read as u64,))`, where `entries_read` is itself a `u32` read directly from the `netr_share_enum` server response. So a malicious/compromised server can set `entries_read` (and the wire's own `max_count`) to a huge value (up to ~4 billion), causing `Vec::with_capacity` to attempt to reserve memory for billions of `NdrAlign<ShareInfo1>` elements - twice (`data` then `resolved`) - long before the loop even tries to read past the actual (much smaller) frag-limited buffer. This is an easy, cheap remote memory-exhaustion / allocator-abort DoS reachable via any `netr_share_enum` RPC call against an untrusted or compromised server.","fix":"Cap `count`/`max_count` against a sane upper bound derived from the number of bytes actually remaining in the reader (e.g. `stream_len() - stream_position()`) divided by the minimum encoded element size, before calling `Vec::with_capacity`, and/or grow the vectors incrementally (`Vec::new()` + `push` without a large up-front `with_capacity`) instead of trusting the wire-supplied count directly:\n\n```rust\nlet remaining = reader.stream_len()? - reader.stream_position()?;\nlet max_plausible = remaining / MIN_ELEMENT_SIZE as u64;\nif count > max_plausible {\n    return Err(binrw::Error::AssertFail { pos: reader.stream_position()?, message: format!(\"NdrArray count ({count}) exceeds plausible remaining data\") });\n}\n```","locations":[{"ref":"crates/smb-rpc/src/ndr64/arrays.rs:27-56","code":"   27 |     fn read_options<R: std::io::Read + std::io::Seek>(\n   28 |         reader: &mut R,\n   29 |         endian: binrw::endian::Endian,\n   30 |         args: Self::Args<'_>,\n   31 |     ) -> binrw::BinResult<Self> {\n   32 |         // Begin by reading the count of elements in the array.\n   33 |         let max_count = *NdrAlign::<u64>::read_options(reader, endian, ())?;\n   34 |         // First read: direct data (ptr refs & actual data)\n   35 |         let count = args.0;\n   36 |         // TODO: Test if that's real, and generally --should we just use `max_count`?\n   37 |         if count > max_count {\n   38 |             return Err(binrw::Error::AssertFail {\n   39 |                 pos: reader.stream_position()?,\n   40 |                 message: format!(\n   41 |                     \"NdrArray read count requested ({count}) is more than the array's max count ({max_count})\"\n   42 |                 ),\n   43 |             });\n   44 |         }\n   45 |         let mut data = Vec::with_capacity(count as usize);\n   46 |         for _ in 0..count {\n   47 |             data.push(NdrAlign::<E>::read_options(reader, endian, (None,))?);\n   48 |         }\n   49 |         // Second read: ptr values\n   50 |         let mut resolved = Vec::with_capacity(count as usize);\n   51 |         for refs_only in &data {\n   52 |             let ptr_value = NdrAlign::<E>::read_options(reader, endian, (Some(refs_only),))?;\n   53 |             resolved.push(ptr_value);\n   54 |         }\n   55 |         Ok(Self { data: resolved })\n   56 |     }","lines":30,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-rpc/src/ndr64/arrays.rs#L27-L56"},{"ref":"crates/smb-rpc/src/interface/srvsvc.rs:62-66","code":"   62 |     #[bw(calc = (buffer.as_ref().map_or(0, |x| x.len() as u32)).into())]\n   63 |     entries_read: NdrAlign<u32>,\n   64 |     #[br(args(None, NdrPtrReadMode::NoArraySupport, (*entries_read as u64,)))]\n   65 |     buffer: NdrPtr<NdrArray<T>>,\n   66 | }","lines":5,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-rpc/src/interface/srvsvc.rs#L62-L66"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"`UnchainedCompression::decompress` and `ChainedCompression::decompress` allocate memory sized by the fully attacker-controlled `original_size` field of an incoming compressed SMB message, before any of the compressed payload has actually been validated or decompressed:\n\n```rust\n// UnchainedCompression::decompress\nlet mut data: Vec<u8> = Vec::<u8>::with_capacity(compressed.original_size as usize);\n\n// ChainedCompression::decompress\nlet mut data = Vec::with_capacity(compressed.original_size as usize);\n\n// Lz4Compression::decompress\nout.resize(start_index + original_size.unwrap() as usize, 0);\n```\n\n`original_size` is a `u32` taken directly from the server-supplied `CompressedMessage` header and is never checked against any sane upper bound (e.g. the negotiated max transaction/read/write size) before being used to size an allocation. A malicious or compromised SMB server can send a small compressed message claiming an `original_size` near `u32::MAX` (~4 GiB), forcing the client to attempt a multi-gigabyte allocation on every such message - a cheap and repeatable memory-exhaustion DoS against the client.","fix":"Clamp `original_size` (and the chained-items' per-item `original_size`) against a configured/negotiated maximum message size before allocating, and reject the message with an error instead of allocating first:\n\n```rust\nconst MAX_DECOMPRESSED_SIZE: u32 = 16 * 1024 * 1024; // or the negotiated max transact size\nif compressed.original_size > MAX_DECOMPRESSED_SIZE {\n    return Err(CompressionError::InvalidCompressedMessage);\n}\n```","locations":[{"ref":"crates/smb/src/compression.rs:97-106","code":"   97 |     fn decompress(&self, compressed: &CompressedMessage) -> Result<Vec<u8>, CompressionError> {\n   98 |         let compressed = match compressed {\n   99 |             CompressedMessage::Unchained(c) => c,\n  100 |             _ => panic!(\"Expected Unchained message\"),\n  101 |         };\n  102 |         let mut data: Vec<u8> = Vec::<u8>::with_capacity(compressed.original_size as usize);\n  103 |         self.get_compression_algorithm(compressed.compression_algorithm)?\n  104 |             .decompress(&compressed.data, Some(compressed.original_size), &mut data)?;\n  105 |         Ok(data)\n  106 |     }","lines":10,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/compression.rs#L97-L106"},{"ref":"crates/smb/src/compression.rs:135-166","code":"  135 |     fn decompress(&self, compressed: &CompressedMessage) -> Result<Vec<u8>, CompressionError> {\n  136 |         let compressed = match compressed {\n  137 |             CompressedMessage::Chained(c) => c,\n  138 |             _ => panic!(\"Expected Chained message\"),\n  139 |         };\n  140 | \n  141 |         if compressed.original_size < Header::STRUCT_SIZE as u32 {\n  142 |             Err(CompressionError::InvalidCompressedMessage)?;\n  143 |         }\n  144 | \n  145 |         // TODO: There should be a safer way to implement an append-only,\n  146 |         // size-limited vector.\n  147 |         let mut data = Vec::with_capacity(compressed.original_size as usize);\n  148 | \n  149 |         for item in compressed.items.iter() {\n  150 |             let len_before = data.len();\n  151 |             self.get_compression_algorithm(item.compression_algorithm)?\n  152 |                 .decompress(&item.payload_data, item.original_size, &mut data)?;\n  153 |             let len_after = data.len();\n  154 |             if len_after > compressed.original_size as usize {\n  155 |                 return Err(CompressionError::ChainedCompressionFailed(\n  156 |                     \"Decompressed size exceeds the expected size\".to_string(),\n  157 |                 ))?;\n  158 |             }\n  159 |             if let Some(original_size) = item.original_size\n  160 |                 && len_after - len_before != original_size as usize\n  161 |             {\n  162 |                 Err(CompressionError::ChainedCompressionFailed(\n  163 |                     \"Decompressed size does not match the item expected size\".to_string(),\n  164 |                 ))?;\n  165 |             }\n  166 |         }","lines":32,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/compression.rs#L135-L166"},{"ref":"crates/smb/src/compression.rs:283-298","code":"  283 |     fn decompress(\n  284 |         &self,\n  285 |         compressed: &[u8],\n  286 |         original_size: Option<u32>,\n  287 |         out: &mut Vec<u8>,\n  288 |     ) -> Result<(), CompressionError> {\n  289 |         let start_index = out.len();\n  290 |         out.resize(start_index + original_size.unwrap() as usize, 0);\n  291 | \n  292 |         let size = lz4_flex::decompress_into(compressed, &mut out[start_index..])?;\n  293 | \n  294 |         if size != original_size.unwrap() as usize {\n  295 |             Err(CompressionError::PatternV1InvalidDecompressedSize)?;\n  296 |         }\n  297 |         Ok(())\n  298 |     }","lines":16,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/compression.rs#L283-L298"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`Client::_connect_transport_to_address` has a check-then-act race between checking for an existing connection and registering a new one, acknowledged by the author's own `// TODO: This is a bit racy` comment but not actually fixed:\n\n```rust\nif let Ok(c) = self.get_connection_ip_channel(server_address.ip()).await {\n    return Ok(c);\n}\nself._add_connection(conn.clone(), &server_address.ip()).await?;\n```\n\nIf two tasks call `connect`/`connect_to_address` concurrently for the same server, both can observe \"no existing connection\" and both proceed to `_add_connection`. `_add_connection` itself correctly rejects the second insert (`if connections.contains_key(ip) { return Err(...) }`), but that `Err` is propagated straight out of `_connect_transport_to_address` via `?` - so the \"losing\" caller gets a spurious `Error::InvalidArgument(\"Connection to ... already exists\")` instead of transparently reusing the connection the other task just established (which is the entire point of this de-duplication logic and exactly what `share_connect`'s documentation promises).","fix":"Either serialize connection establishment per-server (e.g. an `Entry`-style API on the map guarded by the same lock across the check-and-insert, or a per-IP `Mutex`/`OnceCell`), or, on an `AlreadyExists`-style error from `_add_connection`, retry `get_connection_ip_channel` instead of propagating the error:\n\n```rust\nmatch self._add_connection(conn.clone(), &server_address.ip()).await {\n    Ok(()) => {}\n    Err(_) => return self.get_connection_ip_channel(server_address.ip()).await,\n}\n```","locations":[{"ref":"crates/smb/src/client/smb_client.rs:415-429","code":"  415 |         // TODO: This is a bit racy\n  416 |         if let Ok(c) = self.get_connection_ip_channel(server_address.ip()).await {\n  417 |             log::debug!(\"Reusing existing connection to {server}\",);\n  418 |             return Ok(c);\n  419 |         }\n  420 |         self._add_connection(conn.clone(), &server_address.ip())\n  421 |             .await?;\n  422 | \n  423 |         let connect_ok = conn.connect().await;\n  424 | \n  425 |         if connect_ok.is_err() {\n  426 |             let mut connections = self.connections.write().await?;\n  427 |             connections.remove(&server_address.ip());\n  428 |             connect_ok?;\n  429 |         }","lines":15,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/client/smb_client.rs#L415-L429"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"`Authenticator::get_context_requirements` in `crates/smb/src/session/authenticator.rs:79-85` always requests `ClientRequestFlags::DELEGATE` (unconstrained Kerberos delegation) for every SSPI security context, with no way to opt out via `AuthMethodsConfig`/`ConnectionConfig`. Requesting unconstrained delegation by default means that, when Kerberos is negotiated, the connected SMB server is granted the client's full delegated Kerberos credentials and can impersonate the client against arbitrary other services (\"double hop\" delegation) - a well-known Kerberos security anti-pattern. This is a broader blast radius than most SMB clients need (constrained delegation or no delegation is the safer default), and there is no config knob exposed in `smb-cli` or `ConnectionConfig`/`AuthMethodsConfig` to disable it.","fix":"Make `DELEGATE` opt-in via configuration instead of always requesting it, e.g.:\n```rust\nfn get_context_requirements(delegate: bool) -> ClientRequestFlags {\n    let mut flags = ClientRequestFlags::MUTUAL_AUTH\n        | ClientRequestFlags::INTEGRITY\n        | ClientRequestFlags::FRAGMENT_TO_FIT\n        | ClientRequestFlags::USE_SESSION_KEY;\n    if delegate {\n        flags |= ClientRequestFlags::DELEGATE;\n    }\n    flags\n}\n```\nand thread a `delegate: bool` field through `AuthMethodsConfig`, defaulting to `false`.","locations":[{"ref":"crates/smb/src/session/authenticator.rs:79-85","code":"   79 |     fn get_context_requirements() -> ClientRequestFlags {\n   80 |         ClientRequestFlags::DELEGATE\n   81 |             | ClientRequestFlags::MUTUAL_AUTH\n   82 |             | ClientRequestFlags::INTEGRITY\n   83 |             | ClientRequestFlags::FRAGMENT_TO_FIT\n   84 |             | ClientRequestFlags::USE_SESSION_KEY\n   85 |     }","lines":7,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/session/authenticator.rs#L79-L85"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`sspi_network_client.rs`'s `send_tcp` (both the async variant at `crates/smb/src/session/sspi_network_client.rs:84-112` and the sync variant at `crates/smb/src/session/sspi_network_client.rs:197-223`) reads a 4-byte big-endian length prefix from the network (`stream.read_u32()`/`read_u32::<BigEndian>()`) and then unconditionally allocates `vec![0; len as usize + 4]` before reading that many bytes. This length comes from whatever the Kerberos KDC/network peer sends back, with no upper bound check. A malicious or compromised KDC (or a MITM on the Kerberos traffic) can send an arbitrarily large length value (up to ~4GiB), forcing the client to allocate a correspondingly large buffer - a memory-exhaustion / DoS vector during Kerberos authentication.","fix":"Bound the accepted length to a sane maximum (e.g. the ~48000-byte max token length already used as a comment reference for the UDP path) before allocating:\n```rust\nconst MAX_KERBEROS_MESSAGE_LEN: u32 = 1 << 20; // 1 MiB, generous upper bound\nlet len = stream.read_u32().await.map_err(...)?;\nif len > MAX_KERBEROS_MESSAGE_LEN {\n    return Err(Error::new(ErrorKind::NoAuthenticatingAuthority, \"Response length exceeds sane maximum\".into()));\n}\n```","locations":[{"ref":"crates/smb/src/session/sspi_network_client.rs:84-112","code":"   84 |         async fn send_tcp(&self, url: &Url, data: &[u8]) -> sspi::Result<Vec<u8>> {\n   85 |             let addr = format!(\n   86 |                 \"{}:{}\",\n   87 |                 url.host_str().unwrap_or_default(),\n   88 |                 url.port().unwrap_or(88)\n   89 |             );\n   90 |             let mut stream = TcpStream::connect(addr).await.map_err(|e| {\n   91 |                 Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{:?}\", e))\n   92 |             })?;\n   93 | \n   94 |             stream\n   95 |                 .write(data)\n   96 |                 .map_err(|e| Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{:?}\", e)))\n   97 |                 .await?;\n   98 | \n   99 |             let len = stream.read_u32().await.map_err(|e| {\n  100 |                 Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{:?}\", e))\n  101 |             })?;\n  102 | \n  103 |             let mut buf = vec![0; len as usize + 4];\n  104 |             buf[0..4].copy_from_slice(&(len.to_be_bytes()));\n  105 | \n  106 |             stream\n  107 |                 .read_exact(&mut buf[4..])\n  108 |                 .map_err(|e| Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{:?}\", e)))\n  109 |                 .await?;\n  110 | \n  111 |             Ok(buf)\n  112 |         }","lines":29,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/session/sspi_network_client.rs#L84-L112"},{"ref":"crates/smb/src/session/sspi_network_client.rs:197-223","code":"  197 |         fn send_tcp(&self, url: &Url, data: &[u8]) -> Result<Vec<u8>> {\n  198 |             let addr = format!(\n  199 |                 \"{}:{}\",\n  200 |                 url.host_str().unwrap_or_default(),\n  201 |                 url.port().unwrap_or(88)\n  202 |             );\n  203 |             let mut stream = TcpStream::connect(addr).map_err(|e| {\n  204 |                 Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{:?}\", e))\n  205 |             })?;\n  206 | \n  207 |             stream.write(data).map_err(|e| {\n  208 |                 Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{:?}\", e))\n  209 |             })?;\n  210 | \n  211 |             let len = stream.read_u32::<BigEndian>().map_err(|e| {\n  212 |                 Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{:?}\", e))\n  213 |             })?;\n  214 | \n  215 |             let mut buf = vec![0; len as usize + 4];\n  216 |             buf[0..4].copy_from_slice(&(len.to_be_bytes()));\n  217 | \n  218 |             stream.read_exact(&mut buf[4..]).map_err(|e| {\n  219 |                 Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{:?}\", e))\n  220 |             })?;\n  221 | \n  222 |             Ok(buf)\n  223 |         }","lines":27,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/session/sspi_network_client.rs#L197-L223"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"In `smb-cli/src/cli.rs:48-51`, `--username`/`--password` are plain `String` CLI arguments with no alternative (e.g. reading from an environment variable, a credentials file, or an interactive prompt). Passing a password directly on the command line exposes it in shell history and in the process listing (`ps aux`/`/proc/<pid>/cmdline`) of any other local user, and the `String` is never zeroized in memory after use.","fix":"Support fetching the password from an environment variable or an interactive prompt (e.g. via the `rpassword` crate) when `--password` is omitted, and consider wrapping the stored value in a zeroizing secret type (e.g. `secrecy::SecretString`) so it isn't left in memory longer than necessary.","locations":[{"ref":"smb-cli/src/cli.rs:48-51","code":"   48 |     #[arg(short, long)]\n   49 |     pub username: String,\n   50 |     #[arg(short, long)]\n   51 |     pub password: String,","lines":4,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/smb-cli/src/cli.rs#L48-L51"}]},
{"id":"OTHER_8","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"In the `create_context_half!` macro (`crates/smb-msg/src/create.rs`), the generated `TryInto<$req_type> for CreateContext$struct_name` always fills the `actual` field of `SmbMsgError::UnexpectedContent` with an empty string literal, with an inline `// TODO: Fix this by making name() a string.` comment acknowledging the gap:\n```rust\n_ => Err(crate::SmbMsgError::UnexpectedContent {\n    expected: stringify!($req_type),\n    actual: \"\", // self.data.name(), TODO: Fix this by making name() a string.\n}),\n```\nThis makes the resulting error message useless for diagnosing which create context type was actually present.","fix":"`CreateContextRequestData`/`CreateContextResponseData::name()` already returns the context's `&'static [u8]` name; either change `SmbMsgError::UnexpectedContent::actual` to accept a `&'static str` computed via a small lookup table matching context names to human-readable strings, or store the raw bytes and format them (e.g. `String::from_utf8_lossy`) when displaying the error, instead of leaving it permanently empty.","locations":[{"ref":"crates/smb-msg/src/create.rs:424-435","code":"  424 |     impl TryInto<$req_type> for [<CreateContext $struct_name:camel>] {\n  425 |         type Error = crate::SmbMsgError;\n  426 |         fn try_into(self) -> crate::Result<$req_type> {\n  427 |             match self.data {\n  428 |                 [<CreateContext $struct_name Data>]::[<$context_type:camel $struct_name>](a) => Ok(a),\n  429 |                 _ => Err(crate::SmbMsgError::UnexpectedContent {\n  430 |                     expected: stringify!($req_type),\n  431 |                     actual: \"\", // self.data.name(), TODO: Fix this by making name() a string.\n  432 |                 }),\n  433 |             }\n  434 |         }\n  435 |     }","lines":12,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
