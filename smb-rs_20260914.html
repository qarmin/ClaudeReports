<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`FileTime::date_time()` at `crates/smb-dtyp/src/binrw_util/file_time.rs:26-29` computes `self.value * Self::SCALE_VALUE_TO_NANOS` (multiplying an attacker-controlled `u64` by `100`) and then does `Self::EPOCH + duration` where `EPOCH` is `time::PrimitiveDateTime` for `1601-01-01`. `FileTime` wraps a raw `u64` that is parsed directly off the wire in dozens of FSCC structures (`FileBasicInformation`, `FileDirectoryInformation` and all the `query_dir_type!`-generated directory-listing structs, `FileNetworkOpenInformation`, `FileFsVolumeInformation`, `FileQuotaInformation`, etc.), so a malicious/compromised SMB server can put an arbitrary `u64` there.\n\nTwo independent panics are reachable:\n1. If `self.value > u64::MAX / 100` (~1.8e17, i.e. any FILETIME representing a date only a few hundred years in the future), the multiplication `self.value * 100` overflows `u64`, which panics in debug/test builds (`attempt to multiply with overflow`).\n2. Even when the multiplication does not overflow, `time::PrimitiveDateTime`'s `Add<Duration>` implementation panics (`.expect(\"...out of range...\")`) whenever the resulting date exceeds the representable range (`time`'s `Date` type only supports years roughly -9999..=9999). A FILETIME value far smaller than `u64::MAX` (representing, say, year 10000+) already triggers this - a trivially craftable value.\n\nBecause `Display for FileTime` and `Debug for FileTime` both call `self.date_time()` internally (lines 51-55 and 57-61), any code path that logs, prints, or debug-formats a parsed `FileTime` (extremely common for file timestamps received during directory listings or file-info queries) panics on such attacker-supplied data, giving a remote, unauthenticated denial of service against any client parsing a malicious server's responses.\n\n`impl From<FileTime> for SystemTime` (lines 92-97) has a related issue: `epoch + src.since_epoch()` uses `std::time::SystemTime`'s `Add<Duration>`, which likewise panics on overflow for sufficiently large `FileTime` values.","fix":"Make `date_time()` (and the `SystemTime` conversion) infallible by using checked/saturating arithmetic instead of relying on the panicking `Add` impls, e.g.:\n```rust\npub fn date_time(&self) -> PrimitiveDateTime {\n    let nanos = self.value.checked_mul(Self::SCALE_VALUE_TO_NANOS);\n    match nanos.map(core::time::Duration::from_nanos) {\n        Some(duration) => Self::EPOCH.checked_add(duration).unwrap_or(Self::MAX_REPRESENTABLE),\n        None => Self::MAX_REPRESENTABLE,\n    }\n}\n```\nor change the return type to `Option<PrimitiveDateTime>` / clamp to a sentinel value, and update `Display`/`Debug` to handle the fallback instead of unconditionally unwrapping via `+`. Apply the same `checked_add` treatment to `impl From<FileTime> for SystemTime`.","locations":[{"ref":"crates/smb-dtyp/src/binrw_util/file_time.rs:26-29","code":"   26 |     pub fn date_time(&self) -> PrimitiveDateTime {\n   27 |         let duration = core::time::Duration::from_nanos(self.value * Self::SCALE_VALUE_TO_NANOS);\n   28 |         Self::EPOCH + duration\n   29 |     }","lines":4,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-dtyp/src/binrw_util/file_time.rs#L26-L29"},{"ref":"crates/smb-dtyp/src/binrw_util/file_time.rs:57-61","code":"   57 | impl std::fmt::Debug for FileTime {\n   58 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n   59 |         f.debug_tuple(\"FileTime\").field(&self.date_time()).finish()\n   60 |     }\n   61 | }","lines":5,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-dtyp/src/binrw_util/file_time.rs#L57-L61"},{"ref":"crates/smb-dtyp/src/binrw_util/file_time.rs:92-97","code":"   92 | impl From<FileTime> for SystemTime {\n   93 |     fn from(src: FileTime) -> SystemTime {\n   94 |         let epoch = SystemTime::from(FileTime::EPOCH.as_utc());\n   95 |         epoch + src.since_epoch()\n   96 |     }\n   97 | }","lines":6,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-dtyp/src/binrw_util/file_time.rs#L92-L97"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`IoctlResponse::parse_fsctl<T>` in `crates/smb-msg/src/ioctl/msg.rs` calls `T::read_le(&mut cursor).unwrap()` on `self.out_buffer`, which is data received from the (possibly malicious or buggy/compromised) SMB server. Any malformed or truncated FSCTL response payload that matches the expected `ctl_code` but fails to fully decode as `T` (e.g. a `SrvRequestResumeKey` response with a `context_length` larger than the remaining bytes, or a short `ValidateNegotiateInfoResponse`) causes the client to panic instead of returning the `crate::Result<T>` the function signature already promises.","fix":"Propagate the read error instead of unwrapping:\n```rust\npub fn parse_fsctl<T>(&self) -> crate::Result<T>\nwhere\n    T: FsctlResponseContent,\n{\n    if !T::FSCTL_CODES.iter().any(|&f| f as u32 == self.ctl_code) {\n        return Err(crate::SmbMsgError::MissingFsctlDefinition(self.ctl_code));\n    }\n    let mut cursor = std::io::Cursor::new(&self.out_buffer);\n    Ok(T::read_le(&mut cursor)?)\n}\n```","locations":[{"ref":"crates/smb-msg/src/ioctl/msg.rs:239-249","code":"  239 |     pub fn parse_fsctl<T>(&self) -> crate::Result<T>\n  240 |     where\n  241 |         T: FsctlResponseContent,\n  242 |     {\n  243 |         if !T::FSCTL_CODES.iter().any(|&f| f as u32 == self.ctl_code) {\n  244 |             return Err(crate::SmbMsgError::MissingFsctlDefinition(self.ctl_code));\n  245 |         }\n  246 |         let mut cursor = std::io::Cursor::new(&self.out_buffer);\n  247 |         Ok(T::read_le(&mut cursor).unwrap())\n  248 |     }\n  249 | }","lines":11,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/ioctl/msg.rs#L239-L249"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `RdmaTransport::_receive_fragmented_data`, the incoming fragment payload is sliced out of the raw MR buffer using offset/length fields taken directly from the peer-supplied `SmbdDataTransferHeader`, with no check against the actual buffer size:\n\n```rust\nlet data_length = message.data_length as usize;\nlet offset_in_mr = message.data_offset as usize;\n...\nresult.extend_from_slice(&mr_data[offset_in_mr..offset_in_mr + data_length]);\n```\n\n`data_length` and `offset_in_mr` are fully attacker/peer-controlled (`SmbdDataTransferHeader::data_offset`/`data_length`, `u32` fields parsed straight off the wire in `crates/smb-transport/src/rdma/smbd.rs`). `mr_data` is the fixed-size receive buffer (`negotiate_result.max_receive_size` bytes). There is no check that `offset_in_mr + data_length <= mr_data.len()` before the slice/indexing operation. A malicious or buggy RDMA/SMBD peer can send a header whose offset+length exceeds the buffer, causing `&mr_data[offset_in_mr..offset_in_mr + data_length]` to panic (\"range end index out of range for slice\"), crashing the receive worker/task.","fix":"Validate the slice bounds before indexing and return a proper error instead of panicking:\n\n```rust\nlet data_length = message.data_length as usize;\nlet offset_in_mr = message.data_offset as usize;\nlet end = offset_in_mr.checked_add(data_length)\n    .filter(|&end| end <= mr_data.len())\n    .ok_or_else(|| RdmaError::Other(\"SMBD data transfer header offset/length out of bounds\"))?;\nresult.extend_from_slice(&mr_data[offset_in_mr..end]);\n```","locations":[{"ref":"crates/smb-transport/src/rdma/transport.rs:359-376","code":"  359 |             let data_length = message.data_length as usize;\n  360 |             let offset_in_mr = message.data_offset as usize;\n  361 | \n  362 |             if result.len() + data_length > running.max_fragmented_recv_size as usize {\n  363 |                 return Err(RdmaError::RequestTooLarge(\n  364 |                     data_length,\n  365 |                     running.max_fragmented_recv_size as usize,\n  366 |                 ));\n  367 |             }\n  368 |             if data_length > running.max_rw_size as usize {\n  369 |                 // TODO: this is wrong\n  370 |                 return Err(RdmaError::RequestTooLarge(\n  371 |                     data_length,\n  372 |                     running.max_rw_size as usize,\n  373 |                 ));\n  374 |             }\n  375 | \n  376 |             result.extend_from_slice(&mr_data[offset_in_mr..offset_in_mr + data_length]);","lines":18,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-transport/src/rdma/transport.rs#L359-L376"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"`PatternV1Compression::decompress` uses a hard `assert!` on the compressed payload length instead of returning an error:\n\n```rust\nfn decompress(&self, compressed: &[u8], original_size: Option<u32>, out: &mut Vec<u8>) -> Result<(), CompressionError> {\n    debug_assert!(original_size.is_none());\n    assert!(compressed.len() == 8);\n    let mut cursor = Cursor::new(&compressed);\n    ...\n}\n```\n\n`compressed` here is `item.payload_data` from a server-supplied `CompressedChainedItem` (or the unchained `CompressedMessage`'s data) - fully attacker-controlled in length via the wire's own length-prefixed encoding. Any compressed chunk using the `PatternV1` algorithm whose payload is not exactly 8 bytes trips this `assert!` and panics the whole process (not merely returns an `Err` to the caller), which is a trivial, remotely-triggerable denial of service against any client that receives a maliciously (or just buggily) crafted compressed SMB message.","fix":"Replace the `assert!` with a proper error return:\n\n```rust\nif compressed.len() != 8 {\n    return Err(CompressionError::InvalidCompressedMessage);\n}\n```","locations":[{"ref":"crates/smb/src/compression.rs:250-264","code":"  250 | impl CompressionAlgorithmImpl for PatternV1Compression {\n  251 |     fn decompress(\n  252 |         &self,\n  253 |         compressed: &[u8],\n  254 |         original_size: Option<u32>,\n  255 |         out: &mut Vec<u8>,\n  256 |     ) -> Result<(), CompressionError> {\n  257 |         debug_assert!(original_size.is_none());\n  258 |         assert!(compressed.len() == 8);\n  259 |         let mut cursor = Cursor::new(&compressed);\n  260 | \n  261 |         let parsed_payload = match PatternV1Payload::read(&mut cursor) {\n  262 |             Ok(p) => p,\n  263 |             Err(e) => return Err(CompressionError::PatternV1InvalidPayload(e)),\n  264 |         };","lines":15,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/compression.rs#L250-L264"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `ConnectionMessageHandler::process_sequence_outgoing` (`crates/smb/src/connection.rs`), the credit-charge cost calculation is:\n```rust\n(1 + (max(send_payload_size, expected_response_payload_size) - 1)\n    / Self::CREDIT_CALC_RATIO)\n    .try_into()\n    .unwrap()\n```\n`send_payload_size`/`expected_response_payload_size` come from `RequestContent::req_payload_size()`/`expected_resp_size()` (both `u32`), and can legitimately be `0` (e.g. calling the public `ResourceHandle::ioctl(ctl_code, vec![], 0)` API with an empty request buffer and `max_output_response == 0`, or `Directory` queries with `output_buffer_length == 0`). When both are `0`, `max(0, 0) - 1` underflows a `u32`, which panics in debug builds (`attempt to subtract with overflow`) and, in release builds, wraps to `u32::MAX`, producing a `cost` value of `65536` after the division - which then fails to fit into `credit_charge: u16` (`crates/smb-msg/src/header.rs:189`), causing the trailing `.try_into().unwrap()` to panic. The same `.unwrap()` also panics for legitimately large payloads/responses whose computed cost exceeds `u16::MAX` (e.g. a caller passing a large `max_output_response` to `ResourceHandle::ioctl`).","fix":"Use saturating/checked arithmetic and propagate an error instead of unwrapping, e.g.:\n```rust\nlet max_size = max(send_payload_size, expected_response_payload_size);\nlet cost: u16 = (1 + max_size.saturating_sub(1) / Self::CREDIT_CALC_RATIO)\n    .try_into()\n    .map_err(|_| Error::InvalidArgument(\"Requested payload/response size too large for credit charge\".into()))?;\n```","locations":[{"ref":"crates/smb/src/connection.rs:605-614","code":"  605 |                 let cost = if Self::SET_CREDIT_CHARGE_CMDS.contains(&msg.message.header.command) {\n  606 |                     let send_payload_size = msg.message.content.req_payload_size();\n  607 |                     let expected_response_payload_size = msg.message.content.expected_resp_size();\n  608 |                     (1 + (max(send_payload_size, expected_response_payload_size) - 1)\n  609 |                         / Self::CREDIT_CALC_RATIO)\n  610 |                         .try_into()\n  611 |                         .unwrap()\n  612 |                 } else {\n  613 |                     1\n  614 |                 };","lines":10,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/connection.rs#L605-L614"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`ThreadingBackend::stop` unconditionally does `self.worker.sender.send(None).unwrap()` to wake up the send loop (`crates/smb/src/connection/worker/parallel/threading_backend.rs:152`). However, both `loop_receive` and `loop_send` independently set `stopped = true` and exit (dropping their captured resources, including the `mpsc::Receiver<Option<IoVec>>` owned by `loop_send`) whenever they observe `TransportError::NotConnected` (lines 40-45 and 70-75). If the transport already failed (e.g. the server force-closed the TCP connection) before `stop()` is called - which is a very plausible sequence, since `Connection`'s `Drop` impl and `Connection::close()` call `stop()` after any error - the `send_channel` receiver has already been dropped, so `self.worker.sender.send(None)` returns `Err(SendError(..))` and `.unwrap()` panics.","fix":"Ignore the send error instead of unwrapping, since a failed send here only means the loop already stopped on its own:\n```rust\n// wake up the sender to stop the loop (ignore error: loop may have already exited).\nlet _ = self.worker.sender.send(None);\n```","locations":[{"ref":"crates/smb/src/connection/worker/parallel/threading_backend.rs:138-166","code":"  138 |     fn stop(&self) -> crate::Result<()> {\n  139 |         log::debug!(\"Stopping worker.\");\n  140 | \n  141 |         self.stopped\n  142 |             .store(true, std::sync::atomic::Ordering::SeqCst);\n  143 | \n  144 |         let handles = self\n  145 |             .loop_handles\n  146 |             .lock()\n  147 |             .unwrap()\n  148 |             .take()\n  149 |             .ok_or(Error::ConnectionStopped)?;\n  150 | \n  151 |         // wake up the sender to stop the loop.\n  152 |         self.worker.sender.send(None).unwrap();\n  153 | \n  154 |         // Join the threads.\n  155 |         handles\n  156 |             .0\n  157 |             .join()\n  158 |             .map_err(|_| Error::JoinError(\"Error stopping receivedr\".to_string()))?;\n  159 | \n  160 |         handles\n  161 |             .1\n  162 |             .join()\n  163 |             .map_err(|_| Error::JoinError(\"Error stopping sender\".to_string()))?;\n  164 | \n  165 |         Ok(())\n  166 |     }","lines":29,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/connection/worker/parallel/threading_backend.rs#L138-L166"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `File::read_block`, the number of bytes returned by the server (`actual_read_length = content.buffer.len()`) is used directly to index into the caller-supplied buffer via `buf[..actual_read_length].copy_from_slice(&content.buffer)`, with no check that `actual_read_length <= buf.len()`. The SMB2 `ReadResponse` wire format (`crates/smb-msg/src/file.rs`, `ReadResponse::buffer`) is parsed with `#[br(count = _data_length)]` where `_data_length` is fully server-controlled and is never validated against the length that was requested in the corresponding `ReadRequest`. A malicious or simply buggy SMB server can therefore respond to a small read request (e.g. `buf.len() == 4096`) with a larger payload, causing `buf[..actual_read_length]` to panic with an out-of-bounds slice range, crashing the client process on every read.","fix":"Validate the server-reported length before copying, e.g.:\n```rust\nif actual_read_length > buf.len() {\n    return Err(std::io::Error::new(\n        std::io::ErrorKind::InvalidData,\n        \"Server returned more data than requested\",\n    ));\n}\nbuf[..actual_read_length].copy_from_slice(&content.buffer);\n```","locations":[{"ref":"crates/smb/src/resource/file.rs:91-120","code":"   91 |         let request = OutgoingMessage::new(\n   92 |             ReadRequest {\n   93 |                 flags,\n   94 |                 length: buf.len() as u32,\n   95 |                 offset: pos,\n   96 |                 file_id: self.handle.file_id().map_err(std::io::Error::other)?,\n   97 |                 minimum_count: 1,\n   98 |             }\n   99 |             .into(),\n  100 |         )\n  101 |         .with_channel_id(channel);\n  102 | \n  103 |         let response = self\n  104 |             .handle\n  105 |             .sendo_recvo(request, ReceiveOptions::new().with_allow_async(true))\n  106 |             .await\n  107 |             .map_err(|e| std::io::Error::other(e.to_string()))?;\n  108 |         let content = response\n  109 |             .message\n  110 |             .content\n  111 |             .to_read()\n  112 |             .map_err(|e| std::io::Error::new(std::io::ErrorKind::InvalidData, e))?;\n  113 |         let actual_read_length = content.buffer.len();\n  114 |         log::debug!(\n  115 |             \"Read {} bytes from {}.\",\n  116 |             actual_read_length,\n  117 |             self.handle.name()\n  118 |         );\n  119 | \n  120 |         buf[..actual_read_length].copy_from_slice(&content.buffer);","lines":30,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/file.rs#L91-L120"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`Authenticator::session_key` in `crates/smb/src/session/authenticator.rs:68-73` slices the SSPI-returned session key with a hard-coded `[..16]` and then calls `.try_into().unwrap()`. If `self.ssp.query_context_session_key()?` ever returns a session key shorter than 16 bytes (this can happen for anonymous/null/guest NTLM sessions, or certain downgraded auth flows the crate explicitly supports via `allow_unsigned_guest_access` / `is_guest_or_null_session()`), the slicing expression `&key_info.session_key.as_ref()[..16]` panics with an out-of-bounds index before `try_into()` is even reached. Since the session key value ultimately originates from a server-driven authentication exchange, a server returning a non-standard/short session key can remotely crash the client during session setup.","fix":"Validate the length before slicing and return a proper `crate::Error` instead of panicking, e.g.:\n```rust\npub fn session_key(&self) -> crate::Result<[u8; 16]> {\n    let key_info = self.ssp.query_context_session_key()?;\n    let bytes = key_info.session_key.as_ref();\n    if bytes.len() < 16 {\n        return Err(Error::InvalidState(\"SSPI session key is shorter than expected (16 bytes)\".into()));\n    }\n    Ok(bytes[..16].try_into().unwrap())\n}\n```","locations":[{"ref":"crates/smb/src/session/authenticator.rs:68-73","code":"   68 |     pub fn session_key(&self) -> crate::Result<[u8; 16]> {\n   69 |         // Use the first 16 bytes of the session key.\n   70 |         let key_info = self.ssp.query_context_session_key()?;\n   71 |         let k = &key_info.session_key.as_ref()[..16];\n   72 |         Ok(k.try_into().unwrap())\n   73 |     }","lines":6,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/session/authenticator.rs#L68-L73"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Guid::parse_uuid` (`crates/smb-dtyp/src/guid.rs:31-44`), reachable via the public `Guid::from_str` / `\"...\".parse::<Guid>()` API, indexes `b[0]` and `b[b.len() - 1]` (where `b = s.as_bytes()`) before validating `s.len()`. If `s` is the empty string, `b` is an empty slice: `b[0]` panics with an out-of-bounds index (and `b.len() - 1` itself underflows on `usize`, which would also panic in debug builds even before the index is used). Since this is a `const fn` used both at compile time (`guid!`/`make_guid!` macros, where the panic is benign - it just fails the build) and at runtime via `FromStr`, any runtime caller that parses an untrusted/empty string as a `Guid` (e.g. object-id or GUID fields taken from configuration, DFS referrals, or other textual input) will panic instead of getting a clean `Err`.","fix":"Check for an empty string before indexing:\n```rust\npub const fn parse_uuid(s: &str) -> Result<Guid, &'static str> {\n    use super::util::parse_byte;\n    let b = s.as_bytes();\n    if b.is_empty() {\n        return Err(\"Invalid UUID format\");\n    }\n    let so = if b[0] == b'{' && b[b.len() - 1] == b'}' {\n        ...\n```","locations":[{"ref":"crates/smb-dtyp/src/guid.rs:31-44","code":"   31 |     pub const fn parse_uuid(s: &str) -> Result<Guid, &'static str> {\n   32 |         use super::util::parse_byte;\n   33 |         let b = s.as_bytes();\n   34 |         let so = if b[0] == b'{' && b[b.len() - 1] == b'}' {\n   35 |             if s.len() != 38 {\n   36 |                 return Err(\"Invalid UUID format\");\n   37 |             }\n   38 |             1\n   39 |         } else {\n   40 |             if s.len() != 36 {\n   41 |                 return Err(\"Invalid UUID format\");\n   42 |             }\n   43 |             0\n   44 |         };","lines":14,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-dtyp/src/guid.rs#L31-L44"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The `query_info_data!` macro in `crates/smb-msg/src/info/common.rs` generates `impl<T> From<T> for Raw<Name><T>` which encodes `value` into an in-memory buffer via `value.write_le(&mut cursor).unwrap()`. This is used for both `RawQueryInfoData`/`RawSetInfoData` (`info/query.rs`, `info/set.rs`), which wrap arbitrary file-info payloads (e.g. security descriptors, EA lists, quota lists) that themselves contain `try_calc`/length-checked fields. If the wrapped value's own `BinWrite` impl can fail for a valid Rust value (e.g. a `Vec` field whose length doesn't fit the wire length type, plausible when round-tripping data originally read from one server - such as a large ACL or a long EA list - back out to another `SetInfo` request), this `unwrap()` turns that into a panic instead of a recoverable encoding error.","fix":"Change `From<T>` to `TryFrom<T>` (returning `binrw::Error`/`SmbMsgError` on failure) so callers that construct these Raw wrappers from data of unknown provenance (e.g. re-encoding data fetched from a remote server) can handle the failure gracefully instead of crashing.","locations":[{"ref":"crates/smb-msg/src/info/common.rs:142-154","code":"  142 |             impl<T> From<T> for [<Raw $name>]<T>\n  143 |             where\n  144 |                 for<'a> T: BinWrite<Args<'a> = ()>,\n  145 |             {\n  146 |                 fn from(value: T) -> Self {\n  147 |                     let mut cursor = std::io::Cursor::new(Vec::new());\n  148 |                     value.write_le(&mut cursor).unwrap();\n  149 |                     Self {\n  150 |                         data: cursor.into_inner(),\n  151 |                         phantom: std::marker::PhantomData,\n  152 |                     }\n  153 |                 }\n  154 |             }","lines":13,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/info/common.rs#L142-L154"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Several length fields are computed on the write path with `#[bw(calc = u16::try_from(x.len()).unwrap())]` instead of the `try_calc` pattern used elsewhere in the same crate (e.g. `create.rs`'s `#[bw(try_calc = name.size().try_into())]`). If the caller-supplied buffer exceeds 65535 bytes, this panics during serialization instead of surfacing a `binrw`/`SmbMsgError`:\n- `SessionSetupRequest::security_buffer_length` (the GSS/Kerberos security buffer - Kerberos tickets carrying a large PAC can realistically exceed 64 KiB in environments with many group memberships, making this reachable with legitimate large tickets, not just malicious input).\n- `SessionSetupResponse::security_buffer_length` (same buffer, server side).\n- `CreateContext*::name_length` in `create.rs` (lower risk in practice since `name` is normally one of the small, fixed `CreateContextType::*_NAME` constants, but the field is `pub` on the underlying struct so a caller-constructed context can still trigger it).","fix":"Use `#[bw(try_calc = buffer.len().try_into())]` (or `name.len().try_into()`) instead of `#[bw(calc = u16::try_from(...).unwrap())]` so an oversized buffer produces a normal `binrw::Error`/`SmbMsgError` instead of a panic.","locations":[{"ref":"crates/smb-msg/src/session_setup.rs:23-28","code":"   23 |     #[bw(calc = PosMarker::default())]\n   24 |     #[br(temp)]\n   25 |     __security_buffer_offset: PosMarker<u16>,\n   26 |     #[bw(calc = u16::try_from(buffer.len()).unwrap())]\n   27 |     #[br(temp)]\n   28 |     security_buffer_length: u16,","lines":6,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/session_setup.rs#L23-L28"},{"ref":"crates/smb-msg/src/session_setup.rs:96-101","code":"   96 |     #[bw(calc = PosMarker::default())]\n   97 |     #[br(temp)]\n   98 |     _security_buffer_offset: PosMarker<u16>,\n   99 |     #[bw(calc = u16::try_from(buffer.len()).unwrap())]\n  100 |     #[br(temp)]\n  101 |     security_buffer_length: u16,","lines":6,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/session_setup.rs#L96-L101"},{"ref":"crates/smb-msg/src/create.rs:332-337","code":"  332 |     #[bw(calc = PosMarker::default())]\n  333 |     #[br(temp)]\n  334 |     _name_offset: PosMarker<u16>, // relative to ChainedItem (any access must consider +CHAINED_ITEM_PREFIX_SIZE from start of item)\n  335 |     #[bw(calc = u16::try_from(name.len()).unwrap())]\n  336 |     #[br(temp)]\n  337 |     name_length: u16,","lines":6,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/create.rs#L332-L337"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`PosMarker::seek_from_if` (`crates/smb-dtyp/src/binrw_util/pos_marker.rs:29-34`) calls `self.pos.get().unwrap()`, and `PosMarker::seek_relative` (lines 62-64) calls `self.try_seek_relative(...).unwrap()` which itself calls `get_pos()?` that can return an `Err`. Both rely on the invariant that `pos` (a `OnceLock<u64>`) has already been populated by a prior `BinRead::read_options` call. `PosMarker::new(value)` (lines 15-20) is a public constructor that does *not* set `pos`, so any caller who builds a `PosMarker` via `new()` (e.g. to construct a value for writing without ever reading it first) and then calls `seek_from`/`seek_from_if`/`seek_relative` will panic instead of getting a `Result`/graceful error, even though `try_seek_relative` exists specifically to return a `BinResult` for this case.","fix":"Make `seek_from`/`seek_from_if` return a `BinResult<SeekFrom>` (propagating `get_pos()`'s error) instead of unwrapping, and have `seek_relative` remain the only unwrapping convenience wrapper, clearly documented as \"panics if not yet read/written\".","locations":[{"ref":"crates/smb-dtyp/src/binrw_util/pos_marker.rs:22-35","code":"   22 |     /// Returns a [SeekFrom] that seeks relative from the position of the PosMarker.\n   23 |     #[inline]\n   24 |     pub fn seek_from(&self, offset: u64) -> SeekFrom {\n   25 |         self.seek_from_if(offset, true)\n   26 |     }\n   27 | \n   28 |     /// Returns a [SeekFrom] that seeks relative from the position of the PosMarker if condition is true,\n   29 |     pub fn seek_from_if(&self, offset: u64, condition: bool) -> SeekFrom {\n   30 |         if condition {\n   31 |             SeekFrom::Start(self.pos.get().unwrap() + offset)\n   32 |         } else {\n   33 |             SeekFrom::Current(0)\n   34 |         }\n   35 |     }","lines":14,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-dtyp/src/binrw_util/pos_marker.rs#L22-L35"},{"ref":"crates/smb-dtyp/src/binrw_util/pos_marker.rs:61-64","code":"   61 |     /// Just like [try_seek_relative](Self::try_seek_relative), but unwraps the result.\n   62 |     pub fn seek_relative(&self, zero_check: bool) -> SeekFrom {\n   63 |         self.try_seek_relative(zero_check).unwrap()\n   64 |     }","lines":4,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-dtyp/src/binrw_util/pos_marker.rs#L61-L64"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Connection::_negotiate_smb2` computes the preauth integrity hash using `request_status.raw.expect(\"Preauth hash must be calculated for supported dialect!\")`. This relies on the internal invariant that `with_return_raw_data(true)` on the outgoing negotiate request always results in `SendMessageResult::raw` being populated by the worker layer. This is true today, but it is an implicit cross-module invariant (enforced in `worker/parallel/base.rs`/`worker/single_worker.rs`) with no compiler-enforced link to this `expect`; any future refactor that skips setting `raw` (e.g. an early return path, or a worker implementation forgetting to honor `return_raw_data`) turns a benign contract mismatch into a hard panic during initial negotiation instead of a recoverable error.","fix":"Replace the `.expect()` with a typed error to fail gracefully if the invariant is ever violated:\n```rust\nlet raw = request_status.raw.ok_or_else(|| Error::InvalidState(\n    \"Preauth hash requires raw request data, but none was captured\".into(),\n))?;\nPreauthHashState::begin().next(&raw).next(&response.raw)\n```","locations":[{"ref":"crates/smb/src/connection.rs:331-341","code":"  331 |         let preauth_hash = if dialect_impl.preauth_hash_supported() {\n  332 |             PreauthHashState::begin()\n  333 |                 .next(\n  334 |                     &request_status\n  335 |                         .raw\n  336 |                         .expect(\"Preauth hash must be calculated for supported dialect!\"),\n  337 |                 )\n  338 |                 .next(&response.raw)\n  339 |         } else {\n  340 |             PreauthHashState::unsupported()\n  341 |         };","lines":11,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/connection.rs#L331-L341"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`CompressedChainedItem` (`crates/smb-dtyp/src/../smb-msg/src/compressed.rs:114-132`, MS-SMB2 2.2.42.2.1) reads its wire-provided `length` field (`PosMarker<u32>`) and then computes:\n```rust\n#[br(map_stream = |s| s.take_seek(length.value as u64 - (add_original_size_to_total_length(&compression_algorithm))), ...)]\n```\n`add_original_size_to_total_length` returns `4` whenever `compression_algorithm.original_size_required()` is true (LZNT1/LZ77/LZ77+Huffman/LZ4). There is no check that `length.value >= 4` in that case. A malicious or compromised SMB 3.1.1 peer sending a compressed, chained message with `length < 4` and one of those algorithms causes `length.value as u64 - 4` to underflow. This is on the direct decompression-header parsing path for any SMB 3.1.1 connection that negotiated compression, so it is remotely reachable during normal message processing. In debug builds this panics (`attempt to subtract with overflow`); in release it wraps to a huge value used for the take-seek window.","fix":"Validate the minimum length before subtracting:\n```rust\n#[br(map_stream = |s| {\n    let extra = add_original_size_to_total_length(&compression_algorithm);\n    let payload_len = (length.value as u64).checked_sub(extra)\n        .ok_or_else(|| binrw::Error::AssertFail { pos: 0, message: \"chained item length smaller than header\".into() })?;\n    s.take_seek(payload_len)\n}, parse_with = binrw::helpers::until_eof)]\n```","locations":[{"ref":"crates/smb-msg/src/compressed.rs:114-132","code":"  114 | #[smb_message_binrw]\n  115 | pub struct CompressedChainedItem {\n  116 |     /// Compression algorithm used for this payload\n  117 |     pub compression_algorithm: CompressionAlgorithm,\n  118 |     /// Compression flags (SMB2_COMPRESSION_FLAG_NONE or SMB2_COMPRESSION_FLAG_CHAINED)\n  119 |     pub flags: u16,\n  120 |     /// Length of compressed payload including OriginalPayloadSize if present\n  121 |     #[bw(calc = PosMarker::default())]\n  122 |     #[br(temp)]\n  123 |     length: PosMarker<u32>,\n  124 |     /// Size of uncompressed payload (present only for LZNT1, LZ77, LZ77+Huffman, or LZ4)\n  125 |     #[brw(if(compression_algorithm.original_size_required()))]\n  126 |     #[bw(assert(original_size.is_none() ^ compression_algorithm.original_size_required()))]\n  127 |     pub original_size: Option<u32>,\n  128 |     /// Compressed payload data\n  129 |     #[br(map_stream = |s| s.take_seek(length.value as u64 - (add_original_size_to_total_length(&compression_algorithm))), parse_with = binrw::helpers::until_eof)]\n  130 |     #[bw(write_with = PosMarker::write_size_plus, args(&length, add_original_size_to_total_length(compression_algorithm)))]\n  131 |     pub payload_data: Vec<u8>,\n  132 | }","lines":19,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/compressed.rs#L114-L132"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `crates/smb-msg/src/create.rs`, the `create_context_half!` macro (expanded for both `CreateContextRequest` and `CreateContextResponse`) computes the seek offset for the `name` and `data` fields by subtracting `CHAINED_ITEM_PREFIX_SIZE` (4, from `smb_fscc::CHAINED_ITEM_PREFIX_SIZE`) from the raw, attacker-controlled `_name_offset`/`_data_offset` u16 values read straight off the wire:\n```rust\n#[br(seek_before = _name_offset.seek_from(_name_offset.value as u64 - CHAINED_ITEM_PREFIX_SIZE as u64))]\n...\n#[br(seek_before = _name_offset.seek_from_if(_data_offset.value as u64 - CHAINED_ITEM_PREFIX_SIZE as u64, _data_length.value > 0))]\n```\nNeither `_name_offset.value` nor `_data_offset.value` is asserted to be `>= CHAINED_ITEM_PREFIX_SIZE` before the subtraction (unlike the very similar pattern in `crates/smb-msg/src/dfsc.rs`, e.g. `ReferralEntryValueV2`, which explicitly does `#[br(assert(dfs_path_offset.value >= ReferralEntry::COMMON_PART_SIZE as u16))]` before the same kind of subtraction). A malicious SMB server (when parsing a `CREATE` response) or a malicious client (server feature, parsing a `CREATE` request) can set `_name_offset`/`_data_offset` to a value less than 4 (e.g. 0), causing `u64` subtraction underflow. In debug/overflow-checked builds (the crate does not set `overflow-checks` in its release profile, so `dev` builds - and fuzzing builds, which typically enable overflow checks - are affected) this panics with \"attempt to subtract with overflow\"; in release builds it silently wraps to a huge `u64`, producing a bogus seek target.","fix":"Add a `#[br(assert(...))]` on `_name_offset`/`_data_offset` before the subtraction, mirroring the guard already used in `dfsc.rs`:\n```rust\n#[br(assert(_name_offset.value as usize >= CHAINED_ITEM_PREFIX_SIZE || name_length == 0))]\n#[bw(calc = PosMarker::default())]\n#[br(temp)]\n_name_offset: PosMarker<u16>,\n```\nand similarly for `_data_offset`, or use `checked_sub`/`saturating_sub` and turn a violation into a `binrw` parse error instead of relying on unchecked pointer arithmetic.","locations":[{"ref":"crates/smb-msg/src/create.rs:346-351","code":"  346 |     /// The name of the create context\n  347 |     #[brw(align_before = 8)]\n  348 |     #[br(count = name_length)]\n  349 |     #[br(seek_before = _name_offset.seek_from(_name_offset.value as u64 - CHAINED_ITEM_PREFIX_SIZE as u64))]\n  350 |     #[bw(write_with = PosMarker::write_roff_plus, args(&_name_offset, CHAINED_ITEM_PREFIX_SIZE as u64))]\n  351 |     pub name: Vec<u8>,","lines":6,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/create.rs#L346-L351"},{"ref":"crates/smb-msg/src/create.rs:353-359","code":"  353 |     /// The data payload of the create context\n  354 |     #[bw(align_before = 8)]\n  355 |     #[br(assert(_data_offset.value % 8 == 0))]\n  356 |     #[bw(write_with = PosMarker::write_roff_size_b_plus, args(&_data_offset, &_data_length, &_name_offset, CHAINED_ITEM_PREFIX_SIZE as u64))]\n  357 |     #[br(seek_before = _name_offset.seek_from_if(_data_offset.value as u64 - CHAINED_ITEM_PREFIX_SIZE as u64, _data_length.value > 0))]\n  358 |     #[br(map_stream = |s| s.take_seek(_data_length.value.into()), args(&name))]\n  359 |     pub data: [<CreateContext $struct_name Data>],","lines":7,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/create.rs#L353-L359"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `ACE::read` (`crates/smb-dtyp/src/security/ace.rs:92-98`), the wire-provided `_ace_size` (`u16`, part of the `MS-DTYP 2.4.4` `ACE_HEADER`) is used to bound the ACE payload without validating it is at least `ACE::HEADER_SIZE` (4):\n```rust\n#[br(map_stream = |s| s.take_seek(_ace_size.value as u64 - Self::HEADER_SIZE))]\n```\nIf a malicious security descriptor sets `AceSize < 4` (0..3), `_ace_size.value as u64 - 4` underflows. In debug/test builds (the default for `cargo test`, and for fuzzing harnesses) this panics with `attempt to subtract with overflow`; in release builds it silently wraps to a huge `u64` that is handed to `take_seek`, producing a bogus (but not immediately crashing) read window. Either way, this is unvalidated attacker-controlled arithmetic feeding directly into stream-length calculations for security-descriptor parsing.","fix":"Validate the size before subtracting, returning a parse error instead of underflowing:\n```rust\n#[br(map_stream = |s| s.take_seek(\n    (_ace_size.value as u64).checked_sub(Self::HEADER_SIZE)\n        .ok_or_else(|| binrw::Error::AssertFail { pos: 0, message: \"ACE size smaller than header\".into() })?\n))]\n```\n(or add a `#[br(assert(_ace_size.value as u64 >= Self::HEADER_SIZE))]` on `_ace_size` before it is used).","locations":[{"ref":"crates/smb-dtyp/src/security/ace.rs:85-99","code":"   85 | #[binrw::binrw]\n   86 | #[derive(Debug, PartialEq, Eq, Clone)]\n   87 | pub struct ACE {\n   88 |     #[bw(calc = value.get_type())]\n   89 |     #[br(temp)]\n   90 |     pub ace_type: AceType,\n   91 |     pub ace_flags: AceFlags,\n   92 |     #[bw(calc = PosMarker::default())]\n   93 |     #[br(temp)]\n   94 |     _ace_size: PosMarker<u16>,\n   95 |     #[br(args(ace_type))]\n   96 |     #[br(map_stream = |s| s.take_seek(_ace_size.value as u64 - Self::HEADER_SIZE))]\n   97 |     #[bw(write_with = PosMarker::write_size_plus, args(&_ace_size, Self::HEADER_SIZE))]\n   98 |     pub value: AceValue,\n   99 | }","lines":15,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-dtyp/src/security/ace.rs#L85-L99"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`NetBiosName::read_options` decodes the first-level NetBIOS name encoding with unchecked `u8` subtraction:\n\n```rust\nlet lower_nibble = lower_byte - Self::SUB_TO_GET_NIBBLE;\nlet upper_nibble = upper_byte - Self::SUB_TO_GET_NIBBLE;\n```\n\nwhere `SUB_TO_GET_NIBBLE = b'A'` (0x41). If either encoded byte is less than `b'A'` (i.e. not valid first-level-encoded NetBIOS data), this subtraction underflows: it panics in debug builds (`attempt to subtract with overflow`) and silently wraps in release builds, producing a garbage decoded character instead of an error. This is reachable from the network: in `netbios_session_setup`, the response trailer type is selected purely from the server-supplied `header.ptype` byte (`NBSSTrailer::read_args(..., (header.ptype,))`), so a misbehaving/malicious server can send `ptype = 0x81` (`SessionRequest`) as a \"response\", causing the client to parse an `NBSessionRequest` - which contains two `NetBiosName` fields - out of attacker-controlled bytes.","fix":"Use checked/wrapping arithmetic and return a decode error instead of panicking or silently wrapping:\n\n```rust\nlet lower_nibble = lower_byte.checked_sub(Self::SUB_TO_GET_NIBBLE)\n    .ok_or_else(|| binrw::Error::AssertFail { pos: reader.stream_position().unwrap(), message: \"Invalid NetBiosName encoding byte\".to_string() })?;\nlet upper_nibble = upper_byte.checked_sub(Self::SUB_TO_GET_NIBBLE)\n    .ok_or_else(|| binrw::Error::AssertFail { pos: reader.stream_position().unwrap(), message: \"Invalid NetBiosName encoding byte\".to_string() })?;\n```","locations":[{"ref":"crates/smb-transport/src/netbios/msg.rs:124-139","code":"  124 |         for indx in 0..number_of_chars {\n  125 |             let lower_byte = u8::read_options(reader, endian, ())?;\n  126 |             let upper_byte = u8::read_options(reader, endian, ())?;\n  127 | \n  128 |             let lower_nibble = lower_byte - Self::SUB_TO_GET_NIBBLE;\n  129 |             let upper_nibble = upper_byte - Self::SUB_TO_GET_NIBBLE;\n  130 | \n  131 |             let char = (lower_nibble << 4) | upper_nibble;\n  132 | \n  133 |             if indx == number_of_chars - 1 {\n  134 |                 // Last byte is the suffix\n  135 |                 suffix = char;\n  136 |             } else {\n  137 |                 name.push(char as char);\n  138 |             }\n  139 |         }","lines":16,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-transport/src/netbios/msg.rs#L124-L139"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `RdmaTransport::_receive_fragmented_data`, the total expected fragmented-message size is computed with an unchecked `u32` addition of two peer-controlled fields:\n\n```rust\nlet expected_total_size = message.data_length + message.remaining_data_length;\nif expected_total_size > running.max_fragmented_recv_size {\n    return Err(RdmaError::RequestTooLarge(...));\n}\nresult.reserve_exact(expected_total_size as usize);\n```\n\n`message.data_length` and `message.remaining_data_length` are both attacker/peer-controlled `u32` values from `SmbdDataTransferHeader`. If their sum overflows `u32`, this panics in debug builds (`attempt to add with overflow`) or silently wraps in release builds, producing a small `expected_total_size` that passes the `max_fragmented_recv_size` size guard even though the real declared sizes are enormous - defeating the purpose of the check (the per-fragment loop-level checks later partially mitigate the fallout, but the intended up-front size guard is bypassable this way).","fix":"Use checked/saturating arithmetic so the guard cannot be bypassed via integer overflow:\n\n```rust\nlet expected_total_size = message.data_length.checked_add(message.remaining_data_length)\n    .ok_or(RdmaError::RequestTooLarge(u32::MAX as usize, running.max_fragmented_recv_size as usize))?;\n```","locations":[{"ref":"crates/smb-transport/src/rdma/transport.rs:341-357","code":"  341 |             if result.capacity() == 0 {\n  342 |                 if message.data_length == 0 {\n  343 |                     log::trace!(\"Received empty fragmented data, stopping receive loop.\");\n  344 |                     assert!(message.remaining_data_length == 0 && message.data_offset == 0);\n  345 |                     return Ok(result);\n  346 |                 }\n  347 | \n  348 |                 // First receive only\n  349 |                 let expected_total_size = message.data_length + message.remaining_data_length;\n  350 |                 if expected_total_size > running.max_fragmented_recv_size {\n  351 |                     return Err(RdmaError::RequestTooLarge(\n  352 |                         expected_total_size as usize,\n  353 |                         running.max_fragmented_recv_size as usize,\n  354 |                     ));\n  355 |                 }\n  356 |                 result.reserve_exact(expected_total_size as usize);\n  357 |             }","lines":17,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-transport/src/rdma/transport.rs#L341-L357"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `ConnectionMessageHandler::process_sequence_incoming` (`crates/smb/src/connection.rs:658-678`), `granted_credits` and `charged_credits` are read directly from the server-controlled response header (`msg.message.header.credit_request` / `credit_charge`) with no sanity checks. `credit_pool` is an `AtomicU16` that is updated with `fetch_sub`/`fetch_add` using the difference of these two attacker/server-controlled values. Since `fetch_sub`/`fetch_add` on atomics wrap silently (no panic), a server that returns an inconsistent or malicious `credit_charge`/`credit_request` pair (e.g. a large `credit_charge` while `credit_pool` currently holds a small value) will cause `credit_pool` to wrap around to a large bogus value. This corrupts the client's credit accounting (used later at line 623 to compute how many additional credits to request), potentially causing the client to systematically under- or over-request credits, leading to request stalls or protocol violations against a well-behaved server, and is a silent state-corruption path driven entirely by untrusted server input.","fix":"Validate/clamp the server-provided credit values before using them in arithmetic, e.g. using `checked_sub`/`checked_add` and treating an inconsistent response as a protocol error:\n```rust\nif charged_credits > granted_credits {\n    let diff = charged_credits - granted_credits;\n    if self.credit_pool.load(Ordering::SeqCst) < diff {\n        return Err(Error::InvalidMessage(\"Server reported an inconsistent credit charge\".into()));\n    }\n    self.credit_pool.fetch_sub(diff, Ordering::SeqCst);\n} else {\n    self.credit_pool.fetch_add(granted_credits - charged_credits, Ordering::SeqCst);\n}\n```","locations":[{"ref":"crates/smb/src/connection.rs:658-678","code":"  658 |     #[maybe_async]\n  659 |     async fn process_sequence_incoming(&self, msg: &IncomingMessage) -> crate::Result<()> {\n  660 |         if let Some(neg) = self.conn_info.get()\n  661 |             && neg.negotiation.caps.large_mtu()\n  662 |         {\n  663 |             let granted_credits = msg.message.header.credit_request;\n  664 |             let charged_credits = msg.message.header.credit_charge;\n  665 |             // Update the pool size - return how many EXTRA credits were granted.\n  666 |             // also, handle the case where the server granted less credits than charged.\n  667 |             if charged_credits > granted_credits {\n  668 |                 self.credit_pool\n  669 |                     .fetch_sub(charged_credits - granted_credits, Ordering::SeqCst);\n  670 |             } else {\n  671 |                 self.credit_pool\n  672 |                     .fetch_add(granted_credits - charged_credits, Ordering::SeqCst);\n  673 |             }\n  674 | \n  675 |             // Return the credits to the pool.\n  676 |             self.curr_credits.add_permits(granted_credits as usize);\n  677 |             return Ok(());\n  678 |         }","lines":21,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/connection.rs#L658-L678"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`File::read_block` and `File::write_block_zc` cast `buf.len()`/`buf.len()` to `u32` (`length: buf.len() as u32` and `buf.len() as u32` respectively) with no check that the buffer actually fits in 32 bits. For buffers larger than `u32::MAX` bytes (4 GiB), the length silently truncates, so the `ReadRequest`/`WriteRequest` sent to the server would claim a different (smaller) size than the buffer actually being read into / the data actually attached as zero-copy `additional_data`, producing a mismatch between the declared request size and the real buffer size.","fix":"Return an error for buffers that don't fit into a `u32` instead of silently truncating:\n```rust\nlet length: u32 = buf.len().try_into().map_err(|_| std::io::Error::new(\n    std::io::ErrorKind::InvalidInput, \"Buffer too large for a single SMB2 read/write request\"))?;\n```","locations":[{"ref":"crates/smb/src/resource/file.rs:94-99","code":"   94 |                 length: buf.len() as u32,\n   95 |                 offset: pos,\n   96 |                 file_id: self.handle.file_id().map_err(std::io::Error::other)?,\n   97 |                 minimum_count: 1,\n   98 |             }\n   99 |             .into(),","lines":6,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/file.rs#L94-L99"},{"ref":"crates/smb/src/resource/file.rs:178-188","code":"  178 |         let outgoing = OutgoingMessage::new(\n  179 |             WriteRequest::new(\n  180 |                 pos,\n  181 |                 self.handle.file_id().map_err(std::io::Error::other)?,\n  182 |                 WriteFlags::new(),\n  183 |                 buf.len() as u32,\n  184 |             )\n  185 |             .into(),\n  186 |         )\n  187 |         .with_additional_data(Arc::clone(&buf))\n  188 |         .with_channel_id(channel);","lines":11,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/resource/file.rs#L178-L188"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The bounds-check `assert` on `actual_count` in `NdrString` is logically broken due to operator precedence/short-circuiting, and its `panic`-inducing sibling branch is reachable too. The expression is:\n\n```rust\n#[br(assert((SIZE == 0 || *actual_count < SIZE as u64) || *actual_count < { *(alloc_length.unwrap()) }))]\nactual_count: NdrAlign<u64>,\n```\n\nThis parses as `(A || B) || C` where `A = (SIZE == 0)`. Since `NdrString<u16>` (the type used everywhere in this codebase, e.g. `netname`/`remark` in `ShareInfo1` parsed from `netr_share_enum` server responses) always has `SIZE == 0`, `A` is always `true`, so the whole assert is vacuously `true` regardless of `actual_count`. The check that was clearly intended - bounding `actual_count` by `alloc_length` for non-conformant (`SIZE == 0`) strings - never actually runs. `actual_count` then flows straight into `#[br(count = *actual_count, ...)]` on the very next field (`pub data: NdrAlign<Vec<E>>`), so a malicious/compromised SMB server can set `actual_count` to an arbitrary attacker-controlled `u64` (read directly off the wire), causing `binrw` to attempt to allocate/read a vector sized by that value - an unbounded-allocation DoS on every string in every RPC response (e.g. share names/remarks returned by `srvsvc`).\n\nSeparately, for the `SIZE != 0` (conformant string) case, if `actual_count >= SIZE`, the `(A || B)` clause is `false` and `C` is evaluated: `alloc_length.unwrap()`. But `alloc_length` is only read (`Some`) when `SIZE == 0` (`#[br(if(SIZE == 0))]` on `alloc_length`); for `SIZE != 0` it is always `None`, so `alloc_length.unwrap()` panics. That is a second, distinct bug triggerable by a malformed/oversized conformant string field.","fix":"Fix the boolean logic so each mode is checked independently and non-conformant strings are actually bounded, e.g.:\n\n```rust\n#[br(assert(\n    (SIZE != 0 && *actual_count < SIZE as u64)\n    || (SIZE == 0 && *actual_count <= *alloc_length.as_ref().unwrap())\n))]\nactual_count: NdrAlign<u64>,\n```\n\nThis removes the vacuous `SIZE == 0` short-circuit (so non-conformant strings are actually bounded by `alloc_length`) and avoids ever calling `alloc_length.unwrap()` for the `SIZE != 0` case in a way that could panic on attacker input - the offending branch is only reached when it is known to be `Some`.","locations":[{"ref":"crates/smb-rpc/src/ndr64/string.rs:19-32","code":"   19 |     #[bw(if(SIZE == 0), calc = Some((data.len() as u64).into()))]\n   20 |     #[br(if(SIZE == 0))]\n   21 |     alloc_length: Option<NdrAlign<u64>>,\n   22 | \n   23 |     #[bw(calc = 0.into())]\n   24 |     #[br(assert(*offset == 0))] // TODO: Support non-zero offsets!\n   25 |     offset: NdrAlign<u64>,\n   26 |     #[bw(calc = (data.len() as u64).into())]\n   27 |     #[br(assert((SIZE == 0 || *actual_count < SIZE as u64) || *actual_count < { *(alloc_length.unwrap()) }\n   28 |     ))]\n   29 |     actual_count: NdrAlign<u64>,\n   30 |     #[br(count = *actual_count, args { inner: args })]\n   31 |     #[bw(args_raw(args))]\n   32 |     pub data: NdrAlign<Vec<E>>,","lines":14,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-rpc/src/ndr64/string.rs#L19-L32"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `NetBiosTransport::netbios_session_setup`, the buffer meant to receive the NetBIOS session response body is allocated with `Vec::with_capacity` instead of being sized:\n\n```rust\nlet mut result_packet = Vec::with_capacity(header.length as usize);\nself.tcp.receive_exact(&mut result_packet).await?;\n```\n\n`Vec::with_capacity(n)` only reserves capacity; the vector's `len()` stays `0`. `receive_exact` takes `&mut [u8]`, and `&mut Vec<u8>` deref-coerces to a slice of length `result_packet.len()` (`0`), not capacity. So `receive_exact` is always called with an empty slice, reads zero bytes, and `result_packet` stays empty regardless of `header.length`. The real response bytes are left unread on the TCP socket (protocol desync for subsequent reads), and `NBSSTrailer::read_args(&mut Cursor::new(&result_packet), (header.ptype,))` then parses an empty buffer. This happens to \"work\" only for `PositiveSessionResponse`, whose body is empty anyway; for `NegativeSessionResponse` or `SessionRetargetResponse` (which do carry payload bytes), the actual error code / retarget address is lost and parsing fails with a spurious EOF/parse error instead of surfacing the real server-provided information, while the unread bytes remain in the socket buffer and corrupt the following read.","fix":"Allocate a properly-sized, zero-filled buffer instead of just reserving capacity:\n\n```rust\nlet mut result_packet = vec![0u8; header.length as usize];\nself.tcp.receive_exact(&mut result_packet).await?;\n```","locations":[{"ref":"crates/smb-transport/src/netbios/transport.rs:60-65","code":"   60 |         let header = self.netbios_receive_header().await?;\n   61 |         let mut result_packet = Vec::with_capacity(header.length as usize);\n   62 |         self.tcp.receive_exact(&mut result_packet).await?;\n   63 | \n   64 |         let nbss_packet =\n   65 |             NBSSTrailer::read_args(&mut Cursor::new(&result_packet), (header.ptype,))?;","lines":6,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-transport/src/netbios/transport.rs#L60-L65"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Path::from_str` in `smb-cli/src/path.rs:34-41` unconditionally replaces every `/` with `\\` (`let input = input.replace('/', r\"\\\");`) *before* deciding whether the argument is a UNC path or a local filesystem path. On any non-Windows platform (Linux/macOS, which this repo is developed/tested on, per the environment), a legitimate local path such as `/home/user/data/file.txt` gets mangled into `\\home\\user\\data\\file.txt`. Since `\\` is not a path separator on Unix, `PathBuf::from(...)` treats the whole mangled string as a single filename component, so essentially every local source/destination path passed to `smb-cli copy`, or any other command taking a local `Path`, is broken on non-Windows targets.","fix":"Only translate slashes for the remote/UNC branch, and leave local paths untouched, e.g.:\n```rust\nimpl FromStr for Path {\n    type Err = smb::Error;\n    fn from_str(input: &str) -> Result<Self, Self::Err> {\n        if input.starts_with(r\"\\\\\") || input.starts_with(\"//\") {\n            let unc_input = input.replace('/', r\"\\\");\n            Ok(Path::Remote(unc_input.parse()?))\n        } else {\n            Ok(Path::Local(std::path::PathBuf::from(input)))\n        }\n    }\n}\n```","locations":[{"ref":"smb-cli/src/path.rs:31-42","code":"   31 | impl FromStr for Path {\n   32 |     type Err = smb::Error;\n   33 | \n   34 |     fn from_str(input: &str) -> Result<Self, Self::Err> {\n   35 |         let input = input.replace('/', r\"\\\");\n   36 |         if input.starts_with(r\"\\\\\") {\n   37 |             Ok(Path::Remote(input.parse()?))\n   38 |         } else {\n   39 |             Ok(Path::Local(std::path::PathBuf::from(input)))\n   40 |         }\n   41 |     }\n   42 | }","lines":12,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/smb-cli/src/path.rs#L31-L42"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ResponseContent::associated_cmd` in `crates/smb-msg/src/plain.rs` panics for the `Error` variant: `Error(_) => panic!(\"Error has no matching command!\")`. `ResponseContent::Error` is a completely normal, frequently-occurring variant (any failed SMB2 request produces an `ErrorResponse`, regardless of the original command), so this is a landmine for any caller of the public `associated_cmd()` API that doesn't special-case `Error` first. The one current in-tree caller (`crates/smb/src/msg_handler.rs:350`) only calls the sibling `RequestContent::associated_cmd()` (which has no `Error` variant and is safe), but `ResponseContent::associated_cmd` is `pub` and part of the crate's public surface, so any downstream code that calls it on a parsed error response will crash.","fix":"Change the return type to `Option<Command>` (or add a documented `#[panics]` note and rename to make the precondition obvious), e.g.:\n```rust\npub fn associated_cmd(&self) -> Option<Command> {\n    use ResponseContent::*;\n    Some(match self {\n        $( $cmd(_) => Command::$cmd, )*\n        OplockBreakNotify(_) | OplockBreak(_) | LeaseBreakNotify(_) | LeaseBreak(_) => Command::OplockBreak,\n        ServerToClientNotification(_) => Command::ServerToClientNotification,\n        Error(_) => return None,\n    })\n}\n```","locations":[{"ref":"crates/smb-msg/src/plain.rs:143-160","code":"  143 | impl ResponseContent {\n  144 |     /// Get the command associated with this content.\n  145 |     pub fn associated_cmd(&self) -> Command {\n  146 |         use ResponseContent::*;\n  147 |         match self {\n  148 |             $(\n  149 |                 $cmd(_) => Command::$cmd,\n  150 |             )*\n  151 | \n  152 |             | OplockBreakNotify(_)\n  153 |             | OplockBreak(_)\n  154 |             | LeaseBreakNotify(_)\n  155 |             | LeaseBreak(_) => Command::OplockBreak,\n  156 |             ServerToClientNotification(_) => Command::ServerToClientNotification,\n  157 |             Error(_) => panic!(\"Error has no matching command!\"),\n  158 |         }\n  159 |     }\n  160 | }","lines":18,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb-msg/src/plain.rs#L143-L160"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`DfsResolver::ref_entry_to_dfs_target` mixes UTF-16 code-unit counts with Rust `&str` byte lengths and `char` counts when computing the DFS referral path suffix:\n\n```rust\nlet index_end_of_match = path_consumed / std::mem::size_of::<u16>();\nif index_end_of_match > dfs_path_string.len() {\n    return Err(...);\n}\nlet suffix = if index_end_of_match < dfs_path_string.len() {\n    dfs_path_string.char_indices().nth(index_end_of_match).ok_or_else(...)?.0\n} else {\n    dfs_path_string.len()\n};\n```\n\n`path_consumed` is a byte count over the wire's UTF-16 encoding, so `index_end_of_match` is a UTF-16 *code-unit* index. It is then compared against `dfs_path_string.len()`, which is the *UTF-8 byte length* of a Rust `String`, and finally used as the `n` in `char_indices().nth(n)`, which counts Unicode *scalar values*. For any DFS path containing non-ASCII characters these three units diverge (UTF-8 byte length >= UTF-16 code units >= char count for most non-ASCII text), so the bounds check on line `index_end_of_match > dfs_path_string.len()` can pass while `char_indices().nth(index_end_of_match)` still legitimately returns `None` (mismatched units), producing a spurious `\"DFS path consumed is out of bounds\"` error for otherwise-valid DFS referrals with non-ASCII path components.","fix":"Convert consistently to one unit before comparing/indexing - e.g. re-encode `dfs_path_string` to UTF-16 to compare code-unit counts directly (matching the wire semantics), or track a UTF-16 code-unit index throughout instead of mixing it with `str::len()`/`char_indices()`:\n\n```rust\nlet utf16: Vec<u16> = dfs_path_string.encode_utf16().collect();\nlet index_end_of_match = path_consumed / std::mem::size_of::<u16>();\nif index_end_of_match > utf16.len() {\n    return Err(Error::InvalidMessage(\"DFS path consumed is out of bounds\".to_string()));\n}\nlet suffix_utf16 = &utf16[index_end_of_match..];\nlet suffix = String::from_utf16_lossy(suffix_utf16);\n```","locations":[{"ref":"crates/smb/src/client/smb_client.rs:844-863","code":"  844 |                 let index_end_of_match = path_consumed / std::mem::size_of::<u16>();\n  845 | \n  846 |                 if index_end_of_match > dfs_path_string.len() {\n  847 |                     return Err(Error::InvalidMessage(\n  848 |                         \"DFS path consumed is out of bounds\".to_string(),\n  849 |                     ));\n  850 |                 }\n  851 | \n  852 |                 let suffix = if index_end_of_match < dfs_path_string.len() {\n  853 |                     dfs_path_string\n  854 |                         .char_indices()\n  855 |                         .nth(index_end_of_match)\n  856 |                         .ok_or_else(|| {\n  857 |                             Error::InvalidMessage(\"DFS path consumed is out of bounds\".to_string())\n  858 |                         })?\n  859 |                         .0\n  860 |                 } else {\n  861 |                     // Empty -- exact cover.\n  862 |                     dfs_path_string.len()\n  863 |                 };","lines":20,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/client/smb_client.rs#L844-L863"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Transformer::verify_plain_incoming` only verifies the signature of an incoming message when the server-supplied `message.header.flags.signed()` bit is already set (or the `ksmbd-multichannel-compat` heuristic applies); otherwise it returns `Ok(())` immediately without any verification, and leaves `form.signed = false`:\n```rust\nif form.encrypted\n    || message.header.message_id == u64::MAX\n    || message.header.status == Status::Pending as u32\n    || !(message.header.flags.signed() || self.is_message_signed_ksmbd(message).await)\n{\n    return Ok(());\n}\n```\nThis means the decision of \"does this message need verification\" is derived entirely from a flag the server (or a network attacker able to modify unencrypted traffic) controls, rather than from whether the session/negotiation actually *requires* signing. Within this file there is no cross-check against the negotiated signing requirement, so if higher-level code (outside this audited slice) does not separately enforce `form.signed_or_encrypted()` for sessions that require signing, an attacker who simply clears the `SMB2_FLAGS_SIGNED` bit on an otherwise-tampered response can make the client accept it as if it were legitimate, defeating message signing.","fix":"`transformer.rs` cannot know on its own whether signing is required (that's session state, defined outside this file), but it should surface enough information for callers to enforce this centrally, or take a \"signing required\" input from the caller and fail closed when a message required to be signed is not signed, e.g.:\n```rust\nif requires_signing && !form.signed && !form.encrypted {\n    return Err(crate::Error::TranformFailed(TransformError { .. , why: \"Server response was required to be signed but was not\" }));\n}\n```\nConfirm the required enforcement actually exists in `session.rs`/`msg_handler.rs` call sites; if it relies solely on `form.signed`, an attacker clearing the flag bypasses verification entirely.","locations":[{"ref":"crates/smb/src/connection/transformer.rs:347-390","code":"  347 |     #[maybe_async]\n  348 |     async fn verify_plain_incoming(\n  349 |         &self,\n  350 |         message: &mut PlainResponse,\n  351 |         raw: &IoVec,\n  352 |         form: &mut MessageForm,\n  353 |     ) -> crate::Result<()> {\n  354 |         // Check if signing check is required.\n  355 |         if form.encrypted\n  356 |             || message.header.message_id == u64::MAX\n  357 |             || message.header.status == Status::Pending as u32\n  358 |             || !(message.header.flags.signed() || self.is_message_signed_ksmbd(message).await)\n  359 |         {\n  360 |             return Ok(());\n  361 |         }\n  362 | \n  363 |         // Verify signature (if required, according to the spec)\n  364 |         let session_id = message.header.session_id;\n  365 |         let mut signer = self\n  366 |             ._with_channel(session_id, |session| {\n  367 |                 let channel_info = session\n  368 |                     .channel\n  369 |                     .as_ref()\n  370 |                     .ok_or(crate::Error::TranformFailed(TransformError {\n  371 |                         outgoing: false,\n  372 |                         phase: TransformPhase::SignVerify,\n  373 |                         session_id: Some(session_id),\n  374 |                         why: \"Message is required to be signed, but no channel is set up!\",\n  375 |                         msg_id: Some(message.header.message_id),\n  376 |                     }))?;\n  377 | \n  378 |                 Ok(channel_info.signer()?.clone())\n  379 |             })\n  380 |             .await?;\n  381 | \n  382 |         signer.verify_signature(&mut message.header, raw)?;\n  383 |         log::debug!(\n  384 |             \"Message #{} verified (signature={}).\",\n  385 |             message.header.message_id,\n  386 |             message.header.signature\n  387 |         );\n  388 |         form.signed = true;\n  389 |         Ok(())\n  390 |     }","lines":44,"link":"https://github.com/afiffon/smb-rs/blob/1a2cc44a4c1fffcedf62308cfc2469c45f8a5c6a/crates/smb/src/connection/transformer.rs#L347-L390"}]},
