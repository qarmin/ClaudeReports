<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.sev-info    {background:#0c2a2a;color:#5eead4;border-color:#0f766e}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.easy-badge{background:#052e16;color:#86efac;border-color:#16a34a}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
.quality-panel{margin-bottom:1rem;background:#0c2520;border:1px solid #134e4a;border-radius:8px;overflow:hidden}
.quality-panel summary{list-style:none;display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;font-size:.9rem;font-weight:700;color:#5eead4;cursor:pointer;user-select:none}
.quality-panel summary::-webkit-details-marker{display:none}
.quality-panel summary:hover{background:#0f2d28}
.quality-count{font-size:.75rem;font-weight:400;color:#0f766e;margin-left:.25rem}
.quality-langs{display:flex;gap:.3rem;flex-wrap:wrap;margin-left:auto;align-items:center}
.ql-tag{font-size:.65rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;background:#134e4a;color:#99f6e4;border:1px solid #0f766e}
.quality-body{padding:.5rem .9rem .9rem}
.qi-card{background:#0a1f1c;border:1px solid #134e4a;border-radius:6px;padding:.6rem .8rem;margin-bottom:.5rem}
.qi-card:last-child{margin-bottom:0}
.qi-header{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.3rem}
.qi-title{font-size:.875rem;font-weight:700;color:#f0fdf4;flex:1}
.qi-cat{font-size:.65rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;background:#1e3a5f;color:#93c5fd;border:1px solid #1d4ed8}
.qi-lang{font-size:.65rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;background:#2d1b69;color:#c4b5fd;border:1px solid #7c3aed}
.qi-sev-badge{font-size:.62rem;font-weight:700;padding:.1rem .42rem;border-radius:4px;border:1px solid transparent;letter-spacing:.04em;flex-shrink:0}
.qi-sev-high{background:#431407;color:#fdba74;border-color:#9a3412}
.qi-sev-medium{background:#422006;color:#fcd34d;border-color:#854d0e}
.qi-sev-low{background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.qi-desc{font-size:.82rem;color:#cbd5e1;line-height:1.5;margin:.2rem 0}
.qi-fix{font-size:.82rem;color:#86efac;line-height:1.5;margin:.2rem 0}
.qi-fix-lbl{font-weight:700;color:#4ade80}
.qi-loc-link{color:#38bdf8;text-decoration:none;font-family:monospace}
.qi-loc-link:hover{text-decoration:underline}
</style>
</head>

<script type="application/json" id="D">[{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","easy":true,"description":"handleKeyDown:withKey:... dereferences parent->TopLevelEvents without checking whether parent is nil. When _parent has been cleared (e.g. after the window closes), tryGet() returns nullptr and the dereference crashes.","fix":"Add a nil check: if (parent == nullptr) return false; before accessing parent->TopLevelEvents.","locations":[{"ref":"native/Avalonia.Native/src/OSX/AvnView.mm:644-647","code":"  644 | - (bool) handleKeyDown: (NSTimeInterval) timestamp withKey:(AvnKey)key withPhysicalKey:(AvnPhysicalKey)physicalKey withModifiers:(AvnInputModifiers)modifiers withKeySymbol:(NSString*)keySymbol {\n  645 |     auto parent = _parent.tryGet();\n  646 |     return parent->TopLevelEvents->RawKeyEvent(KeyDown, timestamp, modifiers, key, physicalKey, [keySymbol UTF8String]);\n  647 | }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/AvnView.mm#L644-L647"}]},{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","easy":true,"description":"unmarkText dereferences parent->InputMethod without checking whether parent is nil first. If the window has been closed and _parent cleared, this crashes. The same pattern appears in firstRectForCharacterRange:.","fix":"Check parent != nullptr before accessing parent->InputMethod in both methods.","locations":[{"ref":"native/Avalonia.Native/src/OSX/AvnView.mm:797-802","code":"  797 | - (void)unmarkText\n  798 | {\n  799 |     auto parent = _parent.tryGet();\n  800 |     if(parent->InputMethod->IsActive()){\n  801 |         parent->InputMethod->Client->SetPreeditText(nullptr);\n  802 |     }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/AvnView.mm#L797-L802"},{"ref":"native/Avalonia.Native/src/OSX/AvnView.mm:871-876","code":"  871 | - (NSRect)firstRectForCharacterRange:(NSRange)range actualRange:(NSRangePointer)actualRange\n  872 | {\n  873 |     auto parent = _parent.tryGet();\n  874 |     if(!parent->InputMethod->IsActive()){\n  875 |         return NSZeroRect;\n  876 |     }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/AvnView.mm#L871-L876"}]},{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"high","easy":false,"description":"In SynchronousXEventWaiter.WaitForEvent, when a GenericEvent is stashed and later put back via XPutBackEvent, there is a use-after-free risk. The code calls XGetEventData to fill cookie.data, stashes the event (with data pointer set), calls XPutBackEvent (which copies the struct including the non-null data pointer into the server queue), and only then calls XFreeEventData (which frees the memory and sets the local struct's data pointer to null). The copy already inserted into the Xlib queue by XPutBackEvent retains the now-freed data pointer. When the main event loop later dequeues this event and calls XGetEventData again (X11EventDispatcher.cs:40), the behavior is undefined: Xlib may attempt to reference the stale pointer or double-free it.","fix":"When stashing a GenericEvent, call XFreeEventData immediately after stashing (before putting it back), and clear cookie.data to zero in the local copy before calling XPutBackEvent. This ensures the re-queued event has data=null, so the main loop's XGetEventData will safely re-fetch it.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/SynchronousXEventWaiter.cs:76-96","code":"   76 |                 stashedEvents ??= [];\n   77 |                 stashedEvents.Add(evt);\n   78 |             }\n   79 |         }\n   80 |         finally\n   81 |         {\n   82 |             if (stashedEvents is not null)\n   83 |             {\n   84 |                 foreach (var evt in stashedEvents)\n   85 |                 {\n   86 |                     XPutBackEvent(display, evt);\n   87 | \n   88 |                     if (evt.type == XEventName.GenericEvent)\n   89 |                     {\n   90 |                         unsafe\n   91 |                         {\n   92 |                             if (evt.GenericEventCookie.data != null)\n   93 |                                 XFreeEventData(display, &evt.GenericEventCookie);\n   94 |                         }\n   95 |                     }\n   96 |                 }","lines":21,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/SynchronousXEventWaiter.cs#L76-L96"},{"ref":"src/Avalonia.X11/Dispatching/X11EventDispatcher.cs:39-40","code":"   39 |             if (xev.type == XEventName.GenericEvent)\n   40 |                 XGetEventData(_display, &xev.GenericEventCookie);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Dispatching/X11EventDispatcher.cs#L39-L40"}]},{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"high","easy":false,"description":"AvaloniaInputConnection uses Interlocked operations on _batchLevel but the field is also read with plain field access (IsInBatchEdit, EndBatchEdit). Specifically BeginBatchEdit and EndBatchEdit both do _batchLevel = Interlocked.Increment/Decrement(...), writing the result back via a plain assignment that races with concurrent increments on another thread. The intent was to use the return value of Interlocked.Increment as the new value, but then assigning it back is redundant and racing.","fix":"Remove the plain assignment: just call Interlocked.Increment(ref _batchLevel) without assigning the result, and read _batchLevel with Volatile.Read for IsInBatchEdit, or restrict all batch editing to the UI thread and drop the Interlocked entirely.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Input/AvaloniaInputConnection.cs:99-121","code":"   99 |         public bool BeginBatchEdit()\n  100 |         {\n  101 |             _batchLevel = Interlocked.Increment(ref _batchLevel);\n  102 |             return InputMethod.IsActive;\n  103 |         }\n  104 | \n  105 |         public bool EndBatchEdit()\n  106 |         {\n  107 |             _batchLevel = Interlocked.Decrement(ref _batchLevel);\n  108 | \n  109 |             if (!IsInBatchEdit)\n  110 |             {\n  111 |                 IsInUpdate = true;\n  112 |                 while (_commandQueue.TryDequeue(out var command))\n  113 |                 {\n  114 |                     command.Apply(_editBuffer);\n  115 |                 }\n  116 |                 IsInUpdate = false;\n  117 |             }\n  118 | \n  119 |             UpdateState();\n  120 |             return IsInBatchEdit;\n  121 |         }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/Input/AvaloniaInputConnection.cs#L99-L121"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"TISCopyCurrentKeyboardInputSource returns a retained object that must be released with CFRelease, but CharsFromScanCode (called from both VirtualKeyFromScanCode and KeySymbolFromScanCode) never releases it. Every key event leaks one Core Foundation object.","fix":"Add CFRelease(currentKeyboard) before each return path in CharsFromScanCode.","locations":[{"ref":"native/Avalonia.Native/src/OSX/KeyTransform.mm:408-466","code":"  408 |     auto currentKeyboard = TISCopyCurrentKeyboardInputSource();\n  409 |     if (!currentKeyboard)\n  410 |         return 0;\n  411 | \n  412 |     auto layoutData = static_cast<CFDataRef>(TISGetInputSourceProperty(currentKeyboard, kTISPropertyUnicodeKeyLayoutData));\n  413 |     if (!layoutData)\n  414 |         return 0;\n  415 | \n  416 |     auto* keyboardLayout = reinterpret_cast<const UCKeyboardLayout*>(CFDataGetBytePtr(layoutData));\n  417 | \n  418 |     UInt32 deadKeyState = 0;\n  419 |     UniCharCount length = 0;\n  420 |     \n  421 |     int glyphModifiers = 0;\n  422 |     if (modifierFlags & NSEventModifierFlagShift)\n  423 |         glyphModifiers |= shiftKey;\n  424 |     if (modifierFlags & NSEventModifierFlagCapsLock)\n  425 |         glyphModifiers |= alphaLock;\n  426 |     if (modifierFlags & NSEventModifierFlagOption)\n  427 |         glyphModifiers |= optionKey;\n  428 | \n  429 |     auto result = UCKeyTranslate(\n  430 |         keyboardLayout,\n  431 |         scanCode,\n  432 |         keyAction,\n  433 |         (glyphModifiers >> 8) & 0xFF,\n  434 |         LMGetKbdType(),\n  435 |         kUCKeyTranslateNoDeadKeysBit,\n  436 |         &deadKeyState,\n  437 |         bufferSize,\n  438 |         &length,\n  439 |         buffer);\n  440 | \n  441 |     if (result != noErr)\n  442 |         return 0;\n  443 | \n  444 |     if (deadKeyState)\n  445 |     {\n  446 |         // translate a space with dead key state to get the dead key itself\n  447 |         result = UCKeyTranslate(\n  448 |             keyboardLayout,\n  449 |             kVK_Space,\n  450 |             keyAction,\n  451 |             0,\n  452 |             LMGetKbdType(),\n  453 |             kUCKeyTranslateNoDeadKeysBit,\n  454 |             &deadKeyState,\n  455 |             bufferSize,\n  456 |             &length,\n  457 |             buffer);\n  458 | \n  459 |         if (result != noErr)\n  460 |             return 0;\n  461 |     }\n  462 | \n  463 |     if (length == 1 && buffer[0] <= 0x7F && !IsAllowedAsciiChar(buffer[0]))\n  464 |         return 0;\n  465 | \n  466 |     return length;","lines":59,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/KeyTransform.mm#L408-L466"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"PlatformRenderTimer creates a CVDisplayLinkRef in RegisterTick but has no destructor and never calls CVDisplayLinkRelease. When the object is destroyed (ref count reaches zero) the display link is leaked along with any internal CoreVideo resources.","fix":"Add a destructor that calls CVDisplayLinkStop if running and then CVDisplayLinkRelease(_displayLink).","locations":[{"ref":"native/Avalonia.Native/src/OSX/PlatformRenderTimer.mm:3-85","code":"    3 | class PlatformRenderTimer : public ComSingleObject<IAvnPlatformRenderTimer, &IID_IAvnPlatformRenderTimer>\n    4 | {\n    5 | private:\n    6 |     ComPtr<IAvnActionCallback> _callback;\n    7 |     CVDisplayLinkRef _displayLink;\n    8 | \n    9 | public:\n   10 |     FORWARD_IUNKNOWN()\n   11 |     virtual int RegisterTick (\n   12 |         IAvnActionCallback* callback) override\n   13 |     {\n   14 |         START_COM_CALL;\n   15 |         \n   16 |         @autoreleasepool\n   17 |         {\n   18 |             if (_displayLink != nil)\n   19 |             {\n   20 |                 return E_UNEXPECTED;\n   21 |             }\n   22 | \n   23 |             _callback = callback;\n   24 |             auto result = CVDisplayLinkCreateWithActiveCGDisplays(&_displayLink);\n   25 |             if (result != 0)\n   26 |             {\n   27 |                 return result;\n   28 |             }\n   29 | \n   30 |             result = CVDisplayLinkSetOutputCallback(_displayLink, OnTick, this);\n   31 |             if (result != 0)\n   32 |             {\n   33 |                 return result;\n   34 |             }\n   35 |         }\n   36 |         return S_OK;\n   37 |     }\n   38 | \n   39 |     virtual void Start () override\n   40 |     {\n   41 |         START_COM_CALL;\n   42 | \n   43 |         @autoreleasepool\n   44 |         {\n   45 |             if (CVDisplayLinkIsRunning(_displayLink) == false) {\n   46 |                 CVDisplayLinkStart(_displayLink);\n   47 |             }\n   48 |         }\n   49 |     }\n   50 | \n   51 |     virtual void Stop () override\n   52 |     {\n   53 |         START_COM_CALL;\n   54 | \n   55 |         @autoreleasepool\n   56 |         {\n   57 |             if (CVDisplayLinkIsRunning(_displayLink) == true) {\n   58 |                 CVDisplayLinkStop(_displayLink);\n   59 |             }\n   60 |         }\n   61 |     }\n   62 | \n   63 |     virtual bool RunsInBackground () override\n   64 |     {\n   65 |         START_COM_CALL;\n   66 | \n   67 |         @autoreleasepool\n   68 |         {\n   69 |             return true;\n   70 |         }\n   71 |     }\n   72 |     \n   73 |     static CVReturn OnTick(CVDisplayLinkRef displayLink, const CVTimeStamp *inNow, const CVTimeStamp *inOutputTime, CVOptionFlags flagsIn, CVOptionFlags *flagsOut, void *displayLinkContext)\n   74 |     {\n   75 |         START_ARP_CALL;\n   76 |         PlatformRenderTimer *object = (PlatformRenderTimer *)displayLinkContext;\n   77 |         object->_callback->Run();\n   78 |         return kCVReturnSuccess;\n   79 |     }\n   80 | };\n   81 | \n   82 | extern IAvnPlatformRenderTimer* CreatePlatformRenderTimer()\n   83 | {\n   84 |     return new PlatformRenderTimer();\n   85 | }","lines":83,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/PlatformRenderTimer.mm#L3-L85"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"Screens registers a CGDisplayReconfigurationCallback with a raw this pointer in its constructor but never calls CGDisplayRemoveReconfigurationCallback in a destructor. When the object is destroyed, macOS calls back into freed memory.","fix":"Add a destructor that calls CGDisplayRemoveReconfigurationCallback(CGDisplayReconfigurationCallBack, this).","locations":[{"ref":"native/Avalonia.Native/src/OSX/Screens.mm:12-13","code":"   12 |         _events = events;\n   13 |         CGDisplayRegisterReconfigurationCallback(CGDisplayReconfigurationCallBack, this);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/Screens.mm#L12-L13"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"NodeInfoProvider<T> subscribes to peer.PropertyChanged in its constructor but never unsubscribes. AutomationPeer peers are managed by AvaloniaAccessHelper which itself is recreated on every OnAttachedToWindow() call. The old NodeInfoProvider instances keep their PropertyChanged subscriptions alive, preventing old peer objects from being GC'd for the lifetime of the new peers that hold indirect references through event chains.","fix":"Implement IDisposable on NodeInfoProvider<T> and unsubscribe from peer.PropertyChanged in Dispose(). Dispose old NodeInfoProvider instances when AvaloniaAccessHelper is detached.","locations":[{"ref":"src/Android/Avalonia.Android/Automation/NodeInfoProvider.cs:26-27","code":"   26 |             _peer.PropertyChanged += PeerPropertyChanged;\n   27 |         }","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Automation/NodeInfoProvider.cs#L26-L27"},{"ref":"src/Android/Avalonia.Android/AvaloniaAccessHelper.cs:66-83","code":"   66 |                 peer.ChildrenChanged += (s, ev) => InvalidateVirtualView(peerViewId,\n   67 |                     AccessibilityEventCompat.ContentChangeTypeSubtree);\n   68 |                 peer.PropertyChanged += (s, ev) =>\n   69 |                 {\n   70 |                     if (ev.Property == AutomationElementIdentifiers.NameProperty)\n   71 |                     {\n   72 |                         InvalidateVirtualView(peerViewId, AccessibilityEventCompat.ContentChangeTypeText);\n   73 |                     }\n   74 |                     else if (ev.Property == AutomationElementIdentifiers.HelpTextProperty)\n   75 |                     {\n   76 |                         InvalidateVirtualView(peerViewId, AccessibilityEventCompat.ContentChangeTypeContentDescription);\n   77 |                     }\n   78 |                     else if (ev.Property == AutomationElementIdentifiers.BoundingRectangleProperty || \n   79 |                         ev.Property == AutomationElementIdentifiers.ClassNameProperty)\n   80 |                     {\n   81 |                         InvalidateVirtualView(peerViewId);\n   82 |                     }\n   83 |                 };","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/AvaloniaAccessHelper.cs#L66-L83"}]},{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"ChoreographerTimer allocates a GCHandle (_timerHandle) via GCHandle.Alloc(this) but never frees it. ChoreographerTimer implements no IDisposable and the handle is never passed to GCHandle.Free(), so the timer object and everything it roots (the two background threads, the AutoResetEvent, the HashSet of views) is permanently pinned in the GC.","fix":"Implement IDisposable; in Dispose() call GCHandle.Free(_timerHandle) and signal the background threads to exit.","locations":[{"ref":"src/Android/Avalonia.Android/ChoreographerTimer.cs:19-27","code":"   19 |         private readonly GCHandle _timerHandle;\n   20 |         private readonly HashSet<AvaloniaView> _views = new();\n   21 |         private Action<TimeSpan>? _tick;\n   22 |         private bool _pendingCallback;\n   23 |         private long _lastTime;\n   24 | \n   25 |         public ChoreographerTimer()\n   26 |         {\n   27 |             _timerHandle = GCHandle.Alloc(this);","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/ChoreographerTimer.cs#L19-L27"},{"ref":"src/Android/Avalonia.Android/ChoreographerTimer.cs:69-73","code":"   69 |         private void Loop()\n   70 |         {\n   71 |             Looper.Prepare();\n   72 |             _choreographer.SetResult(AChoreographer_getInstance());\n   73 |             Looper.Loop();","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/ChoreographerTimer.cs#L69-L73"}]},{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"In PushOpacity() when useOpacitySaveLayer is true, new SKPaint objects are heap-allocated on lines 730 and 734 and passed directly to Canvas.SaveLayer(). SKCanvas does not take ownership and does not dispose them. Skia's managed wrapper finalizer will eventually collect them, but there is no deterministic disposal, and every push in a busy rendering loop leaks one SKPaint from the pool.","fix":"Use SKPaintCache.Shared.Get() / ReturnReset() for the opacity paint, matching the pattern used elsewhere in DrawingContextImpl. Dispose the paint (return it to the cache) immediately after the SaveLayer call.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:727-735","code":"  727 |                 if (bounds.HasValue)\n  728 |                 {\n  729 |                     var rect = bounds.Value.ToSKRect();\n  730 |                     Canvas.SaveLayer(rect, new SKPaint { ColorF = new SKColorF(0, 0, 0, (float)opacity) });\n  731 |                 }\n  732 |                 else\n  733 |                 {\n  734 |                     Canvas.SaveLayer(new SKPaint { ColorF = new SKColorF(0, 0, 0, (float)opacity) });\n  735 |                 }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L727-L735"}]},{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"FontManagerImpl.GetInstalledFontFamilyNames() replaces _skFontManager with a new SKFontManager.CreateDefault() instance when checkForUpdates is true, without disposing the old one. SKFontManager holds native resources and each leaked instance permanently grows native memory.","fix":"Dispose the old manager before replacing it: var old = _skFontManager; _skFontManager = SKFontManager.CreateDefault(); old.Dispose();","locations":[{"ref":"src/Skia/Avalonia.Skia/FontManagerImpl.cs:26-29","code":"   26 |             if (checkForUpdates)\n   27 |             {\n   28 |                 _skFontManager = SKFontManager.CreateDefault();\n   29 |             }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/FontManagerImpl.cs#L26-L29"}]},{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"VulkanSkiaGpu.Dispose() disposes the Vulkan context but never calls GrContext.AbandonContext() nor GrContext.Dispose(). The GRContext (and its GPU resource cache) is leaked on every Vulkan context teardown. Compare with GlSkiaGpu.Dispose() which correctly calls AbandonContext(true) then Dispose().","fix":"Add GrContext.AbandonContext(true); GrContext.Dispose(); before Vulkan.Dispose(), mirroring the GL backend.","locations":[{"ref":"src/Skia/Avalonia.Skia/Gpu/Vulkan/VulkanSkiaGpu.cs:64-67","code":"   64 |     public void Dispose()\n   65 |     {\n   66 |         Vulkan.Dispose();\n   67 |     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/Gpu/Vulkan/VulkanSkiaGpu.cs#L64-L67"}]},{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"SkiaTypeface.TryGetStream() calls SKTypeface.OpenStream() which returns a SKStreamAsset (an SKObject). The asset is never disposed - only the buffer bytes are copied into a MemoryStream and the asset is abandoned. Every call to TryGetStream() leaks the underlying Skia stream object.","fix":"Wrap the asset in a using statement: using var asset = SKTypeface.OpenStream();","locations":[{"ref":"src/Skia/Avalonia.Skia/SkiaTypeface.cs:60-68","code":"   60 |                 var asset = SKTypeface.OpenStream();\n   61 |                 var size = asset.Length;\n   62 |                 var buffer = new byte[size];\n   63 | \n   64 |                 asset.Read(buffer, size);\n   65 | \n   66 |                 stream = new MemoryStream(buffer);\n   67 | \n   68 |                 return true;","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/SkiaTypeface.cs#L60-L68"}]},{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"GetCompositionString calls ImmGetContext(Hwnd) but never calls ImmReleaseContext, leaking the IMM context handle on every call. Every composing keystroke calls this method, so the leak is continuous during active IME sessions.","fix":"Wrap the body of GetCompositionString in a try/finally: acquire himc with ImmGetContext, call ImmGetCompositionString in the try, and call ImmReleaseContext in the finally.","locations":[{"ref":"src/Windows/Avalonia.Win32/Input/Imm32InputMethod.cs:288-298","code":"  288 |         public string? GetCompositionString(GCS flag)\n  289 |         {\n  290 |             if (!IsComposing)\n  291 |             {\n  292 |                 return null;\n  293 |             }\n  294 | \n  295 |             var himc = ImmGetContext(Hwnd);\n  296 | \n  297 |             return ImmGetCompositionString(himc, flag);\n  298 |         }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/Input/Imm32InputMethod.cs#L288-L298"}]},{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"In ReadDataFromGdi and ReadDataFromHGlobal (CF_DIB path) and WriteDataToGdi, device contexts created with CreateCompatibleDC are freed with ReleaseDC instead of DeleteDC. ReleaseDC is only valid for DCs obtained from GetDC/GetWindowDC. Calling ReleaseDC on a compatible DC has no effect and leaks the GDI handle.","fix":"Replace all ReleaseDC calls on DCs created via CreateCompatibleDC with DeleteDC. Only the DCs obtained from GetDC(IntPtr.Zero) should use ReleaseDC.","locations":[{"ref":"src/Windows/Avalonia.Win32/OleDataObjectHelper.cs:158-167","code":"  158 |                     ReleaseDC(IntPtr.Zero, sourceHdc);\n  159 | \n  160 |                 if (srcCompatHdc != IntPtr.Zero)\n  161 |                     ReleaseDC(IntPtr.Zero, srcCompatHdc);\n  162 | \n  163 |                 if (compatDc != IntPtr.Zero)\n  164 |                     ReleaseDC(IntPtr.Zero, compatDc);\n  165 | \n  166 |                 if (destHdc != IntPtr.Zero)\n  167 |                     ReleaseDC(IntPtr.Zero, destHdc);","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OleDataObjectHelper.cs#L158-L167"},{"ref":"src/Windows/Avalonia.Win32/OleDataObjectHelper.cs:250-258","code":"  250 |                     {\n  251 |                         if (section != IntPtr.Zero)\n  252 |                             DeleteObject(section);\n  253 | \n  254 |                         if (compatDc != IntPtr.Zero)\n  255 |                             ReleaseDC(IntPtr.Zero, compatDc);\n  256 | \n  257 |                         if (hdc != IntPtr.Zero)\n  258 |                             ReleaseDC(IntPtr.Zero, hdc);","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OleDataObjectHelper.cs#L250-L258"},{"ref":"src/Windows/Avalonia.Win32/OleDataObjectHelper.cs:591-602","code":"  591 |                     {\n  592 |                         SelectObject(compatDc, IntPtr.Zero);\n  593 |                         SelectObject(desDc, IntPtr.Zero);\n  594 | \n  595 |                         if (desDc != IntPtr.Zero)\n  596 |                             ReleaseDC(IntPtr.Zero, desDc);\n  597 | \n  598 |                         if (compatDc != IntPtr.Zero)\n  599 |                             ReleaseDC(IntPtr.Zero, compatDc);\n  600 | \n  601 |                         if (hdc != IntPtr.Zero)\n  602 |                             ReleaseDC(IntPtr.Zero, hdc);","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OleDataObjectHelper.cs#L591-L602"}]},{"id":"MEM_12","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"In WriteDataToGdi the DIB section created by CreateDIBSection (stored in 'section') is never deleted in the finally block. On all code paths - success, BitBlt failure, or early DV_E_FORMATETC return - the finally block deselects section from compatDc but never calls DeleteObject(section), leaking the GDI bitmap handle.","fix":"Add 'if (section != IntPtr.Zero) DeleteObject(section);' to the finally block on line ~592, after the SelectObject(compatDc, IntPtr.Zero) call.","locations":[{"ref":"src/Windows/Avalonia.Win32/OleDataObjectHelper.cs:567-603","code":"  567 |                         section = CreateDIBSection(compatDc, bitmapInfoHeader, 0, out var lbBits, IntPtr.Zero, 0);\n  568 |                         if (section == IntPtr.Zero)\n  569 |                             return DV_E_FORMATETC;\n  570 | \n  571 |                         SelectObject(compatDc, section);\n  572 | \n  573 |                         Marshal.Copy(buffer, 0, lbBits, buffer.Length);\n  574 | \n  575 |                         hbitmap = CreateCompatibleBitmap(desDc, pixelSize.Width, pixelSize.Height);\n  576 | \n  577 |                         SelectObject(desDc, hbitmap);\n  578 | \n  579 |                         if (!BitBlt(desDc, 0, 0, pixelSize.Width, pixelSize.Height, compatDc, 0, 0, SRCCOPY))\n  580 |                         {\n  581 |                             return DV_E_FORMATETC;\n  582 |                         }\n  583 | \n  584 |                         hGlobalBitmap = hbitmap;\n  585 | \n  586 |                         GdiFlush();\n  587 | \n  588 |                         return (uint)HRESULT.S_OK;\n  589 |                     }\n  590 |                     finally\n  591 |                     {\n  592 |                         SelectObject(compatDc, IntPtr.Zero);\n  593 |                         SelectObject(desDc, IntPtr.Zero);\n  594 | \n  595 |                         if (desDc != IntPtr.Zero)\n  596 |                             ReleaseDC(IntPtr.Zero, desDc);\n  597 | \n  598 |                         if (compatDc != IntPtr.Zero)\n  599 |                             ReleaseDC(IntPtr.Zero, compatDc);\n  600 | \n  601 |                         if (hdc != IntPtr.Zero)\n  602 |                             ReleaseDC(IntPtr.Zero, hdc);\n  603 |                     }","lines":37,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OleDataObjectHelper.cs#L567-L603"}]},{"id":"MEM_13","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"AngleExternalObjectsFeature.Dispose() releases _device but never releases _device1.\n_device1 is a QueryInterface result (a new COM reference) stored in a field, so it\nholds an AddRef'd reference to the underlying ID3D11Device1 COM object. Forgetting\nto Dispose it leaks that COM reference until GC collects it (non-deterministic).","fix":"Add `_device1.Dispose();` before `_device.Dispose();` in the Dispose() method.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/Angle/AngleExternalObjectsFeature.cs:105-108","code":"  105 |     public void Dispose()\n  106 |     {\n  107 |         _device.Dispose();\n  108 |     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OpenGl/Angle/AngleExternalObjectsFeature.cs#L105-L108"}]},{"id":"MEM_14","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"SwapChainGlRenderTarget.Dispose() calls base.Dispose(), disposes _surface and\n_renderTexture, but does NOT dispose the contextLock if BeginDrawCore is currently\nin flight and the context was made current. More concretely: when SwapChainGlSurface\nitself is disposed via DisposeSwapChain(), all render targets become orphaned and\ntheir underlying EGL surfaces / textures won't be released if Dispose() is called\nwhile no draw is active. The Dispose method disposes _surface and _renderTexture\nwithout first ensuring the context is current, which means the EGL surface backing\n_surface may not be fully cleaned up by the EGL driver. The EglSurface.Dispose() is\nsafe to call without current context since it calls eglDestroySurface, but the OpenGL\ntexture created by eglBindTexImage (in AngleExternalMemoryD3D11Texture2D) is not\ndeleted in this path.","fix":"In SwapChainGlRenderTarget.Dispose(), make the context current before disposing\n_surface and _renderTexture so the EGL driver can properly release any bound\ntextures. Call `using (Context.EnsureCurrent()) { _surface?.Dispose(); _renderTexture?.Dispose(); }`.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/Angle/SwapChainGlSurface.cs:246-251","code":"  246 |     public override void Dispose()\n  247 |     {\n  248 |         base.Dispose();\n  249 |         _surface?.Dispose();\n  250 |         _renderTexture?.Dispose();\n  251 |     }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OpenGl/Angle/SwapChainGlSurface.cs#L246-L251"}]},{"id":"MEM_15","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"In WglDisplay.CreateContext(), when no GL version succeeds (the foreach loop falls\nthrough without returning), the code calls WglGdiResourceManager.ReleaseDC and\nDestroyWindow at lines 161-162. However if the loop throws (e.g. the debug callback\ninstallation path throws via WglRestoreContext when context == 0), the HDC and HWND\nare leaked because the cleanup at lines 161-162 is only reached on normal exit from\nthe loop, not on exception. There is no try/finally guarding the window/dc cleanup.","fix":"Wrap the dc/window acquisition and the loop in a try/finally that always releases\ndc and destroys window if the method is about to exit without having returned a valid\nWglContext.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/WglDisplay.cs:119-164","code":"  119 |                 var window = WglGdiResourceManager.CreateOffscreenWindow();\n  120 |                 var dc = WglGdiResourceManager.GetDC(window);\n  121 |                 SetPixelFormat(dc, _defaultPixelFormat, ref _defaultPfd);\n  122 |                 foreach (var version in versions)\n  123 |                 {\n  124 |                     if(version.Type != GlProfileType.OpenGL)\n  125 |                         continue;\n  126 |                     IntPtr context;\n  127 |                     using (shareContext?.Lock())\n  128 |                     {\n  129 |                         var profileMask = WGL_CONTEXT_CORE_PROFILE_BIT_ARB;\n  130 |                         if (version.IsCompatibilityProfile &&\n  131 |                             (version.Major > 3 || version.Major == 3 && version.Minor >= 2))\n  132 |                             profileMask = WGL_CONTEXT_COMPATIBILITY_PROFILE_BIT_ARB;\n  133 | \n  134 |                         context = s_wglCreateContextAttribsArb(dc, shareContext?.Handle ?? IntPtr.Zero,\n  135 |                             new[]\n  136 |                             {\n  137 |                                 // major\n  138 |                                 WGL_CONTEXT_MAJOR_VERSION_ARB, version.Major,\n  139 |                                 // minor\n  140 |                                 WGL_CONTEXT_MINOR_VERSION_ARB, version.Minor,\n  141 |                                 // core or compatibility profile\n  142 |                                 WGL_CONTEXT_PROFILE_MASK_ARB, profileMask,\n  143 |                                 // debug \n  144 |                                 // WGL_CONTEXT_FLAGS_ARB, 1,\n  145 |                                 // end\n  146 |                                 0, 0\n  147 |                             });\n  148 |                     }\n  149 | \n  150 |                     if (s_glDebugMessageCallback is not null)\n  151 |                     {\n  152 |                         using (new WglRestoreContext(dc, context, null))\n  153 |                             s_glDebugMessageCallback(Marshal.GetFunctionPointerForDelegate(_debugCallback), IntPtr.Zero);\n  154 |                     }\n  155 | \n  156 |                     if (context != IntPtr.Zero)\n  157 |                         return new WglContext(shareContext, version, context, window, dc,\n  158 |                             _defaultPixelFormat, _defaultPfd);\n  159 |                 }\n  160 | \n  161 |                 WglGdiResourceManager.ReleaseDC(window, dc);\n  162 |                 WglGdiResourceManager.DestroyWindow(window);\n  163 |                 return null;\n  164 |             }","lines":46,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OpenGl/WglDisplay.cs#L119-L164"}]},{"id":"MEM_16","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"In WinUiCompositionUtils.GetParameterSource(), two COM objects are created\n(backDropParameter and backdropString HString) but neither is disposed before the\nmethod returns. The method returns backDropParameterAsSource (a QueryInterface result)\nand exposes handle as an out parameter, but the intermediate backDropParameter\n(ICompositionEffectSourceParameter) and the backdropString (HStringInterop) allocated\non the stack are leaked because HStringInterop is not in a using block and\nbackDropParameter is not disposed. The caller only has access to the derived\nIGraphicsEffectSource, so the original ICompositionEffectSourceParameter reference\ncount stays elevated permanently.","fix":"Wrap backdropString and backDropParameter in using statements inside GetParameterSource.\nNote that handle is returned to the caller so the HString lifetime must be managed by\nthe caller; the cleanest fix is to return an HStringInterop (IDisposable) and let the\ncaller own the lifetime rather than exposing a raw IntPtr handle.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionUtils.cs:167-176","code":"  167 |     private static IGraphicsEffectSource GetParameterSource(string name,\n  168 |         ICompositionEffectSourceParameterFactory backDropParameterFactory, out IntPtr handle)\n  169 |     {\n  170 |         var backdropString = new HStringInterop(name);\n  171 |         var backDropParameter =\n  172 |             backDropParameterFactory.Create(backdropString.Handle);\n  173 |         var backDropParameterAsSource = backDropParameter.QueryInterface<IGraphicsEffectSource>();\n  174 |         handle = backdropString.Handle;\n  175 |         return backDropParameterAsSource;\n  176 |     }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionUtils.cs#L167-L176"}]},{"id":"MEM_17","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"`IOSLauncher.LaunchFileAsync` creates a `UIDocumentInteractionController` on the\nstack (local variable `documentController`, line 32) and immediately calls\n`PresentPreview(animated: true)`. The preview sheet is asynchronous - the user\ninteracts with it over time - but the `documentController` object is not retained\nanywhere after the method returns. In Xamarin.iOS / .NET for iOS, native objects\nwrapped by managed wrappers are released when the managed wrapper is GC'd; once\n`LaunchFileAsync` returns the wrapper becomes unreachable. The native\n`UIDocumentInteractionController` may be deallocated while the preview sheet is\nstill visible, causing a crash or a blank/broken preview UI.","fix":"Store `documentController` in a field on `IOSLauncher` (or use a static variable) until the interaction is complete. Implement `UIDocumentInteractionControllerDelegate.DidEndSendingToApplication` / `DidDismissOpenInMenu` to know when it is safe to release the controller.","locations":[{"ref":"src/iOS/Avalonia.iOS/IOSLauncher.cs:32-39","code":"   32 |             var documentController = new UIDocumentInteractionController()\n   33 |             {\n   34 |                 Name = storageItem.Name,\n   35 |                 Url = uri\n   36 |             };\n   37 | \n   38 |             var result = documentController.PresentPreview(true);\n   39 |             return Task.FromResult(result);","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/IOSLauncher.cs#L32-L39"}]},{"id":"MEM_18","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"PlatformSettings::RegisterColorsChange stores the observer object in a plain ivar (observer), so there is no KVO removeObserver call at object destruction time. When PlatformSettings is destroyed, the observer remains registered against NSApplication and will call back into freed memory.","fix":"Add a destructor to PlatformSettings that calls [[NSApplication sharedApplication] removeObserver:observer forKeyPath:@\"effectiveAppearance\"].","locations":[{"ref":"native/Avalonia.Native/src/OSX/PlatformSettings.mm:53-58","code":"   53 |     virtual void RegisterColorsChange(IAvnActionCallback *callback) override\n   54 |     {\n   55 |         if (@available(macOS 10.14, *))\n   56 |         {\n   57 |             observer = [[CocoaThemeObserver alloc] initWithCallback: callback];\n   58 |             [[NSApplication sharedApplication] addObserver:observer forKeyPath:@\"effectiveAppearance\" options:NSKeyValueObservingOptionNew context:nil];","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/PlatformSettings.mm#L53-L58"}]},{"id":"MEM_19","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In app.mm, CreateAvnStringArray returns a newly allocated ComObject with ref count 1. The result is passed directly to FilesOpened / UrlsOpened without wrapping in a ComPtr or releasing afterward. The COM object is leaked unless the callee takes ownership and releases it.","fix":"Wrap the result in a ComPtr<IAvnStringArray> so it is released when the call returns, or ensure the callee documents that it takes ownership and releases the object.","locations":[{"ref":"native/Avalonia.Native/src/OSX/app.mm:74-76","code":"   74 |     auto array = CreateAvnStringArray(filenames);\n   75 |     \n   76 |     _events->FilesOpened(array);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/app.mm#L74-L76"},{"ref":"native/Avalonia.Native/src/OSX/app.mm:81-83","code":"   81 |     auto array = CreateAvnStringArray(urls);\n   82 |     \n   83 |     _events->UrlsOpened(array);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/app.mm#L81-L83"}]},{"id":"MEM_20","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"AvnGlDisplay opens /System/Library/Frameworks/OpenGL.framework/Versions/A/Libraries/libGL.dylib via dlopen in its constructor but never calls dlclose in any destructor. The library handle _libgl is leaked for the lifetime of the process. Additionally, GetProcAddress calls dlsym(_libgl, proc) without checking that _libgl is non-null (dlopen can return null if the path does not exist), which would cause a crash on systems where the path is absent.","fix":"Add a destructor to AvnGlDisplay that calls dlclose(_libgl) if _libgl != nullptr. Add a null check for _libgl before calling dlsym.","locations":[{"ref":"native/Avalonia.Native/src/OSX/cgl.mm:173-185","code":"  173 |     void* _libgl;\n  174 |     \n  175 | public:\n  176 |     FORWARD_IUNKNOWN()\n  177 |     \n  178 |     AvnGlDisplay()\n  179 |     {\n  180 |         _libgl = dlopen(\"/System/Library/Frameworks/OpenGL.framework/Versions/A/Libraries/libGL.dylib\", RTLD_LAZY);\n  181 |     }\n  182 |     \n  183 |     virtual void* GetProcAddress(char* proc)  override\n  184 |     {\n  185 |         return dlsym(_libgl, proc);","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/cgl.mm#L173-L185"}]},{"id":"MEM_21","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"WaylandDataOffer.Dispose calls _offer.Destroy() but not _offer.Dispose(). This mirrors the DataSource issue: the NWayland WlDataOffer proxy is a managed object wrapping a native resource; Destroy sends the protocol destructor but the managed wrapper is not freed.","fix":"After _offer.Destroy(), call _offer.Dispose() to release the managed wrapper.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataOffer.cs:95-98","code":"   95 |     public void Dispose()\n   96 |     {\n   97 |         _offer.Destroy();\n   98 |     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataOffer.cs#L95-L98"}]},{"id":"MEM_22","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"WaylandDataSource.Dispose only calls _source.Destroy() but never _source.Dispose(). The WlDataSource object is a native proxy that wraps a C pointer; calling Destroy() sends the wl_data_source.destroy request to the compositor but the managed wrapper (_source) remains un-disposed, leaking the managed handle and potentially the underlying libwayland client allocation.","fix":"After calling _source.Destroy(), also call _source.Dispose() to release the managed NWayland proxy wrapper.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataSource.cs:68-75","code":"   68 |     public void Dispose()\n   69 |     {\n   70 |         if (!_destroyed)\n   71 |         {\n   72 |             _destroyed = true;\n   73 |             _source.Destroy();\n   74 |         }\n   75 |     }","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataSource.cs#L68-L75"}]},{"id":"MEM_23","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In GlxDisplay constructor (lines 83-84), two PBuffers are created via Glx.CreatePbuffer but their return values are immediately discarded. These PBuffer handles are never stored and therefore never destroyed with Glx.DestroyPbuffer. This leaks two GLX PBuffers for the lifetime of the GlxDisplay object. The intent is unclear; this may be leftover debug code or an attempt to warm up the GLX driver.","fix":"Either remove these two calls entirely (they serve no documented purpose), or if they are needed for driver warm-up, store and destroy the returned handles in the GlxDisplay destructor.","locations":[{"ref":"src/Avalonia.X11/Glx/GlxDisplay.cs:83-84","code":"   83 |             Glx.CreatePbuffer(_x11.DeferredDisplay, _fbconfig, attributes);\n   84 |             Glx.CreatePbuffer(_x11.DeferredDisplay, _fbconfig, attributes);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Glx/GlxDisplay.cs#L83-L84"}]},{"id":"MEM_24","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"In GetNullCursor (X11CursorFactory.cs), an X11 Pixmap is created with XCreateBitmapFromData and passed to XCreatePixmapCursor, but the Pixmap is never freed with XFreePixmap. Per the X11 documentation, XCreatePixmapCursor does NOT take ownership of the source/mask pixmaps; they must be freed by the caller. The pixmap leaks for the lifetime of the application.","fix":"After XCreatePixmapCursor, call XLib.XFreePixmap(display, pixmap) to release the bitmap pixmap.","locations":[{"ref":"src/Avalonia.X11/X11CursorFactory.cs:91-96","code":"   91 |         private static IntPtr GetNullCursor(IntPtr display)\n   92 |         {\n   93 |             XColor color = new XColor();\n   94 |             IntPtr window = XLib.XRootWindow(display, 0);\n   95 |             IntPtr pixmap = XLib.XCreateBitmapFromData(display, window, NullCursorData, 1, 1);\n   96 |             return XLib.XCreatePixmapCursor(display, pixmap, pixmap, ref color, ref color, 0, 0);","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11CursorFactory.cs#L91-L96"}]},{"id":"MEM_25","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"X11Window creates a colormap with XCreateColormap (line 152) that is never freed. The handle is stored only in the local 'attr' struct and discarded after XCreateWindow. This leaks one X11 colormap per window that uses a non-default visual (GLX, EGL, or transparent). For applications that create and destroy many windows (e.g., dialogs), these colormaps accumulate until the display connection is closed.","fix":"Store the created colormap in a private field (e.g., '_colormap') and call XFreeColormap(_x11.Display, _colormap) in the Cleanup method after XDestroyWindow, but only when _colormap != IntPtr.Zero.","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:152","code":"  152 |                 attr.colormap = XCreateColormap(_x11.Display, _x11.RootWindow, visualInfo.Value.visual, 0);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11Window.cs#L152"},{"ref":"src/Avalonia.X11/X11Window.cs:1110-1191","code":" 1110 |         private void Cleanup(bool fromDestroyNotification)\n 1111 |         {\n 1112 |             // Prevent reentrancy\n 1113 |             if(_cleaningUp)\n 1114 |                 return;\n 1115 |             _cleaningUp = true;\n 1116 |             \n 1117 |             // Remove from AT-SPI tree before closing\n 1118 |             _platform.UntrackWindow(this);\n 1119 |             if (_platform.AtSpiServer is { } atSpiServer\n 1120 |                 && _inputRoot?.FocusRoot is Control atSpiControl)\n 1121 |             {\n 1122 |                 var atSpiPeer = atSpiControl.GetAutomationPeer()?.GetAutomationRoot()\n 1123 |                     ?? atSpiControl.GetAutomationPeer();\n 1124 |                 if (atSpiPeer is not null)\n 1125 |                     atSpiServer.RemoveWindow(atSpiPeer);\n 1126 |             }\n 1127 | \n 1128 |             // Before doing anything else notify the TopLevel that ITopLevelImpl is no longer valid\n 1129 |             if (_handle != IntPtr.Zero)\n 1130 |                 Closed?.Invoke();\n 1131 |             \n 1132 |             if (_nativeMenuExporter is IDisposable disposable)\n 1133 |                 disposable.Dispose();\n 1134 |             \n 1135 |             if (_rawEventGrouper != null)\n 1136 |             {\n 1137 |                 _rawEventGrouper.Dispose();\n 1138 |                 _rawEventGrouper = null;\n 1139 |             }\n 1140 |             \n 1141 |             if (_activationTracker != null)\n 1142 |             {\n 1143 |                 _activationTracker.Dispose();\n 1144 |                 _activationTracker = null;\n 1145 |             }\n 1146 |             \n 1147 |             if (_transparencyHelper != null)\n 1148 |             {\n 1149 |                 _transparencyHelper.Dispose();\n 1150 |                 _transparencyHelper = null;\n 1151 |             }\n 1152 |             \n 1153 |             if (_imeControl != null)\n 1154 |             {\n 1155 |                 _imeControl.Dispose();\n 1156 |                 _imeControl = null;\n 1157 |                 _ime = null;\n 1158 |             }\n 1159 |             \n 1160 |             if (_xic != IntPtr.Zero)\n 1161 |             {\n 1162 |                 XDestroyIC(_xic);\n 1163 |                 _xic = IntPtr.Zero;\n 1164 |             }\n 1165 | \n 1166 |             if (_xSyncCounter != IntPtr.Zero)\n 1167 |             {\n 1168 |                 XSyncDestroyCounter(_x11.Display, _xSyncCounter);\n 1169 |                 _xSyncCounter = IntPtr.Zero;\n 1170 |             }\n 1171 |             \n 1172 |             if (_handle != IntPtr.Zero)\n 1173 |             {\n 1174 |                 _platform.Windows.Remove(_handle);\n 1175 |                 _platform.XI2?.OnWindowDestroyed(_handle);\n 1176 |                 var handle = _handle;\n 1177 |                 _handle = IntPtr.Zero;\n 1178 |                 _pen.Dispose();\n 1179 |                 _touch.Dispose();\n 1180 |                 if (!fromDestroyNotification) \n 1181 |                     XDestroyWindow(_x11.Display, handle);\n 1182 |             }\n 1183 | \n 1184 |             _platform.X11Screens.Changed -= OnScreensChanged;\n 1185 |             _platform.Globals.NetSupportedChanged -= OnNetSupportedChanged;\n 1186 | \n 1187 |             if (_useRenderWindow && _renderHandle != IntPtr.Zero)\n 1188 |             {                \n 1189 |                 _renderHandle = IntPtr.Zero;\n 1190 |             }\n 1191 |         }","lines":82,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11Window.cs#L1110-L1191"}]},{"id":"MEM_26","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"InputHelper.subscribeTextEvents registers a 'beforeinput' event listener (beforeInputHandler) on the element but the returned cleanup function does not remove it. The returned lambda at line 416 removes compositionstart, compositionupdate, and compositionend, but omits the removeEventListener call for 'beforeinput'. This causes a permanent listener leak on every subscribeInputEvents call.","fix":"Add element.removeEventListener('beforeinput', beforeInputHandler) inside the returned cleanup lambda alongside the other removeEventListener calls.","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts:403-421","code":"  403 |         element.addEventListener(\"beforeinput\", beforeInputHandler);\n  404 | \n  405 |         const compositionUpdateHandler = (args: CompositionEvent) => {\n  406 |             JsExports.InputHelper.OnCompositionUpdate(topLevelId, args.data);\n  407 |         };\n  408 |         element.addEventListener(\"compositionupdate\", compositionUpdateHandler);\n  409 | \n  410 |         const compositionEndHandler = (args: CompositionEvent) => {\n  411 |             JsExports.InputHelper.OnCompositionEnd(topLevelId, args.data);\n  412 |             args.preventDefault();\n  413 |         };\n  414 |         element.addEventListener(\"compositionend\", compositionEndHandler);\n  415 | \n  416 |         return () => {\n  417 |             element.removeEventListener(\"compositionstart\", compositionStartHandler);\n  418 |             element.removeEventListener(\"compositionupdate\", compositionUpdateHandler);\n  419 |             element.removeEventListener(\"compositionend\", compositionEndHandler);\n  420 |         };\n  421 |     }","lines":19,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts#L403-L421"}]},{"id":"MEM_27","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In GlRenderTarget.BeginRenderingSession(), if SKSurface.Create() succeeds (line 92) but an exception is thrown before 'success = true' on line 96, the newly created SKSurface is leaked because the finally block only disposes glSession, not the surface or renderTarget objects.","fix":"Track surface and renderTarget with local variables and dispose them in the finally block when !success.","locations":[{"ref":"src/Skia/Avalonia.Skia/Gpu/OpenGl/GlRenderTarget.cs:60-105","code":"   60 |         public ISkiaGpuRenderSession BeginRenderingSession(IRenderTarget.RenderTargetSceneInfo sceneInfo)\n   61 |         {\n   62 |             var glSession = _surface.BeginDraw(sceneInfo);\n   63 |             \n   64 |             bool success = false;\n   65 |             try\n   66 |             {\n   67 |                 var disp = glSession.Context;\n   68 |                 var gl = disp.GlInterface;\n   69 |                 gl.GetIntegerv(GL_FRAMEBUFFER_BINDING, out var fb);\n   70 | \n   71 |                 var size = glSession.Size;\n   72 |                 var colorType = SKColorType.Rgba8888;\n   73 |                 var scaling = glSession.Scaling;\n   74 |                 if (size.Width <= 0 || size.Height <= 0 || scaling < 0)\n   75 |                 {\n   76 |                     glSession.Dispose();\n   77 |                     throw new InvalidOperationException(\n   78 |                         $\"Can't create drawing context for surface with {size} size and {scaling} scaling\");\n   79 |                 }\n   80 | \n   81 |                 lock (_grContext)\n   82 |                 {\n   83 |                     _grContext.ResetContext();\n   84 | \n   85 |                     var samples = disp.SampleCount;\n   86 |                     var maxSamples = _grContext.GetMaxSurfaceSampleCount(colorType);\n   87 |                     if (samples > maxSamples)\n   88 |                         samples = maxSamples;\n   89 | \n   90 |                     var glInfo = new GRGlFramebufferInfo((uint)fb, colorType.ToGlSizedFormat());\n   91 |                     var renderTarget = new GRBackendRenderTarget(size.Width, size.Height, samples, disp.StencilSize, glInfo);\n   92 |                     var surface = SKSurface.Create(_grContext, renderTarget,\n   93 |                         glSession.IsYFlipped ? GRSurfaceOrigin.TopLeft : GRSurfaceOrigin.BottomLeft,\n   94 |                         colorType, _surfaceProperties);\n   95 | \n   96 |                     success = true;\n   97 | \n   98 |                     return new GlGpuSession(_grContext, renderTarget, surface, glSession);\n   99 |                 }\n  100 |             }\n  101 |             finally\n  102 |             {\n  103 |                 if (!success)\n  104 |                     glSession.Dispose();\n  105 |             }","lines":46,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/Gpu/OpenGl/GlRenderTarget.cs#L60-L105"}]},{"id":"MEM_28","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"PlatformRenderInterface.BuildGlyphRunGeometry() calls skFont.GetGlyphPath(glyph) in a loop. GetGlyphPath returns a new SKPath each call. The returned path is used (AddPath) but never disposed. For a glyph run with N glyphs this leaks N SKPath objects.","fix":"Wrap the returned path in a using statement: using var glyphPath = skFont.GetGlyphPath(glyph);","locations":[{"ref":"src/Skia/Avalonia.Skia/PlatformRenderInterface.cs:104-109","code":"  104 |                 var glyphPath = skFont.GetGlyphPath(glyph);\n  105 | \n  106 |                 if (glyphPath is not null && !glyphPath.IsEmpty)\n  107 |                 {\n  108 |                     path.AddPath(glyphPath, (float)currentX, (float)currentY);\n  109 |                 }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/PlatformRenderInterface.cs#L104-L109"}]},{"id":"MEM_29","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"In EnableImm, when ImmGetContext returns a non-zero handle that equals _currentHimc, the if (himc != _currentHimc) branch is not taken, so ImmReleaseContext is never called for that handle. Every call to EnableImm with an already-associated context leaks an IMM handle reference.","fix":"Call ImmReleaseContext unconditionally when himc was obtained from ImmGetContext (i.e., when himc != IntPtr.Zero and himc was returned by ImmGetContext rather than ImmCreateContext). Track whether ImmGetContext was the source and always release in a finally block.","locations":[{"ref":"src/Windows/Avalonia.Win32/Input/Imm32InputMethod.cs:46-70","code":"   46 |         public void EnableImm()\n   47 |         {\n   48 |             var himc = ImmGetContext(Hwnd);\n   49 | \n   50 |             if(himc == IntPtr.Zero)\n   51 |             {\n   52 |                 himc = ImmCreateContext();\n   53 |             }\n   54 | \n   55 |             if(himc != _currentHimc)\n   56 |             {\n   57 |                 if(_currentHimc != IntPtr.Zero)\n   58 |                 {\n   59 |                     DisableImm();\n   60 |                 }\n   61 | \n   62 |                 ImmAssociateContext(Hwnd, himc);\n   63 | \n   64 |                 ImmReleaseContext(Hwnd, himc);\n   65 | \n   66 |                 _currentHimc = himc;\n   67 | \n   68 |                 _caretManager.TryCreate(Hwnd);\n   69 |             }\n   70 |         }","lines":25,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/Input/Imm32InputMethod.cs#L46-L70"}]},{"id":"MEM_30","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"ShCoreAvailable is a computed property that calls LoadLibrary(\"shcore.dll\") each time it is evaluated. LoadLibrary increments the DLL reference count and returns a handle that must be balanced with FreeLibrary. Since the property never stores or releases the handle, every evaluation leaks one reference-count increment on the shcore.dll module handle. The property is called at least twice per window construction (WindowImpl.cs lines 541, 1030) and on every Position.set, plus from FramebufferManager and TrayIconImpl.","fix":"Replace 'LoadLibrary(\"shcore.dll\")' with 'GetModuleHandle(\"shcore.dll\")'. GetModuleHandle does not increment the reference count. Alternatively, cache the result of a single LoadLibrary call in a static readonly field and free it only on process exit.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:1694","code":" 1694 |         public static bool ShCoreAvailable => LoadLibrary(\"shcore.dll\") != IntPtr.Zero;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L1694"}]},{"id":"MEM_31","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"TrayIconImpl.Dispose (both the managed and finalizer paths) calls UpdateIcon(remove: true) to remove the system tray icon but never removes the instance from the static s_trayIcons dictionary. Disposed TrayIconImpl objects remain referenced forever in the dictionary, preventing garbage collection and accumulating GC roots for every tray icon ever created.","fix":"Add 's_trayIcons.Remove(_uniqueId);' inside Dispose(bool disposing), after UpdateIcon(true).","locations":[{"ref":"src/Windows/Avalonia.Win32/TrayIconImpl.cs:374-396","code":"  374 |         protected virtual void Dispose(bool disposing)\n  375 |         {\n  376 |             if (!_disposedValue)\n  377 |             {\n  378 |                 UpdateIcon(true);\n  379 | \n  380 |                 _disposedValue = true;\n  381 |             }\n  382 |         }\n  383 | \n  384 |         ~TrayIconImpl()\n  385 |         {\n  386 |             // Do not change this code. Put cleanup code in 'Dispose(bool disposing)' method\n  387 |             Dispose(disposing: false);\n  388 |         }\n  389 | \n  390 |         public void Dispose()\n  391 |         {\n  392 |             // Do not change this code. Put cleanup code in 'Dispose(bool disposing)' method\n  393 |             Dispose(disposing: true);\n  394 |             GC.SuppressFinalize(this);\n  395 |         }\n  396 |     }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/TrayIconImpl.cs#L374-L396"}]},{"id":"MEM_32","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In Win32StorageProvider.FiltersToPointer, Marshal.StructureToPtr marshals COMDLG_FILTERSPEC (which contains [MarshalAs(UnmanagedType.LPWStr)] string fields) allocating unmanaged CoTaskMem strings for pszName and pszSpec. The finally block only calls Marshal.FreeHGlobal(filterPtr) which frees the struct buffer itself but not the two string buffers pointed to by the struct. The marshaled strings are leaked on each filter entry.","fix":"Before Marshal.FreeHGlobal(filterPtr), add 'Marshal.DestroyStructure<UnmanagedMethods.COMDLG_FILTERSPEC>(filterPtr);' to free the marshaled string memory. Alternatively, marshal the strings manually with Marshal.StringToCoTaskMemUni and track/free them explicitly.","locations":[{"ref":"src/Windows/Avalonia.Win32/Win32StorageProvider.cs:283-298","code":"  283 |                 var filterPtr = Marshal.AllocHGlobal(size);\n  284 |                 try\n  285 |                 {\n  286 |                     var filterStr = new UnmanagedMethods.COMDLG_FILTERSPEC\n  287 |                     {\n  288 |                         pszName = filter.Name,\n  289 |                         pszSpec = string.Join(\";\", filter.Patterns)\n  290 |                     };\n  291 | \n  292 |                     Marshal.StructureToPtr(filterStr, filterPtr, false);\n  293 |                     Marshal.Copy(filterPtr, resultArr, i * size, size);\n  294 |                 }\n  295 |                 finally\n  296 |                 {\n  297 |                     Marshal.FreeHGlobal(filterPtr);\n  298 |                 }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/Win32StorageProvider.cs#L283-L298"}]},{"id":"MEM_33","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"NativeWinRTMethods.CreateInstance<T> and CreateActivationFactory<T> both create an\nHString (via WindowsCreateString), use it, then call WindowsDeleteString on it.\nHowever if RoActivateInstance or RoGetActivationFactory throws (they are declared\nPreserveSig=false so they can throw), WindowsDeleteString is never called and the\nHSTRING leaks. The pattern `var s = WindowsCreateString(...); ...; WindowsDeleteString(s);`\nis not exception-safe.","fix":"Wrap the HSTRING in a try/finally or use HStringInterop (which calls WindowsDeleteString\nin its own Dispose) to ensure the string is always freed even when the activation call\nthrows.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/NativeWinRTMethods.cs:41-59","code":"   41 |         internal static T CreateInstance<T>(string fullName) where T : IUnknown\n   42 |         {\n   43 |             var s = WindowsCreateString(fullName);\n   44 |             EnsureRoInitialized();\n   45 |             var pUnk = RoActivateInstance(s);\n   46 |             using var unk = MicroComRuntime.CreateProxyFor<IUnknown>(pUnk, true);\n   47 |             WindowsDeleteString(s);\n   48 |             return MicroComRuntime.QueryInterface<T>(unk);\n   49 |         }\n   50 |         \n   51 |         internal static TFactory CreateActivationFactory<TFactory>(string fullName) where TFactory : IUnknown\n   52 |         {\n   53 |             var s = WindowsCreateString(fullName);\n   54 |             EnsureRoInitialized();\n   55 |             var guid = MicroComRuntime.GetGuidFor(typeof(TFactory));\n   56 |             var pUnk = RoGetActivationFactory(s, ref guid);\n   57 |             using var unk = MicroComRuntime.CreateProxyFor<IUnknown>(pUnk, true);\n   58 |             WindowsDeleteString(s);\n   59 |             return MicroComRuntime.QueryInterface<TFactory>(unk);","lines":19,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WinRT/NativeWinRTMethods.cs#L41-L59"}]},{"id":"MEM_34","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In WinRTInspectable.GetIids(), memory is allocated via Marshal.AllocCoTaskMem for\nthe IIDs array and the pointer is written to *iids. The WinRT contract for\nIInspectable.GetIids requires that the caller frees this memory via CoTaskMemFree.\nThe implementation correctly uses CoTaskMem, so this is technically correct by WinRT\nconvention. However, RuntimeClassName at line 24 returns a raw HSTRING created by\nWindowsCreateString but never deletes it. The WinRT contract for RuntimeClassName\nis that the returned HSTRING is owned by the caller who must call WindowsDeleteString.\nSince this is a callback into managed code from a native WinRT caller, the native\ncaller will call WindowsDeleteString, so this is fine if callers are compliant.\nBUT: if GetIids is ever called on a managed thread directly (e.g., in tests or via\nreflection), the returned array is never freed.\n\nMore directly: WinRTInspectable.RuntimeClassName is a property getter that calls\nWindowsCreateString every time it is accessed but the HSTRING is never tracked or\nfreed by the
