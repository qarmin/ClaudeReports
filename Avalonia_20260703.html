 managed side. If a managed caller accesses this property it leaks the\nHSTRING.","fix":"This property is only called by the COM infrastructure which is responsible for\nfreeing the returned HSTRING. Add a comment documenting this ownership transfer\ncontract to prevent future confusion.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/WinRTInspectable.cs:24","code":"   24 |         public IntPtr RuntimeClassName => NativeWinRTMethods.WindowsCreateString(GetType().FullName!);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WinRT/WinRTInspectable.cs#L24"}]},{"id":"MEM_35","type":"memory_leak","type_label":"Memory Leak","severity":"low","easy":false,"description":"NavigationHelper.addBackHandler sets window.onpopstate directly, clobbering any previously registered handler. If this function is called multiple times (e.g., after navigation state changes), each subsequent call replaces the previous onpopstate and the old backHandlerCallback closure is lost. Additionally, there is no way to remove the handler once added.","fix":"Use addEventListener('popstate', handler) with a stored reference, and expose a removeBackHandler method that calls removeEventListener.","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/navigationHelper.ts:3-13","code":"    3 |         history.pushState(null, \"\", window.location.href);\n    4 |         window.onpopstate = () => {\n    5 |             const handled = backHandlerCallback();\n    6 | \n    7 |             if (!handled) {\n    8 |                 history.back();\n    9 |             } else {\n   10 |                 history.forward();\n   11 |             }\n   12 |         };\n   13 |     }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Browser/Avalonia.Browser/webapp/modules/avalonia/navigationHelper.ts#L3-L13"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":true,"description":"The touch pressure calculation `(float)t.Force / 2` (line 118) can return values\ngreater than 1.0. Apple Pencil and 3D Touch devices can report `UITouch.Force`\nvalues significantly above 1.0 (the typical maximum possible force is ~6.667 on\niPhones with 3D Touch). Dividing by 2 maps the *average* force (1.0) to Avalonia's\n0.5, which is the stated intent, but any force above 2.0 produces a Pressure value\noutside the [0, 1] range expected by Avalonia's pointer event model. Downstream\nconsumers that assume the value is normalized will misbehave.","fix":"Clamp the result to [0, 1]: `Pressure = t.MaximumPossibleForce == 0 ? 0.5f : Math.Clamp((float)t.Force / 2, 0f, 1f)`. Alternatively normalize via MaximumPossibleForce: `(float)(t.Force / t.MaximumPossibleForce) * 0.5f` which also clamps naturally.","locations":[{"ref":"src/iOS/Avalonia.iOS/InputHandler.cs:113-119","code":"  113 |             RawPointerPoint ToPointerPoint(UITouch touch) => new()\n  114 |             {\n  115 |                 Position = touch.LocationInView(_view).ToAvalonia(),\n  116 |                 // in iOS \"1.0 represents the force of an average touch\", when Avalonia expects 0.5 for \"average\".\n  117 |                 // If MaximumPossibleForce is 0, we ignore it completely.\n  118 |                 Pressure = t.MaximumPossibleForce == 0 ? 0.5f : (float)t.Force / 2\n  119 |             };","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/InputHandler.cs#L113-L119"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":true,"description":"SwapChainGlRenderTarget.BeginDrawCore() calls _swapChain.ResizeBuffers with\n`(ushort)size.Width` and `(ushort)size.Height`. PixelSize fields are signed int.\nIf the window size exceeds 65535 pixels in either dimension (unlikely but possible\non multi-monitor high-DPI setups with virtual pixel coordinates), the cast silently\ntruncates, creating a swap chain with wrong dimensions.\n\nThe same issue exists in DxgiRenderTarget.BeginDrawCore() which casts\n`(ushort)(pClientRect.right - pClientRect.left)` and `(ushort)(pClientRect.bottom - pClientRect.top)`.","fix":"The DXGI ResizeBuffers signature takes UINT (uint) parameters. Use `(uint)size.Width`\ninstead of `(ushort)`. Add a guard that clamps or throws if dimensions exceed a\nreasonable maximum.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/Angle/SwapChainGlSurface.cs:193-197","code":"  193 |                 _swapChain.ResizeBuffers(2,\n  194 |                     (ushort)size.Width,\n  195 |                     (ushort)size.Height,\n  196 |                     DXGI_FORMAT.DXGI_FORMAT_B8G8R8A8_UNORM,\n  197 |                     0);","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OpenGl/Angle/SwapChainGlSurface.cs#L193-L197"},{"ref":"src/Windows/Avalonia.Win32/DirectX/DxgiRenderTarget.cs:108-113","code":"  108 |                     _swapChain.ResizeBuffers(2,\n  109 |                         (ushort)(pClientRect.right - pClientRect.left),\n  110 |                         (ushort)(pClientRect.bottom - pClientRect.top),\n  111 |                         DXGI_FORMAT.DXGI_FORMAT_B8G8R8A8_UNORM,\n  112 |                         (ushort)_flagsUsed\n  113 |                         );","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/DirectX/DxgiRenderTarget.cs#L108-L113"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"The WM_SIZE lParam HIWORD extraction at line 749 does not cast to (ushort) or use an unsigned shift. 'ToInt32(lParam) >> 16' performs an arithmetic (signed) right shift: if the HIWORD has its high bit set (window height > 32767 pixels), bit 31 of the int32 is set and the shift propagates the sign bit, yielding a negative height. The 'new Size(width, height)' constructor would then receive a negative value. DipFromLParam and PointFromLParam at lines 1416/1421 correctly use the '(short)' cast to handle negative screen coordinates, but the WM_SIZE path does not.","fix":"Change 'ToInt32(lParam) >> 16' to '(int)(uint)(ushort)(ToInt32(lParam) >> 16)' or equivalently '(ushort)((uint)ToInt32(lParam) >> 16)' to get an unsigned 16-bit window dimension.","locations":[{"ref":"src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs:749","code":"  749 |                             var clientSize = new Size(ToInt32(lParam) & 0xffff, ToInt32(lParam) >> 16);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs#L749"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"PlatformBehaviorInhibition::SetInhibitAppSleep sets s_inhibitAppSleepHandle = nullptr to stop inhibition, but never calls endActivity:withReason: on NSProcessInfo. The system activity token is silently leaked and the inhibition never actually ends.","fix":"Call [[NSProcessInfo processInfo] endActivity:s_inhibitAppSleepHandle] before setting the handle to nullptr.","locations":[{"ref":"native/Avalonia.Native/src/OSX/PlatformBehaviorInhibition.mm:26-28","code":"   26 |             {\n   27 |                 s_inhibitAppSleepHandle = nullptr;\n   28 |             }","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/PlatformBehaviorInhibition.mm#L26-L28"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"TopLevelImpl::SetCursor does dynamic_cast<Cursor*>(cursor) without checking the result. If cursor is null or the wrong type, avnCursor is null and the immediately following avnCursor->GetNative() crashes.","fix":"Check avnCursor != nullptr after the cast. Return E_INVALIDARG or E_POINTER if null.","locations":[{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:93-97","code":"   93 |         Cursor *avnCursor = dynamic_cast<Cursor *>(cursor);\n   94 |         this->cursor = avnCursor->GetNative();\n   95 |         UpdateCursor();\n   96 | \n   97 |         if (avnCursor->IsHidden()) {","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L93-L97"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"WindowBaseImpl::SetMainMenu unconditionally dereferences nativeMenu after a dynamic_cast that may return nullptr (if menu is not an AvnAppMenu). A caller passing a different IAvnMenu implementation causes a null pointer crash.","fix":"Check nativeMenu != nullptr after the cast and return E_INVALIDARG if it is null.","locations":[{"ref":"native/Avalonia.Native/src/OSX/WindowBaseImpl.mm:311-313","code":"  311 |     auto nativeMenu = dynamic_cast<AvnAppMenu *>(menu);\n  312 | \n  313 |     lastMenu = nativeMenu->GetNative();","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/WindowBaseImpl.mm#L311-L313"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"WindowBaseImpl::SetClientSize(NSSize size) ignores its parameter and always uses the member variable lastSize. Any caller that passes a value different from lastSize will silently get the wrong size applied. TopLevelImpl::SetClientSize is correct and passes the parameter through, but the WindowBase override breaks this contract.","fix":"Change the implementation to: [Window setContentSize:size];","locations":[{"ref":"native/Avalonia.Native/src/OSX/WindowBaseImpl.mm:422-424","code":"  422 | void WindowBaseImpl::SetClientSize(NSSize size){\n  423 |     [Window setContentSize:lastSize];\n  424 | }","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/WindowBaseImpl.mm#L422-L424"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"GetIOKitRegistryId in AvnGlContext queries the registry ID of renderer index 0 instead of the matched renderer index i. The loop iterates over renderers to find one whose kCGLRPRendererID matches the current renderer, but then calls CGLDescribeRenderer(rendererInfo, 0, ...) instead of CGLDescribeRenderer(rendererInfo, i, ...) to retrieve kCGLRPRegistryIDLow and kCGLRPRegistryIDHigh. This always returns the registry ID of the first renderer, breaking GPU matching on multi-GPU systems.","fix":"Replace both CGLDescribeRenderer(rendererInfo, 0, ...) calls with CGLDescribeRenderer(rendererInfo, i, ...) so the registry ID is read from the matched renderer.","locations":[{"ref":"native/Avalonia.Native/src/OSX/cgl.mm:142-146","code":"  142 |                         if(CGLDescribeRenderer(rendererInfo, 0, kCGLRPRegistryIDLow, &gpuIDLow))\n  143 |                             return false;\n  144 |                         \n  145 |                         if(CGLDescribeRenderer(rendererInfo, 0, kCGLRPRegistryIDHigh, &gpuIDHigh))\n  146 |                             return false;","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/cgl.mm#L142-L146"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"SetServicesMenu unconditionally calls nativeMenu->GetNative() without checking whether the dynamic_cast succeeded (i.e., without checking whether nativeMenu is null). If menu points to an object that is not an AvnAppMenu, or if menu is nullptr, dynamic_cast returns nullptr and GetNative() is called on a null pointer, causing a crash.","fix":"Add a null check after the dynamic_cast: if (nativeMenu == nullptr) return; before calling GetNative().","locations":[{"ref":"native/Avalonia.Native/src/OSX/menu.mm:525-529","code":"  525 | extern void SetServicesMenu (IAvnMenu* menu)\n  526 | {\n  527 |     auto nativeMenu = dynamic_cast<AvnAppMenu*>(menu);\n  528 |     [NSApplication sharedApplication].servicesMenu = nativeMenu->GetNative();\n  529 | }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/menu.mm#L525-L529"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In AvaloniaView.OnAttachedToWindow() a brand-new EmbeddableControlRoot is created but the old TopLevelImpl (_view) is reused without being disposed and re-created. This means the old insets manager, input method, and all other top-level services still point to the old activity/context. Additionally the old _root's content is set to null before the new root is fully set up, causing a brief period where content is null.","fix":"Either fully dispose and re-create _view (TopLevelImpl) together with _root, or avoid re-creating _root on re-attachment and just restore the content.","locations":[{"ref":"src/Android/Avalonia.Android/AvaloniaView.cs:105-119","code":"  105 |         protected override void OnAttachedToWindow()\n  106 |         {\n  107 |             _root?.Content = null;\n  108 |             _root = new EmbeddableControlRoot(_view);\n  109 |             _root.Prepare();\n  110 |             if (_content != null)\n  111 |             {\n  112 |                 _root.Content = _content;\n  113 |             }\n  114 | \n  115 |             _accessHelper = new AvaloniaAccessHelper(this);\n  116 |             ViewCompat.SetAccessibilityDelegate(this, _accessHelper);\n  117 |             SendConfigurationChanged(Context?.Resources?.Configuration);\n  118 | \n  119 |             base.OnAttachedToWindow();","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/AvaloniaView.cs#L105-L119"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"ChoreographerTimer.RenderLoop() is an infinite loop that blocks forever on _event.WaitOne() with no cancellation path. There is no way to stop this thread when the timer or the app is torn down: the thread will keep the process alive after all UI activity ends, and will invoke _tick after it has been nulled-out or after the compositor has been disposed.","fix":"Add a CancellationTokenSource; use _event.WaitOne(timeout) or a ManualResetEventSlim with cancellation support, and break the loop when cancellation is requested during Dispose().","locations":[{"ref":"src/Android/Avalonia.Android/ChoreographerTimer.cs:77-88","code":"   77 |         {\n   78 |             while (true)\n   79 |             {\n   80 |                 _event.WaitOne();\n   81 |                 long time;\n   82 |                 lock (_lock)\n   83 |                 {\n   84 |                     time = _lastTime;\n   85 |                 }\n   86 |                 _tick?.Invoke(TimeSpan.FromTicks(time / 100));\n   87 |             }\n   88 |         }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/ChoreographerTimer.cs#L77-L88"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"RadiansToDegree constant is computed as 180*PI instead of 180/PI. The formula to convert radians to degrees is degrees = radians * (180 / PI), but the constant is set to 180 * PI (~565.49), so all orientation/twist values reported for touch and pen events are wildly wrong.","fix":"Change the repareRead() == -1)\n  130 |         {\n  131 |             // Other thread has won the race and read from the display, we can safely dispatch pending events\n  132 |             queue.DispatchPending();\n  133 |             return DispatchResult.Dispatched;\n  134 |         }\n  135 |         \n  136 |         // We won the race and are now responsible to drive libwayland's flush/poll/read cycle\n  137 |         \n  138 |         \n  139 |         // First flush any pending data to the compositor\n  140 |         if (!FlushDisplay(out var flushError))\n  141 |         {\n  142 |             // If somebody wants to read errors they should call Display.Dispatch() \n  143 |             Display.CancelRead();\n  144 |             if (ClassifyErrorOrThrow(flushError, out var dispatchResult))\n  145 |                 return dispatchResult;\n  146 |             \n  147 |             throw new AvaloniaWaylandFlushException(flushError);\n  148 |         }\n  149 | \n  150 | \n  151 |         Span<pollfd> fds = stackalloc pollfd[]\n  152 |         {\n  153 |             new pollfd() { fd = _fd, events = PollEvents.POLLIN },\n  154 |             new pollfd() { fd = wakeupFd, events = PollEvents.POLLIN },\n  155 |         };\n  156 |         DoPoll(fds);\n  157 | \n  158 |         if (fds[0].revents == default)\n  159 |         {\n  160 |             // ppoll got woken up by the wakeup fd\n  161 |             Display.CancelRead();\n  162 |             return DispatchResult.Wakeup;\n  163 |         }\n  164 | \n  165 |         // Actual read call\n  166 |         if(Display.ReadEvents() == -1)\n  167 |         {\n  168 |             var errno = (Errno)Marshal.GetLastPInvokeError();\n  169 |             if (ClassifyErrorOrThrow(errno, out var dispatchResult))\n  170 |                 return dispatchResult;\n  171 |             throw new AvaloniaWaylandReadException(errno);\n  172 |         }\n  173 | \n  174 |         Queue.DispatchPending();","lines":49,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Interop/WaylandConnection.cs#L126-L174"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"wl_data_offer.finish() is unconditionally called after a Drop event regardless of whether the drop was accepted. The Wayland protocol (wl_data_offer.finish request description) explicitly requires that finish is only called when the drop destination accepted the transfer. Calling finish after a rejected drop (where UpdateDndFeedback posted DragDropEffects.None) triggers a protocol error on strict compositors (the spec says 'illegal request' if the client calls finish when no action was accepted).","fix":"Check the drop event's Effects before calling PostFinish. Only call PostFinish when dragEvent.Effects != DragDropEffects.None. When effects are None (rejected), call a PostCancel (or just let the pending offer be destroyed without finish) so the source learns the transfer was declined without a protocol error.","locations":[{"ref":"src/Avalonia.Wayland/WindowImplBase.DragDrop.cs:66-69","code":"   66 |             else if (dragEvent.Type is RawDragEventType.Drop)\n   67 |             {\n   68 |                 dragEvent.OfferCookie?.PostFinish();\n   69 |             }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/WindowImplBase.DragDrop.cs#L66-L69"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"XRRGetOutputProperty parameter names are swapped in GetPhysicalMonitorSizeFromEDID. The P/Invoke signature is 'out int nitems, out long bytes_after' but the call site passes 'out int bytesAfter, out _', mapping the variable named 'bytesAfter' to the 'nitems' output position and silently discarding the real 'bytes_after'. The subsequent 'new byte[bytesAfter]' and 'Marshal.Copy(..., bytesAfter)' therefore use 'nitems' (number of 8-bit items returned) instead of 'bytes_after' (remaining unread bytes). In the common case where all 128 EDID bytes are returned in a single call, nitems == 128 and bytes_after == 0, so the result is accidentally correct. If the EDID is larger or the X server splits the response (bytes_after > 0), the code reads the wrong number of bytes and the truncated remaining data is silently ignored.","fix":"Add the nitems out parameter explicitly: 'out IntPtr actualType, out int actualFormat, out int nitems, out long bytesAfter, out IntPtr prop'. Then size the array from nitems (total items already read) and verify bytesAfter == 0 before assuming the full EDID is present.","locations":[{"ref":"src/Avalonia.X11/Screens/X11Screen.Providers.cs:291-300","code":"  291 |             XRRGetOutputProperty(_x11.Display, rrOutput, _x11.Atoms.EDID, 0, EDIDStructureLength, false, false,\n  292 |                 AnyPropertyType, out IntPtr actualType, out int actualFormat, out int bytesAfter, out _,\n  293 |                 out IntPtr prop);\n  294 |             if (actualType != _x11.Atoms.INTEGER)\n  295 |                 return null;\n  296 |             if (actualFormat != 8) // Expecting an byte array\n  297 |                 return null;\n  298 | \n  299 |             var edid = new byte[bytesAfter];\n  300 |             Marshal.Copy(prop, edid, 0, bytesAfter);","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Screens/X11Screen.Providers.cs#L291-L300"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"Off-by-one error in UserConfiguredScalingProvider.GetScaling: the condition 'index > 0' skips index 0, so the first screen (index 0) always returns scaling factor 1.0 regardless of what the user configured via AVALONIA_SCREEN_SCALE_FACTORS or QT_SCREEN_SCALE_FACTORS. Users with multi-monitor setups who configure oundRect!.Rect, skRoundRect.Radii);\n  449 |                             if (spread != 0)\n  450 |                                 shadowRect.Inflate(spread, spread);\n  451 |                             Canvas.ClipRoundRect(skRoundRect,\n  452 |                                 shadow.ClipOperation, true);\n  453 |                             \n  454 |                             var oldTransform = Transform;\n  455 |                             Transform = oldTransform * Matrix.CreateTranslation(boxShadow.OffsetX, boxShadow.OffsetY);\n  456 |                             Canvas.DrawRoundRect(shadowRect, shadow.Paint);\n  457 |                             Transform = oldTransform;\n  458 |                             SKRoundRectCache.Shared.Return(shadowRect);\n  459 |                         }\n  460 |                         else\n  461 |                         {\n  462 |                             var shadowRect = rc;\n  463 |                             if (spread != 0)\n  464 |                                 shadowRect.Inflate(spread, spread);\n  465 |                             Canvas.ClipRect(rc, shadow.ClipOperation);\n  466 |                             var oldTransform = Transform;\n  467 |                             Transform = oldTransform * Matrix.CreateTranslation(boxShadow.OffsetX, boxShadow.OffsetY);\n  468 |                             Canvas.DrawRect(shadowRect, shadow.Paint);\n  469 |                             Transform = oldTransform;\n  470 |                         }\n  471 | \n  472 |                         RestoreCanvas();\n  473 |                     }\n  474 |                 }\n  475 |             }","lines":41,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L435-L475"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In DrawingContextImpl.DrawRectangle() for inset box shadows (lines 492-519), Canvas.Save() is called before DrawRoundRectDifference. After the draw, RestoreCanvas() is called, then SKRoundRectCache.Shared.Return(shadowRect) is called. But if an exception is thrown anywhere between Save() and RestoreCanvas(), the canvas save stack is permanently unbalanced, corrupting all subsequent rendering. No try/finally guards the Restore.","fix":"Wrap each Canvas.Save() / RestoreCanvas() pair in a try/finally to ensure Restore is always called on exception.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:493-518","code":"  493 |             {\n  494 |                 if (boxShadow != default && boxShadow.IsInset)\n  495 |                 {\n  496 |                     using (var shadow = BoxShadowFilter.Create(_boxShadowPaint, boxShadow, _currentOpacity))\n  497 |                     {\n  498 |                         var spread = (float)boxShadow.Spread;\n  499 |                         var offsetX = (float)boxShadow.OffsetX;\n  500 |                         var offsetY = (float)boxShadow.OffsetY;\n  501 |                         var outerRect = AreaCastingShadowInHole(rc, (float)boxShadow.Blur, spread, offsetX, offsetY);\n  502 | \n  503 |                         Canvas.Save();\n  504 |                         var shadowRect = SKRoundRectCache.Shared.GetAndSetRadii(skRoundRect!.Rect, skRoundRect.Radii);\n  505 |                         if (spread != 0)\n  506 |                             shadowRect.Deflate(spread, spread);\n  507 |                         Canvas.ClipRoundRect(skRoundRect,\n  508 |                             shadow.ClipOperation, true);\n  509 |                         \n  510 |                         var oldTransform = Transform;\n  511 |                         Transform = oldTransform * Matrix.CreateTranslation(boxShadow.OffsetX, boxShadow.OffsetY);\n  512 |                         using (var outerRRect = new SKRoundRect(outerRect))\n  513 |                             Canvas.DrawRoundRectDifference(outerRRect, shadowRect, shadow.Paint);\n  514 |                         Transform = oldTransform;\n  515 |                         RestoreCanvas();\n  516 |                         SKRoundRectCache.Shared.Return(shadowRect);\n  517 |                     }\n  518 |                 }","lines":26,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L493-L518"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In DrawingContextImpl.PopOpacityMask(), after drawing the mask via DrawPaint(), the code calls SKPaintCache.Shared.Return(paintWrapper.Paint) to return the paint to the cache without resetting it. PaintWrapper.Dispose() already calls paint.Reset() internally, so the reset is correct - but this is a separate additional Return call that returns the *same* paint object that was already part of the wrapper. Since PaintWrapper does not clear its Paint reference on Dispose, the paint is returned twice if anything calls Return on it again. More critically: the Dispose() call on paintWrapper (via 'using') resets and does NOT return the paint to the cache; the explicit Return on line 863 is the only return. However, that paint was originally obtained from the cache in PushOpacityMask (line 839) and passed to _maskStack. The flow is complex enough that a future refactor could cause double-return.","fix":"Replace the bare SKPaintCache.Shared.Return() call on line 863 with SKPaintCache.Shared.ReturnReset(), and remove the paint.Reset() duplication in PaintWrapper.Dispose() for this case, or restructure PopOpacityMask to use a consistent single return path.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:836-867","code":"  836 |         {\n  837 |             CheckLease();\n  838 | \n  839 |             var paint = SKPaintCache.Shared.Get();\n  840 | \n  841 |             Canvas.SaveLayer(bounds.ToSKRect(), paint);\n  842 |             _maskStack.Push((Canvas.TotalMatrix, CreatePaint(paint, mask, bounds)));\n  843 |         }\n  844 | \n  845 |         /// <inheritdoc />\n  846 |         public void PopOpacityMask()\n  847 |         {\n  848 |             CheckLease();\n  849 | \n  850 |             var paint = SKPaintCache.Shared.Get();\n  851 |             paint.BlendMode = SKBlendMode.DstIn;\n  852 |             \n  853 |             Canvas.SaveLayer(paint);\n  854 |             SKPaintCache.Shared.ReturnReset(paint);\n  855 |             \n  856 |             var (transform, paintWrapper) = _maskStack.Pop();\n  857 |             Canvas.SetMatrix(transform);\n  858 |             using (paintWrapper)\n  859 |             {\n  860 |                 Canvas.DrawPaint(paintWrapper.Paint);\n  861 |             }\n  862 |             // Return the paint wrapper's paint less the reset since the paint is already reset in the Dispose method above.\n  863 |             SKPaintCache.Shared.Return(paintWrapper.Paint);\n  864 | \n  865 |             RestoreCanvas();\n  866 | \n  867 |             RestoreCanvas();","lines":32,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L836-L867"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"SkiaRegionImpl.Rects never sets _rectsValid = true after rebuilding the list. Every call to the Rects getter rebuilds the full iterator even when the region has not changed, because the cache-valid flag stays false permanently. This turns what should be an O(1) cached lookup into O(rects) on every access.","fix":"Add _rectsValid = true; after the while loop that populates _rects (line 45).","locations":[{"ref":"src/Skia/Avalonia.Skia/SkiaRegionImpl.cs:35-49","code":"   35 |     public IList<LtrbPixelRect> Rects\n   36 |     {\n   37 |         get\n   38 |         {\n   39 |             _rects ??= new();\n atEffectFactory, and sat only to silently discard them.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionUtils.cs:100-104","code":"  100 |         using var saturateEffect = new SaturationEffect(blurEffect);\n  101 |         using var satEffectFactory = compositor.CreateEffectFactory(saturateEffect);\n  102 |         using var sat = satEffectFactory.CreateBrush();\n  103 |         compositionEffectBrush.SetSourceParameter(backdropString.Handle, backdropBrush);\n  104 |         return compositionEffectBrush.QueryInterface<ICompositionBrush>();","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionUtils.cs#L100-L104"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"PressesChanged calls base.PressesBegan instead of base.PressesChanged. When the\ninput handler does not consume a key event during an ongoing press (Phase.Changed),\nthe wrong UIResponder chain method is invoked. UIKit expects PressesChanged to\npropagate up the responder chain; sending PressesBegan instead may suppress\nplatform default key-repeat behavior or double-fire keyDown handlers in responders\nhigher in the chain.","fix":"Change `base.PressesBegan(presses, evt)` inside `PressesChanged` (line 375) to `base.PressesChanged(presses, evt)`.","locations":[{"ref":"src/iOS/Avalonia.iOS/AvaloniaView.cs:371-378","code":"  371 |         public override void PressesChanged(NSSet<UIPress> presses, UIPressesEvent evt)\n  372 |         {\n  373 |             if (!_input.Handle(presses, evt))\n  374 |             {\n  375 |                 base.PressesBegan(presses, evt);\n  376 |             }\n  377 |         }\n  378 | ","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/AvaloniaView.cs#L371-L378"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"`LayerFbo.TryCreate` allocates a depth renderbuffer (`db`) at line 50, attaches it\nto `GL_DEPTH_ATTACHMENT` at line 54, but the two calls that would allocate its\nstorage (`BindRenderbuffer` and `RenderbufferStorage`) are commented out (lines\n52-53). A depth renderbuffer attached to the framebuffer without any storage is\nagainst the GLES3 spec; the framebuffer becomes incomplete on conformant drivers,\ncausing `CheckFramebufferStatus` to fail and the function to delete all objects and\nreturn `null` - effectively preventing EAGL rendering from working at all. On\nlenient drivers the framebuffer may be accepted but depth testing is undefined.","fix":"Uncomment and fix the storage allocation: bind `db`, call `RenderbufferStorage(GL_RENDERBUFFER, GL_DEPTH_COMPONENT16, w, h)`, then attach it. If depth is intentionally not needed for 2D rendering, remove the `GenRenderbuffer` / `FramebufferRenderbuffer` calls for the depth slot entirely.","locations":[{"ref":"src/iOS/Avalonia.iOS/Eagl/LayerFbo.cs:50-54","code":"   50 |             var db = gl.GenRenderbuffer();\n   51 |             \n   52 |             //GL.BindRenderbuffer(RenderbufferTarget.Renderbuffer, depthBuffer);\n   53 |             //GL.RenderbufferStorage(RenderbufferTarget.Renderbuffer, RenderbufferInternalFormat.DepthComponent16, w, h);\n   54 |             gl.FramebufferRenderbuffer(GlConsts.GL_FRAMEBUFFER, GlConsts.GL_DEPTH_ATTACHMENT, GlConsts.GL_RENDERBUFFER, db);","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/Eagl/LayerFbo.cs#L50-L54"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"`TextInRange` builds the virtual document incorrectly when preedit (marked) text is\nactive. The `CombinedSpan3` is constructed as:\n  span1 = surroundingText[0..selection.Start]\n  span2 = _markedText\n xt[buffer.Selection.Start - beforeLengthInChar] as the trail, but this access happens before the guard check 'if (buffer.Selection.Start > beforeLengthInChar)', which does not account for the -1 offset on the lead character. When beforeLengthInChar equals Selection.Start - 1, the lead index becomes -1 + Selection.Start - (Selection.Start - 1) = index 0 while the guard passes, but the guard should be > beforeLengthInChar + 1 to prevent index -1 on the lead.","fix":"Change the guard to: if (buffer.Selection.Start > beforeLengthInChar + 1) to ensure the lead character index is always >= 0.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Input/EditCommand.cs:82-99","code":"   82 |             var beforeLengthInChar = 0;\n   83 | \n   84 |             for (int i = 0; i < _before; i++)\n   85 |             {\n   86 |                 beforeLengthInChar++;\n   87 |                 if (buffer.Selection.Start > beforeLengthInChar)\n   88 |                 {\n   89 |                     var lead = buffer.Text[buffer.Selection.Start - beforeLengthInChar - 1];\n   90 |                     var trail = buffer.Text[buffer.Selection.Start - beforeLengthInChar];\n   91 | \n   92 |                     if (char.IsSurrogatePair(lead, trail))\n   93 |                     {\n   94 |                         beforeLengthInChar++;\n   95 |                     }\n   96 |                 }\n   97 | \n   98 |                 if (beforeLengthInChar == buffer.Selection.Start)\n   99 |                     break;","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/Input/EditCommand.cs#L82-L99"}]},{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"AndroidStorageFolder.DeleteAsync() deletes the folder's children but uses the wrong URI when deleting the folder itself. Inside DeleteContents the call is DeleteDocument(Activity.ContentResolver!, treeUri!) where treeUri is obtained from GetTreeUri().treeUri (the children URI), not the document URI of the folder being deleted. For the root folder the treeUri may be a children list URI rather than the folder's own document URI, causing the delete to fail silently or target the wrong document.","fix":"Pass the folder's own document URI (Uri) to DeleteDocument, not the children URI returned by GetTreeUri().","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs:218-246","code":"  218 |     public override async Task DeleteAsync()\n  219 |     {\n  220 |         if (!await EnsureExternalFilesPermission(false))\n  221 |         {\n  222 |             return;\n  223 |         }\n  224 | \n  225 |         if (Activity != null)\n  226 |         {\n  227 |             await DeleteContents(this);\n  228 |         }\n  229 | \n  230 |         async Task DeleteContents(AndroidStorageFolder storageFolder)\n  231 |         {\n  232 |             await foreach (var file in storageFolder.GetItemsAsync())\n  233 |             {\n  234 |                 if (file is AndroidStorageFolder folder)\n  235 |                 {\n  236 |                     await DeleteContents(folder);\n  237 |                 }\n  238 |                 else if (file is AndroidStorageFile storageFile)\n  239 |                 {\n  240 |                     await storageFile.DeleteAsync();\n  241 |                 }\n  242 |             }\n  243 | \n  244 |             var treeUri = GetTreeUri().treeUri;\n  245 |             DeleteDocument(Activity.ContentResolver!, treeUri!);\n  246 |         }","lines":29,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs#L218-L246"}]},{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"AndroidStorageProvider.StartActivity() subscribes to mainActivity.ActivityResult but never unsubscribes if StartActivityForResult throws an exception. If _activity.StartActivityForResult(pickerIntent, currentRequestCode) throws, the lambda OnActivityResult remains subscribed permanently, leaking a TaskCompletionSource and potentially being triggered by future unrelated activity results.","fix":"Wrap StartActivityForResult in a try/finally block that unsubscribes OnActivityResult and sets the TCS to faulted on exception.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Storage/AndroidStorageProvider.cs:217-271","code":"  217 |     private async Task<List<AndroidUri>> StartActivity(Intent? pickerIntent, bool singleResult)\n  218 |     {\n  219 |         var resultList = new List<AndroidUri>(1);\n  220 |         var tcs = new TaskCompletionSource<Intent?>();\n  221 |         var currentRequestCode = PlatformSupport.GetNextRequestCode();\n  222 | \n  223 |         if (!(_activity is IActivityResultHandler mainActivity))\n  224 |         {\n  225 |             throw new InvalidOperationException(\"Main activity must implement IActivityResultHandler interface.\");\n  226 |         }\n  227 | \n  228 |         mainActivity.ActivityResult += OnActivityResult;\n  229 |         _activity.StartActivityForResult(pickerIntent, currentRequestCode);\n  230 | \n  231 |         var result = await tcs.Task;\n  232 | \n  233 |         if (result != null)\n  234 |         {\n  235 |             // ClipData first to avoid issue with multiple files selection.\n  236 |             if (!singleResult && result.ClipData is { } clipData)\n  237 |             {\n  238 |                 for (var i = 0; i < clipData.ItemCount; i++)\n  239 |                 {\n  240 |                     var uri = clipData.GetItemAt(i)?.Uri;\n  241 |                     if (uri != null)\n  242 |                     {\n  243 |                         resultList.Add(uri);\n  244 |                     }\n  245 |                 }\n  246 |             }\n  247 |             else if (result.Data is { } uri)\n  248 |             {\n  249 |                 resultList.Add(uri);\n  250 |             }\n  251 |         }\n  252 | \n  253 |         if (result?.HasExtra(\"error\") == true)\n  254 |         {\n  255 |             throw new Exception(result.GetStringExtra(\"error\"));\n  256 |         }\n  257 | \n  258 |         return resultList;\n  259 | \n  260 |         void OnActivityResult(int requestCode, Result resultCode, Intent? data)\n  261 |         {\n  262 |             if (currentRequestCode != requestCode)\n  263 |             {\n  264 |                 return;\n  265 |             }\n  266 | \n  267 |             mainActivity.ActivityResult -= OnActivityResult;\n  268 | \n  269 |             _ = tcs.TrySetResult(resultCode == Result.Ok ? data : null);\n  270 |         }\n  271 |     }","lines":55,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/Storage/AndroidStorageProvider.cs#L217-L271"}]},{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"The RenderSurfaces property on WSurface creates a new WaylandFramebuffer instance every time the graphics backend changes (on reconnect). Old WaylandFramebuffer instances are not tracked or disposed when _renderSurfaces is replaced by a new array. Each WaylandFramebuffer creates a RenderTarget on construction which calls RegisterRenderTarget, but the old render surfaces are silently dropped without UnregisterRenderTarget. In the reconnect path of OnDisconnected the active render targets list is iterated and disposed, but only if they were previously registered via RegisterRenderTarget. The old framebuffer render surface itself (not the RenderTarget) is also never disposed.","fix":"Before assigning _renderSurfaces to a new array, dispose any existing render surface entries that implement IDisposable. Alternatively track the old surfaces explicitly and dispose them.","locations":[{"ref":"src/Avalonia.Wayland/Server/Persistent/WSurface.cs:142-156","code":"  142 |     public IPlatformRenderSurface[] RenderSurfaces\n  143 |     {\n  144 |         get\n  145 |         {\n  146 |             var graphics = Worker.PlatformGraphics.CurrentGraphics;\n  147 |             if (_renderSurfaces != null && ReferenceEquals(_renderSurfacesGraphicsKey, graphics))\n  148 |                 return _renderSurfaces;\n  149 | \n  150 |             _renderSurfacesGraphicsKey = graphics;\n  151 |             _renderSurfaces = graphics != null\n  152 |                 ? [graphics.CreateRenderSurface(this), new WaylandFramebuffer(this)]\n  153 |                 : [new WaylandFramebuffer(this)];\n  154 |             return _renderSurfaces;\n  155 |         }\n  156 |     }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Persistent/WSurface.cs#L142-L156"}]},{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In UpdateDndFeedback, when the app accepts the drag, wl_data_offer.accept() is called with every MIME type in the offer list (calling it in a loop). The accept request is meant to be called once per motion event, providing the single MIME type the destination prefers. Sending it multiple times for the same serial is redundant at best; more importantly, it sends stale serials after subsequent motion events because _dndSerial is only set in OnDndEnter and never updated during motion. wl_data_offer.accept() requires the serial from the most recent wl_data_device.enter event which in the DragOver scenario still refers to the original enter serial, not the motion timestamp. Some compositors treat repeated accept calls as indicating the destination is confused.","fix":"Call Accept with only the single preferred MIME type (e.g. the first or most specific type). Keep _dndSerial as the enter serial (which is correct per protocol - wl_data_offer.accept takes the wl_data_device.enter serial, not a motion serial). Remove the loop and just call Accept with one MIME type.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataDevice.cs:202-217","code":"  202 |     internal void UpdateDndFeedback(DragDropEffects effects)\n  203 |     {\n  204 |         if (_dndOffer == null)\n  205 |             return;\n  206 | \n  207 |         var (actions, preferred) = EffectsToActionsWithPreferred(effects);\n  208 |         _dndOffer.SetActions(actions, preferred);\n  209 | \n  210 |         if (effects == DragDropEffects.None) \n  211 |             _dndOffer.Accept(_dndSerial, null);\n  212 |         else\n  213 |         {\n  214 |             foreach(var mime in _dndOffer.MimeTypes)\n  215 |                 _dndOffer.Accept(_dndSerial, mime);\n  216 |         }\n  217 |     }","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Transient/Clipboard/WaylandDataDevice.cs#L202-L217"}]},{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Hardcoded XKB modifier bit positions (Shift=bit 0, Ctrl=bit 2, Alt=bit 3, Meta=bit 6) in ModifiersFromXkbMask are derived from traditional X11 modifier mask values but the wl_keyboard.modifiers event delivers xkb depressed/latched/locked values whose bit layout is keymap-specific. On a keymap where AltGr is Mod5 and has a different index, or where Super/Meta is bound to a different modifier index, the hardcoded shifts will silently misidentify modifier state. The proper approach is to call xkb_keymap_mod_get_index to obtain the actual index for named modifiers (\"Shift\", \"Control\", \"Alt\", \"Mod4\") and use those at runtime.","fix":"After keymap creation in XkbCommonKeymap, call xkb_keymap_mod_get_index for each named modifier (XKB_MOD_NAME_SHIFT, XKB_MOD_NAME_CTRL, XKB_MOD_NAME_ALT, XKB_MOD_NAME_LOGO) and store the returned indices. In ModifiersFromXkbMask use those indices instead of hardcoded constants. Add xkb_keymap_mod_get_index to XkbCommonNativeMethods.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/WaylandInputDispatcher.Keyboard.cs:27-48","code":"   27 |         // Standard XKB modifier bit positions\n   28 |         private const uint ModShift = 1 << 0;\n   29 |         private const uint ModControl = 1 << 2;\n   30 |         private const uint ModAlt = 1 << 3;    // Mod1\n   31 |         private const uint ModMeta = 1 << 6;   // Mod4 / Super\n   32 | \n   33 |         public KeyboardHandler(Seat seat)\n   34 |         {\n   35 |             _seat = seat;\n   36 |             _xkbContext = new XkbContext();\n   37 |             _composeTable = XkbComposeTable.TryCreate(_xkbContext);\n   38 | \n   39 |             _keyboard = seat.WlSeat.GetKeyboard(new Listener(this));\n   40 |         }\n   41 | \n   42 |         private static RawInputModifiers ModifiersFromXkbMask(uint mask)\n   43 |         {\n   44 |             var mods = RawInputModifiers.None;\n   45 |             if ((mask & ModShift) != 0) mods |= RawInputModifiers.Shift;\n   46 |             if ((mask & ModControl) != 0) mods |= RawInputModifiers.Control;\n   47 |             if ((mask & ModAlt) != 0) mods |= RawInputModifiers.Alt;\n   48 |             if ((mask & ModMeta) != 0) mods |= RawInputModifiers.Meta;","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Transient/WaylandInputDispatcher.Keyboard.cs#L27-L48"}]},{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"WaylandTextInputV3.Reset sends disable, commit, enable, and then PushSeatStateLocked + commit in sequence for each seat. However, after calling proxy.Disable() and seat.Commit(), the seat.CommitSerial is incremented. Then proxy.Enable() and another seat.Commit() increments it again. The compositor replies with a done event carrying the commit serial from when it processed the state. If the preedit is cleared via the sink.OnImeUpdate call at line 207 but the serial check in Done is still pending a matching serial, the client and compositor can lose sync. The reset path calls ClearLastDelivered() which is correct, but the serial double-bump means two roundtrips are needed before a new preedit is considered fresh.","fix":"Combine the disable+enable into a single commit per seat: call Disable, Enable, PushSeatStateLocked in sequence and only call seat.Commit() once at the end. This reduces the serial to a single increment and avoids the stale-serial window.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/WaylandTextInputV3.cs:182-208","code":"  182 |     public void Reset(WSurface s)\n  183 |     {\n  184 |         // v3 has no reset request. Closest safe behaviour: drop pending preedit\n  185 |         // by issuing disable + enable + commit. Compositor treats this as a fresh\n  186 |         // session and discards in-flight preedit.\n  187 |         if (!_surfaces.TryGetValue(s, out var ps) || !ps.HasClient)\n  188 |             return;\n  189 |         var hadDeliveredPreedit = false;\n  190 |         foreach (var seat in ps.EnteredSeats)\n  191 |         {\n  192 |             if (seat.Proxy is not { } proxy)\n  193 |                 continue;\n  194 |             if (!string.IsNullOrEmpty(seat.LastDeliveredPreedit))\n  195 |                 hadDeliveredPreedit = true;\n  196 |             seat.ClearPending();\n  197 |             seat.ClearLastDelivered();\n  198 |             proxy.Disable();\n  199 |             seat.Commit();\n  200 |             proxy.Enable();\n  201 |             PushSeatStateLocked(seat, s, ps);\n  202 |             seat.Commit();\n  203 |         }\n  204 |         // Clear stale composition on the client side too — otherwise the visible\n  205 |         // preedit lingers until the IME (re-)sends one, which may be deduped.\n  206 |         if (hadDeliveredPreedit)\n  207 |             ps.Sink.OnImeUpdate(ps.Surface.TextInputSessionToken, 0, 0, null, null, -1, -1);\n  208 |     }","lines":27,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Transient/WaylandTextInputV3.cs#L182-L208"}]},{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Surrounding text cursor and anchor are passed in the wrong order to SetTextInputSurroundingText. The call is SetTextInputSurroundingText(text, selection.End, selection.Start), mapping End->cursorChar and Start->anchorChar. In the zwp_text_input_v3 protocol the cursor is where the caret sits (the active end of the selection), which corresponds to TextSelection.End when a forward selection exists but to TextSelection.Start when a backwards selection exists. The Avalonia TextSelection convention is Start <= End, so the cursor could be at either end. Consistently passing End as cursor means IMEs that insert at the cursor position (delete_surrounding_text, commit_string) will misalign by the selection width when the user has a non-empty backwards selection.","fix":"Track the cursor (active caret end) separately from the anchor. The TextInputMethodClient.Selection uses Start/End but not which end is active. Either expose a CursorPosition property on TextInputMethodClient, or as a pragmatic fix, call SetTextInputSurroundingText(text, selection.Start, selection.End) since compositors generally treat the first byte offset as cursor and second as anchor per zwp_text_input_v3 protocol (cursor_pos comes before anchor_pos in the set_surrounding_text request).","locations":[{"ref":"src/Avalonia.Wayland/WindowImpl.TextInput.cs:221-222","code":"  221 |             var selection = client.Selection;\n  222 |             _owner._surfaceProxy?.SetTextInputSurroundingText(text, selection.End, selection.Start);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/WindowImpl.TextInput.cs#L221-L222"}]},{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In XkbCommonKeymap constructor, xkb_keymap_new_from_buffer is called with length = size - 1 (to exclude null terminator), which is correct. However, if xkb_keymap_new_from_buffer fails and throws, Dispose() is called in the catch block. At that point _state is still IntPtr.Zero (since it hasn't been created yet) but _keymap may be non-null — however xkb_keymap_unref will correctly handle the valid keymap pointer. More critically, if _keymap creation succeeds but _state creation fails, the catch block calls Dispose() which calls xkb_keymap_unref and xkb_state_unref. But xkb_state_unref is guarded by `_state != IntPtr.Zero` so that is fine. The real issue is munmap in the finally block runs with (IntPtr)size which includes the null terminator byte, while the mmap was done with the same size, so this is correct. No actual bug here - but the pattern is fragile.","fix":"No critical fix needed. The size passed to munmap correctly matches the size from mmap. Consider adding a comment clarifying why `size` (not `size-1`) is passed to munmap.","locations":[{"ref":"src/Avalonia.Wayland/XkbCommonKeymap.cs:17-48","code":"   17 |     public XkbCommonKeymap(XkbContext context, int fd, uint size)\n   18 |     {\n   19 |         var mapped = UnsafeNativeMethods.mmap(\n   20 |             IntPtr.Zero, (IntPtr)size, PROT_READ, MAP_PRIVATE, fd, IntPtr.Zero);\n   21 |         UnsafeNativeMethods.close(fd);\n   22 | \n   23 |         if (mapped == IntPtr.Zero || mapped == new IntPtr(-1))\n   24 |             throw new InvalidOperationException(\"Failed to mmap keymap fd\");\n   25 | \n   26 |         try\n   27 |         {\n   28 |             // size includes null terminator; xkb_keymap_new_from_buffer expects length without it\n   29 |             _keymap = xkb_keymap_new_from_buffer(\n   30 |                 context.Handle, (byte*)mapped, (IntPtr)(size - 1),\n   31 |                 XKB_KEYMAP_FORMAT_TEXT_V1, XKB_KEYMAP_COMPILE_NO_FLAGS);\n   32 | \n   33 |             if (_keymap == IntPtr.Zero)\n   34 |                 throw new InvalidOperationException(\"Failed to create xkb keymap from buffer\");\n   35 | \n   36 |             _state = xkb_state_new(_keymap);\n   37 |             if (_state == IntPtr.Zero)\n   38 |                 throw new InvalidOperationException(\"Failed to create xkb state\");\n   39 |         }\n   40 |         catch\n   41 |         {\n   42 |             Dispose();\n   43 |             throw;\n   44 |         }\n   45 |         finally\n   46 |         {\n   47 |             UnsafeNativeMethods.munmap(mapped, (IntPtr)size);\n   48 |         }","lines":32,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/XkbCommonKeymap.cs#L17-L48"}]},{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In GlibDispatcherImplBase, the timer source tag (_glibTimerSourceTag) is removed via g_source_remove on UpdateTimer, but the old g_timeout_add_once callback (s_onceSourceCb) closes over a GCHandle-wrapped Action delegate. If g_source_remove races with the timer already firing (the timer fires between checking if it is scheduled and removing it), the GCHandle will be freed twice: once by the GDestroyNotify callback and once during normal GCHandle.Free in the action invocation path. In practice, g_source_remove returns false if the source already ran, so there is no actual double-free - but the code does not check the return value of g_source_remove and does not handle the case where the timer callback has already been queued but not yet invoked. The approach is unsafe with GLib's threading model.","fix":"Use g_timeout_add_full with a persistent GDestroyNotify, or track whether the timer source fired using a generation counter, to ensure the callback Action is only invoked or freed once.","locations":[{"ref":"src/Avalonia.X11/Dispatching/GlibDispatcherImplBase.cs:141-153","code":"  141 |     public void UpdateTimer(long? dueTimeInMs)\n  142 |     {\n  143 |         if (_glibTimerSourceTag.HasValue)\n  144 |         {\n  145 |             g_source_remove(_glibTimerSourceTag.Value);\n  146 |             _glibTimerSourceTag = null;\n  147 |         }\n  148 | \n  149 |         if (dueTimeInMs == null)\n  150 |             return;\n  151 | \n  152 |         var interval = (uint)Math.Max(0, (int)Math.Min(int.MaxValue, dueTimeInMs.Value - Now));\n  153 |         _glibTimerSourceTag = g_timeout_add_once(interval, TimerCallback);","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Dispatching/GlibDispatcherImplBase.cs#L141-L153"}]},{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In EventStreamWindow, the timeout timer fires every second (TimeSpan.FromSeconds(1), line 35) to check for expired listeners. The timeout comparison is 'timeout < _time.Elapsed' (line 50), where 'timeout' is the absolute deadline stored as '_time.Elapsed + timeout_param' at listener creation time. The timer interval (1 second) can cause late expiry: a listener with a 5-second timeout may actually fire up to 1 second late. For clipboard operations with a 5-second SelectionHelper.Timeout, this means the actual timeout can be up to 6 seconds. This is minor but can cause visible freezes in edge cases.","fix":"Reschedule the timer to fire at exactly the next expiry deadline instead of polling at a fixed 1-second interval. On each listener addition, compute the time until the nearest deadline and set the timer interval accordingly.","locations":[{"ref":"src/Avalonia.X11/Selections/Clipboard/EventStreamWindow.cs:35","code":"   35 |         _timeoutTimer = new(TimeSpan.FromSeconds(1), DispatcherPriority.Background, OnTimer);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/Clipboard/EventStreamWindow.cs#L35"},{"ref":"src/Avalonia.X11/Selections/Clipboard/EventStreamWindow.cs:44-58","code":"   44 |     private void OnTimer(object? sender, EventArgs eventArgs)\n   45 |     {\n   46 |         MergeListeners();\n   47 |         for (var i = 0; i < _listeners.Count; i++)\n   48 |         {\n   49 |             var (filter, tcs, timeout) = _listeners[i];\n   50 |             if (timeout < _time.Elapsed)\n   51 |             {\n   52 |                 _listeners.RemoveAt(i);\n   53 |                 i--;\n   54 |                 tcs.SetResult(null);\n   55 |             }\n   56 |         }\n   57 |         if(_listeners.Count == 0)\n   58 |             _timeoutTimer.Stop();","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/Clipboard/EventStreamWindow.cs#L44-L58"}]},{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In X11ClipboardImpl.StoreAtomsInClipboardManager, the method skips storing atoms for the clipboard manager if dataTransfer contains any non-text formats (line 59). This prevents clipboard manager persistence even for simple copy operations that happen to include both text and a bitmap or file. The check 'Any(f => !DataFormat.Text.Equals(f))' should probably be checking whether all formats are 'trivially small' rather than short-circuiting on any non-text format.","fix":"Consider allowing clipboard manager storage of text even when other formats are present, filtering out non-text formats from the TARGETS list sent to the clipboard manager rather than skipping the operation entirely.","locations":[{"ref":"src/Avalonia.X11/Selections/Clipboard/X11ClipboardImpl.cs:59","code":"   59 |         if (dataTransfer.Formats.Any(f => !DataFormat.Text.Equals(f)))","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/Clipboard/X11ClipboardImpl.cs#L59"}]},{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"XdndPosition coordinate packing in SendXdndPosition (line 562) uses C# int arithmetic '(rootPosition.X << 16) | rootPosition.Y'. If rootPosition.X >= 65536 (possible on very large multi-monitor virtual desktops), the shift overflows 32-bit int and the X coordinate is silently corrupted. The destination decodes with '(ushort)((message.ptr3 >> 16) & 0xFFFF)' which cannot recover an overflowed coordinate. Drags over large multi-monitor setups would have incorrect drop positions.","fix":"Mask coordinates to 16-bit range before packing: '((rootPosition.X & 0xFFFF) << 16) | (rootPosition.Y & 0xFFFF)'. Both source and the drop target already mask on the decode side; only the encode side needs fixing.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs:562","code":"  562 |                 (rootPosition.X << 16) | rootPosition.Y,","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs#L562"},{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:83-84","code":"   83 |         var screenX = (ushort)((message.ptr3 >> 16) & 0xFFFF);\n   84 |         var screenY = (ushort)(message.ptr3 & 0xFFFF);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L83-L84"}]},{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In X11DropTarget.OnXdndEnter, when 'hasExtraFormats' is true but XGetWindowPropertyAsIntPtrArray returns null (e.g., source window already gone), the code falls into the 'else' branch and reads ptr3/ptr4/ptr5 from the XdndEnter message. Per the XDND spec, when bit 0 of data.l[1] is set (more than 3 types), data.l[2..4] are undefined/unused and MUST NOT be treated as type atoms. This results in garbage atom values being added to the formats set, which may cause incorrect data format negotiation or errors when querying atoms.","fix":"When hasExtraFormats is true and the XdndTypeList property cannot be read, treat the drag as having no supported formats (leave 'formats' empty) rather than falling back to reading ptr3/ptr4/ptr5. Add an explicit 'else if (!hasExtraFormats)' guard.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:54-71","code":"   54 |         if (hasExtraFormats &&\n   55 |             XGetWindowPropertyAsIntPtrArray(_display, sourceWindow, _atoms.XdndTypeList, _atoms.ATOM) is { } formatList)\n   56 |         {\n   57 |             foreach (var format in formatList)\n   58 |             {\n   59 |                 if (format != 0)\n   60 |                     formats.Add(format);\n   61 |             }\n   62 |         }\n   63 |         else\n   64 |         {\n   65 |             if (message.ptr3 != 0)\n   66 |                 formats.Add(message.ptr3);\n   67 |             if (message.ptr4 != 0)\n   68 |                 formats.Add(message.ptr4);\n   69 |             if (message.ptr5 != 0)\n   70 |                 formats.Add(message.ptr5);\n   71 |         }","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L54-L71"}]},{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In X11DropTarget.OnXdndDrop, the XdndFinished message is only sent from DisposeCurrentDrag when drag.Dropped is true. However, the XdndFinished message is sent from DisposeCurrentDrag whether or not a Drop action was accepted (it checks ResultEffects). If the user's drop handler invokes another drag-and-drop or otherwise causes DisposeCurrentDrag to be called before drag.Dropped is set to true (line 150 comes after ProcessRawEvent at line 147), there is a window where the state is inconsistent. More specifically, if ProcessRawEvent throws, drag.Dropped is never set to true, DisposeCurrentDrag is not called (no try/finally), and the XdndFinished message is never sent, leaving the drag source hanging indefinitely.","fix":"Wrap lines 138-150 in a try/finally to ensure DisposeCurrentDrag() is always called even if ProcessRawEvent throws. Set drag.Dropped = true before calling ProcessRawEvent if appropriate, or set ResultEffects before the call.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:131-153","code":"  131 |     public void OnXdndDrop(in XClientMessageEvent message)\n  132 |     {\n  133 |         if (_currentDrag is not { } drag || message.ptr1 != drag.SourceWindow)\n  134 |             return;\n  135 | \n  136 |         var modifiers = GetModifiers();\n  137 | \n  138 |         var drop = new RawDragEvent(\n  139 |             _dragDropDevice,\n  140 |             RawDragEventType.Drop,\n  141 |             drag.InputRoot,\n  142 |             drag.LastPosition ?? default,\n  143 |             drag,\n  144 |             drag.ResultEffects,\n  145 |             modifiers);\n  146 | \n  147 |         _dragDropDevice.ProcessRawEvent(drop);\n  148 | \n  149 |         drag.ResultEffects = drop.Effects;\n  150 |         drag.Dropped = true;\n  151 | \n  152 |         DisposeCurrentDrag();\n  153 |     }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L131-L153"}]},{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In SelectionDataProvider.SendIncrDataToClientAsync (INCR clipboard sender), the ArrayPool buffer is rented on line 199 but only returned (line 225) if the while loop exits normally. If the await on line 204 or 217 throws an exception (e.g., due to UI thread teardown), the buffer is never returned to the pool, causing a permanent pool-slot leak.","fix":"Use a try/finally block around the while loop to guarantee 'ArrayPool<byte>.Shared.Return(buffer)' is always called.","locations":[{"ref":"src/Avalonia.X11/Selections/SelectionDataProvider.cs:199-225","code":"  199 |         var buffer = ArrayPool<byte>.Shared.Rent((int)Math.Min(_maximumPropertySize, data.Length));\n  200 |         var gotTimeout = false;\n  201 | \n  202 |         while (true)\n  203 |         {\n  204 |             var evt = await events.WaitForEventAsync(\n  205 |                 x =>\n  206 |                     x.type == XEventName.PropertyNotify &&\n  207 |                     x.PropertyEvent.atom == property &&\n  208 |                     x.PropertyEvent.state == 1,\n  209 |                 SelectionHelper.Timeout);\n  210 | \n  211 |             if (evt is null)\n  212 |             {\n  213 |                 gotTimeout = true;\n  214 |                 break;\n  215 |             }\n  216 | \n  217 |             var read = await data.ReadAsync(buffer, 0, buffer.Length);\n  218 |             if (read == 0)\n  219 |                 break;\n  220 | \n  221 |             XChangeProperty(Platform.Display, window, property, target, 8, PropertyMode.Replace, buffer, read);\n  222 |             OnActivity();\n  223 |         }\n  224 | \n  225 |         ArrayPool<byte>.Shared.Return(buffer);","lines":27,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/SelectionDataProvider.cs#L199-L225"}]},{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"InputHelper.subscribePointerEvents adds a listener for
