interForDelegate(s_iceIoErrorHandlerDelegate));\n   96 | \n   97 |             _currentSmcConn = smcConn;\n   98 |             _currentIceConn = SMLib.SmcGetIceConnection(smcConn);\n   99 | \n  100 |             Task.Run(() =>\n  101 |             {\n  102 |                 var token = _cancellationTokenSource.Token;\n  103 |                 while (!token.IsCancellationRequested) HandleRequests();\n  104 |             }, _cancellationTokenSource.Token);\n  105 |         }\n  106 | \n  107 |         public void Dispose()\n  108 |         {\n  109 |             if (_currentSmcConn == IntPtr.Zero) return;\n  110 | \n  111 |             s_nativeToManagedMapper.TryRemove(_currentSmcConn, out _);\n  112 | \n  113 |             _ = SMLib.SmcCloseConnection(_currentSmcConn, 1,\n  114 |                 new[] { $\"{nameof(X11PlatformLifetimeEvents)} was disposed in managed code.\" });\n  115 |         }","lines":70,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11PlatformLifetimeEvents.cs#L46-L115"}]},{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In XimInputMethod.SetCursorRect (X11Window.Xim.cs), the lambda posted to the dispatcher captures the '_queuedCursorRect' field by reference but then reads 'rc' from '_queuedCursorRect.Value' (line 38-39). If SetCursorRect is called a second time before the posted lambda runs, '_queuedCursorRect' is updated (line 33), 'needEnqueue' becomes false and no new lambda is posted. The existing lambda will then use the updated (second) rect value stored in '_queuedCursorRect', effectively coalescing the updates. This is intentional (as indicated by the 'needEnqueue' logic). However, the 'rect *= _parent._scaling' at line 44 uses the method parameter 'rect' (captured by the closure) rather than 'rc' (the snapshot), so it scales the ORIGINAL rect value passed to the FIRST SetCursorRect call, not the coalesced newer rect. The coalescing optimization is broken: the IME position will reflect the first call's rect rather than the latest.","fix":"On line 44, replace 'rect *= _parent._scaling' with 'rc *= _parent._scaling'. The variable 'rc' was read from '_queuedCursorRect.Value' on line 39 and represents the coalesced (most recent) cursor rect.","locations":[{"ref":"src/Avalonia.X11/X11Window.Xim.cs:32-57","code":"   32 |                 var needEnqueue = _queuedCursorRect == null;\n   33 |                 _queuedCursorRect = rect;\n   34 |                 if(needEnqueue)\n   35 |                     Dispatcher.UIThread.Post(() =>\n   36 |                     {\n   37 |                         if(_queuedCursorRect == null)\n   38 |                             return;\n   39 |                         var rc = _queuedCursorRect.Value;\n   40 |                         _queuedCursorRect = null;\n   41 | \n   42 |                         if (_parent._xic == IntPtr.Zero)\n   43 |                             return;\n   44 | \n   45 |                         rect *= _parent._scaling;\n   46 |                         \n   47 |                         var pt = new XPoint\n   48 |                         {\n   49 |                             X = (short)Math.Min(Math.Max(rect.X, short.MinValue), short.MaxValue),\n   50 |                             Y = (short)Math.Min(Math.Max(rect.Y + rect.Height, short.MinValue), short.MaxValue)\n   51 |                         };\n   52 | \n   53 |                         using var spotLoc = new Utf8Buffer(XNames.XNSpotLocation);\n   54 |                         var list = XVaCreateNestedList(0, spotLoc, ref pt, IntPtr.Zero);\n   55 |                         XSetICValues(_parent._xic, XNames.XNPreeditAttributes, list, IntPtr.Zero);\n   56 |                         XFree(list);\n   57 |                     }, DispatcherPriority.Background);","lines":26,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11Window.Xim.cs#L32-L57"}]},{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"The _NET_WM_SYNC_REQUEST state machine in X11Window does not guard against receiving two consecutive sync requests before ConfigureNotify arrives. If the WM sends a second _NET_WM_SYNC_REQUEST while _xSyncState == WaitConfigure, the new counter value overwrites _xSyncValue (lines 718-720), and the first counter value is never signaled back to the WM. This leaves the first sync counter permanently unsignaled, which can cause the WM to stop sending resize events or mark the window as unresponsive.","fix":"Before overwriting _xSyncValue on a new WM_SYNC_REQUEST, check if _xSyncState != None and if so, immediately signal the previous counter value before accepting the new one.","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:716-720","code":"  716 |                     else if (ev.ClientMessageEvent.ptr1 == _x11.Atoms._NET_WM_SYNC_REQUEST)\n  717 |                     {\n  718 |                         _xSyncValue.Lo = new UIntPtr(ev.ClientMessageEvent.ptr3.ToPointer()).ToUInt32();\n  719 |                         _xSyncValue.Hi = ev.ClientMessageEvent.ptr4.ToInt32();\n  720 |                         _xSyncState = XSyncState.WaitConfigure;","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11Window.cs#L716-L720"},{"ref":"src/Avalonia.X11/X11Window.cs:694-698","code":"  694 |                 if (_xSyncState == XSyncState.WaitConfigure)\n  695 |                 {\n  696 |                     _xSyncState = XSyncState.WaitPaint;\n  697 |                     EnqueuePaint();\n  698 |                 }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11Window.cs#L694-L698"}]},{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"_NET_WM_STATE client messages sent by ChangeWMAtoms always set data.l[3] (source indication) to 0. Per EWMH spec section 1.3, data.l[3] must be 1 for normal application requests (2 for pagers). Source indication 0 is technically invalid and can cause some strict window managers to mishandle or ignore maximize, fullscreen, topmost, and taskbar-visibility state changes.","fix":"Pass source indication 1 as the fourth argument to SendNetWMMessage. Change the call to: SendNetWMMessage(_x11.Atoms._NET_WM_STATE, (IntPtr)(enable ? 1 : 0), atoms[0], atoms.Length > 1 ? atoms[1] : IntPtr.Zero, (IntPtr)1, IntPtr.Zero);","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:1637-1643","code":" 1637 |             SendNetWMMessage(_x11.Atoms._NET_WM_STATE,\n 1638 |                 (IntPtr)(enable ? 1 : 0),\n 1639 |                 atoms[0],\n 1640 |                 atoms.Length > 1 ? atoms[1] : IntPtr.Zero,\n 1641 |                 atoms.Length > 2 ? atoms[2] : IntPtr.Zero,\n 1642 |                 atoms.Length > 3 ? atoms[3] : IntPtr.Zero\n 1643 |             );","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11Window.cs#L1637-L1643"}]},{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"The beforeInput handler in input.ts hard-codes start = 2 and end = 4 for inputType === 'insertCompositionText', overriding the actual target ranges that were already computed from args.getTargetRanges(). These magic numbers are not derived from the actual input and will report wrong caret offsets for composition text, potentially causing incorrect IME cursor positioning.","fix":"Remove the hardcoded override. Let the ranges computed from getTargetRanges() above be used for all inputTypes, including 'insertCompositionText'. If special handling is needed, derive the values from the actual event data.","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts:396-399","code":"  396 |             if (args.inputType === \"insertCompositionText\") {\n  397 |                 start = 2;\n  398 |                 end = start + 2;\n  399 |             }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Browser/Avalonia.Browser/webapp/modules/avalonia/input.ts#L396-L399"}]},{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In sw.ts, the service worker fetch handler on line 69 calls map.delete(url) and then uses data.rs as the response body, but never checks whether the ReadableStream was correctly transferred via the MessagePort before responding. If the 'message' event handler at line 57 set data.rs using a MessagePortSource that has not yet emitted any data, the fetch handler still responds immediately. More importantly, the service worker responds with null return value (return null) instead of letting the event fall through when data is not found - service workers should call event.respondWith() only when handling the request; returning null has no effect.","fix":"Replace 'if (!data) return null;' with 'if (!data) return;' - returning null from a fetch event handler is not meaningful; simply returning without calling respondWith correctly delegates to the browser's default fetch.","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/sw.ts:69-78","code":"   69 | globalThis.addEventListener(\"fetch\", evt => {\n   70 |     const url = (evt as any).request.url;\n   71 |     const map = (self as any).map;\n   72 |     const data = map.get(url);\n   73 |     if (!data) return null;\n   74 |     map.delete(url);\n   75 |     (evt as any).respondWith(new Response(data.rs, {\n   76 |         headers: data.headers\n   77 |     }));\n   78 | });","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Browser/Avalonia.Browser/webapp/modules/sw.ts#L69-L78"}]},{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In DrawingContextImpl.DrawRectangle() the outset shadow loop checks !boxShadow.IsInset on line 437, then inside the branch redundantly checks if (boxShadow.IsInset) on line 442 and negates spread (line 443). Since IsInset is already known to be false at this point, the spread negation branch is dead code. The existing variable 'spread' is always the positive value.","fix":"Remove the if (boxShadow.IsInset) spread = -spread; block inside the outset shadow loop since it is unreachable.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:437-443","code":"  437 |                 if (boxShadow != default && !boxShadow.IsInset)\n  438 |                 {\n  439 |                     using (var shadow = BoxShadowFilter.Create(_boxShadowPaint, boxShadow, _currentOpacity))\n  440 |                     {\n  441 |                         var spread = (float)boxShadow.Spread;\n  442 |                         if (boxShadow.IsInset)\n  443 |                             spread = -spread;","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L437-L443"}]},{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"WM_DPICHANGED wParam unpacking reads the HIWORD (Y / vertical DPI) when it should read the LOWORD (X / horizontal DPI). Per MSDN, LOWORD(wParam) is the new horizontal DPI and HIWORD(wParam) is the new vertical DPI. The code uses '(uint)wParam >> 16' which isolates the high 16 bits (vertical DPI). On the rare non-square-pixel display where X-DPI != Y-DPI the scaling factor would be wrong. On standard monitors the values are identical so there is no observable bug.","fix":"Change to '_dpi = (uint)(ushort)(uint)wParam;' (or equivalently '(uint)(ushort)ToInt32(wParam)') to extract the LOWORD (horizontal DPI) as documented by MSDN.","locations":[{"ref":"src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs:194","code":"  194 |                         _dpi = (uint)wParam >> 16;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs#L194"}]},{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"`IOSStorageItem.DeleteAsync` (line 83) calls\n`SecurityScopedAncestorUrl.StartAccessingSecurityScopedResource()` but ignores its\n`bool` return value. If the call returns `false` (access denied or resource\nunavailable), the subsequent `NSFileManager.Remove` will fail with a permissions\nerror that surfaces as a misleading `NSErrorException` rather than a clear\n\"access denied\" error. Contrast with `SaveBookmarkAsync` (line 141) and\n`CreateFileAsync` (line 274) which correctly check the return value and bail early.","fix":"Check the return value: `if (!SecurityScopedAncestorUrl.StartAccessingSecurityScopedResource()) return Task.FromException(new UnauthorizedAccessException(...));` before attempting the file removal.","locations":[{"ref":"src/iOS/Avalonia.iOS/Storage/IOSStorageItem.cs:79-93","code":"   79 |     public Task DeleteAsync()\n   80 |     {\n   81 |         try\n   82 |         {\n   83 |             SecurityScopedAncestorUrl.StartAccessingSecurityScopedResource();\n   84 | \n   85 |             return NSFileManager.DefaultManager.Remove(Url, out var error)\n   86 |                 ? Task.CompletedTask\n   87 |                 : Task.FromException(new NSErrorException(error));\n   88 |         }\n   89 |         finally\n   90 |         {\n   91 |             SecurityScopedAncestorUrl.StopAccessingSecurityScopedResource();\n   92 |         }\n   93 |     }","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/Storage/IOSStorageItem.cs#L79-L93"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"critical","easy":true,"description":"The __IID_DEF macro materializes GUID Data4 bytes entirely from d42, ignoring d43 through d48. All COM interface IDs share the same last 6 bytes, which will cause QueryInterface to match the wrong interface or fail to differentiate interfaces at runtime.","fix":"Fix the macro to use each parameter: {0x ## d41, 0x ## d42, 0x ## d43, 0x ## d44, 0x ## d45, 0x ## d46, 0x ## d47, 0x ## d48 }","locations":[{"ref":"native/Avalonia.Native/inc/com.h:47-48","code":"   47 | #define __IID_DEF(name,d1,d2,d3, d41, d42, d43, d44, d45, d46, d47, d48) extern \"C\" const GUID IID_ ## name = {0x ## d1, 0x ## d2, 0x ## d3, \\\n   48 | {0x ## d41, 0x ## d42, 0x ## d42, 0x ## d42, 0x ## d42, 0x ## d42, 0x ## d42, 0x ## d42 } };","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/inc/com.h#L47-L48"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"critical","easy":true,"description":"LtrbRect.ToSKRect() passes r.Right as both the 'left' and 'right' arguments to SKRect, making the X coordinate equal to the right edge instead of the left. Any caller that converts an LtrbRect to an SKRect gets a zero-width rectangle shifted to the wrong X position, silently corrupting clips, bounds checks, and draw calls.","fix":"Change the second argument from (float)r.Right to (float)r.Top: return new SKRect((float)r.Left, (float)r.Top, (float)r.Right, (float)r.Bottom);","locations":[{"ref":"src/Skia/Avalonia.Skia/SkiaSharpExtensions.cs:84-87","code":"   84 |         internal static SKRect ToSKRect(this LtrbRect r)\n   85 |         {\n   86 |             return new SKRect((float)r.Left, (float)r.Right, (float)r.Right, (float)r.Bottom);\n   87 |         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/SkiaSharpExtensions.cs#L84-L87"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":true,"description":"In GlxDisplay.GetExtensions, the extension string is split on both comma and space (',' and ' '). GLX extension strings are space-separated only (per the GLX spec). The comma separator is likely a copy-paste from EGL extension parsing. Using a comma as a separator is harmless in practice since GLX extension names don't contain commas, but it is incorrect.","fix":"Remove ',' from the split characters: change 'new[] { ',', ' ' }' to 'new[] { ' ' }'.","locations":[{"ref":"src/Avalonia.X11/Glx/Glx.cs:120","code":"  120 | ","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Glx/Glx.cs#L120"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":true,"description":"`InputHandler.s_keys` maps `UIKeyboardHidUsage.KeyboardHyphen` to\n`PhysicalKey.NumPadSubtract` (line 432) and `UIKeyboardHidUsage.KeyboardEqualSign`\nto `PhysicalKey.NumPadEqual` (line 433). These HID usages refer to the main-keyboard\nhyphen/minus and equals keys, not the numpad equivalents. The physical key labels\non keyboards are `PhysicalKey.Minus` (HID 0x2D, the same usage as\n`KeyboardHyphen`) and `PhysicalKey.Equal` (HID 0x2E). Mapping them to numpad\nphysical keys causes incorrect shortcut matching and key display.","fix":"Change `PhysicalKey.NumPadSubtract` to `PhysicalKey.Minus` for `KeyboardHyphen`, and `PhysicalKey.NumPadEqual` to `PhysicalKey.Equal` for `KeyboardEqualSign`.","locations":[{"ref":"src/iOS/Avalonia.iOS/InputHandler.cs:432-433","code":"  432 |         [UIKeyboardHidUsage.KeyboardHyphen] = PhysicalKey.NumPadSubtract,\n  433 |         [UIKeyboardHidUsage.KeyboardEqualSign] = PhysicalKey.NumPadEqual,","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/InputHandler.cs#L432-L433"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","easy":true,"description":"AvnGlRenderTarget::BeginDrawing calls MakeCurrent (which locks the CGL context) and then calls prepareForGlRender. If prepareForGlRender fails (returns non-zero HRESULT), the function returns the error code early. The ComPtr<IUnknown> releaseContext is a local on the stack, so it will be destroyed and the CGL context will be unlocked, which is correct. However, the surface obtained from getNextSurfaceInSafeContext is leaked back into neither the queue nor any active slot - it is simply dropped. A newly allocated IOSurfaceHolder (including its IOSurface) that was just created is lost without being placed back or freed.","fix":"When prepareForGlRender fails, either return the surface back to the surface queue or present it so it can be reused. At minimum, add a comment that the IOSurface is intentionally discarded in the error path.","locations":[{"ref":"native/Avalonia.Native/src/OSX/rendertarget.mm:365-378","code":"  365 |     virtual HRESULT BeginDrawing(IAvnGlSurfaceRenderingSession** ret)  override\n  366 |     {\n  367 |         START_COM_ARP_CALL;\n  368 |         ComPtr<IUnknown> releaseContext;\n  369 |         @synchronized (_target->lock) {\n  370 |             auto surface = [_target getNextSurfaceInSafeContext];\n  371 |             _target->_glContext->MakeCurrent(releaseContext.getPPV());\n  372 |             HRESULT res = [surface prepareForGlRender];\n  373 |             if(res)\n  374 |                 return res;\n  375 |             *ret = new AvnGlRenderingSession(_target, surface, releaseContext);\n  376 |             return S_OK;\n  377 |         }\n  378 |     }","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/rendertarget.mm#L365-L378"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","easy":true,"description":"GlRenderTarget.BeginRenderingSession() calls SKSurface.Create() but never checks whether the returned surface is null. Skia returns null when the render target parameters are invalid (e.g. unsupported sample count on a driver). A null SKSurface is silently stored in GlGpuSession and will cause a NullReferenceException the first time drawing commands are issued.","fix":"Add a null check: if (surface == null) throw new InvalidOperationException(\"SKSurface.Create returned null\"); Dispose renderTarget and glSession in the failure path.","locations":[{"ref":"src/Skia/Avalonia.Skia/Gpu/OpenGl/GlRenderTarget.cs:92-98","code":"   92 |                     var surface = SKSurface.Create(_grContext, renderTarget,\n   93 |                         glSession.IsYFlipped ? GRSurfaceOrigin.TopLeft : GRSurfaceOrigin.BottomLeft,\n   94 |                         colorType, _surfaceProperties);\n   95 | \n   96 |                     success = true;\n   97 | \n   98 |                     return new GlGpuSession(_grContext, renderTarget, surface, glSession);","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/Gpu/OpenGl/GlRenderTarget.cs#L92-L98"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","easy":false,"description":"In WglDisplay.CreateContext(), when context creation succeeds the debug-message\ncallback is installed (via wglMakeCurrent + s_glDebugMessageCallback) BEFORE\nverifying that the context is valid (context != IntPtr.Zero check comes after).\nIf s_glDebugMessageCallback is non-null and context is zero (wglCreateContextAttribsArb\nfailed), the code tries to call wglMakeCurrent(dc, 0) which would clear the bootstrap\ncontext, and then falls through to the next version without restoring state. More\ncritically: the WglRestoreContext constructor always calls wglMakeCurrent(dc, context),\nso passing a zero context crashes with an OpenGlException before the check at line 156.\nActually the flow tries to install the debug callback regardless of whether context!=0,\nbut WglRestoreContext will throw if context is 0 since it will fail to make a null\ncontext current. That exception propagates out of CreateContext uncaught, leaking the\n`window` HWND and `dc` HDC that were already obtained.","fix":"Move the debug callback installation block (lines 150-154) inside the\n`if (context != IntPtr.Zero)` check, or check context before attempting to use it.\nAlso ensure that when all versions fail and null is returned, the window and dc\ncreated at lines 119-121 are properly released before returning null.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/WglDisplay.cs:150-163","code":"  150 |                     if (s_glDebugMessageCallback is not null)\n  151 |                     {\n  152 |                         using (new WglRestoreContext(dc, context, null))\n  153 |                             s_glDebugMessageCallback(Marshal.GetFunctionPointerForDelegate(_debugCallback), IntPtr.Zero);\n  154 |                     }\n  155 | \n  156 |                     if (context != IntPtr.Zero)\n  157 |                         return new WglContext(shareContext, version, context, window, dc,\n  158 |                             _defaultPixelFormat, _defaultPfd);\n  159 |                 }\n  160 | \n  161 |                 WglGdiResourceManager.ReleaseDC(window, dc);\n  162 |                 WglGdiResourceManager.DestroyWindow(window);\n  163 |                 return null;","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OpenGl/WglDisplay.cs#L150-L163"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":true,"description":"AvnSoftwareRenderTarget::SetFrame calls [_target setSwFrame:fb] and ignores its HRESULT return value, always returning 0 (S_OK) to the caller. If setSwFrame fails (e.g., IOSurfaceLock returns an error, or the pixel format is invalid), the error is silently swallowed and the caller believes the frame was committed successfully.","fix":"Capture and propagate the return value: HRESULT res = [_target setSwFrame:fb]; return res;","locations":[{"ref":"native/Avalonia.Native/src/OSX/rendertarget.mm:398-402","code":"  398 |     HRESULT SetFrame(AvnFramebuffer *fb) override {\n  399 |         START_COM_ARP_CALL;\n  400 |         [_target setSwFrame: fb];\n  401 |         return 0;\n  402 |     }","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/rendertarget.mm#L398-L402"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":true,"description":"AndroidStorageFile.MoveAsync() catches Exception broadly and calls newFile?.DeleteAsync() without awaiting it in the catch block. This means the cleanup delete runs fire-and-forget; if it fails, the error is silently swallowed. Additionally, the function returns null after the non-awaited cleanup, leaving a dangling empty file on the device.","fix":"Await newFile.DeleteAsync() in the catch block: catch { if (newFile != null) await newFile.DeleteAsync(); }","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs:643-667","code":"  643 |         async Task<AndroidStorageFile?> MoveFileByCopy()\n  644 |         {\n  645 |             var newFile = await storageFolder.CreateFileAsync(Name) as AndroidStorageFile;\n  646 | \n  647 |             try\n  648 |             {\n  649 |                 if (newFile != null)\n  650 |                 {\n  651 |                     using var input = await OpenReadAsync();\n  652 |                     using var output = await newFile.OpenWriteAsync();\n  653 | \n  654 |                     await input.CopyToAsync(output);\n  655 | \n  656 |                     await DeleteAsync();\n  657 | \n  658 |                     return new AndroidStorageFile(Activity, newFile.Uri, storageFolder);\n  659 |                 }\n  660 |             }\n  661 |             catch\n  662 |             {\n  663 |                 newFile?.DeleteAsync();\n  664 |             }\n  665 | \n  666 |             return null;\n  667 |         }","lines":25,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs#L643-L667"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"ScreenHelper.checkPermissions calls navigator.permissions.query with the non-standard 'window-management' permission name. This throws a TypeError in browsers that do not support that permission name (e.g., Firefox). The function has no try/catch, so the unhandled rejection propagates to the caller. At the call site in C# interop, this will appear as an unhandled JS exception.","fix":"Wrap the permissions.query call in try/catch: try { const { state } = await ...; if (state === 'granted') ... } catch { /* ignore unsupported permission */ }","locations":[{"ref":"src/Browser/Avalonia.Browser/webapp/modules/avalonia/screens.ts:21-27","code":"   21 |     public static async checkPermissions(globalThis: Window): Promise<void> {\n   22 |         // If previous session already granted \"window-management\" permissions, just re-request details, before they are used.\n   23 |         const { state } = await globalThis.navigator.permissions.query({ name: \"window-management\" } as any);\n   24 |         if (state === \"granted\") {\n   25 |             await this.requestDetailedScreens(globalThis);\n   26 |         }\n   27 |     }","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Browser/Avalonia.Browser/webapp/modules/avalonia/screens.ts#L21-L27"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"DxgiRenderTarget.BeginDrawCore() calls _swapChain.Present(0, 0) without checking\nfor DXGI_STATUS_OCCLUDED (0x087A0001). When a window is minimized or covered,\nPresent with SyncInterval=0 and no flags returns DXGI_STATUS_OCCLUDED (an S_ success\ncode, not an error), indicating that nothing was presented. The current code ignores\nthis return value entirely. While this does not cause a crash, it prevents the code\nfrom optimizing away renders when the window is not visible, and the DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING\nflag requires passing DXGI_PRESENT_ALLOW_TEARING when SyncInterval is 0, otherwise\nPresent returns DXGI_ERROR_INVALID_CALL.","fix":"Since _flagsUsed includes DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING, the Present call must\npass DXGI_PRESENT_ALLOW_TEARING (0x00000200) as the Flags parameter when SyncInterval\nis 0. Change the call to `_swapChain.Present(0, DXGI_PRESENT_ALLOW_TEARING)` and\ncheck for DXGI_STATUS_OCCLUDED to skip rendering when the window is invisible.","locations":[{"ref":"src/Windows/Avalonia.Win32/DirectX/DxgiRenderTarget.cs:139","code":"  139 |                     _swapChain.Present((ushort)0U, (ushort)0U);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/DirectX/DxgiRenderTarget.cs#L139"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"In AngleWin32EglDisplay.CreateD3D11Display(), the D3D11CreateDevice call (line 127-130)\nuses `out _` to discard the resulting feature level. If D3D11CreateDevice fails\n(returns a non-zero HRESULT), the P/Invoke is declared `PreserveSig = false` so it\nthrows. However the actual HRESULT check for pD3dDevice == IntPtr.Zero at line 133\nis the only guard. The problem is that D3D11CreateDevice can succeed (return S_OK)\nbut still write IntPtr.Zero to ppDevice on certain driver configurations, yet the\nerror message says \"Win32Exception\" which is misleading. More importantly, when\nchosenAdapter is non-null and D3D11CreateDevice fails with an exception,\n`using (chosenAdapter)` ensures adapter is released, but the D3D_DRIVER_TYPE passed\nis D3D_DRIVER_TYPE_UNKNOWN - when an adapter is explicitly given, this is correct.\nWhen pDxgiFactory is null (line 65 check fails silently and chosenAdapter stays null),\nD3D11CreateDevice is called with a null adapter pointer AND D3D_DRIVER_TYPE_UNKNOWN,\nwhich is an invalid combination (UNKNOWN requires a non-null adapter). The call will\nfail with DXGI_ERROR_INVALID_CALL.","fix":"When pDxgiFactory is null (CreateDXGIFactory1 failed), fall back to\nD3D_DRIVER_TYPE_HARDWARE with a null adapter instead of D3D_DRIVER_TYPE_UNKNOWN.\nOr treat a null factory as a fatal error and throw earlier rather than silently\nfalling through with an invalid device type.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/Angle/AngleWin32EglDisplay.cs:62-134","code":"   62 |             var dxgiFactoryGuid = MicroComRuntime.GetGuidFor(typeof(IDXGIFactory1));\n   63 |             DirectXUnmanagedMethods.CreateDXGIFactory1(ref dxgiFactoryGuid, out var pDxgiFactory);\n   64 |             IDXGIAdapter1? chosenAdapter = null;\n   65 |             if (pDxgiFactory != null)\n   66 |             {\n   67 |                 using var factory = MicroComRuntime.CreateProxyFor<IDXGIFactory1>(pDxgiFactory, true);\n   68 | \n   69 |                 var selectionCallback = AvaloniaLocator.Current.GetService<Win32PlatformOptions>()\n   70 |                     ?.GraphicsAdapterSelectionCallback;\n   71 |                 \n   72 |                 void* pAdapter = null;\n   73 |                 \n   74 |                 var applyArmAdrenoBlacklist = RuntimeInformation.ProcessArchitecture == Architecture.Arm64;\n   75 |                 \n   76 |                 // As for now, we only need to redefine default adapter only on ARM64 just in case of Adreno GPU.\n   77 |                 var redefineDefaultAdapter =\n   78 |                     selectionCallback != null\n   79 |                     || applyArmAdrenoBlacklist;\n   80 |                 \n   81 |                 if (redefineDefaultAdapter)\n   82 |                 {\n   83 |                     ushort adapterIndex = 0;\n   84 |                     var adapters = new List<(IDXGIAdapter1 adapter, PlatformGraphicsDeviceAdapterDescription desc)>();\n   85 |                     while (factory.EnumAdapters1(adapterIndex, &pAdapter) == 0)\n   86 |                     {\n   87 |                         var adapter = MicroComRuntime.CreateProxyFor<IDXGIAdapter1>(pAdapter, true);\n   88 |                         var desc = adapter.Desc1;\n   89 |                         var name = Marshal.PtrToStringUni(new IntPtr(desc.Description))?.ToLowerInvariant();\n   90 |                         var luid = BitConverter.GetBytes(desc.AdapterLuid);\n   91 |                         adapters.Add((adapter, new() { Description = name, DeviceLuid = luid }));\n   92 |                         adapterIndex++;\n   93 |                     }\n   94 | \n   95 |                     if (adapters.Count == 0)\n   96 |                         throw new OpenGlException(\"No adapters found\");\n   97 | \n   98 |                     if (applyArmAdrenoBlacklist && adapters.Count > 1)\n   99 |                     {\n  100 |                         for (var c = adapters.Count - 1; c >= 0; c--)\n  101 |                             if (adapters[c].desc.Description?.Contains(\"adreno\") == true)\n  102 |                             {\n  103 |                                 adapters[c].adapter.Dispose();\n  104 |                                 adapters.RemoveAt(c);\n  105 |                             }\n  106 |                     }\n  107 | \n  108 |                     var chosenAdapterIndex = 0;\n  109 |                     if (selectionCallback != null)\n  110 |                         chosenAdapterIndex = selectionCallback(adapters.Select(a => a.desc).ToArray());\n  111 | \n  112 |                     chosenAdapter = adapters[chosenAdapterIndex].adapter.CloneReference();\n  113 | \n  114 |                     foreach (var a in adapters)\n  115 |                         a.adapter.Dispose();\n  116 |                 }\n  117 |                 else\n  118 |                 {\n  119 |                     if (factory.EnumAdapters1(0, &pAdapter) != 0)\n  120 |                         throw new OpenGlException(\"No adapters found\");\n  121 |                     chosenAdapter = MicroComRuntime.CreateProxyFor<IDXGIAdapter1>(pAdapter, true);\n  122 |                 }\n  123 |             }\n  124 | \n  125 |             IntPtr pD3dDevice;\n  126 |             using (chosenAdapter)\n  127 |                 DirectXUnmanagedMethods.D3D11CreateDevice(chosenAdapter?.GetNativeIntPtr() ?? IntPtr.Zero,\n  128 |                     D3D_DRIVER_TYPE.D3D_DRIVER_TYPE_UNKNOWN,\n  129 |                     IntPtr.Zero, 0, featureLevels, (uint)featureLevels.Length,\n  130 |                     7, out pD3dDevice, out _, null);\n  131 | \n  132 | \n  133 |             if (pD3dDevice == IntPtr.Zero)\n  134 |                 throw new Win32Exception(\"Unable to create D3D11 Device\");","lines":73,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OpenGl/Angle/AngleWin32EglDisplay.cs#L62-L134"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In X11DropTarget.OnXdndDrop, if ProcessRawEvent throws an exception, 'drag.Dropped' remains false, and DisposeCurrentDrag will skip sending XdndFinished (line 196-199). The drag source then waits for XdndFinished until it times out (DragDropTimeoutManager fires). This produces a noticeable delay (SelectionHelper.Timeout) before the drag operation completes from the source's perspective.","fix":"Wrap ProcessRawEvent in a try/catch in OnXdndDrop. In the catch, set drag.Dropped = true with DragDropEffects.None as result so XdndFinished is still sent to unblock the source.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:131-153","code":"  131 |     public void OnXdndDrop(in XClientMessageEvent message)\n  132 |     {\n  133 |         if (_currentDrag is not { } drag || message.ptr1 != drag.SourceWindow)\n  134 |             return;\n  135 | \n  136 |         var modifiers = GetModifiers();\n  137 | \n  138 |         var drop = new RawDragEvent(\n  139 |             _dragDropDevice,\n  140 |             RawDragEventType.Drop,\n  141 |             drag.InputRoot,\n  142 |             drag.LastPosition ?? default,\n  143 |             drag,\n  144 |             drag.ResultEffects,\n  145 |             modifiers);\n  146 | \n  147 |         _dragDropDevice.ProcessRawEvent(drop);\n  148 | \n  149 |         drag.ResultEffects = drop.Effects;\n  150 |         drag.Dropped = true;\n  151 | \n  152 |         DisposeCurrentDrag();\n  153 |     }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L131-L153"},{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:189-202","code":"  189 |     private void DisposeCurrentDrag()\n  190 |     {\n  191 |         if (_currentDrag is not { } drag)\n  192 |             return;\n  193 | \n  194 |         _currentDrag = null;\n  195 | \n  196 |         if (drag.Dropped)\n  197 |         {\n  198 |             var resultAction = XdndActionHelper.EffectsToAction(drag.ResultEffects, _atoms);\n  199 |             SendXdndMessage(_atoms.XdndFinished, drag, resultAction == 0 ? 0 : 1, resultAction, 0, 0);\n  200 |         }\n  201 | \n  202 |         drag.Dispose();","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L189-L202"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"D3D11AngleWin32PlatformGraphics.CreateContext(IEnumerable<GlVersion>) throws an\nOpenGlException with the message \"Unable to create context with requested version\"\nwhen the version list does not include OpenGLES 3.x. However the check\n`versions.All(v => v.Type != GlProfileType.OpenGLES || v.Major != 3)` is an\noverly strict filter: it rejects any list that does not contain exactly an ES3\ncontext, including ES 3.1 or ES 3.2 requests (Major == 3 but Minor != 0). Since\nANGLE supports ES 3.1/3.2, this is an unnecessary restriction that would throw\nfor valid version requests.","fix":"Change the check to accept any OpenGLES 3.x version:\n`versions.All(v => v.Type != GlProfileType.OpenGLES || v.Major < 3)`.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/Angle/D3D11AngleWin32PlatformGraphics.cs:61-64","code":"   61 |     public IGlContext CreateContext(IEnumerable<GlVersion>? versions)\n   62 |     {\n   63 |         if (versions is not null && versions.All(v => v.Type != GlProfileType.OpenGLES || v.Major != 3))\n   64 |             throw new OpenGlException(\"Unable to create context with requested version\");","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OpenGl/Angle/D3D11AngleWin32PlatformGraphics.cs#L61-L64"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","easy":false,"description":"PointerButtonChangeType is declared as : ulong (8 bytes) but the native Win32 type POINTER_BUTTON_CHANGE_TYPE is a DWORD (4 bytes / uint). With Pack=1 layout, every struct that embeds POINTER_INFO is 4 bytes larger than its native counterpart: POINTER_INFO is 96 bytes in C# vs 92 bytes in Win32; POINTER_TOUCH_INFO is 144 vs 140; POINTER_PEN_INFO is 120 vs 116. Single-element P/Invoke calls (GetPointerInfo, GetPointerTouchInfo, GetPointerPenInfo) are unaffected because Windows writes 92 bytes into the C# allocation and the extra 4 bytes remain zero, leaving the enum comparison intact. However, array P/Invoke calls (GetPointerInfoHistory, GetPointerTouchInfoHistory, GetPointerPenInfoHistory) use MarshalAs(UnmanagedType.LPArray), which lays out a contiguous C-style array. Windows writes elements with native stride while the C# runtime reads with the inflated stride. Elements at index 1 and beyond are deserialized from the wrong memory offset, causing corrupted position, button, and timestamp data for all historical pointer events past the first.","fix":"Change 'public enum PointerButtonChangeType : ulong' to ': uint'. The values (0-10) fit comfortably in 32 bits. This restores native struct size and fixes array stride for all GetPointer*History calls.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:989-1002","code":"  989 |         public enum PointerButtonChangeType : ulong\n  990 |         {\n  991 |             POINTER_CHANGE_NONE,\n  992 |             POINTER_CHANGE_FIRSTBUTTON_DOWN,\n  993 |             POINTER_CHANGE_FIRSTBUTTON_UP,\n  994 |             POINTER_CHANGE_SECONDBUTTON_DOWN,\n  995 |             POINTER_CHANGE_SECONDBUTTON_UP,\n  996 |             POINTER_CHANGE_THIRDBUTTON_DOWN,\n  997 |             POINTER_CHANGE_THIRDBUTTON_UP,\n  998 |             POINTER_CHANGE_FOURTHBUTTON_DOWN,\n  999 |             POINTER_CHANGE_FOURTHBUTTON_UP,\n 1000 |             POINTER_CHANGE_FIFTHBUTTON_DOWN,\n 1001 |             POINTER_CHANGE_FIFTHBUTTON_UP\n 1002 |         }","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L989-L1002"},{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:1068-1091","code":" 1068 |         [StructLayout(LayoutKind.Sequential, Pack = 1)]\n 1069 |         public struct POINTER_INFO\n 1070 |         {\n 1071 |             public PointerInputType pointerType;\n 1072 |             public uint pointerId;\n 1073 |             public uint frameId;\n 1074 |             public PointerFlags pointerFlags;\n 1075 |             public IntPtr sourceDevice;\n 1076 |             public IntPtr hwndTarget;\n 1077 |             public int ptPixelLocationX;\n 1078 |             public int ptPixelLocationY;\n 1079 |             public int ptHimetricLocationX;\n 1080 |             public int ptHimetricLocationY;\n 1081 |             public int ptPixelLocationRawX;\n 1082 |             public int ptPixelLocationRawY;\n 1083 |             public int ptHimetricLocationRawX;\n 1084 |             public int ptHimetricLocationRawY;\n 1085 |             public uint dwTime;\n 1086 |             public uint historyCount;\n 1087 |             public int inputData;\n 1088 |             public ModifierKeys dwKeyStates;\n 1089 |             public ulong PerformanceCount;\n 1090 |             public PointerButtonChangeType ButtonChangeType;\n 1091 |         }","lines":24,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L1068-L1091"},{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:1226-1241","code":" 1226 |         public static extern bool GetPointerInfoHistory(uint pointerId, ref int entriesCount, [MarshalAs(UnmanagedType.LPArray), In, Out] POINTER_INFO[] pointerInfos);\n 1227 | \n 1228 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1229 |         public static extern bool GetPointerPenInfo(uint pointerId, out POINTER_PEN_INFO penInfo);\n 1230 | \n 1231 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1232 |         public static extern bool GetPointerPenInfoHistory(uint pointerId, ref int entriesCount, [MarshalAs(UnmanagedType.LPArray), In, Out] POINTER_PEN_INFO[] penInfos);\n 1233 | \n 1234 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1235 |         public static extern bool GetPointerTouchInfo(uint pointerId, out POINTER_TOUCH_INFO touchInfo);\n 1236 | \n 1237 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1238 |         public static extern bool GetPointerDeviceRects(IntPtr device, out RECT pointerDeviceRect, out RECT displayRect);\n 1239 | \n 1240 |         [DllImport(\"user32.dll\", SetLastError = true)]\n 1241 |         public static extern bool GetPointerTouchInfoHistory(uint pointerId, ref int entriesCount, [MarshalAs(UnmanagedType.LPArray), In, Out] POINTER_TOUCH_INFO[] touchInfos);","lines":16,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L1226-L1241"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","easy":false,"description":"`LayerFbo.Dispose` deletes all three GL objects (framebuffer, depth renderbuffer,\ncolor renderbuffer) at lines 91-93 and only then checks whether the EAGL context is\ncurrent at line 94. Because OpenGL ES operations on a non-current context produce\nundefined behavior (typically a no-op or a crash in the driver), the deletes at\n91-93 silently operate on the wrong context. The context check that follows then\nthrows `InvalidOperationException` even though the (incorrectly performed) deletes\nhave already \"executed.\" The GL resource names are leaked on the GPU.","fix":"Move the context check to the top of `Dispose`, before any GL calls: check that `_context == EAGLContext.CurrentContext` first, throw (or make the context current) if it is not, then perform the GL deletes. `SizeSynchronizedLayerFbo.Dispose` already checks first (line 138) - mirror that pattern.","locations":[{"ref":"src/iOS/Avalonia.iOS/Eagl/LayerFbo.cs:86-96","code":"   86 |         public void Dispose()\n   87 |         {\n   88 |             if(_disposed)\n   89 |                 return;\n   90 |             _disposed = true;\n   91 |             _gl.DeleteFramebuffer(_framebuffer);\n   92 |             _gl.DeleteRenderbuffer(_depthBuffer);\n   93 |             _gl.DeleteRenderbuffer(_renderbuffer);\n   94 |             if (_context != EAGLContext.CurrentContext)\n   95 |                 throw new InvalidOperationException(\"Associated EAGLContext is not current\");\n   96 |         }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/Eagl/LayerFbo.cs#L86-L96"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":false,"description":"AndroidStorageFile.GetVirtualFileStream() opens an AssetFileDescriptor via OpenTypedAssetFileDescriptor but neither closes the descriptor itself nor wraps it in a using block. The returned stream (from asset.CreateInputStream() or asset.CreateOutputStream()) is returned to the caller, but the AssetFileDescriptor is not closed when the stream is closed. AssetFileDescriptor holds a native file descriptor that will only be released by GC finalization.","fix":"Wrap the AssetFileDescriptor in a using statement or return a wrapper stream that closes both the inner stream and the descriptor on Dispose.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs:521-537","code":"  521 |     private static Stream? GetVirtualFileStream(Context context, AndroidUri uri, bool isOutput)\n  522 |     {\n  523 |         var mimeTypes = context.ContentResolver?.GetStreamTypes(uri, FilePickerFileTypes.All.MimeTypes![0]);\n  524 |         if (mimeTypes?.Length >= 1)\n  525 |         {\n  526 |             var mimeType = mimeTypes[0];\n  527 |             var asset = context.ContentResolver!\n  528 |                 .OpenTypedAssetFileDescriptor(uri, mimeType, null);\n  529 | \n  530 |             var stream = isOutput\n  531 |                 ? asset?.CreateOutputStream()\n  532 |                 : asset?.CreateInputStream();\n  533 | \n  534 |             return stream;\n  535 |         }\n  536 | \n  537 |         return null;","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/Storage/AndroidStorageItem.cs#L521-L537"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":true,"description":"SurfaceRenderTarget.Dispose() calls _canvas.Dispose() on a canvas that was obtained from SKSurface.Canvas. SKSurface owns its canvas; the canvas reference must not be independently disposed. Disposing it before disposing the surface can lead to use-after-free in Skia's native layer when the surface destructor subsequently touches the canvas.","fix":"Remove _canvas.Dispose(); - only dispose _surface (which disposes its canvas internally).","locations":[{"ref":"src/Skia/Avalonia.Skia/SurfaceRenderTarget.cs:97-100","code":"   97 |         {\n   98 |             _canvas.Dispose();\n   99 |             _surface.Dispose();\n  100 |         }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/SurfaceRenderTarget.cs#L97-L100"}]},{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":true,"description":"`TextInputResponder.TextContentType` is initialized to `new NSString(\"text/plain\")`\n(line 74). The `UITextContentType` constants that iOS recognizes are strings like\n`UITextContentTypeUsername`, `UITextContentTypePassword`, etc. (all under the\n`com.apple.UIKit.field.` namespace). The MIME type `\"text/plain\"` is not a valid\n`UITextContentType` identifier; iOS silently ignores unknown content types, so the\nautofill system never activates for any field including password fields. This means\npassword managers and keychain autofill do not suggest credentials even when\n`IsSecureEntry` is true.","fix":"Set `TextContentType` to `UITextContentType.Password.ToString()` when `IsSecureEntry` is true, or to an empty string (`NSString.Empty`) to let the system infer the type. Wire the assignment to `SetOptions` so it mirrors the `ContentType`.","locations":[{"ref":"src/iOS/Avalonia.iOS/TextInputResponder.Properties.cs:74","code":"   74 |         [Export(\"textContentType\")] public NSString TextContentType { get; set; } = new NSString(\"text/plain\");","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/TextInputResponder.Properties.cs#L74"}]},{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"ComPtr::operator& returns &_obj directly without calling Release first (unlike getPPV). Code that uses &ptr to obtain an output pointer (e.g. SomeAPI(&ptr)) bypasses the existing object without releasing it, leaking the prior reference. getPPV exists for this purpose but operator& is still exposed and will silently cause leaks.","fix":"Either remove operator& or make it behave like getPPV by releasing the current object first.","locations":[{"ref":"native/Avalonia.Native/inc/comimpl.h:137-140","code":"  137 |     TInterface** operator&()\n  138 |     {\n  139 |         return &_obj;\n  140 |     }","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/inc/comimpl.h#L137-L140"}]},{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"In the XDND drag source (X11DragSource), no explicit XGrabPointer call is made. The code relies on the implicit pointer grab from the triggering ButtonPress event (comment at line 86: 'Assume we have an implicit grab here'). However, calling 'triggerEvent.Pointer.Capture(null)' at line 32 releases the Avalonia-level capture. If the X11 implicit grab was already released before DoDragDropAsync is called, pointer events from outside the source window will not be delivered, silently breaking cross-window drag.","fix":"After releasing the Avalonia pointer capture, explicitly call XGrabPointer on the source window to ensure pointer events are captured throughout the drag operation, and update UngrabPointer to call XUngrabPointer on the explicit grab.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs:32","code":"   32 |         triggerEvent.Pointer.Capture(null);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs#L32"},{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs:86-87","code":"   86 |             // Assume we have an implicit grab here.\n   87 |             _pointerGrabbed = true;","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs#L86-L87"}]},{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"GetWindowLongPtrW (aliased as GetWindowLongPtr) is declared with return type 'uint' (32 bits). On 64-bit Windows, GetWindowLongPtrW returns a LONG_PTR (64 bits). For GWL_STYLE / GWL_EXSTYLE the values are always 32-bit style flags so truncation does not occur in practice. However the declaration violates the P/Invoke contract and would silently truncate pointer-sized values (e.g., GWL_WNDPROC or GWL_USERDATA on 64-bit) if the function is ever called with those indices.","fix":"Change the return type to 'nint' (or 'IntPtr') to match the 64-bit LONG_PTR return type of GetWindowLongPtrW. The wrapper GetWindowLong() that casts the result to WindowStyles would need a corresponding update.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs:1345-1346","code":" 1345 |         [DllImport(\"user32.dll\", SetLastError = true, EntryPoint = \"GetWindowLongPtrW\", ExactSpelling = true)]\n 1346 |         public static extern uint GetWindowLongPtr(IntPtr hWnd, int nIndex);","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/Interop/UnmanagedMethods.cs#L1345-L1346"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","easy":false,"description":"SurfaceInfo.Size (a property getter) calls XResizeWindow as a side effect on every read (line 328). This is unexpected for a property getter and means any code that reads the size also triggers a resize X11 call. This property is invoked from the render thread to synchronize the render window size, but the side-effect-in-getter pattern is fragile: reading Size twice will call XResizeWindow twice, and the side effect is invisible to callers.","fix":"Extract the resize logic into a dedicated method (e.g., 'SyncRenderWindowSize') and have the Size getter return only the current geometry. Callers that need the resize behavior should call SyncRenderWindowSize explicitly.","locations":[{"ref":"src/Avalonia.X11/X11Window.cs:322-332","code":"  322 |             public PixelSize Size\n  323 |             {\n  324 |                 get\n  325 |                 {\n  326 |                     XLockDisplay(_display);\n  327 |                     XGetGeometry(_display, _parent, out var geo);\n  328 |                     XResizeWindow(_display, Handle, geo.width, geo.height);\n  329 |                     XUnlockDisplay(_display);\n  330 |                     return new PixelSize(geo.width, geo.height);\n  331 |                 }\n  332 |             }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11Window.cs#L322-L332"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","easy":true,"description":"DrawingContextImpl.ConfigureGradientBrush() calls gradientBrush.GradientStops.Select(...).ToArray() twice - once for stop colors and once for stop offsets - iterating the stop collection twice and allocating two arrays per brush paint call. This occurs in hot rendering paths.","fix":"Iterate GradientStops once and fill both arrays in a single pass.","locations":[{"ref":"src/Skia/Avalonia.Skia/DrawingContextImpl.cs:913-914","code":"  913 |             var stopColors = gradientBrush.GradientStops.Select(s => s.Color.ToSKColor()).ToArray();\n  914 |             var stopOffsets = gradientBrush.GradientStops.Select(s => (float)s.Offset).ToArray();","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/DrawingContextImpl.cs#L913-L914"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","easy":true,"description":"AndroidMotionEventsHelper uses a static shared PooledList<RawPointerPoint> (s_intermediatePointsPooledList) for intermediate touch points. This list is captured inside a Lazy<> lambda and the Lazy is stored in RawTouchEventArgs. If two move events are dispatched before both Lazy values are evaluated, or if the Lazy is evaluated on a different thread, the shared list will be cleared and refilled, corrupting the first event's intermediate points.","fix":"Use a new list per event instead of a shared static, or ensure the Lazy is evaluated synchronously before processing the next event.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs:15","code":"   15 |         private static readonly PooledList<RawPointerPoint> s_intermediatePointsPooledList = new(ClearMode.Never);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs#L15"},{"ref":"src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs:65-78","code":"   65 |                         IntermediatePoints = new Lazy<IReadOnlyList<RawPointerPoint>?>(() =>\n   66 |                         {\n   67 |                             var site = e.HistorySize;\n   68 |                             s_intermediatePointsPooledList.Clear();\n   69 |                             s_intermediatePointsPooledList.Capacity = site;\n   70 | \n   71 |                             for (int pos = 0; pos < site; pos++)\n   72 |                             {\n   73 |                                 s_intermediatePointsPooledList.Add(CreateHistoricalPoint(e, index, pos));\n   74 |                             }\n   75 | \n   76 |                             return s_intermediatePointsPooledList;\n   77 |                         })\n   78 |                     };","lines":14,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/Specific/Helpers/AndroidMotionEventsHelper.cs#L65-L78"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"WakeupFd uses a static shared 1024-byte read buffer (s_readBuf = AllocHGlobal(1024)) for the Clear() read call. The pipe only ever has a single byte in it (Set() writes exactly one byte, Clear() reads one byte). Allocating 1024 bytes is wasteful, but more importantly the static buffer is shared across all WakeupFd instances without any synchronization. If multiple WakeupFd instances existed on different threads, they would race on the buffer. While currently only one WakeupFd exists per application, this is fragile design.","fix":"Use a stack-allocated 1-byte buffer (stackalloc byte[1]) inside Clear() instead of the shared static buffer. This avoids the shared mutable state entirely.","locations":[{"ref":"src/Avalonia.Wayland/Server/Interop/WakeupFd.cs:26-33","code":"   26 |     private static readonly void* s_readBuf = (void*)Marshal.AllocHGlobal(1024);\n   27 |     public void Clear()\n   28 |     {\n   29 |         lock (_lock)\n   30 |         {\n   31 |             if(!_signaled)\n   32 |                 return;\n   33 |             var readNow = read(_read, s_readBuf, 1);","lines":8,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Interop/WakeupFd.cs#L26-L33"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"GetCursorPos (called during BeginMoveDrag, BeginResizeDrag, and drawn-decoration mouse handling) invokes QueryPointer which calls XGrabServer. XGrabServer freezes all other X11 clients from interacting with the server while the pointer window tree is walked. On slow connections or busy desktops, this can cause visible freezes. The pointer position for these operations could be read with a simple XQueryPointer call (no grab needed) since the tree walk to find the deepest child is unnecessary here.","fix":"For GetCursorPos when called from drag/resize initiation, use XQueryPointer directly instead of QueryPointer. The full XGrabServer-based tree walk is needed only when the deepest child window must be found; cursor position for move/resize can be read with a single XQueryPointer call on the root window.","locations":[{"ref":"src/Avalonia.X11/XLib.cs:739-766","code":"  739 |         public static void QueryPointer (IntPtr display, IntPtr w, out IntPtr root, out IntPtr child,\n  740 |             out int root_x, out int root_y, out int child_x, out int child_y,\n  741 |             out XModifierMask mask)\n  742 |         {\n  743 | \n  744 |             IntPtr c;\n  745 | \n  746 |             XGrabServer (display);\n  747 | \n  748 |             XQueryPointer(display, w, out root, out c,\n  749 |                 out root_x, out root_y, out child_x, out child_y,\n  750 |                 out mask);\n  751 | \n  752 |             if (root != w)\n  753 |                 c = root;\n  754 | \n  755 |             IntPtr child_last = IntPtr.Zero;\n  756 |             while (c != IntPtr.Zero) {\n  757 |                 child_last = c;\n  758 |                 XQueryPointer(display, c, out root, out c,\n  759 |                     out root_x, out root_y, out child_x, out child_y,\n  760 |                     out mask);\n  761 |             }\n  762 |             XUngrabServer (display);\n  763 |             XFlush (display);\n  764 | \n  765 |             child = child_last;\n  766 |         }","lines":28,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/XLib.cs#L739-L766"},{"ref":"src/Avalonia.X11/X11Window.cs:1002-1007","code":" 1002 |                             var pos = GetCursorPos(_x11);\n 1003 |                             XUngrabPointer(_x11.Display, IntPtr.Zero);\n 1004 |                             SendNetWMMessage(_x11.Atoms._NET_WM_MOVERESIZE,\n 1005 |                                 (IntPtr)pos.x, (IntPtr)pos.y,\n 1006 |                                 (IntPtr)moveResizeSide.Value,\n 1007 |                                 (IntPtr)1, (IntPtr)1);","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11Window.cs#L1002-L1007"},{"ref":"src/Avalonia.X11/X11Window.cs:1412-1415","code":" 1412 |             var pos = GetCursorPos(_x11);\n 1413 |             XUngrabPointer(_x11.Display, new IntPtr(0));\n 1414 |             SendNetWMMessage (_x11.Atoms._NET_WM_MOVERESIZE, (IntPtr) pos.x, (IntPtr) pos.y,\n 1415 |                 (IntPtr) side,","lines":4,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/X11Window.cs#L1412-L1415"}]},{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"DxgiConnection.GetBestOutputToVWaitOn() retrieves monitor frequencies via\nGetAllMonitorFrequencies() on every call, which internally calls GetMonitorInfo and\nEnumDisplaySettings for every monitor. This function is called both during startup\nand after every WaitForVBlank failure (line 112). On systems with many monitors\nthis is an unnecessary repeated enumeration. Additionally the DXGI output selected\nis based only on the highest refresh rate monitor regardless of which monitor the\napplication window is on.","fix":"Cache the monitor frequency map and the chosen output. Invalidate the cache on\nWM_DISPLAYCHANGE. Consider selecting the output that contains the application's\nmain window rather than always the highest-refresh monitor.","locations":[{"ref":"src/Windows/Avalonia.Win32/DirectX/DxgiConnection.cs:134-185","code":"  134 |         private void GetBestOutputToVWaitOn()\n  135 |         {\n  136 |             double highestRefreshRate = 0.0d;\n  137 | \n  138 |             // IDXGIFactory Guid: [Guid(\"7B7166EC-21C7-44AE-B21A-C9AE321AE369\")]\n  139 |             Guid factoryGuid = MicroComRuntime.GetGuidFor(typeof(IDXGIFactory));\n  140 |             CreateDXGIFactory(ref factoryGuid, out var factPointer);\n  141 | \n  142 |             using var fact = MicroComRuntime.CreateProxyFor<IDXGIFactory>(factPointer, true);\n  143 | \n  144 |             void* adapterPointer = null;\n  145 | \n  146 |             ushort adapterIndex = 0;\n  147 | \n  148 |             Dictionary<HMONITOR /*MonitorHandler*/, uint /*Frequency*/> monitorFrequencies = GetAllMonitorFrequencies();\n  149 | \n  150 |             // this looks odd, but that's just how one enumerates adapters in DXGI \n  151 |             while (fact.EnumAdapters(adapterIndex, &adapterPointer) == 0)\n  152 |             {\n  153 |                 using var adapter = MicroComRuntime.CreateProxyFor<IDXGIAdapter>(adapterPointer, true);\n  154 |                 void* outputPointer = null;\n  155 |                 ushort outputIndex = 0;\n  156 |                 while (adapter.EnumOutputs(outputIndex, &outputPointer) == 0)\n  157 |                 {\n  158 |                     using var output = MicroComRuntime.CreateProxyFor<IDXGIOutput>(outputPointer, true);\n  159 |                     DXGI_OUTPUT_DESC outputDesc = output.Desc;\n  160 | \n  161 |                     var hMonitor = new HMONITOR(outputDesc.Monitor.Value);\n  162 | \n  163 |                     var frequency =\n  164 |                         monitorFrequencies.TryGetValue(hMonitor, out uint frequencyValue) ?\n  165 |                             frequencyValue :\n  166 |                             highestRefreshRate;\n  167 | \n  168 |                     if (highestRefreshRate < frequency)\n  169 |                     {\n  170 |                         // ooh I like this output! \n  171 |                         if (_output is not null)\n  172 |                         {\n  173 |                             _output.Dispose();\n  174 |                             _output = null;\n  175 |                         }\n  176 |                         _output = MicroComRuntime.CloneReference(output);\n  177 |                         highestRefreshRate = frequency;\n  178 |                     }\n  179 |                     // and then increment index to move onto the next monitor \n  180 |                     outputIndex++;\n  181 |                 }\n  182 |                 // and then increment index to move onto the next display adapater\n  183 |                 adapterIndex++;\n  184 |             }\n  185 | ","lines":52,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/DirectX/DxgiConnection.cs#L134-L185"},{"ref":"src/Windows/Avalonia.Win32/DirectX/DxgiConnection.cs:188-213","code":"  188 |         private unsafe Dictionary<HMONITOR /*MonitorHandler*/, uint /*Frequency*/> GetAllMonitorFrequencies()\n  189 |         {\n  190 |             var monitorHandlers = ScreenImpl.GetAllDisplayMonitorHandlers();\n  191 |             var dictionary = new Dictionary<HMONITOR /*MonitorHandler*/, uint /*Frequency*/>(monitorHandlers.Count);\n  192 | \n  193 |             foreach (var monitorHandler in monitorHandlers)\n  194 |             {\n  195 |                 var info = MONITORINFOEX.Create();\n  196 |                 var hMonitor = new HMONITOR(monitorHandler);\n  197 |                 PInvoke.GetMonitorInfo(hMonitor, (MONITORINFO*)&info);\n  198 | \n  199 |                 var deviceMode = new DEVMODEW\n  200 |                 {\n  201 |                     dmFields = DEVMODE_FIELD_FLAGS.DM_DISPLAYORIENTATION | DEVMODE_FIELD_FLAGS.DM_DISPLAYFREQUENCY,\n  202 |                     dmSize = (ushort)Marshal.SizeOf<DEVMODEW>()\n  203 |                 };\n  204 |                 PInvoke.EnumDisplaySettings(info.szDevice.ToString(), ENUM_DISPLAY_SETTINGS_MODE.ENUM_CURRENT_SETTINGS,\n  205 |                     ref deviceMode);\n  206 | \n  207 |                 var frequency = deviceMode.dmDisplayFrequency;\n  208 | \n  209 |                 dictionary[hMonitor] = frequency;\n  210 |             }\n  211 | \n  212 |             return dictionary;\n  213 |         }","lines":26,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/DirectX/DxgiConnection.cs#L188-L213"}]},{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"`InputHandler.s_intermediatePointsPooledList` is a `static readonly` shared list\n(line 17). Its `Lazy<>` factory (lines 92-105) captures `thisEvent` and the loop\nvariable `t` (the `UITouch` object) by closure, but the list itself is mutated\ninside the lazy. Because the list is shared across all touch points processed in a\nsingle call to `Handle`, and multiple `RawTouchEventArgs` objects each carry their\nown `Lazy<>` that references the same list, evaluating the lazy for the first event\nclears and repopulates the list, and evaluating it for subsequent events from the\nsame batch would produce wrong results (the list would have been cleared and\nrefilled for the later touch). In practice only one Lazy tends to be evaluated per\nframe so this does not visibly corrupt data, but it is a latent correctness hazard.","fix":"Make the pooled list an instance field instead of static, or capture a local copy of the list reference inside the lambda, or materialize the coalesced points eagerly and pass the list directly instead of using Lazy.","locations":[{"ref":"src/iOS/Avalonia.iOS/InputHandler.cs:17-17","code":"   17 |     private static readonly PooledList<RawPointerPoint> s_intermediatePointsPooledList = new(ClearMode.Never);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/InputHandler.cs#L17"},{"ref":"src/iOS/Avalonia.iOS/InputHandler.cs:92-106","code":"   92 |                 IntermediatePoints = evt is {} thisEvent ? new Lazy<IReadOnlyList<RawPointerPoint>?>(() =>\n   93 |                 {\n   94 |                     var coalesced = thisEvent.GetCoalescedTouches(t) ?? Array.Empty<UITouch>();\n   95 |                     s_intermediatePointsPooledList.Clear();\n   96 |                     s_intermediatePointsPooledList.Capacity = coalesced.Length - 1;\n   97 | \n   98 |                     // Skip the last one, as it is already processed point.\n   99 |                     for (var i = 0; i < coalesced.Length - 1; i++)\n  100 |                     {\n  101 |                         s_intermediatePointsPooledList.Add(ToPointerPoint(coalesced[i]));\n  102 |                     }\n  103 | \n  104 |                     return s_intermediatePointsPooledList;\n  105 |                 }) : null\n  106 |             };","lines":15,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/InputHandler.cs#L92-L106"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"In PlatformSettings.mm, the didChangeValueForKey: method is comment r's dispatched event but DragEnter's effect comes from the WaylandRawDragEvent which wraps the source effects, not the framework-modified effects.","fix":"Verify that dragEvent.Effects in HandleDragDropPostDispatch reflects the UI framework's accepted effects (after Input.Invoke), not the original sourceEffects. Since RawDragEvent.Effects is mutated by the framework handler, this should be correct. Add a comment making this explicit.","locations":[{"ref":"src/Avalonia.Wayland/WindowImplBase.DragDrop.cs:36-47","code":"   36 | \n   37 |                 var overEvent = new RawDragEvent(DragDropDevice.Instance, RawDragEventType.DragOver,\n   38 |                     InputRoot!, pos, dragMotion.DataTransfer, dragMotion.SourceEffects, mods);\n   39 |                 Parent.Input?.Invoke(overEvent);\n   40 | \n   41 |                 var effects = overEvent.Effects;\n   42 |                 dragMotion.OfferCookie?.PostUpdateFeedback(effects);\n   43 |                 return true;\n   44 |             }\n   45 | \n   46 |             return false;\n   47 |         }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/WindowImplBase.DragDrop.cs#L36-L47"},{"ref":"src/Avalonia.Wayland/WindowImplBase.DragDrop.cs:54-71","code":"   54 |         protected bool HandleDragDropPostDispatch(RawInputEventArgs args)\n   55 |         {\n   56 |             if (args is not WaylandRawDragEvent dragEvent)\n   57 |                 return false;\n   58 | \n   59 |             // Route DnD feedback through the session cookie, which resolves\n   60 |             // the correct data device on the Wayland thread.\n   61 |             if (dragEvent.Type is RawDragEventType.DragEnter)\n   62 |             {\n   63 |                 var effects = dragEvent.Effects;\n   64 |                 dragEvent.OfferCookie?.PostUpdateFeedback(effects);\n   65 |             }\n   66 |             else if (dragEvent.Type is RawDragEventType
