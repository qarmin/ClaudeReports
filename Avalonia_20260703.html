aMetalGpu.cs:47","code":"   47 |     public bool IsLost => false;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Skia/Avalonia.Skia/Gpu/Metal/SkiaMetalGpu.cs#L47"}]},{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"DirectCompositionConnection.TryCreateAndRegisterCore() creates an IDCompositionDesktopDevice\nproxy with `false` (no ownership) as the addRef parameter, then immediately wraps\nthe device in a `using` block. The MicroComRuntime.CreateProxyFor call with `false`\nmeans it won't AddRef the pointer, so when the `using` block calls Dispose, it will\nRelease a reference it didn't own, potentially decrementing the COM object's reference\ncount below zero. DirectCompositionShared then clones a reference from the same\n(possibly-invalid) object.","fix":"Pass `true` as the addRef argument to CreateProxyFor so the proxy owns the reference:\n`MicroComRuntime.CreateProxyFor<IDCompositionDesktopDevice>(cDevice, true)`.","locations":[{"ref":"src/Windows/Avalonia.Win32/DComposition/DirectCompositionConnection.cs:63-73","code":"   63 |                 var result = NativeMethods.DCompositionCreateDevice2(default, IID_IDCompositionDesktopDevice, out var cDevice);\n   64 |                 if (result != UnmanagedMethods.HRESULT.S_OK)\n   65 |                 {\n   66 |                     throw new Win32Exception((int)result);\n   67 |                 }\n   68 | \n   69 |                 using (var device = MicroComRuntime.CreateProxyFor<IDCompositionDesktopDevice>(cDevice, false))\n   70 |                 {\n   71 |                     var shared = new DirectCompositionShared(device);\n   72 |                     connect = new DirectCompositionConnection(shared);\n   73 |                 }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/DComposition/DirectCompositionConnection.cs#L63-L73"}]},{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In AlphaToMask (Win32Icon) the bit-set expression is '1 << (x % 8)' (LSB-first, bit 0 = leftmost pixel). However the Avalonia BlackWhite pixel format (used by AllocFramebuffer above) writes bits MSB-first (bit 7 = leftmost pixel, as per BlackWhitePixelFormatWriter). The manual bit-setting in the else branch uses the opposite convention, so the transparency mask is bit-reversed within each byte compared to what CreateBitmap with 1-bit depth expects.","fix":"Change '1 << (x % 8)' to '1 << (7 - x % 8)' to match MSB-first bit ordering expected by CreateBitmap with a 1-bit-per-pixel monochrome bitmap.","locations":[{"ref":"src/Windows/Avalonia.Win32/Interop/Win32Icon.cs:121","code":"  121 |                         pDest[x / 8] |= (byte)(1 << (x % 8));","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/Interop/Win32Icon.cs#L121"}]},{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"WglGdiResourceManager.Worker() processes only ONE item per AutoResetEvent signal.\nThe loop calls `s_event.WaitOne()`, dequeues exactly one job, then loops back to\nWaitOne(). If multiple callers enqueue jobs in rapid succession and only one Set()\nraces through before Worker() re-enters WaitOne(), subsequent jobs sit in the queue\nwithout a corresponding signal and the callers will block forever (or until another\nSet() happens for an unrelated reason).\n\nExample: two threads each call CreateOffscreenWindow() simultaneously. Both enqueue\nand both call Set(). Worker wakes, processes the first job, calls WaitOne() again.\nIf both Sets were already consumed by the first WaitOne(), the second job is never\nprocessed.","fix":"After dequeueing and processing a job, check if the queue still has items and\ncontinue processing without waiting: replace the single `Dequeue` with a loop inside\n`lock(s_queue)` that drains all available items, or use `Set()` again if the queue\nis non-empty after processing one item.","locations":[{"ref":"src/Windows/Avalonia.Win32/OpenGl/WglGdiResourceManager.cs:73-111","code":"   73 |     private static void Worker()\n   74 |     {\n   75 |         while (true)\n   76 |         {\n   77 |             s_event.WaitOne();\n   78 |             lock (s_queue)\n   79 |             {\n   80 |                 if(s_queue.Count == 0)\n   81 |                     continue;\n   82 |                 var job = s_queue.Dequeue();\n   83 |                 if (job is GetDCOp getDc)\n   84 |                     getDc.Result.TrySetResult(UnmanagedMethods.GetDC(getDc.Window));\n   85 |                 else if (job is ReleaseDCOp releaseDc)\n   86 |                 {\n   87 |                     UnmanagedMethods.ReleaseDC(releaseDc.Window, releaseDc.DC);\n   88 |                     releaseDc.Result.SetResult(null);\n   89 |                 }\n   90 |                 else if (job is CreateWindowOp createWindow)\n   91 |                     createWindow.Result.TrySetResult(UnmanagedMethods.CreateWindowEx(\n   92 |                         0,\n   93 |                         s_windowClass,\n   94 |                         null,\n   95 |                         (int)UnmanagedMethods.WindowStyles.WS_OVERLAPPEDWINDOW,\n   96 |                         0,\n   97 |                         0,\n   98 |                         640,\n   99 |                         480,\n  100 |                         IntPtr.Zero,\n  101 |                         IntPtr.Zero,\n  102 |                         IntPtr.Zero,\n  103 |                         IntPtr.Zero));\n  104 |                 else if (job is DestroyWindowOp destroyWindow)\n  105 |                 {\n  106 |                     UnmanagedMethods.DestroyWindow(destroyWindow.Window);\n  107 |                     destroyWindow.Result.TrySetResult(null);\n  108 |                 }\n  109 |             }\n  110 |         }\n  111 |     }","lines":39,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/OpenGl/WglGdiResourceManager.cs#L73-L111"}]},{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In WinUIEffectBase.GetSource(), the bounds check is `index > _sources.Length`\n(strictly greater than), so calling GetSource(_sources.Length) would return\n_sources[_sources.Length] which is an ArrayIndexOutOfRangeException (an exception\nrather than the intended COMException). The condition should be `index >= _sources.Length`.","fix":"Change `index > _sources.Length` to `index >= _sources.Length`.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUIEffectBase.cs:38-40","code":"   38 |             if (_sources == null || index> _sources.Length)\n   39 |                 throw new COMException(\"Invalid index\", unchecked((int)0x80070057));\n   40 |             return _sources[index];","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WinRT/Composition/WinUIEffectBase.cs#L38-L40"}]},{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In WinUiCompositionShared the MinAcrylicVersion (10.0.15063) is older than\nMinWinCompositionVersion (10.0.17134). WinUiCompositedWindowSurface.IsBlurSupported\nchecks `Win32Platform.WindowsVersion >= WinUiCompositionShared.MinAcrylicVersion`\nfor Acrylic, which would return true on Windows 10 1703 (build 15063). But\nWinUiCompositorConnection.IsSupported() requires build 17134 (1803). So on build\n15063-17133, IsBlurSupported(Acrylic) returns true but the compositor is never\ninitialized, meaning SetBlur(Acrylic) is called on a null _window reference in\nWinUiCompositedWindowSurface, causing NullReferenceException.","fix":"Change the Acrylic version check in IsBlurSupported to also require at least\nMinWinCompositionVersion, or raise MinAcrylicVersion to match MinWinCompositionVersion.","locations":[{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositedWindowSurface.cs:47-53","code":"   47 |         {\n   48 |             BlurEffect.None => true,\n   49 |             BlurEffect.Acrylic => Win32Platform.WindowsVersion >= WinUiCompositionShared.MinAcrylicVersion,\n   50 |             BlurEffect.MicaLight => Win32Platform.WindowsVersion >= WinUiCompositionShared.MinHostBackdropVersion,\n   51 |             BlurEffect.MicaDark => Win32Platform.WindowsVersion >= WinUiCompositionShared.MinHostBackdropVersion,\n   52 |             _ => false\n   53 |         };","lines":7,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositedWindowSurface.cs#L47-L53"},{"ref":"src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionShared.cs:16-18","code":"   16 |     public static readonly Version MinWinCompositionVersion = new(10, 0, 17134);\n   17 |     public static readonly Version MinAcrylicVersion = new(10, 0, 15063);\n   18 |     public static readonly Version MinHostBackdropVersion = new(10, 0, 22000);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WinRT/Composition/WinUiCompositionShared.cs#L16-L18"}]},{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"_trackingMouse is never set to true anywhere in the codebase (the field itself even carries a TODO comment: '//ToDo - there is something missed. Needs investigation @Steven Kirk'). The guard 'if (!_trackingMouse)' at line 358 of AppWndProc.cs therefore always evaluates to true, and TrackMouseEvent is called on every single WM_MOUSEMOVE message instead of once per mouse-enter. The performance cost is a system call on each mouse move. The intended behaviour - call once and then wait for WM_MOUSELEAVE before re-arming - is never achieved.","fix":"Add '_trackingMouse = true;' immediately after the TrackMouseEvent call (around line 369). The existing WM_MOUSELEAVE handler already sets it back to false at line 441.","locations":[{"ref":"src/Windows/Avalonia.Win32/WindowImpl.cs:92","code":"   92 |         private bool _trackingMouse;//ToDo - there is something missed. Needs investigation @Steven Kirk","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WindowImpl.cs#L92"},{"ref":"src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs:358-369","code":"  358 |                         if (!_trackingMouse)\n  359 |                         {\n  360 |                             var tm = new TRACKMOUSEEVENT\n  361 |                             {\n  362 |                                 cbSize = Marshal.SizeOf<TRACKMOUSEEVENT>(),\n  363 |                                 dwFlags = 2,\n  364 |                                 hwndTrack = _hwnd,\n  365 |                                 dwHoverTime = 0,\n  366 |                             };\n  367 | \n  368 |                             TrackMouseEvent(ref tm);\n  369 |                         }","lines":12,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs#L358-L369"},{"ref":"src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs:440-441","code":"  440 |                         }\n  441 |                         _trackingMouse = false;","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Windows/Avalonia.Win32/WindowImpl.AppWndProc.cs#L440-L441"}]},{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"`AvaloniaSceneDelegate.WillConnect` guards initialization with:\n```csharp\nif (session.Configuration.Name is not null || ...) return;\n```\nThis means initialization is skipped whenever the scene session has a\nconfiguration name. UIKit scene sessions created through Info.plist always carry a\nnon-null name (the name from the `UISceneConfigurations` entry). An app that\nconfigures `AvaloniaSceneDelegate` as the scene delegate in its `Info.plist` would\nhave a named session, and `WillConnect` would silently return without creating the\n`AvaloniaView` or `UIWindow`, leaving the screen blank. Only sessions whose\nconfiguration was created programmatically with `name = null` (as\n`AvaloniaAppDelegate.GetConfiguration` does) work correctly.","fix":"Remove the `session.Configuration.Name is not null` guard or invert it to allow named configurations. A better discriminator is checking whether the configuration's `DelegateType` is `typeof(AvaloniaSceneDelegate)`, which correctly identifies Avalonia-owned sessions regardless of name.","locations":[{"ref":"src/iOS/Avalonia.iOS/AvaloniaSceneDelegate.cs:15-23","code":"   15 |     {\n   16 |         if (session.Configuration.Name is not null ||\n   17 |             scene is not UIWindowScene windowScene ||\n   18 |             Application.Current?.ApplicationLifetime is not SingleViewLifetime lifetime)\n   19 |         {\n   20 |             return;\n   21 |         }\n   22 | \n   23 |         Window = new UIWindow(windowScene);","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/AvaloniaSceneDelegate.cs#L15-L23"}]},{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"`UIPresentationControllerDelegate.Dispose` (lines 424-427) can invoke\n`_dismissHandler` a second time. Normal flow: UIKit calls `DidDismiss` which\ninvokes `_dismissHandler` and sets it to `null`; Xamarin later disposes the\ndelegate and `Dispose` checks `_dismissHandler?.Invoke()` - which is already null,\nso it's a no-op. However, if UIKit disposes the delegate WITHOUT first calling\n`DidDismiss` (which can happen when the picker is dismissed programmatically or\nduring scene teardown), `Dispose` invokes `_dismissHandler` and then does NOT set\nit to `null`. If `Dispose` is then called again (e.g. via finalizer or double\ndispose), `_dismissHandler` fires again, causing `tcs.TrySetResult` to be called\ntwice (harmless because of `Try`) but potentially triggering the inner lambda a\nsecond time with side-effects. The safer fix is to null the handler in `Dispose`\nafter invoking it.","fix":"In `Dispose`:\n```csharp\nprotected override void Dispose(bool disposing)\n{\n    _dismissHandler?.Invoke();\n    _dismissHandler = null;\n    base.Dispose(disposing);\n}\n```","locations":[{"ref":"src/iOS/Avalonia.iOS/Storage/IOSStorageProvider.cs:411-428","code":"  411 |     private class UIPresentationControllerDelegate : UIAdaptivePresentationControllerDelegate\n  412 |     {\n  413 |         private Action? _dismissHandler;\n  414 | \n  415 |         internal UIPresentationControllerDelegate(Action dismissHandler)\n  416 |             => this._dismissHandler = dismissHandler;\n  417 | \n  418 |         public override void DidDismiss(UIPresentationController presentationController)\n  419 |         {\n  420 |             _dismissHandler?.Invoke();\n  421 |             _dismissHandler = null;\n  422 |         }\n  423 | \n  424 |         protected override void Dispose(bool disposing)\n  425 |         {\n  426 |             _dismissHandler?.Invoke();\n  427 |             base.Dispose(disposing);\n  428 |         }","lines":18,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/Storage/IOSStorageProvider.cs#L411-L428"}]},{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"`GetPositionCore(fromPosition, direction, offset)` (lines 341-363) handles only\n`UITextLayoutDirection.Left` and `UITextLayoutDirection.Right` in its switch\nstatement. `UITextLayoutDirection.Up` and `UITextLayoutDirection.Down` fall through\nwithout modifying `newPosition`, so the function returns the same position\nregardless of the offset for vertical directions. iOS calls this method when\nhandling vertical arrow-key movement and certain assistive-technology navigation\ngestures; always returning the original position makes vertical cursor movement via\nthe UITextInput API a no-op.","fix":"Handle `Up` and `Down` in the switch by moving backward/forward by `offset` (same as `Left`/`Right` for single-column text). For multi-line text a proper line-hit-test through the `TextPresenter` would be needed, but even the simple offset logic is better than a no-op.","locations":[{"ref":"src/iOS/Avalonia.iOS/TextInputResponder.cs:341-363","code":"  341 |         private AvaloniaTextPosition? GetPositionCore(AvaloniaTextPosition fromPosition, UITextLayoutDirection inDirection, nint offset)\n  342 |         {\n  343 |             var newPosition = fromPosition.Index;\n  344 | \n  345 |             switch (inDirection)\n  346 |             {\n  347 |                 case UITextLayoutDirection.Left:\n  348 |                     newPosition -= (int)offset;\n  349 |                     break;\n  350 | \n  351 |                 case UITextLayoutDirection.Right:\n  352 |                     newPosition += (int)offset;\n  353 |                     break;\n  354 |             }\n  355 | \n  356 |             if (newPosition < 0)\n  357 |                 return null;\n  358 | \n  359 |             if (newPosition > DocumentLength)\n  360 |                 return null;\n  361 | \n  362 |             return new AvaloniaTextPosition(newPosition);\n  363 |         }","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/iOS/Avalonia.iOS/TextInputResponder.cs#L341-L363"}]},{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"ComPtr::operator= uses pass-by-value (takes a copy of the source) and does not guard against self-assignment. When the same object is assigned to itself, Release is called before AddRef on the same underlying pointer, potentially destroying the object before the re-assignment completes if the ref count is 1.","fix":"Add a self-assignment guard: if (_obj == other._obj) return *this; at the top of operator=.","locations":[{"ref":"native/Avalonia.Native/inc/comimpl.h:73-81","code":"   73 |     ComPtr& operator=(ComPtr other)\n   74 |     {\n   75 |         if(_obj != NULL)\n   76 |             _obj->Release();\n   77 |         _obj = other._obj;\n   78 |         if(_obj != NULL)\n   79 |             _obj->AddRef();\n   80 |         return *this;\n   81 |     }","lines":9,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/inc/comimpl.h#L73-L81"}]},{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"TopLevelImpl::PointToClient and PointToScreen call [[[NSScreen screens] firstObject] frame] without checking whether [NSScreen screens] is empty. On headless or server environments, the screens array can be empty, making firstObject return nil and the NSMaxY call return 0 instead of crashing (Objective-C sends to nil), but silently producing wrong coordinates.","fix":"Guard with: if ([NSScreen screens].count == 0) return E_FAIL; before relying on firstObject.","locations":[{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:203","code":"  203 |         auto primaryDisplayHeight = NSMaxY([[[NSScreen screens] firstObject] frame]);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L203"},{"ref":"native/Avalonia.Native/src/OSX/TopLevelImpl.mm:243","code":"  243 |         auto primaryDisplayHeight = NSMaxY([[[NSScreen screens] firstObject] frame]);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/native/Avalonia.Native/src/OSX/TopLevelImpl.mm#L243"}]},{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"AvaloniaActivity.ActivityResult and AvaloniaActivity.RequestPermissionsResult are plain Action/event fields (not proper events), so any code holding a reference to the activity can set them to null or replace them entirely, breaking other subscribers. AndroidStorageProvider relies on += and -= on these fields, which works, but a buggy external subclass can wipe all subscribers by assigning null.","fix":"Change the field types from Action<...>? to proper event EventHandler<...> delegates so the add/remove semantics are encapsulated.","locations":[{"ref":"src/Android/Avalonia.Android/AvaloniaActivity.cs:33-34","code":"   33 |     public Action<int, Result, Intent?>? ActivityResult { get; set; }\n   34 |     public Action<int, string[], Permission[]>? RequestPermissionsResult { get; set; }","lines":2,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/AvaloniaActivity.cs#L33-L34"}]},{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"AvaloniaActivity.OnResume() unconditionally forces LayoutInDisplayCutoutMode.ShortEdges on every resume, overriding any value set by AndroidInsetsManager.UpdateDisplayEdgeToEdgeState() (which may set LayoutInDisplayCutoutMode.Default when edge-to-edge is disabled). This means the insets manager's cutout mode setting is reset to ShortEdges on every resume, potentially showing content under the display cutout unexpectedly.","fix":"Delegate the cutout mode setting entirely to AndroidInsetsManager and remove the forced ShortEdges override from OnResume( vity.Window?.DecorView.ViewTreeObserver?.AddOnGlobalLayoutListener(this);\n  108 |             }\n  109 | \n  110 |             DisplayEdgeToEdgePreference = false;\n  111 | \n  112 |             ViewCompat.SetWindowInsetsAnimationCallback(Window.DecorView, this);\n  113 |         }","lines":10,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/AndroidInsetsManager.cs#L104-L113"}]},{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"AndroidPlatformSettings.OnViewConfigurationChanged() throws ArgumentOutOfRangeException when UiMode is UiMode.NightUndefined or any value not matching NightYes/NightNo. This can happen on some devices or Android versions that report an unexpected night-mode value, causing a crash instead of a graceful fallback.","fix":"Add a default case that returns a fallback value, e.g. _ => _latestValues.ThemeVariant (keep existing value), instead of throwing.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/AndroidPlatformSettings.cs:59-64","code":"   59 |         PlatformThemeVariant systemTheme = (configuration.UiMode & UiMode.NightMask) switch\n   60 |         {\n   61 |             UiMode.NightYes => PlatformThemeVariant.Dark,\n   62 |             UiMode.NightNo => PlatformThemeVariant.Light,\n   63 |             _ => throw new ArgumentOutOfRangeException()\n   64 |         };","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/AndroidPlatformSettings.cs#L59-L64"}]},{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"CommitTextCommand.Apply() computes the new cursor position as: newCursor = newCursorPosition > 0 ? Selection.Start + newCursorPosition - 1 : Selection.Start + newCursorPosition - _text.Length. After Replace() the selection already moves to the end of the inserted text, but newCursor is computed relative to Selection.Start before the Replace. The correct base should be the insertion point (realStart or Composition.Start) + _text.Length, not the pre-Replace Selection.Start.","fix":"Capture the insertion point before calling Replace(), then compute newCursor relative to insertPoint + _text.Length for positive newCursorPosition, and insertPoint for negative, matching the Android InputConnection contract.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/Input/EditCommand.cs:147-170","code":"  147 |     internal class CommitTextCommand : EditCommand\n  148 |     {\n  149 |         private readonly string _text;\n  150 |         private readonly int _newCursorPosition;\n  151 | \n  152 |         public CommitTextCommand(string text, int newCursorPosition)\n  153 |         {\n  154 |             _text = text;\n  155 |             _newCursorPosition = newCursorPosition;\n  156 |         }\n  157 | \n  158 |         public override void Apply(TextEditBuffer buffer)\n  159 |         {\n  160 |             if (buffer.HasComposition)\n  161 |             {\n  162 |                 buffer.Replace(buffer.Composition!.Value.Start, buffer.Composition!.Value.End, _text);\n  163 |             }\n  164 |             else\n  165 |             {\n  166 |                 buffer.Replace(buffer.Selection.Start, buffer.Selection.End, _text);\n  167 |             }\n  168 |             var newCursor = _newCursorPosition > 0 ? buffer.Selection.Start + _newCursorPosition - 1 : buffer.Selection.Start + _newCursorPosition - _text.Length;\n  169 |             buffer.Selection = new TextSelection(newCursor, newCursor);\n  170 |         }","lines":24,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/Input/EditCommand.cs#L147-L170"}]},{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"PlatformSupport.GetNextRequestCode() uses a non-atomic post-increment (s_lastRequestCode++) on a static field, which is not thread-safe. If two threads (e.g. background tasks awaiting file pickers) call this concurrently, they may receive the same request code, causing one picker's result to be misrouted.","fix":"Use Interlocked.Increment(ref s_lastRequestCode) instead of s_lastRequestCode++.","locations":[{"ref":"src/Android/Avalonia.Android/Platform/PlatformSupport.cs:13","code":"   13 |     public static int GetNextRequestCode() => s_lastRequestCode++;","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Android/Avalonia.Android/Platform/PlatformSupport.cs#L13"}]},{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In FramePresenter.tsx, the constructor explicitly calls this.componentDidUpdate({ conn: null! }, this.state) before mounting. At this point, the component has not been mounted, canvasRef.current is null, and this.props is the real props. The intent seems to be to wire up frame listeners if a conn is already provided, but componentDidUpdate is a React lifecycle method designed to be called after an update, not in the constructor. Calling it manually can lead to unexpected behavior and violates the React component contract.","fix":"Remove the constructor call to componentDidUpdate. Move any initialization logic that needs to run once into componentDidMount.","locations":[{"ref":"src/Avalonia.DesignerSupport/Remote/HtmlTransport/webapp/src/FramePresenter.tsx:20-22","code":"   20 |         this.componentDidUpdate({\n   21 |             conn: null!\n   22 |         }, this.state);","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.DesignerSupport/Remote/HtmlTransport/webapp/src/FramePresenter.tsx#L20-L22"}]},{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"FramePresenter.tsx posts canvas resize messages to the parent frame with '*' as the targetOrigin, which sends the message to any origin. Since the parent is expected to be a VSCode webview (origin checked for incoming messages), using '*' for outgoing postMessage exposes canvas dimensions to any malicious iframe that might embed this page.","fix":"Replace the '*' targetOrigin with a specific expected origin or store the origin from the first validated incoming message and use it for replies: parent?.postMessage({ ... }, trustedOrigin);","locations":[{"ref":"src/Avalonia.DesignerSupport/Remote/HtmlTransport/webapp/src/FramePresenter.tsx:93-98","code":"   93 |             parent?.postMessage({\n   94 |                 type: 'resize',\n   95 |                 width: canvas.width / window.devicePixelRatio,\n   96 |                 height: canvas.height / window.devicePixelRatio,\n   97 |             }, '*');\n   98 |         }","lines":6,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.DesignerSupport/Remote/HtmlTransport/webapp/src/FramePresenter.tsx#L93-L98"}]},{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"The DRM format codes DRM_FORMAT_ARGB8888 and DRM_FORMAT_XRGB8888 are computed using DrmFormatCode('A','R','2','4') and DrmFormatCode('X','R','2','4') respectively. These are the correct standard DRM four-character codes (matching /usr/include/libdrm/drm_fourcc.h where AR24 = 0x34325241 and XR24 = 0x34325258). However the naming is confusing: 'AR24' is the FourCC shorthand for ARGB8888 (not 'ARGB') and the code uses '2' and '4' as the last two bytes rather than 'G' and 'B'. A future maintainer could mistake this for a copy-paste error and \"correct\" it to ('A','R','G','B') which would produce a completely wrong format code.","fix":"Add a comment explicitly stating these are the standard DRM fourcc codes (DRM_FORMAT_ARGB8888 = 0x34325241 = 'AR24') and cross-reference drm_fourcc.h. Optionally use the numeric constants directly with a comment instead of the character construction.","locations":[{"ref":"src/Avalonia.Wayland/Server/Interop/DrmGbmUnsafeNativeMethods.cs:46-50","code":"   46 |         public static uint DrmFormatCode(char a, char b, char c, char d) =>\n   47 |             (uint)a | ((uint)b << 8) | ((uint)c << 16) | ((uint)d << 24);\n   48 | \n   49 |         public static readonly uint DRM_FORMAT_ARGB8888 = DrmFormatCode('A', 'R', '2', '4');\n   50 |         public static readonly uint DRM_FORMAT_XRGB8888 = DrmFormatCode('X', 'R', '2', '4');","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Interop/DrmGbmUnsafeNativeMethods.cs#L46-L50"}]},{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In WXdgTopLevel.OnDisconnected, _decoration is destroyed and nulled but _decoration.Dispose() is not called (compare with OnConnected's DestroyDecoration helper which calls both Destroy and Dispose). This leaks the managed ZxdgToplevelDecorationV1 NWayland proxy on disconnect/reconnect cycles.","fix":"After _decoration.Destroy(), also call _decoration.Dispose() before setting _decoration = null, matching the pattern in DestroyDecoration().","locations":[{"ref":"src/Avalonia.Wayland/Server/Persistent/WSurface.cs:758-770","code":"  758 |     public override void OnDisconnected()\n  759 |     {\n  760 |         EventSink.OnKeyboardLeave();\n  761 |         foreach (var ex in _activeExports.ToList())\n  762 |             ex.Dispose();\n  763 |         _activeExports.Clear();\n  764 |         _decoration?.Destroy();\n  765 |         _decoration = null;\n  766 |         _xdgTopLevel?.Destroy();\n  767 |         _xdgTopLevel = null;\n  768 |         _pendingBatch = new();\n  769 |         base.OnDisconnected();\n  770 |     }","lines":13,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Persistent/WSurface.cs#L758-L770"}]},{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In WaylandEglDmaBufSurface.RenderTarget.BeginDrawCore, when no free buffer slot is found an InvalidOperationException is thrown. But the swapchain size is 4 and the frame callback is supposed to gate rendering (only render when no frame callback is pending). If all 4 slots are busy it means 4 frames were committed without compositor release events firing between them. Rather than throwing, the surface should return RenderTargetNotReadyException (which is the standard 'not ready' signal that callers handle gracefully) so the render loop backs off.","fix":"Replace 'throw new InvalidOperationException(\"No free buffer slots\")' with 'throw new RenderTargetNotReadyException()' so the compositor-side backpressure is surfaced as a retriable condition instead of a fatal error.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/Rendering/WaylandEglDmaBufSurface.cs:67-69","code":"   67 | \n   68 |             if (freeSlot == null)\n   69 |                 throw new InvalidOperationException(\"No free buffer slots available in swapchain\");","lines":3,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Transient/Rendering/WaylandEglDmaBufSurface.cs#L67-L69"}]},{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In WaylandFramebuffer.RenderTarget.Lock, if munmap succeeds but State.IsReady returns false (surface disconnected in the window between mmap and munmap), the callback returns early without closing the fd. The 'finally { close(fd); }' block is inside the LockedFramebuffer callback lambda, which is invoked by the caller of Lock when they're done rendering. But the fd is created before the lambda is constructed and passed in. If an exception is thrown during Attach or Commit after munmap, the fd is still closed in the finally. However, if fd is -1 from memfd_create but the code paths past 'close(fd); throw;' — fd is already closed at that point but map could still be valid IntPtr. Looking more carefully: if fd == -1 the code closes (-1) which is a no-op on Linux, then throws. This is actually correct. No real bug.","fix":"No fix needed. The fd lifecycle is correct.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/Rendering/WaylandFramebuffer.cs:53-101","code":"   53 |             var fd = memfd_create(\"avalonia-wayland-framebuffer\", MFD_CLOEXEC);\n   54 |             IntPtr map;\n   55 |             if (fd == -1\n   56 |                 || ftruncate(fd, bufferLen) != 0\n   57 |                 || new IntPtr(-1) == (map =\n   58 |                     mmap(IntPtr.Zero, bufferLen, PROT_READ | PROT_WRITE, MAP_SHARED, fd, IntPtr.Zero)))\n   59 |             {\n   60 |                 close(fd);\n   61 |                 throw new OutOfMemoryException(\"Unable to allocate framebuffer\");\n   62 |             }\n   63 | \n   64 |             properties = default;\n   65 |             return new LockedFramebuffer(map, size, stride,\n   66 |                 new Vector(96 * sceneInfo.Scaling, 96 * sceneInfo.Scaling),\n   67 |                 PixelFormats.Bgra8888, AlphaFormat.Premul, () =>\n   68 |                 {\n   69 |                     munmap(map, bufferLen);\n   70 |                     try\n   71 |                     {\n   72 |                         if (!State.IsReady)\n   73 |                             return;\n   74 | \n   75 |                         using var pool = _p._surface.Globals!.WlShm.CreatePool(fd, bufferLen);\n   76 |                         var listener = new BufferListener();\n   77 |                         var buffer = pool.CreateBuffer(0, size.Width, size.Height, stride,\n   78 |                             WlShm.FormatEnum.Argb8888, listener);\n   79 |                         \n   80 |                         // Stage per-frame state (frame callback +\n   81 |                         // ack_configure + geometry + viewport/scale +\n   82 |                         // min/max) into the next commit BEFORE binding the\n   83 |                         // buffer, then commit explicitly after attach +\n   84 |                         // damage. The base WSurface no longer issues the\n   85 |                         // commit itself.\n   86 |                         _p._surface.OnBeforeNewBufferAttached(sceneInfo);\n   87 |                         _p._surface.WlSurface!.Attach(buffer, 0, 0);\n   88 |                         // TODO: Support \"damage\" regions\n   89 |                         _p._surface.WlSurface.DamageBuffer(0, 0, size.Width, size.Height);\n   90 |                         _p._surface.WlSurface.Commit();\n   91 | \n   92 |                         // Surfaces that allocate buffers outside the throttled render loop must\n   93 |                         // flush the buffer's fd immediately: libwayland-client caps the number of\n   94 |                         // fds per wl_display_flush (~28, undocumented), and a roundtrip flushes.\n   95 |                         if (_p._surface.EnforceBufferCreationRoundtrip)\n   96 |                             _p._surface.Globals!.Connection.Queue.Roundtrip();\n   97 |                     }\n   98 |                     finally\n   99 |                     {\n  100 |                         close(fd);\n  101 |                     }","lines":49,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Transient/Rendering/WaylandFramebuffer.cs#L53-L101"}]},{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In WaylandInputDispatcher.Seat, EnsureDataDevice() is called from the constructor before OnInitialGlobalsBound is called. EnsureDataDevice checks if DataDeviceManager is available (it may not be yet since the seats can be announced before the data-device manager global), so the device may not be created. This is handled correctly by the deferred call in OnInitialGlobalsBound. However, if a seat is added after OnInitialGlobalsBound has already run, EnsureDataDevice in the constructor will fire and successfully create the device. Then OnInitialGlobalsBound iterates existing seats and calls EnsureDataDevice again. The check 'if (DataDevice != null) return' prevents double creation. But seat constructed after OnInitialGlobalsBound gets EnsureDataDevice called twice (once from constructor, once from OnSeatAdded which then calls TextInputV3?.OnSeatAdded). The TextInputV3 seat is added twice because both OnSeatAdded (which calls TextInputV3?.OnSeatAdded) and OnInitialGlobalsBound (which iterates and calls TextInputV3?.OnSeatAdded) can race for late-arriving seats.","fix":"In OnInitialGlobalsBound, only call TextInputV3?.OnSeatAdded for seats whose seat was added before OnInitialGlobalsBound ran. Mark a boolean _initialGlobalsBound and skip the TextInputV3.OnSeatAdded call from OnInitialGlobalsBound for seats that already had it called. Or, since WaylandTextInputV3.OnSeatAdded checks _seats.ContainsKey, this is already idempotent — no real bug, but the intent is unclear.","locations":[{"ref":"src/Avalonia.Wayland/Server/Transient/WaylandInputDispatcher.cs:80-101","code":"   80 |     internal void OnSeatAdded(uint globalName, WlRegistry registry, uint version)\n   81 |     {\n   82 |         var seat = new Seat(this, registry, globalName, version);\n   83 |         _seats[globalName] = seat;\n   84 |         TextInputV3?.OnSeatAdded(globalName, seat.WlSeat);\n   85 |     }\n   86 | \n   87 |     /// <summary>\n   88 |     /// Called once after <see cref=\"WaylandGlobals\"/> has bound all available\n   89 |     /// globals. Constructs the text-input-v3 facade if the manager is present\n   90 |     /// and backfills per-seat objects (data devices, text-input-v3 proxies)\n   91 |     /// for any seats that were announced before this point.\n   92 |     /// <\/summary>\n   93 |     internal void OnInitialGlobalsBound()\n   94 |     {\n   95 |         if (_globals.TextInputManagerV3 is { } manager)\n   96 |             TextInputV3 = new WaylandTextInputV3(manager);\n   97 |         foreach (var (globalName, seat) in _seats)\n   98 |         {\n   99 |             seat.EnsureDataDevice();\n  100 |             TextInputV3?.OnSeatAdded(globalName, seat.WlSeat);\n  101 |         }","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/Server/Transient/WaylandInputDispatcher.cs#L80-L101"}]},{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"The XkbCommonKeymap.ResolveKey method allocates bufSize = needed + 1 on the stack (stackalloc byte[bufSize]) where needed comes from an xkbcommon native call. xkb_state_key_get_utf8 can theoretically return large values for unusual keysyms (though in practice <= 6 bytes for any Unicode codepoint). If needed is large due to a corrupt keymap or future xkbcommon behavior, the stackalloc can overflow the thread stack without a guard. This is unlikely in practice but is an unbounded stackalloc on untrusted native input.","fix":"Add a cap: if needed > 256 (no legitimate single-key text is longer), fall back to heap allocation or return null. Typical needed values are 1-4 bytes for standard keys.","locations":[{"ref":"src/Avalonia.Wayland/XkbCommonKeymap.cs:84-88","code":"   84 |         var bufSize = needed + 1;\n   85 |         var buf = stackalloc byte[bufSize];\n   86 |         xkb_state_key_get_utf8(_state, xkbKey, buf, (IntPtr)bufSize);\n   87 | \n   88 |         var text = Encoding.UTF8.GetString(buf, needed);","lines":5,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/XkbCommonKeymap.cs#L84-L88"}]},{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"FilterKeySymbol suppresses the form feed character (\\f = 0x0C) by the control character filter (c < ' '), and suppresses escape (\\x1b) since it's not in the explicit allow-list. But escape is explicitly allowed via the condition `c != '\\x1b'` — however the comment says control chars are rejected. The filter allows \\b (backspace), \\t (tab), \\r (carriage return), and \\x1b (escape) but blocks \\n (line feed = 0x0A) which is a printable text character that some text editors expect. Users pressing Enter in a multi-line context expect \\n to be delivered as keySymbol.","fix":"Consider also allowing '\\n' (0x0A, line feed) in the whitelist. The current filter sends \\r but not \\n which may cause issues in editors that distinguish them. Alternatively, keep current behavior but document the decision.","locations":[{"ref":"src/Avalonia.Wayland/XkbKeyTransform.cs:370-386","code":"  370 |     internal static string? FilterKeySymbol(string? text)\n  371 |     {\n  372 |         if (text is null || text.Length == 0)\n  373 |             return null;\n  374 | \n  375 |         if (text.Length == 1)\n  376 |         {\n  377 |             var c = text[0];\n  378 |             // Reject control characters and DEL\n  379 |             if (c < ' ' && c != '\\b' && c != '\\t' && c != '\\r' && c != '\\x1b')\n  380 |                 return null;\n  381 |             if (c == '\\x7f')\n  382 |                 return null;\n  383 |         }\n  384 | \n  385 |         return text;\n  386 |     }","lines":17,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.Wayland/XkbKeyTransform.cs#L370-L386"}]},{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In GlibDispatcherImplBase.Signal, the flag _signaledSourceAdded is set to true before g_idle_add_full is called. If g_idle_add_full throws (rare but possible), _signaledSourceAdded remains true but no GLib source was added. Subsequent Signal() calls will skip adding a new source (due to the '_signaledSourceAdded' guard), and the signaled event will never be processed.","fix":"Set _signaledSourceAdded inside a try/catch, resetting it to false if g_idle_add_full throws, or set it only after the successful call.","locations":[{"ref":"src/Avalonia.X11/Dispatching/GlibDispatcherImplBase.cs:96-106","code":"   96 |         lock (_signalLock)\n   97 |         {\n   98 |             if(_signaled)\n   99 |                 return;\n  100 |             _signaled = true;\n  101 |             if(_signaledSourceAdded)\n  102 |                 return;\n  103 |             _signaledSourceAdded = true;\n  104 |         }\n  105 |         g_idle_add_full(G_PRIORITY_DEFAULT - 1, SignalSourceCallback);\n  106 |     }","lines":11,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Dispatching/GlibDispatcherImplBase.cs#L96-L106"}]},{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In X11PlatformThreading.RunLoop, the timer check at line 136 uses '_nextTimer < now' without checking for null: 'if (_nextTimer < now) continue'. Since _nextTimer is a 'long?' this compares a nullable long. The null-forgiving comparison 'nullable_long < long' evaluates to false when null, so this is technically correct but fragile. More importantly, line 123 uses '_nextTimer.HasValue && now > _nextTimer.Value', but line 136 uses '_nextTimer < now' (nullable comparison), meaning the two checks are semantically different: line 123 checks 'timer expired' and fires the Timer event, while line 136 checks 'timer already expired, skip sleeping' but uses a different null-comparison pattern. The inconsistency is confusing and 'continue' on line 136 skips the XFlush on re-entry.","fix":"Normalize the timer comparisons: use '_nextTimer.HasValue && _nextTimer.Value < now' on line 136 to match the style of line 123, making the intent clear.","locations":[{"ref":"src/Avalonia.X11/Dispatching/X11PlatformThreading.cs:119-141","code":"  119 |             while (!cancellationToken.IsCancellationRequested)\n  120 |             {\n  121 |                 var now = _clock.ElapsedMilliseconds;\n  122 |                 if (_nextTimer.HasValue && now > _nextTimer.Value)\n  123 |                 {\n  124 |                     Timer?.Invoke();\n  125 |                 }\n  126 | \n  127 |                 if (cancellationToken.IsCancellationRequested)\n  128 |                     return;\n  129 |                 \n  130 |                 //Flush whatever requests were made to XServer\n  131 |                 _x11Events.Flush();\n  132 |                 epoll_event ev;\n  133 |                 if (!_x11Events.IsPending)\n  134 |                 {\n  135 |                     now = _clock.ElapsedMilliseconds;\n  136 |                     if (_nextTimer < now)\n  137 |                         continue;\n  138 |                     \n  139 |                     var timeout = _nextTimer == null ? (int)-1 : Math.Max(1, _nextTimer.Value - now);\n  140 |                     epoll_wait(_epoll, &ev, 1, (int)Math.Min(int.MaxValue, timeout));\n  141 |                     ","lines":23,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Dispatching/X11PlatformThreading.cs#L119-L141"}]},{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In FindXdndTarget, the loop calls TryGetXdndTargetInfo on the root window first (line 469). If the root window itself somehow had an XdndAware property, the drag would target the root, which is almost certainly wrong. The XDND spec says walking should start at the top-level children of the root, not the root window itself.","fix":"Skip the TryGetXdndTargetInfo check when currentWindow == rootWindow, since the X root window is never an XDND target.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs:461-482","code":"  461 |         private XdndTargetInfo? FindXdndTarget(PixelPoint rootPosition)\n  462 |         {\n  463 |             var display = _platform.Display;\n  464 |             var rootWindow = _platform.Info.RootWindow;\n  465 |             var currentWindow = rootWindow;\n  466 | \n  467 |             while (currentWindow != 0)\n  468 |             {\n  469 |                 if (TryGetXdndTargetInfo(currentWindow) is { } info)\n  470 |                     return info;\n  471 | \n  472 |                 if (!XTranslateCoordinates(display, rootWindow, currentWindow, rootPosition.X, rootPosition.Y,\n  473 |                     out _, out _, out var childWindow))\n  474 |                 {\n  475 |                     return null;\n  476 |                 }\n  477 | \n  478 |                 currentWindow = childWindow;\n  479 |             }\n  480 | \n  481 |             return null;\n  482 |         }","lines":22,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DragSource.cs#L461-L482"}]},{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In X11DropTarget.OnXdndPosition (line 107), the XdndStatus response always sends ptr3=0 and ptr4=0 for the rectangle hint fields. While this is spec-compliant (it means 'no preferred rect, always re-send'), omitting a proper rectangle causes the drag source to flood the target with XdndPosition messages on every mouse move, since the source must re-send position whenever the pointer moves outside the given rectangle. This increases IPC traffic unnecessarily during drags.","fix":"Return the window's bounding rect in ptr3/ptr4 of XdndStatus. This tells the source it does not need to re-send XdndPosition unless the pointer moves outside the window bounds.","locations":[{"ref":"src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs:107","code":"  107 |         SendXdndMessage(_atoms.XdndStatus, drag, resultAction == 0 ? 0 : 1, 0, 0, resultAction);","lines":1,"link":"https://github.com/AvaloniaUI/Avalonia/blob/fd26b29594d4299baae537bedf62a7f8a9eb2026/src/Avalonia.X11/Selections/DragDrop/X11DropTarget.cs#L107"}]},{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In X11PlatformLifetimeEvents, the CancellationTokenSource (_cancellationTokenSource) is created unconditionally but the background task is only started when _currentSmcConn is non-zero. When SMC connection fails and the constructor returns early, the CancellationTokenSource is never disposed, and neither is _currentIceConn (which remains IntPtr.Zero). More importantly, the Dispose() method checks '_currentSmcConn == IntPtr.Zero' and returns early without canceling _cancellationTokenSource. If an SMC connection WAS established and then a Dispose is called, the background thread is cancelled correctly, but _cancellationTokenSource itself is never disposed.","fix":"Add _cancellationTokenSource.Dispose() at the end of Dispose() and ensure Cancel() is called before Dispose().","locations":[{"ref":"src/Avalonia.X11/X11PlatformLifetimeEvents.cs:46-115","code":"   46 |         private readonly CancellationTokenSource _cancellationTokenSource = new CancellationTokenSource();\n   47 |         private readonly IntPtr _currentIceConn;\n   48 |         private readonly IntPtr _currentSmcConn;\n   49 | \n   50 |         private bool _saveYourselfPhase;\n   51 | \n   52 |         internal X11PlatformLifetimeEvents(AvaloniaX11Platform platform)\n   53 |         {\n   54 |             _platform = platform;\n   55 |             \n   56 |             if (ICELib.IceAddConnectionWatch(\n   57 |                     Marshal.
