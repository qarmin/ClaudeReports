<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`read_jsx_entity`'s inner `from_code` calls `char::from_u32(...).expect(\"failed to parse number as char\")`. The preceding `is_hex`/`is_dec` guards only confirm the digits are well-formed, not that the resulting code point is a valid `char`. Malformed JSX source can drive the value to a surrogate or out-of-range code point, panicking the lexer. Reachable examples (all within the 10-iteration cap): `\"&#xD800;\"` (lone surrogate), `\"&#xFFFFFF;\"` (0xFFFFFF > 0x10FFFF), `\"&#99999999;\"` (decimal far above 0x10FFFF). All tokenize untrusted JSX, so this is a remote-input panic.","fix":"Replace both `.expect(...)` calls with proper error handling: parse the integer with `u32::from_str_radix(...).ok()` and `char::from_u32(...)`, and when either is `None` fall through to the existing `reset_to(start_pos)` / return-literal-`&` recovery path (or emit a JSX entity syntax error) instead of panicking.","locations":[{"ref":"crates/swc_ecma_lexer/src/common/lexer/mod.rs:993-1001","code":"  993 |         fn from_code(s: &str, radix: u32) -> LexResult<char> {\n  994 |             // TODO(kdy1): unwrap -> Err\n  995 |             let c = char::from_u32(\n  996 |                 u32::from_str_radix(s, radix).expect(\"failed to parse string as number\"),\n  997 |             )\n  998 |             .expect(\"failed to parse number as char\");\n  999 | \n 1000 |             Ok(c)\n 1001 |         }","lines":9,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_lexer/src/common/lexer/mod.rs#L993-L1001"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Unbounded recursion in the TS/Flow type parser allows a stack overflow (process abort) from malformed but cheaply-tokenized input. Each Flow nullable prefix `?` bumps one token and recurses into `parse_ts_non_array_type`, so a source like `type T = ????????...X` (one byte per level) produces recursion depth proportional to input length. The same applies to deeply nested parenthesized types `((((...))))`, `keyof keyof ...`, and array suffixes routed through `parse_ts_non_conditional_type` -> `parse_ts_union_type_or_higher` -> ... -> `parse_ts_non_array_type`. There is no recursion/depth guard anywhere on the `parse_ts_type` path. Reachable directly from untrusted source.","fix":"Add a recursion-depth counter to the parser (increment on entry to `parse_ts_type` / `parse_ts_non_array_type`, decrement on exit) and emit a syntax error once a configurable limit is exceeded, mirroring the explicit stack-overflow guards already used for `if/else` in stmt.rs. Alternatively iterativize the Flow `?` prefix and parenthesized-type unwrapping.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:4580-4608","code":" 4580 |         } else if self.input().syntax().flow() && cur == Token::QuestionMark {\n 4581 |             self.bump();\n 4582 | \n 4583 |             // Flow's nullable type (`?T`) is represented as `T | null | undefined`.\n 4584 |             // Only use the non-conditional parser for actual function forms\n 4585 |             // (`?() =>`, `?(x: T) =>`, `?(...A) =>`) so non-function grouped\n 4586 |             // types keep their original precedence (`?(T)[]` etc.).\n 4587 |             let is_nullable_fn_type = self.input().is(Token::LParen)\n 4588 |                 && self.ts_look_ahead(|p| {\n 4589 |                     p.try_parse_ts(|p| {\n 4590 |                         let ty = p.parse_ts_non_conditional_type()?;\n 4591 | \n 4592 |                         if matches!(\n 4593 |                             &*ty,\n 4594 |                             TsType::TsFnOrConstructorType(TsFnOrConstructorType::TsFnType(..))\n 4595 |                         ) {\n 4596 |                             Ok(Some(()))\n 4597 |                         } else {\n 4598 |                             Ok(None)\n 4599 |                         }\n 4600 |                     })\n 4601 |                     .is_some()\n 4602 |                 });\n 4603 | \n 4604 |             let inner_type = if is_nullable_fn_type {\n 4605 |                 self.parse_ts_non_conditional_type()?\n 4606 |             } else {\n 4607 |                 self.parse_ts_non_array_type()?\n 4608 |             };","lines":29,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L4580-L4608"},{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:3556-3586","code":" 3556 |     fn parse_ts_non_conditional_type(&mut self) -> PResult<Box<TsType>> {\n 3557 |         trace_cur!(self, parse_ts_non_conditional_type);\n 3558 | \n 3559 |         debug_assert!(self.input().syntax().typescript());\n 3560 | \n 3561 |         if self.is_flow_syntax() {\n 3562 |             if let Some(fn_type) = self.try_parse_ts(Self::try_parse_flow_anon_fn_type) {\n 3563 |                 return Ok(Box::new(TsType::TsFnOrConstructorType(\n 3564 |                     TsFnOrConstructorType::TsFnType(fn_type),\n 3565 |                 )));\n 3566 |             }\n 3567 |         }\n 3568 | \n 3569 |         if self.is_ts_start_of_fn_type() {\n 3570 |             return self\n 3571 |                 .parse_ts_fn_or_constructor_type(true)\n 3572 |                 .map(TsType::from)\n 3573 |                 .map(Box::new);\n 3574 |         }\n 3575 |         if (self.input().is(Token::Abstract) && peek!(self).is_some_and(|cur| cur == Token::New))\n 3576 |             || self.input().is(Token::New)\n 357 {"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`assert_and_bump(Token::Gt)` is called after `parse_ts_type_args()` in several places. `assert_and_bump` only `debug_assert!`s that the current token matches and then unconditionally bumps; in debug/test/fuzz builds a mismatch panics. The invariant (cur == `>`) is currently guaranteed by `parse_ts_type_args` ending with `expect_without_advance(Token::Gt)`, but this is a fragile non-local coupling: any path that reaches these calls with a different current token (e.g. future changes to lt/gt splitting via `cut_lshift`/`merge_lt_gt`) becomes a debug-build panic instead of a recoverable syntax error.","fix":"Replace the `assert_and_bump(Token::Gt)` calls with `expect!(self, Token::Gt)` so a mismatch produces a syntax error in all build profiles instead of a debug panic.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:1186-1187","code":" 1186 |             self.assert_and_bump(Token::Gt);\n 1187 |             Some(ret)","lines":2,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L1186-L1187"},{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:2290-2291","code":" 2290 |                     let ret = self.parse_ts_type_args()?;\n 2291 |                     self.assert_and_bump(Token::Gt);","lines":2,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L2290-L2291"},{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:4225","code":" 4225 |             self.assert_and_bump(Token::Gt);","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L4225"},{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:4285","code":" 4285 |             self.assert_and_bump(Token::Gt);","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L4285"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`convert_statement_as_module_item` calls `unreachable!` for Flow / declare / enum statement variants. The comment claims only SWC-round-trip AST reaches here, but the React Compiler can transform/inject nodes, and the AST also originates from JSON deserialization; any such node reaching this arm aborts the whole compile with a panic instead of a recoverable error.","fix":"Replace the `unreachable!` with a graceful fallback (e.g. emit an Invalid/empty statement or return a diagnostic) so malformed or unexpected input cannot panic the compiler.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs:430-448","code":"  430 |             Statement::Unknown(_)\n  431 |             | Statement::TypeAlias(_)\n  432 |             | Statement::OpaqueType(_)\n  433 |             | Statement::InterfaceDeclaration(_)\n  434 |             | Statement::DeclareVariable(_)\n  435 |             | Statement::DeclareFunction(_)\n  436 |             | Statement::DeclareClass(_)\n  437 |             | Statement::DeclareModule(_)\n  438 |             | Statement::DeclareModuleExports(_)\n  439 |             | Statement::DeclareExportDeclaration(_)\n  440 |             | Statement::DeclareExportAllDeclaration(_)\n  441 |             | Statement::DeclareInterface(_)\n  442 |             | Statement::DeclareTypeAlias(_)\n  443 |             | Statement::DeclareOpaqueType(_)\n  444 |             | Statement::EnumDeclaration(_) => {\n  445 |                 // This reverse path only handles AST produced by our SWC forward converter;\n  446 |                 // lossy SWC details are restored from PreservedAst.\n  447 |                 unreachable!(\"unsupported statement in SWC round-trip AST\")\n  448 |             }","lines":19,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs#L430-L448"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`for_each_id_ref_in_expr` calls `s.exprs.last().unwrap()` for `Expr::Seq`. An empty `SeqExpr.exprs` (constructible via AST manipulation feeding the minifier, and treated as possible elsewhere in the codebase) makes this panic. The AST crate handles the same case defensively with `exprs.last().map(...)` (crates/swc_ecma_ast/src/expr.rs:296), so an empty seq is considered reachable.","fix":"Use `if let Some(last) = s.exprs.last() { for_each_id_ref_in_expr(last, op); }` instead of `unwrap()`.","locations":[{"ref":"crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs:1664-1666","code":" 1664 |         Expr::Seq(s) => {\n 1665 |             for_each_id_ref_in_expr(s.exprs.last().unwrap(), op);\n 1666 |         }","lines":3,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs#L1664-L1666"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`for_each_id_ref_in_class` hits `unreachable!()` for a constructor parameter of kind `ParamOrTsParamProp::TsParamProp`. This is reached via `for_each_id_ref_in_expr` -> `Expr::Class` from alias/usage collection (e.g. `x = class { constructor(public a) {} }`). If a TypeScript AST with parameter properties reaches the minifier without TS stripping, this panics rather than degrading gracefully like the other defensive branches in this file.","fix":"Replace `unreachable!()` with a no-op (ignore the TsParamProp branch) or conservatively recurse into the underlying pattern, since usage analysis should not assume TS has been fully stripped.","locations":[{"ref":"crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs:1715-1717","code":" 1715 |                 ParamOrTsParamProp::TsParamProp(..) => {\n 1716 |                     unreachable!()\n 1717 |                 }","lines":3,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs#L1715-L1717"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`convert_declaration` calls `unreachable!` for Flow declaration variants (TypeAlias/OpaqueType/InterfaceDeclaration/EnumDeclaration). Same risk as the statement path: an unexpected node panics rather than degrading gracefully.","fix":"Return `self.invalid_var_decl(...)` or a diagnostic instead of panicking.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs:1849-1854","code":" 1849 |             Declaration::TypeAlias(_)\n 1850 |             | Declaration::OpaqueType(_)\n 1851 |             | Declaration::InterfaceDeclaration(_)\n 1852 |             | Declaration::EnumDeclaration(_) => {\n 1853 |                 unreachable!(\"SWC forward conversion does not produce Flow declarations\")\n 1854 |             }","lines":6,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs#L1849-L1854"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `subtract_cycles`, the edge weights are subtracted from `used_names` using plain `u32` subtraction (`e.usage -= w.usage; e.assign -= w.assign`). The entry is obtained via `entry(id.clone()).or_default()`, so when an id of a cycle node is not yet present in `used_names` it is freshly created with `usage = 0` / `assign = 0`, and subtracting a non-zero edge weight underflows. In debug builds this panics; in release it wraps to a huge value. A wrapped `usage`/`assign` makes the binding look heavily used and silently disables DCE for it, or (after wrap) could make it look droppable. Unlike `drop_usage`/`drop_assign` which intentionally use `saturating_sub`, this path uses unchecked subtraction.","fix":"Use saturating subtraction here as well: `e.usage = e.usage.saturating_sub(w.usage); e.assign = e.assign.saturating_sub(w.assign);` to match the documented intent and avoid underflow panics / wraparound.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:228-232","code":"  228 |                     if let Some(w) = self.graph.edge_weight(i, j) {\n  229 |                         let e = self.used_names.entry(id.clone()).or_default();\n  230 |                         e.usage -= w.usage;\n  231 |                         e.assign -= w.assign;\n  232 |                     }","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L228-L232"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Usage counters (`ref_count`, `usage_count`, `assign_count`, etc. in program_data.rs, incremented from this analyzer's `report_usage`/`report_assign`) are `u32` updated with plain `+= 1` and summed during scope `merge`. Practically unreachable (would need >4e9 references), but the increments are unchecked while the decrement path uses `saturating_sub`, which is an inconsistency worth noting.","fix":"Either leave as-is (acknowledged non-issue at realistic input sizes) or use `saturating_add` consistently with the existing `saturating_sub` on the decrement path for defensive symmetry.","locations":[{"ref":"crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs:155-172","code":"  155 |     fn report_usage(&mut self, i: &Ident) {\n  156 |         if i.sym == \"arguments\" {\n  157 |             self.scope.mark_used_arguments();\n  158 |         }\n  159 | \n  160 |         let i = i.to_id();\n  161 | \n  162 |         if let Some(recr) = self.used_recursively.get(&i) {\n  163 |             if let RecursiveUsage::Var { can_ignore: false } = recr {\n  164 |                 self.data.report_usage(self.ctx, i.clone());\n  165 |                 self.data.var_or_default(i.clone()).mark_used_above_decl()\n  166 |             }\n  167 |             self.data.var_or_default(i.clone()).mark_used_recursively();\n  168 |             return;\n  169 |         }\n  170 | \n  171 |         self.data.report_usage(self.ctx, i)\n  172 |     }","lines":18,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs#L155-L172"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `read_number` the legacy-octal check computes `start.0 != self.last_pos().0 - 1`. `last_pos().0` is a `u32` and `- 1` will underflow (panic in debug, wrap in release) if `last_pos` is ever 0. It is currently protected only by the invariant that at least one `0` digit was consumed before this point, so `last_pos >= 1`; the code is correct only by that implicit invariant and would break if the call path changed.","fix":"Use saturating/explicit arithmetic, e.g. compare `start.0 + 1 != self.last_pos().0`, which avoids the underflow entirely.","locations":[{"ref":"crates/swc_ecma_parser/src/lexer/mod.rs:1179","code":" 1179 |                     if start.0 != self.last_pos().0 - 1 {","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/lexer/mod.rs#L1179"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In the TSX ambiguous-arrow heuristic, `has_trailing_comma` is computed with raw `u32` subtraction `type_parameters.span.hi.0 - single_param.span.hi.0`. This assumes the single type parameter's span hi is always <= the type parameter declaration's span hi. If a malformed type parameter ever produces a param span whose hi exceeds the decl span hi (e.g. via recovery/synthesized spans), this underflows: it panics in debug builds and wraps to a huge value in release, silently making `has_trailing_comma` true and corrupting the JSX-vs-arrow disambiguation.","fix":"Use a saturating/checked comparison, e.g. `type_parameters.span.hi.0.saturating_sub(single_param.span.hi.0) > 1`, or compare positions directly (`single_param.span.hi < type_parameters.span.hi - BytePos(1)` after a bounds check).","locations":[{"ref":"crates/swc_ecma_parser/src/parser/expr.rs:174-175","code":"  174 |                         let has_trailing_comma =\n  175 |                             type_parameters.span.hi.0 - single_param.span.hi.0 > 1;","lines":2,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/expr.rs#L174-L175"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Unchecked u32 subtraction `token_span.hi.0 - token_span.lo.0` to compute the length of the leading string token while detecting a `\"use strict\"` directive. For all well-formed Str tokens emitted by the lexer hi >= lo, so this is currently unreachable, but it is a raw subtraction on untrusted-input-derived BytePos values with no debug guard; if any lexer path ever produced an inverted span (e.g. recovery) this panics in debug and wraps in release, then feeds a bogus length into the directive check.","fix":"Use a saturating/checked length: `token_span.hi.0.saturating_sub(token_span.lo.0) == 12`, or compare against the byte length of the read string directly.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/stmt.rs:2218","code":" 2218 |             if token_span.hi.0 - token_span.lo.0 == 12 {","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/stmt.rs#L2218"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`has_trailing_comma` computes `type_params.span.hi.0 - single_param.span.hi.0` on raw u32 `BytePos` values. This relies on the type-parameter declaration span always ending at or after the single parameter span. If a malformed/synthetic span ever has `single_param.span.hi > type_params.span.hi`, this is an unchecked subtraction that panics in debug builds and wraps in release, flipping the JSX-disambiguation heuristic.","fix":"Use `type_params.span.hi.0.saturating_sub(single_param.span.hi.0) > 1`, or compare positions directly with a guard, to avoid the unchecked subtraction.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:5237","code":" 5237 |                     let has_trailing_comma = type_params.span.hi.0 - single_param.span.hi.0 > 1;","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L5237"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`span_from_json_value` reads `start`/`end` as `u64` from arbitrary JSON and truncates them with `as u32`. For positions >= 2^32 (or maliciously large JSON), the truncation wraps silently, producing a bogus span (potentially end < start) rather than falling back to DUMMY_SP.","fix":"Use `u32::try_from(start).ok()` and fall back to DUMMY_SP on overflow instead of an unchecked `as u32` cast.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs:2543-2547","code":" 2543 |         match (start, end) {\n 2544 |             (Some(start), Some(end)) => Span::new(BytePos(start as u32), BytePos(end as u32)),\n 2545 |             (Some(start), None) => Span::new(BytePos(start as u32), BytePos(start as u32)),\n 2546 |             _ => DUMMY_SP,\n 2547 |         }","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs#L2543-L2547"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `get_ascii_only_ident`, the `'\\x01'..='\\x0f'` arm formats control chars with single-hex-digit width, producing invalid JS escapes. The `may_need_quote` branch writes `\\x{:x}` -> e.g. `\\x1` (a `\\x` escape requires exactly 2 hex digits), and the else branch writes `\\u00{:x}` -> e.g. `\\u001` (a `\\u` escape requires exactly 4 hex digits). Both yield malformed output for values 0x01..0x0f. Compare the correct handling in lit.rs which uses the `\\x0` prefix plus one digit.","fix":"Use fixed-width formatting: `write!(buf, \"\\\\x{:02x}\", c as u8)` for the quote path and `write!(buf, \"\\\\u{:04x}\", c as u32)` (or `\\\\x0{:x}` / `\\\\u000{:x}`) for the non-quote path.","locations":[{"ref":"crates/swc_ecma_codegen/src/lib.rs:1375-1382","code":" 1375 |             '\\x01'..='\\x0f' if !first => {\n 1376 |                 if may_need_quote {\n 1377 |                     need_quote = true;\n 1378 |                     let _ = write!(buf, \"\\\\x{:x}\", c as u8);\n 1379 |                 } else {\n 1380 |                     let _ = write!(buf, \"\\\\u00{:x}\", c as u8);\n 1381 |                 }\n 1382 |             }","lines":8,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/lib.rs#L1375-L1382"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In the object-literal merge path, the `Prop::Shorthand` case rewrites the property to a `KeyValueProp` when `merge_sequential_expr` succeeds, but unlike every sibling branch (spread at 2005-2011, KeyValue at 2055-2063, and the computed-key check at 2024-2032) it does NOT `return Ok(true)`. It falls through to the `is_skippable_for_seq` check and continues iterating props. Because the function reports `Ok(false)` to its caller even though it mutated the AST, `merge_sequences_in_exprs` (lines 875-882) skips `merge_seq_cache.invalidate(a_idx)`/`invalidate(b_idx)`, leaving the ident-usage and top-retain caches stale for the `a`/`b` slots that were just consumed. A subsequent merge can then be made against out-of-date cached identifier sets, which can move a side-effecting expression past a use it actually aliases. The merge contract (\"Returns true if something is modified\") is also violated.","fix":"After rewriting the shorthand into a `KeyValueProp` on a successful inner merge, immediately `return Ok(true)`, mirroring the `Prop::KeyValue` branch: `if self.merge_sequential_expr(a, &mut new_b)? { **prop = Prop::KeyValue(..); return Ok(true); }`.","locations":[{"ref":"crates/swc_ecma_minifier/src/compress/optimize/sequences.rs:1989-2008","code":" 1989 |                                 Prop::Shorthand(shorthand) => {\n 1990 |                                     // We can't ignore shorthand properties\n 1991 |                                     //\n 1992 |                                     // https://github.com/swc-project/swc/issues/6914\n 1993 |                                     let mut new_b = shorthand.clone().into();\n 1994 |                                     if self.merge_sequential_expr(a, &mut new_b)? {\n 1995 |                                         **prop = Prop::KeyValue(KeyValueProp {\n 1996 |                                             key: Ident::new_no_ctxt(\n 1997 |                                                 shorthand.sym.clone(),\n 1998 |                                                 shorthand.span,\n 1999 |                                             )\n 2000 |                                             .into(),\n 2001 |                                             value: new_b.clone().into(),\n 2002 |                                         });\n 2003 |                                     }\n 2004 | \n 2005 |                                     if !self.is_skippable_for_seq(Some(a), &new_b) {\n 2006 |                                         return Ok(false);\n 2007 |                                     }\n 2008 |                                 }","lines":20,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/optimize/sequences.rs#L1989-L2008"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"After the scan loop in `read_jsx_str` breaks on the closing quote (current byte == quote), the code consumes the quote only `if self.input().peek_ahead().is_some()`. `peek_ahead()` inspects the byte at offset +2, not the closing quote at offset 0. When the closing quote is the last (or second-to-last) byte of input, `peek_ahead()` is `None`, so the closing quote is NOT consumed; the lexer stays positioned on the quote and re-lexes it as a new token, corrupting the token stream. The intent is clearly to consume the closing quote whenever the loop terminated normally (not via the unterminated-EOF break).","fix":"Consume the closing quote based on whether the loop ended on the quote, e.g. check `self.cur() == Some(quote)` (or track an explicit `terminated` bool) and `self.bump(1)` in that case, rather than testing `peek_ahead()`.","locations":[{"ref":"crates/swc_ecma_parser/src/lexer/mod.rs:1607-1611","code":" 1607 |         // it might be at the end of the file when\n 1608 |         // the string literal is unterminated\n 1609 |         if self.input().peek_ahead().is_some() {\n 1610 |             self.bump(1);\n 1611 |         }","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/lexer/mod.rs#L1607-L1611"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The pipeline operator `|>` is converted to addition (`BinaryOp::Add`). This silently produces a `+` BinExpr instead of a pipeline, corrupting the program semantics for any pipeline expression that reaches this converter.","fix":"Either map `BinaryOperator::Pipeline` to the correct SWC representation, or, if pipeline is genuinely unsupported in this round-trip, emit an Invalid expression / explicit error rather than silently turning it into `+`.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs:1983","code":" 1983 |             BinaryOperator::Pipeline => swc::BinaryOp::Add,","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs#L1983"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"A `throw` unary expression (Hermes/Flow `throw e` expression form) is mapped to `UnaryOp::Void`. This silently rewrites `throw x` into `void x`, which has completely different runtime behavior (no exception thrown).","fix":"SWC has no throw-expression unary op; emit an Invalid expression or surface an error instead of silently substituting `void`, which changes semantics.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs:2004","code":" 2004 |             UnaryOperator::Throw => swc::UnaryOp::Void,","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs#L2004"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`visit_mut_unary_expr` returns early (skipping all children) for the `delete` operator, but `visit_mut_assign_expr` still drops assignments to a binding whose only remaining reference is inside a `delete`. More importantly, the `Analyzer` (read/usage collection) has no special handling for `delete`: `delete obj.prop` and `delete x` are visited as ordinary member/ident expressions, so `delete x;` records a *usage* of `x`. That part is conservative. However, the asymmetry between the analysis pass (which counts the ident in a `delete` as a use) and the mutate pass `visit_mut_unary_expr` (which skips traversal of the `delete` operand entirely) means the mutate pass never gets a chance to rewrite/inline inside `delete`, while usage counts assume it did. This divergence is fragile: any future change to how `delete` operands contribute to usage in `Analyzer` will silently desync from the mutate side.","fix":"Mirror the `delete` handling between the read-analysis (`Analyzer`) and mutate (`TreeShaker`) passes, or document explicitly why `delete` operands are skipped in the mutate pass but counted as uses in analysis, so the two cannot drift apart.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:1488-1493","code":" 1488 |     fn visit_mut_unary_expr(&mut self, n: &mut UnaryExpr) {\n 1489 |         if matches!(n.op, op!(\"delete\")) {\n 1490 |             return;\n 1491 |         }\n 1492 |         n.visit_mut_children_with(self);\n 1493 |     }","lines":6,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L1488-L1493"},{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:706-719","code":"  706 |     fn visit_expr(&mut self, e: &Expr) {\n  707 |         let old_in_var_decl = self.in_var_decl;\n  708 | \n  709 |         self.in_var_decl = false;\n  710 |         if let Expr::Ident(i) = e {\n  711 |             self.add(i.to_id(), false);\n  712 |             self.in_var_decl = old_in_var_decl;\n  713 |             return;\n  714 |         }\n  715 | \n  716 |         e.visit_children_with(self);\n  717 | \n  718 |         self.in_var_decl = old_in_var_decl;\n  719 |     }","lines":14,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L706-L719"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"TsMappedType emits hard newlines and indentation unconditionally via emitter.wr.write_line() / increase_indent(), without checking emitter.cfg.minify. The writer's new_line is always \"\\n\" (even in minify mode, the JsWriter is constructed with \"\\n\"), so minified output of a mapped type such as `{ [K in T]: V }` gets stray line breaks and indentation. The sibling TsImportCallOptions guards the exact same calls with `if !emitter.cfg.minify`, confirming this is the intended pattern and that TsMappedType is missing the guard.","fix":"Wrap the write_line()/increase_indent() before the body and the write_line()/decrease_indent() after it in `if !emitter.cfg.minify { ... }`, matching TsImportCallOptions (lines 1070-1083).","locations":[{"ref":"crates/swc_ecma_codegen/src/typescript.rs:586-588","code":"  586 |         punct!(emitter, \"{\");\n  587 |         emitter.wr.write_line()?;\n  588 |         emitter.wr.increase_indent()?;","lines":3,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/typescript.rs#L586-L588"},{"ref":"crates/swc_ecma_codegen/src/typescript.rs:664-668","code":"  664 |         formatting_semi!(emitter);\n  665 | \n  666 |         emitter.wr.write_line()?;\n  667 |         emitter.wr.decrease_indent()?;\n  668 |         punct!(emitter, \"}\");","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/typescript.rs#L664-L668"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"is_simple_expr_for_seq_optimization (used to gate seq IIFE inlining) treats every unary operator as simple by recursing into the argument (1663). This includes `delete` and `typeof`/`void`, and crucially `delete obj.prop`, which has a side effect. If such an expression is the arrow body and the parameter substitution duplicates it (via the should_consume=false replacer), or if it is an argument substituted into multiple body positions, the side effect is duplicated or reordered. The standalone simple-eval predicate (is_return_arg_simple_enough_for_iife_eval) deliberately does NOT whitelist arbitrary unary expressions.","fix":"Restrict the Unary arm to side-effect-free operators (`!`, `void`, `typeof`, `+`, `-`, `~`) and exclude `delete`, and ensure member-expression args are not duplicated.","locations":[{"ref":"crates/swc_ecma_minifier/src/compress/optimize/iife.rs:1654-1667","code":" 1654 |     fn is_simple_expr_for_seq_optimization(&self, expr: &Expr) -> bool {\n 1655 |         match expr {\n 1656 |             Expr::Lit(..) | Expr::Ident(..) => true,\n 1657 |             Expr::Bin(bin) if !bin.op.may_short_circuit() => {\n 1658 |                 self.is_simple_expr_for_seq_optimization(&bin.left)\n 1659 |                     && self.is_simple_expr_for_seq_optimization(&bin.right)\n 1660 |             }\n 1661 |             Expr::Unary(unary) => self.is_simple_expr_for_seq_optimization(&unary.arg),\n 1662 |             Expr::Member(member) if !member.prop.is_computed() => {\n 1663 |                 self.is_simple_expr_for_seq_optimization(&member.obj)\n 1664 |             }\n 1665 |             _ => false,\n 1666 |         }\n 1667 |     }","lines":14,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/optimize/iife.rs#L1654-L1667"},{"ref":"crates/swc_ecma_minifier/src/compress/optimize/iife.rs:1661","code":" 1661 |             Expr::Unary(unary) => self.is_simple_expr_for_seq_optimization(&unary.arg),","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/optimize/iife.rs#L1661"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"A bare `Expression::SpreadElement` is converted by recursing into its argument, dropping the spread (`...`). When a spread appears where this generic `convert_expression` is used (rather than `convert_expression_as_argument`), the resulting AST loses the spread semantics.","fix":"Spread elements are only valid as call/array arguments; if one reaches `convert_expression` it should produce an Invalid expression rather than silently unwrapping the argument.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs:788","code":"  788 |             Expression::SpreadElement(spread) => self.convert_expression(&spread.argument),","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs#L788"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Bare `Super` and `Import` expressions are converted to `Expr::Invalid`. While they are normally only valid inside call/member contexts (handled separately), turning them into Invalid silently discards them; combined with the catch-all spans this can mask genuine input the compiler emitted.","fix":"Confirm these forms are truly impossible at this position; if so document why, otherwise handle them. Silent Invalid substitution loses information.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs:810-815","code":"  810 |             Expression::Super(super_expr) => swc::Expr::Invalid(swc::Invalid {\n  811 |                 span: self.span_from_base(&super_expr.base),\n  812 |             }),\n  813 |             Expression::Import(import) => swc::Expr::Invalid(swc::Invalid {\n  814 |                 span: self.span_from_base(&import.base),\n  815 |             }),","lines":6,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs#L810-L815"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`node_to_scope`, `node_to_scope_end` and `node_id_to_scope` are keyed solely by `span.lo`. When two distinct scopes share the same starting byte position the later scope silently overwrites the earlier mapping. This can happen for constructs whose scope spans begin at the same position (e.g. an arrow/function whose scope span starts at the same `lo` as a wrapping node), producing an incorrect node->scope lookup for downstream consumers.","fix":"Key the node->scope maps on the full span (start and end) or detect collisions and disambiguate, rather than relying on `span.lo` uniqueness.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_scope.rs:1454-1464","code":" 1454 |             let span = self.scoping.scope_span(scope_id);\n 1455 |             let start = span.lo.0;\n 1456 |             let end = span.hi.0;\n 1457 | \n 1458 |             if end > start {\n 1459 |                 node_to_scope.insert(start, out_scope_id);\n 1460 |                 node_to_scope_end.insert(start, end);\n 1461 |             } else {\n 1462 |                 node_to_scope.insert(start, out_scope_id);\n 1463 |             }\n 1464 |             node_id_to_scope.insert(start, out_scope_id);","lines":11,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_scope.rs#L1454-L1464"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"consume_decimal_escape truncates a u64 capturing-group index to u32 with `index as u32`. consume_decimal_digits only guards against u64 overflow (~1.8e19), so a DecimalEscape between u32::MAX+1 and that limit (e.g. `\\8589934593`, which is 2^33+1) silently wraps to a small index (here 1). In Unicode mode the spec requires a Syntax Error when CapturingGroupNumber > CountLeftCapturingParensWithin, but the truncated value passes the `num_of_capturing_groups < index` check and is accepted as a valid `\\1` reference; in non-Unicode mode it likewise mis-resolves to an existing low-numbered group. This is a correctness bug producing a wrong/accepted reference for malformed input.","fix":"Do not truncate. Either compare in u64 (keep ast index as u64, or clamp), or if the parsed value exceeds u32::MAX treat it as definitely greater than num_of_capturing_groups and emit invalid_indexed_reference / fall back to the legacy non-Unicode handling instead of casting. e.g. `let index = index; if index > u64::from(self.state.num_of_capturing_groups) { ... }` before any `as u32`.","locations":[{"ref":"crates/swc_ecma_regexp/src/parser/pattern_parser/pattern_parser_impl.rs:1763-1777","code":" 1763 |     fn consume_decimal_escape(&mut self) -> Result<Option<u32>> {\n 1764 |         let checkpoint = self.reader.checkpoint();\n 1765 | \n 1766 |         if let Some(index) = self.consume_decimal_digits()? {\n 1767 |             // \\0 is CharacterEscape, not DecimalEscape\n 1768 |             if index != 0 {\n 1769 |                 #[expect(clippy::cast_possible_truncation)]\n 1770 |                 return Ok(Some(index as u32));\n 1771 |             }\n 1772 | \n 1773 |             self.reader.rewind(checkpoint);\n 1774 |         }\n 1775 | \n 1776 |         Ok(None)\n 1777 |     }","lines":15,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_regexp/src/parser/pattern_parser/pattern_parser_impl.rs#L1763-L1777"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`can_drop_binding` returns `true` (droppable) when the name is absent from `used_names` (the `None` arm). For an exported binding, `visit_export_decl`/`visit_export_named_specifier` in `Analyzer` call `add(..)` which inserts a usage, so exports are protected. But `Analyzer::add` early-returns without recording anything when `id == cur_fn_id` or `id == cur_class_id` (self-reference suppression, lines 411-420). If the only reference to a function/class is a recursive self-reference, `used_names` has no entry and `can_drop_binding` returns `true`, dropping a function that is in fact reachable through an external call whose recording was suppressed. Self-recursion suppression is intentional (so a recursive-but-unused fn can be dropped), and an externally-called recursive fn would also have a non-self reference recorded, so this is likely safe; but the interaction between self-reference suppression and the `None => true` default is subtle and depends on every external reference being recorded elsewhere.","fix":"Add fixture coverage for recursive functions/classes that are (a) only self-referenced and unused, (b) self-referenced and externally called, to lock the behavior; document that `None => true` is sound only because all non-self references are recorded.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:425-467","code":"  425 |     /// Mark `id` as used\n  426 |     fn add(&mut self, id: Id, assign: bool) {\n  427 |         if id.0 == atom!(\"arguments\") {\n  428 |             self.scope.found_arguemnts = true;\n  429 |         }\n  430 | \n  431 |         if let Some(f) = &self.cur_fn_id {\n  432 |             if id == *f {\n  433 |                 return;\n  434 |             }\n  435 |         }\n  436 |         if let Some(f) = &self.cur_class_id {\n  437 |             if id == *f {\n  438 |                 return;\n  439 |             }\n  440 |         }\n  441 | \n  442 |         if self.scope.is_ast_path_empty() {\n  443 |             // Add references from top level items into graph\n  444 |             let idx = self.data.node(&id);\n  445 |             self.data.entries.insert(idx);\n  446 |         } else {\n  447 |             let mut scope = Some(&self.scope);\n  448 | \n  449 |             while let Some(s) = scope {\n  450 |                 for component in &s.ast_path {\n  451 |                     self.data.add_dep_edge(component, &id, assign);\n  452 |                 }\n  453 | \n  454 |                 if s.kind == ScopeKind::Fn && !s.ast_path.is_empty() {\n  455 |                     break;\n  456 |                 }\n  457 | \n  458 |                 scope = s.parent;\n  459 |             }\n  460 |         }\n  461 | \n  462 |         if assign {\n  463 |             self.data.used_names.entry(id).or_default().assign += 1;\n  464 |         } else {\n  465 |             self.data.used_names.entry(id).or_default().usage += 1;\n  466 |         }\n  467 |     }","lines":43,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L425-L467"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`visit_mut_assign_expr` saves `old = self.is_modifying`, sets it for the left, then on line 111 unconditionally sets `self.is_modifying = false` for the right and restores `old` afterwards. The intermediate `self.is_modifying = old` on line 109 is immediately overwritten by line 111, so it is dead. More importantly, forcing `is_modifying = false` for the RHS is correct only when entering from a non-modifying context; if this assignment is itself nested inside another modifying target context, the saved `old` (restored at 113) is the outer value, but the RHS was visited with `false` regardless. Likely intended but the redundant line 109 write is confusing/dead and should be removed.","fix":"Drop the redundant `self.is_modifying = old;` on line 109 (the value is overwritten before any use). Keep set-true around left, set-false around right.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/expr/mod.rs:106-115","code":"  106 |     fn visit_mut_assign_expr(&mut self, n: &mut AssignExpr) {\n  107 |         let old = self.is_modifying;\n  108 |         self.is_modifying = true;\n  109 |         n.left.visit_mut_with(self);\n  110 |         self.is_modifying = old;\n  111 | \n  112 |         self.is_modifying = false;\n  113 |         n.right.visit_mut_with(self);\n  114 |         self.is_modifying = old;\n  115 |     }","lines":10,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/expr/mod.rs#L106-L115"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_template_element_from_raw`'s `read_escaped` handles `\\x00` followed by a digit specially (writes `\\x00`) but for `\\x000` (NUL escape followed by ASCII '0') the `pending` char '0' falls into the `_ => write!(buf, \"\\0\")` branch and is then appended, producing `\\00` followed by `0` = `\\000`, an octal-looking escape that is a SyntaxError in template literals. Narrow edge case but emits invalid output.","fix":"When `v == 0` and `pending` is a digit '0'..='9' (not only '1'..='9'), emit `\\x00` so the following digit cannot form an octal sequence.","locations":[{"ref":"crates/swc_ecma_codegen/src/lit.rs:1070-1102","code":"","lines":33,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/lit.rs#L1070-L1102"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"TsExportAssignment emits no terminating semicolon, whereas the structurally analogous TsImportEqualsDecl emits formatting_semi! (line 360) and the ModuleDecl wrapper does not add one either. This produces `export = foo` with no separator. It is generally safe due to the newline the ModuleDecl wrapper writes in non-minify mode and pending-semi handling in minify, but it is an inconsistency with the import-equals counterpart and relies on ASI for the following statement.","fix":"Append `formatting_semi!(emitter);` after emitting self.expr, mirroring TsImportEqualsDecl.","locations":[{"ref":"crates/swc_ecma_codegen/src/typescript.rs:247-257","code":"  247 | impl MacroNode for TsExportAssignment {\n  248 |     fn emit(&mut self, emitter: &mut Macro) -> Result {\n  249 |         emitter.emit_leading_comments_of_span(self.span(), false)?;\n  250 | \n  251 |         keyword!(emitter, \"export\");\n  252 |         formatting_space!(emitter);\n  253 |         punct!(emitter, \"=\");\n  254 |         formatting_space!(emitter);\n  255 |         emit!(self.expr);\n  256 |         Ok(())\n  257 |     }","lines":11,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/typescript.rs#L247-L257"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"TsModuleBlock emits its leading comments AFTER the statement list rather than before it. emit_leading_comments_of_span is called on line 690, after emit_list on lines 685-689. Every other emit impl in this file (and the codebase) calls emit_leading_comments_of_span first. As written, any leading comment attached to the module block span is emitted in the wrong position (after the body) and will not render where it belongs.","fix":"Move `emitter.emit_leading_comments_of_span(self.span(), false)?;` to before the emit_list call.","locations":[{"ref":"crates/swc_ecma_codegen/src/typescript.rs:709-716","code":"  709 |     fn emit(&mut self, emitter: &mut Macro) -> Result {\n  710 |         emitter.emit_list(\n  711 |             self.span,\n  712 |             Some(&self.body),\n  713 |             ListFormat::SourceFileStatements,\n  714 |         )?;\n  715 |         emitter.emit_leading_comments_of_span(self.span(), false)?;\n  716 |         Ok(())","lines":8,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/typescript.rs#L709-L716"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"valid_flag has a misplaced closing parenthesis: the `'d'` (Es2022) alternative is OR'd at the top level of the `if !(allowlist) || (es2022 && 'd')` test instead of being inside the negated allowlist group. As a result, for a `'d'` flag char the first operand `!(matches g/i/m || ...)` is already `true` (since `'d'` is not in the allowlist), so the whole condition is true and the function returns None. The `'d'` clause is therefore dead and `RegExp(\"a\",\"d\")` is never optimized to `/a/d` even on ES2022. The SAFETY comment on line 1086-1087 claims `'d'` is accepted, which is misleading.","fix":"Move the `'d'` alternative inside the parenthesized allowlist group: `if !(matches!(c.to_char()?, 'g' | 'i' | 'm') || (es>=Es2015 && matches!(.., 'u'|'y')) || (es>=Es2018 && matches!(.., 's')) || (es>=Es2022 && matches!(.., 'd'))) { return None; }`.","locations":[{"ref":"crates/swc_ecma_minifier/src/compress/pure/misc.rs:1083-1087","code":" 1083 |                     if !(matches!(c.to_char()?, 'g' | 'i' | 'm')\n 1084 |                         || (es_version >= EsVersion::Es2015 && matches!(c.to_char()?, 'u' | 'y'))\n 1085 |                         || (es_version >= EsVersion::Es2018 && matches!(c.to_char()?, 's')))\n 1086 |                         || (es_version >= EsVersion::Es2022 && matches!(c.to_char()?, 'd'))\n 1087 |                     {","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/pure/misc.rs#L1083-L1087"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Second `declare` is silently swallowed only conditionally. Line 1495 eats a leading `declare`; line 1502 re-eats `declare` after the access modifier to allow `private declare`. Because `||` short-circuits, when the first `declare` was already eaten (e.g. `declare declare x`) the second `declare` token is NOT consumed and is later misinterpreted as a property/method key named `declare`, instead of being flagged as a duplicate modifier. `declare private declare x` would accept two declares with no diagnostic. Low impact (still parses, just lenient) but the duplicate-modifier intent is not enforced.","fix":"After computing the combined `declare`, if a further `declare` token is still current, emit a duplicate-modifier diagnostic (SyntaxError::TS1030) rather than leaving it to be parsed as a key.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/class_and_fn.rs:1634-1641","code":" 1634 |         let declare = self.syntax().typescript() && self.input_mut().eat(Token::Declare);\n 1635 |         let accessibility = if self.input().syntax().typescript() {\n 1636 |             self.parse_access_modifier()?\n 1637 |         } else {\n 1638 |             None\n 1639 |         };\n 1640 |         // Allow `private declare`.\n 1641 |         let declare = declare || self.syntax().typescript() && self.input_mut().eat(Token::Declare);","lines":8,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/class_and_fn.rs#L1634-L1641"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Acknowledged-but-live FIXME: the comment `//FIXME: This is wrong. Should check in/of only on first loop` precedes logic in `parse_var_declarator` that, for every declarator in a for-loop var list, suppresses the initializer when the current token is `in`/`of`. The `for_loop` guard applies to all declarators, not just the first, so a construct like `for (var a, b in x)` interacts oddly with initializer handling. Real but low-impact since multi-declarator for-in/of heads are separately rejected with TooManyVarInForInHead.","fix":"Track whether this is the first declarator and only apply the in/of initializer suppression to it, or document why the broad check is safe given the downstream TooManyVarInForInHead diagnostic.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/stmt.rs:170-205","code":"  170 |         //FIXME: This is wrong. Should check in/of only on first looself.\n  171 |         let cur = self.input().cur();\n  172 |         let init = if !for_loop || !(cur == Token::In || cur == Token::Of) {\n  173 |             if self.input_mut().eat(Token::Eq) {\n  174 |                 let expr = self.parse_assignment_expr()?;\n  175 |                 let expr = self.verify_expr(expr)?;\n  176 | \n  177 |                 Some(expr)\n  178 |             } else {\n  179 |                 // Destructuring bindings require initializers, but\n  180 |                 // typescript allows `declare` vars not to have initializers.\n  181 |                 if self.ctx().contains(Context::InDeclare) {\n  182 |                     None\n  183 |                 } else if kind == VarDeclKind::Const\n  184 |                     && !for_loop\n  185 |                     && !self.ctx().contains(Context::InDeclare)\n  186 |                 {\n  187 |                     self.emit_err(\n  188 |                         self.span(start),\n  189 |                         SyntaxError::ConstDeclarationsRequireInitialization,\n  190 |                     );\n  191 | \n  192 |                     None\n  193 |                 } else {\n  194 |                     match name {\n  195 |                         Pat::Ident(..) => None,\n  196 |                         _ => {\n  197 |                             syntax_error!(self, self.span(start), SyntaxError::PatVarWithoutInit)\n  198 |                         }\n  199 |                     }\n  200 |                 }\n  201 |             }\n  202 |         } else {\n  203 |             // e.g. for(let a;;)\n  204 |             None\n  205 |         };","lines":36,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/stmt.rs#L170-L205"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `\"opaque\"` arm of `parse_ts_decl`, when `next` is true the parser bumps the `opaque` word before checking that the following token is `type`. If it is not `type` the arm falls through to the final `Ok(None)` having already consumed the `opaque` token. On the non-backtracked call path (`try_parse_ts_declare` calls `parse_ts_decl(..., next=true)` inside a plain `do_inside_of_context`, not a checkpointed `try_parse_ts`), this silently drops a token for input like `declare opaque foo`.","fix":"Look ahead (peek) for `type` before bumping `opaque`, or only bump after confirming the `Token::Type` follows, so the token is not consumed when the declaration does not match.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:5197-5207","code":" 5197 |             \"opaque\" if self.input().syntax().flow() => {\n 5198 |                 if next {\n 5199 |                     self.bump();\n 5200 |                 }\n 5201 |                 if self.input().is(Token::Type) && !self.input().had_line_break_before_cur() {\n 5202 |                     return self\n 5203 |                         .parse_flow_opaque_type_alias_decl(start)\n 5204 |                         .map(From::from)\n 5205 |                         .map(Some);\n 5206 |                 }\n 5207 |             }","lines":11,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L5197-L5207"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`RenameApplyVisitor::visit_mut_ident` renames any identifier whose `span.lo.0` matches a key in `rename_plan`, with no node-kind check. The plan is built purely from `span.lo` positions (apply_renames.rs:48-56). If two distinct AST nodes share the same `span.lo` (synthetic/zero-width spans produced during conversion, or BytePos collisions), an unintended identifier can be renamed. Positional matching by `span.lo` alone is fragile compared to identity/binding-based matching.","fix":"Confirm spans of distinct reference nodes are guaranteed unique post-conversion; if not, key the rename plan on a more robust identity than raw `span.lo`.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/apply_renames.rs:79-92","code":"   79 |     fn rename_ident(&self, ident: &mut swc::Ident) -> bool {\n   80 |         let Some(renamed) = self.renamed_at(ident.span.lo.0) else {\n   81 |             return false;\n   82 |         };\n   83 | \n   84 |         ident.sym = Atom::from(renamed);\n   85 |         true\n   86 |     }\n   87 | }\n   88 | \n   89 | impl VisitMut for RenameApplyVisitor<'_> {\n   90 |     fn visit_mut_ident(&mut self, ident: &mut swc::Ident) {\n   91 |         self.rename_ident(ident);\n   92 |     }","lines":14,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/apply_renames.rs#L79-L92"},{"ref":"crates/swc_ecma_react_compiler/src/apply_renames.rs:48-56","code":"   48 |     scope_info\n   49 |         .ref_node_id_to_binding\n   50 |         .iter()\n   51 |         .filter_map(|(&position, binding_id)| {\n   52 |             renamed_bindings\n   53 |                 .get(binding_id)\n   54 |                 .map(|renamed| (position, renamed.clone()))\n   55 |         })\n   56 |         .collect()","lines":9,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/apply_renames.rs#L48-L56"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"position() computes column as a raw UTF-8 byte offset (offset - line_start) and index as a byte offset, while the doc comment notes Babel/React-Compiler expect UTF-16-based columns/indices. For any source line containing multi-byte characters before a node, the reported column/index will be wrong (too large), which can mislead downstream diagnostics that rely on loc.","fix":"Either compute column/index as UTF-16 code-unit offsets (counting char.len_utf16() from the line start), or document this as an accepted limitation that callers must not depend on for column-accurate diagnostics with non-ASCII input.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast.rs:103-115","code":"  103 |     fn position(&self, offset: u32) -> Position {\n  104 |         let offset = offset.saturating_sub(1).min(self.source_text.len() as u32);\n  105 |         let line_idx = match self.line_offsets.binary_search(&offset) {\n  106 |             Ok(idx) => idx,\n  107 |             Err(idx) => idx.saturating_sub(1),\n  108 |         };\n  109 |         let line_start = self.line_offsets[line_idx];\n  110 |         Position {\n  111 |             line: line_idx as u32 + 1,\n  112 |             column: offset - line_start,\n  113 |             index: Some(offset),\n  114 |         }\n  115 |     }","lines":13,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast.rs#L103-L115"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"convert_program builds the interpreter directive only when source_text.starts_with(\"#!\"), but uses `shebang` (which is Some) for the value. If a Module/Script carries a shebang atom whose source does not actually begin with `#!` (e.g. after a transform that set shebang on a synthesized program), the directive is silently dropped; conversely the span is computed from source_text via find('\\n') rather than from the shebang length, so a shebang followed by \\r\\n yields a span that includes the trailing \\r is excluded but CRLF handling is implicit. The value/span derivation are inconsistent sources of truth.","fix":"Derive the interpreter directive span and presence from the shebang atom itself (length/position) rather than re-scanning source_text, so the value and span come from the same source of truth.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast.rs:144-160","code":"  144 |         let interpreter = match program {\n  145 |             swc::Program::Module(module) => module.shebang.as_ref(),\n  146 |             swc::Program::Script(script) => script.shebang.as_ref(),\n  147 |         }\n  148 |         .and_then(|shebang| {\n  149 |             self.source_text.starts_with(\"#!\").then(|| {\n  150 |                 let end = self\n  151 |                     .source_text\n  152 |                     .find('\\n')\n  153 |                     .unwrap_or(self.source_text.len()) as u32;\n  154 |                 let span = Span::new(swc_common::BytePos(1), swc_common::BytePos(1 + end));\n  155 |                 InterpreterDirective {\n  156 |                     base: self.make_base_node(span),\n  157 |                     value: shebang.to_string(),\n  158 |                 }\n  159 |             })\n  160 |         });","lines":17,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast.rs#L144-L160"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"When `meta.meta.name`/`property.name` do not match the `import.meta` pattern, the converter unconditionally assumes `new.target`. A malformed or unexpected MetaProperty (anything other than import.meta) is silently coerced to NewTarget, which may be wrong.","fix":"Match explicitly on the `new`/`target` pair for NewTarget and emit Invalid (or a diagnostic) for unrecognized meta properties, rather than defaulting to NewTarget.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs:789-796","code":"  789 |             Expression::MetaProperty(meta) => swc::Expr::MetaProp(swc::MetaPropExpr {\n  790 |                 span: self.span_from_base(&meta.base),\n  791 |                 kind: if meta.meta.name == \"import\" && meta.property.name == \"meta\" {\n  792 |                     swc::MetaPropKind::ImportMeta\n  793 |                 } else {\n  794 |                     swc::MetaPropKind::NewTarget\n  795 |                 },\n  796 |             }),","lines":8,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs#L789-L796"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`load_arrow` and `load_function` truncate to the shorter of the two param lists via `zip`. If the reverse-converted node has fewer params than were saved (or vice versa), saved TypeScript param type annotations / decorators for the trailing params are silently dropped. There is no length assertion to catch the desync between save and load.","fix":"Add a debug assertion that the param counts match before zipping, so a save/load mismatch surfaces in tests rather than silently losing type metadata.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/preserved_ast.rs:129-133","code":"  129 |         for (param, source_param) in arrow.params.iter_mut().zip(snapshot.params) {\n  130 |             if let Some(source_param) = source_param {\n  131 |                 source_param.apply_to_pat(param);\n  132 |             }\n  133 |         }","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/preserved_ast.rs#L129-L133"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In parse_atom, after `self.reader.eat('\\')` succeeds but parse_atom_escape returns Ok(None), the backslash has already been consumed and execution falls through to parse_character_class / parse_capturing_group / parse_ignore_group, which then peek at whatever followed the backslash. The reader is not rewound to before the '\\'. For a trailing lone '\\' or a '\\' followed by a class/group opener, this can mis-parse the character after the escape as a new construct instead of reporting an escape error at the right position. Contrast parse_extended_atom (the non-Unicode path) which always errors when an escape after '\\' is not recognized.","fix":"Take a checkpoint before eat('\\') and rewind on the None branch, or return an explicit escape error when parse_atom_escape yields None after a consumed backslash, matching the Annex B / Unicode-mode grammar expectations.","locations":[{"ref":"crates/swc_ecma_regexp/src/parser/pattern_parser/pattern_parser_impl.rs:332-360","code":"  332 |         // \\ AtomEscape[?UnicodeMode, ?NamedCaptureGroups]\n  333 |         if self.reader.eat('\\\\') {\n  334 |             if let Some(atom_escape) = self.parse_atom_escape(span_start)? {\n  335 |                 return Ok(Some(atom_escape));\n  336 |             }\n  337 |         }\n  338 | \n  339 |         // CharacterClass[?UnicodeMode, ?UnicodeSetsMode]\n  340 |         if let Some(character_class) = self.parse_character_class()? {\n  341 |             return Ok(Some(ast::Term::CharacterClass(Box::new(character_class))));\n  342 |         }\n  343 | \n  344 |         // ( GroupSpecifier[?UnicodeMode][opt] Disjunction[?UnicodeMode,\n  345 |         // ?UnicodeSetsMode, ?NamedCaptureGroups] ) ( Disjunction[?UnicodeMode,\n  346 |         // ?UnicodeSetsMode, ?NamedCaptureGroups] )\n  347 |         if let Some(capturing_group) = self.parse_capturing_group()? {\n  348 |             return Ok(Some(ast::Term::CapturingGroup(Box::new(capturing_group))));\n  349 |         }\n  350 | \n  351 |         // (?: Disjunction[?UnicodeMode, ?UnicodeSetsMode, ?NamedCaptureGroups] )\n  352 |         // (? RegularExpressionModifiers : Disjunction[~UnicodeMode, ~UnicodeSetsMode,\n  353 |         // ?NamedCaptureGroups] ) (? RegularExpressionModifiers -\n  354 |         // RegularExpressionModifiers : Disjunction[~UnicodeMode, ~UnicodeSetsMode,\n  355 |         // ?NamedCaptureGroups] )\n  356 |         if let Some(ignore_group) = self.parse_ignore_group()? {\n  357 |             return Ok(Some(ast::Term::IgnoreGroup(Box::new(ignore_group))));\n  358 |         }\n  359 | \n  360 |         Ok(None)","lines":29,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_regexp/src/parser/pattern_parser/pattern_parser_impl.rs#L332-L360"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`visit_if_stmt` in the stopper visitor sets `self.in_cond = true` twice (lines 1944 and 1946) instead of restoring/keeping it before visiting `alt`. The second assignment is a copy-paste of the first; it is harmless because both branches of an `if` are conditional, but it is clearly a typo (the symmetry with surrounding save/restore code suggests it was meant to mirror line 1944). At minimum it is misleading dead-ish code.","fix":"Remove the redundant second `self.in_cond = true;` on line 1946 (it has no effect), or document why both are set.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/branch/mod.rs:1980-1987","code":" 1980 |         fn visit_if_stmt(&mut self, node: &IfStmt) {\n 1981 |             let old = self.in_cond;\n 1982 |             self.in_cond = true;\n 1983 |             node.cons.visit_with(self);\n 1984 |             self.in_cond = true;\n 1985 |             node.alt.visit_with(self);\n 1986 |             self.in_cond = old;\n 1987 |         }","lines":8,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/branch/mod.rs#L1980-L1987"}]},
