{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Field name typo `found_arguemnts` / `bindings_affected_by_arguements` (and local `arguements`) is used pervasively in the `Scope` struct and `with_scope`. Not a correctness bug but it obscures the `arguments`-capture logic, which is correctness-critical (it forces params used via `arguments` to be retained). A misspelled, easily-mistyped field in safety-critical retention logic is a maintenance hazard.","fix":"Rename to `found_arguments` / `bindings_affected_by_arguments`.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:344-345","code":"  344 |     found_arguemnts: bool,\n  345 |     bindings_affected_by_arguements: Vec<Id>,","lines":2,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L344-L345"},{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:412-422","code":"  412 |         if child_scope.found_arguemnts {\n  413 |             // Parameters\n  414 | \n  415 |             for id in child_scope.bindings_affected_by_arguements {\n  416 |                 self.data.used_names.entry(id).or_default().usage += 1;\n  417 |             }\n  418 | \n  419 |             if !matches!(kind, ScopeKind::Fn) {\n  420 |                 self.scope.found_arguemnts = true;\n  421 |             }\n  422 |         }","lines":11,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L412-L422"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The eval-affected binding set is populated only inside `visit_arrow_expr`/`visit_function` via `collect_decls(n)` of the single function node, but the comment at line 383 says \"mark all declarations in scope and upper as used\". The upper scopes are handled indirectly: `with_scope` sets the parent's `found_direct_eval = true`, so when the parent function node finishes visiting it will (because the flag is now set) compute its own `collect_decls` and mark them. This chain is correct only because every enclosing scope on the path is a `Function`/`ArrowExpr` whose post-children block re-checks `found_direct_eval`. Block scopes (e.g. a bare `{ }` containing `eval`) are not separate `Analyzer` scopes here, so they share the function scope - acceptable. The subtlety: the doc comment describes a behavior (\"in scope and upper\") that is achieved by a non-obvious flag-propagation chain, making it easy to break when refactoring scope handling.","fix":"Document that outer-scope marking relies on `found_direct_eval` bubbling up so each enclosing function node re-runs `collect_decls`. Add a fixture: `var a; function f(){ function g(){ eval(s) } }` and confirm `a` is retained, to lock the chain against regressions.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:403-422","code":"  403 |         // If we found eval, mark all declarations in scope and upper as used\n  404 |         if child_scope.found_direct_eval {\n  405 |             for id in child_scope.bindings_affected_by_eval {\n  406 |                 self.data.used_names.entry(id).or_default().usage += 1;\n  407 |             }\n  408 | \n  409 |             self.scope.found_direct_eval = true;\n  410 |         }\n  411 | \n  412 |         if child_scope.found_arguemnts {\n  413 |             // Parameters\n  414 | \n  415 |             for id in child_scope.bindings_affected_by_arguements {\n  416 |                 self.data.used_names.entry(id).or_default().usage += 1;\n  417 |             }\n  418 | \n  419 |             if !matches!(kind, ScopeKind::Fn) {\n  420 |                 self.scope.found_arguemnts = true;\n  421 |             }\n  422 |         }","lines":20,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L403-L422"},{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:761-783","code":"  761 |     fn visit_arrow_expr(&mut self, n: &ArrowExpr) {\n  762 |         self.with_scope(ScopeKind::ArrowFn, |v| {\n  763 |             n.visit_children_with(v);\n  764 | \n  765 |             if v.scope.found_direct_eval {\n  766 |                 v.scope.bindings_affected_by_eval = collect_decls(n);\n  767 |             }\n  768 |         })\n  769 |     }\n  770 | \n  771 |     fn visit_function(&mut self, n: &Function) {\n  772 |         self.with_scope(ScopeKind::Fn, |v| {\n  773 |             n.visit_children_with(v);\n  774 | \n  775 |             if v.scope.found_direct_eval {\n  776 |                 v.scope.bindings_affected_by_eval = collect_decls(n);\n  777 |             }\n  778 | \n  779 |             if v.scope.found_arguemnts {\n  780 |                 v.scope.bindings_affected_by_arguements = find_pat_ids(&n.params);\n  781 |             }\n  782 |         })\n  783 |     }","lines":23,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L761-L783"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In `get_ascii_only_ident` (used to emit IDENTIFIERS, not string literals), supplementary-plane chars (> U+FFFF) on an Es5 target are written with literal surrounding double-quote characters via the format string `r#\"\"\\u{h:04X}\\u{l:04X}\"\"#`. This injects stray `\"` characters into the middle of an identifier, producing invalid JS such as `foo\"\\uD834\\uDD1E\"bar`. The quotes were clearly copy-pasted from a string-literal escaping path; identifiers must not be quoted.","fix":"Emit the surrogate escapes without the wrapping quotes: `write!(buf, \"\\\\u{h:04X}\\\\u{l:04X}\")`.","locations":[{"ref":"crates/swc_ecma_codegen/src/lib.rs:1420-1428","code":" 1420 |                     if target <= EsVersion::Es5 {\n 1421 |                         // https://mathiasbynens.be/notes/javascript-encoding#surrogate-formulae\n 1422 |                         let h = ((c as u32 - 0x10000) / 0x400) + 0xd800;\n 1423 |                         let l = (c as u32 - 0x10000) % 0x400 + 0xdc00;\n 1424 | \n 1425 |                         let _ = write!(buf, r#\"\"\\u{h:04X}\\u{l:04X}\"\"#);\n 1426 |                     } else {\n 1427 |                         let _ = write!(buf, \"\\\\u{{{:04X}}}\", c as u32);\n 1428 |                     }","lines":9,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/lib.rs#L1420-L1428"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`visit_for_in_stmt` visits the right-hand expression twice: once in the parent scope (`n.right.visit_with(self)`) and again inside the child block scope (`n.right.visit_with(child)`). The analogous `visit_for_of_stmt` visits `n.right` only once (parent scope). The right-hand side of a `for...in` head is evaluated exactly once before the loop, so every identifier in it gets its `ref_count`/`usage_count` and other usage flags (e.g. EXECUTED_MULTIPLE_TIME / USED_IN_COND applied by the child head context) double-counted and incorrectly marked. This skews downstream inlining/DCE decisions for `for (x in obj)` versus `for (x of obj)`.","fix":"Remove the redundant `n.right.visit_with(child);` call at line 949 so the right-hand side is visited only once in the parent scope, mirroring `visit_for_of_stmt`.","locations":[{"ref":"crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs:981-1006","code":"  981 |     fn visit_for_in_stmt(&mut self, n: &ForInStmt) {\n  982 |         n.right.visit_with(self);\n  983 | \n  984 |         self.with_child(SyntaxContext::empty(), ScopeKind::Block, |child| {\n  985 |             let head_ctx = child\n  986 |                 .ctx\n  987 |                 .with(BitContext::InLeftOfForLoop, true)\n  988 |                 .with(BitContext::IsIdRef, true)\n  989 |                 .with(BitContext::ExecutedMultipleTime, true)\n  990 |                 .with(BitContext::InCond, true);\n  991 |             n.left.visit_with(&mut *child.with_ctx(head_ctx));\n  992 | \n  993 |             n.right.visit_with(child);\n  994 | \n  995 |             if let ForHead::Pat(pat) = &n.left {\n  996 |                 child.with_ctx(head_ctx).report_assign_pat(pat, true)\n  997 |             }\n  998 | \n  999 |             let ctx = child\n 1000 |                 .ctx\n 1001 |                 .with(BitContext::ExecutedMultipleTime, true)\n 1002 |                 .with(BitContext::InCond, true);\n 1003 | \n 1004 |             child.with_ctx(ctx).visit_in_cond(&n.body);\n 1005 |         });\n 1006 |     }","lines":26,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs#L981-L1006"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In the inlining pass (sibling under simplify/), `visit_mut_var_declarator` analysis branch has the match arm `Some(e) | Some(e) if e.is_lit() || e.is_ident()`. The same binding `Some(e)` is repeated in an or-pattern, which is a copy-paste artifact - the second alternative is identical and dead. This is harmless but clearly unintended.","fix":"Collapse to a single `Some(e) if e.is_lit() || e.is_ident() =>`.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/inlining/mod.rs:638","code":"  638 |                         Some(e) | Some(e) if e.is_lit() || e.is_ident() => {","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/inlining/mod.rs#L638"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`parse_normal_for_head` parses the `test` expression then calls `self.input_mut().eat(Token::Semi)` and discards the result. A missing second semicolon in a C-style for head (e.g. `for (a; b c)`) is silently accepted instead of producing a diagnostic: after `test = b`, the semicolon is not present, `eat` returns false (ignored), and the `update` branch then parses `c` as the update with no error. This swallows a real syntax error.","fix":"After parsing `test`, require the separating semicolon (e.g. `self.expect(Token::Semi)?` or emit an error when `eat(Token::Semi)` returns false) instead of silently discarding it.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/stmt.rs:67-79","code":"   67 |         let test = if self.input_mut().eat(Token::Semi) {\n   68 |             None\n   69 |         } else {\n   70 |             let test = self.allow_in_expr(|p| p.parse_expr()).map(Some)?;\n   71 |             self.input_mut().eat(Token::Semi);\n   72 |             test\n   73 |         };\n   74 | \n   75 |         let update = if self.input().is(Token::RParen) {\n   76 |             None\n   77 |         } else {\n   78 |             self.allow_in_expr(|p| p.parse_expr()).map(Some)?\n   79 |         };","lines":13,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/stmt.rs#L67-L79"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`read_number` parses the assembled float text with `raw.parse().expect(\"failed to parse float literal\")`. The substring is built from lexer bytes and is normally well-formed, but relying on `expect` for a value derived from untrusted source is fragile; any future edge case (or an unanticipated byte slipping into the slice) turns into a panic rather than a syntax error.","fix":"Map the parse failure to a `SyntaxError` (e.g. via `self.error(start, SyntaxError::...)`) instead of `expect`, preserving the lexer's no-panic-on-malformed-input contract.","locations":[{"ref":"crates/swc_ecma_parser/src/lexer/mod.rs:1245-1246","code":" 1245 |             let raw = remove_underscore(raw, has_underscore);\n 1246 |             raw.parse().expect(\"failed to parse float literal\")","lines":2,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/lexer/mod.rs#L1245-L1246"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Inconsistent error handling for `readonly` modifier on a method. In the explicit-generator branch a readonly modifier is reported with the non-fatal `emit_err` (parsing continues and produces a member), but in the regular method branch and the async method branch the identical condition uses the fatal `syntax_error!` which aborts parsing of the whole class. The same source-level mistake (`readonly foo() {}` vs `readonly *foo() {}`) therefore yields different recovery behavior and a different error stream for no principled reason.","fix":"Pick one strategy. For best error recovery on untrusted input, change the two `syntax_error!(self, self.span(start), SyntaxError::ReadOnlyMethod)` calls (lines 1154 and 1371) to `self.emit_err(self.span(start), SyntaxError::ReadOnlyMethod)` so all three readonly-on-method cases recover identically.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/class_and_fn.rs:1233-1235","code":" 1233 |             if readonly.is_some() {\n 1234 |                 self.emit_err(self.span(start), SyntaxError::ReadOnlyMethod);\n 1235 |             }","lines":3,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/class_and_fn.rs#L1233-L1235"},{"ref":"crates/swc_ecma_parser/src/parser/class_and_fn.rs:1290-1292","code":" 1290 |             if readonly.is_some() {\n 1291 |                 syntax_error!(self, self.span(start), SyntaxError::ReadOnlyMethod);\n 1292 |             }","lines":3,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/class_and_fn.rs#L1290-L1292"},{"ref":"crates/swc_ecma_parser/src/parser/class_and_fn.rs:1290-1292","code":" 1290 |             if readonly.is_some() {\n 1291 |                 syntax_error!(self, self.span(start), SyntaxError::ReadOnlyMethod);\n 1292 |             }","lines":3,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/class_and_fn.rs#L1290-L1292"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"The Flow-specific code paths reuse `SyntaxError::TS1003` (\"Identifier expected\") as a generic catch-all for a wide range of unrelated grammar violations: optional rest elements, duplicate enum members, invalid enum member kinds, exact/inexact object misuse, missing type annotations, reserved type names, legacy octal escapes, spread placement, etc. This produces misleading diagnostics for malformed input and makes it hard to distinguish real \"identifier expected\" errors from these reused codes.","fix":"Introduce dedicated Flow-specific `SyntaxError` variants (or reuse the matching tsc error codes) for these distinct conditions instead of overloading TS1003.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:1902-1956","code":" 1902 |                 self.emit_err(*span, SyntaxError::TS1003);\n 1903 |             }\n 1904 | \n 1905 |             if *kind == FlowEnumMemberKind::Invalid {\n 1906 |                 self.emit_err(*span, SyntaxError::TS1003);\n 1907 |                 continue;\n 1908 |             }\n 1909 | \n 1910 |             if let Some(explicit_kind) = explicit_kind {\n 1911 |                 match kind {\n 1912 |                     FlowEnumMemberKind::Defaulted => {\n 1913 |                         if explicit_kind == FlowEnumKind::String {\n 1914 |                             saw_defaulted_string_member = true;\n 1915 |                         }\n 1916 |                         if !matches!(explicit_kind, FlowEnumKind::String | FlowEnumKind::Symbol) {\n 1917 |                             self.emit_err(*span, SyntaxError::TS1003);\n 1918 |                         }\n 1919 |                     }\n 1920 |                     _ => {\n 1921 |                         if explicit_kind == FlowEnumKind::String\n 1922 |                             && *kind == FlowEnumMemberKind::String\n 1923 |                         {\n 1924 |                             saw_initialized_string_member = true;\n 1925 |                         }\n 1926 |                         if explicit_kind == FlowEnumKind::Symbol\n 1927 |                             || !Self::flow_enum_kind_matches_member(explicit_kind, *kind)\n 1928 |                         {\n 1929 |                             self.emit_err(*span, SyntaxError::TS1003);\n 1930 |                         }\n 1931 |                     }\n 1932 |                 }\n 1933 |             } else {\n 1934 |                 match kind {\n 1935 |                     FlowEnumMemberKind::Defaulted => {\n 1936 |                         if matches!(\n 1937 |                             inferred_kind,\n 1938 |                             FlowEnumKind::Number | FlowEnumKind::Boolean | FlowEnumKind::BigInt\n 1939 |                         ) {\n 1940 |                             self.emit_err(*span, SyntaxError::TS1003);\n 1941 |                         }\n 1942 |                     }\n 1943 |                     _ => {\n 1944 |                         if !Self::flow_enum_kind_matches_member(inferred_kind, *kind) {\n 1945 |                             self.emit_err(*span, SyntaxError::TS1003);\n 1946 |                         }\n 1947 |                     }\n 1948 |                 }\n 1949 |             }\n 1950 |         }\n 1951 | \n 1952 |         if explicit_kind == Some(FlowEnumKind::String)\n 1953 |             && saw_defaulted_string_member\n 1954 |             && saw_initialized_string_member\n 1955 |         {\n 1956 |             self.emit_err(members[0].0, SyntaxError::TS1003);","lines":55,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L1902-L1956"},{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:2876-2910","code":" 2876 |             self.emit_err(self.input().cur_span(), SyntaxError::TS1003);\n 2877 |         }\n 2878 | \n 2879 |         let variance_span = if self.input().syntax().flow() {\n 2880 |             if self.input_mut().eat(Token::Plus) || self.input_mut().eat(Token::Minus) {\n 2881 |                 Some(self.input().prev_span())\n 2882 |             } else {\n 2883 |                 None\n 2884 |             }\n 2885 |         } else {\n 2886 |             None\n 2887 |         };\n 2888 | \n 2889 |         let label = self.try_parse_ts_tuple_element_name();\n 2890 | \n 2891 |         if self.input().syntax().flow() {\n 2892 |             if variance_span.is_some() && label.is_none() {\n 2893 |                 self.emit_err(variance_span.unwrap(), SyntaxError::TS1003);\n 2894 |             }\n 2895 | \n 2896 |             if let Some(Pat::Rest(rest)) = &label {\n 2897 |                 if let Pat::Ident(ident) = rest.arg.as_ref() {\n 2898 |                     if ident.id.optional {\n 2899 |                         self.emit_err(ident.id.span, SyntaxError::TS1003);\n 2900 |                     }\n 2901 |                 }\n 2902 |             }\n 2903 |         }\n 2904 | \n 2905 |         if self.input_mut().eat(Token::DotDotDot) {\n 2906 |             let type_ann = if self.input().syntax().flow()\n 2907 |                 && (self.input().is(Token::RBracket) || self.input().is(Token::Comma))\n 2908 |             {\n 2909 |                 if self.input().is(Token::Comma) {\n 2910 |                     self.emit_err(self.input().cur_span(), SyntaxError::TS1003);","lines":35,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L2876-L2910"},{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:4068","code":" 4068 |                     self.emit_err(members[first_idx].span(), SyntaxError::TS1003);","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L4068"},{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:4136","code":" 4136 |                     self.emit_err(member.span(), SyntaxError::TS1003);","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L4136"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`create_symbol` silently no-ops the scope-binding insertion when `scope_id` is out of range (`if let Some(scope) = ... get_mut`). The symbol is still created, but it is never registered in any scope, so its `BindingData.scope` keeps the placeholder `OutScopeId(0)` and it never appears in `iter_bindings_in`. A bad scope id thus produces a silently corrupt binding instead of an error or panic.","fix":"Treat an out-of-range scope id as a programming error (debug_assert or expect), since all internal callers should always pass a valid scope id.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_scope.rs:327-329","code":"  327 |         if let Some(scope) = self.scopes.get_mut(scope_id.0 as usize) {\n  328 |             scope.bindings.insert(name, id);\n  329 |         }","lines":3,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_scope.rs#L327-L329"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"parse_unicode_escape_sequence (string-literal parser) silently swallows a too-large code point in the `\\u{...}` form. consume_hex_digits returns the value, then `.filter(|&cp| cp <= 0x10_ffff)` turns an out-of-range code point into None, after which the function rewinds and returns Ok(None); the malformed escape is then re-interpreted by the outer loop rather than reported. A value like `\\u{110000}` is within u32 range (no overflow error from consume_hex_digits) but is an invalid code point and should be a syntax error, not a silent fallback.","fix":"When `\\u{` is matched and consume_hex_digits yields a value > 0x10_FFFF (or the closing `}` is missing), emit a proper invalid-unicode-escape diagnostic instead of filtering to None and rewinding.","locations":[{"ref":"crates/swc_ecma_regexp/src/parser/reader/string_literal_parser/parser_impl.rs:369-381","code":"  369 |         if self.eat('u') {\n  370 |             if self.eat('{') {\n  371 |                 if let Some(hex_digits) = self\n  372 |                     .consume_hex_digits(offset_start)?\n  373 |                     .filter(|&cp| cp <= 0x10_ffff)\n  374 |                 {\n  375 |                     if self.eat('}') {\n  376 |                         return Ok(Some(hex_digits));\n  377 |                     }\n  378 |                 }\n  379 |             }\n  380 |             self.rewind(chckpoint);\n  381 |         }","lines":13,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_regexp/src/parser/reader/string_literal_parser/parser_impl.rs#L369-L381"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"Third pass that maps resolved references to bindings is quadratic. `get_resolved_reference_ids` linearly scans the entire `references` vector (and allocates a fresh `Vec<ReferenceId>`) on every call, and it is called once per symbol inside the loop over all symbols. Total cost is O(symbols * references) plus one heap allocation per symbol. On large modules with many bindings and references this dominates `into_scope_info`.","fix":"Iterate `self.references` once, look up each reference's `symbol_id` directly, and translate it through `symbol_to_binding` into `ref_node_id_to_binding`. This is a single linear pass with no per-symbol scan or allocation.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_scope.rs:1474-1483","code":" 1474 |         // Third pass: Map all resolved references to bindings\n 1475 |         for symbol_id in self.scoping.symbol_ids() {\n 1476 |             if let Some(&binding_id) = symbol_to_binding.get(&symbol_id) {\n 1477 |                 for ref_id in self.scoping.get_resolved_reference_ids(symbol_id) {\n 1478 |                     let reference = self.scoping.get_reference(ref_id);\n 1479 |                     let start = reference.span.lo.0;\n 1480 |                     ref_node_id_to_binding.insert(start, binding_id);\n 1481 |                 }\n 1482 |             }\n 1483 |         }","lines":10,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_scope.rs#L1474-L1483"},{"ref":"crates/swc_ecma_react_compiler/src/convert_scope.rs:300-306","code":"  300 |     pub fn get_resolved_reference_ids(&self, symbol_id: SymbolId) -> Vec<ReferenceId> {\n  301 |         self.references\n  302 |             .iter()\n  303 |             .filter(|r| r.symbol_id == Some(symbol_id))\n  304 |             .map(|r| r.id)\n  305 |             .collect()\n  306 |     }","lines":7,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_scope.rs#L300-L306"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"Resolving every `export default function` reference walks the whole `symbol_to_binding` map matching on symbol name for each default export. Besides being O(symbols) per default export, matching purely by name can bind to the wrong symbol when another binding shares the function name (e.g. a same-named local declared elsewhere), because the first name match in arbitrary HashMap order is taken.","fix":"Look up the function ident's own declaration span in the symbol table (the symbol was created via `declare_symbol_on_scope` in `visit_export_default_decl`) and map the export span to that binding directly, instead of scanning all bindings by name.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_scope.rs:1502-1521","code":" 1502 |         if let Program::Module(module) = program {\n 1503 |             for stmt in &module.body {\n 1504 |                 if let ModuleItem::ModuleDecl(ModuleDecl::ExportDefaultDecl(export)) = stmt {\n 1505 |                     if let DefaultDecl::Fn(func) = &export.decl {\n 1506 |                         if let Some(ident) = &func.ident {\n 1507 |                             let name = ident.sym.as_ref();\n 1508 |                             for (sym_id, &bind_id) in &symbol_to_binding {\n 1509 |                                 if self.scoping.symbol_name(*sym_id) == name {\n 1510 |                                     let export_start = export.span.lo.0;\n 1511 |                                     ref_node_id_to_binding\n 1512 |                                         .entry(export_start)\n 1513 |                                         .or_insert(bind_id);\n 1514 |                                     break;\n 1515 |                                 }\n 1516 |                             }\n 1517 |                         }\n 1518 |                     }\n 1519 |                 }\n 1520 |             }\n 1521 |         }","lines":20,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_scope.rs#L1502-L1521"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`lint` only sets `opts.no_emit = true` and then calls the full `transform`, which still runs `convert_program_to_swc` and `apply_renames` to build a `Program` (lib.rs:128-132) that `lint` immediately discards (it returns only `diagnostics`). For a lint-only pass this performs the entire reverse AST conversion and rename application for nothing. The `no_emit` flag is passed to the upstream compiler but the SWC-side reverse conversion/rename work is unconditional.","fix":"Have `transform` (or a shared internal) skip `convert_program_to_swc`/`apply_renames` when `options.no_emit` is set, since the resulting program is never used in the lint path.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/lib.rs:157-170","code":"  157 | pub fn lint(\n  158 |     program: &Program,\n  159 |     source_type: SourceType,\n  160 |     source_text: &str,\n  161 |     comments: Option<&SingleThreadedComments>,\n  162 |     options: PluginOptions,\n  163 | ) -> LintResult {\n  164 |     let mut opts = options;\n  165 |     opts.no_emit = true;\n  166 |     let result = transform(program, source_type, source_text, comments, opts);\n  167 |     LintResult {\n  168 |         diagnostics: result.diagnostics,\n  169 |     }\n  170 | }","lines":14,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/lib.rs#L157-L170"},{"ref":"crates/swc_ecma_react_compiler/src/lib.rs:118-129","code":"  118 |     let rename_plan = build_rename_plan(&scope_info, &renames);\n  119 |     let program = file.map(|file: react_compiler_ast::File| {\n  120 |         let mut compiled = convert_program_to_swc(&file, preserved_ast);\n  121 |         apply_renames(&mut compiled, &rename_plan);\n  122 |         compiled\n  123 |     });\n  124 | \n  125 |     TransformResult {\n  126 |         program,\n  127 |         diagnostics,\n  128 |         events,\n  129 |     }","lines":12,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/lib.rs#L118-L129"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`visit_mut_par` ignores its `_threshold` parameter and always runs sequentially, despite the module doc-comment at the top of the file claiming \"This becomes parallel if `concurrent` feature is enabled.\" Every call site passes `cpu_count() * 8` as a threshold (computing `cpu_count()` each time) for a function that never parallelizes and never uses the value. This is both dead computation (repeated `cpu_count()` calls) and a misleading API/comment.","fix":"Either implement the concurrent path under the `concurrent` feature (using the threshold), or drop the unused `_threshold` parameter and the per-call `cpu_count() * 8` computations and fix the misleading doc-comment.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:975-982","code":"  975 |     fn visit_mut_par<N>(&mut self, _threshold: usize, nodes: &mut [N])\n  976 |     where\n  977 |         N: Send + Sync + VisitMutWith<Self>,\n  978 |     {\n  979 |         for n in nodes {\n  980 |             n.visit_mut_with(self);\n  981 |         }\n  982 |     }","lines":8,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L975-L982"},{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:25","code":"   25 | /// Note: This becomes parallel if `concurrent` feature is enabled.","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L25"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`TplElement::emit` unconditionally allocates two new Strings via `self.raw.replace(\"\\r\\n\", \"\\n\").replace('\\r', \"\\n\")` for every template element, even on the common fast path where the raw text contains no carriage returns and is then emitted as-is. This runs in a hot emit loop.","fix":"Skip the replacement when `!self.raw.contains('\\r')`, e.g. borrow the original raw and only allocate when a `\\r` is actually present (use `memchr`/`Cow`).","locations":[{"ref":"crates/swc_ecma_codegen/src/lib.rs:2232","code":" 2232 |         let raw = self.raw.replace(\"\\r\\n\", \"\\n\").replace('\\r', \"\\n\");","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/lib.rs#L2232"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"ReturnStmt recomputes self.arg.as_deref() a second time to derive need_paren even though `arg` is already the bound &Expr from the enclosing `if let Some(arg) = self.arg.as_deref()`. The map/unwrap_or chain is redundant; it can use `arg` directly.","fix":"Replace the need_paren computation with `let need_paren = emitter.has_leading_comment(arg);` using the already-bound `arg`, matching the ThrowStmt pattern at lines 302-303.","locations":[{"ref":"crates/swc_ecma_codegen/src/stmt.rs:153-158","code":"  153 |         if let Some(arg) = self.arg.as_deref() {\n  154 |             let need_paren = self\n  155 |                 .arg\n  156 |                 .as_deref()\n  157 |                 .map(|expr| emitter.has_leading_comment(expr))\n  158 |                 .unwrap_or(false);","lines":6,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/stmt.rs#L153-L158"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"CatchClause allocates a Vec<String> and calls name.to_string() for every catch-binding name solely to defer add_scope_variable calls past the for_each_pat_binding closure. The project style explicitly prefers &str over owned String for this kind of work. Each binding incurs a heap allocation in the scope-tracking emit path.","fix":"Collect borrowed &str into a Vec<&str> (the binding names come from Atom-backed syms and outlive the loop), or restructure so add_scope_variable is invoked without the intermediate owned strings.","locations":[{"ref":"crates/swc_ecma_codegen/src/stmt.rs:234-240","code":"  234 |             if emitter.scope_tracking_enabled() {\n  235 |                 let mut names = vec![];\n  236 |                 for_each_pat_binding(param, &mut |name| names.push(name.to_string()));\n  237 |                 for name in names {\n  238 |                     emitter.add_scope_variable(&name, Some(&name), BindingStorage::Lexical)?;\n  239 |                 }\n  240 |             }","lines":7,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_codegen/src/stmt.rs#L234-L240"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"On a successful shorthand merge, `new_b.clone()` is used to build the `KeyValueProp` value while `new_b` is still needed afterwards only by the `is_skippable_for_seq(Some(a), &new_b)` check (line 2051). If the branch returned `Ok(true)` immediately (see the logic_error finding) the clone could be eliminated by moving `new_b` into the prop. This runs inside the O(n^2) merge loop, a hot path for large files.","fix":"Once the branch returns early on success, move `new_b` into `value` instead of cloning: `value: Box::new(new_b)`.","locations":[{"ref":"crates/swc_ecma_minifier/src/compress/optimize/sequences.rs:1993-2002","code":" 1993 |                                     let mut new_b = shorthand.clone().into();\n 1994 |                                     if self.merge_sequential_expr(a, &mut new_b)? {\n 1995 |                                         **prop = Prop::KeyValue(KeyValueProp {\n 1996 |                                             key: Ident::new_no_ctxt(\n 1997 |                                                 shorthand.sym.clone(),\n 1998 |                                                 shorthand.span,\n 1999 |                                             )\n 2000 |                                             .into(),\n 2001 |                                             value: new_b.clone().into(),\n 2002 |                                         });","lines":10,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/optimize/sequences.rs#L1993-L2002"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Redundant span recomputation in `make_property`. In each match arm `let span = p.span(start);` is computed and bound, then `p.span(start)` is called a second time when constructing the struct (`PrivateProp { span: p.span(start), ... }`), recomputing the identical span instead of reusing the already-bound `span`. Cheap, but pointless duplicate work and a copy-paste smell that diverges from the `Key::Public` arm which reuses `span`.","fix":"In the `Key::Private` arm reuse the bound binding: `PrivateProp { span, ... }` instead of `span: p.span(start)`.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/class_and_fn.rs:999-1019","code":"  999 |                 Key::Private(key) => {\n 1000 |                     let span = p.span(start);\n 1001 |                     if accessibility.is_some() {\n 1002 |                         p.emit_err(span.with_hi(key.span_hi()), SyntaxError::TS18010);\n 1003 |                     }\n 1004 | \n 1005 |                     PrivateProp {\n 1006 |                         span: p.span(start),\n 1007 |                         key,\n 1008 |                         value,\n 1009 |                         is_static,\n 1010 |                         decorators,\n 1011 |                         accessibility,\n 1012 |                         is_optional,\n 1013 |                         is_override,\n 1014 |                         readonly,\n 1015 |                         type_ann,\n 1016 |                         definite,\n 1017 |                         ctxt: Default::default(),\n 1018 |                     }\n 1019 |                     .into()","lines":21,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/class_and_fn.rs#L999-L1019"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"On the invalid `**` left-operand path the error formats the left expression with `format!(\"{left:?}\")`, producing a full Debug dump of the AST node into the error message. The code comment already flags this as not ideal (`// FIXME: Use display`). For a large left expression this allocates a potentially huge string on the error path.","fix":"Replace the Debug formatting with a concise Display-based or span-only message, or drop the operand text entirely and rely on the span.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/expr.rs:2240-2247","code":" 2240 |                     syntax_error!(\n 2241 |                         self,\n 2242 |                         SyntaxError::UnaryInExp {\n 2243 |                             // FIXME: Use display\n 2244 |                             left: format!(\"{left:?}\"),\n 2245 |                             left_span: left.span(),\n 2246 |                         }\n 2247 |                     )","lines":8,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/expr.rs#L2240-L2247"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`items.clone()` clones the entire `Vec<AssignTargetOrSpread>` (which can contain large boxed expression trees) to pass into `parse_paren_items_as_params`, even though `items` is not used afterwards on this arrow path (the next statement pushes the produced arrow onto `items`). For the common arrow-after-paren case `(x) => ...` this is a needless deep clone in a hot parse path.","fix":"Pass ownership instead of cloning: take the single item out (e.g. `std::mem::take(&mut items)`) before calling `parse_paren_items_as_params`, then push the resulting arrow into the now-empty `items`.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/expr.rs:2692","code":" 2692 |                 let params: Vec<Pat> = self.parse_paren_items_as_params(items.clone(), None)?;","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/expr.rs#L2692"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In the TS arrow-in-conditional slow path, `items_ref.clone()` deep-clones the full paren-items vector inside the `try_parse_ts` closure. The closure runs speculatively and the clone happens even when parsing ultimately succeeds and consumes the items. The surrounding code already acknowledges this with a `// TODO: Remove clone` comment.","fix":"Restructure so the speculative parse borrows the items and only takes ownership on the committed branch, avoiding the clone in the success path.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/expr.rs:2776-2790","code":" 2776 |             // TODO: Remove clone\n 2777 |             let items_ref = &paren_items;\n 2778 |             if let Some(expr) = self.try_parse_ts(|p| {\n 2779 |                 let return_type = if p.input().syntax().flow() {\n 2780 |                     p.do_inside_of_context(Context::DisallowFlowAnonFnType, |p| {\n 2781 |                         p.parse_ts_type_or_type_predicate_ann(Token::Colon)\n 2782 |                     })?\n 2783 |                 } else {\n 2784 |                     p.parse_ts_type_or_type_predicate_ann(Token::Colon)?\n 2785 |                 };\n 2786 | \n 2787 |                 expect!(p, Token::Arrow);\n 2788 | \n 2789 |                 let params: Vec<Pat> =\n 2790 |                     p.parse_paren_items_as_params(items_ref.clone(), trailing_comma)?;","lines":15,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/expr.rs#L2776-L2790"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`flow_match_expect_case_separator` builds `format!(\"{:?}\", self.input().cur())` unconditionally at the top of the function, before checking whether the separator is present. The allocation/Debug-format work is wasted on the common success path where the token is `:` or `=>`. Although the early `eat(Token::Colon)/eat(Token::Arrow)` returns before reaching the format, the ordering is fine here; the real cost is only on the error path. Note: the format is computed only after the eats fail, so cost is bounded to error path - keep this low. The clone-free `Expected(... .into(), cur)` is acceptable.","fix":"No change strictly required; if optimizing, build the debug string lazily only inside the error branch (it already is). Leave as-is or document.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/stmt.rs:1607-1615","code":" 1607 |     fn flow_match_expect_case_separator(&mut self) -> PResult<()> {\n 1608 |         if self.input_mut().eat(Token::Colon) || self.input_mut().eat(Token::Arrow) {\n 1609 |             return Ok(());\n 1610 |         }\n 1611 | \n 1612 |         let cur = format!(\"{:?}\", self.input().cur());\n 1613 |         let span = self.input().cur_span();\n 1614 |         syntax_error!(self, span, SyntaxError::Expected(\": or =>\".into(), cur))\n 1615 |     }","lines":9,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/stmt.rs#L1607-L1615"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"convert_ident, convert_ident_name, convert_private_name, convert_prop_name and the JSX identifier helpers all call sym.to_string()/name.to_string(), allocating a fresh String for every identifier in the program. Identifier conversion is one of the hottest paths in AST conversion; the destination `name: String` field forces an allocation, but the conversions also clone idents unnecessarily in some callers (e.g. object shorthand clones the whole Identifier).","fix":"Where the AST type allows, store the atom directly or reuse a single allocation; at minimum avoid the extra Identifier clones in shorthand-property handling (lines 1448-1458, 1531-1547) by constructing key/value from the atom rather than cloning a built Identifier.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast.rs:2622-2640","code":" 2622 |     fn convert_ident(&self, id: &swc::Ident) -> Identifier {\n 2623 |         Identifier {\n 2624 |             base: self.make_base_node(id.span),\n 2625 |             name: id.sym.to_string(),\n 2626 |             type_annotation: None,\n 2627 |             optional: id.optional.then_some(true),\n 2628 |             decorators: None,\n 2629 |         }\n 2630 |     }\n 2631 | \n 2632 |     fn convert_ident_name(&self, id: &swc::IdentName) -> Identifier {\n 2633 |         Identifier {\n 2634 |             base: self.make_base_node(id.span),\n 2635 |             name: id.sym.to_string(),\n 2636 |             type_annotation: None,\n 2637 |             optional: None,\n 2638 |             decorators: None,\n 2639 |         }\n 2640 |     }","lines":19,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast.rs#L2622-L2640"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Every referenced identifier allocates a `String` via `ident.sym.to_string()` and pushes it onto `unresolved_references`, then those strings are dragged through `resolve_all_references`. For reference-heavy modules this is a large number of short-lived heap allocations in a hot path; the project guidance explicitly prefers avoiding `String` where `&str`/`Atom` suffice.","fix":"Store the `Atom` (`ident.sym.clone()`, a cheap refcount bump) instead of `String` in `unresolved_references`, and key scope binding maps on `Atom` as well, to avoid per-reference string allocation.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_scope.rs:546-550","code":"  546 |     fn reference_identifier(&mut self, ident: &Ident) {\n  547 |         let reference = Reference::new(ident.span, self.current_scope_id);\n  548 |         let name = ident.sym.to_string();\n  549 |         let _reference_id = self.declare_reference(name, reference);\n  550 |     }","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_scope.rs#L546-L550"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Stmt::DoWhile` handling clones the entire DoWhile statement just to run the conditional-stopper check: `has_conditional_stopper(&[s.clone().into()])`. The clone of the whole loop body is wasteful and runs on every do-while encountered.","fix":"Check the stopper against the borrowed body without cloning, e.g. inspect `&s.body` via a slice/helper that accepts `&Stmt`, avoiding `s.clone()`.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/branch/mod.rs:1173-1176","code":" 1173 |                 Stmt::DoWhile(s) => {\n 1174 |                     if has_conditional_stopper(&[s.clone().into()]) {\n 1175 |                         return s.into();\n 1176 |                     }","lines":4,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/branch/mod.rs#L1173-L1176"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The guard `seq.exprs.is_empty() || seq.exprs.len() <= 1` is redundant: `len() <= 1` already covers the empty case (`is_empty()` is exactly `len() == 0`).","fix":"Simplify to `if seq.exprs.len() <= 1 { return; }`.","locations":[{"ref":"crates/swc_ecma_minifier/src/compress/optimize/sequences.rs:425","code":"  425 |                 if seq.exprs.is_empty() || seq.exprs.len() <= 1 {","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/optimize/sequences.rs#L425"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`can_take_init` is initialized to `false` at line 2293, then re-assigned `false` again at line 2370 inside the `is_lit` branch. The write is a no-op and only obscures the intent (it reads as if it were toggling state).","fix":"Drop the redundant `can_take_init = false` assignment; if the branch is meant to document that the literal is kept, replace it with a comment.","locations":[{"ref":"crates/swc_ecma_minifier/src/compress/optimize/sequences.rs:2323-2327","code":" 2323 |                         if is_lit {\n 2324 |                             can_take_init = false\n 2325 |                         } else {\n 2326 |                             return Ok(false);\n 2327 |                         }","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/optimize/sequences.rs#L2323-L2327"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"Unused function parameter `_start_of_output_type` threaded through `parse_fn_inner`. It is accepted, passed in from `parse_fn`, but never read inside `parse_fn_inner` (the leading underscore confirms it is dead). It adds noise to the signature and the caller. Similarly `_start` in `parse_class_inner` is unused.","fix":"Drop `_start_of_output_type` from `parse_fn_inner`'s signature and its call site at line 513-519; drop `_start` from `parse_class_inner` and its caller at line 1798. If kept for symmetry, document why.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/class_and_fn.rs:530-537","code":"  530 |     fn parse_fn_inner(\n  531 |         &mut self,\n  532 |         _start_of_output_type: Option<BytePos>,\n  533 |         start_of_async: Option<BytePos>,\n  534 |         decorators: Vec<Decorator>,\n  535 |         is_fn_expr: bool,\n  536 |         is_ident_required: bool,\n  537 |     ) -> PResult<(Option<Ident>, Box<Function>)> {","lines":8,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/class_and_fn.rs#L530-L537"},{"ref":"crates/swc_ecma_parser/src/parser/class_and_fn.rs:1967-1973","code":" 1967 |     fn parse_class_inner(\n 1968 |         &mut self,\n 1969 |         _start: BytePos,\n 1970 |         class_start: BytePos,\n 1971 |         decorators: Vec<Decorator>,\n 1972 |         is_ident_required: bool,\n 1973 |     ) -> PResult<(Option<Ident>, Box<Class>)> {","lines":7,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/class_and_fn.rs#L1967-L1973"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"Commented-out dead code left in `parse_fn_body`. A multi-line block referencing a removed `self.ctx().span_of_fn_name` API is commented out above the active `emit_err` call. It is misleading (references an API that no longer exists) and should be removed rather than retained.","fix":"Delete the three commented-out lines (the `// self.emit_err(... span_of_fn_name ...)` block).","locations":[{"ref":"crates/swc_ecma_parser/src/parser/class_and_fn.rs:794-798","code":"  794 |             //            self.emit_err(\n  795 |             //                self.ctx().span_of_fn_name.expect(\"we are not in function\"),\n  796 |             //                SyntaxError::TS1183,\n  797 |             //            );\n  798 |             self.emit_err(self.input().cur_span(), SyntaxError::TS1183);","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/class_and_fn.rs#L794-L798"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`parse_member_expr` is annotated `#[allow(dead_code)]` and is a thin wrapper over `parse_member_expr_or_new_expr(false)` that nothing in the crate calls. The explicit allow attribute confirms it is unused dead code kept around without callers.","fix":"Remove the unused method, or document why it is retained (e.g. part of a public API surface) and drop the `#[allow(dead_code)]`.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/expr.rs:255-258","code":"  255 |     #[allow(dead_code)]\n  256 |     pub(crate) fn parse_member_expr(&mut self) -> PResult<Box<Expr>> {\n  257 |         self.parse_member_expr_or_new_expr(false)\n  258 |     }","lines":4,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/expr.rs#L255-L258"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"expr_contains_optional is a trivial wrapper that returns matches!(expr, OptChain(_)), and convert_expr_in_chain immediately re-tests the same condition with `if let swc::Expr::OptChain(chain) = expr`. The helper adds an indirection that is never used for anything else and the double-match is redundant.","fix":"Delete expr_contains_optional and collapse convert_expr_in_chain to a single match: `if let swc::Expr::OptChain(chain) = expr { self.convert_opt_chain_expr(chain) } else { self.convert_expr(expr) }`.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast.rs:796-807","code":"  796 |     fn convert_expr_in_chain(&self, expr: &swc::Expr) -> Expression {\n  797 |         if Self::expr_contains_optional(expr) {\n  798 |             if let swc::Expr::OptChain(chain) = expr {\n  799 |                 return self.convert_opt_chain_expr(chain);\n  800 |             }\n  801 |         }\n  802 |         self.convert_expr(expr)\n  803 |     }\n  804 | \n  805 |     fn expr_contains_optional(expr: &swc::Expr) -> bool {\n  806 |         matches!(expr, swc::Expr::OptChain(_))\n  807 |     }","lines":12,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast.rs#L796-L807"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`ResourceManagementVisitor::visit_var_decl` overrides the default visitor only to early-return on `self.found` and then recurse, which is exactly what the default impl does. `using`/`await using` declarations are `UsingDecl` nodes, not children of `VarDecl`, so this override can never short-circuit anything meaningful related to `found`; it is redundant boilerplate that just re-implements default traversal.","fix":"Delete the `visit_var_decl` override; rely on the default traversal which already reaches `visit_using_decl`.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/prefilter.rs:20-26","code":"   20 | impl Visit for ResourceManagementVisitor {\n   21 |     fn visit_var_decl(&mut self, decl: &swc::VarDecl) {\n   22 |         if self.found {\n   23 |             return;\n   24 |         }\n   25 |         decl.visit_children_with(self);\n   26 |     }","lines":7,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/prefilter.rs#L20-L26"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`simplified.iter().clone()` clones the iterator immediately after creating it and binds the clone to `iter`, then consumes it once. Cloning a freshly-made iterator is a no-op with no purpose; it just obscures intent and adds a needless clone per duplicate-name group.","fix":"Replace `let iter = simplified.iter().clone();` with `let iter = simplified.iter();` (or inline `for token in &simplified`).","locations":[{"ref":"crates/swc_ecma_regexp/src/parser/pattern_parser/state.rs:158","code":"  158 |             let iter = simplified.iter().clone();","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_regexp/src/parser/pattern_parser/state.rs#L158"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment for compress_lits claims `true` => `!1` and `false` => `!0`, but the code does the opposite: for `v.value == true` it emits `!0.0` (i.e. `!0`, which is `true`), and for `false` it emits `!1` (which is `false`). The mapping in the comment is inverted relative to the implementation.","fix":"Swap the comment lines to `- `true` => `!0`` and `- `false` => `!1``.","locations":[{"ref":"crates/swc_ecma_minifier/src/compress/optimize/mod.rs:594-612","code":"  594 |     ///\n  595 |     /// - `true` => `!1`\n  596 |     /// - `false` => `!0`\n  597 |     fn compress_lits(&mut self, e: &mut Expr) {\n  598 |         let lit = match e {\n  599 |             Expr::Lit(lit) => lit,\n  600 |             _ => return,\n  601 |         };\n  602 | \n  603 |         if self.options.bools_as_ints || self.options.bools {\n  604 |             if let Lit::Bool(v) = lit {\n  605 |                 self.changed = true;\n  606 |                 report_change!(\"Compressing boolean literal\");\n  607 |                 *e = UnaryExpr {\n  608 |                     span: v.span,\n  609 |                     op: op!(\"!\"),\n  610 |                     arg: Lit::Num(Number {\n  611 |                         span: v.span,\n  612 |                         value: if v.value { 0.0 } else { 1.0 },","lines":19,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/optimize/mod.rs#L594-L612"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `// infinite loop` comment above the `void` handling in visit_mut_unary_expr is misleading. It does not describe the code below it (which ignores the return value of a `void` argument). At best it is a terse note that the `Expr::Lit(Lit::Num)` early-skip guards against re-processing already-simplified `void <num>` forms; as written it reads as a meaningless / confusing label.","fix":"Replace with a comment explaining the actual intent, e.g. `// Avoid reprocessing already-simplified `void <number>`; otherwise drop the side-effect-free arg.`","locations":[{"ref":"crates/swc_ecma_minifier/src/compress/optimize/mod.rs:3150-3151","code":" 3150 |         // infinite loop\n 3151 |         if n.op == op!(\"void\") {","lines":2,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/optimize/mod.rs#L3150-L3151"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Dead commented-out `debug!` block inside a `#[cfg(feature = \"tracing-spans\")]` scope in `visit_expr`. It references fields (`in_update_arg`, `in_assign_lhs`) that no longer exist on `Ctx` (now bit-flag based), so it is stale and misleading and would not compile if uncommented.","fix":"Delete the commented-out debug block (and the now-empty cfg scope).","locations":[{"ref":"crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs:858-866","code":"  858 |             #[cfg(feature = \"tracing-spans\")]\n  859 |             {\n  860 |                 // debug!(\n  861 |                 //     \"Usage: `{}``; update = {:?}, assign_lhs = {:?} \",\n  862 |                 //     i,\n  863 |                 //     self.ctx.in_update_arg,\n  864 |                 //     self.ctx.in_assign_lhs\n  865 |                 // );\n  866 |             }","lines":9,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/usage_analyzer/analyzer/mod.rs#L858-L866"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `// dbg!(char::from_u32(fast_path_result as u32));` line is a left-over commented-out debugging statement in the string-literal scanner hot loop. It is dead/noise and should not ship.","fix":"Delete the commented-out `dbg!` line.","locations":[{"ref":"crates/swc_ecma_parser/src/lexer/mod.rs:2408","code":" 2408 |             // dbg!(char::from_u32(fast_path_result as u32));","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/lexer/mod.rs#L2408"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Misleading comment on `parse_args` closure contract. The doc comment on `parse_fn_args_body` states \"`parse_args` closure should not eat '(' or ')'\", but the function itself performs `expect!(p, Token::LParen)` (line 299) and `expect!(p, Token::RParen)` (line 330) around the closure, so the contract is enforced by the caller, not merely a convention for the closure. The comment reads as a warning to closure authors when it is actually a structural guarantee; minor confusion.","fix":"Reword to: \"The `parse_args` closure is invoked between the `(` and `)` which this function consumes, so it must not consume the parentheses itself.\"","locations":[{"ref":"crates/swc_ecma_parser/src/parser/class_and_fn.rs:349-350","code":"  349 |     /// `parse_args` closure should not eat '(' or ')'.\n  350 |     pub(crate) fn parse_fn_args_body<F>(","lines":2,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/class_and_fn.rs#L349-L350"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment claims `parse_no_substitution_template_literal` is given a token whose span excludes only single backticks, but the real correctness concern is undocumented: `span = token_span.hi - BytePos(2)` in `parse_template_head` assumes the `TemplateHead` token is at least 3 bytes (backtick + content + `${`). This invariant is only enforced by `debug_assert!` on the token kind, not on length; a lexer producing a shorter token would underflow the span. Worth an explicit invariant note since these spans feed `read_string`.","fix":"Add a one-line comment documenting the minimum-length invariant relied upon here (TemplateHead >= 3 bytes), or guard with a checked subtraction.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/expr.rs:805-806","code":"  805 |         // exclude the leading `\\`` and the trailing `${`\n  806 |         let span = Span::new_with_checked(token_span.lo + BytePos(1), token_span.hi - BytePos(2));","lines":2,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/expr.rs#L805-L806"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment block enumerating the matched cases lists `( xxx ?` among them, but the `?` (QuestionMark) case is handled by the separate branch immediately above (lines 2349-2359). This `matches!` only covers `Colon | Comma | Eq`, so the `( xxx ?` line is stale/misleading.","fix":"Remove the `// ( xxx ?` line from the comment so it reflects only the Colon/Comma/Eq cases actually matched here.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/typescript.rs:2362-2366","code":" 2362 |             if matches!(cur, Token::Colon | Token::Comma | Token::Eq) {\n 2363 |                 // ( xxx :\n 2364 |                 // ( xxx ,\n 2365 |                 // ( xxx ?\n 2366 |                 // ( xxx =","lines":5,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/typescript.rs#L2362-L2366"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Comment claims the `Close` branch \"May panic if the pattern has invalid, unbalanced parens\", but the very next line uses `depth.saturating_sub(1)` which cannot panic (and on debug builds plain `depth - 1` would also be the panic site, not this). The comment is misleading: it documents a panic that the code explicitly prevents.","fix":"Update the comment to explain that saturating_sub is used precisely to tolerate unbalanced parens (no panic), or remove the stale panic warning.","locations":[{"ref":"crates/swc_ecma_regexp/src/parser/pattern_parser/state.rs:169-171","code":"  169 |                     SimpleUnit::Close => {\n  170 |                         // May panic if the pattern has invalid, unbalanced parens\n  171 |                         depth = depth.saturating_sub(1);","lines":3,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_regexp/src/parser/pattern_parser/state.rs#L169-L171"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comments in `drop_usage`/`drop_assign` state \"We subtract the cycle count from the occurrence count, so the value is not correct representation of the actual usage.\" This describes `subtract_cycles`, not these functions; here the code simply decrements a single usage/assign when an AST node is dropped. The comment is copy-pasted and misleading in this location.","fix":"Replace with a comment explaining the actual behavior: decrement the recorded usage/assign count for a removed reference, saturating at zero, and remove the node from the graph once both reach zero.","locations":[{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:119-122","code":"  119 |             // We use `saturating_sub` to avoid underflow.\n  120 |             // We subtract the cycle count from the occurrence count, so the value is not\n  121 |             // correct representation of the actual usage.\n  122 |             e.usage = e.usage.saturating_sub(1);","lines":4,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L119-L122"},{"ref":"crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs:136-139","code":"  136 |             // We use `saturating_sub` to avoid underflow.\n  137 |             // We subtract the cycle count from the occurrence count, so the value is not\n  138 |             // correct representation of the actual usage.\n  139 |             e.assign = e.assign.saturating_sub(1);","lines":4,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_transforms_optimization/src/simplify/dce/mod.rs#L136-L139"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Stale/duplicated comment block: `// Handle\n//      var a,;` appears in `parse_using_decl` (lines 343-345) copied verbatim from `parse_var_stmt`, but `parse_using_decl` is about `using` declarations, not `var`. The example is misleading for this function.","fix":"Update the comment to reference `using a,;` or remove the copy-pasted example.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/stmt.rs:344-347","code":"  344 |             // Handle\n  345 |             //      var a,;\n  346 |             //\n  347 |             // NewLine is ok","lines":4,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/stmt.rs#L344-L347"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comment on `adjust_if_else_clause` has a typo: `THis function is recursive`. Minor, but it is a public-ish doc comment explaining a stack-overflow-avoidance invariant and should be correct.","fix":"Fix typo: `This function is recursive`.","locations":[{"ref":"crates/swc_ecma_parser/src/parser/stmt.rs:624-627","code":"  624 |     /// Utility function used to parse large if else statements iteratively.\n  625 |     ///\n  626 |     /// THis function is recursive, but it is very cheap so stack overflow will\n  627 |     /// not occur.","lines":4,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_parser/src/parser/stmt.rs#L624-L627"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment on position() states `SWC BytePos values are byte offsets and 1-based`. BytePos values are byte offsets but they are global across the source map and only effectively 1-based for the first file; the code encodes the 1-based assumption via saturating_sub(1). The comment overstates this as an intrinsic property of BytePos rather than an assumption this bridge makes about single-file input.","fix":"Reword the comment to say this converter assumes the source begins at BytePos 1 (single-file input), rather than asserting BytePos is universally 1-based.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast.rs:94-102","code":"   94 |     /// Converts a SWC span to a Babel-compatible position.\n   95 |     ///\n   96 |     /// SWC `BytePos` values are byte offsets and 1-based. Base node offsets\n   97 |     /// stay 1-based so scope keys can use `span.lo` directly, while `loc`\n   98 |     /// follows Babel's 1-based lines and 0-based columns/indices.\n   99 |     ///\n  100 |     /// Assumption: the React Compiler does not receive the original source text\n  101 |     /// from this bridge, so UTF-8 byte offsets are enough for `column` and\n  102 |     /// `index`. If that changes, switch these offsets to UTF-16 code units.","lines":9,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast.rs#L94-L102"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment says the input is in 'Babel format' (line 6), but the converter consumes `react_compiler_ast` nodes (Hermes/Babel-like) and reconstructs SWC AST; calling it simply 'Babel format' is imprecise given the heavy reliance on PreservedAst and the react_compiler_ast types.","fix":"Clarify the comment to state the source is the react_compiler_ast (Babel-like) representation produced by the forward pass, restored against PreservedAst.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs:6","code":"    6 | //! Reverse AST converter: `react_compiler_ast` (Babel format) to SWC AST.","lines":1,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast_reverse.rs#L6"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The static-alias finalization logic (call inline_with_multi_replacer, build_aliases_from_counts, then conditionally build a `var` VarDecl from take_var_decls and insert it at index 0, then drop_invalid_stmts) is duplicated almost verbatim between visit_mut_module_items and visit_mut_script. Divergence between the two copies would silently break one of Module vs Script handling.","fix":"Extract a shared helper (e.g. `fn finalize_top_level(&mut self, body: &mut Vec<Stmt>) -> Option<Stmt>` returning the optional alias var stmt) and call it from both visitors.","locations":[{"ref":"crates/swc_ecma_minifier/src/compress/optimize/mod.rs:2545-2576","code":" 2545 |     fn visit_mut_module_items(&mut self, stmts: &mut Vec<ModuleItem>) {\n 2546 |         let ctx = self.ctx.clone().with(BitCtx::TopLevel, true);\n 2547 |         self.with_ctx(ctx).handle_stmt_likes(stmts, true);\n 2548 | \n 2549 |         if self.vars.inline_with_multi_replacer(stmts) {\n 2550 |             self.changed = true;\n 2551 |         }\n 2552 | \n 2553 |         // Build aliases from counts and insert var declarations\n 2554 |         if self\n 2555 |             .static_alias_state\n 2556 |             .build_aliases_from_counts(self.ctx.expr_ctx.unresolved_ctxt)\n 2557 |         {\n 2558 |             // Aliases were built, we need another pass to replace calls\n 2559 |             self.changed = true;\n 2560 |         }\n 2561 | \n 2562 |         // Insert var declarations for aliases (only after replacements have happened)\n 2563 |         if self.static_alias_state.should_insert_var_decls() {\n 2564 |             let var_decls = self.static_alias_state.take_var_decls();\n 2565 |             let var_stmt = Stmt::Decl(Decl::Var(Box::new(VarDecl {\n 2566 |                 span: DUMMY_SP,\n 2567 |                 kind: VarDeclKind::Var,\n 2568 |                 declare: false,\n 2569 |                 decls: var_decls,\n 2570 |                 ctxt: SyntaxContext::empty(),\n 2571 |             })));\n 2572 |             stmts.insert(0, ModuleItem::Stmt(var_stmt));\n 2573 |         }\n 2574 | \n 2575 |         drop_invalid_stmts(stmts);\n 2576 |     }","lines":32,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_minifier/src/compress/optimize/mod.rs#L2545-L2576"},{"ref":"crates/swc_ecma_minifier/src/compress/optimize/mod.rs:2710-2741","code":" 2710 |     fn visit_mut_script(&mut self, s: &mut Script) {\n 2711 |         let ctx = self.ctx.clone().with(BitCtx::TopLevel, true);\n 2712 |         s.visit_mut_children_with(&mut *self.with_ctx(ctx));\n 2713 | \n 2714 |         if self.vars.inline_with_multi_replacer(s) {\n 2715 |             self.changed = true;\n 2716 |         }\n 2717 | \n 2718 |         // Build aliases from counts and insert var declarations\n 2719 |         if self\n 2720 |             .static_alias_state\n 2721 |             .build_aliases_from_counts(self.ctx.expr_ctx.unresolved_ctxt)\n 2722 |         {\n 2723 |             // Aliases were built, we need another pass to replace calls\n 2724 |             self.changed = true;\n 2725 |         }\n 2726 | \n 2727 |         // Insert var declarations for aliases (only after replacements have happened)\n 2728 |         if self.static_alias_state.should_insert_var_decls() {\n 2729 |             let var_decls = self.static_alias_state.take_var_decls();\n 2730 |             let var_stmt = Stmt::Decl(Decl::Var(Box::new(VarDecl {\n 2731 |                 span: DUMMY_SP,\n 2732 |                 kind: VarDeclKind::Var,\n 2733 |                 declare: false,\n 2734 |                 decls: var_decls,\n 2735 |                 ctxt: SyntaxContext::empty(),\n 2736 |             })));\n 2737 |             s.body.insert(0, var_stmt);\n 2738 |         }\n 2739 | \n 2740 |         drop_invalid_stmts(&mut s.body);\n 2741 |     }","lines" scope();\n 1184 |     }","lines":13,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_scope.rs#L1172-L1184"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"make_base_node sets node_id = Some(span.lo.0), and PreservedAst keys its FxHashMap on span.lo.0 as well. Two nodes that share the same start byte position (common with synthetic/dummy spans, e.g. the spread span built at line 891, or DUMMY_SP nodes with lo=0) will collide: the later save_* overwrites the earlier preserved node, silently losing the first node's TypeScript/metadata on the round trip.","fix":"Use a collision-resistant node id (e.g. a monotonically increasing counter, or a (lo, hi) pair) for both node_id and the PreservedAst key so distinct nodes sharing a start position are not conflated.","locations":[{"ref":"crates/swc_ecma_react_compiler/src/convert_ast.rs:79-92","code":"   79 |     fn make_base_node(&self, span: Span) -> BaseNode {\n   80 |         BaseNode {\n   81 |             node_type: None,\n   82 |             start: Some(span.lo.0),\n   83 |             end: Some(span.hi.0),\n   84 |             loc: Some(self.source_location(span)),\n   85 |             range: None,\n   86 |             extra: None,\n   87 |             node_id: Some(span.lo.0),\n   88 |             leading_comments: None,\n   89 |             inner_comments: None,\n   90 |             trailing_comments: None,\n   91 |         }\n   92 |     }","lines":14,"link":"https://github.com/swc-project/swc/blob/309ba9602f9034bfec2c6d1bb8990971534ac8bc/crates/swc_ecma_react_compiler/src/convert_ast.rs#L79-L92"}]}
