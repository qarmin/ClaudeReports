<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}

.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}

.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}

.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}

.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Config::with_tag()` calls `CString::new(tag).expect(\"Can't convert tag to CString\")`, which panics if the tag contains an interior NUL byte. The method is public, undocumented, and takes `S: Into<Vec<u8>>`, so a tag assembled at runtime (e.g. from a JNI string, an env var, or a build-time constant) can abort the process during logger setup - typically in `native_activity_create`, where a panic is especially hard to diagnose.\n\nThe rest of the crate is careful about NUL bytes to the point of substituting them with spaces in message bodies (`src/platform_log_writer.rs:155-161`); the tag path is the one place that panics instead.","fix":"Either sanitise like the message path does, or expose a fallible variant. Sanitising keeps the infallible signature:\n\n```rust\npub fn with_tag<S: Into<Vec<u8>>>(mut self, tag: S) -> Self {\n    let mut bytes = tag.into();\n    // liblog takes a `const char*`; interior nuls would silently truncate the tag.\n    bytes.iter_mut().for_each(|b| if *b == 0 { *b = b' ' });\n    self.tag = Some(CString::new(bytes).expect(\"nul bytes were replaced above\"));\n    self\n}\n```\n\nAt minimum, add a `# Panics` section to the doc comment - the method currently has no documentation at all.","locations":[{"ref":"src/config.rs:131-134","code":"  131 |     pub fn with_tag<S: Into<Vec<u8>>>(mut self, tag: S) -> Self {\n  132 |         self.tag = Some(CString::new(tag).expect(\"Can't convert tag to CString\"));\n  133 |         self\n  134 |     }","lines":4,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/config.rs#L131-L134"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`AndroidLogger::enabled()` passes `metadata.target()` into `Config::is_loggable()`, which on the `android-api-30` path forwards it to `__android_log_is_loggable_len()` as the *tag*. But the tag actually written to logcat is `config.tag` (from `Config::with_tag()`) when one is configured - see `src/lib.rs:180-189`. So the liblog level lookup is keyed on the `log` crate target (usually the module path), not on the tag the message is filed under.\n\nThe consequence is that the crate's headline `android-api-30` feature - delegating the filtering decision to liblog so that `setprop log.tag.<TAG>` works consistently across C/C++/Rust - silently does not work for any app that sets a custom tag. The bundled example documents exactly this workflow (`adb shell setprop log.tag.log_test W` after `.with_tag(\"log_test\")`), and that property is never consulted; liblog is asked about `log.tag.system_log_level_overrides` instead.","fix":"Resolve the effective tag *before* the loggability check and pass that, not `metadata.target()`. E.g. give `Config` a helper that returns the tag it will actually use and call `is_loggable` with it:\n\n```rust\npub(crate) fn effective_tag<'a>(&'a self, module_path: &'a str) -> &'a str {\n    match &self.tag {\n        Some(tag) => tag.to_str().unwrap_or(module_path),\n        None => module_path,\n    }\n}\n```\n\nThen in `Log::log`, do the filter check with `config.effective_tag(module_path)` instead of relying on `self.enabled(record.metadata())`. Note `Log::enabled` only receives `Metadata`, which has no module path, so `enabled()` can at best approximate; the authoritative check belongs in `log()` where the tag is known.","locations":[{"ref":"src/lib.rs:153-157","code":"  153 | impl Log for AndroidLogger {\n  154 |     fn enabled(&self, metadata: &Metadata) -> bool {\n  155 |         self.config()\n  156 |             .is_loggable(metadata.target(), metadata.level())\n  157 |     }","lines":5,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L153-L157"},{"ref":"src/config.rs:117-124","code":"  117 |     pub(crate) fn is_loggable(&self, tag: &str, level: Level) -> bool {\n  118 |         #[cfg(all(target_os = \"android\", feature = \"android-api-30\"))]\n  119 |         use android_is_loggable as is_loggable;\n  120 |         #[cfg(not(all(target_os = \"android\", feature = \"android-api-30\")))]\n  121 |         use default_is_loggable as is_loggable;\n  122 | \n  123 |         is_loggable(tag, level, self.log_level)\n  124 |     }","lines":8,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/config.rs#L117-L124"},{"ref":"examples/system_log_level_overrides.rs:65-67","code":"   65 | //! # should print warn+ logs in `adb logcat -s log_test`\n   66 | //! adb shell setprop log.tag.log_test W\n   67 | //! adb shell /data/local/tmp/system_log_level_overrides","lines":3,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/examples/system_log_level_overrides.rs#L65-L67"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`LOGGING_MSG_MAX_LEN` is `4000` and the writer chunks the message alone against that limit, ignoring the tag. Android's `logd` enforces `LOGGER_ENTRY_MAX_PAYLOAD` (4068 bytes) over the **whole** payload: priority byte + tag + NUL + message + NUL. With a tag near the crate's own `LOGGING_TAG_MAX_LEN` of 127, a full chunk yields `1 + 127 + 1 + 4000 + 1 = 4130` bytes, which liblog truncates.\n\n`Config::with_tag()` performs no length check at all, so a caller can install an arbitrarily long tag and push the payload well past the limit for even short messages. This directly contradicts `README.md`, which promises \"This library ensures that logged messages do not overflow Android log message limits by efficiently splitting messages into chunks\" - the guarantee only holds for short tags.","fix":"Budget the chunk size against the actual tag length rather than a fixed constant. Keep the 4001-byte buffer, but cap the usable message length per writer instance:\n\n```rust\nconst LOGGER_ENTRY_MAX_PAYLOAD: usize = 4068;\n\n// in PlatformLogWriter::new*, store alongside `len`:\nlet max_msg_len = LOGGER_ENTRY_MAX_PAYLOAD\n    .saturating_sub(1 /* prio */ + tag.to_bytes_with_nul().len() + 1 /* msg nul */)\n    .min(LOGGING_MSG_MAX_LEN);\n```\n\nThen use `self.max_msg_len` in place of `LOGGING_MSG_MAX_LEN` in `write_str`. Additionally, bound or ellipsize tags in `Config::with_tag()` so `LOGGING_TAG_MAX_LEN` is enforced for explicit tags too, not only for module-path-derived ones.","locations":[{"ref":"src/lib.rs:150-151","code":"  150 | const LOGGING_TAG_MAX_LEN: usize = 127;\n  151 | const LOGGING_MSG_MAX_LEN: usize = 4000;","lines":2,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L150-L151"},{"ref":"src/platform_log_writer.rs:24","code":"   24 |     buffer: [MaybeUninit<u8>; LOGGING_MSG_MAX_LEN + 1],","lines":1,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/platform_log_writer.rs#L24"},{"ref":"README.md:65-66","code":"   65 | This library ensures that logged messages do not overflow Android log message limits\n   66 | by efficiently splitting messages into chunks.","lines":2,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/README.md#L65-L66"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`init_once` reads `config.log_level` into a local, then hands `config` to `ANDROID_LOGGER.get_or_init(...)`. If `ANDROID_LOGGER` was already initialised, the closure never runs and the whole `Config` is **silently discarded** - but `log_level` from that discarded config is still applied via `log::set_max_level(level)` whenever `log::set_logger` succeeds.\n\nThis is reachable through the documented API: `pub fn log(record)` at `src/lib.rs:217-221` initialises `ANDROID_LOGGER` with `AndroidLogger::default()` and requires no prior setup (\"This action does not require initialization\"). A caller that emits one record through `android_logger::log()` before `init_once` ends up with a logger permanently pinned to `Config::default()` - no tag, no filter, no buffer id - while the global max level comes from the config that was thrown away. There is no code path that can install a `Config` into an already-created `AndroidLogger`, since `AndroidLogger::config()` fills its `OnceLock` with `Config::default()` on first use.\n\nThe two states then disagree: `log::max_level()` says `Trace`, the logger's own `is_loggable` consults an unrelated default config.","fix":"Only apply `log_level` when this call actually installed the config, and make the discard visible:\n\n```rust\npub fn init_once(config: Config) {\n    let log_level = config.log_level;\n    let mut installed = false;\n    let logger = ANDROID_LOGGER.get_or_init(|| {\n        installed = true;\n        AndroidLogger::new(config)\n    });\n\n    if !installed {\n        log::warn!(\"android_logger: already initialized, new Config ignored\");\n        return;\n    }\n    ...\n}\n```\n\n(`config` must be moved into the closure, so capture it there rather than reading fields afterwards - or use `OnceLock::set` and branch on its `Result`.)","locations":[{"ref":"src/lib.rs:230-239","code":"  230 | pub fn init_once(config: Config) {\n  231 |     let log_level = config.log_level;\n  232 |     let logger = ANDROID_LOGGER.get_or_init(|| AndroidLogger::new(config));\n  233 | \n  234 |     if let Err(err) = log::set_logger(logger) {\n  235 |         log::debug!(\"android_logger: log::set_logger failed: {}\", err);\n  236 |     } else if let Some(level) = log_level {\n  237 |         log::set_max_level(level);\n  238 |     }\n  239 | }","lines":10,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L230-L239"},{"ref":"src/lib.rs:136-138","code":"  136 |     fn config(&self) -> &Config {\n  137 |         self.config.get_or_init(Config::default)\n  138 |     }","lines":3,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L136-L138"},{"ref":"src/lib.rs:217-221","code":"  217 | pub fn log(record: &Record) {\n  218 |     ANDROID_LOGGER\n  219 |         .get_or_init(AndroidLogger::default)\n  220 |         .log(record)\n  221 | }","lines":5,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L217-L221"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`temporal_flush` splits at `self.last_newline_index`, which is the index **of** the `\\n` byte, not the index after it. `output_specified_len(copy_from_index)` places the NUL terminator at that index so the newline is excluded from the emitted chunk, but `copy_bytes_to_start(copy_from_index, remaining_chunk_len)` then retains it as the *first* byte of the next chunk. Every continuation chunk of a split message therefore begins with a stray leading newline in logcat, which renders as a blank first line.\n\nThe behaviour is baked into the test suite: `temporal_flush` in `src/platform_log_writer.rs:211-232` asserts the retained buffer is `\"\\n90\"` after flushing `\"12\\n\\n567\\n90\"`.","fix":"Consume the newline that was used as the split point:\n\n```rust\nif self.last_newline_index > 0 {\n    let copy_from_index = self.last_newline_index + 1;\n    let remaining_chunk_len = total_len - copy_from_index;\n\n    unsafe { self.output_specified_len(self.last_newline_index) };\n    self.copy_bytes_to_start(copy_from_index, remaining_chunk_len);\n    self.len = remaining_chunk_len;\n}\n```\n\nUpdate the `temporal_flush` unit test to expect `\"90\"` (len 2) instead of `\"\\n90\"` (len 3).","locations":[{"ref":"src/platform_log_writer.rs:86-92","code":"   86 |         if self.last_newline_index > 0 {\n   87 |             let copy_from_index = self.last_newline_index;\n   88 |             let remaining_chunk_len = total_len - copy_from_index;\n   89 | \n   90 |             unsafe { self.output_specified_len(copy_from_index) };\n   91 |             self.copy_bytes_to_start(copy_from_index, remaining_chunk_len);\n   92 |             self.len = remaining_chunk_len;","lines":7,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/platform_log_writer.rs#L86-L92"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`last_newline_index` uses `0` as the \"no newline seen\" sentinel, but `0` is also a legitimate newline position: in `write_str` the fold computes `self.last_newline_index = len + newline`, which is `0` when the very first byte of the buffer is `\\n`. `temporal_flush`'s `if self.last_newline_index > 0` then takes the \"no newline\" branch and flushes the whole buffer as one chunk instead of splitting.\n\nImpact is limited to suboptimal chunk boundaries (a message that would have been split on its leading newline is emitted whole, or truncated at `LOGGING_MSG_MAX_LEN` instead of at the newline), never memory unsafety. The same conflation makes `assert_eq!(writer.last_newline_index, 0)` in the tests ambiguous - it cannot distinguish \"reset\" from \"newline at offset 0\".","fix":"Make the absence of a newline explicit instead of overloading `0`:\n\n```rust\nlast_newline_index: Option<usize>,\n```\n\nwith `if let Some(idx) = self.last_newline_index` in `temporal_flush` and `self.last_newline_index = None` on reset. This also removes the need for callers to reason about whether `0` means \"start of buffer\" or \"nothing recorded\".","locations":[{"ref":"src/platform_log_writer.rs:162-168","code":"  162 |                     if *input == b'\\n' { Some(i) } else { acc }\n  163 |                 });\n  164 | \n  165 |             // update last \\n index\n  166 |             if let Some(newline) = last_newline {\n  167 |                 self.last_newline_index = len + newline;\n  168 |             }","lines":7,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/platform_log_writer.rs#L162-L168"},{"ref":"src/platform_log_writer.rs:21-22","code":"   21 |     len: usize,\n   22 |     last_newline_index: usize,","lines":2,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/platform_log_writer.rs#L21-L22"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The result of the formatting step is discarded with `let _ = match (...)`. A user-supplied `custom_format` closure returning `Err`, or a `Display`/`Debug` impl in the record's arguments returning `fmt::Error`, is silently swallowed and `writer.flush()` still emits whatever partial bytes made it into the buffer. The caller gets a truncated log line with no indication that formatting failed.","fix":"Surface the failure instead of dropping it - at minimum append a marker so the truncation is visible in logcat:\n\n```rust\nlet res = match (&config.tag, &config.custom_format) {\n    (_, Some(format)) => format(&mut writer, record),\n    (Some(_), _) => fmt::write(&mut writer, format_args!(\"{}: {}\", module_path, *record.args())),\n    _ => fmt::write(&mut writer, *record.args()),\n};\nif res.is_err() {\n    let _ = writer.write_str(\" <android_logger: formatting error>\");\n}\nwriter.flush();\n```\n\n(`use std::fmt::Write` is already in scope via the `fmt::write` call path; import the trait explicitly.)","locations":[{"ref":"src/lib.rs:197-207","code":"  197 |         let _ = match (&config.tag, &config.custom_format) {\n  198 |             (_, Some(format)) => format(&mut writer, record),\n  199 |             (Some(_), _) => fmt::write(\n  200 |                 &mut writer,\n  201 |                 format_args!(\"{}: {}\", module_path, *record.args()),\n  202 |             ),\n  203 |             _ => fmt::write(&mut writer, *record.args()),\n  204 |         };\n  205 | \n  206 |         // output the remaining message (this would usually be the most common case)\n  207 |         writer.flush();","lines":11,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L197-L207"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"When `log::set_logger` fails, `init_once` reports it with `log::debug!`. That message is routed through the `log` facade, whose `max_level` at that point is whatever the *already installed* logger configured - frequently `Off` (the crate's own default, per `tests/default_init.rs`) or `Info`. So the diagnostic for \"your logger was not installed\" is dropped by the very filtering it is trying to warn about, and the failure is invisible.\n\n`README.md:63` also states that \"this library will only log a warning for subsequent `init_once` calls\", which the code contradicts - it is a `debug` level message.","fix":"Raise the level so it matches the documentation and has a chance of being visible:\n\n```rust\n// before\nlog::debug!(\"android_logger: log::set_logger failed: {}\", err);\n// after\nlog::warn!(\"android_logger: log::set_logger failed: {}\", err);\n```\n\nFor a diagnostic that cannot be swallowed by `log`'s own filter, bypass the facade and call `android_log()` directly with the crate's tag.","locations":[{"ref":"src/lib.rs:234-236","code":"  234 |     if let Err(err) = log::set_logger(logger) {\n  235 |         log::debug!(\"android_logger: log::set_logger failed: {}\", err);\n  236 |     } else if let Some(level) = log_level {","lines":3,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L234-L236"},{"ref":"README.md:60-63","code":"   60 | There is a caveat that this library can only be initialized once\n   61 | (hence the `init_once` function name). However, Android native activity can be\n   62 | re-created every time the screen is rotated, resulting in multiple initialization calls.\n   63 | Therefore this library will only log a warning for subsequent `init_once` calls.","lines":4,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/README.md#L60-L63"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`write_str` copies the incoming string into the buffer one byte at a time through a `zip(...).enumerate().fold(...)` closure that performs two comparisons (`== b'\\0'`, `== b'\\n'`) and a `MaybeUninit::write` per byte. This shape defeats `memcpy` lowering and auto-vectorisation: LLVM cannot turn it into a bulk copy because the loop interleaves the byte-substitution branch and the running newline index into a single scalar dependency chain.\n\nThis is the hot path for every log statement in the crate, executed for the full length of every formatted message. On typical payloads (NUL bytes essentially never occur, newlines are sparse) the scalar loop is roughly an order of magnitude slower than `copy_from_slice` plus a vectorised `memchr` scan.","fix":"Split the three concerns - bulk copy, newline search, NUL substitution - so the common case is a `memcpy` plus two vectorisable scans:\n\n```rust\nlet writable = LOGGING_MSG_MAX_LEN - len;\nlet n = writable.min(incoming_bytes.len());\nlet src = &incoming_bytes[..n];\n\n// SAFETY: MaybeUninit<u8> has the same layout as u8.\nlet dst = unsafe {\n    &mut *(&mut self.buffer[len..len + n] as *mut [MaybeUninit<u8>] as *mut [u8])\n};\ndst.copy_from_slice(src);\n\n// Vectorisable scans; both are no-ops on the overwhelmingly common input.\nif let Some(i) = dst.iter().rposition(|&b| b == b'\\n') {\n    self.last_newline_index = len + i;\n}\ndst.iter_mut().filter(|b| **b == 0).for_each(|b| *b = b' ');\n```\n\nKeep the existing `new_len <= LOGGING_MSG_MAX_LEN` / `temporal_flush` control flow around it unchanged. If `memchr` is acceptable as a dependency, use `memchr::memrchr` for the newline scan instead of `rposition`.","locations":[{"ref":"src/platform_log_writer.rs:145-184","code":"  145 |         while !incoming_bytes.is_empty() {\n  146 |             let len = self.len;\n  147 | \n  148 |             // write everything possible to buffer and mark last \\n\n  149 |             let new_len = len + incoming_bytes.len();\n  150 |             let last_newline = self.buffer[len..LOGGING_MSG_MAX_LEN]\n  151 |                 .iter_mut()\n  152 |                 .zip(incoming_bytes)\n  153 |                 .enumerate()\n  154 |                 .fold(None, |acc, (i, (output, input))| {\n  155 |                     if *input == b'\\0' {\n  156 |                         // Replace nullbytes with whitespace, so we can put the message in a CStr\n  157 |                         // later to pass it through a const char*.\n  158 |                         output.write(b' ');\n  159 |                     } else {\n  160 |                         output.write(*input);\n  161 |                     }\n  162 |                     if *input == b'\\n' { Some(i) } else { acc }\n  163 |                 });\n  164 | \n  165 |             // update last \\n index\n  166 |             if let Some(newline) = last_newline {\n  167 |                 self.last_newline_index = len + newline;\n  168 |             }\n  169 | \n  170 |             // calculate how many bytes were written\n  171 |             let written_len = if new_len <= LOGGING_MSG_MAX_LEN {\n  172 |                 // if the len was not exceeded\n  173 |                 self.len = new_len;\n  174 |                 new_len - len // written len\n  175 |             } else {\n  176 |                 // if new length was exceeded\n  177 |                 self.len = LOGGING_MSG_MAX_LEN;\n  178 |                 self.temporal_flush();\n  179 | \n  180 |                 LOGGING_MSG_MAX_LEN - len // written len\n  181 |             };\n  182 | \n  183 |             incoming_bytes = &incoming_bytes[written_len..];\n  184 |         }","lines":40,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/platform_log_writer.rs#L145-L184"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"hard","description":"`PlatformLogWriter` embeds `buffer: [MaybeUninit<u8>; LOGGING_MSG_MAX_LEN + 1]` - just over 4 KiB - and one is constructed by value inside `Log::log` for **every** log statement, on top of the 128-byte `tag_bytes` array in the same frame. That makes the logging call path use ~4.2 KiB of stack.\n\nThis matters on Android specifically: native threads created with a small explicit `pthread_attr_setstacksize` (and some vendor/JNI threads) can have stacks in the tens of KiB, and a logging call is exactly the kind of thing that runs deep in a call stack during error handling. A 4 KiB frame in a diagnostic path is a plausible stack-overflow contributor precisely when a crash is already being reported.","fix":"Reduce the resident frame size. Options, roughly in increasing invasiveness:\n\n1. Lower `LOGGING_MSG_MAX_LEN` for the stack buffer and chunk more aggressively - most log lines are far under 4000 bytes, so the large buffer only benefits rare long messages.\n2. Hold the buffer in a `thread_local!` reused across calls, so the frame carries only a reference. This also removes the repeated stack reservation:\n\n```rust\nthread_local! {\n    static LOG_BUF: RefCell<Box<[MaybeUninit<u8>; LOGGING_MSG_MAX_LEN + 1]>> =\n        RefCell::new(Box::new(uninit_array()));\n}\n```\n\n   Note this needs care for reentrancy - a `Display` impl that itself logs would re-borrow - so guard with `try_borrow_mut` and fall back to a stack buffer.\n3. Change `PlatformLogWriter` to borrow `&mut [MaybeUninit<u8>]` instead of owning the array, letting the caller decide where the storage lives.","locations":[{"ref":"src/platform_log_writer.rs:12-25","code":"   12 | pub struct PlatformLogWriter<'a> {\n   13 |     #[cfg(target_os = \"android\")]\n   14 |     priority: LogPriority,\n   15 |     #[cfg(not(target_os = \"android\"))]\n   16 |     priority: Level,\n   17 |     #[cfg(target_os = \"android\")]\n   18 |     buf_id: Option<log_ffi::log_id_t>,\n   19 |     #[cfg(not(target_os = \"android\"))]\n   20 |     buf_id: Option<LogId>,\n   21 |     len: usize,\n   22 |     last_newline_index: usize,\n   23 |     tag: &'a CStr,\n   24 |     buffer: [MaybeUninit<u8>; LOGGING_MSG_MAX_LEN + 1],\n   25 | }","lines":14,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/platform_log_writer.rs#L12-L25"},{"ref":"src/lib.rs:174-193","code":"  174 |         let mut tag_bytes: [MaybeUninit<u8>; LOGGING_TAG_MAX_LEN + 1] = uninit_array();\n  175 |         // In case we end up allocating, keep the CString alive.\n  176 |         let _owned_tag;\n  177 | \n  178 |         let module_path = record.module_path().unwrap_or_default();\n  179 | \n  180 |         let tag = if let Some(tag) = &config.tag {\n  181 |             tag\n  182 |         } else if module_path.len() < tag_bytes.len() {\n  183 |             fill_tag_bytes(&mut tag_bytes, module_path.as_bytes())\n  184 |         } else {\n  185 |             // Tag longer than available stack buffer; allocate.\n  186 |             _owned_tag = CString::new(module_path.as_bytes())\n  187 |                 .expect(\"record.module_path() shouldn't contain nullbytes\");\n  188 |             _owned_tag.as_ref()\n  189 |         };\n  190 | \n  191 |         // message must not exceed LOGGING_MSG_MAX_LEN\n  192 |         // therefore split log message into multiple log calls\n  193 |         let mut writer = PlatformLogWriter::new(config.buf_id, record.level(), tag);","lines":20,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L174-L193"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`Log::log` resolves the config twice per record: once into the local `let config = self.config();` and again inside `self.enabled(record.metadata())`, which calls `self.config()` itself. Each call is a `OnceLock::get_or_init`, i.e. an acquire load plus a branch. Negligible in absolute terms, but it is on the per-log-statement path and the already-available local makes it free to remove.","fix":"Use the local that was just bound:\n\n```rust\n// before\nif !self.enabled(record.metadata()) {\n    return;\n}\n// after\nif !config.is_loggable(record.metadata().target(), record.metadata().level()) {\n    return;\n}\n```","locations":[{"ref":"src/lib.rs:159-164","code":"  159 |     fn log(&self, record: &Record) {\n  160 |         let config = self.config();\n  161 | \n  162 |         if !self.enabled(record.metadata()) {\n  163 |             return;\n  164 |         }","lines":6,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L159-L164"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"The ellipsizing branch of `fill_tag_bytes` (`if tag.len() > LOGGING_TAG_MAX_LEN`) is unreachable from production code. Its only caller, `Log::log`, guards the call with `module_path.len() < tag_bytes.len()`, where `tag_bytes.len()` is `LOGGING_TAG_MAX_LEN + 1`. That means `fill_tag_bytes` is only ever entered with `tag.len() <= LOGGING_TAG_MAX_LEN`, so the truncating path can never be taken outside of the unit test `fill_tag_bytes_truncates_long_tag`.\n\nThis is not merely dead code - it defeats the purpose the function was written for. Module paths at or above `LOGGING_TAG_MAX_LEN + 1` bytes fall into the `else` branch and allocate a fresh `CString` **on every single log statement**, which is precisely the per-log allocation the ellipsizing buffer path exists to avoid. The doc comment on `LOGGING_TAG_MAX_LEN` and on `fill_tag_bytes` (\"optionally ellipsizing the input `tag` if it's too large\") describes behaviour that is never reached.","fix":"Drop the length guard in `Log::log` and let `fill_tag_bytes` do the truncation it was written for, removing the allocation path entirely:\n\n```rust\nlet tag = if let Some(tag) = &config.tag {\n    tag\n} else {\n    fill_tag_bytes(&mut tag_bytes, module_path.as_bytes())\n};\n```\n\nThe `_owned_tag` binding and the `CString::new(...).expect(...)` become unnecessary. Alternatively, if the allocating path is intentional, delete the unreachable branch from `fill_tag_bytes` and correct its doc comment - but then the crate allocates per log call for long module paths, which contradicts the \"Without allocations\" claim in `src/platform_log_writer.rs:10-11`.","locations":[{"ref":"src/arrays.rs:21-42","code":"   21 | pub fn fill_tag_bytes<'a>(\n   22 |     storage: &'a mut [MaybeUninit<u8>; LOGGING_TAG_MAX_LEN + 1],\n   23 |     tag: &[u8],\n   24 | ) -> &'a CStr {\n   25 |     // FIXME: Simplify when maybe_uninit_fill with MaybeUninit::fill_from() is stabilized\n   26 |     let initialized = if tag.len() > LOGGING_TAG_MAX_LEN {\n   27 |         for (input, output) in tag\n   28 |             .iter()\n   29 |             // Elipsize the last two characters (TODO: use special … character)?\n   30 |             .take(LOGGING_TAG_MAX_LEN - 2)\n   31 |             .chain(b\"..\\0\")\n   32 |             .zip(storage.iter_mut())\n   33 |         {\n   34 |             output.write(*input);\n   35 |         }\n   36 |         storage.as_slice()\n   37 |     } else {\n   38 |         for (input, output) in tag.iter().chain(b\"\\0\").zip(storage.iter_mut()) {\n   39 |             output.write(*input);\n   40 |         }\n   41 |         &storage[..tag.len() + 1]\n   42 |     };","lines":22,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/arrays.rs#L21-L42"},{"ref":"src/lib.rs:180-189","code":"  180 |         let tag = if let Some(tag) = &config.tag {\n  181 |             tag\n  182 |         } else if module_path.len() < tag_bytes.len() {\n  183 |             fill_tag_bytes(&mut tag_bytes, module_path.as_bytes())\n  184 |         } else {\n  185 |             // Tag longer than available stack buffer; allocate.\n  186 |             _owned_tag = CString::new(module_path.as_bytes())\n  187 |                 .expect(\"record.module_path() shouldn't contain nullbytes\");\n  188 |             _owned_tag.as_ref()\n  189 |         };","lines":10,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/lib.rs#L180-L189"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`PlatformLogWriter::new_with_priority` is declared `pub`, but the `platform_log_writer` module is private (`mod platform_log_writer;` in `src/lib.rs:86`) and the type is not re-exported, so the method is unreachable from outside the crate. Inside the crate its only caller is `PlatformLogWriter::new` directly below it. The `pub` visibility, and the `LogPriority`-in-the-signature API shape it implies, are misleading - a reader would reasonably assume this is a supported entry point for callers that already have a native priority.","fix":"Demote to the visibility it actually has: change `pub fn new_with_priority` to `fn new_with_priority` (or `pub(crate)` if a cross-module caller is planned). If it is genuinely intended as public API, `pub use platform_log_writer::PlatformLogWriter;` needs adding to `src/lib.rs` - but note the type's fields and `LOGGING_MSG_MAX_LEN` buffer size are implementation details that would then become part of the crate's stable surface.","locations":[{"ref":"src/platform_log_writer.rs:28-43","code":"   28 |     #[cfg(target_os = \"android\")]\n   29 |     pub fn new_with_priority(\n   30 |         buf_id: Option<LogId>,\n   31 |         priority: log_ffi::LogPriority,\n   32 |         tag: &CStr,\n   33 |     ) -> PlatformLogWriter<'_> {\n   34 |         #[allow(deprecated)] // created an issue #35 for this\n   35 |         PlatformLogWriter {\n   36 |             priority,\n   37 |             buf_id: LogId::to_native(buf_id),\n   38 |             len: 0,\n   39 |             last_newline_index: 0,\n   40 |             tag,\n   41 |             buffer: uninit_array(),\n   42 |         }\n   43 |     }","lines":16,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/platform_log_writer.rs#L28-L43"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"`CHANGELOG.md` opens with \"All user visible changes to this project will be documented in this file\", but its most recent entry is `0.13.1` (2023-03-07) while `Cargo.toml` declares `version = \"0.15.1\"`. Four minor/patch releases' worth of user-visible changes - including the `android-api-30` feature, the `env_filter` migration, `Config::format`, and the `LOGGING_TAG_MAX_LEN` tag handling - are undocumented, so the file actively misinforms anyone using it to assess an upgrade.","fix":"Either backfill entries for `0.14.0` through `0.15.1` from the release history, or, if the project has moved to GitHub Releases as the source of truth, replace the body of `CHANGELOG.md` with a pointer there so the stale \"will be documented in this file\" promise is removed rather than left false.","locations":[{"ref":"CHANGELOG.md:1-10","code":"    1 | `android_logger` changelog\n    2 | ==========================\n    3 | \n    4 | All user visible changes to this project will be documented in this file. This project uses [Semantic Versioning 2.0.0].\n    5 | \n    6 | \n    7 | \n    8 | \n    9 | ## [0.13.1] · 2023-03-07\n   10 | [0.13.1]: /../../tree/v0.13.1","lines":10,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/CHANGELOG.md#L1-L10"},{"ref":"Cargo.toml:2-3","code":"    2 | name = \"android_logger\"\n    3 | version = \"0.15.1\"","lines":2,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/Cargo.toml#L2-L3"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Two problems in one comment in `fill_tag_bytes`: \"Elipsize\" is misspelled (should be \"Ellipsize\"), and the claim that it ellipsizes \"the last two characters\" is wrong. The code takes the first `LOGGING_TAG_MAX_LEN - 2` bytes and appends `\"..\"`, i.e. it discards *everything* past byte 125 - for a 200-byte tag that is 75 characters dropped, not two.","fix":"Replace the comment:\n\n```rust\n// before\n// Elipsize the last two characters (TODO: use special … character)?\n// after\n// Truncate to fit and mark the cut with \"..\" (TODO: use the \"…\" character?)\n```","locations":[{"ref":"src/arrays.rs:28-30","code":"   28 |             .iter()\n   29 |             // Elipsize the last two characters (TODO: use special … character)?\n   30 |             .take(LOGGING_TAG_MAX_LEN - 2)","lines":3,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/arrays.rs#L28-L30"}]},{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"The `log::Level` to `log_ffi::LogPriority` mapping is written out twice, in two different modules, with identical arms: `android_log_priority_from_level` in `src/config.rs` and an inline `match` inside `PlatformLogWriter::new` in `src/platform_log_writer.rs`. Both are behind the same `target_os = \"android\"` cfg family, so neither is a platform variant of the other - they are a genuine duplicate of one mapping table split across the filtering layer and the writing layer.\n\nAny future change (a new `log` level, a different mapping for `Trace`) has to be made in two places, and a mismatch would mean the level used for the *loggability decision* differs from the level the message is actually *filed under* - a silent, hard-to-diagnose inconsistency.","fix":"Keep one conversion and share it. The natural home is next to `LogId::to_native` in `src/id.rs`, or as a `pub(crate)` free function in `platform_log_writer`:\n\n```rust\n#[cfg(target_os = \"android\")]\npub(crate) const fn priority_from_level(level: Level) -> LogPriority {\n    match level {\n        Level::Error => LogPriority::ERROR,\n        Level::Warn => LogPriority::WARN,\n        Level::Info => LogPriority::INFO,\n        Level::Debug => LogPriority::DEBUG,\n        Level::Trace => LogPriority::VERBOSE,\n    }\n}\n```\n\nThen `config.rs` calls `priority_from_level(record_level)` and `PlatformLogWriter::new` calls `PlatformLogWriter::new_with_priority(buf_id, priority_from_level(level), tag)`.","locations":[{"ref":"src/config.rs:34-43","code":"   34 | #[cfg(all(target_os = \"android\", feature = \"android-api-30\"))]\n   35 | fn android_log_priority_from_level(level: Level) -> android_log_sys::LogPriority {\n   36 |     match level {\n   37 |         Level::Warn => android_log_sys::LogPriority::WARN,\n   38 |         Level::Info => android_log_sys::LogPriority::INFO,\n   39 |         Level::Debug => android_log_sys::LogPriority::DEBUG,\n   40 |         Level::Error => android_log_sys::LogPriority::ERROR,\n   41 |         Level::Trace => android_log_sys::LogPriority::VERBOSE,\n   42 |     }\n   43 | }","lines":10,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/config.rs#L34-L43"},{"ref":"src/platform_log_writer.rs:46-58","code":"   46 |     pub fn new(buf_id: Option<LogId>, level: Level, tag: &CStr) -> PlatformLogWriter<'_> {\n   47 |         PlatformLogWriter::new_with_priority(\n   48 |             buf_id,\n   49 |             match level {\n   50 |                 Level::Warn => LogPriority::WARN,\n   51 |                 Level::Info => LogPriority::INFO,\n   52 |                 Level::Debug => LogPriority::DEBUG,\n   53 |                 Level::Error => LogPriority::ERROR,\n   54 |                 Level::Trace => LogPriority::VERBOSE,\n   55 |             },\n   56 |             tag,\n   57 |         )\n   58 |     }","lines":13,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/platform_log_writer.rs#L46-L58"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`copy_bytes_to_start` is a **safe** function whose body performs a completely unchecked `ptr::copy`. It never validates that `index + len` is within `self.buffer`, so calling it with out-of-range arguments is instant out-of-bounds reads and writes - undefined behaviour reachable without writing `unsafe` at the call site. The function is module-private and today's two call sites happen to pass valid values, but the unit tests already call it directly with hand-picked constants, and any future refactor of `temporal_flush` can violate the unstated precondition with no compiler or runtime complaint.","fix":"Add the bounds check (it is a single comparison on a path that already does a `ptr::copy`, so the cost is nil) or make the precondition explicit by marking the function `unsafe` with a `# Safety` section:\n\n```rust\nfn copy_bytes_to_start(&mut self, index: usize, len: usize) {\n    debug_assert!(index + len <= self.buffer.len());\n    self.buffer.copy_within(index..index + len, 0);\n}\n```\n\n`<[MaybeUninit<u8>]>::copy_within` is available because `MaybeUninit<u8>: Copy`, and it is bounds-checked, so the raw-pointer arithmetic and both `unsafe` blocks disappear entirely.","locations":[{"ref":"src/platform_log_writer.rs:133-138","code":"  133 |     /// Copy `len` bytes from `index` position to starting position.\n  134 |     fn copy_bytes_to_start(&mut self, index: usize, len: usize) {\n  135 |         let dst = self.buffer.as_mut_ptr();\n  136 |         let src = unsafe { self.buffer.as_ptr().add(index) };\n  137 |         unsafe { ptr::copy(src, dst, len) };\n  138 |     }","lines":6,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/platform_log_writer.rs#L133-L138"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`slice_assume_init_ref` is a `pub unsafe fn` with no `# Safety` section documenting its precondition (every element of `slice` must be initialised), and `uninit_array` performs `MaybeUninit::uninit().assume_init()` with only a terse inline comment. Both are the crate's core unsafe primitives, used from four call sites that reason about partially-initialised buffers, yet neither states its contract. `clippy::missing_safety_doc` would flag the former.","fix":"Document the contract so callers can be audited against it:\n\n```rust\n/// Reinterprets an initialized `MaybeUninit` slice as its inner type.\n///\n/// # Safety\n/// Every element of `slice` must be fully initialized. Calling this with any\n/// uninitialized element is immediate undefined behavior.\npub unsafe fn slice_assume_init_ref<T>(slice: &[MaybeUninit<T>]) -> &[T] {\n    unsafe { &*(slice as *const [MaybeUninit<T>] as *const [T]) }\n}\n```\n\nBoth helpers are also now expressible on stable Rust 1.82+ - `[const { MaybeUninit::uninit() }; N]` replaces `uninit_array`, and `MaybeUninit::slice_assume_init_ref` may be preferred once stabilized; the `FIXME` comments should be updated to reflect the currently supported spelling.","locations":[{"ref":"src/arrays.rs:5-14","code":"    5 | // FIXME: When `maybe_uninit_uninit_array` is stabilized, use it instead of this helper\n    6 | pub fn uninit_array<const N: usize, T>() -> [MaybeUninit<T>; N] {\n    7 |     // SAFETY: Array contains MaybeUninit, which is fine to be uninit\n    8 |     unsafe { MaybeUninit::uninit().assume_init() }\n    9 | }\n   10 | \n   11 | // FIXME: Remove when maybe_uninit_slice is stabilized to provide MaybeUninit::slice_assume_init_ref()\n   12 | pub unsafe fn slice_assume_init_ref<T>(slice: &[MaybeUninit<T>]) -> &[T] {\n   13 |     &*(slice as *const [MaybeUninit<T>] as *const [T])\n   14 | }","lines":10,"link":"https://github.com/rust-mobile/android_logger-rs/blob/71fd4fd2ab3788063886fb56017597f424e511ac/src/arrays.rs#L5-L14"}]}]</script>

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
