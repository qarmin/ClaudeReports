<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"On macOS, `home::home_dir().unwrap()` and `env::set_current_dir(...).unwrap()` will panic if the home directory cannot be determined (e.g., no HOME env var set, user without a home dir) or if the directory cannot be entered (e.g., permission denied). This kills Alacritty at startup with no user-visible error message.","fix":"Handle the None case from home_dir() gracefully (log a warning and skip the chdir) and propagate the error from set_current_dir() instead of unwrapping.","locations":[{"ref":"alacritty/src/main.rs:179","code":"  179 |     env::set_current_dir(home::home_dir().unwrap()).unwrap();","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/main.rs#L179"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"String::truncate() is called with a byte offset derived from a character-count (num_cols - button_len), but truncate() operates on bytes, not chars. If the message text contains multibyte UTF-8 characters (e.g., é = 2 bytes, emoji = 4 bytes), the truncation point may fall inside a char boundary and cause a panic.","fix":"Replace `line.truncate(num_cols - button_len)` with a char-boundary-aware truncation. Use `line.char_indices().nth(num_cols - button_len).map_or(line.len(), |(i, _)| i)` to get the correct byte offset before calling truncate().","locations":[{"ref":"alacritty/src/message_bar.rs:103-104","code":"  103 |                 line.truncate(num_cols - button_len);\n  104 |                 line.push_str(CLOSE_BUTTON_TEXT);","lines":2,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/message_bar.rs#L103-L104"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"self.pty.reregister().unwrap() in the PTY event loop panics if re-registering the PTY with the poller fails. This can happen due to OS-level errors (e.g. EMFILE, epoll errors), crashing the PTY reader thread instead of gracefully logging the error and breaking the loop.","fix":"Replace .unwrap() with error handling: log the error and break 'event_loop on failure, matching the pattern used for other errors in this function.","locations":[{"ref":"alacritty_terminal/src/event_loop.rs:315","code":"  315 |                     self.pty.reregister(&self.poll, interest, poll_opts).unwrap();","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/event_loop.rs#L315"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"PeekableReceiver::recv() panics with 'event loop channel closed' when the channel sender is dropped. This can happen during normal shutdown sequences if recv() is called after the sending side is gone, crashing the PTY reader thread ungracefully instead of returning None or an error.","fix":"Return None instead of panicking when TryRecvError::Disconnected is received, treating it the same as 'no message available' since the thread loop will naturally exit on the next iteration.","locations":[{"ref":"alacritty_terminal/src/event_loop.rs:480-483","code":"  480 |             match self.rx.try_recv() {\n  481 |                 Err(TryRecvError::Disconnected) => panic!(\"event loop channel closed\"),\n  482 |                 res => res.ok(),\n  483 |             }","lines":4,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/event_loop.rs#L480-L483"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","easy":false,"description":"Row::new() contains unsafe code that unconditionally writes one element (ptr::write(ptr, T::default()) on the last line of the loop body) even when columns == 0. When columns is 0, Vec::with_capacity(0) may allocate no memory, and the pointer write is into unallocated or invalid memory, causing undefined behavior. The guard is only a debug_assert, so this is invisible in release builds.","fix":"Add a release-mode guard: return an empty Row when columns == 0, or restructure the unsafe block to skip the final ptr::write when columns is 0. Alternatively, change the loop to for _ in 0..columns with a single ptr::write inside so it handles the zero case naturally.","locations":[{"ref":"alacritty_terminal/src/grid/row.rs:37-56","code":"   37 |     pub fn new(columns: usize) -> Row<T> {\n   38 |         debug_assert!(columns >= 1);\n   39 | \n   40 |         let mut inner: Vec<T> = Vec::with_capacity(columns);\n   41 | \n   42 |         // This is a slightly optimized version of `std::vec::Vec::resize`.\n   43 |         unsafe {\n   44 |             let mut ptr = inner.as_mut_ptr();\n   45 | \n   46 |             for _ in 1..columns {\n   47 |                 ptr::write(ptr, T::default());\n   48 |                 ptr = ptr.offset(1);\n   49 |             }\n   50 |             ptr::write(ptr, T::default());\n   51 | \n   52 |             inner.set_len(columns);\n   53 |         }\n   54 | \n   55 |         Row { inner, occ: 0 }\n   56 |     }","lines":20,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/grid/row.rs#L37-L56"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"In `conpty.rs`, `CreatePseudoConsole` failure is handled with `assert_eq!(result, S_OK)` which panics the entire process on failure. The function already returns `Result` for every other error path; this particular failure (e.g. out of memory, bad handle) should propagate as an `Err`.","fix":"Replace `assert_eq!(result, S_OK)` with `if result != S_OK { return Err(Error::from_raw_os_error(result)); }` or similar.","locations":[{"ref":"alacritty_terminal/src/tty/windows/conpty.rs:132","code":"  132 |     assert_eq!(result, S_OK);","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/tty/windows/conpty.rs#L132"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"In `conpty.rs`, `ResizePseudoConsole` failure is handled with `assert_eq!(result, S_OK)` in `OnResize for Conpty`. A resize failure (e.g. the ConPTY was already closed) panics the process. This is called from the rendering thread and could crash Alacritty during normal window resizing.","fix":"Return an error or log and ignore; do not assert. The `on_resize` trait method should propagate errors or at minimum log them instead of panicking.","locations":[{"ref":"alacritty_terminal/src/tty/windows/conpty.rs:306","code":"  306 |         assert_eq!(result, S_OK);","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/tty/windows/conpty.rs#L306"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"Clipboard::default() and Clipboard::new_nop() call .unwrap() on ClipboardContext::new(). On platforms using the X11 clipboard backend, ClipboardContext::new() can fail if the X display is unavailable or permission is denied, causing an unconditional panic rather than a graceful error.","fix":"Return a Result<Clipboard, ...> from the constructor, or fall back to NopClipboardContext with a warning when the clipboard context cannot be created.","locations":[{"ref":"alacritty/src/clipboard.rs:37","code":"   37 |         Self { clipboard: Box::new(NopClipboardContext::new().unwrap()), selection: None }","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/clipboard.rs#L37"},{"ref":"alacritty/src/clipboard.rs:44","code":"   44 |         return Self { clipboard: Box::new(ClipboardContext::new().unwrap()), selection: None };","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/clipboard.rs#L44"},{"ref":"alacritty/src/clipboard.rs:48-49","code":"   48 |             clipboard: Box::new(ClipboardContext::new().unwrap()),\n   49 |             selection: Some(Box::new(X11ClipboardContext::<X11SelectionClipboard>::new().unwrap())),","lines":2,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/clipboard.rs#L48-L49"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","easy":true,"description":"In process_renderer_update(), NonZeroU32::new(self.size_info.width() as u32).unwrap() and the matching height call will panic if a resize event with zero width or height somehow bypasses the guard in the Resized event handler. The Resized guard (size.width == 0 || size.height == 0) returns early, but the size_info is also updated via cell-size changes that don't go through that guard, so the window could theoretically reach process_renderer_update with a zero dimension.","fix":"Use NonZeroU32::new(...).unwrap_or(NonZeroU32::new(1).unwrap()) or validate that the dimensions are non-zero before calling resize.","locations":[{"ref":"alacritty/src/display/mod.rs:752-753","code":"  752 |             let width = NonZeroU32::new(self.size_info.width() as u32).unwrap();\n  753 |             let height = NonZeroU32::new(self.size_info.height() as u32).unwrap();","lines":2,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/mod.rs#L752-L753"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","easy":true,"description":"In is_control_character(), text.bytes().next().unwrap() panics if 'text' is an empty string. The function is called from build_sequence() via the filter closure on associated_text, where the filter already checks '!text.is_empty()', so in practice it is safe. However if the function is ever called from another call site with empty input it will panic unconditionally.","fix":"Replace '.unwrap()' with '.unwrap_or(0)' or guard with an early return: 'let Some(codepoint) = text.bytes().next() else { return false; };'","locations":[{"ref":"alacritty/src/input/keyboard.rs:716","code":"  716 |     let codepoint = text.bytes().next().unwrap();","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/input/keyboard.rs#L716"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In migrate::move_value(), reaching a TOML node that is not table-like triggers an unconditional `panic!(\"Moving from/into unsupported TOML structure\")`. While these code paths are reached only with hard-coded migration rules, a malformed or unusual config file (e.g., a key that happens to shadow a table name) could trigger the panic and crash the migration tool instead of returning a proper error.","fix":"Replace the `panic!` calls with `return Err(\"unsupported TOML structure at ...\".to_string())` so migration failures are propagated as errors and shown to the user.","locations":[{"ref":"alacritty/src/migrate/mod.rs:178-179","code":"  178 |             None => panic!(\"Moving from unsupported TOML structure\"),\n  179 |         };","lines":2,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/migrate/mod.rs#L178-L179"},{"ref":"alacritty/src/migrate/mod.rs:203-204","code":"  203 |             Some(table) => table,\n  204 |             None => panic!(\"Moving into unsupported TOML structure\"),","lines":2,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/migrate/mod.rs#L203-L204"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","easy":true,"description":"writer.write_all().unwrap() in pty_read() panics if writing to the ref-test recording file fails. While ref-test mode is only used during development/testing, a panic here crashes the PTY thread ungracefully and loses all state.","fix":"Replace .unwrap() with error logging and continue, or propagate the error via the function's io::Result return type.","locations":[{"ref":"alacritty_terminal/src/event_loop.rs:150","code":"  150 |                 writer.write_all(&buf[..unprocessed]).unwrap();","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/event_loop.rs#L150"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In `regex_search_internal` in `search.rs`, `regex.dfa.start_state_forward` is called with `.unwrap()` at line 293, outside the error-returning path. If the DFA cache is at capacity (which can happen since cache clearing counts are limited), this will panic rather than returning an error like every other fallible call in the same function.","fix":"Use the `?` operator: `let mut state = regex.dfa.start_state_forward(&mut regex.cache, &input)?;` to be consistent with line 311 which already uses `?`.","locations":[{"ref":"alacritty_terminal/src/term/search.rs:293","code":"  293 |         let mut state = regex.dfa.start_state_forward(&mut regex.cache, &input).unwrap();","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/term/search.rs#L293"}]},{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In `get_pw_entry` (unix.rs), when the passwd fields contain non-UTF-8 bytes (possible on some systems), `.to_str().unwrap()` panics inside an unsafe block. The panic propagates up through `ShellUser::from_env` and kills the process during PTY setup.","fix":"Use `.to_str().map_err(|e| Error::other(e))?` and propagate the error through `get_pw_entry`'s `Result` return type.","locations":[{"ref":"alacritty_terminal/src/tty/unix.rs:96-98","code":"   96 |         name: unsafe { CStr::from_ptr(entry.pw_name).to_str().unwrap() },\n   97 |         dir: unsafe { CStr::from_ptr(entry.pw_dir).to_str().unwrap() },\n   98 |         shell: unsafe { CStr::from_ptr(entry.pw_shell).to_str().unwrap() },","lines":3,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/tty/unix.rs#L96-L98"}]},{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"The while loop in last() that follows WRAPLINE flags has no upper bound on line. If every line from the starting point all the way to bottommost_line carries the WRAPLINE flag (possible when a very long line wraps across the entire visible area and scrollback), the loop increments point.line past bottommost_line. The next call to is_wrap() then indexes term.grid() at bottommost_line+1. In Storage::compute_index this produces a usize underflow (the intermediate 'positive' value wraps to usize::MAX) which in turn causes an out-of-bounds index into self.inner, panicking in both debug and release builds.","fix":"Add a bound check to the while condition: `while is_wrap(term, point) && point.line < term.bottommost_line() { point.line += 1; }`. After the loop, call last_occupied_in_line clamped to bottommost_line.","locations":[{"ref":"alacritty_terminal/src/vi_mode.rs:217-219","code":"  217 |         while is_wrap(term, point) {\n  218 |             point.line += 1;\n  219 |         }","lines":3,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/vi_mode.rs#L217-L219"}]},{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"The fallback loop in first_occupied() increments `line` without an upper bound check. The loop exits only when first_occupied_in_line returns Some or is_wrap returns false. If the grid contains a run of clear (all-space) wrapped lines that reaches bottommost_line and that last line has WRAPLINE set, is_wrap() is called with line = bottommost_line+1. Storage::compute_index then underflows (same mechanism as the finding in last()), panicking in both debug and release builds. A sufficiently wide terminal filling the last visible line with spaces followed by autowrap can construct this state.","fix":"Add a guard before incrementing: break out of the loop (returning the last_cell Point) when `line >= term.bottommost_line()`, so the loop never tries to inspect a line beyond the grid boundary.","locations":[{"ref":"alacritty_terminal/src/vi_mode.rs:253-267","code":"  253 |         let mut line = point.line;\n  254 |         occupied.unwrap_or_else(|| {\n  255 |             loop {\n  256 |                 if let Some(occupied) = first_occupied_in_line(term, line) {\n  257 |                     break occupied;\n  258 |                 }\n  259 | \n  260 |                 let last_cell = Point::new(line, last_column);\n  261 |                 if !is_wrap(term, last_cell) {\n  262 |                     break last_cell;\n  263 |                 }\n  264 | \n  265 |                 line += 1;\n  266 |             }\n  267 |         })","lines":15,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/vi_mode.rs#L253-L267"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","easy":true,"description":"HintLabels::new() computes split_point as '(alphabet.len() - 1) as f32 * ...' which will underflow (wrap to a very large usize) when alphabet is empty, causing a panic on the subsequent cast. An empty alphabet string passed in via config would crash the process at hint mode activation.","fix":"Guard against empty alphabet: 'if alphabet.is_empty() { return Self { indices: vec![0], split_point: 0, alphabet }; }' or use 'alphabet.len().saturating_sub(1)' for the subtraction.","locations":[{"ref":"alacritty/src/display/hint.rs:277","code":"  277 |         let split_point = ((alphabet.len() - 1) as f32 * split_ratio.min(1.)) as usize;","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/hint.rs#L277"}]},{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In draw_line_indicator(), 'total_lines - 1' will underflow/panic if total_lines is 0. While the terminal grid should always have at least one line, a defensive subtraction is safer given this is called from draw().","fix":"Use 'total_lines.saturating_sub(1)' instead of 'total_lines - 1'.","locations":[{"ref":"alacritty/src/display/mod.rs:1359","code":" 1359 |         let text = format!(\"[{}/{}]\", line, total_lines - 1);","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/mod.rs#L1359"}]},{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In spawn_new_instance(), env::args().next().unwrap() will panic if the process was started with no argv[0] (a non-standard but possible situation on some Unix systems, e.g. when exec'd via certain methods).","fix":"Replace with '.unwrap_or_else(|| std::env::current_exe().map(|p| p.to_string_lossy().into_owned()).unwrap_or_default())' or handle the None case gracefully.","locations":[{"ref":"alacritty/src/event.rs:859","code":"  859 |         let alacritty = env_args.next().unwrap();","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/event.rs#L859"}]},{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In window_context.rs, event_loop.display_handle().unwrap() will panic if the event loop's display handle is unavailable (e.g. on platforms where it is not supported). This occurs during window initialization and would crash the process rather than returning a meaningful error to the caller.","fix":"Propagate the error with the ? operator, changing the return type if necessary, consistent with the Result<Self, Box<dyn Error>> signature of the surrounding function.","locations":[{"ref":"alacritty/src/window_context.rs:80","code":"   80 |         let raw_display_handle = event_loop.display_handle().unwrap().as_raw();","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/window_context.rs#L80"}]},{"id":"SEC_1","type":"security","type_label":"Security","severity":"medium","easy":false,"description":"`setup_env` in `tty/mod.rs` calls `unsafe { env::set_var(...) }` which is unsound in a multi-threaded program. The Rust standard library documents that `env::set_var` is not thread-safe. If called while any other thread is reading environment variables (e.g. during DNS resolution or dynamic library loading), it causes undefined behaviour.","fix":"Call `setup_env` before spawning any threads, or use a platform-specific method to set the variables on the child process environment directly via `builder.env(...)` instead of mutating the global process environment.","locations":[{"ref":"alacritty_terminal/src/tty/mod.rs:105-108","code":"  105 |     unsafe { env::set_var(\"TERM\", terminfo) };\n  106 | \n  107 |     // Advertise 24-bit color support.\n  108 |     unsafe { env::set_var(\"COLORTERM\", \"truecolor\") };","lines":4,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/tty/mod.rs#L105-L108"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In `conpty.rs`, after `CreateProcessW` succeeds, `proc_info.hThread` is never closed. `PROCESS_INFORMATION` contains two handles (`hProcess` and `hThread`) that the caller must close. Only `hProcess` is used (handed to `ChildExitWatcher`); `hThread` is silently leaked for the lifetime of the child process.","fix":"Call `CloseHandle(proc_info.hThread)` after `CreateProcessW` succeeds and before returning. `hProcess` should also be closed after `ChildExitWatcher::new` duplicates or stores it.","locations":[{"ref":"alacritty_terminal/src/tty/windows/conpty.rs:217-243","code":"  217 |     let mut proc_info: PROCESS_INFORMATION = unsafe { mem::zeroed() };\n  218 |     unsafe {\n  219 |         success = CreateProcessW(\n  220 |             ptr::null(),\n  221 |             cmdline.as_ptr() as PWSTR,\n  222 |             ptr::null_mut(),\n  223 |             ptr::null_mut(),\n  224 |             false as i32,\n  225 |             creation_flags,\n  226 |             custom_env_block_pointer,\n  227 |             cwd.as_ref().map_or_else(ptr::null, |s| s.as_ptr()),\n  228 |             &mut startup_info_ex.StartupInfo as *mut STARTUPINFOW,\n  229 |             &mut proc_info as *mut PROCESS_INFORMATION,\n  230 |         ) > 0;\n  231 | \n  232 |         if !success {\n  233 |             return Err(Error::last_os_error());\n  234 |         }\n  235 |     }\n  236 | \n  237 |     let conin = UnblockedWriter::new(conin, PIPE_CAPACITY);\n  238 |     let conout = UnblockedReader::new(conout, PIPE_CAPACITY);\n  239 | \n  240 |     let child_watcher = ChildExitWatcher::new(proc_info.hProcess)?;\n  241 |     let conpty = Conpty { handle: pty_handle as HPCON, api };\n  242 | \n  243 |     Ok(Pty::new(conpty, conout, conin, child_watcher))","lines":27,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/tty/windows/conpty.rs#L217-L243"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":true,"description":"In powerline_drawing(), the height and width are computed as `(metrics.line_height as i32 + offset.y as i32) as usize` without the `.max(1)` guard that box_drawing() applies. If offset.y is sufficiently negative (e.g., -128 as i8) and line_height is small, the intermediate i32 can be negative; casting a negative i32 to usize wraps to a very large number, causing Canvas::new() to allocate a gigabyte-scale buffer, resulting in OOM or a panic.","fix":"Apply the same `.max(1)` guard as box_drawing() uses: `let height = (metrics.line_height as i32 + offset.y as i32).max(1) as usize;` and similarly for width.","locations":[{"ref":"alacritty/src/renderer/text/builtin_font.rs:604-605","code":"  604 |     let height = (metrics.line_height as i32 + offset.y as i32) as usize;\n  605 |     let width = (metrics.average_advance as i32 + offset.x as i32) as usize;","lines":2,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/renderer/text/builtin_font.rs#L604-L605"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":true,"description":"Mouse button deserialization accepts value 65536 but casts it directly to u16, silently truncating to 0 (since u16::MAX is 65535). The accepting range is 0..=65536 but the cast `value as u16` wraps 65536 to 0, mapping it to the same button as the value 0.","fix":"Change the range to 0..=65535 (u16::MAX). The error message docstring at line 857 also says \"to 65536\" and should be updated to \"to 65535\".","locations":[{"ref":"alacritty/src/config/bindings.rs:865-868","code":"  865 |                 match value {\n  866 |                     0..=65536 => Ok(MouseEvent::Button(MouseButton::Other(value as u16))),\n  867 |                     _ => Err(E::invalid_value(Unexpected::Signed(value), &self)),\n  868 |                 }","lines":4,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/config/bindings.rs#L865-L868"},{"ref":"alacritty/src/config/bindings.rs:875-878","code":"  875 |                 match value {\n  876 |                     0..=65536 => Ok(MouseEvent::Button(MouseButton::Other(value as u16))),\n  877 |                     _ => Err(E::invalid_value(Unexpected::Unsigned(value), &self)),\n  878 |                 }","lines":4,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/config/bindings.rs#L875-L878"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"In yaml::migrate_imports(), the call to `migrate_config(options, &import, recursion_limit - 1)` on line 71 does not check whether `recursion_limit` is already 0 before subtracting. If a deeply-nested YAML import chain reaches depth=1 and still encounters a YAML file, the recursive call passes `recursion_limit=0` to migrate_config, which then enters yaml::migrate_imports again with limit=0, subtracts 1 to get `usize::MAX`, and can recurse effectively without bound. The equivalent TOML code path in mod.rs::migrate_imports does have the limit==0 guard (line 147), but yaml.rs does not.","fix":"Add a recursion-limit check at the start of yaml::migrate_imports, mirroring the check in mod.rs::migrate_imports: `if recursion_limit == 0 { return Err(\"Exceeded maximum configuration import depth\".into()); }`","locations":[{"ref":"alacritty/src/migrate/yaml.rs:71","code":"   71 |         let migration = migrate_config(options, &import, recursion_limit - 1)?;","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/migrate/yaml.rs#L71"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"In glsl3.rs, bg_a is computed as (cell.bg_alpha * 255.0) as u8. If bg_alpha is slightly above 1.0 due to floating-point rounding (e.g. 1.0000001), the multiplication yields ~255.000025 which truncates to 255, which is fine. However, if bg_alpha is negative (which window_opacity() could theoretically return from a misconfigured value), the result is a large u8 value due to wrapping on cast, producing incorrect rendering. The same pattern exists in gles2.rs.","fix":"Clamp bg_alpha before conversion: (cell.bg_alpha.clamp(0.0, 1.0) * 255.0) as u8.","locations":[{"ref":"alacritty/src/renderer/text/glsl3.rs:373","code":"  373 |             bg_a: (cell.bg_alpha * 255.0) as u8,","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/renderer/text/glsl3.rs#L373"},{"ref":"alacritty/src/renderer/text/gles2.rs:312","code":"  312 |             bg_a: (cell.bg_alpha * 255.0) as u8,","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/renderer/text/gles2.rs#L312"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In Cursor::blink_timeout(), the expression self.blink_interval * 2 can overflow for very large u64 values of blink_interval. The config stores blink_interval as a raw u64 with no upper bound, so if a user configures a value larger than u64::MAX / 2 this will panic in debug builds and wrap silently in release builds.","fix":"Use saturating_mul: self.blink_interval.saturating_mul(2).saturating_mul(MIN_BLINK_CYCLES_BEFORE_PAUSE), or clamp blink_interval to a sensible maximum (e.g. u32::MAX as u64) during deserialization.","locations":[{"ref":"alacritty/src/config/cursor.rs:69","code":"   69 |                 Duration::from_millis(self.blink_interval * 2 * MIN_BLINK_CYCLES_BEFORE_PAUSE),","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/config/cursor.rs#L69"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In FrameTimer::compute_timeout(), 'elapsed_micros % refresh_micros' will panic with integer division by zero if refresh_interval is Duration::ZERO (e.g., at startup or when the monitor reports a zero refresh rate). refresh_interval starts as Duration::ZERO in FrameTimer::new() and the first call to compute_timeout returns early on the mismatch branch, so subsequent calls would be safe only if the refresh rate is never zero after initial setup. If a monitor reports 0 millihertz, refresh_micros becomes 0.","fix":"Add a guard: 'if refresh_micros == 0 { return Duration::ZERO; }' before the modulo operation.","locations":[{"ref":"alacritty/src/display/mod.rs:1592-1594","code":" 1592 |             let refresh_micros = self.refresh_interval.as_micros() as u64;\n 1593 |             self.last_synced_timestamp =\n 1594 |                 now - Duration::from_micros(elapsed_micros % refresh_micros);","lines":3,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/mod.rs#L1592-L1594"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In `skip_pairs` counter inside `bracket_search`, the type is inferred as `i32` (the literal `0` is signed). When iterating left with `forward=false`, an unmatched close-bracket causes `skip_pairs -= 1`, going negative. Subsequent `skip_pairs == 0` checks after that become reachable from the negative side if more close-brackets appear before open-brackets, potentially returning a false match. The counter should be unsigned (or the decrement guarded).","fix":"Guard the decrement: `} else if cell.c == end_char && skip_pairs > 0 { skip_pairs -= 1; }`. This prevents the counter going negative from unbalanced brackets before the match.","locations":[{"ref":"alacritty_terminal/src/term/search.rs:490-509","code":"  490 |         let mut skip_pairs = 0;\n  491 | \n  492 |         loop {\n  493 |             // Check the next cell\n  494 |             let cell = if forward { iter.next() } else { iter.prev() };\n  495 | \n  496 |             // Break if there are no more cells\n  497 |             let cell = match cell {\n  498 |                 Some(cell) => cell,\n  499 |                 None => break,\n  500 |             };\n  501 | \n  502 |             // Check if the bracket matches\n  503 |             if cell.c == end_char && skip_pairs == 0 {\n  504 |                 return Some(cell.point);\n  505 |             } else if cell.c == start_char {\n  506 |                 skip_pairs += 1;\n  507 |             } else if cell.c == end_char {\n  508 |                 skip_pairs -= 1;\n  509 |             }","lines":20,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/term/search.rs#L490-L509"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"needs_restart() has inverted condition. The method is supposed to return true when the set of monitored config files has changed (so the monitor needs restarting), but it returns true when the hashes MATCH (unchanged), and false when they DIFFER (changed). This means: when imports change, the old monitor keeps watching the old set of files, and new imports are silently never watched. Only when imports stay the same is the monitor pointlessly restarted.","fix":"Change the predicate to compare inequality: Self::hash_paths(files).map_or(true, |hash| Some(hash) != self.watched_hash)","locations":[{"ref":"alacritty/src/config/monitor.rs:174-176","code":"  174 |     pub fn needs_restart(&self, files: &[PathBuf]) -> bool {\n  175 |         Self::hash_paths(files).is_none_or(|hash| Some(hash) == self.watched_hash)\n  176 |     }","lines":3,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/config/monitor.rs#L174-L176"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"In `push_keyboard_mode`, when the keyboard mode stack overflows its maximum depth, the code incorrectly removes an element from `self.title_stack` instead of from `self.keyboard_mode_stack`. The trace message even says 'keyboard mode stack' but operates on the title stack, leaving the keyboard mode stack unbounded.","fix":"Change `self.title_stack.remove(0)` to `self.keyboard_mode_stack.remove(0)`. The trace message variable `removed` should also be changed to match the keyboard mode type.","locations":[{"ref":"alacritty_terminal/src/term/mod.rs:1295-1300","code":" 1295 |         if self.keyboard_mode_stack.len() >= KEYBOARD_MODE_STACK_MAX_DEPTH {\n 1296 |             let removed = self.title_stack.remove(0);\n 1297 |             trace!(\n 1298 |                 \"Removing '{removed:?}' from bottom of keyboard mode stack that exceeds its \\\n 1299 |                  maximum depth\"\n 1300 |             );","lines":6,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/term/mod.rs#L1295-L1300"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"FrameDamage::intersects() has an incomplete check for multi-column damage on the start or end line of a span. It only checks whether the exact start column is within the start line's damage range and the exact end column is within the end line's damage range. It misses the case where damage falls inside the span but at neither the start nor end column. For example, a hint spanning columns 5-14 on a single line with damage at column 10 will not be detected as intersecting, since column 5 and column 14 are not in the damage range [10, 10]. As a result, already-invalidated hints may not be refreshed.","fix":"For the start line, check if the damage range [start_line.left, start_line.right] intersects the column range [start.column, end.column] (i.e., start_line.left <= end.column && start_line.right >= start.column when on the same line). Similarly for the end line.","locations":[{"ref":"alacritty/src/display/damage.rs:195-202","code":"  195 |     pub fn intersects(&self, start: Point<usize>, end: Point<usize>) -> bool {\n  196 |         let start_line = &self.lines[start.line];\n  197 |         let end_line = &self.lines[end.line];\n  198 |         self.full\n  199 |             || (start_line.left..=start_line.right).contains(&start.column)\n  200 |             || (end_line.left..=end_line.right).contains(&end.column)\n  201 |             || (start.line + 1..end.line).any(|line| self.lines[line].is_damaged())\n  202 |     }","lines":8,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/damage.rs#L195-L202"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In keyboard_input() in HintState, when the user presses backspace (\\x08 or \\x1f), the last key is popped, but then update_matches() is called and the code immediately tries to find a label matching the backspace character 'c' itself. The find() call searches for label[0] == c (backspace char), which will never match, so it always returns None - that part is fine. However the backspace character '\\x1f' (unit separator) is used as the delete-word shortcut: '\\x1f' is actually the ASCII control for DEL-word in some terminals but here it's treated the same as backspace (only pops a single character), which may not match user expectations for '\\x1f'.","fix":"This is a minor concern. Verify that '\\x1f' is the correct character for the intended action (it is Ctrl+_ / unit-separator), and document why it's equivalent to backspace here.","locations":[{"ref":"alacritty/src/display/hint.rs:135-136","code":"  135 |             '\\x08' | '\\x1f' => {\n  136 |                 self.keys.pop();","lines":2,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/hint.rs#L135-L136"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In Ime::set_enabled(), the 'if is_enabled { self.enabled = is_enabled }' branch only runs the assignment when is_enabled is true. When is_enabled is false the else branch resets the whole struct via *self = Default::default(). However the 'if' branch is redundant noise: the assignment 'self.enabled = is_enabled' could simply be unconditional (it would be a no-op on true). More importantly, if called with true when already enabled, the preedit state is preserved, which is the correct behavior. The code is correct but confusingly structured - a reader could mistake the 'if' as having meaning beyond the comment-described intent.","fix":"Simplify: 'if !is_enabled { *self = Default::default(); } else { self.enabled = true; }' or just 'self.enabled = is_enabled;' followed by clearing state when false.","locations":[{"ref":"alacritty/src/display/mod.rs:1486-1492","code":" 1486 |     pub fn set_enabled(&mut self, is_enabled: bool) {\n 1487 |         if is_enabled {\n 1488 |             self.enabled = is_enabled\n 1489 |         } else {\n 1490 |             // Clear state when disabling IME.\n 1491 |             *self = Default::default();\n 1492 |         }","lines":7,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/mod.rs#L1486-L1492"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In update_ime_position() in window.rs, 'size.cell_height as f64' accesses the private field directly (bypassing the accessor method), which means it reads the raw field rather than calling cell_height(). For SizeInfo<f32> both return the same value, but this is accessing the struct field by name rather than through the public API, and would silently break if the field type ever changes. More concretely, 'size.cell_height' reads the private 'cell_height: T' field directly - this only compiles because update_ime_position is in the same crate, but it is inconsistent with 'size.cell_width() as f64 * 2.' on the line above which uses the accessor.","fix":"Change 'size.cell_height as f64' to 'size.cell_height() as f64' for consistency with the line above.","locations":[{"ref":"alacritty/src/display/window.rs:462","code":"  462 |         let height = size.cell_height as f64;","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/window.rs#L462"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"The ALLOWED_TARGETS constant in logging.rs contains a literal duplicate entry: `LOG_TARGET_CONFIG` expands to `\"alacritty_config_derive\"`, which also appears as a raw string literal at the very next position in the slice. One of these entries is dead code and clutters the filter list.","fix":"Remove the redundant literal `\"alacritty_config_derive\"` from ALLOWED_TARGETS, keeping only the `LOG_TARGET_CONFIG` constant reference.","locations":[{"ref":"alacritty/src/logging.rs:50-58","code":"   50 | const ALLOWED_TARGETS: &[&str] = &[\n   51 |     LOG_TARGET_IPC_CONFIG,\n   52 |     LOG_TARGET_CONFIG,\n   53 |     LOG_TARGET_WINIT,\n   54 |     \"alacritty_config_derive\",\n   55 |     \"alacritty_terminal\",\n   56 |     \"alacritty\",\n   57 |     \"crossfont\",\n   58 | ];","lines":9,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/logging.rs#L50-L58"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"is_allowed_target() has a special case: when the max log level is Trace, ALL Error and Warn messages are allowed regardless of their origin crate. At any other log level these same messages would be filtered. This means enabling trace logging suddenly exposes error/warning messages from arbitrary third-party crates, which is inconsistent and unexpected.","fix":"Remove the special-case Trace match arm; just let the standard ALLOWED_TARGETS check apply at all log levels. If the intent is to see all errors at Trace, document it and make it explicit.","locations":[{"ref":"alacritty/src/logging.rs:185-190","code":"  185 | fn is_allowed_target(level: Level, target: &str) -> bool {\n  186 |     match (level, log::max_level()) {\n  187 |         (Level::Error, LevelFilter::Trace) | (Level::Warn, LevelFilter::Trace) => true,\n  188 |         _ => ALLOWED_TARGETS.contains(&target) || extra_log_targets().iter().any(|t| t == target),\n  189 |     }\n  190 | }","lines":6,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/logging.rs#L185-L190"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"Atlas::room_in_row() uses a strict less-than (`raw.height < (self.height - self.row_baseline)`) to check vertical space. A glyph whose height is exactly equal to the remaining vertical space fits perfectly but is incorrectly rejected. This wastes atlas space by prematurely triggering a row advance or reporting the atlas as Full when it is not.","fix":"Change the condition to `raw.height <= (self.height - self.row_baseline)` to allow glyphs that exactly fill the remaining height.","locations":[{"ref":"alacritty/src/renderer/text/atlas.rs:228","code":"  228 |         let enough_height = raw.height < (self.height - self.row_baseline);","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/renderer/text/atlas.rs#L228"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Repeating timers accumulate drift because schedule() always uses Instant::now() + interval as the new deadline rather than timer.deadline + interval. If timer processing is delayed (e.g. by a slow event handler), every firing adds the delay to the next deadline, causing periodic timers like BlinkCursor to progressively drift away from their intended cadence.","fix":"When rescheduling a repeating timer in update(), pass timer.deadline + interval as the deadline instead of calling schedule() with a fresh Instant::now(). This may require adding a separate internal method that accepts an explicit deadline.","locations":[{"ref":"alacritty/src/scheduler.rs:58-73","code":"   58 |     pub fn update(&mut self) -> Option<Instant> {\n   59 |         let now = Instant::now();\n   60 | \n   61 |         while !self.timers.is_empty() && self.timers[0].deadline <= now {\n   62 |             if let Some(timer) = self.timers.pop_front() {\n   63 |                 // Automatically repeat the event.\n   64 |                 if let Some(interval) = timer.interval {\n   65 |                     self.schedule(timer.event.clone(), interval, true, timer.id);\n   66 |                 }\n   67 | \n   68 |                 let _ = self.event_proxy.send_event(timer.event);\n   69 |             }\n   70 |         }\n   71 | \n   72 |         self.timers.front().map(|timer| timer.deadline)\n   73 |     }","lines":16,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/scheduler.rs#L58-L73"},{"ref":"alacritty/src/scheduler.rs:76-89","code":"   76 |     pub fn schedule(&mut self, event: Event, interval: Duration, repeat: bool, timer_id: TimerId) {\n   77 |         let deadline = Instant::now() + interval;\n   78 | \n   79 |         // Get insert position in the schedule.\n   80 |         let index = self\n   81 |             .timers\n   82 |             .iter()\n   83 |             .position(|timer| timer.deadline > deadline)\n   84 |             .unwrap_or(self.timers.len());\n   85 | \n   86 |         // Set the automatic event repeat rate.\n   87 |         let interval = if repeat { Some(interval) } else { None };\n   88 | \n   89 |         self.timers.insert(index, Timer { interval, deadline, event, id: timer_id });","lines":14,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/scheduler.rs#L76-L89"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In selection.rs, Selection::rotate() uses a mutable reference trick to swap start and end pointers: let (mut start, mut end) = (&mut self.region.start, &mut self.region.end). The subsequent mem::swap only swaps the references (the local bindings), not the underlying data in self.region. However, since start and end are then used only through the local bindings (which have been swapped), the logic works correctly for the local processing. BUT after rotation, the swapped mutations are written back through the original un-swapped fields: start writes to self.region.start and end writes to self.region.end even though semantically start should be the smaller one. This means for a reversed selection (start > end), the rotated values are written to the wrong fields.","fix":"After rotating, write back through the swapped references correctly, or restructure to avoid the pointer aliasing pattern. Verify that mutations through 'start' and 'end' after the swap correctly target the intended fields of self.region.","locations":[{"ref":"alacritty_terminal/src/selection.rs:147-149","code":"  147 |         let (mut start, mut end) = (&mut self.region.start, &mut self.region.end);\n  148 |         if start.point > end.point {\n  149 |             mem::swap(&mut start, &mut end);","lines":3,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/selection.rs#L147-L149"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In `damage` (mod.rs), when damage is not full, the code damages `previous_cursor` only when `last_cursor != previous_cursor`. However `last_cursor` was just replaced with the current cursor point at line 465, so the condition `self.damage.last_cursor != previous_cursor` is always equivalent to `current_cursor != previous_cursor`. If current and previous cursor are equal but on a line that was otherwise damaged, the old cursor position is not marked damaged. The comment says 'add information about old cursor position' but the check uses the just-updated `last_cursor`.","fix":"Rename for clarity: compare against the saved old cursor point (`previous_cursor`) to decide whether to damage the old position independently of the new cursor position. The logic is correct as written but is confusingly named and the condition is misleading.","locations":[{"ref":"alacritty_terminal/src/term/mod.rs:465-476","code":"  465 |         let previous_cursor = mem::replace(&mut self.damage.last_cursor, self.grid.cursor.point);\n  466 | \n  467 |         if self.damage.full {\n  468 |             return TermDamage::Full;\n  469 |         }\n  470 | \n  471 |         // Add information about old cursor position and new one if they are not the same, so we\n  472 |         // cover everything that was produced by `Term::input`.\n  473 |         if self.damage.last_cursor != previous_cursor {\n  474 |             // Cursor coordinates are always inside viewport even if you have `display_offset`.\n  475 |             let point = Point::new(previous_cursor.line.0 as usize, previous_cursor.column);\n  476 |             self.damage.damage_point(point);","lines":12,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/term/mod.rs#L465-L476"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In `delete_chars`, `end` is computed as `cmp::min(start + count, columns - 1)` which caps at `columns - 2` when `start + count >= columns`. This means that when the cursor is at or near the last column and count is large, the swap loop covers `columns - end` elements starting from `end = columns - 1`, potentially leaving one cell unshifted. The clearing loop then starts at `columns - count` which may overlap the unshifted region incorrectly.","fix":"The cap should be `columns` rather than `columns - 1`, i.e. `let end = cmp::min(start + count, columns);`, so that when the entire rest of the line is deleted, `num_cells = columns - end = 0` and the swap loop is a no-op, relying entirely on the clear loop.","locations":[{"ref":"alacritty_terminal/src/term/mod.rs:1547-1563","code":" 1547 |         let end = cmp::min(start + count, columns - 1);\n 1548 |         let num_cells = columns - end;\n 1549 | \n 1550 |         let line = cursor.point.line;\n 1551 |         self.damage.damage_line(line.0 as usize, 0, self.columns() - 1);\n 1552 |         let row = &mut self.grid[line][..];\n 1553 | \n 1554 |         for offset in 0..num_cells {\n 1555 |             row.swap(start + offset, end + offset);\n 1556 |         }\n 1557 | \n 1558 |         // Clear last `count` cells in the row. If deleting 1 char, need to delete\n 1559 |         // 1 cell.\n 1560 |         let end = columns - count;\n 1561 |         for cell in &mut row[end..] {\n 1562 |             *cell = bg.into();\n 1563 |         }","lines":17,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/term/mod.rs#L1547-L1563"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"TerminalOptions::override_pty_config() validates that working_directory is_dir() before applying it, logging an error if not. However, the From<TerminalOptions> for PtyOptions conversion (used in a different code path) skips this check and sets working_directory unconditionally. This creates inconsistent behavior depending on which code path creates the PtyOptions.","fix":"Move the is_dir() check into a shared helper or apply it in the From impl as well so both code paths behave consistently.","locations":[{"ref":"alacritty/src/cli.rs:179-193","code":"  179 |     pub fn override_pty_config(&self, pty_config: &mut PtyOptions) {\n  180 |         if let Some(working_directory) = &self.working_directory {\n  181 |             if working_directory.is_dir() {\n  182 |                 pty_config.working_directory = Some(working_directory.to_owned());\n  183 |             } else {\n  184 |                 error!(\"Invalid working directory: {working_directory:?}\");\n  185 |             }\n  186 |         }\n  187 | \n  188 |         if let Some(command) = self.command() {\n  189 |             pty_config.shell = Some(command.into());\n  190 |         }\n  191 | \n  192 |         pty_config.drain_on_exit |= self.hold;\n  193 |     }","lines":15,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/cli.rs#L179-L193"},{"ref":"alacritty/src/cli.rs:196-207","code":"  196 | impl From<TerminalOptions> for PtyOptions {\n  197 |     fn from(mut options: TerminalOptions) -> Self {\n  198 |         PtyOptions {\n  199 |             working_directory: options.working_directory.take(),\n  200 |             shell: options.command().map(Into::into),\n  201 |             drain_on_exit: options.hold,\n  202 |             env: HashMap::new(),\n  203 |             #[cfg(target_os = \"windows\")]\n  204 |             escape_args: false,\n  205 |         }\n  206 |     }\n  207 | }","lines":12,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/cli.rs#L196-L207"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"VisualBell::completed() always returns false when start_time is Some, even after it sets start_time to None because the duration has elapsed. The state is cleared, but the return value is still false. On the next call (next frame), start_time is None and the method correctly returns true. This causes one unnecessary extra redraw frame after the bell animation ends.","fix":"Restructure to return true in the same call that clears start_time: detect that the deadline was reached, set start_time = None, and return true immediately instead of false.","locations":[{"ref":"alacritty/src/display/bell.rs:31-41","code":"   31 |     pub fn completed(&mut self) -> bool {\n   32 |         match self.start_time {\n   33 |             Some(earlier) => {\n   34 |                 if Instant::now().duration_since(earlier) >= self.duration {\n   35 |                     self.start_time = None;\n   36 |                 }\n   37 |                 false\n   38 |             },\n   39 |             None => true,\n   40 |         }\n   41 |     }","lines":11,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/bell.rs#L31-L41"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In format_search(), when label_len == max_width, the code does not enter the early return (the condition is 'label_len > max_width'). It then calls StrShortener with 'max_width.wrapping_sub(label_len + 1)'. When label_len == max_width, this computes 'max_width.wrapping_sub(max_width + 1)' which underflows to usize::MAX, passing an enormous limit to StrShortener. This means the full regex is copied into bar_text, making the search bar overflow the visible columns.","fix":"Change the condition to 'label_len >= max_width' to also handle the equality case, or use 'max_width.saturating_sub(label_len + 1)' instead of wrapping_sub.","locations":[{"ref":"alacritty/src/display/mod.rs:1223-1231","code":" 1223 |         if label_len > max_width {\n 1224 |             return search_label[..max_width].to_owned();\n 1225 |         }\n 1226 | \n 1227 |         // The search string consists of `search_label` + `search_regex` + `cursor`.\n 1228 |         let mut bar_text = String::from(search_label);\n 1229 |         bar_text.extend(StrShortener::new(\n 1230 |             search_regex,\n 1231 |             max_width.wrapping_sub(label_len + 1),","lines":9,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/mod.rs#L1223-L1231"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In validate_hint_highlights(), when a hint's bounds lie entirely outside the viewport (both start and end clamp to defaults/edge), the intersection check 'frame.intersects(start, end)' may produce false positives or false negatives depending on the damage frame state, causing hints to be incorrectly cleared or preserved. The unwrap_or_default() for start produces Point::default() (line 0, col 0) which may appear damaged regardless of whether the hint is actually visible.","fix":"Before the intersects check, verify that the hint bounds are actually within the viewport (both start and end translate via point_to_viewport without returning None). If both endpoints are out of viewport, skip the intersection check.","locations":[{"ref":"alacritty/src/display/mod.rs:1416-1431","code":" 1416 |             let start = term::point_to_viewport(display_offset, start)\n 1417 |                 .filter(|point| point.line < num_lines)\n 1418 |                 .unwrap_or_default();\n 1419 |             let end = term::point_to_viewport(display_offset, end)\n 1420 |                 .filter(|point| point.line < num_lines)\n 1421 |                 .unwrap_or_else(|| Point::new(num_lines - 1, self.size_info.last_column()));\n 1422 | \n 1423 |             // Clear invalidated hints.\n 1424 |             if frame.intersects(start, end) {\n 1425 |                 if reset_mouse {\n 1426 |                     self.window.set_mouse_cursor(CursorIcon::Default);\n 1427 |                 }\n 1428 |                 frame.mark_fully_damaged();\n 1429 |                 *hint = None;\n 1430 |             }\n 1431 |         }","lines":16,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/mod.rs#L1416-L1431"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In the scheduler's unschedule() function, if multiple timers with the same TimerId exist (which cannot happen via the public API but is not structurally prevented), only the first is removed. More importantly, the scheduled() check is a &mut self method despite only needing &self, unnecessarily requiring exclusive access.","fix":"Change scheduled() to take &self instead of &mut self.","locations":[{"ref":"alacritty/src/scheduler.rs:99-101","code":"   99 |     pub fn scheduled(&mut self, id: TimerId) -> bool {\n  100 |         self.timers.iter().any(|timer| timer.id == id)\n  101 |     }","lines":3,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/scheduler.rs#L99-L101"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"decrease_scroll_limit() computes count = min(count, self.history_size()) on line 183, then immediately calls self.raw.shrink_lines(min(count, self.history_size())) on line 185. The second min() is redundant because count is already bounded by history_size() and neither value has changed. While not a correctness bug, it is confusing dead code that suggests the author was unsure whether the first clamping was sufficient.","fix":"Replace line 185 with self.raw.shrink_lines(count) since count is already clamped.","locations":[{"ref":"alacritty_terminal/src/grid/mod.rs:182-188","code":"  182 |     fn decrease_scroll_limit(&mut self, count: usize) {\n  183 |         let count = min(count, self.history_size());\n  184 |         if count != 0 {\n  185 |             self.raw.shrink_lines(min(count, self.history_size()));\n  186 |             self.display_offset = min(self.display_offset, self.history_size());\n  187 |         }\n  188 |     }","lines":7,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/grid/mod.rs#L182-L188"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In `line_search_right` the loop condition is `point.line + 1 < self.screen_lines()`, which casts a signed `Line` to compare with an unsigned `usize`. When searching the scrollback buffer (where `point.line` is negative, i.e. above the viewport), `point.line + 1` wraps to a large positive value as a `usize`, and the loop exits immediately without following wrap-lines into scrollback. This means `next_match_left` always starts from the right end of the visible screen rather than from the correct logical line end in history.","fix":"Use `self.grid[point.line][self.last_column()].flags.contains(Flags::WRAPLINE)` without the line-range guard, or bound with `point.line < self.bottommost_line()` using signed arithmetic. The analogous `line_search_left` correctly uses `self.topmost_line()` (signed).","locations":[{"ref":"alacritty_terminal/src/term/search.rs:606-615","code":"  606 |     pub fn line_search_right(&self, mut point: Point) -> Point {\n  607 |         while point.line + 1 < self.screen_lines()\n  608 |             && self.grid[point.line][self.last_column()].flags.contains(Flags::WRAPLINE)\n  609 |         {\n  610 |             point.line += 1;\n  611 |         }\n  612 | \n  613 |         point.column = self.last_column();\n  614 | \n  615 |         point","lines":10,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/term/search.rs#L606-L615"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","easy":true,"description":"In SizeInfo<u32> From<SizeInfo<f32>> conversion, the 'columns' field is incorrectly set to 'size_info.screen_lines' instead of 'size_info.columns'. This means any code that reads SizeInfo<u32>.columns will silently get the number of screen lines instead, causing wrong damage shapes and potentially incorrect rendering math anywhere SizeInfo<u32> is used.","fix":"Change 'columns: size_info.screen_lines,' to 'columns: size_info.columns,'","locations":[{"ref":"alacritty/src/display/mod.rs:181","code":"  181 |             columns: size_info.screen_lines,","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/mod.rs#L181"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":true,"description":"In the generated code for #[config(flatten)] fields, deserialization is performed with .unwrap_or_default(). Any deserialization error (type mismatch, invalid value) in a flattened config struct is silently discarded and the field is reset to its default, with no warning logged to the user. This makes misconfigured flattened sections invisible.","fix":"Log the error with log::error!(target: LOG_TARGET, ...) before falling back to default, matching the pattern used for normal (non-flattened) field deserialization errors in the same file.","locations":[{"ref":"alacritty_config_derive/src/config_deserialize/de_struct.rs:149","code":"  149 |                     config.#ident = serde::Deserialize::deserialize(flattened).unwrap_or_default();","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_config_derive/src/config_deserialize/de_struct.rs#L149"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"Logger::file_path() acquires the logfile mutex and returns the path only if the lock succeeds (returning None on poisoning). However, the path field of OnDemandLogFile is always initialized in new() and never changed, so it could be stored separately outside the mutex to make it always accessible without the lock. The current design silently swallows the log-file path on mutex poisoning.","fix":"Store the log file path as a separate field in Logger (outside the Mutex<OnDemandLogFile>) so file_path() always returns Some(path) without needing to lock.","locations":[{"ref":"alacritty/src/logging.rs:89-92","code":"   89 |     fn file_path(&self) -> Option<PathBuf> {\n   90 |         let logfile_lock = self.logfile.lock().ok()?;\n   91 |         Some(logfile_lock.path().clone())\n   92 |     }","lines":4,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/logging.rs#L89-L92"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":true,"description":"In compute_font_keys(), the closure load_or_regular silently falls back to the regular font key via .unwrap_or(regular) when loading bold, italic, or bold-italic fonts fails. While this is an intentional fallback, the failure is never logged, so users have no indication that their configured bold/italic fonts could not be loaded.","fix":"Log a warning before returning regular when load_font fails, similar to how load_regular_font logs errors before falling back.","locations":[{"ref":"alacritty/src/renderer/text/glyph_cache.rs:139-145","code":"  139 |         let mut load_or_regular = |desc: FontDesc| {\n  140 |             if desc == regular_desc {\n  141 |                 regular\n  142 |             } else {\n  143 |                 rasterizer.load_font(&desc, size).unwrap_or(regular)\n  144 |             }\n  145 |         };","lines":7,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/renderer/text/glyph_cache.rs#L139-L145"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In `from_fd` (unix.rs), `libc::chdir` failure is silently ignored with a comment 'ignoring invalid paths'. If the configured working directory does not exist the child process silently starts in the parent's cwd without any diagnostic. This can confuse users who set a working directory.","fix":"At minimum log a warning if `chdir` returns -1, so users get actionable feedback.","locations":[{"ref":"alacritty_terminal/src/tty/unix.rs:257-259","code":"  257 |             if let Some(working_directory) = working_directory.as_ref() {\n  258 |                 libc::chdir(working_directory.as_ptr());\n  259 |             }","lines":3,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/tty/unix.rs#L257-L259"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In `set_nonblocking` (unix.rs), `fcntl(fd, F_GETFL, 0)` can return `-1` on error. Its return value is ORed with `O_NONBLOCK` and passed directly to `F_SETFL` without checking for this error. If `F_GETFL` fails, existing flags are lost and the fd may be put into an unexpected state.","fix":"Check the result of the inner `fcntl(fd, F_GETFL, 0)` call before ORing: `let flags = unsafe { fcntl(fd, F_GETFL, 0) }; if flags == -1 { return Err(Error::last_os_error()); }`","locations":[{"ref":"alacritty_terminal/src/tty/unix.rs:439-441","code":"  439 | unsafe fn set_nonblocking(fd: c_int) -> Result<()> {\n  440 |     let res = unsafe { fcntl(fd, F_SETFL, fcntl(fd, F_GETFL, 0) | O_NONBLOCK) };\n  441 |     if res == 0 { Ok(()) } else { Err(Error::last_os_error()) }","lines":3,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/tty/unix.rs#L439-L441"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","easy":false,"description":"Storage::swap() hardcodes a loop count of 4 (assuming Row<T> is exactly 4 usize-words wide) and only protects this assumption with debug_assert. On 32-bit platforms, the actual Row<T> size may differ, causing the unsafe swap loop to read or write out of bounds in release builds, resulting in silent memory corruption.","fix":"Either change debug_assert_eq to a compile-time static assertion (e.g., const _: () = assert!(mem::size_of::<Row<T>>() == ...)) with a type-level bound, or use the standard library's slice::swap which is always safe, accepting the minor instruction-count cost.","locations":[{"ref":"alacritty_terminal/src/grid/storage.rs:153-175","code":"  153 |     pub fn swap(&mut self, a: Line, b: Line) {\n  154 |         debug_assert_eq!(mem::size_of::<Row<T>>(), mem::size_of::<usize>() * 4);\n  155 | \n  156 |         let a = self.compute_index(a);\n  157 |         let b = self.compute_index(b);\n  158 | \n  159 |         unsafe {\n  160 |             // Cast to a qword array to opt out of copy restrictions and avoid\n  161 |             // drop hazards. Byte array is no good here since for whatever\n  162 |             // reason LLVM won't optimized it.\n  163 |             let a_ptr = self.inner.as_mut_ptr().add(a) as *mut MaybeUninit<usize>;\n  164 |             let b_ptr = self.inner.as_mut_ptr().add(b) as *mut MaybeUninit<usize>;\n  165 | \n  166 |             // Copy 1 qword at a time.\n  167 |             //\n  168 |             // The optimizer unrolls this loop and vectorizes it.\n  169 |             let mut tmp: MaybeUninit<usize>;\n  170 |             for i in 0..4 {\n  171 |                 tmp = *a_ptr.offset(i);\n  172 |                 *a_ptr.offset(i) = *b_ptr.offset(i);\n  173 |                 *b_ptr.offset(i) = tmp;\n  174 |             }\n  175 |         }","lines":23,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/grid/storage.rs#L153-L175"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"On OpenBSD, foreground_process_path() passes &mut buf.len() directly to libc::sysctl() as the oldlenp parameter. buf.len() returns a temporary usize value, so the pointer points to a stack temporary. Sysctl is expected to write back the actual number of bytes stored into this location, but the written-back value is immediately lost. The function relies on the buffer being zero-initialized and the path being null-terminated to recover via CStr::from_ptr - which works in practice, but the returned size from sysctl is discarded, making the API usage incorrect.","fix":"Store buf.len() in a local variable before the call: let mut oldlen = buf.len(); then pass &mut oldlen to sysctl.","locations":[{"ref":"alacritty/src/daemon.rs:155-158","code":"  155 |             buf.as_mut_ptr() as *mut _,\n  156 |             &mut buf.len() as *mut _,\n  157 |             ptr::null_mut(),\n  158 |             0,","lines":4,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/daemon.rs#L155-L158"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"GL_FUNS_LOADED in renderer/mod.rs uses Ordering::Relaxed for the atomic swap that guards the once-initialization of OpenGL function pointers. Relaxed ordering does not provide any synchronization guarantee; a second thread observing GL_FUNS_LOADED==true could still see an inconsistent view of the function pointers installed by gl::load_with(). The fix requires at minimum Release on the write and Acquire on the read.","fix":"Use `GL_FUNS_LOADED.swap(true, Ordering::AcqRel)` (or `Ordering::SeqCst`) to ensure the function-pointer writes in gl::load_with() are visible to any thread that observes the flag as true.","locations":[{"ref":"alacritty/src/renderer/mod.rs:125","code":"  125 |         if !GL_FUNS_LOADED.swap(true, Ordering::Relaxed) {","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/renderer/mod.rs#L125"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":true,"description":"In Gles2Renderer::new(), the GL element-array buffer is uploaded with `vertex_indices.capacity() * size_of::<u16>()` bytes instead of `vertex_indices.len() * size_of::<u16>()`. Memory beyond Vec::len() up to Vec::capacity() is uninitialized and must not be read. In this specific case capacity == len because the loop fills the vector to its pre-allocated capacity, so it is harmless, but using capacity() instead of len() is semantically incorrect and fragile.","fix":"Replace `vertex_indices.capacity()` with `vertex_indices.len()` in the BufferData call.","locations":[{"ref":"alacritty/src/renderer/text/gles2.rs:84-88","code":"   84 |             gl::BufferData(\n   85 |                 gl::ELEMENT_ARRAY_BUFFER,\n   86 |                 (vertex_indices.capacity() * size_of::<u16>()) as isize,\n   87 |                 vertex_indices.as_ptr() as *const _,\n   88 |                 gl::STATIC_DRAW,","lines":5,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/renderer/text/gles2.rs#L84-L88"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","easy":false,"description":"process_mouse_bindings() calls `self.ctx.config().mouse_bindings().to_owned()` on every invocation, cloning the entire mouse-bindings Vec. This function is called for every mouse button press, mouse move in mouse-mode, and every scroll event. The repeated allocation is unnecessary and can be avoided.","fix":"Refactor to borrow the bindings slice rather than cloning: obtain a shared reference by splitting the borrow of `self.ctx` so the bindings reference and the mutable context access do not conflict, or restructure the code to collect the bindings once per high-level event rather than per individual report.","locations":[{"ref":"alacritty/src/input/mod.rs:1043","code":" 1043 |         let mouse_bindings = self.ctx.config().mouse_bindings().to_owned();","lines":1,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/input/mod.rs#L1043"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"In draw(), 'grid_cells' is collected into a Vec before the terminal lock is dropped, which is necessary. However RenderableContent::new() and the subsequent for loop collect all visible cells eagerly even when there is no actual damage. The damage check happens inside the renderer, so this is unavoidable with the current architecture, but the comment 'Collect renderable content before the terminal is dropped' obscures the fact that this is always a full O(cells) allocation regardless of damage state.","fix":"Low priority - this is an architectural constraint. Document the reason explicitly or explore passing an iterator view to the renderer while holding the lock.","locations":[{"ref":"alacritty/src/display/mod.rs:784-789","code":"  784 |         let mut content = RenderableContent::new(config, self, &terminal, search_state);\n  785 |         let mut grid_cells = Vec::new();\n  786 |         for cell in &mut content {\n  787 |             grid_cells.push(cell);\n  788 |         }\n  789 |         let selection_range = content.selection_range();","lines":6,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/mod.rs#L784-L789"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"In draw_hyperlink_preview(), the protected_lines Vec is checked with 'protected_lines.contains(&line)' inside a filter closure that is called for every line in the viewport range. contains() is O(n) on a Vec, and the Vec grows up to max_protected_lines (2 * num_uris) elements. For a typical case this is tiny, but the pattern of pushing to the Vec inside the filter closure makes it quadratic in the viewport height. This is a hot rendering path.","fix":"Use a HashSet or a small fixed-size array instead of a Vec for protected_lines, or restructure the logic to avoid the O(n) contains check inside the iterator.","locations":[{"ref":"alacritty/src/display/mod.rs:1278-1288","code":" 1278 |         let uri_lines = (viewport_top.0..=viewport_bottom.0)\n 1279 |             .rev()\n 1280 |             .map(|line| Some(Line(line)))\n 1281 |             .filter_map(|line| {\n 1282 |                 if protected_lines.contains(&line) {\n 1283 |                     None\n 1284 |                 } else {\n 1285 |                     protected_lines.push(line);\n 1286 |                     line\n 1287 |                 }\n 1288 |             })","lines":11,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/display/mod.rs#L1278-L1288"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"load_common_glyphs() calls load_glyphs_for_font() four times (for font_key, bold_key, italic_key, bold_italic_key). When multiple font keys are identical (e.g. when a bold font is not found and falls back to regular), the ASCII glyph range (32..=126) is rasterized and cached multiple times, wasting GPU upload time and potentially bloating the atlas. This is common for systems with limited font availability.","fix":"Deduplicate font keys before iterating, e.g. collect the keys into a BTreeSet or check for equality before calling load_glyphs_for_font.","locations":[{"ref":"alacritty/src/renderer/text/glyph_cache.rs:312-317","code":"  312 |     pub fn load_common_glyphs<L: LoadGlyph>(&mut self, loader: &mut L) {\n  313 |         self.load_glyphs_for_font(self.font_key, loader);\n  314 |         self.load_glyphs_for_font(self.bold_key, loader);\n  315 |         self.load_glyphs_for_font(self.italic_key, loader);\n  316 |         self.load_glyphs_for_font(self.bold_italic_key, loader);\n  317 |     }","lines":6,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty/src/renderer/text/glyph_cache.rs#L312-L317"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"In `push_title` and `push_keyboard_mode`, when the stack exceeds its maximum depth, `Vec::remove(0)` is used to drop the oldest entry. This is O(n) because it shifts all remaining elements. For a stack depth of 4096, this is 4096 element moves on every overflow.","fix":"Use a `VecDeque` instead of a `Vec` for both stacks, which makes front removal O(1).","locations":[{"ref":"alacritty_terminal/src/term/mod.rs:2238-2244","code":" 2238 |         if self.title_stack.len() >= TITLE_STACK_MAX_DEPTH {\n 2239 |             let removed = self.title_stack.remove(0);\n 2240 |             trace!(\n 2241 |                 \"Removing '{removed:?}' from bottom of title stack that exceeds its maximum depth\"\n 2242 |             );\n 2243 |         }\n 2244 | ","lines":7,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/term/mod.rs#L2238-L2244"},{"ref":"alacritty_terminal/src/term/mod.rs:1295-1300","code":" 1295 |         if self.keyboard_mode_stack.len() >= KEYBOARD_MODE_STACK_MAX_DEPTH {\n 1296 |             let removed = self.title_stack.remove(0);\n 1297 |             trace!(\n 1298 |                 \"Removing '{removed:?}' from bottom of keyboard mode stack that exceeds its \\\n 1299 |                  maximum depth\"\n 1300 |             );","lines":6,"link":"https://github.com/alacritty/alacritty/blob/bdb72b32eeb074e3a0b8559d8ccac458237474a3/alacritty_terminal/src/term/mod.rs#L1295-L1300"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","easy":true,"description":"In `unset_mode`, the trace log says 'Setting public mode' when the function is ac
