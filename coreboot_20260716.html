l = _EGAMONO;\n  321 |             break;\n  322 |         case 26:            /* ...alt. VGA BIOS... */\n  323 |         case 7:\n  324 |             retval = _VGACOLOR;\n  325 |             sizeable = TRUE;\n  326 |             break;\n  327 |         case 8:\n  328 |             retval = _VGAMONO;\n  329 |             break;\n  330 |         case 10:\n  331 |         case 13:\n  332 |             retval = _MCGACOLOR;\n  333 |             break;\n  334 |         case 12:\n  335 |             retval = _MCGAMONO;\n  336 |             break;\n  337 |         default:\n  338 |             retval = _CGA;\n  339 |         }","lines":40,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/dos/pdcscrn.c#L300-L339"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In os2/pdcscrn.c, the _screen_mode_equals() function compares the horizontal and vertical\nresolution fields incorrectly. Line 266 compares current.hres against oldmode->vres instead\nof oldmode->hres. This means the horizontal resolution is never truly compared, and the\nfunction may incorrectly return TRUE (modes are equal) when the horizontal resolution differs,\nor FALSE when it matches, leading to unnecessary or missed mode switches during screen restore.","fix":"Change `current.hres == oldmode->vres` to `current.hres == oldmode->hres` on line 266.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcscrn.c:255-268","code":"  255 | static bool _screen_mode_equals(VIOMODEINFO *oldmode)\n  256 | {\n  257 |     VIOMODEINFO current = {0};\n  258 | \n  259 |     VioGetMode(&current, 0);\n  260 | \n  261 |     return ((current.cb == oldmode->cb) &&\n  262 |             (current.fbType == oldmode->fbType) &&\n  263 |             (current.color == oldmode->color) &&\n  264 |             (current.col == oldmode->col) &&\n  265 |             (current.row == oldmode->row) &&\n  266 |             (current.hres == oldmode->vres) &&\n  267 |             (current.vres == oldmode->vres));\n  268 | }","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcscrn.c#L255-L268"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In pdcurses/addch.c waddch(), the default case for control characters (non-printable ASCII\nother than special cases) calls `waddch(win, ch + '@')` to display the caret notation second\ncharacter. However `ch` here is the original chtype which includes both the text byte AND all\nattribute bits (color pair, bold, etc.). Adding '@' (0x40) to the full chtype corrupts the\nattribute field when high attribute bits are set, producing wrong colors or visual artifacts.\nThe 0x7f case correctly uses `attr | '?'`, but the general control-char case does not follow\nthe same pattern.","fix":"Replace `waddch(win, ch + '@')` with `waddch(win, attr | (text + '@'))` to apply only the text increment while preserving the original attributes.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addch.c:188-196","code":"  188 | \n  189 |         default:\n  190 |             /* handle control chars */\n  191 | \n  192 |             if (waddch(win, attr | '^') == ERR)\n  193 |                 return ERR;\n  194 | \n  195 |             return waddch(win, ch + '@');\n  196 |         }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addch.c#L188-L196"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In initscr.c, the ripped-off line initialization loop (lines 178-188) calls newwin() for each ripped-off line and passes the result directly to (*linesripped[i].init)() without checking if newwin() returned NULL. A NULL WINDOW pointer is passed to the user callback, likely causing a crash.","fix":"Check the return value of newwin() in the loop; call exit() or return NULL on allocation failure, consistent with how curscr and pdc_lastscr are handled.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/initscr.c:178-188","code":"  178 |     for (i = 0; i < linesrippedoff; i++)\n  179 |     {\n  180 |         if (linesripped[i].line < 0)\n  181 |             (*linesripped[i].init)(newwin(1, COLS, LINES - 1, 0), COLS);\n  182 |         else\n  183 |             (*linesripped[i].init)(newwin(1, COLS,\n  184 |                                    SP->linesrippedoffontop++, 0), COLS);\n  185 | \n  186 |         SP->linesrippedoff++;\n  187 |         LINES--;\n  188 |     }","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/initscr.c#L178-L188"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"pnoutrefresh() checks (sy2 >= COLS) instead of (sx2 >= COLS). The condition at line 178 reads '(sy2 >= LINES) || (sy2 >= COLS)' - both checks test sy2. The second check should test sx2 against COLS. As written, sx2 is never validated against the screen width, so a caller with sx2 >= COLS will not get ERR. The subsequent memcpy at line 199 writes curscr->_y[sline] + sx1 for num_cols columns, where num_cols = min(sx2-sx1+1, w->_maxx-px). If sx2 is very large, num_cols can exceed COLS - sx1, writing past the end of the curscr row buffer.","fix":"Change the second condition from (sy2 >= COLS) to (sx2 >= COLS): 'if (!w || !(w->_flags & (_PAD|_SUBPAD)) || (sy2 >= LINES) || (sx2 >= COLS))'","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/pad.c:178-200","code":"  178 |     if (!w || !(w->_flags & (_PAD|_SUBPAD)) || (sy2 >= LINES) || (sy2 >= COLS))\n  179 |         return ERR;\n  180 | \n  181 |     if (py < 0)\n  182 |         py = 0;\n  183 |     if (px < 0)\n  184 |         px = 0;\n  185 |     if (sy1 < 0)\n  186 |         sy1 = 0;\n  187 |     if (sx1 < 0)\n  188 |         sx1 = 0;\n  189 | \n  190 |     if (sy2 < sy1 || sx2 < sx1)\n  191 |         return ERR;\n  192 | \n  193 |     num_cols = min((sx2 - sx1 + 1), (w->_maxx - px));\n  194 | \n  195 |     while (sline <= sy2)\n  196 |     {\n  197 |         if (pline < w->_maxy)\n  198 |         {\n  199 |             memcpy(curscr->_y[sline] + sx1, w->_y[pline] + px,\n  200 |                    num_cols * sizeof(chtype));","lines":23,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/pad.c#L178-L200"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`_nc_Copy_Argument()` recurses incorrectly for linked field types. On lines 148-149\nit passes the parent `typ` (the linked composite type) to both recursive calls,\ninstead of passing `typ->left` and `typ->right` respectively, as every other\nfunction in this file does. Compare with `_nc_Make_Argument()` (lines 100-101) and\n`_nc_Free_Argument()` (lines 190-191) which both correctly forward `typ->left` and\n`typ->right`. The consequence is that the recursive calls re-enter the\n`_LINKED_TYPE` branch with a non-linked TypeArgument (the left/right sub-argument),\ncausing incorrect behaviour and potential NULL-pointer dereference or memory\ncorruption when types with arguments are linked via `link_fieldtype()`.","fix":"Replace:\n  p->left  = _nc_Copy_Argument(typ,       argp->left,  err);\n  p->right = _nc_Copy_Argument(typ,       argp->right, err);\nwith:\n  p->left  = _nc_Copy_Argument(typ->left,  argp->left,  err);\n  p->right = _nc_Copy_Argument(typ->right, argp->right, err);","locations":[{"ref":"payloads/libpayload/curses/form/fld_def.c:148-149","code":"  148 | \t      p->left = _nc_Copy_Argument(typ, argp->left, err);\n  149 | \t      p->right = _nc_Copy_Argument(typ, argp->right, err);","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fld_def.c#L148-L149"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"Adjust_Cursor_Position computes the column from a buffer offset using field->cols instead of field->dcols. For a dynamic (scrollable) field dcols > cols, so the division remainder is wrong: curcol = idx - cols * currow gives a value larger than dcols-1 when idx falls in a dynamically grown column range. This corrupts the cursor position after any word-navigation or field-begin/end operation on a grown single-line field.","fix":"Change 'form->curcol = idx - field->cols * form->currow;' to 'form->curcol = idx - field->dcols * form->currow;' to match the dcols-wide row stride used everywhere else.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:466-468","code":"  466 |   form->currow = idx / field->dcols;\n  467 |   form->curcol = idx - field->cols * form->currow;\n  468 | #endif","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L466-L468"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"FE_Delete_Word passes a wrong (always non-positive) length to myADDNSTR. The expression '(int)(s - After_End_Of_Data(s, (int)(ep - s)))' subtracts a pointer that is >= s from s, yielding a value <= 0. When negative it is passed to waddnstr() as the length, which in many curses implementations treats a negative n as 'print all', potentially overflowing the line. The intent appears to be to copy the remainder of the line after the deleted word; the correct pointer arithmetic should be 'After_End_Of_Data(s, (int)(ep - s)) - s'.","fix":"Replace 'myADDNSTR(form->w, s, (int)(s - After_End_Of_Data(s, (int)(ep - s))));' with 'myADDNSTR(form->w, s, (int)(After_End_Of_Data(s, (int)(ep - s)) - s));'.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:2848-2855","code":" 2848 |   s = Get_First_Whitespace_Character(cp, (int)(ep - cp));\n 2849 |   /* to begin of next word    */\n 2850 |   s = Get_Start_Of_Data(s, (int)(ep - s));\n 2851 |   if ((s != cp) && !ISBLANK(*s))\n 2852 |     {\n 2853 |       /* copy remaining line to window */\n 2854 |       myADDNSTR(form->w, s, (int)(s - After_End_Of_Data(s, (int)(ep - s))));\n 2855 |     }","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L2848-L2855"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In Is_Sub_String (case-sensitive branch), 'part++' is placed OUTSIDE the while-loop body,\nexecuting unconditionally once after the loop regardless of how the loop exited.\nIn the IgnoreCaseFlag branch, 'part++' is correctly inside the loop.\nThe result is: in case-sensitive mode, 'part' is always advanced by one extra position\nbefore the final check '(*part) ? FALSE : TRUE'. This makes single-character patterns\nalways appear to match (part ends at '\\0' after one extra increment), and makes\nmulti-character patterns report false negatives for correct matches, breaking\nthe pattern-search navigation in menu_driver.","fix":"Move 'part++' inside the while loop body for the case-sensitive branch, matching\nthe structure of the IgnoreCaseFlag branch:\n  while (*string && *part)\n    {\n      if (*part != *string++)\n        break;\n      part++;\n    }","locations":[{"ref":"payloads/libpayload/curses/menu/m_driver.c:82-89","code":"   82 |   else\n   83 |     {\n   84 |       while (*string && *part)\n   85 | \tif (*part != *string++)\n   86 | \t  break;\n   87 |       part++;\n   88 |     }\n   89 |   return ((*part) ? FALSE : TRUE);","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_driver.c#L82-L89"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In m_post.c _nc_Post_Item(), after entering the spc_rows > 1 block (line 154), isfore is turned off via wattroff and then the code turns on menu->back. Later at line 177 it checks `if (!isback) wattroff(menu->back)`. However, the `isback` flag was NOT set inside the spc_rows block even though menu->back attribute was turned on there, so wattroff for back is correctly called - but isfore was cleared inside the block (line 162-163) without clearing the outer `isfore` variable in sync. The outer attribute-removal block at lines 183-188 may then call `wattroff(fore)` again with isfore still TRUE if the code path through spc_rows did not clear it. Double wattroff calls on a color-pair attribute can corrupt terminal state on some implementations.","fix":"Inside the spc_rows > 1 block, after calling `wattroff(menu->fore)` or `wattroff(menu->grey)`, also set `isfore = FALSE` / `isgrey = FALSE` so the final cleanup at lines 183-188 does not repeat the wattroff.","locations":[{"ref":"payloads/libpayload/curses/menu/m_post.c:154-188","code":"  154 |       if (menu->spc_rows > 1)\n  155 | \t{\n  156 | \t  int j, k, ncy, ncx;\n  157 | \n  158 | \t  assert(cx >= 0 && cy >= 0);\n  159 | \t  getyx(menu->win, ncy, ncx);\n  160 | \t  if (isgrey)\n  161 | \t    wattroff(menu->win, menu->grey);\n  162 | \t  else if (isfore)\n  163 | \t    wattroff(menu->win, menu->fore);\n  164 | \t  wattron(menu->win, menu->back);\n  165 | \t  for (j = 1; j < menu->spc_rows; j++)\n  166 | \t    {\n  167 | \t      if ((item_y + j) < getmaxy(menu->win))\n  168 | \t\t{\n  169 | \t\t  wmove(menu->win, item_y + j, item_x);\n  170 | \t\t  for (k = 0; k < count; k++)\n  171 | \t\t    waddch(menu->win, ' ');\n  172 | \t\t}\n  173 | \t      if ((cy + j) < getmaxy(menu->win))\n  174 | \t\t(void)mvwaddch(menu->win, cy + j, cx - 1, menu->pad);\n  175 | \t    }\n  176 | \t  wmove(menu->win, ncy, ncx);\n  177 | \t  if (!isback)\n  178 | \t    wattroff(menu->win, menu->back);\n  179 | \t}\n  180 |     }\n  181 | \n  182 |   /* Remove attributes */\n  183 |   if (isfore)\n  184 |     wattroff(menu->win, menu->fore);\n  185 |   if (isback)\n  186 |     wattroff(menu->win, menu->back);\n  187 |   if (isgrey)\n  188 |     wattroff(menu->win, menu->grey);","lines":35,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_post.c#L154-L188"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In mouse.c insert_buf(), mouse_buf_idx is incremented without bounds checking against sizeof(mouse_buf) (which is 4). If the PS/2 stream becomes desynchronized and sends many bytes with bit 3 set, or if mouse_decode() is never called to reset mouse_buf_idx, mouse_buf_idx can exceed 3 and the write `mouse_buf[mouse_buf_idx++] = c` on line 171 overflows the 4-byte static array, corrupting adjacent static variables (x_axis, y_axis, etc.).","fix":"Add a bounds check before writing: `if (mouse_buf_idx >= sizeof(mouse_buf)) { mouse_buf_idx = 0; return; }` inside insert_buf(), before the assignment.","locations":[{"ref":"payloads/libpayload/drivers/i8042/mouse.c:164-172","code":"  164 | static void insert_buf(unsigned char c)\n  165 | {\n  166 | \t/* Validate input:\n  167 | \t * First byte shall have bit 3 set ! */\n  168 | \tif (!mouse_buf_idx && !(c & 8))\n  169 | \t\treturn;\n  170 | \n  171 | \tmouse_buf[mouse_buf_idx++] = c;\n  172 | }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/mouse.c#L164-L172"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In cpuinfo_module.c, do_name() fills a 49-byte stack buffer with CPU brand string data (up to 48 bytes written across three CPUID calls, 16 bytes each), but never writes a null terminator. When all three CPUID leaves return non-zero eax values, p advances to name+48, and name[48] is never set to '\\0'. The buffer is then passed to mvwprintw as a '%s' format, causing it to read past the end of the buffer until a null byte is found in adjacent stack memory.","fix":"Add explicit null termination before the mvwprintw call: name[48] = '\\0'; Alternatively, change the array to char name[49] = {0}; to zero-initialize it.","locations":[{"ref":"payloads/coreinfo/cpuinfo_module.c:138-161","code":"  138 | \tchar name[49], *p;\n  139 | \tuint32_t eax, ebx, ecx, edx;\n  140 | \tint t;\n  141 | \n  142 | \tp = name;\n  143 | \n  144 | \tfor (uint32_t i = 0x80000002; i <= 0x80000004; i++) {\n  145 | \t\tdocpuid(i, &eax, &ebx, &ecx, &edx);\n  146 | \n  147 | \t\tif (eax == 0)\n  148 | \t\t\tbreak;\n  149 | \n  150 | \t\tfor (t = 0; t < 4; t++)\n  151 | \t\t\t*p++ = eax >> (8 * t);\n  152 | \t\tfor (t = 0; t < 4; t++)\n  153 | \t\t\t*p++ = ebx >> (8 * t);\n  154 | \t\tfor (t = 0; t < 4; t++)\n  155 | \t\t\t*p++ = ecx >> (8 * t);\n  156 | \t\tfor (t = 0; t < 4; t++)\n  157 | \t\t\t*p++ = edx >> (8 * t);\n  158 | \t}\n  159 | \n  160 | \tmvwprintw(win, row, 1, \"Processor: %s\", name);\n  161 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/cpuinfo_module.c#L138-L161"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In multiboot_module_init(), parse_header(mbaddr) is called unconditionally even when sysinfo_have_multiboot() returns 0 (no multiboot tables found). When tables_good == 0, mbaddr is set to 0 by sysinfo_have_multiboot(), and parse_header(0) casts the address 0 to struct multiboot_header*, reading flags and mmap_addr from the null address. On bare-metal this is a null pointer dereference causing undefined behavior (or a crash on systems with memory protection).","fix":"Guard parse_header with the tables_good check: if (tables_good) parse_header(mbaddr); This mirrors the pattern used in the redraw function.","locations":[{"ref":"payloads/coreinfo/multiboot_module.c:83-91","code":"   83 | static int multiboot_module_init(void)\n   84 | {\n   85 | \tunsigned long mbaddr;\n   86 | \ttables_good = sysinfo_have_multiboot(&mbaddr);\n   87 | \n   88 | \tparse_header(mbaddr);\n   89 | \n   90 | \treturn tables_good ? 0 : -1;\n   91 | }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/multiboot_module.c#L83-L91"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In pci_module_redraw(), show_config_space() is called unconditionally with menu_selected (which is 0 initially) even when devices_index == 0 (no PCI devices found). This causes pci_read_config8() to be called with devices[0].device which is uninitialized, resulting in reading arbitrary I/O port addresses and potentially causing hardware issues or incorrect display.","fix":"Guard the call: if (devices_index > 0) show_config_space(win, 4, 26, menu_selected);","locations":[{"ref":"payloads/coreinfo/pci_module.c:149","code":"  149 | \tshow_config_space(win, 4, 26, menu_selected);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/pci_module.c#L149"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In multiboot.c mb_parse_cmdline(), the function reads a character pointer from phys_to_virt(table->cmdline) with no check that MULTIBOOT_FLAGS_CMDLINE is actually set or that the translated pointer is non-NULL/valid. get_multiboot_info() does gate this call behind a flag check (line 123), but if the flag is set and cmdline is 0 (a null physical address), phys_to_virt(0) may return a usable virtual address pointing to the zero page, causing reads from arbitrary low memory while parsing the command line.","fix":"Validate that table->cmdline is non-zero before calling phys_to_virt and dereferencing c.","locations":[{"ref":"payloads/libpayload/arch/x86/multiboot.c:89-105","code":"   89 | static void mb_parse_cmdline(struct multiboot_header *table)\n   90 | {\n   91 | \textern int main_argc;\n   92 | \textern char *main_argv[];\n   93 | \tchar *c = phys_to_virt(table->cmdline);\n   94 | \n   95 | \twhile(*c != '\\0' && main_argc < MAX_ARGC_COUNT) {\n   96 | \t\tmain_argv[main_argc++] = c;\n   97 | \n   98 | \t\tfor( ; *c != '\\0' && !isspace(*c); c++);\n   99 | \n  100 | \t\tif (*c) {\n  101 | \t\t\t*c = 0;\n  102 | \t\t\tc++;\n  103 | \t\t}\n  104 | \t}\n  105 | }","lines":17,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/multiboot.c#L89-L105"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In os2/pdcclip.c, PDC_clearclipboard() calls WinEmptyClipbrd(hab) without first calling\nWinOpenClipbrd(hab). On OS/2 PM, the clipboard must be opened by the caller before it can be\nemptied; calling WinEmptyClipbrd on an unopened clipboard is an error that is silently ignored\nhere. As a result, PDC_clearclipboard() never actually clears the OS/2 system clipboard. By\ncontrast, PDC_setclipboard() correctly calls WinOpenClipbrd before modifying it.","fix":"Add `if (!WinOpenClipbrd(hab)) { WinTerminate(hab); return PDC_CLIP_ACCESS_ERROR; }` after WinInitialize and before WinEmptyClipbrd, and add WinCloseClipbrd after emptying (it is already present in the current code).","locations":[{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcclip.c:162-185","code":"  162 | int PDC_clearclipboard(void)\n  163 | {\n  164 | #ifndef EMXVIDEO\n  165 |     HAB hab;\n  166 |     PTIB ptib;\n  167 |     PPIB ppib;\n  168 | #endif\n  169 |     PDC_LOG((\"PDC_clearclipboard() - called\\n\"));\n  170 | \n  171 | #ifndef EMXVIDEO\n  172 |     DosGetInfoBlocks(&ptib, &ppib);\n  173 |     ppib->pib_ultype = 3;\n  174 |     hab = WinInitialize(0);\n  175 | \n  176 |     WinEmptyClipbrd(hab);\n  177 | \n  178 |     WinCloseClipbrd(hab);\n  179 |     WinTerminate(hab);\n  180 | \n  181 |     return PDC_CLIP_SUCCESS;\n  182 | #else\n  183 |     return PDC_CLIP_ACCESS_ERROR;\n  184 | #endif\n  185 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcclip.c#L162-L185"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In os2/pdckbd.c PDC_get_key(), the variable keyInfo (of type KBDKEYINFO) is declared only\ninside `#ifndef EMXVIDEO` (line 321), but it is used unconditionally at line 419 outside any\npreprocessor guard:\n    if (keyInfo.fsState & (KBDSTF_LEFTSHIFT|KBDSTF_RIGHTSHIFT))\nWhen compiling with EMXVIDEO defined, `keyInfo` is not in scope at that point, causing a\ncompile error (or if the compiler tolerates it, undefined behavior from an uninitialized\nvariable). Shift-key detection for modifier keys is therefore broken or non-compilable in\nthe EMXVIDEO path.","fix":"Wrap the `if (keyInfo.fsState & ...)` block and the shift-key switch at lines 419-453 in `#ifndef EMXVIDEO ... #endif`, similar to the rest of the OS/2-specific keyboard handling.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/os2/pdckbd.c:319-322","code":"  319 |     int key, scan;\n  320 | #ifndef EMXVIDEO\n  321 |     KBDKEYINFO keyInfo = {0};\n  322 | #endif","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdckbd.c#L319-L322"},{"ref":"payloads/libpayload/curses/PDCurses/os2/pdckbd.c:419-453","code":"  419 |     if (keyInfo.fsState & (KBDSTF_LEFTSHIFT|KBDSTF_RIGHTSHIFT))\n  420 |     {\n  421 |         switch (key)\n  422 |         {\n  423 |         case KEY_HOME:  /* Shift Home */\n  424 |             key = KEY_SHOME;\n  425 |             break;\n  426 |         case KEY_UP:    /* Shift Up */\n  427 |             key = KEY_SUP;\n  428 |             break;\n  429 |         case KEY_PPAGE: /* Shift PgUp */\n  430 |             key = KEY_SPREVIOUS;\n  431 |             break;\n  432 |         case KEY_LEFT:  /* Shift Left */\n  433 |             key = KEY_SLEFT;\n  434 |             break;\n  435 |         case KEY_RIGHT: /* Shift Right */\n  436 |             key = KEY_SRIGHT;\n  437 |             break;\n  438 |         case KEY_END:   /* Shift End */\n  439 |             key = KEY_SEND;\n  440 |             break;\n  441 |         case KEY_DOWN:  /* Shift Down */\n  442 |             key = KEY_SDOWN;\n  443 |             break;\n  444 |         case KEY_NPAGE: /* Shift PgDn */\n  445 |             key = KEY_SNEXT;\n  446 |             break;\n  447 |         case KEY_IC:    /* Shift Ins */\n  448 |             key = KEY_SIC;\n  449 |             break;\n  450 |         case KEY_DC:    /* Shift Del */\n  451 |             key = KEY_SDC;\n  452 |         }\n  453 |     }","lines":35,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdckbd.c#L419-L453"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In wchgat() (attr.c line 304), when n < 0, endpos is computed as 'win->_maxx - 1'. But startpos is win->_curx, which could equal win->_maxx (cursor at rightmost position). In that case, endpos (win->_maxx - 1) < startpos, so the for loop body never executes, but the code then unconditionally updates _firstch and _lastch using startpos and endpos. Since endpos < startpos, _lastch[n] = endpos = win->_maxx-1 may be set to a value smaller than startpos, corrupting the dirty region tracking. Additionally when n >= 0, 'min(startpos + n, win->_maxx) - 1' can yield -1 when startpos=0 and n=0, causing endpos=-1 and the for loop to be skipped, but again the firstch/lastch update runs unconditionally.","fix":"Guard the firstch/lastch update block with 'if (startpos <= endpos)' to avoid updating the dirty region when the range is empty.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/attr.c:291-321","code":"  291 | int wchgat(WINDOW *win, int n, attr_t attr, short color, const void *opts)\n  292 | {\n  293 |     chtype *dest, newattr;\n  294 |     int startpos, endpos;\n  295 | \n  296 |     PDC_LOG((\"wchgat() - called\\n\"));\n  297 | \n  298 |     if (!win)\n  299 |         return ERR;\n  300 | \n  301 |     newattr = (attr & A_ATTRIBUTES) | COLOR_PAIR(color);\n  302 | \n  303 |     startpos = win->_curx;\n  304 |     endpos = ((n < 0) ? win->_maxx : min(startpos + n, win->_maxx)) - 1;\n  305 |     dest = win->_y[win->_cury];\n  306 | \n  307 |     for (n = startpos; n <= endpos; n++)\n  308 |         dest[n] = (dest[n] & A_CHARTEXT) | newattr;\n  309 | \n  310 |     n = win->_cury;\n  311 | \n  312 |     if (startpos < win->_firstch[n] || win->_firstch[n] == _NO_CHANGE)\n  313 |         win->_firstch[n] = startpos;\n  314 | \n  315 |     if (endpos > win->_lastch[n])\n  316 |         win->_lastch[n] = endpos;\n  317 | \n  318 |     PDC_sync(win);\n  319 | \n  320 |     return OK;\n  321 | }","lines":31,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/attr.c#L291-L321"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"wclrtoeol() dereferences win->_cury before checking whether 'win' is NULL (line 56 calls win->_cury and win->_curx inside PDC_LOG before the NULL check on line 58). PDC_LOG is a macro that may expand to a fprintf involving the arguments; on many builds it expands to nothing, so this is benign in practice. However, the pattern is dangerous: the NULL guard appears after the first field access, violating the usual convention.","fix":"Move the 'if (!win) return ERR;' check to before the PDC_LOG call, or ensure PDC_LOG does not dereference win.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/clear.c:50-59","code":"   50 | int wclrtoeol(WINDOW *win)\n   51 | {\n   52 |     int x, y, minx;\n   53 |     chtype blank, *ptr;\n   54 | \n   55 |     PDC_LOG((\"wclrtoeol() - called: Row: %d Col: %d\\n\",\n   56 |              win->_cury, win->_curx));\n   57 | \n   58 |     if (!win)\n   59 |         return ERR;","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/clear.c#L50-L59"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In color.c, start_color() calls 'memset(pair_set, 0, PDC_COLOR_PAIRS)' (line 124). pair_set is an array of bool, not char. On platforms where sizeof(bool) > 1, this only zeroes the first byte of each bool element, potentially leaving garbage in the remaining bytes. The correct call is 'memset(pair_set, 0, sizeof(pair_set))'.","fix":"Change to 'memset(pair_set, 0, sizeof(pair_set));' to correctly zero all bytes of the bool array.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/color.c:124","code":"  124 |     memset(pair_set, 0, PDC_COLOR_PAIRS);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/color.c#L124"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In color.c, init_pair() validates fg and bg against 'first_col' (line 143). When use_default_colors() has been called, first_col is set to -1, which means the lower bound check 'fg < first_col' becomes 'fg < -1'. Since fg is a short, negative values fg == -1 (meaning 'use default') would pass the check, but fg == -2 or lower would be incorrectly accepted. The intent is to allow -1 but not other negatives, yet this is not enforced.","fix":"When first_col == -1, explicitly allow fg >= -1 and bg >= -1 rather than using the generic 'fg < first_col' comparison.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/color.c:142-144","code":"  142 |     if (!pdc_color_started || pair < 1 || pair >= COLOR_PAIRS ||\n  143 |         fg < first_col || fg >= COLORS || bg < first_col || bg >= COLORS)\n  144 |         return ERR;","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/color.c#L142-L144"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In wdeleteln() (deleteln.c), the inner loop at line 69 runs 'for (y = win->_cury; y < win->_bmarg; y++)'. This stops at _bmarg-1 (exclusive), so it does not shift the line at _bmarg upward. Then at line 79, 'if (win->_cury <= win->_bmarg)' assigns the blank temp line to win->_y[win->_bmarg]. This is correct only when the scrolling region is exactly the window: _bmarg = _maxy-1. But when _bmarg < _maxy-1, lines below _bmarg are not affected, which is the correct behaviour. However, if _cury > _bmarg (cursor is below the scroll region), the for loop executes 0 iterations and the blank line is still assigned to _bmarg per the 'if' on line 79, which is wrong -- a deletion at a cursor position outside the scroll region should not modify the bottom margin line.","fix":"Add a guard at the start of wdeleteln(): if win->_cury > win->_bmarg, return OK (or ERR) without modifying the window, since a delete at a position outside the scrolling region is a no-op.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/deleteln.c:53-87","code":"   53 | int wdeleteln(WINDOW *win)\n   54 | {\n   55 |     chtype blank, *temp, *ptr;\n   56 |     int y;\n   57 | \n   58 |     PDC_LOG((\"wdeleteln() - called\\n\"));\n   59 | \n   60 |     if (!win)\n   61 |         return ERR;\n   62 | \n   63 |     /* wrs (4/10/93) account for window background */\n   64 | \n   65 |     blank = win->_bkgd;\n   66 | \n   67 |     temp = win->_y[win->_cury];\n   68 | \n   69 |     for (y = win->_cury; y < win->_bmarg; y++)\n   70 |     {\n   71 |         win->_y[y] = win->_y[y + 1];\n   72 |         win->_firstch[y] = 0;\n   73 |         win->_lastch[y] = win->_maxx - 1;\n   74 |     }\n   75 | \n   76 |     for (ptr = temp; (ptr - temp < win->_maxx); ptr++)\n   77 |         *ptr = blank;           /* make a blank line */\n   78 | \n   79 |     if (win->_cury <= win->_bmarg)\n   80 |     {\n   81 |         win->_firstch[win->_bmarg] = 0;\n   82 |         win->_lastch[win->_bmarg] = win->_maxx - 1;\n   83 |         win->_y[win->_bmarg] = temp;\n   84 |     }\n   85 | \n   86 |     return OK;\n   87 | }","lines":35,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/deleteln.c#L53-L87"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In getch.c, the wgetch() function uses a static local buffer 'static int buffer[_INBUFSIZ]' (line 159) shared across all calls and all windows. This means input buffering is global state, which is problematic if multiple windows or threads call wgetch() concurrently. More critically, the static buffer state (c_pindex, c_gindex) is also file-static (lines 87-88), so they are shared across all windows. This is not thread-safe and could lead to data races.","fix":"Move the buffer and its indices into the SCREEN struct (SP) or document that wgetch() is not re-entrant.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getch.c:84-91","code":"   84 | #define _INBUFSIZ   512 /* size of terminal input buffer */\n   85 | #define NUNGETCH    256 /* max # chars to ungetch() */\n   86 | \n   87 | static int c_pindex = 0;    /* putter index */\n   88 | static int c_gindex = 1;    /* getter index */\n   89 | static int c_ungind = 0;    /* ungetch() push index */\n   90 | static int c_ungch[NUNGETCH];   /* array of ungotten chars */\n   91 | ","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getch.c#L84-L91"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getch.c:157-159","code":"  157 | int wgetch(WINDOW *win)\n  158 | {\n  159 |     static int buffer[_INBUFSIZ];   /* character buffer */","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getch.c#L157-L159"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In inchstr.c, winchnstr() always writes a terminating (chtype)0 sentinel at ch[n] (line 77), even when n has been clamped to 'win->_maxx - win->_curx'. If the caller passed a buffer of exactly n elements (i.e., n chtype slots), the NUL write goes one past the end. The same pattern appears throughout the callers (inchstr passes maxx-curx as n, then winchnstr writes n+1 elements). The function documentation says 'ending at the right margin, or after n elements' -- callers must provide n+1 allocation, which is not documented.","fix":"Document that the caller must allocate n+1 chtype elements to accommodate the terminating zero, or reduce the copy count by one before writing the sentinel.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/inchstr.c:59-80","code":"   59 | int winchnstr(WINDOW *win, chtype *ch, int n)\n   60 | {\n   61 |     chtype *src;\n   62 |     int i;\n   63 | \n   64 |     PDC_LOG((\"winchnstr() - called\\n\"));\n   65 | \n   66 |     if (!win || !ch || n < 0)\n   67 |         return ERR;\n   68 | \n   69 |     if ((win->_curx + n) > win->_maxx)\n   70 |         n = win->_maxx - win->_curx;\n   71 | \n   72 |     src = win->_y[win->_cury] + win->_curx;\n   73 | \n   74 |     for (i = 0; i < n; i++)\n   75 |         *ch++ = *src++;\n   76 | \n   77 |     *ch = (chtype)0;\n   78 | \n   79 |     return OK;\n   80 | }","lines":22,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/inchstr.c#L59-L80"}]},{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In initscr.c, the sprintf() call at line 224 writes into the fixed-size global ttytype[128] with the format 'pdcurses|PDCurses for %s'. If PDC_sysname() returns a string longer than 109 characters (128 minus the 19-character prefix), the buffer overflows. This is a stack-global overflow. No bounds are enforced.","fix":"Use snprintf(ttytype, sizeof(ttytype), \"pdcurses|PDCurses for %s\", PDC_sysname()) to prevent overflow.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/initscr.c:93-94","code":"   93 | char ttytype[128];\n   94 | ","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/initscr.c#L93-L94"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/initscr.c:224","code":"  224 |     sprintf(ttytype, \"pdcurses|PDCurses for %s\", PDC_sysname());","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/initscr.c#L224"}]},{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In initscr.c, if newwin() for curscr succeeds but newwin() for pdc_lastscr fails, the code calls exit(2) without freeing the memory allocated for curscr. Similarly, if stdscr allocation fails, both curscr and pdc_lastscr are leaked. This is an early-boot firmware context where memory leaks before exit matter less, but if PDC_scr_open or later allocations fail, the partially-initialized SP struct may be accessed by atexit handlers or destructors.","fix":"Free previously allocated windows before calling exit(), or use a common cleanup path.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/initscr.c:157-196","code":"  157 |     if ((curscr = newwin(LINES, COLS, 0, 0)) == (WINDOW *)NULL)\n  158 |     {\n  159 |         fprintf(stderr, \"initscr(): Unable to create curscr.\\n\");\n  160 |         exit(2);\n  161 |     }\n  162 | \n  163 |     if ((pdc_lastscr = newwin(LINES, COLS, 0, 0)) == (WINDOW *)NULL)\n  164 |     {\n  165 |         fprintf(stderr, \"initscr(): Unable to create pdc_lastscr.\\n\");\n  166 |         exit(2);\n  167 |     }\n  168 | \n  169 |     wattrset(pdc_lastscr, (chtype)(-1));\n  170 |     werase(pdc_lastscr);\n  171 | \n  172 |     PDC_slk_initialize();\n  173 |     LINES -= SP->slklines;\n  174 | \n  175 |     /* We have to sort out ripped off lines here, and reduce the height\n  176 |        of stdscr by the number of lines ripped off */\n  177 | \n  178 |     for (i = 0; i < linesrippedoff; i++)\n  179 |     {\n  180 |         if (linesripped[i].line < 0)\n  181 |             (*linesripped[i].init)(newwin(1, COLS, LINES - 1, 0), COLS);\n  182 |         else\n  183 |             (*linesripped[i].init)(newwin(1, COLS,\n  184 |                                    SP->linesrippedoffontop++, 0), COLS);\n  185 | \n  186 |         SP->linesrippedoff++;\n  187 |         LINES--;\n  188 |     }\n  189 | \n  190 |     linesrippedoff = 0;\n  191 | \n  192 |     if (!(stdscr = newwin(LINES, COLS, SP->linesrippedoffontop, 0)))\n  193 |     {\n  194 |         fprintf(stderr, \"initscr(): Unable to create stdscr.\\n\");\n  195 |         exit(1);\n  196 |     }","lines":40,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/initscr.c#L157-L196"}]},{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In insstr.c (non-wide path), the n clamping logic is inverted: 'if (n < 0 || n < len) n = len;' (line 83). This means when n is a positive value less than the string length (the caller's intent is to insert at most n characters), it is silently overridden to len, inserting the entire string. The correct behavior for winsnstr() is to insert at most n characters; n should only be set to len when n is negative (meaning 'no limit'). When n is a valid positive limit smaller than the string length, it should be respected.","fix":"Change the condition to 'if (n < 0 || n > len) n = len;' so that a caller-supplied n that is smaller than len is honored as an upper bound.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/insstr.c:81-84","code":"   81 |     len = strlen(str);\n   82 | \n   83 |     if (n < 0 || n < len)\n   84 |         n = len;","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/insstr.c#L81-L84"}]},{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The same inverted n clamping exists in wins_nwstr() for the wide-character path (lines 191-192): 'if (n < 0 || n < len) n = len;'. Same effect: a positive n smaller than the wide string length is ignored, and the full string is always inserted.","fix":"Change to 'if (n < 0 || n > len) n = len;'.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/insstr.c:188-198","code":"  188 |     for (len = 0, p = wstr; *p; p++)\n  189 |         len++;\n  190 | \n  191 |     if (n < 0 || n < len)\n  192 |         n = len;\n  193 | \n  194 |     while (n)\n  195 |         if (winsch(win, wstr[--n]) == ERR)\n  196 |             return ERR;\n  197 | \n  198 |     return OK;","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/insstr.c#L188-L198"}]},{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In keyname.c, the keyname() function accesses key_name[key - KEY_MIN] (line 108) after confirming has_key(key) returns TRUE (i.e., key is in [KEY_MIN, KEY_MAX]). However, has_key() returns TRUE for any key in that range, but the key_name[] array has a fixed number of entries. If KEY_MAX - KEY_MIN + 1 > number of entries in key_name[], an out-of-bounds array access occurs. The table must be kept exactly in sync with the key range defined in curses.h, which is fragile and not compile-time checked.","fix":"Add a compile-time assertion that ARRAY_SIZE(key_name) == KEY_MAX - KEY_MIN + 1, or add a runtime bounds check before indexing.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/keyname.c:35-108","code":"   35 | const char *keyname(int key)\n   36 | {\n   37 |     /* Key names must be in exactly the same order as in curses.h */\n   38 | \n   39 |     static const char *key_name[] =\n   40 |     {\n   41 |         \"KEY_BREAK\", \"KEY_DOWN\", \"KEY_UP\", \"KEY_LEFT\", \"KEY_RIGHT\",\n   42 |         \"KEY_HOME\", \"KEY_BACKSPACE\", \"KEY_F0\", \"KEY_F(1)\", \"KEY_F(2)\",\n   43 |         \"KEY_F(3)\", \"KEY_F(4)\", \"KEY_F(5)\", \"KEY_F(6)\", \"KEY_F(7)\",\n   44 |         \"KEY_F(8)\", \"KEY_F(9)\", \"KEY_F(10)\", \"KEY_F(11)\", \"KEY_F(12)\",\n   45 |         \"KEY_F(13)\", \"KEY_F(14)\", \"KEY_F(15)\", \"KE \"PAD0\", \"CTL_PAD0\", \"CTL_PAD1\", \"CTL_PAD2\", \"CTL_PAD3\",\n   92 |         \"CTL_PAD4\", \"CTL_PAD5\", \"CTL_PAD6\", \"CTL_PAD7\",\"CTL_PAD8\",\n   93 |         \"CTL_PAD9\", \"ALT_PAD0\", \"ALT_PAD1\", \"ALT_PAD2\", \"ALT_PAD3\",\n   94 |         \"ALT_PAD4\", \"ALT_PAD5\", \"ALT_PAD6\", \"ALT_PAD7\", \"ALT_PAD8\",\n   95 |         \"ALT_PAD9\", \"CTL_DEL\", \"ALT_BSLASH\", \"CTL_ENTER\",\n   96 |         \"SHF_PADENTER\", \"SHF_PADSLASH\", \"SHF_PADSTAR\", \"SHF_PADPLUS\",\n   97 |         \"SHF_PADMINUS\", \"SHF_UP\", \"SHF_DOWN\", \"SHF_IC\", \"SHF_DC\",\n   98 |         \"KEY_MOUSE\", \"KEY_SHIFT_L\", \"KEY_SHIFT_R\", \"KEY_CONTROL_L\",\n   99 |         \"KEY_CONTROL_R\", \"KEY_ALT_L\", \"KEY_ALT_R\", \"KEY_RESIZE\",\n  100 |         \"KEY_SUP\", \"KEY_SDOWN\"\n  101 |     };\n  102 | \n  103 |     PDC_LOG((\"keyname() - called: key %d\\n\", key));\n  104 | \n  105 |     if ((key >= 0) && (key < 0x80))\n  106 |         return unctrl((chtype)key);\n  107 | \n  108 |     return has_key(key) ? key_name[key - KEY_MIN] : \"UNKNOWN KEY\";","lines":74,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/keyname.c#L35-L108"}]},{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"_calculate_obscure() returns immediately when a malloc() for a PANELOBS node fails (line 272), leaving a partially-constructed obscure list on the current panel and leaving all subsequent panels with their old (stale) obscure lists. The early return means _override(pan, 1) is not called for the current panel and no panels below it in the stack get their obscure lists rebuilt. This leads to incorrect panel overdraw tracking: overlapping areas may not be redrawn when they should be, causing visual corruption.","fix":"On malloc failure, free any PANELOBS nodes already allocated for the current panel (reset pan->obscure and free the partial list), then return or propagate the error. Consider returning an error code from _calculate_obscure() so callers can handle it.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/panel.c:251-292","code":"  251 | static void _calculate_obscure(void)\n  252 | {\n  253 |     PANEL *pan, *pan2;\n  254 |     PANELOBS *tobs;     /* \"this\" one */\n  255 |     PANELOBS *lobs;     /* last one */\n  256 | \n  257 |     pan = _bottom_panel;\n  258 | \n  259 |     while (pan)\n  260 |     {\n  261 |         if (pan->obscure)\n  262 |             _free_obscure(pan);\n  263 | \n  264 |         lobs = (PANELOBS *)0;\n  265 |         pan2 = _bottom_panel;\n  266 | \n  267 |         while (pan2)\n  268 |         {\n  269 |             if (_panels_overlapped(pan, pan2))\n  270 |             {\n  271 |                 if ((tobs = malloc(sizeof(PANELOBS))) == NULL)\n  272 |                     return;\n  273 | \n  274 |                 tobs->pan = pan2;\n  275 |                 dPanel(\"obscured\", pan2);\n  276 |                 tobs->above = (PANELOBS *)0;\n  277 | \n  278 |                 if (lobs)\n  279 |                     lobs->above = tobs;\n  280 |                 else\n  281 |                     pan->obscure = tobs;\n  282 | \n  283 |                 lobs  = tobs;\n  284 |             }\n  285 | \n  286 |             pan2 = pan2->above;\n  287 |         }\n  288 | \n  289 |         _override(pan, 1);\n  290 |         pan = pan->above;\n  291 |     }\n  292 | }","lines":42,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/panel.c#L251-L292"}]},{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"panel_window() dereferences 'pan' without a NULL check, while every other panel function that takes a PANEL pointer begins with 'if (!pan) return ERR'. Passing NULL to panel_window() causes a NULL pointer dereference crash. The POSIX panel specification requires panel_window() to return NULL on error, implying it should handle NULL input gracefully.","fix":"Add a NULL guard: 'if (!pan) return NULL;' before accessing pan->win.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/panel.c:545-550","code":"  545 | WINDOW *panel_window(const PANEL *pan)\n  546 | {\n  547 |     PDC_LOG((\"panel_window() - called\\n\"));\n  548 | \n  549 |     return pan->win;\n  550 | }","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/panel.c#L545-L550"}]},{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In sdl1/pdcdisp.c PDC_transform_line(), before the main rendering loop the\ncode computes and queues a single wide rectangle covering all `len` columns (lines 254-275).\nHowever, the rectangle merging logic at lines 266-275 can append `dest` (full-width rectangle)\nto uprect without first checking whether rectcount has already reached MAXRECT. The MAXRECT\nguard at line 248-249 only flushes before starting, but after the flush rectcount is 0 and\na new entry is added unconditionally. Inside the per-character loop at line 272, rectcount\nis incremented without a bounds check. If len is large and many unmerged rects accumulate,\nrectcount can overflow the uprect[MAXRECT] array.","fix":"Before each `uprect[rectcount++] = dest;` assignment (lines 272 and 275),\ncheck `if (rectcount < MAXRECT)` or call PDC_update_rects() to flush first.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcdisp.c:241-301","code":"  241 | void PDC_transform_line(int lineno, int x, int len, const chtype *srcp)\n  242 | {\n  243 |     SDL_Rect src, dest, lastrect;\n  244 |     int j;\n  245 | \n  246 |     PDC_LOG((\"PDC_transform_line() - called: lineno=%d\\n\", lineno));\n  247 | \n  248 |     if (rectcount == MAXRECT)\n  249 |         PDC_update_rects();\n  250 | \n  251 |     src.h = pdc_fheight;\n  252 |     src.w = pdc_fwidth;\n  253 | \n  254 |     dest.y = pdc_fheight * lineno + pdc_yoffset;\n  255 |     dest.x = pdc_fwidth * x + pdc_xoffset;\n  256 |     dest.h = pdc_fheight;\n  257 |     dest.w = pdc_fwidth * len;\n  258 | \n  259 |     /* if the previous rect was just above this one, with the same width\n  260 |        and horizontal position, then merge the new one with it instead\n  261 |        of adding a new entry */\n  262 | \n  263 |     if (rectcount)\n  264 |         lastrect = uprect[rectcount - 1];\n  265 | \n  266 |     if (rectcount && lastrect.x == dest.x && lastrect.w == dest.w)\n  267 |     {\n  268 |         if (lastrect.y + lastrect.h == dest.y)\n  269 |             uprect[rectcount - 1].h = lastrect.h + pdc_fheight;\n  270 |         else\n  271 |             if (lastrect.y != dest.y)\n  272 |                 uprect[rectcount++] = dest;\n  273 |     }\n  274 |     else\n  275 |         uprect[rectcount++] = dest;\n  276 | \n  277 |     dest.w = pdc_fwidth;\n  278 | \n  279 |     for (j = 0; j < len; j++)\n  280 |     {\n  281 |         chtype ch = srcp[j];\n  282 | \n  283 |         _set_attr(ch);\n  284 | #ifdef CHTYPE_LONG\n  285 |         if (ch & A_ALTCHARSET && !(ch & 0xff80))\n  286 |             ch = (ch & (A_ATTRIBUTES ^ A_ALTCHARSET)) | acs_map[ch & 0x7f];\n  287 | #endif\n  288 |         if (backgr == -1)\n  289 |             SDL_LowerBlit(pdc_tileback, &dest, pdc_screen, &dest);\n  290 | \n  291 |         src.x = (ch & 0xff) % 32 * pdc_fwidth;\n  292 |         src.y = (ch & 0xff) / 32 * pdc_fheight;\n  293 | \n  294 |         SDL_LowerBlit(pdc_font, &src, pdc_screen, &dest);\n  295 | \n  296 |         if (ch & (A_UNDERLINE|A_LEFTLINE|A_RIGHTLINE))\n  297 |             _highlight(&src, &dest, ch);\n  298 | \n  299 |         dest.x += pdc_fwidth;\n  300 |     }\n  301 | }","lines":61,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcdisp.c#L241-L301"}]},{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"PDC_get_rows() and PDC_get_columns() in sdl1/pdcgetsc.c divide by pdc_fheight\nand pdc_fwidth respectively (lines 22, 31). These are set in PDC_scr_open() from the font surface\ndimensions. If the font surface dimensions are not multiples of 8 (fheight) or 32 (fwidth) the\nfont character cells will be zero-sized (pdc_fheight = font->h / 8, pdc_fwidth = font->w / 32).\nA zero divisor causes a division-by-zero crash. The same issue applies to PDC_gotoyx and\nPDC_transform_line which use these values in arithmetic.","fix":"After computing pdc_fheight and pdc_fwidth (pdcscrn.c lines 123-124), assert or\ncheck that both are > 0 and return ERR if not, to prevent later division-by-zero crashes.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcgetsc.c:18-32","code":"   18 | int PDC_get_rows(void)\n   19 | {\n   20 |     PDC_LOG((\"PDC_get_rows() - called\\n\"));\n   21 | \n   22 |     return pdc_sheight / pdc_fheight;\n   23 | }\n   24 | \n   25 | /* return width of screen/viewport */\n   26 | \n   27 | int PDC_get_columns(void)\n   28 | {\n   29 |     PDC_LOG((\"PDC_get_columns() - called\\n\"));\n   30 | \n   31 |     return pdc_swidth / pdc_fwidth;\n   32 | }","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcgetsc.c#L18-L32"},{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c:123-124","code":"  123 |     pdc_fheight = pdc_font->h / 8;\n  124 |     pdc_fwidth = pdc_font->w / 32;","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L123-L124"}]},{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"free_form calls Disconnect_Fields(form) which already frees form->page (frm_def.c:138-140) and sets it to NULL. Immediately after, free_form checks 'if (form->page) free(form->page)' - which is unreachable because Disconnect_Fields just set it to NULL. The check is dead code, but it is misleading because if the NULL assignment inside Disconnect_Fields were ever removed the code would double-free.","fix":"Remove the redundant 'if (form->page) free(form->page);' block in free_form (lines 375-376). Disconnect_Fields already owns the page lifetime.","locations":[{"ref":"payloads/libpayload/curses/form/frm_def.c:374-377","code":"  374 |   Disconnect_Fields(form);\n  375 |   if (form->page)\n  376 |     free(form->page);\n  377 |   free(form);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L374-L377"},{"ref":"payloads/libpayload/curses/form/frm_def.c:138-140","code":"  138 |       if (form->page)\n  139 | \tfree(form->page);\n  140 |       form->page = (_PAGE *) 0;","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L138-L140"}]},{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"FE_Delete_Previous uses field->cols instead of field->dcols when deciding whether the current line's content fits on the previous line after a merge (line 2762-2763: 'field->cols - (int)(prev_end - prev_line)'). For dynamically grown fields where dcols > cols, this underestimates available space and may incorrectly deny a valid delete-previous operation, causing a confusing E_REQUEST_DENIED to the user.","fix":"Change 'field->cols - (int)(prev_end - prev_line)' to 'field->dcols - (int)(prev_end - prev_line)' to correctly account for the actual dynamic column width.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:2762-2764","code":" 2762 |       if ((int)(this_end - this_line) >\n 2763 | \t  (field->cols - (int)(prev_end - prev_line)))\n 2764 | \treturnCode(E_REQUEST_DENIED);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L2762-L2764"}]},{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In frm_req_name.c, form_request_by_name uses strncpy(buf, str, sizeof(buf)) where\nbuf is 16 bytes. If 'str' is 16 or more characters long, strncpy does NOT append a\nnull terminator, leaving buf unterminated. The subsequent toupper loop correctly\nstops at sizeof(buf) iterations and does not overrun the buffer, but the final\nstrncmp(request_names[i], buf, sizeof(buf)) compares 16 bytes of an unterminated\n'buf'. While this is technically bounded by sizeof(buf), a string of exactly 16\ncharacters would incorrectly match a request name that shares the first 16 bytes,\neven if they differ after that. More importantly, any string >= 16 chars loses\nits suffix silently without the caller being notified.","fix":"Force null termination after strncpy:\n  strncpy(buf, str, sizeof(buf) - 1);\n  buf[sizeof(buf) - 1] = '\\0';\nThis ensures buf is always null-terminated before the loop and strncmp.","locations":[{"ref":"payloads/libpayload/curses/form/frm_req_name.c:147-165","code":"  147 |   unsigned int i = 0;\n  148 |   char buf[16];\n  149 | \n  150 |   T((T_CALLED(\"form_request_by_name(%s)\"), _nc_visbuf(str)));\n  151 | \n  152 |   if (str)\n  153 |     {\n  154 |       strncpy(buf, str, sizeof(buf));\n  155 |       while ((i < sizeof(buf)) && (buf[i] != '\\0'))\n  156 | \t{\n  157 | \t  buf[i] = (char)toupper(UChar(buf[i]));\n  158 | \t  i++;\n  159 | \t}\n  160 | \n  161 |       for (i = 0; i < A_SIZE; i++)\n  162 | \t{\n  163 | \t  if (strncmp(request_names[i], buf, sizeof(buf)) == 0)\n  164 | \t    returnCode(MIN_FORM_COMMAND + (int)i);\n  165 | \t}","lines":19,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_req_name.c#L147-L165"}]},{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In m_opts.c set_menu_opts(), opts is masked with ALL_MENU_OPTS on line 60 before the dead-code guard on line 62. The check `opts & ~ALL_MENU_OPTS` always evaluates to 0/false because all unrecognized bits were already cleared by the mask on the previous line, so E_BAD_ARGUMENT is never returned for invalid option bits. The dead check provides false confidence about input validation.","fix":"Remove the masking on line 60 and let the check on line 62 fire first, then apply the mask only after validation: `if (opts & ~ALL_MENU_OPTS) RETURN(E_BAD_ARGUMENT); opts &= ALL_MENU_OPTS;`","locations":[{"ref":"payloads/libpayload/curses/menu/m_opts.c:60-63","code":"   60 |   opts &= ALL_MENU_OPTS;\n   61 | \n   62 |   if (opts & ~ALL_MENU_OPTS)\n   63 |     RETURN(E_BAD_ARGUMENT);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_opts.c#L60-L63"}]},{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In m_opts.c menu_opts_off() and menu_opts_on(), the same pre-masking-then-dead-check pattern is repeated (lines 124-126 and 157-159). The `opts & ~ALL_MENU_OPTS` test is always false after `opts &= ALL_MENU_OPTS`. This is the same issue as in set_menu_opts().","fix":"Validate before masking: check `opts & ~ALL_MENU_OPTS` first, return E_BAD_ARGUMENT if nonzero, then apply the mask.","locations":[{"ref":"payloads/libpayload/curses/menu/m_opts.c:124-126","code":"  124 |   opts &= ALL_MENU_OPTS;\n  125 |   if (opts & ~ALL_MENU_OPTS)\n  126 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_opts.c#L124-L126"},{"ref":"payloads/libpayload/curses/menu/m_opts.c:157-159","code":"  157 |   opts &= ALL_MENU_OPTS;\n  158 |   if (opts & ~ALL_MENU_OPTS)\n  159 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_opts.c#L157-L159"}]},{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In pdcdisp.c PDC_transform_line(), the serial console path (lines 152-153) calls `serial_set_cursor(lineno, x)` with arguments (lineno=row, x=col) swapped compared to the expected (col, row) order used in PDC_gotoyx(). PDC_gotoyx() calls `serial_set_cursor(col, row)` with col first. The transform_line call passes row as first arg and col as second, which is reversed. This would position the serial cursor incorrectly at the start of each transformed line.","fix":"Change line 152 to `serial_set_cursor(x, lineno);` to match the (col, row) convention used by PDC_gotoyx().","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdcdisp.c:149-154","code":"  149 |     if (curses_flags & F_ENABLE_SERIAL) {\n  150 |         serial_end_bold();\n  151 |         serial_end_altcharset();\n  152 |         serial_set_cursor(lineno, x);\n  153 |     }\n  154 | #endif","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdcdisp.c#L149-L154"}]},{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In pdckbd.c handle_escape(), the escape sequence matching loop (lines 71-84) checks `if (t == len)` to declare a match, but this only confirms that all `len` characters of the buffer matched the first `len` characters of the escape code sequence. If a sequence in escape_codes[] is longer than `len` (i.e., `*p` is not '\\0' at position t), the loop breaks early and still declares a match, because the exit condition `t == len` fires before exhausting the pattern. This can cause partial matches: e.g., a 2-char buffer `[A` would match `[17~` at the 2-char prefix level if a code in the table had `[A` as a prefix of a longer sequence.","fix":"After the inner loop, also check that `*p == '\\0'` to confirm the full pattern was consumed: `if (t == len && *p == '\\0') return escape_codes[i].key;`","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdckbd.c:71-84","code":"   71 | \tfor(i = 0; escape_codes[i].seq != NULL; i++) {\n   72 | \t\tconst char *p = escape_codes[i].seq;\n   73 | \n   74 | \t\tfor(t = 0; t < len; t++) {\n   75 | \t\t\tif (!*p || *p != buffer[t])\n   76 | \t\t\t\tbreak;\n   77 | \t\t\tp++;\n   78 | \t\t}\n   79 | \n   80 | \t\tif (t == len)\n   81 | \t\t\treturn escape_codes[i].key;\n   82 | \t}\n   83 | \n   84 | \treturn 0;","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdckbd.c#L71-L84"}]},{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In pdcscrn.c PDC_init_pair(), the parameter `pair` is a `short` and is used as `pdc_atrtab[pair * PDC_OFFSET + i]` without bounds checking. If `pair` is negative or >= PDC_COLOR_PAIRS, this accesses pdc_atrtab out of bounds. pdc_atrtab is allocated as `PDC_COLOR_PAIRS * PDC_OFFSET` bytes but there is no validation of the pair argument.","fix":"Add `if (pair < 0 || pair >= PDC_COLOR_PAIRS) return;` at the start of PDC_init_pair().","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdcscrn.c:110-137","code":"  110 | void PDC_init_pair(short pair, short fg, short bg)\n  111 | {\n  112 |     unsigned char att, temp_bg;\n  113 |     chtype i;\n  114 | \n  115 |     fg = curstoreal[fg];\n  116 |     bg = curstoreal[bg];\n  117 | \n  118 |     for (i = 0; i < PDC_OFFSET; i++)\n  119 |     {\n  120 |         att = fg | (bg << 4);\n  121 | \n  122 |         if (i & (A_REVERSE >> PDC_ATTR_SHIFT))\n  123 |             att = bg | (fg << 4);\n  124 |         if (i & (A_UNDERLINE >> PDC_ATTR_SHIFT))\n  125 |             att = 1;\n  126 |         if (i & (A_INVIS >> PDC_ATTR_SHIFT))\n  127 |         {\n  128 |             temp_bg = att >> 4;\n  129 |             att = temp_bg << 4 | temp_bg;\n  130 |         }\n  131 |         if (i & (A_BOLD >> PDC_ATTR_SHIFT))\n  132 |             att |= 8;\n  133 |         if (i & (A_BLINK >> PDC_ATTR_SHIFT))\n  134 |             att |= 128;\n  135 | \n  136 |         pdc_atrtab[pair * PDC_OFFSET + i] = att;\n  137 |     }","lines":28,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdcscrn.c#L110-L137"}]},{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In pdcscrn.c PDC_pair_content(), the pair parameter is also unchecked, allowing out-of-bounds read from pdc_atrtab. Additionally, the return value of realtocurs[] indexing with `pdc_atrtab[...] & 0x0F` (or `>> 4`) is not bounds-checked before indexing realtocurs[16], which could be out of range if pdc_atrtab contains garbage from a failed or partial PDC_init_pair.","fix":"Validate pair in [0, PDC_COLOR_PAIRS) and validate the nibble values in [0, 15] before indexing realtocurs.","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdcscrn.c:140-146","code":"  140 | int PDC_pair_content(short pair, short *fg, short *bg)\n  141 | {\n  142 |     *fg = realtocurs[pdc_atrtab[pair * PDC_OFFSET] & 0x0F];\n  143 |     *bg = realtocurs[(pdc_atrtab[pair * PDC_OFFSET] & 0xF0) >> 4];\n  144 | \n  145 |     return OK;\n  146 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdcscrn.c#L140-L146"}]},{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In tinycurses.c wrefresh(), the function returns early on line 904 (`return wnoutrefresh(win);`) leaving all the code below (lines 907-927) unreachable dead code. The dead block references `curscr`, `newscr`, and `doupdate()` (commented out), and contains a `code` variable used without initialization in the surviving path after the goto. This is dead code that was never cleaned up and could mislead future maintainers.","fix":"Remove the dead code from line 907 to the end of wrefresh(), or if it is needed, remove the early return and implement doupdate() properly.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:902-927","code":"  902 | int wrefresh(WINDOW *win)\n  903 | {\n  904 | \t// FIXME\n  905 | \treturn wnoutrefresh(win);\n  906 | \n  907 | \t// XXX\n  908 | \tint code;\n  909 | \n  910 | \tif (win == curscr) {\n  911 | \t\tcurscr->_clear = TRUE;\n  912 | \t\t// code = doupdate();\n  913 | \t} else if ((code = wnoutrefresh(win)) == OK) {\n  914 | \t\tif (win->_clear)\n  915 | \t\t\tnewscr->_clear = TRUE;\n  916 | \t\t// code = doupdate();\n  917 | \t\t/*\n  918 | \t\t * Reset the clearok() flag in case it was set for the special\n  919 | \t\t * case in hardscroll.c (if we don't reset it here, we'll get 2\n  920 | \t\t * refreshes because the flag is copied from stdscr to newscr).\n  921 | \t\t * Resetting the flag shouldn't do any harm, anyway.\n  922 | \t\t */\n  923 | \t\twin->_clear = FALSE;\n  924 | \t}\n  925 | \n  926 | \treturn code;\n  927 | }","lines":26,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L902-L927"}]},{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In tinycurses.c wscrl(), when n is negative (scroll down), the loop `for (y = 0; y <= (win->_maxy - n); y++)` with negative n would compute `win->_maxy - n > win->_maxy`, causing the loop to iterate past win->_maxy and access win->_line[y] out of bounds. The function returns ERR early only if `!win->_scroll`, not if `n < 0`, so negative n values lead to out-of-bounds array access.","fix":"Add `if (n < 0) return ERR;` (or implement reverse scrolling with proper bounds), and ensure the loop bound `win->_maxy - n` does not exceed the allocated array size.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:929-975","code":"  929 | int wscrl(WINDOW *win, int n)\n  930 | {\n  931 | \tint x, y;\n  932 | \n  933 | \tif (!win->_scroll)\n  934 | \t\treturn ERR;\n  935 | \n  936 | \tif (n == 0)\n  937 | \t\treturn OK;\n  938 | \n  939 | \tfor (y = 0; y <= (win->_maxy - n); y++) {\n  940 | \t\twin->_line[y].firstchar = win->_line[y + n].firstchar;\n  941 | \t\twin->_line[y].lastchar = win->_line[y + n].lastchar;\n  942 | \t\tfor (x = 0; x <= win->_maxx; x++) {\n  943 | \t\t\tif ((win->_line[y].text[x].chars[0] != win->_line[y + n].text[x].chars[0]) ||\n  944 | \t\t\t\t\t(win->_line[y].text[x].attr != win->_line[y + n].text[x].attr)) {\n  945 | \t\t\t\tif (win->_line[y].firstchar == _NOCHANGE)\n  946 | \t\t\t\t\twin->_line[y].firstchar = x;\n  947 | \n  948 | \t\t\t\twin->_line[y].lastchar = x;\n  949 | \n  950 | \t\t\t\twin->_line[y].text[x].chars[0] = win->_line[y + n].text[x].chars[0];\n  951 | \t\t\t\twin->_line[y].text[x].attr = win->_line[y + n].text[x].attr;\n  952 | \t\t\t}\n  953 | \t\t}\n  954 | \t}\n  955 | \n  956 | \tfor (y = (win->_maxy+1 - n); y <= win->_maxy; y++) {\n  957 | \t\tfor (x = 0; x <= win->_maxx; x++) {\n  958 | \t\t\tif ((win->_line[y].text[x].chars[0] != ' ') ||\n  959 | \t\t\t\t\t(win->_line[y].text[x].attr != A_NORMAL)) {\n  960 | \t\t\t\tif (win->_line[y].firstchar == _NOCHANGE)\n  961 | \t\t\t\t\twin->_line[y].firstchar = x;\n  962 | \n  963 | \t\t\t\twin->_line[y].lastchar = x;\n  964 | \n  965 | \t\t\t\twin->_line[y].text[x].chars[0] = ' ';\n  966 | \t\t\t\twin->_line[y].text[x].attr = A_NORMAL;\n  967 | \t\t\t}\n  968 | \t\t}\n  969 | \t}\n  970 | \n  971 | \t// _nc_scroll_window(win, n, win->_regtop, win->_regbottom, win->_nc_bkgd);\n  972 | \t// _nc_synchook(win);\n  973 | \n  974 | \treturn OK;\n  975 | }","lines":47,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L929-L975"}]},{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In cbmem_console.c do_write(), the memcpy at line 52 writes `count` bytes starting at `cbmem_cons->body + (cbmem_cons->cursor & CURSOR_MASK)` without verifying that `(cbmem_cons->cursor & CURSOR_MASK) + count <= cbmem_cons->size`. cbmem_console_write() calls do_write only after verifying the condition, so in practice this is safe - but do_write itself has no safety check and could be misused if called directly. The bigger concern is that cbmem_console_write() calls do_write for the wrap-around partial write using `still_fits` as the count. If cbmem_cons->cursor has been corrupted externally (e.g., by coreboot writing to it simultaneously), still_fits could be > size, causing overflow.","fix":"Add an assert or clamp in do_write: `if ((cbmem_cons->cursor & CURSOR_MASK) + count > cbmem_cons->size) count = cbmem_cons->size - (cbmem_cons->cursor & CURSOR_MASK);`","locations":[{"ref":"payloads/libpayload/drivers/cbmem_console.c:48-54","code":"   48 | static void do_write(const void *buffer, size_t count)\n   49 | {\n   50 | \tstruct cbmem_console *const cbmem_cons = phys_to_virt(cbmem_console_p);\n   51 | \n   52 | \tmemcpy(cbmem_cons->body + (cbmem_cons->cursor & CURSOR_MASK), buffer, count);\n   53 | \tcbmem_cons->cursor += count;\n   54 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/cbmem_console.c#L48-L54"}]},{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In cbmem_console.c cbmem_console_snapshot(), the overflow path reads `console_p->body[oldc]` for oldc in [cursor, size). Then the non-overflow path reads `console_p->body[oldc]` for oldc in [0, cursor). But newc (the write cursor into console_c) accumulates bytes from both passes without checking that newc < size+1 before each `snapshot_putc` call. snapshot_putc writes `console[*cursor] = c` without checking if `*cursor < size`. With an overflow console, size bytes are read from the body but snapshot_putc could write newc up to size because some chars are filtered (markers and non-printable), meaning newc <= size. However, if no chars are filtered, newc reaches `size` and `console_c[newc] = '\\0'` on line 137 would write at exactly size, which is one past the valid allocation of size bytes (malloc(size+1) allocates size+1 bytes, so index `size` is valid). This is actually safe by the +1 allocation, but the logic is fragile.","fix":"Add a bounds check in snapshot_putc: `if (*cursor >= allocated_size) return;` to make it robust. Pass the allocation size as a parameter.","locations":[{"ref":"payloads/libpayload/drivers/cbmem_console.c:100-139","code":"  100 | char *cbmem_console_snapshot(void)\n  101 | {\n  102 | \tconst struct cbmem_console *const console_p = phys_to_virt(cbmem_console_p);\n  103 | \tchar *console_c;\n  104 | \tuint32_t size, cursor, overflow, newc, oldc;\n  105 | \n  106 | \tif (!console_p) {\n  107 | \t\tprintf(\"ERROR: No cbmem console found in coreboot table\\n\");\n  108 | \t\treturn NULL;\n  109 | \t}\n  110 | \n  111 | \tcursor = console_p->cursor & CURSOR_MASK;\n  112 | \toverflow = console_p->cursor & OVERFLOW;\n  113 | \tif (!overflow && cursor < console_p->size)\n  114 | \t\tsize = cursor;\n  115 | \telse\n  116 | \t\tsize = console_p->size;\n  117 | \n  118 | \tconsole_c = malloc(size + 1);\n  119 | \tif (!console_c) {\n  120 | \t\tprintf(\"ERROR: Not enough memory for console (size = %u)\\n\",\n  121 | \t\t       size);\n  122 | \t\treturn NULL;\n  123 | \t}\n  124 | \n  125 | \tnewc = 0;\n  126 | \tif (overflow) {\n  127 | \t\tif (cursor >= size) {\n  128 | \t\t\tprintf(\"ERROR: CBMEM console struct is corrupted\\n\");\n  129 | \t\t\tfree(console_c);\n  130 | \t\t\treturn NULL;\n  131 | \t\t}\n  132 | \t\tfor (oldc = cursor; oldc < size; oldc++)\n  133 | \t\t\tsnapshot_putc(console_c, &newc, console_p->body[oldc]);\n  134 | \t}\n  135 | \tfor (oldc = 0; oldc < size && oldc < cursor; oldc++)\n  136 | \t\tsnapshot_putc(console_c, &newc, console_p->body[oldc]);\n  137 | \tconsole_c[newc] = '\\0';\n  138 | \n  139 | \treturn console_c;","lines":40,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/cbmem_console.c#L100-L139"}]},{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In i8042.c fifo_push(), when the FIFO is full (tx wraps around to equal rx), rx is incremented to drop the oldest byte. But the increment is done as `fifo->rx++` before modulo, and the modulo is applied after: `fifo->rx = fifo->rx % fifo->len`. This is correct for the modulo, but if fifo->len is 0 (e.g., from a failed initialization that somehow let buf=NULL and len=0 slip through), this is a division-by-zero. fifo_init prevents len=0 only implicitly through malloc behavior.","fix":"Assert or check fifo->len > 0 in fifo_push, or guard fifo_init against len=0.","locations":[{"ref":"payloads/libpayload/drivers/i8042/i8042.c:77-83","code":"   77 | static void fifo_push(struct fifo *fifo, u8 c)\n   78 | {\n   79 | \tfifo->buf[fifo->tx++] = c;\n   80 | \tfifo->tx = fifo->tx % fifo->len;\n   81 | \tif (fifo->tx == fifo->rx)\n   82 | \t\tfifo->rx++;\n   83 | \tfifo->rx = fifo->rx % fifo->len;","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/i8042.c#L77-L83"}]},{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In i8042.c i8042_cmd_with_data(), after calling i8042_write_data(data) on line 348, the return value is `ret` from the earlier i8042_cmd() call (line 351: `return ret`), not the result of i8042_write_data. i8042_write_data itself returns void and cannot signal failure. If the data write times out (i8042_wait_cmd_rdy fails inside i8042_write_data), the caller receives E_OK (ret=0) falsely indicating success. This is particularly harmful in i8042_set_kbd_translation() which trusts this return value.","fix":"Change i8042_write_data() to return int indicating success/failure, check it in i8042_cmd_with_data(), and propagate the error.","locations":[{"ref":"payloads/libpayload/drivers/i8042/i8042.c:342-351","code":"  342 | static int i8042_cmd_with_data(const u8 cmd, const u8 data)\n  343 | {\n  344 | \tconst int ret = i8042_cmd(cmd);\n  345 | \tif (ret != 0)\n  346 | \t\treturn ret;\n  347 | \n  348 | \ti8042_write_data(data);\n  349 | \n  350 | \treturn ret;\n  351 | }","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/i8042.c#L342-L351"}]},{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In i8042.c i8042_data_poll(), the status byte `c` is read once before the loop, then rechecked inside the loop, but when the status is 0xFF it silently drops data and exits (line 364: `while ((c != 0xFF) && (c & OBF))`). If the controller is in a transient bad state and returns 0xFF once, the entire poll loop exits, possibly leaving valid data in the OBF from a prior read that has already been consumed. The OBF is checked on the stale `c` variable (which was updated by the previous iteration's `read_status()` on line 371), not a fresh read - actually line 371 does re-read status. The 0xFF exit is correct as a 'no controller' check but is also silently triggered by transient bus glitches, losing keyboard data.","fix":"Consider logging a warning on 0xFF status or treating it as 'no data' rather than a hard exit, to be resilient to transient bus glitches.","locations":[{"ref":"payloads/libpayload/drivers/i8042/i8042.c:356-373","code":"  356 | static void i8042_data_poll(void)\n  357 | {\n  358 | \tu8 c;\n  359 | \n  360 | \tif (!initialized)\n  361 | \t\treturn;\n  362 | \n  363 | \tc = read_status();\n  364 | \twhile ((c != 0xFF) && (c & OBF)) {\n  365 | \t\tconst u8 in = read_data();\n  366 | \t\t/* Assume \"second PS/2 port output buffer full\" flag works */\n  367 | \t\tstruct fifo *const fifo = (c & 0x20) ? aux_fifo : ps2_fifo;\n  368 | \t\tif (fifo)\n  369 | \t\t\tfifo_push(fifo, in);\n  370 | \n  371 | \t\tc = read_status();\n  372 | \t}\n  373 | }","lines":18,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/i8042.c#L356-L373"}]},{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In keyboard.c keyboard_getchar(), after the MEDIA_KEY_PREFIX special case, the check `if (!(ch & 0x80) && ch < 0x59)` gates the keyboard map lookup. For the MEDIA_KEY_PREFIX (0xE0) path, ch is first set to 0xE0 then overwritten by the second keyboard_get_scancode() result. If media_key_mapping_callback is NULL and the MEDIA_KEY_PREFIX path exits the if block, ch retains the value 0xE0 (break code = bit 7 set), so the check `ch & 0x80` is true and the scancode is silently dropped, returning 0. This means extended keys are silently ignored when the media callback is not installed, which is the intended fallback but may surprise callers expecting arrow-key codes.","fix":"Document or explicitly handle the case where no media_key_
