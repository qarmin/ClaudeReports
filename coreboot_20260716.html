mapping_callback is installed and E0-prefixed keys are received; or implement basic E0 key translation inline.","locations":[{"ref":"payloads/libpayload/drivers/i8042/keyboard.c:558-591","code":"  558 | \tif ((media_key_mapping_callback != NULL) && (ch == MEDIA_KEY_PREFIX)) {\n  559 | \t\tch = keyboard_get_scancode();\n  560 | \t\treturn media_key_mapping_callback(ch);\n  561 | \t}\n  562 | \n  563 | \tif (!(ch & 0x80) && ch < 0x59) {\n  564 | \t\tshift =\n  565 | \t\t    (modifier & KB_MOD_SHIFT) ^ (modifier & KB_MOD_CAPSLOCK) ? 1 : 0;\n  566 | \n  567 | \t\tif (modifier & KB_MOD_ALT)\n  568 | \t\t\tshift += 2;\n  569 | \n  570 | \t\tret = map->map[shift][ch];\n  571 | \n  572 | \t\tif (modifier & KB_MOD_CTRL) {\n  573 | \t\t\tswitch (ret) {\n  574 | \t\t\tcase 'a' ... 'z':\n  575 | \t\t\t\tret &= 0x1f;\n  576 | \t\t\t\tbreak;\n  577 | \t\t\tcase KEY_DC:\n  578 | \t\t\t\t/* vulcan nerve pinch */\n  579 | \t\t\t\tif ((modifier & KB_MOD_ALT) && reset_handler)\n  580 | \t\t\t\t\treset_handler();\n  581 | \t\t\t\t__fallthrough;\n  582 | \t\t\tdefault:\n  583 | \t\t\t\tret = 0;\n  584 | \t\t\t}\n  585 | \t\t}\n  586 | \t}\n  587 | \n  588 | \tif (ch == 0x5e)\n  589 | \t\tret = POWER_BUTTON;\n  590 | \n  591 | \treturn ret;","lines":34,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/keyboard.c#L558-L591"}]},{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In keyboard.c keyboard_getchar(), when `ch == MEDIA_KEY_PREFIX (0xE0)`, keyboard_get_scancode() is called again to read the second byte and the result is passed to media_key_mapping_callback(). However, keyboard_get_scancode() itself processes modifier keys and updates the `modifier` variable. An E0-prefixed scancode (like extended arrow keys or numpad keys) will have its second byte processed as if it were a standalone scancode, potentially modifying the modifier state incorrectly (e.g., extended shift codes 0xE0 0x2A / 0xE0 0x36 would set KB_MOD_SHIFT). This is only a problem if media_key_mapping_callback is not set for such codes; if it is NULL the code falls through to the scancode table lookup.","fix":"The MEDIA_KEY_PREFIX path should call i8042_read_data_ps2() directly to get the raw second byte without passing through keyboard_get_scancode()'s modifier-state logic.","locations":[{"ref":"payloads/libpayload/drivers/i8042/keyboard.c:558-561","code":"  558 | \tif ((media_key_mapping_callback != NULL) && (ch == MEDIA_KEY_PREFIX)) {\n  559 | \t\tch = keyboard_get_scancode();\n  560 | \t\treturn media_key_mapping_callback(ch);\n  561 | \t}","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/keyboard.c#L558-L561"}]},{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In keyboard.c keyboard_set_layout(), the strncmp uses `strlen(keyboard_layouts[i].country)` as the comparison length. If the caller passes a longer string with the same prefix (e.g., 'usage'), it would match 'us'. This allows ambiguous or unintended layout selection. Comparing against the full string length of the input would be more correct.","fix":"Use `strcmp(keyboard_layouts[i].country, country) == 0` for an exact match, or use `strncmp` with the maximum of both string lengths.","locations":[{"ref":"payloads/libpayload/drivers/i8042/keyboard.c:604-607","code":"  604 | \tfor (i=0; i<ARRAY_SIZE(keyboard_layouts); i++) {\n  605 | \t\tif (strncmp(keyboard_layouts[i].country, country,\n  606 | \t\t\t\t\tstrlen(keyboard_layouts[i].country)))\n  607 | \t\t\tcontinue;","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/keyboard.c#L604-L607"}]},{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In mouse.c mouse_decode(), the z_axis calculation on lines 154 and 156 is `(mouse_buf[3] & 0x7) - (mouse_buf[3] & 0x08) ? 8 : 0`. Due to C operator precedence, this parses as `(mouse_buf[3] & 0x7) - ((mouse_buf[3] & 0x08) ? 8 : 0)`. When the sign bit (0x08) is set, the scroll delta should be negative (scroll up), yielding a value in range [0..7] - 8 = [-8..-1]. This is correct in intent, but the subtraction `(mouse_buf[3] & 0x7) - 8` when the lower nibble is 0 gives -8, and when it is 7 gives -1. However both is_intellimouse and is_explorer_intellimouse use identical code; this is actually correct behavior, but it is extremely confusing and hard to verify. More critically: if neither is_intellimouse nor is_explorer_intellimouse is set but mouse_buf_idx reaches 4 somehow, the 4th byte is never validated and the function falls through to the 3-byte path with idx < 3 check (which passes because idx == 4 >= 3), so it processes only 3 bytes while a 4th is sitting in the buffer unprocessed.","fix":"Add parentheses to the z_axis expression for clarity. For the 3-byte protocol case, enforce `mouse_buf_idx == 3` (not just >= 3) to avoid processing stale 4th bytes.","locations":[{"ref":"payloads/libpayload/drivers/i8042/mouse.c:125-161","code":"  125 | static void mouse_decode(void)\n  126 | {\n  127 | \t/* Buffer full check and sanity check */\n  128 | \tif (is_intellimouse) {\n  129 | \t\tif (mouse_buf_idx < 4)\n  130 | \t\t\treturn;\n  131 | \t\tif ((mouse_buf[3] & 0x10) != (mouse_buf[3] & 0x08)) {\n  132 | \t\t\tmouse_buf_idx = 0;\n  133 | \t\t\treturn;\n  134 | \t\t}\n  135 | \t} else if (is_explorer_intellimouse) {\n  136 | \t\tif (mouse_buf_idx < 4)\n  137 | \t\t\treturn;\n  138 | \t\tif (mouse_buf[3] & 0xc0) {\n  139 | \t\t\tmouse_buf_idx = 0;\n  140 | \t\t\treturn;\n  141 | \t\t}\n  142 | \t} else {\n  143 | \t\tif (mouse_buf_idx < 3)\n  144 | \t\t\treturn;\n  145 | \t}\n  146 | \n  147 | \t/* Common protocol */\n  148 | \tx_axis += mouse_buf[1] ? mouse_buf[1] - ((mouse_buf[0] << 4) & 0x100) : 0;\n  149 | \ty_axis += mouse_buf[2] ? ((mouse_buf[0] << 3) & 0x100) - mouse_buf[2] : 0;\n  150 | \tbuttons = mouse_buf[0] & 0x7;\n  151 | \n  152 | \t/* Extended protocol */\n  153 | \tif (is_intellimouse) {\n  154 | \t\tz_axis += (mouse_buf[3] & 0x7) - (mouse_buf[3] & 0x08) ? 8 : 0;\n  155 | \t} else if (is_explorer_intellimouse) {\n  156 | \t\tz_axis += (mouse_buf[3] & 0x7) - (mouse_buf[3] & 0x08) ? 8 : 0;\n  157 | \t\tbuttons = (mouse_buf[0] & 0x7) | (mouse_buf[3] & 0x30) >> 1;\n  158 | \t}\n  159 | \n  160 | \tmouse_buf_idx = 0;\n  161 | }","lines":37,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/mouse.c#L125-L161"}]},{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In nvram.c rtc_write_clock(), the 12-hour format encoding for midnight is wrong. The MC146818 datasheet specifies that in 12-hour mode, midnight is encoded as hour=12 with the PM bit (0x80) set. The write path (lines 191-194 and 205-209) uses (time->tm_hour > 12) as the condition to set the PM bit, so hour==0 (midnight) writes dec2bcd(0) or 0 with no PM flag. When read back by rtc_read_clock() (which correctly decodes MC146818 convention), midnight would be misinterpreted. The read path uses (reg8 & 0x80 ? +12 : 0) and % 24, so it correctly handles 12|0x80 = midnight, but the write does not produce that encoding.","fix":"For midnight (hour==0) in 12-hour mode, write 12 with the PM bit set. Change the condition to (time->tm_hour >= 12) and adjust the hour: int h12 = time->tm_hour % 12; if (h12 == 0) h12 = 12; reg8 = dec2bcd(h12) | (time->tm_hour >= 12 ? 0x80 : 0);","locations":[{"ref":"payloads/libpayload/drivers/nvram.c:190-197","code":"  190 | \t\tif (!(statusB & NVRAM_RTC_FORMAT_24HOUR)) {\n  191 | \t\t\tif (time->tm_hour > 12)\n  192 | \t\t\t\treg8 = dec2bcd(time->tm_hour - 12) | 0x80;\n  193 | \t\t\telse\n  194 | \t\t\t\treg8 = dec2bcd(time->tm_hour);\n  195 | \t\t} else {\n  196 | \t\t\treg8 = dec2bcd(time->tm_hour);\n  197 | \t\t}","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/nvram.c#L190-L197"},{"ref":"payloads/libpayload/drivers/nvram.c:205-212","code":"  205 | \t\tif (!(statusB & NVRAM_RTC_FORMAT_24HOUR)) {\n  206 | \t\t\tif (time->tm_hour > 12)\n  207 | \t\t\t\treg8 = (time->tm_hour - 12) | 0x80;\n  208 | \t\t\telse\n  209 | \t\t\t\treg8 = time->tm_hour;\n  210 | \t\t} else {\n  211 | \t\t\treg8 = time->tm_hour;\n  212 | \t\t}","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/nvram.c#L205-L212"}]},{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"lookup_cmos_entry() computes len = strnlen(name, CB_CMOS_MAX_NAME_LENGTH) and then uses memcmp(cmos_entry->name, name, len) to find the entry. This performs a prefix match: a search for 'foo' will match an entry named 'foobar' because memcmp only compares the first 3 bytes. Any option whose name is a prefix of another option's name will be incorrectly matched.","fix":"Compare exactly CB_CMOS_MAX_NAME_LENGTH bytes, or ensure the entry name is also null-terminated and use strncmp instead: if (strncmp((const char*)cmos_entry->name, name, CB_CMOS_MAX_NAME_LENGTH) == 0). The same issue exists in lookup_cmos_enum_core() with text/CB_CMOS_MAX_TEXT_LENGTH.","locations":[{"ref":"payloads/libpayload/drivers/options.c:157-172","code":"  157 | static struct cb_cmos_entries *lookup_cmos_entry(struct cb_cmos_option_table *option_table, const char *name)\n  158 | {\n  159 | \tstruct cb_cmos_entries *cmos_entry;\n  160 | \tint len = name ? strnlen(name, CB_CMOS_MAX_NAME_LENGTH) : 0;\n  161 | \n  162 | \t/* CMOS entries are located right after the option table */\n  163 | \tcmos_entry = first_cmos_entry(option_table);\n  164 | \twhile (cmos_entry) {\n  165 | \t\tif (memcmp((const char*)cmos_entry->name, name, len) == 0)\n  166 | \t\t\treturn cmos_entry;\n  167 | \t\tcmos_entry = next_cmos_entry(cmos_entry);\n  168 | \t}\n  169 | \n  170 | \tprintf(\"ERROR: No such CMOS option (%s)\\n\", name);\n  171 | \treturn NULL;\n  172 | }","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L157-L172"}]},{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"lookup_cmos_enum_core() also uses a prefix-only memcmp for the text/label comparison (line 248). A search for enum label 'on' will match 'once', 'only', etc. The same fix applies as for lookup_cmos_entry.","fix":"Use strncmp(cmos_enum->text, text, CB_CMOS_MAX_TEXT_LENGTH) == 0 instead of memcmp with the user-string length.","locations":[{"ref":"payloads/libpayload/drivers/options.c:248","code":"  248 | \t\t    ((text == NULL) || (memcmp((const char*)cmos_enum->text, text, len) == 0))) {","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L248"}]},{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In set_option_from_string() case 's', the buffer is allocated and strncpy'd using cmos_entry->length, which is measured in BITS, not bytes. For a 64-bit option field, this allocates 64 bytes and copies up to 64 characters, when only 8 bytes (64/8) are meaningful. The corresponding get path correctly converts bits to bytes with (cmos_entry->length+7)/8. The mismatch means the string option is allocated and filled with far more data than set_cmos_value will actually store (it only writes cmos_entry->length/8 bytes).","fix":"Use int byte_len = (cmos_entry->length + 7) / 8; for malloc and strncpy limit, matching the get path.","locations":[{"ref":"payloads/libpayload/drivers/options.c:362-366","code":"  362 | \t\t\traw = malloc(cmos_entry->length);\n  363 | \t\t\tif (!raw)\n  364 | \t\t\t\treturn 1;\n  365 | \t\t\tmemset(raw, 0x00, cmos_entry->length);\n  366 | \t\t\tstrncpy(raw, value, cmos_entry->length);","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L362-L366"}]},{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In pci_ops.c find_on_bus(), when a bridge is found, only the secondary bus number is extracted from REG_PRIMARY_BUS (bits 15:8). find_on_bus() is then called recursively on that secondary bus. This correctly recurses into downstream buses because each bridge found on any bus will itself be recursed into. However, there is no protection against bus-number cycles involving three or more buses: if bus A has a bridge to bus B, and bus B has a bridge back to bus A, the same-bus check (busses != bus) only prevents A->A or B->B directly; A->B->A->B... is an infinite recursion.","fix":"Add a visited-bus bitmask (256 bits = 32 bytes) to track buses already enumerated, and skip recursion into any already-visited bus.","locations":[{"ref":"payloads/libpayload/drivers/pci_ops.c:60-71","code":"   60 | \t\tif (hdr == HEADER_TYPE_BRIDGE || hdr == HEADER_TYPE_CARDBUS) {\n   61 | \t\t\tunsigned int busses;\n   62 | \t\t\tbusses = pci_read_config32(PCI_DEV(bus, slot, func),\n   63 | \t\t\t\t\t\t   REG_PRIMARY_BUS);\n   64 | \t\t\tbusses = (busses >> 8) & 0xFF;\n   65 | \n   66 | \t\t\t/* Avoid recursion if the new bus is the same as\n   67 | \t\t\t * the old bus (insert lame The Who joke here) */\n   68 | \n   69 | \t\t\tif ((busses != bus) &&\n   70 | \t\t\t    find_on_bus(busses, vid, did, dev))\n   71 | \t\t\t\treturn 1;","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/pci_ops.c#L60-L71"}]},{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `mmc_set_bus_width` the reference buffer `ext_csd` is declared but never populated (there is no `mmc_send_ext_csd(ctrlr, ext_csd)` call before the loop). The loop switches the bus width, re-reads the device EXT_CSD into `test_csd`, and then compares fields of `test_csd` against `ext_csd`. Since `ext_csd` holds uninitialized stack contents, the comparison at lines 370-380 (`ext_csd[EXT_CSD_PARTITIONING_SUPPORT] == test_csd[...]`, `memcmp(&ext_csd[EXT_CSD_SEC_CNT], &test_csd[EXT_CSD_SEC_CNT], 4)`, etc.) compares garbage. This is reachable for eMMC v4 cards on controllers without HS200/HS400 (the early `break` at line 356 is not taken), where it will typically make every width fail verification so the code falls through to `width == 0` and configures a 1-bit bus (`SET_BUS_WIDTH(ctrlr, 1)`), a large performance regression, and is undefined behavior (reading uninitialized memory). This is a porting regression from depthcharge, where `ext_csd` was read once before the loop.","fix":"Read the reference EXT_CSD into `ext_csd` before the width loop, e.g. after the buffer declarations add `err = mmc_send_ext_csd(ctrlr, ext_csd); if (err) return err;` so that the post-switch `test_csd` comparison validates against a known-good copy.","locations":[{"ref":"src/commonlib/storage/mmc.c:341-386","code":"  341 | int mmc_set_bus_width(struct storage_media *media)\n  342 | {\n  343 | \tstruct sd_mmc_ctrlr *ctrlr = media->ctrlr;\n  344 | \tint err;\n  345 | \tint width;\n  346 | \n  347 | \tALLOC_CACHE_ALIGN_BUFFER(unsigned char, ext_csd, EXT_CSD_SIZE);\n  348 | \tALLOC_CACHE_ALIGN_BUFFER(unsigned char, test_csd, EXT_CSD_SIZE);\n  349 | \n  350 | \t/* Set the bus width */\n  351 | \terr = 0;\n  352 | \tfor (width = EXT_CSD_BUS_WIDTH_8; width >= 0; width--) {\n  353 | \t\t/* If HS200 is switched, Bus Width has been 8-bit */\n  354 | \t\tif ((media->caps & DRVR_CAP_HS200) ||\n  355 | \t\t    (media->caps & DRVR_CAP_HS400))\n  356 | \t\t\tbreak;\n  357 | \n  358 | \t\t/* Set the card to use 4 bit*/\n  359 | \t\terr = mmc_switch(media, EXT_CSD_BUS_WIDTH, width);\n  360 | \t\tif (err)\n  361 | \t\t\tcontinue;\n  362 | \n  363 | \t\tif (!width) {\n  364 | \t\t\tSET_BUS_WIDTH(ctrlr, 1);\n  365 | \t\t\tbreak;\n  366 | \t\t}\n  367 | \t\tSET_BUS_WIDTH(ctrlr, 4 * width);\n  368 | \n  369 | \t\terr = mmc_send_ext_csd(ctrlr, test_csd);\n  370 | \t\tif (!err &&\n  371 | \t\t    (ext_csd[EXT_CSD_PARTITIONING_SUPPORT] ==\n  372 | \t\t    test_csd[EXT_CSD_PARTITIONING_SUPPORT]) &&\n  373 | \t\t    (ext_csd[EXT_CSD_ERASE_GROUP_DEF] ==\n  374 | \t\t    test_csd[EXT_CSD_ERASE_GROUP_DEF]) &&\n  375 | \t\t    (ext_csd[EXT_CSD_REV] ==\n  376 | \t\t    test_csd[EXT_CSD_REV]) &&\n  377 | \t\t    (ext_csd[EXT_CSD_HC_ERASE_GRP_SIZE] ==\n  378 | \t\t    test_csd[EXT_CSD_HC_ERASE_GRP_SIZE]) &&\n  379 | \t\t    memcmp(&ext_csd[EXT_CSD_SEC_CNT],\n  380 | \t\t\t   &test_csd[EXT_CSD_SEC_CNT], 4) == 0) {\n  381 | \t\t\tmedia->caps |= width;\n  382 | \t\t\tbreak;\n  383 | \t\t}\n  384 | \t}\n  385 | \treturn err;\n  386 | }","lines":46,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/storage/mmc.c#L341-L386"}]},{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`set_max_ratio()` computes `perf_ctl` in both branches but never writes it to the MSR - the `wrmsr(IA32_PERF_CTL, perf_ctl)` call is missing. This is a regression introduced by commit `763d31293f` (\"cpu/intel/model_206xx: Enable turbo mode on BSP\"), whose whole stated purpose is to make the BSP apply the max/turbo ratio after `BIOS_RESET_CPL`. The refactor accidentally dropped the `wrmsr` while restructuring the if/else, so `set_max_ratio()` now only prints a debug line and has no effect at all. The sibling functions `set_max_ratio()` in `model_206ax_init.c` (line 403) and `haswell_init.c` (line 467) both retain the `wrmsr(IA32_PERF_CTL, perf_ctl)`, confirming this is an omission. Impact: the BSP no longer gets its P-state/turbo ratio programmed during MP init, so Arrandale/Clarkdale boot at the lowest P-state until the OS reprograms it (slower payload/bootloader), defeating the commit.","fix":"Restore the missing MSR write after the if/else, matching the `model_206ax`/`haswell` versions.\n\nBefore:\n```c\n\t} else {\n\t\t/* Platform Info bits 15:8 give max ratio (no Turbo mode) */\n\t\tmsr = rdmsr(MSR_PLATFORM_INFO);\n\t\tperf_ctl.lo = msr.lo & 0xff00;\n\t}\n\n\tprintk(BIOS_DEBUG, \"model_x065x: frequency set to %d\\n\",\n```\nAfter:\n```c\n\t} else {\n\t\t/* Platform Info bits 15:8 give max ratio (no Turbo mode) */\n\t\tmsr = rdmsr(MSR_PLATFORM_INFO);\n\t\tperf_ctl.lo = msr.lo & 0xff00;\n\t}\n\twrmsr(IA32_PERF_CTL, perf_ctl);\n\n\tprintk(BIOS_DEBUG, \"model_x065x: frequency set to %d\\n\",\n```","locations":[{"ref":"src/cpu/intel/model_2065x/model_2065x_init.c:54-72","code":"   54 | static void set_max_ratio(void)\n   55 | {\n   56 | \tmsr_t msr, perf_ctl;\n   57 | \n   58 | \tperf_ctl.hi = 0;\n   59 | \n   60 | \t/* Check for configurable TDP option */\n   61 | \tif (get_turbo_state() == TURBO_ENABLED) {\n   62 | \t\tmsr = rdmsr(MSR_TURBO_RATIO_LIMIT);\n   63 | \t\tperf_ctl.lo = (msr.lo & 0xff) << 8;\n   64 | \t} else {\n   65 | \t\t/* Platform Info bits 15:8 give max ratio (no Turbo mode) */\n   66 | \t\tmsr = rdmsr(MSR_PLATFORM_INFO);\n   67 | \t\tperf_ctl.lo = msr.lo & 0xff00;\n   68 | \t}\n   69 | \n   70 | \tprintk(BIOS_DEBUG, \"model_x065x: frequency set to %d\\n\",\n   71 | \t       ((perf_ctl.lo >> 8) & 0xff) * IRONLAKE_BCLK);\n   72 | }","lines":19,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/model_2065x/model_2065x_init.c#L54-L72"}]},{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `coalesce_capsules()` the chunk length is computed as `2 * MiB - (addr % 2 * MiB)`. Because `%` and `*` have equal precedence and associate left-to-right, this parses as `2 * MiB - ((addr % 2) * MiB)`, i.e. it depends only on whether `addr` is odd or even, not on the offset within the 2 MiB mapping window. The intent (matching `map_range()`, which maps a 2 MiB window aligned down to `ALIGN_DOWN(base, 2 * MiB)`) is the bytes remaining in the current window: `2 * MiB - (addr % (2 * MiB))`. With the buggy form, when `addr` is even but not 2 MiB-aligned (e.g. `addr = 0x300000`, `data_left >= 2 * MiB`), `piece_len` becomes up to `2 * MiB` while the real window has fewer bytes available; the subsequent `map_range(addr, piece_len)` then hits `base - aligned_base + len > 2 * MiB` and calls `die()`, aborting capsule processing (or copies a wrong-sized chunk). This is on the UEFI capsule-update coalescing path.","fix":"Add explicit parentheses so the modulo uses the full window size.\n```c\n// before\nuint64_t piece_len = MIN(data_left, 2 * MiB - (addr % 2 * MiB));\n// after\nuint64_t piece_len = MIN(data_left, 2 * MiB - (addr % (2 * MiB)));\n```","locations":[{"ref":"src/drivers/efi/capsules.c:624","code":"  624 | \t\t\tuint64_t piece_len = MIN(data_left, 2 * MiB - (addr % 2 * MiB));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/efi/capsules.c#L624"}]},{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `gsmi_exec()` the `GSMI_CMD_SET_EVENT_LOG` input-validation guard is logically inverted. The comment says \"Make sure the input is usable\", so the code should `break` (reject) when the input is malformed, i.e. when `sel->type != 1` OR `sel->data_ptr == 0` OR `sel->data_len` does not match. Instead it uses `&&` and `sel->data_ptr != 0`, so the `break` only fires when all three are simultaneously true, which essentially never happens for real inputs. As a result `sel->data_len` is never actually validated: an SMI caller can supply `sel->type == 1` with a `data_len` smaller than `sizeof(struct gsmi_set_eventlog_type1)`, and the handler will still dereference `type1->type`/`type1->instance` (reading past the caller-supplied buffer inside SMM). The De Morgan negation was applied to the operands but not to the connective.","fix":"Reject unusable input with OR logic and a null check:\n```c\n/* Make sure the input is usable */\nif (sel->type != 1 || sel->data_ptr == 0 ||\n    sel->data_len != sizeof(struct gsmi_set_eventlog_type1))\n\tbreak;\n```\n(before: `if (sel->type != 1 && sel->data_ptr != 0 && sel->data_len != sizeof(struct gsmi_set_eventlog_type1))`)","locations":[{"ref":"src/drivers/elog/gsmi.c:67-70","code":"   67 | \t\t/* Make sure the input is usable */\n   68 | \t\tif (sel->type != 1 && sel->data_ptr != 0 &&\n   69 | \t\t    sel->data_len != sizeof(struct gsmi_set_eventlog_type1))\n   70 | \t\t\tbreak;","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/elog/gsmi.c#L67-L70"}]},{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `rtc_set_time_date()` the values placed into the `struct rtc_time time` are already BCD-encoded (or pre-converted), but `rv3028c7_rtc_set()` then applies `bin2bcd()` to every field again, producing a double/garbled conversion and writing a wrong date to the RTC. In the user-date branch, `time.mday = bin2bcd(config->user_day)` etc. store BCD, while `rv3028c7_rtc_set()` does `bin2bcd(time->mday)` a second time; note `time.wday = config->user_weekday` is NOT pre-converted, an internal inconsistency proving the bug. In the build-date branch, `coreboot_build_date` fields are already BCD (`struct bcd_date`, cf. `pcf8523`/`rx6110sa` which write them raw), yet they are fed through `bin2bcd()` in `rv3028c7_rtc_set()`. `rv3028c7_rtc_get()` correctly treats registers as BCD (`bcd2bin`), confirming `rtc_time` should hold plain binary. Result: after a power-loss (`PORF_BIT`) event the RTC is programmed with an incorrect date/time.","fix":"Populate `time` with plain binary values so the single `bin2bcd()` in `rv3028c7_rtc_set()` is correct. For the user branch drop the pre-conversion (`time.mday = config->user_day; time.mon = config->user_month; time.year = config->user_year;`). For the build-date branch convert BCD to binary first (`time.wday = bcd2bin(coreboot_build_date.weekday); time.mday = bcd2bin(coreboot_build_date.day); time.mon = bcd2bin(coreboot_build_date.month); time.year = bcd2bin(coreboot_build_date.year);`).","locations":[{"ref":"src/drivers/i2c/rv3028c7/rv3028c7.c:114-141","code":"  114 | static void rtc_set_time_date(struct device *dev)\n  115 | {\n  116 | \tstruct drivers_i2c_rv3028c7_config *config = dev->chip_info;\n  117 | \tstruct rtc_time time;\n  118 | \n  119 | \t/* Whenever a new date is set, the time is set to 00:00:00. */\n  120 | \ttime.sec = 0;\n  121 | \ttime.min = 0;\n  122 | \ttime.hour = 0;\n  123 | \tif (config->set_user_date) {\n  124 | \t\ttime.wday = config->user_weekday;\n  125 | \t\ttime.mday = bin2bcd(config->user_day);\n  126 | \t\ttime.mon = bin2bcd(config->user_month);\n  127 | \t\ttime.year = bin2bcd(config->user_year);\n  128 | \t\tprintk(BIOS_DEBUG, \"%s: Use user date.\\n\", dev->chip_ops->name);\n  129 | \t} else {\n  130 | \t\ttime.wday = coreboot_build_date.weekday;\n  131 | \t\ttime.mday = coreboot_build_date.day;\n  132 | \t\ttime.mon = coreboot_build_date.month;\n  133 | \t\ttime.year = coreboot_build_date.year;\n  134 | \t\tprintk(BIOS_DEBUG, \"%s: Use coreboot build date.\\n\", dev->chip_ops->name);\n  135 | \t}\n  136 | \tif (rv3028c7_rtc_set(dev, &time) != 0) {\n  137 | \t\tprintk(BIOS_ERR, \"%s: Not able to set date and time!\\n\", dev->chip_ops->name);\n  138 | \t} else {\n  139 | \t\tprintk(BIOS_NOTICE, \"%s: Date and time set.\\n\", dev->chip_ops->name);\n  140 | \t}\n  141 | }","lines":28,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/i2c/rv3028c7/rv3028c7.c#L114-L141"},{"ref":"src/drivers/i2c/rv3028c7/rv3028c7.c:67-87","code":"   67 | static int rv3028c7_rtc_set(struct device *dev, struct rtc_time *time)\n   68 | {\n   69 | \tconst uint8_t buf[7] = {\n   70 | \t\tbin2bcd(time->sec),\n   71 | \t\tbin2bcd(time->min),\n   72 | \t\tbin2bcd(time->hour),\n   73 | \t\tbin2bcd(time->wday),\n   74 | \t\tbin2bcd(time->mday),\n   75 | \t\tbin2bcd(time->mon),\n   76 | \t\tbin2bcd(time->year % 100)\n   77 | \t};\n   78 | \n   79 | \tfor (size_t i = 0; i < ARRAY_SIZE(buf); i++) {\n   80 | \t\tif (i2c_dev_writeb_at(dev, i, buf[i]) < 0) {\n   81 | \t\t\tprintk(BIOS_ERR, \"%s: Failed to write register 0x%02zx!\\n\",\n   82 | \t\t\t\tdev->chip_ops->name, i);\n   83 | \t\t\treturn 1;\n   84 | \t\t}\n   85 | \t}\n   86 | \treturn 0;\n   87 | }","lines":21,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/i2c/rv3028c7/rv3028c7.c#L67-L87"}]},{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `mp_startup_this_ap()` the bounds check uses `>` instead of `>=`, an off-by-one that fails to reject `processor_number == get_cpu_count()`. Valid processor indices are `0 .. get_cpu_count()-1`, so a request for index `get_cpu_count()` (which the FSP is allowed to make through the MP Services PPI) passes validation and is forwarded to `mp_run_on_aps()` as an out-of-range logical CPU number. Note the sibling function `mp_get_processor_info()` correctly uses `>=` (`processor_number >= MIN(get_cpu_count(), CONFIG_MAX_CPUS)`), confirming the intended semantics.","fix":"Change the comparison to `>=`:\n\nBefore:\n```c\n\tif (processor_number > get_cpu_count())\n\t\treturn FSP_NOT_FOUND;\n```\nAfter:\n```c\n\tif (processor_number >= get_cpu_count())\n\t\treturn FSP_NOT_FOUND;\n```","locations":[{"ref":"src/drivers/intel/fsp2_0/ppi/mp_service_ppi.c:165-166","code":"  165 | \tif (processor_number > get_cpu_count())\n  166 | \t\treturn FSP_NOT_FOUND;","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/ppi/mp_service_ppi.c#L165-L166"}]},{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `do_silicon_init()` a temporary write-combining MTRR is reserved via `temp_mtrr_index = soc_mark_gfx_memory()` whenever `CONFIG(BMP_LOGO) && CONFIG(USE_COREBOOT_FOR_BMP_RENDERING)` is set (lines 128-129), regardless of FSP version. However the matching cleanup `clear_var_mtrr(temp_mtrr_index)` only runs inside the FSP 2.2 multi-phase block (lines 238-241). For platforms that are NOT `PLATFORM_USES_FSP2_2`, the function returns early at line 180 (`if (!CONFIG(PLATFORM_USES_FSP2_2)) return;`) after rendering the logo at lines 165-173, so the temporary WC MTRR is never released. This leaks a variable MTRR and leaves a write-combining memory type covering graphics memory in effect for the rest of boot, which can corrupt the effective caching type of that region and exhaust the limited variable-MTRR pool.","fix":"Move the MTRR cleanup out of the FSP-2.2-only block so it runs on every path where `temp_mtrr_index` may have been set. For example, in the pre-2.2 logo block (after line 172) also add:\n```c\nif (CONFIG(USE_COREBOOT_FOR_BMP_RENDERING) && temp_mtrr_index >= 0)\n\tclear_var_mtrr(temp_mtrr_index);\n```\nor better, clear the temp MTRR once near the end of `do_silicon_init()` regardless of FSP version before any `return`.","locations":[{"ref":"src/drivers/intel/fsp2_0/silicon_init.c:128-129","code":"  128 | \tif (CONFIG(BMP_LOGO) && CONFIG(USE_COREBOOT_FOR_BMP_RENDERING))\n  129 | \t\ttemp_mtrr_index = soc_mark_gfx_memory();","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/silicon_init.c#L128-L129"},{"ref":"src/drivers/intel/fsp2_0/silicon_init.c:164-180","code":"  164 | \t/* Only applies for SoC platforms prior to FSP 2.2 specification. */\n  165 | \tif (!CONFIG(PLATFORM_USES_FSP2_2) && CONFIG(BMP_LOGO)) {\n  166 | \t\tif (CONFIG(USE_COREBOOT_FOR_BMP_RENDERING))\n  167 | \t\t\tsoc_load_logo_by_coreboot();\n  168 | \t\t/*\n  169 | \t\t * This applies regardless of whether FSP or coreboot handled\n  170 | \t\t * the rendering.\n  171 | \t\t */\n  172 | \t\ttimestamp_add_now(TS_FIRMWARE_SPLASH_RENDERED);\n  173 | \t}\n  174 | \n  175 | \t/* Reinitialize CPUs if FSP-S has done MP Init */\n  176 | \tif (CONFIG(USE_INTEL_FSP_MP_INIT) && !fsp_is_multi_phase_init_enabled())\n  177 | \t\tdo_mpinit_after_fsp();\n  178 | \n  179 | \tif (!CONFIG(PLATFORM_USES_FSP2_2))\n  180 | \t\treturn;","lines":17,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/silicon_init.c#L164-L180"},{"ref":"src/drivers/intel/fsp2_0/silicon_init.c:238-241","code":"  238 | \t\t/* Clear temporary Write Combine (WC) MTRR */\n  239 | \t\tif (temp_mtrr_index >= 0)\n  240 | \t\t\tclear_var_mtrr(temp_mtrr_index);\n  241 | \t}","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/silicon_init.c#L238-L241"}]},{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In both bootlog_module_handle() and timestamps_module_handle(), the KEY_NPAGE and KEY_PPAGE cases have swapped comments. KEY_NPAGE is labeled 'Page up' but actually moves the cursor forward (increasing g_line), and KEY_PPAGE is labeled 'Page down' but decreases g_line. In ncurses, KEY_NPAGE is Next Page (Page Down) and KEY_PPAGE is Previous Page (Page Up), so the behavior is correct but the comments are backwards.","fix":"Swap the comments: KEY_NPAGE should be labeled 'Page down' and KEY_PPAGE should be labeled 'Page up'.","locations":[{"ref":"payloads/coreinfo/bootlog_module.c:190-194","code":"  190 | \tcase KEY_NPAGE: /* Page up */\n  191 | \t\tg_line -= LINES_SHOWN;\n  192 | \t\tbreak;\n  193 | \tcase KEY_PPAGE: /* Page down */\n  194 | \t\tg_line += LINES_SHOWN;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/bootlog_module.c#L190-L194"},{"ref":"payloads/coreinfo/timestamps_module.c:252-256","code":"  252 | \tcase KEY_NPAGE: /* Page up */\n  253 | \t\tg_line -= LINES_SHOWN;\n  254 | \t\tbreak;\n  255 | \tcase KEY_PPAGE: /* Page down */\n  256 | \t\tg_line += LINES_SHOWN;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/timestamps_module.c#L252-L256"}]},{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In cbfs_module_redraw(), when a file has an empty filename (strlen == 0), the code calls findfile(filenames[i])->type without checking if findfile returns NULL. Since CBFS is traversed from the beginning each call, findfile() on an empty string could return NULL if the CBFS structure is inconsistent or the file was logically deleted between calls. The NULL dereference causes a crash.","fix":"Check the findfile return value before dereferencing: struct cbfile *cf = findfile(filenames[i]); if (cf && cf->type == COMPONENT_NULL) ... else if (cf) ... else ...","locations":[{"ref":"payloads/coreinfo/cbfs_module.c:137-141","code":"  137 | \t\tif (strlen(filenames[i]) == 0) {\n  138 | \t\t\tif (findfile(filenames[i])->type == COMPONENT_NULL)\n  139 | \t\t\t\tmvwprintw(win, row, 1, \"<free space>\");\n  140 | \t\t\telse\n  141 | \t\t\t\tmvwprintw(win, row, 1, \"<unnamed>\");","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/cbfs_module.c#L137-L141"}]},{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In curses.h, BUTTON1_TRIPLE_CLICKED (0x00000010L) and BUTTON1_MOVED (0x00000010L) share the same numeric value, and similarly for buttons 2 (0x200) and 3 (0x4000). Code testing these values cannot distinguish between a triple-click and a move event for any button.","fix":"Assign BUTTON1_MOVED (and equivalents for buttons 2 and 3) a distinct bit value not already used by TRIPLE_CLICKED. This matches the comment that describes MOVED as a PDCurses extension.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/curses.h:159-174","code":"  159 | #define BUTTON1_TRIPLE_CLICKED  0x00000010L\n  160 | #define BUTTON1_MOVED           0x00000010L /* PDCurses */\n  161 | \n  162 | #define BUTTON2_RELEASED        0x00000020L\n  163 | #define BUTTON2_PRESSED         0x00000040L\n  164 | #define BUTTON2_CLICKED         0x00000080L\n  165 | #define BUTTON2_DOUBLE_CLICKED  0x00000100L\n  166 | #define BUTTON2_TRIPLE_CLICKED  0x00000200L\n  167 | #define BUTTON2_MOVED           0x00000200L /* PDCurses */\n  168 | \n  169 | #define BUTTON3_RELEASED        0x00000400L\n  170 | #define BUTTON3_PRESSED         0x00000800L\n  171 | #define BUTTON3_CLICKED         0x00001000L\n  172 | #define BUTTON3_DOUBLE_CLICKED  0x00002000L\n  173 | #define BUTTON3_TRIPLE_CLICKED  0x00004000L\n  174 | #define BUTTON3_MOVED           0x00004000L /* PDCurses */","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/curses.h#L159-L174"}]},{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In firework.c main(), the draw loop writes mvaddstr(LINES - row, ...) starting with row == 0 on the first iteration, which evaluates to row LINES. Curses rows are 0-indexed (valid range 0..LINES-1), so LINES is out of range. This typically causes the string to be silently discarded (the curses clipping) but the trajectory is drawn one row off: the rocket base appears off-screen on the first step.","fix":"Start the drawing at LINES - 1 - row: mvaddstr(LINES - 1 - row, row * direction + start, ...);","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/firework.c:59-70","code":"   59 |         for (row = 0; row < diff; row++)\n   60 |         {\n   61 |             mvaddstr(LINES - row, row * direction + start,\n   62 |                 (direction < 0) ? \"\\\\\" : \"/\");\n   63 | \n   64 |             if (flag++)\n   65 |             {\n   66 |                 myrefresh();\n   67 |                 erase();\n   68 |                 flag = 0;\n   69 |             }\n   70 |         }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/firework.c#L59-L70"}]},{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In newdemo.c WaitForUser(), nodelay() is called twice in succession with opposite values (TRUE then FALSE) without a matching getch() in between. halfdelay(50) sets a half-second timeout, but then nodelay(FALSE) immediately overrides it, so the half-delay has no effect. This is dead/redundant setup code that makes the timing behavior hard to reason about.","fix":"Remove the initial nodelay(stdscr, TRUE) call since halfdelay(50) is what provides the intended timeout behavior.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/newdemo.c:57-66","code":"   57 | \n   58 |     nodelay(stdscr, TRUE);\n   59 |     halfdelay(50);\n   60 | \n   61 |     ch = getch();\n   62 | \n   63 |     nodelay(stdscr, FALSE);\n   64 |     nocbreak();     /* Reset the halfdelay() value */\n   65 |     cbreak();\n   66 | ","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/newdemo.c#L57-L66"}]},{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In tui.c padstr(), the fmt[] buffer is only 10 bytes. The format pattern written into it is '%%-%ds' (with sprintf expanding %d to the decimal representation of length). If length has more than 4 digits (i.e., >= 10000), the resulting format string exceeds 9 characters plus null terminator, overflowing fmt[10]. While COLS >= 10000 is unrealistic today, it is an unbounded assumption with no assertion.","fix":"Increase fmt[] to at least 20 bytes to accommodate any plausible column width, or use snprintf with the correct size.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/tui.c:73-75","code":"   73 |     char fmt[10];\n   74 | \n   75 |     sprintf(fmt, (int)strlen(s) > length ? \"%%.%ds\" : \"%%-%ds\", length);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/tui.c#L73-L75"}]},{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In tuidemo.c showfile(), EOF detection relies on strlen(buf) == 0 after fgets(). This works correctly because buf[0] is set to '\\0' before each fgets call, but a read error (ferror) is indistinguishable from EOF: both leave buf[0] == '\\0', so an I/O error causes silent termination of the display rather than an error message.","fix":"Check the return value of fgets directly: if (!fgets(buf, MAXSTRLEN, fp)) { ateof = TRUE; } instead of relying on strlen(buf) == 0.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/tuidemo.c:92-99","code":"   92 |                 buf[0] = '\\0';\n   93 |                 fgets(buf, MAXSTRLEN, fp);\n   94 | \n   95 |                 if (strlen(buf))\n   96 |                     bodymsg(buf);\n   97 |                 else\n   98 |                     ateof = TRUE;\n   99 |             }","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/tuidemo.c#L92-L99"}]},{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In border.c, wborder() does not check for a window that is too small (maxy < 1 or maxx < 1). If the window has height 1 or width 1, ymax=0 and xmax=0. The horizontal loop 'for (i = 1; i < xmax; i++)' runs 0 times (fine), but the corner assignments write to _y[0][0] and _y[0][xmax] which are the same cell (_y[0][0]) -- it gets written twice (tl, then br), leaving br in that cell. Similarly _y[ymax][0] and _y[ymax][xmax] are the same. This produces a visually garbled single-cell 'border'.","fix":"Add a check at the start of wborder(): if the window is too small (maxy < 2 or maxx < 2), return ERR.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/border.c:131-179","code":"  131 | int wborder(WINDOW *win, chtype ls, chtype rs, chtype ts, chtype bs,\n  132 |             chtype tl, chtype tr, chtype bl, chtype br)\n  133 | {\n  134 |     int i, ymax, xmax;\n  135 | \n  136 |     PDC_LOG((\"wborder() - called\\n\"));\n  137 | \n  138 |     if (!win)\n  139 |         return ERR;\n  140 | \n  141 |     ymax = win->_maxy - 1;\n  142 |     xmax = win->_maxx - 1;\n  143 | \n  144 |     ls = _attr_passthru(win, ls ? ls : ACS_VLINE);\n  145 |     rs = _attr_passthru(win, rs ? rs : ACS_VLINE);\n  146 |     ts = _attr_passthru(win, ts ? ts : ACS_HLINE);\n  147 |     bs = _attr_passthru(win, bs ? bs : ACS_HLINE);\n  148 |     tl = _attr_passthru(win, tl ? tl : ACS_ULCORNER);\n  149 |     tr = _attr_passthru(win, tr ? tr : ACS_URCORNER);\n  150 |     bl = _attr_passthru(win, bl ? bl : ACS_LLCORNER);\n  151 |     br = _attr_passthru(win, br ? br : ACS_LRCORNER);\n  152 | \n  153 |     for (i = 1; i < xmax; i++)\n  154 |     {\n  155 |         win->_y[0][i] = ts;\n  156 |         win->_y[ymax][i] = bs;\n  157 |     }\n  158 | \n  159 |     for (i = 1; i < ymax; i++)\n  160 |     {\n  161 |         win->_y[i][0] = ls;\n  162 |         win->_y[i][xmax] = rs;\n  163 |     }\n  164 | \n  165 |     win->_y[0][0] = tl;\n  166 |     win->_y[0][xmax] = tr;\n  167 |     win->_y[ymax][0] = bl;\n  168 |     win->_y[ymax][xmax] = br;\n  169 | \n  170 |     for (i = 0; i <= ymax; i++)\n  171 |     {\n  172 |         win->_firstch[i] = 0;\n  173 |         win->_lastch[i] = xmax;\n  174 |     }\n  175 | \n  176 |     PDC_sync(win);\n  177 | \n  178 |     return OK;\n  179 | }","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/border.c#L131-L179"}]},{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In debug.c, the debug log timestamp uses 'localtime(&now)' which returns a pointer to a static buffer. If the code is ever used in a multi-threaded environment, concurrent PDC_debug() calls could corrupt each other's time strings. Additionally, the strftime format '\"At: %8.8ld - %s \"' intermixes a long (%ld, the clock value) with %s (the time string) but the format literal '\"At: %8.8ld - %s \"' is passed to fprintf as a fixed string with arguments in order, so there is no format mismatch. Still, the buffer size for hms is exactly 9 -- strftime with format '%H:%M:%S' produces exactly 8 chars + NUL, so this is correct but very tight with no margin for locale-specific differences.","fix":"Use localtime_r() in threaded environments. Increase hms buffer size for safety.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/debug.c:57-60","code":"   57 | \n   58 |     time(&now);\n   59 |     strftime(hms, 9, \"%H:%M:%S\", localtime(&now));\n   60 |     fprintf(dbfp, \"At: %8.8ld - %s \", (long) clock(), hms);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/debug.c#L57-L60"}]},{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In getch.c, when buffering input (nocbreak/noraw mode), the backspace handler at line 276 decrements c_pindex below c_gindex without checking this bound: 'if (c_pindex > c_gindex) c_pindex--'. If c_gindex is 0 and c_pindex is 0 (equal), the backspace is silently discarded. But if multiple backspaces are pressed rapidly, c_pindex could theoretically reach 0 then be prevented from going negative by the guard -- this is correct. However after flushinp() sets c_gindex=1 and c_pindex=0, a subsequent backspace with c_pindex(0) <= c_gindex(1) is silently discarded even if there are notional characters, because the buffer is in an inconsistent state after flushinp().","fix":"After flushinp(), reset c_gindex to 0 (not 1) to be consistent with c_pindex=0, or ensure flushinp() leaves indices in a mutually consistent state.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getch.c:275-279","code":"  275 |         if (key == '\\b')\n  276 |         {\n  277 |             if (c_pindex > c_gindex)\n  278 |                 c_pindex--;\n  279 |         }","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getch.c#L275-L279"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getch.c:323-334","code":"  323 | int flushinp(void)\n  324 | {\n  325 |     PDC_LOG((\"flushinp() - called\\n\"));\n  326 | \n  327 |     PDC_flushinp();\n  328 | \n  329 |     c_gindex = 1;           /* set indices to kill buffer */\n  330 |     c_pindex = 0;\n  331 |     c_ungind = 0;           /* clear c_ungch array */\n  332 | \n  333 |     return OK;\n  334 | }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getch.c#L323-L334"}]},{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In setsyx() (getyx.c, lines 138-141), when exactly one of y or x equals -1 (but not both), the function silently returns OK without doing anything. This differs from the documented behavior: setsyx(-1,-1) should set leaveit=TRUE; setsyx(y,x) should move the cursor. Having only one coordinate be -1 is an error condition that the function silently ignores instead of returning ERR.","fix":"Return ERR when exactly one of y/x is -1, or document the current behavior explicitly.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getyx.c:138-141","code":"  138 |     else if (y == -1 || x == -1)\n  139 |     {\n  140 |         return OK;\n  141 |     }","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getyx.c#L138-L141"}]},{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In inopts.c, the wtimeout() function has a commented-out line '/*win->_nodelay = TRUE;*/' (line 297) in the positive-delay branch. According to curses semantics, a positive delay should set the window into a timed blocking read, which requires nodelay to be FALSE (block until timeout). The comment suggests an earlier implementation tried setting nodelay=TRUE here. The current code leaves nodelay unchanged (whatever it was before wtimeout() was called), which may leave a previously-set nodelay=TRUE active when a positive delay is requested, causing wgetch() to return ERR immediately instead of waiting.","fix":"Explicitly set 'win->_nodelay = FALSE;' in the positive-delay branch so that wgetch() will block for _delayms milliseconds rather than returning immediately.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/inopts.c:291-299","code":"  291 |     else\n  292 |     {\n  293 |         /* This causes the read on the window to delay for the number of\n  294 |            milliseconds. Also forces the window into non-blocking read\n  295 |            mode */\n  296 | \n  297 |         /*win->_nodelay = TRUE;*/\n  298 |         win->_delayms = delay;\n  299 |     }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/inopts.c#L291-L299"}]},{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In outopts.c, wsetscrreg() validates the scroll region with the condition 'top <= win->_cury && win->_cury <= bottom' (line 125-126). This ties setting the scroll region to the current cursor position -- you cannot set a scroll region that does not contain the current cursor. The X/Open specification for wsetscrreg() says only that top and bottom must be within the window boundaries; it does not require the cursor to be within the region. This overly restrictive check will return ERR unexpectedly.","fix":"Remove the cursor position checks. The condition should be: 'win && 0 <= top && top <= bottom && bottom < win->_maxy'.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/outopts.c:121-135","code":"  121 | int wsetscrreg(WINDOW *win, int top, int bottom)\n  122 | {\n  123 |     PDC_LOG((\"wsetscrreg() - called: top %d bottom %d\\n\", top, bottom));\n  124 | \n  125 |     if (win && 0 <= top && top <= win->_cury &&\n  126 |         win->_cury <= bottom && bottom < win->_maxy)\n  127 |     {\n  128 |         win->_tmarg = top;\n  129 |         win->_bmarg = bottom;\n  130 | \n  131 |         return OK;\n  132 |     }\n  133 |     else\n  134 |         return ERR;\n  135 | }","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/outopts.c#L121-L135"}]},{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"_copy_win() in overlay.c does not reset the 'lc' (last-changed column) variable between row iterations. 'lc' is initialized to 0 before the outer loop and is only updated inside the inner loop when a character actually changes. If row N has changes (setting lc) and row N+1 has no changes (fc == _NO_CHANGE), the branch 'if (*minchng == _NO_CHANGE) { *minchng = fc; *maxchng = lc; }' writes the stale lc from row N into maxchng[N+1]. Since minchng[N+1] remains _NO_CHANGE, the refresh code will skip this row anyway, so there is no visual corruption, but the state is inconsistent and wastes effort if the row later becomes dirty.","fix":"Reset 'lc' at the start of each row iteration (alongside 'fc = _NO_CHANGE') so its value is never carried over between rows: add 'lc = _NO_CHANGE;' at line 77 (same place as 'fc = _NO_CHANGE;'). Adjust the maxchng update logic accordingly.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/overlay.c:56-113","code":"   56 |     int lc = 0;\n   57 |     int xdiff = src_bc - src_tc;\n   58 |     int ydiff = src_br - src_tr;\n   59 | \n   60 |     if (!src_w || !dst_w)\n   61 |         return ERR;\n   62 | \n   63 |     minchng = dst_w->_firstch;\n   64 |     maxchng = dst_w->_lastch;\n   65 | \n   66 |     for (y1 = 0; y1 < dst_tr; y1++)\n   67 |     {\n   68 |         minchng++;\n   69 |         maxchng++;\n   70 |     }\n   71 | \n   72 |     for (line = 0; line < ydiff; line++)\n   73 |     {\n   74 |         w1ptr = src_w->_y[line + src_tr] + src_tc;\n   75 |         w2ptr = dst_w->_y[line + dst_tr] + dst_tc;\n   76 | \n   77 |         fc = _NO_CHANGE;\n   78 | \n   79 |         for (col = 0; col < xdiff; col++)\n   80 |         {\n   81 |             if ((*w1ptr) != (*w2ptr) &&\n   82 |                 !((*w1ptr & A_CHARTEXT) == ' ' && _overlay))\n   83 |             {\n   84 |                 *w2ptr = *w1ptr;\n   85 | \n   86 |                 if (fc == _NO_CHANGE)\n   87 |                     fc = col + dst_tc;\n   88 | \n   89 |                 lc = col + dst_tc;\n   90 |             }\n   91 | \n   92 |             w1ptr++;\n   93 |             w2ptr++;\n   94 |         }\n   95 | \n   96 |         if (*minchng == _NO_CHANGE)\n   97 |         {\n   98 |             *minchng = fc;\n   99 |             *maxchng = lc;\n  100 |         }\n  101 |         else if (fc != _NO_CHANGE)\n  102 |         {\n  103 |             if (fc < *minchng)\n  104 |                 *minchng = fc;\n  105 |             if (lc > *maxchng)\n  106 |                 *maxchng = lc;\n  107 |         }\n  108 | \n  109 |         minchng++;\n  110 |         maxchng++;\n  111 |     }\n  112 | \n  113 |     return OK;","lines":58,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/overlay.c#L56-L113"}]},{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In sdl1/pdcclip.c PDC_setclipboard(), contents is copied with strcpy() (line\n86) using a buffer allocated to `length + 1` bytes, where `length` is caller-supplied. If the\nactual string length of `contents` is greater than `length` (caller passes a shorter length than\nthe string), strcpy copies beyond the allocation, overflowing the heap buffer.","fix":"Use `memcpy(pdc_SDL_clipboard, contents, length); pdc_SDL_clipboard[length] = '\\0';`\ninstead of strcpy, which respects the caller-supplied length.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c:71-89","code":"   71 | int PDC_setclipboard(const char *contents, long length)\n   72 | {\n   73 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n   74 | \n   75 |     if (pdc_SDL_clipboard)\n   76 |     {\n   77 |         free(pdc_SDL_clipboard);\n   78 |         pdc_SDL_clipboard = NULL;\n   79 |     }\n   80 | \n   81 |     if (contents)\n   82 |     {\n   83 |         if ((pdc_SDL_clipboard = malloc(length + 1)) == NULL)\n   84 |             return PDC_CLIP_MEMORY_ERROR;\n   85 | \n   86 |         strcpy(pdc_SDL_clipboard, contents);\n   87 |     }\n   88 | \n   89 |     return PDC_CLIP_SUCCESS;","lines":19,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c#L71-L89"}]},{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`init_pair()` rejects `index == 0` (returns ERR), but `pair_content()` allows\n`index == 0` (only rejects `index < 0`). The color_pairs[0] entry is initialized\nto `0x07` (white-on-black default pair). This inconsistency means the default\npair (index 0) can be read but not written, which is intentional per POSIX, but\nthe divergent guard conditions (`index == 0 || index > 255` vs `index < 0 ||\nindex > 255`) make the intent invisible and fragile. A future maintainer adding\nnegative-index handling to `init_pair` might accidentally align it with\n`pair_content`'s check and silently allow writes to pair 0.","fix":"Add a comment to both functions explaining why the index==0 treatment differs, or use a shared inline helper that encodes the policy explicitly.","locations":[{"ref":"payloads/libpayload/curses/colors.c:45-46","code":"   45 | \tif (index == 0 || index > 255)\n   46 | \t\treturn ERR;","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/colors.c#L45-L46"},{"ref":"payloads/libpayload/curses/colors.c:54-55","code":"   54 | \tif (index < 0 || index > 255)\n   55 | \t\treturn ERR;","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/colors.c#L54-L55"}]},{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In data_ahead (frm_data.c), when checking for off-screen data in a multi-line field, the window position passed to wmove uses 'pos' as the row but pos is an absolute buffer row index, not a window-relative row. After pos exceeds field->rows (the visible window height), wmove will fail and Only_Padding will treat the ERR result as 'no data found' (returns TRUE), causing data_ahead to underreport off-screen content for fields taller than their visible area.","fix":"When form->w is a pad (scrollable multi-line field), wmove coordinates must be relative to the pad's total size, which they are since form->w is allocated as newpad(drows, dcols). Verify that the pad is large enough for the absolute row 'pos'; if form->w is a derived window instead, the row must be adjusted by subtracting form->toprow.","locations":[{"ref":"payloads/libpayload/curses/form/frm_data.c:173-184","code":"  173 | \t  pos = form->toprow + field->rows;\n  174 | \t  while (pos < field->drows)\n  175 | \t    {\n  176 | \t      cursor_moved = TRUE;\n  177 | \t      wmove(form->w, pos, 0);\n  178 | \t      pos++;\n  179 | \t      if (!Only_Padding(form->w, field->cols, field->pad))\n  180 | \t\t{\n  181 | \t\t  result = TRUE;\n  182 | \t\t  break;\n  183 | \t\t}\n  184 | \t    }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_data.c#L173-L184"}]},{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"_nc_First_Active_Field (frm_driver.c) falls back to returning *first (the pmin field) when no visible field is found on the page. However, the variable 'first' points to form->field[pmin], which is a pointer into the field pointer array; the dereference (*first) is correct. But the function comment says it 'hopes the best', meaning the returned field may be invisible and non-selectable. Callers such as Associate_Fields call form_driver(form, FIRST_ACTIVE_MAGIC) which assigns this potentially invisible field as form->current without further validation, allowing subsequent driver operations to act on an invisible field.","fix":"After _nc_First_Active_Field returns, verify the returned field is at least selectable before assigning it as form->current, or treat a form page with no usable fields as an error condition.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:3256-3295","code":" 3256 | NCURSES_EXPORT(FIELD *)\n 3257 | _nc_First_Active_Field(FORM *form)\n 3258 | {\n 3259 |   FIELD **last_on_page = &form->field[form->page[form->curpage].pmax];\n 3260 |   FIELD *proposed = Next_Field_On_Page(*last_on_page);\n 3261 | \n 3262 |   if (proposed == *last_on_page)\n 3263 |     {\n 3264 |       /* there might be the special situation, where there is no\n 3265 |          active and visible field on the current page. We then select\n 3266 |          the first visible field on this readonly page\n 3267 |        */\n 3268 |       if (Field_Is_Not_Selectable(proposed))\n 3269 | \t{\n 3270 | \t  FIELD **field = &form->field[proposed->index];\n 3271 | \t  FIELD **first = &form->field[form->page[form->curpage].pmin];\n 3272 | \n 3273 | \t  do\n 3274 | \t    {\n 3275 | \t      field = (field == last_on_page) ? first : field + 1;\n 3276 | \t      if (((*field)->opts & O_VISIBLE))\n 3277 | \t\tbreak;\n 3278 | \t    }\n 3279 | \t  while (proposed != (*field));\n 3280 | \n 3281 | \t  proposed = *field;\n 3282 | \n 3283 | \t  if ((proposed == *last_on_page) && !(proposed->opts & O_VISIBLE))\n 3284 | \t    {\n 3285 | \t      /* This means, there is also no visible field on the page.\n 3286 | \t         So we propose the first one and hope the very best...\n 3287 | \t         Some very clever user has designed a readonly and invisible\n 3288 | \t         page on this form.\n 3289 | \t       */\n 3290 | \t      proposed = *first;\n 3291 | \t    }\n 3292 | \t}\n 3293 |     }\n 3294 |   return (proposed);\n 3295 | }","lines":40,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L3256-L3295"},{"ref":"payloads/libpayload/curses/form/frm_def.c:271-273","code":"  271 | \t{\n  272 | \t  form->curpage = 0;\n  273 | \t  form_driver(form, FIRST_ACTIVE_MAGIC);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L271-L273"}]},{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In Next_Enum (fty_enum.c), when no exact match is found in the keyword list and\ncnt drops to -1, the code wraps to args->kwds[0] and sets the field to *kwds\n(the first keyword). However, if the current field content is empty and matches\nthe dummy empty array exactly via the Compare(dummy,...) path, *kwds at that point\nis args->kwds[0] only if cnt wrapped to 0; but if cnt went negative (-1), the\nassignment 'kwds = args->kwds' points to kwds[0]. The subtle issue is that\n'cnt <= 0' triggers a reset to args->kwds (start), but the comparison afterwards\nuses 'cnt >= 0' which is FALSE when cnt == -1 after the last decrement. So if\nno match is found AND the field is not empty matching dummy, FALSE is correctly\nreturned. But when cnt exits the loop at -1 (no match found), the dummy compare\nmay advance past the array. The condition at line 358 'if (cnt <= 0)' resets kwds\nbut then 'if (cnt >= 0)' on line 360 is only true if cnt==0 not cnt==-1, creating\nan off-by-one: wrapping occurs but the next item is skipped when the field is empty.","fix":"After finding no match (cnt exhausted to -1) and wrapping kwds, the intent is to\nload the first keyword. Separate the wrap and the write logic more clearly,\nand verify cnt==0 (last item) vs cnt==-1 (exhausted) to correctly handle cycling.","locations":[{"ref":"payloads/libpayload/curses/form/fty_enum.c:343-367","code":"  343 | Next_Enum(FIELD *field, const void *argp)\n  344 | {\n  345 |   const enumARG *args = (const enumARG *)argp;\n  346 |   char **kwds = args->kwds;\n  347 |   bool ccase = args->checkcase;\n  348 |   int cnt = args->count;\n  349 |   unsigned char *bp = (unsigned char *)field_buffer(field, 0);\n  350 | \n  351 |   if (kwds)\n  352 |     {\n  353 |       while (cnt--)\n  354 | \t{\n  355 | \t  if (Compare((unsigned char *)(*kwds++), bp, ccase) == EXACT)\n  356 | \t    break;\n  357 | \t}\n  358 |       if (cnt <= 0)\n  359 | \tkwds = args->kwds;\n  360 |       if ((cnt >= 0) || (Compare((const unsigned char *)dummy, bp, ccase) == EXACT))\n  361 | \t{\n  362 | \t  set_field_buffer(field, 0, *kwds);\n  363 | \t  return TRUE;\n  364 | \t}\n  365 |     }\n  366 |   return FALSE;\n  367 | }","lines":25,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_enum.c#L343-L367"}]},{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In m_global.c _nc_Link_Items, the column-major branch uses variable 'i' (declared\nat the top scope as 'int i, j') as both the outer row-major loop variable (set by\nthe row-major branch above, now out of scope) and as a computed index inside the\ncolumn-major branch at line 449: 'item = menu->items[i = (col * Number_Of_Rows + row)]'.\nWhile 'i' is correctly reassigned on each iteration, mixing two loop variables\n(j for the iteration count, i for the flat index) reduces clarity and creates\na hidden dependency on the declaration scope. Additionally, variable 'last_pos'\nreturned by compile() in fty_regex.c is assigned but never used in either\nHAVE_REGEXP_H_FUNCS or HAVE_REGEXPR_H_FUNCS path.","fix":"In _nc_Link_Items, rename the flat index to 'flat_idx' and declare it inside\nthe else block for clarity.\nIn fty_regex.c, remove the unused 'last_pos' variable or suppress the warning,\nsince the result of compile() is only relevant via the side-effect on reg_errno.","locations":[{"ref":"payloads/libpayload/curses/menu/m_global.c:447-492","code":"  447 | \t  for (j = 0; j < Number_Of_Items; j++)\n  448 | \t    {\n  449 | \t      item = menu->items[i = (col * Number_Of_Rows + row)];\n  450 | \n  451 | \t      Last_in_Column = (menu->cols - 1) * Number_Of_Rows + row;\n  452 | \n  453 | \t      item->left = (col) ?\n  454 | \t\tmenu->items[i - Number_Of_Rows] :\n  455 | \t\t(cycle ? (Last_in_Column >= Number_Of_Items) ?\n  456 | \t\t menu->items[Last_in_Column - Number_Of_Rows] :\n  457 | \t\t menu->items[Last_in_Column] :\n  458 | \t\t (ITEM *) 0);\n  459 | \n  460 | \t      item->right = ((i + Number_Of_Rows) < Number_Of_Items)\n  461 | \t\t?\n  462 | \t\tmenu->items[i + Number_Of_Rows] :\n  463 | \t\t(cycle ? menu->items[row] : (ITEM *) 0);\n  464 | \n  465 | \t      Last_in_Row = col * Number_Of_Rows + (Number_Of_Rows - 1);\n  466 | \n  467 | \t      item->up = (row) ?\n  468 | \t\tmenu->items[i - 1] :\n  469 | \t\t(cycle ?\n  470 | \t\t menu->items[(Last_in_Row >= Number_Of_Items) ?\n  471 | \t\t\t     Number_Of_Items - 1 :\n  472 | \t\t\t     Last_in_Row] :\n  473 | \t\t (ITEM *) 0);\n  474 | \n  475 | \t      item->down = (row < (Number_Of_Rows - 1))\n  476 | \t\t?\n  477 | \t\t(menu->items[((i + 1) < Number_Of_Items) ?\n  478 | \t\t\t     i + 1 :\n  479 | \t\t\t     (col - 1) * Number_Of_Rows + row + 1]) :\n  480 | \t\t(cycle ?\n  481 | \t\t menu->items[col * Number_Of_Rows] :\n  482 | \t\t (ITEM *) 0\n  483 | \t\t);\n  484 | \n  485 | \t      item->x = col;\n  486 | \t      item->y = row;\n  487 | \t      if ((++row) == Number_Of_Rows)\n  488 | \t\t{\n  489 | \t\t  col++;\n  490 | \t\t  row = 0;\n  491 | \t\t}\n  492 | \t    }","lines":46,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_global.c#L447-L492"},{"ref":"payloads/libpayload/curses/form/fty_regex.c:164-169","code":"  164 | #if HAVE_REGEXP_H_FUNCS\n  165 | \t\t  char *last_pos = compile(rx, buf, &buf[blen], '\\0');\n  166 | \n  167 | #else /* HAVE_REGEXPR_H_FUNCS */\n  168 | \t\t  char *last_pos = compile(rx, buf, &buf[blen]);\n  169 | #endif","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_regex.c#L164-L169"}]},{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In m_req_name.c menu_request_by_name(), after the inner toupper loop terminates (when i reaches sizeof(buf) or a NUL), i is reused for the outer search loop starting at line 116. The variable `i` is declared as `unsigned int`, so `i = 0` before the outer loop is fine, but the reuse across two semantically distinct loop bodies is confusing and error-prone; if the inner loop exits due to i == sizeof(buf) (16), the outer loop's `for (i = 0; ...)` correctly resets i. This is not a runtime bug but indicates fragile code.","fix":"Use separate variable names for the two loops, e.g., `unsigned int j` for the toupper pass.","locations":[{"ref":"payloads/libpayload/curses/menu/m_req_name.c:102-122","code":"  102 |   unsigned int i = 0;\n  103 |   char buf[16];\n  104 | \n  105 |   T((T_CALLED(\"menu_request_by_name(%s)\"), _nc_visbuf(str)));\n  106 | \n  107 |   if (str)\n  108 |     {\n  109 |       strncpy(buf, str, sizeof(buf));\n  110 |       while ((i < sizeof(buf)) && (buf[i] != '\\0'))\n  111 | \t{\n  112 | \t  buf[i] = (char)toupper(UChar(buf[i]));\n  113 | \t  i++;\n  114 | \t}\n  115 | \n  116 |       for (i = 0; i < A_SIZE; i++)\n  117 | \t{\n  118 | \t  if (strncmp(request_names[i], buf, sizeof(buf)) == 0)\n  119 | \t    returnCode(MIN_MENU_COMMAND + (int)i);\n  120 | \t}\n  121 |     }\n  122 |   RETURN(E_NO_MATCH);","lines":21,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_req_name.c#L102-L122"}]},{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In pdcscrn.c PDC_scr_open(), if SP allocation succeeds but pdc_atrtab allocation fails (line 64), the already-allocated SP is not freed before returning ERR, leaking SP.","fix":"Check allocations separately: if SP allocation succeeds but pdc_atrtab fails, free(SP) before returning ERR. Or check them with an if/else chain.","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdcscrn.c:61-65","code":"   61 |     SP = calloc(1, sizeof(SCREEN));\n   62 |     pdc_atrtab = calloc(PDC_COLOR_PAIRS * PDC_OFFSET, 1);\n   63 | \n   64 |     if (!SP || !pdc_atrtab)\n   65 |         return ERR;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdcscrn.c#L61-L65"}]},{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In tinycurses.c vwprintw(), vsprintf writes into the global `sprintf_tmp[1024]` buffer (line 497). This is a fixed-size global buffer with no length protection; a format string producing more than 1024 bytes will overflow into adjacent globals. The comment on line 163 calls this 'Ugly (and insecure!) hack!'. In a bare-metal BIOS context this can cause silent data corruption in other global variables.","fix":"Replace vsprintf with vsnprintf(sprintf_tmp, sizeof(sprintf_tmp), fmt, argp) to prevent overflow.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:163-164","code":"  163 | // FIXME: Ugly (and insecure!) hack!\n  164 | char sprintf_tmp[1024];","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L163-L164"},{"ref":"payloads/libpayload/curses/tinycurses.c:495-501","code":"  495 | int vwprintw(WINDOW *win, const char *fmt, va_list argp)\n  496 | {\n  497 | \tvsprintf((char *)&sprintf_tmp, fmt, argp);\n  498 | \n  499 | \t/* TODO: Error handling? */\n  500 | \treturn waddstr(win, (char *)&sprintf_tmp);\n  501 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L495-L501"}]},{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In cbmem_console.c cbmem_console_write(), do_write is called with a potentially zero-length `count` on the last iteration when `still_fits == count` (i.e., count becomes 0 after `count -= still_fits`). The subsequent do_write(buffer, 0) is harmless (memcpy of 0 bytes) but the loop condition `(cbmem_cons->cursor & CURSOR_MASK) + count >= cbmem_cons->size` with count=0 would be false, so the loop exits correctly. However, if cbmem_cons->size is 0 (pathological but possible if the console was improperly initialized), the loop condition divides no bytes but `still_fits = 0 - 0 = 0`, leading to an infinite loop because count never decreases below 0.","fix":"Add a guard at the top of cbmem_console_write(): `if (!cbmem_cons || !cbmem_cons->size) return;`","locations":[{"ref":"payloads/libpayload/drivers/cbmem_console.c:66-81","code":"   66 | void cbmem_console_write(const void *buffer, size_t count)\n   67 | {\n   68 | \tstruct cbmem_console *const cbmem_cons = phys_to_virt(cbmem_console_p);\n   69 | \n   70 | \twhile ((cbmem_cons->cursor & CURSOR_MASK) + count >=\n   71 | \t       cbmem_cons->size) {\n   72 | \t\tsize_t still_fits = cbmem_cons->size - (cbmem_cons->cursor & CURSOR_MASK);\n   73 | \t\tdo_write(buffer, still_fits);\n   74 | \t\tcbmem_cons->cursor &= ~CURSOR_MASK;\n   75 | \t\tcbmem_cons->cursor |= OVERFLOW;\n   76 | \t\tbuffer += still_fits;\n   77 | \t\tcount -= still_fits;\n   78 | \t}\n   79 | \n   80 | \tdo_write(buffer, count);\n   81 | }","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/cbmem_console.c#L66-L81"}]},{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In mouse.c mouse_state(), mouse_buf_idx is a module-level variable but mouse_sample() calls insert_buf() and mouse_decode(), which can leave mouse_buf_idx at an intermediate count between calls. If mouse_state() is called while a partial packet is being assembled (e.g., only 2 bytes of a 3-byte packet arrived), the x_axis and y_axis reported will be stale or zero even though data has arrived. This is expected for streaming protocols, but the zero-and-reset of x_axis/y_axis on every call to mouse_state() means partial data that hasn't been decoded yet is effectively discarded from the accumulator perspective. This is a design-level issue rather than a crash bug.","fix":"Document that get_state() may return 0 for axes even when bytes are in-flight. Consider returning a 'data_ready' flag or only resetting accumulators when a full packet was decoded.","locations":[{"ref":"payloads/libpayload/drivers/i8042/mouse.c:189-210","code":"  189 | static void mouse_state(int *x, int *y, int *z, u32 *b)\n  190 | {\n  191 | \tif (!initialized)\n  192 | \t\treturn;\n  193 | \n  194 | \tmouse_sample();\n  195 | \n  196 | \tif (x) {\n  197 | \t\t*x = x_axis;\n  198 | \t\tx_axis = 0;\n  199 | \t}\n  200 | \tif (y) {\n  201 | \t\t*y = y_axis;\n  202 | \t\ty_axis = 0;\n  203 | \t}\n  204 | \tif (z) {\n  205 | \t\t*z = z_axis;\n  206 | \t\tz_axis = 0;\n  207 | \t}\n  208 | \tif (b)\n  209 | \t\t*b = buttons;\n  210 | }","lines":22,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/mouse.c#L189-L210"}]},{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In mouse_cursor.c mouse_cusor_is_fast() (line 77), the function name has a typo: 'cusor' instead of 'cursor'. This is a cosmetic issue but affects API clarity.","fix":"Rename to mouse_cursor_is_fast().","locations":[{"ref":"payloads/libpayload/drivers/mouse_cursor.c:76-79","code":"   76 | static u8 mouse_cusor_is_fast(int x, int y)\n   77 | {\n   78 | \treturn (x * x + y * y) > (mouse_acceleration * mouse_acceleration);\n   79 | }","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/mouse_cursor.c#L76-L79"}]},{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"pci_ops.c pci_read_resource() takes an int bar parameter with no bounds check. A negative bar or bar > 5 results in an out-of-range config space offset (0x10 + bar*4), which for a negative bar would access vendor/device ID registers, and for large bar values would access beyond the 256-byte standard config space.","fix":"Add a bounds check: if (bar < 0 || bar > 5) return 0xFFFFFFFF; before the config read.","locations":[{"ref":"payloads/libpayload/drivers/pci_ops.c:83-85","code":"   83 | u32 pci_read_resource(pcidev_t dev, int bar)\n   84 | {\n   85 | \treturn pci_read_config32(dev, 0x10 + (bar * 4));","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/pci_ops.c#L83-L85"}]},{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In serial/8250.c, serial_putchar() busy-waits on the TX empty bit (bit 5 of LSR) with no timeout (line 150), and serial_getchar() busy-waits for data ready with no timeout (line 168). If the UART is locked up or misconfigured, both functions spin forever, hanging the payload with no way to recover.","fix":"Add a retry counter or a time-based deadline to both loops. On timeout, serial_putchar can silently drop the character, and serial_getchar can return -1 to indicate no data.","locations":[{"ref":"payloads/libpayload/drivers/serial/8250.c:150","code":"  150 | \twhile ((serial_read_reg(0x05) & 0x20) == 0) ;","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/serial/8250.c#L150"},{"ref":"payloads/libpayload/drivers/serial/8250.c:168","code":"  168 | \twhile (!serial_havechar()) ;","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/serial/8250.c#L168"}]},{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `write_acpi_tables()` the locals `char oem_id[6], oem_table_id[8];` are only initialized in the non-QEMU path (from `slic_file` or the `OEM_ID`/`ACPI_TABLE_CREATOR` defaults). In the QEMU `fw_cfg_acpi_tables()` branch they are used while still uninitialized: `acpi_write_rsdp(rsdp, existing_rsdt, xsdt, oem_id)` copies `oem_id` into `rsdp->oem_id` (via `memcpy(rsdp->oem_id, oem_id, 6)`), and `memcpy(&ssdt->oem_table_id, oem_table_id, 8)` copies the uninitialized `oem_table_id` into the synthesized SSDT. This reads indeterminate stack bytes (undefined behavior) and puts garbage OEM identifiers into the RSDP and SSDT on QEMU targets that use `fw_cfg` (e.g. `qemu-i440fx`/`q35`).","fix":"Initialize the OEM identifiers before the `fw_cfg` branch (e.g. `memcpy(oem_id, OEM_ID, 6); memcpy(oem_table_id, ACPI_TABLE_CREATOR, 8);` right after the declarations), or set them inside the QEMU branch before `acpi_write_rsdp()`/SSDT construction.","locations":[{"ref":"src/acpi/acpi.c:1468-1469","code":" 1468 | \tchar oem_id[6], oem_table_id[8];\n 1469 | ","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/acpi.c#L1468-L1469"},{"ref":"src/acpi/acpi.c:1534-1535","code":" 1534 | \t\t\tacpi_write_rsdp(rsdp, existing_rsdt, xsdt, oem_id);\n 1535 | \t\t\tacpi_write_xsdt(xsdt, oem_id, oem_table_id);","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/acpi.c#L1534-L1535"},{"ref":"src/acpi/acpi.c:1554-1555","code":" 1554 | \t\tmemcpy(&ssdt->oem_table_id, oem_table_id, 8);\n 1555 | \t\tssdt->oem_revision = 42;","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/acpi.c#L1554-L1555"}]},{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"DPTF passive-policy usage is gated inconsistently. `dptf_write_enabled_policies()` decides `is_passive_used = (passive_count && passive_policies[0].target != DPTF_NONE)` (checks `.target`), but the actual emitters `write_thermal_relationship_table()` and `write_all_PSV()` start/stop on `policies[i].source == DPTF_NONE` (check `.source`). If a board configures a passive policy whose `source` is set but whose `target` is `DPTF_NONE`, `_TRT`/`_PSV` objects are still emitted while the `IDSP` package advertised to the OS omits the passive-policy UUID (or vice-versa), so the advertised capability set and the generated methods can disagree.","fix":"Use the same field for the enabled-policy gate as the emitters use for termination. Change the `is_passive_used` check to test `passive_policies[0].source != DPTF_NONE` (matching `write_thermal_relationship_table()`/`write_all_PSV()`), or make all three consistently test the same field.","locations":[{"ref":"src/acpi/acpigen_dptf.c:528","code":"  528 | \tis_passive_used = (passive_count && passive_policies[0].target != DPTF_NONE);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/acpigen_dptf.c#L528"},{"ref":"src/acpi/acpigen_dptf.c:255-258","code":"  255 | \tfor (i = 0; i < max_count; ++i) {\n  256 | \t\t/* Stop writing the table once an entry is empty */\n  257 | \t\tif (policies[i].source == DPTF_NONE)\n  258 | \t\t\tbreak;","lines":4,"link":"https://github.com/c
