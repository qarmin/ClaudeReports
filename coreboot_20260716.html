<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `pirq_route_irqs()` the device pointer returned by `pcidev_path_on_bus(bus, devfn)` is passed straight into `pci_assign_irqs()` without a NULL check. `pcidev_path_on_bus()` returns `NULL` when the bus/devfn taken from the (board-supplied, static) PIRQ routing table does not correspond to an enabled device in the device tree, and `pci_assign_irqs()` immediately dereferences it via `dev->path.pci.devfn >> 3`, causing a NULL-pointer dereference during table generation. A PIRQ table that lists an optional/disabled device is enough to crash the boot.","fix":"Guard the call, e.g.:\n```c\nstruct device *dev = pcidev_path_on_bus(bus, devfn);\nif (dev)\n\tpci_assign_irqs(dev, irq_slot);\n```\ninstead of `pci_assign_irqs(pcidev_path_on_bus(bus, devfn), irq_slot);`","locations":[{"ref":"src/arch/x86/pirq_routing.c:160-161","code":"  160 | \t\t/* Bus, device, slots IRQs for {A,B,C,D}. */\n  161 | \t\tpci_assign_irqs(pcidev_path_on_bus(bus, devfn), irq_slot);","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/x86/pirq_routing.c#L160-L161"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `read_reg_prop()` the region count is computed as `prop->size / (4 * addr_cells + 4 * size_cells)` at the top of the function, but the sanity check on `addr_cells`/`size_cells` is only performed afterwards. If a (malformed or malicious) device tree yields `addr_cells == 0` and `size_cells == 0`, the divisor is `0` and this is an immediate division-by-zero crash. `addr_cells`/`size_cells` can be `0` when a node carries `#address-cells = <0>` / `#size-cells = <0>`, and the values flow unvalidated from `be32dec()` of the FDT into this function via `fdt_read_reg_prop()` and `dt_read_reg_prop()`. The `addr_cells > 2 || size_cells > 2` guard executes too late to prevent the divide, and also does not reject `0`. A large value such as `addr_cells == 0x40000000` also makes `4 * addr_cells` wrap to `0`, producing the same crash.","fix":"Move the validation before the division and also reject zero. Change:\n```c\nsize_t count = prop->size / (4 * addr_cells + 4 * size_cells);\nif (count > regions_count) { ... }\nif (addr_cells > 2 || size_cells > 2) {\n    printk(...);\n    return 0;\n}\n```\nto validate first:\n```c\nif (addr_cells == 0 || size_cells == 0 || addr_cells > 2 || size_cells > 2) {\n    printk(BIOS_ERR, \"addr_cells (%d) or size_cells (%d) out of range\\n\", addr_cells, size_cells);\n    return 0;\n}\nsize_t count = prop->size / (4 * addr_cells + 4 * size_cells);\nif (count > regions_count) { ... }\n```","locations":[{"ref":"src/commonlib/device_tree.c:67-96","code":"   67 | static size_t read_reg_prop(struct fdt_property *prop, u32 addr_cells, u32 size_cells,\n   68 | \t\t\t    struct device_tree_region regions[], size_t regions_count)\n   69 | {\n   70 | \t// we found the reg property, no need to parse all regions in 'reg'\n   71 | \tsize_t count = prop->size / (4 * addr_cells + 4 * size_cells);\n   72 | \tif (count > regions_count) {\n   73 | \t\tprintk(BIOS_ERR, \"reg property has more entries (%zd) than regions array can hold (%zd)\\n\", count, regions_count);\n   74 | \t\tcount = regions_count;\n   75 | \t}\n   76 | \tif (addr_cells > 2 || size_cells > 2) {\n   77 | \t\tprintk(BIOS_ERR, \"addr_cells (%d) or size_cells (%d) bigger than 2\\n\",\n   78 | \t\t\t\t  addr_cells, size_cells);\n   79 | \t\treturn 0;\n   80 | \t}\n   81 | \tuint32_t *ptr = prop->data;\n   82 | \tfor (int i = 0; i < count; i++) {\n   83 | \t\tif (addr_cells == 1)\n   84 | \t\t\tregions[i].addr = be32dec(ptr);\n   85 | \t\telse if (addr_cells == 2)\n   86 | \t\t\tregions[i].addr = be64dec(ptr);\n   87 | \t\tptr += addr_cells;\n   88 | \t\tif (size_cells == 1)\n   89 | \t\t\tregions[i].size = be32dec(ptr);\n   90 | \t\telse if (size_cells == 2)\n   91 | \t\t\tregions[i].size = be64dec(ptr);\n   92 | \t\tptr += size_cells;\n   93 | \t}\n   94 | \n   95 | \treturn count; // return the number of regions found in the reg property\n   96 | }","lines":30,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/device_tree.c#L67-L96"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `storage_block_fill_write` the return value of `malloc(buffer_bytes)` is stored in `buffer` and immediately dereferenced via `ptr` in the fill loop (`*ptr++ = fill_pattern;`) with no NULL check. `buffer_bytes` can be up to 4 MiB, so on a constrained firmware heap the allocation can fail, causing a NULL-pointer write and crash. (Separately, `int ret` truncates the `uint64_t count` return value, though `count` is realistically within `int` range for fill operations.)","fix":"Add a NULL check right after the allocation.\nBefore:\n```c\nuint32_t *buffer = malloc(buffer_bytes);\nuint32_t *ptr = buffer;\n\nfor (; buffer_words ; buffer_words--)\n\t*ptr++ = fill_pattern;\n```\nAfter:\n```c\nuint32_t *buffer = malloc(buffer_bytes);\nif (buffer == NULL)\n\treturn 0;\nuint32_t *ptr = buffer;\n\nfor (; buffer_words ; buffer_words--)\n\t*ptr++ = fill_pattern;\n```","locations":[{"ref":"src/commonlib/storage/storage_write.c:116-120","code":"  116 | \tuint32_t *buffer = malloc(buffer_bytes);\n  117 | \tuint32_t *ptr = buffer;\n  118 | \n  119 | \tfor (; buffer_words ; buffer_words--)\n  120 | \t\t*ptr++ = fill_pattern;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/storage/storage_write.c#L116-L120"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `spd_decode_ddr3()` the Medium Time Base is computed as `mtb = (((u32)spd[10]) << 8) / spd[11];` with no check that `spd[11]` (the MTB divisor byte) is non-zero. `spd[11]` comes directly from external SPD data. If it is `0`, this is a division by zero (hardware exception/hang during memory init). Note the CRC check earlier only sets `ret = SPD_STATUS_CRC_ERROR` and does NOT return (lines 129-132), so decoding always continues regardless of CRC, and a valid-checksum-but-malformed SPD can still hit this. The sibling XMP decode function explicitly guards against a zero divisor (`if (spd[181] == 0) ... ; if (spd[183] == 0) ...` at lines 434 and 451), showing the main path is missing the same guard. The later FTB divisor `spd[9] & 0x0f` is guarded by the `if` at line 286, so only `spd[11]` is unprotected.","fix":"Guard the divisor before dividing, mirroring the XMP path:\n```c\nif (spd[11] == 0) {\n\tprintram(\"Invalid MTB divisor\\n\");\n\tdimm->dram_type = SPD_MEMORY_TYPE_UNDEFINED;\n\treturn SPD_STATUS_INVALID;\n}\nmtb = (((u32)spd[10]) << 8) / spd[11];\n```","locations":[{"ref":"src/device/dram/ddr3.c:247-253","code":"  247 | \t/* Medium Timebase =\n  248 | \t *   Medium Timebase (MTB) Dividend /\n  249 | \t *   Medium Timebase (MTB) Divisor */\n  250 | \tmtb = (((u32)spd[10]) << 8) / spd[11];\n  251 | \n  252 | \t/* SDRAM Minimum Cycle Time (tCKmin) */\n  253 | \tdimm->tCK = spd[12] * mtb;","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/device/dram/ddr3.c#L247-L253"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`acpi_device_hid()` dereferences `dev->ops->acpi_hid` after only checking `dev` for NULL, unlike the sibling `acpi_device_name()` which guards with `dev->ops && dev->ops->acpi_name`. If a caller passes a `struct device` whose `ops` is NULL, `acpi_device_hid()` performs a NULL-pointer dereference. It is a public API function, so robustness against `ops == NULL` should match `acpi_device_name()`.","fix":"Guard `dev->ops` before dereferencing.\n\nBefore:\n```c\n\t/* Check for device specific handler */\n\tif (dev->ops->acpi_hid)\n\t\treturn dev->ops->acpi_hid(dev);\n```\nAfter:\n```c\n\t/* Check for device specific handler */\n\tif (dev->ops && dev->ops->acpi_hid)\n\t\treturn dev->ops->acpi_hid(dev);\n```","locations":[{"ref":"src/acpi/device.c:119-134","code":"  119 | const char *acpi_device_hid(const struct device *dev)\n  120 | {\n  121 | \tif (!dev)\n  122 | \t\treturn NULL;\n  123 | \n  124 | \t/* Check for device specific handler */\n  125 | \tif (dev->ops->acpi_hid)\n  126 | \t\treturn dev->ops->acpi_hid(dev);\n  127 | \n  128 | \t/*\n  129 | \t * Don't walk up the tree to find any parent that can identify this device, as\n  130 | \t * PNP devices are hard to identify.\n  131 | \t */\n  132 | \n  133 | \treturn NULL;\n  134 | }","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/device.c#L119-L134"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`generate_cpu_entries()` computes `cores_per_package = (cpuid_ebx(1) >> 16) & 0xff` and then divides `numcpus = totalcores / cores_per_package` without checking for zero. On processors that report 0 in the `EBX[23:16]` (logical processor count) field of `CPUID.1` - which is architecturally allowed for parts that do not implement that field - this is a division by zero. It is also used as the loop bound and passed to `acpigen_write_processor_package()` / `acpigen_write_processor_cnot()`.","fix":"Clamp `cores_per_package` to a minimum of 1 before dividing, e.g. `if (cores_per_package < 1) cores_per_package = 1;` after reading it from CPUID, so `numcpus = totalcores / cores_per_package` cannot divide by zero.","locations":[{"ref":"src/cpu/intel/speedstep/acpi.c:154-171","code":"  154 | \tint totalcores = dev_count_cpu();\n  155 | \tint cores_per_package = (cpuid_ebx(1) >> 16) & 0xff;\n  156 | \n  157 | \t/* This assumes that all CPUs share the same layout. */\n  158 | \tint numcpus = totalcores / cores_per_package;\n  159 | \n  160 | \tprintk(BIOS_DEBUG, \"Found %d CPU(s) with %d core(s) each.\\n\",\n  161 | \t       numcpus, cores_per_package);\n  162 | \n  163 | \tfor (int cpu_id = 0; cpu_id < numcpus; ++cpu_id)\n  164 | \t\tfor (int core_id = 0; core_id < cores_per_package; core_id++)\n  165 | \t\t\tgenerate_cpu_entry(cpu_id, core_id, cores_per_package);\n  166 | \n  167 | \t/* PPKG is usually used for thermal management\n  168 | \t   of the first and only package. */\n  169 | \tacpigen_write_processor_package(\"PPKG\", 0, cores_per_package);\n  170 | \n  171 | \tacpigen_write_processor_cnot(cores_per_package);","lines":18,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/speedstep/acpi.c#L154-L171"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`timer_monotonic_get()` divides by `timer_fsb` (`usecs_elapsed = (mono_counter.last_value - current_tick) / timer_fsb`) using the value returned by `get_timer_fsb()` at line 74 without checking it for zero. The sibling function `udelay()` in the same file explicitly re-initializes the timer when `get_timer_fsb()` returns 0, but `timer_monotonic_get()` has no such guard, so a 0 FSB reading would be a division by zero. Only relevant when `LAPIC_MONOTONIC_TIMER` is selected and the FSB frequency cannot be determined.","fix":"After `timer_fsb = get_timer_fsb();` at line 74, skip the elapsed-time computation (or treat elapsed as 0) when `timer_fsb == 0`, mirroring the `if (!timer_fsb)` re-init handling already used in `udelay()`.","locations":[{"ref":"src/cpu/x86/lapic/apic_timer.c:74-77","code":"   74 | \ttimer_fsb = get_timer_fsb();\n   75 | \tcurrent_tick = lapic_read(LAPIC_TMCCT);\n   76 | \t/* Note that the APIC timer counts down. */\n   77 | \tusecs_elapsed = (mono_counter.last_value - current_tick) / timer_fsb;","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/x86/lapic/apic_timer.c#L74-L77"}]},{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"In sdl1/pdcclip.c PDC_freeclipboard(), after calling strlen(contents) to check\nthe length, the code writes into the buffer with strcpy(contents, \"PDCURSES\") and then\nimmediately calls free(contents) (lines 108-111). The strcpy write before free is intentional\n(as the comment explains), but the strlen call at line 108 operates on memory that may already\nhave been freed by a previous double-free call - there is no protection against the caller\npassing an invalid or already-freed pointer. Moreover the memset that would have made the\nuse-after-free detectable is commented out (line 106), while the strcpy still writes to\nfreed memory if called twice.","fix":"The pre-free strcpy pattern is fragile and not thread-safe. Simply call\nfree(contents) directly; the canary-write adds complexity without reliable benefit and\nrisks writing to already-freed memory on double-free.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c:92-115","code":"   92 | int PDC_freeclipboard(char *contents)\n   93 | {\n   94 |     PDC_LOG((\"PDC_freeclipboard() - called\\n\"));\n   95 | \n   96 |     /* should we also free empty the system clipboard? probably not */\n   97 | \n   98 |     if (contents)\n   99 |     {\n  100 |         /* NOTE: We free the memory, but we can not set caller's pointer\n  101 |            to NULL, so if caller calls again then will try to access\n  102 |            free'd memory.  We 1st overwrite memory with a string so if\n  103 |            caller tries to use free memory they won't get what they\n  104 |            expect & hopefully notice. */\n  105 | \n  106 |         /* memset(contents, 0xFD, strlen(contents)); */\n  107 | \n  108 |         if (strlen(contents) >= strlen(\"PDCURSES\"))\n  109 |             strcpy(contents, \"PDCURSES\");\n  110 | \n  111 |         free(contents);\n  112 |     }\n  113 | \n  114 |     return PDC_CLIP_SUCCESS;\n  115 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c#L92-L115"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"PDC_scr_open() in sdl1/pdcscrn.c allocates SP with calloc (line 73), then\ncalls SDL_Init, loads fonts, etc. On several early-exit paths the function returns ERR without\nfreeing SP. Specifically: if SDL_Init fails (line 84-86), if the font cannot be loaded (line\n101-104), and if SDL_SetVideoMode fails (line 163-166), the function returns ERR while SP\nremains allocated. This leaks sizeof(SCREEN) bytes every time initscr() is called and fails.","fix":"Add `free(SP); SP = NULL;` before each `return ERR;` inside PDC_scr_open(),\nmirroring what PDC_scr_free() does at line 59-63.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c:67-202","code":"   67 | int PDC_scr_open(int argc, char **argv)\n   68 | {\n   69 |     int i;\n   70 | \n   71 |     PDC_LOG((\"PDC_scr_open() - called\\n\"));\n   72 | \n   73 |     SP = calloc(1, sizeof(SCREEN));\n   74 | \n   75 |     if (!SP)\n   76 |         return ERR;\n   77 | \n   78 |     pdc_own_screen = !pdc_screen;\n   79 | \n   80 |     if (pdc_own_screen)\n   81 |     {\n   82 |         if (SDL_Init(SDL_INIT_VIDEO|SDL_INIT_TIMER) < 0)\n   83 |         {\n   84 |             fprintf(stderr, \"Could not start SDL: %s\\n\", SDL_GetError());\n   85 |             return ERR;\n   86 |         }\n   87 | \n   88 |         atexit(SDL_Quit);\n   89 |     }\n   90 | \n   91 |     if (!pdc_font)\n   92 |     {\n   93 |         const char *fname = getenv(\"PDC_FONT\");\n   94 |         pdc_font = SDL_LoadBMP(fname ? fname : \"pdcfont.bmp\");\n   95 |     }\n   96 | \n   97 |     if (!pdc_font)\n      else\n  154 |     {\n  155 |         if (!pdc_sheight)\n  156 |             pdc_sheight = pdc_screen->h - pdc_yoffset;\n  157 | \n  158 |         if (!pdc_swidth)\n  159 |             pdc_swidth = pdc_screen->w - pdc_xoffset;\n  160 |     }\n  161 | \n  162 |     if (!pdc_screen)\n  163 |     {\n  164 |         fprintf(stderr, \"Couldn't create a surface: %s\\n\", SDL_GetError());\n  165 |         return ERR;\n  166 |     }\n  167 | \n  168 |     if (SP->orig_attr)\n  169 |         PDC_retile();\n  170 | \n  171 |     for (i = 0; i < 8; i++)\n  172 |     {\n  173 |         pdc_color[i].r = (i & COLOR_RED) ? 0xc0 : 0;\n  174 |         pdc_color[i].g = (i & COLOR_GREEN) ? 0xc0 : 0;\n  175 |         pdc_color[i].b = (i & COLOR_BLUE) ? 0xc0 : 0;\n  176 | \n  177 |         pdc_color[i + 8].r = (i & COLOR_RED) ? 0xff : 0x40;\n  178 |         pdc_color[i + 8].g = (i & COLOR_GREEN) ? 0xff : 0x40;\n  179 |         pdc_color[i + 8].b = (i & COLOR_BLUE) ? 0xff : 0x40;\n  180 |     }\n  181 | \n  182 |     for (i = 0; i < 16; i++)\n  183 |         pdc_mapped[i] = SDL_MapRGB(pdc_screen->format, pdc_color[i].r,\n  184 |                                    pdc_color[i].g, pdc_color[i].b);\n  185 | \n  186 |     SDL_EnableUNICODE(1);\n  187 | \n  188 |     PDC_mouse_set();\n  189 | \n  190 |     if (pdc_own_screen)\n  191 |         PDC_set_title(argc ? argv[0] : \"PDCurses\");\n  192 | \n  193 |     SP->lines = PDC_get_rows();\n  194 |     SP->cols = PDC_get_columns();\n  195 | \n  196 |     SP->mouse_wait = PDC_CLICK_PERIOD;\n  197 |     SP->audible = FALSE;\n  198 | \n  199 |     PDC_reset_prog_mode();\n  200 | \n  201 |     return OK;\n  202 | }","lines":136,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L67-L202"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"Connect_Fields iterates over the fields array setting field->form = form on each entry before checking for E_CONNECTED. If a later field is found to be already connected, the function returns E_CONNECTED but all previously visited fields already have their ->form pointer pointing at the new (not-yet-fully-connected) form object. Those fields are permanently orphaned from their original form and the partial state is never rolled back, leaking the page allocation that was already freed and leaving a corrupt form state.","fix":"Check all fields for pre-existing connections in a first pass before modifying any field->form pointer, or roll back all previously set field->form pointers on error before returning E_CONNECTED.","locations":[{"ref":"payloads/libpayload/curses/form/frm_def.c:176-186","code":"  176 |   for (field_cnt = 0; fields[field_cnt]; field_cnt++)\n  177 |     {\n  178 |       if (fields[field_cnt]->form)\n  179 | \tRETURN(E_CONNECTED);\n  180 |       if (field_cnt == 0 ||\n  181 | \t  (fields[field_cnt]->status & _NEWPAGE))\n  182 | \tpage_nr++;\n  183 |       fields[field_cnt]->form = form;\n  184 |     }\n  185 |   if (field_cnt == 0 || (short)field_cnt < 0)\n  186 |     RETURN(E_BAD_ARGUMENT);","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L176-L186"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In SubWinTest() (newdemo.c), if derwin/subwin returns NULL for swin2 or swin3, the function returns 1 immediately without freeing the already-allocated windows. If swin2 fails, swin1 is leaked. If swin3 fails, both swin1 and swin2 are leaked.","fix":"On each early-return path, call delwin() on every previously allocated subwindow before returning 1.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/newdemo.c:82-87","code":"   82 |     if ((swin1 = derwin(win, sh, sw, 3, 5)) == NULL)\n   83 |         return 1;\n   84 |     if ((swin2 = subwin(win, sh, sw, by + 4, bx + 8)) == NULL)\n   85 |         return 1;\n   86 |     if ((swin3 = subwin(win, sh, sw, by + 5, bx + 11)) == NULL)\n   87 |         return 1;","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/newdemo.c#L82-L87"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In the scrolling message loop in main() (newdemo.c), malloc() is called to allocate scrollbuf but its return value is never checked. If malloc returns NULL, the subsequent memset(visbuf, ...) and strncpy(scrollbuf + i, ...) dereference a NULL pointer (offset by msg_len), causing a crash. This is reachable in any low-memory environment.","fix":"Check the return of malloc: if (!scrollbuf) { stop = 1; break; } before dereferencing visbuf or scrollbuf.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/newdemo.c:349-358","code":"  349 |             char *scrollbuf = malloc(scroll_len);\n  350 |             char *visbuf = scrollbuf + msg_len;\n  351 |             int stop = 0;\n  352 |             int i;\n  353 | \n  354 |             for (i = w + msg_len; i > 0; i--)\n  355 |             {\n  356 |                 memset(visbuf, ' ', w);\n  357 |                 strncpy(scrollbuf + i, message, msg_len);\n  358 |                 mvwaddnstr(win, height / 2, 1, visbuf, w);","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/newdemo.c#L349-L358"}]},{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"PDC_resize_screen() in sdl1/pdcscrn.c calls SDL_FreeSurface(pdc_screen) at line\n217 then immediately calls SDL_SetVideoMode. If SDL_SetVideoMode returns NULL (pdc_screen becomes\nNULL) the function still returns OK at line 228, silently leaving the application with no valid\nscreen surface. Any subsequent drawing calls will dereference the NULL pdc_screen pointer.\nAdditionally pdc_tileback is not freed before the retile on failure paths.","fix":"After SDL_SetVideoMode, check `if (!pdc_screen) return ERR;` before continuing\nand set SP->resized/cursrow/curscol only on success.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c:206-229","code":"  206 | int PDC_resize_screen(int nlines, int ncols)\n  207 | {\n  208 |     if (!pdc_own_screen)\n  209 |         return ERR;\n  210 | \n  211 |     if (nlines && ncols)\n  212 |     {\n  213 |         pdc_sheight = nlines * pdc_fheight;\n  214 |         pdc_swidth = ncols * pdc_fwidth;\n  215 |     }\n  216 | \n  217 |     SDL_FreeSurface(pdc_screen);\n  218 | \n  219 |     pdc_screen = SDL_SetVideoMode(pdc_swidth, pdc_sheight, 0,\n  220 |         SDL_SWSURFACE|SDL_ANYFORMAT|SDL_RESIZABLE);\n  221 | \n  222 |     if (pdc_tileback)\n  223 |         PDC_retile();\n  224 | \n  225 |     SP->resized = FALSE;\n  226 |     SP->cursrow = SP->curscol = 0;\n  227 | \n  228 |     return OK;\n  229 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L206-L229"}]},{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In win32/pdcclip.c PDC_setclipboard(), OpenClipboard(NULL) is called at line\n99 but if GlobalAlloc fails at line 102-106, the function returns PDC_CLIP_MEMORY_ERROR without\ncalling CloseClipboard(). This leaks the open clipboard handle, preventing any other process\nfrom accessing the clipboard until the application terminates.","fix":"Add `CloseClipboard();` before `return PDC_CLIP_MEMORY_ERROR;` at line 106,\nmatching the pattern used in PDC_getclipboard().","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcclip.c:92-128","code":"   92 | int PDC_setclipboard(const char *contents, long length)\n   93 | {\n   94 |     HGLOBAL ptr1;\n   95 |     LPTSTR ptr2;\n   96 | \n   97 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n   98 | \n   99 |     if (!OpenClipboard(NULL))\n  100 |         return PDC_CLIP_ACCESS_ERROR;\n  101 | \n  102 |     ptr1 = GlobalAlloc(GMEM_MOVEABLE|GMEM_DDESHARE,\n  103 |         (length + 1) * sizeof(TCHAR));\n  104 | \n  105 |     if (!ptr1)\n  106 |         return PDC_CLIP_MEMORY_ERROR;\n  107 | \n  108 |     ptr2 = GlobalLock(ptr1);\n  109 | \n  110 | #ifdef PDC_WIDE\n  111 |     PDC_mbstowcs((wchar_t *)ptr2, contents, length);\n  112 | #else\n  113 |     memcpy((char *)ptr2, contents, length + 1);\n  114 | #endif\n  115 |     GlobalUnlock(ptr1);\n  116 |     EmptyClipboard();\n  117 | \n  118 |     if (!SetClipboardData(PDC_TEXT, ptr1))\n  119 |     {\n  120 |         GlobalFree(ptr1);\n  121 |         return PDC_CLIP_ACCESS_ERROR;\n  122 |     }\n  123 | \n  124 |     CloseClipboard();\n  125 |     GlobalFree(ptr1);\n  126 | \n  127 |     return PDC_CLIP_SUCCESS;\n  128 | }","lines":37,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcclip.c#L92-L128"}]},{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In `_nc_Make_Argument()` for a `_LINKED_TYPE`, the node `p` is allocated and its\n`left` and `right` sub-arguments are constructed recursively (lines 100-101).\nIf the left recursive call succeeds but the right fails (incrementing `*err`),\nthe function returns `p` immediately (line 102) with a partially-constructed\nargument tree. The caller (`_nc_Copy_Type` / `set_field_type`) checks `*err != 0`\nand then calls `_nc_Free_Argument(dst->type, (TypeArgument*)(dst->arg))`, passing\n`p` as the arg to free. `_nc_Free_Argument` for a linked type will free both\n`p->left` (valid or NULL) and `p->right` (NULL since it failed), and then free\n`p` y when `field->expanded != NULL`. Since `expanded` was\nallocated with `typeCalloc` it is non-NULL but may be all-zeros, and `working`\ncould have failed (returned NULL from `newpad`). `delwin(NULL)` behaviour is\nimplementation-defined. More critically, if `typeCalloc` itself returns NULL\n(OOM), then `expanded` is NULL and the `working` pad leaks since `free_field()`\nonly cleans up widec resources when `expanded != NULL`.","fix":"Check both allocations for NULL immediately after they are made and jump to the\nerror path (calling `free_field`) if either fails. Also guard `delwin(working)`\nagainst a NULL `working` pointer in `free_field()`.","locations":[{"ref":"payloads/libpayload/curses/form/fld_def.c:306-334","code":"  306 | #if USE_WIDEC_SUPPORT\n  307 |       New_Field->working = newpad(1, Buffer_Length(New_Field) + 1);\n  308 |       New_Field->expanded = typeCalloc(char *, 1 + (unsigned)nbuf);\n  309 | #endif\n  310 | \n  311 |       if (_nc_Copy_Type(New_Field, &default_field))\n  312 | \t{\n  313 | \t  size_t len;\n  314 | \n  315 | \t  len = Total_Buffer_Size(New_Field);\n  316 | \t  if ((New_Field->buf = (FIELD_CELL *)malloc(len)))\n  317 | \t    {\n  318 | \t      /* Prefill buffers with blanks and insert terminating zeroes\n  319 | \t         between buffers */\n  320 | \t      int i, j;\n  321 | \t      int cells = Buffer_Length(New_Field);\n  322 | \n  323 | \t      for (i = 0; i <= New_Field->nbuf; i++)\n  324 | \t\t{\n  325 | \t\t  FIELD_CELL *buffer = &(New_Field->buf[(cells + 1) * i]);\n  326 | \n  327 | \t\t  for (j = 0; j < cells; ++j)\n  328 | \t\t    {\n  329 | \t\t      buffer[j] = blank;\n  330 | \t\t    }\n  331 | \t\t  buffer[j] = zeros;\n  332 | \t\t}\n  333 | \t      returnField(New_Field);\n  334 | \t    }","lines":29,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fld_def.c#L306-L334"}]},{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In Generic_RegularExpression_Type (HAVE_REGEXP_H_FUNCS / HAVE_REGEXPR_H_FUNCS branch),\npArg->refCount is allocated at line 154 before the compilation retry loop.\nTwo paths leak it:\n1. If compile() returns a fatal error (reg_errno != 50): free(pArg) is called at\n   line 177 but pArg->refCount is never freed first.\n2. If the loop exhausts blen > MAX_RX_LEN and pArg->compiled_expression stays NULL:\n   the cleanup at lines 191-194 calls free(pArg) without freeing pArg->refCount.\nIn both cases the refCount allocation is permanently lost.","fix":"Free pArg->refCount before freeing pArg in both error paths:\n  /* fatal error path: */\n  free(pArg->refCount);\n  free(pArg);\n  pArg = NULL;\n  /* and in the post-loop cleanup: */\n  free(pArg->refCount);\n  free(pArg);\n  pArg = NULL;","locations":[{"ref":"payloads/libpayload/curses/form/fty_regex.c:146-195","code":"  146 |       pArg = typeMalloc(RegExp_Arg, 1);\n  147 | \n  148 |       if (pArg)\n  149 | \t{\n  150 | \t  int blen = RX_INCREMENT;\n  151 | \n  152 | \t  T((T_CREATE(\"RegExp_Arg %p\"), pArg));\n  153 | \t  pArg->compiled_expression = NULL;\n  154 | \t  pArg->refCount = typeMalloc(unsigned long, 1);\n  155 | \n  156 | \t  *(pArg->refCount) = 1;\n  157 | \n  158 | \t  do\n  159 | \t    {\n  160 | \t      char *buf = typeMalloc(char, blen);\n  161 | \n  162 | \t      if (buf)\n  163 | \t\t{\n  164 | #if HAVE_REGEXP_H_FUNCS\n  165 | \t\t  char *last_pos = compile(rx, buf, &buf[blen], '\\0');\n  166 | \n  167 | #else /* HAVE_REGEXPR_H_FUNCS */\n  168 | \t\t  char *last_pos = compile(rx, buf, &buf[blen]);\n  169 | #endif\n  170 | \t\t  if (reg_errno)\n  171 | \t\t    {\n  172 | \t\t      free(buf);\n  173 | \t\t      if (reg_errno == 50)\n  174 | \t\t\tblen += RX_INCREMENT;\n  175 | \t\t      else\n  176 | \t\t\t{\n  177 | \t\t\t  free(pArg);\n  178 | \t\t\t  pArg = NULL;\n  179 | \t\t\t  break;\n  180 | \t\t\t}\n  181 | \t\t    }\n  182 | \t\t  else\n  183 | \t\t    {\n  184 | \t\t      pArg->compiled_expression = buf;\n  185 | \t\t      break;\n  186 | \t\t    }\n  187 | \t\t}\n  188 | \t    }\n  189 | \t  while (blen <= MAX_RX_LEN);\n  190 | \t}\n  191 |       if (pArg && !pArg->compiled_expression)\n  192 | \t{\n  193 | \t  free(pArg);\n  194 | \t  pArg = NULL;\n  195 | \t}","lines":50,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_regex.c#L146-L195"}]},{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In m_new.c new_menu() / m_post.c post_menu(), when typeCalloc(MENU,1) succeeds and _nc_Connect_Items() fails, the code correctly calls free(menu). However, free_menu() does NOT free menu->pattern even though pattern can be allocated in _nc_Connect_Items() (via _nc_Calculate_Item_Length_and_Width which calls set_menu_format which allocates pattern). If _nc_Connect_Items allocates the pattern buffer internally and then fails after that allocation, the partial cleanup via free(menu) leaks the pattern buffer because the menu struct is freed directly without calling _nc_Disconnect_Items or zeroing pattern first.","fix":"Before freeing menu on connect failure, call _nc_Disconnect_Items(menu) if it handles partial state, or explicitly free menu->pattern if set, matching the logic in free_menu().","locations":[{"ref":"payloads/libpayload/curses/menu/m_new.c:75-80","code":"   75 | \t  if (!_nc_Connect_Items(menu, items))\n   76 | \t    {\n   77 | \t      err = E_NOT_CONNECTED;\n   78 | \t      free(menu);\n   79 | \t      menu = (MENU *) 0;\n   80 | \t    }","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_new.c#L75-L80"}]},{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In cbfs_module_init(), filenames[index] = strdup(f->filename) is called for each CBFS file but the return value of strdup is never checked for NULL. If strdup fails (allocation failure), a NULL pointer is stored in the filenames array. Later in cbfs_module_redraw(), findfile(filenames[i]) and strlen(filenames[i]) dereference this NULL, causing a crash. Additionally, on init failure after partial allocation, the previously strdup'd strings are never freed.","fix":"Check the return value of strdup and return an error on failure. On error, free all previously allocated filenames before returning.","locations":[{"ref":"payloads/coreinfo/cbfs_module.c:100-106","code":"  100 | \tfilenames = malloc(filecount * sizeof(char *));\n  101 | \tif (filenames == NULL)\n  102 | \t\treturn 0;\n  103 | \n  104 | \tfor (f = firstfile(); f; f = nextfile(f))\n  105 | \t\tfilenames[index++] = strdup((const char *)f->filename);\n  106 | ","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/cbfs_module.c#L100-L106"}]},{"id":"MEM_12","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`acpi_dp_free()` recursively frees the sub-tables of `ACPI_DP_TYPE_CHILD` (via `dp->child`) and `ACPI_DP_TYPE_ARRAY` (via `dp->array`) nodes, but has no case for `ACPI_DP_TYPE_PACKAGE`. However `acpi_dp_add_package()` stores the package table in `new->child` (`new->child = package`). Because the `switch` in `acpi_dp_free()` falls through to `default` for `ACPI_DP_TYPE_PACKAGE`, the entire package sub-table (and everything appended to it) is leaked when `acpi_dp_write()` cleans up. This path is reached by common helpers such as `acpi_device_add_external_facing_port()`, `acpi_device_add_storage_d3_enable()`, `acpi_device_add_dma_property()`, etc., all of which go through `acpi_device_add_integer_property_with_uuid()` -> `acpi_dp_add_package()`. The leak is bounded and one-time-per-boot but is a genuine unbalanced `malloc`/`free`.","fix":"Add a case for `ACPI_DP_TYPE_PACKAGE` that frees its child table:\n```c\ncase ACPI_DP_TYPE_CHILD:\n\tacpi_dp_free(dp->child);\n\tbreak;\ncase ACPI_DP_TYPE_PACKAGE:\n\tacpi_dp_free(dp->child);\n\tbreak;\ncase ACPI_DP_TYPE_ARRAY:\n\tacpi_dp_free(dp->array);\n\tbreak;\n```","locations":[{"ref":"src/acpi/device.c:820-839","code":"  820 | static void acpi_dp_free(struct acpi_dp *dp)\n  821 | {\n  822 | \twhile (dp) {\n  823 | \t\tstruct acpi_dp *p = dp->next;\n  824 | \n  825 | \t\tswitch (dp->type) {\n  826 | \t\tcase ACPI_DP_TYPE_CHILD:\n  827 | \t\t\tacpi_dp_free(dp->child);\n  828 | \t\t\tbreak;\n  829 | \t\tcase ACPI_DP_TYPE_ARRAY:\n  830 | \t\t\tacpi_dp_free(dp->array);\n  831 | \t\t\tbreak;\n  832 | \t\tdefault:\n  833 | \t\t\tbreak;\n  834 | \t\t}\n  835 | \n  836 | \t\tfree(dp);\n  837 | \t\tdp = p;\n  838 | \t}\n  839 | }","lines":20,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/device.c#L820-L839"},{"ref":"src/acpi/device.c:1076-1090","code":" 1076 | struct acpi_dp *acpi_dp_add_package(struct acpi_dp *dp, struct acpi_dp *package)\n 1077 | {\n 1078 | \tstruct acpi_dp *new;\n 1079 | \n 1080 | \tif (!dp || !package || package->type != ACPI_DP_TYPE_TABLE)\n 1081 | \t\treturn NULL;\n 1082 | \n 1083 | \tnew = acpi_dp_new(dp, ACPI_DP_TYPE_PACKAGE, NULL);\n 1084 | \tif (new) {\n 1085 | \t\tnew->uuid = package->name;\n 1086 | \t\tnew->child = package;\n 1087 | \t}\n 1088 | \n 1089 | \treturn new;\n 1090 | }","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/device.c#L1076-L1090"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"very_easy","description":"In bootlog_module_init(), g_buf is allocated with only chars_count bytes, but when the CBMEM console has overflowed (OVERFLOW bit set), the code writes overflow_chars_count bytes at g_buf[0] and then chars_count bytes at g_buf[overflow_chars_count]. The total bytes written is overflow_chars_count + chars_count, which exceeds the allocated chars_count bytes, causing a heap buffer overflow. This corrupts heap metadata and adjacent allocations.","fix":"Change the malloc call to allocate the full required size: g_buf = malloc(chars_count + overflow_chars_count). The variable g_lines_count already correctly uses the sum on line 125.","locations":[{"ref":"payloads/coreinfo/bootlog_module.c:128-143","code":"  128 | \tg_buf = malloc(chars_count);\n  129 | \tif (!g_buf) {\n  130 | \t\treturn -3;\n  131 | \t}\n  132 | \n  133 | \tif (console->cursor & OVERFLOW) {\n  134 | \t\tif (sanitize_buffer_for_display(buffer + cursor, size - cursor,\n  135 | \t\t\t\tg_buf, overflow_chars_count, SCREEN_X) < 0) {\n  136 | \t\t\tgoto err_free;\n  137 | \t\t}\n  138 | \t}\n  139 | \tif (sanitize_buffer_for_display(buffer, cursor,\n  140 | \t\t\t\t\tg_buf + overflow_chars_count,\n  141 | \t\t\t\t\tchars_count, SCREEN_X) < 0) {\n  142 | \t\tgoto err_free;\n  143 | \t}","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/bootlog_module.c#L128-L143"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In timestamps_module_init(), the buffer is allocated as (max_entries + 4) * SCREEN_X bytes, but the per-entry formatting in timestamp_print_entry() can write significantly more than SCREEN_X bytes per entry across its multiple snprintf calls (up to ~95 bytes per entry: 51 for id+name, 20 for timestamp, 2 for ' (', 20 for step_time, 1 for ')', 1 for newline). Each individual snprintf is limited to SCREEN_X=80 bytes, but because buff_cur accumulates across all calls, approximately 95 bytes are written per entry. For more than ~15 entries (common in practice: coreboot usually records 50+ timestamps), the buffer overflows. Additionally, each snprintf call passes SCREEN_X rather than the remaining buffer space, so the size argument is semantically wrong.","fix":"Increase the buffer allocation to account for actual maximum bytes per entry. Calculate the real worst-case size per entry (at least 100 bytes) and allocate accordingly: buffer = malloc((max_entries + 4) * 100). Also pass the remaining buffer size (buffer_total_size - buff_cur) to snprintf instead of SCREEN_X.","locations":[{"ref":"payloads/coreinfo/timestamps_module.c:159-186","code":"  159 | \tbuffer = malloc((max_entries + 4) * SCREEN_X * sizeof(char));\n  160 | \n  161 | \tif (buffer == NULL)\n  162 | \t\treturn -3;\n  163 | \n  164 | \t/* Write the content */\n  165 | \tbuff_cur += snprintf(buffer, SCREEN_X, \"%d entries total:\\n\\n\",\n  166 | \t\t\tn_entries);\n  167 | \n  168 | \tprev_stamp = 0;\n  169 | \ttimestamp_print_entry(buffer, SCREEN_X, &buff_cur, 0, base_time,\n  170 | \t\t\tprev_stamp);\n  171 | \tprev_stamp = base_time;\n  172 | \n  173 | \ttotal_time = 0;\n  174 | \tfor (u32 i = 0; i < n_entries; i++) {\n  175 | \t\tuint64_t stamp;\n  176 | \t\tconst struct timestamp_entry *tse = &timestamps->entries[i];\n  177 | \n  178 | \t\tstamp = tse->entry_stamp + base_time;\n  179 | \t\ttotal_time += timestamp_print_entry(buffer, SCREEN_X,\n  180 | \t\t\t\t&buff_cur, tse->entry_id, stamp, prev_stamp);\n  181 | \t\tprev_stamp = stamp;\n  182 | \t}\n  183 | \n  184 | \tbuff_cur += snprintf(buffer + buff_cur, SCREEN_X, \"\\nTotal Time: \");\n  185 | \tbuff_cur += snprintf(buffer + buff_cur, SCREEN_X, \"%llu\", total_time);\n  186 | \tbuff_cur += snprintf(buffer + buff_cur, SCREEN_X, \"\\n\");","lines":28,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/timestamps_module.c#L159-L186"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In dos/pdcdisp.c and os2/pdcdisp.c, PDC_transform_line() declares a fixed-size local buffer\ntemp_line[256] but iterates up to `len` characters from `srcp`, writing into temp_line[j] for\nj in [0, len). The caller passes a `len` derived from the physical screen width (curscr->_maxx).\nScreen widths above 256 columns (e.g. 320-column modes or wide virtual terminals) cause a\nstack buffer overflow, corrupting the stack frame and potentially enabling code execution.","fix":"Increase temp_line to at least MAX_SCREEN_COLS (e.g. 512), or allocate it dynamically based on `len`, and add an assertion/clamp so `len` never exceeds the buffer size.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/dos/pdcdisp.c:94-109","code":"   94 |         struct {unsigned char text, attr;} temp_line[256];\n   95 | \n   96 |         /* replace the attribute part of the chtype with the actual\n   97 |            color value for each chtype in the line */\n   98 | \n   99 |         for (j = 0; j < len; j++)\n  100 |         {\n  101 |             chtype ch = srcp[j];\n  102 | \n  103 |             temp_line[j].attr = pdc_atrtab[ch >> PDC_ATTR_SHIFT];\n  104 | #ifdef CHTYPE_LONG\n  105 |             if (ch & A_ALTCHARSET && !(ch & 0xff80))\n  106 |                 ch = acs_map[ch & 0x7f];\n  107 | #endif\n  108 |             temp_line[j].text = ch & 0xff;\n  109 |         }","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/dos/pdcdisp.c#L94-L109"},{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcdisp.c:68-87","code":"   68 |     struct {unsigned char text, attr;} temp_line[256];\n   69 |     int j;\n   70 | \n   71 |     PDC_LOG((\"PDC_transform_line() - called: line %d\\n\", lineno));\n   72 | \n   73 |     /* replace the attribute part of the chtype with the\n   74 |        actual color value for each chtype in the line */\n   75 | \n   76 |     for (j = 0; j < len; j++)\n   77 |     {\n   78 |         chtype ch = srcp[j];\n   79 | \n   80 |         temp_line[j].attr = pdc_atrtab[ch >> PDC_ATTR_SHIFT];\n   81 | \n   82 | #ifdef CHTYPE_LONG\n   83 |         if (ch & A_ALTCHARSET && !(ch & 0xff80))\n   84 |             ch = acs_map[ch & 0x7f];\n   85 | #endif\n   86 |         temp_line[j].text = ch & 0xff;\n   87 |     }","lines":20,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcdisp.c#L68-L87"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In wgetnstr() (non-wide path), when n <= 0 the function proceeds without error -- n is never validated to be positive before use. A caller passing n=0 skips the 'chars < n' guard (0 < 0 is always false), so no characters are stored, but the final '*p = NUL' still writes into an unbounded location since p==str is valid. More critically, when the caller passes a negative n (other than -1 which would come from the internal wrappers), no clamping to MAXLINE occurs in the non-wide path; but the check 'if (n < 0 || n > MAXLINE) n = MAXLINE' only exists in the PDC_WIDE branch (line 74). The non-wide path has no such check, so a caller to getnstr(str, INT_MIN) would result in 'chars < n' always being true, writing unboundedly into str.","fix":"Add the same n clamping used in the wide path ('if (n < 0 || n > MAXLINE) n = MAXLINE;') at the top of the non-wide branch of wgetnstr(), before the main loop.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getstr.c:69-212","code":"   69 | int wgetnstr(WINDOW *win, char *str, int n)\n   70 | {\n   71 | #ifdef PDC_WIDE\n   72 |     wchar_t wstr[MAXLINE + 1];\n   73 | \n   74 |     if (n < 0 || n > MAXLINE)\n   75 |         n = MAXLINE;\n   76 | \n   77 |     if (wgetn_wstr(win, (wint_t *)wstr, n) == ERR)\n   78 |         return ERR;\n   79 | \n   80 |     return PDC_wcstombs(str, wstr, n);\n   81 | #else\n   82 |     int ch, i, num, x, chars;\n   83 |     char *p;\n   84 |     bool stop, oldecho, oldcbreak, oldnodelay;\n   85 | \n   8
