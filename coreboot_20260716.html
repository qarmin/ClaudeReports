9 | int mvgetstr(int y, int x, char *str)\n  230 | {\n  231 |     PDC_LOG((\"mvgetstr() - called\\n\"));\n  232 | \n  233 |     if (move(y, x) == ERR)\n  234 |         return ERR;\n  235 | \n  236 |     return wgetnstr(stdscr, str, MAXLINE);\n  237 | }\n  238 | \n  239 | int mvwgetstr(WINDOW *win, int y, int x, char *str)\n  240 | {\n  241 |     PDC_LOG((\"mvwgetstr() - called\\n\"));\n  242 | \n  243 |     if (wmove(win, y, x) == ERR)\n  244 |         return ERR;\n  245 | \n  246 |     return wgetnstr(win, str, MAXLINE);","lines":32,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getstr.c#L215-L246"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"PDC_wcstombs() (PDC_FORCE_UTF8 path) overflows the destination buffer when encoding multi-byte UTF-8 sequences. The loop condition is 'while (*src && i < n)', which allows i to be as large as n-1 when entering the body. For a 2-byte sequence (code < 0x800), the code writes dest[i] and dest[i+1] then does i += 2. If i started at n-1, dest[n] is written - one byte past the n-byte buffer. For a 3-byte sequence the problem is worse: from i=n-2 dest[n] is written; from i=n-1 both dest[n] and dest[n+1] are written. Additionally, the null terminator 'dest[i] = 0' after the loop can be written to dest[n] when the loop exhausted the buffer with multi-byte characters (i increments by 2 or 3, easily reaching or exceeding n).","fix":"Change the loop condition to check that there is enough room for the widest possible encoding before writing: for a 2-byte sequence require i + 1 < n, for a 3-byte sequence require i + 2 < n. A clean approach: 'while (*src) { code = *src++; bytes = (code < 0x80) ? 1 : (code < 0x800) ? 2 : 3; if (i + bytes >= n) break; /* write bytes */ i += bytes; } dest[i] = 0;'","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/util.c:279-307","code":"  279 |     while (*src && i < n)\n  280 |     {\n  281 |         chtype code = *src++;\n  282 | \n  283 |         if (code < 0x80)\n  284 |         {\n  285 |             dest[i] = code;\n  286 |             i++;\n  287 |         }\n  288 |         else\n  289 |             if (code < 0x800)\n  290 |             {\n  291 |                 dest[i] = ((code & 0x07c0) >> 6) | 0xc0;\n  292 |                 dest[i + 1] = (code & 0x003f) | 0x80;\n  293 |                 i += 2;\n  294 |             }\n  295 |             else\n  296 |             {\n  297 |                 dest[i] = ((code & 0xf000) >> 12) | 0xe0;\n  298 |                 dest[i + 1] = ((code & 0x0fc0) >> 6) | 0x80;\n  299 |                 dest[i + 2] = (code & 0x003f) | 0x80;\n  300 |                 i += 3;\n  301 |             }\n  302 |     }\n  303 | # else\n  304 |     size_t i = wcstombs(dest, src, n);\n  305 | # endif\n  306 |     dest[i] = '\\0';\n  307 |     return i;","lines":29,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/util.c#L279-L307"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"PDC_transform_line() in win32/pdcdisp.c uses a fixed-size stack buffer of 512 CHAR_INFO\nelements. The function accepts an arbitrary `len` parameter from its callers. If `len` exceeds 512 the\nloop at line 104 writes past the end of `ci[512]`, causing a stack buffer overflow. A terminal window\nwider than 512 columns (unlikely but possible) or a malicious/corrupted len value would trigger this.","fix":"Either cap len to 512 at the start of the function (add `if (len > 512) len = 512;`)\nor allocate `ci` dynamically with `malloc(len * sizeof(CHAR_INFO))` and free it before returning.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcdisp.c:87-116","code":"   87 |     CHAR_INFO ci[512];\n   88 |     int j;\n   89 |     COORD bufSize, bufPos;\n   90 |     SMALL_RECT sr;\n   91 | \n   92 |     PDC_LOG((\"PDC_transform_line() - called: lineno=%d\\n\", lineno));\n   93 | \n   94 |     bufPos.X = bufPos.Y = 0;\n   95 | \n   96 |     bufSize.X = len;\n   97 |     bufSize.Y = 1;\n   98 | \n   99 |     sr.Top = lineno;\n  100 |     sr.Bottom = lineno;\n  101 |     sr.Left = x;\n  102 |     sr.Right = x + len - 1;\n  103 | \n  104 |     for (j = 0; j < len; j++)\n  105 |     {\n  106 |         chtype ch = srcp[j];\n  107 | \n  108 |         ci[j].Attributes = pdc_atrtab[ch >> PDC_ATTR_SHIFT];\n  109 | #ifdef CHTYPE_LONG\n  110 |         if (ch & A_ALTCHARSET && !(ch & 0xff80))\n  111 |             ch = acs_map[ch & 0x7f];\n  112 | #endif\n  113 |         ci[j].Char.UnicodeChar = ch & A_CHARTEXT;\n  114 |     }\n  115 | \n  116 |     WriteConsoleOutput(pdc_con_out, ci, bufSize, bufPos, &sr);","lines":30,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcdisp.c#L87-L116"}]},{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In Previous_Enum, when args->count == 0 the kwds pointer is computed as\n'&args->kwds[cnt - 1]' which evaluates to '&args->kwds[-1]' (args->kwds is NULL\nwhen count is 0, per Generic_Enum_Type). This is undefined behavior - out-of-bounds\npointer arithmetic on a NULL pointer. The subsequent 'if (kwds)' check is always\ntrue (non-null pointer due to arithmetic), so the while loop then dereferences\nthe invalid pointer, causing a crash or memory corruption.","fix":"Guard against count == 0 at the start of Previous_Enum:\n  if (!args->kwds || args->count <= 0)\n    return FALSE;\nPlace this check before the kwds pointer computation at line 385.","locations":[{"ref":"payloads/libpayload/curses/form/fty_enum.c:383-405","code":"  383 |   const enumARG *args = (const enumARG *)argp;\n  384 |   int cnt = args->count;\n  385 |   char **kwds = &args->kwds[cnt - 1];\n  386 |   bool ccase = args->checkcase;\n  387 |   unsigned char *bp = (unsigned char *)field_buffer(field, 0);\n  388 | \n  389 |   if (kwds)\n  390 |     {\n  391 |       while (cnt--)\n  392 | \t{\n  393 | \t  if (Compare((unsigned char *)(*kwds--), bp, ccase) == EXACT)\n  394 | \t    break;\n  395 | \t}\n  396 | \n  397 |       if (cnt <= 0)\n  398 | \tkwds = &args->kwds[args->count - 1];\n  399 | \n  400 |       if ((cnt >= 0) || (Compare((const unsigned char *)dummy, bp, ccase) == EXACT))\n  401 | \t{\n  402 | \t  set_field_buffer(field, 0, *kwds);\n  403 | \t  return TRUE;\n  404 | \t}\n  405 |     }","lines":23,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_enum.c#L383-L405"}]},{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In m_req_name.c menu_request_by_name(), strncpy(buf, str, sizeof(buf)) copies up to 16 bytes but does NOT guarantee NUL-termination when the input string is exactly 16 bytes or longer (strncpy pads with NUL only up to sizeof(buf) but if source length >= sizeof(buf) the destination has no NUL). The subsequent while loop checks `buf[i] != '\\0'` but `i` is bounded by `sizeof(buf)`, so it won't overflow buf itself. However, the final strncmp on line 118 compares `request_names[i]` against `buf` using sizeof(buf)=16 as the count. If str has exactly 16 chars with no NUL at position 15, the comparison reads into uninitialized or next stack memory because `buf` is a 16-byte array and strncmp is asked to compare 16 bytes including the missing NUL. This means a 16+ char input can match a shorter request name spuriously if stack bytes happen to match.","fix":"Declare buf[17] and use strncpy(buf, str, 16); buf[16] = '\\0'; to always NUL-terminate. Alternatively use strlcpy if available.","locations":[{"ref":"payloads/libpayload/curses/menu/m_req_name.c:103-122","code":"  103 |   char buf[16];\n  104 | \n  105 |   T((T_CALLED(\"menu_request_by_name(%s)\"), _nc_visbuf(str)));\n  106 | \n  107 |   if (str)\n  108 |     {\n  109 |       strncpy(buf, str, sizeof(buf));\n  110 |       while ((i < sizeof(buf)) && (buf[i] != '\\0'))\n  111 | \t{\n  112 | \t  buf[i] = (char)toupper(UChar(buf[i]));\n  113 | \t  i++;\n  114 | \t}\n  115 | \n  116 |       for (i = 0; i < A_SIZE; i++)\n  117 | \t{\n  118 | \t  if (strncmp(request_names[i], buf, sizeof(buf)) == 0)\n  119 | \t    returnCode(MIN_MENU_COMMAND + (int)i);\n  120 | \t}\n  121 |     }\n  122 |   RETURN(E_NO_MATCH);","lines":20,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_req_name.c#L103-L122"}]},{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In tinycurses.c newwin(), window_count, ldat_count, and linebuf_count are each checked or incremented independently but only window_count is bounds-checked (line 394). ldat_count and linebuf_count can individually overflow their respective static arrays if called with unusual window sizes (e.g., a window with more lines than SCREEN_Y). ldat_list is sized [MAX_WINDOWS][SCREEN_Y] but ldat_count indexes it as a flat counter and is incremented by 1 per window regardless of num_lines. linebuf_list is sized [SCREEN_Y * MAX_WINDOWS][SCREEN_X + 1] but linebuf_count is incremented by num_lines per window; with 3 windows of 25 lines each that is exactly 75 which fits, but the check is absent. Any window taller than SCREEN_Y would overflow linebuf_list even if window_count < MAX_WINDOWS.","fix":"Add bounds checks: verify `ldat_count < MAX_WINDOWS` and `linebuf_count + num_lines <= SCREEN_Y * MAX_WINDOWS` before proceeding, and return NULL on overflow.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:385-421","code":"  385 | WINDOW *newwin(int num_lines, int num_columns, int begy, int begx)\n  386 | {\n  387 | \tWINDOW *win;\n  388 | \tint i;\n  389 | \n  390 | \t/* Use next statically allocated window. */\n  391 | \t// TODO: Error handling. Yes. Please.\n  392 | \t// TODO: WINDOWLIST?\n  393 | \n  394 | \tif (window_count >= MAX_WINDOWS)\n  395 | \t\treturn NULL;\n  396 | \n  397 | \twin = &window_list[window_count++];\n  398 | \n  399 | \t// bool is_pad = (flags & _ISPAD);\n  400 | \n  401 | \t// TODO: Checks.\n  402 | \n  403 | \twin->_cury = 0;\n  404 | \twin->_curx = 0;\n  405 | \twin->_maxy = num_lines - 1;\n  406 | \twin->_maxx = num_columns - 1;\n  407 | \twin->_begy = begy;\n  408 | \twin->_begx = begx;\n  409 | \t// win->_yoffset = SP->_topstolen;\n  410 | \n  411 | \twin->_line = ldat_list[ldat_count++];\n  412 | \n  413 | \t/* FIXME: Is this right? Should the window attributes be normal? */\n  414 | \twin->_color = PAIR_NUMBER(0);\n  415 | \twin->_attrs = A_NORMAL;\n  416 | \n  417 | \tfor (i = 0; i < num_lines; i++)\n  418 | \t\twin->_line[i].text =\n  419 | \t\t     (NCURSES_CH_T *)&linebuf_list[linebuf_count++];\n  420 | \n  421 | \treturn win;","lines":37,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L385-L421"}]},{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In get_cmos_value() and set_cmos_value(), the len parameter is u32 and the while loop does len -= 8. When len is not a multiple of 8 and greater than 8 (e.g., len=10), the first subtraction leaves len=2, then the second iteration subtracts 8 from an unsigned 2 to produce 0xFFFFFFFE. The loop condition (len > 0) is now true for ~536 million iterations, causing unbounded reads/writes to the value buffer and arbitrary NVRAM addresses.","fix":"Replace the while condition with a signed check, or only enter the byte-copy loop when len is known to be a multiple of 8. A safe fix: change the loop to iterate a fixed count: for (int bytes = len / 8; bytes > 0; bytes--) { value[offs++] = nvram->read(addr++); }. Also handle any remaining bits (len % 8) with a partial read/mask.","locations":[{"ref":"payloads/libpayload/drivers/options.c:120-123","code":"  120 | \twhile (len > 0) {\n  121 | \t\tlen -= 8;\n  122 | \t\tvalue[offs++]=nvram->read(addr++);\n  123 | \t}","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L120-L123"},{"ref":"payloads/libpayload/drivers/options.c:149-152","code":"  149 | \twhile (len > 0) {\n  150 | \t\tlen -= 8;\n  151 | \t\tnvram->write(value[offs++], addr++);\n  152 | \t}","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L149-L152"}]},{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `spd_decode_ddr2()`, when the SPD advertises no CAS support (`spd[18]==0`, i.e. `dimm->cas_supported==0`), the code only warns and sets `ret = SPD_STATUS_INVALID_FIELD` (line 422) without returning. It then computes `cl = spd_get_msbs(dimm->cas_supported)` which calls `log2(0)`. Per `src/include/lib.h` (`log2(0) == -1`), `spd_get_msbs` returns `-1` truncated to `u8` = `255`. `cl` is then used to index `dimm->cycle_time[cl]` and `dimm->access_time[cl]` (both `u32[8]` per `ddr2.h`), and also `dimm->cycle_time[cl - 1]`, `dimm->cycle_time[cl - 2]`, giving indices `255`, `254`, `253`. These are massively out-of-bounds writes into (and far past) the `dimm_attr_ddr2_st` structure. The SPD checksum at `spd[63]` is attacker-controllable (a plain byte sum), so a crafted/corrupt SPD EEPROM with a matching checksum but `spd[18]==0` reaches this path and corrupts memory. Shifts such as `1 << (cl - 1)` (`1 << 254`) are additionally undefined behavior.","fix":"After detecting invalid CAS support, bail out instead of continuing. For example, change the check at line 422 to return early:\n```c\nif ((dimm->cas_supported & 0x3) || !dimm->cas_supported) {\n\tprintk(BIOS_WARNING, \"SPD decode: invalid CAS support advertised.\\n\");\n\tdimm->dram_type = SPD_MEMORY_TYPE_UNDEFINED;\n\treturn SPD_STATUS_INVALID_FIELD;\n}\n```\nAlternatively, guard the `cl` computation/uses so `cl` (and `cl-1`, `cl-2`) are validated to be within `[2, 7]` before indexing `cycle_time[]`/`access_time[]`.","locations":[{"ref":"src/device/dram/ddr2.c:421-473","code":"  421 | \tdimm->cas_supported = spd[18];\n  422 | \tif ((dimm->cas_supported & 0x3) || !dimm->cas_supported) {\n  423 | \t\tprintk(BIOS_WARNING, \"SPD decode: invalid CAS support advertised.\\n\");\n  424 | \t\tret = SPD_STATUS_INVALID_FIELD;\n  425 | \t}\n  426 | \tprintram(\"  Supported CAS mask : 0x%x\\n\", dimm->cas_supported);\n  427 | \n  428 | \tif ((dimm->rev < 0x13) && (dimm->cas_supported & 0x80)) {\n  429 | \t\tprintk(BIOS_WARNING, \"SPD decode: invalid CAS support advertised.\\n\");\n  430 | \t\tret = SPD_STATUS_INVALID_FIELD;\n  431 | \t}\n  432 | \tif ((dimm->rev < 0x12) && (dimm->cas_supported & 0x40)) {\n  433 | \t\tprintk(BIOS_WARNING, \"SPD decode: invalid CAS support advertised.\\n\");\n  434 | \t\tret = SPD_STATUS_INVALID_FIELD;\n  435 | \t}\n  436 | \n  437 | \t/* CL=X */\n  438 | \tcl = spd_get_msbs(dimm->cas_supported);\n  439 | \n  440 | \t/* SDRAM Cycle time at Maximum Supported CAS Latency (CL), CL=X */\n  441 | \tif (spd_decode_tck_time(&dimm->cycle_time[cl], spd[9]) != CB_SUCCESS) {\n  442 | \t\tprintk(BIOS_WARNING, \"SPD decode: invalid min tCL for CAS%d\\n\", cl);\n  443 | \t\tret = SPD_STATUS_INVALID_FIELD;\n  444 | \t}\n  445 | \t/* SDRAM Access from Clock */\n  446 | \tif (spd_decode_bcd_time(&dimm->access_time[cl], spd[10]) != CB_SUCCESS) {\n  447 | \t\tprintk(BIOS_WARNING, \"SPD decode: invalid min tAC for CAS%d\\n\", cl);\n  448 | \t\tret = SPD_STATUS_INVALID_FIELD;\n  449 | \t}\n  450 | \n  451 | \tif (dimm->cas_supported & (1 << (cl - 1))) {\n  452 | \t\t/* Minimum Clock Cycle at CLX-1 */\n  453 | \t\tif (spd_decode_tck_time(&dimm->cycle_time[cl - 1], spd[23]) != CB_SUCCESS) {\n  454 | \t\t\tprintk(BIOS_WARNING, \"SPD decode: invalid min tCL for CAS%d\\n\", cl - 1);\n  455 | \t\t\tret = SPD_STATUS_INVALID_FIELD;\n  456 | \t\t}\n  457 | \t\t/* Maximum Data Access Time (tAC) from Clock at CLX-1 */\n  458 | \t\tif (spd_decode_bcd_time(&dimm->access_time[cl - 1], spd[24]) != CB_SUCCESS) {\n  459 | \t\t\tprintk(BIOS_WARNING, \"SPD decode: invalid min tAC for CAS%d\\n\", cl - 1);\n  460 | \t\t\tret = SPD_STATUS_INVALID_FIELD;\n  461 | \t\t}\n  462 | \t}\n  463 | \tif (dimm->cas_supported & (1 << (cl - 2))) {\n  464 | \t\t/* Minimum Clock Cycle at CLX-2 */\n  465 | \t\tif (spd_decode_tck_time(&dimm->cycle_time[cl - 2], spd[25]) != CB_SUCCESS) {\n  466 | \t\t\tprintk(BIOS_WARNING, \"SPD decode: invalid min tCL for CAS%d\\n\", cl - 2);\n  467 | \t\t\tret = SPD_STATUS_INVALID_FIELD;\n  468 | \t\t}\n  469 | \t\t/* Maximum Data Access Time (tAC) from Clock at CLX-2 */\n  470 | \t\tif (spd_decode_bcd_time(&dimm->access_time[cl - 2], spd[26]) != CB_SUCCESS) {\n  471 | \t\t\tprintk(BIOS_WARNING, \"SPD decode: invalid min tAC for CAS%d\\n\", cl - 2);\n  472 | \t\t\tret = SPD_STATUS_INVALID_FIELD;\n  473 | \t\t}","lines":53,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/device/dram/ddr2.c#L421-L473"}]},{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In SHA1Update(), the expression (len << 3) is computed using the type of len, which is size_t. On 32-bit targets size_t is 32 bits, so the shift overflows to zero (or wraps) when len >= 0x20000000 (512 MiB). The overflowed value is then added to context->count (u64), silently producing a wrong bit-count and therefore a wrong digest for inputs larger than 512 MiB on 32-bit builds.","fix":"Cast len to u64 before shifting: context->count += ((u64)len << 3);","locations":[{"ref":"payloads/libpayload/crypto/sha1.c:143","code":"  143 | \tcontext->count += (len << 3);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/crypto/sha1.c#L143"}]},{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In tui.c, padstr() uses a static char buf[MAXSTRLEN] (256 bytes). The format string produced is '%-<length>s', where length is the caller-supplied field width. When length (which equals COLS or COLS-3) exceeds 255, the sprintf() call writes more than 256 bytes into buf, overflowing the static buffer. COLS > 255 is common on modern or wide terminals.","fix":"Either allocate buf dynamically (malloc(length + 1)) or increase MAXSTRLEN to a safe value and enforce the limit before calling sprintf.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/tui.c:71-79","code":"   71 | {\n   72 |     static char buf[MAXSTRLEN];\n   73 |     char fmt[10];\n   74 | \n   75 |     sprintf(fmt, (int)strlen(s) > length ? \"%%.%ds\" : \"%%-%ds\", length);\n   76 |     sprintf(buf, fmt, s);\n   77 | \n   78 |     return buf;\n   79 | }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/tui.c#L71-L79"}]},{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"vwprintw() uses a 513-byte local buffer 'printbuf' and, when HAVE_VSNPRINTF is not defined, falls back to vsprintf() with no length limit. vsprintf() can write arbitrarily large output into printbuf, overflowing the buffer if the formatted string exceeds 512 characters. The vsnprintf() path is safe (limit of 512 bytes including null fits in 513 bytes), but the fallback path has no guard.","fix":"Replace the vsprintf fallback with a size-limited alternative. If vsnprintf is not available, either implement a bounded sprintf wrapper or increase printbuf and truncate. At minimum add a compile-time assertion that HAVE_VSNPRINTF is defined for safety.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/printw.c:43-53","code":"   43 |     char printbuf[513];\n   44 |     int len;\n   45 | \n   46 |     PDC_LOG((\"vwprintw() - called\\n\"));\n   47 | \n   48 | #ifdef HAVE_VSNPRINTF\n   49 |     len = vsnprintf(printbuf, 512, fmt, varglist);\n   50 | #else\n   51 |     len = vsprintf(printbuf, fmt, varglist);\n   52 | #endif\n   53 |     return (waddstr(win, printbuf) == ERR) ? ERR : len;","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/printw.c#L43-L53"}]},{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"is_linetouched() accepts line == win->_maxy due to an off-by-one in the guard condition. The check is 'if (!win || line > win->_maxy || line < 0) return FALSE'. When line == win->_maxy, the check passes, and the code accesses win->_firstch[win->_maxy], which is one past the end of the win->_maxy-element array. The arrays _firstch and _lastch are allocated with exactly nlines (== _maxy) elements, so index _maxy is always out of bounds. The same off-by-one exists in touchline() and wtouchln() at their guard conditions (line 81, line 118), though for those functions, start == _maxy or y == _maxy simply causes the subsequent loop to run zero iterations, which is harmless.","fix":"Change the condition to 'line >= win->_maxy' (strict greater-than-or-equal): 'if (!win || line >= win->_maxy || line < 0) return FALSE;'","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/touch.c:138-146","code":"  138 | bool is_linetouched(WINDOW *win, int line)\n  139 | {\n  140 |     PDC_LOG((\"is_linetouched() - called: win=%p line=%d\\n\", win, line));\n  141 | \n  142 |     if (!win || line > win->_maxy || line < 0)\n  143 |         return FALSE;\n  144 | \n  145 |     return (win->_firstch[line] != _NO_CHANGE) ? TRUE : FALSE;\n  146 | }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/touch.c#L138-L146"}]},{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"PDC_mbstowcs() (PDC_FORCE_UTF8 path) writes a null terminator one element past the end of the destination buffer when the input exactly fills the buffer. The loop 'while (*src && i < n)' exits when i equals n (after the last increment). The line 'dest[i] = 0' then writes to dest[n], which is one past the n-element buffer. Callers such as slk_set() pass a fixed-size wchar_t array with n as its character capacity, so this off-by-one reliably writes one wchar_t beyond the array.","fix":"Cap i before writing the terminator: the loop should run while (*src && i < n - 1) to leave room for the null, or add 'if (i > n) i = n; dest[i] = 0;' after the loop (where dest has n+1 elements). Better still, allocate and document dest as having n+1 elements and keep the existing logic.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/util.c:253-268","code":"  253 |     while (*src && i < n)\n  254 |     {\n  255 |         int retval = PDC_mbtowc(dest + i, src, len);\n  256 | \n  257 |         if (retval < 1)\n  258 |             return -1;\n  259 | \n  260 |         src += retval;\n  261 |         len -= retval;\n  262 |         i++;\n  263 |     }\n  264 | # else\n  265 |     size_t i = mbstowcs(dest, src, n);\n  266 | # endif\n  267 |     dest[i] = 0;\n  268 |     return i;","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/util.c#L253-L268"}]},{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`Total_Buffer_Size()` in form.priv.h computes:\n  (Buffer_Length(field) + 1) * (1 + field->nbuf) * sizeof(FIELD_CELL)\nwhere Buffer_Length = drows * dcols. Both `drows` and `dcols` are `int` (set\ndirectly from caller-supplied `rows+nrow` and `cols` in `new_field()`). For\nlarge values the intermediate multiplication `drows * dcols` overflows a signed\nint (UB), and the subsequent multiplication with `(1 + nbuf) * sizeof(FIELD_CELL)`\ncan overflow `size_t`, producing a truncated length passed to `malloc()`. The\nresulting undersized buffer is then written past its end during the buffer-fill\nloop in `new_field()`.","fix":"Perform the size calculation in `size_t` throughout and check for overflow before\ncalling malloc. Example:\n  size_t buf_len = (size_t)field->drows * (size_t)field->dcols;\n  size_t total   = (buf_len + 1) * (size_t)(1 + field->nbuf) * sizeof(FIELD_CELL);\n  if (buf_len == 0 || total / (buf_len + 1) != (size_t)(1 + field->nbuf) * sizeof(FIELD_CELL))\n      /* overflow */;\nAlso add upper-bound validation of `rows`, `cols`, `nrow`, and `nbuf` in\n`new_field()`.","locations":[{"ref":"payloads/libpayload/curses/form/form.priv.h:120-124","code":"  120 | #define Buffer_Length(field) ((field)->drows * (field)->dcols)\n  121 | \n  122 | /* Calculate the total size of all buffers for this field */\n  123 | #define Total_Buffer_Size(field) \\\n  124 |    ( (Buffer_Length(field) + 1) * (1+(field)->nbuf) * sizeof(FIELD_CELL) )","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/form.priv.h#L120-L124"},{"ref":"payloads/libpayload/curses/form/fld_def.c:285-333","code":"  285 |   if (rows > 0 &&\n  286 |       cols > 0 &&\n  287 |       frow >= 0 &&\n  288 |       fcol >= 0 &&\n  289 |       nrow >= 0 &&\n  290 |       nbuf >= 0 &&\n  291 |       ((err = E_SYSTEM_ERROR) != 0) &&\t/* trick: this resets the default error */\n  292 |       (New_Field = typeMalloc(FIELD, 1)) != 0)\n  293 |     {\n  294 |       T((T_CREATE(\"field %p\"), (void *)New_Field));\n  295 |       *New_Field = default_field;\n  296 |       New_Field->rows = rows;\n  297 |       New_Field->cols = cols;\n  298 |       New_Field->drows = rows + nrow;\n  299 |       New_Field->dcols = cols;\n  300 |       New_Field->frow = frow;\n  301 |       New_Field->fcol = fcol;\n  302 |       New_Field->nrow = nrow;\n  303 |       New_Field->nbuf = nbuf;\n  304 |       New_Field->link = New_Field;\n  305 | \n  306 | #if USE_WIDEC_SUPPORT\n  307 |       New_Field->working = newpad(1, Buffer_Length(New_Field) + 1);\n  308 |       New_Field->expanded = typeCalloc(char *, 1 + (unsigned)nbuf);\n  309 | #endif\n  310 | \n  311 |       if (_nc_Copy_Type(New_Field, &default_field))\n  312 | \t{\n  313 | \t  size_t len;\n  314 | \n  315 | \t  len = Total_Buffer_Size(New_Field);\n  316 | \t  if ((New_Field->buf = (FIELD_CELL *)malloc(len)))\n  317 | \t    {\n  318 | \t      /* Prefill buffers with blanks and insert terminating zeroes\n  319 | \t         between buffers */\n  320 | \t      int i, j;\n  321 | \t      int cells = Buffer_Length(New_Field);\n  322 | \n  323 | \t      for (i = 0; i <= New_Field->nbuf; i++)\n  324 | \t\t{\n  325 | \t\t  FIELD_CELL *buffer = &(New_Field->buf[(cells + 1) * i]);\n  326 | \n  327 | \t\t  for (j = 0; j < cells; ++j)\n  328 | \t\t    {\n  329 | \t\t      buffer[j] = blank;\n  330 | \t\t    }\n  331 | \t\t  buffer[j] = zeros;\n  332 | \t\t}\n  333 | \t      returnField(New_Field);","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fld_def.c#L285-L333"}]},{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In Check_This_Field for TYPE_INTEGER (fty_int.c), the validated value is formatted\nwith sprintf(buf, \"%.*ld\", (prec > 0 ? prec : 0), val) into a 100-byte stack buffer.\nWhen 'prec' is large (e.g. caller passes 200), the formatted output can far exceed\n100 bytes, overflowing the stack buffer 'buf'. There is no upper bound check on\nprec before the sprintf call.","fix":"Clamp precision before formatting:\n  int safe_prec = (prec > 0 && prec < 90) ? prec : 0;\n  sprintf(buf, \"%.*ld\", safe_prec, val);\nOr use snprintf with a length limit and verify the result fits.","locations":[{"ref":"payloads/libpayload/curses/form/fty_int.c:172-237","code":"  172 |   char buf[100];\n  173 |   bool result = FALSE;\n  174 | \n  175 |   while (*bp && *bp == ' ')\n  176 |     bp++;\n  177 |   if (*bp)\n  178 |     {\n  179 |       if (*bp == '-')\n  180 | \tbp++;\n  181 | #if USE_WIDEC_SUPPORT\n  182 |       if (*bp)\n  183 | \t{\n  184 | \t  bool blank = FALSE;\n  185 | \t  int len;\n  186 | \t  int n;\n  187 | \t  wchar_t *list = _nc_Widen_String((char *)bp, &len);\n  188 | \n  189 | \t  if (list != 0)\n  190 | \t    {\n  191 | \t      result = TRUE;\n  192 | \t      for (n = 0; n < len; ++n)\n  193 | \t\t{\n  194 | \t\t  if (blank)\n  195 | \t\t    {\n  196 | \t\t      if (list[n] != ' ')\n  197 | \t\t\t{\n  198 | \t\t\t  result = FALSE;\n  199 | \t\t\t  break;\n  200 | \t\t\t}\n  201 | \t\t    }\n  202 | \t\t  else if (list[n] == ' ')\n  203 | \t\t    {\n  204 | \t\t      blank = TRUE;\n  205 | \t\t    }\n  206 | \t\t  else if (!isDigit(list[n]))\n  207 | \t\t    {\n  208 | \t\t      result = FALSE;\n  209 | \t\t      break;\n  210 | \t\t    }\n  211 | \t\t}\n  212 | \t      free(list);\n  213 | \t    }\n  214 | \t}\n  215 | #else\n  216 |       while (*bp)\n  217 | \t{\n  218 | \t  if (!isdigit(UChar(*bp)))\n  219 | \t    break;\n  220 | \t  bp++;\n  221 | \t}\n  222 |       while (*bp && *bp == ' ')\n  223 | \tbp++;\n  224 |       result = (*bp == '\\0');\n  225 | #endif\n  226 |       if ( 6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_num.c#L181-L275"}]},{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In tinycurses.c waddch() and waddnstr(), win->_curx is incremented without checking against win->_maxx. Writing past _maxx writes into the next row's text buffer (or beyond) in the statically allocated linebuf_list, causing silent memory corruption. The comment `// FIXME` at lines 524 and 554 acknowledges this.","fix":"After incrementing win->_curx, check `if (win->_curx > win->_maxx)` and either stop writing or wrap to the next row (with corresponding _cury increment and _maxy check).","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:503-532","code":"  503 | int waddch(WINDOW *win, const chtype ch)\n  504 | {\n  505 | \tint code = ERR;\n  506 | \t// NCURSES_CH_T wch;\n  507 | \t// SetChar2(wch, ch);\n  508 | \n  509 | \tif (win->_line[win->_cury].firstchar == _NOCHANGE ||\n  510 | \t\t\twin->_line[win->_cury].firstchar > win->_curx)\n  511 | \t\twin->_line[win->_cury].firstchar = win->_curx;\n  512 | \n  513 | \twin->_line[win->_cury].text[win->_curx].chars[0] =\n  514 | \t\t((ch) & (chtype)A_CHARTEXT);\n  515 | \n  516 | \twin->_line[win->_cury].text[win->_curx].attr = WINDOW_ATTRS(win);\n  517 | \twin->_line[win->_cury].text[win->_curx].attr |=\n  518 | \t\t((ch) & (chtype)A_ATTRIBUTES);\n  519 | \n  520 | \tif (win->_line[win->_cury].lastchar == _NOCHANGE ||\n  521 | \t\t\twin->_line[win->_cury].lastchar < win->_curx)\n  522 | \t\twin->_line[win->_cury].lastchar = win->_curx;\n  523 | \n  524 | \twin->_curx++;\t// FIXME\n  525 | \n  526 | \t// if (win && (waddch_nosync(win, wch) != ERR)) {\n  527 | \t// \t_nc_synchook(win);\n  528 | \t// \tcode = OK;\n  529 | \t// }\n  530 | \n  531 | \treturn code;\n  532 | }","lines":30,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curse values or use int64_t for the intermediates. Alternatively, call mouse_cursor_get_rel() frequently enough that values never accumulate large sums.","locations":[{"ref":"payloads/libpayload/drivers/mouse_cursor.c:89-116","code":"   89 | void mouse_cursor_poll(void)\n   90 | {\n   91 | \tstruct mouse_cursor_input_driver *in;\n   92 | \tint rel_x, rel_y, rel_z;\n   93 | \tu32 buttons;\n   94 | \n   95 | \tmouse_buttons = 0;\n   96 | \t/* Iterate over all connected drivers */\n   97 | \tfor (in = cursor_in; in != NULL; in = in->next)\n   98 | \t\tif (in->get_state) {\n   99 | \t\t\tin->get_state(&rel_x, &rel_y, &rel_z, &buttons);\n  100 | \n  101 | \t\t\t/* Accumulate relative movement */\n  102 | \t\t\tif (mouse_cusor_is_fast(rel_x, rel_y)) {\n  103 | \t\t\t\t/* Apply simple cursor acceleration. Default: x2.6 */\n  104 | \t\t\t\tmouse_rel_x += rel_x * mouse_speed;\n  105 | \t\t\t\tmouse_rel_y += rel_y * mouse_speed;\n  106 | \t\t\t\tmouse_rel_z += rel_z * mouse_speed;\n  107 | \t\t\t} else {\n  108 | \t\t\t\tmouse_rel_x += rel_x * 256;\n  109 | \t\t\t\tmouse_rel_y += rel_y * 256;\n  110 | \t\t\t\tmouse_rel_z += rel_z * 256;\n  111 | \t\t\t}\n  112 | \n  113 | \t\t\t/* Logic or all buttons */\n  114 | \t\t\tmouse_buttons |= buttons;\n  115 | \t\t}\n  116 | }","lines":28,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/mouse_cursor.c#L89-L116"}]},{"id":"OVF_23","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`acpigen_write_field_length()` encodes a length into a fixed `uint8_t emit[4]` buffer, but the loop `while (len) { emit[i] = len & 0xFF; i++; len >>= 8; }` can write past index 3. After `emit[0] = len & 0xF; len >>= 4;`, `len` can hold up to 28 significant bits, which requires 4 follow-on bytes (`emit[1]`..`emit[4]`), so `emit[4]` is written one element out of bounds on the stack, and then `for (j = 0; j < i; j++) acpigen_emit_byte(emit[j])` emits 5 bytes (also reading the OOB byte). This triggers when the encoded length is `>= 0x10000000` (2^28). The ACPI PkgLength encoding only supports 28-bit lengths, and `acpigen_write_field_offset()` already guards with `if (diff_bits > 0xFFFFFFF) return;`, but `acpigen_write_field_name()`/`acpigen_write_field_reserved()` call `acpigen_write_field_length()` with an unguarded `size`. It is reachable via `acpigen_write_field()`/`acpigen_write_rom()` (e.g. `FIELDLIST_NAMESTR(\"RBF0\", 8 * length)` for a ROM `>= 32 MiB`) or any caller passing a large `bits` field.","fix":"Add the same 28-bit guard used by `acpigen_write_field_offset()` at the top of `acpigen_write_field_length()`, e.g. `if (len > 0xFFFFFFF) { printk(BIOS_WARNING, \"%s: length too large to encode\\n\", __func__); return; }`, so `emit[]` never needs more than 4 bytes. Alternatively size the buffer `uint8_t emit[4]` correctly and bound the loop to `i < ARRAY_SIZE(emit)`.","locations":[{"ref":"src/acpi/acpigen.c:538-560","code":"  538 | static void acpigen_write_field_length(uint32_t len)\n  539 | {\n  540 | \tuint8_t i, j;\n  541 | \tuint8_t emit[4];\n  542 | \n  543 | \ti = 1;\n  544 | \tif (len < 0x40) {\n  545 | \t\temit[0] = len & 0x3F;\n  546 | \t} else {\n  547 | \t\temit[0] = len & 0xF;\n  548 | \t\tlen >>= 4;\n  549 | \t\twhile (len) {\n  550 | \t\t\temit[i] = len & 0xFF;\n  551 | \t\t\ti++;\n  552 | \t\t\tlen >>= 8;\n  553 | \t\t}\n  554 | \t}\n  555 | \t/* Update bit 7:6 : Number of bytes followed by emit[0] */\n  556 | \temit[0] |= (i - 1) << 6;\n  557 | \n  558 | \tfor (j = 0; j < i; j++)\n  559 | \t\tacpigen_emit_byte(emit[j]);\n  560 | }","lines":23,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/acpigen.c#L538-L560"},{"ref":"src/acpi/acpigen.c:582-592","code":"  582 | void acpigen_write_field_name(const char *name, uint32_t size)\n  583 | {\n  584 | \tacpigen_emit_simple_namestring(name);\n  585 | \tacpigen_write_field_length(size);\n  586 | }\n  587 | \n  588 | static void acpigen_write_field_reserved(uint32_t size)\n  589 | {\n  590 | \tacpigen_emit_byte(0);\n  591 | \tacpigen_write_field_length(size);\n  592 | }","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/acpigen.c#L582-L592"}]},{"id":"OVF_24","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`dt_adjust_phandle()` guards the access with `if (offset + 4 > prop->prop.size)` where both `offset` and `prop->prop.size` are `uint32_t`. When `offset` is close to `UINT32_MAX` (e.g. `0xFFFFFFFD`), `offset + 4` wraps to a small value and passes the check, after which `be32dec(prop->prop.data + offset)` performs a wild out-of-bounds read and `be32enc(prop->prop.data + offset, phandle)` performs an out-of-bounds write. The `offset` is fully controlled by overlay-supplied data: `dt_fixup_locals()` calls `dt_adjust_phandle(base_prop, base, be32dec(fixup_prop->prop.data + i))`, i.e. the offset is read verbatim from the `/__local_fixups__` property contents. The same wrapping pattern exists in `dt_fixup_external()` at the `offset + 4 > ovl_prop->prop.size` check, where `offset` comes from `skip_atoi()` on untrusted overlay text and is then used in `be32enc(ovl_prop->prop.data + offset, phandle)`.","fix":"Compare without adding to the offset so no overflow can occur. In `dt_adjust_phandle()` change `if (offset + 4 > prop->prop.size)` to `if (offset > prop->prop.size - 4 || prop->prop.size < 4)`, and in `dt_fixup_external()` change `offset + 4 > ovl_prop->prop.size` to `ovl_prop->prop.size < 4 || offset > ovl_prop->prop.size - 4`.","locations":[{"ref":"src/commonlib/device_tree.c:1683-1701","code":" 1683 | static uint32_t dt_adjust_phandle(struct device_tree_property *prop,\n 1684 | \t\t\t\t  uint32_t adjustment, uint32_t offset)\n 1685 | {\n 1686 | \tif (offset + 4 > prop->prop.size)\n 1687 | \t\treturn 0;\n 1688 | \n 1689 | \tuint32_t phandle = be32dec(prop->prop.data + offset);\n 1690 | \tif (phandle == 0 ||\n 1691 | \t    phandle == FDT_PHANDLE_ILLEGAL ||\n 1692 | \t    phandle == 0xffffffff)\n 1693 | \t\treturn 0;\n 1694 | \n 1695 | \tphandle += adjustment;\n 1696 | \tif (phandle >= FDT_PHANDLE_ILLEGAL)\n 1697 | \t\treturn 0;\n 1698 | \n 1699 | \tbe32enc(prop->prop.data + offset, phandle);\n 1700 | \treturn phandle;\n 1701 | }","lines":19,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/device_tree.c#L1683-L1701"},{"ref":"src/commonlib/device_tree.c:1878-1884","code":" 1878 | \t\t/* Move entry to first char after number, must be a '\\0'. */\n 1879 | \t\tuint32_t offset = skip_atoi(&entry);\n 1880 | \t\tif (!ovl_prop || offset + 4 > ovl_prop->prop.size || entry[0])\n 1881 | \t\t\treturn -1;\n 1882 | \t\tentry++;  /* jump over '\\0' to potential next fixup */\n 1883 | \n 1884 | \t\tbe32enc(ovl_prop->prop.data + offset, phandle);","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/device_tree.c#L1878-L1884"}]},{"id":"OVF_25","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `sp_tx_edid_read()`, `edid_pos` is a `uint8_t` but is computed as `(i + count * 8) * MAX_DPCD_BUFFER_SIZE` where `MAX_DPCD_BUFFER_SIZE == 16`. For the `case 2`/`case 3` path (reached whenever the panel reports two or more EDID extension blocks, i.e. `blocks_num >= 2`), the value reaches `(0 + 2*8)*16 = 256` up to `(7 + 3*8)*16 = 496`, all of which overflow the 8-bit `edid_pos` and wrap to `0..240`. The subsequent guard `if (edid_pos <= size - MAX_DPCD_BUFFER_SIZE)` (where `size == FOUR_BLOCK_SIZE == 512`) is therefore always true, and `memcpy(&pedid_blocks_buf[edid_pos], pblock_buf, MAX_DPCD_BUFFER_SIZE)` writes the third/fourth 128-byte EDID blocks over the already-populated first/second blocks instead of at offsets 256..511. The result is a corrupted EDID handed to `decode_edid()`, producing wrong display timings. The sibling `case 0`/`case 1` uses `offset` whose max value 240 fits in `uint8_t`, so only `edid_pos` is affected.","fix":"Widen `edid_pos` so the block offset cannot truncate. Change the declaration:\n```c\n// before\n\tuint8_t offset, edid_pos;\n// after\n\tuint8_t offset;\n\tunsigned int edid_pos;\n```","locations":[{"ref":"src/drivers/analogix/anx7625/anx7625.c:605","code":"  605 | \tuint8_t offset, edid_pos;","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/analogix/anx7625/anx7625.c#L605"},{"ref":"src/drivers/analogix/anx7625/anx7625.c:649-661","code":"  649 | \t\t\tfor (i = 0; i < 8; i++) {\n  650 | \t\t\t\tedid_pos = (i + count * 8) *\n  651 | \t\t\t\t\tMAX_DPCD_BUFFER_SIZE;\n  652 | \n  653 | \t\t\t\tif (g_edid_break)\n  654 | \t\t\t\t\tbreak;\n  655 | \n  656 | \t\t\t\tsegments_edid_read(bus, count / 2,\n  657 | \t\t\t\t\t\t   pblock_buf, offset);\n  658 | \t\t\t\tif (edid_pos <= size - MAX_DPCD_BUFFER_SIZE)\n  659 | \t\t\t\t\tmemcpy(&pedid_blocks_buf[edid_pos],\n  660 | \t\t\t\t\t       pblock_buf,\n  661 | \t\t\t\t\t       MAX_DPCD_BUFFER_SIZE);","lines":13,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/analogix/anx7625/anx7625.c#L649-L661"}]},{"id":"OVF_26","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `crb_tpm_process_command()` the response length is read from the TPM-controlled response header (`length = be32_to_cpu(read32(control_area.response_bfr + 2))`) and only checked for the lower bound (`if (length < 6) return 1`). It is never bounded by `max_response` (the caller's `recvbuf` size) before `memcpy(tpm2_response, control_area.response_bfr, length)`. The earlier check `if (control_area.response_size < max_response)` only guarantees the hardware buffer is at least `max_response`; it does not constrain `length`. A TPM that reports `length > max_response` (up to `response_size`) overflows the caller's response buffer with hardware-controlled data.","fix":"Reject/clamp the reported length against `max_response` before copying, e.g. `if (length > max_response) { printk(BIOS_ERR, \"TPM: response too large\\n\"); return -1; }` prior to the `memcpy`.","locations":[{"ref":"src/drivers/crb/tpm.c:289-297","code":"  289 | \t// Get Response Length\n  290 | \tuint32_t length = be32_to_cpu(read32(control_area.response_bfr + 2));\n  291 | \n  292 | \t/* Response has to have at least 6 bytes */\n  293 | \tif (length < 6)\n  294 | \t\treturn 1;\n  295 | \n  296 | \t// Copy Response\n  297 | \tmemcpy(tpm2_response, control_area.response_bfr, length);","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/crb/tpm.c#L289-L297"}]},{"id":"OVF_27","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `tpm_tis_i2c_recv()` the response length `expected` is read from the TPM response header and only checked against an upper bound (`(size_t)expected > count`). It is never checked against the lower bound `TPM_HEADER_SIZE`. If a malformed/faulty TPM returns a size field `< 10`, the expression `expected - TPM_HEADER_SIZE` (both operands promote to `uint32_t`/`size_t`) underflows to a huge value that is passed as the `count` argument to `recv_data()`, which then loops reading TPM data into `&buf[TPM_HEADER_SIZE]` far past the caller's buffer, causing an out-of-bounds write in security-sensitive code.","fix":"Add a lower-bound check before the subtraction. Before:\n```\nif ((size_t)expected > count) {\n\tsize = -1;\n\tgoto out;\n}\n```\nAfter:\n```\nif ((size_t)expected > count || expected < TPM_HEADER_SIZE) {\n\tsize = -1;\n\tgoto out;\n}\n```","locations":[{"ref":"src/drivers/i2c/tpm/tpm.c:371-378","code":"  371 | \tmemcpy(&expected, buf + TPM_RSP_SIZE_BYTE, sizeof(expected));\n  372 | \texpected = be32_to_cpu(expected);\n  373 | \tif ((size_t)expected > count) {\n  374 | \t\tsize = -1;\n  375 | \t\tgoto out;\n  376 | \t}\n  377 | \n  378 | \tsize += recv_data(&buf[TPM_HEADER_SIZE], expected - TPM_HEADER_SIZE);","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/i2c/tpm/tpm.c#L371-L378"}]},{"id":"OVF_28","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In dos/pdcclip.c PDC_setclipboard() and dos/pdcclip.c PDC_getclipboard(), the `length`\nparameter is typed as `long`. On platforms where `long` is 32-bit, a caller providing\na length larger than SIZE_MAX/2 would cause `malloc(length + 1)` to integer-overflow to a\nsmall value, then strcpy() would overflow the undersized buffer. Although in practice clipboard\ncontents are unlikely to be gigantic, the parameter type and the lack of a length sanity check\ncreate a latent vulnerability.","fix":"Add a sanity check such as `if (length < 0 || (size_t)length > SIZE_MAX - 1) return PDC_CLIP_MEMORY_ERROR;` before calling malloc. Consider using memcpy with the known length instead of strcpy.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/dos/pdcclip.c:71-90","code":"   71 | int PDC_setclipboard(const char *contents, long length)\n   72 | {\n   73 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n   74 | \n   75 |     if (pdc_DOS_clipboard)\n   76 |     {\n   77 |         free(pdc_DOS_clipboard);\n   78 |         pdc_DOS_clipboard = NULL;\n   79 |     }\n   80 | \n   81 |     if (contents)\n   82 |     {\n   83 |         if ((pdc_DOS_clipboard = malloc(length + 1)) == NULL)\n   84 |             return PDC_CLIP_MEMORY_ERROR;\n   85 | \n   86 |         strcpy(pdc_DOS_clipboard, contents);\n   87 |     }\n   88 | \n   89 |     return PDC_CLIP_SUCCESS;\n   90 | }","lines":20,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/dos/pdcclip.c#L71-L90"},{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcclip.c:101-149","code":"  101 | int PDC_setclipboard(const char *contents, long length)\n  102 | {\n  103 | #ifndef EMXVIDEO\n  104 |     HAB hab;\n  105 |     PTIB ptib;\n  106 |     PPIB ppib;\n  107 |     ULONG ulRC;\n  108 |     PSZ szTextOut = NULL;\n  109 |     int rc;\n  110 | #endif\n  111 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n  112 | \n  113 | #ifndef EMXVIDEO\n  114 |     DosGetInfoBlocks(&ptib, &ppib);\n  115 |     ppib->pib_ultype = 3;\n  116 |     hab = WinInitialize(0);\n  117 | \n  118 |     if (!WinOpenClipbrd(hab))\n  119 |     {\n  120 |         WinTerminate(hab);\n  121 |         return PDC_CLIP_ACCESS_ERROR;\n  122 |     }\n  123 | \n  124 |     rc = PDC_CLIP_MEMORY_ERROR;\n  125 | \n  126 |     ulRC = DosAllocSharedMem((PVOID)&szTextOut, NULL, length + 1,\n  127 |                              PAG_WRITE | PAG_COMMIT | OBJ_GIVEABLE);\n  128 | \n  129 |     if (ulRC == 0)\n  130 |     {\n  131 |         strcpy(szTextOut, contents);\n  132 |         WinEmptyClipbrd(hab);\n  133 | \n  134 |         if (WinSetClipbrdData(hab, (ULONG)szTextOut, CF_TEXT, CFI_POINTER))\n  135 |             rc = PDC_CLIP_SUCCESS;\n  136 |         else\n  137 |         {\n  138 |             DosFreeMem(szTextOut);\n  139 |             rc = PDC_CLIP_ACCESS_ERROR;\n  140 |         }\n  141 |     }\n  142 | \n  143 |     WinCloseClipbrd(hab);\n  144 |     WinTerminate(hab);\n  145 | \n  146 |     return rc;\n  147 | #else\n  148 |     return PDC_CLIP_ACCESS_ERROR;\n  149 | #endif","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcclip.c#L101-L149"}]},{"id":"OVF_29","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In options.c options_checksum_valid() and fix_options_checksum_with(), checksum_location is computed as (u32 cmos_checksum_location) / 8 and stored as int. It is then passed to nvram->read(checksum_location) and nvram->read(checksum_location+1). The nvram_accessor read function takes a u8 parameter, so any byte address above 255 is silently truncated. If coreboot reports a checksum location above byte 255, the wrong bytes are read/written, corrupting the checksum calculation silently.","fix":"Assert or check that checksum_location <= 254 (to allow checksum_location+1 to fit in u8), and return an error if not. Alternatively, extend the nvram_accessor interface to accept u16 addresses.","locations":[{"ref":"payloads/libpayload/drivers/options.c:62-77","code":"   62 | int options_checksum_valid(const struct nvram_accessor *nvram)\n   63 | {\n   64 | \tint i;\n   65 | \tint range_start = lib_sysinfo.cmos_range_start / 8;\n   66 | \tint range_end = lib_sysinfo.cmos_range_end / 8;\n   67 | \tint checksum_location = lib_sysinfo.cmos_checksum_location / 8;\n   68 | \tu16 checksum = 0, checksum_old;\n   69 | \n   70 | \tfor(i = range_start; i <= range_end; i++) {\n   71 | \t\tchecksum += nvram->read(i);\n   72 | \t}\n   73 | \n   74 | \tchecksum_old = ((nvram->read(checksum_location)<<8) | nvram->read(checksum_location+1));\n   75 | \n   76 | \treturn (checksum_old == checksum);\n   77 | }","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L62-L77"},{"ref":"payloads/libpayload/drivers/options.c:79-93","code":"   79 | void fix_options_checksum_with(const struct nvram_accessor *nvram)\n   80 | {\n   81 | \tint i;\n   82 | \tint range_start = lib_sysinfo.cmos_range_start / 8;\n   83 | \tint range_end = lib_sysinfo.cmos_range_end / 8;\n   84 | \tint checksum_location = lib_sysinfo.cmos_checksum_location / 8;\n   85 | \tu16 checksum = 0;\n   86 | \n   87 | \tfor(i = range_start; i <= range_end; i++) {\n   88 | \t\tchecksum += nvram->read(i);\n   89 | \t}\n   90 | \n   91 | \tnvram->write((checksum >> 8), checksum_location);\n   92 | \tnvram->write((checksum & 0xff), checksum_location + 1);\n   93 | }","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L79-L93"}]},{"id":"OVF_30","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In options.c get_cmos_value(), when the single-byte path is taken (len <= 8), the mask (1 << len) - 1 is computed with int arithmetic. If len == 8, 1 << 8 = 256, which fits in int but (1 << 8) - 1 = 0xFF. However if len == 32, 1 << 32 is undefined behavior in C (shift count >= width of type). The function only guards len <= 8 for this path, so len=32 does not reach here, but a future change loosening the guard could introduce UB.","fix":"Use (1u << len) - 1 and add a static_assert or runtime check that len <= 8 before this expression.","locations":[{"ref":"payloads/libpayload/drivers/options.c:112-116","code":"  112 | \tif(len <= 8) {\n  113 | \t\treg8 = nvram->read(addr);\n  114 | \t\treg8 >>= bit;\n  115 | \t\tvalue[0] = reg8 & ((1 << len) -1);\n  116 | \t\treturn 0;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L112-L116"}]},{"id":"OVF_31","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `soundwire_gen_multilane()` the lane-mapping loop is correctly bounded by `i < prop->lane_mapping_count && i < SOUNDWIRE_MAX_LANE`, but the sibling bus-holder loop iterates `for (i = 0; i < prop->lane_bus_holder_count; i++)` with no `SOUNDWIRE_MAX_LANE` clamp. Both `multilane_bus_holder_names[i]` (8 entries) and `prop->lane_bus_holder[i]` (declared `bool lane_bus_holder[SOUNDWIRE_MAX_LANE]`, i.e. 8) are indexed by `i`, so a devicetree config with `lane_bus_holder_count > SOUNDWIRE_MAX_LANE` causes an out-of-bounds read of both the names table and the config array. Additionally, `map->lane`, `map->connection.master_lane` and `map->connection.slave_link` used at lines 177-181 are not range-checked before indexing the 8-entry name tables.","fix":"Bound the bus-holder loop like the lane-mapping loop: `for (i = 0; i < prop->lane_bus_holder_count && i < SOUNDWIRE_MAX_LANE; i++)`, and defensively clamp/validate `map->lane`, `map->connection.master_lane` and `map->connection.slave_link` against `SOUNDWIRE_MAX_LANE` before using them as array indices.","locations":[{"ref":"src/acpi/soundwire.c:184-188","code":"  184 | \t/* Add bus holder properties. */\n  185 | \tfor (i = 0; i < prop->lane_bus_holder_count; i++)\n  186 | \t\tacpi_dp_add_integer(dsd, multilane_bus_holder_names[i],\n  187 | \t\t\t\t    prop->lane_bus_holder[i]);\n  188 | }","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/soundwire.c#L184-L188"},{"ref":"src/acpi/soundwire.c:171-182","code":"  171 | \tfor (i = 0; i < prop->lane_mapping_count && i < SOUNDWIRE_MAX_LANE; i++) {\n  172 | \t\tconst struct soundwire_multilane_map *map = &prop->lane_mapping[i];\n  173 | \t\tconst char *name;\n  174 | \n  175 | \t\t/* Get the name of this connection */\n  176 | \t\tif (map->direction == MASTER_LANE)\n  177 | \t\t\tname = multilane_master_lane_names[map->connection.master_lane];\n  178 | \t\telse\n  179 | \t\t\tname = multilane_slave_link_names[map->connection.slave_link];\n  180 | \n  181 | \t\tacpi_dp_add_string(dsd, multilane_names[map->lane], name);\n  182 | \t}","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/soundwire.c#L171-L182"}]},{"id":"OVF_32","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`te_relocate()` writes back the adjusted image base with `write_le64(&teih->ImageBase, (uint32_t)(image_base + adj))`. The cast to `uint32_t` truncates the sum to 32 bits before it is stored into the 64-bit `ImageBase` field, so any high 32 bits of a 64-bit TE image base are silently zeroed. This happens to be harmless for the 32-bit XIP FSP images this code normally processes, but the truncating cast inside a 64-bit write is misleading and wrong for any TE image whose base exceeds 4 GiB. Similarly `fixup_offset = read_le16(&teih->StrippedSize); fixup_offset -= sizeof(EFI_TE_IMAGE_HEADER);` will underflow (to a huge `size_t`) if a malformed `StrippedSize` is smaller than the header size, and the result is used unchecked as a pointer offset.","fix":"Drop the truncating cast so the full adjusted 64-bit value is stored: `write_le64(&teih->ImageBase, image_base + adj);`. Additionally, validate `read_le16(&teih->StrippedSize) >= sizeof(EFI_TE_IMAGE_HEADER)` before subtracting to avoid the `size_t` underflow.","locations":[{"ref":"src/commonlib/fsp_relocate.c:314-328","code":"  314 | \tfixup_offset = read_le16(&teih->StrippedSize);\n  315 | \tfixup_offset -= sizeof(EFI_TE_IMAGE_HEADER);\n  316 | \t/* Keep track of a base that is correctly adjusted so that offsets\n  317 | \t * can be used directly. */\n  318 | \tte_base = te;\n  319 | \tte_base -= fixup_offset;\n  320 | \n  321 | \timage_base = read_le64(&teih->ImageBase);\n  322 | \tadj = new_addr - (image_base + fixup_offset);\n  323 | \n  324 | \tprintk(FSP_DBG_LVL, \"TE Image %p -> %p adjust value: %x\\n\",\n  325 | \t\t(void *)image_base, (void *)new_addr, adj);\n  326 | \n  327 | \t/* Adjust ImageBase for consistency. */\n  328 | \twrite_le64(&teih->ImageBase, (uint32_t)(image_base + adj));","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/fsp_relocate.c#L314-L328"}]},{"id":"OVF_33","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `mmc_update_capacity` the EXT_CSD SEC_CNT bytes (external data from the card) are combined with `ext_csd[EXT_CSD_SEC_CNT + 3] << 24`. `ext_csd[...]` is an `unsigned char` promoted to `int`; when the top byte is >= 128 the shift produces a value greater than `INT_MAX`, which is signed-integer-overflow undefined behavior. The intent is an unsigned 32-bit assembly.","fix":"Cast each byte to `uint32_t` before shifting, e.g. `capacity = ((uint32_t)ext_csd[EXT_CSD_SEC_CNT + 0] << 0) | ((uint32_t)ext_csd[EXT_CSD_SEC_CNT + 1] << 8) | ((uint32_t)ext_csd[EXT_CSD_SEC_CNT + 2] << 16) | ((uint32_t)ext_csd[EXT_CSD_SEC_CNT + 3] << 24);` so the arithmetic is performed in unsigned 32-bit and the outer `(uint32_t)` cast is unnecessary.","locations":[{"ref":"src/commonlib/storage/mmc.c:420-423","code":"  420 | \tcapacity = (uint32_t)(ext_csd[EXT_CSD_SEC_CNT + 0] << 0 |\n  421 | \t\t    ext_csd[EXT_CSD_SEC_CNT + 1] << 8 |\n  422 | \t\t    ext_csd[EXT_CSD_SEC_CNT + 2] << 16 |\n  423 | \t\t    ext_csd[EXT_CSD_SEC_CNT + 3] << 24);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/storage/mmc.c#L420-L423"}]},{"id":"OVF_34","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`max_time` is read as `(msr.hi >> 16) & 0x7f`, giving a range of `0..127`, and is then used directly as an index into `power_limit_time_msr_to_sec[]`. That array is built with designated initializers whose highest index is `[0x70]` (112), so its size is only 113 entries (`0..112`). Any `max_time` value in `0x71..0x7f` (113..127) reads out of bounds past the static rodata array. The returned garbage byte is then used to (a) possibly overwrite `power_limit_1_time` and (b) index `power_limit_time_sec_to_msr[power_limit_1_time]`, potentially chaining into a second OOB read. `max_time` comes from the `MSR_PKG_POWER_SKU` hardware register, so a SKU reporting an out-of-table encoding triggers this. Identical bug exists in both the Haswell and SandyBridge/IvyBridge power-limit code.","fix":"Bound-check `max_time` against `ARRAY_SIZE(power_limit_time_msr_to_sec)` before indexing, e.g. `if (max_time < ARRAY_SIZE(power_limit_time_msr_to_sec) && power_limit_time_msr_to_sec[max_time] > power_limit_1_time) power_limit_1_time = power_limit_time_msr_to_sec[max_time];`, or size the array to 128 entries so the full `& 0x7f` range is always in bounds.","locations":[{"ref":"src/cpu/intel/haswell/haswell_init.c:283-288","code":"  283 | \tmax_time = (msr.hi >> 16) & 0x7f;\n  284 | \n  285 | \tprintk(BIOS_DEBUG, \"CPU TDP: %u Watts\\n\", tdp / power_unit);\n  286 | \n  287 | \tif (power_limit_time_msr_to_sec[max_time] > power_limit_1_time)\n  288 | \t\tpower_limit_1_time = power_limit_time_msr_to_sec[max_time];","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/haswell/haswell_init.c#L283-L288"},{"ref":"src/cpu/intel/model_206ax/model_206ax_init.c:123-128","code":"  123 | \tmax_time = (msr.hi >> 16) & 0x7f;\n  124 | \n  125 | \tprintk(BIOS_DEBUG, \"CPU TDP: %u Watts\\n\", tdp / power_unit);\n  126 | \n  127 | \tif (power_limit_time_msr_to_sec[max_time] > power_limit_1_time)\n  128 | \t\tpower_limit_1_time = power_limit_time_msr_to_sec[max_time];","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/model_206ax/model_206ax_init.c#L123-L128"}]},{"id":"OVF_35","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `ucode_get_ext_sig_table()` the bounds check `ext_tbl_len < (sizeof(struct ext_sig_table) + ext_tbl->ext_sig_cnt * sizeof(struct ext_sig_entry))` uses `ext_tbl->ext_sig_cnt`, a `u32` taken straight from the microcode blob. The multiplication `ext_sig_cnt * sizeof(struct ext_sig_entry)` (12 bytes) is done in `size_t`; on a 32-bit `size_t` build a large `ext_sig_cnt` (> ~357M) overflows and wraps to a small value, so the check passes even though the table does not actually fit. The caller `find_cbfs_microcode()` then iterates `for (i = 0; i < ext_tbl->ext_sig_cnt; i++, entry++)` reading `ext_sig_cnt` entries and dereferencing `entry->sig`/`entry->pf` far past the mapped CBFS region. Additionally `ext_tbl_len` (signed `ssize_t`) is implicitly converted to unsigned for the comparison. Reachability is limited because the microcode blob ships inside the firmware image, so severity is low, but it is a genuine integer-overflow-driven OOB read of externally-formatted data.","fix":"Validate `ext_sig_cnt` against an upper bound derived from `ext_tbl_len` without multiplying first, e.g. compute `max_entries = (ext_tbl_len - sizeof(struct ext_sig_table)) / sizeof(struct ext_sig_entry)` and reject when `ext_tbl->ext_sig_cnt > max_entries`. Keep the length in a signed/`size_t` type consistently to avoid the signed/unsigned comparison.","locations":[{"ref":"src/cpu/intel/microcode/microcode.c:149-167","code":"  149 | static struct ext_sig_table *ucode_get_ext_sig_table(const struct microcode *ucode)\n  150 | {\n  151 | \tstruct ext_sig_table *ext_tbl;\n  152 | \t/* header + ucode data blob size */\n  153 | \tu32 size = ucode->data_size + sizeof(struct microcode);\n  154 | \n  155 | \tssize_t ext_tbl_len = ucode->total_size - size;\n  156 | \n  157 | \tif (ext_tbl_len < (ssize_t)sizeof(struct ext_sig_table))\n  158 | \t\treturn NULL;\n  159 | \n  160 | \text_tbl = (struct ext_sig_table *)((uintptr_t)ucode + size);\n  161 | \n  162 | \tif (ext_tbl_len < (sizeof(struct ext_sig_table) +\n  163 | \t\t\t\text_tbl->ext_sig_cnt * sizeof(struct ext_sig_entry)))\n  164 | \t\treturn NULL;\n  165 | \n  166 | \treturn ext_tbl;\n  167 | }","lines":19,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/microcode/microcode.c#L149-L167"},{"ref":"src/cpu/intel/microcode/microcode.c:230-234","code":"  230 | \t\t\tfor (i = 0; i < ext_tbl->ext_sig_cnt; i++, entry++) {\n  231 | \t\t\t\tif ((sig == entry->sig) && (pf & entry->pf)) {\n  232 | \t\t\t\t\treturn ucode_updates;\n  233 | \t\t\t\t}\n  234 | \t\t\t}","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/microcode/microcode.c#L230-L234"}]},{"id":"OVF_36","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`azalia_find_verb()` reads the per-codec jack count `verb_table[idx + 2]` (and `verb_table[idx]`) inside the loop guarded only by `idx < (verb_table_bytes / sizeof(u32))`. Because `idx + 2` is dereferenced before validating it is in range, a truncated or malformed verb table (where a header's declared jack count does not land the running `idx` exactly on the table end) causes an out-of-bounds read past `verb_table`, and the subsequent `idx += verb_size + 3` can then walk further past the buffer. For well-formed compile-time tables this does not trigger, so impact is limited to malformed/hand-edited tables.","fix":"Bound-check each access against the table length, e.g. verify `idx + 2 < (verb_table_bytes / sizeof(u32))` before reading `verb_table[idx + 2]`, and verify `idx + 3 + verb_size <= (verb_table_bytes / sizeof(u32))` before returning `*verb = &verb_table[idx + 3]` / advancing `idx`.","locations":[{"ref":"src/device/azalia_device.c:119-136","code":"  119 | u32 azalia_find_verb(const u32 *verb_table, u32 verb_table_bytes, u32 viddid, const u32 **verb)\n  120 | {\n  121 | \tint idx = 0;\n  122 | \n  123 | \twhile (idx < (verb_table_bytes / sizeof(u32))) {\n  124 | \t\t/* Header contains the number of jacks, aka groups of 4 dwords */\n  125 | \t\tu32 verb_size = 4 * verb_table[idx + 2];\n  126 | \t\tif (verb_table[idx] != viddid) {\n  127 | \t\t\tidx += verb_size + 3;\t// skip verb + header\n  128 | \t\t\tcontinue;\n  129 | \t\t}\n  130 | \t\t*verb = &verb_table[idx + 3];\n  131 | \t\treturn verb_size;\n  132 | \t}\n  133 | \n  134 | \t/* Not all codecs need to load another verb */\n  135 | \treturn 0;\n  136 | }","lines":18,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/device/azalia_device.c#L119-L136"}]},{"id":"OVF_37","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `i2c_gpiomux_mux_fill_ssdt()` the loop iterates `for (i = 0; i < config->mux_gpio_count; i++)` writing into the fixed-size local array `struct acpi_gpio_res_params param[MAX_NUM_MUX_GPIOS]` (size 4) and reading `config->mux_gpio[i]` (also size 4). `mux_gpio_count` is a `uint32_t` taken from devicetree with no bounds check, so a devicetree that sets it above `MAX_NUM_MUX_GPIOS` overflows both the stack array `param` and reads past `mux_gpio[]`.","fix":"Clamp the loop to the array size. Before:\n```\nfor (i = 0; i < config->mux_gpio_count; i++) {\n```\nAfter:\n```\nfor (i = 0; i < config->mux_gpio_count && i < MAX_NUM_MUX_GPIOS; i++) {\n```\n(and pass the clamped count to `acpi_dp_add_gpio_array()`).","locations":[{"ref":"src/drivers/i2c/gpiomux/mux/mux.c:26-47","code":"   26 | \tstruct acpi_gpio_res_params param[MAX_NUM_MUX_GPIOS];\n   27 | \tint i;\n   28 | \n   29 | \tif (!scope || !path)\n   30 | \t\treturn;\n   31 | \n   32 | \t/* Device */\n   33 | \tacpigen_write_scope(scope);\n   34 | \tacpigen_write_device(acpi_device_name(dev));\n   35 | \tacpigen_write_name_string(\"_HID\", ACPI_DT_NAMESPACE_HID);\n   36 | \tacpigen_write_STA(acpi_device_status(dev));\n   37 | \n   38 | \t/* Resources */\n   39 | \tacpigen_write_name(\"_CRS\");\n   40 | \tacpigen_write_resourcetemplate_header();\n   41 | \tfor (i = 0; i < config->mux_gpio_count; i++) {\n   42 | \t\tacpi_device_write_gpio(&config->mux_gpio[i]);\n   43 | \t\tparam[i].ref = path;\n   44 | \t\tparam[i].index = i;\n   45 | \t\tparam[i].pin = 0;\n   46 | \t\tparam[i].active_low = config->mux_gpio[i].active_low;\n   47 | \t}","lines":22,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/i2c/gpiomux/mux/mux.c#L26-L47"}]},{"id":"OVF_38","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`fsp_validate_component()` guards only that `file_size >= FSP_HDR_OFFSET + fsp_hdr_get_expected_min_length()` (72-80 bytes depending on spec, lines 62-65), and the comment in `looks_like_fsp_header()` explicitly states the intent is to avoid accessing out-of-bound bytes. But `fsp_identify()` then does `memcpy(hdr, fsp_blob, sizeof(struct fsp_header))` (line 51), and `sizeof(struct fsp_header)` is 84 bytes (the struct extends through `res5`). So the copy reads 4-12 bytes past the validated minimum region (`FSP_HDR_OFFSET` is `0x94`). For a truncated/malformed blob sized exactly at the validated minimum this is an out-of-bounds read past the mapped buffer; the explicit min-length guard does not actually cover the number of bytes `memcpy` consumes.","fix":"Make the size guard cover the actual copy, e.g. check `file_size < FSP_HDR_OFFSET + sizeof(struct fsp_header)` (or copy only `MIN(sizeof(struct fsp_header), file_size - FSP_HDR_OFFSET)` bytes and zero the remainder) before/inside `fsp_identify()` so `memcpy` never reads beyond the validated region.","locations":[{"ref":"src/drivers/intel/fsp2_0/util.c:49-56","code":"   49 | enum cb_err fsp_identify(struct fsp_header *hdr, const void *fsp_blob)\n   50 | {\n   51 | \tmemcpy(hdr, fsp_blob, sizeof(struct fsp_header));\n   52 | \tif (!looks_like_fsp_header(hdr))\n   53 | \t\treturn CB_ERR;\n   54 | \n   55 | \treturn CB_SUCCESS;\n   56 | }","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/util.c#L49-L56"},{"ref":"src/drivers/intel/fsp2_0/util.c:58-70","code":"   58 | enum cb_err fsp_validate_component(struct fsp_header *hdr, void *fsp_file, size_t file_size)\n   59 | {\n   60 | \tvoid *raw_hdr = fsp_file + FSP_HDR_OFFSET;\n   61 | \n   62 | \tif (file_size < FSP_HDR_OFFSET + fsp_hdr_get_expected_min_length()) {\n   63 | \t\tprintk(BIOS_CRIT, \"FSP blob too small.\\n\");\n   64 | \t\treturn CB_ERR;\n   65 | \t}\n   66 | \n   67 | \tif (fsp_identify(hdr, raw_hdr) != CB_SUCCESS) {\n   68 | \t\tprintk(BIOS_CRIT, \"No valid FSP header\\n\");\n   69 | \t\treturn CB_ERR;\n   70 | \t}","lines":13,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/util.c#L58-L70"}]},{"id":"OVF_39","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"In both ARM and ARM64 `dump_stack()` the loop starts at `i = bytes / sizeof(*ptr)` and the inner loop reads `*(ptr + j)` for `j` in `[i, i + line)`. On the first iteration this reads words `ptr[bytes/sizeof]` through `ptr[bytes/sizeof + line - 1]`, i.e. up to `line` words (32 bytes on ARM, 64 bytes on ARM64) past the intended `bytes`-sized dump window. It is a diagnostic dump printed immediately before `die()`, so impact is negligible, but it is a genuine out-of-bounds read (the start index should be `bytes/sizeof(*ptr) - line`).","fix":"Start the outer index one line below the top. ARM64 before:\n```c\n\tfor (i = bytes / sizeof(*ptr); i >= 0; i -= words_per_line) {\n```\nafter:\n```c\n\tfor (i = bytes / sizeof(*ptr) - words_per_line; i >= 0; i -= words_per_line) {\n```\nApply the analogous change (`- line`) in the ARM version.","locations":[{"ref":"src/arch/arm/armv7/exception.c:19-32","code":"   19 | static void dump_stack(uintptr_t addr, size_t bytes)\n   20 | {\n   21 | \tint i, j;\n   22 | \tconst int line = 8;\n   23 | \tuint32_t *ptr = (uint32_t *)(addr & ~(line * sizeof(*ptr) - 1));\n   24 | \n   25 | \tprintk(BIOS_ERR, \"Dumping stack:\\n\");\n   26 | \tfor (i = bytes / sizeof(*ptr); i >= 0; i -= line) {\n   27 | \t\tprintk(BIOS_ERR, \"%p: \", ptr + i);\n   28 | \t\tfor (j = i; j < i + line; j++)\n   29 | \t\t\tprintk(BIOS_ERR, \"%08x \", *(ptr + j));\n   30 | \t\tprintk(BIOS_ERR, \"\\n\");\n   31 | \t}\n   32 | }","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/arm/armv7/exception.c#L19-L32"},{"ref":"src/arch/arm64/armv8/exception.c:32-45","code":"   32 | static void dump_stack(uintptr_t addr, size_t bytes)\n   33 | {\n   34 | \tint i, j;\n   35 | \tconst int words_per_line = 8;\n   36 | \tuint64_t *ptr = (void *)ALIGN_DOWN(addr, words_per_line * sizeof(*ptr));\n   37 | \n   38 | \tprintk(BIOS_DEBUG, \"Dumping stack:\\n\");\n   39 | \tfor (i = bytes / sizeof(*ptr); i >= 0; i -= words_per_line) {\n   40 | \t\tprintk(BIOS_DEBUG, \"%p: \", ptr + i);\n   41 | \t\tfor (j = i; j < i + words_per_line; j++)\n   42 | \t\t\tprintk(BIOS_DEBUG, \"%016llx \", *(ptr + j));\n   43 | \t\tprintk(BIOS_DEBUG, \"\\n\");\n   44 | \t}\n   45 | }","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/arm64/armv8/exception.c#L32-L45"}]},{"id":"OVF_40","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"In `LZ4_readLE32()` each byte is promoted to `int` before shifting, so `*((const uint8_t *)src + 3) << 24` can evaluate to a value greater than `INT_MAX` (up to `255 << 24 == 0xFF000000`) when the top byte's high bit is set, which is technically signed-integer overflow (undefined behavior) before the result is OR-ed into the `uint32_t` return value. It works on all real compilers/targets coreboot uses but is not strictly conforming.","fix":"Cast each byte to `uint32_t` before shifting, e.g. `return (uint32_t)((const uint8_t *)src)[3] << 24 | (uint32_t)((const uint8_t *)src)[2] << 16 | (uint32_t)((const uint8_t *)src)[1] << 8 | (const uint8_t *)src)[0];`.","locations":[{"ref":"src/commonlib/bsd/lz4_wrapper.c:23-29","code":"   23 | static uint32_t LZ4_readLE32(const void *src)\n   24 | {\n   25 | \treturn *((const uint8_t *)src + 3) << 24\n   26 | \t     | *((const uint8_t *)src + 2) << 16\n   27 | \t     | *((const uint8_t *)src + 1) << 8\n   28 | \t     |  *(const uint8_t *)src;\n   29 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/bsd/lz4_wrapper.c#L23-L29"}]},{"id":"OVF_41","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`skip_atoi()` accumulates `result = result * 10 + (str[0] - '0')` with no overflow protection. For long digit runs the `unsigned int` result wraps silently. This is used in `dt_fixup_external()` to parse the byte offset of an external phandle fixup (`uint32_t offset = skip_atoi(&entry)`), so a crafted overlay fixup string could wrap the offset to an arbitrary small value; combined with the `offset + 4` overflow finding this can select an unexpected write location, though the bounds check normally still catches in-range-but-wrong offsets.","fix":"Document that `skip_atoi()` does not detect overflow, and in callers that consume attacker-influenced input (`dt_fixup_external`) validate the parsed offset against the property size (which the `offset > size - 4` fix already does once corrected).","locations":[{"ref":"src/commonlib/bsd/string.c:56-65","code":"   56 | unsigned int skip_atoi(char **ptr)\n   57 | {\n   58 | \tunsigned int result = 0;\n   59 | \tchar *str;\n   60 | \n   61 | \tfor (str = *ptr; isdigit(str[0]); str++)\n   62 | \t\tresult = result * 10 + (str[0] - '0');\n   63 | \t*ptr = str;\n   64 | \treturn result;\n   65 | }","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/bsd/string.c#L56-L65"}]},{"id":"OVF_42","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`power_unit = 2 << ((msr.lo & 0xf) - 1);` reads the energy-status-unit field of `MSR_PKG_POWER_SKU_UNIT` and subtracts 1 before using it as a shift count. If the field is 0 (`msr.lo & 0xf == 0`) the shift amount becomes -1, which is undefined behavior in C and would produce a bogus `power_unit` that is subsequently used as a divisor (`tdp / power_unit`, `msr.lo / power_unit`). Real Intel SKUs always report a nonzero ESU encoding, so this is essentially unreachable on production hardware, but it is genuine UB and appears unguarded in four places.","fix":"Guard the field before shifting/dividing, e.g. `unsigned int esu = msr.lo & 0xf; power_unit = esu ? (2 << (esu - 1)) : 1;`, or equivalently `power_unit = 1 << (msr.lo & 0xf)` which is well-defined for a 0 field and yields the same values for nonzero encodings.","locations":[{"ref":"src/cpu/intel/haswell/haswell_init.c:276","code":"  276 | \tpower_unit = 2 << ((msr.lo & 0xf) - 1);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/haswell/haswell_init.c#L276"},{"ref":"src/cpu/intel/model_206ax/model_206ax_init.c:116","code":"  116 | \tpower_unit = 2 << ((msr.lo & 0xf) - 1);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/model_206ax/model_206ax_init.c#L116"},{"ref":"src/cpu/intel/haswell/acpi.c:254","code":"  254 | \tpower_unit = 2 << ((msr.lo & 0xf) - 1);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/haswell/acpi.c#L254"},{"ref":"src/cpu/intel/model_206ax/acpi.c:268","code":"  268 | \tpower_unit = 2 << ((msr.lo & 0xf) - 1);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/intel/model_206ax/acpi.c#L268"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The quicksort implementation in pci_module.c has infinite recursion when partition() returns 0. This happens whenever all elements in the subarray are >= the pivot (e.g., all devices have equal BDF values, or two identical PCI devices exist). When partition returns 0: quicksort(list, 0) terminates immediately, but quicksort(&list[0], len - 0) is the same call with identical arguments, causing infinite recursion and a stack overflow. This can occur on systems with multiple functions of the same device appearing in CBFS scan order.","fix":"After partition, skip the recursive call if the pivot is at the start or end of the sub-range: quicksort(list, index) is already safe. For the right call, use: if (index + 1 < len) quicksort(&list[index + 1], len - index - 1). This excludes the pivot element (which is already in its final sorted position at list[index] after the swap on line 54).","locations":[{"ref":"payloads/coreinfo/pci_module.c:59-70","code":"   59 | static void quicksort(struct pci_devices *list, int len)\n   60 | {\n   61 | \tint index;\n   62 | \n   63 | \tif (len <= 1)\n   64 | \t\treturn;\n   65 | \n   66 | \tindex = partition(list, len);\n   67 | \n   68 | \tquicksort(list, index);\n   69 | \tquicksort(&(list[index]), len - index);\n   70 | }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/pci_module.c#L59-L70"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"mb_parse_mmap() advances ptr by mmap->size + sizeof(mmap->size). If a bootloader provides a corrupt mmap entry with size == 0, ptr never advances and the while loop spins forever. There is no lower bound check on mmap->size before the pointer arithmetic.","fix":"Add a guard: if (mmap->size < sizeof(*mmap) - sizeof(mmap->size)) break; (or return) before advancing ptr, to reject malformed entries and prevent an infinite loop.","locations":[{"ref":"payloads/libpayload/arch/x86/multiboot.c:64-71","code":"   64 | \twhile(ptr < (start + table->mmap_length)) {\n   65 | \t\tstruct multiboot_mmap *mmap = (struct multiboot_mmap *) ptr;\n   66 | \n   67 | \t\tif (mb_add_memrange(info, mmap->addr, mmap->length, mmap->type))\n   68 | \t\t\treturn;\n   69 | \n   70 | \t\tptr += (mmap->size + sizeof(mmap->size));\n   71 | \t}","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/multiboot.c#L64-L71"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In dos/pdcscrn.c _query_adapter_type(), BIOS INT 10h function 0x1a00 (VGA Identify Adapter) returns the\nactive display type in BL, not AL (AL is only used to confirm the function was handled, returning 0x1a).\nThe code checks regs.h.al == 0x1a correctly, but then switches on regs.h.al again, which is always 0x1a\nat that point. The adapter type from BL is never read. Every supported adapter type (MDA, CGA, EGA,\nVGA, MCGA) is thus dead code in the switch, and the default branch always fires, returning _CGA.\nThis causes incorrect adapter detection on all platforms when the VGA BIOS is present.","fix":"Change `switch (regs.h.al)` at line 304 to `switch (regs.h.bl)`. BL holds the active display combination code per the VGA BIOS spec.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/dos/pdcscrn.c:300-339","code":"  300 |     if ((regs.h.al == 0x1a) && (retval == _NONE))\n  301 |     {\n  302 |         /* We know that the PS/2 video BIOS is alive and well. */\n  303 | \n  304 |         switch (regs.h.al)\n  305 |         {\n  306 |         case 0:\n  307 |             retval = _NONE;\n  308 |             break;\n  309 |         case 1:\n  310 |             retval = _MDA;\n  311 |             break;\n  312 |         case 2:\n  313 |             retval = _CGA;\n  314 |             break;\n  315 |         case 4:\n  316 |             retval = _EGACOLOR;\n  317 |             sizeable = TRUE;\n  318 |             break;\n  319 |         case 5:\n  320 |             retva
