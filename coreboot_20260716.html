oreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/acpigen_dptf.c#L255-L258"},{"ref":"src/acpi/acpigen_dptf.c:290-292","code":"  290 | \tfor (i = 0; i < max_count; ++i) {\n  291 | \t\tif (policies[i].source == DPTF_NONE)\n  292 | \t\t\tbreak;","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/acpigen_dptf.c#L290-L292"}]},{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `multilane_slave_link_names[]` the eighth entry (index 7) is `SDW_PFX \"slave-link-I\"`, but SoundWire slave links are labeled A through H, so index 7 should be `slave-link-H`. The letter `H` is skipped and `I` used instead, so `soundwire_gen_multilane()` emits an incorrect MIPI SoundWire property name (`mipi-sdw-slave-link-I`) for the last lane, which will not match what the OS driver expects.","fix":"Change the last array element from `SDW_PFX \"slave-link-I\"` to `SDW_PFX \"slave-link-H\"`.\n\nBefore:\n```c\n\tSDW_PFX \"slave-link-G\",\n\tSDW_PFX \"slave-link-I\"\n```\nAfter:\n```c\n\tSDW_PFX \"slave-link-G\",\n\tSDW_PFX \"slave-link-H\"\n```","locations":[{"ref":"src/acpi/soundwire.c:112-121","code":"  112 | static const char * const multilane_slave_link_names[] = {\n  113 | \tSDW_PFX \"slave-link-A\",\n  114 | \tSDW_PFX \"slave-link-B\",\n  115 | \tSDW_PFX \"slave-link-C\",\n  116 | \tSDW_PFX \"slave-link-D\",\n  117 | \tSDW_PFX \"slave-link-E\",\n  118 | \tSDW_PFX \"slave-link-F\",\n  119 | \tSDW_PFX \"slave-link-G\",\n  120 | \tSDW_PFX \"slave-link-I\"\n  121 | };","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/acpi/soundwire.c#L112-L121"}]},{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`transition_to_el2()` declares a local `struct exc_state exc_state;` that is NOT zero-initialized and only fills three members (`regs->x[X0_INDEX]`, `elx->elr`, `elx->spsr`). It then executes `raw_write_sp_el2(elx->sp_elx)`, reading the uninitialized `sp_elx` field and programming garbage stack memory into `SP_EL2`. The transition library contract (see `transition.h`) states the target program must set up its own stack, so in practice the payload overwrites `SP` before use, but this is a genuine read of uninitialized stack memory driving an architectural register write (undefined behavior, and a latent hang if a future EL2 entry path relies on the incoming `SP`). The remaining unset members (`regs->sp`, `regs->x[1..30]`) are also consumed by `exc_exit`/`trans_switch` from uninitialized memory.","fix":"Zero-initialize the state (`struct exc_state exc_state = {0};`) so `sp_elx` and the unused `x[]`/`sp` fields are deterministic, or drop the `raw_write_sp_el2(elx->sp_elx)` line entirely since the contract makes the payload responsible for its own stack.","locations":[{"ref":"src/arch/arm64/transition.c:33-77","code":"   33 | void transition_to_el2(void *entry, void *arg, uint64_t spsr)\n   34 | {\n   35 | \tstruct exc_state exc_state;\n   36 | \tstruct elx_state *elx = &exc_state.elx;\n   37 | \tstruct regs *regs = &exc_state.regs;\n   38 | \n   39 | \tregs->x[X0_INDEX] = (uint64_t)arg;\n   40 | \telx->elr = (uint64_t)entry;\n   41 | \telx->spsr = spsr;\n   42 | \n   43 | \t/*\n   44 | \t * Policies enforced:\n   45 | \t * 1. We support only transitions to EL2\n   46 | \t * 2. We support transitions to Aarch64 mode only\n   47 | \t *\n   48 | \t * If any of the above conditions holds false, then we need a proper way\n   49 | \t * to update SCR/HCR before removing the checks below\n   50 | \t */\n   51 | \tassert(get_el_from_spsr(spsr) == EL2 && !(spsr & SPSR_ERET_32));\n   52 | \n   53 | \t/* Initialize SCR with defaults for running without secure monitor\n   54 | \t   (disable all traps, enable all instructions, run NS at AArch64). */\n   55 | \traw_write_scr_el3(SCR_FIEN | SCR_API | SCR_APK | SCR_ST | SCR_RW |\n   56 | \t\t\t  SCR_HCE | SCR_SMD | SCR_RES1 | SCR_NS);\n   57 | \n   58 | \t/* Initialize CPTR to not trap anything to EL3. */\n   59 | \traw_write_cptr_el3(CPTR_EL3_TCPAC_DISABLE | CPTR_EL3_TTA_DISABLE |\n   60 | \t\t\t   CPTR_EL3_TFP_DISABLE);\n   61 | \n   62 | \t/* ELR/SPSR: Write entry point and processor state of program */\n   63 | \traw_write_elr_el3(elx->elr);\n   64 | \traw_write_spsr_el3(elx->spsr);\n   65 | \n   66 | \t/* SCTLR: Initialize EL with everything disabled */\n   67 | \traw_write_sctlr_el2(SCTLR_RES1);\n   68 | \n   69 | \t/* SP_ELx: Initialize stack pointer */\n   70 | \traw_write_sp_el2(elx->sp_elx);\n   71 | \n   72 | \t/* Payloads expect to be entered with MMU disabled. Includes an ISB. */\n   73 | \tmmu_disable();\n   74 | \n   75 | \t/* Eret to the entry point */\n   76 | \ttrans_switch(regs);\n   77 | }","lines":45,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/arm64/transition.c#L33-L77"}]},{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`generate_pmp_napot()` receives `base` and `size` already converted to word units (`b = base >> PMP_SHIFT`, `s = size >> PMP_SHIFT` in `generate_pmp()`), but then decides `NA4` vs `NAPOT` with `size > GRANULE` where `GRANULE` is `1 << PMP_SHIFT` (== `4`, a byte granule). This is a unit mismatch: the threshold should be `1` word (only an exactly-4-byte region is `NA4`). As written, word-count regions of `2` (8 bytes) and `4` (16 bytes) are wrongly encoded as `PMP_NA4`, which protects only 4 bytes -> silent under-protection of the upper part of the range. Additionally the address formula `base + (size / 2 - 1)` is only correct for `NAPOT`; for a true `NA4` region (`size == 1`) it evaluates to `base + (0 - 1) == base - 1`, an incorrect `pmpaddr`. Real callers (`setup_pmp` for `_text.._estack`, SoC ranges) use large regions so impact is latent, but the encoding is wrong for any region of 16 bytes or smaller.","fix":"Use word-unit thresholds and a correct NA4 address, e.g.:\n```\np->cfg = flags | (size > 1 ? PMP_NAPOT : PMP_NA4);\np->previous_address = 0;\np->address = (size > 1) ? (base + (size / 2 - 1)) : base;\n```","locations":[{"ref":"src/arch/riscv/pmp.c:238-244","code":"  238 | static void generate_pmp_napot(struct pmpcfg *p, uintptr_t base, uintptr_t size, u8 flags)\n  239 | {\n  240 | \tflags = flags & (PMP_R | PMP_W | PMP_X | PMP_L);\n  241 | \tp->cfg = flags | (size > GRANULE ? PMP_NAPOT : PMP_NA4);\n  242 | \tp->previous_address = 0;\n  243 | \tp->address = (base + (size / 2 - 1));\n  244 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/riscv/pmp.c#L238-L244"}]},{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `print_pmp_regions()` the PMP address-matching mode is decoded with overlapping single-bit tests instead of masking the 2-bit `A` field. The constants overlap: `PMP_TOR` is `0x08`, `PMP_NA4` is `0x10`, and `PMP_NAPOT` is `0x18` (which contains BOTH `PMP_TOR` and `PMP_NA4` bits). The code does `if (pmpcfg & PMP_NA4)` then `else if (pmpcfg & PMP_NAPOT)` then `else if (pmpcfg & PMP_TOR)`. Consequently a real `PMP_NAPOT` entry (`0x18`) matches `pmpcfg & PMP_NA4` first and is printed as an `NA4` region with `size = 4`, and a `PMP_TOR` entry (`0x08`) matches `pmpcfg & PMP_NAPOT` (`0x08 & 0x18 != 0`) and is printed as `NAPOT`. Every non-`NA4` PMP region is mislabelled with a wrong size in the debug dump. Impact is limited to diagnostic output, but the dump is precisely the tool used to verify PMP protection, so it is actively misleading.","fix":"Mask the `A` field and compare against whole values, e.g. `uintptr_t a = pmpcfg & PMP_A;` then `if (a == 0) continue; else if (a == PMP_NA4) {...} else if (a == PMP_NAPOT) {...} else if (a == PMP_TOR) {...}`. This tests the 2-bit field exactly instead of relying on non-exclusive bit masks.","locations":[{"ref":"src/arch/riscv/pmp.c:327-349","code":"  327 | \t\tif ((pmpcfg & PMP_A) == 0) {\n  328 | \t\t\tcontinue; // PMP entry is disabled\n  329 | \t\t} else if (pmpcfg & PMP_NA4) {\n  330 | \t\t\tbase = pmpaddr << PMP_SHIFT;\n  331 | \t\t\tsize = 4;\n  332 | \t\t\tmode = \"NA4\";\n  333 | \t\t} else if (pmpcfg & PMP_NAPOT) {\n  334 | \t\t\tunsigned int count_trailing_ones = 0;\n  335 | \t\t\tbase = pmpaddr;\n  336 | \t\t\twhile (base) {\n  337 | \t\t\t\tif ((base & 1) == 0)\n  338 | \t\t\t\t\tbreak; // we got a zero\n  339 | \t\t\t\tcount_trailing_ones++;\n  340 | \t\t\t\tbase >>= 1;\n  341 | \t\t\t}\n  342 | \t\t\tsize = 8 << count_trailing_ones;\n  343 | \t\t\tbase = (pmpaddr & ~((2 << count_trailing_ones) - 1)) >> PMP_SHIFT;\n  344 | \t\t\tmode = \"NAPOT\";\n  345 | \t\t} else if (pmpcfg & PMP_TOR) {\n  346 | \t\t\tbase = pmpaddr;\n  347 | \t\t\tsize = pmpaddr - prev_pmpaddr;\n  348 | \t\t\tmode = \"TOR\";\n  349 | \t\t}","lines":23,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/riscv/pmp.c#L327-L349"}]},{"id":"LOGIC_102","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`arch_prepare_thread()` sets up the new thread stack so the argument is delivered to `thread_entry` by pushing it onto the stack (`push_stack(stack, (uintptr_t)arg)`) and then reserving `struct saved_regs` with its comment `Ignore initial values`. This is only correct for 32-bit, where `asmlinkage` (`__attribute__((regparm(0)))`) forces stack argument passing. On `ENV_X86_64` the `regparm` attribute has no effect and the SysV AMD64 ABI passes the first argument in `%rdi`; `thread_switch_64.S` pops `%rdi` from the uninitialized `saved_regs` area, so `thread_entry` receives a garbage argument. Today this is masked (`call_wrapper` ignores its argument and the only consumer `call_wrapper_block_state` is reached solely via `thread_run_until()`, which currently has no callers), but any future 64-bit user of `thread_run_until()` would dereference a garbage `bbs` pointer. `COOP_MULTITASKING` is selectable on all `ARCH_X86` including x86_64.","fix":"On `ENV_X86_64`, initialize the `rdi` slot of the reserved `struct saved_regs` with `arg` (and any other argument registers the ABI needs) instead of relying on the pushed stack value, so the argument reaches `thread_entry` in `%rdi`.","locations":[{"ref":"src/arch/x86/thread.c:47-61","code":"   47 | void arch_prepare_thread(struct thread *t,\n   48 | \t\t\tasmlinkage void (*thread_entry)(void *), void *arg)\n   49 | {\n   50 | \tuintptr_t stack = t->stack_current;\n   51 | \n   52 | \t/* Imitate thread_entry(t) with return address of 0. thread_entry()\n   53 | \t * is assumed to never return. */\n   54 | \tstack = push_stack(stack, (uintptr_t)arg);\n   55 | \tstack = push_stack(stack, (uintptr_t)0);\n   56 | \tstack = push_stack(stack, (uintptr_t)thread_entry);\n   57 | \t/* Make room for the registers. Ignore initial values. */\n   58 | \tstack -= sizeof(struct saved_regs);\n   59 | \n   60 | \tt->stack_current = stack;\n   61 | }","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/x86/thread.c#L47-L61"}]},{"id":"LOGIC_103","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `get_save_state_reg()` and `set_save_state_reg()` the bounds check on the CPU `node` index is off-by-one: valid node indices are `0 .. CONFIG_MAX_CPUS-1`, but the guard `if (node > CONFIG_MAX_CPUS)` accepts `node == CONFIG_MAX_CPUS`, one past the end. The downstream `smm_get_save_state()` re-validates with `cpu >= smm_runtime.num_cpus`, so the invalid index is caught there and impact is limited, but the guard itself is wrong and would allow an out-of-range index if a save-state op indexed an array of size `CONFIG_MAX_CPUS` directly.","fix":"Use a `>=` comparison. Before:\n```c\nif (node > CONFIG_MAX_CPUS)\n\treturn -1;\n```\nAfter:\n```c\nif (node >= CONFIG_MAX_CPUS)\n\treturn -1;\n```\nApply to both `get_save_state_reg()` and `set_save_state_reg()`.","locations":[{"ref":"src/cpu/x86/smm/save_state.c:64-64","code":"   64 | \tif (node > CONFIG_MAX_CPUS)","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/x86/smm/save_state.c#L64"},{"ref":"src/cpu/x86/smm/save_state.c:75-75","code":"   75 | \tif (node > CONFIG_MAX_CPUS)","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/cpu/x86/smm/save_state.c#L75"}]},{"id":"LOGIC_104","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `swizzle_irq_pins()` / `get_pci_irq_pins()`, after calling `target_pin = swizzle_irq_pins(dev, parent_bdg)` the code checks `if (parent_bdg == NULL)`. `parent_bdg` is the `struct device **` parameter supplied by the caller and is essentially never NULL, so this check never fires. The comment says \"Make sure the swizzle returned valid structures\", meaning it intends to detect that `swizzle_irq_pins()` failed to set the output bridge pointer (`*parent_bridge` is only assigned when the root bus is found). The check should dereference the pointer to test the value that was written back.","fix":"Test the pointed-to value, not the pointer itself:\n\nBefore:\n```c\ntarget_pin = swizzle_irq_pins(dev, parent_bdg);\n\n/* Make sure the swizzle returned valid structures */\nif (parent_bdg == NULL) {\n```\nAfter:\n```c\ntarget_pin = swizzle_irq_pins(dev, parent_bdg);\n\n/* Make sure the swizzle returned valid structures */\nif (*parent_bdg == NULL) {\n```","locations":[{"ref":"src/device/pci_device.c:1751-1757","code":" 1751 | \t\ttarget_pin = swizzle_irq_pins(dev, parent_bdg);\n 1752 | \n 1753 | \t\t/* Make sure the swizzle returned valid structures */\n 1754 | \t\tif (parent_bdg == NULL) {\n 1755 | \t\t\tprintk(BIOS_WARNING, \"Could not find parent bridge for this device!\\n\");\n 1756 | \t\t\treturn -2;\n 1757 | \t\t}","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/device/pci_device.c#L1751-L1757"}]},{"id":"LOGIC_105","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ast_init_analog()` performs a read-modify of SCU2C (`data = ast_read32(ast, 0x1202c); data &= 0xfffcffff;`) but then writes the result to offset `0` instead of back to `0x1202c` (`ast_write32(ast, 0, data)`), contradicting the comment \"clear bits [17:16] of SCU2c\". The sibling `ast_init_dvo()` correctly writes the modified value back to `0x1202c`. The write to offset 0 targets an unrelated P2A register while the intended SCU2C update never happens, so DAC-source-to-VGA selection on the analog-only 3rd-Tx path is not applied. Note this matches the upstream Linux ast driver, so it is likely an inherited defect.","fix":"Write the modified value back to the register it was read from: `ast_write32(ast, 0x1202c, data);` (matching the pattern in `ast_init_dvo()`).","locations":[{"ref":"src/drivers/aspeed/common/ast_dp501.c:352-354","code":"  352 | \tdata = ast_read32(ast, 0x1202c);\n  353 | \tdata &= 0xfffcffff;\n  354 | \tast_write32(ast, 0, data);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/aspeed/common/ast_dp501.c#L352-L354"}]},{"id":"LOGIC_106","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `cs42l42_fill_ssdt()` the range clamp for `config->btn_det_init_dbnce` and `config->btn_det_event_dbnce` runs AFTER the value has already been emitted into the `_DSD` via `acpi_dp_add_integer()`. The corrected value assigned in the `if` block (`= 100` / `= 10`) is therefore never written to the ACPI table, so an out-of-range devicetree value is passed through to the OS unchanged while the error message misleadingly claims a default was used. Contrast with `cs35l53_fill_ssdt()`, which validates `boost_peak_milliamp` before calling `acpi_dp_add_integer()`.","fix":"Move each validation/clamp ahead of the corresponding `acpi_dp_add_integer()` call, e.g.:\n```c\nif (config->btn_det_init_dbnce > 200) {\n\tprintk(BIOS_ERR, \"%s: Incorrect btn_det_init_dbnce(%d). Using default of 100ms\\n\",\n\t\t__func__, config->btn_det_init_dbnce);\n\tconfig->btn_det_init_dbnce = 100;\n}\nacpi_dp_add_integer(dsd, \"cirrus,btn-det-init-dbnce\", config->btn_det_init_dbnce);\n```\nand likewise for `btn_det_event_dbnce`.","locations":[{"ref":"src/drivers/i2c/cs42l42/cs42l42.c:70-84","code":"   70 | \tacpi_dp_add_integer(dsd, \"cirrus,btn-det-init-dbnce\", config->btn_det_init_dbnce);\n   71 | \n   72 | \tif (config->btn_det_init_dbnce > 200) {\n   73 | \t\tprintk(BIOS_ERR, \"%s: Incorrect btn_det_init_dbnce(%d). Using default of 100ms\\n\",\n   74 | \t\t\t\t__func__, config->btn_det_init_dbnce);\n   75 | \t\tconfig->btn_det_init_dbnce = 100;\n   76 | \t}\n   77 | \n   78 | \tacpi_dp_add_integer(dsd, \"cirrus,btn-det-event-dbnce\", config->btn_det_event_dbnce);\n   79 | \n   80 | \tif (config->btn_det_event_dbnce > 100) {\n   81 | \t\tprintk(BIOS_ERR, \"%s: Incorrect btn_det_event_dbnce(%d). Using default of 10ms\\n\",\n   82 | \t\t\t\t__func__, config->btn_det_event_dbnce);\n   83 | \t\tconfig->btn_det_event_dbnce = 10;\n   84 | \t}","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/i2c/cs42l42/cs42l42.c#L70-L84"}]},{"id":"LOGIC_107","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `cr50_i2c_tis_send()` the inner transmit loop `while (len > 0)` has no overall timeout; it relies solely on `cr50_i2c_wait_burststs()` succeeding each iteration. When the reported `burstcnt` is 1, `limit = MIN(burstcnt - 1, len)` becomes 0, `cr50_i2c_write()` sends only the address byte, and `sent`/`len` do not advance. If the TPM keeps reporting `burstcnt == 1` (with `TPM_STS_DATA_EXPECT` set), `wait_burststs` returns success repeatedly (`*burst > 0` passes) and the loop spins forever, hanging boot. The `sw` stopwatch initialized at the top only guards the preceding command-ready wait, not this loop.","fix":"Guard the transmit loop against zero forward progress, e.g. bail out (goto `out_err`) if `limit == 0`, or re-check `stopwatch_expired(&sw)` inside the `while (len > 0)` loop so a stuck `burstcnt == 1` cannot spin indefinitely.","locations":[{"ref":"src/drivers/i2c/tpm/cr50.c:370-392","code":"  370 | \twhile (len > 0) {\n  371 | \t\tuint8_t mask = TPM_STS_VALID;\n  372 | \n  373 | \t\t/* Wait for data if this is not the first chunk */\n  374 | \t\tif (sent > 0)\n  375 | \t\t\tmask |= TPM_STS_DATA_EXPECT;\n  376 | \n  377 | \t\t/* Read burst count and check status */\n  378 | \t\tif (cr50_i2c_wait_burststs(mask, &burstcnt, &status))\n  379 | \t\t\tgoto out_err;\n  380 | \n  381 | \t\t/* Use burstcnt - 1 to account for the address byte\n  382 | \t\t * that is inserted by cr50_i2c_write() */\n  383 | \t\tlimit = MIN(burstcnt - 1, len);\n  384 | \t\trc = cr50_i2c_write(TPM_DATA_FIFO(tpm_dev.locality), &buf[sent], limit);\n  385 | \t\tif (rc) {\n  386 | \t\t\tprintk(BIOS_ERR, \"%s: Write failed with error %#x\\n\", __func__, rc);\n  387 | \t\t\tgoto out_err;\n  388 | \t\t}\n  389 | \n  390 | \t\tsent += limit;\n  391 | \t\tlen -= limit;\n  392 | \t}","lines":23,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/i2c/tpm/cr50.c#L370-L392"}]},{"id":"LOGIC_108","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`fsp_display_timestamp()` walks FSP-provided performance records advancing by `rec->header.length` (a `uint8_t` taken directly from the HOB). If a record has `header.length == 0`, `i += rec->header.length` never increases and `rec` never advances, producing an infinite loop / hang. Additionally, `print_string_record()` computes `str_len = rec->header.length - offsetof(struct generic_event_record, string)` (offset is 34); when `header.length < 34` the subtraction underflows to a huge `size_t`, and `%.*s` with `(int)str_len` reads far past the record (out-of-bounds read). Both are reachable only from the debug timestamp-dump path but are driven by unvalidated external HOB data.","fix":"Before dereferencing/advancing, validate the record: bail out (or break) if `rec->header.length < offsetof(struct generic_event_record, string)` (which also guarantees length is non-zero) and if `i + rec->header.length` would exceed `hdr->table_size`. Only then compute `str_len` and advance `rec`.","locations":[{"ref":"src/drivers/intel/fsp2_0/fsp_timestamp.c:100-106","code":"  100 | \tfor (size_t i = 0; i < hdr->table_size;) {\n  101 | \t\tprint_fsp_perf_timestamp(rec);\n  102 | \n  103 | \t\ti += rec->header.length;\n  104 | \t\trec = (const struct generic_event_record *)((uint8_t *)rec +\n  105 | \t\t\t\t rec->header.length);\n  106 | \t}","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/fsp_timestamp.c#L100-L106"},{"ref":"src/drivers/intel/fsp2_0/fsp_timestamp.c:53-55","code":"   53 | \tsize_t str_len = rec->header.length - offsetof(struct generic_event_record, string);\n   54 | \tprintk(BIOS_INFO, \"%5x\\t%16llu\\t\\t%.*s/\",\n   55 | \t       rec->progress_id, TIMESTAMP_TO_MICRO(rec->timestamp), (int)str_len, rec->string);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/fsp_timestamp.c#L53-L55"}]},{"id":"LOGIC_109","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`multi_phase_get_number` is declared uninitialized at line 99. Its `number_of_phases` field is filled by the FSP `GET_NUMBER_OF_PHASES` call at line 200, but the return value of that call is passed to `fsps_return_value_handler(FSP_MULTI_PHASE_SI_INIT_GET_NUMBER_OF_PHASES_API, status)` which, for that phase, only logs at `BIOS_SPEW` and never calls `die()` (see lines 67-69). If the FSP call fails and leaves the struct unwritten, `number_of_phases` is an uninitialized stack value, and the loop `for (uint32_t i = 1; i <= multi_phase_get_number.number_of_phases; i++)` at line 204 can iterate an arbitrarily large number of times, invoking `multi_phase_si_init()` with garbage `phase_index` values.","fix":"Zero-initialize the struct: change `struct fsp_multi_phase_get_number_of_phases_params multi_phase_get_number;` to `struct fsp_multi_phase_get_number_of_phases_params multi_phase_get_number = {0};`, and/or skip the loop when the `GET_NUMBER_OF_PHASES` `status` is not `FSP_SUCCESS`.","locations":[{"ref":"src/drivers/intel/fsp2_0/silicon_init.c:99-99","code":"   99 | \tstruct fsp_multi_phase_get_number_of_phases_params multi_phase_get_number;","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/silicon_init.c#L99"},{"ref":"src/drivers/intel/fsp2_0/silicon_init.c:196-219","code":"  196 | \t/* Get NumberOfPhases Value */\n  197 | \tmulti_phase_params.multi_phase_action = GET_NUMBER_OF_PHASES;\n  198 | \tmulti_phase_params.phase_index = 0;\n  199 | \tmulti_phase_params.multi_phase_param_ptr = &multi_phase_get_number;\n  200 | \tstatus = multi_phase_si_init(&multi_phase_params);\n  201 | \tfsps_return_value_handler(FSP_MULTI_PHASE_SI_INIT_GET_NUMBER_OF_PHASES_API, status);\n  202 | \n  203 | \t/* Execute Multi Phase Execution */\n  204 | \tfor (uint32_t i = 1; i <= multi_phase_get_number.number_of_phases; i++) {\n  205 | \t\tprintk(BIOS_SPEW, \"Executing Phase %u of FspMultiPhaseSiInit\\n\", i);\n  206 | \t\t/*\n  207 | \t\t * Give SoC/mainboard a chance to perform any operation before\n  208 | \t\t * Multi Phase Execution\n  209 | \t\t */\n  210 | \t\tplatform_fsp_silicon_multi_phase_init_cb(i);\n  211 | \n  212 | \t\tmulti_phase_params.multi_phase_action = EXECUTE_PHASE;\n  213 | \t\tmulti_phase_params.phase_index = i;\n  214 | \t\tmulti_phase_params.multi_phase_param_ptr = NULL;\n  215 | \t\tstatus = multi_phase_si_init(&multi_phase_params);\n  216 | \t\tif (CONFIG(FSP_MULTIPHASE_SI_INIT_RETURN_BROKEN))\n  217 | \t\t\tstatus = fsp_get_pch_reset_status();\n  218 | \t\tfsps_return_value_handler(FSP_MULTI_PHASE_SI_INIT_EXECUTE_PHASE_API, status);\n  219 | \t}","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/silicon_init.c#L196-L219"}]},{"id":"LOGIC_110","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`fit_place_mem()` accepts a placement only when `start + region->size < range_entry_end(r)`. Since `range_entry_end(r)` is the exclusive end (base + size) of the RAM range, a region that fits exactly (its last byte at `end - 1`, i.e. `start + region->size == range_entry_end(r)`) should be accepted, but the strict `<` rejects it. This is an off-by-one that can needlessly reject an exact-fit placement of the kernel/FDT/initrd. Real impact is minimal because `get_kernel_size()` already pads the kernel region by `MAX_KERNEL_SIZE` (64 MiB), making an exact fit unlikely.","fix":"Use `if (start + region->size <= range_entry_end(r))` so a region that ends exactly at the range end is considered a valid placement.","locations":[{"ref":"src/arch/riscv/fit_payload.c:43-60","code":"   43 | static bool fit_place_mem(const struct range_entry *r, void *arg)\n   44 | {\n   45 | \tstruct region *region = arg;\n   46 | \tresource_t start;\n   47 | \n   48 | \tif (range_entry_tag(r) != BM_MEM_RAM)\n   49 | \t\treturn true;\n   50 | \n   51 | \t/* Section must be aligned at page boundary */\n   52 | \tstart = ALIGN_UP(MAX(region->offset, range_entry_base(r)), SECTION_ALIGN);\n   53 | \n   54 | \tif (start + region->size < range_entry_end(r)) {\n   55 | \t\tregion->offset = (size_t)start;\n   56 | \t\treturn false;\n   57 | \t}\n   58 | \n   59 | \treturn true;\n   60 | }","lines":18,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/riscv/fit_payload.c#L43-L60"}]},{"id":"LOGIC_111","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`display_capacity` computes `capacity / (decimal_divisor / 1000)` and `(capacity / (hex_divisor / 1024))`. When the selected units are bytes (`\"B\"`, `bytes == 1`), `decimal_divisor / 1000` and `hex_divisor / 1024` both evaluate to 0, causing a division by zero. This only occurs if a displayed partition capacity is in the range 1..999 bytes, which is effectively impossible for real MMC/SD capacities, and the code is compiled only with `SDHC_DEBUG`, so real-world impact is essentially nil.","fix":"Guard the sub-1000/1024 case (e.g. skip the fractional term when `decimal_divisor < 1000` / `hex_divisor < 1024`), or special-case the `B`/`B` units entry so the divisor is never reduced to 0.","locations":[{"ref":"src/commonlib/storage/storage.c:77-82","code":"   77 | \tsdhc_debug(\"%3lld.%03lld %sytes (%3lld.%03lld %sytes)%s%s\\n\",\n   78 | \t\tcapacity / decimal_divisor,\n   79 | \t\t(capacity / (decimal_divisor / 1000)) % 1000,\n   80 | \t\tdecimal_units,\n   81 | \t\tcapacity / hex_divisor,\n   82 | \t\t((capacity / (hex_divisor / 1024)) * 1000 / 1024) % 1000,","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/storage/storage.c#L77-L82"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In apic.c, apic_set_task_priority() reads the TPR register, correctly clears the priority field bits and ORs in the new priority into the local variable tpr, but then writes the raw priority byte directly instead of the modified tpr value. The read-modify-write to preserve upper bits is therefore useless, and the written value always has the upper bits cleared.","fix":"Change apic_write32(APIC_TASK_PRIORITY, priority) to apic_write32(APIC_TASK_PRIORITY, tpr) to use the value computed on the lines above.","locations":[{"ref":"payloads/libpayload/arch/x86/apic.c:226-235","code":"  226 | static void apic_set_task_priority(uint8_t priority)\n  227 | {\n  228 | \tdie_if(!apic_bar, \"APIC is not initialized\");\n  229 | \n  230 | \tuint32_t tpr = apic_read32(APIC_TASK_PRIORITY);\n  231 | \ttpr &= ~APIC_TASK_PRIORITY_MASK;\n  232 | \ttpr |= priority;\n  233 | \n  234 | \tapic_write32(APIC_TASK_PRIORITY, priority);\n  235 | }","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/apic.c#L226-L235"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"Multiple PDC_LOG messages in addstr.c report wrong function names due to copy-paste. mvaddwstr() at line 200 logs 'mvaddstr() - called' instead of 'mvaddwstr() - called'. mvaddnwstr() at line 210 logs 'mvaddnstr() - called' instead of 'mvaddnwstr() - called'. mvwaddwstr() at line 220 logs 'mvwaddstr() - called' and mvwaddnwstr() at line 230 logs 'mvwaddnstr() - called' -- these should log their own wide-character function names.","fix":"Update each PDC_LOG string to use the actual function name being called.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addstr.c:200","code":"  200 |     PDC_LOG((\"mvaddstr() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addstr.c#L200"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addstr.c:210","code":"  210 |     PDC_LOG((\"mvaddnstr() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addstr.c#L210"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addstr.c:220","code":"  220 |     PDC_LOG((\"mvwaddstr() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addstr.c#L220"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addstr.c:230","code":"  230 |     PDC_LOG((\"mvwaddnstr() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addstr.c#L230"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`sdhci_display_clock` reconstructs the clock divisor incorrectly. The high divisor bits are programmed by `sdhci_set_clock` at bit position `SDHCI_DIVIDER_HI_SHIFT` (6), but the display code shifts `clk_ctrl` by `SDHCI_DIVIDER_SHIFT` (8) again when extracting the high bits, reading the wrong register bits. This yields a wrong reported bus clock whenever the divisor exceeds 255 (SPEC_300 large divisors). Debug-only (`SDHC_DEBUG`), so impact is limited to misleading log output.","fix":"Use `SDHCI_DIVIDER_HI_SHIFT` for the high bits.\nBefore:\n```c\ndivisor = (clk_ctrl >> SDHCI_DIVIDER_SHIFT)\n\t& SDHCI_DIV_MASK;\ndivisor |= ((clk_ctrl >> SDHCI_DIVIDER_SHIFT)\n\t<< SDHCI_DIV_MASK_LEN) & SDHCI_DIV_HI_MASK;\n```\nAfter:\n```c\ndivisor = (clk_ctrl >> SDHCI_DIVIDER_SHIFT)\n\t& SDHCI_DIV_MASK;\ndivisor |= ((clk_ctrl >> SDHCI_DIVIDER_HI_SHIFT)\n\t<< SDHCI_DIV_MASK_LEN) & SDHCI_DIV_HI_MASK;\n```","locations":[{"ref":"src/commonlib/storage/sdhci_display.c:51-55","code":"   51 | \t\t\tdivisor = (clk_ctrl >> SDHCI_DIVIDER_SHIFT)\n   52 | \t\t\t\t& SDHCI_DIV_MASK;\n   53 | \t\t\tdivisor |= ((clk_ctrl >> SDHCI_DIVIDER_SHIFT)\n   54 | \t\t\t\t<< SDHCI_DIV_MASK_LEN) & SDHCI_DIV_HI_MASK;\n   55 | \t\t\tdivisor <<= 1;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/storage/sdhci_display.c#L51-L55"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `dev_map[]` entry for the Intel iTPM has its `vid`/`did` fields swapped. `crb_tpm_get_info()` fills `info->vendor_id` from bits [63:48] and `info->device_id` from bits [47:32] of the interface-ID register, and Intel's PCI vendor ID is `0x8086` (device `0xa13a`). The table stores `{0xa13a, 0x8086, \"Intel iTPM\"}`, so the comparison `dev_map[i].vid == info->vendor_id && dev_map[i].did == info->device_id` never matches an Intel TPM and it is always reported as `\"Unknown\"`. The `CR50` entry `{0x1ae0, 0x0028, ...}` uses the correct `{vid, did}` order, confirming the intended layout.","fix":"Swap the two fields to `{vid, did}` order.\n```c\n// before\n{0xa13a, 0x8086, \"Intel iTPM\"}\n// after\n{0x8086, 0xa13a, \"Intel iTPM\"}\n```","locations":[{"ref":"src/drivers/crb/tis.c:22-24","code":"   22 | \t{0x1ae0, 0x0028, \"CR50\"},\n   23 | \t{0xa13a, 0x8086, \"Intel iTPM\"}\n   24 | };","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/crb/tis.c#L22-L24"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In demos/worm.c, the outer `ref` pointer array is allocated with malloc() at line 249 but the\nreturn value is never checked for NULL. If the allocation fails, the immediately following\n`ref[y] = malloc(...)` loop dereferences a NULL pointer, causing a crash. The inner\nrow allocations (ref[y]) are also unchecked. Additionally during KEY_RESIZE handling (line 341),\n`realloc(ref, ...)` is assigned directly back to `ref` without a NULL check; a failed realloc\nreturns NULL, destroying the only pointer to all existing row buffers and leaking them.","fix":"Check the return values of malloc() and realloc() and handle failures gracefully. For realloc(), save the return value to a temporary pointer before assigning to ref to avoid losing the original pointer on failure.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/worm.c:249-257","code":"  249 |     ref = malloc(sizeof(short *) * LINES);\n  250 | \n  251 |     for (y = 0; y < LINES; y++)\n  252 |     {\n  253 |         ref[y] = malloc(sizeof(short) * COLS);\n  254 | \n  255 |         for (x = 0; x < COLS; x++)\n  256 |             ref[y][x] = 0;\n  257 |     }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/worm.c#L249-L257"},{"ref":"payloads/libpayload/curses/PDCurses/demos/worm.c:325-352","code":"  325 |                     for (y = 0; y <= bottom; y++)\n  326 |                     {\n  327 |                         ref[y] = realloc(ref[y], sizeof(short) * COLS);\n  328 | \n  329 |                         for (x = last + 1; x < COLS; x++)\n  330 |                             ref[y][x] = 0;\n  331 |                     }\n  332 | \n  333 |                     last = COLS - 1;\n  334 |                 }\n  335 | \n  336 |                 if (bottom != LINES - 1)\n  337 |                 {\n  338 |                     for (y = LINES; y <= bottom; y++)\n  339 |                         free(ref[y]);\n  340 | \n  341 |                     ref = realloc(ref, sizeof(short *) * LINES);\n  342 | \n  343 |                     for (y = bottom + 1; y < LINES; y++)\n  344 |                     {\n  345 |                         ref[y] = malloc(sizeof(short) * COLS);\n  346 | \n  347 |                         for (x = 0; x < COLS; x++)\n  348 |                             ref[y][x] = 0;\n  349 |                     }\n  350 | \n  351 |                     bottom = LINES - 1;\n  352 |                 }","lines":28,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/worm.c#L325-L352"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In doc/manext.c main(), `argv[1]` is dereferenced via strcmp() at line 52 before checking\nwhether argc > 1. When the program is invoked with no arguments (argc == 1), argv[1] is NULL,\nand passing NULL to strcmp() is undefined behavior (typically a segfault). The program has no\nusage message path that can be triggered safely without at least one argument.","fix":"Add `if (argc < 2) { display_info(); exit(1); }` before the strcmp call, or change the check to `if (argc > 1 && strcmp(argv[1], \"-h\") == 0)`.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/doc/manext.c:52-55","code":"   52 |     if (strcmp(argv[1], \"-h\") == 0)\n   53 |     {\n   54 |         display_info();\n   55 |         exit(1);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/doc/manext.c#L52-L55"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"In win32/pdcgetsc.c all three functions (PDC_get_cursor_mode, PDC_get_rows,\nPDC_get_buffer_rows, PDC_get_columns) call the Win32 API (GetConsoleCursorInfo,\nGetConsoleScreenBufferInfo) but completely ignore the BOOL return value. A failure leaves the\nlocal struct uninitialised, so the function returns garbage. Callers then use these values to\nsize the terminal, which can corrupt internal state or trigger out-of-bounds accesses.","fix":"Check the return value of each Win32 call; on failure return -1 (or ERR) and\nlet callers propagate the error rather than proceeding with an uninitialised struct.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcgetsc.c:9-57","code":"    9 | int PDC_get_cursor_mode(void)\n   10 | {\n   11 |     CONSOLE_CURSOR_INFO ci;\n   12 | \n   13 |     PDC_LOG((\"PDC_get_cursor_mode() - called\\n\"));\n   14 | \n   15 |     GetConsoleCursorInfo(pdc_con_out, &ci);\n   16 | \n   17 |     return ci.dwSize;\n   18 | }\n   19 | \n   20 | /* return number of screen rows */\n   21 | \n   22 | int PDC_get_rows(void)\n   23 | {\n   24 |     CONSOLE_SCREEN_BUFFER_INFO scr;\n   25 | \n   26 |     PDC_LOG((\"PDC_get_rows() - called\\n\"));\n   27 | \n   28 |     GetConsoleScreenBufferInfo(pdc_con_out, &scr);\n   29 | \n   30 |     return scr.srWindow.Bottom - scr.srWindow.Top + 1;\n   31 | }\n   32 | \n   33 | /* return number of buffer rows */\n   34 | \n   35 | int PDC_get_buffer_rows(void)\n   36 | {\n   37 |     CONSOLE_SCREEN_BUFFER_INFO scr;\n   38 | \n   39 |     PDC_LOG((\"PDC_get_buffer_rows() - called\\n\"));\n   40 | \n   41 |     GetConsoleScreenBufferInfo(pdc_con_out, &scr);\n   42 | \n   43 |     return scr.dwSize.Y;\n   44 | }\n   45 | \n   46 | /* return width of screen/viewport */\n   47 | \n   48 | int PDC_get_columns(void)\n   49 | {\n   50 |     CONSOLE_SCREEN_BUFFER_INFO scr;\n   51 | \n   52 |     PDC_LOG((\"PDC_get_columns() - called\\n\"));\n   53 | \n   54 |     GetConsoleScreenBufferInfo(pdc_con_out, &scr);\n   55 | \n   56 |     return scr.srWindow.Right - scr.srWindow.Left + 1;\n   57 | }","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcgetsc.c#L9-L57"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In set_option_from_string() case 'h', malloc(sizeof(u64)) result is not checked for NULL before immediately dereferencing it with *(u64*)raw = strtoull(...). Only case 's' has a NULL check. If malloc returns NULL (impossible in libpayload's default allocator but still undefined behavior), this faults.","fix":"Add a null check after malloc for case 'h': if (!raw) return 1;","locations":[{"ref":"payloads/libpayload/drivers/options.c:358-360","code":"  358 | \t\t\traw = malloc(sizeof(u64));\n  359 | \t\t\t*(u64*)raw = strtoull(value, NULL, 0);\n  360 | \t\t\tbreak;","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L358-L360"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`crb_tpm_process_command()` is declared to return `size_t` and returns `-1` (i.e. `SIZE_MAX`) on every error path. `crb_tpm_sendrecv()` stores the result in `int len` and only tests `if (len == 0)`. When the command fails, `crb_tpm_process_command()` returns `(size_t)-1`, which truncates to `int -1`; `len == 0` is false, so the function skips the error return, sets `*rbuf_len = len` (which converts `-1` back to `SIZE_MAX` in the caller's `size_t`), and returns `TPM_SUCCESS`. A failed TPM command is thus reported to the TSS layer as success with an enormous response length, so the caller parses an unfilled/garbage response buffer.","fix":"Use a matching unsigned type and treat the sentinel as failure.\n```c\n// before\nint len = crb_tpm_process_command(sendbuf, sbuf_size, recvbuf, *rbuf_len);\nif (len == 0)\n    return TPM_CB_FAIL;\n// after\nsize_t len = crb_tpm_process_command(sendbuf, sbuf_size, recvbuf, *rbuf_len);\nif (len == 0 || len == (size_t)-1)\n    return TPM_CB_FAIL;\n```","locations":[{"ref":"src/drivers/crb/tis.c:36-47","code":"   36 | static tpm_result_t crb_tpm_sendrecv(const uint8_t *sendbuf, size_t sbuf_size, uint8_t *recvbuf,\n   37 | \t\t\t\t     size_t *rbuf_len)\n   38 | {\n   39 | \tint len = crb_tpm_process_command(sendbuf, sbuf_size, recvbuf, *rbuf_len);\n   40 | \n   41 | \tif (len == 0)\n   42 | \t\treturn TPM_CB_FAIL;\n   43 | \n   44 | \t*rbuf_len = len;\n   45 | \n   46 | \treturn TPM_SUCCESS;\n   47 | }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/crb/tis.c#L36-L47"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In win32/pdcclip.c PDC_clearclipboard() calls EmptyClipboard() at line 142\nwithout first calling OpenClipboard(). EmptyClipboard() requires the clipboard to be open and\nowned by the calling window; calling it without OpenClipboard() will fail silently on Windows,\nleaving the clipboard contents intact while returning PDC_CLIP_SUCCESS.","fix":"Wrap EmptyClipboard() with OpenClipboard(NULL)/CloseClipboard(), checking the\nreturn value of OpenClipboard and returning PDC_CLIP_ACCESS_ERROR on failure.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcclip.c:138-145","code":"  138 | int PDC_clearclipboard(void)\n  139 | {\n  140 |     PDC_LOG((\"PDC_clearclipboard() - called\\n\"));\n  141 | \n  142 |     EmptyClipboard();\n  143 | \n  144 |     return PDC_CLIP_SUCCESS;\n  145 | }","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcclip.c#L138-L145"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"set_form_fields (frm_def.c) calls Disconnect_Fields then on failure calls Connect_Fields(form, old) to restore the previous field array. However, Connect_Fields can itself fail (e.g. E_SYSTEM_ERROR from malloc), and that failure is silently ignored. The form ends up with a NULL field array (from Disconnect_Fields) rather than the restored old array, leaving it in a broken half-disconnected state while the function has already returned the original error code.","fix":"Check the return value of the fallback Connect_Fields call and handle failure, e.g. by logging or returning a combined error. At minimum, document that the form may be left with no fields after a failed set_form_fields.","locations":[{"ref":"payloads/libpayload/curses/form/frm_def.c:408-413","code":"  408 |   old = form->field;\n  409 |   Disconnect_Fields(form);\n  410 | \n  411 |   if ((res = Associate_Fields(form, fields)) != E_OK)\n  412 |     Connect_Fields(form, old);\n  413 | ","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L408-L413"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"rtc_read_clock() and rtc_write_clock() return void, so when the nvram_updating() timeout fires after 10001 iterations, the caller receives no indication of failure. rtc_read_clock() returns with time partially zeroed (only memset was done), giving the caller a struct tm with year=0, month=0, etc. that looks valid.","fix":"Change the return type to int and return a nonzero error code on timeout, or at minimum document that callers must check some out-of-range field to detect the timeout case.","locations":[{"ref":"payloads/libpayload/drivers/nvram.c:111-121","code":"  111 | void rtc_read_clock(struct tm *time)\n  112 | {\n  113 | \tu16 timeout = 10000;\n  114 | \tu8 statusB;\n  115 | \tu8 reg8;\n  116 | \n  117 | \tmemset(time, 0, sizeof(*time));\n  118 | \n  119 | \twhile (nvram_updating())\n  120 | \t\tif (!timeout--)\n  121 | \t\t\treturn;","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/nvram.c#L111-L121"},{"ref":"payloads/libpayload/drivers/nvram.c:169-177","code":"  169 | void rtc_write_clock(const struct tm *time)\n  170 | {\n  171 | \tu16 timeout = 10000;\n  172 | \tu8 statusB;\n  173 | \tu8 reg8, year;\n  174 | \n  175 | \twhile (nvram_updating())\n  176 | \t\tif (!timeout--)\n  177 | \t\t\treturn;","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/nvram.c#L169-L177"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `relocate_remaining_items()` the FSP info-header signature check prints an error but does not return, so relocation continues using a header whose `Signature` did not match `FSP_SIG`. This is inconsistent with the sibling function `fsp_get_info_hdr()`, which returns `NULL` on the identical signature mismatch (the preceding GUID and section-type checks in `relocate_remaining_items()` also both `return -1`). This looks like a dropped `return -1;` where one branch of a copy-paste pair was updated and the other was not.","fix":"Before:\n```c\n\tif (read_le32(&fih->Signature) != FSP_SIG) {\n\t\tprintk(BIOS_ERR, \"Unexpected FIH signature: %08x\\n\",\n\t\t\tread_le32(&fih->Signature));\n\t}\n```\nAfter:\n```c\n\tif (read_le32(&fih->Signature) != FSP_SIG) {\n\t\tprintk(BIOS_ERR, \"Unexpected FIH signature: %08x\\n\",\n\t\t\tread_le32(&fih->Signature));\n\t\treturn -1;\n\t}\n```","locations":[{"ref":"src/commonlib/fsp_relocate.c:494-497","code":"  494 | \tif (read_le32(&fih->Signature) != FSP_SIG) {\n  495 | \t\tprintk(BIOS_ERR, \"Unexpected FIH signature: %08x\\n\",\n  496 | \t\t\tread_le32(&fih->Signature));\n  497 | \t}","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/commonlib/fsp_relocate.c#L494-L497"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`thermal_zone_acpi_name()` calls `malloc(ACPI_NAME_BUFFER_SIZE)` and immediately passes the result to `snprintf(name, ACPI_NAME_BUFFER_SIZE, ...)` without checking for `NULL`. If the allocation fails, `snprintf()` dereferences a `NULL` pointer and crashes. Other coreboot `acpi_name` implementations exhibit the same pattern, but the missing check is still a real (if unlikely) null-pointer dereference.","fix":"Check the allocation before use:\n```c\nname = malloc(ACPI_NAME_BUFFER_SIZE);\nif (!name)\n\treturn NULL;\nsnprintf(name, ACPI_NAME_BUFFER_SIZE, \"TM%02X\", dev->path.generic.id);\n```","locations":[{"ref":"src/drivers/acpi/thermal_zone/thermal_zone.c:29-32","code":"   29 | \tname = malloc(ACPI_NAME_BUFFER_SIZE);\n   30 | \tsnprintf(name, ACPI_NAME_BUFFER_SIZE, \"TM%02X\", dev->path.generic.id);\n   31 | \n   32 | \treturn name;","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/acpi/thermal_zone/thermal_zone.c#L29-L32"}]},{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`fw_cfg_acpi_tables()` calls `malloc(f.size)` and `malloc(max * sizeof(*addrs))` without checking for `NULL`. `f.size` comes from QEMU fw_cfg (external to coreboot); on allocation failure the subsequent `fw_cfg_get(f.select, s, f.size)` and `s[i].command` dereference a NULL pointer. Similarly `fw_cfg_smbios_init()` does `malloc(entry.length - sizeof(entry))` where `entry.length` is a `uint16_t` read from fw_cfg: because `sizeof(entry)` is `size_t` (unsigned), any `entry.length < 6` makes the subtraction wrap to a huge value, causing a giant `malloc` that returns NULL, after which `fw_cfg_read(buf, entry.length - sizeof(entry))` writes via `insb` to NULL with a huge length. The malloc results there are also unchecked.","fix":"Check every `malloc()` result and bail out (`goto err` / return) on NULL. In `fw_cfg_smbios_init()` also validate `entry.length >= sizeof(entry)` before computing the payload size, e.g. `if (entry.length < sizeof(entry)) break;`, to avoid the unsigned underflow.","locations":[{"ref":"src/drivers/emulation/qemu/fw_cfg.c:252-255","code":"  252 | \tmax = f.size / sizeof(*s);\n  253 | \ts = malloc(f.size);\n  254 | \taddrs = malloc(max * sizeof(*addrs));\n  255 | \tfw_cfg_get(f.select, s, f.size);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/emulation/qemu/fw_cfg.c#L252-L255"},{"ref":"src/drivers/emulation/qemu/fw_cfg.c:384-386","code":"  384 | \t\tfw_cfg_read(&entry, sizeof(entry));\n  385 | \t\tbuf = malloc(entry.length - sizeof(entry));\n  386 | \t\tfw_cfg_read(buf, entry.length - sizeof(entry));","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/emulation/qemu/fw_cfg.c#L384-L386"}]},{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"`dev_finalize()` calls `final_link(dev_root.downstream)` without first checking that `dev_root.downstream` is non-NULL, whereas the analogous `dev_initialize()` and `dev_enable()` both guard with `if (dev_root.downstream)`. If `dev_root` has no downstream bus, `final_link()` dereferences `link->children` on a NULL pointer. In practice the root always has a downstream bus by finalize time, so this is a latent inconsistency rather than a reachable crash.","fix":"Guard the call to match the other iterators. Before:\n```c\nfinal_link(dev_root.downstream);\n```\nAfter:\n```c\nif (dev_root.downstream)\n\tfinal_link(dev_root.downstream);\n```","locations":[{"ref":"src/device/device.c:638-649","code":"  638 | void dev_finalize(void)\n  639 | {\n  640 | \tprintk(BIOS_INFO, \"Finalize devices...\\n\");\n  641 | \n  642 | \t/* First call the mainboard finalize. */\n  643 | \tfinal_dev(&dev_root);\n  644 | \n  645 | \t/* Now finalize everything. */\n  646 | \tfinal_link(dev_root.downstream);\n  647 | \n  648 | \tprintk(BIOS_INFO, \"Devices finalized\\n\");\n  649 | }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/device/device.c#L638-L649"},{"ref":"src/device/device.c:593-594","code":"  593 | \tif (dev_root.downstream)\n  594 | \t\tinit_link(dev_root.downstream);","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/device/device.c#L593-L594"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"In win32/pdcclip.c PDC_setclipboard(), after SetClipboardData() succeeds the\ncode calls GlobalFree(ptr1) at line 125. This is wrong: once SetClipboardData() succeeds,\nownership of the memory transfers to the system clipboard; the application must NOT free it.\nFreeing it here results in a use-after-free whenever the system or another application later\nreads the clipboard data.","fix":"Remove the `GlobalFree(ptr1);` call after the successful SetClipboardData path\n(line 125). Only free ptr1 in the failure branch (already done at line 120).","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcclip.c:118-127","code":"  118 |     if (!SetClipboardData(PDC_TEXT, ptr1))\n  119 |     {\n  120 |         GlobalFree(ptr1);\n  121 |         return PDC_CLIP_ACCESS_ERROR;\n  122 |     }\n  123 | \n  124 |     CloseClipboard();\n  125 |     GlobalFree(ptr1);\n  126 | \n  127 |     return PDC_CLIP_SUCCESS;","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcclip.c#L118-L127"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"In os2/pdcclip.c, PDC_setclipboard() and PDC_clearclipboard() do not call WinCreateMsgQueue()\nafter WinInitialize(), unlike PDC_getclipboard() which does. On OS/2, clipboard operations\nthrough the WinPM API require a message queue to be associated with the calling thread. Without\none, WinOpenClipbrd() and clipboard operations may fail or behave unpredictably. Only\nPDC_getclipboard creates and destroys a message queue (lines 63 and 92 respectively);\nthe other two functions skip this step.","fix":"Add `HMQ hmq = WinCreateMsgQueue(hab, 0);` after WinInitialize() in both PDC_setclipboard and PDC_clearclipboard, and add `WinDestroyMsgQueue(hmq);` before WinTerminate().","locations":[{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcclip.c:101-149","code":"  101 | int PDC_setclipboard(const char *contents, long length)\n  102 | {\n  103 | #ifndef EMXVIDEO\n  104 |     HAB hab;\n  105 |     PTIB ptib;\n  106 |     PPIB ppib;\n  107 |     ULONG ulRC;\n  108 |     PSZ szTextOut = NULL;\n  109 |     int rc;\n  110 | #endif\n  111 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n  112 | \n  113 | #ifndef EMXVIDEO\n  114 |     DosGetInfoBlocks(&ptib, &ppib);\n  115 |     ppib->pib_ultype = 3;\n  116 |     hab = WinInitialize(0);\n  117 | \n  118 |     if (!WinOpenClipbrd(hab))\n  119 |     {\n  120 |         WinTerminate(hab);\n  121 |         return PDC_CLIP_ACCESS_ERROR;\n  122 |     }\n  123 | \n  124 |     rc = PDC_CLIP_MEMORY_ERROR;\n  125 | \n  126 |     ulRC = DosAllocSharedMem((PVOID)&szTextOut, NULL, length + 1,\n  127 |                              PAG_WRITE | PAG_COMMIT | OBJ_GIVEABLE);\n  128 | \n  129 |     if (ulRC == 0)\n  130 |     {\n  131 |         strcpy(szTextOut, contents);\n  132 |         WinEmptyClipbrd(hab);\n  133 | \n  134 |         if (WinSetClipbrdData(hab, (ULONG)szTextOut, CF_TEXT, CFI_POINTER))\n  135 |             rc = PDC_CLIP_SUCCESS;\n  136 |         else\n  137 |         {\n  138 |             DosFreeMem(szTextOut);\n  139 |             rc = PDC_CLIP_ACCESS_ERROR;\n  140 |         }\n  141 |     }\n  142 | \n  143 |     WinCloseClipbrd(hab);\n  144 |     WinTerminate(hab);\n  145 | \n  146 |     return rc;\n  147 | #else\n  148 |     return PDC_CLIP_ACCESS_ERROR;\n  149 | #endif","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcclip.c#L101-L149"},{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcclip.c:162-185","code":"  162 | int PDC_clearclipboard(void)\n  163 | {\n  164 | #ifndef EMXVIDEO\n  165 |     HAB hab;\n  166 |     PTIB ptib;\n  167 |     PPIB ppib;\n  168 | #endif\n  169 |     PDC_LOG((\"PDC_clearclipboard() - called\\n\"));\n  170 | \n  171 | #ifndef EMXVIDEO\n  172 |     DosGetInfoBlocks(&ptib, &ppib);\n  173 |     ppib->pib_ultype = 3;\n  174 |     hab = WinInitialize(0);\n  175 | \n  176 |     WinEmptyClipbrd(hab);\n  177 | \n  178 |     WinCloseClipbrd(hab);\n  179 |     WinTerminate(hab);\n  180 | \n  181 |     return PDC_CLIP_SUCCESS;\n  182 | #else\n  183 |     return PDC_CLIP_ACCESS_ERROR;\n  184 | #endif\n  185 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcclip.c#L162-L185"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`fsp_load_and_convert_bmp_to_gop_blt()` declares `logo_size` as `uint32_t *` but casts it to `(size_t *)` before passing it to `load_and_convert_bmp_to_blt()`, whose implementation does `*logo_size = bmp_size;` writing a full `size_t`. On x86_64 ramstage builds `size_t` is 8 bytes while the caller's storage is a 4-byte `uint32_t` (e.g. `uint32_t logo_size;` in `soc/intel/pantherlake/fsp_params.c`, or the `UINT32 LogoSize` UPD field in meteorlake), so the call performs an 8-byte write into a 4-byte object, corrupting the adjacent stack variable / UPD field. The same reinterpreting-cast pattern is applied to `blt_ptr`/`blt_size` (`efi_uintn_t *` cast to `uintptr_t *`/`size_t *`), which is only safe as long as those widths happen to coincide.","fix":"Make the wrapper's parameter types match the underlying `load_and_convert_bmp_to_blt()` types (use `size_t *logo_size`, `size_t *blt_size` and `uintptr_t *` for the pointers) and update the header and callers accordingly, instead of casting pointers of different widths. Alternatively, marshal through local `size_t`/`uintptr_t` variables and copy back into the narrower caller fields with an explicit range check.","locations":[{"ref":"src/drivers/intel/fsp2_0/fsp_gop_blt.c:11-17","code":"   11 | void fsp_load_and_convert_bmp_to_gop_blt(efi_uintn_t *logo, uint32_t *logo_size,\n   12 | \tefi_uintn_t *blt_ptr, efi_uintn_t *blt_size, uint32_t *pixel_height, uint32_t *pixel_width,\n   13 | \tenum lb_fb_orientation orientation)\n   14 | {\n   15 | \tload_and_convert_bmp_to_blt((uintptr_t *)logo, (size_t *)logo_size, (uintptr_t *)blt_ptr,\n   16 | \t\t\t\t(size_t *)blt_size, pixel_height, pixel_width, orientation);\n   17 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/fsp_gop_blt.c#L11-L17"},{"ref":"src/drivers/intel/fsp2_0/fsp_gop_blt.c:20-26","code":"   20 | void fsp_convert_bmp_to_gop_blt(uintptr_t logo_ptr, size_t logo_ptr_size,\n   21 | \tefi_uintn_t *blt_ptr, efi_uintn_t *blt_size, uint32_t *pixel_height, uint32_t *pixel_width,\n   22 | \tenum lb_fb_orientation orientation)\n   23 | {\n   24 | \tconvert_bmp_to_blt(logo_ptr, logo_ptr_size, (uintptr_t *)blt_ptr, (size_t *)blt_size,\n   25 | \t\t\t\tpixel_height, pixel_width, orientation);\n   26 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/fsp_gop_blt.c#L20-L26"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The `FreeAndNull` macro in curses.priv.h (line 848) is defined as:\n  #define FreeAndNull(p)   free(p); p = 0\nThis is two semicolon-separated statements without a `do{}while(0)` wrapper.\nUsing it in a single-branch `if` or `else` without braces will only apply the\n`free(p)` to the conditional branch while `p = 0` executes unconditionally,\ncreating a use-after-free if the pointer is later accessed after an apparent\n\"not-freed\" path.","fix":"Wrap the macro body in `do { free(p); (p) = 0; } while (0)` to make it safe in all contexts.","locations":[{"ref":"payloads/libpayload/curses/curses.priv.h:848","code":"  848 | #define FreeAndNull(p)   free(p); p = 0","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/curses.priv.h#L848"}]},{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`pcix_scan_bridge()` calls `pos = pci_find_capability(dev, PCI_CAP_ID_PCIX)` and then unconditionally does `sstatus = pci_read_config16(dev, pos + PCI_X_SEC_STATUS)` without checking whether `pos` is non-zero. `pci_find_capability()` returns `0` when the capability is absent, so on a bridge without a PCI-X capability the code reads config offset `PCI_X_SEC_STATUS` (a low, unrelated register), then feeds the garbage value into `PCI_X_SSTATUS_MFREQ(sstatus)` and may erroneously invoke `pcix_tune_bus()` on the secondary bus. The sibling function `pcix_tune_dev()` correctly guards with `if (!cap) return;`, so this is an inconsistency and a latent misconfiguration.","fix":"After `pos = pci_find_capability(dev, PCI_CAP_ID_PCIX);` add a guard, e.g. `if (!pos) return;` (or skip the `sstatus` read and tuning when `pos == 0`), mirroring the check already present in `pcix_tune_dev()`.","locations":[{"ref":"src/device/pcix_device.c:106-110","code":"  106 | \tpos = pci_find_capability(dev, PCI_CAP_ID_PCIX);\n  107 | \tsstatus = pci_read_config16(dev, pos + PCI_X_SEC_STATUS);\n  108 | \n  109 | \tif (PCI_X_SSTATUS_MFREQ(sstatus) != PCI_X_SSTATUS_CONVENTIONAL_PCI)\n  110 | \t\tpcix_tune_bus(dev->downstream);","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/device/pcix_device.c#L106-L110"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In sha1.c SHA1Pad(), the padding loop calls SHA1Update() one byte at a time (with a single '\\0' byte) until the bit count reaches 448 mod 512. This can call SHA1Update up to 63 times individually rather than building the padding in a single buffer and calling it once. For a hash-heavy boot environment this is needlessly slow.","fix":"Pre-build a zero-padding buffer of the required size and pass it to SHA1Update in a single call.","locations":[{"ref":"payloads/libpayload/crypto/sha1.c:169-172","code":"  169 | \tSHA1Update(context, (u_int8_t *)\"\\200\", 1);\n  170 | \twhile ((context->count & 504) != 448)\n  171 | \t\tSHA1Update(context, (u_int8_t *)\"\\0\", 1);\n  172 | \tSHA1Update(context, finalcount, 8); /* Should cause a SHA1Transform() */","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/crypto/sha1.c#L169-L172"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"APIC_SPURIOUS is defined twice in apic.c (lines 54 and 57) with the same value 0x0F0. The second definition is a redundant leftover, likely from a copy-paste between the register offset block and the bit-field block. Modern compilers emit a macro redefinition warning.","fix":"Remove the duplicate #define APIC_SPURIOUS 0x0F0 on line 57.","locations":[{"ref":"payloads/libpayload/arch/x86/apic.c:54-57","code":"   54 | #define APIC_SPURIOUS\t\t\t0x0F0\n   55 | #define   APIC_SW_ENABLED_BIT\t\t(1 << 8)\n   56 | #define   APIC_SPURIOUS_VECTOR_MASK\t0xFFUL\n   57 | #define APIC_SPURIOUS\t\t\t0x0F0","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/apic.c#L54-L57"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In demos/xmas.c reindeer(), the check `if (x_pos < 62) y_pos = 1;` at line 821 is inside a\n`for (x_pos = 70; x_pos > 62; x_pos--)` loop. Because the loop condition is `x_pos > 62`,\nx_pos is never less than 62 inside the loop body. The condition is always false and the\ny_pos assignment never executes.","fix":"Remove the dead `if (x_pos < 62) y_pos = 1;` check, or adjust the loop bounds if the intent was to handle x_pos reaching values below 62.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/xmas.c:819-822","code":"  819 |     for (x_pos = 70; x_pos > 62; x_pos--)\n  820 |     {\n  821 |         if (x_pos < 62)\n  822 |             y_pos = 1;","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/xmas.c#L819-L822"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"PDC_restore_screen_mode() and PDC_save_screen_mode() in sdl1/pdcscrn.c\n(lines 247-253) have empty bodies. They accept an int parameter that is never used. These are\neffectively no-ops and serve no function in the SDL backend.","fix":"No fix needed for functionality; consider adding a (void)i; to silence compiler warnings about unused parameters.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c:247-253","code":"  247 | void PDC_restore_screen_mode(int i)\n  248 | {\n  249 | }\n  250 | \n  251 | void PDC_save_screen_mode(int i)\n  252 | {\n  253 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L247-L253"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"PDC_beep() in sdl1/pdcutil.c (lines 7-10) does nothing except log. The SDL\nbackend provides no actual audio beep functionality, making the function a silent no-op for the\nentire SDL port.","fix":"Document that the SDL backend has no beep support, or implement SDL_mixer beep.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcutil.c:7-10","code":"    7 | void PDC_beep(void)\n    8 | {\n    9 |     PDC_LOG((\"PDC_beep() - called\\n\"));\n   10 | }","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcutil.c#L7-L10"}]},{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In set_form_opts, form_opts_on, and form_opts_off the pattern 'opts &= ALL_FORM_OPTS; if (opts & ~ALL_FORM_OPTS)' is used to validate the option bits. After ANDing with ALL_FORM_OPTS, the expression 'opts & ~ALL_FORM_OPTS' is always zero because all bits outside ALL_FORM_OPTS have already been cleared. The E_BAD_ARGUMENT branch is therefore unreachable dead code. The validation never fires regardless of what the caller passes.","fix":"To actually catch invalid option bits, check before masking: 'if (opts & ~ALL_FORM_OPTS) RETURN(E_BAD_ARGUMENT);' then apply the mask, or drop the mask entirely and just validate.","locations":[{"ref":"payloads/libpayload/curses/form/frm_opts.c:52-54","code":"   52 |   opts &= ALL_FORM_OPTS;\n   53 |   if (opts & ~ALL_FORM_OPTS)\n   54 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_opts.c#L52-L54"},{"ref":"payloads/libpayload/curses/form/frm_opts.c:92-94","code":"   92 |   opts &= ALL_FORM_OPTS;\n   93 |   if (opts & ~ALL_FORM_OPTS)\n   94 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_opts.c#L92-L94"},{"ref":"payloads/libpayload/curses/form/frm_opts.c:117-119","code":"  117 |   opts &= ALL_FORM_OPTS;\n  118 |   if (opts & ~ALL_FORM_OPTS)\n  119 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_opts.c#L117-L119"}]},{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In set_item_opts (m_item_opt.c), 'opts &= ALL_ITEM_OPTS' is applied at line 58,\nmasking all bits not in ALL_ITEM_OPTS. The immediately following check\n'if (opts & ~ALL_ITEM_OPTS)' at line 60 can therefore never be true - after the\nmask operation, opts cannot have any bits outside ALL_ITEM_OPTS. The E_BAD_ARGUMENT\nbranch is unreachable dead code.","fix":"Either remove the mask-then-check pattern and validate before masking:\n  if (opts & ~ALL_ITEM_OPTS)\n    RETURN(E_BAD_ARGUMENT);\n  opts &= ALL_ITEM_OPTS;\nOr remove the dead check entirely if the mask is the intended behavior.","locations":[{"ref":"payloads/libpayload/curses/menu/m_item_opt.c:58-62","code":"   58 |   opts &= ALL_ITEM_OPTS;\n   59 | \n   60 |   if (opts & ~ALL_ITEM_OPTS)\n   61 |     RETURN(E_BAD_ARGUMENT);\n   62 | ","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_item_opt.c#L58-L62"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In tinycurses.c, delwin() is a stub that always returns OK without freeing anything (lines 220-232). window_list, ldat_list, and linebuf_list are statically allocated and window_count/ldat_count/linebuf_count never decrease. This means after unpost_menu() deletes sub and win windows, those allocation slots are permanently consumed. With MAX_WINDOWS=3 and the menu library creating 2 windows per post_menu() call, a second post_menu() call after unpost_menu() will fail to allocate windows.","fix":"Implement delwin() to decrement window_count and return the slot, or use a free-list pattern to recycle window slots.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:220-232","code":"  220 | int delwin(WINDOW *win)\n  221 | {\n  222 | \t/* TODO: Don't try to delete stdscr. */\n  223 | \t/* TODO: Don't delete parent windows before subwindows. */\n  224 | \n  225 | \t// if (win->_flags & _SUBWIN)\n  226 | \t// \ttouchwin(win->_parent);\n  227 | \t// else if (curscr != 0)\n  228 | \t// \ttouchwin(curscr);\n  229 | \n  230 | \t// return _nc_freewin(win);\n  231 | \treturn OK;\n  232 | }","lines":13,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L220-L232"}]},{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In tinycurses.c, wattr_on() and wattr_off() both have their core logic commented out (lines 574 and 581: `toggle_attr_on`/`toggle_attr_off`). Only the color-pair side effect is implemented. The functions return OK but do not actually apply bold, underline, or reverse attributes to the window's attr field (WINDOW_ATTRS), causing wattron()/wattroff() calls from the menu library (m_post.c) to be no-ops for attributes other than color. This means items in the menu will not display foreground/background/grey attribute differences on the tinycurses backend.","fix":"Implement toggle_attr_on/toggle_attr_off: `WINDOW_ATTRS(win) |= at;` in wattr_on and `WINDOW_ATTRS(win) &= ~at;` in wattr_off, guarding color separately.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:570-583","code":"  570 | int wattr_on(WINDOW *win, attr_t at, void *opts GCC_UNUSED)\n  571 | {\n  572 | \tif (at & A_COLOR)\n  573 | \t\twin->_color = PAIR_NUMBER(at);\n  574 | \t// toggle_attr_on(WINDOW_ATTRS(win), at);\n  575 | \treturn OK;\n  576 | }\n  577 | int wattr_off(WINDOW *win, attr_t at, void *opts GCC_UNUSED)\n  578 | {\n  579 | \tif (at & A_COLOR)\n  580 | \t\twin->_color = 0;\n  581 | \t// toggle_attr_off(WINDOW_ATTRS(win), at);\n  582 | \treturn 0;\n  583 | }","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L570-L583"}]},{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In pci_qcom.c the macro lower_32_bits and upper_32_bits (lines 32-33) are local redefinitions that shadow any globally-defined versions. These could cause silent behavior divergence if the global definitions change. Furthermore, upper_32_bits uses the double-shift idiom ((n >> 16) >> 16) to avoid undefined behavior with shift-by-32 on 32-bit types, but since n is always uint64_t at the call sites, a plain (u32)((n) >> 32) would be clearer and equally correct.","fix":"Remove the local macro definitions and include or use whatever header already defines these macros project-wide, to avoid duplicate definitions.","locations":[{"ref":"payloads/libpayload/drivers/pci_qcom.c:32-33","code":"   32 | #define lower_32_bits(n)\t\t((u32)(n))\n   33 | #define upper_32_bits(n)\t\t((u32)(((n) >> 16) >> 16))","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/pci_qcom.c#L32-L33"}]},{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `mp_get_processor_info()` the check `if (!info)` can never be true because `info = &cpu_infos[processor_number]` is the address of an array element and is always non-NULL, so it is dead code. The value that actually can be NULL is `dev = info->cpu`, which is dereferenced unchecked at `dev->path.apic.apic_id` (line 70). If a slot within `get_cpu_count()` has an unpopulated `cpu` pointer this is a NULL dereference.","fix":"Check the pointer that can actually be NULL:\n\nBefore:\n```c\n\tstruct cpu_info *info = &cpu_infos[processor_number];\n\tif (!info)\n\t\treturn FSP_DEVICE_ERROR;\n\n\tstruct device *dev = info->cpu;\n```\nAfter:\n```c\n\tstruct cpu_info *info = &cpu_infos[processor_number];\n\tstruct device *dev = info->cpu;\n\tif (!dev)\n\t\treturn FSP_DEVICE_ERROR;\n```","locations":[{"ref":"src/drivers/intel/fsp2_0/ppi/mp_service_ppi.c:55-70","code":"   55 | \tstruct cpu_info *info = &cpu_infos[processor_number];\n   56 | \tif (!info)\n   57 | \t\treturn FSP_DEVICE_ERROR;\n   58 | \n   59 | \tstruct device *dev = info->cpu;\n   60 | \n   61 | \tif (processor_info_buffer == NULL)\n   62 | \t\treturn FSP_INVALID_PARAMETER;\n   63 | \n   64 | \tprocessor_info_buffer->StatusFlag = PROCESSOR_HEALTH_STATUS_BIT\n   65 | \t\t\t| PROCESSOR_ENABLED_BIT;\n   66 | \n   67 | \tif (processor_number == BSP_CPU_SLOT)\n   68 | \t\tprocessor_info_buffer->StatusFlag |= PROCESSOR_AS_BSP_BIT;\n   69 | \n   70 | \tprocessor_info_buffer->ProcessorId = dev->path.apic.apic_id;","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/intel/fsp2_0/ppi/mp_service_ppi.c#L55-L70"}]},{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In virtual.c, the file defines only getpagesize() returning 4096 and the virtual_offset global. The function is the standard POSIX getpagesize() but libpayload targets bare metal where no virtual-memory page size concept applies. The stub is inert but may mislead callers into thinking paging is configured.","fix":"Consider marking the function with a comment explaining it is a stub for compatibility, or adding a static_assert / build-time check that it is only referenced where appropriate.","locations":[{"ref":"payloads/libpayload/arch/x86/virtual.c:33-36","code":"   33 | int getpagesize(void)\n   34 | {\n   35 | \treturn 4096;\n   36 | }","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/virtual.c#L33-L36"}]},{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"dupwin() in window.c assigns 'new->_flags = win->_flags' twice (lines 408 and 421) with no other code between that could modify _flags. The second assignment is dead code.","fix":"Remove the duplicate assignment at line 421.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/window.c:408-421","code":"  408 |     new->_flags = win->_flags;\n  409 |     new->_attrs = win->_attrs;\n  410 |     new->_clear = win->_clear;\n  411 |     new->_leaveit = win->_leaveit;\n  412 |     new->_scroll = win->_scroll;\n  413 |     new->_nodelay = win->_nodelay;\n  414 |     new->_use_keypad = win->_use_keypad;\n  415 |     new->_tmarg = win->_tmarg;\n  416 |     new->_bmarg = win->_bmarg;\n  417 |     new->_parx = win->_parx;\n  418 |     new->_pary = win->_pary;\n  419 |     new->_parent = win->_parent;\n  420 |     new->_bkgd = win->_bkgd;\n  421 |     new->_flags = win->_flags;","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/window.c#L408-L421"}]},{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`f_trace.c` provides five tracing wrappers (`_nc_retrace_field_ptr`,\n`_nc_retrace_field`, `_nc_retrace_field_type`, `_nc_retrace_form`,\n`_nc_retrace_form_hook`) that are guarded by `#ifdef TRACE` at their\ncall sites (via the `returnField`, `returnForm`, etc. macros in form.priv.h\nlines 219-229). When compiled without TRACE, the call-site macros expand to\nplain `return code` and these five functions are never called. The translation\nunit itself is always compiled, producing five unreferenced symbols that bloat\nthe object file and confuse linkers that warn about unused functions.","fix":"Wrap the entire file body (or each function individually) with `#ifdef TRACE ... #endif` to match the conditional use at call sites.","locations":[{"ref":"payloads/libpayload/curses/form/f_trace.c:37-70","code":"   37 | NCURSES_EXPORT(FIELD **)\n   38 | _nc_retrace_field_ptr(FIELD **code)\n   39 | {\n   40 |   T((T_RETURN(\"%p\"), (void *)code));\n   41 |   return code;\n   42 | }\n   43 | \n   44 | NCURSES_EXPORT(FIELD *)\n   45 | _nc_retrace_field(FIELD *code)\n   46 | {\n   47 |   T((T_RETURN(\"%p\"), (void *)code));\n   48 |   return code;\n   49 | }\n   50 | \n   51 | NCURSES_EXPORT(FIELDTYPE *)\n   52 | _nc_retrace_field_type(FIELDTYPE *code)\n   53 | {\n   54 |   T((T_RETURN(\"%p\"), (void *)code));\n   55 |   return code;\n   56 | }\n   57 | \n   58 | NCURSES_EXPORT(FORM *)\n   59 | _nc_retrace_form(FORM *code)\n   60 | {\n   61 |   T((T_RETURN(\"%p\"), (void *)code));\n   62 |   return code;\n   63 | }\n   64 | \n   65 | NCURSES_EXPORT(Form_Hook)\n   66 | _nc_retrace_form_hook(Form_Hook code)\n   67 | {\n   68 |   T((T_RETURN(\"%p\"), code));\n   69 |   return code;\n   70 | }","lines":34,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/f_trace.c#L37-L70"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In attr.c, the PDC_LOG call inside wattr_on() (line 260) logs 'wattr_off() - called' instead of 'wattr_on() - called'. This is a copy-paste error in the debug message only.","fix":"Change the string from '\"wattr_off() - called\\n\"' to '\"wattr_on() - called\\n\"'.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/attr.c:260","code":"  260 |     PDC_LOG((\"wattr_off() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/attr.c#L260"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In attr.c, the PDC_LOG call inside attr_set() (line 286) logs 'attr_get() - called' instead of 'attr_set() - called'. This is a copy-paste error in the debug message.","fix":"Change the log string to '\"attr_set() - called\\n\"'.","locations":[{"ref":"pa
