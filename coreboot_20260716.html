yloads/libpayload/curses/PDCurses/pdcurses/attr.c:286","code":"  286 |     PDC_LOG((\"attr_get() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/attr.c#L286"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `smbios_write_type4()` the comment claims core count is computed by \"dividing SMT_ID (logical processors in a core) by Core_ID (number of cores)\", and the locals are named `leaf_b_cores`/`leaf_b_threads`, but the code actually does the opposite: `leaf_b_cores = cpuid_ext(0xb, 1).ebx` is the total logical processors at the core level (package-wide threads) and `leaf_b_threads = cpuid_ext(0xb, 0).ebx` is logical processors per core (threads-per-core). `core_count2 = leaf_b_cores / leaf_b_threads` = total_threads / threads_per_core = number of cores, which is correct, but the comment and variable names are inverted/misleading and will misguide future maintainers.","fix":"Rename the locals to reflect reality (e.g. `total_logical_procs` for leaf 0xb sub-leaf 1 ebx and `threads_per_core` for sub-leaf 0 ebx) and correct the comment to describe `core_count = total_logical_procs / threads_per_core`.","locations":[{"ref":"src/arch/x86/smbios.c:134-153","code":"  134 | \t/*\n  135 | \t * If CPUID leaf 11 is available, calculate \"core count\" by dividing\n  136 | \t * SMT_ID (logical processors in a core) by Core_ID (number of cores).\n  137 | \t * This seems to be the way to arrive to a number of cores mentioned on\n  138 | \t * ark.intel.com.\n  139 | \t */\n  140 | \tif (cpu_have_cpuid() && cpuid_get_max_func() >= 0xb) {\n  141 | \t\tuint32_t leaf_b_cores = 0, leaf_b_threads = 0;\n  142 | \t\tres = cpuid_ext(0xb, 1);\n  143 | \t\tleaf_b_cores = res.ebx;\n  144 | \t\tres = cpuid_ext(0xb, 0);\n  145 | \t\tleaf_b_threads = res.ebx;\n  146 | \t\t/* if hyperthreading is not available, pretend this is 1 */\n  147 | \t\tif (leaf_b_threads == 0)\n  148 | \t\t\tleaf_b_threads = 1;\n  149 | \n  150 | \t\tt->core_count2 = leaf_b_cores / leaf_b_threads;\n  151 | \t\tt->core_count = t->core_count2 > 0xff ? 0xff : t->core_count2;\n  152 | \t\tt->thread_count2 = leaf_b_cores;\n  153 | \t\tt->thread_count = t->thread_count2 > 0xff ? 0xff : t->thread_count2;","lines":20,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/x86/smbios.c#L134-L153"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In arm/virtual.c, the comment for lpae_map_phys_addr has a typo: 'Data chache policy' should be 'Data cache policy'.","fix":"Change 'chache' to 'cache' in the comment.","locations":[{"ref":"payloads/libpayload/arch/arm/virtual.c:118","code":"  118 |  * policy: Data chache policy","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/arm/virtual.c#L118"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In arm64/cache.c, the file header comment says 'Cache maintenance routines for ARM64-A and ARM64-R' and references 'ARM64 Architecture Reference Manual, ARM64-A and ARM64-R edition'. These are not valid ARM architecture names. The ARM 64-bit ISA is ARMv8-A (or AArch64). The equivalent arm/cache.c correctly says 'ARMv7-A and ARMv7-R'. This comment was copy-pasted and incorrectly updated.","fix":"Change to: 'Cache maintenance routines for ARMv8-A' and reference 'ARM Architecture Reference Manual, ARMv8, for ARMv8-A architecture profile'.","locations":[{"ref":"payloads/libpayload/arch/arm64/cache.c:28-30","code":"   28 |  * cache.c: Cache maintenance routines for ARM64-A and ARM64-R\n   29 |  *\n   30 |  * Reference: ARM64 Architecture Reference Manual, ARM64-A and ARM64-R edition","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/arm64/cache.c#L28-L30"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In arm64/cache.c, dcache_line_bytes() has a comment 'bytes per word' on the multiply-by-sizeof(unsigned int) line. The correct comment (used in the equivalent arm/cache.c) is 'bytes per line', because the line variable at that point counts words per cache line, and the multiplication converts it to bytes per cache line.","fix":"Change the comment to: /* bytes per line */","locations":[{"ref":"payloads/libpayload/arch/arm64/cache.c:66","code":"   66 | \tline_bytes *= sizeof(unsigned int);\t/* bytes per word */","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/arm64/cache.c#L66"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `spd_decode_ddr3()` the debug strings printed for the two DDR3 thermal/refresh option bits are swapped relative to the flags they set. `reg8 & 0x02` correctly sets `dimm->flags.ext_temp_range` but prints `\" ext_temp_refresh\"`, while `reg8 & 0x01` correctly sets `dimm->flags.ext_temp_refresh` but prints `\" ext_temp_range\"`. The stored flags are correct; only the human-readable `printram` output is misleading.","fix":"Swap the two printed strings to match the flags being set.\n\nBefore:\n```c\nif (reg8 & 0x02) {\n\tdimm->flags.ext_temp_range = 1;\n\tprintram(\" ext_temp_refresh\");\n}\nif (reg8 & 0x01) {\n\tdimm->flags.ext_temp_refresh = 1;\n\tprintram(\" ext_temp_range\");\n}\n```\nAfter:\n```c\nif (reg8 & 0x02) {\n\tdimm->flags.ext_temp_range = 1;\n\tprintram(\" ext_temp_range\");\n}\nif (reg8 & 0x01) {\n\tdimm->flags.ext_temp_refresh = 1;\n\tprintram(\" ext_temp_refresh\");\n}\n```","locations":[{"ref":"src/device/dram/ddr3.c:343-350","code":"  343 | \tif (reg8 & 0x02) {\n  344 | \t\tdimm->flags.ext_temp_range = 1;\n  345 | \t\tprintram(\" ext_temp_refresh\");\n  346 | \t}\n  347 | \tif (reg8 & 0x01) {\n  348 | \t\tdimm->flags.ext_temp_refresh = 1;\n  349 | \t\tprintram(\" ext_temp_range\");\n  350 | \t}","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/device/dram/ddr3.c#L343-L350"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment above the `_DSD`/SSCN package generation in `dw_i2c_acpi_write_speed_config()` documents the package order as `{ scl_lcnt, scl_hcnt, sda_hold }`, but the code writes `scl_hcnt` first, then `scl_lcnt` (`acpigen_write_word(config->scl_hcnt); acpigen_write_word(config->scl_lcnt);`). The code order (hcnt, lcnt) is the one the Linux i2c-designware driver expects, so the code is correct and the comment is misleading.","fix":"Update the comment to match the emitted order:\n```c\n/* Package () { scl_hcnt, scl_lcnt, sda_hold } */\n```\n(before: `/* Package () { scl_lcnt, scl_hcnt, sda_hold } */`)","locations":[{"ref":"src/drivers/i2c/designware/dw_i2c.c:782-786","code":"  782 | \t/* Package () { scl_lcnt, scl_hcnt, sda_hold } */\n  783 | \tacpigen_write_package(3);\n  784 | \tacpigen_write_word(config->scl_hcnt);\n  785 | \tacpigen_write_word(config->scl_lcnt);\n  786 | \tacpigen_write_dword(config->sda_hold);","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/drivers/i2c/designware/dw_i2c.c#L782-L786"}]},{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The acs_map[128] array definition is duplicated verbatim between dos/pdcdisp.c (lines 14-42)\nand os2/pdcdisp.c (lines 14-42), under identical preprocessor guards. Any correction to the\nACS character mappings m uplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`INFINITY` is defined twice in curses.priv.h (lines 1109 and 1125) with the same\nvalue. This compiles without error only because both definitions are identical,\nbut it is misleading and would become a hard error if the values ever diverged.\nThe second definition is also paired with `BAUDBYTE`, suggesting a copy-paste of\nan entire comment block.","fix":"Remove the duplicate `#define INFINITY 1000000` at line 1125.","locations":[{"ref":"payloads/libpayload/curses/curses.priv.h:1109-1126","code":" 1109 | #define INFINITY\t1000000\t/* cost: too high to use */\n 1110 | \n 1111 | extern NCURSES_EXPORT(void) _nc_mvcur_init (void);\n 1112 | extern NCURSES_EXPORT(void) _nc_mvcur_resume (void);\n 1113 | extern NCURSES_EXPORT(void) _nc_mvcur_wrap (void);\n 1114 | \n 1115 | extern NCURSES_EXPORT(int) _nc_scrolln (int, int, int, int);\n 1116 | \n 1117 | extern NCURSES_EXPORT(void) _nc_screen_init (void);\n 1118 | extern NCURSES_EXPORT(void) _nc_screen_resume (void);\n 1119 | extern NCURSES_EXPORT(void) _nc_screen_wrap (void);\n 1120 | \n 1121 | /* lib_mouse.c */\n 1122 | extern NCURSES_EXPORT(int) _nc_has_mouse (void);\n 1123 | \n 1124 | /* lib_mvcur.c */\n 1125 | #define INFINITY\t1000000\t/* cost: too high to use */\n 1126 | #define BAUDBYTE\t9\t/* 9 = 7 bits + 1 parity + 1 stop */","lines":18,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/curses.priv.h#L1109-L1126"}]},{"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"In set_menu_mark (m_item_new.c), after strdup succeeds, strcpy is called\nimmediately on the same source string into the already-duplicated memory.\nstrdup already produces a correct null-terminated copy; the strcpy on line 225\nis entirely redundant and wastes time copying the string a second time.","fix":"Remove the redundant strcpy call. The code should be:\n  menu->mark = strdup(mark);\n  if (menu->mark)\n    {\n      if (menu != &_nc_Default_Menu)\n        menu->status |= _MARK_ALLOCATED;\n    }","locations":[{"ref":"payloads/libpayload/curses/menu/m_item_new.c:222-226","code":"  222 | \t  menu->mark = strdup(mark);\n  223 | \t  if (menu->mark)\n  224 | \t    {\n  225 | \t      strcpy(menu->mark, mark);\n  226 | \t      if (menu != &_nc_Default_Menu)","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_item_new.c#L222-L226"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"PDC_scr_open() in sdl1/pdcscrn.c reads environment variables PDC_LINES and\nPDC_COLS via getenv() and passes them directly to atoi() (lines 144-148). The results are\nused without any validation as multipliers to compute screen pixel dimensions\n(pdc_sheight, pdc_swidth). A value of 0, negative, or extremely large can result in\nSDL_SetVideoMode being called with 0x0 or enormous dimensions, or the subsequent\nPDC_get_rows()/PDC_get_columns() returning 0 causing division-by-zero or corrupted\nSP->lines/SP->cols, which propagate into all curses window sizing.","fix":"Validate the values from PDC_LINES and PDC_COLS: clamp to a reasonable range\n(e.g. 1-500) and fall back to the default (25/80) if out of range.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c:143-151","code":"  143 |     {\n  144 |         const char *env = getenv(\"PDC_LINES\");\n  145 |         pdc_sheight = (env ? atoi(env) : 25) * pdc_fheight;\n  146 | \n  147 |         env = getenv(\"PDC_COLS\");\n  148 |         pdc_swidth = (env ? atoi(env) : 80) * pdc_fwidth;\n  149 | \n  150 |         pdc_screen = SDL_SetVideoMode(pdc_swidth, pdc_sheight, 0,\n  151 |             SDL_SWSURFACE|SDL_ANYFORMAT|SDL_RESIZABLE);","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L143-L151"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"very_easy","description":"`init_pair()` in colors.c checks `index == 0 || index > 255` but does NOT check\nfor negative values. A `short` argument can be negative (e.g. -1), which passes\nthe guard and is then used as an array index into `color_pairs[256]`, producing\nan out-of-bounds write before the array. This is an arbitrary memory corruption\nvulnerability for any caller that passes a negative color pair index.","fix":"Change the guard to: `if (index <= 0 || index > 255) return ERR;` (note <=0 to also keep the existing rejection of index==0).","locations":[{"ref":"payloads/libpayload/curses/colors.c:45-48","code":"   45 | \tif (index == 0 || index > 255)\n   46 | \t\treturn ERR;\n   47 | \n   48 | \tcolor_pairs[index] = ((bg & 0xF) << 4) | (fg & 0xF);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/colors.c#L45-L48"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"lookup_cmos_enum_core() calls strnlen(text, CB_CMOS_MAX_TEXT_LENGTH) unconditionally at line 240, but text is documented as optionally NULL (the comment says 'Either value or text must be NULL'). When called via lookup_cmos_enum_by_value(), text is NULL. Passing NULL to strnlen() is undefined behavior and will fault on most implementations.","fix":"Guard the strnlen call: int len = text ? strnlen(text, CB_CMOS_MAX_TEXT_LENGTH) : 0; The subsequent memcmp is already guarded by (text == NULL) so no other change is needed.","locations":[{"ref":"payloads/libpayload/drivers/options.c:238-254","code":"  238 | static struct cb_cmos_enums *lookup_cmos_enum_core(struct cb_cmos_option_table *option_table, int config_id, const u8 *value, const char *text)\n  239 | {\n  240 | \tint len = strnlen(text, CB_CMOS_MAX_TEXT_LENGTH);\n  241 | \n  242 | \t/* CMOS enums are located after CMOS entries. */\n  243 | \tstruct cb_cmos_enums *cmos_enum;\n  244 | \tfor (   cmos_enum = first_cmos_enum_of_id(option_table, config_id);\n  245 | \t\tcmos_enum;\n  246 | \t\tcmos_enum = next_cmos_enum_of_id(cmos_enum, config_id)) {\n  247 | \t\tif (((value == NULL) || (cmos_enum->value == *value)) &&\n  248 | \t\t    ((text == NULL) || (memcmp((const char*)cmos_enum->text, text, len) == 0))) {\n  249 | \t\t\treturn cmos_enum;\n  250 | \t\t}\n  251 | \t}\n  252 | \n  253 | \treturn NULL;\n  254 | }","lines":17,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L238-L254"}]},{"id":"OTHER_4","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"In get_option_as_string(), after lookup_cmos_enum_by_value() is called for config type 'e', the return value cmos_enum is never checked for NULL before dereferencing cmos_enum->text on the next line. If no enum entry matches the stored value, this is a null pointer dereference.","fix":"Add a null check: if (!cmos_enum) { ret = 1; break; } before the strdup call.","locations":[{"ref":"payloads/libpayload/drivers/options.c:337-338","code":"  337 | \t\t\tcmos_enum = lookup_cmos_enum_by_value(option_table, cmos_entry->config_id, (u8*)raw);\n  338 | \t\t\t*dest = strdup((const char*)cmos_enum->text);","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L337-L338"}]},{"id":"OTHER_5","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"In set_option_from_string(), for config type 'e', lookup_cmos_enum_by_label() return value is not checked for NULL before cmos_enum->value is dereferenced on line 371. If the label does not exist, this is a null pointer dereference. Additionally, malloc(sizeof(u32)) on line 370 is not checked for NULL before the dereference.","fix":"Check cmos_enum for NULL after the lookup and return an error. Also check that malloc returned non-NULL before dereferencing raw.","locations":[{"ref":"payloads/libpayload/drivers/options.c:369-371","code":"  369 | \t\t\tcmos_enum = lookup_cmos_enum_by_label(option_table, cmos_entry->config_id, value);\n  370 | \t\t\traw = malloc(sizeof(u32));\n  371 | \t\t\t*(u32*)raw = cmos_enum->value;","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L369-L371"}]},{"id":"OTHER_6","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"In boot_media.c, boot_device_read() checks that boot_media_size - offset <= 16 MiB (to restrict reads to the top 16MB of flash mapping), but does not validate that offset + size <= boot_media_size. A caller providing a large size value causes memcpy to read beyond the end of the flash memory region, potentially exposing adjacent memory contents.","fix":"Add a bounds check before the memcpy: if (size > lib_sysinfo.boot_media_size - offset) return CB_ERR_ARG;","locations":[{"ref":"payloads/libpayload/arch/x86/boot_media.c:6-13","code":"    6 | __attribute__((weak)) ssize_t boot_device_read(void *buf, size_t offset, size_t size)\n    7 | {\n    8 | \t/* Memory-mapping usually only works for the top 16MB. */\n    9 | \tif (!lib_sysinfo.boot_media_size || lib_sysinfo.boot_media_size - offset > 16 * MiB)\n   10 | \t\treturn CB_ERR_ARG;\n   11 | \tconst void *const ptr = phys_to_virt(0 - lib_sysinfo.boot_media_size + offset);\n   12 | \tmemcpy(buf, ptr, size);\n   13 | \treturn size;","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/boot_media.c#L6-L13"}]},{"id":"OTHER_7","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"In dos/pdcclip.c PDC_freeclipboard(), the function writes the string \"PDCURSES\" into the\nbuffer being freed, then calls free() on it. Writing to memory that is about to be freed is\nundefined behavior and the write happens before free() so the scrubbing is pointless. Worse,\nthe length check `strlen(contents) >= strlen(\"PDCURSES\")` means shorter clipboard contents\nare freed without any scrubbing at all. The comment acknowledges the caller's pointer is not\nnulled, making a use-after-free trivial for any caller that reuses the pointer.","fix":"Remove the write-before-free pattern. To guard against accidental reuse, use memset(contents, 0, strlen(contents)) before free(), or document that callers must set their pointer to NULL after calling PDC_freeclipboard.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/dos/pdcclip.c:92-116","code":"   92 | int PDC_freeclipboard(char *contents)\n   93 | {\n   94 |     PDC_LOG((\"PDC_freeclipboard() - called\\n\"));\n   95 | \n   96 |     /* should we also free empty the system clipboard? probably not */\n   97 | \n   98 |     if (contents)\n   99 |     {\n  100 | \n  101 |         /* NOTE: We free the memory, but we can not set caller's pointer\n  102 |            to NULL, so if caller calls again then will try to access\n  103 |            free'd memory.  We 1st overwrite memory with a string so if\n  104 |            caller tries to use free memory they won't get what they\n  105 |            expect & hopefully notice. */\n  106 | \n  107 |         /* memset(contents, 0xFD, strlen(contents)); */\n  108 | \n  109 |         if (strlen(contents) >= strlen(\"PDCURSES\"))\n  110 |             strcpy(contents, \"PDCURSES\");\n  111 | \n  112 |         free(contents);\n  113 |     }\n  114 | \n  115 |     return PDC_CLIP_SUCCESS;\n  116 | }","lines":25,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/dos/pdcclip.c#L92-L116"}]},{"id":"OTHER_8","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"getwin() in scr_dump.c reads a raw WINDOW struct from a file with fread() and then uses the embedded _maxy and _maxx fields directly as allocation sizes without any validation. A crafted dump file can set these to negative values (they are signed int), causing malloc() calls like 'malloc(nlines * sizeof(chtype *))' to receive a very large size (due to sign extension on most platforms), likely failing and returning NULL (which is handled), but also to zero (malloc(0) implementation-defined) or to an apparently valid small size that causes a write overflow later in the fread loop.","fix":"After reading the WINDOW struct, validate that nlines and ncols are positive and within reasonable bounds (e.g., 1 <= nlines <= LINES_MAX and 1 <= ncols <= COLS_MAX) before using them as malloc sizes.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/scr_dump.c:91-158","code":"   91 | WINDOW *getwin(FILE *filep)\n   92 | {\n   93 |     WINDOW *win;\n   94 |     char marker[4];\n   95 |     int i, nlines, ncols;\n   96 | \n   97 |     PDC_LOG((\"getwin() - called\\n\"));\n   98 | \n   99 |     if ( !(win = malloc(sizeof(WINDOW))) )\n  100 |         return (WINDOW *)NULL;\n  101 | \n  102 |     /* check for the marker, and load the WINDOW struct */\n  103 | \n  104 |     if (!filep || !fread(marker, 4, 1, filep) || strncmp(marker, \"PDC\", 3)\n  105 |         || marker[3] != DUMPVER || !fread(win, sizeof(WINDOW), 1, filep))\n  106 |     {\n  107 |         free(win);\n  108 |         return (WINDOW *)NULL;\n  109 |     }\n  110 | \n  111 |     nlines = win->_maxy;\n  112 |     ncols = win->_maxx;\n  113 | \n  114 |     /* allocate the line pointer array */\n  115 | \n  116 |     if ( !(win->_y = malloc(nlines * sizeof(chtype *))) )\n  117 |     {\n  118 |         free(win);\n  119 |         return (WINDOW *)NULL;\n  120 |     }\n  121 | \n  122 |     /* allocate the minchng and maxchng arrays */\n  123 | \n  124 |     if ( !(win->_firstch = malloc(nlines * sizeof(int))) )\n  125 |     {\n  126 |         free(win->_y);\n  127 |         free(win);\n  128 |         return (WINDOW *)NULL;\n  129 |     }\n  130 | \n  131 |     if ( !(win->_lastch = malloc(nlines * sizeof(int))) )\n  132 |     {\n  133 |         free(win->_firstch);\n  134 |         free(win->_y);\n  135 |         free(win);\n  136 |         return (WINDOW *)NULL;\n  137 |     }\n  138 | \n  139 |     /* allocate the lines */\n  140 | \n  141 |     if ( !(win = PDC_makelines(win)) )\n  142 |         return (WINDOW *)NULL;\n  143 | \n  144 |     /* read them */\n  145 | \n  146 |     for (i = 0; i < nlines; i++)\n  147 |     {\n  148 |         if (!fread(win->_y[i], ncols * sizeof(chtype), 1, filep))\n  149 |         {\n  150 |             delwin(win);\n  151 |             return (WINDOW *)NULL;\n  152 |         }\n  153 |     }\n  154 | \n  155 |     touchwin(win);\n  156 | \n  157 |     return win;\n  158 | }","lines":68,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/scr_dump.c#L91-L158"}]},{"id":"OTHER_9","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"In the wide-character branch of form_driver (USE_WIDEC_SUPPORT), character validation via Check_Char is skipped entirely. The comment at line 4348 acknowledges this as a known gap ('FIXME: the wide-character branch should also use Check_Char()'). As a result, any non-control wide character is inserted without field-type validation, bypassing application-defined character filters. In a firmware context where form fields may guard configuration values, this allows invalid data to be entered.","fix":"Apply Check_Char validation in the wide-character path before calling Data_Entry, analogous to the narrow-character path at lines 4353-4355.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:4340-4357","code":" 4340 |   else if (!(c & (~(int)MAX_REGULAR_CHARACTER)))\n 4341 |     {\n 4342 |       /*\n 4343 |        * If we're using 8-bit characters, iscntrl+isprint cover the whole set.\n 4344 |        * But with multibyte characters, there is a third possibility, i.e.,\n 4345 |        * parts of characters that build up into printable characters which are\n 4346 |        * not considered printable.\n 4347 |        *\n 4348 |        * FIXME: the wide-character branch should also use Check_Char().\n 4349 |        */\n 4350 | #if USE_WIDEC_SUPPORT\n 4351 |       if (!iscntrl(UChar(c)))\n 4352 | #else\n 4353 |       if (isprint(UChar(c)) &&\n 4354 | \t  Check_Char(form, form->current, form->current->type, c,\n 4355 | \t\t     (TypeArgument *)(form->current->arg)))\n 4356 | #endif\n 4357 | \tres = Data_Entry(form, c);","lines":18,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L4340-L4357"}]},{"id":"OTHER_10","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"In Documentation/conf.py, subprocess.check_output(('git', 'describe')) is called without error handling. If git is not available, the working directory is not a git repository, or there are no tags (CalledProcessError), the Sphinx build fails with an uncaught exception and an unhelpful Python traceback instead of a useful error message. The decode().split() on line 17 also assumes UTF-8 output but does not handle potential codec errors.","fix":"Wrap the subprocess call in a try/except: try: release = subprocess.check_output(('git', 'describe'), stderr=subprocess.DEVNULL).decode('utf-8', errors='replace').strip() except Exception: release = 'unknown'","locations":[{"ref":"Documentation/conf.py:15-17","code":"   15 | release = subprocess.check_output(('git', 'describe')).decode(\"utf-8\")\n   16 | # The short X.Y version.\n   17 | version = release.split(\"-\")[0]","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/Documentation/conf.py#L15-L17"}]},{"id":"OTHER_11","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"In apic_sw_disable(), a debug printf statement was left in production code: printf(\"%s: writing %#x to %#x\\n\", __func__, reg, APIC_SPURIOUS). This prints diagnostic output to the console every time the APIC software-disable path is taken (once during apic_init), cluttering the firmware output. No equivalent debug print exists in the symmetric apic_sw_enable() or apic_setup_spurious() functions.","fix":"Remove the printf call from apic_sw_disable().","locations":[{"ref":"payloads/libpayload/arch/x86/apic.c:271","code":"  271 | \tprintf(\"%s: writing %#x to %#x\\n\", __func__, reg, APIC_SPURIOUS);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/apic.c#L271"}]},{"id":"OTHER_12","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"PDC_setclipboard() allocates 'malloc(length + 1)' bytes based on the caller-supplied 'length' parameter, but then copies the string with 'strcpy(pdc_SDL_clipboard, contents)', which copies until the null terminator in 'contents'. If the caller passes a 'length' value smaller than 'strlen(contents)', the strcpy writes beyond the allocated buffer. This is an API misuse hazard: the contract says length is the byte count of contents, but there is no enforcement.","fix":"Replace strcpy with 'memcpy(pdc_SDL_clipboard, contents, length); pdc_SDL_clipboard[length] = 0;' to honor the length parameter and prevent overflow when the caller passes a length smaller than the string.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c:71-89","code":"   71 | int PDC_setclipboard(const char *contents, long length)\n   72 | {\n   73 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n   74 | \n   75 |     if (pdc_SDL_clipboard)\n   76 |     {\n   77 |         free(pdc_SDL_clipboard);\n   78 |         pdc_SDL_clipboard = NULL;\n   79 |     }\n   80 | \n   81 |     if (contents)\n   82 |     {\n   83 |         if ((pdc_SDL_clipboard = malloc(length + 1)) == NULL)\n   84 |             return PDC_CLIP_MEMORY_ERROR;\n   85 | \n   86 |         strcpy(pdc_SDL_clipboard, contents);\n   87 |     }\n   88 | \n   89 |     return PDC_CLIP_SUCCESS;","lines":19,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c#L71-L89"}]},{"id":"OTHER_13","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"In the GDB stub, the `m` (memory read) command does `copy_to_hex(out_buffer, (void *)addr, length)` where `length` is parsed directly from the remote GDB packet via `parse_ulong`. `copy_to_hex` writes `2 * length + 1` bytes into the fixed `static char out_buffer[BUFMAX]` (`BUFMAX == 400`), so any request with `length > 199` overflows `out_buffer` into adjacent globals. `parse_ulong` performs no bound check. This is behind `CONFIG(GDB_STUB)` (debug-only, trusted debugger), so severity is low, but it is an unbounded global-buffer write.","fix":"Clamp the requested length before converting, e.g. reject or truncate when `length > (BUFMAX - 1) / 2`, returning an `E01`-style error packet for oversized reads.","locations":[{"ref":"src/arch/x86/exception.c:427-436","code":"  427 | \t\tcase 'm':\n  428 | \t\t\t/* mAA..AA,LLLL  Read LLLL bytes at address AA..AA */\n  429 | \t\t\tptr = &in_buffer[1];\n  430 | \t\t\tif (parse_ulong(&ptr, &addr) &&\n  431 | \t\t\t\t(*ptr++ == ',') &&\n  432 | \t\t\t\tparse_ulong(&ptr, &length)) {\n  433 | \t\t\t\tcopy_to_hex(out_buffer, (void *)addr, length);\n  434 | \t\t\t} else\n  435 | \t\t\t\tmemcpy(out_buffer, \"E01\", 4);\n  436 | \t\t\tbreak;","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/src/arch/x86/exception.c#L427-L436"}]},{"id":"OTHER_14","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"In apic.c, the spurious interrupt handler function name has a typo: 'suprious_interrupt_handler' should be 'spurious_interrupt_handler'. The function is registered with set_interrupt_handler and the typo is consistent so it doesn't break functionality, but it reduces code readability.","fix":"Rename suprious_interrupt_handler to spurious_interrupt_handler in both the definition and the set_interrupt_handler call.","locations":[{"ref":"payloads/libpayload/arch/x86/apic.c:162","code":"  162 | static void suprious_interrupt_handler(u8 vector) {}","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/apic.c#L162"},{"ref":"payloads/libpayload/arch/x86/apic.c:327","code":"  327 | \t\t\t      &suprious_interrupt_handler);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/apic.c#L327"}]},{"id":"OTHER_15","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"PDC_makelines() passes uninitialized local variables 'nlines' and 'ncols' to PDC_LOG at line 194, before they are assigned from win->_maxy and win->_maxx at lines 199-200. When PDC_LOG is compiled as a no-op this is harmless, but with logging enabled it invokes undefined behavior by reading uninitialised integers.","fix":"Move the PDC_LOG call to after the assignments of nlines and ncols (after lines 199-200), or change it to read from 'win->_maxy' and 'win->_maxx' directly.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/window.c:190-200","code":"  190 | WINDOW *PDC_makelines(WINDOW *win)\n  191 | {\n  192 |     int i, j, nlines, ncols;\n  193 | \n  194 |     PDC_LOG((\"PDC_makelines() - called: lines %d cols %d\\n\", nlines, ncols));\n  195 | \n  196 |     if (!win)\n  197 |         return (WINDOW *)NULL;\n  198 | \n  199 |     nlines = win->_maxy;\n  200 |     ncols = win->_maxx;","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/window.c#L190-L200"}]}]</script>

</div>
<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
