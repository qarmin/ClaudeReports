{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`Inner::read` opens a brand-new X11 connection and creates a brand-new X11 window for every\nsingle read that is not served from our own cached selection data\n(`let reader = XContext::new()?;`). `XContext::new` does a full `RustConnection::connect`\n(socket setup, authentication, and the complete server setup handshake including every screen,\nvisual, depth and format) plus a `CreateWindow` and a `flush`.\n\nEvery `get_text()`, `get_html()`, `get_image()` and `get_file_list()` on content owned by\nanother application pays that cost - tens of round trips - before the first\n`convert_selection` is even sent. The window is also never explicitly destroyed; it is only\nreclaimed when the connection is torn down at the end of `read`. For a UI that polls the\nclipboard (a common pattern for paste buttons and clipboard managers) this is the dominant\ncost of the operation, and it churns X server client slots.\n\n`Inner` already owns a long-lived `XContext` (`self.server`) used for ownership queries, so\nthe infrastructure for a reusable connection exists.\n","fix":"Create the reader `XContext` once and reuse it. Because reads can happen concurrently from\nseveral threads and the `ARBOARD_CLIPBOARD` property on a shared window would collide, guard\nit with a mutex:\n\n```rust\nstruct Inner {\n    server: XContext,\n    /// Long-lived connection used for reading other clients' selections. Behind a mutex\n    /// because concurrent reads would race on the `ARBOARD_CLIPBOARD` property.\n    reader: Mutex<XContext>,\n    // ...\n}\n```\n\n```rust\nfn read(&self, formats: &[Atom], selection: LinuxClipboardKind) -> Result<ClipboardData> {\n    // ... unchanged is_owner fast path ...\n    let reader = self.reader.lock();\n    for format in formats {\n        match self.read_single(&reader, selection, *format) { /* unchanged */ }\n    }\n    Err(Error::ContentNotAvailable)\n}\n```\n\n`read_single` already begins with `delete_property`, so a reused window starts each request\nfrom a clean state. Add an explicit `destroy_window` to a `Drop for XContext` so the\nshort-lived case (if any remains) does not rely on connection teardown.","locations":[{"ref":"src/platform/linux/x11.rs:296-329","code":"  296 | \tfn read(&self, formats: &[Atom], selection: LinuxClipboardKind) -> Result<ClipboardData> {\n  297 | \t\t// if we are the current owner, we can get the current clipboard ourselves\n  298 | \t\tif self.is_owner(selection)? {\n  299 | \t\t\tlet data = self.selection_of(selection).data.read();\n  300 | \t\t\tif let Some(data_list) = &*data {\n  301 | \t\t\t\tfor data in data_list {\n  302 | \t\t\t\t\tfor format in formats {\n  303 | \t\t\t\t\t\tif *format == data.format {\n  304 | \t\t\t\t\t\t\treturn Ok(data.clone());\n  305 | \t\t\t\t\t\t}\n  306 | \t\t\t\t\t}\n  307 | \t\t\t\t}\n  308 | \t\t\t}\n  309 | \t\t\treturn Err(Error::ContentNotAvailable);\n  310 | \t\t}\n  311 | \t\t// if let Some(data) = self.data.read().clone() {\n  312 | \t\t//     return Ok(data)\n  313 | \t\t// }\n  314 | \t\tlet reader = XContext::new()?;\n  315 | \n  316 | \t\ttrace!(\"Trying to get the clipboard data.\");\n  317 | \t\tfor format in formats {\n  318 | \t\t\tmatch self.read_single(&reader, selection, *format) {\n  319 | \t\t\t\tOk(bytes) => {\n  320 | \t\t\t\t\treturn Ok(ClipboardData { bytes, format: *format });\n  321 | \t\t\t\t}\n  322 | \t\t\t\tErr(Error::ContentNotAvailable) => {\n  323 | \t\t\t\t\tcontinue;\n  324 | \t\t\t\t}\n  325 | \t\t\t\tErr(e) => return Err(e),\n  326 | \t\t\t}\n  327 | \t\t}\n  328 | \t\tErr(Error::ContentNotAvailable)\n  329 | \t}","lines":34,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L296-L329"},{"ref":"src/platform/linux/x11.rs:139-176","code":"  139 | impl XContext {\n  140 | \tfn new() -> Result<Self> {\n  141 | \t\t// create a new connection to an X11 server\n  142 | \t\tlet (conn, screen_num): (RustConnection, _) =\n  143 | \t\t\tRustConnection::connect(None).map_err(|_| {\n  144 | \t\t\t\tError::unknown(\"X11 server connection timed out because it was unreachable\")\n  145 | \t\t\t})?;\n  146 | \t\tlet screen = conn.setup().roots.get(screen_num).ok_or(Error::unknown(\"no screen found\"))?;\n  147 | \t\tlet win_id = conn.generate_id().map_err(into_unknown)?;\n  148 | \n  149 | \t\tlet event_mask =\n  150 |             // Just in case that some program reports SelectionNotify events\n  151 |             // with XCB_EVENT_MASK_PROPERTY_CHANGE mask.\n  152 |             EventMask::PROPERTY_CHANGE |\n  153 |             // To receive DestroyNotify event and stop the message loop.\n  154 |             EventMask::STRUCTURE_NOTIFY;\n  155 | \t\t// create the window\n  156 | \t\tconn.create_window(\n  157 | \t\t\t// copy as much as possible from the parent, because no other specific input is needed\n  158 | \t\t\tCOPY_DEPTH_FROM_PARENT,\n  159 | \t\t\twin_id,\n  160 | \t\t\tscreen.root,\n  161 | \t\t\t0,\n  162 | \t\t\t0,\n  163 | \t\t\t1,\n  164 | \t\t\t1,\n  165 | \t\t\t0,\n  166 | \t\t\tWindowClass::COPY_FROM_PARENT,\n  167 | \t\t\tCOPY_FROM_PARENT,\n  168 | \t\t\t// don't subscribe to any special events because we are requesting everything we need ourselves\n  169 | \t\t\t&CreateWindowAux::new().event_mask(event_mask),\n  170 | \t\t)\n  171 | \t\t.map_err(into_unknown)?;\n  172 | \t\tconn.flush().map_err(into_unknown)?;\n  173 | \n  174 | \t\tOk(Self { conn, win_id })\n  175 | \t}\n  176 | }","lines":38,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L139-L176"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The four Wayland setters (`set_text`, `set_html`, `set_image`, `set_file_list`) each repeat\nthe same six-step preamble and epilogue: build `Options::new()`, call\n`opts.foreground(matches!(wait, WaitConfig::Forever))`, call\n`opts.clipboard(selection.try_into()?)`, size a `Vec<MimeSource>` from\n`exclude_from_history`, push the payload, call `add_clipboard_exclusions`, then\n`opts.copy_multi(sources).map_err(handle_copy_error)`. Only the middle \"push the payload\"\nstep differs.\n\nThis is why the `WaitConfig::Until` bug reported separately in this audit has to be fixed in\nfour places instead of one, and why a future MIME type will silently inherit whatever the\ncopy-pasted preamble happens to do.\n","fix":"Extract the shared shape into one function and let each setter provide only its sources:\n\n```rust\nfn copy_sources(\n    selection: LinuxClipboardKind,\n    wait: WaitConfig,\n    exclude_from_history: bool,\n    payload: impl IntoIterator<Item = MimeSource>,\n) -> Result<(), Error> {\n    let mut opts = Options::new();\n    opts.foreground(matches!(wait, WaitConfig::Forever));\n    opts.clipboard(selection.try_into()?);\n\n    let mut sources: Vec<MimeSource> = payload.into_iter().collect();\n    add_clipboard_exclusions(exclude_from_history, &mut sources);\n\n    opts.copy_multi(sources).map_err(handle_copy_error)\n}\n```\n\n`set_text` then becomes:\n\n```rust\ncopy_sources(\n    selection,\n    wait,\n    exclude_from_history,\n    [MimeSource {\n        source: Source::Bytes(text.into_owned().into_bytes().into_boxed_slice()),\n        mime_type: MimeType::Text,\n    }],\n)\n```","locations":[{"ref":"src/platform/linux/wayland.rs:118-139","code":"  118 | \tpub(crate) fn set_text(\n  119 | \t\t&self,\n  120 | \t\ttext: Cow<'_, str>,\n  121 | \t\tselection: LinuxClipboardKind,\n  122 | \t\twait: WaitConfig,\n  123 | \t\texclude_from_history: bool,\n  124 | \t) -> Result<(), Error> {\n  125 | \t\tlet mut opts = Options::new();\n  126 | \t\topts.foreground(matches!(wait, WaitConfig::Forever));\n  127 | \t\topts.clipboard(selection.try_into()?);\n  128 | \n  129 | \t\tlet mut sources = Vec::with_capacity(if exclude_from_history { 2 } else { 1 });\n  130 | \n  131 | \t\tsources.push(MimeSource {\n  132 | \t\t\tsource: Source::Bytes(text.into_owned().into_bytes().into_boxed_slice()),\n  133 | \t\t\tmime_type: MimeType::Text,\n  134 | \t\t});\n  135 | \n  136 | \t\tadd_clipboard_exclusions(exclude_from_history, &mut sources);\n  137 | \n  138 | \t\topts.copy_multi(sources).map_err(handle_copy_error)\n  139 | \t}","lines":22,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/wayland.rs#L118-L139"},{"ref":"src/platform/linux/wayland.rs:147-182","code":"  147 | \tpub(crate) fn set_html(\n  148 | \t\t&self,\n  149 | \t\thtml: Cow<'_, str>,\n  150 | \t\talt: Option<Cow<'_, str>>,\n  151 | \t\tselection: LinuxClipboardKind,\n  152 | \t\twait: WaitConfig,\n  153 | \t\texclude_from_history: bool,\n  154 | \t) -> Result<(), Error> {\n  155 | \t\tlet mut opts = Options::new();\n  156 | \t\topts.foreground(matches!(wait, WaitConfig::Forever));\n  157 | \t\topts.clipboard(selection.try_into()?);\n  158 | \n  159 | \t\tlet mut sources = {\n  160 | \t\t\tlet cap = [true, alt.is_some(), exclude_from_history]\n  161 | \t\t\t\t.map(|v| usize::from(v as u8))\n  162 | \t\t\t\t.iter()\n  163 | \t\t\t\t.sum();\n  164 | \t\t\tVec::with_capacity(cap)\n  165 | \t\t};\n  166 | \n  167 | \t\tif let Some(alt) = alt {\n  168 | \t\t\tsources.push(MimeSource {\n  169 | \t\t\t\tsource: Source::Bytes(alt.into_owned().into_bytes().into_boxed_slice()),\n  170 | \t\t\t\tmime_type: MimeType::Text,\n  171 | \t\t\t});\n  172 | \t\t}\n  173 | \n  174 | \t\tsources.push(MimeSource {\n  175 | \t\t\tsource: Source::Bytes(html.into_owned().into_bytes().into_boxed_slice()),\n  176 | \t\t\tmi {"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"The public documentation for `Clipboard::set_image` and `Set::image` states the Windows output\nformat is \"In order of priority `CF_DIB` and `CF_BITMAP`\". Neither format is used anywhere in\nthe crate: `windows::Set::image` writes a registered `\"PNG\"` format first (via\n`add_png_file`) and then `CF_DIBV5` (via `add_cf_dibv5`). `CF_DIB` and `CF_BITMAP` do not\nappear in `src/platform/windows.rs` at all.\n\nThis misleads users making interoperability decisions - `CF_DIBV5` carries an alpha channel\nand `CF_DIB` does not, and the PNG format that is actually written first is the one most\nconsumers will pick up. The same wrong list is duplicated in both doc comments.\n","fix":"Describe what the code does, in both places:\n\n```rust\n/// The chosen output format, depending on the platform is the following:\n///\n/// - On macOS: `NSImage` object\n/// - On Linux: PNG, under the atom `image/png`\n/// - On Windows: In order of priority, a registered `PNG` format and `CF_DIBV5`\n```","locations":[{"ref":"src/lib.rs:133-140","code":"  133 | \t/// Places an image to the clipboard.\n  134 | \t///\n  135 | \t/// The chosen output format, depending on the platform is the following:\n  136 | \t///\n  137 | \t/// - On macOS: `NSImage` object\n  138 | \t/// - On Linux: PNG, under the atom `image/png`\n  139 | \t/// - On Windows: In order of priority `CF_DIB` and `CF_BITMAP`\n  140 | \t///","lines":8,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/lib.rs#L133-L140"},{"ref":"src/lib.rs:238-245","code":"  238 | \t/// Completes the \"set\" operation by placing an image onto the clipboard.\n  239 | \t///\n  240 | \t/// The chosen output format, depending on the platform is the following:\n  241 | \t///\n  242 | \t/// - On macOS: `NSImage` object\n  243 | \t/// - On Linux: PNG, under the atom `image/png`\n  244 | \t/// - On Windows: In order of priority `CF_DIB` and `CF_BITMAP`\n  245 | \t#[cfg(feature = \"image-data\")]","lines":8,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/lib.rs#L238-L245"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`Error::ConversionFailure`'s user-facing `Display` string reads \"The image or the text that\nwas about the be transferred\" - \"about the be\" should be \"about to be\". This is not an\ninternal comment: it is the text end users see whenever a clipboard conversion fails, and the\nsame typo is duplicated in the doc comment on the variant.\n","fix":"Fix both occurrences:\n\n```rust\n/// The image or the text that was about to be transferred to/from the clipboard could not be\n/// converted to the appropriate format.\nConversionFailure,\n```\n\n```rust\nError::ConversionFailure => f.write_str(\"The image or the text that was about to be transferred to/from the clipboard could not be converted to the appropriate format.\"),\n```","locations":[{"ref":"src/common.rs:44-46","code":"   44 | \t/// The image or the text that was about the be transferred to/from the clipboard could not be\n   45 | \t/// converted to the appropriate format.\n   46 | \tConversionFailure,","lines":3,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/common.rs#L44-L46"},{"ref":"src/common.rs:61","code":"   61 | \t\t\tError::ConversionFailure => f.write_str(\"The image or the text that was about the be transferred to/from the clipboard could not be converted to the appropriate format.\"),","lines":1,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/common.rs#L61"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"A cluster of typos in comments and doc comments: `comformly` -> `conformly`/`conformantly`,\n`infomrs` -> `informs`, `destorying` -> `destroying`, `unnessecary` -> `unnecessary`,\n`werent` -> `weren't`, `an the data` -> `the data`, `nessecarily` -> `necessarily`,\n`consistently` -> `consistency` (in \"so Windows should too for consistently\"), and in public\nrustdoc `it's of not guaranteed` -> `it's not guaranteed` plus\n`will be possible read back` -> `can be read back`. The last two appear in the published API\ndocumentation for `Clipboard::get_image` and `Get::image`.\n","fix":"Straight spelling fixes. The two user-visible rustdoc ones matter most:\n\n```rust\n/// Fetches image data from the clipboard, and returns the decoded pixels.\n///\n/// Any image data placed on the clipboard with `set_image` can be read back using this\n/// function. However, it is not guaranteed that an image placed on the clipboard by any\n/// other application will be of a supported format.\n```\n\nConsider adding `typos` (<https://github.com/crate-ci/typos>) to CI to keep these from\naccumulating.","locations":[{"ref":"src/platform/linux/x11.rs:222-228","code":"  222 | \t/// Performs a \"clear\" operation on the clipboard, which is implemented by\n  223 | \t/// relinquishing the selection to revert its owner to `None`. This gracefully\n  224 | \t/// and comformly informs the X server and any clipboard managers that the\n  225 | \t/// data was no longer valid and won't be offered from our window anymore.\n  226 | \t///\n  227 | \t/// See `ask_clipboard_manager_to_request_our_data` for more details on why\n  228 | \t/// this is important and specification references.","lines":7,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L222-L228"},{"ref":"src/platform/linux/x11.rs:634-641","code":"  634 | \t\t\t// NB: `SAVE_TARGETS` in this context is a marker atom which infomrs the clipboard manager\n  635 | \t\t\t// we support this operation and _may_ use it in the future. To try and keep the manager's\n  636 | \t\t\t// expectations/assumptions (if any) about when we will invoke this handoff, we go ahead and\n  637 | \t\t\t// skip advertising support for the save operation entirely when the data was marked as\n  638 | \t\t\t// sensitive.\n  639 | \t\t\t//\n  640 | \t\t\t// Note that even if we don't advertise it, some managers may respond to it anyways so this is\n  641 | \t\t\t// only half of exclusion handling. See `ask_clipboard_manager_to_request_our_data` for more.","lines":8,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L634-L641"},{"ref":"src/platform/linux/x11.rs:736-751","code":"  736 | \t\t\t\t// generate unnessecary warning logs in our handoff path even when we know a well-behaving manager isn't\n  737 | \t\t\t\t// trying to save our sensitive data and that is misleading to users.\n  738 | \t\t\t\tif data.iter().any(|data| data.format == self.atoms.X_KDE_PASSWORDMANAGERHINT) {\n  739 | \t\t\t\t\t// This step is the most important. Without it, some clipboard managers may think that our process\n  740 | \t\t\t\t\t// crashed since the X window is destroyed without changing the selection owner first and try to save data.\n  741 | \t\t\t\t\t//\n  742 | \t\t\t\t\t// While this shouldn't need to happen based only on ICCCM 2.3.1 (\"Voluntarily Giving Up Selection Ownership\"),\n  743 | \t\t\t\t\t// its documentation that destorying the owner window or terminating also reverts the owner to `None` doesn't\n  744 | \t\t\t\t\t// reflect how desktop environment's X servers work in reality.\n  745 | \t\t\t\t\t//\n  746 | \t\t\t\t\t// By removing the owner, the manager doesn't think it needs to pick up our window's data serving once\n  747 | \t\t\t\t\t// its destroyed and cleanly lets the data disappear based off the previously advertised exclusion hint.\n  748 | \t\t\t\t\tif let Err(e) = self.clear(selection) {\n  749 | \t\t\t\t\t\twarn!(\"failed to release sensitive data's clipboard ownership: {e}; it may end up persisted!\");\n  750 | \t\t\t\t\t\t// This is still not an error because we werent going to handoff anything to the manager.\n  751 | \t\t\t\t\t}","lines":16,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L736-L751"},{"ref":"src/platform/linux/x11.rs:386-390","code":"  386 | \t\t\t\t\t\tReadSelNotifyResult::IncrStarted => {\n  387 | \t\t\t\t\t\t\t// This means we received an indication that an the\n  388 | \t\t\t\t\t\t\t// data is going to be sent INCRementally. Let's\n  389 | \t\t\t\t\t\t\t// reset our timeout.\n  390 | \t\t\t\t\t\t\ttimeout_end += SHORT_TIMEOUT_DUR;","lines":5,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L386-L390"},{"ref":"src/platform/windows.rs:518-519","code":"  518 | // The other platforms have `Drop` implementation on their\n  519 | // clipboard, so Windows should too for consistently.","lines":2,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L518-L519"},{"ref":"src/platform/windows.rs:595-605","code":"  595 | \t\t// NB: Its important that whatever functionality decodes the text buffer from the clipboard\n  596 | \t\t// uses `WideCharToMultiByte` with `CP_UTF8` (or an equivalent) in order to handle when both \"text\"\n  597 | \t\t// and a locale identifier were placed on the clipboard. It is probable this occurs when an application\n  598 | \t\t// is running with a codepage that isn't the current system's, such as under a locale emulator.\n  599 | \t\t//\n  600 | \t\t// In these cases, Windows decodes the text buffer with whatever codepage that identifier is for\n  601 | \t\t// when creating the `CF_UNICODETEXT` {"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`add_cf_dibv5` truncates image geometry into the `BITMAPV5HEADER` without any range check:\n`bV5Width: image.width as i32` and `bV5Height: image.height as i32` narrow `usize` to `i32`,\nand `bV5SizeImage: (4 * image.width * image.height) as u32` both multiplies in `usize` and\nnarrows to `u32`. `width`, `height` and `bytes` are public fields on `ImageData`, so they are\ncaller-supplied.\n\nA width above `i32::MAX` wraps to a negative value, and a negative `bV5Height` is\n*meaningful* in this format - it flips the row order - which is precisely the behaviour the\ncomment above `flip_v` says must be avoided because MS Word and WordPad cannot paste it. A\n`4 * width * height` product above `u32::MAX` (a ~4 GB image) yields a `bV5SizeImage` smaller\nthan the data actually written, so consumers read a truncated image.\n\nThese sizes are unreasonable for a clipboard image, which is why this is `low` rather than\nhigher - but the failure is silent corruption rather than an error, and the guard is one\n`checked_mul` chain.\n","fix":"Validate up front and return `Error::ConversionFailure`, matching how the other\nsize problems in this file are reported:\n\n```rust\nlet size_image: u32 = image\n    .width\n    .checked_mul(image.height)\n    .and_then(|px| px.checked_mul(4))\n    .and_then(|n| u32::try_from(n).ok())\n    .ok_or(Error::ConversionFailure)?;\nlet width = i32::try_from(image.width).map_err(|_| Error::ConversionFailure)?;\nlet height = i32::try_from(image.height).map_err(|_| Error::ConversionFailure)?;\n\nlet header = BITMAPV5HEADER {\n    bV5Size: header_size as u32,\n    bV5Width: width,\n    bV5Height: height,\n    // ...\n    bV5SizeImage: size_image,\n    // ...\n};\n```","locations":[{"ref":"src/platform/windows.rs:62-70","code":"   62 | \t\tlet header_size = size_of::<BITMAPV5HEADER>();\n   63 | \t\tlet header = BITMAPV5HEADER {\n   64 | \t\t\tbV5Size: header_size as u32,\n   65 | \t\t\tbV5Width: image.width as i32,\n   66 | \t\t\tbV5Height: image.height as i32,\n   67 | \t\t\tbV5Planes: 1,\n   68 | \t\t\tbV5BitCount: 32,\n   69 | \t\t\tbV5Compression: BI_BITFIELDS,\n   70 | \t\t\tbV5SizeImage: (4 * image.width * image.height) as u32,","lines":9,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L62-L70"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`src/platform/linux/x11.rs` is 1177 hand-written lines holding at least five separable\nconcerns with no internal boundaries:\n\n1. X11 connection/window lifecycle (`XContext`).\n2. Selection storage and the \"wait until replaced\" condvar protocol (`Selection`,\n   `Inner::write`).\n3. The ICCCM *requestor* side, including `INCR` reassembly (`read`, `read_single`,\n   `handle_read_selection_notify`, `handle_read_property_notify`).\n4. The ICCCM *owner* side event loop (`serve_requests`, `handle_selection_request`).\n5. Clipboard-manager `SAVE_TARGETS` handover, plus the process-global singleton and its\n   teardown (`ask_clipboard_manager_to_request_our_data`, `Clipboard::new`, `Drop`).\n\n`Inner` is the seam where they collide: one struct with 8 fields serving as X connection\nowner, three-selection data store, condvar rendezvous, handover state machine, and\nthread-liveness flag, with a 590-line `impl` block. Any change to one concern requires\nreasoning about the locking discipline of all of them - which is how the `MIN_OWNERS`\nequality bug, the orphaned-server-thread leak, and the collapsed `INCR` timeout reported\nelsewhere in this audit all became possible in the same file.\n","fix":"Split the file into a `src/platform/linux/x11/` module directory along the existing seams,\nwhich are already clean:\n\n```\nx11/mod.rs        // pub(crate) Clipboard, the CLIPBOARD singleton, Drop\nx11/context.rs    // XContext (+ a real Drop that destroys the window)\nx11/selection.rs  // Selection, ClipboardData, the data_changed protocol\nx11/requestor.rs  // read, read_single, INCR reassembly\nx11/owner.rs      // serve_requests, handle_selection_request\nx11/handover.rs   // ManagerHandoverState, SAVE_TARGETS handoff\n```\n\nMove the locking rules to the top of `selection.rs` as the single place they are documented.\nNo behaviour needs to change in the first pass - it is a pure move, which makes it reviewable\nand lets the bugs above be fixed independently afterwards.","locations":[{"ref":"src/platform/linux/x11.rs:111-137","code":"  111 | struct GlobalClipboard {\n  112 | \tinner: Arc<Inner>,\n  113 | \n  114 | \t/// Join handle to the thread which serves selection requests.\n  115 | \tserver_handle: JoinHandle<()>,\n  116 | }\n  117 | \n  118 | struct XContext {\n  119 | \tconn: RustConnection,\n  120 | \twin_id: u32,\n  121 | }\n  122 | \n  123 | struct Inner {\n  124 | \t/// The context for the thread which serves clipboard read\n  125 | \t/// requests coming to us.\n  126 | \tserver: XContext,\n  127 | \tatoms: Atoms,\n  128 | \n  129 | \tclipboard: Selection,\n  130 | \tprimary: Selection,\n  131 | \tsecondary: Selection,\n  132 | \n  133 | \thandover_state: Mutex<ManagerHandoverState>,\n  134 | \thandover_cv: Condvar,\n  135 | \n  136 | \tserve_stopped: AtomicBool,\n  137 | }","lines":27,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L111-L137"},{"ref":"src/platform/linux/x11.rs:204-797","code":"  204 | impl Inner {\n  205 | \tfn new() -> Result<Self> {\n  206 | \t\tlet server = XContext::new()?;\n  207 | \t\tlet atoms =\n  208 | \t\t\tAtoms::new(&server.conn).map_err(into_unknown)?.reply().map_err(into_unknown)?;\n  209 | \n  210 | \t\tOk(Self {\n  211 | \t\t\tserver,\n  212 | \t\t\tatoms,\n  213 | \t\t\tclipboard: Selection::default(),\n  214 | \t\t\tprimary: Selection::default(),\n  215 | \t\t\tsecondary: Selection::default(),\n  216 | \t\t\thandover_state: Mutex::new(ManagerHandoverState::Idle),\n  217 | \t\t\thandover_cv: Condvar::new(),\n  218 | \t\t\tserve_stopped: AtomicBool::new(false),\n  219 | \t\t})\n  220 | \t}\n  221 | \n  222 | \t/// Performs a \"clear\" operation on the clipboard, which is implemented by\n  223 | \t/// relinquishing the selection to revert its owner to `None`. This gracefully\n  224 | \t/// and comformly inf {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`Drop for Clipboard` in the X11 backend is a ~95-line method doing five unrelated jobs:\nrefcount-based \"am I the last owner\" arbitration, clipboard-manager handover, X window\nteardown, server-thread joining *with* hand-rolled panic-payload downcasting\n(`&'static str` then `String`), and - under `#[cfg(debug_assertions)]` - a developer\ndiagnostic that reaches into all three `Selection` mutexes, sorts change timestamps, checks\n`std::io::stderr().is_terminal()`, and picks between `eprintln!` and `log::warn!`.\n\nNothing here can be unit-tested, the interesting failure paths (`destroy_window` failing,\nthe server thread having already exited) are exactly the ones that are wrong, and the\ndebug-only block is roughly a third of the method while being pure advice to the developer.\n","fix":"Decompose into named steps so each is separately readable and testable:\n\n```rust\nimpl Drop for Clipboard {\n    fn drop(&mut self) {\n        const MIN_OWNERS: usize = 3;\n\n        let mut global_cb = CLIPBOARD.lock();\n        if Arc::strong_count(&self.inner) > MIN_OWNERS {\n            return;\n        }\n\n        self.inner.handoff_to_clipboard_manager();\n        self.inner.teardown_server_window();\n        if let Some(global) = global_cb.take() {\n            join_server_thread(global);\n        }\n        #[cfg(debug_assertions)]\n        self.warn_if_dropped_too_quickly();\n    }\n}\n```\n\nExtract the panic-payload downcasting into a free `fn panic_message(e: Box<dyn Any + Send>)\n-> Option<String>` (it is generic and unit-testable), and move the debug diagnostic into its\nown `#[cfg(debug_assertions)] impl` block at the bottom of the file.","locations":[{"ref":"src/platform/linux/x11.rs:1082-1177","code":" 1082 | impl Drop for Clipboard {\n 1083 | \tfn drop(&mut self) {\n 1084 | \t\t// There are always at least 3 owners:\n 1085 | \t\t// the global, the server thread, and one `Clipboard::inner`\n 1086 | \t\tconst MIN_OWNERS: usize = 3;\n 1087 | \n 1088 | \t\t// We start with locking the global guard to prevent race\n 1089 | \t\t// conditions below.\n 1090 | \t\tlet mut global_cb = CLIPBOARD.lock();\n 1091 | \t\tif Arc::strong_count(&self.inner) == MIN_OWNERS {\n 1092 | \t\t\t// If the are the only owners of the clipboard are ourselves and\n 1093 | \t\t\t// the global object, then we should destroy the global object,\n 1094 | \t\t\t// and send the data to the clipboard manager\n 1095 | \n 1096 | \t\t\tif let Err(e) = self.inner.ask_clipboard_manager_to_request_our_data() {\n 1097 | \t\t\t\terror!(\"Could not hand the clipboard data over to the clipboard manager: {}\", e);\n 1098 | \t\t\t}\n 1099 | \t\t\tlet global_cb = global_cb.take();\n 1100 | \t\t\tif let Err(e) = self.inner.server.conn.destroy_window(self.inner.server.win_id) {\n 1101 | \t\t\t\terror!(\"Failed to destroy the clipboard window. Error: {}\", e);\n 1102 | \t\t\t\treturn;\n 1103 | \t\t\t}\n 1104 | \t\t\tif let Err(e) = self.inner.server.conn.flush() {\n 1105 | \t\t\t\terror!(\"Failed to flush the clipboard window. Error: {}\", e);\n 1106 | \t\t\t\treturn;\n 1107 | \t\t\t}\n 1108 | \t\t\tif let Some(global_cb) = global_cb {\n 1109 | \t\t\t\tlet GlobalClipboard { inner, server_handle } = global_cb;\n 1110 | \t\t\t\tdrop(inner);\n 1111 | \n 1112 | \t\t\t\tif let Err(e) = server_handle.join() {\n 1113 | \t\t\t\t\t// Let's try extracting the error message\n 1114 | \t\t\t\t\tlet message;\n 1115 | \t\t\t\t\tif let Some(msg) = e.downcast_ref::<&'static str>() {\n 1116 | \t\t\t\t\t\tmessage = Some((*msg).to_string());\n 1117 | \t\t\t\t\t} else if let Some(msg) = e.downcast_ref::<String>() {\n 1118 | \t\t\t\t\t\tmessage = Some(msg.clone());\n 1119 | \t\t\t\t\t} else {\n 1120 | \t\t\t\t\t\tmessage = None;\n 1121 | \t\t\t\t\t}\n 1122 | \t\t\t\t\tif let Some(message) = message {\n 1123 | \t\t\t\t\t\terror!(\n 1124 | \t\t\t\t\t\t\t\"The clipboard server thread panicked. Panic message: '{}'\",\n 1125 | \t\t\t\t\t\t\tmessage,\n 1126 | \t\t\t\t\t\t);\n 1127 | \t\t\t\t\t} else {\n 1128 | \t\t\t\t\t\terror!(\"The clipboard server thread panicked.\");\n 1129 | \t\t\t\t\t}\n 1130 | \t\t\t\t}\n 1131 | \n 1132 | \t\t\t\t// By this point we've dropped the Global's reference to `Inner` and the background\n 1133 | \t\t\t\t// thread has exited which means it also dropped its reference. Therefore `self.inner` should\n 1134 | \t\t\t\t// be the last strong count.\n 1135 | \t\t\t\t//\n 1136 | \t\t\t\t// Note: The following is all best effort and is only for logging. Nothing is guaranteed to execute\n 1137 | \t\t\t\t// or log.\n 1138 | \t\t\t\t#[cfg(debug_assertions)]\n 1139 | \t\t\t\tif let Some(inner) = Arc::get_mut(&mut self.inner) {\n 1140 | \t\t\t\t\tuse std::io::IsTerminal;\n 1141 | \n 1142 | \t\t\t\t\tlet mut change_timestamps = Vec::with_capacity(2);\n 1143 | \t\t\t\t\tlet mut collect_changed = |sel: &mut Mutex<Option<Instant>>| {\n 1144 | \t\t\t\t\t\tif let Some(changed) = sel.get_mut() {\n 1145 | \t\t\t\t\t\t\tchange_timestamps.push(*changed);\n 1146 | \t\t\t\t\t\t}\n 1147 | \t\t\t\t\t};\n 1148 | \n 1149 | \t\t\t\t\tcollect_changed(&mut inner.clipboard.mutex);\n 1150 | \t\t\t\t\tcollect_changed(&mut inner.primary.mutex);\n 1151 | \t\t\t\t\tcollect_changed(&mut inner.secondary.mutex);\n 1152 | \n 1153 | \t\t\t\t\tchange_timestamps.sort();\n 1154 | \t\t\t\t\tif let Some(last) = change_timestamps.last() {\n 1155 | \t\t\t\t\t\tlet elapsed = last.elapsed().as_millis();\n 1156 | \t\t\t\t\t\t// This number has no meaning, its just a guess for how long\n 1157 | \t\t\t\t\t\t// might be reasonable to give a clipboard manager a chance to\n 1158 | \t\t\t\t\t\t// save contents based ~roughly on the handoff timeout.\n 1159 | \t\t\t\t\t\tif elapsed > 100 {\n 1160 | \t\t\t\t\t\t\treturn;\n 1161 | \t\t\t\t\t\t}\n 1162 | \n 1163 | \t\t\t\t\t\t// If the app isn't running in a terminal don't print, use log instead.\n 1164 | \t\t\t\t\t\t// Printing has a higher chance of being seen though, so its our default.\n 1165 | \t\t\t\t\t\t// Its also close enough to a `debug_assert!` that it shouldn't come across strange.\n 1166 | \t\t\t\t\t\tlet msg = format!(\"Clipboard was dropped very quickly after writing ({elapsed}ms); clipboard managers may not have seen the contents\\nConsider keeping `Clipboard` in more persistent state somewhere or keeping the contents alive longer using `SetLinuxExt` and/or threads.\");\n 1167 | \t\t\t\t\t\tif std::io::stderr().is_terminal() {\n 1168 | \t\t\t\t\t\t\teprintln!(\"{msg}\");\n 1169 | \t\t\t\t\t\t} else {\n 1170 | \t\t\t\t\t\t\tlog::warn!(\"{msg}\");\n 1171 | \t\t\t\t\t\t}\n 1172 | \t\t\t\t\t}\n 1173 | \t\t\t\t}\n 1174 | \t\t\t}\n 1175 | \t\t}\n 1176 | \t}\n 1177 | }","lines":96,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L1082-L1177"}]},
{"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`src/platform/windows.rs` is 1018 lines mixing three layers that have nothing to do with each\nother:\n\n- A generic Win32 shim layer: the `ResultValue` trait with its two `windows-sys` version\n  compatibility impls, `global_alloc` / `global_lock` / `global_unlock_checked`,\n  `last_error`, and `fill_utf16_buf` - the last one a 64-line verbatim copy of a `std`\n  internal, complete with its own `unreachable!()` and a link to the `rust-lang/rust` commit\n  it was lifted from.\n- Clipboard business logic: `Clipboard`, `OpenClipboard`, `Get`, `Set`, `Clear`,\n  `add_clipboard_exclusions`, `wrap_html`, `to_final_path_wide`.\n- A 400-line inline `mod image_data` that is both implementation (DIBv5 header fiddling,\n  RGBA<->BGRA conversion, vertical flip, PNG encode/decode) *and* the file's entire test\n  suite, including two large byte-array fixtures captured from Firefox and Chrome.\n\nThe `wrap_html` CF_HTML offset arithmetic is a self-contained, easily-mis-edited format\nencoder with no tests at all, sitting between a pasteboard builder and a path-canonicalisation\nhelper.\n","fix":"Promote the file to a `src/platform/windows/` directory:\n\n```\nwindows/mod.rs        // Clipboard, OpenClipboard, Get, Set, Clear\nwindows/win32.rs      // ResultValue, global_alloc/lock/unlock, last_error, fill_utf16_buf\nwindows/html.rs       // wrap_html + unit tests for the CF_HTML offsets\nwindows/paths.rs      // to_final_path_wide\nwindows/image_data.rs // existing mod image_data, with its tests in a #[cfg(test)] submodule\n```\n\n`wrap_html` deserves a test in the move: assert that the `StartHTML` / `EndHTML` /\n`StartFragment` / `EndFragment` offsets in the produced string actually index the `<html>`\ntag, the end of the document, and the fragment boundaries - the arithmetic is currently\nverified only indirectly by the round-trip in `src/lib.rs`.","locations":  fill_utf16_buf<F1, F2, T>(mut f1: F1, f2: F2) -> Option<T>\n  956 | where\n  957 | \tF1: FnMut(*mut u16, u32) -> u32,\n  958 | \tF2: FnOnce(&[u16]) -> T,\n  959 | {\n  960 | \t// Start off with a stack buf but then spill over to the heap if we end up\n  961 | \t// needing more space.\n  962 | \t//\n  963 | \t// This initial size also works around `GetFullPathNameW` returning\n  964 | \t// incorrect size hints for some short paths:\n  965 | \t// https://github.com/dylni/normpath/issues/5\n  966 | \tlet mut stack_buf: [std::mem::MaybeUninit<u16>; 512] = [std::mem::MaybeUninit::uninit(); 512];\n  967 | \tlet mut heap_buf: Vec<std::mem::MaybeUninit<u16>> = Vec::new();\n  968 | \tunsafe {\n  969 | \t\tlet mut n = stack_buf.len();\n  970 | \t\tloop {\n  971 | \t\t\tlet buf = if n <= stack_buf.len() {\n  972 | \t\t\t\t&mut stack_buf[..]\n  973 | \t\t\t} else {\n  974 | \t\t\t\tlet extra = n - heap_buf.len();\n  975 | \t\t\t\theap_buf.reserve(extra);\n  976 | \t\t\t\t// We used `reserve` and not `reserve_exact`, so in theory we\n  977 | \t\t\t\t// may have gotten more than requested. If so, we'd like to use\n  978 | \t\t\t\t// it... so long as we won't cause overflow.\n  979 | \t\t\t\tn = heap_buf.capacity().min(u32::MAX as usize);\n  980 | \t\t\t\t// Safety: MaybeUninit<u16> does not need initialization\n  981 | \t\t\t\theap_buf.set_len(n);\n  982 | \t\t\t\t&mut heap_buf[..]\n  983 | \t\t\t};\n  984 | \n  985 | \t\t\t// This function is typically called on windows API functions which\n  986 | \t\t\t// will return the correct length of the string, but these functions\n  987 | \t\t\t// also return the `0` on error. In some cases, however, the\n  988 | \t\t\t// returned \"correct length\" may actually be 0!\n  989 | \t\t\t//\n  990 | \t\t\t// To handle this case we call `SetLastError` to reset it to 0 and\n  991 | \t\t\t// then check it again if we get the \"0 error value\". If the \"last\n  992 | \t\t\t// error\" is still 0 then we interpret it as a 0 length buffer and\n  9 const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
