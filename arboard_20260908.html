<!DOCTYPE html>
<html lang="en">
<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}

.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}

.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}

.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}

.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}

{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The Wayland backend silently ignores `WaitConfig::Until`. Every setter maps the wait\nconfiguration with `opts.foreground(matches!(wait, WaitConfig::Forever))`, so\n`WaitConfig::Until(deadline)` collapses to `false` - identical to `WaitConfig::None`.\n\n`SetExtLinux::wait_until(deadline)` is documented as \"a superset of `wait()`\" and is the\nrecommended way for a short-lived program to keep clipboard contents alive for a bounded\ntime. Under Wayland (which is the default backend whenever `WAYLAND_DISPLAY` is set and the\n`wayland-data-control` feature is on) the call is a no-op: the function returns immediately,\nthe process exits, and the clipboard contents vanish. The caller gets `Ok(())` and no\nindication that the requested behaviour was not performed.\n\nAll four setters are affected: `set_text`, `set_html`, `set_image`, `set_file_list`.\n","fix":"`wl-clipboard-rs` has no \"wait until deadline\" mode, so it has to be emulated. Add a\nhelper that runs the copy in the foreground on a worker thread and abandons it at the\ndeadline, or - simplest correct behaviour - run `foreground(true)` in a spawned thread and\nhave the caller block until `deadline`:\n\n```rust\nfn serve(opts: Options, sources: Vec<MimeSource>, wait: WaitConfig) -> Result<(), Error> {\n    match wait {\n        WaitConfig::Until(deadline) => {\n            let handle = std::thread::spawn(move || opts.copy_multi(sources));\n            // The compositor owns the data for as long as the thread lives.\n            while Instant::now() < deadline && !handle.is_finished() {\n                std::thread::sleep(Duration::from_millis(10));\n            }\n            Ok(())\n        }\n        _ => opts.copy_multi(sources).map_err(handle_copy_error),\n    }\n}\n```\n\nIf emulation is not wanted, the honest alternative is to return\n`Err(Error::ClipboardNotSupported)` for `WaitConfig::Until` on Wayland instead of silently\nignoring it - but do not keep returning `Ok(())`.","locations":[{"ref":"src/platform/linux/wayland.rs:118-139","code":"  118 | \tpub(crate) fn set_text(\n  119 | \t\t&self,\n  120 | \t\ttext: Cow<'_, str>,\n  121 | \t\tselection: LinuxClipboardKind,\n  122 | \t\twait: WaitConfig,\n  123 | \t\texclude_from_history: bool,\n  124 | \t) -> Result<(), Error> {\n  125 | \t\tlet mut opts = Options::new();\n  126 | \t\topts.foreground(matches!(wait, WaitConfig::Forever));\n  127 | \t\topts.clipboard(selection.try_into()?);\n  128 | \n  129 | \t\tlet mut sources = Vec::with_capacity(if exclude_from_history { 2 } else { 1 });\n  130 | \n  131 | \t\tsources.push(MimeSource {\n  132 | \t\t\tsource: Source::Bytes(text.into_owned().into_bytes().into_boxed_slice()),\n  133 | \t\t\tmime_type: MimeType::Text,\n  134 | \t\t});\n  135 | \n  136 | \t\tadd_clipboard_exclusions(exclude_from_history, &mut sources);\n  137 | \n  138 | \t\topts.copy_multi(sources).map_err(handle_copy_error)\n  139 | \t}","lines":22,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/wayland.rs#L118-L139"},{"ref":"src/platform/linux/wayland.rs:155-157","code":"  155 | \t\tlet mut opts = Options::new();\n  156 | \t\topts.foreground(matches!(wait, WaitConfig::Forever));\n  157 | \t\topts.clipboard(selection.try_into()?);","lines":3,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/wayland.rs#L155-L157"},{"ref":"src/platform/linux/wayland.rs:215-217","code":"  215 | \t\tlet mut opts = Options::new();\n  216 | \t\topts.foreground(matches!(wait, WaitConfig::Forever));\n  217 | \t\topts.clipboard(selection.try_into()?);","lines":3,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/wayland.rs#L215-L217"},{"ref":"src/platform/linux/wayland.rs:251-253","code":"  251 | \t\tlet mut opts = Options::new();\n  252 | \t\topts.foreground(matches!(wait, WaitConfig::Forever));\n  253 | \t\topts.clipboard(selection.try_into()?);","lines":3,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/wayland.rs#L251-L253"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"On Windows, `Set::image` is the only setter that never calls `add_clipboard_exclusions`.\n`Set::text`, `Set::html` and `Set::file_list` all end with a call to it, but `Set::image`\nreturns `Ok(())` directly after `add_cf_dibv5`. As a result\n`clipboard.set().exclude_from_history().image(img)` (and likewise `exclude_from_cloud()` /\n`exclude_from_monitoring()`) silently does nothing: the image is written to the clipboard\n*and* still gets picked up by Windows clipboard history and the cloud clipboard.\n\nThis is a privacy failure with no visible symptom - the call chain compiles, returns `Ok(())`,\nand the caller has no way to detect that the exclusion was dropped. Screenshots of secrets\n(the exact use case `exclude_from_history` exists for) end up in Win+V history.\n\nNote also that `add_cf_dibv5` takes `open_clipboard` by value, so the exclusions cannot be\napplied afterwards without restructuring - `add_cf_dibv5` has to hand the token back or take\nit by reference.\n","fix":"Thread the `OpenClipboard` token through so the exclusions can still be applied. Change\n`add_cf_dibv5` to borrow it:\n\n```rust\npub(super) fn add_cf_dibv5(\n    _open_clipboard: &OpenClipboard<'_>,\n    image: ImageData,\n) -> Result<(), Error> {\n```\n\nand then in `Set::image`:\n\n```rust\nimage_data::add_png_file(&image)?;\nimage_data::add_cf_dibv5(&open_clipboard, image)?;\n\nadd_clipboard_exclusions(\n    open_clipboard,\n    self.exclude_from_monitoring,\n    self.exclude_from_cloud,\n    self.exclude_from_history,\n)\n```\n\nA regression test is worth adding: set an image with `exclude_from_history()` and assert\n`CanIncludeInClipboardHistory` is present via `clipboard_win::is_format_avail`.","locations":[{"ref":"src/platform/windows.rs:712-727","code":"  712 | \t#[cfg(feature = \"image-data\")]\n  713 | \tpub(crate) fn image(self, image: ImageData) -> Result<(), Error> {\n  714 | \t\tlet open_clipboard = self.clipboard?;\n  715 | \n  716 | \t\tif let Err(e) = clipboard_win::raw::empty() {\n  717 | \t\t\treturn Err(Error::unknown(format!(\n  718 | \t\t\t\t\"Failed to empty the clipboard. Got error code: {e}\"\n  719 | \t\t\t)));\n  720 | \t\t};\n  721 | \n  722 | \t\t// XXX: The ordering of these functions is important, as some programs will grab the\n  723 | \t\t// first format available. PNGs tend to have better compatibility on Windows, so it is set first.\n  724 | \t\timage_data::add_png_file(&image)?;\n  725 | \t\timage_data::add_cf_dibv5(open_clipboard, image)?;\n  726 | \t\tOk(())\n  727 | \t}","lines":16,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L712-L727"},{"ref":"src/platform/windows.rs:53-56","code":"   53 | \tpub(super) fn add_cf_dibv5(\n   54 | \t\t_open_clipboard: OpenClipboard,\n   55 | \t\timage: ImageData,\n   56 | \t) -> Result<(), Error> {","lines":4,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L53-L56"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`paths_from_uri_list` strips the literal prefix `file://` and treats whatever follows as the\npath. For the common `file:///tmp/x` form that leaves `/tmp/x`, which is correct, but RFC 8089\nalso permits an authority component: `file://localhost/tmp/x` and `file://HOST/share/x` are\nvalid `text/uri-list` entries. Those become the *relative* paths `localhost/tmp/x` and\n`HOST/share/x`.\n\nThe caller gets `Ok(vec![...])` with a path that resolves against the process's current\nworking directory, so an application that copies files from a source emitting an explicit\nauthority will silently read, move, or delete the wrong file (or fail with a confusing\n\"no such file\" for a path it never asked about). Entries that are not `file:` URIs at all\n(e.g. `http://`) are silently dropped by the same `filter_map` rather than reported.\n","fix":"Strip the authority explicitly and reject non-local hosts:\n\n```rust\nfn paths_from_uri_list(uri_list: Vec<u8>) -> Vec<PathBuf> {\n    uri_list\n        .split(|c| *c == b'\\n')\n        .map(|line| line.strip_suffix(b\"\\r\").unwrap_or(line))\n        .filter_map(|line| line.strip_prefix(b\"file://\"))\n        .filter_map(|rest| {\n            // `rest` is `<authority><path>`; the authority must be empty or `localhost`.\n            if rest.starts_with(b\"/\") {\n                Some(rest)\n            } else {\n                rest.strip_prefix(b\"localhost\")\n            }\n        })\n        .filter_map(|s| percent_decode(s).decode_utf8().ok())\n        .map(|decoded| PathBuf::from(decoded.as_ref()))\n        .collect()\n}\n```\n\nExtend `test_decoding_uri_list` with `file://localhost/tmp/bar.log` (should yield\n`/tmp/bar.log`) and `file://otherhost/tmp/bar.log` (should be dropped).","locations":[{"ref":"src/platform/linux/mod.rs:51-59","code":"   51 | fn paths_from_uri_list(uri_list: Vec<u8>) -> Vec<PathBuf> {\n   52 | \turi_list\n   53 | \t\t.split(|char| *char == b'\\n')\n   54 | \t\t.map(|line| line.strip_suffix(b\"\\r\").unwrap_or(line))\n   55 | \t\t.filter_map(|line| line.strip_prefix(b\"file://\"))\n   56 | \t\t.filter_map(|s| percent_decode(s).decode_utf8().ok())\n   57 | \t\t.map(|decoded| PathBuf::from(decoded.as_ref()))\n   58 | \t\t.collect()\n   59 | }","lines":9,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/mod.rs#L51-L59"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`handle_read_property_notify` resets the read deadline to `Instant::now() + SHORT_TIMEOUT_DUR`\n(10 ms) after every successful `INCR` chunk. Because the initial deadline is\n`LONG_TIMEOUT_DUR` (4000 ms), the first chunk *shrinks* the remaining budget from ~4 s to\n10 ms. If the selection owner needs more than 10 ms to produce the next chunk - which is\nexactly the situation `INCR` exists for, and which the comment at\n`LONG_TIMEOUT_DUR` explicitly acknowledges (\"Some clipboard items, like images, may take a\nvery long time... Multiple seconds long\") - `read_single` falls out of the loop and returns\n`Error::ContentNotAvailable`, i.e. a large paste from a slow app looks like an empty\nclipboard.\n\nThe sibling code path is inconsistent in a way that shows the intent was lost: on\n`ReadSelNotifyResult::IncrStarted` the comment says \"Let's reset our timeout\" but the code\ndoes `timeout_end += SHORT_TIMEOUT_DUR`, *extending* the 4 s deadline by 10 ms rather than\nresetting it. One site adds, the other assigns, and neither matches its comment.\n","fix":"Use a per-chunk idle timeout that is actually generous, and make both sites agree. E.g.\nintroduce `const INCR_CHUNK_TIMEOUT_DUR: Duration = Duration::from_millis(1000);` and use it\nin both places:\n\n```rust\n// in handle_read_property_notify, after `incr_data.extend(reply.value);`\n*timeout_end = Instant::now() + INCR_CHUNK_TIMEOUT_DUR;\n```\n\n```rust\n// in read_single, on IncrStarted\nReadSelNotifyResult::IncrStarted => {\n    // The transfer has begun; from here on each chunk refreshes the deadline.\n    timeout_end = Instant::now() + INCR_CHUNK_TIMEOUT_DUR;\n}\n```\n\nFix the `IncrStarted` comment to match whichever semantics are chosen.","locations":[{"ref":"src/platform/linux/x11.rs:583-589","code":"  583 | \t\tincr_data.extend(reply.value);\n  584 | \n  585 | \t\t// Let's reset our timeout, since we received a valid chunk.\n  586 | \t\t*timeout_end = Instant::now() + SHORT_TIMEOUT_DUR;\n  587 | \n  588 | \t\t// Not yet complete\n  589 | \t\tOk(false)","lines":7,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L583-L589"},{"ref":"src/platform/linux/x11.rs:386-391","code":"  386 | \t\t\t\t\t\tReadSelNotifyResult::IncrStarted => {\n  387 | \t\t\t\t\t\t\t// This means we received an indication that an the\n  388 | \t\t\t\t\t\t\t// data is going to be sent INCRementally. Let's\n  389 | \t\t\t\t\t\t\t// reset our timeout.\n  390 | \t\t\t\t\t\t\ttimeout_end += SHORT_TIMEOUT_DUR;\n  391 | \t\t\t\t\t\t}","lines":6,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L386-L391"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Drop for Clipboard` only performs teardown when `Arc::strong_count(&self.inner)` is\n*exactly* `MIN_OWNERS` (3: the global, the server thread, and `self`). If the\n`serve_requests` thread has already exited - it returns `Ok(())` on `DestroyNotify`, and\nreturns `Err` on any `wait_for_event` failure such as the X connection dropping - it has\ndropped its `Arc`, so the count is 2 and the equality test fails.\n\nConsequences when the server thread dies early: the last `Clipboard` drop does not take the\nglobal, does not destroy the X window, and never joins the thread. `CLIPBOARD` keeps holding\na `GlobalClipboard` whose `Inner` has `serve_stopped == true`, so every subsequent\n`Clipboard::new()` in the process hands out that same dead instance and every `write()`\nreturns `Error::unknown(\"The clipboard handler thread seems to have stopped...\")` forever.\nThere is no recovery path short of restarting the process.\n","fix":"Treat \"at most the minimum\" as the trigger, so a dead server thread still lets the last\nhandle clean up:\n\n```rust\nif Arc::strong_count(&self.inner) <= MIN_OWNERS {\n```\n\nAdditionally, consider clearing the global when `serve_stopped` is observed so a later\n`Clipboard::new()` can rebuild a working instance instead of returning the poisoned one.","locations":[{"ref":"src/platform/linux/x11.rs:1082-1092","code":" 1082 | impl Drop for Clipboard {\n 1083 | \tfn drop(&mut self) {\n 1084 | \t\t// There are always at least 3 owners:\n 1085 | \t\t// the global, the server thread, and one `Clipboard::inner`\n 1086 | \t\tconst MIN_OWNERS: usize = 3;\n 1087 | \n 1088 | \t\t// We start with locking the global guard to prevent race\n 1089 | \t\t// conditions below.\n 1090 | \t\tlet mut global_cb = CLIPBOARD.lock();\n 1091 | \t\tif Arc::strong_count(&self.inner) == MIN_OWNERS {\n 1092 | \t\t\t// If the are the only owners of the clipboard are ourselves and","lines":11,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L1082-L1092"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `add_cf_dibv5`, the fallback path writes the converted pixels to `data_ptr` (the start of\nthe global allocation, which holds the `BITMAPV5HEADER`) instead of `pixels_dst`\n(`data_ptr.add(header_size)`). When `rgba_to_win` returns `Cow::Owned`, the 124-byte\n`BITMAPV5HEADER` is overwritten with pixel data and the last 124 bytes of the pixel buffer\nare left holding stale un-converted RGBA - the clipboard receives a `CF_DIBV5` payload with\na garbage header.\n\nThe `SAFETY` comment directly above the call reinforces the mistake by asserting `data_ptr`\nis the right destination.\n\nReachability: `rgba_to_win` only returns `Cow::Owned` when `convert_bytes_to_u32s` cannot\nreinterpret the buffer as `&mut [u32]`, i.e. when `pixels_dst` is not 4-byte aligned or the\nlength is not a multiple of 4. `GlobalAlloc` returns 8-byte-aligned memory and\n`size_of::<BITMAPV5HEADER>() == 124` is a multiple of 4, and `add_png_file` has already\nrejected any buffer whose length is not `width * height * 4`, so today the `Owned` branch is\ndead. It is a latent trap: any change to the header struct size, or to the ordering of\n`add_png_file`/`add_cf_dibv5`, makes it live and silently corrupts clipboard images.\n","fix":"Write to the pixel region, not the base pointer:\n\n```rust\n// SAFETY: `pixels_dst` is valid to write to and has no outstanding mutable borrows, and\n// `new_pixels` will be the same length as the original bytes.\ncopy_nonoverlapping::<u8>(new_pixels.as_ptr(), pixels_dst, new_pixels.len())\n```\n\n(Only the destination argument changes: `data_ptr` -> `pixels_dst`.)","locations":[{"ref":"src/platform/windows.rs:110-121","code":"  110 | \t\t\tlet pixels_dst = data_ptr.add(header_size);\n  111 | \t\t\tcopy_nonoverlapping::<u8>(image.bytes.as_ptr(), pixels_dst, image.bytes.len());\n  112 | \n  113 | \t\t\tlet dst_pixels_slice = std::slice::from_raw_parts_mut(pixels_dst, image.bytes.len());\n  114 | \n  115 | \t\t\t// If the non-allocating version of the function failed, we need to assign the new bytes to\n  116 | \t\t\t// the global allocation.\n  117 | \t\t\tif let Cow::Owned(new_pixels) = rgba_to_win(dst_pixels_slice) {\n  118 | \t\t\t\t// SAFETY: `data_ptr` is valid to write to and has no outstanding mutable borrows, and\n  119 | \t\t\t\t// `new_pixels` will be the same length as the original bytes.\n  120 | \t\t\t\tcopy_nonoverlapping::<u8>(new_pixels.as_ptr(), data_ptr, new_pixels.len())\n  121 | \t\t\t}","lines":12,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L110-L121"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `INCR` size hint is never used. `handle_read_selection_notify` guards the `reserve` with\n`if reply.value_len == 4`, but `value_len` in a `GetProperty` reply counts items in `format`\nunits, not bytes - an `INCR` property is a single 32-bit value, so `reply.value_len == 1`\n(with `reply.value.len() == 4`). The condition is therefore always false and\n`incr_data.reserve(min_data_len)` never runs, so every large incremental transfer regrows the\n`Vec` from zero instead of pre-allocating the size the owner just told us.\n","fix":"Compare against the item count:\n\n```rust\nif reply.value_len == 1 {\n    let min_data_len = reply.value32().and_then(|mut vals| vals.next()).unwrap_or(0);\n    incr_data.reserve(min_data_len as usize);\n}\n```","locations":[{"ref":"src/platform/linux/x11.rs:540-546","code":"  540 | \t\t\tlog::trace!(\"Receiving INCR segments\");\n  541 | \t\t\t*using_incr = true;\n  542 | \t\t\tif reply.value_len == 4 {\n  543 | \t\t\t\tlet min_data_len = reply.value32().and_then(|mut vals| vals.next()).unwrap_or(0);\n  544 | \t\t\t\tincr_data.reserve(min_data_len as usize);\n  545 | \t\t\t}\n  546 | \t\t\tOk(ReadSelNotifyResult::IncrStarted)","lines":7,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L540-L546"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Clipboard::open` performs 6 attempts, not the 5 that `DEFAULT_OPEN_ATTEMPTS` names. The loop\nbody only checks `attempts == 0` *after* a failure, so the sequence is: 5 failures each\ndecrementing the counter (5->0), then a 6th `clipboard_win::Clipboard::new()` call whose\nfailure finally hits the `0 => break Err(err)` arm. It also sleeps 5 ms after the fifth\nfailure even though a sixth attempt is about to be made immediately - harmless, but the\nconstant does not describe the behaviour, which matters here because the value is tuned\nagainst Chromium's and Firefox's retry counts.\n","fix":"Decrement before the zero check so `DEFAULT_OPEN_ATTEMPTS` is the real attempt count:\n\n```rust\nlet mut attempts = Self::DEFAULT_OPEN_ATTEMPTS;\nlet clipboard = loop {\n    match clipboard_win::Clipboard::new() {\n        Ok(this) => break Ok(this),\n        Err(err) => {\n            attempts -= 1;\n            if attempts == 0 {\n                break Err(err);\n            }\n        }\n    }\n\n    // The default value matches Chromium's implementation, but could be tweaked later.\n    thread::sleep(Duration::from_millis(5));\n}\n```","locations":[{"ref":"src/platform/windows.rs:533-561","code":"  533 | \tconst DEFAULT_OPEN_ATTEMPTS: usize = 5;\n  534 | \n  535 | \tpub(crate) fn new() -> Result<Self, Error> {\n  536 | \t\tOk(Self(()))\n  537 | \t}\n  538 | \n  539 | \tfn open(&mut self) -> Result<OpenClipboard<'_>, Error> {\n  540 | \t\t// Attempt to open the clipboard multiple times. On Windows, its common for something else to temporarily\n  541 | \t\t// be using it during attempts.\n  542 | \t\t//\n  543 | \t\t// For past work/evidence, see Firefox(https://searchfox.org/mozilla-central/source/widget/windows/nsClipboard.cpp#421) and\n  544 | \t\t// Chromium(https://source.chromium.org/chromium/chromium/src/+/main:ui/base/clipboard/clipboard_win.cc;l=86).\n  545 | \t\t//\n  546 | \t\t// Note: This does not use `Clipboard::new_attempts` because its implementation sleeps for `0ms`, which can\n  547 | \t\t// cause race conditions between closing/opening the clipboard in single-threaded apps.\n  548 | \t\tlet mut attempts = Self::DEFAULT_OPEN_ATTEMPTS;\n  549 | \t\tlet clipboard = loop {\n  550 | \t\t\tmatch clipboard_win::Clipboard::new() {\n  551 | \t\t\t\tOk(this) => break Ok(this),\n  552 | \t\t\t\tErr(err) => match attempts {\n  553 | \t\t\t\t\t0 => break Err(err),\n  554 | \t\t\t\t\t_ => attempts -= 1,\n  555 | \t\t\t\t},\n  556 | \t\t\t}\n  557 | \n  558 | \t\t\t// The default value matches Chromium's implementation, but could be tweaked later.\n  559 | \t\t\tthread::sleep(Duration::from_millis(5));\n  560 | \t\t}\n  561 | \t\t.map_err(|_| Error::ClipboardOccupied)?;","lines":29,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L533-L561"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`set().file_list(paths)` silently drops any path it cannot resolve, on all three platforms,\nand reports success. Each backend resolves paths inside a `filter_map` and discards the error:\n`paths_to_uri_list` uses `path.as_ref().canonicalize().ok()` (Linux),\n`to_final_path_wide` returns `None` when `OpenOptions::open` fails (Windows), and the macOS\nbackend uses `canonicalize().ok().and_then(...)`.\n\nSo `set().file_list(&[\"/exists\", \"/deleted\", \"/no-permission\"])` puts *one* file on the\nclipboard and returns `Ok(())`. The user pastes and gets a partial selection with no\ndiagnostic. The only error surfaces when *every* path fails, and even then it is the generic\n`Error::ConversionFailure`, which does not say which path or why. Note that resolution here\nrequires the file to exist and be openable, so a perfectly well-formed path to a\njust-unlinked or permission-restricted file is dropped rather than reported.\n","fix":"Fail the whole operation rather than silently truncating the selection. On Linux:\n\n```rust\nfile_list\n    .iter()\n    .map(|path| {\n        let path = path.as_ref().canonicalize().map_err(|_| Error::ConversionFailure)?;\n        Ok(format!(\"file://{}\", percent_encode(path.as_os_str().as_bytes(), ASCII_SET)))\n    })\n    .collect::<Result<Vec<_>, Error>>()?\n    .join(\"\\r\\n\")\n```\n\nwith the empty-input case still mapped to `Error::ConversionFailure`. Apply the same\n`map`/`collect::<Result<_, _>>` shape in `windows::Set::file_list` and `osx::Set::file_list`.\nIf partial success is genuinely wanted, it must be an explicit opt-in, not the default.","locations":[{"ref":"src/platform/linux/mod.rs:81-93","code":"   81 | \tfile_list\n   82 | \t\t.iter()\n   83 | \t\t.filter_map(|path| {\n   84 | \t\t\tpath.as_ref().canonicalize().ok().map(|path| {\n   85 | \t\t\t\tformat!(\"file://{}\", percent_encode(path.as_os_str().as_bytes(), ASCII_SET))\n   86 | \t\t\t})\n   87 | \t\t})\n   88 | \t\t// Use CRLF (\"\\r\\n\") per RFC 2045 section 2.10:\n   89 | \t\t// https://www.rfc-editor.org/rfc/rfc2045#section-2.10\n   90 | \t\t// Ensures compliance and future-proofing.\n   91 | \t\t.reduce(|uri_list, uri| uri_list + \"\\r\\n\" + &uri)\n   92 | \t\t.ok_or(Error::ConversionFailure)\n   93 | }","lines":13,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/mod.rs#L81-L93"},{"ref":"src/platform/windows.rs:747-760","code":"  747 | \t\tlet paths: Vec<_> = file_list\n  748 | \t\t\t.iter()\n  749 | \t\t\t.filter_map(|path| {\n  750 | \t\t\t\tto_final_path_wide(path.as_ref()).map(|wide| {\n  751 | \t\t\t\t\t// Windows uses wchar_t which is 16 bit\n  752 | \t\t\t\t\tdata_len += wide.len() * std::mem::size_of::<u16>();\n  753 | \t\t\t\t\twide\n  754 | \t\t\t\t})\n  755 | \t\t\t})\n  756 | \t\t\t.collect();\n  757 | \n  758 | \t\tif paths.is_empty() {\n  759 | \t\t\treturn Err(Error::ConversionFailure);\n  760 | \t\t}","lines":14,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L747-L760"},{"ref":"src/platform/osx.rs:366-380","code":"  366 | \t\tlet uri_list = file_list\n  367 | \t\t\t.iter()\n  368 | \t\t\t.filter_map(|path| {\n  369 | \t\t\t\tpath.as_ref().canonicalize().ok().and_then(|abs_path| {\n  370 | \t\t\t\t\tabs_path.to_str().map(|str| {\n  371 | \t\t\t\t\t\tlet url = unsafe { NSURL::fileURLWithPath(&NSString::from_str(str)) };\n  372 | \t\t\t\t\t\tProtocolObject::from_retained(url)\n  373 | \t\t\t\t\t})\n  374 | \t\t\t\t})\n  375 | \t\t\t})\n  376 | \t\t\t.collect::<Vec<_>>();\n  377 | \n  378 | \t\tif uri_list.is_empty() {\n  379 | \t\t\treturn Err(Error::ConversionFailure);\n  380 | \t\t}","lines":15,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/osx.rs#L366-L380"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"Windows `Get::html` maps every failure to `Error::unknown(\"failed to read clipboard string\")`.\nThe overwhelmingly common failure - the clipboard simply has no `HTML Format` data on it -\nshould be `Error::ContentNotAvailable`, which is what the documented contract for\n`Get::html` implies and what the X11 and Wayland backends return in that case\n(`Inner::read` -> `Error::ContentNotAvailable`, `handle_clipboard_read` ->\n`Error::ContentNotAvailable`).\n\nUnlike `Get::text` and `Get::image` in the same file, `Get::html` also never checks\n`clipboard_win::is_format_avail` first, so it cannot distinguish \"not present\" from a real\nread error. Cross-platform code that matches on `Error::ContentNotAvailable` (as\n`src/lib.rs` tests do) therefore breaks on Windows, and the error text is misleading -\nit says \"string\" while reading HTML.\n","fix":"Check availability first and use the right variant:\n\n```rust\npub(crate) fn html(self) -> Result<String, Error> {\n    let _clipboard_assertion = self.clipboard?;\n\n    let format = clipboard_win::register_format(\"HTML Format\")\n        .ok_or_else(|| Error::unknown(\"unable to register HTML format\"))?;\n\n    if !clipboard_win::is_format_avail(format.get()) {\n        return Err(Error::ContentNotAvailable);\n    }\n\n    let mut out: Vec<u8> = Vec::new();\n    clipboard_win::raw::get_html(format.get(), &mut out)\n        .map_err(|_| Error::unknown(\"failed to read clipboard HTML\"))?;\n\n    String::from_utf8(out).map_err(|_| Error::ConversionFailure)\n}\n```","locations":[{"ref":"src/platform/windows.rs:611-622","code":"  611 | \tpub(crate) fn html(self) -> Result<String, Error> {\n  612 | \t\tlet _clipboard_assertion = self.clipboard?;\n  613 | \n  614 | \t\tlet format = clipboard_win::register_format(\"HTML Format\")\n  615 | \t\t\t.ok_or_else(|| Error::unknown(\"unable to register HTML format\"))?;\n  616 | \n  617 | \t\tlet mut out: Vec<u8> = Vec::new();\n  618 | \t\tclipboard_win::raw::get_html(format.get(), &mut out)\n  619 | \t\t\t.map_err(|_| Error::unknown(\"failed to read clipboard string\"))?;\n  620 | \n  621 | \t\tString::from_utf8(out).map_err(|_| Error::ConversionFailure)\n  622 | \t}","lines":12,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L611-L622"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"In the Windows `Set::html`, the HTML payload is written only `if let Some(format) =\nclipboard_win::register_format(\"HTML Format\")`. When registration fails the `if` body is\nskipped and the function goes straight on to `add_clipboard_exclusions`, returning `Ok(())`\neven though no HTML was placed on the clipboard - only the plain-text alternative was. The\ncaller cannot tell that `set_html` did not set any HTML.\n\n`Get::html` on the same file treats the identical failure as an error\n(`Error::unknown(\"unable to register HTML format\")`), so the two directions disagree about\nwhether a failed `register_format` is fatal.\n","fix":"Propagate the failure like the getter does:\n\n```rust\nlet format = clipboard_win::register_format(\"HTML Format\")\n    .ok_or_else(|| Error::unknown(\"unable to register HTML format\"))?;\nlet html = wrap_html(&html);\nclipboard_win::raw::set_without_clear(format.get(), html.as_bytes())\n    .map_err(|e| Error::unknown(e.to_string()))?;\n```","locations":[{"ref":"src/platform/windows.rs:698-702","code":"  698 | \t\tif let Some(format) = clipboard_win::register_format(\"HTML Format\") {\n  699 | \t\t\tlet html = wrap_html(&html);\n  700 | \t\t\tclipboard_win::raw::set_without_clear(format.get(), html.as_bytes())\n  701 | \t\t\t\t.map_err(|e| Error::unknown(e.to_string()))?;\n  702 | \t\t}","lines":5,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L698-L702"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`osx::Set::html` reports a failure of `setString_forType` with the message\n`\"NSPasteboard#writeObjects: returned false\"`, but `writeObjects` is never called in that\nfunction - the failing calls are `setString_forType(&html_nss, NSPasteboardTypeHTML)` and\n`setString_forType(&alt_nss, NSPasteboardTypeString)`. Anyone debugging from the error string\nwill look at the wrong API, and the message does not distinguish which of the two\n`setString_forType` calls failed.\n","fix":"Name the call that actually failed, and distinguish the two sites:\n\n```rust\nlet mut success =\n    unsafe { self.clipboard.pasteboard.setString_forType(&html_nss, NSPasteboardTypeHTML) };\nif !success {\n    return Err(Error::unknown(\n        \"NSPasteboard#setString:forType: returned false for NSPasteboardTypeHTML\",\n    ));\n}\nif let Some(alt_text) = alt {\n    let alt_nss = NSString::from_str(&alt_text);\n    success = unsafe {\n        self.clipboard.pasteboard.setString_forType(&alt_nss, NSPasteboardTypeString)\n    };\n}\n\nadd_clipboard_exclusions(self.clipboard, self.exclude_from_history);\n\nif success {\n    Ok(())\n} else {\n    Err(Error::unknown(\n        \"NSPasteboard#setString:forType: returned false for NSPasteboardTypeString\",\n    ))\n}\n```","locations":[{"ref":"src/platform/osx.rs:320-339","code":"  320 | \t\t// Make sure that we pass a pointer to the string and not the object itself.\n  321 | \t\tlet mut success =\n  322 | \t\t\tunsafe { self.clipboard.pasteboard.setString_forType(&html_nss, NSPasteboardTypeHTML) };\n  323 | \t\tif success {\n  324 | \t\t\tif let Some(alt_text) = alt {\n  325 | \t\t\t\tlet alt_nss = NSString::from_str(&alt_text);\n  326 | \t\t\t\t// Similar to the primary string, we only want a pointer here too.\n  327 | \t\t\t\tsuccess = unsafe {\n  328 | \t\t\t\t\tself.clipboard.pasteboard.setString_forType(&alt_nss, NSPasteboardTypeString)\n  329 | \t\t\t\t};\n  330 | \t\t\t}\n  331 | \t\t}\n  332 | \n  333 | \t\tadd_clipboard_exclusions(self.clipboard, self.exclude_from_history);\n  334 | \n  335 | \t\tif success {\n  336 | \t\t\tOk(())\n  337 | \t\t} else {\n  338 | \t\t\tErr(Error::unknown(\"NSPasteboard#writeObjects: returned false\"))\n  339 | \t\t}","lines":20,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/osx.rs#L320-L339"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`osx::add_clipboard_exclusions` discards the `BOOL` returned by `setString_forType`, so a\nfailure to write `org.nspasteboard.ConcealedType` is invisible. The function returns `()`,\nso `Set::text`, `Set::html`, `Set::image` and `Set::file_list` all report `Ok(())` even when\nthe concealment marker was not applied - the same class of silent privacy failure as the\nWindows image path, just for macOS.\n\nSecondarily, it is called unconditionally *before* the `success` check in all four setters,\nso the concealment type is written even on the failure path where nothing was placed on the\nclipboard.\n","fix":"Return a `Result` and propagate it:\n\n```rust\nfn add_clipboard_exclusions(\n    clipboard: &mut Clipboard,\n    exclude_from_history: bool,\n) -> Result<(), Error> {\n    if !exclude_from_history {\n        return Ok(());\n    }\n    // See http://nspasteboard.org/ for details about the community standard.\n    let ok = unsafe {\n        clipboard\n            .pasteboard\n            .setString_forType(ns_string!(\"\"), ns_string!(\"org.nspasteboard.ConcealedType\"))\n    };\n    if ok {\n        Ok(())\n    } else {\n        Err(Error::unknown(\"failed to set org.nspasteboard.ConcealedType\"))\n    }\n}\n```\n\nand in each setter check `success` first, then `add_clipboard_exclusions(...)?`.","locations":[{"ref":"src/platform/osx.rs:410-422","code":"  410 | fn add_clipboard_exclusions(clipboard: &mut Clipboard, exclude_from_history: bool) {\n  411 | \t// On Mac there isn't an official standard for excluding data from clipboard, however\n  412 | \t// there is an unofficial standard which is to set `org.nspasteboard.ConcealedType`.\n  413 | \t//\n  414 | \t// See http://nspasteboard.org/ for details about the community standard.\n  415 | \tif exclude_from_history {\n  416 | \t\tunsafe {\n  417 | \t\t\tclipboard\n  418 | \t\t\t\t.pasteboard\n  419 | \t\t\t\t.setString_forType(ns_string!(\"\"), ns_string!(\"org.nspasteboard.ConcealedType\"));\n  420 | \t\t}\n  421 | \t}\n  422 | }","lines":13,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/osx.rs#L410-L422"},{"ref":"src/platform/osx.rs:291-306","code":"  291 | \tpub(crate) fn text(self, data: Cow<'_, str>) -> Result<(), Error> {\n  292 | \t\tself.clipboard.clear();\n  293 | \n  294 | \t\tlet string_array = NSArray::from_retained_slice(&[ProtocolObject::from_retained(\n  295 | \t\t\tNSString::from_str(&data),\n  296 | \t\t)]);\n  297 | \t\tlet success = unsafe { self.clipboard.pasteboard.writeObjects(&string_array) };\n  298 | \n  299 | \t\tadd_clipboard_exclusions(self.clipboard, self.exclude_from_history);\n  300 | \n  301 | \t\tif success {\n  302 | \t\t\tOk(())\n  303 | \t\t} else {\n  304 | \t\t\tErr(Error::unknown(\"NSPasteboard#writeObjects: returned false\"))\n  305 | \t\t}\n  306 | \t}","lines":16,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/osx.rs#L291-L306"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"Both image writers free their global memory object with the wrong API. `hdata` comes from\n`GlobalAlloc(GHND, bytes)`, so on the `SetClipboardData` failure path it must be released with\n`GlobalFree`. Instead both call `DeleteObject(hdata as HGDIOBJ)`, which is the destructor for\n*GDI* objects (bitmaps, brushes, pens). Given a non-GDI handle it returns `FALSE` and does\nnothing, so the allocation is leaked for the lifetime of the process every time\n`SetClipboardData` fails.\n\n`Set::file_list` in the same file gets this right (`GlobalFree(h_global)`), which makes the\ntwo image paths a clear inconsistency rather than a deliberate choice.\n","fix":"Use `GlobalFree`, which is already imported in this file:\n\n```rust\nif unsafe { SetClipboardData(CF_DIBV5 as u32, hdata as HANDLE) }.failure() {\n    unsafe { GlobalFree(hdata) };\n    Err(last_error(\"SetClipboardData failed with error\"))\n} else {\n    Ok(())\n}\n```\n\nand identically in `add_png_file` with `CF_DIBV5` replaced by `format_id`. The\n`DeleteObject` / `HGDIOBJ` imports can then be dropped from the `image_data` module's\n`use windows_sys::...::Graphics::Gdi::{...}` list.","locations":[{"ref":"src/platform/windows.rs:124-129","code":"  124 | \t\tif unsafe { SetClipboardData(CF_DIBV5 as u32, hdata as HANDLE) }.failure() {\n  125 | \t\t\tunsafe { DeleteObject(hdata as HGDIOBJ) };\n  126 | \t\t\tErr(last_error(\"SetClipboardData failed with error\"))\n  127 | \t\t} else {\n  128 | \t\t\tOk(())\n  129 | \t\t}","lines":6,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L124-L129"},{"ref":"src/platform/windows.rs:161-166","code":"  161 | \t\tif unsafe { SetClipboardData(format_id, hdata as HANDLE) }.failure() {\n  162 | \t\t\tunsafe { DeleteObject(hdata as HGDIOBJ) };\n  163 | \t\t\tErr(last_error(\"SetClipboardData failed with error\"))\n  164 | \t\t} else {\n  165 | \t\t\tOk(())\n  166 | \t\t}","lines":6,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L161-L166"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`atom_name_dbg` caches atom names by `Box::leak`-ing each one into a `&'static str` and\nstoring it in a thread-local `HashMap` that is never pruned. Atom names are attacker-\ninfluenced: the map is keyed by `event.property` / `event.target` / `event.selection` taken\nstraight off the wire in `serve_requests` and `handle_selection_request`, and any X client can\n`InternAtom` an unbounded number of distinct names and then spam `SelectionRequest`s with\nthem. Each new atom permanently leaks one `String`.\n\nThe exposure is limited because the calls sit inside `trace!(...)` arguments, and `log`'s\nmacros only evaluate their arguments when the level is enabled - so this only bites processes\nrunning with trace logging on. Still, \"long-running process with trace logging\" is exactly\nthe configuration where an unbounded leak matters.\n","fix":"Cache owned `String`s instead of leaking, and return them by clone, or cap the cache:\n\n```rust\nthread_local! {\n    static ATOM_NAME_CACHE: RefCell<HashMap<Atom, Box<str>>> = Default::default();\n}\n\nfn atom_name_dbg(&self, atom: Atom) -> String {\n    ATOM_NAME_CACHE.with(|cache| {\n        let mut cache = cache.borrow_mut();\n        if cache.len() > 256 {\n            cache.clear();\n        }\n        cache\n            .entry(atom)\n            .or_insert_with(|| {\n                self.atom_name(atom)\n                    .unwrap_or_else(|_| \"FAILED-TO-GET-THE-ATOM-NAME\".to_owned())\n                    .into_boxed_str()\n            })\n            .to_string()\n    })\n}\n```","locations":[{"ref":"src/platform/linux/x11.rs:95-97","code":"   95 | thread_local! {\n   96 | \tstatic ATOM_NAME_CACHE: RefCell<HashMap<Atom, &'static str>> = Default::default();\n   97 | }","lines":3,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L95-L97"},{"ref":"src/platform/linux/x11.rs:468-483","code":"  468 | \tfn atom_name_dbg(&self, atom: x11rb::protocol::xproto::Atom) -> &'static str {\n  469 | \t\tATOM_NAME_CACHE.with(|cache| {\n  470 | \t\t\tlet mut cache = cache.borrow_mut();\n  471 | \t\t\tmatch cache.entry(atom) {\n  472 | \t\t\t\tEntry::Occupied(entry) => *entry.get(),\n  473 | \t\t\t\tEntry::Vacant(entry) => {\n  474 | \t\t\t\t\tlet s = self\n  475 | \t\t\t\t\t\t.atom_name(atom)\n  476 | \t\t\t\t\t\t.map(|s| Box::leak(s.into_boxed_str()) as &str)\n  477 | \t\t\t\t\t\t.unwrap_or(\"FAILED-TO-GET-THE-ATOM-NAME\");\n  478 | \t\t\t\t\tentry.insert(s);\n  479 | \t\t\t\t\ts\n  480 | \t\t\t\t}\n  481 | \t\t\t}\n  482 | \t\t})\n  483 | \t}","lines":16,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L468-L483"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"Three `GlobalAlloc` sites leak the handle if `GlobalLock` fails: `global_lock(hdata)?`\npropagates with `?` while `hdata` is still owned by nobody, so nothing calls `GlobalFree`.\n`GlobalLock` on a valid `GHND` handle essentially cannot fail in practice, so this is a\nrobustness gap rather than an observable leak - but it is the same pattern in three places and\nthe `hdata` is a genuinely unowned raw handle at that point.\n","fix":"Give the raw handle an owner as soon as it exists, e.g. a small guard that is defused on\nsuccess:\n\n```rust\nunsafe fn global_alloc_guarded(bytes: usize) -> Result<(HGLOBAL, ScopeGuard<impl FnOnce()>), Error> {\n    let hdata = global_alloc(bytes)?;\n    Ok((hdata, ScopeGuard::new(move || { GlobalFree(hdata); })))\n}\n```\n\nor, minimally, free explicitly at each site:\n\n```rust\nlet data_ptr = match global_lock(hdata) {\n    Ok(ptr) => ptr,\n    Err(e) => {\n        GlobalFree(hdata);\n        return Err(e);\n    }\n};\n```","locations":[{"ref":"src/platform/windows.rs:98-101","code":"   98 | \t\tlet hdata = unsafe { global_alloc(data_size)? };\n   99 | \t\tunsafe {\n  100 | \t\t\tlet data_ptr = global_lock(hdata)?;\n  101 | \t\t\tlet _unlock = ScopeGuard::new(|| global_unlock_checked(hdata));","lines":4,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L98-L101"},{"ref":"src/platform/windows.rs:153-159","code":"  153 | \t\tlet hdata = unsafe { global_alloc(data_size)? };\n  154 | \n  155 | \t\tunsafe {\n  156 | \t\t\tlet pixels_dst = global_lock(hdata)?;\n  157 | \t\t\tcopy_nonoverlapping::<u8>(buf.as_ptr(), pixels_dst, data_size);\n  158 | \t\t\tglobal_unlock_checked(hdata);\n  159 | \t\t}","lines":7,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L153-L159"},{"ref":"src/platform/windows.rs:765-767","code":"  765 | \t\tunsafe {\n  766 | \t\t\tlet h_global = global_alloc(data_len)?;\n  767 | \t\t\tlet data_ptr = global_lock(h_global)?;","lines":3,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L765-L767"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"The macOS `set_image` path performs no validation that `ImageData::bytes` is large enough for\nthe declared dimensions. `ImageData` is a public struct with public `width`, `height` and\n`bytes` fields, so all three are caller-controlled and mutually unconstrained.\n`Set::image` hands them straight to `image_from_pixels`, which builds a `CGDataProvider` over\nexactly `bytes.len()` bytes and then calls\n`CGImageCreate(width, height, 8, 32, 4 * width, ...)`. CoreGraphics will read\n`4 * width * height` bytes from that provider when the image is rasterised or serialised into\nthe pasteboard, so `ImageData { width: 10_000, height: 10_000, bytes: small_vec }` is an\nout-of-bounds heap read of arbitrary size - reading adjacent process memory and potentially\npublishing it onto the system clipboard.\n\nBoth other backends already reject this: Linux's `encode_as_png` returns\n`Error::ConversionFailure` for empty/zero-dimension input and `PngEncoder::write_image`\nvalidates the buffer length against `width * height * 4`, and the Windows path runs\n`add_png_file` (the same `write_image` check) before touching raw pointers. macOS is the only\nbackend that goes straight to unchecked FFI, so a caller that computes dimensions incorrectly\ngets a clean `Err` on Linux and Windows and memory unsafety on macOS.\n","fix":"Validate before constructing the provider, mirroring `encode_as_png`'s guard:\n\n```rust\n#[cfg(feature = \"image-data\")]\nfn image_from_pixels(\n    pixels: Vec<u8>,\n    width: usize,\n    height: usize,\n) -> Result<Retained<objc2_app_kit::NSImage>, Error> {\n    // CoreGraphics reads `4 * width * height` bytes from the provider, so the buffer must\n    // cover exactly that; otherwise `CGImageCreate` would read out of bounds.\n    let expected = width\n        .checked_mul(height)\n        .and_then(|px| px.checked_mul(4))\n        .ok_or(Error::ConversionFailure)?;\n    if expected == 0 || pixels.len() != expected {\n        return Err(Error::ConversionFailure);\n    }\n    // ... existing body\n```\n\nConsider also documenting the `width * height * 4 == bytes.len()` invariant on\n`ImageData` in `src/common.rs`, and adding a shared checked constructor so no backend can\nskip the check.","locations":[{"ref":"src/platform/osx.rs:342-345","code":"  342 | \t#[cfg(feature = \"image-data\")]\n  343 | \tpub(crate) fn image(self, data: ImageData) -> Result<(), Error> {\n  344 | \t\tlet pixels = data.bytes.into();\n  345 | \t\tlet image = image_from_pixels(pixels, data.width, data.height)?;","lines":4,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/osx.rs#L342-L345"},{"ref":"src/platform/osx.rs:33-99","code":"   33 | fn image_from_pixels(\n   34 | \tpixels: Vec<u8>,\n   35 | \twidth: usize,\n   36 | \theight: usize,\n   37 | ) -> Result<Retained<objc2_app_kit::NSImage>, Error> {\n   38 | \tuse objc2::AllocAnyThread;\n   39 | \tuse objc2_app_kit::NSImage;\n   40 | \tuse objc2_core_foundation::CGFloat;\n   41 | \tuse objc2_core_graphics::{\n   42 | \t\tCGBitmapInfo, CGColorRenderingIntent, CGColorSpaceCreateDeviceRGB,\n   43 | \t\tCGDataProviderCreateWithData, CGImageAlphaInfo, CGImageCreate,\n   44 | \t};\n   45 | \tuse objc2_foundation::NSSize;\n   46 | \tuse std::{\n   47 | \t\tffi::c_void,\n   48 | \t\tptr::{self, NonNull},\n   49 | \t};\n   50 | \n   51 | \tunsafe extern \"C-unwind\" fn release(_info: *mut c_void, data: NonNull<c_void>, size: usize) {\n   52 | \t\tlet data = data.cast::<u8>();\n   53 | \t\tlet slice = NonNull::slice_from_raw_parts(data, size);\n   54 | \t\t// SAFETY: This is the same slice that we got from `Box::into_raw`.\n   55 | \t\tdrop(unsafe { Box::from_raw(slice.as_ptr()) })\n   56 | \t}\n   57 | \n   58 | \tlet provider = {\n   59 | \t\tlet pixels = pixels.into_boxed_slice();\n   60 | \t\tlet len = pixels.len();\n   61 | \t\tlet pixels: *mut [u8] = Box::into_raw(pixels);\n   62 | \t\t// Convert slice pointer to thin pointer.\n   63 | \t\tlet data_ptr = pixels.cast::<c_void>();\n   64 | \n   65 | \t\t// SAFETY: The data pointer and length are valid.\n   66 | \t\t// The info pointer can safely be NULL, we don't use it in the `release` callback.\n   67 | \t\tunsafe { CGDataProviderCreateWithData(ptr::null_mut(), data_ptr, len, Some(release)) }\n   68 | \t}\n   69 | \t.unwrap();\n   70 | \n   71 | \tlet colorspace = unsafe { CGColorSpaceCreateDeviceRGB() }.unwrap();\n   72 | \n   73 | \t// XXX: If this returns an error, try running your application from the command line or\n   74 | \t// use `Console.app`. For the later, make sure that before you start streaming log messages\n   75 | \t// that Action -> `Include Info Messages` and Action -> `Include Debug Messages` are both\n   76 | \t// enabled in the menubar. CoreGraphics will write debugging/error information to these places.\n   77 | \t//\n   78 | \t// - https://redsweater.com/blog/129/coregraphics-log-jam\n   79 | \t// - https://github.com/1Password/arboard/issues/204\n   80 | \tlet cg_image = unsafe {\n   81 | \t\tCGImageCreate(\n   82 | \t\t\twidth,\n   83 | \t\t\theight,\n   84 | \t\t\t8,\n   85 | \t\t\t32,\n   86 | \t\t\t4 * width,\n   87 | \t\t\tSome(&colorspace),\n   88 | \t\t\tCGBitmapInfo::ByteOrderDefault | CGBitmapInfo(CGImageAlphaInfo::Last.0),\n   89 | \t\t\tSome(&provider),\n   90 | \t\t\tptr::null_mut(),\n   91 | \t\t\tfalse,\n   92 | \t\t\tCGColorRenderingIntent::RenderingIntentDefault,\n   93 | \t\t)\n   94 | \t}\n   95 | \t.ok_or(Error::ConversionFailure)?;\n   96 | \n   97 | \tlet size = NSSize { width: width as CGFloat, height: height as CGFloat };\n   98 | \tOk(unsafe { NSImage::initWithCGImage_size(NSImage::alloc(), &cg_image, size) })\n   99 | }","lines":67,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/osx.rs#L33-L99"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`Drop for Clipboard` takes the global out of the mutex *before* it can fail, then returns\nearly on `destroy_window` or `flush` errors. At that point `global_cb` (the local, holding\nboth the `Arc<Inner>` and the `JoinHandle`) is dropped without `join()`, so the\n`serve_requests` thread is left blocked in `wait_for_event` forever, holding its X11\nconnection and its `Arc<Inner>`. The global slot is now `None`, so the next\n`Clipboard::new()` builds a *second* `Inner`, a second X window and a second server thread.\nRepeating the pattern leaks one thread, one X connection and one window each time, and the\norphaned window may still be the selection owner - so other applications keep asking a\nprocess that will never answer.\n","fix":"Don't take the global until teardown has actually succeeded, and always join. Sketch:\n\n```rust\nif let Err(e) = self.inner.ask_clipboard_manager_to_request_our_data() {\n    error!(\"Could not hand the clipboard data over to the clipboard manager: {e}\");\n}\nif let Err(e) = self.inner.server.conn.destroy_window(self.inner.server.win_id) {\n    error!(\"Failed to destroy the clipboard window. Error: {e}\");\n    // Fall through: we still have to join the server thread, otherwise it leaks.\n}\nif let Err(e) = self.inner.server.conn.flush() {\n    error!(\"Failed to flush the clipboard window. Error: {e}\");\n}\nif let Some(GlobalClipboard { inner, server_handle }) = global_cb.take() {\n    drop(inner);\n    if let Err(e) = server_handle.join() { /* existing panic-message extraction */ }\n}\n```\n\nNote the server thread also exits on connection error, so joining is still bounded even when\n`destroy_window` failed.","locations":[{"ref":"src/platform/linux/x11.rs:1094-1112","code":" 1094 | \t\t\t// and send the data to the clipboard manager\n 1095 | \n 1096 | \t\t\tif let Err(e) = self.inner.ask_clipboard_manager_to_request_our_data() {\n 1097 | \t\t\t\terror!(\"Could not hand the clipboard data over to the clipboard manager: {}\", e);\n 1098 | \t\t\t}\n 1099 | \t\t\tlet global_cb = global_cb.take();\n 1100 | \t\t\tif let Err(e) = self.inner.server.conn.destroy_window(self.inner.server.win_id) {\n 1101 | \t\t\t\terror!(\"Failed to destroy the clipboard window. Error: {}\", e);\n 1102 | \t\t\t\treturn;\n 1103 | \t\t\t}\n 1104 | \t\t\tif let Err(e) = self.inner.server.conn.flush() {\n 1105 | \t\t\t\terror!(\"Failed to flush the clipboard window. Error: {}\", e);\n 1106 | \t\t\t\treturn;\n 1107 | \t\t\t}\n 1108 | \t\t\tif let Some(global_cb) = global_cb {\n 1109 | \t\t\t\tlet GlobalClipboard { inner, server_handle } = global_cb;\n 1110 | \t\t\t\tdrop(inner);\n 1111 | \n 1112 | \t\t\t\tif let Err(e) = server_handle.join() {","lines":19,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L1094-L1112"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`Clipboard::set_html` and `Set::html` declare `html: T` and `alt_text: Option<T>` with a\nsingle type parameter `T: Into<Cow<'a, str>>`, forcing both arguments to be the *same* type.\n`ctx.set_html(\"<b>hi<\/b>\", Some(owned_string))` does not compile - the caller has to\n`.to_string()` the literal or `.as_str()` the `String` purely to satisfy the signature. The\nnatural call shape for this API (a static HTML template plus a runtime-built plain-text\nalternative) is precisely the mixed case.\n","fix":"Give the alternative text its own type parameter:\n\n```rust\npub fn set_html<'a, 'b, T: Into<Cow<'a, str>>, U: Into<Cow<'b, str>>>(\n    &mut self,\n    html: T,\n    alt_text: Option<U>,\n) -> Result<(), Error> {\n    self.set().html(html, alt_text)\n}\n```\n\nand the same on `Set::html`. This is backwards compatible for every existing call - `T` and\n`U` can still infer to the same type.","locations":[{"ref":"src/lib.rs:110-116","code":"  110 | \tpub fn set_html<'a, T: Into<Cow<'a, str>>>(\n  111 | \t\t&mut self,\n  112 | \t\thtml: T,\n  113 | \t\talt_text: Option<T>,\n  114 | \t) -> Result<(), Error> {\n  115 | \t\tself.set().html(html, alt_text)\n  116 | \t}","lines":7,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/lib.rs#L110-L116"},{"ref":"src/lib.rs:228-236","code":"  228 | \tpub fn html<'a, T: Into<Cow<'a, str>>>(\n  229 | \t\tself,\n  230 | \t\thtml: T,\n  231 | \t\talt_text: Option<T>,\n  232 | \t) -> Result<(), Error> {\n  233 | \t\tlet html = html.into();\n  234 | \t\tlet alt_text = alt_text.map(|e| e.into());\n  235 | \t\tself.platform.html(html, alt_text)\n  236 | \t}","lines":9,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/lib.rs#L228-L236"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"hard","description":"`osx::Clipboard` declares `unsafe impl Send` and `unsafe impl Sync` with no safety comment,\neven though its only field is `Retained<NSPasteboard>`, which `objc2` deliberately makes\nneither `Send` nor `Sync`. Apple does not document `NSPasteboard` as thread-safe, and AppKit\nobjects are generally main-thread-affine; the crate-level docs in `src/lib.rs` even state\nthat multiple clipboards on separate threads are valid, so this claim is load-bearing for a\ndocumented API.\n\n`src/lib.rs`'s `clipboard_trait_consistently` test asserts\n`assert_send_sync::<Clipboard>()`, so the impls cannot simply be deleted - but an\nunjustified `unsafe impl` on a type whose upstream author explicitly opted out is exactly the\nkind of soundness assumption that needs to be written down and revisited.\n","fix":"At minimum, record the justification so it can be audited and challenged:\n\n```rust\n// SAFETY: `NSPasteboard` is a process-global service object; all access here goes through\n// `objc_msgSend`, which is thread-safe, and none of the methods used\n// (`pasteboardItems`, `dataForType:`, `clearContents`, `writeObjects:`,\n// `setString:forType:`) are documented as main-thread-only. Cross-thread *ordering* is\n// still the caller's problem - see the `Clipboard` docs in `src/lib.rs`.\nunsafe impl Send for Clipboard {}\nunsafe impl Sync for Clipboard {}\n```\n\nThe more robust fix is to stop storing the `Retained<NSPasteboard>` at all and re-fetch\n`generalPasteboard` per operation (which is what the Windows backend effectively does by\nre-opening the clipboard each time), leaving `Clipboard` a trivially `Send + Sync` unit\ntype.","locations":[{"ref":"src/platform/osx.rs:101-108","code":"  101 | pub(crate) struct Clipboard {\n  102 | \tpasteboard: Retained<NSPasteboard>,\n  103 | }\n  104 | \n  105 | unsafe impl Send for Clipboard {}\n  106 | unsafe impl Sync for Clipboard {}\n  107 | impl UnwindSafe for Clipboard {}\n  108 | impl RefUnwindSafe for Clipboard {}","lines":8,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/osx.rs#L101-L108"},{"ref":"src/lib.rs:45-46","code":"   45 | /// It is also valid to have these multiple `Clipboards` on separate threads at once but note that\n   46 | /// executing multiple clipboard operations in parallel might fail with a `ClipboardOccupied` error.","lines":2,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/lib.rs#L45-L46"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"Windows `Set::html` always calls `clipboard_win::raw::set_string(&alt)`, substituting\n`String::new()` when the caller passes `alt = None`. That publishes an empty\n`CF_UNICODETEXT` on the clipboard, so a subsequent `get_text()` returns `Ok(\"\")` on Windows\nwhere X11 and macOS return `Err(Error::ContentNotAvailable)` - on those backends no text\ntarget is advertised at all when there is no alternative text.\n\nThe `all_tests` test in `src/lib.rs` papers over the difference by accepting either result,\nwhich is how the inconsistency survives. Downstream code that distinguishes \"no text on the\nclipboard\" from \"empty text on the clipboard\" behaves differently per platform.\n\nNote that `set_string` is also what clears the clipboard here, so the empty write cannot\nsimply be skipped - the clear has to be done explicitly.\n","fix":"Only publish a text target when there actually is alternative text:\n\n```rust\nlet open_clipboard = self.clipboard?;\n\nmatch alt {\n    Some(alt) => clipboard_win::raw::set_string(&alt).map_err(|_| {\n        Error::unknown(\"Could not place the specified text to the clipboard\")\n    })?,\n    // No alt text: clear the clipboard without advertising an empty text target, so\n    // `get_text()` reports `ContentNotAvailable` like the other platforms do.\n    None => clipboard_win::raw::empty()\n        .map_err(|_| Error::unknown(\"Failed to empty the clipboard\"))?,\n}\n```\n\nThen tighten the assertion in `src/lib.rs:328-332` to expect\n`Err(Error::ContentNotAvailable)` on every platform.","locations":[{"ref":"src/platform/windows.rs:688-702","code":"  688 | \tpub(crate) fn html(self, html: Cow<'_, str>, alt: Option<Cow<'_, str>>) -> Result<(), Error> {\n  689 | \t\tlet open_clipboard = self.clipboard?;\n  690 | \n  691 | \t\tlet alt = match alt {\n  692 | \t\t\tSome(s) => s.into(),\n  693 | \t\t\tNone => String::new(),\n  694 | \t\t};\n  695 | \t\tclipboard_win::raw::set_string(&alt)\n  696 | \t\t\t.map_err(|_| Error::unknown(\"Could not place the specified text to the clipboard\"))?;\n  697 | \n  698 | \t\tif let Some(format) = clipboard_win::register_format(\"HTML Format\") {\n  699 | \t\t\tlet html = wrap_html(&html);\n  700 | \t\t\tclipboard_win::raw::set_without_clear(format.get(), html.as_bytes())\n  701 | \t\t\t\t.map_err(|e| Error::unknown(e.to_string()))?;\n  702 | \t\t}","lines":15,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/windows.rs#L688-L702"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"Both `set_html` implementations compute their `Vec` capacity with\n`[true, alt.is_some(), exclude_from_history].map(|v| usize::from(v as u8)).iter().sum()`.\n`usize::from(v as u8)` converts `bool -> u8 -> usize` when `usize::from(bool)` exists and does\nit directly; the `.iter().sum()` then sums references over an array that could just be summed\nby value. The result is correct, but the expression takes a `let mut sources = { ... }` block\nand three conversions to express \"count the `true`s\", and the identical construction is\nduplicated verbatim across the X11 and Wayland backends.\n","fix":"Replace both blocks with a direct count:\n\n```rust\nlet cap = [true, alt.is_some(), exclude_from_history].into_iter().filter(|&v| v).count();\nlet mut data = Vec::with_capacity(cap);\n```\n\nBetter still, hoist a shared helper into `src/platform/linux/mod.rs` since both backends need\nexactly this:\n\n```rust\nfn capacity_for(flags: [bool; 3]) -> usize {\n    flags.into_iter().filter(|&v| v).count()\n}\n```","locations":[{"ref":"src/platform/linux/x11.rs:999-1005","code":"  999 | \t\tlet mut data = {\n 1000 | \t\t\tlet cap = [true, alt.is_some(), exclude_from_history]\n 1001 | \t\t\t\t.map(|v| usize::from(v as u8))\n 1002 | \t\t\t\t.iter()\n 1003 | \t\t\t\t.sum();\n 1004 | \t\t\tVec::with_capacity(cap)\n 1005 | \t\t};","lines":7,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L999-L1005"},{"ref":"src/platform/linux/wayland.rs:159-165","code":"  159 | \t\tlet mut sources = {\n  160 | \t\t\tlet cap = [true, alt.is_some(), exclude_from_history]\n  161 | \t\t\t\t.map(|v| usize::from(v as u8))\n  162 | \t\t\t\t.iter()\n  163 | \t\t\t\t.sum();\n  164 | \t\t\tVec::with_capacity(cap)\n  165 | \t\t};","lines":7,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/wayland.rs#L159-L165"}]},
{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`image_from_pixels` unwraps two fallible CoreGraphics constructors:\n`CGDataProviderCreateWithData(...).unwrap()` and `CGColorSpaceCreateDeviceRGB().unwrap()`.\nBoth return `Option` in `objc2-core-graphics` precisely because the underlying C functions can\nreturn `NULL`. `CGDataProviderCreateWithData` returns `NULL` for inputs it rejects, and this\ncall site passes user-controlled `size` (`ImageData::bytes.len()`, which may be `0`) - so\n`clipboard.set_image(ImageData { width: 0, height: 0, bytes: (&[]).into() })` can abort the\ncaller's process instead of returning `Error::ConversionFailure`.\n\nThe very next call in the same function, `CGImageCreate`, is handled correctly with\n`.ok_or(Error::ConversionFailure)?`, so the error type and the intended style are already\nthere - these two are just omissions. Note that a panic here can also be reached from a\n`Drop`-adjacent context in user code, and `arboard` is a library, so aborting the host\napplication is never the right answer.\n","fix":"Map both to `Error::ConversionFailure` like the neighbouring `CGImageCreate` call:\n\n```rust\nlet provider = {\n    let pixels = pixels.into_boxed_slice();\n    let len = pixels.len();\n    let pixels: *mut [u8] = Box::into_raw(pixels);\n    let data_ptr = pixels.cast::<c_void>();\n    unsafe { CGDataProviderCreateWithData(ptr::null_mut(), data_ptr, len, Some(release)) }\n}\n.ok_or(Error::ConversionFailure)?;\n\nlet colorspace =\n    unsafe { CGColorSpaceCreateDeviceRGB() }.ok_or(Error::ConversionFailure)?;\n```\n\nNote that on the `provider` failure path the `Box::into_raw` allocation is also leaked,\nbecause `release` is only invoked by a successfully created provider - reclaim it with\n`drop(Box::from_raw(pixels))` before returning the error.","locations":[{"ref":"src/platform/osx.rs:58-71","code":"   58 | \tlet provider = {\n   59 | \t\tlet pixels = pixels.into_boxed_slice();\n   60 | \t\tlet len = pixels.len();\n   61 | \t\tlet pixels: *mut [u8] = Box::into_raw(pixels);\n   62 | \t\t// Convert slice pointer to thin pointer.\n   63 | \t\tlet data_ptr = pixels.cast::<c_void>();\n   64 | \n   65 | \t\t// SAFETY: The data pointer and length are valid.\n   66 | \t\t// The info pointer can safely be NULL, we don't use it in the `release` callback.\n   67 | \t\tunsafe { CGDataProviderCreateWithData(ptr::null_mut(), data_ptr, len, Some(release)) }\n   68 | \t}\n   69 | \t.unwrap();\n   70 | \n   71 | \tlet colorspace = unsafe { CGColorSpaceCreateDeviceRGB() }.unwrap();","lines":14,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/osx.rs#L58-L71"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`ask_clipboard_manager_to_request_our_data` ends in\n`unreachable!(\"This is a bug! ...\")`. The reasoning is sound today (`parking_lot`'s `Condvar`\ndoes not wake spuriously, and the only `handover_cv.notify_all()` caller sets\n`ManagerHandoverState::Finished` first), but this function is called from\n`Drop for Clipboard`. A panic inside a `Drop` that runs during unwinding aborts the process\nimmediately, turning any future violation of that invariant - e.g. someone adding a second\n`notify_all` site - into a hard crash of the host application rather than a recoverable\nerror.\n","fix":"Degrade instead of panicking, since the caller already tolerates a best-effort result:\n\n```rust\nlet result = self.handover_cv.wait_for(&mut handover_state, max_handover_duration);\n\nif *handover_state == ManagerHandoverState::Finished {\n    return Ok(());\n}\nif result.timed_out() {\n    warn!(\"Could not hand the clipboard contents over to the clipboard manager. The request timed out.\");\n    return Ok(());\n}\n\n// Should be unreachable: `parking_lot`'s condvar does not wake spuriously and the only\n// notifier sets `Finished` first. Don't panic - this runs from `Drop`.\nwarn!(\"Clipboard manager handover woke without finishing and without timing out; treating as failed.\");\nOk(())\n```","locations":[{"ref":"src/platform/linux/x11.rs:785-796","code":"  785 | \t\tlet result = self.handover_cv.wait_for(&mut handover_state, max_handover_duration);\n  786 | \n  787 | \t\tif *handover_state == ManagerHandoverState::Finished {\n  788 | \t\t\treturn Ok(());\n  789 | \t\t}\n  790 | \t\tif result.timed_out() {\n  791 | \t\t\twarn!(\"Could not hand the clipboard contents over to the clipboard manager. The request timed out.\");\n  792 | \t\t\treturn Ok(());\n  793 | \t\t}\n  794 | \n  795 | \t\tunreachable!(\"This is a bug! The handover was not finished and the condvar didn't time out, yet the condvar wait ended.\")\n  796 | \t}","lines":12,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L785-L796"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"hard","description":"The X11 backend serves selection data with a single `change_property8` call and has no\n`INCR` *sending* support - it only implements the receiving half\n(`handle_read_property_notify`). ICCCM section 2.7 requires an owner to switch to the `INCR`\nprotocol when the data exceeds the maximum request size the requestor can accept; here the\nwhole payload is pushed into one `ChangeProperty` request. Beyond `x11rb`'s maximum request\nlength the call fails, `into_unknown` turns it into an opaque\n`Error::Unknown { description }`, and `serve_requests` merely logs\n`\"Failed to handle selection request\"` and continues - the pasting application sees a\n`SelectionNotify` never arrive and times out.\n\nPractically this caps what `arboard` can hand to another X11 application at roughly the\nserver's BIG-REQUESTS limit (commonly ~16 MB, but only 256 KB when BIG-REQUESTS is\nunavailable). Screenshot-sized PNGs are usually fine; large images, long file lists, and big\nHTML documents are not, and the failure mode is a silent hang on the requestor's side rather\nthan a reported error.\n","fix":"Implement the owner side of `INCR`. Outline:\n\n1. In `handle_selection_request`, compare `data.bytes.len()` against\n   `conn.maximum_request_bytes()`. Below the threshold keep the current single\n   `change_property8` path.\n2. Above it, `change_property32` the total size under the `INCR` type, select\n   `PropertyChangeMask` on `event.requestor`, and record the pending transfer\n   (requestor, property, target, remaining bytes) in `Inner`.\n3. Extend the `serve_requests` loop with a `PropertyNotify` arm: when the requestor deletes\n   the property, `change_property8` the next chunk; after the final chunk write a zero-length\n   property to terminate.\n4. Time out and drop pending transfers so a requestor that goes away cannot pin memory.\n\nUntil that exists, at minimum turn the oversize case into an explicit, distinguishable error\nat `set` time so callers learn about the limit when they write, not when someone tries to\npaste.","locations":[{"ref":"src/platform/linux/x11.rs:659-686","code":"  659 | \t\t} else {\n  660 | \t\t\ttrace!(\"Handling request for (probably) the clipboard contents.\");\n  661 | \t\t\tlet data = self.selection_of(selection).data.read();\n  662 | \t\t\tif let Some(data_list) = &*data {\n  663 | \t\t\t\tsuccess = match data_list.iter().find(|d| d.format == event.target) {\n  664 | \t\t\t\t\tSome(data) => {\n  665 | \t\t\t\t\t\tself.server\n  666 | \t\t\t\t\t\t\t.conn\n  667 | \t\t\t\t\t\t\t.change_property8(\n  668 | \t\t\t\t\t\t\t\tPropMode::REPLACE,\n  669 | \t\t\t\t\t\t\t\tevent.requestor,\n  670 | \t\t\t\t\t\t\t\tevent.property,\n  671 | \t\t\t\t\t\t\t\tevent.target,\n  672 | \t\t\t\t\t\t\t\t&data.bytes,\n  673 | \t\t\t\t\t\t\t)\n  674 | \t\t\t\t\t\t\t.map_err(into_unknown)?;\n  675 | \t\t\t\t\t\tself.server.conn.flush().map_err(into_unknown)?;\n  676 | \t\t\t\t\t\ttrue\n  677 | \t\t\t\t\t}\n  678 | \t\t\t\t\tNone => false,\n  679 | \t\t\t\t};\n  680 | \t\t\t} else {\n  681 | \t\t\t\t// This must mean that we lost ownership of the data\n  682 | \t\t\t\t// since the other side requested the selection.\n  683 | \t\t\t\t// Let's respond with the property set to none.\n  684 | \t\t\t\tsuccess = false;\n  685 | \t\t\t}\n  686 | \t\t}","lines":28,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L659-L686"},{"ref":"src/platform/linux/x11.rs:553-590","code":"  553 | \t/// Returns Ok(true) when the incr_data is ready\n  554 | \tfn handle_read_property_notify(\n  555 | \t\t&self,\n  556 | \t\treader: &XContext,\n  557 | \t\ttarget_format: u32,\n  558 | \t\tusing_incr: bool,\n  559 | \t\tincr_data: &mut Vec<u8>,\n  560 | \t\ttimeout_end: &mut Instant,\n  561 | \t\tevent: PropertyNotifyEvent,\n  562 | \t) -> Result<bool> {\n  563 | \t\tif event.atom != self.atoms.ARBOARD_CLIPBOARD || event.state != Property::NEW_VALUE {\n  564 | \t\t\treturn Ok(false);\n  565 | \t\t}\n  566 | \t\tif !using_incr {\n  567 | \t\t\t// This must mean the selection owner received our request, and is\n  568 | \t\t\t// now preparing the data\n  569 | \t\t\treturn Ok(false);\n  570 | \t\t}\n  571 | \t\tlet reply = reader\n  572 | \t\t\t.conn\n  573 | \t\t\t.get_property(true, event.window, event.atom, target_format, 0, u32::MAX / 4)\n  574 | \t\t\t.map_err(into_unknown)?\n  575 | \t\t\t.reply()\n  576 | \t\t\t.map_err(into_unknown)?;\n  577 | \n  578 | \t\t// log::trace!(\"Received segment. value_len {}\", reply.value_len,);\n  579 | \t\tif reply.value_len == 0 {\n  580 | \t\t\t// This indicates that all the data has been sent.\n  581 | \t\t\treturn Ok(true);\n  582 | \t\t}\n  583 | \t\tincr_data.extend(reply.value);\n  584 | \n  585 | \t\t// Let's reset our timeout, since we received a valid chunk.\n  586 | \t\t*timeout_end = Instant::now() + SHORT_TIMEOUT_DUR;\n  587 | \n  588 | \t\t// Not yet complete\n  589 | \t\tOk(false)\n  590 | \t}","lines":38,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L553-L590"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`LinuxClipboardKind` implements `TryInto<copy::ClipboardType>` and\n`TryInto<paste::ClipboardType>` directly. The standard-library convention (and\n`clippy::from_over_into`) is to implement `TryFrom` and let the blanket impl supply\n`TryInto`: implementing `TryInto` by hand means `copy::ClipboardType::try_from(kind)` does\nnot exist, so only one of the two call directions works and generic code bounded on\n`TryFrom` cannot use the type.\n","fix":"Flip both impls around:\n\n```rust\nimpl TryFrom<LinuxClipboardKind> for copy::ClipboardType {\n    type Error = Error;\n\n    fn try_from(kind: LinuxClipboardKind) -> Result<Self, Self::Error> {\n        match kind {\n            LinuxClipboardKind::Clipboard => Ok(copy::ClipboardType::Regular),\n            LinuxClipboardKind::Primary => Ok(copy::ClipboardType::Primary),\n            LinuxClipboardKind::Secondary => Err(Error::ClipboardNotSupported),\n        }\n    }\n}\n```\n\nand the same for `paste::ClipboardType`. Every existing `selection.try_into()?` call site\nkeeps working unchanged via the blanket impl.","locations":[{"ref":"src/platform/linux/wayland.rs:30-52","code":"   30 | impl TryInto<copy::ClipboardType> for LinuxClipboardKind {\n   31 | \ttype Error = Error;\n   32 | \n   33 | \tfn try_into(self) -> Result<copy::ClipboardType, Self::Error> {\n   34 | \t\tmatch self {\n   35 | \t\t\tLinuxClipboardKind::Clipboard => Ok(copy::ClipboardType::Regular),\n   36 | \t\t\tLinuxClipboardKind::Primary => Ok(copy::ClipboardType::Primary),\n   37 | \t\t\tLinuxClipboardKind::Secondary => Err(Error::ClipboardNotSupported),\n   38 | \t\t}\n   39 | \t}\n   40 | }\n   41 | \n   42 | impl TryInto<paste::ClipboardType> for LinuxClipboardKind {\n   43 | \ttype Error = Error;\n   44 | \n   45 | \tfn try_into(self) -> Result<paste::ClipboardType, Self::Error> {\n   46 | \t\tmatch self {\n   47 | \t\t\tLinuxClipboardKind::Clipboard => Ok(paste::ClipboardType::Regular),\n   48 | \t\t\tLinuxClipboardKind::Primary => Ok(paste::ClipboardType::Primary),\n   49 | \t\t\tLinuxClipboardKind::Secondary => Err(Error::ClipboardNotSupported),\n   50 | \t\t}\n   51 | \t}\n   52 | }","lines":23,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/wayland.rs#L30-L52"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"All three image-reading backends use `image::io::Reader`. The `image::io` module was\ndeprecated in the 0.25 series in favour of the re-export `image::ImageReader`. `Cargo.toml`\nrequests `image = \"0.25\"`, so any consumer whose lockfile resolves to a current 0.25.x gets\ndeprecation warnings from inside `arboard`'s own source (this repo's `Cargo.lock` happens to\npin 0.25.1, which is why `cargo clippy` is clean here). It will also break outright at the\n0.26 bump.\n","fix":"Switch to the stable path. `image::ImageReader` has the same API surface:\n\n```rust\n// src/platform/linux/x11.rs\nlet mut reader = image::ImageReader::new(cursor);\nreader.set_format(image::ImageFormat::Png);\n```\n\n```rust\n// src/platform/linux/wayland.rs\nlet image = image::ImageReader::new(Cursor::new(buffer))\n    .with_guessed_format()\n    .map_err(|_| Error::ConversionFailure)?\n    .decode()\n    .map_err(|_| Error::ConversionFailure)?;\n```\n\n```rust\n// src/platform/osx.rs\nlet reader = image::ImageReader::with_format(data, image::ImageFormat::Tiff);\n```\n\n`image::ImageReader` exists throughout 0.25, so no version bump is needed.","locations":[{"ref":"src/platform/linux/x11.rs:1028-1031","code":" 1028 | \t\tlet cursor = std::io::Cursor::new(&bytes);\n 1029 | \t\tlet mut reader = image::io::Reader::new(cursor);\n 1030 | \t\treader.set_format(image::ImageFormat::Png);\n 1031 | \t\tlet image = match reader.decode() {","lines":4,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/x11.rs#L1028-L1031"},{"ref":"src/platform/linux/wayland.rs:192-196","code":"  192 | \t\t\tlet image = image::io::Reader::new(Cursor::new(buffer))\n  193 | \t\t\t\t.with_guessed_format()\n  194 | \t\t\t\t.map_err(|_| Error::ConversionFailure)?\n  195 | \t\t\t\t.decode()\n  196 | \t\t\t\t.map_err(|_| Error::ConversionFailure)?;","lines":5,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/linux/wayland.rs#L192-L196"},{"ref":"src/platform/osx.rs:237-238","code":"  237 | \t\t\tlet reader = image::io::Reader::with_format(data, image::ImageFormat::Tiff);\n  238 | \t\t\treader.decode().map_err(|_| Error::ConversionFailure)","lines":2,"link":"https://github.com/1Password/arboard/blob/9f7b05ca9178e3c28ec5e59a522786a8ea591cce/src/platform/osx.rs#L237-L238"}]},
