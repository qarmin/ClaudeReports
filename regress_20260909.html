<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In parse_file() in string_properties.rs, every call to fields.next().unwrap() (lines 21-22) will panic with an unhelpful 'called Option::unwrap() on a None value' message if the emoji-sequences.txt or emoji-zwj-sequences.txt file has a malformed line lacking a semicolon field separator. Similarly, CodepointRange::from_str(...).unwrap() and Codepoint::from_str(...).unwrap() (lines 30, 37, 41) provide no context on which file or line triggered the parse failure. Because this is a build tool, the panics will abort the build with a cryptic backtrace.","fix":"Use expect() with a descriptive message that includes the path and the offending line content, or collect errors with anyhow/thiserror for better diagnostics.","locations":[{"ref":"gen-unicode/src/string_properties.rs:14-41","code":"   14 |     let file = File::open(path).unwrap();\n   15 |     for line in io::BufReader::new(file).lines() {\n   16 |         let line = line.unwrap();\n   17 |         if line.starts_with('#') || line.is_empty() {\n   18 |             continue;\n   19 |         }\n   20 |         let mut fields = line.split(';');\n   21 |         let codepoints = fields.next().unwrap().trim();\n   22 |         let property = fields.next().unwrap().trim().to_string();\n   23 | \n   24 |         let property_codepoints = match properties.entry(property) {\n   25 |             Entry::Occupied(o) => o.into_mut(),\n   26 |             Entry::Vacant(v) => v.insert(Vec::new()),\n   27 |         };\n   28 | \n   29 |         if codepoints.contains(\"..\") {\n   30 |             for cp in CodepointRange::from_str(codepoints).unwrap() {\n   31 |                 property_codepoints.push(vec![cp]);\n   32 |             }\n   33 |         } else if codepoints.contains(' ') {\n   34 |             property_codepoints.push(\n   35 |                 codepoints\n   36 |                     .split_whitespace()\n   37 |                     .map(|s| Codepoint::from_str(s).unwrap())\n   38 |                     .collect(),\n   39 |             );\n   40 |         } else {\n   41 |             property_codepoints.push(vec![Codepoint::from_str(codepoints).unwrap()]);","lines":28,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/gen-unicode/src/string_properties.rs#L14-L41"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`ByteBitmap::as_array<N>()` iterates over all 256 bytes and writes the ones present into `array[idx]` without any bounds check or early exit. If the bitmap contains more than `N` bytes, indexing `array[idx]` where `idx >= N` panics with an opaque index-out-of-bounds. The doc comment says \"Panics if the array is not large enough\" but gives no context on why or the expected invariant. In release mode the panic still occurs (no UB), but the diagnostic is confusing.","fix":"Add an explicit `assert!(idx < N, \"ByteBitmap::as_array: bitmap has more than {N} entries\");` before the assignment, or add a `debug_assert` and document the caller responsibility clearly with the precondition.","locations":[{"ref":"src/bytesearch.rs:250-263","code":"  250 |     /// Panics if the array is not large enough.\n  251 |     #[allow(clippy::wrong_self_convention)]\n  252 |     #[inline(always)]\n  253 |     pub fn as_array<const N: usize>(&self) -> [u8; N] {\n  254 |         let mut array = [0u8; N];\n  255 |         let mut idx = 0;\n  256 |         for byte in 0..=255 {\n  257 |             if self.contains(byte) {\n  258 |                 array[idx] = byte;\n  259 |                 idx += 1;\n  260 |             }\n  261 |         }\n  262 |         array\n  263 |     }","lines":14,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/bytesearch.rs#L250-L263"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The `with_scm_loop_impl` and `with_scm_compute_max` helper functions in `classicalbacktrack.rs` handle `ByteSeq1` through `ByteSeq6` but not `ByteSeq7` through `ByteSeq16` (lines 289-310 and 358-378). The wildcard arm fires `unreachable!(\"Missing SCM: ...\")`. In current code this is not reachable because `Loop1CharBody` can only be created from nodes where `matches_exactly_one_char()` returns true (Char, CharSet, Bracket, MatchAny, MatchAnyExceptLineTerminator), whose byte encodings are at most 4 bytes (ByteSeq1-4). However, the panic message says 'Missing SCM' implying the arm is not expected, and any future optimisation that allows multi-byte bodies would silently trigger a release-mode panic instead of a compile error.","fix":"Add a compile-time or build-time assertion that `Loop1CharBody`'s loopee can produce at most `ByteSeq4`. Alternatively, add `ByteSeq7` through `ByteSeq16` arms that call `run_scm_loop_impl` / `compute_max_pos` with `scm::MatchByteSeq(bytes)` to make the wildcard arm truly unreachable.","locations":[{"ref":"src/classicalbacktrack.rs:313-334","code":"  313 |             Insn::ByteSeq1(bytes) => {\n  314 |                 Self::run_scm_loop_impl(input, pos, min, max, dir, scm::MatchByteSeq(bytes))\n  315 |             }\n  316 |             Insn::ByteSeq2(bytes) => {\n  317 |                 Self::run_scm_loop_impl(input, pos, min, max, dir, scm::MatchByteSeq(bytes))\n  318 |             }\n  319 |             Insn::ByteSeq3(bytes) => {\n  320 |                 Self::run_scm_loop_impl(input, pos, min, max, dir, scm::MatchByteSeq(bytes))\n  321 |             }\n  322 |             Insn::ByteSeq4(bytes) => {\n  323 |                 Self::run_scm_loop_impl(input, pos, min, max, dir, scm::MatchByteSeq(bytes))\n  324 |             }\n  325 |             Insn::ByteSeq5(bytes) => {\n  326 |                 Self::run_scm_loop_impl(input, pos, min, max, dir, scm::MatchByteSeq(bytes))\n  327 |             }\n  328 |             Insn::ByteSeq6(bytes) => {\n  329 |                 Self::run_scm_loop_impl(input, pos, min, max, dir, scm::MatchByteSeq(bytes))\n  330 |             }\n  331 |             _ => {\n  332 |                 unreachable!(\"Missing SCM: {:?}\", re.insns.iat(ip + 1));\n  333 |             }\n  334 |         }","lines":22,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/classicalbacktrack.rs#L313-L334"},{"ref":"src/classicalbacktrack.rs:378-398","code":"  378 |             Insn::ByteSeq1(bytes) => {\n  379 |                 Self::compute_max_pos(input, pos, limit, dir, scm::MatchByteSeq(bytes))\n  380 |             }\n  381 |             Insn::ByteSeq2(bytes) => {\n  382 |                 Self::compute_max_pos(input, pos, limit, dir, scm::MatchByteSeq(bytes))\n  383 |             }\n  384 |             Insn::ByteSeq3(bytes) => {\n  385 |                 Self::compute_max_pos(input, pos, limit, dir, scm::MatchByteSeq(bytes))\n  386 |             }\n  387 |             Insn::ByteSeq4(bytes) => {\n  388 |                 Self::compute_max_pos(input, pos, limit, dir, scm::MatchByteSeq(bytes))\n  389 |             }\n  390 |             Insn::ByteSeq5(bytes) => {\n  391 |                 Self::compute_max_pos(input, pos, limit, dir, scm::MatchByteSeq(bytes))\n  392 |             }\n  393 |             Insn::ByteSeq6(bytes) => {\n  394 |                 Self::compute_max_pos(input, pos, limit, dir, scm::MatchByteSeq(bytes))\n  395 |             }\n  396 |             _ => {\n  397 |                 unreachable!(\"Missing SCM: {:?}\", re.insns.iat(ip + 1));\n  398 |             }","lines":21,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/classicalbacktrack.rs#L378-L398"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In unfold_icase_chars, the `_` arm panics if unfold_uppercase_char or unfold_char returns more than MAX_BYTE_SET_LENGTH (4) code points for a character. The panic fires in release builds. Although current Unicode data does not produce more than 4 case variants, this is an undocumented assumption about Unicode tables. If the tables are ever updated or a new fold relation is added with 5+ variants, the optimizer will panic when compiling any regex containing that character with the icase flag.","fix":"Instead of panicking, fall back to keeping the original icase Char node when unfolded.len() > MAX_CHAR_SET_LENGTH. This is safe because the backtracking engine handles icase Char natively. Change the arm to `_ => PassAction::Keep`.","locations":[{"ref":"src/optimizer.rs:297-298","code":"  297 |     }\n  298 | }","lines":2,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/optimizer.rs#L297-L298"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"emit.rs next_offset() casts insns.len() to u32 without a bounds check. If a regex could generate more than u32::MAX instructions, the cast silently truncates, causing subsequent jump-target fixups to point to wrong instructions and producing incorrect matching behaviour or crashes. There is no limit on total instruction count enforced by the parser.","fix":"Add an assert or saturating check: `assert!(self.result.insns.len() <= u32::MAX as usize, \"instruction count overflow\");` in next_offset, or maintain a u32 counter directly.","locations":[{"ref":"src/emit.rs:179-181","code":"  179 |     fn next_offset(&self) -> u32 {\n  180 |         self.result.insns.len() as u32\n  181 |     }","lines":3,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/emit.rs#L179-L181"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"FoldPair::stride_to computes 'rhs.orig - self.orig' as u32 subtraction without checking that rhs.orig >= self.orig. Similarly, DeltaBlock::can_append computes 'fp.orig - self.first().orig' (line 236) as u32 subtraction. If the UCD data is ever not in strictly ascending codepoint order, these will panic with a subtraction overflow in debug builds or silently wrap in release builds, producing corrupt FoldRange tables. Neither generate_case_folds nor generate_uppercase sorts fold_pairs before iterating; they rely entirely on the implicit ordering of the parsed UCD data.","fix":"Either sort fold_pairs by .orig before the DeltaBlock loop, or add a debug_assert!(rhs.orig >= self.orig) in stride_to and a similar guard in can_append before the subtraction.","locations":[{"ref":"gen-unicode/src/main.rs:195-197","code":"  195 |     fn stride_to(self, rhs: FoldPair) -> u32 {\n  196 |         rhs.orig - self.orig\n  197 |     }","lines":3,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/gen-unicode/src/main.rs#L195-L197"},{"ref":"gen-unicode/src/main.rs:239","code":"  239 |         } else if fp.orig - self.first().orig > MAX_LENGTH {","lines":1,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/gen-unicode/src/main.rs#L239"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"NamedGroups implements ExactSizeIterator but its size_hint is incorrect when duplicate group names exist. size_hint counts every non-empty name from next_group_idx onwards, but the iterator skips duplicate occurrences of the same name. For a regex with two capture groups both named 'foo', size_hint returns 2 at start but the iterator yields only 1 item. ExactSizeIterator is a safety-relevant contract: callers (including stdlib code) may use the exact size to allocate or unsafe-index, leading to logic errors or, in unsafe contexts, memory safety issues.","fix":"Rewrite size_hint to count distinct non-empty names from next_group_idx, deduplicating. One approach: `let seen: std::collections::HashSet<_> = self.mat.group_names[..self.next_group_idx].iter().filter(|s| !s.is_empty()).collect(); let size = self.mat.group_names[self.next_group_idx..].iter().filter(|s| !s.is_empty()).filter(|s| !seen.contains(s)).count();`. Alternatively, remove the ExactSizeIterator impl if an exact count is not worth computing.","locations":[{"ref":"src/api.rs:380-388","code":"  380 |     fn size_hint(&self) -> (usize, Option<usize>) {\n  381 |         let size = self.mat.group_names[self.next_group_idx..]\n  382 |             .iter()\n  383 |             .filter(|s| !s.is_empty())\n  384 |             .count();\n  385 | \n  386 |         (size, Some(size))\n  387 |     }\n  388 | }","lines":9,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L380-L388"},{"ref":"src/api.rs:390","code":"  390 | impl<'m> ExactSizeIterator for NamedGroups<'m> {}","lines":1,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L390"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The pattern_impl forward Searcher skips one byte after every zero-width match that is not at the end of the haystack. When a zero-width match is found at position P, current_pos is advanced to the next char boundary (P+delta). On the next call, find_from starts at P+delta, so if a subsequent match starts at P+delta there is no Reject segment covering bytes [P, P+delta). Those bytes are never reported as either Match or Reject, violating the Searcher safety contract (all bytes must be returned exactly once as Match or Reject segments). Code relying on exhaustive partitioning (e.g. split, matches) will silently drop that character.","fix":"After returning Match(match_start, match_end) for a zero-width match, the next call must emit Reject(match_end, current_pos) to cover the skipped bytes before looking for the next match. Introduce a pending_reject field in RegexSearcher to emit it on the subsequent call, or restructure next() to emit the Reject immediately within the same call.","locations":[{"ref":"src/api.rs:868-889","code":"  868 |                 self.current_pos = match_end;\n  869 | \n  870 |                 // Handle zero-width matches to avoid infinite loops\n  871 |                 if match_start == match_end {\n  872 |                     // For zero-width matches, we need to advance at least one byte\n  873 |                     // to avoid infinite loops\n  874 |                     if match_end < self.haystack.len() {\n  875 |                         // Find the next character boundary\n  876 |                         let mut next_pos = match_end + 1;\n  877 |                         while next_pos < self.haystack.len()\n  878 |                             && !self.haystack.is_char_boundary(next_pos)\n  879 |                         {\n  880 |                             next_pos += 1;\n  881 |                         }\n  882 |                         self.current_pos = next_pos;\n  883 |                     } else {\n  884 |                         // We're at the end of the string\n  885 |                         self.done = true;\n  886 |                     }\n  887 |                 }\n  888 | \n  889 |                 SearchStep::Match(match_start, match_end)","lines":22,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L868-L889"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `ClassSet::node`, when `negate_set` is true and `self.alternatives` is non-empty, the negation is either ignored entirely (when codepoints are empty, line 88 returns the alternatives node directly) or applied only to the bracket but not to the alternatives portion of the Alt node (line 90). A negated class `[^\\q{ab}]` would emit an un-negated alternatives node.","fix":"When `negate_set` is true and alternatives are present, the spec requires an error (negation of a class set with string alternatives is not allowed in v-mode). Either return an error or, if the spec allows it, correctly negate the codepoints only and error on alternatives.","locations":[{"ref":"src/parse.rs:86-92","code":"   86 |         if self.alternatives.0.is_empty() {\n   87 |             bracket\n   88 |         } else if codepoints_empty {\n   89 |             self.alternatives.into_node(icase)\n   90 |         } else {\n   91 |             make_alt(Vec::from([self.alternatives.into_node(icase), bracket]))\n   92 |         }","lines":7,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/parse.rs#L86-L92"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `consume_class_set_expression`, when the first operand is followed by a single `&` (not `&&`), the code consumes `&`, adds it to `result.codepoints`, and enters Union mode - but it never adds `first` to `result`. For example, `[a&b]` in unicode-sets mode yields a set containing `&` and `b` but silently drops `a`.","fix":"Before adding `0x26` to `result.codepoints`, also call `result.union_operand(first)` so the first operand is not lost. The `first` in this arm should not be cloned since it is consumed.","locations":[{"ref":"src/parse.rs:1053-1062","code":" 1053 |             Some(0x26 /* & */) => {\n 1054 |                 self.consume('&');\n 1055 |                 if self.peek() == Some(0x26 /* & */) {\n 1056 |                     self.consume('&');\n 1057 |                     result.union_operand(first.clone());\n 1058 |                     ClassSetOperator::Intersection\n 1059 |                 } else {\n 1060 |                     result.codepoints.add_one(0x26 /* & */);\n 1061 |                     ClassSetOperator::Union\n 1062 |                 }","lines":10,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/parse.rs#L1053-L1062"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Two test patterns in test_lookbehinds_mjsunit_tc have a spurious leading double-quote character inside the regex string literal. 'tc.compilef(\"\\\"^foooo(?<=^o+)$\", \"\")' tests the pattern '\"^foooo(?<=^o+)$' (starting with a literal '\"'), not the intended '^foooo(?<=^o+)$'. The .test_fails(\"foooo\") assertion passes for the wrong reason (\"foooo\" has no leading '\"' so the pattern can never match), meaning the real lookbehind logic is not exercised.","fix":"Remove the leading escaped double-quote from each pattern string: change '\"\\\"^foooo(?<=^o+)$\"' to '\"^foooo(?<=^o+)$\"' and similarly for the o* variant on line 432.","locations":[{"ref":"tests/tests.rs:432-433","code":"  432 |     tc.compilef(\"\\\"^foooo(?<=^o+)$\", \"\").test_fails(\"foooo\");\n  433 |     tc.compilef(\"\\\"^foooo(?<=^o*)$\", \"\").test_fails(\"foooo\");","lines":2,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/tests/tests.rs#L432-L433"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"generate_binary_properties_tests() and generate_general_category_tests() only emit the START codepoint of each range (c.0) as a test vector, not all codepoints in the range. For example, a property range (0x0041, 0x005A) generates a test only for U+0041 ('A'), never checking U+005A ('Z') or anything in between. The generated tests therefore have very sparse codepoint coverage; an off-by-one in the range endpoints would go undetected.","fix":"Emit at minimum both the start and the end codepoint of each range (and optionally a mid-range sample), mirroring the strategy used in generate_scripts_tests() which already does this via the SAMPLE_THRESHOLD logic.","locations":[{"ref":"gen-unicode/src/binary_properties.rs:161-164","code":"  161 |             let code_points: Vec<String> = chars\n  162 |                 .iter()\n  163 |                 .map(|c| format!(\"\\\"\\\\u{{{:x}}}\\\"\", c.0))\n  164 |                 .collect();","lines":4,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/gen-unicode/src/binary_properties.rs#L161-L164"},{"ref":"gen-unicode/src/general_category_values.rs:171-174","code":"  171 |             let code_points: Vec<String> = chars\n  172 |                 .iter()\n  173 |                 .map(|c| format!(\"\\\"\\\\u{{{:x}}}\\\"\", c.0))\n  174 |                 .collect();","lines":4,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/gen-unicode/src/general_category_values.rs#L171-L174"},{"ref":"gen-unicode/src/general_category_values.rs:245-248","code":"  245 |             let code_points: Vec<String> = chars\n  246 |                 .iter()\n  247 |                 .map(|c| format!(\"\\\"\\\\u{{{:x}}}\\\"\", c.0))\n  248 |                 .collect();","lines":4,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/gen-unicode/src/general_category_values.rs#L245-L248"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `format_bitmap()` (used by `Debug` impls for `AsciiBitmap` and `ByteBitmap`), the inner loop increments `end` while `end <= 256` and calls `contains(end as u8)`. When `end` reaches 256, `end as u8` truncates to 0, so the loop tests whether byte 0 is in the bitmap instead of detecting the end of the byte range. If byte 0 is present, the loop will incorrectly include it in the current run and produce a range string like \"255-256\" (or even loop further), corrupting the Debug output.","fix":"Change the loop bound and cast: use `end < 256` in the outer while and `(end as u8)` only when `end <= 255`. Alternatively, use `u16` for `idx` and `end` with the outer loop `while idx <= 255u16` to avoid truncation entirely.","locations":[{"ref":"src/bytesearch.rs:134-148","code":"  134 |     while idx <= 256 {\n  135 |         // Compute the next value not contained.\n  136 |         let mut end = idx;\n  137 |         while end <= 256 && contains(end as u8) {\n  138 |             end += 1;\n  139 |         }\n  140 |         match end - idx {\n  141 |             0 => (),\n  142 |             1 => write!(f, \"{}{}\", maybe_space, idx)?,\n  143 |             _ => write!(f, \"{}{}-{}\", maybe_space, idx, end - 1)?,\n  144 |         };\n  145 |         if end > idx {\n  146 |             maybe_space = \" \";\n  147 |         }\n  148 |         idx = end + 1","lines":15,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/bytesearch.rs#L134-L148"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `intersect_operand` for `ClassSetOperand::Class` (lines 146-162), the cross-product handling is incomplete for multi-char alternatives. The code only accounts for len-1 alternatives crossing between codepoints and alternatives, but multi-char alternatives in `self.alternatives` that also appear in `class.alternatives` are handled by the `self.alternatives.intersect` call. However, multi-char alternatives in `class.alternatives` that are a superset of chars all present in `self.codepoints` should logically be included in the intersection, but they are not. This makes the unicode-sets class intersection semantically approximate.","fix":"This is inherently complex since intersection of string sets is not straightforward. The implementation should be carefully validated against the TC39 spec for all combinations of codepoint-sets and string-alternatives intersections.","locations":[{"ref":"src/parse.rs:147-163","code":"  147 |             ClassSetOperand::Class(class) => {\n  148 |                 let mut retained_codepoints = CodePointSet::new();\n  149 |                 for alternative in &class.alternatives.0 {\n  150 |                     if alternative.len() == 1 && self.codepoints.contains(alternative[0]) {\n  151 |                         retained_codepoints.add_one(alternative[0]);\n  152 |                     }\n  153 |                 }\n  154 |                 let mut retained_alternatives = ClassSetAlternativeStrings::new();\n  155 |                 for alternative in &self.alternatives.0 {\n  156 |                     if alternative.len() == 1 && class.codepoints.contains(alternative[0]) {\n  157 |                         retained_alternatives.0.push(alternative.clone());\n  158 |                     }\n  159 |                 }\n  160 |                 self.codepoints.intersect(class.codepoints.intervals());\n  161 |                 self.codepoints.add_set(retained_codepoints);\n  162 |                 self.alternatives.intersect(&class.alternatives);\n  163 |                 self.alternatives.extend(retained_alternatives);","lines":17,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/parse.rs#L147-L163"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `consume_class_set_character` and `consume_class_set_operand`, `\\b` inside a unicode-sets class set returns the raw codepoint `0x62` ('b') instead of `0x08` (backspace, U+0008). In contrast, the regular bracket parser (`try_consume_bracket_class_atom`) correctly returns `'\\x08'` for `\\b`. This means `[\\b]` in `v`-mode matches the letter 'b' instead of backspace.","fix":"Replace `Ok(self.consume(cp))` in the `\\b` arm of both functions with `Ok(self.consume(cp); 0x08)` - i.e. consume the `b` but return `0x08u32` (backspace), matching the spec and the non-unicode-sets code path.","locations":[{"ref":"src/parse.rs:1322-1325","code":" 1322 |                     // \\b\n 1323 |                     0x62 /* b */ => {\n 1324 |                         Ok(self.consume(cp))\n 1325 |                     }","lines":4,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/parse.rs#L1322-L1325"},{"ref":"src/parse.rs:1295-1298","code":" 1295 |                     // ClassSetCharacter:: \\b\n 1296 |                     0x62 /* b */ => {\n 1297 |                         Ok(ClassSetCharacter(self.consume(cp)))\n 1298 |                     }","lines":4,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/parse.rs#L1295-L1298"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `collect_named_group_locations`, the `[` handler (lines 1923-1933) scans until the matching `]` by skipping `\\X` pairs. In `unicode_sets` mode, brackets can be nested (`[[a][b]]`). The scanner does not track nesting, so the first `]` at any depth terminates the bracket scan. This causes incorrect paren-depth tracking and can miscount capture groups for patterns with nested class sets.","fix":"When `flags.unicode_sets` is set, use a nesting counter for brackets inside the `[` handler. Increment on `[` and decrement on `]`; only break when the nesting counter reaches zero.","locations":[{"ref":"src/parse.rs:1960-1970","code":" 1960 |                 Some('[') => loop {\n 1961 |                     match self.next().map(to_char_sat) {\n 1962 |                         Some('\\\\') => {\n 1963 |                             self.next();\n 1964 |                             continue;\n 1965 |                         }\n 1966 |                         Some(']') => break,\n 1967 |                         Some(_) => continue,\n 1968 |                         None => break,\n 1969 |                     }\n 1970 |                 },","lines":11,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/parse.rs#L1960-L1970"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `pikevm::try_match_state`, a successful positive lookahead (or lookbehind) swaps the entire inner `State` back into the current state `s` (via `core::mem::swap` inside `try_at_pos`). This correctly propagates capture group results, but it also replaces `s.loops` with the lookahead's loop counters. If the lookahead contains loops (which have globally-unique `loop_id` values), those counters occupy entries in the shared `loops` vec. While loop IDs are unique so outer loop state is not directly corrupted, the memory usage of `s.loops` grows with the union of outer and inner loop IDs. More critically, if the lookahead fails the inner try_at_pos returns false and `s` is untouched - but when it succeeds `s.loops` is replaced wholesale. A later `EnterLoop` for an outer loop resets `ld.iters = 0`, so correctness is preserved in practice, but the interaction is fragile and undocumented.","fix":"After a successful lookahead/lookbehind, restore `s.loops` from the saved snapshot before swapping the state back, similar to how `classicalbacktrack::run_lookaround` uses isolated backtrack stacks. Document why propagating loops is or is not correct.","locations":[{"ref":"src/pikevm.rs:246-285","code":"  246 |         &Insn::Lookahead {\n  247 |             negate,\n  248 |             start_group: _,\n  249 |             end_group: _,\n  250 |             continuation,\n  251 |         } => {\n  252 |             // Enter into the lookaround's instruction stream.\n  253 |             s.ip += 1;\n  254 |             let saved_pos = s.pos;\n  255 |             let attempt_succeeded =\n  256 |                 MatchAttempter::<Input>::new(re).try_at_pos(*input, s, Forward::new());\n  257 |             let matched = attempt_succeeded != negate;\n  258 |             if matched {\n  259 |                 s.ip = continuation as usize;\n  260 |                 s.pos = saved_pos;\n  261 |                 StateMatch::Continue\n  262 |             } else {\n  263 |                 StateMatch::Fail\n  264 |             }\n  265 |         }\n  266 | \n  267 |         &Insn::Lookbehind {\n  268 |             negate,\n  269 |             start_group: _,\n  270 |             end_group: _,\n  271 |             continuation,\n  272 |         } => {\n  273 |             // Enter into the lookaround's instruction stream.\n  274 |             s.ip += 1;\n  275 |             let saved_pos = s.pos;\n  276 |             let attempt_succeeded = MatchAttempter::new(re).try_at_pos(*input, s, Backward::new());\n  277 |             let matched = attempt_succeeded != negate;\n  278 |             if matched {\n  279 |                 s.ip = continuation as usize;\n  280 |                 s.pos = saved_pos;\n  281 |                 StateMatch::Continue\n  282 |             } else {\n  283 |                 StateMatch::Fail\n  284 |             }\n  285 |         }","lines":40,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/pikevm.rs#L246-L285"},{"ref":"src/pikevm.rs:437-462","code":"  437 |     fn try_at_pos<Dir: Direction>(\n  438 |         &mut self,\n  439 |         input: Input,\n  440 |         init_state: &mut State<Input::Position>,\n  441 |         dir: Dir,\n  442 |     ) -> bool {\n  443 |         debug_assert!(self.states.is_empty(), \"Should be no states\");\n  444 |         self.states.push(init_state.clone());\n  445 |         while !self.states.is_empty() {\n  446 |             let s = self.states.last_mut().unwrap();\n  447 |             match try_match_state(self.re, &input, s, dir) {\n  448 |                 StateMatch::Fail => {\n  449 |                     self.states.pop();\n  450 |                 }\n  451 |                 StateMatch::Continue => {}\n  452 |                 StateMatch::Complete => {\n  453 |                     // Give the successful state to the caller.\n  454 |                     core::mem::swap(init_state, s);\n  455 |                     self.states.clear();\n  456 |                     return true;\n  457 |                 }\n  458 |                 StateMatch::Split(newstate) => self.states.push(newstate),\n  459 |             }\n  460 |         }\n  461 |         false\n  462 |     }","lines":26,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/pikevm.rs#L437-L462"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In exec_re_on_string in regress-tool, the total match count is computed as '1 + matches.count()' after calling matches.next() to get the first result. This is correct. However, the formatted first match (res) is captured before consuming the iterator with .count(), so res references a Match object whose captured range offsets are valid. The issue is cosmetic: if there are zero additional matches after the first, count() returns 0 and '1 + 0 = 1', which is correct. But if the program is intended as a diagnostic tool, the 'total' count printed reflects all matches including the first, while only the first match is printed - which could confuse users expecting all matches to be shown.","fix":"Add a comment clarifying that 'total' is the total number of matches and only the first is displayed, or collect and display all matches.","locations":[{"ref":"regress-tool/src/regress-tool.rs:65-73","code":"   65 | fn exec_re_on_string(re: &Regex, input: &str) {\n   66 |     let mut matches = re.find_iter(input);\n   67 |     if let Some(res) = matches.next() {\n   68 |         let count = 1 + matches.count();\n   69 |         println!(\"Match: {}, total: {}\", format_match(&res, input), count);\n   70 |     } else {\n   71 |         println!(\"No match\");\n   72 |     }\n   73 | }","lines":9,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/regress-tool/src/regress-tool.rs#L65-L73"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `try_duplicate` for `Node::Loop`, the assertion `enclosed_groups.start >= enclosed_groups.end` is used to assert no enclosed groups. For a non-empty range, `start < end`, so the assert fires. However, an empty range has `start == end`, not `start > end`, so the `>=` condition allows `start > end` (which is already an invalid range state). The assertion is correct in practice but uses a confusing inequality; `start == end` would be clearer.","fix":"Change the assertion to `assert!(enclosed_groups.is_empty(), ...)`, which is both clearer and correct.","locations":[{"ref":"src/ir.rs:222-224","code":"  222 |                 assert!(\n  223 |                     enclosed_groups.start >= enclosed_groups.end,\n  224 |                     \"Cannot duplicate a loop with enclosed groups\"","lines":3,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/ir.rs#L222-L224"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `try_duplicate` for `Node::LookaroundAssertion`, the assertion `start_group >= end_group` checks for no enclosed groups. Same issue as the Loop assertion: `>=` allows the impossible `start > end` case. Use `start == end` or `is_empty()` for clarity.","fix":"Change the assertion condition to `*start_group == *end_group` or introduce a helper method.","locations":[{"ref":"src/ir.rs:258-260","code":"  258 |                 assert!(\n  259 |                     start_group >= end_group,\n  260 |                     \"Cannot duplicate an assertion with enclosed groups\"","lines":3,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/ir.rs#L258-L260"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The two cargo fmt invocations in main() call .output().expect(...). The .expect() only panics if the OS fails to spawn or wait for the child process. If cargo fmt itself exits with a non-zero exit code (e.g. rustfmt not installed, syntax error in generated code), the failure is silently swallowed and the malformed output is left in the generated files. The generated tables and test files would then be unparseable by the Rust compiler with no diagnostic from gen-unicode itself.","fix":"Check the exit status after .output(): let out = cmd.output().expect(\"...\"); assert!(out.status.success(), \"cargo fmt failed: {}\", String::from_utf8_lossy(&out.stderr));","locations":[{"ref":"gen-unicode/src/main.rs:115-127","code":"  115 |     std::process::Command::new(\"cargo\")\n  116 |         .arg(\"fmt\")\n  117 |         .arg(\"--\")\n  118 |         .arg(file_unicode_tables_path)\n  119 |         .output()\n  120 |         .expect(\"Failed to run 'cargo fmt' on unicode tables file\");\n  121 | \n  122 |     std::process::Command::new(\"cargo\")\n  123 |         .arg(\"fmt\")\n  124 |         .arg(\"--\")\n  125 |         .arg(file_tests_path)\n  126 |         .output()\n  127 |         .expect(\"Failed to run 'cargo fmt' on tests file\");","lines":13,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/gen-unicode/src/main.rs#L115-L127"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"ReverseSearcher::find_last_match_before always iterates all matches from the beginning of the haystack to find the last match before the current reverse position. Each call to next_back() invokes this O(n) scan, making the full reverse iteration O(n^2) in the number of matches. For a string with M matches, reverse searching costs O(M^2) instead of O(M).","fix":"Collect all matches once in a Vec at construction time, store the Vec in RegexSearcher, and have next_back() pop from the end. Alternatively, walk the Vec by index. This reduces reverse iteration to O(M) total.","locations":[{"ref":"src/api.rs:830-841","code":"  830 |         fn find_last_match_before(&self, pos: usize) -> Option<super::Match> {\n  831 |             // Find all matches up to the given position and return the last one\n  832 |             let mut last_match = None;\n  833 |             for m in self.regex.find_from(self.haystack, 0) {\n  834 |                 if m.end() <= pos {\n  835 |                     last_match = Some(m);\n  836 |                 } else {\n  837 |                     break;\n  838 |                 }\n  839 |             }\n  840 |             last_match\n  841 |         }","lines":12,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L830-L841"},{"ref":"src/api.rs:906-957","code":"  906 |     unsafe impl<'r, 't> ReverseSearcher<'t> for RegexSearcher<'r, 't> {\n  907 |         fn next_back(&mut self) -> SearchStep {\n  908 |             if self.reverse_done {\n  909 |                 return SearchStep::Done;\n  910 |             }\n  911 | \n  912 |             // Try to find the last match before current reverse position\n  913 |             if let Some(m) = self.find_last_match_before(self.reverse_pos) {\n  914 |                 let match_start = m.start();\n  915 |                 let match_end = m.end();\n  916 | \n  917 |                 // Handle any gap between match end and current reverse position\n  918 |                 if match_end < self.reverse_pos {\n  919 |                     let reject_start = match_end;\n  920 |                     let reject_end = self.reverse_pos;\n  921 |                     self.reverse_pos = match_end;\n  922 |                     return SearchStep::Reject(reject_start, reject_end);\n  923 |                 }\n  924 | \n  925 |                 // Return the match\n  926 |                 self.reverse_pos = match_start;\n  927 | \n  928 |                 // Handle zero-width matches\n  929 |                 if match_start == match_end {\n  930 |                     // For zero-width matches, move back by one character\n  931 |                     if match_start > 0 {\n  932 |                         let mut prev_pos = match_start - 1;\n  933 |                         while prev_pos > 0 && !self.haystack.is_char_boundary(prev_pos) {\n  934 |                             prev_pos -= 1;\n  935 |                         }\n  936 |                         self.reverse_pos = prev_pos;\n  937 |                     } else {\n  938 |                         // We're at the beginning of the string\n  939 |                         self.reverse_done = true;\n  940 |                     }\n  941 |                 }\n  942 | \n  943 |                 SearchStep::Match(match_start, match_end)\n  944 |             } else {\n  945 |                 // No more matches, reject remaining text if any\n  946 |                 if self.reverse_pos > 0 {\n  947 |                     let reject_start = 0;\n  948 |                     let reject_end = self.reverse_pos;\n  949 |                     self.reverse_pos = 0;\n  950 |                     self.reverse_done = true;\n  951 |                     SearchStep::Reject(reject_start, reject_end)\n  952 |                 } else {\n  953 |                     self.reverse_done = true;\n  954 |                     SearchStep::Done\n  955 |                 }\n  956 |             }\n  957 |         }","lines":52,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L906-L957"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"replace_all and replace_all_with do not handle zero-width matches specially. When the underlying find_iter returns a zero-width match (e.g. regex /(?:)/ or /a*/), last_end == m.end() and does not advance. The exec layer does advance past the position, so find_iter itself does not loop forever. However, if the regex matches the empty string at every position in a large input, every character of the input is iterated and the replacement closure is called len+1 times, each time for an empty match. This is expected behaviour for zero-width regexes, but there is no warning to users that replace_all on a zero-width-matching regex is O(n) with potentially surprising output.","fix":"Add a note to the doc comments of replace_all and replace_all_with explaining the behaviour with zero-width-matching regexes.","locations":[{"ref":"src/api.rs:636-648","code":"  636 |     pub fn replace_all(&self, text: &str, replacement: &str) -> String {\n  637 |         let mut result = String::with_capacity(text.len());\n  638 |         let mut last_end = 0;\n  639 | \n  640 |         for m in self.find_iter(text) {\n  641 |             result.push_str(&text[last_end..m.start()]);\n  642 |             self.expand_replacement(&m, text, replacement, &mut result);\n  643 |             last_end = m.end();\n  644 |         }\n  645 | \n  646 |         result.push_str(&text[last_end..]);\n  647 |         result\n  648 |     }","lines":13,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L636-L648"},{"ref":"src/api.rs:704-719","code":"  704 |     pub fn replace_all_with<F>(&self, text: &str, replacement: F) -> String\n  705 |     where\n  706 |         F: Fn(&Match) -> String,\n  707 |     {\n  708 |         let mut result = String::with_capacity(text.len());\n  709 |         let mut last_end = 0;\n  710 | \n  711 |         for m in self.find_iter(text) {\n  712 |             result.push_str(&text[last_end..m.start()]);\n  713 |             result.push_str(&replacement(&m));\n  714 |             last_end = m.end();\n  715 |         }\n  716 | \n  717 |         result.push_str(&text[last_end..]);\n  718 |         result\n  719 |     }","lines":16,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L704-L719"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The unsafe `set_len(len - 1)` in `pop_backtrack` skips calling `drop` on the removed element. While this is technically sound today because all `BacktrackInsn` variants contain only `Copy` types (no heap allocations, no destructors), it creates a maintenance hazard: if any future variant adds a field with a `Drop` implementation (e.g. a `Vec` or `Box`), the memory will silently leak without triggering a compiler error. The safe alternative `self.bts.pop()` would have identical performance for `Copy` types since LLVM elides the no-op drop.","fix":"Replace the unsafe block with `self.bts.pop();`. The performance difference is negligible for Copy types; LLVM optimises both paths identically.","locations":[{"ref":"src/classicalbacktrack.rs:125-133","code":"  125 |     fn pop_backtrack(&mut self) {\n  126 |         // Note we never pop the last instruction so this will never be empty.\n  127 |         debug_assert!(!self.bts.is_empty());\n  128 |         if cfg!(feature = \"prohibit-unsafe\") {\n  129 |             self.bts.pop();\n  130 |         } else {\n  131 |             unsafe { self.bts.set_len(self.bts.len() - 1) }\n  132 |         }\n  133 |     }","lines":9,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/classicalbacktrack.rs#L125-L133"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`CodePointSet::intersect()` uses an O(n*m) double loop over `intervals` (parameter) and `self.intervals()`. Because both slices are sorted and disjoint, a merge-style two-pointer scan would achieve O(n+m) by advancing whichever pointer is behind. The current approach becomes slow when both sets have many intervals.","fix":"Replace the nested loops with a two-pointer merge scan: maintain one index into `intervals` and one into `self.ivs`, advance the one with the smaller `last`, and emit intersections on overlap. This is the same pattern used by `remove()`.","locations":[{"ref":"src/codepointset.rs:316-329","code":"  316 |     pub(crate) fn intersect(&mut self, intervals: &[Interval]) {\n  317 |         let mut new_ivs = Vec::new();\n  318 |         for iv in intervals {\n  319 |             for self_iv in self.intervals() {\n  320 |                 if iv.overlaps(*self_iv) {\n  321 |                     new_ivs.push(Interval {\n  322 |                         first: cmp::max(iv.first, self_iv.first),\n  323 |                         last: cmp::min(iv.last, self_iv.last),\n  324 |                     });\n  325 |                 }\n  326 |             }\n  327 |         }\n  328 |         self.ivs = new_ivs;\n  329 |     }","lines":14,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/codepointset.rs#L316-L329"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `ClassSetAlternativeStrings::intersect` (line 247-249) and `remove` (line 251-253), the `other` slice is searched linearly via `other.contains(string)` for every retained string. Both methods are called in loops inside `intersect_operand` and `subtract_operand`. For large sets this is O(n*m). In practice, class set sizes are small, but for deeply nested intersection/subtraction expressions this could be slow.","fix":"Consider sorting the alternatives or using a HashSet for O(n+m) intersection/removal when the sets are large.","locations":[{"ref":"src/parse.rs:248-250","code":"  248 |     fn intersect(&mut self, other: &[Box<[CodePoint]>]) {\n  249 |         self.0.retain(|string| other.contains(string));\n  250 |     }","lines":3,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/parse.rs#L248-L250"},{"ref":"src/parse.rs:252-254","code":"  252 |     fn remove(&mut self, other: &[Box<[CodePoint]>]) {\n  253 |         self.0.retain(|string| !other.contains(string));\n  254 |     }","lines":3,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/parse.rs#L252-L254"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`unfold_interval()` in `unicode.rs` performs a full linear scan over all entries in the `FOLDS` table on every call (lines 244-273). In contrast, `fold_interval()` uses a binary-search range (`equal_range_by`) to find only the overlapping fold entries. Because `add_icase_code_points()` calls `unfold_interval()` once per interval in the folded set, the total cost is O(K * |FOLDS|) where K is the number of intervals, while `fold_interval` is O(K * log(|FOLDS|) + matches). For large character sets this can be significantly slower than necessary.","fix":"Build an inverse index from transformed-to intervals to fold-range indices at startup (or as a static table), or at minimum use `equal_range_by` on the `transformed_to()` intervals (sort FOLDS by their destination range first). This would let `unfold_interval` skip most of the table.","locations":[{"ref":"src/unicode.rs:241-274","code":"  241 | fn unfold_interval(iv: Interval, recv: &mut CodePointSet) {\n  242 |     // Note: We still need to check all ranges because the relationship between\n  243 |     // transformed_from and transformed_to intervals can be complex\n  244 |     for tr in FOLDS.iter() {\n  245 |         if !iv.overlaps(tr.transformed_to()) {\n  246 |             continue;\n  247 |         }\n  248 | \n  249 |         let modulo = tr.predicate_mask() + 1;\n  250 |         let first_source = tr.first();\n  251 |         let last_source = tr.last();\n  252 | \n  253 |         let mut process_cp = |cp| {\n  254 |             let tcp = tr.apply(cp);\n  255 |             if tcp != cp && iv.contains(tcp) {\n  256 |                 recv.add_one(cp);\n  257 |             }\n  258 |         };\n  259 | \n  260 |         if modulo == 1 {\n  261 |             // Optimization: when modulo is 1, every character in range gets transformed\n  262 |             for cp in first_source..(last_source + 1) {\n  263 |                 process_cp(cp);\n  264 |             }\n  265 |         } else {\n  266 |             // Walk by modulo amount instead of checking every character\n  267 |             let mut cp = first_source;\n  268 |             while cp <= last_source {\n  269 |                 process_cp(cp);\n  270 |                 cp += modulo;\n  271 |             }\n  272 |         }\n  273 |     }\n  274 | }","lines":34,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/unicode.rs#L241-L274"},{"ref":"src/unicode.rs:338-350","code":"  338 | pub fn add_icase_code_points(mut input: CodePointSet) -> CodePointSet {\n  339 |     let mut folded = input.clone();\n  340 |     for iv in input.intervals() {\n  341 |         fold_interval(*iv, &mut folded)\n  342 |     }\n  343 | \n  344 |     // Reuse input storage.\n  345 |     input.clone_from(&folded);\n  346 |     for iv in folded.intervals() {\n  347 |         unfold_interval(*iv, &mut input);\n  348 |     }\n  349 |     input\n  350 | }","lines":13,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/unicode.rs#L338-L350"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"DeltaBlock::can_append has a first branch 'if self.folds.is_empty() { return true; }'. DeltaBlock can only be created via DeltaBlock::create(), which always inserts one element into folds. There is no public or private constructor that creates an empty DeltaBlock, so self.folds.is_empty() is always false and this branch is unreachable dead code.","fix":"Remove the dead branch. If future empty-block construction is desired, add a constructor and revisit the logic then.","locations":[{"ref":"gen-unicode/src/main.rs:235-238","code":"  235 |     pub(crate) fn can_append(&self, fp: FoldPair) -> bool {\n  236 |         if self.folds.is_empty() {\n  237 |             // New block.\n  238 |             true","lines":4,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/gen-unicode/src/main.rs#L235-L238"}]},

{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment for assigned_ranges() says 'Return the code point ranges of the \\'ANY\\' Unicode property.' but the function actually returns the ranges for the 'Assigned' property. This copy-paste error is misleading.","fix":"Change the doc string to 'Return the code point ranges of the \\'Assigned\\' Unicode property.'","locations":[{"ref":"gen-unicode/src/binary_properties.rs:118","code":"  118 |             .doc(\"Return the code point ranges of the 'ANY' Unicode property.\");","lines":1,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/gen-unicode/src/binary_properties.rs#L118"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Flags::new doc comment says \"'i' means to ignore case, 'm' means multiline, 'u' means unicode\" and then \"Other flags are not implemented and are ignored.\" Both claims are wrong: the 's' (dot_all) and 'v' (unicode_sets) flags ARE implemented and recognised in the same function. The comment has not been updated to reflect added flags.","fix":"Update the doc comment to list all recognised flags: 'i' (icase), 'm' (multiline), 's' (dot_all), 'u' (unicode), 'v' (unicode_sets). Remove the claim that other flags are ignored.","locations":[{"ref":"src/api.rs:59-61","code":"   59 |     /// Construct a Flags from a Unicode codepoints iterator, using JavaScript field names.\n   60 |     /// 'i' means to ignore case, 'm' means multiline, 'u' means unicode.\n   61 |     /// Note the 'g' flag implies a stateful regex and is not supported.","lines":3,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L59-L61"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment for Regex::with_flags has a stray `//` (non-doc comment) instead of `///` on the blank line between the first sentence and the subsequent note. This causes the second paragraph to be disconnected from the doc comment and invisible to rustdoc.","fix":"Change the bare `//` on line 396 to `///` to keep the paragraph part of the doc comment.","locations":[{"ref":"src/api.rs:416-417","code":"  416 |     //\n  417 |     /// Note it is preferable to cache a Regex which is intended to be used more","lines":2,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L416-L417"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `charclasses.rs`, the comment above the first WHITESPACE interval lists U+0009 (TAB), U+000B (VT), and U+000C (FF), but silently omits U+000A (LINE FEED). The range `r('\\u{0009}', '\\u{000C}')` covers all four code points including LF. LF is a LineTerminator in the ES spec (not a WhiteSpace), so including it in an array named WHITESPACE is misleading. The behavioral impact is minimal because `parse.rs` adds the full LINE_TERMINATOR set on top for `\\s`, making LF presence in WHITESPACE redundant rather than incorrect, but the documentation is wrong.","fix":"Either split the range into two non-overlapping intervals (`r('\\u{0009}', '\\u{0009}')` and `r('\\u{000B}', '\\u{000C}')`), or add U+000A to the comment. Also update the comment to not claim this matches ES12 12.2 WhiteSpace exactly.","locations":[{"ref":"src/charclasses.rs:33-38","code":"   33 |     // U+0009 - Character Tabulation - <TAB>\n   34 |     // U+000B - Line Tabulation      - <VT>\n   35 |     // U+000C - Form Feed (FF)       - <FF>\n   36 |     r('\\u{0009}', '\\u{000C}'),\n   37 |     // From unicode “Space_Separator” (`Zs`) category:\n   38 |     //","lines":6,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/charclasses.rs#L33-L38"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment at line 26 in `codepointset.rs` reads \"A list of sorted, inclusive, non-empty ranges of code points.\" It is placed directly above `impl Interval` and describes a *list* of Intervals (the invariant of `CodePointSet`), not the `Interval` type or its methods. The misplacement means it appears as documentation for the impl block, not where it belongs.","fix":"Move the comment to be a doc comment on `CodePointSet` (above the struct definition at line 110-113), or rewrite it to describe what `Interval` actually is.","locations":[{"ref":"src/codepointset.rs:26-27","code":"   26 | /// A list of sorted, inclusive, non-empty ranges of code points.\n   27 | impl Interval {","lines":2,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/codepointset.rs#L26-L27"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The trait method comments on `next_right_pos` and `next_left_pos` (lines 84 and 87) say 'does not decode the element', but the `Utf16Input` implementations of both methods DO inspect code units to detect surrogate pairs and advance or retreat by two code units when a surrogate pair is found. The comment is accurate only for the `AsciiInput` and `Ucs2Input` implementations.","fix":"Change the comments to 'returns the next position without returning the decoded element value' or similar wording that does not imply the underlying code units are unread.","locations":[{"ref":"src/indexing.rs:84-88","code":"   84 |     // Like next_right, but does not decode the element.\n   85 |     fn next_right_pos(&self, pos: Self::Position) -> Option<Self::Position>;\n   86 | \n   87 |     // Like next_left, but does not decode the element.\n   88 |     fn next_left_pos(&self, pos: Self::Position) -> Option<Self::Position>;","lines":5,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/indexing.rs#L84-L88"},{"ref":"src/indexing.rs:973-1022","code":"  973 |     fn next_right_pos(&self, mut pos: Self::Position) -> Option<Self::Position> {\n  974 |         let u1 = self.input.get(self.pos_to_offset(pos)).copied()?;\n  975 |         pos += 1;\n  976 | \n  977 |         // If the code unit is not a high surrogate, it is not the start of a surrogate pair.\n  978 |         if !Self::is_high_surrogate(u1) {\n  979 |             return Some(pos);\n  980 |         }\n  981 | \n  982 |         let Some(u2) = self.input.get(self.pos_to_offset(pos)).copied() else {\n  983 |             return Some(pos);\n  984 |         };\n  985 | \n  986 |         // If the code unit is not a low surrogate, it is not a surrogate pair.\n  987 |         if !Self::is_low_surrogate(u2) {\n  988 |             return Some(pos);\n  989 |         }\n  990 | \n  991 |         pos += 1;\n  992 | \n  993 |         Some(pos)\n  994 |     }\n  995 | \n  996 |     #[inline(always)]\n  997 |     fn next_left_pos(&self, mut pos: Self::Position) -> Option<Self::Position> {\n  998 |         let left_end = self.left_end();\n  999 |         if pos == left_end {\n 1000 |             return None;\n 1001 |         }\n 1002 | \n 1003 |         let u2 = self.input.get(self.pos_to_offset(pos - 1)).copied()?;\n 1004 |         pos -= 1;\n 1005 | \n 1006 |         // If the code unit is not a low surrogate, it is not the end of a surrogate pair.\n 1007 |         if pos == left_end || !Self::is_low_surrogate(u2) {\n 1008 |             return Some(pos);\n 1009 |         }\n 1010 | \n 1011 |         let Some(u1) = self.input.get(self.pos_to_offset(pos - 1)).copied() else {\n 1012 |             return Some(pos);\n 1013 |         };\n 1014 | \n 1015 |         // If the code unit is not a high surrogate, it is not a surrogate pair.\n 1016 |         if !Self::is_high_surrogate(u1) {\n 1017 |             return Some(pos);\n 1018 |         }\n 1019 | \n 1020 |         pos -= 1;\n 1021 |         Some(pos)\n 1022 |     }","lines":50,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/indexing.rs#L973-L1022"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc-comment for `Insn::MatchAny` reads \"Match any character **except** a line terminator; emitted by '.' only when the dot_all flag is set to true.\" This is the exact opposite of correct: `MatchAny` is emitted when `dot_all` is set and it matches ALL characters including line terminators. The 'except' phrasing describes `MatchAnyExceptLineTerminator`.","fix":"Change the comment to: \"Match any character including line terminators; emitted by '.' when the dot_all flag is set to true.\"","locations":[{"ref":"src/insn.rs:50-51","code":"   50 |     /// Match any character except a line terminator; emitted by '.' only when\n   51 |     /// the dot_all flag is set to true.","lines":2,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/insn.rs#L50-L51"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment in `Walk` struct reads \"It set to true, skip the children of this node.\" - \"It\" should be \"If\".","fix":"Change \"It set to true\" to \"If set to true\".","locations":[{"ref":"src/ir.rs:277","code":"  277 |     // It set to true, skip the children of this node.","lines":1,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/ir.rs#L277"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc-comment for `walk_mut` says \"If postorder is false, the function should return true to process children, false to avoid descending into children.\" The actual callback signature is `FnMut(&mut Node, &mut Walk)` - it returns nothing. Skipping children is controlled by setting `walk.skip_children = true` inside the callback. The comment describes a stale/wrong API.","fix":"Replace lines 451-453 with: \"If postorder is false, set `walk.skip_children = true` inside the callback to skip descending into children.\"","locations":[{"ref":"src/ir.rs:461-463","code":"  461 | /// If postorder is false, the function should return true to process children,\n  462 | /// false to avoid descending into children. If postorder is true, the return\n  463 | /// value is ignored.","lines":3,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/ir.rs#L461-L463"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The top-level crate doc in `lib.rs` lists \"Unicode property escapes like `\\p{Sc}`\" as a feature that has \"yet to be implemented\". In reality, unicode property escapes are fully implemented: `src/unicode.rs` exports `unicode_property_from_str`, `unicode_property_name_from_str`, and `PropertyEscapeKind`, and `src/parse.rs` consumes them. The stale documentation will mislead users into thinking `\\p{...}` patterns are unsupported.","fix":"Remove the \"Unicode property escapes\" bullet from the \"yet to be implemented\" list, or replace it with a note about what IS actually unsupported (e.g. POSIX named classes `[[:alpha:]]`).","locations":[{"ref":"src/lib.rs:81-84","code":"   81 | There are some features which have yet to be implemented:\n   82 | \n   83 | - Named character classes liks `[[:alpha:]]`\n   84 | - Unicode property escapes like `\\p{Sc}`","lines":4,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/lib.rs#L81-L84"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The inline comment on promote_1char_loops (optimizer.rs line 393) reads \"This feels hackish?\" - this is stale developer uncertainty left in production code.","fix":"Remove or replace with a concise explanation of why a swap is necessary here (to move the boxed node out of the mutable borrow).","locations":[{"ref":"src/optimizer.rs:369","code":"  369 |             let mut new_loopee = Box::new(Node::Empty);","lines":1,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/optimizer.rs#L369"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"In `position.rs`, `RefPosition::sub(self, rhs: usize)` has a `debug_assert!(self.ptr() as usize >= rhs, \"Underflow\")`. This compares a raw virtual memory address (potentially gigabytes) to a byte offset `rhs` which is at most a few million. The assertion will never fire in any realistic scenario, providing no meaningful protection against subtracting past the start of the underlying slice.","fix":"Remove the misleading assert, or store a reference to the slice start and check `self.ptr() >= slice_start.ptr() + rhs`. Since `RefPosition` has no access to the base pointer, the simplest fix is to remove the assert and document that callers are responsible for bounds safety.","locations":[{"ref":"src/position.rs:167-170","code":"  167 |     fn sub(self, rhs: usize) -> Self::Output {\n  168 |         debug_assert!(self.ptr() as usize >= rhs, \"Underflow\");\n  169 |         Self::new(unsafe { self.ptr().sub(rhs) })\n  170 |     }","lines":4,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/position.rs#L167-L170"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The bodies of `subrange_eq` and `match_bytes` are copy-pasted verbatim between `Utf8Input` and `AsciiInput`. The two implementations are identical in structure, differing only in the type they operate on. Both repeat the same conditional-compilation blocks (`#[cfg(any(feature = \"index-positions\", ...))]`) for the safe and unsafe paths, making future changes error-prone (a bug fix must be applied in two places).","fix":"Extract a free function (e.g. `compare_byte_ranges`) that accepts two raw byte slices or two position/length pairs and performs the comparison, then call it from both `Utf8Input` and `AsciiInput` implementations.","locations":[{"ref":"src/indexing.rs:490-533","code":"  490 |     fn subrange_eq<Dir: Direction>(\n  491 |         &self,\n  492 |         _dir: Dir,\n  493 |         pos: &mut Self::Position,\n  494 |         range: Range<Self::Position>,\n  495 |     ) -> bool {\n  496 |         let len = range.end - range.start;\n  497 |         let (start, end) = if Dir::FORWARD {\n  498 |             if let Some(end) = self.try_move_right(*pos, len) {\n  499 |                 let start = *pos;\n  500 |                 *pos = end;\n  501 |                 (start, end)\n  502 |             } else {\n  503 |                 return false;\n  504 |             }\n  505 |         } else if let Some(start) = self.try_move_left(*pos, len) {\n  506 |             let end = *pos;\n  507 |             *pos = start;\n  508 |             (start, end)\n  509 |         } else {\n  510 |             return false;\n  511 |         };\n  512 | \n  513 |         #[cfg(any(feature = \"index-positions\", feature = \"prohibit-unsafe\"))]\n  514 |         let new_range = &self.contents()[core::ops::Range {\n  515 |             start: self.pos_to_offset(start),\n  516 |             end: self.pos_to_offset(end),\n  517 |         }];\n  518 | \n  519 | {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"The `no_opt` flag in `Flags` is the only mechanism that makes PikeVM safe to use, but this dependency is entirely implicit. The public API offers both `PikeVMExecutor` and an optimizer that emits instructions the PikeVM does not implement (`Loop1CharBody`). There is no compile-time or runtime check that prevents running an optimized regex through the PikeVM. Users who construct a `Regex` with default flags (optimization enabled) and then execute it with `PikeVMExecutor` will get a panic on any pattern with a quantifier over a single-char atom.","fix":"Either (a) split compilation into separate pipelines for each backend so the PikeVM never receives `Loop1CharBody`, or (b) add a runtime check on `Regex` construction that validates the compiled bytecode is compatible with the intended executor, returning an error if incompatible instructions are present.","locations":[{"ref":"src/api.rs:439-440","code":"  439 |         if !flags.no_opt {\n  440 |             optimizer::optimize(&mut ire);","lines":2,"link":"https://github.com/ridiculousfish/regress/blob/a4c1b839f5e54bb0c8fab6a0b2e314fdf26ac552/src/api.rs#L439-L440"}]}
