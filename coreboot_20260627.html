,"type_label":"Logic Error","severity":"low","easy":false,"description":"In mouse.c mouse_state(), mouse_buf_idx is a module-level variable but mouse_sample() calls insert_buf() and mouse_decode(), which can leave mouse_buf_idx at an intermediate count between calls. If mouse_state() is called while a partial packet is being assembled (e.g., only 2 bytes of a 3-byte packet arrived), the x_axis and y_axis reported will be stale or zero even though data has arrived. This is expected for streaming protocols, but the zero-and-reset of x_axis/y_axis on every call to mouse_state() means partial data that hasn't been decoded yet is effectively discarded from the accumulator perspective. This is a design-level issue rather than a crash bug.","fix":"Document that get_state() may return 0 for axes even when bytes are in-flight. Consider returning a 'data_ready' flag or only resetting accumulators when a full packet was decoded.","locations":[{"ref":"payloads/libpayload/drivers/i8042/mouse.c:189-210","code":"  189 | static void mouse_state(int *x, int *y, int *z, u32 *b)\n  190 | {\n  191 | \tif (!initialized)\n  192 | \t\treturn;\n  193 | \n  194 | \tmouse_sample();\n  195 | \n  196 | \tif (x) {\n  197 | \t\t*x = x_axis;\n  198 | \t\tx_axis = 0;\n  199 | \t}\n  200 | \tif (y) {\n  201 | \t\t*y = y_axis;\n  202 | \t\ty_axis = 0;\n  203 | \t}\n  204 | \tif (z) {\n  205 | \t\t*z = z_axis;\n  206 | \t\tz_axis = 0;\n  207 | \t}\n  208 | \tif (b)\n  209 | \t\t*b = buttons;\n  210 | }","lines":22,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/mouse.c#L189-L210"}]},{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In mouse_cursor.c mouse_cusor_is_fast() (line 77), the function name has a typo: 'cusor' instead of 'cursor'. This is a cosmetic issue but affects API clarity.","fix":"Rename to mouse_cursor_is_fast().","locations":[{"ref":"payloads/libpayload/drivers/mouse_cursor.c:76-79","code":"   76 | static u8 mouse_cusor_is_fast(int x, int y)\n   77 | {\n   78 | \treturn (x * x + y * y) > (mouse_acceleration * mouse_acceleration);\n   79 | }","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/mouse_cursor.c#L76-L79"}]},{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"pci_ops.c pci_read_resource() takes an int bar parameter with no bounds check. A negative bar or bar > 5 results in an out-of-range config space offset (0x10 + bar*4), which for a negative bar would access vendor/device ID registers, and for large bar values would access beyond the 256-byte standard config space.","fix":"Add a bounds check: if (bar < 0 || bar > 5) return 0xFFFFFFFF; before the config read.","locations":[{"ref":"payloads/libpayload/drivers/pci_ops.c:83-85","code":"   83 | u32 pci_read_resource(pcidev_t dev, int bar)\n   84 | {\n   85 | \treturn pci_read_config32(dev, 0x10 + (bar * 4));","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/pci_ops.c#L83-L85"}]},{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In serial/8250.c, serial_putchar() busy-waits on the TX empty bit (bit 5 of LSR) with no timeout (line 150), and serial_getchar() busy-waits for data ready with no timeout (line 168). If the UART is locked up or misconfigured, both functions spin forever, hanging the payload with no way to recover.","fix":"Add a retry counter or a time-based deadline to both loops. On timeout, serial_putchar can silently drop the character, and serial_getchar can return -1 to indicate no data.","locations":[{"ref":"payloads/libpayload/drivers/serial/8250.c:150","code":"  150 | \twhile ((serial_read_reg(0x05) & 0x20) == 0) ;","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/serial/8250.c#L150"},{"ref":"payloads/libpayload/drivers/serial/8250.c:168","code":"  168 | \twhile (!serial_havechar()) ;","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/serial/8250.c#L168"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","easy":true,"description":"In apic.c, apic_set_task_priority() reads the TPR register, correctly clears the priority field bits and ORs in the new priority into the local variable tpr, but then writes the raw priority byte directly instead of the modified tpr value. The read-modify-write to preserve upper bits is therefore useless, and the written value always has the upper bits cleared.","fix":"Change apic_write32(APIC_TASK_PRIORITY, priority) to apic_write32(APIC_TASK_PRIORITY, tpr) to use the value computed on the lines above.","locations":[{"ref":"payloads/libpayload/arch/x86/apic.c:226-235","code":"  226 | static void apic_set_task_priority(uint8_t priority)\n  227 | {\n  228 | \tdie_if(!apic_bar, \"APIC is not initialized\");\n  229 | \n  230 | \tuint32_t tpr = apic_read32(APIC_TASK_PRIORITY);\n  231 | \ttpr &= ~APIC_TASK_PRIORITY_MASK;\n  232 | \ttpr |= priority;\n  233 | \n  234 | \tapic_write32(APIC_TASK_PRIORITY, priority);\n  235 | }","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/apic.c#L226-L235"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":true,"description":"Multiple PDC_LOG messages in addstr.c report wrong function names due to copy-paste. mvaddwstr() at line 200 logs 'mvaddstr() - called' instead of 'mvaddwstr() - called'. mvaddnwstr() at line 210 logs 'mvaddnstr() - called' instead of 'mvaddnwstr() - called'. mvwaddwstr() at line 220 logs 'mvwaddstr() - called' and mvwaddnwstr() at line 230 logs 'mvwaddnstr() - called' -- these should log their own wide-character function names.","fix":"Update each PDC_LOG string to use the actual function name being called.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addstr.c:200","code":"  200 |     PDC_LOG((\"mvaddstr() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addstr.c#L200"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addstr.c:210","code":"  210 |     PDC_LOG((\"mvaddnstr() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addstr.c#L210"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addstr.c:220","code":"  220 |     PDC_LOG((\"mvwaddstr() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addstr.c#L220"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addstr.c:230","code":"  230 |     PDC_LOG((\"mvwaddnstr() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addstr.c#L230"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"In demos/worm.c, the outer `ref` pointer array is allocated with malloc() at line 249 but the\nreturn value is never checked for NULL. If the allocation fails, the immediately following\n`ref[y] = malloc(...)` loop dereferences a NULL pointer, causing a crash. The inner\nrow allocations (ref[y]) are also unchecked. Additionally during KEY_RESIZE handling (line 341),\n`realloc(ref, ...)` is assigned directly back to `ref` without a NULL check; a failed realloc\nreturns NULL, destroying the only pointer to all existing row buffers and leaking them.","fix":"Check the return values of malloc() and realloc() and handle failures gracefully. For realloc(), save the return value to a temporary pointer before assigning to ref to avoid losing the original pointer on failure.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/worm.c:249-257","code":"  249 |     ref = malloc(sizeof(short *) * LINES);\n  250 | \n  251 |     for (y = 0; y < LINES; y++)\n  252 |     {\n  253 |         ref[y] = malloc(sizeof(short) * COLS);\n  254 | \n  255 |         for (x = 0; x < COLS; x++)\n  256 |             ref[y][x] = 0;\n  257 |     }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/worm.c#L249-L257"},{"ref":"payloads/libpayload/curses/PDCurses/demos/worm.c:325-352","code":"  325 |                     for (y = 0; y <= bottom; y++)\n  326 |                     {\n  327 |                         ref[y] = realloc(ref[y], sizeof(short) * COLS);\n  328 | \n  329 |                         for (x = last + 1; x < COLS; x++)\n  330 |                             ref[y][x] = 0;\n  331 |                     }\n  332 | \n  333 |                     last = COLS - 1;\n  334 |                 }\n  335 | \n  336 |                 if (bottom != LINES - 1)\n  337 |                 {\n  338 |                     for (y = LINES; y <= bottom; y++)\n  339 |                         free(ref[y]);\n  340 | \n  341 |                     ref = realloc(ref, sizeof(short *) * LINES);\n  342 | \n  343 |                     for (y = bottom + 1; y < LINES; y++)\n  344 |                     {\n  345 |                         ref[y] = malloc(sizeof(short) * COLS);\n  346 | \n  347 |                         for (x = 0; x < COLS; x++)\n  348 |                             ref[y][x] = 0;\n  349 |                     }\n  350 | \n  351 |                     bottom = LINES - 1;\n  352 |                 }","lines":28,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/worm.c#L325-L352"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"In doc/manext.c main(), `argv[1]` is dereferenced via strcmp() at line 52 before checking\nwhether argc > 1. When the program is invoked with no arguments (argc == 1), argv[1] is NULL,\nand passing NULL to strcmp() is undefined behavior (typically a segfault). The program has no\nusage message path that can be triggered safely without at least one argument.","fix":"Add `if (argc < 2) { display_info(); exit(1); }` before the strcmp call, or change the check to `if (argc > 1 && strcmp(argv[1], \"-h\") == 0)`.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/doc/manext.c:52-55","code":"   52 |     if (strcmp(argv[1], \"-h\") == 0)\n   53 |     {\n   54 |         display_info();\n   55 |         exit(1);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/doc/manext.c#L52-L55"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":true,"description":"In win32/pdcgetsc.c all three functions (PDC_get_cursor_mode, PDC_get_rows,\nPDC_get_buffer_rows, PDC_get_columns) call the Win32 API (GetConsoleCursorInfo,\nGetConsoleScreenBufferInfo) but completely ignore the BOOL return value. A failure leaves the\nlocal struct uninitialised, so the function returns garbage. Callers then use these values to\nsize the terminal, which can corrupt internal state or trigger out-of-bounds accesses.","fix":"Check the return value of each Win32 call; on failure return -1 (or ERR) and\nlet callers propagate the error rather than proceeding with an uninitialised struct.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcgetsc.c:9-57","code":"    9 | int PDC_get_cursor_mode(void)\n   10 | {\n   11 |     CONSOLE_CURSOR_INFO ci;\n   12 | \n   13 |     PDC_LOG((\"PDC_get_cursor_mode() - called\\n\"));\n   14 | \n   15 |     GetConsoleCursorInfo(pdc_con_out, &ci);\n   16 | \n   17 |     return ci.dwSize;\n   18 | }\n   19 | \n   20 | /* return number of screen rows */\n   21 | \n   22 | int PDC_get_rows(void)\n   23 | {\n   24 |     CONSOLE_SCREEN_BUFFER_INFO scr;\n   25 | \n   26 |     PDC_LOG((\"PDC_get_rows() - called\\n\"));\n   27 | \n   28 |     GetConsoleScreenBufferInfo(pdc_con_out, &scr);\n   29 | \n   30 |     return scr.srWindow.Bottom - scr.srWindow.Top + 1;\n   31 | }\n   32 | \n   33 | /* return number of buffer rows */\n   34 | \n   35 | int PDC_get_buffer_rows(void)\n   36 | {\n   37 |     CONSOLE_SCREEN_BUFFER_INFO scr;\n   38 | \n   39 |     PDC_LOG((\"PDC_get_buffer_rows() - called\\n\"));\n   40 | \n   41 |     GetConsoleScreenBufferInfo(pdc_con_out, &scr);\n   42 | \n   43 |     return scr.dwSize.Y;\n   44 | }\n   45 | \n   46 | /* return width of screen/viewport */\n   47 | \n   48 | int PDC_get_columns(void)\n   49 | {\n   50 |     CONSOLE_SCREEN_BUFFER_INFO scr;\n   51 | \n   52 |     PDC_LOG((\"PDC_get_columns() - called\\n\"));\n   53 | \n   54 |     GetConsoleScreenBufferInfo(pdc_con_out, &scr);\n   55 | \n   56 |     return scr.srWindow.Right - scr.srWindow.Left + 1;\n   57 | }","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcgetsc.c#L9-L57"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"In set_option_from_string() case 'h', malloc(sizeof(u64)) result is not checked for NULL before immediately dereferencing it with *(u64*)raw = strtoull(...). Only case 's' has a NULL check. If malloc returns NULL (impossible in libpayload's default allocator but still undefined behavior), this faults.","fix":"Add a null check after malloc for case 'h': if (!raw) return 1;","locations":[{"ref":"payloads/libpayload/drivers/options.c:358-360","code":"  358 | \t\t\traw = malloc(sizeof(u64));\n  359 | \t\t\t*(u64*)raw = strtoull(value, NULL, 0);\n  360 | \t\t\tbreak;","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L358-L360"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In win32/pdcclip.c PDC_clearclipboard() calls EmptyClipboard() at line 142\nwithout first calling OpenClipboard(). EmptyClipboard() requires the clipboard to be open and\nowned by the calling window; calling it without OpenClipboard() will fail silently on Windows,\nleaving the clipboard contents intact while returning PDC_CLIP_SUCCESS.","fix":"Wrap EmptyClipboard() with OpenClipboard(NULL)/CloseClipboard(), checking the\nreturn value of OpenClipboard and returning PDC_CLIP_ACCESS_ERROR on failure.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcclip.c:138-145","code":"  138 | int PDC_clearclipboard(void)\n  139 | {\n  140 |     PDC_LOG((\"PDC_clearclipboard() - called\\n\"));\n  141 | \n  142 |     EmptyClipboard();\n  143 | \n  144 |     return PDC_CLIP_SUCCESS;\n  145 | }","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcclip.c#L138-L145"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"set_form_fields (frm_def.c) calls Disconnect_Fields then on failure calls Connect_Fields(form, old) to restore the previous field array. However, Connect_Fields can itself fail (e.g. E_SYSTEM_ERROR from malloc), and that failure is silently ignored. The form ends up with a NULL field array (from Disconnect_Fields) rather than the restored old array, leaving it in a broken half-disconnected state while the function has already returned the original error code.","fix":"Check the return value of the fallback Connect_Fields call and handle failure, e.g. by logging or returning a combined error. At minimum, document that the form may be left with no fields after a failed set_form_fields.","locations":[{"ref":"payloads/libpayload/curses/form/frm_def.c:408-413","code":"  408 |   old = form->field;\n  409 |   Disconnect_Fields(form);\n  410 | \n  411 |   if ((res = Associate_Fields(form, fields)) != E_OK)\n  412 |     Connect_Fields(form, old);\n  413 | ","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L408-L413"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"rtc_read_clock() and rtc_write_clock() return void, so when the nvram_updating() timeout fires after 10001 iterations, the caller receives no indication of failure. rtc_read_clock() returns with time partially zeroed (only memset was done), giving the caller a struct tm with year=0, month=0, etc. that looks valid.","fix":"Change the return type to int and return a nonzero error code on timeout, or at minimum document that callers must check some out-of-range field to detect the timeout case.","locations":[{"ref":"payloads/libpayload/drivers/nvram.c:111-121","code":"  111 | void rtc_read_clock(struct tm *time)\n  112 | {\n  113 | \tu16 timeout = 10000;\n  114 | \tu8 statusB;\n  115 | \tu8 reg8;\n  116 | \n  117 | \tmemset(time, 0, sizeof(*time));\n  118 | \n  119 | \twhile (nvram_updating())\n  120 | \t\tif (!timeout--)\n  121 | \t\t\treturn;","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/nvram.c#L111-L121"},{"ref":"payloads/libpayload/drivers/nvram.c:169-177","code":"  169 | void rtc_write_clock(const struct tm *time)\n  170 | {\n  171 | \tu16 timeout = 10000;\n  172 | \tu8 statusB;\n  173 | \tu8 reg8, year;\n  174 | \n  175 | \twhile (nvram_updating())\n  176 | \t\tif (!timeout--)\n  177 | \t\t\treturn;","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/nvram.c#L169-L177"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","easy":false,"description":"In win32/pdcclip.c PDC_setclipboard(), after SetClipboardData() succeeds the\ncode calls GlobalFree(ptr1) at line 125. This is wrong: once SetClipboardData() succeeds,\nownership of the memory transfers to the system clipboard; the application must NOT free it.\nFreeing it here results in a use-after-free whenever the system or another application later\nreads the clipboard data.","fix":"Remove the `GlobalFree(ptr1);` call after the successful SetClipboardData path\n(line 125). Only free ptr1 in the failure branch (already done at line 120).","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcclip.c:118-127","code":"  118 |     if (!SetClipboardData(PDC_TEXT, ptr1))\n  119 |     {\n  120 |         GlobalFree(ptr1);\n  121 |         return PDC_CLIP_ACCESS_ERROR;\n  122 |     }\n  123 | \n  124 |     CloseClipboard();\n  125 |     GlobalFree(ptr1);\n  126 | \n  127 |     return PDC_CLIP_SUCCESS;","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcclip.c#L118-L127"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":false,"description":"In os2/pdcclip.c, PDC_setclipboard() and PDC_clearclipboard() do not call WinCreateMsgQueue()\nafter WinInitialize(), unlike PDC_getclipboard() which does. On OS/2, clipboard operations\nthrough the WinPM API require a message queue to be associated with the calling thread. Without\none, WinOpenClipbrd() and clipboard operations may fail or behave unpredictably. Only\nPDC_getclipboard creates and destroys a message queue (lines 63 and 92 respectively);\nthe other two functions skip this step.","fix":"Add `HMQ hmq = WinCreateMsgQueue(hab, 0);` after WinInitialize() in both PDC_setclipboard and PDC_clearclipboard, and add `WinDestroyMsgQueue(hmq);` before WinTerminate().","locations":[{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcclip.c:101-149","code":"  101 | int PDC_setclipboard(const char *contents, long length)\n  102 | {\n  103 | #ifndef EMXVIDEO\n  104 |     HAB hab;\n  105 |     PTIB ptib;\n  106 |     PPIB ppib;\n  107 |     ULONG ulRC;\n  108 |     PSZ szTextOut = NULL;\n  109 |     int rc;\n  110 | #endif\n  111 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n  112 | \n  113 | #ifndef EMXVIDEO\n  114 |     DosGetInfoBlocks(&ptib, &ppib);\n  115 |     ppib->pib_ultype = 3;\n  116 |     hab = WinInitialize(0);\n  117 | \n  118 |     if (!WinOpenClipbrd(hab))\n  119 |     {\n  120 |         WinTerminate(hab);\n  121 |         return PDC_CLIP_ACCESS_ERROR;\n  122 |     }\n  123 | \n  124 |     rc = PDC_CLIP_MEMORY_ERROR;\n  125 | \n  126 |     ulRC = DosAllocSharedMem((PVOID)&szTextOut, NULL, length + 1,\n  127 |                              PAG_WRITE | PAG_COMMIT | OBJ_GIVEABLE);\n  128 | \n  129 |     if (ulRC == 0)\n  130 |     {\n  131 |         strcpy(szTextOut, contents);\n  132 |         WinEmptyClipbrd(hab);\n  133 | \n  134 |         if (WinSetClipbrdData(hab, (ULONG)szTextOut, CF_TEXT, CFI_POINTER))\n  135 |             rc = PDC_CLIP_SUCCESS;\n  136 |         else\n  137 |         {\n  138 |             DosFreeMem(szTextOut);\n  139 |             rc = PDC_CLIP_ACCESS_ERROR;\n  140 |         }\n  141 |     }\n  142 | \n  143 |     WinCloseClipbrd(hab);\n  144 |     WinTerminate(hab);\n  145 | \n  146 |     return rc;\n  147 | #else\n  148 |     return PDC_CLIP_ACCESS_ERROR;\n  149 | #endif","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcclip.c#L101-L149"},{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcclip.c:162-185","code":"  162 | int PDC_clearclipboard(void)\n  163 | {\n  164 | #ifndef EMXVIDEO\n  165 |     HAB hab;\n  166 |     PTIB ptib;\n  167 |     PPIB ppib;\n  168 | #endif\n  169 |     PDC_LOG((\"PDC_clearclipboard() - called\\n\"));\n  170 | \n  171 | #ifndef EMXVIDEO\n  172 |     DosGetInfoBlocks(&ptib, &ppib);\n  173 |     ppib->pib_ultype = 3;\n  174 |     hab = WinInitialize(0);\n  175 | \n  176 |     WinEmptyClipbrd(hab);\n  177 | \n  178 |     WinCloseClipbrd(hab);\n  179 |     WinTerminate(hab);\n  180 | \n  181 |     return PDC_CLIP_SUCCESS;\n  182 | #else\n  183 |     return PDC_CLIP_ACCESS_ERROR;\n  184 | #endif\n  185 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcclip.c#L162-L185"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"The `FreeAndNull` macro in curses.priv.h (line 848) is defined as:\n  #define FreeAndNull(p)   free(p); p = 0\nThis is two semicolon-separated statements without a `do{}while(0)` wrapper.\nUsing it in a single-branch `if` or `else` without braces will only apply the\n`free(p)` to the conditional branch while `p = 0` executes unconditionally,\ncreating a use-after-free if the pointer is later accessed after an apparent\n\"not-freed\" path.","fix":"Wrap the macro body in `do { free(p); (p) = 0; } while (0)` to make it safe in all contexts.","locations":[{"ref":"payloads/libpayload/curses/curses.priv.h:848","code":"  848 | #define FreeAndNull(p)   free(p); p = 0","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/curses.priv.h#L848"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"In sha1.c SHA1Pad(), the padding loop calls SHA1Update() one byte at a time (with a single '\\0' byte) until the bit count reaches 448 mod 512. This can call SHA1Update up to 63 times individually rather than building the padding in a single buffer and calling it once. For a hash-heavy boot environment this is needlessly slow.","fix":"Pre-build a zero-padding buffer of the required size and pass it to SHA1Update in a single call.","locations":[{"ref":"payloads/libpayload/crypto/sha1.c:169-172","code":"  169 | \tSHA1Update(context, (u_int8_t *)\"\\200\", 1);\n  170 | \twhile ((context->count & 504) != 448)\n  171 | \t\tSHA1Update(context, (u_int8_t *)\"\\0\", 1);\n  172 | \tSHA1Update(context, finalcount, 8); /* Should cause a SHA1Transform() */","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/crypto/sha1.c#L169-L172"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","easy":false,"description":"APIC_SPURIOUS is defined twice in apic.c (lines 54 and 57) with the same value 0x0F0. The second definition is a redundant leftover, likely from a copy-paste between the register offset block and the bit-field block. Modern compilers emit a macro redefinition warning.","fix":"Remove the duplicate #define APIC_SPURIOUS 0x0F0 on line 57.","locations":[{"ref":"payloads/libpayload/arch/x86/apic.c:54-57","code":"   54 | #define APIC_SPURIOUS\t\t\t0x0F0\n   55 | #define   APIC_SW_ENABLED_BIT\t\t(1 << 8)\n   56 | #define   APIC_SPURIOUS_VECTOR_MASK\t0xFFUL\n   57 | #define APIC_SPURIOUS\t\t\t0x0F0","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/apic.c#L54-L57"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","easy":false,"description":"In demos/xmas.c reindeer(), the check `if (x_pos < 62) y_pos = 1;` at line 821 is inside a\n`for (x_pos = 70; x_pos > 62; x_pos--)` loop. Because the loop condition is `x_pos > 62`,\nx_pos is never less than 62 inside the loop body. The condition is always false and the\ny_pos assignment never executes.","fix":"Remove the dead `if (x_pos < 62) y_pos = 1;` check, or adjust the loop bounds if the intent was to handle x_pos reaching values below 62.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/xmas.c:819-822","code":"  819 |     for (x_pos = 70; x_pos > 62; x_pos--)\n  820 |     {\n  821 |         if (x_pos < 62)\n  822 |             y_pos = 1;","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/xmas.c#L819-L822"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"PDC_restore_screen_mode() and PDC_save_screen_mode() in sdl1/pdcscrn.c\n(lines 247-253) have empty bodies. They accept an int parameter that is never used. These are\neffectively no-ops and serve no function in the SDL backend.","fix":"No fix needed for functionality; consider adding a (void)i; to silence compiler warnings about unused parameters.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c:247-253","code":"  247 | void PDC_restore_screen_mode(int i)\n  248 | {\n  249 | }\n  250 | \n  251 | void PDC_save_screen_mode(int i)\n  252 | {\n  253 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L247-L253"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"PDC_beep() in sdl1/pdcutil.c (lines 7-10) does nothing except log. The SDL\nbackend provides no actual audio beep functionality, making the function a silent no-op for the\nentire SDL port.","fix":"Document that the SDL backend has no beep support, or implement SDL_mixer beep.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcutil.c:7-10","code":"    7 | void PDC_beep(void)\n    8 | {\n    9 |     PDC_LOG((\"PDC_beep() - called\\n\"));\n   10 | }","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcutil.c#L7-L10"}]},{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"In set_form_opts, form_opts_on, and form_opts_off the pattern 'opts &= ALL_FORM_OPTS; if (opts & ~ALL_FORM_OPTS)' is used to validate the option bits. After ANDing with ALL_FORM_OPTS, the expression 'opts & ~ALL_FORM_OPTS' is always zero because all bits outside ALL_FORM_OPTS have already been cleared. The E_BAD_ARGUMENT branch is therefore unreachable dead code. The validation never fires regardless of what the caller passes.","fix":"To actually catch invalid option bits, check before masking: 'if (opts & ~ALL_FORM_OPTS) RETURN(E_BAD_ARGUMENT);' then apply the mask, or drop the mask entirely and just validate.","locations":[{"ref":"payloads/libpayload/curses/form/frm_opts.c:52-54","code":"   52 |   opts &= ALL_FORM_OPTS;\n   53 |   if (opts & ~ALL_FORM_OPTS)\n   54 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_opts.c#L52-L54"},{"ref":"payloads/libpayload/curses/form/frm_opts.c:92-94","code":"   92 |   opts &= ALL_FORM_OPTS;\n   93 |   if (opts & ~ALL_FORM_OPTS)\n   94 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_opts.c#L92-L94"},{"ref":"payloads/libpayload/curses/form/frm_opts.c:117-119","code":"  117 |   opts &= ALL_FORM_OPTS;\n  118 |   if (opts & ~ALL_FORM_OPTS)\n  119 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_opts.c#L117-L119"}]},{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"In set_item_opts (m_item_opt.c), 'opts &= ALL_ITEM_OPTS' is applied at line 58,\nmasking all bits not in ALL_ITEM_OPTS. The immediately following check\n'if (opts & ~ALL_ITEM_OPTS)' at line 60 can therefore never be true - after the\nmask operation, opts cannot have any bits outside ALL_ITEM_OPTS. The E_BAD_ARGUMENT\nbranch is unreachable dead code.","fix":"Either remove the mask-then-check pattern and validate before masking:\n  if (opts & ~ALL_ITEM_OPTS)\n    RETURN(E_BAD_ARGUMENT);\n  opts &= ALL_ITEM_OPTS;\nOr remove the dead check entirely if the mask is the intended behavior.","locations":[{"ref":"payloads/libpayload/curses/menu/m_item_opt.c:58-62","code":"   58 |   opts &= ALL_ITEM_OPTS;\n   59 | \n   60 |   if (opts & ~ALL_ITEM_OPTS)\n   61 |     RETURN(E_BAD_ARGUMENT);\n   62 | ","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_item_opt.c#L58-L62"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","easy":false,"description":"In tinycurses.c, delwin() is a stub that always returns OK without freeing anything (lines 220-232). window_list, ldat_list, and linebuf_list are statically allocated and window_count/ldat_count/linebuf_count never decrease. This means after unpost_menu() deletes sub and win windows, those allocation slots are permanently consumed. With MAX_WINDOWS=3 and the menu library creating 2 windows per post_menu() call, a second post_menu() call after unpost_menu() will fail to allocate windows.","fix":"Implement delwin() to decrement window_count and return the slot, or use a free-list pattern to recycle window slots.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:220-232","code":"  220 | int delwin(WINDOW *win)\n  221 | {\n  222 | \t/* TODO: Don't try to delete stdscr. */\n  223 | \t/* TODO: Don't delete parent windows before subwindows. */\n  224 | \n  225 | \t// if (win->_flags & _SUBWIN)\n  226 | \t// \ttouchwin(win->_parent);\n  227 | \t// else if (curscr != 0)\n  228 | \t// \ttouchwin(curscr);\n  229 | \n  230 | \t// return _nc_freewin(win);\n  231 | \treturn OK;\n  232 | }","lines":13,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L220-L232"}]},{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","easy":false,"description":"In tinycurses.c, wattr_on() and wattr_off() both have their core logic commented out (lines 574 and 581: `toggle_attr_on`/`toggle_attr_off`). Only the color-pair side effect is implemented. The functions return OK but do not actually apply bold, underline, or reverse attributes to the window's attr field (WINDOW_ATTRS), causing wattron()/wattroff() calls from the menu library (m_post.c) to be no-ops for attributes other than color. This means items in the menu will not display foreground/background/grey attribute differences on the tinycurses backend.","fix":"Implement toggle_attr_on/toggle_attr_off: `WINDOW_ATTRS(win) |= at;` in wattr_on and `WINDOW_ATTRS(win) &= ~at;` in wattr_off, guarding color separately.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:570-583","code":"  570 | int wattr_on(WINDOW *win, attr_t at, void *opts GCC_UNUSED)\n  571 | {\n  572 | \tif (at & A_COLOR)\n  573 | \t\twin->_color = PAIR_NUMBER(at);\n  574 | \t// toggle_attr_on(WINDOW_ATTRS(win), at);\n  575 | \treturn OK;\n  576 | }\n  577 | int wattr_off(WINDOW *win, attr_t at, void *opts GCC_UNUSED)\n  578 | {\n  579 | \tif (at & A_COLOR)\n  580 | \t\twin->_color = 0;\n  581 | \t// toggle_attr_off(WINDOW_ATTRS(win), at);\n  582 | \treturn 0;\n  583 | }","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L570-L583"}]},{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","easy":false,"description":"In pci_qcom.c the macro lower_32_bits and upper_32_bits (lines 32-33) are local redefinitions that shadow any globally-defined versions. These could cause silent behavior divergence if the global definitions change. Furthermore, upper_32_bits uses the double-shift idiom ((n >> 16) >> 16) to avoid undefined behavior with shift-by-32 on 32-bit types, but since n is always uint64_t at the call sites, a plain (u32)((n) >> 32) would be clearer and equally correct.","fix":"Remove the local macro definitions and include or use whatever header already defines these macros project-wide, to avoid duplicate definitions.","locations":[{"ref":"payloads/libpayload/drivers/pci_qcom.c:32-33","code":"   32 | #define lower_32_bits(n)\t\t((u32)(n))\n   33 | #define upper_32_bits(n)\t\t((u32)(((n) >> 16) >> 16))","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/pci_qcom.c#L32-L33"}]},{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","easy":false,"description":"In virtual.c, the file defines only getpagesize() returning 4096 and the virtual_offset global. The function is the standard POSIX getpagesize() but libpayload targets bare metal where no virtual-memory page size concept applies. The stub is inert but may mislead callers into thinking paging is configured.","fix":"Consider marking the function with a comment explaining it is a stub for compatibility, or adding a static_assert / build-time check that it is only referenced where appropriate.","locations":[{"ref":"payloads/libpayload/arch/x86/virtual.c:33-36","code":"   33 | int getpagesize(void)\n   34 | {\n   35 | \treturn 4096;\n   36 | }","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/virtual.c#L33-L36"}]},{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","easy":true,"description":"dupwin() in window.c assigns 'new->_flags = win->_flags' twice (lines 408 and 421) with no other code between that could modify _flags. The second assignment is dead code.","fix":"Remove the duplicate assignment at line 421.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/window.c:408-421","code":"  408 |     new->_flags = win->_flags;\n  409 |     new->_attrs = win->_attrs;\n  410 |     new->_clear = win->_clear;\n  411 |     new->_leaveit = win->_leaveit;\n  412 |     new->_scroll = win->_scroll;\n  413 |     new->_nodelay = win->_nodelay;\n  414 |     new->_use_keypad = win->_use_keypad;\n  415 |     new->_tmarg = win->_tmarg;\n  416 |     new->_bmarg = win->_bmarg;\n  417 |     new->_parx = win->_parx;\n  418 |     new->_pary = win->_pary;\n  419 |     new->_parent = win->_parent;\n  420 |     new->_bkgd = win->_bkgd;\n  421 |     new->_flags = win->_flags;","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/window.c#L408-L421"}]},{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","easy":false,"description":"`f_trace.c` provides five tracing wrappers (`_nc_retrace_field_ptr`,\n`_nc_retrace_field`, `_nc_retrace_field_type`, `_nc_retrace_form`,\n`_nc_retrace_form_hook`) that are guarded by `#ifdef TRACE` at their\ncall sites (via the `returnField`, `returnForm`, etc. macros in form.priv.h\nlines 219-229). When compiled without TRACE, the call-site macros expand to\nplain `return code` and these five functions are never called. The translation\nunit itself is always compiled, producing five unreferenced symbols that bloat\nthe object file and confuse linkers that warn about unused functions.","fix":"Wrap the entire file body (or each function individually) with `#ifdef TRACE ... #endif` to match the conditional use at call sites.","locations":[{"ref":"payloads/libpayload/curses/form/f_trace.c:37-70","code":"   37 | NCURSES_EXPORT(FIELD **)\n   38 | _nc_retrace_field_ptr(FIELD **code)\n   39 | {\n   40 |   T((T_RETURN(\"%p\"), (void *)code));\n   41 |   return code;\n   42 | }\n   43 | \n   44 | NCURSES_EXPORT(FIELD *)\n   45 | _nc_retrace_field(FIELD *code)\n   46 | {\n   47 |   T((T_RETURN(\"%p\"), (void *)code));\n   48 |   return code;\n   49 | }\n   50 | \n   51 | NCURSES_EXPORT(FIELDTYPE *)\n   52 | _nc_retrace_field_type(FIELDTYPE *code)\n   53 | {\n   54 |   T((T_RETURN(\"%p\"), (void *)code));\n   55 |   return code;\n   56 | }\n   57 | \n   58 | NCURSES_EXPORT(FORM *)\n   59 | _nc_retrace_form(FORM *code)\n   60 | {\n   61 |   T((T_RETURN(\"%p\"), (void *)code));\n   62 |   return code;\n   63 | }\n   64 | \n   65 | NCURSES_EXPORT(Form_Hook)\n   66 | _nc_retrace_form_hook(Form_Hook code)\n   67 | {\n   68 |   T((T_RETURN(\"%p\"), code));\n   69 |   return code;\n   70 | }","lines":34,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/f_trace.c#L37-L70"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"In attr.c, the PDC_LOG call inside wattr_on() (line 260) logs 'wattr_off() - called' instead of 'wattr_on() - called'. This is a copy-paste error in the debug message only.","fix":"Change the string from '\"wattr_off() - called\\n\"' to '\"wattr_on() - called\\n\"'.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/attr.c:260","code":"  260 |     PDC_LOG((\"wattr_off() - called\\n\"));","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/attr.c#L260"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"In attr.c, the PDC_LOG call inside attr_set() (line 286) logs 'attr_get() - called' instead of 'attr_set() - called'. This is a copy-paste error in the <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible','info'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const HAS_EASY = FINDINGS.some(f => f.easy);
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(), easyOnly: false,
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.easyOnly)          p.set('e',   '1');
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('e'))   S.easyOnly = p.get('e') === '1';
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      const easyStr = f.easy ? ' ⚡ easy' : '';
      out += '### ' + f.id + sevStr + easyStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    const easyStr = f.easy ? ' ⚡' : '';
    lines.push('- [ ] - ' + f.id + sevStr + easyStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.easy) lns.push(pad('easy') + '= true');
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + (f.easy ? ' ⚡ easy' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.easy ? 'easy quick win' : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.easyOnly && !f.easy)                   return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.easy ? '<span class="badge easy-badge" style="cursor:default" title="Easy to verify &amp; fix - no deep knowledge of the code, SDK or technology required">\u26a1 Easy</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_EASY)
    h += '<div class="filter-row"><span class="filter-lbl">Quick wins:</span>'
       + '<button class="badge easy-badge" data-easy="1">\u26a1 Easy only</button></div>';

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-easy]'))   b.classList.toggle('off', !S.easyOnly);
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Event delegation
document.getElementById('filterbar').addEventListener('click', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-easy]');
  if (!b) return;
  if (b.dataset.easy) {
    S.easyOnly = !S.easyOnly;
  }
  else if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES    : STATUSES;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
