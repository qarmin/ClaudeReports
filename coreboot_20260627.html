 PDC_get_columns() in sdl1/pdcgetsc.c divide by pdc_fheight\nand pdc_fwidth respectively (lines 22, 31). These are set in PDC_scr_open() from the font surface\ndimensions. If the font surface dimensions are not multiples of 8 (fheight) or 32 (fwidth) the\nfont character cells will be zero-sized (pdc_fheight = font->h / 8, pdc_fwidth = font->w / 32).\nA zero divisor causes a division-by-zero crash. The same issue applies to PDC_gotoyx and\nPDC_transform_line which use these values in arithmetic.","fix":"After computing pdc_fheight and pdc_fwidth (pdcscrn.c lines 123-124), assert or\ncheck that both are > 0 and return ERR if not, to prevent later division-by-zero crashes.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcgetsc.c:18-32","code":"   18 | int PDC_get_rows(void)\n   19 | {\n   20 |     PDC_LOG((\"PDC_get_rows() - called\\n\"));\n   21 | \n   22 |     return pdc_sheight / pdc_fheight;\n   23 | }\n   24 | \n   25 | /* return width of screen/viewport */\n   26 | \n   27 | int PDC_get_columns(void)\n   28 | {\n   29 |     PDC_LOG((\"PDC_get_columns() - called\\n\"));\n   30 | \n   31 |     return pdc_swidth / pdc_fwidth;\n   32 | }","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcgetsc.c#L18-L32"},{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c:123-124","code":"  123 |     pdc_fheight = pdc_font->h / 8;\n  124 |     pdc_fwidth = pdc_font->w / 32;","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L123-L124"}]},{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"free_form calls Disconnect_Fields(form) which already frees form->page (frm_def.c:138-140) and sets it to NULL. Immediately after, free_form checks 'if (form->page) free(form->page)' - which is unreachable because Disconnect_Fields just set it to NULL. The check is dead code, but it is misleading because if the NULL assignment inside Disconnect_Fields were ever removed the code would double-free.","fix":"Remove the redundant 'if (form->page) free(form->page);' block in free_form (lines 375-376). Disconnect_Fields already owns the page lifetime.","locations":[{"ref":"payloads/libpayload/curses/form/frm_def.c:374-377","code":"  374 |   Disconnect_Fields(form);\n  375 |   if (form->page)\n  376 |     free(form->page);\n  377 |   free(form);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L374-L377"},{"ref":"payloads/libpayload/curses/form/frm_def.c:138-140","code":"  138 |       if (form->page)\n  139 | \tfree(form->page);\n  140 |       form->page = (_PAGE *) 0;","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L138-L140"}]},{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"FE_Delete_Previous uses field->cols instead of field->dcols when deciding whether the current line's content fits on the previous line after a merge (line 2762-2763: 'field->cols - (int)(prev_end - prev_line)'). For dynamically grown fields where dcols > cols, this underestimates available space and may incorrectly deny a valid delete-previous operation, causing a confusing E_REQUEST_DENIED to the user.","fix":"Change 'field->cols - (int)(prev_end - prev_line)' to 'field->dcols - (int)(prev_end - prev_line)' to correctly account for the actual dynamic column width.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:2762-2764","code":" 2762 |       if ((int)(this_end - this_line) >\n 2763 | \t  (field->cols - (int)(prev_end - prev_line)))\n 2764 | \treturnCode(E_REQUEST_DENIED);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L2762-L2764"}]},{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In frm_req_name.c, form_request_by_name uses strncpy(buf, str, sizeof(buf)) where\nbuf is 16 bytes. If 'str' is 16 or more characters long, strncpy does NOT append a\nnull terminator, leaving buf unterminated. The subsequent toupper loop correctly\nstops at sizeof(buf) iterations and does not overrun the buffer, but the final\nstrncmp(request_names[i], buf, sizeof(buf)) compares 16 bytes of an unterminated\n'buf'. While this is technically bounded by sizeof(buf), a string of exactly 16\ncharacters would incorrectly match a request name that shares the first 16 bytes,\neven if they differ after that. More importantly, any string >= 16 chars loses\nits suffix silently without the caller being notified.","fix":"Force null termination after strncpy:\n  strncpy(buf, str, sizeof(buf) - 1);\n  buf[sizeof(buf) - 1] = '\\0';\nThis ensures buf is always null-terminated before the loop and strncmp.","locations":[{"ref":"payloads/libpayload/curses/form/frm_req_name.c:147-165","code":"  147 |   unsigned int i = 0;\n  148 |   char buf[16];\n  149 | \n  150 |   T((T_CALLED(\"form_request_by_name(%s)\"), _nc_visbuf(str)));\n  151 | \n  152 |   if (str)\n  153 |     {\n  154 |       strncpy(buf, str, sizeof(buf));\n  155 |       while ((i < sizeof(buf)) && (buf[i] != '\\0'))\n  156 | \t{\n  157 | \t  buf[i] = (char)toupper(UChar(buf[i]));\n  158 | \t  i++;\n  159 | \t}\n  160 | \n  161 |       for (i = 0; i < A_SIZE; i++)\n  162 | \t{\n  163 | \t  if (strncmp(request_names[i], buf, sizeof(buf)) == 0)\n  164 | \t    returnCode(MIN_FORM_COMMAND + (int)i);\n  165 | \t}","lines":19,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_req_name.c#L147-L165"}]},{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In m_opts.c set_menu_opts(), opts is masked with ALL_MENU_OPTS on line 60 before the dead-code guard on line 62. The check `opts & ~ALL_MENU_OPTS` always evaluates to 0/false because all unrecognized bits were already cleared by the mask on the previous line, so E_BAD_ARGUMENT is never returned for invalid option bits. The dead check provides false confidence about input validation.","fix":"Remove the masking on line 60 and let the check on line 62 fire first, then apply the mask only after validation: `if (opts & ~ALL_MENU_OPTS) RETURN(E_BAD_ARGUMENT); opts &= ALL_MENU_OPTS;`","locations":[{"ref":"payloads/libpayload/curses/menu/m_opts.c:60-63","code":"   60 |   opts &= ALL_MENU_OPTS;\n   61 | \n   62 |   if (opts & ~ALL_MENU_OPTS)\n   63 |     RETURN(E_BAD_ARGUMENT);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_opts.c#L60-L63"}]},{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In m_opts.c menu_opts_off() and menu_opts_on(), the same pre-masking-then-dead-check pattern is repeated (lines 124-126 and 157-159). The `opts & ~ALL_MENU_OPTS` test is always false after `opts &= ALL_MENU_OPTS`. This is the same issue as in set_menu_opts().","fix":"Validate before masking: check `opts & ~ALL_MENU_OPTS` first, return E_BAD_ARGUMENT if nonzero, then apply the mask.","locations":[{"ref":"payloads/libpayload/curses/menu/m_opts.c:124-126","code":"  124 |   opts &= ALL_MENU_OPTS;\n  125 |   if (opts & ~ALL_MENU_OPTS)\n  126 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_opts.c#L124-L126"},{"ref":"payloads/libpayload/curses/menu/m_opts.c:157-159","code":"  157 |   opts &= ALL_MENU_OPTS;\n  158 |   if (opts & ~ALL_MENU_OPTS)\n  159 |     RETURN(E_BAD_ARGUMENT);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_opts.c#L157-L159"}]},{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In pdcdisp.c PDC_transform_line(), the serial console path (lines 152-153) calls `serial_set_cursor(lineno, x)` with arguments (lineno=row, x=col) swapped compared to the expected (col, row) order used in PDC_gotoyx(). PDC_gotoyx() calls `serial_set_cursor(col, row)` with col first. The transform_line call passes row as first arg and col as second, which is reversed. This would position the serial cursor incorrectly at the start of each transformed line.","fix":"Change line 152 to `serial_set_cursor(x, lineno);` to match the (col, row) convention used by PDC_gotoyx().","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdcdisp.c:149-154","code":"  149 |     if (curses_flags & F_ENABLE_SERIAL) {\n  150 |         serial_end_bold();\n  151 |         serial_end_altcharset();\n  152 |         serial_set_cursor(lineno, x);\n  153 |     }\n  154 | #endif","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdcdisp.c#L149-L154"}]},{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In pdckbd.c handle_escape(), the escape sequence matching loop (lines 71-84) checks `if (t == len)` to declare a match, but this only confirms that all `len` characters of the buffer matched the first `len` characters of the escape code sequence. If a sequence in escape_codes[] is longer than `len` (i.e., `*p` is not '\\0' at position t), the loop breaks early and still declares a match, because the exit condition `t == len` fires before exhausting the pattern. This can cause partial matches: e.g., a 2-char buffer `[A` would match `[17~` at the 2-char prefix level if a code in the table had `[A` as a prefix of a longer sequence.","fix":"After the inner loop, also check that `*p == '\\0'` to confirm the full pattern was consumed: `if (t == len && *p == '\\0') return escape_codes[i].key;`","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdckbd.c:71-84","code":"   71 | \tfor(i = 0; escape_codes[i].seq != NULL; i++) {\n   72 | \t\tconst char *p = escape_codes[i].seq;\n   73 | \n   74 | \t\tfor(t = 0; t < len; t++) {\n   75 | \t\t\tif (!*p || *p != buffer[t])\n   76 | \t\t\t\tbreak;\n   77 | \t\t\tp++;\n   78 | \t\t}\n   79 | \n   80 | \t\tif (t == len)\n   81 | \t\t\treturn escape_codes[i].key;\n   82 | \t}\n   83 | \n   84 | \treturn 0;","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdckbd.c#L71-L84"}]},{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In pdcscrn.c PDC_init_pair(), the parameter `pair` is a `short` and is used as `pdc_atrtab[pair * PDC_OFFSET + i]` without bounds checking. If `pair` is negative or >= PDC_COLOR_PAIRS, this accesses pdc_atrtab out of bounds. pdc_atrtab is allocated as `PDC_COLOR_PAIRS * PDC_OFFSET` bytes but there is no validation of the pair argument.","fix":"Add `if (pair < 0 || pair >= PDC_COLOR_PAIRS) return;` at the start of PDC_init_pair().","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdcscrn.c:110-137","code":"  110 | void PDC_init_pair(short pair, short fg, short bg)\n  111 | {\n  112 |     unsigned char att, temp_bg;\n  113 |     chtype i;\n  114 | \n  115 |     fg = curstoreal[fg];\n  116 |     bg = curstoreal[bg];\n  117 | \n  118 |     for (i = 0; i < PDC_OFFSET; i++)\n  119 |     {\n  120 |         att = fg | (bg << 4);\n  121 | \n  122 |         if (i & (A_REVERSE >> PDC_ATTR_SHIFT))\n  123 |             att = bg | (fg << 4);\n  124 |         if (i & (A_UNDERLINE >> PDC_ATTR_SHIFT))\n  125 |             att = 1;\n  126 |         if (i & (A_INVIS >> PDC_ATTR_SHIFT))\n  127 |         {\n  128 |             temp_bg = att >> 4;\n  129 |             att = temp_bg << 4 | temp_bg;\n  130 |         }\n  131 |         if (i & (A_BOLD >> PDC_ATTR_SHIFT))\n  132 |             att |= 8;\n  133 |         if (i & (A_BLINK >> PDC_ATTR_SHIFT))\n  134 |             att |= 128;\n  135 | \n  136 |         pdc_atrtab[pair * PDC_OFFSET + i] = att;\n  137 |     }","lines":28,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdcscrn.c#L110-L137"}]},{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In pdcscrn.c PDC_pair_content(), the pair parameter is also unchecked, allowing out-of-bounds read from pdc_atrtab. Additionally, the return value of realtocurs[] indexing with `pdc_atrtab[...] & 0x0F` (or `>> 4`) is not bounds-checked before indexing realtocurs[16], which could be out of range if pdc_atrtab contains garbage from a failed or partial PDC_init_pair.","fix":"Validate pair in [0, PDC_COLOR_PAIRS) and validate the nibble values in [0, 15] before indexing realtocurs.","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdcscrn.c:140-146","code":"  140 | int PDC_pair_content(short pair, short *fg, short *bg)\n  141 | {\n  142 |     *fg = realtocurs[pdc_atrtab[pair * PDC_OFFSET] & 0x0F];\n  143 |     *bg = realtocurs[(pdc_atrtab[pair * PDC_OFFSET] & 0xF0) >> 4];\n  144 | \n  145 |     return OK;\n  146 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdcscrn.c#L140-L146"}]},{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In tinycurses.c wrefresh(), the function returns early on line 904 (`return wnoutrefresh(win);`) leaving all the code below (lines 907-927) unreachable dead code. The dead block references `curscr`, `newscr`, and `doupdate()` (commented out), and contains a `code` variable used without initialization in the surviving path after the goto. This is dead code that was never cleaned up and could mislead future maintainers.","fix":"Remove the dead code from line 907 to the end of wrefresh(), or if it is needed, remove the early return and implement doupdate() properly.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:902-927","code":"  902 | int wrefresh(WINDOW *win)\n  903 | {\n  904 | \t// FIXME\n  905 | \treturn wnoutrefresh(win);\n  906 | \n  907 | \t// XXX\n  908 | \tint code;\n  909 | \n  910 | \tif (win == curscr) {\n  911 | \t\tcurscr->_clear = TRUE;\n  912 | \t\t// code = doupdate();\n  913 | \t} else if ((code = wnoutrefresh(win)) == OK) {\n  914 | \t\tif (win->_clear)\n  915 | \t\t\tnewscr->_clear = TRUE;\n  916 | \t\t// code = doupdate();\n  917 | \t\t/*\n  918 | \t\t * Reset the clearok() flag in case it was set for the special\n  919 | \t\t * case in hardscroll.c (if we don't reset it here, we'll get 2\n  920 | \t\t * refreshes because the flag is copied from stdscr to newscr).\n  921 | \t\t * Resetting the flag shouldn't do any harm, anyway.\n  922 | \t\t */\n  923 | \t\twin->_clear = FALSE;\n  924 | \t}\n  925 | \n  926 | \treturn code;\n  927 | }","lines":26,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L902-L927"}]},{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In tinycurses.c wscrl(), when n is negative (scroll down), the loop `for (y = 0; y <= (win->_maxy - n); y++)` with negative n would compute `win->_maxy - n > win->_maxy`, causing the loop to iterate past win->_maxy and access win->_line[y] out of bounds. The function returns ERR early only if `!win->_scroll`, not if `n < 0`, so negative n values lead to out-of return OK;\n  975 | }","lines":47,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L929-L975"}]},{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In cbmem_console.c do_write(), the memcpy at line 52 writes `count` bytes starting at `cbmem_cons->body + (cbmem_cons->cursor & CURSOR_MASK)` without verifying that `(cbmem_cons->cursor & CURSOR_MASK) + count <= cbmem_cons->size`. cbmem_console_write() calls do_write only after verifying the condition, so in practice this is safe - but do_write itself has no safety check and could be misused if called directly. The bigger concern is that cbmem_console_write() calls do_write for the wrap-around partial write using `still_fits` as the count. If cbmem_cons->cursor has been corrupted externally (e.g., by coreboot writing to it simultaneously), still_fits could be > size, causing overflow.","fix":"Add an assert or clamp in do_write: `if ((cbmem_cons->cursor & CURSOR_MASK) + count > cbmem_cons->size) count = cbmem_cons->size - (cbmem_cons->cursor & CURSOR_MASK);`","locations":[{"ref":"payloads/libpayload/drivers/cbmem_console.c:48-54","code":"   48 | static void do_write(const void *buffer, size_t count)\n   49 | {\n   50 | \tstruct cbmem_console *const cbmem_cons = phys_to_virt(cbmem_console_p);\n   51 | \n   52 | \tmemcpy(cbmem_cons->body + (cbmem_cons->cursor & CURSOR_MASK), buffer, count);\n   53 | \tcbmem_cons->cursor += count;\n   54 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/cbmem_console.c#L48-L54"}]},{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In cbmem_console.c cbmem_console_snapshot(), the overflow path reads `console_p->body[oldc]` for oldc in [cursor, size). Then the non-overflow path reads `console_p->body[oldc]` for oldc in [0, cursor). But newc (the write cursor into console_c) accumulates bytes from both passes without checking that newc < size+1 before each `snapshot_putc` call. snapshot_putc writes `console[*cursor] = c` without checking if `*cursor < size`. With an overflow console, size bytes are read from the body but snapshot_putc could write newc up to size because some chars are filtered (markers and non-printable), meaning newc <= size. However, if no chars are filtered, newc reaches `size` and `console_c[newc] = '\\0'` on line 137 would write at exactly size, which is one past the valid allocation of size bytes (malloc(size+1) allocates size+1 bytes, so index `size` is valid). This is actually safe by the +1 allocation, but the logic is fragile.","fix":"Add a bounds check in snapshot_putc: `if (*cursor >= allocated_size) return;` to make it robust. Pass the allocation size as a parameter.","locations":[{"ref":"payloads/libpayload/drivers/cbmem_console.c:100-139","code":"  100 | char *cbmem_console_snapshot(void)\n  101 | {\n  102 | \tconst struct cbmem_console *const console_p = phys_to_virt(cbmem_console_p);\n  103 | \tchar *console_c;\n  104 | \tuint32_t size, cursor, overflow, newc, oldc;\n  105 | \n  106 | \tif (!console_p) {\n  107 | \t\tprintf(\"ERROR: No cbmem console found in coreboot table\\n\");\n  108 | \t\treturn NULL;\n  109 | \t}\n  110 | \n  111 | \tcursor = console_p->cursor & CURSOR_MASK;\n  112 | \toverflow = console_p->cursor & OVERFLOW;\n  113 | \tif (!overflow && cursor < console_p->size)\n  114 | \t\tsize = cursor;\n  115 | \telse\n  116 | \t\tsize = console_p->size;\n  117 | \n  118 | \tconsole_c = malloc(size + 1);\n  119 | \tif (!console_c) {\n  120 | \t\tprintf(\"ERROR: Not enough memory for console (size = %u)\\n\",\n  121 | \t\t       size);\n  122 | \t\treturn NULL;\n  123 | \t}\n  124 | \n  125 | \tnewc = 0;\n  126 | \tif (overflow) {\n  127 | \t\tif (cursor >= size) {\n  128 | \t\t\tprintf(\"ERROR: CBMEM console struct is corrupted\\n\");\n  129 | \t\t\tfree(console_c);\n  130 | \t\t\treturn NULL;\n  131 | \t\t}\n  132 | \t\tfor (oldc = cursor; oldc < size; oldc++)\n  133 | \t\t\tsnapshot_putc(console_c, &newc, console_p->body[oldc]);\n  134 | \t}\n  135 | \tfor (oldc = 0; oldc < size && oldc < cursor; oldc++)\n  136 | \t\tsnapshot_putc(console_c, &newc, console_p->body[oldc]);\n  137 | \tconsole_c[newc] = '\\0';\n  138 | \n  139 | \treturn console_c;","lines":40,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/cbmem_console.c#L100-L139"}]},{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In i8042.c fifo_push(), when the FIFO is full (tx wraps around to equal rx), rx is incremented to drop the oldest byte. But the increment is done as `fifo->rx++` before modulo, and the modulo is applied after: `fifo->rx = fifo->rx % fifo->len`. This is correct for the modulo, but if fifo->len is 0 (e.g., from a failed initialization that somehow let buf=NULL and len=0 slip through), this is a division-by-zero. fifo_init prevents len=0 only implicitly through malloc behavior.","fix":"Assert or check fifo->len > 0 in fifo_push, or guard fifo_init against len=0.","locations":[{"ref":"payloads/libpayload/drivers/i8042/i8042.c:77-83","code":"   77 | static void fifo_push(struct fifo *fifo, u8 c)\n   78 | {\n   79 | \tfifo->buf[fifo->tx++] = c;\n   80 | \tfifo->tx = fifo->tx % fifo->len;\n   81 | \tif (fifo->tx == fifo->rx)\n   82 | \t\tfifo->rx++;\n   83 | \tfifo->rx = fifo->rx % fifo->len;","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/i8042.c#L77-L83"}]},{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In i8042.c i8042_cmd_with_data(), after calling i8042_write_data(data) on line 348, the return value is `ret` from the earlier i8042_cmd() call (line 351: `return ret`), not the result of i8042_write_data. i8042_write_data itself returns void and cannot signal failure. If the data write times out (i8042_wait_cmd_rdy fails inside i8042_write_data), the caller receives E_OK (ret=0) falsely indicating success. This is particularly harmful in i8042_set_kbd_translation() which trusts this return value.","fix":"Change i8042_write_data() to return int indicating success/failure, check it in i8042_cmd_with_data(), and propagate the error.","locations":[{"ref":"payloads/libpayload/drivers/i8042/i8042.c:342-351","code":"  342 | static int i8042_cmd_with_data(const u8 cmd, const u8 data)\n  343 | {\n  344 | \tconst int ret = i8042_cmd(cmd);\n  345 | \tif (ret != 0)\n  346 | \t\treturn ret;\n  347 | \n  348 | \ti8042_write_data(data);\n  349 | \n  350 | \treturn ret;\n  351 | }","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/i8042.c#L342-L351"}]},{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In i8042.c i8042_data_poll(), the status byte `c` is read once before the loop, then rechecked inside the loop, but when the status is 0xFF it silently drops data and exits (line 364: `while ((c != 0xFF) && (c & OBF))`). If the controller is in a transient bad state and returns 0xFF once, the entire poll loop exits, possibly leaving valid data in the OBF from a prior read that has already been consumed. The OBF is checked on the stale `c` variable (which was updated by the previous iteration's `read_status()` on line 371), not a fresh read - actually line 371 does re-read status. The 0xFF exit is correct as a 'no controller' check but is also silently triggered by transient bus glitches, losing keyboard data.","fix":"Consider logging a warning on 0xFF status or treating it as 'no data' rather than a hard exit, to be resilient to transient bus glitches.","locations":[{"ref":"payloads/libpayload/drivers/i8042/i8042.c:356-373","code":"  356 | static void i8042_data_poll(void)\n  357 | {\n  358 | \tu8 c;\n  359 | \n  360 | \tif (!initialized)\n  361 | \t\treturn;\n  362 | \n  363 | \tc = read_status();\n  364 | \twhile ((c != 0xFF) && (c & OBF)) {\n  365 | \t\tconst u8 in = read_data();\n  366 | \t\t/* Assume \"second PS/2 port output buffer full\" flag works */\n  367 | \t\tstruct fifo *const fifo = (c & 0x20) ? aux_fifo : ps2_fifo;\n  368 | \t\tif (fifo)\n  369 | \t\t\tfifo_push(fifo, in);\n  370 | \n  371 | \t\tc = read_status();\n  372 | \t}\n  373 | }","lines":18,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/i8042.c#L356-L373"}]},{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In keyboard.c keyboard_getchar(), after the MEDIA_KEY_PREFIX special case, the check `if (!(ch & 0x80) && ch < 0x59)` gates the keyboard map lookup. For the MEDIA_KEY_PREFIX (0xE0) path, ch is first set to 0xE0 then overwritten by the second keyboard_get_scancode() result. If media_key_mapping_callback is NULL and the MEDIA_KEY_PREFIX path exits the if block, ch retains the value 0xE0 (break code = bit 7 set), so the check `ch & 0x80` is true and the scancode is silently dropped, returning 0. This means extended keys are silently ignored when the media callback is not installed, which is the intended fallback but may surprise callers expecting arrow-key codes.","fix":"Document or explicitly handle the case where no media_key_mapping_callback is installed and E0-prefixed keys are received; or implement basic E0 key translation inline.","locations":[{"ref":"payloads/libpayload/drivers/i8042/keyboard.c:558-591","code":"  558 | \tif ((media_key_mapping_callback != NULL) && (ch == MEDIA_KEY_PREFIX)) {\n  559 | \t\tch = keyboard_get_scancode();\n  560 | \t\treturn media_key_mapping_callback(ch);\n  561 | \t}\n  562 | \n  563 | \tif (!(ch & 0x80) && ch < 0x59) {\n  564 | \t\tshift =\n  565 | \t\t    (modifier & KB_MOD_SHIFT) ^ (modifier & KB_MOD_CAPSLOCK) ? 1 : 0;\n  566 | \n  567 | \t\tif (modifier & KB_MOD_ALT)\n  568 | \t\t\tshift += 2;\n  569 | \n  570 | \t\tret = map->map[shift][ch];\n  571 | \n  572 | \t\tif (modifier & KB_MOD_CTRL) {\n  573 | \t\t\tswitch (ret) {\n  574 | \t\t\tcase 'a' ... 'z':\n  575 | \t\t\t\tret &= 0x1f;\n  576 | \t\t\t\tbreak;\n  577 | \t\t\tcase KEY_DC:\n  578 | \t\t\t\t/* vulcan nerve pinch */\n  579 | \t\t\t\tif ((modifier & KB_MOD_ALT) && reset_handler)\n  580 | \t\t\t\t\treset_handler();\n  581 | \t\t\t\t__fallthrough;\n  582 | \t\t\tdefault:\n  583 | \t\t\t\tret = 0;\n  584 | \t\t\t}\n  585 | \t\t}\n  586 | \t}\n  587 | \n  588 | \tif (ch == 0x5e)\n  589 | \t\tret = POWER_BUTTON;\n  590 | \n  591 | \treturn ret;","lines":34,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/keyboard.c#L558-L591"}]},{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In keyboard.c keyboard_getchar(), when `ch == MEDIA_KEY_PREFIX (0xE0)`, keyboard_get_scancode() is called again to read the second byte and the result is passed to media_key_mapping_callback(). However, keyboard_get_scancode() itself processes modifier keys and updates the `modifier` variable. An E0-prefixed scancode (like extended arrow keys or numpad keys) will have its second byte processed as if it were a standalone scancode, potentially modifying the modifier state incorrectly (e.g., extended shift codes 0xE0 0x2A / 0xE0 0x36 would set KB_MOD_SHIFT). This is only a problem if media_key_mapping_callback is not set for such codes; if it is NULL the code falls through to the scancode table lookup.","fix":"The MEDIA_KEY_PREFIX path should call i8042_read_data_ps2() directly to get the raw second byte without passing through keyboard_get_scancode()'s modifier-state logic.","locations":[{"ref":"payloads/libpayload/drivers/i8042/keyboard.c:558-561","code":"  558 | \tif ((media_key_mapping_callback != NULL) && (ch == MEDIA_KEY_PREFIX)) {\n  559 | \t\tch = keyboard_get_scancode();\n  560 | \t\treturn media_key_mapping_callback(ch);\n  561 | \t}","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/keyboard.c#L558-L561"}]},{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In keyboard.c keyboard_set_layout(), the strncmp uses `strlen(keyboard_layouts[i].country)` as the comparison length. If the caller passes a longer string with the same prefix (e.g., 'usage'), it would match 'us'. This allows ambiguous or unintended layout selection. Comparing against the full string length of the input would be more correct.","fix":"Use `strcmp(keyboard_layouts[i].country, country) == 0` for an exact match, or use `strncmp` with the maximum of both string lengths.","locations":[{"ref":"payloads/libpayload/drivers/i8042/keyboard.c:604-607","code":"  604 | \tfor (i=0; i<ARRAY_SIZE(keyboard_layouts); i++) {\n  605 | \t\tif (strncmp(keyboard_layouts[i].country, country,\n  606 | \t\t\t\t\tstrlen(keyboard_layouts[i].country)))\n  607 | \t\t\tcontinue;","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/keyboard.c#L604-L607"}]},{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In mouse.c mouse_decode(), the z_axis calculation on lines 154 and 156 is `(mouse_buf[3] & 0x7) - (mouse_buf[3] & 0x08) ? 8 : 0`. Due to C operator precedence, this parses as `(mouse_buf[3] & 0x7) - ((mouse_buf[3] & 0x08) ? 8 : 0)`. When the sign bit (0x08) is set, the scroll delta should be negative (scroll up), yielding a value in range [0..7] - 8 = [-8..-1]. This is correct in intent, but the subtraction `(mouse_buf[3] & 0x7) - 8` when the lower nibble is 0 gives -8, and when it is 7 gives -1. However both is_intellimouse and is_explorer_intellimouse use identical code; this is actually correct behavior, but it is extremely confusing and hard to verify. More critically: if neither is_intellimouse nor is_explorer_intellimouse is set but mouse_buf_idx reaches 4 somehow, the 4th byte is never validated and the function falls through to the 3-byte path with idx < 3 check (which passes because idx == 4 >= 3), so it processes only 3 bytes while a 4th is sitting in the buffer unprocessed.","fix":"Add parentheses to the z_axis expression for clarity. For the 3-byte protocol case, enforce `mouse_buf_idx == 3` (not just >= 3) to avoid processing stale 4th bytes.","locations":[{"ref":"payloads/libpayload/drivers/i8042/mouse.c:125-161","code":"  125 | static void mouse_decode(void)\n  126 | {\n  127 | \t/* Buffer full check and sanity check */\n  128 | \tif (is_intellimouse) {\n  129 | \t\tif (mouse_buf_idx < 4)\n  130 | \t\t\treturn;\n  131 | \t\tif ((mouse_buf[3] & 0x10) != (mouse_buf[3] & 0x08)) {\n  132 | \t\t\tmouse_buf_idx = 0;\n  133 | \t\t\treturn;\n  134 | \t\t}\n  135 | \t} else if (is_explorer_intellimouse) {\n  136 | \t\tif (mouse_buf_idx < 4)\n  137 | \t\t\treturn;\n  138 | \t\tif (mouse_buf[3] & 0xc0) {\n  139 | \t\t\tmouse_buf_idx = 0;\n  140 | \t\t\treturn;\n  141 | \t\t}\n  142 | \t} else {\n  143 | \t\tif (mouse_buf_idx < 3)\n  144 | \t\t\treturn;\n  145 | \t}\n  146 | \n  147 | \t/* Common protocol */\n  148 | \tx_axis += mouse_buf[1] ? mouse_buf[1] - ((mouse_buf[0] << 4) & 0x100) : 0;\n  149 | \ty_axis += mouse_buf[2] ? ((mouse_buf[0] << 3) & 0x100) - mouse_buf[2] : 0;\n  150 | \tbuttons = mouse_buf[0] & 0x7;\n  151 | \n  152 | \t/* Extended protocol */\n  153 | \tif (is_intellimouse) {\n  154 | \t\tz_axis += (mouse_buf[3] & 0x7) - (mouse_buf[3] & 0x08) ? 8 : 0;\n  155 | \t} else if (is_explorer_intellimouse) {\n  156 | \t\tz_axis += (mouse_buf[3] & 0x7) - (mouse_buf[3] & 0x08) ? 8 : 0;\n  157 | \t\tbuttons = (mouse_buf[0] & 0x7) | (mouse_buf[3] & 0x30) >> 1;\n  158 | \t}\n  159 | \n  160 | \tmouse_buf_idx = 0;\n  161 | }","lines":37,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/mouse.c#L125-L161"}]},{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In nvram.c rtc_write_clock(), the 12-hour format encoding for midnight is wrong. The MC146818 datasheet specifies that in 12-hour mode, midnight is encoded as hour=12 with the PM bit (0x80) set. The write path (lines 191-194 and 205-209) uses (time->tm_hour > 12) as the condition to set the PM bit, so hour==0 (midnight) writes dec2bcd(0) or 0 with no PM flag. When read back by rtc_read_clock() (which correctly decodes MC146818 convention), midnight would be misinterpreted. The read path uses (reg8 & 0x80 ? +12 : 0) and % 24, so it correctly handles 12|0x80 = midnight, but the write does not produce that encoding.","fix":"For midnight (hour==0) in 12-hour mode, write 12 with the PM bit set. Change the condition to (time->tm_hour >= 12) and adjust the hour: int h12 = time->tm_hour % 12; if (h12 == 0) h12 = 12; reg8 = dec2bcd(h12) | (time->tm_hour >= 12 ? 0x80 : 0);","locations":[{"ref":"payloads/libpayload/drivers/nvram.c:190-197","code":"  190 | \t\tif (!(statusB & NVRAM_RTC_FORMAT_24HOUR)) {\n  191 | \t\t\tif (time->tm_hour > 12)\n  192 | \t\t\t\treg8 = dec2bcd(time->tm_hour - 12) | 0x80;\n  193 | \t\t\telse\n  194 | \t\t\t\treg8 = dec2bcd(time->tm_hour);\n  195 | \t\t} else {\n  196 | \t\t\treg8 = dec2bcd(time->tm_hour);\n  197 | \t\t}","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/nvram.c#L190-L197"},{"ref":"payloads/libpayload/drivers/nvram.c:205-212","code":"  205 | \t\tif (!(statusB & NVRAM_RTC_FORMAT_24HOUR)) {\n  206 | \t\t\tif (time->tm_hour > 12)\n  207 | \t\t\t\treg8 = (time->tm_hour - 12) | 0x80;\n  208 | \t\t\telse\n  209 | \t\t\t\treg8 = time->tm_hour;\n  210 | \t\t} else {\n  211 | \t\t\treg8 = time->tm_hour;\n  212 | \t\t}","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/nvram.c#L205-L212"}]},{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"lookup_cmos_entry() computes len = strnlen(name, CB_CMOS_MAX_NAME_LENGTH) and then uses memcmp(cmos_entry->name, name, len) to find the entry. This performs a prefix match: a search for 'foo' will match an entry named 'foobar' because memcmp only compares the first 3 bytes. Any option whose name is a prefix of another option's name will be incorrectly matched.","fix":"Compare exactly CB_CMOS_MAX_NAME_LENGTH bytes, or ensure the entry name is also null-terminated and use strncmp instead: if (strncmp((const char*)cmos_entry->name, name, CB_CMOS_MAX_NAME_LENGTH) == 0). The same issue exists in lookup_cmos_enum_core() with text/CB_CMOS_MAX_TEXT_LENGTH.","locations":[{"ref":"payloads/libpayload/drivers/options.c:157-172","code":"  157 | static struct cb_cmos_entries *lookup_cmos_entry(struct cb_cmos_option_table *option_table, const char *name)\n  158 | {\n  159 | \tstruct cb_cmos_entries *cmos_entry;\n  160 | \tint len = name ? strnlen(name, CB_CMOS_MAX_NAME_LENGTH) : 0;\n  161 | \n  162 | \t/* CMOS entries are located right after the option table */\n  163 | \tcmos_entry = first_cmos_entry(option_table);\n  164 | \twhile (cmos_entry) {\n  165 | \t\tif (memcmp((const char*)cmos_entry->name, name, len) == 0)\n  166 | \t\t\treturn cmos_entry;\n  167 | \t\tcmos_entry = next_cmos_entry(cmos_entry);\n  168 | \t}\n  169 | \n  170 | \tprintf(\"ERROR: No such CMOS option (%s)\\n\", name);\n  171 | \treturn NULL;\n  172 | }","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L157-L172"}]},{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"lookup_cmos_enum_core() also uses a prefix-only memcmp for the text/label comparison (line 248). A search for enum label 'on' will match 'once', 'only', etc. The same fix applies as for lookup_cmos_entry.","fix":"Use strncmp(cmos_enum->text, text, CB_CMOS_MAX_TEXT_LENGTH) == 0 instead of memcmp with the user-string length.","locations":[{"ref":"payloads/libpayload/drivers/options.c:248","code":"  248 | \t\t    ((text == NULL) || (memcmp((const char*)cmos_enum->text, text, len) == 0))) {","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L248"}]},{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In set_option_from_string() case 's', the buffer is allocated and strncpy'd using cmos_entry->length, which is measured in BITS, not bytes. For a 64-bit option field, this allocates 64 bytes and copies up to 64 characters, when only 8 bytes (64/8) are meaningful. The corresponding get path correctly converts bits to bytes with (cmos_entry->length+7)/8. The mismatch means the string option is allocated and filled with far more data than set_cmos_value will actually store (it only writes cmos_entry->length/8 bytes).","fix":"Use int byte_len = (cmos_entry->length + 7) / 8; for malloc and strncpy limit, matching the get path.","locations":[{"ref":"payloads/libpayload/drivers/options.c:362-366","code":"  362 | \t\t\traw = malloc(cmos_entry->length);\n  363 | \t\t\tif (!raw)\n  364 | \t\t\t\treturn 1;\n  365 | \t\t\tmemset(raw, 0x00, cmos_entry->length);\n  366 | \t\t\tstrncpy(raw, value, cmos_entry->length);","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L362-L366"}]},{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In pci_ops.c find_on_bus(), when a bridge is found, only the secondary bus number is extracted from REG_PRIMARY_BUS (bits 15:8). find_on_bus() is then called recursively on that secondary bus. This correctly recurses into downstream buses because each bridge found on any bus will itself be recursed into. However, there is no protection against bus-number cycles involving three or more buses: if bus A has a bridge to bus B, and bus B has a bridge back to bus A, the same-bus check (busses != bus) only prevents A->A or B->B directly; A->B->A->B... is an infinite recursion.","fix":"Add a visited-bus bitmask (256 bits = 32 bytes) to track buses already enumerated, and skip recursion into any already-visited bus.","locations":[{"ref":"payloads/libpayload/drivers/pci_ops.c:60-71","code":"   60 | \t\tif (hdr == HEADER_TYPE_BRIDGE || hdr == HEADER_TYPE_CARDBUS) {\n   61 | \t\t\tunsigned int busses;\n   62 | \t\t\tbusses = pci_read_config32(PCI_DEV(bus, slot, func),\n   63 | \t\t\t\t\t\t   REG_PRIMARY_BUS);\n   64 | \t\t\tbusses = (busses >> 8) & 0xFF;\n   65 | \n   66 | \t\t\t/* Avoid recursion if the new bus is the same as\n   67 | \t\t\t * the old bus (insert lame The Who joke here) */\n   68 | \n   69 | \t\t\tif ((busses != bus) &&\n   70 | \t\t\t    find_on_bus(busses, vid, did, dev))\n   71 | \t\t\t\treturn 1;","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/pci_ops.c#L60-L71"}]},{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In both bootlog_module_handle() and timestamps_module_handle(), the KEY_NPAGE and KEY_PPAGE cases have swapped comments. KEY_NPAGE is labeled 'Page up' but actually moves the cursor forward (increasing g_line), and KEY_PPAGE is labeled 'Page down' but decreases g_line. In ncurses, KEY_NPAGE is Next Page (Page Down) and KEY_PPAGE is Previous Page (Page Up), so the behavior is correct but the comments are backwards.","fix":"Swap the comments: KEY_NPAGE should be labeled 'Page down' and KEY_PPAGE should be labeled 'Page up'.","locations":[{"ref":"payloads/coreinfo/bootlog_module.c:190-194","code":"  190 | \tcase KEY_NPAGE: /* Page up */\n  191 | \t\tg_line -= LINES_SHOWN;\n  192 | \t\tbreak;\n  193 | \tcase KEY_PPAGE: /* Page down */\n  194 | \t\tg_line += LINES_SHOWN;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/bootlog_module.c#L190-L194"},{"ref":"payloads/coreinfo/timestamps_module.c:252-256","code":"  252 | \tcase KEY_NPAGE: /* Page up */\n  253 | \t\tg_line -= LINES_SHOWN;\n  254 | \t\tbreak;\n  255 | \tcase KEY_PPAGE: /* Page down */\n  256 | \t\tg_line += LINES_SHOWN;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/timestamps_module.c#L252-L256"}]},{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In cbfs_module_redraw(), when a file has an empty filename (strlen == 0), the code calls findfile(filenames[i])->type without checking if findfile returns NULL. Since CBFS is traversed from the beginning each call, findfile() on an empty string could return NULL if the CBFS structure is inconsistent or the file was logically deleted between calls. The NULL dereference causes a crash.","fix":"Check the findfile return value before dereferencing: struct cbfile *cf = findfile(filenames[i]); if (cf && cf->type == COMPONENT_NULL) ... else if (cf) ... else ...","locations":[{"ref":"payloads/coreinfo/cbfs_module.c:137-141","code":"  137 | \t\tif (strlen(filenames[i]) == 0) {\n  138 | \t\t\tif (findfile(filenames[i])->type == COMPONENT_NULL)\n  139 | \t\t\t\tmvwprintw(win, row, 1, \"<free space>\");\n  140 | \t\t\telse\n  141 | \t\t\t\tmvwprintw(win, row, 1, \"<unnamed>\");","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/cbfs_module.c#L137-L141"}]},{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In curses.h, BUTTON1_TRIPLE_CLICKED (0x00000010L) and BUTTON1_MOVED (0x00000010L) share the same numeric value, and similarly for buttons 2 (0x200) and 3 (0x4000). Code testing these values cannot distinguish between a triple-click and a move event for any button.","fix":"Assign BUTTON1_MOVED (and equivalents for buttons 2 and 3) a distinct bit value not already used by TRIPLE_CLICKED. This matches the comment that describes MOVED as a PDCurses extension.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/curses.h:159-174","code":"  159 | #define BUTTON1_TRIPLE_CLICKED  0x00000010L\n  160 | #define BUTTON1_MOVED           0x00000010L /* PDCurses */\n  161 | \n  162 | #define BUTTON2_RELEASED        0x00000020L\n  163 | #define BUTTON2_PRESSED         0x00000040L\n  164 | #define BUTTON2_CLICKED         0x00000080L\n  165 | #define BUTTON2_DOUBLE_CLICKED  0x00000100L\n  166 | #define BUTTON2_TRIPLE_CLICKED  0x00000200L\n  167 | #define BUTTON2_MOVED           0x00000200L /* PDCurses */\n  168 | \n  169 | #define BUTTON3_RELEASED        0x00000400L\n  170 | #define BUTTON3_PRESSED         0x00000800L\n  171 | #define BUTTON3_CLICKED         0x00001000L\n  172 | #define BUTTON3_DOUBLE_CLICKED  0x00002000L\n  173 | #define BUTTON3_TRIPLE_CLICKED  0x00004000L\n  174 | #define BUTTON3_MOVED           0x00004000L /* PDCurses */","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/curses.h#L159-L174"}]},{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In firework.c main(), the draw loop writes mvaddstr(LINES - row, ...) starting with row == 0 on the first iteration, which evaluates to row LINES. Curses rows are 0-indexed (valid range 0..LINES-1), so LINES is out of range. This typically causes the string to be silently discarded (the curses clipping) but the trajectory is drawn one row off: the rocket base appears off-screen on the first step.","fix":"Start the drawing at LINES - 1 - row: mvaddstr(LINES - 1 - row, row * direction + start, ...);","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/firework.c:59-70","code":"   59 |         for (row = 0; row < diff; row++)\n   60 |         {\n   61 |             mvaddstr(LINES - row, row * direction + start,\n   62 |                 (direction < 0) ? \"\\\\\" : \"/\");\n   63 | \n   64 |             if (flag++)\n   65 |             {\n   66 |                 myrefresh();\n   67 |                 erase();\n   68 |                 flag = 0;\n   69 |             }\n   70 |         }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/firework.c#L59-L70"}]},{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In newdemo.c WaitForUser(), nodelay() is called twice in succession with opposite values (TRUE then FALSE) without a matching getch() in between. halfdelay(50) sets a half-second timeout, but then nodelay(FALSE) immediately overrides it, so the half-delay has no effect. This is dead/redundant setup code that makes the timing behavior hard to reason about.","fix":"Remove the initial nodelay(stdscr, TRUE) call since halfdelay(50) is what provides the intended timeout behavior.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/newdemo.c:57-66","code":"   57 | \n   58 |     nodelay(stdscr, TRUE);\n   59 |     halfdelay(50);\n   60 | \n   61 |     ch = getch();\n   62 | \n   63 |     nodelay(stdscr, FALSE);\n   64 |     nocbreak();     /* Reset the halfdelay() value */\n   65 |     cbreak();\n   66 | ","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/newdemo.c#L57-L66"}]},{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In tui.c padstr(), the fmt[] buffer is only 10 bytes. The format pattern written into it is '%%-%ds' (with sprintf expanding %d to the decimal representation of length). If length has more than 4 digits (i.e., >= 10000), the resulting format string exceeds 9 characters plus null terminator, overflowing fmt[10]. While COLS >= 10000 is unrealistic today, it is an unbounded assumption with no assertion.","fix":"Increase fmt[] to at least 20 bytes to accommodate any plausible column width, or use snprintf with the correct size.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/tui.c:73-75","code":"   73 |     char fmt[10];\n   74 | \n   75 |     sprintf(fmt, (int)strlen(s) > length ? \"%%.%ds\" : \"%%-%ds\", length);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/tui.c#L73-L75"}]},{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In tuidemo.c showfile(), EOF detection relies on strlen(buf) == 0 after fgets(). This works correctly because buf[0] is set to '\\0' before each fgets call, but a read error (ferror) is indistinguishable from EOF: both leave buf[0] == '\\0', so an I/O error causes silent termination of the display rather than an error message.","fix":"Check the return value of fgets directly: if (!fgets(buf, MAXSTRLEN, fp)) { ateof = TRUE; } instead of relying on strlen(buf) == 0.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/tuidemo.c:92-99","code":"   92 |                 buf[0] = '\\0';\n   93 |                 fgets(buf, MAXSTRLEN, fp);\n   94 | \n   95 |                 if (strlen(buf))\n   96 |                     bodymsg(buf);\n   97 |                 else\n   98 |                     ateof = TRUE;\n   99 |             }","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/tuidemo.c#L92-L99"}]},{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In border.c, wborder() does not check for a window that is too small (maxy < 1 or maxx < 1). If the window has height 1 or width 1, ymax=0 and xmax=0. The horizontal loop 'for (i = 1; i < xmax; i++)' runs 0 times (fine), but the corner assignments write to _y[0][0] and _y[0][xmax] which are the same cell (_y[0][0]) -- it gets written twice (tl, then br), leaving br in that cell. Similarly _y[ymax][0] and _y[ymax][xmax] are the same. This produces a visually garbled single-cell 'border'.","fix":"Add a check at the start of wborder(): if the window is too small (maxy < 2 or maxx < 2), return ERR.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/border.c:131-179","code":"  131 | int wborder(WINDOW *win, chtype ls, chtype rs, chtype ts, chtype bs,\n  132 |             chtype tl, chtype tr, chtype bl, chtype br)\n  133 | {\n  134 |     int i, ymax, xmax;\n  135 | \n  136 |     PDC_LOG((\"wborder() - called\\n\"));\n  137 | \n  138 |     if (!win)\n  139 |         return ERR;\n  140 | \n  141 |     ymax = win->_maxy - 1;\n  142 |     xmax = win->_maxx - 1;\n  143 | \n  144 |     ls = _attr_passthru(win, ls ? ls : ACS_VLINE);\n  145 |     rs = _attr_passthru(win, rs ? rs : ACS_VLINE);\n  146 |     ts = _attr_passthru(win, ts ? ts : ACS_HLINE);\n  147 |     bs = _attr_passthru(win, bs ? bs : ACS_HLINE);\n  148 |     tl = _attr_passthru(win, tl ? tl : ACS_ULCORNER);\n  149 |     tr = _attr_passthru(win, tr ? tr : ACS_URCORNER);\n  150 |     bl = _attr_passthru(win, bl ? bl : ACS_LLCORNER);\n  151 |     br = _attr_passthru(win, br ? br : ACS_LRCORNER);\n  152 | \n  153 |     for (i = 1; i < xmax; i++)\n  154 |     {\n  155 |         win->_y[0][i] = ts;\n  156 |         win->_y[ymax][i] = bs;\n  157 |     }\n  158 | \n  159 |     for (i = 1; i < ymax; i++)\n  160 |     {\n  161 |         win->_y[i][0] = ls;\n  162 |         win->_y[i][xmax] = rs;\n  163 |     }\n  164 | \n  165 |     win->_y[0][0] = tl;\n  166 |     win->_y[0][xmax] = tr;\n  167 |     win->_y[ymax][0] = bl;\n  168 |     win->_y[ymax][xmax] = br;\n  169 | \n  170 |     for (i = 0; i <= ymax; i++)\n  171 |     {\n  172 |         win->_firstch[i] = 0;\n  173 |         win->_lastch[i] = xmax;\n  174 |     }\n  175 | \n  176 |     PDC_sync(win);\n  177 | \n  178 |     return OK;\n  179 | }","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/border.c#L131-L179"}]},{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In debug.c, the debug log timestamp uses 'localtime(&now)' which returns a pointer to a static buffer. If the code is ever used in a multi-threaded environment, concurrent PDC_debug() calls could corrupt each other's time strings. Additionally, the strftime format '\"At: %8.8ld - %s \"' intermixes a long (%ld, the clock value) with %s (the time string) but the format literal '\"At: %8.8ld - %s \"' is passed to fprintf as a fixed string with arguments in order, so there is no format mismatch. Still, the buffer size for hms is exactly 9 -- strftime with format '%H:%M:%S' produces exactly 8 chars + NUL, so this is correct but very tight with no margin for locale-specific differences.","fix":"Use localtime_r() in threaded environments. Increase hms buffer size for safety.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/debug.c:57-60","code":"   57 | \n   58 |     time(&now);\n   59 |     strftime(hms, 9, \"%H:%M:%S\", localtime(&now));\n   60 |     fprintf(dbfp, \"At: %8.8ld - %s \", (long) clock(), hms);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/debug.c#L57-L60"}]},{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In getch.c, when buffering input (nocbreak/noraw mode), the backspace handler at line 276 decrements c_pindex below c_gindex without checking this bound: 'if (c_pindex > c_gindex) c_pindex--'. If c_gindex is 0 and c_pindex is 0 (equal), the backspace is silently discarded. But if multiple backspaces are pressed rapidly, c_pindex could theoretically reach 0 then be prevented from going negative by the guard -- this is correct. However after flushinp() sets c_gindex=1 and c_pindex=0, a subsequent backspace with c_pindex(0) <= c_gindex(1) is silently discarded even if there are notional characters, because the buffer is in an inconsistent state after flushinp().","fix":"After flushinp(), reset c_gindex to 0 (not 1) to be consistent with c_pindex=0, or ensure flushinp() leaves indices in a mutually consistent state.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getch.c:275-279","code":"  275 |         if (key == '\\b')\n  276 |         {\n  277 |             if (c_pindex > c_gindex)\n  278 |                 c_pindex--;\n  279 |         }","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getch.c#L275-L279"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getch.c:323-334","code":"  323 | int flushinp(void)\n  324 | {\n  325 |     PDC_LOG((\"flushinp() - called\\n\"));\n  326 | \n  327 |     PDC_flushinp();\n  328 | \n  329 |     c_gindex = 1;           /* set indices to kill buffer */\n  330 |     c_pindex = 0;\n  331 |     c_ungind = 0;           /* clear c_ungch array */\n  332 | \n  333 |     return OK;\n  334 | }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getch.c#L323-L334"}]},{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In setsyx() (getyx.c, lines 138-141), when exactly one of y or x equals -1 (but not both), the function silently returns OK without doing anything. This differs from the documented behavior: setsyx(-1,-1) should set leaveit=TRUE; setsyx(y,x) should move the cursor. Having only one coordinate be -1 is an error condition that the function silently ignores instead of returning ERR.","fix":"Return ERR when exactly one of y/x is -1, or document the current behavior explicitly.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getyx.c:138-141","code":"  138 |     else if (y == -1 || x == -1)\n  139 |     {\n  140 |         return OK;\n  141 |     }","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getyx.c#L138-L141"}]},{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In inopts.c, the wtimeout() function has a commented-out line '/*win->_nodelay = TRUE;*/' (line 297) in the positive-delay branch. According to curses semantics, a positive delay should set the window into a timed blocking read, which requires nodelay to be FALSE (block until timeout). The comment suggests an earlier implementation tried setting nodelay=TRUE here. The current code leaves nodelay unchanged (whatever it was before wtimeout() was called), which may leave a previously-set nodelay=TRUE active when a positive delay is requested, causing wgetch() to return ERR immediately instead of waiting.","fix":"Explicitly set 'win->_nodelay = FALSE;' in the positive-delay branch so that wgetch() will block for _delayms milliseconds rather than returning immediately.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/inopts.c:291-299","code":"  291 |     else\n  292 |     {\n  293 |         /* This causes the read on the window to delay for the number of\n  294 |            milliseconds. Also forces the window into non-blocking read\n  295 |            mode */\n  296 | \n  297 |         /*win->_nodelay = TRUE;*/\n  298 |         win->_delayms = delay;\n  299 |     }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/inopts.c#L291-L299"}]},{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In outopts.c, wsetscrreg() validates the scroll region with the condition 'top <= win->_cury && win->_cury <= bottom' (line 125-126). This ties setting the scroll region to the current cursor position -- you cannot set a scroll region that does not contain the current cursor. The X/Open specification for wsetscrreg() says only that top and bottom must be within the window boundaries; it does not require the cursor to be within the region. This overly restrictive check will return ERR unexpectedly.","fix":"Remove the cursor position checks. The condition should be: 'win && 0 <= top && top <= bottom && bottom < win->_maxy'.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/outopts.c:121-135","code":"  121 | int wsetscrreg(WINDOW *win, int top, int bottom)\n  122 | {\n  123 |     PDC_LOG((\"wsetscrreg() - called: top %d bottom %d\\n\", top, bottom));\n  124 | \n  125 |     if (win && 0 <= top && top <= win->_cury &&\n  126 |         win->_cury <= bottom && bottom < win->_maxy)\n  127 |     {\n  128 |         win->_tmarg = top;\n  129 |         win->_bmarg = bottom;\n  130 | \n  131 |         return OK;\n  132 |     }\n  133 |     else\n  134 |         return ERR;\n  135 | }","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/outopts.c#L121-L135"}]},{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"_copy_win() in overlay.c does not reset the 'lc' (last-changed column) variable between row iterations. 'lc' is initialized to 0 before the outer loop and is only updated inside the inner loop when a character actually changes. If row N has changes (setting lc) and row N+1 has no changes (fc == _NO_CHANGE), the branch 'if (*minchng == _NO_CHANGE) { *minchng = fc; *maxchng = lc; }' writes the stale lc from row N into maxchng[N+1]. Since minchng[N+1] remains _NO_CHANGE, the refresh code will skip this row anyway, so there is no visual corruption, but the state is inconsistent and wastes effort if the row later becomes dirty.","fix":"Reset 'lc' at the start of each row iteration (alongside 'fc = _NO_CHANGE') so its value is never carried over between rows: add 'lc = _NO_CHANGE;' at line 77 (same place as 'fc = _NO_CHANGE;'). Adjust the maxchng update logic accordingly.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/overlay.c:56-113","code":"   56 |     int lc = 0;\n   57 |     int xdiff = src_bc - src_tc;\n   58 |     int ydiff = src_br - src_tr;\n   59 | \n   60 |     if (!src_w || !dst_w)\n   61 |         return ERR;\n   62 | \n   63 |     minchng = dst_w->_firstch;\n   64 |     maxchng = dst_w->_lastch;\n   65 | \n   66 |     for (y1 = 0; y1 < dst_tr; y1++)\n   67 |     {\n   68 |         minchng++;\n   69 |         maxchng++;\n   70 |     }\n   71 | \n   72 |     for (line = 0; line < ydiff; line++)\n   73 |     {\n   74 |         w1ptr = src_w->_y[line + src_tr] + src_tc;\n   75 |         w2ptr = dst_w->_y[line + dst_tr] + dst_tc;\n   76 | \n   77 |         fc = _NO_CHANGE;\n   78 | \n   79 |         for (col = 0; col < xdiff; col++)\n   80 |         {\n   81 |             if ((*w1ptr) != (*w2ptr) &&\n   82 |                 !((*w1ptr & A_CHARTEXT) == ' ' && _overlay))\n   83 |             {\n   84 |                 *w2ptr = *w1ptr;\n   85 | \n   86 |                 if (fc == _NO_CHANGE)\n   87 |                     fc = col + dst_tc;\n   88 | \n   89 |                 lc = col + dst_tc;\n   90 |             }\n   91 | \n   92 |             w1ptr++;\n   93 |             w2ptr++;\n   94 |         }\n   95 | \n   96 |         if (*minchng == _NO_CHANGE)\n   97 |         {\n   98 |             *minchng = fc;\n   99 |             *maxchng = lc;\n  100 |         }\n  101 |         else if (fc != _NO_CHANGE)\n  102 |         {\n  103 |             if (fc < *minchng)\n  104 |                 *minchng = fc;\n  105 |             if (lc > *maxchng)\n  106 |                 *maxchng = lc;\n  107 |         }\n  108 | \n  109 |         minchng++;\n  110 |         maxchng++;\n  111 |     }\n  112 | \n  113 |     return OK;","lines":58,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/overlay.c#L56-L113"}]},{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In sdl1/pdcclip.c PDC_setclipboard(), contents is copied with strcpy() (line\n86) using a buffer allocated to `length + 1` bytes, where `length` is caller-supplied. If the\nactual string length of `contents` is greater than `length` (caller passes a shorter length than\nthe string), strcpy copies beyond the allocation, overflowing the heap buffer.","fix":"Use `memcpy(pdc_SDL_clipboard, contents, length); pdc_SDL_clipboard[length] = '\\0';`\ninstead of strcpy, which respects the caller-supplied length.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c:71-89","code":"   71 | int PDC_setclipboard(const char *contents, long length)\n   72 | {\n   73 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n   74 | \n   75 |     if (pdc_SDL_clipboard)\n   76 |     {\n   77 |         free(pdc_SDL_clipboard);\n   78 |         pdc_SDL_clipboard = NULL;\n   79 |     }\n   80 | \n   81 |     if (contents)\n   82 |     {\n   83 |         if ((pdc_SDL_clipboard = malloc(length + 1)) == NULL)\n   84 |             return PDC_CLIP_MEMORY_ERROR;\n   85 | \n   86 |         strcpy(pdc_SDL_clipboard, contents);\n   87 |     }\n   88 | \n   89 |     return PDC_CLIP_SUCCESS;","lines":19,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c#L71-L89"}]},{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"`init_pair()` rejects `index == 0` (returns ERR), but `pair_content()` allows\n`index == 0` (only rejects `index < 0`). The color_pairs[0] entry is initialized\nto `0x07` (white-on-black default pair). This inconsistency means the default\npair (index 0) can be read but not written, which is intentional per POSIX, but\nthe divergent guard conditions (`index == 0 || index > 255` vs `index < 0 ||\nindex > 255`) make the intent invisible and fragile. A future maintainer adding\nnegative-index handling to `init_pair` might accidentally align it with\n`pair_content`'s check and silently allow writes to pair 0.","fix":"Add a comment to both functions explaining why the index==0 treatment differs, or use a shared inline helper that encodes the policy explicitly.","locations":[{"ref":"payloads/libpayload/curses/colors.c:45-46","code":"   45 | \tif (index == 0 || index > 255)\n   46 | \t\treturn ERR;","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/colors.c#L45-L46"},{"ref":"payloads/libpayload/curses/colors.c:54-55","code":"   54 | \tif (index < 0 || index > 255)\n   55 | \t\treturn ERR;","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/colors.c#L54-L55"}]},{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In data_ahead (frm_data.c), when checking for off-screen data in a multi-line field, the window position passed to wmove uses 'pos' as the row but pos is an absolute buffer row index, not a window-relative row. After pos exceeds field->rows (the visible window height), wmove will fail and Only_Padding will treat the ERR result as 'no data found' (returns TRUE), causing data_ahead to underreport off-screen content for fields taller than their visible area.","fix":"When form->w is a pad (scrollable multi-line field), wmove coordinates must be relative to the pad's total size, which they are since form->w is allocated as newpad(drows, dcols). Verify that the pad is large enough for the absolute row 'pos'; if form->w is a derived window instead, the row must be adjusted by subtracting form->toprow.","locations":[{"ref":"payloads/libpayload/curses/form/frm_data.c:173-184","code":"  173 | \t  pos = form->toprow + field->rows;\n  174 | \t  while (pos < field->drows)\n  175 | \t    {\n  176 | \t      cursor_moved = TRUE;\n  177 | \t      wmove(form->w, pos, 0);\n  178 | \t      pos++;\n  179 | \t      if (!Only_Padding(form->w, field->cols, field->pad))\n  180 | \t\t{\n  181 | \t\t  result = TRUE;\n  182 | \t\t  break;\n  183 | \t\t}\n  184 | \t    }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_data.c#L173-L184"}]},{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"_nc_First_Active_Field (frm_driver.c) falls back to returning *first (the pmin field) when no visible field is found on the page. However, the variable 'first' points to form->field[pmin], which is a pointer into the field pointer array; the dereference (*first) is correct. But the function comment says it 'hopes the best', meaning the returned field may be invisible and non-selectable. Callers such as Associate_Fields call form_driver(form, FIRST_ACTIVE_MAGIC) which assigns this potentially invisible field as form->current without further validation, allowing subsequent driver operations to act on an invisible field.","fix":"After _nc_First_Active_Field returns, verify the returned field is at least selectable before assigning it as form->current, or treat a form page with no usable fields as an error condition.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:3256-3295","code":" 3256 | NCURSES_EXPORT(FIELD *)\n 3257 | _nc_First_Active_Field(FORM *form)\n 3258 | {\n 3259 |   FIELD **last_on_page = &form->field[form->page[form->curpage].pmax];\n 3260 |   FIELD *proposed = Next_Field_On_Page(*last_on_page);\n 3261 | \n 3262 |   if (proposed == *last_on_page)\n 3263 |     {\n 3264 |       /* there might be the special situation, where there is no\n 3265 |          active and visible field on the current page. We then select\n 3266 |          the first visible field on this readonly page\n 3267 |        */\n 3268 |       if (Field_Is_Not_Selectable(proposed))\n 3269 | \t{\n 3270 | \t  FIELD **field = &form->field[proposed->index];\n 3271 | \t  FIELD **first = &form->field[form->page[form->curpage].pmin];\n 3272 | \n 3273 | \t  do\n 3274 | \t    {\n 3275 | \t      field = (field == last_on_page) ? first : field + 1;\n 3276 | \t      if (((*field)->opts & O_VISIBLE))\n 3277 | \t\tbreak;\n 3278 | \t    }\n 3279 | \t  while (proposed != (*field));\n 3280 | \n 3281 | \t  proposed = *field;\n 3282 | \n 3283 | \t  if ((proposed == *last_on_page) && !(proposed->opts & O_VISIBLE))\n 3284 | \t    {\n 3285 | \t      /* This means, there is also no visible field on the page.\n 3286 | \t         So we propose the first one and hope the very best...\n 3287 | \t         Some very clever user has designed a readonly and invisible\n 3288 | \t         page on this form.\n 3289 | \t       */\n 3290 | \t      proposed = *first;\n 3291 | \t    }\n 3292 | \t}\n 3293 |     }\n 3294 |   return (proposed);\n 3295 | }","lines":40,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L3256-L3295"},{"ref":"payloads/libpayload/curses/form/frm_def.c:271-273","code":"  271 | \t{\n  272 | \t  form->curpage = 0;\n  273 | \t  form_driver(form, FIRST_ACTIVE_MAGIC);","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L271-L273"}]},{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In Next_Enum (fty_enum.c), when no exact match is found in the keyword list and\ncnt drops to -1, the code wraps to args->kwds[0] and sets the field to *kwds\n(the first keyword). However, if the current field content is empty and matches\nthe dummy empty array exactly via the Compare(dummy,...) path, *kwds at that point\nis args->kwds[0] only if cnt wrapped to 0; but if cnt went negative (-1), the\nassignment 'kwds = args->kwds' points to kwds[0]. The subtle issue is that\n'cnt <= 0' triggers a reset to args->kwds (start), but the comparison afterwards\nuses 'cnt >= 0' which is FALSE when cnt == -1 after the last decrement. So if\nno match is found AND the field is not empty matching dummy, FALSE is correctly\nreturned. But when cnt exits the loop at -1 (no match found), the dummy compare\nmay advance past the array. The condition at line 358 'if (cnt <= 0)' resets kwds\nbut then 'if (cnt >= 0)' on line 360 is only true if cnt==0 not cnt==-1, creating\nan off-by-one: wrapping occurs but the next item is skipped when the field is empty.","fix":"After finding no match (cnt exhausted to -1) and wrapping kwds, the intent is to\nload the first keyword. Separate the wrap and the write logic more clearly,\nand verify cnt==0 (last item) vs cnt==-1 (exhausted) to correctly handle cycling.","locations":[{"ref":"payloads/libpayload/curses/form/fty_enum.c:343-367","code":"  343 | Next_Enum(FIELD *field, const void *argp)\n  344 | {\n  345 |   const enumARG *args = (const enumARG *)argp;\n  346 |   char **kwds = args->kwds;\n  347 |   bool ccase = args->checkcase;\n  348 |   int cnt = args->count;\n  349 |   unsigned char *bp = (unsigned char *)field_buffer(field, 0);\n  350 | \n  351 |   if (kwds)\n  352 |     {\n  353 |       while (cnt--)\n  354 | \t{\n  355 | \t  if (Compare((unsigned char *)(*kwds++), bp, ccase) == EXACT)\n  356 | \t    break;\n  357 | \t}\n  358 |       if (cnt <= 0)\n  359 | \tkwds = args->kwds;\n  360 |       if ((cnt >= 0) || (Compare((const unsigned char *)dummy, bp, ccase) == EXACT))\n  361 | \t{\n  362 | \t  set_field_buffer(field, 0, *kwds);\n  363 | \t  return TRUE;\n  364 | \t}\n  365 |     }\n  366 |   return FALSE;\n  367 | }","lines":25,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_enum.c#L343-L367"}]},{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In m_global.c _nc_Link_Items, the column-major branch uses variable 'i' (declared\nat the top scope as 'int i, j') as both the outer row-major loop variable (set by\nthe row-major branch above, now out of scope) and as a computed index inside the\ncolumn-major branch at line 449: 'item = menu->items[i = (col * Number_Of_Rows + row)]'.\nWhile 'i' is correctly reassigned on each iteration, mixing two loop variables\n(j for the iteration count, i for the flat index) reduces clarity and creates\na hidden dependency on the declaration scope. Additionally, variable 'last_pos'\nreturned by compile() in fty_regex.c is assigned but never used in either\nHAVE_REGEXP_H_FUNCS or HAVE_REGEXPR_H_FUNCS path.","fix":"In _nc_Link_Items, rename the flat index to 'flat_idx' and declare it inside\nthe else block for clarity.\nIn fty_regex.c, remove the unused 'last_pos' variable or suppress the warning,\nsince the result of compile() is only relevant via the side-effect on reg_errno.","locations":[{"ref":"payloads/libpayload/curses/menu/m_global.c:447-492","code":"  447 | \t  for (j = 0; j < Number_Of_Items; j++)\n  448 | \t    {\n  449 | \t      item = menu->items[i = (col * Number_Of_Rows + row)];\n  450 | \n  451 | \t      Last_in_Column = (menu->cols - 1) * Number_Of_Rows + row;\n  452 | \n  453 | \t      item->left = (col) ?\n  454 | \t\tmenu->items[i - Number_Of_Rows] :\n  455 | \t\t(cycle ? (Last_in_Column >= Number_Of_Items) ?\n  456 | \t\t menu->items[Last_in_Column - Number_Of_Rows] :\n  457 | \t\t menu->items[Last_in_Column] :\n  458 | \t\t (ITEM *) 0);\n  459 | \n  460 | \t      item->right = ((i + Number_Of_Rows) < Number_Of_Items)\n  461 | \t\t?\n  462 | \t\tmenu->items[i + Number_Of_Rows] :\n  463 | \t\t(cycle ? menu->items[row] : (ITEM *) 0);\n  464 | \n  465 | \t      Last_in_Row = col * Number_Of_Rows + (Number_Of_Rows - 1);\n  466 | \n  467 | \t      item->up = (row) ?\n  468 | \t\tmenu->items[i - 1] :\n  469 | \t\t(cycle ?\n  470 | \t\t menu->items[(Last_in_Row >= Number_Of_Items) ?\n  471 | \t\t\t     Number_Of_Items - 1 :\n  472 | \t\t\t     Last_in_Row] :\n  473 | \t\t (ITEM *) 0);\n  474 | \n  475 | \t      item->down = (row < (Number_Of_Rows - 1))\n  476 | \t\t?\n  477 | \t\t(menu->items[((i + 1) < Number_Of_Items) ?\n  478 | \t\t\t     i + 1 :\n  479 | \t\t\t     (col - 1) * Number_Of_Rows + row + 1]) :\n  480 | \t\t(cycle ?\n  481 | \t\t menu->items[col * Number_Of_Rows] :\n  482 | \t\t (ITEM *) 0\n  483 | \t\t);\n  484 | \n  485 | \t      item->x = col;\n  486 | \t      item->y = row;\n  487 | \t      if ((++row) == Number_Of_Rows)\n  488 | \t\t{\n  489 | \t\t  col++;\n  490 | \t\t  row = 0;\n  491 | \t\t}\n  492 | \t    }","lines":46,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_global.c#L447-L492"},{"ref":"payloads/libpayload/curses/form/fty_regex.c:164-169","code":"  164 | #if HAVE_REGEXP_H_FUNCS\n  165 | \t\t  char *last_pos = compile(rx, buf, &buf[blen], '\\0');\n  166 | \n  167 | #else /* HAVE_REGEXPR_H_FUNCS */\n  168 | \t\t  char *last_pos = compile(rx, buf, &buf[blen]);\n  169 | #endif","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_regex.c#L164-L169"}]},{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In m_req_name.c menu_request_by_name(), after the inner toupper loop terminates (when i reaches sizeof(buf) or a NUL), i is reused for the outer search loop starting at line 116. The variable `i` is declared as `unsigned int`, so `i = 0` before the outer loop is fine, but the reuse across two semantically distinct loop bodies is confusing and error-prone; if the inner loop exits due to i == sizeof(buf) (16), the outer loop's `for (i = 0; ...)` correctly resets i. This is not a runtime bug but indicates fragile code.","fix":"Use separate variable names for the two loops, e.g., `unsigned int j` for the toupper pass.","locations":[{"ref":"payloads/libpayload/curses/menu/m_req_name.c:102-122","code":"  102 |   unsigned int i = 0;\n  103 |   char buf[16];\n  104 | \n  105 |   T((T_CALLED(\"menu_request_by_name(%s)\"), _nc_visbuf(str)));\n  106 | \n  107 |   if (str)\n  108 |     {\n  109 |       strncpy(buf, str, sizeof(buf));\n  110 |       while ((i < sizeof(buf)) && (buf[i] != '\\0'))\n  111 | \t{\n  112 | \t  buf[i] = (char)toupper(UChar(buf[i]));\n  113 | \t  i++;\n  114 | \t}\n  115 | \n  116 |       for (i = 0; i < A_SIZE; i++)\n  117 | \t{\n  118 | \t  if (strncmp(request_names[i], buf, sizeof(buf)) == 0)\n  119 | \t    returnCode(MIN_MENU_COMMAND + (int)i);\n  120 | \t}\n  121 |     }\n  122 |   RETURN(E_NO_MATCH);","lines":21,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_req_name.c#L102-L122"}]},{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In pdcscrn.c PDC_scr_open(), if SP allocation succeeds but pdc_atrtab allocation fails (line 64), the already-allocated SP is not freed before returning ERR, leaking SP.","fix":"Check allocations separately: if SP allocation succeeds but pdc_atrtab fails, free(SP) before returning ERR. Or check them with an if/else chain.","locations":[{"ref":"payloads/libpayload/curses/pdcurses-backend/pdcscrn.c:61-65","code":"   61 |     SP = calloc(1, sizeof(SCREEN));\n   62 |     pdc_atrtab = calloc(PDC_COLOR_PAIRS * PDC_OFFSET, 1);\n   63 | \n   64 |     if (!SP || !pdc_atrtab)\n   65 |         return ERR;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/pdcurses-backend/pdcscrn.c#L61-L65"}]},{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In tinycurses.c vwprintw(), vsprintf writes into the global `sprintf_tmp[1024]` buffer (line 497). This is a fixed-size global buffer with no length protection; a format string producing more than 1024 bytes will overflow into adjacent globals. The comment on line 163 calls this 'Ugly (and insecure!) hack!'. In a bare-metal BIOS context this can cause silent data corruption in other global variables.","fix":"Replace vsprintf with vsnprintf(sprintf_tmp, sizeof(sprintf_tmp), fmt, argp) to prevent overflow.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:163-164","code":"  163 | // FIXME: Ugly (and insecure!) hack!\n  164 | char sprintf_tmp[1024];","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L163-L164"},{"ref":"payloads/libpayload/curses/tinycurses.c:495-501","code":"  495 | int vwprintw(WINDOW *win, const char *fmt, va_list argp)\n  496 | {\n  497 | \tvsprintf((char *)&sprintf_tmp, fmt, argp);\n  498 | \n  499 | \t/* TODO: Error handling? */\n  500 | \treturn waddstr(win, (char *)&sprintf_tmp);\n  501 | }","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L495-L501"}]},{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In cbmem_console.c cbmem_console_write(), do_write is called with a potentially zero-length `count` on the last iteration when `still_fits == count` (i.e., count becomes 0 after `count -= still_fits`). The subsequent do_write(buffer, 0) is harmless (memcpy of 0 bytes) but the loop condition `(cbmem_cons->cursor & CURSOR_MASK) + count >= cbmem_cons->size` with count=0 would be false, so the loop exits correctly. However, if cbmem_cons->size is 0 (pathological but possible if the console was improperly initialized), the loop condition divides no bytes but `still_fits = 0 - 0 = 0`, leading to an infinite loop because count never decreases below 0.","fix":"Add a guard at the top of cbmem_console_write(): `if (!cbmem_cons || !cbmem_cons->size) return;`","locations":[{"ref":"payloads/libpayload/drivers/cbmem_console.c:66-81","code":"   66 | void cbmem_console_write(const void *buffer, size_t count)\n   67 | {\n   68 | \tstruct cbmem_console *const cbmem_cons = phys_to_virt(cbmem_console_p);\n   69 | \n   70 | \twhile ((cbmem_cons->cursor & CURSOR_MASK) + count >=\n   71 | \t       cbmem_cons->size) {\n   72 | \t\tsize_t still_fits = cbmem_cons->size - (cbmem_cons->cursor & CURSOR_MASK);\n   73 | \t\tdo_write(buffer, still_fits);\n   74 | \t\tcbmem_cons->cursor &= ~CURSOR_MASK;\n   75 | \t\tcbmem_cons->cursor |= OVERFLOW;\n   76 | \t\tbuffer += still_fits;\n   77 | \t\tcount -= still_fits;\n   78 | \t}\n   79 | \n   80 | \tdo_write(buffer, count);\n   81 | }","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/cbmem_console.c#L66-L81"}]},{"id":"LOGIC_85","type":"logic_error"
