vwprintw() - called\\n\"));\n   47 | \n   48 | #ifdef HAVE_VSNPRINTF\n   49 |     len = vsnprintf(printbuf, 512, fmt, varglist);\n   50 | #else\n   51 |     len = vsprintf(printbuf, fmt, varglist);\n   52 | #endif\n   53 |     return (waddstr(win, printbuf) == ERR) ? ERR : len;","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/printw.c#L43-L53"}]},{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"is_linetouched() accepts line == win->_maxy due to an off-by-one in the guard condition. The check is 'if (!win || line > win->_maxy || line < 0) return FALSE'. When line == win->_maxy, the check passes, and the code accesses win->_firstch[win->_maxy], which is one past the end of the win->_maxy-element array. The arrays _firstch and _lastch are allocated with exactly nlines (== _maxy) elements, so index _maxy is always out of bounds. The same off-by-one exists in touchline() and wtouchln() at their guard conditions (line 81, line 118), though for those functions, start == _maxy or y == _maxy simply causes the subsequent loop to run zero iterations, which is harmless.","fix":"Change the condition to 'line >= win->_maxy' (strict greater-than-or-equal): 'if (!win || line >= win->_maxy || line < 0) return FALSE;'","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/touch.c:138-146","code":"  138 | bool is_linetouched(WINDOW *win, int line)\n  139 | {\n  140 |     PDC_LOG((\"is_linetouched() - called: win=%p line=%d\\n\", win, line));\n  141 | \n  142 |     if (!win || line > win->_maxy || line < 0)\n  143 |         return FALSE;\n  144 | \n  145 |     return (win->_firstch[line] != _NO_CHANGE) ? TRUE : FALSE;\n  146 | }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/touch.c#L138-L146"}]},{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"PDC_mbstowcs() (PDC_FORCE_UTF8 path) writes a null terminator one element past the end of the destination buffer when the input exactly fills the buffer. The loop 'while (*src && i < n)' exits when i equals n (after the last increment). The line 'dest[i] = 0' then writes to dest[n], which is one past the n-element buffer. Callers such as slk_set() pass a fixed-size wchar_t array with n as its character capacity, so this off-by-one reliably writes one wchar_t beyond the array.","fix":"Cap i before writing the terminator: the loop should run while (*src && i < n - 1) to leave room for the null, or add 'if (i > n) i = n; dest[i] = 0;' after the loop (where dest has n+1 elements). Better still, allocate and document dest as having n+1 elements and keep the existing logic.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/util.c:253-268","code":"  253 |     while (*src && i < n)\n  254 |     {\n  255 |         int retval = PDC_mbtowc(dest + i, src, len);\n  256 | \n  257 |         if (retval < 1)\n  258 |             return -1;\n  259 | \n  260 |         src += retval;\n  261 |         len -= retval;\n  262 |         i++;\n  263 |     }\n  264 | # else\n  265 |     size_t i = mbstowcs(dest, src, n);\n  266 | # endif\n  267 |     dest[i] = 0;\n  268 |     return i;","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/util.c#L253-L268"}]},{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"`Total_Buffer_Size()` in form.priv.h computes:\n  (Buffer_Length(field) + 1) * (1 + field->nbuf) * sizeof(FIELD_CELL)\nwhere Buffer_Length = drows * dcols. Both `drows` and `dcols` are `int` (set\ndirectly from caller-supplied `rows+nrow` and `cols` in `new_field()`). For\nlarge values the intermediate multiplication `drows * dcols` overflows a signed\nint (UB), and the subsequent multiplication with `(1 + nbuf) * sizeof(FIELD_CELL)`\ncan overflow `size_t`, producing a truncated length passed to `malloc()`. The\nresulting undersized buffer is then written past its end during the buffer-fill\nloop in `new_field()`.","fix":"Perform the size calculation in `size_t` throughout and check for overflow before\ncalling malloc. Example:\n  size_t buf_len = (size_t)field->drows * (size_t)field->dcols;\n  size_t total   = (buf_len + 1) * (size_t)(1 + field->nbuf) * sizeof(FIELD_CELL);\n  if (buf_len == 0 || total / (buf_len + 1) != (size_t)(1 + field->nbuf) * sizeof(FIELD_CELL))\n      /* overflow */;\nAlso add upper-bound validation of `rows`, `cols`, `nrow`, and `nbuf` in\n`new_field()`.","locations":[{"ref":"payloads/libpayload/curses/form/form.priv.h:120-124","code":"  120 | #define Buffer_Length(field) ((field)->drows * (field)->dcols)\n  121 | \n  122 | /* Calculate the total size of all buffers for this field */\n  123 | #define Total_Buffer_Size(field) \\\n  124 |    ( (Buffer_Length(field) + 1) * (1+(field)->nbuf) * sizeof(FIELD_CELL) )","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/form.priv.h#L120-L124"},{"ref":"payloads/libpayload/curses/form/fld_def.c:285-333","code":"  285 |   if (rows > 0 &&\n  286 |       cols > 0 &&\n  287 |       frow >= 0 &&\n  288 |       fcol >= 0 &&\n  289 |       nrow >= 0 &&\n  290 |       nbuf >= 0 &&\n  291 |       ((err = E_SYSTEM_ERROR) != 0) &&\t/* trick: this resets the default error */\n  292 |       (New_Field = typeMalloc(FIELD, 1)) != 0)\n  293 |     {\n  294 |       T((T_CREATE(\"field %p\"), (void *)New_Field));\n  295 |       *New_Field = default_field;\n  296 |       New_Field->rows = rows;\n  297 |       New_Field->cols = cols;\n  298 |       New_Field->drows = rows + nrow;\n  299 |       New_Field->dcols = cols;\n  300 |       New_Field->frow = frow;\n  301 |       New_Field->fcol = fcol;\n  302 |       New_Field->nrow = nrow;\n  303 |       New_Field->nbuf = nbuf;\n  304 |       New_Field->link = New_Field;\n  305 | \n  306 | #if USE_WIDEC_SUPPORT\n  307 |       New_Field->working = newpad(1, Buffer_Length(New_Field) + 1);\n  308 |       New_Field->expanded = typeCalloc(char *, 1 + (unsigned)nbuf);\n  309 | #endif\n  310 | \n  311 |       if (_nc_Copy_Type(New_Field, &default_field))\n  312 | \t{\n  313 | \t  size_t len;\n  314 | \n  315 | \t  len = Total_Buffer_Size(New_Field);\n  316 | \t  if ((New_Field->buf = (FIELD_CELL *)malloc(len)))\n  317 | \t    {\n  318 | \t      /* Prefill buffers with blanks and insert terminating zeroes\n  319 | \t         between buffers */\n  320 | \t      int i, j;\n  321 | \t      int cells = Buffer_Length(New_Field);\n  322 | \n  323 | \t      for (i = 0; i <= New_Field->nbuf; i++)\n  324 | \t\t{\n  325 | \t\t  FIELD_CELL *buffer = &(New_Field->buf[(cells + 1) * i]);\n  326 | \n  327 | \t\t  for (j = 0; j < cells; ++j)\n  328 | \t\t    {\n  329 | \t\t      buffer[j] = blank;\n  330 | \t\t    }\n  331 | \t\t  buffer[j] = zeros;\n  332 | \t\t}\n  333 | \t      returnField(New_Field);","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fld_def.c#L285-L333"}]},{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"In Check_This_Field for TYPE_INTEGER (fty_int.c), the validated value is formatted\nwith sprintf(buf, \"%.*ld\", (prec > 0 ? prec : 0), val) into a 100-byte stack buffer.\nWhen 'prec' is large (e.g. caller passes 200), the formatted output can far exceed\n100 bytes, overflowing the stack buffer 'buf'. There is no upper bound check on\nprec before the sprintf call.","fix":"Clamp precision before formatting:\n  int safe_prec = (prec > 0 && prec < 90) ? prec : 0;\n  sprintf(buf, \"%.*ld\", safe_prec, val);\nOr use snprintf with a length limit and verify the result fits.","locations":[{"ref":"payloads/libpayload/curses/form/fty_int.c:172-237","code":"  172 |   char buf[100];\n  173 |   bool result = FALSE;\n  174 | \n  175 |   while (*bp && *bp == ' ')\n  176 |     bp++;\n  177 |   if (*bp)\n  178 |     {\n  179 |       if (*bp == '-')\n  180 | \tbp++;\n  181 | #if USE_WIDEC_SUPPORT\n  182 |       if (*bp)\n  183 | \t{\n  184 | \t  bool blank = FALSE;\n  185 | \t  int len;\n  186 | \t  int n;\n  187 | \t  wchar_t *list = _nc_Widen_String((char *)bp, &len);\n  188 | \n  189 | \t  if (list != 0)\n  190 | \t    {\n  191 | \t      result = TRUE;\n  192 | \t      for (n = 0; n < len; ++n)\n  193 | \t\t{\n  194 | \t\t  if (blank)\n  195 | \t\t    {\n  196 | \t\t      if (list[n] != ' ')\n  197 | \t\t\t{\n  198 | \t\t\t  result = FALSE;\n  199 | \t\t\t  break;\n  200 | \t\t\t}\n  201 | \t\t    }\n  202 | \t\t  else if (list[n] == ' ')\n  203 | \t\t    {\n  204 | \t\t      blank = TRUE;\n  205 | \t\t    }\n  206 | \t\t  else if (!isDigit(list[n]))\n  207 | \t\t    {\n  208 | \t\t      result = FALSE;\n  209 | \t\t      break;\n  210 | \t\t    }\n  211 | \t\t}\n  212 | \t      free(list);\n  213 | \t    }\n  214 | \t}\n  215 | #else\n  216 |       while (*bp)\n  217 | \t{\n  218 | \t  if (!isdigit(UChar(*bp)))\n  219 | \t    break;\n  220 | \t  bp++;\n  221 | \t}\n  222 |       while (*bp && *bp == ' ')\n  223 | \tbp++;\n  224 |       result = (*bp == '\\0');\n  225 | #endif\n  226 |       if (result)\n  227 | \t{\n  228 | \t  val = atol(s);\n  229 | \t  if (low < high)\n  230 | \t    {\n  231 | \t      if (val < low || val > high)\n  232 | \t\tresult = FALSE;\n  233 | \t    }\n  234 | \t  if (result)\n  235 | \t    {\n  236 | \t      sprintf(buf, \"%.*ld\", (prec > 0 ? prec : 0), val);\n  237 | \t      set_field_buffer(field, 0, buf);","lines":66,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_int.c#L172-L237"}]},{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"In Check_This_Field for TYPE_NUMERIC (fty_num.c), the validated value is formatted\nwith sprintf(buf, \"%.*f\", (prec > 0 ? prec : 0), val) into a 64-byte stack buffer.\nA double can have up to ~308 integer digits plus 'prec' decimal digits. When prec\nis large or val is large, the formatted output can overflow the 64-byte buffer.","fix":"Use snprintf with the buffer size and validate the return:\n  int n = snprintf(buf, sizeof(buf), \"%.*f\", (prec > 0 ? prec : 0), val);\n  if (n >= (int)sizeof(buf)) result = FALSE;\nAlternatively increase the buffer to at least 400 bytes or clamp precision.","locations":[{"ref":"payloads/libpayload/curses/form/fty_num.c:181-275","code":"  181 | Check_This_Field(FIELD *field, const void *argp)\n  182 | {\n  183 |   const thisARG *argn = (const thisARG *)argp;\n  184 |   double low = argn->low;\n  185 |   double high = argn->high;\n  186 |   int prec = argn->precision;\n  187 |   unsigned char *bp = (unsigned char *)field_buffer(field, 0);\n  188 |   char *s = (char *)bp;\n  189 |   double val = 0.0;\n  190 |   struct lconv *L = argn->L;\n  191 |   char buf[64];\n  192 |   bool result = FALSE;\n  193 | \n  194 |   while (*bp && *bp == ' ')\n  195 |     bp++;\n  196 |   if (*bp)\n  197 |     {\n  198 |       if (*bp == '-' || *bp == '+')\n  199 | \tbp++;\n  200 | #if USE_WIDEC_SUPPORT\n  201 |       if (*bp)\n  202 | \t{\n  203 | \t  bool blank = FALSE;\n  204 | \t  int state = 0;\n  205 | \t  int len;\n  206 | \t  int n;\n  207 | \t  wchar_t *list = _nc_Widen_String((char *)bp, &len);\n  208 | \n  209 | \t  if (list != 0)\n  210 | \t    {\n  211 | \t      result = TRUE;\n  212 | \t      for (n = 0; n < len; ++n)\n  213 | \t\t{\n  214 | \t\t  if (blank)\n  215 | \t\t    {\n  216 | \t\t      if (list[n] != ' ')\n  217 | \t\t\t{\n  218 | \t\t\t  result = FALSE;\n  219 | \t\t\t  break;\n  220 | \t\t\t}\n  221 | \t\t    }\n  222 | \t\t  else if (list[n] == ' ')\n  223 | \t\t    {\n  224 | \t\t      blank = TRUE;\n  225 | \t\t    }\n  226 | \t\t  else if (isDecimalPoint(list[n]))\n  227 | \t\t    {\n  228 | \t\t      if (++state > 1)\n  229 | \t\t\t{\n  230 | \t\t\t  result = FALSE;\n  231 | \t\t\t  break;\n  232 | \t\t\t}\n  233 | \t\t    }\n  234 | \t\t  else if (!isDigit(list[n]))\n  235 | \t\t    {\n  236 | \t\t      result = FALSE;\n  237 | \t\t      break;\n  238 | \t\t    }\n  239 | \t\t}\n  240 | \t      free(list);\n  241 | \t    }\n  242 | \t}\n  243 | #else\n  244 |       while (*bp)\n  245 | \t{\n  246 | \t  if (!isdigit(UChar(*bp)))\n  247 | \t    break;\n  248 | \t  bp++;\n  249 | \t}\n  250 |       if (isDecimalPoint(*bp))\n  251 | \t{\n  252 | \t  bp++;\n  253 | \t  while (*bp)\n  254 | \t    {\n  255 | \t      if (!isdigit(UChar(*bp)))\n  256 | \t\tbreak;\n  257 | \t      bp++;\n  258 | \t    }\n  259 | \t}\n  260 |       while (*bp && *bp == ' ')\n  261 | \tbp++;\n  262 |       result = (*bp == '\\0');\n  263 | #endif\n  264 |       if (result)\n  265 | \t{\n  266 | \t  val = atof(s);\n  267 | \t  if (low < high)\n  268 | \t    {\n  269 | \t      if (val < low || val > high)\n  270 | \t\tresult = FALSE;\n  271 | \t    }\n  272 | \t  if (result)\n  273 | \t    {\n  274 | \t      sprintf(buf, \"%.*f\", (prec > 0 ? prec : 0), val);\n  275 | \t      set_field_buffer(field, 0, buf);","lines":95,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_num.c#L181-L275"}]},{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"In tinycurses.c waddch() and waddnstr(), win->_curx is incremented without checking against win->_maxx. Writing past _maxx writes into the next row's text buffer (or beyond) in the statically allocated linebuf_list, causing silent memory corruption. The comment `// FIXME` at lines 524 and 554 acknowledges this.","fix":"After incrementing win->_curx, check `if (win->_curx > win->_maxx)` and either stop writing or wrap to the next row (with corresponding _cury increment and _maxy check).","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:503-532","code":"  503 | int waddch(WINDOW *win, const chtype ch)\n  504 | {\n  505 | \tint code = ERR;\n  506 | \t// NCURSES_CH_T wch;\n  507 | \t// SetChar2(wch, ch);\n  508 | \n  509 | \tif (win->_line[win->_cury].firstchar == _NOCHANGE ||\n  510 | \t\t\twin->_line[win->_cury].firstchar > win->_curx)\n  511 | \t\twin->_line[win->_cury].firstchar = win->_curx;\n  512 | \n  513 | \twin->_line[win->_cury].text[win->_curx].chars[0] =\n  514 | \t\t((ch) & (chtype)A_CHARTEXT);\n  515 | \n  516 | \twin->_line[win->_cury].text[win->_curx].attr = WINDOW_ATTRS(win);\n  517 | \twin->_line[win->_cury].text[win->_curx].attr |=\n  518 | \t\t((ch) & (chtype)A_ATTRIBUTES);\n  519 | \n  520 | \tif (win->_line[win->_cury].lastchar == _NOCHANGE ||\n  521 | \t\t\twin->_line[win->_cury].lastchar < win->_curx)\n  522 | \t\twin->_line[win->_cury].lastchar = win->_curx;\n  523 | \n  524 | \twin->_curx++;\t// FIXME\n  525 | \n  526 | \t// if (win && (waddch_nosync(win, wch) != ERR)) {\n  527 | \t// \t_nc_synchook(win);\n  528 | \t// \tcode = OK;\n  529 | \t// }\n  530 | \n  531 | \treturn code;\n  532 | }","lines":30,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L503-L532"},{"ref":"payloads/libpayload/curses/tinycurses.c:534-568","code":"  534 | int waddnstr(WINDOW *win, const char *astr, int n)\n  535 | {\n  536 | \tint code = OK;\n  537 | \tconst char *str = astr;\n  538 | \n  539 | \tif (!str)\n  540 | \t\treturn ERR;\n  541 | \n  542 | \tif (n < 0)\n  543 | \t\tn = strlen(astr);\n  544 | \n  545 | \tif (win->_line[win->_cury].firstchar == _NOCHANGE ||\n  546 | \t\t\twin->_line[win->_cury].firstchar > win->_curx)\n  547 | \t\twin->_line[win->_cury].firstchar = win->_curx;\n  548 | \n  549 | \twhile ((n-- > 0) && (*str != '\\0')) {\n  550 | \t// while (*str != '\\0') {\n  551 | \t\twin->_line[win->_cury].text[win->_curx].chars[0] = *str++;\n  552 | \t\twin->_line[win->_cury].text[win->_curx].attr = WINDOW_ATTRS(win)\n  553 | ;\n  554 | \t\twin->_curx++;\t// FIXME\n  555 | \n  556 | \t\t// NCURSES_CH_T ch;\n  557 | \t\t// SetChar(ch, UChar(*str++), A_NORMAL);\n  558 | \t\t// if (_nc_waddch_nosync(win, ch) == ERR) {\n  559 | \t\t// \tcode = ERR;\n  560 | \t\t// \tbreak;\n  561 | \t\t// }\n  562 | \t}\n  563 | \n  564 | \tif (win->_line[win->_cury].lastchar == _NOCHANGE ||\n  565 | \t\t\twin->_line[win->_cury].lastchar < win->_curx)\n  566 | \t\twin->_line[win->_cury].lastchar = win->_curx;\n  567 | \n  568 | \treturn code;","lines":35,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L534-L568"}]},{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"In mouse_cursor.c mouse_cursor_poll(), mouse_rel_x, mouse_rel_y, and mouse_rel_z are int accumulators that are multiplied by mouse_speed (default 0x299 = 665) or 256. With multiple drivers or large raw deltas, these can overflow a 32-bit int. For example, mouse_speed * INT_MAX / 256 overflows long before reaching INT_MAX in the accumulator. No overflow protection is applied.","fix":"Clamp the accumulated values or use int64_t for the intermediates. Alternatively, call mouse_cursor_get_rel() frequently enough that values never accumulate large sums.","locations":[{"ref":"payloads/libpayload/drivers/mouse_cursor.c:89-116","code":"   89 | void mouse_cursor_poll(void)\n   90 | {\n   91 | \tstruct mouse_cursor_input_driver *in;\n   92 | \tint rel_x, rel_y, rel_z;\n   93 | \tu32 buttons;\n   94 | \n   95 | \tmouse_buttons = 0;\n   96 | \t/* Iterate over all connected drivers */\n   97 | \tfor (in = cursor_in; in != NULL; in = in->next)\n   98 | \t\tif (in->get_state) {\n   99 | \t\t\tin->get_state(&rel_x, &rel_y, &rel_z, &buttons);\n  100 | \n  101 | \t\t\t/* Accumulate relative movement */\n  102 | \t\t\tif (mouse_cusor_is_fast(rel_x, rel_y)) {\n  103 | \t\t\t\t/* Apply simple cursor acceleration. Default: x2.6 */\n  104 | \t\t\t\tmouse_rel_x += rel_x * mouse_speed;\n  105 | \t\t\t\tmouse_rel_y += rel_y * mouse_speed;\n  106 | \t\t\t\tmouse_rel_z += rel_z * mouse_speed;\n  107 | \t\t\t} else {\n  108 | \t\t\t\tmouse_rel_x += rel_x * 256;\n  109 | \t\t\t\tmouse_rel_y += rel_y * 256;\n  110 | \t\t\t\tmouse_rel_z += rel_z * 256;\n  111 | \t\t\t}\n  112 | \n  113 | \t\t\t/* Logic or all buttons */\n  114 | \t\t\tmouse_buttons |= buttons;\n  115 | \t\t}\n  116 | }","lines":28,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/mouse_cursor.c#L89-L116"}]},{"id":"OVF_22","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In dos/pdcclip.c PDC_setclipboard() and dos/pdcclip.c PDC_getclipboard(), the `length`\nparameter is typed as `long`. On platforms where `long` is 32-bit, a caller providing\na length larger than SIZE_MAX/2 would cause `malloc(length + 1)` to integer-overflow to a\nsmall value, then strcpy() would overflow the undersized buffer. Although in practice clipboard\ncontents are unlikely to be gigantic, the parameter type and the lack of a length sanity check\ncreate a latent vulnerability.","fix":"Add a sanity check such as `if (length < 0 || (size_t)length > SIZE_MAX - 1) return PDC_CLIP_MEMORY_ERROR;` before calling malloc. Consider using memcpy with the known length instead of strcpy.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/dos/pdcclip.c:71-90","code":"   71 | int PDC_setclipboard(const char *contents, long length)\n   72 | {\n   73 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n   74 | \n   75 |     if (pdc_DOS_clipboard)\n   76 |     {\n   77 |         free(pdc_DOS_clipboard);\n   78 |         pdc_DOS_clipboard = NULL;\n   79 |     }\n   80 | \n   81 |     if (contents)\n   82 |     {\n   83 |         if ((pdc_DOS_clipboard = malloc(length + 1)) == NULL)\n   84 |             return PDC_CLIP_MEMORY_ERROR;\n   85 | \n   86 |         strcpy(pdc_DOS_clipboard, contents);\n   87 |     }\n   88 | \n   89 |     return PDC_CLIP_SUCCESS;\n   90 | }","lines":20,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/dos/pdcclip.c#L71-L90"},{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcclip.c:101-149","code":"  101 | int PDC_setclipboard(const char *contents, long length)\n  102 | {\n  103 | #ifndef EMXVIDEO\n  104 |     HAB hab;\n  105 |     PTIB ptib;\n  106 |     PPIB ppib;\n  107 |     ULONG ulRC;\n  108 |     PSZ szTextOut = NULL;\n  109 |     int rc;\n  110 | #endif\n  111 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n  112 | \n  113 | #ifndef EMXVIDEO\n  114 |     DosGetInfoBlocks(&ptib, &ppib);\n  115 |     ppib->pib_ultype = 3;\n  116 |     hab = WinInitialize(0);\n  117 | \n  118 |     if (!WinOpenClipbrd(hab))\n  119 |     {\n  120 |         WinTerminate(hab);\n  121 |         return PDC_CLIP_ACCESS_ERROR;\n  122 |     }\n  123 | \n  124 |     rc = PDC_CLIP_MEMORY_ERROR;\n  125 | \n  126 |     ulRC = DosAllocSharedMem((PVOID)&szTextOut, NULL, length + 1,\n  127 |                              PAG_WRITE | PAG_COMMIT | OBJ_GIVEABLE);\n  128 | \n  129 |     if (ulRC == 0)\n  130 |     {\n  131 |         strcpy(szTextOut, contents);\n  132 |         WinEmptyClipbrd(hab);\n  133 | \n  134 |         if (WinSetClipbrdData(hab, (ULONG)szTextOut, CF_TEXT, CFI_POINTER))\n  135 |             rc = PDC_CLIP_SUCCESS;\n  136 |         else\n  137 |         {\n  138 |             DosFreeMem(szTextOut);\n  139 |             rc = PDC_CLIP_ACCESS_ERROR;\n  140 |         }\n  141 |     }\n  142 | \n  143 |     WinCloseClipbrd(hab);\n  144 |     WinTerminate(hab);\n  145 | \n  146 |     return rc;\n  147 | #else\n  148 |     return PDC_CLIP_ACCESS_ERROR;\n  149 | #endif","lines":49,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcclip.c#L101-L149"}]},{"id":"OVF_23","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In options.c options_checksum_valid() and fix_options_checksum_with(), checksum_location is computed as (u32 cmos_checksum_location) / 8 and stored as int. It is then passed to nvram->read(checksum_location) and nvram->read(checksum_location+1). The nvram_accessor read function takes a u8 parameter, so any byte address above 255 is silently truncated. If coreboot reports a checksum location above byte 255, the wrong bytes are read/written, corrupting the checksum calculation silently.","fix":"Assert or check that checksum_location <= 254 (to allow checksum_location+1 to fit in u8), and return an error if not. Alternatively, extend the nvram_accessor interface to accept u16 addresses.","locations":[{"ref":"payloads/libpayload/drivers/options.c:62-77","code":"   62 | int options_checksum_valid(const struct nvram_accessor *nvram)\n   63 | {\n   64 | \tint i;\n   65 | \tint range_start = lib_sysinfo.cmos_range_start / 8;\n   66 | \tint range_end = lib_sysinfo.cmos_range_end / 8;\n   67 | \tint checksum_location = lib_sysinfo.cmos_checksum_location / 8;\n   68 | \tu16 checksum = 0, checksum_old;\n   69 | \n   70 | \tfor(i = range_start; i <= range_end; i++) {\n   71 | \t\tchecksum += nvram->read(i);\n   72 | \t}\n   73 | \n   74 | \tchecksum_old = ((nvram->read(checksum_location)<<8) | nvram->read(checksum_location+1));\n   75 | \n   76 | \treturn (checksum_old == checksum);\n   77 | }","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L62-L77"},{"ref":"payloads/libpayload/drivers/options.c:79-93","code":"   79 | void fix_options_checksum_with(const struct nvram_accessor *nvram)\n   80 | {\n   81 | \tint i;\n   82 | \tint range_start = lib_sysinfo.cmos_range_start / 8;\n   83 | \tint range_end = lib_sysinfo.cmos_range_end / 8;\n   84 | \tint checksum_location = lib_sysinfo.cmos_checksum_location / 8;\n   85 | \tu16 checksum = 0;\n   86 | \n   87 | \tfor(i = range_start; i <= range_end; i++) {\n   88 | \t\tchecksum += nvram->read(i);\n   89 | \t}\n   90 | \n   91 | \tnvram->write((checksum >> 8), checksum_location);\n   92 | \tnvram->write((checksum & 0xff), checksum_location + 1);\n   93 | }","lines":15,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L79-L93"}]},{"id":"OVF_24","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In options.c get_cmos_value(), when the single-byte path is taken (len <= 8), the mask (1 << len) - 1 is computed with int arithmetic. If len == 8, 1 << 8 = 256, which fits in int but (1 << 8) - 1 = 0xFF. However if len == 32, 1 << 32 is undefined behavior in C (shift count >= width of type). The function only guards len <= 8 for this path, so len=32 does not reach here, but a future change loosening the guard could introduce UB.","fix":"Use (1u << len) - 1 and add a static_assert or runtime check that len <= 8 before this expression.","locations":[{"ref":"payloads/libpayload/drivers/options.c:112-116","code":"  112 | \tif(len <= 8) {\n  113 | \t\treg8 = nvram->read(addr);\n  114 | \t\treg8 >>= bit;\n  115 | \t\tvalue[0] = reg8 & ((1 << len) -1);\n  116 | \t\treturn 0;","lines":5,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L112-L116"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"The quicksort implementation in pci_module.c has infinite recursion when partition() returns 0. This happens whenever all elements in the subarray are >= the pivot (e.g., all devices have equal BDF values, or two identical PCI devices exist). When partition returns 0: quicksort(list, 0) terminates immediately, but quicksort(&list[0], len - 0) is the same call with identical arguments, causing infinite recursion and a stack overflow. This can occur on systems with multiple functions of the same device appearing in CBFS scan order.","fix":"After partition, skip the recursive call if the pivot is at the start or end of the sub-range: quicksort(list, index) is already safe. For the right call, use: if (index + 1 < len) quicksort(&list[index + 1], len - index - 1). This excludes the pivot element (which is already in its final sorted position at list[index] after the swap on line 54).","locations":[{"ref":"payloads/coreinfo/pci_module.c:59-70","code":"   59 | static void quicksort(struct pci_devices *list, int len)\n   60 | {\n   61 | \tint index;\n   62 | \n   63 | \tif (len <= 1)\n   64 | \t\treturn;\n   65 | \n   66 | \tindex = partition(list, len);\n   67 | \n   68 | \tquicksort(list, index);\n   69 | \tquicksort(&(list[index]), len - index);\n   70 | }","lines":12,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/pci_module.c#L59-L70"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"mb_parse_mmap() advances ptr by mmap->size + sizeof(mmap->size). If a bootloader provides a corrupt mmap entry with size == 0, ptr never advances and the while loop spins forever. There is no lower bound check on mmap->size before the pointer arithmetic.","fix":"Add a guard: if (mmap->size < sizeof(*mmap) - sizeof(mmap->size)) break; (or return) before advancing ptr, to reject malformed entries and prevent an infinite loop.","locations":[{"ref":"payloads/libpayload/arch/x86/multiboot.c:64-71","code":"   64 | \twhile(ptr < (start + table->mmap_length)) {\n   65 | \t\tstruct multiboot_mmap *mmap = (struct multiboot_mmap *) ptr;\n   66 | \n   67 | \t\tif (mb_add_memrange(info, mmap->addr, mmap->length, mmap->type))\n   68 | \t\t\treturn;\n   69 | \n   70 | \t\tptr += (mmap->size + sizeof(mmap->size));\n   71 | \t}","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/multiboot.c#L64-L71"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"In dos/pdcscrn.c _query_adapter_type(), BIOS INT 10h function 0x1a00 (VGA Identify Adapter) returns the\nactive display type in BL, not AL (AL is only used to confirm the function was handled, returning 0x1a).\nThe code checks regs.h.al == 0x1a correctly, but then switches on regs.h.al again, which is always 0x1a\nat that point. The adapter type from BL is never read. Every supported adapter type (MDA, CGA, EGA,\nVGA, MCGA) is thus dead code in the switch, and the default branch always fires, returning _CGA.\nThis causes incorrect adapter detection on all platforms when the VGA BIOS is present.","fix":"Change `switch (regs.h.al)` at line 304 to `switch (regs.h.bl)`. BL holds the active display combination code per the VGA BIOS spec.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/dos/pdcscrn.c:300-339","code":"  300 |     if ((regs.h.al == 0x1a) && (retval == _NONE))\n  301 |     {\n  302 |         /* We know that the PS/2 video BIOS is alive and well. */\n  303 | \n  304 |         switch (regs.h.al)\n  305 |         {\n  306 |         case 0:\n  307 |             retval = _NONE;\n  308 |             break;\n  309 |         case 1:\n  310 |             retval = _MDA;\n  311 |             break;\n  312 |         case 2:\n  313 |             retval = _CGA;\n  314 |             break;\n  315 |         case 4:\n  316 |             retval = _EGACOLOR;\n  317 |             sizeable = TRUE;\n  318 |             break;\n  319 |         case 5:\n  320 |             retval = _EGAMONO;\n  321 |             break;\n  322 |         case 26:            /* ...alt. VGA BIOS... */\n  323 |         case 7:\n  324 |             retval = _VGACOLOR;\n  325 |             sizeable = TRUE;\n  326 |             break;\n  327 |         case 8:\n  328 |             retval = _VGAMONO;\n  329 |             break;\n  330 |         case 10:\n  331 |         case 13:\n  332 |             retval = _MCGACOLOR;\n  333 |             break;\n  334 |         case 12:\n  335 |             retval = _MCGAMONO;\n  336 |             break;\n  337 |         default:\n  338 |             retval = _CGA;\n  339 |         }","lines":40,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/dos/pdcscrn.c#L300-L339"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"In os2/pdcscrn.c, the _screen_mode_equals() function compares the horizontal and vertical\nresolution fields incorrectly. Line 266 compares current.hres against oldmode->vres instead\nof oldmode->hres. This means the horizontal resolution is never truly compared, and the\nfunction may incorrectly return TRUE (modes are equal) when the horizontal resolution differs,\nor FALSE when it matches, leading to unnecessary or missed mode switches during screen restore.","fix":"Change `current.hres == oldmode->vres` to `current.hres == oldmode->hres` on line 266.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcscrn.c:255-268","code":"  255 | static bool _screen_mode_equals(VIOMODEINFO *oldmode)\n  256 | {\n  257 |     VIOMODEINFO current = {0};\n  258 | \n  259 |     VioGetMode(&current, 0);\n  260 | \n  261 |     return ((current.cb == oldmode->cb) &&\n  262 |             (current.fbType == oldmode->fbType) &&\n  263 |             (current.color == oldmode->color) &&\n  264 |             (current.col == oldmode->col) &&\n  265 |             (current.row == oldmode->row) &&\n  266 |             (current.hres == oldmode->vres) &&\n  267 |             (current.vres == oldmode->vres));\n  268 | }","lines":14,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcscrn.c#L255-L268"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In pdcurses/addch.c waddch(), the default case for control characters (non-printable ASCII\nother than special cases) calls `waddch(win, ch + '@')` to display the caret notation second\ncharacter. However `ch` here is the original chtype which includes both the text byte AND all\nattribute bits (color pair, bold, etc.). Adding '@' (0x40) to the full chtype corrupts the\nattribute field when high attribute bits are set, producing wrong colors or visual artifacts.\nThe 0x7f case correctly uses `attr | '?'`, but the general control-char case does not follow\nthe same pattern.","fix":"Replace `waddch(win, ch + '@')` with `waddch(win, attr | (text + '@'))` to apply only the text increment while preserving the original attributes.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/addch.c:188-196","code":"  188 | \n  189 |         default:\n  190 |             /* handle control chars */\n  191 | \n  192 |             if (waddch(win, attr | '^') == ERR)\n  193 |                 return ERR;\n  194 | \n  195 |             return waddch(win, ch + '@');\n  196 |         }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/addch.c#L188-L196"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In initscr.c, the ripped-off line initialization loop (lines 178-188) calls newwin() for each ripped-off line and passes the result directly to (*linesripped[i].init)() without checking if newwin() returned NULL. A NULL WINDOW pointer is passed to the user callback, likely causing a crash.","fix":"Check the return value of newwin() in the loop; call exit() or return NULL on allocation failure, consistent with how curscr and pdc_lastscr are handled.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/initscr.c:178-188","code":"  178 |     for (i = 0; i < linesrippedoff; i++)\n  179 |     {\n  180 |         if (linesripped[i].line < 0)\n  181 |             (*linesripped[i].init)(newwin(1, COLS, LINES - 1, 0), COLS);\n  182 |         else\n  183 |             (*linesripped[i].init)(newwin(1, COLS,\n  184 |                                    SP->linesrippedoffontop++, 0), COLS);\n  185 | \n  186 |         SP->linesrippedoff++;\n  187 |         LINES--;\n  188 |     }","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/initscr.c#L178-L188"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"pnoutrefresh() checks (sy2 >= COLS) instead of (sx2 >= COLS). The condition at line 178 reads '(sy2 >= LINES) || (sy2 >= COLS)' - both checks test sy2. The second check should test sx2 against COLS. As written, sx2 is never validated against the screen width, so a caller with sx2 >= COLS will not get ERR. The subsequent memcpy at line 199 writes curscr->_y[sline] + sx1 for num_cols columns, where num_cols = min(sx2-sx1+1, w->_maxx-px). If sx2 is very large, num_cols can exceed COLS - sx1, writing past the end of the curscr row buffer.","fix":"Change the second condition from (sy2 >= COLS) to (sx2 >= COLS): 'if (!w || !(w->_flags & (_PAD|_SUBPAD)) || (sy2 >= LINES) || (sx2 >= COLS))'","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/pad.c:178-200","code":"  178 |     if (!w || !(w->_flags & (_PAD|_SUBPAD)) || (sy2 >= LINES) || (sy2 >= COLS))\n  179 |         return ERR;\n  180 | \n  181 |     if (py < 0)\n  182 |         py = 0;\n  183 |     if (px < 0)\n  184 |         px = 0;\n  185 |     if (sy1 < 0)\n  186 |         sy1 = 0;\n  187 |     if (sx1 < 0)\n  188 |         sx1 = 0;\n  189 | \n  190 |     if (sy2 < sy1 || sx2 < sx1)\n  191 |         return ERR;\n  192 | \n  193 |     num_cols = min((sx2 - sx1 + 1), (w->_maxx - px));\n  194 | \n  195 |     while (sline <= sy2)\n  196 |     {\n  197 |         if (pline < w->_maxy)\n  198 |         {\n  199 |             memcpy(curscr->_y[sline] + sx1, w->_y[pline] + px,\n  200 |                    num_cols * sizeof(chtype));","lines":23,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/pad.c#L178-L200"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"`_nc_Copy_Argument()` recurses incorrectly for linked field types. On lines 148-149\nit passes the parent `typ` (the linked composite type) to both recursive calls,\ninstead of passing `typ->left` and `typ->right` respectively, as every other\nfunction in this file does. Compare with `_nc_Make_Argument()` (lines 100-101) and\n`_nc_Free_Argument()` (lines 190-191) which both correctly forward `typ->left` and\n`typ->right`. The consequence is that the recursive calls re-enter the\n`_LINKED_TYPE` branch with a non-linked TypeArgument (the left/right sub-argument),\ncausing incorrect behaviour and potential NULL-pointer dereference or memory\ncorruption when types with arguments are linked via `link_fieldtype()`.","fix":"Replace:\n  p->left  = _nc_Copy_Argument(typ,       argp->left,  err);\n  p->right = _nc_Copy_Argument(typ,       argp->right, err);\nwith:\n  p->left  = _nc_Copy_Argument(typ->left,  argp->left,  err);\n  p->right = _nc_Copy_Argument(typ->right, argp->right, err);","locations":[{"ref":"payloads/libpayload/curses/form/fld_def.c:148-149","code":"  148 | \t      p->left = _nc_Copy_Argument(typ, argp->left, err);\n  149 | \t      p->right = _nc_Copy_Argument(typ, argp->right, err);","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fld_def.c#L148-L149"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"Adjust_Cursor_Position computes the column from a buffer offset using field->cols instead of field->dcols. For a dynamic (scrollable) field dcols > cols, so the division remainder is wrong: curcol = idx - cols * currow gives a value larger than dcols-1 when idx falls in a dynamically grown column range. This corrupts the cursor position after any word-navigation or field-begin/end operation on a grown single-line field.","fix":"Change 'form->curcol = idx - field->cols * form->currow;' to 'form->curcol = idx - field->dcols * form->currow;' to match the dcols-wide row stride used everywhere else.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:466-468","code":"  466 |   form->currow = idx / field->dcols;\n  467 |   form->curcol = idx - field->cols * form->currow;\n  468 | #endif","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L466-L468"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"FE_Delete_Word passes a wrong (always non-positive) length to myADDNSTR. The expression '(int)(s - After_End_Of_Data(s, (int)(ep - s)))' subtracts a pointer that is >= s from s, yielding a value <= 0. When negative it is passed to waddnstr() as the length, which in many curses implementations treats a negative n as 'print all', potentially overflowing the line. The intent appears to be to copy the remainder of the line after the deleted word; the correct pointer arithmetic should be 'After_End_Of_Data(s, (int)(ep - s)) - s'.","fix":"Replace 'myADDNSTR(form->w, s, (int)(s - After_End_Of_Data(s, (int)(ep - s))));' with 'myADDNSTR(form->w, s, (int)(After_End_Of_Data(s, (int)(ep - s)) - s));'.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:2848-2855","code":" 2848 |   s = Get_First_Whitespace_Character(cp, (int)(ep - cp));\n 2849 |   /* to begin of next word    */\n 2850 |   s = Get_Start_Of_Data(s, (int)(ep - s));\n 2851 |   if ((s != cp) && !ISBLANK(*s))\n 2852 |     {\n 2853 |       /* copy remaining line to window */\n 2854 |       myADDNSTR(form->w, s, (int)(s - After_End_Of_Data(s, (int)(ep - s))));\n 2855 |     }","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L2848-L2855"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"In Is_Sub_String (case-sensitive branch), 'part++' is placed OUTSIDE the while-loop body,\nexecuting unconditionally once after the loop regardless of how the loop exited.\nIn the IgnoreCaseFlag branch, 'part++' is correctly inside the loop.\nThe result is: in case-sensitive mode, 'part' is always advanced by one extra position\nbefore the final check '(*part) ? FALSE : TRUE'. This makes single-character patterns\nalways appear to match (part ends at '\\0' after one extra increment), and makes\nmulti-character patterns report false negatives for correct matches, breaking\nthe pattern-search navigation in menu_driver.","fix":"Move 'part++' inside the while loop body for the case-sensitive branch, matching\nthe structure of the IgnoreCaseFlag branch:\n  while (*string && *part)\n    {\n      if (*part != *string++)\n        break;\n      part++;\n    }","locations":[{"ref":"payloads/libpayload/curses/menu/m_driver.c:82-89","code":"   82 |   else\n   83 |     {\n   84 |       while (*string && *part)\n   85 | \tif (*part != *string++)\n   86 | \t  break;\n   87 |       part++;\n   88 |     }\n   89 |   return ((*part) ? FALSE : TRUE);","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_driver.c#L82-L89"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In m_post.c _nc_Post_Item(), after entering the spc_rows > 1 block (line 154), isfore is turned off via wattroff and then the code turns on menu->back. Later at line 177 it checks `if (!isback) wattroff(menu->back)`. However, the `isback` flag was NOT set inside the spc_rows block even though menu->back attribute was turned on there, so wattroff for back is correctly called - but isfore was cleared inside the block (line 162-163) without clearing the outer `isfore` variable in sync. The outer attribute-removal block at lines 183-188 may then call `wattroff(fore)` again with isfore still TRUE if the code path through spc_rows did not clear it. Double wattroff calls on a color-pair attribute can corrupt terminal state on some implementations.","fix":"Inside the spc_rows > 1 block, after calling `wattroff(menu->fore)` or `wattroff(menu->grey)`, also set `isfore = FALSE` / `isgrey = FALSE` so the final cleanup at lines 183-188 does not repeat the wattroff.","locations":[{"ref":"payloads/libpayload/curses/menu/m_post.c:154-188","code":"  154 |       if (menu->spc_rows > 1)\n  155 | \t{\n  156 | \t  int j, k, ncy, ncx;\n  157 | \n  158 | \t  assert(cx >= 0 && cy >= 0);\n  159 | \t  getyx(menu->win, ncy, ncx);\n  160 | \t  if (isgrey)\n  161 | \t    wattroff(menu->win, menu->grey);\n  162 | \t  else if (isfore)\n  163 | \t    wattroff(menu->win, menu->fore);\n  164 | \t  wattron(menu->win, menu->back);\n  165 | \t  for (j = 1; j < menu->spc_rows; j++)\n  166 | \t    {\n  167 | \t      if ((item_y + j) < getmaxy(menu->win))\n  168 | \t\t{\n  169 | \t\t  wmove(menu->win, item_y + j, item_x);\n  170 | \t\t  for (k = 0; k < count; k++)\n  171 | \t\t    waddch(menu->win, ' ');\n  172 | \t\t}\n  173 | \t      if ((cy + j) < getmaxy(menu->win))\n  174 | \t\t(void)mvwaddch(menu->win, cy + j, cx - 1, menu->pad);\n  175 | \t    }\n  176 | \t  wmove(menu->win, ncy, ncx);\n  177 | \t  if (!isback)\n  178 | \t    wattroff(menu->win, menu->back);\n  179 | \t}\n  180 |     }\n  181 | \n  182 |   /* Remove attributes */\n  183 |   if (isfore)\n  184 |     wattroff(menu->win, menu->fore);\n  185 |   if (isback)\n  186 |     wattroff(menu->win, menu->back);\n  187 |   if (isgrey)\n  188 |     wattroff(menu->win, menu->grey);","lines":35,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_post.c#L154-L188"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In mouse.c insert_buf(), mouse_buf_idx is incremented without bounds checking against sizeof(mouse_buf) (which is 4). If the PS/2 stream becomes desynchronized and sends many bytes with bit 3 set, or if mouse_decode() is never called to reset mouse_buf_idx, mouse_buf_idx can exceed 3 and the write `mouse_buf[mouse_buf_idx++] = c` on line 171 overflows the 4-byte static array, corrupting adjacent static variables (x_axis, y_axis, etc.).","fix":"Add a bounds check before writing: `if (mouse_buf_idx >= sizeof(mouse_buf)) { mouse_buf_idx = 0; return; }` inside insert_buf(), before the assignment.","locations":[{"ref":"payloads/libpayload/drivers/i8042/mouse.c:164-172","code":"  164 | static void insert_buf(unsigned char c)\n  165 | {\n  166 | \t/* Validate input:\n  167 | \t * First byte shall have bit 3 set ! */\n  168 | \tif (!mouse_buf_idx && !(c & 8))\n  169 | \t\treturn;\n  170 | \n  171 | \tmouse_buf[mouse_buf_idx++] = c;\n  172 | }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/i8042/mouse.c#L164-L172"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In cpuinfo_module.c, do_name() fills a 49-byte stack buffer with CPU brand string data (up to 48 bytes written across three CPUID calls, 16 bytes each), but never writes a null terminator. When all three CPUID leaves return non-zero eax values, p advances to name+48, and name[48] is never set to '\\0'. The buffer is then passed to mvwprintw as a '%s' format, causing it to read past the end of the buffer until a null byte is found in adjacent stack memory.","fix":"Add explicit null termination before the mvwprintw call: name[48] = '\\0'; Alternatively, change the array to char name[49] = {0}; to zero-initialize it.","locations":[{"ref":"payloads/coreinfo/cpuinfo_module.c:138-161","code":"  138 | \tchar name[49], *p;\n  139 | \tuint32_t eax, ebx, ecx, edx;\n  140 | \tint t;\n  141 | \n  142 | \tp = name;\n  143 | \n  144 | \tfor (uint32_t i = 0x80000002; i <= 0x80000004; i++) {\n  145 | \t\tdocpuid(i, &eax, &ebx, &ecx, &edx);\n  146 | \n  147 | \t\tif (eax == 0)\n  148 | \t\t\tbreak;\n  149 | \n  150 | \t\tfor (t = 0; t < 4; t++)\n  151 | \t\t\t*p++ = eax >> (8 * t);\n  152 | \t\tfor (t = 0; t < 4; t++)\n  153 | \t\t\t*p++ = ebx >> (8 * t);\n  154 | \t\tfor (t = 0; t < 4; t++)\n  155 | \t\t\t*p++ = ecx >> (8 * t);\n  156 | \t\tfor (t = 0; t < 4; t++)\n  157 | \t\t\t*p++ = edx >> (8 * t);\n  158 | \t}\n  159 | \n  160 | \tmvwprintw(win, row, 1, \"Processor: %s\", name);\n  161 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/cpuinfo_module.c#L138-L161"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In multiboot_module_init(), parse_header(mbaddr) is called unconditionally even when sysinfo_have_multiboot() returns 0 (no multiboot tables found). When tables_good == 0, mbaddr is set to 0 by sysinfo_have_multiboot(), and parse_header(0) casts the address 0 to struct multiboot_header*, reading flags and mmap_addr from the null address. On bare-metal this is a null pointer dereference causing undefined behavior (or a crash on systems with memory protection).","fix":"Guard parse_header with the tables_good check: if (tables_good) parse_header(mbaddr); This mirrors the pattern used in the redraw function.","locations":[{"ref":"payloads/coreinfo/multiboot_module.c:83-91","code":"   83 | static int multiboot_module_init(void)\n   84 | {\n   85 | \tunsigned long mbaddr;\n   86 | \ttables_good = sysinfo_have_multiboot(&mbaddr);\n   87 | \n   88 | \tparse_header(mbaddr);\n   89 | \n   90 | \treturn tables_good ? 0 : -1;\n   91 | }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/multiboot_module.c#L83-L91"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In pci_module_redraw(), show_config_space() is called unconditionally with menu_selected (which is 0 initially) even when devices_index == 0 (no PCI devices found). This causes pci_read_config8() to be called with devices[0].device which is uninitialized, resulting in reading arbitrary I/O port addresses and potentially causing hardware issues or incorrect display.","fix":"Guard the call: if (devices_index > 0) show_config_space(win, 4, 26, menu_selected);","locations":[{"ref":"payloads/coreinfo/pci_module.c:149","code":"  149 | \tshow_config_space(win, 4, 26, menu_selected);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/pci_module.c#L149"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In multiboot.c mb_parse_cmdline(), the function reads a character pointer from phys_to_virt(table->cmdline) with no check that MULTIBOOT_FLAGS_CMDLINE is actually set or that the translated pointer is non-NULL/valid. get_multiboot_info() does gate this call behind a flag check (line 123), but if the flag is set and cmdline is 0 (a null physical address), phys_to_virt(0) may return a usable virtual address pointing to the zero page, causing reads from arbitrary low memory while parsing the command line.","fix":"Validate that table->cmdline is non-zero before calling phys_to_virt and dereferencing c.","locations":[{"ref":"payloads/libpayload/arch/x86/multiboot.c:89-105","code":"   89 | static void mb_parse_cmdline(struct multiboot_header *table)\n   90 | {\n   91 | \textern int main_argc;\n   92 | \textern char *main_argv[];\n   93 | \tchar *c = phys_to_virt(table->cmdline);\n   94 | \n   95 | \twhile(*c != '\\0' && main_argc < MAX_ARGC_COUNT) {\n   96 | \t\tmain_argv[main_argc++] = c;\n   97 | \n   98 | \t\tfor( ; *c != '\\0' && !isspace(*c); c++);\n   99 | \n  100 | \t\tif (*c) {\n  101 | \t\t\t*c = 0;\n  102 | \t\t\tc++;\n  103 | \t\t}\n  104 | \t}\n  105 | }","lines":17,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/multiboot.c#L89-L105"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In os2/pdcclip.c, PDC_clearclipboard() calls WinEmptyClipbrd(hab) without first calling\nWinOpenClipbrd(hab). On OS/2 PM, the clipboard must be opened by the caller before it can be\nemptied; calling WinEmptyClipbrd on an unopened clipboard is an error that is silently ignored\nhere. As a result, PDC_clearclipboard() never actually clears the OS/2 system clipboard. By\ncontrast, PDC_setclipboard() correctly calls WinOpenClipbrd before modifying it.","fix":"Add `if (!WinOpenClipbrd(hab)) { WinTerminate(hab); return PDC_CLIP_ACCESS_ERROR; }` after WinInitialize and before WinEmptyClipbrd, and add WinCloseClipbrd after emptying (it is already present in the current code).","locations":[{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcclip.c:162-185","code":"  162 | int PDC_clearclipboard(void)\n  163 | {\n  164 | #ifndef EMXVIDEO\n  165 |     HAB hab;\n  166 |     PTIB ptib;\n  167 |     PPIB ppib;\n  168 | #endif\n  169 |     PDC_LOG((\"PDC_clearclipboard() - called\\n\"));\n  170 | \n  171 | #ifndef EMXVIDEO\n  172 |     DosGetInfoBlocks(&ptib, &ppib);\n  173 |     ppib->pib_ultype = 3;\n  174 |     hab = WinInitialize(0);\n  175 | \n  176 |     WinEmptyClipbrd(hab);\n  177 | \n  178 |     WinCloseClipbrd(hab);\n  179 |     WinTerminate(hab);\n  180 | \n  181 |     return PDC_CLIP_SUCCESS;\n  182 | #else\n  183 |     return PDC_CLIP_ACCESS_ERROR;\n  184 | #endif\n  185 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcclip.c#L162-L185"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In os2/pdckbd.c PDC_get_key(), the variable keyInfo (of type KBDKEYINFO) is declared only\ninside `#ifndef EMXVIDEO` (line 321), but it is used unconditionally at line 419 outside any\npreprocessor guard:\n    if (keyInfo.fsState & (KBDSTF_LEFTSHIFT|KBDSTF_RIGHTSHIFT))\nWhen compiling with EMXVIDEO defined, `keyInfo` is not in scope at that point, causing a\ncompile error (or if the compiler tolerates it, undefined behavior from an uninitialized\nvariable). Shift-key detection for modifier keys is therefore broken or non-compilable in\nthe EMXVIDEO path.","fix":"Wrap the `if (keyInfo.fsState & ...)` block and the shift-key switch at lines 419-453 in `#ifndef EMXVIDEO ... #endif`, similar to the rest of the OS/2-specific keyboard handling.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/os2/pdckbd.c:319-322","code":"  319 |     int key, scan;\n  320 | #ifndef EMXVIDEO\n  321 |     KBDKEYINFO keyInfo = {0};\n  322 | #endif","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdckbd.c#L319-L322"},{"ref":"payloads/libpayload/curses/PDCurses/os2/pdckbd.c:419-453","code":"  419 |     if (keyInfo.fsState & (KBDSTF_LEFTSHIFT|KBDSTF_RIGHTSHIFT))\n  420 |     {\n  421 |         switch (key)\n  422 |         {\n  423 |         case KEY_HOME:  /* Shift Home */\n  424 |             key = KEY_SHOME;\n  425 |             break;\n  426 |         case KEY_UP:    /* Shift Up */\n  427 |             key = KEY_SUP;\n  428 |             break;\n  429 |         case KEY_PPAGE: /* Shift PgUp */\n  430 |             key = KEY_SPREVIOUS;\n  431 |             break;\n  432 |         case KEY_LEFT:  /* Shift Left */\n  433 |             key = KEY_SLEFT;\n  434 |             break;\n  435 |         case KEY_RIGHT: /* Shift Right */\n  436 |             key = KEY_SRIGHT;\n  437 |             break;\n  438 |         case KEY_END:   /* Shift End */\n  439 |             key = KEY_SEND;\n  440 |             break;\n  441 |         case KEY_DOWN:  /* Shift Down */\n  442 |             key = KEY_SDOWN;\n  443 |             break;\n  444 |         case KEY_NPAGE: /* Shift PgDn */\n  445 |             key = KEY_SNEXT;\n  446 |             break;\n  447 |         case KEY_IC:    /* Shift Ins */\n  448 |             key = KEY_SIC;\n  449 |             break;\n  450 |         case KEY_DC:    /* Shift Del */\n  451 |             key = KEY_SDC;\n  452 |         }\n  453 |     }","lines":35,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdckbd.c#L419-L453"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In wchgat() (attr.c line 304), when n < 0, endpos is computed as 'win->_maxx - 1'. But startpos is win->_curx, which could equal win->_maxx (cursor at rightmost position). In that case, endpos (win->_maxx - 1) < startpos, so the for loop body never executes, but the code then unconditionally updates _firstch and _lastch using startpos and endpos. Since endpos < startpos, _lastch[n] = endpos = win->_maxx-1 may be set to a value smaller than startpos, corrupting the dirty region tracking. Additionally when n >= 0, 'min(startpos + n, win->_maxx) - 1' can yield -1 when startpos=0 and n=0, causing endpos=-1 and the for loop to be skipped, but again the firstch/lastch update runs unconditionally.","fix":"Guard the firstch/lastch update block with 'if (startpos <= endpos)' to avoid updating the dirty region when the range is empty.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/attr.c:291-321","code":"  291 | int wchgat(WINDOW *win, int n, attr_t attr, short color, const void *opts)\n  292 | {\n  293 |     chtype *dest, newattr;\n  294 |     int startpos, endpos;\n  295 | \n  296 |     PDC_LOG((\"wchgat() - called\\n\"));\n  297 | \n  298 |     if (!win)\n  299 |         return ERR;\n  300 | \n  301 |     newattr = (attr & A_ATTRIBUTES) | COLOR_PAIR(color);\n  302 | \n  303 |     startpos = win->_curx;\n  304 |     endpos = ((n < 0) ? win->_maxx : min(startpos + n, win->_maxx)) - 1;\n  305 |     dest = win->_y[win->_cury];\n  306 | \n  307 |     for (n = startpos; n <= endpos; n++)\n  308 |         dest[n] = (dest[n] & A_CHARTEXT) | newattr;\n  309 | \n  310 |     n = win->_cury;\n  311 | \n  312 |     if (startpos < win->_firstch[n] || win->_firstch[n] == _NO_CHANGE)\n  313 |         win->_firstch[n] = startpos;\n  314 | \n  315 |     if (endpos > win->_lastch[n])\n  316 |         win->_lastch[n] = endpos;\n  317 | \n  318 |     PDC_sync(win);\n  319 | \n  320 |     return OK;\n  321 | }","lines":31,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/attr.c#L291-L321"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"wclrtoeol() dereferences win->_cury before checking whether 'win' is NULL (line 56 calls win->_cury and win->_curx inside PDC_LOG before the NULL check on line 58). PDC_LOG is a macro that may expand to a fprintf involving the arguments; on many builds it expands to nothing, so this is benign in practice. However, the pattern is dangerous: the NULL guard appears after the first field access, violating the usual convention.","fix":"Move the 'if (!win) return ERR;' check to before the PDC_LOG call, or ensure PDC_LOG does not dereference win.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/clear.c:50-59","code":"   50 | int wclrtoeol(WINDOW *win)\n   51 | {\n   52 |     int x, y, minx;\n   53 |     chtype blank, *ptr;\n   54 | \n   55 |     PDC_LOG((\"wclrtoeol() - called: Row: %d Col: %d\\n\",\n   56 |              win->_cury, win->_curx));\n   57 | \n   58 |     if (!win)\n   59 |         return ERR;","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/clear.c#L50-L59"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In color.c, start_color() calls 'memset(pair_set, 0, PDC_COLOR_PAIRS)' (line 124). pair_set is an array of bool, not char. On platforms where sizeof(bool) > 1, this only zeroes the first byte of each bool element, potentially leaving garbage in the remaining bytes. The correct call is 'memset(pair_set, 0, sizeof(pair_set))'.","fix":"Change to 'memset(pair_set, 0, sizeof(pair_set));' to correctly zero all bytes of the bool array.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/color.c:124","code":"  124 |     memset(pair_set, 0, PDC_COLOR_PAIRS);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/color.c#L124"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In color.c, init_pair() validates fg and bg against 'first_col' (line 143). When use_default_colors() has been called, first_col is set to -1, which means the lower bound check 'fg < first_col' becomes 'fg < -1'. Since fg is a short, negative values fg == -1 (meaning 'use default') would pass the check, but fg == -2 or lower would be incorrectly accepted. The intent is to allow -1 but not other negatives, yet this is not enforced.","fix":"When first_col == -1, explicitly allow fg >= -1 and bg >= -1 rather than using the generic 'fg < first_col' comparison.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/color.c:142-144","code":"  142 |     if (!pdc_color_started || pair < 1 || pair >= COLOR_PAIRS ||\n  143 |         fg < first_col || fg >= COLORS || bg < first_col || bg >= COLORS)\n  144 |         return ERR;","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/color.c#L142-L144"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In wdeleteln() (deleteln.c), the inner loop at line 69 runs 'for (y = win->_cury; y < win->_bmarg; y++)'. This stops at _bmarg-1 (exclusive), so it does not shift the line at _bmarg upward. Then at line 79, 'if (win->_cury <= win->_bmarg)' assigns the blank temp line to win->_y[win->_bmarg]. This is correct only when the scrolling region is exactly the window: _bmarg = _maxy-1. But when _bmarg < _maxy-1, lines below _bmarg are not affected, which is the correct behaviour. However, if _cury > _bmarg (cursor is below the scroll region), the for loop executes 0 iterations and the blank line is still assigned to _bmarg per the 'if' on line 79, which is wrong -- a deletion at a cursor position outside the scroll region should not modify the bottom margin line.","fix":"Add a guard at the start of wdeleteln(): if win->_cury > win->_bmarg, return OK (or ERR) without modifying the window, since a delete at a position outside the scrolling region is a no-op.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/deleteln.c:53-87","code":"   53 | int wdeleteln(WINDOW *win)\n   54 | {\n   55 |     chtype blank, *temp, *ptr;\n   56 |     int y;\n   57 | \n   58 |     PDC_LOG((\"wdeleteln() - called\\n\"));\n   59 | \n   60 |     if (!win)\n   61 |         return ERR;\n   62 | \n   63 |     /* wrs (4/10/93) account for window background */\n   64 | \n   65 |     blank = win->_bkgd;\n   66 | \n   67 |     temp = win->_y[win->_cury];\n   68 | \n   69 |     for (y = win->_cury; y < win->_bmarg; y++)\n   70 |     {\n   71 |         win->_y[y] = win->_y[y + 1];\n   72 |         win->_firstch[y] = 0;\n   73 |         win->_lastch[y] = win->_maxx - 1;\n   74 |     }\n   75 | \n   76 |     for (ptr = temp; (ptr - temp < win->_maxx); ptr++)\n   77 |         *ptr = blank;           /* make a blank line */\n   78 | \n   79 |     if (win->_cury <= win->_bmarg)\n   80 |     {\n   81 |         win->_firstch[win->_bmarg] = 0;\n   82 |         win->_lastch[win->_bmarg] = win->_maxx - 1;\n   83 |         win->_y[win->_bmarg] = temp;\n   84 |     }\n   85 | \n   86 |     return OK;\n   87 | }","lines":35,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/deleteln.c#L53-L87"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In getch.c, the wgetch() function uses a static local buffer 'static int buffer[_INBUFSIZ]' (line 159) shared across all calls and all windows. This means input buffering is global state, which is problematic if multiple windows or threads call wgetch() concurrently. More critically, the static buffer state (c_pindex, c_gindex) is also file-static (lines 87-88), so they are shared across all windows. This is not thread-safe and could lead to data races.","fix":"Move the buffer and its indices into the SCREEN struct (SP) or document that wgetch() is not re-entrant.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getch.c:84-91","code":"   84 | #define _INBUFSIZ   512 /* size of terminal input buffer */\n   85 | #define NUNGETCH    256 /* max # chars to ungetch() */\n   86 | \n   87 | static int c_pindex = 0;    /* putter index */\n   88 | static int c_gindex = 1;    /* getter index */\n   89 | static int c_ungind = 0;    /* ungetch() push index */\n   90 | static int c_ungch[NUNGETCH];   /* array of ungotten chars */\n   91 | ","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getch.c#L84-L91"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getch.c:157-159","code":"  157 | int wgetch(WINDOW *win)\n  158 | {\n  159 |     static int buffer[_INBUFSIZ];   /* character buffer */","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getch.c#L157-L159"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In inchstr.c, winchnstr() always writes a terminating (chtype)0 sentinel at ch[n] (line 77), even when n has been clamped to 'win->_maxx - win->_curx'. If the caller passed a buffer of exactly n elements (i.e., n chtype slots), the NUL write goes one past the end. The same pattern appears throughout the callers (inchstr passes maxx-curx as n, then winchnstr writes n+1 elements). The function documentation says 'ending at the right margin, or after n elements' -- callers must provide n+1 allocation, which is not documented.","fix":"Document that the caller must allocate n+1 chtype elements to accommodate the terminating zero, or reduce the copy count by one before writing the sentinel.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/inchstr.c:59-80","code":"   59 | int winchnstr(WINDOW *win, chtype *ch, int n)\n   60 | {\n   61 |     chtype *src;\n   62 |     int i;\n   63 | \n   64 |     PDC_LOG((\"winchnstr() - called\\n\"));\n   65 | \n   66 |     if (!win || !ch || n < 0)\n   67 |         return ERR;\n   68 | \n   69 |     if ((win->_curx + n) > win->_maxx)\n   70 |         n = win->_maxx - win->_curx;\n   71 | \n   72 |     src = win->_y[win->_cury] + win->_curx;\n   73 | \n   74 |     for (i = 0; i < n; i++)\n   75 |         *ch++ = *src++;\n   76 | \n   77 |     *ch = (chtype)0;\n   78 | \n   79 |     return OK;\n   80 | }","lines":22,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/inchstr.c#L59-L80"}]},{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In initscr.c, the sprintf() call at line 224 writes into the fixed-size global ttytype[128] with the format 'pdcurses|PDCurses for %s'. If PDC_sysname() returns a string longer than 109 characters (128 minus the 19-character prefix), the buffer overflows. This is a stack-global overflow. No bounds are enforced.","fix":"Use snprintf(ttytype, sizeof(ttytype), \"pdcurses|PDCurses for %s\", PDC_sysname()) to prevent overflow.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/initscr.c:93-94","code":"   93 | char ttytype[128];\n   94 | ","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/initscr.c#L93-L94"},{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/initscr.c:224","code":"  224 |     sprintf(ttytype, \"pdcurses|PDCurses for %s\", PDC_sysname());","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/initscr.c#L224"}]},{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In initscr.c, if newwin() for curscr succeeds but newwin() for pdc_lastscr fails, the code calls exit(2) without freeing the memory allocated for curscr. Similarly, if stdscr allocation fails, both curscr and pdc_lastscr are leaked. This is an early-boot firmware context where memory leaks before exit matter less, but if PDC_scr_open or later allocations fail, the partially-initialized SP struct may be accessed by atexit handlers or destructors.","fix":"Free previously allocated windows before calling exit(), or use a common cleanup path.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/initscr.c:157-196","code":"  157 |     if ((curscr = newwin(LINES, COLS, 0, 0)) == (WINDOW *)NULL)\n  158 |     {\n  159 |         fprintf(stderr, \"initscr(): Unable to create curscr.\\n\");\n  160 |         exit(2);\n  161 |     }\n  162 | \n  163 |     if ((pdc_lastscr = newwin(LINES, COLS, 0, 0)) == (WINDOW *)NULL)\n  164 |     {\n  165 |         fprintf(stderr, \"initscr(): Unable to create pdc_lastscr.\\n\");\n  166 |         exit(2);\n  167 |     }\n  168 | \n  169 |     wattrset(pdc_lastscr, (chtype)(-1));\n  170 |     werase(pdc_lastscr);\n  171 | \n  172 |     PDC_slk_initialize();\n  173 |     LINES -= SP->slklines;\n  174 | \n  175 |     /* We have to sort out ripped off lines here, and reduce the height\n  176 |        of stdscr by the number of lines ripped off */\n  177 | \n  178 |     for (i = 0; i < linesrippedoff; i++)\n  179 |     {\n  180 |         if (linesripped[i].line < 0)\n  181 |             (*linesripped[i].init)(newwin(1, COLS, LINES - 1, 0), COLS);\n  182 |         else\n  183 |             (*linesripped[i].init)(newwin(1, COLS,\n  184 |                                    SP->linesrippedoffontop++, 0), COLS);\n  185 | \n  186 |         SP->linesrippedoff++;\n  187 |         LINES--;\n  188 |     }\n  189 | \n  190 |     linesrippedoff = 0;\n  191 | \n  192 |     if (!(stdscr = newwin(LINES, COLS, SP->linesrippedoffontop, 0)))\n  193 |     {\n  194 |         fprintf(stderr, \"initscr(): Unable to create stdscr.\\n\");\n  195 |         exit(1);\n  196 |     }","lines":40,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/initscr.c#L157-L196"}]},{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In insstr.c (non-wide path), the n clamping logic is inverted: 'if (n < 0 || n < len) n = len;' (line 83). This means when n is a positive value less than the string length (the caller's intent is to insert at most n characters), it is silently overridden to len, inserting the entire string. The correct behavior for winsnstr() is to insert at most n characters; n should only be set to len when n is negative (meaning 'no limit'). When n is a valid positive limit smaller than the string length, it should be respected.","fix":"Change the condition to 'if (n < 0 || n > len) n = len;' so that a caller-supplied n that is smaller than len is honored as an upper bound.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/insstr.c:81-84","code":"   81 |     len = strlen(str);\n   82 | \n   83 |     if (n < 0 || n < len)\n   84 |         n = len;","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/insstr.c#L81-L84"}]},{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"The same inverted n clamping exists in wins_nwstr() for the wide-character path (lines 191-192): 'if (n < 0 || n < len) n = len;'. Same effect: a positive n smaller than the wide string length is ignored, and the full string is always inserted.","fix":"Change to 'if (n < 0 || n > len) n = len;'.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/insstr.c:188-198","code":"  188 |     for (len = 0, p = wstr; *p; p++)\n  189 |         len++;\n  190 | \n  191 |     if (n < 0 || n < len)\ c:251-292","code":"  251 | static void _calculate_obscure(void)\n  252 | {\n  253 |     PANEL *pan, *pan2;\n  254 |     PANELOBS *tobs;     /* \"this\" one */\n  255 |     PANELOBS *lobs;     /* last one */\n  256 | \n  257 |     pan = _bottom_panel;\n  258 | \n  259 |     while (pan)\n  260 |     {\n  261 |         if (pan->obscure)\n  262 |             _free_obscure(pan);\n  263 | \n  264 |         lobs = (PANELOBS *)0;\n  265 |         pan2 = _bottom_panel;\n  266 | \n  267 |         while (pan2)\n  268 |         {\n  269 |             if (_panels_overlapped(pan, pan2))\n  270 |             {\n  271 |                 if ((tobs = malloc(sizeof(PANELOBS))) == NULL)\n  272 |                     return;\n  273 | \n  274 |                 tobs->pan = pan2;\n  275 |                 dPanel(\"obscured\", pan2);\n  276 |                 tobs->above = (PANELOBS *)0;\n  277 | \n  278 |                 if (lobs)\n  279 |                     lobs->above = tobs;\n  280 |                 else\n  281 |                     pan->obscure = tobs;\n  282 | \n  283 |                 lobs  = tobs;\n  284 |             }\n  285 | \n  286 |             pan2 = pan2->above;\n  287 |         }\n  288 | \n  289 |         _override(pan, 1);\n  290 |         pan = pan->above;\n  291 |     }\n  292 | }","lines":42,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/panel.c#L251-L292"}]},{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"panel_window() dereferences 'pan' without a NULL check, while every other panel function that takes a PANEL pointer begins with 'if (!pan) return ERR'. Passing NULL to panel_window() causes a NULL pointer dereference crash. The POSIX panel specification requires panel_window() to return NULL on error, implying it should handle NULL input gracefully.","fix":"Add a NULL guard: 'if (!pan) return NULL;' before accessing pan->win.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/panel.c:545-550","code":"  545 | WINDOW *panel_window(const PANEL *pan)\n  546 | {\n  547 |     PDC_LOG((\"panel_window() - called\\n\"));\n  548 | \n  549 |     return pan->win;\n  550 | }","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/panel.c#L545-L550"}]},{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In sdl1/pdcdisp.c PDC_transform_line(), before the main rendering loop the\ncode computes and queues a single wide rectangle covering all `len` columns (lines 254-275).\nHowever, the rectangle merging logic at lines 266-275 can append `dest` (full-width rectangle)\nto uprect without first checking whether rectcount has already reached MAXRECT. The MAXRECT\nguard at line 248-249 only flushes before starting, but after the flush rectcount is 0 and\na new entry is added unconditionally. Inside the per-character loop at line 272, rectcount\nis incremented without a bounds check. If len is large and many unmerged rects accumulate,\nrectcount can overflow the uprect[MAXRECT] array.","fix":"Before each `uprect[rectcount++] = dest;` assignment (lines 272 and 275),\ncheck `if (rectcount < MAXRECT)` or call PDC_update_rects() to flush first.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcdisp.c:241-301","code":"  241 | void PDC_transform_line(int lineno, int x, int len, const chtype *srcp)\n  242 | {\n  243 |     SDL_Rect src, dest, lastrect;\n  244 |     int j;\n  245 | \n  246 |     PDC_LOG((\"PDC_transform_line() - called: lineno=%d\\n\", lineno));\n  247 | \n  248 |     if (rectcount == MAXRECT)\n  249 |         PDC_update_rects();\n  250 | \n  251 |     src.h = pdc_fheight;\n  252 |     src.w = pdc_fwidth;\n  253 | \n  254 |     dest.y = pdc_fheight * lineno + pdc_yoffset;\n  255 |     dest.x = pdc_fwidth * x + pdc_
