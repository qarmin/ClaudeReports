<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.sev-info    {background:#0c2a2a;color:#5eead4;border-color:#0f766e}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.easy-badge{background:#052e16;color:#86efac;border-color:#16a34a}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"medium","easy":false,"description":"In sdl1/pdcclip.c PDC_freeclipboard(), after calling strlen(contents) to check\nthe length, the code writes into the buffer with strcpy(contents, \"PDCURSES\") and then\nimmediately calls free(contents) (lines 108-111). The strcpy write before free is intentional\n(as the comment explains), but the strlen call at line 108 operates on memory that may already\nhave been freed by a previous double-free call - there is no protection against the caller\npassing an invalid or already-freed pointer. Moreover the memset that would have made the\nuse-after-free detectable is commented out (line 106), while the strcpy still writes to\nfreed memory if called twice.","fix":"The pre-free strcpy pattern is fragile and not thread-safe. Simply call\nfree(contents) directly; the canary-write adds complexity without reliable benefit and\nrisks writing to already-freed memory on double-free.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c:92-115","code":"   92 | int PDC_freeclipboard(char *contents)\n   93 | {\n   94 |     PDC_LOG((\"PDC_freeclipboard() - called\\n\"));\n   95 | \n   96 |     /* should we also free empty the system clipboard? probably not */\n   97 | \n   98 |     if (contents)\n   99 |     {\n  100 |         /* NOTE: We free the memory, but we can not set caller's pointer\n  101 |            to NULL, so if caller calls again then will try to access\n  102 |            free'd memory.  We 1st overwrite memory with a string so if\n  103 |            caller tries to use free memory they won't get what they\n  104 |            expect & hopefully notice. */\n  105 | \n  106 |         /* memset(contents, 0xFD, strlen(contents)); */\n  107 | \n  108 |         if (strlen(contents) >= strlen(\"PDCURSES\"))\n  109 |             strcpy(contents, \"PDCURSES\");\n  110 | \n  111 |         free(contents);\n  112 |     }\n  113 | \n  114 |     return PDC_CLIP_SUCCESS;\n  115 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c#L92-L115"}]},{"id":"SEC_1","type":"security","type_label":"Security","severity":"high","easy":false,"description":"PDC_scr_open() in sdl1/pdcscrn.c reads environment variables PDC_LINES and\nPDC_COLS via getenv() and passes them directly to atoi() (lines 144-148). The results are\nused without any validation as multipliers to compute screen pixel dimensions\n(pdc_sheight, pdc_swidth). A value of 0, negative, or extremely large can result in\nSDL_SetVideoMode being called with 0x0 or enormous dimensions, or the subsequent\nPDC_get_rows()/PDC_get_columns() returning 0 causing division-by-zero or corrupted\nSP->lines/SP->cols, which propagate into all curses window sizing.","fix":"Validate the values from PDC_LINES and PDC_COLS: clamp to a reasonable range\n(e.g. 1-500) and fall back to the default (25/80) if out of range.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c:143-151","code":"  143 |     {\n  144 |         const char *env = getenv(\"PDC_LINES\");\n  145 |         pdc_sheight = (env ? atoi(env) : 25) * pdc_fheight;\n  146 | \n  147 |         env = getenv(\"PDC_COLS\");\n  148 |         pdc_swidth = (env ? atoi(env) : 80) * pdc_fwidth;\n  149 | \n  150 |         pdc_screen = SDL_SetVideoMode(pdc_swidth, pdc_sheight, 0,\n  151 |             SDL_SWSURFACE|SDL_ANYFORMAT|SDL_RESIZABLE);","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L143-L151"}]},{"id":"SEC_2","type":"security","type_label":"Security","severity":"high","easy":true,"description":"`init_pair()` in colors.c checks `index == 0 || index > 255` but does NOT check\nfor negative values. A `short` argument can be negative (e.g. -1), which passes\nthe guard and is then used as an array index into `color_pairs[256]`, producing\nan out-of-bounds write before the array. This is an arbitrary memory corruption\nvulnerability for any caller that passes a negative color pair index.","fix":"Change the guard to: `if (index <= 0 || index > 255) return ERR;` (note <=0 to also keep the existing rejection of index==0).","locations":[{"ref":"payloads/libpayload/curses/colors.c:45-48","code":"   45 | \tif (index == 0 || index > 255)\n   46 | \t\treturn ERR;\n   47 | \n   48 | \tcolor_pairs[index] = ((bg & 0xF) << 4) | (fg & 0xF);","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/colors.c#L45-L48"}]},{"id":"SEC_3","type":"security","type_label":"Security","severity":"high","easy":false,"description":"lookup_cmos_enum_core() calls strnlen(text, CB_CMOS_MAX_TEXT_LENGTH) unconditionally at line 240, but text is documented as optionally NULL (the comment says 'Either value or text must be NULL'). When called via lookup_cmos_enum_by_value(), text is NULL. Passing NULL to strnlen() is undefined behavior and will fault on most implementations.","fix":"Guard the strnlen call: int len = text ? strnlen(text, CB_CMOS_MAX_TEXT_LENGTH) : 0; The subsequent memcmp is already guarded by (text == NULL) so no other change is needed.","locations":[{"ref":"payloads/libpayload/drivers/options.c:238-254","code":"  238 | static struct cb_cmos_enums *lookup_cmos_enum_core(struct cb_cmos_option_table *option_table, int config_id, const u8 *value, const char *text)\n  239 | {\n  240 | \tint len = strnlen(text, CB_CMOS_MAX_TEXT_LENGTH);\n  241 | \n  242 | \t/* CMOS enums are located after CMOS entries. */\n  243 | \tstruct cb_cmos_enums *cmos_enum;\n  244 | \tfor (   cmos_enum = first_cmos_enum_of_id(option_table, config_id);\n  245 | \t\tcmos_enum;\n  246 | \t\tcmos_enum = next_cmos_enum_of_id(cmos_enum, config_id)) {\n  247 | \t\tif (((value == NULL) || (cmos_enum->value == *value)) &&\n  248 | \t\t    ((text == NULL) || (memcmp((const char*)cmos_enum->text, text, len) == 0))) {\n  249 | \t\t\treturn cmos_enum;\n  250 | \t\t}\n  251 | \t}\n  252 | \n  253 | \treturn NULL;\n  254 | }","lines":17,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L238-L254"}]},{"id":"SEC_4","type":"security","type_label":"Security","severity":"high","easy":false,"description":"In get_option_as_string(), after lookup_cmos_enum_by_value() is called for config type 'e', the return value cmos_enum is never checked for NULL before dereferencing cmos_enum->text on the next line. If no enum entry matches the stored value, this is a null pointer dereference.","fix":"Add a null check: if (!cmos_enum) { ret = 1; break; } before the strdup call.","locations":[{"ref":"payloads/libpayload/drivers/options.c:337-338","code":"  337 | \t\t\tcmos_enum = lookup_cmos_enum_by_value(option_table, cmos_entry->config_id, (u8*)raw);\n  338 | \t\t\t*dest = strdup((const char*)cmos_enum->text);","lines":2,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L337-L338"}]},{"id":"SEC_5","type":"security","type_label":"Security","severity":"high","easy":false,"description":"In set_option_from_string(), for config type 'e', lookup_cmos_enum_by_label() return value is not checked for NULL before cmos_enum->value is dereferenced on line 371. If the label does not exist, this is a null pointer dereference. Additionally, malloc(sizeof(u32)) on line 370 is not checked for NULL before the dereference.","fix":"Check cmos_enum for NULL after the lookup and return an error. Also check that malloc returned non-NULL before dereferencing raw.","locations":[{"ref":"payloads/libpayload/drivers/options.c:369-371","code":"  369 | \t\t\tcmos_enum = lookup_cmos_enum_by_label(option_table, cmos_entry->config_id, value);\n  370 | \t\t\traw = malloc(sizeof(u32));\n  371 | \t\t\t*(u32*)raw = cmos_enum->value;","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L369-L371"}]},{"id":"SEC_6","type":"security","type_label":"Security","severity":"medium","easy":false,"description":"In boot_media.c, boot_device_read() checks that boot_media_size - offset <= 16 MiB (to restrict reads to the top 16MB of flash mapping), but does not validate that offset + size <= boot_media_size. A caller providing a large size value causes memcpy to read beyond the end of the flash memory region, potentially exposing adjacent memory contents.","fix":"Add a bounds check before the memcpy: if (size > lib_sysinfo.boot_media_size - offset) return CB_ERR_ARG;","locations":[{"ref":"payloads/libpayload/arch/x86/boot_media.c:6-13","code":"    6 | __attribute__((weak)) ssize_t boot_device_read(void *buf, size_t offset, size_t size)\n    7 | {\n    8 | \t/* Memory-mapping usually only works for the top 16MB. */\n    9 | \tif (!lib_sysinfo.boot_media_size || lib_sysinfo.boot_media_size - offset > 16 * MiB)\n   10 | \t\treturn CB_ERR_ARG;\n   11 | \tconst void *const ptr = phys_to_virt(0 - lib_sysinfo.boot_media_size + offset);\n   12 | \tmemcpy(buf, ptr, size);\n   13 | \treturn size;","lines":8,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/arch/x86/boot_media.c#L6-L13"}]},{"id":"SEC_7","type":"security","type_label":"Security","severity":"medium","easy":false,"description":"In dos/pdcclip.c PDC_freeclipboard(), the function writes the string \"PDCURSES\" into the\nbuffer being freed, then calls free() on it. Writing to memory that is about to be freed is\nundefined behavior and the write happens before free() so the scrubbing is pointless. Worse,\nthe length check `strlen(contents) >= strlen(\"PDCURSES\")` means shorter clipboard contents\nare freed without any scrubbing at all. The comment acknowledges the caller's pointer is not\nnulled, making a use-after-free trivial for any caller that reuses the pointer.","fix":"Remove the write-before-free pattern. To guard against accidental reuse, use memset(contents, 0, strlen(contents)) before free(), or document that callers must set their pointer to NULL after calling PDC_freeclipboard.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/dos/pdcclip.c:92-116","code":"   92 | int PDC_freeclipboard(char *contents)\n   93 | {\n   94 |     PDC_LOG((\"PDC_freeclipboard() - called\\n\"));\n   95 | \n   96 |     /* should we also free empty the system clipboard? probably not */\n   97 | \n   98 |     if (contents)\n   99 |     {\n  100 | \n  101 |         /* NOTE: We free the memory, but we can not set caller's pointer\n  102 |            to NULL, so if caller calls again then will try to access\n  103 |            free'd memory.  We 1st overwrite memory with a string so if\n  104 |            caller tries to use free memory they won't get what they\n  105 |            expect & hopefully notice. */\n  106 | \n  107 |         /* memset(contents, 0xFD, strlen(contents)); */\n  108 | \n  109 |         if (strlen(contents) >= strlen(\"PDCURSES\"))\n  110 |             strcpy(contents, \"PDCURSES\");\n  111 | \n  112 |         free(contents);\n  113 |     }\n  114 | \n  115 |     return PDC_CLIP_SUCCESS;\n  116 | }","lines":25,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/dos/pdcclip.c#L92-L116"}]},{"id":"SEC_8","type":"security","type_label":"Security","severity":"medium","easy":false,"description":"getwin() in scr_dump.c reads a raw WINDOW struct from a file with fread() and then uses the embedded _maxy and _maxx fields directly as allocation sizes without any validation. A crafted dump file can set these to negative values (they are signed int), causing malloc() calls like 'malloc(nlines * sizeof(chtype *))' to receive a very large size (due to sign extension on most platforms), likely failing and returning NULL (which is handled), but also to zero (malloc(0) implementation-defined) or to an apparently valid small size that causes a write overflow later in the fread loop.","fix":"After reading the WINDOW struct, validate that nlines and ncols are positive and within reasonable bounds (e.g., 1 <= nlines <= LINES_MAX and 1 <= ncols <= COLS_MAX) before using them as malloc sizes.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/scr_dump.c:91-158","code":"   91 | WINDOW *getwin(FILE *filep)\n   92 | {\n   93 |     WINDOW *win;\n   94 |     char marker[4];\n   95 |     int i, nlines, ncols;\n   96 | \n   97 |     PDC_LOG((\"getwin() - called\\n\"));\n   98 | \n   99 |     if ( !(win = malloc(sizeof(WINDOW))) )\n  100 |         return (WINDOW *)NULL;\n  101 | \n  102 |     /* check for the marker, and load the WINDOW struct */\n  103 | \n  104 |     if (!filep || !fread(marker, 4, 1, filep) || strncmp(marker, \"PDC\", 3)\n  105 |         || marker[3] != DUMPVER || !fread(win, sizeof(WINDOW), 1, filep))\n  106 |     {\n  107 |         free(win);\n  108 |         return (WINDOW *)NULL;\n  109 |     }\n  110 | \n  111 |     nlines = win->_maxy;\n  112 |     ncols = win->_maxx;\n  113 | \n  114 |     /* allocate the line pointer array */\n  115 | \n  116 |     if ( !(win->_y = malloc(nlines * sizeof(chtype *))) )\n  117 |     {\n  118 |         free(win);\n  119 |         return (WINDOW *)NULL;\n  120 |     }\n  121 | \n  122 |     /* allocate the minchng and maxchng arrays */\n  123 | \n  124 |     if ( !(win->_firstch = malloc(nlines * sizeof(int))) )\n  125 |     {\n  126 |         free(win->_y);\n  127 |         free(win);\n  128 |         return (WINDOW *)NULL;\n  129 |     }\n  130 | \n  131 |     if ( !(win->_lastch = malloc(nlines * sizeof(int))) )\n  132 |     {\n  133 |         free(win->_firstch);\n  134 |         free(win->_y);\n  135 |         free(win);\n  136 |         return (WINDOW *)NULL;\n  137 |     }\n  138 | \n  139 |     /* allocate the lines */\n  140 | \n  141 |     if ( !(win = PDC_makelines(win)) )\n  142 |         return (WINDOW *)NULL;\n  143 | \n  144 |     /* read them */\n  145 | \n  146 |     for (i = 0; i < nlines; i++)\n  147 |     {\n  148 |         if (!fread(win->_y[i], ncols * sizeof(chtype), 1, filep))\n  149 |         {\n  150 |             delwin(win);\n  151 |             return (WINDOW *)NULL;\n  152 |         }\n  153 |     }\n  154 | \n  155 |     touchwin(win);\n  156 | \n  157 |     return win;\n  158 | }","lines":68,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/scr_dump.c#L91-L158"}]},{"id":"SEC_9","type":"security","type_label":"Security","severity":"medium","easy":false,"description":"In the wide-character branch of form_driver (USE_WIDEC_SUPPORT), character validation via Check_Char is skipped entirely. The comment at line 4348 acknowledges this as a known gap ('FIXME: the wide-character branch should also use Check_Char()'). As a result, any non-control wide character is inserted without field-type validation, bypassing application-defined character filters. In a firmware context where form fields may guard configuration values, this allows invalid data to be entered.","fix":"Apply Check_Char validation in the wide-character path before calling Data_Entry, analogous to the narrow-character path at lines 4353-4355.","locations":[{"ref":"payloads/libpayload/curses/form/frm_driver.c:4340-4357","code":" 4340 |   else if (!(c & (~(int)MAX_REGULAR_CHARACTER)))\n 4341 |     {\n 4342 |       /*\n 4343 |        * If we're using 8-bit characters, iscntrl+isprint cover the whole set.\n 4344 |        * But with multibyte characters, there is a third possibility, i.e.,\n 4345 |        * parts of characters that build up into printable characters which are\n 4346 |        * not considered printable.\n 4347 |        *\n 4348 |        * FIXME: the wide-character branch should also use Check_Char().\n 4349 |        */\n 4350 | #if USE_WIDEC_SUPPORT\n 4351 |       if (!iscntrl(UChar(c)))\n 4352 | #else\n 4353 |       if (isprint(UChar(c)) &&\n 4354 | \t  Check_Char(form, form->current, form->current->type, c,\n 4355 | \t\t     (TypeArgument *)(form->current->arg)))\n 4356 | #endif\n 4357 | \tres = Data_Entry(form, c);","lines":18,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_driver.c#L4340-L4357"}]},{"id":"SEC_10","type":"security","type_label":"Security","severity":"low","easy":false,"description":"In Documentation/conf.py, subprocess.check_output(('git', 'describe')) is called without error handling. If git is not available, the working directory is not a git repository, or there are no tags (CalledProcessError), the Sphinx build fails with an uncaught exception and an unhelpful Python traceback instead of a useful error message. The decode().split() on line 17 also assumes UTF-8 output but does not handle potential codec errors.","fix":"Wrap the subprocess call in a try/except: try: release = subprocess.check_output(('git', 'describe'), stderr=subprocess.DEVNULL).decode('utf-8', errors='replace').strip() except Exception: release = 'unknown'","locations":[{"ref":"Documentation/conf.py:15-17","code":"   15 | release = subprocess.check_output(('git', 'describe')).decode(\"utf-8\")\n   16 | # The short X.Y version.\n   17 | version = release.split(\"-\")[0]","lines":3,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/Documentation/conf.py#L15-L17"}]},{"id":"SEC_11","type":"security","type_label":"Security","severity":"low","easy":false,"description":"PDC_setclipboard() allocates 'malloc(length + 1)' bytes based on the caller-supplied 'length' parameter, but then copies the string with 'strcpy(pdc_SDL_clipboard, contents)', which copies until the null terminator in 'contents'. If the caller passes a 'length' value smaller than 'strlen(contents)', the strcpy writes beyond the allocated buffer. This is an API misuse hazard: the contract says length is the byte count of contents, but there is no enforcement.","fix":"Replace strcpy with 'memcpy(pdc_SDL_clipboard, contents, length); pdc_SDL_clipboard[length] = 0;' to honor the length parameter and prevent overflow when the caller passes a length smaller than the string.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c:71-89","code":"   71 | int PDC_setclipboard(const char *contents, long length)\n   72 | {\n   73 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n   74 | \n   75 |     if (pdc_SDL_clipboard)\n   76 |     {\n   77 |         free(pdc_SDL_clipboard);\n   78 |         pdc_SDL_clipboard = NULL;\n   79 |     }\n   80 | \n   81 |     if (contents)\n   82 |     {\n   83 |         if ((pdc_SDL_clipboard = malloc(length + 1)) == NULL)\n   84 |             return PDC_CLIP_MEMORY_ERROR;\n   85 | \n   86 |         strcpy(pdc_SDL_clipboard, contents);\n   87 |     }\n   88 | \n   89 |     return PDC_CLIP_SUCCESS;","lines":19,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcclip.c#L71-L89"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"PDC_scr_open() in sdl1/pdcscrn.c allocates SP with calloc (line 73), then\ncalls SDL_Init, loads fonts, etc. On several early-exit paths the function returns ERR without\nfreeing SP. Specifically: if SDL_Init fails (line 84-86), if the font cannot be loaded (line\n101-104), and if SDL_SetVideoMode fails (line 163-166), the function returns ERR while SP\nremains allocated. This leaks sizeof(SCREEN) bytes every time initscr() is called and fails.","fix":"Add `free(SP); SP = NULL;` before each `return ERR;` inside PDC_scr_open(),\nmirroring what PDC_scr_free() does at line 59-63.","locat  \n  129 |     if (pdc_own_screen && !pdc_icon)\n  130 |     {\n  131 |         const char *iname = getenv(\"PDC_ICON\");\n  132 |         pdc_icon = SDL_LoadBMP(iname ? iname : \"pdcicon.bmp\");\n  133 | \n  134 |         if (!pdc_icon)\n  135 |             pdc_icon = SDL_LoadBMP_RW(SDL_RWFromMem(deficon,\n  136 |                                                     sizeof(deficon)), 0);\n  137 | \n  138 |         if (pdc_icon)\n  139 |             SDL_WM_SetIcon(pdc_icon, NULL);\n  140 |     }\n  141 | \n  142 |     if (pdc_own_screen)\n  143 |     {\n  144 |         const char *env = getenv(\"PDC_LINES\");\n  145 |         pdc_sheight = (env ? atoi(env) : 25) * pdc_fheight;\n  146 | \n  147 |         env = getenv(\"PDC_COLS\");\n  148 |         pdc_swidth = (env ? atoi(env) : 80) * pdc_fwidth;\n  149 | \n  150 |         pdc_screen = SDL_SetVideoMode(pdc_swidth, pdc_sheight, 0,\n  151 |             SDL_SWSURFACE|SDL_ANYFORMAT|SDL_RESIZABLE);\n  152 |     }\n  153 |     else\n  154 |     {\n  155 |         if (!pdc_sheight)\n  156 |             pdc_sheight = pdc_screen->h - pdc_yoffset;\n  157 | \n  158 |         if (!pdc_swidth)\n  159 |             pdc_swidth = pdc_screen->w - pdc_xoffset;\n  160 |     }\n  161 | \n  162 |     if (!pdc_screen)\n  163 |     {\n  164 |         fprintf(stderr, \"Couldn't create a surface: %s\\n\", SDL_GetError());\n  165 |         return ERR;\n  166 |     }\n  167 | \n  168 |     if (SP->orig_attr)\n  169 |         PDC_retile();\n  170 | \n  171 |     for (i = 0; i < 8; i++)\n  172 |     {\n  173 |         pdc_color[i].r = (i & COLOR_RED) ? 0xc0 : 0;\n  174 |         pdc_color[i].g = (i & COLOR_GREEN) ? 0xc0 : 0;\n  175 |         pdc_color[i].b = (i & COLOR_BLUE) ? 0xc0 : 0;\n  176 | \n  177 |         pdc_color[i + 8].r = (i & COLOR_RED) ? 0xff : 0x40;\n  178 |         pdc_color[i + 8].g = (i & COLOR_GREEN) ? 0xff : 0x40;\n  179 |         pdc_color[i + 8].b = (i & COLOR_BLUE) ? 0xff : 0x40;\n  180 |     }\n  181 | \n  182 |     for (i = 0; i < 16; i++)\n  183 |         pdc_mapped[i] = SDL_MapRGB(pdc_screen->format, pdc_color[i].r,\n  184 |                                    pdc_color[i].g, pdc_color[i].b);\n  185 | \n  186 |     SDL_EnableUNICODE(1);\n  187 | \n  188 |     PDC_mouse_set();\n  189 | \n  190 |     if (pdc_own_screen)\n  191 |         PDC_set_title(argc ? argv[0] : \"PDCurses\");\n  192 | \n  193 |     SP->lines = PDC_get_rows();\n  194 |     SP->cols = PDC_get_columns();\n  195 | \n  196 |     SP->mouse_wait = PDC_CLICK_PERIOD;\n  197 |     SP->audible = FALSE;\n  198 | \n  199 |     PDC_reset_prog_mode();\n  200 | \n  201 |     return OK;\n  202 | }","lines":136,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L67-L202"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"Connect_Fields iterates over the fields array setting field->form = form on each entry before checking for E_CONNECTED. If a later field is found to be already connected, the function returns E_CONNECTED but all previously visited fields already have their ->form pointer pointing at the new (not-yet-fully-connected) form object. Those fields are permanently orphaned from their original form and the partial state is never rolled back, leaking the page allocation that was already freed and leaving a corrupt form state.","fix":"Check all fields for pre-existing connections in a first pass before modifying any field->form pointer, or roll back all previously set field->form pointers on error before returning E_CONNECTED.","locations":[{"ref":"payloads/libpayload/curses/form/frm_def.c:176-186","code":"  176 |   for (field_cnt = 0; fields[field_cnt]; field_cnt++)\n  177 |     {\n  178 |       if (fields[field_cnt]->form)\n  179 | \tRETURN(E_CONNECTED);\n  180 |       if (field_cnt == 0 ||\n  181 | \t  (fields[field_cnt]->status & _NEWPAGE))\n  182 | \tpage_nr++;\n  183 |       fields[field_cnt]->form = form;\n  184 |     }\n  185 |   if (field_cnt == 0 || (short)field_cnt < 0)\n  186 |     RETURN(E_BAD_ARGUMENT);","lines":11,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/frm_def.c#L176-L186"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In SubWinTest() (newdemo.c), if derwin/subwin returns NULL for swin2 or swin3, the function returns 1 immediately without freeing the already-allocated windows. If swin2 fails, swin1 is leaked. If swin3 fails, both swin1 and swin2 are leaked.","fix":"On each early-return path, call delwin() on every previously allocated subwindow before returning 1.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/newdemo.c:82-87","code":"   82 |     if ((swin1 = derwin(win, sh, sw, 3, 5)) == NULL)\n   83 |         return 1;\n   84 |     if ((swin2 = subwin(win, sh, sw, by + 4, bx + 8)) == NULL)\n   85 |         return 1;\n   86 |     if ((swin3 = subwin(win, sh, sw, by + 5, bx + 11)) == NULL)\n   87 |         return 1;","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/newdemo.c#L82-L87"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In the scrolling message loop in main() (newdemo.c), malloc() is called to allocate scrollbuf but its return value is never checked. If malloc returns NULL, the subsequent memset(visbuf, ...) and strncpy(scrollbuf + i, ...) dereference a NULL pointer (offset by msg_len), causing a crash. This is reachable in any low-memory environment.","fix":"Check the return of malloc: if (!scrollbuf) { stop = 1; break; } before dereferencing visbuf or scrollbuf.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/newdemo.c:349-358","code":"  349 |             char *scrollbuf = malloc(scroll_len);\n  350 |             char *visbuf = scrollbuf + msg_len;\n  351 |             int stop = 0;\n  352 |             int i;\n  353 | \n  354 |             for (i = w + msg_len; i > 0; i--)\n  355 |             {\n  356 |                 memset(visbuf, ' ', w);\n  357 |                 strncpy(scrollbuf + i, message, msg_len);\n  358 |                 mvwaddnstr(win, height / 2, 1, visbuf, w);","lines":10,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/newdemo.c#L349-L358"}]},{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"PDC_resize_screen() in sdl1/pdcscrn.c calls SDL_FreeSurface(pdc_screen) at line\n217 then immediately calls SDL_SetVideoMode. If SDL_SetVideoMode returns NULL (pdc_screen becomes\nNULL) the function still returns OK at line 228, silently leaving the application with no valid\nscreen surface. Any subsequent drawing calls will dereference the NULL pdc_screen pointer.\nAdditionally pdc_tileback is not freed before the retile on failure paths.","fix":"After SDL_SetVideoMode, check `if (!pdc_screen) return ERR;` before continuing\nand set SP->resized/cursrow/curscol only on success.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c:206-229","code":"  206 | int PDC_resize_screen(int nlines, int ncols)\n  207 | {\n  208 |     if (!pdc_own_screen)\n  209 |         return ERR;\n  210 | \n  211 |     if (nlines && ncols)\n  212 |     {\n  213 |         pdc_sheight = nlines * pdc_fheight;\n  214 |         pdc_swidth = ncols * pdc_fwidth;\n  215 |     }\n  216 | \n  217 |     SDL_FreeSurface(pdc_screen);\n  218 | \n  219 |     pdc_screen = SDL_SetVideoMode(pdc_swidth, pdc_sheight, 0,\n  220 |         SDL_SWSURFACE|SDL_ANYFORMAT|SDL_RESIZABLE);\n  221 | \n  222 |     if (pdc_tileback)\n  223 |         PDC_retile();\n  224 | \n  225 |     SP->resized = FALSE;\n  226 |     SP->cursrow = SP->curscol = 0;\n  227 | \n  228 |     return OK;\n  229 | }","lines":24,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/sdl1/pdcscrn.c#L206-L229"}]},{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In win32/pdcclip.c PDC_setclipboard(), OpenClipboard(NULL) is called at line\n99 but if GlobalAlloc fails at line 102-106, the function returns PDC_CLIP_MEMORY_ERROR without\ncalling CloseClipboard(). This leaks the open clipboard handle, preventing any other process\nfrom accessing the clipboard until the application terminates.","fix":"Add `CloseClipboard();` before `return PDC_CLIP_MEMORY_ERROR;` at line 106,\nmatching the pattern used in PDC_getclipboard().","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcclip.c:92-128","code":"   92 | int PDC_setclipboard(const char *contents, long length)\n   93 | {\n   94 |     HGLOBAL ptr1;\n   95 |     LPTSTR ptr2;\n   96 | \n   97 |     PDC_LOG((\"PDC_setclipboard() - called\\n\"));\n   98 | \n   99 |     if (!OpenClipboard(NULL))\n  100 |         return PDC_CLIP_ACCESS_ERROR;\n  101 | \n  102 |     ptr1 = GlobalAlloc(GMEM_MOVEABLE|GMEM_DDESHARE,\n  103 |         (length + 1) * sizeof(TCHAR));\n  104 | \n  105 |     if (!ptr1)\n  106 |         return PDC_CLIP_MEMORY_ERROR;\n  107 | \n  108 |     ptr2 = GlobalLock(ptr1);\n  109 | \n  110 | #ifdef PDC_WIDE\n  111 |     PDC_mbstowcs((wchar_t *)ptr2, contents, length);\n  112 | #else\n  113 |     memcpy((char *)ptr2, contents, length + 1);\n  114 | #endif\n  115 |     GlobalUnlock(ptr1);\n  116 |     EmptyClipboard();\n  117 | \n  118 |     if (!SetClipboardData(PDC_TEXT, ptr1))\n  119 |     {\n  120 |         GlobalFree(ptr1);\n  121 |         return PDC_CLIP_ACCESS_ERROR;\n  122 |     }\n  123 | \n  124 |     CloseClipboard();\n  125 |     GlobalFree(ptr1);\n  126 | \n  127 |     return PDC_CLIP_SUCCESS;\n  128 | }","lines":37,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcclip.c#L92-L128"}]},{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In `_nc_Make_Argument()` for a `_LINKED_TYPE`, the node `p` is allocated and its\n`left` and `right` sub-arguments are constructed recursively (lines 100-101).\nIf the left recursive call succeeds but the right fails (incrementing `*err`),\nthe function returns `p` immediately (line 102) with a partially-constructed\nargument tree. The caller (`_nc_Copy_Type` / `set_field_type`) checks `*err != 0`\nand then calls `_nc_Free_Argument(dst->type, (TypeArgument*)(dst->arg))`, passing\n`p` as the arg to free. `_nc_Free_Argument` for a linked type will free both\n`p->left` (valid or NULL) and `p->right` (NULL since it failed), and then free\n`p` itself. The right sub-argument's partially-allocated internal resources (if\n`makearg` partially succeeded before failing) will be leaked since `p->right` is\nNULL and `_nc_Free_Argument` bails early. This is the same structural issue as\nthe copy path.","fix":"After the recursive calls, check whether `*err` increased since entry. If so,\ncall `_nc_Free_Argument(typ->left, p->left)` and `_nc_Free_Argument(typ->right,\np->right)` before freeing `p` and returning NULL, rather than returning a\npartially-valid node.","locations":[{"ref":"payloads/libpayload/curses/form/fld_def.c:94-118","code":"   94 |       if ((typ->status & _LINKED_TYPE) != 0)\n   95 | \t{\n   96 | \t  p = typeMalloc(TypeArgument, 1);\n   97 | \n   98 | \t  if (p != 0)\n   99 | \t    {\n  100 | \t      p->left = _nc_Make_Argument(typ->left, ap, err);\n  101 | \t      p->right = _nc_Make_Argument(typ->right, ap, err);\n  102 | \t      return p;\n  103 | \t    }\n  104 | \t  else\n  105 | \t    {\n  106 | \t      *err += 1;\n  107 | \t    }\n  108 | \t}\n  109 |       else\n  110 | \t{\n  111 | \t  assert(typ->makearg != (void *)0);\n  112 | \t  if (!(res = (TypeArgument *)typ->makearg(ap)))\n  113 | \t    {\n  114 | \t      *err += 1;\n  115 | \t    }\n  116 | \t}\n  117 |     }\n  118 |   return res;","lines":25,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fld_def.c#L94-L118"}]},{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In `new_field()` (USE_WIDEC_SUPPORT build), `New_Field->working` (a newpad) and\n`New_Field->expanded` (a char* array) are allocated unconditionally on lines 307-308\nbefore any of the subsequent allocations that can fail (`_nc_Copy_Type` and the\n`buf` malloc). If either of those later allocations fails, execution falls through\nto `free_field(New_Field)`. `free_field()` correctly frees `expanded` and calls\n`delwin(working)` only when `field->expanded != NULL`. Since `expanded` was\nallocated with `typeCalloc` it is non-NULL but may be all-zeros, and `working`\ncould have failed (returned NULL from `newpad`). `delwin(NULL)` behaviour is\nimplementation-defined. More critically, if `typeCalloc` itself returns NULL\n(OOM), then `expanded` is NULL and the `working` pad leaks since `free_field()`\nonly cleans up widec resources when `expanded != NULL`.","fix":"Check both allocations for NULL immediately after they are made and jump to the\nerror path (calling `free_field`) if either fails. Also guard `delwin(working)`\nagainst a NULL `working` pointer in `free_field()`.","locations":[{"ref":"payloads/libpayload/curses/form/fld_def.c:306-334","code":"  306 | #if USE_WIDEC_SUPPORT\n  307 |       New_Field->working = newpad(1, Buffer_Length(New_Field) + 1);\n  308 |       New_Field->expanded = typeCalloc(char *, 1 + (unsigned)nbuf);\n  309 | #endif\n  310 | \n  311 |       if (_nc_Copy_Type(New_Field, &default_field))\n  312 | \t{\n  313 | \t  size_t len;\n  314 | \n  315 | \t  len = Total_Buffer_Size(New_Field);\n  316 | \t  if ((New_Field->buf = (FIELD_CELL *)malloc(len)))\n  317 | \t    {\n  318 | \t      /* Prefill buffers with blanks and insert terminating zeroes\n  319 | \t         between buffers */\n  320 | \t      int i, j;\n  321 | \t      int cells = Buffer_Length(New_Field);\n  322 | \n  323 | \t      for (i = 0; i <= New_Field->nbuf; i++)\n  324 | \t\t{\n  325 | \t\t  FIELD_CELL *buffer = &(New_Field->buf[(cells + 1) * i]);\n  326 | \n  327 | \t\t  for (j = 0; j < cells; ++j)\n  328 | \t\t    {\n  329 | \t\t      buffer[j] = blank;\n  330 | \t\t    }\n  331 | \t\t  buffer[j] = zeros;\n  332 | \t\t}\n  333 | \t      returnField(New_Field);\n  334 | \t    }","lines":29,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fld_def.c#L306-L334"}]},{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In Generic_RegularExpression_Type (HAVE_REGEXP_H_FUNCS / HAVE_REGEXPR_H_FUNCS branch),\npArg->refCount is allocated at line 154 before the compilation retry loop.\nTwo paths leak it:\n1. If compile() returns a fatal error (reg_errno != 50): free(pArg) is called at\n   line 177 but pArg->refCount is never freed first.\n2. If the loop exhausts blen > MAX_RX_LEN and pArg->compiled_expression stays NULL:\n   the cleanup at lines 191-194 calls free(pArg) without freeing pArg->refCount.\nIn both cases the refCount allocation is permanently lost.","fix":"Free pArg->refCount before freeing pArg in both error paths:\n  /* fatal error path: */\n  free(pArg->refCount);\n  free(pArg);\n  pArg = NULL;\n  /* and in the post-loop cleanup: */\n  free(pArg->refCount);\n  free(pArg);\n  pArg = NULL;","locations":[{"ref":"payloads/libpayload/curses/form/fty_regex.c:146-195","code":"  146 |       pArg = typeMalloc(RegExp_Arg, 1);\n  147 | \n  148 |       if (pArg)\n  149 | \t{\n  150 | \t  int blen = RX_INCREMENT;\n  151 | \n  152 | \t  T((T_CREATE(\"RegExp_Arg %p\"), pArg));\n  153 | \t  pArg->compiled_expression = NULL;\n  154 | \t  pArg->refCount = typeMalloc(unsigned long, 1);\n  155 | \n  156 | \t  *(pArg->refCount) = 1;\n  157 | \n  158 | \t  do\n  159 | \t    {\n  160 | \t      char *buf = typeMalloc(char, blen);\n  161 | \n  162 | \t      if (buf)\n  163 | \t\t{\n  164 | #if HAVE_REGEXP_H_FUNCS\n  165 | \t\t  char *last_pos = compile(rx, buf, &buf[blen], '\\0');\n  166 | \n  167 | #else /* HAVE_REGEXPR_H_FUNCS */\n  168 | \t\t  char *last_pos = compile(rx, buf, &buf[blen]);\n  169 | #endif\n  170 | \t\t  if (reg_errno)\n  171 | \t\t    {\n  172 | \t\t      free(buf);\n  173 | \t\t      if (reg_errno == 50)\n  174 | \t\t\tblen += RX_INCREMENT;\n  175 | \t\t      else\n  176 | \t\t\t{\n  177 | \t\t\t  free(pArg);\n  178 | \t\t\t  pArg = NULL;\n  179 | \t\t\t  break;\n  180 | \t\t\t}\n  181 | \t\t    }\n  182 | \t\t  else\n  183 | \t\t    {\n  184 | \t\t      pArg->compiled_expression = buf;\n  185 | \t\t      break;\n  186 | \t\t    }\n  187 | \t\t}\n  188 | \t    }\n  189 | \t  while (blen <= MAX_RX_LEN);\n  190 | \t}\n  191 |       if (pArg && !pArg->compiled_expression)\n  192 | \t{\n  193 | \t  free(pArg);\n  194 | \t  pArg = NULL;\n  195 | \t}","lines":50,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_regex.c#L146-L195"}]},{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In m_new.c new_menu() / m_post.c post_menu(), when typeCalloc(MENU,1) succeeds and _nc_Connect_Items() fails, the code correctly calls free(menu). However, free_menu() does NOT free menu->pattern even though pattern can be allocated in _nc_Connect_Items() (via _nc_Calculate_Item_Length_and_Width which calls set_menu_format which allocates pattern). If _nc_Connect_Items allocates the pattern buffer internally and then fails after that allocation, the partial cleanup via free(menu) leaks the pattern buffer because the menu struct is freed directly without calling _nc_Disconnect_Items or zeroing pattern first.","fix":"Before freeing menu on connect failure, call _nc_Disconnect_Items(menu) if it handles partial state, or explicitly free menu->pattern if set, matching the logic in free_menu().","locations":[{"ref":"payloads/libpayload/curses/menu/m_new.c:75-80","code":"   75 | \t  if (!_nc_Connect_Items(menu, items))\n   76 | \t    {\n   77 | \t      err = E_NOT_CONNECTED;\n   78 | \t      free(menu);\n   79 | \t      menu = (MENU *) 0;\n   80 | \t    }","lines":6,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_new.c#L75-L80"}]},{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"low","easy":false,"description":"In cbfs_module_init(), filenames[index] = strdup(f->filename) is called for each CBFS file but the return value of strdup is never checked for NULL. If strdup fails (allocation failure), a NULL pointer is stored in the filenames array. Later in cbfs_module_redraw(), findfile(filenames[i]) and strlen(filenames[i]) dereference this NULL, causing a crash. Additionally, on init failure after partial allocation, the previously strdup'd strings are never freed.","fix":"Check the return value of strdup and return an error on failure. On error, free all previously allocated filenames before returning.","locations":[{"ref":"payloads/coreinfo/cbfs_module.c:100-106","code":"  100 | \tfilenames = malloc(filecount * sizeof(char *));\n  101 | \tif (filenames == NULL)\n  102 | \t\treturn 0;\n  103 | \n  104 | \tfor (f = firstfile(); f; f = nextfile(f))\n  105 | \t\tfilenames[index++] = strdup((const char *)f->filename);\n  106 | ","lines":7,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/cbfs_module.c#L100-L106"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","easy":true,"description":"In bootlog_module_init(), g_buf is allocated with only chars_count bytes, but when the CBMEM console has overflowed (OVERFLOW bit set), the code writes overflow_chars_count bytes at g_buf[0] and then chars_count bytes at g_buf[overflow_chars_count]. The total bytes written is overflow_chars_count + chars_count, which exceeds the allocated chars_count bytes, causing a heap buffer overflow. This corrupts heap metadata and adjacent allocations.","fix":"Change the malloc call to allocate the full required size: g_buf = malloc(chars_count + overflow_chars_count). The variable g_lines_count already correctly uses the sum on line 125.","locations":[{"ref":"payloads/coreinfo/bootlog_module.c:128-143","code":"  128 | \tg_buf = malloc(chars_count);\n  129 | \tif (!g_buf) {\n  130 | \t\treturn -3;\n  131 | \t}\n  132 | \n  133 | \tif (console->cursor & OVERFLOW) {\n  134 | \t\tif (sanitize_buffer_for_display(buffer + cursor, size - cursor,\n  135 | \t\t\t\tg_buf, overflow_chars_count, SCREEN_X) < 0) {\n  136 | \t\t\tgoto err_free;\n  137 | \t\t}\n  138 | \t}\n  139 | \tif (sanitize_buffer_for_display(buffer, cursor,\n  140 | \t\t\t\t\tg_buf + overflow_chars_count,\n  141 | \t\t\t\t\tchars_count, SCREEN_X) < 0) {\n  142 | \t\tgoto err_free;\n  143 | \t}","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/bootlog_module.c#L128-L143"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"In timestamps_module_init(), the buffer is allocated as (max_entries + 4) * SCREEN_X bytes, but the per-entry formatting in timestamp_print_entry() can write significantly more than SCREEN_X bytes per entry across its multiple snprintf calls (up to ~95 bytes per entry: 51 for id+name, 20 for timestamp, 2 for ' (', 20 for step_time, 1 for ')', 1 for newline). Each individual snprintf is limited to SCREEN_X=80 bytes, but because buff_cur accumulates across all calls, approximately 95 bytes are written per entry. For more than ~15 entries (common in practice: coreboot usually records 50+ timestamps), the buffer overflows. Additionally, each snprintf call passes SCREEN_X rather than the remaining buffer space, so the size argument is semantically wrong.","fix":"Increase the buffer allocation to account for actual maximum bytes per entry. Calculate the real worst-case size per entry (at least 100 bytes) and allocate accordingly: buffer = malloc((max_entries + 4) * 100). Also pass the remaining buffer size (buffer_total_size - buff_cur) to snprintf instead of SCREEN_X.","locations":[{"ref":"payloads/coreinfo/timestamps_module.c:159-186","code":"  159 | \tbuffer = malloc((max_entries + 4) * SCREEN_X * sizeof(char));\n  160 | \n  161 | \tif (buffer == NULL)\n  162 | \t\treturn -3;\n  163 | \n  164 | \t/* Write the content */\n  165 | \tbuff_cur += snprintf(buffer, SCREEN_X, \"%d entries total:\\n\\n\",\n  166 | \t\t\tn_entries);\n  167 | \n  168 | \tprev_stamp = 0;\n  169 | \ttimestamp_print_entry(buffer, SCREEN_X, &buff_cur, 0, base_time,\n  170 | \t\t\tprev_stamp);\n  171 | \tprev_stamp = base_time;\n  172 | \n  173 | \ttotal_time = 0;\n  174 | \tfor (u32 i = 0; i < n_entries; i++) {\n  175 | \t\tuint64_t stamp;\n  176 | \t\tconst struct timestamp_entry *tse = &timestamps->entries[i];\n  177 | \n  178 | \t\tstamp = tse->entry_stamp + base_time;\n  179 | \t\ttotal_time += timestamp_print_entry(buffer, SCREEN_X,\n  180 | \t\t\t\t&buff_cur, tse->entry_id, stamp, prev_stamp);\n  181 | \t\tprev_stamp = stamp;\n  182 | \t}\n  183 | \n  184 | \tbuff_cur += snprintf(buffer + buff_cur, SCREEN_X, \"\\nTotal Time: \");\n  185 | \tbuff_cur += snprintf(buffer + buff_cur, SCREEN_X, \"%llu\", total_time);\n  186 | \tbuff_cur += snprintf(buffer + buff_cur, SCREEN_X, \"\\n\");","lines":28,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/coreinfo/timestamps_module.c#L159-L186"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"In dos/pdcdisp.c and os2/pdcdisp.c, PDC_transform_line() declares a fixed-size local buffer\ntemp_line[256] but iterates up to `len` characters from `srcp`, writing into temp_line[j] for\nj in [0, len). The caller passes a `len` derived from the physical screen width (curscr->_maxx).\nScreen widths above 256 columns (e.g. 320-column modes or wide virtual terminals) cause a\nstack buffer overflow, corrupting the stack frame and potentially enabling code execution.","fix":"Increase temp_line to at least MAX_SCREEN_COLS (e.g. 512), or allocate it dynamically based on `len`, and add an assertion/clamp so `len` never exceeds the buffer size.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/dos/pdcdisp.c:94-109","code":"   94 |         struct {unsigned char text, attr;} temp_line[256];\n   95 | \n   96 |         /* replace the attribute part of the chtype with the actual\n   97 |            color value for each chtype in the line */\n   98 | \n   99 |         for (j = 0; j < len; j++)\n  100 |         {\n  101 |             chtype ch = srcp[j];\n  102 | \n  103 |             temp_line[j].attr = pdc_atrtab[ch >> PDC_ATTR_SHIFT];\n  104 | #ifdef CHTYPE_LONG\n  105 |             if (ch & A_ALTCHARSET && !(ch & 0xff80))\n  106 |                 ch = acs_map[ch & 0x7f];\n  107 | #endif\n  108 |             temp_line[j].text = ch & 0xff;\n  109 |         }","lines":16,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/dos/pdcdisp.c#L94-L109"},{"ref":"payloads/libpayload/curses/PDCurses/os2/pdcdisp.c:68-87","code":"   68 |     struct {unsigned char text, attr;} temp_line[256];\n   69 |     int j;\n   70 | \n   71 |     PDC_LOG((\"PDC_transform_line() - called: line %d\\n\", lineno));\n   72 | \n   73 |     /* replace the attribute part of the chtype with the\n   74 |        actual color value for each chtype in the line */\n   75 | \n   76 |     for (j = 0; j < len; j++)\n   77 |     {\n   78 |         chtype ch = srcp[j];\n   79 | \n   80 |         temp_line[j].attr = pdc_atrtab[ch >> PDC_ATTR_SHIFT];\n   81 | \n   82 | #ifdef CHTYPE_LONG\n   83 |         if (ch & A_ALTCHARSET && !(ch & 0xff80))\n   84 |             ch = acs_map[ch & 0x7f];\n   85 | #endif\n   86 |         temp_line[j].text = ch & 0xff;\n   87 |     }","lines":20,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/os2/pdcdisp.c#L68-L87"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":true,"description":"In wgetnstr() (non-wide path), when n <= 0 the function proceeds without error -- n is never validated to be positive before use. A caller passing n=0 skips the 'chars < n' guard (0 < 0 is always false), so no characters are stored, but the final '*p = NUL' still writes into an unbounded location since p==str is valid. More critically, when the caller passes a negative n (other than -1 which would come from the internal wrappers), no clamping to MAXLINE occurs in the non-wide path; but the check 'if (n < 0 || n > MAXLINE) n = MAXLINE' only exists in the PDC_WIDE branch (line 74). The non-wide path has no such check, so a caller to getnstr(str, INT_MIN) would result in 'chars < n' always being true, writing unboundedly into str.","fix":"Add the same n clamping used in the wide path ('if (n < 0 || n > MAXLINE) n = MAXLINE;') at the top of the non-wide branch of wgetnstr(), before the main loop.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getstr.c:69-212","code":"   69 | int wgetnstr(WINDOW *win, char *str, int n)\n   70 | {\n   71 | #ifdef PDC_WIDE\n   72 |     wchar_t wstr[MAXLINE + 1];\n   73 | \n   74 |     if (n < 0 || n > MAXLINE)\n   75 |         n = MAXLINE;\n   76 | \n   77 |     if (wgetn_wstr(win, (wint_t *)wstr, n) == ERR)\n   78 |         return ERR;\n   79 | \n   80 |     return PDC_wcstombs(str, wstr, n);\n   81 | #else\n   82 |     int ch, i, num, x, chars;\n   83 |     char *p;\n   84 |     bool stop, oldecho, oldcbreak, oldnodelay;\n   85 | \n   86 |     PDC_LOG((\"wgetnstr() - called\\n\"));\n   87 | \n   88 |     if (!win || !str)\n   89 |         return ERR;\n   90 | \n   91 |     chars = 0;\n   92 |     p = str;\n   93 |     stop = FALSE;\n   94 | \n   95 |     x = win->_curx;\n   96 | \n   97 |     oldcbreak = SP->cbreak; /* remember states */\n   98 |     oldecho = SP->echo;\n   99 |     oldnodelay = win->_nodelay;\n  100 | \n  101 |     SP->echo = FALSE;       /* we do echo ourselves */\n  102 |     cbreak();               /* ensure each key is returned immediately */\n  103 |     win->_nodelay = FALSE;  /* don't return -1 */\n  104 | \n  105 |     wrefresh(win);\n  106 | \n  107 |     while (!stop)\n  108 |     {\n  109 |         ch = wgetch(win);\n  110 | \n  111 |         switch (ch)\n  112 |         {\n  113 | \n  114 |         case '\\t':\n  115 |             ch = ' ';\n  116 |             num = TABSIZE - (win->_curx - x) % TABSIZE;\n  117 |             for (i = 0; i < num; i++)\n  118 |             {\n  119 |                 if (chars < n)\n  120 |                 {\n  121 |                     if (oldecho)\n  122 |                         waddch(win, ch);\n  123 |                     *p++ = ch;\n  124 |                     ++chars;\n  125 |                 }\n  126 |                 else\n  127 |                     beep();\n  128 |             }\n  129 |             break;\n  130 | \n  131 |         case _ECHAR:        /* CTRL-H -- Delete character */\n  132 |             if (p > str)\n  133 |             {\n  134 |                 if (oldecho)\n  135 |                     waddstr(win, \"\\b \\b\");\n  136 |                 ch = (unsigned char)(*--p);\n  137 |                 if ((ch < ' ') && (oldecho))\n  138 |                     waddstr(win, \"\\b \\b\");\n  139 |                 chars--;\n  140 |             }\n  141 |             break;\n  142 | \n  143 |         case _DLCHAR:       /* CTRL-U -- Delete line */\n  144 |             while (p > str)\n  145 |             {\n  146 |                 if (oldecho)\n  147 |                     waddstr(win, \"\\b \\b\");\n  148 |                 ch = (unsigned char)(*--p);\n  149 |                 if ((ch < ' ') && (oldecho))\n  150 |                     waddstr(win, \"\\b \\b\");\n  151 |             }\n  152 |             chars = 0;\n  153 |             break;\n  154 | \n  155 |         case _DWCHAR:       /* CTRL-W -- Delete word */\n  156 | \n  157 |             while ((p > str) && (*(p - 1) == ' '))\n  158 |             {\n  159 |                 if (oldecho)\n  160 |                     waddstr(win, \"\\b \\b\");\n  161 | \n  162 |                 --p;        /* remove space */\n  163 |                 chars--;\n  164 |             }\n  165 |             while ((p > str) && (*(p - 1) != ' '))\n  166 |             {\n  167 |                 if (oldecho)\n  168 |                     waddstr(win, \"\\b \\b\");\n  169 | \n  170 |                 ch = (unsigned char)(*--p);\n  171 |                 if ((ch < ' ') && (oldecho))\n  172 |                     waddstr(win, \"\\b \\b\");\n  173 |                 chars--;\n  174 |             }\n  175 |             break;\n  176 | \n  177 |         case '\\n':\n  178 |         case '\\r':\n  179 |             stop = TRUE;\n  180 |             if (oldecho)\n  181 |                 waddch(win, '\\n');\n  182 |             break;\n  183 | \n  184 |         default:\n  185 |             if (chars < n)\n  186 |             {\n  187 |                 if (!SP->key_code && ch < 0x100)\n  188 |                 {\n  189 |                     *p++ = ch;\n  190 |                     if (oldecho)\n  191 |                         waddch(win, ch);\n  192 |                     chars++;\n  193 |                 }\n  194 |             }\n  195 |             else\n  196 |                 beep();\n  197 | \n  198 |             break;\n  199 | \n  200 |         }\n  201 | \n  202 |         wrefresh(win);\n  203 |     }\n  204 | \n  205 |     *p = '\\0';\n  206 | \n  207 |     SP->echo = oldecho;     /* restore old settings */\n  208 |     SP->cbreak = oldcbreak;\n  209 |     win->_nodelay = oldnodelay;\n  210 | \n  211 |     return OK;\n  212 | #endif","lines":144,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getstr.c#L69-L212"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"getstr(), wgetstr(), mvgetstr(), and mvwgetstr() all call wgetnstr() with n=MAXLINE (255). The caller-supplied buffer must therefore be at least 256 bytes, but the API gives no way to enforce this. A caller that allocates fewer than 256 bytes (e.g. 'char buf[64]') will get a stack/heap buffer overflow because wgetnstr() will write up to MAXLINE characters plus a NUL terminator into the buffer. The comment in the man-page header even warns: 'there's no way to know how long the buffer passed to wgetstr() is', yet the implementation picks an arbitrary 255-byte cap rather than bounding to what wgetnstr() was passed. The PDC_WIDE branch delegates to wgetn_wstr() with the same n, then calls PDC_wcstombs(str, wstr, n) -- the output of wcstombs can exceed n bytes for multi-byte encodings, so n is an insufficient guard there too.","fix":"Remove the unbounded wgetstr/getstr/mvgetstr/mvwgetstr wrappers, or at minimum document that the buffer must be at least MAXLINE+1 bytes. For PDC_WIDE, use the byte-count returned by PDC_wcstombs to ensure it did not exceed n.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/getstr.c:215-246","code":"  215 | int getstr(char *str)\n  216 | {\n  217 |     PDC_LOG((\"getstr() - called\\n\"));\n  218 | \n  219 |     return wgetnstr(stdscr, str, MAXLINE);\n  220 | }\n  221 | \n  222 | int wgetstr(WINDOW *win, char *str)\n  223 | {\n  224 |     PDC_LOG((\"wgetstr() - called\\n\"));\n  225 | \n  226 |     return wgetnstr(win, str, MAXLINE);\n  227 | }\n  228 | \n  229 | int mvgetstr(int y, int x, char *str)\n  230 | {\n  231 |     PDC_LOG((\"mvgetstr() - called\\n\"));\n  232 | \n  233 |     if (move(y, x) == ERR)\n  234 |         return ERR;\n  235 | \n  236 |     return wgetnstr(stdscr, str, MAXLINE);\n  237 | }\n  238 | \n  239 | int mvwgetstr(WINDOW *win, int y, int x, char *str)\n  240 | {\n  241 |     PDC_LOG((\"mvwgetstr() - called\\n\"));\n  242 | \n  243 |     if (wmove(win, y, x) == ERR)\n  244 |         return ERR;\n  245 | \n  246 |     return wgetnstr(win, str, MAXLINE);","lines":32,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/getstr.c#L215-L246"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"PDC_wcstombs() (PDC_FORCE_UTF8 path) overflows the destination buffer when encoding multi-byte UTF-8 sequences. The loop condition is 'while (*src && i < n)', which allows i to be as large as n-1 when entering the body. For a 2-byte sequence (code < 0x800), the code writes dest[i] and dest[i+1] then does i += 2. If i started at n-1, dest[n] is written - one byte past the n-byte buffer. For a 3-byte sequence the problem is worse: from i=n-2 dest[n] is written; from i=n-1 both dest[n] and dest[n+1] are written. Additionally, the null terminator 'dest[i] = 0' after the loop can be written to dest[n] when the loop exhausted the buffer with multi-byte characters (i increments by 2 or 3, easily reaching or exceeding n).","fix":"Change the loop condition to check that there is enough room for the widest possible encoding before writing: for a 2-byte sequence require i + 1 < n, for a 3-byte sequence require i + 2 < n. A clean approach: 'while (*src) { code = *src++; bytes = (code < 0x80) ? 1 : (code < 0x800) ? 2 : 3; if (i + bytes >= n) break; /* write bytes */ i += bytes; } dest[i] = 0;'","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/util.c:279-307","code":"  279 |     while (*src && i < n)\n  280 |     {\n  281 |         chtype code = *src++;\n  282 | \n  283 |         if (code < 0x80)\n  284 |         {\n  285 |             dest[i] = code;\n  286 |             i++;\n  287 |         }\n  288 |         else\n  289 |             if (code < 0x800)\n  290 |             {\n  291 |                 dest[i] = ((code & 0x07c0) >> 6) | 0xc0;\n  292 |                 dest[i + 1] = (code & 0x003f) | 0x80;\n  293 |                 i += 2;\n  294 |             }\n  295 |             else\n  296 |             {\n  297 |                 dest[i] = ((code & 0xf000) >> 12) | 0xe0;\n  298 |                 dest[i + 1] = ((code & 0x0fc0) >> 6) | 0x80;\n  299 |                 dest[i + 2] = (code & 0x003f) | 0x80;\n  300 |                 i += 3;\n  301 |             }\n  302 |     }\n  303 | # else\n  304 |     size_t i = wcstombs(dest, src, n);\n  305 | # endif\n  306 |     dest[i] = '\\0';\n  307 |     return i;","lines":29,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/pdcurses/util.c#L279-L307"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":true,"description":"PDC_transform_line() in win32/pdcdisp.c uses a fixed-size stack buffer of 512 CHAR_INFO\nelements. The function accepts an arbitrary `len` parameter from its callers. If `len` exceeds 512 the\nloop at line 104 writes past the end of `ci[512]`, causing a stack buffer overflow. A terminal window\nwider than 512 columns (unlikely but possible) or a malicious/corrupted len value would trigger this.","fix":"Either cap len to 512 at the start of the function (add `if (len > 512) len = 512;`)\nor allocate `ci` dynamically with `malloc(len * sizeof(CHAR_INFO))` and free it before returning.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/win32/pdcdisp.c:87-116","code":"   87 |     CHAR_INFO ci[512];\n   88 |     int j;\n   89 |     COORD bufSize, bufPos;\n   90 |     SMALL_RECT sr;\n   91 | \n   92 |     PDC_LOG((\"PDC_transform_line() - called: lineno=%d\\n\", lineno));\n   93 | \n   94 |     bufPos.X = bufPos.Y = 0;\n   95 | \n   96 |     bufSize.X = len;\n   97 |     bufSize.Y = 1;\n   98 | \n   99 |     sr.Top = lineno;\n  100 |     sr.Bottom = lineno;\n  101 |     sr.Left = x;\n  102 |     sr.Right = x + len - 1;\n  103 | \n  104 |     for (j = 0; j < len; j++)\n  105 |     {\n  106 |         chtype ch = srcp[j];\n  107 | \n  108 |         ci[j].Attributes = pdc_atrtab[ch >> PDC_ATTR_SHIFT];\n  109 | #ifdef CHTYPE_LONG\n  110 |         if (ch & A_ALTCHARSET && !(ch & 0xff80))\n  111 |             ch = acs_map[ch & 0x7f];\n  112 | #endif\n  113 |         ci[j].Char.UnicodeChar = ch & A_CHARTEXT;\n  114 |     }\n  115 | \n  116 |     WriteConsoleOutput(pdc_con_out, ci, bufSize, bufPos, &sr);","lines":30,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/win32/pdcdisp.c#L87-L116"}]},{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"In Previous_Enum, when args->count == 0 the kwds pointer is computed as\n'&args->kwds[cnt - 1]' which evaluates to '&args->kwds[-1]' (args->kwds is NULL\nwhen count is 0, per Generic_Enum_Type). This is undefined behavior - out-of-bounds\npointer arithmetic on a NULL pointer. The subsequent 'if (kwds)' check is always\ntrue (non-null pointer due to arithmetic), so the while loop then dereferences\nthe invalid pointer, causing a crash or memory corruption.","fix":"Guard against count == 0 at the start of Previous_Enum:\n  if (!args->kwds || args->count <= 0)\n    return FALSE;\nPlace this check before the kwds pointer computation at line 385.","locations":[{"ref":"payloads/libpayload/curses/form/fty_enum.c:383-405","code":"  383 |   const enumARG *args = (const enumARG *)argp;\n  384 |   int cnt = args->count;\n  385 |   char **kwds = &args->kwds[cnt - 1];\n  386 |   bool ccase = args->checkcase;\n  387 |   unsigned char *bp = (unsigned char *)field_buffer(field, 0);\n  388 | \n  389 |   if (kwds)\n  390 |     {\n  391 |       while (cnt--)\n  392 | \t{\n  393 | \t  if (Compare((unsigned char *)(*kwds--), bp, ccase) == EXACT)\n  394 | \t    break;\n  395 | \t}\n  396 | \n  397 |       if (cnt <= 0)\n  398 | \tkwds = &args->kwds[args->count - 1];\n  399 | \n  400 |       if ((cnt >= 0) || (Compare((const unsigned char *)dummy, bp, ccase) == EXACT))\n  401 | \t{\n  402 | \t  set_field_buffer(field, 0, *kwds);\n  403 | \t  return TRUE;\n  404 | \t}\n  405 |     }","lines":23,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/form/fty_enum.c#L383-L405"}]},{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"In m_req_name.c menu_request_by_name(), strncpy(buf, str, sizeof(buf)) copies up to 16 bytes but does NOT guarantee NUL-termination when the input string is exactly 16 bytes or longer (strncpy pads with NUL only up to sizeof(buf) but if source length >= sizeof(buf) the destination has no NUL). The subsequent while loop checks `buf[i] != '\\0'` but `i` is bounded by `sizeof(buf)`, so it won't overflow buf itself. However, the final strncmp on line 118 compares `request_names[i]` against `buf` using sizeof(buf)=16 as the count. If str has exactly 16 chars with no NUL at position 15, the comparison reads into uninitialized or next stack memory because `buf` is a 16-byte array and strncmp is asked to compare 16 bytes including the missing NUL. This means a 16+ char input can match a shorter request name spuriously if stack bytes happen to match.","fix":"Declare buf[17] and use strncpy(buf, str, 16); buf[16] = '\\0'; to always NUL-terminate. Alternatively use strlcpy if available.","locations":[{"ref":"payloads/libpayload/curses/menu/m_req_name.c:103-122","code":"  103 |   char buf[16];\n  104 | \n  105 |   T((T_CALLED(\"menu_request_by_name(%s)\"), _nc_visbuf(str)));\n  106 | \n  107 |   if (str)\n  108 |     {\n  109 |       strncpy(buf, str, sizeof(buf));\n  110 |       while ((i < sizeof(buf)) && (buf[i] != '\\0'))\n  111 | \t{\n  112 | \t  buf[i] = (char)toupper(UChar(buf[i]));\n  113 | \t  i++;\n  114 | \t}\n  115 | \n  116 |       for (i = 0; i < A_SIZE; i++)\n  117 | \t{\n  118 | \t  if (strncmp(request_names[i], buf, sizeof(buf)) == 0)\n  119 | \t    returnCode(MIN_MENU_COMMAND + (int)i);\n  120 | \t}\n  121 |     }\n  122 |   RETURN(E_NO_MATCH);","lines":20,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/menu/m_req_name.c#L103-L122"}]},{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"In tinycurses.c newwin(), window_count, ldat_count, and linebuf_count are each checked or incremented independently but only window_count is bounds-checked (line 394). ldat_count and linebuf_count can individually overflow their respective static arrays if called with unusual window sizes (e.g., a window with more lines than SCREEN_Y). ldat_list is sized [MAX_WINDOWS][SCREEN_Y] but ldat_count indexes it as a flat counter and is incremented by 1 per window regardless of num_lines. linebuf_list is sized [SCREEN_Y * MAX_WINDOWS][SCREEN_X + 1] but linebuf_count is incremented by num_lines per window; with 3 windows of 25 lines each that is exactly 75 which fits, but the check is absent. Any window taller than SCREEN_Y would overflow linebuf_list even if window_count < MAX_WINDOWS.","fix":"Add bounds checks: verify `ldat_count < MAX_WINDOWS` and `linebuf_count + num_lines <= SCREEN_Y * MAX_WINDOWS` before proceeding, and return NULL on overflow.","locations":[{"ref":"payloads/libpayload/curses/tinycurses.c:385-421","code":"  385 | WINDOW *newwin(int num_lines, int num_columns, int begy, int begx)\n  386 | {\n  387 | \tWINDOW *win;\n  388 | \tint i;\n  389 | \n  390 | \t/* Use next statically allocated window. */\n  391 | \t// TODO: Error handling. Yes. Please.\n  392 | \t// TODO: WINDOWLIST?\n  393 | \n  394 | \tif (window_count >= MAX_WINDOWS)\n  395 | \t\treturn NULL;\n  396 | \n  397 | \twin = &window_list[window_count++];\n  398 | \n  399 | \t// bool is_pad = (flags & _ISPAD);\n  400 | \n  401 | \t// TODO: Checks.\n  402 | \n  403 | \twin->_cury = 0;\n  404 | \twin->_curx = 0;\n  405 | \twin->_maxy = num_lines - 1;\n  406 | \twin->_maxx = num_columns - 1;\n  407 | \twin->_begy = begy;\n  408 | \twin->_begx = begx;\n  409 | \t// win->_yoffset = SP->_topstolen;\n  410 | \n  411 | \twin->_line = ldat_list[ldat_count++];\n  412 | \n  413 | \t/* FIXME: Is this right? Should the window attributes be normal? */\n  414 | \twin->_color = PAIR_NUMBER(0);\n  415 | \twin->_attrs = A_NORMAL;\n  416 | \n  417 | \tfor (i = 0; i < num_lines; i++)\n  418 | \t\twin->_line[i].text =\n  419 | \t\t     (NCURSES_CH_T *)&linebuf_list[linebuf_count++];\n  420 | \n  421 | \treturn win;","lines":37,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/tinycurses.c#L385-L421"}]},{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":true,"description":"In get_cmos_value() and set_cmos_value(), the len parameter is u32 and the while loop does len -= 8. When len is not a multiple of 8 and greater than 8 (e.g., len=10), the first subtraction leaves len=2, then the second iteration subtracts 8 from an unsigned 2 to produce 0xFFFFFFFE. The loop condition (len > 0) is now true for ~536 million iterations, causing unbounded reads/writes to the value buffer and arbitrary NVRAM addresses.","fix":"Replace the while condition with a signed check, or only enter the byte-copy loop when len is known to be a multiple of 8. A safe fix: change the loop to iterate a fixed count: for (int bytes = len / 8; bytes > 0; bytes--) { value[offs++] = nvram->read(addr++); }. Also handle any remaining bits (len % 8) with a partial read/mask.","locations":[{"ref":"payloads/libpayload/drivers/options.c:120-123","code":"  120 | \twhile (len > 0) {\n  121 | \t\tlen -= 8;\n  122 | \t\tvalue[offs++]=nvram->read(addr++);\n  123 | \t}","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L120-L123"},{"ref":"payloads/libpayload/drivers/options.c:149-152","code":"  149 | \twhile (len > 0) {\n  150 | \t\tlen -= 8;\n  151 | \t\tnvram->write(value[offs++], addr++);\n  152 | \t}","lines":4,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/drivers/options.c#L149-L152"}]},{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":true,"description":"In SHA1Update(), the expression (len << 3) is computed using the type of len, which is size_t. On 32-bit targets size_t is 32 bits, so the shift overflows to zero (or wraps) when len >= 0x20000000 (512 MiB). The overflowed value is then added to context->count (u64), silently producing a wrong bit-count and therefore a wrong digest for inputs larger than 512 MiB on 32-bit builds.","fix":"Cast len to u64 before shifting: context->count += ((u64)len << 3);","locations":[{"ref":"payloads/libpayload/crypto/sha1.c:143","code":"  143 | \tcontext->count += (len << 3);","lines":1,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/crypto/sha1.c#L143"}]},{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"In tui.c, padstr() uses a static char buf[MAXSTRLEN] (256 bytes). The format string produced is '%-<length>s', where length is the caller-supplied field width. When length (which equals COLS or COLS-3) exceeds 255, the sprintf() call writes more than 256 bytes into buf, overflowing the static buffer. COLS > 255 is common on modern or wide terminals.","fix":"Either allocate buf dynamically (malloc(length + 1)) or increase MAXSTRLEN to a safe value and enforce the limit before calling sprintf.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/demos/tui.c:71-79","code":"   71 | {\n   72 |     static char buf[MAXSTRLEN];\n   73 |     char fmt[10];\n   74 | \n   75 |     sprintf(fmt, (int)strlen(s) > length ? \"%%.%ds\" : \"%%-%ds\", length);\n   76 |     sprintf(buf, fmt, s);\n   77 | \n   78 |     return buf;\n   79 | }","lines":9,"link":"https://github.com/coreboot/coreboot/blob/d8bc8a0595ded6b79177fef04b38a07e577e70e1/payloads/libpayload/curses/PDCurses/demos/tui.c#L71-L79"}]},{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"vwprintw() uses a 513-byte local buffer 'printbuf' and, when HAVE_VSNPRINTF is not defined, falls back to vsprintf() with no length limit. vsprintf() can write arbitrarily large output into printbuf, overflowing the buffer if the formatted string exceeds 512 characters. The vsnprintf() path is safe (limit of 512 bytes including null fits in 513 bytes), but the fallback path has no guard.","fix":"Replace the vsprintf fallback with a size-limited alternative. If vsnprintf is not available, either implement a bounded sprintf wrapper or increase printbuf and truncate. At minimum add a compile-time assertion that HAVE_VSNPRINTF is defined for safety.","locations":[{"ref":"payloads/libpayload/curses/PDCurses/pdcurses/printw.c:43-53","code":"   43 |     char printbuf[513];\n   44 |     int len;\n   45 | \n   46 |     PDC_LOG((\"
