<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`find_latest_version` picks the \"latest\" SDK platform / build-tools directory with `.max()` over `OsString` file names, i.e. **lexicographic** order, not version order. Real Android SDK layouts break this immediately: with `platforms/android-9` and `platforms/android-34` present, `\"android-9\" > \"android-34\"` lexicographically, so the API-9 platform is selected; with `build-tools/9.0.0` and `build-tools/34.0.0`, `9.0.0` wins. It also prefers pre-releases: `\"35.0.0-rc1\" > \"35.0.0\"`. The result is that `android_jar(None)` / `android_d8_jar(None)` compile against a decade-old `android.jar` or run an ancient `d8.jar` without any error - only a `cargo::warning` naming the (wrong) version it chose.","fix":"Compare parsed numeric version components instead of raw strings. For example:\n\n```rust\nfn version_key(name: &str) -> (Vec<u32>, bool, String) {\n    let core = name.strip_prefix(\"android-\").unwrap_or(name);\n    // `-ext4`, `-rc2`, ... are split off so `35.0.0` sorts above `35.0.0-rc1`.\n    let (nums, suffix) = match core.split_once('-') {\n        Some((n, s)) => (n, Some(s)),\n        None => (core, None),\n    };\n    let parts = nums.split('.').map(|p| p.parse().unwrap_or(0)).collect();\n    (parts, suffix.is_none(), name.to_string())\n}\n```\n\nthen in `find_latest_version` replace `.max()` with\n\n```rust\n.filter_map(|entry| entry.file_name().into_string().ok())\n.max_by(|a, b| version_key(a).cmp(&version_key(b)))\n```\n\nKeep the existing `entry.path().join(arg).exists()` filter so only usable directories are considered.","locations":[{"ref":"src/env_paths/mod.rs:160-173","code":"  160 | /// Finds subdirectories in which the subpath `arg` exists, and returns the maximum\n  161 | /// item name in lexicographical order based on `Ord` impl of `std::path::Path`.\n  162 | /// NOTE: the behavior can be changed in the future.\n  163 | /// \n  164 | /// Code inspired by <https://docs.rs/crate/i-slint-backend-android-activity/1.9.1/source/build.rs>.\n  165 | fn find_latest_version(base: impl AsRef<Path>, arg: impl AsRef<Path>) -> Option<String> {\n  166 |     std::fs::read_dir(base)\n  167 |         .ok()?\n  168 |         .filter_map(|entry| entry.ok())\n  169 |         .filter(|entry| entry.path().join(arg.as_ref()).exists())\n  170 |         .map(|entry| entry.file_name())\n  171 |         .max()\n  172 |         .and_then(|name| name.to_os_string().into_string().ok())\n  173 | }","lines":14,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L160-L173"},{"ref":"src/env_paths/mod.rs:79-87","code":"   79 |                     .or_else(|| {\n   80 |                         let latest = find_latest_version(&platforms, \"android.jar\");\n   81 |                         #[cfg(feature = \"cargo\")]\n   82 |                         if let Some(ver) = latest.as_ref() {\n   83 |                             println!(\"cargo::warning=ANDROID_PLATFORM environment variable \\\n   84 |                                 is not set, using '{ver}'.\");\n   85 |                         }\n   86 |                         latest\n   87 |                     })","lines":9,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L79-L87"},{"ref":"src/env_paths/mod.rs:113-121","code":"  113 |                     .or_else(|| {\n  114 |                         let latest = find_latest_version(&build_tools, Path::new(\"lib\").join(\"d8.jar\"));\n  115 |                         #[cfg(feature = \"cargo\")]\n  116 |                         if let Some(ver) = latest.as_ref() {\n  117 |                             println!(\"cargo::warning=ANDROID_BUILD_TOOLS_VERSION environment variable \\\n  118 |                                 is not set, using '{ver}'.\");\n  119 |                         }\n  120 |                         latest\n  121 |                     })","lines":9,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L113-L121"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`JavaRun::command()` joins `class_paths` with a hardcoded `\";\"`, which is the classpath separator only on Windows. On Linux, macOS and Android (the primary hosts for Android builds) Java expects `\":\"` (`File.pathSeparator`). As soon as a caller adds more than one `class_path`, the JVM receives a single bogus path like `/a/b.jar;/c/d.jar`, silently fails to find the classes and dies with `NoClassDefFoundError`. The sibling `JavaBuild::command()` gets this right at `src/java_build.rs:171`, so this is an inconsistency inside the same crate. `Dexer` happens to escape the bug only because it sets exactly one class path (`src/dexer.rs:90`).","fix":"Use the platform separator instead of a hardcoded `\";\"`:\n\n```rust\nif !self.class_paths.is_empty() {\n    let separator = if cfg!(windows) { \";\" } else { \":\" };\n    cmd.arg(\"-cp\").arg(self.class_paths.join(OsStr::new(separator)));\n}\n```\n\nBetter still, factor the separator choice into a single shared helper in `env_paths` and have both `JavaRun::command()` and `JavaBuild::add_path_arg` call it, so the two can't drift apart again.","locations":[{"ref":"src/java_run.rs:67-69","code":"   67 |         if !self.class_paths.is_empty() {\n   68 |             cmd.arg(\"-cp\").arg(self.class_paths.join(OsStr::new(\";\")));\n   69 |         }","lines":3,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_run.rs#L67-L69"},{"ref":"src/java_build.rs:169-173","code":"  169 |         let add_path_arg = |cmd: &mut Command, arg_name, paths: &[OsString]| {\n  170 |             if paths.is_empty() { return; }\n  171 |             let seperator = if std::path::MAIN_SEPARATOR == '\\\\' { \";\" } else { \":\" };\n  172 |             cmd.arg(arg_name).arg(paths.join(OsStr::new(seperator)));\n  173 |         };","lines":5,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L169-L173"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Dexer::command()` always resolves `android.jar` and always appends `--lib`, even when `no_desugaring` is set. The comment at `src/dexer.rs:102` acknowledges that `--lib` and `--classpath` are \"probably redundant under this mode\", yet the code below it still hard-fails with `\"android.jar not provided, and could not be auto-discovered.\"` when the jar cannot be found. Combined with the doc on `Dexer::android_jar()` (\"This is required when compiling bytecode that uses Java 8 language features\"), which implies the jar is optional otherwise, this makes `Dexer` unusable on hosts where only `d8.jar` is available - notably the native-Android build case that `find_android_sdk` explicitly returns `None` for (`src/env_paths/find_android_sdk.rs:35-38`).","fix":"Only require and pass `--lib` when desugaring is actually enabled:\n\n```rust\nif self.no_desugaring {\n    // `--lib` and `--classpath` are meaningless without desugaring.\n    d8_run.arg(\"--no-desugaring\");\n} else {\n    let android_jar_path = self.android_jar_path\n        .clone()\n        .and_then(PathExt::path_if_exists)\n        .or_else(|| env_paths::android_jar(None))\n        .ok_or_else(|| std::io::Error::other(\n            \"android.jar not provided, and could not be auto-discovered.\"\n        ))?;\n    d8_run.arg(\"--lib\").arg(android_jar_path);\n\n    for class_path in &self.class_paths {\n        d8_run.arg(\"--classpath\").arg(class_path);\n    }\n}\n```","locations":[{"ref":"src/dexer.rs:101-113","code":"  101 |         if self.no_desugaring {\n  102 |             // `--lib` and `--classpath` options are probably redundant under this mode.\n  103 |             d8_run.arg(\"--no-desugaring\");\n  104 |         }\n  105 | \n  106 |         let android_jar_path = self.android_jar_path\n  107 |             .clone()\n  108 |             .and_then(PathExt::path_if_exists)\n  109 |             .or_else(|| env_paths::android_jar(None))\n  110 |             .ok_or_else(|| std::io::Error::other(\n  111 |                 \"android.jar not provided, and could not be auto-discovered.\"\n  112 |             ))?;\n  113 |         d8_run.arg(\"--lib\").arg(android_jar_path);","lines":13,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/dexer.rs#L101-L113"},{"ref":"src/dexer.rs:176-183","code":"  176 |     /// Specify the path to the `android.jar` of your Android SDK. This is required when\n  177 |     /// [compiling bytecode that uses Java 8 language features](https://developer.android.google.cn/tools/d8#j8).\n  178 |     ///\n  179 |     /// If not set, the default path is found using [crate::android_jar].\n  180 |     pub fn android_jar<P: AsRef<OsStr>>(&mut self, android_jar_path: P) -> &mut Self {\n  181 |         self.android_jar_path.replace(android_jar_path.as_ref().into());\n  182 |         self\n  183 |     }","lines":8,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/dexer.rs#L176-L183"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`env_android_platform_api_level` reads `ANDROID_PLATFORM` with `env_var(...).ok()`, which yields `Some(\"\")` for a variable that is *set but empty*. Because `Option::or_else` only fires on `None`, an empty `ANDROID_PLATFORM` short-circuits the whole chain: `ANDROID_API_LEVEL` and `ANDROID_SDK_VERSION` are never consulted, `base.is_empty()` returns `None`, and the caller silently falls back to \"highest version found in the SDK\". An empty `ANDROID_PLATFORM` in the environment (common in CI where variables are declared but conditionally populated) therefore makes `ANDROID_API_LEVEL=34` be ignored. The crate docs at `src/lib.rs:13-16` promise all three variables are \"treated identically\".","fix":"Filter out empty values before falling through, so an empty variable behaves like an unset one:\n\n```rust\nfn non_empty(var: &str) -> Option<String> {\n    env_var(var).ok().filter(|v| !v.trim().is_empty())\n}\n\nlet mut base = non_empty(ANDROID_PLATFORM)\n    .or_else(|| non_empty(ANDROID_API_LEVEL))\n    .or_else(|| non_empty(ANDROID_SDK_VERSION))?;\n```\n\nThe now-redundant `if base.is_empty() { return None; }` check can be dropped.","locations":[{"ref":"src/env_paths/mod.rs:131-138","code":"  131 | fn env_android_platform_api_level() -> Option<String> {\n  132 |     let mut base = env_var(ANDROID_PLATFORM).ok()\n  133 |         .or_else(|| env_var(ANDROID_API_LEVEL).ok())\n  134 |         .or_else(|| env_var(ANDROID_SDK_VERSION).ok())?;\n  135 |     \n  136 |     if base.is_empty() {\n  137 |         return None;\n  138 |     }","lines":8,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L131-L138"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`find_java_home` deliberately takes `lines.last()` when the lookup command reports several locations. That inverts the platform's own resolution order: both `where java` on Windows and `which -a java` list matches in `PATH` order, so the **first** entry is the `java` a user would actually get from the shell. Picking the last one means the crate can silently build against the lowest-priority (typically oldest, or a vendor stub such as `/usr/bin/java` shadowed by a newer JDK earlier in `PATH`) installation, which then interacts badly with the `-source`/`-target` version checks in `JavaBuild::command()`. The `eprintln!` message documents the choice but does not justify it.","fix":"Prefer the first match, which is the one the platform would resolve:\n\n```rust\nif lines.len() > 1 {\n    eprintln!(\"Using the first of {} discovered Java locations:\\n\\t{}\",\n        lines.len(),\n        lines.join(\"\\n\\t\"),\n    );\n    lines[0].to_string()\n} else {\n    output\n}\n```\n\nIf \"last\" was chosen intentionally for some platform quirk, record the reason in a comment so it is not \"fixed\" later by mistake.","locations":[{"ref":"src/env_paths/find_java.rs:27-38","code":"   27 |     let found_java_path = String::from_utf8(cmd_output.stdout).ok().map(|output| {\n   28 |         let lines = output.lines().collect::<Vec<&str>>();\n   29 |         if lines.len() > 1 {\n   30 |             eprintln!(\"Using the last of {} discovered Java locations:\\n\\t{}\",\n   31 |                 lines.len(),\n   32 |                 lines.join(\"\\n\\t\"),\n   33 |             );\n   34 |             lines.last().unwrap().to_string()\n   35 |         } else {\n   36 |             output\n   37 |         }\n   38 |     })?;","lines":12,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/find_java.rs#L27-L38"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ANDROID_SDK_EXTENSION` is appended to the platform string without any validation of its contents. `raw_ext.trim_start_matches(\"-\").trim_start_matches(\"ext\")` only strips prefixes, so `ANDROID_SDK_EXTENSION=beta` produces the nonexistent platform directory `android-34-extbeta`, and a value with surrounding whitespace (` 4`) produces `android-34-ext 4`. The failure surfaces much later as a bare \"android.jar not provided, and could not be auto-discovered\" from `Dexer`/`JavaBuild`, with no hint that the extension variable was the cause. `src/lib.rs:21-23` documents only the numeric forms.","fix":"Trim and validate before appending, ignoring (or rejecting) junk:\n\n```rust\nif let Ok(raw_ext) = env_var(ANDROID_SDK_EXTENSION) {\n    let ext_num = raw_ext\n        .trim()\n        .trim_start_matches('-')\n        .trim_start_matches(\"ext\");\n    if !ext_num.is_empty() {\n        if ext_num.chars().all(|c| c.is_ascii_digit()) {\n            base = format!(\"{}-ext{}\", base, ext_num);\n        } else {\n            #[cfg(feature = \"cargo\")]\n            println!(\"cargo::warning=ignoring invalid ANDROID_SDK_EXTENSION='{raw_ext}' \\\n                (expected a number such as `4`, `ext4` or `-ext4`).\");\n        }\n    }\n}\n```","locations":[{"ref":"src/env_paths/mod.rs:148-155","code":"  148 |     if let Ok(raw_ext) = env_var(ANDROID_SDK_EXTENSION) {\n  149 |         let ext_num = raw_ext\n  150 |             .trim_start_matches(\"-\")\n  151 |             .trim_start_matches(\"ext\");\n  152 |         if !ext_num.is_empty() {\n  153 |             base = format!(\"{}-ext{}\", base, ext_num);\n  154 |         }\n  155 |     }","lines":8,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L148-L155"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"`JavaBuild::command()` emits one `-processorpath` argument per entry in `annotation_processor_paths`. `javac`'s path options are single-valued (they are stored in a map keyed by the option, so the last occurrence wins) — repeating `-processorpath` does not append to the search path, it replaces it. With two or more annotation-processor paths configured, every path except the last is silently discarded and annotation processors fail to load. Note that the very same function already handles this correctly for `-cp`, `-sourcepath`, `-bootclasspath` and `-extdirs` via the `add_path_arg` closure.","fix":"Join the paths with the platform path separator through the existing `add_path_arg` helper instead of repeating the flag:\n\n```rust\nadd_path_arg(&mut cmd, \"-processorpath\", &self.annotation_processor_paths);\n```\n\nand delete the `for_each` loop at lines 184-185.","locations":[{"ref":"src/java_build.rs:184-185","code":"  184 |         self.annotation_processor_paths.iter()\n  185 |             .for_each(|p| { cmd.arg(\"-processorpath\").arg(p); });","lines":2,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L184-L185"},{"ref":"src/java_build.rs:169-177","code":"  169 |         let add_path_arg = |cmd: &mut Command, arg_name, paths: &[OsString]| {\n  170 |             if paths.is_empty() { return; }\n  171 |             let seperator = if std::path::MAIN_SEPARATOR == '\\\\' { \";\" } else { \":\" };\n  172 |             cmd.arg(arg_name).arg(paths.join(OsStr::new(seperator)));\n  173 |         };\n  174 |         add_path_arg(&mut cmd, \"-cp\",            &self.class_paths);\n  175 |         add_path_arg(&mut cmd, \"-sourcepath\",    &self.source_paths);\n  176 |         add_path_arg(&mut cmd, \"-bootclasspath\", &self.boot_class_paths);\n  177 |         add_path_arg(&mut cmd, \"-extdirs\",       &self.extension_dirs);","lines":9,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L169-L177"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"The crate mixes both build-script directive syntaxes: the old `cargo:key=value` form for `rerun-if-env-changed` and the new `cargo::key=value` form for the warnings. The double-colon form was only introduced in Cargo 1.77; on older toolchains `cargo::warning=...` is not recognised as a warning directive, so the diagnostic is lost (older Cargo versions also reject unknown `cargo::` instructions outright). `Cargo.toml` declares no `rust-version`, so nothing prevents the crate from being built with a toolchain that cannot honour these lines.","fix":"Pick one syntax and declare the matching MSRV. Either downgrade the warnings to the universally supported form:\n\n```rust\nprintln!(\"cargo:warning=ANDROID_PLATFORM environment variable is not set, using '{ver}'.\");\n```\n\nor keep `cargo::` everywhere (`cargo::rerun-if-env-changed=...` too) and add to `Cargo.toml`:\n\n```toml\nrust-version = \"1.77\"\n```","locations":[{"ref":"src/env_paths/mod.rs:81-85","code":"   81 |                         #[cfg(feature = \"cargo\")]\n   82 |                         if let Some(ver) = latest.as_ref() {\n   83 |                             println!(\"cargo::warning=ANDROID_PLATFORM environment variable \\\n   84 |                                 is not set, using '{ver}'.\");\n   85 |                         }","lines":5,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L81-L85"},{"ref":"src/env_paths/mod.rs:116-119","code":"  116 |                         if let Some(ver) = latest.as_ref() {\n  117 |                             println!(\"cargo::warning=ANDROID_BUILD_TOOLS_VERSION environment variable \\\n  118 |                                 is not set, using '{ver}'.\");\n  119 |                         }","lines":4,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L116-L119"},{"ref":"src/env_paths/mod.rs:276-277","code":"  276 |     #[cfg(feature = \"cargo\")]\n  277 |     println!(\"cargo:rerun-if-env-changed={}\", var);","lines":2,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L276-L277"},{"ref":"Cargo.toml:12-19","code":"   12 | documentation = \"https://docs.rs/android-build\"\n   13 | edition = \"2021\"\n   14 | homepage = \"https://robius.rs/\"\n   15 | keywords = [\"android\", \"java\", \"build\", \"build-rs\", \"robius\"]\n   16 | categories = [\"development-tools::build-utils\"]\n   17 | license = \"MIT\"\n   18 | readme = \"README.md\"\n   19 | repository = \"https://github.com/project-robius/android-build\"","lines":8,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/Cargo.toml#L12-L19"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"Every public lookup in this crate funnels through `env_var`, which (with the default `cargo` feature) prints `cargo:rerun-if-env-changed=<VAR>`. Per Cargo's contract, as soon as a build script emits **any** `rerun-if-*` instruction, Cargo stops using its default heuristic of re-running the script when any file in the package changes and re-runs it *only* when the declared env vars/paths change. So a user whose `build.rs` merely calls `android_build::android_jar(None)` (exactly what the `README.md` example does) silently loses rebuild-on-source-change: editing `YourJavaFile.java` no longer triggers recompilation, and stale `.class`/`.dex` output is linked into the app. The crate imposes this on its callers without emitting a matching `cargo:rerun-if-changed` for the Java sources it is given, and without documenting it.","fix":"Make the crate re-declare what it consumes rather than only what it reads from the environment. Concretely, emit a `rerun-if-changed` line for every input file the builder is given, so the disabled default heuristic is compensated for:\n\n```rust\npub fn file<P: AsRef<OsStr>>(&mut self, file: P) -> &mut Self {\n    let file = file.as_ref();\n    #[cfg(feature = \"cargo\")]\n    println!(\"cargo:rerun-if-changed={}\", Path::new(file).display());\n    self.files.push(file.into());\n    self\n}\n```\n\nDo the same in `Dexer::file()`/`collect_classes()`, and document in the crate-level docs (`src/lib.rs:8-32`) that enabling the `cargo` feature switches the caller's build script to explicit-dependency mode, so callers who add other inputs must declare them themselves.","locations":[{"ref":"src/env_paths/mod.rs:274-279","code":"  274 | /// Rerun the build script if the variable is changed. Do not use it for variables set by Cargo.\n  275 | fn env_var(var: &str) -> Result<String, env::VarError> {\n  276 |     #[cfg(feature = \"cargo\")]\n  277 |     println!(\"cargo:rerun-if-env-changed={}\", var);\n  278 |     env::var(var)\n  279 | }","lines":6,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L274-L279"},{"ref":"src/java_build.rs:378-396","code":"  378 |     /// Adds a Java source file to be compiled by javac.\n  379 |     #[doc(alias(\"source file\"))]\n  380 |     pub fn file<P: AsRef<OsStr>>(&mut self, file: P) -> &mut Self {\n  381 |         self.files.push(file.as_ref().into());\n  382 |         self\n  383 |     }\n  384 | \n  385 |     /// Adds multiple Java source files to be compiled by javac.\n  386 |     ///\n  387 |     /// This is the same as calling [`JavaBuild::file()`] multiple times.\n  388 |     #[doc(alias(\"source files\"))]\n  389 |     pub fn files<P>(&mut self, files: P) -> &mut Self\n  390 |     where\n  391 |         P: IntoIterator,\n  392 |         P::Item: AsRef<OsStr>,\n  393 |     {\n  394 |         self.files.extend(files.into_iter().map(|f| f.as_ref().into()));\n  395 |         self\n  396 |     }","lines":19,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L378-L396"},{"ref":"README.md:22-40","code":"   22 | ```rust\n   23 | fn main() {\n   24 |     let target_os = std::env::var(\"CARGO_CFG_TARGET_OS\").unwrap();\n   25 |     if target_os == \"android\" {\n   26 |         let output_dir = std::env::var(\"OUT_DIR\").unwrap();\n   27 |         let android_jar_path = android_build::android_jar(None)\n   28 |             .expect(\"Failed to find android.jar\");\n   29 | \n   30 |         android_build::JavaBuild::new()\n   31 |             .class_path(android_jar_path)\n   32 |             .classes_out_dir(std::path::PathBuf::from(output_dir))\n   33 |             .file(\"YourJavaFile.java\")\n   34 |             .compile()\n   35 |             .expect(\"java build failed!\");\n   36 | \n   37 |         // `YourJavaFile.class` will be in the Cargo-specified OUT_DIR.\n   38 |     }\n   39 | }\n   40 | ```","lines":19,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/README.md#L22-L40"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`find_android_sdk` is defined under four mutually exclusive `#[cfg(target_os = ...)]` gates - `macos`, `linux`, `windows`, `android` - with no fallback arm. On any other host (FreeBSD, NetBSD, OpenBSD, Illumos, musl-on-other targets, WASI...) no `find_android_sdk` function exists at all, so the crate fails to *compile* with an unresolved-name error from `src/env_paths/mod.rs:55`, rather than merely losing auto-discovery. The sibling module handles this correctly: `find_java.rs:10-11` uses `all(not(target_os = \"macos\"), not(target_os = \"windows\")))`, which covers every remaining platform.","fix":"Add a catch-all arm so unknown platforms compile and simply rely on `ANDROID_HOME`/`ANDROID_SDK_ROOT`:\n\n```rust\n#[cfg(not(any(\n    target_os = \"macos\",\n    target_os = \"linux\",\n    target_os = \"windows\",\n    target_os = \"android\",\n)))]\npub fn find_android_sdk() -> Option<PathBuf> {\n    None\n}\n```\n\nMost non-macOS Unix hosts would also be served correctly by the existing Linux body, so widening the `linux` gate to `unix` (minus macOS/Android) is a reasonable alternative.","locations":[{"ref":"src/env_paths/find_android_sdk.rs:6-38","code":"    6 | #[cfg(target_os = \"macos\")]\n    7 | pub fn find_android_sdk() -> Option<PathBuf> {\n    8 |     PathBuf::from(std::env::var(\"HOME\").ok()?)\n    9 |         .join(\"Library\")\n   10 |         .join(\"Android\")\n   11 |         .join(\"sdk\")\n   12 |         .into()\n   13 | }\n   14 | \n   15 | #[cfg(target_os = \"linux\")]\n   16 | pub fn find_android_sdk() -> Option<PathBuf> {\n   17 |     PathBuf::from(std::env::var(\"HOME\").ok()?)\n   18 |         .join(\"Android\")\n   19 |         .join(\"Sdk\")\n   20 |         .into()\n   21 | }\n   22 | \n   23 | #[cfg(target_os = \"windows\")]\n   24 | pub fn find_android_sdk() -> Option<PathBuf> {\n   25 |     windows_home_dir()?\n   26 |         .join(\"AppData\")\n   27 |         .join(\"Local\")\n   28 |         .join(\"Android\")\n   29 |         .join(\"Sdk\")\n   30 |         .into()\n   31 | }\n   32 | \n   33 | // When building on an Android host, there is no need to locate\n   34 | // SDK files; we can just use env vars to point to local native files.\n   35 | #[cfg(target_os = \"android\")]\n   36 | pub fn find_android_sdk() -> Option<PathBuf> {\n   37 |     None\n   38 | }","lines":33,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/find_android_sdk.rs#L6-L38"},{"ref":"src/env_paths/find_java.rs:10-11","code":"   10 | #[cfg(all(not(target_os = \"macos\"), not(target_os = \"windows\")))]\n   11 | const FIND_CMD: &str = \"which\";","lines":2,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/find_java.rs#L10-L11"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`visit_dirs` recurses through `Dexer::collect_classes` using `path.is_dir()`, which **follows** symlinks. A symlink inside the class output directory that points at an ancestor (or at `/`) turns the walk into infinite recursion, overflowing the stack and aborting the build script with `SIGSEGV` instead of an error. The same construct also has no depth limit for legitimately deep trees.","fix":"Use the entry's own metadata (which does not traverse symlinks) to decide whether to recurse:\n\n```rust\nfor entry in std::fs::read_dir(dir)? {\n    let entry = entry?;\n    // `symlink_metadata` does not follow links, so a link pointing at an\n    // ancestor cannot turn this walk into infinite recursion.\n    if entry.path().symlink_metadata()?.is_dir() {\n        visit_dirs(entry.path(), cb)?;\n    } else {\n        cb(&entry);\n    }\n}\n```","locations":[{"ref":"src/dexer.rs:244-261","code":"  244 | /// Walking a directory only visiting files. Copied from `std::fs::read_dir` examples.\n  245 | fn visit_dirs(\n  246 |     dir: impl AsRef<Path>,\n  247 |     cb: &mut impl FnMut(&std::fs::DirEntry),\n  248 | ) -> std::io::Result<()> {\n  249 |     if dir.as_ref().is_dir() {\n  250 |         for entry in std::fs::read_dir(dir)? {\n  251 |             let entry = entry?;\n  252 |             let path = entry.path();\n  253 |             if path.is_dir() {\n  254 |                 visit_dirs(&path, cb)?;\n  255 |             } else {\n  256 |                 cb(&entry);\n  257 |             }\n  258 |         }\n  259 |     }\n  260 |     Ok(())\n  261 | }","lines":18,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/dexer.rs#L244-L261"},{"ref":"src/dexer.rs:226-241","code":"  226 |     pub fn collect_classes<P: AsRef<OsStr>>(&mut self, class_path: P) -> std::io::Result<&mut Self> {\n  227 |         let class_path = PathBuf::from(class_path.as_ref());\n  228 |         if !class_path.is_dir() {\n  229 |             return Err(std::io::Error::new(\n  230 |                 std::io::ErrorKind::InvalidInput,\n  231 |                 \"`class_path` is not a directory\"\n  232 |             ));\n  233 |         }\n  234 |         let extension = Some(std::ffi::OsStr::new(\"class\"));\n  235 |         visit_dirs(class_path, &mut |entry| {\n  236 |             if entry.path().extension() == extension {\n  237 |                 self.file(entry.path());\n  238 |             }\n  239 |         })?;\n  240 |         Ok(self)\n  241 |     }","lines":16,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/dexer.rs#L226-L241"}]},{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`find_java_home` resolves symlinks with an unbounded `while let Ok(path) = java_path.read_link()` loop. `read_link` does not detect cycles, so a self-referential or mutually-referential symlink (`/usr/bin/java -> /usr/bin/java`, or an A→B→A pair - both easy to create with a botched `update-alternatives`/`stow` setup) makes the loop spin forever and the build script hangs with no output and no timeout. The manual relative-link handling (`pop` then `push`) also silently mis-resolves a link whose target contains `..` segments.","fix":"Let the OS do the resolution, which detects loops and returns `ELOOP`:\n\n```rust\nlet java_path = std::fs::canonicalize(found_java_path.trim()).ok()?;\n```\n\nIf a hand-rolled loop must be kept (e.g. to tolerate a broken final link), bound it:\n\n```rust\nfor _ in 0..40 {\n    let Ok(path) = java_path.read_link() else { break };\n    java_path = if path.is_absolute() { path } else {\n        java_path.pop();\n        java_path.push(path);\n        java_path\n    };\n}\n```","locations":[{"ref":"src/env_paths/find_java.rs:45-55","code":"   45 |     let mut java_path = PathBuf::from(found_java_path.trim());\n   46 | \n   47 |     while let Ok(path) = java_path.read_link() {\n   48 |         java_path = if path.is_absolute() {\n   49 |             path\n   50 |         } else {\n   51 |             java_path.pop();\n   52 |             java_path.push(path);\n   53 |             java_path\n   54 |         };\n   55 |     }","lines":11,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/find_java.rs#L45-L55"}]},{"id":"OTHER_5","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`processors.len() != 0` compares a length against zero instead of using `OsString::is_empty()`. Clippy's `len_zero` lint fires on this, so any consumer building with `-D warnings` gets a failure from this crate's source.","fix":"Change\n\n```rust\nif processors.len() != 0 {\n```\n\nto\n\n```rust\nif !processors.is_empty() {\n```","locations":[{"ref":"src/java_build.rs:179-182","code":"  179 |         let processors = self.annotation_processors.join(OsStr::new(\",\"));\n  180 |         if processors.len() != 0 {\n  181 |             cmd.arg(\"-processor\").arg(processors); \n  182 |         }","lines":4,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L179-L182"}]},{"id":"OTHER_6","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"The three builders disagree on the bound for their `java_home` setter: `JavaBuild::java_home` takes `P: Into<PathBuf>`, while `JavaRun::java_home` and `Dexer::java_home` take `P: AsRef<OsStr>`. All three store the value in an `Option<PathBuf>` field, so the difference is gratuitous - and it is user-visible, because `Into<PathBuf>` rejects `&OsStr` and `&Path` arguments that the other two accept, forcing callers to write different code for what looks like the same option.","fix":"Standardise on the more permissive bound used by two of the three, i.e. change `JavaBuild::java_home` to\n\n```rust\npub fn java_home<P: AsRef<OsStr>>(&mut self, java_home: P) -> &mut Self {\n    self.java_home = Some(java_home.as_ref().into());\n    self\n}\n```","locations":[{"ref":"src/java_build.rs:222-225","code":"  222 |     pub fn java_home<P: Into<PathBuf>>(&mut self, java_home: P) -> &mut Self {\n  223 |         self.java_home = Some(java_home.into());\n  224 |         self\n  225 |     }","lines":4,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L222-L225"},{"ref":"src/java_run.rs:94-97","code":"   94 |     pub fn java_home<P: AsRef<OsStr>>(&mut self, java_home: P) -> &mut Self {\n   95 |         self.java_home = Some(java_home.as_ref().into());\n   96 |         self\n   97 |     }","lines":4,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_run.rs#L94-L97"},{"ref":"src/dexer.rs:137-140","code":"  137 |     pub fn java_home<P: AsRef<OsStr>>(&mut self, java_home: P) -> &mut Self {\n  138 |         self.java_home = Some(java_home.as_ref().into());\n  139 |         self\n  140 |     }","lines":4,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/dexer.rs#L137-L140"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"very_easy","description":"`JavaBuild::endorsed_dir()` collects paths into the `endorsed_dirs` field, but `JavaBuild::command()` never turns them into a `-endorseddirs` argument - the `add_path_arg` calls cover `-cp`, `-sourcepath`, `-bootclasspath` and `-extdirs` only. Any caller using `endorsed_dir()` gets a silent no-op: the documented \"this will override the default endorsed standards path\" behaviour never happens, and there is no warning or error.","fix":"Add the missing argument next to the other path options in `command()`:\n\n```rust\nadd_path_arg(&mut cmd, \"-cp\",             &self.class_paths);\nadd_path_arg(&mut cmd, \"-sourcepath\",     &self.source_paths);\nadd_path_arg(&mut cmd, \"-bootclasspath\",  &self.boot_class_paths);\nadd_path_arg(&mut cmd, \"-extdirs\",        &self.extension_dirs);\nadd_path_arg(&mut cmd, \"-endorseddirs\",   &self.endorsed_dirs);\n```\n\n(Alternatively, if endorsed dirs are considered obsolete - `javac` removed `-endorseddirs` support in release 9+ - delete the field and the `endorsed_dir()` builder method instead of shipping a method that does nothing.)","locations":[{"ref":"src/java_build.rs:174-177","code":"  174 |         add_path_arg(&mut cmd, \"-cp\",            &self.class_paths);\n  175 |         add_path_arg(&mut cmd, \"-sourcepath\",    &self.source_paths);\n  176 |         add_path_arg(&mut cmd, \"-bootclasspath\", &self.boot_class_paths);\n  177 |         add_path_arg(&mut cmd, \"-extdirs\",       &self.extension_dirs);","lines":4,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L174-L177"},{"ref":"src/java_build.rs:294-300","code":"  294 |     /// Specify where to find endorsed standards.\n  295 |     ///\n  296 |     /// If set, this will override the default endorsed standards path.\n  297 |     pub fn endorsed_dir<P: AsRef<OsStr>>(&mut self, endorsed_dir: P) -> &mut Self {\n  298 |         self.endorsed_dirs.push(endorsed_dir.as_ref().into());\n  299 |         self\n  300 |     }","lines":7,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L294-L300"},{"ref":"src/java_build.rs:45-46","code":"   45 |     /// Override the location of endorsed standards path.\n   46 |     endorsed_dirs: Vec<OsString>,","lines":2,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L45-L46"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`JavaRun::command()` explicitly rejects the \"both `main_class` and `jar_file`\" combination but lets the \"neither\" case fall through the catch-all `_ => { }` arm. The resulting command is `java <args...>`, where the JVM interprets the first user argument as a class name - producing a confusing `Could not find or load main class <first-arg>` (or a usage dump when there are no args) far away from the actual programming mistake. Since `Dexer` builds its command through `JavaRun`, a future refactor that forgets `main_class` would fail the same opaque way.","fix":"Replace the wildcard arm with an explicit error, mirroring the both-set branch:\n\n```rust\nmatch (self.main_class.as_ref(), self.jar_file.as_ref()) {\n    (Some(main_class), None) => { cmd.arg(main_class); }\n    (None, Some(jar_file)) => { cmd.arg(\"-jar\").arg(jar_file); }\n    (Some(_), Some(_)) => {\n        return Err(std::io::Error::other(\n            \"Cannot provide both a main class AND a JAR file.\"\n        ));\n    }\n    (None, None) => {\n        return Err(std::io::Error::other(\n            \"Must provide either a main class or a JAR file.\"\n        ));\n    }\n}\n```","locations":[{"ref":"src/java_run.rs:70-79","code":"   70 |         match (self.main_class.as_ref(), self.jar_file.as_ref()) {\n   71 |             (Some(main_class), None) => { cmd.arg(main_class); }\n   72 |             (None, Some(jar_file)) => { cmd.arg(\"-jar\").arg(jar_file); }\n   73 |             (Some(_), Some(_)) => {\n   74 |                 return Err(std::io::Error::other(\n   75 |                     \"Cannot provide both a main class AND a JAR file.\"\n   76 |                 ));\n   77 |             },\n   78 |             _ => { }\n   79 |         }","lines":10,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_run.rs#L70-L79"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`JavaBuild::command()` calls `crate::check_javac_version(&java_home)`, which spawns `javac -version` as a child process and waits for it. `javac` JVM startup costs on the order of 100-300 ms, and this happens on **every** `command()` / `compile()` call - a build script that compiles a handful of Java files one at a time pays it repeatedly, even though `java_home` almost never changes within a single build-script run.","fix":"Memoize the probe per `java_home`, e.g. with a `OnceLock`-backed cache:\n\n```rust\nuse std::collections::HashMap;\nuse std::sync::{Mutex, OnceLock};\n\npub fn check_javac_version(java_home: impl AsRef<Path>) -> std::io::Result<u32> {\n    static CACHE: OnceLock<Mutex<HashMap<PathBuf, u32>>> = OnceLock::new();\n    let key = java_home.as_ref().to_path_buf();\n    if let Some(v) = CACHE.get_or_init(Default::default).lock().unwrap().get(&key) {\n        return Ok(*v);\n    }\n    let ver = check_javac_version_uncached(&key)?;\n    CACHE.get_or_init(Default::default).lock().unwrap().insert(key, ver);\n    Ok(ver)\n}\n```\n\nMove the current body into `check_javac_version_uncached`.","locations":[{"ref":"src/java_build.rs:144-149","code":"  144 |         let java_ver = crate::check_javac_version(&java_home)?;\n  145 |         if java_ver < 8 {\n  146 |             return Err(std::io::Error::other(\n  147 |                 format!(\"The minimum required Java version is Java 8. Your Java version: {java_ver}\")\n  148 |             ));\n  149 |         }","lines":6,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L144-L149"},{"ref":"src/env_paths/mod.rs:217-244","code":"  217 | pub fn check_javac_version(java_home: impl AsRef<Path>) -> std::io::Result<u32> {\n  218 |     let javac = java_home.as_ref().join(\"bin\").join(\"javac\");\n  219 |     let output = std::process::Command::new(&javac)\n  220 |         .arg(\"-version\")\n  221 |         .output()\n  222 |         .map_err(|e| std::io::Error::other(\n  223 |             format!(\"Failed to execute javac -version: {:?}\", e)\n  224 |         ))?;\n  225 |     if !output.status.success() {\n  226 |         return Err(std::io::Error::other(format!(\n  227 |             \"Failed to get javac version: {}\",\n  228 |             String::from_utf8_lossy(&output.stderr)\n  229 |         )));\n  230 |     }\n  231 |     let mut version_output = String::from_utf8_lossy(&output.stdout);\n  232 |     if version_output.is_empty() {\n  233 |         // old versions of java use stderr\n  234 |         version_output = String::from_utf8_lossy(&output.stderr);\n  235 |     }\n  236 |     let version = parse_javac_version_output(&version_output);\n  237 |     if version > 0 {\n  238 |         Ok(version as u32)\n  239 |     } else {\n  240 |         Err(std::io::Error::other(\n  241 |             format!(\"Failed to parse javac version: '{version_output}'\")\n  242 |         ))\n  243 |     }\n  244 | }","lines":28,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L217-L244"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`self.java_source_version.or(env_paths::java_source_version())` uses `Option::or`, whose argument is evaluated eagerly. So the environment variable is read - and, with the `cargo` feature on, a `cargo:rerun-if-env-changed=JAVA_SOURCE_VERSION` line is printed - even when the builder field is already `Some`. Besides the wasted work, this makes the emitted rerun-dependency set depend on nothing the user asked for. The same pattern repeats for `java_target_version`.","fix":"Use the lazy variant:\n\n```rust\nif let Some(source) = self.java_source_version.or_else(env_paths::java_source_version) {\n```\n\nand\n\n```rust\nif let Some(target) = self.java_target_version.or_else(env_paths::java_target_version) {\n```","locations":[{"ref":"src/java_build.rs:151-151","code":"  151 |         if let Some(source) = self.java_source_version.or(env_paths::java_source_version()) {","lines":1,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L151"},{"ref":"src/java_build.rs:160-160","code":"  160 |         if let Some(target) = self.java_target_version.or(env_paths::java_target_version()) {","lines":1,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/java_build.rs#L160"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `android_sdk()` names a variable the function never reads. It says the second attempt uses `ANDROID_SDK_HOME`, but the code checks `ANDROID_SDK_ROOT` (`src/env_paths/mod.rs:51`). `ANDROID_SDK_HOME` is a *different*, deprecated Android variable (it points at the `.android` user config dir, not the SDK), so a reader following the docs would set the wrong variable and get no effect.","fix":"Change\n\n```\n/// * The `ANDROID_SDK_HOME` environment variable, if it is set and if the directory exists.\n```\n\nto\n\n```\n/// * The `ANDROID_SDK_ROOT` environment variable, if it is set and if the directory exists.\n```","locations":[{"ref":"src/env_paths/mod.rs:40-46","code":"   40 | /// The path is determined by an ordered set of attempts:\n   41 | /// * The `ANDROID_HOME` environment variable, if it is set and if the directory exists.\n   42 | /// * The `ANDROID_SDK_HOME` environment variable, if it is set and if the directory exists.\n   43 | /// * The default installation location for the Android SDK, if it exists.\n   44 | ///   * On Windows, this is `%LOCALAPPDATA%\\Android\\Sdk`.\n   45 | ///   * On macOS, this is `~/Library/Android/sdk`.\n   46 | ///   * On Linux, this is `~/Android/Sdk`.","lines":7,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L40-L46"},{"ref":"src/env_paths/mod.rs:49-53","code":"   49 |     env_var(ANDROID_HOME).ok()\n   50 |         .and_then(PathExt::path_if_exists)\n   51 |         .or_else(|| env_var(ANDROID_SDK_ROOT).ok()\n   52 |             .and_then(PathExt::path_if_exists)\n   53 |         )","lines":5,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L49-L53"}]},{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`env_paths/mod.rs` mixes four unrelated responsibilities in one 279-line module: (1) declaring the public environment-variable name constants, (2) Android SDK layout knowledge (`platforms/<ver>/android.jar`, `build-tools/<ver>/lib/d8.jar`, version selection), (3) probing and parsing `javac -version` output (`check_javac_version`, `parse_javac_version_output` - a javac-tooling concern that belongs next to `JavaBuild`, and whose only consumer is `src/java_build.rs:144`), and (4) side-effecting Cargo integration hidden inside the innermost accessor `env_var`. Point (4) is the costly one: `env_var` looks like a pure getter but writes to stdout, so every function that merely *reads* a path also mutates the caller's build-script dependency graph (see the related rebuild-staleness finding). That hidden coupling is why the effect is easy to miss at every call site.","fix":"Split the module along those lines and make the Cargo side effect explicit:\n\n- move `check_javac_version` / `parse_javac_version_output` (and its `#[test]`) into `java_build.rs`, or a new `javac_version.rs`, re-exporting `check_javac_version` from `lib.rs` to keep the public API stable;\n- move the SDK-layout helpers (`android_jar`, `android_d8_jar`, `env_android_platform_api_level`, `find_latest_version`) into `env_paths/android_sdk.rs`;\n- keep `mod.rs` as the env-var constants plus `PathExt`;\n- rename `env_var` to something that advertises the write, e.g. `env_var_tracked`, and give it a one-line comment stating that emitting `rerun-if-env-changed` disables Cargo's default rerun heuristic for the caller.","locations":[{"ref":"src/env_paths/mod.rs:1-19","code":"    1 | use std::{env, path::{Path, PathBuf}};\n    2 | use self::find_java::find_java_home;\n    3 | \n    4 | mod find_android_sdk;\n    5 | mod find_java;\n    6 | \n    7 | \n    8 | pub const ANDROID_HOME:                 &str = \"ANDROID_HOME\";\n    9 | pub const ANDROID_SDK_ROOT:             &str = \"ANDROID_SDK_ROOT\";\n   10 | pub const ANDROID_BUILD_TOOLS_VERSION:  &str = \"ANDROID_BUILD_TOOLS_VERSION\";\n   11 | pub const ANDROID_PLATFORM:             &str = \"ANDROID_PLATFORM\";\n   12 | pub const ANDROID_SDK_VERSION:          &str = \"ANDROID_SDK_VERSION\";\n   13 | pub const ANDROID_API_LEVEL:            &str = \"ANDROID_API_LEVEL\";\n   14 | pub const ANDROID_SDK_EXTENSION:        &str = \"ANDROID_SDK_EXTENSION\";\n   15 | pub const ANDROID_D8_JAR:               &str = \"ANDROID_D8_JAR\";\n   16 | pub const ANDROID_JAR:                  &str = \"ANDROID_JAR\";\n   17 | pub const JAVA_HOME:                    &str = \"JAVA_HOME\";\n   18 | pub const JAVA_SOURCE_VERSION:          &str = \"JAVA_SOURCE_VERSION\";\n   19 | pub const JAVA_TARGET_VERSION:          &str = \"JAVA_TARGET_VERSION\";","lines":19,"link":"https://github.com/project-robius/android-build/blob/2f42c9160611e0095a875cdee202eaf2853d5459/src/env_paths/mod.rs#L1-L19"},{"ref":"src/env_paths/mod.rs:216-262","code":"  216 | /// Returns the major version number of the `javac` compiler.\n  217 | pub fn check_javac_version(java_home: impl AsRef<Path>) -> std::io::Result<u32> {\n  218 |     let javac = java_home.as_ref().join(\"bin\").join(\"javac\");\n  219 |     let output = std::process::Command::new(&javac)\n  220 |         .arg(\"-version\")\n  221 |         .output()\n  222 |         .map_err(|e| std::io::Error::other(\n  223 |             format!(\"Failed to execute javac -version: {:?}\", e)\n  224 |         ))?;\n  225 |     if !output.status.success() {\n  226 |         return Err(std::io::Error::other(format!(\n  227 |             \"Failed to get javac version: {}\",\n  228 |             String::from_utf8_lossy(&output.stderr)\n  229 |         )));\n  230 |     }\n  231 |     let mut version_output = String::from_utf8_lossy(&output.stdout);\n  232 |     if version_output.is_empty() {\n  233 |         // old versions of
