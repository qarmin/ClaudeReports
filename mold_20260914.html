<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"easy","description":"`InputFile<E>::InputFile()` dereferences the section header table before it has\nvalidated `e_shoff`. `sh_begin` is computed as `mf->data + ehdr.e_shoff` with no\ncheck that `e_shoff` is within the file, and when `e_shnum == 0` the code\nimmediately reads `sh_begin->sh_size` and `sh_begin->sh_link`. A malformed\nobject with `e_shoff` set to a huge value therefore reads far outside the mmap\nand crashes with `SIGSEGV`/`SIGBUS` before the range check on line 97 ever runs.\n\nThe range check itself is also unsound: `num_sections` is taken from a 64-bit\n`sh_size`, so `sh_begin + num_sections` can overflow the pointer and wrap\naround, making `mf->data + mf->size < (u8 *)(sh_begin + num_sections)` compare\nfalse for a bogus value.","fix":"Validate before dereferencing:\n```c++\nif (ehdr.e_shoff < 0 || ehdr.e_shoff > mf->size - sizeof(ElfShdr<E>))\n  Fatal(ctx) << *this << \": e_shoff is out of range\";\nElfShdr<E> *sh_begin = (ElfShdr<E> *)(mf->data + ehdr.e_shoff);\ni64 num_sections = (ehdr.e_shnum == 0) ? (i64)sh_begin->sh_size : (i64)ehdr.e_shnum;\nif (num_sections < 0 ||\n    num_sections > (mf->size - ehdr.e_shoff) / (i64)sizeof(ElfShdr<E>))\n  Fatal(ctx) << *this << \": e_shoff or e_shnum corrupted\";\n```\ni.e. compare *counts*, not derived pointers, so no pointer overflow is possible.","locations":[{"ref":"src/input-files.cc:86-107","code":"   86 |   ElfEhdr<E> &ehdr = *(ElfEhdr<E> *)mf->data;\n   87 |   is_dso = (ehdr.e_type == ET_DYN);\n   88 | \n   89 |   ElfShdr<E> *sh_begin = (ElfShdr<E> *)(mf->data + ehdr.e_shoff);\n   90 | \n   91 |   // e_shnum contains the total number of sections in an object file.\n   92 |   // Since it is a 16-bit integer field, it's not large enough to\n   93 |   // represent >65535 sections. If an object file contains more than 65535\n   94 |   // sections, the actual number is stored to sh_size field.\n   95 |   i64 num_sections = (ehdr.e_shnum == 0) ? sh_begin->sh_size : ehdr.e_shnum;\n   96 | \n   97 |   if (mf->data + mf->size < (u8 *)(sh_begin + num_sections))\n   98 |     Fatal(ctx) << mf->name << \": e_shoff or e_shnum corrupted: \"\n   99 |                << mf->size << \" \" << num_sections;\n  100 |   elf_sections = {sh_begin, sh_begin + num_sections};\n  101 | \n  102 |   // e_shstrndx is a 16-bit field. If .shstrtab's section index is\n  103 |   // too large, the actual number is stored to sh_link field.\n  104 |   i64 shstrtab_idx = (ehdr.e_shstrndx == SHN_XINDEX)\n  105 |     ? sh_begin->sh_link : ehdr.e_shstrndx;\n  106 | \n  107 |   shstrtab = this->get_string(ctx, shstrtab_idx);","lines":22,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L86-L107"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`ArHdr::read_name` trusts every value it reads from the archive:\n\n- SysV long names: `strtab.data() + atoi(ar_name + 1)` is not checked against\n  `strtab.size()`, and `strstr(start, \"/\\n\")` scans until it finds the terminator, walking\n  off the end of the mapping if the string table has no terminator. If `strstr` returns\n  `nullptr`, `return {start, (const char *)strstr(...)}` constructs a `std::string` from a\n  `(first, last)` pair whose `last` is null - undefined behaviour, in practice a crash or a\n  huge allocation.\n- BSD long names: `int namelen = atoi(ar_name + 3)` may be negative or larger than the\n  remaining file; `std::string name{(char *)ptr, (size_t)namelen}` then copies `namelen`\n  bytes (a negative value becomes ~2^64 after the `size_t` cast) and `ptr += namelen` moves\n  the cursor out of the file.\n\nAll of these are reachable from a malformed `.a` file, which mold happily reads from the\ncommand line or from `-l` search paths.","fix":"Pass the enclosing `MappedFile` bounds into `read_name` and validate: reject\n`namelen < 0 || namelen > remaining`, reject a SysV offset `>= strtab.size()`, and use\n`strtab.find(\"/\\n\", off)` (which is bounds-safe) instead of `strstr`, `Fatal`ing when the\nterminator is absent.","locations":[{"ref":"src/archive-file.cc:52-74","code":"   52 |   std::string read_name(std::string_view strtab, u8 *&ptr) const {\n   53 |     // BSD-style long filename\n   54 |     if (starts_with(\"#1/\")) {\n   55 |       int namelen = atoi(ar_name + 3);\n   56 |       std::string name{(char *)ptr, (size_t)namelen};\n   57 |       ptr += namelen;\n   58 | \n   59 |       if (size_t pos = name.find('\\0'))\n   60 |         name = name.substr(0, pos);\n   61 |       return name;\n   62 |     }\n   63 | \n   64 |     // SysV-style long filename\n   65 |     if (starts_with(\"/\")) {\n   66 |       const char *start = strtab.data() + atoi(ar_name + 1);\n   67 |       return {start, (const char *)strstr(start, \"/\\n\")};\n   68 |     }\n   69 | \n   70 |     // Short fileanme\n   71 |     if (const char *end = (char *)memchr(ar_name, '/', sizeof(ar_name)))\n   72 |       return {ar_name, end};\n   73 |     return {ar_name, sizeof(ar_name)};\n   74 |   }","lines":23,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/archive-file.cc#L52-L74"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Neither archive reader validates that a member header or a member body actually fits in the\nmapped file. The fat loop only requires two bytes to remain\n(`while (begin + mf->size - data >= 2)`) before it reinterprets `data` as a 60-byte `ArHdr`,\nand `size` comes straight from `atol(hdr.ar_size)` with no upper bound, so\n`data = body + size` can point far past the mapping (or wrap the pointer, which is UB). The\nresulting `mf->slice(ctx, name, body - begin, data - body)` produces a `MappedFile` whose\n`data`/`size` describe memory outside the mmap (`MappedFile::slice` in `src/mold.h:190-199`\nperforms no bounds check), and every later read of that \"member\" is an out-of-bounds access -\na SIGSEGV/SIGBUS on a malformed or hostile `.a` file. The thin reader has the same problem\n(`while (data < begin + mf->size)` followed by an unchecked 60-byte header read).","fix":"Before dereferencing the header, require `begin + mf->size - data >= (i64)sizeof(ArHdr)` and\n`Fatal` otherwise. After computing `size`, verify `size >= 0 && size <= begin + mf->size - body`\n(and that `hdr.ar_fmag` equals \"`\\n\") before using it; `Fatal(ctx) << mf->name << \": corrupted archive\"`\non failure. Also bounds-check the string-table slice `{(char *)body, (size_t)size}`.","locations":[{"ref":"src/archive-file.cc:149-156","code":"  149 |   while (begin + mf->size - data >= 2) {\n  150 |     if ((begin - data) % 2)\n  151 |       data++;\n  152 | \n  153 |     ArHdr &hdr = *(ArHdr *)data;\n  154 |     u8 *body = data + sizeof(hdr);\n  155 |     u64 size = atol(hdr.ar_size);\n  156 |     data = body + size;","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/archive-file.cc#L149-L156"},{"ref":"src/archive-file.cc:169-176","code":"  169 |     std::string name = hdr.read_name(strtab, body);\n  170 | \n  171 |     // Skip if symbol table\n  172 |     if (name == \"__.SYMDEF\" || name == \"__.SYMDEF SORTED\")\n  173 |       continue;\n  174 | \n  175 |     vec.push_back(mf->slice(ctx, name, body - begin, data - body));\n  176 |   }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/archive-file.cc#L169-L176"},{"ref":"src/archive-file.cc:88-101","code":"   88 |   while (data < begin + mf->size) {\n   89 |     // Each header is aligned to a 2 byte boundary.\n   90 |     if ((begin - data) % 2)\n   91 |       data++;\n   92 | \n   93 |     ArHdr &hdr = *(ArHdr *)data;\n   94 |     u8 *body = data + sizeof(hdr);\n   95 |     u64 size = atol(hdr.ar_size);\n   96 | \n   97 |     // Read a string table.\n   98 |     if (hdr.is_strtab()) {\n   99 |       strtab = {(char *)body, (size_t)size};\n  100 |       data = body + size;\n  101 |       continue;","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/archive-file.cc#L88-L101"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`get_file_type` only verifies that the file starts with the 4-byte string\n`\\177ELF`, then immediately reads `e_ident[EI_DATA]` (offset 5),\n`e_ident[EI_CLASS]` (offset 4) and `ehdr.e_type` (offsets 16-17) by casting the\nmapping to `ElfEhdr`. A 4-byte file containing exactly `\\177ELF` - or any\ntruncated ELF file shorter than 18 bytes - causes reads past the end of the\nmmap'd region, which is a SIGSEGV whenever the file ends on a page boundary.\n`get_elf_type` compounds this by reading `e_machine` (offset 18) and, for\n`EM_PPC64`, `e_flags` (offset 48) with no size check at all.","fix":"Require a full header before interpreting one:\n```cpp\nif (data.starts_with(\"\\177ELF\")) {\n  if (data.size() < sizeof(ElfEhdr<X86_64>))\n    return FileType::UNKNOWN;\n  ...\n}\n```\nand pass the size through to `get_elf_type` so it can bail out before reading\n`e_machine`/`e_flags`.","locations":[{"ref":"src/filetype.cc:85-122","code":"   85 |   if (data.starts_with(\"\\177ELF\")) {\n   86 |     u8 byte_order = ((ElfEhdr<I386> *)data.data())->e_ident[EI_DATA];\n   87 | \n   88 |     if (byte_order == ELFDATA2LSB) {\n   89 |       auto &ehdr = *(ElfEhdr<I386> *)data.data();\n   90 | \n   91 |       if (ehdr.e_type == ET_REL) {\n   92 |         if (ehdr.e_ident[EI_CLASS] == ELFCLASS32) {\n   93 |           if (is_gcc_lto_obj<I386>(mf, has_gcc_plugin))\n   94 |             return FileType::GCC_LTO_OBJ;\n   95 |         } else {\n   96 |           if (is_gcc_lto_obj<X86_64>(mf, has_gcc_plugin))\n   97 |             return FileType::GCC_LTO_OBJ;\n   98 |         }\n   99 |         return FileType::ELF_OBJ;\n  100 |       }\n  101 | \n  102 |       if (ehdr.e_type == ET_DYN)\n  103 |         return FileType::ELF_DSO;\n  104 |     } else {\n  105 |       auto &ehdr = *(ElfEhdr<M68K> *)data.data();\n  106 | \n  107 |       if (ehdr.e_type == ET_REL) {\n  108 |         if (ehdr.e_ident[EI_CLASS] == ELFCLASS32) {\n  109 |           if (is_gcc_lto_obj<M68K>(mf, has_gcc_plugin))\n  110 |             return FileType::GCC_LTO_OBJ;\n  111 |         } else {\n  112 |           if (is_gcc_lto_obj<SPARC64>(mf, has_gcc_plugin))\n  113 |             return FileType::GCC_LTO_OBJ;\n  114 |         }\n  115 |         return FileType::ELF_OBJ;\n  116 |       }\n  117 | \n  118 |       if (ehdr.e_type == ET_DYN)\n  119 |         return FileType::ELF_DSO;\n  120 |     }\n  121 |     return FileType::UNKNOWN;\n  122 |   }","lines":38,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/filetype.cc#L85-L122"},{"ref":"src/filetype.cc:137-185","code":"  137 | static std::string_view get_elf_type(u8 *buf) {\n  138 |   bool is_le = (buf[EI_DATA] == ELFDATA2LSB);\n  139 |   bool is_64 = (buf[EI_CLASS] == ELFCLASS64);\n  140 | \n  141 |   auto *ehdr64_le = (ElfEhdr<ARM64LE> *)buf;\n  142 |   auto *ehdr64_be = (ElfEhdr<ARM64BE> *)buf;\n  143 | \n  144 |   switch (is_le ? ehdr64_le->e_machine : ehdr64_be->e_machine) {\n  145 |   case EM_386:\n  146 |     return I386::name;\n  147 |   case EM_X86_64:\n  148 |     return X86_64::name;\n  149 |   case EM_ARM:\n  150 |     return is_le ? ARM32LE::name : ARM32BE::name;\n  151 |   case EM_AARCH64:\n  152 |     return is_le ? ARM64LE::name : ARM64BE::name;\n  153 |   case EM_RISCV:\n  154 |     if (is_le)\n  155 |       return is_64 ? RV64LE::name : RV32LE::name;\n  156 |     return is_64 ? RV64BE::name : RV32BE::name;\n  157 |   case EM_PPC:\n  158 |     return PPC32::name;\n  159 |   case EM_PPC64:\n  160 |     // ELFv1 is big-endian and ELFv2 is little-endian by convention, but\n  161 |     // the correspondence is not a rule; musl for example uses ELFv2 on\n  162 |     // big-endian too. We support only the usual combinations, so treat\n  163 |     // the others as unrecognizable rather than silently linking them\n  164 |     // against the wrong ABI.\n  165 |     if (!is_le)\n  166 | {"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`read_rnglist_range` has no `default:` case. A byte that is not one of the eight\nknown `DW_RLE_*` opcodes - which is what any truncated, corrupt or\nfuture-version `.debug_rnglists` produces - is silently ignored, and the `for\n(;;)` loop keeps advancing one byte at a time through whatever follows the range\nlist, interpreting arbitrary bytes as opcodes. It reads unbounded amounts of\nmemory past the section, calls `read_uleb` on garbage, appends nonsense ranges\nto `vec`, and only stops when it happens to hit a `0x00` byte or segfaults.","fix":"Add a `default:` arm that reports the problem instead of continuing:\n```cpp\ndefault:\n  Fatal(ctx) << \"--gdb-index: unknown DW_RLE opcode: 0x\" << std::hex << p[-1];\n```\n(this requires threading `Context<E> &ctx` into `read_rnglist_range`), and also\npass the end of `.debug_rnglists` in so the loop can stop at the section\nboundary.","locations":[{"ref":"src/gdb-index.cc:478-526","code":"  478 |   for (;;) {\n  479 |     switch (*p++) {\n  480 |     case DW_RLE_end_of_list:\n  481 |       return;\n  482 |     case DW_RLE_base_addressx:\n  483 |       base = addrx[read_uleb(&p)];\n  484 |       break;\n  485 |     case DW_RLE_startx_endx: {\n  486 |       u64 val1 = read_uleb(&p);\n  487 |       u64 val2 = read_uleb(&p);\n  488 |       vec.emplace_back(addrx[val1], addrx[val2]);\n  489 |       break;\n  490 |     }\n  491 |     case DW_RLE_startx_length: {\n  492 |       u64 val1 = read_uleb(&p);\n  493 |       u64 val2 = read_uleb(&p);\n  494 |       vec.emplace_back(addrx[val1], addrx[val1] + val2);\n  495 |       break;\n  496 |     }\n  497 |     case DW_RLE_offset_pair: {\n  498 |       u64 val1 = read_uleb(&p);\n  499 |       u64 val2 = read_uleb(&p);\n  500 | \n  501 |       // If the base is 0, this address range is for an eliminated\n  502 |       // section. We only emit it if it's alive.\n  503 |       if (base)\n  504 |         vec.emplace_back(base + val1, base + val2);\n  505 |       break;\n  506 |     }\n  507 |     case DW_RLE_base_address:\n  508 |       base = *(Word<E> *)p;\n  509 |       p += sizeof(Word<E>);\n  510 |       break;\n  511 |     case DW_RLE_start_end: {\n  512 |       u64 val1 = ((Word<E> *)p)[0];\n  513 |       u64 val2 = ((Word<E> *)p)[1];\n  514 |       p += sizeof(Word<E>) * 2;\n  515 |       vec.emplace_back(val1, val2);\n  516 |       break;\n  517 |     }\n  518 |     case DW_RLE_start_length: {\n  519 |       u64 val1 = *(Word<E> *)p;\n  520 |       p += sizeof(Word<E>);\n  521 |       u64 val2 = read_uleb(&p);\n  522 |       vec.emplace_back(val1, val1 + val2);\n  523 |       break;\n  524 |     }\n  525 |     }\n  526 |   }","lines":49,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gdb-index.cc#L478-L526"}]},

DW_AT_ranges:\n  582 |       ranges = {form, val};\n  583 |       break;","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gdb-index.cc#L575-L583"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`ObjectFile<E>::parse_note_gnu_property()` walks a `.note.gnu.property` section\nwith no bounds checking at all:\n\n- `*(ElfNhdr<E> *)data.data()` is read while `data` may hold fewer than\n  `sizeof(ElfNhdr<E>)` bytes (out-of-bounds read).\n- `data.substr(sizeof(hdr))`, `data.substr(align_to(hdr.n_namesz, 4))` and\n  `data.substr(align_to(hdr.n_descsz, sizeof(Word<E>)))` throw\n  `std::out_of_range` whenever the (attacker-controlled) 32-bit size fields\n  exceed the remaining data. mold has no top-level `catch`, so this is\n  `std::terminate()`.\n- `n_namesz == 0` makes `hdr.n_namesz - 1` underflow to `0xffffffff`.\n- The inner loop reads 8 bytes (`type` and `size`) whenever `desc` is merely\n  non-empty, so a 1-byte descriptor reads 7 bytes past the end, and\n  `desc.substr(8)` throws.","fix":"Check the remaining size before each read and each `substr`, e.g.\n```c++\nwhile (data.size() >= sizeof(ElfNhdr<E>)) {\n  ElfNhdr<E> &hdr = *(ElfNhdr<E> *)data.data();\n  i64 namesz = align_to(hdr.n_namesz, 4);\n  i64 descsz = align_to(hdr.n_descsz, sizeof(Word<E>));\n  if (namesz > data.size() - sizeof(hdr) ||\n      descsz > data.size() - sizeof(hdr) - namesz)\n    Fatal(ctx) << *this << \": corrupted .note.gnu.property\";\n  ...\n}\n```\nand require `desc.size() >= 8` (and `desc.size() - 8 >= align_to(size, ...)`)\nin the inner loop.","locations":[{"ref":"src/input-files.cc:137-173","code":"  137 | template <typename E>\n  138 | void\n  139 | ObjectFile<E>::parse_note_gnu_property(Context<E> &ctx, const ElfShdr<E> &shdr) {\n  140 |   std::string_view data = this->get_string(ctx, shdr);\n  141 | \n  142 |   while (!data.empty()) {\n  143 |     ElfNhdr<E> &hdr = *(ElfNhdr<E> *)data.data();\n  144 |     data = data.substr(sizeof(hdr));\n  145 | \n  146 |     std::string_view name = data.substr(0, hdr.n_namesz - 1);\n  147 |     data = data.substr(align_to(hdr.n_namesz, 4));\n  148 | \n  149 |     std::string_view desc = data.substr(0, hdr.n_descsz);\n  150 |     data = data.substr(align_to(hdr.n_descsz, sizeof(Word<E>)));\n  151 | \n  152 |     if (hdr.n_type != NT_GNU_PROPERTY_TYPE_0 || name != \"GNU\")\n  153 |       continue;\n  154 | \n  155 |     while (!desc.empty()) {\n  156 |       u32 type = *(U32<E> *)desc.data();\n  157 |       u32 size = *(U32<E> *)(desc.data() + 4);\n  158 |       desc = desc.substr(8);\n  159 | \n  160 |       // The majority of currently defined .note.gnu.property\n  161 |       // use 32-bit values.\n  162 |       // We don't know how to handle anything else, so if we encounter\n  163 |       // one, skip it.\n  164 |       //\n  165 |       // The following properties have a different size:\n  166 |       // - GNU_PROPERTY_STACK_SIZE\n  167 |       // - GNU_PROPERTY_NO_COPY_ON_PROTECTED\n  168 |       if (size == 4)\n  169 |         gnu_properties[type] |= *(U32<E> *)desc.data();\n  170 |       desc = desc.substr(align_to(size, sizeof(Word<E>)));\n  171 |     }\n  172 |   }\n  173 | }","lines":37,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L137-L173"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`read_riscv_attributes()` mis-parses truncated/hostile `.riscv.attributes`:\n\n- `i64 sz = *(U32<E> *)data.data();` reads 4 bytes although `data` may hold only\n  1-3 bytes (out-of-bounds read).\n- `sz` is only checked against an upper bound. If `sz < 4`, `sz - 4` underflows\n  when converted to `size_t` and `std::string_view p(data.data() + 4, sz - 4)`\n  creates a view of ~2^64 bytes, after which every read runs off the mapping.\n- If `sz == 0`, `data = data.substr(0)` leaves `data` unchanged and the outer\n  `while (!data.empty())` loop spins forever.\n- `p.substr(6)` and `p.substr(5)` throw `std::out_of_range` when the\n  sub-section is shorter than that.\n- In the `ELF_TAG_RISCV_ARCH` case, if the arch string has no terminating NUL,\n  `pos == npos`, so `p = p.substr(pos + 1)` is `p.substr(0)`, i.e. `p` is\n  unchanged and the inner `while (!p.empty())` loop hangs forever.\n- `read_uleb(&p)` itself is unbounded and keeps consuming bytes past the end\n  of the section while the continuation bit is set.","fix":"Require `data.size() >= 4` before the `U32` read, reject `sz < 4` (`if (sz < 4 || data.size() < sz) Fatal(...)`),\ncheck `p.size()` before each `substr`, and treat a missing NUL as corruption:\n```c++\ni64 pos = p.find_first_of('\\0');\nif (pos == p.npos)\n  Fatal(ctx) << file << \": corrupted .riscv.attributes section\";\n```\nAlso use a bounds-checked ULEB reader that takes the remaining size.","locations":[{"ref":"src/input-files.cc:177-224","code":"  177 | template <is_riscv E>\n  178 | static void read_riscv_attributes(Context<E> &ctx, ObjectFile<E> &file,\n  179 |                                   std::string_view data) {\n  180 |   if (data.empty())\n  181 |     Fatal(ctx) << file << \": corrupted .riscv.attributes section\";\n  182 | \n  183 |   if (u8 format_version = data[0]; format_version != 'A')\n  184 |     return;\n  185 |   data = data.substr(1);\n  186 | \n  187 |   while (!data.empty()) {\n  188 |     i64 sz = *(U32<E> *)data.data();\n  189 |     if (data.size() < sz)\n  190 |       Fatal(ctx) << file << \": corrupted .riscv.attributes section\";\n  191 | \n  192 |     std::string_view p(data.data() + 4, sz - 4);\n  193 |     data = data.substr(sz);\n  194 | \n  195 |     if (!p.starts_with(\"riscv\\0\"sv))\n  196 |       continue;\n  197 |     p = p.substr(6);\n  198 | \n  199 |     if (!p.starts_with(ELF_TAG_FILE))\n  200 |       Fatal(ctx) << file << \": corrupted .riscv.attributes section\";\n  201 |     p = p.substr(5); // skip the tag and the sub-sub-section size\n  202 | \n  203 |     while (!p.empty()) {\n  204 |       i64 tag = read_uleb(&p);\n  205 | \n  206 |       switch (tag) {\n  207 |       case ELF_TAG_RISCV_STACK_ALIGN:\n  208 |         file.extra.stack_align = read_uleb(&p);\n  209 |         break;\n  210 |       case ELF_TAG_RISCV_ARCH: {\n  211 |         i64 pos = p.find_first_of('\\0');\n  212 |         file.extra.arch = p.substr(0, pos);\n  213 |         p = p.substr(pos + 1);\n  214 |         break;\n  215 |       }\n  216 |       case ELF_TAG_RISCV_UNALIGNED_ACCESS:\n  217 |         file.extra.unaligned_access = read_uleb(&p);\n  218 |         break;\n  219 |       default:\n  220 |         break;\n  221 |       }\n  222 |     }\n  223 |   }\n  224 | }","lines":48,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L177-L224"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`ObjectFile<E>::get_shndx()` (in `src/mold.h`) returns `esym.st_shndx` (or the\n`SHT_SYMTAB_SHNDX` entry) without checking it against the number of sections, and\nevery caller in `input-files.cc` uses the result directly as an index:\n\n- `read_section_metadata()`: `this->elf_sections[get_shndx(esym)].sh_name`\n- `initialize_local_symbols()`: `sections[shndx]` and `this->elf_sections[shndx].sh_name`\n- `reattach_section_pieces()`: `sections.get_mergeable(get_shndx(esym))`\n\n`sections[idx]` bottoms out in `std::vector<u32>::operator[]` with no bounds\ncheck. A symbol whose `st_shndx` is, e.g., `0x1000` in a five-section object\ntherefore performs an out-of-bounds read (and, via the returned garbage pool\nindex, an out-of-bounds `InputSection` dereference). `symtab_shndx_sec` is also\nindexed by symbol number without checking that it is at least as long as\n`elf_syms`.","fix":"Make `get_shndx()` validate once, centrally:\n```c++\ni64 idx = (esym.st_shndx == SHN_XINDEX) ? ... : esym.st_shndx;\nif (idx >= this->elf_sections.size())\n  Fatal(ctx) << *this << \": invalid section index in the symbol table\";\nreturn idx;\n```\nand bounds-check the `symtab_shndx_sec` access against its own size. Since\n`get_shndx()` has no `Context` parameter, either add one or validate all\n`st_shndx` values once in `parse_symbols()`.","locations":[{"ref":"src/input-files.cc:287-293","code":"  287 |     const ElfSym<E> &esym = this->elf_syms[shdr.sh_info];\n  288 |     std::string_view name;\n  289 |     if (esym.st_type == STT_SECTION)\n  290 |       name = this->shstrtab.data() +\n  291 |              this->elf_sections[get_shndx(esym)].sh_name;\n  292 |     else\n  293 |       name = this->get_symbol_name(shdr.sh_info);","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L287-L293"},{"ref":"src/input-files.cc:927-949","code":"  927 |     this->symbols[i] = &this->local_syms[local_idx++];\n  928 | \n  929 |     std::string_view name;\n  930 |     if (esym.st_type == STT_SECTION) {\n  931 |       i64 shndx = get_shndx(esym);\n  932 |       if (InputSection<E> *isec = sections[shndx]) {\n  933 |         name = isec->name();\n  934 |       } else {\n  935 |         name = this->shstrtab.data() + this->elf_sections[shndx].sh_name;\n  936 |       }\n  937 |     } else {\n  938 |       name = this->get_symbol_name(i);\n  939 |     }\n  940 | \n  941 |     Symbol<E> &sym = *this->symbols[i];\n  942 |     sym.set_name(name);\n  943 |     sym.file = this;\n  944 |     sym.value = esym.st_value;\n  945 |     sym.sym_idx = i;\n  946 | \n  947 |     if (!esym.is_abs())\n  948 |       sym.set_input_section(sections[get_shndx(esym)]);\n  949 |   }","lines":23,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L927-L949"},{"ref":"src/input-files.cc:1056-1065","code":" 1056 |       continue;\n 1057 | \n 1058 |     i64 shndx = get_shndx(esym);\n 1059 |     MergeableSection<E> *m = sections.get_mergeable(shndx);\n 1060 |     if (!m || !m->parent.resolved)\n 1061 |       continue;\n 1062 | \n 1063 |     SectionFragment<E> *frag;\n 1064 |     i64 frag_offset;\n 1065 |     std::tie(frag, frag_offset) = m->get_fragment(esym.st_value);","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L1056-L1065"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`parse_fde_encoding()` reads a CIE record without validating its length:\n\n- `u8 version = data[8];` indexes a `std::string_view` that may be shorter than\n  9 bytes.\n- `std::string_view aug = data.data();` builds a view by running `strlen()` over\n  the mmap'ed file; an unterminated augmentation string reads until the first\n  NUL anywhere after the section, potentially past the mapping.\n- `data.remove_prefix(aug.size() + 1)` is undefined behaviour when the\n  computed length exceeds `data.size()` (`remove_prefix` requires `n <= size()`).\n- `return data[0]` (case `'R'`), `data.remove_prefix(1)` (case `'L'`) and\n  `ptr_size(data[0])` (case `'P'`) all index/advance without checking that\n  bytes remain.\n- The `read_uleb(&data)` calls are unbounded.","fix":"Bounds-check every step: verify `data.size() >= 9` before reading the version,\nfind the augmentation string's NUL with `data.find('\\0', 9)` (Fatal if `npos`)\ninstead of constructing a `string_view` from a `const char *`, and check\n`!data.empty()` before each `data[0]` / `remove_prefix`.","locations":[{"ref":"src/input-files.cc:526-612","code":"  526 | template <typename E>\n  527 | static void parse_fde_encoding(Context<E> &ctx, CieRecord<E> &cie) {\n  528 |   InputSection<E> &isec = cie.input_section;\n  529 |   std::string_view data = cie.get_contents();\n  530 | \n  531 |   // Returns the size in bytes of a value in the DWARF exception header\n  532 |   // encoding `enc`.\n  533 |   auto ptr_size = [&](u8 enc) -> i64 {\n  534 |     switch (enc & 0xf) {\n  535 |     case DW_EH_PE_absptr:\n  536 |       return sizeof(Word<E>);\n  537 |     case DW_EH_PE_udata4:\n  538 |     case DW_EH_PE_sdata4:\n  539 |       return 4;\n  540 |     case DW_EH_PE_udata8:\n  541 |     case DW_EH_PE_sdata8:\n  542 |       return 8;\n  543 |     }\n  544 |     Fatal(ctx) << isec << \": unsupported FDE pointer encoding: \" << (int)enc;\n  545 |   };\n  546 | \n  547 |   // Skip the length, CIE ID and version fields\n  548 |   u8 version = data[8];\n  549 |   if (version != 1 && version != 3)\n  550 |     Fatal(ctx) << isec << \": unsupported CIE version: \" << (int)version;\n  551 |   data.remove_prefix(9);\n  552 | \n  553 |   // Read the augmentation string\n  554 |   std::string_view aug = data.data();\n  555 |   data.remove_prefix(aug.size() + 1);\n  556 | \n  557 |   auto get_encoding = [&]() -> u8 {\n  558 |     // An empty augmentation string means FDE pointers are raw absolute\n  559 |     // addresses. A string not starting with 'z' denotes some legacy\n  560 |     // augmentation (e.g. \"eh\") whose layout we don't know.\n  561 |     if (aug.empty())\n  562 |       return DW_EH_PE_absptr;\n  563 | \n  564 |     if (aug[0] != 'z')\n  565 |       Fatal(ctx) << isec << \": unsupported CIE augmentation string: \" << aug;\n  566 | \n  567 |     // ULEB128 and SLEB128 values have the same framing, so read_uleb\n  568 |     // skips both.\n  569 |     read_uleb(&data);    // code alignment factor\n  570 |     read_uleb(&data);    // data alignment factor\n  571 |     if (version == 1)    // return address register\n  572 |       data.remove_prefix(1);\n  573 |     else\n  574 |       read_uleb(&data);\n  575 |     read_uleb(&data);    // augmentation data length\n  576 | \n  577 |     // Walk the augmentation data, looking for 'R', whose data byte\n  578 |     // specifies how FDE pointers are encoded.\n  579 |     for (char c : aug.substr(1)) {\n  580 |       switch (c) {\n  581 |       case 'R':\n  582 |         return data[0];\n  583 |       case 'L':\n  584 |         // A byte specifying the LSDA pointer encoding\n  585 |         data.remove_prefix(1);\n  586 |         break;\n  587 |       case 'P':\n  588 |         // A byte specifying the personality function pointer encoding,\n  589 |         // followed by the pointer itself\n  590 |         data.remove_prefix(ptr_size(data[0]) + 1);\n  591 |         break;\n  592 |       case 'S':\n  593 |       case 'B':\n  594 |       case 'G':\n  595 |         // 'S' (signal frame), 'B' (AArch64 pointer authentication) and\n  596 |         // 'G' (AArch64 memory tagging) are not followed by data\n  597 |         break;\n  598 |       default:\n  599 |         Fatal(ctx) << isec << \": unsupported CIE augmentation string: \" << aug;\n  600 |       }\n  601 |     }\n  602 | \n  603 |     // Without 'R', FDE pointers are raw absolute addresses.\n  604 |     return DW_EH_PE_absptr;\n  605 |   };\n  606 | \n  607 |   // We support only raw absolute and PC-relative pointers.\n  608 |   u8 enc = get_encoding();\n  609 |   if ((enc & 0xf0) != 0 && (enc & 0xf0) != DW_EH_PE_pcrel)\n  610 |     Fatal(ctx) << isec << \": unsupported FDE pointer encoding: \" << (int)enc;\n  611 |   cie.fde_ptr_size = ptr_size(enc);\n  612 | }","lines":87,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L526-L612"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`ObjectFile<E>::parse_ehframe()` walks `.eh_frame` with unchecked reads:\n\n- `i64 size = *(U32<E> *)data.data();` and `i64 id = *(U32<E> *)(data.data() + 4);`\n  are executed whenever `data` is non-empty, so a section whose tail is 1-7\n  bytes reads past the end.\n- `data = data.substr(size + 4)` throws `std::out_of_range` when the\n  attacker-controlled `size` overruns the section (`size` is a full 32-bit\n  value, so `size + 4` also overflows into the record framing).\n- `*(I32<E> *)(contents.data() + fdes[i].input_offset + 4)` is read without\n  checking that 8 bytes are available at that offset.","fix":"Change the loop to `while (data.size() >= 8)` and reject records that do not\nfit:\n```c++\nu64 size = *(U32<E> *)data.data();\nif (size == 0) break;\nif (size + 4 > data.size())\n  Fatal(ctx) << *isec << \": corrupted .eh_frame\";\n```\nand verify `input_offset + 8 <= contents.size()` before reading `cie_offset`.","locations":[{"ref":"src/input-files.cc:654-704","code":"  654 |     for (std::string_view data = contents; !data.empty();) {\n  655 |       i64 size = *(U32<E> *)data.data();\n  656 |       if (size == 0)\n  657 |         break;\n  658 | \n  659 |       i64 begin_offset = data.data() - contents.data();\n  660 |       i64 end_offset = begin_offset + size + 4;\n  661 |       i64 id = *(U32<E> *)(data.data() + 4);\n  662 |       data = data.substr(size + 4);\n  663 | \n  664 |       i64 rel_begin = rel_idx;\n  665 |       while (rel_idx < rels.size() && rels[rel_idx].r_offset < end_offset)\n  666 |         rel_idx++;\n  667 |       assert(rel_idx == rels.size() || begin_offset <= rels[rel_begin].r_offset);\n  668 | \n  669 |       if (id == 0) {\n  670 |         // This is CIE.\n  671 |         cies.emplace_back(ctx, *this, *isec, begin_offset, rels, rel_begin);\n  672 |         parse_fde_encoding(ctx, cies.back());\n  673 |       } else {\n  674 |         // This is FDE.\n  675 |         if (rel_begin == rel_idx || rels[rel_begin].r_sym == 0) {\n  676 |           // FDE has no valid relocation, which means FDE is dead from\n  677 |           // the beginning. Compilers usually don't create such FDE, but\n  678 |           // `ld -r` tend to generate such dead FDEs.\n  679 |           continue;\n  680 |         }\n  681 | \n  682 |         if (rels[rel_begin].r_offset - begin_offset != 8)\n  683 |           Fatal(ctx) << *isec << \": FDE's first relocation should have offset 8\";\n  684 | \n  685 |         // The function may belong to a discarded COMDAT group.\n  686 |         if (!get_section(this->elf_syms[rels[rel_begin].r_sym]))\n  687 |           continue;\n  688 | \n  689 |         fdes.emplace_back(begin_offset, rel_begin);\n  690 |       }\n  691 |     }\n  692 | \n  693 |     // Associate CIEs to FDEs.\n  694 |     auto find_cie = [&](i64 offset) {\n  695 |       for (i64 i = cies_begin; i < cies.size(); i++)\n  696 |         if (cies[i].input_offset == offset)\n  697 |           return i;\n  698 |       Fatal(ctx) << *isec << \": bad FDE pointer\";\n  699 |     };\n  700 | \n  701 |     for (i64 i = fdes_begin; i < fdes.size(); i++) {\n  702 |       i64 cie_offset = *(I32<E> *)(contents.data() + fdes[i].input_offset + 4);\n  703 |       fdes[i].cie_idx = find_cie(fdes[i].input_offset + 4 - cie_offset);\n  704 |     }","lines":51,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L654-L704"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`.sframe` parsing trusts every header field of an untrusted section:\n\n- `const SFrameHeader<E> &hdr = *(const SFrameHeader<E> *)data.data();` is read\n  before checking `data.size() >= sizeof(SFrameHeader<E>)`; `hdr.magic` is then\n  compared against garbage/out-of-bounds memory.\n- `fde_off = hdr_len + hdr.fdeoff` and `fre_off = hdr_len + hdr.freoff` are\n  never range-checked, yet `*(const SFrameFdeIdx<E> *)(data.data() + idx_off)`\n  and `*(U16<E> *)(data.data() + off)` dereference them directly.\n- `sframe_fre_block_size()` reads `*(U16<E> *)attr`, `attr[2]` and\n  `data[p + addr_size]` for `num_fres` iterations with `num_fres` taken from the\n  file; `data[p + addr_size]` walks arbitrarily far past the section.\n- `data.substr(off, ...)` throws `std::out_of_range` when `off > data.size()`.","fix":"Validate the header (`data.size() >= sizeof(SFrameHeader<E>) + hdr.auxhdr_len`),\nthen require `fde_off + num_fdes * sizeof(SFrameFdeIdx<E>) <= data.size()` and\n`fre_off <= data.size()`. Pass the section size into\n`sframe_fre_block_size()` and `Fatal` as soon as `p + addr_size >= data.size()`.","locations":[{"ref":"src/input-files.cc:742-756","code":"  742 | template <typename E>\n  743 | static i64 sframe_fre_block_size(std::string_view data, i64 offset) {\n  744 |   const u8 *attr = (const u8 *)data.data() + offset;\n  745 |   i64 num_fres = *(U16<E> *)attr;\n  746 |   i64 addr_size = 1 << bits(attr[2], 3, 0);\n  747 | \n  748 |   i64 p = offset + 5;\n  749 |   for (i64 i = 0; i < num_fres; i++) {\n  750 |     u8 info = data[p + addr_size];\n  751 |     i64 num_words = bits(info, 4, 1);\n  752 |     i64 word_size = 1 << bits(info, 6, 5);\n  753 |     p += addr_size + 1 + num_words * word_size;\n  754 |   }\n  755 |   return p - offset;\n  756 | }","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L742-L756"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`parse_sections()` marks COMDAT group members as discarded by writing\n`comdat_discarded[i] = true` where `i` comes from `ref.members(*this)`, i.e. the\nraw `u32` payload of the `SHT_GROUP` section in the input object. Those values\nare section indices supplied by the file and are never validated against\n`sections.size()`. `std::vector<bool>::operator[]` performs no bounds check, so a\nmalformed group with an entry like `0xffffffff` corrupts memory (an\nout-of-bounds *write*, not just a read).\n\nThe same unvalidated indices are used again in `passes.cc` as `file->sections[i]`.","fix":"Validate group members when the group is read (in `read_section_metadata()`), or\nguard the loop:\n```c++\nfor (u32 i : ref.members(*this)) {\n  if (i >= comdat_discarded.size())\n    Fatal(ctx) << *this << \": invalid section index in SHT_GROUP\";\n  comdat_discarded[i] = true;\n}\n```","locations":[{"ref":"src/input-files.cc:1145-1154","code":" 1145 |   assert(!sections_parsed);\n 1146 |   sections.resize(this->elf_sections.size());\n 1147 | \n 1148 |   if (!keep_discarded_comdat && !comdat_groups.empty()) {\n 1149 |     comdat_discarded.resize(sections.size());\n 1150 |     for (ComdatGroupRef<E> &ref : comdat_groups)\n 1151 |       if (!ref.is_owner)\n 1152 |         for (u32 i : ref.members(*this))\n 1153 |           comdat_discarded[i] = true;\n 1154 |   }","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L1145-L1154"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`ComdatGroupRef<E>::members()` builds a span directly over the mmap'ed input\nfile without any validation:\n\n```cpp\nstd::span<U32<E>> entries(\n  (U32<E> *)(file.mf->data + shdr.sh_offset),\n  (i64)(shdr.sh_size / sizeof(U32<E>)));\nassert(!entries.empty());\nreturn entries.subspan(1);\n```\n\n`sh_offset` / `sh_size` come straight from an untrusted `SHT_GROUP` section\nheader and are never checked against `file.mf->size`, unlike every other\nsection access which goes through `InputFile<E>::get_string()` /\n`get_data()`. A `sh_size` of 0..3 makes `entries` empty and `subspan(1)` is\nundefined behaviour (the `assert` is compiled out under `NDEBUG`). A large\n`sh_offset`/`sh_size` yields a span pointing past the end of the mapping,\nwhich is then iterated by `parse_input_sections()` and `relocatable.cc` and\nused to index `file.sections`.","fix":"Use the checked accessor and reject degenerate groups:\n\n```cpp\nstd::span<U32<E>> entries =\n  file.template get_data<U32<E>>(ctx, file.elf_sections[sect_idx]);\nif (entries.empty())\n  Fatal(ctx) << file << \": corrupted section group\";\nreturn entries.subspan(1);\n```\n\nThis requires threading a `Context<E> &` into `members()`; alternatively cache\nthe validated span when the group is parsed in `read_section_metadata()`.","locations":[{"ref":"src/mold.h:3609-3618","code":" 3609 | template <typename E>\n 3610 | std::span<U32<E>>\n 3611 | ComdatGroupRef<E>::members(ObjectFile<E> &file) const {\n 3612 |   const ElfShdr<E> &shdr = file.elf_sections[sect_idx];\n 3613 |   std::span<U32<E>> entries(\n 3614 |     (U32<E> *)(file.mf->data + shdr.sh_offset),\n 3615 |     (i64)(shdr.sh_size / sizeof(U32<E>)));\n 3616 |   assert(!entries.empty());\n 3617 |   return entries.subspan(1);\n 3618 | }","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3609-L3618"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`read_uleb()` / `read_sleb()` loop `while (byte & 0x80)` with no end pointer. A malformed input\nobject file whose LEB128 encoding runs to the end of an mmap'ed section (all bytes with the\ncontinuation bit set) makes the loop walk past the end of the mapping until it either hits a byte\nwithout the high bit or faults. `shift`, a `u8`, also wraps around after 36 iterations, so the\nloop cannot even self-terminate on shift width. All the callers pass raw pointers derived from\nuntrusted `.debug_*` / `.eh_frame` contents.","fix":"Add bounds-checked overloads that take an end pointer (or a `std::string_view`/`std::span`) and\nstop decoding — reporting a `Fatal`/error — when the buffer is exhausted or when more than 10\nbytes have been consumed. The existing `read_uleb(std::string_view *)` overload already has the\nlength available and could enforce it.","locations":[{"ref":"lib/lib.h:426-436","code":"  426 | inline u64 read_uleb(u8 **buf) {\n  427 |   u64 val = 0;\n  428 |   u8 shift = 0;\n  429 |   u8 byte;\n  430 |   do {\n  431 |     byte = *(*buf)++;\n  432 |     val |= (byte & 0x7f) << shift;\n  433 |     shift += 7;\n  434 |   } while (byte & 0x80);\n  435 |   return val;\n  436 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L426-L436"},{"ref":"lib/lib.h:443-453","code":"  443 | inline i64 read_sleb(u8 **buf) {\n  444 |   u64 val = 0;\n  445 |   u8 shift = 0;\n  446 |   u8 byte;\n  447 |   do {\n  448 |     byte = *(*buf)++;\n  449 |     val |= (byte & 0x7f) << shift;\n  450 |     shift += 7;\n  451 |   } while (byte & 0x80);\n  452 |   return sign_extend(val, shift);\n  453 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L443-L453"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`get_tlsdesc_trampoline_addr()` returns `(*it)->get_addr()` where `it` is the result of\n`ranges::upper_bound(output_section->thunks, P, ...)`. There is no `it != thunks.end()` test, so\nif `P` is greater than or equal to the address of the last thunk (or if `thunks` is empty for any\nreason — e.g. a `--relocatable`-adjacent code path or a future change to\n`create_range_extension_thunks()`), the code dereferences the end iterator.\n\nThe `git` history shows this replaced a call to a helper named `get_reachable_thunk()`, and the\nreplacement also dropped the reachability test: the returned thunk is used as the target of a\n`bl` with a ±32 MiB range (`bits(... - P - 8, 25, 2)` at line 529 and `write_thm_b25()` at line\n539), but nothing verifies the displacement actually fits. `R_ARM_TLS_CALL` is not part of\n`R_FUNCALL`, so thunk placement never accounted for these call sites in the first place.","fix":"Guard the lookup and validate the range:\n\n```cpp\n    auto get_tlsdesc_trampoline_addr = [&] {\n      auto &thunks = output_section->thunks;\n      auto it = ranges::upper_bound(thunks, P, {},\n                                    [](std::unique_ptr<Thunk<E>> &t) {\n                                      return t->get_addr();\n                                    });\n      if (it == thunks.end())\n        Fatal(ctx) << *this << \": no TLSDESC trampoline in range\";\n      u64 addr = (*it)->get_addr();\n      if (!is_int((i64)addr - (i64)P - 8, 26))\n        Fatal(ctx) << *this << \": TLSDESC trampoline out of range\";\n      return addr;\n    };\n```","locations":[{"ref":"src/arch-arm32.cc:312-318","code":"  312 |     auto get_tlsdesc_trampoline_addr = [&] {\n  313 |       auto it = ranges::upper_bound(output_section->thunks, P, {},\n  314 |                                     [](std::unique_ptr<Thunk<E>> &thunk) {\n  315 |         return thunk->get_addr();\n  316 |       });\n  317 |       return (*it)->get_addr();\n  318 |     };","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L312-L318"},{"ref":"src/arch-arm32.cc:527-536","code":"  527 |     case R_ARM_TLS_CALL:\n  528 |       if (sym.has_tlsdesc(ctx)) {\n  529 |         *(U32<E> *)loc = 0xeb00'0000; // bl 0\n  530 |         *(U32<E> *)loc |= bits(get_tlsdesc_trampoline_addr() - P - 8, 25, 2);\n  531 |       } else if (sym.has_gottp(ctx)) {\n  532 |         *(U32<E> *)loc = 0xe79f'0000; // ldr r0, [pc, r0]\n  533 |       } else {\n  534 |         *(U32<E> *)loc = 0xe320'f000; // nop\n  535 |       }\n  536 |       break;","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L527-L536"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`arm32be_swap_bytes()` byte-swaps a `[start, end)` region in 4-byte (`$a`, ARM) or 2-byte (`$t`,\nThumb) units with `for (u8 *p = start; p < end; p += sz) std::reverse(p, p + sz);`. Nothing\nguarantees that `end - start` is a multiple of `sz`: `end` is either the value of the next mapping\nsymbol or `isec.sh_size`, both of which come from an input object file and can be arbitrary. When\nthe region length is not a multiple of `sz`, the last iteration reverses up to `sz - 1` bytes past\n`end`, i.e. it corrupts whatever follows in the output buffer (the next input section, or memory\npast the end of the last section in the output mapping).","fix":"Clamp the loop so it never crosses `end`:\n\n```cpp\n      i64 sz = sym.name().starts_with(\"$a\") ? 4 : 2;\n      for (u8 *p = start; p + sz <= end; p += sz)\n        std::reverse(p, p + sz);\n```\n\nand, if a trailing partial unit indicates a malformed file, report it with `Error(ctx)` instead of\nignoring it silently.","locations":[{"ref":"src/arch-arm32.cc:897-910","code":"  897 |       InputSection<E> &isec = *sym.get_input_section();\n  898 |       u8 *base = ctx.buf + isec.output_section->shdr.sh_offset + isec.offset;\n  899 |       u8 *start = base + sym.value;\n  900 |       u8 *end;\n  901 | \n  902 |       if (i + 1 < syms.size() && syms[i + 1]->get_input_section() == &isec)\n  903 |         end = base + syms[i + 1]->value;\n  904 |       else\n  905 |         end = base + isec.sh_size;\n  906 | \n  907 |       i64 sz = sym.name().starts_with(\"$a\") ? 4 : 2;\n  908 |       for (u8 *p = start; p < end; p += sz)\n  909 |         std::reverse(p, p + sz);\n  910 |     }","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L897-L910"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The `R_386_GOT32X` relaxation reads and writes the two bytes *before* the relocated location:\n`relax_got32x(loc - 2)` in `scan_relocations()` and `loc[-2] = ...; loc[-1] = ...;` in\n`apply_reloc_alloc()`. `loc` is `contents + rel.r_offset` / `base + rel.r_offset`, and\n`rel.r_offset` is taken verbatim from the input object file with no validation anywhere in the\nELF reader. An object file with an `R_386_GOT32X` whose `r_offset` is 0 or 1 makes mold read\nbefore the start of the mmap'ed section (possibly before the mapping) and, worse, *write* two\nbytes before the section's placement in the output buffer, silently corrupting a neighbouring\noutput section.\n\nThe same pattern applies to the `R_386_TLS_GOTDESC` relaxations (`relax_tlsdesc_to_ie(loc - 2)`,\n`relax_tlsdesc_to_le(loc - 2)`) and to `relax_gd_to_le()` / `relax_ld_to_le()`, which `memcpy`\n11-12 bytes starting at `loc - 3` / `loc - 2`.","fix":"Validate `r_offset` against the section size (with the per-relocation-type space requirement,\nincluding the negative prefix) once, when relocations are read, and reject relocations that do not\nfit with an `Error(ctx) << ... << \": relocation offset out of range\"`. As a targeted stopgap, add\n`if (rel.r_offset < 2) Fatal(ctx) << *this << \": invalid R_386_GOT32X offset\";` before each\n`loc - 2` access.","locations":[{"ref":"src/arch-i386.cc:332-343","code":"  332 |     case R_386_GOT32X:\n  333 |       if (sym.has_got(ctx)) {\n  334 |         *(ul32 *)loc = G + A;\n  335 |       } else {\n  336 |         u32 insn = relax_got32x(loc - 2);\n  337 |         assert(insn);\n  338 |         loc[-2] = insn >> 8;\n  339 |         loc[-1] = insn;\n  340 |         *(ul32 *)loc = S + A - GOT;\n  341 |         if (ctx.arg.emit_relocs)\n  342 |           rel.r_type = R_386_GOTOFF;\n  343 |       }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afc {"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`parse_arch_string` parses the version numbers of an ISA string with `std::stoul`. The\nregex `(\\d+)p(\\d+)` accepts arbitrarily long digit runs, so a `.riscv.attributes` section\ncontaining e.g. `rv64i99999999999999p0` makes `std::stoul` throw `std::out_of_range`. mold is\ncompiled with `-fno-exceptions` (`CMakeLists.txt:78`), so the throw turns into an\nunconditional `abort()`. The ISA string comes from an input object file, i.e. it is\nattacker/toolchain-controlled data that mold otherwise validates gracefully (see the\n`corrupted .riscv.attributes ISA string` error path).","fix":"Parse the numbers without exceptions, e.g. with `std::from_chars`, and return `{}` (which the\ncaller already reports as `corrupted .riscv.attributes ISA string`) when the value does not\nfit or the conversion fails:\n```\ni64 major, minor;\nif (std::from_chars(m[2].first, m[2].second, major).ec != std::errc{} ||\n    std::from_chars(m[3].first, m[3].second, minor).ec != std::errc{})\n  return {};\nvec.push_back(Extn{m[1], major, minor});\n```","locations":[{"ref":"src/arch-riscv.cc:1132-1149","code":" 1132 | static std::vector<Extn> parse_arch_string(std::string_view str) {\n 1133 |   auto flags = std::regex_constants::optimize | std::regex_constants::ECMAScript;\n 1134 |   static std::regex re(R\"(^([a-z]|[a-z][a-z0-9]*[a-z])(\\d+)p(\\d+)(_|$))\", flags);\n 1135 | \n 1136 |   std::vector<Extn> vec;\n 1137 | \n 1138 |   for (;;) {\n 1139 |     std::cmatch m;\n 1140 |     if (!std::regex_search(str.data(), str.data() + str.size(), m, re))\n 1141 |       return {};\n 1142 | \n 1143 |     vec.push_back(Extn{m[1], (i64)std::stoul(m[2]), (i64)std::stoul(m[3])});\n 1144 |     if (m[4].length() == 0)\n 1145 |       return vec;\n 1146 | \n 1147 |     str = str.substr(m.length());\n 1148 |   }\n 1149 | }","lines":18,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L1132-L1149"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`RiscvAttributesSection<E>::update_shdr` reports a corrupted ISA string with `Error`, which\nonly records the failure and returns (see `Error<E>::Error` in `src/error.cc:25-32`;\nonly `Fatal` exits). Execution then falls through to\n`arch = merge_extensions(arch, arch2)` with an empty `arch2`, and `merge_extensions`\nimmediately dereferences `y[0]` (`x[0].name != y[0].name`) on a zero-length `std::span` -\nan out-of-bounds read, and `std::span::operator[]` has no bounds checking. A single object\nfile with a malformed `.riscv.attributes` ISA string therefore reads past the end of a\nheap buffer instead of producing a clean diagnostic.","fix":"Skip the file after reporting the error:\n```\n       if (arch2.empty()) {\n         Error(ctx) << *file << \": corrupted .riscv.attributes ISA string: \"\n                    << *file->extra.arch;\n+        continue;\n       }\n```\nand/or make `merge_extensions` defensive: `if (x.empty() || y.empty()) return {};`.","locations":[{"ref":"src/arch-riscv.cc:1210-1224","code":" 1210 |     if (file->extra.arch) {\n 1211 |       std::vector<Extn> arch2 = parse_arch_string(*file->extra.arch);\n 1212 |       if (arch2.empty())\n 1213 |         Error(ctx) << *file << \": corrupted .riscv.attributes ISA string: \"\n 1214 |                    << *file->extra.arch;\n 1215 | \n 1216 |       if (arch.empty()) {\n 1217 |         arch = arch2;\n 1218 |       } else {\n 1219 |         arch = merge_extensions(arch, arch2);\n 1220 |         if (arch.empty())\n 1221 |           Error(ctx) << *file << \": incompatible .riscv.attributes ISA string: \"\n 1222 |                      << *file->extra.arch;\n 1223 |       }\n 1224 |     }","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L1210-L1224"},{"ref":"src/arch-riscv.cc:1151-1156","code":" 1151 | static std::vector<Extn> merge_extensions(std::span<Extn> x, std::span<Extn> y) {\n 1152 |   std::vector<Extn> vec;\n 1153 | \n 1154 |   // The base part (i.e. \"rv64i\" or \"rv32i\") must match.\n 1155 |   if (x[0].name != y[0].name)\n 1156 |     return {};","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L1151-L1156"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`is_gcc_lto_obj` builds `std::string_view` objects from raw `const char *`\npointers into the mapped file: `std::string_view name = data +\nshdrs[shstrtab_idx].sh_offset + sec.sh_name;` and the analogous line for the\nsymbol name. The `std::string_view(const char *)` constructor calls\n`strlen`, which scans until it finds a NUL byte - there is nothing that\nguarantees one exists before the end of the mapping. On a section header string\ntable whose last entry is unterminated (trivially producible), this reads past\nthe end of the mmap'd file.","fix":"Bound the name explicitly against the end of the string table section, e.g.\n```cpp\nconst ElfShdr<E> &strtab = shdrs[shstrtab_idx];\nstd::string_view tab(data + strtab.sh_offset, strtab.sh_size);\nif (sec.sh_name >= tab.size())\n  return false;\nstd::string_view name = tab.substr(sec.sh_name);\n```\nand compare with `starts_with` on that bounded view.","locations":[{"ref":"src/filetype.cc:38-42","code":"   38 |     if (has_gcc_plugin) {\n   39 |       std::string_view name = data + shdrs[shstrtab_idx].sh_offset + sec.sh_name;\n   40 |       if (name.starts_with(\".gnu.lto_.symtab.\"))\n   41 |         return true;\n   42 |     }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/filetype.cc#L38-L42"},{"ref":"src/filetype.cc:61-66","code":"   61 |     if (i < elf_syms.size() && elf_syms[i].st_shndx == SHN_COMMON) {\n   62 |       std::string_view name =\n   63 |         data + shdrs[sec.sh_link].sh_offset + elf_syms[i].st_name;\n   64 |       if (name.starts_with(\"__gnu_lto_\"))\n   65 |         return true;\n   66 |     }","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/filetype.cc#L61-L66"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`visit_section` bounds its own recursion with `depth < 3`, but the\n`__start_`/`__stop_` fan-out path calls `visit_section(ctx, isec, feeder, 0,\nstart_stop_map)` with the depth reset to `0`. A chain of sections in which each\nsection references a `__start_<name>`/`__stop_<name>` symbol whose target\nsection again references such a symbol therefore recurses without any bound,\none native stack frame per link in the chain (plus a nested\n`tbb::parallel_for_each` frame each time). A crafted or merely unusual input\ncan overflow the worker thread's stack, which on TBB worker threads is\ntypically smaller than the main thread's.","fix":"Do not reset the depth counter in the fan-out path; either pass `depth` through\nunchanged, or unconditionally hand the marked sections to the feeder:\n```cpp\ntbb::parallel_for_each(it->second, [&](InputSection<E> *isec) {\n  if (mark_section(isec))\n    feeder.add(isec);\n});\n```","locations":[{"ref":"src/gc-sections.cc:141-148","code":"  141 |   auto mark = [&](InputSection<E> *sec) {\n  142 |     if (mark_section(sec)) {\n  143 |       if (depth < 3)\n  144 |         visit_section(ctx, sec, feeder, depth + 1, start_stop_map);\n  145 |       else\n  146 |         feeder.add(sec);\n  147 |     }\n  148 |   };","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L141-L148"},{"ref":"src/gc-sections.cc:181-192","code":"  181 |       if (auto it = start_stop_map.find(name);\n  182 |           it != start_stop_map.end()) {\n  183 |         // Mark and visit the sections with a nested parallel loop.\n  184 |         // As in mark() below, a section added to a feeder has\n  185 |         // already been marked, so a feeder's loop body must visit\n  186 |         // it unconditionally.\n  187 |         tbb::parallel_for_each(it->second, [&](InputSection<E> *isec) {\n  188 |           if (mark_section(isec))\n  189 |             visit_section(ctx, isec, feeder, 0, start_stop_map);\n  190 |         });\n  191 |       }\n  192 |     }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L181-L192"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`shstrtab.data() + shdr.sh_name` is used as a NUL-terminated C string in\n`read_section_metadata()` and `initialize_sections()` (and in\n`InputSection::name()`), but `sh_name` is never validated against\n`shstrtab.size()`. A crafted `sh_name` produces a `std::string_view` constructed\nby `strlen()` over unmapped memory.","fix":"Validate all `sh_name` values once, right after `shstrtab` is set in the\n`InputFile` constructor:\n```c++\nfor (ElfShdr<E> &shdr : elf_sections)\n  if (shdr.sh_name >= shstrtab.size())\n    Fatal(ctx) << *this << \": invalid sh_name\";\n```\nand require that `shstrtab` ends with a NUL byte.","locations":[{"ref":"src/input-files.cc:272-279","code":"  272 |   for (i64 i = 0; i < this->elf_sections.size(); i++) {\n  273 |     const ElfShdr<E> &shdr = this->elf_sections[i];\n  274 | \n  275 |     if (shdr.sh_flags & SHF_EXCLUDE) {\n  276 |       std::string_view name = this->shstrtab.data() + shdr.sh_name;\n  277 |       if (name.starts_with(\".gnu.offload_lto_.symtab.\"))\n  278 |         this->is_gcc_offload_obj = true;\n  279 |     }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L272-L279"},{"ref":"src/input-files.cc:332-335","code":"  332 |     std::string_view name;\n  333 | \n  334 |     if (shdr.sh_flags & SHF_EXCLUDE)\n  335 |       name = this->shstrtab.data() + shdr.sh_name;","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L332-L335"},{"ref":"src/input-files.cc:369-371","code":"  369 |     default:\n  370 |       if (!name.data())\n  371 |         name = this->shstrtab.data() + shdr.sh_name;","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L369-L371"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`get_soname()`, `get_dt_needed()` and `get_dt_audit()` all form a string as\n`this->get_string(ctx, sec->sh_link).data() + dyn.d_val` where `d_val` is an\nuntrusted 64-bit offset into `.dynstr`. Nothing checks `d_val` against the\nstring table size, so the resulting `std::string`/`std::string_view` is built by\n`strlen()` starting from an arbitrary address.","fix":"Factor a helper out of the three functions:\n```c++\nstd::string_view get_dynstr(Context<E> &ctx, const ElfShdr<E> &sec, u64 off) {\n  std::string_view strtab = this->get_string(ctx, sec.sh_link);\n  if (off >= strtab.size())\n    Fatal(ctx) << *this << \": invalid string offset in .dynamic\";\n  return strtab.data() + off;\n}\n```\nThis also removes the near-duplicate loop body in all three functions.","locations":[{"ref":"src/input-files.cc:1519-1530","code":" 1519 | template <typename E>\n 1520 | std::string SharedFile<E>::get_soname(Context<E> &ctx) {\n 1521 |   if (ElfShdr<E> *sec = this->find_section(SHT_DYNAMIC))\n 1522 |     for (ElfDyn<E> &dyn : this->template get_data<ElfDyn<E>>(ctx, *sec))\n 1523 |       if (dyn.d_tag == DT_SONAME)\n 1524 |         return this->get_string(ctx, sec->sh_link).data() + dyn.d_val;\n 1525 | \n 1526 |   if (this->mf->given_fullpath)\n 1527 |     return this->filename;\n 1528 | \n 1529 |   return path_filename(this->filename);\n 1530 | }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L1519-L1530"},{"ref":"src/input-files.cc:1649-1666","code":" 1649 | template <typename E>\n 1650 | std::vector<std::string_view> SharedFile<E>::get_dt_needed(Context<E> &ctx) {\n 1651 |   std::vector<std::string_view> vec;\n 1652 |   if (ElfShdr<E> *sec = this->find_section(SHT_DYNAMIC))\n 1653 |     for (ElfDyn<E> &dyn : this->template get_data<ElfDyn<E>>(ctx, *sec))\n 1654 |       if (dyn.d_tag == DT_NEEDED)\n 1655 |         vec.push_back(this->get_string(ctx, sec->sh_link).data() + dyn.d_val);\n 1656 |   return vec;\n 1657 | }\n 1658 | \n 1659 | template <typename E>\n 1660 | std::string_view SharedFile<E>::get_dt_audit(Context<E> &ctx) {\n 1661 |   if (ElfShdr<E> *sec = this->find_section(SHT_DYNAMIC))\n 1662 |     for (ElfDyn<E> &dyn : this->template get_data<ElfDyn<E>>(ctx, *sec))\n 1663 |       if (dyn.d_tag == DT_AUDIT)\n 1664 |         return this->get_string(ctx, sec->sh_link).data() + dyn.d_val;\n 1665 |   return \"\";\n 1666 | }","lines":18,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L1649-L1666"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`SharedFile<E>::read_version_strings()` walks the `.gnu.version_d` and\n`.gnu.version_r` linked lists with no bound on the traversal. `ptr += ver->vd_next`,\n`aux_ptr += aux->vna_next` and `ptr += vn->vn_next` are all driven by 32-bit\noffsets from the file, and neither `ptr`, `aux_ptr` nor `ptr + vd_aux` is\ncompared against the end of the section. A crafted DSO walks arbitrarily far\noutside the mapping. `strtab.data() + aux->vda_name` / `+ aux->vna_name` are\nlikewise unchecked.","fix":"Keep the section's end pointer and validate on every step, e.g.\n```c++\nu8 *end = (u8 *)verdef.data() + verdef.size();\nfor (;;) {\n  if (ptr + sizeof(ElfVerdef<E>) > end) Fatal(ctx) << *this << \": corrupted .gnu.version_d\";\n  ...\n  if (!ver->vd_next || ptr + ver->vd_next <= ptr) break;   // also rejects vd_next == 0 loops\n  ptr += ver->vd_next;\n}\n```\nand bounds-check `vda_name`/`vna_name` against `strtab.size()`.","locations":[{"ref":"src/input-files.cc:1708-1751","code":" 1708 |   if (ElfShdr<E> *sec = this->find_section(SHT_GNU_VERDEF)) {\n 1709 |     std::string_view verdef = this->get_string(ctx, *sec);\n 1710 |     std::string_view strtab = this->get_string(ctx, sec->sh_link);\n 1711 |     u8 *ptr = (u8 *)verdef.data();\n 1712 | \n 1713 |     for (;;) {\n 1714 |       ElfVerdef<E> *ver = (ElfVerdef<E> *)ptr;\n 1715 |       if (ver->vd_ndx == VER_NDX_UNSPECIFIED)\n 1716 |         Fatal(ctx) << *this << \": symbol version too large\";\n 1717 | \n 1718 |       if (vec.size() <= ver->vd_ndx)\n 1719 |         vec.resize(ver->vd_ndx + 1);\n 1720 | \n 1721 |       ElfVerdaux<E> *aux = (ElfVerdaux<E> *)(ptr + ver->vd_aux);\n 1722 |       vec[ver->vd_ndx] = strtab.data() + aux->vda_name;\n 1723 |       if (!ver->vd_next)\n 1724 |         break;\n 1725 |       ptr += ver->vd_next;\n 1726 |     }\n 1727 |   }\n 1728 | \n 1729 |   if (ElfShdr<E> *sec = this->find_section(SHT_GNU_VERNEED)) {\n 1730 |     std::string_view verneed = this->get_string(ctx, *sec);\n 1731 |     std::string_view strtab = this->get_string(ctx, sec->sh_link);\n 1732 |     u8 *ptr = (u8 *)verneed.data();\n 1733 | \n 1734 |     for (;;) {\n 1735 |       ElfVerneed<E> *vn = (ElfVerneed<E> *)ptr;\n 1736 |       u8 *aux_ptr = ptr + vn->vn_aux;\n 1737 |       for (i64 i = 0; i < vn->vn_cnt; i++) {\n 1738 |         ElfVernaux<E> *aux = (ElfVernaux<E> *)aux_ptr;\n 1739 |         u16 idx = aux->vna_other & ~VERSYM_HIDDEN;\n 1740 |         if (vec.size() <= idx)\n 1741 |           vec.resize(idx + 1);\n 1742 |         vec[idx] = strtab.data() + aux->vna_name;\n 1743 |         if (!aux->vna_next)\n 1744 |           break;\n 1745 |         aux_ptr += aux->vna_next;\n 1746 |       }\n 1747 |       if (!vn->vn_next)\n 1748 |         break;\n 1749 |       ptr += vn->vn_next;\n 1750 |     }\n 1751 |   }","lines":44,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L1708-L1751"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`SharedFile<E>::get_alignment()` indexes `this->elf_sections[sym->esym().st_shndx]`\nwith a completely unvalidated `st_shndx`. Besides ordinary out-of-range values,\n`st_shndx` can legitimately be a reserved index such as `SHN_ABS` (`0xfff1`),\nwhich is not a section index at all. Since this runs for every copy relocation,\na DSO exporting an absolute symbol that gets a copy relocation makes mold read\n~64 KiB past the section header table.\n\n`SharedFile<E>::is_readonly()` has the same problem for the program headers: it\nbuilds a span from `e_phoff`/`e_phnum` without checking either against the file\nsize.","fix":"In `get_alignment()`, return 1 when `st_shndx >= elf_sections.size()` (which\ncovers `SHN_ABS`/`SHN_COMMON`); in `is_readonly()`, verify\n`e_phoff + e_phnum * sizeof(ElfPhdr<E>) <= mf->size` before constructing the\nspan (or return `false` otherwise).","locations":[{"ref":"src/input-files.cc:1850-1857","code":" 1850 | template <typename E>\n 1851 | i64 SharedFile<E>::get_alignment(Symbol<E> *sym) {\n 1852 |   ElfShdr<E> &shdr = this->elf_sections[sym->esym().st_shndx];\n 1853 |   i64 align = std::max<i64>(1, shdr.sh_addralign);\n 1854 |   if (sym->value)\n 1855 |     align = std::min<i64>(align, 1LL << std::countr_zero(sym->value));\n 1856 |   return align;\n 1857 | }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L1850-L1857"},{"ref":"src/input-files.cc:1859-1872","code":" 1859 | template <typename E>\n 1860 | bool SharedFile<E>::is_readonly(Symbol<E> *sym) {\n 1861 |   ElfEhdr<E> &ehdr = *(ElfEhdr<E> *)this->mf->data;\n 1862 |   std::span<ElfPhdr<E>> phdrs((ElfPhdr<E> *)(this->mf->data + ehdr.e_phoff),\n 1863 |                               ehdr.e_phnum);\n 1864 |   u64 val = sym->esym().st_value;\n 1865 | \n 1866 |   for (ElfPhdr<E> &phdr : phdrs)\n 1867 |     if ((phdr.p_type == PT_LOAD || phdr.p_type == PT_GNU_RELRO) &&\n 1868 |         !(phdr.p_flags & PF_W) &&\n 1869 |         phdr.p_vaddr <= val && val < phdr.p_vaddr + phdr.p_memsz)\n 1870 |       return true;\n 1871 |   return false;\n 1872 | }","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L1859-L1872"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`InputSection`'s constructor reads `ElfChdr<E> &chdr = *(ElfChdr<E> *)contents;`\nas soon as `SHF_COMPRESSED` is set, without checking that the section is at\nleast `sizeof(ElfChdr<E>)` bytes long (the check exists only later, in\n`copy_contents_to()`). A 1-byte compressed section therefore reads out of\nbounds. Additionally `sh_size` is then taken verbatim from `chdr.ch_size`, an\nuntrusted 64-bit value that later drives `new u8[sh_size]` in `uncompress()` -\nan unbounded, uncaught `std::bad_alloc` / OOM triggered by a small input file\n(a decompression bomb).","fix":"Check `shdr().sh_size >= sizeof(ElfChdr<E>)` before casting `contents`, and\nreject implausible `ch_size` values (e.g. `Fatal` when `ch_size` exceeds some\nmultiple of the compressed size or of the total input size) before calling\n`new u8[sh_size]`.","locations":[{"ref":"src/input-sections.cc:46-53","code":"   46 |   if (shdr().sh_flags & SHF_COMPRESSED) {\n   47 |     ElfChdr<E> &chdr = *(ElfChdr<E> *)contents;\n   48 |     sh_size = chdr.ch_size;\n   49 |     p2align = to_p2align(chdr.ch_addralign);\n   50 |   } else {\n   51 |     sh_size = shdr().sh_size;\n   52 |     p2align = to_p2align(shdr().sh_addralign);\n   53 |   }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-sections.cc#L46-L53"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`find_null()` computes `pos <= data.size() - entsize` in `size_t` arithmetic. If\n`entsize > data.size()` (a `SHF_MERGE|SHF_STRINGS` section shorter than its own\n`sh_entsize`, both fully attacker-controlled), the subtraction underflows to\n~2^64 and the loop condition is effectively always true. `pos` then grows past\n`data.size()` and `data.substr(pos, entsize)` throws `std::out_of_range`, which\nnothing catches -> `std::terminate()`.\n\nExample: a two-byte section `\"ab\"` with `sh_entsize = 4` reaches\n`data.substr(4, 4)` on the second iteration and aborts.","fix":"Guard the underflow:\n```c++\nstatic size_t find_null(std::string_view data, i64 pos, i64 entsize) {\n  if (entsize == 1)\n    return data.find('\\0', pos);\n  if ((i64)data.size() < entsize)\n    return data.npos;\n  for (; pos <= (i64)data.size() - entsize; pos += entsize)\n    ...\n}\n```","locations":[{"ref":"src/input-sections.cc:398-407","code":"  398 | static size_t find_null(std::string_view data, i64 pos, i64 entsize) {\n  399 |   if (entsize == 1)\n  400 |     return data.find('\\0', pos);\n  401 | \n  402 |   for (; pos <= data.size() - entsize; pos += entsize)\n  403 |     if (data.substr(pos, entsize).find_first_not_of('\\0') == data.npos)\n  404 |       return pos;\n  405 | \n  406 |   return data.npos;\n  407 | }","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-sections.cc#L398-L407"}]},
