{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`create_synthetic_sections()` creates `EhFrameRelocSection` when\n`--emit-relocs` is given, but never creates the corresponding\n`SFrameRelocSection`, even though `ctx.sframe_reloc` exists and is created by\nthe `--relocatable` path (`r_create_synthetic_sections()`). Consequently, on\ntargets that support SFrame, `--emit-relocs` produces `.rela.eh_frame` but\nsilently drops the relocations for the synthesized `.sframe` section, so\nconsumers of `--emit-relocs` output cannot relocate `.sframe`.","fix":"Mirror the `.eh_frame` handling: `if (ctx.arg.emit_relocs) { ctx.eh_frame_reloc = push(new EhFrameRelocSection<E>); if constexpr (supports_sframe<E>) ctx.sframe_reloc = push(new SFrameRelocSection<E>); }` - or document explicitly why `.sframe` relocations are not emitted.","locations":[{"ref":"src/passes.cc:178-181","code":"  178 |   if (ctx.arg.emit_relocs)\n  179 |     ctx.eh_frame_reloc = push(new EhFrameRelocSection<E>);\n  180 |   if (!ctx.arg.separate_debug_file.empty())\n  181 |     ctx.gnu_debuglink = push(new GnuDebuglinkSection<E>);","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L178-L181"},{"ref":"src/relocatable.cc:51-54","code":"   51 |   ctx.eh_frame = push(new EhFrameSection<E>);\n   52 |   ctx.eh_frame_reloc = push(new EhFrameRelocSection<E>);\n   53 |   ctx.sframe = push(new SFrameSection<E>);\n   54 |   ctx.sframe_reloc = push(new SFrameRelocSection<E>);","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/relocatable.cc#L51-L54"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The LTO pass-manager options are wired up backwards. `--no-legacy-pass-manager` pushes the\nplugin option `legacy-pass-manager`, i.e. the \"no-\" spelling *enables* the legacy pass\nmanager, and the option that should enable it (`--lto-legacy-pass-manager`, the spelling used\nby lld and accepted by GCC's linker plugin) is not recognised at all and makes mold die with\n\"unknown command line option\". The sibling three lines below\n(`--no-lto-legacy-pass-manager` -> `new-pass-manager`) shows the intended naming scheme.","fix":"```\n-    } else if (read_flag(\"no-legacy-pass-manager\")) {\n+    } else if (read_flag(\"lto-legacy-pass-manager\")) {\n       ctx.arg.plugin_opt.emplace_back(\"legacy-pass-manager\");\n```\nkeeping `--no-lto-legacy-pass-manager` -> `new-pass-manager` as is.","locations":[{"ref":"src/cmdline.cc:1323-1328","code":" 1323 |     } else if (read_flag(\"no-legacy-pass-manager\")) {\n 1324 |       ctx.arg.plugin_opt.emplace_back(\"legacy-pass-manager\");\n 1325 |     } else if (read_arg(\"lto-partitions\")) {\n 1326 |       ctx.arg.plugin_opt.push_back(\"lto-partitions=\" + std::string(arg));\n 1327 |     } else if (read_flag(\"no-lto-legacy-pass-manager\")) {\n 1328 |       ctx.arg.plugin_opt.emplace_back(\"new-pass-manager\");","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L1323-L1328"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The diagnostic for an unhandled `DW_AT_low_pc` form prints `high_pc.form`\ninstead of `low_pc.form`, so the error message names the wrong attribute's form\nand the user cannot tell which form is actually unsupported.","fix":"Change\n`Fatal(ctx) << \"--gdb-index: unhandled form for DW_AT_low_pc: 0x\" << std::hex << high_pc.form;`\nto\n`Fatal(ctx) << \"--gdb-index: unhandled form for DW_AT_low_pc: 0x\" << std::hex << low_pc.form;`","locations":[{"ref":"src/gdb-index.cc:631-634","code":"  631 |     default:\n  632 |       Fatal(ctx) << \"--gdb-index: unhandled form for DW_AT_low_pc: 0x\"\n  633 |                  << std::hex << high_pc.form;\n  634 |     }","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gdb-index.cc#L631-L634"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In the linker-synthesized `_restgpr0_*` sequence the `_restgpr0_29` label is attached to\n`ld r0,16(r1)` and the following unnamed slot holds `ld r29,-24(r1)`; the canonical GCC\nsequence has these two instructions the other way round (the label belongs on the `r29`\nrestore, and `ld r0,16(r1)` is the shared tail). Execution happens to remain correct because\nboth loads precede the `mtlr r0`, but the table no longer matches the layout it is\ndocumenting, and a future edit that inserts something between them would break it.","fix":"Swap the two entries so the label sits on the register restore:\n```\n-  { \"_restgpr0_29\", 0xe8010010 }, // ld r0,16(r1)\n-  { \"\",             0xeba1ffe8 }, // ld r29,-24(r1)\n+  { \"_restgpr0_29\", 0xeba1ffe8 }, // ld r29,-24(r1)\n+  { \"\",             0xe8010010 }, // ld r0,16(r1)\n```","locations":[{"ref":"src/arch-ppc64v2.cc:630-632","code":"  630 |   { \"_restgpr0_29\", 0xe8010010 }, // ld r0,16(r1)\n  631 |   { \"\",             0xeba1ffe8 }, // ld r29,-24(r1)\n  632 |   { \"\",             0x7c0803a6 }, // mtlr r0","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v2.cc#L630-L632"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`MallocOutputFile<E>::close()` ignores every failure of the final write:\n\n```cpp\nfwrite(this->buf, this->filesize, 1, fp);\nfclose(fp);\n```\n\nNeither the `fwrite` short-write/error result nor the `fclose` flush result is\nchecked. `MallocOutputFile` is the path used for `-o -`, for non-mmap-able\noutputs and for `--separate-debug-file`, so a full disk, a quota violation or\nan I/O error silently produces a truncated or partially written output file\nwhile mold exits with status 0. Note that `fclose(stdout)` is also called when\n`path == \"-\"`, which closes the process's stdout.","fix":"Check both calls and report:\n\n```cpp\nif (fwrite(this->buf, this->filesize, 1, fp) != 1)\n  Fatal(ctx) << \"cannot write to \" << this->path << \": \" << errno_string();\nif (fp != stdout && fclose(fp) != 0)\n  Fatal(ctx) << \"cannot write to \" << this->path << \": \" << errno_string();\nif (fp == stdout && fflush(fp) != 0)\n  Fatal(ctx) << \"cannot write to stdout: \" << errno_string();\n```","locations":[{"ref":"src/mold.h:1760-1784","code":" 1760 |   void close(Context<E> &ctx) override {\n 1761 |     Timer t(ctx, \"close_file\");\n 1762 |     FILE *fp;\n 1763 | \n 1764 |     if (this->path == \"-\") {\n 1765 |       fp = stdout;\n 1766 |     } else {\n 1767 | #ifdef _WIN32\n 1768 |       int pmode = (perm & 0200) ? (_S_IREAD | _S_IWRITE) : _S_IREAD;\n 1769 |       i64 fd = _open(this->path.c_str(), _O_RDWR | _O_CREAT | _O_BINARY, pmode);\n 1770 | #else\n 1771 |       i64 fd = ::open(this->path.c_str(), O_RDWR | O_CREAT, perm);\n 1772 | #endif\n 1773 |       if (fd == -1)\n 1774 |         Fatal(ctx) << \"cannot open \" << this->path << \": \" << errno_string();\n 1775 | #ifdef _WIN32\n 1776 |       fp = _fdopen(fd, \"wb\");\n 1777 | #else\n 1778 |       fp = fdopen(fd, \"w\");\n 1779 | #endif\n 1780 |     }\n 1781 | \n 1782 |     fwrite(this->buf, this->filesize, 1, fp);\n 1783 |     fclose(fp);\n 1784 |   }","lines":25,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L1760-L1784"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"All error handling in `lib/compress.cc` is done with `assert()`, which is compiled out in release\nbuilds (`-DNDEBUG`). The `CHECK()` macro is literally `assert(r == Z_OK)` and\n`zstd_compress()` uses `assert(!ZSTD_isError(sz))`.\n\nThe zstd case is the worst: `ZSTD_compress()` returns an error *code* (a huge `size_t` such as\n`(size_t)-70`) on failure, and the function then returns `{buf, sz}` — a `std::span` whose length\nis that error code. `compressed_size` becomes astronomically large and `ZstdCompressor::write_to()`\n`memcpy`s that many bytes, corrupting memory / crashing. Failures such as an allocation failure\ninside libzstd therefore turn into memory corruption instead of a clean error message.\n`deflatePending()`'s return value is not checked at all.","fix":"Replace the asserts with real checks that survive `NDEBUG`, e.g.\n\n```cpp\nstatic std::span<u8> zstd_compress(std::span<u8> input, int level) {\n  i64 bufsize = ZSTD_COMPRESSBOUND(input.size());\n  u8 *buf = new u8[bufsize];\n  size_t sz = ZSTD_compress(buf, bufsize, input.data(), input.size(), level);\n  if (ZSTD_isError(sz)) {\n    std::cerr << \"mold: zstd compression failed: \" << ZSTD_getErrorName(sz) << \"\\n\";\n    std::exit(1);\n  }\n  return {buf, sz};\n}\n```\n\nand change `CHECK(fn)` to test the result and abort with a message rather than using `assert`.","locations":[{"ref":"lib/compress.cc:23-27","code":"   23 | #define CHECK(fn)                               \\\n   24 |   do {                                          \\\n   25 |     [[maybe_unused]] int r = (fn);              \\\n   26 |     assert(r == Z_OK);                          \\\n   27 |   } while (0)","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/compress.cc#L23-L27"},{"ref":"lib/compress.cc:141-147","code":"  141 | static std::span<u8> zstd_compress(std::span<u8> input, int level) {\n  142 |   i64 bufsize = ZSTD_COMPRESSBOUND(input.size());\n  143 |   u8 *buf = new u8[bufsize];\n  144 |   size_t sz = ZSTD_compress(buf, bufsize, input.data(), input.size(), level);\n  145 |   assert(!ZSTD_isError(sz));\n  146 |   return {buf, sz};\n  147 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/compress.cc#L141-L147"},{"ref":"lib/compress.cc:86-90","code":"   86 |   int nbits = 0;\n   87 |   deflatePending(&strm, Z_NULL, &nbits);\n   88 |   if (nbits == 5)\n   89 |     CHECK(deflatePrime(&strm, 10, 2));\n   90 |   CHECK(deflate(&strm, Z_SYNC_FLUSH));","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/compress.cc#L86-L90"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`ConcurrentMap::resize()` never checks whether the backing allocation succeeded. On POSIX, `mmap`\nreturns `MAP_FAILED` (`(void *)-1`), not `nullptr`, so `entries` becomes `(Entry *)-1`; the\nfollowing `madvise()` fails silently and the first `insert()` dereferences a near-`-1` pointer.\nOn Windows the `_aligned_malloc()` result is passed straight to `memset()`. Since `nbuckets` is\nderived from an estimate of the number of mergeable-section pieces in the input files, a large\nlink on a memory-constrained host turns into a wild pointer dereference instead of a diagnostic.","fix":"Check the results:\n\n```cpp\n#ifdef _WIN32\n    entries = (Entry *)_aligned_malloc(bufsize, alignof(Entry));\n    if (!entries) { std::cerr << \"mold: out of memory\\n\"; std::exit(1); }\n    memset((void *)entries, 0, bufsize);\n#else\n    void *p = mmap(nullptr, bufsize, PROT_READ | PROT_WRITE,\n                   MAP_ANONYMOUS | MAP_PRIVATE, -1, 0);\n    if (p == MAP_FAILED) { std::cerr << \"mold: out of memory\\n\"; std::exit(1); }\n    entries = (Entry *)p;\n#endif\n```","locations":[{"ref":"lib/lib.h:531-549","code":"  531 |   void resize(i64 nbuckets) {\n  532 |     assert(!entries);\n  533 |     this->nbuckets = std::max<i64>(MIN_NBUCKETS, bit_ceil(nbuckets));\n  534 |     i64 bufsize = sizeof(Entry) * this->nbuckets;\n  535 | \n  536 |     // Allocate a zero-initialized buffer. mmap is faster than\n  537 |     // malloc + memset.\n  538 | #ifdef _WIN32\n  539 |     entries = (Entry *)_aligned_malloc(bufsize, alignof(Entry));\n  540 |     memset((void *)entries, 0, bufsize);\n  541 | #else\n  542 |     entries = (Entry *)mmap(nullptr, bufsize, PROT_READ | PROT_WRITE,\n  543 |                             MAP_ANONYMOUS | MAP_PRIVATE, -1, 0);\n  544 | #endif\n  545 | \n  546 | #ifdef MADV_HUGEPAGE\n  547 |     madvise((void *)entries, bufsize, MADV_HUGEPAGE);\n  548 | #endif\n  549 |   }","lines":19,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L531-L549"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`TarWriter::append()` ignores the result of every I/O call: four `fwrite()`s, two `fseek()`s, both\n`ftell()`s (which return `-1L` on failure and are then fed to `align_to()` and `ftruncate()`), and\n`ftruncate()` itself (explicitly discarded with `(void)!`). `TarWriter::~TarWriter()` also ignores\n`fclose()`, which is where buffered data actually reaches the disk. A full disk or a write error\ntherefore produces a silently truncated/corrupt `.repro.tar` with a successful exit status — the\nexact situation in which a user is trying to capture a reproducer.","fix":"Check each call and report through the caller. Minimally, add a helper\n\n```cpp\nstatic void check_io(bool ok) {\n  if (!ok) {\n    std::cerr << \"mold: failed to write to the repro tar file: \"\n              << strerror(errno) << \"\\n\";\n    std::exit(1);\n  }\n}\n```\n\nand wrap every `fwrite`/`fseek`/`ftell`/`ftruncate`, plus `check_io(fclose(out) == 0)` in the\ndestructor (or, better, expose an explicit `close()` that can propagate the error).","locations":[{"ref":"lib/tar.cc:84-117","code":"   84 | void TarWriter::append(std::string path, std::string_view data) {\n   85 |   // Write PAX header\n   86 |   UstarHeader pax = {};\n   87 | \n   88 |   std::string attr = encode_path(basedir, path);\n   89 | \n   90 |   if (attr.size() >= 0100'000'000'000)\n   91 |     unreachable();\n   92 |   snprintf(pax.size, sizeof(pax.size), \"%011zo\", attr.size());\n   93 |   pax.name[0] = '/';\n   94 |   pax.typeflag[0] = 'x';\n   95 |   finalize(pax);\n   96 |   fwrite(&pax, sizeof(pax), 1, out);\n   97 | \n   98 |   // Write pathname\n   99 |   fwrite(attr.data(), attr.size(), 1, out);\n  100 |   fseek(out, align_to(ftell(out), BLOCK_SIZE), SEEK_SET);\n  101 | \n  102 |   // Write Ustar header\n  103 |   UstarHeader ustar = {};\n  104 |   memcpy(ustar.mode, \"0000664\", 8);\n  105 |   if (data.size() >= 0100'000'000'000)\n  106 |     unreachable();\n  107 |   snprintf(ustar.size, sizeof(ustar.size), \"%011zo\", data.size());\n  108 |   finalize(ustar);\n  109 |   fwrite(&ustar, sizeof(ustar), 1, out);\n  110 | \n  111 |   // Write file contents\n  112 |   fwrite(data.data(), data.size(), 1, out);\n  113 |   fseek(out, align_to(ftell(out), BLOCK_SIZE), SEEK_SET);\n  114 | \n  115 |   // A tar file must ends with two empty blocks\n  116 |   (void)!ftruncate(fileno(out), ftell(out) + BLOCK_SIZE * 2);\n  117 | }","lines":34,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/tar.cc#L84-L117"},{"ref":"lib/tar.cc:80-82","code":"   80 | TarWriter::~TarWriter() {\n   81 |   fclose(out);\n   82 | }","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/tar.cc#L80-L82"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`apply_reloc_alloc()` uses `assert(insn)` after `relax_got32x(loc - 2)` for `R_386_GOT32X`, while\nthe structurally identical `R_386_TLS_GOTDESC` code a few lines below correctly uses\n`Fatal(ctx) << *this << \": illegal instruction sequence for TLSDESC\"`. Release builds define\n`NDEBUG`, so the assert disappears and `insn == 0` falls through to\n`loc[-2] = 0; loc[-1] = 0;` — which writes `add %al,(%eax)` over the instruction and produces a\nsilently broken executable instead of a diagnostic.","fix":"Before:\n```cpp\n        u32 insn = relax_got32x(loc - 2);\n        assert(insn);\n```\n\nAfter:\n```cpp\n        u32 insn = relax_got32x(loc - 2);\n        if (!insn)\n          Fatal(ctx) << *this << \": illegal instruction sequence for GOT32X\";\n```","locations":[{"ref":"src/arch-i386.cc:335-343","code":"  335 |       } else {\n  336 |         u32 insn = relax_got32x(loc - 2);\n  337 |         assert(insn);\n  338 |         loc[-2] = insn >> 8;\n  339 |         loc[-1] = insn;\n  340 |         *(ul32 *)loc = S + A - GOT;\n  341 |         if (ctx.arg.emit_relocs)\n  342 |           rel.r_type = R_386_GOTOFF;\n  343 |       }","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-i386.cc#L335-L343"},{"ref":"src/arch-i386.cc:413-424","code":"  413 |       } else if (sym.has_gottp(ctx)) {\n  414 |         u32 insn = relax_tlsdesc_to_ie(loc - 2);\n  415 |         if (!insn)\n  416 |           Fatal(ctx) << *this << \": illegal instruction sequence for TLSDESC\";\n  417 |         loc[-2] = insn >> 8;\n  418 |         loc[-1] = insn;\n  419 |         *(ul32 *)loc = sym.get_gottp_addr(ctx) + A - GOT;\n  420 |       } else {\n  421 |         u32 insn = relax_tlsdesc_to_le(loc - 2);\n  422 |         if (!insn)\n  423 |           Fatal(ctx) << *this << \": illegal instruction sequence for TLSDESC\";\n  424 |         loc[-2] = insn >> 8;","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-i386.cc#L413-L424"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The ELFv2 backend applies several truncating relocations with no range check at all, while\nthe sibling ELFv1 backend does check comparable ones. `R_PPC64_REL14` masks the branch\ndisplacement with `bits(S + A - P, 15, 2)` and is never routed through a thunk, so an\nout-of-range conditional branch silently becomes a branch to a wrong address;\n`R_PPC64_TOC16_*` truncate the TOC displacement to 16 bits without the\n`check(S + A - TOC, -(1 << 15), 1 << 15)` that `arch-ppc64v1.cc:190-193` performs for\n`R_PPC64_TOC16_DS` (GNU ld reports these as `TOC overflow`); `write34()` never verifies that\nthe value fits in 34 bits. In all cases mold produces a silently broken executable instead\nof an error.","fix":"Add `check_range` calls mirroring `arch-ppc64v1.cc`: `check(S + A - P, -(1 << 15), 1 << 15)`\nfor `R_PPC64_REL14`, `check(S + A - TOC, -(1 << 15), 1 << 15)` for the `TOC16` family, and a\n`check(x, -(1LL << 33), 1LL << 33)` inside or before `write34()`.","locations":[{"ref":"src/arch-ppc64v2.cc:264-266","code":"  264 |     case R_PPC64_REL14:\n  265 |       *(ul32 *)loc |= bits(S + A - P, 15, 2) << 2;\n  266 |       break;","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v2.cc#L264-L266"},{"ref":"src/arch-ppc64v2.cc:97-101","code":"   97 | static void write34(u8 *loc, u64 x) {\n   98 |   ul32 *buf = (ul32 *)loc;\n   99 |   buf[0] = (buf[0] & 0xfffc'0000) | bits(x, 33, 16);\n  100 |   buf[1] = (buf[1] & 0xffff'0000) | bits(x, 15, 0);\n  101 | }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v2.cc#L97-L101"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"All numeric option parsing goes through `std::stoul`/`std::stoull`/`std::stoi`, which throw\n`std::out_of_range` (and `std::invalid_argument`) on unrepresentable input. Nothing in mold\ncatches them, so `mold --image-base=0xffffffffffffffffff`, `--Ttext=fffffffffffffffffff`,\n`--section-order '=99999999999999999999'` or a kernel version string with a huge component\nterminate the process via `std::terminate` with an unhandled-exception abort instead of the\nusual `mold: error: ...` message. The affected helpers are `parse_hex` (`std::stoul`),\n`parse_number` (`std::stoul`), `parse_section_order` (`std::stoull`),\n`parse_defsym_value` (`std::stoull`) and `parse_kernel_version` (`std::stoi`).","fix":"Wrap the conversions (e.g. a small `to_u64(std::string_view, int base, bool &ok)` helper\nusing `std::from_chars`, which is non-throwing and does not allocate) and call\n`Fatal(ctx) << \"option -\" << opt << \": number out of range: \" << value;` on failure.\n`std::from_chars` also removes the temporary `std::string` allocations these helpers make.","locations":[{"ref":"src/cmdline.cc:403-430","code":"  403 | template <typename E>\n  404 | static i64 parse_hex(Context<E> &ctx, std::string opt, std::string_view value) {\n  405 |   auto flags = std::regex_constants::optimize | std::regex_constants::ECMAScript;\n  406 |   static std::regex re(R\"((?:0x|0X)?([0-9a-fA-F]+))\", flags);\n  407 | \n  408 |   std::cmatch m;\n  409 |   if (!std::regex_match(value.data(), value.data() + value.size(), m, re))\n  410 |     Fatal(ctx) << \"option -\" << opt << \": not a hexadecimal number\";\n  411 |   return std::stoul(m[1], nullptr, 16);\n  412 | }\n  413 | \n  414 | template <typename E>\n  415 | static i64 parse_number(Context<E> &ctx, std::string opt,\n  416 |                         std::string_view value) {\n  417 |   size_t nread;\n  418 | \n  419 |   if (value.starts_with('-')) {\n  420 |     i64 ret = std::stoul(std::string(value.substr(1)), &nread, 0);\n  421 |     if (value.size() - 1 != nread)\n  422 |       Fatal(ctx) << \"option -\" << opt << \": not a number: \" << value;\n  423 |     return -ret;\n  424 |   }\n  425 | \n  426 |   i64 ret = std::stoul(std::string(value), &nread, 0);\n  427 |   if (value.size() != nread)\n  428 |     Fatal(ctx) << \"option -\" << opt << \": not a number: \" << value;\n  429 |   return ret;\n  430 | }","lines":28,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L403-L430"},{"ref":"src/cmdline.cc:551-558","code":"  551 |     } else if (std::regex_match(tok.data(), tok.data() + tok.size(), m, re3)) {\n  552 |       ord.type = SectionOrder::ADDR;\n  553 |       std::string s = m[1];\n  554 |       ord.value = std::stoull(s, nullptr, s.starts_with(\"0x\") ? 16 : 10);\n  555 |     } else if (std::regex_match(tok.data(), tok.data() + tok.size(), m, re4)) {\n  556 |       ord.type = SectionOrder::ALIGN;\n  557 |       std::string s = m[1];\n  558 |       ord.value = std::stoull(s, nullptr, s.starts_with(\"0x\") ? 16 : 10);","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L551-L558"},{"ref":"src/cmdline.cc:598-607","code":"  598 | static std::tuple<int, int, int>\n  599 | parse_kernel_version(std::string str) {\n  600 |   auto flags = std::regex_constants::optimize | std::regex_constants::ECMAScript;\n  601 |   static std::regex re(R\"(^(\\d+)\\.(\\d+)\\.(\\d+))\", flags);\n  602 |   std::smatch m;\n  603 | \n  604 |   if (!std::regex_search(str, m, re))\n  605 |     return {0, 0, 0};\n  606 |   return {std::stoi(m[1]), std::stoi(m[2]), std::stoi(m[3])};\n  607 | }","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L598-L607"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`--thread-count`/`--threads=` accept any number, including `0` and negatives, without\nvalidation. The value is stored in `ctx.arg.thread_count` and handed to\n`tbb::global_control(max_allowed_parallelism, get_thread_count(ctx))` in `src/main.cc:362`.\nTBB requires a parallelism level of at least 1; `0` violates that contract and a negative\nvalue is converted to a huge `size_t`, so `--thread-count 0` produces an assertion failure or\nundefined scheduler behaviour rather than a clean error message.","fix":"Validate right after parsing, e.g.:\n```\n     } else if (read_arg(\"thread-count\")) {\n       ctx.arg.thread_count = parse_number(ctx, \"thread-count\", arg);\n+      if (*ctx.arg.thread_count < 1)\n+        Fatal(ctx) << \"--thread-count: must be a positive number: \" << arg;\n```\nand the same for the `--threads=` branch.","locations":[{"ref":"src/cmdline.cc:1372-1379","code":" 1372 |     } else if (read_arg(\"thread-count\")) {\n 1373 |       ctx.arg.thread_count = parse_number(ctx, \"thread-count\", arg);\n 1374 |     } else if (read_flag(\"threads\")) {\n 1375 |       ctx.arg.thread_count.reset();\n 1376 |     } else if (read_flag(\"no-threads\")) {\n 1377 |       ctx.arg.thread_count = 1;\n 1378 |     } else if (read_eq(\"threads\")) {\n 1379 |       ctx.arg.thread_count = parse_number(ctx, \"threads\", arg);","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L1372-L1379"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`create_plugin_input_file()` checks the reopened descriptor with `if (!file.fd)`.\nOn POSIX, `open()` reports failure by returning `-1`, not `0`, and\n`MappedFile::fd` is initialized to `-1`. The check therefore never fires: a\nfailed `reopen_fd()` silently hands `fd = -1` to the LTO plugin, which then\nfails in a confusing way deep inside the compiler backend instead of producing\nmold's \"cannot open ...\" message. (`0` is a *valid* descriptor, so the current\ntest would also produce a spurious error if stdin were closed.)","fix":"```c++\n-  if (!file.fd)\n+  if (file.fd == -1)\n     Fatal(ctx) << \"cannot open \" << file.name << \": \" << errno_string();\n```\n(and use `INVALID_HANDLE_VALUE` on the Win32 side if that path is ever enabled).","locations":[{"ref":"src/lto-unix.cc:580-597","code":"  580 | template <typename E>\n  581 | static PluginInputFile\n  582 | create_plugin_input_file(Context<E> &ctx, MappedFile *mf) {\n  583 |   PluginInputFile file;\n  584 |   MappedFile *mf2 = mf->parent ? mf->parent : mf;\n  585 | \n  586 |   file.name = save_string(ctx, mf2->name).data();\n  587 |   file.offset = mf->get_offset();\n  588 |   file.filesize = mf->size;\n  589 | \n  590 |   mf2->reopen_fd(file.name);\n  591 | \n  592 |   file.fd = mf2->fd;\n  593 | \n  594 |   if (!file.fd)\n  595 |     Fatal(ctx) << \"cannot open \" << file.name << \": \" << errno_string();\n  596 |   return file;\n  597 | }","lines":18,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/lto-unix.cc#L580-L597"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"With `--pack-dyn-relocs=android`, `RelDynSection<E>::copy_buf` blindly writes the\n`android_encoded` byte vector that was produced by the *last* `update_shdr` call:\n\n```\nif (ctx.arg.pack_dyn_relocs_android)\n  write_vector(ctx.buf + this->shdr.sh_offset, android_encoded);\n```\n\nNothing checks that `android_encoded.size() == this->shdr.sh_size`. The APS2 encoder\nis size-unstable (SLEB128 deltas), and the convergence hack in `update_shdr` only\npads when the encoding *shrinks* - if the last `update_shdr` (`main.cc` calls\n`ctx.reldyn->update_shdr(ctx)` once more after the layout is frozen) produces a\n*larger* stream, `sh_size` is silently increased after file offsets have been\nassigned, and `copy_buf` writes past the space reserved for `.rela.dyn`, corrupting\nthe following section or, if `.rela.dyn` is last, running past the end of the output\nmmap. `DynamicSection::copy_buf` guards the analogous situation with an `assert`;\nthis one does not.","fix":"Clamp and verify: in `update_shdr` never let `sh_size` grow once the layout is frozen (pad/truncate to the previous size the same way `keep_android_size` handles shrinking), and add `assert(android_encoded.size() == this->shdr.sh_size);` at the top of `copy_buf` (plus a `Fatal` in release builds).","locations":[{"ref":"src/output-chunks.cc:477-493","code":"  477 |   if (ctx.arg.pack_dyn_relocs_android) {\n  478 |     relocs.resize(num_relocs - num_relrs);\n  479 |     write_relocs(ctx, relocs.data());\n  480 | \n  481 |     // APS2 uses SLEB128-encoded deltas, so .rela.dyn size may oscillate\n  482 |     // as addresses move. If a shrink is followed by a growth, stop\n  483 |     // shrinking and pad the encoded stream to converge.\n  484 |     android_encoded = encode_android<E>(relocs);\n  485 |     i64 old_size = this->shdr.sh_size;\n  486 |     if (old_size != 0 && old_size < (i64)android_encoded.size())\n  487 |       keep_android_size = true;\n  488 |     if (keep_android_size && android_encoded.size() < old_size)\n  489 |       android_encoded.resize(old_size);\n  490 |     this->shdr.sh_size = android_encoded.size();\n  491 |   } else {\n  492 |     this->shdr.sh_size = (num_relocs - num_relrs) * sizeof(ElfRel<E>);\n  493 |   }","lines":17,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L477-L493"},{"ref":"src/output-chunks.cc:497-503","code":"  497 | template <typename E>\n  498 | void RelDynSection<E>::copy_buf(Context<E> &ctx) {\n  499 |   if (ctx.arg.pack_dyn_relocs_android)\n  500 |     write_vector(ctx.buf + this->shdr.sh_offset, android_encoded);\n  501 |   else\n  502 |     write_relocs(ctx, (ElfRel<E> *)(ctx.buf + this->shdr.sh_offset));\n  503 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L497-L503"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`MemoryMappedOutputFile`'s constructor registers the temporary file with the global\ncleanup hook (`mold::output_tmpfile`, unlinked by `cleanup()` from `Fatal` and from\nthe signal handler) only *after* `fchmod` and `ftruncate` have succeeded:\n\n```\nthis->fd = open_or_create_file(ctx, path, tmpfile, perm);   // may have renamed the old output to `tmpfile`\nif (fchmod(...) == -1) Fatal(ctx) << ...;                   // cleanup() sees output_tmpfile == nullptr\nif (ftruncate(this->fd, filesize) == -1) Fatal(ctx) << ...; // same\noutput_tmpfile = (char *)save_string(ctx, tmpfile).data();\n```\n\n`open_or_create_file` renames an existing output file to `.<name>.<pid>` in order to\nreuse it. If `fchmod` or `ftruncate` then fails (a very likely failure: `ftruncate`\nreturns `ENOSPC`/`EFBIG` for large outputs), or if the user hits Ctrl-C in that\nwindow, mold exits without unlinking the temp file. The user is left with **no**\noutput file (it was renamed away) plus a stray hidden `.<name>.<pid>` file. The same\nwindow exists between the successful `rename` inside `open_or_create_file` and the\nreturn of that function.","fix":"Set `output_tmpfile` as soon as the temporary name is known - move `output_tmpfile = (char *)save_string(ctx, tmpfile).data();` to just before the `open_or_create_file` call (or set it inside `open_or_create_file` immediately after a successful `rename`), so every subsequent error path is covered by `cleanup()`.","locations":[{"ref":"src/output-file-unix.cc:28-41","code":"   28 |   // writing to an existing file is much faster than creating a fresh\n   29 |   // file and writing to it.\n   30 |   if (ctx.overwrite_output_file && rename(path.c_str(), tmpfile.c_str()) == 0) {\n   31 |     i64 fd = ::open(tmpfile.c_str(), O_RDWR | O_CREAT, perm);\n   32 |     if (fd != -1)\n   33 |       return fd;\n   34 |     unlink(tmpfile.c_str());\n   35 |   }\n   36 | \n   37 |   i64 fd = ::open(tmpfile.c_str(), O_RDWR | O_CREAT, perm);\n   38 |   if (fd == -1)\n   39 |     Fatal(ctx) << \"cannot open \" << tmpfile << \": \" << errno_string();\n   40 |   return fd;\n   41 | }","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-unix.cc#L28-L41"},{"ref":"src/output-file-unix.cc:51-59","code":"   51 |     this->fd = open_or_create_file(ctx, path, tmpfile, perm);\n   52 | \n   53 |     if (fchmod(this->fd, perm & ~get_umask()) == -1)\n   54 |       Fatal(ctx) << \"fchmod failed: \" << errno_string();\n   55 | \n   56 |     if (ftruncate(this->fd, filesize) == -1)\n   57 |       Fatal(ctx) << \"ftruncate failed: \" << errno_string();\n   58 | \n   59 |     output_tmpfile = (char *)save_string(ctx, tmpfile).data();","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-unix.cc#L51-L59"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The FreeBSD branch of `get_self_path()` ignores both `sysctl()` return values and treats the\nreturned `size` as a string length. `KERN_PROC_PATHNAME` reports the size *including* the\nterminating NUL, so `path.resize(size)` leaves an embedded `'\\0'` as the last character of the\nreturned `std::string`. Every consumer that concatenates or compares this path (e.g. building a\n`-plugin` path or re-exec argv) sees a stray NUL. If either `sysctl()` call fails, the function\nsilently returns an uninitialized/empty path instead of reporting the error.\n\nThe Apple/Windows branch also writes its diagnostic without a trailing newline\n(`\"mold: get_self_path is not supported\"`).","fix":"```cpp\n  size_t size = 0;\n  if (sysctl(mib, 4, NULL, &size, NULL, 0) < 0)\n    Fatal(...) << \"sysctl(KERN_PROC_PATHNAME) failed: \" << errno_string();\n\n  std::string path(size, '\\0');\n  if (sysctl(mib, 4, path.data(), &size, NULL, 0) < 0)\n    Fatal(...) << \"sysctl(KERN_PROC_PATHNAME) failed: \" << errno_string();\n\n  path.resize(strnlen(path.data(), size));  // drop the trailing NUL\n  return path;\n```","locations":[{"ref":"lib/filepath.cc:21-39","code":"   21 | #elif __FreeBSD__\n   22 |   // /proc may not be mounted on FreeBSD. The proper way to get the\n   23 |   // current executable's path is to use sysctl(2).\n   24 |   int mib[4];\n   25 |   mib[0] = CTL_KERN;\n   26 |   mib[1] = KERN_PROC;\n   27 |   mib[2] = KERN_PROC_PATHNAME;\n   28 |   mib[3] = -1;\n   29 | \n   30 |   size_t size;\n   31 |   sysctl(mib, 4, NULL, &size, NULL, 0);\n   32 | \n   33 |   std::string path;\n   34 |   path.resize(size);\n   35 |   sysctl(mib, 4, path.data(), &size, NULL, 0);\n   36 |   return path;\n   37 | #else\n   38 |   return std::filesystem::read_symlink(\"/proc/self/exe\").string();\n   39 | #endif","lines":19,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/filepath.cc#L21-L39"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`get_usage()` declares `struct rusage ru;` uninitialized and ignores `getrusage()`'s return value\n(likewise `GetProcessTimes()` on Windows). If the call fails, `ru.ru_utime` / `ru.ru_stime` are\nread uninitialized — undefined behaviour, and the `--perf` report prints garbage user/system times.","fix":"Before:\n```cpp\n  struct rusage ru;\n  getrusage(RUSAGE_SELF, &ru);\n  return {to_nsec(ru.ru_utime), to_nsec(ru.ru_stime)};\n```\n\nAfter:\n```cpp\n  struct rusage ru = {};\n  if (getrusage(RUSAGE_SELF, &ru) < 0)\n    return {0, 0};\n  return {to_nsec(ru.ru_utime), to_nsec(ru.ru_stime)};\n```","locations":[{"ref":"lib/perf.cc:33-51","code":"   33 | static std::pair<i64, i64> get_usage() {\n   34 | #ifdef _WIN32\n   35 |   auto to_nsec = [](FILETIME t) -> i64 {\n   36 |     return (((u64)t.dwHighDateTime << 32) + (u64)t.dwLowDateTime) * 100;\n   37 |   };\n   38 | \n   39 |   FILETIME creation, exit, kernel, user;\n   40 |   GetProcessTimes(GetCurrentProcess(), &creation, &exit, &kernel, &user);\n   41 |   return {to_nsec(user), to_nsec(kernel)};\n   42 | #else\n   43 |   auto to_nsec = [](struct timeval t) -> i64 {\n   44 |     return (i64)t.tv_sec * 1'000'000'000 + t.tv_usec * 1'000;\n   45 |   };\n   46 | \n   47 |   struct rusage ru;\n   48 |   getrusage(RUSAGE_SELF, &ru);\n   49 |   return {to_nsec(ru.ru_utime), to_nsec(ru.ru_stime)};\n   50 | #endif\n   51 | }","lines":19,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/perf.cc#L33-L51"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`scan_relocations` in the SH-4 backend reports an unknown relocation type with `Fatal`,\nwhich calls `_exit(1)` immediately (`src/error.cc:18-21`). Every other backend uses `Error`\nhere (`src/arch-riscv.cc:856`, `src/arch-m68k.cc:315`, `src/arch-s390x.cc:490`, ...), which\nrecords the failure and lets mold keep scanning so that the user sees every problem in one\nrun and so that `--noinhibit-exec` behaves as documented.","fix":"```\n     default:\n-      Fatal(ctx) << *this << \": unknown relocation: \" << rel;\n+      Error(ctx) << *this << \": unknown relocation: \" << rel;\n```","locations":[{"ref":"src/arch-sh4.cc:373-375","code":"  373 |     default:\n  374 |       Fatal(ctx) << *this << \": unknown relocation: \" << rel;\n  375 |     }","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-sh4.cc#L373-L375"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the `R_X86_64_GOTTPOFF`/`R_X86_64_CODE_4_GOTTPOFF` relaxation path the result of\n`relax_gottpoff` is used without checking it for 0, unlike the two TLSDESC paths 40 lines\nbelow which `Fatal` with \"illegal instruction sequence\". If the instruction pattern is not\nrecognised, `insn` is 0 and the code silently writes three zero bytes\n(`add %al, (%rax)` ...) over the instruction prefix, producing a corrupt binary instead of a\ndiagnostic. Today this is unreachable because `scan_relocations` only skips GOT allocation\nwhen the same call returned non-zero, but the invariant is implicit and unenforced.","fix":"Mirror the TLSDESC handling:\n```\n         u32 insn = relax_gottpoff(loc, rel);\n+        if (!insn)\n+          Fatal(ctx) << *this << \": illegal instruction sequence for \" << rel;\n         loc[-3] = insn >> 16;\n```","locations":[{"ref":"src/arch-x86-64.cc:578-589","code":"  578 |     case R_X86_64_GOTTPOFF:\n  579 |     case R_X86_64_CODE_4_GOTTPOFF:\n  580 |       if (sym.has_gottp(ctx)) {\n  581 |         write32s(sym.get_gottp_addr(ctx) + A - P);\n  582 |       } else {\n  583 |         u32 insn = relax_gottpoff(loc, rel);\n  584 |         loc[-3] = insn >> 16;\n  585 |         loc[-2] = insn >> 8;\n  586 |         loc[-1] = insn;\n  587 |         write32s(S - ctx.tp_addr);\n  588 |       }\n  589 |       break;","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-x86-64.cc#L578-L589"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`read_archive_members` uses `assert(str.starts_with(\"!<thin>\\n\"))` to validate the magic. In\nrelease builds (`NDEBUG`) the assert vanishes and any file that merely reached this function\nwithout the `!<arch>\\n` magic is parsed as a thin archive starting 8 bytes in, i.e. random\nbytes are interpreted as `ArHdr`s.","fix":"```\n-  assert(str.starts_with(\"!<thin>\\n\"));\n+  if (!str.starts_with(\"!<thin>\\n\"))\n+    Fatal(ctx) << mf->name << \": not an archive file\";\n```","locations":[{"ref":"src/archive-file.cc:180-190","code":"  180 | template <typename E>\n  181 | std::vector<MappedFile *>\n  182 | read_archive_members(Context<E> &ctx, MappedFile *mf) {\n  183 |   std::string_view str = mf->get_contents();\n  184 | \n  185 |   if (str.starts_with(\"!<arch>\\n\"))\n  186 |     return read_fat_archive_members(ctx, mf);\n  187 | \n  188 |   assert(str.starts_with(\"!<thin>\\n\"));\n  189 |   return read_thin_archive_members(ctx, mf);\n  190 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/archive-file.cc#L180-L190"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Fatal<E>::~Fatal` calls `_exit(1)`, which bypasses the C++ runtime and does not\nflush `std::cout`. `--print-gc-sections` and `--print-icf-sections` write their\nreports to `std::cout` (which is fully buffered when redirected to a file or a\npipe), so a fatal error raised after those passes silently discards the report\nthat was already \"printed\". `out.emit()` only takes care of this object's own\n`std::cerr` output.","fix":"Flush `std::cout` before exiting:\n```cpp\ntemplate <typename E>\n[[noreturn]] Fatal<E>::~Fatal() {\n  out.emit();\n  std::cout.flush();\n  cleanup();\n  _exit(1);\n}\n```","locations":[{"ref":"src/error.cc:17-22","code":"   17 | template <typename E>\n   18 | [[noreturn]] Fatal<E>::~Fatal() {\n   19 |   out.emit();\n   20 |   cleanup();\n   21 |   _exit(1);\n   22 | }","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/error.cc#L17-L22"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"If `lockf()` fails, `acquire_global_lock()` returns without closing `fd`, so the\ndescriptor leaks for the entire link. More importantly, the failure is silently\nignored: mold continues without the lock even though the user asked for\n`MOLD_JOBS=1`, so the memory-limiting behaviour silently stops working.","fix":"```c++\n-  if (lockf(fd, F_LOCK, 0) == -1)\n-    return;\n+  if (lockf(fd, F_LOCK, 0) == -1) {\n+    close(fd);\n+    return;\n+  }\n```","locations":[{"ref":"src/jobs-unix.cc:36-43","code":"   36 |   int fd = open(path.c_str(), O_WRONLY | O_CREAT | O_CLOEXEC, 0600);\n   37 |   if (fd == -1)\n   38 |     return;\n   39 | \n   40 |   if (lockf(fd, F_LOCK, 0) == -1)\n   41 |     return;\n   42 |   lock_fd = fd;\n   43 | }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/jobs-unix.cc#L36-L43"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"When `--relocatable` is combined with LTO, `mold_main()` runs `do_lto()` and\nthen returns from `combine_objects()` at line 440-443, skipping the\n`lto_cleanup(ctx)` call at line 756. `cleanup_hook()` is what deletes the\ntemporary ELF files the LTO backend wrote to disk, so `mold -r -flto` leaves\ntemporary files behind on every link.","fix":"Call `lto_cleanup(ctx)` before the early return:\n```c++\nif (ctx.arg.relocatable) {\n  combine_objects(ctx);\n  if (!ctx.arg.plugin.empty())\n    lto_cleanup(ctx);\n  return 0;\n}\n```","locations":[{"ref":"src/main.cc:491-497","code":"  491 |   // Handle --relocatable. Since the linker's behavior is quite different\n  492 |   // from the normal one when the option is given, the logic is implemented\n  493 |   // to a separate file.\n  494 |   if (ctx.arg.relocatable) {\n  495 |     combine_objects(ctx);\n  496 |     return 0;\n  497 |   }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/main.cc#L491-L497"},{"ref":"src/main.cc:824-825","code":"  824 |   if (!ctx.arg.plugin.empty())\n  825 |     lto_cleanup(ctx);","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/main.cc#L824-L825"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`print_map()` reports a failure to open the map file with `errno_string()`.\n`std::ofstream::open()` is not required to set `errno` (and on libstdc++ it\noften leaves a stale value from an unrelated call), so the message frequently\nsays something like \"Success\" or names an unrelated error. The same applies to\nthe mapped-file Win32 paths.","fix":"Open with `std::filesystem`/`::open` and report the real error, or at minimum\nset `errno = 0;` immediately before `file.open(...)` so a stale value is not\nreported.","locations":[{"ref":"src/mapfile.cc:49-55","code":"   49 |   if (!ctx.arg.Map.empty() && ctx.arg.Map != \"-\") {\n   50 |     file.open(ctx.arg.Map);\n   51 |     if (file.fail())\n   52 |       Fatal(ctx) << \"--print-map: cannot open \" << ctx.arg.Map << \": \"\n   53 |                  << errno_string();\n   54 |     out = &file;\n   55 |   }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mapfile.cc#L49-L55"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`DynstrSection<E>::find_string` relies on an `assert` to validate its lookup:\n\n```\nauto it = strings.find(str);\nassert(it != strings.end());\nreturn it->second;\n```\n\nIn a release build (`NDEBUG`) a missing string dereferences the end iterator, i.e.\nundefined behaviour, instead of reporting an internal error. `create_dynamic_section`\ncalls it for every `DT_NEEDED`, `DT_RPATH`, `DT_SONAME`, `DT_AUDIT`, `DT_FILTER` and\n`DT_AUXILIARY` value, so any future path that emits a dynamic tag whose string was\nnever added via `add_string` turns into a silent memory error.","fix":"Replace the assert with a hard check, e.g. `if (it == strings.end()) Fatal(ctx) << \"internal error: .dynstr entry not found: \" << str;` (the function needs a `Context` parameter for that, or use `unreachable()` which is active in release builds).","locations":[{"ref":"src/output-chunks.cc:594-599","code":"  594 | template <typename E>\n  595 | i64 DynstrSection<E>::find_string(std::string_view str) {\n  596 |   auto it = strings.find(str);\n  597 |   assert(it != strings.end());\n  598 |   return it->second;\n  599 | }","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L594-L599"}]},
{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`LockingOutputFile`'s constructor ignores the result of `flock()` and of the `write()`\nthat is supposed to make a stale debug file unusable:\n\n```\nflock(this->fd, LOCK_EX);\nu8 buf[256] = {};\n(void)!!write(this->fd, buf, sizeof(buf));\n```\n\nIf `flock` fails (`EINTR`, `ENOLCK`, or a filesystem without lock support such as\nsome NFS mounts) mold proceeds without holding the lock, which is exactly the\nscenario this class exists to prevent - two concurrent links can then write the same\n`--separate-debug-file` simultaneously. A short or failed `write` likewise leaves the\nold, now-invalid debug file looking usable to gdb.","fix":"Check both calls, e.g. `if (flock(this->fd, LOCK_EX) == -1) Fatal(ctx) << path << \": flock failed: \" << errno_string();` and treat a `write` returning anything other than `sizeof(buf)` as a fatal error.","locations":[{"ref":"src/output-file-unix.cc:195-209","code":"  195 | template <typename E>\n  196 | LockingOutputFile<E>::LockingOutputFile(Context<E> &ctx, std::string path,\n  197 |                                         int perm)\n  198 |   : OutputFile<E>(path, 0, true) {\n  199 |   this->fd = ::open(path.c_str(), O_RDWR | O_CREAT, perm);\n  200 |   if (this->fd == -1)\n  201 |     Fatal(ctx) << \"cannot open \" << path << \": \" << errno_string();\n  202 |   flock(this->fd, LOCK_EX);\n  203 | \n  204 |   // We may be overwriting to an existing debug info file. We want to\n  205 |   // make the file unusable so that gdb won't use it by accident until\n  206 |   // it's ready.\n  207 |   u8 buf[256] = {};\n  208 |   (void)!!write(this->fd, buf, sizeof(buf));\n  209 | }","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-unix.cc#L195-L209"}]},
{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`report_undef_errors()` iterates `ctx.undef_errors`, which is a\n`tbb::concurrent_hash_map<Symbol<E> *, std::vector<std::string>>`. Iteration\norder of a concurrent hash map keyed by *pointer values* is unspecified and\nvaries between runs (ASLR, allocation order, thread interleaving), and the\nper-symbol `std::vector<std::string>` is filled concurrently, so the \"first\nMAX_ERRORS\" references reported for a symbol are also arbitrary. Users\ndiffing linker output across builds see spurious changes, and the truncation\nmessage can point at different call sites each time.","fix":"Copy the map into a `std::vector`, sort it by symbol name (and sort each symbol's message list) before printing, so that the diagnostics are reproducible.","locations":[{"ref":"src/passes.cc:2067-2100","code":" 2067 | template <typename E>\n 2068 | void report_undef_errors(Context<E> &ctx) {\n 2069 |   constexpr i64 MAX_ERRORS = 3;\n 2070 | \n 2071 |   if (ctx.arg.unresolved_symbols == UNRESOLVED_IGNORE)\n 2072 |     return;\n 2073 | \n 2074 |   for (auto &pair : ctx.undef_errors) {\n 2075 |     Symbol<E> *sym = pair.first;\n 2076 |     std::span<std::string> errors = pair.second;\n 2077 | \n 2078 |     std::stringstream ss;\n 2079 |     ss << \"undefined symbol: \"\n 2080 |        << (ctx.arg.demangle ? demangle(*sym) : sym->name())\n 2081 |        << \"\\n\";\n 2082 | \n 2083 |     for (i64 i = 0; i < errors.size() && i < MAX_ERRORS; i++)\n 2084 |       ss << errors[i];\n 2085 | \n 2086 |     if (MAX_ERRORS < errors.size())\n 2087 |       ss << \">>> referenced \" << (errors.size() - MAX_ERRORS) << \" more times\\n\";\n 2088 | \n 2089 |     // Remove the trailing '\\n' because Error/Warn adds it automatically\n 2090 |     std::string msg = ss.str();\n 2091 |     msg.pop_back();\n 2092 | \n 2093 |     if (ctx.arg.unresolved_symbols == UNRESOLVED_ERROR)\n 2094 |       Error(ctx) << msg;\n 2095 |     else\n 2096 |       Warn(ctx) << msg;\n 2097 |   }\n 2098 | \n 2099 |   ctx.checkpoint();\n 2100 | }","lines":34,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L2067-L2100"}]},
{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Two unchecked I/O results in the fork/notify handshake:\n\n* `fork_child()`: `if (read(pipefd[0], buf, 1) == 1) _exit(0);` - a `read`\n  interrupted by a signal returns `-1`/`EINTR`, after which the parent falls\n  through to `waitpid()` and blocks until the child finishes, silently\n  defeating the whole \"hide exit latency\" optimization.\n* `notify_parent()`: the `write()` result is only checked by\n  `assert(n == 1)`, which is compiled out in release builds\n  (`-DNDEBUG`); a failed notification is then completely silent.","fix":"Retry the `read`/`write` on `EINTR` in a loop, and handle a genuine failure explicitly (e.g. fall back to `waitpid()` on read failure; report or ignore a `write` failure deliberately with a comment instead of relying on `assert`).","locations":[{"ref":"src/subprocess-unix.cc:37-48","code":"   37 |     char buf[1];\n   38 |     if (read(pipefd[0], buf, 1) == 1)\n   39 |       _exit(0);\n   40 | \n   41 |     int status;\n   42 |     waitpid(pid, &status, 0);\n   43 | \n   44 |     if (WIFEXITED(status))\n   45 |       _exit(WEXITSTATUS(status));\n   46 |     if (WIFSIGNALED(status))\n   47 |       raise(WTERMSIG(status));\n   48 |     _exit(1);","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/subprocess-unix.cc#L37-L48"},{"ref":"src/subprocess-unix.cc:56-65","code":"   56 | template <typename E>\n   57 | void notify_parent() {\n   58 |   if (pipe_write_fd == -1)\n   59 |     return;\n   60 | \n   61 |   char buf[] = {1};\n   62 |   [[maybe_unused]] int n = write(pipe_write_fd, buf, 1);\n   63 |   assert(n == 1);\n   64 |   pipe_write_fd = -1;\n   65 | }","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/subprocess-unix.cc#L56-L65"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`TarWriter::open()` opens the archive with `fopen(output_path.c_str(), \"w\")` — text mode. This file\nalready has Windows-specific code (`#define ftruncate _chsize_s`), and on Windows text mode\ntranslates every `0x0A` byte written to `0x0D 0x0A`. `TarWriter::append()` writes raw binary input\nfiles into the archive, so every `--repro` tarball produced on Windows is corrupted, and the\n`ftell()`-based 512-byte block alignment is thrown off as well.","fix":"Before:\n```cpp\n  FILE *out = fopen(output_path.c_str(), \"w\");\n```\n\nAfter:\n```cpp\n  FILE *out = fopen(output_path.c_str(), \"wb\");\n```","locations":[{"ref":"lib/tar.cc:72-78","code":"   72 | std::unique_ptr<TarWriter>\n   73 | TarWriter::open(std::string output_path, std::string basedir) {\n   74 |   FILE *out = fopen(output_path.c_str(), \"w\");\n   75 |   if (!out)\n   76 |     return nullptr;\n   77 |   return std::unique_ptr<TarWriter>(new TarWriter(out, basedir));\n   78 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/tar.cc#L72-L78"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"On Windows the output file size is passed to `CreateFileMapping` in the *low* dword\nparameter only, with 0 for the high dword:\n\n```\nHANDLE map = CreateFileMapping(handle, nullptr, PAGE_READWRITE, 0, filesize, nullptr);\n```\n\n`filesize` is an `i64` and gets truncated to a `DWORD`, so any output of 4 GiB or\nmore creates a mapping object of `filesize % 2^32` bytes. The subsequent\n`MapViewOfFile(map, FILE_MAP_WRITE, 0, 0, filesize)` (whose size parameter is a\n64-bit `SIZE_T`) then fails, and mold dies with a misleading\n`MapViewOfFile failed` message. The same truncation exists in `extend()`.","fix":"Split the size: `CreateFileMapping(handle, nullptr, PAGE_READWRITE, (DWORD)((u64)filesize >> 32), (DWORD)((u64)filesize & 0xffffffff), nullptr)` in both the constructor and `extend()`.","locations":[{"ref":"src/output-file-win32.cc:22-27","code":"   22 |     HANDLE map = CreateFileMapping(handle, nullptr, PAGE_READWRITE, 0,\n   23 |                                    filesize, nullptr);\n   24 |     if (!map)\n   25 |       Fatal(ctx) << path << \": CreateFileMapping failed: \" << GetLastError();\n   26 | \n   27 |     this->buf = (u8 *)MapViewOfFile(map, FILE_MAP_WRITE, 0, 0, filesize);","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-win32.cc#L22-L27"},{"ref":"src/output-file-win32.cc:45-52","code":"   45 |     HANDLE map = CreateFileMapping(handle, nullptr, PAGE_READWRITE, 0,\n   46 |                                    this->filesize + size, nullptr);\n   47 |     if (!map)\n   48 |       Fatal(ctx) << this->path << \": CreateFileMapping failed: \"\n   49 |                  << GetLastError();\n   50 | \n   51 |     this->buf = (u8 *)MapViewOfFile(map, FILE_MAP_WRITE, 0, 0,\n   52 |                                     this->filesize + size);","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-win32.cc#L45-L52"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`sighandler()` is installed for `SIGSEGV`, `SIGBUS` and `SIGABRT` but is not\nasync-signal-safe. It takes a `std::mutex` (`pthread_mutex_lock` is not in the\nPOSIX list of async-signal-safe functions) as its very first action, and it\nreads `std::string sigabrt_msg`. If the crashing thread is interrupted inside\nthe C++/pthread runtime, or if a second thread faults while the first holds\nthe lock, the handler can deadlock instead of printing the \"Disk full?\"\nmessage - exactly the diagnostic path this handler exists for. The handler\nalso clobbers `errno` (via `write`) without saving/restoring it.","fix":"Drop the mutex and use an `std::atomic_flag`/`__atomic_test_and_set` to let only the first faulting thread print (others spin or immediately `_exit`). Precompute `sigabrt_msg` into a plain `static char[]` buffer at startup, save/restore `errno` around the handler body, and keep the body to `write()`, `unlink()`, `signal()` and `raise()` only.","locations":[{"ref":"src/signal-unix.cc:37-64","code":"   37 | static void sighandler(int signo, siginfo_t *info, void *ucontext) {\n   38 |   static std::mutex mu;\n   39 |   std::scoped_lock lock{mu};\n   40 | \n   41 |   // Handle disk full error\n   42 |   switch (signo) {\n   43 |   case SIGSEGV:\n   44 |   case SIGBUS:\n   45 |     if (output_buffer_start <= info->si_addr &&\n   46 |         info->si_addr < output_buffer_end) {\n   47 |       const char msg[] = \"mold: failed to write to an output file. Disk full?\\n\";\n   48 |       (void)!write(STDERR_FILENO, msg, sizeof(msg) - 1);\n   49 |     }\n   50 |     break;\n   51 |   case SIGABRT: {\n   52 |     (void)!write(STDERR_FILENO, &sigabrt_msg[0], sigabrt_msg.size());\n   53 |     break;\n   54 |   }\n   55 |   }\n   56 | \n   57 |   // Re-throw the signal\n   58 |   signal(SIGSEGV, SIG_DFL);\n   59 |   signal(SIGBUS, SIG_DFL);\n   60 |   signal(SIGABRT, SIG_DFL);\n   61 | \n   62 |   cleanup();\n   63 |   raise(signo);\n   64 | }","lines":28,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/signal-unix.cc#L37-L64"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`fork_child()` creates the synchronization pipe with plain `pipe(2)`, so\nneither end has `FD_CLOEXEC`. The child (which does the actual linking) keeps\n`pipefd[1]` open and later `exec`s other programs - the LTO plugin toolchain,\nand `mold -run`'s `execv`/`execvp` in the same directory - which inherit the\nwrite end. The parent blocks in `read(pipefd[0], buf, 1)` until either a byte\narrives or *all* write ends are closed, so a long-lived grandchild keeps the\nparent (i.e. the process the build system waits on) alive after the linker\nitself has exited. The parent also never closes `pipefd[0]`.","fix":"Use `pipe2(pipefd, O_CLOEXEC)` (falling back to `pipe` + `fcntl(FD_CLOEXEC)` where `pipe2` is unavailable); the child clears the flag only if it really needs to pass the fd on. Close `pipefd[0]` in the parent after the read.","locations":[{"ref":"src/subprocess-unix.cc:19-54","code":"   19 | template <typename E>\n   20 | void fork_child() {\n   21 |   int pipefd[2];\n   22 |   if (pipe(pipefd) == -1) {\n   23 |     perror(\"pipe\");\n   24 |     exit(1);\n   25 |   }\n   26 | \n   27 |   pid_t pid = fork();\n   28 |   if (pid == -1) {\n   29 |     perror(\"fork\");\n   30 |     exit(1);\n   31 |   }\n   32 | \n   33 |   if (pid > 0) {\n   34 |     // Parent\n   35 |     close(pipefd[1]);\n   36 | \n   37 |     char buf[1];\n   38 |     if (read(pipefd[0], buf, 1) == 1)\n   39 |       _exit(0);\n   40 | \n   41 |     int status;\n   42 |     waitpid(pid, &status, 0);\n   43 | \n   44 |     if (WIFEXITED(status))\n   45 |       _exit(WEXITSTATUS(status));\n   46 |     if (WIFSIGNALED(status))\n   47 |       raise(WTERMSIG(status));\n   48 |     _exit(1);\n   49 |   }\n   50 | \n   51 |   // Child\n   52 |   close(pipefd[0]);\n   53 |   pipe_write_fd = pipefd[1];\n   54 | }","lines":36,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/subprocess-unix.cc#L19-L54"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`lib/siphash.h` has no `#pragma once` and no include guard, even though its own header comment\ntells users to \"just copy this header file into your project and #include it\". Including it from\ntwo translation-unit-shared headers, or twice in one TU, is an immediate redefinition error for\n`SipHashTmpl` and the four `using` aliases. Every other header in the project (`lib/lib.h`,\n`lib/atomics.h`, `lib/integers.h`, `src/mold.h`) has `#pragma once`.\n\nRelated: `SipHashTmpl::hash()` takes the message length as `int inlen` while `update()` takes\n`int64_t msglen`, so the convenience wrapper silently truncates messages larger than 2 GiB.","fix":"Add `#pragma once` immediately after the header comment:\n\n```cpp\n// https://github.com/rui314/siphash/blob/main/siphash.h\n\n#pragma once\n\n#include <bit>\n```\n\nand change `static void hash(void *out, void *key, void *in, int inlen)` to take `int64_t inlen`.","locations":[{"ref":"lib/siphash.h:1-9","code":"    1 | // This is a header-only C++20 implementation of SipHash based on the\n    2 | // reference implementation. To use, just copy this header file into\n    3 | // your project and #include it.\n    4 | //\n    5 | // https://github.com/rui314/siphash/blob/main/siphash.h\n    6 | \n    7 | #include <bit>\n    8 | #include <cstdint>\n    9 | #include <cstring>","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/siphash.h#L1-L9"},{"ref":"lib/siphash.h:74-78","code":"   74 |   static void hash(void *out, void *key, void *in, int inlen) {\n   75 |     SipHashTmpl<C_ROUNDS, D_ROUNDS, OUTLEN> h(key);\n   76 |     h.update(in, inlen);\n   77 |     h.finish(out);\n   78 |   }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/siphash.h#L74-L78"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`is_text_file` passes a plain `char` to `isprint`. `<cctype>` functions are\ndefined only for values representable as `unsigned char` or `EOF`; passing a\nnegative `char` (any byte >= 0x80 on a platform with signed `char`, which is\nevery mainstream one) is undefined behaviour and in practice indexes the ctype\ntable out of bounds. The function is called on arbitrary untrusted input bytes.","fix":"Cast to `unsigned char`:\n```cpp\nauto istext = [](char c) {\n  return isprint((unsigned char)c) || c == '\\n' || c == '\\t';\n};\n```","locations":[{"ref":"src/filetype.cc:5-13","code":"    5 | static bool is_text_file(MappedFile *mf) {\n    6 |   auto istext = [](char c) {\n    7 |     return isprint(c) || c == '\\n' || c == '\\t';\n    8 |   };\n    9 | \n   10 |   u8 *data = mf->data;\n   11 |   return mf->size >= 4 && istext(data[0]) && istext(data[1]) &&\n   12 |          istext(data[2]) && istext(data[3]);\n   13 | }","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/filetype.cc#L5-L13"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Two problems with the plugin message/claim protocol:\n\n1. `message()` treats `LDPL_ERROR` exactly like `LDPL_FATAL` and calls `Fatal`,\n   which `_exit(1)`s from inside a plugin callback. The `ld_plugin` API\n   specifies `LDPL_ERROR` as a *recoverable* error: the linker should record it\n   and let the plugin return normally. Killing the process from a callback also\n   leaks whatever temporary files the plugin created (`cleanup_hook` never\n   runs).\n2. `add_symbols()` asserts `phase == 1`, but `run_lto_plugin()` sets\n   `phase = 2` before calling `claim_file_hook()` for GCC offload objects. If\n   the plugin calls `add_symbols()` from that claim, debug builds abort on the\n   assertion.","fix":"Use `Error(ctx) << buf;` for `LDPL_ERROR` and keep `Fatal` only for\n`LDPL_FATAL`. Relax the `add_symbols()` assertion to `phase == 1 || phase == 2`\n(or set `phase = 2` only after the offload claims).","locations":[{"ref":"src/lto-unix.cc:116-140","code":"  116 | template <typename E>\n  117 | static PluginStatus message(PluginLevel level, const char *fmt, ...) {\n  118 |   LOG << \"message\\n\";\n  119 |   Context<E> &ctx = *gctx<E>;\n  120 | \n  121 |   char buf[1000];\n  122 |   va_list ap;\n  123 |   va_start(ap, fmt);\n  124 |   vsnprintf(buf, sizeof(buf), fmt, ap);\n  125 |   va_end(ap);\n  126 | \n  127 |   switch (level) {\n  128 |   case LDPL_INFO:\n  129 |     Out(ctx) << buf;\n  130 |     break;\n  131 |   case LDPL_WARNING:\n  132 |     Warn(ctx) << buf;\n  133 |     break;\n  134 |   case LDPL_ERROR:\n  135 |   case LDPL_FATAL:\n  136 |     Fatal(ctx) << buf;\n  137 |   }\n  138 | \n  139 |   return LDPS_OK;\n  140 | }","lines":25,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/lto-unix.cc#L116-L140"},{"ref":"src/lto-unix.cc:164-170","code":"  164 | static PluginStatus\n  165 | add_symbols(void *handle, int nsyms, const PluginSymbol *psyms) {\n  166 |   LOG << \"add_symbols: \" << nsyms << \"\\n\";\n  167 |   assert(phase == 1);\n  168 |   plugin_symbols = {psyms, psyms + nsyms};\n  169 |   return LDPS_OK;\n  170 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/lto-unix.cc#L164-L170"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Two Win32 API contract issues in `open_file_impl()`:\n\n1. `GetFileSize()` returns `INVALID_FILE_SIZE` (`0xffffffff`) both on error and\n   for a perfectly valid file whose low size dword happens to be `0xffffffff`.\n   The documented way to distinguish them is to call `GetLastError()` and check\n   for `NO_ERROR`. As written, some valid files are rejected.\n2. All Win32 error paths format the message with `errno_string()`, which reports\n   the C `errno`, not `GetLastError()`. The diagnostics are therefore unrelated\n   to the actual failure.","fix":"Use `GetFileSizeEx()` (which has an unambiguous failure indication), and add a\n`win32_error_string()` helper based on `FormatMessage(GetLastError())` for the\nerror strings in this file.","locations":[{"ref":"src/mapped-file-win32.cc:22-50","code":"   22 |   DWORD size_hi;\n   23 |   DWORD size_lo = GetFileSize(fd, &size_hi);\n   24 | \n   25 |   if (size_lo == INVALID_FILE_SIZE) {\n   26 |     error = path + \": GetFileSize failed: \" + errno_string();\n   27 |     return nullptr;\n   28 |   }\n   29 | \n   30 |   u64 size = ((u64)size_hi << 32) + size_lo;\n   31 | \n   32 |   MappedFile *mf = new MappedFile;\n   33 |   mf->name = path;\n   34 |   mf->size = size;\n   35 |   mf->fd = fd;\n   36 | \n   37 |   if (size > 0) {\n   38 |     HANDLE h = CreateFileMapping(fd, nullptr, PAGE_READONLY, 0, size, nullptr);\n   39 |     if (!h) {\n   40 |       error = path + \": CreateFileMapping failed: \" + errno_string();\n   41 |       return nullptr;\n   42 |     }\n   43 | \n   44 |     mf->data = (u8 *)MapViewOfFile(h, FILE_MAP_COPY, 0, 0, size);\n   45 |     CloseHandle(h);\n   46 | \n   47 |     if (!mf->data) {\n   48 |       error = path + \": MapViewOfFile failed: \" + errno_string();\n   49 |       return nullptr;\n   50 |     }","lines":29,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mapped-file-win32.cc#L22-L50"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Every interposed function in `mold-wrapper.c` calls `dlsym(RTLD_NEXT, ...)` and\nuses the result without checking for `NULL`. If the symbol is not found further\ndown the search order (which can happen when the wrapper is preloaded into a\nstatically-linked or unusual binary), the code jumps through a NULL pointer and\nthe *build tool*, not mold, segfaults with no explanation. The documented way to\ncheck `dlsym` for failure is to clear `dlerror()` first and inspect it\nafterwards, since `NULL` is a legal symbol value.","fix":"Wrap the lookups:\n```c\nstatic void *get_real(const char *name) {\n  dlerror();\n  void *p = dlsym(RTLD_NEXT, name);\n  const char *err = dlerror();\n  if (!p || err) {\n    fprintf(stderr, \"mold-wrapper.so: dlsym(%s) failed: %s\\n\", name, err ? err : \"not found\");\n    _exit(1);\n  }\n  return p;\n}\n```\nand use it in all five interposers.","locations":[{"ref":"src/mold-wrapper.c:78-79","code":"   78 |   typeof(execvpe) *real = dlsym(RTLD_NEXT, \"execvp\");\n   79 |   return real(file, argv, environ);","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold-wrapper.c#L78-L79"},{"ref":"src/mold-wrapper.c:86-87","code":"   86 |   typeof(execve) *real = dlsym(RTLD_NEXT, \"execve\");\n   87 |   return real(path, argv, envp);","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold-wrapper.c#L86-L87"},{"ref":"src/mold-wrapper.c:133-134","code":"  133 |   typeof(posix_spawn) *real = dlsym(RTLD_NEXT, \"posix_spawn\");\n  134 |   return real(pid, path, file_actions, attrp, argv, envp);","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold-wrapper.c#L133-L134"},{"ref":"src/mold-wrapper.c:144-145","code":"  144 |   typeof(posix_spawnp) *real = dlsym(RTLD_NEXT, \"posix_spawnp\");\n  145 |   return real(pid, file, file_actions, attrp, argv, envp);","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold-wrapper.c#L144-L145"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`get_umask()` reads the process umask by temporarily setting it to 0:\n\n```\nstatic u32 get_umask() {\n  u32 orig_umask = umask(0);\n  umask(orig_umask);\n  return orig_umask;\n}\n```\n\n`umask` is process-global, and mold is heavily multithreaded (TBB workers are already\nrunning when the output file is opened). Any file created by another thread during\nthat window - `--repro` archives, LTO plugin temporaries, plugin-spawned helpers -\nis created with the raw mode bits, i.e. potentially world-writable. The value is also\nrecomputed on every call instead of being read once.","fix":"Read the umask once at startup (before any worker thread exists) and cache it in a global/`Context`, or use `open(..., perm)` semantics plus `fchmod(fd, perm & ~cached_umask)` with that cached value; on Linux the umask can also be read without modifying it from `/proc/self/status` (`Umask:`).","locations":[{"ref":"src/output-file-unix.cc:17-21","code":"   17 | static u32 get_umask() {\n   18 |   u32 orig_umask = umask(0);\n   19 |   umask(orig_umask);\n   20 |   return orig_umask;\n   21 | }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-unix.cc#L17-L21"},{"ref":"src/output-file-unix.cc:53-54","code":"   53 |     if (fchmod(this->fd, perm & ~get_umask()) == -1)\n   54 |       Fatal(ctx) << \"fchmod failed: \" << errno_string();","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-unix.cc#L53-L54"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`MemoryMappedOutputFile<E>::close` deliberately breaks the atomicity of the final\n`rename`:\n\n```\nfd2 = ::open(this->path.c_str(), O_RDONLY);\nif (fd2 != -1)\n  unlink(this->path.c_str());\nif (rename(output_tmpfile, this->path.c_str()) == -1)\n  Fatal(ctx) << ...;\n```\n\n`rename(2)` already replaces the destination atomically while keeping the old inode\nalive for existing openers, so the `unlink` buys nothing that the retained `fd2`\ndoes not already provide, and it opens a window in which the output path does not\nexist. A concurrent build step (a `make` rule, a running copy of the program being\nrelinked, an `inotify` watcher) can observe `ENOENT` or, worse, pick up the file\nmid-`rename`. If `rename` fails, the previous output has already been destroyed.","fix":"Drop the `unlink` and keep only `fd2 = ::open(path, O_RDONLY);` (holding the old inode open is what defers block release); let `rename` do the atomic replacement.","locations":[{"ref":"src/output-file-unix.cc:138-155","code":"  138 |   void close(Context<E> &ctx) override {\n  139 |     Timer t(ctx, \"close_file\");\n  140 | \n  141 |     if (!this->is_unmapped)\n  142 |       munmap(this->buf, vasize);\n  143 |     ::close(this->fd);\n  144 | \n  145 |     // If an output file already exists, open a file and then remove it.\n  146 |     // This is the fastest way to unlink a file, as it does not make the\n  147 |     // system to immediately release disk blocks occupied by the file.\n  148 |     fd2 = ::open(this->path.c_str(), O_RDONLY);\n  149 |     if (fd2 != -1)\n  150 |       unlink(this->path.c_str());\n  151 | \n  152 |     if (rename(output_tmpfile, this->path.c_str()) == -1)\n  153 |       Fatal(ctx) << this->path << \": rename failed: \" << errno_string();\n  154 |     output_tmpfile = nullptr;\n  155 |   }","lines":18,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-unix.cc#L138-L155"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The `SIGSEGV` handler is installed without `SA_ONSTACK` and no alternate\nsignal stack is set up with `sigaltstack()`. A stack-overflow `SIGSEGV` - the\none case where a handler is most useful - cannot run the handler at all, so\nthe process dies without printing anything and, more importantly, without\nrunning `cleanup()`, leaving the temporary output file\n(`output_tmpfile`) behind. The Win32 counterpart explicitly handles\n`EXCEPTION_STACK_OVERFLOW`, so the platforms behave inconsistently.","fix":"Allocate a `SIGSTKSZ`-sized alternate stack once with `sigaltstack()` and add `SA_ONSTACK` to `action.sa_flags` so the handler can run (and can `unlink` the temporary file) after a stack overflow.","locations":[{"ref":"src/signal-unix.cc:66-85","code":"   66 | void install_signal_handler() {\n   67 |   struct sigaction action;\n   68 |   action.sa_sigaction = sighandler;\n   69 |   sigemptyset(&action.sa_mask);\n   70 |   action.sa_flags = SA_SIGINFO;\n   71 | \n   72 |   sigaction(SIGSEGV, &action, NULL);\n   73 |   sigaction(SIGBUS, &action, NULL);\n   74 | \n   75 |   // OneTBB 2021.9.0 has the interface version 12090.\n   76 |   if (TBB_runtime_interface_version() <= 12090) {\n   77 |     sigabrt_msg = \"mold: aborted\\n\"\n   78 |       \"mold: mold with libtbb version 2021.9.0 or older is known to be unstable \"\n   79 |       \"under heavy load. Your libtbb version is \" +\n   80 |       std::string(TBB_runtime_version()) +\n   81 |       \". Please upgrade your libtbb library and try again.\\n\";\n   82 | \n   83 |     sigaction(SIGABRT, &action, NULL);\n   84 |   }\n   85 | }","lines":20,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/signal-unix.cc#L66-L85"},{"ref":"src/signal-win32.cc:41-45","code":"   41 |   } else if (rec->ExceptionCode == EXCEPTION_STACK_OVERFLOW) {\n   42 |     static const char msg[] =\n   43 |       \"mold: stack overflow\\n\";\n   44 |     (void)!_write(_fileno(stderr), msg, sizeof(msg) - 1);\n   45 |   }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/signal-win32.cc#L41-L45"}]},
{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`install_signal_handler()` declares `struct sigaction action;` without\ninitialization and sets only `sa_sigaction`, `sa_mask` and `sa_flags`. The\nremaining members (`sa_restorer` on glibc, and padding/extra fields on other\nplatforms) are passed to the kernel with indeterminate values. It happens to\nwork on Linux because glibc overwrites `sa_restorer` when `SA_RESTORER` is not\nrequested, but it is undefined behaviour to read uninitialized members and is\na portability hazard.","fix":"Value-initialize the struct:\nbefore `struct sigaction action;`\nafter  `struct sigaction action = {};`","locations":[{"ref":"src/signal-unix.cc:66-73","code":"   66 | void install_signal_handler() {\n   67 |   struct sigaction action;\n   68 |   action.sa_sigaction = sighandler;\n   69 |   sigemptyset(&action.sa_mask);\n   70 |   action.sa_flags = SA_SIGINFO;\n   71 | \n   72 |   sigaction(SIGSEGV, &action, NULL);\n   73 |   sigaction(SIGBUS, &action, NULL);","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/signal-unix.cc#L66-L73"}]},
{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`OutputFile<E>::open` applies `madvise(..., MADV_HUGEPAGE)` to `file->buf`\nunconditionally, but `file` may be a `MallocOutputFile` whose buffer comes from\n`calloc`. `madvise` requires a page-aligned address, so the call fails with `EINVAL`\nfor the malloc'ed case (the return value is ignored, so it is only wasted work), and\nthe comment right above it - \"Enable transparent huge page for an output\nmemory-mapped file\" - does not describe what the code does.","fix":"Guard the call: `if (file->is_mmapped) madvise(file->buf, filesize, MADV_HUGEPAGE);` (the flag already exists on `OutputFile`).","locations":[{"ref":"src/output-file-unix.cc:176-189","code":"  176 |   OutputFile<E> *file;\n  177 |   if (is_special)\n  178 |     file = new MallocOutputFile(ctx, path, filesize, perm);\n  179 |   else\n  180 |     file = new MemoryMappedOutputFile(ctx, path, filesize, perm);\n  181 | \n  182 | #ifdef MADV_HUGEPAGE\n  183 |   // Enable transparent huge page for an output memory-mapped file.\n  184 |   // Linking a Chromium debug build is ~20% faster with this madvise call.\n  185 |   madvise(file->buf, filesize, MADV_HUGEPAGE);\n  186 | #endif\n  187 | \n  188 |   if (ctx.arg.filler != -1)\n  189 |     memset(file->buf, ctx.arg.filler, filesize);","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-unix.cc#L176-L189"}]},
