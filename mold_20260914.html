{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`acquire_global_lock()` dereferences the result of `getpwuid(getuid())` without\na NULL check. `getpwuid()` returns `NULL` when the uid has no passwd entry -\nroutine inside containers, on NSS failures, or for uids created by\n`useradd`-less tooling. With `MOLD_JOBS=1` set and `XDG_RUNTIME_DIR` unset, mold\nthen segfaults instead of linking.","fix":"```c++\n-  else\n-    path = \"/tmp/mold-lock-\"s + getpwuid(getuid())->pw_name;\n+  else if (struct passwd *pw = getpwuid(getuid()))\n+    path = \"/tmp/mold-lock-\"s + pw->pw_name;\n+  else\n+    path = \"/tmp/mold-lock-\"s + std::to_string(getuid());\n```","locations":[{"ref":"src/jobs-unix.cc:30-36","code":"   30 |   std::string path;\n   31 |   if (char *dir = getenv(\"XDG_RUNTIME_DIR\"))\n   32 |     path = dir + \"/mold-lock\"s;\n   33 |   else\n   34 |     path = \"/tmp/mold-lock-\"s + getpwuid(getuid())->pw_name;\n   35 | \n   36 |   int fd = open(path.c_str(), O_WRONLY | O_CREAT | O_CLOEXEC, 0600);","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/jobs-unix.cc#L30-L36"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`InputFile<E>::get_string()` validates only the *end* of a section:\n\n```cpp\nu8 *begin = mf->data + shdr.sh_offset;\nu8 *end = begin + shdr.sh_size;\nif (mf->data + mf->size < end)\n  Fatal(ctx) << ...;\n```\n\n`sh_offset` and `sh_size` are unchecked 64-bit values from the input file.\nForming `mf->data + shdr.sh_offset` is already undefined behaviour when\n`sh_offset` is out of range, and with a large enough `sh_offset` the pointer\narithmetic wraps so that `end` compares less than `mf->data + mf->size` and the\ncheck passes. The function then hands out a `string_view` over unmapped memory.\nThis is the single choke point through which almost every section body is read,\nso it is worth hardening.","fix":"Validate with integer arithmetic before doing pointer arithmetic:\n\n```cpp\nu64 off = shdr.sh_offset, sz = shdr.sh_size;\nif (off > (u64)mf->size || sz > (u64)mf->size - off)\n  Fatal(ctx) << *this << \": section header is out of range: \" << off;\nreturn {(char *)(mf->data + off), (size_t)sz};\n```","locations":[{"ref":"src/mold.h:3643-3651","code":" 3643 | template <typename E>\n 3644 | inline std::string_view\n 3645 | InputFile<E>::get_string(Context<E> &ctx, const ElfShdr<E> &shdr) {\n 3646 |   u8 *begin = mf->data + shdr.sh_offset;\n 3647 |   u8 *end = begin + shdr.sh_size;\n 3648 |   if (mf->data + mf->size < end)\n 3649 |     Fatal(ctx) << *this << \": section header is out of range: \" << shdr.sh_offset;\n 3650 |   return {(char *)begin, (size_t)(end - begin)};\n 3651 | }","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3643-L3651"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`ObjectFile<E>::get_shndx()` dereferences `symtab_shndx_sec` whenever a symbol\nhas `st_shndx == SHN_XINDEX`, but `symtab_shndx_sec` is only populated when the\nobject file actually contains a `SHT_SYMTAB_SHNDX` section\n(`src/input-files.cc:1123-1124`). A malformed object file that sets\n`SHN_XINDEX` without providing the extended index table makes this an\nout-of-bounds read on an empty span. Even when the table exists, its length is\nnever checked against the symbol table length, so a short\n`.symtab_shndx` also reads past the end.","fix":"Bounds-check the extended index table:\n\n```cpp\nif (esym.st_shndx == SHN_XINDEX) {\n  i64 i = &esym - &this->elf_syms[0];\n  if (i >= (i64)symtab_shndx_sec.size())\n    return 0;   // or Fatal(ctx) << *this << \": missing .symtab_shndx\";\n  return symtab_shndx_sec[i];\n}\n```","locations":[{"ref":"src/mold.h:3684-3694","code":" 3684 | template <typename E>\n 3685 | inline i64 ObjectFile<E>::get_shndx(const ElfSym<E> &esym) {\n 3686 |   assert(&this->elf_syms[0] <= &esym);\n 3687 |   assert(&esym <= &this->elf_syms[this->elf_syms.size() - 1]);\n 3688 | \n 3689 |   if (esym.st_shndx == SHN_XINDEX)\n 3690 |     return symtab_shndx_sec[&esym - &this->elf_syms[0]];\n 3691 |   if (esym.st_shndx >= SHN_LORESERVE)\n 3692 |     return 0;\n 3693 |   return esym.st_shndx;\n 3694 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3684-L3694"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Symbol<E>::get_version()` indexes `version_strings` with `ver_idx` and only\nguards against the vector being empty:\n\n```cpp\nstd::span<std::string_view> vers = file->to_dso()->version_strings;\nif (!vers.empty())\n  return vers[ver_idx];\n```\n\n`ver_idx` is copied verbatim from a shared object's `.gnu.version` table\n(`sym.ver_idx = versyms[i];` in `src/input-files.cc:1749`) and is never\nvalidated. Everywhere else the code does check the bound explicitly (see\n`ver < version_strings.size()` at `src/input-files.cc:1580`), so this is an\ninconsistency, not a deliberate invariant. `VerneedSection<E>::construct()`\ncalls `get_version()` for every symbol with `ver_idx > VER_NDX_LAST_RESERVED`,\nso a crafted DSO produces an out-of-bounds `std::string_view` that is then\nwritten into `.dynstr`.","fix":"Add the missing bound check:\n\n```cpp\nif (file->is_dso) {\n  std::span<std::string_view> vers = file->to_dso()->version_strings;\n  if (ver_idx < vers.size())\n    return vers[ver_idx];\n}\nreturn \"\";\n```","locations":[{"ref":"src/mold.h:4098-4106","code":" 4098 | template <typename E>\n 4099 | inline std::string_view Symbol<E>::get_version() const {\n 4100 |   if (file->is_dso) {\n 4101 |     std::span<std::string_view> vers = file->to_dso()->version_strings;\n 4102 |     if (!vers.empty())\n 4103 |       return vers[ver_idx];\n 4104 |   }\n 4105 |   return \"\";\n 4106 | }","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L4098-L4106"}]},
{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`get_init_fini_priority()` and `get_ctor_dtor_priority()` convert the numeric\nsuffix of a section name with `std::stoi(m[1])`. `std::stoi` throws\n`std::out_of_range` when the digit string does not fit in an `int`, and\n`std::invalid_argument` is possible for degenerate matches. mold is compiled\nwith `-fno-exceptions` (see `CMakeLists.txt`), so a throw from libstdc++\nterminates the process via `std::terminate`/`abort` instead of producing a\ndiagnostic. A perfectly legal input section named `.init_array.99999999999`\nor `.ctors.4294967296` therefore crashes the linker with no error message.","fix":"Parse the suffix with `std::from_chars` into an `i64` and clamp/ignore on failure, e.g. `i64 v; if (std::from_chars(begin, end, v).ec != std::errc{}) return 65536; return std::clamp<i64>(v, 0, 65535);`. Never call throwing conversion helpers in a `-fno-exceptions` build.","locations":[{"ref":"src/passes.cc:1461-1469","code":" 1461 | template <typename E>\n 1462 | static i64 get_init_fini_priority(InputSection<E> *isec) {\n 1463 |   static std::regex re(R\"(\\.(\\d+)$)\", std::regex_constants::optimize);\n 1464 |   std::string_view name = isec->name();\n 1465 |   std::cmatch m;\n 1466 |   if (std::regex_search(name.data(), name.data() + name.size(), m, re))\n 1467 |     return std::stoi(m[1]);\n 1468 |   return 65536;\n 1469 | }","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1461-L1469"},{"ref":"src/passes.cc:1486-1490","code":" 1486 |   std::string_view name = isec->name();\n 1487 |   std::cmatch m;\n 1488 |   if (std::regex_search(name.data(), name.data() + name.size(), m, re3))\n 1489 |     return std::stoi(m[1]);\n 1490 |   return -1;","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1486-L1490"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The padding zero-fill at the end of `copy_chunks()` assumes that section file\noffsets increase monotonically:\n\n```\nauto zero = [&](Chunk<E> *chunk, i64 next_start) {\n  i64 pos = chunk->shdr.sh_offset + chunk->shdr.sh_size;\n  memset(ctx.buf + pos, 0, next_start - pos);\n};\n...\nfor (i64 i = 1; i < chunks.size(); i++)\n  zero(chunks[i - 1], chunks[i]->shdr.sh_offset);\n```\n\n`set_file_offsets()` explicitly acknowledges that with `--section-start`\naddresses \"may not increase monotonically\", and it assigns\n`sh_offset = fileoff + sh_addr - first.sh_addr` for every chunk of a run,\nbreaking the run only when `sh_addr < first.sh_addr` (it never compares\nagainst the *previous* chunk). A layout such as `A@0x1000, B@0x5000,\nC@0x2000` therefore yields `offset(C) < offset(B)`, `next_start - pos`\nbecomes negative and is converted to a huge `size_t`, so `memset` runs off\nthe end of the output mapping (heap/mapping corruption or SIGSEGV). The same\nloop also indexes `chunks.back()` without checking that `chunks` is non-empty\nafter `erase_if`.","fix":"Skip or clamp non-monotonic gaps: `if (next_start > pos) memset(ctx.buf + pos, 0, next_start - pos);`, and additionally break the contiguous-offset run in `set_file_offsets()` when `chunks[i]->shdr.sh_addr < chunks[i - 1]->shdr.sh_addr` so file offsets stay ordered. Guard the final `zero(chunks.back(), ...)` with `if (!chunks.empty())`.","locations":[{"ref":"src/passes.cc:2161-2175","code":" 2161 |   // Zero-clear paddings between chunks\n 2162 |   auto zero = [&](Chunk<E> *chunk, i64 next_start) {\n 2163 |     i64 pos = chunk->shdr.sh_offset + chunk->shdr.sh_size;\n 2164 |     memset(ctx.buf + pos, 0, next_start - pos);\n 2165 |   };\n 2166 | \n 2167 |   std::vector<Chunk<E> *> chunks = ctx.chunks;\n 2168 | \n 2169 |   std::erase_if(chunks, [](Chunk<E> *chunk) {\n 2170 |     return chunk->shdr.sh_type == SHT_NOBITS;\n 2171 |   });\n 2172 | \n 2173 |   for (i64 i = 1; i < chunks.size(); i++)\n 2174 |     zero(chunks[i - 1], chunks[i]->shdr.sh_offset);\n 2175 |   zero(chunks.back(), ctx.output_file->filesize);","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L2161-L2175"},{"ref":"src/passes.cc:3128-3157","code":" 3128 |     for (;;) {\n 3129 |       chunks[i]->shdr.sh_offset =\n 3130 |         fileoff + chunks[i]->shdr.sh_addr - first.shdr.sh_addr;\n 3131 |       i++;\n 3132 | \n 3133 |       if (i >= chunks.size() ||\n 3134 |           !(chunks[i]->shdr.sh_flags & SHF_ALLOC) ||\n 3135 |           chunks[i]->shdr.sh_type == SHT_NOBITS)\n 3136 |         break;\n 3137 | \n 3138 |       // If --start-section is given, addresses may not increase\n 3139 |       // monotonically.\n 3140 |       if (chunks[i]->shdr.sh_addr < first.shdr.sh_addr)\n 3141 |         break;\n 3142 | \n 3143 |       // This section requires larger alignment, we need to adjust the\n 3144 |       // offset to ensure offset % align == vaddr % align.\n 3145 |       if (chunks[i]->shdr.sh_addralign > ctx.page_size &&\n 3146 |           chunks[i]->shdr.sh_addralign > chunks[i - 1]->shdr.sh_addralign)\n 3147 |         break;\n 3148 | \n 3149 |       i64 gap_size = chunks[i]->shdr.sh_addr - chunks[i - 1]->shdr.sh_addr -\n 3150 |                      chunks[i - 1]->shdr.sh_size;\n 3151 | \n 3152 |       // If --start-section is given, there may be a large gap between\n 3153 |       // sections. We don't want to allocate a disk space for a gap if\n 3154 |       // exists.\n 3155 |       if (gap_size >= ctx.page_size)\n 3156 |         break;\n 3157 |     }","lines":30,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L3128-L3157"}]},
{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`ZlibCompressor` and `ZlibCompressor::write_to()` index element 0 of vectors that are empty when\nthe input size is zero: `checksum = adlers[0];` with `adlers` sized `inputs.size() == 0`, and\n`offsets[0] = 2;` with `offsets` sized `shards.size() == 0`. On a typical implementation\n`std::vector::data()` is `nullptr` for an empty vector, so both are null-pointer dereferences.\n\nToday the only caller guards with `chunk.shdr.sh_size` (`src/passes.cc:3370`), so this is latent,\nbut nothing in the class's interface documents a non-empty precondition and `ZstdCompressor`\nhandles the empty case correctly, which makes the asymmetry easy to trip over.","fix":"Bail out early on empty input:\n\n```cpp\nZlibCompressor::ZlibCompressor(u8 *buf, i64 size, i64 level) {\n  std::vector<std::span<u8>> inputs = split(std::span(buf, size));\n  compressed_size = 8;\n  if (inputs.empty())\n    return;\n  ...\n}\n\nvoid ZlibCompressor::write_to(u8 *buf) {\n  buf[0] = 0x78;\n  buf[1] = 0x9c;\n  if (!shards.empty()) { ... }\n  ...\n}\n```","locations":[{"ref":"lib/compress.cc:96-117","code":"   96 | ZlibCompressor::ZlibCompressor(u8 *buf, i64 size, i64 level) {\n   97 |   std::vector<std::span<u8>> inputs = split(std::span(buf, size));\n   98 |   std::vector<u32> adlers(inputs.size());\n   99 |   shards.resize(inputs.size());\n  100 | \n  101 |   // Compress each shard\n  102 |   tbb::parallel_for((i64)0, (i64)inputs.size(), [&](i64 i) {\n  103 |     std::span<u8> in = inputs[i];\n  104 |     adlers[i] = adler32(1, in.data(), in.size());\n  105 |     shards[i] = zlib_compress(in, level);\n  106 |   });\n  107 | \n  108 |   // Combine checksums\n  109 |   checksum = adlers[0];\n  110 |   for (i64 i = 1; i < inputs.size(); i++)\n  111 |     checksum = adler32_combine(checksum, adlers[i], inputs[i].size());\n  112 | \n  113 |   // Comput the total size\n  114 |   compressed_size = 8; // the header and the trailer\n  115 |   for (std::span<u8> &shard : shards)\n  116 |     compressed_size += shard.size();\n  117 | }","lines":22,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/compress.cc#L96-L117"},{"ref":"lib/compress.cc:119-132","code":"  119 | void ZlibCompressor::write_to(u8 *buf) {\n  120 |   // Write a zlib-format header\n  121 |   buf[0] = 0x78;\n  122 |   buf[1] = 0x9c;\n  123 | \n  124 |   // Copy compressed data\n  125 |   std::vector<i64> offsets(shards.size());\n  126 |   offsets[0] = 2; // +2 for the header\n  127 |   for (i64 i = 1; i < shards.size(); i++)\n  128 |     offsets[i] = offsets[i - 1] + shards[i - 1].size();\n  129 | \n  130 |   tbb::parallel_for((i64)0, (i64)shards.size(), [&](i64 i) {\n  131 |     memcpy(buf + offsets[i], shards[i].data(), shards[i].size());\n  132 |   });","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/compress.cc#L119-L132"}]},
{"id":"PANIC_36","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`DigestMap::find` has no termination condition other than finding the digest: if\nthe digest is not present (or the round stamp does not match) the `for (;;)`\nloop probes forever, hanging the linker with no diagnostic. The precondition is\ndocumented but not checked, and the loop is also not bounded by the table size.","fix":"Bound the probe to `slots.size()` iterations and `abort()`/`Fatal` with a clear\nmessage if the digest is not found, e.g.\n```cpp\nfor (i64 n = 0, i = digest.hi & mask; n <= (i64)mask; n++, i = (i + 1) & mask)\n  if (slots[i].hi == value && slots[i].lo == digest.lo)\n    return slots[i].leader;\nabort(); // unreachable: digest was inserted in this round\n```","locations":[{"ref":"src/icf.cc:295-302","code":"  295 |   // been inserted in the current round, and no insertion may be running\n  296 |   // concurrently.\n  297 |   InputSection<E> *find(const Digest &digest) {\n  298 |     u64 value = (round << 49) | (digest.hi >> 16);\n  299 |     for (i64 i = digest.hi & mask;; i = (i + 1) & mask)\n  300 |       if (slots[i].hi == value && slots[i].lo == digest.lo)\n  301 |         return slots[i].leader;\n  302 |   }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/icf.cc#L295-L302"}]},
{"id":"PANIC_37","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"A linker script that (directly or transitively) includes itself, e.g.\n`GROUP(./libc.so)` inside `libc.so`, drives unbounded recursion through\n`read_group()` -> `read_file()` -> `Script::parse_linker_script()` ->\n`read_group()`. There is no include-depth limit and no already-visited set, so\nmold overflows its stack and crashes instead of reporting a cyclic include.","fix":"Track a recursion depth (or the set of `MappedFile *`/canonical paths already\nbeing parsed) in `ReaderContext` and `Fatal` with a \"cyclic linker script\ninclude\" message beyond a reasonable limit.","locations":[{"ref":"src/linker-script.cc:209-232","code":"  209 | template <typename E>\n  210 | std::span<std::string_view>\n  211 | Script<E>::read_group(std::span<std::string_view> tok) {\n  212 |   tok = skip(tok, \"(\");\n  213 | \n  214 |   while (!tok.empty() && tok[0] != \")\") {\n  215 |     if (tok[0] == \"AS_NEEDED\") {\n  216 |       bool orig = rctx.as_needed;\n  217 |       rctx.as_needed = true;\n  218 |       tok = read_group(tok.subspan(1));\n  219 |       rctx.as_needed = orig;\n  220 |       continue;\n  221 |     }\n  222 | \n  223 |     MappedFile *mf = resolve_path(tok[0], true);\n  224 |     ReaderContext rctx2 = rctx.next_child();\n  225 |     read_file(ctx, rctx2, mf);\n  226 |     tok = tok.subspan(1);\n  227 |   }\n  228 | \n  229 |   if (tok.empty())\n  230 |     Fatal(ctx) << mf->name << \": expected ')', but got EOF\";\n  231 |   return tok.subspan(1);\n  232 | }","lines":24,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/linker-script.cc#L209-L232"}]},
{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Thunk<E>::size()` returns `offsets.back()`, which is undefined behaviour when\n`offsets` is empty. `remove_redundant_thunks()` (`src/thunks.cc:273-279`) erases\nevery symbol from a thunk whose symbols turned out not to need one and then\nimmediately calls `shrink_size(ctx)` -> `compute_size()` -> `size()` on the\nnow-possibly-empty thunk. The function is also non-`const` for no reason, and\n`shrink_size(Context<E> &ctx)` ignores its `ctx` argument entirely in the\ngeneric definition (only the ARM64 specializations use it).","fix":"```cpp\n-  i64 size() { return offsets.back(); }\n+  i64 size() const { return offsets.empty() ? 0 : offsets.back(); }\n```\n\nand make `compute_size()` guarantee that `offsets` always has at least one\nelement (a trailing total) even for an empty thunk.","locations":[{"ref":"src/mold.h:338-355","code":"  338 | template <needs_thunk E>\n  339 | class Thunk<E> {\n  340 | public:\n  341 |   Thunk(OutputSection<E> &osec, i64 offset)\n  342 |     : output_section(osec), offset(offset) {}\n  343 | \n  344 |   u64 get_addr() const { return output_section.shdr.sh_addr + offset; }\n  345 |   i64 size() { return offsets.back(); }\n  346 |   void compute_size();\n  347 |   void shrink_size(Context<E> &ctx) { compute_size(); }\n  348 |   void copy_buf(Context<E> &ctx);\n  349 | \n  350 |   OutputSection<E> &output_section;\n  351 |   i64 offset;\n  352 |   std::vector<Symbol<E> *> symbols;\n  353 |   std::vector<i64> offsets;\n  354 |   std::string name;\n  355 | };","lines":18,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L338-L355"}]},
{"id":"PANIC_39","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Symbol<E>::esym()` dereferences `file` unconditionally\n(`return file->elf_syms[sym_idx];`), while the neighbouring `name()` explicitly\nguards with `if (!file || sym_idx < 0) return \"\";`. `file` is\n`ArenaPtr<InputFile<E>> file = nullptr` by default, and `sym_idx` defaults to\n`-1`. Several `esym()` callers in this header are reachable for symbols that may\nhave no owning file - `is_remaining_undef_weak()` (called from\n`is_absolute()`), `get_type()` and `is_local()` - so an unresolved or\nplaceholder symbol crashes or reads `elf_syms[-1]`. The inconsistency between\nthe two accessors makes it impossible to tell which invariant actually holds.\n\nSeparately, the function-local `static const ElfSym<E> empty` costs a branch and\na static-storage reference on what is one of the hottest accessors in the\nlinker.","fix":"Make the contract explicit, e.g.\n\n```cpp\ntemplate <typename E>\ninline constexpr ElfSym<E> null_esym = {};\n\ntemplate <typename E>\ninline const ElfSym<E> &Symbol<E>::esym() const {\n  if (!file || sym_idx < 0 || this == discarded_comdat_sym<E>)\n    return null_esym<E>;\n  return file->elf_syms[sym_idx];\n}\n```\n\n(or keep the fast path and add\n`assert(file && sym_idx >= 0)` plus a documented precondition on every caller).","locations":[{"ref":"src/mold.h:4117-4123","code":" 4117 | template <typename E>\n 4118 | inline const ElfSym<E> &Symbol<E>::esym() const {\n 4119 |   static const ElfSym<E> empty = {};\n 4120 |   if (this == discarded_comdat_sym<E>)\n 4121 |     return empty;\n 4122 |   return file->elf_syms[sym_idx];\n 4123 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L4117-L4123"}]},
{"id":"PANIC_40","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"The `.tbss` run-consuming loop in `set_virtual_addresses_regular()` tests\n`i + 2 == chunks.size()` before dereferencing `chunks[i + 1]`:\n\n```\nif (i + 2 == chunks.size() || !is_tbss(chunks[i + 1]))\n  break;\n```\n\nThe bound check is off by one. When `i` is the last valid index\n(`i + 1 == chunks.size()`), the first disjunct is false and\n`is_tbss(chunks[i + 1])` reads one element past the end of the vector.\nIt also stops the run one element early when exactly one chunk follows,\nwhich merely repeats work but shows the intent was `i + 1`.\n`chunks` here is `ctx.chunks`, whose tail is normally a non-`SHF_ALLOC`\nsection, so triggering the out-of-bounds read requires a layout in which a\n`.tbss`-like chunk is last (e.g. `--oformat=binary` after\n`compute_section_headers()` has erased all empty non-`OutputSection` chunks).","fix":"Change the bound test to the number of remaining elements:\nbefore `if (i + 2 == chunks.size() || !is_tbss(chunks[i + 1]))`\nafter  `if (i + 1 == chunks.size() || !is_tbss(chunks[i + 1]))`","locations":[{"ref":"src/passes.cc:3006-3017","code":" 3006 |     if (is_tbss(chunks[i])) {\n 3007 |       u64 addr2 = addr;\n 3008 |       for (;;) {\n 3009 |         addr2 = align_to(addr2, chunks[i]->shdr.sh_addralign);\n 3010 |         chunks[i]->shdr.sh_addr = addr2;\n 3011 |         addr2 += chunks[i]->shdr.sh_size;\n 3012 |         if (i + 2 == chunks.size() || !is_tbss(chunks[i + 1]))\n 3013 |           break;\n 3014 |         i++;\n 3015 |       }\n 3016 |       continue;\n 3017 |     }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L3006-L3017"}]},
{"id":"PANIC_41","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`fix_synthetic_symbols()` builds `sections` from the allocated, non-header\nchunks and then indexes `sections[0]` in five places\n(`__ehdr_start`/`__executable_start`, `__dso_handle`, `_TLS_MODULE_BASE_`,\n`__global_pointer$`, `.TOC.`, and the `--section-order` symbols) without ever\nchecking that the vector is non-empty. `compute_section_headers()` runs just\nbefore and erases every non-`OutputSection` chunk whose size is zero, so a\nlink that produces no allocated output section at all (e.g. `--oformat=binary`\nof inputs with no allocated sections) leaves `sections` empty and\n`sections[0]` is an out-of-bounds read on an empty `std::vector`.","fix":"Return early (or use a null-safe helper) when `sections.empty()`, e.g. `if (sections.empty()) return;` after the vector is built, or replace the raw `sections[0]` uses with a `Chunk<E> *first = sections.empty() ? nullptr : sections[0];` that the `start()`/`stop()` helpers already tolerate.","locations":[{"ref":"src/passes.cc:3300-3326","code":" 3300 |   std::vector<Chunk<E> *> sections;\n 3301 |   for (Chunk<E> *chunk : ctx.chunks)\n 3302 |     if (!chunk->is_header() && (chunk->shdr.sh_flags & SHF_ALLOC))\n 3303 |       sections.push_back(chunk);\n 3304 | \n 3305 |   auto find = [&](std::string name) -> Chunk<E> * {\n 3306 |     for (Chunk<E> *chunk : sections)\n 3307 |       if (chunk->name == name)\n 3308 |         return chunk;\n 3309 |     return nullptr;\n 3310 |   };\n 3311 | \n 3312 |   // __bss_start\n 3313 |   if (Chunk<E> *chunk = find(\".bss\"))\n 3314 |     start(ctx.__bss_start, chunk);\n 3315 | \n 3316 |   if (ctx.ehdr && (ctx.ehdr->shdr.sh_flags & SHF_ALLOC)) {\n 3317 |     ctx.__ehdr_start->set_output_section(sections[0]);\n 3318 |     ctx.__ehdr_start->value = ctx.ehdr->shdr.sh_addr;\n 3319 |     ctx.__executable_start->set_output_section(sections[0]);\n 3320 |     ctx.__executable_start->value = ctx.ehdr->shdr.sh_addr;\n 3321 |   }\n 3322 | \n 3323 |   if (ctx.__dso_handle) {\n 3324 |     ctx.__dso_handle->set_output_section(sections[0]);\n 3325 |     ctx.__dso_handle->value = sections[0]->shdr.sh_addr;\n 3326 |   }","lines":27,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L3300-L3326"},{"ref":"src/passes.cc:3398-3401","code":" 3398 |   if (ctx._TLS_MODULE_BASE_) {\n 3399 |     ctx._TLS_MODULE_BASE_->set_output_section(sections[0]);\n 3400 |     ctx._TLS_MODULE_BASE_->value = ctx.dtp_addr;\n 3401 |   }","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L3398-L3401"},{"ref":"src/passes.cc:3479-3482","code":" 3479 |   // --section-order symbols\n 3480 |   for (SectionOrder &ord : ctx.arg.section_order)\n 3481 |     if (ord.type == SectionOrder::SYMBOL)\n 3482 |       get_symbol(ctx, ord.name)->set_output_section(sections[0]);","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L3479-L3482"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"easy","description":"`execv()` and `execvp()` forward to the wrapper's own `execvpe()` passing the\nglobal `environ` as `envp`. `execvpe()` then does\n`for (int i = 0; envp[i]; i++) putenv(envp[i]);` - i.e. it iterates `environ`\nwhile calling `putenv()`, which is explicitly allowed to reallocate the\n`environ` array. Once glibc grows the array, the `envp` pointer being walked\nrefers to the freed old array and the loop reads freed memory (and may then\n`putenv()` garbage pointers). The aliasing is invisible at the `execvpe()` call\nsite because the alias is created two frames up in `execvp()`.","fix":"Do not re-publish the environment at all - look up the real `execvpe` and pass\n`envp` straight through (see the related `execvpe` finding). If the emulation\nmust be kept, snapshot the list first:\n```c\nint n = 0; while (envp[n]) n++;\nchar **copy = malloc((n + 1) * sizeof(char *));\nfor (int i = 0; i < n; i++) copy[i] = strdup(envp[i]);\nfor (int i = 0; i < n; i++) putenv(copy[i]);\n```","locations":[{"ref":"src/mold-wrapper.c:69-80","code":"   69 | int execvpe(const char *file, char *const *argv, char *const *envp) {\n   70 |   debug_print(\"execvpe %s\\n\", file);\n   71 | \n   72 |   if (!strcmp(file, \"ld\") || is_ld(file))\n   73 |     file = get_mold_path();\n   74 | \n   75 |   for (int i = 0; envp[i]; i++)\n   76 |     putenv(envp[i]);\n   77 | \n   78 |   typeof(execvpe) *real = dlsym(RTLD_NEXT, \"execvp\");\n   79 |   return real(file, argv, environ);\n   80 | }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold-wrapper.c#L69-L80"},{"ref":"src/mold-wrapper.c:118-124","code":"  118 | int execv(const char *path, char *const *argv) {\n  119 |   return execve(path, argv, environ);\n  120 | }\n  121 | \n  122 | int execvp(const char *file, char *const *argv) {\n  123 |   return execvpe(file, argv, environ);\n  124 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold-wrapper.c#L118-L124"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"`demangle_cpp()` and `demangle_rust()` return a `std::string_view` into a `thread_local` buffer that\nthe *next* call on the same thread overwrites or frees. `demangle_rust()` in particular starts with\n`free(buf)` before demangling, so a `string_view` returned by a previous call becomes dangling the\nmoment the next symbol is demangled. Nothing in `lib/lib.h:1129-1130` documents this. Callers such\nas `demangle()` in `src/input-files.cc:56-65` return that view further up the stack; today it\nhappens to be consumed immediately by `operator<<`, but the contract is a trap for any future\ncaller that wants to keep the result (e.g. to build an error message from two symbols).\n\nAdditionally the thread-local buffers are never freed, so every worker thread leaks its last\ndemangled name for the lifetime of the process.","fix":"Either return an owning `std::optional<std::string>`, or document the lifetime explicitly in\n`lib/lib.h` (`// The returned view is valid only until the next demangle_*() call on this\nthread.`). If the allocation cost is the concern, let the caller pass a `std::string &out`\nscratch buffer it owns.","locations":[{"ref":"lib/demangle.cc:13-40","code":"   13 | std::optional<std::string_view> demangle_cpp(std::string_view name) {\n   14 |   static thread_local char *buf;\n   15 |   static thread_local size_t buflen;\n   16 | \n   17 |   // TODO(cwasser): Actually demangle Symbols on Windows using e.g.\n   18 |   // `UnDecorateSymbolName` from Dbghelp, maybe even Itanium symbols?\n   19 | #ifndef _WIN32\n   20 |   if (name.starts_with(\"_Z\")) {\n   21 |     int status;\n   22 |     char *p = abi::__cxa_demangle(std::string(name).c_str(), buf, &buflen, &status);\n   23 |     if (status == 0) {\n   24 |       buf = p;\n   25 |       return p;\n   26 |     }\n   27 |   }\n   28 | #endif\n   29 | \n   30 |   return {};\n   31 | }\n   32 | \n   33 | std::optional<std::string_view> demangle_rust(std::string_view name) {\n   34 |   static thread_local char *buf;\n   35 |   free(buf);\n   36 |   buf = rust_demangle(std::string(name).c_str(), 0);\n   37 |   if (buf)\n   38 |     return buf;\n   39 |   return {};\n   40 | }","lines":28,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/demangle.cc#L13-L40"},{"ref":"lib/lib.h:1221-1226","code":" 1221 | //\n 1222 | // demangle.cc\n 1223 | //\n 1224 | \n 1225 | std::optional<std::string_view> demangle_cpp(std::string_view name);\n 1226 | std::optional<std::string_view> demangle_rust(std::string_view name);","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L1221-L1226"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"`Context<E>::debug_info`, `debug_abbrev`, `debug_ranges`, `debug_addr` and\n`debug_rnglists` are `std::span<u8>` members that, for uncompressed sections,\nalias the output buffer: `get_buffer()` returns\n`{ctx.buf + chunk->shdr.sh_offset, chunk->shdr.sh_size}`\n(`src/gdb-index.cc:758-764`). `OutputFile<E>::extend()` is explicitly\ndocumented right in this header as \"`buf` and `ctx.buf` may move as a result of\nthis call\", and `write_gdb_index()` calls `ctx.output_file->extend()` at\n`src/gdb-index.cc:971` in the same function that filled those spans. Today the\nspans happen to be consumed before the `extend()` call, so nothing dangles -\nbut there is no marker or invariant preventing a future reordering, and\n`MallocOutputFile::extend()` really does `realloc`.","fix":"Store offsets rather than pointers, e.g. keep\n`std::pair<i64 /*offset*/, i64 /*size*/> debug_info;` in `Context` and\nmaterialize `std::span<u8>{ctx.buf + off, size}` at the point of use; or clear\nthe five spans inside `OutputFile<E>::extend()` so a stale use trips\nimmediately. At minimum, add a comment next to the members stating that they\nare invalidated by `extend()`.","locations":[{"ref":"src/mold.h:1716-1721","code":" 1716 |   // Appends `size` bytes to the output file and returns a pointer to\n 1717 |   // the newly-allocated space, bumping `filesize` accordingly. We use\n 1718 |   // it for .gdb_index, whose size is not known until all other\n 1719 |   // sections have been written. The new space is zero-initialized.\n 1720 |   // `buf` and `ctx.buf` may move as a result of this call.\n 1721 |   virtual u8 *extend(Context<E> &ctx, i64 size) = 0;","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L1716-L1721"},{"ref":"src/mold.h:2965-2972","code":" 2965 |   // For --gdb-index\n 2966 |   // shared_ptr lets the implementation type remain in gdb-index.cc.\n 2967 |   std::shared_ptr<GdbIndexData> gdb_index_data;\n 2968 |   std::span<u8> debug_info;\n 2969 |   std::span<u8> debug_abbrev;\n 2970 |   std::span<u8> debug_ranges;\n 2971 |   std::span<u8> debug_addr;\n 2972 |   std::span<u8> debug_rnglists;","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L2965-L2972"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`MappedFile::~MappedFile()` calls only `unmap()`; it never calls `close_fd()`.\n`reopen_fd()` reopens a descriptor for LTO (`src/lto-unix.cc:591`) and only two\nexplicit `close_fd()` calls exist (`src/lto-unix.cc:643-645`), so any\n`MappedFile` whose descriptor is reopened on another code path leaks it for the\nlifetime of the process. Given that mold can open thousands of archive members,\na descriptor leak here can hit `RLIMIT_NOFILE`.","fix":"```cpp\n-  ~MappedFile() { unmap(); }\n+  ~MappedFile() { unmap(); close_fd(); }\n```\n\n`close_fd()` is already a no-op when `fd == -1`, so this is safe for the common\ncase.","locations":[{"ref":"src/mold.h:181-189","code":"  181 | class MappedFile {\n  182 | public:\n  183 |   ~MappedFile() { unmap(); }\n  184 |   void unmap();\n  185 |   void close_fd();\n  186 |   void reopen_fd(const std::string &path);\n  187 | \n  188 |   template <typename E>\n  189 |   MappedFile *slice(Context<E> &ctx, std::string name, u64 start, u64 size) {","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L181-L189"},{"ref":"src/mold.h:239-244","code":"  239 | #ifdef _WIN32\n  240 |   HANDLE fd = INVALID_HANDLE_VALUE;\n  241 | #else\n  242 |   int fd = -1;\n  243 | #endif\n  244 | };","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L239-L244"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`SymbolAux<E>` contains a `std::vector<u64> thunk_addrs`, but every\n`SymbolAux<E>` is created with `ctx.arena.template make<SymbolAux<E>>()`\n(`src/mold.h:3818`, `src/passes.cc:1919`, `src/output-chunks.cc:3007`).\n`ArenaResource` is a bump allocator whose destructor only `munmap`s the region\n(`lib/arena.cc:39-45`); it never runs destructors of objects placed in it and\nnothing wraps `SymbolAux` in an `ArenaObjectPtr`. Consequently every\n`thunk_addrs` heap buffer is leaked. Note that `ShardedMap` explicitly\n`static_assert`s that its arena entries are trivially destructible\n(`lib/lib.h:895`) - `SymbolAux<E>` violates that same invariant without any\nguard.","fix":"Either make `SymbolAux<E>` trivially destructible by allocating the thunk\naddress list from the arena as well (e.g. a `{ArenaPtr<u64> ptr; u32 size;}`\npair filled once in `gather_thunk_addresses()`, which already knows the final\ncount), or add\n`static_assert(std::is_trivially_destructible_v<SymbolAux<E>>);` next to the\ndeclaration and keep the vector in a separately-owned side table.","locations":[{"ref":"src/mold.h:315-329","code":"  315 | template <typename E>\n  316 | struct SymbolAux {\n  317 |   i32 got_idx = -1;\n  318 |   i32 gottp_idx = -1;\n  319 |   i32 tlsgd_idx = -1;\n  320 |   i32 tlsdesc_idx = -1;\n  321 |   i32 plt_idx = -1;\n  322 |   i32 pltgot_idx = -1;\n  323 |   i32 dynsym_idx = -1;\n  324 |   i32 opd_idx = -1;\n  325 |   u32 djb_hash = 0;\n  326 | \n  327 |   // For range extension thunks\n  328 |   std::vector<u64> thunk_addrs;\n  329 | };","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L315-L329"},{"ref":"src/mold.h:3956-3963","code":" 3956 | template <typename E>\n 3957 | void Symbol<E>::add_thunk_addr(Context<E> &ctx, u64 addr) requires needs_thunk<E> {\n 3958 |   if (!aux)\n 3959 |     aux = ctx.arena.template make<SymbolAux<E>>();\n 3960 |   std::vector<u64> &vec = aux->thunk_addrs;\n 3961 |   assert(vec.empty() || vec.back() < addr);\n 3962 |   vec.push_back(addr);\n 3963 | }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3956-L3963"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`read_uleb()` and `read_sleb()` accumulate into a `u64` with\n`val |= (byte & 0x7f) << shift;`. `byte` is a `u8`, so `byte & 0x7f` is promoted to `int` and the\nwhole shift expression has type `int`, not `u64`. For `shift >= 32` (i.e. from the 5th LEB128 byte\nonwards) the shift count is at least the width of `int`, which is undefined behaviour; already at\n`shift == 28` a byte value above `0x07` overflows a signed `int`, which is also UB. Even where the\ncompiler does something \"reasonable\", the intermediate result is truncated to 32 bits before being\nOR-ed into `val`, so every ULEB/SLEB value larger than `2^31` is decoded incorrectly.\n\nThese helpers decode DWARF/`.debug_*` and `.eh_frame` data taken straight from untrusted input\nobject files, so a crafted or merely unusual object file yields silently wrong offsets (and, in\n`read_sleb()`, feeds `sign_extend(val, shift)` where `shift` can exceed 64, another UB shift).","fix":"Cast to the accumulator type before shifting, and cap the shift.\n\nBefore:\n```cpp\n    val |= (byte & 0x7f) << shift;\n```\n\nAfter:\n```cpp\n    val |= (u64)(byte & 0x7f) << shift;\n```\n\nFor `read_sleb()`, additionally clamp the sign-extension width, e.g.\n`return sign_extend(val, std::min<i64>(shift, 64));`.","locations":[{"ref":"lib/lib.h:426-436","code":"  426 | inline u64 read_uleb(u8 **buf) {\n  427 |   u64 val = 0;\n  428 |   u8 shift = 0;\n  429 |   u8 byte;\n  430 |   do {\n  431 |     byte = *(*buf)++;\n  432 |     val |= (byte & 0x7f) << shift;\n  433 |     shift += 7;\n  434 |   } while (byte & 0x80);\n  435 |   return val;\n  436 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L426-L436"},{"ref":"lib/lib.h:443-453","code":"  443 | inline i64 read_sleb(u8 **buf) {\n  444 |   u64 val = 0;\n  445 |   u8 shift = 0;\n  446 |   u8 byte;\n  447 |   do {\n  448 |     byte = *(*buf)++;\n  449 |     val |= (byte & 0x7f) << shift;\n  450 |     shift += 7;\n  451 |   } while (byte & 0x80);\n  452 |   return sign_extend(val, shift);\n  453 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L443-L453"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`read_uleb` (used throughout `gdb-index.cc` for DWARF abbrev codes, attribute\nforms, `DW_FORM_udata` values and `DW_RLE_*` operands) computes\n`val |= (byte & 0x7f) << shift;`. `byte & 0x7f` has type `int`, so the shift is\nperformed in 32-bit signed arithmetic: for `shift >= 28` the result overflows\n`int` (undefined behaviour), and in practice GCC/Clang produce a negative `int`\nthat is then sign-extended when OR'ed into the `u64`, setting bits 32-63. For\n`shift >= 32` the shift itself is undefined. Any ULEB128 value that needs five\nor more bytes - a `DW_AT_high_pc` of `DW_FORM_udata` larger than 256 MiB, a\n`DW_RLE_startx_length` length, a large abbrev code - is decoded incorrectly.\n`read_sleb` has the identical defect.","fix":"Do the arithmetic in 64-bit and guard the shift width:\n```cpp\ninline u64 read_uleb(u8 **buf) {\n  u64 val = 0;\n  int shift = 0;\n  u8 byte;\n  do {\n    byte = *(*buf)++;\n    if (shift < 64)\n      val |= (u64)(byte & 0x7f) << shift;\n    shift += 7;\n  } while (byte & 0x80);\n  return val;\n}\n```\nand apply the same change to `read_sleb`.","locations":[{"ref":"lib/lib.h:426-436","code":"  426 | inline u64 read_uleb(u8 **buf) {\n  427 |   u64 val = 0;\n  428 |   u8 shift = 0;\n  429 |   u8 byte;\n  430 |   do {\n  431 |     byte = *(*buf)++;\n  432 |     val |= (byte & 0x7f) << shift;\n  433 |     shift += 7;\n  434 |   } while (byte & 0x80);\n  435 |   return val;\n  436 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L426-L436"},{"ref":"lib/lib.h:443-453","code":"  443 | inline i64 read_sleb(u8 **buf) {\n  444 |   u64 val = 0;\n  445 |   u8 shift = 0;\n  446 |   u8 byte;\n  447 |   do {\n  448 |     byte = *(*buf)++;\n  449 |     val |= (byte & 0x7f) << shift;\n  450 |     shift += 7;\n  451 |   } while (byte & 0x80);\n  452 |   return sign_extend(val, shift);\n  453 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L443-L453"},{"ref":"src/gdb-index.cc:442-448","code":"  442 |   case DW_FORM_strx:\n  443 |   case DW_FORM_addrx:\n  444 |   case DW_FORM_udata:\n  445 |   case DW_FORM_ref_udata:\n  446 |   case DW_FORM_loclistx:\n  447 |   case DW_FORM_rnglistx:\n  448 |     return read_uleb(p);","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gdb-index.cc#L442-L448"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"The SPARC64 large-PLT layout and the `.plt` size computation disagree. `sparc_plt_ptr_offset`\nand `to_plt_offset` lay large entries out in 5120-byte blocks of 160 entries (24-byte stub +\n8-byte data pointer = 32 bytes per entry, starting at file offset `0x100000`), but\n`PltSection<E>::update_shdr` sizes the SPARC `.plt` as\n`plt_hdr_size + symbols.size() * plt_size`, i.e. 16 bytes per entry. Since\n`plt_hdr_size + sparc_num_small_plt * plt_size == 0x100000` exactly, the section is sized\n`0x100000 + 16 * nlarge` while the layout needs `0x100000 + 32 * nlarge` - exactly half of\nwhat is required. As soon as a link needs more than `sparc_num_small_plt` (65534) PLT\nentries, `write_plt_entry` and the `*(ub64 *)(ctx.buf + ...+ ptroff)` pointer store write\npast the end of `.plt`, corrupting whatever chunk follows or running off the end of the\noutput mapping.","fix":"Size the section from the same function that lays it out, e.g. drop the special SPARC branch\nand make `update_shdr` use\n`to_plt_offset<E>(symbols.size() - 1) + <entry size> + <pointer area of the last block>`, or\nadd a `sparc_plt_size(ctx, nsyms)` helper next to `sparc_plt_ptr_offset` that returns\n`0x100000 + nblocks * 5120` (with the partial last block accounted for) and call it from\n`PltSection<E>::update_shdr`. Add an assertion that every offset written by\n`write_plt_entry` is `< shdr.sh_size`.","locations":[{"ref":"src/arch-sparc64.cc:83-89","code":"   83 | i64 sparc_plt_ptr_offset(Context<E> &ctx, i64 pltidx) {\n   84 |   i64 i = pltidx - sparc_num_small_plt;\n   85 |   i64 block = i / 160;\n   86 |   i64 nlarge = (i64)ctx.plt->symbols.size() - sparc_num_small_plt;\n   87 |   i64 nstub = std::min<i64>(160, nlarge - block * 160);\n   88 |   return 0x100000 + block * 5120 + nstub * 24 + (i % 160) * 8;\n   89 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-sparc64.cc#L83-L89"},{"ref":"src/output-chunks.cc:1908-1916","code":" 1908 | template <typename E>\n 1909 | void PltSection<E>::update_shdr(Context<E> &ctx) {\n 1910 |   if (symbols.empty())\n 1911 |     this->shdr.sh_size = 0;\n 1912 |   else if constexpr (is_sparc<E>)\n 1913 |     this->shdr.sh_size = E::plt_hdr_size + symbols.size() * E::plt_size;\n 1914 |   else\n 1915 |     this->shdr.sh_size = to_plt_offset<E>(symbols.size());\n 1916 | }","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L1908-L1916"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`R_LARCH_ALIGN` with a non-zero `r_sym` stores `log2(alignment)` in the low 8 bits of\n`r_addend`, and the code computes `alignment = 1 << r.r_addend`. `r_addend` comes straight\nfrom an input object file and is only checked for `r.r_addend >> 8`, so any value in\n`[31, 255]` shifts a 32-bit `int` by more than its width - undefined behaviour - and values\naround 31 produce a negative `alignment`. `align_to()` then asserts `has_single_bit(align)`\n(disabled with `NDEBUG`), and `actual = P + alignment - 4` can make `remove()` subtract more\nbytes than the section contains, leaving `isec.sh_size` negative at line 1052.","fix":"Use a 64-bit shift and bound the exponent, e.g.:\n```\n-        alignment = 1 << r.r_addend;\n+        if (r.r_addend > 31)\n+          Fatal(ctx) << isec << \": R_LARCH_ALIGN: alignment too large: \" << i;\n+        alignment = 1LL << r.r_addend;\n```\nand additionally verify that `actual - desired` does not exceed the remaining section size.","locations":[{"ref":"src/arch-loongarch.cc:932-942","code":"  932 |       i64 alignment;\n  933 |       if (r.r_sym) {\n  934 |         if (r.r_addend >> 8)\n  935 |           Fatal(ctx) << isec << \": ternary R_LARCH_ALIGN is not supported: \" << i;\n  936 |         alignment = 1 << r.r_addend;\n  937 |       } else {\n  938 |         if (!has_single_bit(r.r_addend + 4))\n  939 |           Fatal(ctx) << isec << \": R_LARCH_ALIGN: invalid alignment requirement: \"\n  940 |                      << i;\n  941 |         alignment = r.r_addend + 4;\n  942 |       }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-loongarch.cc#L932-L942"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`r_addend` of `R_RISCV_ALIGN` is used unvalidated as a byte count. `shrink_section`\ncomputes `remove(actual - desired)` from it and finally does `isec.sh_size -= r_delta`\n(`sh_size` is a signed `i64`, so it can go negative), and `apply_reloc_alloc` runs\n`for (; i <= padding_bytes - 4; i += 4) *(ul32 *)(loc + i) = nop;` where\n`padding_bytes = rel.r_addend - removed_bytes`. Nothing checks that the padding fits inside\nthe section, so an object file with a large `R_RISCV_ALIGN` addend makes mold write NOPs far\npast the end of the section's slice of the output buffer (heap/mmap overflow) and/or produce a\nnegative section size. Unlike a bad `r_offset` (which mold generally trusts), this addend\ndrives an unbounded *loop* of stores and is trivially bounded.","fix":"Validate the addend when the relocation is scanned or at the top of the `R_RISCV_ALIGN`\nhandling, e.g. reject `r_addend < 0`, `r_addend & 1`, or\n`r_offset + r_addend > isec.get_contents().size()` with a `Fatal`, and keep the\n`assert((padding_bytes & 1) == 0)` as a real check rather than an assertion.","locations":[{"ref":"src/arch-riscv.cc:629-646","code":"  629 |     case R_RISCV_ALIGN: {\n  630 |       // A R_RISCV_ALIGN is followed by a NOP sequence. We need to remove\n  631 |       // zero or more bytes so that the instruction after R_RISCV_ALIGN is\n  632 |       // aligned to a given alignment boundary.\n  633 |       //\n  634 |       // We need to guarantee that the NOP sequence is valid after byte\n  635 |       // removal (e.g. we can't remove the first 2 bytes of a 4-byte NOP).\n  636 |       // For the sake of simplicity, we always rewrite the entire NOP sequence.\n  637 |       i64 padding_bytes = rel.r_addend - removed_bytes;\n  638 |       assert((padding_bytes & 1) == 0);\n  639 | \n  640 |       i64 i = 0;\n  641 |       for (; i <= padding_bytes - 4; i += 4)\n  642 |         *(ul32 *)(loc + i) = 0x0000'0013; // nop\n  643 |       if (i < padding_bytes)\n  644 |         *(ul16 *)(loc + i) = 0x0001;      // c.nop\n  645 |       break;\n  646 |     }","lines":18,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L629-L646"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`bits()` builds its mask with `((1LL << (hi - lo + 1)) - 1)`. `1LL` is a *signed* 64-bit literal,\nso a width of 63 shifts into the sign bit (implementation-defined/UB in C++17 and earlier, and a\nsanitizer report today) and a width of 64 — i.e. `bits(val, 63, 0)` — is an undefined shift by the\nfull operand width. The helper is documented as \"Returns [hi:lo] bits of val\" with no width\nrestriction and is used pervasively in the `arch-*.cc` files.\n\n`bit_ceil()` has the same class of bug: `1LL << (64 - std::countl_zero(val))` is UB whenever\n`val > (1ULL << 62)` (shift into or past the sign bit). `bit_ceil()` is called from\n`ConcurrentMap::resize()` with a caller-supplied bucket estimate.","fix":"Use unsigned literals and handle the full-width case.\n\nBefore:\n```cpp\ninline u64 bits(u64 val, u64 hi, u64 lo) {\n  return (val >> lo) & ((1LL << (hi - lo + 1)) - 1);\n}\n```\n\nAfter:\n```cpp\ninline u64 bits(u64 val, u64 hi, u64 lo) {\n  u64 width = hi - lo + 1;\n  u64 mask = (width >= 64) ? ~(u64)0 : ((1ULL << width) - 1);\n  return (val >> lo) & mask;\n}\n```\n\nFor `bit_ceil()`, just forward to `std::bit_ceil` (the comment claiming libraries lack it is\nstale — `lib/arena.cc:49` already calls `std::has_single_bit` directly).","locations":[{"ref":"lib/lib.h:274-277","code":"  274 | // Returns [hi:lo] bits of val.\n  275 | inline u64 bits(u64 val, u64 hi, u64 lo) {\n  276 |   return (val >> lo) & ((1LL << (hi - lo + 1)) - 1);\n  277 | }","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L274-L277"},{"ref":"lib/lib.h:216-221","code":"  216 | // Some C++ libraries haven't implemented std::bit_ceil yet.\n  217 | inline u64 bit_ceil(u64 val) {\n  218 |   if (has_single_bit(val))\n  219 |     return val;\n  220 |   return 1LL << (64 - std::countl_zero(val));\n  221 | }","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L216-L221"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`parse_number` and `parse_hex` return `i64` but convert with `std::stoul`, whose result type\nis `unsigned long` - 32 bits on Windows (LLP64) and on any ILP32 host. Options that\nlegitimately take 64-bit values (`--image-base`, `-z max-page-size`, `-z stack-size`,\n`--Ttext`, `--section-start`, `--defsym`) are therefore silently truncated on those\nplatforms, e.g. `--image-base=0x100000000` becomes `0`. mold explicitly supports Windows\n(see `src/mapped-file-win32.cc`, `subprocess-win32.cc`).","fix":"Use `std::stoull` (or, better, `std::from_chars` into a `u64`) in both helpers and range-check\nthe result before narrowing to `i64`.","locations":[{"ref":"src/cmdline.cc:403-430","code":"  403 | template <typename E>\n  404 | static i64 parse_hex(Context<E> &ctx, std::string opt, std::string_view value) {\n  405 |   auto flags = std::regex_constants::optimize | std::regex_constants::ECMAScript;\n  406 |   static std::regex re(R\"((?:0x|0X)?([0-9a-fA-F]+))\", flags);\n  407 | \n  408 |   std::cmatch m;\n  409 |   if (!std::regex_match(value.data(), value.data() + value.size(), m, re))\n  410 |     Fatal(ctx) << \"option -\" << opt << \": not a hexadecimal number\";\n  411 |   return std::stoul(m[1], nullptr, 16);\n  412 | }\n  413 | \n  414 | template <typename E>\n  415 | static i64 parse_number(Context<E> &ctx, std::string opt,\n  416 |                         std::string_view value) {\n  417 |   size_t nread;\n  418 | \n  419 |   if (value.starts_with('-')) {\n  420 |     i64 ret = std::stoul(std::string(value.substr(1)), &nread, 0);\n  421 |     if (value.size() - 1 != nread)\n  422 |       Fatal(ctx) << \"option -\" << opt << \": not a number: \" << value;\n  423 |     return -ret;\n  424 |   }\n  425 | \n  426 |   i64 ret = std::stoul(std::string(value), &nread, 0);\n  427 |   if (value.size() != nread)\n  428 |     Fatal(ctx) << \"option -\" << opt << \": not a number: \" << value;\n  429 |   return ret;\n  430 | }","lines":28,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L403-L430"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"The 32-bit `ElfRel<E>` specializations store `r_type` in a `u8` and `r_sym` in a\n`U24<E>`, but the constructor takes both as `u32` and assigns them with a silent\nnarrowing conversion. A relocation type above 255 or a symbol index above\n0xffffff is truncated without any diagnostic, producing a wrong relocation in\nthe output (`--relocatable` and `--emit-relocs` construct `ElfRel` objects\ndirectly). The 24-bit symbol index is a hard 16M-symbol limit for 32-bit\ntargets that is not documented or checked anywhere.","fix":"Assert the ranges in the constructor for the narrow cases:\n```cpp\nElfRel(u64 offset, u32 type, u32 sym, i64 addend = 0)\n    : r_offset(offset), r_type(type), r_sym(sym) {\n  if constexpr (!E::is_64)\n    assert(type <= 0xff && sym <= 0xffffff);\n}\n```\nand report a `Fatal` at the (few) call sites that can exceed the limits.","locations":[{"ref":"src/elf.h:1736-1756","code":" 1736 | template <typename E> requires (E::is_le && !E::is_rela)\n 1737 | struct ElfRel<E> {\n 1738 |   ElfRel() = default;\n 1739 |   ElfRel(u64 offset, u32 type, u32 sym, i64 addend = 0)\n 1740 |     : r_offset(offset), r_type(type), r_sym(sym) {}\n 1741 | \n 1742 |   Word<E> r_offset;\n 1743 |   std::conditional_t<E::is_64, U32<E>, u8> r_type;\n 1744 |   std::conditional_t<E::is_64, U32<E>, U24<E>> r_sym;\n 1745 | };\n 1746 | \n 1747 | template <typename E> requires (!E::is_le && !E::is_rela)\n 1748 | struct ElfRel<E> {\n 1749 |   ElfRel() = default;\n 1750 |   ElfRel(u64 offset, u32 type, u32 sym, i64 addend = 0)\n 1751 |     : r_offset(offset), r_sym(sym), r_type(type) {}\n 1752 | \n 1753 |   Word<E> r_offset;\n 1754 |   std::conditional_t<E::is_64, U32<E>, U24<E>> r_sym;\n 1755 |   std::conditional_t<E::is_64, U32<E>, u8> r_type;\n 1756 | };","lines":21,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/elf.h#L1736-L1756"},{"ref":"src/elf.h:1712-1734","code":" 1712 | template <typename E> requires (E::is_le && E::is_rela)\n 1713 | struct ElfRel<E> {\n 1714 |   ElfRel() = default;\n 1715 |   ElfRel(u64 offset, u32 type, u32 sym, i64 addend)\n 1716 |     : r_offset(offset), r_type(type), r_sym(sym), r_addend(addend) {}\n 1717 | \n 1718 |   Word<E> r_offset;\n 1719 |   std::conditional_t<E::is_64, U32<E>, u8> r_type;\n 1720 |   std::conditional_t<E::is_64, U32<E>, U24<E>> r_sym;\n 1721 |   SWord<E> r_addend;\n 1722 | };\n 1723 | \n 1724 | template <typename E> requires (!E::is_le && E::is_rela)\n 1725 | struct ElfRel<E> {\n 1726 |   ElfRel() = default;\n 1727 |   ElfRel(u64 offset, u32 type, u32 sym, i64 addend)\n 1728 |     : r_offset(offset), r_sym(sym), r_type(type), r_addend(addend) {}\n 1729 | \n 1730 |   Word<E> r_offset;\n 1731 |   std::conditional_t<E::is_64, U32<E>, U24<E>> r_sym;\n 1732 |   std::conditional_t<E::is_64, U32<E>, u8> r_type;\n 1733 |   SWord<E> r_addend;\n 1734 | };","lines":23,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/elf.h#L1712-L1734"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`print_map()` prints the alignment as `(1 << mem->p2align)`. `p2align` is\nderived from `std::countr_zero(sh_addralign)` and can be up to 63 for a\nmalformed (or merely 64-bit-huge) `sh_addralign`, so `1 << p2align` shifts an\n`int` by more than 31 bits - undefined behaviour, and wrong output for any\nalignment >= 2 GiB.","fix":"```c++\n-         << std::setw(6) << (1 << mem->p2align)\n+         << std::setw(6) << ((u64)1 << mem->p2align)\n```","locations":[{"ref":"src/mapfile.cc:85-89","code":"   85 |       ss << std::showbase\n   86 |          << std::setw(18) << std::hex << addr << std::dec\n   87 |          << std::setw(11) << (u64)mem->sh_size\n   88 |          << std::setw(6) << (1 << mem->p2align)\n   89 |          << \"         \" << *mem << \"\\n\";","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mapfile.cc#L85-L89"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"The `.gnu.hash` bloom filter is built with a signed shift that is undefined behavior\nfor 64-bit targets: `word_bits` is 64 there, so `h % word_bits` can be 63 and\n`1LL << 63` overflows the sign bit of `long long`. UBSan flags this, and a compiler\nis free to assume it cannot happen.","fix":"Use an unsigned literal of the right width:\n```\n    bloom[idx] |= (u64)1 << (h % word_bits);\n    bloom[idx] |= (u64)1 << ((h >> BLOOM_SHIFT) % word_bits);\n```\ninstead of `bloom[idx] |= 1LL << (h % word_bits);` / `bloom[idx] |= 1LL << ((h >> BLOOM_SHIFT) % word_bits);`.","locations":[{"ref":"src/output-chunks.cc:2318-2327","code":" 2318 |   for (i64 i = 0; i < syms.size(); i++) {\n 2319 |     constexpr i64 word_bits = sizeof(Word<E>) * 8;\n 2320 | \n 2321 |     u32 h = syms[i]->aux->djb_hash;\n 2322 |     indices[i] = h % num_buckets;\n 2323 | \n 2324 |     i64 idx = (h / word_bits) % num_bloom;\n 2325 |     bloom[idx] |= 1LL << (h % word_bits);\n 2326 |     bloom[idx] |= 1LL << ((h >> BLOOM_SHIFT) % word_bits);\n 2327 |   }","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L2318-L2327"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`VerneedSection<E>::construct` sizes its scratch buffer as\n\n```\ncontents.resize((sizeof(ElfVerneed<E>) + sizeof(ElfVernaux<E>)) * (syms.size() + 1));\n```\n\nwhich assumes at most one `ElfVernaux` per versioned symbol plus one spare group.\nBut `start_group()` can emit an *extra* `add_entry(\"GLIBC_ABI_DT_RELR\")` for every\nDSO that looks like glibc when `-z pack-relative-relocs` is in effect, on top of the\none aux entry per distinct symbol version. With G groups, S symbols and Gg glibc-like\ngroups the buffer actually needs `G*sizeof(ElfVerneed) + (S + Gg)*sizeof(ElfVernaux)`\nbytes, which exceeds the allocation once `G + Gg > S + 2`. All writes go through raw\npointers into `contents`, so exceeding it is a heap buffer overflow rather than a\ngraceful failure. It takes a contrived input (several DSOs whose soname starts with\n`libc.so.` and that export `GLIBC_2.*`, each contributing one versioned symbol), but\nthe bound is not enforced anywhere.","fix":"Size the buffer from the real upper bound, e.g. count the number of groups and the number of extra `GLIBC_ABI_DT_RELR` entries before allocating, or build the section into a `std::vector<u8>` with `append`/`resize` instead of writing through raw pointers into a pre-sized buffer; at minimum add `assert(ptr <= buf + contents.size())` after the loop.","locations":[{"ref":"src/output-chunks.cc:3146-3148","code":" 3146 |   // Allocate a large enough buffer for .gnu.version_r.\n 3147 |   contents.resize((sizeof(ElfVerneed<E>) + sizeof(ElfVernaux<E>)) *\n 3148 |                   (syms.size() + 1));","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L3146-L3148"},{"ref":"src/output-chunks.cc:3171-3185","code":" 3171 |   auto start_group = [&](SharedFile<E> &file) {\n 3172 |     this->shdr.sh_info++;\n 3173 |     if (verneed)\n 3174 |       verneed->vn_next = ptr - (u8 *)verneed;\n 3175 | \n 3176 |     verneed = (ElfVerneed<E> *)ptr;\n 3177 |     ptr += sizeof(ElfVerneed<E>);\n 3178 |     verneed->vn_version = 1;\n 3179 |     verneed->vn_file = ctx.dynstr->find_string(file.soname);\n 3180 |     verneed->vn_aux = sizeof(ElfVerneed<E>);\n 3181 |     aux = nullptr;\n 3182 | \n 3183 |     if (ctx.arg.pack_dyn_relocs_relr && is_glibc2(file))\n 3184 |       add_entry(\"GLIBC_ABI_DT_RELR\");\n 3185 |   };","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L3171-L3185"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`set_virtual_addresses_regular()`/`set_virtual_addresses_by_order()` accumulate\naddresses in a `u64` and store them into `chunk->shdr.sh_addr`, which is a\n32-bit field for ELF32 targets (i386, ARM32, RV32, PPC32, LoongArch32). No\npass checks that the final address or `set_file_offsets()`'s return value fits;\n`set_osec_offsets()` just returns the `i64` file size. An over-4 GiB ELF32\nlayout (or an `--image-base`/`--section-start` value near the top of the\naddress space) is therefore silently truncated, producing an output file with\nnonsense addresses instead of a diagnostic. `addr += sh_size` can also wrap\naround `2^64` on 64-bit targets with an absurd `--section-start`.","fix":"After address assignment, verify that `addr` (and each `sh_addr + sh_size`) fits in `sizeof(Word<E>) * 8` bits and that the address never decreases unexpectedly; emit `Fatal(ctx) << \"output file too large\"` otherwise. Do the same for the file size returned by `set_file_offsets()`.","locations":[{"ref":"src/passes.cc:2936-3022","code":" 2936 |   for (i64 i = 0; i < chunks.size(); i++) {\n 2937 |     if (!(chunks[i]->shdr.sh_flags & SHF_ALLOC))\n 2938 |       continue;\n 2939 | \n 2940 |     // .relro_padding is a padding section to extend a PT_GNU_RELRO\n 2941 |     // segment to cover an entire page. Technically, we don't need a\n 2942 |     // .relro_padding section because we can leave a trailing part of a\n 2943 |     // segment an unused space. However, the `strip` command would delete\n 2944 |     // such an unused trailing part and make an executable invalid.\n 2945 |     // So we add a dummy section.\n 2946 |     if (chunks[i] == ctx.relro_padding) {\n 2947 |       chunks[i]->shdr.sh_addr = addr;\n 2948 |       chunks[i]->shdr.sh_size = align_to(addr, ctx.page_size) - addr;\n 2949 |       addr += ctx.page_size;\n 2950 |       continue;\n 2951 |     }\n 2952 | \n 2953 |     // Handle --section-start first\n 2954 |     if (auto it = ctx.arg.section_start.find(chunks[i]->name);\n 2955 |         it != ctx.arg.section_start.end()) {\n 2956 |       addr = it->second;\n 2957 |       chunks[i]->shdr.sh_addr = addr;\n 2958 |       addr += chunks[i]->shdr.sh_size;\n 2959 |       continue;\n 2960 |     }\n 2961 | \n 2962 |     // Memory protection works at page size granularity. We need to\n 2963 |     // put sections with different memory attributes into different\n 2964 |     // pages. We do it by inserting paddings here.\n 2965 |     if (i > 0 && chunks[i - 1] != ctx.relro_padding) {\n 2966 |       i64 flags1 = get_flags(chunks[i - 1]);\n 2967 |       i64 flags2 = get_flags(chunks[i]);\n 2968 | \n 2969 |       if (!ctx.arg.nmagic && flags1 != flags2) {\n 2970 |         switch (ctx.arg.z_separate_code) {\n 2971 |         case SEPARATE_LOADABLE_SEGMENTS:\n 2972 |           addr = align_to(addr, ctx.page_size);\n 2973 |           break;\n 2974 |         case SEPARATE_CODE:\n 2975 |           if ((flags1 & PF_X) != (flags2 & PF_X)) {\n 2976 |             addr = align_to(addr, ctx.page_size);\n 2977 |             break;\n 2978 |           }\n 2979 |           [[fallthrough]];\n 2980 |         case NOSEPARATE_CODE:\n 2981 |           if (addr % ctx.page_size != 0)\n 2982 |             addr += ctx.page_size;\n 2983 |           break;\n 2984 |         default:\n 2985 |           unreachable();\n 2986 |         }\n 2987 |       }\n 2988 |     }\n 2989 | \n 2990 |     // TLS sections are included only in PT_LOAD but also in PT_TLS.\n 2991 |     // We align the first TLS section so that the PT_TLS segment starts\n 2992 |     // at an address that meets the segment's alignment requirement.\n 2993 |     if (is_tls(chunks[i]) && (i == 0 || !is_tls(chunks[i - 1])))\n 2994 |       addr = align_to(addr, get_tls_segment_alignment(ctx));\n 2995 | \n 2996 |     // TLS BSS sections are laid out so that they overlap with the\n 2997 |     // subsequent non-tbss sections. Overlapping is fine because a STT_TLS\n 2998 |     // segment contains an initialization image for newly-created threads,\n 2999 |     // and no one except the runtime reads its contents. Even the runtime\n 3000 |     // doesn't need a BSS part of a TLS initialization image; it just\n 3001 |     // leaves zero-initialized bytes as-is instead of copying zeros.\n 3002 |     // So no one really read tbss at runtime.\n 3003 |     //\n 3004 |     // We can instead allocate a dedicated virtual address space to tbss,\n 3005 |     // but that would be just a waste of the address and disk space.\n 3006 |     if (is_tbss(chunks[i])) {\n 3007 |       u64 addr2 = addr;\n 3008 |       for (;;) {\n 3009 |         addr2 = align_to(addr2, chunks[i]->shdr.sh_addralign);\n 3010 |         chunks[i]->shdr.sh_addr = addr2;\n 3011 |         addr2 += chunks[i]->shdr.sh_size;\n 3012 |         if (i + 2 == chunks.size() || !is_tbss(chunks[i + 1]))\n 3013 |           break;\n 3014 |         i++;\n 3015 |       }\n 3016 |       continue;\n 3017 |     }\n 3018 | \n 3019 |     addr = align_to(addr, chunks[i]->shdr.sh_addralign);\n 3020 |     chunks[i]->shdr.sh_addr = addr;\n 3021 |     addr += chunks[i]->shdr.sh_size;\n 3022 |   }","lines":87,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L2936-L3022"},{"ref":"src/passes.cc:3231-3264","code":" 3231 | template <typename E>\n 3232 | i64 set_osec_offsets(Context<E> &ctx) {\n 3233 |   Timer t(ctx, \"set_osec_offsets\");\n 3234 | \n 3235 |   for (;;) {\n 3236 |     if (ctx.arg.section_order.empty())\n 3237 |       set_virtual_addresses_regular(ctx);\n 3238 |     else\n 3239 |       set_virtual_addresses_by_order(ctx);\n 3240 | \n 3241 |     if (ctx.arg.pack_dyn_relocs_android) {\n 3242 |       i64 x = ctx.reldyn->shdr.sh_size;\n 3243 |       ctx.reldyn->update_shdr(ctx);\n 3244 | \n 3245 |       if (x != (i64)ctx.reldyn->shdr.sh_size)\n 3246 |         continue;\n 32 {"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`R_PPC64_GOT16`, `R_PPC64_GOT16_LO`, `R_PPC64_GOT16_HI` and `R_PPC64_GOT16_HA` compute\n`G - TOC`, where `G` is only the *offset* of the symbol's slot inside `.got`\n(`G = sym.get_got_idx(ctx) * sizeof(Word<E>)`). The value that must be encoded is the\nTOC-relative address of that GOT slot, i.e. `G + GOT - TOC`. Because `GOT`\n(`ctx.got->shdr.sh_addr`) is missing, the computed displacement is off by the absolute\naddress of `.got` (a value in the gigabytes), so the resulting `addis`/`ld` pair reads from\na completely wrong address. Every neighbouring case in the same file gets this right:\n`R_PPC64_PLT16_*` uses `G + GOT - TOC` (`src/arch-ppc64v2.cc:278-289`) and the TLS GOT\ncases use full addresses such as `sym.get_gottp_addr(ctx) - TOC`. The identical mistake\nexists in the ELFv1 backend.","fix":"Add the GOT base, mirroring the `PLT16` cases:\n```\n     case R_PPC64_GOT16:\n-      *(ul16 *)loc = G - TOC;\n+      *(ul16 *)loc = G + GOT - TOC;\n```\nand likewise for `_LO`, `_HI`, `_HA` in `arch-ppc64v2.cc` and for `R_PPC64_GOT16` in\n`arch-ppc64v1.cc`. Consider adding an overflow check as well, since a 16-bit field cannot\nhold an arbitrary TOC displacement.","locations":[{"ref":"src/arch-ppc64v2.cc:279-290","code":"  279 |     case R_PPC64_GOT16:\n  280 |       *(ul16 *)loc = G - TOC;\n  281 |       break;\n  282 |     case R_PPC64_GOT16_LO:\n  283 |       *(ul16 *)loc = lo(G - TOC);\n  284 |       break;\n  285 |     case R_PPC64_GOT16_HI:\n  286 |       *(ul16 *)loc = hi(G - TOC);\n  287 |       break;\n  288 |     case R_PPC64_GOT16_HA:\n  289 |       *(ul16 *)loc = ha(G - TOC);\n  290 |       break;","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v2.cc#L279-L290"},{"ref":"src/arch-ppc64v1.cc:231-233","code":"  231 |     case R_PPC64_GOT16:\n  232 |       *(ub16 *)loc = G - TOC;\n  233 |       break;","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v1.cc#L231-L233"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`R_SPARC_WDISP16` patches the instruction word through a 16-bit store instead of a 32-bit\none. Every other instruction-patching case in this file uses `*(ub32 *)loc`. Two things go\nwrong: (1) the `bit(val, 16) << 21` term is thrown away entirely because it does not fit in\n16 bits, and (2) SPARC is big-endian, so a `ub16` store at `loc` targets bits 31..16 of the\ninstruction word - `bits(val, 15, 2)`, which belongs in the `d16lo` field at bits 13..0,\nis OR'ed into the opcode/rd fields instead. Any object file using `R_SPARC_WDISP16` (the\n`BPr` register-branch relocation) therefore produces a corrupted instruction.","fix":"Change the store width:\n```\n-      *(ub16 *)loc |= (bit(val, 16) << 21) | bits(val, 15, 2);\n+      *(ub32 *)loc |= (bit(val, 16) << 21) | bits(val, 15, 2);\n```\nWhile there, note that the `d16hi` field is 2 bits wide at instruction bits 21..20, so the\ncorrect encoding is `(bits(val, 17, 16) << 20) | bits(val, 15, 2)`.","locations":[{"ref":"src/arch-sparc64.cc:296-301","code":"  296 |     case R_SPARC_WDISP16: {\n  297 |       i64 val = S + A - P;\n  298 |       check(val, -(1 << 16), 1 << 16);\n  299 |       *(ub16 *)loc |= (bit(val, 16) << 21) | bits(val, 15, 2);\n  300 |       break;\n  301 |     }","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-sparc64.cc#L296-L301"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`--dynamic-list-data` is a boolean flag (see the help text: \"Add data symbols to dynamic\nsymbols\"), but it is parsed with `read_arg`, which consumes the *next* command line argument\nas its value when the option is written without `=`. `mold --dynamic-list-data foo.o -o a.out`\ntherefore silently drops `foo.o` from the link (or, if the option is last, dies with\n\"argument missing\"). The consumed value is discarded, so the mistake is invisible.","fix":"```\n-    } else if (read_arg(\"dynamic-list-data\")) {\n+    } else if (read_flag(\"dynamic-list-data\")) {\n       ctx.arg.dynamic_list_data = true;\n```","locations":[{"ref":"src/cmdline.cc:1498-1499","code":" 1498 |     } else if (read_arg(\"dynamic-list-data\")) {\n 1499 |       ctx.arg.dynamic_list_data = true;","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L1498-L1499"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`enqueue_symbol` in `collect_root_set` does not mark shared libraries as\nreachable, unlike `visit_section`, which does\n`sym.file->is_reachable.test_and_set()` for symbols defined in a DSO. The CIE\nroot loop feeds every CIE relocation through `enqueue_symbol`, and a CIE's\nrelocations point at the personality routine (e.g. `__gxx_personality_v0`).\nFor a DSO-defined personality routine, `sym->get_frag()` is null and\n`sym->get_input_section()` is null, so `enqueue_section(nullptr)` is a no-op\nand the DSO is never marked reachable. With `--gc-sections --as-needed`,\n`gc_sections` clears `is_reachable` for every `as_needed` DSO up front and then\n`std::erase_if` drops it, so the library providing the personality routine can\nbe dropped from `DT_NEEDED` even though the program needs it at run time.","fix":"Make `enqueue_symbol` mirror the DSO handling in `visit_section`:\n```cpp\nauto enqueue_symbol = [&](Symbol<E> *sym) {\n  if (!sym)\n    return;\n  if (sym->file && sym->file->is_dso) {\n    sym->file->is_reachable.test_and_set();\n    return;\n  }\n  if (SectionFragment<E> *frag = sym->get_frag())\n    frag->is_alive = true;\n  else\n    enqueue_section(sym->get_input_section());\n};\n```","locations":[{"ref":"src/gc-sections.cc:74-81","code":"   74 |   auto enqueue_symbol = [&](Symbol<E> *sym) {\n   75 |     if (sym) {\n   76 |       if (SectionFragment<E> *frag = sym->get_frag())\n   77 |         frag->is_alive = true;\n   78 |       else\n   79 |         enqueue_section(sym->get_input_section());\n   80 |     }\n   81 |   };","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L74-L81"},{"ref":"src/gc-sections.cc:113-117","code":"  113 |   tbb::parallel_for_each(ctx.objs, [&](ObjectFile<E> *file) {\n  114 |     for (CieRecord<E> &cie : file->cies)\n  115 |       for (const ElfRel<E> &rel : cie.get_rels())\n  116 |         enqueue_symbol(file->symbols[rel.r_sym]);\n  117 |   });","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L113-L117"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`DW_FORM_implicit_const` is handled in the abbrev *skipping* loop of\n`find_cu_abbrev` (an extra ULEB is consumed from the abbrev stream), but not in\nthe attribute-reading loop of `read_address_ranges`. There, after\n`read_uleb(&abbrev)` returns `form == DW_FORM_implicit_const`, the code calls\n`read_scalar`, which has no case for `0x21` and therefore hits `default:` and\nkills the link with `--gdb-index: unhandled debug info form: 0x21`. Even if the\nform were tolerated, the implicit value stored in the abbrev would not be\nconsumed, desynchronizing the abbrev cursor and misparsing every following\nattribute (including `DW_AT_low_pc` / `DW_AT_ranges`). GCC emits\n`DW_FORM_implicit_const` routinely with `-gdwarf-5`, so `--gdb-index` can fail\noutright on ordinary DWARF 5 input.","fix":"Consume the implicit value from the abbrev stream and use it as the attribute\nvalue without advancing the `.debug_info` cursor:\n```cpp\nu64 name = read_uleb(&abbrev);\nu64 form = read_uleb(&abbrev);\nif (name == 0 && form == 0)\n  break;\n\nu64 val;\nif (form == DW_FORM_implicit_const)\n  val = read_sleb(&abbrev);\nelse\n  val = read_scalar<E, Offset>(ctx, &p, form);\n```","locations":[{"ref":"src/gdb-index.cc:391-398","code":"  391 |     for (;;) {\n  392 |       u64 name = read_uleb(&abbrev);\n  393 |       u64 form = read_uleb(&abbrev);\n  394 |       if (name == 0 && form == 0)\n  395 |         break;\n  396 |       if (form == DW_FORM_implicit_const)\n  397 |         read_uleb(&abbrev);\n  398 |     }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gdb-index.cc#L391-L398"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`R_ARM_PLT32` is the only function-call relocation in `apply_reloc_alloc()` that never checks\nwhether the branch displacement fits. `R_ARM_CALL` uses `if (is_int(val, 26))` and\n`R_ARM_JUMP24` uses `if (T || !is_int(val, 26))` to redirect through a range-extension thunk,\nbut `R_ARM_PLT32` only redirects when the target is Thumb (`T`) and otherwise writes\n`bits(val, 25, 2)` unconditionally, silently truncating an out-of-range displacement to a\nbranch to a wrong address.\n\nThe thunk is actually available: `R_ARM_PLT32` is listed in `ARM32LE::R_FUNCALL`\n(`src/elf.h:1992-1994`) so `requires_thunk()` reserves a thunk slot for it; only the apply step\nforgets to use it. The result is a silently miscompiled binary rather than a link error whenever\nan ARM32 `.text` grows beyond ±32 MiB and the (legacy) `R_ARM_PLT32` relocation is in use.","fix":"Mirror the `R_ARM_JUMP24` logic:\n\n```cpp\n    case R_ARM_PLT32:\n      if (sym.is_remaining_undef_weak()) {\n        *(U32<E> *)loc = 0xe320'f000; // NOP\n      } else {\n        i64 val = S + A - P;\n        if (T || !is_int(val, 26))\n          val = get_arm_thunk_addr() + A - P;\n        *(U32<E> *)loc = (*(U32<E> *)loc & 0xff00'0000) | bits(val, 25, 2);\n      }\n      break;\n```","locations":[{"ref":"src/arch-arm32.cc:413-420","code":"  413 |     case R_ARM_PLT32:\n  414 |       if (sym.is_remaining_undef_weak()) {\n  415 |         *(U32<E> *)loc = 0xe320'f000; // NOP\n  416 |       } else {\n  417 |         u64 val = (T ? get_arm_thunk_addr() : S) + A - P;\n  418 |         *(U32<E> *)loc = (*(U32<E> *)loc & 0xff00'0000) | bits(val, 25, 2);\n  419 |       }\n  420 |       break;","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L413-L420"},{"ref":"src/arch-arm32.cc:395-412","code":"  395 |     case R_ARM_JUMP24: {\n  396 |       if (sym.is_remaining_undef_weak()) {\n  397 |         *(U32<E> *)loc = 0xe320'f000; // NOP\n  398 |         break;\n  399 |       }\n  400 | \n  401 |       // These relocs refers to a B (unconditional branch) instruction.\n  402 |       // Unlike BL or BLX, we can't rewrite B to BX in place when the\n  403 |       // processor mode switch is required because BX doesn't takes an\n  404 |       // immediate; it takes only a register. So if mode switch is\n  405 |       // required, we jump to a linker-synthesized thunk which does the\n  406 |       // job with a longer code sequence.\n  407 |       i64 val = S + A - P;\n  408 |       if (T || !is_int(val, 26))\n  409 |         val = get_arm_thunk_addr() + A - P;\n  410 |       *(U32<E> *)loc = (*(U32<E> *)loc & 0xff00'0000) | bits(val, 25, 2);\n  411 |       break;\n  412 |     }","lines":18,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L395-L412"}]},
