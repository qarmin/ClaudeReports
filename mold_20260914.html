{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`ShardedMap::gather()` counts *pending references* (`count += bin[i].size()`), not distinct keys,\nand hands that number to `Shard::reserve()`, which both sizes the `unordered_map`\n(`map.reserve(map.size() + count)`) and allocates an arena block of `count` `Entry` objects.\n\n`ShardedMap::add()` is called once per global symbol *reference* in every object file\n(`src/input-files.cc:882`), and popular symbols are referenced by thousands of files. Arena\nblocks are never freed and `Entry` is `ShardedMapEntry<Symbol<E>>` (a full `Symbol` plus a\n`std::string_view`), so a link with, say, 20M global symbol references but 2M distinct names\npermanently burns roughly ten times the memory it needs. Since `ArenaResource::SIZE` is a hard\n8 GiB cap that calls `std::exit(1)` when exceeded (`lib/lib.h:672-679`, `lib/arena.cc:57-61`),\nthis turns a memory-waste problem into an outright link failure on large projects.","fix":"Deduplicate before reserving, or reserve incrementally. Simplest fix: keep `reserve()` for the\n`unordered_map` (a hash table over-reserve is comparatively cheap) but stop pre-allocating one\narena `Entry` per pending reference — let `Shard::insert()` grow blocks geometrically\n(`add_block(std::max(INSERT_BLOCK_SIZE, blocks.back().capacity * 2))`) so arena usage tracks the\nnumber of *created* entries. Alternatively, sort/unique each shard's `Pending` list by\n`(hash, key)` in `gather()` first and reserve the unique count.","locations":[{"ref":"lib/lib.h:943-961","code":"  943 |   void gather(auto on_create) {\n  944 |     tbb::parallel_for((i64)0, NUM_SHARDS, [&](i64 i) {\n  945 |       Shard &shard = shards[i];\n  946 | \n  947 |       i64 count = 0;\n  948 |       for (Bin &bin : bins)\n  949 |         count += bin[i].size();\n  950 |       if (count == 0)\n  951 |         return;\n  952 | \n  953 |       shard.reserve(count);\n  954 | \n  955 |       for (Bin &bin : bins)\n  956 |         for (Pending &p : bin[i])\n  957 |           *p.slot = shard.insert(p.key, p.hash, on_create);\n  958 |     });\n  959 | \n  960 |     bins.clear();\n  961 |   }","lines":19,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L943-L961"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`start_stop_name(sym.name())` is evaluated for every relocation of every live\nsection - the single hottest loop in `--gc-sections`. `Symbol<E>::name()`\nis not a trivial accessor (it may have to scan for the name length) and the\nhelper then performs two `starts_with` comparisons, all to detect a symbol\nclass that is extremely rare. The check is also performed for symbols that were\nresolved to a real definition and therefore can never be a linker-synthesized\n`__start_`/`__stop_` marker.","fix":"Precompute the answer once per symbol instead of once per reference: set a\n`bool is_start_stop` flag (or cache the stripped name) on `Symbol<E>` when the\n`__start_`/`__stop_` symbols are synthesized, and gate the lookup on\n`sym.is_start_stop` in `visit_section`. Also skip the check entirely when\n`start_stop_map` is empty.","locations":[{"ref":"src/gc-sections.cc:125-131","code":"  125 | static std::string_view start_stop_name(std::string_view sym) {\n  126 |   if (sym.starts_with(\"__start_\"))\n  127 |     return sym.substr(8);\n  128 |   if (sym.starts_with(\"__stop_\"))\n  129 |     return sym.substr(7);\n  130 |   return \"\";\n  131 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L125-L131"},{"ref":"src/gc-sections.cc:174-192","code":"  174 |     // A reference to __start_<name> or __stop_<name> keeps every\n  175 |     // section named <name> alive, mirroring how those symbols are\n  176 |     // defined. A single such reference can keep an enormous number of\n  177 |     // sections alive, so we spread the fanout over threads instead\n  178 |     // of marking the sections one by one.\n  179 |     if (std::string_view name = start_stop_name(sym.name());\n  180 |         !name.empty()) {\n  181 |       if (auto it = start_stop_map.find(name);\n  182 |           it != start_stop_map.end()) {\n  183 |         // Mark and visit the sections with a nested parallel loop.\n  184 |         // As in mark() below, a section added to a feeder has\n  185 |         // already been marked, so a feeder's loop body must visit\n  186 |         // it unconditionally.\n  187 |         tbb::parallel_for_each(it->second, [&](InputSection<E> *isec) {\n  188 |           if (mark_section(isec))\n  189 |             visit_section(ctx, isec, feeder, 0, start_stop_map);\n  190 |         });\n  191 |       }\n  192 |     }","lines":19,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L174-L192"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`uniquify_cies` deduplicates CIE records with a serial O(n^2) scan: for every\nCIE of every object file it linearly walks the `cies` vector calling\n`cie_equals`, which itself compares the full CIE contents and all its\nrelocations. When most object files contribute a distinct CIE (mixed\ncompilers/personality routines, LTO partitions, `-fexceptions` with different\noptions), n grows with the number of input files and the pass becomes quadratic\n- 50k objects means billions of `cie_equals` calls on the critical path, and it\nis not parallelized at all.","fix":"Hash each CIE (contents plus the normalized relocation list produced by\n`cie_equals`) and use a hash map from digest to `icf_idx`, falling back to\n`cie_equals` only on digest collision. This turns the pass into O(n) and lets it\nbe parallelized per object file.","locations":[{"ref":"src/icf.cc:87-109","code":"   87 | template <typename E>\n   88 | static void uniquify_cies(Context<E> &ctx) {\n   89 |   Timer t(ctx, \"uniquify_cies\");\n   90 |   std::vector<CieRecord<E> *> cies;\n   91 | \n   92 |   auto find = [&](CieRecord<E> &cie) -> i64 {\n   93 |     for (i64 i = 0; i < cies.size(); i++)\n   94 |       if (cie_equals(cie, *cies[i]))\n   95 |         return i;\n   96 |     return -1;\n   97 |   };\n   98 | \n   99 |   for (ObjectFile<E> *file : ctx.objs) {\n  100 |     for (CieRecord<E> &cie : file->cies) {\n  101 |       if (i64 idx = find(cie); idx != -1) {\n  102 |         cie.icf_idx = idx;\n  103 |       } else {\n  104 |         cie.icf_idx = cies.size();\n  105 |         cies.push_back(&cie);\n  106 |       }\n  107 |     }\n  108 |   }\n  109 | }","lines":23,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/icf.cc#L87-L109"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`SymbolAux<E>` unconditionally carries a 24-byte `std::vector<u64>\nthunk_addrs`, but `thunk_addrs` is only ever touched by\n`Symbol<E>::add_thunk_addr()` / `get_thunk_addr()`, both of which are\n`requires needs_thunk<E>` (ARM32, ARM64, PPC). On x86-64, RISC-V, s390x, etc.\nthe member is dead weight that grows every aux record from 40 to 64 bytes.\n`SymbolAux` is allocated for every symbol that gets a GOT/PLT/dynsym slot, i.e.\nhundreds of thousands of objects on a large link, and the header comment\ndirectly above the struct says the split from `Symbol` exists precisely to save\nmemory.","fix":"Use the same `[[no_unique_address]]` extras pattern already used for\n`InputSectionExtras<E>`, `ObjectFileExtras<E>` and `ContextExtras<E>`:\n\n```cpp\ntemplate <typename E> struct SymbolAuxExtras {};\n\ntemplate <needs_thunk E>\nstruct SymbolAuxExtras<E> { std::vector<u64> thunk_addrs; };\n\ntemplate <typename E>\nstruct SymbolAux {\n  ...\n  [[no_unique_address]] SymbolAuxExtras<E> extra;\n};\n```","locations":[{"ref":"src/mold.h:311-329","code":"  311 | // Additional class members for dynamic symbols. Because most symbols\n  312 | // don't need them and we allocate tens of millions of symbol objects\n  313 | // for large programs, we separate them from `Symbol` class to save\n  314 | // memory.\n  315 | template <typename E>\n  316 | struct SymbolAux {\n  317 |   i32 got_idx = -1;\n  318 |   i32 gottp_idx = -1;\n  319 |   i32 tlsgd_idx = -1;\n  320 |   i32 tlsdesc_idx = -1;\n  321 |   i32 plt_idx = -1;\n  322 |   i32 pltgot_idx = -1;\n  323 |   i32 dynsym_idx = -1;\n  324 |   i32 opd_idx = -1;\n  325 |   u32 djb_hash = 0;\n  326 | \n  327 |   // For range extension thunks\n  328 |   std::vector<u64> thunk_addrs;\n  329 | };","lines":19,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L311-L329"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"In the `--pack-dyn-relocs=android` path, `RelDynSection<E>::update_shdr` materializes\n*all* dynamic relocations into `relocs` and re-encodes them from scratch:\n\n```\nrelocs.resize(num_relocs - num_relrs);\nwrite_relocs(ctx, relocs.data());\nandroid_encoded = encode_android<E>(relocs);\n```\n\n`update_shdr` is invoked once per chunk per layout pass and, on top of that,\n`set_osec_offsets` calls `ctx.reldyn->update_shdr(ctx)` in its own convergence loop\n(`passes.cc`). Every one of those iterations walks all output chunks, calls\n`Symbol::get_addr` for every relocation, `ranges::sort`s the entire relocation array\n(millions of `ElfRel` records) and re-runs the SLEB128 encoder. `encode_android` also\nsorts its input in place on every call even though the array is already sorted from\nthe previous pass.","fix":"Cache the encoding: keep the previous `relocs`/`android_encoded` and only re-run `write_relocs` + `encode_android` when an input to the encoding actually changed, or compute only the encoded *size* during the convergence loop and produce the final byte stream once, after the layout is frozen.","locations":[{"ref":"src/output-chunks.cc:477-493","code":"  477 |   if (ctx.arg.pack_dyn_relocs_android) {\n  478 |     relocs.resize(num_relocs - num_relrs);\n  479 |     write_relocs(ctx, relocs.data());\n  480 | \n  481 |     // APS2 uses SLEB128-encoded deltas, so .rela.dyn size may oscillate\n  482 |     // as addresses move. If a shrink is followed by a growth, stop\n  483 |     // shrinking and pad the encoded stream to converge.\n  484 |     android_encoded = encode_android<E>(relocs);\n  485 |     i64 old_size = this->shdr.sh_size;\n  486 |     if (old_size != 0 && old_size < (i64)android_encoded.size())\n  487 |       keep_android_size = true;\n  488 |     if (keep_android_size && android_encoded.size() < old_size)\n  489 |       android_encoded.resize(old_size);\n  490 |     this->shdr.sh_size = android_encoded.size();\n  491 |   } else {\n  492 |     this->shdr.sh_size = (num_relocs - num_relrs) * sizeof(ElfRel<E>);\n  493 |   }","lines":17,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L477-L493"},{"ref":"src/output-chunks.cc:1283-1291","code":" 1283 |   ranges::sort(rels, {}, [&](const ElfRel<E> &r) {\n 1284 |     return std::tuple{r.r_type, r.r_sym, r.r_offset};\n 1285 |   });\n 1286 | \n 1287 |   i64 prev_offset = 0;\n 1288 |   i64 prev_addend = 0;\n 1289 |   i64 i = 0;\n 1290 | \n 1291 |   while (i < (i64)rels.size()) {","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L1283-L1291"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`check_shlib_undefined()` calls `has_dso_definition()` for every unresolved,\nnon-weak undefined symbol of every shared library, and `has_dso_definition()`\nlinearly scans *all* symbols of *all* shared files:\n\n```\nfor (ArenaObjectPtr<SharedFile<E>> &file : ctx.dso_pool)\n  for (i64 i = 0; i < file->symbols.size(); i++)\n    if (file->symbols[i] == &sym && !file->elf_syms[i].is_undef())\n      return true;\n```\n\nThis is `O(#unresolved x #dsos x #syms_per_dso)`. On a large desktop link with\n`--no-allow-shlib-undefined` and a few hundred DSOs, each with tens of\nthousands of dynamic symbols, a handful of genuinely unresolved symbols is\nenough to add seconds of wall time; a thousand of them makes the pass appear\nto hang.","fix":"Precompute the answer once: before the loop, mark each `Symbol<E>` that has a non-undefined definition in some DSO (a single pass over `ctx.dso_pool`, setting a bit or filling an `unordered_set<Symbol<E> *>`), then have the check be an O(1) lookup.","locations":[{"ref":"src/passes.cc:1339-1346","code":" 1339 | template <typename E>\n 1340 | static bool has_dso_definition(Context<E> &ctx, Symbol<E> &sym) {\n 1341 |   for (ArenaObjectPtr<SharedFile<E>> &file : ctx.dso_pool)\n 1342 |     for (i64 i = 0; i < file->symbols.size(); i++)\n 1343 |       if (file->symbols[i] == &sym && !file->elf_syms[i].is_undef())\n 1344 |         return true;\n 1345 |   return false;\n 1346 | }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1339-L1346"},{"ref":"src/passes.cc:1384-1396","code":" 1384 |     tbb::parallel_for_each(ctx.dsos, [&](SharedFile<E> *file) {\n 1385 |       // Check if all undefined symbols have been resolved.\n 1386 |       for (i64 i = 0; i < file->elf_syms.size(); i++) {\n 1387 |         const ElfSym<E> &esym = file->elf_syms[i];\n 1388 |         Symbol<E> &sym = *file->symbols[i];\n 1389 | \n 1390 |         if (esym.is_undef() && !esym.is_weak() && !is_sparc_register(esym) &&\n 1391 |             (!sym.file || sym.visibility == STV_HIDDEN) &&\n 1392 |             !has_dso_definition(ctx, sym))\n 1393 |           Error(ctx) << *file << \": --no-allow-shlib-undefined: undefined symbol: \"\n 1394 |                      << sym;\n 1395 |       }\n 1396 |     });","lines":13,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1384-L1396"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`r_set_osec_offsets()` advances the file offset for every chunk, including\n`SHT_NOBITS` ones:\n\n```\nfor (Chunk<E> *chunk : ctx.chunks) {\n  offset = align_to(offset, chunk->shdr.sh_addralign);\n  chunk->shdr.sh_offset = offset;\n  offset += chunk->shdr.sh_size;   // also for SHT_NOBITS\n}\n```\n\n`set_file_offsets()` in the non-relocatable path correctly assigns a NOBITS\nsection an offset without consuming file space. As a result `mold -r` writes\n(and zero-fills) the entire `.bss`/`.tbss` into the output object. Measured\nwith mold 2.40.4 on an object containing a 10 MiB `.bss`:\n\n```\n$ ls -l b.o        1344 bytes\n$ mold -r -o br.o b.o && ls -l br.o   10487400 bytes\n$ ld   -r -o bl.o b.o && ls -l bl.o       1488 bytes\n```\n\n`OutputSection::copy_buf()` already returns early for `SHT_NOBITS`, so the\nspace is pure waste of disk, page cache and write time for every `-r` link.","fix":"Skip the size accumulation for NOBITS chunks:\n```\nfor (Chunk<E> *chunk : ctx.chunks) {\n  if (chunk->shdr.sh_type == SHT_NOBITS) {\n    chunk->shdr.sh_offset = offset;\n    continue;\n  }\n  offset = align_to(offset, chunk->shdr.sh_addralign);\n  chunk->shdr.sh_offset = offset;\n  offset += chunk->shdr.sh_size;\n}\n```","locations":[{"ref":"src/relocatable.cc:140-149","code":"  140 | template <typename E>\n  141 | static u64 r_set_osec_offsets(Context<E> &ctx) {\n  142 |   u64 offset = 0;\n  143 |   for (Chunk<E> *chunk : ctx.chunks) {\n  144 |     offset = align_to(offset, chunk->shdr.sh_addralign);\n  145 |     chunk->shdr.sh_offset = offset;\n  146 |     offset += chunk->shdr.sh_size;\n  147 |   }\n  148 |   return offset;\n  149 | }","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/relocatable.cc#L140-L149"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"Both demanglers build a temporary `std::string` on every call purely to obtain a NUL-terminated\npointer: `abi::__cxa_demangle(std::string(name).c_str(), ...)` and\n`rust_demangle(std::string(name).c_str(), 0)`. `demangle_cpp()` is called once per defined symbol\ninside a `parallel_for_each` over the whole symbol map when `extern \"C++\"` version-script patterns\nare present (`src/passes.cc:2238`, `src/passes.cc:2467`), so this is one heap allocation +\ncopy per symbol on a hot parallel path — and it is paid even for the overwhelmingly common case\nwhere `__cxa_demangle` immediately fails.\n\n`demangle_cpp()` at least short-circuits on `name.starts_with(\"_Z\")`; `demangle_rust()` does not\nshort-circuit at all.","fix":"Symbol names in mold come from a NUL-terminated `.strtab` mapping, so the copy is usually\navoidable. Either pass a `const char *` down from the caller, or keep a `thread_local std::string`\nscratch buffer and `assign()` into it instead of constructing a fresh string each call:\n\n```cpp\n  static thread_local std::string tmp;\n  tmp.assign(name);\n  char *p = abi::__cxa_demangle(tmp.c_str(), buf, &buflen, &status);\n```","locations":[{"ref":"lib/demangle.cc:19-27","code":"   19 | #ifndef _WIN32\n   20 |   if (name.starts_with(\"_Z\")) {\n   21 |     int status;\n   22 |     char *p = abi::__cxa_demangle(std::string(name).c_str(), buf, &buflen, &status);\n   23 |     if (status == 0) {\n   24 |       buf = p;\n   25 |       return p;\n   26 |     }\n   27 |   }","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/demangle.cc#L19-L27"},{"ref":"lib/demangle.cc:33-40","code":"   33 | std::optional<std::string_view> demangle_rust(std::string_view name) {\n   34 |   static thread_local char *buf;\n   35 |   free(buf);\n   36 |   buf = rust_demangle(std::string(name).c_str(), 0);\n   37 |   if (buf)\n   38 |     return buf;\n   39 |   return {};\n   40 | }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/demangle.cc#L33-L40"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Arm32ExidxSection<E>::remove_duplicate_entries()` calls `get_contents(ctx)` purely to take\n`.size()` and throws the vector away; `copy_buf()` then calls `get_contents(ctx)` again to produce\nthe same bytes. `get_contents()` is not cheap: it allocates the whole `.ARM.exidx` image, runs\n`output_section.write_to()` (which applies every relocation in the section), does two\n`tbb::parallel_for` passes, a full sort and a `unique`. All of that is done twice.\n\n`get_contents()` also mutates shared state as a side effect — `output_section.shdr.sh_addr =\nthis->shdr.sh_addr;` — which is surprising for a `get_*` accessor and means the size-only call\nleaves the wrapped `OutputSection`'s address field modified.","fix":"Cache the computed contents on the object:\n\n```cpp\ntemplate <>\nvoid Arm32ExidxSection<E>::remove_duplicate_entries(Context<E> &ctx) {\n  contents = get_contents(ctx);\n  this->shdr.sh_size = contents.size();\n}\n\ntemplate <>\nvoid Arm32ExidxSection<E>::copy_buf(Context<E> &ctx) {\n  write_vector(ctx.buf + this->shdr.sh_offset, contents);\n}\n```\n\nand move the `output_section.shdr.sh_addr` assignment out of `get_contents()` into the caller so\nthe accessor has no side effects.","locations":[{"ref":"src/arch-arm32.cc:837-847","code":"  837 | template <>\n  838 | void Arm32ExidxSection<E>::remove_duplicate_entries(Context<E> &ctx) {\n  839 |   this->shdr.sh_size = get_contents(ctx).size();\n  840 | }\n  841 | \n  842 | template <>\n  843 | void Arm32ExidxSection<E>::copy_buf(Context<E> &ctx) {\n  844 |   std::vector<u8> contents = get_contents(ctx);\n  845 |   assert(this->shdr.sh_size == contents.size());\n  846 |   write_vector(ctx.buf + this->shdr.sh_offset, contents);\n  847 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L837-L847"},{"ref":"src/arch-arm32.cc:768-835","code":"  768 | template <>\n  769 | std::vector<u8> Arm32ExidxSection<E>::get_contents(Context<E> &ctx) {\n  770 |   // .ARM.exidx records consists of a signed 31-bit relative address\n  771 |   // and a 32-bit value. The relative address indicates the start\n  772 |   // address of a function that the record covers. The value is one of\n  773 |   // the followings:\n  774 |   //\n  775 |   // 1. CANTUNWIND indicating that there's no unwinding info for the function,\n  776 |   // 2. a compact unwinding record encoded into a 32-bit value, or\n  777 |   // 3. a 31-bit relative address which points to a larger record in\n  778 |   //    the .ARM.extab section.\n  779 |   //\n  780 |   // CANTUNWIND is value 1. The most significant bit is set in (2) but\n  781 |   // not in (3). So we can distinguished them just by looking at a value.\n  782 |   const u32 CANTUNWIND = 1;\n  783 | \n  784 |   struct Entry {\n  785 |     U32<E> addr;\n  786 |     U32<E> val;\n  787 |   };\n  788 | \n  789 |   // We reserve one extra slot for the sentinel\n  790 |   i64 num_entries = output_section.shdr.sh_size / sizeof(Entry) + 1;\n  791 |   std::vector<u8> buf(num_entries * sizeof(Entry));\n  792 |   Entry *ent = (Entry *)buf.data();\n  793 | \n  794 |   // Write section contents to the buffer\n  795 |   output_section.shdr.sh_addr = this->shdr.sh_addr;\n  796 |   output_section.write_to(ctx, buf.data());\n  797 | \n  798 |   // Fill in sentinel fields\n  799 |   u64 sentinel_addr = this->shdr.sh_addr + sizeof(Entry) * (num_entries - 1);\n  800 |   ent[num_entries - 1].addr = get_text_end(ctx) - sentinel_addr;\n  801 |   ent[num_entries - 1].val = CANTUNWIND;\n  802 | \n  803 |   // Entry's addresses are relative to themselves. In order to sort\n  804 |   // records by address, we first translate them so that the addresses\n  805 |   // are relative to the beginning of the section.\n  806 |   auto is_relative = [](u32 val) {\n  807 |     return val != CANTUNWIND && !(val & 0x8000'0000);\n  808 |   };\n  809 | \n  810 |   tbb::parallel_for((i64)0, num_entries, [&](i64 i) {\n  811 |     i64 offset = sizeof(Entry) * i;\n  812 |     ent[i].addr = sign_extend(ent[i].addr, 31) + offset;\n  813 |     if (is_relative(ent[i].val))\n  814 |       ent[i].val = 0x7fff'ffff & (ent[i].val + offset);\n  815 |   });\n  816 | \n  817 |   ranges::sort(ent, ent + num_entries, {}, &Entry::addr);\n  818 | \n  819 |   // Remove duplicate adjacent entries. That is, if two adjacent functions\n  820 |   // have the same compact unwind info or are both CANTUNWIND, we can\n  821 |   // merge them into a single address range.\n  822 |   auto tail = ranges::unique(ent, ent + num_entries, {}, &Entry::val);\n  823 |   num_entries -= tail.size();\n  824 |   buf.resize(num_entries * sizeof(Entry));\n  825 | \n  826 |   // Make addresses relative to themselves.\n  827 |   tbb::parallel_for((i64)0, num_entries, [&](i64 i) {\n  828 |     i64 offset = sizeof(Entry) * i;\n  829 |     ent[i].addr = 0x7fff'ffff & (ent[i].addr - offset);\n  830 |     if (is_relative(ent[i].val))\n  831 |       ent[i].val = 0x7fff'ffff & (ent[i].val - offset);\n  832 |   });\n  833 | \n  834 |   return buf;\n  835 | }","lines":68,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L768-L835"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Every reference to a `__start_`/`__stop_` symbol spawns a nested\n`tbb::parallel_for_each` over the matching sections. Such groups are usually\ntiny (a handful of sections), so the task-spawning overhead dominates, and the\nnested loop is executed once per *reference*, not once per name - a program with\nN references to `__start_foo` runs N nested parallel loops over the same vector,\nwith `mark_section` failing for all but the first.","fix":"Handle the fan-out serially (feeding into `feeder` for the bulk of the work) or\nonly fall back to `tbb::parallel_for_each` when `it->second.size()` exceeds a\nthreshold. Better still, mark each `__start_`/`__stop_` symbol as already\nexpanded with a `test_and_set` flag so the group is walked at most once.","locations":[{"ref":"src/gc-sections.cc:187-191","code":"  187 |         tbb::parallel_for_each(it->second, [&](InputSection<E> *isec) {\n  188 |           if (mark_section(isec))\n  189 |             visit_section(ctx, isec, feeder, 0, start_stop_map);\n  190 |         });\n  191 |       }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L187-L191"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`detect_machine_type()` calls `open_file()` on command-line inputs to sniff the\nmachine type; every successful call creates a *new* `MappedFile` (with its own\n`mmap`) and pushes it into `ctx.mf_pool`. The same files are then opened and\nmapped a second time by `read_input_files()`. The same duplication happens\nwhenever the same library appears more than once on the command line (`-lfoo`\ntwice, or a library reachable both directly and through a `GROUP(...)` script):\n`open_file()` has no path-to-`MappedFile` cache, so a big DSO can be mapped\nseveral times and each mapping is kept alive until the end of the link.","fix":"Add a `std::unordered_map<std::string, MappedFile *>` cache (guarded by a mutex\nor as a `tbb::concurrent_hash_map`) inside `open_file()` keyed on the resolved\npath, so repeated opens of the same file share one mapping.","locations":[{"ref":"src/main.cc:153-174","code":"  153 | template <typename E>\n  154 | static std::string_view\n  155 | detect_machine_type(Context<E> &ctx, std::span<ReaderJob> jobs) {\n  156 |   for (ReaderJob &job : jobs)\n  157 |     if (!job.is_lib)\n  158 |       if (MappedFile *mf = open_file(ctx, job.name))\n  159 |         if (get_file_type(ctx, mf) != FileType::TEXT)\n  160 |           if (std::string_view target = get_machine_type(ctx, job.rctx, mf);\n  161 |               !target.empty())\n  162 |             return target;\n  163 | \n  164 |   for (ReaderJob &job : jobs)\n  165 |     if (!job.is_lib)\n  166 |       if (MappedFile *mf = open_file(ctx, job.name))\n  167 |         if (get_file_type(ctx, mf) == FileType::TEXT)\n  168 |           if (std::string_view target =\n  169 |               Script(ctx, job.rctx, mf).get_script_output_type();\n  170 |               !target.empty())\n  171 |             return target;\n  172 | \n  173 |   Fatal(ctx) << \"-m option is missing\";\n  174 | }","lines":22,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/main.cc#L153-L174"},{"ref":"src/main.cc:274-281","code":"  274 |     // Everything else is a command line argument that we need to open.\n  275 |     MappedFile *mf;\n  276 |     if (job.is_lib) {\n  277 |       mf = find_library(ctx, rctx, job.name);\n  278 |       mf->given_fullpath = false;\n  279 |     } else {\n  280 |       mf = must_open_file(ctx, job.name);\n  281 |     }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/main.cc#L274-L281"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`SectionFragment<E>` uses `i64 offset` for an offset inside a single output\nsection. The struct is embedded in `ConcurrentMap<SectionFragment<E>>::Entry`,\none instance per unique mergeable string, i.e. tens of millions on a large\nC++ link, and the `i64` also forces the struct's alignment to 8 despite the\nexplicit `__attribute__((aligned(4)))`, so the struct is 16 bytes where 12\nwould do. The class even carries an `is_32bit` flag whose entire purpose is to\nguarantee that a subset of fragments lives within the first 2^32 bytes of the\nsection, so a 64-bit offset is not needed for the common case either.","fix":"Shrink `offset` to `u32` (with the existing `is_32bit` partitioning in\n`MergedSection<E>::compute_section_size()` already splitting the section into a\nsub-4 GiB region and the rest, either keep two 32-bit fields or add an explicit\n`Fatal` when an output mergeable section exceeds 4 GiB). Measure `sizeof`\nbefore/after; the `alignas(32)` on `ConcurrentMap::Entry` means the win only\nmaterializes if `Entry` drops below 32 bytes.","locations":[{"ref":"src/mold.h:282-309","code":"  282 | template <typename E>\n  283 | struct __attribute__((aligned(4))) SectionFragment {\n  284 |   SectionFragment(Context<E> &ctx, MergedSection<E> &sec, bool is_alive)\n  285 |     : output_section_arena_idx(ctx.arena.get_index(&sec)),\n  286 |       is_alive(is_alive) {}\n  287 | \n  288 |   u64 get_addr(Context<E> &ctx) const {\n  289 |     return get_output_section(ctx).shdr.sh_addr + offset;\n  290 |   }\n  291 | \n  292 |   MergedSection<E> &get_output_section(Context<E> &ctx) const {\n  293 |     return *ctx.arena.template get_pointer<MergedSection<E>>(\n  294 |       output_section_arena_idx);\n  295 |   }\n  296 | \n  297 |   i64 offset = -1;\n  298 | \n  299 |   // SectionFragment lives in a separately mapped hash table, so it cannot use\n  300 |   // ArenaPtr.\n  301 |   u32 output_section_arena_idx;\n  302 | \n  303 |   Atomic<u8> p2align = 0;\n  304 |   Atomic<bool> is_alive = false;\n  305 | \n  306 |   // True if this fragment must be placed within 2^32 bytes from the\n  307 |   // start of the output section.\n  308 |   Atomic<bool> is_32bit = false;\n  309 | };","lines":28,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L282-L309"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`DynamicSection<E>::update_shdr` builds the entire dynamic section just to learn its\nlength and throws the vector away, and `copy_buf` builds it a second time.\n`create_dynamic_section` is not cheap: it performs three `find_chunk` calls, each a\nlinear scan over `ctx.chunks`, plus a `find_string` hash lookup per `DT_NEEDED`, and\n`update_shdr` runs once per chunk per layout pass (and `compute_section_headers`\nitself calls `update_shdr` on every chunk twice). The same pattern exists in\n`OutputPhdr::update_shdr`, which re-sorts all `SHF_ALLOC` chunks on every pass.","fix":"Cache the vector produced by `create_dynamic_section` in the `DynamicSection` object (as `OutputPhdr` already does with `phdrs`) and have `copy_buf` write the cached copy after asserting its size, instead of recomputing it.","locations":[{"ref":"src/output-chunks.cc:925-939","code":"  925 | template <typename E>\n  926 | void DynamicSection<E>::update_shdr(Context<E> &ctx) {\n  927 |   if (ctx.arg.static_ && !ctx.arg.pie)\n  928 |     return;\n  929 | \n  930 |   this->shdr.sh_size = create_dynamic_section(ctx).size() * sizeof(Word<E>);\n  931 |   this->shdr.sh_link = ctx.dynstr->shndx;\n  932 | }\n  933 | \n  934 | template <typename E>\n  935 | void DynamicSection<E>::copy_buf(Context<E> &ctx) {\n  936 |   std::vector<Word<E>> contents = create_dynamic_section(ctx);\n  937 |   assert(this->shdr.sh_size == contents.size() * sizeof(Word<E>));\n  938 |   write_vector(ctx.buf + this->shdr.sh_offset, contents);\n  939 | }","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L925-L939"},{"ref":"src/output-chunks.cc:810-826","code":"  810 |   if (find_chunk(ctx, SHT_INIT_ARRAY)) {\n  811 |     define(DT_INIT_ARRAY, ctx.__init_array_start->value);\n  812 |     define(DT_INIT_ARRAYSZ,\n  813 |            ctx.__init_array_end->value - ctx.__init_array_start->value);\n  814 |   }\n  815 | \n  816 |   if (find_chunk(ctx, SHT_PREINIT_ARRAY)) {\n  817 |     define(DT_PREINIT_ARRAY, ctx.__preinit_array_start->value);\n  818 |     define(DT_PREINIT_ARRAYSZ,\n  819 |            ctx.__preinit_array_end->value - ctx.__preinit_array_start->value);\n  820 |   }\n  821 | \n  822 |   if (find_chunk(ctx, SHT_FINI_ARRAY)) {\n  823 |     define(DT_FINI_ARRAY, ctx.__fini_array_start->value);\n  824 |     define(DT_FINI_ARRAYSZ,\n  825 |            ctx.__fini_array_end->value - ctx.__fini_array_start->value);\n  826 |   }","lines":17,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L810-L826"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`add_start_stop()` throws away the `Symbol<E> *` returned by `add()` and then\nre-derives it, calling `save_string()` a second time. `save_string()` copies\nthe string into the arena, so every `__start_`/`__stop_` symbol permanently\nleaks a duplicate copy of its name into the arena and pays a second hash\nlookup in the global symbol table. With `--physical-image-base` four such\nsymbols are created per eligible output section.","fix":"Use the value `add()` already returns:\nbefore\n```\nadd(save_string(ctx, s));\nif (ctx.arg.z_start_stop_visibility_protected)\n  get_symbol(ctx, save_string(ctx, s))->is_exported = true;\n```\nafter\n```\nSymbol<E> *sym = add(save_string(ctx, s));\nif (ctx.arg.z_start_stop_visibility_protected)\n  sym->is_exported = true;\n```","locations":[{"ref":"src/passes.cc:1015-1019","code":" 1015 |   auto add_start_stop = [&](std::string s) {\n 1016 |     add(save_string(ctx, s));\n 1017 |     if (ctx.arg.z_start_stop_visibility_protected)\n 1018 |       get_symbol(ctx, save_string(ctx, s))->is_exported = true;\n 1019 |   };","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1015-L1019"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`print_dependencies()` constructs a fresh `std::unordered_set<void *>` for\n*every* input section of every object file, then inserts into it while\nscanning relocations. For a large link this is millions of hash-table\nconstructions/destructions in a serial loop. The pass is opt-in\n(`--print-dependencies`), but it is unusably slow on the kind of link where\none actually wants a dependency dump.","fix":"Hoist the set out of the loop and `clear()` it per section (it keeps its buckets), or replace it with a per-symbol epoch counter/`visited` stamp. The outer loop over `ctx.objs` can also be a `tbb::parallel_for_each` with per-thread buffered output.","locations":[{"ref":"src/passes.cc:1146-1165","code":" 1146 |   for (ObjectFile<E> *file : ctx.objs) {\n 1147 |     for (InputSection<E> *isec : file->sections) {\n 1148 |       if (!isec)\n 1149 |         continue;\n 1150 | \n 1151 |       std::unordered_set<void *> visited;\n 1152 | \n 1153 |       for (const ElfRel<E> &r : isec->get_rels(ctx)) {\n 1154 |         if (r.r_type == R_NONE || file->elf_syms.size() <= r.r_sym)\n 1155 |           continue;\n 1156 | \n 1157 |         ElfSym<E> &esym = file->elf_syms[r.r_sym];\n 1158 |         Symbol<E> &sym = *file->symbols[r.r_sym];\n 1159 | \n 1160 |         if (esym.is_undef() && sym.file && sym.file != file &&\n 1161 |             visited.insert((void *)&sym).second)\n 1162 |           println(*isec, sym, esym);\n 1163 |       }\n 1164 |     }\n 1165 |   }","lines":20,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1146-L1165"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`copy_chunks()` builds a `std::string` for every chunk purely to name a\ntimer, and `create_output_symtab()` builds a `std::string` per thunk\n(`\"thunk\" + std::to_string(n++)`) even when `--strip-all`-style output means\nthe name is never emitted. The former allocates once per output chunk on the\nhot copy path and the timer records are kept alive in\n`ctx.timer_records` even when `--perf` is not given.","fix":"Only construct the sub-timer when `ctx.arg.perf` is set (or make `Timer` take a `std::string_view` and store the chunk name), and assign thunk names lazily in the symtab-population path that actually needs them.","locations":[{"ref":"src/passes.cc:2123-2127","code":" 2123 |   auto copy = [&](Chunk<E> &chunk) {\n 2124 |     std::string name = chunk.name.empty() ? \"(header)\" : std::string(chunk.name);\n 2125 |     Timer t2(ctx, name, &t);\n 2126 |     chunk.copy_buf(ctx);\n 2127 |   };","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L2123-L2127"},{"ref":"src/passes.cc:2285-2291","code":" 2285 |   if constexpr (needs_thunk<E>) {\n 2286 |     i64 n = 0;\n 2287 |     for (Chunk<E> *chunk : ctx.chunks)\n 2288 |       if (OutputSection<E> *osec = chunk->to_osec())\n 2289 |         for (std::unique_ptr<Thunk<E>> &thunk : osec->thunks)\n 2290 |           thunk->name = \"thunk\" + std::to_string(n++);\n 2291 |   }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L2285-L2291"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`get_random_bytes()` constructs a fresh `std::random_device` on every call. On libstdc++ that\nopens (and closes) `/dev/urandom` — or executes `RDSEED` setup — per call, which is orders of\nmagnitude more expensive than the few bytes it produces. `TarWriter`-style one-shot use is fine,\nbut the function's signature invites per-object use.\n\nSeparately, `lib/tar.cc:66` constructs a whole `std::string(\" path=\\n\")` just to read its\ncompile-time-known length of 7, and `encode_path()` takes both of its `std::string` parameters by\nvalue only to concatenate them.","fix":"Make the generator a function-local `static thread_local std::random_device rand;` in\n`get_random_bytes()`, and replace `std::string(\" path=\\n\").size()` with the literal\n`\" path=\\n\"sv.size()` (or just `7`). Change `encode_path(std::string basedir, std::string path)`\nto take `std::string_view` parameters.","locations":[{"ref":"lib/random.cc:7-18","code":"    7 | void get_random_bytes(u8 *buf, i64 size) {\n    8 |   std::random_device rand;\n    9 |   i64 i = 0;\n   10 | \n   11 |   for (; i < size - 4; i += 4) {\n   12 |     u32 val = rand();\n   13 |     memcpy(buf + i, &val, 4);\n   14 |   }\n   15 | \n   16 |   u32 val = rand();\n   17 |   memcpy(buf + i, &val, size - i);\n   18 | }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/random.cc#L7-L18"},{"ref":"lib/tar.cc:60-70","code":"   60 | static std::string encode_path(std::string basedir, std::string path) {\n   61 |   path = path_clean(basedir + \"/\" + path);\n   62 | \n   63 |   // Construct a string which contains something like\n   64 |   // \"16 path=foo/bar\\n\" where 16 is the size of the string\n   65 |   // including the size string itself.\n   66 |   i64 len = std::string(\" path=\\n\").size() + path.size();\n   67 |   i64 total = std::to_string(len).size() + len;\n   68 |   total = std::to_string(total).size() + len;\n   69 |   return std::to_string(total) + \" path=\" + path + \"\\n\";\n   70 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/tar.cc#L60-L70"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`get_eflags` copies the entire `ctx.objs` vector just to drop one element:\n`std::vector<ObjectFile<E> *> objs = ctx.objs; std::erase(objs, ctx.internal_obj);`. For a\nlarge link this allocates and copies a vector with hundreds of thousands of pointers,\nalthough the function only needs to iterate and skip one entry.","fix":"Iterate over `ctx.objs` directly and `continue` on `ctx.internal_obj`, tracking the first\nnon-internal object as the reference for the diagnostics instead of materializing a copy.","locations":[{"ref":"src/arch-riscv.cc:869-892","code":"  869 | template <>\n  870 | u64 get_eflags(Context<E> &ctx) {\n  871 |   std::vector<ObjectFile<E> *> objs = ctx.objs;\n  872 |   std::erase(objs, ctx.internal_obj);\n  873 | \n  874 |   if (objs.empty())\n  875 |     return 0;\n  876 | \n  877 |   u32 ret = objs[0]->get_eflags();\n  878 |   for (i64 i = 1; i < objs.size(); i++) {\n  879 |     u32 flags = objs[i]->get_eflags();\n  880 |     if (flags & EF_RISCV_RVC)\n  881 |       ret |= EF_RISCV_RVC;\n  882 | \n  883 |     if ((flags & EF_RISCV_FLOAT_ABI) != (ret & EF_RISCV_FLOAT_ABI))\n  884 |       Error(ctx) << *objs[i] << \": cannot link object files with different\"\n  885 |                  << \" floating-point ABI from \" << *objs[0];\n  886 | \n  887 |     if ((flags & EF_RISCV_RVE) != (ret & EF_RISCV_RVE))\n  888 |       Error(ctx) << *objs[i] << \": cannot link object files with different\"\n  889 |                  << \" EF_RISCV_RVE from \" << *objs[0];\n  890 |   }\n  891 |   return ret;\n  892 | }","lines":24,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L869-L892"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`operator<<(std::ostream &, const InputFile<E> &)` writes\n`obj->filename + \")\"`, which allocates and copies a whole `std::string` just to\nappend one character, instead of streaming the two pieces. This runs on every\ndiagnostic and on every `--trace` line.","fix":"```c++\n-    out << path_clean(obj->archive_name) << \"(\" << obj->filename + \")\";\n+    out << path_clean(obj->archive_name) << \"(\" << obj->filename << \")\";\n```","locations":[{"ref":"src/input-files.cc:1511-1516","code":" 1511 |   ObjectFile<E> *obj = (ObjectFile<E> *)&file;\n 1512 |   if (obj->archive_name == \"\")\n 1513 |     out << path_clean(obj->filename);\n 1514 |   else\n 1515 |     out << path_clean(obj->archive_name) << \"(\" << obj->filename + \")\";\n 1516 |   return out;","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L1511-L1516"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"`InputFile<E>::get_data(Context<E> &ctx, i64 idx)` is defined but would not even\ncompile if it were instantiated: its body calls the two-argument overload with\na single argument.\n\n```cpp\ninline std::span<T> InputFile<E>::get_data(Context<E> &ctx, i64 idx) {\n  if (elf_sections.size() <= idx)\n    Fatal(ctx) << *this << \": invalid section index\";\n  return this->template get_data<T>(elf_sections[idx]);   // missing `ctx`\n}\n```\n\nThe only reason this builds is that it is a member template of a class\ntemplate and is never instantiated - every call site in the tree passes an\n`ElfShdr<E>` (verified across `src/*.cc`). The declaration therefore also\nmisleads readers into thinking an index-based accessor exists.","fix":"Delete the overload (declaration at `src/mold.h:1895-1896` and definition at\n`src/mold.h:3492-3498`), or fix the body to\n`return this->template get_data<T>(ctx, elf_sections[idx]);` and add a call\nsite / test if it is meant to stay.","locations":[{"ref":"src/mold.h:3635-3641","code":" 3635 | template <typename E>\n 3636 | template <typename T>\n 3637 | inline std::span<T> InputFile<E>::get_data(Context<E> &ctx, i64 idx) {\n 3638 |   if (elf_sections.size() <= idx)\n 3639 |     Fatal(ctx) << *this << \": invalid section index\";\n 3640 |   return this->template get_data<T>(elf_sections[idx]);\n 3641 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3635-L3641"},{"ref":"src/mold.h:1957-1958","code":" 1957 |   template <typename T>\n 1958 |   std::span<T> get_data(Context<E> &ctx, i64 idx);","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L1957-L1958"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`AhoCorasick::add()` encodes begin/end-of-string markers (`\"foo\"` → `\"\\0foo\\0\"`, `\"*foo\"` →\n`\"foo\\0\"`, `\"foo*\"` → `\"\\0foo\"`), and `AhoCorasick::find()` correspondingly calls `walk('\\0')`\nbefore and after the input. None of the marker branches can ever be taken from the only caller:\n`Glob::add()` routes exact patterns to `exacts`, `foo*` to `prefixes` and `*foo` to `suffixes`\n*before* consulting `AhoCorasick::can_handle()`, so the automaton only ever receives patterns of\nthe form `*foo*`, for which both `pat.starts_with('*')` and `pat.ends_with('*')` are true. The two\n`walk('\\0')` calls in `find()` are therefore pure overhead on every query, and the marker logic is\nuntested dead code.","fix":"Either delete the marker handling and the two `walk('\\0')` calls (documenting that `AhoCorasick`\ndoes substring matching only), or route exact/prefix/suffix patterns through it as well so the\ncode is exercised. If the markers are kept for generality, add a unit test that feeds `add(\"foo\")`\nand `add(\"foo*\")` directly.","locations":[{"ref":"lib/aho-corasick.cc:97-111","code":"   97 |   // We handle \"foo\" as if \"\\0foo\\0\", \"*foo\" as if \"foo\\0\", \"foo*\" as\n   98 |   // if \"\\0foo\", and \"*foo*\" as if \"foo\". Aho-Corasick can do only\n   99 |   // substring matching, so we use \\0 as a beginning/end-of-string\n  100 |   // markers.\n  101 |   if (!pat.starts_with('*'))\n  102 |     walk('\\0');\n  103 |   for (u8 c : pat)\n  104 |     if (c != '*')\n  105 |       walk(c);\n  106 |   if (!pat.ends_with('*'))\n  107 |     walk('\\0');\n  108 | \n  109 |   nodes[idx].value = std::max(nodes[idx].value, val);\n  110 |   return true;\n  111 | }","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/aho-corasick.cc#L97-L111"},{"ref":"lib/glob.cc:280-303","code":"  280 |   if (pat == \"*\") {\n  281 |     match_all = std::max(match_all, val);\n  282 |     return true;\n  283 |   }\n  284 | \n  285 |   if (is_literal(pat)) {\n  286 |     exacts.push_back({std::string(pat), val});\n  287 |     return true;\n  288 |   }\n  289 | \n  290 |   if (pat.ends_with('*') && is_literal(pat.substr(0, pat.size() - 1))) {\n  291 |     prefixes.push_back({std::string(pat.substr(0, pat.size() - 1)), val});\n  292 |     return true;\n  293 |   }\n  294 | \n  295 |   if (pat.starts_with('*') && is_literal(pat.substr(1))) {\n  296 |     suffixes.push_back({std::string(pat.substr(1)), val});\n  297 |     return true;\n  298 |   }\n  299 | \n  300 |   // If the pattern requires only a single substring search, the\n  301 |   // Aho-Corasick algorithm is even faster than our glob matcher.\n  302 |   if (aho_corasick.can_handle(pat))\n  303 |     return aho_corasick.add(pat, val);","lines":24,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/glob.cc#L280-L303"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"The \"ignored options\" block re-lists six options that are already handled earlier in the same\n`if`/`else if` chain, so these branches can never be reached: `--color-diagnostics`\n(handled at line 1072), `--eh-frame-hdr` (1018), `--fatal-warnings` (1265),\n`--enable-new-dtags` (1089), `--disable-new-dtags` (1091), `--warn-once` (1083). `-EL`\nadditionally appears twice within the block itself (lines 1462 and 1486). The duplicates are\nmisleading: a reader may believe these options are ignored when they in fact take effect.","fix":"Delete the unreachable branches:\n```\n-    } else if (read_flag(\"color-diagnostics\")) {\n-    } else if (read_flag(\"eh-frame-hdr\")) {\n ...\n-    } else if (read_flag(\"fatal-warnings\")) {\n-    } else if (read_flag(\"enable-new-dtags\")) {\n-    } else if (read_flag(\"disable-new-dtags\")) {\n ...\n-    } else if (read_flag(\"EL\")) {\n-    } else if (read_flag(\"warn-once\")) {\n```\n(keeping the first `--EL` at line 1462).","locations":[{"ref":"src/cmdline.cc:1457-1478","code":" 1457 |     } else if (read_flag(\"verbose\")) {\n 1458 |     } else if (read_flag(\"color-diagnostics\")) {\n 1459 |     } else if (read_flag(\"eh-frame-hdr\")) {\n 1460 |     } else if (read_flag(\"start-group\")) {\n 1461 |     } else if (read_flag(\"end-group\")) {\n 1462 |     } else if (read_flag(\"(\")) {\n 1463 |     } else if (read_flag(\")\")) {\n 1464 |     } else if (read_flag(\"fatal-warnings\")) {\n 1465 |     } else if (read_flag(\"enable-new-dtags\")) {\n 1466 |     } else if (read_flag(\"disable-new-dtags\")) {\n 1467 |     } else if (read_flag(\"nostdlib\")) {\n 1468 |     } else if (read_flag(\"no-add-needed\")) {\n 1469 |     } else if (read_flag(\"no-call-graph-profile-sort\")) {\n 1470 |     } else if (read_flag(\"no-copy-dt-needed-entries\")) {\n 1471 |     } else if (read_arg(\"sort-section\")) {\n 1472 |     } else if (read_flag(\"sort-common\")) {\n 1473 |     } else if (read_flag(\"dc\")) {\n 1474 |     } else if (read_flag(\"dp\")) {\n 1475 |     } else if (read_flag(\"fix-cortex-a53-835769\")) {\n 1476 |     } else if (read_flag(\"fix-cortex-a53-843419\")) {\n 1477 |     } else if (read_flag(\"EL\")) {\n 1478 |     } else if (read_flag(\"warn-once\")) {","lines":22,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L1457-L1478"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`isec->file.symbols[rel.r_sym]` is null-checked in the FDE loop but\nunconditionally dereferenced a few lines later in the main relocation loop, and\n`enqueue_symbol` also starts with `if (sym)`. `ObjectFile<E>::symbols` is fully\npopulated during `initialize_symbols` (undefined and discarded-COMDAT entries\nget real `Symbol` pointers, never `nullptr`), so the checks are dead. The\ninconsistency is misleading: a reader concludes the array may contain nulls and\nthat the unchecked dereference is a latent null dereference.","fix":"Drop the dead null checks and make all three sites consistent:\n```cpp\nfor (const ElfRel<E> &rel : fde.get_rels(isec->file).subspan(1))\n  mark(isec->file.symbols[rel.r_sym]->get_input_section());\n```\nIf the entries genuinely can be null, add the check to the main relocation loop\ninstead of removing it.","locations":[{"ref":"src/gc-sections.cc:74-81","code":"   74 |   auto enqueue_symbol = [&](Symbol<E> *sym) {\n   75 |     if (sym) {\n   76 |       if (SectionFragment<E> *frag = sym->get_frag())\n   77 |         frag->is_alive = true;\n   78 |       else\n   79 |         enqueue_section(sym->get_input_section());\n   80 |     }\n   81 |   };","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L74-L81"}]},

onst { return get_opd_idx(ctx) != -1; }","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3073-L3087"},{"ref":"src/mold.h:3916-3954","code":" 3916 | template <typename E>\n 3917 | inline i32 Symbol<E>::get_got_idx(Context<E> &ctx) const {\n 3918 |   return aux ? aux->got_idx : -1;\n 3919 | }\n 3920 | \n 3921 | template <typename E>\n 3922 | inline i32 Symbol<E>::get_gottp_idx(Context<E> &ctx) const {\n 3923 |   return aux ? aux->gottp_idx : -1;\n 3924 | }\n 3925 | \n 3926 | template <typename E>\n 3927 | inline i32 Symbol<E>::get_tlsgd_idx(Context<E> &ctx) const {\n 3928 |   return aux ? aux->tlsgd_idx : -1;\n 3929 | }\n 3930 | \n 3931 | template <typename E>\n 3932 | inline i32 Symbol<E>::get_tlsdesc_idx(Context<E> &ctx) const {\n 3933 |   return aux ? aux->tlsdesc_idx : -1;\n 3934 | }\n 3935 | \n 3936 | template <typename E>\n 3937 | inline i32 Symbol<E>::get_plt_idx(Context<E> &ctx) const {\n 3938 |   return aux ? aux->plt_idx : -1;\n 3939 | }\n 3940 | \n 3941 | template <typename E>\n 3942 | inline i32 Symbol<E>::get_pltgot_idx(Context<E> &ctx) const {\n 3943 |   return aux ? aux->pltgot_idx : -1;\n 3944 | }\n 3945 | \n 3946 | template <typename E>\n 3947 | inline i32 Symbol<E>::get_opd_idx(Context<E> &ctx) const {\n 3948 |   return aux ? aux->opd_idx : -1;\n 3949 | }\n 3950 | \n 3951 | template <typename E>\n 3952 | inline i32 Symbol<E>::get_dynsym_idx(Context<E> &ctx) const {\n 3953 |   return aux ? aux->dynsym_idx : -1;\n 3954 | }","lines":39,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3916-L3954"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`OutputFile<E>::is_unmapped` is declared in `src/mold.h` and read twice in\n`output-file-unix.cc` (`if (!this->is_unmapped) munmap(...)`) but is never assigned\n`true` anywhere in the tree - the flag is a leftover from a removed\n\"unmap the output early\" feature. It gives a false impression that unmapping can\nhappen elsewhere, and the Windows implementation does not honour it at all, so the\ntwo platforms already disagree about the invariant.","fix":"Delete the `is_unmapped` member from `OutputFile` and the two `if (!this->is_unmapped)` guards, or start setting it where the buffer is actually released so that all three `close()` implementations agree.","locations":[{"ref":"src/output-file-unix.cc:138-143","code":"  138 |   void close(Context<E> &ctx) override {\n  139 |     Timer t(ctx, \"close_file\");\n  140 | \n  141 |     if (!this->is_unmapped)\n  142 |       munmap(this->buf, vasize);\n  143 |     ::close(this->fd);","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-unix.cc#L138-L143"},{"ref":"src/output-file-unix.cc:263-268","code":"  263 | template <typename E>\n  264 | void LockingOutputFile<E>::close(Context<E> &ctx) {\n  265 |   if (!this->is_unmapped)\n  266 |     munmap(this->buf, vasize);\n  267 |   ::close(this->fd);\n  268 | }","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-unix.cc#L263-L268"},{"ref":"src/output-file-win32.cc:68-74","code":"   68 |   void close(Context<E> &ctx) override {\n   69 |     Timer t(ctx, \"close_file\");\n   70 | \n   71 |     UnmapViewOfFile(this->buf);\n   72 |     CloseHandle(handle);\n   73 |     handle = INVALID_HANDLE_VALUE;\n   74 |   }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-file-win32.cc#L68-L74"}]},

{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`register_new_input_hook()` and `get_api_version()` are declared as\n`template <typename E>` but never use `E` (`register_new_input_hook` ignores its\nargument entirely and just returns `LDPS_OK`). `get_input_file()`,\n`add_input_library()`, `set_extra_library_path()` and the eight\n`get_input_section_*` / `update_section_order` / `unique_segment_*` callbacks all\nreturn `LDPS_OK` without doing anything or filling in their out-parameters. A\nplugin that actually calls, say, `get_input_section_count(&count)` will read an\nuninitialized `count` and believe the call succeeded.","fix":"Return `LDPS_ERR` from the unimplemented callbacks so a plugin that relies on\nthem fails loudly instead of consuming uninitialized data, and drop the unused\n`template <typename E>` from `register_new_input_hook`.","locations":[{"ref":"src/lto-unix.cc:198-269","code":"  198 | static PluginStatus\n  199 | get_input_file(const void *handle, struct PluginInputFile *file) {\n  200 |   LOG << \"get_input_file\\n\";\n  201 |   return LDPS_OK;\n  202 | }\n  203 | \n  204 | template <typename E>\n  205 | static PluginStatus release_input_file(const void *handle) {\n  206 |   LOG << \"release_input_file\\n\";\n  207 | \n  208 |   ObjectFile<E> &file = *(ObjectFile<E> *)handle;\n  209 |   file.mf->close_fd();\n  210 |   return LDPS_OK;\n  211 | }\n  212 | \n  213 | static PluginStatus add_input_library(const char *path) {\n  214 |   LOG << \"add_input_library\\n\";\n  215 |   return LDPS_OK;\n  216 | }\n  217 | \n  218 | static PluginStatus set_extra_library_path(const char *path) {\n  219 |   LOG << \"set_extra_library_path\\n\";\n  220 |   return LDPS_OK;\n  221 | }\n  222 | \n  223 | template <typename E>\n  224 | static PluginStatus get_view(const void *handle, const void **view) {\n  225 |   LOG << \"get_view\\n\";\n  226 | \n  227 |   ObjectFile<E> &file = *(ObjectFile<E> *)handle;\n  228 |   *view = (void *)file.mf->data;\n  229 |   return LDPS_OK;\n  230 | }\n  231 | \n  232 | static PluginStatus\n  233 | get_input_section_count(const void *handle, int *count) {\n  234 |   LOG << \"get_input_section_count\\n\";\n  235 |   return LDPS_OK;\n  236 | }\n  237 | \n  238 | static PluginStatus\n  239 | get_input_section_type(const PluginSection section, int *type) {\n  240 |   LOG << \"get_input_section_type\\n\";\n  241 |   return LDPS_OK;\n  242 | }\n  243 | \n  244 | static PluginStatus\n  245 | get_input_section_name(const PluginSection section,\n  246 |                        char **section_name) {\n  247 |   LOG << \"get_input_section_name\\n\";\n  248 |   return LDPS_OK;\n  249 | }\n  250 | \n  251 | static PluginStatus\n  252 | get_input_section_contents(const PluginSection section,\n  253 |                            const char **section_contents,\n  254 |                            size_t *len) {\n  255 |   LOG << \"get_input_section_contents\\n\";\n  256 |   return LDPS_OK;\n  257 | }\n  258 | \n  259 | static PluginStatus\n  260 | update_section_order(const PluginSection *section_list,\n  261 |                      int num_sections) {\n  262 |   LOG << \"update_section_order\\n\";\n  263 |   return LDPS_OK;\n  264 | }\n  265 | \n  266 | static PluginStatus allow_section_ordering() {\n  267 |   LOG << \"allow_section_ordering\\n\";\n  268 |   return LDPS_OK;\n  269 | }","lines":72,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/lto-unix.cc#L198-L269"},{"ref":"src/lto-unix.cc:396-420","code":"  396 | static PluginStatus\n  397 | get_input_section_alignment(const PluginSection section,\n  398 |                             int *addralign) {\n  399 |   LOG << \"get_input_section_alignment\\n\";\n  400 |   return LDPS_OK;\n  401 | }\n  402 | \n  403 | static PluginStatus\n  404 | get_input_section_size(const PluginSection section, uint64_t *size) {\n  405 |   LOG << \"get_input_section_siz
