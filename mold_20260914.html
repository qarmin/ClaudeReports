{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`create_response_file()` declares `std::string buf;` and never uses it; all\noutput goes through the `std::stringstream out`.","fix":"Delete the line:\nbefore\n```\nstd::string buf;\nstd::stringstream out;\n```\nafter\n```\nstd::stringstream out;\n```","locations":[{"ref":"src/passes.cc:1177-1180","code":" 1177 | template <typename E>\n 1178 | static std::string create_response_file(Context<E> &ctx) {\n 1179 |   std::string buf;\n 1180 |   std::stringstream out;","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1177-L1180"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment above the second loop of `ppc64v1_rewrite_opd` states the opposite of what the\ncode does. The loop rewrites relocations that refer to an input `.opd` section so that they\nrefer to the *function symbol* instead - which is exactly what the function's header comment\nsays (\"We also rewrite relocations that directly refer to an input .opd section so that they\nrefer to function symbols instead\", `src/arch-ppc64v1.cc:553-556`).","fix":"```\n-    // Rewrite relocations so that they directly refer to .opd.\n+    // Rewrite relocations so that they refer to function symbols instead of .opd.\n```","locations":[{"ref":"src/arch-ppc64v1.cc:602","code":"  602 |     // Rewrite relocations so that they directly refer to .opd.","lines":1,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v1.cc#L602"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The help text documents `-z nodefs` as the counterpart of `-z defs`, but the parser\nimplements `-z undefs` instead; `-z nodefs` falls through to the catch-all branch and is\nmerely warned about and ignored. Conversely the implemented `-z undefs` is not documented\nanywhere. A build that relies on the documented `-z nodefs` to suppress undefined-symbol\nerrors keeps failing the link.","fix":"Accept both: `} else if (read_z_flag(\"undefs\") || read_z_flag(\"nodefs\")) {`, and document\n`-z undefs` in `helpmsg`.","locations":[{"ref":"src/cmdline.cc:200-201","code":"  200 |   -z defs                     Report undefined symbols (even with --shared)\n  201 |     -z nodefs","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L200-L201"},{"ref":"src/cmdline.cc:1181-1184","code":" 1181 |     } else if (read_z_flag(\"defs\") || read_flag(\"no-undefined\")) {\n 1182 |       report_undefined = true;\n 1183 |     } else if (read_z_flag(\"undefs\")) {\n 1184 |       report_undefined = false;","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L1181-L1184"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The help text documents `-z start_stop_visibility=[hidden,protected]` with underscores, but\nthe parser only accepts the hyphenated `-z start-stop-visibility=...`. A user copying the\ndocumented spelling gets \"unknown command line option\" (a warning, so the symbol visibility\nsilently stays at the default).","fix":"```\n-  -z start_stop_visibility=[hidden,protected]\n+  -z start-stop-visibility=[hidden,protected]\n```\nor accept both spellings in `read_z_flag`.","locations":[{"ref":"src/cmdline.cc:223-224","code":"  223 |   -z start_stop_visibility=[hidden,protected]\n  224 |                               Specify symbol visibility for \"__start_SECNAME\" and \"__stop_SECNAME\" symbols","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L223-L224"},{"ref":"src/cmdline.cc:1171-1174","code":" 1171 |     } else if (read_z_flag(\"start-stop-visibility=protected\")) {\n 1172 |       ctx.arg.z_start_stop_visibility_protected = true;\n 1173 |     } else if (read_z_flag(\"start-stop-visibility=hidden\")) {\n 1174 |       ctx.arg.z_start_stop_visibility_protected = false;","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L1171-L1174"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The \"supported targets\" line of the help text lists `elf64-powerpc` twice (a copy-paste slip -\nthe second one was presumably meant to be the ELFv2 name, which is already spelled\n`elf64-powerpcle`). Output of `mold --help` is user-visible documentation.","fix":"```\n-mold: supported targets: ... elf32-powerpc elf64-powerpc elf64-powerpc elf64-powerpcle ...\n+mold: supported targets: ... elf32-powerpc elf64-powerpc elf64-powerpcle ...\n```","locations":[{"ref":"src/cmdline.cc:239","code":"  239 | mold: supported targets: elf32-i386 elf64-x86-64 elf32-littlearm elf64-littleaarch64 elf64-bigaarch64 elf32-littleriscv elf32-bigriscv elf64-littleriscv elf64-bigriscv elf32-powerpc elf64-powerpc elf64-powerpc elf64-powerpcle elf64-s390 elf64-sparc elf32-m68k elf32-sh-linux elf64-loongarch elf32-loongarch","lines":1,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L239"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Several accepted options are missing from `helpmsg`, so `--help` under-documents mold:\n`--section-order`, `--section-align`, `--filler`, `--physical-image-base`, `--start-stop`,\n`--discard-section`/`--no-discard-section`, `--print-dependencies`,\n`--relocatable-merge-sections`, `--default-symver`, `--be8`/`--be32`, `-z ibt`, `-z shstk`,\n`-z cet-report=...`, `-z undefs`, `-z x86-64-v{2,3,4}`, `-z dynamic-undefined-weak`. In the\nopposite direction, `-V` and the \"supported emulations\" line omit `armelfb_linux_eabi` and\n`elf32ppclinux`, both of which the `-m` handler accepts.","fix":"Add the missing entries to `helpmsg` and to the `-V` emulation list, and add a test that\ndiffs the option names matched by `read_flag`/`read_arg`/`read_z_flag` against the help text\nso the two cannot drift apart again.","locations":[{"ref":"src/cmdline.cc:783-792","code":"  783 |     } else if (read_flag(\"V\")) {\n  784 |       Out(ctx) << mold_version\n  785 |                << \"\\n  Supported emulations:\\n   elf_x86_64\\n   elf_i386\\n\"\n  786 |                << \"   aarch64elf\\n   aarch64linux\\n   aarch64elfb\\n\"\n  787 |                << \"   aarch64linuxb\\n   armelf_linux_eabi\\n   elf64lriscv\\n\"\n  788 |                << \"   elf64briscv\\n   elf32lriscv\\n   elf32briscv\\n\"\n  789 |                << \"   elf32ppc\\n   elf64ppc\\n   elf64lppc\\n   elf64_s390\\n\"\n  790 |                << \"   elf64_sparc\\n   m68kelf\\n   shlelf_linux\\n\"\n  791 |                << \"   shelf_linux\\n   elf64loongarch\\n   elf32loongarch\";\n  792 |       version_shown = true;","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L783-L792"},{"ref":"src/cmdline.cc:1127-1142","code":" 1127 |     } else if (read_arg(\"section-align\")) {\n 1128 |       size_t pos = arg.find('=');\n 1129 |       if (pos == arg.npos || pos == arg.size() - 1)\n 1130 |         Fatal(ctx) << \"--section-align: syntax error: \" << arg;\n 1131 |       i64 value = parse_number(ctx, \"section-align\", arg.substr(pos + 1));\n 1132 |       if (!has_single_bit(value))\n 1133 |         Fatal(ctx) << \"--section-align=\" << arg << \": value must be a power of 2\";\n 1134 |       ctx.arg.section_align[arg.substr(0, pos)] = value;\n 1135 |     } else if (read_arg(\"section-start\")) {\n 1136 |       size_t pos = arg.find('=');\n 1137 |       if (pos == arg.npos || pos == arg.size() - 1)\n 1138 |         Fatal(ctx) << \"--section-start: syntax error: \" << arg;\n 1139 |       ctx.arg.section_start[arg.substr(0, pos)] =\n 1140 |         parse_hex(ctx, \"section-start\", arg.substr(pos + 1));\n 1141 |     } else if (read_arg(\"section-order\")) {\n 1142 |       ctx.arg.section_order = parse_section_order(ctx, arg);","lines":16,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L1127-L1142"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment says a GCC FAT LTO object \"can be identified by the presence of\n`.gcc.lto_.symtab` section\", but the code checks for `.gnu.lto_.symtab.`\n(different prefix, plus a trailing dot). The comment names a section that does\nnot exist, which will send a reader looking for the wrong thing.","fix":"Replace the comment text `presence of .gcc.lto_.symtab section` with\n`presence of a .gnu.lto_.symtab.* section` so that it matches the\n`name.starts_with(\".gnu.lto_.symtab.\")` test in the code.","locations":[{"ref":"src/filetype.cc:33-41","code":"   33 |     // GCC FAT LTO objects contain both regular ELF sections and GCC-\n   34 |     // specific LTO sections, so that they can be linked as LTO objects if\n   35 |     // the LTO linker plugin is available and falls back as regular\n   36 |     // objects otherwise. GCC FAT LTO object can be identified by the\n   37 |     // presence of `.gcc.lto_.symtab` section.\n   38 |     if (has_gcc_plugin) {\n   39 |       std::string_view name = data + shdrs[shstrtab_idx].sh_offset + sec.sh_name;\n   40 |       if (name.starts_with(\".gnu.lto_.symtab.\"))\n   41 |         return true;","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/filetype.cc#L33-L41"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment says \"As in mark() below\", but the `mark()` lambda it refers to is\ndefined *above* at line 138. The only `mark` below is the file-scope\n`mark(Context&, rootset, start_stop_map)` driver function, which is a different\nthing - so the reference is doubly misleading.","fix":"Change `// As in mark() below, a section added to a feeder has` to\n`// As in the mark() lambda above, a section added to a feeder has`.","locations":[{"ref":"src/gc-sections.cc:183-186","code":"  183 |         // Mark and visit the sections with a nested parallel loop.\n  184 |         // As in mark() below, a section added to a feeder has\n  185 |         // already been marked, so a feeder's loop body must visit\n  186 |         // it unconditionally.","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L183-L186"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `DigestMap` comment claims \"Since the slot index is derived from digest bits\nthat the first word doesn't contain, a successful match effectively compares an\nentire 128-bit digest, so the map is exact\". Neither half of that holds in\ngeneral. The tag is `digest.hi >> 16` and the home index is `digest.hi & mask`;\nwhen `mask` has fewer than 16 bits, bits `[k, 16)` of `digest.hi` are never\ncompared at all. More importantly, on a linear-probing step the slot index no\nlonger encodes the stored digest's low bits, so a match at a probed slot\ncompares only the 48-bit tag plus the 64-bit `lo` - 112 bits, not 128.","fix":"Reword the comment to state the actual guarantee (a match compares the 48-bit\ntag plus the full 64-bit second word, i.e. at least 112 digest bits, which is\nwithin the same hash-collision assumption the rest of ICF relies on), or store\nthe full `digest.hi` in the slot and compare it exactly.","locations":[{"ref":"src/icf.cc:217-231","code":"  217 | //\n  218 | // Each slot consists of two 64-bit words and a section pointer. The\n  219 | // first word packs the round number, a busy bit, and 48 bits of the\n  220 | // digest; the second word holds another 64 bits. An inserter claims a\n  221 | // vacant slot by installing the first word with compare-and-swap with\n  222 | // the busy bit set, writes the second word and the pointer, and then\n  223 | // rewrites the first word with the busy bit cleared to publish the\n  224 | // slot. Since the slot index is derived from digest bits that the\n  225 | // first word doesn't contain, a successful match effectively compares\n  226 | // an entire 128-bit digest, so the map is exact under the same\n  227 | // hash-collision assumption the surrounding algorithm is built on.\n  228 | //\n  229 | // Of all sections inserted with the same digest in the same round, the\n  230 | // slot ends up pointing to the one with the lowest priority, which ICF\n  231 | // uses as the leader of the digest's equivalence class.","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/icf.cc#L217-L231"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment above `read_riscv_attributes()` claims the grammar is\n`[ <section-length> \"vendor-name\" <file-tag> <size> <attribute>*]+ ]*`, which\ncontains an unbalanced `]` and does not describe what the code actually does:\nthe code skips a fixed 5 bytes for the file tag *and* the sub-sub-section size\n(`p = p.substr(5)`), and never uses the `<size>` value it skips. The stray\nbracket and the mismatch make it impossible to check the parser against the\ndocumented format.","fix":"Rewrite the grammar comment to match the implementation, e.g.\n```\n// <format-version:1>\n// ( <section-length:4> <vendor-name:NUL-terminated>\n//   ( <tag:1> <sub-section-size:4> <attribute>* )* )*\n```\nand note explicitly that the sub-section size is skipped rather than validated\n(or start validating it).","locations":[{"ref":"src/input-files.cc:175-179","code":"  175 | // <format-version>\n  176 | // [ <section-length> \"vendor-name\" <file-tag> <size> <attribute>*]+ ]*\n  177 | template <is_riscv E>\n  178 | static void read_riscv_attributes(Context<E> &ctx, ObjectFile<E> &file,\n  179 |                                   std::string_view data) {","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L175-L179"},{"ref":"src/input-files.cc:199-201","code":"  199 |     if (!p.starts_with(ELF_TAG_FILE))\n  200 |       Fatal(ctx) << file << \": corrupted .riscv.attributes section\";\n  201 |     p = p.substr(5); // skip the tag and the sub-sub-section size","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L199-L201"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment on `StrtabSection` says `.strtab` is referenced by `.strtab`. It is\nreferenced by `.symtab` (via `sh_link`); `.strtab` referencing itself is\nmeaningless.","fix":"```cpp\n-// .strtab is referenced by .strtab and contains symbol names. Note that\n+// .strtab is referenced by .symtab and contains symbol names. Note that\n```","locations":[{"ref":"src/mold.h:1102-1105","code":" 1102 | // .strtab is referenced by .strtab and contains symbol names. Note that\n 1103 | // .strtab is not needed at runtime; one can remove the section from an\n 1104 | // ELF file without breaking it. Strings that runtime accesses are stored\n 1105 | // in .dynstr.","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L1102-L1105"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`Symbol<E>::sym_idx` is documented as \"Index into the symbol table of the owner\nfile\", but during COMDAT selection `record_comdat_owner()` deliberately\nrepurposes it, via `std::atomic_ref<i32>`, to hold the *file priority* of the\nwinning COMDAT owner, and only restores it to `-1` afterwards\n(`src/passes.cc:318-372`). This matters because `Symbol<E>::esym()`\n(`src/mold.h:3973-3979`) unconditionally does `file->elf_syms[sym_idx]`; any\ncall to `esym()`, `name()` or `get_type()` between\n`record_comdat_owner()` and the `sym.sym_idx = -1` restore reads out of bounds.\nThe header gives no hint that this window exists.","fix":"Either document the temporary reuse next to the member, or (better) stop\noverloading the field: give `Symbol` a dedicated `Atomic<i32> comdat_owner`\nonly in the COMDAT path, or key the ownership map on the signature symbol\npointer in a side table owned by `parse_input_sections()`.","locations":[{"ref":"src/mold.h:3135-3136","code":" 3135 |   // Index into the symbol table of the owner file.\n 3136 |   i32 sym_idx = -1;","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3135-L3136"},{"ref":"src/mold.h:4117-4123","code":" 4117 | template <typename E>\n 4118 | inline const ElfSym<E> &Symbol<E>::esym() const {\n 4119 |   static const ElfSym<E> empty = {};\n 4120 |   if (this == discarded_comdat_sym<E>)\n 4121 |     return empty;\n 4122 |   return file->elf_syms[sym_idx];\n 4123 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L4117-L4123"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment on `Symbol<E>::flags` says only \"`flags` has NEEDS_ flags\". That\nis true only between `scan_relocations()` and `create_output_sections()`:\n`src/passes.cc:1965` clears `sym->flags = 0` once the GOT/PLT entries have been\ncreated, and `src/thunks.cc:186-277` then reuses the very same field as a\nscratch boolean (`sym->flags.test_and_set()` stores `1`, which is the\n`NEEDS_GOT` bit value) to mark symbols that still require a range-extension\nthunk. A reader who trusts the comment could easily add a `flags & NEEDS_*`\ntest after thunk processing and get nonsense.","fix":"Document the lifetime and the reuse:\n\n```cpp\n// Bitmask of NEEDS_ flags, valid only between scan_relocations() and\n// create_output_sections(); passes.cc clears it there, after which\n// thunks.cc reuses it as a scratch \"needs a thunk\" boolean.\nAtomic<u8> flags = 0;\n```","locations":[{"ref":"src/mold.h:3143-3144","code":" 3143 |   // `flags` has NEEDS_ flags.\n 3144 |   Atomic<u8> flags = 0;","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3143-L3144"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Several stale or incorrect comments in the audited files:\n\n- `lib/crc32.cc:17` — \"Each iteration computes `x = (x * x^-1) mod poly`\" is meaningless\n  (`x * x^-1` is 1 by definition). The loop actually runs the CRC register backwards 32 steps.\n- `lib/lib.h:207` / `lib/lib.h:212` — \"Some C++ libraries haven't implemented\n  `std::has_single_bit` / `std::bit_ceil` yet\" is stale: the project requires C++20 and\n  `lib/arena.cc:49` already calls `std::has_single_bit` directly, so the codebase is inconsistent\n  with its own workaround.\n- `src/arch-arm32.cc:674` — \"Since no one provide, the linker has to synthesize it\" is garbled\n  (missing object; presumably \"Since no one provides it\").\n- `src/arch-arm32.cc:762` — \"Other target uses .eh_frame_hdr\" should be \"Other targets use\".\n- `src/arch-arm32.cc:780` — \"we can distinguished them\" should be \"distinguish\".\n- `src/arch-arm32.cc:21` — \"ARM fucntions\" (typo).\n- `src/arch-arm32.cc:330` and `src/arch-arm64.cc:307` — \"calling an weak undefined symbol\".\n- `lib/crc32.cc:11` — \"many bianry file formats\" (typo).\n- `lib/integers.h:10` — \"ELF data strucutres\" (typo).\n- `lib/lib.h:461` — \"the performance of conrurent hash map\" (typo).\n- `lib/compress.cc:113` — \"Comput the total size\" (typo).\n- `lib/tar.cc:115` — \"A tar file must ends with two empty blocks\" (grammar).","fix":"Fix the typos and grammar. For `lib/crc32.cc:17`, describe what the loop really does, e.g.\n`// Run the CRC register backwards 32 steps, i.e. undo 32 bits of CRC shifting.` For\n`lib/lib.h:207-217`, delete `has_single_bit()`/`bit_ceil()` and use `std::has_single_bit` /\n`std::bit_ceil` everywhere.","locations":[{"ref":"lib/crc32.cc:8-21","code":"    8 | // This function \"forges\" a CRC. That is, given the current and a desired\n    9 | // CRC32 value, crc32_solve() returns a binary blob to add to the end of\n   10 | // the original data to yield the desired CRC. Trailing garbage is ignored\n   11 | // by many bianry file formats, so you can create a file with a desired\n   12 | // CRC using crc32_solve(). We need it for --separate-debug-file.\n   13 | std::vector<u8> crc32_solve(u32 current, u32 desired) {\n   14 |   constexpr u32 poly = 0xedb88320;\n   15 |   u32 x = ~desired;\n   16 | \n   17 |   // Each iteration computes x = (x * x^-1) mod poly.\n   18 |   for (i64 i = 0; i < 32; i++) {\n   19 |     x = std::rotl(x, 1);\n   20 |     x ^= (x & 1) * (poly << 1);\n   21 |   }","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/crc32.cc#L8-L21"},{"ref":"lib/lib.h:211-221","code":"  211 | // Some C++ libraries haven't implemented std::has_single_bit yet.\n  212 | inline bool has_single_bit(u64 val) {\n  213 |   return std::popcount(val) == 1;\n  214 | }\n  215 | \n  216 | // Some C++ libraries haven't implemented std::bit_ceil yet.\n  217 | inline u64 bit_ceil(u64 val) {\n  218 |   if (has_single_bit(val))\n  219 |     return val;\n  220 |   return 1LL << (64 - std::countl_zero(val));\n  221 | }","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L211-L221"},{"ref":"src/arch-arm32.cc:673-675","code":"  673 |   // TLS trampoline code. ARM32's TLSDESC is designed so that this\n  674 |   // common piece of code is factored out from object files to reduce\n  675 |   // output size. Since no one provide, the linker has to synthesize it.","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L673-L675"},{"ref":"src/arch-arm32.cc:759-782","code":"  759 | // ARM executables use an .ARM.exidx section to look up an exception\n  760 | // handling record for the current instruction pointer. The table needs\n  761 | // to be sorted by their addresses.\n  762 | //\n  763 | // Other target uses .eh_frame_hdr instead for the same purpose.\n  764 | // I don't know why only ARM uses the different mechanism, but it's\n  765 | // likely that it's due to some historical reason.\n  766 | //\n  767 | // This function returns contents of .ARM.exidx.\n  768 | template <>\n  769 | std::vector<u8> Arm32ExidxSection<E>::get_contents(Context<E> &ctx) {\n  770 |   // .ARM.exidx records consists of a signed 31-bit relative address\n  771 |   // and a 32-bit value. The relative address indicates the start\n  772 |   // address of a function that the record covers. The value is one of\n  773 |   // the followings:\n  774 |   //\n  775 |   // 1. CANTUNWIND indicating that there's no unwinding info for the function,\n  776 |   // 2. a compact unwinding record encoded into a 32-bit value, or\n  777 |   // 3. a 31-bit relative address which points to a larger record in\n  778 |   //    the .ARM.extab section.\n  779 |   //\n  780 |   // CANTUNWIND is value 1. The most significant bit is set in (2) but\n  781 |   // not in (3). So we can distinguished them just by looking at a value.\n  782 |   const u32 CANTUNWIND = 1;","lines":24,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L759-L782"},{"ref":"src/arch-arm32.cc:21-24","code":"   21 | // To distinguish Thumb functions from ARM fucntions, the LSB of a\n   22 | // function address is repurposed as a boolean flag. If the LSB is 0,\n   23 | // the function referred to by the address is encoded in ARM;\n   24 | // otherwise, Thumb.","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm32.cc#L21-L24"},{"ref":"src/arch-arm64.cc:312-314","code":"  312 |       if (sym.is_remaining_undef_weak()) {\n  313 |         // On ARM, calling an weak undefined symbol jumps to the\n  314 |         // next instruction.","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm64.cc#L312-L314"},{"ref":"lib/integers.h:10-11","code":"   10 | // 2. Even though data members in all ELF data strucutres are naturally\n   11 | //    aligned, they are not guaranteed to be aligned on memory because of","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/integers.h#L10-L11"},{"ref":"lib/lib.h:500-503","code":"  500 | //\n  501 | // We've implemented this ourselves because the performance of\n  502 | // conrurent hash map is critical for our linker.\n  503 | template <typename T>","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L500-L503"},{"ref":"lib/compress.cc:113-114","code":"  113 |   // Comput the total size\n  114 |   compressed_size = 8; // the header and the trailer","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/compress.cc#L113-L114"},{"ref":"lib/tar.cc:115-116","code":"  115 |   // A tar file must ends with two empty blocks\n  116 |   (void)!ftruncate(fileno(out), ftell(out) + BLOCK_SIZE * 2);","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/tar.cc#L115-L116"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Assorted typos in comments and in one user-visible diagnostic across the backends:\n`instructioon`/`expeanded` (RISC-V), `instructioon`/`referes` (LoongArch), `similiar`,\n`acutally`, `thatare` (ppc64v1), `fucntions`/`fucntion`, `epiilogue` (ppc64v2),\n`comtemporary` (m68k), `commmon` (sh4), `probaly`, `unfamiliarty`, `exeption` (s390x), and\nthe file-header reference in `arch-ppc32.cc` points at `arch-ppc64v1.cpp`/`arch-ppc64v2.cpp`\nalthough the files are named `.cc`. The RISC-V one is not just a comment: the error message\nprinted to users reads `stack alignment requirement mistmatch`.","fix":"Fix the spellings (`instruction`, `expanded`, `refers`, `similar`, `actually`, `that are`,\n`functions`, `epilogue`, `contemporary`, `common`, `probably`, `unfamiliarity`, `exception`,\n`mismatch`) and change `arch-ppc64v1.cpp`/`arch-ppc64v2.cpp` to `arch-ppc64v1.cc`/`arch-ppc64v2.cc`.","locations":[{"ref":"src/arch-riscv.cc:252-254","code":"  252 | // Returns true if isec's i'th relocation refers to the following\n  253 | // GOT-load instructioon pair, which is an expeanded form of\n  254 | // `la t0, foo` pseudo assembly instruction.","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L252-L254"},{"ref":"src/arch-riscv.cc:1204-1207","code":" 1204 |       i64 val = *file->extra.stack_align;\n 1205 |       if (stack != -1 && stack != val)\n 1206 |         Error(ctx) << *file << \": stack alignment requirement mistmatch\";\n 1207 |       stack = val;","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L1204-L1207"},{"ref":"src/arch-loongarch.cc:128-130","code":"  128 | // Returns true if isec's i'th relocation refers to the following\n  129 | // relaxable instructioon pair.\n  130 | //","lines":3,"link":"https://github.c {"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Several comment typos in this slice:\n\n- `src/input-files.cc:45` - \"indistinguishtable\" -> \"indistinguishable\"\n- `src/input-files.cc:624` - \"transfer the control ot it\" -> \"to it\"\n- `src/input-files.cc:1302` - \"Scan relocations against seciton contents\" -> \"section\"\n- `src/input-files.cc:1328` - \"C's tantative definitions\" -> \"tentative\"\n- `src/input-files.cc:1672` - \"If an undefiend symbol\" -> \"undefined\"\n- `src/input-files.cc:1756` - \"we resolve `foo@VERSOIN`\" -> \"`foo@VERSION`\"\n- `src/input-sections.cc:290` - \"a function containin a given offset\" -> \"containing\"\n- `src/lto-unix.cc:32` - \"When gcc or clang inovkes ld\" -> \"invokes\"\n- `src/lto-unix.cc:737` - \"code and data for peripherails\" -> \"peripherals\"\n- `src/main.cc:661-663` - \"pessimistive assumption\" -> \"pessimistic\", and\n  \"all sections,, we can\" has a doubled comma\n- `src/input-files.cc:445` - \"Tools that mutates the symbol table\" -> \"mutate\"","fix":"Apply the spelling corrections listed above.","locations":[{"ref":"src/input-files.cc:44-46","code":"   44 | static bool is_rust_symbol(const Symbol<E> &sym) {\n   45 |   // The legacy Rust mangling scheme is indistinguishtable from C++.\n   46 |   // We don't want to accidentally demangle C++ symbols as Rust ones.","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L44-L46"},{"ref":"src/input-files.cc:616-619","code":"  616 | // .eh_frame with the current program counter as a key. A record that\n  617 | // covers the current PC explains how to find a handler and how to\n  618 | // transfer the control ot it.\n  619 | //","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L616-L619"},{"ref":"src/input-files.cc:1315-1318","code":" 1315 | template < {"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"A cluster of typos in the header's documentation comments:\n\n* `src/mold.h:80` - \"it's is in the C++20 standard\".\n* `src/mold.h:716` - \"Some synethetic sections\".\n* `src/mold.h:987` - \"relocation infromation\".\n* `src/mold.h:1207` - \"without scannin all entries\".\n* `src/mold.h:1229` - \"as an etnry size\".\n* `src/mold.h:1311-1312` - \"their dcorresponding function addresses, so tha the\".\n* `src/mold.h:1334` - \"contains relcoation records\".\n* `src/mold.h:1474-1475` - \"a cryptogrpahic hash\".\n* `src/mold.h:3103` - \"the addres of the foo's PLT entry\".\n* `src/mold.h:3139` - \"apply relocations agianst `foo`\".\n* `src/mold.h:3395` - \"linkers generaly don't remove\".\n* `src/mold.h:3871` - \"an ifunc tha uses two GOT slots\".\n\n`src/mold.h:2054` also has stray spaces in the type names:\n`void parse_note_gnu_property(Context <E> &ctx, const ElfShdr <E> &shdr);`.","fix":"Fix the spellings: `it is`, `synthetic`, `information`, `scanning`, `entry`,\n`corresponding`, `so that the`, `relocation`, `cryptographic`, `address`,\n`against`, `generally`, `that`. Remove the spaces in\n`Context<E>` / `ElfShdr<E>` on `src/mold.h:2054`.","locations":[{"ref":"src/mold.h:78-80","code":"   78 | // Some C++ stdlibs don't support std::osyncstream even though\n   79 | // it's is in the C++20 standard. So we implement it ourselves.\n   80 | class SyncStream {","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L78-L80"},{"ref":"src/mold.h:3532-3535","code":" 3532 | // Input object files may contain duplicate code for inline functions\n 3533 | // and such. Linkers de-duplicate them at link-time. However, linkers\n 3534 | // generaly don't remove debug info for de-duplicated functions because\n 3535 | // doing that requires parsing the entire debug section.","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3532-L3535"},{"ref":"src/mold.h:4013-4017","code":" 4013 | template <typename E>\n 4014 | inline bool Symbol<E>::is_pde_ifunc(Context<E> &ctx) const {\n 4015 |   // Returns true if this is an ifunc tha uses two GOT slots\n 4016 |   return is_ifunc() && !ctx.arg.pic && !is_ppc64<E>;\n 4017 | }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L4013-L4017"}]},

{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment in `StrtabSection<E>::update_shdr` names the same mapping symbol twice:\n\"ARM32 uses $a, $t and $t mapping symbols to mark the beginning of ARM, Thumb and\ndata in text\". The third symbol is `$d` (data), as the string literal `\"$a\\0$t\\0$d\"`\ntwo lines below and `StrtabSection::DATA` confirm.","fix":"Change `// ARM32 uses $a, $t and $t mapping symbols` to `// ARM32 uses $a, $t and $d mapping symbols`.","locations":[{"ref":"src/output-chunks.cc:518-524","code":"  518 |   // ARM32 uses $a, $t and $t mapping symbols to mark the beginning of\n  519 |   // ARM, Thumb and data in text, respectively. These symbols don't\n  520 |   // affect correctness of the program but helps disassembler to\n  521 |   // disassemble machine code appropriately.\n  522 |   if constexpr (is_arm32<E>)\n  523 |     if (!ctx.arg.strip_all)\n  524 |       offset += sizeof(\"$a\\0$t\\0$d\");","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L518-L524"}]},
{"id":"CMT_20","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Two comments in `set_file_offsets()` refer to a nonexistent option\n`--start-section`. The option that lets addresses go backwards / leave large\ngaps is `--section-start` (`ctx.arg.section_start`, consulted in\n`set_virtual_addresses_regular()`).","fix":"Rename in both comments:\nbefore `// If --start-section is given, addresses may not increase`\nafter  `// If --section-start is given, addresses may not increase`","locations":[{"ref":"src/passes.cc:3138-3141","code":" 3138 |       // If --start-section is given, addresses may not increase\n 3139 |       // monotonically.\n 3140 |       if (chunks[i]->shdr.sh_addr < first.shdr.sh_addr)\n 3141 |         break;","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L3138-L3141"},{"ref":"src/passes.cc:3152-3155","code":" 3152 |       // If --start-section is given, there may be a large gap between\n 3153 |       // sections. We don't want to allocate a disk space for a gap if\n 3154 |       // exists.\n 3155 |       if (gap_size >= ctx.page_size)","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L3152-L3155"}]},
{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typos and a misleading wording in the TLS documentation block and helpers:\n\n* `\"An ELF exectuable\"` -> `executable`;\n* `\"With TLSDECS\"` -> `TLSDESC`;\n* `\"the runtime appends two words at the beginning of TLV template image\"` -\n  appending *at the beginning* is contradictory; the runtime *reserves*\n  (prepends) a two-word TCB before the TLS block, which is why `get_tp_addr()`\n  subtracts `sizeof(Word<E>) * 2`.","fix":"Fix the two spellings and reword the ARM/SH4 comment as \"the runtime reserves two words (the TCB) immediately before the TLS block, so TP points that far below the template image\".","locations":[{"ref":"src/tls.cc:18-19","code":"   18 | // An ELF exectuable or a shared library using TLV contains a \"TLS template\n   19 | // image\" in the PT_TLS segment. For each newly created thread including the","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/tls.cc#L18-L19"},{"ref":"src/tls.cc:140-141","code":"  140 | // With TLSDECS, the compiler can always emit the same code for TLVs\n  141 | // without sacrificing runtime performance.","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/tls.cc#L140-L141"},{"ref":"src/tls.cc:165-169","code":"  165 |   } else if constexpr (is_arm<E> || is_sh4<E>) {\n  166 |     // On ARM and SH4, the runtime appends two words at the beginning\n  167 |     // of TLV template image when copying TLVs to the TLS block, so we need\n  168 |     // to offset it.\n  169 |     return align_down(phdr.p_vaddr - sizeof(Word<E>) * 2, phdr.p_align);","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/tls.cc#L165-L169"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`relax_gotpcrelx`, `relax_gottpoff`, `relax_tlsdesc_to_ie` and `relax_tlsdesc_to_le` are four\nfunctions of 40-90 lines each that consist of the same hand-written 16-case tables, one entry\nper destination register, repeated twice per function (legacy REX and REX2/`CODE_4` forms) -\nabout 130 lines of near-identical `case 0x48Xb0Y: return 0xZZ;` rows. `relax_gottpoff` and\n`relax_tlsdesc_to_le` even produce the identical destination encodings\n(`0x48c7c0..0x49c7c7` / `0x18c7c0..0x19c7c7`) from different source opcodes. All of this is\nmechanically derivable from the ModRM `reg` field and the REX `R`/`B` bits.","fix":"Decode the instruction once (prefix byte, opcode, ModRM) and synthesize the replacement:\nextract `reg = bits(modrm, 5, 3)` plus the REX `R` bit, then build `mov $imm, %reg`\n(`0x48|R, 0xc7, 0xc0|reg`) or `lea` from a single table of opcode->opcode mappings. That\nremoves ~120 lines and the risk of one table drifting from the others.","locations":[{"ref":"src/arch-x86-64.cc:138-299","code":"  138 | static u32 relax_gotpcrelx(u8 *loc, const ElfRel<E> &rel) {\n  139 |   if (rel.r_type == R_X86_64_GOTPCRELX) {\n  140 |     switch ((loc[-2] << 8) | loc[-1]) {\n  141 |     case 0xff15: return 0x40e8; // call *0(%rip) -> call 0\n  142 |     case 0xff25: return 0x40e9; // jmp  *0(%rip) -> jmp  0\n  143 |     }\n  144 |   } else {\n  145 |     assert(rel.r_type == R_X86_64_REX_GOTPCRELX ||\n  146 |            rel.r_type == R_X86_64_CODE_4_GOTPCRELX);\n  147 |     switch ((loc[-3] << 16) | (loc[-2] << 8) | loc[-1]) {\n  148 |     case 0x488b05: return 0x8d05; // mov 0(%rip), %rax -> lea 0(%rip), %rax\n  149 |     case 0x488b0d: return 0x8d0d; // mov 0(%rip), %rcx -> lea 0(%rip), %rcx\n  150 |     case 0x488b15: return 0x8d15; // mov 0(%rip), %rdx -> lea 0(%rip), %rdx\n  151 |     case 0x488b1d: return 0x8d1d; // mov 0(%rip), %rbx -> lea 0(%ri {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The \"open `path`, or write to `std::cout` when it is `-`, `Fatal` if the open\nfails, print a list, then print `... saved N bytes`\" block is duplicated almost\nverbatim between `--print-gc-sections` and `--print-icf-sections`. The\nduplication already caused a divergence: the ICF copy accumulates `saved_bytes`\nwhile the GC copy never does (see the `GC saved 0 bytes` finding).","fix":"Add a small shared helper, e.g.\n`std::ostream &open_report(Context<E> &ctx, const std::string &path, std::ofstream &file, std::string_view opt_name)`,\nthat performs the `-`/file dispatch and the `Fatal` on failure, and use it from\nboth call sites.","locations":[{"ref":"src/gc-sections.cc:230-250","code":"  230 |   std::string &path = ctx.arg.print_gc_sections;\n  231 | \n  232 |   if (!path.empty()) {\n  233 |     std::ostream *out = &std::cout;\n  234 |     std::ofstream file;\n  235 | \n  236 |     if (path != \"-\") {\n  237 |       file.open(path);\n  238 |       if (file.fail())\n  239 |         Fatal(ctx) << \"--print-gc-sections: cannot open \" << path << \": \"\n  240 |                    << errno_string();\n  241 |       out = &file;\n  242 |     }\n  243 | \n  244 |     i64 saved_bytes = 0;\n  245 |     for (std::span<InputSection<E> *> vec : sections)\n  246 |       for (InputSection<E> *isec : vec)\n  247 |         *out << \"removing unused section \" << *isec << '\\n';\n  248 | \n  249 |     *out << \"GC saved \" << saved_bytes << \" bytes\\n\";\n  250 |   }","lines":21,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L230-L250"}]},

;\n 1515 |           else\n 1516 |             vec.push_back({isec, get_init_fini_priority(isec)});\n 1517 |         }\n 1518 |         ranges::stable_sort(vec, {}, &Entry::prio);\n 1519 | \n 1520 |         for (i64 i = 0; i < vec.size(); i++)\n 1521 |           osec->members[i] = vec[i].sect;\n 1522 |       }\n 1523 |     }\n 1524 |   }\n 1525 | }","lines":33,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1493-L1525"},{"ref":"src/passes.cc:1527-1552","code":" 1527 | template <typename E>\n 1528 | void sort_ctor_dtor(Context<E> &ctx) {\n 1529 |   Timer t(ctx, \"sort_ctor_dtor\");\n 1530 | \n 1531 |   struct Entry {\n 1532 |     InputSection<E> *sect;\n 1533 |     i64 prio;\n 1534 |   };\n 1535 | \n 1536 |   for (Chunk<E> *chunk : ctx.chunks) {\n 1537 |     if (OutputSection<E> *osec = chunk->to_osec()) {\n 1538 |       if (osec->name == \".ctors\" || osec->name == \".dtors\") {\n 1539 |         if (ctx.arg.shuffle_sections != SHUFFLE_SECTIONS_REVERSE)\n 1540 |           ranges::reverse(osec->members);\n 1541 | \n 1542 |         std::vector<Entry> vec;\n 1543 |         for (InputSection<E> *isec : osec->members)\n 1544 |           vec.push_back({isec, get_ctor_dtor_priority(isec)});\n 1545 |         ranges::stable_sort(vec, {}, &Entry::prio);\n 1546 | \n 1547 |         for (i64 i = 0; i < vec.size(); i++)\n 1548 |           osec->members[i] = vec[i].sect;\n 1549 |       }\n 1550 |     }\n 1551 |   }\n 1552 | }","lines":26,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1527-L1552"}]},
{"id":"DUP_5","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"easy","description":"`Script<E>::read_version_script_commands()` and\n`Script<E>::read_dynamic_list_commands()` contain a near-identical ~18-line\n`extern \"C\"` / `extern \"C++\"` block handler (token consumption, brace/semicolon\nskipping, recursion with the `is_cpp` flag flipped). Any fix to one - e.g.\nsupporting `extern \"C\" { }` nested inside `extern \"C++\"`, or a better error\nmessage - has to be duplicated in the other, and they have already drifted\n(`read_version_script_commands` threads `ver_str`/`ver_idx`/`is_global` through,\n`read_dynamic_list_commands` a `result` vector).","fix":"Extract a helper such as\n```c++\n// Returns true if an `extern \"C\"`/`extern \"C++\"` block was consumed.\nbool read_extern_block(std::span<std::string_view> &tok,\n                       auto &&read_body /* (bool is_cpp) */);\n```\nand call it from both functions.","locations":[{"ref":"src/linker-script.cc:319-335","code":"  319 |     if (tok[0] == \"extern\") {\n  320 |       tok = tok.subspan(1);\n  321 | \n  322 |       if (!tok.empty() && tok[0] == \"\\\"C\\\"\") {\n  323 |         tok = tok.subspan(1);\n  324 |         tok = skip(tok, \"{\");\n  325 |         tok = read_version_script_commands(tok, ver_str, ver_idx, is_global, false);\n  326 |       } else {\n  327 |         tok = skip(tok, \"\\\"C++\\\"\");\n  328 |         tok = skip(tok, \"{\");\n  329 |         tok = read_version_script_commands(tok, ver_str, ver_idx, is_global, true);\n  330 |       }\n  331 | \n  332 |       tok = skip(tok, \"}\");\n  333 |       tok = skip(tok, \";\");\n  334 |       continue;\n  335 |     }","lines":17,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/linker-script.cc#L319-L335"},{"ref":"src/linker-script.cc:400-416","code":"  400 |     if (tok[0] == \"extern\") {\n  401 |       tok = tok.subspan(1);\n  402 | \n  403 |       if (!to {"id":"DUP_6","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"very_easy","description":"`get_machine_type()` is declared twice in the same header with an identical\nsignature, once in the `filetype.cc` block and once in the `main.cc` block.","fix":"Delete the second copy at `src/mold.h:2907-2909`:\n\n```cpp\n-template <typename E>\n-std::string_view\n-get_machine_type(Context<E> &ctx, ReaderContext &rctx, MappedFile *mf);\n```","locations":[{"ref":"src/mold.h:678-680","code":"  678 | template <typename E>\n  679 | std::string_view\n  680 | get_machine_type(Context<E> &ctx, ReaderContext &rctx, MappedFile *mf);","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L678-L680"},{"ref":"src/mold.h:3010-3012","code":" 3010 | template <typename E>\n 3011 | std::string_view\n 3012 | get_machine_type(Context<E> &ctx, ReaderContext &rctx, MappedFile *mf);","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3010-L3012"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"`siphash_key` is a mutable file-scope global that is written by `icf_sections`\nand read by the free function `propagate` and by `compute_digest`. This makes\n`icf_sections` non-reentrant and creates a hidden data dependency that is\ninvisible at the call sites: `propagate` looks like a pure function of its\narguments but silently depends on a global having been seeded first. It is also\nshared across all `E` instantiations linked into the same binary.","fix":"Pass the key explicitly - either as a parameter to `compute_digest` and\n`propagate`, or by wrapping the ICF state in a small struct that owns the key\nalongside `digests`, `edges` and `edge_indices`.","locations":[{"ref":"src/icf.cc:85","code":"   85 | static u8 siphash_key[16];","lines":1,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/icf.cc#L85"},{"ref":"src/icf.cc:530-532","code":"  530 |     return;\n  531 | \n  532 |   get_random_bytes(siphash_key, sizeof(siphash_key));","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/icf.cc#L530-L532"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`ElfSym<E>` encodes `st_info` and `st_other` as bitfields whose layout is\nselected by `#ifdef __LITTLE_ENDIAN__` - i.e. by the *host* byte order - because\nC++ leaves bitfield allocation order implementation-defined. This is a\nreasonable bet for GCC/Clang on mainstream ABIs, but nothing in the file\nverifies it: there is not a single `static_assert` on `sizeof(ElfSym<E>)`,\n`sizeof(ElfShdr<E>)`, `sizeof(ElfEhdr<E>)`, `sizeof(ElfRel<E>)` or on the value\nextracted from a known `st_info`/`st_other` byte. A compiler that packs\nbitfields differently, or that inserts padding around the anonymous unions,\nwould produce a linker that silently reads every symbol's type, binding,\nvisibility, `ppc64_local_entry` and `riscv_variant_cc` from the wrong bits.","fix":"Add compile-time checks next to the definitions, e.g.\n```cpp\nstatic_assert(sizeof(ElfSym<X86_64>) == 24);\nstatic_assert(sizeof(ElfSym<I386>) == 16);\nstatic_assert(sizeof(ElfShdr<X86_64>) == 64);\nstatic_assert(sizeof(ElfEhdr<X86_64>) == 64);\nstatic_assert(sizeof(ElfRel<X86_64>) == 24);\n```\nplus a `constexpr` round-trip check that writing `st_type = 2, st_bind = 1`\nproduces the byte `0x12`.","locations":[{"ref":"src/elf.h:1557-1642","code":" 1557 | template <typename E> requires E::is_64\n 1558 | struct ElfSym<E> {\n 1559 |   bool is_undef() const { return st_shndx == SHN_UNDEF; }\n 1560 |   bool is_abs() const { return st_shndx == SHN_ABS; }\n 1561 |   bool is_common() const { return st_shndx == SHN_COMMON; }\n 1562 |   bool is_weak() const { return st_bind == STB_WEAK; }\n 1563 |   bool is_undef_weak() const { return is_undef() && is_weak(); }\n 1564 | \n 1565 |   bool ppc64_preserves_r2() const { return ppc64_local_entry != 1; }\n 1566 |   bool ppc64_uses_toc() const { return ppc64_local_entry > 1; }\n 1567 | \n 1568 |   U32<E> st_name;\n 1569 | \n 1570 | #ifdef __LITTLE_ENDIAN__\n 1571 |   u8 st_type : 4;\n 1572 |   u8 st_bind : 4;\n 1573 |   union {\n 1574 |     u8 st_visibility : 2;\n 1575 |     struct {\n 1576 |       u8 : 7;\n 1577 |       u8 arm64_variant_pcs : 1;\n 1578 |     };\n 1579 |     struct {\n 1580 |       u8 : 7;\n 1581 |       u8 riscv_variant_cc : 1;\n 1582 |     };\n 1583 |     struct {\n 1584 |       u8 : 5;\n 1585 |       u8 ppc64_local_entry : 3;\n 1586 |     };\n 1587 |   };\n 1588 | #else\n 1589 |   u8 st_bind : 4;\n 1590 |   u8 st_type : 4;\n 1591 |   union {\n 1592 |     struct {\n 1593 |       u8 : 6;\n 1594 |       u8 st_visibility : 2;\n 1595 |     };\n 1596 |     u8 arm64_variant_pcs : 1;\n 1597 |     u8 riscv_variant_cc : 1;\n 1598 |     u8 ppc64_local_entry : 3;\n 1599 |   };\n 1600 | #endif\n 1601 | \n 1602 |   U16<E> st_shndx;\n 1603 |   U64<E> st_value;\n 1604 |   U64<E> st_size;\n 1605 | };\n 1606 | \n 1607 | template <typename E> requires (!E::is_64)\n 1608 | struct ElfSym<E> {\n 1609 |   bool is_undef() const { return st_shndx == SHN_UNDEF; }\n 1610 |   bool is_abs() const { return st_shndx == SHN_ABS; }\n 1611 |   bool is_common() const { return st_shndx == SHN_COMMON; }\n 1612 |   bool is_weak() const { return st_bind == STB_WEAK; }\n 1613 |   bool is_undef_weak() const { return is_undef() && is_weak(); }\n 1614 | \n 1615 |   U32<E> st_name;\n 1616 |   U32<E> st_value;\n 1617 |   U32<E> st_size;\n 1618 | \n 1619 | #ifdef __LITTLE_ENDIAN__\n 1620 |   u8 st_type : 4;\n 1621 |   u8 st_bind : 4;\n 1622 |   union {\n 1623 |     u8 st_visibility : 2;\n 1624 |     struct {\n 1625 |       u8 : 7;\n 1626 |       u8 riscv_variant_cc : 1;\n 1627 |     };\n 1628 |   };\n 1629 | #else\n 1630 |   u8 st_bind : 4;\n 1631 |   u8 st_type : 4;\n 1632 |   union {\n 1633 |     struct {\n 1634 |       u8 : 6;\n 1635 |       u8 st_visibility : 2;\n 1636 |     };\n 1637 |     u8 riscv_variant_cc : 1;\n 1638 |   };\n 1639 | #endif\n 1640 | \n 1641 |   U16<E> st_shndx;\n 1642 | };","lines":86,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/elf.h#L1557-L1642"},{"ref":"src/elf.h:1644-1674","code":" 1644 | template <typename E>\n 1645 | struct ElfShdr {\n 1646 |   U32<E> sh_name;\n 1647 |   U32<E> sh_type;\n 1648 |   Word<E> sh_flags;\n 1649 |   Word<E> sh_addr;\n 1650 |   Word<E> sh_offset;\n 1651 |   Word<E> sh_size;\n 1652 |   U32<E> sh_link;\n 1653 |   U32<E> sh_info;\n 1654 |   Word<E> sh_addralign;\n 1655 |   Word<E> sh_entsize;\n 1656 | };\n 1657 | \n 1658 | template <typename E>\n 1659 | struct ElfEhdr {\n 1660 |   u8 e_ident[16];\n 1661 |   U16<E> e_type;\n 1662 |   U16<E> e_machine;\n 1663 |   U32<E> e_version;\n 1664 |   Word<E> e_entry;\n 1665 |   Word<E> e_phoff;\n 1666 |   Word<E> e_shoff;\n 1667 |   U32<E> e_flags;\n 1668 |   U16<E> e_ehsize;\n 1669 |   U16<E> e_phentsize;\n 1670 |   U16<E> e_phnum;\n 1671 |   U16<E> e_shentsize;\n 1672 |   U16<E> e_shnum;\n 1673 |   U16<E> e_shstrndx;\n 1674 | };","lines":31,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/elf.h#L1644-L1674"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"The fallback lock path `/tmp/mold-lock-<username>` is a predictable name in a\nworld-writable, non-sticky-safe location and is opened with\n`O_WRONLY | O_CREAT` without `O_NOFOLLOW` and without checking ownership. Any\nlocal user can pre-create that path (or a symlink pointing at a file the victim\nowns) and then hold `lockf()` on it forever, permanently stalling every\n`MOLD_JOBS=1` link of the target user - a trivial local denial of service. The\nsymlink is also followed, so an unrelated file gets opened for writing.","fix":"Open with `O_NOFOLLOW | O_CLOEXEC`, then `fstat()` the descriptor and refuse the\nlock unless `st_uid == getuid()` and `S_ISREG(st_mode)`. Prefer\n`XDG_RUNTIME_DIR`/`TMPDIR` and fall back to a per-uid directory created with\nmode `0700`.","locations":[{"ref":"src/jobs-unix.cc:30-42","code":"   30 |   std::string path;\n   31 |   if (char *dir = getenv(\"XDG_RUNTIME_DIR\"))\n   32 |     path = dir + \"/mold-lock\"s;\n   33 |   else\n   34 |     path = \"/tmp/mold-lock-\"s + getpwuid(getuid())->pw_name;\n   35 | \n   36 |   int fd = open(path.c_str(), O_WRONLY | O_CREAT | O_CLOEXEC, 0600);\n   37 |   if (fd == -1)\n   38 |     return;\n   39 | \n   40 |   if (lockf(fd, F_LOCK, 0) == -1)\n   41 |     return;\n   42 |   lock_fd = fd;","lines":13,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/jobs-unix.cc#L30-L42"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`Context<E>::has_error` is a plain `bool` that is written from\n`Error<E>::Error()` and `Warn<E>::Warn()` (`src/error.cc:30`, `src/error.cc:43`)\nand read by `Context<E>::checkpoint()`. Diagnostics are emitted from inside\n`tbb::parallel_for_each` passes (relocation scanning, undefined-symbol\nreporting, range checks), so several threads can write this flag concurrently\nwhile another thread reads it. That is a data race and therefore undefined\nbehaviour; in practice the risk is that a concurrently-set error flag is not\nobserved at the next `checkpoint()` and mold produces a broken output with exit\nstatus 0.","fix":"Change the declaration to an atomic, which the codebase already has a helper\nfor:\n\n```cpp\n-  bool has_error = false;\n+  Atomic<bool> has_error = false;\n```\n\nNo call site needs to change, since `Atomic<T>` implicitly converts to `T` and\nhas an `operator=(T)`.","locations":[{"ref":"src/mold.h:2867","code":" 2867 |   bool has_error = false;","lines":1,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L2867"},{"ref":"src/mold.h:2716-2721","code":" 2716 |   void checkpoint() {\n 2717 |     if (has_error) {\n 2718 |       cleanup();\n 2719 |       _exit(1);\n 2720 |     }\n 2721 |   }","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L2716-L2721"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`execl()`, `execlp()` and `execle()` size their argument vector with\n`alloca((count_args(&ap) + 2) * sizeof(char *))`. `alloca()` cannot fail\ndetectably: a caller that passes a very long argument list (which is entirely\nlegal - `ARG_MAX` is typically 2 MiB, i.e. hundreds of thousands of pointers)\nsilently moves the stack pointer past the guard page and the *build tool* being\nwrapped crashes with no diagnostic. This code runs inside every process of a\nbuild under `mold -run`, so it is exposed to whatever argument lists that build\nuses.","fix":"Use a small fixed-size stack buffer for the common case and fall back to\n`malloc()`/`free()` above a threshold, e.g.\n```c\nint n = count_args(&ap) + 2;\nchar *stackbuf[64];\nchar **argv = (n <= 64) ? stackbuf : malloc(n * sizeof(char *));\n```\n(remembering that the `exec*` call does not return on success, so the `free()`\nonly needs to run on the failure path).","locations":[{"ref":"src/mold-wrapper.c:90-116","code":"   90 | int execl(const char *path, const char *arg0, ...) {\n   91 |   va_list ap;\n   92 |   va_start(ap, arg0);\n   93 |   char **argv = alloca((count_args(&ap) + 2) * sizeof(char *));\n   94 |   copy_args(argv, arg0, &ap);\n   95 |   va_end(ap);\n   96 |   return execve(path, argv, environ);\n   97 | }\n   98 | \n   99 | int execlp(const char *file, const char *arg0, ...) {\n  100 |   va_list ap;\n  101 |   va_start(ap, arg0);\n  102 |   char **argv = alloca((count_args(&ap) + 2) * sizeof(char *));\n  103 |   copy_args(argv, arg0, &ap);\n  104 |   va_end(ap);\n  105 |   return execvpe(file, argv, environ);\n  106 | }\n  107 | \n  108 | int execle(const char *path, const char *arg0, ...) {\n  109 |   va_list ap;\n  110 |   va_start(ap, arg0);\n  111 |   char **argv = alloca((count_args(&ap) + 2) * sizeof(char *));\n  112 |   copy_args(argv, arg0, &ap);\n  113 |   char **env = va_arg(ap, char **);\n  114 |   va_end(ap);\n  115 |   return execve(path, argv, env);\n  116 | }","lines":27,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold-wrapper.c#L90-L116"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"Two unguarded object-like/function-like macros are defined at the very top of\nthis header, which every translation unit in the project includes:\n\n* `ALWAYS_INLINE` (`src/mold.h:30`) is defined unconditionally to a GCC/Clang\n  `__attribute__`, has no `MOLD_` prefix, and is never `#undef`ed. On MSVC it\n  would break the ten `for_each_reloc(...) ALWAYS_INLINE` lambdas in the\n  `arch-*.cc` files, and the unprefixed name can collide with third-party\n  headers.\n* `msan_unpoison(addr, sz)` (`src/mold.h:42`) expands to *nothing* in the\n  default build, so any argument with a side effect would be silently dropped.\n\nBoth are macro-hygiene hazards in a header that also drags in `<windows.h>`\n(`src/mold.h:33`), which defines dozens of unprefixed macros of its own.","fix":"Prefix and guard them:\n\n```cpp\n#if defined(__GNUC__) || defined(__clang__)\n# define MOLD_ALWAYS_INLINE __attribute__((always_inline))\n#else\n# define MOLD_ALWAYS_INLINE\n#endif\n\n#if ENABLE_MSAN_UNPOISON\nextern \"C\" void __msan_unpoison(void *, size_t);\n# define msan_unpoison(addr, sz) __msan_unpoison(addr, sz)\n#else\n# define msan_unpoison(addr, sz) ((void)(addr), (void)(sz))\n#endif\n```\n\nand rename the ten uses in `src/arch-*.cc`.","locations":[{"ref":"src/mold.h:29-42","code":"   29 | #define ALWAYS_INLINE __attribute__((always_inline))\n   30 | \n   31 | #ifdef _WIN32\n   32 | # include <windows.h>\n   33 | #else\n   34 | # include <unistd.h>\n   35 | #endif\n   36 | \n   37 | #if ENABLE_MSAN_UNPOISON\n   38 | extern \"C\" void __msan_unpoison(void *, size_t);\n   39 | # define msan_unpoison(addr, sz) __msan_unpoison(addr, sz)\n   40 | #else\n   41 | # define msan_unpoison(addr, sz)\n   42 | #endif","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L29-L42"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`discarded_comdat_sym<E>` is a mutable global (`inline` variable template)\nassigned from the `Context<E>` constructor\n(`discarded_comdat_sym<E> = arena.template make<Symbol<E>>();`). It is compared\nagainst in `Symbol<E>::esym()` and `InputSection<E>::get_tombstone()` and used\nthroughout `input-files.cc`. This directly contradicts the design stated in the\ncomment above `Context` - \"Context represents a context object for each\ninvocation of the linker\" - because a second `Context<E>` (which\n`redo_main()` creates, `src/mold.h:2316`) silently overwrites the pointer that\nsymbols created by the first context still compare against, and two contexts\ncan never coexist.","fix":"Move the sentinel into `Context<E>` as a member\n(`Symbol<E> *discarded_comdat_sym = nullptr;`) and pass `ctx` to the handful of\nplaces that need it - `esym()` and `get_tombstone()` already receive or can\nreceive a `Context<E> &`. If that is too invasive, at least assert in the\n`Context` constructor that `discarded_comdat_sym<E>` is still null so a second\ncontext fails loudly instead of silently corrupting the first.","locations":[{"ref":"src/mold.h:61-63","code":"   61 | // Local symbols in discarded COMDAT sections all use one zero-valued symbol.\n   62 | template <typename E>\n   63 | inline Symbol<E> *discarded_comdat_sym;","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L61-L63"},{"ref":"src/mold.h:2697-2712","code":" 2697 | // Context represents a context object for each invocation of the linker.\n 2698 | // It contains command line flags, pointers to singleton objects\n 2699 | // (such as linker-synthesized output sections), unique_ptrs for\n 2700 | // resource management, and other miscellaneous objects.\n 2701 | template <typename E>\n 2702 | struct Context {\n 2703 |   Context() : symbol_map(arena) {\n 2704 |     discarded_comdat_sym<E> = arena.template make<Symbol<E>>();\n 2705 | \n 2706 |     arg.entry = get_symbol(*this, \"_start\");\n 2707 |     arg.fini = get_symbol(*this, \"_fini\");\n 2708 |     arg.init = get_symbol(*this, \"_init\");\n 2709 | \n 2710 |     if constexpr (is_sparc<E>)\n 2711 |       extra.tls_get_addr = get_symbol(*this, \"__tls_get_addr\");\n 2712 |   }","lines":16,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L2697-L2712"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`output_tmpfile`, `output_buffer_start` and `output_buffer_end` are plain\nnon-atomic, non-`volatile` inline globals that are written from ordinary linker\ncode (`src/output-file-unix.cc:60`, `:91-92`, `:127-131`) and read from a\n`SIGSEGV`/`SIGBUS` handler and from `cleanup()` (`src/signal-unix.cc:21-22`,\n`:45-46`). Reading a non-`volatile sig_atomic_t`-typed object that is modified\noutside the handler is undefined behaviour, and a partially written pointer in\nthe handler could make the crash handler `unlink()` a wrong path or\nmis-classify a fault as \"output buffer overrun\".","fix":"Declare them as atomics with relaxed access, which is well defined in signal\nhandlers when lock-free:\n\n```cpp\ninline std::atomic<char *> output_tmpfile = nullptr;\ninline std::atomic<u8 *> output_buffer_start = nullptr;\ninline std::atomic<u8 *> output_buffer_end = nullptr;\n```\n\nand load each exactly once at the top of the handler.","locations":[{"ref":"src/mold.h:163-173","code":"  163 | //\n  164 | // signal-unix.cc\n  165 | //\n  166 | \n  167 | inline char *output_tmpfile = nullptr;\n  168 | inline u8 *output_buffer_start = nullptr;\n  169 | inline u8 *output_buffer_end = nullptr;\n  170 | \n  171 | std::string errno_string();\n  172 | void cleanup();\n  173 | void install_signal_handler();","lines":11,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L163-L173"}]},
{"id":"OTHER_8","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`ObjectFile<E>::symtab_sec` and `SharedFile<E>::symtab_sec` are the only\npointer members in those classes without a default member initializer. Every\nother pointer member in the same classes (`llvm_addrsig`, `debug_info`,\n`debug_pubnames`, ...) is `= nullptr`. `ObjectFile` instances created through\n`ObjectFile(Context<E> &ctx)` (the internal file and the LTO placeholder,\n`src/passes.cc:813`, `src/lto-unix.cc:621`) never run `parse_symbols()`, so the\nmember holds an indeterminate value for the whole link.","fix":"```cpp\n-  const ElfShdr<E> *symtab_sec;\n+  const ElfShdr<E> *symtab_sec = nullptr;\n```\n\nin both classes. (Both are actually only read inside the function that assigns\nthem, so they could equally well become local variables.)","locations":[{"ref":"src/mold.h:2131-2134","code":" 2131 |   bool has_common_symbol = false;\n 2132 | \n 2133 |   const ElfShdr<E> *symtab_sec;\n 2134 |   std::span<U32<E>> symtab_shndx_sec;","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L2131-L2134"},{"ref":"src/mold.h:2172-2173","code":" 2172 |   std::vector<u16> versyms;\n 2173 |   const ElfShdr<E> *symtab_sec;","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L2172-L2173"}]},
{"id":"OTHER_9","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`Symbol<E>` is stored in `TaggedPtr<InputSection<E>, Chunk<E>,\nSectionFragment<E>, Symbol<E>>` (`Symbol<E>::origin`, set via\n`set_symbol_origin()`), which needs 2 tag bits and therefore\n`alignof(Symbol<E>) >= 4`. Its three siblings all carry an explicit\n`__attribute__((aligned(4)))` for exactly that reason - `InputSection` even has\na comment saying \"keep this type four-byte aligned even on hosts such as\nm68k\" - but `Symbol` has none. On a host ABI where `alignof(u64) == 2` (m68k\nSysV, which the `InputSection` comment calls out by name), the\n`static_assert(alignof(T) >= 1ULL << TAG_BITS)` in `TaggedPtr::operator=`\n(`lib/lib.h:89`) would fire and mold would fail to build.\n\nThe `SectionFragment` and `Chunk` attributes also lack the explanatory comment\nthat `InputSection` has, so a reader has no way of knowing they are load-bearing\nand not just a micro-optimization.","fix":"```cpp\n-template <typename E>\n-class Symbol {\n+// Symbol::origin stores tagged pointers to this type, so keep it four-byte\n+// aligned even on hosts such as m68k.\n+template <typename E>\n+class __attribute__((aligned(4))) Symbol {\n```\n\nand copy the same one-line rationale above `SectionFragment` (279) and `Chunk`\n(689).","locations":[{"ref":"src/mold.h:3049-3060","code":" 3049 | // Symbol class represents a symbol. For each unique symbol name, we\n 3050 | // create one instance of Symbol.\n 3051 | //\n 3052 | // A symbol has not only one but several different addresses if it\n 3053 | // has PLT or GOT entries. This class provides various functions to\n 3054 | // compute different addresses.\n 3055 | template <typename E>\n 3056 | class Symbol {\n 3057 | public:\n 3058 |   Symbol() = default;\n 3059 |   Symbol(const Symbol &) = delete;\n 3060 |   Symbol &operator=(const Symbol &) = delete;","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L3049-L3060"},{"ref":"src/mold.h:282-283","code":"  282 | template <typename E>\n  283 | struct __attribute__((aligned(4))) SectionFragment {","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L282-L283"},{"ref":"src/mold.h:710-711","code":"  710 | template <typename E>\n  711 | class __attribute__((aligned(4))) Chunk {","lines":2,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L710-L711"}]},
{"id":"OTHER_10","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`get_r_delta()` calls `ranges::upper_bound` with `std::less_equal<>{}` as the\ncomparator. `std::less_equal` is not a strict weak ordering, which the\nstandard requires for `upper_bound`; the code works only because libstdc++'s\nimplementation evaluates `comp(value, *mid)` exactly once per step. It is\nalso non-obvious to readers what the resulting semantics are (it returns the\ndelta of the last entry whose offset is strictly less than `offset`).","fix":"Use a conforming formulation, e.g. `auto it = ranges::lower_bound(deltas, offset, {}, &RelocDelta::offset); return (it == deltas.begin()) ? 0 : (it - 1)->delta;`, and add a one-line comment stating that a delta recorded exactly at `offset` does not apply to that offset.","locations":[{"ref":"src/shrink-sections.cc:69-75","code":"   69 | template <>\n   70 | i64 get_r_delta(InputSection<E> &isec, u64 offset) {\n   71 |   std::span<RelocDelta> deltas = isec.extra.r_deltas;\n   72 |   auto it = ranges::upper_bound(deltas, offset, std::less_equal<>{},\n   73 |                                 &RelocDelta::offset);\n   74 |   return (it == deltas.begin()) ? 0 : (it - 1)->delta;\n   75 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/shrink-sections.cc#L69-L75"}]},
{"id":"OTHER_11","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The constant is named `EM_S390X`, but the official ELF machine name for value 22\nis `EM_S390` (it covers both 31-bit s390 and 64-bit s390x). Every other entry in\nthe enum uses the standard spelling, so grepping for `EM_S390` - the name that\nappears in the psABI, in glibc's `elf.h` and in binutils - finds nothing.","fix":"Rename to the standard name and update the two uses:\n`EM_S390X = 22,` -> `EM_S390 = 22,` (in `elf.h:235`, `filetype.cc:167` and\n`S390X::e_machine` in `elf.h:2136`).","locations":[{"ref":"src/elf.h:229-243","code":"  229 | enum : u32 {\n  230 |   EM_NONE = 0,\n  231 |   EM_386 = 3,\n  232 |   EM_68K = 4,\n  233 |   EM_PPC = 20,\n  234 |   EM_PPC64 = 21,\n  235 |   EM_S390X = 22,\n  236 |   EM_ARM = 40,\n  237 |   EM_SH = 42,\n  238 |   EM_SPARC64 = 43,\n  239 |   EM_X86_64 = 62,\n  240 |   EM_AARCH64 = 183,\n  241 |   EM_RISCV = 243,\n  242 |   EM_LOONGARCH = 258,\n  243 | };","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/elf.h#L229-L243"}]},
{"id":"OTHER_12","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`R_RISCV_GOT32_PCREL = 41` is placed between `R_RISCV_SET32 = 56` and\n`R_RISCV_32_PCREL = 57` in an otherwise strictly ascending list. The value\nitself is correct, but the misplacement defeats the visual scan that is the only\nway to spot a duplicated or skipped relocation number in a 60-entry table.","fix":"Move `R_RISCV_GOT32_PCREL = 41,` up so it sits between\n`R_RISCV_SUB64 = 40,` and `R_RISCV_ALIGN = 43,`.","locations":[{"ref":"src/elf.h:820-826","code":"  820 |   R_RISCV_SET6 = 53,\n  821 |   R_RISCV_SET8 = 54,\n  822 |   R_RISCV_SET16 = 55,\n  823 |   R_RISCV_SET32 = 56,\n  824 |   R_RISCV_GOT32_PCREL = 41,\n  825 |   R_RISCV_32_PCREL = 57,\n  826 |   R_RISCV_IRELATIVE = 58,","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/elf.h#L820-L826"}]},
{"id":"OTHER_13","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`scan_pcrel()` and `scan_absrel()` declare their decision matrices as\n`static Action table[][4]` - non-const function-local statics. They are never\nwritten, so they belong in read-only memory; as written they occupy writable\ndata and prevent the compiler from folding the lookup. This also makes them\nmutable-by-accident shared state across all threads that scan relocations\nconcurrently.","fix":"```c++\n-  static Action table[][4] = {\n+  static constexpr Action table[][4] = {\n```\nin both functions.","locations":[{"ref":"src/input-sections.cc:184-191","code":"  184 |   static Action table[][4] = {\n  185 |     // Absolute  Local    Imported data  Imported code\n  186 |     {  ERROR,    NONE,    ERROR,         PLT       }, // Shared object\n  187 |     {  ERROR,    NONE,    CANONICAL,     CANONICAL }, // Position-independent exec\n  188 |     {  NONE,     NONE,    CANONICAL,     CANONICAL }, // Position-dependent exec\n  189 |   };\n  190 | \n  191 |   Action action = table[get_output_type(ctx)][get_sym_type(sym)];","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-sections.cc#L184-L191"},{"ref":"src/input-sections.cc:203-210","code":"  203 |   static Action table[][4] = {\n  204 |     // Absolute  Local    Imported data  Imported code\n  205 |     {  NONE,     ERROR,   ERROR,         ERROR     }, // Shared object\n  206 |     {  NONE,     ERROR,   ERROR,         ERROR     }, // Position-independent exec\n  207 |     {  NONE,     NONE,    CANONICAL,     CANONICAL }, // Position-dependent exec\n  208 |   };\n  209 | \n  210 |   Action action = table[get_output_type(ctx)][get_sym_type(sym)];","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-sections.cc#L203-L210"}]},
{"id":"OTHER_14","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`Chunk<E>` interleaves two `virtual` member functions\n(`compute_symtab_size`, `populate_symtab`) with its data members, between\n`is_compressed` and `local_symtab_idx`. Everything else in the class follows the\nconventional \"virtuals first, data last\" layout, and the surrounding comment\n(\"Some synethetic sections add local symbols...\") describes the *data*\nmembers that follow, not the virtuals it is attached to.","fix":"Move the two `virtual void ...` declarations up next to the other virtuals at\n`src/mold.h:696-703`, and keep the comment attached to the\n`local_symtab_idx` / `num_local_symtab` / `strtab_size` / `strtab_offset`\nblock it actually documents.","locations":[{"ref":"src/mold.h:726-751","code":"  726 |   std::string_view name;\n  727 |   ElfShdr<E> shdr = { .sh_addralign = 1 };\n  728 |   i64 shndx = 0;\n  729 |   i64 num_dynrels = 0;\n  730 |   i64 num_relrs = 0;\n  731 |   std::vector<u64> relr;\n  732 |   bool is_relro = false;\n  733 | \n  734 |   // For --gdb-index\n  735 |   bool is_compressed = false;\n  736 | \n  737 |   // Some synethetic sections add local symbols to the output.\n  738 |   // For example, range extension thunks adds function_name@thunk\n  739 |   // symbol for each thunk entry. The following members are used\n  740 |   // for such synthesizing symbols.\n  741 |   virtual void compute_symtab_size(Context<E> &ctx) {}\n  742 |   virtual void populate_symtab(Context<E> &ctx) {}\n  743 | \n  744 |   i64 local_symtab_idx = 0;\n  745 |   i64 num_local_symtab = 0;\n  746 |   i64 strtab_size = 0;\n  747 |   i64 strtab_offset = 0;\n  748 | \n  749 |   // For --section-order\n  750 |   i64 sect_order = 0;\n  751 | };","lines":26,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L726-L751"}]},
{"id":"OTHER_15","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"The output symbol-table bookkeeping fields are declared with different signed\ntypes on the two classes that carry them: `Chunk<E>` uses `i64`\n(`local_symtab_idx`, `num_local_symtab`, `strtab_size`, `strtab_offset`), while\n`InputFile<E>` uses `u64` for the same five names plus `global_symtab_idx` /\n`num_global_symtab`. They are summed and compared against each other in\n`create_output_symtab()` and `SymtabSection::update_shdr()`, so every mixed\nexpression is a signed/unsigned comparison. `Symbol<E>::get_output_sym_idx()`\n(`src/mold.h:3964-3971`) then adds an `i64` from `output_sym_indices` to the\n`u64 local_symtab_idx`, yielding an unsigned result that is returned as `i64`.","fix":"Make `InputFile<E>`'s six counters `i64` to match `Chunk<E>` (the codebase\notherwise uses `i64` uniformly for sizes and indices):\n\n```cpp\n-  u64 local_symtab_idx = 0;\n-  u64 global_symtab_idx = 0;\n-  u64 num_local_symtab = 0;\n-  u64 num_global_symtab = 0;\n-  u64 strtab_offset = 0;\n-  u64 strtab_size = 0;\n+  i64 local_symtab_idx = 0;\n+  i64 global_symtab_idx = 0;\n+  i64 num_local_symtab = 0;\n+  i64 num_global_symtab = 0;\n+  i64 strtab_offset = 0;\n+  i64 strtab_size = 0;\n```","locations":[{"ref":"src/mold.h:741-750","code":"  741 |   virtual void compute_symtab_size(Context<E> &ctx) {}\n  742 |   virtual void populate_symtab(Context<E> &ctx) {}\n  743 | \n  744 |   i64 local_symtab_idx = 0;\n  745 |   i64 num_local_symtab = 0;\n  746 |   i64 strtab_size = 0;\n  747 |   i64 strtab_offset = 0;\n  748 | \n  749 |   // For --section-order\n  750 |   i64 sect_order = 0;","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L741-L750"},{"ref":"src/mold.h:2011-2020","code":" 2011 |   // To create an output .symtab\n 2012 |   u64 local_symtab_idx = 0;\n 2013 |   u64 global_symtab_idx = 0;\n 2014 |   u64 num_local_ {"id":"OTHER_16","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"Five option enums are declared with the C idiom `typedef enum { ... } Name;`\nin a C++20 codebase, producing unscoped enumerators (`UNRESOLVED_ERROR`,\n`BSYMBOLIC_ALL`, `SEPARATE_CODE`, `CET_REPORT_NONE`,\n`SHUFFLE_SECTIONS_SHUFFLE`, ...) at namespace scope. `AbsRelKind`\n(`src/mold.h:802-808`) and the `NEEDS_*` / `NO_PLT` anonymous enums\n(`src/mold.h:2930-2944`) do the same. All of these leak into every TU and can\nimplicitly convert to `int`, so a wrong-enum argument such as\n`get_addr(ctx, ABS_REL_RELR)` compiles silently.","fix":"Convert to scoped enums with an explicit underlying type, e.g.\n\n```cpp\nenum class UnresolvedKind : u8 { ERROR, WARN, IGNORE };\n```\n\nand qualify the ~40 use sites in `cmdline.cc` / `passes.cc`. The `NEEDS_*` set\nshould become a scoped bitmask type (or stay an anonymous enum but be nested\ninside `Symbol`), and `NO_PLT`/`NO_OPD` should become\n`enum class GetAddrFlags : u8`.","locations":[{"ref":"src/mold.h:2608-2638","code":" 2608 | typedef enum {\n 2609 |   UNRESOLVED_ERROR,\n 2610 |   UNRESOLVED_WARN,\n 2611 |   UNRESOLVED_IGNORE,\n 2612 | } UnresolvedKind;\n 2613 | \n 2614 | typedef enum {\n 2615 |   BSYMBOLIC_NONE,\n 2616 |   BSYMBOLIC_ALL,\n 2617 |   BSYMBOLIC_FUNCTIONS,\n 2618 |   BSYMBOLIC_NON_WEAK,\n 2619 |   BSYMBOLIC_NON_WEAK_FUNCTIONS,\n 2620 | } BsymbolicKind;\n 2621 | \n 2622 | typedef enum {\n 2623 |   SEPARATE_LOADABLE_SEGMENTS,\n 2624 |   SEPARATE_CODE,\n 2625 |   NOSEPARATE_CODE,\n 2626 | } SeparateCodeKind;\n 2627 | \n 2628 | typedef enum {\n 2629 |   CET_REPORT_NONE,\n 2630 |   CET_REPORT_WARNING,\n 2631 |   CET_REPORT_ERROR,\n 2632 | } CetReportKind;\n 2633 | \n 2634 | typedef enum {\n 2635 |   SHUFFLE_SECTIONS_NONE,\n 2636 |   SHUFFLE_SECTIONS_SHUFFLE,\n 2637 |   SHUFFLE_SECTIONS_REVERSE,\n 2638 | } ShuffleSectionsKind;","lines":31,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145d
