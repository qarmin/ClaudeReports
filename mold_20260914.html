{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`R_68K_TLS_LE16` and `R_68K_TLS_LE8` are written with the *unsigned* helpers `write16`\n(`check(val, 0, 1 << 16)`) and `write8` (`check(val, 0, 1 << 8)`), but on m68k the thread\npointer is placed 0x7000 bytes *into* the TLS block\n(`get_tp_addr()` returns `phdr.p_vaddr + 0x7000`, `src/tls.cc:170-178`). Therefore\n`S + A - ctx.tp_addr` is negative for every thread-local variable in the first 28 KiB of\nthe TLS block, and mold reports a bogus `relocation ... out of range` error (or, with\n`--noinhibit-exec`, writes a truncated value). The sibling `R_68K_TLS_LDO16`/`LDO8` cases,\nwhose value is biased the same way, correctly use the signed `write16s`/`write8s` helpers.","fix":"Use the signed variants for the TP-relative cases:\n```\n     case R_68K_TLS_LE16:\n-      write16(S + A - ctx.tp_addr);\n+      write16s(S + A - ctx.tp_addr);\n       break;\n     case R_68K_TLS_LE8:\n-      write8(S + A - ctx.tp_addr);\n+      write8s(S + A - ctx.tp_addr);\n       break;\n```","locations":[{"ref":"src/arch-m68k.cc:199-207","code":"  199 |     case R_68K_TLS_LE32:\n  200 |       *(ub32 *)loc = S + A - ctx.tp_addr;\n  201 |       break;\n  202 |     case R_68K_TLS_LE16:\n  203 |       write16(S + A - ctx.tp_addr);\n  204 |       break;\n  205 |     case R_68K_TLS_LE8:\n  206 |       write8(S + A - ctx.tp_addr);\n  207 |       break;","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-m68k.cc#L199-L207"},{"ref":"src/arch-m68k.cc:184-189","code":"  184 |     case R_68K_TLS_LDO16:\n  185 |       write16s(S + A - ctx.dtp_addr);\n  186 |       break;\n  187 |     case R_68K_TLS_LDO8:\n  188 |       write8s(S + A - ctx.dtp_addr);\n  189 |       break;","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-m68k.cc#L184-L189"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`PPC64OpdSection` unconditionally emits `R_PPC64_RELATIVE` dynamic relocations (or RELR\nentries) for every `.opd` entry, storing `sym->get_addr(ctx, NO_PLT | NO_OPD)` as the\naddend. For a GNU ifunc symbol that address is the *resolver*, so a function pointer taken\nto an ifunc resolves to the resolver itself instead of the selected implementation.\n`scan_relocations` does mark ifuncs with `NEEDS_GOT | NEEDS_PLT | NEEDS_PPC_OPD`\n(`src/arch-ppc64v1.cc:343-344`) and `PPC64V1` does define `R_IRELATIVE`\n(`src/elf.h:2090-2107`), so ifunc support is intended. `GotSection` handles the same\nsituation correctly by emitting `R_IRELATIVE` and excluding ifunc slots from RELR\n(`src/output-chunks.cc:1716-1718`).","fix":"In `PPC64OpdSection::write_dynrels` emit `ElfRel<E>(loc, E::R_IRELATIVE, 0, sym->get_addr(ctx, NO_PLT | NO_OPD))`\nwhen `sym->is_ifunc()`, and skip such entries in `get_relr_offsets()` (RELR can only encode\nplain relative relocations), exactly as `GotSection` does.","locations":[{"ref":"src/arch-ppc64v1.cc:669-693","code":"  669 | void PPC64OpdSection::write_dynrels(Context<E> &ctx, ElfRel<E> *buf) const {\n  670 |   if (!ctx.arg.pic)\n  671 |     return;\n  672 | \n  673 |   for (Symbol<E> *sym : symbols) {\n  674 |     u64 loc = sym->get_opd_addr(ctx);\n  675 |     if (!ctx.arg.pack_dyn_relocs_relr || !this->num_relrs ||\n  676 |         loc % sizeof(Word<E>) != 0)\n  677 |       *buf++ = ElfRel<E>(loc, E::R_RELATIVE, 0, sym->get_addr(ctx, NO_PLT | NO_OPD));\n  678 |     if (!ctx.arg.pack_dyn_relocs_relr || !this->num_relrs ||\n  679 |         (loc + 8) % sizeof(Word<E>) != 0)\n  680 |       *buf++ = ElfRel<E>(loc + 8, E::R_RELATIVE, 0, ctx.extra.TOC->value);\n  681 |   }\n  682 | }\n  683 | \n  684 | void PPC64OpdSection::copy_buf(Context<E> &ctx) {\n  685 |   ub64 *buf = (ub64 *)(ctx.buf + this->shdr.sh_offset);\n  686 | \n  687 |   for (Symbol<E> *sym : symbols) {\n  688 |     u64 addr = sym->get_addr(ctx, NO_PLT | NO_OPD);\n  689 |     *buf++ = addr;\n  690 |     *buf++ = ctx.extra.TOC->value;\n  691 |     *buf++ = 0;\n  692 |   }\n  693 | }","lines":25,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v1.cc#L669-L693"},{"ref":"src/arch-ppc64v1.cc:655-667","code":"  655 | std::vector<u64> PPC64OpdSection::get_relr_offsets(Context<E> &ctx) {\n  656 |   if (!ctx.arg.pic)\n  657 |     return {};\n  658 | \n  659 |   std::vector<u64> offsets;\n  660 |   offsets.reserve(symbols.size() * 2);\n  661 |   for (Symbol<E> *sym : symbols) {\n  662 |     u64 loc = sym->get_opd_addr(ctx) - this->shdr.sh_addr;\n  663 |     offsets.push_back(loc);\n  664 |     offsets.push_back(loc + 8);\n  665 |   }\n  666 |   return offsets;\n  667 | }","lines":13,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v1.cc#L655-L667"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`apply_reloc_alloc` writes 4 bytes *after* the relocated place without any bounds check:\nthe ELFv2 backend tests `*(ul32 *)(loc + 4) == 0x6000'0000` and overwrites it with\n`ld r2, 24(r1)`, and the ELFv1 backend does the same with `ld r2, 40(r1)`. `r_offset` comes\nfrom the input object file, so a `R_PPC64_REL24` whose `bl` is the last instruction of a\nsection makes mold read and potentially write into whatever output-buffer bytes follow the\nsection - i.e. the beginning of the next input section in the same output section.","fix":"Guard the peek/patch with the section size, e.g.\n`if (rel.r_offset + 8 <= (u64)sh_size && *(ul32 *)(loc + 4) == 0x6000'0000)`, and report an\nerror (or simply skip the r2 restore) otherwise.","locations":[{"ref":"src/arch-ppc64v2.cc:242-245","code":"  242 |         // restore it after function return. To do so, there's usually a\n  243 |         // NOP as a placeholder after a BL. 0x6000'0000 is a NOP.\n  244 |         if (*(ul32 *)(loc + 4) == 0x6000'0000)\n  245 |           *(ul32 *)(loc + 4) = 0xe841'0018; // ld r2, 24(r1)","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v2.cc#L242-L245"},{"ref":"src/arch-ppc64v1.cc:211-216","code":"  211 |       // If a callee is an external function, PLT saves %r2 to the\n  212 |       // caller's r2 save slot. We need to restore it after function\n  213 |       // return. To do so, there's usually a NOP as a placeholder\n  214 |       // after a BL. 0x6000'0000 is a NOP.\n  215 |       if (sym.has_plt(ctx) && *(ub32 *)(loc + 4) == 0x6000'0000)\n  216 |         *(ub32 *)(loc + 4) = 0xe841'0028; // ld r2, 40(r1)","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-ppc64v1.cc#L211-L216"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The mask in `set_rs1` is one binary digit short: `0b111111'11111'00000'111'11111'1111111`\ncontains 31 digits, so as a 32-bit value it is `0x7ff07fff` rather than the intended\n`0xfff07fff`. In addition to clearing the `rs1` field (bits 19..15) it therefore also\nclears bit 31 of the instruction, which is `imm[11]` for I-type and the top bit of\n`imm[11:5]` for S-type. `set_rs1` is called right after `write_itype`/`write_stype` when\n`is_int(val, 12)` holds (`src/arch-riscv.cc:465-466` and `src/arch-riscv.cc:494-495`), and\nthat condition explicitly admits negative 12-bit values, whose sign bit is exactly bit 31.\nSo for a negative `%lo12` value the just-written immediate is silently truncated to a\npositive one.","fix":"Add the missing digit so the mask covers all 32 bits:\n```\n-  *(ul32 *)loc &= 0b111111'11111'00000'111'11111'1111111;\n+  *(ul32 *)loc &= 0b1111111'11111'00000'111'11111'1111111;\n```\n(`0b1111111'11111` = the 12-bit immediate field, i.e. mask `0xfff07fff`.)","locations":[{"ref":"src/arch-riscv.cc:83-87","code":"   83 | static void set_rs1(u8 *loc, u32 rs1) {\n   84 |   assert(rs1 < 32);\n   85 |   *(ul32 *)loc &= 0b111111'11111'00000'111'11111'1111111;\n   86 |   *(ul32 *)loc |= rs1 << 15;\n   87 | }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L83-L87"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`--thinlto-index-only` is handled by `read_arg` first and `read_flag` second. `read_arg`\nmatches the bare `--thinlto-index-only` (empty remainder) and then eats the *following*\ncommand line argument as its value, so the documented flag form silently swallows the next\ninput file and the `read_flag` branch below it is unreachable for the single-argument form.\nOnly `--thinlto-index-only=file` behaves as intended.","fix":"Use `read_eq` for the value form so that the bare flag falls through to `read_flag`:\n```\n-    } else if (read_arg(\"thinlto-index-only\")) {\n+    } else if (read_eq(\"thinlto-index-only\")) {\n       ctx.arg.plugin_opt.push_back(\"thinlto-index-only=\" + std::string(arg));\n     } else if (read_flag(\"thinlto-index-only\")) {\n```","locations":[{"ref":"src/cmdline.cc:1357-1360","code":" 1357 |     } else if (read_arg(\"thinlto-index-only\")) {\n 1358 |       ctx.arg.plugin_opt.push_back(\"thinlto-index-only=\" + std::string(arg));\n 1359 |     } else if (read_flag(\"thinlto-index-only\")) {\n 1360 |       ctx.arg.plugin_opt.emplace_back(\"thinlto-index-only\");","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L1357-L1360"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Error<E>::Error` and `Warn<E>::Warn` write `ctx.has_error = true`, and\n`has_error` is a plain `bool` (`src/mold.h:2769`). Diagnostics are routinely\nemitted from inside `tbb::parallel_for`/`parallel_for_each` bodies all over\nmold, so two threads can write the flag concurrently. That is a data race and\nformally undefined behaviour; it is reported by ThreadSanitizer and, on a\ncompiler that widens the byte store, could clobber the neighbouring fields in\n`Context`. Every other cross-thread flag in the codebase (`is_alive`,\n`is_visited`, `is_reachable`, ...) uses `Atomic<bool>`.","fix":"Change the declaration in `Context` from `bool has_error = false;` to\n`Atomic<bool> has_error = false;`. `Atomic` already provides `operator=(T)` and\n`operator T()`, so no call site needs to change.","locations":[{"ref":"src/error.cc:24-47","code":"   24 | template <typename E>\n   25 | Error<E>::Error(Context<E> &ctx) {\n   26 |   if (ctx.arg.noinhibit_exec) {\n   27 |     out << (ctx.arg.color_diagnostics ? warning_color : warning_mono);\n   28 |   } else {\n   29 |     out << (ctx.arg.color_diagnostics ? error_color : error_mono);\n   30 |     ctx.has_error = true;\n   31 |   }\n   32 | }\n   33 | \n   34 | template <typename E>\n   35 | Warn<E>::Warn(Context<E> &ctx) {\n   36 |   if (ctx.arg.suppress_warnings)\n   37 |     return;\n   38 | \n   39 |   out.emplace(std::cerr);\n   40 | \n   41 |   if (ctx.arg.fatal_warnings) {\n   42 |     *out << (ctx.arg.color_diagnostics ? error_color : error_mono);\n   43 |     ctx.has_error = true;\n   44 |   } else {\n   45 |     *out << (ctx.arg.color_diagnostics ? warning_color : warning_mono);\n   46 |   }\n   47 | }","lines":24,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/error.cc#L24-L47"},{"ref":"src/mold.h:2867","code":" 2867 |   bool has_error = false;","lines":1,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L2867"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `break` at the end of the loop body in `is_gcc_lto_obj` is intended to stop\nafter examining the first `SHT_SYMTAB` section, but it also terminates the loop\nthat performs the GCC FAT LTO detection (`.gnu.lto_.symtab.` name scan). If a\n`.gnu.lto_.symtab.*` section appears *after* `.symtab` in the section header\ntable, the FAT LTO object is misclassified as a plain `FileType::ELF_OBJ` and\nthe LTO plugin is never handed the LTO bytecode, silently losing link-time\noptimization. The current behaviour only works because GNU as happens to emit\n`.symtab` near the end of the section list.","fix":"Separate the two scans: run the `.gnu.lto_.symtab.` name check over all sections\nfirst (when `has_gcc_plugin`), and only then look for the first `SHT_SYMTAB` and\n`break` out of that second loop.","locations":[{"ref":"src/filetype.cc:32-68","code":"   32 |   for (ElfShdr<E> &sec : shdrs) {\n   33 |     // GCC FAT LTO objects contain both regular ELF sections and GCC-\n   34 |     // specific LTO sections, so that they can be linked as LTO objects if\n   35 |     // the LTO linker plugin is available and falls back as regular\n   36 |     // objects otherwise. GCC FAT LTO object can be identified by the\n   37 |     // presence of `.gcc.lto_.symtab` section.\n   38 |     if (has_gcc_plugin) {\n   39 |       std::string_view name = data + shdrs[shstrtab_idx].sh_offset + sec.sh_name;\n   40 |       if (name.starts_with(\".gnu.lto_.symtab.\"))\n   41 |         return true;\n   42 |     }\n   43 | \n   44 |     if (sec.sh_type != SHT_SYMTAB)\n   45 |       continue;\n   46 | \n   47 |     // GCC non-FAT LTO object contains only sections symbols followed by\n   48 |     // a common symbol whose name is `__gnu_lto_slim` (or `__gnu_lto_v1`\n   49 |     // for older GCC releases).\n   50 |     std::span<ElfSym<E>> elf_syms{(ElfSym<E> *)(data + sec.sh_offset),\n   51 |                                   (size_t)sec.sh_size / sizeof(ElfSym<E>)};\n   52 | \n   53 |     auto skip = [](u8 type) {\n   54 |       return type == STT_NOTYPE || type == STT_FILE || type == STT_SECTION;\n   55 |     };\n   56 | \n   57 |     i64 i = 1;\n   58 |     while (i < elf_syms.size() && skip(elf_syms[i].st_type))\n   59 |       i++;\n   60 | \n   61 |     if (i < elf_syms.size() && elf_syms[i].st_shndx == SHN_COMMON) {\n   62 |       std::string_view name =\n   63 |         data + shdrs[sec.sh_link].sh_offset + elf_syms[i].st_name;\n   64 |       if (name.starts_with(\"__gnu_lto_\"))\n   65 |         return true;\n   66 |     }\n   67 |     break;\n   68 |   }","lines":37,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/filetype.cc#L32-L68"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`--print-gc-sections` always reports `GC saved 0 bytes`. `saved_bytes` is\ninitialized to `0` and printed, but nothing ever adds to it - the inner loop\nonly prints the section name. Compare with `print_icf_sections` in `icf.cc`,\nwhich does accumulate `saved_bytes += leader->get_contents().size()`.","fix":"Accumulate the removed section sizes:\n```cpp\ni64 saved_bytes = 0;\nfor (std::span<InputSection<E> *> vec : sections)\n  for (InputSection<E> *isec : vec) {\n    *out << \"removing unused section \" << *isec << '\\n';\n    saved_bytes += isec->get_contents().size();\n  }\n```","locations":[{"ref":"src/gc-sections.cc:244-249","code":"  244 |     i64 saved_bytes = 0;\n  245 |     for (std::span<InputSection<E> *> vec : sections)\n  246 |       for (InputSection<E> *isec : vec)\n  247 |         *out << \"removing unused section \" << *isec << '\\n';\n  248 | \n  249 |     *out << \"GC saved \" << saved_bytes << \" bytes\\n\";","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/gc-sections.cc#L244-L249"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The zstd decompression loop can spin forever on a truncated/corrupt compressed\nsection. `ZSTD_decompressStream()` returns a non-zero \"hint\" when it needs more\ninput; once `in.pos == in.size` and no further output can be produced, it keeps\nreturning the same non-error, non-zero value and `out.pos` stops advancing, so\n`while (out.pos < out.size)` never terminates and mold burns CPU indefinitely.\nThe existing guard only catches the `r == 0` case.","fix":"Detect lack of progress:\n```c++\nwhile (out.pos < out.size) {\n  size_t prev_out = out.pos, prev_in = in.pos;\n  size_t r = ZSTD_decompressStream(dctx, &out, &in);\n  if (ZSTD_isError(r))\n    Fatal(ctx) << *this << \": uncompress failed: \" << ZSTD_getErrorName(r);\n  if (out.pos == prev_out && in.pos == prev_in)\n    Fatal(ctx) << *this << \": uncompress failed: premature end of input\";\n}\n```","locations":[{"ref":"src/input-sections.cc:110-125","code":"  110 |   case ELFCOMPRESS_ZSTD: {\n  111 |     ZSTD_DCtx *dctx = ZSTD_createDCtx();\n  112 |     ZSTD_inBuffer in = { data.data(), data.size() };\n  113 |     ZSTD_outBuffer out = { buf, (size_t)sz };\n  114 | \n  115 |     while (out.pos < out.size) {\n  116 |       size_t r = ZSTD_decompressStream(dctx, &out, &in);\n  117 |       if (ZSTD_isError(r))\n  118 |         Fatal(ctx) << *this << \": uncompress failed: \" << ZSTD_getErrorName(r);\n  119 |       if (r == 0 && out.pos < out.size)\n  120 |         Fatal(ctx) << *this << \": uncompress failed: premature end of input\";\n  121 |     }\n  122 |     ZSTD_freeDCtx(dctx);\n  123 |     msan_unpoison(buf, sz);\n  124 |     break;\n  125 |   }","lines":16,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-sections.cc#L110-L125"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`NotePropertySection<E>::update_shdr` only merges GNU properties whose key falls in\none of the three x86 ranges (`GNU_PROPERTY_X86_UINT32_AND_LO..HI`,\n`..._OR_LO..HI`, `..._OR_AND_LO..HI`, i.e. `0xc0000002`-`0xc0017fff`). Every other\nkey that was collected from the inputs into `file->gnu_properties` falls through all\nthree branches and is silently dropped from the output. The most important casualty\nis `GNU_PROPERTY_AARCH64_FEATURE_1_AND` (`0xc0000000`, BTI/PAC), which is just below\nthe x86 `AND` range: linking AArch64 objects that were compiled with\n`-mbranch-protection=standard` produces an executable whose `.note.gnu.property`\nloses the BTI/PAC bits (and, if that was the only property, the note section becomes\nempty and is removed), silently disabling a hardening feature that GNU ld and LLD\npreserve. `GNU_PROPERTY_1_NEEDED` (`0xb0000000`) is dropped the same way.","fix":"Add a generic AND-type branch for keys outside the x86 ranges, at minimum `GNU_PROPERTY_AARCH64_FEATURE_1_AND` (define it in `src/elf.h` as `0xc0000000`), merging it with the same all-inputs-must-have-it semantics used for `GNU_PROPERTY_X86_UINT32_AND_*`; unknown keys should be dropped only deliberately, ideally with a warning.","locations":[{"ref":"src/output-chunks.cc:3348-3375","code":" 3348 |   std::map<u32, u32> map;\n 3349 | \n 3350 |   for (u32 key : keys) {\n 3351 |     if (GNU_PROPERTY_X86_UINT32_AND_LO <= key &&\n 3352 |         key <= GNU_PROPERTY_X86_UINT32_AND_HI) {\n 3353 |       // An AND feature is set if all input objects have the property and\n 3354 |       // the feature.\n 3355 |       map[key] = 0xffff'ffff;\n 3356 |       for (ObjectFile<E> *file : files)\n 3357 |         map[key] &= get_value(file, key);\n 3358 |     } else if (GNU_PROPERTY_X86_UINT32_OR_LO <= key &&\n 3359 |                key <= GNU_PROPERTY_X86_UINT32_OR_HI) {\n 3360 |       // An OR feature is set if some input object has the feature.\n 3361 |       for (ObjectFile<E> *file : files)\n 3362 |         map[key] |= get_value(file, key);\n 3363 |     } else if (GNU_PROPERTY_X86_UINT32_OR_AND_LO <= key &&\n 3364 |                key <= GNU_PROPERTY_X86_UINT32_OR_AND_HI) {\n 3365 |       // An OR-AND feature is set if all input object files have the property\n 3366 |       // and some of them has the feature.\n 3367 |       auto has_key = [&](ObjectFile<E> *file) {\n 3368 |         return file->gnu_properties.contains(key);\n 3369 |       };\n 3370 | \n 3371 |       if (ranges::all_of(files, has_key))\n 3372 |         for (ObjectFile<E> *file : files)\n 3373 |           map[key] |= get_value(file, key);\n 3374 |     }\n 3375 |   }","lines":28,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L3348-L3375"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`-z start-stop-visibility=protected` is implemented by only flipping\n`is_exported`:\n\n```\nauto add_start_stop = [&](std::string s) {\n  add(save_string(ctx, s));\n  if (ctx.arg.z_start_stop_visibility_protected)\n    get_symbol(ctx, save_string(ctx, s))->is_exported = true;\n};\n```\n\nbut `add()` creates the synthetic `ElfSym` with `st_visibility = STV_HIDDEN`,\nand symbol resolution keeps the most restrictive visibility, so\n`sym.visibility` stays `STV_HIDDEN`. The dynamic symbol writer copies\n`esym.st_visibility = sym.visibility`, so `__start_foo`/`__stop_foo` are\nemitted into `.dynsym` marked `STV_HIDDEN` instead of `STV_PROTECTED` - a\nself-contradictory entry (GNU ld emits `PROTECTED`). The existing test\n`test/z-start-stop-visibility.sh` only greps for the symbol name, so it does\nnot catch the wrong visibility. Also, `is_protected()` and any consumer that\nkeys off `STV_PROTECTED` will treat the symbol as interposable.","fix":"Let `add()` take a visibility argument (or return the symbol and set both fields): create the `__start_`/`__stop_` esyms with `st_visibility = STV_PROTECTED` when `ctx.arg.z_start_stop_visibility_protected` is set, and set `sym->visibility = STV_PROTECTED` in addition to `sym->is_exported = true`.","locations":[{"ref":"src/passes.cc:947-960","code":"  947 |   auto add = [&](std::string_view name, u32 type = STT_NOTYPE) {\n  948 |     ElfSym<E> esym;\n  949 |     memset(&esym, 0, sizeof(esym));\n  950 |     esym.st_type = type;\n  951 |     esym.st_shndx = SHN_ABS;\n  952 |     esym.st_bind = STB_GLOBAL;\n  953 |     esym.st_visibility = STV_HIDDEN;\n  954 |     ctx.internal_esyms.push_back(esym);\n  955 | \n  956 |     Symbol<E> *sym = get_symbol(ctx, name);\n  957 |     sym->value = 0xdeadbeef; // unique dummy value\n  958 |     obj.symbols.emplace_back(sym);\n  959 |     return sym;\n  960 |   };","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L947-L960"},{"ref":"src/passes.cc:1015-1019","code":" 1015 |   auto add_start_stop = [&](std::string s) {\n 1016 |     add(save_string(ctx, s));\n 1017 |     if (ctx.arg.z_start_stop_visibility_protected)\n 1018 |       get_symbol(ctx, save_string(ctx, s))->is_exported = true;\n 1019 |   };","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L1015-L1019"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`set_virtual_addresses_regular()` aligns the *first* TLS chunk to\n`get_tls_segment_alignment(ctx)` (the maximum `sh_addralign` over all\n`SHF_TLS` chunks) so that `p_vaddr` of `PT_TLS` satisfies the segment's\n`p_align`:\n\n```\nif (is_tls(chunks[i]) && (i == 0 || !is_tls(chunks[i - 1])))\n  addr = align_to(addr, get_tls_segment_alignment(ctx));\n```\n\n`set_virtual_addresses_by_order()` (the `--section-order` path) has no such\nstep; it only aligns each chunk to its own `sh_addralign`. `create_phdr()`\nstill computes `PT_TLS`'s `p_align` as the maximum alignment of all its\nmember sections (`append()` does `p_align = max(p_align, sh_addralign)`), so\nif, say, `.tdata` has alignment 8 and `.tbss` alignment 32, `p_vaddr` ends up\nonly 8-byte aligned while `p_align` is 32. All TP-relative offsets that mold\nbakes into the code are computed from `get_tp_addr(phdr)` using the\nlink-time `p_vaddr`, but the runtime aligns the TLS block start to `p_align`,\nso every thread-local access is off by the alignment slack. TLS corruption\nis silent at link time and hard to diagnose at runtime.","fix":"In `set_virtual_addresses_by_order()`, before assigning an address to the first chunk that has `SHF_TLS`, do `addr = align_to(addr, get_tls_segment_alignment(ctx));`, mirroring `set_virtual_addresses_regular()`. Alternatively, factor the TLS alignment (and the tbss-overlap handling) into a helper used by both address assignment functions.","locations":[{"ref":"src/passes.cc:2990-2994","code":" 2990 |     // TLS sections are included only in PT_LOAD but also in PT_TLS.\n 2991 |     // We align the first TLS section so that the PT_TLS segment starts\n 2992 |     // at an address that meets the segment's alignment requirement.\n 2993 |     if (is_tls(chunks[i]) && (i == 0 || !is_tls(chunks[i - 1])))\n 2994 |       addr = align_to(addr, get_tls_segment_alignment(ctx));","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L2990-L2994"},{"ref":"src/passes.cc:3035-3066","code":" 3035 |   for (i64 j = 0; j < ctx.arg.section_order.size(); j++) {\n 3036 |     SectionOrder &ord = ctx.arg.section_order[j];\n 3037 | \n 3038 |     switch (ord.type) {\n 3039 |     case SectionOrder::SECTION:\n 3040 |     case SectionOrder::GROUP:\n 3041 |       for (; i < vec.size() && vec[i]->sect_order == j; i++) {\n 3042 |         // Memory protection works on page size granularity. We need to\n 3043 |         // put sections with different memory attributes into different\n 3044 |         // pages. We do it by inserting a padding.\n 3045 |         if (i != 0) {\n 3046 |           i64 flags1 = to_phdr_flags(ctx, vec[i - 1]);\n 3047 |           i64 flags2 = to_phdr_flags(ctx, vec[i]);\n 3048 |           if (flags1 != flags2) {\n 3049 |             switch (ctx.arg.z_separate_code) {\n 3050 |             case SEPARATE_LOADABLE_SEGMENTS:\n 3051 |               addr = align_to(addr, ctx.page_size);\n 3052 |               break;\n 3053 |             case SEPARATE_CODE:\n 3054 |               if ((flags1 & PF_X) != (flags2 & PF_X))\n 3055 |                 addr = align_to(addr, ctx.page_size);\n 3056 |               break;\n 3057 |             default:\n 3058 |               break;\n 3059 |             }\n 3060 |           }\n 3061 |         }\n 3062 | \n 3063 |         addr = align_to(addr, vec[i]->shdr.sh_addralign);\n 3064 |         vec[i]->shdr.sh_addr = addr;\n 3065 |         addr += vec[i]->shdr.sh_size;\n 3066 |       }","lines":32,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/passes.cc#L3035-L3066"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The bracket-expression parser rejects the POSIX form in which `-` is the last character of the\nclass. For `[a-]` the loop sees `pat == \"a-]\"`, the test `pat.size() >= 3 && pat[1] == '-'`\nmatches, and it consumes `a`, `-`, `]` as the range `a`..`]`. Because `']' (0x5d) < 'a' (0x61)`,\nthe `end < start` test fires and `compile()` returns `{}`, so `Glob::add()` reports the whole\npattern as invalid. Other linkers (and shells) accept `[a-]` as \"`a` or `-`\". The same applies to\n`[!a-]` and to `[abc-]`.\n\n`Glob::add()` returning `false` surfaces to the user as a rejected `--unique` /\n`--undefined-glob` / version-script pattern (`src/cmdline.cc:964`, `src/cmdline.cc:976`).","fix":"Only treat `x-y` as a range when the character after `-` is not the closing bracket:\n\n```cpp\n        if (pat.size() >= 3 && pat[1] == '-' && pat[2] != ']') {\n          ...\n        } else {\n          chars[(u8)pat[0]] = true;\n          pat.remove_prefix(1);\n        }\n```","locations":[{"ref":"lib/glob.cc:42-83","code":"   42 |       while (!pat.empty()) {\n   43 |         if (pat[0] == ']') {\n   44 |           pat.remove_prefix(1);\n   45 |           closed = true;\n   46 |           break;\n   47 |         }\n   48 | \n   49 |         if (pat[0] == '\\\\') {\n   50 |           pat.remove_prefix(1);\n   51 |           if (pat.empty())\n   52 |             return {};\n   53 |         }\n   54 | \n   55 |         if (pat.size() >= 3 && pat[1] == '-') {\n   56 |           u8 start = pat[0];\n   57 |           u8 end = pat[2];\n   58 |           pat.remove_prefix(3);\n   59 | \n   60 |           if (end == '\\\\') {\n   61 |             if (pat.empty())\n   62 |               return {};\n   63 |             end = pat[0];\n   64 |             pat.remove_prefix(1);\n   65 |           }\n   66 | \n   67 |           if (end < start)\n   68 |             return {};\n   69 | \n   70 |           for (i64 i = start; i <= end; i++)\n   71 |             chars[i] = true;\n   72 |         } else {\n   73 |           chars[(u8)pat[0]] = true;\n   74 |           pat.remove_prefix(1);\n   75 |         }\n   76 |       }\n   77 | \n   78 |       if (!closed)\n   79 |         return {};\n   80 | \n   81 |       if (negate)\n   82 |         chars.flip();\n   83 |       break;","lines":42,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/glob.cc#L42-L83"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`update_minimum()` and `update_maximum()` are templated on the atomic's value type `T` but take\nthe new value as a hard-coded `u64 new_val`. Every use with a signed or narrower `T` silently\nconverts through `u64`: a negative `i64` becomes a huge unsigned value at the call site, and a\n`T = u32` atomic gets a truncating conversion inside `compare_exchange_weak`. The comparison\n`cmp(new_val, old_val)` also mixes `u64` and `T`, so `std::less<T>` converts the `u64` back to `T`\n— an implementation-defined round trip for signed `T`.","fix":"Before:\n```cpp\ntemplate <typename T, typename Compare = std::less<T>>\nvoid update_minimum(std::atomic<T> &atomic, u64 new_val, Compare cmp = {}) {\n```\n\nAfter:\n```cpp\ntemplate <typename T, typename Compare = std::less<T>>\nvoid update_minimum(std::atomic<T> &atomic, T new_val, Compare cmp = {}) {\n```\n(and the same for `update_maximum`).","locations":[{"ref":"lib/lib.h:289-303","code":"  289 | template <typename T, typename Compare = std::less<T>>\n  290 | void update_minimum(std::atomic<T> &atomic, u64 new_val, Compare cmp = {}) {\n  291 |   T old_val = atomic.load(std::memory_order_relaxed);\n  292 |   while (cmp(new_val, old_val) &&\n  293 |          !atomic.compare_exchange_weak(old_val, new_val,\n  294 |                                        std::memory_order_relaxed));\n  295 | }\n  296 | \n  297 | template <typename T, typename Compare = std::less<T>>\n  298 | void update_maximum(std::atomic<T> &atomic, u64 new_val, Compare cmp = {}) {\n  299 |   T old_val = atomic.load(std::memory_order_relaxed);\n  300 |   while (cmp(old_val, new_val) &&\n  301 |          !atomic.compare_exchange_weak(old_val, new_val,\n  302 |                                        std::memory_order_relaxed));\n  303 | }","lines":15,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L289-L303"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ConcurrentMap::get_sorted_entries()` first walks backwards from the end of the shard while the\nslot is occupied (`while (begin < end && entries[end - 1].key) vec.push_back(entries + --end);`)\nto handle probe runs that wrap around the shard boundary. If the shard is *completely* full, that\nloop drains it and leaves `begin == end`, so the main `for (i64 i = begin; i < end;)` loop — the\nonly place `std::sort()` is called — never executes. The function then returns the entries in\nreverse bucket order instead of the deterministic `(keylen, memcmp)` order it promises, making the\nlinker output non-reproducible.\n\nA shard is `nbuckets / NUM_SHARDS` slots and probing aborts after `MAX_RETRY == 256` steps, so with\nthe minimum table (`MIN_NBUCKETS == 16384`, i.e. exactly 256 slots per shard) a fully occupied\nshard is reachable without the map declaring itself full.","fix":"Sort the tail unconditionally after the loop, e.g. append a final\n\n```cpp\n    std::sort(vec.begin() + last, vec.end(), [](Entry *a, Entry *b) {\n      if (a->keylen != b->keylen)\n        return a->keylen < b->keylen;\n      return memcmp(a->key, b->key, a->keylen) < 0;\n    });\n```\n\nafter the `for` loop (which is a no-op when the loop already sorted everything), or restructure so\nthat the wrapped entries and the first run are always sorted together in one place.","locations":[{"ref":"lib/lib.h:585-624","code":"  585 |   std::vector<Entry *> get_sorted_entries(i64 shard_idx) {\n  586 |     if (nbuckets == 0)\n  587 |       return {};\n  588 | \n  589 |     i64 shard_size = nbuckets / NUM_SHARDS;\n  590 |     i64 begin = shard_idx * shard_size;\n  591 |     i64 end = begin + shard_size;\n  592 | \n  593 |     i64 sz = 0;\n  594 |     for (i64 i = begin; i < end; i++)\n  595 |       if (entries[i].key)\n  596 |         sz++;\n  597 | \n  598 |     std::vector<Entry *> vec;\n  599 |     vec.reserve(sz);\n  600 | \n  601 |     // Since the shard is circular, we need to handle the last entries\n  602 |     // as if they were next to the first entries.\n  603 |     while (begin < end && entries[end - 1].key)\n  604 |       vec.push_back(entries + --end);\n  605 | \n  606 |     // Find entries contiguous in the buckets and sort them.\n  607 |     i64 last = 0;\n  608 |     for (i64 i = begin; i < end;) {\n  609 |       while (i < end && entries[i].key)\n  610 |         vec.push_back(entries + i++);\n  611 | \n  612 |       std::sort(vec.begin() + last, vec.end(), [](Entry *a, Entry *b) {\n  613 |         if (a->keylen != b->keylen)\n  614 |           return a->keylen < b->keylen;\n  615 |         return memcmp(a->key, b->key, a->keylen) < 0;\n  616 |       });\n  617 | \n  618 |       last = vec.size();\n  619 | \n  620 |       while (i < end && !entries[i].key)\n  621 |         i++;\n  622 |     }\n  623 |     return vec;\n  624 |   }","lines":40,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/lib.h#L585-L624"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Counter::print()` was converted from an explicit descending comparator to\n`ranges::stable_sort(instances, {}, [](Counter *x) { return x->get_value(); })`, which sorts\n**ascending**. The original code was\n`sort(instances, [](Counter *a, Counter *b) { return a->get_value() > b->get_value(); })`.\n`--stats` output now lists the least interesting counters first, reversing a deliberate\npresentation choice.\n\nThe same line is also needlessly expensive: `get_value()` performs a full\n`tbb::enumerable_thread_specific::combine()` and is re-evaluated `O(n log n)` times by the sort\nand twice more per counter in the print loop.","fix":"Before:\n```cpp\n  ranges::stable_sort(instances, {}, [](Counter *x) { return x->get_value(); });\n\n  for (Counter *c : instances)\n    std::cout << std::setw(20) << std::right << c->name\n              << \"=\" << c->get_value() << \"\\n\";\n```\n\nAfter:\n```cpp\n  std::vector<std::pair<Counter *, i64>> vec;\n  for (Counter *c : instances)\n    vec.push_back({c, c->get_value()});\n  ranges::stable_sort(vec, ranges::greater(), &std::pair<Counter *, i64>::second);\n\n  for (auto [c, val] : vec)\n    std::cout << std::setw(20) << std::right << c->name << \"=\" << val << \"\\n\";\n```","locations":[{"ref":"lib/perf.cc:21-27","code":"   21 | void Counter::print() {\n   22 |   ranges::stable_sort(instances, {}, [](Counter *x) { return x->get_value(); });\n   23 | \n   24 |   for (Counter *c : instances)\n   25 |     std::cout << std::setw(20) << std::right << c->name\n   26 |               << \"=\" << c->get_value() << \"\\n\";\n   27 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/lib/perf.cc#L21-L27"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In the `R_AARCH64_TLSDESC_ADD_LO12` local-exec relaxation, the immediate is extracted with\n`bits(S + A - ctx.tp_addr, 32, 16)` — a **17**-bit field — and shifted into a `movz` whose `imm16`\noccupies bits 20:5. The extra bit lands on bit 21, which is the low bit of the `hw` (shift-amount)\nfield. It happens to be harmless today only because the template word `0xd2a0'0000` already has\nbit 21 set, so the `|=` cannot change it. Every other MOVW_G1-style site in the file uses the\ncorrect `bits(x, 31, 16)` (e.g. `R_AARCH64_TLSLE_MOVW_TPREL_G1_NC` on line 377), and this site is\neven rewritten to `R_AARCH64_TLSLE_MOVW_TPREL_G1` for `--emit-relocs`, so the inconsistency is a\nlatent trap for anyone who later changes the template instruction.","fix":"Before:\n```cpp\n        *(ul32 *)loc |= bits(S + A - ctx.tp_addr, 32, 16) << 5;\n```\n\nAfter:\n```cpp\n        *(ul32 *)loc |= bits(S + A - ctx.tp_addr, 31, 16) << 5;\n```","locations":[{"ref":"src/arch-arm64.cc:465-469","code":"  465 |       } else {\n  466 |         *(ul32 *)loc = 0xd2a0'0000; // movz x0, 0, lsl #16\n  467 |         *(ul32 *)loc |= bits(S + A - ctx.tp_addr, 32, 16) << 5;\n  468 |         rewrite(i, R_AARCH64_TLSLE_MOVW_TPREL_G1);\n  469 |       }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm64.cc#L465-L469"},{"ref":"src/arch-arm64.cc:382-384","code":"  382 |     case R_AARCH64_TLSLE_MOVW_TPREL_G1_NC:\n  383 |       *(ul32 *)loc |= bits(S + A - ctx.tp_addr, 31, 16) << 5;\n  384 |       break;","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-arm64.cc#L382-L384"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`case R_LARCH_32:` in `apply_reloc_alloc` starts with `assert(E::is_64)`. On\n`LOONGARCH32`, however, `R_LARCH_32` *is* the word-size absolute relocation\n(`E::R_ABS = R_LARCH_32`, `src/elf.h:2272`), so any `.long foo` in an allocated section\naborts a debug build. In a release build the assert vanishes and the value is written twice -\nonce here and once by the generic `AbsRel` machinery in\n`OutputSection<E>::copy_buf` - which is merely redundant. The RISC-V backend, which has the\nsame 32/64-bit split, handles it properly with `if (E::is_64)` instead of an assertion\n(`src/arch-riscv.cc:318-321`).","fix":"Mirror the RISC-V backend:\n```\n     case R_LARCH_32:\n-      assert(E::is_64);\n-      *(ul32 *)loc = S + A;\n+      if constexpr (E::is_64)\n+        *(ul32 *)loc = S + A;\n       break;\n```","locations":[{"ref":"src/arch-loongarch.cc:350-353","code":"  350 |     case R_LARCH_32:\n  351 |       assert(E::is_64);\n  352 |       *(ul32 *)loc = S + A;\n  353 |       break;","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-loongarch.cc#L350-L353"},{"ref":"src/arch-loongarch.cc:821-824","code":"  821 |     case R_LARCH_32:\n  822 |       if constexpr (E::is_64)\n  823 |         scan_absrel(ctx, sym, rel);\n  824 |       break;","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-loongarch.cc#L821-L824"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`shrink_section` decides whether the TLSDESC `pcalau12i`+`addi.d` pair can be folded into a\nsingle `pcaddi` using `P = isec.get_addr() + r.r_offset` - without subtracting the bytes\nalready removed earlier in the same section - while `apply_reloc_alloc` re-evaluates the very\nsame `is_int(dist, 22)` predicate with the delta-adjusted `P`\n(`u64 P = get_addr() + r_offset;` where `r_offset = rel.r_offset - r_delta`). Since\nrelaxation only shrinks code, the apply-time distance is always >= the shrink-time distance,\nso a distance sitting just below the 2 MiB boundary can flip. When that happens mold has\nalready deleted the `pcalau12i` but takes the `else` branch and writes a `%lo12` immediate into\nan `addi.d` whose high part no longer exists, producing silently wrong code. The\n`R_LARCH_ALIGN` branch a few lines above does subtract `r_delta`.","fix":"Make both sides agree - either compute the shrink-time distance with\n`P = isec.get_addr() + r.r_offset - r_delta`, or (safer) drive the apply-time branch off\n`removed_bytes` of the paired `HI20` relocation instead of recomputing `is_int(dist, 22)`.","locations":[{"ref":"src/arch-loongarch.cc:1037-1046","code":" 1037 |     case R_LARCH_TLS_DESC_PC_HI20:\n 1038 |       if (sym.has_tlsdesc(ctx)) {\n 1039 |         u64 P = isec.get_addr() + r.r_offset;\n 1040 |         i64 dist = sym.get_tlsdesc_addr(ctx) + r.r_addend - P;\n 1041 |         if (is_int(dist, 22))\n 1042 |           remove(4);\n 1043 |       } else {\n 1044 |         remove(4);\n 1045 |       }\n 1046 |       break;","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-loongarch.cc#L1037-L1046"},{"ref":"src/arch-loongarch.cc:624-635","code":"  624 |     case R_LARCH_TLS_DESC_PC_LO12:\n  625 |       if (sym.has_tlsdesc(ctx)) {\n  626 |         if (removed_bytes == 0) {\n  627 |           i64 dist = sym.get_tlsdesc_addr(ctx) + A - P;\n  628 |           if (is_int(dist, 22)) {\n  629 |             *(ul32 *)loc = 0x1800'0000 | get_rd(*(ul32 *)loc); // pcaddi\n  630 |             write_j20(loc, dist >> 2);\n  631 |             rewrite(i, R_LARCH_TLS_DESC_PCREL20_S2);\n  632 |           } else {\n  633 |             write_k12(loc, sym.get_tlsdesc_addr(ctx) + A);\n  634 |           }\n  635 |         }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-loongarch.cc#L624-L635"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`get_rd` reads the instruction with `*(u32 *)loc`, i.e. a host-native, naturally-aligned\nload, while every other instruction access in this file uses the `ul32` wrapper. mold is a\ncross linker that explicitly supports big-endian RISC-V (`MOLD_RV64BE`/`MOLD_RV32BE`) and\ndocuments in `lib/integers.h` that raw integer casts must not be used for file data, both\nbecause of host byte order and because the pointer may be unaligned (`loc` can be 2-byte\naligned in RVC code, and archive members are only 2-byte aligned). On a big-endian host the\nextracted `rd` register number is garbage, which silently corrupts the relaxation decisions.","fix":"```\n static u32 get_rd(u8 *loc) {\n-  return bits(*(u32 *)loc, 11, 7);\n+  return bits(*(ul32 *)loc, 11, 7);\n };\n```\n(RISC-V instructions are always little-endian, even in the big-endian ABI.)","locations":[{"ref":"src/arch-riscv.cc:89-91","code":"   89 | static u32 get_rd(u8 *loc) {\n   90 |   return bits(*(u32 *)loc, 11, 7);\n   91 | };","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L89-L91"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"When a `R_RISCV_GOT_HI20` GOT load is relaxed to a materialized constant, the value written\nis `sym.get_addr(ctx)` with the addend dropped, whereas `shrink_section` decided whether the\nrelaxation is legal using `sym.get_addr(ctx) + r.r_addend` (`src/arch-riscv.cc:967-976`) and\nthe non-relaxed path of the very same `case` uses `G + GOT + A - P`. With a non-zero addend\nthe two disagree: mold may shrink the pair because `val + A` fits in 6/12 bits and then emit\n`c.li`/`addi` holding a value that is off by `A`.","fix":"Include the addend in both materialization branches:\n```\n-        write_citype(loc, sym.get_addr(ctx));\n+        write_citype(loc, S + A);\n...\n-        write_itype(loc, sym.get_addr(ctx));\n+        write_itype(loc, S + A);\n```","locations":[{"ref":"src/arch-riscv.cc:375-390","code":"  375 |       if (removed_bytes == 6) {\n  376 |         // c.li <rd>, val\n  377 |         *(ul16 *)loc = 0b010'0'00000'00000'01 | (rd << 7);\n  378 |         write_citype(loc, sym.get_addr(ctx));\n  379 |         // The value is materialized directly, so neither this nor the paired\n  380 |         // PCREL_LO12 (the load) needs a relocation anymore.\n  381 |         rewrite(i, R_NONE);\n  382 |         rewrite(i + 2, R_NONE);\n  383 |         i += 3;\n  384 |       } else if (removed_bytes == 4) {\n  385 |         // addi <rd>, zero, val\n  386 |         *(ul32 *)loc = 0b0010011 | (rd << 7);\n  387 |         write_itype(loc, sym.get_addr(ctx));\n  388 |         rewrite(i, R_NONE);\n  389 |         rewrite(i + 2, R_NONE);\n  390 |         i += 3;","lines":16,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L375-L390"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Both relaxation backends rewrite a GOT load into direct PC-relative address materialization\nwithout updating the relocation types for `--emit-relocs`. On RISC-V the `auipc` + `ld`\npair becomes `auipc` + `addi`, but the relocations stay `R_RISCV_GOT_HI20` /\n`R_RISCV_PCREL_LO12_I`; on LoongArch `pcalau12i` + `ld.d` becomes `pcalau12i` + `addi.d`\nwhile the relocations stay `R_LARCH_GOT_PC_HI20` / `R_LARCH_GOT_PC_LO12`. Every other\nrewriting branch in the same switch statements carefully calls the `rewrite()` helper\n(e.g. `src/arch-loongarch.cc:436-437`, `src/arch-riscv.cc:341`), so consumers of\n`--emit-relocs` output (e.g. a relinking tool) get relocations that contradict the emitted\ninstructions.","fix":"Call `rewrite(i, R_RISCV_PCREL_HI20)` (respectively\n`rewrite(i, R_LARCH_PCALA_HI20)` and `rewrite(i + 2, R_LARCH_PCALA_LO12)`) in these\nbranches, so the emitted relocations describe the instructions that were actually written.","locations":[{"ref":"src/arch-riscv.cc:394-403","code":"  394 |         i64 val = S + A - P;\n  395 |         if (ctx.arg.relax && sym.is_pcrel_linktime_const(ctx) &&\n  396 |             is_got_load_pair(ctx, *this, rels, i) && is_int(val, 32)) {\n  397 |           // auipc <rd>, %hi20(val)\n  398 |           utype(val);\n  399 | \n  400 |           // addi <rd>, <rd>, %lo12(val)\n  401 |           *(ul32 *)(loc + 4) = 0b0010011 | (rd << 15) | (rd << 7);\n  402 |           write_itype(loc + 4, val);\n  403 |           i += 3;","lines":10,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-riscv.cc#L394-L403"},{"ref":"src/arch-loongarch.cc:424-435","code":"  424 |         if (is_relaxable_got_load(ctx, *this, i)) {\n  425 |           i64 dist = compute_distance(ctx, sym, *this, rel);\n  426 |           if (is_int(dist, 32)) {\n  427 |             u32 rd = get_rd(*(ul32 *)loc);\n  428 |             *(ul32 *)(loc + 4) = 0x02c0'0000 | (rd << 5) | rd; // addi.d\n  429 | \n  430 |             write_j20(loc, hi20(S + A, P));\n  431 |             write_k12(loc + 4, S + A);\n  432 |             i += 3;\n  433 |             break;\n  434 |           }\n  435 |         }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-loongarch.cc#L424-L435"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `R_390_GOTENT` relaxation inspects and rewrites the two bytes *preceding* the relocated\nplace (`*(ub16 *)(loc - 2)`, the `LGRL` opcode) without checking that `rel.r_offset >= 2`.\nFor a crafted or unusual object file whose `R_390_GOTENT` sits at offset 0 or 1 of a section\nthis reads - and, if the preceding bytes happen to match the `0xc4?8` pattern, writes -\noutside the section's slice of the output buffer.","fix":"Add `rel.r_offset >= 2 &&` to the relaxation condition before dereferencing `loc - 2`.","locations":[{"ref":"src/arch-s390x.cc:267-285","code":"  267 |     case R_390_GOTENT:\n  268 |       // If we can relax a GOT-loading LGRL to an address-materializing\n  269 |       // LARL, do that. The format of LGRL is 0xc 0x4 <reg> 0x8 followed\n  270 |       // by a 32-bit offset. LARL is 0xc 0x0 <reg> 0x0.\n  271 |       if (ctx.arg.relax && sym.is_pcrel_linktime_const(ctx)) {\n  272 |         u64 op = *(ub16 *)(loc - 2);\n  273 |         u64 val = S + A - P;\n  274 |         if ((op & 0xff0f) == 0xc408 && A == 2 && (val & 1) == 0 &&\n  275 |             is_int(val, 33)) {\n  276 |           *(ub16 *)(loc - 2) = 0xc000 | (op & 0x00f0);\n  277 |           *(ub32 *)loc = val >> 1;\n  278 |           if (ctx.arg.emit_relocs)\n  279 |             rel.r_type = R_390_PC32DBL;\n  280 |           break;\n  281 |         }\n  282 |       }\n  283 |       check_dbl(GOT + G + A - P, -(1LL << 32), 1LL << 32);\n  284 |       *(ub32 *)loc = (GOT + G + A - P) >> 1;\n  285 |       break;","lines":19,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-s390x.cc#L267-L285"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The large-PLT `ldx [ %o7 + .ptr ], %g1` displacement is written with\n`bits(plt + ptroff - call, 12, 0)`, silently truncating to the signed 13-bit immediate field\nwithout a range check and without asserting the value is non-negative. The current layout\nhappens to keep the displacement in `[1292, 3836]`, but nothing in the code enforces the\nblock size of 160 or the 24-byte stride that this depends on; a future change to those\nconstants would produce silently mis-encoded PLT entries rather than an error.","fix":"Add `assert(0 <= disp && disp < 4096);` (or a `Fatal`) around the computed displacement, and\nderive the block size 160 / stride 24 / 5120 constants from named constants shared with\n`to_plt_offset` instead of repeating the magic numbers in three places.","locations":[{"ref":"src/arch-sparc64.cc:140-151","code":"  140 |     u64 plt = ctx.plt->shdr.sh_addr;\n  141 |     u64 call = sym.get_plt_addr(ctx) + 4;\n  142 |     i64 ptroff = sparc_plt_ptr_offset(ctx, idx);\n  143 | \n  144 |     memcpy(buf, insn, sizeof(insn));\n  145 |     *(ub32 *)(buf + 12) |= bits(plt + ptroff - call, 12, 0);\n  146 | \n  147 |     // The data pointer initially holds (.PLT0 - call) so that the first call\n  148 |     // jumps to .PLT0, where the loader's lazy resolver lives. The resolver\n  149 |     // later overwrites it with (target - call).\n  150 |     *(ub64 *)(ctx.buf + ctx.plt->shdr.sh_offset + ptroff) = plt - call;\n  151 |   }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-sparc64.cc#L140-L151"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The SPARC backend assumes relocation pairs without validating them. `R_SPARC_TLS_IE_LO10`\nunconditionally uses `sym.get_gottp_addr(ctx)`, but `scan_relocations` only sets\n`NEEDS_GOTTP` for `R_SPARC_TLS_IE_HI22` (the `..._LO10` type is in the \"do nothing\" list);\nthe same holds for `R_SPARC_TLS_GD_LO10`/`_ADD`/`_CALL` relative to `R_SPARC_TLS_GD_HI22`. An\nobject file that contains the `LO10` relocation without its `HI22` partner makes\n`get_gottp_addr` use a `-1` GOT index (the `assert` is compiled out in release builds), which\nsilently writes a garbage address. The x86-64 backend explicitly validates its relocation\npairs and calls `Fatal` when the expected partner is missing (`src/arch-x86-64.cc:771-782`).","fix":"Either set the corresponding `NEEDS_*` flag from the `LO10`/`ADD`/`CALL` relocations as well,\nor verify in `scan_relocations` that each `..._LO10`/`..._ADD`/`..._CALL` is preceded by its\n`..._HI22` partner and `Error(ctx)` otherwise.","locations":[{"ref":"src/arch-sparc64.cc:495-500","code":"  495 |     case R_SPARC_TLS_IE_HI22:\n  496 |       *(ub32 *)loc |= bits(sym.get_gottp_addr(ctx) + A - GOT, 31, 10);\n  497 |       break;\n  498 |     case R_SPARC_TLS_IE_LO10:\n  499 |       *(ub32 *)loc |= bits(sym.get_gottp_addr(ctx) + A - GOT, 9, 0);\n  500 |       break;","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-sparc64.cc#L495-L500"},{"ref":"src/arch-sparc64.cc:667-693","code":"  667 |     case R_SPARC_TLS_IE_HI22:\n  668 |       sym.flags |= NEEDS_GOTTP;\n  669 |       break;\n  670 |     case R_SPARC_TLS_LE_HIX22:\n  671 |     case R_SPARC_TLS_LE_LOX10:\n  672 |       check_tlsle(ctx, sym, rel);\n  673 |       break;\n  674 |     case R_SPARC_64:\n  675 |     case R_SPARC_UA64:\n  676 |     case R_SPARC_GOTDATA_OP_LOX10:\n  677 |     case R_SPARC_GOTDATA_OP:\n  678 |     case R_SPARC_GOTDATA_LOX10:\n  679 |     case R_SPARC_TLS_GD_LO10:\n  680 |     case R_SPARC_TLS_GD_ADD:\n  681 |     case R_SPARC_TLS_GD_CALL:\n  682 |     case R_SPARC_TLS_LDM_LO10:\n  683 |     case R_SPARC_TLS_LDM_ADD:\n  684 |     case R_SPARC_TLS_LDM_CALL:\n  685 |     case R_SPARC_TLS_LDO_HIX22:\n  686 |     case R_SPARC_TLS_LDO_LOX10:\n  687 |     case R_SPARC_TLS_LDO_ADD:\n  688 |     case R_SPARC_TLS_IE_ADD:\n  689 |     case R_SPARC_TLS_IE_LD:\n  690 |     case R_SPARC_TLS_IE_LDX:\n  691 |     case R_SPARC_TLS_IE_LO10:\n  692 |     case R_SPARC_SIZE32:\n  693 |       break;","lines":27,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-sparc64.cc#L667-L693"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`R_SPARC_SIZE32` writes a 32-bit value without any overflow check, while every other 32-bit\nabsolute SPARC relocation in the same switch (`R_SPARC_32`, `R_SPARC_UA32`, `R_SPARC_PLT32`)\nis checked with `check(S + A, 0, 1LL << 32)`. The x86-64 backend does check the analogous\n`R_X86_64_SIZE32` (`write32(sym.esym().st_size + A)`). A symbol larger than 4 GiB (or a large\naddend) is therefore silently truncated on SPARC.","fix":"```\n     case R_SPARC_SIZE32:\n+      check(sym.esym().st_size + A, 0, 1LL << 32);\n       *(ub32 *)loc = sym.esym().st_size + A;\n```","locations":[{"ref":"src/arch-sparc64.cc:507-509","code":"  507 |     case R_SPARC_SIZE32:\n  508 |       *(ub32 *)loc = sym.esym().st_size + A;\n  509 |       break;","lines":3,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/arch-sparc64.cc#L507-L509"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`if (size_t pos = name.find('\\0'))` uses the *position* as a truth value: the intent is\n\"if a NUL was found\", but the condition is false when the NUL is at index 0 and true when\n`find` returns `npos` (in which case `substr(0, npos)` happens to be a no-op). It works by\naccident today, which makes it a trap for the next reader.","fix":"```\n-      if (size_t pos = name.find('\\0'))\n+      if (size_t pos = name.find('\\0'); pos != name.npos)\n         name = name.substr(0, pos);\n```","locations":[{"ref":"src/archive-file.cc:56-61","code":"   56 |       std::string name{(char *)ptr, (size_t)namelen};\n   57 |       ptr += namelen;\n   58 | \n   59 |       if (size_t pos = name.find('\\0'))\n   60 |         name = name.substr(0, pos);\n   61 |       return name;","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/archive-file.cc#L56-L61"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`--Ttext`, `--Tdata` and `--Tbss` parse their argument with `parse_hex` (which treats a bare\nnumber as hexadecimal), while the closely related `--Ttext-segment` uses `parse_number`\n(which treats a bare number as decimal and only switches to hex on a `0x` prefix). So\n`--Ttext=100` sets the address to `0x100` but `--Ttext-segment=100` sets it to `100`. GNU ld\ntreats all four consistently; the silent difference produces wrong load addresses.","fix":"Use the same parser for all four options - either `parse_hex(ctx, \"Ttext-segment\", arg)` for\n`--Ttext-segment`, or switch the `--T*` options to `parse_number` (whose base-0 handling\naccepts `0x...`) and document the change.","locations":[{"ref":"src/cmdline.cc:1143-1150","code":" 1143 |     } else if (read_arg(\"Tbss\")) {\n 1144 |       ctx.arg.section_start[\".bss\"] = parse_hex(ctx, \"Tbss\", arg);\n 1145 |     } else if (read_arg(\"Tdata\")) {\n 1146 |       ctx.arg.section_start[\".data\"] = parse_hex(ctx, \"Tdata\", arg);\n 1147 |     } else if (read_arg(\"Ttext\")) {\n 1148 |       ctx.arg.section_start[\".text\"] = parse_hex(ctx, \"Ttext\", arg);\n 1149 |     } else if (read_arg(\"Ttext-segment\")) {\n 1150 |       ctx.arg.ttext_segment = parse_number(ctx, \"Ttext-segment\", arg);","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/cmdline.cc#L1143-L1150"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`get_elf_type` derives `is_64` from `EI_CLASS` but ignores it for `EM_386` and\n`EM_X86_64`, unconditionally returning `I386::name` / `X86_64::name`. An\n`ELFCLASS64` object with `e_machine == EM_386` (or an `ELFCLASS32` object with\n`EM_X86_64`) is therefore reported as a 32-bit i386 / 64-bit x86-64 target, and\nthe rest of the linker then parses the file with the wrong `ElfEhdr`/`ElfShdr`/\n`ElfSym` layout. The same applies to `EM_ARM`, `EM_AARCH64`, `EM_PPC`,\n`EM_S390X`, `EM_SPARC64`, `EM_68K` and `EM_SH`, all of which ignore `is_64`.","fix":"Validate the class against the machine before returning a target name, e.g.\n```cpp\ncase EM_X86_64:\n  return is_64 ? X86_64::name : \"\";\ncase EM_386:\n  return is_64 ? \"\" : I386::name;\n```\nso that a mismatched header is reported as an unrecognized file rather than\nsilently mis-parsed.","locations":[{"ref":"src/filetype.cc:137-184","code":"  137 | static std::string_view get_elf_type(u8 *buf) {\n  138 |   bool is_le = (buf[EI_DATA] == ELFDATA2LSB);\n  139 |   bool is_64 = (buf[EI_CLASS] == ELFCLASS64);\n  140 | \n  141 |   auto *ehdr64_le = (ElfEhdr<ARM64LE> *)buf;\n  142 |   auto *ehdr64_be = (ElfEhdr<ARM64BE> *)buf;\n  143 | \n  144 |   switch (is_le ? ehdr64_le->e_machine : ehdr64_be->e_machine) {\n  145 |   case EM_386:\n  146 |     return I386::name;\n  147 |   case EM_X86_64:\n  148 |     return X86_64::name;\n  149 |   case EM_ARM:\n  150 |     return is_le ? ARM32LE::name : ARM32BE::name;\n  151 |   case EM_AARCH64:\n  152 |     return is_le ? ARM64LE::name : ARM64BE::name;\n  153 |   case EM_RISCV:\n  154 |     if (is_le)\n  155 |       return is_64 ? RV64LE::name : RV32LE::name;\n  156 |     return is_64 ? RV64BE::name : RV32BE::name;\n  157 |   case EM_PPC:\n  158 |     return PPC32::name;\n  159 |   case EM_PPC64:\n  160 |     // ELFv1 is big-endian and ELFv2 is little-endian by convention, but\n  161 |     // the correspondence is not a rule; musl for example uses ELFv2 on\n  162 |     // big-endian too. We support only the usual combinations, so treat\n  163 |     // the others as unrecognizable rather than silently linking them\n  164 |     // against the wrong ABI.\n  165 |     if (!is_le)\n  166 |       if (u32 abi = (ehdr64_be->e_flags & EF_PPC64_ABI); abi == 0 || abi == 1)\n  167 |         return PPC64V1::name;\n  168 |     if (is_le)\n  169 |       if (u32 abi = (ehdr64_le->e_flags & EF_PPC64_ABI); abi == 0 || abi == 2)\n  170 |         return PPC64V2::name;\n  171 |     return \"\";\n  172 |   case EM_S390X:\n  173 |     return S390X::name;\n  174 |   case EM_SPARC64:\n  175 |     return SPARC64::name;\n  176 |   case EM_68K:\n  177 |     return M68K::name;\n  178 |   case EM_SH:\n  179 |     return is_le ? SH4LE::name : SH4BE::name;\n  180 |   case EM_LOONGARCH:\n  181 |     return is_64 ? LOONGARCH64::name : LOONGARCH32::name;\n  182 |   default:\n  183 |     return \"\";\n  184 |   }","lines":48,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/filetype.cc#L137-L184"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SharedFile<E>::get_symbols_at()` does\n`auto [begin, end] = ranges::equal_range(...); return {&*begin, ...};`. If the\nrange is empty (`begin == end == sorted_syms.end()`), `*begin` dereferences an\nend iterator, which is undefined behaviour. Today this cannot happen only\nbecause `sorted_syms` is built inside a `std::call_once` from the same\n`symbols` list that `sym` came from - but `sorted_syms` is memoized on the\n*first* call, while `Symbol::file` can still be reassigned by later passes, so\nthe invariant is not enforced by the code.","fix":"```c++\n-  return {&*begin, (size_t)(end - begin)};\n+  if (begin == end)\n+    return {};\n+  return {&*begin, (size_t)(end - begin)};\n```\nand, ideally, assert that the memoized `sorted_syms` still contains `sym`.","locations":[{"ref":"src/input-files.cc:1819-1841","code":" 1819 | template <typename E>\n 1820 | std::span<Symbol<E> *> SharedFile<E>::get_symbols_at(Symbol<E> *sym) {\n 1821 |   assert(sym->file == this);\n 1822 | \n 1823 |   std::call_once(init_sorted_syms, [&] {\n 1824 |     for (Symbol<E> *sym : this->symbols)\n 1825 |       if (sym->file == this)\n 1826 |         sorted_syms.push_back(sym);\n 1827 | \n 1828 |     tbb::parallel_sort(sorted_syms.begin(), sorted_syms.end(),\n 1829 |                        [](Symbol<E> *a, Symbol<E> *b) {\n 1830 |       const ElfSym<E> &x = a->esym();\n 1831 |       const ElfSym<E> &y = b->esym();\n 1832 |       return std::tuple{x.st_value, &x} < std::tuple{y.st_value, &y};\n 1833 |     });\n 1834 |   });\n 1835 | \n 1836 |   auto [begin, end] = ranges::equal_range(sorted_syms, sym->esym().st_value, {},\n 1837 |                                           [](Symbol<E> *x) {\n 1838 |     return x->esym().st_value;\n 1839 |   });\n 1840 |   return {&*begin, (size_t)(end - begin)};\n 1841 | }","lines":23,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-files.cc#L1819-L1841"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`to_p2align()` silently accepts a non-power-of-two `sh_addralign`:\n`std::countr_zero(3)` is `0`, so an alignment of 3 is turned into 1, and\n`std::countr_zero(6)` is `1`, turning 6 into 2. The ELF spec requires\n`sh_addralign` to be 0 or a power of two; accepting garbage here means the\nlinker under-aligns the section without any diagnostic.","fix":"```c++\nstatic i64 to_p2align(u64 alignment) {\n  if (alignment == 0)\n    return 0;\n  if (!std::has_single_bit(alignment))\n    // report an error, or round up: alignment = std::bit_ceil(alignment);\n  return std::countr_zero(alignment);\n}\n```","locations":[{"ref":"src/input-sections.cc:8-12","code":"    8 | static i64 to_p2align(u64 alignment) {\n    9 |   if (alignment == 0)\n   10 |     return 0;\n   11 |   return std::countr_zero(alignment);\n   12 | }","lines":5,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/input-sections.cc#L8-L12"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`unquote()` asserts that a token starting with `\"` also ends with `\"`. That\ninvariant is produced by `tokenize()`, but it is expressed as `assert`, which\ncompiles away in release builds. In a release build, a token such as a lone `\"`\nat the very end of a truncated script would make `s.substr(1, s.size() - 2)`\ncompute `substr(1, (size_t)-1)` - benign only by accident. More importantly, the\n`tokenize()` string-literal branch itself accepts an *unterminated* literal\nwithout diagnosing it whenever the closing quote happens to be the last byte of\nthe file.","fix":"Replace the `assert` with a real check (`if (s.size() < 2 || s.back() != '\"')\nreturn s;`) and keep the tokenizer's `unclosed string literal` diagnostic as the\nsingle source of truth.","locations":[{"ref":"src/linker-script.cc:106-112","code":"  106 | static std::string_view unquote(std::string_view s) {\n  107 |   if (s.size() > 0 && s[0] == '\"') {\n  108 |     assert(s[s.size() - 1] == '\"');\n  109 |     return s.substr(1, s.size() - 2);\n  110 |   }\n  111 |   return s;\n  112 | }","lines":7,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/linker-script.cc#L106-L112"},{"ref":"src/linker-script.cc:73-80","code":"   73 |     if (input[0] == '\"') {\n   74 |       i64 pos = input.find('\"', 1);\n   75 |       if (pos == std::string_view::npos)\n   76 |         error(input, \"unclosed string literal\");\n   77 |       tokens.push_back(input.substr(0, pos + 1));\n   78 |       input = input.substr(pos + 1);\n   79 |       continue;\n   80 |     }","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/linker-script.cc#L73-L80"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_in_sysroot()` returns `true` for *every* absolute path when `--sysroot` is\nnot given: `std::filesystem::relative(path, \"\")` yields an empty path, which is\nneither `\".\"` nor prefixed with `\"../\"`. As a result `resolve_path()` takes the\n\"prepend the sysroot\" branch for any script whose entry starts with `/`, calling\n`must_open_file(ctx, \"\" + str)` and thereby bypassing the `check_target`\ncompatibility check (`get_machine_type`) that the normal `open()` path applies.\nAn incompatible absolute path named in a `GROUP(...)` is silently accepted\ninstead of being skipped with a warning.\n\n`std::filesystem::relative()` is also the throwing overload; a path that the\nimplementation cannot canonicalize raises `std::filesystem_error`, which mold\ndoes not catch.","fix":"Return `false` immediately when `ctx.arg.sysroot.empty()`, and use the\n`std::error_code` overload of `std::filesystem::relative()` so a failure\ndegrades to `false` instead of terminating.","locations":[{"ref":"src/linker-script.cc:146-154","code":"  146 | template <typename E>\n  147 | static bool is_in_sysroot(Context<E> &ctx, std::string path) {\n  148 |   std::string sysroot = ctx.arg.sysroot;\n  149 |   if (sysroot.starts_with('/') && !ctx.arg.chroot.empty())\n  150 |     sysroot = ctx.arg.chroot + \"/\" + path_clean(sysroot);\n  151 | \n  152 |   std::string rel = std::filesystem::relative(path, sysroot).string();\n  153 |   return rel != \".\" && !rel.starts_with(\"../\");\n  154 | }","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/linker-script.cc#L146-L154"},{"ref":"src/linker-script.cc:176-179","code":"  176 |   // GNU ld prepends the sysroot if a pathname starts with '/' and the\n  177 |   // script being processed is in the sysroot. We do the same.\n  178 |   if (str.starts_with('/') && is_in_sysroot(ctx, mf->name))\n  179 |     return must_open_file(ctx, ctx.arg.sysroot + str);","lines":4,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/linker-script.cc#L176-L179"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`get_script_output_type()` indexes `tok[2]` after the `AS_NEEDED` handling\nwithout re-checking the span length, and without checking that the token is not\nthe closing parenthesis. For an empty `GROUP( )` the code calls\n`resolve_path(\")\")`, which tries to open a file literally named `)` in every\nlibrary search directory and finally calls `error()` -> `Fatal` with\n\"library not found: )\" - a confusing diagnostic for a script that is merely\nempty.\n\nAdditionally, this early `resolve_path()` is invoked with `check_target = false`\nduring machine-type detection, so an unreadable path aborts the link before the\n`-m` deduction has a chance to fall through to the next candidate file.","fix":"Guard the access:\n```c++\nif (tok.size() >= 3 && tok[2] != \")\")\n  if (MappedFile *mf = resolve_path(tok[2], false))\n    return get_machine_type(ctx, rctx, mf);\nreturn \"\";\n```\nand consider a non-fatal `resolve_path` variant for the detection path.","locations":[{"ref":"src/linker-script.cc:261-281","code":"  261 | template <typename E>\n  262 | std::string_view Script<E>::get_script_output_type() {\n  263 |   std::call_once(once, [&] { tokenize(); });\n  264 |   std::span<std::string_view> tok = tokens;\n  265 | \n  266 |   if (tok.size() >= 3 && tok[0] == \"OUTPUT_FORMAT\" && tok[1] == \"(\") {\n  267 |     if (tok[2] == \"elf64-x86-64\")\n  268 |       return X86_64::name;\n  269 |     if (tok[2] == \"elf32-i386\")\n  270 |       return I386::name;\n  271 |   }\n  272 | \n  273 |   if (tok.size() >= 3 && (tok[0] == \"INPUT\" || tok[0] == \"GROUP\") &&\n  274 |       tok[1] == \"(\") {\n  275 |     if (tok.size() >= 5 && tok[2] == \"AS_NEEDED\" && tok[3] == \"(\")\n  276 |       tok = tok.subspan(2);\n  277 |     if (MappedFile *mf = resolve_path(tok[2], false))\n  278 |       return get_machine_type(ctx, rctx, mf);\n  279 |   }\n  280 |   return \"\";\n  281 | }","lines":21,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/linker-script.cc#L261-L281"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`get_map()` skips the sorting pass when `map.size() <= 1`. With exactly one\nentry the map *does* need sorting - that single input section can own thousands\nof symbols, and they will be emitted to the map file in hash-table/parallel\ninsertion order instead of by address. The guard was presumably meant to avoid\nrunning `tbb::parallel_for` over an empty range.","fix":"```c++\n-  if (map.size() <= 1)\n+  if (map.empty())\n     return map;\n```","locations":[{"ref":"src/mapfile.cc:32-39","code":"   32 |   if (map.size() <= 1)\n   33 |     return map;\n   34 | \n   35 |   tbb::parallel_for(map.range(), [](const typename Map<E>::range_type &range) {\n   36 |     for (auto &[k, v] : range)\n   37 |       ranges::stable_sort(v, {}, &Symbol<E>::value);\n   38 |   });\n   39 |   return map;","lines":8,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mapfile.cc#L32-L39"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`is_ld()` matches the basename against `ld`, `ld.lld`, `ld.gold`, `ld.bfd` and\n`ld.mold`, but not `ld.mold`'s common siblings `mold`, `ld64.mold` or\ntarget-prefixed names such as `x86_64-linux-gnu-ld`. GCC/Clang invoke the\ncross-prefixed `ld` name in cross-compilation setups, so `mold -run` silently\nfails to interpose there and the build links with the system linker without any\nwarning.","fix":"Also accept a basename that ends with `-ld` (i.e. a target-triple prefix):\n```c\nsize_t n = strlen(ptr);\nif (n > 3 && !strcmp(ptr + n - 3, \"-ld\"))\n  return true;\n```","locations":[{"ref":"src/mold-wrapper.c:59-67","code":"   59 | static bool is_ld(const char *path) {\n   60 |   const char *ptr = path + strlen(path);\n   61 |   while (path < ptr && ptr[-1] != '/')\n   62 |     ptr--;\n   63 | \n   64 |   return !strcmp(ptr, \"ld\") || !strcmp(ptr, \"ld.lld\") ||\n   65 |          !strcmp(ptr, \"ld.gold\") || !strcmp(ptr, \"ld.bfd\") ||\n   66 |          !strcmp(ptr, \"ld.mold\");\n   67 | }","lines":9,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold-wrapper.c#L59-L67"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`execvpe()` in the `LD_PRELOAD` wrapper violates the API contract in two ways:\n\n1. It applies the caller's `envp` to the *wrapper's own* process by calling\n   `putenv(envp[i])` in a loop, then invokes the real `execvp()` with the global\n   `environ`. Real `execvpe()` must not modify the calling process's\n   environment, and entries that were in `environ` but not in `envp` are not\n   removed, so the child ends up with a merged environment rather than exactly\n   `envp`.\n2. `putenv()` (as opposed to `setenv()`) stores the caller's pointer directly.\n   `envp` is `char *const *` - the strings may be string literals or stack\n   buffers - so the process environment can end up pointing at read-only or\n   dead memory.\n\n`execvpe()` also unconditionally rewrites the file when `!strcmp(file, \"ld\")`,\nwhich is already covered by `is_ld(file)` - a redundant leftover condition.","fix":"Look up the real `execvpe` (glibc exports it) and forward `envp` unchanged:\n```c\ntypeof(execvpe) *real = dlsym(RTLD_NEXT, \"execvpe\");\nreturn real(file, argv, envp);\n```\nfalling back to `setenv()`-based emulation with `strdup`ed strings only if\n`dlsym` returns `NULL`. Also drop the redundant `!strcmp(file, \"ld\") ||`.","locations":[{"ref":"src/mold-wrapper.c:69-80","code":"   69 | int execvpe(const char *file, char *const *argv, char *const *envp) {\n   70 |   debug_print(\"execvpe %s\\n\", file);\n   71 | \n   72 |   if (!strcmp(file, \"ld\") || is_ld(file))\n   73 |     file = get_mold_path();\n   74 | \n   75 |   for (int i = 0; envp[i]; i++)\n   76 |     putenv(envp[i]);\n   77 | \n   78 |   typeof(execvpe) *real = dlsym(RTLD_NEXT, \"execvp\");\n   79 |   return real(file, argv, environ);\n   80 | }","lines":12,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold-wrapper.c#L69-L80"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SFrameRelocSection<E>` hardcodes `.rela.sframe` / `SHT_RELA` while every other\nrelocation chunk in the file (`RelPltSection`, `RelDynSection`,\n`EhFrameRelocSection`) selects the name and type from `E::is_rela`. The class\nitself is not constrained by `supports_sframe<E>`, only its sibling\n`SFrameSection<E>::construct()` is, so it is instantiated for REL targets too\nand would emit a `SHT_RELA` section with `sizeof(ElfRel<E>)` REL-sized entries\nif `.sframe` support is ever extended.","fix":"Mirror `EhFrameRelocSection`:\n\n```cpp\n-    this->name = \".rela.sframe\";\n-    this->shdr.sh_type = SHT_RELA;\n+    this->name = E::is_rela ? \".rela.sframe\" : \".rel.sframe\";\n+    this->shdr.sh_type = E::is_rela ? SHT_RELA : SHT_REL;\n```\n\nor constrain the class with `template <supports_sframe E>` so that the RELA\nassumption is enforced by the type system.","locations":[{"ref":"src/mold.h:1438-1451","code":" 1438 | template <typename E>\n 1439 | class SFrameRelocSection : public Chunk<E> {\n 1440 | public:\n 1441 |   SFrameRelocSection() {\n 1442 |     this->name = \".rela.sframe\";\n 1443 |     this->shdr.sh_type = SHT_RELA;\n 1444 |     this->shdr.sh_flags = SHF_INFO_LINK;\n 1445 |     this->shdr.sh_addralign = sizeof(Word<E>);\n 1446 |     this->shdr.sh_entsize = sizeof(ElfRel<E>);\n 1447 |   }\n 1448 | \n 1449 |   void update_shdr(Context<E> &ctx) override;\n 1450 |   void copy_buf(Context<E> &ctx) override;\n 1451 | };","lines":14,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L1438-L1451"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Script<E>::mf` has a self-referential default member initializer:\n\n```cpp\nMappedFile *mf = mf;\n```\n\nThis reads the uninitialized member to initialize itself, which is undefined\nbehaviour. It is harmless today only because the sole constructor\n(`src/mold.h:2165-2166`) initializes `mf(mf)` from its parameter and therefore\nnever uses the NSDMI - but any future constructor that omits `mf` from its\nmember-init list silently gets an indeterminate pointer, and the line reads like\nan intentional initialization.","fix":"```cpp\n-  MappedFile *mf = mf;\n+  MappedFile *mf = nullptr;\n```","locations":[{"ref":"src/mold.h:2279-2284","code":" 2279 |   Context<E> &ctx;\n 2280 |   ReaderContext &rctx;\n 2281 |   MappedFile *mf = mf;\n 2282 |   std::once_flag once;\n 2283 |   std::vector<std::string_view> tokens;\n 2284 | };","lines":6,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/mold.h#L2279-L2284"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`OutputSection<E>::write_to` fills inter-section padding with a repeating trap\npattern but stops at the last whole multiple of the pattern length:\n\n```\nauto fill = [&]<size_t N>(const u8 (&filler)[N]) {\n  for (i64 i = 0; i + N <= size; i += N)\n    memcpy(loc + i, filler, N);\n};\n```\n\nUp to `N - 1` bytes at the end of the gap are left untouched. That is not benign,\nbecause `open_or_create_file` deliberately *reuses* an existing output file (it\nrenames the old output and writes into it), so those bytes retain data from the\nprevious link instead of being zero. The result is non-reproducible output and a\nsmall information leak from the previously linked binary. The `else` branch\n(`memset(loc, 0, size)`) has no such hole.","fix":"Zero (or trap-fill byte-wise) the remainder after the loop, e.g. `memset(loc + (size / N) * N, 0, size % N);` inside `fill`.","locations":[{"ref":"src/output-chunks.cc:1167-1184","code":" 1167 |     u8 *loc = buf + this_end;\n 1168 |     i64 size = next_start - this_end;\n 1169 | \n 1170 |     auto fill = [&]<size_t N>(const u8 (&filler)[N]) {\n 1171 |       for (i64 i = 0; i + N <= size; i += N)\n 1172 |         memcpy(loc + i, filler, N);\n 1173 |     };\n 1174 | \n 1175 |     if (this->shdr.sh_flags & SHF_EXECINSTR) {\n 1176 |       // s390x's old CRT files use NOP slides in .init and .fini.\n 1177 |       // https://sourceware.org/bugzilla/show_bug.cgi?id=31042\n 1178 |       if (is_s390x<E> && (this->name == \".init\" || this->name == \".fini\"))\n 1179 |         fill({ 0x07, 0x00 }); // nopr\n 1180 |       else\n 1181 |         fill(E::trap);\n 1182 |     } else {\n 1183 |       memset(loc, 0, size);\n 1184 |     }","lines":18,"link":"https://github.com/rui314/mold/blob/301382e5a25afcc145deff5ea9bc9eb967ed24af/src/output-chunks.cc#L1167-L1184"}]},
