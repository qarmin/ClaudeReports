<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In the X11 `XdndLeave` handler the `dnd` `RefCell` is borrowed with `self.target.dnd.borrow()` and that `Ref` guard is held alive across the `app.window_event(..., WindowEvent::DragLeft { .. })` call. Every other DnD arm in `client_message` (`XdndEnter`, `XdndPosition`, `XdndDrop`) carefully scopes the borrow into a `{ .. }` block *before* dispatching to the app precisely to avoid this. If the application, while handling `DragLeft`, calls any event-loop method that borrows the same cell mutably (`fetch_data_transfer` and `set_valid_dnd_actions` both call `self.dnd.borrow_mut()`), the program panics with `already borrowed`.","fix":"Copy the value out and drop the borrow before dispatching, e.g.:\n```\nlet transfer_id = {\n    let dnd = self.target.dnd.borrow();\n    let Some(state) = dnd.state() else { return; };\n    state.transfer_id\n};\napp.window_event(&self.target, window_id, WindowEvent::DragLeft { id: transfer_id });\n```","locations":[{"ref":"winit-x11/src/event_processor.rs:584-592","code":"  584 |         if xev.message_type == atoms[XdndLeave] as c_ulong {\n  585 |             let dnd = self.target.dnd.borrow();\n  586 |             let Some(state) = dnd.state() else {\n  587 |                 return;\n  588 |             };\n  589 |             app.window_event(&self.target, window_id, WindowEvent::DragLeft {\n  590 |                 id: state.transfer_id,\n  591 |             });\n  592 |         }","lines":9,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L584-L592"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Size::clamp` calls `input.width.clamp(min.width, max.width)` (and same for height) on `f64` values derived from the caller-supplied `min`/`max` sizes. `f64::clamp` panics if `min > max` (or if either is `NaN`). Since `Size::clamp` is public and takes arbitrary `min`/`max`, passing `min > max` reachably panics inside the library.","fix":"Validate or normalize the bounds before clamping (e.g. swap when `min.width > max.width`), or compute the clamp manually with `min.width.max(input.width).min(max.width.max(min.width))` semantics so an inverted range cannot panic.","locations":[{"ref":"dpi/src/lib.rs:593-604","code":"  593 |     pub fn clamp<S: Into<Size>>(input: S, min: S, max: S, scale_factor: f64) -> Size {\n  594 |         let (input, min, max) = (\n  595 |             input.into().to_physical::<f64>(scale_factor),\n  596 |             min.into().to_physical::<f64>(scale_factor),\n  597 |             max.into().to_physical::<f64>(scale_factor),\n  598 |         );\n  599 | \n  600 |         let width = input.width.clamp(min.width, max.width);\n  601 |         let height = input.height.clamp(min.height, max.height);\n  602 | \n  603 |         PhysicalSize::new(width, height).into()\n  604 |     }","lines":12,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/dpi/src/lib.rs#L593-L604"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`load_webkit_cursor` calls `NSImage::initByReferencingFile(...).unwrap()` and `NSDictionary::dictionaryWithContentsOfFile(...).unwrap()` on hardcoded, undocumented system paths under `/System/Library/Frameworks/ApplicationServices.framework/...`. These are reached from `cursor_from_icon` for the common `CursorIcon::Move`, `CursorIcon::AllScroll` and `CursorIcon::Cell` cursors. If a macOS version relocates or removes those resource files, setting one of these cursors panics the application instead of falling back.","fix":"Handle the `None`/failure cases (e.g. return `Option<Retained<NSCursor>>` and fall back to `default_cursor()` like `try_cursor_from_selector` does) instead of `unwrap()`.","locations":[{"ref":"winit-appkit/src/cursor.rs:163-197","code":"  163 | unsafe fn load_webkit_cursor(name: &NSString) -> Retained<NSCursor> {\n  164 |     // Snatch a cursor from WebKit; They fit the style of the native\n  165 |     // cursors, and will seem completely standard to macOS users.\n  166 |     //\n  167 |     // https://stackoverflow.com/a/21786835/5435443\n  168 |     let root = ns_string!(\n  169 |         \"/System/Library/Frameworks/ApplicationServices.framework/Versions/A/Frameworks/\\\n  170 |          HIServices.framework/Versions/A/Resources/cursors\"\n  171 |     );\n  172 |     let cursor_path = root.stringByAppendingPathComponent(name);\n  173 | \n  174 |     let pdf_path = cursor_path.stringByAppendingPathComponent(ns_string!(\"cursor.pdf\"));\n  175 |     let image = NSImage::initByReferencingFile(NSImage::alloc(), &pdf_path).unwrap();\n  176 | \n  177 |     // TODO: Handle PLists better\n  178 |     let info_path = cursor_path.stringByAppendingPathComponent(ns_string!(\"info.plist\"));\n  179 |     #[allow(deprecated)]\n  180 |     let info: Retained<NSDictionary<NSObject, NSObject>> =\n  181 |         unsafe { NSDictionary::dictionaryWithContentsOfFile(&info_path) }.unwrap();\n  182 |     let mut x = 0.0;\n  183 |     if let Some(n) = info.objectForKey(ns_string!(\"hotx\")) {\n  184 |         if let Ok(n) = n.downcast::<NSNumber>() {\n  185 |             x = n.as_cgfloat();\n  186 |         }\n  187 |     }\n  188 |     let mut y = 0.0;\n  189 |     if let Some(n) = info.objectForKey(ns_string!(\"hoty\")) {\n  190 |         if let Ok(n) = n.downcast::<NSNumber>() {\n  191 |             y = n.as_cgfloat();\n  192 |         }\n  193 |     }\n  194 | \n  195 |     let hotspot = NSPoint::new(x, y);\n  196 |     NSCursor::initWithImage_hotSpot(NSCursor::alloc(), &image, hotspot)\n  197 | }","lines":35,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/cursor.rs#L163-L197"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`try_as_uris` downcasts data read from an external application's pasteboard with `property_list.downcast::<NSArray>().unwrap()` and `file.downcast::<NSString>().unwrap()`. The deprecated `NSFilenamesPboardType` property list is only conventionally an array of strings; a source application that puts a differently-typed property list on the pasteboard would make these `unwrap()`s panic. Since pasteboard contents are attacker/other-app-controlled, this is a reachable panic on external input.","fix":"Replace the `unwrap()`s with fallible handling: use `downcast::<NSArray>().ok()` / `downcast::<NSString>().ok()` and `filter_map` the results, returning `io::ErrorKind::InvalidData` (or an empty list) when the property list is not the expected shape.","locations":[{"ref":"winit-appkit/src/dnd.rs:290-297","code":"  290 |                 let paths = property_list\n  291 |                     .downcast::<NSArray>()\n  292 |                     .unwrap()\n  293 |                     .into_iter()\n  294 |                     .map(|file| file.downcast::<NSString>().unwrap().to_string())\n  295 |                     .collect();\n  296 | \n  297 |                 return Ok(paths);","lines":8,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/dnd.rs#L290-L297"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`MonitorHandle::current_video_mode` and `MonitorHandle::refresh_rate_millihertz` call `CGDisplayCopyDisplayMode(self.display_id()).unwrap()`. `CGDisplayCopyDisplayMode` returns `NULL` for a display that has no current mode (e.g. a monitor that was disconnected between enumeration and this call, exactly the transient Thunderbolt/CalDigit situation this file elsewhere guards against), which makes these methods panic. `video_mode_handles` handles the analogous `CGDisplayCopyAllDisplayModes` returning `None` gracefully, but these two paths do not.","fix":"Replace `.unwrap()` with a graceful fallback: return `None` from `current_video_mode` / `refresh_rate_millihertz` when `CGDisplayCopyDisplayMode` returns `None`.","locations":[{"ref":"winit-appkit/src/monitor.rs:136-140","code":"  136 |     fn refresh_rate_millihertz(&self) -> Option<NonZeroU32> {\n  137 |         let current_display_mode =\n  138 |             NativeDisplayMode(CGDisplayCopyDisplayMode(self.display_id()).unwrap());\n  139 |         refresh_rate_millihertz(self.display_id(), &current_display_mode)\n  140 |     }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/monitor.rs#L136-L140"},{"ref":"winit-appkit/src/monitor.rs:241-245","code":"  241 |     fn current_video_mode(&self) -> Option<VideoMode> {\n  242 |         let mode = NativeDisplayMode(CGDisplayCopyDisplayMode(self.display_id()).unwrap());\n  243 |         let refresh_rate_millihertz = refresh_rate_millihertz(self.display_id(), &mode);\n  244 |         Some(VideoModeHandle::new(self.clone(), mode, refresh_rate_millihertz).mode)\n  245 |     }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/monitor.rs#L241-L245"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`available_monitors` unwraps `MonitorHandle::new(display)` with `.expect(\"invalid display ID\")`, and `primary_monitor` does the same. `MonitorHandle::new` returns `None` whenever `CGDisplayCreateUUIDFromDisplayID` returns null, and the same file explicitly documents (in `ns_screen` and `current_monitor_inner`) that this can happen even for display IDs freshly returned by the live AppKit/CoreGraphics APIs with \"certain Thunderbolt docked monitors\" / spurious CalDigit hub monitors. So the very scenario the file warns about elsewhere makes `available_monitors`/`primary_monitor` panic instead of skipping the bad display.","fix":"Use `flatten`/`filter_map` for `available_monitors` (skip and `warn!` on `None`), and make `primary_monitor` return `Option<MonitorHandle>` (or fall back gracefully) rather than `.expect(...)`.","locations":[{"ref":"winit-appkit/src/monitor.rs:270-275","code":"  270 |     let mut monitors = VecDeque::with_capacity(displays.len());\n  271 |     for display in displays {\n  272 |         // Display ID just fetched from `CGGetActiveDisplayList`, should be fine to unwrap.\n  273 |         monitors.push_back(MonitorHandle::new(display).expect(\"invalid display ID\"));\n  274 |     }\n  275 |     monitors","lines":6,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/monitor.rs#L270-L275"},{"ref":"winit-appkit/src/monitor.rs:278-281","code":"  278 | pub fn primary_monitor() -> MonitorHandle {\n  279 |     // Display ID just fetched from `CGMainDisplayID`, should be fine to unwrap.\n  280 |     MonitorHandle::new(CGMainDisplayID()).expect(\"invalid display ID\")\n  281 | }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/monitor.rs#L278-L281"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`restore_and_release_display` does `cgerr(CGDisplayRelease(monitor.native_id() as _)).unwrap()`. This is invoked from `set_fullscreen` when leaving exclusive fullscreen, which is itself called from `Window::drop` (which restores the video mode on a fullscreen-exclusive window). A failing `CGDisplayRelease` therefore panics inside `Drop`, which aborts the process.","fix":"Replace `.unwrap()` with a `warn!`/`error!` log on failure so a failing release during teardown does not abort the process.","locations":[{"ref":"winit-appkit/src/window_delegate.rs:2268-2279","code":" 2268 | fn restore_and_release_display(monitor: &MonitorHandle) {\n 2269 |     let available_monitors = monitor::available_monitors();\n 2270 |     if available_monitors.contains(monitor) {\n 2271 |         CGRestorePermanentDisplayConfiguration();\n 2272 |         cgerr(CGDisplayRelease(monitor.native_id() as _)).unwrap();\n 2273 |     } else {\n 2274 |         warn!(\n 2275 |             monitor = monitor.name().map(|name| name.to_string()),\n 2276 |             \"Tried to restore exclusive fullscreen on a monitor that is no longer available\"\n 2277 |         );\n 2278 |     }\n 2279 | }","lines":12,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/window_delegate.rs#L2268-L2279"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`WinitView::handle_touches` calls `ivars.primary_finger.get().unwrap()` in the `Moved` arm (`winit-uikit/src/view.rs:585`) and in the `Ended | Cancelled` arm (`winit-uikit/src/view.rs:607`). These unwraps assume that a non-pencil touch always has a tracked primary finger, i.e. that a `Began` for that finger was previously processed while `primary_finger` was set. If UIKit delivers a `Moved`/`Ended`/`Cancelled` for a finger when `primary_finger` is `None` (for example a `Cancelled` that arrives after all fingers were already cleared, or a system-generated cancel without a matching tracked `Began`), the `unwrap()` panics inside an Objective-C callback, which is undefined behaviour when unwinding across the FFI boundary.","fix":"Do not unwrap; treat a missing primary as non-primary, e.g. `let primary = ivars.primary_finger.get() == Some(finger_id);` in both the `Moved` and `Ended | Cancelled` arms, and guard the finger-count decrement so it cannot underflow.","locations":[{"ref":"winit-uikit/src/view.rs:578-613","code":"  578 |                 UITouchPhase::Moved => {\n  579 |                     let (primary, source) = if let UITouchType::Pencil = touch_type {\n  580 |                         let tool_data = self.tablet_tool_data_for_pencil(&touch);\n  581 |                         (true, PointerSource::TabletTool {\n  582 |                             kind: TabletToolKind::Pencil,\n  583 |                             data: tool_data,\n  584 |                         })\n  585 |                     } else {\n  586 |                         (ivars.primary_finger.get().unwrap() == finger_id, PointerSource::Touch {\n  587 |                             finger_id,\n  588 |                             force,\n  589 |                         })\n  590 |                     };\n  591 | \n  592 |                     touch_events.push(EventWrapper::Window {\n  593 |                         window_id,\n  594 |                         event: WindowEvent::PointerMoved {\n  595 |                             device_id: None,\n  596 |                             primary,\n  597 |                             position,\n  598 |                             source,\n  599 |                         },\n  600 |                     });\n  601 |                 },\n  602 |                 // 2 is UITouchPhase::Stationary and is not expected here\n  603 |                 UITouchPhase::Ended | UITouchPhase::Cancelled => {\n  604 |                     let primary = if let UITouchType::Pencil = touch_type {\n  605 |                         true\n  606 |                     } else {\n  607 |                         ivars.fingers.set(ivars.fingers.get() - 1);\n  608 |                         let primary = ivars.primary_finger.get().unwrap() == finger_id;\n  609 |                         if ivars.fingers.get() == 0 {\n  610 |                             ivars.primary_finger.set(None);\n  611 |                         }\n  612 |                         primary\n  613 |                     };","lines":36,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-uikit/src/view.rs#L578-L613"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In the Wayland window state, `configure()` applies resize increments by dividing the size delta by `increments.width` / `increments.height`:\n```rust\nlet width = self.min_surface_size.width + (delta_width / increments.width) * increments.width;\nlet height = self.min_surface_size.height + (delta_height / increments.height) * increments.height;\n```\n`resize_increments` is stored verbatim via `set_resize_increments()` / `set_surface_resize_increments()` and set from `attributes.surface_resize_increments` in `Window::new()` without any non-zero validation. If an application supplies a resize increment whose logical `width` or `height` is `0` (e.g. a `LogicalSize::new(0, 1)`, or a physical size that rounds to `0` on a fractional scale), the integer division `delta_width / increments.width` panics with a divide-by-zero on the next compositor `configure`, crashing the event loop.","fix":"Reject or clamp zero increments. Either skip the increment snapping when `increments.width == 0 || increments.height == 0`, or store increments as `Option<NonZeroU32>` / clamp with `increments.width.max(1)` before dividing:\n```rust\nif let Some(increments) = self.resize_increments.filter(|i| i.width != 0 && i.height != 0) {\n    // ... existing snapping ...\n}\n```","locations":[{"ref":"winit-wayland/src/window/state.rs:483-500","code":"  483 |             if let Some(increments) = self.resize_increments {\n  484 |                 // We use min size as a base size for the increments, similar to how X11 does it.\n  485 |                 //\n  486 |                 // This ensures that we can always reach the min size and the increments are\n  487 |                 // calculated from it.\n  488 |                 let (delta_width, delta_height) = (\n  489 |                     new_size.width.saturating_sub(self.min_surface_size.width),\n  490 |                     new_size.height.saturating_sub(self.min_surface_size.height),\n  491 |                 );\n  492 | \n  493 |                 let width = self.min_surface_size.width\n  494 |                     + (delta_width / increments.width) * increments.width;\n  495 |                 let height = self.min_surface_size.height\n  496 |                     + (delta_height / increments.height) * increments.height;\n  497 | \n  498 |                 new_size = (width, height).into();\n  499 |             }\n  500 |         }","lines":18,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/window/state.rs#L483-L500"},{"ref":"winit-wayland/src/window/state.rs:956-960","code":"  956 |     pub fn set_resize_increments(&mut self, increments: Option<LogicalSize<u32>>) {\n  957 |         self.resize_increments = increments;\n  958 |         // NOTE: We don't update the window size here, because it will be done on the next resize\n  959 |         // or configure event.\n  960 |     }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/window/state.rs#L956-L960"},{"ref":"winit-wayland/src/window/mod.rs:167-170","code":"  167 |         if let Some(increments) = attributes.surface_resize_increments {\n  168 |             let increments = increments.to_logical(window_state.scale_factor());\n  169 |             window_state.set_resize_increments(Some(increments));\n  170 |         }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/window/mod.rs#L167-L170"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`build_html_clipboard_format` does `body.find(END_MARKER).unwrap()` (and `body.find(START_MARKER).unwrap()`). When the app-supplied HTML already contains `<!--StartFragment-->` the input is used verbatim (`Cow::Borrowed(html)`); if that same string does *not* also contain `<!--EndFragment-->`, the `body.find(END_MARKER).unwrap()` panics. This function is reached from `SourceDataObjectData::GetData` (`send_data_to_stgmedium`), which is an `unsafe extern \"system\"` COM entry point. Unwinding across that FFI boundary is undefined behaviour, so malformed app HTML turns into UB rather than a clean error.","fix":"Handle the missing-marker case without unwinding: only take the `Cow::Borrowed` fast path when *both* `START_MARKER` and `END_MARKER` are present, otherwise wrap the input; and replace the `unwrap()`s with graceful fallbacks (e.g. return an unwrapped document or make `send_data_to_stgmedium` return `None` so `GetData` yields `E_FAIL`).","locations":[{"ref":"winit-win32/src/dnd.rs:845-848","code":"  845 |     let start_html = HEADER_LEN;\n  846 |     let end_html = HEADER_LEN + body.len();\n  847 |     let start_fragment = HEADER_LEN + body.find(START_MARKER).unwrap() + START_MARKER.len();\n  848 |     let end_fragment = HEADER_LEN + body.find(END_MARKER).unwrap();","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/dnd.rs#L845-L848"},{"ref":"winit-win32/src/dnd.rs:1198-1202","code":" 1198 |         let Some(medium) = (unsafe { send_data_to_stgmedium(data, hint) }) else {\n 1199 |             return E_FAIL;\n 1200 |         };\n 1201 |         unsafe { *pmedium = medium };\n 1202 |         S_OK","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/dnd.rs#L1198-L1202"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Window::set_fullscreen` gates the display-mode change with `debug_assert!` for the recoverable failure codes but then finishes with `assert_eq!(res, DISP_CHANGE_SUCCESSFUL)`, which is compiled in release too. If `ChangeDisplaySettingsExW` returns any non-success code (e.g. `DISP_CHANGE_RESTART`, or a mode the driver rejects at runtime), the event-loop thread panics. Both the enter-exclusive and the restore-from-exclusive branches do this. Similarly `create_window_data` uses `assert_eq!(RegisterDragDrop(..), S_OK)`, panicking on any drag-drop registration failure during window creation.","fix":"Do not `assert_eq!` on the runtime result; check `res != DISP_CHANGE_SUCCESSFUL` and `warn!`/return (or propagate an error) instead, and handle a non-`S_OK` `RegisterDragDrop` by logging and skipping drag-drop rather than aborting the process.","locations":[{"ref":"winit-win32/src/window.rs:910-914","code":"  910 |                     debug_assert!(res != DISP_CHANGE_BADFLAGS);\n  911 |                     debug_assert!(res != DISP_CHANGE_BADMODE);\n  912 |                     debug_assert!(res != DISP_CHANGE_BADPARAM);\n  913 |                     debug_assert!(res != DISP_CHANGE_FAILED);\n  914 |                     assert_eq!(res, DISP_CHANGE_SUCCESSFUL);","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/window.rs#L910-L914"},{"ref":"winit-win32/src/window.rs:910-914","code":"  910 |                     debug_assert!(res != DISP_CHANGE_BADFLAGS);\n  911 |                     debug_assert!(res != DISP_CHANGE_BADMODE);\n  912 |                     debug_assert!(res != DISP_CHANGE_BADPARAM);\n  913 |                     debug_assert!(res != DISP_CHANGE_FAILED);\n  914 |                     assert_eq!(res, DISP_CHANGE_SUCCESSFUL);","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/window.rs#L910-L914"},{"ref":"winit-win32/src/window.rs:1470","code":" 1470 |             assert_eq!(unsafe { RegisterDragDrop(win.window.hwnd(), handler_interface_ptr) }, S_OK);","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/window.rs#L1470"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`AppState::wakeup` does `let start = self.start_time.get().unwrap();`. `start_time` is only ever set in `cleared()` (the `BeforeWaiting` observer). `wakeup` runs from the `AfterWaiting` observer, so this relies on the invariant that `cleared()` has already run at least once with `is_running() == true`; if the run-loop ever delivers an `AfterWaiting` to a running/ready handler before the first `BeforeWaiting` set `start_time`, this panics. It is a fragile `unwrap()` on an ordering invariant rather than an explicit guarantee.","fix":"Fall back gracefully, e.g. `let start = self.start_time.get().unwrap_or_else(Instant::now);`, or initialize `start_time` to `Some(Instant::now())` when the loop starts running.","locations":[{"ref":"winit-appkit/src/app_state.rs:358","code":"  358 |         let start = self.start_time.get().unwrap();","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/app_state.rs#L358"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`mouse_button` does `event.buttonNumber().try_into().ok().and_then(MouseButton::try_from_u8).expect(\"expected MacOS button number in the range 0..=31\")`. `MouseButton::try_from_u8` only accepts `0..=31` (returns `None` otherwise), and the `isize -> u8` `try_into` returns `Err` for any value `> 255`. Any `NSEvent` whose `buttonNumber` is `>= 32` (nothing in AppKit guarantees it stays `<= 31`) makes this externally-driven event handler panic.","fix":"Fall back gracefully instead of panicking, e.g. clamp/ignore out-of-range button numbers (`unwrap_or(MouseButton::Left)` or return without queuing an event) and log a warning.","locations":[{"ref":"winit-appkit/src/view.rs:1245-1256","code":" 1245 | fn mouse_button(event: &NSEvent) -> MouseButton {\n 1246 |     // The buttonNumber property only makes sense for the mouse events:\n 1247 |     // NSLeftMouse.../NSRightMouse.../NSOtherMouse...\n 1248 |     // For the other events, it's always set to 0.\n 1249 |     // MacOS only defines the left, right and middle buttons, 3..=31 are left as generic buttons,\n 1250 |     // but 3 and 4 are very commonly used as Back and Forward by hardware vendors and applications.\n 1251 |     let b: isize = event.buttonNumber();\n 1252 |     b.try_into()\n 1253 |         .ok()\n 1254 |         .and_then(MouseButton::try_from_u8)\n 1255 |         .expect(\"expected MacOS button number in the range 0..=31\")\n 1256 | }","lines":12,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/view.rs#L1245-L1256"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`replace_event` (option-as-alt handling) calls `event.charactersIgnoringModifiers().expect(\"expected characters to be non-null\")`. `-[NSEvent charactersIgnoringModifiers]` can return `nil` for some key events, which would panic the `keyDown:` path whenever the user has `OptionAsAlt` enabled and holds Option.","fix":"Handle the `None` case by falling back to `event.copy()` (i.e. skip the rewrite when there are no characters to remap) instead of `.expect(...)`.","locations":[{"ref":"winit-appkit/src/view.rs:1271-1287","code":" 1271 |     if ignore_alt_characters {\n 1272 |         let ns_chars =\n 1273 |             event.charactersIgnoringModifiers().expect(\"expected characters to be non-null\");\n 1274 | \n 1275 |         NSEvent::keyEventWithType_location_modifierFlags_timestamp_windowNumber_context_characters_charactersIgnoringModifiers_isARepeat_keyCode(\n 1276 |                 event.r#type(),\n 1277 |                 event.locationInWindow(),\n 1278 |                 event.modifierFlags(),\n 1279 |                 event.timestamp(),\n 1280 |                 event.windowNumber(),\n 1281 |                 None,\n 1282 |                 &ns_chars,\n 1283 |                 &ns_chars,\n 1284 |                 event.isARepeat(),\n 1285 |                 event.keyCode(),\n 1286 |             )\n 1287 |             .unwrap()","lines":17,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/view.rs#L1271-L1287"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`set_maximized` uses `NSScreen::mainScreen(mtm).expect(\"no screen found\")` in the non-resizable branch. On a headless machine or with no attached displays `mainScreen` returns `None`, so maximizing a non-resizable window panics.","fix":"Guard with `let Some(screen) = NSScreen::mainScreen(mtm) else { return; };` and skip the resize when no screen is available.","locations":[{"ref":"winit-appkit/src/window_delegate.rs:1812-1819","code":" 1812 |             // if it's not resizable, we set the frame directly\n 1813 |             let new_rect = if maximized {\n 1814 |                 let screen = NSScreen::mainScreen(mtm).expect(\"no screen found\");\n 1815 |                 screen.visibleFrame()\n 1816 |             } else {\n 1817 |                 self.ivars().standard_frame.get().unwrap_or(DEFAULT_STANDARD_FRAME)\n 1818 |             };\n 1819 |             self.window().setFrame_display(new_rect, false);","lines":8,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/window_delegate.rs#L1812-L1819"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`make_string_with` computes `usize::try_from(size).unwrap()` on the `i32` returned by `xkb_state_key_get_utf8` / `xkb_compose_state_get_utf8`, and later `usize::try_from(written).unwrap()`. These xkb functions return the number of bytes needed, which is expected to be non-negative, but a negative return (contract violation / error from libxkbcommon) turns into a panic rather than a `None`. `keysym_to_utf8_raw` handles a `-1` sentinel explicitly; this helper does not.","fix":"Use fallible conversion returning `None` on negative/oversized values, e.g. `let Ok(size) = usize::try_from(size) else { return None; };` and likewise for `written`.","locations":[{"ref":"winit-common/src/xkb/mod.rs:383-405","code":"  383 | fn make_string_with<F>(scratch_buffer: &mut Vec<u8>, mut f: F) -> Option<SmolStr>\n  384 | where\n  385 |     F: FnMut(*mut c_char, usize) -> i32,\n  386 | {\n  387 |     let size = f(ptr::null_mut(), 0);\n  388 |     if size == 0 {\n  389 |         return None;\n  390 |     }\n  391 |     let size = usize::try_from(size).unwrap();\n  392 |     scratch_buffer.clear();\n  393 |     // The allocated buffer must include space for the null-terminator.\n  394 |     scratch_buffer.reserve(size + 1);\n  395 |     unsafe {\n  396 |         let written = f(scratch_buffer.as_mut_ptr().cast(), scratch_buffer.capacity());\n  397 |         if usize::try_from(written).unwrap() != size {\n  398 |             // This will likely never happen.\n  399 |             return None;\n  400 |         }\n  401 |         scratch_buffer.set_len(size);\n  402 |     };\n  403 | \n  404 |     byte_slice_to_smol_str(scratch_buffer)\n  405 | }","lines":23,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-common/src/xkb/mod.rs#L383-L405"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The Orbital `EventLoop` uses `expect`/`unwrap` on per-iteration syscalls that can fail at runtime: `single_iteration` does `libredox::call::read(window.fd(), ...).expect(\"failed to read window events\")` and `window.fpath(...).expect(\"failed to read properties\")`, the resize-ack path does `window.write(...).expect(\"failed to acknowledge resize\")`, and `pump_app_events` does `event_socket.subscribe(EVENT_TIMEOUT_ID, ...).expect(...)` and `panic!(\"failed to read event: {err}\")`. A transient OS error in any of these aborts the whole event loop with a panic instead of being handled.","fix":"Handle recoverable syscall errors (log and skip the offending window / iteration) instead of `expect`/`panic!`, reserving hard failures for genuinely unrecoverable states.","locations":[{"ref":"winit-orbital/src/event_loop.rs:573-636","code":"  573 |                 let mut buf: [u8; 4096] = [0; 4096];\n  574 |                 let path = window.fpath(&mut buf).expect(\"failed to read properties\");\n  575 |                 let properties = WindowProperties::new(path);\n  576 | \n  577 |                 self.windows.push((window, EventState::default()));\n  578 | \n  579 |                 // Send resize event on create to indicate first size.\n  580 |                 let event = event::WindowEvent::SurfaceResized((properties.w, properties.h).into());\n  581 |                 app.window_event(&self.window_target, window_id, event);\n  582 | \n  583 |                 // Send moved event on create to indicate first position.\n  584 |                 let event = event::WindowEvent::Moved((properties.x, properties.y).into());\n  585 |                 app.window_event(&self.window_target, window_id, event);\n  586 |             }\n  587 | \n  588 |             // Handle window destroys.\n  589 |             while let Some(destroy_id) = {\n  590 |                 let mut destroys = self.window_target.destroys.lock().unwrap();\n  591 |                 destroys.pop_front()\n  592 |             } {\n  593 |                 app.window_event(&self.window_target, destroy_id, event::WindowEvent::Destroyed);\n  594 |                 self.windows\n  595 |                     .retain(|(window, _event_state)| WindowId::from_raw(window.fd()) != destroy_id);\n  596 |             }\n  597 | \n  598 |             // Handle window events.\n  599 |             let mut i = 0;\n  600 |             // While loop is used here because the same window may be processed more than once.\n  601 |             while let Some((window, event_state)) = self.windows.get_mut(i) {\n  602 |                 let window_id = WindowId::from_raw(window.fd());\n  603 | \n  604 |                 let mut event_buf = [0u8; 16 * mem::size_of::<orbclient::Event>()];\n  605 |                 let count = libredox::call::read(window.fd(), &mut event_buf)\n  606 |                     .expect(\"failed to read window events\");\n  607 |                 // Safety: orbclient::Event is a packed struct designed to be transferred over a\n  608 |                 // socket.\n  609 |                 let events = unsafe {\n  610 |                     slice::from_raw_parts(\n  611 |                         event_buf.as_ptr() as *const orbclient::Event,\n  612 |                         count / mem::size_of::<orbclient::Event>(),\n  613 |                     )\n  614 |                 };\n  615 | \n  616 |                 for orbital_event in events {\n  617 |                     Self::process_event(\n  618 |                         window_id,\n  619 |                         orbital_event.to_option(),\n  620 |                         event_state,\n  621 |                         &self.window_target,\n  622 |                         app,\n  623 |                     );\n  624 |                 }\n  625 | \n  626 |                 if count == event_buf.len() {\n  627 |                     // If event buf was full, process same window again to ensure all events are\n  628 |                     // drained.\n  629 |                     continue;\n  630 |                 }\n  631 | \n  632 |                 // Acknowledge the latest resize event.\n  633 |                 if let Some((w, h)) = event_state.resize_opt.take() {\n  634 |                     window\n  635 |                         .write(format!(\"S,{w},{h}\").as_bytes())\n  636 |                         .expect(\"failed to acknowledge resize\");","lines":64,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-orbital/src/event_loop.rs#L573-L636"},{"ref":"winit-orbital/src/event_loop.rs:697-717","code":"  697 |         if let Some(timeout) = timeout {\n  698 |             self.window_target\n  699 |                 .event_socket\n  700 |                 .subscribe(\n  701 |                     EVENT_TIMEOUT_ID,\n  702 |                     UserData::from_user_data(timeout.as_millis() as usize),\n  703 |                     EventFlags::READ,\n  704 |                 )\n  705 |                 .expect(\"failed to register EVENT_TIMEOUT_ID\")\n  706 |         }\n  707 | \n  708 |         // Wait for event if needed.\n  709 |         let event = loop {\n  710 |             match self.window_target.event_socket.next_event() {\n  711 |                 Ok(event) => break event,\n  712 |                 Err(err) if err.is_interrupt() => continue,\n  713 |                 Err(err) => {\n  714 |                     panic!(\"failed to read event: {err}\");\n  715 |                 },\n  716 |             }\n  717 |         };","lines":21,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-orbital/src/event_loop.rs#L697-L717"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"The gesture handlers (`pinch_gesture`, `rotation_gesture`, `pan_gesture`) end their `match recognizer.state()` with `state => panic!(\"unexpected recognizer state: {state:?}\")`. `UIGestureRecognizerState` includes `Possible` (and the enum is non-exhaustive from Rust's view); if the action selector is ever invoked in an unhandled state the app panics inside an Objective-C callback rather than ignoring it.","fix":"Replace the panicking arms with a no-op that returns early (log at trace level) so unexpected or future recognizer states are ignored gracefully.","locations":[{"ref":"winit-uikit/src/view.rs:183","code":"  183 |                 state => panic!(\"unexpected recognizer state: {state:?}\"),","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-uikit/src/view.rs#L183"},{"ref":"winit-uikit/src/view.rs:239","code":"  239 |                 state => panic!(\"unexpected recognizer state: {state:?}\"),","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-uikit/src/view.rs#L239"},{"ref":"winit-uikit/src/view.rs:293","code":"  293 |                 state => panic!(\"unexpected recognizer state: {state:?}\"),","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-uikit/src/view.rs#L293"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`CustomCursor::new` and `ToplevelIcon::new` call `image_to_buffer(...).unwrap()` on user-controlled image dimensions:\n```\nlet buffer = image_to_buffer(image.width() as i32, image.height() as i32, ...).unwrap();\n```\n`image_to_buffer` returns `Result<_, CreateBufferError>`, which can fail (e.g. when the SlotPool cannot allocate, or when large `width`/`height` produce an invalid `4 * width` stride). A failure here panics the whole event loop instead of surfacing an error to the caller.","fix":"Propagate the error: make `CustomCursor::new` return `Result<Self, CreateBufferError>` (and handle it at the call site), and map the failure into `ToplevelIconError` in `ToplevelIcon::new` instead of `unwrap()`.","locations":[{"ref":"winit-wayland/src/types/cursor.rs:38-58","code":"   38 | impl CustomCursor {\n   39 |     pub(crate) fn new(pool: &mut SlotPool, image: &WaylandCustomCursor) -> Self {\n   40 |         let image = &image.0;\n   41 |         let buffer = image_to_buffer(\n   42 |             image.width() as i32,\n   43 |             image.height() as i32,\n   44 |             image.buffer(),\n   45 |             Format::Argb8888,\n   46 |             pool,\n   47 |         )\n   48 |         .unwrap();\n   49 | \n   50 |         CustomCursor {\n   51 |             buffer,\n   52 |             w: image.width() as i32,\n   53 |             h: image.height() as i32,\n   54 |             hotspot_x: image.hotspot_x() as i32,\n   55 |             hotspot_y: image.hotspot_y() as i32,\n   56 |         }\n   57 |     }\n   58 | }","lines":21,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/types/cursor.rs#L38-L58"},{"ref":"winit-wayland/src/types/xdg_toplevel_icon_manager.rs:36-52","code":"   36 |     pub fn new(icon: Icon, pool: &mut SlotPool) -> Result<Self, ToplevelIconError> {\n   37 |         let icon = match icon.cast_ref::<RgbaIcon>() {\n   38 |             Some(icon) => icon,\n   39 |             None => return Err(ToplevelIconError::Unsupported),\n   40 |         };\n   41 | \n   42 |         let buffer = image_to_buffer(\n   43 |             icon.width() as i32,\n   44 |             icon.height() as i32,\n   45 |             icon.buffer(),\n   46 |             Format::Argb8888,\n   47 |             pool,\n   48 |         )\n   49 |         .unwrap();\n   50 | \n   51 |         Ok(Self { buffer })\n   52 |     }","lines":17,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/types/xdg_toplevel_icon_manager.rs#L36-L52"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the Web cursor code, `from_animation()` awaits a loading cursor and unwraps the result:\n```rust\nImageState::Loading { notifier, .. } => {\n    let notified = notifier.notified();\n    drop(state);\n    notified.await.unwrap()?;\n},\n```\n`Notified::poll` returns `Poll::Ready(None)` when the `Notifier` is dropped without ever calling `notify()` (its `Drop` closes the queue and wakes waiters with no value). If the loading task backing that cursor is aborted (via its `DropAbortHandle`) before it notifies, `notified.await` yields `None` and this `unwrap()` panics. The animation cursor holds clones keeping the source cursors alive, so it does not fire under normal use, but a cancelled/aborted load makes it reachable.","fix":"Treat a `None` notification as a load failure rather than unwrapping, e.g. map it to a `CustomCursorError` and return early:\n```rust\nmatch notified.await {\n    Some(result) => result?,\n    None => return Err(CustomCursorError::Blob),\n}\n```","locations":[{"ref":"winit-web/src/cursor.rs:654-658","code":"  654 |             ImageState::Loading { notifier, .. } => {\n  655 |                 let notified = notifier.notified();\n  656 |                 drop(state);\n  657 |                 notified.await.unwrap()?;\n  658 |             },","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/cursor.rs#L654-L658"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`SafeAreaHandle::get` assumes the computed `--__winit_safe_area` value is always four space-separated `px` values, using `strip_suffix(\"px\").expect(..)` and four `values.next().unwrap().parse().unwrap()`. On a browser/context where the `env(safe-area-inset-*)` values resolve to nothing (unsupported), the computed value can be empty or non-`px`, causing a panic in `Window::safe_area()`.","fix":"Parse defensively: treat a missing/empty/non-`px` component as `0.0` (e.g. fall back to `unwrap_or(0.0)`) instead of panicking, so an unsupported `env()` yields zero insets.","locations":[{"ref":"winit-web/src/web_sys/safe_area.rs:33-48","code":"   33 |     pub fn get(&self) -> (LogicalPosition<f64>, LogicalSize<f64>) {\n   34 |         let value = self.style.get(\"--__winit_safe_area\");\n   35 | \n   36 |         let mut values = value\n   37 |             .split(' ')\n   38 |             .map(|value| value.strip_suffix(\"px\").expect(\"unexpected unit other then `px` found\"));\n   39 |         let top: f64 = values.next().unwrap().parse().unwrap();\n   40 |         let right: f64 = values.next().unwrap().parse().unwrap();\n   41 |         let bottom: f64 = values.next().unwrap().parse().unwrap();\n   42 |         let left: f64 = values.next().unwrap().parse().unwrap();\n   43 |         assert_eq!(values.next(), None, \"unexpected fifth value\");\n   44 | \n   45 |         let width = super::style_size_property(&self.style, \"width\") - left - right;\n   46 |         let height = super::style_size_property(&self.style, \"height\") - top - bottom;\n   47 | \n   48 |         (LogicalPosition::new(left, top), LogicalSize::new(width, height))","lines":16,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/web_sys/safe_area.rs#L33-L48"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Several `MonitorHandle` methods call `get_monitor_info(self.0).unwrap()`, panicking if `GetMonitorInfoW` fails (which can legitimately happen if the monitor was hot-unplugged between obtaining the handle and querying it): `size()` and `name()`. `Window::set_fullscreen` likewise does `monitor::get_monitor_info(monitor.native_id() as _).unwrap()`. Other methods on the same type (`position`, `scale_factor`) already handle the error gracefully.","fix":"Handle the `Err` case (return a default/`None` or bail out of the fullscreen transition) instead of `unwrap()`.","locations":[{"ref":"winit-win32/src/monitor.rs:121-127","code":"  121 |     pub(crate) fn size(&self) -> PhysicalSize<u32> {\n  122 |         let rc_monitor = get_monitor_info(self.0).unwrap().monitorInfo.rcMonitor;\n  123 |         PhysicalSize {\n  124 |             width: (rc_monitor.right - rc_monitor.left) as u32,\n  125 |             height: (rc_monitor.bottom - rc_monitor.top) as u32,\n  126 |         }\n  127 |     }","lines":7,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/monitor.rs#L121-L127"},{"ref":"winit-win32/src/monitor.rs:181-184","code":"  181 |     fn name(&self) -> Option<std::borrow::Cow<'_, str>> {\n  182 |         let monitor_info = get_monitor_info(self.0).unwrap();\n  183 |         Some(decode_wide(&monitor_info.szDevice).to_string_lossy().to_string().into())\n  184 |     }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/monitor.rs#L181-L184"},{"ref":"winit-win32/src/window.rs:898","code":"  898 |                     let monitor_info = monitor::get_monitor_info(monitor.native_id() as _).unwrap();","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/window.rs#L898"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Numerous public/`CoreWindow`-facing methods turn transient X protocol errors into panics via `.expect(...)`, so a misbehaving WM/server can crash the whole application from ordinary API calls. Examples: `available_monitors` (`expect(\"Failed to get available monitors\")`), `primary_monitor` (`expect(\"Failed to get primary monitor\")`), `surface_size_physical`/`inner_position_physical` (`.unwrap()` on `get_geometry`/`translate_coords_root`), and `generate_activation_token` (`expect(\"Failed to get title\")` / `expect(\"Bad title\")`).","fix":"Propagate these as `RequestError`/`Result` (the callers of `available_monitors`/`primary_monitor` already return `Option`, so return an empty list / `None` on error) or at minimum downgrade to `tracing::error!` plus a sane fallback instead of aborting the process.","locations":[{"ref":"winit-x11/src/window.rs:1204-1210","code":" 1204 |     pub fn available_monitors(&self) -> Vec<X11MonitorHandle> {\n 1205 |         self.xconn.available_monitors().expect(\"Failed to get available monitors\")\n 1206 |     }\n 1207 | \n 1208 |     pub fn primary_monitor(&self) -> Option<X11MonitorHandle> {\n 1209 |         Some(self.xconn.primary_monitor().expect(\"Failed to get primary monitor\"))\n 1210 |     }","lines":7,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/window.rs#L1204-L1210"},{"ref":"winit-x11/src/window.rs:1540-1547","code":" 1540 |     fn inner_position_physical(&self) -> (i32, i32) {\n 1541 |         // This should be okay to unwrap since the only error XTranslateCoordinates can return\n 1542 |         // is BadWindow, and if the window handle is bad we have bigger problems.\n 1543 |         self.xconn\n 1544 |             .translate_coords_root(self.xwindow, self.root)\n 1545 |             .map(|coords| (coords.dst_x.into(), coords.dst_y.into()))\n 1546 |             .unwrap()\n 1547 |     }","lines":8,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/window.rs#L1540-L1547"},{"ref":"winit-x11/src/window.rs:1594-1601","code":" 1594 |     pub(crate) fn surface_size_physical(&self) -> (u32, u32) {\n 1595 |         // This should be okay to unwrap since the only error XGetGeometry can return\n 1596 |         // is BadWindow, and if the window handle is bad we have bigger problems.\n 1597 |         self.xconn\n 1598 |             .get_geometry(self.xwindow)\n 1599 |             .map(|geo| (geo.width.into(), geo.height.into()))\n 1600 |             .unwrap()\n 1601 |     }","lines":8,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/window.rs#L1594-L1601"},{"ref":"winit-x11/src/window.rs:2222-2238","code":" 2222 |     pub(crate) fn generate_activation_token(&self) -> Result<String, X11Error> {\n 2223 |         // Get the title from the WM_NAME property.\n 2224 |         let atoms = self.xconn.atoms();\n 2225 |         let title = {\n 2226 |             let title_bytes = self\n 2227 |                 .xconn\n 2228 |                 .get_property(self.xwindow, atoms[_NET_WM_NAME], atoms[UTF8_STRING])\n 2229 |                 .expect(\"Failed to get title\");\n 2230 | \n 2231 |             String::from_utf8(title_bytes).expect(\"Bad title\")\n 2232 |         };\n 2233 | \n 2234 |         // Get the activation token and then put it in the event queue.\n 2235 |         let token = self.xconn.request_activation_token(&title)?;\n 2236 | \n 2237 |         Ok(token)\n 2238 |     }","lines":17,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/window.rs#L2222-L2238"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"hard","description":"`thread_event_target_callback` is not re-entrancy safe. It reconstructs the userdata box on every call with `let userdata = Box::from_raw(userdata_ptr);` and re-leaks it at the end with `Box::leak(userdata)`. However the `EXEC_MSG_ID` arm runs arbitrary application code (`function()`), and the `USER_EVENT_MSG_ID`/`WM_INPUT` paths can also dispatch, all of which can pump the message queue and re-enter this same window procedure. On re-entry `Box::from_raw` is called a second time on the same pointer, producing two aliasing `Box<ThreadMsgTargetData>` owners (UB). If the inner invocation processes `WM_NCDESTROY`, it sets `userdata_removed` and `drop(userdata)`, freeing the allocation while the outer frame still holds a `Box` to it. Unlike `public_window_callback`, which guards this exact scenario with a `recurse_depth` counter, this callback has no such guard.","fix":"Use the same `recurse_depth`/borrow pattern as `public_window_callback`: take a `&ThreadMsgTargetData` via `&*userdata_ptr` instead of `Box::from_raw`, track a recursion depth, and only `Box::from_raw(...).drop()` the allocation when `userdata_removed && recurse_depth == 0`.","locations":[{"ref":"winit-win32/src/event_loop.rs:2577-2631","code":" 2577 |     let userdata = unsafe { Box::from_raw(userdata_ptr) };\n 2578 | \n 2579 |     if msg != WM_PAINT {\n 2580 |         unsafe { RedrawWindow(window, ptr::null(), ptr::null_mut(), RDW_INTERNALPAINT) };\n 2581 |     }\n 2582 | \n 2583 |     let mut userdata_removed = false;\n 2584 | \n 2585 |     // I decided to bind the closure to `callback` and pass it to catch_unwind rather than passing\n 2586 |     // the closure to catch_unwind directly so that the match body indentation wouldn't change and\n 2587 |     // the git blame and history would be preserved.\n 2588 |     let callback = || match msg {\n 2589 |         WM_NCDESTROY => {\n 2590 |             unsafe { util::set_window_long(window, GWL_USERDATA, 0) };\n 2591 |             userdata_removed = true;\n 2592 |             0\n 2593 |         },\n 2594 |         WM_PAINT => unsafe {\n 2595 |             ValidateRect(window, ptr::null());\n 2596 |             // Default WM_PAINT behaviour. This makes sure modals and popups are shown immediately\n 2597 |             // when opening them.\n 2598 |             DefWindowProcW(window, msg, wparam, lparam)\n 2599 |         },\n 2600 |         WM_INPUT => {\n 2601 |             if let Some(data) = raw_input::get_raw_input_data(lparam as _) {\n 2602 |                 unsafe { handle_raw_input(&userdata, data) };\n 2603 |             }\n 2604 | \n 2605 |             unsafe { DefWindowProcW(window, msg, wparam, lparam) }\n 2606 |         },\n 2607 | \n 2608 |         _ if msg == USER_EVENT_MSG_ID.get() => {\n 2609 |             // synthesis a placeholder UserEvent, so that if the callback is\n 2610 |             // re-entered it can be buffered for later delivery. the real\n 2611 |             // user event is still in the mpsc channel and will be pulled\n 2612 |             // once the placeholder event is delivered to the wrapper\n 2613 |             // `event_handler`\n 2614 |             userdata.send_wakeup();\n 2615 |             0\n 2616 |         },\n 2617 |         _ if msg == EXEC_MSG_ID.get() => {\n 2618 |             let mut function: ThreadExecFn = unsafe { Box::from_raw(wparam as *mut _) };\n 2619 |             function();\n 2620 |             0\n 2621 |         },\n 2622 |         _ => unsafe { DefWindowProcW(window, msg, wparam, lparam) },\n 2623 |     };\n 2624 | \n 2625 |     let result = userdata.event_loop_runner.catch_unwind(callback).unwrap_or(-1);\n 2626 |     if userdata_removed {\n 2627 |         drop(userdata);\n 2628 |     } else {\n 2629 |         Box::leak(userdata);\n 2630 |     }\n 2631 |     result","lines":55,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/event_loop.rs#L2577-L2631"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"easy","description":"`AnimationFrameHandler::on_animation_frame()` overwrites `self.closure` with a new `Closure` without first cancelling any outstanding `requestAnimationFrame` that was scheduled with the *old* closure:\n```rust\npub fn on_animation_frame<F>(&mut self, mut f: F) {\n    let handle = self.handle.clone();\n    self.closure = Closure::new(move || { handle.set(None); f(); })\n}\n```\n`request()` hands `self.closure.as_ref()` (a raw JS function pointer) to `request_animation_frame`. If a frame is already pending when `on_animation_frame` runs, the old `Closure` is dropped here, invalidating the wasm-bindgen function-table slot the browser still holds; when the pending frame fires it invokes a dropped closure, throwing \"closure invoked after being dropped\". The current callers only set the handler during setup (before any `request()`), so it is not hit in practice, but the API is unsound.","fix":"Cancel any pending frame before replacing the closure (mirror the guard already used in `request()`):\n```rust\npub fn on_animation_frame<F>(&mut self, mut f: F) {\n    if let Some(handle) = self.handle.take() {\n        self.window.cancel_animation_frame(handle).expect(\"Failed to cancel animation frame\");\n    }\n    let handle = self.handle.clone();\n    self.closure = Closure::new(move || { handle.set(None); f(); });\n}\n```","locations":[{"ref":"winit-web/src/web_sys/animation_frame.rs:24-33","code":"   24 |     pub fn on_animation_frame<F>(&mut self, mut f: F)\n   25 |     where\n   26 |         F: 'static + FnMut(),\n   27 |     {\n   28 |         let handle = self.handle.clone();\n   29 |         self.closure = Closure::new(move || {\n   30 |             handle.set(None);\n   31 |             f();\n   32 |         })\n   33 |     }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/web_sys/animation_frame.rs#L24-L33"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`EventLoopProxy` registers its `CFRunLoopSource` on the main run loop in `new` (`add_source`, which retains the source), but deliberately never invalidates it on `Drop` (see the comment on `invalidate`, which must be called manually and is noted as a FIXME \"Use this on macOS too\"). If no one ever calls `invalidate`, the run loop keeps the source registered and thus keeps the `Arc<F>` closure alive for the lifetime of the run loop, even after all `EventLoopProxy` clones are dropped - a leak of the source and the user closure.","fix":"Track the number of live proxies (e.g. wrap the source in an `Arc` with a `Drop` that invalidates when the last clone goes away), or expose/ensure `invalidate` is called on event loop shutdown so the source and closure are released.","locations":[{"ref":"winit-common/src/core_foundation/event_loop_proxy.rs:100-107","code":"  100 |     // FIXME(madsmtm): Use this on macOS too.\n  101 |     // More difficult there, since the user can re-start the event loop.\n  102 |     pub fn invalidate(&self) {\n  103 |         // NOTE: We do NOT fire this on `Drop`, since we want the proxy to be cloneable, such that\n  104 |         // we only need to register a single source even if there's multiple proxies in use.\n  105 |         self.source.invalidate();\n  106 |     }\n  107 | }","lines":8,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-common/src/core_foundation/event_loop_proxy.rs#L100-L107"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`DeviceInfo::get` calls `XIQueryDevice`, which allocates, then does `xconn.check_errors().ok()?` and `if info.is_null() || count == 0 { None }`. If `XIQueryDevice` returned a non-null pointer but `check_errors` reports an error (the `?` early-returns) or `count == 0`, the allocation is leaked because the `DeviceInfo` (whose `Drop` calls `XIFreeDeviceInfo`) is never constructed.","fix":"Free the pointer on every non-success path: only run `check_errors`/the empty-check after ensuring the pointer will be freed, e.g. wrap into the struct first and inspect `count`, or explicitly call `XIFreeDeviceInfo(info)` before returning `None` when `!info.is_null()`.","locations":[{"ref":"winit-x11/src/event_loop.rs:928-940","code":"  928 |     pub(crate) fn get(xconn: &'a XConnection, device: c_int) -> Option<Self> {\n  929 |         unsafe {\n  930 |             let mut count = 0;\n  931 |             let info = (xconn.xinput2.XIQueryDevice)(xconn.display, device, &mut count);\n  932 |             xconn.check_errors().ok()?;\n  933 | \n  934 |             if info.is_null() || count == 0 {\n  935 |                 None\n  936 |             } else {\n  937 |                 Some(DeviceInfo { xconn, info, count: count as usize })\n  938 |             }\n  939 |         }\n  940 |     }","lines":13,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_loop.rs#L928-L940"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `get_xim_servers`, each atom-name pointer returned by `XGetAtomNames` is only `XFree`'d after a successful `into_string()`. When `into_string()` fails, the function returns early via `.map_err(GetXimServersError::InvalidUtf8)?` before calling `(xconn.xlib.XFree)(name as _)`, leaking that name and every remaining not-yet-freed name in the list allocated by Xlib.","fix":"Free the pointer before propagating the error, e.g. convert with `let raw = unsafe { CStr::from_ptr(name) }.to_owned(); unsafe { (xconn.xlib.XFree)(name as _) }; let string = raw.into_string().map_err(GetXimServersError::InvalidUtf8)?;` so the `XFree` always runs regardless of the UTF-8 result.","locations":[{"ref":"winit-x11/src/ime/input_method.rs:191-199","code":"  191 |     let mut formatted_names = Vec::with_capacity(names.len());\n  192 |     for name in names {\n  193 |         let string = unsafe { CStr::from_ptr(name) }\n  194 |             .to_owned()\n  195 |             .into_string()\n  196 |             .map_err(GetXimServersError::InvalidUtf8)?;\n  197 |         unsafe { (xconn.xlib.XFree)(name as _) };\n  198 |         formatted_names.push(string.replace(\"@server=\", \"@im=\"));\n  199 |     }","lines":9,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/ime/input_method.rs#L191-L199"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"medium","description":"The cached `ITaskbarList`/`ITaskbarList2` COM interfaces obtained via `CoCreateInstance` in `set_skip_taskbar` / `taskbar_mark_fullscreen` are stored in thread-local `Cell`s and never `Release`d; when the thread's `ComInitialized` drops and calls `CoUninitialize`, those interface pointers are leaked. As process-lifetime singletons the practical impact is negligible, but the interfaces are never balanced with a `Release`.","fix":"Release the cached interfaces on thread teardown (e.g. from the `ComInitialized` drop), or wrap them in an RAII COM-pointer type.","locations":[{"ref":"winit-win32/src/window.rs:1758-1791","code":" 1758 | unsafe fn taskbar_mark_fullscreen(handle: HWND, fullscreen: bool) {\n 1759 |     com_initialized();\n 1760 | \n 1761 |     TASKBAR_LIST2.with(|task_bar_list2_ptr| {\n 1762 |         let mut task_bar_list2 = task_bar_list2_ptr.get();\n 1763 | \n 1764 |         if task_bar_list2.is_null() {\n 1765 |             let hr = unsafe {\n 1766 |                 CoCreateInstance(\n 1767 |                     &CLSID_TaskbarList,\n 1768 |                     ptr::null_mut(),\n 1769 |                     CLSCTX_ALL,\n 1770 |                     &IID_ITaskbarList2,\n 1771 |                     &mut task_bar_list2 as *mut _ as *mut _,\n 1772 |                 )\n 1773 |             };\n 1774 |             if hr != S_OK {\n 1775 |                 // In visual studio retrieving the taskbar list fails\n 1776 |                 return;\n 1777 |             }\n 1778 | \n 1779 |             let hr_init = unsafe { (*(*task_bar_list2).lpVtbl).parent.HrInit };\n 1780 |             if unsafe { hr_init(task_bar_list2.cast()) } != S_OK {\n 1781 |                 // In some old windows, the taskbar object could not be created, we just ignore it\n 1782 |                 return;\n 1783 |             }\n 1784 |             task_bar_list2_ptr.set(task_bar_list2)\n 1785 |         }\n 1786 | \n 1787 |         task_bar_list2 = task_bar_list2_ptr.get();\n 1788 |         let mark_fullscreen_window = unsafe { (*(*task_bar_list2).lpVtbl).MarkFullscreenWindow };\n 1789 |         unsafe { mark_fullscreen_window(task_bar_list2, handle, fullscreen.into()) };\n 1790 |     })\n 1791 | }","lines":34,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/window.rs#L1758-L1791"},{"ref":"winit-win32/src/window.rs:1793-1830","code":" 1793 | pub(crate) unsafe fn set_skip_taskbar(hwnd: HWND, skip: bool) {\n 1794 |     com_initialized();\n 1795 |     TASKBAR_LIST.with(|task_bar_list_ptr| {\n 1796 |         let mut task_bar_list = task_bar_list_ptr.get();\n 1797 | \n 1798 |         if task_bar_list.is_null() {\n 1799 |             let hr = unsafe {\n 1800 |                 CoCreateInstance(\n 1801 |                     &CLSID_TaskbarList,\n 1802 |                     ptr::null_mut(),\n 1803 |                     CLSCTX_ALL,\n 1804 |                     &IID_ITaskbarList,\n 1805 |                     &mut task_bar_list as *mut _ as *mut _,\n 1806 |                 )\n 1807 |             };\n 1808 |             if hr != S_OK {\n 1809 |                 // In visual studio retrieving the taskbar list fails\n 1810 |                 return;\n 1811 |             }\n 1812 | \n 1813 |             let hr_init = unsafe { (*(*task_bar_list).lpVtbl).HrInit };\n 1814 |             if unsafe { hr_init(task_bar_list.cast()) } != S_OK {\n 1815 |                 // In some old windows, the taskbar object could not be created, we just ignore it\n 1816 |                 return;\n 1817 |             }\n 1818 |             task_bar_list_ptr.set(task_bar_list)\n 1819 |         }\n 1820 | \n 1821 |         task_bar_list = task_bar_list_ptr.get();\n 1822 |         if skip {\n 1823 |             let delete_tab = unsafe { (*(*task_bar_list).lpVtbl).DeleteTab };\n 1824 |             unsafe { delete_tab(task_bar_list, hwnd) };\n 1825 |         } else {\n 1826 |             let add_tab = unsafe { (*(*task_bar_list).lpVtbl).AddTab };\n 1827 |             unsafe { add_tab(task_bar_list, hwnd) };\n 1828 |         }\n 1829 |     });\n 1830 | }","lines":38,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/window.rs#L1793-L1830"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`RgbaIcon::new` computes `width * height` as a `u32` multiplication before widening. With `width` and `height` being `u32`, `width * height` overflows the `u32` for large dimensions (e.g. `100_000 * 100_000`), panicking in debug builds and wrapping to a small value in release builds. A release wrap can make the `pixel_count` check pass with a wrong `width_x_height`, accepting a malformed icon (or producing a misleading error). Note the sibling code in `cursor.rs` (`CursorImage::from_rgba`) correctly widens first via `width as u64 * height as u64`.","fix":"Widen before multiplying and store a wide `width_x_height`, mirroring `CursorImage::from_rgba`:\n```rust\nlet pixel_count = rgba.len() / PIXEL_SIZE;\nlet width_x_height = width as u64 * height as u64;\nif pixel_count as u64 != width_x_height {\n    return Err(BadIcon::DimensionsVsPixelCount { width, height, width_x_height, pixel_count });\n}\n```\n(adjusting the `BadIcon::DimensionsVsPixelCount.width_x_height` field type to `u64` accordingly).","locations":[{"ref":"winit-core/src/icon.rs:70-86","code":"   70 | impl RgbaIcon {\n   71 |     pub fn new(rgba: Vec<u8>, width: u32, height: u32) -> Result<Self, BadIcon> {\n   72 |         if rgba.len() % PIXEL_SIZE != 0 {\n   73 |             return Err(BadIcon::ByteCountNotDivisibleBy4 { byte_count: rgba.len() });\n   74 |         }\n   75 |         let pixel_count = rgba.len() / PIXEL_SIZE;\n   76 |         if pixel_count != (width * height) as usize {\n   77 |             Err(BadIcon::DimensionsVsPixelCount {\n   78 |                 width,\n   79 |                 height,\n   80 |                 width_x_height: (width * height) as usize,\n   81 |                 pixel_count,\n   82 |             })\n   83 |         } else {\n   84 |             Ok(RgbaIcon { rgba, width, height })\n   85 |         }\n   86 |     }","lines":17,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/icon.rs#L70-L86"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `WinitView::handle_touches`, the `Ended | Cancelled` arm decrements the finger counter with `ivars.fingers.set(ivars.fingers.get() - 1)`. `fingers` is a `Cell<u8>`; if an `Ended`/`Cancelled` is ever delivered without a matching counted `Began` (so `fingers == 0`), this subtraction underflows - panicking in debug builds and wrapping to `255` in release, which then leaves the primary-finger bookkeeping permanently wrong.","fix":"Use a saturating decrement, e.g. `ivars.fingers.set(ivars.fingers.get().saturating_sub(1));`, and only reset `primary_finger` when the counter actually reaches zero.","locations":[{"ref":"winit-uikit/src/view.rs:603-613","code":"  603 |                 UITouchPhase::Ended | UITouchPhase::Cancelled => {\n  604 |                     let primary = if let UITouchType::Pencil = touch_type {\n  605 |                         true\n  606 |                     } else {\n  607 |                         ivars.fingers.set(ivars.fingers.get() - 1);\n  608 |                         let primary = ivars.primary_finger.get().unwrap() == finger_id;\n  609 |                         if ivars.fingers.get() == 0 {\n  610 |                             ivars.primary_finger.set(None);\n  611 |                         }\n  612 |                         primary\n  613 |                     };","lines":11,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-uikit/src/view.rs#L603-L613"}]},
