{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`GetPointerFrameInfoHistory` result counts are multiplied without overflow protection and then used to size / `set_len` a `Vec`:\n```\nlet pointer_info_count = (entries_count * pointers_count) as usize;\nlet mut pointer_infos = Vec::with_capacity(pointer_info_count);\n...\npointer_infos.set_len(pointer_info_count);\n```\n`entries_count` and `pointers_count` are `u32`; their product can overflow `u32` (debug panic; in release it wraps and understates the count). If the second `GetPointerFrameInfoHistory` call writes according to different (larger) counts than the ones used for `with_capacity`, `set_len` would then expose uninitialized/out-of-bounds memory.","fix":"Use `entries_count.checked_mul(pointers_count)` (bail out on `None`) and cast to `usize` before multiplying: `(entries_count as usize) * (pointers_count as usize)`. Re-validate the counts returned by the second call before `set_len`.","locations":[{"ref":"winit-win32/src/event_loop.rs:2151-2165","code":" 2151 |                 let pointer_info_count = (entries_count * pointers_count) as usize;\n 2152 |                 let mut pointer_infos = Vec::with_capacity(pointer_info_count);\n 2153 |                 if unsafe {\n 2154 |                     GetPointerFrameInfoHistory(\n 2155 |                         pointer_id,\n 2156 |                         &mut entries_count,\n 2157 |                         &mut pointers_count,\n 2158 |                         pointer_infos.as_mut_ptr(),\n 2159 |                     )\n 2160 |                 } == false.into()\n 2161 |                 {\n 2162 |                     result = ProcResult::Value(0);\n 2163 |                     return;\n 2164 |                 }\n 2165 |                 unsafe { pointer_infos.set_len(pointer_info_count) };","lines":15,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/event_loop.rs#L2151-L2165"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`VideoModeHandle::new` computes `NonZeroU32::new(native_video_mode.dmDisplayFrequency * 1000)` where `dmDisplayFrequency` is a `u32`. The multiply is unchecked and panics in debug (or wraps in release) if the reported frequency exceeds ~4.29 million. While normal refresh rates are tiny, `dmDisplayFrequency` is driver-supplied and the value is not validated.","fix":"Use `dmDisplayFrequency.saturating_mul(1000)` (or `checked_mul`).","locations":[{"ref":"winit-win32/src/monitor.rs:54-58","code":"   54 |         let mode = VideoMode::new(\n   55 |             (native_video_mode.dmPelsWidth, native_video_mode.dmPelsHeight).into(),\n   56 |             NonZeroU16::new(native_video_mode.dmBitsPerPel as u16),\n   57 |             NonZeroU32::new(native_video_mode.dmDisplayFrequency * 1000),\n   58 |         );","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/monitor.rs#L54-L58"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`preedit_draw_callback` computes the change range as `call_data.chg_first as usize..(call_data.chg_first + call_data.chg_length) as usize`. `chg_first` and `chg_length` are `c_int` (i32) supplied by the IME server; the addition `chg_first + chg_length` is performed in `i32` before the cast, so a malicious or buggy IME can overflow it (panic in debug builds), and a negative `chg_first` casts to a huge `usize`. The bounds check that follows only catches the oversized-`usize` case, not the arithmetic overflow.","fix":"Do the arithmetic in a wider/checked form and validate the raw inputs first, e.g. `if call_data.chg_first < 0 || call_data.chg_length < 0 { return; }` then `let end = (call_data.chg_first as usize).checked_add(call_data.chg_length as usize);` and bail if `None` or if it exceeds `client_data.text.len()`.","locations":[{"ref":"winit-x11/src/ime/context.rs:93-103","code":"   93 |     let chg_range =\n   94 |         call_data.chg_first as usize..(call_data.chg_first + call_data.chg_length) as usize;\n   95 |     if chg_range.start > client_data.text.len() || chg_range.end > client_data.text.len() {\n   96 |         tracing::warn!(\n   97 |             \"invalid chg range: buffer length={}, but chg_first={} chg_length={}\",\n   98 |             client_data.text.len(),\n   99 |             call_data.chg_first,\n  100 |             call_data.chg_length\n  101 |         );\n  102 |         return;\n  103 |     }","lines":11,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/ime/context.rs#L93-L103"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`timeout.as_millis() as usize` casts a `u128` to `usize`; on a 32-bit target (Redox supports i586) a timeout larger than ~49 days would truncate. Combined with the millisecond truncation this is only a theoretical concern, but the cast is unchecked.","fix":"Use `usize::try_from(timeout.as_millis()).unwrap_or(usize::MAX)` (or clamp) instead of `as usize`.","locations":[{"ref":"winit-orbital/src/event_loop.rs:702","code":"  702 |                     UserData::from_user_data(timeout.as_millis() as usize),","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-orbital/src/event_loop.rs#L702"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"Horizontal-wheel delta is negated as `i16` before the `as f32` cast (`-value` binds tighter than `as`): `let value = -value as f32 / WHEEL_DELTA as f32;`. If `value == i16::MIN` the `i16` negation overflows (debug panic / release wrap). The same pattern appears in raw-input horizontal-wheel handling. In practice wheel deltas are small multiples of `120`, so this is only a theoretical concern.","fix":"Cast to `f32` first, then negate: `let value = -(value as f32) / WHEEL_DELTA as f32;`.","locations":[{"ref":"winit-win32/src/event_loop.rs:1871-1872","code":" 1871 |             let value = (wparam >> 16) as i16;\n 1872 |             let value = -value as f32 / WHEEL_DELTA as f32; // NOTE: inverted! See https://github.com/rust-windowing/winit/pull/2105/","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/event_loop.rs#L1871-L1872"},{"ref":"winit-win32/src/event_loop.rs:2659-2662","code":" 2659 |         if util::has_flag(button_flags as u32, RI_MOUSE_HWHEEL) {\n 2660 |             let button_data = unsafe { mouse.Anonymous.Anonymous.usButtonData } as i16;\n 2661 |             let delta = -button_data as f32 / WHEEL_DELTA as f32;\n 2662 |             userdata.send_device_event(device_id, MouseWheel { delta: LineDelta(delta, 0.0) });","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/event_loop.rs#L2659-L2662"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `PointerHandler::on_pointer_move`, when a chorded button change occurs during a `pointermove`, the pressed/released state is computed with `event::pointer_buttons(&event).contains(ButtonsState::from_bits_retain(button))`. Here `button` is the *button index* returned by `raw_button` (`0`=left, `1`=middle, `2`=right, `3`=back, `4`=forward), but `ButtonsState::from_bits_retain` interprets that integer as a *bitmask*. The `buttons` bitmask uses `LEFT=0b1`, `RIGHT=0b10`, `MIDDLE=0b100`, ... so the index and the mask do not line up. Concretely: `button==0` (left) yields `from_bits_retain(0)` = empty, and `empty_set.contains(empty)` is always `true`, so releasing the left button while another is held is reported as `ElementState::Pressed`. `button==1` (middle) checks the `LEFT` bit instead of the `MIDDLE` bit, etc. The state is therefore wrong for every button except right (which coincidentally maps `2`->`0b10`).","fix":"Map the button *index* to its `ButtonsState` bit before testing membership instead of calling `ButtonsState::from_bits_retain(button)`. For example add a helper `fn button_index_to_mask(button: u16) -> ButtonsState` returning `LEFT` for `0`, `MIDDLE` for `1`, `RIGHT` for `2`, `BACK` for `3`, `FORWARD` for `4`, then use `event::pointer_buttons(&event).contains(button_index_to_mask(button))`.","locations":[{"ref":"winit-web/src/web_sys/pointer.rs:210-216","code":"  210 |                     let state = if event::pointer_buttons(&event)\n  211 |                         .contains(ButtonsState::from_bits_retain(button))\n  212 |                     {\n  213 |                         ElementState::Pressed\n  214 |                     } else {\n  215 |                         ElementState::Released\n  216 |                     };","lines":7,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/web_sys/pointer.rs#L210-L216"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The X11 drag-and-drop `DragState` is never cleared. `Dnd::init_state` uses `self.state.get_or_insert(..)`, which returns the *existing* state and silently discards the new `version`, `source_window`, `types` and freshly-allocated `transfer_id` whenever a `DragState` is already present. No handler ever resets `Dnd::state` back to `None`: `XdndLeave` only emits `DragLeft`, and `XdndDrop` / `send_finished` leave the state in place. As a result the first drag works, but every subsequent drag reuses the stale `source_window`, `types` and `transfer_id` from the first drag, so `DragEntered` reports the wrong transfer id and data fetches target the wrong window.","fix":"Reset the state at the end of a drag: set `self.state = None` in the `XdndLeave` handler and after `send_finished` succeeds in the `XdndDrop` path (and in `selection_notify` once the last pending fetch finishes). Change `init_state` to overwrite unconditionally (`self.state = Some(DragState { .. }); self.state.as_ref().unwrap()`) so a new `XdndEnter` always starts fresh.","locations":[{"ref":"winit-x11/src/dnd.rs:255-269","code":"  255 |     pub fn init_state(\n  256 |         &mut self,\n  257 |         version: c_long,\n  258 |         source_window: xproto::Window,\n  259 |         target_window: xproto::Window,\n  260 |         types: Arc<[SelectionType]>,\n  261 |     ) -> &DragState {\n  262 |         self.state.get_or_insert(DragState {\n  263 |             version,\n  264 |             types,\n  265 |             source_window,\n  266 |             target_window,\n  267 |             ..Default::default()\n  268 |         })\n  269 |     }","lines":15,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/dnd.rs#L255-L269"},{"ref":"winit-x11/src/event_processor.rs:584-592","code":"  584 |         if xev.message_type == atoms[XdndLeave] as c_ulong {\n  585 |             let dnd = self.target.dnd.borrow();\n  586 |             let Some(state) = dnd.state() else {\n  587 |                 return;\n  588 |             };\n  589 |             app.window_event(&self.target, window_id, WindowEvent::DragLeft {\n  590 |                 id: state.transfer_id,\n  591 |             });\n  592 |         }","lines":9,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L584-L592"},{"ref":"winit-x11/src/event_processor.rs:540-582","code":"  540 |         if xev.message_type == atoms[XdndDrop] as c_ulong {\n  541 |             let (source_window, transfer_id) = {\n  542 |                 let dnd = self.target.dnd.borrow();\n  543 |                 let Some(state) = dnd.state() else {\n  544 |                     warn!(\"Received `XdndDrop` without `XdndEnter`\");\n  545 |                     return;\n  546 |                 };\n  547 |                 let source_window = state.source_window;\n  548 | \n  549 |                 (source_window, state.transfer_id)\n  550 |             };\n  551 | \n  552 |             app.window_event(\n  553 |                 &self.target,\n  554 |                 window_id,\n  555 |                 // TODO\n  556 |                 WindowEvent::DragDropped {\n  557 |                     id: transfer_id,\n  558 |                     // `Copy` is the default. Other actions are possible in X11, but the\n  559 |                     // specification does not properly explain how to implement\n  560 |                     // them (only giving a vague description of `XdndMove`). For\n  561 |                     // simplicity's sake, we simply do not implement non-copy drag\n  562 |                     // on X11.\n  563 |                     // See https://www.freedesktop.org/wiki/Specifications/XDND/\n  564 |                     proposed_action: Some(DndAction::Copy),\n  565 |                 },\n  566 |             );\n  567 | \n  568 |             let mut dnd = self.target.dnd.borrow_mut();\n  569 | \n  570 |             if let Some(state) =\n  571 |                 dnd.state_mut().filter(|state| !state.pending_fetch_types.is_empty())\n  572 |             {\n  573 |                 state.finished = Some((window, source_window));\n  574 |             } else {\n  575 |                 unsafe {\n  576 |                     dnd.send_finished(window, source_window)\n  577 |                         .expect(\"Failed to send `XdndFinished` message.\");\n  578 |                 }\n  579 |             }\n  580 | \n  581 |             return;\n  582 |         }","lines":43,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L540-L582"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `MainEvent::ConfigChanged` handler computes `old_scale_factor` and `scale_factor` from two back-to-back calls to `scale_factor(&self.android_app)`, so they are always identical. The guard `(scale_factor - old_scale_factor).abs() < f64::EPSILON` is therefore always true, and the condition is also inverted relative to intent (a change should fire when the values differ, i.e. `>= f64::EPSILON`). No previous scale factor is persisted anywhere, so real scale-factor changes can never be detected and a `ScaleFactorChanged` event is emitted on every single config change regardless of whether the scale factor actually changed.","fix":"Store the last-seen scale factor on `EventLoop` (a field), and in `ConfigChanged` compare the freshly computed `scale_factor` against the stored previous value, firing `ScaleFactorChanged` only when `(new - old).abs() >= f64::EPSILON`, then update the stored value.","locations":[{"ref":"winit-android/src/event_loop.rs:209-223","code":"  209 |                 MainEvent::ConfigChanged { .. } => {\n  210 |                     let old_scale_factor = scale_factor(&self.android_app);\n  211 |                     let scale_factor = scale_factor(&self.android_app);\n  212 |                     if (scale_factor - old_scale_factor).abs() < f64::EPSILON {\n  213 |                         let new_surface_size = Arc::new(Mutex::new(screen_size(&self.android_app)));\n  214 |                         let event = event::WindowEvent::ScaleFactorChanged {\n  215 |                             surface_size_writer: SurfaceSizeWriter::new(Arc::downgrade(\n  216 |                                 &new_surface_size,\n  217 |                             )),\n  218 |                             scale_factor,\n  219 |                         };\n  220 | \n  221 |                         app.window_event(&self.window_target, GLOBAL_WINDOW, event);\n  222 |                     }\n  223 |                 },","lines":15,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-android/src/event_loop.rs#L209-L223"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Refresh-rate computation from the `CVDisplayLink` nominal output period does integer division *before* scaling to millihertz, discarding the fractional part of the rate. The period is `timeValue / timeScale` seconds, so the rate in millihertz is `timeScale * 1000 / timeValue`, but the code computes `(timeScale / timeValue) * 1000`. For any non-integer refresh rate (e.g. 59.94 Hz with `timeScale = 60000`, `timeValue = 1001`) this yields `59 * 1000 = 59000` mHz instead of the correct `59940` mHz. Displays reporting fractional rates get a truncated value.","fix":"Multiply before dividing:\n```rust\n(time.timeScale as i64 * 1000)\n    .checked_div(time.timeValue)\n    .map(|v| v as u32)\n    .and_then(NonZeroU32::new)\n```","locations":[{"ref":"winit-appkit/src/monitor.rs:359-362","code":"  359 |     (time.timeScale as i64)\n  360 |         .checked_div(time.timeValue)\n  361 |         .map(|v| (v * 1000) as u32)\n  362 |         .and_then(NonZeroU32::new)","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/monitor.rs#L359-L362"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Force::normalized` divides by `altitude.sin()` when converting the axial force to a perpendicular force: `force / altitude.sin()`. The docs state the reported force is measured \"along the axis of the pencil\" and `altitude` is the angle between the tool and the surface plane (`0` = parallel, `π/2` = perpendicular). The component of an axial force that is perpendicular to the surface is `force * sin(altitude)`, not `force / sin(altitude)`. The current formula blows up toward infinity as the tool approaches parallel (`altitude → 0`) instead of going to zero. The unit test `test_force_normalize` only exercises `altitude = π/2` (where `sin = 1`), so it cannot distinguish `*` from `/`.","fix":"Multiply by `sin(altitude)` instead of dividing:\n```rust\nSome(TabletToolAngle { altitude, .. }) => force * altitude.sin(),\n```","locations":[{"ref":"winit-core/src/event.rs:1164-1176","code":" 1164 |     pub fn normalized(&self, angle: Option<TabletToolAngle>) -> f64 {\n 1165 |         match self {\n 1166 |             Force::Calibrated { force, max_possible_force } => {\n 1167 |                 let force = match angle {\n 1168 |                     Some(TabletToolAngle { altitude, .. }) => force / altitude.sin(),\n 1169 |                     None => *force,\n 1170 |                 };\n 1171 |                 force / max_possible_force\n 1172 |             },\n 1173 |             Force::Normalized(force) => *force,\n 1174 |         }\n 1175 |     }\n 1176 | }","lines":13,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/event.rs#L1164-L1176"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`TabletToolAngle::default()` sets `altitude` to `f64::consts::FRAC_2_PI` (which is `2/π ≈ 0.6366` rad ≈ 36.5°), but the field documentation explicitly states that the default altitude is `π/2` (perpendicular to the surface): \"`π/2` means the tool is perpendicular to the surface and is the default.\" The correct constant is `f64::consts::FRAC_PI_2` (`π/2 ≈ 1.5708`). This is almost certainly a copy/typo error (`FRAC_2_PI` vs `FRAC_PI_2`). Any code relying on `TabletToolAngle::default()` will get a tool tilted ~36° instead of perpendicular.","fix":"Replace `f64::consts::FRAC_2_PI` with `f64::consts::FRAC_PI_2`:\n```rust\nimpl Default for TabletToolAngle {\n    fn default() -> Self {\n        Self { altitude: f64::consts::FRAC_PI_2, azimuth: 0. }\n    }\n}\n```","locations":[{"ref":"winit-core/src/event.rs:1382-1386","code":" 1382 | impl Default for TabletToolAngle {\n 1383 |     fn default() -> Self {\n 1384 |         Self { altitude: f64::consts::FRAC_2_PI, azimuth: 0. }\n 1385 |     }\n 1386 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/event.rs#L1382-L1386"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Window::set_decorations()` on Wayland does not wake the event loop after mutating decoration state, unlike every other double-buffered setter in the same file. `WindowState::set_decorate()` changes the decoration mode (`request_decoration_mode`), hides/shows the CSD frame and calls `resize()` (which issues `set_window_geometry` / viewport requests). These are buffered protocol requests that need the loop to be woken to be flushed/committed. Compare `set_blur()`, `set_resizable()`, `set_min_surface_size()` and `set_max_surface_size()`, which all call `self.request_redraw()` with a `// NOTE: Requires commit to be applied.` comment. As a result, toggling decorations may not take visible effect until the next unrelated event.","fix":"Make `set_decorate()` report whether it changed anything (like `set_resizable`/`set_blur`) and request a redraw when it did, or unconditionally call `self.request_redraw()` after `set_decorate()`:\n```rust\nfn set_decorations(&self, decorate: bool) {\n    self.window_state.lock().unwrap().set_decorate(decorate);\n    self.request_redraw();\n}\n```","locations":[{"ref":"winit-wayland/src/window/mod.rs:502-505","code":"  502 |     #[inline]\n  503 |     fn set_decorations(&self, decorate: bool) {\n  504 |         self.window_state.lock().unwrap().set_decorate(decorate)\n  505 |     }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/window/mod.rs#L502-L505"},{"ref":"winit-wayland/src/window/mod.rs:495-500","code":"  495 |     #[inline]\n  496 |     fn set_blur(&self, blur: bool) {\n  497 |         if self.window_state.lock().unwrap().set_blur(blur) {\n  498 |             self.request_redraw();\n  499 |         }\n  500 |     }","lines":6,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/window/mod.rs#L495-L500"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Event::BufferedScaleFactorChanged` dispatch dereferences the window userdata pointer without a null check:\n```\nlet window_flags = unsafe {\n    let userdata = get_window_long(window, GWL_USERDATA) as *mut WindowData;\n    (*userdata).window_state_lock().window_flags\n};\n```\nA `ScaleFactorChanged` event can be buffered (when the runner is re-entrant) and dispatched later from `dispatch_buffered_events`. If the target window was destroyed in the meantime, `GWL_USERDATA` is `0` (`WM_NCDESTROY` sets it to `0`) and `(*userdata)` dereferences a null pointer -> UB / crash.","fix":"Check the pointer before dereferencing:\n```\nlet userdata = get_window_long(window, GWL_USERDATA) as *mut WindowData;\nif userdata.is_null() { return; }\nlet window_flags = (*userdata).window_state_lock().window_flags;\n```","locations":[{"ref":"winit-win32/src/event_loop/runner.rs:614-621","code":"  614 |                 if surface_size != new_surface_size {\n  615 |                     let window_flags = unsafe {\n  616 |                         let userdata = get_window_long(window, GWL_USERDATA) as *mut WindowData;\n  617 |                         (*userdata).window_state_lock().window_flags\n  618 |                     };\n  619 | \n  620 |                     window_flags.set_size(window, surface_size);\n  621 |                 }","lines":8,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/event_loop/runner.rs#L614-L621"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The no-backend error branch in `EventLoop::new` builds diagnostic messages whose leading clauses are swapped relative to the conditions that select them, producing misleading errors. In the branch `if wayland_display && !cfg!(wayland_platform)` (Wayland *is* present in the environment but the `wayland` feature is disabled) the message text is `\"DISPLAY is not set; note: enable the `winit/wayland` feature to support Wayland\"` - the \"DISPLAY is not set\" clause describes the X11 variable being absent, which is unrelated to and contradicts the actual condition (a non-empty `WAYLAND_DISPLAY`/`WAYLAND_SOCKET` was detected). Symmetrically, the branch `else if x11_display && !cfg!(x11_platform)` emits `\"neither WAYLAND_DISPLAY nor WAYLAND_SOCKET is set; note: enable the `winit/x11` feature to support X11\"`, describing the Wayland variables being absent even though the condition fired because `DISPLAY` *was* set. A user who built winit without the matching feature gets an error that flatly denies the env var they actually have set.","fix":"Rewrite each message so its body matches its own condition, e.g.:\n```rust\nlet msg = if wayland_display && !cfg!(wayland_platform) {\n    \"WAYLAND_DISPLAY/WAYLAND_SOCKET is set; note: enable the `winit/wayland` feature to support Wayland\"\n} else if x11_display && !cfg!(x11_platform) {\n    \"DISPLAY is set; note: enable the `winit/x11` feature to support X11\"\n} else {\n    \"neither WAYLAND_DISPLAY nor WAYLAND_SOCKET nor DISPLAY is set.\"\n};\n```","locations":[{"ref":"winit/src/platform_impl/linux/mod.rs:110-121","code":"  110 |             (_, wayland_display, x11_display) => {\n  111 |                 let msg = if wayland_display && !cfg!(wayland_platform) {\n  112 |                     \"DISPLAY is not set; note: enable the `winit/wayland` feature to support \\\n  113 |                      Wayland\"\n  114 |                 } else if x11_display && !cfg!(x11_platform) {\n  115 |                     \"neither WAYLAND_DISPLAY nor WAYLAND_SOCKET is set; note: enable the \\\n  116 |                      `winit/x11` feature to support X11\"\n  117 |                 } else {\n  118 |                     \"neither WAYLAND_DISPLAY nor WAYLAND_SOCKET nor DISPLAY is set.\"\n  119 |                 };\n  120 |                 return Err(NotSupportedError::new(msg).into());\n  121 |             },","lines":12,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit/src/platform_impl/linux/mod.rs#L110-L121"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`ImeSurroundingText::new` rejects text with `if text.len() < 4000 { text } else { return Err(TextTooLong) }`. The public constant `MAX_TEXT_BYTES = 4000` and the docs say the text \"must be limited to 4000 bytes\", but `< 4000` rejects a valid exactly-4000-byte string (off-by-one). The check also hardcodes `4000` instead of referencing `Self::MAX_TEXT_BYTES`, so the two can drift.","fix":"Use `if text.len() <= Self::MAX_TEXT_BYTES { text } else { return Err(ImeSurroundingTextError::TextTooLong) }`.","locations":[{"ref":"winit-core/src/window.rs:1964-1968","code":" 1964 |         let text = if text.len() < 4000 {\n 1965 |             text\n 1966 |         } else {\n 1967 |             return Err(ImeSurroundingTextError::TextTooLong);\n 1968 |         };","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/window.rs#L1964-L1968"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`refresh_rate_millihertz` (UIKit monitor) reads `UIScreen::maximumFramesPerSecond()` (a value in frames-per-second, i.e. hertz) and computes `NonZeroU32::new(refresh_rate_millihertz as u32 * 1000)`. Naming aside the arithmetic happens to give the right hertz->millihertz conversion (60 fps -> 60000 mHz), but the intermediate binding is misleadingly named `refresh_rate_millihertz` while holding a value in hertz, and `as u32 * 1000` can overflow/wrap for pathological refresh values (and a negative `NSInteger`, though unexpected, would wrap when cast `as u32`).","fix":"Rename the intermediate to `refresh_rate_hertz`, and compute with a checked multiply, e.g. `u32::try_from(refresh_rate).ok().and_then(|hz| hz.checked_mul(1000)).and_then(NonZeroU32::new)`.","locations":[{"ref":"winit-uikit/src/monitor.rs:226-249","code":"  226 | fn refresh_rate_millihertz(uiscreen: &UIScreen) -> Option<NonZeroU32> {\n  227 |     let refresh_rate_millihertz: NSInteger = {\n  228 |         if available!(ios = 10.3, tvos = 10.2) {\n  229 |             uiscreen.maximumFramesPerSecond()\n  230 |         } else {\n  231 |             // https://developer.apple.com/library/archive/technotes/tn2460/_index.html\n  232 |             // https://en.wikipedia.org/wiki/IPad_Pro#Model_comparison\n  233 |             //\n  234 |             // All iOS devices support 60 fps, and on devices where `maximumFramesPerSecond` is not\n  235 |             // supported, they are all guaranteed to have 60hz refresh rates. This does not\n  236 |             // correctly handle external displays. ProMotion displays support 120fps, but they were\n  237 |             // introduced at the same time as the `maximumFramesPerSecond` API.\n  238 |             //\n  239 |             // FIXME: earlier OSs could calculate the refresh rate using\n  240 |             // `-[CADisplayLink duration]`.\n  241 |             tracing::warn!(\n  242 |                 \"`maximumFramesPerSecond` requires iOS 10.3+ or tvOS 10.2+. Defaulting to 60 fps\"\n  243 |             );\n  244 |             60\n  245 |         }\n  246 |     };\n  247 | \n  248 |     NonZeroU32::new(refresh_rate_millihertz as u32 * 1000)\n  249 | }","lines":24,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-uikit/src/monitor.rs#L226-L249"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`TouchHandler::cancel` iterates `seat_state.touch_map.drain()` and, if a window for a touch point is missing, executes `return` instead of `continue`:\n```\nlet scale_factor = match self.windows.get_mut().get(&window_id) {\n    Some(window) => window.lock().unwrap().scale_factor(),\n    None => return,\n};\n```\nA single missing window aborts the whole cancel loop: remaining touch points get no `PointerLeft` event, and the trailing `seat_state.first_touch_id = None;` reset is skipped, leaving stale primary-finger state on the seat.","fix":"Use `continue` instead of `return` inside the loop so other touch points are still processed, and ensure `first_touch_id` is reset regardless (it already is, once the early `return` is removed).","locations":[{"ref":"winit-wayland/src/seat/touch/mod.rs:195-217","code":"  195 |         for (id, touch_point) in seat_state.touch_map.drain() {\n  196 |             let window_id = crate::make_wid(&touch_point.surface);\n  197 |             let scale_factor = match self.windows.get_mut().get(&window_id) {\n  198 |                 Some(window) => window.lock().unwrap().scale_factor(),\n  199 |                 None => return,\n  200 |             };\n  201 | \n  202 |             let primary = seat_state.first_touch_id == Some(id);\n  203 |             let position = touch_point.location.to_physical(scale_factor);\n  204 | \n  205 |             self.events_sink.push_window_event(\n  206 |                 WindowEvent::PointerLeft {\n  207 |                     device_id: None,\n  208 |                     primary,\n  209 |                     position: Some(position),\n  210 |                     kind: PointerKind::Touch(FingerId::from_raw(id as usize)),\n  211 |                 },\n  212 |                 window_id,\n  213 |             );\n  214 |         }\n  215 | \n  216 |         seat_state.first_touch_id = None;\n  217 |     }","lines":23,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/seat/touch/mod.rs#L195-L217"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Tablet tilt is converted with a truncating cast from `f64` degrees to `i8`:\n```\ndata.tool_state.tilt = Some(TabletToolTilt { x: tilt_x as i8, y: tilt_y as i8 });\n```\n`tilt_x`/`tilt_y` are fractional degrees. `as i8` truncates toward zero (e.g. `45.9 -> 45`, `-0.7 -> 0`), which is inconsistent with `winit_core`'s own conversion (`x.to_degrees().round() as i8`) and drops up to ~1 degree of precision on every event. (The similar `degrees as u16` for `twist` on line 167 has the same truncation-vs-round issue.)","fix":"Round before casting, e.g. `x: tilt_x.round() as i8, y: tilt_y.round() as i8` and `degrees.round() as u16`.","locations":[{"ref":"winit-wayland/src/types/wp_tablet_input_v2.rs:140-142","code":"  140 |             ToolEvent::Tilt { tilt_x, tilt_y } => {\n  141 |                 data.tool_state.tilt = Some(TabletToolTilt { x: tilt_x as i8, y: tilt_y as i8 });\n  142 |             },","lines":3,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/types/wp_tablet_input_v2.rs#L140-L142"},{"ref":"winit-wayland/src/types/wp_tablet_input_v2.rs:150-152","code":"  150 |             ToolEvent::Rotation { degrees } => {\n  151 |                 data.tool_state.twist = Some(degrees as u16);\n  152 |             },","lines":3,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/types/wp_tablet_input_v2.rs#L150-L152"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`PartialEq` and `Hash` for `PlatformSpecificEventLoopAttributes` compare/hash the address of a local binding rather than the closure. In `eq`, the arm `(Some(this), Some(other)) => std::ptr::eq(&this, &other)` takes `&this`/`&other` which are addresses of the match's local `&Box<...>` bindings (distinct stack slots), so `ptr::eq` is effectively always `false` even for the same hook. `hash` similarly does `std::ptr::hash(&self.msg_hook, state)`, hashing the address of the `msg_hook` field within `self` (position-dependent) instead of the pointed-to closure, so two logically-equal values hash differently, breaking the `Eq`/`Hash` contract.","fix":"Compare the underlying `Box` data pointers, e.g. `std::ptr::eq(this.as_ref() as *const _ as *const (), other.as_ref() as *const _ as *const ())` (comparing the fat-pointer data halves), and hash the same pointer value in `hash`. Or, since comparing closures is inherently dubious, drop `msg_hook` from the `Eq`/`Hash` consideration entirely and document it.","locations":[{"ref":"winit-win32/src/event_loop.rs:187-207","code":"  187 | impl PartialEq for PlatformSpecificEventLoopAttributes {\n  188 |     fn eq(&self, other: &Self) -> bool {\n  189 |         self.any_thread.eq(&other.any_thread)\n  190 |             && self.dpi_aware.eq(&other.dpi_aware)\n  191 |             && match (&self.msg_hook, &other.msg_hook) {\n  192 |                 (Some(this), Some(other)) => std::ptr::eq(&this, &other),\n  193 |                 (None, None) => true,\n  194 |                 _ => false,\n  195 |             }\n  196 |     }\n  197 | }\n  198 | \n  199 | impl Eq for PlatformSpecificEventLoopAttributes {}\n  200 | \n  201 | impl std::hash::Hash for PlatformSpecificEventLoopAttributes {\n  202 |     fn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n  203 |         self.any_thread.hash(state);\n  204 |         self.dpi_aware.hash(state);\n  205 |         std::ptr::hash(&self.msg_hook, state);\n  206 |     }\n  207 | }","lines":21,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/event_loop.rs#L187-L207"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`get_raw_input_device_list` sizes the buffer from the first `GetRawInputDeviceList` call (`num_devices`), then after the second call sets `buffer.set_len(num_devices as _)` even though the authoritative count actually written is the second call's return value `num_stored`. The equality is only a `debug_assert_eq!`; if the device count shrank between the two calls, `set_len(num_devices)` exposes uninitialized `RAWINPUTDEVICELIST` entries in release builds (UB). The function is currently `#[allow(dead_code)]` but the bug is latent.","fix":"Set the length from the actually-written count: `buffer.set_len(num_stored as _)`.","locations":[{"ref":"winit-win32/src/raw_input.rs:41-54","code":"   41 |     let mut buffer = Vec::with_capacity(num_devices as _);\n   42 | \n   43 |     let num_stored =\n   44 |         unsafe { GetRawInputDeviceList(buffer.as_mut_ptr(), &mut num_devices, list_size) };\n   45 | \n   46 |     if num_stored == u32::MAX {\n   47 |         return None;\n   48 |     }\n   49 | \n   50 |     debug_assert_eq!(num_devices, num_stored);\n   51 | \n   52 |     unsafe { buffer.set_len(num_devices as _) };\n   53 | \n   54 |     Some(buffer)","lines":14,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/raw_input.rs#L41-L54"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Window::is_visible` returns `Some(IsWindowVisible(hwnd) == 1)`. `IsWindowVisible` returns a `BOOL` that is documented only as non-zero/zero; comparing `== 1` can incorrectly report `false` if the API returns any other non-zero value.","fix":"Compare against zero: `IsWindowVisible(self.window.hwnd()) != 0`.","locations":[{"ref":"winit-win32/src/window.rs:522-524","code":"  522 |     fn is_visible(&self) -> Option<bool> {\n  523 |         Some(unsafe { IsWindowVisible(self.window.hwnd()) == 1 })\n  524 |     }","lines":3,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/window.rs#L522-L524"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `XdndEnter` handler `has_more_types` is computed as `flags - (flags & (c_long::MAX - 1)) == 1`. This is an obscure way to extract bit 0 that also masks off the sign bit, so it only yields the correct result for non-negative `flags`; for a `flags` value with the high bit set the arithmetic is wrong. The spec bit being tested is simply bit 0.","fix":"Replace with `let has_more_types = flags & 1 == 1;`.","locations":[{"ref":"winit-x11/src/event_processor.rs:439-441","code":"  439 |                 let version = flags >> 24;\n  440 | \n  441 |                 let has_more_types = flags - (flags & (c_long::MAX - 1)) == 1;","lines":3,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L439-L441"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Pixel::to_packed_argb` builds the packed CARDINAL by writing the bytes `b, g, r, a` into byte offsets `0..3` of a `Cardinal` (u32) and returning the integer. This yields the correct ARGB numeric value (`0xAARRGGBB`) only on little-endian hosts; on a big-endian host the same byte writes produce `0xBBGGRRAA`, so `_NET_WM_ICON` would receive garbled colors. Unlike the custom-cursor path (`util/cursor.rs`, which consults `needs_endian_swap()`), the icon path has no endianness handling. Additionally `assert_eq!(pixel_count, (icon.width() * icon.height()) as usize)` performs a `u32 * u32` multiply that can overflow (panicking in debug) for very large icons.","fix":"Construct the value arithmetically rather than via byte writes: `((self.a as u32) << 24) | ((self.r as u32) << 16) | ((self.g as u32) << 8) | (self.b as u32)`, which is endianness-independent. For the assert, compute the product as `u64` (`icon.width() as u64 * icon.height() as u64`).","locations":[{"ref":"winit-x11/src/util/icon.rs:18-31","code":"   18 | impl Pixel {\n   19 |     pub fn to_packed_argb(&self) -> Cardinal {\n   20 |         let mut cardinal = 0;\n   21 |         assert!(CARDINAL_SIZE >= PIXEL_SIZE);\n   22 |         let as_bytes = &mut cardinal as *mut _ as *mut u8;\n   23 |         unsafe {\n   24 |             *as_bytes.offset(0) = self.b;\n   25 |             *as_bytes.offset(1) = self.g;\n   26 |             *as_bytes.offset(2) = self.r;\n   27 |             *as_bytes.offset(3) = self.a;\n   28 |         }\n   29 |         cardinal\n   30 |     }\n   31 | }","lines":14,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/util/icon.rs#L18-L31"},{"ref":"winit-x11/src/util/icon.rs:36","code":"   36 |     assert_eq!(pixel_count, (icon.width() * icon.height()) as usize);","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/util/icon.rs#L36"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`lookup_utf8`'s buffer-overflow branch reuses the byte count from the *first* `Xutf8LookupString` call for `vec.set_len(count as usize)` and the returned slice, only `debug_assert_eq!`-ing that the second call agreed. In a release build, if the second call returns fewer bytes (`new_count < count`), `set_len(count)` exposes the uninitialized tail of the `Vec`, and the returned slice includes uninitialized bytes (which then feed `str::from_utf8`).","fix":"Use the second call's `new_count` for the length: `unsafe { vec.set_len(new_count as usize) }; &vec[..new_count as usize]`, and treat a negative `new_count` as empty.","locations":[{"ref":"winit-x11/src/util/input.rs:92-102","code":"   92 |         let bytes = if status == ffi::XBufferOverflow {\n   93 |             vec = Vec::with_capacity(count as usize);\n   94 |             let (_, _, new_count) =\n   95 |                 self.lookup_utf8_inner(ic, key_event, vec.as_mut_ptr(), vec.capacity());\n   96 |             debug_assert_eq!(count, new_count);\n   97 | \n   98 |             unsafe { vec.set_len(count as usize) };\n   99 |             &vec[..count as usize]\n  100 |         } else {\n  101 |             unsafe { slice::from_raw_parts(buffer.as_ptr() as *const u8, count as usize) }\n  102 |         };","lines":11,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/util/input.rs#L92-L102"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`set_theme_inner` maps `None` (no preferred theme / follow the system default) to the string `\"dark\"` for the `_GTK_THEME_VARIANT` property. This means calling `set_theme(None)` forcibly switches the window to dark mode rather than clearing the override / reverting to the desktop default - the opposite of the documented \"no preference\" semantics.","fix":"Handle `None` distinctly: either delete the `_GTK_THEME_VARIANT` property (via `delete_property`) so the GTK/WM default applies, or default to `\"light\"` if a value must be written. Do not silently force `\"dark\"`.","locations":[{"ref":"winit-x11/src/window.rs:984-997","code":"  984 |         let variant = match theme {\n  985 |             Some(Theme::Dark) => \"dark\",\n  986 |             Some(Theme::Light) => \"light\",\n  987 |             None => \"dark\",\n  988 |         };\n  989 |         let variant = CString::new(variant).expect(\"`_GTK_THEME_VARIANT` contained null byte\");\n  990 |         self.xconn.change_property(\n  991 |             self.xwindow,\n  992 |             hint_atom,\n  993 |             utf8_atom,\n  994 |             xproto::PropMode::REPLACE,\n  995 |             variant.as_bytes(),\n  996 |         )\n  997 |     }","lines":14,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/window.rs#L984-L997"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_main_thread` on NetBSD relies on the main thread being named `\"main\"` (`std::thread::current().name() == Some(\"main\")`). This is a brittle heuristic: the Rust runtime does name the initial thread `\"main\"`, but this is not a guaranteed/stable contract, and any embedding that renames the thread or enters winit from an FFI-created thread will make the main-thread panic guard either misfire or fail to fire. Unlike the Linux (`gettid == getpid`) and other-BSD (`pthread_main_np`) paths, this one queries a cosmetic label rather than a real OS thread identity.","fix":"Use a real OS-level main-thread check on NetBSD, e.g. `_lwp_self()` compared against the process's initial LWP, or `pthread_main_np()` if available in the target's libc, instead of matching the thread name string.","locations":[{"ref":"winit/src/platform_impl/linux/mod.rs:233-236","code":"  233 | #[cfg(target_os = \"netbsd\")]\n  234 | fn is_main_thread() -> bool {\n  235 |     std::thread::current().name() == Some(\"main\")\n  236 | }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit/src/platform_impl/linux/mod.rs#L233-L236"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"In `Setting::parse` for `SettingType::Color`, the four `i16` channels are destructured as `(red, blue, green, alpha)` in wire order and stored as `[red, blue, green, alpha]`. Per the XSETTINGS spec the on-the-wire order is red, green, blue, alpha, so the variable named `blue` actually holds the green channel and vice versa. The stored array happens to preserve raw wire order, so nothing breaks today only because `SettingData::Color` is unused (`#[allow(dead_code)]`), but the naming is misleading and will bite anyone who starts consuming it.","fix":"Rename to match the wire order: `let (red, green, blue, alpha) = (parser.i16()?, parser.i16()?, parser.i16()?, parser.i16()?); SettingData::Color([red, green, blue, alpha])`.","locations":[{"ref":"winit-x11/src/xsettings.rs:121-127","code":"  121 |             SettingType::Color => {\n  122 |                 // Read i16's of color.\n  123 |                 let (red, blue, green, alpha) =\n  124 |                     (parser.i16()?, parser.i16()?, parser.i16()?, parser.i16()?);\n  125 | \n  126 |                 SettingData::Color([red, blue, green, alpha])\n  127 |             },","lines":7,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/xsettings.rs#L121-L127"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The associated constants `MAX`, `MIN` and `ZERO` on `impl<P> PhysicalUnit<P>` are declared with type `LogicalUnit<f64>` and built with `LogicalUnit::new(...)`, copy-pasted verbatim from the `LogicalUnit` impl above. As a result `PhysicalUnit::<P>::MAX`/`MIN`/`ZERO` actually yield `LogicalUnit` values, not `PhysicalUnit` values, which is a type-confusing API bug for anyone using these constants.","fix":"Change the three constants to the physical type, e.g. `pub const MAX: PhysicalUnit<f64> = PhysicalUnit::new(f64::MAX);`, `pub const MIN: PhysicalUnit<f64> = PhysicalUnit::new(f64::MIN);`, `pub const ZERO: PhysicalUnit<f64> = PhysicalUnit::new(0.0);`.","locations":[{"ref":"dpi/src/lib.rs:228-234","code":"  228 | impl<P> PhysicalUnit<P> {\n  229 |     /// Represents a maximum physical unit that is equal to [`f64::MAX`].\n  230 |     pub const MAX: LogicalUnit<f64> = LogicalUnit::new(f64::MAX);\n  231 |     /// Represents a minimum physical unit of [`f64::MAX`].\n  232 |     pub const MIN: LogicalUnit<f64> = LogicalUnit::new(f64::MIN);\n  233 |     /// Represents a physical unit of `0_f64`.\n  234 |     pub const ZERO: LogicalUnit<f64> = LogicalUnit::new(0.0);","lines":7,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/dpi/src/lib.rs#L228-L234"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`MainRunLoop::remove_observer` calls `self.main_run_loop.add_observer(...)` instead of a removal function. This is a copy-paste of the body of `add_observer` (the comment even says \"Same as in `add_observer`\"). As written, calling `remove_observer` *adds* the observer a second time rather than removing it, leaving a duplicate registration on the main run loop (so the observer callback fires twice and is never actually removed). The only reason this does not currently break every consumer is that `MainRunLoopObserver::drop` independently calls `self.observer.invalidate()`, so the leftover registration is neutralized on drop.","fix":"Call the corresponding removal API, e.g. `self.main_run_loop.remove_observer(Some(&observer.observer), Some(mode))` (the `CFRunLoop` `removeObserver` wrapper), instead of `add_observer`.","locations":[{"ref":"winit-common/src/core_foundation/main_run_loop.rs:132-135","code":"  132 |     pub fn remove_observer(&self, observer: &MainRunLoopObserver, mode: &CFRunLoopMode) {\n  133 |         // Same as in `add_observer`, accessing the main loop's observer is fine.\n  134 |         self.main_run_loop.add_observer(Some(&observer.observer), Some(mode));\n  135 |     }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-common/src/core_foundation/main_run_loop.rs#L132-L135"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `WinitView::pinch_gesture`, the `Cancelled | Failed` arm resets the wrong ivar: it calls `self.ivars().rotation_last_delta.set(0.0)` instead of `self.ivars().pinch_last_delta.set(0.0)`. This is a copy-paste from `rotation_gesture`. Two real consequences: (1) `pinch_last_delta` is left holding a stale scale value after a pinch is cancelled (harmless in practice because the next `Began` overwrites it), and (2) because `WinitView` returns `true` from `shouldRecognizeSimultaneouslyWithGestureRecognizer:`, a pinch and a rotation gesture can be active at the same time - so cancelling the pinch wrongly zeroes the in-progress rotation baseline, corrupting the next `RotationGesture` delta computation in `rotation_gesture`.","fix":"Reset the pinch state in the pinch handler: replace `self.ivars().rotation_last_delta.set(0.0)` with `self.ivars().pinch_last_delta.set(0.0)`.","locations":[{"ref":"winit-uikit/src/view.rs:178-182","code":"  178 |                 UIGestureRecognizerState::Cancelled | UIGestureRecognizerState::Failed => {\n  179 |                     self.ivars().rotation_last_delta.set(0.0);\n  180 |                     // Pass -delta so that action is reversed\n  181 |                     (TouchPhase::Cancelled, -recognizer.scale())\n  182 |                 },","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-uikit/src/view.rs#L178-L182"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `cursor_from_image`, the failure of `NSBitmapImageRep::initWith...` produces the error message `\"parent view should be installed in a window\"`, which is unrelated to bitmap creation and was clearly copy-pasted from unrelated code. The parallel `image_from_icon` correctly reports `\"Initializing the `NSBitmapImageRep` failed\"`.","fix":"Replace the message with an accurate one, e.g. `os_error!(\"Initializing the `NSBitmapImageRep` failed\")`.","locations":[{"ref":"winit-appkit/src/cursor.rs:98","code":"   98 |     }.ok_or_else(|| os_error!(\"parent view should be installed in a window\"))?;","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/cursor.rs#L98"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the `Debug` impl for `NativeKey`, the `Ohos(code)` arm formats the numeric code with `debug_tuple.field(code)` (decimal), whereas every other numeric variant (`Android`, `MacOS`, `Windows`, `Xkb`) formats with `format_args!(\"0x{code:04X}\")` (hex). The corresponding `NativeKeyCode` `Debug` impl correctly formats `Ohos` as hex. This makes `NativeKey`'s `Ohos` debug output inconsistent with both its own numeric siblings and with `NativeKeyCode::Ohos`.","fix":"Format `NativeKey::Ohos` like the other numeric variants:\n```rust\nOhos(code) => {\n    debug_tuple = f.debug_tuple(\"OpenHarmony\");\n    debug_tuple.field(&format_args!(\"0x{code:04X}\"));\n},\n```","locations":[{"ref":"winit-core/src/keyboard.rs:128-131","code":"  128 |             Ohos(code) => {\n  129 |                 debug_tuple = f.debug_tuple(\"OpenHarmony\");\n  130 |                 debug_tuple.field(code);\n  131 |             },","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/keyboard.rs#L128-L131"},{"ref":"winit-core/src/keyboard.rs:61-64","code":"   61 |             Ohos(code) => {\n   62 |                 debug_tuple = f.debug_tuple(\"OpenHarmony\");\n   63 |                 debug_tuple.field(&format_args!(\"0x{code:04X}\"));\n   64 |             },","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/keyboard.rs#L61-L64"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`keycode_to_vkey` maps `KeyCode::ShiftLeft` and `KeyCode::ShiftRight` to the wrong virtual keys - they are swapped:\n```\nKeyCode::ShiftLeft => VK_RSHIFT,\nKeyCode::ShiftRight => VK_LSHIFT,\n```\n`ShiftLeft` should map to `VK_LSHIFT` and `ShiftRight` to `VK_RSHIFT` (compare the correctly ordered `ControlLeft => VK_LCONTROL` / `ControlRight => VK_RCONTROL` and `AltLeft => VK_LMENU` / `AltRight => VK_RMENU` just above). The bug is currently latent because `keycode_to_vkey` is only ever called for `NUMPAD_KEYCODES` entries (`keyboard_layout.rs:325`), so the shift arms are never exercised, but the mapping is still wrong.","fix":"Swap the two arms:\n```\nKeyCode::ShiftLeft => VK_LSHIFT,\nKeyCode::ShiftRight => VK_RSHIFT,\n```","locations":[{"ref":"winit-win32/src/keyboard_layout.rs:585-586","code":"  585 |         KeyCode::ShiftLeft => VK_RSHIFT,\n  586 |         KeyCode::ShiftRight => VK_LSHIFT,","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/keyboard_layout.rs#L585-L586"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In `selection_notify` the mismatch warning computes the \"found\" type name from `xev.type_`, but `XSelectionEvent.type_` is the event-type constant (`SelectionNotify` == 31), not an atom. The value actually compared against `type_.atom()` a few lines above is `xev.target` (`target_type`). So the warning interns/looks up the name of atom `31` and prints a nonsensical \"found ...\" string.","fix":"Use the compared value: `let found_type_name = get_name(xev.target as _);`.","locations":[{"ref":"winit-x11/src/event_processor.rs:626-645","code":"  626 |             if target_type != type_.atom() {\n  627 |                 let get_name = |atom| {\n  628 |                     self.target\n  629 |                         .xconn\n  630 |                         .xcb_connection()\n  631 |                         .get_atom_name(atom)\n  632 |                         .ok()\n  633 |                         .and_then(|cookie| cookie.reply().ok())\n  634 |                         .and_then(|reply| String::from_utf8(reply.name).ok())\n  635 |                 };\n  636 | \n  637 |                 let expected_type_name = get_name(type_.atom());\n  638 |                 let found_type_name = get_name(xev.type_ as _);\n  639 | \n  640 |                 let extra_context = match (expected_type_name, found_type_name) {\n  641 |                     (Some(expected), Some(found)) => {\n  642 |                         format!(\" (expected {expected}, found {found})\")\n  643 |                     },\n  644 |                     (Some(expected), None) => format!(\" (expected {expected})\"),\n  645 |                     (None, Some(found)) => format!(\" (found {found})\"),","lines":20,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L626-L645"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `set_cursor`, the `Cursor::Custom` branch logs `tracing::error!(\"failed to set window icon: {err}\")` when `set_custom_cursor` fails. The message is a copy-paste artifact - it is about setting a cursor, not a window icon, which will mislead anyone reading the logs.","fix":"Change the message to `tracing::error!(\"failed to set custom cursor: {err}\")`.","locations":[{"ref":"winit-x11/src/window.rs:1846-1850","code":" 1846 |                 if *self.cursor_visible.lock().unwrap() {\n 1847 |                     if let Err(err) = self.xconn.set_custom_cursor(self.xwindow, cursor) {\n 1848 |                         tracing::error!(\"failed to set window icon: {err}\");\n 1849 |                     }\n 1850 |                 }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/window.rs#L1846-L1850"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"In `set_fullscreen`, when entering `Fullscreen::Exclusive`, the display is captured with `CGDisplayCapture(display_id).unwrap()` and (optionally) faded to black via `CGAcquireDisplayFadeReservation`/`CGDisplayFade`. If the requested video mode is then not found in `monitor.video_mode_handles()`, the code does a bare `return` (`None => return`). At that point the display has already been captured and the screen has been faded to solid black, but the fade-in / `CGReleaseDisplayFadeReservation` and any display release are only performed further down and are skipped by the early return. The result is a captured display stuck on a black screen with a leaked fade reservation, and the tracked `fullscreen` ivar is never updated. `CGDisplaySetDisplayMode` failing similarly aborts via `.expect(\"failed to set video mode\")` while the display is captured/faded.","fix":"Before the early `return` (and on `CGDisplaySetDisplayMode` failure), undo the partial state: fade back in and `CGReleaseDisplayFadeReservation(fade_token)` if `fade_token` is valid, and `CGDisplayRelease(display_id)` since the display was captured. Prefer returning an error / propagating rather than `.unwrap()`/`.expect()` on the CoreGraphics calls.","locations":[{"ref":"winit-appkit/src/window_delegate.rs:1915-1965","code":" 1915 |             let mut fade_token = kCGDisplayFadeReservationInvalidToken;\n 1916 | \n 1917 |             if matches!(old_fullscreen, Some(Fullscreen::Borderless(_))) {\n 1918 |                 self.ivars().save_presentation_opts.replace(Some(app.presentationOptions()));\n 1919 |             }\n 1920 | \n 1921 |             // Fade to black (and wait for the fade to complete) to hide the\n 1922 |             // flicker from capturing the display and switching display mode\n 1923 |             if cgerr(unsafe { CGAcquireDisplayFadeReservation(5.0, &mut fade_token) }).is_ok() {\n 1924 |                 CGDisplayFade(\n 1925 |                     fade_token,\n 1926 |                     0.3,\n 1927 |                     kCGDisplayBlendNormal,\n 1928 |                     kCGDisplayBlendSolidColor,\n 1929 |                     0.0,\n 1930 |                     0.0,\n 1931 |                     0.0,\n 1932 |                     true,\n 1933 |                 );\n 1934 |             }\n 1935 | \n 1936 |             cgerr(CGDisplayCapture(display_id)).unwrap();\n 1937 | \n 1938 |             let monitor = monitor.cast_ref::<MonitorHandle>().unwrap();\n 1939 |             let video_mode =\n 1940 |                 match monitor.video_mode_handles().find(|mode| &mode.mode == video_mode) {\n 1941 |                     Some(video_mode) => video_mode,\n 1942 |                     None => return,\n 1943 |                 };\n 1944 | \n 1945 |             cgerr(unsafe {\n 1946 |                 CGDisplaySetDisplayMode(display_id, Some(&video_mode.native_mode.0), None)\n 1947 |             })\n 1948 |             .expect(\"failed to set video mode\");\n 1949 | \n 1950 |             // After the display has been configured, fade back in\n 1951 |             // asynchronously\n 1952 |             if fade_token != kCGDisplayFadeReservationInvalidToken {\n 1953 |                 CGDisplayFade(\n 1954 |                     fade_token,\n 1955 |                     0.6,\n 1956 |                     kCGDisplayBlendSolidColor,\n 1957 |                     kCGDisplayBlendNormal,\n 1958 |                     0.0,\n 1959 |                     0.0,\n 1960 |                     0.0,\n 1961 |                     false,\n 1962 |                 );\n 1963 |                 CGReleaseDisplayFadeReservation(fade_token);\n 1964 |             }\n 1965 |         }","lines":51,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/window_delegate.rs#L1915-L1965"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The X11 event dispatch path turns recoverable X-server errors into hard panics of the whole event loop via `.expect(..)` / `.unwrap()`. A malicious or merely racy peer (a window destroyed mid-drag, a WM that rejects a request, a monitor unplugged) will crash the application. Examples: `translate_coords(..).expect(\"Failed to translate window coordinates\")`; `dnd.send_status(..).expect(\"Failed to send `XdndStatus` message.\")`; `dnd.send_finished(..).expect(\"Failed to send `XdndFinished` message.\")` (two sites); `ime.borrow_mut().remove_context(..).expect(..)`; `ime.borrow_mut().focus(..).expect(..)` / `.unfocus(..).expect(..)`; `get_monitor_for_window(..).expect(\"Failed to find monitor for window\")`; `available_monitors().expect(\"Failed to get monitor list\")`.","fix":"Replace the `.expect`/`.unwrap` calls with graceful handling: log a `warn!`/`error!` and `return` from the handler (as is already done for `read_data` in `selection_notify`), so a single failed X request does not abort the whole event loop.","locations":[{"ref":"winit-x11/src/event_processor.rs:488-492","code":"  488 |             let coords = self\n  489 |                 .target\n  490 |                 .xconn\n  491 |                 .translate_coords(self.target.root, window, x, y)\n  492 |                 .expect(\"Failed to translate window coordinates\");","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L488-L492"},{"ref":"winit-x11/src/event_processor.rs:514-521","code":"  514 |                 unsafe {\n  515 |                     dnd.send_status(\n  516 |                         window,\n  517 |                         source_window,\n  518 |                         if state.accepted { DndState::Accepted } else { DndState::Rejected },\n  519 |                     )\n  520 |                     .expect(\"Failed to send `XdndStatus` message.\");\n  521 |                 }","lines":8,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L514-L521"},{"ref":"winit-x11/src/event_processor.rs:575-578","code":"  575 |                 unsafe {\n  576 |                     dnd.send_finished(window, source_window)\n  577 |                         .expect(\"Failed to send `XdndFinished` message.\");\n  578 |                 }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L575-L578"},{"ref":"winit-x11/src/event_processor.rs:687-690","code":"  687 |             unsafe {\n  688 |                 dnd.send_finished(this_window, target_window)\n  689 |                     .expect(\"Failed to send `XdndFinished` message.\");\n  690 |             }","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L687-L690"},{"ref":"winit-x11/src/event_processor.rs:902-906","code":"  902 |         if let Some(ime) = self.target.ime.as_ref() {\n  903 |             ime.borrow_mut()\n  904 |                 .remove_context(window as XWindow)\n  905 |                 .expect(\"Failed to destroy input context\");\n  906 |         }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L902-L906"},{"ref":"winit-x11/src/event_processor.rs:1320-1321","code":" 1320 |         if let Some(ime) = self.target.ime.as_ref() {\n 1321 |             ime.borrow_mut().focus(xev.event).expect(\"Failed to focus input context\");","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L1320-L1321"},{"ref":"winit-x11/src/event_processor.rs:1379-1380","code":" 1379 |         if let Some(ime) = self.target.ime.as_ref() {\n 1380 |             ime.borrow_mut().unfocus(xev.event).expect(\"Failed to unfocus input context\");","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L1379-L1380"},{"ref":"winit-x11/src/event_processor.rs:780-782","code":"  780 |                     .xconn\n  781 |                     .get_monitor_for_window(Some(window_rect))\n  782 |                     .expect(\"Failed to find monitor for window\");","lines":3,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L780-L782"},{"ref":"winit-x11/src/event_processor.rs:1866","code":" 1866 |         let new_list = self.target.xconn.available_monitors().expect(\"Failed to get monitor list\");","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L1866"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `get_xim_servers`, the return value of `(xconn.xlib.XGetAtomNames)(...)` is ignored and `names.set_len(atoms.len())` is called unconditionally. `XGetAtomNames` returns `0` on failure and in that case leaves the `names` buffer (allocated with `Vec::with_capacity(atoms.len())`) uninitialized. The subsequent loop then does `CStr::from_ptr(name)` over uninitialized `*const c_char` pointers, which is undefined behavior (reads of uninitialized memory and dereference of garbage pointers). Even on partial success this pattern is fragile.","fix":"Capture the return value and bail out before `set_len` if it is `0`, e.g. `let ok = unsafe { (xconn.xlib.XGetAtomNames)(xconn.display, atoms.as_mut_ptr(), atoms.len() as _, names.as_mut_ptr() as _) };` then `if ok == 0 { return Err(...); }` and only then `unsafe { names.set_len(atoms.len()) };`. Consider zero-initializing the pointer buffer first so an early return cannot observe uninitialized memory.","locations":[{"ref":"winit-x11/src/ime/input_method.rs:180-201","code":"  180 |     let mut names: Vec<*const c_char> = Vec::with_capacity(atoms.len());\n  181 |     unsafe {\n  182 |         (xconn.xlib.XGetAtomNames)(\n  183 |             xconn.display,\n  184 |             atoms.as_mut_ptr(),\n  185 |             atoms.len() as _,\n  186 |             names.as_mut_ptr() as _,\n  187 |         )\n  188 |     };\n  189 |     unsafe { names.set_len(atoms.len()) };\n  190 | \n  191 |     let mut formatted_names = Vec::with_capacity(names.len());\n  192 |     for name in names {\n  193 |         let string = unsafe { CStr::from_ptr(name) }\n  194 |             .to_owned()\n  195 |             .into_string()\n  196 |             .map_err(GetXimServersError::InvalidUtf8)?;\n  197 |         unsafe { (xconn.xlib.XFree)(name as _) };\n  198 |         formatted_names.push(string.replace(\"@server=\", \"@im=\"));\n  199 |     }\n  200 |     xconn.check_errors().map_err(GetXimServersError::XError)?;\n  201 |     Ok(formatted_names)","lines":22,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/ime/input_method.rs#L180-L201"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`EventLoopError::source` and `RequestError::source` both return `err.source()` for the `Os` variant, i.e. the *inner* boxed error of the `OsError`, skipping the `OsError` itself from the error `source()` chain. A consumer walking the chain never sees the `OsError` (which carries the `file`/`line` context). The idiomatic behavior is to return the `OsError` as the immediate source so the full chain is preserved.","fix":"Return the `OsError` itself as the source rather than delegating to its own `source()`:\n```rust\nfn source(&self) -> Option<&(dyn Error + 'static)> {\n    if let Self::Os(err) = self { Some(err) } else { None }\n}\n```","locations":[{"ref":"winit-core/src/error.rs:36-40","code":"   36 | impl Error for EventLoopError {\n   37 |     fn source(&self) -> Option<&(dyn Error + 'static)> {\n   38 |         if let Self::Os(err) = self { err.source() } else { None }\n   39 |     }\n   40 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/error.rs#L36-L40"},{"ref":"winit-core/src/error.rs:75-79","code":"   75 | impl Error for RequestError {\n   76 |     fn source(&self) -> Option<&(dyn Error + 'static)> {\n   77 |         if let Self::Os(err) = self { err.source() } else { None }\n   78 |     }\n   79 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/error.rs#L75-L79"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Window::drop` (Orbital) calls `self.event_loop_proxy.wake_socket.wake().unwrap()`. `wake()` writes to the time socket and can fail with an OS error; unwrapping inside `Drop` turns a syscall failure into a panic during unwinding, risking a double-panic abort. The same `.wake().unwrap()` / `.expect(...)` pattern is used unconditionally in `Window::new` (opening the socket, subscribing, and waking), so any transient syscall failure during window creation aborts instead of returning the `RequestError` that the function signature already supports.","fix":"In `Drop`, ignore or log the error instead of unwrapping (e.g. `let _ = self.event_loop_proxy.wake_socket.wake();`). In `Window::new`, propagate failures via `?`/`map_err(|e| os_error!(...))` rather than `expect`/`unwrap` so they surface as `RequestError`.","locations":[{"ref":"winit-orbital/src/window.rs:504-513","code":"  504 | impl Drop for Window {\n  505 |     fn drop(&mut self) {\n  506 |         {\n  507 |             let mut destroys = self.destroys.lock().unwrap();\n  508 |             destroys.push_back(self.id());\n  509 |         }\n  510 | \n  511 |         self.event_loop_proxy.wake_socket.wake().unwrap();\n  512 |     }\n  513 | }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-orbital/src/window.rs#L504-L513"},{"ref":"winit-orbital/src/window.rs:110-123","code":"  110 |         .expect(\"failed to open window\");\n  111 | \n  112 |         // Add to event socket.\n  113 |         el.event_socket.subscribe(window.fd(), EventSource::Orbital, EventFlags::READ).unwrap();\n  114 | \n  115 |         let window_socket = Arc::new(window);\n  116 | \n  117 |         // Notify event thread that this window was created, it will send some default events.\n  118 |         {\n  119 |             let mut creates = el.creates.lock().unwrap();\n  120 |             creates.push_back(window_socket.clone());\n  121 |         }\n  122 | \n  123 |         el.event_loop_proxy.wake_socket.wake().unwrap();","lines":14,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-orbital/src/window.rs#L110-L123"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Both DnD data-pump paths register a calloop source with `let _ = ... .insert_source(...)`, silently discarding the `Result`. In `ActiveEventLoop::fetch_data_transfer`, if `insert_source` fails the function still returns `Ok(async_request_serial)` to the caller, but no `DataTransferReceived` event will ever be delivered for that serial (the pipe read source was never installed), so the request hangs forever with no error reported. The same silent discard occurs in `DataSourceHandler::send_request`.","fix":"Check the `insert_source` result and, on error, propagate a `RequestError` (in `fetch_data_transfer`) or at least `tracing::warn!` and clean up (in `send_request`) instead of `let _ = ...`.","locations":[{"ref":"winit-wayland/src/event_loop/mod.rs:816-843","code":"  816 |         let _ = state.loop_handle.insert_source(ReadPipe::from(readfd), move |_, file, state| {\n  817 |             // SAFETY: We do not overwrite the referent of `file`\n  818 |             let file = unsafe { file.get_mut() };\n  819 | \n  820 |             let result = match file.read_to_end(&mut buffer) {\n  821 |                 Err(e) if e.kind() == io::ErrorKind::WouldBlock => {\n  822 |                     return PostAction::Continue;\n  823 |                 },\n  824 |                 Ok(0) => Ok(mem::take(&mut buffer)),\n  825 |                 Ok(_) => {\n  826 |                     return PostAction::Continue;\n  827 |                 },\n  828 |                 Err(e) => Err(Arc::new(e)),\n  829 |             };\n  830 | \n  831 |             state.events_sink.push_window_event(\n  832 |                 WindowEvent::DataTransferReceived {\n  833 |                     id,\n  834 |                     serial: async_request_serial,\n  835 |                     // `unwrap` is safe here, as we always return `PostAction::Remove` in this\n  836 |                     // branch.\n  837 |                     value: Arc::new(MimeData::new(mime_type.take().unwrap(), result)),\n  838 |                 },\n  839 |                 window_id,\n  840 |             );\n  841 | \n  842 |             PostAction::Remove\n  843 |         });","lines":28,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/event_loop/mod.rs#L816-L843"},{"ref":"winit-wayland/src/dnd.rs:91-114","code":"   91 |         let _ = self.loop_handle.insert_source(fd, move |_, file, _| {\n   92 |             // Safety: We only mutate `file` in-place and do not replace and drop it.\n   93 |             let file = unsafe { file.get_mut() };\n   94 |             loop {\n   95 |                 let Ok(encoded_bytes) = encoder.fill_buf() else {\n   96 |                     return PostAction::Remove;\n   97 |                 };\n   98 | \n   99 |                 match file.write(encoded_bytes) {\n  100 |                     Ok(0) => {\n  101 |                         break PostAction::Remove;\n  102 |                     },\n  103 |                     Ok(consumed) => {\n  104 |                         encoder.consume(consumed);\n  105 |                     },\n  106 |                     Err(e) if e.kind() == ErrorKind::WouldBlock => {\n  107 |                         break PostAction::Continue;\n  108 |                     },\n  109 |                     Err(_) => {\n  110 |                         break PostAction::Remove;\n  111 |                     },\n  112 |                 }\n  113 |             }\n  114 |         });","lines":24,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/dnd.rs#L91-L114"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"In the drag-and-drop `leave` handler, `receive_drag.finish()` is called when the drag pointer merely *leaves* the surface without a drop:\n```\nif let Some(receive_drag) = self.dnd_state.receive_drag.take() {\n    receive_drag.finish();\n}\n```\n`receive_drag` is the crate's own `DataOffer`, which `Deref`s to `WlDataOffer` (see `impl Deref for DataOffer`), so `.finish()` resolves to the raw `wl_data_offer.finish` request. Per the wayland protocol, `finish` may only be sent after a successful drop; sending it on a plain `leave` raises the `invalid_finish` protocol error and disconnects the client. In addition, going through the `Deref` bypasses sctk's `DragOffer::finish` guard (which only sends `finish` when `version() >= 3`), so on a v1/v2 offer this also sends `finish` to an object that does not support it, another protocol error. The same unguarded `receive_drag.finish()` is used in `drop_performed` (where the timing is correct, but the version guard is still missing).","fix":"On `leave`, do not call `finish()` at all - only `destroy()` the offer. Reserve `finish()` for `drop_performed`, and route it through the sctk `DragOffer::finish` (which checks `version() >= 3`) rather than the raw `WlDataOffer::finish` reached via `Deref`. For example, in `leave` drop the `receive_drag.finish()` call entirely and rely on the subsequent `drag.destroy()`.","locations":[{"ref":"winit-wayland/src/dnd.rs:685-694","code":"  685 |         if let Some(current_drag) = self.dnd_state.receive_drag() {\n  686 |             self.events_sink.push_window_event(\n  687 |                 WindowEvent::DragLeft { id: current_drag.transfer_id() },\n  688 |                 current_drag.window_id(),\n  689 |             );\n  690 | \n  691 |             if let Some(receive_drag) = self.dnd_state.receive_drag.take() {\n  692 |                 receive_drag.finish();\n  693 |
