   }\n  694 |         }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/dnd.rs#L685-L694"},{"ref":"winit-wayland/src/dnd.rs:501-507","code":"  501 | impl Deref for DataOffer {\n  502 |     type Target = WlDataOffer;\n  503 | \n  504 |     fn deref(&self) -> &Self::Target {\n  505 |         &self.data\n  506 |     }\n  507 | }","lines":7,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/dnd.rs#L501-L507"},{"ref":"winit-wayland/src/dnd.rs:793-795","code":"  793 |         if let Some(receive_drag) = self.dnd_state.receive_drag.take() {\n  794 |             receive_drag.finish();\n  795 |         }","lines":3,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/dnd.rs#L793-L795"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"`WinitPointerData::unconfine_pointer` destroys the confined-pointer Wayland object but never clears it from the state. It locks `self.inner` immutably and uses `.as_ref()`:\n```\npub fn unconfine_pointer(&self) {\n    let inner = self.inner.lock().unwrap();\n    if let Some(confined_pointer) = inner.confined_pointer.as_ref() {\n        confined_pointer.destroy();\n    }\n}\n```\nNote the guard `inner` is not `mut` and `confined_pointer` is left as `Some(..)`. Later, when `WinitPointerDataInner` is dropped, `Drop` runs `self.confined_pointer.take()` and calls `confined_pointer.destroy()` a *second* time on the same proxy. A double `zwp_confined_pointer_v1.destroy` is a Wayland protocol error that disconnects the client and crashes the application. This is reached via `seat::remove_capability` (which calls `unconfine_pointer` then drops the pointer) and via `window/state.rs` cursor-grab changes. Compare with the correct `unlock_pointer`, which uses `.take()` and thus leaves `locked_pointer` as `None`.","fix":"Take the value out so the `Drop` impl does not destroy it again:\n```\npub fn unconfine_pointer(&self) {\n    let mut inner = self.inner.lock().unwrap();\n    if let Some(confined_pointer) = inner.confined_pointer.take() {\n        confined_pointer.destroy();\n    }\n}\n```","locations":[{"ref":"winit-wayland/src/seat/pointer/mod.rs:310-315","code":"  310 |     pub fn unconfine_pointer(&self) {\n  311 |         let inner = self.inner.lock().unwrap();\n  312 |         if let Some(confined_pointer) = inner.confined_pointer.as_ref() {\n  313 |             confined_pointer.destroy();\n  314 |         }\n  315 |     }","lines":6,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/seat/pointer/mod.rs#L310-L315"},{"ref":"winit-wayland/src/seat/pointer/mod.rs:360-369","code":"  360 | impl Drop for WinitPointerDataInner {\n  361 |     fn drop(&mut self) {\n  362 |         if let Some(locked_pointer) = self.locked_pointer.take() {\n  363 |             locked_pointer.destroy();\n  364 |         }\n  365 | \n  366 |         if let Some(confined_pointer) = self.confined_pointer.take() {\n  367 |             confined_pointer.destroy();\n  368 |         }\n  369 |     }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/seat/pointer/mod.rs#L360-L369"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`is_high_contrast` initialises `HIGHCONTRASTA { cbSize: 0, .. }` before calling `SystemParametersInfoA(SPI_GETHIGHCONTRAST, size_of_val(&hc), &mut hc, 0)`. The documented contract for `SPI_GETHIGHCONTRAST` requires the `cbSize` member of the `HIGHCONTRAST` structure to be set to `sizeof(HIGHCONTRAST)` (in addition to the `uiParam` size argument). Leaving `cbSize == 0` can make the call fail, in which case `is_high_contrast` silently returns `false` and dark mode is applied even when the user has enabled a high-contrast theme.","fix":"Set `cbSize` to the struct size: `let mut hc = HIGHCONTRASTA { cbSize: std::mem::size_of::<HIGHCONTRASTA>() as u32, dwFlags: 0, lpszDefaultScheme: ptr::null_mut() };`.","locations":[{"ref":"winit-win32/src/dark_mode.rs:151-164","code":"  151 | fn is_high_contrast() -> bool {\n  152 |     let mut hc = HIGHCONTRASTA { cbSize: 0, dwFlags: 0, lpszDefaultScheme: ptr::null_mut() };\n  153 | \n  154 |     let ok = unsafe {\n  155 |         SystemParametersInfoA(\n  156 |             SPI_GETHIGHCONTRAST,\n  157 |             std::mem::size_of_val(&hc) as _,\n  158 |             &mut hc as *mut _ as _,\n  159 |             0,\n  160 |         )\n  161 |     };\n  162 | \n  163 |     ok != false.into() && util::has_flag(hc.dwFlags, HCF_HIGHCONTRASTON)\n  164 | }","lines":14,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/dark_mode.rs#L151-L164"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"Several `extern \"C\"` XIM callbacks can panic, which unwinds across the C (Xlib) frame that invoked them. `preedit_start_callback`/`preedit_done_callback`/`preedit_draw_callback`/`preedit_caret_callback` all use `event_sender.send(...).expect(\"failed to send preedit ... event\")`, and `preedit_draw_callback` uses `new_text.to_str().expect(\"Invalid UTF-8 String from IME\")`. The latter is directly reachable: an IME running under a non-UTF-8 locale can legitimately hand back a non-UTF-8 multibyte string, and a `send` fails whenever the event-loop receiver has been dropped (e.g. during shutdown). Likewise `xim_instantiate_callback` and `xim_destroy_callback` call `panic!(...)`. Panicking out of `extern \"C\"` aborts the whole process (or is UB on older toolchains) - an environment-triggerable hard crash.","fix":"Make the callbacks panic-free: replace `.expect(...)` on `event_sender.send(...)` with `let _ = ...send(...);` (a dead receiver just means no one is listening), and replace `new_text.to_str().expect(\"Invalid UTF-8 String from IME\")` with a graceful fallback such as `match new_text.to_str() { Ok(s) => s, Err(_) => return }` or `String::from_utf8_lossy`. For the reopen-failure paths in `callbacks.rs`, log the error via `tracing::error!` instead of `panic!`, or wrap callback bodies in `std::panic::catch_unwind` so unwinding never crosses the FFI boundary.","locations":[{"ref":"winit-x11/src/ime/context.rs:54-57","code":"   54 |     client_data\n   55 |         .event_sender\n   56 |         .send((client_data.window, ImeEvent::Start))\n   57 |         .expect(\"failed to send preedit start event\");","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/ime/context.rs#L54-L57"},{"ref":"winit-x11/src/ime/context.rs:73-77","code":"   73 |     client_data\n   74 |         .event_sender\n   75 |         .send((client_data.window, ImeEvent::End))\n   76 |         .expect(\"failed to send preedit end event\");\n   77 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/ime/context.rs#L73-L77"},{"ref":"winit-x11/src/ime/context.rs:122","code":"  122 |         String::from(new_text.to_str().expect(\"Invalid UTF-8 String from IME\")).chars().collect()","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/ime/context.rs#L122"},{"ref":"winit-x11/src/ime/context.rs:130-136","code":"  130 |     client_data\n  131 |         .event_sender\n  132 |         .send((\n  133 |             client_data.window,\n  134 |             ImeEvent::Update(client_data.text.iter().collect(), cursor_byte_pos),\n  135 |         ))\n  136 |         .expect(\"failed to send preedit update event\");","lines":7,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/ime/context.rs#L130-L136"},{"ref":"winit-x11/src/ime/callbacks.rs:174","code":"  174 |                     panic!(\"Failed to reopen input method: {err:?}\");","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/ime/callbacks.rs#L174"},{"ref":"winit-x11/src/ime/callbacks.rs:201","code":"  201 |                     panic!(\"Failed to open fallback input method: {err:?}\");","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/ime/callbacks.rs#L201"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Several `NSWindowDelegate`/`NSDraggingDestination` methods obtain a main-thread marker via `MainThreadMarker::new().unwrap()` even though `WindowDelegate` is `MainThreadOnly` and `MainThreadMarker::from(self)` is infallibly available. Using the unwrapping form introduces an unnecessary panic path (and obscures that the code is provably on the main thread).","fix":"Replace `MainThreadMarker::new().unwrap()` with `MainThreadMarker::from(self)` in these delegate methods.","locations":[{"ref":"winit-appkit/src/window_delegate.rs:432-433","code":"  432 |             let pb =\n  433 |                 MainThreadBound::new(sender.draggingPasteboard(), MainThreadMarker::new().unwrap());","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/window_delegate.rs#L432-L433"},{"ref":"winit-appkit/src/window_delegate.rs:432-433","code":"  432 |             let pb =\n  433 |                 MainThreadBound::new(sender.draggingPasteboard(), MainThreadMarker::new().unwrap());","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/window_delegate.rs#L432-L433"},{"ref":"winit-appkit/src/window_delegate.rs:489-490","code":"  489 |             let pb =\n  490 |                 MainThreadBound::new(sender.draggingPasteboard(), MainThreadMarker::new().unwrap());","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/window_delegate.rs#L489-L490"},{"ref":"winit-appkit/src/window_delegate.rs:596-599","code":"  596 |                 let pb = MainThreadBound::new(\n  597 |                     sender.draggingPasteboard(),\n  598 |                     MainThreadMarker::new().unwrap(),\n  599 |                 );","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/window_delegate.rs#L596-L599"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`FileDropHandler::QueryInterface` returns `E_FAIL` and never writes to `_ppvObject`. The COM contract for `IUnknown::QueryInterface` requires that on failure `*ppvObject` is set to `NULL`; leaving it untouched lets a caller read an uninitialised out-pointer. It should also return `E_NOINTERFACE` (not `E_FAIL`) for an unsupported IID.","fix":"Write the out-parameter before returning: `if !_ppvObject.is_null() { unsafe { *_ppvObject = std::ptr::null_mut(); } }` and return `E_NOINTERFACE`.","locations":[{"ref":"winit-win32/src/dnd.rs:345-355","code":"  345 |     unsafe extern \"system\" fn QueryInterface(\n  346 |         _this: *mut IUnknown,\n  347 |         _riid: *const GUID,\n  348 |         _ppvObject: *mut *mut c_void,\n  349 |     ) -> HRESULT {\n  350 |         // This function doesn't appear to be required for an `IDropTarget`.\n  351 |         // An implementation would be nice however.\n  352 |         // Can't use `unimplemented` here as it's invalid to panic over an FFI boundary.\n  353 |         tracing::warn!(\"`QueryInterface` called, but it was unimplemented\");\n  354 |         E_FAIL\n  355 |     }","lines":11,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/dnd.rs#L345-L355"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The atom manager interns an atom whose *name* is the literal string `\"None\"` (`None: b\"None\"`) and this atom is used as the DnD \"no action\" value (`atoms[DndNone]`) in `send_status` (Rejected) and `send_finished` (not accepted). Per the XDND spec the action field must be the real X11 `None` atom (numeric id `0`, i.e. `xproto::AtomEnum::NONE`), not an application-defined atom that merely happens to be named \"None\". The interned atom has an arbitrary non-zero id, so a strict drag source reading the action field sees a bogus atom.","fix":"Use `xproto::AtomEnum::NONE` (0) for the no-action value instead of an interned `\"None\"` atom.","locations":[{"ref":"winit-x11/src/atoms.rs:124","code":"  124 |     None: b\"None\",","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/atoms.rs#L124"},{"ref":"winit-x11/src/dnd.rs:282-283","code":"  282 |         let (accepted, action) =\n  283 |             if state.accepted { (1, atoms[XdndActionCopy]) } else { (0, atoms[DndNone]) };","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/dnd.rs#L282-L283"},{"ref":"winit-x11/src/dnd.rs:331-334","code":"  331 |         let (accepted, action) = match status {\n  332 |             DndState::Accepted => (1, atoms[XdndActionCopy]),\n  333 |             DndState::Rejected => (0, atoms[DndNone]),\n  334 |         };","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/dnd.rs#L331-L334"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"hard","description":"`set_activation_token_env` and `reset_activation_token_env` mutate process-global environment via `env::set_var`/`env::remove_var` inside bare `unsafe` blocks with no `# Safety` documentation and no mention of the well-known data-race hazard. On the 2024 edition these functions are `unsafe` precisely because concurrent `getenv`/`setenv` from other threads is undefined behaviour; winit itself reads env vars (e.g. `WAYLAND_DISPLAY`, `DISPLAY`) elsewhere. Exposing these as safe public wrappers that internally call the unsafe primitives, with no caller guidance about thread-safety, invites UB in multi-threaded programs.","fix":"Document the thread-safety contract on both public functions (must be called before spawning threads that touch the environment), and add a terse `// SAFETY:` justification inside each `unsafe` block stating the single-threaded-at-call-time precondition being relied on.","locations":[{"ref":"winit/src/platform/startup_notify.rs:95-111","code":"   95 | pub fn reset_activation_token_env() {\n   96 |     unsafe {\n   97 |         env::remove_var(X11_VAR);\n   98 |         env::remove_var(WAYLAND_VAR);\n   99 |     }\n  100 | }\n  101 | \n  102 | /// Set environment variables responsible for activation token.\n  103 | ///\n  104 | /// This could be used before running daemon processes.\n  105 | pub fn set_activation_token_env(token: ActivationToken) {\n  106 |     let token = token.into_raw();\n  107 |     unsafe {\n  108 |         env::set_var(X11_VAR, &token);\n  109 |         env::set_var(WAYLAND_VAR, token);\n  110 |     }\n  111 | }","lines":17,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit/src/platform/startup_notify.rs#L95-L111"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`keycodes::to_logical(key_char, keycode)` is invoked twice for the same key event to produce both `logical_key` and `key_without_modifiers`. The two calls take identical inputs and always produce identical output, so the second call redundantly re-runs the whole mapping and re-allocates a `SmolStr` for every key press.","fix":"Compute `let logical_key = keycodes::to_logical(key_char, keycode);` once, then set `key_without_modifiers: logical_key.clone()` and reorder so `logical_key` is cloned before it is moved into the `KeyEvent`.","locations":[{"ref":"winit-android/src/event_loop.rs:478","code":"  478 |                         let logical_key = keycodes::to_logical(key_char, keycode);","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-android/src/event_loop.rs#L478"},{"ref":"winit-android/src/event_loop.rs:495","code":"  495 |                                 key_without_modifiers: keycodes::to_logical(key_char, keycode),","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-android/src/event_loop.rs#L495"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `EventLoop::pump_app_events` (Orbital) the computed timeout is registered via `UserData::from_user_data(timeout.as_millis() as usize)`, truncating to whole milliseconds. For a `ControlFlow::WaitUntil` deadline less than 1 ms away, `as_millis()` yields `0`, so the timer fires immediately and `pump_app_events` returns `PumpStatus::Continue` without doing work; the caller re-enters, recomputes a sub-millisecond timeout, and spins in a busy loop until the deadline is reached. Sub-millisecond scheduling resolution is silently lost.","fix":"Preserve sub-millisecond precision by programming the timeout in nanoseconds (e.g. via the `TimeSocket`/`TimeSpec` path already present in `lib.rs`) instead of truncating to whole milliseconds, or round up so a non-zero remaining duration never becomes a 0 ms timeout.","locations":[{"ref":"winit-orbital/src/event_loop.rs:697-706","code":"  697 |         if let Some(timeout) = timeout {\n  698 |             self.window_target\n  699 |                 .event_socket\n  700 |                 .subscribe(\n  701 |                     EVENT_TIMEOUT_ID,\n  702 |                     UserData::from_user_data(timeout.as_millis() as usize),\n  703 |                     EventFlags::READ,\n  704 |                 )\n  705 |                 .expect(\"failed to register EVENT_TIMEOUT_ID\")\n  706 |         }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-orbital/src/event_loop.rs#L697-L706"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`WindowState::pointer_left()` calls `removed.upgrade().unwrap()` inside the retain loop, once per retained pointer:\n```rust\nfor pointer in self.pointers.drain(..) {\n    if let Some(pointer) = pointer.upgrade() {\n        if pointer.pointer() != removed.upgrade().unwrap().pointer() {\n            new_pointers.push(Arc::downgrade(&pointer));\n        }\n    }\n}\n```\nThe `removed` weak is re-`upgrade()`d on every iteration (repeated atomic refcount work), and the `unwrap()` is a latent panic: if the `removed` pointer's `Arc` were already dropped, `upgrade()` returns `None` and the code panics. The current caller keeps the `Arc` alive so it does not fire today, but the pattern is fragile.","fix":"Upgrade `removed` once before the loop and compare against a stored reference, e.g.:\n```rust\nlet removed = match removed.upgrade() {\n    Some(removed) => removed,\n    None => return,\n};\nself.pointers.retain(|p| {\n    p.upgrade().is_none_or(|p| p.pointer() != removed.pointer())\n});\n```","locations":[{"ref":"winit-wayland/src/window/state.rs:791-802","code":"  791 |     pub fn pointer_left(&mut self, removed: Weak<ThemedPointer<WinitPointerData>>) {\n  792 |         let mut new_pointers = Vec::new();\n  793 |         for pointer in self.pointers.drain(..) {\n  794 |             if let Some(pointer) = pointer.upgrade() {\n  795 |                 if pointer.pointer() != removed.upgrade().unwrap().pointer() {\n  796 |                     new_pointers.push(Arc::downgrade(&pointer));\n  797 |                 }\n  798 |             }\n  799 |         }\n  800 | \n  801 |         self.pointers = new_pointers;\n  802 |     }","lines":12,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/window/state.rs#L791-L802"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `RootWindow::request_surface_size` the closure passed to `self.inner.queue(..)` already receives `inner`, yet computes the scale factor via `self.scale_factor()`, which itself calls `self.inner.queue(Inner::scale_factor)` - a nested `queue` on the same `Dispatcher`. On the main thread this issues a second `RefCell` borrow and an extra dispatch for a value already reachable as `inner`. Every other method here uses `inner.scale_factor()`.","fix":"Use the already-available `inner`: `let size = size.to_logical(inner.scale_factor());`.","locations":[{"ref":"winit-web/src/window.rs:159-170","code":"  159 |     fn request_surface_size(&self, size: Size) -> Option<PhysicalSize<u32>> {\n  160 |         self.inner.queue(|inner| {\n  161 |             let size = size.to_logical(self.scale_factor());\n  162 |             backend::set_canvas_size(\n  163 |                 inner.canvas.document(),\n  164 |                 inner.canvas.raw(),\n  165 |                 inner.canvas.style(),\n  166 |                 size,\n  167 |             );\n  168 |             None\n  169 |         })\n  170 |     }","lines":12,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/window.rs#L159-L170"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The `WM_SIZING` handler re-locks `window_state` six-plus times in sequence for independent field reads (`scale_factor`, `surface_resize_increments`, `window_flags`, `min_size`, `max_size`), each a separate `Mutex` lock/unlock, instead of taking the lock once and reading all fields. Also each lock returns a temporary guard, so `adjust_rect` is called on a freshly re-locked guard.","fix":"Take a single `let ws = userdata.window_state_lock();` guard at the top of the arm, read `scale_factor`, `surface_resize_increments`, `window_flags`, `min_size`, `max_size` from it, then `drop(ws)` before doing the geometry math.","locations":[{"ref":"winit-win32/src/event_loop.rs:1520-1557","code":" 1520 |             let scale_factor = userdata.window_state_lock().scale_factor;\n 1521 |             let Some(inc) = userdata\n 1522 |                 .window_state_lock()\n 1523 |                 .surface_resize_increments\n 1524 |                 .map(|inc| inc.to_physical(scale_factor))\n 1525 |                 .filter(|inc| inc.width > 0 && inc.height > 0)\n 1526 |             else {\n 1527 |                 result = ProcResult::Value(0);\n 1528 |                 return;\n 1529 |             };\n 1530 | \n 1531 |             let side = wparam as u32;\n 1532 |             // The desired new size of the window, decorations included.\n 1533 |             let rect = unsafe { &mut *(lparam as *mut RECT) };\n 1534 | \n 1535 |             // We need to calculate the dimensions of the window decorations to get the true\n 1536 |             // size of the window's contents\n 1537 |             let adj_rect = userdata\n 1538 |                 .window_state_lock()\n 1539 |                 .window_flags\n 1540 |                 .adjust_rect(window, *rect)\n 1541 |                 .unwrap_or(*rect);\n 1542 |             let deco_width = rect.left - adj_rect.left + adj_rect.right - rect.right;\n 1543 |             let deco_height = rect.top - adj_rect.top + adj_rect.bottom - rect.bottom;\n 1544 | \n 1545 |             let width = rect.right - rect.left - deco_width;\n 1546 |             let height = rect.bottom - rect.top - deco_height;\n 1547 | \n 1548 |             let mut width_delta = snap_to_nearest_increment_delta(width, inc.width);\n 1549 |             let mut height_delta = snap_to_nearest_increment_delta(height, inc.height);\n 1550 | \n 1551 |             // Windows won't bound check the value of `rect` after we're done here, so we\n 1552 |             // have to check manually. If the width/height we snap to would go out of bounds, just\n 1553 |             // set it equal to the min/max bound.\n 1554 |             let min_size =\n 1555 |                 userdata.window_state_lock().min_size.map(|size| size.to_physical(scale_factor));\n 1556 |             let max_size =\n 1557 |                 userdata.window_state_lock().max_size.map(|size| size.to_physical(scale_factor));","lines":38,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/event_loop.rs#L1520-L1557"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `apply_win10_dpi_adjustment`, when the conservative rect lands on a monitor that shares no edge with the target monitor, `delta_nudge_to_dpi_monitor` is `(0, 0)`. The nudge loop then runs `abort_after_iterations` times (up to `monitor_width + monitor_height`, i.e. thousands) adding `(0,0)` each iteration and calling `MonitorFromRect` every time without ever making progress or breaking early - thousands of wasted syscalls on the DPI-change path.","fix":"Short-circuit when there is nothing to nudge: `if delta_nudge_to_dpi_monitor == (0, 0) { return conservative_rect; }` before entering the loop.","locations":[{"ref":"winit-win32/src/event_loop.rs:2793-2824","code":" 2793 |     #[allow(clippy::bool_to_int_with_if)]\n 2794 |     let delta_nudge_to_dpi_monitor = (\n 2795 |         if wrong_monitor_rect.left == new_monitor_rect.right {\n 2796 |             -1\n 2797 |         } else if wrong_monitor_rect.right == new_monitor_rect.left {\n 2798 |             1\n 2799 |         } else {\n 2800 |             0\n 2801 |         },\n 2802 |         if wrong_monitor_rect.bottom == new_monitor_rect.top {\n 2803 |             1\n 2804 |         } else if wrong_monitor_rect.top == new_monitor_rect.bottom {\n 2805 |             -1\n 2806 |         } else {\n 2807 |             0\n 2808 |         },\n 2809 |     );\n 2810 | \n 2811 |     let abort_after_iterations = new_monitor_rect.right - new_monitor_rect.left\n 2812 |         + new_monitor_rect.bottom\n 2813 |         - new_monitor_rect.top;\n 2814 |     for _ in 0..abort_after_iterations {\n 2815 |         conservative_rect.left += delta_nudge_to_dpi_monitor.0;\n 2816 |         conservative_rect.right += delta_nudge_to_dpi_monitor.0;\n 2817 |         conservative_rect.top += delta_nudge_to_dpi_monitor.1;\n 2818 |         conservative_rect.bottom += delta_nudge_to_dpi_monitor.1;\n 2819 | \n 2820 |         if unsafe { MonitorFromRect(&conservative_rect, MONITOR_DEFAULTTONULL) } == new_dpi_monitor\n 2821 |         {\n 2822 |             break;\n 2823 |         }\n 2824 |     }","lines":32,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/event_loop.rs#L2793-L2824"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`xinput2_mouse_enter` calls `DeviceInfo::get(&self.target.xconn, ALL_DEVICES.into())` on every single `XI_Enter` event, which does a synchronous round-trip `XIQueryDevice(all)` plus a heap allocation and free, purely to reset scroll positions. Pointer-enter events can be frequent, making this a needless per-event server round-trip and allocation.","fix":"Reset scroll positions from the already-cached `self.devices` map instead of re-querying the server on every enter, or query only the specific `sourceid` rather than `ALL_DEVICES`.","locations":[{"ref":"winit-x11/src/event_processor.rs:1263-1278","code":" 1263 |         if let Some(all_info) = DeviceInfo::get(&self.target.xconn, ALL_DEVICES.into()) {\n 1264 |             let mut devices = self.devices.borrow_mut();\n 1265 |             for device_info in all_info.iter() {\n 1266 |                 // The second expression is need for resetting to work correctly on i3, and\n 1267 |                 // presumably some other WMs. On those, `XI_Enter` doesn't include the physical\n 1268 |                 // device ID, so both `sourceid` and `deviceid` are the virtual device.\n 1269 |                 if device_info.deviceid == event.sourceid\n 1270 |                     || device_info.attachment == event.sourceid\n 1271 |                 {\n 1272 |                     let device_id = mkdid(device_info.deviceid as xinput::DeviceId);\n 1273 |                     if let Some(device) = devices.get_mut(&device_id) {\n 1274 |                         device.reset_scroll_position(device_info);\n 1275 |                     }\n 1276 |                 }\n 1277 |             }\n 1278 |         }","lines":16,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_processor.rs#L1263-L1278"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`available_monitors` returns a full deep clone of the cached monitor list on every call (`Ok(monitors.clone())`), including each monitor's `video_modes: Vec<VideoModeHandle>`. `Window::available_monitors`, `UnownedWindow::new`, and the `CoreWindow` iterator all go through this, so every window creation and monitor query re-clones every video mode of every monitor.","fix":"Store the cache behind an `Arc<[MonitorHandle]>` (or `Arc<Vec<MonitorHandle>>`) and hand out cheap `Arc` clones, or expose an iterator/borrow instead of cloning the whole structure with its video-mode lists.","locations":[{"ref":"winit-x11/src/monitor.rs:234-246","code":"  234 |     pub fn available_monitors(&self) -> Result<Vec<MonitorHandle>, X11Error> {\n  235 |         let mut monitors_lock = self.monitor_handles.lock().unwrap();\n  236 |         match *monitors_lock {\n  237 |             Some(ref monitors) => Ok(monitors.clone()),\n  238 |             None => {\n  239 |                 let monitors = self.query_monitor_list()?;\n  240 |                 if !DISABLE_MONITOR_LIST_CACHING {\n  241 |                     *monitors_lock = Some(monitors.clone());\n  242 |                 }\n  243 |                 Ok(monitors)\n  244 |             },\n  245 |         }\n  246 |     }","lines":13,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/monitor.rs#L234-L246"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`rgba_to_cardinals` allocates the output `Vec` with `Vec::with_capacity(pixel_count)` but then pushes `pixel_count + 2` elements (the width and height cardinals plus one per pixel). The capacity is always too small by exactly 2, forcing a reallocation and full copy of the (potentially large) icon buffer on every call.","fix":"Reserve the correct size: `let mut data = Vec::with_capacity(pixel_count + 2);`.","locations":[{"ref":"winit-x11/src/util/icon.rs:33-46","code":"   33 | pub(crate) fn rgba_to_cardinals(icon: &RgbaIcon) -> Vec<Cardinal> {\n   34 |     assert_eq!(icon.buffer().len() % PIXEL_SIZE, 0);\n   35 |     let pixel_count = icon.buffer().len() / PIXEL_SIZE;\n   36 |     assert_eq!(pixel_count, (icon.width() * icon.height()) as usize);\n   37 |     let mut data = Vec::with_capacity(pixel_count);\n   38 |     data.push(icon.width() as Cardinal);\n   39 |     data.push(icon.height() as Cardinal);\n   40 |     let pixels = icon.buffer().as_ptr() as *const Pixel;\n   41 |     for pixel_index in 0..pixel_count {\n   42 |         let pixel = unsafe { &*pixels.add(pixel_index) };\n   43 |         data.push(pixel.to_packed_argb());\n   44 |     }\n   45 |     data\n   46 | }","lines":14,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/util/icon.rs#L33-L46"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`.ok_or_else(|| EventLoopError::RecreationAttempt)?` wraps a plain, non-allocating enum variant in a closure; the lazy `ok_or_else` is pointless here.","fix":"Replace with `.ok_or(EventLoopError::RecreationAttempt)?`.","locations":[{"ref":"winit-appkit/src/event_loop.rs:378","code":"  378 |         .ok_or_else(|| EventLoopError::RecreationAttempt)?;","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/event_loop.rs#L378"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`EventLoopWaker::start_at` reconstructs the fractional seconds of a `Duration` by hand (`duration.subsec_nanos() as f64 / 1_000_000_000.0 + duration.as_secs() as f64`). `Duration::as_secs_f64()` does exactly this and is clearer/less error-prone.","fix":"Use `let fsecs = duration.as_secs_f64();`.","locations":[{"ref":"winit-appkit/src/observer.rs:76-79","code":"   76 |                     let duration = instant - now;\n   77 |                     let fsecs = duration.subsec_nanos() as f64 / 1_000_000_000.0\n   78 |                         + duration.as_secs() as f64;\n   79 |                     self.timer.set_next_fire_date(current + fsecs);","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/observer.rs#L76-L79"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`key_text` builds an `Option<SmolStr>` in the `match` (already cloning the `SmolStr` for the `Key::Character` arm) and then applies a redundant `.map(SmolStr::new)`, which allocates a *second* fresh `SmolStr` from the one just produced.","fix":"Drop the trailing `.map(SmolStr::new)` - the `match` already yields the desired `Option<SmolStr>`.","locations":[{"ref":"winit-web/src/web_sys/event.rs:265-274","code":"  265 | pub fn key_text(event: &KeyboardEvent) -> Option<SmolStr> {\n  266 |     let key = key(event);\n  267 |     match &key {\n  268 |         Key::Character(text) => Some(text.clone()),\n  269 |         Key::Named(NamedKey::Tab) => Some(SmolStr::new(\"\\t\")),\n  270 |         Key::Named(NamedKey::Enter) => Some(SmolStr::new(\"\\r\")),\n  271 |         _ => None,\n  272 |     }\n  273 |     .map(SmolStr::new)\n  274 | }","lines":10,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/web_sys/event.rs#L265-L274"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In `FileDropHandler::Drop`, `proposed_action` is computed at line 537 (and used for the `DragPosition` event) and then recomputed identically inside the inner scope at lines 560-561 with the same `effects`; likewise `pdwEffect.read()` is read again into `source_allowed` at line 559 before any write, yielding the same value as `effects`. The recomputation and re-read are redundant.","fix":"Reuse the `proposed_action` computed at line 537 and the `effects` value read at line 536 instead of recomputing/re-reading them inside the scope.","locations":[{"ref":"winit-win32/src/dnd.rs:537-562","code":"  537 |         let effects = unsafe { pdwEffect.read() };\n  538 |         let proposed_action = drop_handler.runner.proposed_dnd_action(data_transfer_id, effects);\n  539 | \n  540 |         let pt_screen = POINT { x: pt.x, y: pt.y };\n  541 |         let mut pt_client = pt_screen;\n  542 |         unsafe {\n  543 |             ScreenToClient(drop_handler.window, &mut pt_client);\n  544 |         }\n  545 |         let pt = pt_client;\n  546 |         let position = PhysicalPosition::new(pt.x as f64, pt.y as f64);\n  547 | \n  548 |         (drop_handler.send_event)(WindowEvent::DragPosition {\n  549 |             id: data_transfer_id,\n  550 |             position,\n  551 |             proposed_action,\n  552 |         });\n  553 | \n  554 |         // New scope to make sure that the `Ref` returned by `current_drag_actions` is dropped\n  555 |         // before we call `remove_data_transfer`.\n  556 |         {\n  557 |             // Get actions after the event handler has run, so that we update it based on the user's\n  558 |             // supplied info.\n  559 |             let actions = drop_handler.runner.current_drag_actions(data_transfer_id);\n  560 |             let source_allowed = unsafe { pdwEffect.read() };\n  561 |             let proposed_action =\n  562 |                 drop_handler.runner.proposed_dnd_action(data_transfer_id, effects);","lines":26,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/dnd.rs#L537-L562"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"very_easy","description":"`winit-win32/src/minimal_ime.rs` is orphaned dead code. `lib.rs` declares every module explicitly (`util`, `dark_mode`, `dnd`, `event_loop`, `icon`, `ime`, `keyboard`, `keyboard_layout`, ...) but never declares `mod minimal_ime;`, so the file is not part of the crate. It also `use`s the `winapi` crate (`use winapi::...`), which is not a dependency of `winit-win32` at all, so the file could not even compile if it were included. The `MinimalIme` type and its `process_message` are unreferenced anywhere in the backend.","fix":"Delete `winit-win32/src/minimal_ime.rs` (IME is handled by `ime.rs` / `ImeContext`), or, if it is intended to be used, add `mod minimal_ime;` to `lib.rs` and port it from `winapi` to `windows_sys` so it compiles.","locations":[{"ref":"winit-win32/src/minimal_ime.rs:1-67","code":"    1 | use std::sync::{\n    2 |     atomic::{AtomicBool, Ordering::Relaxed},\n    3 |     Mutex,\n    4 | };\n    5 | \n    6 | use winapi::{\n    7 |     shared::{\n    8 |         minwindef::{LPARAM, WPARAM},\n    9 |         windef::HWND,\n   10 |     },\n   11 |     um::winuser,\n   12 | };\n   13 | \n   14 | use crate::{event_loop::ProcResult, keyboard::next_kbd_msg};\n   15 | \n   16 | pub struct MinimalIme {\n   17 |     // True if we're currently receiving messages belonging to a finished IME session.\n   18 |     getting_ime_text: AtomicBool,\n   19 | \n   20 |     utf16parts: Mutex<Vec<u16>>,\n   21 | }\n   22 | impl Default for MinimalIme {\n   23 |     fn default() -> Self {\n   24 |         MinimalIme {\n   25 |             getting_ime_text: AtomicBool::new(false),\n   26 |             utf16parts: Mutex::new(Vec::with_capacity(16)),\n   27 |         }\n   28 |     }\n   29 | }\n   30 | impl MinimalIme {\n   31 |     pub(crate) fn process_message(\n   32 |         &self,\n   33 |         hwnd: HWND,\n   34 |         msg_kind: u32,\n   35 |         wparam: WPARAM,\n   36 |         _lparam: LPARAM,\n   37 |         result: &mut ProcResult,\n   38 |     ) -> Option<String> {\n   39 |         match msg_kind {\n   40 |             winuser::WM_IME_ENDCOMPOSITION => {\n   41 |                 self.getting_ime_text.store(true, Relaxed);\n   42 |             }\n   43 |             winuser::WM_CHAR | winuser::WM_SYSCHAR => {\n   44 |                 if self.getting_ime_text.load(Relaxed) {\n   45 |                     *result = ProcResult::Value(0);\n   46 |                     self.utf16parts.lock().unwrap().push(wparam as u16);\n   47 |                     // It's important that we push the new character and release the lock\n   48 |                     // before getting the next message\n   49 |                     let next_msg = next_kbd_msg(hwnd);\n   50 |                     let more_char_coming = next_msg\n   51 |                         .map(|m| matches!(m.message, winuser::WM_CHAR | winuser::WM_SYSCHAR))\n   52 |                         .unwrap_or(false);\n   53 |                     if !more_char_coming {\n   54 |                         let mut utf16parts = self.utf16parts.lock().unwrap();\n   55 |                         let result = String::from_utf16(&utf16parts).ok();\n   56 |                         utf16parts.clear();\n   57 |                         self.getting_ime_text.store(false, Relaxed);\n   58 |                         return result;\n   59 |                     }\n   60 |                 }\n   61 |             }\n   62 |             _ => (),\n   63 |         }\n   64 | \n   65 |         None\n   66 |     }\n   67 | }","lines":67,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/minimal_ime.rs#L1-L67"},{"ref":"winit-win32/src/lib.rs:8-22","code":"    8 | #[macro_use]\n    9 | mod util;\n   10 | mod dark_mode;\n   11 | mod definitions;\n   12 | mod dnd;\n   13 | mod dpi;\n   14 | mod event_loop;\n   15 | mod icon;\n   16 | mod ime {"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`Handlers::on_touch_end` is declared and only ever set to `None` (in the constructor and in `remove_listeners`); it is never assigned a real listener. There is no `touchend` handler registered even though `on_touch_start` exists. The field only compiles silently because `Canvas` carries `#[allow(dead_code)]`.","fix":"Either wire up a `touchend` listener analogous to `on_touch_start` (line 258) or remove the `on_touch_end` field entirely.","locations":[{"ref":"winit-web/src/web_sys/canvas.rs:58","code":"   58 |     on_touch_end: Option<EventListenerHandle<dyn FnMut(Event)>>,","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/web_sys/canvas.rs#L58"},{"ref":"winit-web/src/web_sys/canvas.rs:544","code":"  544 |         handlers.on_touch_end = None;","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/web_sys/canvas.rs#L544"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`PointerHandler::on_touch_cancel` is declared and only ever set to `None` (constructor and `remove_listeners`); no `pointercancel`/touch-cancel listener is ever installed, so touch cancellation is never handled. The field only compiles silently because `PointerHandler` carries `#[allow(dead_code)]`.","fix":"Register a `pointercancel` listener that populates `on_touch_cancel`, or remove the unused field.","locations":[{"ref":"winit-web/src/web_sys/pointer.rs:21","code":"   21 |     on_touch_cancel: Option<EventListenerHandle<dyn FnMut(PointerEvent)>>,","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/web_sys/pointer.rs#L21"},{"ref":"winit-web/src/web_sys/pointer.rs:270","code":"  270 |         self.on_touch_cancel = None;","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-web/src/web_sys/pointer.rs#L270"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`test_run_on_demand_cannot_access_event_loop` is a doctest that is intended to prove re-entrant `run_app_on_demand` fails to compile, but it is broken on three counts and protects nothing. (1) The fence attribute is `compile_error`, which is not a recognized rustdoc code-block attribute; the intended one is `compile_fail`. (2) The doc comment is attached to a *private* `fn`, and `cargo test --doc` only collects doctests from public items, so the snippet is never actually built or run. (3) The snippet calls `run_app_on_demand(|_, _| { ... })` with a closure, but the real signature is `run_app_on_demand<A: ApplicationHandler>(&mut self, app: A)` which takes an `ApplicationHandler`, not a two-argument closure - so even if it were collected it would fail for the wrong reason. The whole construct plus its `#[allow(dead_code)]` marker is dead code.","fix":"Either delete the item, or make it an effective test: change the fence to ```` ```compile_fail ````, move it into a public/documented location (or a real `#[test]` using `trybuild`/`compiletest`), and update the body to use an actual `ApplicationHandler` implementation rather than a closure so the re-entrancy borrow error is what actually triggers the compile failure.","locations":[{"ref":"winit/src/event_loop.rs:465-476","code":"  465 | /// ```compile_error\n  466 | /// use winit::event_loop::run_on_demand::EventLoopExtRunOnDemand;\n  467 | /// use winit::event_loop::EventLoop;\n  468 | ///\n  469 | /// let mut event_loop = EventLoop::new().unwrap();\n  470 | /// event_loop.run_app_on_demand(|_, _| {\n  471 | ///     // Attempt to run the event loop re-entrantly; this must fail.\n  472 | ///     event_loop.run_app_on_demand(|_, _| {});\n  473 | /// });\n  474 | /// ```\n  475 | #[allow(dead_code)]\n  476 | fn test_run_on_demand_cannot_access_event_loop() {}","lines":12,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit/src/event_loop.rs#L465-L476"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`perform_drag_operation` returns a `bool` but the not-found branch does `return false.into()` while the success path returns a bare `true`. `false.into()` is a `bool -> bool` identity conversion (leftover from when the method likely returned an Objective-C `Bool`), which is dead/confusing and inconsistent with the `true` return below it.","fix":"Return `false;` directly to match the `true` return path and drop the no-op `.into()`.","locations":[{"ref":"winit-appkit/src/window_delegate.rs:534-569","code":"  534 |             let Some(transfer_id) =\n  535 |                 vars.app_state.drag_state().borrow().as_ref().map(|state| state.id)\n  536 |             else {\n  537 |                 return false.into();\n  538 |             };\n  539 | \n  540 |             let pb =\n  541 |                 MainThreadBound::new(sender.draggingPasteboard(), MainThreadMarker::new().unwrap());\n  542 | \n  543 |             let source_operations = sender.draggingSourceOperationMask();\n  544 |             // let operations = ns_drag_operation_to_dnd_actions(source_operations);\n  545 | \n  546 |             vars.app_state.pasteboards().set_pasteboard(transfer_id, &pb);\n  547 | \n  548 |             let dl = sender.draggingLocation();\n  549 |             let dl = self.view().convertPoint_fromView(dl, None);\n  550 |             let position =\n  551 |                 LogicalPosition::<f64>::from((dl.x, dl.y)).to_physical(self.scale_factor());\n  552 | \n  553 |             let proposed_action = vars.app_state.proposed_drag_action(source_operations);\n  554 | \n  555 |             self.queue_event(WindowEvent::DragPosition {\n  556 |                 id: transfer_id,\n  557 |                 position,\n  558 |                 proposed_action,\n  559 |             });\n  560 | \n  561 |             // Check again, in case the application updated\n  562 |             let proposed_action = vars.app_state.proposed_drag_action(source_operations);\n  563 | \n  564 |             self.queue_event(WindowEvent::DragDropped { id: transfer_id, proposed_action });\n  565 | \n  566 |             // We assume that if the OS has sent `perform_drag_operation`, that the drag succeeded.\n  567 |             // We may want to extend this API in the future to allow signalling that the final drop\n  568 |             // failed.\n  569 |             true","lines":36,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-appkit/src/window_delegate.rs#L534-L569"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `ImeSurroundingText::new`, the guards `text.is_char_boundary(cursor) && cursor <= text.len()` and `text.is_char_boundary(anchor) && anchor <= text.len()` contain redundant bounds checks: `str::is_char_boundary` already returns `false` for any index greater than `len()` (and `true` at `len()`), so the `<= text.len()` conjuncts can never change the result.","fix":"Drop the redundant `&& cursor <= text.len()` / `&& anchor <= text.len()` conditions.","locations":[{"ref":"winit-core/src/window.rs:1970-1980","code":" 1970 |         let cursor = if text.is_char_boundary(cursor) && cursor <= text.len() {\n 1971 |             cursor\n 1972 |         } else {\n 1973 |             return Err(ImeSurroundingTextError::CursorBadPosition);\n 1974 |         };\n 1975 | \n 1976 |         let anchor = if text.is_char_boundary(anchor) && anchor <= text.len() {\n 1977 |             anchor\n 1978 |         } else {\n 1979 |             return Err(ImeSurroundingTextError::AnchorBadPosition);\n 1980 |         };","lines":11,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/window.rs#L1970-L1980"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`ActiveEventLoop::data_transfer` first tests `if dnd.state().is_none_or(|state| state.transfer_id != id) { return Err(..) }` and then immediately re-checks `let Some(state) = dnd.state() else { return Err(..) };`. After the first guard the state is always present with a matching id, so the second `else` branch is unreachable and the re-fetch is redundant.","fix":"Fold into a single match/`if let` that both checks presence and the `transfer_id` and binds `state` once.","locations":[{"ref":"winit-x11/src/event_loop.rs:817-829","code":"  817 |     fn data_transfer(&self, id: DataTransferId) -> Result<Box<dyn DataTransfer>, RequestError> {\n  818 |         let dnd = self.dnd.borrow();\n  819 | \n  820 |         if dnd.state().is_none_or(|state| state.transfer_id != id) {\n  821 |             return Err(RequestError::Ignored);\n  822 |         }\n  823 | \n  824 |         let Some(state) = dnd.state() else {\n  825 |             return Err(RequestError::Ignored);\n  826 |         };\n  827 | \n  828 |         Ok(Box::new(Selection::new(state.types.clone())))\n  829 |     }","lines":13,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-x11/src/event_loop.rs#L817-L829"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `EventLoopExtStartupNotify::read_token_from_env`, when both `x11_platform` and `wayland_platform` are enabled (the default build) two `let _is_wayland` bindings are emitted: `#[cfg(x11_platform)] let _is_wayland = false;` immediately followed by `#[cfg(wayland_platform)] let _is_wayland = self.is_wayland();`. The first binding is always shadowed and dead in the common default configuration. The `_`-prefix hides the unused-variable warning, so the dead initializer passes silently. It works but is confusing to read.","fix":"Restructure so exactly one binding is active, e.g. use `cfg!(wayland_platform)` at runtime combined with a single `let is_wayland = { #[cfg(wayland_platform)] { self.is_wayland() } #[cfg(not(...))] { false } };`, or gate the whole `false` fallback with `#[cfg(all(x11_platform, not(wayland_platform)))]`.","locations":[{"ref":"winit/src/platform/startup_notify.rs:62-72","code":"   62 |         #[cfg(x11_platform)]\n   63 |         let _is_wayland = false;\n   64 |         #[cfg(wayland_platform)]\n   65 |         let _is_wayland = self.is_wayland();\n   66 | \n   67 |         if _is_wayland {\n   68 |             env::var(WAYLAND_VAR).ok().map(ActivationToken::from_raw)\n   69 |         } else {\n   70 |             env::var(X11_VAR).ok().map(ActivationToken::from_raw)\n   71 |         }\n   72 |     }","lines":11,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit/src/platform/startup_notify.rs#L62-L72"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Every `MIN` constant doc says it \"is equal to\"/\"of [`f64::MAX`]\", but the value is `LogicalUnit::new(f64::MIN)` / `PixelUnit::Logical(LogicalUnit::new(f64::MIN))`. The doc comment references the wrong constant (`f64::MAX` instead of `f64::MIN`).","fix":"Change each `MIN` doc comment from `Represents a minimum ... unit of [\\`f64::MAX\\`].` to `Represents a minimum ... unit that is equal to [\\`f64::MIN\\`].`.","locations":[{"ref":"dpi/src/lib.rs:137-138","code":"  137 |     /// Represents a minimum logical unit of [`f64::MAX`].\n  138 |     pub const MIN: LogicalUnit<f64> = LogicalUnit::new(f64::MIN);","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/dpi/src/lib.rs#L137-L138"},{"ref":"dpi/src/lib.rs:231-232","code":"  231 |     /// Represents a minimum physical unit of [`f64::MAX`].\n  232 |     pub const MIN: LogicalUnit<f64> = LogicalUnit::new(f64::MIN);","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/dpi/src/lib.rs#L231-L232"},{"ref":"dpi/src/lib.rs:325-326","code":"  325 |     /// Represents a minimum logical unit of [`f64::MAX`].\n  326 |     pub const MIN: PixelUnit = PixelUnit::Logical(LogicalUnit::new(f64::MIN));","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/dpi/src/lib.rs#L325-L326"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `SendData` doc comment claims \"it _does_ implement `From<Url>`\", but the only `url`-related `From` impl is `From<Vec<url::Url>>` (taking a `Vec` of URLs, not a single `Url`). There is no `From<url::Url>` impl. The doc misleads users into trying `SendData::from(single_url)`, which will not compile.","fix":"Change the doc to reference the actual impl, e.g. \"it _does_ implement `From<Vec<Url>>`\", or add an additional `impl From<url::Url> for SendData` if a single-URL conversion is intended.","locations":[{"ref":"winit-core/src/data_transfer.rs:391-394","code":"  391 |     /// Note that `SendData` implements `From<String>` and `From<Vec<u8>>`, but _not_\n  392 |     /// `From<Vec<String>>`, as it is not necessarily obvious to a reader that `Vec<String>`\n  393 |     /// will be interpreted as a URI list. However, it _does_ implement [`From<Url>`](url::Url),\n  394 |     /// if you are using the [`url`](https://docs.rs/url/2) crate.","lines":4,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/data_transfer.rs#L391-L394"},{"ref":"winit-core/src/data_transfer.rs:466-470","code":"  466 | impl From<Vec<url::Url>> for SendData {\n  467 |     fn from(value: Vec<url::Url>) -> Self {\n  468 |         Self::Uris(value.into_iter().map(Into::into).collect())\n  469 |     }\n  470 | }","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-core/src/data_transfer.rs#L466-L470"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"`WindowProperties::new` documents the path format as `// /scheme/orbital/flags/x/y/w/h/t` but then parses with `path.splitn(6, '/')`, assigning the six results to `flags,x,y,w,h,title`. That split only yields the intended fields when the path uses the legacy colon-scheme form `orbital:flags/x/y/w/h/title` (no `/` before `flags`). For a genuine `/scheme/orbital/...` path the leading `/scheme/orbital/` segments would be mis-assigned (e.g. `flags = \"\"`, `x = \"scheme\"` -> parses to 0, `title` = the remaining `w/h/title`), so the comment contradicts the code the parser actually relies on. Note the `Display` impl builds the path from `ORBITAL_DISPLAY` (default `/scheme/orbital`), making the documented-vs-parsed formats inconsistent.","fix":"Make the comment describe the exact format the parser expects (the colon-scheme `orbital:flags/x/y/w/h/title`), or - if `fpath` can return `/scheme/orbital/...` - parse robustly by stripping the scheme prefix and splitting the trailing 6 components from the end so both formats work.","locations":[{"ref":"winit-orbital/src/lib.rs:109-121","code":"  109 | impl<'a> WindowProperties<'a> {\n  110 |     fn new(path: &'a str) -> Self {\n  111 |         // /scheme/orbital/flags/x/y/w/h/t\n  112 |         let mut parts = path.splitn(6, '/');\n  113 |         let flags = parts.next().unwrap_or(\"\");\n  114 |         let x = parts.next().map_or(0, |part| part.parse::<i32>().unwrap_or(0));\n  115 |         let y = parts.next().map_or(0, |part| part.parse::<i32>().unwrap_or(0));\n  116 |         let w = parts.next().map_or(0, |part| part.parse::<u32>().unwrap_or(0));\n  117 |         let h = parts.next().map_or(0, |part| part.parse::<u32>().unwrap_or(0));\n  118 |         let title = parts.next().unwrap_or(\"\");\n  119 |         Self { flags, x, y, w, h, title }\n  120 |     }\n  121 | }","lines":13,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-orbital/src/lib.rs#L109-L121"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment above `set_min_surface_size()` reads `/// Set maximum inner window size.`, but the function sets the *minimum* surface size. This is a copy-paste of the comment above `set_max_surface_size()` (which is correct). It is misleading to anyone reading the API.","fix":"Change the comment on `set_min_surface_size()` to `/// Set minimum inner window size.`.","locations":[{"ref":"winit-wayland/src/window/state.rs:1005-1006","code":" 1005 |     /// Set maximum inner window size.\n 1006 |     pub fn set_min_surface_size(&mut self, size: Option<LogicalSize<u32>>) {","lines":2,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-wayland/src/window/state.rs#L1005-L1006"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `MonitorHandle::video_mode_handles` the comment says \"we're using a BTreeSet deduplicate\" while the code actually uses `HashSet::<VideoModeHandle>`, and the inline comment `// Use Ord impl of RootVideoModeHandle` is doubly wrong: insertion into a `HashSet` uses `Hash`/`Eq` (not `Ord`), and the type is `VideoModeHandle`, not `RootVideoModeHandle`.","fix":"Update the comments to reference `HashSet` and the `Hash`/`Eq` impls of `VideoModeHandle`.","locations":[{"ref":"winit-win32/src/monitor.rs:139-143","code":"  139 |     pub(crate) fn video_mode_handles(&self) -> Box<dyn Iterator<Item = VideoModeHandle>> {\n  140 |         // EnumDisplaySettingsExW can return duplicate values (or some of the\n  141 |         // fields are probably changing, but we aren't looking at those fields\n  142 |         // anyway), so we're using a BTreeSet deduplicate\n  143 |         let mut modes = HashSet::<VideoModeHandle>::new();","lines":5,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/monitor.rs#L139-L143"},{"ref":"winit-win32/src/monitor.rs:162","code":"  162 |             // Use Ord impl of RootVideoModeHandle","lines":1,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-win32/src/monitor.rs#L162"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment on `MainRunLoop::remove_observer` states \"This is also done automatically when the `MainRunLoopObserver` is dropped.\" combined with the body being a duplicate of `add_observer` (see the copy-paste finding), the comment describes behavior the method does not implement - the method does not remove anything. Even ignoring the copy-paste bug, the inline comment \"Same as in `add_observer`\" is misleading for a function whose job is the opposite.","fix":"Fix the method to actually remove the observer (see the copy-paste finding) and update the inline comment accordingly.","locations":[{"ref":"winit-common/src/core_foundation/main_run_loop.rs:129-135","code":"  129 |     /// Remove an observer from the main run loop.\n  130 |     ///\n  131 |     /// This is also done automatically when the [`MainRunLoopObserver`] is dropped.\n  132 |     pub fn remove_observer(&self, observer: &MainRunLoopObserver, mode: &CFRunLoopMode) {\n  133 |         // Same as in `add_observer`, accessing the main loop's observer is fine.\n  134 |         self.main_run_loop.add_observer(Some(&observer.observer), Some(mode));\n  135 |     }","lines":7,"link":"https://github.com/rust-windowing/winit/blob/475f5e236366bd2ea5697eea25d3f6c4fc16ad28/winit-common/src/core_foundation/main_run_loop.rs#L129-L135"}]},
