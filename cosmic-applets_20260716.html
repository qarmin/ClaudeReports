<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"easy","description":"`Message::CloseOverflowPopup` is handled with a literal `todo!()`. This message is dispatched from the `view()` function whenever the overflow popup is open and the user clicks anywhere on the main applet row (a `mouse_area` wrapping the panel content has `.on_press(Message::CloseOverflowPopup)`), so opening the overflow popup and then clicking the panel icons crashes the whole applet.","fix":"Implement the handler like `Message::OpenOverflowPopup`'s close branch instead of `todo!()`:\n\n```rust\nMessage::CloseOverflowPopup => {\n    if let Some(id) = self.overflow_popup.take() {\n        return cosmic::surface::surface_task(cosmic::surface::action::destroy_popup(id));\n    }\n}\n```","locations":[{"ref":"cosmic-applet-minimize/src/lib.rs:295","code":"  295 |             Message::CloseOverflowPopup => todo!(),","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/lib.rs#L295"},{"ref":"cosmic-applet-minimize/src/lib.rs:398-402","code":"  398 |         autosize(\n  399 |             if self.overflow_popup.is_some() {\n  400 |                 mouse_area(content)\n  401 |                     .on_press(Message::CloseOverflowPopup)\n  402 |                     .into()","lines":5,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/lib.rs#L398-L402"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `view()`, the active-list overflow cutoff `active_popup_cutoff` is computed in `panel_overflow_lengths()` from the length of the *unfiltered* `self.active_list`, but it is then used to slice the *filtered* `filtered_active_list` (`dock_item`s that pass `is_on_current_monitor_and_workspace`). The guard `if n < filtered_active_list.len() { ... } else { n }` takes the `else` branch and returns the raw, unclamped `n` whenever `n >= filtered_active_list.len()` — including when `n` is strictly greater than `filtered_active_list.len()` (e.g. multi-monitor/workspace filtering removes items so the filtered list is shorter than the active list). `filtered_active_list[..n]` then panics with a slice-index-out-of-range error. The sibling code path for the overflow popup (`overflow_active_popup` branch a few hundred lines below) computes the same thing safely using `.take(...)`, confirming this slicing path is the odd one out.","fix":"Clamp the else-branch to the filtered length instead of returning the raw cutoff:\n\n```rust\nfiltered_active_list[..active_popup_cutoff.map_or(filtered_active_list.len(), |n| {\n    if n < filtered_active_list.len() {\n        n.saturating_sub(1)\n    } else {\n        filtered_active_list.len()\n    }\n})]\n```","locations":[{"ref":"cosmic-app-list/src/app.rs:1896-1913","code":" 1896 |         let filtered_active_list: Vec<_> = self\n 1897 |             .active_list\n 1898 |             .iter()\n 1899 |             .filter(|dock_item| {\n 1900 |                 dock_item.toplevels.iter().any(|(toplevel_info, _)| {\n 1901 |                     self.is_on_current_monitor_and_workspace(toplevel_info)\n 1902 |                 })\n 1903 |             })\n 1904 |             .collect();\n 1905 | \n 1906 |         let mut active: Vec<_> =\n 1907 |             filtered_active_list[..active_popup_cutoff.map_or(filtered_active_list.len(), |n| {\n 1908 |                 if n < filtered_active_list.len() {\n 1909 |                     n.saturating_sub(1)\n 1910 |                 } else {\n 1911 |                     n\n 1912 |                 }\n 1913 |             })]","lines":18,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-app-list/src/app.rs#L1896-L1913"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`get_power_profile` panics via `panic!(\"Unknown power profile: {power}\")` when the `com.system76.PowerDaemon` `GetProfile` D-Bus method returns any string other than exactly \"Battery\", \"Balanced\", or \"Performance\". This is data coming from an external system service; a daemon version mismatch or a new profile name would crash the whole subscription task. Notably, the sibling match arm for `PowerProfilesDaemon` a few lines below handles an unrecognized string gracefully by defaulting to `Power::Balanced`, showing the two backends were implemented inconsistently.","fix":"Make the S76PowerDaemon branch degrade the same way the PowerProfilesDaemon branch does instead of panicking:\n\n```rust\nmatch power.as_str() {\n    \"Battery\" => Ok(Power::Battery),\n    \"Balanced\" => Ok(Power::Balanced),\n    \"Performance\" => Ok(Power::Performance),\n    _ => {\n        tracing::warn!(\"Unknown power profile: {power}\");\n        Ok(Power::Balanced)\n    }\n}\n```","locations":[{"ref":"cosmic-applet-battery/src/backend/mod.rs:61-81","code":"   61 | pub async fn get_power_profile(daemon: Backend<'_>) -> Result<Power> {\n   62 |     match daemon {\n   63 |         Backend::S76PowerDaemon(p) => {\n   64 |             let power = p.get_profile().await?;\n   65 |             match power.as_str() {\n   66 |                 \"Battery\" => Ok(Power::Battery),\n   67 |                 \"Balanced\" => Ok(Power::Balanced),\n   68 |                 \"Performance\" => Ok(Power::Performance),\n   69 |                 _ => panic!(\"Unknown power profile: {power}\"),\n   70 |             }\n   71 |         }\n   72 |         Backend::PowerProfilesDaemon(ppd) => {\n   73 |             let power = ppd.active_profile().await?;\n   74 |             match power.as_str() {\n   75 |                 \"power-saver\" => Ok(Power::Battery),\n   76 |                 \"performance\" => Ok(Power::Performance),\n   77 |                 _ => Ok(Power::Balanced),\n   78 |             }\n   79 |         }\n   80 |     }\n   81 | }","lines":21,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-battery/src/backend/mod.rs#L61-L81"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`WaylandUpdate::Finished` is handled by calling `panic!(\"Wayland Subscription ended...\")`, which aborts the whole applet process. The wayland toplevel subscription can legitimately end (compositor restart, protocol object destroyed, connection drop), so this turns a recoverable event into a guaranteed crash. Other applets in this same audit slice (e.g. cosmic-applet-bluetooth) handle an analogous 'subscription finished' event with `std::process::exit` instead of a raw panic.","fix":"Replace the panic with a controlled exit or restart, e.g.:\n\n```rust\nWaylandUpdate::Finished => {\n    tracing::error!(\"Wayland subscription ended unexpectedly, exiting\");\n    std::process::exit(1);\n}\n```","locations":[{"ref":"cosmic-applet-minimize/src/lib.rs:171-173","code":"  171 |                 WaylandUpdate::Finished => {\n  172 |                     panic!(\"Wayland Subscription ended...\")\n  173 |                 }","lines":3,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/lib.rs#L171-L173"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`Notifications::init` fetches the notifications-daemon proxy with `block_on(get_proxy()).expect(\"Failed to get proxy\")`. `get_proxy()` reads `COSMIC_NOTIFICATIONS` from the environment and parses it as a raw fd; if the applet is ever launched without that env var (wrong launch order, daemon not ready, manual run for debugging) this panics and takes down the whole applet at startup instead of degrading gracefully.","fix":"Store the proxy as `Option<NotificationsAppletProxy<'static>>` and handle the failure without panicking:\n\n```rust\nproxy: block_on(crate::subscriptions::notifications::get_proxy())\n    .map_err(|e| tracing::error!(\"Failed to get notifications proxy: {e}\"))\n    .ok(),\n```\n\nand adjust call sites (e.g. `subscription()`) to skip the `notifications()` subscription when `self.proxy` is `None`.","locations":[{"ref":"cosmic-applet-notifications/src/lib.rs:116-119","code":"  116 |             token_tx: Option::default(),\n  117 |             proxy: block_on(crate::subscriptions::notifications::get_proxy())\n  118 |                 .expect(\"Failed to get proxy\"),\n  119 |             notifications_tx: None,","lines":4,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-notifications/src/lib.rs#L116-L119"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`Msg::TogglePopup(id)` sets `self.open_menu = Some(id)` purely based on whether a popup was already open, without checking that `id` still exists in `self.menus`. It then unconditionally does `self.menus[&id].opened()` (BTreeMap indexing panics if the key is absent) and the popup-settings closure does `app.menus.keys().position(|&i| i == id).unwrap()`. If a tray item unregisters (app quits) in the window between the user's click being queued and this message being processed, both of these panic and crash the whole status-area applet, dropping every remaining tray icon until the panel restarts it.","fix":"```rust\n// before\nif self.open_menu.is_some() {\n    self.menus[&id].opened();\n    ...\n\n// after\nif self.open_menu.is_some() {\n    let Some(menu) = self.menus.get(&id) else {\n        self.open_menu = None;\n        return Task::none();\n    };\n    menu.opened();\n    ...\n```\nand change `app.menus.keys().position(|&i| i == id).unwrap()` inside the popup-settings closure to bail out (returning a default/no-op `PopupSettings`) if the id is no longer present.","locations":[{"ref":"cosmic-applet-status-area/src/components/app.rs:235-243","code":"  235 |             Msg::TogglePopup(id) => {\n  236 |                 self.open_menu = if self.open_menu.is_none() {\n  237 |                     Some(id)\n  238 |                 } else {\n  239 |                     None\n  240 |                 };\n  241 |                 if self.open_menu.is_some() {\n  242 |                     self.menus[&id].opened();\n  243 | ","lines":9,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/components/app.rs#L235-L243"},{"ref":"cosmic-applet-status-area/src/components/app.rs:249-264","code":"  249 |                     let popup_task =\n  250 |                         cosmic::surface::surface_task(cosmic::surface::action::app_popup(\n  251 |                             |_| Default::default(),\n  252 |                             move |app: &mut Self| {\n  253 |                                 let popup_id = app.next_popup_id();\n  254 |                                 let i = app.menus.keys().position(|&i| i == id).unwrap();\n  255 |                                 let (i, parent) = app\n  256 |                                     .overflow_index()\n  257 |                                     .and_then(|overflow_i| {\n  258 |                                         if overflow_i <= i {\n  259 |                                             Some(i - overflow_i).zip(app.overflow_popup)\n  260 |                                         } else {\n  261 |                                             Some((i, app.core.main_window_id().unwrap()))\n  262 |                                         }\n  263 |                                     })\n  264 |                                     .unwrap_or((i, app.core.main_window_id().unwrap()));","lines":16,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/components/app.rs#L249-L264"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"When handling `WaylandUpdate::ActivationToken`, `gpus[idx]` indexes `self.gpus` directly with the `gpu_idx` that was captured in the UI at menu-render time. Because GPU discovery (`try_get_gpus`) is re-run asynchronously (e.g. every time the right-click popup opens) and can complete after the user already clicked a specific 'Run on GPU N' menu entry, `self.gpus` can be replaced with a shorter/reordered list before the roundtrip activation-token response arrives, making `idx` stale and out of bounds, causing an index-out-of-bounds panic.","fix":"Use a bounds-checked lookup and skip silently (or log) instead of panicking:\n\n```rust\nif let (Some(gpus), Some(idx)) = (self.gpus.as_ref(), gpu_idx)\n    && let Some(gpu) = gpus.get(idx)\n{\n    envs.extend(gpu.environment.iter().map(|(k, v)| (k.clone(), v.clone())));\n}\n```","locations":[{"ref":"cosmic-app-list/src/app.rs:1498-1504","code":" 1498 |                         if let (Some(gpus), Some(idx)) = (self.gpus.as_ref(), gpu_idx) {\n 1499 |                             envs.extend(\n 1500 |                                 gpus[idx]\n 1501 |                                     .environment\n 1502 |                                     .iter()\n 1503 |                                     .map(|(k, v)| (k.clone(), v.clone())),\n 1504 |                             );","lines":7,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-app-list/src/app.rs#L1498-L1504"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The filter closure over `nvidia-smi pmon` output does `let components = line.split_whitespace().collect::<Vec<_>>(); components[1]...` without checking `components.len()`. If any line yields fewer than 2 whitespace-separated tokens (e.g. a blank trailing line in the process output), this indexes out of bounds and panics, taking down the dGPU app-list polling task on external tool output that this code does not control.","fix":"Guard the indexing with a length check:\n\n```rust\n.filter(|line| {\n    let components = line.split_whitespace().collect::<Vec<_>>();\n    components.len() > 1 && components[1].trim().ne(\"-\") && !line.starts_with('#')\n})\n```","locations":[{"ref":"cosmic-applet-battery/src/dgpu.rs:239-246","code":"  239 |             Some(\n  240 |                 smi_output\n  241 |                     .lines()\n  242 |                     .filter(|line| {\n  243 |                         // smi shows an empty line filled with - when no app is running\n  244 |                         let components = line.split_whitespace().collect::<Vec<_>>();\n  245 |                         components[1].trim().ne(\"-\") && !line.starts_with('#')\n  246 |                     })","lines":8,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-battery/src/dgpu.rs#L239-L246"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`CaptureData::capture_source_shm_fd` unwraps several fallible Wayland operations (`create_session(...).unwrap()`, two `self.conn.flush().unwrap()` calls, and `.formats.take().unwrap()` / `.res.take().unwrap()` after waiting on the condvar). Any of these can legitimately fail if the compositor connection drops or the toplevel disappears mid-capture (e.g. the window closes while its thumbnail is being grabbed), which panics the dedicated capture thread spawned per-minimize instead of just failing that one capture.","fix":"Change `capture_source_shm_fd` to return `Result<Option<ShmImage<Fd>>, anyhow::Error>` (or similar) and propagate failures with `?`/early `return None` plus a `tracing::error!`, instead of unwrapping connection/session results that depend on external compositor state.","locations":[{"ref":"cosmic-applet-minimize/src/wayland_handler.rs:149-161","code":"  149 |         let capture_session = self\n  150 |             .capturer\n  151 |             .create_session(\n  152 |                 &CaptureSource::Toplevel(source),\n  153 |                 CaptureOptions::empty(),\n  154 |                 &self.qh,\n  155 |                 SessionData {\n  156 |                     session: session.clone(),\n  157 |                     session_data: ScreencopySessionData::default(),\n  158 |                 },\n  159 |             )\n  160 |             .unwrap();\n  161 |         self.conn.flush().unwrap();","lines":13,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/wayland_handler.rs#L149-L161"},{"ref":"cosmic-applet-minimize/src/wayland_handler.rs:163-167","code":"  163 |         let formats = session\n  164 |             .wait_while(|data| data.formats.is_none())\n  165 |             .formats\n  166 |             .take()\n  167 |             .unwrap();","lines":5,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/wayland_handler.rs#L163-L167"},{"ref":"cosmic-applet-minimize/src/wayland_handler.rs:210","code":"  210 |         self.conn.flush().unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/wayland_handler.rs#L210"},{"ref":"cosmic-applet-minimize/src/wayland_handler.rs:213-217","code":"  213 |         let res = session\n  214 |             .wait_while(|data| data.res.is_none())\n  215 |             .res\n  216 |             .take()\n  217 |             .unwrap();","lines":5,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/wayland_handler.rs#L213-L217"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`overflow_index()` computes `let btn_count = max_major_axis_len / button_total_size as u32;` with no guard against `button_total_size` being `0`. If the panel/applet ever reports a `suggested_size(true).0` and `suggested_padding(true).1` of zero (e.g. during a transient resize/configure with degenerate bounds), this is an integer division by zero, which panics unconditionally (unlike overflow checks, division-by-zero panics in both debug and release builds).","fix":"Guard the division: `let btn_count = max_major_axis_len.checked_div(button_total_size as u32).unwrap_or(u32::MAX);` (treating a zero button size as \"everything fits\") or early-return `None` when `button_total_size == 0`.","locations":[{"ref":"cosmic-applet-status-area/src/components/app.rs:90-96","code":"   90 |         let button_total_size = self.core.applet.suggested_size(true).0\n   91 |             + self.core.applet.suggested_padding(true).1 * 2;\n   92 | \n   93 |         let menu_count = self.menus.len();\n   94 | \n   95 |         let btn_count = max_major_axis_len / button_total_size as u32;\n   96 |         if btn_count >= menu_count as u32 {","lines":7,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/components/app.rs#L90-L96"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`layout_subscription` and `icon_subscription` call `.unwrap()` on `receive_layout_updated()`, `receive_items_properties_updated()`, and `receive_new_icon()`. These D-Bus signal-stream setup calls can return `Err` if the peer disconnects or the introspection/match-rule registration fails while the tray item is disappearing (a normal, externally-triggered race, not a programming error). A panic here takes down that item's subscription task silently instead of just dropping the item.","fix":"Propagate the error into the stream instead of panicking, e.g. return an empty/error stream on failure:\n\n```rust\nlet Ok(layout_updated) = menu_proxy.receive_layout_updated().await else {\n    return futures::stream::empty().flatten_stream();\n};\n```\nApply the same pattern to `receive_items_properties_updated` and `receive_new_icon`.","locations":[{"ref":"cosmic-applet-status-area/src/subscriptions/status_notifier_item.rs:100-102","code":"  100 |                     let layout_updated = menu_proxy.receive_layout_updated().await.unwrap();\n  101 |                     let props_updated =\n  102 |                         menu_proxy.receive_items_properties_updated().await.unwrap();","lines":3,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/subscriptions/status_notifier_item.rs#L100-L102"},{"ref":"cosmic-applet-status-area/src/subscriptions/status_notifier_item.rs:148-148","code":"  148 |                     let new_icon_stream = item_proxy.receive_new_icon().await.unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/subscriptions/status_notifier_item.rs#L148"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In the `org.kde.StatusNotifierWatcher` D-Bus interface implementation, both the registration and unregistration paths call `.unwrap()` after emitting a signal (`status_notifier_item_registered` / `status_notifier_item_unregistered`), and `hdr.sender()` is also unwrapped. If the signal emission fails (e.g. the bus connection drops momentarily) this panics inside a `tokio::spawn`-ed task that is the sole handler for all future item registrations/unregistrations for the whole status-area daemon, permanently breaking status icon tracking for all clients until the daemon is restarted.","fix":"Log and continue instead of unwrapping, e.g.:\n\n```rust\nif let Err(err) = Self::status_notifier_item_registered(&ctxt, &service).await {\n    eprintln!(\"Failed to emit status_notifier_item_registered: {err}\");\n}\n```\nApply the same pattern to the unregister call, and use `hdr.sender()` via an `if let Some(sender) = ... else { return; }` guard instead of `.unwrap()`.","locations":[{"ref":"cosmic-applet-status-area/src/subscriptions/status_notifier_watcher/server.rs:28-49","code":"   28 |     async fn register_status_notifier_item(\n   29 |         &mut self,\n   30 |         service: &str,\n   31 |         #[zbus(header)] hdr: Header<'_>,\n   32 |         #[zbus(signal_emitter)] ctxt: SignalEmitter<'_>,\n   33 |     ) {\n   34 |         let sender = hdr.sender().unwrap();\n   35 |         let service = if service.starts_with('/') {\n   36 |             format!(\"{sender}{service}\")\n   37 |         } else {\n   38 |             service.to_string()\n   39 |         };\n   40 | \n   41 |         // Ignore duplicate\n   42 |         if !self.items.iter().any(|(a, b)| (a, b) == (sender, &service)) {\n   43 |             Self::status_notifier_item_registered(&ctxt, &service)\n   44 |                 .await\n   45 |                 .unwrap();\n   46 | \n   47 |             self.items.push((sender.to_owned(), service));\n   48 |         }\n   49 |     }","lines":22,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/subscriptions/status_notifier_watcher/server.rs#L28-L49"},{"ref":"cosmic-applet-status-area/src/subscriptions/status_notifier_watcher/server.rs:121-136","code":"  121 |             } else if let BusName::Unique(name) = &args.name {\n  122 |                 if args.new_owner.is_none() {\n  123 |                     let mut interface = interface.get_mut().await;\n  124 |                     if let Some(idx) = interface\n  125 |                         .items\n  126 |                         .iter()\n  127 |                         .position(|(unique_name, _)| unique_name == name)\n  128 |                     {\n  129 |                         let ctxt = SignalEmitter::new(&connection, OBJECT_PATH).unwrap();\n  130 |                         let service = interface.items.remove(idx).1;\n  131 |                         StatusNotifierWatcher::status_notifier_item_unregistered(&ctxt, &service)\n  132 |                             .await\n  133 |                             .unwrap();\n  134 |                     }\n  135 |                 }\n  136 |             }","lines":16,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/subscriptions/status_notifier_watcher/server.rs#L121-L136"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"hard","description":"`WindowImage::layout` indexes directly into the internal widget tree (`button_node.children()[0].children()[0]`, `children[0]`/`children[1]` on the `Tree`) assuming the `button::custom(container(container(...)))` structure always yields exactly this shape. Any future change to the button/container widget internals (in the `cosmic`/`iced` dependency) that alters the number or nesting of child nodes would turn this into an out-of-bounds panic here rather than a compile error.","fix":"Use `.get(0)`/`.get(1)` with graceful fallbacks (e.g. skip icon overlay positioning) instead of direct indexing, or restructure `WindowImage` to hold explicit child widgets rather than reaching into a generically-composed button's tree.","locations":[{"ref":"cosmic-applet-minimize/src/window_image.rs:126-137","code":"  126 |         let children = &mut tree.children;\n  127 |         let button = &mut children[0];\n  128 |         let button_node = self\n  129 |             .image_button\n  130 |             .as_widget_mut()\n  131 |             .layout(button, renderer, limits);\n  132 |         let img_node = &button_node.children()[0].children()[0];\n  133 | \n  134 |         let button_bounds = img_node.size();\n  135 |         let icon_width = button_bounds.width.max(button_bounds.height) / 3.0;\n  136 |         let icon_height = button_bounds.height.max(button_bounds.width) / 3.0;\n  137 |         let icon = &mut children[1];","lines":12,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/window_image.rs#L126-L137"}]},{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`app.core.main_window_id().unwrap()` is used unguarded in the popup-positioning closures of all four applets. If `main_window_id()` is ever `None` (e.g. called before the shell finishes handshaking the main surface, or during a teardown race), this panics the applet instead of falling back gracefully. The same pattern repeats at roughly a dozen call sites across these crates.","fix":"Replace `.unwrap()` with a guarded fallback, e.g. `let Some(main_id) = app.core.main_window_id() else { return Default::default(); };`, or propagate an error/log instead of panicking.","locations":[{"ref":"cosmic-applet-network/src/app.rs:1116","code":" 1116 |                                     app.core.main_window_id().unwrap(),","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-network/src/app.rs#L1116"},{"ref":"cosmic-applet-notifications/src/lib.rs:167","code":"  167 |                                 app.core.main_window_id().unwrap(),","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-notifications/src/lib.rs#L167"},{"ref":"cosmic-applet-power/src/lib.rs:134","code":"  134 |                                 app.core.main_window_id().unwrap(),","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-power/src/lib.rs#L134"},{"ref":"cosmic-applet-status-area/src/components/app.rs:76","code":"   76 |             self.core.main_window_id().unwrap(),","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/components/app.rs#L76"}]},{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`watch()` calls `.unwrap()` on `connection.unique_name()`, which is `None` for connections that are not (yet) fully registered on the bus. The surrounding function already returns `zbus::Result<EventStream>`, so this can be propagated as a proper error instead of panicking.","fix":"```rust\n// before\nlet name = connection.unique_name().unwrap().as_str();\n// after\nlet name = connection\n    .unique_name()\n    .ok_or_else(|| zbus::Error::Failure(\"connection has no unique name\".into()))?\n    .as_str();\n```","locations":[{"ref":"cosmic-applet-status-area/src/subscriptions/status_notifier_watcher/client.rs:34-34","code":"   34 |     let name = connection.unique_name().unwrap().as_str();","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/subscriptions/status_notifier_watcher/client.rs#L34"}]},{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Window`'s render methods (`calendar_grid`, `vertical_layout`, `horizontal_layout`, `view_window`) call `DateTimeFormatter::try_new(prefs, ...).unwrap()` eight separate times, on every redraw (which happens at least once per second when seconds are shown). If the active `locale`/`fieldset`/`hour_cycle` combination is ever unsupported by ICU (e.g. an exotic locale from `get_system_locale`, or a future preference combination), every draw call panics, crashing the applet's render loop.","fix":"Fall back to a default/plain formatter (or the previous successfully-built formatter) with `.unwrap_or_else(...)` instead of `.unwrap()`, so a bad locale/fieldset combination degrades the display rather than panicking the whole applet.","locations":[{"ref":"cosmic-applet-time/src/window.rs:150-150","code":"  150 |         let weekday = DateTimeFormatter::try_new(prefs, fieldsets::E::short()).unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-time/src/window.rs#L150"},{"ref":"cosmic-applet-time/src/window.rs:210-212","code":"  210 |                 let formatted_date = DateTimeFormatter::try_new(prefs, fieldsets::MD::medium())\n  211 |                     .unwrap()\n  212 |                     .format(&datetime)","lines":3,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-time/src/window.rs#L210-L212"},{"ref":"cosmic-applet-time/src/window.rs:228-231","code":"  228 |             let formatted_time = DateTimeFormatter::try_new(prefs, fs)\n  229 |                 .unwrap()\n  230 |                 .format(&datetime)\n  231 |                 .to_string();","lines":4,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-time/src/window.rs#L228-L231"},{"ref":"cosmic-applet-time/src/window.rs:277-280","code":"  277 |                     DateTimeFormatter::try_new(prefs, fs)\n  278 |                         .unwrap()\n  279 |                         .format(&datetime)\n  280 |                         .to_string()","lines":4,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-time/src/window.rs#L277-L280"},{"ref":"cosmic-applet-time/src/window.rs:286-289","code":"  286 |                     DateTimeFormatter::try_new(prefs, fs)\n  287 |                         .unwrap()\n  288 |                         .format(&datetime)\n  289 |                         .to_string()","lines":4,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-time/src/window.rs#L286-L289"},{"ref":"cosmic-applet-time/src/window.rs:296-299","code":"  296 |                 DateTimeFormatter::try_new(prefs, fs)\n  297 |                     .unwrap()\n  298 |                     .format(&datetime)\n  299 |                     .to_string()","lines":4,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-time/src/window.rs#L296-L299"},{"ref":"cosmic-applet-time/src/window.rs:722-724","code":"  722 |             DateTimeFormatter::try_new(prefs, fieldsets::YMD::long())\n  723 |                 .unwrap()\n  724 |                 .format(&datetime)","lines":3,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-time/src/window.rs#L722-L724"},{"ref":"cosmic-applet-time/src/window.rs:729-731","code":"  729 |             DateTimeFormatter::try_new(prefs, fieldsets::E::long())\n  730 |                 .unwrap()\n  731 |                 .format(&datetime)","lines":3,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-time/src/window.rs#L729-L731"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`run()` uses `panic!` (via `map_or_else`) if the located `.desktop` file lacks a `Name` or `Exec` key, and `desktop.unwrap_or_else(|| panic!(...))` if no desktop file is found at all. These are externally-supplied files (system desktop entries), so a malformed or missing entry — plausible after a packaging mistake or partial uninstall — crashes the applet with a raw panic instead of a clear startup error/log message and graceful exit.","fix":"Replace the `panic!` calls with `eprintln!` (or `tracing::error!`) followed by `std::process::exit(1)`, so a missing/malformed desktop entry produces a clean diagnostic instead of a Rust panic backtrace.","locations":[{"ref":"cosmic-panel-button/src/lib.rs:215-246","code":"  215 | pub fn run() -> iced::Result {\n  216 |     let id = env::args()\n  217 |         .nth(1)\n  218 |         .expect(\"Requires desktop file id as argument.\");\n  219 |     let filename = format!(\"{id}.desktop\");\n  220 |     let mut desktop = None;\n  221 |     let locales = get_languages_from_env();\n  222 | \n  223 |     for mut path in fde::default_paths() {\n  224 |         path.push(&filename);\n  225 |         if let Ok(bytes) = fs::read_to_string(&path) {\n  226 |             if let Ok(entry) = DesktopEntry::from_str(&path, &bytes, Some(&locales)) {\n  227 |                 desktop = Some(Desktop {\n  228 |                     name: entry.name(&locales).map_or_else(\n  229 |                         || panic!(\"Desktop file '{filename}' doesn't have `Name`\"),\n  230 |                         |x| x.to_string(),\n  231 |                     ),\n  232 |                     icon: entry.icon().map(|x| x.to_string()),\n  233 |                     exec: entry.exec().map_or_else(\n  234 |                         || panic!(\"Desktop file '{filename}' doesn't have `Exec`\"),\n  235 |                         |x| x.to_string(),\n  236 |                     ),\n  237 |                 });\n  238 |                 break;\n  239 |             }\n  240 |         }\n  241 |     }\n  242 |     let desktop = desktop.unwrap_or_else(|| {\n  243 |         panic!(\"Failed to find valid desktop file '{filename}' in search paths\")\n  244 |     });\n  245 |     cosmic::applet::run::<Button>(desktop)\n  246 | }","lines":32,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-panel-button/src/lib.rs#L215-L246"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"very_easy","description":"In `Model::update` for `audio_client::Event::Route`, when the vector needs to grow to fit `index`, `additional` is computed as `(index as usize + 1) - routes.capacity()` instead of using `routes.len()`. Because `Vec` capacity is frequently larger than length (due to exponential growth on previous pushes), `routes.capacity()` can exceed `index + 1` even though `routes.len() < index + 1` (the condition that guards this branch), causing the subtraction to underflow. In debug builds this panics immediately; in release builds it wraps to a huge `usize` and `reserve_exact`/`extend` then attempts a near-`usize::MAX`-sized allocation, aborting the process. This is reachable from ordinary pipewire route-change events.","fix":"Compute the missing element count from the vector's length, not its capacity:\n\n```rust\n// before\nlet additional = (index as usize + 1) - routes.capacity();\n\n// after\nlet additional = (index as usize + 1) - routes.len();\n```","locations":[{"ref":"cosmic-applet-audio/src/model.rs:294-306","code":"  294 |             audio_client::Event::Route(device_id, index, route) => {\n  295 |                 let routes = self.device_routes.entry(device_id).or_default();\n  296 |                 if index == 0 {\n  297 |                     *routes = vec![route];\n  298 |                 } else {\n  299 |                     if routes.len() < index as usize + 1 {\n  300 |                         let additional = (index as usize + 1) - routes.capacity();\n  301 |                         routes.reserve_exact(additional);\n  302 |                         routes.extend(std::iter::repeat_n(RouteInfo::default(), additional));\n  303 |                     }\n  304 |                     routes[index as usize] = route;\n  305 |                 }\n  306 |             }","lines":13,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-audio/src/model.rs#L294-L306"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`panel_overflow_lengths()` computes `max_major_axis_len` from `suggested_bounds` (an externally-provided `f32` configure size) cast to `u32`, then unconditionally does `max_major_axis_len -= 1;`. If the compositor ever reports a suggested width/height of `0` for the relevant axis (e.g. during an initial or transient configure before real layout is known), this subtracts 1 from 0, which panics in debug builds and wraps to `u32::MAX` in release builds, corrupting all subsequent overflow-length math for that frame.","fix":"Use a saturating subtraction so a zero-sized configure degrades gracefully instead of underflowing:\n\n```rust\nmax_major_axis_len = max_major_axis_len.saturating_sub(1);\n```","locations":[{"ref":"cosmic-app-list/src/app.rs:717-728","code":"  717 |         let Some(mut max_major_axis_len) = self.core.applet.suggested_bounds.as_ref().map(|c| {\n  718 |             // if we have a configure for width and height, we're in a overflow popup\n  719 |             match self.core.applet.anchor {\n  720 |                 PanelAnchor::Top | PanelAnchor::Bottom => c.width as u32,\n  721 |                 PanelAnchor::Left | PanelAnchor::Right => c.height as u32,\n  722 |             }\n  723 |         }) else {\n  724 |             return (None, active_index);\n  725 |         };\n  726 |         // tracing::error!(\"{} {}\", max_major_axis_len, self.pinned_list.len());\n  727 |         // subtract the divider width\n  728 |         max_major_axis_len -= 1;","lines":12,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-app-list/src/app.rs#L717-L728"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`time_to_empty` (UPower's `TimeToEmpty` D-Bus property, an `i64`) is cast directly with `time_to_empty as u64` before being passed to `Duration::from_secs`. If the daemon ever reports a negative value (UPower's spec allows negative/unknown sentinel values for this property), the cast wraps around to a value near `u64::MAX`, producing an absurd multi-billion-year 'time until empty' displayed to the user instead of being treated as unknown.","fix":"Clamp negative values before casting:\n\n```rust\nself.time_remaining = Duration::from_secs(time_to_empty.max(0) as u64);\n```","locations":[{"ref":"cosmic-applet-battery/src/app.rs:406-415","code":"  406 |             Message::UpowerDevice(event) => match event {\n  407 |                 DeviceDbusEvent::Update {\n  408 |                     on_battery,\n  409 |                     percent,\n  410 |                     time_to_empty,\n  411 |                 } => {\n  412 |                     self.no_battery = false;\n  413 |                     self.update_battery(percent, on_battery);\n  414 |                     self.time_remaining = Duration::from_secs(time_to_empty as u64);\n  415 |                 }","lines":10,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-battery/src/app.rs#L406-L415"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`let buf_len = width * height * 4;` multiplies `u32` dimensions reported by the compositor (`formats.buffer_size`) with no overflow check. In a release build this silently wraps; the resulting (possibly tiny or, once cast `as i32` for `create_pool`, negative) buffer size would then be used to size the shm pool, which is a Wayland protocol violation the compositor may respond to by killing the connection - taking down the whole minimize-applet Wayland thread over a single toplevel's screenshot.","fix":"Use `width.checked_mul(height).and_then(|a| a.checked_mul(4))` and return `None` (logging an error) if it overflows, before using `buf_len` to size the shm pool/buffer.","locations":[{"ref":"cosmic-applet-minimize/src/wayland_handler.rs:168-181","code":"  168 |         let (width, height) = formats.buffer_size;\n  169 | \n  170 |         if width == 0 || height == 0 {\n  171 |             return None;\n  172 |         }\n  173 | \n  174 |         // XXX\n  175 |         if !formats.shm_formats.contains(&wl_shm::Format::Abgr8888) {\n  176 |             tracing::error!(\"No suitable buffer format found\");\n  177 |             tracing::warn!(\"Available formats: {:#?}\", formats);\n  178 |             return None;\n  179 |         }\n  180 | \n  181 |         let buf_len = width * height * 4;","lines":14,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/wayland_handler.rs#L168-L181"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Nodes::remove` removes the element at `pos` from every backing `Vec` (shifting all later elements down by one index) but only clears `self.active` when `self.active == Some(pos)`. If `self.active` was `Some(x)` with `x > pos`, it is left unchanged even though the node it used to reference is now at index `x - 1`; `self.active` therefore silently points at the wrong node (the one that used to follow it) until the next `DefaultSink`/`DefaultSource`/`Node` event happens to refresh it, causing the wrong device to be reported as active for volume/mute display.","fix":"Decrement `active` when it refers to an index after the removed element:\n\n```rust\nif self.active == Some(pos) {\n    self.active = None;\n} else if let Some(active) = self.active\n    && active > pos\n{\n    self.active = Some(active - 1);\n}\n```","locations":[{"ref":"cosmic-applet-audio/src/model.rs:63-81","code":"   63 |     pub fn remove(&mut self, node_id: u32) -> bool {\n   64 |         let Some(pos) = self.id.iter().position(|id| node_id == *id) else {\n   65 |             return false;\n   66 |         };\n   67 |         self.balance.remove(pos);\n   68 |         self.card_profile_device.remove(pos);\n   69 |         self.description.remove(pos);\n   70 |         self.devices.remove(pos);\n   71 |         self.display.remove(pos);\n   72 |         self.mute.remove(pos);\n   73 |         self.name.remove(pos);\n   74 |         self.id.remove(pos);\n   75 |         self.volume.remove(pos);\n   76 |         self.dropdown_sort();\n   77 |         if self.active == Some(pos) {\n   78 |             self.active = None;\n   79 |         }\n   80 |         true\n   81 |     }","lines":19,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-audio/src/model.rs#L63-L81"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `status_menu::State::update`, `Msg::ClickToken` toggles submenu expansion with `self.expanded = if self.expanded.is_none() { Some(id) } else { None }`. This only supports collapsing an already-expanded submenu; if a different submenu `id2` is clicked while another submenu is expanded, the code collapses everything to `None` instead of switching to expand `id2`, requiring a second click to actually open the newly-clicked submenu.","fix":"```rust\n// before\nif is_submenu {\n    self.expanded = if self.expanded.is_none() {\n        Some(id)\n    } else {\n        None\n    };\n}\n\n// after\nif is_submenu {\n    self.expanded = if self.expanded == Some(id) { None } else { Some(id) };\n}\n```","locations":[{"ref":"cosmic-applet-status-area/src/components/status_menu.rs:138-146","code":"  138 |                 if is_submenu {\n  139 |                     self.expanded = if self.expanded.is_none() {\n  140 |                         Some(id)\n  141 |                     } else {\n  142 |                         None\n  143 |                     };\n  144 |                 } else {\n  145 |                     // TODO: Close menu?\n  146 |                 }","lines":9,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-status-area/src/components/status_menu.rs#L138-L146"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`format_duration` uses `if secs > 60` to decide between the 'minutes' and 'seconds' formatting branches. At exactly 60 seconds this is false, so the UI prints '60 seconds' instead of '1 minute', which is inconsistent with how every other value above 59 seconds is rendered.","fix":"Use `>=` so the minute boundary is inclusive:\n\n```rust\n// before\nif secs > 60 {\n\n// after\nif secs >= 60 {\n```","locations":[{"ref":"cosmic-applet-battery/src/app.rs:48-60","code":"   48 | fn format_duration(duration: Duration) -> String {\n   49 |     let secs = duration.as_secs();\n   50 |     if secs > 60 {\n   51 |         let min = secs / 60;\n   52 |         if min > 60 {\n   53 |             format!(\"{}:{:02}\", min / 60, min % 60)\n   54 |         } else {\n   55 |             format!(\"{}{}\", min, fl!(\"minutes\"))\n   56 |         }\n   57 |     } else {\n   58 |         format!(\"{}{}\", secs, fl!(\"seconds\"))\n   59 |     }\n   60 | }","lines":13,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-battery/src/app.rs#L48-L60"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The keyboard-brightness percentage text computes `100. * kbd_brightness as f64 / max_kbd_brightness as f64` with no guard against `max_kbd_brightness == 0`, which yields `NaN` (or `inf`) and renders as 'NaN%' in the popup. The analogous screen-brightness code in the same file (`screen_brightness_percent`) already guards this exact case with `.max(1)`.","fix":"Guard the denominator the same way `screen_brightness_percent` does:\n\n```rust\ntext(format!(\n    \"{:.0}%\",\n    100. * kbd_brightness as f64 / (max_kbd_brightness.max(1) as f64)\n))\n```","locations":[{"ref":"cosmic-applet-battery/src/app.rs:813-819","code":"  813 |                             container(\n  814 |                                 text(format!(\n  815 |                                     \"{:.0}%\",\n  816 |                                     100. * kbd_brightness as f64 / max_kbd_brightness as f64\n  817 |                                 ))\n  818 |                                 .size(16)\n  819 |                             )","lines":7,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-battery/src/app.rs#L813-L819"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"medium","description":"In the `Message::DragFinished` handler, `self.dnd_source.take()` already sets `self.dnd_source` to `None`, but the code then checks `self.dnd_source.as_ref()` a few lines later to decide whether to prune the pinned list after a cancelled/failed pinned-item drag. That check is always `None` (dead branch), so the intended pruning of `pinned_list` (matching the working logic in the nearly identical `Message::DndLeave` handler, which correctly reads `self.dnd_source.as_ref()` before taking it) never executes, silently breaking cleanup of stale pinned items after certain drag operations.","fix":"The outer `if let Some((_, mut toplevel_group, _, _pinned_pos))` already holds the data that was taken from `self.dnd_source`; use it directly instead of re-reading the now-empty `self.dnd_source`:\n\n```rust\nMessage::DragFinished => {\n    if let Some((_, mut toplevel_group, _, pinned_pos)) = self.dnd_source.take() {\n        if self.dnd_offer.take().is_some() {\n            let mut pos = 0;\n            self.pinned_list.retain_mut(|pinned| {\n                let matched_id = pinned.desktop_info.id() == toplevel_group.desktop_info.id();\n                let pinned_match = pinned_pos.is_some_and(|pinned_pos| pinned_pos == pos);\n                let ret = !matched_id || pinned_match;\n                pos += 1;\n                ret\n            });\n        }\n        ...\n```\n(rename the unused `_pinned_pos` binding to `pinned_pos` and drop the inner `if let Some(...) = self.dnd_source.as_ref()` check entirely).","locations":[{"ref":"cosmic-app-list/src/app.rs:1159-1189","code":" 1159 |             Message::DragFinished => {\n 1160 |                 if let Some((_, mut toplevel_group, _, _pinned_pos)) = self.dnd_source.take() {\n 1161 |                     if self.dnd_offer.take().is_some() {\n 1162 |                         if let Some((_, toplevel_group, _, pinned_pos)) = self.dnd_source.as_ref() {\n 1163 |                             let mut pos = 0;\n 1164 |                             self.pinned_list.retain_mut(|pinned| {\n 1165 |                                 let matched_id =\n 1166 |                                     pinned.desktop_info.id() == toplevel_group.desktop_info.id();\n 1167 |                                 let pinned_match =\n 1168 |                                     pinned_pos.is_some_and(|pinned_pos| pinned_pos == pos);\n 1169 |                                 let ret = !matched_id || pinned_match;\n 1170 | \n 1171 |                                 pos += 1;\n 1172 |                                 ret\n 1173 |                             });\n 1174 |                         }\n 1175 |                     }\n 1176 | \n 1177 |                     if !self\n 1178 |                         .pinned_list\n 1179 |                         .iter()\n 1180 |                         .chain(self.active_list.iter())\n 1181 |                         .any(|t| t.desktop_info.id() == toplevel_group.desktop_info.id())\n 1182 |                         && !toplevel_group.toplevels.is_empty()\n 1183 |                     {\n 1184 |                         self.item_ctr += 1;\n 1185 |                         toplevel_group.id = self.item_ctr;\n 1186 |                         self.active_list.push(toplevel_group);\n 1187 |                     }\n 1188 |                 }\n 1189 |             }","lines":31,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-app-list/src/app.rs#L1159-L1189"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`Message::Dismissed` removes a notification from its card group but never recomputes the group's \"show more\" label (`c.3`), whereas the near-identical `subscriptions::dbus::Output::CloseEvent` handler - which does the same `retain` on the same data - does recompute `c.3` right after. Dismissing a notification from the applet's own UI therefore leaves a stale \"N more\" count until the next unrelated update, while a D-Bus-driven close updates it correctly.","fix":"```rust\n// before (Message::Dismissed)\nfor c in &mut self.cards {\n    c.1.retain(|n| n.id != id);\n}\nself.cards.retain(|c| !c.1.is_empty());\n\n// after\nfor c in &mut self.cards {\n    c.1.retain(|n| n.id != id);\n    c.3 = fl!(\"show-more\", HashMap::from([(\"more\", c.1.len().saturating_sub(1))]));\n}\nself.cards.retain(|c| !c.1.is_empty());\n```","locations":[{"ref":"cosmic-applet-notifications/src/lib.rs:221-236","code":"  221 |             Message::Dismissed(id) => {\n  222 |                 info!(\"Dismissed {}\", id);\n  223 |                 for c in &mut self.cards {\n  224 |                     c.1.retain(|n| n.id != id);\n  225 |                 }\n  226 |                 self.cards.retain(|c| !c.1.is_empty());\n  227 | \n  228 |                 if let Some(tx) = &self.dbus_sender {\n  229 |                     let tx = tx.clone();\n  230 |                     tokio::spawn(async move {\n  231 |                         if let Err(err) = tx.send(subscriptions::dbus::Input::Dismiss(id)).await {\n  232 |                             tracing::error!(\"{:?}\", err);\n  233 |                         }\n  234 |                     });\n  235 |                 }\n  236 |             }","lines":16,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-notifications/src/lib.rs#L221-L236"},{"ref":"cosmic-applet-notifications/src/lib.rs:241-249","code":"  241 |                 subscriptions::dbus::Output::CloseEvent(id) => {\n  242 |                     for c in &mut self.cards {\n  243 |                         c.1.retain(|n| n.id != id);\n  244 |                         c.3 = fl!(\n  245 |                             \"show-more\",\n  246 |                             HashMap::from([(\"more\", c.1.len().saturating_sub(1))])\n  247 |                         );\n  248 |                     }\n  249 |                     self.cards.retain(|c| !c.1.is_empty());","lines":9,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-notifications/src/lib.rs#L241-L249"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The accessibility applet's localize error message was copy-pasted from `cosmic-app-list`'s `localize.rs` and still says \"App List\" instead of referring to the accessibility applet, which will confuse anyone reading this applet's logs.","fix":"```rust\n// before\neprintln!(\"Error while loading language for App List {error}\");\n\n// after\neprintln!(\"Error while loading language for Accessibility applet {error}\");\n```","locations":[{"ref":"cosmic-applet-a11y/src/localize.rs:41-48","code":"   41 | pub fn localize() {\n   42 |     let localizer = localizer();\n   43 |     let requested_languages = i18n_embed::DesktopLanguageRequester::requested_languages();\n   44 | \n   45 |     if let Err(error) = localizer.select(&requested_languages) {\n   46 |         eprintln!(\"Error while loading language for App List {error}\");\n   47 |     }\n   48 | }","lines":8,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-a11y/src/localize.rs#L41-L48"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`capture_source_shm_fd` silently ignores the error from `rustix::fs::ftruncate` (`else if let Err(_err) = rustix::fs::ftruncate(&fd, buf_len.into()) {}` has an empty body). If `ftruncate` fails, execution still proceeds to create a `wl_shm_pool` claiming `buf_len` bytes backed by a file that was never actually resized, which is a wayland shm protocol violation (pool size larger than the backing storage) and can trigger a compositor-side protocol error or read garbage/short data client-side.","fix":"Propagate the failure instead of silently continuing:\n\n```rust\nif let Some(len) = len {\n    if len != buf_len {\n        return None;\n    }\n} else if let Err(err) = rustix::fs::ftruncate(&fd, buf_len.into()) {\n    tracing::error!(?err, \"Failed to resize shm buffer\");\n    return None;\n}\n```","locations":[{"ref":"cosmic-app-list/src/wayland_handler.rs:411-420","code":"  411 |         let buf_len = width * height * 4;\n  412 |         if let Some(len) = len {\n  413 |             if len != buf_len {\n  414 |                 return None;\n  415 |             }\n  416 |         } else if let Err(_err) = rustix::fs::ftruncate(&fd, buf_len.into()) {\n  417 |         }\n  418 |         let pool = self\n  419 |             .wl_shm\n  420 |             .create_pool(fd.as_fd(), buf_len as i32, &self.qh, ());","lines":10,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-app-list/src/wayland_handler.rs#L411-L420"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`wayland_handler()` runs `event_loop.dispatch(None, &mut app_data).unwrap()` in its main loop; any dispatch failure (e.g. compositor restart/hangup) panics the dedicated OS thread spawned in `wayland_subscription()`. Because the thread dies inside `runtime.block_on(...)` before reaching the code after the `wayland_handler(...)` call, `WaylandUpdate::Finished` is never sent, so the iced subscription channel is simply abandoned instead of notifying the applet that Wayland support died - the minimize applet silently stops updating with no way to recover short of restarting the whole panel.","fix":"Wrap the dispatch loop body so a dispatch error breaks the loop and falls through to the existing `tracing::error!`/`WaylandUpdate::Finished` cleanup instead of panicking, e.g. replace `.unwrap()` with `if let Err(e) = event_loop.dispatch(None, &mut app_data) { tracing::error!(\"dispatch failed: {e}\"); break; }`.","locations":[{"ref":"cosmic-applet-minimize/src/wayland_handler.rs:487-492","code":"  487 |     loop {\n  488 |         if app_data.exit {\n  489 |             break;\n  490 |         }\n  491 |         event_loop.dispatch(None, &mut app_data).unwrap();\n  492 |     }","lines":6,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/wayland_handler.rs#L487-L492"},{"ref":"cosmic-applet-minimize/src/wayland_subscription.rs:32-39","code":"   32 |                 let _ = std::thread::spawn(move || {\n   33 |                     runtime.block_on(async move {\n   34 |                         _ = output.send(WaylandUpdate::Init(calloop_tx)).await;\n   35 |                         wayland_handler(output.clone(), calloop_rx);\n   36 |                         tracing::error!(\"Wayland handler thread died\");\n   37 |                         _ = output.send(WaylandUpdate::Finished).await;\n   38 |                     });\n   39 |                 });","lines":8,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/wayland_subscription.rs#L32-L39"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`AppListConfig::add_pinned`, `remove_pinned`, and `update_pinned` all discard the `Result` of `write_entry` via `let _ = ...`. If persisting the favorites list to disk fails (e.g. permissions, disk full, cosmic-config backend error), the in-memory list and the on-disk config silently diverge with no log line, so pinned apps can appear to \"lose\" their pinned state after a restart with no diagnostic trail.","fix":"Log the error instead of swallowing it, e.g.:\n\n```rust\nif let Err(err) = self.write_entry(config) {\n    tracing::error!(?err, \"Failed to write app-list favorites\");\n}\n```\nin each of `add_pinned`, `remove_pinned`, and `update_pinned`.","locations":[{"ref":"cosmic-app-list/cosmic-app-list-config/src/lib.rs:36-55","code":"   36 | impl AppListConfig {\n   37 |     pub fn add_pinned(&mut self, id: String, config: &Config) {\n   38 |         if !self.favorites.contains(&id) {\n   39 |             self.favorites.push(id);\n   40 |             let _ = self.write_entry(config);\n   41 |         }\n   42 |     }\n   43 | \n   44 |     pub fn remove_pinned(&mut self, id: &str, config: &Config) {\n   45 |         if let Some(pos) = self.favorites.iter().position(|e| e == id) {\n   46 |             self.favorites.remove(pos);\n   47 |             let _ = self.write_entry(config);\n   48 |         }\n   49 |     }\n   50 | \n   51 |     pub fn update_pinned(&mut self, favorites: Vec<String>, config: &Config) {\n   52 |         self.favorites = favorites;\n   53 |         let _ = self.write_entry(config);\n   54 |     }\n   55 | }","lines":20,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-app-list/cosmic-app-list-config/src/lib.rs#L36-L55"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"When the bluetooth subscription stream unexpectedly ends, the applet logs an error message but then calls `std::process::exit(0)`, reporting success to any process supervisor even though this is an abnormal/error termination path. A supervisor (systemd, session manager) watching the exit code will not know the applet needs restarting/attention.","fix":"Exit with a non-zero status to signal failure:\n\n```rust\n// before\neprintln!(\"bluetooth subscription finished. exiting...\");\nstd::process::exit(0);\n\n// after\neprintln!(\"bluetooth subscription finished. exiting...\");\nstd::process::exit(1);\n```","locations":[{"ref":"cosmic-applet-bluetooth/src/app.rs:170-174","code":"  170 |                 BluerEvent::Finished => {\n  171 |                     // TODO should this exit with an error causing a restart?\n  172 |                     eprintln!(\"bluetooth subscription finished. exiting...\");\n  173 |                     std::process::exit(0);\n  174 |                 }","lines":5,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-bluetooth/src/app.rs#L170-L174"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"When resizing a freshly created memfd, a failed `ftruncate` is silently swallowed by an empty `else if let Err(_err) = ... {}` block, so execution continues to create a Wayland shm pool/buffer over a file that may not actually have the expected size, risking a SIGBUS on the later `memmap2::Mmap::map` or a protocol error from the compositor.","fix":"```rust\n// before\n} else if let Err(_err) = rustix::fs::ftruncate(&fd, buf_len.into()) {\n}\n\n// after\n} else if let Err(err) = rustix::fs::ftruncate(&fd, buf_len.into()) {\n    tracing::error!(\"Failed to resize capture buffer: {err}\");\n    return None;\n}\n```","locations":[{"ref":"cosmic-applet-minimize/src/wayland_handler.rs:186-187","code":"  186 |         } else if let Err(_err) = rustix::fs::ftruncate(&fd, buf_len.into()) {\n  187 |         }","lines":2,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-minimize/src/wayland_handler.rs#L186-L187"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `lock()`, the loop over the user's sessions uses `session.type_().await?` with the outer `?` operator. If querying the session type fails for any single session (e.g. a transient D-Bus hiccup), the whole `lock()` function returns that `Err` immediately, discarding `locked_successfully` even if an earlier session in the loop was already locked, and skipping any remaining sessions that might still need locking.","fix":"Replace the `?` with a non-fatal skip, e.g. `let Ok(session_type) = session.type_().await else { continue; };`, so one session's transient failure doesn't abort locking the rest.","locations":[{"ref":"cosmic-applet-power/src/lib.rs:349-364","code":"  349 |     for (_, session_path) in sessions {\n  350 |         let Ok(session) = SessionProxy::builder(&connection)\n  351 |             .path(session_path)?\n  352 |             .build()\n  353 |             .await\n  354 |         else {\n  355 |             continue;\n  356 |         };\n  357 | \n  358 |         if session.class().await == Ok(SessionClass::User)\n  359 |             && session.type_().await? != SessionType::TTY\n  360 |             && session.lock().await.is_ok()\n  361 |         {\n  362 |             locked_successfully = true;\n  363 |         }\n  364 |     }","lines":16,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-power/src/lib.rs#L349-L364"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"When the Wayland connection cannot be established, both files map the real connection error to `anyhow::Error` and then discard it, always printing the fixed message `\"ENV variable WAYLAND_DISPLAY is missing. Exiting...\"` regardless of the actual cause (e.g. a malformed `X_PRIVILEGED_WAYLAND_SOCKET` file descriptor, or any other `connect_to_env` failure unrelated to `WAYLAND_DISPLAY`). This misleads whoever debugs a startup failure.","fix":"Print the actual error instead of a hardcoded guess:\n\n```rust\n} else {\n    eprintln!(\"Failed to connect to Wayland compositor: {conn_err}\");\n    std::process::exit(1);\n}\n```\n(keeping the mapped error in scope via `match`/`if let Err(e) = conn` instead of discarding it with `if let Ok(conn) = conn`).","locations":[{"ref":"cosmic-applet-tiling/src/wayland.rs:44-58","code":"   44 |     let socket = std::env::var(\"X_PRIVILEGED_WAYLAND_SOCKET\")\n   45 |         .ok()\n   46 |         .and_then(|fd| {\n   47 |             fd.parse::<RawFd>()\n   48 |                 .ok()\n   49 |                 .map(|fd| unsafe { UnixStream::from_raw_fd(fd) })\n   50 |         });\n   51 | \n   52 |     let conn = if let Some(socket) = socket {\n   53 |         Connection::from_socket(socket)\n   54 |     } else {\n   55 |         Connection::connect_to_env()\n   56 |     }\n   57 |     .map_err(anyhow::Error::msg);\n   58 | ","lines":15,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-tiling/src/wayland.rs#L44-L58"},{"ref":"cosmic-applet-tiling/src/wayland.rs:150-153","code":"  150 |     } else {\n  151 |         eprintln!(\"ENV variable WAYLAND_DISPLAY is missing. Exiting...\");\n  152 |         std::process::exit(1);\n  153 |     }","lines":4,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-tiling/src/wayland.rs#L150-L153"},{"ref":"cosmic-applet-workspaces/src/wayland.rs:38-51","code":"   38 |     let socket = std::env::var(\"X_PRIVILEGED_WAYLAND_SOCKET\")\n   39 |         .ok()\n   40 |         .and_then(|fd| {\n   41 |             fd.parse::<RawFd>()\n   42 |                 .ok()\n   43 |                 .map(|fd| unsafe { UnixStream::from_raw_fd(fd) })\n   44 |         });\n   45 | \n   46 |     let conn = if let Some(socket) = socket {\n   47 |         Connection::from_socket(socket)\n   48 |     } else {\n   49 |         Connection::connect_to_env()\n   50 |     }\n   51 |     .map_err(anyhow::Error::msg);","lines":14,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-workspaces/src/wayland.rs#L38-L51"},{"ref":"cosmic-applet-workspaces/src/wayland.rs:107-110","code":"  107 |     } else {\n  108 |         eprintln!(\"ENV variable WAYLAND_DISPLAY is missing. Exiting...\");\n  109 |         std::process::exit(1);\n  110 |     }","lines":4,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-workspaces/src/wayland.rs#L107-L110"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"In `SeatHandler::new_capability`, `keyboard.release()` is called unconditionally right after creating the `wl_keyboard` object, and then it is called a second time inside the `else` branch (when no `zcosmic_keyboard_layout_v1` could be obtained). `wl_keyboard.release` is a destructor request; sending it twice for the same object id is a Wayland protocol violation and can make the compositor terminate the connection with a protocol error, breaking the applet's whole wayland link.","fix":"Remove the redundant second call - the object is already released unconditionally at line 103:\n\n```rust\n// before\n} else {\n    keyboard.release();\n}\n\n// after\n} else {\n}\n```","locations":[{"ref":"cosmic-applet-input-sources/src/wayland.rs:98-117","code":"   98 |         if capability == Capability::Keyboard && self.keyboard.is_none() {\n   99 |             let keyboard = seat.get_keyboard(qh, ());\n  100 |             let keyboard_layout = self\n  101 |                 .keyboard_layout_state\n  102 |                 .get_keyboard_layout(&keyboard, qh);\n  103 |             keyboard.release();\n  104 | \n  105 |             if let Some(keyboard_layout) = keyboard_layout {\n  106 |                 let _ = block_on(\n  107 |                     self.sender\n  108 |                         .send(Event::KeyboardLayout(keyboard_layout.clone())),\n  109 |                 );\n  110 |                 self.keyboard = Some(Keyboard {\n  111 |                     seat,\n  112 |                     keyboard_layout,\n  113 |                 });\n  114 |             } else {\n  115 |                 keyboard.release();\n  116 |             }\n  117 |         }","lines":20,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-input-sources/src/wayland.rs#L98-L117"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`find_active` awaits `eval(p.player.clone()).await` for each player sequentially in a `for` loop, doing one D-Bus round trip (playback status + metadata check) per player before starting the next. With several MPRIS players registered this serializes N round trips per poll cycle instead of running them concurrently.","fix":"Run the per-player evaluation concurrently, e.g. with `futures::future::join_all` or `FuturesUnordered`, and then pick the best score:\n\n```rust\nlet scored: Vec<_> = futures::future::join_all(\n    players.iter().map(|p| eval(p.player.clone()).map(move |v| (v, p)))\n).await;\nbest = scored.into_iter().fold((0, None), |best, (v, p)| if v > best.0 { (v, Some(p)) } else { best });\n```","locations":[{"ref":"cosmic-applet-audio/src/mpris_subscription.rs:289-313","code":"  289 | async fn find_active<'a>(players: &'a [MprisPlayer]) -> Option<&'a MprisPlayer> {\n  290 |     let mut best = (0, None::<&'a MprisPlayer>);\n  291 |     let eval = |p: Player| async move {\n  292 |         let v = {\n  293 |             let status = p.playback_status().await;\n  294 | \n  295 |             match status {\n  296 |                 Ok(mpris2_zbus::player::PlaybackStatus::Playing) => 100,\n  297 |                 Ok(mpris2_zbus::player::PlaybackStatus::Paused) => 10,\n  298 |                 _ => return 0,\n  299 |             }\n  300 |         };\n  301 | \n  302 |         v + p.metadata().await.is_ok() as i32\n  303 |     };\n  304 | \n  305 |     for p in players {\n  306 |         let v = eval(p.player.clone()).await;\n  307 |         if v > best.0 {\n  308 |             best = (v, Some(p));\n  309 |         }\n  310 |     }\n  311 | \n  312 |     best.1\n  313 | }","lines":25,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-audio/src/mpris_subscription.rs#L289-L313"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"A new `DateTimeFormatter` is constructed from scratch on every single render call (`calendar_grid`, `vertical_layout`, `horizontal_layout`, `view_window`), even though the locale, hour-cycle preference and fieldset rarely change between ticks. With `show_seconds` enabled the applet redraws once per second, rebuilding several ICU formatters every time purely to format the same locale/fieldset pattern repeatedly.","fix":"Cache built `DateTimeFormatter`s keyed by (locale, hour_cycle, fieldset, show_seconds) on the `Window` struct, and only rebuild them when `Message::ConfigChanged` or a locale change actually alters one of those inputs.","locations":[{"ref":"cosmic-applet-time/src/window.rs:150-150","code":"  150 |         let weekday = DateTimeFormatter::try_new(prefs, fieldsets::E::short()).unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-applets/blob/e544cb54c242fecbe9399fcb3dd61d9ac19e1214/cosmic-applet-time/src/window.rs#L150"},{"ref":"cosmic-applet-time/src/window.rs:210-231","code":"  210 |                 let formatted_date = DateTimeFormatter::try_new(prefs, fieldsets::MD::medium())\n  211 |                     . ter `insert` then adds a stale entry for an already-finished task that nothing will ever remove again. This both breaks `BluerRequest::CancelConnect` (it may `abort()` an already-completed task instead of reporting 'no active request') and leaks map entries over the app's lifetime.","fix":"Insert a handle/placeholder into `active_requests` before spawning the task that removes it, e.g. reserve the slot first, or spawn a wrapper that owns the insert/remove pairing atomically:\n\n```rust\nlet handle = spawn(async move { /* ... */ });\nactive_requests.lock().await.insert(req.clone(), handle);\n```\nshould happen before the inner task has any chance to run, e.g. by inserting a oneshot-based placeholder synchronously prior to `spawn`, or by using `tokio::task::Builder`/an explicit generation id keyed map so a late remove cannot race with a late insert.","locations":[{"ref":"cosmic-applet-bluetooth/src/bluetooth.rs:719-836","code":"  719 |             while let Some(req) = request_rx.recv().await {\n  720 |                 let req_clone = req.clone();\n  721 |                 let req_clone_2 = req.clone();\n  722 |                 let active_requests_clone = active_requests.clone();\n  723 |                 let tx_clone = tx.clone();\n  724 |                 let adapter_clone = adapter.clone();\n  725 |                 let wake_up_tx = wake_up_tx.clone();\n  726 | \n  727 |                 let handle = spawn(async move {\n  728 |                     let mut err_msg = None;\n  729 |                     match &req_clone {\n  730 |                         BluerRequest::SetBluetoothEnabled(enabled) => {\n  731 |                             if let Err(e) = adapter_clone.set_powered(*enabled).await {\n  732 |                                 tracing::error!(\"Failed to power off bluetooth adapter. {e:?}\");\n  733 |                             }\n  734 | \n  735 |                             // rfkill will be persisted after reboot\n  736 |                             let name = // Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }

function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}
