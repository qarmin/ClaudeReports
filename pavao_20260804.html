nsitive(c: *mut SMBCCTX, b: smbc_bool);\n  455 |     pub fn smbc_setOptionBrowseMaxLmbCount(c: *mut SMBCCTX, count: c_int);\n  456 |     pub fn smbc_setOptionUrlEncodeReaddirEntries(c: *mut SMBCCTX, b: smbc_bool);\n  457 |     pub fn smbc_setOptionOneSharePerServer(c: *mut SMBCCTX, b: smbc_bool);\n  458 |     pub fn smbc_setOptionUseKerberos(c: *mut SMBCCTX, b: smbc_bool);\n  459 |     pub fn smbc_setOptionFallbackAfterKerberos(c: *mut SMBCCTX, b: smbc_bool);\n  460 |     pub fn smbc_setOptionNoAutoAnonymousLogin(c: *mut SMBCCTX, b: smbc_bool);\n  461 |     pub fn smbc_setOptionUseCCache(c: *mut SMBCCTX, b: smbc_bool);","lines":11,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L451-L461"},{"ref":"pavao/src/smb/types/options.rs:62-65","code":"   62 |     pub fn full_time_names(mut self, full_time_names: bool) -> Self {\n   63 |         self.full_time_names = full_time_names;\n   64 |         self\n   65 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/options.rs#L62-L65"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The hand-written `PartialEq` for `SmbError` has no arm for the `Mutex` variant, so it falls through to `(_, _) => false` and `SmbError::Mutex != SmbError::Mutex`. Any assertion or `==` comparison involving that variant silently fails, which breaks the reflexivity contract of `PartialEq`. (Note also that the `Io` arm compares only `io::ErrorKind`, so e.g. `EPERM` and `EACCES` compare equal - acceptable for tests but worth documenting.)","fix":"Add the missing arm:\n\n```rust\n            (Self::Mutex, Self::Mutex) => true,\n```\n\nright after the `NulInPath` arm, or derive the comparison from `std::mem::discriminant` for the payload-free variants.","locations":[{"ref":"pavao/src/error.rs:28-37","code":"   28 | impl PartialEq for SmbError {\n   29 |     fn eq(&self, other: &Self) -> bool {\n   30 |         match (self, other) {\n   31 |             (Self::BadFileDescriptor, Self::BadFileDescriptor) => true,\n   32 |             (Self::BadValue, Self::BadValue) => true,\n   33 |             (Self::Io(io), Self::Io(io2)) => io.kind() == io2.kind(),\n   34 |             (Self::NulInPath(e), Self::NulInPath(e2)) => e == e2,\n   35 |             (_, _) => false,\n   36 |         }\n   37 |     }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/error.rs#L28-L37"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"All timestamp conversions throw away sub-second precision. `TryFrom<libsmb_file_info>` uses only\n`*_ts.tv_sec` and ignores `tv_nsec`, even though libsmbclient hands over full `struct timespec`\nvalues; `From<stat>` likewise uses `st_atime`/`st_mtime`/`st_ctime` instead of\n`st_atim`/`st_mtim`/`st_ctim`. Since the public type is `SystemTime`, which can represent\nnanoseconds, the loss is gratuitous and makes timestamp comparison/sync logic (a common use for\nthese fields) inaccurate by up to one second.","fix":"Add a `timespec`-based helper and use it everywhere:\n\n```rust\nfn timespec_to_system_time(ts: libc::timespec) -> SystemTime {\n    time_t_to_system_time(ts.tv_sec)\n        .checked_add(Duration::from_nanos(ts.tv_nsec.clamp(0, 999_999_999) as u64))\n        .unwrap_or(UNIX_EPOCH)\n}\n```\n\nthen `ctime: timespec_to_system_time(di.ctime_ts)` etc., and in `From<stat>` use `s.st_atim`/`s.st_mtim`/`s.st_ctim` (falling back to the `st_*time` fields on platforms that lack them).","locations":[{"ref":"pavao/src/smb/types/stat.rs:286-312","code":"  286 | impl TryFrom<libsmb_file_info> for SmbDirentInfo {\n  287 |     type Error = SmbError;\n  288 | \n  289 |     fn try_from(di: libsmb_file_info) -> Result<Self, Self::Error> {\n  290 |         let name = char_ptr_to_string(di.name)?;\n  291 |         let short_name = char_ptr_to_string(di.short_name)?;\n  292 | \n  293 |         Ok(Self {\n  294 |             name,\n  295 |             short_name,\n  296 |             size: di.size as u64,\n  297 |             ctime: time_t_to_system_time(di.ctime_ts.tv_sec),\n  298 |             btime: time_t_to_system_time(di.btime_ts.tv_sec),\n  299 |             mtime: time_t_to_system_time(di.mtime_ts.tv_sec),\n  300 |             atime: time_t_to_system_time(di.atime_ts.tv_sec),\n  301 |             uid: di.uid,\n  302 |             gid: di.gid,\n  303 |             attrs: di.attrs,\n  304 |         })\n  305 |     }\n  306 | }\n  307 | \n  308 | fn time_t_to_system_time(t: time_t) -> SystemTime {\n  309 |     UNIX_EPOCH\n  310 |         .checked_add(Duration::from_secs(t as u64))\n  311 |         .unwrap_or(UNIX_EPOCH)\n  312 | }","lines":27,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L286-L312"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`write_to_cstr` silently truncates: when `src.len() >= len` it writes `len - 1` bytes and NUL, then\nreturns `()` with no indication. For the auth callback this means a password or username longer than\nlibsmbclient's buffer is quietly sent truncated, and the user sees a plain \"authentication failed\"\nwith no hint that their credential was cut short.","fix":"Return a `bool`/`SmbResult<()>` indicating whether the value fitted, and have `SmbClient::auth_wrapper` log a warning such as `warn!(\"password truncated to {} bytes by libsmbclient buffer\", pwlen - 1)` when it did not.","locations":[{"ref":"pavao/src/utils.rs:29-51","code":"   29 | pub unsafe fn write_to_cstr(dest: *mut u8, len: usize, src: &str) {\n   30 |     // just to ensure that it can be interpreted as c string\n   31 |     *dest.add(len - 1) = 0u8;\n   32 |     trace!(\"orig: {:?}\", cstr(dest));\n   33 | \n   34 |     let mut buf = slice::from_raw_parts_mut(dest, len);\n   35 |     let mut idx = buf.write(src.as_bytes()).unwrap();\n   36 | \n   37 |     if idx == len {\n   38 |         idx -= 1;\n   39 |     }\n   40 |     buf = slice::from_raw_parts_mut(dest, len);\n   41 |     buf[idx] = 0u8;\n   42 | \n   43 |     trace!(\n   44 |         \"write to [{:p};{}] from [{:p},{}]: {:?}\",\n   45 |         dest,\n   46 |         len,\n   47 |         src.as_ptr(),\n   48 |         src.len(),\n   49 |         cstr(dest)\n   50 |     );\n   51 | }","lines":23,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/utils.rs#L29-L51"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`RANLIB` is exported as the program *plus* its arguments (lines 1493-1496), but the immediately adjacent `AR` export passes only `ar.get_program()` and silently drops `ar.get_args()`. Toolchains where `cc` returns an archiver with arguments (LLVM/Android/Emscripten wrappers, `llvm-ar` invoked through a driver, `AR_<target>` set to a command with flags) therefore get a truncated `AR` and samba's `configure`/`make` archives objects with the wrong tool invocation.","fix":"Build `AR` the same way `RANLIB` is built:\n\n```rust\nlet mut ar_args = vec![ar.get_program()];\nar_args.extend(ar.get_args());\nconfigure.env(\"AR\", ar_args.join(OsStr::new(\" \")));\n```\n\n(Note that joining with spaces still breaks on tool paths containing spaces for both variables; quote or use the `_ARGS`-style variables samba supports if that matters.)","locations":[{"ref":"pavao-src/src/lib.rs:1484-1496","code":" 1484 |         configure.env(\"CC\", cc_env);\n 1485 |         configure.env(\"AR\", ar.get_program());\n 1486 |         // On MacOS we need to explicitly declare include paths for gnutls\n 1487 |         #[cfg(target_os = \"macos\")]\n 1488 |         {\n 1489 |             let gnutls_paths = self.gnutls.as_ref().ok_or(\"gnutls paths not set\")?;\n 1490 |             add_env_includes(&mut configure, gnutls_paths)?;\n 1491 |         }\n 1492 | \n 1493 |         let ranlib = cc.get_ranlib();\n 1494 |         let mut args = vec![ranlib.get_program()];\n 1495 |         args.extend(ranlib.get_args());\n 1496 |         configure.env(\"RANLIB\", args.join(OsStr::new(\" \")));","lines":13,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1484-L1496"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`print` applies `self.uri(...)` to *both* arguments, so the print queue is prefixed with the server + share URI of the current connection. `printq` is documented as \"The URL of the print share to print the file to\", i.e. an independent SMB URL, so the produced value is nonsense such as `smb://server/share/printer` (or `smb://server/sharesmb://server/printer` if the caller passes a real URL). The `self.uri(...)` wrapper was clearly copy-pasted from the line above it for `p`.","fix":"Do not rewrite the print queue URL. Replace\n\n```rust\nlet print_queue = utils::str_to_cstring(self.uri(print_queue))?;\n```\n\nwith\n\n```rust\nlet print_queue = utils::str_to_cstring(print_queue)?;\n```","locations":[{"ref":"pavao/src/smb/client.rs:376-383","code":"  376 |         trace!(\"printing {} to {} queue\", p.as_ref(), print_queue.as_ref());\n  377 |         let p = utils::str_to_cstring(self.uri(p))?;\n  378 |         let print_queue = utils::str_to_cstring(self.uri(print_queue))?;\n  379 |         let print_fn = self.get_fn(self.ctx()?, smbc_getFunctionPrintFile)?;\n  380 |         utils::to_result_with_ioerror(\n  381 |             (),\n  382 |             print_fn(self.ctx()?, p.as_ptr(), self.ctx()?, print_queue.as_ptr()),\n  383 |         )","lines":8,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L376-L383"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"The test `should_list_dirplus` calls `ctx.client.list_dir(\"/cargo-test\")` instead of `list_dirplus`, and then asserts on `SmbDirent` values. It is a copy of `should_list_dir` in which the function under test was never changed, so `list_dirplus`, the `readdirplus` code path and the whole `TryFrom<libsmb_file_info> for SmbDirentInfo` conversion have zero coverage despite appearing to be tested.","fix":"In `should_list_dirplus`, replace\n\n```rust\nlet mut entries = ctx.client.list_dir(\"/cargo-test\").unwrap();\n```\n\nwith\n\n```rust\nlet mut entries = ctx.client.list_dirplus(\"/cargo-test\").unwrap();\n```","locations":[{"ref":"pavao/src/smb/client.rs:674-699","code":"  674 |     #[test]\n  675 |     #[serial]\n  676 |     fn should_list_dirplus() {\n  677 |         mock::logger();\n  678 |         let ctx = init_ctx();\n  679 |         create_file_at(&ctx.client, \"/cargo-test/ghi\", \"Hello, World!\\n\");\n  680 |         create_file_at(&ctx.client, \"/cargo-test/jkl\", \"Hello, World!\\n\");\n  681 |         assert!(ctx\n  682 |             .client\n  683 |             .mkdir(\"/cargo-test/hil\", SmbMode::from(0o755))\n  684 |             .is_ok());\n  685 |         // list dir\n  686 |         let mut entries = ctx.client.list_dir(\"/cargo-test\").unwrap();\n  687 |         entries.sort_by(|a, b| a.name().cmp(&b.name()));\n  688 |         assert_eq!(entries.len(), 3);\n  689 |         let abc = entries.get(0).unwrap();\n  690 |         assert_eq!(abc.name(), \"ghi\");\n  691 |         assert_eq!(abc.get_type(), SmbDirentType::File);\n  692 |         let def = entries.get(1).unwrap();\n  693 |         assert_eq!(def.name(), \"hil\");\n  694 |         assert_eq!(def.get_type(), SmbDirentType::Dir);\n  695 |         let jfk = entries.get(2).unwrap();\n  696 |         assert_eq!(jfk.name(), \"jkl\");\n  697 |         assert_eq!(jfk.get_type(), SmbDirentType::File);\n  698 |         finalize_ctx(ctx);\n  699 |     }","lines":26,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L674-L699"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `add_library`, the `Ok` branch guards the Homebrew search paths with `if cfg!(target_os = \"macos\")`, but the `Err` fallback branch - clearly copied from it - dropped that guard and only checks the architecture. On Linux aarch64/x86_64 the fallback therefore emits `cargo:rustc-link-search=/opt/homebrew/opt/<name>/lib` or `/usr/local/Homebrew/opt/<name>/lib`, macOS-only paths that never exist on Linux.","fix":"Add the same OS guard to the fallback branch:\n\n```rust\n        Err(_) => {\n            println!(\"{lib} was not found with pkg_config; ...\");\n            if cfg!(target_os = \"macos\") {\n                if cfg!(target_arch = \"aarch64\") { /* ... */ }\n                else if cfg!(target_arch = \"x86_64\") { /* ... */ }\n            }\n            println!(\"cargo:rustc-link-lib={lib}\");\n        }\n```","locations":[{"ref":"pavao-sys/build.rs:124-133","code":"  124 |         Err(_) => {\n  125 |             println!(\"{lib} was not found with pkg_config; trying with LD_LIBRARY_PATH; but you may need to install it manually\");\n  126 |             // cross-finger and try dylib\n  127 |             if cfg!(target_arch = \"aarch64\") {\n  128 |                 println!(\"cargo:rustc-link-search=/opt/homebrew/opt/{brew_name}/lib\");\n  129 |             } else if cfg!(target_arch = \"x86_64\") {\n  130 |                 println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  131 |             }\n  132 |             println!(\"cargo:rustc-link-lib={lib}\");\n  133 |         }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L124-L133"},{"ref":"pavao-sys/build.rs:114-123","code":"  114 |         Ok(_) => {\n  115 |             if cfg!(target_os = \"macos\") {\n  116 |                 if cfg!(target_arch = \"aarch64\") {\n  117 |                     println!(\"cargo:rustc-link-search=/opt/homebrew/opt/{brew_name}/lib\");\n  118 |                 } else if cfg!(target_arch = \"x86_64\") {\n  119 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  120 |                 }\n  121 |                 println!(\"cargo:rustc-link-lib={lib}\");\n  122 |             }\n  123 |         }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L114-L123"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The cfg alias `android: { target_arch = \"android\" }` is wrong: `android` is a `target_os`, never a `target_arch`, so the alias can never evaluate to true. It is also unused - `pavao/src/smb/types/stat.rs` writes `#[cfg(target_os = \"android\")]` directly - so it is simultaneously dead and misleading (a future reader who starts using `#[cfg(android)]` gets silently-disabled code).","fix":"Fix or delete the alias:\n\n```rust\n        android: { target_os = \"android\" },\n```\n\ninstead of\n\n```rust\n        android: { target_arch = \"android\" },\n```","locations":[{"ref":"pavao/build.rs:5-12","code":"    5 |         // Platforms\n    6 |         aarch64: { target_arch = \"aarch64\" },\n    7 |         android: { target_arch = \"android\" },\n    8 |         arm: { target_arch = \"arm\" },\n    9 |         riscv64: { target_arch = \"riscv64\" },\n   10 |         x86_64: { target_arch = \"x86_64\" },\n   11 |         linux: { target_os = \"linux\" },\n   12 |         macos: { target_os = \"macos\" },","lines":8,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/build.rs#L5-L12"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The context-unavailable error message `\"smbc context is not initialized, cannot read\"` was copied\nverbatim into the `Write` and `Seek` impls, so a failed write or seek reports \"cannot read\". This\nsends anyone debugging a write failure looking at the read path.","fix":"In `Write::write` use `\"smbc context is not initialized, cannot write\"` and in `Seek::seek` use `\"smbc context is not initialized, cannot seek\"`.","locations":[{"ref":"pavao/src/smb/types/file.rs:47-50","code":"   47 |         let ctx = self\n   48 |             .smbc\n   49 |             .ctx()\n   50 |             .map_err(|_| std::io::Error::other(\"smbc context is not initialized, cannot read\"))?;","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L47-L50"},{"ref":"pavao/src/smb/types/file.rs:70-73","code":"   70 |         let ctx = self\n   71 |             .smbc\n   72 |             .ctx()\n   73 |             .map_err(|_| std::io::Error::other(\"smbc context is not initialized, cannot read\"))?;","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L70-L73"}]},{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `SmbDirentInfo` the doc comments of `uid` and `gid` are swapped: `uid` is documented as\n\"Group ID of file\" and `gid` as \"User ID of file\". The assignments in\n`TryFrom<libsmb_file_info>` are correct (`uid: di.uid`, `gid: di.gid`), and the source struct in\n`pavao-sys` documents them correctly, so only the copied comments are wrong - but they will make a\nreader (or a future refactor) believe the two fields are swapped.","fix":"Swap the two comments back:\n\n```rust\n/// User ID of file\npub uid: u32,\n/// Group ID of file\npub gid: u32,\n```","locations":[{"ref":"pavao/src/smb/types/stat.rs:259-262","code":"  259 |     /// Group ID of file\n  260 |     pub uid: u32,\n  261 |     /// User ID of file\n  262 |     pub gid: u32,","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L259-L262"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`ctx()` returns `Ok(...)` for the raw pointer without ever checking it for `NULL`. The global context *is* `NULL` before the first `SmbClient::new` and again after any `SmbClient::drop` (which sets it back to `ptr::null_mut()`), so every public method (`unlink`, `list_dir`, `stat`, `open_with`, `SmbFile::read`/`write`/`seek`/`drop`, ...) can pass `NULL` straight into `smbc_getFunctionUnlink(NULL)` etc. Those accessors are plain `return c->unlink;` style functions in libsmbclient, so this is an immediate NULL dereference and process crash instead of a returned `SmbError`.","fix":"Reject the null pointer in `ctx()` so all callers get an error instead of crashing:\n\n```rust\npub fn ctx(&self) -> SmbResult<*mut SMBCCTX> {\n    let ptr = SMBCTX.lock().map_err(|_| SmbError::Mutex)?.get();\n    if ptr.is_null() {\n        return Err(SmbError::BadFileDescriptor);\n    }\n    Ok(ptr)\n}\n```","locations":[{"ref":"pavao/src/smb/client.rs:469-472","code":"  469 |     /// Get underlying context\n  470 |     pub fn ctx(&self) -> SmbResult<*mut SMBCCTX> {\n  471 |         Ok(SMBCTX.lock().map_err(|_| SmbError::Mutex)?.get())\n  472 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L469-L472"},{"ref":"pavao/src/smb/client.rs:409-417","code":"  409 |     /// Callback getter\n  410 |     #[allow(improper_ctypes_definitions)]\n  411 |     pub(crate) fn get_fn<T>(\n  412 |         &self,\n  413 |         ctx: *mut SMBCCTX,\n  414 |         get_func: unsafe extern \"C\" fn(*mut SMBCCTX) -> Option<T>,\n  415 |     ) -> std::io::Result<T> {\n  416 |         unsafe { get_func(ctx).ok_or_else(|| std::io::Error::from_raw_os_error(libc::EINVAL)) }\n  417 |     }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L409-L417"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `list_dir` / `list_dirplus` a `NULL` return from `readdir_fn` / `readdirplus_fn` is unconditionally treated as end-of-directory (`break`). libsmbclient returns `NULL` both at the end of the directory *and* on error (with `errno` set, e.g. `EBADF`, `EINVAL`, or a dropped connection mid-enumeration). The function then returns `Ok(entries)` with a silently truncated listing, so a caller mirroring or deleting a directory sees a partial view and believes it is complete. The return value of `closedir_fn` is also explicitly discarded with `let _ = ...`.","fix":"Clear `errno` before each call and distinguish the two cases, and stop ignoring the `closedir` result:\n\n```rust\n*libc::__errno_location() = 0;\nlet dirent = readdir_fn(ctx, fd);\nif dirent.is_null() {\n    let err = std::io::Error::last_os_error();\n    if err.raw_os_error() != Some(0) {\n        return Err(err.into());\n    }\n    break; // real end of directory\n}\n```\n\n(use `libc::errno`/the portable helper for non-Linux targets).","locations":[{"ref":"pavao/src/smb/client.rs:221-225","code":"  221 |         loop {\n  222 |             let dirent = readdir_fn(self.ctx()?, fd);\n  223 |             if dirent.is_null() {\n  224 |                 break;\n  225 |             }","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L221-L225"},{"ref":"pavao/src/smb/client.rs:246-248","code":"  246 |         // Close directory\n  247 |         let _ = closedir_fn(self.ctx()?, fd);\n  248 |         Ok(entries)","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L246-L248"},{"ref":"pavao/src/smb/client.rs:267-271","code":"  267 |         loop {\n  268 |             let direntplus = readdirplus_fn(self.ctx()?, fd);\n  269 |             if direntplus.is_null() {\n  270 |                 break;\n  271 |             }","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L267-L271"},{"ref":"pavao/src/smb/client.rs:295-297","code":"  295 |         // Close directory\n  296 |         let _ = closedir_fn(self.ctx()?, fd);\n  297 |         Ok(entries)","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L295-L297"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`stat` and `statvfs` call `utils::last_os_error()` twice: once to format the `error!` log line and once to build the returned error. `error!` runs the whole `log` pipeline (formatting, timestamping and a `write(2)` when a logger is installed), any of which may overwrite `errno`, so the error handed back to the caller can be unrelated to the failure (frequently `Success` or `ENOENT` from an internal probe). `errno` must be captured once, immediately after the failing call.","fix":"Capture the error once and reuse it. In both functions replace\n\n```rust\nerror!(\"failed to stat file: {}\", utils::last_os_error());\nErr(utils::last_os_error())\n```\n\nwith\n\n```rust\nlet err = utils::last_os_error();\nerror!(\"failed to stat file: {}\", err);\nErr(err)\n```","locations":[{"ref":"pavao/src/smb/client.rs:329-338","code":"  329 |         unsafe {\n  330 |             let mut st: libc::statvfs = mem::zeroed();\n  331 |             let statvfs_fn = self.get_fn(self.ctx()?, smbc_getFunctionStatVFS)?;\n  332 |             if statvfs_fn(self.ctx()?, p.as_ptr(), &mut st) < 0 {\n  333 |                 error!(\"failed to stat filesystem: {}\", utils::last_os_error());\n  334 |                 Err(utils::last_os_error())\n  335 |             } else {\n  336 |                 Ok(SmbStatVfs::from(st))\n  337 |             }\n  338 |         }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L329-L338"},{"ref":"pavao/src/smb/client.rs:348-357","code":"  348 |         unsafe {\n  349 |             let mut st: libc::stat = mem::zeroed();\n  350 |             let stat_fn = self.get_fn(self.ctx()?, smbc_getFunctionStat)?;\n  351 |             if stat_fn(self.ctx()?, p.as_ptr(), &mut st) < 0 {\n  352 |                 error!(\"failed to stat file: {}\", utils::last_os_error());\n  353 |                 Err(utils::last_os_error())\n  354 |             } else {\n  355 |                 Ok(SmbStat::from(st))\n  356 |             }\n  357 |         }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L348-L357"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Any directory entry that fails to decode is silently dropped from the listing. `SmbDirent::try_from` fails when `char_ptr_to_string(d.comment)` sees a `NULL` pointer (`SmbError::BadValue`), when the name is not valid UTF-8 (`CStr::to_str` is used, and server-supplied names need not be UTF-8), or when `smbc_type` is outside 1..=9. In `list_dir` this only produces an `error!` log and the entry is skipped, so `list_dir` returns `Ok` with files missing - a silent data-loss bug for any caller that mirrors or deletes a tree. The log line also prints `dirent` (a raw pointer), so it shows only an address and gives no clue which entry was dropped.","fix":"Make the conversion lossy rather than fallible for the string fields: treat a `NULL` or empty `comment` as `String::new()`, decode the name with `String::from_utf8_lossy`, and keep the hard error only for a genuinely unknown `smbc_type`. Alternatively surface the failure to the caller instead of dropping the entry. Also log the decoded name/`smbc_type` instead of the raw pointer.","locations":[{"ref":"pavao/src/smb/types/dirent.rs:37-49","code":"   37 | impl TryFrom<smbc_dirent> for SmbDirent {\n   38 |     type Error = SmbError;\n   39 | \n   40 |     fn try_from(d: smbc_dirent) -> Result<Self, Self::Error> {\n   41 |         let comment = char_ptr_to_string(d.comment)?;\n   42 |         let name = char_ptr_to_string(d.name.as_slice().as_ptr())?;\n   43 |         Ok(Self {\n   44 |             type_: SmbDirentType::try_from(d.smbc_type)?,\n   45 |             comment,\n   46 |             name,\n   47 |         })\n   48 |     }\n   49 | }","lines":13,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/dirent.rs#L37-L49"},{"ref":"pavao/src/smb/client.rs:236-242","code":"  236 |                     Ok(_) => {\n  237 |                         trace!(\"ignoring '..', '.' directories\");\n  238 |                     }\n  239 |                     Err(e) => {\n  240 |                         error!(\"failed to decode directory entity {:?}: {}\", dirent, e);\n  241 |                     }\n  242 |                 }","lines":7,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L236-L242"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Drop for SmbFile` is the only way a file is closed, and it discards every failure: the return value\nof `close_fn` is ignored, and if `self.smbc.ctx()` or `get_fn(..., smbc_getFunctionClose)` fails the\nhandle is never closed at all (silent leak of the server-side handle for the lifetime of the\ncontext). Since `flush()` is a no-op, `close` is the last point at which the server can report a\nwrite error (out of quota, disk full, lease break), so a write can appear to have succeeded while the\ndata was rejected. There is also no `close()`/`into_inner()` method that would let a caller observe\nthe error.","fix":"Add an explicit `pub fn close(mut self) -> SmbResult<()>` that performs the close, checks the result with `utils::to_result_with_le`, marks the handle as already closed (e.g. set `self.fd = std::ptr::null_mut()` and have `Drop` skip a null fd), and keep `Drop` as a best-effort fallback that at least logs: `if close_fn(ctx, self.fd) < 0 { error!(\"failed to close file: {}\", utils::last_os_error()); }`.","locations":[{"ref":"pavao/src/smb/types/file.rs:61-64","code":"   61 |     fn flush(&mut self) -> io::Result<()> {\n   62 |         trace!(\"flush is not supported on SmbFile\");\n   63 |         Ok(())\n   64 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L61-L64"},{"ref":"pavao/src/smb/types/file.rs:86-95","code":"   86 | impl Drop for SmbFile<'_> {\n   87 |     fn drop(&mut self) {\n   88 |         trace!(\"closing file\");\n   89 |         if let Ok(ctx) = self.smbc.ctx() {\n   90 |             if let Ok(close_fn) = self.smbc.get_fn(ctx, smbc_getFunctionClose) {\n   91 |                 close_fn(ctx, self.fd);\n   92 |             }\n   93 |         }\n   94 |     }\n   95 | }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L86-L95"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`Seek::seek` wraps the `lseek` result with `utils::to_result_with_errno(res, libc::EINVAL)`, which\nhard-codes `EINVAL` as the reported error. Any failure - `EBADF` on a stale handle, `ENOTSUP`,\n`EIO`, a broken connection - is reported to the caller as `InvalidInput`, discarding the real `errno`\nthat libsmbclient just set. The `Read` and `Write` impls in the same file correctly use\n`to_result_with_le`, which reads `errno`, so this is an inconsistency inside one file.","fix":"Use the real OS error, like the `Read`/`Write` impls do:\n\n```rust\nlet res = utils::to_result_with_le(res)?;\n```\n\ninstead of `let res = utils::to_result_with_errno(res, libc::EINVAL)?;`","locations":[{"ref":"pavao/src/smb/types/file.rs:80-82","code":"   80 |         let res = lseek_fn(ctx, self.fd, off, whence);\n   81 |         let res = utils::to_result_with_errno(res, libc::EINVAL)?;\n   82 |         Ok(res as u64)","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L80-L82"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`char_ptr_to_string` maps any non-UTF-8 byte sequence to `SmbError::BadValue`, and\n`TryFrom<libsmb_file_info>` propagates that with `?`. SMB servers legitimately return file names in\nother encodings (or with unpaired surrogates transcoded from UTF-16), and `short_name` may be an\narbitrary 8.3 byte string. A single such entry makes the whole `readdirplus` conversion fail, so one\nodd file name hides an entire directory listing, and the error message (\"server returned with a bad\nvalue\") tells the user nothing about which name or which byte was bad.","fix":"Prefer lossy decoding for server-provided names so a listing never fails on one entry:\n\n```rust\npub fn char_ptr_to_string_lossy(ptr: *const c_char) -> SmbResult<String> {\n    if ptr.is_null() {\n        return Err(SmbError::BadValue);\n    }\n    Ok(unsafe { CStr::from_ptr(ptr) }.to_string_lossy().into_owned())\n}\n```\n\nand use it for `di.name` / `di.short_name`. If strictness is wanted instead, carry the offending bytes in the error variant.","locations":[{"ref":"pavao/src/utils.rs:97-108","code":"   97 | /// Convert char pointer to string\n   98 | #[inline(always)]\n   99 | pub fn char_ptr_to_string(ptr: *const c_char) -> SmbResult<String> {\n  100 |     if ptr.is_null() {\n  101 |         return Err(SmbError::BadValue);\n  102 |     }\n  103 |     let c_str = unsafe { std::ffi::CStr::from_ptr(ptr) };\n  104 |     c_str\n  105 |         .to_str()\n  106 |         .map(|x| x.to_string())\n  107 |         .map_err(|_| SmbError::BadValue)\n  108 | }","lines":12,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/utils.rs#L97-L108"},{"ref":"pavao/src/smb/types/stat.rs:286-292","code":"  286 | impl TryFrom<libsmb_file_info> for SmbDirentInfo {\n  287 |     type Error = SmbError;\n  288 | \n  289 |     fn try_from(di: libsmb_file_info) -> Result<Self, Self::Error> {\n  290 |         let name = char_ptr_to_string(di.name)?;\n  291 |         let short_name = char_ptr_to_string(di.short_name)?;\n  292 | ","lines":7,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L286-L292"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"When `pkg-config` cannot find `smbclient`, the helpful hint (\"Make sure libsmbclient is installed... `brew install samba`\") is printed with `println!`, i.e. onto the build script's stdout, where Cargo interprets it as (unknown) metadata and hides it unless the build is run with `-vv`. The user only sees the raw `pkg-config` panic message. The `println!` also starts with a bare `error:` which Cargo does not understand.","fix":"Use the `cargo:warning=` channel (which Cargo always shows) or fold the hint into the panic message:\n\n```rust\n        Err(e) => {\n            panic!(\"SMB Client library not found ({e}). Make sure libsmbclient is installed; on macOS: `brew install samba`.\");\n        }\n```","locations":[{"ref":"pavao-sys/build.rs:27-33","code":"   27 |         Err(e) => {\n   28 |             println!(\n   29 |                 \"error: SMB Client library not found! Make sure libsmbclient is installed. \\\n   30 |                 For macOS, install it via Homebrew with `brew install samba`.\"\n   31 |             );\n   32 |             panic!(\"{}\", e);\n   33 |         }","lines":7,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L27-L33"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`SmbError`'s wrapping variants do not declare their inner errors as sources: `Io(IoError)` and `NulInPath(NulError)` have no `#[from]`/`#[source]` attribute, so `thiserror` generates no `Error::source()` implementation and the error chain stops at `SmbError`. Consumers using `anyhow`, `{:#}` or `.source()` traversal lose the underlying `io::Error` (only the flattened `Display` string survives), and the two hand-written `From` impls duplicate what `#[from]` would generate.","fix":"Let `thiserror` generate both the conversion and the source:\n\n```rust\n    #[error(\"IO Error: {0}\")]\n    Io(#[from] IoError),\n    #[error(\"bad path: {0}\")]\n    NulInPath(#[from] NulError),\n```\n\nand delete the manual `impl From<IoError>` / `impl From<NulError>` blocks.","locations":[{"ref":"pavao/src/error.rs:14-26","code":"   14 | #[derive(Debug, Error)]\n   15 | pub enum SmbError {\n   16 |     #[error(\"server returned a bad file descriptor\")]\n   17 |     BadFileDescriptor,\n   18 |     #[error(\"server returned with a bad value\")]\n   19 |     BadValue,\n   20 |     #[error(\"IO Error: {0}\")]\n   21 |     Io(IoError),\n   22 |     #[error(\"bad path: {0}\")]\n   23 |     NulInPath(NulError),\n   24 |     #[error(\"mutex error\")]\n   25 |     Mutex,\n   26 | }","lines":13,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/error.rs#L14-L26"},{"ref":"pavao/src/error.rs:40-50","code":"   40 | impl From<IoError> for SmbError {\n   41 |     fn from(e: IoError) -> Self {\n   42 |         Self::Io(e)\n   43 |     }\n   44 | }\n   45 | \n   46 | impl From<NulError> for SmbError {\n   47 |     fn from(e: NulError) -> Self {\n   48 |         Self::NulInPath(e)\n   49 |     }\n   50 | }","lines":11,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/error.rs#L40-L50"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Two error variants describe the wrong thing. `BadValue` renders as \"server returned with a bad value\" but is produced for purely local failures - a null pointer or a non-UTF-8 byte sequence in `utils::char_ptr_to_string`, and for `get_netbios_name`/`get_workgroup`/`get_user`/`get_version` results that never came from a server. `Mutex` renders as \"mutex error\" and carries no payload, discarding the `PoisonError` (i.e. the fact that another thread panicked while holding the global context or credential lock), which is exactly the information needed to debug it.","fix":"Reword/split the variants, e.g. `#[error(\"invalid or non-UTF-8 value returned by libsmbclient\")] BadValue` and `#[error(\"a lock was poisoned by a panicking thread: {0}\")] Mutex(String)`, passing `e.to_string()` at the `map_err(|_| SmbError::Mutex)` call sites in `client.rs`.","locations":[{"ref":"pavao/src/error.rs:16-26","code":"   16 |     #[error(\"server returned a bad file descriptor\")]\n   17 |     BadFileDescriptor,\n   18 |     #[error(\"server returned with a bad value\")]\n   19 |     BadValue,\n   20 |     #[error(\"IO Error: {0}\")]\n   21 |     Io(IoError),\n   22 |     #[error(\"bad path: {0}\")]\n   23 |     NulInPath(NulError),\n   24 |     #[error(\"mutex error\")]\n   25 |     Mutex,\n   26 | }","lines":11,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/error.rs#L16-L26"},{"ref":"pavao/src/utils.rs:99-108","code":"   99 | pub fn char_ptr_to_string(ptr: *const c_char) -> SmbResult<String> {\n  100 |     if ptr.is_null() {\n  101 |         return Err(SmbError::BadValue);\n  102 |     }\n  103 |     let c_str = unsafe { std::ffi::CStr::from_ptr(ptr) };\n  104 |     c_str\n  105 |         .to_str()\n  106 |         .map(|x| x.to_string())\n  107 |         .map_err(|_| SmbError::BadValue)\n  108 | }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/utils.rs#L99-L108"}]},{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`get_netbios_name`, `get_workgroup`, `get_user` and `get_version` collapse every failure into `SmbError::BadValue` with `map_err(|_| SmbError::BadValue)`, discarding the underlying cause (a NUL pointer versus invalid UTF-8 are indistinguishable). Additionally, `utils::result_from_ptr_mut` turns a `NULL` return into `io::Error::last_os_error()`, but these libsmbclient getters simply return `c->netbios_name` and do not set `errno`, so the reported `io::Error` is whatever stale value `errno` happened to hold - a misleading error message.","fix":"Handle the `NULL` case explicitly with a dedicated error (e.g. `SmbError::BadValue`) rather than routing it through `result_from_ptr_mut`/`errno`, and preserve the UTF-8 error, for instance by adding an `SmbError::Utf8(Utf8Error)` variant or using `String::from_utf8_lossy` where a lossy value is acceptable.","locations":[{"ref":"pavao/src/smb/client.rs:92-99","code":"   92 |     /// Get netbios name from server\n   93 |     pub fn get_netbios_name(&self) -> SmbResult<String> {\n   94 |         trace!(\"getting netbios name\");\n   95 |         unsafe {\n   96 |             let ptr = utils::result_from_ptr_mut(sm
