ted while a first one is alive silently reuses the first client's context *and* its credentials - the caller's username/password are dropped on the floor and the connection authenticates as somebody else; (2) heap addresses are recycled, so after `smbc_free_context` a newly allocated context can land on the same address as a stale entry that `Drop` failed to remove, again authenticating with foreign credentials. A keyed credential store is the wrong abstraction for a design that only ever supports one global context.","fix":"Either make the context per-client (each `SmbClient` owns its own `*mut SMBCCTX` and stores its credentials under a genuinely unique key, e.g. a monotonically increasing `AtomicU64` id stashed in the context's user data), or drop the map entirely and store a single `Mutex<Option<SmbCredentials>>` next to the single global context, returning an explicit error from `SmbClient::new` when a second client with different credentials is requested. In either case, do not derive the key from a pointer address.","locations":[{"ref":"pavao/src/smb/auth_service.rs:14-28","code":"   14 | impl AuthService {\n   15 |     pub fn insert<S: AsRef<str>>(&mut self, uuid: S, creds: SmbCredentials) {\n   16 |         trace!(\"new credentials for {}\", uuid.as_ref());\n   17 |         self.credentials.insert(uuid.as_ref().to_string(), creds);\n   18 |     }\n   19 | \n   20 |     pub fn remove<S: AsRef<str>>(&mut self, uuid: S) {\n   21 |         trace!(\"removed credentials for {}\", uuid.as_ref());\n   22 |         self.credentials.remove(uuid.as_ref());\n   23 |     }\n   24 | \n   25 |     pub fn get<S: AsRef<str>>(&self, uuid: S) -> &SmbCredentials {\n   26 |         self.credentials.get(uuid.as_ref()).unwrap()\n   27 |     }\n   28 | }","lines":15,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/auth_service.rs#L14-L28"},{"ref":"pavao/src/smb/client.rs:61-90","code":"   61 |     pub fn new(credentials: SmbCredentials, options: SmbOptions) -> SmbResult<Self> {\n   62 |         let uri = Self::build_uri(credentials.server.as_str(), credentials.share.as_str());\n   63 |         let smbc = SmbClient { uri };\n   64 |         // insert credentials\n   65 |         trace!(\"creating context...\");\n   66 |         // get current context\n   67 |         let mut ctx_lock = SMBCTX.lock().map_err(|_| SmbError::Mutex)?;\n   68 |         // if context is null, create a new one\n   69 |         if ctx_lock.is_null() {\n   70 |             unsafe {\n   71 |                 let ctx = utils::result_from_ptr_mut(smbc_new_context())?;\n   72 |                 // set options\n   73 |                 trace!(\"configuring client options\");\n   74 |                 smbc_setFunctionAuthDataWithContext(ctx, Some(Self::auth_wrapper));\n   75 |                 Self::setup_options(ctx, options);\n   76 | \n   77 |                 // set ctx\n   78 |                 let smb_ctx = utils::result_from_ptr_mut(smbc_init_context(ctx))?;\n   79 |                 trace!(\"context initialized\");\n   80 |                 AUTH_SERVICE\n   81 |                     .lock()\n   82 |                     .unwrap()\n   83 |                     .insert(Self::auth_service_uuid(smb_ctx), credentials);\n   84 | \n   85 |                 // set context\n   86 |                 ctx_lock.set(smb_ctx);\n   87 |             }\n   88 |         }\n   89 |         Ok(smbc)\n   90 |     }","lines":30,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L61-L90"},{"ref":"pavao/src/smb/client.rs:465-467","code":"  465 |     fn auth_service_uuid(ctx: *mut SMBCCTX) -> String {\n  466 |         format!(\"{:?}\", ctx)\n  467 |     }","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L465-L467"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"hard","description":"Thread safety is claimed but not provided. `unsafe impl Sync for SmbContext` / `unsafe impl Send for SmbContext` are asserted on a wrapper around a `*mut SMBCCTX`, and `SmbClient` (a plain `String`) is automatically `Send + Sync`, so users can freely share `&SmbClient` across threads. A libsmbclient `SMBCCTX` is *not* thread safe. The `Mutex` only protects the pointer value: `ctx()` takes the lock, copies the pointer out and releases the lock *before* the actual `smbc_*` call is made, so two threads can be inside libsmbclient on the same context concurrently. Worse, `readdir` returns a pointer into a single per-context dirent buffer, so a concurrent `list_dir` from another thread overwrites the entry the first thread is decoding.","fix":"Hold the lock for the whole duration of each libsmbclient call rather than just while reading the pointer: have `ctx()` return the `MutexGuard` (e.g. `fn ctx(&self) -> SmbResult<MutexGuard<'_, SmbContext>>`) and perform the FFI call while the guard is alive. Alternatively make `SmbClient` `!Sync` (e.g. by storing a `PhantomData<*const ()>`) and document that one context must be used from a single thread, which is what libsmbclient actually guarantees.","locations":[{"ref":"pavao/src/smb/client.rs:46-52","code":"   46 | unsafe impl Sync for SmbContext {}\n   47 | unsafe impl Send for SmbContext {}\n   48 | \n   49 | lazy_static! {\n   50 |     static ref AUTH_SERVICE: Mutex<AuthService> = Mutex::new(AuthService::default());\n   51 |     static ref SMBCTX: Arc<Mutex<SmbContext>> = Arc::new(Mutex::new(SmbContext::null()));\n   52 | }","lines":7,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L46-L52"},{"ref":"pavao/src/smb/client.rs:469-472","code":"  469 |     /// Get underlying context\n  470 |     pub fn ctx(&self) -> SmbResult<*mut SMBCCTX> {\n  471 |         Ok(SMBCTX.lock().map_err(|_| SmbError::Mutex)?.get())\n  472 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L469-L472"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"high","difficulty":"easy","description":"`TryFrom<libsmb_file_info>` reads a struct whose Rust declaration does not match the C ABI on 32-bit\ntargets: `pavao_sys::libsmb_file_info::size` is declared `c_ulong` while `libsmbclient.h` declares\n`uint64_t size`. On any ILP32 target - including `linux_arm`, which `stat.rs` explicitly claims to\nsupport - the Rust struct is 4 bytes shorter at the front, so `attrs`, `uid`, `gid`, all four\n`timespec`s and both `*mut c_char` pointers are read from the wrong offsets. `char_ptr_to_string(di.name)`\nthen dereferences a garbage pointer, i.e. undefined behaviour / segfault rather than merely wrong\nmetadata.","fix":"Declare the field with its fixed-width C type:\n\n```rust\npub struct libsmb_file_info {\n    /// Size of file\n    pub size: u64,\n    ...\n}\n```\n\n(`uint64_t` -> `u64`, not `c_ulong`). Consider `debug_assert_eq!(size_of::<libsmb_file_info>(), ...)` or generating the bindings with `bindgen` to prevent recurrence.","locations":[{"ref":"pavao/src/smb/types/stat.rs:286-306","code":"  286 | impl TryFrom<libsmb_file_info> for SmbDirentInfo {\n  287 |     type Error = SmbError;\n  288 | \n  289 |     fn try_from(di: libsmb_file_info) -> Result<Self, Self::Error> {\n  290 |         let name = char_ptr_to_string(di.name)?;\n  291 |         let short_name = char_ptr_to_string(di.short_name)?;\n  292 | \n  293 |         Ok(Self {\n  294 |             name,\n  295 |             short_name,\n  296 |             size: di.size as u64,\n  297 |             ctime: time_t_to_system_time(di.ctime_ts.tv_sec),\n  298 |             btime: time_t_to_system_time(di.btime_ts.tv_sec),\n  299 |             mtime: time_t_to_system_time(di.mtime_ts.tv_sec),\n  300 |             atime: time_t_to_system_time(di.atime_ts.tv_sec),\n  301 |             uid: di.uid,\n  302 |             gid: di.gid,\n  303 |             attrs: di.attrs,\n  304 |         })\n  305 |     }\n  306 | }","lines":21,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L286-L306"},{"ref":"pavao-sys/src/lib.rs:67-93","code":"   67 | #[repr(C)]\n   68 | #[derive(Copy)]\n   69 | /// Structure that represents all attributes of a directory entry.\n   70 | /// libsmb_file_info as implemented in libsmbclient.h\n   71 | pub struct libsmb_file_info {\n   72 |     /// Size of file\n   73 |     pub size: c_ulong,\n   74 |     /// DOS attributes of file\n   75 |     pub attrs: c_ushort,\n   76 |     /// User ID of file\n   77 |     pub uid: c_uint,\n   78 |     /// Group ID of file\n   79 |     pub gid: c_uint,\n   80 |     /// Birth/Create time of file (if supported by system)\n   81 |     ///Otherwise the value will be 0\n   82 |     pub btime_ts: timespec,\n   83 |     /// Modified time for the file\n   84 |     pub mtime_ts: timespec,\n   85 |     /// Access time for the file\n   86 |     pub atime_ts: timespec,\n   87 |     /// Change time for the file\n   88 |     pub ctime_ts: timespec,\n   89 |     /// Name of file\n   90 |     pub name: *mut c_char,\n   91 |     /// Short name of file\n   92 |     pub short_name: *mut c_char,\n   93 | }","lines":27,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L67-L93"}]},{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"All ~1300 object paths are appended to a single `ar rcs` invocation. Each argument is an absolute path (roughly 150-200 bytes with a typical `target/.../build/pavao-sys-<hash>/out` prefix), so the command line is on the order of 200-250 KB. That exceeds macOS's `ARG_MAX` of 262144 bytes (which also has to accommodate the environment) and can exceed limits on other platforms with deep output directories, producing an `Argument list too long` failure that is unrelated to anything the user did.","fix":"Avoid one huge argv: either pass a response file (`ar rcs libsmbclient.a @objects.txt`, writing one path per line into `lib_dir`), or run `ar` in batches - a first `ar rc` followed by repeated `ar r` calls of a few hundred objects each and a final `ar s`. Passing paths relative to `lib_dir` (which is already the command's working directory) also cuts the length substantially.","locations":[{"ref":"pavao-src/src/lib.rs:1560-1591","code":" 1560 |         let mut build_static = cc.get_archiver();\n 1561 |         build_static.arg(\"rcs\");\n 1562 |         build_static.arg(\"libsmbclient.a\");\n 1563 |         build_static.current_dir(&lib_dir);\n 1564 | \n 1565 |         // dedup src files\n 1566 |         let unique_src: HashSet<String> = SRC_FILES\n 1567 |             .iter()\n 1568 |             .chain(TDB_SRC)\n 1569 |             .chain(TALLOC_SRC)\n 1570 |             .chain(TEVENT_SRC)\n 1571 |             .map(|s| s.to_string())\n 1572 |             .collect();\n 1573 | \n 1574 |         let mut logfile = std::fs::File::create(\"/tmp/samba-build.log\")\n 1575 |             .map_err(|e| format!(\"failed to create build log: {e}\"))?;\n 1576 |         // push object\n 1577 |         for object in unique_src {\n 1578 |             let path = lib_dir.join(object);\n 1579 | \n 1580 |             let object_file = Self::find_object_for_src(&path).ok_or(format!(\n 1581 |                 \"object file not found for source file: {}\",\n 1582 |                 path.display()\n 1583 |             ))?;\n 1584 | \n 1585 |             use std::io::Write;\n 1586 |             writeln!(logfile, \"object file: {}\", object_file.display()).ok();\n 1587 |             build_static.arg(object_file.display().to_string());\n 1588 |         }\n 1589 | \n 1590 |         // run ar\n 1591 |         self.run_command(build_static, \"building static library\")?;","lines":32,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1560-L1591"}]},{"id":"OTHER_5","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"The object-file listing is written to the hardcoded path `/tmp/samba-build.log`. This is a predictable name in a world-writable directory, so another local user can pre-create it as a symlink and have the build truncate/overwrite an arbitrary file owned by the building user; two concurrent builds (or two crates in the same workspace) also clobber each other's log. Additionally the path does not exist on Windows, and a failure to create it aborts an otherwise perfectly good build, even though the log is only debug output whose write errors are then discarded with `.ok()`.","fix":"Write the log inside the build's own output directory instead of `/tmp`, and do not fail the build if it cannot be created:\n\n```rust\nlet mut logfile = fs::File::create(out_dir.join(\"samba-build.log\")).ok();\n```\n\nthen only write when `logfile` is `Some`. Better still, drop the file and emit the object list to stdout, which cargo already captures per build script invocation.","locations":[{"ref":"pavao-src/src/lib.rs:1574-1587","code":" 1574 |         let mut logfile = std::fs::File::create(\"/tmp/samba-build.log\")\n 1575 |             .map_err(|e| format!(\"failed to create build log: {e}\"))?;\n 1576 |         // push object\n 1577 |         for object in unique_src {\n 1578 |             let path = lib_dir.join(object);\n 1579 | \n 1580 |             let object_file = Self::find_object_for_src(&path).ok_or(format!(\n 1581 |                 \"object file not found for source file: {}\",\n 1582 |                 path.display()\n 1583 |             ))?;\n 1584 | \n 1585 |             use std::io::Write;\n 1586 |             writeln!(logfile, \"object file: {}\", object_file.display()).ok();\n 1587 |             build_static.arg(object_file.display().to_string());","lines":14,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1574-L1587"}]},{"id":"OTHER_6","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"The file-offset and stat types are taken from `libc` without accounting for large-file support, so 32-bit targets get a different ABI than the library. Samba is built with `_FILE_OFFSET_BITS=64`, meaning the real `smbc_lseek`/`smbc_telldir`/`smbc_lseekdir` use a 64-bit `off_t` and `smbc_stat`/`smbc_fstat`/`smbc_statvfs` use the `stat64`/`statvfs64` layouts. On 32-bit targets (`arm`, `i686`), `libc::off_t` is `i32` and `libc::stat`/`libc::statvfs` are the non-LFS layouts, so offsets are passed/returned in the wrong register width and `stat` fields are read from the wrong offsets - silently corrupt sizes/offsets and possible stack corruption when the library writes a larger `struct stat64` into a smaller Rust `libc::stat`. The crate advertises 32-bit support (`linux_arm` cfg alias in `pavao/build.rs`, ARM branches in `stat.rs`).","fix":"Use the LFS types on 32-bit Linux: alias `off_t` to `libc::off64_t` and `stat`/`statvfs` to `libc::stat64`/`libc::statvfs64` (e.g. `#[cfg(target_pointer_width = \"32\")] type smbc_off_t = libc::off64_t;`), and use those aliases in `smbc_lseek_fn`, `smbc_telldir_fn`, `smbc_lseekdir_fn`, `smbc_stat_fn`, `smbc_fstat_fn`, `smbc_fstatdir_fn` and `smbc_statvfs_fn`. Alternatively document 32-bit targets as unsupported and gate the crate with a `compile_error!` there.","locations":[{"ref":"pavao-sys/src/lib.rs:253-261","code":"  253 | pub type smbc_lseek_fn = option::Option<\n  254 |     extern \"C\" fn(c: *mut SMBCCTX, file: *mut SMBCFILE, offset: off_t, whence: c_int) -> off_t,\n  255 | >;\n  256 | pub type smbc_stat_fn =\n  257 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, fname: *const c_char, st: *mut stat) -> c_int>;\n  258 | pub type smbc_statvfs_fn =\n  259 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, fname: *const c_char, st: *mut statvfs) -> c_int>;\n  260 | pub type smbc_fstat_fn =\n  261 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, file: *mut SMBCFILE, st: *mut stat) -> c_int>;","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L253-L261"},{"ref":"pavao-sys/src/lib.rs:284-289","code":"  284 | pub type smbc_telldir_fn =\n  285 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, dir: *mut SMBCFILE) -> off_t>;\n  286 | pub type smbc_lseekdir_fn =\n  287 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, dir: *mut SMBCFILE, offset: off_t) -> c_int>;\n  288 | pub type smbc_fstatdir_fn =\n  289 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, dir: *mut SMBCFILE, st: *mut stat) -> c_int>;","lines":6,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L284-L289"}]},{"id":"OTHER_7","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`list_dir` and `list_dirplus` leak the directory handle on several paths. After `opendir_fn` succeeds, `self.get_fn(self.ctx()?, smbc_getFunctionClosedir)?` and `self.get_fn(self.ctx()?, smbc_getFunctionReaddir)?` are executed with `?`, and `self.ctx()?` is called again on every loop iteration; any of these failing returns from the function without ever calling `closedir_fn`, so the `SMBCFILE` (and its server-side handle) stays open for the lifetime of the process. A panic inside the loop (e.g. the `unwrap` chain reached through `SmbDirent::try_from` decoding, or an allocation failure) has the same effect.","fix":"Resolve the context and all three function pointers *before* calling `opendir_fn`, and wrap the handle in a guard type whose `Drop` calls `closedir_fn` so it is closed on every path (early return, error, or panic):\n\n```rust\nstruct DirGuard { ctx: *mut SMBCCTX, fd: *mut SMBCFILE, closedir: smbc_closedir_fn }\nimpl Drop for DirGuard { fn drop(&mut self) { if let Some(f) = self.closedir { f(self.ctx, self.fd); } } }\n```","locations":[{"ref":"pavao/src/smb/client.rs:211-222","code":"  211 |         let path = utils::str_to_cstring(self.uri(path))?;\n  212 |         let opendir_fn = self.get_fn(self.ctx()?, smbc_getFunctionOpendir)?;\n  213 |         let fd = opendir_fn(self.ctx()?, path.as_ptr());\n  214 |         if fd.is_null() {\n  215 |             error!(\"failed to open directory: returned a bad file descriptor\");\n  216 |             return Err(SmbError::BadFileDescriptor);\n  217 |         }\n  218 |         let closedir_fn = self.get_fn(self.ctx()?, smbc_getFunctionClosedir)?;\n  219 |         let mut entries = Vec::new();\n  220 |         let readdir_fn = self.get_fn(self.ctx()?, smbc_getFunctionReaddir)?;\n  221 |         loop {\n  222 |             let dirent = readdir_fn(self.ctx()?, fd);","lines":12,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L211-L222"},{"ref":"pavao/src/smb/client.rs:244-248","code":"  244 |         }\n  245 |         trace!(\"decoded {} dirents\", entries.len());\n  246 |         // Close directory\n  247 |         let _ = closedir_fn(self.ctx()?, fd);\n  248 |         Ok(entries)","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L244-L248"},{"ref":"pavao/src/smb/client.rs:257-268","code":"  257 |         let path = utils::str_to_cstring(self.uri(path))?;\n  258 |         let opendir_fn = self.get_fn(self.ctx()?, smbc_getFunctionOpendir)?;\n  259 |         let fd = opendir_fn(self.ctx()?, path.as_ptr());\n  260 |         if fd.is_null() {\n  261 |             error!(\"failed to open directory: returned a bad file descriptor\");\n  262 |             return Err(SmbError::BadFileDescriptor);\n  263 |         }\n  264 |         let closedir_fn = self.get_fn(self.ctx()?, smbc_getFunctionClosedir)?;\n  265 |         let mut entries = Vec::new();\n  266 |         let readdirplus_fn = self.get_fn(self.ctx()?, smbc_getFunctionReaddirPlus)?;\n  267 |         loop {\n  268 |             let direntplus = readdirplus_fn(self.ctx()?, fd);","lines":12,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L257-L268"},{"ref":"pavao/src/smb/client.rs:293-297","code":"  293 |         }\n  294 |         trace!(\"decoded {} direntpluses\", entries.len());\n  295 |         // Close directory\n  296 |         let _ = closedir_fn(self.ctx()?, fd);\n  297 |         Ok(entries)","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L293-L297"}]},{"id":"OTHER_8","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`write_to_cstr` logs the buffer contents both before and after writing\n(`trace!(\"orig: {:?}\", cstr(dest))` and the final `trace!(\"write to ... {:?}\", cstr(dest))`). It is\ncalled from the auth callback for the workgroup, the username **and the password**, so enabling\n`trace` logging writes the user's cleartext password into the application log. The \"orig\" trace is\nadditionally unsound: it builds a `CStr` from a caller-provided buffer whose bytes are not guaranteed\nto be initialised, so it can read uninitialised memory (UB) and can echo whatever the previous\noccupant of that stack buffer was.","fix":"Remove both content traces (or log only lengths):\n\n```rust\ntrace!(\"writing {} bytes into [{:p};{}]\", src.len(), dest, len);\n```\n\nNever pass `src` or `cstr(dest)` to a logging macro from this function, since one of its three call sites is the password buffer.","locations":[{"ref":"pavao/src/utils.rs:29-51","code":"   29 | pub unsafe fn write_to_cstr(dest: *mut u8, len: usize, src: &str) {\n   30 |     // just to ensure that it can be interpreted as c string\n   31 |     *dest.add(len - 1) = 0u8;\n   32 |     trace!(\"orig: {:?}\", cstr(dest));\n   33 | \n   34 |     let mut buf = slice::from_raw_parts_mut(dest, len);\n   35 |     let mut idx = buf.write(src.as_bytes()).unwrap();\n   36 | \n   37 |     if idx == len {\n   38 |         idx -= 1;\n   39 |     }\n   40 |     buf = slice::from_raw_parts_mut(dest, len);\n   41 |     buf[idx] = 0u8;\n   42 | \n   43 |     trace!(\n   44 |         \"write to [{:p};{}] from [{:p},{}]: {:?}\",\n   45 |         dest,\n   46 |         len,\n   47 |         src.as_ptr(),\n   48 |         src.len(),\n   49 |         cstr(dest)\n   50 |     );\n   51 | }","lines":23,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/utils.rs#L29-L51"}]},{"id":"OTHER_9","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`unique_src` is a `HashSet<String>`, so the iteration order that determines the `ar` argument order is randomised per process by the default hasher. The resulting `libsmbclient.a` differs (member order, and therefore bytes) between otherwise identical builds, which breaks reproducible-build and artifact-caching workflows and makes build failures harder to reproduce. It also allocates ~1300 needless `String`s from `&'static str` data.","fix":"Use an ordered, borrowing set:\n\n```rust\nlet unique_src: std::collections::BTreeSet<&str> =\n    SRC_FILES.iter().chain(TDB_SRC).chain(TALLOC_SRC).chain(TEVENT_SRC).copied().collect();\n```\n\n(add `use std::collections::BTreeSet;` and drop the now-unused `HashSet` import if nothing else needs it).","locations":[{"ref":"pavao-src/src/lib.rs:1566-1577","code":" 1566 |         let unique_src: HashSet<String> = SRC_FILES\n 1567 |             .iter()\n 1568 |             .chain(TDB_SRC)\n 1569 |             .chain(TALLOC_SRC)\n 1570 |             .chain(TEVENT_SRC)\n 1571 |             .map(|s| s.to_string())\n 1572 |             .collect();\n 1573 | \n 1574 |         let mut logfile = std::fs::File::create(\"/tmp/samba-build.log\")\n 1575 |             .map_err(|e| format!(\"failed to create build log: {e}\"))?;\n 1576 |         // push object\n 1577 |         for object in unique_src {","lines":12,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1566-L1577"}]},{"id":"OTHER_10","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`pavao-sys/build.rs` never emits a `cargo:rerun-if-changed` directive. Cargo's default \"re-run when any file in the package changes\" only applies while the script emits *no* `rerun-if-*` instruction at all - and `pkg_config::find_library`/`Config::probe` emit `cargo:rerun-if-env-changed=...` lines (env metadata is on by default). The default is therefore disabled, and edits to `build.rs` itself (or to the vendored `pavao-src` outputs) do not necessarily trigger a rebuild, leading to stale link configuration that only a `cargo clean` fixes.","fix":"Emit the directive explicitly at the top of `main`:\n\n```rust\nfn main() {\n    println!(\"cargo:rerun-if-changed=build.rs\");\n    // ...\n}\n```","locations":[{"ref":"pavao-sys/build.rs:1-10","code":"    1 | fn main() {\n    2 |     #[cfg(feature = \"vendored\")]\n    3 |     {\n    4 |         build_vendored();\n    5 |     }\n    6 |     #[cfg(not(feature = \"vendored\"))]\n    7 |     {\n    8 |         build_normal();\n    9 |     }\n   10 | }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L1-L10"}]},{"id":"OTHER_11","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"In `build_normal`, both arms of the `if cfg!(target_os = \"macos\")` print the identical `cargo:rustc-link-lib=smbclient`, so the condition only affects the search path. Worse, `pkg_config::find_library` already emits the link metadata itself (cargo metadata is enabled by default), so `-lsmbclient` ends up on the link line twice, and the manual line overrides any `static=`/framework specifics `pkg-config` reported.","fix":"Hoist the duplicated statement out of the branches and drop it altogether if `pkg-config` already emitted it:\n\n```rust\n    match pkg_config::find_library(\"smbclient\") {\n        Ok(_) => {\n            if cfg!(target_os = \"macos\") {\n                // only the search paths are macOS-specific\n            }\n        }\n        // ...\n    }\n```","locations":[{"ref":"pavao-sys/build.rs:14-26","code":"   14 |     match pkg_config::find_library(\"smbclient\") {\n   15 |         Ok(_) => {\n   16 |             if cfg!(target_os = \"macos\") {\n   17 |                 if cfg!(target_arch = \"aarch64\") {\n   18 |                     println!(\"cargo:rustc-link-search=/opt/homebrew/opt/samba/lib\");\n   19 |                 } else if cfg!(target_arch = \"x86_64\") {\n   20 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/samba/lib\");\n   21 |                 }\n   22 |                 println!(\"cargo:rustc-link-lib=smbclient\");\n   23 |             } else {\n   24 |                 println!(\"cargo:rustc-link-lib=smbclient\");\n   25 |             }\n   26 |         }","lines":13,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L14-L26"}]},{"id":"OTHER_12","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The crate-level example is a plain ```rust block, so `cargo test` compiles *and runs* it. It calls `SmbClient::new(..).unwrap()`, which links against and calls into libsmbclient (`smbc_new_context`/`smbc_init_context`), mutating process-global state and panicking if the C library cannot initialise a context (missing/unreadable `smb.conf`, restricted environment). A documentation example should not depend on the runtime environment.","fix":"Mark the example as compile-only:\n\n```rust\n//! ```no_run\n//! use pavao::{SmbClient, SmbCredentials, SmbOptions};\n```\n\ninstead of\n\n```rust\n//! ```rust\n```","locations":[{"ref":"pavao/src/lib.rs:17-35","code":"   17 | //! ```rust\n   18 | //! use pavao::{SmbClient, SmbCredentials, SmbOptions};\n   19 | //!\n   20 | //! let client = SmbClient::new(\n   21 | //!     SmbCredentials::default()\n   22 | //!         .server(\"smb://localhost:3445\")\n   23 | //!         .share(\"/temp\")\n   24 | //!         .username(\"test\")\n   25 | //!         .password(\"test\")\n   26 | //!         .workgroup(\"pavao\"),\n   27 | //!     SmbOptions::default()\n   28 | //!         .case_sensitive(true)\n   29 | //!         .one_share_per_server(true),\n   30 | //!     )\n   31 | //!     .unwrap();\n   32 | //!\n   33 | //! // drop connection\n   34 | //! drop(client);\n   35 | //! ```","lines":19,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/lib.rs#L17-L35"}]},{"id":"OTHER_13","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`AuthService` derives `Debug` and holds `SmbCredentials`, which also derives `Debug` over a plaintext `password: String`. Any `{:?}` of the service (or of the credentials, or of an `SmbOptions`-style aggregate holding them) prints the user's SMB password verbatim; this module already logs credential keys at `trace!` level, so it is one careless `trace!(\"{:?}\", self)` away from writing passwords to the log.","fix":"Replace the derives with manual `Debug` impls that redact the secret, e.g. for `SmbCredentials` print `password: \"***\"` (and keep the other fields), and either do the same for `AuthService` or drop its `#[derive(Debug)]`. Storing the password in a zeroizing wrapper would be a further improvement.","locations":[{"ref":"pavao/src/smb/auth_service.rs:9-12","code":"    9 | #[derive(Debug, Default)]\n   10 | pub struct AuthService {\n   11 |     pub credentials: HashMap<String, SmbCredentials>,\n   12 | }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/auth_service.rs#L9-L12"},{"ref":"pavao/src/smb/types/credentials.rs:5-13","code":"    5 | /// SmbCredentials\n    6 | #[derive(Debug, Default, Clone)]\n    7 | pub struct SmbCredentials {\n    8 |     pub(crate) password: String,\n    9 |     pub(crate) server: String,\n   10 |     pub(crate) share: String,\n   11 |     pub(crate) username: String,\n   12 |     pub(crate) workgroup: String,\n   13 | }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/credentials.rs#L5-L13"}]},{"id":"OTHER_14","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`SmbCredentials` derives `Debug` while holding a plaintext `password`, so any `{:?}` of it (or of `AuthService`, which also derives `Debug` and owns a `HashMap<String, SmbCredentials>`) prints the password into logs. The credentials are additionally cloned into a process-global static map that lives for the whole lifetime of the context and are never zeroized on drop, so the password stays in memory (and can be duplicated further by every `HashMap` rehash and by the `.clone()` performed on each authentication callback).","fix":"Implement `Debug` manually and redact the secret:\n\n```rust\nimpl std::fmt::Debug for SmbCredentials {\n    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n        f.debug_struct(\"SmbCredentials\")\n            .field(\"server\", &self.server)\n            .field(\"share\", &self.share)\n            .field(\"username\", &self.username)\n            .field(\"workgroup\", &self.workgroup)\n            .field(\"password\", &\"<redacted>\")\n            .finish()\n    }\n}\n```\n\nAlso avoid the per-callback `.clone()` (borrow the entry while the lock is held) and consider a zeroizing string type for `password`.","locations":[{"ref":"pavao/src/smb/types/credentials.rs:5-13","code":"    5 | /// SmbCredentials\n    6 | #[derive(Debug, Default, Clone)]\n    7 | pub struct SmbCredentials {\n    8 |     pub(crate) password: String,\n    9 |     pub(crate) server: String,\n   10 |     pub(crate) share: String,\n   11 |     pub(crate) username: String,\n   12 |     pub(crate) workgroup: String,\n   13 | }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/credentials.rs#L5-L13"},{"ref":"pavao/src/smb/client.rs:454-458","code":"  454 |             let creds = AUTH_SERVICE\n  455 |                 .lock()\n  456 |                 .unwrap()\n  457 |                 .get(Self::auth_service_uuid(ctx))\n  458 |                 .clone();","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L454-L458"}]},{"id":"OTHER_15","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"Neither `SmbCredentials::server` nor `SmbClient::build_uri` validates or documents that `server` must be a full SMB URL such as `smb://host:445`. The builder happily accepts `\"host\"` or `\"//host\"`, `build_uri` just concatenates it with the share, and the failure only surfaces much later as an opaque `EINVAL` from an unrelated call (libsmbclient rejects the unparsable URL). The doc comment \"Construct SmbCredentials with the provided server\" gives no hint about the expected format.","fix":"Document the required `smb://` prefix on `SmbCredentials::server` and validate it in `SmbClient::new` (or prepend it in `build_uri` when it is missing), returning a clear error such as `SmbError::BadValue` instead of deferring the failure to the first operation.","locations":[{"ref":"pavao/src/smb/types/credentials.rs:22-26","code":"   22 |     /// Construct SmbCredentials with the provided server\n   23 |     pub fn server<S: AsRef<str>>(mut self, server: S) -> Self {\n   24 |         self.server = server.as_ref().to_string();\n   25 |         self\n   26 |     }","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/credentials.rs#L22-L26"},{"ref":"pavao/src/smb/client.rs:388-399","code":"  388 |     /// Build connection uri\n  389 |     fn build_uri(server: &str, share: &str) -> String {\n  390 |         format!(\n  391 |             \"{}{}{}\",\n  392 |             server,\n  393 |             match share.starts_with('/') {\n  394 |                 true => \"\",\n  395 |                 false => \"/\",\n  396 |             },\n  397 |             share\n  398 |         )\n  399 |     }","lines":12,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L388-L399"}]},{"id":"OTHER_16","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`SmbModeClass::as_byte` and `impl From<SmbModeClass> for mode_t` contain the byte-for-byte identical\nbit-packing expression. Two copies of the same encoding rule can drift apart if one is ever fixed.","fix":"Make one delegate to the other:\n\n```rust\n/// Convert permission to byte as on POSIX systems\npub fn as_byte(&self) -> mode_t {\n    mode_t::from(*self)\n}\n```","locations":[{"ref":"pavao/src/smb/types/mode.rs:146-149","code":"  146 |     /// Convert permission to byte as on POSIX systems\n  147 |     pub fn as_byte(&self) -> mode_t {\n  148 |         ((self.read as mode_t) << 2) + ((self.write as mode_t) << 1) + (self.execute as mode_t)\n  149 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/mode.rs#L146-L149"},{"ref":"pavao/src/smb/types/mode.rs:162-166","code":"  162 | impl From<SmbModeClass> for mode_t {\n  163 |     fn from(pex: SmbModeClass) -> Self {\n  164 |         ((pex.read as mode_t) << 2) + ((pex.write as mode_t) << 1) + (pex.execute as mode_t)\n  165 |     }\n  166 | }","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/mode.rs#L162-L166"}]}]</script>

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
