<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}

.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}

.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}

.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}

.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}

mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`auth_wrapper` is an `extern \"C\"` callback invoked by libsmbclient, and it contains two panicking operations: `AUTH_SERVICE.lock().unwrap()` (panics if the mutex was poisoned by an earlier panic) and `AuthService::get`, which is `self.credentials.get(uuid).unwrap()` and panics when no entry exists for that context pointer. A panic unwinding out of an `extern \"C\"` function aborts the process (and is UB across the C frames). The missing-key case is reachable: credentials are registered only *after* `smbc_init_context` returns and are removed by `SmbClient::drop`, so any authentication attempt outside that window (or by a second client whose credentials were never inserted, see the related finding) aborts the whole program.","fix":"Make the callback panic-free: change `AuthService::get` to return `Option<&SmbCredentials>`, use `lock().unwrap_or_else(|e| e.into_inner())` (or a non-poisoning lock), and when no credentials are found simply leave the output buffers as they are and log an error, e.g.\n\n```rust\nlet Ok(guard) = AUTH_SERVICE.lock() else { return };\nlet Some(creds) = guard.get(Self::auth_service_uuid(ctx)) else { return };\n```\n\nOptionally wrap the body in `std::panic::catch_unwind` as a backstop.","locations":[{"ref":"pavao/src/smb/client.rs:450-462","code":"  450 |         unsafe {\n  451 |             let srv = utils::cstr(srv);\n  452 |             let shr = utils::cstr(shr);\n  453 |             trace!(\"authenticating on {}\\\\{}\", &srv, &shr);\n  454 |             let creds = AUTH_SERVICE\n  455 |                 .lock()\n  456 |                 .unwrap()\n  457 |                 .get(Self::auth_service_uuid(ctx))\n  458 |                 .clone();\n  459 |             utils::write_to_cstr(wg as *mut u8, wglen as usize, &creds.workgroup);\n  460 |             utils::write_to_cstr(un as *mut u8, unlen as usize, &creds.username);\n  461 |             utils::write_to_cstr(pw as *mut u8, pwlen as usize, &creds.password);\n  462 |         }","lines":13,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L450-L462"},{"ref":"pavao/src/smb/auth_service.rs:25-27","code":"   25 |     pub fn get<S: AsRef<str>>(&self, uuid: S) -> &SmbCredentials {\n   26 |         self.credentials.get(uuid.as_ref()).unwrap()\n   27 |     }","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/auth_service.rs#L25-L27"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`cc::Build::get_compiler`, `get_archiver` and `get_ranlib` are documented to **panic** when the tool cannot be determined (they are `try_get_*().unwrap()` internally). This is a realistic build-time failure (no C compiler installed, unknown/cross target, missing `AR_<target>`), and because these calls sit inside `try_build`, the panic escapes the whole `Result`-based error path: the caller never gets the intended `cargo:warning=pavao-src: failed to build samba from source` message and instead sees a raw `cc` panic backtrace.","fix":"Use the fallible variants and map their errors into the function's `String` error type, e.g. `let compiler = cc.try_get_compiler().map_err(|e| format!(\"no C compiler: {e}\"))?;` and likewise `try_get_archiver()` / `try_get_ranlib()` for lines 1471, 1493 and 1560.","locations":[{"ref":"pavao-src/src/lib.rs:1464-1471","code":" 1464 |         let compiler = cc.get_compiler();\n 1465 |         let mut cc_env = compiler.cc_env();\n 1466 |         if cc_env.is_empty() {\n 1467 |             cc_env = compiler.path().to_path_buf().into_os_string();\n 1468 |         }\n 1469 | \n 1470 |         // get ar\n 1471 |         let ar = cc.get_archiver();","lines":8,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1464-L1471"},{"ref":"pavao-src/src/lib.rs:1493-1493","code":" 1493 |         let ranlib = cc.get_ranlib();","lines":1,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1493"},{"ref":"pavao-src/src/lib.rs:1560-1560","code":" 1560 |         let mut build_static = cc.get_archiver();","lines":1,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1560"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`build_target` splits the captured iOS sysroot on `\"/SDKs/\"` and then indexes `components[1]` unconditionally. Any `-isysroot` value that does not contain `/SDKs/` (a custom SDK location, a symlinked sysroot, or a path such as `/opt/sdk/iPhoneSimulator.sdk`) yields a one-element vector and the build script panics with an index-out-of-bounds instead of reporting a usable error.","fix":"Replace the indexing with a checked split:\n\n```rust\nif let Some(ref isysr) = ios_isysroot {\n    let (cross_top, cross_sdk) = isysr\n        .split_once(\"/SDKs/\")\n        .ok_or_else(|| format!(\"unexpected -isysroot value: {isysr}\"))?;\n    make.env(\"CROSS_TOP\", cross_top);\n    make.env(\"CROSS_SDK\", cross_sdk);\n}\n```","locations":[{"ref":"pavao-src/src/lib.rs:1626-1630","code":" 1626 |         if let Some(ref isysr) = ios_isysroot {\n 1627 |             let components: Vec<&str> = isysr.split(\"/SDKs/\").collect();\n 1628 |             make.env(\"CROSS_TOP\", components[0]);\n 1629 |             make.env(\"CROSS_SDK\", components[1]);\n 1630 |         }","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1626-L1630"}]},{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"critical","difficulty":"hard","description":"The `SMBCCTX` is a process-global singleton (`lazy_static! { static ref SMBCTX: Arc<Mutex<SmbContext>> }`), but `Drop for SmbClient` unconditionally frees it with `smbc_free_context(context.get(), 1_i32)` and sets it to `NULL`. Dropping *any* `SmbClient` therefore destroys the context that every other live `SmbClient` is still using, and the `shutdown_ctx = 1` argument forces libsmbclient to close and free all still-open `SMBCFILE` handles. Any `SmbFile` obtained from a *different* client instance is now a dangling `*mut SMBCFILE`, and its own `Drop` will call `smbc_getFunctionClose` on freed memory. Because `ctx()` happily returns the `NULL` pointer afterwards (see the separate finding), surviving clients also pass `NULL` into `smbc_getFunctionXxx`, which dereferences it and segfaults. This is trivially reachable: create two clients (e.g. two shares, or a client per request in a server), drop one, keep using the other.","fix":"Make the context per-client instead of global: store `inner: *mut SMBCCTX` inside `SmbClient` itself, create it in `SmbClient::new`, and free it in `Drop` for that instance only. If a shared context must be kept for compatibility, it has to be reference counted, so `Drop` only calls `smbc_free_context` when the last `SmbClient` goes away:\n\n```rust\nstruct SmbContext {\n    inner: *mut SMBCCTX,\n    refs: usize,\n}\n```\n\nand in `Drop`: decrement `refs`, and only call `smbc_free_context(ptr, 1)` plus `context.set(ptr::null_mut())` when `refs` reaches `0`.","locations":[{"ref":"pavao/src/smb/client.rs:49-52","code":"   49 | lazy_static! {\n   50 |     static ref AUTH_SERVICE: Mutex<AuthService> = Mutex::new(AuthService::default());\n   51 |     static ref SMBCTX: Arc<Mutex<SmbContext>> = Arc::new(Mutex::new(SmbContext::null()));\n   52 | }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L49-L52"},{"ref":"pavao/src/smb/client.rs:502-519","code":"  502 | impl Drop for SmbClient {\n  503 |     fn drop(&mut self) {\n  504 |         trace!(\"removing uri from auth service\");\n  505 |         unsafe {\n  506 |             if let Ok(mut context) = SMBCTX.lock() {\n  507 |                 AUTH_SERVICE\n  508 |                     .lock()\n  509 |                     .unwrap()\n  510 |                     .remove(Self::auth_service_uuid(context.get()));\n  511 |                 trace!(\"closing smbclient\");\n  512 |                 smbc_free_context(context.get(), 1_i32);\n  513 |                 // set context to null\n  514 |                 context.set(ptr::null_mut());\n  515 |             }\n  516 |         }\n  517 |         trace!(\"smbclient context freed\");\n  518 |     }\n  519 | }","lines":18,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L502-L519"}]},{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"`SmbFile` stores a raw `*mut SMBCFILE` and ties its validity to `&'a SmbClient`, which looks safe but\nis not: the `SMBCCTX` those handles belong to is a **process-global** `SMBCTX`, and\n`Drop for SmbClient` unconditionally calls `smbc_free_context(ctx, 1)` and nulls the global. With two\nlive `SmbClient` values (the second one reuses the existing global context and does not even apply\nits own options), dropping *either* client frees the context and closes all its files, leaving every\n`SmbFile` borrowed from the *other* client with a dangling handle. Its `read`/`write`/`seek` and its\n`Drop` then pass that stale pointer back into libsmbclient - use-after-free. The borrow checker gives\nno protection because the lifetime is attached to the wrong object (the client wrapper, not the\ncontext).","fix":"Make ownership match reality: refcount the shared context (e.g. `Arc<SmbContext>` handed to both `SmbClient` and `SmbFile`) and only call `smbc_free_context` when the last strong reference goes away, so a file keeps the context alive; or drop the global entirely and give each `SmbClient` its own `SMBCCTX` so that `&'a SmbClient` really does bound the handle's lifetime.","locations":[{"ref":"pavao/src/smb/types/file.rs:15-24","code":"   15 | pub struct SmbFile<'a> {\n   16 |     smbc: &'a SmbClient,\n   17 |     fd: *mut SMBCFILE,\n   18 | }\n   19 | \n   20 | impl<'a> SmbFile<'a> {\n   21 |     pub(crate) fn new(smbc: &'a SmbClient, fd: *mut SMBCFILE) -> Self {\n   22 |         Self { smbc, fd }\n   23 |     }\n   24 | }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L15-L24"},{"ref":"pavao/src/smb/types/file.rs:86-95","code":"   86 | impl Drop for SmbFile<'_> {\n   87 |     fn drop(&mut self) {\n   88 |         trace!(\"closing file\");\n   89 |         if let Ok(ctx) = self.smbc.ctx() {\n   90 |             if let Ok(close_fn) = self.smbc.get_fn(ctx, smbc_getFunctionClose) {\n   91 |                 close_fn(ctx, self.fd);\n   92 |             }\n   93 |         }\n   94 |     }\n   95 | }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L86-L95"},{"ref":"pavao/src/smb/client.rs:502-519","code":"  502 | impl Drop for SmbClient {\n  503 |     fn drop(&mut self) {\n  504 |         trace!(\"removing uri from auth service\");\n  505 |         unsafe {\n  506 |             if let Ok(mut context) = SMBCTX.lock() {\n  507 |                 AUTH_SERVICE\n  508 |                     .lock()\n  509 |                     .unwrap()\n  510 |                     .remove(Self::auth_service_uuid(context.get()));\n  511 |                 trace!(\"closing smbclient\");\n  512 |                 smbc_free_context(context.get(), 1_i32);\n  513 |                 // set context to null\n  514 |                 context.set(ptr::null_mut());\n  515 |             }\n  516 |         }\n  517 |         trace!(\"smbclient context freed\");\n  518 |     }\n  519 | }","lines":18,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L502-L519"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`smbc_setNetbiosName`, `smbc_setWorkgroup` and `smbc_setUser` are declared as taking `*mut c_char`, but the C prototypes take `const char *` and the library copies the string: disassembly of `smbc_setNetbiosName` in `libsmbclient.so.0` shows `free(ctx->netbios_name)` followed by `strdup(arg)`. The `*mut` declaration invites the ownership-transfer pattern that `client.rs` actually uses - `smbc_setNetbiosName(self.ctx()?, name.into_raw())` - which leaks the `CString` allocation on every call to `set_netbios_name`, `set_workgroup` and `set_user`, since libsmbclient never frees the caller's buffer. (Had the library taken ownership, the pointer would be released with C `free()` while being allocated by Rust's allocator, which is UB - so `into_raw()` is wrong either way.)","fix":"Declare the setters with the C constness so the borrow pattern becomes the natural one:\n\n```rust\n    pub fn smbc_setNetbiosName(c: *mut SMBCCTX, netbios_name: *const c_char);\n    pub fn smbc_setWorkgroup(c: *mut SMBCCTX, workgroup: *const c_char);\n    pub fn smbc_setUser(c: *mut SMBCCTX, user: *const c_char);\n```\n\nand in `client.rs` keep the `CString` alive for the duration of the call and pass `name.as_ptr()` instead of `name.into_raw()`.","locations":[{"ref":"pavao-sys/src/lib.rs:443-448","code":"  443 |     pub fn smbc_getNetbiosName(c: *mut SMBCCTX) -> *mut c_char;\n  444 |     pub fn smbc_setNetbiosName(c: *mut SMBCCTX, netbios_name: *mut c_char);\n  445 |     pub fn smbc_getWorkgroup(c: *mut SMBCCTX) -> *mut c_char;\n  446 |     pub fn smbc_setWorkgroup(c: *mut SMBCCTX, workgroup: *mut c_char);\n  447 |     pub fn smbc_getUser(c: *mut SMBCCTX) -> *mut c_char;\n  448 |     pub fn smbc_setUser(c: *mut SMBCCTX, user: *mut c_char);","lines":6,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L443-L448"},{"ref":"pavao/src/smb/client.rs:102-110","code":"  102 |     pub fn set_netbios_name<S>(&self, name: S) -> SmbResult<()>\n  103 |     where\n  104 |         S: AsRef<str>,\n  105 |     {\n  106 |         trace!(\"setting netbios name to {}\", name.as_ref());\n  107 |         let name = utils::str_to_cstring(name)?;\n  108 |         unsafe { smbc_setNetbiosName(self.ctx()?, name.into_raw()) }\n  109 |         Ok(())\n  110 |     }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L102-L110"},{"ref":"pavao/src/smb/client.rs:122-130","code":"  122 |     pub fn set_workgroup<S>(&self, name: S) -> SmbResult<()>\n  123 |     where\n  124 |         S: AsRef<str>,\n  125 |     {\n  126 |         trace!(\"configuring workgroup to {}\", name.as_ref());\n  127 |         let name = utils::str_to_cstring(name)?;\n  128 |         unsafe { smbc_setWorkgroup(self.ctx()?, name.into_raw()) }\n  129 |         Ok(())\n  130 |     }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L122-L130"},{"ref":"pavao/src/smb/client.rs:142-150","code":"  142 |     pub fn set_user<S>(&self, name: S) -> SmbResult<()>\n  143 |     where\n  144 |         S: AsRef<str>,\n  145 |     {\n  146 |         trace!(\"configuring current username as {}\", name.as_ref());\n  147 |         let name = utils::str_to_cstring(name)?;\n  148 |         unsafe { smbc_setUser(self.ctx()?, name.into_raw()) }\n  149 |         Ok(())\n  150 |     }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L142-L150"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `SmbClient::new` the context returned by `smbc_new_context()` is leaked whenever initialization fails: if `smbc_init_context(ctx)` returns `NULL`, `utils::result_from_ptr_mut(...)?` returns early and nothing calls `smbc_free_context(ctx, 1)`. The same applies if `AUTH_SERVICE.lock()` panics. libsmbclient explicitly requires the caller to free a context whose initialization failed, and a whole `SMBCCTX` (with its internal caches) is a substantial leak that repeats on every retry of a failing connection.","fix":"Free the raw context before propagating the error:\n\n```rust\nlet smb_ctx = match utils::result_from_ptr_mut(smbc_init_context(ctx)) {\n    Ok(c) => c,\n    Err(e) => {\n        smbc_free_context(ctx, 1_i32);\n        return Err(e.into());\n    }\n};\n```","locations":[{"ref":"pavao/src/smb/client.rs:69-88","code":"   69 |         if ctx_lock.is_null() {\n   70 |             unsafe {\n   71 |                 let ctx = utils::result_from_ptr_mut(smbc_new_context())?;\n   72 |                 // set options\n   73 |                 trace!(\"configuring client options\");\n   74 |                 smbc_setFunctionAuthDataWithContext(ctx, Some(Self::auth_wrapper));\n   75 |                 Self::setup_options(ctx, options);\n   76 | \n   77 |                 // set ctx\n   78 |                 let smb_ctx = utils::result_from_ptr_mut(smbc_init_context(ctx))?;\n   79 |                 trace!(\"context initialized\");\n   80 |                 AUTH_SERVICE\n   81 |                     .lock()\n   82 |                     .unwrap()\n   83 |                     .insert(Self::auth_service_uuid(smb_ctx), credentials);\n   84 | \n   85 |                 // set context\n   86 |                 ctx_lock.set(smb_ctx);\n   87 |             }\n   88 |         }","lines":20,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L69-L88"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"`set_netbios_name`, `set_workgroup` and `set_user` all pass `name.into_raw()` to libsmbclient. `into_raw` gives up ownership of the `CString` and nothing ever calls `CString::from_raw` on it, so the allocation is leaked on every call. The C prototypes are `void smbc_setNetbiosName(SMBCCTX *c, const char *netbios_name)` (and likewise for the other two), i.e. the parameter is `const` and libsmbclient duplicates the string internally, so there is no reason to hand over ownership at all.","fix":"Keep ownership in Rust and pass a borrowed pointer; the `CString` stays alive until the end of the function, which is after the call returns. For each of the three setters replace\n\n```rust\nunsafe { smbc_setNetbiosName(self.ctx()?, name.into_raw()) }\n```\n\nwith\n\n```rust\nunsafe { smbc_setNetbiosName(self.ctx()?, name.as_ptr().cast_mut()) }\n```","locations":[{"ref":"pavao/src/smb/client.rs:102-110","code":"  102 |     pub fn set_netbios_name<S>(&self, name: S) -> SmbResult<()>\n  103 |     where\n  104 |         S: AsRef<str>,\n  105 |     {\n  106 |         trace!(\"setting netbios name to {}\", name.as_ref());\n  107 |         let name = utils::str_to_cstring(name)?;\n  108 |         unsafe { smbc_setNetbiosName(self.ctx()?, name.into_raw()) }\n  109 |         Ok(())\n  110 |     }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L102-L110"},{"ref":"pavao/src/smb/client.rs:122-130","code":"  122 |     pub fn set_workgroup<S>(&self, name: S) -> SmbResult<()>\n  123 |     where\n  124 |         S: AsRef<str>,\n  125 |     {\n  126 |         trace!(\"configuring workgroup to {}\", name.as_ref());\n  127 |         let name = utils::str_to_cstring(name)?;\n  128 |         unsafe { smbc_setWorkgroup(self.ctx()?, name.into_raw()) }\n  129 |         Ok(())\n  130 |     }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L122-L130"},{"ref":"pavao/src/smb/client.rs:142-150","code":"  142 |     pub fn set_user<S>(&self, name: S) -> SmbResult<()>\n  143 |     where\n  144 |         S: AsRef<str>,\n  145 |     {\n  146 |         trace!(\"configuring current username as {}\", name.as_ref());\n  147 |         let name = utils::str_to_cstring(name)?;\n  148 |         unsafe { smbc_setUser(self.ctx()?, name.into_raw()) }\n  149 |         Ok(())\n  150 |     }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L142-L150"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`write_to_cstr` starts with `*dest.add(len - 1) = 0u8;`. `len` is a `usize` coming straight from the\n`wglen`/`unlen`/`pwlen` arguments of the libsmbclient auth callback (`wglen as usize` in\n`pavao/src/smb/client.rs:459-461`). If any of those is `0` (or negative, which also becomes a huge\n`usize` after `as usize`), `len - 1` wraps to `usize::MAX` and the function writes a zero byte at a\nwild address - out-of-bounds write in an `unsafe fn` with no precondition documented. The following\n`slice::from_raw_parts_mut(dest, len)` / `buf[idx] = 0` would also be wrong for `len == 0`.","fix":"Bail out on an empty buffer before touching it:\n\n```rust\npub unsafe fn write_to_cstr(dest: *mut u8, len: usize, src: &str) {\n    if dest.is_null() || len == 0 {\n        return;\n    }\n    // just to ensure that it can be interpreted as c string\n    *dest.add(len - 1) = 0u8;\n    ...\n```\n\nand guard the negative case at the call site with `if wglen > 0 { ... }` (or `usize::try_from(wglen)`).","locations":[{"ref":"pavao/src/utils.rs:29-41","code":"   29 | pub unsafe fn write_to_cstr(dest: *mut u8, len: usize, src: &str) {\n   30 |     // just to ensure that it can be interpreted as c string\n   31 |     *dest.add(len - 1) = 0u8;\n   32 |     trace!(\"orig: {:?}\", cstr(dest));\n   33 | \n   34 |     let mut buf = slice::from_raw_parts_mut(dest, len);\n   35 |     let mut idx = buf.write(src.as_bytes()).unwrap();\n   36 | \n   37 |     if idx == len {\n   38 |         idx -= 1;\n   39 |     }\n   40 |     buf = slice::from_raw_parts_mut(dest, len);\n   41 |     buf[idx] = 0u8;","lines":13,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/utils.rs#L29-L41"},{"ref":"pavao/src/smb/client.rs:459-461","code":"  459 |             utils::write_to_cstr(wg as *mut u8, wglen as usize, &creds.workgroup);\n  460 |             utils::write_to_cstr(un as *mut u8, unlen as usize, &creds.username);\n  461 |             utils::write_to_cstr(pw as *mut u8, pwlen as usize, &creds.password);","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L459-L461"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`set_timeout` converts with `timeout.as_millis() as c_int`: `as_millis` returns `u128`, so any duration above ~24.8 days truncates, and values above `i32::MAX` ms wrap to a negative timeout that libsmbclient will interpret as an invalid/immediate timeout. Symmetrically, `get_timeout` does `smbc_getTimeout(...) as u64`, so a negative value returned by the C library becomes a `Duration` of ~584 million years instead of an error.","fix":"Clamp on the way in and reject negatives on the way out:\n\n```rust\nlet ms = c_int::try_from(timeout.as_millis()).unwrap_or(c_int::MAX);\nunsafe { smbc_setTimeout(self.ctx()?, ms) }\n```\n\n```rust\nlet ms = unsafe { smbc_getTimeout(self.ctx()?) };\nlet ms = u64::try_from(ms).map_err(|_| SmbError::BadValue)?;\nOk(Duration::from_millis(ms))\n```","locations":[{"ref":"pavao/src/smb/client.rs:152-163","code":"  152 |     /// Get timeout from server\n  153 |     pub fn get_timeout(&self) -> SmbResult<Duration> {\n  154 |         trace!(\"getting timeout\");\n  155 |         unsafe { Ok(Duration::from_millis(smbc_getTimeout(self.ctx()?) as u64)) }\n  156 |     }\n  157 | \n  158 |     /// Set timeout to server\n  159 |     pub fn set_timeout(&self, timeout: Duration) -> SmbResult<()> {\n  160 |         trace!(\"setting timeout to {}ms\", timeout.as_millis());\n  161 |         unsafe { smbc_setTimeout(self.ctx()?, timeout.as_millis() as c_int) }\n  162 |         Ok(())\n  163 |     }","lines":12,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L152-L163"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`auth_wrapper` casts the buffer lengths it receives from C with `wglen as usize`, `unlen as usize`, `pwlen as usize` without any validation. The lengths are `c_int`; a value of `0` makes `utils::write_to_cstr` compute `dest.add(len - 1)`, which underflows to `usize::MAX` and performs a wild out-of-bounds write, and a negative value becomes a huge `usize` that turns the following `slice::from_raw_parts_mut` into a gigantic slice. Since this is an FFI callback, the values come from outside the crate and should be treated as untrusted.","fix":"Validate before converting, e.g.\n\n```rust\nlet write = |dst: *mut c_char, len: c_int, val: &str| {\n    if !dst.is_null() && len > 0 {\n        utils::write_to_cstr(dst as *mut u8, len as usize, val);\n    }\n};\nwrite(wg, wglen, &creds.workgroup);\nwrite(un, unlen, &creds.username);\nwrite(pw, pwlen, &creds.password);\n```","locations":[{"ref":"pavao/src/smb/client.rs:459-461","code":"  459 |             utils::write_to_cstr(wg as *mut u8, wglen as usize, &creds.workgroup);\n  460 |             utils::write_to_cstr(un as *mut u8, unlen as usize, &creds.username);\n  461 |             utils::write_to_cstr(pw as *mut u8, pwlen as usize, &creds.password);","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L459-L461"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`SmbStat::dev` is declared `i32` and filled with `s.st_dev as i32`, but `dev_t` is a 64-bit unsigned\ntype on Linux (and on Android/32-bit ARM too). The cast truncates the upper 32 bits, so a device\nnumber above `0xFFFF_FFFF` is reported as a wrong (possibly negative) value. Every other raw\n`stat` field in the struct is widened rather than narrowed, so this one is inconsistent as well as\nlossy.","fix":"Widen the field instead of truncating: change `pub dev: i32,` to `pub dev: u64,` and use a single `dev: s.st_dev as u64,` initialiser (dropping the per-platform `#[cfg]` arms).","locations":[{"ref":"pavao/src/smb/types/stat.rs:152-153","code":"  152 |     /// Device\n  153 |     pub dev: i32,","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L152-L153"},{"ref":"pavao/src/smb/types/stat.rs:189-200","code":"  189 |             #[cfg(target_os = \"android\")]\n  190 |             dev: s.st_dev as i32,\n  191 |             #[cfg(target_os = \"macos\")]\n  192 |             dev: s.st_dev,\n  193 |             #[cfg(linux_x86_64)]\n  194 |             dev: s.st_dev as i32,\n  195 |             #[cfg(linux_aarch64)]\n  196 |             dev: s.st_dev as i32,\n  197 |             #[cfg(linux_arm)]\n  198 |             dev: s.st_dev as i32,\n  199 |             #[cfg(linux_riscv64)]\n  200 |             dev: s.st_dev as i32,","lines":12,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L189-L200"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`time_t_to_system_time` does `Duration::from_secs(t as u64)`, so a negative `time_t` (a pre-1970\ntimestamp, which SMB servers can return, e.g. after a bogus `btime`/`ctime`) is reinterpreted as a\nvalue near `1.8e19` seconds; `checked_add` then fails and the function silently returns `UNIX_EPOCH`.\nEvery negative timestamp therefore collapses to 1970-01-01 instead of the correct pre-epoch instant,\nand the caller has no way to notice.","fix":"Handle the sign explicitly:\n\n```rust\nfn time_t_to_system_time(t: time_t) -> SystemTime {\n    if t >= 0 {\n        UNIX_EPOCH.checked_add(Duration::from_secs(t as u64))\n    } else {\n        UNIX_EPOCH.checked_sub(Duration::from_secs(t.unsigned_abs()))\n    }\n    .unwrap_or(UNIX_EPOCH)\n}\n```","locations":[{"ref":"pavao/src/smb/types/stat.rs:308-312","code":"  308 | fn time_t_to_system_time(t: time_t) -> SystemTime {\n  309 |     UNIX_EPOCH\n  310 |         .checked_add(Duration::from_secs(t as u64))\n  311 |         .unwrap_or(UNIX_EPOCH)\n  312 | }","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L308-L312"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The loop over `compiler.args()` accumulates nothing: every branch either `continue`s or falls through to an empty body, and the only lasting side effect is setting `ios_isysroot`. All of the compiler flags that `cc` computed for the requested target (`--target=`, `-m64`, `-arch`, `--sysroot`, the `opt_level(2)` flag, `-fPIC`, user `CFLAGS`/`CFLAGS_<target>`, etc.) are therefore silently thrown away and never reach samba's `configure`. Consequently `cc.target(target).host(host).warnings(false).opt_level(2)` on line 1463 is effectively a no-op except for locating the compiler binary, and only the bare compiler path is exported as `CC` (`cc_env()` is non-empty only when a compiler wrapper such as `sccache` is configured). This is a truncated copy of `openssl-src`'s argument-filtering loop, which built a `cflags` vector that was then passed to the configure step.","fix":"Collect the surviving arguments and export them, e.g. build a `Vec<OsString>` inside the loop and then `configure.env(\"CFLAGS\", joined_flags)` (merging, not replacing, any pre-existing `CFLAGS`). Also move the `if skip_next { ... }` check to the *top* of the loop body so the value following `-arch` cannot be reinterpreted by the `apple-ios` `-isysroot` branch. If passing the flags through is genuinely not wanted, delete the loop and keep only the `-isysroot` extraction, and drop the misleading `cc.warnings(false).opt_level(2)` configuration.","locations":[{"ref":"pavao-src/src/lib.rs:1498-1534","code":" 1498 |         let mut skip_next = false;\n 1499 |         let mut is_isysroot = false;\n 1500 |         let mut ios_isysroot = None;\n 1501 |         for arg in compiler.args() {\n 1502 |             // For whatever reason `-static` on MUSL seems to cause\n 1503 |             // issues...\n 1504 |             if target.contains(\"musl\") && arg == \"-static\" {\n 1505 |                 continue;\n 1506 |             }\n 1507 | \n 1508 |             // cc includes an `-arch` flag for Apple platforms, but we've\n 1509 |             // already selected an arch implicitly via the target above, and\n 1510 |             // OpenSSL contains about the conflict if both are specified.\n 1511 |             if target.contains(\"apple\") && arg == \"-arch\" {\n 1512 |                 skip_next = true;\n 1513 |                 continue;\n 1514 |             }\n 1515 | \n 1516 |             // cargo-lipo specifies this but OpenSSL complains\n 1517 |             if target.contains(\"apple-ios\") {\n 1518 |                 if arg == \"-isysroot\" {\n 1519 |                     is_isysroot = true;\n 1520 |                     continue;\n 1521 |                 }\n 1522 | \n 1523 |                 if is_isysroot {\n 1524 |                     is_isysroot = false;\n 1525 |                     ios_isysroot = Some(arg.to_str().ok_or(\"isysroot arg\")?.to_string());\n 1526 |                     continue;\n 1527 |                 }\n 1528 |             }\n 1529 | \n 1530 |             if skip_next {\n 1531 |                 skip_next = false;\n 1532 |                 continue;\n 1533 |             }\n 1534 |         }","lines":37,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1498-L1534"},{"ref":"pavao-src/src/lib.rs:1462-1468","code":" 1462 |         let mut cc = cc::Build::new();\n 1463 |         cc.target(target).host(host).warnings(false).opt_level(2);\n 1464 |         let compiler = cc.get_compiler();\n 1465 |         let mut cc_env = compiler.cc_env();\n 1466 |         if cc_env.is_empty() {\n 1467 |             cc_env = compiler.path().to_path_buf().into_os_string();\n 1468 |         }","lines":7,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1462-L1468"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"`SmbClient::new` only creates and configures a context when the global one is still `NULL`. When a second `SmbClient` is constructed while a first one is alive, the whole `if ctx_lock.is_null()` block is skipped, so the new `credentials` and `options` arguments are silently thrown away: `AUTH_SERVICE` is never updated and `Self::setup_options` is never called. The second client keeps its own `uri` (so it talks to its own server/share) but authentication for that server is served by `auth_wrapper` from the *first* client's entry, i.e. the wrong username, password and workgroup are sent to a different server. This is a silent credential mix-up, not an error: `new()` returns `Ok`.","fix":"Give each `SmbClient` its own `SMBCCTX` (created and configured in `new`, freed in `Drop`), and key `AUTH_SERVICE` on that per-client context pointer. If the singleton is kept for now, `new` must at least return an error when a caller asks for credentials/options that differ from those the existing context was built with, instead of silently ignoring them.","locations":[{"ref":"pavao/src/smb/client.rs:61-90","code":"   61 |     pub fn new(credentials: SmbCredentials, options: SmbOptions) -> SmbResult<Self> {\n   62 |         let uri = Self::build_uri(credentials.server.as_str(), credentials.share.as_str());\n   63 |         let smbc = SmbClient { uri };\n   64 |         // insert credentials\n   65 |         trace!(\"creating context...\");\n   66 |         // get current context\n   67 |         let mut ctx_lock = SMBCTX.lock().map_err(|_| SmbError::Mutex)?;\n   68 |         // if context is null, create a new one\n   69 |         if ctx_lock.is_null() {\n   70 |             unsafe {\n   71 |                 let ctx = utils::result_from_ptr_mut(smbc_new_context())?;\n   72 |                 // set options\n   73 |                 trace!(\"configuring client options\");\n   74 |                 smbc_setFunctionAuthDataWithContext(ctx, Some(Self::auth_wrapper));\n   75 |                 Self::setup_options(ctx, options);\n   76 | \n   77 |                 // set ctx\n   78 |                 let smb_ctx = utils::result_from_ptr_mut(smbc_init_context(ctx))?;\n   79 |                 trace!(\"context initialized\");\n   80 |                 AUTH_SERVICE\n   81 |                     .lock()\n   82 |                     .unwrap()\n   83 |                     .insert(Self::auth_service_uuid(smb_ctx), credentials);\n   84 | \n   85 |                 // set context\n   86 |                 ctx_lock.set(smb_ctx);\n   87 |             }\n   88 |         }\n   89 |         Ok(smbc)\n   90 |     }","lines":30,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L61-L90"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"All platform decisions in this crate are taken with `#[cfg(target_os = ...)]`, which in a build-support library evaluates against the **host** that the build script was compiled for, not the target being built. `self.target` is available and is even threaded into `cc` and `Self::os()`, yet `lib/util/gpfswrap.c`, `lib/tevent/tevent_epoll.c`, `--without-acl-support` and the gnutls include handling all key off the host. Cross-compiling (for example host Linux -> target macOS, or host macOS -> target Linux) therefore selects the wrong source list and the wrong `configure` flags, which surfaces as an opaque `object file not found for source file: ...` error from `find_object_for_src` rather than a meaningful diagnostic.","fix":"Decide platform-conditional behaviour from `self.target` (or `CARGO_CFG_TARGET_OS`) at run time instead of from `#[cfg]` at compile time. Turn `SRC_FILES` into a base list plus runtime-appended entries, e.g.:\n\n```rust\nlet mut sources: Vec<&str> = SRC_FILES.to_vec();\nif target.contains(\"linux\") {\n    sources.extend([\"lib/util/gpfswrap.c\", \"lib/tevent/tevent_epoll.c\"]);\n}\nif target.contains(\"apple\") {\n    configure.arg(\"--without-acl-support\");\n}\n```","locations":[{"ref":"pavao-src/src/lib.rs:88-89","code":"   88 |     #[cfg(target_os = \"linux\")]\n   89 |     \"lib/util/gpfswrap.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L88-L89"},{"ref":"pavao-src/src/lib.rs:111-112","code":"  111 |     #[cfg(target_os = \"linux\")]\n  112 |     \"lib/tevent/tevent_epoll.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L111-L112"},{"ref":"pavao-src/src/lib.rs:1344-1345","code":" 1344 |     #[cfg(target_os = \"linux\")]\n 1345 |     \"lib/tevent/tevent_epoll.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1344-L1345"},{"ref":"pavao-src/src/lib.rs:1482-1491","code":" 1482 |         #[cfg(target_os = \"macos\")]\n 1483 |         configure.arg(\"--without-acl-support\"); // not supported on mac\n 1484 |         configure.env(\"CC\", cc_env);\n 1485 |         configure.env(\"AR\", ar.get_program());\n 1486 |         // On MacOS we need to explicitly declare include paths for gnutls\n 1487 |         #[cfg(target_os = \"macos\")]\n 1488 |         {\n 1489 |             let gnutls_paths = self.gnutls.as_ref().ok_or(\"gnutls paths not set\")?;\n 1490 |             add_env_includes(&mut configure, gnutls_paths)?;\n 1491 |         }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1482-L1491"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`lib/util/charset/charset_macosxfs.c` is listed unconditionally, although it is the macOS/HFS+ specific charset module that samba's build only enables on Darwin hosts. Every other platform-specific entry in these tables (`lib/util/gpfswrap.c`, `lib/tevent/tevent_epoll.c`) is guarded by a `#[cfg]`, so this entry is inconsistent with its siblings. If waf does not compile it on the current platform, no `.o` exists and `find_object_for_src` makes the entire build fail with `object file not found for source file: .../charset_macosxfs.c`; if it *is* always compiled, then the `#[cfg]` guards on the other two entries are pointless. Either way the list and the guards disagree.","fix":"Guard `\"lib/util/charset/charset_macosxfs.c\"` for Apple targets only (in the same runtime, target-based way recommended for `gpfswrap.c`/`tevent_epoll.c`), and make missing objects for optional modules non-fatal - e.g. keep a small `OPTIONAL_SRC` list whose entries are skipped when `find_object_for_src` returns `None` instead of aborting the build.","locations":[{"ref":"pavao-src/src/lib.rs:122-122","code":"  122 |     \"lib/util/charset/charset_macosxfs.c\",","lines":1,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L122"},{"ref":"pavao-src/src/lib.rs:88-89","code":"   88 |     #[cfg(target_os = \"linux\")]\n   89 |     \"lib/util/gpfswrap.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L88-L89"},{"ref":"pavao-src/src/lib.rs:111-112","code":"  111 |     #[cfg(target_os = \"linux\")]\n  112 |     \"lib/tevent/tevent_epoll.c\",","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L111-L112"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Build::gnutls()` is public and unconditional, but the stored paths are only ever read inside `#[cfg(target_os = \"macos\")]`. On every other host the include directories a caller supplies are accepted and silently discarded, so a gnutls installed in a non-standard prefix on Linux/BSD cannot be found and `configure` fails for a reason the caller believes they already handled. Because the field is never read on non-macOS hosts, it also triggers a `field is never read` dead-code warning there.","fix":"Apply the include paths on all platforms: call `add_env_includes(&mut configure, paths)` whenever `self.gnutls` is `Some`, and remove the `#[cfg(target_os = \"macos\")]` gate from both the call site and the `add_env_includes` definition. Keep the \"required on macOS\" check (`ok_or(\"gnutls paths not set\")`) as the only platform-specific part.","locations":[{"ref":"pavao-src/src/lib.rs:1369-1369","code":" 1369 |     gnutls: Option<Vec<PathBuf>>,","lines":1,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1369"},{"ref":"pavao-src/src/lib.rs:1410-1413","code":" 1410 |     pub fn gnutls(&mut self, paths: Vec<PathBuf>) -> &mut Build {\n 1411 |         self.gnutls = Some(paths);\n 1412 |         self\n 1413 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1410-L1413"},{"ref":"pavao-src/src/lib.rs:1487-1491","code":" 1487 |         #[cfg(target_os = \"macos\")]\n 1488 |         {\n 1489 |             let gnutls_paths = self.gnutls.as_ref().ok_or(\"gnutls paths not set\")?;\n 1490 |             add_env_includes(&mut configure, gnutls_paths)?;\n 1491 |         }","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1487-L1491"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Because `Self::os(target)?` is called before anything else and errors out on unrecognised triples, the build aborts for targets that would build perfectly well - the returned value is only used to detect the iOS simulator. Ordinary triples missing from the table (for instance `sparc64-unknown-linux-gnu`, `x86_64-unknown-linux-gnux32`, `armv7-unknown-linux-gnueabihf`-style variants added after the table was copied, or the renamed `wasm32-wasip1`) fail with the misleading message `don't know how to configure OpenSSL for <target>`, in a crate that does not build OpenSSL. The table also contains `\"x86_64-linux\"`, which is not a rustc target triple at all.","fix":"Do not fail on unknown targets: drop the lookup entirely (see the related `dead_code` finding) or make it non-fatal, e.g. `let os = Self::os(target).unwrap_or(\"\");`. If a lookup failure is kept, reword the message to mention samba rather than OpenSSL.","locations":[{"ref":"pavao-src/src/lib.rs:1447-1447","code":" 1447 |         let os = Self::os(target)?;","lines":1,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1447"},{"ref":"pavao-src/src/lib.rs:1777-1783","code":" 1777 |             _ => {\n 1778 |                 return Err(format!(\n 1779 |                     \"don't know how to configure OpenSSL for {}\",\n 1780 |                     target\n 1781 |                 ))\n 1782 |             }\n 1783 |         };","lines":7,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1777-L1783"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`find_object_for_src` globs `\"<src>.*.o\"` and returns the first match. Two problems: (1) waf commonly compiles the same source into several objects (different subsystems/variants produce `foo.c.<n>.o` with different flags), so picking an arbitrary match can put an object built for a different subsystem or with incompatible flags into `libsmbclient.a`; (2) the source path is interpolated into a glob pattern without escaping, so any `[`, `?` or `*` in `OUT_DIR` (all legal in directory names) silently changes the pattern's meaning. On top of that, `glob::glob(...).ok()?` discards the real pattern error, and the caller reports the generic `object file not found for source file: ...` message, which sends the user hunting for a missing file that actually exists.","fix":"Escape the literal prefix (e.g. via `glob::Pattern::escape`) before appending `.*.o`, propagate the pattern/IO error instead of `.ok()?`, and make the multi-match case explicit: either assert that exactly one object matches, or select deterministically by reading waf's own object list (`bin/default/*.objlist` / the `--dump-build` output) rather than guessing from filenames.","locations":[{"ref":"pavao-src/src/lib.rs:1606-1612","code":" 1606 |     fn find_object_for_src(src: &Path) -> Option<PathBuf> {\n 1607 |         let glob = format!(\"{}.*.o\", src.display());\n 1608 |         glob::glob(&glob)\n 1609 |             .ok()?\n 1610 |             .filter_map(|entry| entry.ok())\n 1611 |             .next()\n 1612 |     }","lines":7,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1606-L1612"},{"ref":"pavao-src/src/lib.rs:1577-1588","code":" 1577 |         for object in unique_src {\n 1578 |             let path = lib_dir.join(object);\n 1579 | \n 1580 |             let object_file = Self::find_object_for_src(&path).ok_or(format!(\n 1581 |                 \"object file not found for source file: {}\",\n 1582 |                 path.display()\n 1583 |             ))?;\n 1584 | \n 1585 |             use std::io::Write;\n 1586 |             writeln!(logfile, \"object file: {}\", object_file.display()).ok();\n 1587 |             build_static.arg(object_file.display().to_string());\n 1588 |         }","lines":12,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1577-L1588"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`pavao-sys/build.rs` uses `cfg!(target_os = ...)` and `cfg!(target_arch = ...)` to decide which library search paths to emit. Build scripts are compiled and run for the *host*, so these macros describe the machine doing the build, not the machine being built for. Cross-compiling (e.g. host x86_64 Linux, target aarch64-apple-darwin, or an x86_64 host building for aarch64) therefore emits the wrong `rustc-link-search` paths and skips the macOS-specific ones entirely, producing confusing link failures.","fix":"Read the target from the environment instead, e.g.\n\n```rust\nlet target_os = std::env::var(\"CARGO_CFG_TARGET_OS\").unwrap();\nlet target_arch = std::env::var(\"CARGO_CFG_TARGET_ARCH\").unwrap();\nif target_os == \"macos\" {\n    if target_arch == \"aarch64\" { /* ... */ }\n}\n```\n\nand replace every `cfg!(target_os = ..)` / `cfg!(target_arch = ..)` in `build_normal`, `build_vendored` and `add_library` with these values.","locations":[{"ref":"pavao-sys/build.rs:16-25","code":"   16 |             if cfg!(target_os = \"macos\") {\n   17 |                 if cfg!(target_arch = \"aarch64\") {\n   18 |                     println!(\"cargo:rustc-link-search=/opt/homebrew/opt/samba/lib\");\n   19 |                 } else if cfg!(target_arch = \"x86_64\") {\n   20 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/samba/lib\");\n   21 |                 }\n   22 |                 println!(\"cargo:rustc-link-lib=smbclient\");\n   23 |             } else {\n   24 |                 println!(\"cargo:rustc-link-lib=smbclient\");\n   25 |             }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L16-L25"},{"ref":"pavao-sys/build.rs:115-131","code":"  115 |             if cfg!(target_os = \"macos\") {\n  116 |                 if cfg!(target_arch = \"aarch64\") {\n  117 |                     println!(\"cargo:rustc-link-search=/opt/homebrew/opt/{brew_name}/lib\");\n  118 |                 } else if cfg!(target_arch = \"x86_64\") {\n  119 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  120 |                 }\n  121 |                 println!(\"cargo:rustc-link-lib={lib}\");\n  122 |             }\n  123 |         }\n  124 |         Err(_) => {\n  125 |             println!(\"{lib} was not found with pkg_config; trying with LD_LIBRARY_PATH; but you may need to install it manually\");\n  126 |             // cross-finger and try dylib\n  127 |             if cfg!(target_arch = \"aarch64\") {\n  128 |                 println!(\"cargo:rustc-link-search=/opt/homebrew/opt/{brew_name}/lib\");\n  129 |             } else if cfg!(target_arch = \"x86_64\") {\n  130 |                 println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  131 |             }","lines":17,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L115-L131"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The Homebrew library path used for Intel macOS is wrong. On x86_64 macOS the Homebrew prefix is `/usr/local`, so formula libraries live in `/usr/local/opt/<formula>/lib`; `/usr/local/Homebrew` is the Homebrew *repository* checkout and contains no `opt` directory. Every x86_64 branch therefore emits a search path that does not exist, so the fallback path (used whenever `pkg-config` cannot find the library) never actually helps on Intel Macs and the link fails with an unresolved-symbol error instead.","fix":"Replace the three occurrences of\n\n```rust\nprintln!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n```\n\n(and the `samba` variant on line 20) with\n\n```rust\nprintln!(\"cargo:rustc-link-search=/usr/local/opt/{brew_name}/lib\");\n```","locations":[{"ref":"pavao-sys/build.rs:19-21","code":"   19 |                 } else if cfg!(target_arch = \"x86_64\") {\n   20 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/samba/lib\");\n   21 |                 }","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L19-L21"},{"ref":"pavao-sys/build.rs:118-120","code":"  118 |                 } else if cfg!(target_arch = \"x86_64\") {\n  119 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  120 |                 }","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L118-L120"},{"ref":"pavao-sys/build.rs:129-131","code":"  129 |             } else if cfg!(target_arch = \"x86_64\") {\n  130 |                 println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  131 |             }","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L129-L131"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`add_library(lib, brew_name)` passes the *linker* name as the `pkg-config` module name. For several of the vendored dependencies the module name differs: ICU ships `icu-i18n.pc`/`icu-uc.pc` (not `icui18n`/`icuuc`), libbsd ships `libbsd.pc` (not `bsd`), libcap ships `libcap.pc` (not `cap`), and `resolv` has no `.pc` file at all. Those probes therefore always fail, the code always takes the `Err` fallback branch, and the real include/link paths and transitive dependencies reported by `pkg-config` are lost - only a blind `-l<name>` plus a Homebrew-only search path is emitted. On a Linux vendored build this means `-lbsd -lcap -licui18n -licuuc -lresolv` are forced onto the link line with no search path, which fails outright when those libraries are absent or named differently.","fix":"Separate the three names: `add_library(link_name, pkg_config_name, brew_name)` and call it with the correct `.pc` module names (`icu-i18n`, `icu-uc`, `libbsd`, `libcap`, `zlib`, `jansson`, ...). For libraries with no `.pc` file (`resolv`) skip the probe and emit `cargo:rustc-link-lib=resolv` directly, and only fall back to a blind `-l` when the probe genuinely fails.","locations":[{"ref":"pavao-sys/build.rs:43-58","code":"   43 |     add_library(\"z\", \"zlib\");\n   44 |     add_library(\"ldap\", \"openldap\");\n   45 |     add_library(\"cups\", \"cups\");\n   46 |     add_library(\"lber\", \"openldap\");\n   47 |     add_library(\"jansson\", \"jansson\");\n   48 |     add_library(\"icui18n\", \"icu4c\");\n   49 |     add_library(\"icuuc\", \"icu4c\");\n   50 |     add_library(\"gnutls\", \"gnutls\");\n   51 |     add_library(\"bsd\", \"libbsd\");\n   52 |     add_library(\"resolv\", \"libresolv\");\n   53 | \n   54 |     // linux only\n   55 |     if cfg!(target_os = \"linux\") {\n   56 |         add_library(\"cap\", \"cap\");\n   57 |         add_library(\"keyutils\", \"keyutils\");\n   58 |     }","lines":16,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L43-L58"},{"ref":"pavao-sys/build.rs:106-135","code":"  106 | fn add_library(lib: &str, brew_name: &str) {\n  107 |     // search lib with pkg-config and try static\n  108 | \n  109 |     match pkg_config::Config::new()\n  110 |         .statik(true)\n  111 |         .cargo_metadata(true)\n  112 |         .probe(lib)\n  113 |     {\n  114 |         Ok(_) => {\n  115 |             if cfg!(target_os = \"macos\") {\n  116 |                 if cfg!(target_arch = \"aarch64\") {\n  117 |                     println!(\"cargo:rustc-link-search=/opt/homebrew/opt/{brew_name}/lib\");\n  118 |                 } else if cfg!(target_arch = \"x86_64\") {\n  119 |                     println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  120 |                 }\n  121 |                 println!(\"cargo:rustc-link-lib={lib}\");\n  122 |             }\n  123 |         }\n  124 |         Err(_) => {\n  125 |             println!(\"{lib} was not found with pkg_config; trying with LD_LIBRARY_PATH; but you may need to install it manually\");\n  126 |             // cross-finger and try dylib\n  127 |             if cfg!(target_arch = \"aarch64\") {\n  128 |                 println!(\"cargo:rustc-link-search=/opt/homebrew/opt/{brew_name}/lib\");\n  129 |             } else if cfg!(target_arch = \"x86_64\") {\n  130 |                 println!(\"cargo:rustc-link-search=/usr/local/Homebrew/opt/{brew_name}/lib\");\n  131 |             }\n  132 |             println!(\"cargo:rustc-link-lib={lib}\");\n  133 |         }\n  134 |     };\n  135 | }","lines":30,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L106-L135"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `linux_*` cfg aliases cover only `x86_64`, `aarch64`, `arm` and `riscv64`. `SmbStatVfs::from(statvfs)` selects each struct field with a chain of mutually exclusive `#[cfg]` attributes built from those aliases plus `target_os = \"android\"/\"macos\"/\"openbsd\"`, so on any other Linux architecture (`i686`, `powerpc64le`, `s390x`, `mips`, ...) *no* arm matches and the struct literal is missing `blocks`, `bfree`, `bavail`, `files`, `ffree`, ... - a hard compile error rather than a graceful failure. The supported-platform set is encoded implicitly in a build script instead of being enforced or made exhaustive.","fix":"Stop enumerating architectures: build `SmbStatVfs` with plain `as u64` casts for every field (a widening cast is a no-op where the field is already `u64` and clippy can be silenced with `#[allow(clippy::unnecessary_cast)]`), which works on every platform. If per-arch code really is needed, add a final `#[cfg(not(any(...)))] compile_error!(\"unsupported target\")` so unsupported targets fail with a clear message.","locations":[{"ref":"pavao/build.rs:13-18","code":"   13 |         // exclusive features\n   14 |         linux_aarch64: { all(linux, aarch64, unix) },\n   15 |         linux_riscv64: { all(linux, riscv64, unix) },\n   16 |         linux_x86_64: { all(linux, x86_64, unix) },\n   17 |         linux_arm: { all(linux, arm, unix) },\n   18 |     }","lines":6,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/build.rs#L13-L18"},{"ref":"pavao/src/smb/types/stat.rs:45-62","code":"   45 | impl From<statvfs> for SmbStatVfs {\n   46 |     fn from(s: statvfs) -> Self {\n   47 |         Self {\n   48 |             bsize: s.f_bsize as u64,\n   49 |             frsize: s.f_frsize as u64,\n   50 |             #[cfg(target_os = \"android\")]\n   51 |             blocks: s.f_blocks,\n   52 |             #[cfg(target_os = \"macos\")]\n   53 |             blocks: s.f_blocks as u64,\n   54 |             #[cfg(linux_x86_64)]\n   55 |             blocks: s.f_blocks,\n   56 |             #[cfg(linux_aarch64)]\n   57 |             blocks: s.f_blocks,\n   58 |             #[cfg(linux_arm)]\n   59 |             blocks: s.f_blocks as u64,\n   60 |             #[cfg(linux_riscv64)]\n   61 |             blocks: s.f_blocks,\n   62 |             #[cfg(target_os = \"openbsd\")]","lines":18,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L45-L62"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`uri()` concatenates blindly: `format!(\"{}{}\", self.uri, p.as_ref())`. `build_uri` carefully inserts a `/` between server and share, but no such care is taken between the share and the path, so a caller passing a relative path (`client.stat(\"test.txt\")`) silently targets `smb://server/sharetest.txt` - a different share on the server - instead of erroring. A share configured with a trailing slash yields a double slash for the same reason. The requirement that `p` start with `/` is not documented on any of the public methods.","fix":"Normalize in `uri()` exactly like `build_uri` does for the share:\n\n```rust\nfn uri<S: AsRef<str>>(&self, p: S) -> String {\n    let p = p.as_ref();\n    let sep = if p.starts_with('/') || self.uri.ends_with('/') { \"\" } else { \"/\" };\n    format!(\"{}{}{}\", self.uri, sep, p)\n}\n```","locations":[{"ref":"pavao/src/smb/client.rs:388-407","code":"  388 |     /// Build connection uri\n  389 |     fn build_uri(server: &str, share: &str) -> String {\n  390 |         format!(\n  391 |             \"{}{}{}\",\n  392 |             server,\n  393 |             match share.starts_with('/') {\n  394 |                 true => \"\",\n  395 |                 false => \"/\",\n  396 |             },\n  397 |             share\n  398 |         )\n  399 |     }\n  400 | \n  401 |     /// Get file uri\n  402 |     fn uri<S>(&self, p: S) -> String\n  403 |     where\n  404 |         S: AsRef<str>,\n  405 |     {\n  406 |         format!(\"{}{}\", self.uri, p.as_ref())\n  407 |     }","lines":20,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L388-L407"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`SmbDirent::try_from` ignores `d.namelen` (and `d.commentlen`) entirely and instead builds the name with `char_ptr_to_string(d.name.as_slice().as_ptr())`, i.e. it scans for a NUL terminator inside the 1024-byte array. Nothing guarantees the terminator is inside that array: combined with the flexible-array-member problem the array content is not even part of the entry, and a 1024-byte name (SMB allows long UTF-8 names) leaves no room for the NUL, so `CStr::from_ptr` runs off the end of the struct. The unit test makes the bug explicit: it sets `namelen = 1` while writing 5 characters and still asserts the name is `\"hello\"`, proving the declared length is never consulted.","fix":"Use the length fields, clamped to the buffer size, instead of trusting NUL termination:\n\n```rust\nlet namelen = (d.namelen as usize).min(d.name.len());\nlet bytes = unsafe { slice::from_raw_parts(d.name.as_ptr() as *const u8, namelen) };\nlet name = String::from_utf8_lossy(bytes).into_owned();\n```\n\nand fix the test to set `namelen = 5` / `commentlen = 4` so it reflects the real contract (the lengths exclude the NUL terminator).","locations":[{"ref":"pavao/src/smb/types/dirent.rs:40-48","code":"   40 |     fn try_from(d: smbc_dirent) -> Result<Self, Self::Error> {\n   41 |         let comment = char_ptr_to_string(d.comment)?;\n   42 |         let name = char_ptr_to_string(d.name.as_slice().as_ptr())?;\n   43 |         Ok(Self {\n   44 |             type_: SmbDirentType::try_from(d.smbc_type)?,\n   45 |             comment,\n   46 |             name,\n   47 |         })\n   48 |     }","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/dirent.rs#L40-L48"},{"ref":"pavao/src/smb/types/dirent.rs:153-168","code":"  153 |         let mut dirent = smbc_dirent::default();\n  154 |         let comment = String::from(\"test\");\n  155 |         let comment_ptr = utils::str_to_cstring(comment).unwrap();\n  156 |         dirent.smbc_type = 8;\n  157 |         dirent.comment = comment_ptr.into_raw();\n  158 |         dirent.commentlen = 5;\n  159 |         dirent.name = [0; 1024];\n  160 |         dirent.namelen = 1;\n  161 |         dirent.name[0] = 'h' as libc::c_char;\n  162 |         dirent.name[1] = 'e' as libc::c_char;\n  163 |         dirent.name[2] = 'l' as libc::c_char;\n  164 |         dirent.name[3] = 'l' as libc::c_char;\n  165 |         dirent.name[4] = 'o' as libc::c_char;\n  166 |         let dirent = SmbDirent::try_from(dirent).unwrap();\n  167 |         assert_eq!(dirent.get_type(), SmbDirentType::File);\n  168 |         assert_eq!(dirent.name(), \"hello\");","lines":16,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/dirent.rs#L153-L168"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SmbOpenOptions::append(true)` only ORs `O_APPEND` into `flags`; it does not imply write access, so\n`SmbOpenOptions::default().append(true)` produces `O_RDONLY | O_APPEND` (recall `O_RDONLY == 0`) and\nevery subsequent `write` fails. `std::fs::OpenOptions::append` implies `write`, so this silently\nbreaks the mental model users bring; the crate's own test only passes because it writes\n`.write(true).append(true)`. The same `to_flags` is happy to emit other nonsense combinations -\n`O_RDONLY | O_TRUNC`, `O_RDONLY | O_CREAT`, or `O_APPEND | O_TRUNC` - which the doc comment\n\"Naive impl, rewrite to check for incompatible flags\" openly admits.","fix":"Make `append` imply write access and reject contradictory combinations:\n\n```rust\npub fn append(mut self, append: bool) -> Self {\n    self.flag(libc::O_APPEND, append);\n    if append {\n        self.write = true;\n    }\n    self\n}\n```\n\nand have `open_with` return an error (or have `to_flags` return `SmbResult<c_int>`) when `O_TRUNC`/`O_CREAT`/`O_EXCL`/`O_APPEND` are requested without write access, or when `O_TRUNC` and `O_APPEND` are combined.","locations":[{"ref":"pavao/src/smb/types/file.rs:134-138","code":"  134 |     /// Allows appending to file.\n  135 |     pub fn append(mut self, append: bool) -> Self {\n  136 |         self.flag(libc::O_APPEND, append);\n  137 |         self\n  138 |     }","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L134-L138"},{"ref":"pavao/src/smb/types/file.rs:167-176","code":"  167 |     /// Naive impl, rewrite to check for incompatible flags\n  168 |     pub(crate) fn to_flags(self) -> c_int {\n  169 |         let base_mode = match (self.read, self.write) {\n  170 |             // defaults to read only\n  171 |             (false, false) | (true, false) => libc::O_RDONLY,\n  172 |             (false, true) => libc::O_WRONLY,\n  173 |             (true, true) => libc::O_RDWR,\n  174 |         };\n  175 |         base_mode | self.flags\n  176 |     }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L167-L176"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`From<SmbMode> for mode_t` reconstructs only the 9 permission bits, so the conversion is **not** the\ninverse of `From<mode_t> for SmbMode`: the file-type bits (`S_IFMT`, i.e. `0o170000`) and the\nsetuid/setgid/sticky bits (`0o7000`) are silently discarded. `SmbMode::from(0o104755)` converted back\nyields `0o755`, so `SmbClient::chmod` (which does `chmod_fn(..., mode.into())` in\n`pavao/src/smb/client.rs:368`) silently drops setuid/setgid/sticky whenever the caller round-trips a\nmode obtained from `SmbStat::mode`. The struct also has no way to represent those bits at all, and\n`SmbMode` has no public constructor other than `From<mode_t>`, so a user cannot restore them.","fix":"Keep the non-permission bits so the round-trip is lossless, e.g. add a private field and OR it back:\n\n```rust\npub struct SmbMode {\n    type_: SmbFileType,\n    extra: mode_t, // S_IFMT | S_ISUID | S_ISGID | S_ISVTX bits as received\n    mode: (SmbModeClass, SmbModeClass, SmbModeClass),\n}\n\nimpl From<SmbMode> for mode_t {\n    fn from(pex: SmbMode) -> Self {\n        pex.extra\n            | (mode_t::from(pex.mode.0) << 6)\n            | (mode_t::from(pex.mode.1) << 3)\n            | mode_t::from(pex.mode.2)\n    }\n}\n```\n\nIf that is not desired, at minimum document on both `impl` blocks that only the low 9 bits survive the conversion.","locations":[{"ref":"pavao/src/smb/types/mode.rs:66-83","code":"   66 | impl From<SmbMode> for mode_t {\n   67 |     fn from(pex: SmbMode) -> Self {\n   68 |         (mode_t::from(pex.mode.0) << 6) + (mode_t::from(pex.mode.1) << 3) + mode_t::from(pex.mode.2)\n   69 |     }\n   70 | }\n   71 | \n   72 | impl From<mode_t> for SmbMode {\n   73 |     fn from(x: mode_t) -> Self {\n   74 |         Self {\n   75 |             type_: SmbFileType::from(x),\n   76 |             mode: (\n   77 |                 SmbModeClass::from(((x >> 6) & 0x7) as mode_t),\n   78 |                 SmbModeClass::from(((x >> 3) & 0x7) as mode_t),\n   79 |                 SmbModeClass::from((x & 0x7) as mode_t),\n   80 |             ),\n   81 |         }\n   82 |     }\n   83 | }","lines":18,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/mode.rs#L66-L83"},{"ref":"pavao/src/smb/types/mode.rs:9-12","code":"    9 | pub struct SmbMode {\n   10 |     type_: SmbFileType,\n   11 |     mode: (SmbModeClass, SmbModeClass, SmbModeClass),\n   12 | }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/mode.rs#L9-L12"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Object paths are passed to `ar` via `object_file.display().to_string()`, which is lossy: any non-UTF-8 byte in `OUT_DIR` (legal on Unix) is replaced by U+FFFD, so `ar` is handed a path that does not exist and the archive step fails with a confusing error. `Command::arg` accepts `AsRef<OsStr>`, so the conversion is unnecessary.","fix":"Pass the path directly:\n\n```rust\n// before\nbuild_static.arg(object_file.display().to_string());\n// after\nbuild_static.arg(&object_file);\n```","locations":[{"ref":"pavao-src/src/lib.rs:1587-1587","code":" 1587 |             build_static.arg(object_file.display().to_string());","lines":1,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1587"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`pavao-sys` never declares `smbc_setOptionFullTimeNames`, even though `pavao` exposes a public builder method `SmbOptions::full_time_names(bool)`. `SmbClient::setup_options` applies every other option but has nothing to apply this one to, so the setting is silently ignored: a user who calls `.full_time_names(true)` gets no error and no effect. The option is dead weight that only exists in the builder and its unit test.","fix":"Declare the missing binding\n\n```rust\n    pub fn smbc_setOptionFullTimeNames(c: *mut SMBCCTX, b: smbc_bool);\n```\n\nand call it from `SmbClient::setup_options` (`smbc_setOptionFullTimeNames(ctx, options.full_time_names as i32);`), or remove `full_time_names` from `SmbOptions` entirely.","locations":[{"ref":"pavao-sys/src/lib.rs:451-461","code":"  451 |     pub fn smbc_setOptionDebugToStderr(c: *mut SMBCCTX, b: smbc_bool);\n  452 |     pub fn smbc_setOptionOpenShareMode(c: *mut SMBCCTX, share_mode: smbc_share_mode);\n  453 |     pub fn smbc_setOptionSmbEncryptionLevel(c: *mut SMBCCTX, level: smbc_smb_encrypt_level);\n  454 |     pub fn smbc_setOptionCaseSe
