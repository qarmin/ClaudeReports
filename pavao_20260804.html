 Misuse","severity":"high","difficulty":"very_easy","description":"`libsmb_file_info.size` is declared as `c_ulong`, but the C struct declares it as `uint64_t`. On 64-bit Linux the two happen to coincide, so the bug is invisible there; on any 32-bit target (`arm`, `i686`, `riscv32`) `c_ulong` is 32 bits, so `size` is 4 bytes instead of 8 and *every* following field (`attrs`, `uid`, `gid`, the four `timespec`s, `name`, `short_name`) lands at the wrong offset. `list_dirplus()` would then report garbage sizes, timestamps and would dereference a bogus `name` pointer. This is not hypothetical for this crate: `pavao/build.rs` deliberately defines a `linux_arm` cfg alias and `pavao/src/smb/types/stat.rs` has 32-bit ARM code paths, so 32-bit builds are a supported configuration.","fix":"Use a fixed-width type matching `uint64_t`:\n\n```rust\n    /// Size of file\n    pub size: u64,\n```\n\ninstead of\n\n```rust\n    /// Size of file\n    pub size: c_ulong,\n```","locations":[{"ref":"pavao-sys/src/lib.rs:71-79","code":"   71 | pub struct libsmb_file_info {\n   72 |     /// Size of file\n   73 |     pub size: c_ulong,\n   74 |     /// DOS attributes of file\n   75 |     pub attrs: c_ushort,\n   76 |     /// User ID of file\n   77 |     pub uid: c_uint,\n   78 |     /// Group ID of file\n   79 |     pub gid: c_uint,","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L71-L79"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"All the `smbc_*_fn` callback typedefs are declared as safe `extern \"C\" fn(...)` rather than `unsafe extern \"C\" fn(...)`. These are pointers to C functions that dereference the raw `*mut SMBCCTX`, `*mut SMBCFILE` and `*const c_char` arguments they are handed, so calling them can never be safe. Because the typedefs are safe, the whole `pavao` client calls into C from safe Rust with no `unsafe` block at all - e.g. `unlink_fn(self.ctx()?, path.as_ptr())`, `opendir_fn(...)`, `readdir_fn(...)`, `mkdir_fn(...)` are all invoked outside `unsafe`. That is a soundness hole in the public API of the `-sys` crate: a downstream user can trigger memory unsafety (e.g. by passing a dangling `SMBCFILE`) without writing a single `unsafe` token.","fix":"Make every function-pointer typedef unsafe, e.g.\n\n```rust\npub type smbc_read_fn = Option<\n    unsafe extern \"C\" fn(c: *mut SMBCCTX, file: *mut SMBCFILE, buf: *mut c_void, count: size_t) -> ssize_t,\n>;\n```\n\nand wrap the corresponding call sites in `pavao/src/smb/client.rs` (and `file.rs`) in `unsafe { .. }` blocks. The `Option<unsafe extern \"C\" fn>` representation is unchanged, so this is ABI-compatible; it only forces callers to acknowledge the unsafety.","locations":[{"ref":"pavao-sys/src/lib.rs:221-234","code":"  221 | pub type smbc_open_fn = option::Option<\n  222 |     extern \"C\" fn(\n  223 |         c: *mut SMBCCTX,\n  224 |         fname: *const c_char,\n  225 |         flags: c_int,\n  226 |         mode: mode_t,\n  227 |     ) -> *mut SMBCFILE,\n  228 | >;\n  229 | pub type smbc_creat_fn = option::Option<\n  230 |     extern \"C\" fn(c: *mut SMBCCTX, path: *const c_char, mode: mode_t) -> *mut SMBCFILE,\n  231 | >;\n  232 | pub type smbc_read_fn = option::Option<\n  233 |     extern \"C\" fn(c: *mut SMBCCTX, file: *mut SMBCFILE, buf: *mut c_void, count: size_t) -> ssize_t,\n  234 | >;","lines":14,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L221-L234"},{"ref":"pavao-sys/src/lib.rs:256-271","code":"  256 | pub type smbc_stat_fn =\n  257 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, fname: *const c_char, st: *mut stat) -> c_int>;\n  258 | pub type smbc_statvfs_fn =\n  259 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, fname: *const c_char, st: *mut statvfs) -> c_int>;\n  260 | pub type smbc_fstat_fn =\n  261 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, file: *mut SMBCFILE, st: *mut stat) -> c_int>;\n  262 | pub type smbc_close_fn =\n  263 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, file: *mut SMBCFILE) -> c_int>;\n  264 | pub type smbc_opendir_fn =\n  265 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, fname: *const c_char) -> *mut SMBCFILE>;\n  266 | pub type smbc_closedir_fn =\n  267 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, dir: *mut SMBCFILE) -> c_int>;\n  268 | pub type smbc_readdir_fn =\n  269 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, dir: *mut SMBCFILE) -> *mut smbc_dirent>;\n  270 | pub type smbc_readdirplus_fn =\n  271 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, dir: *mut SMBCFILE) -> *mut libsmb_file_info>;","lines":16,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L256-L271"},{"ref":"pavao/src/smb/client.rs:180-183","code":"  180 |         let path = utils::str_to_cstring(self.uri(path))?;\n  181 |         let unlink_fn = self.get_fn(self.ctx()?, smbc_getFunctionUnlink)?;\n  182 |         utils::to_result_with_ioerror((), unlink_fn(self.ctx()?, path.as_ptr()))\n  183 |     }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L180-L183"},{"ref":"pavao/src/smb/client.rs:211-222","code":"  211 |         let path = utils::str_to_cstring(self.uri(path))?;\n  212 |         let opendir_fn = self.get_fn(self.ctx()?, smbc_getFunctionOpendir)?;\n  213 |         let fd = opendir_fn(self.ctx()?, path.as_ptr());\n  214 |         if fd.is_null() {\n  215 |             error!(\"failed to open directory: returned a bad file descriptor\");\n  216 |             return Err(SmbError::BadFileDescriptor);\n  217 |         }\n  218 |         let closedir_fn = self.get_fn(self.ctx()?, smbc_getFunctionClosedir)?;\n  219 |         let mut entries = Vec::new();\n  220 |         let readdir_fn = self.get_fn(self.ctx()?, smbc_getFunctionReaddir)?;\n  221 |         loop {\n  222 |             let dirent = readdir_fn(self.ctx()?, fd);","lines":12,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L211-L222"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"The Rust definition of `_SMBCCTX` is missing the `readdirplus` and `readdirplus2` function-pointer fields, which sit between `readdir` and `getdents` in the real C struct. Verified against the installed `libsmbclient.h` (fields `smbc_readdirplus_fn readdirplus` and `smbc_readdirplus2_fn readdirplus2` follow `readdir`) and against the shipped ABI: `smbc_getFunctionReaddir` loads `ctx+0x88`, `smbc_getFunctionReaddirPlus` loads `ctx+0x90`, `smbc_getFunctionReaddirPlus2` loads `ctx+0x98` and `smbc_getFunctionGetdents` loads `ctx+0xa0`, whereas the Rust struct places `getdents` at offset `0x90`. Every field from `getdents` onwards (`mkdir`, `chmod`, the whole xattr/print block, `callbacks`, `flags`, `options`, `internal`) is therefore shifted by 16 bytes, and `size_of::<_SMBCCTX>()` is 16 bytes smaller than the C struct. Any Rust code that reads or writes a field of `*mut SMBCCTX` through this public type reads garbage, and `mem::zeroed()`/`*ctx` copies of the type are the wrong size.","fix":"Add the two missing fields (and the missing `smbc_readdirplus2_fn` typedef) in the exact C order:\n\n```rust\n    pub readdir: smbc_readdir_fn,\n    pub readdirplus: smbc_readdirplus_fn,\n    pub readdirplus2: smbc_readdirplus2_fn,\n    pub getdents: smbc_getdents_fn,\n```\n\nSince `pavao` only ever uses `SMBCCTX` as an opaque handle, the safer option is to drop the struct body entirely and make it opaque like `_SMBCSRV`: `pub enum _SMBCCTX {}`, removing the `Copy`/`Clone`/`Default` impls with it. The C header itself states \"DO NOT DIRECTLY MANIPULATE THE CONTEXT STRUCTURE\".","locations":[{"ref":"pavao-sys/src/lib.rs:359-366","code":"  359 |     pub close_fn: smbc_close_fn,\n  360 |     pub opendir: smbc_opendir_fn,\n  361 |     pub closedir: smbc_closedir_fn,\n  362 |     pub readdir: smbc_readdir_fn,\n  363 |     pub getdents: smbc_getdents_fn,\n  364 |     pub mkdir: smbc_mkdir_fn,\n  365 |     pub rmdir: smbc_rmdir_fn,\n  366 |     pub telldir: smbc_telldir_fn,","lines":8,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L359-L366"},{"ref":"pavao-sys/src/lib.rs:342-384","code":"  342 | #[repr(C)]\n  343 | #[derive(Copy)]\n  344 | pub struct _SMBCCTX {\n  345 |     pub debug: c_int,\n  346 |     pub netbios_name: *mut c_char,\n  347 |     pub workgroup: *mut c_char,\n  348 |     pub user: *mut c_char,\n  349 |     pub timeout: c_int,\n  350 |     pub open: smbc_open_fn,\n  351 |     pub creat: smbc_creat_fn,\n  352 |     pub read: smbc_read_fn,\n  353 |     pub write: smbc_write_fn,\n  354 |     pub unlink: smbc_unlink_fn,\n  355 |     pub rename: smbc_rename_fn,\n  356 |     pub lseek: smbc_lseek_fn,\n  357 |     pub stat: smbc_stat_fn,\n  358 |     pub fstat: smbc_fstat_fn,\n  359 |     pub close_fn: smbc_close_fn,\n  360 |     pub opendir: smbc_opendir_fn,\n  361 |     pub closedir: smbc_closedir_fn,\n  362 |     pub readdir: smbc_readdir_fn,\n  363 |     pub getdents: smbc_getdents_fn,\n  364 |     pub mkdir: smbc_mkdir_fn,\n  365 |     pub rmdir: smbc_rmdir_fn,\n  366 |     pub telldir: smbc_telldir_fn,\n  367 |     pub lseekdir: smbc_lseekdir_fn,\n  368 |     pub fstatdir: smbc_fstatdir_fn,\n  369 |     pub chmod: smbc_chmod_fn,\n  370 |     pub utimes: smbc_utimes_fn,\n  371 |     pub setxattr: smbc_setxattr_fn,\n  372 |     pub getxattr: smbc_getxattr_fn,\n  373 |     pub removexattr: smbc_removexattr_fn,\n  374 |     pub listxattr: smbc_listxattr_fn,\n  375 |     pub print_file: smbc_print_file_fn,\n  376 |     pub open_print_job: smbc_open_print_job_fn,\n  377 |     pub list_print_jobs: smbc_list_print_jobs_fn,\n  378 |     pub unlink_print_job: smbc_unlink_print_job_fn,\n  379 |     pub callbacks: _smbc_callbacks,\n  380 |     pub reserved: *mut c_void,\n  381 |     pub flags: c_int,\n  382 |     pub options: _smbc_options,\n  383 |     pub internal: *mut SMBC_internal_data,\n  384 | }","lines":43,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L342-L384"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"hard","description":"`SmbDirent::try_from(*dirent)` dereferences the `*mut smbc_dirent` returned by `readdir`, i.e. it copies the whole struct by value. The real C declaration ends in a flexible array member, `char name[1]` (see `/usr/include/samba-4.0/libsmbclient.h`), and libsmbclient only allocates `dirent->dirlen` bytes for each entry, whereas the `pavao-sys` binding declares `pub name: [c_char; 1024usize]`. `size_of::<smbc_dirent>()` is therefore roughly 1048 bytes, so every iteration of the loop reads about 1 KiB past the end of libsmbclient's dirent buffer. That is an out-of-bounds read (undefined behaviour, potential segfault, and it copies unrelated heap contents into the returned struct).","fix":"Never copy the struct by value. Read the fixed-size header fields through the pointer and read the name as a byte slice limited by the entry's own lengths, for example:\n\n```rust\nlet d = &*dirent;                      // no copy\nlet namelen = d.namelen as usize;\nlet name_ptr = ptr::addr_of!(d.name) as *const u8;\nlet name = std::str::from_utf8(slice::from_raw_parts(name_ptr, namelen))?;\n```\n\nand change the binding to `pub name: [c_char; 1]` (or `__IncompleteArrayField`) so `size_of` matches the C type.","locations":[{"ref":"pavao/src/smb/client.rs:221-243","code":"  221 |         loop {\n  222 |             let dirent = readdir_fn(self.ctx()?, fd);\n  223 |             if dirent.is_null() {\n  224 |                 break;\n  225 |             }\n  226 |             unsafe {\n  227 |                 match SmbDirent::try_from(*dirent) {\n  228 |                     Ok(dirent)\n  229 |                         if dirent.name() != \".\"\n  230 |                             && dirent.name() != \"..\"\n  231 |                             && !dirent.name().is_empty() =>\n  232 |                     {\n  233 |                         trace!(\"found dirent: {:?}\", dirent);\n  234 |                         entries.push(dirent);\n  235 |                     }\n  236 |                     Ok(_) => {\n  237 |                         trace!(\"ignoring '..', '.' directories\");\n  238 |                     }\n  239 |                     Err(e) => {\n  240 |                         error!(\"failed to decode directory entity {:?}: {}\", dirent, e);\n  241 |                     }\n  242 |                 }\n  243 |             }","lines":23,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L221-L243"},{"ref":"pavao-sys/src/lib.rs:47-54","code":"   47 |     /** The length of the name string in bytes (does not include\n   48 |      *  null terminator)\n   49 |      */\n   50 |     pub namelen: c_uint,\n   51 |     /** Points to the null terminated name string\n   52 |      */\n   53 |     pub name: [c_char; 1024usize],\n   54 | }","lines":8,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L47-L54"}]},{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`smbc_dirent.name` is declared as `[c_char; 1024]`, but the C struct declares `char name[1]` (a trailing flexible array whose real extent is given by `namelen`/`dirlen`). As a result `size_of::<smbc_dirent>()` is 1056 bytes while the C object is 32 bytes. `pavao` then dereferences the library-owned pointer *by value* (`SmbDirent::try_from(*dirent)` in `client.rs`, and `TryFrom<smbc_dirent>`), which copies 1056 bytes out of an object that the ABI says is `dirlen` bytes long - an out-of-bounds read of ~1 KiB of libsmbclient's internal memory on every directory entry. It only avoids crashing because libsmbclient happens to return the dirent from a larger internal scratch buffer. The same mismatch makes the declared `smbc_getdents_fn` unusable from Rust, since a `[smbc_dirent]` array would use a 1056-byte stride where C uses packed variable-length records.","fix":"Declare the field exactly as C does (`pub name: [c_char; 1]`, or better `pub name: __IncompleteArrayField<c_char>`-style zero-length marker), and never copy `smbc_dirent` by value. Change `TryFrom<smbc_dirent>` to `unsafe fn from_raw(d: *const smbc_dirent)` which reads the scalar fields through the pointer and builds the name with `CStr::from_ptr(addr_of!((*d).name).cast())` (optionally bounded by `namelen`), then update `client.rs` to pass `dirent` instead of `*dirent`.","locations":[{"ref":"pavao-sys/src/lib.rs:44-54","code":"   44 |     /** Points to the null terminated comment string\n   45 |      */\n   46 |     pub comment: *mut c_char,\n   47 |     /** The length of the name string in bytes (does not include\n   48 |      *  null terminator)\n   49 |      */\n   50 |     pub namelen: c_uint,\n   51 |     /** Points to the null terminated name string\n   52 |      */\n   53 |     pub name: [c_char; 1024usize],\n   54 | }","lines":11,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L44-L54"},{"ref":"pavao/src/smb/client.rs:226-243","code":"  226 |             unsafe {\n  227 |                 match SmbDirent::try_from(*dirent) {\n  228 |                     Ok(dirent)\n  229 |                         if dirent.name() != \".\"\n  230 |                             && dirent.name() != \"..\"\n  231 |                             && !dirent.name().is_empty() =>\n  232 |                     {\n  233 |                         trace!(\"found dirent: {:?}\", dirent);\n  234 |                         entries.push(dirent);\n  235 |                     }\n  236 |                     Ok(_) => {\n  237 |                         trace!(\"ignoring '..', '.' directories\");\n  238 |                     }\n  239 |                     Err(e) => {\n  240 |                         error!(\"failed to decode directory entity {:?}: {}\", dirent, e);\n  241 |                     }\n  242 |                 }\n  243 |             }","lines":18,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L226-L243"},{"ref":"pavao/src/smb/types/dirent.rs:37-47","code":"   37 | impl TryFrom<smbc_dirent> for SmbDirent {\n   38 |     type Error = SmbError;\n   39 | \n   40 |     fn try_from(d: smbc_dirent) -> Result<Self, Self::Error> {\n   41 |         let comment = char_ptr_to_string(d.comment)?;\n   42 |         let name = char_ptr_to_string(d.name.as_slice().as_ptr())?;\n   43 |         Ok(Self {\n   44 |             type_: SmbDirentType::try_from(d.smbc_type)?,\n   45 |             comment,\n   46 |             name,\n   47 |         })","lines":11,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/dirent.rs#L37-L47"}]},{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"The `extern` block carries a hard-coded `#[link(name = \"smbclient\")]`, whose default link kind is `dylib`. `build.rs` already emits all link metadata (`cargo:rustc-link-lib=smbclient` for the system build and `cargo:rustc-link-lib=static=smbclient` for the `vendored` build), so in a normal build `-lsmbclient` is passed twice, and in a `vendored` build rustc is asked to link the *shared* `smbclient` in addition to the vendored static archive. If a system `libsmbclient.so` is installed, the linker can satisfy the symbols from it, silently defeating the whole point of the `vendored` feature (and potentially mixing two different Samba versions in one process).","fix":"Drop the attribute and let the build script own the linkage, since `Cargo.toml` already declares `links = \"smbclient\"`:\n\n```rust\nextern \"C\" {\n    // ...\n}\n```\n\nIf an attribute is preferred, it must be feature-aware: `#[cfg_attr(feature = \"vendored\", link(name = \"smbclient\", kind = \"static\"))]` plus `#[cfg_attr(not(feature = \"vendored\"), link(name = \"smbclient\"))]`.","locations":[{"ref":"pavao-sys/src/lib.rs:440-441","code":"  440 | #[link(name = \"smbclient\")]\n  441 | extern \"C\" {","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L440-L441"},{"ref":"pavao-sys/build.rs:98-104","code":"   98 |     println!(\n   99 |         \"cargo:rustc-link-search=native={}\",\n  100 |         artifacts.lib_dir.display()\n  101 |     );\n  102 |     println!(\"cargo:include={}\", artifacts.include_dir.display());\n  103 |     println!(\"cargo:rustc-link-lib=static=smbclient\");\n  104 | }","lines":7,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/build.rs#L98-L104"}]},{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"Paths are pasted into an SMB *URL* with no percent-encoding. libsmbclient parses the resulting string as a URL, so any file name containing `%`, `#`, `?`, `@` or `/` is misinterpreted: `%20` becomes a space, everything after `#`/`?` is treated as a fragment/query, and `@` can be parsed as a user-info separator (a name like `x@evil/share` can even redirect the operation to another host). The library also defaults `url_encode_readdir_entries` to `false`, which means the names returned by `list_dir` are the human-readable (decoded) forms; feeding them straight back into `open_with`/`unlink` (the obvious usage, as in the bundled `tree` example) therefore silently operates on the wrong file.","fix":"Percent-encode each path segment when building the URL in `uri()` (encoding everything outside the unreserved set, but keeping `/` as the separator), and/or force `smbc_setOptionUrlEncodeReaddirEntries(ctx, 1)` so that names coming out of `list_dir` are already in the encoded form the `smbc_*` calls expect. Document which form the public API takes.","locations":[{"ref":"pavao/src/smb/client.rs:401-407","code":"  401 |     /// Get file uri\n  402 |     fn uri<S>(&self, p: S) -> String\n  403 |     where\n  404 |         S: AsRef<str>,\n  405 |     {\n  406 |         format!(\"{}{}\", self.uri, p.as_ref())\n  407 |     }","lines":7,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L401-L407"},{"ref":"pavao/src/smb/client.rs:206-249","code":"  206 |     pub fn list_dir<S>(&self, path: S) -> SmbResult<Vec<SmbDirent>>\n  207 |     where\n  208 |         S: AsRef<str>,\n  209 |     {\n  210 |         trace!(\"listing files at {}\", path.as_ref());\n  211 |         let path = utils::str_to_cstring(self.uri(path))?;\n  212 |         let opendir_fn = self.get_fn(self.ctx()?, smbc_getFunctionOpendir)?;\n  213 |         let fd = opendir_fn(self.ctx()?, path.as_ptr());\n  214 |         if fd.is_null() {\n  215 |             error!(\"failed to open directory: returned a bad file descriptor\");\n  216 |             return Err(SmbError::BadFileDescriptor);\n  217 |         }\n  218 |         let closedir_fn = self.get_fn(self.ctx()?, smbc_getFunctionClosedir)?;\n  219 |         let mut entries = Vec::new();\n  220 |         let readdir_fn = self.get_fn(self.ctx()?, smbc_getFunctionReaddir)?;\n  221 |         loop {\n  222 |             let dirent = readdir_fn(self.ctx()?, fd);\n  223 |             if dirent.is_null() {\n  224 |                 break;\n  225 |             }\n  226 |             unsafe {\n  227 |                 match SmbDirent::try_from(*dirent) {\n  228 |                     Ok(dirent)\n  229 |                         if dirent.name() != \".\"\n  230 |                             && dirent.name() != \"..\"\n  231 |                             && !dirent.name().is_empty() =>\n  232 |                     {\n  233 |                         trace!(\"found dirent: {:?}\", dirent);\n  234 |                         entries.push(dirent);\n  235 |                     }\n  236 |                     Ok(_) => {\n  237 |                         trace!(\"ignoring '..', '.' directories\");\n  238 |                     }\n  239 |                     Err(e) => {\n  240 |                         error!(\"failed to decode directory entity {:?}: {}\", dirent, e);\n  241 |                     }\n  242 |                 }\n  243 |             }\n  244 |         }\n  245 |         trace!(\"decoded {} dirents\", entries.len());\n  246 |         // Close directory\n  247 |         let _ = closedir_fn(self.ctx()?, fd);\n  248 |         Ok(entries)\n  249 |     }","lines":44,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L206-L249"}]},{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`SmbEncryptionLevel` only models `None`/`Request`/`Require` (0/1/2) but libsmbclient's\n`smbc_smb_encrypt_level` also has `SMBC_ENCRYPTLEVEL_DEFAULT = -1`, which is what a fresh context\nuses and which means \"take the level from `smb.conf` (`client smb encrypt`)\". Because\n`SmbOptions::default()` uses `SmbEncryptionLevel::None` and `setup_options` always calls\n`smbc_setOptionSmbEncryptionLevel`, pavao unconditionally overrides the administrator's\n`smb.conf` setting with `SMBC_ENCRYPTLEVEL_NONE`, and there is no way for a caller to ask for the\nsystem default. That is a silent security downgrade for anyone who configured\n`client smb encrypt = required`.","fix":"Add the missing variant and make it the default:\n\n```rust\npub enum SmbEncryptionLevel {\n    /// Use the level configured in smb.conf (libsmbclient default)\n    Default,\n    None,\n    Request,\n    Require,\n}\n\nimpl From<SmbEncryptionLevel> for smbc_smb_encrypt_level {\n    fn from(mode: SmbEncryptionLevel) -> Self {\n        match mode {\n            SmbEncryptionLevel::Default => -1i32 as smbc_smb_encrypt_level,\n            SmbEncryptionLevel::None => 0,\n            SmbEncryptionLevel::Request => 1,\n            SmbEncryptionLevel::Require => 2,\n        }\n    }\n}\n```\n\nand change the `Default` impl to `encryption_level: SmbEncryptionLevel::Default`.","locations":[{"ref":"pavao/src/smb/types/options.rs:122-138","code":"  122 | /// Encryption level option\n  123 | #[derive(Debug, Clone, Copy, PartialEq, Eq)]\n  124 | pub enum SmbEncryptionLevel {\n  125 |     None,\n  126 |     Request,\n  127 |     Require,\n  128 | }\n  129 | \n  130 | impl From<SmbEncryptionLevel> for smbc_smb_encrypt_level {\n  131 |     fn from(mode: SmbEncryptionLevel) -> Self {\n  132 |         match mode {\n  133 |             SmbEncryptionLevel::None => 0,\n  134 |             SmbEncryptionLevel::Request => 1,\n  135 |             SmbEncryptionLevel::Require => 2,\n  136 |         }\n  137 |     }\n  138 | }","lines":17,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/options.rs#L122-L138"},{"ref":"pavao/src/smb/types/options.rs:23-38","code":"   23 | impl Default for SmbOptions {\n   24 |     fn default() -> Self {\n   25 |         Self {\n   26 |             browser_max_lmb_count: 0,\n   27 |             case_sensitive: false,\n   28 |             encryption_level: SmbEncryptionLevel::None,\n   29 |             fallback_after_kerberos: false,\n   30 |             full_time_names: false,\n   31 |             no_auto_anonymous_login: false,\n   32 |             one_share_per_server: false,\n   33 |             open_share_mode: SmbShareMode::DenyNone,\n   34 |             url_encode_readdir_entries: false,\n   35 |             use_ccache: false,\n   36 |             use_kerberos: false,\n   37 |         }\n   38 |     }","lines":16,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/options.rs#L23-L38"}]},{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Build::build()` is public library API but calls `std::process::exit(1)` on failure, which kills the calling process without unwinding, without running destructors and without giving the caller any chance to recover or to fall back to a system libsmbclient. The actual error text is only sent to stderr wrapped in blank lines, while the `cargo:warning` shown to users contains no detail at all. A library should not decide to terminate the process.","fix":"Have `build()` `panic!(\"{e}\")` (build scripts already treat a panic as a failed build and print the message) or, better, keep only `try_build` public and let the caller decide. Include the error text in the `cargo:warning` line - note that `cargo:warning` is single-line, so the multi-line error should also be printed to stderr as it is now.","locations":[{"ref":"pavao-src/src/lib.rs:1432-1441","code":" 1432 |     pub fn build(&mut self) -> Artifacts {\n 1433 |         match self.try_build() {\n 1434 |             Ok(a) => a,\n 1435 |             Err(e) => {\n 1436 |                 println!(\"cargo:warning=pavao-src: failed to build samba from source\");\n 1437 |                 eprintln!(\"\\n\\n\\n{e}\\n\\n\\n\");\n 1438 |                 std::process::exit(1);\n 1439 |             }\n 1440 |         }\n 1441 |     }","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1432-L1441"}]},{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`add_env_includes` sets `CFLAGS` to only the `-I` flags it generates, unconditionally overwriting whatever `CFLAGS` the user has in the environment (and any flags the crate might want to forward). It also returns `Result<(), String>` while having no failure path at all, which forces a pointless `?` at the call site and hides the fact that nothing can go wrong.","fix":"Append instead of replace - read `env::var(\"CFLAGS\")` (or the target-specific variant) and prepend the existing value to the generated `-I` list - and change the signature to `fn add_env_includes(cmd: &mut Command, include_paths: &[PathBuf])` with no `Result`.","locations":[{"ref":"pavao-src/src/lib.rs:1813-1823","code":" 1813 | #[cfg(target_os = \"macos\")]\n 1814 | fn add_env_includes(cmd: &mut Command, include_paths: &[PathBuf]) -> Result<(), String> {\n 1815 |     let cflags = include_paths\n 1816 |         .iter()\n 1817 |         .map(|p| format!(\"-I{}\", p.display()))\n 1818 |         .collect::<Vec<_>>()\n 1819 |         .join(\" \");\n 1820 |     cmd.env(\"CFLAGS\", cflags);\n 1821 | \n 1822 |     Ok(())\n 1823 | }","lines":11,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1813-L1823"}]},{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`_SMBCCTX`, `_smbc_callbacks`, `_smbc_options`, `smbc_dirent` and `print_job_info` all get a public `Default` implemented via `mem::zeroed()`, and are `Copy`. An all-zero `SMBCCTX` is not a valid context: every function pointer and the `internal` pointer are null, so passing `&mut SMBCCTX::default()` to any `smbc_*` function segfaults inside the C library, yet the API presents this as a perfectly safe value. `Copy`/`Clone` on `_SMBCCTX` likewise lets safe code duplicate a context (or a `smbc_dirent` whose `name`/`comment` pointers are library-owned), producing two owners of the same C resource and a double `smbc_free_context` if both are used. The hand-written `impl Clone { *self }` blocks are also pure boilerplate for a `Copy` type.","fix":"Remove the `Default` impls from the context types (a `SMBCCTX` must only ever be obtained from `smbc_new_context()`), remove `Copy`/`Clone` from `_SMBCCTX`, and replace the remaining hand-written `impl clone::Clone { fn clone(&self) -> Self { *self } }` blocks with `#[derive(Clone, Copy)]` on the plain data structs (`smbc_dirent`, `libsmb_file_info`, `print_job_info`, `_smbc_options`). Callers that need scratch space can keep using `mem::zeroed()` explicitly inside `unsafe`.","locations":[{"ref":"pavao-sys/src/lib.rs:386-396","code":"  386 | impl clone::Clone for _SMBCCTX {\n  387 |     fn clone(&self) -> Self {\n  388 |         *self\n  389 |     }\n  390 | }\n  391 | \n  392 | impl default::Default for _SMBCCTX {\n  393 |     fn default() -> Self {\n  394 |         unsafe { mem::zeroed() }\n  395 |     }\n  396 | }","lines":11,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L386-L396"},{"ref":"pavao-sys/src/lib.rs:410-438","code":"  410 | impl clone::Clone for _smbc_callbacks {\n  411 |     fn clone(&self) -> Self {\n  412 |         *self\n  413 |     }\n  414 | }\n  415 | \n  416 | impl default::Default for _smbc_callbacks {\n  417 |     fn default() -> Self {\n  418 |         unsafe { mem::zeroed() }\n  419 |     }\n  420 | }\n  421 | \n  422 | #[repr(C)]\n  423 | #[derive(Copy)]\n  424 | pub struct _smbc_options {\n  425 |     pub browse_max_lmb_count: c_int,\n  426 |     pub urlencode_readdir_entries: c_int,\n  427 |     pub one_share_per_server: c_int,\n  428 | }\n  429 | impl clone::Clone for _smbc_options {\n  430 |     fn clone(&self) -> Self {\n  431 |         *self\n  432 |     }\n  433 | }\n  434 | impl default::Default for _smbc_options {\n  435 |     fn default() -> Self {\n  436 |         unsafe { mem::zeroed() }\n  437 |     }\n  438 | }","lines":29,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L410-L438"},{"ref":"pavao-sys/src/lib.rs:56-66","code":"   56 | impl clone::Clone for smbc_dirent {\n   57 |     fn clone(&self) -> Self {\n   58 |         *self\n   59 |     }\n   60 | }\n   61 | \n   62 | impl default::Default for smbc_dirent {\n   63 |     fn default() -> Self {\n   64 |         unsafe { mem::zeroed() }\n   65 |     }\n   66 | }","lines":11,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L56-L66"}]},{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Several declarations have the opposite constness of the C prototypes, which misleads callers about who may write through the pointer. `smbc_getNetbiosName`/`smbc_getWorkgroup`/`smbc_getUser` return `const char *` in C but are declared `-> *mut c_char` here, so safe-looking Rust could mutate (or `CString::from_raw` and free) memory owned by the library. `smbc_statvfs_fn` takes `char *path` in C but is declared with `fname: *const c_char`, so the compiler cannot warn if the library ever writes into the path buffer (`client.rs::statvfs` passes a shared `CString` pointer). `smbc_readdirplus_fn` returns `const struct libsmb_file_info *` in C but `*mut libsmb_file_info` here.","fix":"Mirror the header exactly: return `*const c_char` from the three getters (callers use `CStr::from_ptr`), declare `smbc_statvfs_fn`'s second parameter as `path: *mut c_char` and pass a mutable buffer from `client.rs::statvfs`, and return `*const libsmb_file_info` from `smbc_readdirplus_fn`.","locations":[{"ref":"pavao-sys/src/lib.rs:443-447","code":"  443 |     pub fn smbc_getNetbiosName(c: *mut SMBCCTX) -> *mut c_char;\n  444 |     pub fn smbc_setNetbiosName(c: *mut SMBCCTX, netbios_name: *mut c_char);\n  445 |     pub fn smbc_getWorkgroup(c: *mut SMBCCTX) -> *mut c_char;\n  446 |     pub fn smbc_setWorkgroup(c: *mut SMBCCTX, workgroup: *mut c_char);\n  447 |     pub fn smbc_getUser(c: *mut SMBCCTX) -> *mut c_char;","lines":5,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L443-L447"},{"ref":"pavao-sys/src/lib.rs:258-259","code":"  258 | pub type smbc_statvfs_fn =\n  259 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, fname: *const c_char, st: *mut statvfs) -> c_int>;","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L258-L259"},{"ref":"pavao-sys/src/lib.rs:270-271","code":"  270 | pub type smbc_readdirplus_fn =\n  271 |     option::Option<extern \"C\" fn(c: *mut SMBCCTX, dir: *mut SMBCFILE) -> *mut libsmb_file_info>;","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-sys/src/lib.rs#L270-L271"}]},{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`rename<S: AsRef<str>>(&self, orig_url: S, new_url: S)` and `print<S: AsRef<str>>(&self, p: S, print_queue: S)` use a *single* generic parameter for two independent arguments, forcing both to be exactly the same type. `client.rename(\"/a\", String::from(\"/b\"))` or `client.print(path_string, \"queue\")` does not compile, which is a gratuitous restriction (the same mistake is repeated in the test helper `create_file_at`).","fix":"Use one generic parameter per argument:\n\n```rust\npub fn rename<S: AsRef<str>, T: AsRef<str>>(&self, orig_url: S, new_url: T) -> SmbResult<()>\npub fn print<S: AsRef<str>, T: AsRef<str>>(&self, p: S, print_queue: T) -> SmbResult<()>\n```","locations":[{"ref":"pavao/src/smb/client.rs:186-189","code":"  186 |     pub fn rename<S>(&self, orig_url: S, new_url: S) -> SmbResult<()>\n  187 |     where\n  188 |         S: AsRef<str>,\n  189 |     {","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L186-L189"},{"ref":"pavao/src/smb/client.rs:372-375","code":"  372 |     pub fn print<S>(&self, p: S, print_queue: S) -> SmbResult<()>\n  373 |     where\n  374 |         S: AsRef<str>,\n  375 |     {","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L372-L375"},{"ref":"pavao/src/smb/client.rs:849-851","code":"  849 |     fn create_file_at<S: AsRef<str>>(client: &SmbClient, uri: S, content: S) {\n  850 |         info!(\"create_file_at - uri: {}\", uri.as_ref());\n  851 | ","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L849-L851"}]},{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`pub unsafe fn cstr<'a, T>(p: *const T) -> Cow<'a, str>` has an unconstrained lifetime parameter: `'a`\nis chosen by the caller and is unrelated to the pointed-to memory. `to_string_lossy` returns\n`Cow::Borrowed` whenever the bytes are valid UTF-8, so a caller can obtain a `&'static str` that\nactually borrows C-owned memory which libsmbclient may free at any time - a use-after-free reachable\nwithout writing any `unsafe` at the use site. The function also has no `# Safety` documentation and\ndoes not check for NULL, although both current call sites (`utils::cstr(srv)`, `utils::cstr(shr)` in\nthe auth callback) pass pointers that libsmbclient may legally set to NULL.","fix":"Tie the lifetime to the pointer and handle NULL:\n\n```rust\n/// # Safety\n/// `p` must be NULL or point to a NUL-terminated string valid for `'a`.\npub unsafe fn cstr<'a, T>(p: *const T) -> Cow<'a, str> {\n    if p.is_null() {\n        return Cow::Borrowed(\"\");\n    }\n    CStr::from_ptr(p as *const c_char).to_string_lossy()\n}\n```\n\nwith the signature changed to take a bounded reference, e.g. `unsafe fn cstr<'a>(p: &'a *const c_char) -> Cow<'a, str>`, or simply return an owned `String` so no borrow can escape.","locations":[{"ref":"pavao/src/utils.rs:25-27","code":"   25 | pub unsafe fn cstr<'a, T>(p: *const T) -> Cow<'a, str> {\n   26 |     CStr::from_ptr(p as *const c_char).to_string_lossy()\n   27 | }","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/utils.rs#L25-L27"},{"ref":"pavao/src/smb/client.rs:450-453","code":"  450 |         unsafe {\n  451 |             let srv = utils::cstr(srv);\n  452 |             let shr = utils::cstr(shr);\n  453 |             trace!(\"authenticating on {}\\\\{}\", &srv, &shr);","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L450-L453"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"`try_build` unconditionally deletes the whole build directory and then calls `clone_samba`, which performs a full (non-shallow, all-branches, all-history) `git2::Repository::clone` of `https://git.samba.org/samba.git` - several hundred megabytes - followed by a complete `configure` + `make` of samba. Because nothing is cached and nothing is reused, every single re-run of the build script re-downloads and recompiles everything, which takes tens of minutes and requires network access; a transient network failure fails the build. There is also no way to point the crate at an already-present source tree (see the unused `samba_dir` field) or at a mirror.","fix":"Make the clone incremental and cheap: keep the source tree between runs (only wipe it when the tag or crate version changes, e.g. by writing a stamp file into `out_dir`), and fetch only what is needed by using `git2::build::RepoBuilder` with a `FetchOptions` depth of 1 and the single refspec `refs/tags/samba-<version>`. Honour an override such as `PAVAO_SAMBA_SRC_DIR` / the existing `samba_dir` setter to reuse a local checkout and skip cloning entirely, and allow overriding the repository URL for mirrors.","locations":[{"ref":"pavao-src/src/lib.rs:1451-1459","code":" 1451 |         if build_dir.exists() {\n 1452 |             fs::remove_dir_all(&build_dir).map_err(|e| format!(\"build_dir: {e}\"))?;\n 1453 |         }\n 1454 | \n 1455 |         let inner_dir = build_dir.join(\"src\");\n 1456 |         fs::create_dir_all(&inner_dir).map_err(|e| format!(\"{}: {e}\", inner_dir.display()))?;\n 1457 | \n 1458 |         // get src at `inner_dir`\n 1459 |         clone_samba(&inner_dir)?;","lines":9,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1451-L1459"},{"ref":"pavao-src/src/lib.rs:1789-1811","code":" 1789 | /// Clone samba repository to the given path.\n 1790 | fn clone_samba(p: &Path) -> Result<(), String> {\n 1791 |     let repo_url = \"https://git.samba.org/samba.git\";\n 1792 |     let repo = git2::Repository::clone(repo_url, p).map_err(|e| format!(\"cloning samba: {e}\"))?;\n 1793 | \n 1794 |     // checkout tag \"samba-4.22.0\"\n 1795 |     let tag = format!(\"samba-{}\", version());\n 1796 |     let obj = repo\n 1797 |         .revparse_single(&tag)\n 1798 |         .map_err(|e| format!(\"revparse_single: {e}\"))?;\n 1799 | \n 1800 |     let commit = obj\n 1801 |         .peel_to_commit()\n 1802 |         .map_err(|e| format!(\"peel_to_commit: {e}\"))?;\n 1803 | \n 1804 |     repo.checkout_tree(&obj, None)\n 1805 |         .map_err(|e| format!(\"checkout_tree: {e}\"))?;\n 1806 | \n 1807 |     repo.set_head_detached(commit.id())\n 1808 |         .map_err(|e| format!(\"set_head_detached: {e}\"))?;\n 1809 | \n 1810 |     Ok(())\n 1811 | }","lines":23,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1789-L1811"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Every single `read`, `write` and `seek` call locks the global `SMBCTX` mutex (via `self.smbc.ctx()`)\nand re-resolves the libsmbclient function pointer through an FFI `smbc_getFunction*` call. The\nfunction pointers are fixed for the lifetime of the context, so the lookup is pure overhead, and the\nglobal lock means concurrent I/O on *different* files (in different threads) serialises on the same\nmutex, in addition to being a per-call atomic on the single-threaded path.","fix":"Resolve `read`/`write`/`lseek`/`close` once in `SmbFile::new` (or cache them in `SmbClient` behind a `OnceLock`) and store them in the `SmbFile` struct together with the `*mut SMBCCTX`, so the hot path performs no lock and no `smbc_getFunction*` call.","locations":[{"ref":"pavao/src/smb/types/file.rs:26-42","code":"   26 | impl Read for SmbFile<'_> {\n   27 |     fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> {\n   28 |         trace!(\"reading file to buf [{:?};{}]\", buf.as_ptr(), buf.len());\n   29 |         let ctx = self\n   30 |             .smbc\n   31 |             .ctx()\n   32 |             .map_err(|_| std::io::Error::other(\"smbc context is not initialized, cannot read\"))?;\n   33 |         let read_fn = self.smbc.get_fn(ctx, smbc_getFunctionRead)?;\n   34 |         let bytes_read = utils::to_result_with_le(read_fn(\n   35 |             ctx,\n   36 |             self.fd,\n   37 |             buf.as_mut_ptr() as *mut c_void,\n   38 |             buf.len() as _,\n   39 |         ))?;\n   40 |         Ok(bytes_read as usize)\n   41 |     }\n   42 | }","lines":17,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L26-L42"},{"ref":"pavao/src/smb/types/file.rs:67-84","code":"   67 | impl Seek for SmbFile<'_> {\n   68 |     fn seek(&mut self, pos: SeekFrom) -> io::Result<u64> {\n   69 |         trace!(\"seeking file at {:?}\", pos);\n   70 |         let ctx = self\n   71 |             .smbc\n   72 |             .ctx()\n   73 |             .map_err(|_| std::io::Error::other(\"smbc context is not initialized, cannot read\"))?;\n   74 |         let lseek_fn = self.smbc.get_fn(ctx, smbc_getFunctionLseek)?;\n   75 |         let (whence, off) = match pos {\n   76 |             SeekFrom::Start(p) => (libc::SEEK_SET, p as off_t),\n   77 |             SeekFrom::End(p) => (libc::S ","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`open_with` checks `if (fd as i64) < 0` on a value of type `*mut SMBCFILE`. A pointer is not a POSIX file descriptor: the test can never be true for any pointer returned by `smbc_open` (and on 32-bit targets `fd as i64` is zero-extended, so it is provably always `false`), while the only real failure mode - a `NULL` return - has already been handled one line earlier by `utils::result_from_ptr_mut`. This is a leftover from the integer-`fd` flavour of the libsmbclient API and gives a false impression that the error case is covered by `SmbError::BadFileDescriptor`.","fix":"Drop the bogus comparison and keep only the `NULL` check, mapping it to `SmbError::BadFileDescriptor` if that error kind is wanted:\n\n```rust\nlet fd = open_fn(self.ctx()?, path.as_ptr(), options.to_flags(), options.mode);\nif fd.is_null() {\n    error!(\"failed to open file: {}\", utils::last_os_error());\n    return Err(utils::last_os_error());\n}\nOk(SmbFile::new(self, fd))\n```","locations":[{"ref":"pavao/src/smb/client.rs:485-497","code":"  485 |         let fd = utils::result_from_ptr_mut(open_fn(\n  486 |             self.ctx()?,\n  487 |             path.as_ptr(),\n  488 |             options.to_flags(),\n  489 |             options.mode,\n  490 |         ))?;\n  491 |         if (fd as i64) < 0 {\n  492 |             error!(\"got a negative file descriptor\");\n  493 |             Err(SmbError::BadFileDescriptor)\n  494 |         } else {\n  495 |             trace!(\"opened file with file descriptor {:?}\", fd);\n  496 |             Ok(SmbFile::new(self, fd))\n  497 |         }","lines":13,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L485-L497"}]},{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`run_command` is annotated `#[track_caller]`, but it never panics and never calls `std::panic::Location::caller()`, so the attribute has no observable effect - it only suggests to readers that caller location is reported somewhere.","fix":"Remove the `#[track_caller]` line above `fn run_command`, or actually use the location, e.g. include `std::panic::Location::caller()` in the returned error message.","locations":[{"ref":"pavao-src/src/lib.rs:1634-1636","code":" 1634 |     #[track_caller]\n 1635 |     fn run_command(&self, mut command: Command, desc: &str) -> Result<(), String> {\n 1636 |         println!(\"running {:?}\", command);","lines":3,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1634-L1636"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`setup_options` calls `smbc_setOptionDebugToStderr(ctx, 0)` unconditionally and then, under `#[cfg(feature = \"debug\")]`, calls `smbc_setOptionDebugToStderr(ctx, 1 as i32)` again, so the first call is dead whenever the feature is on. The `1 as i32` cast is also redundant since the literal already infers to `i32`.","fix":"Collapse the two calls into one and drop the cast:\n\n```rust\n#[cfg(feature = \"debug\")]\nsmbc_setOptionDebugToStderr(ctx, 1);\n#[cfg(not(feature = \"debug\"))]\nsmbc_setOptionDebugToStderr(ctx, 0);\n```\n\n(remove the unconditional `smbc_setOptionDebugToStderr(ctx, 0);` line).","locations":[{"ref":"pavao/src/smb/client.rs:423-435","code":"  423 |         smbc_setOptionDebugToStderr(ctx, 0);\n  424 |         smbc_setOptionFallbackAfterKerberos(ctx, options.fallback_after_kerberos as i32);\n  425 |         smbc_setOptionNoAutoAnonymousLogin(ctx, options.no_auto_anonymous_login as i32);\n  426 |         smbc_setOptionOneSharePerServer(ctx, options.one_share_per_server as i32);\n  427 |         smbc_setOptionOpenShareMode(ctx, options.open_share_mode.into());\n  428 |         smbc_setOptionSmbEncryptionLevel(ctx, options.encryption_level.into());\n  429 |         smbc_setOptionUrlEncodeReaddirEntries(ctx, options.url_encode_readdir_entries as i32);\n  430 |         smbc_setOptionUseCCache(ctx, options.use_ccache as i32);\n  431 |         smbc_setOptionUseKerberos(ctx, options.use_kerberos as i32);\n  432 |         #[cfg(feature = \"debug\")]\n  433 |         smbc_setOptionDebugToStderr(ctx, 1 as i32);\n  434 |         #[cfg(feature = \"debug\")]\n  435 |         smbc_setDebug(ctx, 10);","lines":13,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L423-L435"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"medium","description":"The crate documentation describes an API that the implementation does not provide. The example passes credentials to `SmbClient::new` per client and comments `// drop connection` on `drop(client)`, but `SmbClient::new` opens no connection at all (it only allocates and initialises a context), and the context plus credentials are stored in process-global `lazy_static` singletons: the second client created in a process silently inherits the first one's context and credentials, and dropping *any* client calls `smbc_free_context` and nulls the global, invalidating every other live `SmbClient`. Readers following the documented pattern (a client per share/credential set) get silently wrong behaviour.","fix":"Either document the real semantics (one process-wide context, first-wins credentials, `drop` invalidates all clients - and mark the example `no_run`), or fix the implementation so each `SmbClient` owns its own `SMBCCTX` and its own credential entry, and only that client's `Drop` frees it. The doc comment `// drop connection` should be removed or replaced with `// free the smb context`.","locations":[{"ref":"pavao/src/lib.rs:14-38","code":"   14 | //! ## Example\n   15 | //!\n   16 | //!\n   17 | //! ```rust\n   18 | //! use pavao::{SmbClient, SmbCredentials, SmbOptions};\n   19 | //!\n   20 | //! let client = SmbClient::new(\n   21 | //!     SmbCredentials::default()\n   22 | //!         .server(\"smb://localhost:3445\")\n   23 | //!         .share(\"/temp\")\n   24 | //!         .username(\"test\")\n   25 | //!         .password(\"test\")\n   26 | //!         .workgroup(\"pavao\"),\n   27 | //!     SmbOptions::default()\n   28 | //!         .case_sensitive(true)\n   29 | //!         .one_share_per_server(true),\n   30 | //!     )\n   31 | //!     .unwrap();\n   32 | //!\n   33 | //! // drop connection\n   34 | //! drop(client);\n   35 | //! ```\n   36 | //!\n   37 | //! Further examples can be found under the `examples/` directory in the Github repository\n   38 | //!","lines":25,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/lib.rs#L14-L38"},{"ref":"pavao/src/smb/client.rs:49-52","code":"   49 | lazy_static! {\n   50 |     static ref AUTH_SERVICE: Mutex<AuthService> = Mutex::new(AuthService::default());\n   51 |     static ref SMBCTX: Arc<Mutex<SmbContext>> = Arc::new(Mutex::new(SmbContext::null()));\n   52 | }","lines":4,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L49-L52"},{"ref":"pavao/src/smb/client.rs:502-519","code":"  502 | impl Drop for SmbClient {\n  503 |     fn drop(&mut self) {\n  504 |         trace!(\"removing uri from auth service\");\n  505 |         unsafe {\n  506 |             if let Ok(mut context) = SMBCTX.lock() {\n  507 |                 AUTH_SERVICE\n  508 |                     .lock()\n  509 |                     .unwrap()\n  510 |                     .remove(Self::auth_service_uuid(context.get()));\n  511 |                 trace!(\"closing smbclient\");\n  512 |                 smbc_free_context(context.get(), 1_i32);\n  513 |                 // set context to null\n  514 |                 context.set(ptr::null_mut());\n  515 |             }\n  516 |         }\n  517 |         trace!(\"smbclient context freed\");\n  518 |     }\n  519 | }","lines":18,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L502-L519"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"`SmbStat::created` is documented as \"Creation time\" but is filled from `s.st_ctime`, which is the\nPOSIX inode **change** time, not a birth time. `struct stat` has no creation time at all, and the\nsame file already models the distinction correctly for `SmbDirentInfo` (`ctime` vs `btime`). Callers\nthat trust the field name/doc will report the last permission or size change as the creation date.","fix":"Rename the field and fix the doc (breaking, but correct):\n\n```rust\n/// Last status change time (POSIX `st_ctime`); `struct stat` has no creation time\npub changed: SystemTime,\n```\n\nand `changed: time_t_to_system_time(s.st_ctime),`. If the name must stay for API compatibility, change the doc comment to \"Last status change time (`st_ctime`), NOT a creation time\".","locations":[{"ref":"pavao/src/smb/types/stat.rs:150-151","code":"  150 |     /// Creation time\n  151 |     pub created: SystemTime,","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L150-L151"},{"ref":"pavao/src/smb/types/stat.rs:186-186","code":"  186 |             created: time_t_to_system_time(s.st_ctime),","lines":1,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/stat.rs#L186"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Several comments and messages were copied verbatim from `openssl-src` and are wrong here: they talk about OpenSSL in a crate that builds samba, and one contains the typo `OpenSSL contains about the conflict` (meant: *complains*). This actively misleads readers into thinking an OpenSSL build is involved.","fix":"Reword to reference the actual build. For example replace\n\n`// already selected an arch implicitly via the target above, and`\n`// OpenSSL contains about the conflict if both are specified.`\n\nwith\n\n`// already selected an arch implicitly via the target above, and`\n`// the compiler complains if both are specified.`\n\nand change `\"don't know how to configure OpenSSL for {}\"` to `\"don't know how to configure samba for {}\"`.","locations":[{"ref":"pavao-src/src/lib.rs:1508-1517","code":" 1508 |             // cc includes an `-arch` flag for Apple platforms, but we've\n 1509 |             // already selected an arch implicitly via the target above, and\n 1510 |             // OpenSSL contains about the conflict if both are specified.\n 1511 |             if target.contains(\"apple\") && arg == \"-arch\" {\n 1512 |                 skip_next = true;\n 1513 |                 continue;\n 1514 |             }\n 1515 | \n 1516 |             // cargo-lipo specifies this but OpenSSL complains\n 1517 |             if target.contains(\"apple-ios\") {","lines":10,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1508-L1517"},{"ref":"pavao-src/src/lib.rs:1779-1779","code":" 1779 |                     \"don't know how to configure OpenSSL for {}\",","lines":1,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1779"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Several doc comments are wrong or copy-pasted. `get_user` is documented as \"Get get_user name from server\" (the function name was pasted into the sentence). More importantly, the netbios/workgroup/user/timeout accessors all claim to talk to the server (\"Get netbios name from server\", \"Set timeout to server\", ...), while `smbc_getNetbiosName`/`smbc_setTimeout` and friends only read and write fields of the *local* `SMBCCTX`; no SMB traffic is involved, and the setters have no effect on connections that are already established. Users reading these docs will expect a server round trip that never happens.","fix":"Fix the typo and reword to describe the local context, e.g.\n\n```rust\n/// Get the username currently configured on the client context\n```\n\nand for the setters add a note such as \"Sets the value on the local client context; it only affects connections established afterwards.\"","locations":[{"ref":"pavao/src/smb/client.rs:132-133","code":"  132 |     /// Get get_user name from server\n  133 |     pub fn get_user(&self) -> SmbResult<String> {","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L132-L133"},{"ref":"pavao/src/smb/client.rs:92-93","code":"   92 |     /// Get netbios name from server\n   93 |     pub fn get_netbios_name(&self) -> SmbResult<String> {","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L92-L93"},{"ref":"pavao/src/smb/client.rs:152-153","code":"  152 |     /// Get timeout from server\n  153 |     pub fn get_timeout(&self) -> SmbResult<Duration> {","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L152-L153"},{"ref":"pavao/src/smb/client.rs:158-159","code":"  158 |     /// Set timeout to server\n  159 |     pub fn set_timeout(&self, timeout: Duration) -> SmbResult<()> {","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L158-L159"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `SmbOpenOptions::flags` claims it \"is *bitwise OR* of `O_CREAT`, `O_EXCL` and\n`O_TRUNC`\", but `append()` also stores `O_APPEND` in it, and the access mode\n(`O_RDONLY`/`O_WRONLY`/`O_RDWR`) is *not* stored there - it is computed separately in `to_flags`.\nThe comment therefore mis-describes both what is and what is not in the field.","fix":"Replace\n\n```rust\n/// is *bitwise OR* of `O_CREAT`, `O_EXCL` and `O_TRUNC`\nflags: c_int,\n```\n\nwith\n\n```rust\n/// bitwise OR of `O_CREAT`, `O_EXCL`, `O_TRUNC` and `O_APPEND`;\n/// the access mode is derived from `read`/`write` in `to_flags`\nflags: c_int,\n```","locations":[{"ref":"pavao/src/smb/types/file.rs:98-108","code":"   98 | #[derive(Clone, Copy, Debug)]\n   99 | pub struct SmbOpenOptions {\n  100 |     /// is *bitwise OR* of `O_CREAT`, `O_EXCL` and `O_TRUNC`\n  101 |     flags: c_int,\n  102 |     /// if readable\n  103 |     read: bool,\n  104 |     /// if writable\n  105 |     write: bool,\n  106 |     /// for posix file mode\n  107 |     pub(crate) mode: mode_t,\n  108 | }","lines":11,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/types/file.rs#L98-L108"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`version()` is documented as \"samba version\" and its comment claims to \"remove any `-`\", but it truncates the crate version at the first `-` (crate version `4.22.0-4` -> `4.22.0`, where the `-4` is pavao's own packaging revision). The trailing `.expect(\"Invalid version format\")` is unreachable, since `str::split` always yields at least one element, so it documents an error condition that cannot occur. Relatedly, the comment `// checkout tag \"samba-4.22.0\"` in `clone_samba` hardcodes one specific version and will go stale on the next bump.","fix":"Fix the comments and drop the impossible `expect`:\n\n```rust\n/// Samba version this crate builds, derived from the crate version\n/// (`4.22.0-4` -> `4.22.0`; the suffix is pavao's own packaging revision).\npub fn version() -> &'static str {\n    env!(\"CARGO_PKG_VERSION\").split('-').next().unwrap_or(env!(\"CARGO_PKG_VERSION\"))\n}\n```\n\nand change `// checkout tag \"samba-4.22.0\"` to `// checkout the samba-<version> tag`.","locations":[{"ref":"pavao-src/src/lib.rs:1354-1361","code":" 1354 | /// samba version\n 1355 | pub fn version() -> &'static str {\n 1356 |     // get pkg version and remove any `-`\n 1357 |     env!(\"CARGO_PKG_VERSION\")\n 1358 |         .split('-')\n 1359 |         .next()\n 1360 |         .expect(\"Invalid version format\")\n 1361 | }","lines":8,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1354-L1361"},{"ref":"pavao-src/src/lib.rs:1794-1795","code":" 1794 |     // checkout tag \"samba-4.22.0\"\n 1795 |     let tag = format!(\"samba-{}\", version());","lines":2,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao-src/src/lib.rs#L1794-L1795"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`SmbModeClass::new` is documented as `/// Instantiates a new `SmbMode`` - wrong type name, left over\nfrom a copy of the `SmbMode` docs. Likewise `read()`, `write()` and `execute()` are documented as\n\"Returns whether **user** can ...\", although the very same `SmbModeClass` type is also returned by\n`SmbMode::group()` and `SmbMode::others()`, so the docs describe the wrong subject for two of the\nthree classes.","fix":"Change `/// Instantiates a new `SmbMode`` to `/// Instantiates a new `SmbModeClass``, and reword the accessors from\n\"Returns whether user can read\" to \"Returns whether this class can read\" (same for `write` / `execute`).","locations":[{"ref":"pavao/src/smb/types/mode.rs:121-129","code":"  121 | impl SmbModeClass {\n  122 |     /// Instantiates a new `SmbMode`\n  123 |     pub fn new(read: bool, write: bool, execute: bool) -> Self {\n  124 |         Self {\n  125 |             read,\n  126 |             w  keyed by that context; (3) a `uri` module (with tests) for URL building/escaping; (4) `client.rs` keeping only the thin operation wrappers. Move the Docker-based tests to `tests/` behind a feature flag so the unit test suite stays runnable.","locations":[{"ref":"pavao/src/smb/client.rs:18-57","code":"   18 | struct SmbContext {\n   19 |     inner: *mut SMBCCTX,\n   20 | }\n   21 | \n   22 | impl SmbContext {\n   23 |     /// Create a null context\n   24 |     fn null() -> Self {\n   25 |         SmbContext {\n   26 |             inner: ptr::null_mut(),\n   27 |         }\n   28 |     }\n   29 | \n   30 |     /// Set context\n   31 |     pub fn set(&mut self, ctx: *mut SMBCCTX) {\n   32 |         self.inner = ctx;\n   33 |     }\n   34 | \n   35 |     /// Get context\n   36 |     pub fn get(&self) -> *mut SMBCCTX {\n   37 |         self.inner\n   38 |     }\n   39 | \n   40 |     /// Check if context is null\n   41 |     pub fn is_null(&self) -> bool {\n   42 |         self.get().is_null()\n   43 |     }\n   44 | }\n   45 | \n   46 | unsafe impl Sync for SmbContext {}\n   47 | unsafe impl Send for SmbContext {}\n   48 | \n   49 | lazy_static! {\n   50 |     static ref AUTH_SERVICE: Mutex<AuthService> = Mutex::new(AuthService::default());\n   51 |     static ref SMBCTX: Arc<Mutex<SmbContext>> = Arc::new(Mutex::new(SmbContext::null()));\n   52 | }\n   53 | \n   54 | /// Smb protocol client\n   55 | pub struct SmbClient {\n   56 |     uri: String,\n   57 | }","lines":40,"link":"https://github.com/veeso/pavao/blob/6edf0eb23b9d95c995d321836b7e6a318ac9d59c/pavao/src/smb/client.rs#L18-L57"},{"ref":"pavao/src/smb/client.rs:409-473","code":"  409 |     /// Callback getter\n  410 |     #[allow(improper_ctypes_definitions)]\n  411 |     pub(crate) fn get_fn<T>(\n  412 |         &self,\n  413 |         ctx: *mut SMBCCTX,\n  414 |         get_func: unsafe extern \"C\" fn(*mut SMBCCTX) -> Option<T>,\n  415 |     ) -> std::io::Result<T> {\n  416 |         unsafe { get_func(ctx).ok
