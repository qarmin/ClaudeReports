<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`our_error_handler` (`src/io.rs:76-90`) is registered with `snd_lib_error_set_local` and invoked directly by libasound as a C callback. Inside it, `ERROR_OUTPUT.with_borrow(|e| { let b = e.as_ref().expect(\"ERROR_OUTPUT not set\").borrow_mut(); ... })` (`src/io.rs:84`) will panic if this thread-local hasn't been populated - which happens whenever the callback fires on any OS thread other than the one that called `Output::local_error_handler()` (alsa-lib can log errors from internal worker threads for some backends/plugins), or if `local_error_handler` was simply never called on the calling thread. Since this function is `extern \"C\"` and called directly from C code, an unwinding panic here is undefined behavior at the FFI boundary (at best it aborts the process uncontrolled).","fix":"Never let this callback panic: replace the `.expect(...)` with a no-op fallback when `ERROR_OUTPUT` is `None` (just return without writing), and/or wrap the body in `std::panic::catch_unwind` so a panic can never cross the `extern \"C\"` boundary.","locations":[{"ref":"src/io.rs:76-90","code":"   76 | unsafe extern \"C\" fn our_error_handler(_file: *const c_char,\n   77 |     _line: c_int,\n   78 |     func: *const c_char,\n   79 |     _err: c_int,\n   80 |     fmt: *const c_char,\n   81 |     arg: *mut alsa::__va_list_tag,\n   82 | ) {\n   83 |     ERROR_OUTPUT.with_borrow(|e| {\n   84 |         let b = e.as_ref().expect(\"ERROR_OUTPUT not set\").borrow_mut();\n   85 |         alsa::snd_output_puts(b.0, func);\n   86 |         alsa::snd_output_puts(b.0, c\": \".as_ptr());\n   87 |         alsa::snd_output_vprintf(b.0, fmt, arg);\n   88 |         alsa::snd_output_putc(b.0, '\\n' as i32);\n   89 |     })\n   90 | }","lines":15,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/io.rs#L76-L90"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`ChmapType::from_c_int(...).unwrap()` in `ChmapsQuery::next` (`src/chmap.rs:134`) and `ChmapPosition::from_c_int(v as libc::c_int, \"\").unwrap()` in `impl From<&Chmap> for Vec<ChmapPosition>` (`src/chmap.rs:109`) both convert integer codes reported by the sound driver/hardware into a fixed, compiled-in enum via `alsa_enum!`'s `from_c_int`, then immediately `.unwrap()`. If the running libasound/kernel ever reports a channel-map type or position value that isn't in this crate's hard-coded list (e.g. a newer `SND_CHMAP_*` constant added upstream), the lookup returns `Err(...)` and the `.unwrap()` panics, crashing the whole process on untrusted, driver-supplied data.","fix":"Propagate the error instead of unwrapping: make `Vec<ChmapPosition>::from` fallible (a `TryFrom` returning `Result<Vec<ChmapPosition>, Error>`) and have `ChmapsQuery::next` skip or surface unknown types as `Err`/`None` rather than panicking.","locations":[{"ref":"src/chmap.rs:107-111","code":"  107 | impl<'a> From<&'a Chmap> for Vec<ChmapPosition> {\n  108 |     fn from(a: &'a Chmap) -> Vec<ChmapPosition> {\n  109 |         a.as_slice().iter().map(|&v| ChmapPosition::from_c_int(v as libc::c_int, \"\").unwrap()).collect()\n  110 |     }\n  111 | }","lines":5,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/chmap.rs#L107-L111"},{"ref":"src/chmap.rs:127-138","code":"  127 | impl Iterator for ChmapsQuery {\n  128 |     type Item = (ChmapType, Chmap);\n  129 |     fn next(&mut self) -> Option<Self::Item> {\n  130 |         if self.0.is_null() { return None; }\n  131 |         let p = unsafe { *self.0.offset(self.1) };\n  132 |         if p.is_null() { return None; }\n  133 |         self.1 += 1;\n  134 |         let t = ChmapType::from_c_int(unsafe { (*p).type_ } as libc::c_int, \"snd_pcm_query_chmaps\").unwrap();\n  135 |         let m = Chmap(unsafe { &mut (*p).map }, false);\n  136 |         Some((t, m))\n  137 |     }\n  138 | }","lines":12,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/chmap.rs#L127-L138"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`ElemInfo::get_type` (`src/ctl_int.rs:365-366`) and `ElemId::get_interface` (`src/ctl_int.rs:422-423`) both call `alsa_enum!`'s `from_c_int(...).unwrap()` on values read straight from kernel/driver-populated `snd_ctl_elem_info_t`/`snd_ctl_elem_id_t` structures. If the running kernel/driver ever reports an element type or interface value newer than this crate's compiled-in `ElemType`/`ElemIface` list (both are fixed enums maintained by hand in this crate), the lookup fails and `.unwrap()` panics. `ElemInfo::get_type` in particular sits on a common path (used by `Elem::read` in `src/hctl.rs:137-141` to size the `ElemValue` before every control read).","fix":"Change `get_type`/`get_interface` to return `Result<ElemType>`/`Result<ElemIface>` and propagate the `Error::unsupported(...)` to the caller instead of unwrapping, updating call sites such as `hctl::Elem::read` accordingly.","locations":[{"ref":"src/ctl_int.rs:364-368","code":"  364 | impl ElemInfo {\n  365 |     pub fn get_type(&self) -> ElemType { ElemType::from_c_int(\n  366 |         unsafe { alsa::snd_ctl_elem_info_get_type(self.0) } as c_int, \"snd_ctl_elem_info_get_type\").unwrap() }\n  367 |     pub fn get_count(&self) -> u32 { unsafe { alsa::snd_ctl_elem_info_get_count(self.0) as u32 } }\n  368 | }","lines":5,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/ctl_int.rs#L364-L368"},{"ref":"src/ctl_int.rs:415-424","code":"  415 | impl ElemId {\n  416 |     pub fn get_name(&self) -> Result<&str> {\n  417 |         from_const(\"snd_hctl_elem_id_get_name\", unsafe { alsa::snd_ctl_elem_id_get_name(elem_id_ptr(self)) })}\n  418 |     pub fn get_device(&self) -> u32 { unsafe { alsa::snd_ctl_elem_id_get_device(elem_id_ptr(self)) as u32 }}\n  419 |     pub fn get_subdevice(&self) -> u32 { unsafe { alsa::snd_ctl_elem_id_get_subdevice(elem_id_ptr(self)) as u32 }}\n  420 |     pub fn get_numid(&self) -> u32 { unsafe { alsa::snd_ctl_elem_id_get_numid(elem_id_ptr(self)) as u32 }}\n  421 |     pub fn get_index(&self) -> u32 { unsafe { alsa::snd_ctl_elem_id_get_index(elem_id_ptr(self)) as u32 }}\n  422 |     pub fn get_interface(&self) -> ElemIface { ElemIface::from_c_int(\n  423 |         unsafe { alsa::snd_ctl_elem_id_get_interface(elem_id_ptr(self)) } as c_int, \"snd_ctl_elem_id_get_interface\").unwrap() }\n  424 | ","lines":10,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/ctl_int.rs#L415-L424"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Status::state()` (`src/direct/pcm.rs:114-120`) reads the PCM state directly out of kernel-mapped DMA memory with `ptr::read_volatile` and then does `assert!((i >= Open) && (i <= Disconnected))` before `mem::transmute`-ing it into `pcm::State`. Because this value comes from shared memory the kernel can update at any time (and is documented elsewhere in this same file as potentially reflecting a torn/'bogus' read, see the comments on `htstamp`/`audio_htstamp`), an out-of-range read triggers a hard panic instead of a recoverable error. Contrast with `SyncPtrStatus::sync_ptr` (`src/direct/pcm.rs:63-70`), which performs the identical range check but returns `Err(Error::unsupported(...))` instead of panicking - the two code paths handle the exact same untrusted value inconsistently.","fix":"Make `state()` fallible (return `Result<pcm::State>` or fall back to a defensive default state) instead of asserting, mirroring the error handling already used in `SyncPtrStatus::sync_ptr`.","locations":[{"ref":"src/direct/pcm.rs:114-121","code":"  114 |     /// Current PCM state.\n  115 |     pub fn state(&self) -> pcm::State {\n  116 |         unsafe {\n  117 |             let i = ptr::read_volatile(&(*self.0.ptr).state);\n  118 |             assert!((i >= (pcm::State::Open as snd_pcm_state_t)) && (i <= (pcm::State::Disconnected as snd_pcm_state_t)));\n  119 |             mem::transmute(i as u8)\n  120 |         }\n  121 |     }","lines":8,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/direct/pcm.rs#L114-L121"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`PCM::state()`, `pcm::Info::get_stream()`, and `pcm::Status::get_state()` all convert an ALSA-returned C `enum` value into the crate's Rust enum and either `panic!` explicitly or call `.unwrap()` on failure, instead of returning a `Result`. Since these values come from the ALSA driver/kernel (not validated user input, but still external data outside the crate's control), a future libasound version adding a new state/stream value, or a buggy/unusual driver, would crash the whole process rather than surfacing a recoverable `Error`.","fix":"Change these accessors to return `Result<State>`/`Result<Direction>` (propagating the `Result` already produced by `State::from_c_int`/`Format::from_c_int`) instead of panicking/unwrapping, or at minimum document clearly that they may panic on unrecognized driver-reported values.","locations":[{"ref":"src/pcm.rs:192-200","code":"  192 |     pub fn state(&self) -> State {\n  193 |         let rawstate = self.state_raw();\n  194 |         if let Ok(state) = State::from_c_int(rawstate, \"snd_pcm_state\") {\n  195 |             state\n  196 |         }\n  197 |         else {\n  198 |             panic!(\"snd_pcm_state returned an invalid value of {}\", rawstate);\n  199 |         }\n  200 |     }","lines":9,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L192-L200"},{"ref":"src/pcm.rs:101-107","code":"  101 |     pub fn get_stream(&self) -> Direction {\n  102 |         match unsafe { alsa::snd_pcm_info_get_stream(self.0) } {\n  103 |             alsa::SND_PCM_STREAM_CAPTURE => Direction::Capture,\n  104 |             alsa::SND_PCM_STREAM_PLAYBACK => Direction::Playback,\n  105 |             n @ _ => panic!(\"snd_pcm_info_get_stream invalid direction '{}'\", n),\n  106 |         }\n  107 |     }","lines":7,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L101-L107"},{"ref":"src/pcm.rs:1296-1297","code":" 1296 |     pub fn get_state(&self) -> State { State::from_c_int(\n 1297 |         unsafe { alsa::snd_pcm_status_get_state(self.ptr()) } as c_int, \"snd_pcm_status_get_state\").unwrap() }","lines":2,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L1296-L1297"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`ClientIter::next`, `PortIter::next`, and `PortSubscribeIter::next` in `src/seq.rs` call `.unwrap()` on `ClientInfo::new()` / `PortInfo::new()` / `QuerySubscribe::new()` inside `Iterator::next`. These constructors call the fallible `snd_*_malloc` ALSA functions (which can fail with `ENOMEM`). Because `Iterator::next` cannot return `Result` here, any allocation failure while iterating clients/ports/subscriptions panics the whole program instead of ending iteration or surfacing an error.","fix":"Either make these iterators yield `Result<T>` (see the related finding about swallowed errors in the same iterators) so allocation failures can be reported as `Some(Err(e))`, or explicitly document that these iterators may panic under memory pressure.","locations":[{"ref":"src/seq.rs:303","code":"  303 |         let z = ClientInfo::new().unwrap();","lines":1,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/seq.rs#L303"},{"ref":"src/seq.rs:424","code":"  424 |         let z = PortInfo::new().unwrap();","lines":1,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/seq.rs#L424"},{"ref":"src/seq.rs:644","code":"  644 |         let query = QuerySubscribe::new().unwrap();","lines":1,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/seq.rs#L644"}]},{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`ChmapsQuery` (`src/chmap.rs:119`) owns the memory returned by `snd_pcm_query_chmaps` and frees it via `snd_pcm_free_chmaps` in its `Drop` impl (`src/chmap.rs:121-123`). Its `Iterator` impl yields `(ChmapType, Chmap)` pairs where each `Chmap` (`src/chmap.rs:135`) wraps a raw, non-owning pointer (`Chmap(..., false)`) into that same memory - but `Chmap` (`src/chmap.rs:71`) carries no lifetime parameter tying it to the `ChmapsQuery` it came from. Safe code such as `let items: Vec<_> = pcm.query_chmaps().collect();` drops the `ChmapsQuery` (freeing the backing array) while the yielded `Chmap` values are kept alive, leaving them dangling. Any subsequent call like `Display for Chmap` (which calls `snd_pcm_chmap_print` on `self.0`) then dereferences freed memory.","fix":"Give `Chmap` and `ChmapsQuery` a shared lifetime parameter (e.g. `Chmap<'a>` borrowing from `ChmapsQuery<'a>`), or make the iterator eagerly copy each `snd_pcm_chmap_t` into an owned, `libc::malloc`-allocated `Chmap` (flag `true`) instead of borrowing into the query's buffer, so a `Chmap` can never outlive the `ChmapsQuery` that owns its storage.","locations":[{"ref":"src/chmap.rs:71-75","code":"   71 | pub struct Chmap(*mut alsa::snd_pcm_chmap_t, bool);\n   72 | \n   73 | impl Drop for Chmap {\n   74 |     fn drop(&mut self) { if self.1 { unsafe { libc::free(self.0 as *mut libc::c_void) }}}\n   75 | }","lines":5,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/chmap.rs#L71-L75"},{"ref":"src/chmap.rs:119-138","code":"  119 | pub struct ChmapsQuery(*mut *mut alsa::snd_pcm_chmap_query_t, isize);\n  120 | \n  121 | impl Drop for ChmapsQuery {\n  122 |     fn drop(&mut self) { unsafe { alsa::snd_pcm_free_chmaps(self.0) }}\n  123 | }\n  124 | \n  125 | pub fn chmaps_query_new(a: *mut *mut alsa::snd_pcm_chmap_query_t) -> ChmapsQuery { ChmapsQuery(a, 0) }\n  126 | \n  127 | impl Iterator for ChmapsQuery {\n  128 |     type Item = (ChmapType, Chmap);\n  129 |     fn next(&mut self) -> Option<Self::Item> {\n  130 |         if self.0.is_null() { return None; }\n  131 |         let p = unsafe { *self.0.offset(self.1) };\n  132 |         if p.is_null() { return None; }\n  133 |         self.1 += 1;\n  134 |         let t = ChmapType::from_c_int(unsafe { (*p).type_ } as libc::c_int, \"snd_pcm_query_chmaps\").unwrap();\n  135 |         let m = Chmap(unsafe { &mut (*p).map }, false);\n  136 |         Some((t, m))\n  137 |     }\n  138 | }","lines":20,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/chmap.rs#L119-L138"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`Addr.client`/`Addr.port` are exposed as `i32` throughout `src/seq.rs`, but every place that hands an `Addr` to ALSA (`PortSubscribe::set_sender`/`set_dest`, `QuerySubscribe::set_root`, `Event::set_source`/`set_dest`, `RemoveEvents::set_dest`) truncates them to `c_uchar`/`u8` with a plain `as` cast and no range check. If a caller constructs an `Addr` with `client`/`port` outside `0..=255` (easy to do since the public type is a full `i32`, e.g. from `Addr::from_str` parsing arbitrary text), the value silently wraps instead of erroring, causing the wrong client/port to be subscribed, addressed, or removed.","fix":"Validate `client`/`port` are within `0..=255` (or `u8::try_from`) before constructing the raw `snd_seq_addr_t`, returning an error (or panicking with a clear message) instead of silently truncating, e.g. `client: u8: w_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Ctl::wait` (`src/ctl_int.rs:73-74`), `HCtl::wait` (`src/hctl.rs:89-90`) and `Mixer::wait` (`src/mixer.rs:66-67`) all convert `timeout_ms: Option<u32>` with `.map(|x| x as c_int).unwrap_or(-1)`. Any `timeout_ms` value at or above `i32::MAX` (~24.8 days) casts to a negative `c_int`, which ALSA's `snd_*_wait` interprets as 'wait forever' - silently turning a large-but-finite timeout request into an infinite wait instead of erroring or saturating.","fix":"Saturate instead of truncating, e.g. `timeout_ms.map(|x| x.min(i32::MAX as u32) as c_int).unwrap_or(-1)`, or return an error for out-of-range timeouts.","locations":[{"ref":"src/ctl_int.rs:73-74","code":"   73 |     pub fn wait(&self, timeout_ms: Option<u32>) -> Result<bool> {\n   74 |         acheck!(snd_ctl_wait(self.0, timeout_ms.map(|x| x as c_int).unwrap_or(-1))).map(|i| i == 1) }","lines":2,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/ctl_int.rs#L73-L74"},{"ref":"src/hctl.rs:89-90","code":"   89 |     pub fn wait(&self, timeout_ms: Option<u32>) -> Result<bool> {\n   90 |         acheck!(snd_hctl_wait(self.0, timeout_ms.map(|x| x as c_int).unwrap_or(-1))).map(|i| i == 1) }","lines":2,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/hctl.rs#L89-L90"},{"ref":"src/mixer.rs:66-67","code":"   66 |     pub fn wait(&self, timeout_ms: Option<u32>) -> Result<()> {\n   67 |         acheck!(snd_mixer_wait(self.0, timeout_ms.map(|x| x as c_int).unwrap_or(-1))).map(|_| ()) }","lines":2,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/mixer.rs#L66-L67"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`DriverMemory::new` (`src/direct/pcm.rs:218-230`) computes `let mut total = count * mem::size_of::<S>();` with plain `usize` multiplication, and `SampleData::new` (`src/direct/pcm.rs:249-274`) calls it with `count = (bufsize as usize) * (channels as usize)` where `bufsize`/`channels` come from `hw_params_current()` (negotiated with, and reported by, the hardware driver). Neither multiplication is checked. On a 32-bit target, or if a buggy/malicious driver reports a very large buffer size, this can silently wrap in release builds, causing `mmap` to map a smaller region than the `frames`/`channels` fields (retained un-wrapped) later assume in `data_ptr()`'s pointer-offset arithmetic - leading to out-of-bounds reads/writes into memory adjacent to the DMA mapping.","fix":"Use `checked_mul`/`checked_add` when computing `total` in `DriverMemory::new` and the `bufsize * channels` product in `SampleData::new`, returning an `Error` instead of silently wrapping on overflow.","locations":[{"ref":"src/direct/pcm.rs:218-230","code":"  218 |     fn new(fd: RawFd, count: usize, offs: libc::off_t, writable: bool) -> Result<Self> {\n  219 |         let mut total = count * mem::size_of::<S>();\n  220 |         let ps = pagesize();\n  221 |         assert!(total > 0);\n  222 |         if total % ps != 0 { total += ps - total % ps };\n  223 |         let flags = if writable { libc::PROT_WRITE | libc::PROT_READ } else { libc::PROT_READ };\n  224 |         let p = unsafe { libc::mmap(ptr::null_mut(), total, flags, libc::MAP_FILE | libc::MAP_SHARED, fd, offs) };\n  225 |         if p.is_null() || p == libc::MAP_FAILED {\n  226 |             Err(Error::last(\"mmap (of driver memory)\"))\n  227 |         } else {\n  228 |             Ok(DriverMemory { ptr: p as *mut S, size: total })\n  229 |         }\n  230 |     }","lines":13,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/direct/pcm.rs#L218-L230"},{"ref":"src/direct/pcm.rs:249-274","code":"  249 | impl<S> SampleData<S> {\n  250 |     pub fn new(p: &pcm::PCM) -> Result<Self> {\n  251 |         let params = p.hw_params_current()?;\n  252 |         let bufsize = params.get_buffer_size()?;\n  253 |         let channels = params.get_channels()?;\n  254 |         if params.get_access()? != pcm::Access::MMapInterleaved {\n  255 |             return Err(Error::unsupported(\"Not MMAP interleaved data\"))\n  256 |         }\n  257 | \n  258 |         let fd = pcm_to_fd(p)?;\n  259 |         let info = unsafe {\n  260 |             let mut info: snd_pcm_channel_info = mem::zeroed();\n  261 |             sndrv_pcm_ioctl_channel_info(fd, &mut info)?;\n  262 |             info\n  263 |         };\n  264 |         // println!(\"{:?}\", info);\n  265 |         if (info.step != channels * mem::size_of::<S>() as u32 * 8) || (info.first != 0) {\n  266 |             return Err(Error::unsupported(\"MMAP data size mismatch\"))\n  267 |         }\n  268 |         Ok(SampleData {\n  269 |             mem: DriverMemory::new(fd, (bufsize as usize) * (channels as usize), info.offset as libc::off_t, true)?,\n  270 |             frames: bufsize,\n  271 |             channels,\n  272 |         })\n  273 |     }\n  274 | }","lines":26,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/direct/pcm.rs#L249-L274"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`pcm::IO::to_frames`/`from_frames` (and the equivalent inline conversions in the `std::io::Read`/`Write` impls) multiply a `usize` buffer length by `size_of::<S>()` and cast the result to `isize`/back to `usize` with no overflow check, as flagged by the code's own `// TODO: Do we need to check for overflow here?` comments. On 32-bit targets, or with a pathologically large buffer, `b * size_of::<S>()` can wrap around before being handed to `snd_pcm_bytes_to_frames`, producing a frame count that doesn't correspond to the actual buffer size passed to ALSA.","fix":"Use checked/saturating arithmetic (`b.checked_mul(size_of::<S>())`) and return an `Error` (or clamp) on overflow instead of relying on an unchecked cast, resolving the existing `TODO` comments.","locations":[{"ref":"src/pcm.rs:401-409","code":"  401 |     fn to_frames(&self, b: usize) -> alsa::snd_pcm_uframes_t {\n  402 |         // TODO: Do we need to check for overflow here?\n  403 |         self.0.bytes_to_frames((b * size_of::<S>()) as isize) as alsa::snd_pcm_uframes_t\n  404 |     }\n  405 | \n  406 |     fn from_frames(&self, b: alsa::snd_pcm_uframes_t) -> usize {\n  407 |         // TODO: Do we need to check for overflow here?\n  408 |         (self.0.frames_to_bytes(b as Frames) as usize) / size_of::<S>()\n  409 |     }","lines":9,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L401-L409"},{"ref":"src/pcm.rs:483","code":"  483 |         let size = self.0.bytes_to_frames(buf.len() as isize) as alsa::snd_pcm_uframes_t; // TODO: Do we need to check for overflow here?","lines":1,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L483"},{"ref":"src/pcm.rs:493","code":"  493 |         let size = self.0.bytes_to_frames(buf.len() as isize) as alsa::snd_pcm_uframes_t; // TODO: Do we need to check for overflow here?","lines":1,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L493"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`MmapIO::commit` (`src/direct/pcm.rs:403-407`) computes the new `appl_ptr` as `z = appl_ptr() + v`, but then wraps it using `if z + v >= self.boundary() { z -= self.boundary() }` - adding `v` a second time in the wrap condition instead of testing `z` itself. For example with `appl_ptr=5`, `v=3`, `boundary=10`: the correct new position is `z=8` (no wrap needed since `8 < 10`), but the buggy check evaluates `z + v = 11 >= 10` as true and subtracts the boundary anyway, producing `z = -2`. This corrupts the application pointer written to the kernel via `Control::set_appl_ptr`, which is used by every `MmapPlayback::write`, `CaptureIter::drop` and `CaptureIter::handle_max` call in this real-time direct-I/O path, and can desynchronize the ring buffer between application and kernel (silently masked in most runs only because `boundary` is normally astronomically large relative to typical `v`).","fix":"Fix the wrap condition to test `z`, not `z + v`:\n```rust\npub fn commit(&self, v: Frames) {\n    let mut z = self.appl_ptr() + v;\n    if z >= self.boundary() { z -= self.boundary() };\n    self.c.set_appl_ptr(z)\n}\n```","locations":[{"ref":"src/direct/pcm.rs:403-407","code":"  403 |     pub fn commit(&self, v: Frames) {\n  404 |         let mut z = self.appl_ptr() + v;\n  405 |         if z + v >= self.boundary() { z -= self.boundary() };\n  406 |         self.c.set_appl_ptr(z)\n  407 |     }","lines":5,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/direct/pcm.rs#L403-L407"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Event::get_tick()` in `src/seq.rs` checks `self.has_flag(alsa::SND_SEQ_TIME_STAMP_REAL)` - the exact same condition used by `get_time()` just above it - instead of checking for the tick-timestamp case. `SND_SEQ_TIME_STAMP_TICK` is defined as `0` and `SND_SEQ_TIME_STAMP_REAL` as `1<<0` (same single bit), so the two are mutually exclusive. As written, `get_tick()` returns `None` for every tick-scheduled event (`schedule_tick`), silently discarding valid data, and returns `Some(garbage)` for every real-time-scheduled event, because it reads the `.tick` union field of `self.0.time` while the union was actually populated as `.time` (a `timespec`-like struct), not as a plain `u32` tick count.","fix":"Invert the condition in `get_tick()` to check for tick mode, e.g. `if !self.has_flag(alsa::SND_SEQ_TIME_STAMP_REAL) { let d = self.0.time; let t = unsafe { &d.tick }; Some(*t) } else { None }`, mirroring the correct logic already used in `get_time()`.","locations":[{"ref":"src/seq.rs:829-843","code":"  829 |     pub fn get_time(&self) -> Option<time::Duration> {\n  830 |         if self.has_flag(alsa::SND_SEQ_TIME_STAMP_REAL) {\n  831 |             let d = self.0.time;\n  832 |             let t = unsafe { &d.time };\n  833 |             Some(time::Duration::new(t.tv_sec as u64, t.tv_nsec as u32))\n  834 |         } else { None }\n  835 |     }\n  836 | \n  837 |     pub fn get_tick(&self) -> Option<u32> {\n  838 |         if self.has_flag(alsa::SND_SEQ_TIME_STAMP_REAL) {\n  839 |             let d = self.0.time;\n  840 |             let t = unsafe { &d.tick };\n  841 |             Some(*t)\n  842 |         } else { None }\n  843 |     }","lines":15,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/seq.rs#L829-L843"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`card::Iter::next` (`src/card.rs:23-30`) yields `Some(Err(e))` on failure but never advances or invalidates `self.0` in that branch. `snd_card_next` typically leaves the out-parameter untouched on error, so if a caller enumerates cards with proper error handling (e.g. `for r in Iter::new() { match r { Ok(c) => ..., Err(e) => { log(e); continue } } }` instead of `.unwrap()`-ing), a persistent failure (e.g. `/proc/asound` unreadable) causes `next()` to return the identical `Err` forever, hanging the loop indefinitely. Compare with `ctl_int::DeviceIter::next` (`src/ctl_int.rs:37-43`), which returns `None` (stopping iteration) on the analogous `Err(_)` case.","fix":"On `Err`, either stop the iteration (return `None` after yielding the error once, e.g. by storing a 'done' flag) or otherwise guarantee forward progress so a persistent backend failure can't loop forever, consistent with how `DeviceIter` already handles it.","locations":[{"ref":"src/card.rs:20-30","code":"   20 | impl Iterator for Iter {\n   21 |     type Item = Result<Card>;\n   22 | \n   23 |     fn next(&mut self) -> Option<Result<Card>> {\n   24 |         match acheck!(snd_card_next(&mut self.0)) {\n   25 |             Ok(_) if self.0 == -1 => None,\n   26 |             Ok(_) => Some(Ok(Card(self.0))),\n   27 |             Err(e) => Some(Err(e)),\n   28 |         }\n   29 |     }\n   30 | }","lines":11,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/card.rs#L20-L30"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `pcm::IO::mmap`, the closure's returned frame count `fres` is only bounds-checked with `debug_assert!(fres <= f as usize)`, which is compiled out entirely in release builds. If a caller's closure returns a value larger than the number of frames actually made available by `snd_pcm_mmap_begin`, `snd_pcm_mmap_commit` is called with that inflated `fres`, telling ALSA more frames were written/read than actually were, in release builds with no protection at all. This can desync the ring buffer's appl pointer from the code's own bookkeeping and result in the mmap I/O never producing an error while silently misreporting the transferred frame count.","fix":"Replace the `debug_assert!` with a real runtime check that returns an error (or clamps `fres` to `f`) in all build profiles, e.g. `if fres > f as usize { return Err(Error::unsupported(\"snd_pcm_mmap_begin\")); }` before calling `snd_pcm_mmap_commit`.","locations":[{"ref":"src/pcm.rs:457-477","code":"  457 |     pub fn mmap<F: FnOnce(&mut [S]) -> usize>(&self, frames: usize, func: F) -> Result<usize> {\n  458 |         let mut f = frames as alsa::snd_pcm_uframes_t;\n  459 |         let mut offs: alsa::snd_pcm_uframes_t = 0;\n  460 |         let mut areas = ptr::null();\n  461 |         acheck!(snd_pcm_mmap_begin((self.0).0, &mut areas, &mut offs, &mut f))?;\n  462 | \n  463 |         let (first, step) = unsafe { ((*areas).first, (*areas).step) };\n  464 |         if first != 0 || step as isize != self.0.frames_to_bytes(1) * 8 {\n  465 |             unsafe { alsa::snd_pcm_mmap_commit((self.0).0, offs, 0) };\n  466 |             // let s = format!(\"Can only mmap a single interleaved buffer (first = {:?}, step = {:?})\", first, step);\n  467 |             return Err(Error::unsupported(\"snd_pcm_mmap_begin\"));\n  468 |         }\n  469 | \n  470 |         let buf = unsafe {\n  471 |             let p = ((*areas).addr as *mut S).add(self.from_frames(offs));\n  472 |             ::core::slice::from_raw_parts_mut(p, self.from_frames(f))\n  473 |         };\n  474 |         let fres = func(buf);\n  475 |         debug_assert!(fres <= f as usize);\n  476 |         acheck!(snd_pcm_mmap_commit((self.0).0, offs, fres as alsa::snd_pcm_uframes_t)).map(|r| r as usize)\n  477 |     }","lines":21,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L457-L477"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`ElemValue::set_integer64` (`src/ctl_int.rs:274-277`) checks `self.etype != ElemType::Integer` instead of `ElemType::Integer64` (compare with the correctly-written `get_integer64` right above it at `src/ctl_int.rs:269-272`, which does check `Integer64`). As written, calling `set_integer64` on a genuinely `Integer64` element always returns `None` (silently rejecting a valid call), while calling it on an `Integer`-typed element passes the type check and invokes `snd_ctl_elem_value_set_integer64` on data of the wrong ALSA element type, corrupting/misinterpreting the control value.","fix":"Change the guard to `self.etype != ElemType::Integer64`:\n```rust\npub fn set_integer64(&mut self, idx: u32, val: i64) -> Option<()> {\n    if self.etype != ElemType::Integer64 || idx >= self.count { None }\n    else { unsafe { alsa::snd_ctl_ n  497 |     }\n  498 |     fn flush(&mut self) -> std::io::Result<()> { Ok(()) }\n  499 | }","lines":10,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L490-L499"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"Both the `std::io::Read` and `std::io::Write` impls for `rawmidi::IO` build `std::io::Error::from_raw_os_error(r as i32)` from the *negative* return value of `snd_rawmidi_read`/`snd_rawmidi_write` without negating it. Every other place in the crate that performs this conversion (e.g. `pcm::IO`'s `Read` impl, the `acheck!` macro in `error.rs`) negates the raw return code first. As written, any I/O error on a `Rawmidi` handle used through `std::io::Read`/`Write` produces an `io::Error` with the wrong (negative) OS error code, so `ErrorKind` and error messages will be wrong or `Other`.","fix":"Negate `r` in both impls, e.g. `Err(std::io::Error::from_raw_os_error(-r as i32))`, matching the correct pattern used by `pcm::IO`'s `Read` impl.","locations":[{"ref":"src/rawmidi.rs:303-309","code":"  303 | impl<'a> std::io::Read for IO<'a> {\n  304 |     fn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {\n  305 |         let r = unsafe { alsa::snd_rawmidi_read((self.0).0, buf.as_mut_ptr() as *mut c_void, buf.len() as size_t) };\n  306 |         if r < 0 { Err(std::io::Error::from_raw_os_error(r as i32)) }\n  307 |         else { Ok(r as usize) }\n  308 |     }\n  309 | }","lines":7,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/rawmidi.rs#L303-L309"},{"ref":"src/rawmidi.rs:311-319","code":"  311 | #[cfg(feature = \"std\")]\n  312 | impl<'a> std::io::Write for IO<'a> {\n  313 |     fn write(&mut self, buf: &[u8]) -> std::io::Result<usize> {\n  314 |         let r = unsafe { alsa::snd_rawmidi_write((self.0).0, buf.as_ptr() as *const c_void, buf.len() as size_t) };\n  315 |         if r < 0 { Err(std::io::Error::from_raw_os_error(r as i32)) }\n  316 |         else { Ok(r as usize) }\n  317 |     }\n  318 |     fn flush(&mut self) -> std::io::Result<()> { Ok(()) }\n  319 | }","lines":9,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/rawmidi.rs#L311-L319"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`ClientIter::next`, `PortIter::next`, and `PortSubscribeIter::next` in `src/seq.rs` treat *any* negative return from `snd_seq_query_next_client`/`snd_seq_query_next_port`/`snd_seq_query_port_subscribers` as \"iteration finished\" and silently return `None`, discarding the actual error code. A transient failure (e.g. `ENOMEM`, `EBADFD`) is therefore indistinguishable from a normal end-of-iteration and is never surfaced to the caller. `rawmidi::Iter::next` (same file family) handles this correctly by only treating `ENOTTY` as end-of-iteration and propagating other errors as `Some(Err(e))`.","fix":"Change these iterators' `Item` to `Result<ClientInfo>`/`Result<PortInfo>`/`Result<PortSubscribe>` (like `rawmidi::Iter` already does), and only stop iteration on the specific \"no more items\" errno while returning `Some(Err(e))` for any other error, e.g.:\n```rust\nlet r = unsafe { alsa::snd_seq_query_next_client((self.0).0, z.0) };\nif r < 0 {\n    self.1 = -1;\n    return None; // or Some(Err(Error::new(\"snd_seq_query_next_client\", -r))) for real errors\n}\n```","locations":[{"ref":"src/seq.rs:300-310","code":"  300 | impl<'a> Iterator for ClientIter<'a> {\n  301 |     type Item = ClientInfo;\n  302 |     fn next(&mut self) -> Option<Self::Item> {\n  303 |         let z = ClientInfo::new().unwrap();\n  304 |         z.set_client(self.1);\n  305 |         let r = unsafe { alsa::snd_seq_query_next_client((self.0).0, z.0) };\n  306 |         if r < 0 { self.1 = -1; return None };\n  307 |         se          }\n  667 |         };\n  668 |         vtr.set_queue(query.get_queue());\n  669 |         vtr.set_exclusive(query.get_exclusive());\n  670 |         vtr.set_time_update(query.get_time_update());\n  671 |         vtr.set_time_real(query.get_time_real());\n  672 | \n  673 |         Some(vtr)\n  674 |     }\n  675 | }","lines":36,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/seq.rs#L640-L675"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`Ump::open` in `src/ump.rs` stores the result of `snd_ump_rawmidi(h)` directly into the embedded `Rawmidi(...)` field without checking it for null: `Ump(h, Rawmidi(unsafe { snd_ump_rawmidi(h) }))`. Elsewhere in the crate (e.g. `PCM::get_chmap`) a null pointer returned from an ALSA accessor is explicitly checked and turned into an `Error`. If `snd_ump_rawmidi` ever returns null (e.g. on an unusual/failed UMP handle), the embedded `Rawmidi` ends up wrapping a null `*mut snd_rawmidi_t`; any subsequent call through `Ump::rawmidi()` (e.g. `.read()`, `.info()`, `.write()`) passes that null pointer straight into libasound, which is likely to dereference it and crash.","fix":"Check the pointer returned by `snd_ump_rawmidi(h)` for null and return an `Error` from `Ump::open` in that case, instead of unconditionally wrapping it, e.g.:\n```rust\nlet rh = unsafe { snd_ump_rawmidi(h) };\nif rh.is_null() { return Err(Error::unsupported(\"snd_ump_rawmidi\")); }\n.map(|_| Ump(h, Rawmidi(rh)))\n```","locations":[{"ref":"src/ump.rs:39-57","code":"   39 |     pub fn open(name: &CStr, dir: Direction, nonblock: bool) -> Result<Ump> {\n   40 |         let mut h = ptr::null_mut();\n   41 |         let flags = if nonblock { 2 } else { 0 }; // FIXME: alsa::SND_RAWMIDI_NONBLOCK does not exist in alsa-sys\n   42 |         acheck!(snd_ump_open(\n   43 |             if dir == Direction::Capture {\n   44 |                 &mut h\n   45 | c1a9f57b71df/src/ctl_int.rs#L393-L413"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`PCM::verify_format` and `IO::mmap` each contain a commented-out `let s = format!(...)` line left over from a previous version of the error message (now replaced by `Error::unsupported(...)` without the formatted string). Dead, commented-out code adds noise and can mislead future maintainers into thinking the string is still used somewhere.","fix":"Delete the leftover commented-out `let s = format!(...)` lines; they are unused and the surrounding `Error::unsupported(...)` calls are self-explanatory without them.","locations":[{"ref":"src/pcm.rs:228","code":"  228 |             // let s = format!(\"Invalid sample format ({:?}, expected {:?})\", ff, f);","lines":1,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L228"},{"ref":"src/pcm.rs:466","code":"  466 |             // let s = format!(\"Can only mmap a single interleaved buffer (first = {:?}, step = {:?})\", first, step);","lines":1,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/pcm.rs#L466"}]},{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The `poll::Descriptors` implementation (`count`/`fill`/`revents`) is copy-pasted verbatim (modulo the `snd_*_poll_descriptors*` function names) across `Ctl` (`src/ctl_int.rs:147-160`), `HCtl` (`src/hctl.rs:93-106`) and `Mixer` (`src/mixer.rs:78-91`). Beyond the maintenance cost, this kind of triplicated boilerplate is exactly the pattern that let the `set_integer64`-style copy/paste bug slip in elsewhere in this crate: any future fix or safety improvement (e.g. bounds-checking `p.len()` against the `c_uint` cast) has to be remembered and applied three separate times.","fix":"Factor the shared logic into a helper macro or generic free function parameterized over the three `snd_*_poll_descriptors*` FFI calls, and have `Ctl`, `HCtl` and `Mixer` delegate to it.","locations":[{"ref":"src/ctl_int.rs:147-160","code":"  147 | impl poll::Descriptors for Ctl {\n  148 |     fn count(&self) -> usize {\n  149 |         unsafe { alsa::snd_ctl_poll_descriptors_count(self.0) as usize }\n  150 |     }\n  151 |     fn fill(&self, p: &mut [pollfd]) -> Result<usize> {\n  152 |         let z = unsafe { alsa::snd_ctl_poll_descriptors(self.0, p.as_mut_ptr(), p.len() as c_uint) };\n  153 |         from_code(\"snd_ctl_poll_descriptors\", z).map(|_| z as usize)\n  154 |     }\n  155 |     fn revents(&self, p: &[pollfd]) -> Result<poll::Flags> {\n  156 |         let mut r = 0;\n  157 |         let z = unsafe { alsa::snd_ctl_poll_descriptors_revents(self.0, p.as_ptr() as *mut pollfd, p.len() as c_uint, &mut r) };\n  158 |         from_code(\"snd_ctl_poll_descriptors_revents\", z).map(|_| poll::Flags::from_bits_truncate(r as c_short))\n  159 |     }\n  160 | }","lines":14,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/ctl_int.rs#L147-L160"},{"ref":"src/hctl.rs:93-106","code":"   93 | impl poll::Descriptors for HCtl {\n   94 |     fn count(&self) -> usize {\n   95 |         unsafe { alsa::snd_hctl_poll_descriptors_count(self.0) as usize }\n   96 |     }\n   97 |     fn fill(&self, p: &mut [pollfd]) -> Result<usize> {\n   98 |         let z = unsafe { alsa::snd_hctl_poll_descriptors(self.0, p.as_mut_ptr(), p.len() as c_uint) };\n   99 |         from_code(\"snd_hctl_poll_descriptors\", z).map(|_| z as usize)\n  100 |     }\n  101 |     fn revents(&self, p: &[pollfd]) -> Result<poll::Flags> {\n  102 |         let mut r = 0;\n  103 |         let z = unsafe { alsa::snd_hctl_poll_descriptors_revents(self.0, p.as_ptr() as *mut pollfd, p.len() as c_uint, &mut r) };\n  104 |         from_code(\"snd_hctl_poll_descriptors_revents\", z).map(|_| poll::Flags::from_bits_truncate(r as c_short))\n  105 | : Direction, nonblock: bool) -> Result<Ump> {\n   40 |         let mut h = ptr::null_mut();\n   41 |         let flags = if nonblock { 2 } else { 0 }; // FIXME: alsa::SND_RAWMIDI_NONBLOCK does not exist in alsa-sys\n   42 |         acheck!(snd_ump_open(\n   43 |             if dir == Direction::Capture {\n   44 |                 &mut h\n   45 |             } else {\n   46 |                 ptr::null_mut()\n   47 |             },\n   48 |             if dir == Direction::Playback {\n   49 |                 &mut h\n   50 |             } else {\n   51 |                 ptr::null_mut()\n   52 |             },\n   53 |             name.as_ptr(),\n   54 |             flags\n   55 |         ))\n   56 |         .map(|_| Ump(h, Rawmidi(unsafe { snd_ump_rawmidi(h) })))\n   57 |     }","lines":19,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/ump.rs#L39-L57"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`direct::ffi::pagesize()` (`src/direct/ffi.rs:210-212`) casts the result of `libc::sysconf(libc::_SC_PAGESIZE)` directly `as usize` without checking for the `-1` error return that `sysconf` can produce. A `-1` would become `usize::MAX`, which then flows into `DriverMemory::new`'s page-rounding arithmetic (`src/direct/pcm.rs:222`) and would produce a nonsensical `total` size passed to `mmap` (in practice `mmap` would then fail cleanly, but the failure is indirect and the intermediate arithmetic is undefined-ish).","fix":"Check for `-1` from `sysconf` and fall back to a sane default page size (e.g. 4096) or propagate an error, instead of casting an error code straight to `usize`.","locations":[{"ref":"src/direct/ffi.rs:210-212","code":"  210 | pub fn pagesize() -> usize {\n  211 |     unsafe { libc::sysconf(libc::_SC_PAGESIZE) as usize }\n  212 | }","lines":3,"link":"https://github.com/diwic/alsa-rs/blob/d22195e3c503aebd3a445c544e83c1a9f57b71df/src/direct/ffi.rs#L2
