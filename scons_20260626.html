   def validator_icase(key, val, env):\n  109 |         \"\"\"Case-ignoring validator.\"\"\"\n  110 |         return _validator(key, val.lower(), env, allowed_values)","lines":3,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Variables/EnumVariable.py#L108-L110"},{"ref":"SCons/Variables/EnumVariable.py:55-65","code":"   55 | def _validator(key, val, env, vals) -> None:\n   56 |     \"\"\"Validate that val is in vals.\n   57 | \n   58 |     Usable as the base for :class:`EnumVariable` validators.\n   59 |     \"\"\"\n   60 |     if val not in vals:\n   61 |         msg = (\n   62 |             f\"Invalid value for enum variable {key!r}: {val!r}. \"\n   63 |             f\"Valid values are: {vals}\"\n   64 |         )\n   65 |         raise SCons.Errors.UserError(msg) from None","lines":11,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Variables/EnumVariable.py#L55-L65"}]},{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"PackageVariable._converter, when val is an enabling string and the default is itself an enable/disable string, returns True; otherwise returns the default. But the default returned here is the raw configured default (often a path string) regardless of whether substitution occurred, and when do_subst is False the bool branch stringifies a bool via str(val).lower(). The result is that an explicit 'yes' from the user is silently replaced by the default value, which is the documented behavior but surprising when default is, e.g., 'yes' vs a path; the special-casing on ENABLE_STRINGS+DISABLE_STRINGS membership is brittle (a default of literal 'search' is treated as 'enable' and collapses to True).","fix":"Document the precedence explicitly and consider distinguishing 'user said yes' from 'use default' rather than overloading membership in the enable/disable string sets.","locations":[{"ref":"SCons/Variables/Pac s = function_arg_separator.split(m.group(2))\n  653 |                     s = s(*args)\n  654 |             if not s:\n  655 |                 return None\n  656 |         return (t[0], s[0], s[1:-1])","lines":26,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/cpp.py#L631-L656"}]},{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"negligible","easy":false,"description":"_PathList.__init__ uses the builtin name `type` as a local variable (type = TYPE_OBJECT, etc.), shadowing the builtin within the loop. Harmless here but a latent footgun if the function is later edited to need the builtin type().","fix":"Rename the local variable (e.g. entry_type).","locations":[{"ref":"SCons/PathList.py:106-116","code":"  106 |         for p in pathlist:\n  107 |             try:\n  108 |                 found = '$' in p\n  109 |             except (AttributeError, TypeError):\n  110 |                 type = TYPE_OBJECT\n  111 |             else:\n  112 |                 if not found:\n  113 |                     type = TYPE_STRING_NO_SUBST\n  114 |                 else:\n  115 |                     type = TYPE_STRING_SUBST\n  116 |             pl.append((type, p))","lines":11,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/PathList.py#L106-L116"}]},{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"negligible","easy":false,"description":"AddPathIfNotExists sets `is_list = True` before checking the stored value's type; this is fine, but when the key exists and the path is already present, the function still rewrites env_dict[key] (re-joining the split string), which can normalize away the user's original separators/formatting unnecessarily. Cosmetic, but a needless write on the common no-op path.","fix":"Return early (skip the reassignment) when the path is already present.","locations":[{"ref":"SCons/Util/envs.py:259-272","code":"  259 |     try: o set the literal-prefix to ':' but assigns it to the misspelled key, so the colon prefix is silently lost and LIBLITERALPREFIX retains the inherited posix value ('') instead. os2.generate() has the same typo (value ''), leaving a stray bogus key.","fix":"Rename the key to 'LIBLITERALPREFIX' in both files (cygwin should set it to ':').","locations":[{"ref":"SCons/Platform/cygwin.py:52","code":"   52 |     env['LIBLITERAPPREFIX'] = ':'","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Platform/cygwin.py#L52"},{"ref":"SCons/Platform/os2.py:48","code":"   48 |     env['LIBLITERAPPREFIX'] = ''","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Platform/os2.py#L48"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","easy":false,"description":"gdc.py static-library command references the undefined construction variable $_DLINKLIBFLAGS. The sibling tools dmd.py and ldc.py both use $_DLIBFLAGS for the trailing library flags in DLIBCOM, and gdc itself defines $_DLIBFLAGS (line 111) but never $_DLINKLIBFLAGS. The undefined variable expands to empty, so library flags are silently dropped from the D static-lib command under gdc.","fix":"Change `$_DLINKLIBFLAGS` to `$_DLIBFLAGS` to match dmd.py:149 / ldc.py:125.","locations":[{"ref":"SCons/Tool/gdc.py:109","code":"  109 |     env['DLIBCOM'] = '$DLIB $_DLIBFLAGS {}$TARGET $SOURCES $_DLINKLIBFLAGS'.format('-c ' if env['PLATFORM'] == 'win32' else '')","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/gdc.py#L109"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","easy":false,"description":"gdc.py's ProgramAllAtOnce builder action uses $__DRPATH and $_DLIBDIRFLAGS, copied verbatim from dmd.py/ldc.py, but gdc never defines those variables. gdc defines the un-prefixed forms instead: $__RPATH, $_LIBDIRFLAGS, $_LIBFLAGS (used in its real DLINKCOM/SHDLINKCOM at lines 102/106). As a result the all-at-once Program build under gdc silently drops rpath and library-search-path flags (the undefined vars expand to empty). Note $_DLIBFLAGS *is* defined (line 111) so only the rpath and libdir flags are lost.","fix":"In the ProgramAllAtOnce action string use the variables gdc actually defines: $__RPATH, $_LIBDIRFLAGS, $_LIBFLAGS (matching DLINKCOM at line 102).","locations":[{"ref":"SCons/Tool/gdc.py:127-130","code":"  127 |     env['BUILDERS']['ProgramAllAtOnce'] = SCons.Builder.Builder(\n  128 |         action='$DC $_DINCFLAGS $_DVERFLAGS $_DDEBUGFLAGS $_DFLAGS -o $TARGET $DLINKFLAGS $__DRPATH $SOURCES $_DLIBDIRFLAGS $_DLIBFLAGS',\n  129 |         emitter=DCommon.allAtOnceEmitter,\n  130 |     )","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/gdc.py#L127-L130"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","easy":false,"description":"The binary tarbz2 and tarxz packagers call putintopackageroot BEFORE stripinstallbuilder, while their siblings targz.py and zip.py call stripinstallbuilder BEFORE putintopackageroot. stripinstallbuilder replaces installed-file targets with their original sources and records PACKAGING_INSTALL_LOCATION, which putintopackageroot then consumes to choose each file's location under the package root. With the order swapped, tarbz2/tarxz process the install targets (not the original sources) and lay files out before the install-location tag is available, producing different/incorrect package contents than the gz/zip variants.","fix":"Reorder to match targz.py:35-36 / zip.py:35-36: call stripinstallbuilder first, then putintopackageroot.","locations":[{"ref":"SCons/Tool/packaging/tarbz2.py:35-36","code":"   35 |     target, source = putintopackageroot(target, source, env, PACKAGEROOT)\n   36 |     target, source = stripinstallbuilder(target, source, env)","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/packaging/tarbz2.py#L35-L36"},{"ref":"SCons/Tool/packaging/tarxz.py:35-36","code":"   35 |     target, source = putintopackageroot(target, source, env, PACKAGEROOT)\n   36 |     target, source = stripinstallbuilder(target, source, env)","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/packaging/tarxz.py#L35-L36"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"medium","easy":true,"description":"makeacronyms_re is compiled from the pattern for \\makeglossaries, not \\makeacronyms. As a result the 'run_acronyms' decision (and the acronyms branch of the emitter, file_tests entry 'acronyms') is driven by the presence of \\makeglossaries in the source, never by \\makeacronyms. Documents that use \\makeacronyms but not \\makeglossaries will not get makeindex run for acronyms (.acn -> .acr), and documents with \\makeglossaries get a spurious acronyms run.","fix":"Change the pattern to r\"^[^%\\n]*\\\\makeacronyms\" (escape appropriately) so makeacronyms_re actually matches \\makeacronyms.","locations":[{"ref":"SCons/Tool/tex.py:99","code":"   99 | makeacronyms_re = re.compile(r\"^[^%\\n]*\\\\makeglossaries\", re.MULTILINE)","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/tex.py#L99"}]},{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":true,"description":"time_stats.enable(sys.stdout) is called twice in a row for the --debug=time branch. The duplicate call is harmless but clearly an unintended copy-paste.","fix":"Remove the duplicate time_stats.enable(sys.stdout) line.","locations":[{"ref":"SCons/Script/Main.py:762-763","code":"  762 |         time_stats.enable(sys.stdout)\n  763 |         time_stats.enable(sys.stdout)","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Script/Main.py#L762-L763"}]},{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":false,"description":"In subst_dict() the SOURCE branch sets CHANGED_SOURCES/UNCHANGED_SOURCES to '$SOURCES', but the comment (copy-pasted from the TARGET branch) says 'We just let these expand to $TARGETS'. The comment is misleading about which variable is being produced.","fix":"Update the comment in the source branch to say '$SOURCES' instead of '$TARGETS'.","locations":[{"ref":"SCons/Subst.py:326-331","code":"  326 |         # This is a total cheat, but hopefully this dictionary goes\n  327 |         # away soon anyway.  We just let these expand to $TARGETS\n  328 |         # because that's \"good enough\" for the use of ToolSurrogates\n  329 |         # (see test/ToolSurrogate.py) to generate documentation.\n  330 |         dict['CHANGED_SOURCES'] = '$SOURCES'\n  331 |         dict['UNCHANGED_SOURCES'] = '$SOURCES'","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Subst.py#L326-L331"}]},{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"low","easy":false,"description":"Two diagnostics in the DB-dump path reference the module-global `args[0]` to name the file being processed, but Do_Call iterates over every file in `args` (`for a in args: Do_Call(a)`), so the label always points to the FIRST file rather than the one currently failing. When dumping multiple sconsign files the 'no dir' error and the dir location passed to printentries are misattributed.","fix":"Thread the current filename into Do_SConsignDB.__call__ / Do_SConsignDir and use it (e.g. `fname`/`name`) instead of `args[0]`.","locations":[{"ref":"SCons/Utilities/sconsign.py:317-325","code":"  317 |         if Print_Directories:\n  318 |             for dir in Print_Directories:\n  319 |                 try:\n  320 |                     val = db[dir]\n  321 |                 except KeyError:\n  322 |                     err = \"sconsign: no dir `%s' in `%s'\\n\" % (dir, args[0])\n  323 |                     sys.stderr.write(err)\n  324 |                 else:\n  325 |                     self.printentries(dir, val)","lines":9,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Utilities/sconsign.py#L317-L325"},{"ref":"SCons/Utilities/sconsign.py:354","code":"  354 |             printentries(sconsign.entries, args[0])","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Utilities/sconsign.py#L354"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","easy":false,"description":"In piped_spawn(), if spawnve() raises OSError with an errno that is not a key in exitvalmap, the inner `try: ret = exitvalmap[e.errno]` raises KeyError which is caught, but `ret` is then never assigned. Execution falls through to `return ret` at the end of the function, raising UnboundLocalError and masking the original spawn failure (and leaking the two temp files created earlier). The sibling function exec_spawn() handles exactly this case by setting `result = 127`; piped_spawn omits that assignment.","fix":"In the `except KeyError` branch (line 159-160), set `ret = 127` (mirroring exec_spawn), so a valid return value always exists.","locations":[{"ref":"SCons/Platform/win32.py:152-184","code":"  152 |     try:\n  153 |         args = [sh, '/C', escape(' '.join(args))]\n  154 |         ret = spawnve(os.P_WAIT, sh, args, env)\n  155 |     except OSError as e:\n  156 |         # catch any error\n  157 |         try:\n  158 |             ret = exitvalmap[e.errno]\n  159 |         except KeyError:\n  160 |             sys.stderr.write(\"scons: unknown OSError exception code %d - %s: %s\\n\" % (e.errno, cmd, e.strerror))\n  161 |         if stderr is not None:\n  162 |             stderr.write(\"scons: %s: %s\\n\" % (cmd, e.strerror))\n  163 | \n  164 |     # copy child output from tempfiles to our streams\n  165 |     # and do clean up stuff\n  166 |     if stdout is not None and not stdoutRedirected:\n  167 |         try:\n  168 |             with open(tmpFileStdoutName, \"rb\") as tmpFileStdout:\n  169 |                 output = tmpFileStdout.read()\n  170 |                 stdout.write(output.decode('oem', \"replace\").replace(\"\\r\\n\", \"\\n\"))\n  171 |             os.remove(tmpFileStdoutName)\n  172 |         except OSError:\n  173 |             pass\n  174 | \n  175 |     if stderr is not None and not stderrRedirected:\n  176 |         try:\n  177 |             with open(tmpFileStderrName, \"rb\") as tmpFileStderr:\n  178 |                 errors = tmpFileStderr.read()\n  179 |                 stderr.write(errors.decode('oem', \"replace\").replace(\"\\r\\n\", \"\\n\"))\n  180 |             os.remove(tmpFileStderrName)\n  181 |         except OSError:\n  182 |             pass\n  183 | \n  184 |     return ret","lines":33,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Platform/win32.py#L152-L184"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"CacheDir.copy_to_cache checks file writability with `if not st | stat.S_IWRITE:` where st is the mode bits from S_IMODE. `st | stat.S_IWRITE` is a bitwise OR which is always non-zero (S_IWRITE is 0o200), so `not (st | S_IWRITE)` is always False and the chmod-to-add-write-bit branch is never taken. The intended test was almost certainly `if not (st & stat.S_IWRITE):` (write bit not set). The result is the defensive chmod that the docstring promises never runs.","fix":"Use bitwise AND: `if not (st & stat.S_IWRITE): os.chmod(dst, st | stat.S_IWRITE)`.","locations":[{"ref":"SCons/CacheDir.py:305-310","code":"  305 |         try:\n  306 |             result = env.fs.copy2(src, dst)\n  307 |             st = stat.S_IMODE(os.stat(result).st_mode)\n  308 |             if not st | stat.S_IWRITE:\n  309 |                 os.chmod(dst, st | stat.S_IWRITE)\n  310 |             return result","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/CacheDir.py#L305-L310"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"Conftest._Have and CheckType open context.headerfilename in append mode and write without a context manager (f = open(...); f.write(...); f.close()). On any exception between open and close the file descriptor leaks. These run per-check during configure; repeated leaks across many checks can exhaust descriptors, and a partially written confdefs.h corrupts subsequent checks that include it.","fix":"Wrap each in `with open(context.headerfilename, 'a') as f: f.write(...)`.","locations":[{"ref":"SCons/Conftest.py:419-422","code":"  419 |     if ret and fallback and context.headerfilename:\n  420 |         f = open(context.headerfilename, \"a\")\n  421 |         f.write(\"typedef %s %s;\\n\" % (fallback, type_name))\n  422 |         f.close()","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Conftest.py#L419-L422"},{"ref":"SCons/Conftest.py:816-819","code":"  816 |     if context.headerfilename:\n  817 |         f = open(context.headerfilename, \"a\")\n  818 |         f.write(lines)\n  819 |         f.close()","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Conftest.py#L816-L819"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":true,"description":"File.push_to_cache() is annotated to return bool but returns None when self.nocache is true and when self.exists() is false (implicit None fall-through). Node.push_to_cache() returns False. Callers treating the result as a boolean get None rather than False; while falsy, this is inconsistent with the documented contract and the base class.","fix":"Return False in the nocache branch and add an explicit `return False` at the end of the method.","locations":[{"ref":"SCons/Node/FS.py:3001-3014","code":" 3001 |     def push_to_cache(self) -> bool:\n 3002 |         \"\"\"Try to push the node into a cache.\"\"\"\n 3003 |         # This should get called before the Nodes' .built() method is\n 3004 |         # called, which would clear the build signature if the file has\n 3005 |         # a source scanner.\n 3006 |         #\n 3007 |         # We have to clear the local memoized values *before* we push\n 3008 |         # the node to cache so that the memoization of the self.exists()\n 3009 |         # return value doesn't interfere.\n 3010 |         if self.nocache:\n 3011 |             return None\n 3012 |         self.clear_memoized_values()\n 3013 |         if self.exists():\n 3014 |             return self.get_build_env().get_CacheDir().push(self)","lines":14,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/FS.py#L3001-L3014"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"SConsign.DirFile.write writes to a temp file '.scons<pid>' and, on rename failure, falls back to copying. In the fallback path at line 414 it calls os.chmod(self.sconsign, mode), but `mode` is only assigned at line 393 inside the `if fname != self.sconsign:` block via os.stat(self.sconsign). If self.sconsign did not previously exist, the os.stat at line 393 raises OSError which is caught and passed, leaving `mode` unbound; then if the rename also fails and we reach line 414, `mode` is referenced while unbound -> NameError, masking the original I/O problem.","fix":"Initialize `mode` to a sane default (e.g. 0o666) before the try, or guard the os.chmod with a check that `mode` was successfully obtained.","locations":[{"ref":"SCons/SConsign.py:391-414","code":"  391 |         if fname != self.sconsign:\n  392 |             try:\n  393 |                 mode = os.stat(self.sconsign)[0]\n  394 |                 os.chmod(self.sconsign, 0o666)\n  395 |                 os.unlink(self.sconsign)\n  396 |             except OSError:\n  397 |                 # Try to carry on in the face of either OSError\n  398 |                 # (things like permission issues) or IOError (disk\n  399 |                 # or network issues).  If there's a really dangerous\n  400 |                 # issue, it should get re-raised by the calls below.\n  401 |                 pass\n  402 |             try:\n  403 |                 os.rename(fname, self.sconsign)\n  404 |             except OSError:\n  405 |                 # An OSError failure to rename may indicate something\n  406 |                 # like the directory has no write permission, but\n  407 |                 # the .sconsign file itself might still be writable,\n  408 |                 # so try writing on top of it directly.  An IOError\n  409 |                 # here, or in any of the following calls, would get\n  410 |                 # raised, indicating something like a potentially\n  411 |                 # serious disk or network issue.\n  412 |                 with open(self.sconsign, 'wb') as f, open(fname, 'rb') as f2:\n  413 |                     f.write(f2.read())\n  414 |                 os.chmod(self.sconsign, mode)","lines":24,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/SConsign.py#L391-L414"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":true,"description":"When NINJA_DEPFILE_PARSE_FORMAT has an invalid value, the error message reads `self.env['NINJA_DEPFILE_PARSE_FORMAT']` directly. But deps_format was computed via `.get(...)` with a default, so the key may not actually be present in env, raising a KeyError while constructing the error message and masking the real (clearer) message. Also the message text typo 'mvsc' should be 'msvc'.","fix":"Reference the already-computed `deps_format` variable in the exception message instead of re-reading env, and fix the 'mvsc' typo.","locations":[{"ref":"SCons/Tool/ninja_tool/NinjaState.py:380-388","code":"  380 |         deps_format = self.env.get(\"NINJA_DEPFILE_PARSE_FORMAT\", 'msvc' if self.env['PLATFORM'] == 'win32' else 'gcc')\n  381 |         for rule in [\"CC\", \"CXX\"]:\n  382 |             if deps_format == \"msvc\":\n  383 |                 self.rules[rule][\"deps\"] = \"msvc\"\n  384 |             elif deps_format == \"gcc\" or deps_format == \"clang\":\n  385 |                 self.rules[rule][\"deps\"] = \"gcc\"\n  386 |                 self.rules[rule][\"depfile\"] = \"$out.d\"\n  387 |             else:\n  388 |                 raise Exception(f\"Unknown 'NINJA_DEPFILE_PARSE_FORMAT'={self.env['NINJA_DEPFILE_PARSE_FORMAT']}, use 'mvsc', 'gcc', or 'clang'.\")","lines":9,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/NinjaState.py#L380-L388"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"_update_pot_file opens the target with the bare builtin open() and manual f.write()/f.close() without a context manager. If write() raises (disk full, encoding error) the file handle leaks and a partially written/corrupt .pot file is left behind. Surrounding code elsewhere in the toolset consistently uses `with open(...)`.","fix":"Use `with open(str(target[0]), 'w') as f: f.write(new_content)` so the handle is always closed and write errors propagate cleanly.","locations":[{"ref":"SCons/Tool/xgettext.py:151-154","code":"  151 |         f = open(str(target[0]), \"w\")\n  152 |         f.write(new_content)\n  153 |         f.close()\n  154 |         return 0","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/xgettext.py#L151-L154"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"scons_subproc_run builds the failure argline with `' '.join(*args)` (unpacking args). subprocess.run is normally called with a single positional command (a list or string). If that command is a string, `' '.join(*'somestr')` joins its characters; if args has more than one positional, join() raises TypeError. The synthesized error path is fragile and can itself raise.","fix":"Use `argline = ' '.join(args[0]) if args and is_List(args[0]) else (args[0] if args else '')`, or just `str(args[0])`, instead of `' '.join(*args)`.","locations":[{"ref":"SCons/Action.py:904-908","code":"  904 |         except OSError as exc:\n  905 |             argline = ' '.join(*args)\n  906 |             cp = subprocess.CompletedProcess(\n  907 |                 args=argline, returncode=1, stdout=\"\", stderr=\"\"\n  908 |             )","lines":5,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Action.py#L904-L908"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"FunctionAction.__init__ sets self.gc = execfunction.get_contents when _callable_contents raises AttributeError, but never sets self.funccontents in that branch. If get_contents later raises AttributeError at signature time, get_presig falls back to self.funccontents which was never assigned, raising AttributeError. The init-time try only guards _callable_contents; the get_contents probe lives in the except and leaves the object in a partially-initialized state for the gc-but-no-funccontents case.","fix":"Initialize self.funccontents to a sensible default (e.g. _object_contents(execfunction)) even when self.gc is set, or make get_presig handle a missing funccontents attribute.","locations":[{"ref":"SCons/Action.py:1364-1373","code":" 1364 |         self.execfunction = execfunction\n 1365 |         try:\n 1366 |             self.funccontents = _callable_contents(execfunction)\n 1367 |         except AttributeError:\n 1368 |             try:\n 1369 |                 # See if execfunction will do the heavy lifting for us.\n 1370 |                 self.gc = execfunction.get_contents\n 1371 |             except AttributeError:\n 1372 |                 # This is weird, just do the best we can.\n 1373 |                 self.funccontents = _object_contents(execfunction)","lines":10,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Action.py#L1364-L1373"},{"ref":"SCons/Action.py:1462-1467","code":" 1462 |     def get_presig(self, target, source, env, executor: Executor | None = None):\n 1463 |         \"\"\"Return the signature contents of this callable action.\"\"\"\n 1464 |         try:\n 1465 |             return self.gc(target, source, env)\n 1466 |         except AttributeError:\n 1467 |             return self.funccontents","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Action.py#L1462-L1467"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"SConf._createConfigH and _createSource open the target file with a bare open(...,'w') and rely on t.close()/fd.close() at the end. If source[0].get_contents()/decode() or the write raises, the file handle leaks (not closed) and a truncated target file is left on disk. These are action functions invoked during the build; an exception mid-write leaves a zero/partial config header that may later be treated as up to date.","fix":"Use `with open(str(target[0]), 'w') as t:` context managers so the handle is always closed; consider writing to a temp file and renaming for atomicity.","locations":[{"ref":"SCons/SConf.py:107-118","code":"  107 | def _createConfigH(target, source, env) -> None:\n  108 |     t = open(str(target[0]), \"w\")\n  109 |     defname = re.sub('[^A-Za-z0-9_]', '_', str(target[0]).upper())\n  110 |     t.write(\"\"\"#ifndef %(DEFNAME)s_SEEN\n  111 | #define %(DEFNAME)s_SEEN\n  112 | \n  113 | \"\"\" % {'DEFNAME' : defname})\n  114 |     t.write(source[0].get_contents().decode())\n  115 |     t.write(\"\"\"\n  116 | #endif /* %(DEFNAME)s_SEEN */\n  117 | \"\"\" % {'DEFNAME' : defname})\n  118 |     t.close()","lines":12,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/SConf.py#L107-L118"},{"ref":"SCons/SConf.py:167-170","code":"  167 | def _createSource(target, source, env) -> None:\n  168 |     fd = open(str(target[0]), \"w\")\n  169 |     fd.write(source[0].get_contents().decode())\n  170 |     fd.close()","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/SConf.py#L167-L170"}]},{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"SConf.SConfBase.__init__ defines force_build with a try/except that catches every Exception only to re-raise it unchanged (`except Exception as e: raise e`). This is a no-op that loses the original traceback chain (re-raising via `raise e` rather than bare `raise`) and serves no purpose.","fix":"Remove the try/except entirely (just call env_decider then return True), or if logging is intended, use bare `raise`.","locations":[{"ref":"SCons/SConf.py:434-441","code":"  434 |             def force_build(dependency, target, prev_ni,\n  435 |                             repo_node=None,\n  436 |                             env_decider=env.decide_source) -> bool:\n  437 |                 try:\n  438 |                     env_decider(dependency, target, prev_ni, repo_node)\n  439 |                 except Exception as e:\n  440 |                     raise e\n  441 |                 return True","lines":8,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/SConf.py#L434-L441"}]},{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"SConsign.DB.__init__ catches a corrupt pickle by warning, but the loop that follows (`for key, entry in self.entries.items(): entry.convert_from_sconsign(...)`) runs against whatever self.entries currently holds. If pickle.loads succeeded but returned a non-dict, the code sets self.entries={} then raises TypeError which is caught and warned - fine. But if pickle.loads raises and is caught, self.entries retains its prior value (the empty {} from Base.__init__), so the subsequent convert loop is harmless. The genuinely fragile part: on the non-dict path self.entries is reset to {} and TypeError raised, but the convert_from_sconsign loop is OUTSIDE the try/except, so after a caught corruption self.entries is still {} and iteration is empty - acceptable. The real smell is that the convert loop sits at the same indent as the try and runs unconditionally; if a partially-corrupt dict deserialized with entries lacking convert_from_sconsign it would raise uncaught.","fix":"Move the convert_from_sconsign loop inside the try/else so it only runs on a clean load, and guard against entries that are not proper SConsignEntry objects.","locations":[{"ref":"SCons/SConsign.py:259-275","code":"  259 |         try:\n  260 |             rawentries = db[path]\n  261 |         except KeyError:\n  262 |             pass\n  263 |         else:\n  264 |             try:\n  265 |                 self.entries = pickle.loads(rawentries)\n  266 |                 if not isinstance(self.entries, dict):\n  267 |                     self.entries = {}\n  268 |                     raise TypeError\n  269 |             except KeyboardInterrupt:\n  270 |                 raise\n  271 |             except Exception as e:\n  272 |                 SCons.Warnings.warn(SCons.Warnings.CorruptSConsignWarning,\n  273 |                                     \"Ignoring corrupt sconsign entry : %s (%s)\\n\"%(self.dir.get_tpath(), e))\n  274 |             for key, entry in self.entries.items():\n  275 |                 entry.convert_from_sconsign(dir, key)","lines":17,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/SConsign.py#L259-L275"}]},{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"DebugOptions builds an error message string with an f-string referencing the file path but the raised UserError message text does not actually interpolate the OSError; more importantly the variable 'e' (the caught OSError) is captured but never used in the message, losing the underlying cause. The 'with open(...) as js: pass' also leaves an empty file behind on success as a side effect of the existence probe.","fix":"Include the original exception in the message (raise ... from e and mention str(e)); consider not leaving a zero-byte probe file, or document that it is intentional.","locations":[{"ref":"SCons/Script/Main.py:580-587","code":"  580 |         try:\n  581 |             if not os.path.isdir(json_dir):\n  582 |                 os.makedirs(json_dir, exist_ok=True)\n  583 |             # Now try to open file and see if you can..\n  584 |             with open(SCons.Util.stats.JSON_OUTPUT_FILE,'w') as js:\n  585 |                 pass\n  586 |         except OSError as e:\n  587 |             raise SCons.Errors.UserError(f\"Unable to create directory for JSON debug output file: {SCons.Util.stats.JSON_OUTPUT_FILE}\")","lines":8,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Script/Main.py#L580-L587"}]},{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In SConsValues.set_option, the num_jobs/max_drift/stack_size/chunksize branches catch ValueError and re-raise UserError, but they do not catch TypeError. SetOption('num_jobs', None) (or any non-stringifiable/non-numeric type) raises TypeError from int(None), which escapes as an uncaught TypeError rather than the intended UserError. Same for int() on unsupported types in the other numeric branches.","fix":"Catch (ValueError, TypeError) in these numeric coercion branches.","locations":[{"ref":"SCons/Script/SConsOptions.py:167-216","code":"  167 |         if name == 'num_jobs':\n  168 |             try:\n  169 |                 value = int(value)\n  170 |                 if value < 1:\n  171 |                     raise ValueError\n  172 |             except ValueError:\n  173 |                 raise SCons.Errors.UserError(\"A positive integer is required: %s\" % repr(value))\n  174 |         elif name == 'max_drift':\n  175 |             try:\n  176 |                 value = int(value)\n  177 |             except ValueError:\n  178 |                 raise SCons.Errors.UserError(\n  179 |                     \"An integer is required: %s\" % repr(value))\n  180 |         elif name == 'duplicate':\n  181 |             try:\n  182 |                 value = str(value)\n  183 |             except ValueError:\n  184 |                 raise SCons.Errors.UserError(\n  185 |                     \"A string is required: %s\" % repr(value))\n  186 |             if value not in SCons.Node.FS.Valid_Duplicates:\n  187 |                 raise SCons.Errors.UserError(\n  188 |                     \"Not a valid duplication style: %s\" % value\n  189 |                 )\n  190 |             # Set the duplicate style right away so it can affect linking\n  191 |             # of SConscript files.\n  192 |             SCons.Node.FS.set_duplicate(value)\n  193 |         elif name == 'diskcheck':\n  194 |             try:\n  195 |                 value = diskcheck_convert(value)\n  196 |             except ValueError as v:\n  197 |                 raise SCons.Errors.UserError(\n  198 |                     \"Not a valid diskcheck value: %s\" % v)\n  199 |             if 'diskcheck' not in self.__dict__:\n  200 |                 # No --diskcheck= option was specified on the command line.\n  201 |                 # Set this right away so it can affect the rest of the\n  202 |                 # file/Node lookups while processing the SConscript files.\n  203 |                 SCons.Node.FS.set_diskcheck(value)\n  204 |         elif name == 'stack_size':\n  205 |             try:\n  206 |                 value = int(value)\n  207 |             except ValueError:\n  208 |                 raise SCons.Errors.UserError(\n  209 |                     \"An integer is required: %s\" % repr(value))\n  210 |         elif name in ('md5_chunksize', 'hash_chunksize'):\n  211 |             try:\n  212 |                 value = int(value)\n  213 |             except ValueError:\n  214 |                 raise SCons.Errors.UserError(\n  215 |                     \"An integer is required: %s\" % repr(value))\n  216 |             name = 'md5_chunksize'  # for now, the old name is used","lines":50,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Script/SConsOptions.py#L167-L216"}]},{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In Taskmaster.next_task(), if task.make_ready() raises, the exception is captured into self.ready_exc and the except block falls through. However the bare `except Exception as e:` binds `e` but never uses it, and there is no re-check that `task` is in a sane state. More importantly, the captured sys.exc_info() is stored but the original `e` is discarded; combined with `self.ready_exc` possibly already being None this is fine, but the unused `as e` and the comment referencing VariantDir suggest intent that is not enforced. Minor: the `as e` is dead.","fix":"Drop the unused `as e` binding; the logic is otherwise intentional.","locations":[{"ref":"SCons/Taskmaster/__init__.py:1034-1046","code":" 1034 |         try:\n 1035 |             task.make_ready()\n 1036 |         except Exception as e :\n 1037 |             # We had a problem just trying to get this task ready (like\n 1038 |             # a child couldn't be linked to a VariantDir when deciding\n 1039 |             # whether this node is current).  Arrange to raise the\n 1040 |             # exception when the Task is \"executed.\"\n 1041 |             self.ready_exc = sys.exc_info()\n 1042 | \n 1043 |         if self.ready_exc:\n 1044 |             task.exception_set(self.ready_exc)\n 1045 | \n 1046 |         self.ready_exc = None","lines":13,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Taskmaster/__init__.py#L1034-L1046"}]},{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"_msvc_version_pdir_registry_winsdk indexes vc_qresults[0] guarded by a truthiness check, which is safe, but the surrounding flow reads registry results positionally (record[0]) and silently takes the first match across HKLM/HKCU Wow6432Node/native ordering. If multiple registry hives return differing product directories the first wins with no warning; combined with normcase/normpath comparison this can misclassify a genuine VC install as a winsdk-only install (is_sdk) when the VS7 key happens to be absent in the same hive that supplied the VC7 path. Edge case, but it silently changes detected 'kind'.","fix":"Compare/aggregate VS7 and VC7 results from the same registry hive (carry the key/hive alongside the path) rather than collapsing each query to its first global match.","locations":[{"ref":"SCons/Tool/MSCommon/MSVC/Kind.py:470-504","code":"  470 |     else:\n  471 | \n  472 |         vc_dir = os.path.normcase(os.path.normpath(pdir))\n  473 | \n  474 |         vc_suffix = Registry.vstudio_sxs_vc7(msvc_version)\n  475 |         vc_qresults = [record[0] for record in Registry.microsoft_query_paths(vc_suffix)]\n  476 |         vc_root = os.path.normcase(os.path.normpath(vc_qresults[0])) if vc_qresults else None\n  477 | \n  478 |         if vc_dir != vc_root:\n  479 |             # registry vc path is not the current pdir\n  480 | \n  481 |             is_sdk = False\n  482 | \n  483 |             debug(\n  484 |                 'is_sdk=%s, msvc_version=%s, pdir=%s, vc_root=%s',\n  485 |                 is_sdk, repr(msvc_version), repr(vc_dir), repr(vc_root)\n  486 |             )\n  487 | \n  488 |         else:\n  489 |             # registry vc path is the current pdir\n  490 | \n  491 |             vs_suffix = Registry.vstudio_sxs_vs7(msvc_version)\n  492 |             vs_qresults = [record[0] for record in Registry.microsoft_query_paths(vs_suffix)]\n  493 |             vs_root = vs_qresults[0] if vs_qresults else None\n  494 | \n  495 |             is_sdk = bool(not vs_root and vc_root)\n  496 | \n  497 |             debug(\n  498 |                 'is_sdk=%s, msvc_version=%s, vs_root=%s, vc_root=%s',\n  499 |                 is_sdk, repr(msvc_version), repr(vs_root), repr(vc_root)\n  500 |             )\n  501 | \n  502 |     _cache_pdir_registry_winsdk[cache_key] = is_sdk\n  503 | \n  504 |     return is_sdk","lines":35,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/MSCommon/MSVC/Kind.py#L470-L504"}]},{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"ArchDefinition.__init__ uses a mutable default argument (synonyms=[]). The SupportedArchitectureList construction passes explicit lists so no aliasing bug manifests today, but a future call ArchDefinition('foo') followed by appending to self.synonyms would mutate the shared default list for all such instances. This is a classic Python footgun.","fix":"Use synonyms=None and assign self.synonyms = synonyms if synonyms is not None else [].","locations":[{"ref":"SCons/Tool/MSCommon/arch.py:33-35","code":"   33 |     def __init__(self, arch, synonyms=[]) -> None:\n   34 |         self.arch = arch\n   35 |         self.synonyms = synonyms","lines":3,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/MSCommon/arch.py#L33-L35"}]},{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":true,"description":"copyFuncVersionedLib removes a pre-existing destination with a bare `except:` that swallows every exception (including KeyboardInterrupt/SystemExit). A genuine failure to remove (e.g. permission denied) is silently ignored, and the subsequent copy2 then fails with a less clear error.","fix":"Narrow to `except OSError: pass` (or `except FileNotFoundError`), so unrelated/critical exceptions propagate.","locations":[{"ref":"SCons/Tool/install.py:202-205","code":"  202 |         try:\n  203 |             os.remove(dest)\n  204 |         except:\n  205 |             pass","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/install.py#L202-L205"}]},{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"is_win64 reads os.environ['PROCESSOR_ARCHITECTURE'] via direct subscript at import time. It is guarded by `is_windows and`, and PROCESSOR_ARCHITECTURE is normally set on Windows, but a Windows environment lacking that variable (e.g. a stripped service/CI environment) would raise KeyError on module import, aborting tool loading rather than degrading gracefully.","fix":"Use os.environ.get('PROCESSOR_ARCHITECTURE', '') == 'AMD64'.","locations":[{"ref":"SCons/Tool/intelc.py:41-43","code":"   41 | is_win64 = is_windows and (os.environ['PROCESSOR_ARCHITECTURE'] == 'AMD64' or\n   42 |                            ('PROCESSOR_ARCHITEW6432' in os.environ and\n   43 |                             os.environ['PROCESSOR_ARCHITEW6432'] == 'AMD64'))","lines":3,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/intelc.py#L41-L43"}]},{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"_DSPGenerator.__init__ handles the 'variant' construction var with if/elif (is_String / is_List) and no else. If 'variant' is present but is neither a string nor a list (e.g. a tuple or int), 'variants' is never assigned and the next use raises UnboundLocalError with no useful message. The same shape recurs in _UserGenerator.__init__. By contrast the buildtarget/outdir/runfile blocks all have a trailing else branch.","fix":"Add an else branch raising SCons.Errors.InternalError('variant must be a string or a list of strings'), matching the validation used elsewhere in the file.","locations":[{"ref":"SCons/Tool/msvs.py:462-468","code":"  462 |         if 'variant' not in env:\n  463 |             raise SCons.Errors.InternalError(\"You must specify a 'variant' argument (i.e. 'Debug' or \" +\\\n  464 |                   \"'Release') to create an MSVSProject.\")\n  465 |         elif SCons.Util.is_String(env['variant']):\n  466 |             variants = [env['variant']]\n  467 |         elif SCons.Util.is_List(env['variant']):\n  468 |             variants = env['variant']","lines":7,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/msvs.py#L462-L468"},{"ref":"SCons/Tool/msvs.py:234-240","code":"  234 |         if 'variant' not in env:\n  235 |             raise SCons.Errors.InternalError(\"You must specify a 'variant' argument (i.e. 'Debug' or \" +\\\n  236 |                   \"'Release') to create an MSVSProject.\")\n  237 |         elif SCons.Util.is_String(env['variant']):\n  238 |             variants = [env['variant']]\n  239 |         elif SCons.Util.is_List(env['variant']):\n  240 |             variants = env['variant']","lines":7,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/msvs.py#L234-L240"}]},{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"Several pickle-cache readers swallow all exceptions with bare 'except:' (or 'except Exception:') and silently 'return', discarding any corruption of the stored config/sources cache. Combined with pickle.loads on file contents this also silently ignores malformed data. Bare except is also flagged style across the codebase; here it can hide real bugs (e.g. AttributeError) during Parse.","fix":"Narrow the excepts to (pickle.UnpicklingError, EOFError, ValueError, binascii.Error) and keep re-raising KeyboardInterrupt; consider logging when cache parsing fails.","locations":[{"ref":"SCons/Tool/msvs.py:810-813","code":"  810 |         except KeyboardInterrupt:\n  811 |             raise\n  812 |         except Exception:\n  813 |             return # unable to unpickle any data for some reason","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/msvs.py#L810-L813"},{"ref":"SCons/Tool/msvs.py:831-834","code":"  831 |         except KeyboardInterrupt:\n  832 |             raise\n  833 |         except:\n  834 |             return # unable to unpickle any data for some reason","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/msvs.py#L831-L834"},{"ref":"SCons/Tool/msvs.py:1126-1129","code":" 1126 |         except KeyboardInterrupt:\n 1127 |             raise\n 1128 |         except:\n 1129 |             return # unable to unpickle any data for some reason","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/msvs.py#L1126-L1129"},{"ref":"SCons/Tool/msvs.py:1146-1149","code":" 1146 |         except KeyboardInterrupt:\n 1147 |             raise\n 1148 |         except:\n 1149 |             return # unable to unpickle any data for some reason","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/msvs.py#L1146-L1149"},{"ref":"SCons/Tool/msvs.py:1654-1657","code":" 1654 |         except KeyboardInterrupt:\n 1655 |             raise\n 1656 |         except:\n 1657 |             return # unable to unpickle any data for some reason","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/msvs.py#L1654-L1657"}]},{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In InternalLaTeXAuxAction the nomenclature and glossary branches deliberately do NOT return on a non-zero result (the `return result` lines are commented out at 400 and 412), while the makeindex and acronyms branches DO return on failure (381, 424). This inconsistency means a failing makeindex-for-glossary/nomenclature is reported via check_file_error_message but the build proceeds and may be reported as successful, whereas the analogous index/acronym failures abort. The asymmetry is undocumented and surprising.","fix":"Decide on consistent behavior across all makeindex variants (either all abort on failure or all continue with a clear warning) and document the rationale.","locations":[{"ref":"SCons/Tool/tex.py:396-412","code":"  396 |             result = MakeNclAction(nclfile, nclfile, env)\n  397 |             if result != 0:\n  398 |                 check_file_error_message('%s (nomenclature)' % env['MAKENCL'],\n  399 |                                          'nlg')\n  400 |                 #return result\n  401 | \n  402 |         # Now decide if latex will need to be run again due to glossary.\n  403 |         if check_content_hash(suffix_nodes['.glo'], '.glo') or (count == 1 and run_glossaries) or (count == 1 and run_glossary):\n  404 |             # We must run makeindex\n  405 |             if Verbose:\n  406 |                 print(\"Need to run makeindex for glossary\")\n  407 |             glofile = suffix_nodes['.glo']\n  408 |             result = MakeGlossaryAction(glofile, glofile, env)\n  409 |             if result != 0:\n  410 |                 check_file_error_message('%s (glossary)' % env['MAKEGLOSSARY'],\n  411 |                                          'glg')\n  412 |                 #return result","lines":17,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/tex.py#L396-L412"},{"ref":"SCons/Tool/tex.py:415-424","code":"  415 |         if check_content_hash(suffix_nodes['.acn'], '.acn') or (count == 1 and run_acronyms):\n  416 |             # We must run makeindex\n  417 |             if Verbose:\n  418 |                 print(\"Need to run makeindex for acronyms\")\n  419 |             acrfile = suffix_nodes['.acn']\n  420 |             result = MakeAcronymsAction(acrfile, acrfile, env)\n  421 |             if result != 0:\n  422 |                 check_file_error_message('%s (acronyms)' % env['MAKEACRONYMS'],\n  423 |                                          'alg')\n  424 |                 return result","lines":10,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/tex.py#L415-L424"}]},{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"exists() reads os.environ['PATH'] via direct subscript. If PATH is unset, this raises KeyError instead of cleanly reporting the WiX tools as not found. Also, exists() has the side effect of setting env['WIXCANDLE']/env['WIXLIGHT'] and mutating ENV PATH/WIXLIGHTFLAGS, which is surprising for a predicate.","fix":"Use os.environ.get('PATH', '').split(os.pathsep); consider moving the env-mutating side effects out of exists().","locations":[{"ref":"SCons/Tool/wix.py:70","code":"   70 |     for path in os.environ['PATH'].split(os.pathsep):","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/wix.py#L70"}]},{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"Bare `except:` clauses swallow all exceptions including KeyboardInterrupt and SystemExit. In xgettext.generate the detect failure is caught with bare except to fall back to 'xgettext'; in xgettext.exists a bare except returns False; in _update_pot_file a bare except re-raises (acceptable) but is still over-broad. These mask programming errors (e.g. the missing-import issue above would be silently turned into 'tool not found').","fix":"Catch specific exceptions: `except SCons.Errors.StopError:` for the detect fallbacks (matching how msginit/msgmerge/msgfmt already do it), and re-raise unexpected ones.","locations":[{"ref":"SCons/Tool/xgettext.py:277-278","code":"  277 |     except:\n  278 |         env['XGETTEXT'] = 'xgettext'","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/xgettext.py#L277-L278"},{"ref":"SCons/Tool/xgettext.py:330-331","code":"  330 |     except:\n  331 |         return False","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/xgettext.py#L330-L331"},{"ref":"SCons/Tool/xgettext.py:105","code":"  105 |     except:","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/xgettext.py#L105"}]},{"id":"ERR_25","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"zip_builder reads every file fully into memory with `zf.writestr(zinfo, f.read())` rather than streaming. For large source files or directory trees this loads each file entirely into RAM. zipfile supports `zf.write(fname, arcname)` / open-stream writes which avoid this; the writestr approach exists only to allow custom ZipInfo, but could be done via zf.open(zinfo,'w') and shutil.copyfileobj.","fix":"Stream the file into the archive using `with zf.open(zinfo, 'w') as dst: shutil.copyfileobj(f, dst)` to bound memory use.","locations":[{"ref":"SCons/Tool/zip.py:72-77","code":"   72 |     with zipfile.ZipFile(str(target[0]), mode='w', compression=compression) as zf:\n   73 |         for fname in files:\n   74 |             arcname = os.path.relpath(fname, zip_root)\n   75 |             zinfo = _create_zipinfo_for_file(fname, arcname, date_time, compression)\n   76 |             with open(fname, \"rb\") as f:\n   77 |                 zf.writestr(zinfo, f.read())","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/zip.py#L72-L77"}]},{"id":"ERR_26","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"to_str claims to 'Convert object to string' but only handles None, str/UserString, and bytes. For any other type (e.g. int, Path, Node) it falls through to `str(s, 'utf-8')`, which raises TypeError because the 2-argument str() form requires a bytes-like first argument. Callers expecting the documented general behavior (cf. sibling to_String which handles arbitrary objects) will get a crash.","fix":"Either restrict the docstring to bytes/None input, or add a branch returning str(s) for non-bytes inputs.","locations":[{"ref":"SCons/Util/sctypes.py:213-219","code":"  213 | def to_str(s) -> str:\n  214 |     \"\"\"Convert object to string.\"\"\"\n  215 |     if s is None:\n  216 |         return 'None'\n  217 |     if is_String(s):\n  218 |         return s\n  219 |     return str(s, 'utf-8')","lines":7,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Util/sctypes.py#L213-L219"}]},{"id":"ERR_27","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"Variables.Save catches only OSError around the open()/write loop, but value!r repr formatting or env.subst inside the loop can raise other exceptions; more notably the inner 'eval(repr(value))' probe swallows all exceptions except KeyboardInterrupt to decide whether a value is repr-evaluable, which can mask real errors (e.g. NameError from a repr that references undefined names is treated the same as a genuinely non-evaluable value). This is mostly intentional but the bare 'except Exception' is broad.","fix":"Narrow the probe to the expected failure modes if practical; at minimum this is worth a comment documenting why all exceptions are swallowed.","locations":[{"ref":"SCons/Variables/__init__.py:402-409","code":"  402 |                             try:\n  403 |                                 eval(repr(value))\n  404 |                             except KeyboardInterrupt:\n  405 |                                 raise\n  406 |                             except Exception:\n  407 |                                 # Convert stuff that has a repr() that\n  408 |                                 # cannot be evaluated into a string\n  409 |                                 value = SCons.Util.to_String(value)","lines":8,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Variables/__init__.py#L402-L409"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","easy":false,"description":"The daemon HTTP handler blocks indefinitely on `building_cv.wait_for(pred)` with no timeout. If the scons-interactive subprocess dies or never reports the node as finished (e.g. the daemon thread crashed after popping from input_q but before appending to finished_building), the GET handler thread never returns and ninja's build edge hangs forever. There is no liveness check on shared_state.thread_error / daemon_needs_to_shutdown inside the predicate.","fix":"Pass a timeout to wait_for and re-check shared_state.thread_error/daemon_needs_to_shutdown in the predicate; on timeout or daemon death, send a 500 response so ninja fails cleanly instead of hanging.","locations":[{"ref":"SCons/Tool/ninja_tool/ninja_scons_daemon.py:290-294","code":"  290 |                     def pred() -> bool:\n  291 |                         return build[0] in shared_state.finished_building\n  292 | \n  293 |                     with building_cv:\n  294 |                         building_cv.wait_for(pred)","lines":5,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/ninja_scons_daemon.py#L290-L294"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","easy":false,"description":"Both SConsign and dblite unpickle .sconsign data with pickle.loads/pickle.load on files found on disk. Pickle deserialization of attacker-controlled .sconsign/.dblite files allows arbitrary code execution. While this is inherent to SCons's design, dblite.__init__ uses `pickle.loads(p, encoding='bytes')` with only corruption (UnpicklingError/AttributeError/etc.) caught - a maliciously crafted but well-formed pickle executes during load before any validation. There is no integrity check or restricted unpickler.","fix":"Document the trust boundary clearly, and consider a restricted Unpickler that only permits the known SConsignEntry/binfo/ninfo classes, rejecting arbitrary global imports.","locations":[{"ref":"SCons/dblite.py:151-168","code":"  151 |             if len(p) > 0:\n  152 |                 try:\n  153 |                     self._dict = pickle.loads(p, encoding='bytes')\n  154 |                 except (\n  155 |                     pickle.UnpicklingError,\n  156 |                     # Python3 docs:\n  157 |                     # Note that other exceptions may also be raised during\n  158 |                     # unpickling, including (but not necessarily limited to)\n  159 |                     # AttributeError, EOFError, ImportError, and IndexError.\n  160 |                     AttributeError,\n  161 |                     EOFError,\n  162 |                     ImportError,\n  163 |                     IndexError,\n  164 |                 ):\n  165 |                     if IGNORE_CORRUPT_DBFILES:\n  166 |                         corruption_warning(self._file_name)\n  167 |                     else:\n  168 |                         raise","lines":18,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/dblite.py#L151-L168"},{"ref":"SCons/SConsign.py:264-275","code":"  264 |             try:\n  265 |                 self.entries = pickle.loads(rawentries)\n  266 |                 if not isinstance(self.entries, dict):\n  267 |                     self.entries = {}\n  268 |                     raise TypeError\n  269 |             except KeyboardInterrupt:\n  270 |                 raise\n  271 |             except Exception as e:\n  272 |                 SCons.Warnings.warn(SCons.Warnings.CorruptSConsignWarning,\n  273 |                                     \"Ignoring corrupt sconsign entry : %s (%s)\\n\"%(self.dir.get_tpath(), e))\n  274 |             for key, entry in self.entries.items():\n  275 |                 entry.convert_from_sconsign(dir, key)","lines":12,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/SConsign.py#L264-L275"},{"ref":"SCons/SConsign.py:322-325","code":"  322 |         self.entries = pickle.load(fp)\n  323 |         if not isinstance(self.entries, dict):\n  324 |             self.entries = {}\n  325 |             raise TypeError","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/SConsign.py#L322-L325"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":false,"description":"mwld.py uses SCons.Errors.UserError and SCons.Action.Action but only imports SCons.Tool. These names currently resolve only as a side effect of SCons.Tool transitively importing SCons.Action/SCons.Errors and Python attaching submodules as attributes of the SCons package. shlib_action = SCons.Action.Action(...) executes at module import time, so the file is one import-ordering change away from a NameError/AttributeError at import.","fix":"Add explicit 'import SCons.Action' and 'import SCons.Errors' at the top of mwld.py.","locations":[{"ref":"SCons/Tool/mwld.py:34","code":"   34 | import SCons.Tool","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/mwld.py#L34"},{"ref":"SCons/Tool/mwld.py:88","code":"   88 |         raise SCons.Errors.UserError(\"A shared library should have exactly one target with the suffix: %s\" % env.subst(\"$SHLIBSUFFIX\"))","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/mwld.py#L88"},{"ref":"SCons/Tool/mwld.py:101","code":"  101 | shlib_action = SCons.Action.Action(shlib_generator, generator=1)","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/mwld.py#L101"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":false,"description":"_Dblite.__delitem__ deletes from the in-memory dict but does not call self._check_writable() and does not set self._needs_sync = True. As a result, deletions on a read-only ('r') database silently succeed in memory (inconsistent with __setitem__ which guards with _check_writable), and a deletion on a writable db that is otherwise unmodified will not be persisted because _needs_sync stays False and close()/sync() is skipped.","fix":"Add `self._check_writable()` at the start and `self._needs_sync = True` after the `del`, mirroring __setitem__.","locations":[{"ref":"SCons/dblite.py:245-246","code":"  245 |     def __delitem__(self, key):\n  246 |         del self._dict[key]","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/dblite.py#L245-L246"}]},{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"CacheDir references SCons.Node.FS.File.hash_chunksize at line 331, but SCons.Node.FS is intentionally NOT imported in this module (the import is commented out at line 37 to avoid an import loop). This works only by accident: it relies on some other module having already imported SCons.Node.FS so the attribute resolves through the SCons package namespace. If get_cachedir_csig were ever called before SCons.Node.FS is imported, it raises AttributeError.","fix":"Import SCons.Node.FS locally inside get_cachedir_csig, or pass the chunksize in from the caller, to remove the hidden dependency on import order.","locations":[{"ref":"SCons/CacheDir.py:37-37","code":"   37 | # import SCons.Node.FS  # used for hash_chunksice, but causes import loop","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/CacheDir.py#L37"},{"ref":"SCons/CacheDir.py:328-331","code":"  328 |     def get_cachedir_csig(self, node) -> str:\n  329 |         cachedir, cachefile = self.cachepath(node)\n  330 |         if cachefile and os.path.exists(cachefile):\n  331 |             return SCons.Util.hash_file_signature(cachefile, SCons.Node.FS.File.hash_chunksize)","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/CacheDir.py#L328-L331"}]},{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"_hardlink_func() resolves symlinks manually: when the readlink target is relative it does `src = link`, discarding the directory of the original symlink. A relative symlink target is relative to the directory containing the link, so dropping os.path.dirname(src) yields a wrong path (it would be resolved relative to cwd instead of the link's directory). The absolute branch correctly joins; the relative branch is the buggy one (the join/no-join logic appears inverted).","fix":"For the relative case, resolve relative to the link's directory: `src = os.path.join(os.path.dirname(src), link)`; for the absolute case use `link` directly. The current branches are swapped.","locations":[{"ref":"SCons/Node/FS.py:250-261","code":"  250 |     def _hardlink_func(fs, src, dst) -> None:\n  251 |         # If the source is a symlink, we can't just hard-link to it\n  252 |         # because a relative symlink may point somewhere completely\n  253 |         # different.  We must disambiguate the symlink and then\n  254 |         # hard-link the final destination file.\n  255 |         while fs.islink(src):\n  256 |             link = fs.readlink(src)\n  257 |             if not os.path.isabs(link):\n  258 |                 src = link\n  259 |             else:\n  260 |                 src = os.path.join(os.path.dirname(src), link)\n  261 |         fs.link(src, dst)","lines":12,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/FS.py#L250-L261"}]},{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"SConf._startup registers an atexit cleanup (conflog_cleanup) that closes the log file fp, but _shutdown also closes self.logstream (which wraps the same fp). The log file is thus closed twice (once in _shutdown, once at interpreter exit). Closing an already-closed file is benign for normal files but the atexit handler holds a reference to fp for the whole process lifetime, and the handler is never unregistered, so across multiple Configure() contexts in one run, stale closed-file cleanups accumulate.","fix":"Track and unregister the atexit handler in _shutdown (atexit.unregister(conflog_cleanup)), or rely solely on _shutdown's close and only use atexit as a safety net guarded against double close.","locations":[{"ref":"SCons/SConf.py:789-799","code":"  789 |             fp = open(str(self.logfile), log_mode)\n  790 | \n  791 |             def conflog_cleanup(logf) -> None:\n  792 |                 logf.close()\n  793 | \n  794 |             atexit.register(conflog_cleanup, fp)\n  795 |             self.logstream = SCons.Util.Unbuffered(fp)\n  796 |             # logfile may stay in a build directory, so we tell\n  797 |             # the build system not to override it with an eventually\n  798 |             # existing file with the same name in the source directory\n  799 |             self.logfile.dir.add_ignore([self.logfile])","lines":11,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/SConf.py#L789-L799"},{"ref":"SCons/SConf.py:825-828","code":"  825 |         if self.logstream is not None and not dryrun:\n  826 |             self.logstream.write(\"\\n\")\n  827 |             self.logstream.close()\n  828 |             self.logstream = None","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/SConf.py#L825-L828"}]},{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"vswhere_register_executable computes rval = _VSWhereExecutable.get_vswhere_executable() (the actual resolved current vswhere path after registration/freeze) and logs it, but then returns the raw input argument vswhere_exe instead of rval. Callers inspecting the return value to learn which executable is now active get back exactly what they passed in, which may not be the effective binary (e.g. when frozen to a different one).","fix":"Return rval (the resolved executable) rather than the input vswhere_exe, or document explicitly that the input is echoed back.","locations":[{"ref":"SCons/Tool/MSCommon/vc.py:1280-1290","code":" 1280 | def vswhere_register_executable(vswhere_exe, priority=None, freeze=False):\n 1281 |     debug(\n 1282 |         'register vswhere_exe=%s, priority=%s, freeze=%s',\n 1283 |         repr(vswhere_exe), repr(priority), repr(freeze)\n 1284 |     )\n 1285 |     _VSWhereExecutable.register_vswhere_executable(vswhere_exe, priority=priority)\n 1286 |     if freeze:\n 1287 |         _VSWhereExecutable.freeze_vswhere_executable()\n 1288 |     rval = _VSWhereExecutable.get_vswhere_executable()\n 1289 |     debug('current vswhere_exe=%s, is_frozen=%s', repr(rval), _VSWhereExecutable.is_frozen())\n 1290 |     return vswhere_exe","lines":11,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/MSCommon/vc.py#L1280-L1290"}]},{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":true,"description":"In get_command, the fallback WhereIs uses `os.environ[\"PATH\"]` with subscript access. On the rare environment where PATH is unset, this raises KeyError instead of failing gracefully through the intended 'Could not resolve path' error path.","fix":"Use `os.environ.get(\"PATH\", \"\")`.","locations":[{"ref":"SCons/Tool/ninja_tool/Methods.py:183","code":"  183 |         provider_dep_abspath = sub_env.WhereIs(provider_dep) or sub_env.WhereIs(provider_dep, path=os.environ[\"PATH\"])","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/Methods.py#L183"}]},{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"Mutable default arguments: `gen_get_response_file_command(..., custom_env={})` in Methods.py and `NinjaBuilderExecute(self, env, target, source, overwarn={}, executor_kw={})` in __init__.py use shared mutable dict defaults. While not currently mutated, this is a well-known footgun; any future code that mutates these defaults would leak state across calls.","fix":"Use `custom_env=None` / `overwarn=None` defaults and assign `{}` inside the function body.","locations":[{"ref":"SCons/Tool/ninja_tool/Methods.py:224","code":"  224 | def gen_get_response_file_command(env, rule, tool, tool_is_dynamic: bool=False, custom_env={}):","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/Methods.py#L224"},{"ref":"SCons/Tool/ninja_tool/__init__.py:436","code":"  436 |     def NinjaBuilderExecute(self, env, target, source, overwarn={}, executor_kw={}):","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/__init__.py#L436"}]},{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"In ninja_builder (auto-run path), subprocess.Popen is created and its stdout iterated, but if an exception occurs during the readline loop (e.g. the consumer raising) the process is never terminated/waited, and stderr is passed through to sys.stderr without closing. On the win32 branch the run_ninja_env.bat file is written but never cleaned up. Minor process/file hygiene issue on error paths.","fix":"Use the Popen as a context manager or ensure proc.terminate()/wait() in a finally block.","locations":[{"ref":"SCons/Tool/ninja_tool/__init__.py:102-135","code":"  102 |         def execute_ninja():\n  103 | \n  104 |             if env['PLATFORM'] == 'win32':\n  105 |                 spawn_env = os.environ\n  106 |             else:\n  107 |                 spawn_env = sanitize_shell_env(env['ENV'])\n  108 | \n  109 |             proc = subprocess.Popen(cmd,\n  110 |                                     stderr=sys.stderr,\n  111 |                                     stdout=subprocess.PIPE,\n  112 |                                     universal_newlines=True,\n  113 |                                     env=spawn_env\n  114 |                                     )\n  115 |             yield from iter(proc.stdout.readline, \"\")\n  116 |             proc.stdout.close()\n  117 |             return_code = proc.wait()\n  118 |             if return_code:\n  119 |                 raise subprocess.CalledProcessError(return_code, 'ninja')\n  120 | \n  121 |         erase_previous = False\n  122 |         for output in execute_ninja():\n  123 |             output = output.strip()\n  124 |             if erase_previous:\n  125 |                 sys.stdout.write('\\x1b[2K')  # erase previous line\n  126 |                 sys.stdout.write(\"\\r\")\n  127 |             else:\n  128 |                 sys.stdout.write(os.linesep)\n  129 |             sys.stdout.write(output)\n  130 |             sys.stdout.flush()\n  131 |             # this will only erase ninjas [#/#] lines\n  132 |             # leaving warnings and other output, seems a bit\n  133 |             # prone to failure with such a simple check\n  134 |             erase_previous = output.startswith('[')\n  135 |         sys.stdout.write(\"\\n\")","lines":34,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/__init__.py#L102-L135"}]},{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":true,"description":"default_mapper builds an attribute access via `eval(\"entry.\" + name)`. Using eval for what is a plain getattr is needless and unsafe: any `name` containing non-identifier characters is executed as Python in the sconsign process. `name` comes from field_list of pickled, possibly attacker-influenced .sconsign data.","fix":"Replace `eval(\"entry.\" + name)` with `getattr(entry, name)`.","locations":[{"ref":"SCons/Utilities/sconsign.py:74-89","code":"   74 | def default_mapper(entry, name):\n   75 |     \"\"\"\n   76 |     Stringify an entry that doesn't have an explicit mapping.\n   77 | \n   78 |     Args:\n   79 |         entry:  entry\n   80 |         name: field name\n   81 | \n   82 |     Returns: str\n   83 | \n   84 |     \"\"\"\n   85 |     try:\n   86 |         val = eval(\"entry.\" + name)\n   87 |     except AttributeError:\n   88 |         val = None\n   89 |     return str(val)","lines":16,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Utilities/sconsign.py#L74-L89"}]},{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","easy":false,"description":"Several Executor methods and helpers use mutable default arguments: Batch.__init__(targets=[], sources=[]), Executor.__init__(targets=[], sources=[]), get_kw(kw={}), and get_unignored_sources(ignore=()). The list defaults in Batch/Executor are immediately sliced (targets[:]) so they are not actually mutated, but the pattern is fragile and easy to break in a future edit; get_kw copies before mutating so it is safe today. These are latent footguns rather than active bugs.","fix":"Use None sentinels and create the empty container inside the body, matching the convention already used for overridelist/builder_kw in Executor.__init__.","locations":[{"ref":"SCons/Executor.py:45","code":"   45 |     def __init__(self, targets=[], sources=[]) -> None:","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Executor.py#L45"},{"ref":"SCons/Executor.py:171-172","code":"  171 |     def __init__(self, action, env=None, overridelist=None,\n  172 |                  targets=[], sources=[], builder_kw=None) -> None:","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Executor.py#L171-L172"},{"ref":"SCons/Executor.py:376","code":"  376 |     def get_kw(self, kw={}):","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Executor.py#L376"}]},{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","easy":true,"description":"Tool._tool_module builds an error message with a normal (non-f) string: msg = \"No tool named '{self.name}': {e}\" in the zipimport ZipImportError handler, so the literal braces are emitted instead of the tool name and exception. This is in the documented near-dead zipimport fallback, but the message is still wrong if ever reached.","fix":"Make it an f-string: f\"No tool named '{self.name}': {e}\".","locations":[{"ref":"SCons/Tool/__init__.py:279","code":"  279 |                 msg = \"No tool named '{self.name}': {e}\"","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/__init__.py#L279"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","easy":true,"description":"Dir.glob() recomputes the exclude matches inside a list comprehension that calls SCons.Util.flatten(excludes) once per result element, and re-runs fnmatch against the full flattened exclude list for every result. flatten(excludes) is invariant across the comprehension and should be hoisted; for large result sets in big source trees this is O(results * excludes) plus a redundant flatten per element.","fix":"Compute `flat_excludes = SCons.Util.flatten(excludes)` once before the comprehension and reference it inside the any() test.","locations":[{"ref":"SCons/Node/FS.py:2278-2285","code":" 2278 |         if exclude:\n 2279 |             excludes = []\n 2280 |             excludeList = SCons.Util.flatten(exclude)\n 2281 |             for x in excludeList:\n 2282 |                 r = self.glob(x, ondisk, source, strings)\n 2283 |                 excludes.extend(r)\n 2284 |             result = [x for x in result if not any(fnmatch.fnmatch(str(x), str(e)) for e in SCons.Util.flatten(excludes))]\n 2285 |         return sorted(result, key=lambda a: str(a))","lines":8,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/FS.py#L2278-L2285"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","easy":false,"description":"scons_subst() and scons_subst_list() write gvars['__builtins__'] = __builtins__ into the live env dict on every call (and delete it after), even when the substituted string contains no '$' work requiring eval. scons_s
