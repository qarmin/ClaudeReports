ubst already early-returns for plain strings, but scons_subst_list has no such guard and always mutates/cleans the live gvars dict. This is a hot path (called per target/source); the repeated dict insert+delete on the shared env dict adds avoidable churn.","fix":"Skip the __builtins__ insert/delete when the input requires no expansion (mirror scons_subst's early '$ not in strSubst' short-circuit for scons_subst_list), or set __builtins__ in a copied gvars only when an eval() is actually needed.","locations":[{"ref":"SCons/Subst.py:980-996","code":"  980 |     # We're (most likely) going to eval() things.  If Python doesn't\n  981 |     # find a __builtins__ value in the global dictionary used for eval(),\n  982 |     # it copies the current global values for you.  Avoid this by\n  983 |     # setting it explicitly and then deleting, so we don't pollute the\n  984 |     # construction environment Dictionary(ies) that are typically used\n  985 |     # for expansion.  gvars is usually the live env dict, so make sure\n  986 |     # the deletion happens even if substitution raises.\n  987 |     gvars['__builtins__'] = __builtins__\n  988 | \n  989 |     ls = ListSubber(env, mode, conv, gvars)\n  990 |     try:\n  991 |         ls.substitute(strSubst, lvars, 0)\n  992 |     finally:\n  993 |         try:\n  994 |             del gvars['__builtins__']\n  995 |         except KeyError:\n  996 |             pass","lines":17,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Subst.py#L980-L996"},{"ref":"SCons/Subst.py:897-913","code":"  897 |     # We're (most likely) going to eval() things.  If Python doesn't\n  898 |     # find a __builtins__ value in the global dictionary used for eval(),\n  899 |     # it copies the current global values for you.  Avoid this by\n  900 |     # setting it explicitly and then deleting, so we don't pollute the\n  901 |     # construction environment Dictionary(ies) that are typically used\n  902 |     # for expansion.  gvars is usually the live env dict, so make sure\n  903 |     # the deletion happens even if substitution raises.\n  904 |     gvars['__builtins__'] = __builtins__\n  905 | \n  906 |     ss = StringSubber(env, mode, conv, gvars)\n  907 |     try:\n  908 |         result = ss.substitute(strSubst, lvars)\n  909 |     finally:\n  910 |         try:\n  911 |             del gvars['__builtins__']\n  912 |         except KeyError:\n  913 |             pass","lines":17,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Subst.py#L897-L913"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"_object_instance_content calls getattr(obj, p) up to three times per attribute name in the dir(obj) comprehension (for the __ check, ismethod, and isbuiltin), and again to build the value list, plus getattr in the separate methods comprehension. For objects with many attributes this triggers many redundant attribute lookups (each of which may run a property/descriptor). Only relevant when track-instances/signature-by-instance path is used, so impact is limited.","fix":"Cache getattr(obj, p) once per attribute (e.g. build a list of (name, value) pairs first) and classify from the single value.","locations":[{"ref":"SCons/Action.py:355-368","code":"  355 |     properties = [(p, getattr(obj, p, \"None\")) for p in dir(obj) if not (p[:2] == '__' or inspect.ismethod(getattr(obj, p)) or inspect.isbuiltin(getattr(obj,p))) ]\n  356 |     properties.sort()\n  357 |     properties_str = ','.join([\"%s=%s\"%(p[0],p[1]) for p in properties])\n  358 |     properties_bytes = bytearray(properties_str,'utf-8')\n  359 | \n  360 |     methods = [p for p in dir(obj) if inspect.ismethod(getattr(obj, p))]\n  361 |     methods.sort()\n  362 | \n  363 |     method_contents = []\n  364 |     for m in methods:\n  365 |         # print(\"Method:%s\"%m)\n  366 |         v = _function_contents(getattr(obj, m))\n  367 |         # print(\"[%s->]V:%s [%s]\"%(m,v,type(v)))\n  368 |         method_contents.append(v)","lines":14,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Action.py#L355-L368"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"Executor.add_sources does an O(n*m) membership scan: for each candidate source it tests `x not in self.batches[0].sources` against a growing Python list. For 'multi' builders that accumulate many sources across repeated calls this becomes quadratic in the total number of sources. The TODO on the next line ('remove duplicates?') acknowledges the area is rough.","fix":"Track membership with a set of already-present sources (or use uniquer_hashables once) instead of repeated `not in list` scans, preserving order while making the dedupe near-linear.","locations":[{"ref":"SCons/Executor.py:392-400","code":"  392 |     def add_sources(self, sources) -> None:\n  393 |         \"\"\"Add source files to this Executor's list.  This is necessary\n  394 |         for \"multi\" Builders that can be called repeatedly to build up\n  395 |         a source file list for a given target.\"\"\"\n  396 |         # TODO(batch):  extend to multiple batches\n  397 |         assert (len(self.batches) == 1)\n  398 |         # TODO(batch):  remove duplicates?\n  399 |         sources = [x for x in sources if x not in self.batches[0].sources]\n  400 |         self.batches[0].sources.extend(sources)","lines":9,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Executor.py#L392-L400"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"FS.py is ~3880 lines housing LocalFS, FS, Base, Entry, Dir, RootDir, File, FileFinder, all the NodeInfo/BuildInfo variants, the module-level disk-checkers, link funcs, and path normalization. This single module mixes the in-memory node model, on-disk I/O abstraction (LocalFS), the signature/sconsign conversion logic (FileBuildInfo.convert_old_entry etc.), and glob/find machinery. The tangling makes the hot-path lookup/stat code hard to reason about in isolation and contributes to the duplicated repository-search and _morph code noted elsewhere.","fix":"Longer-term: split LocalFS (I/O), the BuildInfo/NodeInfo + sconsign-conversion classes, and FileFinder/glob into separate modules, keeping the Node subclasses focused on the node model.","locations":[{"ref":"SCons/Node/FS.py:1-3880","code":"    1 | # MIT License\n    2 | #\n    3 | # Copyright The SCons Foundation\n    4 | #\n    5 | # Permission is hereby granted, free of charge, to any person obtaining\n    6 | # a copy of this software and associated documentation files (the\n    7 | # \"Software\"), to deal in the Software without restriction, including\n    8 | # without limitation the rights to use, copy, modify, merge, publish,\n    9 | # distribute, sublicense, and/or sell copies of the Software, and to\n   10 | # permit persons to whom the Software is furnished to do so, subject to\n   11 | # the following conditions:\n   12 | #\n   13 | # The above copyright notice and this permission notice shall be included\n   14 | # in all copies or substantial portions of the Software.\n   15 | #\n   16 | # THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY\n   17 | # KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE\n   18 | # WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND\n   19 | # NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE\n   20 | # LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION\n   21 | # OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION\n   22 | # WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.\n   23 | \n   24 | \"\"\"File system nodes.\n   25 | \n   26 | These Nodes represent the canonical external objects that people think\n   27 | of when they think of building software: files and directories.\n   28 | \n   29 | This holds a \"default_fs\" variable that should be initialized with an FS\n   30 | that can be used by scripts or modules looking for the canonical default.\n   31 | \"\"\"\n   32 | \n   33 | from __future__ import annotations\n   34 | \n   35 | import fnmatch\n   36 | import importlib.util\n   37 | import os\n   38 | import re\n   39 | import shutil\n   40 | import stat\n   41 | import sys\n   42 | import time\n   43 | from itertools import chain\n   44 | from typing import TYPE_CHECKING, Any, Callable, cast\n   45 | \n   46 | import SCons.Action\n   47 | import SCons.Debug\n   48 | import SCons.Errors\n   49 | import SCons.Memoize\n   50 | import SCons.Node\n   51 | import SCons.SConsign\n   52 | import SCons.Subst\n   53 | import SCons.Util\n   54 | from SCons.Debug import logInstanceCreation, Trace\n   55 | from SCons.Node import BuildInfoBase, Node, NodeInfoBase\n   56 | from SCons.Util import hash_signature, hash_file_signature, hash_collect\n   57 | \n   58 | if TYPE_CHECKING:\n   59 |     from SCons.Builder import BuilderBase\n   60 |     from SCons.Environment import EnvironmentBase\n   61 |     from SCons.Scanner import ScannerBase\n   62 |     from SCons.SConsign import SConsignEntry, DB as SConsignDatabase\n   63 | \n   64 | print_duplicate = 0\n   65 | \n   66 | MD5_TIMESTAMP_DEBUG = False\n   67 | \n   68 | \n   69 | def sconsign_none(node):\n   70 |     raise NotImplementedError\n   71 | \n   72 | def sconsign_dir(node):\n   73 |     \"\"\"Return the .sconsign file info for this directory,\n   74 |     creating it first if necessary.\"\"\"\n   75 |     if not node._sconsign:\n   76 |         node._sconsign = SCons.SConsign.ForDirectory(node)\n   77 |     return node._sconsign\n   78 | \n   79 | _sconsign_map = {0 : sconsign_none,\n   80 |                  1 : sconsign_dir}\n   81 | \n   82 | class FileBuildInfoFileToCsigMappingError(Exception):\n   83 |     pass\n   84 | \n   85 | class EntryProxyAttributeError(AttributeError):\n   86 |     \"\"\"\n   87 |     An AttributeError subclass for recording and displaying the name\n   88 |     of the underlying Entry involved in an AttributeError exception.\n   89 |     \"\"\"\n   90 |     def __init__(self, entry_proxy, attribute) -> None:\n   91 |         super().__init__()\n   92 |         self.entry_proxy = entry_proxy\n   93 |         self.attribute = attribute\n   94 |     def __str__(self) -> str:\n   95 |         entry = self.entry_proxy.get()\n   96 |         fmt = \"%s instance %s has no attribute %s\"\n   97 |         return fmt % (entry.__class__.__name__,\n   98 |                       repr(entry.name),\n   99 |                       repr(self.attribute))\n  100 | \n  101 | # The max_drift value:  by default, use a cached signature value for\n  102 | # any file that's been untouched for more than two days.\n  103 | default_max_drift = 2*24*60*60\n  104 | \n  105 | #\n  106 | # We stringify these file system Nodes a lot.  Turning a file system Node\n  107 | # into a string is non-trivial, because the final string representation\n  108 | # can depend on a lot of factors:  whether it's a derived target or not,\n  109 | # whether it's linked to a repository or source directory, and whether\n  110 | # there's duplication going on.  The normal technique for optimizing\n  111 | # calculations like this is to memoize (cache) the string value, so you\n  112 | # only have to do the calculation once.\n  113 | #\n  114 | # A number of the above factors, however, can be set after we've already\n  115 | # been asked to return a string for a Node, because a Repository() or\n  116 | # VariantDir() call or the like may not occur until later in SConscript\n  117 | # files.  So this variable controls whether we bother trying to save\n  118 | # string values for Nodes.  The wrapper interface can set this whenever\n  119 | # they're done mucking with Repository and VariantDir and the other stuff,\n  120 | # to let this module know it can start returning saved string values\n  121 | # for Nodes.\n  122 | #\n  123 | Save_Strings: bool = False\n  124 | \n  125 | def save_strings(val: bool) -> None:\n  126 |     global Save_Strings\n  127 |     Save_Strings = val\n  128 | \n  129 | \n  130 | do_splitdrive = None\n  131 | _my_splitdrive = None\n  132 | \n  133 | def initialize_do_splitdrive() -> None:\n  134 |     \"\"\"Set up splitdrive usage.\n  135 | \n  136 |     Avoid unnecessary function calls by recording a flag that tells us whether\n  137 |     or not :func:`os.path.splitdrive` actually does anything on this system,\n  138 |     and therefore whether we need to bother calling it when looking up path\n  139 |     names in various methods below.\n  140 | \n  141 |     If :data:`do_splitdrive` is True, :func:`_my_splitdrive` will be a real\n  142 |     function which we can call. As all supported Python versions' ntpath module\n  143 |     now handle UNC paths correctly, we no longer special-case that.\n  144 | \n  145 |     Deferring the setup of ``_my_splitdrive`` also lets unit tests do\n  146 |     their thing and test UNC path handling on a POSIX host.\n  147 |     \"\"\"\n  148 |     global do_splitdrive, _my_splitdrive\n  149 | \n  150 |     do_splitdrive = bool(os.path.splitdrive('X:/foo')[0])\n  151 | \n  152 |     if do_splitdrive:\n  153 |         # Note there's a little dilemma here - we should be able to use the\n  154 |         # Python os.path.splitdrive, which is well debugged over the years.\n  155 |         # For normal usage it should work, but we also want to as much as\n  156 |         # possible run the full testsuite on whichever platform, even if it's\n  157 |         # \"wrong\" for some feature. POSIX splitdrive doesn't do what we want\n  158 |         # when running the drive and UNC path tests, and the NT one isn't\n  159 |         # designed for use on non-win32.  So for now stuck on our private one.\n  160 |         # _my_splitdrive = os.path.splitdrive\n  161 | \n  162 |         def _my_splitdrive(p):\n  163 |             if p[1:2] == ':':\n  164 |                 return p[:2], p[2:]\n  165 |             if p[0:2] == '//':\n  166 |                 # We leave a leading slash in the path because UNC paths\n  167 |                 # are always absolute.\n  168 |                 #\n  169 |                 # TODO: returning \"//\" for the drive part is actually\n  170 |                 #   completely wrong. UNC paths must have minimum three\n  171 |                 #   slashes (if using '//server/share/path' style), or five\n  172 |                 #   ('//?/UNC/server/share/path)' and we should return the\n  173 |                 #   part up to but not including the next slash.\n  174 |                 return '//', p[1:]\n  175 |             return '', p\n  176 | \n  177 |     # Keep some commonly used values in global variables to skip to\n  178 |     # module look-up costs.\n  179 |     global OS_SEP\n  180 |     global UNC_PREFIX\n  181 |     global os_sep_is_slash\n  182 | \n  183 |     OS_SEP = os.sep\n  184 |     UNC_PREFIX = OS_SEP + OS_SEP\n  185 |     os_sep_is_slash = OS_SEP == '/'\n  186 | \n  187 | initialize_do_splitdrive()\n  188 | \n  189 | # Used to avoid invoking os.path.normpath if not necessary.\n  190 | needs_normpath_check = re.compile(\n  191 |     r'''\n  192 |       # We need to renormalize the path if it contains any consecutive\n  193 |       # '/' characters.\n  194 |       .*// |\n  195 | \n  196 |       # We need to renormalize the path if it contains a '..' directory.\n  197 |       # Note that we check for all the following cases:\n  198 |       #\n  199 |       #    a) The path is a single '..'\n  200 |       #    b) The path starts with '..'. E.g. '../' or '../moredirs'\n  201 |       #       but we not match '..abc/'.\n  202 |       #    c) The path ends with '..'. E.g. '/..' or 'dirs/..'\n  203 |       #    d) The path contains 89 |     # and os.symlink for testing purposes.\n  290 |     link_dict = {\n  291 |         'hard' : _hardlink_func,\n  292 |         'soft' : _softlink_func,\n  293 |         'copy' : _copy_func\n  294 |     }\n  295 | \n  296 |     if duplicate not in Valid_Duplicates:\n  297 |         raise SCons.Errors.InternalError(\"The argument of set_duplicate \"\n  298 |                                            \"should be in Valid_Duplicates\")\n  299 |     global Link_Funcs\n  300 |     Link_Funcs = []\n  301 |     for func in duplicate.split('-'):\n  302 |         if link_dict[func]:\n  303 |             Link_Funcs.append(link_dict[func])\n  304 | \n  305 | def LinkFunc(target: list[Base], source: list[Base], env: EnvironmentBase) -> int:\n  306 |     \"\"\"\n  307 |     Relative paths cause problems with symbolic links, so\n  308 |     we use absolute paths, which may be a problem for people\n  309 |     who want to move their soft-linked src-trees around. Those\n  310 |     people should use the 'hard-copy' mode, softlinks cannot be\n  311 |     used for that; at least I have no idea how ...\n  312 |     \"\"\"\n  313 |     src = source[0].get_abspath()\n  314 |     dest = target[0].get_abspath()\n  315 |     dir, file = os.path.split(dest)\n  316 |     if dir and not target[0].fs.isdir(dir):\n  317 |         os.makedirs(dir)\n  318 |     if not Link_Funcs:\n  319 |         # Set a default order of link functions.\n  320 |         set_duplicate('hard-soft-copy')\n  321 |     fs = source[0].fs\n  322 |     # Now link the files with the previously specified order.\n  323 |     for func in Link_Funcs:\n  324 |         try:\n  325 |             func(fs, src, dest)\n  326 |             break\n  327 |         except OSError:\n  328 |             # An OSError indicates something happened like a permissions\n  329 |             # problem or an attempt to symlink across file-system\n  330 |             # boundaries.  An IOError indicates something like the file\n  331 | rned by self.get_all_rdirs() in place via search_dir_list.extend(...). get_all_rdirs() is memoized and returns `list(self._memo[...])` defensively, so this happens to be safe, but relying on that copy is fragile; if the memo ever returns the cached list directly, glob would corrupt the cached rdir list. Minor, but a latent aliasing hazard in a hot lookup path.","fix":"Build a fresh list explicitly: `search_dir_list = list(self.get_all_rdirs())` before extending, to make the non-aliasing contract local and explicit.","locations":[{"ref":"SCons/Node/FS.py:2301-2303","code":" 2301 |         search_dir_list = self.get_all_rdirs()\n 2302 |         for srcdir in self.srcdir_list():\n 2303 |             search_dir_list.extend(srcdir.get_all_rdirs())","lines":3,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/FS.py#L2301-L2303"}]},{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"Fortran F90Scanner.scan() calls node.get_text_contents() three times in a row (once each for includes, USE modules, and MODULE defs), re-reading/decoding the whole file three times per scanned source file. Scanners run per-file across the whole build, so this is needless repeated I/O/decode work.","fix":"Read the contents once into a local variable and run all three regexes against it.","locations":[{"ref":"SCons/Scanner/Fortran.py:81-85","code":"   81 |             includes = self.cre_incl.findall(node.get_text_contents())\n   82 |             # retrieve all USE'd module names\n   83 |             modules = self.cre_use.findall(node.get_text_contents())\n   84 |             # retrieve all defined module names\n   85 |             defmodules = self.cre_def.findall(node.get_text_contents())","lines":5,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Scanner/Fortran.py#L81-L85"}]},{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"Java scan() walks each classpath directory twice for class files: env.Dir(lib).walk(_collect_classes, result) collects the in-memory SCons nodes, and then os.walk(str(lib)) re-walks the same tree on disk via _collect_classes. Both append to the same `result` list, so .class files present both in-memory and on-disk are added twice (later dedup is not performed; the final filter only checks suffix). This doubles filesystem traversal per classpath dir and can produce duplicate dependency nodes.","fix":"Walk the directory once (prefer the on-disk os.walk or the in-memory walk, not both) and/or deduplicate `result` before returning.","locations":[{"ref":"SCons/Scanner/Java.py:87-97","code":"   87 |         for lib in libs:\n   88 |             if os.path.isdir(str(lib)):\n   89 |                 # grab the in-memory nodes\n   90 |                 env.Dir(lib).walk(_collect_classes, result)\n   91 |                 # now the on-disk ones\n   92 |                 for root, dirs, files in os.walk(str(lib)):\n   93 |                     _collect_classes(result, root, files)\n   94 |             else:\n   95 |                 result.append(lib)\n   96 | \n   97 |     return list(filter(lambda x: os.path.splitext(str(x))[1] in [\".class\", \".zip\", \".jar\"], result))","lines":11,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Scanner/Java.py#L87-L97"}]},{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"handle_list_action de-duplicates commands with `if cmdstr in cmdline:` -- a substring containment test against the growing accumulated command string, not a set/exact-match. This is O(n*m) and, worse, semantically wrong: a command that happens to be a substring of an already-appended longer command is incorrectly skipped (e.g. 'cp a b' would suppress a later legitimate 'cp a b c' only partially, or 'echo' skipped if it appears inside an earlier ue clutter.","fix":"Remove dictify() if confirmed unused project-wide, and drop the dead commented walrus snippet.","locations":[{"ref":"SCons/Util/__init__.py:122-127","code":"  122 | # unused?\n  123 | def dictify(keys, values, result=None) -> dict:\n  124 |     if result is None:\n  125 |         result = {}\n  126 |     result.update(zip(keys, values))\n  127 |     return result","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Util/__init__.py#L122-L127"},{"ref":"SCons/Util/hashes.py:338-340","code":"  338 |         # TODO: can use this when base is Python 3.8+\n  339 |         # while (blk := f.read(chunksize)) != b'':\n  340 |         #     m.update(to_bytes(blk))","lines":3,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Util/hashes.py#L338-L340"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":false,"description":"In CheckTypeSize the `else` branch comment says 'Only check if the given size is the right one', copied verbatim from the `if expect is not None` branch above. In the else branch `expect is None`, so the code actually auto-detects the size by compiling and running a program that prints sizeof(type); the comment describes the opposite behavior.","fix":"Change the comment to something like '# No expected size given; determine the size by running a test program.'","locations":[{"ref":"SCons/Conftest.py:489-491","code":"  489 |     else:\n  490 |         # Only check if the given size is the right one\n  491 |         context.Message('Checking size of %s ... ' % type_name)","lines":3,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Conftest.py#L489-L491"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"The docstring example for memoizing a dict-valued method stores the freshly-created dict under the wrong key. It computes `memo_dict = {}` for method `bar` but then does `self._memo['dict'] = memo_dict` instead of `self._memo['bar'] = memo_dict`. Code elsewhere (e.g. Executor.get_unignored_sources, Builder.get_src_builders) keys the memo dict by the method name. As written, the example never populates `self._memo['bar']`, so a copy-paste of this documented pattern would always miss the cache.","fix":"Change `self._memo['dict'] = memo_dict` to `self._memo['bar'] = memo_dict` so the example matches the method name used for lookup on line 61.","locations":[{"ref":"SCons/Memoize.py:59-67","code":"   59 |         memo_key = argument                                     # Memoization\n   60 |         try:                                                    # Memoization\n   61 |             memo_dict = self._memo['bar']                       # Memoization\n   62 |         except KeyError:                                        # Memoization\n   63 |             memo_dict = {}                                      # Memoization\n   64 |             self._memo['dict'] = memo_dict                      # Memoization\n   65 |         else:                                                   # Memoization\n   66 |             try:                                                # Memoization\n   67 |                 return memo_dict[memo_key]                      # Memoization","lines":9,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Memoize.py#L59-L67"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","easy":false,"description":"Comment in win32.escape() and the surrounding logic: escape() appends an extra backslash only when the arg ends in a single backslash, but does not handle an arg ending in multiple backslashes (e.g. 'foo\\\\'), which under cmd /C quoting would still leave the closing quote escaped. The inline rationale comment claims it handles the trailing-backslash case generally, but only the single-trailing-backslash case is covered.","fix":"Either double all trailing backslashes (count them) or update the comment to state only a single trailing backslash is handled.","locations":[{"ref":"SCons/Platform/win32.py:213-221","code":"  213 | # Windows does not allow special characters in file names anyway, so no\n  214 | # need for a complex escape function, we will just quote the arg, except\n  215 | # that \"cmd /c\" requires that if an argument ends with a backslash it\n  216 | # needs to be escaped so as not to interfere with closing double quote\n  217 | # that we add.\n  218 | def escape(x):\n  219 |     if x[-1] == '\\\\':\n  220 |         x = x + '\\\\'\n  221 |     return '\"' + x + '\"'","lines":9,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Platform/win32.py#L213-L221"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","easy":false,"description":"Comment says 'Remove unique items from the list' but SCons.Util.unique removes DUPLICATES (keeps the unique set). The comment states the opposite of what the code does.","fix":"Reword to 'Remove duplicate items from the list' (or 'Keep only unique module names').","locations":[{"ref":"SCons/Tool/FortranCommon.py:78-79","code":"   78 |     # Remove unique items from the list\n   79 |     modules = SCons.Util.unique(modules)","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/FortranCommon.py#L78-L79"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","easy":false,"description":"The inline comment on the 'kind' field of the VCVER_KIND_PROGRAM namedtuple reads '# relpath from pdir to vsroot', but that field holds the integer kind constant (e.g. VCVER_KIND_DEVELOP), not a relpath. The comment is a copy-paste of the VCVER_KIND_DETECT.root field comment further down and is misleading.","fix":"Change the comment tion-variable manipulation (Append/Prepend/Replace and their *Unique/*ENVPath variants), flag parsing (ParseFlags is a ~200-line single function), the full public SCons DSL (Alias, Command, Depends, Glob, Install helpers, etc.), the OverrideEnvironment proxy, and CPPDEFINES handling. The Base class alone defines dozens of methods. This makes the file hard to navigate/test and concentrates change risk. ParseFlags in particular is one giant if/elif chain that is hard to extend or unit-test in isolation.","fix":"Split into focused modules (e.g. consvar mutation ops, flag parsing, the public build-DSL methods, OverrideEnvironment) and/or break ParseFlags' big switch into a dispatch table keyed by flag prefix.","locations":[{"ref":"SCons/Environment.py:1313-3011","code":" 1313 | class Base(SubstitutionEnvironment):\n 1314 |     \"\"\"Base class for \"real\" construction Environments.\n 1315 | \n 1316 |     These are the primary objects used to communicate dependency\n 1317 |     and construction information to the build engine.\n 1318 | \n 1319 |     Sets up special construction variables like ``BUILDER``,\n 1320 |     ``PLATFORM``, etc., and searches for and applies available Tools.\n 1321 | \n 1322 |     Note that we do *not* call the base class (:class:`SubstitutionEnvironment`)\n 1323 |     initializer, because we need to initialize things in a very specific\n 1324 |     order that doesn't work with the much simpler base class initialization.\n 1325 | \n 1326 |     Except for the five recognized keyword arguments *platform*,\n 1327 |     *tools*, *toolpath*, *variables* and *parse_flags*, keyword arguments\n 1328 |     supplied when the construction Environment is created will be added\n 1329 |     as construction variables in the Environment.\n 1330 | \n 1331 |     Arguments:\n 1332 |        platform: the SCons platform name to use for initialization.\n 1333 |        tools: name or list of tool names to initialize.\n 1334 |        toolpath: list of paths to search for tools.\n 1335 |        variables: a :class:`~SCons.Variables.Variables` object to\n 1336 |           use to populate construction variables from command-line\n 1337 |           variables.\n 1338 |        parse_flags: option strings to parse into construction variables.\n 1339 |     \"\"\"\n 1340 | \n 1341 |     #######################################################################\n 1342 |     # This is THE class for interacting with the SCons build engine,\n 1343 |     # and it contains a lot of stuff, so we're going to try to keep this\n 1344 |     # a little organized by grouping the methods.\n 1345 |     #######################################################################\n 1346 | \n 1347 |     def __init__(\n 1348 |         self,\n 1349 |         platform: str | PlatformSpec | None = None,\n 1350 |         tools: list[str | tuple[str, dict[str, Any]]] | None = None,\n 1351 |         toolpath: list[str] | None = None,\n 1352 |         variables: Variables | None = None,\n 1353 |         parse_flags: str | list[str] | dict[str, Any] | None = None,\n 1354 |         **kw\n 1355 |     ) -> None:\n 1356 |         if SCons.Debug.track_instances: logInstanceCreation(self, 'Environment.Base')\n 1357 |         self._memo: dict[str, Any] = {}\n 1358 |         self.fs = SCons.Node.FS.get_default_fs()\n 1359 |         self.ans = SCons.Node.Alias.default_ans\n 1360 |         self.lookup_list = SCons.Node.arg2nodes_lookups\n 1361 |         self._dict: dict[str, Any] = semi_deepcopy(SCons.Defaults.ConstructionEnvironment)\n 1362 |         self._init_special()\n 1363 |         self.added_methods = []\n 1364 | \n 1365 |         # We don't use AddMethod, or define these as methods in this\n 1366 |         # class, because we *don't* want these functions to be bound\n 1367 |         # methods.  They need to operate independently so that the\n 1368 |         # settings will work properly regardless of whether a given\n 1369 |         # target ends up being built with a Base ther than per-invocation state, two LaTeX builds running in the same process (e.g. SCons building multiple .tex targets, or any future parallelism) can corrupt each other's rerun decisions. The closure's `global must_rerun_latex` mutation only works by accident of single-threaded sequential execution.","fix":"Make the rerun flag a local variable threaded through the function / closure (e.g. a single-element list or an attribute on a small state object) instead of a module global.","locations":[{"ref":"SCons/Tool/tex.py:50","code":"   50 | must_rerun_latex = True","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/tex.py#L50"},{"ref":"SCons/Tool/tex.py:195","code":"  195 |     global must_rerun_latex","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/tex.py#L195"},{"ref":"SCons/Tool/tex.py:250-273","code":"  250 |     must_rerun_latex = True\n  251 | \n  252 |     # .aux files already processed by BibTex\n  253 |     already_bibtexed = []\n  254 | \n  255 |     def check_content_hash(filenode, suffix) -> bool:\n  256 |         \"\"\"\n  257 |         Routine to update content hash and compare\n  258 |         \"\"\"\n  259 |         global must_rerun_latex\n  260 |         # two calls to clear old csig\n  261 |         filenode.clear_memoized_values()\n  262 |         filenode.ninfo = filenode.new_ninfo()\n  263 |         new_md5 = filenode.get_csig()\n  264 | \n  265 |         if saved_hashes[suffix] == new_md5:\n  266 |             if Verbose:\n  267 |                 print(\"file %s not changed\" % (targetbase+suffix))\n  268 |             return False        # unchanged\n  269 |         saved_hashes[suffix] = new_md5\n  270 |         must_rerun_latex = True\n  271 |         if Verbose:\n  272 |             print(\"file %s changed, rerunning Latex, new hash = \" % (targetbase+suffix), new_md5)\n  273 |         return True     # changed","lines":24,"link": l_gen:\n  806 |         try:\n  807 |             shell_gens = iter(shell_gen)\n  808 |         except TypeError:\n  809 |             raise SCons.Errors.UserError(\"SHELL_ENV_GENERATORS must be iteratable.\")\n  810 | \n  811 |         ENV = ENV.copy()\n  812 |         for generator in shell_gens:\n  813 |             ENV = generator(env, target, source, ENV)\n  814 |             if not isinstance(ENV, dict):\n  815 |                 raise SCons.Errors.UserError(f\"SHELL_ENV_GENERATORS function: {generator} must return a dict.\")\n  816 | \n  817 |     return ENV\n  818 | \n  819 | \n  820 | def scons_subproc_run(scons_env, *args, **kwargs) -> subprocess.CompletedProcess:\n  821 |     \"\"\"Run an external command using an SCons execution environment.\n  822 | \n  823 |     SCons normally runs external build commands using :mod:`subprocess`,\n  824 |     but does not harvest any output from such commands. This function\n  825 |     is a thin wrapper around :func:`subprocess.run` allowing running\n  826 |     a command in an SCons context (i.e. uses an \"execution environment\"\n  827 |     rather than the user's existing environment), and provides the ability\n  828 |     to return any output in a :class:`subprocess.CompletedProcess`\n  829 |     instance (this must be selected by setting ``stdout`` and/or\n  830 |     ``stderr`` to ``PIPE``, or setting ``capture_output=True`` - see\n  831 |     Keyword Arguments). Typical use case is to run a tool's \"version\"\n  832 |     option to find out the installed version.\n  833 | \n  834 |     If supplied, the ``env`` keyword argument provides an execution\n  835 |     environment to process into appropriate form before it is supplied\n  836 |     to :mod:`subprocess`; if omitted, *scons_env* is used to derive a\n  837 |     suitable default.  The other keyword arguments are passed through,\n  838 |     except that the SCons legacy ``error`` keyword is remapped to the\n  839 |     subprocess ``check`` keyword; if both are omitted ``check=False``\n  840 |     will be passed. The caller is responsible for setting up the desired\n  841 |     arguments  for :func:`subprocess.run`.\n  842 | \n  843 |     This function retains the legacy behavior of returning something\n  844 |     vaguely usable even in the face of complete failure, unless\n  845 |     ``check=True`` (in which case an error is allowed to be raised):\n  846 |     it synthesizes a :class:`~subprocess.CompletedProcess` instance in\n  847 |     this case.\n  848 | \n  849 |     A subset of interesting keyword arguments follows; see the Python\n  850 |     documentation of :mod:`subprocess` for the complete list.\n  851 | \n  852 |     Keyword Arguments:\n  853 |        stdout: (and *stderr*, *stdin*) if set to :const:`subprocess.PIPE`.\n  854 |           send input to or collect output from the relevant stream in\n  855 |           the subprocess; the default ``None`` does no redirection\n  856 |           (i.e. output or errors may go to the console or log file,\n  857 |           but is not captured); if set to :const:`subprocess.DEVNULL`\n  858 |           they are explicitly thrown away. ``capture_output=True`` is a\n  859 |           synonym for setting both ``stdout`` and ``stderr``\n  860 |           to :const:`~subprocess.PIPE`.\n  861 |        text: open *stdin*, *stdout*, *stderr* in text mode. Default\n  862 |           is binary mode. ``universal_newlines`` is a synonym.\n  863 |        encoding: specifies an encoding. Changes to text mode.\n  864 |        errors: specified error handling. Changes to text mode.\n  865 |        input: a byte sequence to be passed to *stdin*, unless text\n  866 |           mode is enabled, in which case it must be a string.\n  867 |        shell: if true, the command is executed through the shell.\n  868 |        check: if true and the subprocess exits with a non-zero exit\n  869 |           code, raise a :exc:`subprocess.CalledProcessError` exception.\n  870 |           Otherwise (the default) in case of an :exc:`OSError`, report the\n  871 |           exit code in the :class:`~Subprocess.CompletedProcess` instance.\n  872 | \n  873 |     .. versionadded:: 4.6\n  874 |     \"\"\"\n  875 |     # Figure out the execution environment to use\n  876 |     env = kwargs.get('env', None)\n  877 |     if env is None:\n  878 |         env = get_default_ENV(scons_env)\n  879 |     kwargs['env'] = SCons.Util.sanitize_shell_env(env)\n  880 | \n  881 |     # Backwards-compat with _subproc: accept 'error', map to 'check',\n  882 |     # and remove, since subprocess.run does not recognize.\n  883 |     # 'error' isn't True/False, it takes a string value (see _subproc)\n  884 |     error = kwargs.get('error')\n  885 |     if error and 'check' in kwargs:\n  886 |         raise ValueError('error and check arguments may not both be used.')\n  887 |     check = kwargs.get('check', False)  # always set a value for 'check'\n  888 |     if error is not None:\n  889 |         if error == 'raise':\n  890 |             check = True\n  891 |         del kwargs['error']\n  892 |     kwargs['check'] = check\n  893 | \n  894 |     # Most SCons tools/tests expect not to fail on things like missing files.\n  895 |     # check=True (or error=\"raise\") means we're okay to take an exception;\n  896 |     # else we catch the likely exception and construct a dummy\n  897 |     # CompletedProcess instance.\n  898 |     # Note pylint can't see we always include 'check' in kwargs: suppress.\n  899 |     if check:\n  900 |         cp = subprocess.run(*args, **kwargs)  # pylint: disable=subprocess-run-check\n  901 |     else:\n  902 |         try:\n  903 |             cp = subprocess.run(*args, **kwargs)  # pylint: disable=subprocess-run-check\n  904 |         except OSError as exc:\n  905 |             argline = ' '.join(*args)\n  906 |             cp = subprocess.CompletedProcess(\n  907 |                 args=argline, returncode=1, stdout=\"\", stderr=\"\"\n  908 |             )\n  909 | \n  910 |     return cp\n  911 | \n  912 | \n  913 | def _subproc(scons_env, cmd, error='ignore', **kw):\n  914 |     \"\"\"Wrapper for subprocess.Popen which pulls from construction env.\n  915 | \n  916 |     Use for calls to subprocess which need to interpolate values from\n  917 |     an SCons construction environment into the environment passed to\n  918 |     subprocess.  Adds an an error-handling argument.  Adds ability\n  919 |     to specify std{in,out,err} with \"'devnull'\" tag.\n  920 | \n  921 |     .. deprecated:: 4.6\n  922 |     \"\"\"\n  923 |     # TODO: just uses subprocess.DEVNULL now, we can drop the \"devnull\"\n  924 |     # string now - it is a holdover from Py2, which didn't have DEVNULL.\n  925 |     for stream in 'stdin', 'stdout', 'stderr':\n  926 |         io = kw.get(stream)\n  927 |         if is_String(io) and io == 'devnull':\n  928 |             kw[stream] = DEVNULL\n  929 | \n  930 |     # Figure out what execution environment to use\n  931 |     ENV = kw.get('env', None)\n  932 |     if ENV is None: ENV = get_default_ENV(scons_env)\n  933 | \n  934 |     kw['env'] = SCons.Util.sanitize_shell_env(ENV)\n  935 | \n  936 |     try:\n  937 |         pobj = subprocess.Popen(cmd, **kw)\n  938 |     except OSError as e:\n  939 |         if error == 'raise': raise\n  940 |         # return a dummy Popen instance that only returns error\n  941 |         class dummyPopen:\n  942 |             def __init__(self, e) -> None:\n  943 |                 self.exception = e\n  944 |             # Add the following two to enable using the return value as a context manager\n  945 |             # for example\n  946 |             #    with Action._subproc(...) as po:\n  947 |             #       logic here which uses po\n  948 | \n  949 |             def __enter__(self):\n  950 |                 return self\n  951 | \n  952 |             def __exit__(self, *args) -> None:\n  953 |                 pass\n  954 | \n  955 |             def commun <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible','info'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const HAS_EASY = FINDINGS.some(f => f.easy);
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(), easyOnly: false,
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.easyOnly)          p.set('e',   '1');
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('e'))   S.easyOnly = p.get('e') === '1';
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      const easyStr = f.easy ? ' ⚡ easy' : '';
      out += '### ' + f.id + sevStr + easyStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    const easyStr = f.easy ? ' ⚡' : '';
    lines.push('- [ ] - ' + f.id + sevStr + easyStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.easy) lns.push(pad('easy') + '= true');
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + (f.easy ? ' ⚡ easy' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.easy ? 'easy quick win' : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.easyOnly && !f.easy)                   return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.easy ? '<span class="badge easy-badge" style="cursor:default" title="Easy to verify &amp; fix - no deep knowledge of the code, SDK or technology required">\u26a1 Easy</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_EASY)
    h += '<div class="filter-row"><span class="filter-lbl">Quick wins:</span>'
       + '<button class="badge easy-badge" data-easy="1">\u26a1 Easy only</button></div>';

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-easy]'))   b.classList.toggle('off', !S.easyOnly);
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Event delegation
document.getElementById('filterbar').addEventListener('click', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-easy]');
  if (!b) return;
  if (b.dataset.easy) {
    S.easyOnly = !S.easyOnly;
  }
  else if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES    : STATUSES;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
