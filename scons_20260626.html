<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.sev-info    {background:#0c2a2a;color:#5eead4;border-color:#0f766e}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.easy-badge{background:#052e16;color:#86efac;border-color:#16a34a}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>
<body>
<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","easy":false,"description":"query_versions() calls list.sort() with a comparator function (versions.sort(versrt)). Python 3's list.sort accepts only a 'key' keyword argument, not a positional cmp function; this raises TypeError: sort() takes no positional arguments whenever the function runs (i.e. whenever a .NET framework root is found). The comparator itself is also broken: it compares split version lists as nested string lists ('10' < '9') and, despite the comment claiming a backwards sort, returns a normal ascending comparison.","fix":"Use versions.sort(key=cmp_to_key(versrt)) (importing cmp_to_key from functools), or rewrite to sort with a proper key that maps each component to int. Also reverse the order or document the intended direction correctly.","locations":[{"ref":"SCons/Tool/MSCommon/netframework.py:53-76","code":"   53 | def query_versions():\n   54 |     froot = find_framework_root()\n   55 |     if froot:\n   56 |         contents = os.listdir(froot)\n   57 | \n   58 |         l = re.compile('v[0-9]+.*')\n   59 |         versions = [e for e in contents if l.match(e)]\n   60 | \n   61 |         def versrt(a,b):\n   62 |             # since version numbers aren't really floats...\n   63 |             aa = a[1:]\n   64 |             bb = b[1:]\n   65 |             aal = aa.split('.')\n   66 |             bbl = bb.split('.')\n   67 |             # sequence comparison in python is lexicographical\n   68 |             # which is exactly what we want.\n   69 |             # Note we sort backwards so the highest version is first.\n   70 |             return (aal > bbl) - (aal < bbl)\n   71 | \n   72 |         versions.sort(versrt)\n   73 |     else:\n   74 |         versions = []\n   75 | \n   76 |     return versions","lines":24,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/MSCommon/netframework.py#L53-L76"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"GenerateSolution's error handler references an undefined name 'dspfile'. The function only defines 'builddswfile' and 'dswfile'; there is no 'dspfile' local. If open() of the placeholder file fails, the except branch raises NameError instead of printing the intended diagnostic, masking the real OSError. (The analogous handler in GenerateProject is fine because 'dspfile' is defined there.)","fix":"Change the message to reference str(dswfile) (or str(builddswfile)), matching the variables actually in scope.","locations":[{"ref":"SCons/Tool/msvs.py:1924-1935","code":" 1924 | def GenerateSolution(target, source, env) -> None:\n 1925 | \n 1926 |     builddswfile = target[0]\n 1927 |     dswfile = builddswfile.srcnode()\n 1928 | \n 1929 |     if dswfile is not builddswfile:\n 1930 | \n 1931 |         try:\n 1932 |             bdsw = open(str(builddswfile), \"w+\")\n 1933 |         except OSError as detail:\n 1934 |             print('Unable to open \"' + str(dspfile) + '\" for writing:',detail,'\\n')\n 1935 |             raise","lines":12,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/msvs.py#L1924-L1935"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"get_default_arch() reads InstalledVSMap.get(env['MSVS_VERSION']) but InstalledVSMap is a module global initialized to None and only populated by get_installed_visual_studios(). The only caller, merge_default_version(), calls get_default_version() first, but get_default_version() skips _get_installed_vss() (and thus skips populating InstalledVSMap) when env already contains an 'MSVS' dict (e.g. a cloned/cached environment). On that path InstalledVSMap is still None and InstalledVSMap.get(...) raises AttributeError: 'NoneType' object has no attribute 'get'.","fix":"Guarantee population before access, e.g. call get_installed_visual_studios(env) at the top of get_default_arch(), or guard: msvs = (InstalledVSMap or {}).get(env['MSVS_VERSION']).","locations":[{"ref":"SCons/Tool/MSCommon/vs.py:582-602","code":"  582 | def get_default_arch(env):\n  583 |     \"\"\"Return the default arch to use for MSVS\n  584 | \n  585 |     if no version was requested by the user through the MSVS_ARCH environment\n  586 |     variable, select x86\n  587 | \n  588 |     Return\n  589 |     ------\n  590 |     arch: str\n  591 |     \"\"\"\n  592 |     arch = env.get('MSVS_ARCH', 'x86')\n  593 | \n  594 |     msvs = InstalledVSMap.get(env['MSVS_VERSION'])\n  595 | \n  596 |     if not msvs:\n  597 |         arch = 'x86'\n  598 |     elif arch not in msvs.get_supported_arch():\n  599 |         fmt = \"Visual Studio version %s does not support architecture %s\"\n  600 |         raise SCons.Errors.UserError(fmt % (env['MSVS_VERSION'], arch))\n  601 | \n  602 |     return arch","lines":21,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/MSCommon/vs.py#L582-L602"},{"ref":"SCons/Tool/MSCommon/vs.py:562-580","code":"  562 |     if 'MSVS' not in env or not SCons.Util.is_Dict(env['MSVS']):\n  563 |         # get all versions, and remember them for speed later\n  564 |         versions = _get_installed_vss(env)\n  565 |         env['MSVS'] = {'VERSIONS' : versions}\n  566 |     else:\n  567 |         versions = env['MSVS'].get('VERSIONS', [])\n  568 | \n  569 |     if 'MSVS_VERSION' not in env:\n  570 |         if versions:\n  571 |             env['MSVS_VERSION'] = versions[0] #use highest version by default\n  572 |         else:\n  573 |             debug('WARNING: no installed versions found, '\n  574 |                   'using first in SupportedVSList (%s)',\n  575 |                   SupportedVSList[0].version)\n  576 |             env['MSVS_VERSION'] = SupportedVSList[0].version\n  577 | \n  578 |     env['MSVS']['VERSION'] = env['MSVS_VERSION']\n  579 | \n  580 |     return env['MSVS_VERSION']","lines":19,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/MSCommon/vs.py#L562-L580"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"InternalLaTeXAuxAction returns the local variable `result` at the end, but `result` is only assigned inside the `while must_rerun_latex and count < int(env.subst('$LATEXRETRIES'))` loop. If $LATEXRETRIES substitutes to 0 (or any value <= 0), the loop body never executes and the final `return result` raises UnboundLocalError. A user setting env['LATEXRETRIES']=0 to disable retries therefore crashes the build instead of running latex once.","fix":"Initialize result = 0 before the while loop (or use a do-while structure that always runs latex at least once).","locations":[{"ref":"SCons/Tool/tex.py:278-491","code":"  278 |     count = 0\n  279 | \n  280 |     while must_rerun_latex and count < int(env.subst('$LATEXRETRIES')):\n  281 |         result = XXXLaTeXAction(target, source, env)\n  282 |         if result != 0:\n  283 |             return result\n  284 | \n  285 |         count = count + 1\n  286 | \n  287 |         must_rerun_latex = False\n  288 |         # Decide if various things need to be run, or run again.\n  289 | \n  290 |         # Read the log file to find warnings/errors\n  291 |         logfilename = targetbase + '.log'\n  292 |         logContent = ''\n  293 |         if os.path.isfile(logfilename):\n  294 |             with open(logfilename, \"rb\") as f:\n  295 |                 logContent = f.read().decode(errors='replace')\n  296 | \n  297 |         # Read the fls file to find all .aux files\n  298 |         flsfilename = targetbase + '.fls'\n  299 |         flsContent = ''\n  300 |         auxfiles = []\n  301 |         if os.path.isfile(flsfilename):\n  302 |             with open(flsfilename) as f:\n  303 |                 flsContent = f.read()\n  304 |             auxfiles = openout_aux_re.findall(flsContent)\n  305 |             # remove duplicates\n  306 |             dups = {}\n  307 |             for x in auxfiles:\n  308 |                 dups[x] = 1\n  309 |             auxfiles = list(dups.keys())\n  310 | \n  311 |         bcffiles = []\n  312 |         if os.path.isfile(flsfilename):\n  313 |             with open(flsfilename) as f:\n  314 |                 flsContent = f.read()\n  315 |             bcffiles = openout_bcf_re.findall(flsContent)\n  316 |             # remove duplicates\n  317 |             dups = {}\n  318 |             for x in bcffiles:\n  319 |                 dups[x] = 1\n  320 |             bcffiles = list(dups.keys())\n  321 | \n  322 |         if Verbose:\n  323 |             print(\"auxfiles \",auxfiles)\n  324 |             print(\"bcffiles \",bcffiles)\n  325 | \n  326 |         # Now decide if bibtex will need to be run.\n  327 |         # The information that bibtex reads from the .aux file is\n  328 |         # pass-independent. If we find (below) that the .bbl file is unchanged,\n  329 |         # then the last latex saw a correct bibliography.\n  330 |         # Therefore only do this once\n  331 |         # Go through all .aux files and remember the files already done.\n  332 |         for auxfilename in auxfiles:\n  333 |             if auxfilename not in already_bibtexed:\n  334 |                 already_bibtexed.append(auxfilename)\n  335 |                 target_aux = os.path.join(targetdir, auxfilename)\n  336 |                 if os.path.isfile(target_aux):\n  337 |                     with open(target_aux) as f:\n  338 |                         content = f.read()\n  339 |                     if 'bibdata' in content:\n  340 |                         if Verbose:\n  341 |                             print(\"Need to run bibtex on \",auxfilename)\n  342 |                         bibfile = env.fs.File(SCons.Util.splitext(target_aux)[0])\n  343 |                         result = BibTeXAction(bibfile, bibfile, env)\n  344 |                         if result != 0:\n  345 |                             check_file_error_message(env['BIBTEX'], 'blg')\n  346 |                         check_content_hash(suffix_nodes[\".bbl\"], \".bbl\")\n  347 | \n  348 |         # Now decide if biber will need to be run.\n  349 |         # When the backend for biblatex is biber (by choice or default) the\n  350 |         # citation information is put in the .bcf file.\n  351 |         # The information that biber reads from the .bcf file is\n  352 |         # pass-independent. If we find (below) that the .bbl file is unchanged,\n  353 |         # then the last latex saw a correct bibliography.\n  354 |         # Therefore only do this once\n  355 |         # Go through all .bcf files and remember the files already done.\n  356 |         for bcffilename in bcffiles:\n  357 |             if bcffilename not in already_bibtexed:\n  358 |                 already_bibtexed.append(bcffilename)\n  359 |                 target_bcf = os.path.join(targetdir, bcffilename)\n  360 |                 if os.path.isfile(target_bcf):\n  361 |                     with open(target_bcf) as f:\n  362 |                         content = f.read()\n  363 |                     if 'bibdata' in content:\n  364 |                         if Verbose:\n  365 |                             print(\"Need to run biber on \",bcffilename)\n  366 |                         bibfile = env.fs.File(SCons.Util.splitext(target_bcf)[0])\n  367 |                         result = BiberAction(bibfile, bibfile, env)\n  368 |                         if result != 0:\n  369 |                             check_file_error_message(env['BIBER'], 'blg')\n  370 |                         check_content_hash(suffix_nodes[\".bbl\"], \".bbl\")\n  371 | \n  372 |         # Now decide if latex will need to be run again due to index.\n  373 |         if check_content_hash(suffix_nodes['.idx'], '.idx') or (count == 1 and run_makeindex):\n  374 |             # We must run makeindex\n  375 |             if Verbose:\n  376 |                 print(\"Need to run makeindex\")\n  377 |             idxfile = suffix_nodes['.idx']\n  378 |             result = MakeIndexAction(idxfile, idxfile, env)\n  379 |             if result != 0:\n  380 |                 check_file_error_message(env['MAKEINDEX'], 'ilg')\n  381 |                 return result\n  382 | \n  383 |         # TO-DO: need to add a way for the user to extend this list for whatever\n  384 |         # auxiliary files they create in other (or their own) packages\n  385 |         # Harder is case is where an action needs to be called -- that should be rare (I hope?)\n  386 | \n  387 |         for index in check_suffixes:\n  388 |             check_content_hash(suffix_nodes[index], index)\n  389 | \n  390 |         # Now decide if latex will need to be run again due to nomenclature.\n  391 |         if check_content_hash(suffix_nodes['.nlo'], '.nlo') or (count == 1 and run_nomenclature):\n  392 |             # We must run makeindex\n  393 |             if Verbose:\n  394 |                 print(\"Need to run makeindex for nomenclature\")\n  395 |             nclfile = suffix_nodes['.nlo']\n  396 |             result = MakeNclAction(nclfile, nclfile, env)\n  397 |             if result != 0:\n  398 |                 check_file_error_message('%s (nomenclature)' % env['MAKENCL'],\n  399 |                                          'nlg')\n  400 |                 #return result\n  401 | \n  402 |         # Now decide if latex will need to be run again due to glossary.\n  403 |         if check_content_hash(suffix_nodes['.glo'], '.glo') or (count == 1 and run_glossaries) or (count == 1 and run_glossary):\n  404 |             # We must run makeindex\n  405 |             if Verbose:\n  406 |                 print(\"Need to run makeindex for glossary\")\n  407 |             glofile = suffix_nodes['.glo']\n  408 |             result = MakeGlossaryAction(glofile, glofil ns/Subst.py:598-618","code":"  598 |                 key = s[1:]\n  599 |                 if key[0] == '{':\n  600 |                     key = key[1:-1]\n  601 | \n  602 |                 # Store for error messages if we fail to expand the\n  603 |                 # value\n  604 |                 old_s = s\n  605 |                 s = None\n  606 |                 if key in lvars:\n  607 |                      s = lvars[key]\n  608 |                 elif key in self.gvars:\n  609 |                      s = self.gvars[key]\n  610 |                 else:\n  611 |                      try:\n  612 |                          s = eval(key, self.gvars, lvars)\n  613 |                      except KeyboardInterrupt:\n  614 |                          raise\n  615 |                      except Exception as e:\n  616 |                          if e.__class__ in AllowableExceptions:\n  617 |                              return\n  618 |                          raise_exception(e, lvars['TARGETS'], old_s)","lines":21,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Subst.py#L598-L618"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"NewParallel.FakeCondition.wait() calls an undefined name `fatal()` (and has a stray trailing semicolon). FakeCondition is only installed when max_workers == 1, and in that single-worker mode the STALLED state that would trigger a wait() is not currently reachable, so this never fires in practice. But it is a latent landmine: any future change that lets the single-worker path enter the condition-variable wait would raise NameError instead of the intended fatal error, and the code as written is clearly broken.","fix":"Replace `fatal();` with a real failure, e.g. `raise AssertionError('FakeCondition.wait() should never be called in single-worker mode')`.","locations":[{"ref":"SCons/Taskmaster/Job.py:460-465","code":"  460 |     class FakeCondition(object):\n  461 |         def __init__(self, lock):\n  462 |             pass\n  463 |         def wait(self):\n  464 |             fatal();\n  465 |         def notify(self):","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Taskmaster/Job.py#L460-L465"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"GettextCommon.py uses SCons.Errors.StopError (multiple _detect_* functions) and SCons.Action.Action (in _init_po_files) but neither `SCons.Errors` nor `SCons.Action` is imported in this module; only SCons.Util and SCons.Warnings are. It also references SCons.Node.FS.Base / SCons.Node without `import SCons.Node`. These currently work only because those submodules happen to be imported transitively elsewhere before these code paths run; if GettextCommon is exercised in isolation (or import order changes) they raise AttributeError/NameError. _detect_xgettext etc. are the failure path that is supposed to report a missing tool - exactly when robustness matters.","fix":"Add explicit `import SCons.Action`, `import SCons.Errors`, and `import SCons.Node.FS` at the top of GettextCommon.py.","locations":[{"ref":"SCons/Tool/GettextCommon.py:30-35","code":"   30 | import os\n   31 | import re\n   32 | \n   33 | import SCons.Util\n   34 | import SCons.Warnings\n   35 | from SCons.Util.sctypes import _null","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/GettextCommon.py#L30-L35"},{"ref":"SCons/Tool/GettextCommon.py:357","code":"  357 |                 action = SCons.Action.Action('$MSGINITCOM', '$MSGINITCOMSTR')","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/GettextCommon.py#L357"},{"ref":"SCons/Tool/GettextCommon.py:375","code":"  375 |     raise SCons.Errors.StopError(XgettextNotFound, \"Could not detect xgettext\")","lines":1,"link":"https://github.com/SCons/scons/blob/960f3284 eturn file_tests","lines":7,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/tex.py#L668-L674"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In NinjaState.generate(), a NamedTemporaryFile is created with delete=False and written. On the success/skip path it is unlinked or moved, but if filecmp.cmp or any code between creation and shutil.move/os.unlink raises (e.g. the daemon kill/wait_for_process_to_die block at lines 688-699 throwing), the temp file is leaked on disk and never cleaned up.","fix":"Wrap the post-write logic in try/finally that removes temp_ninja_file.name if it still exists, or use a context manager that cleans up on exception.","locations":[{"ref":"SCons/Tool/ninja_tool/NinjaState.py:674-704","code":"  674 |         with NamedTemporaryFile(delete=False, mode='w') as temp_ninja_file:\n  675 |             temp_ninja_file.write(content.getvalue())\n  676 | \n  677 |         if self.env.GetOption('skip_ninja_regen') and os.path.exists(ninja_file_path) and filecmp.cmp(temp_ninja_file.name, ninja_file_path):\n  678 |             os.unlink(temp_ninja_file.name)\n  679 |         else:\n  680 | \n  681 |             daemon_dir = pathlib.Path(tempfile.gettempdir()) / ('scons_daemon_' + str(hashlib.md5(str(get_path(self.env[\"NINJA_DIR\"])).encode()).hexdigest()))\n  682 |             pidfile = None\n  683 |             if os.path.exists(scons_daemon_dirty):\n  684 |                 pidfile = scons_daemon_dirty\n  685 |             elif os.path.exists(daemon_dir / 'pidfile'):\n  686 |                 pidfile = daemon_dir / 'pidfile'\n  687 | \n  688 |             if pidfile:\n  689 |                 with open(pidfile) as f:\n  690 |                     pid = int(f.readline())\n  691 |                     try:\n  692 |                         os.kill(pid, signal.SIGINT)\n  693 |                     except OSError:\n  694 |                         pass\n  695 | \n  696 |                 # wait for the server process to fully killed\n  697 |                 # TODO: update wait_for_process_to_die() to handle timeout and then catch exception\n  698 |                 #       here and do something smart.\n  699 |                 wait_for_process_to_die(pid)\n  700 | \n  701 |             if os.path.exists(scons_daemon_dirty):\n  702 |                 os.unlink(scons_daemon_dirty)\n  703 | \n  704 |             shutil.move(temp_ninja_file.name, ninja_file_path)","lines":31,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/NinjaState.py#L674-L704"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"Builder.src_suffixes() mutates the list that subst_src_suffixes() memoized and returned. subst_src_suffixes() builds `suffixes`, stores it in the memo dict, and returns it (the same list object). src_suffixes() takes that returned reference and calls suffixes.append(s) for every suffix contributed by a src_builder. Because the appended-to list IS the cached object, the memo cache for subst_src_suffixes is permanently polluted with the src_builders' suffixes, which do not belong to this Builder's own src_suffix list. Every later call to subst_src_suffixes(env) for the same env returns the corrupted list, and repeated src_suffixes() calls keep re-appending (growing the list / re-adding the now-cached entries). This corrupts suffix-based dispatch (get_src_suffix, splitext, match_src_suffix) for Builders that have src_builders.","fix":"In src_suffixes(), copy before mutating: `suffixes = list(self.subst_src_suffixes(env))` (or build a fresh result list), so the memoized list owned by subst_src_suffixes is never appended to.","locations":[{"ref":"SCons/Builder.py:837-858","code":"  837 |     @SCons.Memoize.CountDictCall(_subst_src_suffixes_key)\n  838 |     def subst_src_suffixes(self, env):\n  839 |         \"\"\"\n  840 |         The suffix list may contain construction variable expansions,\n  841 |         so we have to evaluate the individual strings.  To avoid doing\n  842 |         this over and over, we memoize the results for each construction\n  843 |         environment.\n  844 |         \"\"\"\n  845 |         memo_key = id(env)\n  846 |         try:\n  847 |             memo_dict = self._memo['subst_src_suffixes']\n  848 |         except KeyError:\n  849 |             memo_dict = {}\n  850 |             self._memo['subst_src_suffixes'] = memo_dict\n  851 |         else:\n  852 |             try:\n  853 |                 return memo_dict[memo_key]\n  854 |             except KeyError:\n  855 |                 pass\n  856 |         suffixes = [env.subst(x) for x in self.src_suffix]\n  857 |         memo_dict[memo_key] = suffixes\n  858 |         return suffixes","lines":22,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Builder.py#L837-L858"},{"ref":"SCons/Builder.py:860-878","code":"  860 |     def src_suffixes(self, env):\n  861 |         \"\"\"\n  862 |         Returns the list of source suffixes for all src_builders of this\n  863 |         Builder.\n  864 | \n  865 |         This is essentially a recursive descent of the src_builder \"tree.\"\n  866 |         (This value isn't cached because there may be changes in a\n  867 |         src_builder many levels deep that we can't see.)\n  868 |         \"\"\"\n  869 |         sdict = {}\n  870 |         suffixes = self.subst_src_suffixes(env)\n  871 |         for s in suffixes:\n  872 |             sdict[s] = 1\n  873 |         for builder in self.get_src_builders(env):\n  874 |             for s in builder.src_suffixes(env):\n  875 |                 if s not in sdict:\n  876 |                     sdict[s] = 1\n  877 |                     suffixes.append(s)\n  878 |         return suffixes","lines":19,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Builder.py#L860-L878"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"EnvironmentValue.parse_value() references two names that do not exist in scope when the value contains a '$': it calls `_dollar_exps.sub(sub_match, args)` but neither `sub_match` (no such function is defined or imported in the module) nor `args` (the method has no such parameter or local; the value lives in `self.value`) exist. Any attempt to parse a string value containing a substitution would raise NameError, which is then swallowed only if it were a TypeError - NameError is not caught, so it propagates. This code path is fundamentally broken.","fix":"Define/import a proper match-substitution callback and use the instance value, e.g. `result = _dollar_exps.sub(self._sub_match, self.value)`, and implement `_sub_match`. Or, since the whole module appears unused, remove it (see separate dead_code finding).","locations":[{"ref":"SCons/EnvironmentValues.py:85-100","code":"   85 |     def parse_value(self) -> None:\n   86 |         \"\"\"\n   87 |         Scan the string and break into component values\n   88 |         \"\"\"\n   89 | \n   90 |         try:\n   91 |             if '$' not in self.value:\n   92 |                 self._parsed = self.value\n   93 |                 self.var_type = ValueTypes.STRING\n   94 |             else:\n   95 |                 # Now we need to parse the specified string\n   96 |                 result = _dollar_exps.sub(sub_match, args)\n   97 |                 print(result)\n   98 |         except TypeError:\n   99 |             # likely callable? either way we don't parse\n  100 |             self._parsed = self.value","lines":16,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/EnvironmentValues.py#L85-L100"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"In get_binfo() the dependency list bdepends is filtered to drop nodes in ignore_set, but the parallel bdependsigs list is built from the unfiltered self.depends. When a Depends() target is also added via Ignore(), bdepends and bdependsigs end up with different lengths and misaligned (node, sig) pairs. This corrupts the stored .sconsign build info and the dependency_map keyed by zip(bdepends, bdependsigs), causing wrong csig-to-file matching and false rebuilds / missed rebuilds. Note bsources is filtered for both list and sigs (correct), bimplicit is filtered for both (correct); only bdepends is inconsistent.","fix":"Build bdependsigs from the already-filtered list: `binfo.bdependsigs = [d.get_ninfo() for d in binfo.bdepends]`, mirroring the bsources/bimplicit handling.","locations":[{"ref":"SCons/Node/__init__.py:1210-1211","code":" 1210 |         binfo.bdepends = [d for d in self.depends if d not in ignore_set]\n 1211 |         binfo.bdependsigs = [d.get_ninfo() for d in self.depends]","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/__init__.py#L1210-L1211"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"When restoring the SConscript file's '__file__' global after exec, the key is the bare name __file__ (the SConscript.py module's own file path) instead of the string '__file__'. The code deletes globals['__file__'] before exec (line 272) intending to restore the user's previous value, but the restore writes it under whatever path SCons.Script.SConscript.__file__ evaluates to, never under '__file__'. The intended global is never restored, and a spurious key equal to the module path is injected into the SConscript globals.","fix":"Use the string key: call_stack[-1].globals['__file__'] = old_file (i.e. update({'__file__': old_file})).","locations":[{"ref":"SCons/Script/SConscript.py:297-298","code":"  297 |                         if old_file is not None:\n  298 |                             call_stack[-1].globals.update({__file__:old_file})","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Script/SConscript.py#L297-L298"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"The docbook fallback XML scanner regexes are broken. include_re and sentity_re are raw strings that contain \\\\s and \\\\n (double backslash), so the compiled patterns match a literal backslash followed by 's'/'n' instead of the whitespace/newline metacharacters. Verified: include_re.findall('fileref=\"img.png\"') returns []. When lxml is unavailable (or DOCBOOK_PREFER_XSLTPROC / DOCBOOK_SCANENT paths fall through to pattern matching) implicit dependencies on referenced images and SYSTEM entities are silently never detected, so changes to those files do not trigger rebuilds. The character class [\"|\\'] also wrongly treats '|' as a quote delimiter.","fix":"Use single-backslash escapes in the raw strings: r'fileref\\s*=\\s*[\"\\']([^\\n]*)[\"\\']' and r'<!ENTITY\\s+%*\\s*[^\\s]+\\s+SYSTEM\\s+[\"\\']([^\\n]*)[\"\\']>'. Drop the spurious '|' from the quote character classes.","locations":[{"ref":"SCons/Tool/docbook/__init__.py:219-220","code":"  219 | include_re = re.compile(r'fileref\\\\s*=\\\\s*[\"|\\']([^\\\\n]*)[\"|\\']')\n  220 | sentity_re = re.compile(r'<!ENTITY\\\\s+%*\\\\s*[^\\\\s]+\\\\s+SYSTEM\\\\s+[\"|\\']([^\\\\n]*)[\"|\\']>')","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/docbook/__init__.py#L219-L220"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"shlib_generator passes a bare string to list.extend: `if no_import_lib: cmd.extend('-noimplib')`. list.extend iterates the string, appending nine separate one-character tokens ['-','n','o','i','m','p','l','i','b'] to the command instead of the single flag '-noimplib'. Whenever no_import_lib is set, the generated Metrowerks linker command line is corrupted. Contrast the correct list usage on the surrounding lines (cmd.extend(['-o', dll]) etc.).","fix":"Use `cmd.append('-noimplib')` (or `cmd.extend(['-noimplib'])`).","locations":[{"ref":"SCons/Tool/mwld.py:70","code":"   70 |     if no_import_lib: cmd.extend('-noimplib')","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/mwld.py#L70"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"install_pool size is computed as `num_jobs / 2`, which is a float in Python 3 (e.g. 8 jobs -> 4.0, 5 jobs -> 2.5). This float is later written into the ninja file as the pool depth (via `ninja.pool(pool_name, min(..., size))` at line 411). Ninja requires an integer depth; a value like `2.5` or even `4.0` written to build.ninja is rejected/parsed incorrectly by ninja, breaking the generated build for any odd job count or any platform that strictly parses ints.","fix":"Use integer division: `\"install_pool\": num_jobs // 2`. Also guard against 0 (e.g. `max(1, num_jobs // 2)`).","locations":[{"ref":"SCons/Tool/ninja_tool/NinjaState.py:375-378","code":"  375 |         self.pools.update({\n  376 |             \"local_pool\": num_jobs,\n  377 |             \"install_pool\": num_jobs / 2,\n  378 |         })","lines":4,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/NinjaState.py#L375-L378"},{"ref":"SCons/Tool/ninja_tool/NinjaState.py:410-411","code":"  410 |         for pool_name, size in sorted(self.pools.items()):\n  411 |             ninja.pool(pool_name, min(self.env.get('NINJA_MAX_JOBS', size), size))","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/NinjaState.py#L410-L411"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"ActionBase.__eq__ compares self.__dict__ (a dict) against other (an Action object, not its __dict__). For two ActionBase instances this is dict == Action, which is always False, so two structurally identical actions never compare equal. It also makes equality non-symmetric and can misbehave when an Action is compared against a bare dict. The recent 'Harden Tool equality' work shows equality semantics matter here.","fix":"Compare against the other object's __dict__ with a type guard, e.g. `return isinstance(other, ActionBase) and self.__dict__ == other.__dict__` (or define a precise equality per subclass).","locations":[{"ref":"SCons/Action.py:536-537","code":"  536 |     def __eq__(self, other):\n  537 |         return self.__dict__ == other","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Action.py#L536-L537"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In CheckLib, the variable `calltext` is only assigned inside `if call:` (lines 694-701), but the `for lib_name` loop unconditionally uses `calltext` inside `if call:` again at line 712. That happens to be safe because both are guarded by `if call`. However `calltext` is computed once before the loop while `call` may have been derived from `func_name` inside the loop-independent block - the real subtlety: when `func_name` is given but `call` was None at the time the `if call:` calltext block ran, `call` gets set later (line 683-684) but `calltext` was never computed, yet the display block at 711-713 reads `calltext`. Trace: if func_name set and call None, line 683 sets `call='func();'`, but the `if call:` calltext block at 694 ran earlier when call was still None, so calltext is undefined; then line 711 `if call:` is now true and line 712 references the undefined `calltext`, raising NameError.","fix":"Compute `calltext` after `call` is finalized (move the calltext computation to just before the loop, after the func_name->call defaulting), or compute it inside the loop's `if call:` branch.","locations":[{"ref":"SCons/Conftest.py:683-713","code":"  683 |         if not call:\n  684 |             call = \"%s();\" % func_name\n  685 | \n  686 |     # if no function to test, leave main() blank\n  687 |     text = text + \"\"\"\n  688 | int main(void) {\n  689 |   %s\n  690 | return 0;\n  691 | }\n  692 | \"\"\" % (call or \"\")\n  693 | \n  694 |     if call:\n  695 |         i = call.find(\"\\n\")\n  696 |         if i > 0:\n  697 |             calltext = call[:i] + \"..\"\n  698 |         elif call[-1] == ';':\n  699 |             calltext = call[:-1]\n  700 |         else:\n  701 |             calltext = call\n  702 | \n  703 |     for lib_name in libs:\n  704 | \n  705 |         lang, suffix, msg = _lang2suffix(language)\n  706 |         if msg:\n  707 |             context.Display(\"Cannot check for library %s: %s\\n\" % (lib_name, msg))\n  708 |             return msg\n  709 | \n  710 |         # if a function was specified to run in main(), say it\n  711 |         if call:\n  712 |                 context.Display(\"Checking for %s in %s library %s... \"\n  713 |                                 % (calltext, lang, lib_name))","lines":31,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Conftest.py#L683-L713"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"Counter.__eq__ returns True when the other object lacks a key() method. The `except AttributeError: return True` branch means a Counter compares equal to essentially any unrelated object (e.g. `counter == 5` or `counter == None` is True). Equality on mismatched/incomparable types should be False, not True. This can cause wrong containment/`in` results and surprising behavior if Counter objects are ever compared against non-Counter values.","fix":"Return NotImplemented (or False) on AttributeError instead of True: `except AttributeError: return NotImplemented`.","locations":[{"ref":"SCons/Memoize.py:125-129","code":"  125 |     def __eq__(self, other):\n  126 |         try:\n  127 |             return self.key() == other.key()\n  128 |         except AttributeError:\n  129 |             return True","lines":5,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Memoize.py#L125-L129"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Dir.rdir() has a copy/paste bug in its filter: it tests `isinstance(dir, (Dir, Entry))` where `dir` is the repository directory being iterated, but the analogous code in File.rfile()/find_repo_file() tests `isinstance(node, (File, Entry))` on the candidate node. Since `dir` (a repo dir from get_all_rdirs) is essentially always a Dir, the isinstance check is effectively always true and does not actually validate the looked-up `node`. The intent was almost certainly to validate `node`.","fix":"Change the isinstance test to operate on `node` (e.g. `isinstance(node, (Dir, Entry))`), matching the node-validation pattern used in rfile().","locations":[{"ref":"SCons/Node/FS.py:1980-1988","code":" 1980 |     def rdir(self) -> DirNode:\n 1981 |         if not self.exists():\n 1982 |             norm_name = _my_normcase(self.name)\n 1983 |             for dir in self.dir.get_all_rdirs():\n 1984 |                 try: node = dir.entries[norm_name]\n 1985 |                 except KeyError: node = dir.dir_on_disk(self.name)\n 1986 |                 if node and node.exists() and isinstance(dir, (Dir, Entry)):\n 1987 |                     return node\n 1988 |         return self","lines":9,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/FS.py#L1980-L1988"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"_get_previous_signatures() has a fall-through block (lines 3455-3470) guarded by `if not df:`. The debug print on line 3463 references `s`, the leftover loop variable from the earlier `for s in c_strs` loop, not the freshly computed `c_str`; this is only reached when MD5_TIMESTAMP_DEBUG is on so it is cosmetic, but more importantly the `except AttributeError` handler references `c_str` in the error message, while an AttributeError can only originate from `self.get_path()` (before c_str is assigned), so the handler would itself raise NameError/UnboundLocalError on c_str instead of producing the intended FileBuildInfoFileToCsigMappingError.","fix":"Compute c_str before the try (or guard the handler) so the error message has a defined value; use c_str (not s) in the debug print. Capture the path string prior to the dmap.get() that can raise.","locations":[{"ref":"SCons/Node/FS.py:3455-3470","code":" 3455 |         # Lastly use nodes get_path() to generate string and see if that's in dmap\n 3456 |         if not df:\n 3457 |             try:\n 3458 |                 # this should yield a path which matches what's in the sconsign\n 3459 |                 c_str = self.get_path()\n 3460 |                 if os.altsep:\n 3461 |                     c_str = c_str.replace(os.sep, os.altsep)\n 3462 | \n 3463 |                 if MD5_TIMESTAMP_DEBUG: print(\"Checking if self.get_path is in map (now with strings)  :%s\" % s)\n 3464 | \n 3465 |                 df = dmap.get(c_str, None)\n 3466 | \n 3467 |             except AttributeError:\n 3468 |                 raise FileBuildInfoFileToCsigMappingError(\"No mapping from file name to content signature for :%s\"%c_str)\n 3469 | \n 3470 |         return df","lines":16,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/FS.py#L3455-L3470"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"exists_file() returns Python None instead of False on the 'source file does not exist, unlink old variant copy' path (line 169), while the function is typed -> bool and other branches return the result of exists_base (a bool). Returning None vs False is relied upon by the comment ('Return None explicitly because the Base.exists() call above will have cached its value') but propagates an untyped None through Base.exists()/File.exists() which is then memoized; downstream boolean callers are fine but type contract and any `is False` checks are violated.","fix":"If the None is intentional for cache semantics document it clearly; otherwise return False. At minimum align the return annotation with the actual possible return values (bool | None).","locations":[{"ref":"SCons/Node/__init__.py:148-170","code":"  148 | def exists_file(node) -> bool:\n  149 |     # Duplicate from source path if we are set up to do this.\n  150 |     if node.duplicate and not node.is_derived() and not node.linked:\n  151 |         src = node.srcnode()\n  152 |         if src is not node:\n  153 |             # At this point, src is meant to be copied in a variant directory.\n  154 |             src = src.rfile()\n  155 |             if src.get_abspath() != node.get_abspath():\n  156 |                 if src.exists():\n  157 |                     node.do_duplicate(src)\n  158 |                     # Can't return 1 here because the duplication might\n  159 |                     # not actually occur if the -n option is being used.\n  160 |                 else:\n  161 |                     # The source file does not exist.  Make sure no old\n  162 |                     # copy remains in the variant directory.\n  163 |                     if print_duplicate:\n  164 |                         print(\"dup: no src for %s, unlinking old variant copy\" % node)\n  165 |                     if exists_base(node) or node.islink():\n  166 |                         node.fs.unlink(node.get_internal_path())\n  167 |                     # Return None explicitly because the Base.exists() call\n  168 |                     # above will have cached its value if the file existed.\n  169 |                     return None\n  170 |     return exists_base(node)","lines":23,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/__init__.py#L148-L170"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"dictify_CPPDEFINES string-define parsing uses `name, value = c.split('=')` which raises ValueError (caught -> treated as bare define) for any define containing more than one '=', e.g. '-DFOO=a=b' or 'FOO=bar=baz'. A value legitimately containing '=' is therefore silently dropped to {c: None} instead of {name: rest}. Same pattern for the single-string-cppdefines branch.","fix":"Use c.split('=', 1) so only the first '=' splits name from value.","locations":[{"ref":"SCons/Scanner/C.py:156-161","code":"  156 |             elif SCons.Util.is_String(c):\n  157 |                 try:\n  158 |                     name, value = c.split('=')\n  159 |                     result[name] = value\n  160 |                 except ValueError:\n  161 |                     result[c] = None","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Scanner/C.py#L156-L161"},{"ref":"SCons/Scanner/C.py:169-175","code":"  169 |     if SCons.Util.is_String(cppdefines):\n  170 |         # single macro define in a string\n  171 |         try:\n  172 |             name, value = cppdefines.split('=')\n  173 |             return {name: value}\n  174 |         except ValueError:\n  175 |             return {cppdefines: None}","lines":7,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Scanner/C.py#L169-L175"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"mssdk_exists(version) returns 'version in sdks' where get_installed_sdks() returns InstalledSDKList, a list of SDKDefinition objects, not version strings. A membership test of a version string against SDKDefinition objects is always False, so mssdk_exists('6.1') etc. can never return True even when that SDK is installed. The version=None branch (len(sdks) > 0) works, only the explicit-version path is wrong.","fix":"Compare against versions, e.g. return version in SupportedSDKMap and get_sdk_by_version(version) is not None, or build a set of installed version strings (sdk.version for sdk in sdks) and test membership in that.","locations":[{"ref":"SCons/Tool/MSCommon/sdk.py:402-406","code":"  402 | def mssdk_exists(version=None):\n  403 |     sdks = get_installed_sdks()\n  404 |     if version is None:\n  405 |         return len(sdks) > 0\n  406 |     return version in sdks","lines":5,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/MSCommon/sdk.py#L402-L406"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In vswhere_update_msvc_map the MSVCInstance is built with vc_component_suffix=component_suffix, but component_suffix is never defined in this function. It silently resolves to the module-level loop variable left over from the for-loop at line 832-842, whose final value is always 'Exp' (the WDExpress entry). Every MSVCInstance therefore records vc_component_suffix='Exp' regardless of the real edition. The correct value is _VSWHERE_COMPONENTID_SUFFIX[component_id]. The field is currently never read, so impact is latent, but it is a real correctness bug waiting to bite any future consumer.","fix":"Set vc_component_suffix=_VSWHERE_COMPONENTID_SUFFIX[component_id] (analogous to how scons_suffix is fetched from _VSWHERE_COMPONENTID_SCONS_SUFFIX a few lines above).","locations":[{"ref":"SCons/Tool/MSCommon/vc.py:1493-1502","code":" 1493 |             msvc_instance = MSVCInstance(\n 1494 |                 vc_path = vc_path,\n 1495 |                 vc_version = vc_version,\n 1496 |                 vc_version_numeric = float(vc_version),\n 1497 |                 vc_version_scons = vc_version_scons,\n 1498 |                 vc_release = is_release,\n 1499 |                 vc_component_id = component_id,\n 1500 |                 vc_component_rank = component_rank,\n 1501 |                 vc_component_suffix = component_suffix,\n 1502 |             )","lines":10,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/MSCommon/vc.py#L1493-L1502"},{"ref":"SCons/Tool/MSCommon/vc.py:832-842","code":"  832 | for component_id, component_rank, component_suffix, scons_suffix in (\n  833 |     ('Enterprise',   140, 'Ent', ''),\n  834 |     ('Professional', 130, 'Pro', ''),\n  835 |     ('Community',    120, 'Com', ''),\n  836 |     ('BuildTools',   110, 'BT',  ''),\n  837 |     ('WDExpress',    100, 'Exp', 'Exp'),\n  838 | ):\n  839 |     _VSWHERE_COMPONENTID_CANDIDATES.add(component_id)\n  840 |     _VSWHERE_COMPONENTID_RANKING[component_id] = component_rank\n  841 |     _VSWHERE_COMPONENTID_SUFFIX[component_id] = component_suffix\n  842 |     _VSWHERE_COMPONENTID_SCONS_SUFFIX[component_id] = scons_suffix","lines":11,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/MSCommon/vc.py#L832-L842"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Three cyglink emitter/helper functions hardcode verbose = True, so cyglink unconditionally prints internal debug lines (target paths, import lib names, symlink maps) to stdout on every shared-library/loadable-module build. Every other emitter in linkCommon and the sibling tools defaults verbose/Verbose to False. This is noisy debug output left enabled in shipping code.","fix":"Set verbose = False in cyglink_lib_emitter and cyglink_shlib_symlink_emitter, matching SharedLibrary.shlib_symlink_emitter an ce, env):\n  322 |     \"\"\" An emitter that adds all target files to the list stored in the\n  323 |     _INSTALLED_FILES global variable. This way all installed files of one\n  324 |     scons call will be collected.\n  325 |     \"\"\"\n  326 |     global _INSTALLED_FILES, _UNIQUE_INSTALLED_FILES\n  327 |     Verbose = False\n  328 |     _INSTALLED_FILES.extend(target)\n  329 |     if Verbose:\n  330 |         print(f\"add_versioned_targets_to_INSTALLED_FILES: target={list(map(str, target))!r}\")\n  331 |     symlinks = listShlibLinksToInstall(target[0], source, env)\n  332 |     if symlinks:\n  333 |         EmitLibSymlinks(env, symlinks, target[0])\n  334 |     _UNIQUE_INSTALLED_FILES = None\n  335 |     return (target, source)","lines":26,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/install.py#L310-L335"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"`SCons.Warnings.SConsWarning(...)` is merely constructing a warning/exception object and discarding it; it is never raised nor passed to SCons.Warnings.warn(). So the intended 'unhandled function action' warning is never emitted to the user. The same dead-construction pattern appears for the 'multiple ninja files not supported' message. (Note: __init__.py:164 correctly `raise`s it.)","fix":"Use `SCons.Warnings.warn(NinjaExperimentalWarning, msg)` or `SCons.Warnings.warn(SCons.Warnings.SConsWarning, msg)` instead of constructing and dropping the object.","locations":[{"ref":"SCons/Tool/ninja_tool/NinjaState.py:809-815","code":"  809 |         SCons.Warnings.SConsWarning(\n  810 |             \"Found unhandled function action {}, \"\n  811 |             \" generating scons command to build\\n\"\n  812 |             \"Note: this is less efficient than Ninja,\"\n  813 |             \" you can write your own ninja build generator for\"\n  814 |             \" this function using NinjaRegisterFunctionHandler\".format(name)\n  815 |         )","lines":7,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/NinjaState.py#L809-L815"},{"ref":"SCons/Tool/ninja_tool/__init__.py:234-235","code":"  234 |         if str(NINJA_STATE.ninja_file) != env[\"NINJA_FILE_NAME\"]:\n  235 |             SCons.Warnings.SConsWarning(\"Generating multiple ninja files not supported, set ninja file name before tool initialization.\")","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/__init__.py#L234-L235"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In the daemon, a build request is recorded as finished (`shared_state.finished_building += [building_node]`) immediately after writing the build command to scons stdin, BEFORE scons reports the node built or errored. The waiting GET handler's predicate `build[0] in finished_building` therefore becomes true as soon as the command is dispatched, not when the node is actually built. The error-reporting loop checking error_nodes can thus race: the handler may return 200 before the subsequent 'building terminated because of errors' line is processed, masking build failures.","fix":"Only append to finished_building after the daemon observes the scons>>> prompt (build complete) or the error line for that node, not right after writing to stdin.","locations":[{"ref":"SCons/Tool/ninja_tool/ninja_scons_daemon.py:235-242","code":"  235 |                     input_command = f'build {quote_spaces(building_node)}\\n'\n  236 |                     daemon_log(\"input: \" + input_command.strip())\n  237 | \n  238 |                     p.stdin.write(input_command.encode(\"utf-8\"))\n  239 |                     p.stdin.flush()\n  240 |                     with building_cv:\n  241 |                         shared_state.finished_building += [building_node]\n  242 |                     daemon_ready = False","lines":8,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/ninja_scons_daemon.py#L235-L242"},{"ref":"SCons/Tool/ninja_tool/ninja_scons_daemon.py:290-307","code":"  290 |                     def pred() -> bool:\n  291 |                         return build[0] in shared_state.finished_building\n  292 | \n  293 |                     with building_cv:\n  294 |                         building_cv.wait_for(pred)\n  295 | \n  296 |                     for error_node in shared_state.error_nodes:\n  297 |                         if error_node[\"node\"] == build[0]:\n  298 |                             self.send_response(500)\n  299 |                             self.send_header(\"Content-type\", \"text/html\")\n  300 |                             self.end_headers()\n  301 |                             self.wfile.write(error_node[\"error\"].encode())\n  302 |                             return\n  303 | \n  304 |                     self.send_response(200)\n  305 |                     self.send_header(\"Content-type\", \"text/html\")\n  306 |                     self.end_headers()\n  307 |                     return","lines":18,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/ninja_tool/ninja_scons_daemon.py#L290-L307"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"convert_to_id's charset is missing the uppercase letter 'Z'. The string runs '...UVWXYabc...' - after 'Y' it jumps to lowercase 'a', so 'Z' is absent (the alphanumeric run is 61 chars, contradicting the docstring's 'There are 62 chars in the charset'). convert_to_id filters out every character not in charset when generating WiX Id/Guid attributes, so any uppercase 'Z' in a filename/identifier is silently dropped, breaking the documented 'minimal editing distance' guarantee and risking id collisions (e.g. 'ZAP' and 'AP' map to the same id).","fix":"Insert the missing Z: charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.'","locations":[{"ref":"SCons/Tool/packaging/msi.py:61","code":"   61 |     charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYabcdefghijklmnopqrstuvwxyz0123456789_.'","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/packaging/msi.py#L61"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"emit_rmic_classes strips the class suffix with inverted slices. javah.py (its sibling) correctly does `if classname[-len(class_suffix):] == class_suffix: classname = classname[:-len(class_suffix)]`, but rmic.py does `if classname[:-len(class_suffix)] == class_suffix: classname = classname[-len(class_suffix):]`. Both the test slice and the assignment slice are reversed: it compares everything-except-the-last-N chars against the suffix (almost never true), and if it ever matched would keep only the trailing N chars. For RMIC sources passed without a java_classname attribute, the '.class' suffix is never stripped, producing wrong classnames in the RMIC command line.","fix":"Mirror javah.py: `if class_suffix and classname[-len(class_suffix):] == class_suffix: classname = classname[:-len(class_suffix)]`.","locations":[{"ref":"SCons/Tool/rmic.py:73-74","code":"   73 |             if class_suffix and classname[:-len(class_suffix)] == class_suffix:\n   74 |                 classname = classname[-len(class_suffix):]","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/rmic.py#L73-L74"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"FileLock.release_lock guards on `if self.lock:`, but a file descriptor of 0 is a valid, falsy fd that os.open can return (e.g. if stdin has been closed). In that case the lockfile is never closed or unlinked, leaking the descriptor and leaving a stale lockfile that blocks all future lock acquisitions on that resource. __exit__ correctly uses `is not None`; release_lock should match.","fix":"Change `if self.lock:` to `if self.lock is not None:` in release_lock, consistent with __enter__/__exit__.","locations":[{"ref":"SCons/Util/filelock.py:146-151","code":"  146 |     def release_lock(self) -> None:\n  147 |         \"\"\"Release the lock by deleting the lockfile.\"\"\"\n  148 |         if self.lock:\n  149 |             os.close(self.lock)\n  150 |             os.unlink(self.lockfile)\n  151 |             self.lock = None","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Util/filelock.py#L146-L151"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Variables.Update reads each saved-variables file with open(filename) using the default (locale) text encoding and exec()s its contents. The exec is wrapped in try/finally that deletes temp_values['__name__'], but if open() or read() raises (e.g. the file disappears between os.path.exists and open, or a decode error), sys.path still has dirname inserted at index 0 and the finally clause runs 'del temp_values['__name__']' which raises KeyError (the key was never set), masking the original error. The sys.path insert is only undone inside the same finally, so the order is fragile.","fix":"Set temp_values['__name__'] before the try (or guard its deletion with pop(..., None)); ensure sys.path cleanup happens even if open/read fails.","locations":[{"ref":"SCons/Variables/__init__.py:278-290","code":"  278 |                 temp_values = {}\n  279 |                 dirname = os.path.split(os.path.abspath(filename))[0]\n  280 |                 if dirname:\n  281 |                     sys.path.insert(0, dirname)\n  282 |                 try:\n  283 |                     temp_values['__name__'] = filename\n  284 |                     with open(filename) as f:\n  285 |                         contents = f.read()\n  286 |                     exec(contents, {}, temp_values)\n  287 |                 finally:\n  288 |                     if dirname:\n  289 |                         del sys.path[0]\n  290 |                     del temp_values['__name__']","lines":13,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Variables/__init__.py#L278-L290"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"warn() constructs the warning as `clazz(args)`, passing the *args tuple as a single positional argument. Callers invoke warn(clazz, msg) so args==(msg,), and clazz((msg,)) builds an exception whose args is ((msg,),); str() of it then renders as \"('msg',)\" (a tuple repr) instead of the bare message. Every emitted warning message is thus wrapped in tuple-repr noise, and when warnings-as-exceptions is on the raised exception carries the malformed message.","fix":"Construct the warning with `clazz(*args)` so message arguments are passed through individually (matching normal exception construction).","locations":[{"ref":"SCons/Warnings.py:228","code":"  228 |     warning = clazz(args)","lines":1,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Warnings.py#L228"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"cpp.PreProcessor.eval_constant_expression evaluates the macro expansion in self.constant_expression_namespace, which is initialized to {} and never populated. The CPP_to_Python conversion turns `defined FOO`/`defined(FOO)` into `\"FOO\" in __dict__`, but constant_expression_namespace has no `__dict__` key, so any expansion using defined() raises NameError (caught -> None) rather than evaluating correctly. More importantly, do_define uses eval_constant_expression to decide whether an expansion is a constant; for an expansion referencing other macros it will always return None (NameError/TypeError), so previously #defined integer macros are not folded into constants here.","fix":"If the intent is literal-only evaluation, document and keep; otherwise evaluate in cpp_namespace (like eval_expression) so prior macro definitions resolve, and ensure '__dict__' is present in the namespace used.","locations":[{"ref":"SCons/cpp.py:267-268","code":"  267 |         # Namespace for constant expression evaluation (literals only)\n  268 |         self.constant_expression_namespace = {}","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/cpp.py#L267-L268"},{"ref":"SCons/cpp.py:389-406","code":"  389 |     def eval_constant_expression(self, s):\n  390 |         \"\"\"\n  391 |         Evaluates a C preprocessor expression.\n  392 | \n  393 |         This is done by converting it to a Python equivalent and\n  394 |         eval()ing it in the C preprocessor namespace we use to\n  395 |         track #define values.\n  396 | \n  397 |         Returns None if the eval() result is not an integer.\n  398 |         \"\"\"\n  399 |         s = CPP_to_Python(s)\n  400 |         try:\n  401 |             rval = eval(s, self.constant_expression_namespace)\n  402 |         except (NameError, TypeError, SyntaxError) as e:\n  403 |             rval = None\n  404 |         if not isinstance(rval, int):\n  405 |             rval = None\n  406 |         return rval","lines":18,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/cpp.py#L389-L406"},{"ref":"SCons/cpp.py:541-560","code":"  541 |     def do_define(self, t) -> None:\n  542 |         \"\"\"\n  543 |         Default handling of a #define line.\n  544 |         \"\"\"\n  545 |         _, name, args, expansion = t\n  546 | \n  547 |         rval = self.eval_constant_expression(expansion)\n  548 |         if rval is not None:\n  549 |             expansion = rval\n  550 |         else:\n  551 |             # handle \"defined\" chain \"! (defined (A) || defined (B)\" ...\n  552 |             if \"defined \" in expansion:\n  553 |                 self.cpp_namespace[name] = self.eval_expression(t[2:])\n  554 |                 return\n  555 | \n  556 |         if args:\n  557 |             evaluator = FunctionEvaluator(name, args[1:-1], expansion)\n  558 |             self.cpp_namespace[name] = evaluator\n  559 |         else:\n  560 |             self.cpp_namespace[name] = expansion","lines":20,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/cpp.py#L541-L560"}]},{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"chmod_func detects an octal-numeric mode string with `is_String(mode) and 0 not in [i in digits for i in mode]`. For an empty string mode (''), the comprehension is empty so `0 not in []` is True, causing int('', 8) which raises ValueError. An empty/whitespace mode is mishandled rather than producing a clear error.","fix":"Require the mode string to be non-empty and fully digits, e.g. `if is_String(mode) and mode and mode.isdigit():` (or explicitly validate).","locations":[{"ref":"SCons/Defaults.py:208-209","code":"  208 |     if is_String(mode) and 0 not in [i in digits for i in mode]:\n  209 |         mode = int(mode, 8)","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Defaults.py#L208-L209"}]},{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"File.get_timestamp() returns self.rfile().getmtime() which can be a float (or None if stat fails mid-call) but is annotated -> int and the not-exists branch returns int 0. getmtime() returns st[stat.ST_MTIME] (int) per Base.getmtime, so types are inconsistent across the codebase (some paths use st_mtime float). The mixed int/float timestamp is explicitly flagged in a TODO at Base.getmtime; comparisons like `n.timestamp == mtime` in get_max_drift_csig can silently fail across a granularity change.","fix":"Standardize on one timestamp granularity (resolve the existing TODO) so stored ninfo.timestamp and live get_timestamp() are directly comparable.","locations":[{"ref":"SCons/Node/FS.py:783-791","code":"  783 |     def getmtime(self) -> float | None:\n  784 |         st = self.stat()\n  785 | \n  786 |         if st:\n  787 |             # TODO: switch to st.st_mtime, however this changes granularity\n  788 |             #    (ST_MTIME is an int for backwards compat, st_mtime is float)\n  789 |             return st[stat.ST_MTIME]\n  790 |         else:\n  791 |             return None","lines":9,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/FS.py#L783-L791"},{"ref":"SCons/Node/FS.py:2805-2818","code":" 2805 |     @SCons.Memoize.CountMethodCall\n 2806 |     def get_timestamp(self) -> int:\n 2807 |         try:\n 2808 |             return self._memo['get_timestamp']\n 2809 |         except KeyError:\n 2810 |             pass\n 2811 | \n 2812 |         if self.rexists():\n 2813 |             timestamp = self.rfile().getmtime()\n 2814 |         else:\n 2815 |             timestamp = 0\n 2816 | \n 2817 |         self._memo['get_timestamp'] = timestamp\n 2818 |         return timestamp","lines":14,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/FS.py#L2805-L2818"}]},{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"Value.get_csig() (Python.py) stores and returns the raw text contents as the 'content signature' (self.get_ninfo().csig = contents), not a hashed digest, despite the docstring saying 'Ideally string of hex digits'. For large Value contents this stores unbounded strings in ninfo and into .sconsign, and makes csig comparisons compare full contents rather than fixed-size digests. Likely intentional historically, but inconsistent with every other get_csig (Alias, File, base Node all hash_signature the contents).","fix":"If signatures are meant to be digests, hash the contents: `self.get_ninfo().csig = hash_signature(contents)`. If raw-content semantics are required for value comparison, update the docstring to remove the 'hex digits' claim.","locations":[{"ref":"SCons/Node/Python.py:130-142","code":"  130 |     def get_csig(self) -> str:\n  131 |         \"\"\"\n  132 |         Returns string. Ideally string of hex digits. (Not bytes)\n  133 |         \"\"\"\n  134 |         try:\n  135 |             return self.ninfo.csig\n  136 |         except AttributeError:\n  137 |             pass\n  138 | \n  139 |         contents = self.get_text_contents()\n  140 | \n  141 |         self.get_ninfo().csig = contents\n  142 |         return contents","lines":13,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Node/Python.py#L130-L142"}]},{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"Node.Decider() chooses a free key with `foundkey = len(_decider_map)` only when no existing match is found, but the guard is `if not foundkey:` which is also true when foundkey == 0. Index 0 (changed_since_last_build_node) is a valid existing decider; if a user passes that exact function, foundkey becomes 0, `not foundkey` is True, and it overwrites/re-adds at len(_decider_map) instead of reusing key 0. Harmless for the default deciders (which are never re-registered as 0) but the falsiness test is incorrect; it should distinguish 'not found' (None) from key 0.","fix":"Use `if foundkey is None:` instead of `if not foundkey:`.","locations":[{"ref":"SCons/Node/__init__.py:1448-1457","code":" 1448 |     def Decider(self, function: Callable[[Node, Node, NodeInfoBase, Node | None], bool]) -> None:\n 1449 |         foundkey = None\n 1450 heck analogous to run_makeindex (only force when the newglossary input file is expected but absent).","locations":[{"ref":"SCons/Tool/tex.py:427-428","code":"  427 |         for ng in newglossary_suffix:\n  428 |             if check_content_hash(suffix_nodes[ng[2]], ng[2]) or (count == 1):","lines":2,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/tex.py#L427-L428"}]},{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In tex_emitter_core the bibunit branch globs 'bu*.aux' and, while iterating file_list.copy(), appends the suffix-stripped name back into file_list. Because each appended stem is later combined with every suffix in suffix_list[:-1] ('.bbl','.blg'), and the original glob entries still carry the '.aux' extension, the side effects added for the original glob hits become e.g. 'foo.aux.bbl' rather than 'foo.bbl'. Only the appended stems give correct names; the original .aux-suffixed entries produce wrong side-effect/clean targets.","fix":"Replace each glob entry with its stem instead of appending, or build file_list from stems only (e.g. [SCons.Util.splitext(fl)[0] for fl in glob.glob(...)]).","locations":[{"ref":"SCons/Tool/tex.py:791-796","code":"  791 |             if suffix_list[-1] == 'bibunit':\n  792 |                 file_basename = os.path.join(targetdir, 'bu*.aux')\n  793 |                 file_list = glob.glob(file_basename)\n  794 |                 # remove the suffix '.aux'\n  795 |                 for fl in file_list.copy():\n  796 |                     file_list.append(SCons.Util.splitext(fl)[0])","lines":6,"link":"https://github.com/SCons/scons/blob/960f328438c758b575ecb96dd58dccadd67baf5f/SCons/Tool/tex.py#L791-L796"},{"ref":"SCons/Tool/tex.py:808-814","code":"  808 |             # now define the side effects\n  809 |             for file_name in file_list:\n  810 |                 for suffix in suffix_list[:-1]:\n  811 |
