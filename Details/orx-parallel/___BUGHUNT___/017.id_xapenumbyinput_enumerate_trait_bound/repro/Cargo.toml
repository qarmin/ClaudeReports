[workspace]

[package]
name = "orx017-repro"
version = "0.1.0"
edition = "2024"

# ADAPT (per SKILL.md): while working the candidate live, point this at the main project's own
# working tree (fast, reuses its `target/`); the candidate's own justfile instead builds against
# `../clone/orx-parallel` fetched from `repo_url`/`base_commit` at run time - see the justfile.
[dependencies]
orx-parallel = { path = "../clone/orx-parallel" }

[[bin]]
name = "filter_then_enumerate"
path = "src/bin/filter_then_enumerate.rs"

[[bin]]
name = "map_then_enumerate_control"
path = "src/bin/map_then_enumerate_control.rs"

[[bin]]
name = "filter_map_use_new_then_enumerate"
path = "src/bin/filter_map_use_new_then_enumerate.rs"
