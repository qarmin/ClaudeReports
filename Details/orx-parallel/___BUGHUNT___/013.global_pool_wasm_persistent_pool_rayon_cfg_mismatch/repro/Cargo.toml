[workspace]

[package]
name = "repro-013"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# This path resolves to ../clone (created by the candidate justfile's `just clone` step) when run
# standalone; while working the candidate live against the main checkout, this repro is instead
# built with `cargo run --manifest-path ... ` pointed at that checkout (see RESULT.md).
orx-parallel = { path = "../clone", default-features = false, features = ["std", "wasm", "persistent-pool-rayon"] }
