[workspace]

[package]
name = "orx007-repro"
version = "0.1.0"
edition = "2024"

# ADAPT (per SKILL.md): while working the candidate live, point this at the main project's own
# working tree (fast, reuses its `target/`); the candidate's own justfile instead builds against
# `../clone/orx-parallel` fetched from `repo_url`/`base_commit` at run time - see the justfile.
[dependencies]
orx-parallel = { path = "../clone/orx-parallel" }

[[bin]]
name = "use_new_scenario"
path = "src/bin/use_new_scenario.rs"

[[bin]]
name = "plain_scenario"
path = "src/bin/plain_scenario.rs"
