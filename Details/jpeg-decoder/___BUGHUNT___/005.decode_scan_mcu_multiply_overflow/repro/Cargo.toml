[workspace]

[package]
name = "mcu_multiply_overflow_repro"
version = "0.1.0"
edition = "2021"

# Path dependency into ./clone, produced by this candidate's own `justfile` (`just clone`
# checks out base_commit from repo_url into ../clone relative to this repro/ folder). To
# reproduce against a published release instead, replace with `jpeg-decoder = "0.3.2"` (or
# whatever version is current) - the bug predates this investigation (see RESULT.md).
[dependencies]
jpeg-decoder = { path = "../clone", default-features = false }

# The bug only panics with overflow checks enabled (Rust's default debug-build behavior); force
# them on even in --release so `just test`'s `cargo run --release` still catches it.
[profile.release]
overflow-checks = true
