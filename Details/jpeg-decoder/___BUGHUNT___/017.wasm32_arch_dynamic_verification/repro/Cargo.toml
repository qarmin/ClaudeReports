[workspace]

[package]
name = "wasm32_overflow_repro"
version = "0.1.0"
edition = "2021"

# Path dependency into ./clone, produced by this candidate's own `justfile` (`just clone` checks
# out base_commit from repo_url into ../clone relative to this repro/ folder). To reproduce
# against a published release instead, replace with `jpeg-decoder = "0.3.2"` (or whatever version
# is current) - the bug predates this investigation (see RESULT.md). rayon is disabled: it isn't
# needed to reach the bug (it's in ImmediateWorker, the fallback worker rayon still compiles down
# to on wasm32) and keeping it off avoids an unrelated wasm32 threading build wrinkle.
[dependencies]
jpeg-decoder = { path = "../clone", default-features = false }

# Exact-pinned so this repro keeps working standalone indefinitely without depending on whatever
# wasm-bindgen happens to be newest on crates.io at run time - see justfile for the matching
# wasm-bindgen-cli release download (must be the same version as this).
[dev-dependencies]
wasm-bindgen-test = "=0.3.77"
wasm-bindgen = "=0.2.127"
