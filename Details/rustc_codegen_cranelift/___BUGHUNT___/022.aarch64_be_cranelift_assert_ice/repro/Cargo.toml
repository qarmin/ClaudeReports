[workspace]

[package]
name = "bare_aarch64_be"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "bare_aarch64_be"
path = "src/main.rs"

# opt-level 0 on purpose: at -O rustc can const-fold work away in MIR before the backend ever
# sees it, which would weaken the run-time comparison.
[profile.dev]
opt-level = 0
panic = "abort"
debug = false
