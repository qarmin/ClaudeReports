[workspace]

[package]
name = "simd_cast_f16_identity_ice"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "simd_cast_f16_identity_ice"
path = "src/main.rs"

# Project gotcha: at -O rustc's MIR GVN const-folds SIMD intrinsic calls through the const-eval
# interpreter, so a backend gap can silently disappear. Keep both profiles at opt-level 0.
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 0
