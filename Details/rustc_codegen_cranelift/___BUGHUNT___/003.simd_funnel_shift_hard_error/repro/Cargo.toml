[workspace]

[package]
name = "simd_funnel_repro"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "simd_funnel_repro"
path = "src/main.rs"

# opt-level 0 on purpose: at -O rustc's MIR GVN const-folds the SIMD intrinsic calls through the
# const-eval interpreter, so the backend is never asked to codegen them and the bug disappears.
[profile.dev]
opt-level = 0
