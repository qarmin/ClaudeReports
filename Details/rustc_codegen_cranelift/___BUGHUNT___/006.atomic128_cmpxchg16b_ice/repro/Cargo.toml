[workspace]

[package]
name = "atomic128_cmpxchg16b_ice"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "atomic128_cmpxchg16b_ice"
path = "src/main.rs"

# The project gotcha: at -O rustc's MIR GVN can const-fold intrinsic calls through the const-eval
# interpreter, so a backend bug can silently disappear. Keep both profiles at opt-level 0.
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 0
