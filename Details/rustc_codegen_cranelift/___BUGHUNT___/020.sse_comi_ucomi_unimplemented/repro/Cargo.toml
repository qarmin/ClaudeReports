[workspace]

[package]
name = "sse_comi_ucomi_unimplemented"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "sse_comi_ucomi_unimplemented"
path = "src/main.rs"

# The project gotcha: at -O rustc's MIR GVN const-folds SIMD intrinsic calls through the
# const-eval interpreter, so a backend bug can silently disappear. Keep both profiles at
# opt-level 0.
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 0
