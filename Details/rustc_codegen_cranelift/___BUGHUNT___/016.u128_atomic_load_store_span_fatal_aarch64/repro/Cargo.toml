[package]
name = "atomic128_core_aarch64"
version = "0.0.0"
edition = "2021"

# Standalone - deliberately not part of any surrounding workspace.
[workspace]

[features]
# Adds a `core::sync::atomic::AtomicU128` load/store user, which only exists on targets where
# `target_has_atomic = "128"` holds (aarch64-*, s390x-*, x86_64-apple-darwin).
atomic_u128 = []

[profile.dev]
opt-level = 0
