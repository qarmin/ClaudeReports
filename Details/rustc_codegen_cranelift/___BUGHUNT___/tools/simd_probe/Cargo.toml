[workspace]

[package]
name = "simd_probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simd_probe"
path = "src/main.rs"

[profile.dev]
# Keep opt-level 0: at -O rustc's MIR GVN can const-fold these intrinsic calls through the
# const-eval interpreter, which hides a backend miscompilation entirely.
opt-level = 0

[features]
funnel = []
stream = []
kreg = []
permilvar = []
