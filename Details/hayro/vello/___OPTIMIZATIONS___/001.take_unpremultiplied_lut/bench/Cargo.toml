[workspace]

[package]
name = "bench_unpremultiply"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Path dependency on the crate under test. When run inside a fresh `just clone` (see
# ../justfile), this resolves to clone/sparse_strips/vello_common with patch.diff applied.
# When run directly against this checkout during a live session, point this at the real
# ../../../sparse_strips/vello_common instead.
vello_common = { path = "../../clone/sparse_strips/vello_common" }
bytemuck = "1"

[profile.release]
debug = 1
