[workspace]

[package]
name = "repro_simd"
version = "0.1.0"
edition = "2021"

[dependencies]
# avx enabled (default) - on an x86_64 host with AVX2, `avx_unpremultiply_alpha_rgba` (in
# src/avx2/alpha_u8.rs) is the internal function this repro calls, via the `expose.diff`
# visibility shim (a doc-hidden `pub` wrapper added purely so an external crate can reach it -
# zero behavior change, see expose.diff's own doc comment).
pic-scale = { path = "../clone" }
