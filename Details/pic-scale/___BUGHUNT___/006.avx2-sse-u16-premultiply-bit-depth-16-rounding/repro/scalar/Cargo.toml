[workspace]

[package]
name = "repro_scalar"
version = "0.1.0"
edition = "2021"

[dependencies]
# avx/sse/neon disabled - forces the scalar reference path (`premultiply_alpha_rgba_row`'s
# `div_by_65535`, the crate's own ground truth) for every pixel, on the same host.
pic-scale = { path = "../clone", default-features = false, features = ["threading"] }
rand = "0.8"
