[workspace]

[package]
name = "repro_simd"
version = "0.1.0"
edition = "2021"

[dependencies]
# Default features (avx, sse, neon, rdm, threading) enabled - on an x86_64 host with AVX2, this
# runtime-dispatches premultiply/unpremultiply to `Avx2PremultiplyExecutorAnyBit`/
# `Sse41PremultiplyExecutorAny` for bit_depth == 16 (the bug).
pic-scale = { path = "../clone" }
rand = "0.8"
