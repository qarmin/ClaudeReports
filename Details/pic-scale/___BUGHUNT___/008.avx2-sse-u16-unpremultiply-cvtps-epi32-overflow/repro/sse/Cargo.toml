[workspace]

[package]
name = "repro_sse"
version = "0.1.0"
edition = "2021"

[dependencies]
# sse enabled, avx disabled - forces the SSE4.1 path (`DisassociateAlphaDefault::disassociate` in
# src/sse/alpha_u16.rs), which has the identical `_mm_cvtps_epi32` -> `_mm_packus_epi32` ->
# `_mm_min_epu16` overflow-collapse pattern as the AVX2 backend.
pic-scale = { path = "../clone", default-features = false, features = ["sse", "threading"] }
