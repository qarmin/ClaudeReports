[workspace]

[package]
name = "repro_scalar"
version = "0.1.0"
edition = "2021"

[dependencies]
# avx/sse/neon disabled - forces the scalar reference path (`unpremultiply_alpha_rgba_row`, the
# crate's own f32-based ground truth, which clamps the unpremultiplied value with `.min(max_colors
# as f32)` and never overflows an i32) for every pixel, on the same host.
pic-scale = { path = "../clone", default-features = false, features = ["threading"] }
