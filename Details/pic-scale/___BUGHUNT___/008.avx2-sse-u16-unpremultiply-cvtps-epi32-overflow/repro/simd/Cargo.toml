[workspace]

[package]
name = "repro_simd"
version = "0.1.0"
edition = "2021"

[dependencies]
# avx/sse/neon enabled (default) - on an x86_64 host with AVX2, this runtime-dispatches
# unpremultiply to `avx_unpremultiply_alpha_rgba_u16_row_avx` (the bug: `_mm256_cvtps_epi32` on a
# color*(max_colors/alpha) product exceeding i32::MAX overflows to the "integer indefinite" value,
# which `_mm256_packus_epi32`'s unsigned saturation then collapses to 0 instead of clamping high).
pic-scale = { path = "../clone" }
