[workspace]

[package]
name = "repro_simd"
version = "0.1.0"
edition = "2021"

[dependencies]
# avx/sse/neon enabled (default) - on an x86_64 host with AVX2, this runtime-dispatches
# unpremultiply to `avx_unpremultiply_alpha_rgba` (`WorkloadStrategy::PreferSpeed`, the crate's
# own default strategy, which this repro uses explicitly), whose `_mm256_rcp_ps` low-precision
# hardware-approximate reciprocal of the alpha channel feeds `_mm256_cvtps_epi32`, diverging by
# +/-1 from the scalar reference's exact round-half-up `(pixel*255+alpha/2)/alpha` formula.
pic-scale = { path = "../clone" }
