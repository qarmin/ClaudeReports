[package]
name = "kurbo_bench"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace root: this crate lives inside the kurbo checkout's directory tree but is not a
# member of kurbo's workspace, so it needs this to stop cargo complaining.
[workspace]

[dependencies]
# ADAPT when copied into a candidate's ./clone (see the candidate justfiles): the path becomes
# "../kurbo" there, because the harness is copied to clone/kurbo_bench/ rather than living at
# ___OPTIMIZATIONS___/harness/kurbo_bench/.
kurbo = { path = "../../../kurbo" }

[profile.release]
debug = true
