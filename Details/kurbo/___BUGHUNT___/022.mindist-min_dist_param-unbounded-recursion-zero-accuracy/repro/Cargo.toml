[workspace]

[package]
name = "mindist-unbounded-recursion-repro"
version = "0.1.0"
edition = "2021"

[dependencies]
# Path dependency into ./clone (created by `just clone`), so this always tracks whatever state
# the clone is currently in - pristine before `just apply`, patched after.
kurbo = { path = "../clone/kurbo" }

[profile.release]
# Debug assertions off, matching a normal release build of a downstream consumer of kurbo - the
# stack overflow reproduces in both profiles, but release is the profile most likely to be
# running in a real deployed application.
debug-assertions = false
