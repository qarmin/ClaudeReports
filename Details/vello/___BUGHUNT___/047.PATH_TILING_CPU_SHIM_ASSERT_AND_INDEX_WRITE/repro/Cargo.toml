[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "pipeline_checks"
path = "src/bin/pipeline_checks.rs"

[[bin]]
name = "search"
path = "src/bin/search.rs"

[dependencies]
# Path is relative to `./clone`, created by this candidate's own `just clone`.
vello = { path = "../clone/vello" }

anyhow = "1"
pollster = "0.3"

[profile.release]
opt-level = 3
