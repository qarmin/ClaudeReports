[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Populated by `just clone` (see ../justfile) into ./clone at the pinned base_commit; patch.diff
# is applied there (or not) before each `cargo run` to compare before/after.
vello_cpu = { path = "../clone/sparse_strips/vello_cpu" }
vello_common = { path = "../clone/sparse_strips/vello_common" }
# Only used so the patched tree's `log::warn!` (silent by default with no logger installed) is
# actually visible in this repro's stdout - irrelevant to the bug itself.
env_logger = "0.11"

[profile.release]
opt-level = 3

[profile.dev]
# The bug's release-vs-debug behavior split is the whole point (debug_assert catches it, release
# silently truncates) - keep debug-assertions on explicitly so `cargo run` (dev profile) shows the
# panic even if a workspace-level override changes the default.
debug-assertions = true
