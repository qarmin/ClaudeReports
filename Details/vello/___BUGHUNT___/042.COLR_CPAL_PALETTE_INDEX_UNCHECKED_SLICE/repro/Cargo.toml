[workspace]

[package]
name = "colr_cpal_palette_index_unchecked_slice_repro"
version = "0.1.0"
edition = "2021"

[dependencies]
vello_cpu = { version = "0.2.0", features = ["text"] }
vello_common = "0.2.0"
glifo = "0.3.0"

# By default this pulls the published crates.io releases, which (as of this candidate) contain
# byte-for-byte the same glifo/src/colr.rs as the checked-out base_commit. `just test` instead
# patches these to the freshly-cloned ./clone (checked out at base_commit) so the repro always
# tracks the exact commit under investigation, not whatever happens to be on crates.io later.
[patch.crates-io]
glifo = { path = "../clone/glifo" }
vello_cpu = { path = "../clone/sparse_strips/vello_cpu" }
vello_common = { path = "../clone/sparse_strips/vello_common" }
