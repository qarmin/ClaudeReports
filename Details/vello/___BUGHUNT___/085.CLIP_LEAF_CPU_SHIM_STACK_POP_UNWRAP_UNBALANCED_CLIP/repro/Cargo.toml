[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "clip_underflow"
path = "src/bin/clip_underflow.rs"

[[bin]]
name = "clip_underflow_variant2"
path = "src/bin/clip_underflow_variant2.rs"

[dependencies]
# Path is relative to `./clone`, created by this candidate's own `just clone`.
vello = { path = "../clone/vello" }
vello_encoding = { path = "../clone/vello_encoding" }
anyhow = "1"
pollster = "0.3"

[profile.release]
opt-level = 1
