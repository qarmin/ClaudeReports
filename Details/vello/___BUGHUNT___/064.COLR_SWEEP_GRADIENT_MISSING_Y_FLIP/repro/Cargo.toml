[workspace]

[package]
name = "colr_sweep_gradient_missing_y_flip_repro"
version = "0.1.0"
edition = "2021"

[dependencies]
vello = "0.10.0"
vello_cpu = { version = "0.2.0", features = ["png"] }
vello_common = "0.2.0"
peniko = "0.6.1"
kurbo = "0.13.1"
png = "0.17"
pollster = "0.4.0"
futures-intrusive = "0.5.0"

# By default this pulls the published crates.io releases, which (as of this candidate) contain
# byte-for-byte the same `vello/src/scene.rs` sweep-gradient handling as the checked-out
# base_commit. `just test` instead patches these to the freshly-cloned ./clone (checked out at
# base_commit) so the repro always tracks the exact commit under investigation, not whatever
# happens to be on crates.io later.
[patch.crates-io]
vello = { path = "../clone/vello" }
vello_cpu = { path = "../clone/sparse_strips/vello_cpu" }
vello_common = { path = "../clone/sparse_strips/vello_common" }
