[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

# Paths track whatever `../clone` currently contains (see candidate justfile: `clone` checks out
# `base_commit` into `../clone`).
[dependencies]
vello = { path = "../clone/vello" }
vello_encoding = { path = "../clone/vello_encoding" }
kurbo = "0.13.1"
peniko = { version = "0.6.1", default-features = false }
bytemuck = "1.25.0"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
