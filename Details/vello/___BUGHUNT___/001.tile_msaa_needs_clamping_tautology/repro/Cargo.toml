[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
# ADAPT (see justfile): when run via `just test`, this points at the pristine/patched clone
# produced by the candidate justfile. While iterating live in the main checkout, point this at
# the checkout's own `sparse_strips/vello_common` instead.
vello_common = { path = "../clone/sparse_strips/vello_common" }

[profile.release]
debug-assertions = true
overflow-checks = true
