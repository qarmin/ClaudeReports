[workspace]

[package]
name = "vello_colr_paint_cycle_unwrap_panic_repro"
version = "0.1.0"
edition = "2021"

[dependencies]
vello = "0.10.0"

# By default this pulls the published crates.io release, which (as of this candidate) contains
# byte-for-byte the same `vello/src/scene.rs` `colr.paint(..).unwrap()` as the checked-out
# base_commit. `just test` instead patches this to the freshly-cloned ./clone (checked out at
# base_commit) so the repro always tracks the exact commit under investigation, not whatever
# happens to be on crates.io later.
[patch.crates-io]
vello = { path = "../clone/vello" }
