[workspace]

[package]
name = "gpu_image_bench"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gpu_image_bench"
path = "src/main.rs"

[features]
# Enabled only for the "patched" build: `Scene::draw_image` (the GPU-native bilinear fast
# path this candidate adds) does not exist on the baseline (pre-patch) `vello_hybrid`.
fast_path = []

[dependencies]
vello_hybrid = { path = "../clone/sparse_strips/vello_hybrid", features = ["wgpu"] }
vello_common = { path = "../clone/sparse_strips/vello_common", features = ["std"] }
wgpu = { version = "29", default-features = false, features = ["vulkan", "gles", "wgsl"] }
pollster = "0.4"
png = "0.18"

[profile.release]
debug = true
