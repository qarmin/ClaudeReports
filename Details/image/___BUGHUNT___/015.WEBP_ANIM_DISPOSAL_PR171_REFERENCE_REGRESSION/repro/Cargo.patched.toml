[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { path = "../clone", default-features = false, features = ["webp", "png"] }

# Overrides image-webp to the upstream git rev that contains PR #171 ("fix: dispose transparent
# animated frames") plus its two follow-ups (#178, #179) - same rev candidate 014 used.
[patch.crates-io]
image-webp = { git = "https://github.com/image-rs/image-webp", rev = "f4d80bd965df2c81e65b6f43c1f70e0750bd4b0f" }
