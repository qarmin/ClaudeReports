[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
image = { path = "../clone" }

# `../dep_clone` starts as a pristine, unpatched checkout of `pic-scale-safe` (see the justfile's
# `clone` recipe) and gets `git apply patch.diff`'d in place by the `apply` recipe - no need to
# ever touch this manifest at runtime, Cargo picks up a path dependency's changed source directly.
[patch.crates-io]
pic-scale-safe = { path = "../dep_clone" }

[profile.release]
debug = true
