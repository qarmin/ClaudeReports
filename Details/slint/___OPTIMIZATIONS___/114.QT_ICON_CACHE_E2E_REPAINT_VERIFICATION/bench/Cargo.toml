[package]
name = "qt-icon-e2e-probe"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "qt_icon_e2e_probe"
path = "main.rs"

[dependencies]
slint = { path = "../clone/api/rs/slint", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-qt",
] }
# Direct dependency (alongside the transitive one pulled in by `slint`/backend-selector) purely
# to reach the temporary `bench-probe`-gated counters (see bench_probe.patch) - feature
# unification across the one shared `path` dependency makes this safe.
i-slint-backend-qt = { path = "../clone/internal/backends/qt", features = ["bench-probe"] }

[build-dependencies]
slint-build = { path = "../clone/api/rs/build" }

# Own workspace: standalone, does not join the cloned repository's workspace.
[workspace]
