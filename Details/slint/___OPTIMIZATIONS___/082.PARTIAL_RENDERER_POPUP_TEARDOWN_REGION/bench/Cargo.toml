[workspace]

[package]
name = "popup_teardown_bench"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "popup_teardown_bench"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.0", path = "../clone/api/rs/slint", default-features = false, features = [
  "compat-1-2",
  "std",
  "renderer-software",
] }

[build-dependencies]
slint-build = { version = "=1.18.0", path = "../clone/api/rs/build" }
