[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
dicom-core = { path = "../clone/core" }
dicom-object = { path = "../clone/object" }
dicom-dictionary-std = { path = "../clone/dictionary-std" }
dicom-pixeldata = { path = "../clone/pixeldata", features = ["image"] }

# The bug is a debug-only i32 subtraction overflow (silently wraps in a
# normal release build instead of panicking) - force overflow-checks on so
# `cargo run --release` reproduces it deterministically without needing a
# separate debug build.
[profile.release]
overflow-checks = true

