[package]
name = "encoder_bench"
version = "0.1.0"
edition = "2021"

# Detached from any surrounding workspace on purpose - this crate is copied around (into a
# candidate's ./clone, or posted standalone) and must never try to join a parent workspace.
[workspace]

[dependencies]
# Path to the `png` crate being measured.
#
# `../../..` is the main checkout when this harness sits at its canonical location
# `___OPTIMIZATIONS___/harness/encoder_bench/`. A candidate justfile that copies this harness
# into its own `clone/` must rewrite that path to point at the clone, e.g.
#     sed -i 's|path = "../../.."|path = ".."|' clone/encoder_bench/Cargo.toml
# See ___OPTIMIZATIONS___/README.md.
png = { path = "../../.." }

[profile.release]
debug = true
