[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia = { path = "../clone/symphonia", default-features = false, features = ["wav", "pcm"] }
symphonia-core = { path = "../clone/symphonia-core" }

[[bin]]
name = "repro"
path = "src/main.rs"

[profile.release]
debug = true
# The bug is a checked-arithmetic (shift-amount) overflow panic; without this a plain
# `cargo run --release` masks the shift amount instead of demonstrating it (see RESULT.md's
# release-mode note).
overflow-checks = true
