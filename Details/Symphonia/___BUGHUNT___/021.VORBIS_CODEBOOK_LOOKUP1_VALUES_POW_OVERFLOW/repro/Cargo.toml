[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia-codec-vorbis = { path = "../clone/symphonia-codec-vorbis" }
symphonia-core = { path = "../clone/symphonia-core" }

[[bin]]
name = "repro"
path = "main.rs"

# Supplementary: an exhaustive differential/boundary-value check of `lookup1_values` itself (a
# standalone copy of the function, since it's private to symphonia-codec-vorbis and not reachable
# from outside the crate) - this is the manual-boundary-value/property-check approach from
# HEURISTICS.md, run BEFORE (and independently of) the real end-to-end `repro` binary above. It
# does not use any crate dependency, so it needs no path override.
[[bin]]
name = "boundary_probe"
path = "boundary_probe.rs"

[profile.dev]
overflow-checks = true

[profile.release]
debug = true
overflow-checks = true
