[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

# The whole point of this repro is that it only uses the top-level `symphonia` facade crate's
# public API (probe -> format reader -> audio decoder), the same way any application does.
[dependencies]
symphonia = { path = "../clone/symphonia", default-features = false, features = [
    "caf",
    "alac",
] }

[[bin]]
name = "repro"
path = "main.rs"

# Integer overflow only panics when overflow checks are on. They are on by default in cargo's dev
# profile; both profiles set them explicitly here so `cargo run` and `cargo run --release` behave
# the same. Without them the same overflow silently wraps and produces garbage samples instead.
[profile.dev]
overflow-checks = true
debug-assertions = true

[profile.release]
debug = true
overflow-checks = true
debug-assertions = true
