[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia-core = { path = "../clone/symphonia-core" }
symphonia-format-isomp4 = { path = "../clone/symphonia-format-isomp4" }

[[bin]]
name = "repro"
path = "src/main.rs"

# The bug is an unchecked u32 addition: it only panics when overflow checks are enabled. A release
# build silently wraps instead (see main.rs), so the repro is always run in this profile.
[profile.dev]
debug-assertions = true
overflow-checks = true
