[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia = { path = "../clone/symphonia", features = ["ogg", "vorbis"] }
symphonia-core = { path = "../clone/symphonia-core" }
pretty_env_logger = "0.5"

[[bin]]
name = "repro"
path = "main.rs"

[profile.dev]
overflow-checks = true

[profile.release]
debug = true
