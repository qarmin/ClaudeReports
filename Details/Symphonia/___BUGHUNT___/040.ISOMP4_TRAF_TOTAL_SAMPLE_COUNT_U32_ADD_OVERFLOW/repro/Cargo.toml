[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia-core = { path = "../clone/symphonia-core" }
symphonia-format-isomp4 = { path = "../clone/symphonia-format-isomp4" }

[[bin]]
name = "repro"
path = "src/main.rs"

[profile.release]
debug = true
# The bug is an unchecked u32 accumulation that overflows; without this a plain
# `cargo run --release` would silently wrap instead of demonstrating the panic.
overflow-checks = true

[profile.dev]
debug-assertions = true
overflow-checks = true
