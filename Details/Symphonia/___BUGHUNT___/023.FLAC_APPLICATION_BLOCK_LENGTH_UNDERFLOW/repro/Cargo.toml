[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia-core = { path = "../clone/symphonia-core" }
symphonia-bundle-flac = { path = "../clone/symphonia-bundle-flac" }
symphonia-metadata = { path = "../clone/symphonia-metadata", default-features = false, features = ["flac"] }

[[bin]]
name = "repro"
path = "src/main.rs"

[profile.dev]
debug-assertions = true
overflow-checks = true

[profile.release]
debug-assertions = true
overflow-checks = true
