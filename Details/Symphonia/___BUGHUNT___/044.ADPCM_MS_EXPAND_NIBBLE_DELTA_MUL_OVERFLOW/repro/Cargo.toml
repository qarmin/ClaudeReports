[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia-core = { path = "../clone/symphonia-core" }
symphonia-codec-adpcm = { path = "../clone/symphonia-codec-adpcm" }

[[bin]]
name = "repro"
path = "main.rs"

# NOTE: run this with a plain `cargo run` (dev/debug profile), not `--release`. `symphonia-core`/
# `symphonia-codec-adpcm` are path dependencies that live inside their own git checkout (`./clone`,
# which has its own workspace root Cargo.toml), so Cargo treats them as members of THAT workspace,
# not of this repro crate's own bare `[workspace]` - any `[profile.release]` override declared
# here does not apply to them (verified: `cargo run --release` does not reproduce the panic, since
# the main Symphonia workspace's own release profile has no `overflow-checks` override; a plain
# debug build's default `overflow-checks = true` does, regardless of which workspace owns the
# crate being compiled).
