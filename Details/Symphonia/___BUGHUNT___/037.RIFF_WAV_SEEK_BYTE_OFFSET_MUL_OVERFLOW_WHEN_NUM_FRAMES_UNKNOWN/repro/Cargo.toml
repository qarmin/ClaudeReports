[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia = { path = "../clone/symphonia", default-features = false, features = ["wav", "pcm"] }
symphonia-core = { path = "../clone/symphonia-core" }

[[bin]]
name = "repro"
path = "src/main.rs"

[profile.release]
debug = true
# The bug is a checked-arithmetic overflow panic; without this a plain `cargo run --release`
# silently wraps instead of panicking (see RESULT.md's release-mode note - the wrap is itself a
# second, silent misbehaviour this repro also reports).
overflow-checks = true
