[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia-core = { path = "../clone/symphonia-core" }
symphonia-format-mkv = { path = "../clone/symphonia-format-mkv" }
symphonia-format-isomp4 = { path = "../clone/symphonia-format-isomp4" }
env_logger = "0.11"

[[bin]]
name = "repro"
path = "src/main.rs"

[profile.release]
debug = true
