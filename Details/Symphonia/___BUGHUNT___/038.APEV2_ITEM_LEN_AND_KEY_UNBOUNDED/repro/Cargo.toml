[workspace]

[package]
name = "repro"
version = "0.1.0"
edition = "2021"

[dependencies]
# The `symphonia` facade enables `all-meta` (hence `ape`) by default, and registers `ApeReader`
# with the default probe, so both the standalone reader and the real probe path are reachable.
symphonia = { path = "../clone/symphonia" }

[[bin]]
name = "repro"
path = "main.rs"

[profile.dev]
overflow-checks = true
debug-assertions = true

[profile.release]
debug = true
overflow-checks = true
debug-assertions = true
