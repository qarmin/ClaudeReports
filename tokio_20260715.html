<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"hard","description":"`File::into_std()` (tokio/src/fs/file.rs:494-497) calls `Arc::try_unwrap(self.std).expect(\"Arc::try_unwrap failed\")` after only awaiting `self.inner.get_mut().complete_inflight()`, which merely drives the read/write/seek `State` machine (`inner.state`) to `Idle`. Several other `&self` methods on `File` (`metadata()` at :449-452, `sync_all()` at :317-323, `sync_data()` at :352-358, `set_permissions()` at :557-560, and `try_clone()` at :469-476) each clone `self.std` into a `spawn_blocking` closure that is *not* tracked by `inner.state` at all. `spawn_blocking` tasks are not cancelled when their `JoinHandle` future is dropped; they keep running in the background holding their own `Arc<StdFile>` clone. So if a caller starts one of these futures and drops it early (e.g. via `tokio::time::timeout` or `tokio::select!`) and then immediately calls `file.into_std().await`, the background closure can still be holding a live `Arc` clone, causing `Arc::try_unwrap` to fail and the `.expect(...)` to panic. Note the synchronous sibling `try_into_std()` (:518-526) handles exactly this failure gracefully by returning `Err(self)` instead of panicking, which highlights the inconsistency.","fix":"Either loop/retry (with a small backoff or a notification) until the `Arc` can be unwrapped instead of failing on the first attempt, or change `into_std()` to return `io::Result<StdFile>` and surface the failure instead of panicking, similar to how `try_into_std()` already returns `Err(self)`. Alternatively, track all auxiliary `spawn_blocking` closures that clone `self.std` (metadata/sync_all/sync_data/set_permissions/try_clone) through the same in-flight bookkeeping that `complete_inflight()` already awaits for reads/writes/seeks.","locations":[{"ref":"tokio/src/fs/file.rs:494-497","code":"  494 |     pub async fn into_std(mut self) -> StdFile {\n  495 |         self.inner.get_mut().complete_inflight().await;\n  496 |         Arc::try_unwrap(self.std).expect(\"Arc::try_unwrap failed\")\n  497 |     }","lines":4,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/fs/file.rs#L494-L497"},{"ref":"tokio/src/fs/file.rs:317-323","code":"  317 |     pub async fn sync_all(&self) -> io::Result<()> {\n  318 |         let mut inner = self.inner.lock().await;\n  319 |         inner.complete_inflight().await;\n  320 | \n  321 |         let std = self.std.clone();\n  322 |         asyncify(move || std.sync_all()).await\n  323 |     }","lines":7,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/fs/file.rs#L317-L323"},{"ref":"tokio/src/fs/file.rs:449-452","code":"  449 |     pub async fn metadata(&self) -> io::Result<Metadata> {\n  450 |         let std = self.std.clone();\n  451 |         asyncify(move || std.metadata()).await\n  452 |     }","lines":4,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/fs/file.rs#L449-L452"},{"ref":"tokio/src/fs/file.rs:469-476","code":"  469 |     pub async fn try_clone(&self) -> io::Result<File> {\n  470 |         self.inner.lock().await.complete_inflight().await;\n  471 |         let std = self.std.clone();\n  472 |         let std_file = asyncify(move || std.try_clone()).await?;\n  473 |         let mut file = File::from_std(std_file);\n  474 |         file.set_max_buf_size(self.max_buf_size);\n  475 |         Ok(file)\n  476 |     }","lines":8,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/fs/file.rs#L469-L476"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`declare_output_enum` (the hidden helper macro backing `tokio::select!`)\n`panic!`s directly instead of producing a `syn::Error`/`compile_error!` when\nits input doesn't match the expected shape (`\"unexpected macro input\"`) or\nwhen more than 64 branches are supplied (`\"up to 64 branches supported\"`).\nBecause this is a `proc_macro`, a bare `panic!` aborts macro expansion with a\nraw Rust panic message/backtrace from the proc-macro process rather than a\nclean, well-formatted diagnostic pointing at the user's `select!` call site.\nEvery other error path in this crate (entry.rs) carefully builds\n`syn::Error`s with spans so IDEs and rustc produce actionable diagnostics;\nthis macro is the one place that doesn't follow that convention.","fix":"Return a `syn::Error::new(Span::call_site(), \"...\").to_compile_error()` (as\n`token_stream_with_error` does in entry.rs) instead of panicking, so a\n`select!` with more than 64 branches produces a normal compile error rather\nthan a proc-macro panic:\n\n```rust\n} else {\n    return syn::Error::new(Span::call_site(), \"up to 64 branches supported\")\n        .to_compile_error()\n        .into();\n};\n```","locations":[{"ref":"tokio-macros/src/select.rs:6-43","code":"    6 | pub(crate) fn declare_output_enum(input: TokenStream) -> TokenStream {\n    7 |     // passed in is: `(_ _ _)` with one `_` per branch\n    8 |     let branches = match input.into_iter().next() {\n    9 |         Some(TokenTree::Group(group)) => group.stream().into_iter().count(),\n   10 |         _ => panic!(\"unexpected macro input\"),\n   11 |     };\n   12 | \n   13 |     let variants = (0..branches)\n   14 |         .map(|num| Ident::new(&format!(\"_{num}\"), Span::call_site()))\n   15 |         .collect::<Vec<_>>();\n   16 | \n   17 |     // Use a bitfield to track which futures completed\n   18 |     let mask = Ident::new(\n   19 |         if branches <= 8 {\n   20 |             \"u8\"\n   21 |         } else if branches <= 16 {\n   22 |             \"u16\"\n   23 |         } else if branches <= 32 {\n   24 |             \"u32\"\n   25 |         } else if branches <= 64 {\n   26 |             \"u64\"\n   27 |         } else {\n   28 |             panic!(\"up to 64 branches supported\");\n   29 |         },\n   30 |         Span::call_site(),\n   31 |     );\n   32 | \n   33 |     TokenStream::from(quote! {\n   34 |         pub(super) enum Out<#( #variants ),*> {\n   35 |             #( #variants(#variants), )*\n   36 |             // Include a `Disabled` variant signifying that all select branches\n   37 |             // failed to resolve.\n   38 |             Disabled,\n   39 |         }\n   40 | \n   41 |         pub(super) type Mask = #mask;\n   42 |     })\n   43 | }","lines":38,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-macros/src/select.rs#L6-L43"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`UnixSocket::ty()` calls `self.inner.r#type().unwrap()`, converting any I/O error from the `getsockopt(SO_TYPE)` syscall into a panic. This helper is invoked from the public, safe API methods `listen()`, `connect()`, and `datagram()`, so any transient failure of the underlying syscall (e.g. resource exhaustion, or a socket fd that was invalidated through unsafe FFI misuse) turns into an application panic instead of a propagated `io::Result` error, which is inconsistent with the rest of the type's fallible API surface.","fix":"Propagate the error instead of panicking:\n\n```rust\nfn ty(&self) -> io::Result<socket2::Type> {\n    self.inner.r#type()\n}\n```\n\nand update call sites (`listen`, `connect`, `datagram`) to use `self.ty()?` instead of `self.ty()`.","locations":[{"ref":"tokio/src/net/unix/socket.rs:94-97","code":"   94 | impl UnixSocket {\n   95 |     fn ty(&self) -> socket2::Type {\n   96 |         self.inner.r#type().unwrap()\n   97 |     }","lines":4,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/net/unix/socket.rs#L94-L97"}]},{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"`Op::file_metadata` builds an io_uring `Statx` SQE that references the caller's\nfile descriptor only as a raw integer (`types::Fd(file.as_raw_fd())`), taken from\na `&File` borrow. Unlike every other operation in this module (`Open` keeps its\n`CString`, `Rename` keeps both `CString`s, `Read`/`Write` store an owned `fd: F` /\n`OwnedFd` inside the operation struct), the `Statx` struct constructed by\n`file_metadata` only stores `_path` and `buffer` - it has no field that keeps the\ntarget file (or its fd) alive.\n\n`Op<T>` has no lifetime parameter (it is effectively `'static`), so nothing ties\nthe lifetime of the returned `Op<Statx>` future to the borrowed `&File`. The only\nreason the current single call site (`tokio/src/fs/read_uring.rs:37`) is sound is\nthat the `File` local happens to still be in scope (used again after the\n`.await`). Nothing in the API enforces this: it is legal Rust to build the future,\ndrop/close the underlying `File` (e.g. by moving the open+borrow into a smaller\nscope, or dropping/converting `file` before awaiting), and then await the\nalready-submitted `Op<Statx>` - the SQE still contains the old, now possibly\nclosed and OS-recycled, fd number. If that fd value is reused for a different\nopen file before the kernel processes the `statx` request, the completed\noperation silently reports metadata for the wrong file (classic fd-reuse\nuse-after-free), rather than failing.","fix":"Make `Statx` own (or share ownership of) the descriptor for the duration of the\noperation, the same way `Read`/`Write` do, e.g.:\n\n```rust\npub(crate) struct Statx {\n    _path: CString,\n    buffer: Box<MaybeUninit<statx>>,\n    // keep the fd alive for the lifetime of the in-flight operation\n    _fd: Option<crate::io::uring::utils::ArcFd>,\n}\n```\n\nand have `file_metadata` accept/clone an `Arc<File>` (or otherwise obtain owned\nfd-keeping storage) instead of a plain `&File`, storing it in `_fd`. This removes\nthe reliance on the caller happening to keep the borrowed `File` in scope across\nthe whole `.await`, and matches the safety comment on `Op::new` (\"parameters ...\nwill be valid for the entire duration of the operation\").","locations":[{"ref":"tokio/src/io/uring/statx.rs:47-53","code":"   47 | #[derive(Debug)]\n   48 | pub(crate) struct Statx {\n   49 |     /// This field will be read by the kernel during the operation, so we\n   50 |     /// need to ensure it is valid for the entire duration of the operation.\n   51 |     _path: CString,\n   52 |     buffer: Box<MaybeUninit<statx>>,\n   53 | }","lines":7,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/io/uring/statx.rs#L47-L53"},{"ref":"tokio/src/io/uring/statx.rs:114-145","code":"  114 |     /// Retrieves the metadata information of the given file\n  115 |     pub(crate) fn file_metadata(file: &File) -> io::Result<Op<Statx>> {\n  116 |         let mut buffer = Box::new(MaybeUninit::<statx>::uninit());\n  117 |         let empty_path: &'static CStr = c\"\";\n  118 | \n  119 |         // io-uring was introduced in linux 5.1\n  120 |         // pass in an empty path instead of null to target the file descriptor\n  121 |         // status as specified by man:\n  122 |         // https://man7.org/linux/man-pages/man2/statx.2.html\n  123 |         let statx_op = opcode::Statx::new(\n  124 |             types::Fd(file.as_raw_fd()),\n  125 |             // it should be fine to pass in `empty_path` whose lifetime\n  126 |             // does not exceed the `file_metadata()` function as a ptr here\n  127 |             // because we want to stat the dirfd not this pathname\n  128 |             empty_path.as_ptr(),\n  129 |             buffer.as_mut_ptr().cast(),\n  130 |         )\n  131 |         .flags(libc::AT_STATX_SYNC_AS_STAT | libc::AT_EMPTY_PATH)\n  132 |         .mask(libc::STATX_BASIC_STATS | libc::STATX_BTIME)\n  133 |         .build();\n  134 | \n  135 |         // SAFETY: Parameters are valid for the entire duration of the operation\n  136 |         Ok(unsafe {\n  137 |             Op::new(\n  138 |                 statx_op,\n  139 |                 Statx {\n  140 |                     _path: empty_path.into(),\n  141 |                     buffer,\n  142 |                 },\n  143 |             )\n  144 |         })\n  145 |     }","lines":32,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/io/uring/statx.rs#L114-L145"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`ClientOptions::open_with_security_attributes_raw` leaks a Windows kernel HANDLE when the\npipe mode is `PipeMode::Message` and the subsequent `SetNamedPipeHandleState` call fails.\nThe handle `h` is obtained from `CreateFileW` and validated against\n`INVALID_HANDLE_VALUE`, but it is only ever wrapped into an owning `NamedPipeClient` (which\ncloses the handle on drop) via `NamedPipeClient::from_raw_handle` at the very end of the\nfunction. If `SetNamedPipeHandleState` fails, the function returns `Err(...)` immediately\nwithout closing `h`, so the open kernel handle is never closed and leaks for the lifetime\nof the process. There is no `CloseHandle` call anywhere else in this file.","fix":"Wrap the raw handle into the owning `NamedPipeClient` before calling\n`SetNamedPipeHandleState`, so the handle is guaranteed to be closed via `Drop` on any\nsubsequent error, e.g.:\n```rust\nlet h = unsafe { windows_sys::CreateFileW(...) };\nif h == windows_sys::INVALID_HANDLE_VALUE {\n    return Err(io::Error::last_os_error());\n}\n\n// Take ownership immediately so `h` is closed on any later error path.\nlet client = unsafe { NamedPipeClient::from_raw_handle(h as _)? };\n\nif matches!(self.pipe_mode, PipeMode::Message) {\n    let mode = windows_sys::PIPE_READMODE_MESSAGE;\n    let result = unsafe {\n        windows_sys::SetNamedPipeHandleState(h, &mode, ptr::null_mut(), ptr::null_mut())\n    };\n    if result == 0 {\n        return Err(io::Error::last_os_error());\n    }\n}\n\nOk(client)\n```\nAlternatively, call `windows_sys::CloseHandle(h)` explicitly in the error branch before\nreturning.","locations":[{"ref":"tokio/src/net/windows/named_pipe.rs:2555-2583","code":" 2555 |         let h = unsafe {\n 2556 |             windows_sys::CreateFileW(\n 2557 |                 addr.as_ptr(),\n 2558 |                 desired_access,\n 2559 |                 0,\n 2560 |                 attrs as *mut _,\n 2561 |                 windows_sys::OPEN_EXISTING,\n 2562 |                 self.get_flags(),\n 2563 |                 null_mut(),\n 2564 |             )\n 2565 |         };\n 2566 | \n 2567 |         if h == windows_sys::INVALID_HANDLE_VALUE {\n 2568 |             return Err(io::Error::last_os_error());\n 2569 |         }\n 2570 | \n 2571 |         if matches!(self.pipe_mode, PipeMode::Message) {\n 2572 |             let mode = windows_sys::PIPE_READMODE_MESSAGE;\n 2573 |             let result = unsafe {\n 2574 |                 windows_sys::SetNamedPipeHandleState(h, &mode, ptr::null_mut(), ptr::null_mut())\n 2575 |             };\n 2576 | \n 2577 |             if result == 0 {\n 2578 |                 return Err(io::Error::last_os_error());\n 2579 |             }\n 2580 |         }\n 2581 | \n 2582 |         unsafe { NamedPipeClient::from_raw_handle(h as _) }\n 2583 |     }","lines":29,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/net/windows/named_pipe.rs#L2555-L2583"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"`HistogramType::value_to_bucket` computes `let max = num_buckets - 1;` for both the `Linear` and `LogLegacy` variants without checking that `num_buckets != 0`. `num_buckets` is a plain `usize` that is fully user controlled via the public, stable `Builder::metrics_poll_count_histogram_buckets` (deprecated but still present and callable) as well as the schedule-latency equivalent, with no validation anywhere between the builder and `Histogram::build()`.\n\nReproduced with:\n```rust\nlet rt = tokio::runtime::Builder::new_current_thread()\n    .enable_all()\n    .metrics_poll_count_histogram_buckets(0)\n    .enable_metrics_poll_time_histogram()\n    .build()\n    .unwrap();\nrt.block_on(async {\n    let h = tokio::spawn(async { tokio::task::yield_now().await; });\n    h.await.unwrap();\n});\n```\nwhich panics with `attempt to subtract with overflow` at histogram.rs:125 the first time a task is polled and its poll-time measurement is recorded. The same underflow exists for the `LogLegacy` arm a few lines below.","fix":"Guard against `num_buckets == 0` where the histogram is constructed, e.g. in `HistogramBuilder::build()` (tokio/src/runtime/metrics/histogram.rs:250-276) assert or clamp `num_buckets >= 1` before building the `HistogramType`, or make `value_to_bucket` defensive:\n```rust\nHistogramType::Linear(LinearHistogram { num_buckets, bucket_width }) => {\n    let max = num_buckets.saturating_sub(1);\n    cmp::min(value / *bucket_width, max as u64) as usize\n}\n```\nThe same fix should be applied to the `LogLegacy` arm.","locations":[{"ref":"tokio/src/runtime/metrics/histogram.rs:119-143","code":"  119 |     fn value_to_bucket(&self, value: u64) -> usize {\n  120 |         match self {\n  121 |             HistogramType::Linear(LinearHistogram {\n  122 |                 num_buckets,\n  123 |                 bucket_width,\n  124 |             }) => {\n  125 |                 let max = num_buckets - 1;\n  126 |                 cmp::min(value / *bucket_width, max as u64) as usize\n  127 |             }\n  128 |             HistogramType::LogLegacy(LegacyLogHistogram {\n  129 |                 num_buckets,\n  130 |                 first_bucket_width,\n  131 |             }) => {\n  132 |                 let max = num_buckets - 1;\n  133 |                 if value < *first_bucket_width {\n  134 |                     0\n  135 |                 } else {\n  136 |                     let significant_digits = 64 - value.leading_zeros();\n  137 |                     let bucket_digits = 64 - (first_bucket_width - 1).leading_zeros();\n  138 |                     cmp::min(significant_digits as usize - bucket_digits as usize, max)\n  139 |                 }\n  140 |             }\n  141 |             HistogramType::H2(log_histogram) => log_histogram.value_to_bucket(value),\n  142 |         }\n  143 |     }","lines":25,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/metrics/histogram.rs#L119-L143"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`LogHistogram::from_n_p` computes `num_buckets = ((n - p + 1) << p) as usize - bucket_offset` without checking that the left-hand side is actually large enough to hold `bucket_offset`. `LogHistogramBuilder::build()` can easily produce a `bucket_offset` (derived from `min_value`) that is larger than the bucket budget implied by a small `max_value`, causing a `usize` subtraction underflow. This is trivially reachable from the public API: simply setting a small `max_value()` while leaving the default `min_value` (100ns) panics.\n\nReproduced with:\n```rust\nlet _ = tokio::runtime::LogHistogramBuilder::default()\n    .max_value(std::time::Duration::from_nanos(1))\n    .build();\n```\nwhich panics with `attempt to subtract with overflow` at h2_histogram.rs:53. In a release build (where overflow checks are disabled) this instead wraps `num_buckets` to a huge value (close to `usize::MAX`), which is then used a few lines later in `truncate_to_max_value` and eventually to allocate a `Vec` of atomics in `Histogram::build`, i.e. an effectively unbounded allocation / OOM instead of a clean panic.","fix":"Validate that the requested `max_value` is not smaller than the resolution implied by `min_value`/`p` before computing `num_buckets`, and return a proper error (or clamp) instead of performing an unchecked subtraction:\n```rust\nfn from_n_p(n: u32, p: u32, bucket_offset: usize) -> Self {\n    assert!(n >= p, \"{n} (n) must be at least as large as {p} (p)\");\n    let total_buckets = (n - p + 1) << p;\n    assert!(\n        bucket_offset < total_buckets as usize,\n        \"bucket_offset ({bucket_offset}) must be smaller than the total bucket count ({total_buckets}); is max_value smaller than min_value?\"\n    );\n    let num_buckets = total_buckets as usize - bucket_offset;\n    Self { num_buckets, p, bucket_offset }\n}\n```\nIdeally `LogHistogramBuilder::build()` should detect `max_value < min_value` earlier and either clamp `max_value` up to `min_value` or return a descriptive `InvalidHistogramConfiguration` error instead of panicking deep inside bucket-count arithmetic.","locations":[{"ref":"tokio/src/runtime/metrics/histogram/h2_histogram.rs:51-59","code":"   51 |     fn from_n_p(n: u32, p: u32, bucket_offset: usize) -> Self {\n   52 |         assert!(n >= p, \"{n} (n) must be at least as large as {p} (p)\");\n   53 |         let num_buckets = ((n - p + 1) << p) as usize - bucket_offset;\n   54 |         Self {\n   55 |             num_buckets,\n   56 |             p,\n   57 |             bucket_offset,\n   58 |         }\n   59 |     }","lines":9,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/metrics/histogram/h2_histogram.rs#L51-L59"},{"ref":"tokio/src/runtime/metrics/histogram/h2_histogram.rs:244-258","code":"  244 |     /// Builds the log histogram\n  245 |     pub fn build(&self) -> LogHistogram {\n  246 |         let requested_max_value = duration_as_u64(self.max_value.unwrap_or(DEFAULT_MAX_VALUE));\n  247 |         let max_value = requested_max_value.next_power_of_two();\n  248 |         let min_value = duration_as_u64(self.min_value.unwrap_or(DEFAULT_MIN_VALUE));\n  249 |         let p = self.precision.unwrap_or(DEFAULT_PRECISION);\n  250 |         // determine the bucket offset by finding the bucket for the minimum value. We need to lower\n  251 |         // this by one to ensure we are at least as granular as requested.\n  252 |         let bucket_offset = cmp::max(bucket_index(min_value, p), 1) - 1;\n  253 |         // n must be at least as large as p\n  254 |         let n = max_value.ilog2().max(p) + 1;\n  255 |         LogHistogram::from_n_p(n, p, bucket_offset as usize)\n  256 |             .truncate_to_max_value(requested_max_value)\n  257 |     }\n  258 | }","lines":15,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/metrics/histogram/h2_histogram.rs#L244-L258"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"When preparing the length for an io-uring read SQE, both `Vec<u8>::uring_read_prepare`\n(tokio/src/io/uring/read.rs) and `Buf::prepare_uring_read` (tokio/src/io/blocking.rs)\ncast a `usize` length directly to `u32` with `as u32`, which silently *wraps*\ninstead of clamping when the value exceeds `u32::MAX` (4 GiB). For example in\n`read.rs`:\n\n```rust\nfn uring_read_prepare(&mut self, max_len: usize) -> (*mut u8, u32) {\n    assert!(self.spare_capacity_mut().len() >= max_len);\n    let ptr = self.spare_capacity_mut().as_mut_ptr().cast();\n    (ptr, max_len as u32)\n}\n```\n\nthe `assert!` only checks that capacity is sufficient in `usize` terms; it does\nnothing to bound `max_len` to `u32::MAX`. If `max_len` (which on 64-bit platforms\ncan be attacker/caller controlled via `File::set_max_buf_size` combined with a\nsufficiently large `ReadBuf`) is `>= 2^32`, the truncating cast silently produces\nan arbitrary small `u32` (the low 32 bits of `max_len`), so the kernel is asked to\nread far fewer bytes than intended - or even 0 bytes, which callers interpret as\nEOF - without any error being surfaced. The sibling write path in\n`tokio/src/io/uring/write.rs` gets this right by clamping instead of truncating:\n`u32::try_from(...).unwrap_or(u32::MAX)`.","fix":"Clamp instead of truncating, mirroring the pattern already used in\n`tokio/src/io/uring/write.rs`:\n\n```rust\nlet len = u32::try_from(max_len).unwrap_or(u32::MAX);\nlet len = std::cmp::min(len as usize, self.spare_capacity_mut().len()) as u32;\n```\n\nor equivalently bound `max_len` with `usize::min(max_len, u32::MAX as usize)`\nbefore the `as u32` cast in both `Vec<u8>::uring_read_prepare` and\n`Buf::prepare_uring_read`.","locations":[{"ref":"tokio/src/io/uring/read.rs:25-30","code":"   25 | impl ReadBuffer for Vec<u8> {\n   26 |     fn uring_read_prepare(&mut self, max_len: usize) -> (*mut u8, u32) {\n   27 |         assert!(self.spare_capacity_mut().len() >= max_len);\n   28 |         let ptr = self.spare_capacity_mut().as_mut_ptr().cast();\n   29 |         (ptr, max_len as u32)\n   30 |     }","lines":6,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/io/uring/read.rs#L25-L30"},{"ref":"tokio/src/io/blocking.rs:286-293","code":"  286 |         pub(crate) fn prepare_uring_read(&mut self, max_buf_size: usize) -> (*mut u8, u32) {\n  287 |             assert!(self.is_empty());\n  288 |             self.buf.reserve(max_buf_size);\n  289 |             let spare = self.buf.spare_capacity_mut();\n  290 |             let len = std::cmp::min(spare.len(), max_buf_size);\n  291 |             let ptr = spare.as_mut_ptr().cast::<u8>();\n  292 |             (ptr, len as u32)\n  293 |         }","lines":8,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/io/blocking.rs#L286-L293"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"AtomicU64::fetch_add in the Mutex-based fallback (used on 32-bit targets lacking a native 64-bit atomic) computes the new value with plain `prev + val` instead of `prev.wrapping_add(val)`. Real hardware `AtomicU64::fetch_add` is documented to always wrap around on overflow and never panic. On the fallback path, `+` on `u64` triggers Rust's debug-mode overflow check and will panic if the counter ever wraps, which is a behavior difference from the native atomic this type is meant to emulate. Every user of `crate::loom::sync::atomic::AtomicU64` (e.g. metrics counters, IDs) inherits this divergence on affected 32-bit targets.","fix":"Use wrapping arithmetic to match the documented semantics of `AtomicU64::fetch_add`:\n```rust\npub(crate) fn fetch_add(&self, val: u64, _: Ordering) -> u64 {\n    let mut lock = self.inner.lock();\n    let prev = *lock;\n    *lock = prev.wrapping_add(val);\n    prev\n}\n```","locations":[{"ref":"tokio/src/loom/std/atomic_u64_as_mutex.rs:30-35","code":"   30 |     pub(crate) fn fetch_add(&self, val: u64, _: Ordering) -> u64 {\n   31 |         let mut lock = self.inner.lock();\n   32 |         let prev = *lock;\n   33 |         *lock = prev + val;\n   34 |         prev\n   35 |     }","lines":6,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/loom/std/atomic_u64_as_mutex.rs#L30-L35"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`TcpSocket::listen` casts the caller-supplied `backlog: u32` directly to `i32` with\n`self.inner.listen(backlog as i32)`. For any `backlog > i32::MAX` (2_147_483_647), the `as` cast\nreinterprets the bit pattern and silently produces a negative `i32` value, which is then passed to\nthe underlying `listen(2)` call. This is a silent, undocumented truncation/wraparound: nothing in the\npublic API or docs warns that very large backlog values turn negative instead of being clamped to the\nplatform maximum.","fix":"Clamp instead of blindly casting:\n\n```rust\npub fn listen(self, backlog: u32) -> io::Result<TcpListener> {\n    let backlog = std::cmp::min(backlog, i32::MAX as u32) as i32;\n    self.inner.listen(backlog)?;\n    ...\n}\n```","locations":[{"ref":"tokio/src/net/tcp/socket.rs:906-907","code":"  906 |     pub fn listen(self, backlog: u32) -> io::Result<TcpListener> {\n  907 |         self.inner.listen(backlog as i32)?;","lines":2,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/net/tcp/socket.rs#L906-L907"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"`Mock::poll_write` does not correctly wait for a `Handle`-supplied write action that has not\narrived yet, and instead fails the write with a spurious `BrokenPipe` error.\n\nWhen `self.inner.actions` is empty, `poll_write` calls `self.inner.poll_action(cx)` to check\nwhether the `Handle`'s mpsc channel has a queued action. If that poll returns `Poll::Pending`\n(channel open, no message queued yet - i.e. a `Handle::write()`/`Handle::write_error()` call is\nstill to come), the code deliberately does *not* propagate `Pending` (see the\n\"do not propagate pending\" comment) and instead falls through to `self.inner.write(buf)`.\n\nBut `Inner::write` unconditionally returns `Err(ErrorKind::BrokenPipe)` whenever\n`self.actions.is_empty()` (io.rs:249-251), with no distinction between \"channel closed forever\"\nand \"channel open, action just not sent yet\". So any legitimate use of `Handle` to supply a\nwrite expectation *after* the `Mock`'s `poll_write` has already been polled once (e.g. supplying\nthe expectation from a concurrently spawned task, or after an `.await` point) will make the\nwrite fail immediately with `BrokenPipe` instead of blocking until the handle sends the action.\n\nThis is inconsistent with the equivalent path in `AsyncRead for Mock::poll_read`\n(io.rs:386-399), which correctly does `ready!(self.inner.poll_action(cx))` and therefore\nproperly returns `Poll::Pending` and resumes when the handle later supplies a `Read` action.\n\nThe regression was introduced by commit 918cf08a (\"test: fetch actions from mock handle before\nwrite\", #5814): its own added test (`write_with_handle` in tokio-test/tests/io.rs) only calls\n`handle.write(...)` *before* `mock.write_all(...).await`, so the action is already buffered in\nthe unbounded channel and `poll_action` always resolves synchronously with `Ready(Some(_))` -\nthe `Poll::Pending` branch (the actually buggy path) is never exercised by the test suite.","fix":"Propagate Pending instead of silently falling through to a guaranteed BrokenPipe error, mirroring\nthe AsyncRead impl:\n\n```rust\nif self.inner.actions.is_empty() {\n    match self.inner.poll_action(cx) {\n        Poll::Pending => return Poll::Pending,\n        Poll::Ready(Some(action)) => {\n            self.inner.actions.push_back(action);\n        }\n        Poll::Ready(None) => {\n            panic!(\"unexpected write {}\", self.pmsg());\n        }\n    }\n}\n```","locations":[{"ref":"tokio-test/src/io.rs:421-433","code":"  421 |             if self.inner.actions.is_empty() {\n  422 |                 match self.inner.poll_action(cx) {\n  423 |                     Poll::Pending => {\n  424 |                         // do not propagate pending\n  425 |                     }\n  426 |                     Poll::Ready(Some(action)) => {\n  427 |                         self.inner.actions.push_back(action);\n  428 |                     }\n  429 |                     Poll::Ready(None) => {\n  430 |                         panic!(\"unexpected write {}\", self.pmsg());\n  431 |                     }\n  432 |                 }\n  433 |             }","lines":13,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-test/src/io.rs#L421-L433"},{"ref":"tokio-test/src/io.rs:246-250","code":"  246 |     fn write(&mut self, mut src: &[u8]) -> io::Result<usize> {\n  247 |         let mut ret = 0;\n  248 | \n  249 |         if self.actions.is_empty() {\n  250 |             return Err(io::ErrorKind::BrokenPipe.into());","lines":5,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-test/src/io.rs#L246-L250"},{"ref":"tokio-test/src/io.rs:386-399","code":"  386 |                 Ok(()) => {\n  387 |                     if buf.filled().len() == filled {\n  388 |                         match ready!(self.inner.poll_action(cx)) {\n  389 |                             Some(action) => {\n  390 |                                 self.inner.actions.push_back(action);\n  391 |                                 continue;\n  392 |                             }\n  393 |                             None => {\n  394 |                                 return Poll::Ready(Ok(()));\n  395 |                             }\n  396 |                         }\n  397 |                     } else {\n  398 |                         return Poll::Ready(Ok(()));\n  399 |                     }","lines":14,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-test/src/io.rs#L386-L399"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"`ScheduledIo`'s packed readiness word reserves 15 bits for the driver \"tick\" counter (`const TICK: bit::Pack = READINESS.then(15);`, increased from 8 bits in commit 19d96c06 / PR #6135 \"increase ScheduledIo tick resolution\"), but `ReadyEvent::tick` (driver.rs:75) and every place that reads the tick back out of the packed word still truncate it to `u8`:\n`tick: TICK.unpack(curr) as u8` (scheduled_io.rs:292,335,343,350,455,479,542), and the clear-readiness comparison in `set_readiness` also compares only the low 8 bits: `Tick::Clear(t) if tick as u8 != t => return None` (scheduled_io.rs:217).\n\nBecause the tick is incremented on every readiness-setting event for a given `ScheduledIo` (once per mio event dispatched to that fd in `Driver::turn`), a sufficiently busy/long-lived I/O resource can wrap the low 8 bits of the tick counter (every 256 events) long before the full 15-bit counter wraps (every 32768 events). When that happens, `clear_readiness` (called from `poll_io`/`try_io`/`async_io` after a `WouldBlock`) can be fooled into thinking a stale `ReadyEvent` still corresponds to the current tick, and will clear readiness bits that were actually set by *newer* events the caller never observed. This reintroduces the ABA/lost-wakeup hazard that the tick field exists specifically to prevent, at a much higher probability (1/256 instead of 1/32768 events).","fix":"Either widen `ReadyEvent::tick` (and all the `as u8` truncations) to match the actual 15-bit pack width (e.g. `u16`), or shrink `TICK` back down to 8 bits to match the field that actually stores/compares it. Concretely:\n```rust\n// driver.rs\npub(super) tick: u16,\n```\nand replace every `TICK.unpack(curr) as u8` with `TICK.unpack(curr) as u16`, and `Tick::Clear(t) if tick as u8 != t` with `Tick::Clear(t) if tick as u16 != t`. This restores the full 15-bit resolution that commit 19d96c06 intended to add.","locations":[{"ref":"tokio/src/runtime/io/scheduled_io.rs:162-224","code":"  162 | // The `ScheduledIo::readiness` (`AtomicUsize`) is packed full of goodness.\n  163 | //\n  164 | // | shutdown | driver tick | readiness |\n  165 | // |----------+-------------+-----------|\n  166 | // |   1 bit  |   15 bits   |  16 bits  |\n  167 | \n  168 | const READINESS: bit::Pack = bit::Pack::least_significant(16);\n  169 | \n  170 | const TICK: bit::Pack = READINESS.then(15);\n  171 | \n  172 | const SHUTDOWN: bit::Pack = TICK.then(1);\n  173 | \n  174 | // ===== impl ScheduledIo =====\n  175 | \n  176 | impl Default for ScheduledIo {\n  177 |     fn default() -> ScheduledIo {\n  178 |         ScheduledIo {\n  179 |             linked_list_pointers: UnsafeCell::new(linked_list::Pointers::new()),\n  180 |             readiness: AtomicUsize::new(0),\n  181 |             waiters: Mutex::new(Waiters::default()),\n  182 |         }\n  183 |     }\n  184 | }\n  185 | \n  186 | impl ScheduledIo {\n  187 |     pub(crate) fn token(&self) -> mio::Token {\n  188 |         mio::Token(super::EXPOSE_IO.expose_provenance(self))\n  189 |     }\n  190 | \n  191 |     /// Invoked when the IO driver is shut down; forces this `ScheduledIo` into a\n  192 |     /// permanently shutdown state.\n  193 |     pub(super) fn shutdown(&self) {\n  194 |         let mask = SHUTDOWN.pack(1, 0);\n  195 |         self.readiness.fetch_or(mask, AcqRel);\n  196 |         self.wake(Ready::ALL);\n  197 |     }\n  198 | \n  199 |     /// Sets the readiness on this `ScheduledIo` by invoking the given closure on\n  200 |     /// the current value, returning the previous readiness value.\n  201 |     ///\n  202 |     /// # Arguments\n  203 |     /// - `tick`: whether setting the tick or trying to clear readiness for a\n  204 |     ///   specific tick.\n  205 |     /// - `f`: a closure returning a new readiness value given the previous\n  206 |     ///   readiness.\n  207 |     pub(super) fn set_readiness(&self, tick_op: Tick, f: impl Fn(Ready) -> Ready) {\n  208 |         let _ = self.readiness.fetch_update(AcqRel, Acquire, |curr| {\n  209 |             // If the io driver is shut down, then you are only allowed to clear readiness.\n  210 |             debug_assert!(SHUTDOWN.unpack(curr) == 0 || matches!(tick_op, Tick::Clear(_)));\n  211 | \n  212 |             const MAX_TICK: usize = TICK.max_value() + 1;\n  213 |             let tick = TICK.unpack(curr);\n  214 | \n  215 |             let new_tick = match tick_op {\n  216 |                 // Trying to clear readiness with an old event!\n  217 |                 Tick::Clear(t) if tick as u8 != t => return None,\n  218 |                 Tick::Clear(t) => t as usize,\n  219 |                 Tick::Set => tick.wrapping_add(1) % MAX_TICK,\n  220 |             };\n  221 |             let ready = Ready::from_usize(READINESS.unpack(curr));\n  222 |             Some(TICK.pack(new_tick, f(ready).as_usize()))\n  223 |         });\n  224 |     }","lines":63,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/io/scheduled_io.rs#L162-L224"},{"ref":"tokio/src/runtime/io/driver.rs:74-78","code":"   74 | pub(crate) struct ReadyEvent {\n   75 |     pub(super) tick: u8,\n   76 |     pub(crate) ready: Ready,\n   77 |     pub(super) is_shutdown: bool,\n   78 | }","lines":5,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/io/driver.rs#L74-L78"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"`Shared::steal_all` (used by `Handle::trace_core` to gather every task for a\ntask dump / trace) can spin forever without making progress, hanging the\nworker thread that is doing the trace (and, transitively, every other worker\nthread, since they are all blocked on the `trace_end` barrier waiting for the\nleader to finish).\n\nThe loop is:\n```\nfor remote in self.remotes.iter() {\n    let steal = &remote.steal;\n    while !steal.is_empty() {\n        if let Some(task) = steal.steal_into(&mut local, &mut stats) {\n            local.push_back([task].into_iter());\n        }\n    }\n}\n```\n`queue::Steal::steal_into` aborts and returns `None` (stealing nothing) once\nthe destination queue (`local`) already has more than\n`LOCAL_QUEUE_CAPACITY / 2` tasks buffered (see\n`tokio/src/runtime/scheduler/multi_thread/queue.rs` around line 431:\n`if dst_tail.wrapping_sub(steal) > LOCAL_QUEUE_CAPACITY as UnsignedShort / 2 { return None; }`).\n\n`local` is a single freshly created queue (capacity 256) that accumulates\ntasks stolen from *all* worker remotes. As soon as it has been filled past\nhalf its capacity (e.g. after stealing from one or two busy workers), any\nfurther call to `steal_into` for a remote that still has tasks left will keep\nreturning `None` forever. Since the `while !steal.is_empty()` condition only\nchecks the *source* queue (which is left untouched by the aborted steal), and\n`local` is never drained inside this loop, this becomes an unbounded busy\nloop (100% CPU on the tracing thread) with no way to exit as long as the\nremote still has any task in it.\n\nThis is reachable under normal usage of the (unstable) task-dump / trace\nfeature (`tokio_unstable` + `taskdump`, or a `Handle::dump()` caller) whenever\na worker's local run queue holds enough tasks (in practice a bit more than\nhalf of `LOCAL_QUEUE_CAPACITY`, i.e. > ~150-190 out of 256 by default) at the\nmoment tracing starts. When this happens, the leader thread live-locks inside\n`steal_all`, and every other worker thread is stuck forever on\n`self.shared.trace_status.trace_end.wait()`, deadlocking the whole runtime.","fix":"Stop looping on a source queue once `steal_into` reports that the\ndestination is full, and/or periodically drain `local` (e.g. spill overflow\ninto a `Vec`) instead of trying to accumulate an unbounded number of tasks\ninto a single fixed-capacity `Local` queue. For example:\n\n```rust\npub(super) fn steal_all(&self) -> super::queue::Local<Arc<Handle>> {\n    let (_steal, mut local) = super::queue::local();\n\n    let worker_metrics = WorkerMetrics::new();\n    let mut stats = Stats::new(&worker_metrics);\n\n    for remote in self.remotes.iter() {\n        let steal = &remote.steal;\n        loop {\n            match steal.steal_into(&mut local, &mut stats) {\n                Some(task) => local.push_back([task].into_iter()),\n                // `None` means either the source is empty *or* `local` is\n                // already too full to accept more -- either way, stop\n                // trying to steal from this remote to avoid spinning.\n                None => break,\n            }\n        }\n    }\n\n    local\n}\n```\nA more complete fix would collect stolen tasks into a growable `Vec` (or\ndrain `local` into the caller's structure once it nears capacity) so that no\ntasks are silently dropped from the trace when a worker's queue is large.","locations":[{"ref":"tokio/src/runtime/scheduler/multi_thread/worker/taskdump.rs:60-79","code":"   60 | impl Shared {\n   61 |     /// Steal all tasks from remotes into a single local queue.\n   62 |     pub(super) fn steal_all(&self) -> super::queue::Local<Arc<Handle>> {\n   63 |         let (_steal, mut local) = super::queue::local();\n   64 | \n   65 |         let worker_metrics = WorkerMetrics::new();\n   66 |         let mut stats = Stats::new(&worker_metrics);\n   67 | \n   68 |         for remote in self.remotes.iter() {\n   69 |             let steal = &remote.steal;\n   70 |             while !steal.is_empty() {\n   71 |                 if let Some(task) = steal.steal_into(&mut local, &mut stats) {\n   72 |                     local.push_back([task].into_iter());\n   73 |                 }\n   74 |             }\n   75 |         }\n   76 | \n   77 |         local\n   78 |     }\n   79 | }","lines":20,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/scheduler/multi_thread/worker/taskdump.rs#L60-L79"},{"ref":"tokio/src/runtime/scheduler/multi_thread/queue.rs:417-435","code":"  417 |     pub(crate) fn steal_into(\n  418 |         &self,\n  419 |         dst: &mut Local<T>,\n  420 |         dst_stats: &mut Stats,\n  421 |     ) -> Option<task::Notified<T>> {\n  422 |         // Safety: the caller is the only thread that mutates `dst.tail` and\n  423 |         // holds a mutable reference.\n  424 |         let dst_tail = unsafe { dst.inner.tail.unsync_load() };\n  425 | \n  426 |         // To the caller, `dst` may **look** empty but still have values\n  427 |         // contained in the buffer. If another thread is concurrently stealing\n  428 |         // from `dst` there may not be enough capacity to steal.\n  429 |         let (steal, _) = unpack(dst.inner.head.load(Acquire));\n  430 | \n  431 |         if dst_tail.wrapping_sub(steal) > LOCAL_QUEUE_CAPACITY as UnsignedShort / 2 {\n  432 |             // we *could* try to steal less here, but for simplicity, we're just\n  433 |             // going to abort.\n  434 |             return None;\n  435 |         }","lines":19,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/scheduler/multi_thread/queue.rs#L417-L435"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`StreamMap`'s `insert()` method enforces the \"map\" invariant that a key is\nunique by calling `self.remove(&k)` before pushing the new entry. However,\nthe `Extend<(K, V)>` implementation bypasses this invariant entirely: it\nforwards straight to `self.entries.extend(iter)` without any deduplication,\nand its `impl` block does not even require `K: Hash + Eq`. As a result,\ncalling `stream_map.extend(vec![(k, v1), (k, v2)])` (or any iterator that\nrepeats a key, e.g. via `.chain()`) silently creates two `(k, _)` entries in\nthe same map. This breaks the guarantees documented on `insert` (\"If the map\ndid have this key present, the new stream replaces the old one\") and leads to\nsurprising behavior downstream: `remove(&k)` only deletes the first matching\nentry (because it scans and returns on first match, using `swap_remove`),\nleaving a duplicate-keyed stream still active and polled forever; `len()`\nover-reports the number of logical keys; and consumers that assume \"each key\nmaps to at most one active stream\" (a documented invariant) will observe two\n`(key, item)` pairs interleaved for what should be a single logical stream.","fix":"Require `K: Hash + Eq` on the `Extend` impl and route each item through\n`insert` so duplicate keys correctly replace the previous entry, matching the\nsemantics documented on `insert`:\n\n```rust\nimpl<K, V> Extend<(K, V)> for StreamMap<K, V>\nwhere\n    K: Hash + Eq,\n{\n    fn extend<T>(&mut self, iter: T)\n    where\n        T: IntoIterator<Item = (K, V)>,\n    {\n        for (k, v) in iter {\n            self.insert(k, v);\n        }\n    }\n}\n```","locations":[{"ref":"tokio-stream/src/stream_map.rs:446-454","code":"  446 |     pub fn insert(&mut self, k: K, stream: V) -> Option<V>\n  447 |     where\n  448 |         K: Hash + Eq,\n  449 |     {\n  450 |         let ret = self.remove(&k);\n  451 |         self.entries.push((k, stream));\n  452 | \n  453 |         ret\n  454 |     }","lines":9,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-stream/src/stream_map.rs#L446-L454"},{"ref":"tokio-stream/src/stream_map.rs:727-734","code":"  727 | impl<K, V> Extend<(K, V)> for StreamMap<K, V> {\n  728 |     fn extend<T>(&mut self, iter: T)\n  729 |     where\n  730 |         T: IntoIterator<Item = (K, V)>,\n  731 |     {\n  732 |         self.entries.extend(iter);\n  733 |     }\n  734 | }","lines":8,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-stream/src/stream_map.rs#L727-L734"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`DelayQueue::clear()` resets `self.slab`, `self.expired`, and `self.wheel` (a fresh `Wheel::new()`,\nwhose internal `elapsed` starts at 0), but it does not reset the `wheel_now` field back to 0.\n`wheel_now` is a cached copy of the last known wheel time, updated inside `poll_idx()` only while\n`self.delay` is `Some` (i.e. only once a scheduled `Sleep` has actually elapsed).\n\nAfter `clear()`, `self.delay` is `None`, so the very next call to `poll_expired`/`poll_idx` skips the\nblock that would refresh `wheel_now`, and falls straight through to\n`self.wheel.poll(self.wheel_now, &mut self.slab)`. Since the freshly-created wheel is empty,\n`Wheel::poll` takes the `None` branch and calls `self.set_elapsed(now)` with the *stale* `wheel_now`\nvalue, which immediately re-seeds the brand-new wheel's `elapsed` counter with the old, pre-clear\ntimestamp instead of 0.\n\nBecause `normalize_deadline()` clamps every newly inserted deadline with\n`cmp::max(when, self.wheel.elapsed())`, any subsequent `insert_at`/`reset_at` call using an explicit\n`Instant` that is earlier than the leaked stale elapsed value (e.g. a backdated deadline, or a\ndeadline computed relative to a fixed schedule rather than `Instant::now()`) will be silently pushed\nforward to the stale elapsed value, firing later than the caller requested. This defeats the purpose\nof `clear()` fully resetting the queue's internal timing state.","fix":"Reset `wheel_now` to 0 in `clear()`, mirroring the fresh `Wheel::new()`:\n\n```rust\npub fn clear(&mut self) {\n    self.slab.clear();\n    self.expired = Stack::default();\n    self.wheel = Wheel::new();\n    self.wheel_now = 0;\n    self.delay = None;\n}\n```","locations":[{"ref":"tokio-util/src/time/delay_queue.rs:150","code":"  150 |     wheel_now: u64,","lines":1,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/time/delay_queue.rs#L150"},{"ref":"tokio-util/src/time/delay_queue.rs:1038-1043","code":" 1038 |     pub fn clear(&mut self) {\n 1039 |         self.slab.clear();\n 1040 |         self.expired = Stack::default();\n 1041 |         self.wheel = Wheel::new();\n 1042 |         self.delay = None;\n 1043 |     }","lines":6,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/time/delay_queue.rs#L1038-L1043"},{"ref":"tokio-util/src/time/delay_queue.rs:1149-1182","code":" 1149 |     fn poll_idx(&mut self, cx: &mut task::Context<'_>) -> Poll<Option<Key>> {\n 1150 |         use self::wheel::Stack;\n 1151 | \n 1152 |         let expired = self.expired.pop(&mut self.slab);\n 1153 | \n 1154 |         if expired.is_some() {\n 1155 |             return Poll::Ready(expired);\n 1156 |         }\n 1157 | \n 1158 |         loop {\n 1159 |             if let Some(ref mut delay) = self.delay {\n 1160 |                 if !delay.is_elapsed() {\n 1161 |                     ready!(Pin::new(&mut *delay).poll(cx));\n 1162 |                 }\n 1163 | \n 1164 |                 let now = crate::time::ms(delay.deadline() - self.start, crate::time::Round::Down);\n 1165 | \n 1166 |                 self.wheel_now = now;\n 1167 |             }\n 1168 | \n 1169 |             // We poll the wheel to get the next value out before finding the next deadline.\n 1170 |             let wheel_idx = self.wheel.poll(self.wheel_now, &mut self.slab);\n 1171 | \n 1172 |             self.delay = self.next_deadline().map(|when| Box::pin(sleep_until(when)));\n 1173 | \n 1174 |             if let Some(idx) = wheel_idx {\n 1175 |                 return Poll::Ready(Some(idx));\n 1176 |             }\n 1177 | \n 1178 |             if self.delay.is_none() {\n 1179 |                 return Poll::Ready(None);\n 1180 |             }\n 1181 |         }\n 1182 |     }","lines":34,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/time/delay_queue.rs#L1149-L1182"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The io_uring fallback blocks in `fs::read()` and `fs::try_exists()` are gated by `#[cfg(all(tokio_unstable, feature = \"io-uring\", feature = \"rt\", feature = \"fs\", any(target_env = \"gnu\", target_os = \"android\")))]`, which is missing the `target_os = \"linux\"` predicate that every sibling io_uring call site (`fs/write.rs`, `fs/rename.rs`, `fs/open_options.rs`, `fs/file.rs`) correctly includes. `target_env = \"gnu\"` also matches non-Linux targets such as `x86_64-pc-windows-gnu`. Since the `io-uring` crate dependency is only pulled in under `[target.'cfg(all(tokio_unstable, target_os = \"linux\"))'.dependencies]` in Cargo.toml, but Cargo still allows the `io-uring` *feature* to be activated on other targets, compiling with `--cfg tokio_unstable --features io-uring,rt,fs` for a `gnu`-env non-Linux target reaches these blocks and fails to compile: `crate::fs::read_uring` doesn't exist (it's properly gated behind `target_os = \"linux\"` via the `cfg_io_uring!` macro) and the `io_uring` crate itself isn't a dependency there. Verified with an actual cross-compile: `RUSTFLAGS=\"--cfg tokio_unstable\" cargo check --target x86_64-pc-windows-gnu --no-default-features --features fs,rt,io-uring` produces `E0432: unresolved import 'crate::fs::read_uring'`, `E0433: cannot find module or crate 'io_uring'`, and `E0599: no method named 'io' found` in both `fs/read.rs` and `fs/try_exists.rs`.","fix":"Add `target_os = \"linux\"` to both cfg attributes, matching the other io_uring call sites, e.g.:\n```rust\n#[cfg(all(\n    tokio_unstable,\n    feature = \"io-uring\",\n    feature = \"rt\",\n    feature = \"fs\",\n    target_os = \"linux\",\n    any(target_env = \"gnu\", target_os = \"android\")\n))]\n```","locations":[{"ref":"tokio/src/fs/read.rs:59-86","code":"   59 |     #[cfg(all(\n   60 |         tokio_unstable,\n   61 |         feature = \"io-uring\",\n   62 |         feature = \"rt\",\n   63 |         feature = \"fs\",\n   64 |         // libc::statx is only supported on these platforms\n   65 |         // FIXME: Add musl target env when our minimum supported\n   66 |         // rust version is 1.93. To clarify, statx support is\n   67 |         // introduced to musl in 1.25 as mentioned officially here:\n   68 |         // https://musl.libc.org/releases.html.\n   69 |         // However, rustup target_env building for *-linux-musl\n   70 |         // uses 1.25 musl on all *-linux-musl platforms starting\n   71 |         // in 1.93 stable rust version.\n   72 |         // https://blog.rust-lang.org/2025/12/05/Updating-musl-1.2.5/\n   73 |         any(target_env = 0a3e35f1626643674ba9faf9569c/tokio/src/fs/try_exists.rs#L28-L53"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`PollEvented::reregister` deregisters the current `Registration` and then tries\nto build a replacement, propagating failure with `?` *after* the old registration\nhas already been torn down:\n\n```rust\npub(crate) fn reregister(&mut self, interest: Interest) -> io::Result<()> {\n    let io = self.io.as_mut().unwrap();\n    let _ = self.registration.deregister(io);\n    self.registration =\n        Registration::new_with_interest_and_handle(io, interest, scheduler::Handle::current())?;\n    Ok(())\n}\n```\n\nIf `Registration::new_with_interest_and_handle` returns `Err` (e.g. no runtime\ndriver initialized for I/O, or the underlying mio `register` call fails), the `?`\nreturns early *before* `self.registration` is reassigned. `self.registration`\nis left holding the old `Registration`, which was already deregistered from mio's\n`Poll` above (`self.registration.deregister(io)`), i.e. `io` no longer produces\nany readiness events for it. The struct is now in a state where\n`poll_read_ready`/`poll_write_ready` on the stale `self.registration` will never\nbe woken again by the OS, silently hanging forever if a caller retries after\nseeing the error rather than discarding the object.","fix":"Build the replacement registration before discarding the old one, and only\nreplace `self.registration` on success, e.g.:\n\n```rust\npub(crate) fn reregister(&mut self, interest: Interest) -> io::Result<()> {\n    let io = self.io.as_mut().unwrap();\n    let new_registration =\n        Registration::new_with_interest_and_handle(io, interest, scheduler::Handle::current());\n    let _ = self.registration.deregister(io);\n    self.registration = new_registration?;\n    Ok(())\n}\n```\n\nThis still deregisters unconditionally, but at least documents/guarantees that a\nfailure here should be treated as fatal for the `PollEvented` (the caller must\nnot keep polling it), since there is no way to keep the object fully live once\nthe OS-level registration has been dropped.","locations":[{"ref":"tokio/src/io/poll_evented.rs:142-150","code":"  142 |     #[cfg(all(feature = \"process\", target_os = \"linux\"))]\n  143 |     pub(crate) fn reregister(&mut self, interest: Interest) -> io::Result<()> {\n  144 |         let io = self.io.as_mut().unwrap(); // As io shouldn't ever be None, just unwrap here.\n  145 |         let _ = self.registration.deregister(io);\n  146 |         self.registration =\n  147 |             Registration::new_with_interest_and_handle(io, interest, scheduler::Handle::current())?;\n  148 | \n  149 |         Ok(())\n  150 |     }","lines":9,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/io/poll_evented.rs#L142-L150"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `loom` (test) implementations of `Mutex`/`RwLock` in mocked.rs call `.unwrap()` on the lock result (e.g. `self.0.lock().unwrap()`, `self.0.read().unwrap()`), which panics if the inner `loom::sync` lock is poisoned. The production implementations in tokio/src/loom/std/mutex.rs and tokio/src/loom/std/rwlock.rs are explicitly documented as \"Adapter for `std::Mutex`/`RwLock` that removes the poisoning aspects from its API\" and instead recover via `p_err.into_inner()`, i.e. they never panic due to poisoning. This means any internal logic that depends on tokio's poison-tolerant lock semantics (continuing to operate after a panic elsewhere while a lock was held) behaves differently, and is not exercised the same way, under loom testing vs. real threads: loom would abort with a panic in exactly the scenario production is designed to tolerate, so this recovery path is effectively untested by loom.","fix":"Mirror the poison-swallowing behavior of the std implementation in
