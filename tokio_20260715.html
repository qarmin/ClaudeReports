 delay reclamation of memory for\nalready-completed tasks behind it, and that users who need bounded memory usage regardless of\ncompletion order should consider `JoinSet` or `TaskTracker` instead.","locations":[{"ref":"tokio-util/src/task/join_queue.rs:13-24","code":"   13 | /// A FIFO queue for of tasks spawned on a Tokio runtime.\n   14 | ///\n   15 | /// A [`JoinQueue`] can be used to await the completion of the tasks in FIFO\n   16 | /// order. That is, if tasks are spawned in the order A, B, C, then\n   17 | /// awaiting the next completed task will always return A first, then B,\n   18 | /// then C, regardless of the order in which the tasks actually complete.\n   19 | ///\n   20 | /// All of the tasks must have the same return type `T`.\n   21 | ///\n   22 | /// When the [`JoinQueue`] is dropped, all tasks in the [`JoinQueue`] are\n   23 | /// immediately aborted.\n   24 | pub struct JoinQueue<T>(VecDeque<AbortOnDropHandle<T>>);","lines":12,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/task/join_queue.rs#L13-L24"},{"ref":"tokio-util/src/task/join_queue.rs:319-333","code":"  319 |     pub fn poll_join_next(&mut self, cx: &mut Context<'_>) -> Poll<Option<Result<T, JoinError>>> {\n  320 |         let jh = match self.0.front_mut() {\n  321 |             None => return Poll::Ready(None),\n  322 |             Some(jh) => jh,\n  323 |         };\n  324 |         if let Poll::Ready(res) = Pin::new(jh).poll(cx) {\n  325 |             // Use `detach` to avoid calling `abort` on a task that has already completed.\n  326 |             // Dropping `AbortOnDropHandle` would abort the task, but since it is finished,\n  327 |             // we only need to drop the `JoinHandle` for cleanup.\n  328 |             drop(self.0.pop_front().unwrap().detach());\n  329 |             Poll::Ready(Some(res))\n  330 |         } else {\n  331 |             Poll::Pending\n  332 |         }\n  333 |     }","lines":15,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/task/join_queue.rs#L319-L333"}]},{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`SetCurrentGuard::drop` (context/current.rs:75-97) is documented to panic when guards\nare dropped out of order, except when the thread is already panicking, in which case\nit silently no-ops (\"Just return... this will leave handles in a wonky state though...\").\nThat comment understates the actual consequence: consider two nested guards g1 (depth=1,\nprev=h0) and g2 (depth=2, prev=h1) whose owning values are dropped out of LIFO order\n(e.g. as struct fields, which drop in declaration order rather than reverse-creation\norder) while the thread is unwinding from an unrelated panic:\n- g1 drops first. `depth (2) != self.depth (1)` and `thread::panicking()` is true, so\n  the branch silently returns *without* touching `ctx.current.handle` or `ctx.current.depth`,\n  and `g1.prev` (h0) is dropped and lost forever.\n- g2 drops next. Now `depth (2) == self.depth (2)`, so it proceeds normally and sets\n  `ctx.current.handle = g2.prev` (h1) and `ctx.current.depth = 1`.\n\nThe thread-local `current` handle is left pointing at `h1` (an intermediate,\nalready-supposed-to-be-exited runtime handle) at depth 1, instead of being fully\nunwound back to `h0` at depth 0. If the panic is caught with `std::panic::catch_unwind`\nand the same OS thread continues running async code afterward (a supported and common\npattern, e.g. in thread pools that catch task panics), any subsequent\n`Handle::current()` / `context::with_current` call on that thread will silently observe\nthe stale `h1` runtime handle -- the exact \"cross-runtime handle leakage\" this logic is\nsupposed to prevent -- with no panic or other signal that anything went wrong, since the\nout-of-order check only fires when the thread is *not* already panicking.","fix":"When an out-of-order drop is detected while panicking, either poison the thread-local\n`Context` (e.g. force `ctx.current.handle` to `None` and `depth` to `0`, forcing any\nlater use on this thread to hit the normal \"no runtime context\" error path) rather than\nleaving intermediate state in place, or track enough information to fully unwind all\noutstanding guards' `prev` values instead of only ever applying the last one processed.\nAt minimum, document more prominently that `catch_unwind`-ing across out-of-order\n`EnterGuard` drops can leave a stale runtime handle current on that thread.","locations":[{"ref":"tokio/src/runtime/context/current.rs:75-97","code":"   75 | impl Drop for SetCurrentGuard {\n   76 |     fn drop(&mut self) {\n   77 |         CONTEXT.with(|ctx| {\n   78 |             let depth = ctx.current.depth.get();\n   79 | \n   80 |             if depth != self.depth {\n   81 |                 if !std::thread::panicking() {\n   82 |                     panic!(\n   83 |                         \"`EnterGuard` values dropped out of order. Guards returned by \\\n   84 |                          `tokio::runtime::Handle::enter()` must be dropped in the reverse \\\n   85 |                          order as they were acquired.\"\n   86 |                     );\n   87 |                 } else {\n   88 |                     // Just return... this will leave handles in a wonky state though...\n   89 |                     return;\n   90 |                 }\n   91 |             }\n   92 | \n   93 |             *ctx.current.handle.borrow_mut() = self.prev.take();\n   94 |             ctx.current.depth.set(depth - 1);\n   95 |         });\n   96 |     }\n   97 | }","lines":23,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/context/current.rs#L75-L97"}]},{"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`display_eq` in runtime.rs implements a hand-rolled, streaming\nprefix-matching `std::fmt::Write` shim just to compare a `Display` value's\nformatted output against a string constant without allocating a `String`:\n```rust\nfn display_eq(d: impl std::fmt::Display, s: &str) -> bool {\n    ...\n    struct FormatEq<'r> { remainder: &'r str, unequal: bool }\n    impl<'r> Write for FormatEq<'r> { ... }\n    ...\n}\n```\nThis is only used once, by the public `is_rt_shutdown_err` helper, which is\nnot a hot path (it is called by users diagnosing an `io::Error`, not from\ninside the scheduler). The custom `Write` impl is subtle (it silently assumes\nevery fragment passed to `write_str` is a literal prefix boundary, which is\ntrue for the current error message but is a fragile assumption for a\n`Display` impl in general, e.g. if the message ever used field\npadding/alignment which routes through different `Formatter` methods). The\ncomplexity is disproportionate to the negligible cost of a single small\nheap allocation in a non-hot, diagnostic-only code path.","fix":"Replace with a simple, obviously-correct comparison:\n```rust\nfn display_eq(d: impl std::fmt::Display, s: &str) -> bool {\n    d.to_string() == s\n}\n```\nThis is far easier to audit for correctness and the extra allocation is\nirrelevant on this error-inspection path.","locations":[{"ref":"tokio/src/runtime/runtime.rs:525-552","code":"  525 | fn display_eq(d: impl std::fmt::Display, s: &str) -> bool {\n  526 |     use std::fmt::Write;\n  527 | \n  528 |     struct FormatEq<'r> {\n  529 |         remainder: &'r str,\n  530 |         unequal: bool,\n  531 |     }\n  532 | \n  533 |     impl<'r> Write for FormatEq<'r> {\n  534 |         fn write_str(&mut self, s: &str) -> std::fmt::Result {\n  535 |             if !self.unequal {\n  536 |                 if let Some(new_remainder) = self.remainder.strip_prefix(s) {\n  537 |                     self.remainder = new_remainder;\n  538 |                 } else {\n  539 |                     self.unequal = true;\n  540 |                 }\n  541 |             }\n  542 |             Ok(())\n  543 |         }\n  544 |     }\n  545 | \n  546 |     let mut fmt_eq = FormatEq {\n  547 |         remainder: s,\n  548 |         unequal: false,\n  549 |     };\n  550 |     let _ = write!(fmt_eq, \"{d}\");\n  551 |     fmt_eq.remainder.is_empty() && !fmt_eq.unequal\n  552 | }","lines":28,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/runtime.rs#L525-L552"}]},{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The `Inner` enum (Traditional vs Alternative timer backends) duplicates the `is_shutdown` and `did_wake` AtomicBool fields across both variants, and every accessor (`Driver::shutdown`, `Handle::unpark`, `Handle::did_wake`, `Inner::is_shutdown`) has to match on the enum and repeat near-identical arms for each variant just to reach the same field. This is boilerplate that grows linearly with the number of backend variants and risks the two arms silently drifting apart (e.g. one arm using a different Ordering than the other) since nothing enforces they stay in sync.","fix":"Hoist the `is_shutdown`/`did_wake` AtomicBools out of the `Traditional`/`Alternative` variants into a shared struct that both variants hold (or that sits alongside the enum in `Handle`), so accessors read/write a single field instead of matching on the backend variant.","locations":[{"ref":"tokio/src/runtime/time/mod.rs:95-127","code":"   95 | enum Inner {\n   96 |     Traditional {\n   97 |         // The state is split like this so `Handle` can access `is_shutdown` without locking the mutex\n   98 |         state: Mutex<InnerState>,\n   99 | \n  100 |         /// True if the driver is being shutdown.\n  101 |         is_shutdown: AtomicBool,\n  102 | \n  103 |         // When `true`, a call to `park_timeout` should immediately return and time\n  104 |         // should not advance. One reason for this to be `true` is if the task\n  105 |         // passed to `Runtime::block_on` called `task::yield_now()`.\n  106 |         //\n  107 |         // While it may look racy, it only has any effect when the clock is paused\n  108 |         // and pausing the clock is restricted to a single-threaded runtime.\n  109 |         #[cfg(feature = \"test-util\")]\n  110 |         did_wake: AtomicBool,\n  111 |     },\n  112 | \n  113 |     #[cfg(all(tokio_unstable, feature = \"rt-multi-thread\"))]\n  114 |     Alternative {\n  115 |         /// True if the driver is being shutdown.\n  116 |         is_shutdown: AtomicBool,\n  117 | \n  118 |         // When `true`, a call to `park_timeout` should immediately return and time\n  119 |         // should not advance. One reason for this to be `true` is if the task\n  120 |         // passed to `Runtime::block_on` called `task::yield_now()`.\n  121 |         //\n  122 |         // While it may look racy, it only has any effect when the clock is paused\n  123 |         // and pausing the clock is restricted to a single-threaded runtime.\n  124 |         #[cfg(feature = \"test-util\")]\n  125 |         did_wake: AtomicBool,\n  126 |     },\n  127 | }","lines":33,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/time/mod.rs#L95-L127"},{"ref":"tokio/src/runtime/time/mod.rs:189-211","code":"  189 |     pub(crate) fn shutdown(&mut self, rt_handle: &driver::Handle) {\n  190 |         let handle = rt_handle.time();\n  191 | \n  192 |         if handle.is_shutdown() {\n  193 |             return;\n  194 |         }\n  195 | \n  196 |         match &handle.inner {\n  197 |             Inner::Traditional { is_shutdown, .. } => {\n  198 |                 is_shutdown.store(true, Ordering::SeqCst);\n  199 |             }\n  200 |             #[cfg(all(tokio_unstable, feature = \"rt-multi-thread\"))]\n  201 |             Inner::Alternative { is_shutdown, .. } => {\n  202 |                 is_shutdown.store(true, Ordering::SeqCst);\n  203 |             }\n  204 |         }\n  205 | \n  206 |         // Advance time forward to the end of time.\n  207 | \n  208 |         handle.process_at_time(u64::MAX);\n  209 | \n  210 |         self.park.shutdown(rt_handle);\n  211 |     }","lines":23,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/time/mod.rs#L189-L211"},{"ref":"tokio/src/runtime/time/mod.rs:453-484","code":"  453 |     cfg_test_util! {\n  454 |         pub(super) fn did_wake(&self) -> bool {\n  455 |             match &self.inner {\n  456 |                 Inner::Traditional { did_wake, .. } => did_wake.swap(false, Ordering::SeqCst),\n  457 |                 #[cfg(all(tokio_unstable, feature = \"rt-multi-thread\"))]\n  458 |                 Inner::Alternative { did_wake, .. } => did_wake.swap(false, Ordering::SeqCst),\n  459 |             }\n  460 |         }\n  461 |     }\n  462 | }\n  463 | \n  464 | // ===== impl Inner =====\n  465 | \n  466 | impl Inner {\n  467 |     /// Locks the driver's inner structure\n  468 |     pub(super) fn lock(&self) -> crate::loom::sync::MutexGuard<'_, InnerState> {\n  469 |         match self {\n  470 |             Inner::Traditional { state, .. } => state.lock(),\n  471 |             #[cfg(all(tokio_unstable, feature = \"rt-multi-thread\"))]\n  472 |             Inner::Alternative { .. } => unreachable!(\"unreachable in alternative timer\"),\n  473 |         }\n  474 |     }\n  475 | \n  476 |     // Check whether the driver has been shutdown\n  477 |     pub(super) fn is_shutdown(&self) -> bool {\n  478 |         match self {\n  479 |             Inner::Traditional { is_shutdown, .. } => is_shutdown.load(Ordering::SeqCst),\n  480 |             #[cfg(all(tokio_unstable, feature = \"rt-multi-thread\"))]\n  481 |             Inner::Alternative { is_shutdown, .. } => is_shutdown.load(Ordering::SeqCst),\n  482 |         }\n  483 |     }\n  484 | }","lines":32,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/time/mod.rs#L453-L484"},{"ref":"tokio/src/runtime/time/handle.rs:22-33","code":"   22 |     pub(crate) fn unpark(&self) {\n   23 |         #[cfg(feature = \"test-util\")]\n   24 |         match self.inner {\n   25 |             super::Inner::Traditional { ref did_wake, .. } => {\n   26 |                 did_wake.store(true, std::sync::atomic::Ordering::SeqCst);\n   27 |             }\n   28 |             #[cfg(all(tokio_unstable, feature = \"rt-multi-thread\"))]\n   29 |             super::Inner::Alternative { ref did_wake, .. } => {\n   30 |                 did_wake.store(true, std::sync::atomic::Ordering::SeqCst);\n   31 |             }\n   32 |         }\n   33 |     }","lines":12,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/time/handle.rs#L22-L33"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"hard","description":"In `Handle::register_op`, once an SQE has been pushed onto the local (userspace) submission-queue ring via `ctx.ring_mut().submission().push(&entry)`, the local tail pointer has already been advanced. If the *subsequent* `submit_or_remove(ctx)?` call (uring.rs:293) then fails (i.e. `ctx.submit()` returns a non-`EBUSY` OS error), the code removes the operation's bookkeeping via `ctx.remove_op(index)` and propagates the error to the caller -- but it has no way to retract the SQE that was already written into the ring buffer. That SQE, still carrying `user_data == index`, remains queued and will be submitted to the kernel on some future, unrelated call to `submit()`.\n\nBy the time the kernel completes that leftover operation, `index` in the `ops` slab may have been reused by `slab::Slab::insert` for a completely different, unrelated operation (slab reuses freed slots). `dispatch_completions` will then either:\n  - find `None` at that index (if it hasn't been reused) and panic the whole I/O driver via `panic!(\"no op at index {idx}\")`, or\n  - find an unrelated `Lifecycle::Waiting`/`Lifecycle::Cancelled` entry belonging to a *different* operation and either panic via `panic!(\"unexpected lifecycle for slot {idx}: {other:?}\")`, or (in the `Cancelled(CancelData::Open(_))` case) wrongly interpret the stale CQE's result as an fd to reconstruct via `OwnedFd::from_raw_fd`, or wake the wrong task with a bogus result.\n\nThis is a real (if rare, since it requires a hard `io_uring_enter` failure such as `ENOMEM`) correctness/safety hazard: an aborted `register_op` call silently leaves a dangling, already-queued SQE that outlives the `index` it was tagged with.","fix":"Do not reuse an `index`/slab slot while a previously-pushed-but-unsubmitted SQE referencing it might still be sitting in the submission queue. One approach: track whether `push()` has already succeeded before the failing `submit()`, and if so, keep the slab entry alive (e.g. move it to a `Lifecycle::Cancelled`-like \"orphaned, discard on completion\" state) instead of removing it, so a later completion for that `user_data` is still recognized and safely discarded rather than colliding with a reused index:\n```rust\nlet submit_or_remove = |ctx: &mut UringContext, pushed: bool| -> io::Result<()> {\n    if let Err(e) = ctx.submit() {\n        if pushed {\n            // entry is already queued in the SQ ring and cannot be un-pushed;\n            // keep the slab slot alive so a stray completion doesn't collide\n            // with a reused index.\n            if let Some(slot) = ctx.ops.get_mut(index) {\n                *slot = Lifecycle::Cancelled(CancelData::Ignore);\n            }\n        } else {\n            ctx.remove_op(index);\n        }\n        return Err(e);\n    }\n    Ok(())\n};\n```","locations":[{"ref":"tokio/src/runtime/io/driver/uring.rs:262-296","code":"  262 |     pub(crate) unsafe fn register_op(&self, entry: Entry, waker: Waker) -> io::Result<usize> {\n  263 |         assert!(self.uring_probe.initialized());\n  264 | \n  265 |         // Uring is initialized.\n  266 | \n  267 |         let mut guard = self.get_uring().lock();\n  268 |         let ctx = &mut *guard;\n  269 |         let index = ctx.ops.insert(Lifecycle::Waiting(waker));\n  270 |         let entry = entry.user_data(index as u64);\n  271 | \n  272 |         let submit_or_remove = |ctx: &mut UringContext| -> io::Result<()> {\n  273 |             if let Err(e) = ctx.submit() {\n  274 |                 // Submission failed, remove the entry from the slab and return the error\n  275 |                 ctx.remove_op(index);\n  276 |                 return Err(e);\n  277 |             }\n  278 |             Ok(())\n  279 |         };\n  280 | \n  281 |         // SAFETY: entry is valid for the entire duration of the operation\n  282 |         while unsafe { ctx.ring_mut().submission().push(&entry).is_err() } {\n  283 |             // If the submission queue is full, flush it to the kernel\n  284 |             submit_or_remove(ctx)?;\n  285 |         }\n  286 | \n  287 |         // Ensure that the completion queue is not full before submitting the entry.\n  288 |         while ctx.ring_mut().completion().is_full() {\n  289 |             ctx.dispatch_completions();\n  290 |         }\n  291 | \n  292 |         // Note: For now, we submit the entry immediately without utilizing batching.\n  293 |         submit_or_remove(ctx)?;\n  294 | \n  295 |         Ok(index)\n  296 |     }","lines":35,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/io/driver/uring.rs#L262-L296"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`assert_ready_ok!` and `assert_ready_err!` reference the sibling macros via the hardcoded path\n`tokio_test::{assert_ready, assert_ok}` / `tokio_test::{assert_ready, assert_err}` instead of the\nmacro-hygienic `$crate::`. `assert_ready_eq!` in the same file correctly uses `$crate::assert_ready!`,\nshowing the intended pattern. Because the other two macros hardcode the literal crate name, they\nwill fail to resolve if a downstream `Cargo.toml` renames the dependency (e.g.\n`tokio-test-fork = { package = \"tokio-test\", ... }`) or in any context where the defining crate\nisn't in scope under the exact name `tokio_test`, even though `$crate` would resolve correctly in\nthose situations.","fix":"Use `$crate` instead of the hardcoded crate name, consistent with `assert_ready_eq!`:\n\n```rust\nmacro_rules! assert_ready_ok {\n    ($e:expr) => {{\n        let val = $crate::assert_ready!($e);\n        $crate::assert_ok!(val)\n    }};\n    ...\n}\n```","locations":[{"ref":"tokio-test/src/macros.rs:61-73","code":"   61 | #[macro_export]\n   62 | macro_rules! assert_ready_ok {\n   63 |     ($e:expr) => {{\n   64 |         use tokio_test::{assert_ready, assert_ok};\n   65 |         let val = assert_ready!($e);\n   66 |         assert_ok!(val)\n   67 |     }};\n   68 |     ($e:expr, $($msg:tt)+) => {{\n   69 |         use tokio_test::{assert_ready, assert_ok};\n   70 |         let val = assert_ready!($e, $($msg)*);\n   71 |         assert_ok!(val, $($msg)*)\n   72 |     }};\n   73 | }","lines":13,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-test/src/macros.rs#L61-L73"},{"ref":"tokio-test/src/macros.rs:94-106","code":"   94 | #[macro_export]\n   95 | macro_rules! assert_ready_err {\n   96 |     ($e:expr) => {{\n   97 |         use tokio_test::{assert_ready, assert_err};\n   98 |         let val = assert_ready!($e);\n   99 |         assert_err!(val)\n  100 |     }};\n  101 |     ($e:expr, $($msg:tt)+) => {{\n  102 |         use tokio_test::{assert_ready, assert_err};\n  103 |         let val = assert_ready!($e, $($msg)*);\n  104 |         assert_err!(val, $($msg)*)\n  105 |     }};\n  106 | }","lines":13,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-test/src/macros.rs#L94-L106"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`Drop for Waiting` (tokio/src/process/windows.rs:152-162) panics if\n`UnregisterWaitEx` fails:\n```rust\nfn drop(&mut self) {\n    unsafe {\n        let rc = UnregisterWaitEx(self.wait_object, INVALID_HANDLE_VALUE);\n        if rc == 0 {\n            panic!(\"failed to unregister: {}\", io::Error::last_os_error());\n        }\n        drop(Box::from_raw(self.tx));\n    }\n}\n```\n`Waiting` is a field reachable from `Child` (`Child::waiting: Option<Waiting>`), so this\nDrop impl can run as part of unwinding when a `Child`/`SpawnedChild` future is dropped\nwhile a panic is already propagating (e.g. a task that owns a `tokio::process::Child`\npanics, and the future is dropped during stack unwinding). A panic raised from within a\n`Drop::drop` that executes during an active unwind causes the Rust runtime to abort the\nprocess immediately (\"thread panicked while panicking\"), rather than allowing the\noriginal panic to be handled normally (e.g. caught by `catch_unwind`, or reported by a\ntask's `JoinHandle`). This turns what should be a recoverable task panic into an\nunconditional process abort whenever it coincides with a wait-handle unregister failure.","fix":"Avoid panicking in `Drop`; log the error (e.g. via `eprintln!`/`tracing`) or ignore it\nif `UnregisterWaitEx` fails, since Drop code cannot meaningfully propagate the failure\nand a leaked wait registration is a lesser problem than a guaranteed process abort:\n```rust\nfn drop(&mut self) {\n    unsafe {\n        let rc = UnregisterWaitEx(self.wait_object, INVALID_HANDLE_VALUE);\n        if rc == 0 {\n            // Avoid panicking in Drop (would abort the process if called during\n            // unwinding); this failure should be exceptionally rare.\n            debug_assert!(false, \"failed to unregister: {}\", io::Error::last_os_error());\n        }\n        drop(Box::from_raw(self.tx));\n    }\n}\n```","locations":[{"ref":"tokio/src/process/windows.rs:152-162","code":"  152 | impl Drop for Waiting {\n  153 |     fn drop(&mut self) {\n  154 |         unsafe {\n  155 |             let rc = UnregisterWaitEx(self.wait_object, INVALID_HANDLE_VALUE);\n  156 |             if rc == 0 {\n  157 |                 panic!(\"failed to unregister: {}\", io::Error::last_os_error());\n  158 |             }\n  159 |             drop(Box::from_raw(self.tx));\n  160 |         }\n  161 |     }\n  162 | }","lines":11,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/process/windows.rs#L152-L162"}]},{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`Builder`'s `Debug` impl (builder.rs:2061-2091) only prints a small subset of the\nstruct's fields (name, worker_threads, max_blocking_threads, thread_name,\nthread_stack_size, after_start, before_stop, before_park, after_unpark,\nenable_eager_driver_handoff) -- fields like `enable_io`, `enable_time`, `keep_alive`,\n`global_queue_interval`, `event_interval`, `disable_lifo_slot`, `seed_generator`,\n`unhandled_panic`, `timer_flavor`, the metrics-histogram settings, `before_spawn`,\n`after_termination`, `before_poll`/`after_poll` are always omitted regardless of the\nbranch taken. Yet whether `finish()` or `finish_non_exhaustive()` is used is decided\nsolely by whether `self.name` is `Some`:\n```rust\nif self.name.is_none() {\n    debug.finish_non_exhaustive()\n} else {\n    debug.finish()\n}\n```\nSince fields are unconditionally omitted either way, `finish()` (which implies \"this is\nthe complete set of fields\") is misleading whenever `name` is set -- the Debug output\nlooks complete but is not.","fix":"Always call `debug.finish_non_exhaustive()` regardless of whether `name` is set, since\nthe field list is never actually exhaustive:\n```rust\ndebug\n    .field(\"worker_threads\", &self.worker_threads)\n    // ... other fields ...\n    .finish_non_exhaustive()\n```","locations":[{"ref":"tokio/src/runtime/builder.rs:2061-2091","code":" 2061 | impl fmt::Debug for Builder {\n 2062 |     fn fmt(&self, fmt: &mut fmt::Formatter<'_>) -> fmt::Result {\n 2063 |         let mut debug = fmt.debug_struct(\"Builder\");\n 2064 | \n 2065 |         if let Some(name) = &self.name {\n 2066 |             debug.field(\"name\", name);\n 2067 |         }\n 2068 | \n 2069 |         debug\n 2070 |             .field(\"worker_threads\", &self.worker_threads)\n 2071 |             .field(\"max_blocking_threads\", &self.max_blocking_threads)\n 2072 |             .field(\n 2073 |                 \"thread_name\",\n 2074 |                 &\"<dyn Fn() -> String + Send + Sync + 'static>\",\n 2075 |             )\n 2076 |             .field(\"thread_stack_size\", &self.thread_stack_size)\n 2077 |             .field(\"after_start\", &self.after_start.as_ref().map(|_| \"...\"))\n 2078 |             .field(\"before_stop\", &self.before_stop.as_ref().map(|_| \"...\"))\n 2079 |             .field(\"before_park\", &self.before_park.as_ref().map(|_| \"...\"))\n 2080 |             .field(\"after_unpark\", &self.after_unpark.as_ref().map(|_| \"...\"))\n 2081 |             .field(\n 2082 |                 \"enable_eager_driver_handoff\",\n 2083 |                 &self.enable_eager_driver_handoff,\n 2084 |             );\n 2085 | \n 2086 |         if self.name.is_none() {\n 2087 |             debug.finish_non_exhaustive()\n 2088 |         } else {\n 2089 |             debug.finish()\n 2090 |         }\n 2091 |     }","lines":31,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/builder.rs#L2061-L2091"}]}]</script>

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
