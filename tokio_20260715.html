that point, the `None` branch of the outer `match` (which is the\nonly place a new signal listener is ever installed) is never reached again. If the SIGCHLD\nwatch channel's sender is ever dropped (e.g. the signal driver backing it is torn down)\nwhile orphaned child processes are still queued, `reap_orphans` silently becomes a\npermanent no-op: queued orphans are never waited on again and remain zombies for the\nremaining lifetime of the process.","fix":"Treat a closed watch channel the same as \"no listener registered\" so a new one can be\ninstalled on the next call, e.g.:\n```rust\nmatch &mut *sigchild_guard {\n    Some(sigchild) => {\n        match sigchild.try_has_changed() {\n            Some(Ok(())) => drain_orphan_queue(self.queue.lock()),\n            Some(Err(_)) => {\n                // Sender gone; drop the stale listener so it gets re-registered below.\n                *sigchild_guard = None;\n            }\n            None => {}\n        }\n    }\n    None => { /* existing registration logic */ }\n}\n```","locations":[{"ref":"tokio/src/process/unix/orphan.rs:79-110","code":"   79 |     pub(crate) fn reap_orphans(&self, handle: &SignalHandle)\n   80 |     where\n   81 |         T: Wait,\n   82 |     {\n   83 |         // If someone else is holding the lock, they will be responsible for draining\n   84 |         // the queue as necessary, so we can safely bail if that happens\n   85 |         if let Some(mut sigchild_guard) = self.sigchild.try_lock() {\n   86 |             match &mut *sigchild_guard {\n   87 |                 Some(sigchild) => {\n   88 |                     if sigchild.try_has_changed().and_then(Result::ok).is_some() {\n   89 |                         drain_orphan_queue(self.queue.lock());\n   90 |                     }\n   91 |                 }\n   92 |                 None => {\n   93 |                     let queue = self.queue.lock();\n   94 | \n   95 |                     // Be lazy and only initialize the SIGCHLD listener if there\n   96 |                     // are any orphaned processes in the queue.\n   97 |                     if !queue.is_empty() {\n   98 |                         // An errors shouldn't really happen here, but if it does it\n   99 |                         // means that the signal driver isn't running, in\n  100 |                         // which case there isn't anything we can\n  101 |                         // register/initialize here, so we can try again later\n  102 |                         if let Ok(sigchild) = signal_with_handle(SignalKind::child(), handle) {\n  103 |                             *sigchild_guard = Some(sigchild);\n  104 |                             drain_orphan_queue(queue);\n  105 |                         }\n  106 |                     }\n  107 |                 }\n  108 |             }\n  109 |         }\n  110 |     }","lines":32,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/process/unix/orphan.rs#L79-L110"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Drop for Mock` only asserts that unconsumed `Action::Read`/`Action::Write` data is empty; it\nsilently ignores any still-queued `Action::ReadError`/`Action::WriteError` (and `Action::Wait`)\nvia the catch-all `_ => ()` arm. If a test queues `Builder::read_error(...)` or\n`Builder::write_error(...)` (or the `Handle` equivalents) but the code under test never performs\nthe read/write that would trigger it, the `Mock` is dropped without any panic, silently masking\nan unfulfilled expectation that the analogous `Read`/`Write` data checks would have caught.","fix":"Extend the Drop assertion to also cover ReadError/WriteError:\n\n```rust\nself.inner.actions.iter().for_each(|a| match a {\n    Action::Read(data) => assert!(data.is_empty(), \"There is still data left to read. {}\", self.pmsg()),\n    Action::Write(data) => assert!(data.is_empty(), \"There is still data left to write. {}\", self.pmsg()),\n    Action::ReadError(err) | Action::WriteError(err) => {\n        assert!(err.is_none(), \"There is still a queued error that was never triggered. {}\", self.pmsg())\n    }\n    Action::Wait(_) => (),\n});\n```","locations":[{"ref":"tokio-test/src/io.rs:501-523","code":"  501 | /// Ensures that Mock isn't dropped with data \"inside\".\n  502 | impl Drop for Mock {\n  503 |     fn drop(&mut self) {\n  504 |         // Avoid double panicking, since makes debugging much harder.\n  505 |         if std::thread::panicking() {\n  506 |             return;\n  507 |         }\n  508 | \n  509 |         self.inner.actions.iter().for_each(|a| match a {\n  510 |             Action::Read(data) => assert!(\n  511 |                 data.is_empty(),\n  512 |                 \"There is still data left to read. {}\",\n  513 |                 self.pmsg()\n  514 |             ),\n  515 |             Action::Write(data) => assert!(\n  516 |                 data.is_empty(),\n  517 |                 \"There is still data left to write. {}\",\n  518 |                 self.pmsg()\n  519 |             ),\n  520 |             _ => (),\n  521 |         });\n  522 |     }\n  523 | }","lines":23,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-test/src/io.rs#L501-L523"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the `orphan` test module, `MockWait::with_err()`/`return_err` has its branches swapped\nrelative to what the name implies: when `return_err` is `true`, `try_wait` returns\n`Ok(Some(ExitStatus::from_raw(0)))` (success), and when `return_err` is `false`, it returns\n`Err(...)`. This doesn't currently break the `drain_attempts_a_single_reap_of_all_queued_orphans`\ntest because `drain_orphan_queue` treats `Ok(Some(_))` and `Err(_)` identically (both remove\nthe orphan from the queue), so the test still passes, but the mock does not actually\nexercise what its name/field suggest, which is misleading for anyone modifying this test or\n`drain_orphan_queue` in the future.","fix":"Swap the two branches so the mock behaves as its name implies:\n```rust\nlet ret = if self.num_wait_until_status == waits {\n    if self.return_err {\n        Err(io::Error::new(io::ErrorKind::Other, \"mock err\"))\n    } else {\n        Ok(Some(ExitStatus::from_raw(0)))\n    }\n} else {\n    Ok(None)\n};\n```","locations":[{"ref":"tokio/src/process/unix/orphan.rs:162-207","code":"  162 |     struct MockWait {\n  163 |         total_waits: Rc<Cell<usize>>,\n  164 |         num_wait_until_status: usize,\n  165 |         return_err: bool,\n  166 |     }\n  167 | \n  168 |     impl MockWait {\n  169 |         fn new(num_wait_until_status: usize) -> Self {\n  170 |             Self {\n  171 |                 total_waits: Rc::new(Cell::new(0)),\n  172 |                 num_wait_until_status,\n  173 |                 return_err: false,\n  174 |             }\n  175 |         }\n  176 | \n  177 |         fn with_err() -> Self {\n  178 |             Self {\n  179 |                 total_waits: Rc::new(Cell::new(0)),\n  180 |                 num_wait_until_status: 0,\n  181 |                 return_err: true,\n  182 |             }\n  183 |         }\n  184 |     }\n  185 | \n  186 |     impl Wait for MockWait {\n  187 |         fn id(&self) -> u32 {\n  188 |             42\n  189 |         }\n  190 | \n  191 |         fn try_wait(&mut self) -> io::Result<Option<ExitStatus>> {\n  192 |             let waits = self.total_waits.get();\n  193 | \n  194 |             let ret = if self.num_wait_until_status == waits {\n  195 |                 if self.return_err {\n  196 |                     Ok(Some(ExitStatus::from_raw(0)))\n  197 |                 } else {\n  198 |                     Err(io::Error::new(io::ErrorKind::Other, \"mock err\"))\n  199 |                 }\n  200 |             } else {\n  201 |                 Ok(None)\n  202 |             };\n  203 | \n  204 |             self.total_waits.set(waits + 1);\n  205 |             ret\n  206 |         }\n  207 |     }","lines":46,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/process/unix/orphan.rs#L162-L207"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`RegistrationSet::shutdown` clears `synced.pending_release` (dropping the queued `Arc` clones) but never resets the companion atomic counter `num_pending_release` back to `0`:\n```rust\npub(super) fn shutdown(&self, synced: &mut Synced) -> Vec<Arc<ScheduledIo>> {\n    if synced.is_shutdown { return vec![]; }\n    synced.is_shutdown = true;\n    synced.pending_release.clear();   // Vec cleared...\n    ...\n}\n```\nwhereas `release()` is the only other place that resets it (`self.num_pending_release.store(0, Release)`), and `release()` is only ever invoked from `release_pending_registrations`, which is only called from `Driver::turn`, which itself starts with `debug_assert!(!handle.registrations.is_shutdown(...))`. In practice this means that after shutdown, `needs_release()` can be left permanently reporting a stale non-zero count with no code path left that will ever clear it (in a release build, if `turn` were ever invoked again post-shutdown -- e.g. by a future refactor that relaxes the current debug-only assertion -- the driver would repeatedly take the `release_pending_registrations` path unnecessarily). It's a benign latent inconsistency today, but the two pieces of state (`pending_release` and `num_pending_release`) are supposed to be kept in lock-step and shutdown breaks that invariant silently.","fix":"Reset the atomic alongside the vector for consistency:\n```rust\npub(super) fn shutdown(&self, synced: &mut Synced) -> Vec<Arc<ScheduledIo>> {\n    if synced.is_shutdown {\n        return vec![];\n    }\n\n    synced.is_shutdown = true;\n    synced.pending_release.clear();\n    self.num_pending_release.store(0, Release);\n    ...\n}\n```","locations":[{"ref":"tokio/src/runtime/io/registration_set.rs:83-102","code":"   83 |     pub(super) fn shutdown(&self, synced: &mut Synced) -> Vec<Arc<ScheduledIo>> {\n   84 |         if synced.is_shutdown {\n   85 |             return vec![];\n   86 |         }\n   87 | \n   88 |         synced.is_shutdown = true;\n   89 |         synced.pending_release.clear();\n   90 | \n   91 |         // Building a vec of all outstanding I/O handles could be expensive, but\n   92 |         // this is the shutdown operation. In theory, shutdowns should be\n   93 |         // \"clean\" with no outstanding I/O resources. Even if it is slow, we\n   94 |         // aren't optimizing for shutdown.\n   95 |         let mut ret = vec![];\n   96 | \n   97 |         while let Some(io) = synced.registrations.pop_back() {\n   98 |             ret.push(io);\n   99 |         }\n  100 | \n  101 |         ret\n  102 |     }","lines":20,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/io/registration_set.rs#L83-L102"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`TcpListener::poll_accept` treats every `accept()` error other than `WouldBlock` as fatal: it returns `Poll::Ready(Err(e))`, which (per the method's contract) permanently ends the ready/accept cycle for that call site the same way a real connection would - callers that loop on `poll_accept`/`accept()` and propagate the error with `?` will tear down the whole listener. However, several accept-time errors are transient and recoverable rather than indicative of a broken listener: `ECONNABORTED` (peer reset the connection while it sat in the accept queue), and resource-exhaustion errors such as `EMFILE`/`ENFILE` (process/system fd limits temporarily hit). A listener that stops accepting connections forever after a single transient `EMFILE` blip (which can clear moments later as other connections close) is a significant availability regression for a long-running server, even though the module's own doc comment acknowledges the caveat. Unlike `EMFILE`/`ENFILE`/`ECONNABORTED`, these should be logged/skipped and accept should keep looping rather than surfacing as a terminal stream error.","fix":"In `poll_accept`, special-case transient accept errors (`ErrorKind::ConnectionAborted`, and on Unix `EMFILE`/`ENFILE` via `raw_os_error()`) similarly to `WouldBlock`: log them and `continue` the loop (optionally after clearing readiness / yielding once) instead of returning `Poll::Ready(Err(e))`, e.g.:\n```rust\nErr(ref e) if e.kind() == io::ErrorKind::ConnectionAborted => {\n    // Peer reset before we accepted it; try again.\n    continue;\n}\n```\nso only genuinely fatal errors terminate the accept stream.","locations":[{"ref":"tokio/src/net/tcp/listener.rs:179-194","code":"  179 |     pub fn poll_accept(&self, cx: &mut Context<'_>) -> Poll<io::Result<(TcpStream, SocketAddr)>> {\n  180 |         loop {\n  181 |             let ev = ready!(self.io.registration().poll_read_ready(cx))?;\n  182 | \n  183 |             match self.io.accept() {\n  184 |                 Ok((io, addr)) => {\n  185 |                     let io = TcpStream::new(io)?;\n  186 |                     return Poll::Ready(Ok((io, addr)));\n  187 |                 }\n  188 |                 Err(ref e) if e.kind() == io::ErrorKind::WouldBlock => {\n  189 |                     self.io.registration().clear_readiness(ev);\n  190 |                 }\n  191 |                 Err(e) => return Poll::Ready(Err(e)),\n  192 |             }\n  193 |         }\n  194 |     }","lines":16,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/net/tcp/listener.rs#L179-L194"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"hard","description":"`Inner::run` waits on the blocking-pool condvar with a bare `.unwrap()`:\n`self.condvar.wait_timeout(shared, self.keep_alive).unwrap()` (pool.rs:529). When the\n`parking_lot` feature is NOT enabled (a very common minimal build, e.g. features =\n[\"rt\", \"rt-multi-thread\", \"sync\", \"time\"] without \"full\"), `crate::loom::sync::Condvar`\nis a direct re-export of `std::sync::Condvar` (see tokio/src/loom/std/mod.rs:63), and\n`wait_timeout` returns `LockResult<...>` which is `Err` if the underlying\n`std::sync::Mutex` has been poisoned.\n\nThe `shared: Mutex<Shared>` field is explicitly wrapped in `crate::loom::sync::Mutex`,\nwhose `lock()` deliberately strips poisoning (\"Adapter for `std::Mutex` that removes\nthe poisoning aspects from its API\", tokio/src/loom/std/mutex.rs:3-4). However, that\npoison-stripping is only applied at the `.lock()` call site; the raw `Condvar::wait_timeout`\ncall in pool.rs bypasses it because `WaitTimeoutResult`/`LockResult` poisoning is tracked\nby the underlying `std::sync::Mutex` itself, independent of how the guard was produced.\n\nIf any code that runs while holding the `shared` lock ever panics (e.g. the\n`assert!(shared.shutdown_tx.is_some())` at pool.rs:415, or the\n`assert_ne!(prev_idle, 0, ...)` at pool.rs:584 -- both of which execute with the\n`shared` `MutexGuard` still in scope), the underlying mutex becomes poisoned. Every\nworker thread that is currently idle (or becomes idle later) and calls\n`wait_timeout(...).unwrap()` will then panic too, since the poison flag is independent\nof the earlier poison-stripping done by `Mutex::lock()`. This turns a single defensive\nassertion failure into a cascading panic across every blocking-pool worker thread,\ninstead of the graceful/poison-agnostic behavior the `Mutex` wrapper was designed to\nprovide.","fix":"Match the poison-stripping behavior used for `Mutex::lock()` when consuming the\n`Condvar::wait_timeout` result, e.g.:\n```rust\nlet lock_result = self\n    .condvar\n    .wait_timeout(shared, self.keep_alive)\n    .unwrap_or_else(std::sync::PoisonError::into_inner);\n```\nor add a `wait_timeout` helper to `loom::sync::Condvar` (std backend) that strips\npoisoning the same way `loom::std::mutex::Mutex::lock` does, so behavior is uniform\nbetween the parking_lot and std backends and a single assertion failure elsewhere in\nthe pool cannot cascade into panics on every worker thread.","locations":[{"ref":"tokio/src/runtime/blocking/pool.rs:415","code":"  415 |                 assert!(shared.shutdown_tx.is_some());","lines":1,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/blocking/pool.rs#L415"},{"ref":"tokio/src/runtime/blocking/pool.rs:529","code":"  529 |                 let lock_result = self.condvar.wait_timeout(shared, self.keep_alive).unwrap();","lines":1,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/blocking/pool.rs#L529"},{"ref":"tokio/src/runtime/blocking/pool.rs:584-587","code":"  584 |             assert_ne!(\n  585 |                 prev_idle, 0,\n  586 |                 \"`num_idle_threads` underflowed on thread exit\"\n  587 |             );","lines":4,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/blocking/pool.rs#L584-L587"},{"ref":"tokio/src/loom/std/mutex.rs:20-26","code":"   20 |     #[inline]\n   21 |     pub(crate) fn lock(&self) -> MutexGuard<'_, T> {\n   22 |         match self.0.lock() {\n   23 |             Ok(guard) => guard,\n   24 |             Err(p_err) => p_err.into_inner(),\n   25 |         }\n   26 |     }","lines":7,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/loom/std/mutex.rs#L20-L26"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Spawner::spawn_mandatory_blocking` (pool.rs:336-363) converts every failure variant\nof `SpawnError` into a plain `None`:\n```rust\nif spawn_result.is_ok() { Some(join_handle) } else { None }\n```\nThis conflates two very different situations: `SpawnError::ShuttingDown` (expected,\nbenign -- the runtime is shutting down) and `SpawnError::NoThreads(io::Error)` (the OS\nrefused to spawn a worker thread, an actual resource-exhaustion error). By contrast,\nthe non-mandatory `Spawner::spawn_blocking` explicitly panics with the underlying\n`io::Error` message for `NoThreads` (\"OS can't spawn worker thread: {e}\", pool.rs:325)\nspecifically so that resource-exhaustion is not silently swallowed. The mandatory path\nhas no such distinction: callers such as `tokio::fs::File`'s poll_write/poll_write_vectored\n(tokio/src/fs/file.rs:755-764 and :826-838) turn the `None` into a generic\n`io::Error::new(io::ErrorKind::Other, \"background task failed\")`, discarding the\noriginal OS error entirely, so users cannot tell \"runtime shut down\" apart from\n\"the OS ran out of threads\" from the resulting error.","fix":"Return the `SpawnError` (or at least distinguish the `NoThreads` case) from\n`spawn_mandatory_blocking` instead of collapsing it to `Option`, e.g. change the\nreturn type to `Result<JoinHandle<R>, SpawnError>` and let callers decide how to\nsurface `NoThreads(e)` (propagate `e`) versus `ShuttingDown` (map to the current\ngeneric error).","locations":[{"ref":"tokio/src/runtime/blocking/pool.rs:336-364","code":"  336 |         pub(crate) fn spawn_mandatory_blocking<F, R>(&self, rt: &Handle, func: F) -> Option<JoinHandle<R>>\n  337 |         where\n  338 |             F: FnOnce() -> R + Send + 'static,\n  339 |             R: Send + 'static,\n  340 |         {\n  341 |             let fn_size = std::mem::size_of::<F>();\n  342 |             let (join_handle, spawn_result) = if fn_size > BOX_FUTURE_THRESHOLD {\n  343 |                 self.spawn_blocking_inner(\n  344 |                     Box::new(func),\n  345 |                     Mandatory::Mandatory,\n  346 |                     SpawnMeta::new_unnamed(fn_size),\n  347 |                     rt,\n  348 |                 )\n  349 |             } else {\n  350 |                 self.spawn_blocking_inner(\n  351 |                     func,\n  352 |                     Mandatory::Mandatory,\n  353 |                     SpawnMeta::new_unnamed(fn_size),\n  354 |                     rt,\n  355 |                 )\n  356 |             };\n  357 | \n  358 |             if spawn_result.is_ok() {\n  359 |                 Some(join_handle)\n  360 |             } else {\n  361 |                 None\n  362 |             }\n  363 |         }\n  364 |     }","lines":29,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/blocking/pool.rs#L336-L364"},{"ref":"tokio/src/fs/file.rs:755-765","code":"  755 |                     let blocking_task_join_handle = spawn_mandatory_blocking(move || {\n  756 |                         let res = if let Some(seek) = seek {\n  757 |                             (&*std).seek(seek).and_then(|_| buf.write_to(&mut &*std))\n  758 |                         } else {\n  759 |                             buf.write_to(&mut &*std)\n  760 |                         };\n  761 | \n  762 |                         (Operation::Write(res), buf)\n  763 |                     })\n  764 |                     .ok_or_else(|| {\n  765 |                         io::Error::new(io::ErrorKind::Other, \"background task failed\")","lines":11,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/fs/file.rs#L755-L765"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`Handle::dump()`'s helper `spawn_thread` (used for the `MultiThread` scheduler path)\nspawns a detached OS thread and discards its `JoinHandle`:\n```rust\nasync fn spawn_thread<F>(f: F) -> <F as Future>::Output { ... }\n```\nInside the closure it does `crate::runtime::Builder::new_current_thread().build().unwrap()`\nand then `rt.block_on(async { let _ = tx.send(f.await); })`. If `build()` fails (e.g.\nthe process is low on file descriptors/threads -- a realistic condition, since\n`dump()` is typically invoked while the runtime is already under stress or blocked),\nor if `f.await` itself panics, the panic happens in the detached thread and is never\nobserved: the `JoinHandle` returned by `crate::loom::thread::spawn` is dropped\nimmediately without being stored or joined. The only visible effect on the caller's\nside is that `tx` is dropped without sending, so `rx.await.unwrap()` panics with a\ngeneric `RecvError`-based message, completely losing the original panic\npayload/error (e.g. the actual `io::Error` from a failed runtime build). This makes\ndiagnosing `Handle::dump()` failures on multi-threaded runtimes needlessly hard.","fix":"Keep the `JoinHandle` and either propagate a panic explicitly, or surface the error\nbefore falling back to a generic panic, e.g.:\n```rust\nlet (tx, rx) = crate::sync::oneshot::channel();\nlet join = crate::loom::thread::spawn(|| {\n    let rt = crate::runtime::Builder::new_current_thread().build().expect(\"failed to build runtime for Handle::dump()\");\n    rt.block_on(async {\n        let _ = tx.send(f.await);\n    });\n});\nmatch rx.await {\n    Ok(v) => v,\n    Err(_) => {\n        // Propagate the real panic instead of a generic RecvError.\n        let panic = join.join().unwrap_err();\n        std::panic::resume_unwind(panic);\n    }\n}\n```","locations":[{"ref":"tokio/src/runtime/handle.rs:671-687","code":"  671 |     cfg_rt_multi_thread! {\n  672 |         /// Spawn a new thread and asynchronously await on its result.\n  673 |         async fn spawn_thread<F>(f: F) -> <F as Future>::Output\n  674 |         where\n  675 |             F: Future + Send + 'static,\n  676 |             <F as Future>::Output: Send + 'static\n  677 |         {\n  678 |             let (tx, rx) = crate::sync::oneshot::channel();\n  679 |             crate::loom::thread::spawn(|| {\n  680 |                 let rt = crate::runtime::Builder::new_current_thread().build().unwrap();\n  681 |                 rt.block_on(async {\n  682 |                     let _ = tx.send(f.await);\n  683 |                 });\n  684 |             });\n  685 |             rx.await.unwrap()\n  686 |         }\n  687 |     }","lines":17,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/handle.rs#L671-L687"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`AnyDelimiterCodec::decode` searches for a delimiter with\n`buf[self.next_index..read_to].iter().position(|b| self.seek_delimiters.contains(b))`. For every\nbyte in the (potentially large, attacker-controlled) search window this performs an O(m) linear\nscan of the `seek_delimiters: Vec<u8>` via `Vec::contains`, giving O(n*m) behavior overall. The\nsibling `LinesCodec`, which has exactly one delimiter byte, instead uses\n`crate::util::memchr::memchr` (a SIMD-accelerated single-byte search). Since `AnyDelimiterCodec`\nis explicitly documented as suitable for \"any character in the given delimiter string\" and is\nmeant to be used on untrusted network input, a larger `seek_delimiters` set (or just a long run of\nnon-delimiter bytes before the max_length limit kicks in) makes this noticeably slower than the\nsingle-delimiter codec for equivalent input sizes.","fix":"Precompute a 256-entry boolean lookup table (or a bitset) from `seek_delimiters` once (e.g. when the codec is constructed) and use it for O(1) membership tests per byte, or use `memchr::memchr2`/`memchr3` for the common 2-3 delimiter case.","locations":[{"ref":"tokio-util/src/codec/any_delimiter_codec.rs:144-146","code":"  144 |             let new_chunk_offset = buf[self.next_index..read_to]\n  145 |                 .iter()\n  146 |                 .position(|b| self.seek_delimiters.contains(b));","lines":3,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/codec/any_delimiter_codec.rs#L144-L146"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`remove_child` in the cancellation-token tree unconditionally checks `4 * len <= capacity` and, if\ntrue, calls `parent.children.shrink_to(2 * len)` after every single child removal. If a node's child\ncount repeatedly oscillates around this threshold (e.g. children are removed and added in a pattern\nthat keeps crossing the `capacity / 4` boundary), this causes the backing `Vec` to be shrunk and then\ngrown/reallocated repeatedly, which is more allocator churn than a simple amortized-growth-only vector\nwould incur. This is a minor, hard-to-trigger performance concern (only matters for nodes with many\nchildren whose count fluctuates near the shrink threshold), not a correctness bug.","fix":"Consider only shrinking periodically (e.g. only when the vector is mostly empty, such as `len == 0`),\nor hysteresis-based shrinking (shrink only when capacity is much larger than len by a wider margin than\nthe growth trigger), to avoid repeated shrink/grow cycles for child counts oscillating near the\nthreshold.","locations":[{"ref":"tokio-util/src/sync/cancellation_token/tree_node.rs:242-245","code":"  242 |     let len = parent.children.len();\n  243 |     if 4 * len <= parent.children.capacity() {\n  244 |         parent.children.shrink_to(2 * len);\n  245 |     }","lines":4,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/sync/cancellation_token/tree_node.rs#L242-L245"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `SimplexStream::poll_write_internal` and `poll_write_vectored_internal`, the `read_waker` is woken unconditionally after a write attempt, even when zero bytes were actually copied into the buffer (e.g. the caller passes an empty `buf`, or an empty/all-zero-length `bufs` list). This causes a spurious wakeup of the waiting reader task for no reason. The sibling function `poll_read_internal` in the same file explicitly guards against this exact situation for the `write_waker` (`if max > 0 { ... }`, with the comment \"The passed `buf` might have been empty, don't wake up if no bytes have been moved.\"), showing the write-side is an unintentional omission of the same guard rather than a deliberate design choice.","fix":"Mirror the guard already used in `poll_read_internal`, only waking the reader when data was actually appended to the buffer:\n```rust\nlet len = buf.len().min(avail);\nself.buffer.extend_from_slice(&buf[..len]);\nif len > 0 {\n    if let Some(waker) = self.read_waker.take() {\n        waker.wake();\n    }\n}\nPoll::Ready(Ok(len))\n```\nand analogously guard the `avail - rem > 0` case in `poll_write_vectored_internal`.","locations":[{"ref":"tokio/src/io/util/mem.rs:287-292","code":"  287 |         let len = buf.len().min(avail);\n  288 |         self.buffer.extend_from_slice(&buf[..len]);\n  289 |         if let Some(waker) = self.read_waker.take() {\n  290 |             waker.wake();\n  291 |         }\n  292 |         Poll::Ready(Ok(len))","lines":6,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/io/util/mem.rs#L287-L292"},{"ref":"tokio/src/io/util/mem.rs:309-323","code":"  309 |         let mut rem = avail;\n  310 |         for buf in bufs {\n  311 |             if rem == 0 {\n  312 |                 break;\n  313 |             }\n  314 | \n  315 |             let len = buf.len().min(rem);\n  316 |             self.buffer.extend_from_slice(&buf[..len]);\n  317 |             rem -= len;\n  318 |         }\n  319 | \n  320 |         if let Some(waker) = self.read_waker.take() {\n  321 |             waker.wake();\n  322 |         }\n  323 |         Poll::Ready(Ok(avail - rem))","lines":15,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/io/util/mem.rs#L309-L323"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`TraceStatus::start_trace_request` and `end_trace_request` synchronize\nconcurrent taskdump requests with a busy compare-exchange loop that calls\n`handle.notify_all()` (which wakes every worker thread in the pool) and then\n`task::yield_now().await` on every failed attempt:\n```rust\npub(super) async fn start_trace_request(&self, handle: &Handle) {\n    while self.trace_requested.compare_exchange(false, true, Ordering::Acquire, Ordering::Relaxed).is_err() {\n        handle.notify_all();\n        crate::task::yield_now().await;\n    }\n}\n```\nUnder contention (multiple concurrent callers of `Handle::dump()`), this\nspins, repeatedly waking every worker thread in the runtime on each iteration\nuntil the CAS succeeds, instead of using a proper async wait/notify handshake\nfor the \"trace already in progress\" case. This wastes CPU and causes\nunnecessary contention/wakeups across the whole worker pool while a dump is\nalready in flight.","fix":"Use a proper queued waiter (e.g. an async `Mutex`, or a dedicated `Notify`\nthat is only signaled by `end_trace_request`) instead of a CAS-spin +\nnotify-all-workers + yield_now loop, so that a second concurrent `dump()`\ncaller waits efficiently for the first to finish rather than repeatedly\nwaking every worker thread:\n```rust\npub(super) async fn start_trace_request(&self, handle: &Handle) {\n    loop {\n        if self.trace_requested.compare_exchange(false, true, Ordering::Acquire, Ordering::Relaxed).is_ok() {\n            return;\n        }\n        // wait on a dedicated Notify signaled by `end_trace_request`,\n        // instead of notifying every worker and spinning.\n        self.request_free.notified().await;\n    }\n}\n```","locations":[{"ref":"tokio/src/runtime/scheduler/multi_thread/trace.rs:31-40","code":"   31 |     pub(super) async fn start_trace_request(&self, handle: &Handle) {\n   32 |         while self\n   33 |             .trace_requested\n   34 |             .compare_exchange(false, true, Ordering::Acquire, Ordering::Relaxed)\n   35 |             .is_err()\n   36 |         {\n   37 |             handle.notify_all();\n   38 |             crate::task::yield_now().await;\n   39 |         }\n   40 |     }","lines":10,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/scheduler/multi_thread/trace.rs#L31-L40"},{"ref":"tokio/src/runtime/scheduler/multi_thread/trace.rs:51-60","code":"   51 |     pub(super) async fn end_trace_request(&self, handle: &Handle) {\n   52 |         while self\n   53 |             .trace_requested\n   54 |             .compare_exchange(true, false, Ordering::Acquire, Ordering::Relaxed)\n   55 |             .is_err()\n   56 |         {\n   57 |             handle.notify_all();\n   58 |             crate::task::yield_now().await;\n   59 |         }\n   60 |     }","lines":10,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/scheduler/multi_thread/trace.rs#L51-L60"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"A whole commented-out function `is_task_ctx` (including its doc comment and body) is left in the source as a block comment, serving no purpose and adding clutter.","fix":"Delete the commented-out `is_task_ctx` block; it is not referenced anywhere and provides no value as documentation.","locations":[{"ref":"tokio-test/src/io.rs:524-544","code":"  524 | /*\n  525 | /// Returns `true` if called from the context of a futures-rs Task\n  526 | fn is_task_ctx() -> bool {\n  527 |     use std::panic;\n  528 | \n  529 |     // Save the existing panic hook\n  530 |     let h = panic::take_hook();\n  531 | \n  532 |     // Install a new one that does nothing\n  533 |     panic::set_hook(Box::new(|_| {}));\n  534 | \n  535 |     // Attempt to call the fn\n  536 |     let r = panic::catch_unwind(|| task::current()).is_ok();\n  537 | \n  538 |     // Re-install the old one\n  539 |     panic::set_hook(h);\n  540 | \n  541 |     // Return the result\n  542 |     r\n  543 | }\n  544 | */","lines":21,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-test/src/io.rs#L524-L544"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`ThreadWaker`'s `SLEEP` state and its `Condvar` field are effectively dead: nothing in the file\never transitions `state` to `SLEEP`, and nothing ever calls `Condvar::wait` on `condvar`. `clear()`\nonly sets `IDLE`, and `wake()` only ever sets `WAKE`. As a result, in `wake()` the two early\nreturns (`prev == WAKE` and `prev == IDLE`) always catch every value `prev` can actually take, so\n`assert_eq!(prev, SLEEP)` and the following `self.condvar.notify_one()` (task.rs:285-287) are\nunreachable. This is presumably a leftover from an earlier design where `MockTask` supported an\nactual blocking wait; today `Spawn`/`MockTask` is purely poll-based (see `is_woken()`), so the\n`SLEEP` state and `Condvar` only add dead branches and an unused field to reason about.","fix":"Remove the unused `SLEEP` constant and `Condvar` field (and the corresponding notify_one/assert_eq dead branch in wake()), or, if blocking wait support is actually intended, implement it properly by having some code call condvar.wait() and transition state to SLEEP.","locations":[{"ref":"tokio-test/src/task.rs:63-71","code":"   63 | #[derive(Debug)]\n   64 | struct ThreadWaker {\n   65 |     state: Mutex<usize>,\n   66 |     condvar: Condvar,\n   67 | }\n   68 | \n   69 | const IDLE: usize = 0;\n   70 | const WAKE: usize = 1;\n   71 | const SLEEP: usize = 2;","lines":9,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-test/src/task.rs#L63-L71"},{"ref":"tokio-test/src/task.rs:270-289","code":"  270 |     fn wake(&self) {\n  271 |         // First, try transitioning from IDLE -> NOTIFY, this does not require a lock.\n  272 |         let mut state = self.state.lock().unwrap();\n  273 |         let prev = *state;\n  274 | \n  275 |         if prev == WAKE {\n  276 |             return;\n  277 |         }\n  278 | \n  279 |         *state = WAKE;\n  280 | \n  281 |         if prev == IDLE {\n  282 |             return;\n  283 |         }\n  284 | \n  285 |         // The other half is sleeping, so we wake it up.\n  286 |         assert_eq!(prev, SLEEP);\n  287 |         self.condvar.notify_one();\n  288 |     }\n  289 | }","lines":20,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-test/src/task.rs#L270-L289"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`test_local_queue_capacity` asserts `LOCAL_QUEUE_CAPACITY - 1 <= u8::MAX as\nusize`, but nothing in the current queue implementation actually relies on\nan 8-bit index type: the head/tail indices use `UnsignedShort`\n(`u32` when 64-bit atomics are available, `u16` otherwise) with a `usize`\nmask for buffer indexing. The test appears to check a stale invariant from an\nearlier design that used `u8` indices, and does not validate anything that\nthe current ABA-mitigation scheme (documented right above it, referencing\nissue #5041) actually depends on. It gives a false sense that the queue's\ncorrectness is tied to `u8::MAX`, when in reality the load-bearing type is\n`UnsignedShort`.","fix":"Either remove the test, or update it to assert the invariant that is\nactually relevant to the current implementation, e.g.:\n```rust\n#[test]\nfn test_local_queue_capacity() {\n    assert!(LOCAL_QUEUE_CAPACITY - 1 <= UnsignedShort::MAX as usize);\n}\n```","locations":[{"ref":"tokio/src/runtime/scheduler/multi_thread/queue.rs:599-602","code":"  599 | #[test]\n  600 | fn test_local_queue_capacity() {\n  601 |     assert!(LOCAL_QUEUE_CAPACITY - 1 <= u8::MAX as usize);\n  602 | }","lines":4,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/scheduler/multi_thread/queue.rs#L599-L602"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`count_field!` in the `select!` support macros defines lookup arms for underscore counts 0 through 64 (i.e. `$var.0` .. `$var.64`), but `count!` (used to compute `BRANCHES`) only supports up to 64 total branches. In `select!`, `count_field!` is only ever invoked with the number of branches *preceding* the current one, i.e. at most `BRANCHES - 1 = 63` underscores for the last branch of a 64-branch `select!`. The arm matching 64 underscores (`$var.64`) can therefore never be reached by any valid invocation of `select!` and is unreachable dead code.","fix":"Remove the unreachable `($var:ident. _ ... _ (64 times)) => { \\$var.64 };` arm from `count_field!`, since `select!` is capped at 64 branches by `count!` and can never request field index 64.","locations":[{"ref":"tokio/src/macros/select.rs:1214-1216","code":" 1214 |     ($var:ident. _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _) => {\n 1215 |         $var.64\n 1216 |     };","lines":3,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/macros/select.rs#L1214-L1216"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `ChunksTimeout::into_remainder` says it \"Consumes the\n`ChunksTimeout` and then returns all buffered items,\" but the method takes\n`self: Pin<&mut Self>`, not `self` by value, so it does not consume the\nstream at all -- it only drains the internal `items` buffer via\n`mem::take`, leaving the `ChunksTimeout` stream itself alive and pollable\nafterward. The wording is misleading to callers who might assume the stream\nis dropped/unusable after calling this.","fix":"Reword the doc comment to describe what actually happens, e.g.:\n\n```rust\n/// Drains and returns any items currently buffered, without affecting the\n/// underlying stream. Does not consume `self`.\npub fn into_remainder(mut self: Pin<&mut Self>) -> Vec<S::Item> {\n```","locations":[{"ref":"tokio-stream/src/stream_ext/chunks_timeout.rs:37-41","code":"   37 |     /// Consumes the [`ChunksTimeout`] and then returns all buffered items.\n   38 |     pub fn into_remainder(mut self: Pin<&mut Self>) -> Vec<S::Item> {\n   39 |         let me = self.as_mut().project();\n   40 |         std::mem::take(me.items)\n   41 |     }","lines":5,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-stream/src/stream_ext/chunks_timeout.rs#L37-L41"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comments for `TaskTracker::spawn_blocking` and `TaskTracker::spawn_blocking_on` claim they\nare \"equivalent to `tokio::task::spawn_blocking(tracker.track_future(task))`\" (and the `handle.spawn_blocking(...)`\nvariant for the `_on` method). This is incorrect and would not even compile: `track_future` requires\n`F: Future`, but the `task` parameter of `spawn_blocking`/`spawn_blocking_on` is `F: FnOnce() -> T`, a\nblocking closure, not a future. The comment was clearly copy-pasted from the sibling `spawn`/`spawn_on`\nmethods (where the claim is accurate) without being updated to match the actual implementation, which\nmanually creates a `TaskTrackerToken` via `self.token()` and drops it inside the spawned closure after\nthe blocking function runs.","fix":"Replace the misleading equivalence with an accurate description, e.g.:\n```\n/// Spawn the provided blocking task on the current Tokio runtime, and track it in this `TaskTracker`.\n///\n/// Unlike `spawn`, this does not use `track_future` internally (since the task is a closure, not a\n/// future). Instead, a `TaskTrackerToken` is held for the duration of the blocking call and dropped\n/// once it returns.\n```","locations":[{"ref":"tokio-util/src/task/task_tracker.rs:444-446","code":"  444 |     /// Spawn the provided blocking task on the current Tokio runtime, and track it in this `TaskTracker`.\n  445 |     ///\n  446 |     /// This is equivalent to `tokio::task::spawn_blocking(tracker.track_future(task))`.","lines":3,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/task/task_tracker.rs#L444-L446"},{"ref":"tokio-util/src/task/task_tracker.rs:466-468","code":"  466 |     /// Spawn the provided blocking task on the provided Tokio runtime, and track it in this `TaskTracker`.\n  467 |     ///\n  468 |     /// This is equivalent to `handle.spawn_blocking(tracker.track_future(task))`.","lines":3,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/task/task_tracker.rs#L466-L468"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `# Panics` section of `DelayQueue::insert` (and, by copy, other places referencing the same\nwording) states: \"This function panics if `timeout` is greater than the maximum duration supported\nby the timer in the current `Runtime`.\" That description is inherited from `tokio::time::sleep`'s\ndocs and does not describe `DelayQueue`'s actual behavior.\n\n`DelayQueue` has nothing to do with the current `Runtime`'s timer limits (those are effectively\nunbounded, on the order of centuries). The real constraint comes from `DelayQueue`'s own internal\nhashed timing wheel (`tokio_util::time::wheel`), whose `MAX_DURATION` constant caps deadlines at\n`(1 << 36) - 1` milliseconds (~2.17 years) from the wheel's current elapsed position\n(`wheel::InsertError::Invalid`, which `insert_idx` turns into a `panic!(\"invalid deadline; ...\")`).\nThe doc text is misleading about both the cause (own wheel vs. the runtime timer) and, implicitly,\nthe actual bound.","fix":"Correct the panic doc to describe `DelayQueue`'s own bound, e.g.:\n\n```rust\n/// # Panics\n///\n/// This function panics if `timeout` would place the deadline more than\n/// `DelayQueue`'s maximum supported duration (~2.17 years) past the queue's\n/// current internal clock position.\n```","locations":[{"ref":"tokio-util/src/time/delay_queue.rs:627-630","code":"  627 |     /// # Panics\n  628 |     ///\n  629 |     /// This function panics if `timeout` is greater than the maximum\n  630 |     /// duration supported by the timer in the current `Runtime`.","lines":4,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/time/delay_queue.rs#L627-L630"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `UnixDatagram::try_send_to` is copy-pasted from `try_send` (the connected-peer variant) and was never updated. It reads \"Tries to send a datagram to the peer without waiting\", but `try_send_to` sends to an arbitrary caller-supplied `target` address and does not require (or use) a connected peer at all. The method's own example even demonstrates this by calling `try_send_to` on a socket that was never `connect`ed, directly contradicting the doc text.","fix":"Update the summary line to describe the actual behavior, e.g.:\n\n```rust\n/// Tries to send a datagram to the specified address without waiting.\n```","locations":[{"ref":"tokio/src/net/unix/datagram/socket.rs:695-739","code":"  695 |     /// Tries to send a datagram to the peer without waiting.\n  696 |     ///\n  697 |     /// # Examples\n  698 |     ///\n  699 |     /// ```no_run\n  700 |     /// use tokio::net::UnixDatagram;\n  701 |     /// use std::io;\n  702 |     ///\n  703 |     /// #[tokio::main]\n  704 |     /// async fn main() -> io::Result<()> {\n  705 |     ///     let dir = tempfile::tempdir().unwrap();\n  706 |     ///     let client_path = dir.path().join(\"client.sock\");\n  707 |     ///     let server_path = dir.path().join(\"server.sock\");\n  708 |     ///     let socket = UnixDatagram::bind(&client_path)?;\n  709 |     ///\n  710 |     ///     loop {\n  711 |     ///         // Wait for the socket to be writable\n  712 |     ///         socket.writable().await?;\n  713 |     ///\n  714 |     ///         // Try to send data, this may still fail with `WouldBlock`\n  715 |     ///         // if the readiness event is a false positive.\n  716 |     ///         match socket.try_send_to(b\"hello world\", &server_path) {\n  717 |     ///             Ok(n) => {\n  718 |     ///                 break;\n  719 |     ///             }\n  720 |     ///             Err(ref e) if e.kind() == io::ErrorKind::WouldBlock => {\n  721 |     ///                 continue;\n  722 |     ///             }\n  723 |     ///             Err(e) => {\n  724 |     ///                 return Err(e);\n  725 |     ///             }\n  726 |     ///         }\n  727 |     ///     }\n  728 |     ///\n  729 |     ///     Ok(())\n  730 |     /// }\n  731 |     /// ```\n  732 |     pub fn try_send_to<P>(&self, buf: &[u8], target: P) -> io::Result<usize>\n  733 |     where\n  734 |         P: AsRef<Path>,\n  735 |     {\n  736 |         self.io\n  737 |             .registration()\n  738 |             .try_io(Interest::WRITABLE, || self.io.send_to(buf, target))\n  739 |     }","lines":45,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/net/unix/datagram/socket.rs#L695-L739"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`unparker_to_raw_waker` carries a long-standing, unresolved `// TODO: Is this\nreally an unsafe function?` comment. Looking at the function body, it performs\nno unsafe operations itself (`Inner::into_raw` is a safe wrapper around\n`Arc::into_raw`, and `RawWaker::new`/`RawWakerVTable::new` are safe calls), so\nmarking the function `unsafe fn` does not correspond to any actual unsafe\ninvariant that callers must uphold. This is a stale/unresolved doubt left in\nshipping code: either the function should not be `unsafe`, or the comment\nshould be replaced with a real safety-documentation note explaining what\ninvariant the caller must guarantee. As-is, the comment gives future\nmaintainers no actionable information.","fix":"Resolve the TODO instead of leaving it in the code indefinitely: either drop\n`unsafe` from the function signature (updating the two call sites that\ncurrently wrap the call in `unsafe { ... }`), or, if there truly is an\ninvariant callers must uphold, replace the TODO with a `# Safety` doc comment\nstating it explicitly, e.g.:\n```rust\n/// # Safety\n///\n/// `unparker` must be a valid, owned `Arc<Inner>` reference count.\nunsafe fn unparker_to_raw_waker(unparker: Arc<Inner>) -> RawWaker {\n```","locations":[{"ref":"tokio/src/runtime/park.rs:316-322","code":"  316 | // TODO: Is this really an unsafe function?\n  317 | unsafe fn unparker_to_raw_waker(unparker: Arc<Inner>) -> RawWaker {\n  318 |     RawWaker::new(\n  319 |         Inner::into_raw(unparker),\n  320 |         &RawWakerVTable::new(clone, wake, wake_by_ref, drop_waker),\n  321 |     )\n  322 | }","lines":7,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/park.rs#L316-L322"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The module-level shutdown protocol documentation numbers its steps 1, 2, 3,\n5, 6 -- step 4 is missing/never described, which makes the list confusing to\nread (are steps 3 and 5 meant to be adjacent, or was a step deleted/renumbered\nwithout updating the rest of the comment?). Additionally, step 5 refers to\n\"the workers call `Shared::shutdown`\", but the actual method invoked in the\ncode is `Handle::shutdown_core` (`self.worker.handle.shutdown_core(core)`),\nnot a method named `shutdown` on `Shared`.","fix":"Renumber the list (or add the missing step 4) and update the method name referenced in step 5 to `Handle::shutdown_core` to match the actual code.","locations":[{"ref":"tokio/src/runtime/scheduler/multi_thread/worker.rs:7-32","code":"    7 | //! # Shutdown\n    8 | //!\n    9 | //! Shutting down the runtime involves the following steps:\n   10 | //!\n   11 | //!  1. The Shared::close method is called. This closes the inject queue and\n   12 | //!     `OwnedTasks` instance and wakes up all worker threads.\n   13 | //!\n   14 | //!  2. Each worker thread observes the close signal next time it runs\n   15 | //!     Core::maintenance by checking whether the inject queue is closed.\n   16 | //!     The `Core::is_shutdown` flag is set to true.\n   17 | //!\n   18 | //!  3. The worker thread calls `pre_shutdown` in parallel. Here, the worker\n   19 | //!     will keep removing tasks from `OwnedTasks` until it is empty. No new\n   20 | //!     tasks can be pushed to the `OwnedTasks` during or after this step as it\n   21 | //!     was closed in step 1.\n   22 | //!\n   23 | //!  5. The workers call Shared::shutdown to enter the single-threaded phase of\n   24 | //!     shutdown. These calls will push their core to `Shared::shutdown_cores`,\n   25 | //!     and the last thread to push its core will finish the shutdown procedure.\n   26 | //!\n   27 | //!  6. The local run queue of each core is emptied, then the inject queue is\n   28 | //!     emptied.\n   29 | //!\n   30 | //! At this point, shutdown has completed. It is not possible for any of the\n   31 | //! collections to contain any tasks at this point, as each collection was\n   32 | //! closed first, then emptied afterwards.","lines":26,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/scheduler/multi_thread/worker.rs#L7-L32"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Typo in a code comment: 'hough' should be 'though'. This is in the doc comment explaining why the `DoNothing` branch of `transition_to_notified_by_ref` still performs a Release store (a subtle memory-ordering rationale), so a garbled word makes an already-tricky comment slightly harder to parse.","fix":"Change \"Even hough we have nothing to do in this branch,\" to \"Even though we have nothing to do in this branch,\".","locations":[{"ref":"tokio/src/runtime/task/state.rs:259","code":"  259 |                 // Even hough we have nothing to do in this branch,","lines":1,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio/src/runtime/task/state.rs#L259"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Doc comment typo on the `JoinQueue` struct: \"A FIFO queue for of tasks spawned on a Tokio runtime.\"\ncontains a duplicated/garbled \"for of\" that should just be \"of\".","fix":"Change to:\n```\n/// A FIFO queue of tasks spawned on a Tokio runtime.\n```","locations":[{"ref":"tokio-util/src/task/join_queue.rs:13","code":"   13 | /// A FIFO queue for of tasks spawned on a Tokio runtime.","lines":1,"link":"https://github.com/tokio-rs/tokio/blob/dac81bf8c8de0a3e35f1626643674ba9faf9569c/tokio-util/src/task/join_queue.rs#L13"}]},{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code"," }\n 1594 |     ///         }\n 1595 |     ///     }\n 1596 |     ///\n 1597 |     ///     Ok(())\n 1598 |     /// }\n 1599 |     /// ```\n 1600 |     pub fn try_write_vectored(&self, buf: &[io::IoSlice<'_>]) -> io::Result<usize> {\n 1601 |         self.io\n 1602 |             .registration()\n 1603 |             .try_io(Interest::WRITABLE, || (&*self.io).write_vectored(buf))\n 1604 |     }\n 1605 | \n 1606 |     /// Tries to read or write from the pipe using a user-provided IO operation.\n 1607 |     ///\n 1608 |     /// If the pipe is ready, the provided closure is called. The closure\n 1609 |     /// should attempt to perform IO operation from the pipe by manually\n 1610 |     /// calling the appropriate syscall. If the operation fails because the\n 1611 |     /// pipe is not actually ready, then the closure should return a\n 1612 |     /// `WouldBlock` error and the readiness flag is cleared. The return value\n 1613 |     /// of the closure is then returned by `try_io`.\n 1614 |     ///\n 1615 |     /// If the pipe is not ready, then the closure is not called\n 1616 |     /// and a `WouldBlock` error is returned.\n 1617 |     ///\n 1618 |     /// The closure should only return a `WouldBlock` error if it has performed\n 1619 |     /// an IO operation on the pipe that failed due to the pipe not being\n 1620 |     /// ready. Returning a `WouldBlock` error in any other situation will\n 1621 |     /// incorrectly clear the readiness flag, which can cause the pipe to\n 1622 |     /// behave incorrectly.\n 1623 |     ///\n 1624 |     /// The closure should not perform the IO operation using any of the methods\n 1625 |     /// defined on the Tokio `NamedPipeClient` type, as this will mess with the\n 1626 |     /// readiness flag and can cause the pipe to behave incorrectly.\n 1627 |     ///\n 1628 |     /// This method is not intended to be used with combined interests.\n 1629 |     /// The closure should perform only one type of IO operation, so it should not\n 1630 | <Header> that also performs the trace call) so the TODO and cfg_attr only need to be maintained in one place.","locations":[{"ref":"tokio/src/runtime/task/waker.rs:70-116","code":"   70 | unsafe fn clone_waker(ptr: *const ()) -> RawWaker {\n   71 |     // Safety: `ptr` was created from a `Header` pointer in function `waker_ref`.\n   72 |     let header = unsafe { NonNull::new_unchecked(ptr as *mut Header) };\n   73 |     #[cfg_attr(not(all(tokio_unstable, feature = \"tracing\")), allow(unused_unsafe))]\n   74 |     unsafe {\n   75 |         trace!(header, \"waker.clone\");\n   76 |     }\n   77 |     unsafe { header.as_ref() }.state.ref_inc();\n   78 |     raw_waker(header)\n   79 | }\n   80 | \n   81 | unsafe fn drop_waker(ptr: *const ()) {\n   82 |     // Safety: `ptr` was created from a `Header` pointer in function `waker_ref`.\n   83 |     let ptr = unsafe { NonNull::new_unchecked(ptr as *mut Header) };\n   84 |     // TODO; replace to #[expect(unused_unsafe)] after bumping MSRV to 1.81.0.\n   85 |     #[cfg_attr(not(all(tokio_unstable, feature = \"tracing\")), allow(unused_unsafe))]\n   86 |     unsafe {\n   87 |         trace!(ptr, \"waker.drop\");\n   88 |     }\n   89 |     let raw = unsafe { RawTask::from_raw(ptr) };\n   90 |     raw.drop_reference();\n   91 | }\n   92 | \n   93 | unsafe fn wake_by_val(ptr: *const ()) {\n   94 |     // Safety: `ptr` was created from a `Header` pointer in function `waker_ref`.\n   95 |     let ptr = unsafe { NonNull::new_unchecked(ptr as *mut Header) };\n   96 |     // TODO; replace to #[expect(unused_unsafe)] after bumping MSRV to 1.81.0.\n   97 |     #[cfg_attr(not(all(tokio_unstable, feature = \"tracing\")), allow(unused_unsafe))]\n   98 |     unsafe {\n   99 |         trace!(ptr, \"waker.wake\");\n  100 |     }\n  101 |     let raw = unsafe { RawTask::from_raw(ptr) };\n  102 |     raw.wake_by_val();\n  103 | }\n  104 | \n  105 | // Wake without consuming the waker\n  106 | unsafe fn wake_by_ref(ptr: *const ()) {\n  107 |
