{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Channel::push` uses a broken growth formula for reallocation:\n`self.realloc(self.capacity.saturating_mul(size.saturating_mul(3)) / 2)`. This is\n`capacity * (3 * size_of::<T>()) / 2`, so for a u16 push it grows capacity ~3x, for\nu32/f32 ~6x, instead of the intended 1.5x (`capacity * 3 / 2`). It also ignores the\nfact that the element being pushed needs `size` extra bytes: if `self.capacity` is 0\nor 1, `capacity * 3 * size / 2` can be smaller than `length + size`, and the\nsubsequent unchecked `self.ptr.add(self.length).copy_from(..., size)` would write out\nof bounds. In practice channels are created with capacity >= length and a default of\n10, so the OOB path is hard to hit, but the formula is still incorrect and wastes\nmemory.","fix":"Grow by a correct amount that guarantees space for the new element, e.g.\n`let new_cap = (self.capacity * 3 / 2).max(self.length + size);` then\n`self.realloc(new_cap);`. The growth factor should not depend on `size_of::<T>()`.","locations":[{"ref":"crates/zune-image/src/channel.rs:554-577","code":"  554 |     pub fn push<T: Copy + 'static + Zeroable>(&mut self, elm: T) {\n  555 |         let size = core::mem::size_of::<T>(); // compile time\n  556 | \n  557 |         if !self.has_capacity(size) {\n  558 |             unsafe {\n  559 |                 // extend\n  560 |                 // use 3/2 formula\n  561 |                 self.realloc(self.capacity.saturating_mul(size.saturating_mul(3)) / 2);\n  562 |             }\n  563 |         }\n  564 |         // safety:\n  565 |         // We ensured above there that we have space enough for one more element\n  566 |         unsafe {\n  567 |             // Store elm in a 1 element array in order to cast it's\n  568 |             // pointer to u8 so that we can copy it\n  569 |             let arr = [elm];\n  570 | \n  571 |             self.ptr\n  572 |                 .add(self.length)\n  573 |                 .copy_from(arr.as_ptr().cast(), size);\n  574 |         }\n  575 |         // increment length by number of bytes it takes to represent this type.\n  576 |         self.length += size;\n  577 |     }","lines":24,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/channel.rs#L554-L577"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ImageMetadata::serialize` declares the struct field count as\n`const STRUCT_FIELDS: usize = 7;` and passes it to `serialize_struct`, but then\nserializes 8 fields unconditionally (width, height, colorspace, depth, format,\ncolor_transfer_characteristics, gamma_value, is_linear) plus a 9th (`exif`) when the\n`metadata` feature is enabled. For self-describing formats (JSON/YAML) the count is\nignored, but for length-prefixed formats (bincode, MessagePack, etc.) an incorrect\nfield count corrupts the serialized output. The declared count must match the actual\nnumber of `serialize_field` calls.","fix":"Set the count to the actual number of serialized fields (8, or 9 with the `metadata`\nfeature). Compute it with a `cfg!(feature = \"metadata\")` adjustment so it stays in\nsync.","locations":[{"ref":"crates/zune-image/src/serde.rs:24-67","code":"   24 |         const STRUCT_FIELDS: usize = 7;\n   25 |         let mut state = serializer.serialize_struct(\"Metadata\", STRUCT_FIELDS)?;\n   26 | \n   27 |         state.serialize_field(\"width\", &self.width)?;\n   28 |         state.serialize_field(\"height\", &self.height)?;\n   29 |         state.serialize_field(\"colorspace\", &self.colorspace)?;\n   30 |         state.serialize_field(\"depth\", &self.depth)?;\n   31 |         state.serialize_field(\"format\", &self.format)?;\n   32 |         state.serialize_field(\"color_transfer_characteristics\", &self.color_trc)?;\n   33 |         state.serialize_field(\"gamma_value\", &self.default_gamma)?;\n   34 |         (state).serialize_field(\"is_linear\", &self.is_linear)?;\n   35 | \n   36 |         #[cfg(feature = \"metadata\")]\n   37 |         {\n   38 |             let mut fields = BTreeMap::new();\n   39 |             if let Some(ex) = &self.exif {\n   40 |                 for f in ex {\n   41 |                     let key = f.tag.to_string();\n   42 | \n   43 |                     // some tags may have leading quotes yet they\n   44 |                     // are enclosed in a string.\n   45 |                     // This helps remove them\n   46 |                     let value = f\n   47 |                         .display_value()\n   48 |                         .with_unit(f)\n   49 |                         .to_string()\n   50 |                         .trim_start_matches('\\\"')\n   51 |                         .trim_end_matches('\\\"')\n   52 |                         .to_string();\n   53 | \n   54 |                     if value.len() < 100 {\n   55 |                         fields.insert(key, value);\n   56 |                     }\n   57 |                 }\n   58 |             }\n   59 |             if fields.is_empty() {\n   60 |                 state.serialize_field::<Option<BTreeMap<String, String>>>(\"exif\", &None)?;\n   61 |             } else {\n   62 |                 state.serialize_field(\"exif\", &fields)?;\n   63 |             }\n   64 |         }\n   65 | \n   66 |         state.end()\n   67 |     }","lines":44,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/serde.rs#L24-L67"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"HaldClut never converts the target image to `new_depth` before processing.\n`new_depth = clut_depth.bit_type().max(target_depth.bit_type())`, and the\nmatch on `new_depth` calls `Image::par_process_frame_regions::<u16/f32>` on the\ntarget frame whose channels are still in the target's original depth. When the\nCLUT depth is greater than the target depth (e.g. u16 CLUT applied to a u8\ntarget), the target channels are reinterpreted at the wrong width, producing an\nerror or corrupted output. The depth is only restored (`convert_depth`) after\nthe loop, which is too late and assumes a conversion that never happened.","fix":"Convert the target image to `new_depth` (target_img.convert_depth) before the par_process loop, then restore the original depth afterwards.","locations":[{"ref":"crates/zune-imageprocs/src/hald_clut.rs:82-165","code":"   82 |         let clut_depth = clut_img.depth();\n   83 |         let target_depth = target_img.depth();\n   84 |         let new_depth = clut_depth.bit_type().max(target_depth.bit_type());\n   85 | \n   86 |         let working_cs = target_img.colorspace();\n   87 | \n   88 |         // Determine channel mapping to handle RGB vs BGR safely\n   89 |         let is_bgr = working_cs == ColorSpace::BGR || working_cs == ColorSpace::BGRA;\n   90 |         let (r_idx, g_idx, b_idx) = if is_bgr { (2, 1, 0) } else { (0, 1, 2) };\n   91 | \n   92 |         // Extract dimensions upfront\n   93 |         let target_width = target_img.width();\n   94 |         let target_height = target_img.height();\n   95 | \n   96 |         let Some(clut_frame) = clut_img.frames_ref().first() else {\n   97 |             return Err(ImageErrors::GenericStr(\"No first frame in clut image\"));\n   98 |         };\n   99 | \n  100 |         for target_frame in target_img.frames_mut().iter_mut() {\n  101 |             let c_channels = clut_frame.channels_ref(working_cs, false);\n  102 | \n  103 |             match new_depth {\n  104 |                 BitType::U8 => {\n  105 |                     let clut_r = c_channels[r_idx].reinterpret_as::<u8>()?;\n  106 |                     let clut_g = c_channels[g_idx].reinterpret_as::<u8>()?;\n  107 |                     let clut_b = c_channels[b_idx].reinterpret_as::<u8>()?;\n  108 | \n  109 |                     // Call the frame-level primitive directly!\n  110 |                     Image::par_process_frame_regions(\n  111 |                         target_frame,\n  112 |                         target_width,\n  113 |                         target_height,\n  114 |                         working_cs,\n  115 |                         true,\n  116 |                         |region| {\n  117 |                             apply_hald_clut_region::<u8>(\n  118 |                                 region, clut_r, clut_g, clut_b, r_idx, g_idx, b_idx, level, clut_w,\n  119 |                             );\n  120 |                         },\n  121 |                     )?;\n  122 |                 }\n  123 |                 BitType::U16 => {\n  124 |                     let clut_r = c_channels[r_idx].reinterpret_as::<u16>()?;\n  125 |                     let clut_g = c_channels[g_idx].reinterpret_as::<u16>()?;\n  126 |                     let clut_b = c_channels[b_idx].reinterpret_as::<u16>()?;\n  127 | \n  128 |                     Image::par_process_frame_regions(\n  129 |                         target_frame,\n  130 |                         target_width,\n  131 |                         target_height,\n  132 |                         working_cs,\n  133 |                         true,\n  134 |                         |region| {\n  135 |                             apply_hald_clut_region(\n  136 |                                 region, clut_r, clut_g, clut_b, r_idx, g_idx, b_idx, level, clut_w,\n  137 |                             );\n  138 |                         },\n  139 |                     )?;\n  140 |                 }\n  141 |                 BitType::F32 => {\n  142 |                     let clut_r = c_channels[r_idx].reinterpret_as::<f32>()?;\n  143 |                     let clut_g = c_channels[g_idx].reinterpret_as::<f32>()?;\n  144 |                     let clut_b = c_channels[b_idx].reinterpret_as::<f32>()?;\n  145 | \n  146 |                     Image::par_process_frame_regions(\n  147 |                         target_frame,\n  148 |                         target_width,\n  149 |                         target_height,\n  150 |                         working_cs,\n  151 |                         true,\n  152 |                         |region| {\n  153 |                             apply_hald_clut_region(\n  154 |                                 region, clut_r, clut_g, clut_b, r_idx, g_idx, b_idx, level, clut_w,\n  155 |                             );\n  156 |                         },\n  157 |                     )?;\n  158 |                 }\n  159 |                 d => return Err(ImageErrors::ImageOperationNotImplemented(self.name(), d)),\n  160 |             }\n  161 |         }\n  162 |         // convert back\n  163 |         if target_img.depth() != target_depth {\n  164 |             target_img.convert_depth(target_depth)?;\n  165 |         }","lines":84,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/hald_clut.rs#L82-L165"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`SpatialOperations::Contrast` (`find_contrast`) does integer division\n`num / div` where `num = max - min` and `div = max + min + 1`. Since `num < div`\nalways holds for non-negative integers, the result is 0 for every window except\ndegenerate ones. The documented intent `(max-min)/(max+min)` is a fractional\nratio that integer division cannot represent, so the Contrast spatial filter\neffectively always outputs 0 for u8/u16 images.","fix":"Compute the ratio in floating point and rescale to the integer range (e.g. `((max-min) as f32 / (max+min).max(1) as f32 * MAX_VAL)`), or document/return a normalized result.","locations":[{"ref":"crates/zune-imageprocs/src/spatial_ops.rs:73-82","code":"   73 | pub(crate) fn find_contrast<T>(data: &[T]) -> T\n   74 | where\n   75 |     T: PartialOrd + Copy + NumOps<T> + Sub<Output = T> + Add<Output = T> + Div<Output = T>,\n   76 | {\n   77 |     let minimum = find_min(data);\n   78 |     let maximum = find_max(data);\n   79 |     let num = maximum - minimum;\n   80 |     let div = (maximum + minimum).saturating_add(T::one());\n   81 |     num / div\n   82 | }","lines":10,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/spatial_ops.rs#L73-L82"},{"ref":"crates/zune-imageprocs/src/spatial_ops.rs:14-27","code":"   14 | /// Spatial operations implemented for images\n   15 | #[derive(Copy, Clone, Debug, PartialOrd, PartialEq)]\n   16 | pub enum SpatialOperations {\n   17 |     /// (max-min)/(max+min)\n   18 |     Contrast,\n   19 |     /// max\n   20 |     Maximum,\n   21 |     /// max-min\n   22 |     Gradient,\n   23 |     /// min\n   24 |     Minimum,\n   25 |     /// sum(pix)/len\n   26 |     Mean,\n   27 | }","lines":14,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/spatial_ops.rs#L14-L27"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`set_quality` clamps with `quality.clamp(0, 100)`. Since `quality` is a `u8`, the\nlower bound `0` is meaningless (u8 is always >= 0) and clippy will flag this; the\nintent (cap at 100) is fine but the `0` is dead. Negligible behaviorally.","fix":"Use `quality.min(100)` instead of `quality.clamp(0, 100)`.","locations":[{"ref":"crates/zune-core/src/options/encoder.rs:174-177","code":"  174 |     pub fn set_quality(mut self, quality: u8) -> Self {\n  175 |         self.quality = quality.clamp(0, 100);\n  176 |         self\n  177 |     }","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-core/src/options/encoder.rs#L174-L177"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the legacy (old-format) RLE branch of `HdrDecoder::decompress`, the run expansion does\n`scanline.copy_within(scanline_offset - 4..scanline_offset, 4)`, i.e. it always copies the\nprevious pixel to the fixed destination offset 4 rather than to the advancing write\nposition. Combined with `scanline_offset += 4` this repeatedly overwrites the same 4-byte\nslot while advancing the cursor, so a run in the old RLE format yields incorrect pixels\n(it does not replicate the previous pixel into the run region as intended). Only reachable\nfor images with `width < 8` or `width > 0x7fff`, hence low severity, but the output is wrong.","fix":"Copy to the current write cursor instead of the literal 4, e.g.\n`scanline.copy_within(scanline_offset - 4..scanline_offset, scanline_offset)` (verify\nagainst the radiance old-RLE spec / a reference decoder before changing).","locations":[{"ref":"crates/zune-hdr/src/decoder.rs:412-435","code":"  412 |             if scanline[scanline_offset] == 1\n  413 |                 && scanline[scanline_offset + 1] == 1\n  414 |                 && scanline[scanline_offset + 2] == 1\n  415 |             {\n  416 |                 let run = scanline[scanline_offset + 3];\n  417 | \n  418 |                 let mut i = i32::from(run) << shift;\n  419 | \n  420 |                 while width > 0 && scanline_offset > 4 && i > 0 {\n  421 |                     scanline.copy_within(scanline_offset - 4..scanline_offset, 4);\n  422 |                     scanline_offset += 4;\n  423 |                     i -= 1;\n  424 |                     width -= 4;\n  425 |                 }\n  426 |                 shift += 8;\n  427 | \n  428 |                 if shift > 16 {\n  429 |                     break;\n  430 |                 }\n  431 |             } else {\n  432 |                 scanline_offset += 4;\n  433 |                 width -= 1;\n  434 |                 shift = 0;\n  435 |             }","lines":24,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-hdr/src/decoder.rs#L412-L435"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `decode_ipma`, the per-entry guard re-checks `entry_count > MAX_ENTRIES` (the outer total count)\ninstead of validating `assoc_count` (the per-entry association count read just above). `assoc_count`\nis an unbounded u8 (0..=255) read from the stream and is used as `Vec::with_capacity(assoc_count)`;\nthe inner loop reads that many associations. The copy-pasted check is dead/ineffective because\nentry_count was already validated at the top of the function. While u8 capacity is small, the check\nclearly intended to bound the inner loop.","fix":"Remove the redundant `entry_count > MAX_ENTRIES` re-check, or replace it with a meaningful check\non `assoc_count` if a per-entry cap is desired. The byte budget (`bytes_left`) already bounds total\nwork via subtract_value.","locations":[{"ref":"crates/zune-heic/src/headers.rs:988-1019","code":"  988 |         let assoc_count = reader.read_u8();\n  989 | \n  990 |         bytes_left = subtract_value(bytes_left, 1)?;\n  991 | \n  992 |         if entry_count > MAX_ENTRIES {\n  993 |             // chosen by rng dice\n  994 |             return Err(HeicErrors::Generic {\n  995 |                 msg: format!(\n  996 |                     \"Entry count for IPMA sub-section too many {entry_count} (possibly corrupt) (max library supported entries {MAX_ENTRIES})\"\n  997 |                 )\n  998 |             });\n  999 |         }\n 1000 | \n 1001 |         let mut associations = Vec::with_capacity(assoc_count as usize);\n 1002 | \n 1003 |         for _ in 0..assoc_count {\n 1004 |             if (flags & 1) != 0 {\n 1005 |                 let val = reader.get_u16_be_err()?;\n 1006 |                 bytes_left = subtract_value(bytes_left, 2)?;\n 1007 |                 associations.push(IpmaAssociation {\n 1008 |                     essential: (val >> 15) != 0,\n 1009 |                     property_index: val & 0x7FFF,\n 1010 |                 });\n 1011 |             } else {\n 1012 |                 let val = reader.read_u8();\n 1013 |                 bytes_left = subtract_value(bytes_left, 1)?;\n 1014 |                 associations.push(IpmaAssociation {\n 1015 |                     essential: (val >> 7) != 0,\n 1016 |                     property_index: u16::from(val & 0x7F),\n 1017 |                 });\n 1018 |             }\n 1019 |         }","lines":32,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/headers.rs#L988-L1019"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`finish_ctu` checks for tile sub-stream transitions under `if pps.tiles_enabled_flag { todo!() }`,\nmeaning the WPP `end_of_sub_stream` handling and the `if true` deblocking block coexist with an\nunimplemented tile path. The standalone `if true { ... }` wrapping the deblock call\n(decode_slice.rs lines 159-180) is dead-conditional scaffolding left from benchmarking and should\nbe a plain block; it obscures control flow and the perf comment is stale documentation embedded in\ncode.","fix":"Remove the `if true` wrapper (use an unconditional block) and move the perf note to a comment or drop it.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/quadtree.rs:158-180","code":"  158 |     // apply deblocking\n  159 |     if true {\n  160 |         // perf wise\n  161 |         // with deblocking     139.33 ms\n  162 |         // without deblocking  129.64 ms\n  163 |         //\n  164 |         // So deblocking does have a speed hit\n  165 |         // but its negligible imo\n  166 |         let rf_clone = raw_frame.clone();\n  167 |         deblock_frame(\n  168 |             &rf_clone,\n  169 |             ctx.neighbor_tracker,\n  170 |             pps.cb_qp_offset as i8,\n  171 |             pps.cr_qp_offset as i8\n  172 |         );\n  173 |         // apply_sao_frame(\n  174 |         //     &raw_frame,\n  175 |         //     hevc_decoder.width,\n  176 |         //     hevc_decoder.height,\n  177 |         //     1 << sps.log2_ctb_size_y,\n  178 |         //     &ctx.ctb_sao_buffer\n  179 |         // )\n  180 |     }","lines":23,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/quadtree.rs#L158-L180"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ops.rs` `Add`/`Sub` operate only on color channels (`channels_mut(true)` /\n`channels_ref(true)` ignore the alpha channel), so the alpha plane of the left-hand\nimage is silently passed through unchanged while RGB is added/subtracted. They also\nzip frames-by-position implicitly (via channel zips) and `check_full_compatibility`\nnever checks `frames_len()`, so adding images with different frame counts processes\nonly the overlapping channels of the first frame's components and ignores the rest\nwith no error. The result is surprising for animated images and for callers expecting\nalpha to participate.","fix":"Document that alpha is intentionally preserved, or operate on all channels; and add a\n`frames_len` equality check to `check_full_compatibility`.","locations":[{"ref":"crates/zune-image/src/ops.rs:22-167","code":"   22 | #[track_caller]\n   23 | fn check_full_compatibility(img1: &Image, img2: &Image) {\n   24 |     assert_eq!(\n   25 |         img1.depth(),\n   26 |         img2.depth(),\n   27 |         \"Image depth mismatch cannot continue {:?}!={:?}\",\n   28 |         img1.depth(),\n   29 |         img2.depth()\n   30 |     );\n   31 | \n   32 |     assert_eq!(\n   33 |         img1.dimensions(),\n   34 |         img2.dimensions(),\n   35 |         \"Dimensions mismatch, {:?} != {:?}\",\n   36 |         img1.dimensions(),\n   37 |         img2.dimensions()\n   38 |     );\n   39 | \n   40 |     assert_eq!(\n   41 |         img1.colorspace(),\n   42 |         img2.colorspace(),\n   43 |         \"Colorspace mismatch, {:?} != {:?}\",\n   44 |         img1.colorspace(),\n   45 |         img2.colorspace()\n   46 |     );\n   47 | }\n   48 | \n   49 | impl Add for Image {\n   50 |     type Output = Image;\n   51 | \n   52 |     fn add(self, rhs: Image) -> Self::Output {\n   53 |         check_full_compatibility(&self, &rhs);\n   54 | \n   55 | n   97 |                     channel_px\n   98 |                         .iter_mut()\n   99 |                         .zip(channel_rhs.iter())\n  100 |                         .for_each(|(x, y)| *x += *y);\n  101 |                 }\n  102 |             }\n  103 |             d => unimplemented!(\"Unimplemented for {:?}\", d)\n  104 |         }\n  105 |         new_img\n  106 |     }\n  107 | }\n  108 | \n  109 | impl Sub for Image {\n  110 |     type Output = Image;\n  111 | \n  112 |     fn sub(self, rhs: Image) -> Self::Output {\n  113 |         check_full_compatibility(&self, &rhs);\n  114 | \n  115 |         let mut new_img = self;\n  116 | \n  117 |         match new_img.depth().bit_type() {\n  118 |             BitType::U8 => {\n  119 |                 for (prev, rhs_c) in new_img\n  120 |                     .channels_mut(true)\n  121 |                     .iter_mut()\n  122 |                     .zip(rhs.channels_ref(true))\n  123 |                 {\n  124 |                     let channel_px = prev.reinterpret_as_mut::<u8>().unwrap();\n  125 |                     let channel_rhs = rhs_c.reinterpret_as::<u8>().unwrap();\n  126 | \n  127 |                     channel_px\n  128 |                         .iter_mut()\n  129 |                         .zip(channel_rhs.iter())\n  130 |                         .for_each(|(x, y)| *x = x.saturating_sub(*y));\n  131 |                 }\n  132 |             }\n  133 |             BitType::U16 => {\n  134 |                 for (prev, rhs_c) in new_img\n  135 |                     .channels_mut(true)\n  136 |                     .iter_mut()\n  137 |                     .zip(rhs.channels_ref(true))\n  138 |                 {\n  139 |                     let channel_px = prev.reinterpret_as_mut::<u16>().unwrap();\n  140 |                     let channel_rhs = rhs_c.reinterpret_as::<u16>().unwrap();\n  141 | \n  142 |                     channel_px\n  143 |                         .iter_mut()\n  144 | {"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In Sharpen's U8 path the user-supplied `threshold: u16` is cast with `as u8`,\ntruncating values > 255 (e.g. threshold 300 becomes 44) instead of clamping. The\nF32 path correctly clamps via `u8::try_from(self.threshold.clamp(0,255))`. This\nmakes the U8 unsharp-mask threshold behave unexpectedly for thresholds above\n255.","fix":"Clamp instead of truncate: `self.threshold.min(255) as u8` (or `u8::try_from(self.threshold).unwrap_or(u8::MAX)`).","locations":[{"ref":"crates/zune-imageprocs/src/sharpen.rs:101-110","code":"  101 |             BitType::U8 => {\n  102 |                 // blur_image acts as the immutable \"src\", image acts as the mutable \"dest\"\n  103 |                 blur_image.par_process_regions_out_of_place::<u8, _>(\n  104 |                     image,\n  105 |                     ignore_alpha,\n  106 |                     |region| {\n  107 |                         unsharpen_region_u8(region, self.threshold as u8, self.percentage);\n  108 |                     },\n  109 |                 )?;\n  110 |             }","lines":10,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/sharpen.rs#L101-L110"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`peek_bits` / `peek_var_bits` / `get_bits` / `drop_bits` guard their preconditions only\nwith `debug_assert!` (e.g. `debug_assert!(self.bits_left >= LOOKAHEAD as u8)`). In the\nslow loop of the streaming decoder, `litlen_decode_table[(entry >> 16) as usize + extra]`\n(streaming_decoder.rs:1009) indexes the litlen table with no `.min(LITLEN_ENOUGH - 1)`\nclamp, unlike the fast loop which does clamp (streaming_decoder.rs:871) and unlike the\noffset subtable accesses which mask with `& 511`. `extra` comes from `peek_var_bits`\nover up to `(entry>>8)&0x3F` bits. For a correctly built table this index stays in\nrange, but the asymmetry (clamp present in one path, absent in the other) is fragile: any\ntable-construction edge case or future change could turn this into an out-of-bounds index\npanic on malformed input in release builds. Worth making the two paths consistent.","fix":"Clamp the litlen subtable index in the slow loop the same way the fast loop does:\n`entry = litlen_decode_table[((entry >> 16) as usize + extra).min(LITLEN_ENOUGH - 1)];`\nso both code paths have identical, provable bounds.","locations":[{"ref":"crates/zune-inflate/src/streaming_decoder.rs:1007-1012","code":" 1007 |                 if (entry & HUFFDEC_SUITABLE_POINTER) != 0 {\n 1008 |                     let extra = self.stream.peek_var_bits(((entry >> 8) & 0x3F) as usize);\n 1009 |                     entry = litlen_decode_table[(entry >> 16) as usize + extra];\n 1010 |                     saved_bitbuf = self.stream.buffer;\n 1011 |                     self.stream.drop_bits((entry & 0xFF) as u8);\n 1012 |                 }","lines":6,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-inflate/src/streaming_decoder.rs#L1007-L1012"},{"ref":"crates/zune-inflate/src/streaming_decoder.rs:866-872","code":"  866 |                         let entry_position = ((entry >> 8) & 0x3F) as usize;\n  867 |                         let mut pos = (entry >> 16) as usize;\n  868 | \n  869 |                         saved_bitbuf = self.stream.buffer;\n  870 |                         pos += self.stream.peek_var_bits(entry_position);\n  871 |                         entry = litlen_decode_table[pos.min(LITLEN_ENOUGH - 1)];\n  872 |                         self.stream.drop_bits(entry as u8);","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-inflate/src/streaming_decoder.rs#L866-L872"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`drop_bits` uses `self.bits_left = self.bits_left.saturating_sub(n)` (the debug_assert that `bits_left >= n` is commented out as fuzzer-noisy), while `get_bits` uses `self.bits_left.wrapping_sub(n_bits)`. The two consumption paths disagree on how an over-consumption is represented (`bits_left` saturating at 0 vs wrapping to a large value), and `decode_huff!` guards with `code_length > bits_left` only in the slow path. Inconsistent bit accounting on corrupt streams can let the decoder read more bits than were actually present without surfacing an error, yielding silent garbage rather than a clean `ExhaustedData`.","fix":"Make `get_bits` and `drop_bits` consistent (both saturating, with a single bits-left guard) so over-reads are detected uniformly.","locations":[{"ref":"crates/zune-jpeg/src/bitstream.rs:291-309","code":"  291 |     fn drop_bits(&mut self, n: u8) {\n  292 |         // PS: Its a good check, but triggers fuzzer and a lot of false positives\n  293 |         //debug_assert!(self.bits_left >= n);\n  294 |         //self.bits_left -= n;\n  295 |         self.bits_left = self.bits_left.saturating_sub(n);\n  296 |         self.aligned_buffer <<= n;\n  297 |     }\n  298 | \n  299 |     /// Read `n_bits` from the buffer  and discard them\n  300 |     #[inline(always)]\n  301 |     #[allow(clippy::cast_possible_truncation)]\n  302 |     fn get_bits(&mut self, n_bits: u8) -> i32 {\n  303 |         let mask = (1_u64 << n_bits) - 1;\n  304 | \n  305 |         self.aligned_buffer = self.aligned_buffer.rotate_left(u32::from(n_bits));\n  306 |         let bits = (self.aligned_buffer & mask) as i32;\n  307 |         self.bits_left = self.bits_left.wrapping_sub(n_bits);\n  308 |         bits\n  309 |     }","lines":19,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/bitstream.rs#L291-L309"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Components::from` validates `horizontal_sample` is a power of two but only checks `vertical_sample != 0` (the power-of-two check is commented out), while both are merely required to be `<= MAX_SAMP_FACTOR (4)`. A vertical sampling factor of 3 is therefore accepted, producing `SampleRatios::Generic(h, 3)` and asymmetric handling versus the horizontal axis. Sampling factors that are not 1/2/4 stress the generic-upsampler and stride math that this code repeatedly works around (`fix_an_annoying_bug`, padded-width Generic branch).","fix":"Apply the same power-of-two (or explicit 1/2/4) check to `vertical_sample` as to `horizontal_sample`, or document and test the Generic(_,3) path explicitly.","locations":[{"ref":"crates/zune-jpeg/src/components.rs:106-144","code":"  106 |         let horizontal_sample = (a[1] >> 4) as usize;\n  107 |         let vertical_sample = (a[1] & 0x0f) as usize;\n  108 |         // Match libjpeg turbo on checking for sampling factors\n  109 |         // Reject anything above 4\n  110 |         if horizontal_sample > MAX_SAMP_FACTOR {\n  111 |             return Err(DecodeErrors::Format(format!(\n  112 |                 \"Bogus Horizontal Sampling Factor {horizontal_sample}\"\n  113 |             )));\n  114 |         }\n  115 |         if vertical_sample > MAX_SAMP_FACTOR {\n  116 |             return Err(DecodeErrors::Format(format!(\n  117 |                 \"Bogus Vertical Sampling Factor {vertical_sample}\"\n  118 |             )));\n  119 |         }\n  120 | \n  121 |         let quantization_table_number = a[2];\n  122 |         // confirm quantization number is between 0 and MAX_COMPONENTS\n  123 |         if usize::from(quantization_table_number) >= MAX_COMPONENTS {\n  124 |             return Err(DecodeErrors::Format(format!(\n  125 |                 \"Too large quantization number :{quantization_table_number}, expected value between 0 and {MAX_COMPONENTS}\"\n  126 |             )));\n  127 |         }\n  128 |         // check that upsampling ratios are powers of two\n  129 |         // if these fail, it's probably a corrupt image.\n  130 |         if !horizontal_sample.is_power_of_two() {\n  131 |             return Err(DecodeErrors::Format(format!(\n  132 |                 \"Horizontal sample is not a power of two({horizontal_sample}) cannot decode\"\n  133 |             )));\n  134 |         }\n  135 | \n  136 |         // if !vertical_sample.is_power_of_two() {\n  137 |         //     return Err(DecodeErrors::Format(format!(\n  138 |         //         \"Vertical sub-sample is not power of two({vertical_sample}) cannot decode\"\n  139 |         //     )));\n  140 |         // }\n  141 |         if vertical_sample == 0 {\n  142 |             // Check for invalid vertical sample\n  143 |             return Err(DecodeErrors::Format(\"Vertical sample is zero\".to_string()));\n  144 |         }","lines":39,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/components.rs#L106-L144"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`parse_trns` for palette images validates the tRNS length against the palette's\nallocated capacity rather than the number of palette entries actually present. The\npalette is always `resize(256, ...)` in `parse_plte` regardless of how many PLTE\nentries existed, so the check `self.palette.len() < chunk.length` is effectively\n`256 < chunk.length`. A tRNS chunk is therefore accepted as long as it is <= 256 entries\neven if the PLTE only defined, say, 4 colors. The spec says tRNS for a palette image must\nnot contain more entries than the palette. This is not a memory-safety issue (indices\nstay < 256), but it silently accepts malformed files and writes alpha into palette slots\nthat were never defined by PLTE.","fix":"Track the real number of PLTE entries written (e.g. store `chunk.length/3` from\n`parse_plte`) and validate `chunk.length` for tRNS against that count rather than the\nfixed 256-entry capacity.","locations":[{"ref":"crates/zune-png/src/headers/readers.rs:169-182","code":"  169 |             PngColor::Palette => {\n  170 |                 if self.palette.is_empty() {\n  171 |                     return Err(PngDecodeErrors::GenericStatic(\"tRNS chunk before plTE\"));\n  172 |                 }\n  173 |                 if self.palette.len() < chunk.length {\n  174 |                     return Err(PngDecodeErrors::Generic(format!(\n  175 |                         \"tRNS chunk with too long entries {}\",\n  176 |                         chunk.length\n  177 |                     )));\n  178 |                 }\n  179 |                 for i in 0..chunk.length {\n  180 |                     self.palette[i].0[3] = self.stream.read_u8();\n  181 |                 }\n  182 |             }","lines":14,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-png/src/headers/readers.rs#L169-L182"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In `imdecode_inner`, the QOI branch decodes using `JpegDecoder` instead of a QOI\ndecoder: `ImageFormat::QOI => { let mut decoder = JpegDecoder::new(data); ... }`.\nA QOI image will be fed to the JPEG decoder, which will fail or misbehave; QOI\ndecoding via this FFI path is effectively broken.","fix":"Use the QOI decoder (e.g. `zune_image::codecs::qoi::QoiDecoder::new(data)`) in the\nQOI branch, mirroring the JPEG/PNG/BMP branches.","locations":[{"ref":"crates/zune-capi/src/imread.rs:464-469","code":"  464 |             ImageFormat::QOI => {\n  465 |                 // just write into buffer\n  466 |                 let mut decoder = JpegDecoder::new(data);\n  467 | \n  468 |                 decoder.decode_into(output)?;\n  469 |             }","lines":6,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/imread.rs#L464-L469"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`EncoderOptions::set_jpeg_encode_progressive` sets the wrong flag: it assigns to\n`self.flags.jpeg_optimize_huffman = yes` instead of\n`self.flags.jpeg_encode_progressive = yes`. As a result, asking for progressive\nJPEG encoding actually toggles optimized huffman tables and never enables\nprogressive mode. The CLI `--progressive` flag (wired through\n`encoder_options` -> `set_jpeg_encode_progressive`) is therefore a no-op for\nprogressive encoding.","fix":"Set `self.flags.jpeg_encode_progressive = yes;` instead of `jpeg_optimize_huffman`.","locations":[{"ref":"crates/zune-core/src/options/encoder.rs:247-250","code":"  247 |     pub fn set_jpeg_encode_progressive(mut self, yes: bool) -> Self {\n  248 |         self.flags.jpeg_optimize_huffman = yes;\n  249 |         self\n  250 |     }","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-core/src/options/encoder.rs#L247-L250"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In the CLI color-transform parser, `\"bt-2020\"` is mapped to\n`ColorProfiles::DisplayP3` (identical to the `\"display-p3\"` arm). Selecting the\nBT.2020 color profile silently performs a Display-P3 transform instead, producing\nincorrect colors with no error.","fix":"Map `\"bt-2020\"` to the correct BT.2020 profile variant of `ColorProfiles` (or\nreturn an error if BT.2020 is not yet supported), rather than `DisplayP3`.","locations":[{"ref":"crates/zune-bin/src/cmd_parsers/filters.rs:96-102","code":"   96 |             let color_profile = match value.to_lowercase().as_str() {\n   97 |                 \"rgb\" => ColorProfiles::sRGB,\n   98 |                 \"adobe-rgb\" => ColorProfiles::AdobeRgb,\n   99 |                 \"display-p3\" => ColorProfiles::DisplayP3,\n  100 |                 \"bt-2020\" => ColorProfiles::DisplayP3,\n  101 |                 _ => return Err(format!(\"Unknown color profile: {value}\")),\n  102 |             };","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bin/src/cmd_parsers/filters.rs#L96-L102"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"In `setup_component_params` the per-component `y` (a vertical extent) is computed with horizontal terms: `(img_height * component.horizontal_sample + img.h_max - 1) / img.v_max`. It mixes `horizontal_sample`/`h_max` into a height calculation (the parallel `x` line correctly uses horizontal terms) and also uses truncating `/` instead of `div_ceil`. This is a clear copy-paste from the `x` line; it produces a wrong value, masked only because `component.y` is never read elsewhere.","fix":"If `y` is needed, compute `(img_height * component.vertical_sample).div_ceil(img.v_max)`; otherwise remove the dead `x`/`y`/`w2` fields entirely (see the dead-code finding).","locations":[{"ref":"crates/zune-jpeg/src/misc.rs:224-229","code":"  224 |         let x = (usize::from(img_width) * component.horizontal_sample).div_ceil(img.h_max);\n  225 |         let y = (usize::from(img_height) * component.horizontal_sample + img.h_max - 1) / img.v_max;\n  226 |         component.x = x;\n  227 |         component.w2 = img.mcu_x * component.horizontal_sample * 8;\n  228 |         // probably not needed. :)\n  229 |         component.y = y;","lines":6,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/misc.rs#L224-L229"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"`ZStatus::new` does not check the result of `zil_malloc`. If `mem` is NULL\n(allocation failure), `libc::strcpy(mem.cast(), msg.as_ptr())` writes through a\nnull pointer -> null-pointer write / UB. The struct's `message` is then also set\nto NULL and later freed/read without a guard.","fix":"Check `mem.is_null()` after `zil_malloc`; on failure store a null message and a\ndistinct status, or fall back to a static message, instead of unconditionally\ncalling `strcpy`.","locations":[{"ref":"crates/zune-capi/src/errno.rs:59-74","code":"   59 |     pub fn new<T>(message: T, status: ZStatusType) -> ZStatus\n   60 |     where\n   61 |         T: Into<Vec<u8>>\n   62 |     {\n   63 |         let msg = CString::new(message).unwrap();\n   64 |         let mem = unsafe { zil_malloc(msg.as_bytes_with_nul().len()) };\n   65 |         // copy to memory\n   66 |         unsafe {\n   67 |             libc::strcpy(mem.cast(), msg.as_ptr());\n   68 |         }\n   69 | \n   70 |         ZStatus {\n   71 |             status,\n   72 |             message: mem.cast()\n   73 |         }\n   74 |     }","lines":16,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/errno.rs#L59-L74"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`parse_gama` desynchronizes the chunk stream when a non-strict decoder encounters a\ngAMA chunk whose length is not 4. In strict mode a wrong length is rejected, but in the\ndefault (non-strict) mode the code falls through and unconditionally reads exactly one\nu32 (4 bytes) of data and then `skip(4)` for the CRC. If `chunk.length > 4`, the extra\n`chunk.length - 4` data bytes are never consumed, so the reader is left pointing into\nthe middle of the gAMA payload. The subsequent `read_chunk_header` then interprets\narbitrary bytes as the next chunk length/type, leading to bogus chunk parsing, spurious\n\"unknown but necessary\" errors, or skipping huge/negative amounts. Every other lenient\nchunk parser in this file (e.g. `parse_time`, `parse_actl`, `parse_exif`) correctly\ndoes `self.stream.skip(chunk.length + 4)` on a bad length. gAMA does not, so a single\nmalformed-but-tolerated ancillary chunk corrupts decoding of an otherwise valid image.","fix":"On the non-strict path, when `chunk.length != 4` skip the whole chunk plus CRC and\nreturn, mirroring `parse_time`:\n```\nif chunk.length != 4 {\n    if self.options.strict_mode() { return Err(...); }\n    warn!(...);\n    self.stream.skip(chunk.length + 4)?;\n    return Ok(());\n}\n```","locations":[{"ref":"crates/zune-png/src/headers/readers.rs:195-213","code":"  195 |     pub(crate) fn parse_gama(&mut self, chunk: PngChunk) -> Result<(), PngDecodeErrors> {\n  196 |         if self.options.strict_mode() && chunk.length != 4 {\n  197 |             let error = format!(\"Gama chunk length is not 4 but {}\", chunk.length);\n  198 |             return Err(PngDecodeErrors::Generic(error));\n  199 |         }\n  200 | \n  201 |         let mut gama = (self.stream.get_u32_be() as f64 / 100000.0) as f32;\n  202 |         if gama == 0.0 {\n  203 |             // this is invalid gama\n  204 |             // warn and set it to 2.2 which is the default gama\n  205 |             warn!(\"Gamma value of 0.0 is invalid, setting it to 2.2\");\n  206 |             gama = 1.0 / 2.2;\n  207 |         }\n  208 |         self.png_info.gamma = Some(gama);\n  209 |         // skip crc\n  210 |         self.stream.skip(4)?;\n  211 | \n  212 |         Ok(())\n  213 |     }","lines":19,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-png/src/headers/readers.rs#L195-L213"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`decode_hardware_videotoolbox` calls `decoder.decode_sample(&sample).unwrap()` inside the per-tile\nprocessor closure. `decode_sample` returns `Result<(), OSStatus>`; any VideoToolbox/CoreMedia\nfailure (which can be triggered by malformed parameter sets) panics instead of being surfaced as a\nHeicErrors. The closure already returns `Result<(), HeicErrors>`, so the error could be mapped and\nreturned.","fix":"Replace `.unwrap()` with `.map_err(|s| HeicErrors::Generic { msg: format!(\"decode_sample failed:\n{s}\") })?`.","locations":[{"ref":"crates/zune-heic/src/apple_videotoolbox.rs:513-516","code":"  513 |             if let Some(decoder) = hardware_decoder.as_ref() {\n  514 |                 decoder.decode_sample(&sample).unwrap();\n  515 |             }\n  516 |             Ok(())","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/apple_videotoolbox.rs#L513-L516"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"For 16-bit images, several encoders feed raw bytes obtained from `Image::to_u8()`,\nwhich serializes `u16` samples using `Endianness::Native`\n(`u16_to_u8_endian(Endianness::Native)`). Farbfeld is defined as big-endian 16-bit\nRGBA, so on little-endian hosts the bytes handed to `zune_farbfeld::FarbFeldEncoder`\nare byte-swapped relative to the format, producing corrupt output unless the\ndelegate re-swaps them itself (the JPEG encoder path explicitly uses\n`Endianness::Big` for PNG, showing native-endian is not generally safe). The QOI and\nJXL 16-bit paths share the same `to_u8()` native-endian assumption and are suspect\nfor the same reason.","fix":"Use an explicit endianness matching each format's spec (e.g. big-endian for farbfeld)\nvia `frame.u16_to_u8_endian(Endianness::Big)` rather than `to_u8()`'s native endian,\nor verify each delegate encoder expects native-endian byte slices and document it.","locations":[{"ref":"crates/zune-image/src/codecs/farbfeld.rs:111-127","code":"  111 |     fn encode_inner<T: ZByteWriterTrait>(\n  112 |         &mut self, image: &Image, sink: T\n  113 |     ) -> Result<usize, ImageErrors> {\n  114 |         let options = create_options_for_encoder(self.options, image);\n  115 | \n  116 |         assert_eq!(image.depth(), BitDepth::Sixteen);\n  117 | \n  118 |         let data = &image.to_u8()[0];\n  119 | \n  120 |         let encoder = zune_farbfeld::FarbFeldEncoder::new(data, options);\n  121 | \n  122 |         let data = encoder\n  123 |             .encode(sink)\n  124 |             .map_err(<FarbFeldEncoderErrors as Into<ImgEncodeErrors>>::into)?;\n  125 | \n  126 |         Ok(data)\n  127 |     }","lines":17,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/codecs/farbfeld.rs#L111-L127"},{"ref":"crates/zune-image/src/image.rs:198-210","code":"  198 |     #[allow(dead_code)]\n  199 |     pub(crate) fn to_u8(&self) -> Vec<Vec<u8>> {\n  200 |         if self.metadata.depth() == BitDepth::Eight {\n  201 |             self.flatten_frames::<u8>()\n  202 |         } else if self.metadata.depth() == BitDepth::Sixteen {\n  203 |             self.frames_ref()\n  204 |                 .iter()\n  205 |                 .map(|z| z.u16_to_u8_endian(Endianness::Native).unwrap())\n  206 |                 .collect()\n  207 |         } else {\n  208 |             todo!(\"Unimplemented\")\n  209 |         }\n  210 |     }","lines":13,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/image.rs#L198-L210"},{"ref":"crates/zune-image/src/codecs/qoi.rs:105-119","code":"  105 |     fn encode_inner<T: ZByteWriterTrait>(\n  106 |         &mut self, image: &Image, sink: T\n  107 |     ) -> Result<usize, ImageErrors> {\n  108 |         let options = create_options_for_encoder(self.options, image);\n  109 | \n  110 |         let data = &image.to_u8()[0];\n  111 | \n  112 |         let mut qoi_encoder = zune_qoi::QoiEncoder::new(data, options);\n  113 | \n  114 |         let bytes_written = qoi_encoder\n  115 |             .encode(sink)\n  116 |             .map_err(<QoiEncodeErrors as Into<ImgEncodeErrors>>::into)?;\n  117 | \n  118 |         Ok(bytes_written)\n  119 |     }","lines":15,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/codecs/qoi.rs#L105-L119"},{"ref":"crates/zune-image/src/codecs/jpeg_xl.rs:69-83","code":"   69 |     fn encode_inner<T: ZByteWriterTrait>(\n   70 |         &mut self, image: &Image, sink: T\n   71 |     ) -> Result<usize, ImageErrors> {\n   72 |         let options = create_options_for_encoder(self.options, image);\n   73 | \n   74 |         let data = &image.to_u8()[0];\n   75 | \n   76 |         let encoder = JxlSimpleEncoder::new(data, options);\n   77 | \n   78 |         let data = encoder\n   79 |             .encode(sink)\n   80 |             .map_err(<JxlEncodeErrors as Into<ImgEncodeErrors>>::into)?;\n   81 | \n   82 |         Ok(data)\n   83 |     }","lines":15,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/codecs/jpeg_xl.rs#L69-L83"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`QoiDecoder::output_buffer_size` returns `Option<usize>` to signal overflow, but the inner\n`width.checked_mul(self.height).unwrap()` panics instead of returning `None` when\n`width*height` overflows `usize`. `decode()` and `decode_into` then call\n`output_buffer_size().unwrap()` again. With caller-raised `set_max_width`/`set_max_height`\nlimits (each up to `u32::MAX` from the header), `width*height` can overflow on the inner\n`unwrap`, turning a recoverable condition into a panic on attacker-controlled dimensions.\nThe doc comment even advertises \"# Panics\", which contradicts the `Option` contract.","fix":"Use a fully checked chain that returns None on any overflow:\n`self.width.checked_mul(self.height)?.checked_mul(self.colorspace.num_components())`\nand have `decode`/`decode_into` map a `None` to an error instead of unwrapping.","locations":[{"ref":"crates/zune-qoi/src/decoder.rs:196-205","code":"  196 |     pub fn output_buffer_size(&self) -> Option<usize> {\n  197 |         if self.decoded_headers {\n  198 |             self.width\n  199 |                 .checked_mul(self.height)\n  200 |                 .unwrap()\n  201 |                 .checked_mul(self.colorspace.num_components())\n  202 |         } else {\n  203 |             None\n  204 |         }\n  205 |     }","lines":10,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-qoi/src/decoder.rs#L196-L205"},{"ref":"crates/zune-qoi/src/decoder.rs:222-231","code":"  222 |     pub fn decode(&mut self) -> Result<Vec<u8>, QoiErrors> {\n  223 |         if !self.decoded_headers {\n  224 |             self.decode_headers()?;\n  225 |         }\n  226 |         let mut output = vec![0; self.output_buffer_size().unwrap()];\n  227 | \n  228 |         self.decode_into(&mut output)?;\n  229 | \n  230 |         Ok(output)\n  231 |     }","lines":10,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-qoi/src/decoder.rs#L222-L231"},{"ref":"crates/zune-qoi/src/decoder.rs:251-256","code":"  251 |         if pixels.len() < self.output_buffer_size().unwrap() {\n  252 |             return Err(QoiErrors::InsufficientData(\n  253 |                 self.output_buffer_size().unwrap(),\n  254 |                 pixels.len()\n  255 |             ));\n  256 |         }","lines":6,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-qoi/src/decoder.rs#L251-L256"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`ZReader::write_all` increments `self.bytes_written += buf.len()` after\n`self.buffer.write_all_bytes(buf)?`. While the `?` guards the all-or-nothing\ncontract, the std `Write` implementation's `write_all` and the Vec impl always\nwrite all bytes, but the `&mut [u8]` no_std impl returns `NotEnoughBuffer` and\nwrites nothing on failure - so the `?` correctly short-circuits. The subtle issue\nis more in the partial path: `write` (line 42-46) adds the actually-written count,\nbut there is no observable bug here. Lower-confidence; primarily flagged because\n`bytes_written` is trusted by encoders as an exact output length.","fix":"No change strictly required; if desired, document that `bytes_written` reflects\nrequested-and-confirmed bytes. Consider asserting consistency in debug builds.","locations":[{"ref":"crates/zune-core/src/bytestream/writer.rs:41-61","code":"   41 |     #[inline]\n   42 |     pub fn write(&mut self, buf: &[u8]) -> Result<usize, ZByteIoError> {\n   43 |         let bytes_written = self.buffer.write_bytes(buf)?;\n   44 |         self.bytes_written += bytes_written;\n   45 |         Ok(bytes_written)\n   46 |     }\n   47 |     /// Write all bytes from `buf` into the bytestream and return\n   48 |     /// and panic if not all bytes were written to the bytestream\n   49 |     ///\n   50 |     /// # Arguments\n   51 |     /// - `buf`: The bytes to be written into the bytestream\n   52 |     ///\n   53 |     ///# Returns\n   54 |     /// - `Ok(())`: Indicates all bytes were written into the bytestream\n   55 |     /// - `Err(&static str)`: In case all the bytes could not be written\n   56 |     ///   to the stream\n   57 |     pub fn write_all(&mut self, buf: &[u8]) -> Result<(), ZByteIoError> {\n   58 |         self.buffer.write_all_bytes(buf)?;\n   59 |         self.bytes_written += buf.len();\n   60 |         Ok(())\n   61 |     }","lines":21,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-core/src/bytestream/writer.rs#L41-L61"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`extract_icc_profile_inner` unwraps `iprp.ipco.as_ref().unwrap()` inside the loop, but the caller\n`decode_headers` ignores its result entirely (`let _ = self.extract_icc_profile_inner();`). The\nfunction returns Option<()> and uses `?` for the outer accesses, yet the inner `.unwrap()` on\n`ipco` will panic if iprp exists but ipco is None (a legal-but-unusual structure). Since the return\nvalue is discarded the panic is the only observable effect.","fix":"Replace `iprp.ipco.as_ref().unwrap()` with `iprp.ipco.as_ref()?` to propagate None instead of panicking.","locations":[{"ref":"crates/zune-heic/src/decoder.rs:672-690","code":"  672 |     #[allow(clippy::collapsible_if,clippy::collapsible_match)]\n  673 |     fn extract_icc_profile_inner(&mut self) -> Option<()> {\n  674 |         let iprp = self.meta_section.as_ref()?.iprp.as_ref()?;\n  675 | \n  676 |         // 2. Iterate through the properties in 'ipco'\n  677 |         for item in &iprp.ipco.as_ref().unwrap().properties {\n  678 |             if let ItemProperty::Colr(c) = item {\n  679 |                 if let ColourInformation::IccProfile {\n  680 |                     profile_type: _,\n  681 |                     profile_data,\n  682 |                 } = c {\n  683 |                     trace!(\"Icc profile ({} bytes)\", profile_data.len());\n  684 |                     self.icc_data = Some(profile_data.clone());\n  685 |                     break;\n  686 |                 }\n  687 |             }\n  688 |         }\n  689 |         Some(())\n  690 |     }","lines":19,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/decoder.rs#L672-L690"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"PNG chunk CRCs are never verified during decoding. `read_chunk_header` reads only the\nlength and type, and every `parse_*` routine ends with `self.stream.skip(4)` to step\nover the CRC field without ever computing or comparing it. The `crc` module\n(`calc_crc`, `crc32_slice8`) exists and is used by the encoder, and `PngDecodeErrors`\neven has a `BadCrc(u32,u32)` variant, but the decoder path never produces it. This means\ncorrupted chunk payloads that still satisfy the length checks are accepted silently.\nThis is a deliberate speed tradeoff, but combined with the gAMA desync above it removes a\nsafety net; at minimum it is worth a `confirm_checksum`-style option as zune-inflate has.","fix":"Optionally validate the CRC: capture the chunk bytes (type+data), compute\n`calc_crc`, compare against the trailing 4 bytes, and return `PngDecodeErrors::BadCrc`\non mismatch when a (new) strict/verify option is enabled. At least expose it behind a\nDecoderOptions flag instead of always discarding the CRC.\"","locations":[{"ref":"crates/zune-png/src/decoder.rs:526-560","code":"  526 |     pub(crate) fn read_chunk_header(&mut self) -> Result<PngChunk, PngDecodeErrors> {\n  527 |         // Format is length - chunk type - [data] -  crc chunk, load crc chunk now\n  528 |         let chunk_length = self.stream.get_u32_be_err()? as usize;\n  529 |         let chunk_type_int = self.stream.get_u32_be_err()?.to_be_bytes();\n  530 | \n  531 |         let chunk_type = match &chunk_type_int {\n  532 |             b\"IHDR\" => PngChunkType::IHDR,\n  533 |             b\"tRNS\" => PngChunkType::tRNS,\n  534 |             b\"PLTE\" => PngChunkType::PLTE,\n  535 |             b\"IDAT\" => PngChunkType::IDAT,\n  536 |             b\"IEND\" => PngChunkType::IEND,\n  537 |             b\"pHYs\" => PngChunkType::pHYs,\n  538 |             b\"tIME\" => PngChunkType::tIME,\n  539 |             b\"gAMA\" => PngChunkType::gAMA,\n  540 |             b\"acTL\" => PngChunkType::acTL,\n  541 |             b\"fcTL\" => PngChunkType::fcTL,\n  542 |             b\"iCCP\" => PngChunkType::iCCP,\n  543 |             b\"iTXt\" => PngChunkType::iTXt,\n  544 |             b\"eXIf\" => PngChunkType::eXIf,\n  545 |             b\"zTXt\" => PngChunkType::zTXt,\n  546 |             b\"tEXt\" => PngChunkType::tEXt,\n  547 |             b\"fdAT\" => PngChunkType::fdAT,\n  548 |             b\"cHRM\" => PngChunkType::cHRM,\n  549 |             b\"cLLI\" => PngChunkType::cLLI,\n  550 |             b\"cICP\" => PngChunkType::cICP,\n  551 |             b\"sBIT\" => PngChunkType::sBIT,\n  552 |             _ => PngChunkType::unkn,\n  553 |         };\n  554 | \n  555 |         Ok(PngChunk {\n  556 |             length: chunk_length,\n  557 |             chunk: chunk_type_int,\n  558 |             chunk_type,\n  559 |         })\n  560 |     }","lines":35,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-png/src/decoder.rs#L526-L560"},{"ref":"crates/zune-png/src/crc.rs:47-52","code":"   47 | pub fn calc_crc(data: &[u8]) -> u32 {\n   48 |     !crc32_slice8(data, u32::MAX)\n   49 | }\n   50 | pub fn calc_crc_with_bytes(data: &[u8], value: u32) -> u32 {\n   51 |     crc32_slice8(data, value)\n   52 | }","lines":6,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-png/src/crc.rs#L47-L52"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"The `test_status_works` test creates a status with `zil_status_new()` and frees it\nwith `zil_free(c.cast())` instead of `zil_status_free`. This bypasses the Drop /\nmessage cleanup, leaking the internal `message` buffer. While only a test, it also\nmodels incorrect usage (the message buffer must be freed via `zil_status_free`).","fix":"Free with `zil_status_free(c)` in the test to exercise the correct teardown path.","locations":[{"ref":"crates/zune-capi/src/lib.rs:64-74","code":"   64 | #[test]\n   65 | fn test_status_works() {\n   66 |     use crate::errno::zil_status_new;\n   67 |     use crate::utils::zil_free;\n   68 | \n   69 |     unsafe {\n   70 |         let c = zil_status_new();\n   71 |         assert!(!c.is_null());\n   72 |         zil_free(c.cast());\n   73 |     }\n   74 | }","lines":11,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/lib.rs#L64-L74"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`par_process_regions_out_of_place` exposes inconsistent slice semantics that are easy\nto misuse. The destination channels are sliced to the region range\n(`from_raw_parts_mut(ptr.add(start_idx), slice_len)`), so they are region-relative and\nzero-based. The source channels, however, are handed out as the *entire* channel\nslice (`current_src[c] = src_ptrs[c]`), so consumers must index them with absolute\noffsets (`start_idx + ...`) while indexing dest with region-relative offsets. The two\nsides use different coordinate origins for the same region, which is a subtle trap\neven though it matches the doc comment \"entire immutable source\".","fix":"Either slice the source the same way as the dest (region-relative) and expose only the\nregion, or rename/document the field to make the absolute-offset contract explicit and\nprovide the `y_offset`/`start_idx` so callers compute the source index correctly.","locations":[{"ref":"crates/zune-image/src/planar_regions.rs:186-223","code":"  186 |             (0..num_regions).into_par_iter().for_each(|i| {\n  187 |                 let y_offset = i * lines_per_region;\n  188 |                 let current_height = std::cmp::min(lines_per_region, height - y_offset);\n  189 | \n  190 |                 let start_idx = y_offset * width;\n  191 |                 let end_idx = start_idx + (current_height * width);\n  192 | \n  193 |                 let mut current_src: [&[T]; MAX_SUPPORTED_CHANNELS] =\n  194 |                     std::array::from_fn(|_| &[] as &[T]);\n  195 | \n  196 |                 let mut current_dest: [&mut [T]; MAX_SUPPORTED_CHANNELS] =\n  197 |                     std::array::from_fn(|_| &mut [] as &mut [T]);\n  198 | \n  199 |                 for c in 0..num_channels {\n  200 |                     let safe_end = std::cmp::min(end_idx, lengths[c]);\n  201 |                     let slice_len = safe_end.saturating_sub(start_idx);\n  202 | \n  203 |                     unsafe {\n  204 |                         current_src[c] =\n  205 |                             if let Some(src_slice) = src_ptrs[c] { src_slice } else { &[] };\n  206 |                         // Dest is strictly chunked\n  207 |                         current_dest[c] = std::slice::from_raw_parts_mut(\n  208 |                             dest_ptrs[c].0.add(start_idx),\n  209 |                             slice_len,\n  210 |                         );\n  211 |                     }\n  212 |                 }\n  213 | \n  214 |                 let mut region = PlanarRegionOut {\n  215 |                     y_offset,\n  216 |                     height: current_height,\n  217 |                     width,\n  218 |                     src_channels: &current_src[..num_channels],\n  219 |                     dest_channels: &mut current_dest[..num_channels],\n  220 |                 };\n  221 | \n  222 |                 op(&mut region);\n  223 |             });","lines":38,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/planar_regions.rs#L186-L223"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`Image::flatten_to_u8`/`flatten_to_u16` clone the entire image (all frames, all\nchannels) when a depth conversion is required, then run `Depth::execute` on the clone\nand flatten it. For large images this doubles peak memory and copies the whole buffer\nsolely to avoid mutating `self`. The same whole-image clone pattern is used by\n`EncoderTrait::encode` whenever a colorspace/depth/alpha conversion is needed. This is\nacknowledged in the crate docs but remains a real cost for the common\n\"open f32/16-bit, save as 8-bit\" path.","fix":"Where the public method already produces an owned result (a fresh Vec), convert the\nchannel data directly into the output without cloning the source image; or provide a\nconsuming `into_flatten`/`into_depth` API for callers that do not need the original.","locations":[{"ref":"crates/zune-image/src/image.rs:234-278","code":"  234 |     pub fn flatten_to_u8(&self) -> Vec<Vec<u8>> {\n  235 |         if self.depth() == BitDepth::Eight {\n  236 |             self.flatten_frames::<u8>()\n  237 |         } else {\n  238 |             let mut im_clone = self.clone();\n  239 |             Depth::new(BitDepth::Eight).execute(&mut im_clone).unwrap();\n  240 |             im_clone.flatten_frames::<u8>()\n  241 |         }\n  242 |     }\n  243 |     /// Flatten every channel of every frame into a `Vec<Vec<u16>>`.\n  244 |     ///\n  245 |     /// Each inner `Vec<u16>` corresponds to one channel (in channel order),\n  246 |     /// and contains every pixel in that channel laid out in row-major order.\n  247 |     ///\n  248 |     /// If the image is already 16-bit the channel data is copied directly.\n  249 |     /// Otherwise the image is cloned and converted to 16-bit before flattening;\n  250 |     /// the original image is left unchanged.\n  251 |     ///\n  252 |     /// # Panics\n  253 |     ///\n  254 |     /// Panics if the internal depth conversion fails.\n  255 |     ///\n  256 |     /// # Example\n  257 |     ///\n  258 |     /// ```rust\n  259 |     /// use zune_core::colorspace::ColorSpace;\n  260 |     /// use zune_image::image::Image;\n  261 |     ///\n  262 |     /// let image = Image::from_u8(&[0, 128, 255], 3, 1, ColorSpace::Luma);\n  263 |     /// let channels = image.flatten_to_u16();\n  264 |     /// // values are scaled from 8-bit to 16-bit\n  265 |     /// assert_eq!(channels[0][0], 0);\n  266 |     /// assert_eq!(channels[0][2], 65535);\n  267 |     /// ```\n  268 |     pub fn flatten_to_u16(&self) -> Vec<Vec<u16>> {\n  269 |         if self.depth() == BitDepth::Sixteen {\n  270 |             self.flatten_frames::<u16>()\n  271 |         } else {\n  272 |             let mut im_clone = self.clone();\n  273 |             Depth::new(BitDepth::Sixteen)\n  274 |                 .execute(&mut im_clone)\n  275 |                 .unwrap();\n  276 |             im_clone.flatten_frames::<u16>()\n  277 |         }\n  278 |     }","lines":45,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/image.rs#L234-L278"},{"ref":"crates/zune-image/src/traits.rs:356-398","code":"  356 |         if !supported_colorspaces.contains(&colorspace)\n  357 |             || !self.supported_bit_depth().contains(&depth)\n  358 |             || image.metadata.alpha != NonPreMultiplied\n  359 |         {\n  360 |             let mut image_clone = image.clone();\n  361 | \n  362 |             if !supported_colorspaces.contains(&colorspace) {\n  363 |                 // get default colorspace\n  364 |                 let default_colorspace = self.default_colorspace(colorspace);\n  365 |                 let image_format = self.format();\n  366 | \n  367 |                 trace!(\"Image is in {colorspace:?} colorspace,converting it to {default_colorspace:?} which is the default configured colorspace of {image_format:?}\");\n  368 |                 // try converting  it to a supported colorspace\n  369 |                 let converter = ColorspaceConv::new(default_colorspace);\n  370 | \n  371 |                 converter.execute(&mut image_clone)?\n  372 |             }\n  373 |             let image_depth = image.depth();\n  374 | \n  375 |             if !self.supported_bit_depth().contains(&depth) {\n  376 |                 trace!(\n  377 |                     \"Image depth is in {:?}, but {} encoder supports {:?}\",\n  378 |                     image.depth(),\n  379 |                     self.name(),\n  380 |                     self.supported_bit_depth()\n  381 |                 );\n  382 |                 trace!(\n  383 |                     \"Converting image to a depth of {:?}\",\n  384 |                     self.default_depth(image_depth)\n  385 |                 );\n  386 | \n  387 |                 let depth = Depth::new(self.default_depth(image_depth));\n  388 | \n  389 |                 depth.execute(&mut image_clone)?;\n  390 |             }\n  391 | \n  392 |             // confirm again we didn't mess up\n  393 |             confirm_invariants(&image_clone)?;\n  394 | \n  395 |             self.encode_inner(&image_clone, sink)\n  396 |         } else {\n  397 |             self.encode_inner(image, sink)\n  398 |         }","lines":43,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/traits.rs#L356-L398"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `BmpDecoder::decode_headers`, when an ICC/color-profile is present (BMP v5,\n`ihsize > 108`) the decoder eagerly seeks to the profile offset and copies the profile\nbytes during header parsing, even though the profile normally sits AFTER the pixel data.\nThe in-code comment (`[tag=perf]`) acknowledges this forces an extra seek/jump on a path\nthat is hit for every v5 image regardless of whether the caller wants the ICC profile.","fix":"Defer ICC profile extraction until `icc_profile()` is actually called, or read it lazily\nafter pixel decoding, to avoid the seek during header parsing for callers that ignore it.","locations":[{"ref":"crates/zune-bmp/src/decoder.rs:404-436","code":"  404 |                         // NB: (cae) [tag=perf]: The main format is usually to have the profile\n  405 |                         // after pixels, so this may cause unnecessary jumps/seeks\n  406 |                         // but that's okay, as I prefer it here to confirm to the notion\n  407 |                         // that all headers are decoded after calling decode_header()\n  408 | \n  409 |                         let icc_bytes = self.bytes.peek_at(\n  410 |                             true_position.saturating_sub(current_pos) as usize,\n  411 |                             profile_size as usize\n  412 |                         );\n  413 |                         match icc_bytes {\n  414 |                             Ok(bytes) => {\n  415 |                                 if colorspace_type == PROFILE_LINKED {\n  416 |                                     // NB: (cae) [tag=bug]: The format is windows characters.\n  417 |                                     // but I don't feel like adding the encoding_rs crate\n  418 |                                     // to correctly map the characters, so those that can't\n  419 |                                     // be represented by utf-8 will be filled with the replacement\n  420 |                                     // character\n  421 | \n  422 |                                     trace!(\n  423 |                                         \"File: {}\",\n  424 |                                         alloc::string::String::from_utf8_lossy(bytes)\n  425 |                                     );\n  426 |                                 }\n  427 |                                 if colorspace_type == PROFILE_EMBEDDED {\n  428 |                                     trace!(\"Read ICC profile from BMP file\");\n  429 |                                     self.icc_bytes = Some(bytes.to_vec())\n  430 |                                 }\n  431 |                             }\n  432 |                             Err(e) => {\n  433 |                                 error!(\"Error reading ICC profile. {e:?}\");\n  434 |                             }\n  435 |                         }\n  436 |                     }","lines":33,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bmp/src/decoder.rs#L404-L436"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`load_exif_data` reads the EXIF blob one byte at a time in a loop, each iteration calling\n`self.stream.read_fixed_bytes_or_error::<1>()?[0]`, for `exif_data_length` bytes (can be megabytes).\nThis is far slower than a single `read_exact_bytes(&mut exif_bytes)` call and produces a per-byte\nfallible call overhead.","fix":"Allocate `vec![0; exif_data_length]` and read it in one `read_exact_bytes(&mut exif_bytes)` call.","locations":[{"ref":"crates/zune-heic/src/decoder.rs:645-653","code":"  645 |         if exif_data_length > 0 {\n  646 |             trace!(\"Exif data length: ({exif_data_length} bytes)\");\n  647 |             let mut exif_bytes = vec![0; exif_data_length];\n  648 |             for i in 0..exif_data_length {\n  649 |                 exif_bytes[i] = self.stream.read_fixed_bytes_or_error::<1>()?[0];\n  650 |             }\n  651 |             // STORE IT IN THE STRUCT!\n  652 |             self.exif_data = Some(exif_bytes);\n  653 |         }","lines":9,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/decoder.rs#L645-L653"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Several whole-image out-of-place operations allocate a full clone of the input\nimage purely as a destination scratch buffer, then overwrite the original with\nit (`*image = dest_image`). The clone copies all pixel data that is then fully\noverwritten, doubling peak memory and adding an unnecessary deep copy. This\npattern appears in Convolve, Median, Sobel, Scharr, SpatialOps and\nBilateralFilter.","fix":"Allocate uninitialized destination channels of the right size/depth instead of cloning the source pixel data (the source is read via src_channels, so the destination contents are irrelevant before the pass).","locations":[{"ref":"crates/zune-imageprocs/src/convolve.rs:124-159","code":"  124 |         // Pre-allocate the destination buffer\n  125 |         let mut dest_image = image.clone();\n  126 | \n  127 |         match depth.bit_type() {\n  128 |             BitType::U8 => {\n  129 |                 image.par_process_regions_out_of_place::<u8, _>(\n  130 |                     &mut dest_image,\n  131 |                     true, // ignore_alpha = true\n  132 |                     |region| {\n  133 |                         let _ = convolve_region(region, &self.weights, self.scale);\n  134 |                     },\n  135 |                 )?;\n  136 |             }\n  137 |             BitType::U16 => {\n  138 |                 image.par_process_regions_out_of_place::<u16, _>(\n  139 |                     &mut dest_image,\n  140 |                     true,\n  141 |                     |region| {\n  142 |                         let _ = convolve_region(region, &self.weights, self.scale);\n  143 |                     },\n  144 |                 )?;\n  145 |             }\n  146 |             BitType::F32 => {\n  147 |                 image.par_process_regions_out_of_place::<f32, _>(\n  148 |                     &mut dest_image,\n  149 |                     true,\n  150 |                     |region| {\n  151 |                         let _ = convolve_region(region, &self.weights, self.scale);\n  152 |                     },\n  153 |                 )?;\n  154 |             }\n  155 |             d => return Err(ImageErrors::ImageOperationNotImplemented(self.name(), d)),\n  156 |         }\n  157 | \n  158 |         // Overwrite original image with the convolved output\n  159 |         *image = dest_image;","lines":36,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/convolve.rs#L124-L159"},{"ref":"crates/zune-imageprocs/src/median.rs:110-135","code":"  110 |         // Pre-allocate the destination buffer\n  111 |         let mut dest_image = image.clone();\n  112 | \n  113 |         // Median usually ignores alpha channel\n  114 |         let ignore_alpha = true;\n  115 | \n  116 |         match depth.bit_type() {\n  117 |             BitType::U8 => {\n  118 |                 image.par_process_regions_out_of_place::<u8, _>(\n  119 |                     &mut dest_image,\n  120 |                     ignore_alpha,\n  121 |                     |region| median_region_u8(region, self.radius),\n  122 |                 )?;\n  123 |             }\n  124 |             BitType::U16 => {\n  125 |                 image.par_process_regions_out_of_place::<u16, _>(\n  126 |                     &mut dest_image,\n  127 |                     ignore_alpha,\n  128 |                     |region| median_region_u16(region, self.radius),\n  129 |                 )?;\n  130 |             }\n  131 |             d => return Err(ImageErrors::ImageOperationNotImplemented(self.name(), d)),\n  132 |         }\n  133 | \n  134 |         // Overwrite the original image\n  135 |         *image = dest_image;","lines":26,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/median.rs#L110-L135"},{"ref":"crates
