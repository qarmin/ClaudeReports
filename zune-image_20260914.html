<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`ZStatus::new` calls `CString::new(message).unwrap()`. The message comes from\narbitrary error strings (and in some paths from data influenced by inputs). If the\nmessage contains an interior NUL byte, `CString::new` returns Err and `unwrap`\npanics. This panic occurs inside functions that are called from `extern \"C\"`\nentry points (e.g. every error path of `zil_imread`, `zil_imdecode_into`, etc.),\nso it can unwind across the FFI boundary = UB.","fix":"Handle the error without unwinding, e.g. `CString::new(message).unwrap_or_else(|_|\nCString::new(\"error message contained interior nul\").unwrap())`, or sanitize the\nbytes by stripping NULs before constructing the CString.","locations":[{"ref":"crates/zune-capi/src/errno.rs:59-74","code":"   59 |     pub fn new<T>(message: T, status: ZStatusType) -> ZStatus\n   60 |     where\n   61 |         T: Into<Vec<u8>>\n   62 |     {\n   63 |         let msg = CString::new(message).unwrap();\n   64 |         let mem = unsafe { zil_malloc(msg.as_bytes_with_nul().len()) };\n   65 |         // copy to memory\n   66 |         unsafe {\n   67 |             libc::strcpy(mem.cast(), msg.as_ptr());\n   68 |         }\n   69 | \n   70 |         ZStatus {\n   71 |             status,\n   72 |             message: mem.cast()\n   73 |         }\n   74 |     }","lines":16,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/errno.rs#L59-L74"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`zil_zimg_new` does not check the result of `libc::malloc`. On allocation failure\n`malloc` returns NULL and `unsafe { *ptr = ZImage::new(...) }` writes a `ZImage`\nthrough a null pointer -> UB. The function is documented as the recommended way to\ncreate an image, so callers will assume it is robust.","fix":"Check `ptr.is_null()` after malloc and return `ptr::null_mut()` on failure before\nthe `*ptr = ...` write (mirroring the null checks done in `zil_zimg_from_u8` etc.).","locations":[{"ref":"crates/zune-capi/src/image.rs:157-162","code":"  157 | #[no_mangle]\n  158 | pub extern \"C\" fn zil_zimg_new() -> *mut ZImage {\n  159 |     let ptr = unsafe { libc::malloc(std::mem::size_of::<ZImage>()) }.cast();\n  160 |     unsafe { *ptr = ZImage::new(vec![], BitDepth::Unknown, 1, 1, ColorSpace::Unknown) };\n  161 |     ptr\n  162 | }","lines":6,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/image.rs#L157-L162"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Several FFI entry points dereference the `file`/`output_file` C string pointer via\n`CStr::from_ptr(file)` WITHOUT first checking it for null, unlike `zil_imread`\nwhich does check. Passing NULL (a normal mistake for a C caller) is immediate UB.\nAffected: `zil_imread_into` (file), `zil_read_headers_from_file` (file),\n`zil_zimg_open` (file), `zil_zimg_write_to_disk` (output_file),\n`zil_zimg_write_to_disk_with_format` (output_file).","fix":"Add `if file.is_null() { set status / return error }` (or for the void-returning\nfunctions, set status and return) before each `CStr::from_ptr` call, consistent\nwith the null check already present in `zil_imread`.","locations":[{"ref":"crates/zune-capi/src/imread.rs:134-143","code":"  134 | pub extern \"C\" fn zil_imread_into(\n  135 |     file: *const c_char, output: *mut u8, output_size: usize, width: *mut usize,\n  136 |     height: *mut usize, depth: *mut ZImageDepth, channels: *mut usize, status: *mut ZStatus,\n  137 | ) -> i64 {\n  138 |     if status.is_null() {\n  139 |         return STATUS_IS_NULL;\n  140 |     }\n  141 |     // safety: The caller is supposed to uphold this\n  142 |     let binding = unsafe { CStr::from_ptr(file) }.to_string_lossy();\n  143 |     let file_cstr = binding.as_ref();","lines":10,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/imread.rs#L134-L143"},{"ref":"crates/zune-capi/src/imread.rs:168-176","code":"  168 | pub extern \"C\" fn zil_read_headers_from_file(\n  169 |     file: *const c_char, metadata_storage: *mut ZImageMetadata, status: *mut ZStatus,\n  170 | ) -> i64 {\n  171 |     if status.is_null() {\n  172 |         return STATUS_IS_NULL;\n  173 |     }\n  174 |     // safety: The caller is supposed to uphold this\n  175 |     let binding = unsafe { CStr::from_ptr(file) }.to_string_lossy();\n  176 |     let file_cstr = binding.as_ref();","lines":9,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/imread.rs#L168-L176"},{"ref":"crates/zune-capi/src/image.rs:185-192","code":"  185 | pub extern \"C\" fn zil_zimg_open(file: *const c_char, image: *mut ZImage, status: *mut ZStatus) {\n  186 |     if image.is_null() {\n  187 |         if !status.is_null() {\n  188 |             unsafe { *status = ZStatus::new(\"Image null\", ZilImageIsNull) };\n  189 |         }\n  190 |         return;\n  191 |     }\n  192 |     let c_str = unsafe { CStr::from_ptr(file) }.to_bytes();","lines":8,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/image.rs#L185-L192"},{"ref":"crates/zune-capi/src/image.rs:255-265","code":"  255 | pub extern \"C\" fn zil_zimg_write_to_disk(\n  256 |     output_file: *const c_char, image: *const ZImage, status: *mut ZStatus\n  257 | ) {\n  258 |     if image.is_null() {\n  259 |         if !status.is_null() {\n  260 |             unsafe { *status = ZStatus::new(\"Image null\", ZilImageIsNull) };\n  261 |         }\n  262 |         return;\n  263 |     }\n  264 | \n  265 |     let c_str = unsafe { CStr::from_ptr(output_file) }.to_bytes();","lines":11,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/image.rs#L255-L265"},{"ref":"crates/zune-capi/src/image.rs:296-306","code":"  296 | pub extern \"C\" fn zil_zimg_write_to_disk_with_format(\n  297 |     output_file: *const c_char, image: *const ZImage, format: ZImageFormat, status: *mut ZStatus\n  298 | ) {\n  299 |     if image.is_null() {\n  300 |         if !status.is_null() {\n  301 |             unsafe { *status = ZStatus::new(\"Image null\", ZilImageIsNull) };\n  302 |         }\n  303 |         return;\n  304 |     }\n  305 | \n  306 |     let c_str = unsafe { CStr::from_ptr(output_file) }.to_bytes();","lines":11,"link": {"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`zil_free` asserts that the pointer is non-null with `assert!(!ptr.is_null(), ...)`.\nThis panic unwinds across the `extern \"C\"` boundary, which is undefined behaviour.\nIt also contradicts the very next line `if !ptr.is_null()`, which implies null was\nmeant to be tolerated. Many C `free`-style APIs are expected to accept NULL as a\nno-op; here passing NULL aborts/UB instead.","fix":"Drop the `assert!`. Just keep the `if !ptr.is_null() { libc::free(ptr) }` guard so\nthat freeing a null pointer is a harmless no-op, matching C `free` semantics and\navoiding an unwind across FFI.","locations":[{"ref":"crates/zune-capi/src/utils.rs:47-53","code":"   47 | pub unsafe extern \"C\" fn zil_free(ptr: *mut c_void) {\n   48 |     assert!(!ptr.is_null(), \"Trying to free a null ptr!!\");\n   49 |     if !ptr.is_null() {\n   50 |         unsafe { libc::free(ptr) };\n   51 |         // set it to be null\n   52 |     }\n   53 | }","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/utils.rs#L47-L53"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`decode_pps` allows `pps_id` up to 63 (`HEVC_MAX_PPS_COUNT = 64`, checked with `pps_id >= 64`), but\n`HevcDecoder::pps_storage` is only 16 entries long (`vec![None; 16]`). In `hevc_decoder.rs` the\nreturned pps id is used directly as an index: `self.pps_storage[pps_id] = Some(pps)` and\n`self.pps_storage[pps_id] = Some(pps)` in `parse_extradata`. A malformed HEVC PPS NAL with a\npps_id in 16..=63 indexes out of bounds and panics on attacker-controlled input.","fix":"Either size `pps_storage` to 64 entries, or reject pps_id >= pps_storage.len() before indexing, or\nuse `pps_storage.get_mut(pps_id)` and return a NalError on None. The cleanest fix is to cap\nHEVC_MAX_PPS_COUNT to the actual storage length (and likewise verify sps_id/vps_id against storage\nlength).","locations":[{"ref":"crates/zune-heic/src/hevc_decoder.rs:95-99","code":"   95 |                 NalUnitType::PpsNut => {\n   96 |                     let pps = decode_pps(&nal, &self.sps_storage)?;\n   97 |                     let pps_id = pps.pps_id as usize;\n   98 |                     self.pps_id = pps.pps_id as usize;\n   99 |                     self.pps_storage[pps_id] = Some(pps);","lines":5,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder.rs#L95-L99"},{"ref":"crates/zune-heic/src/hevc_decoder.rs:164-167","code":"  164 |                 NalUnitType::PpsNut => {\n  165 |                     let pps = decode_pps(&nal, &self.sps_storage)?;\n  166 |                     let pps_id = pps.pps_id as usize;\n  167 |                     self.pps_storage[pps_id] = Some(pps);","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder.rs#L164-L167"},{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers/pps.rs:13-32","code":"   13 |     const HEV {"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `HevcDecoder::decode`, when a VCL NAL is encountered the decoder fetches the active SPS via\n`self.sps_storage.iter().find_map(...).expect(\"Stream Error: VCL NAL encountered before any SPS\nwas loaded!\")`. A malformed bitstream that emits a slice NAL before any SPS panics. Untrusted\ninput must not be able to trigger `.expect()`.","fix":"Replace the `.expect()` with `.ok_or(NalError::GenericStr(\"VCL NAL before SPS\"))?` and propagate\nthe error out of the visitor closure.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder.rs:104-127","code":"  104 |                 nal_type if (nal_type as u8) <= 31 => {\n  105 |                     if raw_frame.is_none() {\n  106 |                         // We need the SPS to know the resolution.\n  107 |                         // TODO: Get the raw sps_id\n  108 |                         let active_sps =\n  109 |                             self.sps_storage.iter().find_map(|sps| sps.as_ref()).expect(\n  110 |                                 \"Stream Error: VCL NAL encountered before any SPS was loaded!\"\n  111 |                             );\n  112 | \n  113 |                         let units_w = active_sps.pic_width_in_luma_samples as usize;\n  114 |                         let units_h = active_sps.pic_height_in_luma_samples as usize;\n  115 | \n  116 |                         // Spin up the fresh pixel buffer and tracker for this frame!\n  117 |                         raw_frame = Some(RawFrame::from_sps(active_sps));\n  118 | \n  119 |                         self.neighbor_tracker = Some(NeighborTracker::new(units_w, units_h, 2));\n  120 |                     }\n  121 | \n  122 |                     if let Some(f) = raw_frame.clone() {\n  123 |                         decode_slice(&nal, self, &f)?;\n  124 |                     } else {\n  125 |                         return Err(NalError::Generic(\"No raw frame allocated\".to_string()));\n  126 |                     }\n  127 |                 }","lines":24,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder.rs#L104-L127"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`parse_scaling_list_data` computes `ref_matrix_id = matrix_id - pred_matrix_id_delta` using\nunchecked `usize` subtraction, where `pred_matrix_id_delta = r.read_ue()? as usize` is\nattacker-controlled. If `pred_matrix_id_delta > matrix_id`, this underflows and the subsequent\n`sl.size0[ref_matrix_id]` (etc.) indexing panics. Reachable from both SPS and PPS scaling-list\ndata on malformed input.","fix":"Use `matrix_id.checked_sub(pred_matrix_id_delta)` and return a NalError when None, or validate\n`pred_matrix_id_delta <= matrix_id` before subtracting.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers.rs:130-148","code":"  130 |             } else {\n  131 |                 // Prediction Mode: Copy from a previous matrix\n  132 |                 let pred_matrix_id_delta = r.read_ue()? as usize;\n  133 |                 let ref_matrix_id = matrix_id - pred_matrix_id_delta;\n  134 | \n  135 |                 match size_id {\n  136 |                     0 => sl.size0[matrix_id] = sl.size0[ref_matrix_id],\n  137 |                     1 => sl.size1[matrix_id] = sl.size1[ref_matrix_id],\n  138 |                     2 => {\n  139 |                         sl.size2[matrix_id] = sl.size2[ref_matrix_id];\n  140 |                         sl.dc16[matrix_id] = sl.dc16[ref_matrix_id];\n  141 |                     }\n  142 |                     3 => {\n  143 |                         sl.size3[matrix_id] = sl.size3[ref_matrix_id];\n  144 |                         sl.dc32[matrix_id] = sl.dc32[ref_matrix_id];\n  145 |                     }\n  146 |                     _ => unreachable!()\n  147 |                 }\n  148 |             }","lines":19,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/nal_unit_parsers.rs#L130-L148"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`parse_short_term_ref_pic_set` writes `num_delta_pocs[st_rps_idx]` and reads\n`num_delta_pocs[ref_rps_idx]`, where `num_delta_pocs` is a fixed `[0usize; 65]` array in\n`decode_sps`. `num_short_term_ref_pic_sets` comes from `r.read_ue()?` and is NOT bounds-checked\nbefore the loop `for i in 0..(sps.num_short_term_ref_pic_sets as usize)`. A value > 64 makes\n`st_rps_idx` exceed 64 and panics on `num_delta_pocs[st_rps_idx]`. Additionally\n`ref_rps_idx = st_rps_idx - 1 - delta_idx_minus1` is an unchecked `usize` subtraction that can\nunderflow and panic when indexing `num_delta_pocs[ref_rps_idx]`.","fix":"Validate `num_short_term_ref_pic_sets <= 64` in decode_sps (spec max is 64) and return\nParameterOutOfRange otherwise. In parse_short_term_ref_pic_set, validate that\n`st_rps_idx >= 1 + delta_idx_minus1` before computing ref_rps_idx, returning a NalError on\nmalformed deltas.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers/sps.rs:189-201","code":"  189 |     sps.num_short_term_ref_pic_sets = r.read_ue()?;\n  190 | \n  191 |     // Track POC deltas across loop iterations for inter-RPS prediction\n  192 |     let mut num_delta_pocs = [0usize; 65];\n  193 | \n  194 |     for i in 0..(sps.num_short_term_ref_pic_sets as usize) {\n  195 |         parse_short_term_ref_pic_set(\n  196 |             &mut r,\n  197 |             i,\n  198 |             sps.num_short_term_ref_pic_sets as usize,\n  199 |             &mut num_delta_pocs\n  200 |         )?;\n  201 |     }","lines":13,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/nal_unit_parsers/sps.rs#L189-L201"},{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers.rs:154-202","code":"  154 | fn parse_short_term_ref_pic_set(\n  155 |     r: &mut BitReader, st_rps_idx: usize, num_short_term_ref_pic_sets: usize,\n  156 |     num_delta_pocs: &mut [usize]\n  157 | ) -> Result<(), NalError> {\n  158 |     let mut inter_ref_pic_set_prediction_flag = false;\n  159 | \n  160 |     if st_rps_idx != 0 {\n  161 |         inter_ref_pic_set_prediction_flag = r.read_flag()?;\n  162 |     }\n  163 | \n  164 |     if inter_ref_pic_set_prediction_flag {\n  165 |         let mut delta_idx_minus1 = 0;\n  166 |         if st_rps_idx == num_short_term_ref_pic_sets {\n  167 |             delta_idx_minus1 = r.read_ue()? as usize;\n  168 |         }\n  169 |         let _sign_data_rps_minus1 = r.read_flag()?;\n  170 |         let _abs_delta_rps_minus1 = r.read_ue()?;\n  171 | \n  172 |         let ref_rps_idx = st_rps_idx - 1 - delta_idx_minus1;\n  173 |         let mut current_delta_pocs = 0;\n  174 | \n  175 |         for _ in 0..=num_delta_pocs[ref_rps_idx] {\n  176 |             let used_by_curr_pic_flag = r.read_flag()?;\n  177 |             let mut use_delta_flag = false;\n  178 |             if !used_by_curr_pic_flag {\n  179 |                 use_delta_flag = r.read_flag()?;\n  180 |             }\n  181 |             if used_by_curr_pic_flag || use_delta_flag {\n  182 |                 current_delta_pocs += 1;\n  183 |             }\n  184 |         }\n  185 |         num_delta_pocs[st_rps_idx] = current_delta_pocs;\n  186 |     } else {\n  187 |         let num_negative_pics = r.read_ue()? as usize;\n  188 |         let num_positive_pics = r.read_ue()? as usize;\n  189 | \n  190 |         for _ in 0..num_negative_pics {\n  191 |             r.read_ue()?; // delta_poc_s0_minus1\n  192 |             r.read_flag()?; // used_by_curr_pic_s0_flag\n  193 |         }\n  194 |         for _ in 0..num_positive_pics {\n  195 |             r.read_ue()?; // delta_poc_s1_minus1\n  196 |             r.read_flag()?; // used_by_curr_pic_s1_flag\n  197 |         }\n  198 |         num_delta_pocs[st_rps_idx] = num_negative_pics + num_positive_pics;\n  199 |     }\n  200 | \n  201 |     Ok(())\n  202 | }","l {"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`HevcDecoder::decode` reaches `todo!()` / `unimplemented` paths for any non-intra coding. In\n`read_coding_unit`, a CU with the skip flag set hits `todo!(\"Inter decoding\")`, and a non-intra\nprediction mode hits `todo!()`. PCM blocks hit `todo!()`. `finish_ctu` hits `todo!()` whenever\n`pps.tiles_enabled_flag` is set. A malformed HEIC tile whose slice header decodes to a P/B slice,\nor that enables tiles/PCM, will panic instead of returning an error. Since the decoder parses\nuntrusted input, any of these is a denial-of-service panic.","fix":"Replace each `todo!()` with `return Err(NalError::GenericStr(\"inter/PCM/tiles not supported\"))`\n(or equivalent) so unsupported but well-formed streams fail gracefully rather than aborting the\nprocess.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/quadtree/coding_unit.rs:96-102","code":"   96 |     if ctx.is_skip {\n   97 |         ctx.is_intra = false;\n   98 |         ctx.neighbor_tracker\n   99 |             .set_pred_mode(x0, y0, log_2_cb_size, PredMode::ModeSkip);\n  100 |         todo!(\"Inter decoding\");\n  101 |         //return Ok(());\n  102 |     }","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/quadtree/coding_unit.rs#L96-L102"},{"ref":"crates/zune-heic/src/hevc_decoder/quadtree/coding_unit.rs:135-137","code":"  135 |         if pcm_flag {\n  136 |             // read_pcm_samples(...)\n  137 |             todo!();","lines":3,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/quadtree/coding_unit.rs#L135-L137"},{"ref":"crates/zune-heic/src/hevc_decoder/quadtree/coding_unit.rs:180-183","code":"  180 |     } else {\n  181 |         // Inter Prediction Units (MVs, Merges, etc.)\n  182 |         todo!();\n  183 |     }","lines":4,"li {"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`resample_region_u8` unconditionally unwraps both kernel directions:\n`kernels.horizontal.as_ref().unwrap()` and `kernels.vertical.as_ref().unwrap()`.\n`PrecomputedKernels::new_separated_kernels` sets a direction to `None` whenever\nthe input and output sizes for that axis are equal (in_width == out_width or\nin_height == out_height). So resizing a U8 image where only one dimension\nchanges (e.g. `ResizeDimensions::IgnoreAspectRatio(new_w, old_h)`, or any\nWidthOnly/HeightOnly that leaves the other axis unchanged) panics. The generic\n(u16/f32) path `resample_region_generic` handles all four None/Some\ncombinations correctly, so this is a U8-only copy/paste regression.","fix":"Mirror the four-case dispatch from resample_region_generic (vertical-only, horizontal-only, both, neither) in resample_region_u8 instead of unwrapping both kernels.","locations":[{"ref":"crates/zune-imageprocs/src/resize/seperable_kernel.rs:296-375","code":"  296 | pub fn resample_region_u8(\n  297 |     region: &mut PlanarRegionMut<'_, u8>, src_channels: &[&[u8]], in_width: usize,\n  298 |     kernels: &PrecomputedKernels,\n  299 | ) {\n  300 |     let out_width = region.width;\n  301 |     let h_kernels = kernels.horizontal.as_ref().unwrap();\n  302 |     let v_kernels = kernels.vertical.as_ref().unwrap();\n  303 | \n  304 |     let max_v_taps = v_kernels\n  305 |         .iter()\n  306 |         .map(|k| (k.end_idx - k.start_idx + 1) as usize)\n  307 |         .max()\n  308 |         .unwrap_or(1);\n  309 |     let special_div = crate::mathops::compute_mod_u32(max_v_taps as u64);\n  310 | \n  311 |     let mut ring_buffer = vec![0_i32; max_v_taps * out_width];\n  312 |     let mut buffer_contents = vec![usize::MAX; max_v_taps];\n  313 |     let mut row_accumulator = vec![0_i64; out_width];\n  314 | \n  315 | \n  316 |     for (src_ch, dest_ch) in src_channels.iter().zip(region.channel {"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`probe_input_files` is riddled with `unwrap()` on fallible operations driven by\nuser-supplied paths/files: `File::open(in_file).unwrap()` (TOCTOU between the\n`exists()` check and the open - a removed/permission-denied file panics),\n`contents.get_ref().metadata().unwrap().len()`,\n`format.decoder_with_options(...).unwrap()`, and\n`serde_json::to_string_pretty(...).unwrap()`. Any of these can abort the program\nwith a panic on perfectly ordinary inputs (e.g. an unreadable file).","fix":"Replace the `unwrap()`s with proper error handling: propagate or log-and-continue\nper file. At minimum, handle `File::open` and `metadata()` errors gracefully so a\nsingle bad path does not crash the whole probe run.","locations":[{"ref":"crates/zune-bin/src/probe_files.rs:20-50","code":"   20 | pub fn probe_input_files(args: &ArgMatches) {\n   21 |     if let Some(view) = args.value_source(\"probe\") {\n   22 |         if view == CommandLine {\n   23 |             for in_file in args.get_raw(\"in\").unwrap() {\n   24 |                 if PathBuf::from(in_file).exists() {\n   25 |                     let file = BufReader::new(File::open(in_file).unwrap());\n   26 | \n   27 |                     if let Some((format, contents)) =\n   28 |                         zune_image::codecs::ImageFormat::guess_format(file)\n   29 |                     {\n   30 |                         let size = contents.get_ref().metadata().unwrap().len();\n   31 |                         // set to high to remove restrictions.\n   32 |                         // We'll just be reading headers so it doesn't matter\n   33 |                         let options = DecoderOptions::new_cmd()\n   34 |                             .set_max_height(usize::MAX)\n   35 |                             .set_max_width(usize::MAX);\n   36 | \n   37 |                         let mut decoder = format.decoder_with_options(contents, options).unwrap();\n   38 | \n   39 |                         if let Ok(Some(metadata)) = decoder.read_headers() {\n   40 |                             let real_metadata =\n   41 |                                 Metadata::new(in_file.to_os_string(), size, &metadata);\n   42 | \n   43 |                             println!(\"{}\", serde_json::to_string_pretty(&real_metadata).unwrap());\n   44 |                         }\n   45 |                     }\n   46 |                 }\n   47 |             }\n   48 |         }\n   49 |     }\n   50 | }","lines":31,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bin/src/probe_files.rs#L20-L50"}]},

{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`handle_grid_items` indexes `grid_item.extents[0]` without checking the extents vector is\nnon-empty. A `grid` primary item whose iloc entry has zero extents panics. (Contrast with\n`load_exif_data`, which correctly checks `extents.is_empty()` first.)","fix":"Check `grid_item.extents.is_empty()` and return a HeicErrors before indexing `extents[0]`.","locations":[{"ref":"crates/zune-heic/src/decoder.rs:245-259","code":"  245 |         let item_type = self.get_item_type(pitm.item_id);\n  246 |         if &item_type == b\"grid\" {\n  247 |             self.is_grid = true;\n  248 |             let extent = &grid_item.extents[0];\n  249 |             let mut final_offset = grid_item.base_offset + extent.offset;\n  250 | \n  251 |             // Construction Method 1 means the offset is relative to the 'idat' box\n  252 |             if grid_item.construction_method == 1 {\n  253 |                 let idat_offset = meta.idat.as_ref().ok_or(HeicErrors::Generic {\n  254 |                     msg: \"Item uses idat construction but idat box not found\".into(),\n  255 |                 })?;\n  256 |                 final_offset += idat_offset.position;\n  257 |             }\n  258 | \n  259 |             self.stream.seek(ZSeekFrom::Start(final_offset))?;","lines":15,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/decoder.rs#L245-L259"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`decode_slice_header` computes `address_length = (pic_size_in_ctbs_y as f64).log2().ceil() as u8`\nand then calls `r.get_bits(address_length)?`. For a 1-CTB picture, `log2(1) == 0`, so\n`get_bits(0)` is called; `get_bits` does `self.buffer >> (64 - 0)` i.e. a shift by 64 which is\nundefined for u64 and panics in debug builds (the `shift = 64u64.saturating_sub(0)` saturates to\n64, then `>> 64`). The same pattern is used for `num_bits` from `num_short_term_ref_pic_sets`.\nMore generally `get_bits`/`peek_bits` have `debug_assert!(n > 0 && n <= 56)` but n can exceed 56\n(e.g. `log2_max_pic_order_cnt_lsb` derives from `read_ue()+4` and is fed to\n`r.get_bits(sps.log2_max_pic_order_cnt_lsb)`), so a large attacker-controlled value triggers a\ndebug-assert panic and a wrong shift in release.","fix":"Guard against zero-length and oversized bit reads: skip get_bits when the computed length is 0,\nand clamp/validate any read length to 1..=32 (the max for these syntax elements). Validate\n`log2_max_pic_order_cnt_lsb` (spec range 4..=16) right after parsing in decode_sps.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers.rs:413-447","code":"  413 |     if !sh.first_slice_segment_in_pic_flag {\n  414 |         if pps.dependent_slice_segments_enabled_flag {\n  415 |             sh.dependent_slice_segment_flag = r.read_flag()?;\n  416 |         }\n  417 |         let pic_size_in_ctbs_y = sps.pic_width_in_ctbs_y * sps.pic_height_in_ctbs_y;\n  418 |         let address_length = (pic_size_in_ctbs_y as f64).log2().ceil() as u8;\n  419 |         sh.slice_segment_address = r.get_bits(address_length)?;\n  420 |     }\n  421 | \n  422 |     if !sh.dependent_slice_segment_flag {\n  423 |         if pps.num_extra_slice_header_bits > 0 {\n  424 |             r.get_bits(pps.num_extra_slice_header_bits)?;\n  425 |         }\n  426 | \n  427 |         sh.slice_type = SliceType::try_from(r.read_ue()?)?;\n  428 | \n  429 |         if pps.output_flag_present_flag {\n  430 |             let _pic_output_flag = r.read_flag()?;\n  431 |         }\n  432 | \n  433 |         if sps.separate_color_plane_flag {\n  434 |             let _colour_plane_id = r.get_bits(2);\n  435 |         }\n  436 | \n  437 |         // 5. POC LSB (Skipped for IDR, present for CRA/Trailing)\n  438 |         if !is_idr {\n  439 |             sh.slice_pic_order_cnt_lsb = r.get_bits(sps.log2_max_pic_order_cnt_lsb)?;\n  440 | \n  441 |             let short_term_ref_pic_set_sps_flag = r.read_flag()?;\n  442 |             if !short_term_ref_pic_set_sps_flag {\n  443 |                 // Inline RPS parsing would go here\n  444 |             } else if sps.num_short_term_ref_pic_sets > 1 {\n  445 |                 let num_bits = (sps.num_short_term_ref_pic_sets as f64).log2().ceil() as u8;\n  446 |                 r.get_bits(num_bits)?;\n  447 |             }","lines":35,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/nal_unit_parsers.rs#L413-L447"},{"ref":"crates/zune-heic/src/hevc_decoder/bitstream.rs:149-165","code":"  149 |     #[inline(always)]\n  150 |     pub fn get_bits(&mut self, n: u8) -> Result<u64, &'static str> {\n  151 |         debug_assert!(n > 0 && n <= 56);\n  152 |         if self.bits_left < n {\n  153 |             self.refill();\n  154 |         }\n  155 | \n  156 |         if self.bits_left < n {\n  157 |             return Err(\"BitReader exhausted\");\n  158 |         }\n  159 | \n  160 |         let shift = 64_u64.saturating_sub(u64::from(n));\n  161 |         let val = self.buffer >> shift;\n  162 |         self.buffer <<= n;\n  163 |         self.bits_left = self.bits_left.saturating_sub(n);\n  164 |         Ok(val)\n  165 |     }","lines":17,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/bitstream.rs#L149-L165"},{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers/sps.rs:132","code":"  132 |     sps.log2_max_pic_order_cnt_lsb = (r.read_ue()? as u8) + 4;","lines":1,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/nal_unit_parsers/sps.rs#L132"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`derive_tile_id_map` builds `col_bd`/`row_bd` boundaries from the non-uniform tile widths\n(`pps.column_width[i]`, `pps.row_height[j]`), accumulating without verifying they sum to the\npicture size: `col_bd[i+1] = col_bd[i] + pps.column_width[i]`. The widths come straight from\n`read_ue()? + 1` in decode_pps with no validation that the totals stay within\n`pic_width_in_ctbs` / `pic_height_in_ctbs`. The fill loop then writes\n`pps.tile_id_rs[y * pic_width_in_ctbs + x]` for x in `col_bd[i]..col_bd[i+1]`; if a column width\noverruns, `addr_rs` exceeds `tile_id_rs.len()` (sized `total_ctbs`) and panics with an\nout-of-bounds write index. (Note: this is currently only reachable if the tiles path is ever\nexercised, but the map is built unconditionally in decode_pps.)","fix":"Validate that the sum of column widths < pic_width_in_ctbs and the sum of row heights <\npic_height_in_ctbs while parsing (and that num_tile_columns/num_tile_rows are within picture\nbounds), returning a NalError on violation. Clamp col_bd/row_bd entries to the picture size before\nindexing tile_id_rs.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers/pps.rs:326-380","code":"  326 | pub fn derive_tile_id_map(pps: &mut Pps, sps: &Sps) {\n  327 |     let pic_width_in_ctbs = sps.pic_width_in_ctbs_y as usize;\n  328 |     let pic_height_in_ctbs = sps.pic_height_in_ctbs_y as usize;\n  329 |     let total_ctbs = pic_width_in_ctbs * pic_height_in_ctbs;\n  330 | \n  331 |     // Initialize the buffer\n  332 |     pps.tile_id_rs = vec![0; total_ctbs];\n  333 | \n  334 |     if !pps.tiles_enabled_flag {\n  335 |         return; // All CTBs stay ID 0\n  336 |     }\n  337 | \n  338 |     // 1. Calculate tile column boundaries\n  339 |     let mut col_bd = vec![0; (pps.num_tile_columns + 1) as usize];\n  340 |     if pps.uniform_spacing_flag {\n  341 |         for i in 0..=pps.num_tile_columns as usize {\n  342 |             col_bd[i] = i * pic_width_in_ctbs / pps.num_tile_columns as usize;\n  343 |         }\n  344 |     } else {\n  345 |         col_bd[0] = 0;\n  346 |         for i in 0..pps.num_tile_columns as usize - 1 {\n  347 |             col_bd[i + 1] = col_bd[i] + pps.column_width[i] as usize;\n  348 |         }\n  349 |         col_bd[pps.num_tile_columns as usize] = pic_width_in_ctbs;\n  350 |     }\n  351 | \n  352 |     // 2. Calculate tile row boundaries\n  353 |     let mut row_bd = vec![0; (pps.num_tile_rows + 1) as usize];\n  354 |     if pps.uniform_spacing_flag {\n  355 |         for j in 0..=pps.num_tile_rows as usize {\n  356 |             row_bd[j] = j * pic_height_in_ctbs / pps.num_tile_rows as usize;\n  357 |         }\n  358 |     } else {\n  359 |         row_bd[0] = 0;\n  360 |         for j in 0..pps.num_tile_rows as usize - 1 {\n  361 |             row_bd[j + 1] = row_bd[j] + pps.row_height[j] as usize;\n  362 |         }\n  363 |         row_bd[pps.num_tile_rows as usize] = pic_height_in_ctbs;\n  364 |     }\n  365 | \n  366 |     // 3. Fill the tile_id_rs map\n  367 |     for j in 0..pps.num_tile_rows as usize {\n  368 |         for i in 0..pps.num_tile_columns as usize {\n  369 |             let tile_id = (j * pps.num_tile_columns as usize + i) as u16;\n  370 | \n  371 |             // For every CTB within this tile's boundaries\n  372 |             for y in row_bd[j]..row_bd[j + 1] {\n  373 |                 for x in col_bd[i]..col_bd[i + 1] {\n  374 |                     let addr_rs = y * pic_width_in_ctbs + x;\n  375 |                     pps.tile_id_rs[addr_rs] = tile_id;\n  376 |                 }\n  377 |             }\n  378 |         }\n  379 |     }\n  380 | }","lines":55,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/nal_unit_parsers/pps.rs#L326-L380"},{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers/pps.rs:111-127","code":"  111 |     if pps.tiles_enabled_flag {\n  112 |         pps.num_tile_columns = r.read_ue()? + 1;\n  113 |         pps.num_tile_rows = r.read_ue()? + 1;\n  114 |         pps.uniform_spacing_flag = r.read_flag()?;\n  115 | \n  116 |         if !pps.uniform_spacing_flag {\n  117 |             pps.column_width.reserve(pps.num_tile_columns as _);\n  118 |             pps.row_height.reserve(pps.num_tile_rows as _);\n  119 | \n  120 |             for _ in 0..(pps.num_tile_columns - 1) {\n  121 |                 pps.column_width.push(r.read_ue()? + 1);\n  122 |             }\n  123 |             for _ in 0..(pps.num_tile_rows - 1) {\n  124 |                 pps.row_height.push(r.read_ue()? + 1);\n  125 |             }\n  126 |         }\n  127 |         pps.loop_filter_across_tiles_enabled_flag = r.read_flag()?;","lines":17,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/nal_unit_parsers/pps.rs#L111-L127"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`decode_slice` unwraps several Options/Results that are derived from attacker-controlled NAL data.\n`pps_storage.get(...).ok_or(...)?.as_ref().unwrap()` will panic if the slot exists but is None,\nand `sps_storage[pps.sps_id as usize].as_ref().unwrap()` indexes and unwraps without checking the\nslot is populated. `hevc_decoder.neighbor_tracker.as_mut().unwrap()` panics if no tracker was set\nup (e.g. SPS not seen). These are reachable when parameter-set ids are inconsistent across NALs.","fix":"Use the same ok_or/`?` pattern already used in decode_slice_header: replace each `.unwrap()` with\na proper NalError, and bounds-check `pps.sps_id` against `sps_storage.len()` before indexing.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/quadtree.rs:43-53","code":"   43 |     let pps = pps_storage\n   44 |         .get(slice_header.slice_pic_parameter_set_id as usize)\n   45 |         .ok_or_else(|| {\n   46 |             NalError::Generic(format!(\n   47 |                 \"no pps found for slice header {}\",\n   48 |                 slice_header.slice_pic_parameter_set_id\n   49 |             ))\n   50 |         })?\n   51 |         .as_ref()\n   52 |         .unwrap();\n   53 |     let sps = sps_storage[pps.sps_id as usize].as_ref().unwrap();","lines":11,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/quadtree.rs#L43-L53"},{"ref":"crates/zune-heic/src/hevc_decoder/quadtree.rs:88-100","code":"   88 |     // 4. Update the existing Neighbor Tracker\n   89 |     let neighbor_tracker = hevc_decoder.neighbor_tracker.as_mut().unwrap();\n   90 | \n   91 |     let mut ctx = DecodeSliceContext::new(\n   92 |         sps,\n   93 |         pps,\n   94 |         &slice_header,\n   95 |         cabac,\n   96 |         neighbor_tracker,\n   97 |         //&mut hevc_decoder.neighbor_tracker, // Borrow the persistent tracker\n   98 |         slice_qp,\n   99 |         &raw_frame.clone()\n  100 |     );","lines":13,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/quadtree.rs#L88-L100"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`stitch` divides by `self.cols` (`index % (self.cols as usize)`, `index / (self.cols as usize)`)\nwithout verifying `cols != 0`. For a non-grid image, `handle_grid_items` sets rows/cols to 1, but\nfor a grid image `cols = stream.read_u8() + 1` so it is >= 1; however if the grid branch is taken\nwith malformed data and cols ends up 0 via some path, or if stitch is called when cols was never\nset (default 0), this is a divide-by-zero panic. Also the stitch copy uses\n`target_canvas[dst..dst+len].copy_from_slice(&tile_data.pixels[src..src+len])` where `src`/`dst`\nare derived from tile dimensions that come from the decoded SPS, not validated against the grid's\ndeclared width/height; mismatched tile sizes can index out of bounds of `tile_data.pixels`.","fix":"Guard `self.cols == 0` (and rows) before the modulo/division and return an error. Bounds-check the\nsource slice (`src + len <= tile_data.pixels.len()`) and destination against the canvas length\nbefore copy_from_slice instead of relying on tile dimensions matching expectations.","locations":[{"ref":"crates/zune-heic/src/processor.rs:425-465","code":"  425 |         for (index, &item_id) in self.ordered_tile_ids.iter().enumerate() {\n  426 |             if let Some(Ok(tile_data)) = tiles.get(&item_id) {\n  427 |                 let tile_w = tile_data.width;\n  428 |                 let tile_h = tile_data.height;\n  429 | \n  430 |                 let col = index % (self.cols as usize);\n  431 |                 let row = index / (self.cols as usize);\n  432 | \n  433 |                 // Use the DYNAMIC tile width/height!\n  434 |                 let base_x = col * tile_w;\n  435 |                 let base_y = row * tile_h;\n  436 | \n  437 |                 let tile_stride = tile_w * channels;\n  438 |                 let grid_stride = unrotated_w * channels;\n  439 | \n  440 |                 for ty in 0..tile_h {\n  441 |                     let canvas_y = base_y + ty;\n  442 | \n  443 |                     // Crop bounds if tiles overflow the final target resolution\n  444 |                     if canvas_y >= unrotated_h {\n  445 |                         break;\n  446 |                     }\n  447 |                     if base_x >= unrotated_w {\n  448 |                         continue;\n  449 |                     }\n  450 | \n  451 |                     let copy_width = tile_w.min(unrotated_w - base_x);\n  452 |                     let len = copy_width * channels;\n  453 | \n  454 |                     let src = ty * tile_stride;\n  455 |                     let dst = canvas_y * grid_stride + base_x * channels;\n  456 | \n  457 |                     target_canvas[dst..dst + len]\n  458 |                         .copy_from_slice(&tile_data.pixels[src..src + len]);\n  459 |                 }\n  460 |             } else {\n  461 |                 return Err(HeicErrors::Generic {\n  462 |                     msg: format!(\"Tile missing or errored: {item_id}\")\n  463 |                 });\n  464 |             }\n  465 |         }","lines":41,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/processor.rs#L425-L465"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Image::pixels` (the public pixel iterator constructor) indexes `self.frames[0]`\ndirectly. An `Image` constructed via `Image::new_frames(vec![], ...)` (or one whose\nframes were drained) has no frames, so this panics with an out-of-bounds index rather\nthan returning an error. Several other public methods also assume `frames[0]` exists\n(e.g. `to_u8`/`flatten_frames` paths). Given `pixels` returns a `Result`, an empty\nimage should produce an error, not a panic.","fix":"Use `self.frames.first().ok_or(...)` (or return an empty iterator) instead of\n`self.frames[0]`.","locations":[{"ref":"crates/zune-image/src/iters.rs:127-149","code":"  127 |     pub fn pixels<T>(&self) -> Result<PixelIterator<'_, T>, ChannelErrors>\n  128 |     where\n  129 |         T: ZuneInts<T> + Default + Copy + 'static + Pod,\n  130 |     {\n  131 |         let colorspace = self.colorspace();\n  132 |         let (width, height) = self.dimensions();\n  133 | \n  134 |         let frame = &self.frames[0];\n  135 |         let mut channels: [&[T]; MAX_CHANNELS] = [&[]; MAX_CHANNELS];\n  136 | \n  137 |         for (pos, channel) in frame.channels_ref(colorspace, false).iter().enumerate() {\n  138 |             channels[pos] = channel.reinterpret_as::<T>()?;\n  139 |         }\n  140 | \n  141 |         Ok(PixelIterator {\n  142 |             channels,\n  143 |             width,\n  144 |             components: colorspace.num_components(),\n  145 |             current_pos: 0,\n  146 |             pixel: [T::default(); MAX_CHANNELS],\n  147 |             total_pixels: width * height,\n  148 |         })\n  149 |     }","lines":23,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/iters.rs#L127-L149"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`BitStreamReader::refill_slow` (one-shot deflate path) slices `&self.src[self.position..]`\nwith no bounds guard. If `self.position > self.src.len()` this panics with an\nout-of-range slice. The streaming variant in streaming_bitstream.rs:70 was written\ndefensively as `src.get(self.position..).unwrap_or(&[])`, but the one-shot reader was\nnot. `position` is advanced unchecked in several places - most notably after an\nuncompressed deflate block where `start_deflate_block_inner` sets\n`self.stream.position = len + (self.stream.position - (bits_left>>3))` (decoder.rs:659).\nFor a crafted stored block near the end of the input this can push `position` past\n`src.len()`, so the next `refill()` -> `get(position..position+8)` returns `None` ->\n`refill_slow` indexes out of range and panics on malformed input.","fix":"Mirror the streaming reader: in `refill_slow` use\n`let bytes = self.src.get(self.position..).unwrap_or(&[]);` so an over-advanced position\nyields an empty slice (and, for non-final streams, simply stops refilling) instead of\npanicking.","locations":[{"ref":"crates/zune-inflate/src/bitstream.rs:70-92","code":"   70 |     #[inline(never)]\n   71 |     fn refill_slow(&mut self) {\n   72 |         let bytes = &self.src[self.position..];\n   73 | \n   74 |         for byte in bytes {\n   75 |             if self.bits_left >= 56 {\n   76 |                 break;\n   77 |             }\n   78 | \n   79 |             self.buffer |= u64::from(*byte) << self.bits_left;\n   80 |             self.bits_left += 8;\n   81 |             self.position += 1;\n   82 |         }\n   83 | \n   84 |         // ONLY pad with dummy zeros if we are absolutely sure\n   85 |         // there is no more data coming.\n   86 |         if self.is_final {\n   87 |             while self.bits_left < 56 {\n   88 |                 self.bits_left += 8;\n   89 |                 self.over_read += 1;\n   90 |             }\n   91 |         }\n   92 |     }","lines":23,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-inflate/src/bitstream.rs#L70-L92"},{"ref":"crates/zune-inflate/src/decoder.rs:653-657","code":"  653 |                 // get the new position to write.\n  654 |                 self.stream.position =\n  655 |                     len + (self.stream.position - usize::from(self.stream.bits_left >> 3));\n  656 | \n  657 |                 self.stream.reset();","lines":5,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-inflate/src/decoder.rs#L653-L657"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The AVX2 IDCT `permute_store!` macro and the zero-AC fast-path `store!` macro use `out_vector.get_mut($index..$index+8).unwrap()`, which panics if the output channel slice is shorter than required. The scalar `idct_int`/`idct4x4` instead use `get_mut(..).unwrap_or(&mut tmp)` and silently absorb short buffers, so the AVX2 path diverges and can panic on the same malformed input the scalar path tolerates.","fix":"Mirror the scalar fallback (write to a local scratch when the destination range is out of bounds) so all IDCT variants behave identically and none panic on truncated/garbled component buffers.","locations":[{"ref":"crates/zune-jpeg/src/idct/avx2.rs:56-75","code":"   56 |         // store first vector\n   57 |         _mm_storeu_si128(\n   58 |             ($out)\n   59 |                 .get_mut($index..$index + 8)\n   60 |                 .unwrap()\n   61 |                 .as_mut_ptr()\n   62 |                 .cast(),\n   63 |             _mm256_extractf128_si256::<0>(c),\n   64 |         );\n   65 |         $index += $stride;\n   66 |         // second vector\n   67 |         _mm_storeu_si128(\n   68 |             ($out)\n   69 |                 .get_mut($index..$index + 8)\n   70 |                 .unwrap()\n   71 |                 .as_mut_ptr()\n   72 |                 .cast(),\n   73 |             _mm256_extractf128_si256::<1>(c),\n   74 |         );\n   75 |         $index += $stride;","lines":20,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/idct/avx2.rs#L56-L75"},{"ref":"crates/zune-jpeg/src/idct/avx2.rs:136-158","code":"  136 |         macro_rules! store {\n  137 |             ($pos:tt,$value:tt) => {\n  138 |                 // store\n  139 |                 _mm_storeu_si128(\n  140 |                     out_vector\n  141 |                         .get_mut($pos..$pos + 8)\n  142 |                         .unwrap()\n  143 |                         .as_mut_ptr()\n  144 |                         .cast(),\n  145 |                     $value,\n  146 |                 );\n  147 |                 $pos += stride;\n  148 |             };\n  149 |         }\n  150 |         store!(pos, idct_value);\n  151 |         store!(pos, idct_value);\n  152 |         store!(pos, idct_value);\n  153 |         store!(pos, idct_value);\n  154 | \n  155 |         store!(pos, idct_value);\n  156 |         store!(pos, idct_value);\n  157 |         store!(pos, idct_value);\n  158 |         store!(pos, idct_value);","lines":23,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/idct/avx2.rs#L136-L158"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`idct_int_1x1` writes directly into `out_vector[..8]` and repeatedly re-slices `out_vector = &mut out_vector[stride..]` with no bounds protection, unlike `idct_int`/`idct4x4` which fall back to a scratch `tmp` via `get_mut(..).unwrap_or(&mut tmp)`. It is reached through `idct_1x1_func` in the hot loop with `channel.get_mut(idct_position..).unwrap()`. A malformed image whose component stride / sampling factors leave fewer than `7*stride + 8` elements past `idct_position` will panic via slice indexing instead of erroring.","fix":"Bound-check inside `idct_int_1x1` the same way `idct_int` does (write into a scratch `tmp` when the destination is too short), or validate that `raw_coeff`/channel length is always >= idct_position + 7*stride + 8 before calling.","locations":[{"ref":"crates/zune-jpeg/src/idct/scalar.rs:30-40","code":"   30 | #[inline]\n   31 | pub fn idct_int_1x1(in_vector: &mut [i32; 64], mut out_vector: &mut [i16], stride: usize) {\n   32 |     let coeff = ((wa(wa(in_vector[0], 4), 1024) >> 3).clamp(0, 255)) as i16;\n   33 | \n   34 |     out_vector[..8].fill(coeff);\n   35 |     for _ in 0..7 {\n   36 |         out_vector = &mut out_vector[stride..];\n   37 |         out_vector[..8].fill(coeff);\n   38 | \n   39 |     }\n   40 | }","lines":11,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/idct/scalar.rs#L30-L40"},{"ref":"crates/zune-jpeg/src/mcu.rs:826-829","code":"  826 |                             let idct_pos = channel.get_mut(idct_position..).unwrap();\n  827 | \n  828 |                             if len <= 1 {\n  829 |                                 (self.idct_1x1_func)(tmp, idct_pos, component.width_stride);","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/mcu.rs#L826-L829"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Multiple `try_readwrite().expect(\"This should be safe...\")` and `as_slice_mut().unwrap()` calls in\n`to_numpy_generic` (numpy_bindings.rs lines 43-46, 63-65, 106-109). The freshly allocated arrays are\nindeed owned and not yet exposed, so these are usually safe, but they are `expect`/`unwrap` on the\nhot path of every `to_numpy()` call. More importantly `self.image.frames_ref()[0]` (lines 67 and 87)\nindexes frame 0 without checking the frame list is non-empty; an image constructed with zero frames\n(e.g. via a future `from_numpy` edge case or an empty decode) would panic with an index-out-of-bounds\nfrom a plain attribute access rather than raising a Python exception.","fix":"Guard the frame access: `let frame = self.image.frames_ref().first().ok_or_else(|| PyErr::new::<PyException,_>(\"image has no frames\"))?;`.\nThe `try_readwrite().expect(...)` can stay (the invariant holds) but prefer `?` to avoid any abort.","locations":[{"ref":"crates/zune-python/src/py_image/numpy_bindings.rs:43-46","code":"   43 |             let mut arr_v = arr\n   44 |                 .try_readwrite()\n   45 |                 .expect(\"This should be safe as we own the array and haven't exposed it\");\n   46 |             let pix_values = arr_v.as_slice_mut().unwrap();","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-python/src/py_image/numpy_bindings.rs#L43-L46"},{"ref":"crates/zune-python/src/py_image/numpy_bindings.rs:62-71","code":"   62 |                     .try_readwrite()\n   63 |                     .expect(\"This should be safe as we own the array and haven't exposed it\");\n   64 |                 let pix_values = arr_v.as_slice_mut().unwrap();\n   65 | \n   66 |                 let channels = self.image.frames_ref()[0].channels_ref(colorspace, false);\n   67 |                 pix_values.copy_from_slice(\n   68 |                     channels[0]\n   69 |                         .reinterpret_as()\n   70 |                         .map_err(|x| PyErr::new::<PyException, _>(format!(\"{x:?}\")))?\n   71 |                 );","lines":10,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-python/src/py_image/numpy_bindings.rs#L62-L71"},{"ref":"crates/zune-python/src/py_image/numpy_bindings.rs:86-108","code":"   86 |                 let channels = self.image.frames_ref()[0].channels_ref(colorspace, false);\n   87 |                 for chan in channels {\n   88 |                     if chan.reinterpret_as::<T>().is_err() {\n   89 |                         return Err(PyErr::new::<PyException, _>(format!(\n   90 |                             \"The image depth {:?} is not u8 use image.convert_depth({:?}) to convert to 8 bit \\nWe do not implicitly convert to desired depth\", self.image.depth(), expected\n   91 |                         )));\n   92 |                     }\n   93 |                 }\n   94 | \n   95 |                 let width = self.width();\n   96 |                 let height = self.height();\n   97 | \n   98 |                 let dims = height.checked_mul(width);\n   99 |                 // check for overflow\n  100 |                 if dims.is_none() {\n  101 |                     return Err(PyErr::new::<PyException, _>(format!(\n  102 |                         \"width * height overflowed to big of dimensions ({width},{height})\"\n  103 |                     )));\n  104 |                 }\n  105 |                 let mut arr_v = arr\n  106 |                     .try_readwrite()\n  107 |                     .expect(\"This should be safe as we own the array and haven't exposed it\");\n  108 |                 let pix_values = arr_v.as_slice_mut().unwrap();","lines":23,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-python/src/py_image/numpy_bind {"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`show_gui::open_in_default_app` uses `unwrap()` extensively on fallible operations:\nopening the temp file, encoding the PNG, `path.to_str().unwrap()`, and spawning /\nwaiting on the external viewer process. Any failure (read-only temp dir, encode\nerror, non-UTF-8 temp path, missing `xdg-open`/`open`) panics instead of reporting\na clean error. This is `--view` only, hence low severity, but still a crash on a\nnormal failure mode (e.g. xdg-open not installed).","fix":"Propagate errors (change the signature to return `Result`) or log a warning and\nreturn, instead of unwrapping. Handle the missing-viewer-binary case gracefully.","locations":[{"ref":"crates/zune-bin/src/show_gui.rs:20-82","code":"   20 | pub fn open_in_default_app(image: &Image, options: EncoderOptions) {\n   21 |     if log_enabled!(log::Level::Trace) {\n   22 |         println!()\n   23 |     }\n   24 |     let time = format!(\n   25 |         \"{}.png\",\n   26 |         std::time::SystemTime::now()\n   27 |             .duration_since(UNIX_EPOCH)\n   28 |             .unwrap()\n   29 |             .as_millis()\n   30 |     );\n   31 |     let mut path = temp_dir();\n   32 | \n   33 |     path.push(time);\n   34 | \n   35 |     let file = OpenOptions::new()\n   36 |         .write(true)\n   37 |         .truncate(true)\n   38 |         .create(true)\n   39 |         .open(&path)\n   40 |         .unwrap();\n   41 | \n   42 |     let mut buffered = BufWriter::new(file);\n   43 | \n   44 |     let start = Instant::now();\n   45 |     let options = options.set_png_compression_level(PngCompression::Fastest);\n   46 |     let size = PngEncoder::new_with_options(options)\n   47 |         .encode(image, &mut buffered)\n   48 |         .unwrap();\n   49 |     trace!(\n   50 |         \"Wrote {:?} bytes to {:?} in {:?}\",\n   51 |         size,\n   52 |         path,\n   53 |         start.elapsed()\n   54 |     );\n   55 |     #[cfg(target_os = \"linux\")]\n   56 |     {\n   57 |         std::process::Command::new(\"xdg-open\")\n   58 |             .arg(path.to_str().unwrap())\n   59 |             .spawn()\n   60 |             .unwrap()\n   61 |             .wait()\n   62 |             .unwrap();\n   63 |     }\n   64 |     #[cfg(target_os = \"windows\")]\n   65 |     {\n   66 |         std::process::Command::new(\"start\")\n   67 |             .arg(path.to_str().unwrap())\n   68 |             .spawn()\n   69 |             .unwrap()\n   70 |             .wait()\n   71 |             .unwrap();\n   72 |     }\n   73 |     #[cfg(target_os = \"macos\")]\n   74 |     {\n   75 |         std::process::Command::new(\"open\")\n   76 |             .arg(path.to_str().unwrap())\n   77 |             .spawn()\n   78 |             .unwrap()\n   79 |             .wait()\n   80 |             .unwrap();\n   81 |     }\n   82 | }","lines":63,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bin/src/show_gui.rs#L20-L82"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`ZCursor::peek_bytes_impl` uses `self.stream.as_ref().get(start..end).unwrap()`.\n`start` and `end` are both clamped via `min(..., stream_end)`, and `start <= end`\nholds because `self.position <= self.position + buf.len()` UNLESS\n`self.position + buf.len()` overflows usize. `position` is advanced with\n`wrapping_add` in `skip` (zcursor_no_std.rs:33-36) and can be set arbitrarily via\nseek, so a pathological position close to usize::MAX plus a buffer could make\n`end < start`, turning the slice index into a panic (`unwrap` on None). Low because\nit requires an extreme/seek-abused position.","fix":"Avoid the `unwrap`: compute `end = end.max(start)` or use\n`get(start..end).unwrap_or(&[])`, and/or guard against `position` overflow in\n`skip`/seek. Prefer not using `wrapping_add` for position advancement.","locations":[{"ref":"crates/zune-core/src/bytestream/reader/no_std_readers.rs:106-118","code":"  106 |     #[inline(always)]\n  107 |     pub (crate) fn peek_bytes_impl(&mut self, buf: &mut [u8]) -> Result<usize, ZByteIoError> {\n  108 |         let stream_end = self.stream.as_ref().len();\n  109 | \n  110 |         let start = core::cmp::min(self.position, stream_end);\n  111 |         let end = core::cmp::min(self.position + buf.len(), stream_end);\n  112 | \n  113 |         let slice = self.stream.as_ref().get(start..end).unwrap();\n  114 |         buf[..slice.len()].copy_from_slice(slice);\n  115 |         let len = slice.len();\n  116 | \n  117 |         Ok(len)\n  118 |     }","lines":13,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-core/src/bytestream/reader/no_std_readers.rs#L106-L118"},{"ref":"crates/zune-core/src/bytestream/reader/no_std_readers.rs:32-36","code":"   32 |     #[inline]\n   33 |     pub fn skip(&mut self, num: usize) {\n   34 |         // Can this overflow ??\n   35 |         self.position = self.position.wrapping_add(num);\n   36 |     }","lines":5,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-core/src/bytestream/reader/no_std_readers.rs#L32-L36"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`EncoderOptions::height()` asserts `assert_ne!(self.height, 0)` and panics if the\nheight is zero, while `width()` has no such assertion and the default-constructed\n`EncoderOptions` has `height: 0`. Calling `height()` on a freshly defaulted\noptions object (a plausible mistake) panics. The asymmetry with `width()` is also\nsurprising for an API getter.","fix":"Either make `height()` a plain `const fn` returning the field (consistent with\n`width()`), or document the panic prominently and validate height at construction\ntime instead of in the getter.","locations":[{"ref":"crates/zune-core/src/options/encoder.rs:118-123","code":"  118 |     /// # Panics\n  119 |     /// If height is zero\n  120 |     pub fn height(&self) -> usize {\n  121 |         assert_ne!(self.height, 0);\n  122 |         self.height\n  123 |     }","lines":6,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-core/src/options/encoder.rs#L118-L123"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`HdrDecoder::decode` allocates with the unchecked expression\n`vec![0.0f32; self.width * self.height * 3]`, bypassing the checked `output_buffer_size()`\nhelper that exists for exactly this purpose. Width/height are parsed from the header and\nbounded only by `max_width`/`max_height`; with caller-raised limits `width*height*3` can\noverflow `usize` and panic. `decode_into` correctly uses the checked helper, so the public\n`decode` is the inconsistent path.","fix":"Allocate using `self.output_buffer_size().ok_or(...overflow...)?` (as `decode_into`\nalready does) instead of the raw multiplication.","locations":[{"ref":"crates/zune-hdr/src/decoder.rs:248-255","code":"  248 |     pub fn decode(&mut self) -> Result<Vec<f32>, HdrDecodeErrors> {\n  249 |         self.decode_headers()?;\n  250 |         let mut buffer = vec![0.0f32; self.width * self.height * 3];\n  251 | \n  252 |         self.decode_into(&mut buffer)?;\n  253 | \n  254 |         Ok(buffer)\n  255 |     }","lines":8,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-hdr/src/decoder.rs#L248-L255"},{"ref":"crates/zune-hdr/src/decoder.rs:264-270","code":"  264 |     pub fn output_buffer_size(&self) -> Option<usize> {\n  265 |         if self.decoded_headers {\n  266 |             Some(self.width.checked_mul(self.height)?.checked_mul(3)?)\n  267 |         } else {\n  268 |             None\n  269 |         }\n  270 |     }","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-hdr/src/decoder.rs#L264-L270"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`decode_vps` uses `ptl_info.expect(\"NO Profile Info\")`. `decode_profile_data` is called with\n`profile_present = true`, so it should always return Some, but relying on `.expect()` for a value\nderived from parsed data is fragile; any future change making profile optional would turn this\ninto a reachable panic. Prefer returning a NalError.","fix":"Replace `.expect(\"NO Profile Info\")` with `.ok_or(NalError::GenericStr(\"VPS missing PTL\"))?`.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers/vps.rs:62-69","code":"   62 |     let vps = Vps {\n   63 |         vps_id: vps_id as u8,\n   64 |         max_layers: max_layers as u8,\n   65 |         max_sub_layers: max_sub_layers as u8,\n   66 |         profile_info: ptl_info.expect(\"NO Profile Info\"),\n   67 |         max_dec_pic_buffering,\n   68 |         max_num_reorder_pics\n   69 |     };","lines":8,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/nal_unit_parsers/vps.rs#L62-L69"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`decode_tu` builds a `&mut [i16; 1024]` from `ctx.idct_scratchpad` via `try_into().unwrap()` and\n`&mut ctx.math_scratchpad[..N]` slices via `try_into().unwrap()` / `.expect(...)`. These rely on\nthe scratchpads being exactly the expected length and on N being one of 4/8/16/32. N is derived\nfrom `1 << log2_size` where log2_size flows from the transform tree recursion; if a malformed\nstream produces a log2_size outside 2..=5 (e.g. via inconsistent SPS transform-size fields and\nunchecked `log2_trafo_size - 2` style arithmetic in residual_block), the `unreachable!()` arm or a\nslice try_into can panic. The scaling/IDCT path assumes N<=32 but does not defensively validate.","fix":"Validate log2_trafo_size is in 2..=5 at the entry of decode_residual_block / decode_tu and return a\nNalError otherwise, so `sb_width = 1 << (log2_trafo_size - 2)` and the fixed-size try_into casts\ncannot be driven out of range (also guards the `log2_trafo_size - 2` subtraction against underflow\nfor log2_trafo_size < 2).","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/quadtree/transform_unit.rs:138-186","code":"  138 |         if ctx.transform_skip_flag[c_idx] == 0 {\n  139 |             // Pick DST for Luma 4x4 Intra, otherwise IDCT\n  140 |             let use_dst = c_idx == 0 && n_t == 4 && cu_pred_mode == PredMode::ModeIntra;\n  141 | \n  142 |             // scratchpad can be reused without reset-ing as the buffer is overwritten\n  143 |             // so no need to reset it every time\n  144 |             let idct_scratchpad: &mut [i16; 1024] =\n  145 |                 &mut ctx.idct_scratchpad[..].try_into().unwrap();\n  146 | \n  147 |             debug_more!(\"idst:{}\", use_dst);\n  148 |             if use_dst {\n  149 |                 // Luma 4x4 Intra -> Special DST path\n  150 |                 let block: &mut [i16; 16] = (&mut ctx.math_scratchpad[..16])\n  151 uadtree/transform_unit.rs#L138-L186"},{"ref":"crates/zune-heic/src/hevc_decoder/quadtree/residual_block.rs:595-621","code":"  595 |     let scan_order_sub = get_scan_order(log2_trafo_size - 2, scan_idx);\n  596 | \n  597 |     // ScanOrderPos: Order of coefficients within a 4x4 sub-block\n  598 |     // (Always size 2, because sub-blocks are always 4x4)\n  599 |     let scan_order_pos = get_scan_order(2, scan_idx);\n  600 | \n  601 |     if DEBUG_MORE {\n  602 |         // libde265 style tracing\n  603 |         let mut scan_pos_trace = String::from(\"ScanOrderPos: \");\n  604 |         for n in 0..16 {\n  605 |             let pos = scan_order_pos[n];\n  606 |             let _ = write!(scan_pos_trace, \"({},{}) \", pos.x, pos.y);\n  607 |         }\n  608 |         debug_more!(\"{}\", scan_pos_trace);\n  609 |     }\n  610 |     // --- 7. Find last sub-block and last scan position ---\n  611 |     let last_scan_p = get_scan_position(last_sig_x, last_sig_y, scan_idx, log2_trafo_size);\n  612 | \n  613 |     let last_scan_pos = last_scan_p.scan_pos;\n  614 |     let last_sub_block = last_scan_p.sub_block;\n  615 | \n  616 |     // sb_width is the number of 4x4 sub-blocks across the TU\n  617 |     let sb_width = 1_usize << (log2_trafo_size - 2);\n  618 | \n  619 |     // coded_sub_block_neighbors tracks which 4x4 groups have coefficients\n  620 |     // Max TU is 32x32, so max sb_width is 8. 8*8 = 64.\n  621 |     let mut coded_sub_block_neighbors = vec![0u8; sb_width * sb_width];","lines":27,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/quadtree/residual_block.rs#L595-L621"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`is_aligned` computes `(ptr as usize) & (size - 1) == 0` where `size = size_of::<T>()`.\nThis alignment test is only correct for power-of-two sizes. All current callers use\nu8/u16/u32/f32 (sizes 1/2/4), so it is correct today, but the function is generic over\nany `T` and silently returns wrong results (or, for ZSTs where `size == 0`, computes\n`0 - 1` which wraps in release and panics on overflow in debug) for non-power-of-two\nsizes. It is a latent correctness/panic hazard if reused for other types.","fix":"Use `(ptr as usize) % core::mem::align_of::<T>() == 0`, or guard against `size == 0`\nand non-power-of-two sizes.","locations":[{"ref":"crates/zune-image/src/channel.rs:662-667","code":"  662 | /// Check if a pointer is aligned.\n  663 | fn is_aligned<T>(ptr: *const u8) -> bool {\n  664 |     let size = core::mem::size_of::<T>();\n  665 | \n  666 |     (ptr as usize) & ((size) - 1) == 0\n  667 | }","lines":6,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/channel.rs#L662-L667"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The webp decoder panics on malformed/untrusted input instead of returning an error.\n`decode` and `read_headers` call `self.dimensions().expect(\"Failed to determine\ndimensions\")` and `output_buffer_size().expect(\"Max output size greater than usize\nmax\")`. These are reachable from `Image::read` on attacker-controlled data, so an\nunexpected decoder state aborts the process rather than producing an `ImageErrors`.","fix":"Propagate these as `ImageErrors::ImageDecodeErrors` via `ok_or_else`/`map_err`\ninstead of `expect`.","locations":[{"ref":"crates/zune-image/src/codecs/webp.rs:30-46","code":"   30 |     fn decode(&mut self) -> Result<Image, ImageErrors> {\n   31 |         let (w, h) = self.dimensions().expect(\"Failed to determine dimensions\");\n   32 |         let mut raw_pixels = vec![\n   33 |             0_u8;\n   34 |             self.inner\n   35 |                 .output_buffer_size()\n   36 |                 .expect(\"Max output size greater than usize max\")\n   37 |         ];\n   38 |         self.inner\n   39 |             .read_image(&mut raw_pixels)\n   40 |             .map_err(|e| ImageErrors::ImageDecodeErrors(e.to_string()))?;\n   41 | \n   42 |         let mut img = Image::from_u8(&raw_pixels, w, h, self.out_colorspace());\n   43 |         img.metadata.format = Some(ImageFormat::WEBP);\n   44 | \n   45 |         Ok(img)\n   46 |     }","lines":17,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/codecs/webp.rs#L30-L46"},{"ref":"crates/zune-image/src/codecs/webp.rs:66-77","code":"   66 |     fn read_headers(&mut self) -> Result<Option<ImageMetadata>, ImageErrors> {\n   67 |         let (w, h) = self.dimensions().expect(\"Failed to determine dimensions\");\n   68 |         Ok(Some(ImageMetadata {\n   69 |             width: w,\n   70 |             height: h,\n   71 |
