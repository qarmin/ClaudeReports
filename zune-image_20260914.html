{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`decode_mcu_ac_first` (arithmetic) indexes `ac_table.v[(pos - 1) as usize]` with `pos = self.spec_start` and `decode_mcu_ac_refine` does `assert!(k >= 1)`. `v` has length 63. If an AC scan ever reached these with `spec_start == 0`, `(pos-1)` wraps to 255 (OOB panic) or the assert fires. It is currently guarded only by the dispatcher in `parse_entropy_coded_data` choosing AC paths when `spec_start != 0`; there is no local guard, so a refactor or alternate caller could reintroduce the panic.","fix":"Validate `spec_start >= 1` (and `spec_end <= 63`) at the start of the AC decode routines and return a `DecodeErrors` rather than relying on the caller and `assert!`.","locations":[{"ref":"crates/zune-jpeg/src/bitstream_arith.rs:887-890","code":"  887 |         let mut pos: u8 = self.spec_start;\n  888 | \n  889 |         while pos <= self.spec_end {\n  890 |             let dse = self.decode_bit(&mut ac_table.v[(pos - 1) as usize].se, reader)?;","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/bitstream_arith.rs#L887-L890"},{"ref":"crates/zune-jpeg/src/bitstream_arith.rs:933-939","code":"  933 |         let mut k = self.spec_start;\n  934 |         assert!(k >= 1);\n  935 | \n  936 |         // Derive end of band index from block contents (the first zero position\n  937 |         // of the trailing run, or spec_end.)\n  938 |         let mut eobx: u8 = self.spec_end + 1;\n  939 |         while eobx > 0 && block[UN_ZIGZAG[(eobx - 1) as usize & 63]] == 0 {","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/bitstream_arith.rs#L933-L939"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`upsample_horizontal`, `upsample_vertical`, and `upsample_hv` use `assert_eq!`/`assert!` on buffer-length relationships. These functions are reached via the `up_sampler` fn pointer during post-processing of sub-sampled images; on malformed sampling factors the slices handed in can violate the asserted invariants and abort the process with a panic rather than a decode error.","fix":"Replace the asserts with checked length validation that returns `DecodeErrors::FormatStatic`, matching how `worker::upsample` already guards the `V`/`HV` path before calling the sampler.","locations":[{"ref":"crates/zune-jpeg/src/upsampler/scalar.rs:9-20","code":"    9 | pub fn upsample_horizontal(\n   10 |     input: &[i16], _ref: &[i16], _in_near: &[i16], _scratch: &mut [i16], output: &mut [i16]\n   11 | ) {\n   12 |     assert_eq!(\n   13 |         input.len() * 2,\n   14 |         output.len(),\n   15 |         \"Input length is not half the size of the output length\"\n   16 |     );\n   17 |     assert!(\n   18 |         output.len() > 4 && input.len() > 2,\n   19 |         \"Too Short of a vector, cannot upsample\"\n   20 |     );","lines":12,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/upsampler/scalar.rs#L9-L20"},{"ref":"crates/zune-jpeg/src/upsampler/scalar.rs:56-84","code":"   56 | pub fn upsample_vertical(\n   57 |     input: &[i16], in_near: &[i16], in_far: &[i16], _scratch_space: &mut [i16], output: &mut [i16]\n   58 | ) {\n   59 |     assert_eq!(input.len() * 2, output.len());\n   60 |     assert_eq!(in_near.len(), input.len());\n   61 |     assert_eq!(in_far.len(), input.len());\n   62 | \n   63 |     let middle = output.len() / 2;\n   64 | \n   65 |     let (out_top, out_bottom) = output.split_at_mut(middle);\n   66 | \n   67 |     // for the first row, closest row is in_near\n   68 |     for ((near, far), x) in input.iter().zip(in_near.iter()).zip(out_top) {\n   69 |         *x = (((3 * near) + 2) + far) >> 2;\n   70 |     }\n   71 |     // for the second row, the closest row to input is in_far\n   72 |     for ((near, far), x) in input.iter().zip(in_far.iter()).zip(out_bottom) {\n   73 |         *x = (((3 * near) + 2) + far) >> 2;\n   74 |     }\n   75 | }\n   76 | \n   77 | pub fn upsample_hv(\n   78 |     input: &[i16], in_near: &[i16], in_far: &[i16], scratch_space: &mut [i16], output: &mut [i16]\n   79 | ) {\n   80 | \n   81 |     assert_eq!(input.len() * 4, output.len());\n   82 | \n   83 |     assert!(input.len() * 2 <= scratch_space.len());\n   84 |     let scratch_space = &mut scratch_space[..input.len() * 2];","lines":29,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/upsampler/scalar.rs#L56-L84"}]},
{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`add_alpha` ends with a catch-all `panic!` for any colorspace/depth combination it does\nnot explicitly handle (`(a, b) => panic!(...)`). It is reached via\n`post_process_row_direct` when `png_set_add_alpha_channel(true)` is set. The four handled\narms cover Luma/RGB at 8/16 bit; Palette is converted earlier and LumaA/RGBA already have\nalpha so `add_alpha` is guarded by `!info.color.has_alpha()`. The guard makes the panic\ncurrently unreachable for valid color types, but it is a latent abort-on-input hazard if\nthe upstream guard logic ever changes (e.g. a new color type), since it turns a\nformatting branch into a hard panic rather than a recoverable error.","fix":"Return a `PngDecodeErrors` (and propagate `Result`) for the unexpected combination\ninstead of `panic!`, or `debug_assert!(false, ...)` and fall back to a no-op so malformed\ninternal state cannot abort the process.","locations":[{"ref":"crates/zune-png/src/utils.rs:384-387","code":"  384 |         (a, b) => {\n  385 |             panic!(\"Unknown combination of depth {a:?} and color type for expand alpha {b:?}\")\n  386 |         }\n  387 |     }","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-png/src/utils.rs#L384-L387"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`WasmImageFormats::from_formats` contains `_ => todo!(\"Support format {:?}\", format)` (line 115).\nIt is reachable from the exported `guess_format` function (lib.rs:529-534) and `WasmImage::colorspace`\nis unrelated, but any image format the guesser can return that is not enumerated here will hit the\n`todo!()` and panic-abort the WASM module. All current `ImageFormat` variants are listed, so this is\nlatent, but it is a panic-on-unknown-input pattern that will silently arm itself the moment a new\ncodec is added to the workspace.","fix":"Replace `todo!(...)` with `_ => Self::Unknown` so unknown formats degrade gracefully.","locations":[{"ref":"crates/zune-wasm/src/utils.rs:102-117","code":"","lines":16,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-wasm/src/utils.rs#L102-L117"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"critical","difficulty":"medium","description":"`zil_status_free` frees the `message` buffer twice. It first calls\n`zil_free((*status).message.cast())` (line 164), then calls\n`status.drop_in_place()` (line 166) which runs `Drop for ZStatus`\n(errno.rs:81-85), and that `Drop` impl ALSO calls\n`zil_free(self.message.cast())`. So the same `message` pointer is passed\nto `libc::free` twice -> double free / heap corruption / UB, exploitable\nfrom the C side just by creating a status and freeing it normally.","fix":"Remove the explicit `zil_free((*status).message.cast())` on line 164 and\nlet `drop_in_place` (which triggers the Drop impl) free the message exactly\nonce. I.e. just `status.drop_in_place()` then `zil_free(status.cast())`.","locations":[{"ref":"crates/zune-capi/src/errno.rs:161-171","code":"  161 | #[no_mangle]\n  162 | pub extern \"C\" fn zil_status_free(status: *mut ZStatus) {\n  163 |     if !status.is_null() {\n  164 |         unsafe { zil_free((*status).message.cast()) }\n  165 |         // free object\n  166 |         unsafe { status.drop_in_place() }\n  167 | \n  168 |         // free memory holding it\n  169 |         unsafe { zil_free(status.cast()) }\n  170 |     }\n  171 | }","lines":11,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/errno.rs#L161-L171"},{"ref":"crates/zune-capi/src/errno.rs:81-85","code":"   81 | impl Drop for ZStatus {\n   82 |     fn drop(&mut self) {\n   83 |         unsafe { zil_free(self.message.cast()) };\n   84 |     }\n   85 | }","lines":5,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/errno.rs#L81-L85"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`zil_status_new` leaks the `mem` (message) allocation when the `ptr` (ZStatus)\nallocation fails. If `zil_malloc(size_of::<ZStatus>())` returns null, the function\nstill allocates `mem`, then the `if !ptr.is_null()` block is skipped and `ptr`\n(null) is returned, so `mem` is never freed nor reachable -> leak. Also note `mem`\nis null-checked but `ptr` is only guarded, never reported as failure to the\ncaller (returns null silently, which is at least consistent).","fix":"Check `ptr.is_null()` first; if it is null, free `mem` (or allocate `mem` only\nafter confirming `ptr` is non-null) before returning null.","locations":[{"ref":"crates/zune-capi/src/errno.rs:105-125","code":"  105 | #[no_mangle]\n  106 | pub unsafe extern \"C\" fn zil_status_new() -> *mut ZStatus {\n  107 |     unsafe {\n  108 |         let ptr = zil_malloc(size_of::<ZStatus>());\n  109 | \n  110 |         let msg = CString::new(\"\").unwrap();\n  111 |         let mem = zil_malloc(msg.as_bytes_with_nul().len());\n  112 |         if mem.is_null() {\n  113 |             return ptr::null_mut();\n  114 |         }\n  115 |         // copy to memory\n  116 |         libc::strcpy(mem.cast(), msg.as_ptr());\n  117 | \n  118 |         if !ptr.is_null() {\n  119 |             (*ptr.cast::<ZStatus>()).message = mem.cast();\n  120 |             (*ptr.cast::<ZStatus>()).status = ZStatusType::ZilOk;\n  121 |         }\n  122 |         // make pointer\n  123 |         ptr.cast()\n  124 |     }\n  125 | }","lines":21,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/errno.rs#L105-L125"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `zil_imread` the output buffer size is computed as\n`let new_size = w * h * colorspace * im_depth;` with no overflow check. For a\nmaliciously crafted header (large width/height) this multiplication can wrap on a\nusize, producing a small `new_size`. `zil_malloc(new_size)` then allocates a small\nbuffer while the decoder believes it has a full-size buffer (the size check in\n`zil_imdecode_into` re-derives `size` the same wrapped way), enabling a heap\nbuffer overflow. `zil_imdecode`/`zil_imdecode_into` (image.rs uses `checked_mul`,\nbut imread.rs does not) have the same unchecked pattern.","fix":"Use checked multiplication (like the `checked_mul` helper in image.rs) when\ncomputing the allocation/expected size, and bail out with an error status on\noverflow before allocating or decoding.","locations":[{"ref":"crates/zune-capi/src/imread.rs:68-96","code":"   68 |             if let Some(im_metadata) = zune_image::utils::decode_info(ZCursor::new(&data)) {\n   69 |                 // allocate a space big enough\n   70 |                 let (w, h) = im_metadata.dimensions();\n   71 |                 let colorspace = im_metadata.colorspace().num_components();\n   72 |                 let im_depth = im_metadata.depth().size_of();\n   73 | \n   74 |                 let new_size = w * h * colorspace * im_depth;\n   75 | \n   76 |                 let output = unsafe { zil_malloc(new_size) };\n   77 |                 if output.is_null() {\n   78 |                     unsafe {\n   79 |                         *status = ZStatus::new(\n   80 |                             format!(\"Malloc failed to allocate buffer with size of {new_size}\"),\n   81 |                             ZStatusType::ZilMallocFailed,\n   82 |                         )\n   83 |                     };\n   84 |                     return ERROR;\n   85 |                 }\n   86 |                 zil_imdecode_into(\n   87 |                     data.as_ptr(),\n   88 |                     data.len(),\n   89 |                     output.cast(),\n   90 |                     new_size,\n   91 |                     width,\n   92 |                     height,\n   93 |                     depth,\n   94 |                     channels,\n   95 |                     status,\n   96 |                 )","lines":29,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/imread.rs#L68-L96"},{"ref":"crates/zune-capi/src/imread.rs:266-295","code":"  266 |         Some(metadata) => {\n  267 |             let (w, h) = metadata.dimensions();\n  268 |             let im_depth = metadata.depth();\n  269 |             let colorspace = metadata.colorspace();\n  270 |             let size = w * h * im_depth.size_of() * colorspace.num_components();\n  271 | \n  272 |             let output = unsafe { zil_malloc(size) };\n  273 |             if output.is_null() {\n  274 |                 unsafe {\n  275 |                     *status = ZStatus::new(\n  276 |                         format!(\"Malloc failed to allocate buffer with size of {size}\"),\n  277 |                         ZStatusType::ZilMallocFailed,\n  278 |                     )\n  279 |                 };\n  280 |                 return ERROR;\n  281 |             }\n  282 |             zil_imdecode_into(\n  283 |                 input,\n  284 |                 input_size,\n  285 |                 output.cast(),\n  286 |                 size,\n  287 |                 width,\n  288 |                 height,\n  289 |                 depth,\n  290 |                 channels,\n  291 |                 status,\n  292 |             )\n  293 |         }\n  294 |     }\n  295 | }","lines":30,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/imread.rs#L266-L295"},{"ref":"crates/zune-capi/src/imread.rs:331-343","code":"  331 |         Some(metadata) => {\n  332 |             let (w, h) = metadata.dimensions();\n  333 |             let im_depth = metadata.depth();\n  334 |             let colorspace = metadata.colorspace();\n  335 |             let size = w * h * im_depth.size_of() * colorspace.num_components();\n  336 | \n  337 |             // the buffer has to be that big\n  338 |             if buf.len() < size {\n  339 |                 let msg = format!(\"Expected buffer of size {},but found {}\", size, buf.len());\n  340 |                 // safety, we checked above if status is null\n  341 |                 unsafe { *status = ZStatus::new(msg, ZStatusType::ZilNotEnoughSpaceInDest) };\n  342 |                 return ERROR;\n  343 |             }","lines":13,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-capi/src/imread.rs#L331-L343"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`decode_sps` derives `ctb_size_y = 1 << log2_ctb_size_y` where\n`log2_ctb_size_y = log2_min_luma_coding_block_size + log2_diff_max_min_luma_coding_block_size`,\nboth of which are truncated `as u8` casts of unbounded `read_ue()` values (e.g.\n`log2_min_luma_coding_block_size = (read_ue() + 3) as u8`). No upper bound is enforced (HEVC\nlimits log2_ctb to 6). A crafted SPS can make these shifts overflow u64 or produce an enormous\n`ctb_size_y`, which then drives buffer sizes in `DecodeSliceContext::new`\n(`width_in_ctbs * height_in_ctbs`) and shift amounts elsewhere; combined with `1 << log2_cb_size`\nin read_coding_unit / read_coding_quadtree these can panic on overflow or allocate absurd buffers.","fix":"After parsing the block-size syntax elements, validate them against spec ranges\n(log2_min_luma_coding_block_size in 3..=6, log2_diff so that log2_ctb_size_y <= 6,\nlog2_min/diff transform sizes likewise) and return ParameterOutOfRange otherwise, before any\nderived shift or buffer allocation.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/nal_unit_parsers/sps.rs:159-254","code":"  159 |     // --- CTB & Transform Sizes ---\n  160 |     sps.log2_min_luma_coding_block_size = (r.read_ue()? + 3) as u8;\n  161 |     sps.log2_diff_max_min_luma_coding_block_size = r.read_ue()? as u8;\n  162 |     sps.log2_min_transform_block_size = (r.read_ue()? + 2) as u8;\n  163 |     sps.log2_diff_max_min_transform_block_size = (r.read_ue()?) as u8;\n  164 |     sps.max_transform_hierarchy_depth_inter = r.read_ue()?;\n  165 |     sps.max_transform_hierarchy_depth_intra = r.read_ue()?;\n  166 | \n  167 |     // --- Scaling List ---\n  168 |     sps.scaling_list_enabled_flag = r.read_flag()?;\n  169 |     if sps.scaling_list_enabled_flag {\n  170 |         let sps_scaling_list_data_present_flag = r.read_flag()?;\n  171 |         if sps_scaling_list_ n  216 | \n  217 |     // --- VUI Parameters ---\n  218 |     let vui_parameters_present_flag = r.read_flag()?;\n  219 |     if vui_parameters_present_flag {\n  220 |         sps.vui = Some(parse_vui(&mut r, sps.max_sub_layers - 1)?);\n  221 |     }\n  222 | \n  223 |     let sps_extension_present_flag = r.read_flag()?;\n  224 | \n  225 |     if sps_extension_present_flag {\n  226 |         let mut sps_range_ext = SpsRangeExtension::default();\n  227 | \n  228 |         sps_range_ext.transform_skip_rotation_enabled_flag = r.read_flag()?;\n  229 |         sps_range_ext.transform_skip_context_enabled_flag = r.read_flag()?;\n  230 |         sps_range_ext.implicit_rdpcm_enabled_flag = r.read_flag()?;\n  231 |         sps_range_ext.explicit_rdpcm_enabled_flag = r.read_flag()?;\n  232 |         sps_range_ext.extended_precision_processing_flag = r.read_flag()?;\n  233 |         sps_range_ext.intra_smoothing_disabled_flag = r.read_flag()?;\n  234 |         sps_range_ext.high_precision_offsets_enabled_flag = r.read_flag()?;\n  235 |         sps_range_ext.persistent_rice_adaptation_enabled_flag = r.read_flag()?;\n  236 |         sps_range_ext.cabac_bypass_alignment_enabled_flag = r.read_flag()?;\n  237 | \n  238 |         sps.range_extension = Some(sps_range_ext);\n  239 |     }\n  240 | \n  241 |     // --- Compute Derived Values ---\n  242 |     sps.min_cb_size_y = 1 << sps.log2_min_luma_coding_block_size;\n  243 | \n  244 |     let log2_ctb_size_y =\n  245 |         sps.log2_min_luma_coding_block_size + (sps.log2_diff_max_min_luma_coding_block_size);\n  246 |     sps.ctb_size_y = 1 << log2_ctb_size_y;\n  247 | \n  248 |     // Integer math equivalent of ceil(width / ctb_size)\n  249 |     sps.pic_width_in_ctbs_y = sps.pic_width_in_luma_samples.div_ceil(sps.ctb_size_y);\n  250 |     sps.pic_height_in_ctbs_y = sps.pic_height_in_luma_samples.div_ceil(sps.ctb_size_y);\n  251 | \n  252 |     sps.log2_ctb_size_y = log2_ctb_size_y;\n  253 |     sps.log2_max_transform_block_size =\n  254 |         sps.log2_min_transform_block_size + sps.log2_diff_max_min_transform_block_size;","lines":96,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/nal_unit_parsers/sps.rs#L159-L254"},{"ref":"crates/zune-heic/src/hevc_decoder/ctx.rs:73-119","code":"   73 |         let ctb_size = 1 << sps.log2_ctb_size_y;\n   74 | \n   75 |         let width_in_ctbs = sps.pic_width_in_luma_samples.div_ceil(ctb_size);\n   76 |         let height_in_ctbs = sps.pic_height_in_luma_samples.div_ceil(ctb_size);\n   77 | \n   78 |         let buffer_size = (width_in_ctbs * height_in_ctbs) as usize;\n   79 | \n   80 |         Self {\n   81 |             sps,\n   82 |             pps,\n   83 |             slice_header,\n   84 |             cabac: cabac_engine,\n   85 |             neighbor_tracker,\n   86 |             last_qp_in_slice,\n   87 |             is_cu_qp_delta_coded: false,\n   88 |             cu_qp_delta: 0,\n   89 |             current_qg_x: usize::MAX,\n   90 |             current_qg_y: usize::MAX,\n   91 |             last_qp_in_previous_qg: 0,\n   92 |             is_skip: false,\n   93 |             is_intra: false,\n   94 |             intra_mode_luma: 0,\n   95 |             intra_mode_chroma: 0,\n   96 |             cu_transquant_bypass_flag: false,\n   97 |             qp_y_prime: 0,\n   98 |             qp_cb_prime: 0,\n   99 |             qp_cr_prime: 0,\n  100 |             transform_skip_flag: [0; 3],\n  101 |             explicit_rdpcm_flag: false,\n  102 |             explicit_rdpcm_dir: 0,\n  103 |             sig_ctx_maps: generate_all_sig_ctx_maps(),\n  104 |             stat_coeff: [0; 4],\n  105 |             coeff_list: [[0; 32 * 32]; 3],\n  106 |             coeff_pos: [[0; 32 * 32]; 3],\n  107 |             n_coeff: [0; 3],\n  108 |             raw_frame: raw_frame.clone(),\n  109 |             pixel_scratchpad: vec![0; 1024],\n  110 |             ref_main_buf: vec![0 {"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `process_hevc_samples` and the parallel variant, the absolute extent offset is computed with\nplain `+` on attacker-controlled `base_offset`/`extent.offset`/idat position\n(`item_iloc.base_offset + extent.offset`, `idat_off.position + item_iloc.base_offset +\nextent.offset`). These u64 additions can overflow and panic in debug, or wrap in release to a\nsmall value that then bypasses the `< mdat.start_offset` check. The parallel path additionally\ncomputes `buffer_index = (absolute_offset - mdat.start_offset) as usize` and `buffer_index +\nlength` without checking `absolute_offset >= mdat.start_offset` first (the non-parallel path does\ncheck), so a smaller offset underflows the subtraction (panic in debug) or produces a huge index.","fix":"Use checked_add for the offset arithmetic and, in the parallel path, replicate the\n`absolute_offset < mdat.start_offset` guard before subtracting. Also use checked_add for\n`buffer_index + length` (or `get(buffer_index..buffer_index + length)` which the parallel path\nalready does but only after a potentially-underflowed subtraction).","locations":[{"ref":"crates/zune-heic/src/processor.rs:146-180","code":"  146 |             for extent in &item_iloc.extents {\n  147 |                 let absolute_offset = match item_iloc.construction_method {\n  148 |                     0 => item_iloc.base_offset + extent.offset,\n  149 |                     1 => {\n  150 |                         let idat_off = meta.idat.as_ref().ok_or(HeicErrors::Generic {\n  151 |                             msg: \"Missing idat offset\".into()\n  152 |                         })?;\n  153 |                         idat_off.position + item_iloc.base_offset + extent.offset\n  154 |                     }\n  155 |                     _ => {\n  156 |                         return Err(HeicErrors::Generic {\n  157 |                             msg: \"Unsupported construction method\".into()\n  158 |                         });\n  159 |                     }\n  160 |                 };\n  161 | \n  162 |                 if absolute_offset < mdat.start_offset {\n  163 |                     return Err(HeicErrors::Generic {\n  164 |                         msg: \"Data offset points to before MDAT payload\".into()\n  165 |                     });\n  166 |                 }\n  167 | \n  168 |                 let buffer_index = (absolute_offset - mdat.start_offset) as usize;\n  169 |                 let length = extent.length as usize;\n  170 | \n  171 |                 if buffer_index + length > mdat.raw_data.len() {\n  172 |                     return Err(HeicErrors::Generic {\n  173 |                         msg: \"Extent goes out of MDAT bounds!\".into()\n  174 |                     });\n  175 |                 }\n  176 | \n  177 |                 // We take a slice of the existing memory instead of copying!\n  178 |                 let slice = &mdat.raw_data[buffer_index..(buffer_index + length)];\n  179 |                 zero_copy_extents.push(slice);\n  180 |             }","lines":35,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/processor.rs#L146-L180"},{"ref":"crates/zune-heic/src/processor.rs:303-332","code":"  303 |             for extent in &item_iloc.extents {\n  304 |                 let absolute_offset = match item_iloc.construction_method {\n  305 |                     0 => item_iloc.base_offset + extent.offset,\n  306 |                     1 => {\n  307 |                         let idat_off = meta.idat.as_ref().ok_or(HeicErrors::Generic {\n  308 |                             msg: \"Missing idat offset\".into()\n  309 |                         })?;\n  310 |                         idat_off.position + item_iloc.base_offset + extent.offset\n  311 |                     }\n  312 |                     _ => {\n  313 | {"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`find_contrast` computes `maximum + minimum` with the plain `Add` operator on\nthe integer pixel type before the `.saturating_add(T::one())`. For u8/u16 this\noverflows whenever max+min exceeds the type maximum (e.g. u8 max=200, min=100 ->\n300), which panics in debug builds and wraps in release builds. Only the `+1`\nis saturating; the `maximum + minimum` term is not protected.","fix":"Use a wider accumulator (e.g. compute in u32/u64) or `maximum.saturating_add(minimum)` for the denominator.","locations":[{"ref":"crates/zune-imageprocs/src/spatial_ops.rs:73-82","code":"   73 | pub(crate) fn find_contrast<T>(data: &[T]) -> T\n   74 | where\n   75 |     T: PartialOrd + Copy + NumOps<T> + Sub<Output = T> + Add<Output = T> + Div<Output = T>,\n   76 | {\n   77 |     let minimum = find_min(data);\n   78 |     let maximum = find_max(data);\n   79 |     let num = maximum - minimum;\n   80 |     let div = (maximum + minimum).saturating_add(T::one());\n   81 |     num / div\n   82 | }","lines":10,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/spatial_ops.rs#L73-L82"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`PngDecoder::decode` computes the output length with plain (unchecked) multiplication:\n`let new_len = info.width * info.height * out_n;` and then allocates\n`vec![0; new_len * usize::from(...)]`. width and height come from the IHDR chunk and are\nonly bounded by `options.max_width()`/`max_height()` (defaults are large, e.g. up to\n1<<31). On 32-bit targets `width * height * out_n` can overflow a usize and wrap to a\nsmall value, producing an undersized buffer (later writes/scatter then operate on wrong\nsizes), or in debug builds panic. The sibling routine `output_frame_size` (streaming.rs)\nand `output_buffer_size` (decoder.rs) both already use `checked_mul`, so `decode`\nsilently uses a less-safe path for the same computation. This parses untrusted\ndimensions.","fix":"Reuse `output_frame_size()`/`output_buffer_size()` (which use `checked_mul`) to compute\n`new_len`, or replace the bare multiplies with `checked_mul` and return\n`PngDecodeErrors` on overflow instead of multiplying directly.","locations":[{"ref":"crates/zune-png/src/decoder.rs:869-887","code":"  869 |         let info = &self.png_info;\n  870 |         let bytes = if info.depth == 16 { 2 } else { 1 };\n  871 | \n  872 |         let out_n = self.colorspace().unwrap().num_components();\n  873 |         let new_len = info.width * info.height * out_n;\n  874 | \n  875 |         let mut out_u8: Vec<u8> = vec![0; new_len * usize::from(info.depth != 16)];\n  876 |         let mut out_u16: Vec<u16> = vec![0; new_len * usize::from(info.depth == 16)];\n  877 | \n  878 |         // use either out_u8 or out_u16 depending on the expected type for the output\n  879 |         let out = if bytes == 1 {\n  880 |             &mut out_u8\n  881 |         } else {\n  882 |             let b = convert_u16_to_u8_slice(&mut out_u16);\n  883 | \n  884 |             assert_eq!(b.len(), new_len * 2); // length should be twice that of u8\n  885 |             b\n  886 |         };\n  887 |         self.decode_stream_into(out)?;","lines":19,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-png/src/decoder.rs#L869-L887"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`PPMDecoder::decode` computes the allocation size with unchecked multiplication\n`size = self.width * self.height * self.colorspace.num_components() * self.bit_depth.size_of()`\nand uses it directly in `vec![0; size]` / `vec![0; size/2]` / the F32 paths. Width and\nheight come from header integers bounded only by `max_width`/`max_height`; if a caller\nraises those limits the product can overflow `usize` and panic, or wrap in release builds\nand mis-size the output buffer. Unlike other decoders here there is no checked\n`output_buffer_size` helper guarding this path.","fix":"Compute `size` with `checked_mul` and return a decode error on overflow before allocating,\nmirroring the checked size helpers used by the bmp/qoi/farbfeld decoders.","locations":[{"ref":"crates/zune-ppm/src/decoder.rs:540-546","code":"  540 |         // okay check if the stream is large enough for the bit depth\n  541 |         let size =\n  542 |             self.width * self.height * self.colorspace.num_components() * self.bit_depth.size_of();\n  543 | \n  544 |         match self.bit_depth.bit_type() {\n  545 |             BitType::U8 => {\n  546 |                 let mut data = vec![0; size];","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-ppm/src/decoder.rs#L540-L546"},{"ref":"crates/zune-ppm/src/decoder.rs:562","code":"  562 |                 let mut data = vec![0; size / 2];","lines":1,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-ppm/src/decoder.rs#L562"},{"ref":"crates/zune-ppm/src/decoder.rs:574-584","code":"  574 |                     let mut output =\n  575 |                         vec![0.0f32; self.width * self.height * self.colorspace.num_components()];\n  576 | \n  577 |                     for out in &mut output {\n  578 |                         // TODO: Should it be ne or be?\n  579 |                         *out = f32::from_bits(self.reader.get_u32_be_err()?);\n  580 |                     }\n  581 |                     output\n  582 |                 } else if self.options.byte_endian() == ByteEndian::LE {\n  583 |                     let mut output =\n  584 |                         vec![0.0f32; self.width * self.height * self.colorspace.num_components()];","lines":11,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-ppm/src/decoder.rs#L574-L584"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`PSDDecoder::decode_into` recomputes the buffer size with unchecked multiplications\n(`pixel_count = self.width * self.height`, `required_len = pixel_count * channel_count *\nbytes_per_sample`) even though the sibling `required_len()` uses `checked_mul`. The\ndimensions come from 32-bit header fields gated only by `max_width`/`max_height`, which a\ncaller may raise. With large limits these products can overflow `usize` and panic (debug)\nor wrap to a small value (release), the latter under-sizing the slice check and corrupting\ndecode bounds. `decode_into` is a public entry point reachable without going through the\nchecked `required_len()`.","fix":"Compute the length once via the checked `required_len()` and reuse it in `decode_into`\ninstead of recomputing with `*`, returning the existing overflow error on `None`.","locations":[{"ref":"crates/zune-psd/src/decoder.rs:387-405","code":"  387 |     pub fn decode_into(&mut self, output: &mut [u8]) -> Result<usize, PSDDecodeErrors> {\n  388 |         if !self.decoded_header {\n  389 |             self.decode_headers()?;\n  390 |         }\n  391 | \n  392 |         let pixel_count = self.width * self.height;\n  393 |         let bytes_per_sample = match self.depth {\n  394 |             BitDepth::Eight => 1,\n  395 |             BitDepth::Sixteen => 2,\n  396 |             _ => return Err(PSDDecodeErrors::Generic(\"Unsupported bit depth\")),\n  397 |         };\n  398 | \n  399 |         let required_len = pixel_count * self.channel_count * bytes_per_sample;\n  400 | \n  401 |         if output.len() < required_len {\n  402 |             return Err(PSDDecodeErrors::Generic(\"Output buffer too small\"));\n  403 |         }\n  404 | \n  405 |         let out = &mut output[..required_len];","lines":19,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-psd/src/decoder.rs#L387-L405"},{"ref":"crates/zune-psd/src/decoder.rs:308-329","code":"  308 |     pub fn required_len(&self) -> Result<usize, PSDDecodeErrors> {\n  309 |         if !self.decoded_header {\n  310 |             return Err(PSDDecodeErrors::Generic(\"Headers not decoded\"));\n  311 |         }\n  312 | \n  313 |         let bytes_per_sample = match self.depth {\n  314 |             BitDepth::Eight => 1usize,\n  315 |             BitDepth::Sixteen => 2usize,\n  316 |             _ => return Err(PSDDecodeErrors::Generic(\"Unsupported bit depth\")),\n  317 |         };\n  318 | \n  319 |         let pixel_count = self.width\n  320 |             .checked_mul(self.height)\n  321 |             .ok_or(PSDDecodeErrors::Generic(\"Dimension overflow\"))?;\n  322 | \n  323 |         let total = pixel_count\n  324 |             .checked_mul(self.channel_count)\n  325 |             .and_then(|v| v.checked_mul(bytes_per_sample))\n  326 |             .ok_or(PSDDecodeErrors::Generic(\"Size overflow\"))?;\n  327 | \n  328 |         Ok(total)\n  329 |     }","lines":22,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-psd/src/decoder.rs#L308-L329"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Numerous dimension/size computations multiply `width * height * components * depth`\nwith plain `*` rather than checked arithmetic, so a decoder reporting hostile\ndimensions can overflow `usize` and wrap to a small allocation followed by OOB\nwrites. Examples: `Image::fill` (`width * height`), `from_fn_inner`\n(`width * height * T::depth().size_of()`), `convert_rgb_to_grayscale`\n(`width * height * depth.size_of()`), and `PixelIterator` `total_pixels =\nwidth * height`. The dedicated `checked_mul` helper exists and is used by\n`from_u8/u16/f32`, but these internal paths bypass it.","fix":"Route all width*height*components*depth computations through the existing\n`checked_mul` helper (or `checked_mul`/`checked_add` directly) so overflow is caught\ninstead of wrapping.","locations":[{"ref":"crates/zune-image/src/image.rs:336-345","code":"  336 |     pub fn fill<T>(pixel: T, colorspace: ColorSpace, width: usize, height: usize) -> Image\n  337 |     where\n  338 |         T: Copy + Clone + 'static + ZuneInts<T> + Zeroable + Pod,\n  339 |     {\n  340 |         let dims = width * height;\n  341 | \n  342 |         let channels = vec![Channel::from_elm::<T>(dims, pixel); colorspace.num_components()];\n  343 | \n  344 |         Image::new(channels, T::depth(), width, height, colorspace)\n  345 |     }","lines":10,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/image.rs#L336-L345"},{"ref":"crates/zune-image/src/image.rs:409-451","code":"  409 |     fn from_fn_inner<F, T, const COMPONENTS: usize>(\n  410 |         width: usize, height: usize, func: F, colorspace: ColorSpace,\n  411 |     ) -> Image\n  412 |     where\n  413 |         F: Fn(usize, usize, &mut [T; MAX_CHANNELS]),\n  414 |         T: ZuneInts<T> + Copy + Clone + 'static + Default + Debug + Zeroable + Pod,\n  415 |     {\n  416 |         let size = width * height * T::depth().size_of();\n  417 | \n  418 |         let mut channels = vec![Channel::new_with_length::<T>(size); COMPONENTS];\n  419 | \n  420 |         // convert the channels into mutable T's\n  421 |         //\n  422 |         // Iterate to number of components,\n  423 |         // map the channels to &mut [T], using reintepret_as_mut\n  424 |         // collect the items into a temporary vec\n  425 |         // convert that vec to a fixed size array\n  426 |         // panic if everything goes wrong\n  427 |         let channels_ref: [&mut [T]; COMPONENTS] = channels\n  428 |             .get_mut(0..COMPONENTS)\n  429 |             .unwrap()\n  430 |             .iter_mut()\n  431 |             .map(|x| x.reinterpret_as_mut().unwrap())\n  432 |             .collect::<Vec<&mut [T]>>()\n  433 |             .try_into()\n  434 |             .unwrap();\n  435 | \n  436 |         let mut pxs = [T::default(); MAX_CHANNELS];\n  437 | \n  438 |         for y in 0..height {\n  439 |             for x in 0..width {\n  440 |                 (func)(y, x, &mut pxs);\n  441 | \n  442 |                 let offset = y * width + x;\n  443 | \n  444 |                 for i in 0..COMPONENTS {\n  445 |                     channels_ref[i][offset] = pxs[i];\n  446 |                 }\n  447 |             }\n  448 |         }\n  449 | \n  450 |         Image::new(channels, T::depth(), width, height, colorspace)\n  451 |     }","lines":43,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/image.rs#L409-L451"},{"ref":"crates/zune-image/src/core_filters/colorspace/conversion_functions.rs:66-67","code":"   66 |     let (width, height) = image.dimensions();\n   67 |     let size = width * height * image.depth().size_of();","lines":2,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/core_filters/colorspace/conversion_functions.rs#L66-L67"},{"ref":"crates/zune-image/src/iters.rs:141-148","code":"  141 |         Ok(PixelIterator {\n  142 |             channels,\n  143 |             width,\n  144 |             components: colorspace.num_components(),\n  145 |             current_pos: 0,\n  146 |             pixel: [T::default(); MAX_CHANNELS],\n  147 |             total_pixels: width * height,\n  148 |         })","lines":8,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/iters.rs#L141-L148"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"easy","description":"`calculate_expected_input` computes the wrong value and is the only check that the\ncaller-supplied pixel buffer matches `width*height*num_components*depth_bytes`.\nIt computes `width*depth_size + height + width + num_components` (adds instead of\nmultiplies, omits height and channel count from the product). Consequences:\n1. For virtually every real image the correctly-sized input buffer is REJECTED with\n   `LengthMismatch`, so the encoder is effectively unusable through this path.\n2. Worse for safety: a too-small buffer whose length happens to equal this bogus value\n   passes the check, and `process_image_area` then slices `&pixels[row_start..]`\n   (encoder.rs:768-770) where `row_start = row_stride*(y0+y)+...` can exceed the buffer,\n   producing an index-out-of-bounds panic / OOB read. The single guard that was meant to\n   prevent this does not actually bound the buffer.","fix":"Compute the real product with checked arithmetic, e.g.:\noptions.width()\n    .checked_mul(options.height())\n    .and_then(|x| x.checked_mul(options.colorspace().num_components()))\n    .and_then(|x| x.checked_mul(options.depth().size_of()))","locations":[{"ref":"crates/zune-jpegxl/src/encoder.rs:1597-1604","code":" 1597 | fn calculate_expected_input(options: &EncoderOptions) -> Option<usize> {\n 1598 |     options\n 1599 |         .width()\n 1600 |         .checked_mul(options.depth().size_of())\n 1601 |         .and_then(|x| x.checked_add(options.height()))\n 1602 |         .and_then(|x| x.checked_add(options.width()))\n 1603 |         .and_then(|x| x.checked_add(options.colorspace().num_components()))\n 1604 | }","lines":8,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpegxl/src/encoder.rs#L1597-L1604"},{"ref":"crates/zune-jpegxl/src/encoder.rs:1111-1117","code":" 1111 |         let expected = calculate_expected_input(&self.options)\n 1112 |             .ok_or(JxlEncodeErrors::Generic(\"Input dimensions overflowed\"))?;\n 1113 |         let found = self.data.len();\n 1114 | \n 1115 |         if expected != found {\n 1116 |             return Err(JxlEncodeErrors::LengthMismatch(expected, found));\n 1117 |         }","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpegxl/src/encoder.rs#L1111-L1117"},{"ref":"crates/zune-jpegxl/src/encoder.rs:768-770","code":"  768 |         let row_start = row_stride * (y0 + y) + x0 * channels * BitDepth::K_INPUT_BYTES;\n  769 | \n  770 |         let rgba_row = &pixels[row_start..];","lines":3,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpegxl/src/encoder.rs#L768-L770"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `decode_headers`, `let p = self.hsize.wrapping_sub(self.ihszie).wrapping_sub(14)`\nreads the struct fields `self.hsize` and `self.ihszie`, but those fields are only assigned\nlater at lines 592-593 (after this point they are still their constructor value 0). So `p`\nis always `0u32.wrapping_sub(0).wrapping_sub(14) = 0xFFFFFFF2`, not the intended\n`hsize - ihsize - 14`. This corrupts the palette-size logic that depends on `p`:\n`colors = 256.min(p/3)` (line 546) always yields 256, and the OS/2 guard\n`if p < colors*3` (line 553) can never trigger. The local `hsize`/`ihsize` values parsed\nin this function are what should have been used.","fix":"Use the locals computed in this function: `let p = hsize.wrapping_sub(ihsize).wrapping_sub(14);`\n(or assign `self.hsize`/`self.ihszie` before line 527). Then re-validate the OS/2 palette\nbounds against the real value.","locations":[{"ref":"crates/zune-bmp/src/decoder.rs:526","code":"  526 |         let p = self.hsize.wrapping_sub(self.ihszie).wrapping_sub(14);","lines":1,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bmp/src/decoder.rs#L526"},{"ref":"crates/zune-bmp/src/decoder.rs:544-553","code":"  544 |             } else {\n  545 |                 colors = 256.min(p / 3);\n  546 |             }\n  547 |             // palette location\n  548 |             self.bytes.set_position((14 + ihsize) as usize)?;\n  549 | \n  550 |             // OS/2 bitmap, 3 bytes per palette entry\n  551 |             if ihsize == 12 {\n  552 |                 if p < colors * 3 {\n  553 |                     return Err(BmpDecoderErrors::GenericStatic(\"Invalid Palette entries\"));","lines":10,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bmp/src/decoder.rs#L544-L553"},{"ref":"crates/zune-bmp/src/decoder.rs:589-590","code":"  589 |         self.ihszie = ihsize;\n  590 |         self.hsize = hsize;","lines":2,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bmp/src/decoder.rs#L589-L590"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`DecoderOptions::set_num_threads` caps the thread count to AT MOST one with\n`num_threads.min(1)`. This means any value >= 1 becomes 1 and the only way to get\n0 is to pass 0. This is almost certainly meant to be `.max(1)` (ensure at least\none thread). As written, multi-threaded decoders (e.g. HEIC tile decoding) are\nsilently limited to a single thread regardless of the requested count.","fix":"Change `num_threads.min(1)` to `num_threads.max(1)`.","locations":[{"ref":"crates/zune-core/src/options/decoder.rs:332-335","code":"  332 |     pub  fn set_num_threads(mut self, num_threads: u8) -> Self {\n  333 |         self.num_threads = num_threads.min(1);\n  334 |         self\n  335 |     }","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-core/src/options/decoder.rs#L332-L335"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`FarbFeldDecoder::decode()` always fails for any non-empty image due to a unit mismatch.\n`output_buffer_size()` returns a count in BYTES (`num_components*width*height*2`), but\n`decode_into` takes a `&mut [u16]` slice and compares the element count `sink.len()`\nagainst that byte count (`if sink.len() < expected_len`). `decode()` allocates a\n`Vec<u16>` of `4*width*height` elements, while `expected_len` is `8*width*height`, so the\ncheck `4wh < 8wh` is always true and `decode()` returns\n`Generic(\"Too small output buffer size\")` for every image with at least one pixel.\nThe `*2` belongs to a byte-sized API, not to a `[u16]` element count.","fix":"Make the comparison unit-consistent. Either give `decode_into` an element-count target\n(`num_components*width*height`, no `*2`) when validating a `[u16]` sink, or keep\n`output_buffer_size()` returning bytes and divide by 2 before comparing/allocating in the\n`[u16]` paths. Add a round-trip test that decodes a real farbfeld image.","locations":[{"ref":"crates/zune-farbfeld/src/decoder.rs:92-104","code":"   92 |     pub fn output_buffer_size(&self) -> Option<usize> {\n   93 |         if self.decoded_headers {\n   94 |             Some(\n   95 |                 FARBFELD_COLORSPACE\n   96 |                     .num_components() /*RGBA*/\n   97 |                     .checked_mul(self.width)?\n   98 |                     .checked_mul(self.height)?\n   99 |                     .checked_mul(2 /*depth*/)?,\n  100 |             )\n  101 |         } else {\n  102 |             None\n  103 |         }\n  104 |     }","lines":13,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-farbfeld/src/decoder.rs#L92-L104"},{"ref":"crates/zune-farbfeld/src/decoder.rs:120-143","code":"  120 |     pub fn decode_into(&mut self, sink: &mut [u16]) -> Result<(), FarbFeldErrors> {\n  121 |         if !self.decoded_headers {\n  122 |             self.decode_headers()?;\n  123 |         }\n  124 |         let expected_len = self\n  125 |             .output_buffer_size()\n  126 |             .ok_or(FarbFeldErrors::Generic(\"Overflowed int\"))?;\n  127 | \n  128 |         if sink.len() < expected_len {\n  129 |             return Err(FarbFeldErrors::Generic(\"Too small output buffer size\"));\n  130 |         }\n  131 | \n  132 |         let sink = &mut sink[..expected_len];\n  133 | \n  134 |         // farbfeld uses big endian, and we want output in native endian\n  135 |         // so we read data as big endian and then convert it to native endian\n  136 |         // This should be a no-op in BE systems, a bswap in LE systems\n  137 |         for datum in sink.iter_mut() {\n  138 |             let pix = self.stream.get_u16_be_err()?;\n  139 |             *datum = pix;\n  140 |         }\n  141 | \n  142 |         Ok(())\n  143 |     }","lines":24,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-farbfeld/src/decoder.rs#L120-L143"},{"ref":"crates/zune-farbfeld/src/decoder.rs:155-171","code":"  155 |     pub fn decode(&mut self) -> Result<Vec<u16>, FarbFeldErrors> {\n  156 |         self.decode_headers()?;\n  157 | \n  158 |         let size = FARBFELD_COLORSPACE\n  159 |             .num_components() /*RGBA*/\n  160 |             .checked_mul(self.width)\n  161 |             .ok_or(FarbFeldErrors::Generic(\"Overflowed int\"))?\n  162 |             .checked_mul(self.height)\n  163 |             .ok_or(FarbFeldErrors::Generic(\"Overflowed int\"))?;\n  164 | \n  165 |         // NOTE: This can be done via data.align() + decode_into()\n  166 |         // but that's unsafe, and doesn't please the Rust gods\n  167 |         let mut data = vec![0; size];\n  168 | \n  169 |         self.decode_into(&mut data)?;\n  170 |         Ok(data)\n  171 |     }","lines":17,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-farbfeld/src/decoder.rs#L155-L171"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The SIMD remainder/tail handling in the grayscale conversion is wrong. After the\nchunked loop, the leftover element count is `rem = r.len() % CHUNK_SIZE`, and the\nremainder should start at `start = r.len() - rem` for all four slices. Instead the\nsource slices are sliced from `c_start = r.len() - (rem / 3)`, which is a different\n(smaller) offset. The scalar fallback then zips `c1`/`c2`/`c3` (length `rem/3`) with\n`gr[start..]` (length `rem`); because `zip` stops at the shorter iterator, only\n`rem/3` of the `rem` tail output pixels are written. The remaining `rem - rem/3`\noutput pixels are left at whatever value the output channel was allocated with\n(zero). This corrupts the trailing pixels of any RGB->grayscale conversion whose\npixel count is not a multiple of the SIMD chunk size, whenever the `avx2`/`sse41`\nfeature is enabled and detected at runtime. It is a copy-paste of the same wrong\nexpression in both files.","fix":"Use the same start offset for the source slices and the output, e.g.\n`let c1 = &r[start..]; let c2 = &g[start..]; let c3 = &b[start..];`\nand pass `&mut gr[start..]`. Remove the bogus `c_start = r.len() - (rem / 3)`.","locations":[{"ref":"crates/zune-image/src/core_filters/colorspace/grayscale/avx2.rs:76-87","code":"   76 |     if r.len() % CHUNK_SIZE != 0 {\n   77 |         // do the remainder\n   78 |         let rem = r.len() % CHUNK_SIZE;\n   79 |         let start = r.len() - rem;\n   80 |         let c_start = r.len() - (rem / 3);\n   81 | \n   82 |         let c1 = &r[c_start..];\n   83 |         let c2 = &g[c_start..];\n   84 |         let c3 = &b[c_start..];\n   85 | \n   86 |         convert_rgb_to_grayscale_scalar(c1, c2, c3, &mut gr[start..], 255);\n   87 |     }","lines":12,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/core_filters/colorspace/grayscale/avx2.rs#L76-L87"},{"ref":"crates/zune-image/src/core_filters/colorspace/grayscale/sse41.rs:74-85","code":"   74 |     if r.len() % CHUNK_SIZE != 0 {\n   75 |         // assume r ,g and b are equal lengths.\n   76 |         let rem = r.len() % CHUNK_SIZE;\n   77 |         let start = r.len() - rem;\n   78 |         let c_start = r.len() - (rem / 3);\n   79 | \n   80 |         let c1 = &r[c_start..];\n   81 |         let c2 = &g[c_start..];\n   82 |         let c3 = &b[c_start..];\n   83 | \n   84 |         convert_rgb_to_grayscale_scalar(c1, c2, c3, &mut gr[start..], 255);\n   85 |     }","lines":12,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/core_filters/colorspace/grayscale/sse41.rs#L74-L85"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The buffer-size guard in `u16_to_an_endian` is inverted. `length` is the number of\noutput bytes required (`channels[0].len() * channels.len()`). The check\n`if length < into.len() { return Err(BufferTooSmall) }` fires when the supplied\nbuffer is *larger* than needed (wrongly rejecting a valid call), and does NOT fire\nwhen the buffer is *smaller* than needed. With a too-small `into`, the function\nproceeds and the various `chunks_exact_mut` loops silently produce truncated output\n(only `into.len()` bytes get written) while the function still returns `Ok(length)`,\nreporting more bytes than were actually written. The condition is backwards and the\nfield naming (`expected`/`actual`) is also swapped relative to its meaning.","fix":"Change the guard to `if into.len() < length { return Err(ChannelErrors::BufferTooSmall { expected: length, actual: into.len() }); }`.","locations":[{"ref":"crates/zune-image/src/frame.rs:413-419","code":"  413 |         let length = self.channels[0].len() * self.channels.len();\n  414 |         if length < into.len() {\n  415 |             return Err(ChannelErrors::BufferTooSmall {\n  416 |                 expected: length,\n  417 |                 actual: into.len(),\n  418 |             });\n  419 |         }","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/frame.rs#L413-L419"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`trc_linear` (the `TransferFunction::Linear` transfer curve, used for both\n`linearize` and `gamma`) is implemented as `v.min(1.).min(0.)`. `min` with 0.0\nforces the result to <= 0.0 for every input, so any non-negative pixel maps to\n0.0. The Linear (identity) transfer should clamp to [0,1], i.e.\n`v.max(0.0).min(1.0)`. As written, applying a `TransferCurve` with\n`TransferFunction::Linear` (reachable via `FilterExt::transfer_curve` and the\nLUT builders in transfer_curve.rs) zeroes the entire image.","fix":"Replace `v.min(1.).min(0.)` with `v.max(0.0).min(1.0)` (clamp to the unit range).","locations":[{"ref":"crates/zune-imageprocs/src/transfer_curve/trc.rs:222-225","code":"  222 | /// Gamma transfer function for HLG\n  223 | pub fn trc_linear(v: f32) -> f32 {\n  224 |     v.min(1.).min(0.)\n  225 | }","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/transfer_curve/trc.rs#L222-L225"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`from_numpy` accepts `uint32` numpy arrays (the `dims == 2` branch at lines 835-841 and the\n`dims == 3` branch at lines 873-879 explicitly downcast to `PyArray2<u32>` / `PyArray3<u32>` and\ncall `convert_2d` / `convert_3d`). However neither `convert_2d` nor `convert_3d` has a `TypeId`\nbranch for `u32`: they only match `u8`, `u16`, `f32` and `f64`. A `u32` array therefore falls\nthrough to the final error return (\"The type ... is not supported\") instead of being ingested.\nThe public docstring at line 799 explicitly promises `uint32 -> u16 via a saturating cast`, so the\ndocumented behaviour is unimplemented and the dedicated downcast code is dead. Users passing a\nperfectly valid uint32 array get a confusing \"not supported\" error.","fix":"Either add a `u32` branch to `convert_2d`/`convert_3d` that performs the saturating cast to `u16`\n(matching the documentation), or remove the `u32` downcast arms and the doc claim. Given the doc\ncontract, add something like:\n`if TypeId::of::<T>() == TypeId::of::<u32>() { let dc = numpy.downcast::<PyArray2<u32>>()?.try_readonly()?;\nlet v: Vec<u16> = dc.as_slice()?.iter().map(|&x| x.min(u32::from(u16::MAX)) as u16).collect();\nreturn Ok(ZImage::from_u16(&v, dims[1], dims[0], ZColorSpace::Luma)); }`.","locations":[{"ref":"crates/zune-python/src/py_image.rs:667-710","code":"  667 | #[allow(clippy::cast_possible_truncation)]\n  668 | fn convert_2d<T: Element + 'static>(numpy: &Bound<'_, PyArray2<T>>) -> PyResult<ZImage> {\n  669 |     let dims = numpy.shape();\n  670 |     if TypeId::of::<T>() == TypeId::of::<u8>() {\n  671 |         let downcasted: &Bound<'_, PyArray2<u8>> = numpy.downcast()?;\n  672 |         let dc = downcasted.try_readonly()?;\n  673 |         let bytes = dc.as_slice()?;\n  674 |         return Ok(ZImage::from_u8(bytes, dims[1], dims[0], ZColorSpace::Luma));\n  675 |     }\n  676 |     if TypeId::of::<T>() == TypeId::of::<u16>() {\n  677 |         let downcasted: &Bound<'_, PyArray2<u16>> = numpy.downcast()?;\n  678 |         let dc = downcasted.try_readonly()?;\n  679 |         let bytes = dc.as_slice()?;\n  680 |         return Ok(ZImage::from_u16(bytes, dims[1], dims[0], ZColorSpace::Luma));\n  681 |     }\n  682 |     if TypeId::of::<T>() == TypeId::of::<f32>() {\n  683 |         let downcasted: &Bound<'_, PyArray2<f32>> = numpy.downcast()?;\n  684 | \n  685 |         let dc = downcasted.try_readonly()?;\n  686 |         let bytes = dc.as_slice()?;\n  687 |         return Ok(ZImage::from_f32(bytes, dims[1], dims[0], ZColorSpace::Luma));\n  688 |     }\n  689 |     if TypeId::of::<T>() == TypeId::of::<f64>() {\n  690 |         warn!(\"The library doesn't natively support f64, the data will be converted to f32\");\n  691 |         let downcasted: &Bound<'_, PyArray2<f64>> = numpy.downcast()?;\n  692 | \n  693 |         let dc = downcasted.try_readonly()?;\n  694 |         let bytes = dc\n  695 |             .as_slice()?\n  696 |             .iter()\n  697 |             .map(|x| *x as f32)\n  698 |             .collect::<Vec<f32>>();\n  699 |         return Ok(ZImage::from_f32(\n  700 |             &bytes,\n  701 |             dims[1],\n  702 |             dims[0],\n  703 |             ZColorSpace::Luma\n  704 |         ));\n  705 |     }\n  706 |     Err(PyErr::new::<PyException, _>(format!(\n  707 |         \"The type {:?} is not supported supported types are u16,u8, and f32  (the types f64 is converted to f32)\",\n  708 |         numpy.dtype()\n  709 |     )))\n  710 | }","lines":44,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-python/src/py_image.rs#L667-L710"},{"ref":"crates/zune-python/src/py_image.rs:712-796","code":"  712 | #[allow(clippy::cast_possible_truncation)]\n  713 | pub fn convert_3d<T: Element + 'static>(\n  714 |     numpy: &Bound<'_, PyArray3<T>>, suggested_colorspace: Option<ColorSpace>\n  715 | ) -> PyResult<ZImage> {\n  716 |     let dims = numpy.shape();\n  717 |     let mut expected_colorspace: ZColorSpace = match dims[2] {\n  718 |         1 => ZColorSpace::Luma,\n  719 |         2 => ZColorSpace::LumaA,\n  720 |         3 => ZColorSpace::RGB,\n  721 |         4 => ZColorSpace::RGBA,\n  722 |         _ => {\n  723 |             return Err(PyErr::new::<PyException, _>(format!(\n  724 |                 \"The dimension {:?} is not supported\",\n  725 |                 numpy.dtype()\n  726 |             )));\n  727 |         }\n  728 |     };\n  729 |     if let Some(x) = suggested_colorspace {\n  730 |         let c: ZColorSpace = x.to_colorspace();\n  731 |         if c.num_components() != dims[2] {\n  732 |             return Err(PyErr::new::<PyException, _>(format!(\n  733 |                 \"The specified colorspace {:?} does not match the elements in the third dimension, expected a shape of ({},{},{}) for {:?} but found ({},{},{})\", c,\n  734 |                 dims[1], dims[0], c.num_components(), c, dims[0], dims[1], dims[2]\n  735 |             )));\n  736 |         }\n  737 |         expected_colorspace = c;\n  738 |     }\n  739 | \n  740 |     if TypeId::of::<T>() == TypeId::of::<u8>() {\n  741 |         let downcasted: &Bound<'_, PyArray3<u8>> = numpy.downcast()?;\n  742 |         let dc = downcasted.try_readonly()?;\n  743 |         let bytes = dc.as_slice()?;\n  744 |         return Ok(ZImage::from_u8(\n  745 |             bytes,\n  746 |             dims[1],\n  747 |             dims[0],\n  748 |             expected_colorspace\n  749 |         ));\n  750 |     }\n  751 |     if TypeId::of::<T>() == TypeId::of::<u16>() {\n  752 |         let downcasted: &Bound<'_, PyArray3<u16>> = numpy.downcast()?;\n  753 |         let dc = downcasted.try_readonly()?;\n  754 |         let bytes = dc.as_slice()?;\n  755 |         return Ok(ZImage::from_u16(\n  756 |             bytes,\n  757 |             dims[1],\n  758 |             dims[0],\n  759 |             expected_colorspace\n  760 |         ));\n  761 |     }\n  762 |     if TypeId::of::<T>() == TypeId::of::<f32>() {\n  763 |         let downcasted: &Bound<'_, PyArray3<f32>> = numpy.downcast()?;\n  764 | \n  765 |         let dc = downcasted.try_readonly()?;\n  766 |         let bytes = dc.as_slice()?;\n  767 |         return Ok(ZImage::from_f32(\n  768 |             bytes,\n  769 |             dims[1],\n  770 |             dims[0],\n  771 |             expected_colorspace\n  772 |         ));\n  773 |     }\n  774 |     if TypeId::of::<T>() == TypeId::of::<f64>() {\n  775 |         warn!(\"The library doesn't natively support f64, the data will be converted to f32\");\n  776 |         let downcasted: &Bound<'_, PyArray3<f64>> = numpy.downcast()?;\n  777 | \n  778 |         let dc = downcasted.try_readonly()?;\n  779 |         let bytes = dc\n  780 |             .as_slice()?\n  781 |             .iter()\n  782 |             .map(|x| *x as f32)\n  783 |             .collect::<Vec<f32>>();\n  784 |         return Ok(ZImage::from_f32(\n  785 |             &bytes,\n  786 |             dims[1],\n  787 |             dims[0],\n  788 |             expected_colorspace\n  789 |         ));\n  790 |     }\n  791 | \n  792 |     Err(PyErr::new::<PyException, _>(format!(\n  793 |         \"The type {:?} is not supported supported types are u16,u8, and f32  (the types f64 is converted to f32)\",\n  794 |         numpy.dtype()\n  795 |     )))\n  796 | }","lines":85,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-python/src/py_image.rs#L712-L796"},{"ref":"crates/zune-python/src/py_image.rs:810-813","code":"  810 | /// # Supported types\n  811 | /// - `float32`,`uint8`,`uint16` - Data is ingested as is\n  812 | ///  - float64` - Image is converted into f32 type\n  813 | /// - `uint32`  - Image is converted into u16 type using a saturating cast","lines":4,"link":"https://github.com/etemesi25 {"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ZReader::peek_at` rewinds by the wrong amount on the oversized-request error\npath. When `num_bytes > 20 MiB`, the code does `self.rewind(num_bytes)?` and\nreturns an error, but at that point it has only advanced the stream by `position`\n(via the earlier `self.skip(position)`), not by `num_bytes`. Rewinding by\n`num_bytes` moves the cursor to an incorrect (too-early, or saturated-to-zero)\nlocation, corrupting subsequent reads instead of restoring the original position.","fix":"On the oversize path, restore the original position with `self.rewind(position)?`\n(only if `position != 0`), matching the other error/success paths, rather than\n`self.rewind(num_bytes)`.","locations":[{"ref":"crates/zune-core/src/bytestream/reader.rs:252-282","code":"  252 |     #[inline]\n  253 |     pub fn peek_at(&mut self, position: usize, num_bytes: usize) -> Result<&[u8], ZByteIoError> {\n  254 |         // short circuit for zero\n  255 |         // important since implementations like File will\n  256 |         // cause a syscall on skip\n  257 |         if position != 0 {\n  258 |             // skip position bytes from start\n  259 |             self.skip(position)?;\n  260 |         }\n  261 |         if num_bytes > 20 * 1024 * 1024 {\n  262 |             self.rewind(num_bytes)?;\n  263 |             // resize of 20 MBs, skipping too much, so panic\n  264 |             return Err(ZByteIoError::Generic(\"Too many bytes skipped\"));\n  265 |         }\n  266 |         // resize buffer\n  267 |         self.temp_buffer.resize(num_bytes, 0);\n  268 |         // read bytes\n  269 |         match self.inner.peek_exact_bytes(&mut self.temp_buffer[..]) {\n  270 |             Ok(_) => {\n  271 |                 // rewind back to where we were\n  272 |                 if position != 0 {\n  273 |                     self.rewind(position)?;\n  274 |                 }\n  275 |                 Ok(&self.temp_buffer)\n  276 |             }\n  277 |             Err(e) => {\n  278 |                 self.rewind(position)?;\n  279 |                 Err(e)\n  280 |             }\n  281 |         }\n  282 |     }","lines":31,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-core/src/bytestream/reader.rs#L252-L282"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`NeighborTracker::set_pred_mode`, `set_part_mode`, and `set_nonzero_coefficient` iterate\n`cx in unit_x..(unit_x + width_in_units)` and index `self.blocks.get_mut(offset + cx)` where\n`offset = cy * self.width_in_units`. When a block straddles the right frame edge, `cx` exceeds\n`self.width_in_units`, so `offset + cx` silently lands in the NEXT row's data (a valid but wrong\nindex) instead of being skipped. Other setters (set_intra_mode, update_cu_info, update_qp,\nupdate_block_depth) correctly check `gx < self.width_in_units && gy < self.height_in_units`. The\ninconsistency corrupts neighbor state for edge blocks and can affect deblocking/intra decisions.","fix":"Add the same `gx < self.width_in_units && gy < self.height_in_units` guard used by the other\nsetters, computing gx/gy explicitly rather than relying on `get_mut(offset + cx)` to catch only\ntotal-length overruns.","locations":[{"ref":"crates/zune-heic/src/hevc_decoder/neighbor_tracker.rs:303-320","code":"  303 |     pub fn set_pred_mode(&mut self, x: usize, y: usize, log2_blk_size: u8, mode: PredMode) {\n  304 |         let unit_x = x >> self.log2_unit_size;\n  305 |         let unit_y = y >> self.log2_unit_size;\n  306 | \n  307 |         // Calculate how many 8x8 units we need to fill\n  308 |         // (e.g., a 32x32 block is 4 units wide)\n  309 |         let width_in_units = 1 << (log2_blk_size - self.log2_unit_size);\n  310 | \n  311 |         for cy in unit_y..(unit_y + width_in_units) {\n  312 |             let offset = cy * self.width_in_units;\n  313 |             for cx in unit_x..(unit_x + width_in_units) {\n  314 |                 // Now setting the actual field inside your blocks vector\n  315 |                 if let Some(block) = self.blocks.get_mut(offset + cx) {\n  316 |                     block.pred_mode = mode;\n  317 |                 }\n  318 |             }\n  319 |         }\n  320 |     }","lines":18,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/neighbor_tracker.rs#L303-L320"},{"ref":"crates/zune-heic/src/hevc_decoder/neighbor_tracker.rs:337-350","code":"  337 |     pub fn set_part_mode(&mut self, x: usize, y: usize, log2_blk_size: u8, mode: PartMode) {\n  338 |         let unit_x = x >> self.log2_unit_size;\n  339 |         let unit_y = y >> self.log2_unit_size;\n  340 |         let width_in_units = 1 << (log2_blk_size - self.log2_unit_size);\n  341 | \n  342 |         for cy in unit_y..(unit_y + width_in_units) {\n  343 |             let offset = cy * self.width_in_units;\n  344 |             for cx in unit_x..(unit_x + width_in_units) {\n  345 |                 if let Some(block) = self.blocks.get_mut(offset + cx) {\n  346 |                     block.part_mode = mode;\n  347 |                 }\n  348 |             }\n  349 |         }\n  350 |     }","lines":14,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/neighbor_tracker.rs#L337-L350"},{"ref":"crates/zune-heic/src/hevc_decoder/neighbor_tracker.rs:428-443","code":"  428 |     pub fn set_nonzero_coefficient(&mut self, x: usize, y: usize, log2_trafo_size: u8) {\n  429 |         let unit_x = x >> self.log2_unit_size;\n  430 |         let unit_y = y >> self.log2_unit_size;\n  431 | \n  432 |         // How many 8x8 units wide is this TU?\n  433 |         let width_in_units = 1 << (log2_trafo_size - self.log2_unit_size);\n  434 | \n  435 |         for cy in unit_y..(unit_y + width_in_units) {\n  436 |             let offset = cy * self.width_in_units;\n  437 |             for cx in unit_x..(unit_x + width_in_units) {\n  438 |                 if let Some(block) = self.blocks.get_mut(offset + cx) {\n  439 |                     block.has_nonzero_coeff = true;\n  440 |                 }\n  441 |             }\n
