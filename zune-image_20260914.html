 = image.clone();\n   34 |         let ignore_alpha = true;\n   35 | \n   36 |         match depth.bit_type() {\n   37 |             BitType::U8 => {\n   38 |                 image.par_process_regions_out_of_place::<u8, _>(\n   39 |                     &mut dest_image,\n   40 |                     ignore_alpha,\n   41 |                     |region| {\n   42 |                         spatial_region(region, self.radius, self.operation);\n   43 |                     },\n   44 |                 )?;\n   45 |             }\n   46 |             BitType::U16 => {\n   47 |                 image.par_process_regions_out_of_place::<u16, _>(\n   48 |                     &mut dest_image,\n   49 |                     ignore_alpha,\n   50 |                     |region| {\n   51 |                         spatial_region(region, self.radius, self.operation);\n   52 |                     },\n   53 |                 )?;\n   54 |             }\n   55 |             d => return Err(ImageErrors::ImageOperationNotImplemented(self.name(), d)),\n   56 |         }\n   57 | \n   58 |         *image = dest_image;","lines":27,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/spatial.rs#L32-L58"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In the one-shot deflate fast loop, `start_deflate_block_inner` checks output-buffer\nheadroom inside the inner `'sequence` loop with `dest_offset + FASTLOOP_MAX_BYTES_WRITTEN\n> out_block.len()` and, when short, resizes by only `FASTLOOP_MAX_BYTES_WRITTEN +\nRESIZE_BY` (decoder.rs:721-724). Because the growth increment is a small fixed amount\n(~4KB + ~280) rather than geometric, decoding a large stream into the default\nsize_hint-sized vector triggers many repeated `Vec::resize` reallocations/copies in the\nhottest loop. A geometric growth policy (e.g. doubling) would amortize reallocation cost.\nThis is a throughput concern, not a correctness one.","fix":"Grow the output buffer geometrically (e.g. `out_block.len().max(... ) * 2` capped at the\nconfigured limit) rather than by a fixed `RESIZE_BY` step, so repeated growth is O(log n)\nreallocations instead of O(n).\"","locations":[{"ref":"crates/zune-inflate/src/decoder.rs:714-719","code":"  714 |                         // Resize the output vector here to ensure we can always have\n  715 |                         // enough space for sloppy copies\n  716 |                         if dest_offset + FASTLOOP_MAX_BYTES_WRITTEN > out_block.len() {\n  717 |                             let curr_len = out_block.len();\n  718 |                             out_block.resize(curr_len + FASTLOOP_MAX_BYTES_WRITTEN + RESIZE_BY, 0)\n  719 |                         }","lines":6,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-inflate/src/decoder.rs#L714-L719"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`Channel::clone` allocates `new_with_capacity_and_type(self.capacity(), ...)` then\ncalls `extend_unchecked`, which re-checks `has_capacity` and may even reallocate; more\nimportantly the clone copies `self.capacity()` worth of allocation but then extends\nbased on length, which is fine, yet `Frame::clone`'s threaded path creates channels\nwith capacity 1 and immediately `realloc`s each to the full length - two allocations\nper channel (initial 1-byte alloc + realloc) on every animated/large clone.","fix":"Allocate the new channels at the final size up front (e.g.\n`Channel::new_with_capacity_and_type(old_alias.len(), ...)`) to avoid the extra\n1-byte alloc + realloc round-trip per channel.","locations":[{"ref":"crates/zune-image/src/channel.rs:114-130","code":"  114 | impl Clone for Channel {\n  115 |     fn clone(&self) -> Self {\n  116 |         let mut new_channel =\n  117 |             Channel::new_with_capacity_and_type(self.capacity(), self.size_of, self.type_id);\n  118 |         // copy items by calling extend\n  119 | \n  120 |         // Safety:\n  121 |         //\n  122 |         // no-slop-bytes: U8's cannot have slop bytes\n  123 |         // ptr is valid since we own it, and memory is allocated by us.\n  124 |         //\n  125 |         unsafe {\n  126 |             new_channel.extend_unchecked(self.reinterpret_as_unchecked::<u8>());\n  127 |         }\n  128 |         new_channel\n  129 |     }\n  130 | }","lines":17,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/channel.rs#L114-L130"},{"ref":"crates/zune-image/src/frame.rs:70-94","code":"   70 |                 // create new channels\n   71 |                 let mut new_channels =\n   72 |                     vec![Channel::new_with_capacity_and_type(1, size_of, bit_type); channels.len()];\n   73 | \n   74 |                 std::thread::scope(|c| {\n   75 |                     for (old, new) in channels.iter().zip(new_channels.iter_mut()) {\n   76 |                         c.spawn(|| {\n   77 |                             let old_alias = unsafe { old.alias() };\n   78 |                             // make enough space to fit the new array\n   79 |                             unsafe {\n   80 |                                 // Safety: This is only unsafe since we are reallocating the\n   81 |                                 // old array\n   82 |                                 new.realloc(old_alias.len());\n   83 |                                 // Safety: We have guaranteed the new array has this size\n   84 |                                 // and we double in the function (capacity >=len)\n   85 |                                 new.set_len(old_alias.len());\n   86 |                             }\n   87 |                             let new_alias = unsafe { new.alias_mut() };\n   88 | \n   89 |                             assert_eq!(old_alias.len(), new_alias.len());\n   90 |                             // now copy\n   91 |                             new_alias.copy_from_slice(old_alias);\n   92 |                         });\n   93 |                     }\n   94 |                 });","lines":25,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/frame.rs#L70-L94"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`icc_profile` allocates a 256-entry `[Option<&ICCChunk>; 256]` on the stack and is otherwise fine, but `reassemble_extended_xmp` sorts and re-scans `extended_xmp_segments` on every APP1 marker (it is called from `handle_known_marker` whenever the segment list is non-empty), giving O(n^2 log n) behaviour across many extended-XMP markers in a crafted file. Not a security issue but a needless quadratic on attacker-controlled marker counts.","fix":"Only attempt reassembly once headers are complete (or once a full set is plausibly present) rather than re-sorting/re-scanning after every APP1 segment.","locations":[{"ref":"crates/zune-jpeg/src/decoder.rs:1063-1108","code":" 1063 |     fn reassemble_extended_xmp(&mut self) {\n 1064 |         if self.extended_xmp_segments.is_empty() {\n 1065 |             return;\n 1066 |         }\n 1067 | \n 1068 |         // Sort by offset\n 1069 |         self.extended_xmp_segments.sort_by_key(|a| a.offset);\n 1070 | \n 1071 |         let guid = &self.extended_xmp_segments[0].guid;\n 1072 |         let total_size = self.extended_xmp_segments[0].total_size;\n 1073 | \n 1074 |         // Check for consistency\n 1075 |         for segment in &self.extended_xmp_segments {\n 1076 |             if &segment.guid != guid || segment.total_size != total_size {\n 1077 |                 error!(\"Inconsistent Extended XMP segments\");\n 1078 |                 self.extended_xmp_segments.clear();\n 1079 |                 return;\n 1080 |             }\n 1081 |         }\n 1082 | \n 1083 |         let mut rolling_offset = 0;\n 1084 |         let mut complete = true;\n 1085 | \n 1086 |         for segment in &self.extended_xmp_segments {\n 1087 |             if segment.offset != rolling_offset {\n 1088 |                 // Gap or overlap\n 1089 |                 complete = false;\n 1090 |                 break;\n 1091 |             }\n 1092 |             rolling_offset += segment.data.len() as u32;\n 1093 |         }\n 1094 | \n 1095 |         if complete && rolling_offset == total_size {\n 1096 |             let mut result = Vec::with_capacity(total_size as usize);\n 1097 |             for segment in &self.extended_xmp_segments {\n 1098 |                 result.extend_from_slice(&segment.data);\n 1099 |             }\n 1100 |             self.info.extended_xmp = Some(result);\n 1101 |             self.info.extended_xmp_guid = Some(guid.clone());\n 1102 |             self.extended_xmp_segments.clear();\n 1103 |         } else if rolling_offset > total_size {\n 1104 |             error!(\"Extended XMP overflow\");\n 1105 |             self.extended_xmp_segments.clear();\n 1106 |         }\n 1107 |         // Else: Incomplete, wait for more.\n 1108 |     }","lines":46,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/decoder.rs#L1063-L1108"},{"ref":"crates/zune-jpeg/src/decoder.rs:1218-1222","code":" 1218 |     fn handle_known_marker(&mut self, n: Marker) -> Result<MarkerStep, DecodeErrors> {\n 1219 |         self.parse_marker_inner(n)?;\n 1220 | \n 1221 |         if !self.extended_xmp_segments.is_empty() {\n 1222 |             self.reassemble_extended_xmp();","lines":5,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/decoder.rs#L1218-L1222"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"medium","description":"`BmpDecoder::is_alpha` is initialized to `false` in the constructor and is never assigned\n`true` anywhere in the crate. As a result the alpha-aware palette expansion branches\n(`expand_palette` / `expand_palette_from_remaining_bytes` line 1041 and 1084) and the\nRGBA stride calculation at line 947 (`(3 + usize::from(self.is_alpha)) * self.width`) are\ndead: paletted output is always treated as 3 components. If a paletted BMP with a\nmeaningful alpha palette is ever intended to emit RGBA, this silently drops alpha.","fix":"Either set `self.is_alpha` from the palette/format when RGBA palette output is desired and\nmake `BmpPixelFormat::PAL8` map to 4 components accordingly, or delete the `is_alpha` field\nand its unreachable branches to avoid the false impression that alpha palettes are honored.","locations":[{"ref":"crates/zune-bmp/src/decoder.rs:208","code":"  208 |     is_alpha:             bool,","lines":1,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bmp/src/decoder.rs#L208"},{"ref":"crates/zune-bmp/src/decoder.rs:266","code":"  266 |             is_alpha: false,","lines":1,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bmp/src/decoder.rs#L266"},{"ref":"crates/zune-bmp/src/decoder.rs:943-945","code":"  943 |                     for out_bytes in\n  944 |                         buf.rchunks_exact_mut((3 + usize::from(self.is_alpha)) * self.width)\n  945 |                     {","lines":3,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bmp/src/decoder.rs#L943-L945"},{"ref":"crates/zune-bmp/src/decoder.rs:1040-1057","code":" 1040 |         if self.is_alpha {\n 1041 |             // bmp rounds up each line to be a multiple of 4, padding the end if necessary\n 1042 | {"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The ICC-color branch of the JPEG2000 decoder computes a `colorspace`, sets\n`self.colorspace`, stores `icc_bytes = Some(profile)`, but then unconditionally\nreturns `Err(\"Unsupported ICC color type\")`. As a result the colorspace mapping and\nthe `icc_bytes` assignment are dead - the later `if let Some(icc_ref) = icc_bytes`\nblock that copies ICC into the image metadata is never reached because the function\nalready returned. Either ICC images are intentionally unsupported (then the dead\nmapping code should be removed) or the early `return Err` is a bug that disables ICC\nJPEG2000 entirely.","fix":"Decide the intended behavior: if ICC is unsupported, drop the colorspace/icc_bytes\ncomputation; if it should be supported, remove the early `return Err` and let the\nfunction fall through to build the image and attach the ICC chunk.","locations":[{"ref":"crates/zune-image/src/codecs/jpeg_2000.rs:55-95","code":"   55 |             hayro_jpeg2000::ColorSpace::Icc {\n   56 |                 profile,\n   57 |                 num_channels,\n   58 |             } => {\n   59 |                 // todo, #[cae] (this is best effort),  we propagate ICC to the top to be used\n   60 |                 // by any caller/subsequent operations that may make this into something that\n   61 |                 // makes sense\n   62 |                 let colorspace = match num_channels {\n   63 |                     1 => ColorSpace::Luma,\n   64 |                     2 => ColorSpace::LumaA,\n   65 |                     3 => ColorSpace::RGB,\n   66 |                     4 => ColorSpace::RGBA,\n   67 |                     _ => ColorSpace::MultiBand(NonZeroU32::new(u32::from(*num_channels)).unwrap()),\n   68 |                 };\n   69 |                 #[allow(unused_assignments)]\n   70 |                 {\n   71 |                     icc_bytes = Some(profile);\n   72 |   88 |             0xD8 => Some(SOI),\n   89 |             0xD9 => Some(EOI),\n   90 |             0xDA => Some(SOS),\n   91 |             0xDB => Some(DQT),\n   92 |             0xDC => Some(DNL),\n   93 |             0xDD => Some(DRI),\n   94 |             0xE0 => Some(APP(0)),\n   95 |             0xE1 => Some(APP(1)),\n   96 |             0xE2 => Some(APP(2)),\n   97 |             0xED => Some(APP(13)),\n   98 |             0xEE => Some(APP(14)),\n   99 |             _ => Some(UNKNOWN(n))\n  100 |         }\n  101 |     }","lines":42,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/marker.rs#L60-L101"},{"ref":"crates/zune-jpeg/src/mcu_prog.rs:1112-1115","code":" 1112 |             if r != 0 {\n 1113 |                 return Marker::from_u8(r)\n 1114 |                     .ok_or_else(|| DecodeErrors::Format(format!(\"Unknown marker 0xFF{r:X}\")));\n 1115 |             }","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/mcu_prog.rs#L1112-L1115"}]},

degree\n  319 |         _ => unreachable!(),\n  320 |     };\n  321 | \n  322 |     let eo_offsets: [i16; 5] = [\n  323 |         i16::from(offsets[0]), // Category 1 (Valley)\n  324 |         i16::from(offsets[1]), // Category 2 (Half-Valley)\n  325 |         0,                     // Category 0 (Plane)\n  326 |         i16::from(offsets[2]), // Category 3 (Half-Peak)\n  327 |         i16::from(offsets[3]), // Category 4 (Peak)\n  328 |     ];\n  329 | \n  330 |     let stride = plane.stride as isize;\n  331 | \n  332 |     let sign = |val: i32| -> isize {\n  333 |         match val.cmp(&0) {\n  334 |             Ordering::Less => -1,\n  335 |             Ordering::Equal => 0,\n  336 |             Ordering::Greater => 1,\n  337 |         }\n  338 |     };\n  339 | \n  340 |     for y in 0..h {\n  341 |         let abs_y = y0 + y;\n  342 |         for x in 0..w {\n  343 |             let abs_x = x0 + x;\n  344 | \n  345 |             // Spec 8.7.3.2.3: Do not apply if neighbors cross the picture boundaries.\n  346 |             if (abs_x as isize + dx1 < 0)\n  347 |                 || (abs_x as isize + dx2 >= pic_width as isize)\n  348 |                 || (abs_y as isize + dy1 < 0)\n  349 |                 || (abs_y as isize + dy2 >= pic_height as isize)\n  350 |             {\n  351 |                 continue;\n  352 |             }\n  353 | \n  354 |             let c_idx = offset_plane(plane, abs_x, abs_y);\n  355 |             let n1_idx = (c_idx as isize + dy1 * stride + dx1) as usize;\n  356 |             let n2_idx = (c_idx as isize + dy2 * stride + dx2) as usize;\n  357 | \n  358 |             let c_val = i32::from(plane.pixels[c_idx]);\n  359 |             let n1_val = i32::from(plane.pixels[n1_idx]);\n  360 |             let n2_val = i32::from(plane.pixels[n2_idx]);\n  361 | \n  362 |             let edge_idx = (2 + sign(c_val - n1_val) + sign(c_val - n2_val)) as usize;\n  363 |             let offset = eo_offsets[edge_idx];\n  364 | \n  365 |             if offset != 0 {\n  366 |                 plane.pixels[c_idx] = (c_val as i16 + offset).clamp(0, 255) as u8;\n  367 |             }\n  368 |         }\n  369 |     }\n  370 | }","lines":171,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/quadtree/sao.rs#L200-L370"},{"ref":"crates/zune-heic/src/hevc_decoder/quadtree.rs:158-180","code":"  158 |     // apply deblocking\n  159 |     if true {\n  160 |         // perf wise\n  161 |         // with deblocking     139.33 ms\n  162 |         // without deblocking  129.64 ms\n  163 |         //\n  164 |         // So deblocking does have a speed hit\n  165 |         // but its negligible imo\n  166 |         let rf_clone = raw_frame.clone();\n  167 |         deblock_frame(\n  168 |             &rf_clone,\n  169 |             ctx.neighbor_tracker,\n  170 |             pps.cb_qp_offset as i8,\n  171 |             pps.cr_qp_offset as i8\n  172 |         );\n  173 |         // apply_sao_frame(\n  174 |         //     &raw_frame,\n  175 |         //     hevc_decoder.width,\n  176 |         //     hevc_decoder.height,\n  177 |         //     1 << sps.log2_ctb_size_y,\n  178 |         //     &ctx.ctb_sao_buffer\n  179 |         // )\n  180 |     }","lines":23,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/hevc_decoder/quadtree.rs#L158-L180"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`post_process_image` is a deprecated, permanently-broken stub that always returns an\nerror (\"Wrong function signature, use post_process_image_apng\"). It is re-exported from\nthe crate root (lib.rs:170) under `#[cfg(feature = \"std\")]`. It can never succeed and\nexists only for backwards compatibility; it adds a public symbol whose only behavior is\nto fail. Worth confirming it is still needed for the documented compatibility guarantee,\notherwise it is dead surface area.","fix":"If the compatibility window has passed, remove the deprecated `post_process_image`\nfunction and its re-export. Otherwise leave as-is but document that it is a no-op error\nstub (it already carries `#[deprecated]`).\"","locations":[{"ref":"crates/zune-png/src/apng.rs:126-137","code":"  126 | #[deprecated(\n  127 |     note = \"This function signature was wrong, but maintained for backwards compatibility, use post_process_image_apng instead\"\n  128 | )]\n  129 | #[allow(unused_variables, unused_mut)]\n  130 | pub fn post_process_image(\n  131 |     info: &PngInfo, colorspace: ColorSpace, frame_info: &FrameInfo, current_frame: &[u8],\n  132 |     prev_frame: Option<&[u8]>, output: &mut [u8], gamma: Option<f32>,\n  133 | ) -> Result<(), PngDecodeErrors> {\n  134 |     Err(PngDecodeErrors::GenericStatic(\n  135 |         \"Wrong function signature, use post_process_image_apng\",\n  136 |     ))\n  137 | }","lines":12,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-png/src/apng.rs#L126-L137"},{"ref":"crates/zune-png/src/lib.rs:168-170","code":"  168 | #[cfg(feature = \"std\")]\n  169 | #[allow(deprecated)]\n  170 | pub use apng::post_process_image;","lines":3,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-png/src/lib.rs#L168-L170"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`WasmImage::greet` (lib.rs:58-61) is an exported `#[wasm_bindgen]` no-op whose body is a commented-out\n`alert(...)`, and the `extern \"C\" { fn alert(s: &str); }` import (lines 53-56) is then unused. Both\nappear to be leftover scaffolding from the wasm-pack template. They bloat the generated JS bindings\nsurface for no functionality.","fix":"Delete `greet` and the unused `alert` extern import.","locations":[{"ref":"crates/zune-wasm/src/lib.rs:51-59","code":"   51 | #[wasm_bindgen]\n   52 | extern \"C\" {\n   53 |     fn alert(s: &str);\n   54 | }\n   55 | \n   56 | #[wasm_bindgen]\n   57 | pub fn greet() {\n   58 |     //alert(\"Hello, zune-wasm!\");\n   59 | }","lines":9,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-wasm/src/lib.rs#L51-L59"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment for `CompositeMethod::Src` states 'The destination is first\ncleared to opaque white (or max value), then the source is copied on top.' The\nimplementation (`composite_region`, Src arm) only copies the source over the\noverlapping region; pixels of the destination outside the source rectangle are\nleft unchanged and nothing is cleared to white. The documentation describes\nbehaviour the code does not implement.","fix":"Update the doc to describe the actual per-overlap copy behaviour, or implement the documented full-canvas clear if that is the intended Porter-Duff Src semantics.","locations":[{"ref":"crates/zune-imageprocs/src/composite.rs:20-23","code":"   20 |     /// source is copied on top.\n   21 |     Src,\n   22 |     /// Porter-Duff: keep destination unchanged. A no-op.\n   23 |     Dst,","lines":4,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/composite.rs#L20-L23"},{"ref":"crates/zune-imageprocs/src/composite.rs:309-315","code":"  309 |         CompositeMethod::Src => {\n  310 |             process_overlap!(|s_idx, d_idx| {\n  311 |                 for c in 0..region.channels.len() {\n  312 |                     region.channels[c][d_idx] = src_channels[c][s_idx];\n  313 |                 }\n  314 |             });\n  315 |         }","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/composite.rs#L309-L315"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The error message for an unsupported depth in the CLI depth parser says\n\"supported depths are 8 and 16\" but the match arm just above accepts 32\n(`32 => BitDepth::Float32`). The user-facing message is misleading - 32 is in fact\nsupported.","fix":"Update the message to \"supported depths are 8, 16 and 32\".","locations":[{"ref":"crates/zune-bin/src/cmd_parsers/operations.rs:184-196","code":"  184 |     } else if argument == \"depth\" {\n  185 |         let values = args.get_many::<u8>(argument).unwrap();\n  186 |         let indices = args.indices_of(argument).unwrap();\n  187 |         for (value, idx) in values.zip(indices) {\n  188 |             let depth = match value {\n  189 |                 8 => BitDepth::Eight,\n  190 |                 16 => BitDepth::Sixteen,\n  191 |                 32 => BitDepth::Float32,\n  192 |                 _ => return Err(format!(\"Unknown depth value {value}, supported depths are 8 and 16\")),\n  193 |             };\n  194 |             debug!(\"Parsed depth operation with depth of {value} at {idx}\");\n  195 |             parsed_ops.push((idx, Box::new(Depth::new(depth))));\n  196 |         }","lines":13,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bin/src/cmd_parsers/operations.rs#L184-L196"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comment on `decode_into_inner` is copy-pasted and self-contradictory: it says\n\"If `PRESERVE_RGBA` is true, data is in bgr(a) format\" but the const generic is named\n`PRESERVE_BGRA` (there is no `PRESERVE_RGBA`). Minor but misleading for maintainers.","fix":"Fix the parameter name in the doc to `PRESERVE_BGRA` and correct the wording.","locations":[{"ref":"crates/zune-bmp/src/decoder.rs:722-724","code":"  722 |     /// - If `PRESERVE_BGRA` is false, data is in rgb(a) format\n  723 |     /// - If `PRESERVE_RGBA` is true, data is in bgr(a) format\n  724 |     fn decode_into_inner<const PRESERVE_BGRA: bool>(","lines":3,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-bmp/src/decoder.rs#L722-L724"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"`ChannelErrors::UnalignedPointer` doc and the `Debug` impl describe alignment as \"16\"\n(\"rarely, since all allocations are aligned to 16\") and several safety comments in\nchannel.rs say data is aligned \"to 16 bytes\", but the actual `MIN_ALIGNMENT` constant\nis 64. The comments are stale relative to the code and misleading about the real\nalignment guarantee.","fix":"Update the comments to reference `MIN_ALIGNMENT` (64) instead of the hard-coded 16.","locations":[{"ref":"crates/zune-image/src/channel.rs:46-48","code":"   46 | pub enum ChannelErrors {\n   47 |     /// rarely, since all allocations are aligned to 16, but just in case\n   48 |     UnalignedPointer(usize, usize),","lines":3,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/channel.rs#L46-L48"},{"ref":"crates/zune-image/src/channel.rs:480-486","code":"  480 |         // safety:\n  481 |         //  - we confirmed that the type we are reinterpreting as\n  482 |         //    is the same type the channel was initialized with\n  483 |         //  - alignment is not an issue since we align all reads\n  484 |         // to 16 bytes(bytes, not bits), the highest type we have\n  485 |         // has an alignment of\n  486 |         Ok(unsafe { self.reinterpret_as_unchecked() })","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/channel.rs#L480-L486"},{"ref":"crates/zune-image/src/channel.rs:520-524","code":"  520 |         // Safety:\n  521 |         //  validity: We own the data\n  522 |         //  well aligned: You cannot have u8 having bad alignment\n  523 |         //\n  524 |         let new_slice = unsafe { std::slice::from_raw_parts_mut::<u8>(self.ptr, self.length) };","lines":5,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-image/src/channel.rs#L520-L524"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In `parse_huffman` the comment says \"third bit indicates whether the huffman encoding is DC or AC type\" but the code uses the upper nibble: `let dc_or_ac = (ht_info >> 4) & 0xF;`. The Tc/Th split is nibble-based (high nibble = class, low nibble = id), so the comment is wrong and misleading for a security-sensitive parser.","fix":"Reword the comment to \"high nibble is the table class (0=DC,1=AC), low nibble is the table id\".","locations":[{"ref":"crates/zune-jpeg/src/headers.rs:143-147","code":"  143 |             let ht_info = cursor.read_u8()?;\n  144 |             // third bit indicates whether the huffman encoding is DC or AC type\n  145 |             let dc_or_ac = (ht_info >> 4) & 0xF;\n  146 |             // Indicate the position of this table, should be less than 4;\n  147 |             let index = (ht_info & 0xF) as usize;","lines":5,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-jpeg/src/headers.rs#L143-L147"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`ycbcr_to_rgb_inner_16_scalar` and the six YUV->RGB coefficient constants (Y_CF, CR_CF, CB_CF,\nC_G_CR_COEF_1, C_G_CB_COEF_2, YUV_PREC, YUV_RND) plus the `clamp` helper are duplicated verbatim\nbetween `apple_videotoolbox.rs` and `hevc_decoder/utils.rs`. Two copies drift independently and\ndouble maintenance.","fix":"Keep one copy (in hevc_decoder/utils.rs) and have apple_videotoolbox.rs import it.","locations":[{"ref":"crates/zune-heic/src/apple_videotoolbox.rs:250-318","code":"  250 | pub(crate) const Y_CF: i16 = 16384;\n  251 | pub(crate) const CR_CF: i16 = 22970;\n  252 | pub(crate) const CB_CF: i16 = 29032;\n  253 | pub(crate) const C_G_CR_COEF_1: i16 = -11700;\n  254 | pub(crate) const C_G_CB_COEF_2: i16 = -5638;\n  255 | pub(crate) const YUV_PREC: i16 = 14;\n  256 | // Rounding const for YUV -> RGB conversion: floating equivalent 0.499(9).\n  257 | pub(crate) const YUV_RND: i16 = (1 << (YUV_PREC - 1)) - 1;\n  258 | \n  259 | fn clamp(a: i32) -> u8 {\n  260 |     a.clamp(0, 255) as u8\n  261 | }\n  262 | /// Convert a batch of 16 YCbCr pixels to RGB.\n  263 | ///\n  264 | /// This is a scalar fallback implementation used during pixel conversion.\n  265 | ///\n  266 | /// # Parameters\n  267 | ///\n  268 | /// - `BGRA`: If true, output is written as BGRA order instead of RGB.\n  269 | /// - `y`, `cb`, `cr`: Input YUV components (16 pixels)\n  270 | /// - `output`: Destination buffer\n  271 | /// - `pos`: Current write offset (updated after writing)\n  272 | ///\n  273 | /// # Panics\n  274 | ///\n  275 | /// Panics if output buffer is too small.\n  276 | pub fn ycbcr_to_rgb_inner_16_scalar<const BGRA: bool>(\n  277 |     y: &[i16; 16], cb: &[i16; 16], cr: &[i16; 16], output: &mut [u8], pos: &mut usize\n  278 | ) {\n  279 |     let (_, output_position) = output.split_at_mut(*pos);\n  280 | \n  281 |     // Convert into a slice with 48 elements\n  282 |     let opt: &mut [u8; 48] = output_position\n  283 |         .get_mut(0..48)\n  284 |         .expect(\"Slice to small cannot write\")\n  285 |         .try_into()\n  286 |         .unwrap();\n  287 | \n  288 |     for ((&y, (cb, cr)), out) in y\n  289 |         .iter()\n  290 |         .zip(cb.iter().zip(cr.iter()))\n  291 |         .zip(opt.chunks_exact_mut(3))\n  292 |     {\n  293 |         let cr = cr - 128;\n  294 |         let cb = cb - 128;\n  295 | \n  296 |         let y0 = i32::from(y) * i32::from(Y_CF) + i32::from(YUV_RND);\n  297 | \n  298 |         let r = (y0 + i32::from(cr) * i32::from(CR_CF)) >> YUV_PREC;\n  299 |         let g = (y0\n  300 |             + i32::from(cr) * i32::from(C_G_CR_COEF_1)\n  301 |             + i32::from(cb) * i32::from(C_G_CB_COEF_2))\n  302 |             >> YUV_PREC;\n  303 |         let b = (y0 + i32::from(cb) * i32::from(CB_CF)) >> YUV_PREC;\n  304 | \n  305 |         if BGRA {\n  306 |             out[0] = clamp(b);\n  307 |             out[1] = clamp(g);\n  308 |             out[2] = clamp(r);\n  309 |         } else {\n  310 |             out[0] = clamp(r);\n  311 |             out[1] = clamp(g);\n  312 |             out[2] = clamp(b);\n  313 |         }\n  314 |     }\n  315 | \n  316 |     // Increment pos\n  317 |     *pos += 48;\n  318 | }","lines":69,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-heic/src/apple_videotoolbox.rs#L250-L318"},{"ref":"crates/zune-heic/src/hevc_decoder/utils.rs:89-156","code":"   89 | pub(crate) const Y_CF: i16 = 16384;\n   90 | pub(crate) const CR_CF: i16 = 22970;\n   91 | pub(crate) const CB_CF: i16 = 29032;\n   92 | pub(crate) const C_G_CR_COEF_1: i16 = -11700;\n   93 | pub(crate) const C_G_CB_COEF_2: i16 = -5638;\n   94 | pub(crate) const YUV_PREC: i16 = 14;\n   95 | // Rounding const for YUV -> RGB conversion: floating equivalent 0.499(9).\n   96 | pub(crate) const YUV_RND: i16 = (1 << (YUV_PREC - 1)) - 1;\n {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`GifDecoder` is a non-functional stub presented as a decoder. `decode_into` decodes no\npixel data at all: after computing the output size it only zero-fills the buffer and\nbumps `frame_pos`; the LZW image-data parsing, image-descriptor handling, and the\n`_fill_rect`/dispose logic are all unimplemented or commented out. `parse_colortable`\nuses the non-erroring `read_u8()`, so on truncated input it silently fills the palette\nwith zeros rather than reporting an error. A caller using this type gets an all-black/\nall-zero image with no indication that nothing was decoded.","fix":"Either implement actual GIF/LZW decoding, or clearly gate the type behind an\n`experimental`/`unimplemented` marker and return an explicit error from `decode_into`\ninstead of silently emitting a blank frame. Make `parse_colortable` propagate read errors.","locations":[{"ref":"crates/zune-gif/src/decoder.rs:132-176","code":"  132 |     pub fn decode_into(\n  133 |         &mut self, output: &mut [u8], two_back: Option<&[u8]>\n  134 |     ) -> Result<(), GifDecoderErrors> {\n  135 |         self.decode_headers()?;\n  136 | \n  137 |         let output_size = self\n  138 |             .output_buf_size()\n  139 |             .ok_or(GifDecoderErrors::OverflowError(\n  140 |                 \"cannot calculate output dimensions\"\n  141 |             ))?;\n  142 | \n  143 |         if output_size > output.len() {\n  144 |             return Err(GifDecoderErrors::TooSmallSize(output_size, output.len()));\n  145 |         }\n  146 |         let output = &mut output[..output_size];\n  147 | \n  148 |         if self.frame_pos == 0 {\n  149 |             // zero out everything\n  150 |             self.background.resize(output_size, 0);\n  151 |             output.fill(0);\n  152 |         } else {\n  153 |             // second frame, figure out how to dispose the first one\n  154 | \n  155 |             let mut dispose = DisposalMethod::from_flags((self.flags & 0x1C) >> 2);\n  156 |             let _pix_count = self.width * self.height;\n  157 | \n  158 |             if dispose == DisposalMethod::Restore && two_back.is_none() {\n  159 |                 // fall back to background if we lack a background from two frames back\n  160 |                 dispose = DisposalMethod::Background;\n  161 |             }\n  162 |             match dispose {\n  163 |                 DisposalMethod::None | DisposalMethod::InPlace => {\n  164 |                     // ignore\n  165 |                 }\n  166 |                 DisposalMethod::Background => {\n  167 |                     // use previous\n  168 |                     // Self::fill_rect(&self.dispose_area, self.width, output);\n  169 |                 }\n  170 |                 DisposalMethod::Restore => {}\n  171 |             }\n  172 |         }\n  173 |         self.frame_pos += 1;\n  174 | \n  175 |         Ok(())\n  176 |     }","lines":45,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-gif/src/decoder.rs#L132-L176"},{"ref":"crates/zune-gif/src/decoder.rs:97-110","code":"   97 |     fn parse_colortable(&mut self, num_entries: usize, transp: usize) -> Result<(), &'static str> {\n   98 |         self.pal\n   99 |             .iter_mut()\n  100 |             .take(num_entries)\n  101 |             .enumerate()\n  102 |             .for_each(|(pos, x)| {\n  103 |                 // weird order\n  104 |                 x[2] = self.stream.read_u8();\n  105 |                 x[1] = self.stream.read_u8();\n  106 |                 x[0] = self.stream.read_u8();\n  107 |                 x[3] = if transp == pos { 0 } else { 255 }\n  108 |             });\n  109 |         Ok(())\n  110 |     }","lines":14,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-gif/src/decoder.rs#L97-L110"},{"r {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`codecs.rs` mixes several unrelated responsibilities in one 900+ line module: the\ndecoder registry/factory plumbing, the `ImageFormat` enum with both `has_encoder`,\n`encode`, `encoder_for_extension` dispatch, magic-byte format sniffing\n(`guess_format`, `is_webp`, `is_heif`), and a large `impl Image` block for\nsave/open/read/encode. The `encode` match and `has_encoder` match enumerate formats\nseparately from `encoder_for_extension` and from `register_builtins`, so adding a\nformat requires editing four hand-maintained, easily-desynchronized lists. For\nexample `encoder_for_extension` has no `bmp`/`psd`/`heic` cases and `has_encoder`\nomits formats that `encode` also omits - the lists must be kept in lockstep manually.","fix":"Drive encoder availability, extension mapping and decoder registration from a single\ntable/registry (as already done for decoders via REGISTRY) so the per-format\nknowledge lives in one place, and split format sniffing and the `impl Image`\nsave/open helpers into separate modules.","locations":[{"ref":"crates/zune-image/src/codecs.rs:202-412","code":"  202 | impl ImageFormat {\n  203 |     pub fn has_decoder(self) -> bool {\n  204 |         #[cfg(feature = \"jpeg-xl\")]\n  205 |         {\n  206 |             // for jpeg-xl we  know we have a decoder when the header can be parsed\n  207 |             // but here, we aren't passing any data below, and since we are using is_ok()\n  208 |             // to determine if we have okay, the jxl one will always fail.\n  209 |             //\n  210 |             // So we lift the check out of the decoder and do it here\n  211 |             if self == ImageFormat::JPEG_XL {\n  212 |                 return true;\n  213 |             }\n  214 |         }\n  215 |         #[cfg(feature = \"webp\")]\n  216 |         {\n  217 |             if self == ImageFormat::WEBP {\n  218 |                 return true;\n  219 |             }\n  220 |         }\n  221 |         return self.decoder(Cursor::new(&[])).is_ok();\n  222 |     }\n  223 |     pub fn decoder<'a, T>(&self, data: T) -> Result<Box<dyn DecoderTrait + 'a>, ImageErrors>\n  224 |     where\n  225 |         T: ZByteReaderTrait + 'a + BufRead + Seek,\n  226 |     {\n  227 |         self.decoder_with_options(data, DecoderOptions::default())\n  228 |     }\n  229 | \n  230 |     pub fn decoder_with_options<'a, T>(\n  231 |         &self, data: T, options: DecoderOptions,\n  232 |     ) -> Result<Box<dyn DecoderTrait + 'a>, ImageErrors>\n  233 |     where\n  234 |         T: ZByteReaderTrait + 'a + BufRead + Seek,\n  235 |     {\n  236 |         if let ImageFormat::Unknown = self {\n  237 |             return Err(ImageErrors::ImageDecoderNotImplemented(*self));\n  238 |         }\n  239 | \n  240 |         // 2. Lock and Lookup\n  241 |         let registry = REGISTRY.read().unwrap();\n  242 | \n  243 |         if let Some(factory) = registry.get(self) {\n  244 |             // Erase T into Box<dyn BoxableReader>\n  245 |             let boxed_data = Box::new(data);\n  246 | \n  247 |             // Call the factory (this handles the specific new/try_new logic)\n  248 |             let decoder = factory(boxed_data, options)?;\n  249 | \n  250 |             return Ok(decoder);\n  251 |         }\n  252 | \n  253 |         // 3. If it's not in the map, it's either not included (feature off)\n  254 |         // or not implemented.\n  255 |         Err(ImageErrors::ImageDecoderNotIncluded(*self))\n  256 |     }\n  257 |     /// Return true if an image format has an encoder that can convert the image\n  258 |     /// into that format\n  259 |     pub fn has_encoder(&self) -> bool {\n  260 |         // if the feature is included, means we have an encoder\n  261 |         #[allow(clippy::match_like_matches_macro)]\n  262 |         match self {\n  263 |             ImageFormat::JPEG => cfg!(feature = \"jpeg\"),\n  264 |             ImageFormat::PNG => cfg!(feature = \"png\"),\n  265 |             ImageFormat::PPM => cfg!(feature = \"ppm\"),\n  266 |             ImageFormat::Farbfeld => cfg!(feature = \"farbfeld\"),\n  267 |             ImageFormat::QOI => cfg!(feature = \"qoi\"),\n  268 |             ImageFormat::JPEG_XL => cfg!(feature = \"jpeg-xl\"),\n  269 |             ImageFormat::HDR => cfg!(feature = \"hdr\"),\n  270 |             ImageFormat::WEBP => cfg!(feature = \"webp\"),\n  271 |             _ => false,\n  272 |         }\n  273 |     }\n  274 |     pub fn encode<T: ZByteWriterTrait>(\n  275 |         &self, image: &Image, encoder_options: EncoderOptions, sink: T,\n  276 |     ) -> Result<usize, ImageErrors> {\n  277 |         match self {\n  278 |             ImageFormat::JPEG => {\n  279 |                 #[cfg(feature = \"jpeg\")]\n  280 |                 {\n  281 |                     let mut encoder = codecs::jpeg::JpegEncoder::new_with_options(encoder_options);\n  282 |                     return encoder.encode(image, sink);\n  283 |                 }\n  284 |             }\n  285 |             ImageFormat::PNG => {\n  286 |                 #[cfg(feature = \"png\")]\n  287 |                 {\n  288 |                     let mut encoder = codecs::png::PngEncoder::new_with_options(encoder_options);\n  289 |                     return encoder.encode(image, sink);\n  290 |                 }\n  291 |             }\n  292 |             ImageFormat::PPM => {\n  293 |                 #[cfg(feature = \"ppm\")]\n  294 |                 {\n  295 |                     let mut encoder = codecs::ppm::PPMEncoder::new_with_options(encoder_options);\n  296 |                     return encoder.encode(image, sink);\n  297 |                 }\n  298 |             }\n  299 |             ImageFormat::Farbfeld => {\n  300 |                 #[cfg(feature = \"farbfeld\")]\n  301 |                 {\n  302 |                     let mut encoder =\n  303 |                         codecs::farbfeld::FarbFeldEncoder::new_with_options(encoder_options);\n  304 |                     return encoder.encode(image, sink);\n  305 |                 }\n  306 |             }\n  307 |             ImageFormat::QOI => {\n  308 |                 #[cfg(feature = \"qoi\")]\n  309 |                 {\n  310 |                     let mut encoder = codecs::qoi::QoiEncoder::new_with_options(encoder_options);\n  311 |                     return encoder.encode(image, sink);\n  312 |                 }\n  313 |             }\n  314 |             ImageFormat::JPEG_XL => {\n  315 |                 #[cfg(feature = \"jpeg-xl\")]\n  316 |                 {\n  317 |                     let mut encoder =\n  318 |                         codecs::jpeg_xl::JxlEncoder::new_with_options(encoder_options);\n  319 |                     return encoder.encode(image, sink);\n  320 |                 }\n  321 |             }\n  322 |             ImageFormat::HDR => {\n  323 |                 #[cfg(feature = \"hdr\")]\n  324 |                 {\n  325 |                     let mut encoder = codecs::hdr::HdrEncoder::new_with_options(encoder_options);\n  326 |                     return encoder.encode(image, sink);\n  327 |                 }\n  328 |             }\n  329 |             ImageFormat::WEBP => {\n  330 |                 #[cfg(feature = \"webp\")]\n  331 |                 {\n  332 |                     let mut encoder = codecs::webp::ZuneWebpImageEncoder::new();\n  333 |                     return encoder.encode(image, sink);\n  334 |                 }\n  335 |             }\n  336 |             _ => {}\n  337 |         }\n  338 |         Err(ImageErrors::EncodeErrors(\n  339 |             ImgEncodeErrors::NoEncoderForFormat(*self),\n  340 |         ))\n  341 |     }\n  342 | \n  343 |     pub fn guess_format<T>(bytes: T) -> Option<(ImageFormat, T)>\n  344 |     where\n  345 |         T: ZByteReaderTrait,\n  346 |     {\n  347 |         guess_format(bytes)\n  348 |     }\n {"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The SIMD inner-block transposers use `get_unchecked`/raw pointer loads guarded\nonly by leading asserts, and the asserts under-count the bytes actually read or\nwritten. `transpose_8_by_8_u8` asserts `7*in_stride <= in_matrix.len()` and\n`7*out_stride <= out.len()`, but `_mm_loadl_epi64`/`_mm_storel_epi64` access 8\nelements at offset `7*stride`, requiring `7*stride + 8 <= len`. Likewise\n`transpose_sse_float_4x4_inner` asserts `3*in_stride <= len` while loading 4\nfloats at offset `3*in_stride`. The 8x8 u16 variant uses the correct\n`in_stride*7 + 8` bound, so the u8/f32 asserts are inconsistent. Current\ncallers happen to stay in bounds, so this is a latent unsafe-correctness hazard\nrather than an active OOB, but the safety guard does not actually cover the\nunsafe accesses.","fix":"Make the asserts cover the full access span: `7*in_stride + 8 <= in_matrix.len()` (u8) and `3*in_stride + 4 <= in_matrix.len()` (f32), matching the u16 version.","locations":[{"ref":"crates/zune-imageprocs/src/transpose/sse41.rs:138-146","code":"  138 | unsafe fn transpose_8_by_8_u8(\n  139 |     in_matrix: &[u8], out: &mut [u8], in_stride: usize, out_stride: usize\n  140 | ) {\n  141 |     // Godbolt :https://godbolt.org/z/axoorxT8o\n  142 |     // Stack overflow: https://stackoverflow.com/a/42316675\n  143 | \n  144 |     assert!((7 * out_stride) <= out.len());\n  145 | \n  146 |     assert!((7 * in_stride) <= in_matrix.len());","lines":9,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/transpose/sse41.rs#L138-L146"},{"ref":"crates/zune-imageprocs/src/transpose/sse41.rs:425-431","code":"  425 | #[target_feature(enable = \"sse4.1\")]\n  426 | unsafe fn transpose_sse_float_4x4_inner(\n  427 |     in_matrix: &[f32], out: &mut [f32], in_stride: usize, out_stride: usize\n  428 | ) {\n  429 |     assert!((3 * out_stride) <= out.len());\n  430 | \n  431 |     assert!((3 * in_stride) <= in_matrix.len());","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/transpose/sse41.rs#L425-L431"},{"ref":"crates/zune-imageprocs/src/transpose/sse41.rs:79-85","code":"   79 | unsafe fn transpose_8_by_8_u16(\n   80 |     in_matrix: &[u16], out: &mut [u16], in_stride: usize, out_stride: usize,\n   81 | )\n   82 | {\n   83 |     // ensure the writes are safe\n   84 |     assert!(in_stride * 7 + 8 <= in_matrix.len(), \"{},{}\", in_stride * 7 + 8, in_matrix.len());\n   85 |     assert!(out_stride * 7 + 8 <= out.len());","lines":7,"link":"https://github.com/etemesi254/zune-image/blob/1b1486a96a11264dd2ed809e48e316d5a241ee3e/crates/zune-imageprocs/src/transpose/sse41.rs#L79-L85"}]},

const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
