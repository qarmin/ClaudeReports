\n   33 |     /// IEEE conventions and puts its first infinity at `S.11111.00`, so `0x7B` is finite. See\n   34 |     /// table 1 of \"FP8 Formats for Deep Learning\" (arXiv:2209.05433), which also matches what\n   35 |     /// `from_f32` saturates to and what `QuantValue::E5M2` bounds against.\n   36 |     pub const MAX: e5m2 = Self::from_bits(0x7B);\n   37 |     /// Minimum representable value, the negation of [`MAX`](Self::MAX).\n   38 |     pub const MIN: e5m2 = Self::from_bits(0xFB);","lines":16,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/fp8/fp8_e5m2.rs#L23-L38"},{"ref":"crates/cubecl-common/src/float/fp8/fp8_e4m3.rs:24-39","code":"   24 | #[allow(non_camel_case_types)]\n   25 | #[repr(transparent)]\n   26 | #[cfg_attr(feature = \"serde\", derive(serde::Serialize, serde::Deserialize))]\n   27 | #[derive(Clone, Copy, Default, Zeroable, Pod, PartialEq, PartialOrd)]\n   28 | pub struct e4m3(u8);\n   29 | \n   30 | impl e4m3 {\n   31 |     /// Maximum representable value, `S.1111.110` = 1.75 * 2^8 = 448.\n   32 |     ///\n   33 |     /// Not taken from `F8E4M3::MAX`, which is 416 and one representable step low. E4M3 has no\n   34 |     /// infinities and reserves only `S.1111.111` for NaN, so `0x7E` is finite. See table 1 of\n   35 |     /// \"FP8 Formats for Deep Learning\" (arXiv:2209.05433), which also matches what `from_f32`\n   36 |     /// saturates to and what `QuantValue::E4M3` bounds against.\n   37 |     pub const MAX: Self = Self::from_bits(0x7E);\n   38 |     /// Minimum representable value, the negation of [`MAX`](Self::MAX).\n   39 |     pub const MIN: Self = Self::from_bits(0xFE);","lines":16,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/fp8/fp8_e4m3.rs#L24-L39"},{"ref":"crates/cubecl-common/src/float/fp4.rs:13-28","code":"   13 | #[allow(non_camel_case_types)]\n   14 | #[repr(transparent)]\n   15 | #[cfg_attr(feature = \"serde\", derive(serde::Serialize, serde::Deserialize))]\n   16 | #[derive(Clone, Copy, Default, Zeroable, PartialEq, PartialOrd)]\n   17 | pub struct e2m1(u8);\n   18 | \n   19 | /// A 4-bit floating point type with 2 exponent bits and 1 mantissa bit. Packed with two elements\n   20 | /// per value, to allow for conversion to/from bytes. Care must be taken to ensure the shape is\n   21 | /// adjusted appropriately.\n   22 | ///\n   23 | /// [`Minifloat`]: https://en.wikipedia.org/wiki/Minifloat\n   24 | #[allow(non_camel_case_types)]\n   25 | #[repr(transparent)]\n   26 | #[cfg_attr(feature = \"serde\", derive(serde::Serialize, serde::Deserialize))]\n   27 | #[derive(Clone, Copy, Default, Zeroable, Pod, PartialEq, PartialOrd)]\n   28 | pub struct e2m1x2(u8);","lines":16,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/fp4.rs#L13-L28"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Sequence::insert` is documented as `Insert an item at the given index` but its body is\n`*self.index_mut(index) = value;`, i.e. it *overwrites* the existing element and panics (via the\n`unwrap()` in `index_mut`) when `index == self.len()`. The expand counterpart\n`SequenceExpand::__expand_insert_method` behaves differently: it pushes when\n`self.values.len() == index` and only overwrites otherwise. So the same source line means\n`append` inside a kernel body but `panic` when the sequence is manipulated from ordinary Rust\n(comptime) code, and neither matches `Vec::insert` semantics implied by the name.","fix":"Make the two sides agree, e.g. give `Sequence::insert` the same append-or-replace behaviour as the\nexpand method (and say so in the doc):\n```rust\n/// Replace the item at `index`, or push it when `index == len`.\npub fn insert(&mut self, index: usize, value: T) {\n    if self.values.len() == index {\n        self.values.push(value);\n    } else {\n        self.values[index] = value;\n    }\n}\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/container/sequence/base.rs:98-102","code":"   98 |     /// Insert an item at the given index.\n   99 |     #[allow(clippy::should_implement_trait)]\n  100 |     pub fn insert(&mut self, index: usize, value: T) {\n  101 |         *self.index_mut(index) = value;\n  102 |     }","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/container/sequence/base.rs#L98-L102"},{"ref":"crates/cubecl-core/src/frontend/container/sequence/base.rs:278-285","code":"  278 |     /// Expand method of [insert](Sequence::insert).\n  279 |     pub fn __expand_insert_method(&mut self, _scope: &Scope, index: usize, value: T::ExpandType) {\n  280 |         if self.values.len() == index {\n  281 |             self.values.push(value);\n  282 |         } else {\n  283 |             self.values[index] = value;\n  284 |         }\n  285 |     }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/container/sequence/base.rs#L278-L285"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`DynamicScalar` uses three different `ConstantValue` kinds for its neutral elements:\n`Default::default()` returns `ConstantValue::Float(0.0)`, while `Zero::zero()` returns\n`u64::zero().into()` (`ConstantValue::UInt(0)`) and `One::one()` returns `ConstantValue::UInt(1)`.\nBecause `Ord::cmp` panics with `value type mismatch` on any mixed pair and `numeric_binop!` blindly\ncoerces the right-hand side to the left-hand side's kind, mixing these constants gives either a\ncomptime panic (`DynamicScalar::zero().cmp(&DynamicScalar::default())`) or a silently truncated\nresult (`One::one() + Float(2.5)` takes the `UInt` arm and yields `UInt(3)`).","fix":"Pick one canonical representation for neutral elements (or normalise on use). For example make all\nthree agree:\n\n```rust\nimpl<Marker: 'static> Zero for DynamicScalar<Marker> {\n    fn zero() -> Self { Self::new(ConstantValue::Float(0.0)) }\n}\nimpl<Marker: 'static> One for DynamicScalar<Marker> {\n    fn one() -> Self { Self::new(ConstantValue::Float(1.0)) }\n}\n```\n\nand/or make `Ord::cmp` compare through `as_f64()` instead of panicking on mixed kinds.","locations":[{"ref":"crates/cubecl-core/src/frontend/element/typemap.rs:74-78","code":"   74 | impl<Marker: 'static> Default for DynamicScalar<Marker> {\n   75 |     fn default() -> Self {\n   76 |         Self::new(ConstantValue::Float(0.0))\n   77 |     }\n   78 | }","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/typemap.rs#L74-L78"},{"ref":"crates/cubecl-core/src/frontend/element/typemap.rs:718-730","code":"  718 | impl<Marker: 'static> Ord for DynamicScalar<Marker> {\n  719 |     fn cmp(&self, other: &Self) -> Ordering {\n  720 |         match (self.val, other.val) {\n  721 |             (ConstantValue::Int(this), ConstantValue::Int(other)) => this.cmp(&other),\n  722 |             (ConstantValue::Float(this), ConstantValue::Float(other)) => {\n  723 |                 FloatOrd(this).cmp(&FloatOrd(other))\n  724 |             }\n  725 |             (ConstantValue::UInt(this), ConstantValue::UInt(other)) => this.cmp(&other),\n  726 |             (ConstantValue::Bool(this), ConstantValue::Bool(other)) => this.cmp(&other),\n  727 |             _ => panic!(\"value type mismatch\"),\n  728 |         }\n  729 |     }\n  730 | }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/typemap.rs#L718-L730"},{"ref":"crates/cubecl-core/src/frontend/element/typemap.rs:1286-1300","code":" 1286 | impl<Marker: 'static> One for DynamicScalar<Marker> {\n 1287 |     fn one() -> Self {\n 1288 |         DynamicScalar::new(u64::one().into())\n 1289 |     }\n 1290 | }\n 1291 | \n 1292 | impl<Marker: 'static> Zero for DynamicScalar<Marker> {\n 1293 |     fn zero() -> Self {\n 1294 |         DynamicScalar::new(u64::zero().into())\n 1295 |     }\n 1296 | \n 1297 |     fn is_zero(&self) -> bool {\n 1298 |         self.val.is_zero()\n 1299 |     }\n 1300 | }","lines":15,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/typemap.rs#L1286-L1300"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`NumCast::from` for `DynamicScalar` tests `n.to_f64()` first. Every `ToPrimitive` implementation for\nthe built-in integer types returns `Some` from `to_f64`, so integer inputs are always stored as\n`ConstantValue::Float` and the `to_i64` / `to_u64` branches are dead code. As a result\n`DynamicScalar::from_int(3)` (which goes through `NumCast`) yields `Float(3.0)`, which then flows\ninto `numeric_binop!`/`bitwise_binop!`/`Ord::cmp` and either takes the float arm (bit-twiddling a\nfloat in `bitwise_binop!`) or hits `panic!(\"value type mismatch\")` when compared with a\n`ConstantValue::UInt` produced by `Zero`/`One`.","fix":"Probe the integral conversions before the float one so integers stay integers:\n\n```rust\nfn from<T: num_traits::ToPrimitive>(n: T) -> Option<Self> {\n    let val = if let Some(int) = n.to_i64() {\n        ConstantValue::Int(int)\n    } else if let Some(uint) = n.to_u64() {\n        ConstantValue::UInt(uint)\n    } else if let Some(float) = n.to_f64() {\n        ConstantValue::Float(float)\n    } else {\n        return None;\n    };\n    Some(DynamicScalar::new(val))\n}\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/element/typemap.rs:292-305","code":"  292 | impl<Marker: 'static> NumCast for DynamicScalar<Marker> {\n  293 |     fn from<T: num_traits::ToPrimitive>(n: T) -> Option<Self> {\n  294 |         let val = if let Some(float) = n.to_f64() {\n  295 |             ConstantValue::Float(float)\n  296 |         } else if let Some(int) = n.to_i64() {\n  297 |             ConstantValue::Int(int)\n  298 |         } else if let Some(uint) = n.to_u64() {\n  299 |             ConstantValue::UInt(uint)\n  300 |         } else {\n  301 |             panic!(\"Unrepresentable value\")\n  302 |         };\n  303 |         Some(DynamicScalar::new(val))\n  304 |     }\n  305 | }","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/typemap.rs#L292-L305"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"For a descending (negative step) *exclusive* range, both the unroll expansion and the CPU implementation start\none element too low, because they build `(end..start).rev()` instead of iterating down from `start`:\n```rust\n(false, true) => {\n    for i in (end..start).rev().step_by(step.unsigned_abs() as usize) {\n```\nWith `start = 10, end = 0, step = -2` this yields `9, 7, 5, 3, 1` instead of `10, 8, 6, 4, 2`; the inclusive\nsibling arm `(end..=start).rev()` is correct, which shows the intent. `range_stepped` (the comptime/CPU version)\ncontains the identical expression, so both agree with each other and disagree with the documented semantics\n\"equivalent to `(start..end).step_by(step)`\". Worse, the non-unrolled path registers a `RangeLoop` that the C++\nemitter turns into `for (i = start; i < end; i += step)` (see `Instruction::RangeLoop` formatting), which for a\nnegative step executes zero iterations - so unrolled and non-unrolled compilations of the same loop disagree.","fix":"Generate the descending sequence from `start` explicitly instead of reversing a `Range`, e.g.:\n```rust\n(false, true) => {\n    let mut i = start;\n    while i > end {\n        body(scope, I::from_int_128(i).into());\n        i += step; // step is negative\n    }\n}\n```\nand mirror the same loop in `range_stepped`. The `RangeLoop` emitters also need a `>`/`>=` comparison when the\nstep is negative.","locations":[{"ref":"crates/cubecl-core/src/frontend/ranges.rs:446-472","code":"  446 |         match (self.inclusive, step.is_negative()) {\n  447 |             (true, true) => {\n  448 |                 for i in (end..=start).rev().step_by(step.unsigned_abs() as usize) {\n  449 |                     let val = I::from_int_128(i);\n  450 |                     body(scope, val.into())\n  451 |                 }\n  452 |             }\n  453 |             (true, false) => {\n  454 |                 for i in (start..=end).step_by(step.unsigned_abs() as usize) {\n  455 |                     let val = I::from_int_128(i);\n  456 |                     body(scope, val.into())\n  457 |                 }\n  458 |             }\n  459 |             (false, true) => {\n  460 |                 for i in (end..start).rev().step_by(step.unsigned_abs() as usize) {\n  461 |                     let val = I::from_int_128(i);\n  462 |                     body(scope, val.into())\n  463 |                 }\n  464 |             }\n  465 |             (false, false) => {\n  466 |                 for i in (start..end).step_by(step.unsigned_abs() as usize) {\n  467 |                     let val = I::from_int_128(i);\n  468 |                     body(scope, val.into())\n  469 |                 }\n  470 |             }\n  471 |         }\n  472 |     }","lines":27,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/ranges.rs#L446-L472"},{"ref":"crates/cubecl-core/src/frontend/ranges.rs:516-537","code":"  516 | pub fn range_stepped<I: Int>(start: I, end: I, step: I) -> Box<dyn Iterator<Item = I>> {\n  517 |     let start = start.to_i128().unwrap();\n  518 |     let end = end.to_i128().unwrap();\n  519 |     let step = step.to_i128().unwrap();\n  520 | \n  521 |     if step < 0 {\n  522 |         Box::new(\n  523 |             (end..start)\n  524 |                 .rev()\n  525 |                 .step_by(step.unsigned_abs() as usize)\n  526 |                 .map(<I as NumCast>::from)\n  527 |                 .map(Option::unwrap),\n  528 |         )\n  529 |     } else {\n  530 |         Box::new(\n  531 |             (start..end)\n  532 |                 .step_by(step.unsigned_abs() as usize)\n  533 |                 .map(<I as NumCast>::from)\n  534 |                 .map(Option::unwrap),\n  535 |         )\n  536 |     }\n  537 | }","lines":22,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/ranges.rs#L516-L537"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`resolve_stack_size` clamps the user-provided stack size with `.max(MAX_STACK_SIZE)`, i.e. it uses a\nconstant named *MAX* as a lower bound, and `DEFAULT_STACK_SIZE` (64 MiB) is four times larger than\n`MAX_STACK_SIZE` (16 MiB). So `CUBECL_CPU_STACK_MB=1` silently yields 16 MiB, the documented ability\nto shrink the per-worker stack does not exist, and a request above 16 MiB is honoured without limit -\nthe exact opposite of what the name says. With one worker thread per cube unit (see\n`DispatcherScheduler::ensure_workers`) the per-thread stack size is the dominant address-space cost,\nso the constant matters.","fix":"Decide which bound is meant and make the name match. If it is a cap:\n```rust\npub const MAX_STACK_SIZE: usize = 64 * 1024 * 1024;\npub const DEFAULT_STACK_SIZE: usize = 16 * 1024 * 1024;\n...\nreturn bytes.min(MAX_STACK_SIZE);\n```\nIf it is a floor, rename it: `pub const MIN_STACK_SIZE: usize = 16 * 1024 * 1024;` and use\n`bytes.max(MIN_STACK_SIZE)`.","locations":[{"ref":"crates/cubecl-cpu/src/compute/threadpool/scheduler/mod.rs:23-38","code":"   23 | pub const MAX_STACK_SIZE: usize = 16 * 1024 * 1024;\n   24 | pub const DEFAULT_STACK_SIZE: usize = 64 * 1024 * 1024;\n   25 | \n   26 | fn resolve_stack_size() -> usize {\n   27 |     if let Ok(value) = std::env::var(\"CUBECL_CPU_STACK_SIZE\")\n   28 |         && let Ok(bytes) = value.parse::<usize>()\n   29 |     {\n   30 |         return bytes.max(MAX_STACK_SIZE);\n   31 |     }\n   32 |     if let Ok(value) = std::env::var(\"CUBECL_CPU_STACK_MB\")\n   33 |         && let Ok(mb) = value.parse::<usize>()\n   34 |     {\n   35 |         return (mb.saturating_mul(1024 * 1024)).max(MAX_STACK_SIZE);\n   36 |     }\n   37 |     DEFAULT_STACK_SIZE\n   38 | }","lines":16,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cpu/src/compute/threadpool/scheduler/mod.rs#L23-L38"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The `backtrace_std` module does not compile: `self.backtrace.lock()` on a `std::sync::Mutex`\nreturns `LockResult<MutexGuard<..>>`, and the code calls `resolve()`/`frames()` straight on that\n`Result`. Building with the alias forced on fails:\n\n```\nerror[E0599]: no method named `resolve` found for enum `Result<T, E>` in the current scope\n  --> crates/cubecl-environment/src/backtrace.rs:79:23\nerror[E0599]: no method named `frames` found for enum `Result<T, E>` in the current scope\n  --> crates/cubecl-environment/src/backtrace.rs:98:36\n```\n\nThis is only invisible because the `backtrace` cfg is never set (see the separate finding), which\nmeans the code path can never be enabled without first fixing this. Together the two defects make\nthe backtrace subsystem permanently non-functional.","fix":"Unwrap the guard (poisoning here is not recoverable state, the `Backtrace` is only read):\n\n```rust\n-            let mut backtrace = self.backtrace.lock();\n+            let mut backtrace = self\n+                .backtrace\n+                .lock()\n+                .unwrap_or_else(std::sync::PoisonError::into_inner);\n             backtrace.resolve();\n```\n\nand add a CI job (or a `#[cfg(backtrace)]`-enabling feature in the test matrix) that actually\ncompiles this module so it can't rot again.","locations":[{"ref":"crates/cubecl-environment/src/backtrace.rs:76-101","code":"   76 |     impl Display for BacktraceState {\n   77 |         fn fmt(&self, f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result {\n   78 |             let mut backtrace = self.backtrace.lock();\n   79 |             backtrace.resolve();\n   80 | \n   81 |             let cwd = std::env::current_dir();\n   82 | \n   83 |             let mut print_path =\n   84 |                 move |fmt: &mut core::fmt::Formatter<'_>, path: BytesOrWideString<'_>| {\n   85 |                     let path = path.into_path_buf();\n   86 |                     if let Ok(cwd) = &cwd\n   87 |                         && let Ok(suffix) = path.strip_prefix(cwd)\n   88 |                     {\n   89 |                         return core::fmt::Display::fmt(&suffix.display(), fmt);\n   90 |                     }\n   91 | \n   92 |                     core::fmt::Display::fmt(&path.display(), fmt)\n   93 |                 };\n   94 | \n   95 |             let mut fmt =\n   96 |                 backtrace::BacktraceFmt::new(f, backtrace::PrintFmt::Short, &mut print_path);\n   97 |             fmt.add_context()?;\n   98 |             for frame in backtrace.frames().iter().skip(1) {\n   99 |                 fmt.frame().backtrace_frame(frame)?;\n  100 |             }\n  101 |             fmt.finish()?;","lines":26,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/backtrace.rs#L76-L101"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`LoggerConfig::append = false` does not overwrite the log file, contradicting its own\ndocumentation. `FileLogger::new` builds the `OpenOptions` without ever calling `truncate`:\n\n```rust\nlet file = OpenOptions::new()\n    .write(true)\n    .append(append)\n    .create(true)\n    .open(path)\n    .unwrap();\n```\n\nWith `append == false` the file is opened for writing at offset 0 but is **not** truncated, so the\ntail of the previous run's log survives past the end of the new content. A 10 MB log from a\nprevious run followed by a 1 KB run leaves 1 KB of fresh lines glued to ~10 MB of stale lines, with\nthe seam in the middle of whatever line happened to straddle offset 1024. That is exactly the\nfailure the `append = false` setting exists to avoid.\n\nThe field documentation states: \"Whether to append to the log file (true) or overwrite it (false).\"","fix":"Truncate when not appending:\n\n```rust\n let file = OpenOptions::new()\n     .write(true)\n     .append(append)\n+    .truncate(!append)\n     .create(true)\n     .open(path)\n     .unwrap();\n```","locations":[{"ref":"crates/cubecl-environment/src/config/logger.rs:29-35","code":"   29 |     /// Whether to append to the log file (true) or overwrite it (false). Defaults to true.\n   30 |     ///\n   31 |     /// ## Notes\n   32 |     ///\n   33 |     /// This parameter might get ignored based on other loggers config.\n   34 |     #[serde(default = \"append_default\")]\n   35 |     pub append: bool,","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/config/logger.rs#L29-L35"},{"ref":"crates/cubecl-environment/src/config/logger.rs:235-240","code":"  235 |         let file = OpenOptions::new()\n  236 |             .write(true)\n  237 |             .append(append)\n  238 |             .create(true)\n  239 |             .open(path)\n  240 |             .unwrap();","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/config/logger.rs#L235-L240"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`is_intrinsic` compares a `TokenStream`-rendered path against string literals that contain no\nspaces, so it never matches a qualified path. `path.to_token_stream().to_string()` renders\n`cubecl::prelude::vectorization_of` as `\"cubecl :: prelude :: vectorization_of\"` (proc-macro2 inserts\nspaces around `::`), which is not a suffix of `\"::cubecl::prelude::vectorization_of\"`:\n```rust\nlet intrinsic_paths = [\n    \"::cubecl::prelude::vectorization_of\",\n    \"::cubecl::frontend::vectorization_of\",\n];\nlet func_path = path.to_token_stream().to_string();\nintrinsic_paths.iter().any(|path| path.ends_with(&func_path))\n```\nOnly the bare single-segment call `vectorization_of(..)` is recognised; a user writing\n`cubecl::prelude::vectorization_of(x)` silently loses intrinsic handling and the call is expanded as\nan ordinary function call. Conversely the `ends_with` test is loose: any single-segment call named\n`vectorization_of` matches regardless of what it resolves to.","fix":"Normalise the rendered path before comparing, and compare full segment sequences:\n```rust\nlet func_path = path\n    .segments\n    .iter()\n    .map(|seg| seg.ident.to_string())\n    .collect::<Vec<_>>()\n    .join(\"::\");\nintrinsic_paths.iter().any(|p| p.trim_start_matches(\"::\").ends_with(&func_path))\n```","locations":[{"ref":"crates/cubecl-macros/src/expression.rs:310-324","code":"  310 | pub fn is_intrinsic(path: &Path) -> bool {\n  311 |     // Add both possible import paths\n  312 |     let intrinsic_paths = [\n  313 |         \"::cubecl::prelude::vectorization_of\",\n  314 |         \"::cubecl::frontend::vectorization_of\",\n  315 |     ];\n  316 | \n  317 |     let mut path = path.clone();\n  318 |     // Strip function generics\n  319 |     path.segments.last_mut().unwrap().arguments = PathArguments::None;\n  320 |     let func_path = path.to_token_stream().to_string();\n  321 |     intrinsic_paths\n  322 |         .iter()\n  323 |         .any(|path| path.ends_with(&func_path))\n  324 | }","lines":15,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/expression.rs#L310-L324"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The generated `Hash` for `{Enum}CompilationArg` never hashes which variant is present - it only\nhashes the fields of the matched variant:\n```rust\nlet body_hash = self.match_impl(\n    quote! {self},\n    self.variants.iter().map(|v| v.for_each_body(&name, |f| quote!(#f.hash(state)))).collect(),\n);\n```\n`for_each_body` emits `Name::Variant { fields } => { field.hash(state); }` with no discriminant\nwrite, so for a fieldless launch enum (e.g. `RuntimeEnumEmpty { A, B, C }` in\n`crates/cubecl-core/src/runtime_tests/enums.rs`) every variant hashes to the *same* value, and for\nsame-shaped variants across the board `A(x)` and `B(x)` collide. The sibling `PartialEq` impl right\nabove does discriminate variants, so this is only a hash-quality/collision bug in the in-memory\nkernel cache (which also compares with `Eq`) - but `CompilationArg` also flows into\n`KernelId::stable_hash()`, which `cubecl-runtime/src/compiler.rs` uses as one half of a *persistent*\ncache key, so nothing but the IR hash separates two variants there.","fix":"Hash a per-variant discriminant first, e.g. give `for_each_body` a prologue:\n```rust\nlet body_hash = self.match_impl(\n    quote! {self},\n    self.variants\n        .iter()\n        .map(|v| {\n            let disc = v.discriminant;\n            v.for_each_body(&name, |f| quote!(#f.hash(state)))\n             .prepend(quote!(#disc.hash(state);)) // or emit `disc` inside `for_each_body`\n        })\n        .collect(),\n);\n```\n(simplest: make `for_each_body` always start its block with `state.write_i32(#discriminant);`).","locations":[{"ref":"crates/cubecl-macros/src/generate/cube_type/generate_enum.rs:430-436","code":"  430 |         let body_hash = self.match_impl(\n  431 |             quote! {self},\n  432 |             self.variants\n  433 |                 .iter()\n  434 |                 .map(|v| v.for_each_body(&name, |f| quote!(#f.hash(state))))\n  435 |                 .collect(),\n  436 |         );","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/cube_type/generate_enum.rs#L430-L436"},{"ref":"crates/cubecl-macros/src/generate/cube_type/generate_enum.rs:619-637","code":"  619 |     pub(crate) fn for_each_body<F: Fn(&Ident) -> TokenStream>(\n  620 |         &self,\n  621 |         ident_ty_expand: &Ident,\n  622 |         fn_call: F,\n  623 |     ) -> TokenStream {\n  624 |         let body = self.field_names.iter().map(|name| {\n  625 |             let called = fn_call(name);\n  626 |             quote! {\n  627 |                 #called\n  628 |             }\n  629 |         });\n  630 | \n  631 |         let body = match self.kind {\n  632 |             VariantKind::Named | VariantKind::Unnamed => quote![ {#(#body;)*} ],\n  633 |             VariantKind::Empty => quote![{}],\n  634 |         };\n  635 | \n  636 |         self.run_on_variants(ident_ty_expand, body)\n  637 |     }","lines":19,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/cube_type/generate_enum.rs#L619-L637"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`CubeTypeEnum::validate` rejects a legal runtime enum whose variants share the same payload type.\nIt collects one entry per value-carrying variant and then errors as soon as more than one entry\nexists:\n```rust\nlet types = self.variants.iter().filter_map(|v| match v.kind { ... }).collect::<Result<Vec<_>, _>>()?;\nif types.len() > 1 {\n    Err(syn::Error::new(self.ident.span(), \"Only one value type is allowed for runtime enums\"))\n}\n```\nFor `#[cube(runtime_variants)] enum E { A(u32), B(u32) }` there is exactly *one* value type, but\n`types.len() == 2`, so the derive fails with a message that does not describe the actual input. The\nerror message (\"Only one value **type**\") shows that uniqueness of the type, not of the variant\ncount, was intended.","fix":"Compare the types instead of counting them, e.g.:\n```rust\nlet unique = types.iter().map(|ty| ty.to_token_stream().to_string()).collect::<BTreeSet<_>>();\nif unique.len() > 1 {\n    return Err(syn::Error::new(self.ident.span(), \"Only one value type is allowed for runtime enums\"));\n}\n```","locations":[{"ref":"crates/cubecl-macros/src/generate/cube_type/generate_runtime_enum.rs:45-70","code":"   45 |     fn validate(&self) -> Result<(), syn::Error> {\n   46 |         let types = self\n   47 |             .variants\n   48 |             .iter()\n   49 |             .filter_map(|v| match v.kind {\n   50 |                 VariantKind::Named => Some(Err(syn::Error::new(\n   51 |                     self.ident.span(),\n   52 |                     \"Named enum fields are not supported for runtime enums\",\n   53 |                 ))),\n   54 |                 VariantKind::Unnamed if v.fields.len() > 1 => Some(Err(syn::Error::new(\n   55 |                     self.ident.span(),\n   56 |                     \"Only single value is supported for runtime enums\",\n   57 |                 ))),\n   58 |                 VariantKind::Unnamed => Some(Ok(v.fields.iter().next().unwrap().ty.clone())),\n   59 |                 VariantKind::Empty => None,\n   60 |             })\n   61 |             .collect::<Result<Vec<_>, _>>()?;\n   62 |         if types.len() > 1 {\n   63 |             Err(syn::Error::new(\n   64 |                 self.ident.span(),\n   65 |                 \"Only one value type is allowed for runtime enums\",\n   66 |             ))\n   67 |         } else {\n   68 |             Ok(())\n   69 |         }\n   70 |     }","lines":26,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/cube_type/generate_runtime_enum.rs#L45-L70"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`new_variant_function_runtime` builds a struct literal with a bare generics list instead of a\nturbofish, which is a syntax error in expression position:\n```rust\npub fn #expand_function(_: &#scope, value: <#ty as #cube_type>::ExpandType) -> #ident_ty_expand #generics {\n    #ident_ty_expand #generics {\n        discriminant: #index.into(),\n        value\n    }\n}\n```\n`generics` here is a `syn::TypeGenerics`, which prints as `<T>`, so the body expands to\n`FooExpand<T> { discriminant: .., value }`. `rustc` rejects that with *\"comparison operators cannot\nbe chained ... help: use `::<...>` instead of `<...>`\"*. The sibling non-runtime generator\n(`generate_enum.rs::new_variant_function`) gets this right by using\n`let turbofish = generics.as_turbofish();`. Any generic enum with `#[cube(runtime_variants)]` and\nconstructors enabled fails to compile; the in-tree generic case (`Option<T>`) escapes only because\nit is declared `#[cube(runtime_variants, no_constructors)]`.","fix":"Use a turbofish for the value-position path, as `generate_enum.rs` already does:\n```rust\nlet turbofish = generics.as_turbofish();\n// ...\n#ident_ty_expand #turbofish {\n    discriminant: #index.into(),\n    value\n}\n```","locations":[{"ref":"crates/cubecl-macros/src/generate/cube_type/generate_runtime_enum.rs:505-535","code":"  505 |             VariantKind::Unnamed => {\n  506 |                 let ty = self.fields.iter().next().unwrap().ty.clone();\n  507 | \n  508 |                 quote! {\n  509 |                     pub fn #base_function(value: #ty) -> Self {\n  510 |                         cubecl::unexpanded!()\n  511 |                     }\n  512 | \n  513 |                     pub fn #expand_function(_: &#scope, value: <#ty as #cube_type>::ExpandType) -> #ident_ty_expand #generics {\n  514 |                         #ident_ty_expand #generics {\n  515 |                             discriminant: #index.into(),\n  516 |                             value\n  517 |                         }\n  518 |                     }\n  519 |                 }\n  520 |             }\n  521 |             VariantKind::Empty => {\n  522 |                 quote! {\n  523 |                     pub fn #base_function() -> Self {\n  524 |                         cubecl::unexpanded!()\n  525 |                     }\n  526 | \n  527 |                     pub fn #expand_function(scope: &#scope) -> #ident_ty_expand #generics {\n  528 |                         #ident_ty_expand #generics {\n  529 |                             discriminant: #index.into(),\n  530 |                             value: <#value_ty as #into_runtime>::__expand_runtime_method(Default::default(), scope),\n  531 |                         }\n  532 |                     }\n  533 |                 }\n  534 |             }\n  535 |         }","lines":31,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/cube_type/generate_runtime_enum.rs#L505-L535"},{"ref":"crates/cubecl-macros/src/generate/cube_type/generate_enum.rs:696","code":"  696 |         let turbofish = generics.as_turbofish();","lines":1,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/cube_type/generate_enum.rs#L696"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`cube_count_spread` only clamps the `x` and `y` axes. `reduce_count(i)` moves the excess from axis\n`i` into axis `i + 1` (`num_cubes[i + 1] *= base`) and the loop runs for `i in 0..2`, so the `z`\naxis is *never* compared against `max_cube_counts[2]`. With `max = (16, 16, 2)` and\n`num_cubes = 4096` the function returns `[16, 16, 16]`, i.e. a cube count 8x over the device's `z`\nlimit, which the driver rejects at launch. `CubeCountSelection::new` then also multiplies the three\naxes into a `u32` (`cube_count[0] * cube_count[1] * cube_count[2]`), which can overflow for large\ncounts — panicking in debug, and in release wrapping so that `num_cubes_actual` compares unequal\n(or worse, equal) by accident.","fix":"Check the last axis too and use a widened product:\n\n```rust\nfor i in 0..2 {\n    if reduce_count(i) {\n        break;\n    }\n}\ndebug_assert!(\n    num_cubes[2] <= max_cube_counts[2],\n    \"cube count {num_cubes:?} exceeds the device limit {max_cube_counts:?}\"\n);\n```\n\nplus, in `CubeCountSelection::new`:\n\n```rust\nlet num_cubes_actual =\n    (cube_count[0] as u64 * cube_count[1] as u64 * cube_count[2] as u64).min(u32::MAX as u64) as u32;\n```","locations":[{"ref":"crates/cubecl-runtime/src/server/base.rs:1614-1641","code":" 1614 | fn cube_count_spread(max: &(u32, u32, u32), num_cubes: u32) -> [u32; 3] {\n 1615 |     let max_cube_counts = [max.0, max.1, max.2];\n 1616 |     let mut num_cubes = [num_cubes, 1, 1];\n 1617 |     let base = 2;\n 1618 | \n 1619 |     let mut reduce_count = |i: usize| {\n 1620 |         if num_cubes[i] <= max_cube_counts[i] {\n 1621 |             return true;\n 1622 |         }\n 1623 | \n 1624 |         loop {\n 1625 |             num_cubes[i] = num_cubes[i].div_ceil(base);\n 1626 |             num_cubes[i + 1] *= base;\n 1627 | \n 1628 |             if num_cubes[i] <= max_cube_counts[i] {\n 1629 |                 return false;\n 1630 |             }\n 1631 |         }\n 1632 |     };\n 1633 | \n 1634 |     for i in 0..2 {\n 1635 |         if reduce_count(i) {\n 1636 |             break;\n 1637 |         }\n 1638 |     }\n 1639 | \n 1640 |     num_cubes\n 1641 | }","lines":28,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/server/base.rs#L1614-L1641"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `optimize_vector_size`, the `Greater` arm validates only that the *byte* sizes divide\n(`vector_source_size.is_multiple_of(target_size)`) and then returns `Some(vector_size / ratio)`. When\n`ratio > vector_size` this integer division silently yields **0**, which is then used as a vector size\n(`let size!(N2) = vector_size;` in `ReinterpretSlice::new` / `ReinterpretSliceMut::new`). Example:\n`S = f32` with `vector_size = 1` and `T = u8` gives `vector_source_size = 4`, `target_size = 1`,\n`ratio = 4`, and `1 / 4 == 0`, so a zero-width vector type is requested instead of the intended\n`panic!(\"incompatible number of bytes\")`.","fix":"Require the lane count itself to divide:\n```rust\ncore::cmp::Ordering::Greater => {\n    let ratio = vector_source_size / target_size;\n    if !vector_source_size.is_multiple_of(target_size) || !vector_size.is_multiple_of(ratio) {\n        panic!(\"incompatible number of bytes\");\n    }\n    (Some(vector_size / ratio), None)\n}\n```","locations":[{"ref":"crates/cubecl-std/src/reinterpret_slice.rs:200-207","code":"  200 |         core::cmp::Ordering::Greater => {\n  201 |             if !vector_source_size.is_multiple_of(target_size) {\n  202 |                 panic!(\"incompatible number of bytes\");\n  203 |             }\n  204 |             let ratio = vector_source_size / target_size;\n  205 | \n  206 |             (Some(vector_size / ratio), None)\n  207 |         }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/reinterpret_slice.rs#L200-L207"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`VirtualViewExpand::__expand_read_masked_method` receives `mask_value` but forwards the read to the\ninner view with `__expand_read_checked_method`, which by contract substitutes `0` for out-of-bounds\npositions. `mask_value` is then only applied to the *layout* bounds check via `select`. So for a\nposition that the layout maps successfully (`in_bounds == true`) but that lies outside the underlying\nstorage, `read_masked(pos, mask_value)` returns `0` instead of `mask_value`. Note the sibling\n`__expand_read_checked_method` right above builds its own `zero` and does exactly the same inner\ncall, which is what makes the copy easy to overlook.","fix":"Forward the mask to the inner view:\n```rust\nlet value = self\n    .view\n    .__expand_read_masked_method(scope, read_pos, mask_value.clone());\nselect::expand::<T>(scope, in_bounds, value, mask_value)\n```","locations":[{"ref":"crates/cubecl-std/src/tensor/view/operations/virtual_view.rs:133-145","code":"  133 |             fn __expand_read_masked_method(\n  134 |                 &self,\n  135 |                 scope: &Scope,\n  136 |                 pos: <C>::ExpandType,\n  137 |                 mask_value: <T>::ExpandType,\n  138 |             ) -> <T>::ExpandType {\n  139 |                 let (read_pos, in_bounds) = self\n  140 |                     .layout\n  141 |                     .clone()\n  142 |                     .__expand_to_source_pos_checked_method(scope, pos);\n  143 |                 let value = self.view.__expand_read_checked_method(scope, read_pos);\n  144 |                 select::expand::<T>(scope, in_bounds, value, mask_value)\n  145 |             }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/view/operations/virtual_view.rs#L133-L145"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`VirtualTensor::coordinate` computes `index / self.stride(dim)` with no guard. Broadcast tensors\ncarry a stride of `0` for broadcast axes (that is how broadcasting is expressed), so calling\n`coordinate(index, dim)` on a broadcast axis performs an integer division by zero. On GPU targets\ninteger division by zero is not trapped, it yields an implementation-defined value, so the caller\nsilently gets a garbage coordinate rather than an error.","fix":"Guard the degenerate stride, which is also the semantically correct answer for a broadcast axis:\n```rust\npub fn coordinate(&self, index: usize, dim: usize) -> usize {\n    let stride = self.stride(dim);\n    if stride == 0 {\n        return 0;\n    }\n    (index / stride) % self.shape(dim)\n}\n```","locations":[{"ref":"crates/cubecl-std/src/tensor/virtual.rs:247-253","code":"  247 | #[cube]\n  248 | impl<E: Numeric, N: Size, IO: Clone + 'static> VirtualTensor<E, N, IO> {\n  249 |     pub fn coordinate(&self, index: usize, dim: usize) -> usize {\n  250 |         let num_strides = index / self.stride(dim);\n  251 |         num_strides % self.shape(dim)\n  252 |     }\n  253 | }","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/virtual.rs#L247-L253"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`build.rs` reads `CUBECL_ENABLE_RENDERDOC` and emits `cargo:rustc-cfg=feature=\"renderdoc\"`, but\nthat has no effect on the code it is meant to enable. All the RenderDoc code is gated on\n`#[cfg(renderdoc)]` (see `crates/cubecl-wgpu/src/compute/stream.rs:104` and `:558`), and the\n`renderdoc` cfg alias is resolved by `cfg_aliases!` from the `CARGO_FEATURE_RENDERDOC` environment\nvariable at build-script run time — it cannot observe a `rustc-cfg` line this same script prints\nlater. Since `renderdoc = [\"std\", \"dep:renderdoc\"]` also gates the optional dependency, the emitted\ncfg cannot ever usefully enable anything. On top of that there is no\n`cargo:rerun-if-env-changed=CUBECL_ENABLE_RENDERDOC`, so changing the variable does not even\nre-run the script.","fix":"Drop the misleading emission and document that RenderDoc requires the cargo feature:\n```rust\n// RenderDoc needs the optional `renderdoc` dependency, so it can only be enabled as a\n// cargo feature: `--features renderdoc`.\n```\nIf an env-var switch is really wanted, it has to feed the alias itself, e.g. define the alias as\n`renderdoc: { all(any(feature = \"renderdoc\", renderdoc_env), not(any(target_os = \"macos\", target_os = \"ios\"))) }`\nand emit `cargo:rustc-cfg=renderdoc_env` plus\n`cargo:rerun-if-env-changed=CUBECL_ENABLE_RENDERDOC`.","locations":[{"ref":"crates/cubecl-wgpu/build.rs:6-11","code":"    6 |     cfg_aliases! {\n    7 |         exclusive_memory_only: { any(feature = \"exclusive-memory-only\", target_family = \"wasm\") },\n    8 |         apple_silicon: { all(target_os = \"macos\", target_arch = \"aarch64\") },\n    9 |         // Renderdoc adds a compile time error on MacOS and iOS\n   10 |         renderdoc: { all(feature = \"renderdoc\", not(any(target_os = \"macos\", target_os = \"ios\"))) }\n   11 |     }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/build.rs#L6-L11"},{"ref":"crates/cubecl-wgpu/build.rs:20-22","code":"   20 |     if env::var(\"CUBECL_ENABLE_RENDERDOC\").is_ok() {\n   21 |         println!(\"cargo:rustc-cfg=feature=\\\"renderdoc\\\"\");\n   22 |     }","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/build.rs#L20-L22"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`read_resources` ignores the `offset` of the staging resource it just reserved. It copies\ninto `&staging.buffer` at hard-coded destination offset `0`, and then builds the `Bytes`\nfrom `WgpuAllocController::init(binding, staging.buffer)`, which maps the buffer with\n`buffer.get_mapped_range(..)` - again from offset 0. `reserve_staging` goes through\n`MemoryManagement::get_resource`, which legitimately returns a `WgpuResource` with a\nnon-zero `offset` (that field exists precisely for sub-allocated pages). The code only\nhappens to work because the staging pool is currently created with\n`MemoryConfiguration::ExclusivePages`; any change to that configuration silently produces\ndata read back from the wrong region of the buffer, with no assertion to catch it.","fix":"Use the resource offset (and assert the invariant if exclusivity is intended):\n```rust\ndebug_assert_eq!(staging.offset, 0, \"staging pool must hand out whole pages\");\nself.encoder.copy_buffer_to_buffer(\n    &resource.buffer,\n    resource.offset,\n    &staging.buffer,\n    staging.offset,\n    aligned_len,\n);\n```\nand pass the offset/length down to `WgpuAllocController::init` so it maps\n`buffer.get_mapped_range(offset..offset + aligned_len)`.","locations":[{"ref":"crates/cubecl-wgpu/src/compute/stream.rs:338-352","code":"  338 |             // Copying into a buffer has to be 4 byte aligned. We can safely do so, as\n  339 |             // memory is 32 bytes aligned (see WgpuStorage).\n  340 |             let align = wgpu::COPY_BUFFER_ALIGNMENT;\n  341 |             let aligned_len = resource.size.div_ceil(align) * align;\n  342 |             let (staging, binding) = self.mem_manage.reserve_staging(aligned_len).unwrap();\n  343 | \n  344 |             self.tasks_count += 1;\n  345 |             self.encoder.copy_buffer_to_buffer(\n  346 |                 &resource.buffer,\n  347 |                 resource.offset,\n  348 |                 &staging.buffer,\n  349 |                 0,\n  350 |                 aligned_len,\n  351 |             );\n  352 |             staging_info.push(Some((staging, binding, size)));","lines":15,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/stream.rs#L338-L352"},{"ref":"crates/cubecl-wgpu/src/compute/stream.rs:396-410","code":"  396 |             let result = {\n  397 |                 staging_info\n  398 |                     .into_iter()\n  399 |                     .map(|entry| {\n  400 |                         if let Some((staging, binding, size)) = entry {\n  401 |                             let controller =\n  402 |                                 Box::new(WgpuAllocController::init(binding, staging.buffer));\n  403 |                             // SAFETY: The binding has initialized memory for at least `size` bytes.\n  404 |                             unsafe { Bytes::from_controller(controller, size) }\n  405 |                         } else {\n  406 |                             Bytes::from_bytes_vec(vec![])\n  407 |                         }\n  408 |                     })\n  409 |                     .collect()\n  410 |             };","lines":15,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/stream.rs#L396-L410"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ue8m0` is documented as \"An 8-bit **unsigned** floating point type\" with `MIN: f64 = 0.0`, yet\n`numeric::Neg for ue8m0` is implemented as `Self::from_f32(self.to_f32().neg())`. No negative value\nis representable, so the negation is silently converted to whatever `float4::E8M0::from_f64` does\nwith a negative input (a clamp or a NaN encoding) instead of failing. `-x` for a nonzero `x` can\ntherefore never satisfy `x + (-x) == 0`, and the operator's existence invites generic numeric code\nto use it.","fix":"Remove the `impl Neg for ue8m0` block (an unsigned scale format has no negation), or make it\nexplicit that it is unsupported:\n```rust\nimpl Neg for ue8m0 {\n    type Output = Self;\n    fn neg(self) -> Self::Output {\n        panic!(\"ue8m0 is unsigned and cannot be negated\")\n    }\n}\n```\nRemoving it is preferable, since it turns misuse into a compile error.","locations":[{"ref":"crates/cubecl-common/src/float/fp8/fp8_e8m0.rs:94-100","code":"   94 |     impl Neg for ue8m0 {\n   95 |         type Output = Self;\n   96 | \n   97 |         fn neg(self) -> Self::Output {\n   98 |             Self::from_f32(self.to_f32().neg())\n   99 |         }\n  100 |     }","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/fp8/fp8_e8m0.rs#L94-L100"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`flex32` gives two different answers for its smallest positive value. The inherent constant models\nthe documented \"minimum `f16`\" precision - `flex32::MIN_POSITIVE = half::f16::MIN_POSITIVE`\n(about 6.1e-5) - while `<flex32 as num_traits::Float>::min_positive_value()` returns\n`f32::min_positive_value()` (about 1.18e-38). Generic code written against `num_traits::Float`\n(the common case for this type) gets a bound that the type's own constant says is not representable\nat the promised precision, even though `Float::epsilon()` *is* correctly taken from `half::f16`.","fix":"Make the trait method agree with the inherent constant:\n```rust\nfn min_positive_value() -> Self {\n    Self::MIN_POSITIVE\n}\n```\n(or, if the `f32` range really is intended, delete `flex32::MIN_POSITIVE` and document that only the\nprecision - not the range - is relaxed to `f16`).","locations":[{"ref":"crates/cubecl-common/src/float/relaxed.rs:42-44","code":"   42 | impl flex32 {\n   43 |     /// Minimum positive flex32 value\n   44 |     pub const MIN_POSITIVE: Self = Self(half::f16::MIN_POSITIVE.to_f32_const());","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/relaxed.rs#L42-L44"},{"ref":"crates/cubecl-common/src/float/relaxed.rs:186-188","code":"  186 |     fn min_positive_value() -> Self {\n  187 |         flex32(f32::min_positive_value())\n  188 |     }","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/relaxed.rs#L186-L188"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Float::DIGITS` is documented by `core` as the *approximate number of significant decimal digits*\n(`f32::DIGITS == 6`, `f64::DIGITS == 15`). Three implementations set it to `32`, which is the bit\nwidth, not a digit count: `flex32`, `tf32` and `DynamicScalar`. Any generic code that sizes buffers\nor formats values from `E::DIGITS` gets a value ~5x too large for these types.","fix":"Use real decimal-digit counts, e.g. `const DIGITS: u32 = f32::DIGITS;` (6) for `flex32` and\n`DynamicScalar`, and the `tf32` precision (10-bit mantissa, so `3`) for `tf32`:\n\n```rust\n-    const DIGITS: u32 = 32;\n+    const DIGITS: u32 = 3; // tf32 keeps a 10-bit mantissa\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/element/float/relaxed.rs:59-60","code":"   59 | impl Float for flex32 {\n   60 |     const DIGITS: u32 = 32;","lines":2,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/float/relaxed.rs#L59-L60"},{"ref":"crates/cubecl-core/src/frontend/element/float/tensor_float.rs:60-61","code":"   60 | impl Float for tf32 {\n   61 |     const DIGITS: u32 = 32;","lines":2,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/float/tensor_float.rs#L60-L61"},{"ref":"crates/cubecl-core/src/frontend/element/typemap.rs:765-767","code":"  765 | impl<Marker: 'static> Float for DynamicScalar<Marker> {\n  766 |     const DIGITS: u32 = 32;\n  767 |     const EPSILON: Self = DynamicScalar::from_f64(half::f16::EPSILON.to_f64_const());","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/typemap.rs#L765-L767"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SteppedRangeExpand::const_len` is wrong in two ways and can panic in a third:\n```rust\nfn const_len(&self) -> Option<usize> {\n    let start = self.start.constant()?.as_i128();\n    let end = self.end.constant()?.as_i128();\n    let step = self.step.constant()?.as_i128().unsigned_abs();\n    Some((start.abs_diff(end) / step) as usize)\n}\n```\n* It uses floor division, so `(0..3).step_by(2)` reports `1` while the loop really runs twice. Since\n  `for_expand` unrolls whenever `const_len() == Some(1)`, this silently forces full unrolling of loops that are\n  not single-iteration.\n* It ignores `self.inclusive`, unlike `RangeInclusiveExpand::const_len` which adds `+ 1`, so inclusive stepped\n  ranges are under-reported by one iteration.\n* `step == 0` divides by zero and panics during kernel expansion instead of reporting a usable error.","fix":"```rust\nfn const_len(&self) -> Option<usize> {\n    let start = self.start.constant()?.as_i128();\n    let end = self.end.constant()?.as_i128();\n    let step = self.step.constant()?.as_i128().unsigned_abs();\n    if step == 0 {\n        return None;\n    }\n    let span = start.abs_diff(end) + if self.inclusive { 1 } else { 0 };\n    Some(span.div_ceil(step) as usize)\n}\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/ranges.rs:474-479","code":"  474 |     fn const_len(&self) -> Option<usize> {\n  475 |         let start = self.start.constant()?.as_i128();\n  476 |         let end = self.end.constant()?.as_i128();\n  477 |         let step = self.step.constant()?.as_i128().unsigned_abs();\n  478 |         Some((start.abs_diff(end) / step) as usize)\n  479 |     }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/ranges.rs#L474-L479"},{"ref":"crates/cubecl-core/src/frontend/ranges.rs:147-151","code":"  147 |     fn const_len(&self) -> Option<usize> {\n  148 |         let start = self.start.expand.as_const()?.as_i64();\n  149 |         let end = self.last.expand.as_const()?.as_i64();\n  150 |         Some(start.abs_diff(end) as usize + 1)\n  151 |     }","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/ranges.rs#L147-L151"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`EmbeddedBundle` validates that the *entry* index is sorted but never that the *namespace* table\nis, even though `namespace_id` binary-searches it. A blob whose namespace table is out of order\nsilently answers misses for the namespaces the search skips over.\n\n`validate_entries` only checks UTF-8 for the namespace table:\n\n```rust\n// The namespace table must be readable as UTF-8 to be comparable.\nfor index in 0..namespace_count {\n    self.namespace(index)\n        .ok_or(Corrupted(\"namespace is not valid UTF-8\"))?;\n}\n```\n\nwhile the entry index gets a full ordering check with the explicit rationale \"A blob is untrusted\ninput, and `get`, `first_of` and `scan` all assume this ordering: an unsorted index would silently\nanswer misses\". `namespace_id` makes exactly the same assumption:\n\n```rust\nfn namespace_id(&self, namespace: &str) -> Option<u32> {\n    let at = lower_bound(self.namespaces.len(), |index| {\n        Some(self.namespace(index)?.cmp(namespace))\n    })?;\n    (self.namespace(at)? == namespace).then_some(at as u32)\n}\n```\n\nFailure scenario: a bundle whose namespace table lists `[\"z/ns\", \"a/ns\"]`. `open` succeeds,\n`namespaces()` returns both names, `bundle::import` iterates both, but `scan(\"a/ns\", ..)` calls\n`namespace_id(\"a/ns\")`, whose binary search lands on index 0 (`\"z/ns\"`), compares unequal, and\nreturns `None` — so `import` reports the namespace as imported with 0 entries and the user gets a\nbundle that installs nothing with no error anywhere.","fix":"Check strict ordering while walking the table, in the same loop that validates UTF-8:\n\n```rust\n // The namespace table must be readable as UTF-8 to be comparable, and\n // sorted, because `namespace_id` binary-searches it.\n+let mut previous: Option<&str> = None;\n for index in 0..namespace_count {\n-    self.namespace(index)\n-        .ok_or(Corrupted(\"namespace is not valid UTF-8\"))?;\n+    let current = self\n+        .namespace(index)\n+        .ok_or(Corrupted(\"namespace is not valid UTF-8\"))?;\n+    if let Some(previous) = previous\n+        && previous >= current\n+    {\n+        return Err(Corrupted(\"namespace table is not sorted\"));\n+    }\n+    previous = Some(current);\n }\n```","locations":[{"ref":"crates/cubecl-environment/src/bundle/embedded.rs:262-266","code":"  262 |         // The namespace table must be readable as UTF-8 to be comparable.\n  263 |         for index in 0..namespace_count {\n  264 |             self.namespace(index)\n  265 |                 .ok_or(Corrupted(\"namespace is not valid UTF-8\"))?;\n  266 |         }","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bundle/embedded.rs#L262-L266"},{"ref":"crates/cubecl-environment/src/bundle/embedded.rs:331-338","code":"  331 |     /// The id of `namespace`, by binary search over the sorted table.\n  332 |     fn namespace_id(&self, namespace: &str) -> Option<u32> {\n  333 |         let at = lower_bound(self.namespaces.len(), |index| {\n  334 |             Some(self.namespace(index)?.cmp(namespace))\n  335 |         })?;\n  336 | \n  337 |         (self.namespace(at)? == namespace).then_some(at as u32)\n  338 |     }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bundle/embedded.rs#L331-L338"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`EmbeddedBundle::summary` builds its output vector with `filter_map`, then indexes that vector by\nnamespace *id*, so any dropped namespace silently shifts every subsequent namespace's counters onto\nthe wrong row:\n\n```rust\nlet mut summary: Vec<NamespaceSummary> = (0..self.namespaces.len())\n    .filter_map(|index| Some(NamespaceSummary { namespace: ...to_string(self.namespace(index)?), ... }))\n    .collect();\n\nfor index in 0..self.entries.1 {\n    ...\n    if let Some(namespace) = summary.get_mut(entry.namespace as usize) { ... }\n}\n```\n\n`entry.namespace` is an index into `self.namespaces`, not into `summary`. The two only coincide as\nlong as `filter_map` drops nothing. Today `validate_entries` happens to guarantee that (it rejects\nnon-UTF-8 namespaces at open), so the bug is latent — but `summary` is written as if it tolerated a\n`None`, and the `let Some(entry) = ... else { break }` right below shows the same defensive intent.\nAny future relaxation of the UTF-8 check, or a `namespace()` that can fail for another reason,\nsilently misreports every namespace after the first bad one.","fix":"Keep the id-to-row mapping total, so the index is always the namespace id:\n\n```rust\n let mut summary: Vec<NamespaceSummary> = (0..self.namespaces.len())\n-    .filter_map(|index| { Some(NamespaceSummary { namespace: ...(self.namespace(index)?), entries: 0, bytes: 0 }) })\n+    .map(|index| NamespaceSummary {\n+        // An unreadable namespace keeps its slot so `entry.namespace` stays a\n+        // valid index into this vector.\n+        namespace: self.namespace(index).unwrap_or(\"<invalid>\").to_string(),\n+        entries: 0,\n+        bytes: 0,\n+    })\n     .collect();\n```","locations":[{"ref":"crates/cubecl-environment/src/bundle/embedded.rs:301-323","code":"  301 |     pub fn summary(&self) -> Vec<NamespaceSummary> {\n  302 |         let mut summary: Vec<NamespaceSummary> = (0..self.namespaces.len())\n  303 |             .filter_map(|index| {\n  304 |                 Some(NamespaceSummary {\n  305 |                     namespace: alloc::string::ToString::to_string(self.namespace(index)?),\n  306 |                     entries: 0,\n  307 |                     bytes: 0,\n  308 |                 })\n  309 |             })\n  310 |             .collect();\n  311 | \n  312 |         for index in 0..self.entries.1 {\n  313 |             let Some(entry) = self.entry(index) else {\n  314 |                 break;\n  315 |             };\n  316 |             if let Some(namespace) = summary.get_mut(entry.namespace as usize) {\n  317 |                 namespace.entries += 1;\n  318 |                 namespace.bytes += u64::from(entry.key_len) + u64::from(entry.value_len);\n  319 |             }\n  320 |         }\n  321 | \n  322 |         summary\n  323 |     }","lines":23,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bundle/embedded.rs#L301-L323"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`export` derives the staging path and the sidecar paths from `Path::display()`, which is lossy for\nnon-UTF-8 paths:\n\n```rust\nfn staging_path(out: &Path) -> PathBuf {\n    PathBuf::from(std::format!(\"{}.tmp\", out.display()))\n}\n\nfn sidecar(path: &Path, suffix: &str) -> PathBuf {\n    PathBuf::from(std::format!(\"{}{suffix}\", path.display()))\n}\n```\n\n`display()` replaces every non-UTF-8 byte with U+FFFD, so for an output path containing such bytes\nthe staged bundle is written to a *different* file than the one `publish` later tries to rename, and\n`std::fs::rename(staged, out)` fails with `NotFound` while the real staged file is left behind\nforever. The same lossy conversion applies to the `-wal`/`-shm` sidecars, so `discard` and\n`publish` can silently operate on the wrong files.\n\n`copy_entries` in the same module already recognizes the hazard for the *source* path and rejects\nnon-UTF-8 explicitly (\"A path we can't pass losslessly is reported rather than approximated\"); the\noutput path gets no such treatment.","fix":"Build the derived paths from the `OsString` rather than from the display form:\n\n```rust\nfn staging_path(out: &Path) -> PathBuf {\n    let mut name = out.as_os_str().to_os_string();\n    name.push(\".tmp\");\n    PathBuf::from(name)\n}\n\nfn sidecar(path: &Path, suffix: &str) -> PathBuf {\n    let mut name = path.as_os_str().to_os_string();\n    name.push(suffix);\n    PathBuf::from(name)\n}\n```","locations":[{"ref":"crates/cubecl-environment/src/bundle/export.rs:347-354","code":"  347 | /// Where a bundle is built before it takes the place of `out`.\n  348 | fn staging_path(out: &Path) -> PathBuf {\n  349 |     PathBuf::from(std::format!(\"{}.tmp\", out.display()))\n  350 | }\n  351 | \n  352 | fn sidecar(path: &Path, suffix: &str) -> PathBuf {\n  353 |     PathBuf::from(std::format!(\"{}{suffix}\", path.display()))\n  354 | }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bundle/export.rs#L347-L354"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SharedAllocationController::alloc_align` reports the *inner* allocation's alignment even when the\ncontroller views a sub-range that starts at an unaligned offset, so `Bytes::align()` can claim an\nalignment the data pointer does not have:\n\n```rust\nfn alloc_align(&self) -> usize {\n    if self.controller.is_completed() {\n        MAX_ALIGN\n    } else {\n        // Report the inner allocation's alignment. `try_into_vec` still\n        // fails because `try_detach` is never implemented for shared bytes.\n        self.inner.align()\n    }\n}\n```\n\nThe comment only justifies why `try_into_vec` is safe; it says nothing about `self.offset`. For\n`Bytes::from_elems(vec![0u32, 1, 2, 3]).shared().view(1, 5)` the controller is\n`SharedAllocationController { offset: 1, len: 4 }` and `Bytes::align()` returns `4`, although the\ndata begins at `inner_ptr + 1` and is only 1-byte aligned.\n\n`Bytes::align()` is public, and `Bytes::split_owned` consumes it to choose the alignment of the\ncopies it makes (`Self::try_from_data(this.align(), &this[..offset])`), so a caller that trusts\n`align()` — to decide whether a `bytemuck` cast or a SIMD load is legal, say — is told the wrong\nthing. Today no in-tree caller relies on it for a pointer-alignment decision, which is what keeps\nthis at low severity.","fix":"Report only the alignment the view actually has:\n\n```rust\n fn alloc_align(&self) -> usize {\n     if self.controller.is_completed() {\n         MAX_ALIGN\n     } else {\n-        // Report the inner allocation's alignment. `try_into_vec` still\n-        // fails because `try_detach` is never implemented for shared bytes.\n-        self.inner.align()\n+        // A sub-view starting at an unaligned offset is only as aligned as\n+        // that offset allows. `try_into_vec` still fails either way, because\n+        // `try_detach` is never implemented for shared bytes.\n+        let inner = self.inner.align();\n+        if self.offset == 0 {\n+            inner\n+        } else {\n+            inner.min(1usize << self.offset.trailing_zeros().min(inner.trailing_zeros()))\n+        }\n     }\n }\n```\n\nor simply return `1` for any non-zero `offset`, which is always sound.","locations":[{"ref":"crates/cubecl-environment/src/bytes/shared_arc.rs:81-89","code":"   81 |     fn alloc_align(&self) -> usize {\n   82 |         if self.controller.is_completed() {\n   83 |             MAX_ALIGN\n   84 |         } else {\n   85 |             // Report the inner allocation's alignment. `try_into_vec` still\n   86 |             // fails because `try_detach` is never implemented for shared bytes.\n   87 |             self.inner.align()\n   88 |         }\n   89 |     }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bytes/shared_arc.rs#L81-L89"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`PtrBindings` is a fixed 1024-slot (`AMD_MAX_BINDINGS`) ring whose slots are\nhanded to `hipModuleLaunchKernel` as the kernel argument cells, and `register`\nsilently wraps when the ring is exhausted, overwriting a slot a not-yet-launched\nargument list still points at. `HipServer::launch_checked` registers one slot per\nbuffer *plus one for the info buffer*, so a launch with `AMD_MAX_BINDINGS`\nbuffers needs 1025 slots and its first argument is clobbered by its last, and\nnothing enforces the limit: `HardwareProperties::max_bindings` is written by every\nruntime but read by nobody in the workspace. The failure is silent argument\ncorruption, not an error.","fix":"Size the ring for the extra info binding and reject overruns rather than\nwrapping into live slots, e.g. allocate `AMD_MAX_BINDINGS as usize + 1` slots and\nvalidate the binding count in `launch_checked`:\n```rust\nif buffers.len() as u32 >= AMD_MAX_BINDINGS {\n    return Err(ServerError::Generic {\n        reason: format!(\"{} bindings exceeds the AMD limit of {AMD_MAX_BINDINGS}\", buffers.len()),\n        backtrace: BackTrace::capture(),\n    });\n}\n```","locations":[{"ref":"crates/cubecl-hip/src/compute/storage/gpu.rs:92-104","code":"   92 |     fn register(&mut self, ptr: u64) -> &u64 {\n   93 |         self.slots[self.cursor] = ptr;\n   94 |         let ptr_ref = self.slots.get(self.cursor).unwrap();\n   95 | \n   96 |         self.cursor += 1;\n   97 | \n   98 |         // Reset the cursor when the ring buffer is full.\n   99 |         if self.cursor >= self.slots.len() {\n  100 |             self.cursor = 0;\n  101 |         }\n  102 | \n  103 |         ptr_ref\n  104 |     }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-hip/src/compute/storage/gpu.rs#L92-L104"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Expression::RuntimeMatch` decides between the value-producing builder and the statement builder\nfrom the *first* arm only: `let has_value = arms.iter().next().is_some_and(|arm| arm.expr.needs_terminator());`.\nIf the first arm's block ends in a statement while another arm yields a value, `match_expand`\n(statement form) is selected and the value-returning `.case(...)` closures no longer type-check.\nThe sibling `Expression::Switch` arm gets this right by inspecting the default block\n(`default.ret.is_some()`).","fix":"Decide from all arms:\n```rust\nlet has_value = arms.iter().any(|arm| arm.expr.needs_terminator());\n```\nand reject the mixed case (some arms with a value, some without) with a `syn::Error`.","locations":[{"ref":"crates/cubecl-macros/src/generate/expression.rs:565-573","code":"  565 |                 let has_value = arms\n  566 |                     .iter()\n  567 |                     .next()\n  568 |                     .is_some_and(|arm| arm.expr.needs_terminator());\n  569 | \n  570 |                 let match_ = match has_value {\n  571 |                     true => quote![match_expand_expr],\n  572 |                     false => quote![match_expand],\n  573 |                 };","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/expression.rs#L565-L573"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Launch::kernel_entrypoint_name` pushes the same type parameter once per matching bound: the\n`continue` inside the bound loop continues the *inner* loop, so `F: Float + Numeric` appends `F`\ntwice to `matching_generics`. The suffix is then built with `defines.remove(ident)`, which\nsucceeds only the first time; the second occurrence falls into the\n`None => quote![#type_name::<#ident>();]` branch and emits a reference to `F`, a generic that\n`Launch::from_item_fn` removed from `kernel_generics` for defined generics. The result is a\nduplicated name suffix and, for a defined generic, generated code that names a type parameter\nwhich is not in scope.","fix":"Stop at the first matching bound per type parameter:\n```rust\nfor bound in &ty.bounds {\n    ...\n    if suffix_producing_bounds.contains(&generic_trailing.ident) {\n        matching_generics.push(ty.ident.clone());\n        break; // one suffix per generic\n    }\n}\n```","locations":[{"ref":"crates/cubecl-macros/src/generate/kernel.rs:312-333","code":"  312 |         for ty in generics.type_params() {\n  313 |             for bound in &ty.bounds {\n  314 |                 let TypeParamBound::Trait(t) = bound else {\n  315 |                     continue;\n  316 |                 };\n  317 | \n  318 |                 // Using last should account for the bounds such as `Float` but also\n  319 |                 // `some::prefix::Float`\n  320 |                 let Some(generic_trailing) = t.path.segments.last() else {\n  321 |                     continue;\n  322 |                 };\n  323 | \n  324 |                 // If we find some type parameter with `Float` as a bound,\n  325 |                 // add a suffix based on a shortened version of the\n  326 |                 // type name\n  327 |                 if suffix_producing_bounds.contains(&generic_trailing.ident) {\n  328 |                     // E.g. the `F` in `F: Float` or `N` in `N: Numeric`\n  329 |                     matching_generics.push(ty.ident.clone());\n  330 |                     continue;\n  331 |                 }\n  332 |             }\n  333 |         }","lines":22,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/kernel.rs#L312-L333"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`numeric_match` parses the arm bodies with `Block::from_block(block.block, context)` directly,\nwithout wrapping them in `context.in_scope(...)`. Every other arm-parsing site does use\n`in_scope` (see the fallback path in `Expression::from_expr`, `crates/cubecl-macros/src/parse/expression.rs:311-320`).\nConsequently locals declared inside a switch arm are pushed into the *enclosing* managed scope\nand remain visible after the match:\n```rust\nlet y = some_runtime_value;          // runtime variable\nmatch idx { 0 => { let y = 5; }, _ => {} };\ny + 1                                // resolves to the arm-local comptime `y`\n```\n`Context::variable` walks the scope backwards and finds the arm-local `y` (with `is_const:\ntrue`), so the trailing expression is expanded as a comptime literal instead of the runtime\nvariable. The same leak happens when `numeric_match` ultimately returns `None`: the partially\nparsed arms have already mutated `context`, and the fallback path parses them again.","fix":"Scope each arm body:\n```rust\nfn parse_body(expr: Expr, context: &mut Context) -> Option<Block> {\n    match expr {\n        Expr::Block(block) => context\n            .in_scope(|ctx| Block::from_block(block.block, ctx))\n            .ok()\n            .map(|(block, _)| block),\n        expr => { ... }\n    }\n}\n```","locations":[{"ref":"crates/cubecl-macros/src/parse/branch.rs:208-219","code":"  208 |     fn parse_body(expr: Expr, context: &mut Context) -> Option<Block> {\n  209 |         match expr {\n  210 |             Expr::Block(block) => Block::from_block(block.block, context).ok(),\n  211 |             expr => {\n  212 |                 let expr = Expression::from_expr(expr, context).ok()?;\n  213 |                 Some(Block {\n  214 |                     ret: Some(Box::new(expr)),\n  215 |                     inner: vec![],\n  216 |                 })\n  217 |             }\n  218 |         }\n  219 |     }","lines":12,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/branch.rs#L208-L219"},{"ref":"crates/cubecl-macros/src/parse/branch.rs:232-246","code":"  232 |     for arm in arms {\n  233 |         let pat = parse_pat(arm.pat)?;\n  234 |         if pat.is_empty() {\n  235 |             default = Some(arm.body)\n  236 |         } else {\n  237 |             switch_arms.extend(pat.into_iter().map(|lit| (lit, arm.body.clone())));\n  238 |         }\n  239 |     }\n  240 | \n  241 |     let default = parse_body(*default?, context)?;\n  242 | \n  243 |     let cases = switch_arms\n  244 |         .into_iter()\n  245 |         .map(|(lit, body)| Some((lit, parse_body(*body, context)?)))\n  246 |         .collect::<Option<Vec<_>>>()?;","lines":15,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/branch.rs#L232-L246"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"A `#[comptime]` attribute on a `match` is honoured only on the fallback path\n(`let is_comptime = mat.attrs.iter().any(is_comptime_attr) || ...`). `numeric_match` is tried\n*before* that check and does not look at `mat.attrs`, so `#[comptime] match x { 1 => .., _ => .. }`\nover a non-const scrutinee is still lowered into a runtime `switch_expand`, silently ignoring the\nuser's request to resolve the match at compile time.","fix":"Check the attribute before attempting the numeric lowering:\n```rust\nlet is_comptime_attr_present = mat.attrs.iter().any(is_comptime_attr);\n...\n} else if let Some(switch) = (!is_comptime_attr_present)\n    .then(|| numeric_match(mat.clone(), context))\n    .flatten()\n{\n    switch\n}\n```","locations":[{"ref":"crates/cubecl-macros/src/parse/expression.rs:310-338","code":"  310 |                 } else if let Some(switch) = numeric_match(mat.clone(), context) {\n  311 |                     switch\n  312 |                 } else {\n  313 |                     let mut arms = Vec::new();\n  314 | \n  315 |                     for arm in mat.arms.iter() {\n  316 |                         let (expr, _) = context.in_scope(|context| {\n  317 |                             add_variables_from_pat(&arm.pat, context);\n  318 |                             Self::from_expr(arm.body.as_ref().clone(), context)\n  319 |                         })?;\n  320 |                         arms.push(MatchArm {\n  321 |                             pat: arm.pat.clone(),\n  322 |                             expr: Box::new(expr),\n  323 |                         });\n  324 |                     }\n  325 | \n  326 |                     let runtime_compatible = arms\n  327 |                         .iter()\n  328 |                         .all(|arm| is_runtime_compatible_variant(&arm.pat));\n  329 |                     let num_values = arms.iter().filter_map(|arm| inner_pat(&arm.pat)).count();\n  330 |                     let maybe_runtime = runtime_compatible\n  331 |                     && num_values <= 1\n  332 |                     // Code won't work properly if there's no case. Empty or wildcard only matches\n  333 |                     // are always resolved at comptime anyways.\n  334 |                     && !arms.is_empty()\n  335 |                     && !arms.iter().all(|arm| matches!(arm.pat, Pat::Wild(_)));\n  336 |                     let is_comptime = mat.attrs.iter().any(is_comptime_attr)\n  337 |                         || arms.iter().all(|it| it.expr.is_const())\n  338 |                         || expr.is_const();","lines":29,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/expression.rs#L310-L338"}]},
