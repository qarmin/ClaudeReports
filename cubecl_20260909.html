<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`FastDivmod::register` computes a 64-bit magic multiplier with `find_params_u64`, then converts it with\n`I::from_int(multiplier as i64)`. `Numeric::from_int` is `<Self as NumCast>::from(val).unwrap()`, so a\nnegative `i64` cannot be converted to `usize`/`u64` and the `unwrap()` panics. `multiplier` routinely\nexceeds `i64::MAX`: for `divisor = 5`, `shift = 3` and\n`multiplier = (1u128 << 64) * (8 - 5) / 5 + 1 = 11068046444225730970`, which as `i64` is negative. So\nlaunching any kernel that takes a `FastDivmod<usize>` on a runtime with a 64-bit address type and a divisor\nsuch as 5 panics during launch preparation with `called Option::unwrap() on a None value`.","fix":"Go through the 128-bit constructor, which exists exactly to represent values above `i64::MAX`:\n```rust\n8 => {\n    let divisor = divisor.to_u64().unwrap();\n    let (shift, multiplier) = find_params_u64(divisor);\n    let multiplier = I::from_int_128(multiplier as i128);\n    (shift, multiplier)\n}\n```","locations":[{"ref":"crates/cubecl-std/src/fast_math.rs:137-143","code":"  137 |                         8 => {\n  138 |                             let divisor = divisor.to_u64().unwrap();\n  139 |                             let (shift, multiplier) = find_params_u64(divisor);\n  140 | \n  141 |                             let multiplier = I::from_int(multiplier as i64);\n  142 |                             (shift, multiplier)\n  143 |                         }","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/fast_math.rs#L137-L143"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`BenchmarkDurations` assumes a non-empty `durations` vector in three places:\n`min_max_median_durations` does `*sorted.first().unwrap()` / `*sorted.last().unwrap()` /\n`*sorted.get(sorted.len() / 2).unwrap()`, and `mean_duration` / `variance_duration` divide by\n`self.durations.len() as u32`, which is a divide-by-zero panic when the vector is empty. The sample\ncount comes from the environment: `Benchmark::num_samples` parses `BENCH_NUM_SAMPLES`, so\n`BENCH_NUM_SAMPLES=0` produces an empty `durations` and any `BenchmarkComputations::new` /\n`Display` of the result panics. The same `parse` also silently swallows a malformed value via\n`unwrap_or(DEFAULT)`.","fix":"Reject a zero sample count where it is read, e.g.\n```rust\nfn num_samples(&self) -> usize {\n    const DEFAULT: usize = 15;\n    #[cfg(feature = \"std\")]\n    {\n        match std::env::var(\"BENCH_NUM_SAMPLES\") {\n            Ok(val) => match val.parse::<usize>() {\n                Ok(0) | Err(_) => DEFAULT,\n                Ok(n) => n,\n            },\n            Err(_) => DEFAULT,\n        }\n    }\n    ...\n}\n```\nand make `min_max_median_durations` / `mean_duration` return `Option<...>` (or early-return\n`Duration::ZERO`) instead of unwrapping.","locations":[{"ref":"crates/cubecl-common/src/benchmark.rs:35-59","code":"   35 |     fn min_max_median_durations(&self) -> (Duration, Duration, Duration) {\n   36 |         let mut sorted = self.durations.clone();\n   37 |         sorted.sort();\n   38 |         let min = *sorted.first().unwrap();\n   39 |         let max = *sorted.last().unwrap();\n   40 |         let median = *sorted.get(sorted.len() / 2).unwrap();\n   41 |         (min, max, median)\n   42 |     }\n   43 | \n   44 |     /// Returns the median duration among all durations\n   45 |     pub(crate) fn mean_duration(&self) -> Duration {\n   46 |         self.durations.iter().sum::<Duration>() / self.durations.len() as u32\n   47 |     }\n   48 | \n   49 |     /// Returns the variance durations for the durations\n   50 |     pub(crate) fn variance_duration(&self, mean: Duration) -> Duration {\n   51 |         self.durations\n   52 |             .iter()\n   53 |             .map(|duration| {\n   54 |                 let tmp = duration.as_secs_f64() - mean.as_secs_f64();\n   55 |                 Duration::from_secs_f64(tmp * tmp)\n   56 |             })\n   57 |             .sum::<Duration>()\n   58 |             / self.durations.len() as u32\n   59 |     }","lines":25,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/benchmark.rs#L35-L59"},{"ref":"crates/cubecl-common/src/benchmark.rs:209-222","code":"  209 |     fn num_samples(&self) -> usize {\n  210 |         const DEFAULT: usize = 15;\n  211 |         #[cfg(feature = \"std\")]\n  212 |         {\n  213 |             std::env::var(\"BENCH_NUM_SAMPLES\")\n  214 |                 .map(|val| str::parse::<usize>(&val).unwrap_or(DEFAULT))\n  215 |                 .unwrap_or(DEFAULT)\n  216 |         }\n  217 | \n  218 |         #[cfg(not(feature = \"std\"))]\n  219 |         {\n  220 |             DEFAULT\n  221 |         }\n  222 |     }","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/benchmark.rs#L209-L222"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`format_str` decrements `depth` (an inferred `usize`) on every closing marker without checking that\nit is greater than zero, and the `in_string` flag it tracks is only consulted for spaces - markers\nand commas inside string literals are processed as structure. Any input with an unbalanced closer\ntherefore underflows: `depth -= 1` panics in debug builds, and in release it wraps to\n`usize::MAX`, so the next `\" \".repeat(indentation * depth)` panics with a capacity overflow / OOM.\nThis is reachable from ordinary logging: `KernelId`'s `Display` runs `format_str` over\n`format!(\"{info:?}\")` for arbitrary kernel info (`crates/cubecl-runtime/src/id.rs:130-134`), so a\nsingle `}` or `)` inside a string field is enough, and\n`crates/cubecl-runtime/src/kernel.rs:316` runs it with `[('<', '>')]` over a long kernel type name,\nwhere a `->` contributes an unmatched `>`.","fix":"Guard the decrement and skip structural handling inside string literals:\n```rust\nif in_string {\n    result.push(c);\n    prev = c;\n    continue;\n}\n...\n} else if c == end {\n    depth = depth.saturating_sub(1);\n```\n(the `depth > 0` check should also gate the `,`-handling branch, which already tests `depth > 0`).","locations":[{"ref":"crates/cubecl-common/src/format.rs:22-65","code":"   22 |     for c in string.chars() {\n   23 |         if c == ' ' {\n   24 |             if in_string {\n   25 |                 result.push(c);\n   26 |             }\n   27 | \n   28 |             continue;\n   29 |         }\n   30 |         if c == '\"' {\n   31 |             in_string = !in_string;\n   32 |         }\n   33 | \n   34 |         let mut found_marker = false;\n   35 | \n   36 |         for (start, end) in markers {\n   37 |             let (start, end) = (*start, *end);\n   38 | \n   39 |             if c == start {\n   40 |                 depth += 1;\n   41 |                 if prev != ' ' && include_space {\n   42 |                     result.push(' ');\n   43 |                 }\n   44 |                 result.push(start);\n   45 |                 result.push('\\n');\n   46 |                 result.push_str(&\" \".repeat(indentation * depth));\n   47 |                 found_marker = true;\n   48 |             } else if c == end {\n   49 |                 depth -= 1;\n   50 |                 if prev != start {\n   51 |                     if prev == ' ' {\n   52 |                         result.pop();\n   53 |                     }\n   54 |                     result.push_str(\",\\n\");\n   55 |                     result.push_str(&\" \".repeat(indentation * depth));\n   56 |                     result.push(end);\n   57 |                 } else {\n   58 |                     for _ in 0..(&\" \".repeat(indentation * depth).len()) + 1 + indentation {\n   59 |                         result.pop();\n   60 |                     }\n   61 |                     result.push(end);\n   62 |                 }\n   63 |                 found_marker = true;\n   64 |             }\n   65 |         }","lines":44,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/format.rs#L22-L65"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`BoolOps::__expand_new` assumes the argument is a compile-time constant:\n`ElemType::Bool.constant(value.expand.as_const().unwrap())`. Writing `bool::new(cond)` in a kernel\nwhere `cond` is a runtime boolean makes `as_const()` return `None` and the kernel expansion panics\nwith a bare `called Option::unwrap() on a None value`, with no indication of which kernel or which\ncall site is at fault. The non-expanded `BoolOps::new` accepts any `bool`, so nothing in the API\nsignals that only literals are allowed.","fix":"Pass runtime values through instead of unwrapping, e.g.\n\n```rust\nfn __expand_new(_scope: &Scope, value: NativeExpand<bool>) -> NativeExpand<bool> {\n    match value.expand.as_const() {\n        Some(constant) => ElemType::Bool.constant(constant).into(),\n        None => value,\n    }\n}\n```\n\nor emit a proper diagnostic with `expand_error!(\"bool::new expects a comptime value\")`.","locations":[{"ref":"crates/cubecl-core/src/frontend/element/bool.rs:10-20","code":"   10 | pub trait BoolOps {\n   11 |     #[allow(clippy::new_ret_no_self)]\n   12 |     fn new(value: bool) -> bool {\n   13 |         value\n   14 |     }\n   15 |     fn __expand_new(_scope: &Scope, value: NativeExpand<bool>) -> NativeExpand<bool> {\n   16 |         ElemType::Bool\n   17 |             .constant(value.expand.as_const().unwrap())\n   18 |             .into()\n   19 |     }\n   20 | }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/bool.rs#L10-L20"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The CPU launch path panics instead of reporting errors on the stream, unlike every other error path\nin `CpuServer` (which uses `stream.error(...)`). `prepare_bindings` does `.unwrap()` on\n`get_resource` (a freed/foreign handle is `Err(IoError::InvalidHandle)`), `prepare_task` indexes the\ndynamic-cube-count buffer with `bytes[0..4]`, `bytes[4..8]`, `bytes[8..12]` and `.unwrap()`s the\n`try_into` (a buffer shorter than 12 bytes panics on the slice range), and `launch` does\n`self.prepare_task(...).unwrap()`, turning any `CompilationError` (a kernel the MLIR backend cannot\ncompile) into a panic in the middle of a user launch.","fix":"Propagate the failures onto the stream's error sink the way `write` does:\n```rust\nlet task = match self.prepare_task(kernel, count, bindings, kind) {\n    Ok(task) => task,\n    Err(err) => {\n        self.scheduler.stream(&stream_id).error(err.into());\n        return;\n    }\n};\n```\nand check the dynamic count buffer length before slicing:\n```rust\nlet bytes = resource.read();\nif bytes.len() < 12 {\n    stream.error(/* IoError::InvalidHandle / ServerError */);\n    return Err(..);\n}\n```","locations":[{"ref":"crates/cubecl-cpu/src/compute/server.rs:100-104","code":"  100 |                 let memory = binding.memory.clone();\n  101 |                 let resource = stream\n  102 |                     .memory_management\n  103 |                     .get_resource(binding.memory, binding.offset_start, binding.offset_end)\n  104 |                     .unwrap();","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cpu/src/compute/server.rs#L100-L104"},{"ref":"crates/cubecl-cpu/src/compute/server.rs:133-137","code":"  133 |                 let bytes = resource.read();\n  134 |                 let x = u32::from_ne_bytes(bytes[0..4].try_into().unwrap());\n  135 |                 let y = u32::from_ne_bytes(bytes[4..8].try_into().unwrap());\n  136 |                 let z = u32::from_ne_bytes(bytes[8..12].try_into().unwrap());\n  137 |                 [x, y, z]","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cpu/src/compute/server.rs#L133-L137"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`DispatcherScheduler` assumes `get_active_cores()` yields at least one core. `ensure_workers` does\n`self.cores[self.tx.len() % self.cores.len()]`, which is a division by zero when `cores` is empty, and\n`new()` then calls `ensure_workers(0)`, leaving `tx`/`lens` empty so the load-balancing branch of\n`send` panics on `self.lens[0]`. On Linux `get_active_cores` derives the core list from a\n`sched_getaffinity` call whose return value is ignored; if the syscall fails the mask stays zeroed and\nthe iterator is empty, so the very first CPU kernel launch panics with \"attempt to calculate the\nremainder with a divisor of zero\" instead of degrading to a single worker.","fix":"Guarantee a non-empty core list in `DispatcherScheduler::new`:\n```rust\nlet mut cores: Vec<_> = get_active_cores().collect();\nif cores.is_empty() {\n    cores.push(CoreId(0)); // affinity query failed; fall back to a single unpinned worker\n}\nlet mut scheduler = Self { cores, tx: Vec::new(), lens: Vec::new() };\nscheduler.ensure_workers(scheduler.cores.len().max(1));\n```","locations":[{"ref":"crates/cubecl-cpu/src/compute/threadpool/scheduler/dispatcher.rs:48-56","code":"   48 |     pub fn ensure_workers(&mut self, n: usize) {\n   49 |         while self.tx.len() < n {\n   50 |             let core_id = self.cores[self.tx.len() % self.cores.len()];\n   51 |             let (worker, tx, len) = DispatcherWorker::new();\n   52 |             worker.spawn_thread(core_id);\n   53 |             self.tx.push(tx);\n   54 |             self.lens.push(len);\n   55 |         }\n   56 |     }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cpu/src/compute/threadpool/scheduler/dispatcher.rs#L48-L56"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`FileAllocationController::copy_into` panics on any I/O failure, even though the same controller's\nnormal read path (`ensure_init`) carefully returns `AccessError::Read`:\n\n```rust\nlet mut file = File::open(self.file.as_ref()).unwrap();\nfile.seek(SeekFrom::Start(self.offset)).unwrap();\nfile.read_exact(buf).unwrap();\n```\n\n`Bytes::copy_into` is safe and public, and the path stored in the controller is whatever was handed\nto `Bytes::from_file`. A file deleted, truncated, or moved between `Bytes::from_file` and the first\n`copy_into` (a downloaded weights file replaced by another process, a `tempfile` whose `TempDir`\nwas dropped, an NFS share that went away) turns into a process abort on the host-transfer path. Note\n`read_exact(buf)` also panics with `UnexpectedEof` whenever `buf.len()` exceeds the remaining file\nregion, which is precisely the mismatch the caller is never asked to check.","fix":"Route the uncached path through the same materialization the rest of the controller uses, so the\nerror is reported rather than fatal:\n\n```rust\nunsafe fn copy_into(&self, buf: &mut [u8]) {\n    // `ensure_init` reports a read failure instead of aborting, and caches the\n    // buffer for the next call.\n    let memory = match self.memory(AccessPolicy::default()) {\n        Ok(memory) => memory,\n        Err(err) => {\n            log::error!(\"file bytes: can't materialize {:?}: {err}\", self.file);\n            return;\n        }\n    };\n    let copy_len = buf.len().min(memory.len());\n    // SAFETY: bytes up to `copy_len` are initialized.\n    let data = unsafe { core::slice::from_raw_parts(memory.as_ptr().cast::<u8>(), copy_len) };\n    buf[..copy_len].copy_from_slice(data);\n}\n```\n\nIf the streaming (non-materializing) shortcut is worth keeping, keep it but map every `unwrap()` to\na logged early return.","locations":[{"ref":"crates/cubecl-environment/src/bytes/file.rs:160-179","code":"  160 |     unsafe fn copy_into(&self, buf: &mut [u8]) {\n  161 |         if self.controller.is_completed() {\n  162 |             let len = buf.len();\n  163 |             let memory = self\n  164 |                 .memory(AccessPolicy::default())\n  165 |                 .expect(\"file: host access failed\");\n  166 |             let memory_slice = &memory[0..len];\n  167 | \n  168 |             // SAFETY: By construction, bytes up to len are initialized.\n  169 |             let data = unsafe {\n  170 |                 core::slice::from_raw_parts(memory_slice.as_ptr().cast(), memory_slice.len())\n  171 |             };\n  172 |             buf.copy_from_slice(data);\n  173 |             return;\n  174 |         }\n  175 | \n  176 |         let mut file = File::open(self.file.as_ref()).unwrap();\n  177 |         file.seek(SeekFrom::Start(self.offset)).unwrap();\n  178 |         file.read_exact(buf).unwrap();\n  179 |     }","lines":20,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bytes/file.rs#L160-L179"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"A logger sink configured from `cubecl.toml` aborts the process on any filesystem problem.\n`FileLogger::new` unwraps both the directory creation and the file open:\n\n```rust\nfn new(path: &PathBuf, append: bool) -> Self {\n    if let Some(parent) = path.parent() {\n        std::fs::create_dir_all(parent).unwrap();\n    }\n    let file = OpenOptions::new() ... .open(path).unwrap();\n```\n\nThe path is user-supplied configuration (`LoggerConfig::file`, read from `cubecl.toml`), so a typo,\na read-only directory, a full disk, a path pointing at a directory, or a revoked permission panics\ninside `LoggerSinks::register` — i.e. during logger initialization, before the application has any\nchance to report anything. Everything else in this crate's configuration layer deliberately\ndegrades instead (see `report_malformed` and `CacheConfig::root`, which document \"a cache root that\ncan't be resolved must cost a recompute, not abort the process\"); this path breaks that rule.\n\n`FileLogger::log` has the same problem for the steady state: `writeln!(...).expect(...)` and\n`flush().expect(...)` panic on a full disk mid-run.","fix":"Make sink construction fallible and drop the sink (with a warning) when it can't be opened, matching\nthe rest of the config layer:\n\n```rust\nfn new(path: &PathBuf, append: bool) -> Option<Self> {\n    if let Some(parent) = path.parent()\n        && let Err(err) = std::fs::create_dir_all(parent)\n    {\n        log::warn!(\"cubecl logger: can't create {parent:?}: {err}; file logging disabled\");\n        return None;\n    }\n    match OpenOptions::new().write(true).append(append).truncate(!append).create(true).open(path) {\n        Ok(file) => Some(Self { writer: BufWriter::new(file) }),\n        Err(err) => {\n            log::warn!(\"cubecl logger: can't open {path:?}: {err}; file logging disabled\");\n            None\n        }\n    }\n}\n```\n\nand have `LoggerSinks::register` skip the sink when `FileLogger::new` returns `None`. In\n`FileLogger::log`, replace the two `expect`s with a logged warning.","locations":[{"ref":"crates/cubecl-environment/src/config/logger.rs:231-240","code":"  231 |     fn new(path: &PathBuf, append: bool) -> Self {\n  232 |         if let Some(parent) = path.parent() {\n  233 |             std::fs::create_dir_all(parent).unwrap();\n  234 |         }\n  235 |         let file = OpenOptions::new()\n  236 |             .write(true)\n  237 |             .append(append)\n  238 |             .create(true)\n  239 |             .open(path)\n  240 |             .unwrap();","lines":10,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/config/logger.rs#L231-L240"},{"ref":"crates/cubecl-environment/src/config/logger.rs:247-250","code":"  247 |     fn log<S: Display>(&mut self, msg: &S) {\n  248 |         writeln!(self.writer, \"{msg}\").expect(\"Should be able to log debug information.\");\n  249 |         self.writer.flush().expect(\"Can complete write operation.\");\n  250 |     }","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/config/logger.rs#L247-L250"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`as_const(context).unwrap()` is called on expressions that only satisfy `is_const()`, but\n`is_const()` does not imply `as_const()` returns `Some`. `Expression::is_const` returns `true`\nfor `Expression::CompilerIntrinsic { .. }` while `Expression::as_const` has no arm for it and\nfalls through to `_ => None` (`crates/cubecl-macros/src/expression.rs:210` vs `:281`). Both\n`Expression::If { .. } if condition.is_const()` and `MatchArm::to_tokens` unwrap that `Option`,\nso a proc-macro panic (`called Option::unwrap() on a None value`) is raised instead of a\ndiagnostic. The repository already has regression tests for exactly this class of bug on the\nbinary/unary folding paths (`const_fold_on_unfoldable_const_binary_does_not_panic`), so the\nremaining two sites are the same defect. Reachable example:\n```rust\n#[cube]\nfn f(x: CubeOption<Line<f32>>) -> u32 {\n    match x {\n        CubeOption::Some(v) => vectorization_of(v),\n        CubeOption::None => vectorization_of(v),\n    }\n}\n```\nAll arms are `CompilerIntrinsic`, so `Expression::Match::is_const()` is `true` and\n`MatchArm::to_tokens` unwraps `None`.","fix":"Fall back to the runtime expansion instead of unwrapping, mirroring the fix already applied to\nthe binary/unary fold paths:\n```rust\n// MatchArm::to_tokens\nlet expr = if is_const {\n    self.expr\n        .as_const(context)\n        .unwrap_or_else(|| self.expr.to_tokens(context))\n} else {\n    self.expr.to_tokens(context)\n};\n```\nand in the `Expression::If` arm replace `condition.as_const(context).unwrap()` with a guard that\nonly takes the comptime path when `condition.as_const(context).is_some()`.","locations":[{"ref":"crates/cubecl-macros/src/generate/expression.rs:326-338","code":"  326 |             Expression::If {\n  327 |                 condition,\n  328 |                 then_block,\n  329 |                 else_branch,\n  330 |             } if condition.is_const() => {\n  331 |                 let as_const = condition.as_const(context).unwrap();\n  332 |                 let then_block = then_block.to_tokens(context);\n  333 |                 let else_branch = else_branch\n  334 |                     .as_ref()\n  335 |                     .map(|it| it.to_tokens(context))\n  336 |                     .map(|it| quote![else #it]);\n  337 |                 quote![if #as_const #then_block #else_branch]\n  338 |             }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/expression.rs#L326-L338"},{"ref":"crates/cubecl-macros/src/generate/expression.rs:788-792","code":"  788 |         let expr = if is_const {\n  789 |             self.expr.as_const(context).unwrap()\n  790 |         } else {\n  791 |             self.expr.to_tokens(context)\n  792 |         };","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/expression.rs#L788-L792"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`MatchArm::expand_pat` and `append_expand_to_enum_name` `panic!` on patterns that ordinary user\ncode can contain, producing a `proc macro panicked` message with a `Debug`-formatted syn tree\ninstead of a spanned compile error. `panic!(\"unsupported pattern in match for {pat:?}\")` is hit\nby e.g. a range pattern (`match x { 1..=5 => a, _ => b }`, which `numeric_match` rejects and\nwhich is therefore expanded as `Expression::Match { runtime_variants: true, .. }`), and\n`panic!(\"Found single path {path:?}\")` is hit by any single-segment struct pattern such as\n`match p { MyStruct { a } => a }` because `path.segments.len() == 1` and the path is neither\n`Some` nor `None`.","fix":"Make both helpers fallible and surface a `syn::Error`:\n```rust\nfn expand_pat(pat: &mut Pat) -> syn::Result<()> {\n    ...\n    other => Err(syn::Error::new_spanned(\n        other,\n        \"this pattern is not supported in a `#[cube]` match\",\n    )),\n}\n```\nand in `append_expand_to_enum_name` return\n`Err(syn::Error::new_spanned(path, \"match patterns must name the enum, e.g. `Enum::Variant`\"))`\ninstead of `panic!`. `MatchArm::to_tokens` can then propagate the error into\n`into_compile_error()` tokens.","locations":[{"ref":"crates/cubecl-macros/src/generate/expression.rs:838-848","code":"  838 |             Pat::Wild(_) => {}\n  839 |             _ => {\n  840 |                 panic!(\"unsupported pattern in match for {pat:?}\");\n  841 |                 // NOTE: From the documentation https://docs.rs/syn/latest/syn/enum.Pat.html\n  842 |                 //       I don't think we should support any other patterns.\n  843 |                 //       Users can always use a big if, else if, else pattern\n  844 |                 // instead.       Currently, the goal is to\n  845 |                 // support CubeType enums.\n  846 |             }\n  847 |         }\n  848 |     }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/expression.rs#L838-L848"},{"ref":"crates/cubecl-macros/src/generate/expression.rs:853-863","code":"  853 | fn append_expand_to_enum_name(path: &mut Path) {\n  854 |     if path.segments.len() >= 2 {\n  855 |         let segment = path.segments.get_mut(path.segments.len() - 2).unwrap(); // Safe because of the if\n  856 |         segment.ident = Ident::new(&format!(\"{}Expand\", segment.ident), Span::call_site());\n  857 |     } else if path.is_ident(\"Some\") || path.is_ident(\"None\") {\n  858 |         // Insert CubeOption for prelude use of `Some` and `None`\n  859 |         *path = parse_quote!(OptionExpand::#path);\n  860 |     } else {\n  861 |         panic!(\"Found single path {path:?}\");\n  862 |     }\n  863 | }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/expression.rs#L853-L863"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`KernelParam::from_param` parses the multi-generic form of `#[define(...)]` by stringifying the\nattribute tokens and splitting on `\",\"`, then feeding each fragment straight into `Ident::new`.\n`Ident::new` panics on anything that is not a valid identifier, so `#[define(A, B,)]` (trailing\ncomma) yields an empty fragment and panics with `\"\" is not a valid Ident`, and\n`#[define(A::B)]`-style input panics too. The neighbouring `attr.meta.require_list().expect(\"Wrong\nsyntax.\")` also panics for `#[define = \"A\"]`. All of these are user-authored attributes inside a\n`#[cube]` kernel signature, so ordinary typos abort the compiler with a proc-macro panic instead\nof a spanned error.","fix":"Parse with `syn` instead of string splitting:\n```rust\nif is_define_attribute(attr) {\n    let idents = attr.parse_args_with(\n        syn::punctuated::Punctuated::<Ident, syn::Token![,]>::parse_terminated,\n    )?;\n    match idents.len() {\n        0 => return Err(syn::Error::new_spanned(attr, \"`#[define]` needs at least one generic\")),\n        1 => defines.push(DefinedGeneric::Single(idents[0].clone())),\n        _ => defines.extend(\n            idents.into_iter().enumerate().map(|(i, id)| DefinedGeneric::Multiple(id, i)),\n        ),\n    }\n    is_const = true;\n}\n```","locations":[{"ref":"crates/cubecl-macros/src/parse/signature.rs:310-326","code":"  310 |             if is_define_attribute(attr) {\n  311 |                 match attr.parse_args::<Ident>() {\n  312 |                     Ok(ident) => {\n  313 |                         defines.push(DefinedGeneric::Single(ident));\n  314 |                     }\n  315 |                     Err(_) => {\n  316 |                         let list = attr.meta.require_list().expect(\"Wrong syntax.\");\n  317 |                         let tokens = list.tokens.to_string();\n  318 |                         let names = tokens.split(\",\");\n  319 |                         for (i, name) in names.enumerate() {\n  320 |                             let ident = Ident::new(name.trim(), attr.span());\n  321 |                             defines.push(DefinedGeneric::Multiple(ident, i));\n  322 |                         }\n  323 |                     }\n  324 |                 };\n  325 |                 is_const = true;\n  326 |             }","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/signature.rs#L310-L326"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Two more user-reachable proc-macro panics in statement parsing. `parse_define_macro` does\n`parse2(mac.tokens.clone()).expect(\"Expected define macro to contain ident\")`, so\n`let define!() = ty;` or `let size!(1) = n;` panics instead of reporting an error, and\n`parse_macros` indexes `closure.inputs[0]` for `intrinsic!`, so `intrinsic! { || foo() }`\n(closure without the `scope` parameter) panics with an index-out-of-bounds.","fix":"Return `Option`/`Result` instead of panicking:\n```rust\n// parse_define_macro\nlet name = parse2(mac.tokens.clone()).ok()?;\n```\n```rust\n// parse_macros, intrinsic! branch\nlet closure: syn::ExprClosure = mac.parse_body()?;\nlet Some(arg) = closure.inputs.first() else {\n    return Err(syn::Error::new_spanned(\n        &closure,\n        \"`intrinsic!` expects a closure taking the scope, e.g. `intrinsic!(|scope| ...)`\",\n    ));\n};\n```","locations":[{"ref":"crates/cubecl-macros/src/parse/statement.rs:115-132","code":"  115 | pub fn parse_define_macro(local: &Local) -> Option<(Ident, DefineKind, Expr)> {\n  116 |     let Some(init) = &local.init else {\n  117 |         return None;\n  118 |     };\n  119 |     let Pat::Macro(PatMacro { mac, .. }) = &local.pat else {\n  120 |         return None;\n  121 |     };\n  122 |     let macro_ident = &mac.path.segments.last().unwrap().ident;\n  123 |     let kind = if macro_ident == \"size\" {\n  124 |         DefineKind::Size\n  125 |     } else if macro_ident == \"define\" {\n  126 |         DefineKind::Type\n  127 |     } else {\n  128 |         return None;\n  129 |     };\n  130 |     let name = parse2(mac.tokens.clone()).expect(\"Expected define macro to contain ident\");\n  131 |     Some((name, kind, *init.expr.clone()))\n  132 | }","lines":18,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/statement.rs#L115-L132"},{"ref":"crates/cubecl-macros/src/parse/statement.rs:173-183","code":"  173 |     } else if mac.path.is_ident(\"intrinsic\") {\n  174 |         context.is_intrinsic = true;\n  175 |         let closure: syn::ExprClosure = mac.parse_body()?;\n  176 |         let arg = &closure.inputs[0];\n  177 |         let block = *closure.body;\n  178 |         let tokens = quote! {{\n  179 |             let #arg = scope;\n  180 |             #block\n  181 |         }};\n  182 | \n  183 |         Ok(Expression::Verbatim { tokens })","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/statement.rs#L173-L183"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`ComputeClient::read` and `ComputeClient::read_tensor` turn every read failure into\n`.expect(\"TODO\")`. These are the main public read entry points (not test helpers — the test-only\nvariants are `read_one_unchecked` / `read_one_unchecked_tensor`), so a legitimate, recoverable\n`ServerError` (device OOM, `IoError::NotFound` on a stale binding, a driver error surfaced at\nsync time) aborts the caller with the message `TODO` and no context, even though `ServerError`\nalready carries a `reason` and a `BackTrace`.","fix":"At minimum surface the error:\n\n```rust\npub fn read(&self, handles: Vec<Handle>) -> Vec<Bytes> {\n    cubecl_environment::future::reader::read_sync(self.read_async(handles))\n        .expect(\"failed to read device memory\")\n}\n```\n\nPreferably return `Result<Vec<Bytes>, ServerError>` and keep the panicking form as\n`read_unchecked`, matching the `read_one` / `read_one_unchecked` pair right below.","locations":[{"ref":"crates/cubecl-runtime/src/client.rs:313-315","code":"  313 |     pub fn read(&self, handles: Vec<Handle>) -> Vec<Bytes> {\n  314 |         cubecl_environment::future::reader::read_sync(self.read_async(handles)).expect(\"TODO\")\n  315 |     }","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/client.rs#L313-L315"},{"ref":"crates/cubecl-runtime/src/client.rs:353-356","code":"  353 |     pub fn read_tensor(&self, descriptors: Vec<CopyDescriptor>) -> Vec<Bytes> {\n  354 |         cubecl_environment::future::reader::read_sync(self.read_tensor_async(descriptors))\n  355 |             .expect(\"TODO\")\n  356 |     }","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/client.rs#L353-L356"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`ComputeClient::io_optimized_vector_sizes` computes `let max = load_width / size_bits;` and then\n`let num_candidates = max.trailing_zeros() + 1;`. When the element is wider than one hardware load\n(`size * 8 > load_width`, e.g. `StorageType::Packed(f32, 8)` whose `size()` is 32 bytes = 256 bits on\na device reporting `load_width: 128`), `max` becomes `0`, and `0usize.trailing_zeros()` is `64`, so\n`num_candidates` is `65` and the iterator evaluates `2usize.pow(64)`. In a debug build that panics\nwith \"attempt to multiply with overflow\"; in a release build it wraps and the function starts\nyielding nonsensical vector sizes (`0`, `2^63`, ...) that callers feed straight into line-size\ncomputations. `size == 0` additionally makes `load_width / size_bits` a division by zero.\n\nEvery caller passes a runtime-provided `dtype.size()` (`cubecl-std/src/tensor/contiguous/base.rs`,\n`cubecl-std/src/throughput/base.rs`, `cubecl-std/src/tensor/handle.rs`, ...), so nothing on the way in\nrules this out.","fix":"Clamp to at least one element per load (a scalar load always exists) and guard the divisor:\n\n```rust\nlet size_bits = (size * 8).max(1);\nlet max = (load_width / size_bits).max(1);\nlet max = usize::min(self.properties().hardware.max_vector_size, max).max(1);\nlet num_candidates = max.trailing_zeros() + 1;\n```","locations":[{"ref":"crates/cubecl-runtime/src/client.rs:1635-1648","code":" 1635 |     pub fn io_optimized_vector_sizes(\n 1636 |         &self,\n 1637 |         size: usize,\n 1638 |     ) -> impl Iterator<Item = VectorSize> + Clone {\n 1639 |         let load_width = self.properties().hardware.load_width as usize;\n 1640 |         let size_bits = size * 8;\n 1641 |         let max = load_width / size_bits;\n 1642 |         let max = usize::min(self.properties().hardware.max_vector_size, max);\n 1643 | \n 1644 |         // If the max is 8, we want to test 1, 2, 4, 8 which is log2(8) + 1.\n 1645 |         let num_candidates = max.trailing_zeros() + 1;\n 1646 | \n 1647 |         (0..num_candidates).map(|i| 2usize.pow(i)).rev()\n 1648 |     }","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/client.rs#L1635-L1648"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The default `ServerCommunication` methods return `Result<_, ServerError>` but panic instead of\nreturning an error: `sync_collective` is `todo!()` (with the comment \"For backends other than\ncuda.\"), and `comm_init`, `all_reduce`, `send`, `recv` are `unimplemented!()`. Any collective code\npath exercised on wgpu/metal/hip/cpu therefore aborts the process even though the caller is written\nto handle a `ServerError`, and the inconsistency between `todo!()` and `unimplemented!()` in the\nsame trait shows this is unintended.","fix":"Return an error, exactly like `ComputeServer::begin_capture` already does with\n`graph_capture_unsupported()`:\n\n```rust\nfn sync_collective(&mut self, stream_id: StreamId) -> Result<(), ServerError> {\n    let _ = stream_id;\n    Err(ServerError::Generic {\n        reason: String::from(\"server-to-server communication is not supported by this backend\"),\n        backtrace: BackTrace::capture(),\n    })\n}\n```\n\nand the same for `comm_init`, `all_reduce`, `send` and `recv`.","locations":[{"ref":"crates/cubecl-runtime/src/server/base.rs:794-811","code":"  794 |     #[allow(unused_variables)]\n  795 |     fn sync_collective(&mut self, stream_id: StreamId) -> Result<(), ServerError> {\n  796 |         todo!() // For backends other than cuda.\n  797 |     }\n  798 | \n  799 |     /// Initialize the communication between the devices in `device_ids`.\n  800 |     ///\n  801 |     /// # Arguments\n  802 |     ///\n  803 |     /// * `device_ids` - The IDs of the devices that need communication.\n  804 |     ///\n  805 |     /// # Returns\n  806 |     ///\n  807 |     /// Returns a `Result` containing an `ServerError` if the operation fails.\n  808 |     #[allow(unused_variables)]\n  809 |     fn comm_init(&mut self, device_ids: Vec<DeviceId>) -> Result<(), ServerError> {\n  810 |         unimplemented!()\n  811 |     }","lines":18,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/server/base.rs#L794-L811"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`stream_index` computes `stream_id.value as usize % max_streams`, which is an integer division by\nzero when `max_streams == 0`. `max_streams` comes from the user-editable configuration\n(`StreamingConfig::max_streams: u8`, deserialized from TOML with no validation) and is passed\nstraight into `StreamPool::new`, so a config containing `max_streams = 0` makes the first\n`StreamPool::get_mut` (i.e. the first operation on the device) abort the process. `StreamPool::new`\nhappily builds a pool with zero regular slots in that case.","fix":"Clamp when building the pool so the modulo can never divide by zero:\n\n```rust\npub fn new(backend: F, max_streams: u8, num_special: u8) -> Self {\n    let max_streams = max_streams.max(1);\n    let mut streams = Vec::with_capacity(max_streams as usize + num_special as usize);\n    ...\n}\n```","locations":[{"ref":"crates/cubecl-runtime/src/stream/base.rs:189-192","code":"  189 | /// Maps a stream ID to an index within the pool's capacity using modulo arithmetic.\n  190 | pub fn stream_index(stream_id: &StreamId, max_streams: usize) -> usize {\n  191 |     stream_id.value as usize % max_streams\n  192 | }","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/stream/base.rs#L189-L192"},{"ref":"crates/cubecl-runtime/src/stream/base.rs:74-87","code":"   74 |     pub fn new(backend: F, max_streams: u8, num_special: u8) -> Self {\n   75 |         // Initialize a vector with capacity for regular and special streams.\n   76 |         let mut streams = Vec::with_capacity(max_streams as usize);\n   77 |         // Pre-populate the vector with None to reserve space for all streams.\n   78 |         for _ in 0..(max_streams.saturating_add(num_special)) {\n   79 |             streams.push(None);\n   80 |         }\n   81 | \n   82 |         Self {\n   83 |             streams,\n   84 |             factory: backend,\n   85 |             max_streams: max_streams as usize,\n   86 |         }\n   87 |     }","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/stream/base.rs#L74-L87"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`is_contiguous_pitched` indexes `strides[rank - 1]` before checking anything, so a rank-0 shape/stride pair\nunderflows `rank - 1` and panics (or indexes out of bounds). Its sibling `is_contiguous` starts with\n`if shape.is_empty() { return true; }`, and `is_contiguous_pitched` is called right after `is_contiguous`\nin `LinearViewLayout::register`, so both receive exactly the same inputs - only one of the two was hardened.","fix":"Add the same guard as `is_contiguous`:\n```rust\npub fn is_contiguous_pitched(shape: &[usize], strides: &[usize]) -> bool {\n    let rank = shape.len();\n    if rank == 0 {\n        return true;\n    }\n    if strides[rank - 1] != 1 {\n        return false;\n    }\n    ...\n```","locations":[{"ref":"crates/cubecl-std/src/tensor/contiguous/base.rs:474-481","code":"  474 | pub fn is_contiguous_pitched(shape: &[usize], strides: &[usize]) -> bool {\n  475 |     let rank = shape.len();\n  476 |     if strides[rank - 1] != 1 {\n  477 |         return false;\n  478 |     }\n  479 |     if rank <= 1 {\n  480 |         return true;\n  481 |     }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/contiguous/base.rs#L474-L481"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`VirtualTensor::as_mut_slice` calls `self.slice_mut(0, self.len())`, which resolves to\n`SliceOperatorExpand::__expand_slice_mut_method` for `VirtualTensorExpand`, whose whole body is\n`todo!(\"VirtualTensor don't support slice mut yet\")`. The same hole exists in\n`ViewOperationsMutExpand::__expand_as_linear_slice_mut_method` for `VirtualTensorExpand`, which is\nwhat `ViewMut::as_linear_slice_mut()` ends up calling for any `ViewMut` built over a\n`VirtualTensor`. Both are public, non-`unsafe` API surfaces, so a user calling\n`tensor.as_mut_slice()` or `view_mut.as_linear_slice_mut()` gets a `todo!()` panic during kernel\nexpansion instead of a compile error or a graceful fallback.","fix":"Either implement the mutable window (add a `write_window`/`slice_mut` method to\n`VirtualTensorOperations` and forward to it), or stop exposing the unimplemented entry points: remove\n`VirtualTensor::as_mut_slice` and gate `ViewMut::as_linear_slice_mut` behind a trait bound that\n`VirtualTensor` does not satisfy. At minimum replace `todo!()` with an explicit\n`unimplemented!(\"VirtualTensor does not support mutable slices; use `write`/`write_checked`\")` so the\nmessage names the supported alternative.","locations":[{"ref":"crates/cubecl-std/src/tensor/virtual.rs:93-100","code":"   93 |     fn __expand_slice_mut_method(\n   94 |         &mut self,\n   95 |         _: &Scope,\n   96 |         _: NativeExpand<usize>,\n   97 |         _: NativeExpand<usize>,\n   98 |     ) -> &mut SliceExpand<Vector<E, N>> {\n   99 |         todo!(\"VirtualTensor don't support slice mut yet\");\n  100 |     }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/virtual.rs#L93-L100"},{"ref":"crates/cubecl-std/src/tensor/virtual.rs:109-111","code":"  109 |     pub fn as_mut_slice(&mut self) -> &mut [Vector<E, N>] {\n  110 |         self.slice_mut(0, self.len())\n  111 |     }","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/virtual.rs#L109-L111"},{"ref":"crates/cubecl-std/src/tensor/view/operations/virtual_tensor.rs:119-126","code":"  119 |     fn __expand_as_linear_slice_mut_method(\n  120 |         &self,\n  121 |         _scope: &Scope,\n  122 |         _pos: NativeExpand<usize>,\n  123 |         _end: NativeExpand<usize>,\n  124 |     ) -> &mut SliceExpand<Vector<T, N>> {\n  125 |         todo!(\"VirtualTensor don't support slice mut yet\");\n  126 |     }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/view/operations/virtual_tensor.rs#L119-L126"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`impl Drop for WgpuPoll` calls `.expect(\"Failed to shutdown polling thread.\")` on\n`cancel_sender.send(())`. `send` fails whenever the receiver has been dropped, i.e. when the\npolling thread has already exited - which happens if that thread panicked (for example\ninside `device.poll`). Panicking in a `Drop` while another panic is unwinding aborts the\nprocess, so a recoverable \"poll thread died\" turns into a hard abort during teardown.\nThe thread is also never `join`ed, so the process can exit while it is still calling into\nwgpu.","fix":"Never panic in `Drop`; log instead, and join the thread:\n```rust\nimpl Drop for WgpuPoll {\n    fn drop(&mut self) {\n        if self.cancel_sender.send(()).is_err() {\n            log::warn!(\"wgpu: polling thread already exited\");\n        }\n        self.poll_thread.thread().unpark();\n    }\n}\n```\nTo also join, store the handle as `Option<JoinHandle<()>>` and `if let Some(h) = self.poll_thread.take() { let _ = h.join(); }`.","locations":[{"ref":"crates/cubecl-wgpu/src/compute/poll.rs:57-64","code":"   57 |     impl Drop for WgpuPoll {\n   58 |         fn drop(&mut self) {\n   59 |             self.cancel_sender\n   60 |                 .send(())\n   61 |                 .expect(\"Failed to shutdown polling thread.\");\n   62 |             self.poll_thread.thread().unpark();\n   63 |         }\n   64 |     }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/poll.rs#L57-L64"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`BindingsResource::into_resources` unwraps the optional device address of every resource\nwhen the kernel was compiled for Vulkan: `it.address.unwrap().get() + it.offset`.\n`WgpuResource::address` is `None` for any buffer that was not created through\n`crate::backend::vulkan::create_storage_buffer` - which is exactly what\n`WgpuStorage::create_buffer` produces when `vk_storage` is false (i.e. when\n`use_vulkan_compiler` is false or the `spirv` feature is off). A mismatch between the\ncompiler kind and the storage flags therefore panics deep inside stream scheduling with no\ndiagnostic instead of producing a launch error.","fix":"Turn the invariant into a diagnosable failure:\n```rust\n.map(|it| {\n    let addr = it.address.expect(\n        \"Vulkan kernels require buffer device addresses; allocate the pool with `use_vulkan_compiler = true`\",\n    );\n    addr.get() + it.offset\n})\n```\nor, better, change `into_resources` to return `Result<_, IoError>` and propagate.","locations":[{"ref":"crates/cubecl-wgpu/src/compute/schedule.rs:187-197","code":"  187 |         match self.compiler_info {\n  188 |             CompilerInfo::Vulkan { params_transfer } => {\n  189 |                 let addresses = self\n  190 |                     .resources\n  191 |                     .iter()\n  192 |                     .chain(info.iter())\n  193 |                     .map(|it| it.address.unwrap().get() + it.offset)\n  194 |                     .collect::<Addresses>();\n  195 |                 if let Some(info) = info {\n  196 |                     self.resources.push(info);\n  197 |                 }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/schedule.rs#L187-L197"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`WgpuStream::read_resources` returns `DynFut<Result<Vec<Bytes>, ServerError>>`, yet it\npanics on three recoverable device errors instead of returning `Err`:\n`self.mem_manage.reserve_staging(aligned_len).unwrap()` (out of host-visible staging\nmemory), `.expect(\"Unable to receive buffer slice result.\")` (the callback channel closed)\nand `.expect(\"Failed to map buffer\")` (`map_async` failure, e.g. device lost). Reading a\nlarge tensor on a memory-constrained device therefore aborts the process rather than\nsurfacing `IoError`.","fix":"Propagate the errors. For the reservation, collect into a `Result` and bail out early:\n```rust\nlet (staging, binding) = match self.mem_manage.reserve_staging(aligned_len) {\n    Ok(val) => val,\n    Err(err) => return Box::pin(async move { Err(err.into()) }),\n};\n```\nand inside the async block:\n```rust\nmatch receiver.recv().await {\n    Ok(Ok(())) => {}\n    Ok(Err(err)) => return Err(ServerError::Generic { reason: format!(\"failed to map buffer: {err}\"), backtrace: BackTrace::capture() }),\n    Err(_) => return Err(ServerError::Generic { reason: \"buffer map result dropped\".into(), backtrace: BackTrace::capture() }),\n}\n```","locations":[{"ref":"crates/cubecl-wgpu/src/compute/stream.rs:338-342","code":"  338 |             // Copying into a buffer has to be 4 byte aligned. We can safely do so, as\n  339 |             // memory is 32 bytes aligned (see WgpuStorage).\n  340 |             let align = wgpu::COPY_BUFFER_ALIGNMENT;\n  341 |             let aligned_len = resource.size.div_ceil(align) * align;\n  342 |             let (staging, binding) = self.mem_manage.reserve_staging(aligned_len).unwrap();","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/stream.rs#L338-L342"},{"ref":"crates/cubecl-wgpu/src/compute/stream.rs:384-391","code":"  384 |         Box::pin(async move {\n  385 |             for receiver in callbacks.iter().flatten() {\n  386 |                 receiver\n  387 |                     .recv()\n  388 |                     .await\n  389 |                     .expect(\"Unable to receive buffer slice result.\")\n  390 |                     .expect(\"Failed to map buffer\");\n  391 |             }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/stream.rs#L384-L391"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`WgpuStream::write_to_buffer` rounds the destination size up with\n`let size = resource.size.next_multiple_of(copy_align);` and then takes the\n`write_buffer_with` path whenever `size != data.len()`. In that path\n`buffer.slice(0..data.len())` panics (\"range end out of bounds\") as soon as\n`data.len() > size`, i.e. whenever the caller supplies more bytes than the target\nresource holds - a caller error that should be an `IoError`, not a panic. The same branch\nalso silently leaves the `size - data.len()` padding bytes of the staging allocation\nuninitialised and writes them into the GPU buffer.","fix":"Validate the length before writing and report an error:\n```rust\nif data.len() as u64 > size {\n    self.error(ServerError::Io(IoError::InvalidHandle { .. }));\n    return;\n}\n```\nand clamp the staging write to the aligned region actually covered by `data`, e.g. use\n`size = (data.len() as u64).next_multiple_of(copy_align)` for the `write_buffer_with`\ncall so no uninitialised tail is copied.","locations":[{"ref":"crates/cubecl-wgpu/src/compute/stream.rs:598-628","code":"  598 |     fn write_to_buffer(&mut self, resource: &WgpuResource, data: &[u8]) {\n  599 |         // Nothing to write for zero-sized resources.\n  600 |         if resource.size == 0 {\n  601 |             return;\n  602 |         }\n  603 | \n  604 |         // Copying into a buffer has to be 4 byte aligned. We can safely do so, as\n  605 |         // memory is also aligned (see WgpuStorage). Per the WebGPU spec, this\n  606 |         // just has to be a multiple of 4: https://www.w3.org/TR/webgpu/#dom-gpuqueue-writebuffer\n  607 |         let copy_align = wgpu::COPY_BUFFER_ALIGNMENT;\n  608 |         let size = resource.size.next_multiple_of(copy_align);\n  609 | \n  610 |         if size == data.len() as u64 {\n  611 |             // write_buffer is the recommended way to write this data, as:\n  612 |             // - On WebGPU, from WASM, this can save a copy to the JS memory.\n  613 |             // - On devices with unified memory, this could skip the staging buffer entirely.\n  614 |             self.queue\n  615 |                 .write_buffer(&resource.buffer, resource.offset, data);\n  616 |         } else {\n  617 |             // For sizes not aligned we need to only write a part of the staging buffer, do this\n  618 |             // with `write_buffer_with`.\n  619 |             let mut buffer = self\n  620 |                 .queue\n  621 |                 .write_buffer_with(\n  622 |                     &resource.buffer,\n  623 |                     resource.offset,\n  624 |                     NonZero::new(size).unwrap(),\n  625 |                 )\n  626 |                 .expect(\"Internal error: Failed to call `write_buffer_with`, this likely means no staging buffer could be allocated.\");\n  627 |             buffer.slice(0..data.len()).copy_from_slice(data);\n  628 |         }","lines":31,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/stream.rs#L598-L628"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Shape::dims::<D>()` does `let mut dims = [1; D]; dims[..D].copy_from_slice(&self.dims[..D]);`.\nSince `dims[..D]` is the whole array, the `[1; D]` fill is entirely overwritten - so the\napparent intent (pad missing dimensions with `1`, the standard broadcast padding) is not\nimplemented, and instead `&self.dims[..D]` panics with a slice-range panic whenever\n`D > self.rank()`. When `D < rank` the extra dimensions are silently dropped, which for a\n\"shape\" accessor means silently computing over the wrong tensor.","fix":"Make the padding real and the truncation explicit:\n```rust\npub fn dims<const D: usize>(&self) -> [usize; D] {\n    assert!(\n        self.dims.len() <= D,\n        \"shape rank {} does not fit in {D} dimensions\",\n        self.dims.len()\n    );\n    let mut dims = [1; D];\n    let offset = D - self.dims.len();\n    dims[offset..].copy_from_slice(&self.dims);\n    dims\n}\n```","locations":[{"ref":"crates/cubecl-zspace/src/shape.rs:90-96","code":"   90 |     // For compat with dims: [usize; D]\n   91 |     /// Returns the dimensions of the tensor as an array.\n   92 |     pub fn dims<const D: usize>(&self) -> [usize; D] {\n   93 |         let mut dims = [1; D];\n   94 |         dims[..D].copy_from_slice(&self.dims[..D]);\n   95 |         dims\n   96 |     }","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/shape.rs#L90-L96"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Shape::reshape` has two reachable panics in a function whose whole contract is to return\n`Result<Shape, MetadataError>`:\n1. For a `0` entry it copies the corresponding source dimension with `self.dims[idx]`,\n   indexing the *source* shape with the *target* position. `shape.reshape([0, 0, 0])` on a\n   rank-2 shape panics with an index-out-of-bounds instead of returning\n   `MetadataError::Invalid`.\n2. When a `0` entry copies a zero-sized dimension, `new_size` becomes `0`; then\n   `source_size.is_multiple_of(0)` is `true` for `source_size == 0`, and the next line\n   `dims[idx] = source_size / new_size` divides by zero. Example:\n   `Shape::new([0, 3]).reshape([-1, 0])`.","fix":"Bounds-check the `0` case and reject a zero divisor:\n```rust\n} else if s == 0 {\n    let s = *self.dims.get(idx).ok_or_else(|| MetadataError::Invalid {\n        reason: format!(\"0 at position {idx} has no matching source dimension in {self}\"),\n    })?;\n    new_size *= s;\n    dims.push(s);\n}\n```\n```rust\nSome(idx) => {\n    if new_size == 0 || !source_size.is_multiple_of(new_size) {\n        return Err(MetadataError::Invalid { reason: format!(\n            \"Cannot infer a valid target shape. Current shape: {self}, target dimensions: {args:?}.\"\n        )});\n    }\n    dims[idx] = source_size / new_size;\n}\n```","locations":[{"ref":"crates/cubecl-zspace/src/shape.rs:411-421","code":"  411 |         for (idx, &s) in args.iter().enumerate() {\n  412 |             let s = s.as_index();\n  413 |             if s > 0 {\n  414 |                 let s = s as usize;\n  415 |                 new_size *= s;\n  416 |                 dims.push(s);\n  417 |             } else if s == 0 {\n  418 |                 // We need to find the index of the 0 dimensions and\n  419 |                 // replace them with the actual dimension value.\n  420 |                 let s = self.dims[idx];\n  421 |                 new_size *= s;","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/shape.rs#L411-L421"},{"ref":"crates/cubecl-zspace/src/shape.rs:455-465","code":"  455 |             Some(idx) => {\n  456 |                 if !source_size.is_multiple_of(new_size) {\n  457 |                     return Err(MetadataError::Invalid {\n  458 |                         reason: format!(\n  459 |                             \"Cannot infer a valid target shape. Current shape: {self}, target dimensions: {args:?}.\"\n  460 |                         ),\n  461 |                     });\n  462 |                 }\n  463 |                 dims[idx] = source_size / new_size;\n  464 |             }\n  465 |         }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/shape.rs#L455-L465"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`Display for SemanticType` slices a fixed 5-element permutation array with a rank that is not bounded\nby the array length:\n```rust\nSemanticType::TensorView(dims, has_dims, permutation) => {\n    write!(f, \"tensor_layout<{:?}, has_dims: {has_dims}>\", &permutation[..*dims])\n}\n```\n`SemanticType::TensorView(usize, bool, [u32; 5])` carries `dims` as an unconstrained `usize`, so\nformatting a view of rank 6 panics with a slice-range-out-of-bounds inside a `Display` impl - i.e.\nwhile printing IR for a debug dump or a panic message, turning a diagnostic into a second panic.","fix":"Clamp the rank before slicing:\n```rust\nlet dims = (*dims).min(permutation.len());\nwrite!(f, \"tensor_view<{:?}, has_dims: {has_dims}>\", &permutation[..dims])\n```","locations":[{"ref":"crates/cubecl-ir/src/type.rs:611-624","code":"  611 | impl Display for SemanticType {\n  612 |     fn fmt(&self, f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result {\n  613 |         match self {\n  614 |             SemanticType::TensorLayout(dims, _) => write!(f, \"tensor_layout<{dims}>\"),\n  615 |             SemanticType::TensorView(dims, has_dims, permutation) => {\n  616 |                 write!(\n  617 |                     f,\n  618 |                     \"tensor_layout<{:?}, has_dims: {has_dims}>\",\n  619 |                     &permutation[..*dims]\n  620 |                 )\n  621 |             }\n  622 |         }\n  623 |     }\n  624 | }","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-ir/src/type.rs#L611-L624"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`IntoRuntime::init_runtime_enum` and `runtime_variant_value` call `unimplemented!()` for\nstruct-style variants and `v.fields.iter().next().unwrap()` for tuple-style variants. Deriving\n`IntoRuntime` on `#[cube(runtime_variants)] enum E { A { x: u32 } }` therefore aborts with\n\"not implemented\" and no span, and an empty tuple variant (`enum E { A() }`, which darling\nreports as `Style::Tuple` with zero fields) panics on the `unwrap`.","fix":"Make the generator fallible and emit a spanned error, e.g. have `init_runtime_enum` return\n`syn::Result<TokenStream>` and replace\n```rust\nStyle::Struct => unimplemented!(),\n```\nwith\n```rust\nStyle::Struct => return Err(syn::Error::new_spanned(\n    &v.ident,\n    \"`runtime_variants` enums only support unit and single-field tuple variants\",\n)),\n```\nand treat a zero-field tuple variant like a unit variant instead of `unwrap`ing.","locations":[{"ref":"crates/cubecl-macros/src/generate/into_runtime.rs:129-137","code":"  129 |         let value_ty = variants\n  130 |             .iter()\n  131 |             .find_map(|v| match v.fields.style {\n  132 |                 Style::Struct => unimplemented!(),\n  133 |                 Style::Tuple => Some(v.fields.iter().next().unwrap().ty.clone()),\n  134 |                 Style::Unit => None,\n  135 |             })\n  136 |             .map(|ty| quote![#ty])\n  137 |             .unwrap_or_else(|| quote![()]);","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/into_runtime.rs#L129-L137"},{"ref":"crates/cubecl-macros/src/generate/into_runtime.rs:175-186","code":"  175 |     fn runtime_variant_value(&self, variant: &IntoRuntimeVariant) -> TokenStream {\n  176 |         let enum_name = &self.ident;\n  177 |         let variant_name = &variant.ident;\n  178 | \n  179 |         match variant.fields.style {\n  180 |             Style::Tuple => {\n  181 |                 quote![#enum_name::#variant_name(value) => value]\n  182 |             }\n  183 |             Style::Struct => unimplemented!(),\n  184 |             Style::Unit => quote![#enum_name::#variant_name => Default::default()],\n  185 |         }\n  186 |     }","lines":12,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/into_runtime.rs#L175-L186"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`parse_discriminant` evaluates enum discriminant expressions with plain `i32` arithmetic, so\nuser input can panic the proc macro instead of producing an error: `A = 1 / 0` panics with\n\"attempt to divide by zero\", `A = 1 << 40` with \"attempt to shift left with overflow\", and\n`A = i32::MAX_literal + 1` overflows (proc macros built with `debug-assertions` on abort). Every\nother failure mode in this function is reported as a `syn::Error`, so these are the odd ones out.","fix":"Use the checked variants and map `None` to an error:\n```rust\nlet err = || syn::Error::new(span, \"discriminant expression overflows or divides by zero\");\nmatch binary.op {\n    syn::BinOp::Add(_) => lhs.checked_add(rhs).ok_or_else(err),\n    syn::BinOp::Sub(_) => lhs.checked_sub(rhs).ok_or_else(err),\n    syn::BinOp::Mul(_) => lhs.checked_mul(rhs).ok_or_else(err),\n    syn::BinOp::Div(_) => lhs.checked_div(rhs).ok_or_else(err),\n    syn::BinOp::Rem(_) => lhs.checked_rem(rhs).ok_or_else(err),\n    syn::BinOp::Shl(_) => lhs.checked_shl(rhs as u32).ok_or_else(err),\n    syn::BinOp::Shr(_) => lhs.checked_shr(rhs as u32).ok_or_else(err),\n    ...\n}\n```\nand `-inner` -> `inner.checked_neg().ok_or_else(err)`.","locations":[{"ref":"crates/cubecl-macros/src/parse/cube_type/parse_enum.rs:127-154","code":"  127 |         Expr::Binary(binary) => {\n  128 |             let lhs = parse_discriminant(&binary.left)?;\n  129 |             let rhs = parse_discriminant(&binary.right)?;\n  130 |             match binary.op {\n  131 |                 syn::BinOp::Add(_) => Ok(lhs + rhs),\n  132 |                 syn::BinOp::Sub(_) => Ok(lhs - rhs),\n  133 |                 syn::BinOp::Mul(_) => Ok(lhs * rhs),\n  134 |                 syn::BinOp::Div(_) => Ok(lhs / rhs),\n  135 |                 syn::BinOp::Rem(_) => Ok(lhs % rhs),\n  136 |                 syn::BinOp::BitXor(_) => Ok(lhs ^ rhs),\n  137 |                 syn::BinOp::BitAnd(_) => Ok(lhs & rhs),\n  138 |                 syn::BinOp::BitOr(_) => Ok(lhs | rhs),\n  139 |                 syn::BinOp::Shl(_) => Ok(lhs << rhs),\n  140 |                 syn::BinOp::Shr(_) => Ok(lhs >> rhs),\n  141 |                 _ => Err(syn::Error::new(span, \"Unknown binary op in discriminant\")),\n  142 |             }\n  143 |         }\n  144 |         Expr::Lit(ExprLit {\n  145 |             lit: Lit::Int(int), ..\n  146 |         }) => int.base10_parse(),\n  147 |         Expr::Unary(unary) => {\n  148 |             let inner = parse_discriminant(&unary.expr)?;\n  149 |             match unary.op {\n  150 |                 syn::UnOp::Not(_) => Ok(!inner),\n  151 |                 syn::UnOp::Neg(_) => Ok(-inner),\n  152 |                 _ => Err(syn::Error::new(span, \"Unknown unary op in discriminant\")),\n  153 |             }\n  154 |         }","lines":28,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/cube_type/parse_enum.rs#L127-L154"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`StridedLayout::register` reads `strides[rank - 2]` after computing `rank = shape.len()`. For a rank-1\nbuffer this underflows (`0 - 1`) and panics / indexes out of bounds. The current caller\n(`LinearViewLayout::register`) happens to never reach it for rank 1, because a contiguous rank-1 tensor\ntakes the `is_contiguous` branch and a strided rank-1 tensor fails `is_contiguous_pitched`, but\n`StridedLayout` is a `pub` layout with a `pub` `ViewLayoutLaunchArg` impl, so nothing enforces that.","fix":"Reject or degrade gracefully for rank < 2:\n```rust\nlet rank = shape.len();\nassert!(rank >= 2, \"StridedLayout requires rank >= 2, got {rank}\");\n```\n(or use `strides.get(rank.wrapping_sub(2)).copied().unwrap_or(shape[rank - 1])`).","locations":[{"ref":"crates/cubecl-std/src/tensor/layout/strided.rs:39-46","code":"   39 |         let shape = buffer.shape();\n   40 |         let strides = buffer.strides();\n   41 |         let rank = shape.len();\n   42 |         let len = shape.iter().product::<usize>() / ty.vector_size();\n   43 | \n   44 |         let shape = <FastDivmod<usize> as LaunchArg>::register(shape[rank - 1], launcher);\n   45 |         <usize as LaunchArg>::register(strides[rank - 2], launcher);\n   46 |         <usize as LaunchArg>::register(len, launcher);","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/layout/strided.rs#L39-L46"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`StrideRecord` is documented as a best-effort record for *error messages* with \"no\nexpectation that this is valid\", yet its constructors can panic. `StrideRecord.strides` is\na `Strides` (backed by `usize`), and `Strides: FromIterator<I: AsSize>` routes through\n`AsSize::as_size`, which panics on any negative value. So\n`StrideRecord::from_isize_strides(shape, &[-1])` panics while trying to build the error\nreport. `from_usize_strides` additionally round-trips through `isize`\n(`strides.iter().map(|s| *s as isize)`) only to convert straight back to `usize`, which\nturns any stride above `isize::MAX` into a negative value and panics too - on the failure\npath of `try_check_matching_ranks` and friends, i.e. exactly when the data is already\nsuspect.","fix":"Drop the pointless conversion and make the isize constructor lossless (or saturating):\n```rust\npub fn from_usize_strides(shape: &[usize], strides: &[usize]) -> StrideRecord {\n    StrideRecord { shape: shape.into(), strides: strides.into() }\n}\n\npub fn from_isize_strides(shape: &[usize], strides: &[isize]) -> StrideRecord {\n    StrideRecord {\n        shape: shape.into(),\n        // Error records must never panic: clamp instead of converting.\n        strides: strides.iter().map(|s| s.unsigned_abs()).collect(),\n    }\n}\n```\n(If negative strides must be representable, change `StrideRecord::strides` to `Vec<isize>`.)","locations":[{"ref":"crates/cubecl-zspace/src/errors.rs:158-180","code":"  158 | #[derive(Debug, Clone, PartialEq)]\n  159 | pub struct StrideRecord {\n  160 |     pub shape: Shape,\n  161 |     pub strides: Strides,\n  162 | }\n  163 | \n  164 | impl StrideRecord {\n  165 |     /// Create a new [`StrideRecord`] from a slice of usize strides.\n  166 |     pub fn from_usize_strides(shape: &[usize], strides: &[usize]) -> StrideRecord {\n  167 |         StrideRecord {\n  168 |             shape: shape.into(),\n  169 |             strides: strides.iter().map(|s| *s as isize).collect(),\n  170 |         }\n  171 |     }\n  172 | \n  173 |     /// Create a new [`StrideRecord`] from a slice of isize strides.\n  174 |     pub fn from_isize_strides(shape: &[usize], strides: &[isize]) -> StrideRecord {\n  175 |         StrideRecord {\n  176 |             shape: shape.into(),\n  177 |             strides: strides.into(),\n  178 |         }\n  179 |     }\n  180 | }","lines":23,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/errors.rs#L158-L180"},{"ref":"crates/cubecl-zspace/src/striding/layout_validation.rs:18-27","code":"   18 | pub fn try_check_matching_ranks(shape: &Shape, strides: &Strides) -> Result<usize, StrideError> {\n   19 |     let rank = shape.len();\n   20 |     if strides.len() != rank {\n   21 |         Err(StrideError::MalformedRanks {\n   22 |             record: StrideRecord::from_usize_strides(shape, strides),\n   23 |         })\n   24 |     } else {\n   25 |         Ok(rank)\n   26 |     }\n   27 | }","lines":10,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/striding/layout_validation.rs#L18-L27"}]},
