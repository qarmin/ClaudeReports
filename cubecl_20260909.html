{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`LeaseHandle<T>` stores a bare `*const LeaseSlot<T>` into a `Box` owned by `LeasePool::items`, but it\ncarries no lifetime parameter tying it to the pool. The doc comment asserts an invariant the type\nsystem does not enforce: *\"The pointee is owned by the [`LeasePool`], which never removes items, so it\noutlives every handle.\"* Nothing stops a caller from dropping the pool while handles are live, and\n`Deref`/`DerefMut`/`Drop` all dereference the raw pointer unconditionally. The real user is\n`cubecl-wgpu`, where `WgpuServer::execute` moves the handle into a `ScheduleTask` stored in\n`self.scheduler` (`crates/cubecl-wgpu/src/compute/server.rs:406-430`) while the pool is another field\nof the same struct - soundness there rests purely on `scheduler` being *declared before*\n`shared_bindings_pool`, so it happens to drop first. Reordering those two fields, or moving a\n`ScheduleTask` out of the server, turns every `Deref` and the `Drop` (`reclaim()` +\n`leased.store(false)`) into a write to freed memory.","fix":"Tie the handle to the pool borrow instead of relying on declaration order:\n```rust\npub struct LeaseHandle<'a, T: Default + Reclaim> {\n    item: *const LeaseSlot<T>,\n    _pool: core::marker::PhantomData<&'a LeasePool<T>>,\n}\n\nimpl<T: Default + Reclaim> LeasePool<T> {\n    pub fn acquire(&mut self) -> LeaseHandle<'_, T> { /* ... */ }\n}\n```\nIf a `'static` handle is genuinely required, hold the slots in `Arc<LeaseSlot<T>>` and store an\n`Arc` clone in the handle so the storage is kept alive by the handle itself.","locations":[{"ref":"crates/cubecl-common/src/pool.rs:86-96","code":"   86 | /// Handle to a pooled item. Reclaims the value and frees its slot when dropped.\n   87 | ///\n   88 | /// The pointee is owned by the [`LeasePool`], which never removes items, so it outlives\n   89 | /// every handle. An atomic `leased` flag keeps the reference unique for the handle's lifetime.\n   90 | pub struct LeaseHandle<T: Default + Reclaim> {\n   91 |     item: *const LeaseSlot<T>,\n   92 | }\n   93 | \n   94 | // SAFETY: the handle may be moved across threads by its holder. The pointee is `Send + Sync` and,\n   95 | // per the `leased` flag invariant, uniquely owned by this handle.\n   96 | unsafe impl<T: Default + Reclaim> Send for LeaseHandle<T> {}","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/pool.rs#L86-L96"},{"ref":"crates/cubecl-common/src/pool.rs:120-129","code":"  120 | impl<T: Default + Reclaim> Drop for LeaseHandle<T> {\n  121 |     fn drop(&mut self) {\n  122 |         // SAFETY: the pool outlives the handle, so the pointee is still valid.\n  123 |         let item = unsafe { &*self.item };\n  124 |         // Reclaim any value not drained by the holder (e.g. a caller that failed mid-use), keeping\n  125 |         // the allocation for the next acquire.\n  126 |         unsafe { &mut *item.item.get() }.reclaim();\n  127 |         item.leased.store(false, Ordering::Release);\n  128 |     }\n  129 | }","lines":10,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/pool.rs#L120-L129"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"easy","description":"`PinnedMemoryStorage::alloc` stores a pointer to a **stack local** in a\nlong-lived map entry: `let mut ptr: *mut c_void = null_mut(); let dev_ptr: *mut\n*mut c_void = &mut ptr;` and then `PinnedMemory { ptr, dev_ptr }`. `ptr` dies\nwhen `alloc` returns, so every `PinnedMemory` in `self.memory` holds a dangling\npointer, and the field's doc comment — \"Device pointer: Pointer-to-pointer for\nHIP allocation, kept alive for async operations\" — claims the exact opposite of\nwhat the code does (nothing is kept alive; the pointee is a dead stack slot).\nThe field is `#[allow(unused)]` today, so this is a loaded gun rather than a live\nbug: the first reader of `dev_ptr` dereferences freed stack memory.","fix":"Drop the field and the misleading comment, since only `ptr` is ever needed:\n```rust\nstruct PinnedMemory {\n    /// Pointer to the pinned memory buffer.\n    ptr: *mut c_void,\n}\n// ...\nlet mut ptr: *mut c_void = std::ptr::null_mut();\nlet result = cubecl_hip_sys::hipHostMalloc(&mut ptr, size as usize, cubecl_hip_sys::hipHostMallocMapped);\n// ...\nPinnedMemory { ptr }\n```","locations":[{"ref":"crates/cubecl-hip/src/compute/storage/cpu.rs:20-28","code":"   20 | /// Internal representation of pinned memory with associated pointers.\n   21 | #[derive(Debug)]\n   22 | struct PinnedMemory {\n   23 |     /// Pointer to the pinned memory buffer.\n   24 |     ptr: *mut c_void,\n   25 |     /// Device pointer: Pointer-to-pointer for HIP allocation, kept alive for async operations.\n   26 |     #[allow(unused)]\n   27 |     dev_ptr: *mut *mut c_void,\n   28 | }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-hip/src/compute/storage/cpu.rs#L20-L28"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"`ComptimeEventBus::event` takes `&mut HashMap<TypeId, Vec<EventItem>>` out of the `UnsafeCell`, takes\n`&mut Vec` for the matching event type, and iterates it while calling the listener with `self` (the bus)\nas an argument. A listener that registers another listener (`bus.listener(...)`) inserts into the very\n`HashMap` being iterated: the insert can rehash/reallocate, leaving the outer `listeners` reference and its\n`iter_mut()` dangling (use-after-free), and a listener that fires another event re-derives a second\n`&mut` to the same `HashMap` while the first is still live, which is aliasing UB regardless of\nreallocation. Only *recursion of the same event with a runtime end condition* is documented as\nunsupported; registering a listener or emitting a different event from a callback looks legal.","fix":"Do not hold a borrow across the callback. Take the listeners out of the map first (or snapshot the indices)\nand put them back afterwards:\n```rust\nlet mut listeners = match family.remove(&type_id) { Some(v) => v, None => return };\nfor listener in listeners.iter_mut() { /* call ... */ }\n// re-borrow the map only after all callbacks have run\nlet family = unsafe { self.listener_family.get().as_mut().unwrap() };\nfamily.entry(type_id).or_default().splice(0..0, listeners);\n```\nBetter still, replace the `UnsafeCell<HashMap<..>>` with a `RefCell` so a nested mutable borrow is caught\ninstead of being UB.","locations":[{"ref":"crates/cubecl-std/src/event/mod.rs:93-109","code":"   93 |     pub fn event<E: CubeType + 'static>(&mut self, event: E) {\n   94 |         intrinsic!(|scope| {\n   95 |             let type_id = TypeId::of::<E>();\n   96 |             let family = self.listener_family.clone();\n   97 |             let family = unsafe { family.get().as_mut().unwrap() };\n   98 |             let listeners = match family.get_mut(&type_id) {\n   99 |                 Some(val) => val,\n  100 |                 None => return,\n  101 |             };\n  102 | \n  103 |             for listener in listeners.iter_mut() {\n  104 |                 let mut payload = listener.downcast_mut::<Payload<E>>().unwrap();\n  105 |                 let call = &mut payload.call;\n  106 |                 call(scope, &mut payload.listener, event.clone_unchecked(), self);\n  107 |             }\n  108 |         })\n  109 |     }","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/event/mod.rs#L93-L109"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`BytesStorage` owns raw allocations (`AllocatedBytes { ptr, layout }`) in a `HashMap` and has no\n`Drop` implementation. Memory is only ever released through `ComputeStorage::dealloc`, so every\nallocation still registered when the `BytesStorage` itself is dropped is leaked — for the CPU\nbackend that is the whole live working set of a device/stream at teardown. This also makes the\nleak invisible to tests that drop the storage instead of calling `dealloc` for each handle.","fix":"Free the remaining allocations on drop:\n\n```rust\nimpl Drop for BytesStorage {\n    fn drop(&mut self) {\n        for (_, memory) in self.memory.drain() {\n            if memory.layout.size() > 0 {\n                // SAFETY: `ptr` came from `alloc_zeroed(memory.layout)` and is freed once.\n                unsafe { dealloc(memory.ptr, memory.layout) };\n            }\n        }\n    }\n}\n```","locations":[{"ref":"crates/cubecl-runtime/src/storage/bytes_cpu.rs:9-12","code":"    9 | #[derive(Default)]\n   10 | pub struct BytesStorage {\n   11 |     memory: HashMap<StorageId, AllocatedBytes>,\n   12 | }","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/storage/bytes_cpu.rs#L9-L12"},{"ref":"crates/cubecl-runtime/src/storage/bytes_cpu.rs:31-35","code":"   31 | /// This struct refers to a specific (contiguous) layout of bytes.\n   32 | struct AllocatedBytes {\n   33 |     ptr: *mut u8,\n   34 |     layout: Layout,\n   35 | }","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/storage/bytes_cpu.rs#L31-L35"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`create_storage_buffer` creates a raw `vk::Buffer` with `device.create_buffer` and then has three\nfallible steps that all return early with `?`: the `ok_or_else` when no `DEVICE_LOCAL` memory type\nmatches, `device.allocate_memory`, and `device.bind_buffer_memory`. None of these paths call\n`device.destroy_buffer(buffer, None)`, and the `bind_buffer_memory` path additionally leaks the\n`vk::DeviceMemory` returned by `allocate_memory` (no `device.free_memory`). Ownership is only\ntransferred to wgpu at the very end via `Buffer::from_raw_managed`. Since this function is on the\nallocation path and `IoError::OutOfMemory` is an expected, recoverable outcome, a workload that\nrepeatedly hits allocation pressure leaks one Vulkan buffer handle (and possibly one device\nallocation) per failed attempt.","fix":"Destroy the partially-created objects before propagating. For example wrap the tail in a closure and\nclean up on `Err`:\n```rust\nlet result = (|| -> Result<(vk::DeviceMemory, u64), IoError> {\n    let requirements = unsafe { device.get_buffer_memory_requirements(buffer) };\n    // ... pick memory_type_idx, allocate_memory, bind_buffer_memory ...\n    Ok((memory, device_address))\n})();\n\nlet (memory, device_address) = match result {\n    Ok(ok) => ok,\n    Err(err) => {\n        unsafe { device.destroy_buffer(buffer, None) };\n        return Err(err);\n    }\n};\n```\nand inside the closure free `memory` with `device.free_memory(memory, None)` if\n`bind_buffer_memory` fails.","locations":[{"ref":"crates/cubecl-wgpu/src/backend/vulkan.rs:204-256","code":"  204 |     let buffer = unsafe {\n  205 |         device\n  206 |             .create_buffer(&vk_info, None)\n  207 |             .map_err(|err| as_io_error(err, desc.size))?\n  208 |     };\n  209 | \n  210 |     let requirements = unsafe { device.get_buffer_memory_requirements(buffer) };\n  211 | \n  212 |     let memory_props = unsafe { instance.get_physical_device_memory_properties(phys_device) };\n  213 |     let num_types = memory_props.memory_type_count as usize;\n  214 |     let memory_types = memory_props.memory_types.iter().take(num_types);\n  215 | \n  216 |     let (memory_type_idx, _) = memory_types\n  217 |         .enumerate()\n  218 |         .filter(|(i, _)| requirements.memory_type_bits & (1 << *i) != 0)\n  219 |         .find(|(_, it)| {\n  220 |             it.property_flags\n  221 |                 .contains(MemoryPropertyFlags::DEVICE_LOCAL)\n  222 |         })\n  223 |         .ok_or_else(|| IoError::Unknown {\n  224 |             description: \"No device local heap found\".into(),\n  225 |             backtrace: BackTrace::capture(),\n  226 |         })?;\n  227 | \n  228 |     let mut alloc_flags =\n  229 |         MemoryAllocateFlagsInfo::default().flags(MemoryAllocateFlags::DEVICE_ADDRESS);\n  230 | \n  231 |     let alloc_info = MemoryAllocateInfo::default()\n  232 |         .allocation_size(requirements.size)\n  233 |         .memory_type_index(memory_type_idx as u32)\n  234 |         .push_next(&mut alloc_flags);\n  235 | \n  236 |     let memory = unsafe {\n  237 |         device\n  238 |             .allocate_memory(&alloc_info, None)\n  239 |             .map_err(|err| as_io_error(err, desc.size))?\n  240 |     };\n  241 |     unsafe {\n  242 |         device\n  243 |             .bind_buffer_memory(buffer, memory, 0)\n  244 |             .map_err(|err| as_io_error(err, desc.size))?\n  245 |     };\n  246 | \n  247 |     let addr_info = BufferDeviceAddressInfo::default().buffer(buffer);\n  248 |     let device_address = unsafe { device.get_buffer_device_address(&addr_info) };\n  249 | \n  250 |     let buffer = unsafe {\n  251 |         wgpu::hal::vulkan::Buffer::from_raw_managed(buffer, memory, 0, requirements.size)\n  252 |     };\n  253 |     let buffer = unsafe { wgpu_device.create_buffer_from_hal::<hal::api::Vulkan>(buffer, desc) };\n  254 | \n  255 |     Ok((buffer, device_address))\n  256 | }","lines":53,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/backend/vulkan.rs#L204-L256"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`StorageHandle::offset_start` and `StorageHandle::offset_end` compute `self.size() - offset_bytes`\non `u64` with no check. The offsets they are called with come straight from\n`Binding::offset_start`/`Binding::offset_end`, which users build through the unvalidated\n`Handle::offset_start`/`Handle::offset_end` builders (each of which just *adds* to the previous\noffset). An offset larger than the slice size panics in debug and, in release, wraps to a huge\n`size`: `MemoryManagement::get_resource` then calls `storage.get(&handle)` with that size, and e.g.\n`BytesResource::read()` builds `core::slice::from_raw_parts(ptr, huge_len)` — an out-of-bounds read\nof arbitrary length (undefined behaviour), or an invalid buffer length handed to the GPU driver on\nthe other backends.","fix":"Make the operations fallible (or at least saturating) and reject the bad offset:\n\n```rust\npub fn offset_start(&self, offset_bytes: u64) -> Result<Self, IoError> {\n    let size = self.size().checked_sub(offset_bytes).ok_or_else(|| IoError::NotFound {\n        backtrace: BackTrace::capture(),\n        reason: alloc::format!(\n            \"offset_start {offset_bytes} exceeds handle size {}\", self.size()\n        ).into(),\n    })?;\n    Ok(Self { id: self.id, utilization: StorageUtilization { offset: self.offset() + offset_bytes, size } })\n}\n```\n\nand the same `checked_sub` in `offset_end`.","locations":[{"ref":"crates/cubecl-runtime/src/storage/base.rs:46-70","code":"   46 |     /// Increase the current offset with the given value in bytes.\n   47 |     pub fn offset_start(&self, offset_bytes: u64) -> Self {\n   48 |         let utilization = StorageUtilization {\n   49 |             offset: self.offset() + offset_bytes,\n   50 |             size: self.size() - offset_bytes,\n   51 |         };\n   52 | \n   53 |         Self {\n   54 |             id: self.id,\n   55 |             utilization,\n   56 |         }\n   57 |     }\n   58 | \n   59 |     /// Reduce the size of the memory handle..\n   60 |     pub fn offset_end(&self, offset_bytes: u64) -> Self {\n   61 |         let utilization = StorageUtilization {\n   62 |             offset: self.offset(),\n   63 |             size: self.size() - offset_bytes,\n   64 |         };\n   65 | \n   66 |         Self {\n   67 |             id: self.id,\n   68 |             utilization,\n   69 |         }\n   70 |     }","lines":25,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/storage/base.rs#L46-L70"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"`contiguous_strides` computes `(0..rank - 1)` on a `usize`. For a rank-0 (scalar) shape,\n`rank - 1` underflows to `usize::MAX`, and the reversed iterator immediately evaluates\n`strides[i + 1]` with `i = usize::MAX - 1`, panicking with an out-of-bounds index (or, in a\nrelease build with overflow checks off, indexing far past the end of the `SmallVec`).\nThis function is called on *every* `read()` and `write()` with the caller-supplied\n`desc.shape`, so a rank-0 tensor read/write aborts the process. That rank-0 shapes are\nexpected is proven by the sibling code: `WgpuRuntime::can_read_tensor` explicitly returns\n`true` for `shape.is_empty()` (so the runtime advertises the read as legal), and the zspace\nhelper `row_major_contiguous_strides` - which is the exact same loop - guards it with\n`if rank > 1`.","fix":"Either guard the loop or, better, delete the duplicate and call the zspace builder.\n\nBefore:\n```rust\npub(crate) fn contiguous_strides(shape: &Shape) -> Strides {\n    let rank = shape.len();\n    let mut strides = strides![1; rank];\n    for i in (0..rank - 1).rev() {\n        strides[i] = strides[i + 1] * shape[i + 1];\n    }\n    strides\n}\n```\nAfter:\n```rust\npub(crate) fn contiguous_strides(shape: &Shape) -> Strides {\n    cubecl_core::zspace::striding::row_major_contiguous_strides(shape.as_slice())\n}\n```\n(`row_major_contiguous_strides` already contains the `if rank > 1` guard.)","locations":[{"ref":"crates/cubecl-wgpu/src/compute/server.rs:892-899","code":"  892 | pub(crate) fn contiguous_strides(shape: &Shape) -> Strides {\n  893 |     let rank = shape.len();\n  894 |     let mut strides = strides![1; rank];\n  895 |     for i in (0..rank - 1).rev() {\n  896 |         strides[i] = strides[i + 1] * shape[i + 1];\n  897 |     }\n  898 |     strides\n  899 | }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/server.rs#L892-L899"},{"ref":"crates/cubecl-zspace/src/striding/layout_builders.rs:14-27","code":"   14 | pub fn row_major_contiguous_strides<S>(shape: S) -> Strides\n   15 | where\n   16 |     S: AsRef<[usize]>,\n   17 | {\n   18 |     let shape = shape.as_ref();\n   19 |     let rank = shape.len();\n   20 |     let mut strides = strides![1; rank];\n   21 |     if rank > 1 {\n   22 |         for i in (0..rank - 1).rev() {\n   23 |             strides[i] = strides[i + 1] * shape[i + 1];\n   24 |         }\n   25 |     }\n   26 |     strides\n   27 | }","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/striding/layout_builders.rs#L14-L27"},{"ref":"crates/cubecl-wgpu/src/runtime.rs:54-66","code":"   54 |     fn can_read_tensor(shape: &Shape, strides: &Strides) -> bool {\n   55 |         if shape.is_empty() {\n   56 |             return true;\n   57 |         }\n   58 | \n   59 |         for (&expected, &stride) in contiguous_strides(shape).iter().zip(strides.iter()) {\n   60 |             if expected != stride {\n   61 |                 return false;\n   62 |             }\n   63 |         }\n   64 | \n   65 |         true\n   66 |     }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/runtime.rs#L54-L66"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"The comptime `DivCeil` implementations use `(self + divisor - 1) / divisor`, which overflows whenever\n`self > MAX - divisor + 1`; for example `u32::MAX.div_ceil(2)` panics with `attempt to add with\noverflow` in debug builds and returns `0` in release builds. This is host-side (comptime) code that\nusers can reach with any large tile/shape value, and it is implemented for all ten integer types\nincluding `usize`/`u64`.","fix":"Delegate to the inherent standard-library method (path resolution prefers the inherent impl over the\ntrait method, so this does not recurse):\n\n```rust\nimpl DivCeil for $ty {\n    fn div_ceil(self, divisor: Self) -> Self {\n        <$ty>::div_ceil(self, divisor)\n    }\n}\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/operation/base.rs:116-129","code":"  116 | macro_rules! impl_div_ceil {\n  117 |     ($($ty:ty),*) => {\n  118 |         $(\n  119 |             impl DivCeil for $ty {\n  120 |                 #[allow(clippy::manual_div_ceil)] // Need to define div_ceil to use div_ceil!\n  121 |                 fn div_ceil(self, divisor: Self) -> Self {\n  122 |                     (self + divisor - 1) / divisor\n  123 |                 }\n  124 |             }\n  125 |         )*\n  126 |     };\n  127 | }\n  128 | \n  129 | impl_div_ceil!(u8, u16, u32, u64, usize, i8, i16, i32, i64, isize);","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/operation/base.rs#L116-L129"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Both bounds-clamping helpers compute `len - 1` on an unsigned runtime value without guarding against an empty\nbuffer:\n```rust\npub fn read_checked<C: CubePrimitive>(list: &[C], index: usize) -> C {\n    let fallback = comptime![C::Scalar::default()].runtime();\n    let clamped = index.min(list.len() - 1);\n    let input = unsafe { *list.get_unchecked(clamped) };\n    select(index == clamped, input, C::cast_from(fallback))\n}\n```\nand `checked_index` (used by the whole `ExecutionMode::Checked` rewrite in `CheckedIoVisitor`) does\n`index.min(len - 1)` with `len = buffer_len * unroll_factor`. When the buffer is empty, `len - 1` wraps to\n`usize::MAX`, so `clamped == index`, the `select` picks the \"in bounds\" value, and `get_unchecked` performs an\nunchecked out-of-bounds read - the exact thing checked mode exists to prevent. Zero-length buffers are reachable\nfrom user code (empty tensors / zero-size slices).","fix":"Use a saturating form so an empty buffer clamps to index `0` and the `select` still returns the fallback, e.g.\nin `checked_index`:\n```rust\n-    let len = buffer_len * unroll_factor;\n-    index.min(len - 1)\n+    let len = buffer_len * unroll_factor;\n+    let last = select(len == 0, 0, len - 1);\n+    index.min(last)\n```\nand in `read_checked` compare against `list.len()` (`index < list.len()`) instead of relying on\n`index == clamped`.","locations":[{"ref":"crates/cubecl-core/src/io.rs:14-22","code":"   14 | /// Returns the value at `index` in `list` if the index is in bounds, otherwise returns `value`.\n   15 | #[cube]\n   16 | pub fn read_checked<C: CubePrimitive>(list: &[C], index: usize) -> C {\n   17 |     let fallback = comptime![C::Scalar::default()].runtime();\n   18 |     let clamped = index.min(list.len() - 1);\n   19 |     let input = unsafe { *list.get_unchecked(clamped) };\n   20 | \n   21 |     select(index == clamped, input, C::cast_from(fallback))\n   22 | }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/io.rs#L14-L22"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`contiguous_strides` underflows for a rank-0 (scalar) shape:\n```rust\npub(crate) fn contiguous_strides(shape: &Shape) -> Strides {\n    let rank = shape.len();\n    let mut strides = strides![1; rank];\n    for i in (0..rank - 1).rev() {\n```\nWith `rank == 0`, `rank - 1` panics with \"attempt to subtract with overflow\" in debug builds and\nproduces the range `0..usize::MAX` in release builds, where the first iteration indexes\n`strides[usize::MAX - 1]` out of bounds. `ContiguousMemoryLayoutPolicy::apply` calls it directly with\nwhatever shape the caller passed (`desc.shape.iter().product()` happily returns `1` for an empty\nshape), so an empty-shape descriptor - a scalar tensor - crashes the allocator. The sibling\n`PitchedMemoryLayoutPolicy` guards the same arithmetic with `if rank > 1` / `if rank > 2`.","fix":"```rust\n-    for i in (0..rank - 1).rev() {\n-        strides[i] = strides[i + 1] * shape[i + 1];\n-    }\n+    for i in (0..rank.saturating_sub(1)).rev() {\n+        strides[i] = strides[i + 1] * shape[i + 1];\n+    }\n```","locations":[{"ref":"crates/cubecl-runtime/src/allocator.rs:119-126","code":"  119 | pub(crate) fn contiguous_strides(shape: &Shape) -> Strides {\n  120 |     let rank = shape.len();\n  121 |     let mut strides = strides![1; rank];\n  122 |     for i in (0..rank - 1).rev() {\n  123 |         strides[i] = strides[i + 1] * shape[i + 1];\n  124 |     }\n  125 |     strides\n  126 | }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/allocator.rs#L119-L126"},{"ref":"crates/cubecl-runtime/src/allocator.rs:51-59","code":"   51 |                 let mut strides = strides![1; rank];\n   52 |                 if rank > 1 {\n   53 |                     strides[rank - 2] = pitch / descriptor.elem_size;\n   54 |                 }\n   55 |                 if rank > 2 {\n   56 |                     for i in (0..rank - 2).rev() {\n   57 |                         strides[i] = strides[i + 1] * descriptor.shape[i + 1];\n   58 |                     }\n   59 |                 }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/allocator.rs#L51-L59"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`FlushingPolicyState::register` accumulates staged host bytes in a `u32`:\n`self.bytes_size += bytes.len() as u32;`. Both operations are unsound for the sizes this queue exists\nto handle:\n\n* `bytes.len() as u32` truncates. A single 4 GiB + 8-byte upload registers as `8`, so\n  `should_flush` reports `false` and the allocation is retained instead of being flushed — the exact\n  opposite of what the size threshold is for.\n* the `+=` overflows once the staged total passes `u32::MAX` (4 GiB). In a debug build that is a\n  panic on the upload path; in a release build it silently wraps to a small value, and\n  `should_flush()` keeps answering `false` while host memory keeps growing.\n\nStaging 4 GiB in one flush cycle is routine when loading model weights, which is precisely the\nworkload `PendingDropQueue` serves.","fix":"Track the total in `u64` (or `usize`) and saturate:\n\n```rust\npub(crate) struct FlushingPolicyState {\n    bytes_count: u32,\n    bytes_size: u64,\n}\n\npub(crate) fn register(&mut self, bytes: &Bytes) {\n    self.bytes_count = self.bytes_count.saturating_add(1);\n    self.bytes_size = self.bytes_size.saturating_add(bytes.len() as u64);\n}\n\npub(crate) fn should_flush(&self, policy: &FlushingPolicy) -> bool {\n    self.bytes_count >= policy.max_bytes_count || self.bytes_size >= policy.max_bytes_size as u64\n}\n```","locations":[{"ref":"crates/cubecl-runtime/src/memory_management/drop_queue/policy.rs:26-48","code":"   26 | #[derive(Default, Debug)]\n   27 | pub(crate) struct FlushingPolicyState {\n   28 |     bytes_count: u32,\n   29 |     bytes_size: u32,\n   30 | }\n   31 | \n   32 | impl FlushingPolicyState {\n   33 |     /// Record a newly staged [`Bytes`] allocation.\n   34 |     pub(crate) fn register(&mut self, bytes: &Bytes) {\n   35 |         self.bytes_count += 1;\n   36 |         self.bytes_size += bytes.len() as u32;\n   37 |     }\n   38 | \n   39 |     /// Reset all counters, typically called after a flush.\n   40 |     pub(crate) fn reset(&mut self) {\n   41 |         self.bytes_count = 0;\n   42 |         self.bytes_size = 0;\n   43 |     }\n   44 | \n   45 |     /// Returns `true` if either threshold in `policy` has been reached.\n   46 |     pub(crate) fn should_flush(&self, policy: &FlushingPolicy) -> bool {\n   47 |         self.bytes_count >= policy.max_bytes_count || self.bytes_size >= policy.max_bytes_size\n   48 |     }","lines":23,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/drop_queue/policy.rs#L26-L48"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`Handle::size_in_used` and `Binding::size_in_used` compute\n`self.size - self.offset_start.unwrap_or(0) - self.offset_end.unwrap_or(0)` on `u64`. Nothing\nvalidates the offsets (`Handle::offset_start`/`offset_end` accumulate whatever the caller passes),\nso `offset_start + offset_end > size` panics in debug and wraps to a near-`u64::MAX` length in\nrelease. That value is used as a byte count by copy/read paths, turning a caller mistake into an\nenormous bogus transfer size instead of an error.","fix":"Saturate (or return an error):\n\n```rust\npub fn size_in_used(&self) -> u64 {\n    self.size\n        .saturating_sub(self.offset_start.unwrap_or(0))\n        .saturating_sub(self.offset_end.unwrap_or(0))\n}\n```","locations":[{"ref":"crates/cubecl-runtime/src/server/handle.rs:135-138","code":"  135 |     /// Get the size of the handle, in bytes, accounting for offsets\n  136 |     pub fn size_in_used(&self) -> u64 {\n  137 |         self.size - self.offset_start.unwrap_or(0) - self.offset_end.unwrap_or(0)\n  138 |     }","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/server/handle.rs#L135-L138"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`BytesStorage::alloc` truncates the requested size to the target pointer width with\n`Layout::array::<u8>(size as usize).unwrap()`. On a 32-bit target (`wasm32`, which this crate\nsupports) a `size` of e.g. `0x1_0000_0000` truncates to `0`, the `size == 0` guard above has\nalready been passed, and `alloc_zeroed` is then called with a zero-sized layout — explicitly\nundefined behaviour per `alloc::alloc` — after which the returned `StorageHandle` still advertises\nthe full `size`, so every later `BytesResource::read`/`write` builds a slice far past the\nallocation. The `.unwrap()` is also a panic path for `size > isize::MAX` instead of the\n`IoError::BufferTooBig` the function already returns.","fix":"Validate the cast and turn the layout error into the existing error variant:\n\n```rust\nlet len = usize::try_from(size).map_err(|_| IoError::BufferTooBig {\n    size,\n    backtrace: BackTrace::capture(),\n})?;\nlet layout = Layout::array::<u8>(len).map_err(|_| IoError::BufferTooBig {\n    size,\n    backtrace: BackTrace::capture(),\n})?;\n```","locations":[{"ref":"crates/cubecl-runtime/src/storage/bytes_cpu.rs:107-140","code":"  107 |     fn alloc(&mut self, size: u64) -> Result<StorageHandle, IoError> {\n  108 |         let id = StorageId::new();\n  109 |         let handle = StorageHandle {\n  110 |             id,\n  111 |             utilization: StorageUtilization { offset: 0, size },\n  112 |         };\n  113 | \n  114 |         if size == 0 {\n  115 |             // Zero-size allocations are valid handles but don't need real memory.\n  116 |             let memory = AllocatedBytes {\n  117 |                 ptr: core::ptr::NonNull::dangling().as_ptr(),\n  118 |                 layout: Layout::new::<()>(),\n  119 |             };\n  120 |             self.memory.insert(id, memory);\n  121 |         } else {\n  122 |             unsafe {\n  123 |                 let layout = Layout::array::<u8>(size as usize).unwrap();\n  124 | \n  125 |                 // We allocate zeroed memory since we expose it as &[u8] / &mut [u8]\n  126 |                 // which requires initialization.\n  127 |                 let ptr = alloc_zeroed(layout);\n  128 |                 if ptr.is_null() {\n  129 |                     return Err(IoError::BufferTooBig {\n  130 |                         size,\n  131 |                         backtrace: BackTrace::capture(),\n  132 |                     });\n  133 |                 }\n  134 |                 let memory = AllocatedBytes { ptr, layout };\n  135 |                 self.memory.insert(id, memory);\n  136 |             }\n  137 |         }\n  138 | \n  139 |         Ok(handle)\n  140 |     }","lines":34,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/storage/bytes_cpu.rs#L107-L140"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"hard","description":"`FastDivmod::div` implements the ONNX round-up magic-number division as\n`(I::mul_hi(dividend, *multiplier) + dividend) >> shift_right`. The intermediate `t + dividend` needs one\nbit more than `I`: it approximates `dividend * 2^shift / divisor`, which exceeds `u32::MAX` once\n`dividend > 2^32 * divisor / 2^shift`. Concretely for `divisor = 3` (`shift = 2`,\n`multiplier = 1431655766`) and `dividend = 4_000_000_000`: `t = 1_333_333_334`, `t + dividend` wraps to\n`1_038_366_038` and `div` returns `259_591_509` instead of `1_333_333_333`. Every `PermutedLayout` /\n`StridedLayout` index of a tensor with more than ~2^31 elements is then computed from a wrong quotient.","fix":"Either document and enforce the `dividend < 2^31` precondition at registration time (fall back to\n`FastDivmod::Fallback` when `num_elements` can exceed it), or use the overflow-free form of the algorithm:\n```rust\nlet t = I::mul_hi(dividend, *multiplier);\n// (t + dividend) can overflow; do the final add after one shift\nlet q = t + ((dividend - t) >> I::new(1));\nq >> I::cast_from(*shift_right - 1)\n```\nwith the multiplier recomputed for that variant (Hacker's Delight `magicu`, `add` indicator).","locations":[{"ref":"crates/cubecl-std/src/fast_math.rs:44-56","code":"   44 |     pub fn div(&self, dividend: I) -> I {\n   45 |         match self {\n   46 |             FastDivmod::Fast {\n   47 |                 multiplier,\n   48 |                 shift_right,\n   49 |                 ..\n   50 |             } => {\n   51 |                 let t = I::mul_hi(dividend, *multiplier);\n   52 |                 (t + dividend) >> I::cast_from(*shift_right)\n   53 |             }\n   54 |             FastDivmod::Fallback { divisor } => dividend / *divisor,\n   55 |         }\n   56 |     }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/fast_math.rs#L44-L56"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`find_params_u32` calls `divisor.next_power_of_two()`, which for `divisor > 2^31` overflows: debug builds\npanic, release builds return 0, so `shift = 0u32.trailing_zeros() = 32`. That `shift` is registered as\n`shift_right` and used on device as `(t + dividend) >> I::cast_from(*shift_right)` with `I = u32`, i.e. a\nshift equal to the bit width, which is undefined in SPIR-V/CUDA and invalid in WGSL. `find_params_u64` has\nthe same problem for `divisor > 2^63` (`shift = 64` on a 64-bit shift).","fix":"Compute the ceiling log2 without overflowing and fall back for divisors that cannot be handled:\n```rust\nfn find_params_u32(divisor: u32) -> (u32, u32) {\n    if divisor == 0 || divisor > (1u32 << 31) {\n        return (0, 0); // or return None and use FastDivmod::Fallback\n    }\n    let shift = u32::BITS - (divisor - 1).leading_zeros(); // ceil(log2(divisor)), <= 31\n    ...\n}\n```\nand mirror it in `find_params_u64` with `u64::BITS`.","locations":[{"ref":"crates/cubecl-std/src/fast_math.rs:86-89","code":"   86 |     let div_64 = divisor as u64;\n   87 |     let shift = divisor.next_power_of_two().trailing_zeros();\n   88 |     let multiplier = ((1u64 << 32) * ((1u64 << shift) - div_64)) / div_64 + 1;\n   89 |     (shift, multiplier as u32)","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/fast_math.rs#L86-L89"},{"ref":"crates/cubecl-std/src/fast_math.rs:96-99","code":"   96 |     let div_128 = divisor as u128;\n   97 |     let shift = divisor.next_power_of_two().trailing_zeros();\n   98 |     let multiplier = ((1u128 << 64) * ((1u128 << shift) - div_128)) / div_128 + 1;\n   99 |     (shift, multiplier as u64)","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/fast_math.rs#L96-L99"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`compact_strides` computes `for i in (0..rank - 1).rev()` with `rank = shape.len()`. For an empty shape\n(`rank == 0`) `rank - 1` underflows: debug builds panic with `attempt to subtract with overflow`, release\nbuilds produce the range `0..usize::MAX` and index `strides[i + 1]` far out of bounds. `compact_strides` is\n`pub` and re-exported from `cubecl_std::tensor`, so a rank-0 tensor from any caller triggers it (the sibling\n`is_contiguous` does guard `shape.is_empty()`, which shows the case is considered reachable).","fix":"Guard the empty case:\n```rust\npub fn compact_strides(shape: &[usize]) -> Strides {\n    let rank = shape.len();\n    let mut strides = strides![1; rank];\n    if rank == 0 {\n        return strides;\n    }\n    for i in (0..rank - 1).rev() {\n        strides[i] = strides[i + 1] * shape[i + 1];\n    }\n    strides\n}\n```","locations":[{"ref":"crates/cubecl-std/src/tensor/contiguous/base.rs:499-506","code":"  499 | pub fn compact_strides(shape: &[usize]) -> Strides {\n  500 |     let rank = shape.len();\n  501 |     let mut strides = strides![1; rank];\n  502 |     for i in (0..rank - 1).rev() {\n  503 |         strides[i] = strides[i + 1] * shape[i + 1];\n  504 |     }\n  505 |     strides\n  506 | }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/contiguous/base.rs#L499-L506"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`DynamicRankStridedLayout::to_source_pos` accumulates the linear offset in a `u32` and only widens at the\nend (`offset as usize`), so any tensor with more than `u32::MAX` elements (or a single stride/coordinate\nproduct above it) wraps around and indexes the wrong element. The sibling `FixedDimLayout::to_source_pos`\ndoes it correctly (`offset += pos[i] as usize * self.strides[i]` with `usize` strides), so the two layouts\ndisagree on the width of the address computation.","fix":"Widen before multiplying, like `FixedDimLayout`:\n```rust\nfn to_source_pos(&self, pos: Self::Coordinates) -> Self::SourceCoordinates {\n    let mut offset = 0usize;\n    #[unroll]\n    for i in 0..self.strides.len() {\n        offset += pos[i] as usize * self.strides[i] as usize;\n    }\n    offset\n}\n```","locations":[{"ref":"crates/cubecl-std/src/tensor/layout/dynamic_rank_strided.rs:26-33","code":"   26 |     fn to_source_pos(&self, pos: Self::Coordinates) -> Self::SourceCoordinates {\n   27 |         let mut offset = 0u32;\n   28 |         #[unroll]\n   29 |         for i in 0..self.strides.len() {\n   30 |             offset += pos[i] * self.strides[i];\n   31 |         }\n   32 |         offset as usize\n   33 |     }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/layout/dynamic_rank_strided.rs#L26-L33"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`calculate_matmul_output` checks that the two ranks are equal but never that they are at\nleast 2, then indexes `lhs[rank - 1]` and `rhs[rank - 2]`. For a rank-1 input `rank - 2`\nunderflows to `usize::MAX` and the index panics; for rank 0 even `rank - 1` underflows.\nA public shape-arithmetic helper should return `MetadataError` for these inputs, not abort.","fix":"Add the missing guard right after the rank comparison:\n```rust\nif rank < 2 {\n    return Err(MetadataError::Invalid {\n        reason: format!(\"matmul requires rank >= 2, got {rank}\"),\n    });\n}\n```","locations":[{"ref":"crates/cubecl-zspace/src/shape.rs:489-503","code":"  489 | pub fn calculate_matmul_output(lhs: &Shape, rhs: &Shape) -> Result<Shape, MetadataError> {\n  490 |     let rank = lhs.rank();\n  491 |     if rank != rhs.rank() {\n  492 |         return Err(MetadataError::RankMismatch {\n  493 |             left: rank,\n  494 |             right: rhs.rank(),\n  495 |         });\n  496 |     }\n  497 | \n  498 |     if lhs[rank - 1] != rhs[rank - 2] {\n  499 |         return Err(MetadataError::IncompatibleShapes {\n  500 |             left: lhs.clone(),\n  501 |             right: rhs.clone(),\n  502 |         });\n  503 |     }","lines":15,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/shape.rs#L489-L503"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`DeviceClient::enqueue` increments the shared cursor on *every* retry:\n`let index = self.state.available_index.fetch_add(1, Ordering::Acquire) as usize;` inside the\nback-off loop, discarding the reservation when `index >= CHANNEL_MAX_TASK`. `available_index` is an\n`AtomicU32`, so a producer that stays blocked (the server is wedged, or the queue is saturated by\nother producers) walks the counter towards `u32::MAX`; the same happens 32 at a time in\n`pad_with_noops`. On wrap-around, `fetch_add` returns a small value again and the client writes into\na slot of the *current* client buffer that another producer already filled and that the accounting\nbelieves is still pending: `ptr::write` overwrites a live closure without dropping it (leak), the\noverwritten task never runs, and `enqueued_count` can then reach `CHANNEL_MAX_TASK` with slots that\nwere never re-initialized - whose stale `fn_ptr` will `ptr::read` an already-moved closure, i.e. a\ndouble drop.","fix":"Do not consume a ticket to discover the queue is full - peek first, and only claim a slot when one\nexists:\n```rust\nloop {\n    if self.state.available_index.load(Ordering::Acquire) >= CHANNEL_MAX_TASK as u32 {\n        /* back off */ continue;\n    }\n    let index = self.state.available_index.fetch_add(1, Ordering::Acquire) as usize;\n    if index >= CHANNEL_MAX_TASK { /* lost the race, back off */ continue; }\n    ...\n}\n```\nand saturate rather than wrap, e.g. by clamping `available_index` in `pad_with_noops` /\n`fetch_add` (`fetch_update` with `min(CHANNEL_MAX_TASK as u32, ...)`).","locations":[{"ref":"crates/cubecl-common/src/device/handle/channel.rs:904-925","code":"  904 |         pub fn enqueue<F: FnOnce() + Send + 'static>(&self, func: F) -> Result<(), CallError> {\n  905 |             let mut idle_count: u32 = 0;\n  906 |             loop {\n  907 |                 let index = self.state.available_index.fetch_add(1, Ordering::Acquire) as usize;\n  908 |                 if index >= CHANNEL_MAX_TASK {\n  909 |                     // The queue is full; back off until the server flushes/swaps buffers.\n  910 |                     if idle_count < SPIN_BUDGET_CLIENT {\n  911 |                         spin_loop();\n  912 |                     } else if idle_count < SPIN_BUDGET_CLIENT + YIELD_BUDGET_CLIENT {\n  913 |                         std::thread::yield_now();\n  914 |                     } else {\n  915 |                         std::thread::sleep(SLEEP_STEP_CLIENT);\n  916 |                     }\n  917 |                     idle_count = idle_count.saturating_add(1);\n  918 |                     continue;\n  919 |                 }\n  920 | \n  921 |                 self.state.init_task_at(index, func);\n  922 |                 self.state.enqueued_count.fetch_add(1, Ordering::SeqCst);\n  923 |                 return Ok(());\n  924 |             }\n  925 |         }","lines":22,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/device/handle/channel.rs#L904-L925"},{"ref":"crates/cubecl-common/src/device/handle/channel.rs:959-984","code":"  959 |         #[inline]\n  960 |         fn pad_with_noops(&self) {\n  961 |             let index_start =\n  962 |                 self.available_index\n  963 |                     .fetch_add(CHANNEL_MAX_TASK as u32, Ordering::Acquire) as usize;\n  964 | \n  965 |             // The queue is already flushed.\n  966 |             if index_start >= CHANNEL_MAX_TASK {\n  967 |                 return;\n  968 |             }\n  969 | \n  970 |             // We clamp the number of no-op to the required amount.\n  971 |             //\n  972 |             // # Notes\n  973 |             //\n  974 |             // index_end != index_start + CHANNEL_MAX_TASK;\n  975 |             let index_end = CHANNEL_MAX_TASK;\n  976 | \n  977 |             for index in index_start..index_end {\n  978 |                 self.init_task_at(index, || ());\n  979 |             }\n  980 | \n  981 |             let actual_added = index_end - index_start;\n  982 |             self.enqueued_count\n  983 |                 .fetch_add(actual_added as u32, Ordering::SeqCst);\n  984 |         }","lines":26,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/device/handle/channel.rs#L959-L984"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`contiguous_strides` underflows for a rank-0 shape: `for i in (0..rank - 1).rev()` evaluates\n`0usize - 1`. A debug build panics with \"attempt to subtract with overflow\"; a release build wraps to\n`0..usize::MAX`, and the first iteration indexes `strides[usize::MAX - 1]`, panicking on the bounds\ncheck. It is called from `CpuServer::write` on caller-supplied `desc.shape`, so a zero-rank\n(scalar) descriptor takes down the process rather than returning `IoError::UnsupportedStrides`.","fix":"Iterate without the subtraction:\n```rust\npub(crate) fn contiguous_strides(shape: &Shape) -> Strides {\n    let rank = shape.len();\n    let mut strides = strides![1; rank];\n    for i in (1..rank).rev() {\n        strides[i - 1] = strides[i] * shape[i];\n    }\n    strides\n}\n```\n(the same pattern exists in `crates/cubecl-wgpu/src/compute/server.rs:509-515` and\n`crates/cubecl-runtime/src/allocator.rs:116-123`).","locations":[{"ref":"crates/cubecl-cpu/src/compute/server.rs:509-516","code":"  509 | pub(crate) fn contiguous_strides(shape: &Shape) -> Strides {\n  510 |     let rank = shape.len();\n  511 |     let mut strides = strides![1; rank];\n  512 |     for i in (0..rank - 1).rev() {\n  513 |         strides[i] = strides[i + 1] * shape[i + 1];\n  514 |     }\n  515 |     strides\n  516 | }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cpu/src/compute/server.rs#L509-L516"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`check_tma_im2col` computes `map.metadata.rank() - 2` in its first two checks, *before* the check that\nthe rank is between 3 and 5. `rank()` returns `usize`, so a rank-0 or rank-1 im2col tensor map\nunderflows: a debug build panics with \"attempt to subtract with overflow\" and a release build\ncompares against a huge number and then falls through to the rank check. Since this function only runs\non the error path of `cuTensorMapEncodeIm2col`, a user who passes a bad rank gets a panic instead of\nthe intended \"im2col requires rank to be between 3 and 5\" diagnostic.","fix":"Move the rank check first:\n```rust\nlaunch_check!(\n    map.metadata.rank() >= 3 && map.metadata.rank() <= 5,\n    \"im2col requires rank to be between 3 and 5\"\n)?;\nlaunch_check!(lower_corner.len() == map.metadata.rank() - 2, \"Lower corner must be rank - 2 elements\")?;\nlaunch_check!(upper_corner.len() == map.metadata.rank() - 2, \"Upper corner must be rank - 2 elements\")?;\n```","locations":[{"ref":"crates/cubecl-cuda/src/compute/server.rs:1285-1304","code":" 1285 |     launch_check!(\n 1286 |         lower_corner.len() == map.metadata.rank() - 2,\n 1287 |         \"Lower corner must be rank - 2 elements\"\n 1288 |     )?;\n 1289 |     launch_check!(\n 1290 |         upper_corner.len() == map.metadata.rank() - 2,\n 1291 |         \"Upper corner must be rank - 2 elements\"\n 1292 |     )?;\n 1293 | \n 1294 |     launch_check!(\n 1295 |         map.metadata.rank() >= 3 && map.metadata.rank() <= 5,\n 1296 |         \"im2col requires rank to be between 3 and 5\"\n 1297 |     )?;\n 1298 | \n 1299 |     let (range_lower, range_upper) = match map.metadata.rank() {\n 1300 |         3 => (-32768, 32767),\n 1301 |         4 => (-128, 127),\n 1302 |         5 => (-16, 15),\n 1303 |         _ => unreachable!(),\n 1304 |     };","lines":20,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cuda/src/compute/server.rs#L1285-L1304"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`ConstantValue::try_as_u32` silently truncates instead of failing, and its doc claims the only\nfailure mode is a non-integer constant:\n```rust\n/// Returns the value of the scalar as a u32.\n///\n/// It will return [None] if the scalar type is a float or a bool.\npub fn try_as_u32(&self) -> Option<u32> {\n    self.try_as_u64().map(|it| it as u32)\n}\n```\nA `ConstantValue::UInt(0x1_0000_0000)` yields `Some(0)`, and a negative `Int` yields a large `u32`\nvia `as u64 as u32`. The related `impl_into_value!` entry `usize => UIntKind::U32` compounds this: a\n`usize` constant keeps its full 64-bit payload in `ConstantValue::UInt` but is tagged as a `u32`\ntype, so the truncation is invisible until code generation.","fix":"Use a checked conversion so out-of-range constants are reported rather than folded to a wrong value:\n```rust\npub fn try_as_u32(&self) -> Option<u32> {\n    u32::try_from(self.try_as_u64()?).ok()\n}\n```","locations":[{"ref":"crates/cubecl-ir/src/value.rs:194-206","code":"  194 |     /// Returns the value of the scalar as a u32.\n  195 |     ///\n  196 |     /// It will return [None] if the scalar type is a float or a bool.\n  197 |     pub fn try_as_u32(&self) -> Option<u32> {\n  198 |         self.try_as_u64().map(|it| it as u32)\n  199 |     }\n  200 | \n  201 |     /// Returns the value of the scalar as a u32.\n  202 |     ///\n  203 |     /// It will panic if the scalar type is a float or a bool.\n  204 |     pub fn as_u32(&self) -> u32 {\n  205 |         self.as_u64() as u32\n  206 |     }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-ir/src/value.rs#L194-L206"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`MetalDevice::to_id` truncates the device index into a `u16` while `from_id` widens it back:\n```rust\nSelf::DiscreteGpu(idx) => DeviceId { type_id: 1, index_id: *idx as u16 },\nSelf::Existing(id)     => DeviceId { type_id: 3, index_id: *id as u16 },\n```\n`MetalDevice::Existing(u32)` ids come from `DeviceRegistry::register`'s monotonically increasing\n`counter: u32`, so once more than 65536 devices have been registered (long-running host that\nregisters an `MTLDevice` per external context), `to_id` silently aliases distinct devices onto the\nsame `DeviceId`, and `from_id` hands back a `MetalDevice::Existing(id)` that resolves to the wrong\ndevice (or `None` from `get_existing_device`). The truncation is silent because it is an `as` cast.","fix":"Reject values that do not fit instead of truncating, e.g.\n```rust\nSelf::Existing(id) => DeviceId {\n    type_id: 3,\n    index_id: u16::try_from(*id).expect(\"more than u16::MAX Metal devices registered\"),\n},\n```\nand/or make `DeviceRegistry::counter` a `u16` so the registry cannot mint unrepresentable ids.","locations":[{"ref":"crates/cubecl-metal/src/device.rs:35-54","code":"   35 |     fn to_id(&self) -> DeviceId {\n   36 |         match self {\n   37 |             Self::DefaultDevice => DeviceId {\n   38 |                 type_id: 0,\n   39 |                 index_id: 0,\n   40 |             },\n   41 |             Self::DiscreteGpu(idx) => DeviceId {\n   42 |                 type_id: 1,\n   43 |                 index_id: *idx as u16,\n   44 |             },\n   45 |             Self::IntegratedGpu(idx) => DeviceId {\n   46 |                 type_id: 2,\n   47 |                 index_id: *idx as u16,\n   48 |             },\n   49 |             Self::Existing(id) => DeviceId {\n   50 |                 type_id: 3,\n   51 |                 index_id: *id as u16,\n   52 |             },\n   53 |         }\n   54 |     }","lines":20,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-metal/src/device.rs#L35-L54"},{"ref":"crates/cubecl-metal/src/device.rs:97-102","code":"   97 |     fn register(&mut self, device: Retained<ProtocolObject<dyn MTLDevice>>) -> u32 {\n   98 |         let id = self.counter;\n   99 |         self.counter += 1;\n  100 |         self.devices.insert(id, device);\n  101 |         id\n  102 |     }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-metal/src/device.rs#L97-L102"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`AsIndex::as_index` is generated as a plain `self as isize` for every integer type,\nincluding `u64` and `usize`. Any value above `isize::MAX` therefore becomes negative, and\n`try_wrap` then treats it as a *negative* index and wraps it from the end of the range:\n`IndexWrap::index().try_wrap(u64::MAX, 3)` returns `Ok(2)` instead of a `BoundsError`.\nA wildly out-of-range index silently becomes a valid one, which converts a would-be error\ninto a silent read of the wrong element.","fix":"Use a checked conversion for the unsigned types, e.g. specialise the macro:\n```rust\nmacro_rules! gen_as_index_unsigned {\n    ($ty:ty) => {\n        impl AsIndex for $ty {\n            fn as_index(self) -> isize {\n                isize::try_from(self).unwrap_or(isize::MAX)\n            }\n        }\n    };\n}\n```\nso out-of-range values stay positive and are rejected by the `(_idx as usize) >= size`\nbound check.","locations":[{"ref":"crates/cubecl-zspace/src/indexing/type_conversion.rs:82-93","code":"   82 | macro_rules! gen_as_index {\n   83 |     ($ty:ty) => {\n   84 |         impl AsIndex for $ty {\n   85 |             fn as_index(self) -> isize {\n   86 |                 self as isize\n   87 |             }\n   88 |         }\n   89 |     };\n   90 |     ($($ty:ty),*) => {$(gen_as_index!($ty);)*};\n   91 | }\n   92 | \n   93 | gen_as_index!(usize, isize, i64, u64, i32, u32, i16, u16, i8, u8);","lines":12,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/indexing/type_conversion.rs#L82-L93"},{"ref":"crates/cubecl-zspace/src/indexing/wrapping.rs:109-137","code":"  109 |     let source_idx = idx.as_index();\n  110 |     let source_size = size;\n  111 | \n  112 |     let size = if source_size > 0 {\n  113 |         source_size\n  114 |     } else {\n  115 |         if !wrap_scalar {\n  116 |             return Err(BoundsError::index(kind, source_idx, 0..0));\n  117 |         }\n  118 |         1\n  119 |     };\n  120 | \n  121 |     if source_idx >= 0 && (source_idx as usize) < size {\n  122 |         return Ok(source_idx as usize);\n  123 |     }\n  124 | \n  125 |     let _idx = if source_idx < 0 {\n  126 |         source_idx + size as isize\n  127 |     } else {\n  128 |         source_idx\n  129 |     };\n  130 | \n  131 |     if _idx < 0 || (_idx as usize) >= size {\n  132 |         let rank = size as isize;\n  133 | \n  134 |         return Err(BoundsError::index(kind, source_idx, 0..rank));\n  135 |     }\n  136 | \n  137 |     Ok(_idx as usize)","lines":29,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/indexing/wrapping.rs#L109-L137"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`SliceExpand::__expand_copy_from_slice_method` drives the copy loop purely from the *source* length\n(`let len = source.__expand_len_method(scope);`) and never compares it against `self`'s length. The\nloop then writes `self[idx]` for every `idx` in `0..source.len()`, so copying from a slice that is\nlonger than the destination writes past the end of the destination slice. This is the expansion of\nthe `copy_from_slice` API, which in Rust panics on a length mismatch; here it silently produces\nout-of-bounds stores (in unchecked mode the store goes straight into whatever memory follows the\ndestination inside the parent buffer).","fix":"Bound the loop by the destination length as well, e.g.\n\n```rust\npub fn __expand_copy_from_slice_method(&mut self, scope: &Scope, source: &SliceExpand<E>) {\n    let src_len = source.__expand_len_method(scope);\n    let dst_len = self.__expand_len_method(scope);\n    let len = src_len.__expand_min_method(scope, dst_len);\n    ...\n}\n```\n\nor emit an explicit `expand_assert!(src_len == dst_len, \"copy_from_slice length mismatch\")` so the\ncontract of `copy_from_slice` is enforced instead of silently overrunning `self`.","locations":[{"ref":"crates/cubecl-core/src/frontend/container/slice/operator.rs:132-151","code":"  132 | impl<E: CubePrimitive> SliceExpand<E> {\n  133 |     pub fn __expand_copy_from_slice_method(&mut self, scope: &Scope, source: &SliceExpand<E>) {\n  134 |         let len = source.__expand_len_method(scope);\n  135 |         let unroll = source\n  136 |             .const_len()\n  137 |             .is_some_and(|it| it <= MEMCPY_UNROLL_LIMIT);\n  138 |         for_expand(\n  139 |             scope,\n  140 |             range::expand(scope, 0usize.into_expand(scope), len),\n  141 |             unroll,\n  142 |             |scope, idx| {\n  143 |                 copy::expand(\n  144 |                     scope,\n  145 |                     source.__expand_index_method(scope, idx),\n  146 |                     self.__expand_index_mut_method(scope, idx),\n  147 |                 );\n  148 |             },\n  149 |         );\n  150 |     }\n  151 | }","lines":20,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/container/slice/operator.rs#L132-L151"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The `TypeHash` derive never hashes enum *variant names*. `type_hash_enum` iterates the variants and\nonly emits (a) a hash of the explicit `discriminant` when one is written in the source, and (b) the\nhashes of the variant's fields. `TypeHashVariant` does not even capture the variant `ident`:\n```rust\n#[derive(FromVariant)]\n#[darling(attributes(type_hash))]\npub struct TypeHashVariant {\n    pub discriminant: Option<Expr>,\n    pub fields: Fields<TypeHashField>,\n}\n```\nThis directly contradicts the documented contract of the trait\n(`crates/cubecl-ir/src/type_hash.rs`): *\"This recursively hashes the names and types of each variant\nand field ... The hash should only change if a field/variant is renamed, added, or its type is\nchanged.\"* For a unit-only enum without explicit discriminants, such as `Synchronization`\n(`SyncCube`, `SyncPlane`, `SyncStorage`, `SyncAsyncProxyShared`) or `FloatKind`, the generated\n`write_hash` writes nothing but the enum's own name, so renaming a variant, reordering variants or\nadding a whole new variant leaves `type_hash()` bit-identical. Any consumer that uses `TypeHash` as\na structural version stamp for a serialized-IR or artifact cache will happily accept data produced\nby an incompatible version of the IR.","fix":"Capture the variant identifier and hash it, e.g.:\n```rust\n#[derive(FromVariant)]\n#[darling(attributes(type_hash))]\npub struct TypeHashVariant {\n    pub ident: Ident,\n    pub discriminant: Option<Expr>,\n    pub fields: Fields<TypeHashField>,\n}\n```\nand in `type_hash_enum`:\n```rust\nlet variants = data.iter().flat_map(|v| {\n    let variant_name = v.ident.to_string();\n    iter::once(quote! { hasher.write(#variant_name.as_bytes()); })\n        .chain(v.discriminant.iter().map(|d| quote! {\n            core::hash::Hash::hash(&(#d as isize), hasher);\n        }))\n        .chain(v.fields.iter().map(write_field_hash))\n});\n```","locations":[{"ref":"crates/cubecl-macros-internal/src/type_hash.rs:18-23","code":"   18 | #[derive(FromVariant)]\n   19 | #[darling(attributes(type_hash))]\n   20 | pub struct TypeHashVariant {\n   21 |     pub discriminant: Option<Expr>,\n   22 |     pub fields: Fields<TypeHashField>,\n   23 | }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros-internal/src/type_hash.rs#L18-L23"},{"ref":"crates/cubecl-macros-internal/src/type_hash.rs:62-79","code":"   62 | fn type_hash_enum(ident: &Ident, generics: &Generics, data: &[TypeHashVariant]) -> TokenStream {\n   63 |     let name = ident.to_string();\n   64 |     let (impl_generics, ty_generics, where_clause) = generics.split_for_impl();\n   65 |     let variants = data.iter().flat_map(|v| {\n   66 |         v.discriminant\n   67 |             .iter()\n   68 |             .map(|discriminant| quote! [core::hash::Hash::hash(&(#discriminant as isize), hasher);])\n   69 |             .chain(v.fields.iter().map(write_field_hash))\n   70 |     });\n   71 |     quote! {\n   72 |         impl #impl_generics crate::TypeHash for #ident #ty_generics #where_clause{\n   73 |             fn write_hash(hasher: &mut impl core::hash::Hasher) {\n   74 |                 hasher.write(#name.as_bytes());\n   75 |                 #(#variants)*\n   76 |             }\n   77 |         }\n   78 |     }\n   79 | }","lines":18,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros-internal/src/type_hash.rs#L62-L79"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Assign::assign_body_comptime_enum` emits `match self { ... }` but every branch produced by\n`assign_body_comptime_variant` is a *two-element tuple pattern* `(Self::A(..), Self::A(..))`\nmatching `self` against `value`:\n```rust\nquote![match self {\n    #(#branches,)*\n    _ => core::fmt::panic!(\"Can't assign to mismatched enum variants\"),\n}]\n```\nThe scrutinee has to be `(self, value)` for those patterns to typecheck, so the whole\n`#[derive(CubeTypeMut)]` output for a comptime enum is uncompilable. On top of that, the `Style::Tuple`\narm calls a method that does not exist anywhere in the workspace,\n`#name_this.expand_assign(scope, #name_other)`, while the sibling `Style::Struct` arm correctly calls\n`#name_this.__expand_assign_method(scope, #name_other)` - the only method declared by the `Assign`\ntrait. Finally `core::fmt::panic!` is not a macro exported by `core::fmt`.","fix":"Match on the pair and use the real trait method:\n```rust\nquote![match (self, value) {\n    #(#branches,)*\n    _ => core::panic!(\"Can't assign to mismatched enum variants\"),\n}]\n```\nand in the `Style::Tuple` arm replace\n`quote![#name_this.expand_assign(scope, #name_other);]` with\n`quote![#name_this.__expand_assign_method(scope, #name_other);]`.","locations":[{"ref":"crates/cubecl-macros/src/generate/assign.rs:97-108","code":"   97 |     fn assign_body_comptime_enum(&self) -> TokenStream {\n   98 |         let variants = self.data.as_ref().take_enum().unwrap();\n   99 | \n  100 |         let branches = variants\n  101 |             .iter()\n  102 |             .map(|variant| self.assign_body_comptime_variant(variant));\n  103 | \n  104 |         quote![match self {\n  105 |             #(#branches,)*\n  106 |             _ => core::fmt::panic!(\"Can't assign to mismatched enum variants\"),\n  107 |         }]\n  108 |     }","lines":12,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/assign.rs#L97-L108"},{"ref":"crates/cubecl-macros/src/generate/assign.rs:120-127","code":"  120 |                 let fields = variant.fields.iter().enumerate().map(|(i, field)| {\n  121 |                     let name_this = format_ident!(\"_{i}_this\");\n  122 |                     let name_other = format_ident!(\"_{i}_other\");\n  123 |                     match field.comptime.is_present() {\n  124 |                         true => quote![*#name_this = #name_other;],\n  125 |                         false => quote![#name_this.expand_assign(scope, #name_other);],\n  126 |                     }\n  127 |                 });","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/assign.rs#L120-L127"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Match arm guards are silently discarded by the `#[cube]` expansion. `MatchArm` only stores\n`pat` and `expr` (`crates/cubecl-macros/src/expression.rs:187-190`), and the `Expr::Match`\nhandler in `Expression::from_expr` never looks at `arm.guard` - neither on the comptime path\n(`arms.push(MatchArm { pat: arm.pat.clone(), expr: ... })`) nor on the runtime path. Only\n`numeric_match` bails out on guards (`.map(|arm| arm.guard.is_none().then_some(arm))`), and it\nis not reached for non-numeric patterns. As a result a kernel like\n```rust\n#[cube]\nfn f(#[comptime] n: u32) -> u32 {\n    match n { x if x > 3 => 1, _ => 0 }\n}\n```\nexpands to `match n { x => 1, _ => 0 }`: the guard vanishes, the first arm always matches and\nthe kernel silently computes the wrong value with no warning or error from the macro.","fix":"Reject guards explicitly until they are supported, in both branches of the `Expr::Match`\nhandler (and in `expand_if_let`):\n```rust\nfor arm in mat.arms.iter() {\n    if let Some((if_token, _)) = &arm.guard {\n        return Err(syn::Error::new_spanned(\n            if_token,\n            \"match guards are not supported in `#[cube]` functions\",\n        ));\n    }\n    ...\n}\n```\nAlternatively add a `guard: Option<Box<Expression>>` field to `MatchArm` and emit it in\n`MatchArm::to_tokens` for the comptime `match` case.","locations":[{"ref":"crates/cubecl-macros/src/parse/expression.rs:293-324","code":"  293 |             Expr::Match(mat) => {\n  294 |                 let expr = Expression::from_expr(*mat.expr.clone(), context)?;\n  295 |                 if expr.is_const() {\n  296 |                     let mut arms = Vec::new();\n  297 | \n  298 |                     for arm in mat.arms.iter() {\n  299 |                         arms.push(MatchArm {\n  300 |                             pat: arm.pat.clone(),\n  301 |                             expr: Box::new(Self::from_expr(arm.body.as_ref().clone(), context)?),\n  302 |                         });\n  303 |                     }\n  304 | \n  305 |                     Expression::Match {\n  306 |                         runtime_variants: false,\n  307 |                         expr: Box::new(expr),\n  308 |                         arms,\n  309 |                     }\n  310 |                 } else if let Some(switch) = numeric_match(mat.clone(), context) {\n  311 |                     switch\n  312 |                 } else {\n  313 |                     let mut arms = Vec::new();\n  314 | \n  315 |                     for arm in mat.arms.iter() {\n  316 |                         let (expr, _) = context.in_scope(|context| {\n  317 |                             add_variables_from_pat(&arm.pat, context);\n  318 |                             Self::from_expr(arm.body.as_ref().clone(), context)\n  319 |                         })?;\n  320 |                         arms.push(MatchArm {\n  321 |                             pat: arm.pat.clone(),\n  322 |                             expr: Box::new(expr),\n  323 |                         });\n  324 |                     }","lines":32,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/expression.rs#L293-L324"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`MemoryPage::try_reserve` decides whether a free slice can be reused (and how to split it) from\n`slice.storage.utilization.size`, which *excludes* the slice's padding, instead of from\n`slice.effective_size()` (`size + padding`). Two bad consequences follow.\n\n1. Unusable free space. When a slice is reserved, `slice.storage.utilization.size` is set to the\n   requested `size` and `slice.padding` to `padding`, so the region really owned by the slice is\n   `size + padding`. After the handle is dropped the slice is free but the reuse test\n   `slice.storage.utilization.size >= effective_size` only sees `size`. With a device alignment of\n   256 or 512 (the common case) every new request has an `effective_size` that is a multiple of the\n   alignment, so a freed slice whose stored `size` is not a multiple of the alignment (e.g. a\n   100-byte slice occupying a 256-byte region) can never be reused, no matter how small the new\n   request is, until it happens to be merged with an adjacent free slice by `coalesce`.\n\n2. Permanently orphaned bytes. The split uses `storage_old` (whose `size` is the stale non-padded\n   size) and `offset_start(effective_size)`, so the new tail slice spans\n   `[offset + effective_size, offset + old_size)` and the `padding` bytes at the end of the old\n   region belong to no slice at all. Example with `alignment = 4` on a 1000-byte page: reserve\n   `101` (`padding = 3`, region `[0, 104)`), reserve `896` for the tail, drop the first handle,\n   then reserve `52` from the freed slice — the new tail slice becomes `{offset: 52, size: 49}`, so\n   bytes `[101, 104)` are lost forever. Because `coalesce` rebuilds merged slices from the sum of\n   `effective_size()`, those bytes are never recovered, and the sum of all slice sizes on the page\n   drifts permanently below `storage.size()`. That in turn makes\n   `SlicedPool::cleanup`'s `summary.amount_free == summary.amount_total` test impossible to satisfy,\n   so the page can never be released to the driver again.","fix":"Reserve against the slice's whole span and keep the span accounted for:\n\n```rust\nlet padding = calculate_padding(size, self.alignment);\nlet effective_size = size + padding;\n\nfor (index, slice) in self.slices.iter_mut().enumerate() {\n    let span = slice.effective_size(); // size + padding, the region really owned\n    if span < effective_size || !slice.handle.is_free() {\n        continue;\n    }\n\n    let can_be_split = span > effective_size;\n    let handle = slice.handle.clone();\n    let offset = slice.storage.utilization.offset;\n    let id = slice.storage.id;\n\n    slice.storage.utilization.size = size;\n    // Keep the whole span attached to this slice when it isn't split, so no byte is orphaned.\n    slice.padding = if can_be_split { padding } else { span - size };\n\n    if can_be_split {\n        let storage = StorageHandle::new(\n            id,\n            StorageUtilization { offset: offset + effective_size, size: span - effective_size },\n        );\n        self.add_new_slice(index, size, Slice::new(storage, 0));\n    }\n\n    return Some(handle);\n}\n```\n\nNote `add_new_slice` also resets `slice.storage.utilization.size = reserved_size_previous`, so it\nmust not clobber the padding computed here.","locations":[{"ref":"crates/cubecl-runtime/src/memory_management/memory_pool/memory_page.rs:166-195","code":"  166 |     pub fn try_reserve(&mut self, size: u64) -> Option<ManagedMemoryHandle> {\n  167 |         let padding = calculate_padding(size, self.alignment);\n  168 |         let effective_size = size + padding;\n  169 | \n  170 |         for (index, slice) in self.slices.iter_mut().enumerate() {\n  171 |             let can_use_slice =\n  172 |                 slice.storage.utilization.size >= effective_size && slice.handle.is_free();\n  173 | \n  174 |             if !can_use_slice {\n  175 |                 continue;\n  176 |             }\n  177 | \n  178 |             let can_be_split = slice.storage.utilization.size > effective_size;\n  179 |             let handle = slice.handle.clone();\n  180 |             let storage_old = slice.storage.clone();\n  181 | \n  182 |             // Updates the current storage utilization.\n  183 |             slice.storage.utilization.size = size;\n  184 |             slice.padding = padding;\n  185 | \n  186 |             if can_be_split {\n  187 |                 let new_slice = Slice::new(storage_old.offset_start(effective_size), 0);\n  188 |                 self.add_new_slice(index, size, new_slice);\n  189 |             }\n  190 | \n  191 |             return Some(handle);\n  192 |         }\n  193 | \n  194 |         None\n  195 |     }","lines":30,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/memory_pool/memory_page.rs#L166-L195"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `PermutedLayout::register`, the broadcast branch sets the layout length from `reference_shape.len()`,\nbut `Shape` only implements `Deref<Target = [usize]>` and has no inherent `len()`, so `.len()` returns the\n**rank** (number of dimensions), not the number of elements. The non-broadcast branch correctly uses\n`buffer.len()`, which is `shape.iter().product()`. `len` is then registered as the layout length and used by\n`PermutedLayout::shape()` and `PermutedLayout::is_in_bounds(pos) -> pos < self.len`, so a broadcast linear\nview claims to hold only `rank / vector_size` elements.","fix":"Use the element count, not the rank:\n```rust\nSome(reference_shape) => {\n    let len = reference_shape.num_elements(); // was: reference_shape.len()\n    let strides = strides_ref(shape, &reference_shape, strides);\n    (reference_shape.iter().copied().collect(), strides, len)\n}\n```\n`Shape::num_elements()` already exists (`crates/cubecl-zspace/src/shape.rs`).","locations":[{"ref":"crates/cubecl-std/src/tensor/layout/permuted.rs:64-76","code":"   64 |         let (shape, strides, len) = match arg.reference_shape {\n   65 |             Some(reference_shape) => {\n   66 |                 let len = reference_shape.len();\n   67 |                 let strides = strides_ref(shape, &reference_shape, strides);\n   68 |                 (reference_shape.iter().copied().collect(), strides, len)\n   69 |             }\n   70 |             None => (\n   71 |                 shape.iter().copied().collect(),\n   72 |                 strides.iter().copied().collect(),\n   73 |                 buffer.len(),\n   74 |             ),\n   75 |         };\n   76 |         let len = len / ty.vector_size();","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/layout/permuted.rs#L64-L76"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`e4m3`, `e5m2`, `e2m1` and `e2m1x2` all `#[derive(PartialEq, PartialOrd)]` on their `u8` bit\npattern, which is not the float ordering. Because the sign bit is the most significant bit, every\nnegative value compares *greater* than every positive one: `e5m2::MIN` is `from_bits(0xFB)` and\n`e5m2::MAX` is `from_bits(0x7B)`, so `e5m2::MIN > e5m2::MAX` is `true`. Likewise `-0.0` (`0x80`) is\nnot equal to `0.0` (`0x00`), and `e4m3::NAN == e4m3::NAN` is `true` (both `0xFF`), all of which\ncontradict IEEE semantics that any user of `<`, `>`, `.max()`, `sort()` or `PartialEq` on these\ntypes will assume. `total_cmp` exists and is correct, which makes the derived operators an easy\ntrap. `e2m1x2` is worse still: it packs two independent values into one byte, so ordering it is\nmeaningless.","fix":"Drop the derives and implement them over the converted value, e.g. for `e5m2`:\n```rust\n#[derive(Clone, Copy, Default, Zeroable, Pod)]\npub struct e5m2(u8);\n\nimpl PartialEq for e5m2 {\n    fn eq(&self, other: &Self) -> bool { self.to_f32() == other.to_f32() }\n}\nimpl PartialOrd for e5m2 {\n    fn partial_cmp(&self, other: &Self) -> Option<core::cmp::Ordering> {\n        self.to_f32().partial_cmp(&other.to_f32())\n    }\n}\n```\nand remove `PartialOrd` entirely from the packed `e2m1x2`.","locations":[{"ref":"crates/cubecl-common/src/float/fp8/fp8_e5m2.rs:23-38","code":"   23 | #[allow(non_camel_case_types)]\n   24 | #[repr(transparent)]\n   25 | #[cfg_attr(feature = \"serde\", derive(serde::Serialize, serde::Deserialize))]\n   26 | #[derive(Clone, Copy, Default, Zeroable, Pod, PartialEq, PartialOrd)]\n   27 | pub struct e5m2(u8);\n   28 | \n   29 | impl e5m2 {\n   30 |     /// Maximum representable value, `S.11110.11` = 1.75 * 2^15 = 57344.\n   31 |     ///\n   32 |     /// Not taken from `F8E5M2::MAX`, which is 49152 and one representable step low. E5M2 follows
