{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`FastDivmod::div_mod` matches on `self` only to run the same expression in both arms\n(`dividend - q * *divisor`), so the `match` produces two identical code paths for no reason (and the\n`Fallback` arm needlessly diverges in style from `modulo`, which uses `dividend % *divisor`).","fix":"Collapse the match:\n```rust\npub fn div_mod(&self, dividend: I) -> (I, I) {\n    let q = self.div(dividend);\n    let divisor = match self {\n        FastDivmod::Fast { divisor, .. } | FastDivmod::Fallback { divisor } => *divisor,\n    };\n    (q, dividend - q * divisor)\n}\n```","locations":[{"ref":"crates/cubecl-std/src/fast_math.rs:66-74","code":"   66 |     pub fn div_mod(&self, dividend: I) -> (I, I) {\n   67 |         let q = self.div(dividend);\n   68 |         let r = match self {\n   69 |             FastDivmod::Fast { divisor, .. } => dividend - q * *divisor,\n   70 |             FastDivmod::Fallback { divisor } => dividend - q * *divisor,\n   71 |         };\n   72 | \n   73 |         (q, r)\n   74 |     }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/fast_math.rs#L66-L74"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"On macOS `build.rs` emits `cargo:rustc-cfg=feature=\"vulkan-portability\"`, but `vulkan-portability`\nis not a feature of `cubecl-wgpu` — it is a `wgpu` feature, already enabled unconditionally in\n`crates/cubecl-wgpu/Cargo.toml:107` in the `wgpu` dependency's feature list. Nothing in the crate\nis gated on `cfg(feature = \"vulkan-portability\")`, so the line is dead and (because the feature is\nundeclared) triggers `unexpected_cfgs` warnings.","fix":"Delete the emission (the surrounding `is_macos` computation is still needed for the Vulkan SDK\ncheck):\n```rust\nlet is_macos = env::var(\"CARGO_CFG_TARGET_OS\").is_ok_and(|os| os == \"macos\");\n```","locations":[{"ref":"crates/cubecl-wgpu/build.rs:38-41","code":"   38 |     let is_macos = env::var(\"CARGO_CFG_TARGET_OS\").is_ok_and(|os| os == \"macos\");\n   39 |     if is_macos {\n   40 |         println!(\"cargo:rustc-cfg=feature=\\\"vulkan-portability\\\"\");\n   41 |     }","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/build.rs#L38-L41"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `wrap_index`, `idx.as_index().rem_euclid(size as isize)` is non-negative by definition\nof `rem_euclid` with a positive divisor (`size == 0` has already returned), so the\n`if wrapped < 0 { (wrapped + size as isize) as usize }` branch can never be taken. It reads\nas a defensive correction and hides the fact that the sign handling is already done.","fix":"Before:\n```rust\nlet wrapped = idx.as_index().rem_euclid(size as isize);\nif wrapped < 0 {\n    (wrapped + size as isize) as usize\n} else {\n    wrapped as usize\n}\n```\nAfter:\n```rust\n// `rem_euclid` with a positive modulus is always in `0..size`.\nidx.as_index().rem_euclid(size as isize) as usize\n```","locations":[{"ref":"crates/cubecl-zspace/src/indexing/wrapping.rs:150-165","code":"  150 | #[inline]\n  151 | #[must_use]\n  152 | pub fn wrap_index<I>(idx: I, size: usize) -> usize\n  153 | where\n  154 |     I: AsIndex,\n  155 | {\n  156 |     if size == 0 {\n  157 |         return 0; // Avoid modulo by zero\n  158 |     }\n  159 |     let wrapped = idx.as_index().rem_euclid(size as isize);\n  160 |     if wrapped < 0 {\n  161 |         (wrapped + size as isize) as usize\n  162 |     } else {\n  163 |         wrapped as usize\n  164 |     }\n  165 | }","lines":16,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-zspace/src/indexing/wrapping.rs#L150-L165"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`impl Drop for DeviceGuard` does nothing beyond what the compiler already does: assigning\n`self._guard_mutex = None` drops the `ReentrantMutexGuard`, which would be dropped anyway when the\nstruct's field is dropped a moment later. The hand-written `Drop` only adds a `Drop` impl to the\ntype (which suppresses field-by-field move-out and disables some niche optimizations) while giving\nthe false impression that release ordering is being controlled here.","fix":"Delete the impl:\n```rust\npub struct DeviceGuard<'a> {\n    _guard_mutex: Option<ReentrantMutexGuard<'a, DeviceStateMap>>,\n}\n```\nThe guard is released when `DeviceGuard` goes out of scope.","locations":[{"ref":"crates/cubecl-common/src/device/handle/reentrant.rs:100-104","code":"  100 | impl<'a> Drop for DeviceGuard<'a> {\n  101 |     fn drop(&mut self) {\n  102 |         self._guard_mutex = None;\n  103 |     }\n  104 | }","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/device/handle/reentrant.rs#L100-L104"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`ComptimeOptionExpand::__expand_len_method` is declared without `pub`, unlike every other\n`__expand_*_method` in the same `impl` block. Expanded kernel code lives outside this private module,\nso the method is unreachable and there is no `ComptimeOption::len` on the Rust side for it to back:\nit is simply dead.","fix":"Either delete the function or make it usable like its neighbours:\n```rust\npub fn __expand_len_method(&self, _scope: &Scope) -> usize {\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/comptime_option.rs:947-952","code":"  947 |             fn __expand_len_method(&self, _scope: &Scope) -> usize {\n  948 |                 match self {\n  949 |                     Some(_) => 1,\n  950 |                     None => 0,\n  951 |                 }\n  952 |             }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/comptime_option.rs#L947-L952"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`type ArrayExpand<E> = NativeExpand<Array<E>>;` in `slice/operator.rs` is never referenced anywhere\nin the file (the identical alias in `operation/assignation.rs` is the one used by\n`impl_slice_ranges!`). It produces an unused-type-alias warning under the workspace's\n`warnings = \"warn\"` lint setting.","fix":"Delete the line:\n\n```rust\n-type ArrayExpand<E> = NativeExpand<Array<E>>;\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/container/slice/operator.rs:29","code":"   29 | type ArrayExpand<E> = NativeExpand<Array<E>>;","lines":1,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/container/slice/operator.rs#L29"}]},
{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In the `Expr::Binary` handler the operator is parsed twice: `let operator = parse_binop(&binary.op)?;`\nat the top of the arm and then `operator: parse_binop(&binary.op)?` again when building\n`Expression::Binary`, discarding the already-computed value.","fix":"Reuse the local:\n```rust\nExpression::Binary {\n    left: Box::new(left),\n    operator,\n    right: Box::new(right),\n    span,\n}\n```","locations":[{"ref":"crates/cubecl-macros/src/parse/expression.rs:42-74","code":"   42 |             Expr::Binary(binary) => {\n   43 |                 let span = binary.span();\n   44 |                 let operator = parse_binop(&binary.op)?;\n   45 | \n   46 |                 let right = Self::from_expr(*binary.right, context)?;\n   47 |                 let left = if operator.is_assign() {\n   48 |                     Self::from_expr_lhs(*binary.left, context)?\n   49 |                 } else {\n   50 |                     Self::from_expr(*binary.left, context)?\n   51 |                 };\n   52 | \n   53 |                 // `is_const()` doesn't guarantee `as_const()` succeeds (e.g. a compiler\n   54 |                 // intrinsic), so fall back to runtime instead of unwrapping a `None`.\n   55 |                 let folded = if left.is_const() && right.is_const() {\n   56 |                     let left = left.as_const(context);\n   57 |                     let right = right.as_const(context);\n   58 |                     left.zip(right)\n   59 |                 } else {\n   60 |                     None\n   61 |                 };\n   62 |                 if let Some((left, right)) = folded {\n   63 |                     let op = binary.op;\n   64 |                     Expression::Verbatim {\n   65 |                         tokens: quote![(#left #op #right)],\n   66 |                     }\n   67 |                 } else {\n   68 |                     Expression::Binary {\n   69 |                         left: Box::new(left),\n   70 |                         operator: parse_binop(&binary.op)?,\n   71 |                         right: Box::new(right),\n   72 |                         span,\n   73 |                     }\n   74 |                 }","lines":33,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/expression.rs#L42-L74"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Two small redundancies in the memory pools and the profiling logger:\n\n* `ExclusiveMemoryPool::alloc_page` sets the padding twice: `let mut slice = Slice::new(storage,\n  padding);` already stores it (`Slice::new` assigns `padding`), and the next lines re-assign\n  `slice.padding = padding;` with a comment that only explains the `utilization` line above it.\n* `Profiled::update` guards a `split` that never needs guarding: `if name.contains(\"\\n\") {\n  name.split(\"\\n\").next().unwrap() } else { name }` — `split` always yields at least one item, so\n  the whole `if` reduces to the `then` branch.","fix":"Delete `slice.padding = padding;` (line 110), and simplify the logger to:\n\n```rust\nlet name = name.split('\\n').next().unwrap_or(name);\n```","locations":[{"ref":"crates/cubecl-runtime/src/memory_management/memory_pool/exclusive_pool.rs:130-136","code":"  130 |         let padding = calculate_padding(size, self.alignment);\n  131 |         let mut slice = Slice::new(storage, padding);\n  132 | \n  133 |         // Return a smaller part of the slice. By construction, we only ever\n  134 |         // get a page with a big enough size, so this is ok to do.\n  135 |         slice.storage.utilization = StorageUtilization { offset: 0, size };\n  136 |         slice.padding = padding;","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/memory_pool/exclusive_pool.rs#L130-L136"},{"ref":"crates/cubecl-runtime/src/logging/profiling.rs:38-43","code":"   38 |     pub fn update(&mut self, name: &String, duration: core::time::Duration) {\n   39 |         let name = if name.contains(\"\\n\") {\n   40 |             name.split(\"\\n\").next().unwrap()\n   41 |         } else {\n   42 |             name\n   43 |         };","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/logging/profiling.rs#L38-L43"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`RuntimeOptions::default` declares `DEFAULT_MAX_TASKS` twice, under `#[cfg(test)]` and\n`#[cfg(not(test))]`, with the *same* value `32`. The split suggests the test build\ndeliberately differs, which it does not, so a reader has to diff the two lines to discover\nthat they are identical.","fix":"Before:\n```rust\n#[cfg(test)]\nconst DEFAULT_MAX_TASKS: usize = 32;\n#[cfg(not(test))]\nconst DEFAULT_MAX_TASKS: usize = 32;\n```\nAfter:\n```rust\nconst DEFAULT_MAX_TASKS: usize = 32;\n```","locations":[{"ref":"crates/cubecl-wgpu/src/runtime.rs:170-182","code":"  170 | impl Default for RuntimeOptions {\n  171 |     fn default() -> Self {\n  172 |         #[cfg(test)]\n  173 |         const DEFAULT_MAX_TASKS: usize = 32;\n  174 |         #[cfg(not(test))]\n  175 |         const DEFAULT_MAX_TASKS: usize = 32;\n  176 | \n  177 |         let tasks_max = match std::env::var(\"CUBECL_WGPU_MAX_TASKS\") {\n  178 |             Ok(value) => value\n  179 |                 .parse::<usize>()\n  180 |                 .expect(\"CUBECL_WGPU_MAX_TASKS should be a positive integer.\"),\n  181 |             Err(_) => DEFAULT_MAX_TASKS,\n  182 |         };","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/runtime.rs#L170-L182"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"The `Arena` type documentation describes a freeness protocol the code does not implement. It says\nallocations \"scan from an internal cursor to find a free slot ... looking for a slot whose reference\ncount is zero\" and that \"A separate `AtomicU32` reference count tracks logical ownership\nindependently of the `Arc` strong count, **so the arena can reliably detect which slots are free**\".\n`reserve` in fact tests `Arc::strong_count(item) == 1` and unconditionally overwrites `ref_counts[i]`\nwith `store(1, ...)`, and the comment inside `ReservedMemory::drop` states the opposite of the type\ndoc: \"The arena never touches `ref_count`; slot freeness is tracked via `Arc::strong_count` on the\nbacking buffer instead.\" A reader who trusts the type-level doc will assume `ref_counts` is what\ngates reuse and can \"fix\" the wrong side of the protocol.","fix":"Rewrite the type doc to match the code: freeness is decided by `Arc::strong_count(slot) == 1`, and\n`ref_counts` only counts live `ReservedMemory` clones so the destructor fires once. Suggested\nreplacement for the last paragraph of the `# How It Works` section:\n```text\n/// A slot is considered free when its backing `Arc` has a strong count of 1 (only the arena holds\n/// it). The separate `AtomicU32` is *not* used for that decision: it counts live `ReservedMemory`\n/// clones so the stored object's destructor runs exactly once.\n```","locations":[{"ref":"crates/cubecl-common/src/arena.rs:32-45","code":"   32 | /// # How It Works\n   33 | ///\n   34 | /// The arena maintains a vector of reference-counted buffer slots. When a\n   35 | /// caller requests memory, the arena advances its cursor through the pool\n   36 | /// looking for a slot whose reference count is zero, then hands back a\n   37 | /// [`Bytes`] handle to that slot. The cursor wraps around, giving the\n   38 | /// allocation pattern its circular behavior.\n   39 | ///\n   40 | /// Because a `Bytes` handle can outlive the `Arena` itself (e.g. when the\n   41 | /// owning thread exits but the handle was sent elsewhere), each slot is\n   42 | /// wrapped in an `Arc` to keep the underlying storage alive. A separate\n   43 | /// `AtomicU32` reference count tracks logical ownership independently of\n   44 | /// the `Arc` strong count, so the arena can reliably detect which slots\n   45 | /// are free.","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/arena.rs#L32-L45"},{"ref":"crates/cubecl-common/src/arena.rs:284-288","code":"  284 |             if Arc::strong_count(item) == 1 {\n  285 |                 self.cursor = (i + 1) % MAX_ITEM_COUNT;\n  286 |                 let data = item.clone();\n  287 |                 let ref_count = self.ref_counts[i].clone();\n  288 |                 ref_count.store(1, Ordering::Release);","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/arena.rs#L284-L288"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"`tf32::from_f32`'s documentation promises a lossy conversion - \"This operation is lossy ... All other\nvalues are truncated and rounded to the nearest representable value\" - but the body is\n`tf32(value)`, a bit-for-bit move of the `f32`. Nothing is truncated to tf32's 10 mantissa bits, so\n`tf32::from_f32(x).to_f32() == x` for every `x`. `from_f64` has the same doc while only doing\n`value as f32`. Anyone relying on the documented rounding (e.g. to reproduce GPU tf32 results on the\nCPU, or to test precision loss) gets full `f32` precision instead.","fix":"Either implement the documented truncation:\n```rust\npub const fn from_f32(value: f32) -> tf32 {\n    // tf32 keeps 10 mantissa bits; round-to-nearest-even on the dropped 13 bits.\n    let bits = value.to_bits();\n    let rounded = (bits + 0x0FFF + ((bits >> 13) & 1)) & 0xFFFF_E000;\n    tf32(f32::from_bits(rounded))\n}\n```\nor correct the doc to say the value is stored at full `f32` precision and the truncation happens on\nthe device.","locations":[{"ref":"crates/cubecl-common/src/float/tensor_float.rs:27-48","code":"   27 |     /// Constructs a [`tf32`] value from a 32-bit floating point value.\n   28 |     ///\n   29 |     /// This operation is lossy. If the 32-bit value is too large to fit, ±∞ will result. NaN values\n   30 |     /// are preserved. Subnormal values that are too tiny to be represented will result in ±0. All\n   31 |     /// other values are truncated and rounded to the nearest representable value.\n   32 |     #[inline]\n   33 |     #[must_use]\n   34 |     pub const fn from_f32(value: f32) -> tf32 {\n   35 |         tf32(value)\n   36 |     }\n   37 | \n   38 |     /// Constructs a [`tf32`] value from a 64-bit floating point value.\n   39 |     ///\n   40 |     /// This operation is lossy. If the 64-bit value is to large to fit, ±∞ will result. NaN values\n   41 |     /// are preserved. 64-bit subnormal values are too tiny to be represented and result in ±0.\n   42 |     /// Exponents that underflow the minimum exponent will result in subnormals or ±0. All other\n   43 |     /// values are truncated and rounded to the nearest representable value.\n   44 |     #[inline]\n   45 |     #[must_use]\n   46 |     pub const fn from_f64(value: f64) -> tf32 {\n   47 |         tf32(value as f32)\n   48 |     }","lines":22,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/tensor_float.rs#L27-L48"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`mean_duration` is documented as \"Returns the median duration among all durations\" while it computes\nthe arithmetic mean (`self.durations.iter().sum::<Duration>() / len`). The median is computed\nelsewhere, in `min_max_median_durations`, so the stale doc actively mislabels which statistic the\ncaller gets.","fix":"Change the doc comment to `/// Returns the mean duration among all durations`.","locations":[{"ref":"crates/cubecl-common/src/benchmark.rs:44-47","code":"   44 |     /// Returns the median duration among all durations\n   45 |     pub(crate) fn mean_duration(&self) -> Duration {\n   46 |         self.durations.iter().sum::<Duration>() / self.durations.len() as u32\n   47 |     }","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/benchmark.rs#L44-L47"}]},

{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`wait_for_device_shutdown` waits for `SHUTDOWN_JOIN_TIMEOUT * 2` (60s) - the doubling is deliberate\nand documented on the function - but the warning it emits interpolates the undoubled constant:\n`\"A concurrent shutdown of {device_id:?} is still in flight after {SHUTDOWN_JOIN_TIMEOUT:?}\"`. The\nlog therefore reports 30s when 60s elapsed, which will mislead anyone diagnosing a hung shutdown.","fix":"Name the doubled value once and use it in both places:\n```rust\nconst WAIT: Duration = SHUTDOWN_JOIN_TIMEOUT.saturating_mul(2);\n...\nif start.elapsed() >= WAIT {\n    log::warn!(\"A concurrent shutdown of {device_id:?} is still in flight after {WAIT:?}, returning anyway.\");\n    return;\n}\n```","locations":[{"ref":"crates/cubecl-common/src/device/handle/channel.rs:599-605","code":"  599 |         if start.elapsed() >= SHUTDOWN_JOIN_TIMEOUT * 2 {\n  600 |             log::warn!(\n  601 |                 \"A concurrent shutdown of {device_id:?} is still in flight after \\\n  602 |                  {SHUTDOWN_JOIN_TIMEOUT:?}, returning anyway.\"\n  603 |             );\n  604 |             return;\n  605 |         }","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/device/handle/channel.rs#L599-L605"}]},

{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comments on `Numeric::from_int` / `Numeric::from_int_128` state \"This method panics when\nunexpanded\", but the bodies are `<Self as NumCast>::from(val).unwrap()` — they do *not* panic when\nunexpanded, they return a converted value (and panic only when the value is out of range for the\ntarget type, e.g. `u8::from_int(300)`). The same stale comment was copied verbatim onto\n`Vector::from_int`, whose body is `Self::new(P::from_int(val))`.","fix":"Replace the sentence \"This method panics when unexpanded.\" with what actually happens, e.g.\n\"Panics if `val` is not representable in `Self`.\" and use an explicit message:\n\n```rust\nfn from_int(val: i64) -> Self {\n    <Self as NumCast>::from(val).expect(\"`val` must be representable in this numeric type\")\n}\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/element/numeric.rs:51-74","code":"   51 |     /// Create a new constant numeric.\n   52 |     ///\n   53 |     /// Note: since this must work for both integer and float\n   54 |     /// only the less expressive of both can be created (int)\n   55 |     /// If a number with decimals is needed, use `Float::new`.\n   56 |     ///\n   57 |     /// This method panics when unexpanded. For creating an element\n   58 |     /// with a val, use the new method of the sub type.\n   59 |     fn from_int(val: i64) -> Self {\n   60 |         <Self as NumCast>::from(val).unwrap()\n   61 |     }\n   62 | \n   63 |     /// Create a new constant numeric. Uses `i128` to be able to represent both signed integers, and\n   64 |     /// `u64::MAX`.\n   65 |     ///\n   66 |     /// Note: since this must work for both integer and float\n   67 |     /// only the less expressive of both can be created (int)\n   68 |     /// If a number with decimals is needed, use `Float::new`.\n   69 |     ///\n   70 |     /// This method panics when unexpanded. For creating an element\n   71 |     /// with a val, use the new method of the sub type.\n   72 |     fn from_int_128(val: i128) -> Self {\n   73 |         <Self as NumCast>::from(val).unwrap()\n   74 |     }","lines":24,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/numeric.rs#L51-L74"},{"ref":"crates/cubecl-core/src/frontend/container/vector/base.rs:165-175","code":"  165 |         /// Create a new constant numeric.\n  166 |         ///\n  167 |         /// Note: since this must work for both integer and float\n  168 |         /// only the less expressive of both can be created (int)\n  169 |         /// If a number with decimals is needed, use `Float::new`.\n  170 |         ///\n  171 |         /// This method panics when unexpanded. For creating an element\n  172 |         /// with a val, use the new method of the sub type.\n  173 |         pub fn from_int(val: i64) -> Self {\n  174 |             Self::new(P::from_int(val))\n  175 |         }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/container/vector/base.rs#L165-L175"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Both WMMA capability tables label the members of an `(a_type, b_type, cd_type)` tuple as the matrix\n*dimensions*:\n```rust\nlet types = vec![\n    (\n        gpu::ElemType::Float(gpu::FloatKind::F16), // m\n        gpu::ElemType::Float(gpu::FloatKind::F16), // n\n        gpu::ElemType::Float(gpu::FloatKind::F32), // k\n    ),\n```\nThe tuple is destructured a few lines below as `|(a, b, cd)| MmaConfig { a_type: a.into(), ... }`\nwith `m`, `n`, `k` hard-coded to `16`, so the `// m`, `// n`, `// k` comments are simply wrong and\nactively mislead anyone adding a combination (the same mislabelling is what went wrong in\n`RocWmmaCompiler::supported_wmma_combinations`).","fix":"Relabel them:\n```rust\ngpu::ElemType::Float(gpu::FloatKind::F16), // a\ngpu::ElemType::Float(gpu::FloatKind::F16), // b\ngpu::ElemType::Float(gpu::FloatKind::F32), // cd\n```","locations":[{"ref":"crates/cubecl-cpp/src/cuda/mma/ptx_wmma_compiler.rs:332-348","code":"  332 |         let types = vec![\n  333 |             (\n  334 |                 gpu::ElemType::Float(gpu::FloatKind::F16), // m\n  335 |                 gpu::ElemType::Float(gpu::FloatKind::F16), // n\n  336 |                 gpu::ElemType::Float(gpu::FloatKind::F16), // k\n  337 |             ),\n  338 |             (\n  339 |                 gpu::ElemType::Float(gpu::FloatKind::F16),\n  340 |                 gpu::ElemType::Float(gpu::FloatKind::F16),\n  341 |                 gpu::ElemType::Float(gpu::FloatKind::F32),\n  342 |             ),\n  343 |             (\n  344 |                 gpu::ElemType::Float(gpu::FloatKind::BF16),\n  345 |                 gpu::ElemType::Float(gpu::FloatKind::BF16),\n  346 |                 gpu::ElemType::Float(gpu::FloatKind::F32),\n  347 |             ),\n  348 |         ];","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cpp/src/cuda/mma/ptx_wmma_compiler.rs#L332-L348"},{"ref":"crates/cubecl-cpp/src/cuda/mma/ptx_wmma_compiler.rs:332-348","code":"  332 |         let types = vec![\n  333 |             (\n  334 |                 gpu::ElemType::Float(gpu::FloatKind::F16), // m\n  335 |                 gpu::ElemType::Float(gpu::FloatKind::F16), // n\n  336 |                 gpu::ElemType::Float(gpu::FloatKind::F16), // k\n  337 |             ),\n  338 |             (\n  339 |                 gpu::ElemType::Float(gpu::FloatKind::F16),\n  340 |                 gpu::ElemType::Float(gpu::FloatKind::F16),\n  341 |                 gpu::ElemType::Float(gpu::FloatKind::F32),\n  342 |             ),\n  343 |             (\n  344 |                 gpu::ElemType::Float(gpu::FloatKind::BF16),\n  345 |                 gpu::ElemType::Float(gpu::FloatKind::BF16),\n  346 |                 gpu::ElemType::Float(gpu::FloatKind::F32),\n  347 |             ),\n  348 |         ];","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cpp/src/cuda/mma/ptx_wmma_compiler.rs#L332-L348"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`RuntimeConfig::save_default` does not save the default configuration, and has a side effect its\ndocumentation does not mention.\n\n```rust\n/// Save the default configuration to the provided file path.\n#[cfg(std_io)]\nfn save_default<P: AsRef<std::path::Path>>(path: P) -> std::io::Result<()> {\n    use std::io::Write;\n\n    let config = Self::get();\n    ...\n}\n```\n\n`Self::get()` returns the *current* configuration: on first call it loads `cubecl.toml` from the\ncurrent directory or a parent, applies `override_from_env`, and installs the result in the global\nsingleton. So `save_default` writes whatever was found on disk plus environment overrides — not the\n`Default` value the name and doc promise. Worse, because `get()` installs the singleton, calling\n`save_default` early makes every subsequent `RuntimeConfig::set` panic (\"Cannot set the\nconfiguration multiple times\") and every `try_set` return `false`, which is the opposite of what a\n\"dump a starter config file\" helper should do.","fix":"Serialize `Self::default()` and leave the singleton alone:\n\n```rust\n fn save_default<P: AsRef<std::path::Path>>(path: P) -> std::io::Result<()> {\n     use std::io::Write;\n\n-    let config = Self::get();\n-    let content = toml::to_string_pretty(config.as_ref()).expect(\"Default config should be serializable\");\n+    // Deliberately not `Self::get()`: that loads and installs the singleton,\n+    // which would lock out a later `set`.\n+    let config = Self::default();\n+    let content = toml::to_string_pretty(&config).expect(\"Default config should be serializable\");\n     let mut file = std::fs::File::create(path)?;\n     file.write_all(content.as_bytes())?;\n\n     Ok(())\n }\n```\n\nIf dumping the *effective* configuration is the intent, rename it to `save_current` and document\nthat it initializes the singleton.","locations":[{"ref":"crates/cubecl-environment/src/config/mod.rs:150-162","code":"  150 |     /// Save the default configuration to the provided file path.\n  151 |     #[cfg(std_io)]\n  152 |     fn save_default<P: AsRef<std::path::Path>>(path: P) -> std::io::Result<()> {\n  153 |         use std::io::Write;\n  154 | \n  155 |         let config = Self::get();\n  156 |         let content =\n  157 |             toml::to_string_pretty(config.as_ref()).expect(\"Default config should be serializable\");\n  158 |         let mut file = std::fs::File::create(path)?;\n  159 |         file.write_all(content.as_bytes())?;\n  160 | \n  161 |         Ok(())\n  162 |     }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/config/mod.rs#L150-L162"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Two stale docs around the pool-size configuration:\n\n* `config/mod.rs` declares the module as \"Human-readable byte sizes for config files\", but\n  `MemorySize` is a plain `pub struct MemorySize(pub u64)` with no `Serialize`/`Deserialize` and no\n  parsing at all, and pool sizes are deliberately *not* config-file settings — `MemoryConfig` uses\n  `#[serde(deny_unknown_fields)]` and `pools_rejected_in_config_files` asserts that\n  `page_size = \"1MiB\"` in a file is a load error.\n* `FlushingPolicy`'s doc says \"Set a field to `u32::MAX` / `usize::MAX` to effectively disable it\",\n  but both fields (`max_bytes_count`, `max_bytes_size`) are `u32`; there is no `usize` field.","fix":"```rust\n/// Byte sizes for programmatic pool layouts.\npub mod size;\n```\nand for the policy: \"Set a field to `u32::MAX` to effectively disable it.\"","locations":[{"ref":"crates/cubecl-runtime/src/config/mod.rs:16-17","code":"   16 | /// Human-readable byte sizes for config files.\n   17 | pub mod size;","lines":2,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/config/mod.rs#L16-L17"},{"ref":"crates/cubecl-runtime/src/config/size.rs:1-13","code":"    1 | /// A byte count.\n    2 | ///\n    3 | /// A thin newtype over `u64` so pool settings like `page_size` are\n    4 | /// unambiguously in bytes at the type level.\n    5 | #[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash)]\n    6 | pub struct MemorySize(pub u64);\n    7 | \n    8 | impl MemorySize {\n    9 |     /// The size in bytes.\n   10 |     pub const fn bytes(self) -> u64 {\n   11 |         self.0\n   12 |     }\n   13 | }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/config/size.rs#L1-L13"},{"ref":"crates/cubecl-runtime/src/memory_management/drop_queue/policy.rs:3-14","code":"    3 | /// Defines the thresholds that determine when a [`PendingDropQueue`] should be\n    4 | /// flushed.\n    5 | ///\n    6 | /// A flush is triggered when **either** limit is exceeded — whichever comes\n    7 | /// first. Set a field to `u32::MAX` / `usize::MAX` to effectively disable it.\n    8 | #[derive(Debug)]\n    9 | pub struct FlushingPolicy {\n   10 |     /// Flush when this many allocations have been staged.\n   11 |     pub max_bytes_count: u32,\n   12 |     /// Flush when the total staged size reaches this many bytes.\n   13 |     pub max_bytes_size: u32,\n   14 | }","lines":12,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/drop_queue/policy.rs#L3-L14"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `build_pools`, the `SubSlices` preset pushes a pool with the comment \"Add in a pool for allocations\nthat are smaller than the min alignment, as they can't use offsets at all (on wgpu at least)\", but the\npool is created with `PoolType::ExclusivePages { max_alloc_size: 0 }` and\n`ExclusiveMemoryPool::accept` is `self.max_alloc_size >= size`. Only `size == 0` is accepted, so a\n4-byte allocation on a device with a 256-byte alignment is *not* routed here — it falls through to a\nsliced pool, i.e. exactly the offset-bound sub-slice the comment says must be avoided.\n`MemoryPoolConfig::Exclusive::max_alloc_size` documents the same value correctly (\"`0` is valid: it\nmakes a pool dedicated to zero-sized (sub-alignment) allocations\"), so the two comments contradict\neach other.","fix":"If the intent is a zero-size pool, say so:\n\n```rust\n// A dedicated pool for zero-sized allocations, which can't be sub-sliced at all.\npools.push(MemoryPoolOptions {\n    pool_type: PoolType::ExclusivePages { max_alloc_size: 0 },\n    dealloc_period: None,\n});\n```\nIf sub-alignment allocations really must get their own page, the bound has to be\n`max_alloc_size: memory_alignment - 1`.","locations":[{"ref":"crates/cubecl-runtime/src/memory_management/memory_manage.rs:594-601","code":"  594 |             const MB: u64 = 1024 * 1024;\n  595 | \n  596 |             // Add in a pool for allocations that are smaller than the min alignment,\n  597 |             // as they can't use offsets at all (on wgpu at least).\n  598 |             pools.push(MemoryPoolOptions {\n  599 |                 pool_type: PoolType::ExclusivePages { max_alloc_size: 0 },\n  600 |                 dealloc_period: None,\n  601 |             });","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/memory_manage.rs#L594-L601"},{"ref":"crates/cubecl-runtime/src/memory_management/memory_pool/exclusive_pool.rs:153-155","code":"  153 |     fn accept(&self, size: u64) -> bool {\n  154 |         self.max_alloc_size >= size\n  155 |     }","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/memory_pool/exclusive_pool.rs#L153-L155"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`ExclusiveMemoryPool::get_free_page` is documented as \"Finds a free page that can contain the given\nsize\", and the body's own comment claims \"Return the smallest free page that fits\", but the selection\nkey is the reuse counter, not the size: `.min_by_key(|page| page.free_count)`. The function therefore\nreturns the *least recently reused* fitting page, which can be a 256 MiB page serving a 1 KiB request\nwhile a 2 KiB page sits free. The comment hides a real fragmentation behavior from anyone reading the\nallocator.","fix":"Either fix the comment to state what is selected — `// Return the least-recently-reused fitting page\n(keeps hot pages hot).` — or make the code match the comment:\n\n```rust\n.min_by_key(|page| (page.alloc_size, page.free_count))\n```","locations":[{"ref":"crates/cubecl-runtime/src/memory_management/memory_pool/exclusive_pool.rs:109-117","code":"  109 |     /// Finds a free page that can contain the given size\n  110 |     /// Returns a slice on that page if successful.\n  111 |     fn get_free_page(&mut self, size: u64) -> Option<&mut MemoryPage> {\n  112 |         // Return the smallest free page that fits.\n  113 |         self.pages\n  114 |             .iter_mut()\n  115 |             .filter(|page| page.alloc_size >= size && page.slice.is_free())\n  116 |             .min_by_key(|page| page.free_count)\n  117 |     }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/memory_pool/exclusive_pool.rs#L109-L117"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`PoolType::ExclusivePages::max_alloc_size` is documented as \"The minimum number of bytes to allocate\nin this pool\", which is the opposite of what the field means. `ExclusiveMemoryPool::accept` is\n`self.max_alloc_size >= size` and `ExclusiveMemoryPool::alloc` rejects with `IoError::BufferTooBig`\nwhen `size > self.max_alloc_size`: it is the *largest* allocation the pool accepts. Since\n`MemoryManagement::reserve` routes an allocation to the first pool that accepts it, a reader who\nbelieves the doc will order a custom `pool_options` list backwards and send every allocation to the\nfirst (smallest) pool.","fix":"```rust\n/// Use a memory where every allocation is a separate page.\nExclusivePages {\n    /// The largest allocation, in bytes, this pool accepts.\n    max_alloc_size: u64,\n},\n```","locations":[{"ref":"crates/cubecl-runtime/src/memory_management/mod.rs:23-28","code":"   23 | pub enum PoolType {\n   24 |     /// Use a memory where every allocation is a separate page.\n   25 |     ExclusivePages {\n   26 |         /// The minimum number of bytes to allocate in this pool.\n   27 |         max_alloc_size: u64,\n   28 |     },","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/mod.rs#L23-L28"},{"ref":"crates/cubecl-runtime/src/memory_management/memory_pool/exclusive_pool.rs:153-155","code":"  153 |     fn accept(&self, size: u64) -> bool {\n  154 |         self.max_alloc_size >= size\n  155 |     }","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/memory_pool/exclusive_pool.rs#L153-L155"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`TuneCache::fastest` contains a stale comment and a redundant re-match. The comment\n\"Pending: clone the receiver so the caller can subscribe to the in-flight tune\" describes behaviour\nthat does not exist - nothing is cloned and `TuneCacheResult::Pending` carries no receiver (its own\ndoc even says callers \"fall through to running the operation rather than blocking on the in-flight\njob\"). The `let CacheEntry::Pending = val else { unreachable!() };` below it is dead: `CacheEntry` has\nexactly two variants and the enclosing `let ... else` already established the value is not `Done`.","fix":"Collapse it to\n```rust\nlet CacheEntry::Done { checksum, fastest_index } = val else {\n    // A tune is in flight; the caller runs the operation itself rather than waiting.\n    return TuneCacheResult::Pending;\n};\n```","locations":[{"ref":"crates/cubecl-runtime/src/tune/tune_cache.rs:201-211","code":"  201 |         let CacheEntry::Done {\n  202 |             checksum,\n  203 |             fastest_index,\n  204 |         } = val\n  205 |         else {\n  206 |             // Pending: clone the receiver so the caller can subscribe to the in-flight tune.\n  207 |             let CacheEntry::Pending = val else {\n  208 |                 unreachable!()\n  209 |             };\n  210 |             return TuneCacheResult::Pending;\n  211 |         };","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/tune/tune_cache.rs#L201-L211"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`ViewOperations::as_linear_slice` and `ViewOperationsMut::as_linear_slice_mut` declare their second\nparameter as `size: C` and document \"Create a slice starting from `pos`, with `size`\". Every\nimplementation treats it as an *inclusive end* instead: `slice.rs` names it `end` and does\n`let end = end.__expand_add_method(scope, 1usize.into_expand(scope));` to convert to an exclusive\nend, and the only caller, `View::as_linear_slice`, passes `end = max(shape, 1) - 1` with the comment\n\"Inclusive end so clamping works correctly\". A caller who trusts the trait doc and passes a length\nwill read the wrong region.","fix":"Rename the parameter and fix the doc to match every implementation:\n```rust\n/// Create a linear slice spanning `pos..=end` (inclusive end, so that clamping of\n/// zero-sized dimensions works).\n/// The layout handles translation into concrete indices.\n#[allow(unused)]\nfn as_linear_slice(&self, pos: C, end: C) -> &[T] {\n    unexpanded!()\n}\n```","locations":[{"ref":"crates/cubecl-std/src/tensor/view/operations/base.rs:36-41","code":"   36 |     /// Create a slice starting from `pos`, with `size`.\n   37 |     /// The layout handles translation into concrete indices.\n   38 |     #[allow(unused)]\n   39 |     fn as_linear_slice(&self, pos: C, size: C) -> &[T] {\n   40 |         unexpanded!()\n   41 |     }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/view/operations/base.rs#L36-L41"},{"ref":"crates/cubecl-std/src/tensor/view/operations/base.rs:75-80","code":"   75 |     /// Create a mutable slice starting from `pos`, with `size`.\n   76 |     /// The layout handles translation into concrete indices.\n   77 |     #[allow(unused)]\n   78 |     fn as_linear_slice_mut(&self, pos: C, size: C) -> &mut [T] {\n   79 |         unexpanded!()\n   80 |     }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/view/operations/base.rs#L75-L80"},{"ref":"crates/cubecl-std/src/tensor/view/operations/slice.rs:49-61","code":"   49 |     fn __expand_as_linear_slice_method(\n   50 |         &self,\n   51 |         scope: &Scope,\n   52 |         pos: NativeExpand<usize>,\n   53 |         end: NativeExpand<usize>,\n   54 |     ) -> &SliceExpand<T> {\n   55 |         // Convert to exclusive end\n   56 |         let end = end.__expand_add_method(scope, 1usize.into_expand(scope));\n   57 |         // Handling for shapes that are 0 in at least one dim, ensures the slice is not\n   58 |         // negative length.\n   59 |         let start = clamp_max::expand(scope, pos, end);\n   60 |         <Self as SliceOperatorExpand<T>>::__expand_slice_method(self, scope, start, end)\n   61 |     }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/view/operations/slice.rs#L49-L61"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment above `let epoch_instant = Instant::now();` in `QueryProfiler::new` says\n\"Guesstimate by saying the rendesvouz time is twice the submission time.\" - no such\nguesstimate exists in the code; the instant is taken verbatim. The comment also misspells\n\"rendezvous\" (it is spelled correctly one line above). A reader looking for the claimed\ncorrection wastes time on code that never had it.","fix":"Before:\n```rust\n// Measure CPU timestamp to go along GPU timestamp.\n// This can't be 100% correct as this includes the time to rendezvous the GPU timestamp.\n// Guesstimate by saying the rendesvouz time is twice the submission time.\nlet epoch_instant = Instant::now();\n```\nAfter:\n```rust\n// CPU anchor for the GPU epoch tick above. Not exact: it also covers the rendezvous\n// with the GPU timestamp, which is not corrected for.\nlet epoch_instant = Instant::now();\n```","locations":[{"ref":"crates/cubecl-wgpu/src/compute/timings.rs:278-281","code":"  278 |         // Measure CPU timestamp to go along GPU timestamp.\n  279 |         // This can't be 100% correct as this includes the time to rendezvous the GPU timestamp.\n  280 |         // Guesstimate by saying the rendesvouz time is twice the submission time.\n  281 |         let epoch_instant = Instant::now();","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/timings.rs#L278-L281"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Two user-facing messages name the wrong thing.\n`get_device_override` reads `CUBECL_WGPU_DEFAULT_DEVICE` but warns\n`\"Unknown CUBECL_WGPU_DEVICE override {var}\"`, sending users to look for a variable that\ndoes not exist. `request_adapter_with_preference` panics with\n`.expect(\"No possible adapter available for backend. Falling back to first available.\")`,\nwhich claims a fallback that does not happen - the process aborts. (The same class of\nmistake appears in `AutoGraphicsApi::backend`, whose error text names\n`GRAPHICS_BACKEND` while the variable read is `AUTO_GRAPHICS_BACKEND`.)","fix":"```rust\nlog::warn!(\"Unknown CUBECL_WGPU_DEFAULT_DEVICE override {var}\");\n```\n```rust\n.expect(\"No possible adapter available for backend\")\n```\n```rust\neprintln!(\"Invalid graphics backend specified in AUTO_GRAPHICS_BACKEND environment variable\");\n```","locations":[{"ref":"crates/cubecl-wgpu/src/runtime.rs:612-643","code":"  612 | fn get_device_override() -> Option<WgpuDevice> {\n  613 |     // If BestAvailable, check if we should instead construct as\n  614 |     // if a specific device was specified.\n  615 |     std::env::var(\"CUBECL_WGPU_DEFAULT_DEVICE\")\n  616 |         .ok()\n  617 |         .and_then(|var| {\n  618 |             let override_device = if let Some(inner) = var.strip_prefix(\"DiscreteGpu(\") {\n  619 |                 inner\n  620 |                     .strip_suffix(\")\")\n  621 |                     .and_then(|s| s.parse().ok())\n  622 |                     .map(WgpuDevice::DiscreteGpu)\n  623 |             } else if let Some(inner) = var.strip_prefix(\"IntegratedGpu(\") {\n  624 |                 inner\n  625 |                     .strip_suffix(\")\")\n  626 |                     .and_then(|s| s.parse().ok())\n  627 |                     .map(WgpuDevice::IntegratedGpu)\n  628 |             } else if let Some(inner) = var.strip_prefix(\"VirtualGpu(\") {\n  629 |                 inner\n  630 |                     .strip_suffix(\")\")\n  631 |                     .and_then(|s| s.parse().ok())\n  632 |                     .map(WgpuDevice::VirtualGpu)\n  633 |             } else if var == \"Cpu\" {\n  634 |                 Some(WgpuDevice::Cpu)\n  635 |             } else {\n  636 |                 None\n  637 |             };\n  638 | \n  639 |             if override_device.is_none() {\n  640 |                 log::warn!(\"Unknown CUBECL_WGPU_DEVICE override {var}\");\n  641 |             }\n  642 |             override_device\n  643 |         })","lines":32,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/runtime.rs#L612-L643"},{"ref":"crates/cubecl-wgpu/src/runtime.rs:535-548","code":"  535 | async fn request_adapter_with_preference(\n  536 |     instance: &wgpu::Instance,\n  537 |     power_preference: wgpu::PowerPreference,\n  538 | ) -> wgpu::Adapter {\n  539 |     instance\n  540 |         .request_adapter(&RequestAdapterOptions {\n  541 |             power_preference,\n  542 |             force_fallback_adapter: false,\n  543 |             compatible_surface: None,\n  544 |             ..RequestAdapterOptions::default()\n  545 |         })\n  546 |         .await\n  547 |         .expect(\"No possible adapter available for backend. Falling back to first available.\")\n  548 | }","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/runtime.rs#L535-L548"},{"ref":"crates/cubecl-wgpu/src/graphics.rs:74-88","code":"   74 |         if let Ok(backend_str) = std::env::var(\"AUTO_GRAPHICS_BACKEND\") {\n   75 |             match backend_str.to_lowercase().as_str() {\n   76 |                 \"metal\" => return Backend::Metal,\n   77 |                 \"vulkan\" => return Backend::Vulkan,\n   78 |                 \"dx12\" => return Backend::Dx12,\n   79 |                 \"opengl\" => return Backend::Gl,\n   80 |                 \"webgpu\" => return Backend::BrowserWebGpu,\n   81 |                 _ => {\n   82 |                     eprintln!(\n   83 |                         \"Invalid graphics backend specified in GRAPHICS_BACKEND environment \\\n   84 |                          variable\"\n   85 |                     );\n   86 |                     std::process::exit(1);\n   87 |                 }\n   88 |             }","lines":15,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/graphics.rs#L74-L88"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `metadata` module doc closes its layout sketch with `where `Vec` isn't an actual `Vec`, just a\ndynamically sized series of values.`, but the sketch above contains no `Vec` at all - the dynamically\nsized members are spelled `shapes: [usize]` and `strides: [usize]`. The sentence refers to a previous\nrevision of the snippet.","fix":"Point the sentence at the members that exist, e.g.\n`where the unsized `[usize]` members are not real slices, just a dynamically sized series of values.`","locations":[{"ref":"crates/cubecl-core/src/codegen/metadata.rs:14-21","code":"   14 | //! struct ExtendedMeta<const N: usize> {\n   15 | //!     shape_offsets: [usize; N],\n   16 | //!     stride_offsets: [usize; N],\n   17 | //!     shapes: [usize],\n   18 | //!     strides: [usize]\n   19 | //! }\n   20 | //! ```\n   21 | //! where `Vec` isn't an actual `Vec`, just a dynamically sized series of values.","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/codegen/metadata.rs#L14-L21"}]},
{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The expand function for `copy` carries the doc comment \"The expand function for [`copy_bulk()`]\",\ncopied from the `copy_bulk` module above it. Additionally, both `copy_bulk` and `copy` have empty\nbodies (`{}`) instead of `unexpanded!()` as every other frontend intrinsic in this slice does, so\ncalling them from non-kernel code silently does nothing instead of reporting the misuse.","fix":"```rust\n-    /// The expand function for [`copy_bulk()`]\n+    /// The expand function for [`copy()`]\n```\n\nand make the host-side stubs fail loudly: `pub fn copy<C: CubePrimitive>(_from: &C, _to: &mut C) { unexpanded!() }`.","locations":[{"ref":"crates/cubecl-core/src/frontend/operation/copy_op.rs:59-64","code":"   59 |     /// The expand function for [`copy_bulk()`]\n   60 |     pub fn expand<C: CubePrimitive>(\n   61 |         scope: &Scope,\n   62 |         from: &NativeExpand<C>,\n   63 |         to: &mut NativeExpand<C>,\n   64 |     ) {","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/operation/copy_op.rs#L59-L64"},{"ref":"crates/cubecl-core/src/frontend/operation/copy_op.rs:15","code":"   15 | pub fn copy_bulk<C: CubePrimitive>(_from: &[C], _to: &mut [C], _length: usize) {}","lines":1,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/operation/copy_op.rs#L15"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`copy_gpu_ref` and `into_contiguous_packed_ref` share ~35 lines of near-identical launch setup (num_elems,\nvector size, SM count, `CubeDim::new`, the `match num_vecs / simul_vecs` ladder, `num_elems_per_unit`, the\n`while !last_dim.is_multiple_of(..)` halving loop, address type, cube count). The two copies have already\ndrifted: `copy_gpu_ref` halves **both** `elems_per_unit` and `num_elems_per_unit` in the loop and passes\n`elems_per_unit` to the kernel, while `into_contiguous_packed_ref` halves only `num_elems_per_unit` and\npasses that. Any future fix to the occupancy heuristic has to be made twice, and the divergent units are an\neasy source of an off-by-`vector_size` bug.","fix":"Extract the shared computation, e.g.\n```rust\nstruct CopyLaunchPlan { vector_size: VectorSize, elems_per_unit: usize, num_elems_per_unit: usize, cube_dim: CubeDim, cube_count: CubeCount }\n\nfn plan_copy<R: Runtime>(client: &ComputeClient<R>, num_elems: usize, vector_size: VectorSize, last_dim: usize) -> CopyLaunchPlan { ... }\n```\nand have both `copy_gpu_ref` and `into_contiguous_packed_ref` call it, converting to the unit each kernel\nexpects at the call site only.","locations":[{"ref":"crates/cubecl-std/src/tensor/contiguous/base.rs:291-333","code":"  291 |     let num_elems: usize = input.shape.iter().product();\n  292 | \n  293 |     // Vectorization is only enabled when the last dimension is contiguous.\n  294 |     let in_rank = input.strides.len();\n  295 |     let out_rank = output.strides.len();\n  296 |     let vector_size_in = tensor_vector_size_parallel(\n  297 |         client.io_optimized_vector_sizes(dtype.size()),\n  298 |         &input.shape,\n  299 |         &input.strides,\n  300 |         in_rank - 1,\n  301 |     );\n  302 |     let vector_size_out = tensor_vector_size_parallel(\n  303 |         client.io_optimized_vector_sizes(dtype.siz {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"`tensor_vectorization_factor` and `tensor_vectorization` are byte-for-byte identical wrappers around\n`tensor_vector_size_parallel`:\n```rust\npub fn tensor_vectorization_factor(factors: &[VectorSize], shape: &Shape, strides: &Strides, dim: usize) -> VectorSize {\n    tensor_vector_size_parallel(factors.iter().cloned(), shape, strides, dim)\n}\npub fn tensor_vectorization(factors: &[VectorSize], shape: &Shape, strides: &Strides, dim: usize) -> VectorSize {\n    tensor_vector_size_parallel(factors.iter().cloned(), shape, strides, dim)\n}\n```\nBoth are `pub` in `cubecl-core`'s root, so downstream code randomly picks one of two names for the same thing and\nany future behaviour change has to be applied twice.","fix":"Keep one and deprecate the other:\n```rust\n-pub fn tensor_vectorization(\n-    factors: &[VectorSize],\n-    shape: &Shape,\n-    strides: &Strides,\n-    dim: usize,\n-) -> VectorSize {\n-    tensor_vector_size_parallel(factors.iter().cloned(), shape, strides, dim)\n-}\n+#[deprecated(note = \"use `tensor_vectorization_factor`\")]\n+pub use tensor_vectorization_factor as tensor_vectorization;\n```","locations":[{"ref":"crates/cubecl-core/src/lib.rs:94-109","code":"   94 | pub fn tensor_vectorization_factor(\n   95 |     factors: &[VectorSize],\n   96 |     shape: &Shape,\n   97 |     strides: &Strides,\n   98 |     dim: usize,\n   99 | ) -> VectorSize {\n  100 |     tensor_vector_size_parallel(factors.iter().cloned(), shape, strides, dim)\n  101 | }\n  102 | pub fn tensor_vectorization(\n  103 |     factors: &[VectorSize],\n  104 |     shape: &Shape,\n  105 |     strides: &Strides,\n  106 |     dim: usize,\n  107 | ) -> VectorSize {\n  108 |     tensor_vector_size_parallel(factors.iter().cloned(), shape, strides, dim)\n  109 | }","lines":16,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/cr {"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"`stream/event.rs` defines its own private copy of `stream_index`, byte-for-byte identical to the\npublic `crate::stream::stream_index` it already has in scope via `crate::stream::{StreamFactory, StreamPool}`,\nand `MultiStream` also duplicates `max_streams`, which `StreamPool` already owns (and exposes\nthrough `StreamPool::stream_index`). Two independent copies of the same index derivation is exactly\nthe kind of thing that silently diverges — the mapping must stay identical or handles resolve to\nthe wrong stream.","fix":"Delete the local copy and reuse the pool's mapping:\n\n```rust\n// remove:\nfn stream_index(stream_id: &StreamId, max_streams: usize) -> usize {\n    stream_id.value as usize % max_streams\n}\n\n// and call:\nlet index = self.streams.stream_index(&handle.stream);\n```\n\nThen drop the redundant `MultiStream::max_streams` field.","locations":[{"ref":"crates/cubecl-runtime/src/stream/event.rs:168-170","code":"  168 | fn stream_index(stream_id: &StreamId, max_streams: usize) -> usize {\n  169 |     stream_id.value as usize % max_streams\n  170 | }","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/stream/event.rs#L168-L170"},{"ref":"crates/cubecl-runtime/src/stream/base.rs:189-192","code":"  189 | /// Maps a stream ID to an index within the pool's capacity using modulo arithmetic.\n  190 | pub fn stream_index(stream_id: &StreamId, max_streams: usize) -> usize {\n  191 |     stream_id.value as usize % max_streams\n  192 | }","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/stream/base.rs#L189-L192"}]},
{"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"`try_check_pitched_row_major_strides` and `try_check_contiguous_row_major_strides` are\nnear-identical 30-line functions (matching-rank check, rank-0 rejection, `strides[rank-1]\n== 1`, the `strides[i] != shape[i+1] * strides[i+1]` loop, identical `StrideError::Invalid`\nconstruction) that differ only in the extra pitch check and the loop's upper bound. Their\n`has_*` wrappers are byte-for-byte identical apart from the function they call, TODO comment\nincluded (which also ends mid-sentence: \"is a continuation of legacy code,\"). Any fix to one\n- for instance the missing `*s != 0` check in the contiguous variant - has to be remembered\nin the other.","fix":"Factor the shared body out, parameterised on whether a pitch is allowed:\n```rust\nfn try_check_row_major(shape: &Shape, strides: &Strides, pitched: bool) -> Result<(), StrideError> {\n    let rank = try_check_matching_ranks(shape, strides)?;\n    if rank == 0 { /* UnsupportedRank */ }\n    let mut valid = strides[rank - 1] == 1 && strides.iter().all(|s| *s != 0);\n    let outer = if pitched { rank.saturating_sub(2) } else { rank - 1 };\n    if valid && pitched && rank > 1 && strides[rank - 2] < shape[rank - 1] { valid = false; }\n    // ... shared loop over `0..outer`\n}\n```\nand collapse the two `has_*` wrappers into one generic helper taking the `try_*` function.","locations":[{"ref":"crates/cubecl-zspace/src/striding/layout_validation.rs:39-73","code":"   39 | pub fn try_check_pitched_row_major_strides(\n   40 |     shape: &Shape,\n   41 |     strides: &Strides,\n   42 | ) -> Result<(), StrideError> {\n   43 |     let rank = try_check_matching_ranks(shape, strides)?;\n   44 | \n   45 |     if rank == 0 {\n   46 |         return Err(StrideError::UnsupportedRank {\n   47 |             rank,\n   48 |             record: StrideRecord::from_usize_strides(shape, strides),\n   49 |         });\n {"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"easy","description":"`ReservedMemory::drop` decrements the logical ref count with `fetch_sub(1, Ordering::Release)` and,\nwhen it observes `previous == 1`, immediately runs `drop_fn` on the shared bytes. A `Release`\nread-modify-write does not synchronize *with* the other threads' releases, so the destructor can run\nwithout ever acquiring the writes made by the clones that were dropped earlier on other threads.\nThis is exactly the ordering bug `Arc::drop` avoids with an explicit `fence(Acquire)`. The payload's\n`Drop` (e.g. freeing a `Box`/`Arc` field written on another thread) can therefore read stale memory.\nNote the file's own tests advertise being run under Miri, which does not reliably flag missing\nacquire ordering.","fix":"Add the missing acquire before touching the data:\n```rust\nlet previous = self.ref_count.fetch_sub(1, Ordering::Release);\n\nif previous == 1 {\n    core::sync::atomic::fence(Ordering::Acquire);\n    let bytes_mut = unsafe { self.data.get().as_mut().unwrap() };\n    (self.drop_fn)(bytes_mut);\n}\n```\n(`Clone`'s `fetch_add(1, Ordering::Release)` can be relaxed to `Ordering::Relaxed` at the same time.)","locations":[{"ref":"crates/cubecl-common/src/arena.rs:186-196","code":"  186 |         // `Arc::strong_count` on the backing buffer instead. So the same\n  187 |         // logic is correct whether or not the arena is still alive.\n  188 |         let previous = self.ref_count.fetch_sub(1, Ordering::Release);\n  189 | \n  190 |         if previous == 1 {\n  191 |             // SAFETY: We are the last user of this slot. The data pointer is valid,\n  192 |             // initialized, and no other `ReservedMemory` clone exists.\n  193 |             let bytes_mut = unsafe { self.data.get().as_mut().unwrap() };\n  194 |             (self.drop_fn)(bytes_mut);\n  195 |         }\n  196 |     }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/arena.rs#L186-L196"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`ChannelDeviceState::init` holds the `CHANNELS` **spin** mutex (`spin::Mutex`, see the\n`guard_channel` binding) across the whole init sequence, including `device_client.enqueue(...)`,\n`device_client.flush()` and the blocking `recv.recv().unwrap()` that waits for the runner thread to\nfinish `S::init`. Two consequences: (1) any other thread creating a handle spins at 100% CPU for the\nentire duration of a service initialization, because a spin lock never parks; (2) if `S::init` (which\nruns on the runner thread while the lock is held) constructs any other `DeviceHandle` - a very\nplausible thing for a service to do, e.g. a downstream service reaching for an upstream one - that\nnested `init` calls `CHANNELS.lock()` and deadlocks forever, since the outer `init` cannot release\nthe lock until `recv.recv()` returns.","fix":"Drop the registry lock before waiting on the runner. Keep the \"one `S::init` per key\" guarantee with\na per-key placeholder instead of lock-holding: insert an `Initializing` marker under the lock,\nrelease it, run the enqueue/`recv` sequence, then re-acquire and publish the finished\n`ChannelDeviceState`. Callers that find `Initializing` wait on a condvar/park loop rather than\nholding `CHANNELS`. At minimum, use a blocking `Mutex` rather than `spin::Mutex` for a lock held\nacross a cross-thread round trip.","locations":[{"ref":"crates/cubecl-common/src/device/handle/channel.rs:318-345","code":"  318 |         let mut guard_channel = loop {\n  319 |             let mut guard = CHANNELS.lock();\n  320 |             let shutting_down = guard\n  321 |                 .get_or_insert_with(Registry::default)\n  322 |                 .shutting_down\n  323 |                 .contains(&runner_id);\n  324 | \n  325 |             if !shutting_down {\n  326 |                 break guard;\n  327 |             }\n  328 | \n  329 |             if is_device_thread(runner_id.device) {\n  330 |                 // Waiting is not an option: the shutdown covers every runner of this\n  331 |                 // device, including the one running this very code, and it cannot finish\n  332 |                 // until we return. Device-scoped for the same reason the self-join assert\n  333 |                 // in `shutdown_device` is: the runners of a device are joined in an\n  334 |                 // unspecified order, so waiting on a sibling stage can deadlock too.\n  335 |                 return Err(ServiceCreationError::new(\n  336 |                     \"Cannot create a device handle from a runner thread of a device that \\\n  337 |                      is shutting down.\"\n  338 |                         .into(),\n  339 |                 ));\n  340 |             }\n  341 | \n  342 |             drop(guard);\n  343 |             std::thread::yield_now();\n  344 |         };\n  345 |         let channels = &mut guard_channel.get_or_insert_with(Registry::default).channels;","lines":28,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/device/handle/channel.rs#L318-L345"},{"ref":"crates/cubecl-common/src/device/handle/channel.rs:396-409","code":"  396 |         // Same reason in [`send]` we need to call the function directly if we are on the runner\n  397 |         // thread.\n  398 |         if is_device_runner_thread(&runner_id) {\n  399 |             if let Err(err) = catch_unwind(AssertUnwindSafe(initialize_service)) {\n  400 |                 return Err(ServiceCreationError::new(std::format!(\n  401 |                     \"Service initialization failed: {err:?}\"\n  402 |                 )));\n  403 |             };\n  404 |         } else {\n  405 |             device_client.enqueue(initialize_service).unwrap();\n  406 |             device_client.flush();\n  407 |         };\n  408 | \n  409 |         let service = recv.recv().unwrap();","lines":14,"link" {"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`DeviceLock::lock` implements re-entrancy by comparing `StreamId::current()` against the stored\nowner, and the `TODO: Use thread id when we can.` acknowledges this is a stand-in. It is not a\nthread identity: `StreamId::current()` returns `StreamId { value: 0 }` for *every* thread under\n`StreamPolicy::Single`, and `StreamId::executes` deliberately installs a caller's id on another\nthread. When two threads share an id, the second one takes the `Guard::Reentrant` branch, which does\n**not** acquire `self.main`, and whose `Drop` does nothing - so `MutexDeviceHandle::exclusive` runs\ntwo task bodies concurrently while both believe they hold the device exclusively. Under\n`StreamPolicy::Single` the \"exclusive\" lock provides no exclusion at all beyond the first locker.","fix":"Key the re-entrancy check on something that really is per-thread. With `std` use\n`std::thread::current().id()`; in `no_std` keep a thread-local recursion depth counter and store an\nopaque per-thread token in `DeviceLock::lock`, falling back to plain mutual exclusion when no\nthread identity is available. `StreamId` must not be used as an owner token because\n`StreamPolicy::Single` maps all threads to `0`.","locations":[{"ref":"crates/cubecl-common/src/device/handle/mutex.rs:156-184","code":"  156 | impl DeviceLock {\n  157 |     pub fn lock(&self) -> Guard<'_> {\n  158 |         // TODO: Use thread id when we can.\n  159 |         let stream_id = StreamId::current();\n  160 | \n  161 |         loop {\n  162 |             let mut state = self.lock.write();\n  163 | \n  164 |             let is_ok = match state.as_ref() {\n  165 |                 Some(value) => *value == stream_id,\n  166 |                 None => {\n  167 |                     *state = Some(stream_id);\n  168 |                     let guard = self.main.lock();\n  169 |                     return Guard::Main(guard, self) {"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`ComputeClient::ensure_init_collective` is a check-then-act race, and it panics on the device runner\nthread when initialization fails. `self.utilities.initialized_comms.read().contains(&comm_id)` drops\nthe read lock, then `submit` queues `server.comm_init(device_ids).unwrap()`, and only afterwards is\nthe write lock taken to `insert(comm_id)`. Two threads (or two clients sharing one\n`ServerUtilities`) reaching `all_reduce` / `to_client_tensor` concurrently for the same device set\nboth observe `false` and both submit `comm_init` for the same communicator.\n\nBecause the failure path is `.unwrap()` inside a fire-and-forget `submit`, a rejected duplicate\n`comm_init` panics on the device runner thread rather than returning an error: the panic payload is\nnever re-raised on any caller (only `submit_blocking` propagates it), and every later submit on that\ndevice fails with \"device runner channel disconnected\". The same `.unwrap()`-inside-`submit` pattern\nis used in `sync_collective` and `all_reduce`.","fix":"Hold one write lock across the test and the insert so the initialization happens once, and report the\nerror instead of panicking on the runner thread:\n\n```rust\nlet mut initialized = self.utilities.initialized_comms.write();\nif initialized.insert(comm_id) {\n    let result = self\n        .device\n        .submit_blocking(move |server| server.comm_init(device_ids))\n        .unwrap_or_resume();\n    if let Err(err) = result {\n        initialized.remove(&comm_id);\n        // surface `err` to the caller instead of panicking on the device thread\n    }\n    self.device.flush_queue();\n}\n```","locations":[{"ref":"crates/cubecl-runtime/src/client.rs:851-862","code":"  851 |     pub fn ensure_init_collective(&mut self, device_ids: Vec<DeviceId>) {\n  852 |         let comm_id = CommunicationId::from(device_ids.clone());\n  853 |         let is_comms_i {"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The browser backend's `load` and `delete_prefix` disagree on how to exclude records belonging to a\n*nested* namespace, and the `load` side turns every such record into a spurious warning.\n\nBoth build the same range, which by construction spans nested namespaces:\n\n```rust\nlet upper = format!(\"{prefix}\\u{10FFFF}\");\nlet range = IdbKeyRange::bound(&JsValue::from_str(prefix), &JsValue::from_str(&upper))?;\n```\n\n`delete_prefix` handles this explicitly and documents why:\n\n```rust\nlet belongs = record_key.strip_prefix(prefix).is_some_and(|suffix| !suffix.contains('/'));\n```\n\n`load` has no such filter and instead relies on `from_hex` happening to reject a suffix like\n`child/9f...`, so for every record of every nested namespace it logs\n\n```rust\nlog::warn!(\"cubecl cache: unreadable browser storage record key '{record_key}'\");\n```\n\nA cache root with a parent namespace and children (which is the normal shape:\n`autotune/<version>/<device>/...`) therefore emits one bogus warning per child entry on every page\nload, drowning the real \"unreadable record\" signal the warning exists for.","fix":"Apply the same ownership test `delete_prefix` uses, and only warn for keys that really are\nunreadable:\n\n```rust\n let Some(record_key) = key.as_string() else { ... };\n-let Some(key) = record_key.strip_prefix(prefix).and_then(from_hex) else {\n-    log::warn!(\"cubecl cache: unreadable browser storage record key '{record_key}'\");\n-    continue;\n-};\n+let Some(suffix) = record_key.strip_prefix(prefix) else {\n+    continue;\n+};\n+// The range spans nested namespaces (`{prefix}child/{hex}`); a hex key never\n+// contains '/', so that is what tells them apart.\n+if suffix.contains('/') {\n+    continue;\n+}\n+let Some(key) = from_hex(suffix) else {\n+    log::warn!(\"cubecl cache: unreadable browser storage record key '{record_key}'\");\n+    continue;\n+};\n
