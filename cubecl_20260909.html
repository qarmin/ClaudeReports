infos)\n  138 |         .enabled_extension_names(&str_pointers);\n  139 |     let mut info = phys_features.add_to_device_create(pre_info.into());\n  140 |     info = info.enabled_features(&supported_feat);\n  141 |     info = extended_feat.add_to_device_create(info.into()).into();\n  142 | \n  143 |     let vk_device = unsafe {\n  144 |         ash.raw_instance()\n  145 |             .create_device(adapter.raw_physical_device(), &info, None)\n  146 |             .expect(\"Failed to create Vulkan device\")\n  147 |     };\n  148 | \n  149 |     // The default is MemoryHints::Performance, which tries to do some bigger\n  150 |     // block allocations. However, we already batch allocations, so we\n  151 |     // can use MemoryHints::MemoryUsage to lower memory usage.\n  152 |     let memory_hints = wgpu::MemoryHints::MemoryUsage;\n  153 |     let device = unsafe {\n  154 |         adapter\n  155 |             .device_from_raw(\n  156 |                 vk_device,\n  157 |                 None,\n  158 |                 &extensions,\n  159 |                 features,\n  160 |                 &limits,\n  161 |                 &memory_hints,\n  162 |                 family_info.queue_family_index,\n  163 |                 0,\n  164 |             )\n  165 |             .expect(\"Failed to create HAL device\")\n  166 |     };","lines":51,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/backend/vulkan.rs#L116-L166"}]},
{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`WgpuAllocController::memory_mut` hands out a `&mut [MaybeUninit<u8>]` that is derived from\na *shared* reference: `let bytes: &[u8] = self.view.as_ref().unwrap();` followed by\n`bytes.as_ptr() as *mut MaybeUninit<u8>`. Writing through a pointer obtained from `&[u8]`\nis undefined behaviour under Rust's aliasing rules (the `SAFETY` comment only argues about\nlayout, not about provenance/mutability), and the buffer is obtained with the immutable\n`get_mapped_range`, as the comment in `init` admits. Any consumer that writes into the\n`Bytes` returned by `read_resources` therefore mutates through a read-only provenance\npointer - UB that Miri flags and that a future optimiser may miscompile.","fix":"Keep a mutable mapping when mutation is required, e.g. store\n`view: Option<wgpu::BufferViewMut>` obtained from `buffer.get_mapped_range_mut(..)` and\nderive the mutable slice from it:\n```rust\nlet bytes: &mut [u8] = self.view.as_mut().unwrap();\nOk(unsafe {\n    core::slice::from_raw_parts_mut(bytes.as_mut_ptr().cast::<MaybeUninit<u8>>(), bytes.len())\n})\n```\nIf the immutable view must be kept for wgpu's overlap checks, then `memory_mut` must not\nbe implemented at all (return `Err(AccessError::...)`) rather than fabricating a `&mut`.","locations":[{"ref":"crates/cubecl-wgpu/src/compute/controller.rs:33-44","code":"   33 |     unsafe fn memory_mut(\n   34 |         &mut self,\n   35 |         _policy: AccessPolicy,\n   36 |     ) -> Result<&mut [MaybeUninit<u8>], AccessError> {\n   37 |         let bytes: &[u8] = self.view.as_ref().unwrap();\n   38 |         // SAFETY:\n   39 |         // - MaybeUninit<u8> has the same layout as u8\n   40 |         // - Caller promises not to write uninitialized values.\n   41 |         Ok(unsafe {\n   42 |             std::slice::from_raw_parts_mut(bytes.as_ptr() as *mut MaybeUninit<u8>, bytes.len())\n   43 |         })\n   44 |     }","lines":12,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/controller.rs#L33-L44"},{"ref":"crates/cubecl-wgpu/src/compute/controller.rs:67-78","code":"   67 |     pub fn init(binding: ManagedMemoryBinding, buffer: wgpu::Buffer) -> Self {\n   68 |         // Needs immutable as of wgpu v29, mutable doesn't allow dereferencing as slice.\n   69 |         // This only affects wgpu's internal overlap checks so it should be fine as long as we\n   70 |         // map the whole buffer anyways.\n   71 |         let buf_view = buffer.get_mapped_range(..).unwrap();\n   72 | \n   73 |         Self {\n   74 |             view: Some(buf_view),\n   75 |             buffer,\n   76 |             _binding: binding,\n   77 |         }\n   78 |     }","lines":12,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/controller.rs#L67-L78"}]},
{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Every minifloat's `ToPrimitive` implementation is a copy of the same wrong shape: `to_i64`/`to_u64`\nreturn `Some(value as i64 / as u64)`, which per the `ToPrimitive` contract must return `None` when\nthe value is not representable. Rust's float-to-int `as` cast saturates, so `NaN` becomes\n`Some(0)` and `e5m2::MIN` (-57344) becomes `Some(0u64)` rather than `None`. Any caller using\n`NumCast::from` / `cast()` to convert a negative or NaN minifloat into an unsigned integer silently\ngets `0` instead of a failure. The paste also drifted: `to_i64` goes through `to_f32` while its\nneighbour `to_u64` goes through `to_f64`, in all five files.","fix":"Delegate to the already-correct `f64` implementations instead of casting by hand, in every one of\nthe five impls:\n```rust\nimpl ToPrimitive for e5m2 {\n    fn to_i64(&self) -> Option<i64> { self.to_f64().and_then(|v| v.to_i64()) }\n    fn to_u64(&self) -> Option<u64> { self.to_f64().and_then(|v| v.to_u64()) }\n    fn to_f32(&self) -> Option<f32> { Some(e5m2::to_f32(*self)) }\n    fn to_f64(&self) -> Option<f64> { Some(e5m2::to_f64(*self)) }\n}\n```","locations":[{"ref":"crates/cubecl-common/src/float/fp8/fp8_e5m2.rs:265-281","code":"  265 | impl ToPrimitive for e5m2 {\n  266 |     fn to_i64(&self) -> Option<i64> {\n  267 |         Some(e5m2::to_f32(*self) as i64)\n  268 |     }\n  269 | \n  270 |     fn to_u64(&self) -> Option<u64> {\n  271 |         Some(e5m2::to_f64(*self) as u64)\n  272 |     }\n  273 | \n  274 |     fn to_f32(&self) -> Option<f32> {\n  275 |         Some(e5m2::to_f32(*self))\n  276 |     }\n  277 | \n  278 |     fn to_f64(&self) -> Option<f64> {\n  279 |         Some(e5m2::to_f64(*self))\n  280 |     }\n  281 | }","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/fp8/fp8_e5m2.rs#L265-L281"},{"ref":"crates/cubecl elf))\n  169 |     }\n  170 | }","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/tensor_float.rs#L154-L170"},{"ref":"crates/cubecl-common/src/float/relaxed.rs:141-157","code":"  141 | impl ToPrimitive for flex32 {\n  142 |     fn to_i64(&self) -> Option<i64> {\n  143 |         Some((*self).to_f32() as i64)\n  144 |     }\n  145 | \n  146 |     fn to_u64(&self) -> Option<u64> {\n  147 |         Some((*self).to_f32() as u64)\n  148 |     }\n  149 | \n  150 |     fn to_f32(&self) -> Option<f32> {\n  151 |         Some((*self).to_f32())\n  152 |     }\n  153 | \n  154 |     fn to_f64(&self) -> Option<f64> {\n  155 |         Some((*self).to_f32() as f64)\n  156 |     }\n  157 | }","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/float/relaxed.rs#L141-L157"}]},
{"id":"API_15","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`StableHasher` implements `core::hash::Hasher` with `fn finish(&self) -> u64 {\nunimplemented!(\"Can't finish to `u64`, use `StableHasher::finalize`\") }`. The panic is documented on\nthe type, but it still means the type cannot be handed to any generic `H: Hasher` consumer -\n`BuildHasher::hash_one`, `HashMap`/`HashSet` with a custom hasher, or any third-party helper that\nfinishes the hash - all of which are entitled to call `finish`. The trait is being used purely as a\n`write` sink, which does not require implementing `finish` at all.","fix":"Return a truncation of the real digest instead of panicking, so the impl honours the trait while\n`finalize` stays the full-width entry point:\n```rust\nfn finish(&self) -> u64 {\n    self.0.digest()\n}\n```\n`Xxh3Default` already exposes a 64-bit `digest()`, so no information is invented.","locations":[{"ref":"crates/cubecl-common/src/hash.rs:39-47","code":"   39 | impl Hasher for StableHasher {\n   40 |     fn finish(&self) -> u64 {\n   41 |         unimplemented!(\"Can't finish to `u64`, use `StableHasher::finalize`\")\n   42 |     }\n   43 | \n   44 |     fn write(&mut self, bytes: &[u8]) {\n   45 |         self.0.update(bytes);\n   46 |     }\n   47 | }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/hash.rs#L39-L47"}]},
{"id":"API_16","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Deref`/`DerefMut` for `OwnedTensorExpand<T>` reinterpret the whole struct with\n`unsafe { core::mem::transmute(self) }` to obtain a `TensorExpand<T>`. Both structs are\n`#[repr(Rust)]` types generated by `#[derive(CubeType)]`; their layouts happen to coincide today\n(`buffer` is `NativeExpand<Box<[T]>>` vs `NativeExpand<[T]>`, both `Value` + `PhantomData`), but the\nRust ABI gives no guarantee that two distinct types with identical field types share a layout, and\nadding or reordering a field in either struct turns this into silent memory corruption rather than a\ncompile error.","fix":"Avoid the type-punning: either make `OwnedTensorExpand` literally contain a `TensorExpand`\n\n```rust\npub struct OwnedTensorExpand<T: CubePrimitive> {\n    inner: TensorExpand<T>,\n}\n```\n\nso `deref` is `&self.inner`, or build the target by value:\n\n```rust\nfn deref(&self) -> &Self::Target {\n    // construct a TensorExpand from `meta` + `buffer.expand.into()` and arena-allocate it\n}\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/container/tensor/base.rs:241-255","code":"  241 | impl<T: CubePrimitive> Deref for OwnedTensorExpand<T> {\n  242 |     type Target = TensorExpand<T>;\n  243 | \n  244 |     fn deref(&self) -> &Self::Target {\n  245 |         // SAFETY: Expand type has compatible layout since the type of the buffer is just a marker\n  246 |         unsafe { core::mem::transmute(self) }\n  247 |     }\n  248 | }\n  249 | \n  250 | impl<T: CubePrimitive> DerefMut for OwnedTensorExpand<T> {\n  251 |     fn deref_mut(&mut self) -> &mut Self::Target {\n  252 |         // SAFETY: Expand type has compatible layout since the type of the buffer is just a marker\n  253 |         unsafe { core::mem::transmute(self) }\n  254 |     }\n  255 | }","lines":15,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/container/tensor/base.rs#L241-L255"}]},
{"id":"API_17","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`request_result` leaves its JS callbacks installed on the `IdbRequest` when it returns early, so\nIndexedDB can invoke a `Closure` whose Rust side has already been dropped.\n\n```rust\nlet outcome = rx\n    .await\n    .map_err(|_| JsValue::from_str(\"request callback dropped\"))?;   // <-- early return\n\nrequest.set_onsuccess(None);\nrequest.set_onerror(None);\n```\n\n`on_success`/`on_error` are local `Closure::once` values that free their JS shim on drop. Every\npath that leaves the function before the two `set_*(None)` calls — the `?` above, or the whole\nfuture being dropped while the request is still in flight (which is what happens if a `spawn_local`\ntask is ever cancelled, or if a caller composes this future with a `select`/timeout) — drops the\n`Closure`s while `request.onsuccess`/`onerror` still point at them. IndexedDB then calls into a\nfreed shim and wasm-bindgen throws \"closure invoked after being dropped\" from inside an event\nhandler, where nothing can catch it.","fix":"Detach the handlers unconditionally, with a guard so it also runs on drop:\n\n```rust\nstruct Handlers<'a>(&'a IdbRequest);\nimpl Drop for Handlers<'_> {\n    fn drop(&mut self) {\n        // The `Closure`s are freed right after this; the request must not keep\n        // pointing at their JS shims.\n        self.0.set_onsuccess(None);\n        self.0.set_onerror(None);\n    }\n}\n\nrequest.set_onsuccess(Some(on_success.as_ref().unchecked_ref()));\nrequest.set_onerror(Some(on_error.as_ref().unchecked_ref()));\nlet _handlers = Handlers(request);\n\nlet outcome = rx.await.map_err(|_| JsValue::from_str(\"request callback dropped\"))?;\noutcome?;\nrequest.result()\n```\n\n(`_handlers` must be declared after the two `set_*` calls and before the first `?`, and dropped\nbefore `on_success`/`on_error`.) `open_db` needs the same treatment for `set_onupgradeneeded`.","locations":[{"ref":"crates/cubecl-environment/src/persistence/browser.rs:208-241","code":"  208 | async fn request_result(request: &IdbRequest) -> Result<JsValue, JsValue> {\n  209 |     let (tx, rx) = oneshot::channel::<Result<(), JsValue>>();\n  210 |     let tx = alloc::rc::Rc::new(core::cell::RefCell::new(Some(tx)));\n  211 | \n  212 |     let on_success = {\n  213 |         let tx = tx.clone();\n  214 |         Closure::once(move |_event: web_sys::Event| {\n  215 |             if let Some(tx) = tx.borrow_mut().take() {\n  216 |                 tx.send(Ok(())).ok();\n  217 |             }\n  218 |         })\n  219 |     };\n  220 |     let on_error = {\n  221 |         let tx = tx.clone();\n  222 |         Closure::once(move |event: web_sys::Event| {\n  223 |             if let Some(tx) = tx.borrow_mut().take() {\n  224 |                 tx.send(Err(JsValue::from(event))).ok();\n  225 |             }\n  226 |         })\n  227 |     };\n  228 | \n  229 |     request.set_onsuccess(Some(on_success.as_ref().unchecked_ref()));\n  230 |     request.set_onerror(Some(on_error.as_ref().unchecked_ref()));\n  231 | \n  232 |     let outcome = rx\n  233 |         .await\n  234 |         .map_err(|_| JsValue::from_str(\"request callback dropped\"))?;\n  235 | \n  236 |     request.set_onsuccess(None);\n  237 |     request.set_onerror(None);\n  238 | \n  239 |     outcome?;\n  240 |     request.result()\n  241 | }","lines":34,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/persistence/browser.rs#L208-L241"}]},
{"id":"API_18","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`paths.rs` declares its cached paths as `const CORE_PATH: LazyCell<Path> = LazyCell::new(...)`.\nA `const` is inlined at every use site, so each `core_path()`/`frontend_path()`/`prelude_path()`\ncall constructs a brand-new `LazyCell`, runs the initializer, clones the `Path` and drops the\ncell - the laziness and caching that `LazyCell` exists for never happen (this is exactly what the\n`clippy::declare_interior_mutable_const` / `borrow_interior_mutable_const` lints being silenced\nhere warn about). These helpers are called several times per expanded expression, so the macro\npays repeated `Ident`/`Path` allocations for nothing.","fix":"Either drop the pretence and build the path directly:\n```rust\npub fn core_path() -> Path {\n    Path::from(format_ident!(\"cubecl\"))\n}\npub fn frontend_path() -> Path {\n    let mut path = core_path();\n    path.segments.push(format_ident!(\"frontend\").into());\n    path\n}\n```\nor make the caches real `static`s with `std::sync::LazyLock` (`Path` is not `Sync`, so a\n`thread_local!` + `LazyCell` is the alternative) and remove the `#[allow(...)]` attributes.","locations":[{"ref":"crates/cubecl-macros/src/paths.rs:5-44","code":"    5 | #[allow(clippy::declare_interior_mutable_const)]\n    6 | const CORE_PATH: LazyCell<Path> = LazyCell::new(|| Path::from(format_ident!(\"cubecl\")));\n    7 | #[allow(clippy::declare_interior_mutable_const)]\n    8 | const FRONTEND_PATH: LazyCell<Path> = LazyCell::new(|| {\n    9 |     let mut path = core_path();\n   10 |     path.segments.push(format_ident!(\"frontend\").into());\n   11 |     path\n   12 | });\n   13 | #[allow(clippy::declare_interior_mutable_const)]\n   14 | const PRELUDE_PATH: LazyCell<Path> = LazyCell::new(|| {\n   15 |     let mut path = core_path();\n   16 |     path.segments.push(format_ident!(\"prelude\").into());\n   17 |     path\n   18 | });\n   19 | #[allow(clippy::declare_interior_mutable_const)]\n   20 | const TUNE_PATH: LazyCell<Path> = LazyCell::new(|| {\n   21 |     let mut path = core_path();\n   22 |     path.segments.push(format_ident!(\"tune\").into());\n   23 |     path\n   24 | });\n   25 | \n   26 | pub fn frontend_path() -> Path {\n   27 |     #[allow(clippy::borrow_interior_mutable_const)]\n   28 |     FRONTEND_PATH.clone()\n   29 | }\n   30 | \n   31 | pub fn prelude_path() -> Path {\n   32 |     #[allow(clippy::borrow_interior_mutable_const)]\n   33 |     PRELUDE_PATH.clone()\n   34 | }\n   35 | \n   36 | pub fn tune_path() -> Path {\n   37 |     #[allow(clippy::borrow_interior_mutable_const)]\n   38 |     TUNE_PATH.clone()\n   39 | }\n   40 | \n   41 | pub fn core_path() -> Path {\n   42 |     #[allow(clippy::borrow_interior_mutable_const)]\n   43 |     CORE_PATH.clone()\n   44 | }","lines":40,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/paths.rs#L5-L44"}]},
{"id":"API_19","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`MetadataInfoCache::clear` drops every entry — including entries pinned to a live captured graph —\nand leaves `pending` and `graph_locks` untouched. That breaks the invariant the rest of the module\nis built around (\"a graph records the device pointer of every info buffer its launches touch, so\nthose buffers must outlive the graph\"): the buffer handles are released back to the pool while a\ngraph can still replay against them. The stale `graph_locks` are also actively harmful afterwards —\na later `graph_release` walks keys the graph no longer owns and removes whatever unrelated entries\nnow sit under them (`entry.locks.saturating_sub(1) == 0` is true for any fresh entry).","fix":"Make `clear` respect pins and stay consistent:\n\n```rust\n/// Drop every unpinned entry (releasing its `V`). Entries pinned to a live graph are kept.\npub fn clear(&mut self) {\n    self.entries.retain(|_, entry| entry.locks > 0);\n}\n```\n\nIf a hard reset really is wanted, also clear `pending` and `graph_locks` and document that no graph\nmay be live.","locations":[{"ref":"crates/cubecl-runtime/src/metadata_cache.rs:234-237","code":"  234 |     /// Drop every cached entry (releasing every held `V`).\n  235 |     pub fn clear(&mut self) {\n  236 |         self.entries.clear();\n  237 |     }","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/metadata_cache.rs#L234-L237"},{"ref":"crates/cubecl-runtime/src/metadata_cache.rs:375-391","code":"  375 |     pub fn graph_release(&mut self, graph: GraphId) {\n  376 |         let Some(keys) = self.graph_locks.remove(&graph) else {\n  377 |             return;\n  378 |         };\n  379 |         for key in keys {\n  380 |             let drop_entry = match self.entries.get_mut(&key) {\n  381 |                 Some(entry) => {\n  382 |                     entry.locks = entry.locks.saturating_sub(1);\n  383 |                     entry.locks == 0\n  384 |                 }\n  385 |                 None => false,\n  386 |             };\n  387 |             if drop_entry {\n  388 |                 self.entries.remove(&key);\n  389 |             }\n  390 |         }\n  391 |     }","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/metadata_cache.rs#L375-L391"}]},
{"id":"API_20","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`EXT_SHADER_LONG_VECTOR_NAME` is passed to `fill_opt!` twice — once for the `long_vector` feature\nstruct and once for the `long_vector_properties` struct — and `fill_opt!` unconditionally does\n`$self.extensions.push($extension)`. The resulting `ExtendedFeatures::extensions` vector contains\nthe same extension name twice, and it is handed straight to\n`DeviceCreateInfo::enabled_extension_names` in `request_device`\n(`crates/cubecl-wgpu/src/backend/vulkan.rs:127-138`). Duplicated entries in\n`ppEnabledExtensionNames` are at best redundant and are flagged by some validation layers.","fix":"Fill the properties struct without re-pushing the extension name, for instance move it out of the\n`fill_opt!` list:\n```rust\n// `EXT_SHADER_LONG_VECTOR_NAME` was already pushed for `long_vector` above.\nif self.long_vector.is_some() {\n    self.long_vector_properties = Some(Default::default());\n}\n```","locations":[{"ref":"crates/cubecl-wgpu/src/backend/vulkan/features.rs:138-146","code":"  138 |             KHR_MAINTENANCE8_NAME => maintenance_8,\n  139 |             KHR_MAINTENANCE9_NAME => maintenance_9,\n  140 |             EXT_SHADER_LONG_VECTOR_NAME => long_vector,\n  141 |             NV_SHADER_ATOMIC_FLOAT16_VECTOR_NAME => nv_atomic_float_vector,\n  142 |             NV_COOPERATIVE_MATRIX2_NAME => nv_cooperative_matrix2,\n  143 | \n  144 |             // Properties\n  145 |             EXT_SHADER_LONG_VECTOR_NAME => long_vector_properties,\n  146 |         );","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/backend/vulkan/features.rs#L138-L146"},{"ref":"crates/cubecl-wgpu/src/backend/vulkan.rs:127-138","code":"  127 |     let str_pointers = extended_feat\n  128 |         .extensions\n  129 |         .iter()\n  130 |         .map(|&s| {\n  131 |             // Safe because `device_extensions` entries have static lifetime.\n  132 |             s.as_ptr()\n  133 |         })\n  134 |         .collect::<Vec<_>>();\n  135 | \n  136 |     let pre_info = DeviceCreateInfo::default()\n  137 |         .queue_create_infos(&family_infos)\n  138 |         .enabled_extension_names(&str_pointers);","lines":12,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/backend/vulkan.rs#L127-L138"}]},
{"id":"API_21","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`get_cur_timestamp` (behind the `profile-tracy` feature) writes query index `0` twice: the\ncompute pass it opens already declares `end_of_pass_write_index: Some(0)`, and then\n`timestamp_encoder.write_timestamp(&query_set, 0)` writes the same slot again. Beyond being\nredundant, `CommandEncoder::write_timestamp` requires the\n`Features::TIMESTAMP_QUERY_INSIDE_ENCODERS` feature, which is never requested (only\n`TIMESTAMP_QUERY` is checked, in `create_server`), so on adapters without it this raises a\nwgpu validation error, and the following `get_mapped_range().unwrap()` / `try_into().unwrap()`\nturn that into a panic.","fix":"Drop the redundant encoder-level write and rely on the pass timestamp:\n```rust\ntimestamp_encoder.begin_compute_pass(&wgpu::ComputePassDescriptor {\n    label: Some(\"Write timestamp pass\"),\n    timestamp_writes: Some(wgpu::ComputePassTimestampWrites {\n        query_set: &query_set,\n        beginning_of_pass_write_index: None,\n        end_of_pass_write_index: Some(0),\n    }),\n});\n// removed: timestamp_encoder.write_timestamp(&query_set, 0);\ntimestamp_encoder.resolve_query_set(&query_set, 0..1, &resolve_buffer, 0);\n```","locations":[{"ref":"crates/cubecl-wgpu/src/compute/timings.rs:220-261","code":"  220 |     let mut timestamp_encoder = device.create_command_encoder(&wgpu::CommandEncoderDescriptor {\n  221 |         label: Some(\"wgpu-profiler gpu -> cpu query timestamp\"),\n  222 |     });\n  223 |     // This compute pass is purely to get a timestamp.\n  224 |     timestamp_encoder.begin_compute_pass(&wgpu::ComputePassDescriptor {\n  225 |         label: Some(\"Write timestamp pass\"),\n  226 |         timestamp_writes: Some(wgpu::ComputePassTimestampWrites {\n  227 |             query_set: &query_set,\n  228 |             beginning_of_pass_write_index: None,\n  229 |             end_of_pass_write_index: Some(0),\n  230 |         }),\n  231 |     });\n  232 |     timestamp_encoder.write_timestamp(&query_set, 0);\n  233 |     timestamp_encoder.resolve_query_set(&query_set, 0..1, &resolve_buffer, 0);\n  234 |     // Workaround for https://github.com/gfx-rs/wgpu/issues/6406\n  235 |     // TODO when that bug is fixed, merge these encoders together again\n  236 |     let mut copy_encoder = device.create_command_encoder(&wgpu::CommandEncoderDescriptor {\n  237 |         label: Some(\"wgpu-profiler gpu -> cpu copy timestamp\"),\n  238 |     });\n  239 |     copy_encoder.copy_buffer_to_buffer(\n  240 |         &resolve_buffer,\n  241 |         0,\n  242 |         &map_buffer,\n  243 |         0,\n  244 |         Some(QUERY_SIZE as BufferAddress),\n  245 |     );\n  246 | \n  247 |     let commands = [timestamp_encoder.finish(), copy_encoder.finish()];\n  248 | \n  249 |     queue.submit(commands);\n  250 |     map_buffer.slice(..).map_async(wgpu::MapMode::Read, |_| ());\n  251 | \n  252 |     device\n  253 |         .poll(wgpu::PollType::Wait {\n  254 |             submission_index: None, // Wait for most recent\n  255 |             timeout: None,\n  256 |         })\n  257 |         .unwrap();\n  258 | \n  259 |     let view = map_buffer.slice(..).get_mapped_range().unwrap();\n  260 |     u64::from_le_bytes((*view).try_into().unwrap())\n  261 | }","lines":42,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/compute/timings.rs#L220-L261"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"`Bytes::from_bytes_vec` **always** re-allocates and memcpys the whole payload, doubling peak memory\nand adding a full copy on every call.\n\n`from_bytes_vec` first wraps the `Vec<u8>` with `Self::from_elems(bytes)`, which builds a\n`NativeAllocationController` whose `alloc_align()` is `align_of::<u8>() == 1`. It then calls\n`try_enforce_runtime_align(default_controller::MAX_ALIGN)`, and that function compares the\n*controller-reported* alignment, not the actual pointer:\n\n```rust\nfn try_enforce_runtime_align(&mut self, align: usize) -> Result<(), LayoutError> {\n    if self.controller.alloc_align() >= align {   // 1 >= 16 -> always false for a Vec<u8>\n        return Ok(());\n    }\n    *self = Self::try_from_data(align, self)?;    // full re-alloc + memcpy, every time\n    Ok(())\n}\n```\n\nSo the branch is taken unconditionally and `try_from_data` allocates a second buffer of the same\nsize and copies into it. Verified empirically: for `Bytes::from_bytes_vec(vec![7u8; 1024])` the\ndata pointer changes (`0x...0cc0` before, `0x...10d0` after), i.e. the data was copied.\n\nThe comment at `base.rs:489-491` claims the opposite and is therefore stale/wrong:\n\"On most platforms, this alignment check is fulfilled either way though, so the benefits of\npotentially saving a memcopy are negligible.\" The check can never be fulfilled by a `Vec<u8>`.\n\nThis is on real hot paths. `CudaCommand::reserve_cpu` does\n`Bytes::from_bytes_vec(vec![0; size])` for every readback larger than 100 MB, so a 1 GB tensor\nreadback allocates 1 GB, zeroes it, allocates another 1 GB and memcpys 1 GB before the download\neven starts. `bundle::import` pays it twice per entry (`key.to_vec()` / `value.to_vec()` then\nanother copy inside `from_bytes_vec`), and `cubecl-metal`/`cubecl-wgpu` readbacks use it too.","fix":"Allocate at the requested alignment up front instead of allocating at `align_of::<u8>()` and then\nre-aligning. Add a constructor that takes the alignment, e.g.\n\n```rust\npub fn from_bytes_vec(bytes: Vec<u8>) -> Self {\n    // A `Vec<u8>` can never report `MAX_ALIGN`, so build the buffer at the\n    // right alignment instead of copying it afterwards.\n    let mut out = Self::with_capacity_aligned(bytes.len(), default_controller::MAX_ALIGN);\n    out.extend_from_byte_slice_aligned(&bytes, default_controller::MAX_ALIGN);\n    out\n}\n```\n\nor, better for the `reserve_cpu` case, expose\n`Bytes::zeroed_aligned(size, default_controller::MAX_ALIGN)` so callers stop building a throwaway\n`vec![0; size]` at all, and change `CudaCommand::reserve_cpu` to\n`Bytes::zeroed_aligned(size, MAX_ALIGN)`.\n\nEither way, delete the stale comment at `base.rs:489-491`, and if `from_bytes_vec` must keep the\ncurrent shape, make `try_enforce_runtime_align` skip the copy when\n`self.as_ptr().align_offset(align) == 0` **and** the controller can be re-labelled, or document\nthat the copy is unconditional.","locations":[{"ref":"crates/cubecl-environment/src/bytes/base.rs:485-496","code":"  485 |     /// Create a sequence of [Bytes] from the memory representation of an unknown type of elements.\n  486 |     /// Prefer this over [`Self::from_elems`] when the datatype is not statically known and erased at runtime.\n  487 |     pub fn from_bytes_vec(bytes: Vec<u8>) -> Self {\n  488 |         let mut bytes = Self::from_elems(bytes);\n  489 |         // TODO: this method could be datatype aware and enforce a less strict alignment.\n  490 |         // On most platforms, this alignment check is fulfilled either way though, so\n  491 |         // the benefits of potentially saving a memcopy are negligible.\n  492 |         bytes\n  493 |             .try_enforce_runtime_align(default_controller::MAX_ALIGN)\n  494 |             .unwrap();\n  495 |         bytes\n  496 |     }","lines":12,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bytes/base.rs#L485-L496"},{"ref":"crates/cubecl-environment/src/bytes/base.rs:632-642","code":"  632 |     /// Ensure the allocation's reported alignment is at least `align`, reallocating\n  633 |     /// into a fresh controller if not. We check the controller's reported alignment\n  634 |     /// (not the raw pointer) because downstream callers such as `try_into_vec::<E>`\n  635 |     /// depend on `alloc_align()` matching the element alignment.\n  636 |     fn try_enforce_runtime_align(&mut self, align: usize) -> Result<(), LayoutError> {\n  637 |         if self.controller.alloc_align() >= align {\n  638 |             return Ok(());\n  639 |         }\n  640 |         *self = Self::try_from_data(align, self)?;\n  641 |         Ok(())\n  642 |     }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bytes/base.rs#L632-L642"},{"ref":"crates/cubecl-environment/src/bundle/import.rs:65-73","code":"   65 |         bundle.scan(&namespace, &mut |key, value| {\n   66 |             batch.push((\n   67 |                 Bytes::from_bytes_vec(key.to_vec()),\n   68 |                 Bytes::from_bytes_vec(value.to_vec()),\n   69 |             ));\n   70 |             if batch.len() == BATCH {\n   71 |                 commit(&mut batch, &mut total);\n   72 |             }\n   73 |         });","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bundle/import.rs#L65-L73"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`flat::write` materializes the entire bundle three times over before touching the disk. It builds a\nseparate `index` and `data` buffer, then a third `bytes` buffer, and copies `index` and `data` into\nit:\n\n```rust\nlet mut index = Bytes::from_bytes_vec(Vec::with_capacity(entries.len() * ENTRY_SIZE));\nlet mut data = Bytes::from_bytes_vec(Vec::new());\nfor ((namespace, key), value) in entries { ... data.extend_from_byte_slice(value); ... }\nlet mut bytes = Bytes::from_bytes_vec(Vec::with_capacity(64 + metadata.len() + index.len() + data.len()));\n...\nbytes.extend_from_byte_slice(&index);\nbytes.extend_from_byte_slice(&data);\nstd::fs::write(out, &*bytes)?;\n```\n\nPeak memory is roughly `2 x (index + data)` on top of the `Entries` map that already owns every\nkey and value, i.e. about 3x the bundle size resident at once. A compiled-kernel bundle is easily\nhundreds of megabytes.\n\nTwo extra costs compound it. `Bytes::from_bytes_vec(Vec::with_capacity(n))` throws the reserved\ncapacity away: it re-allocates through `try_enforce_runtime_align` (see the separate\n`from_bytes_vec` finding), so `data` starts from a zero-capacity buffer and grows by repeated\ndoubling. And the `64 +` header estimate for `bytes` omits the namespace table entirely\n(`namespace_cnt x (u32 len + UTF-8 bytes)`), so `bytes` re-allocates and copies the whole blob at\nleast once more as soon as the namespace names exceed ~40 bytes total — which they always do, since\na namespace looks like `autotune/0.11.0/cuda-0/matmul`.","fix":"Stream to the file instead of buffering the whole bundle. The layout is append-only once the counts\nare known, and both counts (`namespaces.len()`, `entries.len()`) are available before the loop:\n\n```rust\nlet mut out = std::io::BufWriter::new(std::fs::File::create(out)?);\nout.write_all(MAGIC)?;\nout.write_all(&FORMAT_VERSION.to_le_bytes())?;\nwrite_u32(&mut out, metadata.len())?;\nout.write_all(&metadata)?;\nwrite_u32(&mut out, namespaces.len())?;\nfor namespace in &namespaces {\n    write_u32(&mut out, namespace.len())?;\n    out.write_all(namespace.as_bytes())?;\n}\nwrite_u32(&mut out, entries.len())?;\n// First pass: the index, whose offsets are computable from the entry sizes.\nlet mut offset = 0usize;\nfor ((namespace, key), value) in entries { /* write the 20-byte row from `offset` */ }\n// Second pass: the data section, straight from the map.\nfor ((_, key), value) in entries { out.write_all(key)?; out.write_all(value)?; }\nout.flush()?;\n```\n\nThat removes both intermediate `Bytes` buffers and the final copy. If the current shape is kept, at\nminimum size the header estimate correctly (include the namespace table) and stop laundering\n`Vec::with_capacity` through `Bytes::from_bytes_vec`.","locations":[{"ref":"crates/cubecl-environment/src/bundle/flat.rs:42-79","code":"   42 |     let mut index = Bytes::from_bytes_vec(Vec::with_capacity(entries.len() * ENTRY_SIZE));\n   43 |     let mut data = Bytes::from_bytes_vec(Vec::new());\n   44 | \n   45 |     for ((namespace, key), value) in entries {\n   46 |         let id = ids[namespace.as_str()];\n   47 | \n   48 |         let key_offset = data.len();\n   49 |         data.extend_from_byte_slice(key);\n   50 |         let value_offset = data.len();\n   51 |         data.extend_from_byte_slice(value);\n   52 | \n   53 |         index.extend_from_byte_slice(&id.to_le_bytes());\n   54 |         push_u32(&mut index, key_offset)?;\n   55 |         push_u32(&mut index, key.len())?;\n   56 |         push_u32(&mut index, value_offset)?;\n   57 |         push_u32(&mut index, value.len())?;\n   58 |     }\n   59 | \n   60 |     let mut bytes = Bytes::from_bytes_vec(Vec::with_capacity(\n   61 |         64 + metadata.len() + index.len() + data.len(),\n   62 |     ));\n   63 |     bytes.extend_from_byte_slice(MAGIC);\n   64 |     bytes.extend_from_byte_slice(&FORMAT_VERSION.to_le_bytes());\n   65 | \n   66 |     push_u32(&mut bytes, metadata.len())?;\n   67 |     bytes.extend_from_byte_slice(&metadata);\n   68 | \n   69 |     push_u32(&mut bytes, namespaces.len())?;\n   70 |     for namespace in &namespaces {\n   71 |         push_u32(&mut bytes, namespace.len())?;\n   72 |         bytes.extend_from_byte_slice(namespace.as_bytes());\n   73 |     }\n   74 | \n   75 |     push_u32(&mut bytes, entries.len())?;\n   76 |     bytes.extend_from_byte_slice(&index);\n   77 |     bytes.extend_from_byte_slice(&data);\n   78 | \n   79 |     std::fs::write(out, &*bytes)?;","lines":38,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bundle/flat.rs#L42-L79"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"The browser (IndexedDB) backend re-opens the whole database for every single record it writes or\ndeletes. `put`, `delete_record` and `delete_prefix` each start with `open_db().await?`, and\n`open_db` goes through `factory()?.open_with_u32(DB_NAME, 1)?` plus a full\n`request_result` callback round-trip:\n\n```rust\nasync fn put(record_key: &str, bytes: &[u8]) -> Result<(), JsValue> {\n    let db = open_db().await?;\n    let transaction = db.transaction_with_str_and_mode(STORE_NAME, IdbTransactionMode::Readwrite)?;\n    ...\n}\n```\n\n`Storage::insert`/`replace` call `put_in_background` per key, so warming an autotune namespace with\na few hundred entries performs a few hundred separate `indexedDB.open()` calls, each with its own\ntransaction and its own event-loop round trip. `delete_prefix` is worse: it opens the database once\nand then awaits one `store.delete()` round-trip **per record** inside a loop, so purging a namespace\nof N entries costs N sequential round trips (and aborts the rest on the first failure, leaving the\nnamespace half-purged).\n\nOn top of that, `BrowserStorage::insert` clones the value unconditionally\n(`entries::insert(&mut ..., value.clone(), ..)`) and only uses the clone when the result is\n`Insertion::Stored`, so a declined write still pays a full `Bytes::clone` — which, for a native\ncontroller, is a full heap copy (`Bytes::clone` falls back to `try_from_data` because\n`NativeAllocationController::duplicate` returns `None`).","fix":"Hold the `IdbDatabase` open once per `BrowserStorage` (confined to the `spawn_local` task that owns\nit, e.g. behind a `thread_local!` `RefCell<Option<IdbDatabase>>` or an\n`Rc<OnceCell<IdbDatabase>>`), and batch writes:\n\n- cache the database handle so `put`/`delete_record`/`delete_prefix` take `&IdbDatabase` instead of\n  calling `open_db()`;\n- replace the per-record loop in `delete_prefix` with a single `store.delete(&range)` over the\n  key range, keeping the `'/'`-suffix filter by first collecting the keys that belong to this\n  namespace and issuing the deletes on one transaction without awaiting between them;\n- push staged puts through one read-write transaction (a channel drained by a single\n  `spawn_local` task) rather than one transaction per key;\n- avoid the wasted clone:\n\n```rust\nfn insert(&self, key: &[u8], value: Bytes, origin: Origin) -> Insertion {\n    let result = {\n        let mut state = self.state.lock();\n        entries::insert(&mut state.entries, key, value.clone(), origin)\n    };\n    if matches!(result, Insertion::Stored) {\n        self.put_in_background(key, value);\n    }\n    result\n}\n```\n\n  — or better, have `entries::insert` hand the value back on `Conflict` so no clone is needed at\n  all.","locations":[{"ref":"crates/cubecl-environment/src/persistence/browser.rs:96-104","code":"   96 |     fn put_in_background(&self, key: &[u8], value: Bytes) {\n   97 |         let record_key = format!(\"{}{}\", self.prefix, to_hex(key));\n   98 | \n   99 |         wasm_bindgen_futures::spawn_local(async move {\n  100 |             if let Err(err) = put(&record_key, &value).await {\n  101 |                 log::warn!(\"cubecl cache: browser storage put('{record_key}') failed: {err:?}\");\n  102 |             }\n  103 |         });\n  104 |     }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/persistence/browser.rs#L96-L104"},{"ref":"crates/cubecl-environment/src/persistence/browser.rs:327-339","code":"  327 | async fn put(record_key: &str, bytes: &[u8]) -> Result<(), JsValue> {\n  328 |     let db = open_db().await?;\n  329 | \n  330 |     let transaction =\n  331 |         db.transaction_with_str_and_mode(STORE_NAME, IdbTransactionMode::Readwrite)?;\n  332 |     let store = transaction.object_store(STORE_NAME)?;\n  333 | \n  334 |     let value = Uint8Array::from(bytes);\n  335 |     let request = store.put_with_key(&value, &JsValue::from_str(record_key))?;\n  336 |     request_result(&request).await?;\n  337 | \n  338 |     Ok(())\n  339 | }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/persistence/browser.rs#L327-L339"},{"ref":"crates/cubecl-environment/src/persistence/browser.rs:342-373","code":"  342 | async fn delete_prefix(prefix: &str) -> Result<(), JsValue> {\n  343 |     let db = open_db().await?;\n  344 | \n  345 |     let transaction =\n  346 |         db.transaction_with_str_and_mode(STORE_NAME, IdbTransactionMode::Readwrite)?;\n  347 |     let store = transaction.object_store(STORE_NAME)?;\n  348 | \n  349 |     // The range `[prefix, prefix + U+10FFFF)` also spans a nested namespace's\n  350 |     // records (`{prefix}child/{hex}`), so a plain range delete would drop a\n  351 |     // sibling namespace's rows. Enumerate the range and delete only records\n  352 |     // that belong to this exact namespace: their suffix is a hex key, which\n  353 |     // never contains '/'.\n  354 |     let upper = format!(\"{prefix}\\u{10FFFF}\");\n  355 |     let range = IdbKeyRange::bound(&JsValue::from_str(prefix), &JsValue::from_str(&upper))?;\n  356 |     let keys: js_sys::Array = request_result(&store.get_all_keys_with_key(&range)?)\n  357 |         .await?\n  358 |         .dyn_into()?;\n  359 | \n  360 |     for key in keys.iter() {\n  361 |         let Some(record_key) = key.as_string() else {\n  362 |             continue;\n  363 |         };\n  364 |         let belongs = record_key\n  365 |             .strip_prefix(prefix)\n  366 |             .is_some_and(|suffix| !suffix.contains('/'));\n  367 |         if belongs {\n  368 |             request_result(&store.delete(&JsValue::from_str(&record_key))?).await?;\n  369 |         }\n  370 |     }\n  371 | \n  372 |     Ok(())\n  373 | }","lines":32,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/persistence/browser.rs#L342-L373"},{"ref":"crates/cubecl-environment/src/persistence/browser.rs:112-122","code":"  112 |     fn insert(&self, key: &[u8], value: Bytes, origin: Origin) -> Insertion {\n  113 |         let result = entries::insert(&mut self.state.lock().entries, key, value.clone(), origin);\n  114 | \n  115 |         // Only mirror what the arbitration actually accepted; a declined write\n  116 |         // must not overwrite the stored record.\n  117 |         if matches!(result, Insertion::Stored) {\n  118 |             self.put_in_background(key, value);\n  119 |         }\n  120 | \n  121 |         result\n  122 |     }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/persistence/browser.rs#L112-L122"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"very_easy","description":"`do_create_from_slices` copies every upload buffer a second time: `slices: Vec<Vec<u8>>` is already an\nowned `Vec<u8>` per descriptor, yet the body calls `Bytes::from_bytes_vec(data.to_vec())`.\n`Bytes::from_bytes_vec` takes its `Vec<u8>` by value, so `data.to_vec()` is a pure extra full-size\n`memcpy`. The callers (`create_from_slice`, `create_tensor_from_slice`,\n`create_tensors_from_slices`) already paid one copy with `slice.to_vec()`, so creating a tensor from a\nhost slice copies the whole payload twice before it ever reaches the staging buffer — on model\nweights that is hundreds of megabytes of pointless copying and peak host memory.","fix":"Pass the vector through:\n\n```rust\nBytes::from_bytes_vec(data),\n```\n\nBetter still, delete the duplicated body and express the slice variant in terms of the `Bytes` one:\n\n```rust\nfn do_create_from_slices(&self, descriptors: Vec<MemoryLayoutDescriptor>, slices: Vec<Vec<u8>>)\n    -> Result<Vec<MemoryLayout>, IoError> {\n    let data = slices.into_iter().map(Bytes::from_bytes_vec).collect();\n    self.do_create(descriptors, data)\n}\n```","locations":[{"ref":"crates/cubecl-runtime/src/client.rs:466-481","code":"  466 |         let descriptors = descriptors\n  467 |             .into_iter()\n  468 |             .zip(layouts.iter())\n  469 |             .zip(slices)\n  470 |             .map(|((desc, alloc), data)| {\n  471 |                 (\n  472 |                     CopyDescriptor::new(\n  473 |                         alloc.memory.clone().binding(),\n  474 |                         desc.shape,\n  475 |                         alloc.strides.clone(),\n  476 |                         desc.elem_size,\n  477 |                     ),\n  478 |                     Bytes::from_bytes_vec(data.to_vec()),\n  479 |                 )\n  480 |             })\n  481 |             .collect::<Vec<_>>();","lines":16,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/client.rs#L466-L481"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`MetadataInfoCache::evict_least_recently_used` finds the victim with a full linear scan over\n`entries` (`iter().filter().min_by_key()`) plus a `key.clone()` of the victim `Vec<u64>`, and it is\ncalled from `insert` on every cache miss once the cache is at capacity. With the default policy of\n`max_entries = 4096`, every metadata miss on the launch hot path costs a 4096-entry scan — the\ncache exists precisely to remove per-launch overhead. A second effect: when *all* entries are\npinned (`locks > 0`) the scan finds no victim and `insert` still adds the entry, so the cache grows\npast `capacity` without bound and pays an ever-growing scan.","fix":"Track recency in an intrusive order structure instead of rescanning, e.g. keep a\n`BTreeMap<u64, InfoCacheKey>` (clock tick -> key) alongside `entries`, updating it on every `get`\nand popping its first unpinned entry on eviction; that makes eviction O(log n) and removes the\nper-miss scan. Also loop until an eviction actually happens (or skip the insert) so an all-pinned\ncache cannot grow unbounded.","locations":[{"ref":"crates/cubecl-runtime/src/metadata_cache.rs:395-405","code":"  395 |     fn evict_least_recently_used(&mut self) {\n  396 |         let victim = self\n  397 |             .entries\n  398 |             .iter()\n  399 |             .filter(|(_, entry)| entry.locks == 0)\n  400 |             .min_by_key(|(_, entry)| entry.last_used)\n  401 |             .map(|(key, _)| key.clone());\n  402 |         if let Some(key) = victim {\n  403 |             self.entries.remove(&key);\n  404 |         }\n  405 |     }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/metadata_cache.rs#L395-L405"},{"ref":"crates/cubecl-runtime/src/metadata_cache.rs:324-332","code":"  324 |     pub fn insert(&mut self, key: InfoCacheKey, value: V) {\n  325 |         if let Some(capacity) = self.policy.capacity() {\n  326 |             if capacity == 0 {\n  327 |                 return;\n  328 |             }\n  329 |             if self.entries.len() >= capacity {\n  330 |                 self.evict_least_recently_used();\n  331 |             }\n  332 |         }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/metadata_cache.rs#L324-L332"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"medium","difficulty":"very_easy","description":"`identity::launch_ref` hard-codes `CubeDim::new_2d(2, 2)`, i.e. 4 threads per cube. On every GPU backend a\ncube maps to a workgroup of at least one warp/subgroup (32 or 64 lanes), so 28 of 32 lanes idle and the\nkernel dispatches ~8x more cubes than needed; filling a large identity matrix runs at a small fraction of\nachievable bandwidth. Every other launch in this crate sizes the cube with `CubeDim::new(client, n)`.","fix":"Use a hardware-sized 2D cube, e.g.\n```rust\nlet cube_dim = CubeDim::new_2d(32, 8);\n```\n(or derive it from `client.properties().hardware.plane_size_max`), keeping the existing\n`div_ceil`-based `cube_count` computation.","locations":[{"ref":"crates/cubecl-std/src/tensor/identity.rs:61-65","code":"   61 |     let cube_dim = CubeDim::new_2d(2, 2);\n   62 |     let vectors_x = output.shape[1] as u32 / vectorization_factor as u32;\n   63 |     let cube_count_x = vectors_x.div_ceil(cube_dim.x);\n   64 |     let cube_count_y = (output.shape[0] as u32).div_ceil(cube_dim.y);\n   65 |     let cube_count = CubeCount::new_2d(cube_count_x, cube_count_y);","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/identity.rs#L61-L65"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"When `ChannelDeviceState::init` finds the target runner in `Registry::shutting_down`, it releases the\nlock and retries in a bare `std::thread::yield_now()` loop. A shutdown is bounded by\n`SHUTDOWN_JOIN_TIMEOUT` (30 s) and `join_runner` itself falls back to sleeping, so a handle creation\nthat lands on a slow shutdown burns a full core spinning for up to half a minute while re-acquiring\nthe global `CHANNELS` spin lock on every iteration - which also slows the shutdown it is waiting for.","fix":"Mirror the back-off `join_runner` already uses - yield a bounded number of times, then sleep:\n```rust\nlet mut yields: u32 = 0;\n...\ndrop(guard);\nif yields < SHUTDOWN_JOIN_YIELD_BUDGET {\n    std::thread::yield_now();\n    yields += 1;\n} else {\n    std::thread::sleep(SHUTDOWN_JOIN_POLL);\n}\n```","locations":[{"ref":"crates/cubecl-common/src/device/handle/channel.rs:318-344","code":"  318 |         let mut guard_channel = loop {\n  319 |             let mut guard = CHANNELS.lock();\n  320 |             let shutting_down = guard\n  321 |                 .get_or_insert_with(Registry::default)\n  322 |                 .shutting_down\n  323 |                 .contains(&runner_id);\n  324 | \n  325 |             if !shutting_down {\n  326 |                 break guard;\n  327 |             }\n  328 | \n  329 |             if is_device_thread(runner_id.device) {\n  330 |                 // Waiting is not an option: the shutdown covers every runner of this\n  331 |                 // device, including the one running this very code, and it cannot finish\n  332 |                 // until we return. Device-scoped for the same reason the self-join assert\n  333 |                 // in `shutdown_device` is: the runners of a device are joined in an\n  334 |                 // unspecified order, so waiting on a sibling stage can deadlock too.\n  335 |                 return Err(ServiceCreationError::new(\n  336 |                     \"Cannot create a device handle from a runner thread of a device that \\\n  337 |                      is shutting down.\"\n  338 |                         .into(),\n  339 |                 ));\n  340 |             }\n  341 | \n  342 |             drop(guard);\n  343 |             std::thread::yield_now();\n  344 |         };","lines":27,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/device/handle/channel.rs#L318-L344"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`format_str` allocates a whole `String` purely to read back its length:\n`for _ in 0..(&\" \".repeat(indentation * depth).len()) + 1 + indentation`. `\" \".repeat(n).len()` is\njust `n`, so this heap-allocates and drops a string on every closing marker that immediately follows\nits opener. The surrounding loop also rebuilds `\" \".repeat(indentation * depth)` from scratch for\nevery marker and every comma, making indentation O(output length) allocations for a function used on\n`Display` of `KernelId`.","fix":"Replace the allocation with arithmetic and hoist the padding:\n```rust\nfor _ in 0..(indentation * depth) + 1 + indentation {\n    result.pop();\n}\n```\nand push indentation with `result.extend(core::iter::repeat_n(' ', indentation * depth))` instead of\nallocating a `String` per push.","locations":[{"ref":"crates/cubecl-common/src/format.rs:57-61","code":"   57 |                 } else {\n   58 |                     for _ in 0..(&\" \".repeat(indentation * depth).len()) + 1 + indentation {\n   59 |                         result.pop();\n   60 |                     }\n   61 |                     result.push(end);","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/format.rs#L57-L61"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`Database::namespaces` only needs the namespace names, but it obtains them by\ncalling `Database::summary`, which runs\n`SELECT namespace, count(*), sum(length(key) + length(value)) FROM entries GROUP BY namespace`\n— a full scan that reads the length of every key and value blob in the database\n— and then throws both aggregates away. On a populated kernel-compilation cache\nthe values are megabyte-sized binaries, so listing namespaces (used by bundle\nexport) reads the entire cache off disk for nothing.","fix":"Query just the names, which the `(namespace, key)` primary-key index can serve:\n```rust\npub fn namespaces(&self) -> Vec<String> {\n    let result = self.with_connection(|conn| {\n        let mut stmt = conn.prepare(\"SELECT DISTINCT namespace FROM entries ORDER BY namespace\")?;\n        stmt.query_map([], |row| row.get(0))?\n            .collect::<Result<Vec<String>, _>>()\n    });\n    result.unwrap_or_else(|err| {\n        self.warn(\"namespaces\", err);\n        Vec::new()\n    })\n}\n```","locations":[{"ref":"crates/cubecl-environment/src/persistence/sqlite.rs:374-379","code":"  374 |     pub fn namespaces(&self) -> Vec<String> {\n  375 |         self.summary()\n  376 |             .into_iter()\n  377 |             .map(|summary| summary.namespace)\n  378 |             .collect()\n  379 |     }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/persistence/sqlite.rs#L374-L379"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`PersistentPool::get_memory_usage` allocates a `Vec` of references (`collect()`) and then iterates\nit three more times. It is called from `MemoryManagement::configure`, from the `Display` impl and\nfrom the `IoError::PoolCapacityExceeded` construction path, i.e. from paths that may run per\nallocation failure, so the temporary allocation and four passes over all slices are pure waste.","fix":"Fold in one pass:\n\n```rust\nfn get_memory_usage(&self) -> MemoryUsage {\n    let mut usage = MemoryUsage {\n        number_allocs: 0, bytes_in_use: 0, bytes_padding: 0, bytes_reserved: 0,\n    };\n    for slice in self.slices.iter() {\n        usage.bytes_reserved += slice.effective_size();\n        if !slice.is_free() {\n            usage.number_allocs += 1;\n            usage.bytes_in_use += slice.storage.size();\n            usage.bytes_padding += slice.padding;\n        }\n    }\n    usage\n}\n```","locations":[{"ref":"crates/cubecl-runtime/src/memory_management/memory_pool/persistent_pool.rs:198-211","code":"  198 |     fn get_memory_usage(&self) -> MemoryUsage {\n  199 |         let used_slices: Vec<_> = self\n  200 |             .slices\n  201 |             .iter()\n  202 |             .filter(|slice| !slice.is_free())\n  203 |             .collect();\n  204 | \n  205 |         MemoryUsage {\n  206 |             number_allocs: used_slices.len() as u64,\n  207 |             bytes_in_use: used_slices.iter().map(|slice| slice.storage.size()).sum(),\n  208 |             bytes_padding: used_slices.iter().map(|slice| slice.padding).sum(),\n  209 |             bytes_reserved: self.slices.iter().map(|slice| slice.effective_size()).sum(),\n  210 |         }\n  211 |     }","lines":14,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/memory_pool/persistent_pool.rs#L198-L211"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`check_tune` computes `tunables.compute_checksum()` (which concatenates every tunable name and runs\nan MD5 over the result) before the single-tunable fast path is taken, so the checksum is computed and\nimmediately dropped for every autotune key that has only one candidate. The same block also clones\n`value.buffers` in `Compiler::compile` purely to read `bindings.len()`.","fix":"Move the checksum computation below the fast path:\n```rust\n// Fast path: single tunable, no benchmarking needed.\nif results.len() == 1 {\n    self.cache.lock().cache_insert(key.clone(), 0);\n    return TuneCacheResult::Hit { fastest_index: 0 };\n}\n\n#[cfg(autotune_persistence)]\nlet checksum = tunables.compute_checksum();\n```","locations":[{"ref":"crates/cubecl-runtime/src/tune/tuner.rs:280-287","code":"  280 |         #[cfg(autotune_persistence)]\n  281 |         let checksum = tunables.compute_checksum();\n  282 | \n  283 |         // Fast path: single tunable, no benchmarking needed.\n  284 |         if results.len() == 1 {\n  285 |             self.cache.lock().cache_insert(key.clone(), 0);\n  286 |             return TuneCacheResult::Hit { fastest_index: 0 };\n  287 |         }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/tune/tuner.rs#L280-L287"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"medium","description":"The unroll heuristic in `__expand_copy_from_slice_method` can never fire. It calls\n`source.const_len()`, which is `Iterable::const_len` — and `impl Iterable for SliceExpand<E>` in\n`crates/cubecl-core/src/frontend/container/slice/base.rs:544` does *not* override `const_len`, so the\ntrait default (`None`) is always returned. Therefore `unroll` is always `false`, the\n`MEMCPY_UNROLL_LIMIT` constant is effectively unused, and small constant-length copies are always\nemitted as a runtime loop instead of the intended unrolled sequence.","fix":"Derive the constant length from the slice metadata instead of the (always-`None`) `Iterable` default,\ne.g. add to `SliceExpand<E>`:\n\n```rust\npub fn const_len(&self) -> Option<usize> {\n    self.__extract_length_const() // or `self.expand.ty.array_size()` when statically known\n}\n```\n\nand call that inherent method, or drop `MEMCPY_UNROLL_LIMIT` and the `unroll` argument entirely so\nthe dead heuristic stops misleading readers.","locations":[{"ref":"crates/cubecl-core/src/frontend/container/slice/operator.rs:129-150","code":"  129 | // Simple heuristic\n  130 | const MEMCPY_UNROLL_LIMIT: usize = 8;\n  131 | \n  132 | impl<E: CubePrimitive> SliceExpand<E> {\n  133 |     pub fn __expand_copy_from_slice_method(&mut self, scope: &Scope, source: &SliceExpand<E>) {\n  134 |         let len = source.__expand_len_method(scope);\n  135 |         let unroll = source\n  136 |             .const_len()\n  137 |             .is_some_and(|it| it <= MEMCPY_UNROLL_LIMIT);\n  138 |         for_expand(\n  139 |             scope,\n  140 |             range::expand(scope, 0usize.into_expand(scope), len),\n  141 |             unroll,\n  142 |             |scope, idx| {\n  143 |                 copy::expand(\n  144 |                     scope,\n  145 |                     source.__expand_index_method(scope, idx),\n  146 |                     self.__expand_index_mut_method(scope, idx),\n  147 |                 );\n  148 |             },\n  149 |         );\n  150 |     }","lines":22,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/container/slice/operator.rs#L129-L150"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"The `backtrace` cfg alias is never emitted, so `BackTrace::capture()` is a no-op and every\n`ServerError` in the whole workspace reports \"No backtrace available\".\n\n`build.rs` declares:\n\n```rust\nbacktrace: { all(test, feature=\"std\") },\n```\n\nA build script is *not* compiled with `--test`, so `cfg_aliases` evaluates `test` as false and never\nemits `cargo:rustc-cfg=backtrace`. Confirmed from the build script's own output for this crate:\n\n```\ncargo:rustc-check-cfg=cfg(backtrace)\n```\n\n— the matching `cargo:rustc-cfg=backtrace` line is absent, while `multi_threading`, `stream_local`\nand `std_io` all have theirs. Consequently `BackTrace::capture()` always takes the\n`#[cfg(not(backtrace))]` arm and stores `state: None`, `BacktraceState` is always\n`alloc::string::String`, and the whole `backtrace_std` module is dead. The `backtrace` crate is\nstill pulled in and compiled by the `std` feature (`std = [... \"dep:backtrace\" ...]`) for nothing.\n\nEvery error-reporting site that pays for `BackTrace::capture()` (e.g.\n`crates/cubecl-cuda/src/compute/sync/fence.rs:49-60`) therefore produces an error with no\ndiagnostic value at all.","fix":"`test` cannot be evaluated by a build script. Gate the alias on a real cargo feature instead, e.g.\nadd a `backtrace` feature to `Cargo.toml`:\n\n```toml\n[features]\nbacktrace = [\"std\", \"dep:backtrace\"]\n```\n\nand change `build.rs` to\n\n```rust\nbacktrace: { feature = \"backtrace\" },\n```\n\nAlso move `dep:backtrace` out of the `std` feature list so the dependency is only compiled when the\nalias can actually be on. If backtraces really are meant to be test-only, keep the feature and turn\nit on for `cargo test` via `[dev-dependencies]`/`required-features` rather than through `cfg(test)`.","locations":[{"ref":"crates/cubecl-environment/build.rs:20-21","code":"   20 |         // TODO: We can't yet activate it for everything because of how error handling is done in matmul.\n   21 |         backtrace: { all(test, feature=\"std\") },","lines":2,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/build.rs#L20-L21"},{"ref":"crates/cubecl-environment/src/backtrace.rs:1-4","code":"    1 | #[cfg(backtrace)]\n    2 | type BacktraceState = backtrace_std::BacktraceState;\n    3 | #[cfg(not(backtrace))]\n    4 | type BacktraceState = alloc::string::String;","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/backtrace.rs#L1-L4"},{"ref":"crates/cubecl-environment/src/backtrace.rs:38-53","code":"   38 |     pub fn capture() -> Self {\n   39 |         Self {\n   40 |             #[cfg(backtrace)]\n   41 |             state: {\n   42 |                 // We only resolve the backtrace when displaying the result.\n   43 |                 //\n   44 |                 // Making it cheaper to create.\n   45 |                 //\n   46 |                 // We capture the backtrace here to reduce the number of frames to ignore.\n   47 |                 let backtrace = backtrace::Backtrace::new_unresolved();\n   48 |                 Some(BacktraceState::new(backtrace))\n   49 |             },\n   50 |             #[cfg(not(backtrace))]\n   51 |             state: None,\n   52 |         }\n   53 |     }","lines":16,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/backtrace.rs#L38-L53"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"very_easy","description":"`Launch::define_body` builds a `HashMap` of define mappings with a hand-written loop and then\nthrows it away one line later by shadowing it with `let mapping = self.func.sig.define_mappings();`.\nThe discarded loop is a verbatim copy of `KernelSignature::define_mappings`\n(`crates/cubecl-macros/src/parse/signature.rs:187-202`), so it is both dead code and duplicated\nlogic executed for every `#[cube(launch)]` kernel.","fix":"Delete the dead loop and keep the single call:\n```rust\nlet io_map = self.io_mappings();\nlet mapping = self.func.sig.define_mappings();\nlet register_type = self.func.analysis.register_types(mapping, quote![builder.scope], true, true);\n```\n(removing the `let mut mapping = HashMap::new(); for param in ... { ... }` block, and the now\nunused `use std::collections::HashMap;` import).","locations":[{"ref":"crates/cubecl-macros/src/generate/kernel.rs:223-241","code":"  223 |         let io_map = self.io_mappings();\n  224 |         let mut mapping = HashMap::new();\n  225 |         for param in self.func.sig.parameters.iter() {\n  226 |             for define in param.defines.iter() {\n  227 |                 match define {\n  228 |                     DefinedGeneric::Single(ident) => {\n  229 |                         mapping.insert(ident.clone(), (param.name.clone(), None));\n  230 |                     }\n  231 |                     DefinedGeneric::Multiple(ident, index) => {\n  232 |                         mapping.insert(ident.clone(), (param.name.clone(), Some(*index)));\n  233 |                     }\n  234 |                 }\n  235 |             }\n  236 |         }\n  237 |         let mapping = self.func.sig.define_mappings();\n  238 |         let register_type =\n  239 |             self.func\n  240 |                 .analysis\n  241 |                 .register_types(mapping, quote![builder.scope], true, true);","lines":19,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/kernel.rs#L223-L241"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`mod normal_channel` is a complete second `DeviceClient` implementation (~75 lines: `new`,\n`enqueue`, `flush`, `request_shutdown`, `Clone`) that is never compiled into anything - it is\n`#[allow(dead_code)]` and the only import is `use custom_channel::DeviceClient;`, with the\nalternative left as the commented-out line `// use normal_channel::DeviceClient;`. It duplicates the\npublic shape of the live client, so it silently rots: for instance its `CHANNEL_MAX_TASK` is a\nseparate copy of the same constant, and any change to the `DeviceClient` contract (as `request_shutdown`\nwas added) has to be mirrored by hand with no compiler help.","fix":"Either delete `mod normal_channel` (it is recoverable from git history), or put it behind a real\ncfg so it is type-checked when selected, e.g.\n```rust\n#[cfg(feature = \"device-channel-debug\")]\nuse normal_channel::DeviceClient;\n#[cfg(not(feature = \"device-channel-debug\"))]\nuse custom_channel::DeviceClient;\n```","locations":[{"ref":"crates/cubecl-common/src/device/handle/channel.rs:730-804","code":"  730 | /// A normal channel implementation, use for debugging.\n  731 | #[allow(dead_code)]\n  732 | mod normal_channel {\n  733 |     use super::RunnerId;\n  734 |     use crate::device::handle::CallError;\n  735 |     use alloc::boxed::Box;\n  736 |     use std::sync::mpsc::SyncSender;\n  737 | \n  738 |     /// Buffer size for the command channel.\n  739 |     pub const CHANNEL_MAX_TASK: usize = 32;\n  740 | \n  741 |     /// The client-side handle used to enqueue tasks.\n  742 |     pub struct DeviceClient {\n  743 |         state: SyncSender<Box<dyn FnOnce() + Send + 'static>>,\n  744 |         runner_id: RunnerId,\n  745 |     }\n  746 | \n  747 |     impl Clone for DeviceClient {\n  748 |         fn clone(&self) -> Self {\n  749 |             Self {\n  750 |                 state: self.state.clone(),\n  751 |                 runner_id: self.runner_id,\n  752 |             }\n  753 |         }\n  754 |     }\n  755 | \n  756 |     impl DeviceClient {\n  757 |         /// Gets the device id associated to the channel.\n  758 |         pub fn runner_id(&self) -> &RunnerId {\n  759 |             &self.runner_id\n  760 |         }\n  761 |         /// Creates a new channel and spawns a server thread to process it.\n  762 |         pub fn new<I: FnOnce() + Send + 'static>(\n  763 |             runner_id: RunnerId,\n  764 |             init: I,\n  765 |         ) -> (Self, std::thread::JoinHandle<()>) {\n  766 |             let (sender, recv) = std::sync::mpsc::sync_channel::<Box<dyn FnOnce() + Send + 'static>>(\n  767 |                 CHANNEL_MAX_TASK,\n  768 |             );\n  769 | \n  770 |             let thread = std::thread::spawn(move || {\n  771 |                 init();\n  772 |                 // `Err` means every sender is gone and the queue is drained:\n  773 |                 // no task can ever arrive again.\n  774 |                 while let Ok(item) = recv.recv() {\n  775 |                     item()\n  776 |                 }\n  777 |             });\n  778 | \n  779 |             (\n  780 |                 Self {\n  781 |                     state: sender,\n  782 |                     runner_id,\n  783 |                 },\n  784 |                 thread,\n  785 |             )\n  786 |         }\n  787 | \n  788 |         /// Nothing to do: the server stops once every client is dropped and\n  789 |         /// the queue is drained.\n  790 |         pub fn request_shutdown(&self) {}\n  791 | \n  792 |         /// Atomically reserves a slot in the buffer and writes the task.\n  793 |         pub fn enqueue<F: FnOnce() + Send + 'static>(&self, func: F) -> Result<(), CallError> {\n  794 |             self.state\n  795 |                 .send(Box::new(func))\n  796 |                 .map_err(|_| CallError::disconnected())\n  797 |         }\n  798 | \n  799 |         /// Forces a flush by filling the remaining buffer with no-op tasks.\n  800 |         pub fn flush(&self) {\n  801 |             // Nothing to do.\n  802 |         }\n  803 |     }\n  804 | }","lines":75,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/device/handle/channel.rs#L730-L804"},{"ref":"crates/cubecl-common/src/device/handle/channel.rs:17-21","code":"   17 | use custom_channel::DeviceClient;\n   18 | \n   19 | // For debugging and benchmarking.\n   20 | //\n   21 | // use normal_channel::DeviceClient;","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/device/handle/channel.rs#L17-L21"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`cubecl_environment::sync::ThreadId` is a public, `#[allow(dead_code)]` newtype\nover `NonZeroU64` with no constructor, no conversion and no user anywhere in the\nworkspace (`grep -rn ThreadId crates/` matches only its own definition and doc).\nIts doc claims it \"is a stub when no std is available to swap with\n`std::thread::ThreadId`\", but it is compiled unconditionally and `std`'s type is\nnever re-exported in its place, so on std targets the shim exports a type that\ncan never hold a real thread id.","fix":"Delete the type (it has no users), or make it an actual alias so the doc becomes\ntrue:\n```rust\n#[cfg(feature = \"std\")]\npub use std::thread::ThreadId;\n\n#[cfg(not(feature = \"std\"))]\n#[derive(Eq, PartialEq, Clone, Copy, Hash, Debug)]\npub struct ThreadId(core::num::NonZeroU64);\n```","locations":[{"ref":"crates/cubecl-environment/src/sync/base.rs:133-140","code":"  133 | /// An opaque thread identifier.\n  134 | ///\n  135 | /// This is a stub when no std is available to swap with `std::thread::ThreadId`.\n  136 | /// There is no way to obtain one on such targets, so it exists only to keep\n  137 | /// thread-keyed types nameable.\n  138 | #[allow(dead_code)]\n  139 | #[derive(Eq, PartialEq, Clone, Copy, Hash, Debug)]\n  140 | pub struct ThreadId(core::num::NonZeroU64);","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/sync/base.rs#L133-L140"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`type_name_format` has two branches that can never be taken, because `str::split` always yields at\nleast one item and `Iterator::next` on it is always `Some`:\n\n* `TypeNameFormatLevel::Short`: `if let Some(val) = name.split(\"<\").next() { .. } else {\n  name.to_string() }` — the `else` arm is dead.\n* `TypeNameFormatLevel::Balanced`: `let before_generic = split.next();` followed by\n  `match before_generic { None => return name.to_string(), .. }` — the `None` arm is dead.\n\nBoth suggest the author expected `split(..).next()` to be fallible; the dead fallbacks make the\nfunction look like it handles an empty name specially when it does not.","fix":"Drop the impossible arms:\n\n```rust\nTypeNameFormatLevel::Short => name\n    .split('<')\n    .next()\n    .unwrap_or(name)\n    .split(\"::\")\n    .last()\n    .unwrap_or(name)\n    .to_string(),\n```\nand in `Balanced` replace `let before_generic = match before_generic { None => return .., Some(val) => .. }`\nwith a direct `let before_generic = split.next().unwrap_or(name)` chain.","locations":[{"ref":"crates/cubecl-runtime/src/config/base.rs:206-232","code":"  206 | pub fn type_name_format(name: &str, level: TypeNameFormatLevel) -> String {\n  207 |     match level {\n  208 |         TypeNameFormatLevel::Full => name.to_string(),\n  209 |         TypeNameFormatLevel::Short => {\n  210 |             if let Some(val) = name.split(\"<\").next() {\n  211 |                 val.split(\"::\").last().unwrap_or(name).to_string()\n  212 |             } else {\n  213 |                 name.to_string()\n  214 |             }\n  215 |         }\n  216 |         TypeNameFormatLevel::Balanced => {\n  217 |             let mut split = name.split(\"<\");\n  218 |             let before_generic = split.next();\n  219 |             let after_generic = split.next();\n  220 | \n  221 |             let before_generic = match before_generic {\n  222 |                 None => return name.to_string(),\n  223 |                 Some(val) => val\n  224 |                     .split(\"::\")\n  225 |                     .last()\n  226 |                     .unwrap_or(val)\n  227 |                     .trim()\n  228 |                     .replace(\">\", \"\")\n  229 |                     .to_string(),\n  230 |             };\n  231 |             let inside_generic = match after_generic {\n  232 |                 None => return before_generic.to_string(),","lines":27,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/config/base.rs#L206-L232"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"Two defects in `PendingDropQueue`:\n\n* The \"Safety net\" block in `flush` is unreachable. `self.pending` is only ever filled by the\n  `core::mem::swap(&mut self.pending, &mut self.staged)` at the end of `flush`, and that same `flush`\n  always continues on to `self.fence = Some(factory());`. So `self.pending` non-empty implies\n  `self.fence.is_some()`, which means the preceding `if let Some(event) = self.fence.take()` already\n  cleared `pending` — the `if !self.pending.is_empty()` branch can never run.\n* The doc on the `pending` field refers to a field that does not exist: \"kept alive until `event`\n  fires\" — the field is named `fence` (it was presumably renamed and this comment was missed).","fix":"Delete the unreachable block (or downgrade it to a `debug_assert!(self.pending.is_empty())`) and fix\nthe field doc:\n\n```rust\n    /// Bytes from the *previous* flush cycle, kept alive until `fence` is signalled.\n    pending: Vec<Bytes>,\n```","locations":[{"ref":"crates/cubecl-runtime/src/memory_management/drop_queue/queue.rs:149-159","code":"  149 |         // Safety net: if pending is somehow still populated (no prior fence),\n  150 |         // stall immediately rather than freeing memory the GPU might still\n  151 |         // be reading.\n  152 |         if !self.pending.is_empty() {\n  153 |             let event = factory();\n  154 |             event.sync();\n  155 |             self.pending.clear();\n  156 |         }\n  157 | \n  158 |         // The current staged batch becomes the new pending batch.\n  159 |         core::mem::swap(&mut self.pending, &mut self.staged);","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/drop_queue/queue.rs#L149-L159"},{"ref":"crates/cubecl-runtime/src/memory_management/drop_queue/queue.rs:57-62","code":"   57 |     /// Fence signalling that the device has consumed everything in `pending`.\n   58 |     fence: Option<E>,\n   59 |     /// Bytes from the *previous* flush cycle, kept alive until `event` fires.\n   60 |     pending: Vec<Bytes>,\n   61 |     /// Bytes queued in the *current* cycle, not yet associated with a fence.\n   62 |     staged: Vec<Bytes>,","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/drop_queue/queue.rs#L57-L62"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`AutotuneError::NoValidKernelFound` is never constructed anywhere in the workspace (only its\ndeclaration and a test comment in `tune/base.rs` mention it), yet its doc comment states\n\"This is an unrecoverable error and will cause a panic\" and `tune/base.rs` documents the empty-batch\ncase as \"aborts with NoValidKernelFound\". The real behaviour is a bare `panic!` with a different\nmessage, so the variant is dead code and the documentation is misleading.","fix":"Either construct it where the plan is exhausted (see the `run_plan` finding) so the documented\nbehaviour becomes true, or delete the variant and fix the comment in\n`crates/cubecl-runtime/src/tune/base.rs` that refers to it.","locations":[{"ref":"crates/cubecl-runtime/src/tune/tuner.rs:79-88","code":"   79 |     /// No autotune was flagged as valid for the problem.\n   80 |     ///\n   81 |     /// # Warning\n   82 |     ///\n   83 |     /// This is an unrecoverable error and will cause a panic.\n   84 |     #[display(\"No autotune was flagged as valid for the problem.\\n{context}\")]\n   85 |     NoValidKernelFound {\n   86 |         /// The formatted context on why no valid kernel was found.\n   87 |         context: String,\n   88 |     },","lines":10,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/tune/tuner.rs#L79-L88"}]},
