{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`impl Display for MemoryUsage` divides by unchecked denominators:\n`self.bytes_in_use as f32 / self.bytes_reserved as f32` and\n`self.bytes_padding as f32 / self.bytes_in_use as f32`. A fresh or fully-cleaned\n`MemoryManagement` reports `bytes_reserved == 0` and `bytes_in_use == 0` (see\n`capped_lazy_pool_cleanup_still_frees`, which asserts `bytes_reserved == 0`), so the report printed by\n`MemoryManagement::print_memory_usage` / `Display for MemoryManagement` reads\n`Usage efficiency: NaN%` and `Padding overhead: NaN%`. This is the report a user is told to look at\nwhen diagnosing an OOM.","fix":"```rust\nlet ratio = |num: u64, den: u64| if den == 0 { 0.0 } else { num as f32 / den as f32 * 100.0 };\nlet usage_percentage = ratio(self.bytes_in_use, self.bytes_reserved);\nlet padding_percentage = ratio(self.bytes_padding, self.bytes_in_use);\n```","locations":[{"ref":"crates/cubecl-runtime/src/memory_management/base.rs:73-94","code":"   73 | impl core::fmt::Display for MemoryUsage {\n   74 |     fn fmt(&self, f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result {\n   75 |         // In the future it'd be nice if MemoryUsage also held some stats about say,\n   76 |         // the 5 biggest allocations, to show when you an OOM.\n   77 |         let usage_percentage = (self.bytes_in_use as f32 / self.bytes_reserved as f32) * 100.0;\n   78 |         let padding_percentage = (self.bytes_padding as f32 / self.bytes_in_use as f32) * 100.0;\n   79 |         writeln!(f, \"Memory Usage Report:\")?;\n   80 |         writeln!(f, \"  Number of allocations: {}\", self.number_allocs)?;\n   81 |         writeln!(f, \"  Bytes in use: {}\", bytes_format(self.bytes_in_use))?;\n   82 |         writeln!(\n   83 |             f,\n   84 |             \"  Bytes used for padding: {}\",\n   85 |             bytes_format(self.bytes_padding)\n   86 |         )?;\n   87 |         writeln!(\n   88 |             f,\n   89 |             \"  Total bytes reserved: {}\",\n   90 |             bytes_format(self.bytes_reserved)\n   91 |         )?;\n   92 |         writeln!(f, \"  Usage efficiency: {usage_percentage:.2}%\")?;\n   93 |         writeln!(f, \"  Padding overhead: {padding_percentage:.2}%\")\n   94 |     }","lines":22,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/memory_management/base.rs#L73-L94"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The doc comment on `Schedule` claims \"The sample cap bounds the work at `max_samples` per candidate,\nso the sampling itself can never cost more than a fixed-count pass\", but `first_pass` loops\n`while candidate.samples.len() < required` with `required = self.config.short_circuit_samples()` and\nnever consults `max_samples`. With a config where `short_circuit_samples > max_samples`\n(both are user-settable and clamped independently - `short_circuit_samples()` only clamps to `>= 1`),\nthe first candidate is sampled `short_circuit_samples` times, exceeding the advertised ceiling; the\nper-candidate guard `candidate.samples.len() >= max_samples` only exists in the later rounds.","fix":"Clamp the confirmation budget to the sample cap:\n```rust\nlet (_, max_samples) = self.config.samples();\nlet required = self.config.short_circuit_samples().min(max_samples);\nwhile candidate.samples.len() < required { ... }\n```","locations":[{"ref":"crates/cubecl-runtime/src/tune/schedule.rs:36-41","code":"   36 | /// The sample cap bounds the work at `max_samples` per candidate, so the sampling itself can never\n   37 | /// cost more than a fixed-count pass. The batch still can: the short circuit exits on the first\n   38 | /// candidate confirmed under the limit, and eliminating cheap candidates early can push that exit\n   39 | /// past kernels a fixed pass would have accepted and stopped at. Measured at +13.6% total tuning\n   40 | /// cost on one card and −20% on another, both dominated by where the short circuit fires rather\n   41 | /// than by the sample budget.","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/tune/schedule.rs#L36-L41"},{"ref":"crates/cubecl-runtime/src/tune/schedule.rs:290-297","code":"  290 |         let required = self.config.short_circuit_samples();\n  291 |         while candidate.samples.len() < required {\n  292 |             if !self.take_sample(operation, inputs, client, candidate).await {\n  293 |                 return false;\n  294 |             }\n  295 |         }\n  296 | \n  297 |         candidate.samples.confirmed_under(limit, required)","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/tune/schedule.rs#L290-L297"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Swizzle::new` computes `repeats_after` as `1 << (base + bits + max(shift, 0))`, which ignores the\nmagnitude of a **negative** shift. With `shift < 0` the masked `YYY` bits sit at\n`[base, base + bits)` (`yyy_mask = mask << base`) and `apply` shifts them *left* by `|shift|`\n(`shift_right(.., invert = true)`), so the highest address bit the swizzle touches is\n`base + |shift| + bits`, not `base + bits`. Callers that align a shared-memory buffer to\n`repeats_after()` (as the doc comment instructs) therefore under-align by a factor of `2^|shift|` and the\nswizzle desynchronises from the real address across the boundary.","fix":"Use the absolute shift when the pattern is inverted:\n```rust\nlet repeats_after = comptime![if bits > 0 {\n    1u32 << (base + bits + shift.unsigned_abs())\n} else {\n    1u32 << base\n}];\n```","locations":[{"ref":"crates/cubecl-std/src/swizzle.rs:47-62","code":"   47 |     pub fn new(#[comptime] bits: u32, #[comptime] base: u32, #[comptime] shift: i32) -> Self {\n   48 |         let invert_shift = shift < 0;\n   49 |         let mask = (1u32 << bits) - 1;\n   50 |         let yyy_mask = comptime![mask << (base + Ord::max(shift, 0) as u32)];\n   51 |         let repeats_after = comptime![if bits > 0 {\n   52 |             1u32 << (base + bits + Ord::max(shift, 0) as u32)\n   53 |         } else {\n   54 |             1u32 << base\n   55 |         }];\n   56 |         Swizzle {\n   57 |             yyy_mask,\n   58 |             shift: comptime![shift.unsigned_abs()],\n   59 |             invert_shift,\n   60 |             repeats_after,\n   61 |         }\n   62 |     }","lines":16,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/swizzle.rs#L47-L62"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"`Assign::assign_body_comptime_variant` forgets the `#` interpolation on the second occurrence of\n`variant_name` in the `Style::Unit` arm, so the generated match arm refers to a literal associated\nitem `Self::variant_name` that does not exist:\n```rust\nStyle::Unit => {\n    quote![(Self::#variant_name, Self::variant_name) => {}]\n}\n```\nEvery `#[derive(CubeTypeMut)]` on a comptime enum that has a unit variant therefore expands to code\nthat cannot compile (`no variant or associated item named 'variant_name' found`). No in-tree type\nhits this path (all `CubeTypeMut` enums in the repo use `#[cube(runtime_variants)]`), so the bug is\ninvisible until a user derives it.","fix":"Interpolate the ident on both sides:\n```rust\nStyle::Unit => {\n    quote![(Self::#variant_name, Self::#variant_name) => {}]\n}\n```","locations":[{"ref":"crates/cubecl-macros/src/generate/assign.rs:167-169","code":"  167 |             Style::Unit => {\n  168 |                 quote![(Self::#variant_name, Self::variant_name) => {}]\n  169 |             }","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/assign.rs#L167-L169"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`CubeImpl::to_tokens_mut` renames the **first** path segment when deriving the expand type name,\nwhile the equivalent code in `cube_trait.rs` renames the **last**:\n```rust\nsyn::Type::Path(mut pat) => {\n    let seg = pat.path.segments.first_mut().unwrap();\n    let struct_expand_name = Ident::new(format!(\"{}Expand\", seg.ident).as_str(), self.struct_name.span());\n    seg.ident = struct_expand_name;\n    quote![#pat]\n}\n```\n(compare `crates/cubecl-macros/src/generate/cube_trait.rs:183`, `let struct_ident =\nstruct_name.path.segments.last_mut().unwrap();`). For `#[cube] impl my_module::MyType { ... }` this\nproduces `my_moduleExpand::MyType` instead of `my_module::MyTypeExpand`, so the generated expand impl\ntargets a path that does not exist.","fix":"Rename the last segment, matching `cube_trait.rs`:\n```rust\nlet seg = pat.path.segments.last_mut().unwrap();\n```","locations":[{"ref":"crates/cubecl-macros/src/generate/cube_impl.rs:53-65","code":"   53 |             // We use the expand convention to find the correct expand type.\n   54 |             let struct_expand_name = match self.struct_name.clone() {\n   55 |                 syn::Type::Path(mut pat) => {\n   56 |                     let seg = pat.path.segments.first_mut().unwrap();\n   57 |                     let struct_expand_name = Ident::new(\n   58 |                         format!(\"{}Expand\", seg.ident).as_str(),\n   59 |                         self.struct_name.span(),\n   60 |                     );\n   61 |                     seg.ident = struct_expand_name;\n   62 |                     quote![#pat]\n   63 |                 }\n   64 |                 name => quote![#name],\n   65 |             };","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/cube_impl.rs#L53-L65"},{"ref":"crates/cubecl-macros/src/generate/cube_trait.rs:183-184","code":"  183 |         let struct_ident = struct_name.path.segments.last_mut().unwrap();\n  184 |         struct_ident.ident = format_ident!(\"{}Expand\", struct_ident.ident);","lines":2,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/generate/cube_trait.rs#L183-L184"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`ComptimeOptionExpand::__expand_as_deref_mut_method` is a verbatim copy of\n`__expand_as_deref_method`: it takes `self` by value, requires `T: DerefMut`, and then calls\n`__expand_map_method(scope, |scope, it| it.__expand_deref_method(scope))` - the immutable deref. The\n`DerefMut` bound therefore restricts callers for nothing, and the `_mut` in the name promises\nmutable access the body never provides (contrast the Rust-side `ComptimeOption::as_deref_mut` at\nlines 582-588, which correctly goes through `self.as_mut().map(DerefMut::deref_mut)`).","fix":"Either add a mutable counterpart to `DerefExpand` and call it here, or drop the misleading method and\nthe unused `DerefMut` bound and keep only `__expand_as_deref_method`.","locations":[{"ref":"crates/cubecl-core/src/frontend/comptime_option.rs:1062-1079","code":" 1062 |             pub fn __expand_as_deref_method(self, scope: &Scope) -> ComptimeOptionExpand<T::Target>\n 1063 |             where\n 1064 |                 T: Deref<Target: CubeType + Sized>,\n 1065 |                 T::ExpandType: DerefExpand<Target = <T::Target as CubeType>::ExpandType>,\n 1066 |             {\n 1067 |                 self.__expand_map_method(scope, |scope, it| it.__expand_deref_method(scope))\n 1068 |             }\n 1069 | \n 1070 |             pub fn __expand_as_deref_mut_method(\n 1071 |                 self,\n 1072 |                 scope: &Scope,\n 1073 |             ) -> ComptimeOptionExpand<T::Target>\n 1074 |             where\n 1075 |                 T: DerefMut<Target: CubeType + Sized>,\n 1076 |                 T::ExpandType: DerefExpand<Target = <T::Target as CubeType>::ExpandType>,\n 1077 |             {\n 1078 |                 self.__expand_map_method(scope, |scope, it| it.__expand_deref_method(scope))\n 1079 |             }","lines":18,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/comptime_option.rs#L1062-L1079"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`OptionExpand::__expand_as_deref_mut_method` is a verbatim copy of `__expand_as_deref_method` - it requires\n`T: DerefMut` but then calls the immutable `__expand_deref_method`:\n```rust\npub fn __expand_as_deref_mut_method(self, scope: &Scope) -> OptionExpand<T::Target>\nwhere\n    T: DerefMut<Target: CubeType + Default + IntoRuntime>,\n    ...\n{\n    self.__expand_map_method(scope, |scope, value| value.__expand_deref_method(scope))\n}\n```\nEither the mutable deref is silently downgraded to a shared one (so `as_deref_mut()` hands back a value the caller\ncannot write through), or the two methods are genuinely interchangeable and one of them is dead weight; nothing in\nthe code distinguishes them.","fix":"Call the mutable accessor and require the matching expand trait, e.g.:\n```rust\n-            self.__expand_map_method(scope, |scope, value| value.__expand_deref_method(scope))\n+            self.__expand_map_method(scope, |scope, value| value.__expand_deref_mut_method(scope))\n```\n(adding a `DerefMutExpand` bound), or delete `__expand_as_deref_mut_method` and document that `as_deref` covers\nboth cases.","locations":[{"ref":"crates/cubecl-core/src/frontend/runtime_option.rs:294-310","code":"  294 |         pub fn __expand_as_deref_method(self, scope: &Scope) -> OptionExpand<T::Target>\n  295 |         where\n  296 |             T: Deref<Target: CubeType + Default + IntoRuntime>,\n  297 |             T::ExpandType: DerefExpand<Target = <T::Target as CubeType>::ExpandType>,\n  298 |             <T::Target as CubeType>::ExpandType: RuntimeAssign,\n  299 |         {\n  300 |             self.__expand_map_method(scope, |scope, value| value.__expand_deref_method(scope))\n  301 |         }\n  302 | \n  303 |         pub fn __expand_as_deref_mut_method(self, scope: &Scope) -> OptionExpand<T::Target>\n  304 |         where\n  305 |             T: DerefMut<Target: CubeType + Default + IntoRuntime>,\n  306 |             T::ExpandType: DerefExpand<Target = <T::Target as CubeType>::ExpandType>,\n  307 |             <T::Target as CubeType>::ExpandType: RuntimeAssign,\n  308 |         {\n  309 |             self.__expand_map_method(scope, |scope, value| value.__expand_deref_method(scope))\n  310 |         }","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/runtime_option.rs#L294-L310"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`CubeTrait::from_item_trait` runs the identical `attrs.retain(|attr| !attr.path().is_ident(\"cube\"));`\nstatement twice in a row - the second call is a no-op left over from a paste. In the sibling\n`CubeTraitImpl::from_item_impl` the same `attrs` local is computed and filtered but then never\nused at all (`CubeTraitImpl` has no `attrs` field), so the retained attributes are silently\ndropped.","fix":"Delete the duplicated line in `from_item_trait`:\n```rust\nlet mut attrs = item.attrs;\nattrs.retain(|attr| !attr.path().is_ident(\"cube\"));\n```\nand in `from_item_impl` either drop the dead `let mut attrs = ...; attrs.retain(...)` pair or add\nan `attrs` field to `CubeTraitImpl` and re-emit them on the generated impl.","locations":[{"ref":"crates/cubecl-macros/src/parse/cube_trait.rs:189-192","code":"  189 |         let mut attrs = item.attrs;\n  190 |         attrs.retain(|attr| !attr.path().is_ident(\"cube\"));\n  191 |         attrs.retain(|attr| !attr.path().is_ident(\"cube\"));\n  192 |         let vis = item.vis;","lines":4,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/cube_trait.rs#L189-L192"},{"ref":"crates/cubecl-macros/src/parse/cube_trait.rs:257-259","code":"  257 |         let mut attrs = item_impl.attrs;\n  258 |         attrs.retain(|attr| !attr.path().is_ident(\"cube\"));\n  259 |         let unsafety = item_impl.unsafety;","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-macros/src/parse/cube_trait.rs#L257-L259"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The fallback arm of `__expand_tensor_map_store_method` panics with\n`\"TMA store supports 1D-5D loads\"` — the message was copied from the load implementation above\n(`\"TMA only supports 1D-5D loads\"`) and still says \"loads\" while this is the store path, so the\npanic misdirects whoever reads it.","fix":"```rust\n_ => panic!(\"TMA store only supports 1D-5D stores\"),\n```","locations":[{"ref":"crates/cubecl-std/src/tensor/view/operations/tensor_map.rs:424-433","code":"  424 |             5 => {\n  425 |                 let v = as_i32(scope, pos, 0);\n  426 |                 let w = as_i32(scope, pos, 1);\n  427 |                 let z = as_i32(scope, pos, 2);\n  428 |                 let y = as_i32(scope, pos, 3);\n  429 |                 let x = as_i32(scope, pos, 4);\n  430 |                 tma_store_5d::expand(scope, shared_memory, &mut this, v, w, z, y, x);\n  431 |             }\n  432 |             _ => panic!(\"TMA store supports 1D-5D loads\"),\n  433 |         }","lines":10,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/view/operations/tensor_map.rs#L424-L433"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"When `S::init(device_id)` panics inside `initialize_service`, the panic is caught and merely logged\nby the task shim (`Task::init`'s `catch_unwind` does `log::warn!(...)`), so `callback` is dropped\nwithout ever sending. `init` then reaches `let service = recv.recv().unwrap();` and dies with an\nopaque `RecvError` unwrap panic, discarding the real cause - even though the function's return type\nis `Result<Self, ServiceCreationError>` and the same function already produces a proper\n`\"Service initialization failed\"` error for the on-runner-thread path\n(`catch_unwind(AssertUnwindSafe(initialize_service))`). `ChannelDeviceHandle::new` then compounds\nthis by calling `.unwrap()` on the result, so a shutting-down device (a documented `Err` case,\n`\"Cannot create a device handle from a runner thread of a device that is shutting down.\"`) also turns\ninto a panic instead of a returned error.","fix":"Convert the channel failure into the existing error type:\n```rust\nlet service = recv.recv().map_err(|_| {\n    ServiceCreationError::new(\"Device runner died while initializing the service\".into())\n})?;\n```\nand give `DeviceHandleSpec::new` a fallible sibling (or make `new` return\n`Result<Self, ServiceCreationError>`) so `ChannelDeviceHandle::new` stops calling `.unwrap()` on a\nreachable `Err`.","locations":[{"ref":"crates/cubecl-common/src/device/handle/channel.rs:404-418","code":"  404 |         } else {\n  405 |             device_client.enqueue(initialize_service).unwrap();\n  406 |             device_client.flush();\n  407 |         };\n  408 | \n  409 |         let service = recv.recv().unwrap();\n  410 | \n  411 |         let service = match service {\n  412 |             Ok(service) => service,\n  413 |             Err(_) => {\n  414 |                 return Err(ServiceCreationError::new(\n  415 |                     \"Service already initialized.\".into(),\n  416 |                 ));\n  417 |             }\n  418 |         };","lines":15,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/device/handle/channel.rs#L404-L418"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Database::insert_many` reports a wholly failed batch as an all-zero\n`InsertSummary`. When the transaction fails (`insert_one` errors, or\n`transaction.commit()` fails after the busy timeout) the `?` aborts the closure,\nthe transaction rolls back, and the error arm returns `InsertSummary::default()`\n— which has `failed: 0`. `bundle::import` sums exactly that field\n(`total.failed += summary.failed;` and only warns `if total.failed > 0`), so an\nimport whose every entry was lost is reported as \"0 stored, 0 conflict, 0\nfailed\": a silent, invisible data loss. The `Storage` contract explicitly\nrequires a failed write to be distinguishable from \"someone got there first\".","fix":"Count the entries the batch was asked to write and report them as failed:\n```rust\nlet mut attempted = 0usize;\nlet result = self.with_connection(|conn| {\n    let transaction = conn.transaction_with_behavior(TransactionBehavior::Immediate)?;\n    let mut summary = InsertSummary::default();\n    for (key, value) in entries.by_ref() {\n        attempted += 1;\n        summary.record(&insert_one(&transaction, namespace, &key, &value, origin)?);\n    }\n    transaction.commit()?;\n    Ok::<_, rusqlite::Error>(summary)\n});\n\nmatch result {\n    Ok(summary) => summary,\n    Err(err) => {\n        self.warn(\"batch write\", err);\n        // The transaction rolled back: nothing landed, and the caller must see it.\n        InsertSummary {\n            failed: attempted + entries.count(),\n            ..Default::default()\n        }\n    }\n}\n```","locations":[{"ref":"crates/cubecl-environment/src/persistence/sqlite.rs:251-276","code":"  251 |     pub fn insert_many(\n  252 |         &self,\n  253 |         namespace: &str,\n  254 |         entries: &mut dyn Iterator<Item = (Bytes, Bytes)>,\n  255 |         origin: Origin,\n  256 |     ) -> InsertSummary {\n  257 |         let result = self.with_connection(|conn| {\n  258 |             let transaction = conn.transaction_with_behavior(TransactionBehavior::Immediate)?;\n  259 | \n  260 |             let mut summary = InsertSummary::default();\n  261 |             for (key, value) in entries {\n  262 |                 summary.record(&insert_one(&transaction, namespace, &key, &value, origin)?);\n  263 |             }\n  264 | \n  265 |             transaction.commit()?;\n  266 |             Ok::<_, rusqlite::Error>(summary)\n  267 |         });\n  268 | \n  269 |         match result {\n  270 |             Ok(summary) => summary,\n  271 |             Err(err) => {\n  272 |                 self.warn(\"batch write\", err);\n  273 |                 InsertSummary::default()\n  274 |             }\n  275 |         }\n  276 |     }","lines":26,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/persistence/sqlite.rs#L251-L276"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`ComputeClient::staging` silently discards the server's failure: `let stagings = match stagings {\nOk(val) => val, Err(_) => return, };`. The default `ComputeServer::staging` implementation returns\n`Err(IoError::UnsupportedIoOperation)`, and real backends can fail to allocate pinned memory, so the\ncommon outcome is that the caller's `Bytes` are left un-staged with no log line, no error, and no\nreturn value to inspect — the function returns `()`. The caller then pays the slow unpinned upload\npath forever with nothing pointing at why.\n\nThe same block also re-clones the size list for no reason: `sizes` is already an owned\n`Vec<usize>` built by the `collect::<Vec<usize>>()` above, and `let sizes = sizes.to_vec();`\nduplicates it before moving it into the closure.","fix":"Log (or propagate) the error and drop the redundant clone:\n\n```rust\nlet stagings = match stagings {\n    Ok(val) => val,\n    Err(err) => {\n        log::warn!(\"Staging buffers unavailable, falling back to unpinned uploads: {err}\");\n        return;\n    }\n};\n```\nand delete `let sizes = sizes.to_vec();`.","locations":[{"ref":"crates/cubecl-runtime/src/client.rs:797-816","code":"  797 |         let stream_id = self.stream_id();\n  798 |         let sizes = sizes.to_vec();\n  799 |         let stagings = self\n  800 |             .device\n  801 |             .submit_blocking(move |server| server.staging(&sizes, stream_id))\n  802 |             .unwrap_or_resume();\n  803 | \n  804 |         let stagings = match stagings {\n  805 |             Ok(val) => val,\n  806 |             Err(_) => return,\n  807 |         };\n  808 | \n  809 |         to_be_updated\n  810 |             .into_iter()\n  811 |             .zip(stagings)\n  812 |             .for_each(|(b, mut staging)| {\n  813 |                 b.copy_into(&mut staging);\n  814 |                 core::mem::swap(b, &mut staging);\n  815 |             });\n  816 |     }","lines":20,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/client.rs#L797-L816"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The cross-stream GC path is built out of three `unwrap()`s that turn a device error into a process\nabort and drop the pinning guarantee:\n\n* `B::wait_event_sync(event.event).unwrap()` in the GC thread — any backend error while waiting on\n  an event (a normal outcome after a kernel fault) panics the GC thread. The `Box<dyn Any>` of\n  pinned bindings in flight is leaked and the channel receiver is destroyed.\n* `GcThread::register` then does `self.sender.send(task).unwrap()`, so once the GC thread is gone\n  *every* subsequent cross-stream operation panics.\n* That `register` call happens inside `impl Drop for ResolvedStreams`, so the panic occurs while\n  unwinding is possible — a panic in a drop during another unwind aborts the process.\n\nAdditionally, with the GC thread dead the `pinned` bindings are never released, so the origin\nstreams' pools believe the slices are live forever.","fix":"Log instead of panicking, and never panic from `Drop`:\n\n```rust\ncubecl_environment::thread::spawn(move || {\n    while let Ok(task) = recv.recv() {\n        if let Err(err) = B::wait_event_sync(task.event) {\n            log::error!(\"GC stream failed to wait on an event: {err}\");\n        }\n        core::mem::drop(task.to_drop);\n    }\n});\n\nfn register(&self, task: GcTask<B>) {\n    if let Err(err) = self.sender.send(task) {\n        log::error!(\"GC thread is gone, dropping pinned bindings immediately: {err}\");\n    }\n}\n```","locations":[{"ref":"crates/cubecl-runtime/src/stream/event.rs:150-166","code":"  150 | impl<B: EventStreamBackend> GcThread<B> {\n  151 |     fn new() -> GcThread<B> {\n  152 |         let (sender, recv) = std::sync::mpsc::sync_channel::<GcTask<B>>(8);\n  153 | \n  154 |         cubecl_environment::thread::spawn(move || {\n  155 |             while let Ok(event) = recv.recv() {\n  156 |                 B::wait_event_sync(event.event).unwrap();\n  157 |                 core::mem::drop(event.to_drop);\n  158 |             }\n  159 |         });\n  160 | \n  161 |         GcThread { sender }\n  162 |     }\n  163 |     fn register(&self, task: GcTask<B>) {\n  164 |         self.sender.send(task).unwrap()\n  165 |     }\n  166 | }","lines":17,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/stream/event.rs#L150-L166"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`Registry::__expand_find` - the path actually taken by expanded kernel code - resolves a missing key\nwith `map.get(&key).unwrap()`, producing a bare `called `Option::unwrap()` on a `None` value` with no\nindication of which registry or key failed. The two sibling lookups, `Registry::find` and\n`Registry::__expand_find_method`, both `panic!(\"No value found for key {key:?}\")`. Since a missing\nkey here is a normal kernel-authoring mistake (the doc of `find` says so explicitly), the useless\nmessage costs real debugging time.","fix":"Mirror the sibling implementations:\n```rust\nmatch map.get(&key) {\n    Some(val) => val.clone(),\n    None => panic!(\"No value found for key {key:?}\"),\n}\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/container/registry/base.rs:83-93","code":"   83 |     /// Expand function of [`Self::find`].\n   84 |     pub fn __expand_find<Query: RegistryQuery<K>>(\n   85 |         _scope: &Scope,\n   86 |         state: Registry<K, V::ExpandType>,\n   87 |         key: Query,\n   88 |     ) -> V::ExpandType {\n   89 |         let key = key.into();\n   90 |         let map = state.map.as_ref().borrow();\n   91 | \n   92 |         map.get(&key).unwrap().clone()\n   93 |     }","lines":11,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/container/registry/base.rs#L83-L93"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`GpuStorage::perform_deallocations` silently discards failures of `free_async`\n(`let _ = cudarc::driver::result::free_async(ptr, self.stream);`) while the very next arm reports the\nsame class of failure for `free_sync` with `eprintln!(\"CUDA free error: {}\", e)`. A failing\n`cuMemFreeAsync` means device memory has leaked, and since the entry has already been removed from\n`self.memory` there is no second chance to free it - the leak is permanent and invisible.","fix":"Report both paths the same way (preferably through `log`, not `eprintln!`):\n```rust\n.for_each(|(ptr, kind)| unsafe {\n    let res = match kind {\n        AllocationKind::Async => cudarc::driver::result::free_async(ptr, self.stream),\n        AllocationKind::Sync => cudarc::driver::result::free_sync(ptr),\n    };\n    if let Err(e) = res {\n        log::error!(\"CUDA free error ({kind:?}): {e}\");\n    }\n});\n```","locations":[{"ref":"crates/cubecl-cuda/src/compute/storage/gpu.rs:63-81","code":"   63 |     fn perform_deallocations(&mut self) {\n   64 |         self.deallocations\n   65 |             .drain(..)\n   66 |             .filter_map(|id| self.memory.remove(&id))\n   67 |             // SAFETY: Each `ptr` was obtained from a prior `malloc_async` or `malloc_sync`\n   68 |             // call and has not been freed yet. The deallocation method matches the allocation kind.\n   69 |             .for_each(|(ptr, kind)| unsafe {\n   70 |                 match kind {\n   71 |                     AllocationKind::Async => {\n   72 |                         let _ = cudarc::driver::result::free_async(ptr, self.stream);\n   73 |                     }\n   74 |                     AllocationKind::Sync => {\n   75 |                         if let Err(e) = cudarc::driver::result::free_sync(ptr) {\n   76 |                             eprintln!(\"CUDA free error: {}\", e);\n   77 |                         }\n   78 |                     }\n   79 |                 }\n   80 |             });\n   81 |     }","lines":19,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cuda/src/compute/storage/gpu.rs#L63-L81"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`EmbeddedBundle::parse` reports a truncated-but-valid flat bundle as `NotABundle` instead of\n`Corrupted`, which is exactly the misclassification `open` goes out of its way to avoid.\n\n```rust\nif bytes.len() < MAGIC.len() + 8 || &bytes[..MAGIC.len()] != MAGIC {\n    return Err(NotABundle);\n}\n```\n\nA file that starts with `MAGIC` but is only 12-15 bytes long is unambiguously a cubecl flat bundle,\ntruncated. `open` (`open.rs:41-53`) reads 12 bytes and `flat_bundle_version` needs only\n`MAGIC.len() + 4`, so such a file *is* routed to `EmbeddedBundle::open` — and comes back with \"not a\ncubecl flat bundle\", the message the comment at `open.rs:38-40` says the format detection exists to\nprevent (\"a malformed bundle surfaces the error of the reader that matches it instead of every\nfailure reading as 'not a cubecl flat bundle'\"). A user with a partially downloaded bundle is told\nthey handed over the wrong kind of file.\n\nThe existing test only asserts `result.is_err()`, so it doesn't distinguish the two.","fix":"Split the magic check from the length check:\n\n```rust\n-        if bytes.len() < MAGIC.len() + 8 || &bytes[..MAGIC.len()] != MAGIC {\n-            return Err(NotABundle);\n-        }\n+        if bytes.len() < MAGIC.len() || &bytes[..MAGIC.len()] != MAGIC {\n+            return Err(NotABundle);\n+        }\n+        if bytes.len() < MAGIC.len() + 8 {\n+            return Err(Corrupted(\"truncated header\"));\n+        }\n```\n\nand tighten `truncated_bytes_are_rejected` to assert `Corrupted(_)` for prefixes at least\n`MAGIC.len()` long.","locations":[{"ref":"crates/cubecl-environment/src/bundle/embedded.rs:148-165","code":"  148 |     fn parse(bytes: Bytes) -> Result<Self, EmbeddedBundleError> {\n  149 |         use EmbeddedBundleError::{Corrupted, NotABundle, UnsupportedFormat};\n  150 | \n  151 |         if bytes.len() < MAGIC.len() + 8 || &bytes[..MAGIC.len()] != MAGIC {\n  152 |             return Err(NotABundle);\n  153 |         }\n  154 | \n  155 |         let mut cursor = MAGIC.len();\n  156 |         let take_u32 = |cursor: &mut usize| -> Option<u32> {\n  157 |             let value = read_u32(&bytes, *cursor)?;\n  158 |             *cursor += 4;\n  159 |             Some(value)\n  160 |         };\n  161 | \n  162 |         let format = take_u32(&mut cursor).ok_or(Corrupted(\"truncated header\"))?;\n  163 |         if format != FORMAT_VERSION {\n  164 |             return Err(UnsupportedFormat(format));\n  165 |         }","lines":18,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bundle/embedded.rs#L148-L165"},{"ref":"crates/cubecl-environment/src/bundle/open.rs:41-53","code":"   41 | fn is_flat(path: &Path) -> Result<bool, BundleError> {\n   42 |     use std::io::Read;\n   43 | \n   44 |     let mut header = [0u8; 12];\n   45 |     // `read_exact`, not `read`: a single `read` may return a short buffer even\n   46 |     // for a regular file, which would misclassify a valid flat bundle as\n   47 |     // SQLite. A file too small to hold the header can't be a flat bundle.\n   48 |     match std::fs::File::open(path)?.read_exact(&mut header) {\n   49 |         Ok(()) => Ok(flat_bundle_version(&header).is_some()),\n   50 |         Err(err) if err.kind() == std::io::ErrorKind::UnexpectedEof => Ok(false),\n   51 |         Err(err) => Err(err.into()),\n   52 |     }\n   53 | }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bundle/open.rs#L41-L53"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`NativeAllocationController::grow` reports a layout error as \"out of memory\", which it is not:\n\n```rust\nlet Ok(new_layout) = Layout::from_size_align(size, align) else {\n    return Err(AllocationError::OutOfMemory);\n};\n```\n\n`Layout::from_size_align` fails when `align` is not a power of two or when `size` rounded up to\n`align` overflows `isize::MAX` — both programming errors about the requested *layout*, not memory\npressure. `AllocationError` already has a better arm (`UnsupportedOperation`, documented as \"The\nrequested allocation operation is not supported by the allocator\"), and `Bytes::reserve` treats any\n`grow` error identically (it falls back to a fresh native allocation with the *same* bad\nsize/align), so the wrong variant here turns a bad-argument bug into a misleading \"insufficient\nmemory\" diagnosis and then re-tries the same impossible layout.","fix":"```rust\n let Ok(new_layout) = Layout::from_size_align(size, align) else {\n-    return Err(AllocationError::OutOfMemory);\n+    // Not memory pressure: `size`/`align` do not describe a valid layout.\n+    return Err(AllocationError::UnsupportedOperation);\n };\n```\n\nand, if the distinction matters to callers, add an `InvalidLayout` arm to `AllocationError` so\n`Bytes::reserve` can stop retrying a layout that can never be built.","locations":[{"ref":"crates/cubecl-environment/src/bytes/default_controller.rs:158-170","code":"  158 |     fn grow(&mut self, size: usize, align: usize) -> Result<(), AllocationError> {\n  159 |         debug_assert!(\n  160 |             align <= MAX_ALIGN,\n  161 |             \"alignment exceeds maximum supported alignment\"\n  162 |         );\n  163 |         debug_assert!(\n  164 |             size > self.allocation.size,\n  165 |             \"new size must be larger than current size\"\n  166 |         );\n  167 | \n  168 |         let Ok(new_layout) = Layout::from_size_align(size, align) else {\n  169 |             return Err(AllocationError::OutOfMemory);\n  170 |         };","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bytes/default_controller.rs#L158-L170"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`PinnedMemoryStorage::alloc` calls `hipStreamSynchronize(self.stream)` on every\npinned page allocation and throws the status away, with the comment \"For safety,\nreducing the odds of missing mapped memory page\". Two problems: a failed sync\n(the device already faulted) is invisible, and this is a *blocking host sync on\nthe allocation path* — exactly the operation the graph-capture machinery in\n`server.rs` goes to great lengths to avoid, since a host sync during\n`StreamCaptureState::Capture` aborts the capture with\n`hipErrorStreamCaptureUnsupported`. Any pinned pool growth inside a capture\nwindow therefore silently invalidates the graph rather than reporting anything.","fix":"Check the status and report it:\n```rust\nlet synced = cubecl_hip_sys::hipStreamSynchronize(self.stream);\nif synced != HIP_SUCCESS {\n    return Err(IoError::Unknown {\n        description: format!(\"hipStreamSynchronize after hipHostMalloc failed: {synced}\"),\n        backtrace: BackTrace::capture(),\n    });\n}\n```\nand, if the sync is truly only a precaution, gate it so it never runs while a\ncapture is recording.","locations":[{"ref":"crates/cubecl-hip/src/compute/storage/cpu.rs:100-104","code":"  100 |             // For safety, reducing the odds of missing mapped memory page.\n  101 |             cubecl_hip_sys::hipStreamSynchronize(self.stream);\n  102 | \n  103 |             PinnedMemory { ptr, dev_ptr }\n  104 |         };","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-hip/src/compute/storage/cpu.rs#L100-L104"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`launch_copy_perpendicular_ref` searches for the unit-stride axis with `let mut axis = 0;` followed by a\nloop that only assigns on `*stride == 1`. If no stride equals 1 - exactly the malformed input this kernel\nis not able to handle - `axis` silently stays `0` and the kernel gathers with a wrong\n`channel_output_stride`, producing garbage instead of reporting the problem.","fix":"Make the failure explicit:\n```rust\nlet axis = input\n    .strides\n    .iter()\n    .position(|&stride| stride == 1)\n    .expect(\"copy_perpendicular requires a unit-stride axis\");\n```","locations":[{"ref":"crates/cubecl-std/src/tensor/contiguous/perpendicular.rs:129-136","code":"  129 |     let mut axis = 0;\n  130 | \n  131 |     for (i, stride) in input.strides.iter().enumerate() {\n  132 |         if *stride == 1 {\n  133 |             axis = i;\n  134 |             break;\n  135 |         }\n  136 |     }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/contiguous/perpendicular.rs#L129-L136"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"All three timing runners discard the result of the device sync with\n`let _ = cubecl_core::future::block_on(client.sync());`. `client.sync()` is what surfaces a failed\nlaunch (bad cube dim, out-of-memory, device lost). Swallowing it means a kernel that never actually\nran still produces a \"measured\" duration, which is then cached as the device's peak throughput in\n`ThroughputCache` and used to build autotune roofline bounds — a silently wrong number rather than a\nreported failure.","fix":"Surface the failure instead of dropping it, e.g.\n```rust\nif let Err(err) = cubecl_core::future::block_on(client.sync()) {\n    log::warn!(\"throughput sample failed to sync: {err:?}\");\n    return core::time::Duration::ZERO;\n}\n```\nand have `measure_peak_throughput` map a zero duration to `ThroughputValue::ZERO` (which\n`ops_per_s`/`duration_per_op` already treat as \"N/A\") rather than caching a bogus peak.","locations":[{"ref":"crates/cubecl-std/src/throughput/runners/compute_direct.rs:28","code":"   28 |         let _ = cubecl_core::future::block_on(client.sync());","lines":1,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/throughput/runners/compute_direct.rs#L28"},{"ref":"crates/cubecl-std/src/throughput/runners/compute_cmma.rs:37","code":"   37 |         let _ = cubecl_core::future::block_on(client.sync());","lines":1,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/throughput/runners/compute_cmma.rs#L37"},{"ref":"crates/cubecl-std/src/throughput/runners/memory_direct.rs:44","code":"   44 |         let _ = cubecl_core::future::block_on(client.sync());","lines":1,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/throughput/runners/memory_direct.rs#L44"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`WgpuServer::create_module` returns `Err(CompilationError::Generic { .. })` when the WGSL validation\nerror scope reports a failure — but only on non-wasm targets. On `target_family = \"wasm\"` the error\nfuture is handed to `wasm_bindgen_futures::spawn_local` and merely `log::error!`ed, while the\nfunction unconditionally returns `Ok(module)`. A shader that failed validation is therefore turned\ninto a pipeline on the web backend, and the caller has no way to learn about it; the failure only\nresurfaces later as an opaque device error.","fix":"Make the wasm path fallible too, e.g. propagate the module together with the pending validation\nfuture so the caller can `await` it before first use, or (simplest) return a\n`CompilationError::Generic` from an `async fn create_module` on wasm:\n```rust\n#[cfg(target_family = \"wasm\")]\nif let Some(err) = err_future.await {\n    log::error!(\"[cubecl-wgpu] WGSL compilation failed for kernel `{entrypoint_name}`:\\n{err}\");\n    return Err(CompilationError::Generic {\n        reason: format!(\"WGSL compilation failed for kernel `{entrypoint_name}`: {err}\"),\n        backtrace: cubecl_environment::backtrace::BackTrace::capture(),\n    });\n}\n```","locations":[{"ref":"crates/cubecl-wgpu/src/backend/base.rs:207-242","code":"  207 |                 // `pop()` detaches from the LIFO stack immediately; only the\n  208 |                 // result is async. Safe to interleave with other push/pops.\n  209 |                 let err_future = error_scope.pop();\n  210 | \n  211 |                 #[cfg(not(target_family = \"wasm\"))]\n  212 |                 if let Some(err) = cubecl_environment::future::block_on(err_future) {\n  213 |                     log::error!(\n  214 |                         \"[cubecl-wgpu] WGSL compilation failed for kernel `{entrypoint_name}`:\\n{err}\\n--- shader source ({} bytes) ---\\n{source}\\n--- end shader ---\",\n  215 |                         source.len()\n  216 |                     );\n  217 |                     return Err(CompilationError::Generic {\n  218 |                         reason: format!(\n  219 |                             \"WGSL compilation failed for kernel `{entrypoint_name}`: {err}\"\n  220 |                         ),\n  221 |                         backtrace: cubecl_environment::backtrace::BackTrace::capture(),\n  222 |                     });\n  223 |                 }\n  224 | \n  225 |                 // On wasm we can't block; spawn a task that awaits the pop\n  226 |                 // future and logs.\n  227 |                 #[cfg(target_family = \"wasm\")]\n  228 |                 {\n  229 |                     let entrypoint_name = entrypoint_name.to_string();\n  230 |                     let source = source.to_string();\n  231 |                     wasm_bindgen_futures::spawn_local(async move {\n  232 |                         if let Some(err) = err_future.await {\n  233 |                             log::error!(\n  234 |                                 \"[cubecl-wgpu] WGSL compilation failed for kernel `{entrypoint_name}`:\\n{err}\\n--- shader source ({} bytes) ---\\n{source}\\n--- end shader ---\",\n  235 |                                 source.len()\n  236 |                             );\n  237 |                         }\n  238 |                     });\n  239 |                 }\n  240 | \n  241 |                 Ok(module)\n  242 |             }","lines":36,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-wgpu/src/backend/base.rs#L207-L242"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"easy","description":"`unsafe impl Send for ReservedMemory` and `unsafe impl Sync for ReservedMemory` are unconditional,\nand `UninitReservedMemory::init<O>(obj: O)` places an arbitrary `O` into the slot with no `O: Send`\nor `O: Sync` bound. The safety comment only argues about immutability of the byte storage and the\natomic ref count, and never mentions the stored type. Storing an `Rc`, a `Cell`, or any other\nnon-thread-safe payload therefore produces a value that Rust will happily move to, and share with,\nanother thread; the payload's destructor also runs on whichever thread drops the last clone.","fix":"Either bound the constructor - `pub fn init<O: Send + Sync>(self, obj: O) -> ReservedMemory<...>` -\nor make the marker impls conditional by carrying the payload type, e.g.\n`pub struct ReservedMemory<const N: usize, O> { ..., _payload: PhantomData<O> }` plus\n```rust\nunsafe impl<const N: usize, O: Send> Send for ReservedMemory<N, O> {}\nunsafe impl<const N: usize, O: Sync> Sync for ReservedMemory<N, O> {}\n```","locations":[{"ref":"crates/cubecl-common/src/arena.rs:199-205","code":"  199 | // SAFETY: After initialization, the data behind `ReservedMemory` is immutable\n  200 | // (no `&mut` access is possible while any clone exists). The logical ref_count\n  201 | // is an `AtomicU32` with proper ordering, and the backing `Arc` guarantees the\n  202 | // storage outlives all handles. These together satisfy the `Send` and `Sync`\n  203 | // contracts.\n  204 | unsafe impl<const MAX_ITEM_SIZE: usize> Send for ReservedMemory<MAX_ITEM_SIZE> {}\n  205 | unsafe impl<const MAX_ITEM_SIZE: usize> Sync for ReservedMemory<MAX_ITEM_SIZE> {}","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/arena.rs#L199-L205"},{"ref":"crates/cubecl-common/src/arena.rs:100-120","code":"  100 |     pub fn init<O>(self, obj: O) -> ReservedMemory<MAX_ITEM_SIZE> {\n  101 |         assert!(\n  102 |             accept_obj::<O, MAX_ITEM_SIZE>(),\n  103 |             \"Object isn't safe to store in this arena\"\n  104 |         );\n  105 | \n  106 |         self.init_with_func(\n  107 |             |bytes| {\n  108 |                 let ptr = core::ptr::from_mut(bytes);\n  109 |                 unsafe {\n  110 |                     core::ptr::write(ptr as *mut O, obj);\n  111 |                 };\n  112 |             },\n  113 |             |bytes| {\n  114 |                 let ptr = core::ptr::from_mut(bytes);\n  115 |                 unsafe {\n  116 |                     core::ptr::drop_in_place(ptr as *mut O);\n  117 |                 }\n  118 |             },\n  119 |         )\n  120 |     }","lines":21,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/arena.rs#L100-L120"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`LeaseSlot<T>` gets `unsafe impl Send` and `unsafe impl Sync`, and `LeaseHandle<T>` gets\n`unsafe impl Send`, all with no bound on `T`. The safety comments only argue about the `leased` flag\nproviding unique access; they never require the payload to be thread-safe. Because\n`LeasePool<T>` is just `Vec<Box<LeaseSlot<T>>>`, these impls also make the whole pool `Send + Sync`\nfor a non-thread-safe `T`. A `T` holding an `Rc` (perfectly able to be `Default + Reclaim`) can then\nbe shared or moved across threads, giving a data race on a non-atomic refcount.","fix":"Bound the impls on the payload:\n```rust\nunsafe impl<T: Default + Reclaim + Send> Send for LeaseSlot<T> {}\nunsafe impl<T: Default + Reclaim + Sync> Sync for LeaseSlot<T> {}\nunsafe impl<T: Default + Reclaim + Send> Send for LeaseHandle<T> {}\n```","locations":[{"ref":"crates/cubecl-common/src/pool.rs:32-36","code":"   32 | // SAFETY: `leased` guarantees at most one live `LeaseHandle` references an item at a\n   33 | // time, so writes through the `UnsafeCell` are never aliased by another writer, and the pool only\n   34 | // ever forms shared references to the item (to read/write `leased`).\n   35 | unsafe impl<T: Default + Reclaim> Send for LeaseSlot<T> {}\n   36 | unsafe impl<T: Default + Reclaim> Sync for LeaseSlot<T> {}","lines":5,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/pool.rs#L32-L36"},{"ref":"crates/cubecl-common/src/pool.rs:94-96","code":"   94 | // SAFETY: the handle may be moved across threads by its holder. The pointee is `Send + Sync` and,\n   95 | // per the `leased` flag invariant, uniquely owned by this handle.\n   96 | unsafe impl<T: Default + Reclaim> Send for LeaseHandle<T> {}","lines":3,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-common/src/pool.rs#L94-L96"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`ExpandTypeClone for &mut T` transmutes a shared reference into a mutable one:\n`unsafe { core::mem::transmute(&**self) }` turns `&T` into `&mut T` while the original `&mut T`\nborrow (reachable through `self`) is still live. Transmuting `&T` to `&mut T` is instant undefined\nbehaviour in Rust (it is exactly what the `mutable_transmutes` lint that is silenced here forbids),\nand it hands out two aliasing `&mut` to the same expand value, which LLVM may miscompile because of\n`noalias` on `&mut`.","fix":"Do not fabricate a `&mut` from a `&`. Either make `clone_unchecked` return a raw pointer / an owned\ncopy of the underlying `Value`, or implement it only for `&T` and require callers that need a second\nmutable handle to go through `Scope::create_kernel_ref`, e.g.\n\n```rust\nimpl<T: ExpandTypeClone + ?Sized> ExpandTypeClone for &mut T {\n    fn clone_unchecked(&self) -> Self {\n        // no sound implementation: remove this impl, or store a `*mut T` in the expand type\n    }\n}\n```","locations":[{"ref":"crates/cubecl-core/src/frontend/element/base.rs:114-119","code":"  114 | impl<T: ExpandTypeClone + ?Sized> ExpandTypeClone for &mut T {\n  115 |     #[allow(mutable_transmutes)]\n  116 |     fn clone_unchecked(&self) -> Self {\n  117 |         unsafe { core::mem::transmute(&**self) }\n  118 |     }\n  119 | }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/base.rs#L114-L119"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`CompilationArg::dynamic_cast` only asserts that the two types have the same *size*, then reboxes:\n`unsafe { *Box::from_raw(Box::into_raw(this) as *mut Arg) }`. The allocation was made with\n`Layout::new::<Self>()` but is freed with `Layout::new::<Arg>()`; if `align_of::<Arg>() !=\nalign_of::<Self>()` this is a mismatched-layout deallocation, which is undefined behaviour in the\nglobal allocator contract. It also reinterprets arbitrary unrelated types with equal size (e.g. two\ndifferent structs that merely happen to be 8 bytes), producing garbage compilation args instead of a\ndiagnosable error.","fix":"Do the reinterpretation without transferring ownership of the allocation, and also check alignment:\n\n```rust\nfn dynamic_cast<Arg: CompilationArg>(&self) -> Arg {\n    assert!(size_of::<Arg>() == size_of::<Self>());\n    assert!(align_of::<Arg>() == align_of::<Self>());\n    let this = core::mem::ManuallyDrop::new(self.clone());\n    unsafe { core::ptr::read(&*this as *const Self as *const Arg) }\n}\n```\n\nBetter still, serialize/deserialize through `serde` (as the doc comment describes) so mismatched\ntypes are reported as an error instead of being reinterpreted.","locations":[{"ref":"crates/cubecl-core/src/frontend/element/base.rs:431-437","code":"  431 |     fn dynamic_cast<Arg: CompilationArg>(&self) -> Arg {\n  432 |         // Dynamic cast, unlike transmute it does not require statically proving the types are the\n  433 |         // same size. We assert at runtime to avoid undefined behaviour and help the compiler optimize.\n  434 |         assert!(size_of::<Arg>() == size_of::<Self>());\n  435 |         let this = Box::new(self.clone());\n  436 |         unsafe { *Box::from_raw(Box::into_raw(this) as *mut Arg) }\n  437 |     }","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-core/src/frontend/element/base.rs#L431-L437"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`cuDeviceTotalMem_v2` is called without checking its status code, and the `MaybeUninit` is then\n`assume_init()`ed unconditionally:\n\n```rust\nlet max_memory = unsafe {\n    let mut bytes = MaybeUninit::uninit();\n    cuDeviceTotalMem_v2(bytes.as_mut_ptr(), device_ptr);\n    bytes.assume_init() as u64\n};\n```\n\nThe CUDA driver only writes through the out pointer on success. If the call fails (for example\n`CUDA_ERROR_INVALID_CONTEXT` or `CUDA_ERROR_DEINITIALIZED` after another thread reset the device),\n`bytes` stays uninitialized and `assume_init()` is immediate undefined behaviour. The garbage value\nthen flows into `MemoryDeviceProperties { max_page_size: max_memory / 4, .. }`, so the memory\nmanager sizes every pool from an arbitrary number.\n\nThe comment directly above claims the opposite guarantee: \"`cuDeviceTotalMem_v2` writes the total\ndevice memory into the `MaybeUninit`, making `assume_init()` valid on success.\" — the code never\nestablishes \"on success\". Note that every neighbouring FFI call in the same function (`device::get`,\n`get_attribute`, `primary_ctx::retain`, `ctx::set_current`) does check with `.unwrap()`, so this one\narm is the odd one out.","fix":"Check the status before trusting the out parameter:\n\n```rust\n let max_memory = unsafe {\n     let mut bytes = MaybeUninit::uninit();\n-    cuDeviceTotalMem_v2(bytes.as_mut_ptr(), device_ptr);\n+    cuDeviceTotalMem_v2(bytes.as_mut_ptr(), device_ptr)\n+        .result()\n+        .expect(\"Can query total CUDA device memory.\");\n     bytes.assume_init() as u64\n };\n```","locations":[{"ref":"crates/cubecl-cuda/src/runtime.rs:104-110","code":"  104 |         // SAFETY: `device_ptr` is valid. `cuDeviceTotalMem_v2` writes the total device memory\n  105 |         // into the `MaybeUninit`, making `assume_init()` valid on success.\n  106 |         let max_memory = unsafe {\n  107 |             let mut bytes = MaybeUninit::uninit();\n  108 |             cuDeviceTotalMem_v2(bytes.as_mut_ptr(), device_ptr);\n  109 |             bytes.assume_init() as u64\n  110 |         };","lines":7,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-cuda/src/runtime.rs#L104-L110"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Bytes::copy_into` is a safe public API that calls an `unsafe` method whose documented precondition\nit never checks, so a destination longer than the source reads uninitialized memory (UB) or panics\non a slice index.\n\n```rust\n/// Copy the data from the current allocation to the provided [Bytes].\npub fn copy_into(&self, other: &mut Self) {\n    unsafe {\n        self.controller.copy_into(other);\n    }\n}\n```\n\n`other` coerces through `DerefMut` to `&mut [u8]` of length `other.len`, and the default\n`AllocationController::copy_into` does:\n\n```rust\nunsafe fn copy_into(&self, buf: &mut [u8]) {\n    let len = buf.len();\n    let memory = self.memory(AccessPolicy::default()).expect(\"copy_into: host access failed\");\n    let memory_slice = &memory[0..len];   // <-- indexes the SOURCE by the DEST length\n    ...\n}\n```\n\nThe trait method's own doc says \"# Safety — Ensures the length provided reflect initialized values\nin the current allocation controller\", but `Bytes::copy_into` provides no such guarantee. If\n`other.len() > self.len()` the copy reads bytes past the source's initialized region (UB per the\ntype invariant stated at `base.rs:22-24`); if `other.len() > self.capacity()` it panics with an\nindex-out-of-range inside the `expect`-free slice. Callers such as\n`crates/cubecl-cuda/src/compute/command.rs:433-435` and `crates/cubecl-runtime/src/client.rs:713`\npass a staging buffer whose size is computed independently of the source, so the invariant is\nmaintained only by convention.\n\nThe three controllers also disagree on the behaviour: `shared_arc.rs:186-204` and\n`shared.rs:222-244` silently clamp with `buf.len().min(memory.len())`, whereas the default impl and\n`file.rs:160-179` index by `buf.len()`. So the same misuse silently truncates on one backend and is\nUB on another.","fix":"Validate at the safe boundary and make the contract one thing across all controllers:\n\n```rust\n/// Copy the initialized data of `self` into `other`.\n///\n/// # Panics\n/// If `other.len() != self.len()`.\npub fn copy_into(&self, other: &mut Self) {\n    assert_eq!(\n        self.len, other.len,\n        \"copy_into: destination length {} does not match source length {}\",\n        other.len, self.len\n    );\n    // SAFETY: the assert above establishes the controller's precondition.\n    unsafe { self.controller.copy_into(other) };\n}\n```\n\nand change the default `AllocationController::copy_into` to slice the source by\n`len.min(memory.len())` (or to take the source length explicitly) so the two clamping\nimplementations and the two indexing ones stop diverging.","locations":[{"ref":"crates/cubecl-environment/src/bytes/base.rs:460-465","code":"  460 |     /// Copy the data from the current allocation to the provided [Bytes].\n  461 |     pub fn copy_into(&self, other: &mut Self) {\n  462 |         unsafe {\n  463 |             self.controller.copy_into(other);\n  464 |         }\n  465 |     }","lines":6,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bytes/base.rs#L460-L465"},{"ref":"crates/cubecl-environment/src/bytes/base.rs:156-174","code":"  156 |     /// Reads the data from the current allocation controller and copy its content into the provided\n  157 |     /// buffer.\n  158 |     ///\n  159 |     /// # Safety\n  160 |     ///\n  161 |     /// Ensures the length provided reflect initialized values in the current allocation controller.\n  162 |     unsafe fn copy_into(&self, buf: &mut [u8]) {\n  163 |         let len = buf.len();\n  164 |         let memory = self\n  165 |             .memory(AccessPolicy::default())\n  166 |             .expect(\"copy_into: host access failed\");\n  167 |         let memory_slice = &memory[0..len];\n  168 | \n  169 |         // SAFETY: By construction, bytes up to len are initialized.\n  170 |         let data = unsafe {\n  171 |             core::slice::from_raw_parts(memory_slice.as_ptr().cast(), memory_slice.len())\n  172 |         };\n  173 |         buf.copy_from_slice(data);\n  174 |     }","lines":19,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bytes/base.rs#L156-L174"},{"ref":"crates/cubecl-environment/src/bytes/shared_arc.rs:186-204","code":"  186 |     unsafe fn copy_into(&self, buf: &mut [u8]) {\n  187 |         match self.controller.get() {\n  188 |             Some(controller) => {\n  189 |                 let memory = controller\n  190 |                     .memory(AccessPolicy::default())\n  191 |                     .expect(\"shared: host access failed\");\n  192 |                 let copy_len = buf.len().min(memory.len());\n  193 |                 // SAFETY: every byte of the private buffer up to its length is initialized.\n  194 |                 let data =\n  195 |                     unsafe { core::slice::from_raw_parts(memory.as_ptr().cast::<u8>(), copy_len) };\n  196 |                 buf[..copy_len].copy_from_slice(data);\n  197 |             }\n  198 |             None => {\n  199 |                 let src = self.view();\n  200 |                 let copy_len = buf.len().min(src.len());\n  201 |                 buf[..copy_len].copy_from_slice(&src[..copy_len]);\n  202 |             }\n  203 |         }\n  204 |     }","lines":19,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-environment/src/bytes/shared_arc.rs#L186-L204"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`DeviceProperties::checksum` documents itself as a stable, cache-grade checksum but computes it with\n`foldhash`, a speed-oriented hasher with no cross-version output stability guarantee:\n```rust\n/// Create a stable hash of all device properties relevant to kernel compilation. Can be used\n/// as a stable checksum for a compilation cache.\npub fn checksum(&self) -> u64 {\n    let state = foldhash::fast::FixedState::default();\n    let mut hasher = state.build_hasher();\n    self.features.hash(&mut hasher);\n    self.hardware.hash(&mut hasher);\n    hasher.finish()\n}\n```\nThe value is stored as `ServerUtilities::properties_hash` and used verbatim as part of the key of the\npersistent SPIR-V cache in `crates/cubecl-wgpu/src/backend/base.rs:49-53`. The workspace already\nships `cubecl_common::hash::StableHasher` (xxh3) precisely for keys that must survive across runs and\nversions, and `KernelCacheKey` uses it - `checksum()` is the one place that does not.","fix":"Use the workspace stable hasher:\n```rust\npub fn checksum(&self) -> cubecl_common::hash::StableHash {\n    let mut hasher = cubecl_common::hash::StableHasher::new();\n    self.features.hash(&mut hasher);\n    self.hardware.hash(&mut hasher);\n    hasher.finalize()\n}\n```","locations":[{"ref":"crates/cubecl-ir/src/properties.rs:215-223","code":"  215 |     /// Create a stable hash of all device properties relevant to kernel compilation. Can be used\n  216 |     /// as a stable checksum for a compilation cache.\n  217 |     pub fn checksum(&self) -> u64 {\n  218 |         let state = foldhash::fast::FixedState::default();\n  219 |         let mut hasher = state.build_hasher();\n  220 |         self.features.hash(&mut hasher);\n  221 |         self.hardware.hash(&mut hasher);\n  222 |         hasher.finish()\n  223 |     }","lines":9,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-ir/src/properties.rs#L215-L223"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`BytesResource::write<'a>(&mut self) -> &'a mut [u8]` and `BytesResource::read<'a>(&self) -> &'a [u8]`\nreturn *unbounded* lifetimes: `'a` is chosen by the caller and is tied to neither `self` nor the\nowning `BytesStorage`. The safety comment claims \"the lifetime `'a` is the lifetime of the\nunderlying `BytesStorage` allocation\", but nothing in the signature enforces that, so safe code can\ndo `let slice: &'static [u8] = storage.get(&h).read(); storage.dealloc(h.id);` and read freed\nmemory, or obtain two `&mut [u8]` over the same region by calling `storage.get(&handle)` twice\n(`get` takes `&mut self` but hands out an owned `BytesResource` each time). Both are\nuse-after-free / aliasing UB reachable without any `unsafe` at the call site.","fix":"Tie the returned borrows to the resource (and let callers keep the resource alive as long as the\nslice), or at minimum to `self`:\n\n```rust\npub fn write(&mut self) -> &mut [u8] {\n    let (ptr, len) = self.get_write_ptr_and_length();\n    // SAFETY: ... exclusive through `&mut self`, and the borrow cannot outlive the resource.\n    unsafe { core::slice::from_raw_parts_mut(ptr, len) }\n}\n\npub fn read(&self) -> &[u8] {\n    let (ptr, len) = self.get_write_ptr_and_length();\n    unsafe { core::slice::from_raw_parts(ptr, len) }\n}\n```\n\nIf callers genuinely need the allocation's lifetime, thread it explicitly, e.g. make `get` return\n`BytesResource<'a>` borrowing the storage.","locations":[{"ref":"crates/cubecl-runtime/src/storage/bytes_cpu.rs:48-78","code":"   48 |     /// Returns the resource as a mutable slice of bytes.\n   49 |     ///\n   50 |     /// The lifetime `'a` is the lifetime of the underlying `BytesStorage` allocation,\n   51 |     /// not of `self`. The `&mut self` ensures only one mutable slice is created per\n   52 |     /// resource. Multiple resources may point to non-overlapping regions of the same\n   53 |     /// allocation (like `split_at_mut`); each resource owns its region exclusively.\n   54 |     pub fn write<'a>(&mut self) -> &'a mut [u8] {\n   55 |         let (ptr, len) = self.get_write_ptr_and_length();\n   56 | \n   57 |         // SAFETY:\n   58 |         // - ptr is non-null and aligned (from BytesStorage::alloc).\n   59 |         // - The region [ptr..ptr+len) is within a single allocation.\n   60 |         // - Memory is initialized (BytesStorage uses alloc_zeroed).\n   61 |         // - `&mut self` ensures exclusive access to this resource's region.\n   62 |         // - `StorageHandle` assigns non-overlapping regions per resource.\n   63 |         // - Systems must make sure this is the only `BytesResource` with an outstanding mutable borrow.\n   64 |         unsafe { core::slice::from_raw_parts_mut(ptr, len) }\n   65 |     }\n   66 | \n   67 |     /// Returns the resource as an immutable slice of bytes.\n   68 |     ///\n   69 |     /// See [`write`](Self::write) for lifetime and safety notes.\n   70 |     pub fn read<'a>(&self) -> &'a [u8] {\n   71 |         let (ptr, len) = self.get_write_ptr_and_length();\n   72 | \n   73 |         // SAFETY:\n   74 |         // - ptr is non-null and aligned (from BytesStorage::alloc).\n   75 |         // - The region [ptr..ptr+len) is within a single allocation.\n   76 |         // - Memory is initialized (BytesStorage uses alloc_zeroed).\n   77 |         unsafe { core::slice::from_raw_parts(ptr, len) }\n   78 |     }","lines":31,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-runtime/src/storage/bytes_cpu.rs#L48-L78"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`VirtualLayoutCompilationArg` and `VirtualViewLayoutCompilationArg` get `unsafe impl Send`/`unsafe impl Sync`\njustified by the comment `SAFETY: The struct is readonly, so \\`Sync\\` is safe to implement`. Both claims are\nwrong: the structs hold `Rc<dyn Debug>` and `Rc<RefCell<dyn FnMut(..)>>`, so cloning one (they derive\n`Clone`, and compilation args are cloned and cached across threads) mutates a non-atomic refcount, and the\nstruct is *not* read-only - `expand`/`expand_output` call `self.expand.borrow_mut()` and invoke a `FnMut`.\nTwo threads sharing one of these args can therefore race on the `Rc` count (double free / leak) and on the\n`RefCell` borrow flag.","fix":"Use thread-safe primitives instead of asserting `Send`/`Sync` by hand: change\n`Rc<RefCell<dyn FnMut(..) + Send>>` to `Arc<Mutex<dyn FnMut(..) + Send>>` (and `Rc<dyn Debug>` to\n`Arc<dyn Debug + Send + Sync>`), then delete both `unsafe impl` blocks and let the compiler derive\n`Send`/`Sync`. If the expand closure really is only ever called from one thread, model that with a\nnon-`Send` type and keep the arg thread-local rather than lying in `unsafe impl`.","locations":[{"ref":"crates/cubecl-std/src/tensor/layout/virtual.rs:231-255","code":"  231 |     #[derive(Clone)]\n  232 |     pub struct VirtualLayoutCompilationArg<C: Coordinates, S: Coordinates> {\n  233 |         type_name: String,\n  234 |         debug: Rc<dyn core::fmt::Debug>,\n  235 |         hash: StableHash,\n  236 |         expand: ExpandFn<C, S>,\n  237 |     }\n  238 | \n  239 |     // SAFETY: The struct is readonly, so `Sync` is safe to implement\n  240 |     unsafe impl<C: Coordinates, S: Coordinates> Send for VirtualLayoutCompilationArg<C, S> {}\n  241 |     unsafe impl<C: Coordinates, S: Coordinates> Sync for VirtualLayoutCompilationArg<C, S> {}\n  242 | \n  243 |     impl<C: Coordinates, S: Coordinates> VirtualLayoutCompilationArg<C, S> {\n  244 |         pub fn new<L: CompilationArg + 'static>(arg: L, expand: ExpandFn<C, S>) -> Self {\n  245 |             // Hash ahead of time so we don't need to store the actual data, which would be far\n  246 |             // more complex\n  247 |             let hash = StableHasher::hash_one(&arg);\n  248 |             Self {\n  249 |                 type_name: core::any::type_name::<L>().to_string(),\n  250 |                 debug: Rc::new(arg),\n  251 |                 hash,\n  252 |                 expand,\n  253 |             }\n  254 |         }\n  255 |     }","lines":25,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/layout/virtual.rs#L231-L255"},{"ref":"crates/cubecl-std/src/tensor/view/launch.rs:184-222","code":"  184 |     #[derive(Clone)]\n  185 |     pub struct VirtualViewLayoutCompilationArg<C: Coordinates, S: Coordinates> {\n  186 |         type_name: String,\n  187 |         debug: Rc<dyn core::fmt::Debug>,\n  188 |         hash: StableHash,\n  189 |         expand: ExpandFn<C, S>,\n  190 |     }\n  191 | \n  192 |     // SAFETY: The struct is readonly, so `Sync` is safe to implement\n  193 |     unsafe impl<C: Coordinates, S: Coordinates> Send for VirtualViewLayoutCompilationArg<C, S> {}\n  194 |     unsafe impl<C: Coordinates, S: Coordinates> Sync for VirtualViewLayoutCompilationArg<C, S> {}\n  195 | \n  196 |     impl<C: Coordinates, S: Coordinates> VirtualViewLayoutCompilationArg<C, S> {\n  197 |         pub fn new<L: CompilationArg + 'static>(arg: L, expand: ExpandFn<C, S>) -> Self {\n  198 |             // Hash ahead of time so we don't need to store the actual data, which would be far\n  199 |             // more complex\n  200 |             let hash = StableHasher::hash_one(&arg);\n  201 |             Self {\n  202 |                 type_name: core::any::type_name::<L>().to_string(),\n  203 |                 debug: Rc::new(arg),\n  204 |                 hash,\n  205 |                 expand,\n  206 |             }\n  207 |         }\n  208 | \n  209 |         pub fn expand(&self, ty: Type, builder: &mut KernelBuilder) -> VirtualLayoutExpand<C, S> {\n  210 |             let mut expand = self.expand.borrow_mut();\n  211 |             (expand)(ty, builder, false)\n  212 |         }\n  213 | \n  214 |         pub fn expand_output(\n  215 |             &self,\n  216 |             ty: Type,\n  217 |             builder: &mut KernelBuilder,\n  218 |         ) -> VirtualLayoutExpand<C, S> {\n  219 |             let mut expand = self.expand.borrow_mut();\n  220 |             (expand)(ty, builder, true)\n  221 |         }\n  222 |     }","lines":39,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/view/launch.rs#L184-L222"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`VirtualTensorExpand::state_read` takes `&self` and produces its result by creating a *mutable*\nreference out of the `UnsafeCell`: `unsafe { &mut *self.state.get() }`, which is then coerced to\n`&dyn VirtualTensorOperationsExpand`. Creating a `&mut` asserts exclusive access, so every\n`state_read()` call invalidates any reference previously handed out by `state_read()`/`state_write()`\nover the same `Arc<UnsafeCell<..>>` (and `VirtualTensorExpand` is `Clone`, so several clones alias\nthe same cell). This is undefined behaviour under Stacked Borrows even though only reads are\nperformed, and it is entirely unnecessary for a read accessor. The `SAFETY` comment only argues\nabout lifetime, not about aliasing.","fix":"Take a shared reference for the read path:\n```rust\nfn state_read(&self) -> &dyn VirtualTensorOperationsExpand<E, N> {\n    // SAFETY: read-only access; no `&mut` is ever created here.\n    unsafe { &*self.state.get() }\n}\n```","locations":[{"ref":"crates/cubecl-std/src/tensor/virtual.rs:31-43","code":"   31 | impl<E: Numeric, N: Size, IO> VirtualTensorExpand<E, N, IO> {\n   32 |     fn state_read(&self) -> &dyn VirtualTensorOperationsExpand<E, N> {\n   33 |         // SAFETY: State is valid for the entire lifetime of `self`\n   34 |         unsafe { &mut *self.state.get() }\n   35 |     }\n   36 | \n   37 |     #[allow(clippy::mut_from_ref)]\n   38 |     pub(crate) fn state_write(&self) -> &mut dyn VirtualTensorOperationsExpand<E, N> {\n   39 |         // SAFETY: State is a handle into memory and only the memory is written. The state itself\n   40 |         // is never mutated, so this is safe.\n   41 |         unsafe { &mut *self.state.get() }\n   42 |     }\n   43 | }","lines":13,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/virtual.rs#L31-L43"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"hard","description":"`VirtualTensorOperationsExpand::__expand_read_window_method` for `TensorExpand` launders a borrow of\n`self` into a `&'static SliceExpand<..>` with `core::mem::transmute`. The returned reference is\nderived from `&self` (and, at the call site in `SliceOperatorExpand::__expand_slice_method`, from the\ntemporary `&mut` produced by `state_read`), so the `'static` claim is false: the borrow is only valid\nas long as the `TensorExpand` and the enclosing `state_read()` borrow live. Any later\n`state_read()`/`state_write()` call on the same `VirtualTensorExpand` invalidates it while callers\nstill hold it, which is unsound rather than merely ugly.","fix":"Make the trait method's return lifetime tied to `&self` instead of `'static`, e.g. change the trait\nsignature to\n```rust\nfn __expand_read_window_method(\n    &self,\n    context: &Scope,\n    start: NativeExpand<usize>,\n    end: NativeExpand<usize>,\n) -> &SliceExpand<Vector<E, N>>;\n```\nand implement it as `self.__expand_slice_method(context, start, end)` with no `transmute`. If a\ndetached handle really is required, allocate it in the scope arena (`scope.create_kernel_ref(..)`)\nas `ViewExpand::new` already does, rather than transmuting a stack borrow.","locations":[{"ref":"crates/cubecl-std/src/tensor/virtual.rs:406-413","code":"  406 |         fn __expand_read_window_method(\n  407 |             &self,\n  408 |             context: &Scope,\n  409 |             start: NativeExpand<usize>,\n  410 |             end: NativeExpand<usize>,\n  411 |         ) -> &'static SliceExpand<Vector<E, N>> {\n  412 |             unsafe { core::mem::transmute(self.__expand_slice_method(context, start, end)) }\n  413 |         }","lines":8,"link":"https://github.com/tracel-ai/cubecl/blob/5e39cce2c02063baf387f0d5353631b775e4c31e/crates/cubecl-std/src/tensor/virtual.rs#L406-L413"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`request_device` hardcodes `let family_index = 0; //TODO` and creates the only\n`DeviceQueueCreateInfo` for family 0, then passes `family_info.queue_family_index` to\n`adapter.device_from_raw`. The Vulkan spec makes no guarantee that queue family 0 supports\n`VK_QUEUE_COMPUTE_BIT`; on such a device this either fails device creation or, worse, hands wgpu a\nqueue that cannot dispatch compute work. wgpu's own Vulkan adapter selects the family by\ncapability, so this bypass silently diverges from it.","fix":"Query the families and pick one that advertises compute, bailing out (`return None`, which the\ncaller already handles by falling back to WGSL) if none does:\n```rust\nlet families = unsafe {\n    ash.raw_instance()\n        .get_physical_device_queue_family_properties(adapter.raw_physical_device())\n};\nlet family_index = families\n    .iter()\n    .position(|f| f.queue_flags.contains(vk::QueueFlags::COMPUTE))? as u32;\n```","locations":[{"ref":"crates/cubecl-wgpu/src/backend/vulkan.rs:116-166","code":"  116 |     let supported_feat = unsafe {\n  117 |         ash.raw_instance()\n  118 |             .get_physical_device_features(adapter.raw_physical_device())\n  119 |     };\n  120 | \n  121 |     let family_index = 0; //TODO\n  122 |     let family_info = DeviceQueueCreateInfo::default()\n  123 |         .queue_family_index(family_index)\n  124 |         .queue_priorities(&[1.0]);\n  125 |     let family_infos = [family_info];\n  126 | \n  127 |     let str_pointers = extended_feat\n  128 |         .extensions\n  129 |         .iter()\n  130 |         .map(|&s| {\n  131 |             // Safe because `device_extensions` entries have static lifetime.\n  132 |             s.as_ptr()\n  133 |         })\n  134 |         .collect::<Vec<_>>();\n  135 | \n  136 |     let pre_info = DeviceCreateInfo::default()\n  137 |         .queue_create_infos(&family_
