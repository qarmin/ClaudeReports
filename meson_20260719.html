 def update_po(src_sub: str, msgmerge: str, msginit: str, pkgname: str, langs: T.List[str]) -> int:\n   61 |     potfile = os.path.join(src_sub, pkgname + '.pot')\n   62 |     for l in langs:\n   63 |         pofile = os.path.join(src_sub, l + '.po')\n   64 |         if os.path.exists(pofile):\n   65 |             exe = ExecutableSerialisation([msgmerge, '-q', pofile, potfile], capture=pofile)\n   66 |             if run_exe(exe) != 0:\n   67 |                 return 1\n   68 |         else:\n   69 |             subprocess.check_call([msginit, '--input', potfile, '--output-file', pofile, '--locale', l, '--no-translator'])\n   70 |     return 0","lines":11,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/gettext.py#L60-L70"}]},{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`build_cmd` concatenates `detect_ninja()` directly into a list. `detect_ninja()` returns `T.Optional[T.List[str]]` and yields `None` when no suitable ninja/samu is found, in which case `exelist + [...] + None + [...]` raises `TypeError: can only concatenate list (not \"NoneType\")` with an unhelpful traceback instead of a clear \"ninja not found\" error.","fix":"Detect ninja first, e.g. `ninja = detect_ninja(); if ninja is None: print('Could not find ninja'); return 1` before building `build_cmd`.","locations":[{"ref":"mesonbuild/scripts/scanbuild.py:22","code":"   22 |     build_cmd = exelist + ['--exclude', str(subprojdir), '-o', str(logdir)] + detect_ninja() + ['-C', scandir, f'-j{determine_worker_count()}']","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/scanbuild.py#L22"}]},{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `cmake2meson.py` the `Lexer` never assigns `lineno`/`colno` onto the `Token` objects it yields (it only tracks `lineno`/`col` in local variables). Every `Token` therefore keeps the default `lineno = 0`, `colno = 0`. As a result `Parser.expect` raises `ValueError(..., self.current.lineno, self.current.colno)` always reporting line 0, column 0, making parse errors useless for locating the problem.","fix":"Set `tok.lineno = lineno` and `tok.colno = col` on each `Token` before yielding it in `Lexer.lex`.","locations":[{"ref":"tools/cmake2meson.py:38-75","code":"   38 |     def lex(self, code: str) -> T.Iterator[Token]:\n   39 |         lineno = 1\n   40 |         line_start = 0\n   41 |         loc = 0\n   42 |         col = 0\n   43 |         while loc < len(code):\n   44 |             matched = False\n   45 |             for (tid, reg) in self.token_specification:\n   46 |                 mo = reg.match(code, loc)\n   47 |                 if mo:\n   48 |                     col = mo.start() - line_start\n   49 |                     matched = True\n   50 |                     loc = mo.end()\n   51 |                     match_text = mo.group()\n   52 |                     if tid == 'ignore':\n   53 |                         continue\n   54 |                     if tid == 'comment':\n   55 |                         yield(Token('comment', match_text))\n   56 |                     elif tid == 'lparen':\n   57 |                         yield(Token('lparen', '('))\n   58 |                     elif tid == 'rparen':\n   59 |                         yield(Token('rparen', ')'))\n   60 |                     elif tid == 'string':\n   61 |                         yield(Token('string', match_text[1:-1]))\n   62 |                     elif tid == 'id':\n   63 |                         yield(Token('id', match_text))\n   64 |                     elif tid == 'eol':\n   65 |                         # yield('eol')\n   66 |                         lineno += 1\n   67 |                         col = 1\n   68 |                         line_start = mo.end()\n   69 |                     elif tid == 'varexp':\n   70 |                         yield(Token('varexp', match_text[2:-1]))\n   71 |                     else:\n   72 |                         raise ValueError(f'lex: unknown element {tid}')\n   73 |                     break\n   74 |             if not matched:\n   75 |                 raise ValueError('Lexer got confused line %d column %d' % (lineno, col))","lines":38,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/cmake2meson.py#L38-L75"},{"ref":"tools/cmake2meson.py:94-97","code":"   94 |     def expect(self, s: str) -> bool:\n   95 |         if self.accept(s):\n   96 |             return True\n   97 |         raise ValueError(f'Expecting {s} got {self.current.tid}.', self.current.lineno, self.current.colno)","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/cmake2meson.py#L94-L97"}]},{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"In `get_data`, `dlsize = int(resp.info()['Content-Length'])` only catches `TypeError` (raised when the header is missing and `int(None)` fails). If the server sends a non-numeric `Content-Length`, `int()` raises `ValueError`, which is uncaught and aborts the download with a traceback instead of falling back to the unknown-size path.","fix":"Catch `(TypeError, ValueError)` (or use `resp.length`) so a malformed header degrades to the unknown-size download path.","locations":[{"ref":"mesonbuild/wrap/wrap.py:837-840","code":"  837 |             try:\n  838 |                 dlsize = int(resp.info()['Content-Length'])\n  839 |             except TypeError:\n  840 |                 dlsize = None","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/wrap/wrap.py#L837-L840"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`LLVMDependencyConfigTool` uses `str.lstrip`/`str.rstrip` with multi-character strings, which strip *character sets*, not prefixes/suffixes. `arg.lstrip('-LIBPATH:')` will corrupt a path whose drive letter is one of L/I/B/P/A/T/H (e.g. `-LIBPATH:T:/lib` becomes `/lib`); `os.path.basename(matches[0]).rstrip(lib_ext).lstrip('lib')` and `os.path.splitext(file_.lstrip('lib'))[0]` can over-strip library names beginning/ending with those characters.","fix":"Use prefix/suffix-safe operations, e.g. `arg[len('-LIBPATH:'):]` (or `removeprefix`), and `removesuffix`/`removeprefix` (or slicing) for the `lib` prefix and extension instead of `lstrip`/`rstrip`.","locations":[{"ref":"mesonbuild/dependencies/dev.py:249-253","code":"  249 |             if arg.startswith('-l') and arg.endswith('.so'):\n  250 |                 new_args.append(arg.lstrip('-l'))\n  251 |             elif arg.startswith('-LIBPATH:'):\n  252 |                 cpp = self.env.coredata.compilers[self.for_machine]['cpp']\n  253 |                 new_args.extend(cpp.get_linker_search_args(arg.lstrip('-LIBPATH:')))","lines":5,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/dev.py#L249-L253"},{"ref":"mesonbuild/dependencies/dev.py:307-309","code":"  307 |                 self.link_args = self.get_config_value(['--ldflags'], 'link_args')\n  308 |                 libname = os.path.basename(matches[0]).rstrip(lib_ext).lstrip('lib')\n  309 |                 self.link_args.append(f'-l{libname}')","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/dev.py#L307-L309"},{"ref":"mesonbuild/dependencies/dev.py:351-354","code":"  351 |             for file_ in os.listdir(libdir):\n  352 |                 if re_name.match(file_):\n  353 |                     self.link_args = [f'-L{libdir}',\n  354 |                                       '-l{}'.format(os.path.splitext(file_.lstrip('lib'))[0])]","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/dev.py#L351-L354"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`get_compiler_system_lib_dirs()` parses the `-print-search-dirs` output with\n`str.lstrip()`, which strips a *set of characters*, not a prefix:\n```python\nsplit = out.split('\\n')[index].lstrip('libraries: =').split(':')\n```\n`lstrip('libraries: =')` removes any leading run of the characters\n`{l,i,b,r,a,s,:,space,=}`. It happens to work only because the following path\nbegins with `/`; any library search path that begins with one of those\ncharacters (a relative path, or a drive-relative fragment) would be silently\ntruncated. This is a fragile misuse of `lstrip`.","fix":"Strip the exact prefix instead, e.g.:\n```python\nline = out.split('\\n')[index]\nprefix = 'libraries: ='\nif line.startswith(prefix):\n    line = line[len(prefix):]\nsplit = line.split(':')\n```","locations":[{"ref":"mesonbuild/environment.py:560-564","code":"  560 |         p, out, _ = Popen_safe(comp.get_exelist() + ['-print-search-dirs'])\n  561 |         if p.returncode != 0:\n  562 |             raise mesonlib.MesonException('Could not calculate system search dirs')\n  563 |         split = out.split('\\n')[index].lstrip('libraries: =').split(':')\n  564 |         return [os.path.normpath(p) for p in split]","lines":5,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/environment.py#L560-L564"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"In `guess_nix_linker`, after `extra_args = extra_args or []`, the line `extra_args += comp_class._unix_args_to_native(...)` mutates the list in place. When a caller passes a non-empty list, `extra_args` still references that same list object, so the caller's list is silently extended with linker/ldflags-derived arguments. Current callers in `compilers/detect.py` always pass freshly-built single-use lists (e.g. `[f]`, `[f, arch_arg]`), so there is no observable bug today, but this is a fragile latent side effect: any future caller that reuses its list would get corrupted arguments.","fix":"Build a new list instead of mutating the argument:\nbefore: `extra_args += comp_class._unix_args_to_native(ldflags, env.machines[for_machine])`\nafter: `extra_args = extra_args + comp_class._unix_args_to_native(ldflags, env.machines[for_machine])`","locations":[{"ref":"mesonbuild/linkers/detect.py:128-132","code":"  128 |     extra_args = extra_args or []\n  129 | \n  130 |     system = env.machines[for_machine].system\n  131 |     ldflags = env.coredata.get_external_link_args(for_machine, comp_class.language)\n  132 |     extra_args += comp_class._unix_args_to_native(ldflags, env.machines[for_machine])","lines":5,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/linkers/detect.py#L128-L132"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"In `Parser.testcaseblock`, `endtestcase = SymbolNode(self.current)` constructs the node directly instead of via `self.create_node(SymbolNode, self.current)` as every other node in the parser does. This bypasses the attached-whitespace handling (`self.current_ws` is neither drained onto the node nor cleared), which can misattribute whitespace/comments in the round-trippable AST used by the formatter. Only reachable in unit-test mode (`testcase`/`endtestcase` keywords), so impact is minimal.","fix":"before:\n```python\n        endtestcase = SymbolNode(self.current)\n```\nafter:\n```python\n        endtestcase = self.create_node(SymbolNode, self.current)\n```","locations":[{"ref":"mesonbuild/mparser.py:1079","code":" 1079 |         endtestcase = SymbolNode(self.current)","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mparser.py#L1079"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`VisualStudioLikeCPPCompilerMixin._get_options_impl` takes an `opts` parameter but immediately overwrites it with `opts = super().get_options()`, discarding the argument. Every caller passes `super().get_options()` as that argument (e.g. `self._get_options_impl(super().get_options(), cpp_stds)`), so the option dictionary is built twice per call for MSVC/clang-cl/intel-cl C++ compilers. The discarded parameter is also misleading to readers.","fix":"Either remove the `opts` parameter and keep the internal `super().get_options()`, or use the passed-in `opts` and drop the redundant `opts = super().get_options()` line, so `get_options()` is only computed once.","locations":[{"ref":"mesonbuild/compilers/cpp.py:799-800","code":"  799 |     def _get_options_impl(self, opts: 'MutableKeyedOptionDictType', cpp_stds: T.List[str]) -> 'MutableKeyedOptionDictType':\n  800 |         opts = super().get_options()","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/cpp.py#L799-L800"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`_gen_qml_cachegen` computes `self._source_to_files(state, kwargs['qml_sources'])` twice into `qml_sources` (line 929) and `qml_sources_paths` (line 933) with identical arguments, duplicating the file-resolution work for every qml_module invocation.","fix":"Compute the list once and reuse it: assign `qml_sources = self._source_to_files(state, kwargs['qml_sources'])`, pass it to `cache_gen.process_files(...)`, and iterate the same variable when building `cachegen_inputs` instead of recomputing `qml_sources_paths`.","locations":[{"ref":"mesonbuild/modules/_qt.py:929-934","code":"  929 |         qml_sources = self._source_to_files(state, kwargs['qml_sources'])\n  930 |         output.append(cache_gen.process_files(qml_sources, state.subdir))\n  931 | \n  932 |         cachegen_inputs: T.List[str] = []\n  933 |         qml_sources_paths = self._source_to_files(state, kwargs['qml_sources'])\n  934 |         for s in qml_sources_paths:","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/_qt.py#L929-L934"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `ClangCompiler.use_linker_args` the block `if shutil.which(linker):` immediately re-tests `if not shutil.which(linker): raise ...`. When the outer condition is true, `shutil.which(linker)` is (re-)truthy, so the inner `not shutil.which(linker)` branch can never execute; the `MesonException('Cannot find linker ...')` is unreachable dead code. This also calls `shutil.which` twice needlessly. The intent was presumably to accept a linker specified by path and error out if it does not resolve, but as written the error path is dead.","fix":"Collapse to a single check, e.g.:\n```python\nif shutil.which(linker):\n    return [f'-fuse-ld={linker}']\nreturn super().use_linker_args(linker, version)\n```\nor, if a hard failure for path-like linkers is desired, test for a path separator first and raise only then.","locations":[{"ref":"mesonbuild/compilers/mixins/clang.py:192-197","code":"  192 |         if shutil.which(linker):\n  193 |             if not shutil.which(linker):\n  194 |                 raise mesonlib.MesonException(\n  195 |                     f'Cannot find linker {linker}.')\n  196 |             return [f'-fuse-ld={linker}']\n  197 |         return super().use_linker_args(linker, version)","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/mixins/clang.py#L192-L197"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`DlangModule.init_dub` is a class flag initialized to `False` and checked in `generate_dub_file` via `if not DlangModule.init_dub: self._init_dub(state)`, but it is never set to `True` anywhere. Consequently the guard is a no-op and `_init_dub` is invoked on every call (harmless only because `class_dubbin` caches the result). Either the flag should be set after a successful init, or removed. The `_init_dub` body itself is also convoluted, reassigning `self.dubbin` up to four times with overlapping branches.","fix":"Set `DlangModule.init_dub = True` at the end of `_init_dub` (and simplify the repeated `self.dubbin` assignments), or drop the unused flag entirely.","locations":[{"ref":"mesonbuild/modules/dlang.py:33-34","code":"   33 |     class_dubbin: T.Union[Program, Literal[False], None] = None\n   34 |     init_dub = False","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/dlang.py#L33-L34"},{"ref":"mesonbuild/modules/dlang.py:46-65","code":"   46 |     def _init_dub(self, state: ModuleState) -> None:\n   47 |         if DlangModule.class_dubbin is None and DubDependency.class_dubbin is not None:\n   48 |             self.dubbin = DubDependency.class_dubbin[0]\n   49 |             DlangModule.class_dubbin = self.dubbin\n   50 |         else:\n   51 |             self.dubbin = DlangModule.class_dubbin\n   52 | \n   53 |         if DlangModule.class_dubbin is None:\n   54 |             self.dubbin = self.check_dub(state)\n   55 |             DlangModule.class_dubbin = self.dubbin\n   56 |         else:\n   57 |             self.dubbin = DlangModule.class_dubbin\n   58 | \n   59 |         if not self.dubbin:\n   60 |             if not self.dubbin:\n   61 |                 raise MesonException('DUB not found.')\n   62 | \n   63 |     @typed_pos_args('dlang.generate_dub_file', str, str)\n   64 |     def generate_dub_file(self, state: ModuleState, args: T.Tuple[str, str], kwargs: TYPE_kwargs) -> None:\n   65 |         if not DlangModule.init_dub:","lines":20,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/dlang.py#L46-L65"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The docstring of `ProgressBarFallback` is corrupted: an entire `OptionType(enum.IntEnum)` class definition and a `_BUILTIN_NAMES` dict were mis-pasted into the middle of the triple-quoted docstring. Line 2405 reads `Fallback progress bar implementation when tqdm is not foundclass OptionType(enum.IntEnum):` (two statements glued together, no space), and everything from `OptionType` through the `_BUILTIN_NAMES` closing `}` sits inside the `'''...'''` docstring. I confirmed at runtime that neither `OptionType` nor `_BUILTIN_NAMES` are real module attributes (`'OptionType' in dir(universal)` is `False`). The class still works (it is all just a docstring), but the docstring is garbage, and this shows a botched cleanup after commit `0d7bb776` (\"Move OptionKey in the option source file\"). Note that `mesonbuild/options.py:654` still carries a comment `Also update mesonlib._BUILTIN_NAMES`, which now refers to a symbol that effectively no longer exists here.","fix":"Delete the mis-pasted `OptionType` enum and `_BUILTIN_NAMES` dict (lines ~2405-2457) so the docstring reads only its intended prose, e.g.:\n```python\nclass ProgressBarFallback(T.Generic[_T]):\n    '''\n    Fallback progress bar implementation when tqdm is not found.\n\n    Since this class is not an actual iterator, but only provides a minimal\n    fallback, it is safe to ignore the 'Iterator does not return self from\n    __iter__ method' warning.\n    '''\n```\nAlso reconcile the stale `mesonlib._BUILTIN_NAMES` reference in `options.py`.","locations":[{"ref":"mesonbuild/utils/universal.py:2403-2462","code":" 2403 | class ProgressBarFallback(T.Generic[_T]):\n 2404 |     '''\n 2405 |     Fallback progress bar implementation when tqdm is not foundclass OptionType(enum.IntEnum):\n 2406 | \n 2407 |     \"\"\"Enum used to specify what kind of argument a thing is.\"\"\"\n 2408 | \n 2409 |     BUILTIN = 0\n 2410 |     BACKEND = 1\n 2411 |     BASE = 2\n 2412 |     COMPILER = 3\n 2413 |     PROJECT = 4\n 2414 | \n 2415 | # This is copied from coredata. There is no way to share this, because this\n 2416 | # is used in the OptionKey constructor, and the coredata lists are\n 2417 | # OptionKeys...\n 2418 | _BUILTIN_NAMES = {\n 2419 |     'prefix',\n 2420 |     'bindir',\n 2421 |     'datadir',\n 2422 |     'includedir',\n 2423 |     'infodir',\n 2424 |     'libdir',\n 2425 |     'licensedir',\n 2426 |     'libexecdir',\n 2427 |     'localedir',\n 2428 |     'localstatedir',\n 2429 |     'mandir',\n 2430 |     'sbindir',\n 2431 |     'sharedstatedir',\n 2432 |     'sysconfdir',\n 2433 |     'auto_features',\n 2434 |     'backend',\n 2435 |     'buildtype',\n 2436 |     'debug',\n 2437 |     'default_library',\n 2438 |     'errorlogs',\n 2439 |     'genvslite',\n 2440 |     'install_umask',\n 2441 |     'layout',\n 2442 |     'optimization',\n 2443 |     'prefer_static',\n 2444 |     'stdsplit',\n 2445 |     'strip',\n 2446 |     'unity',\n 2447 |     'unity_size',\n 2448 |     'warning_level',\n 2449 |     'werror',\n 2450 |     'wrap_mode',\n 2451 |     'force_fallback_for',\n 2452 |     'pkg_config_path',\n 2453 |     'cmake_prefix_path',\n 2454 |     'vsenv',\n 2455 |     'os2_emxomf',\n 2456 | }\n 2457 | \n 2458 | \n 2459 |     Since this class is not an actual iterator, but only provides a minimal\n 2460 |     fallback, it is safe to ignore the 'Iterator does not return self from\n 2461 |     __iter__ method' warning.\n 2462 |     '''","lines":60,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/utils/universal.py#L2403-L2462"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`get_target_private_dir` calls `os.path.join(...)` with a single argument, which just returns that argument unchanged. The `os.path.join` wrapper is pointless.","fix":"Before:\n```python\nreturn os.path.join(self.get_target_filename(target, warn_multi_output=False) + '.p')\n```\nAfter:\n```python\nreturn self.get_target_filename(target, warn_multi_output=False) + '.p'\n```","locations":[{"ref":"mesonbuild/backend/backends.py:413-414","code":"  413 |     def get_target_private_dir(self, target: build.AnyTargetType) -> str:\n  414 |         return os.path.join(self.get_target_filename(target, warn_multi_output=False) + '.p')","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/backend/backends.py#L413-L414"}]},{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `generate_pbx_native_target`, a `generator_id` counter is initialized to 0 and incremented inside the loop over `t.generated` that adds custom-target/custom-target-index dependencies, but the counter value is never read anywhere in that loop. It is leftover dead code that suggests an intent (per-generator indexing) that is not used here.","fix":"Remove the unused `generator_id = 0` initialization and the `generator_id += 1` increment from this loop (the loop only needs to iterate over `t.generated` filtering for `CustomTarget`/`CustomTargetIndex`).","locations":[{"ref":"mesonbuild/backend/xcodebackend.py:1332-1337","code":" 1332 |             generator_id = 0\n 1333 |             for o in t.generated:\n 1334 |                 if isinstance(o, (build.CustomTarget, build.CustomTargetIndex)):\n 1335 |                     dep_array.add_item(self.pbx_custom_dep_map[o.get_id()], o.get_basename())\n 1336 | \n 1337 |                 generator_id += 1","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/backend/xcodebackend.py#L1332-L1337"}]},{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `SharedLibrary.determine_naming_info` the local `create_debug_file` is assigned `False` twice in immediate succession, a redundant duplicate statement with no effect.","fix":"Delete one of the two consecutive `create_debug_file = False` lines.","locations":[{"ref":"mesonbuild/build.py:2611-2612","code":" 2611 |         create_debug_file = False\n 2612 |         create_debug_file = False","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/build.py#L2611-L2612"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Redundant double assignment `linker = linker = guess_win_linker(...)` in the Intel oneAPI DPC++/C++ detection branch. The duplicated `linker =` has no effect and is likely a copy-paste artifact.","fix":"Remove the duplicated assignment.\nBefore:\n```python\n            linker = linker = guess_win_linker(\n```\nAfter:\n```python\n            linker = guess_win_linker(\n```","locations":[{"ref":"mesonbuild/compilers/detect.py:508-510","code":"  508 |             linker = linker = guess_win_linker(\n  509 |                     env, ['link'], cls, version,\n  510 |                     for_machine)","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/detect.py#L508-L510"}]},{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In both `MetrowerksCompiler._unix_args_to_native` and `Xc16Compiler._unix_args_to_native` the transforms `if i.startswith('-D'): i = '-D' + i[2:]` and `if i.startswith('-I'): i = '-I' + i[2:]` are no-ops: `'-D' + i[2:]` is identical to `i` when `i` already starts with `-D` (same for `-I`). This looks copy-pasted from compilers like `ccrx` where the prefix is actually rewritten (`-define=`, `-include=`). The lines have no effect and are misleading to future readers.","fix":"Delete the two identity `if` statements (or, if a rewrite was actually intended for these toolchains, implement the correct target-native prefix).","locations":[{"ref":"mesonbuild/compilers/mixins/metrowerks.py:260-264","code":"  260 |         for i in args:\n  261 |             if i.startswith('-D'):\n  262 |                 i = '-D' + i[2:]\n  263 |             if i.startswith('-I'):\n  264 |                 i = '-I' + i[2:]","lines":5,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/mixins/metrowerks.py#L260-L264"},{"ref":"mesonbuild/compilers/mixins/microchip.py:96-99","code":"   96 |             if i.startswith('-D'):\n   97 |                 i = '-D' + i[2:]\n   98 |             if i.startswith('-I'):\n   99 |                 i = '-I' + i[2:]","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/mixins/microchip.py#L96-L99"}]},{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`ExternalDependency.get_partial_dependency` contains a redundant duplicated block: `if not sources: new.sources = []` appears twice, and `if not includes: pass` is a no-op placeholder.","fix":"Before:\n```python\n        if not sources:\n            new.sources = []\n        if not includes:\n            pass # TODO maybe filter compile_args?\n        if not sources:\n            new.sources = []\n```\nAfter:\n```python\n        if not sources:\n            new.sources = []\n        # TODO maybe filter compile_args when not includes\n```","locations":[{"ref":"mesonbuild/dependencies/base.py:453-459","code":"  453 |             new.link_args = []\n  454 |         if not sources:\n  455 |             new.sources = []\n  456 |         if not includes:\n  457 |             pass # TODO maybe filter compile_args?\n  458 |         if not sources:\n  459 |             new.sources = []","lines":7,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/base.py#L453-L459"}]},{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Redundant nested identical condition in `DlangModule._init_dub`: `if not self.dubbin:` immediately contains another `if not self.dubbin:`. The inner check is always true and is dead.","fix":"```python\n# before\nif not self.dubbin:\n    if not self.dubbin:\n        raise MesonException('DUB not found.')\n# after\nif not self.dubbin:\n    raise MesonException('DUB not found.')\n```","locations":[{"ref":"mesonbuild/modules/dlang.py:59-61","code":"   59 |         if not self.dubbin:\n   60 |             if not self.dubbin:\n   61 |                 raise MesonException('DUB not found.')","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/dlang.py#L59-L61"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The cross-compilation guard uses `f'{id} supports only cross-compilation.'`. Inside a method, the bare name `id` resolves to the Python built-in `id` function, not the class attribute `self.id`. The raised message therefore reads like `<built-in function id> supports only cross-compilation.` instead of the compiler name. Sibling compilers use a hardcoded string (e.g. `'ccrx supports only cross-compilation.'`).","fix":"Reference the instance attribute: replace `f'{id} supports only cross-compilation.'` with `f'{self.id} supports only cross-compilation.'` (or a literal `'mwcc supports only cross-compilation.'`).","locations":[{"ref":"mesonbuild/compilers/mixins/metrowerks.py:175-177","code":"  175 |     def __init__(self) -> None:\n  176 |         if not self.is_cross:\n  177 |             raise EnvironmentException(f'{id} supports only cross-compilation.')","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/mixins/metrowerks.py#L175-L177"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Same defect as in `metrowerks.py`: `raise EnvironmentException(f'{id} supports only cross-compilation.')` references the built-in `id` function rather than the compiler id, producing a confusing message such as `<built-in function id> supports only cross-compilation.`. `TaskingCompiler` doesn't even define `id` in this module, so there is no local shadow either.","fix":"Use `f'{self.id} supports only cross-compilation.'` (or a literal like `'tasking supports only cross-compilation.'`).","locations":[{"ref":"mesonbuild/compilers/mixins/tasking.py:54-56","code":"   54 |     def __init__(self) -> None:\n   55 |         if not self.is_cross:\n   56 |             raise EnvironmentException(f'{id} supports only cross-compilation.')","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/mixins/tasking.py#L54-L56"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `BasicPythonExternalProgram.sanity()` the diagnostic message for the missing\nC API is inverted; it says the installation *does* support the C API inside the\nbranch that fires when it does *not*:\n```python\nif not self.build_config['c_api']:\n    mlog.debug('This Python installation does support the C API')\n    return False\n```\nThe neighbouring libpython branch is worded correctly (`does not provide a\nlibpython`). The message should say \"does not support\".","fix":"Fix the wording:\n```python\nmlog.debug('This Python installation does not support the C API')\n```","locations":[{"ref":"mesonbuild/dependencies/python.py:221-223","code":"  221 |             if not self.build_config['c_api']:\n  222 |                 mlog.debug('This Python installation does support the C API')\n  223 |                 return False","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/python.py#L221-L223"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"In `mdevenv.run`, when launching a bash devenv shell a `tempfile.NamedTemporaryFile` (default `delete=True`) is created for the rcfile with the comment `# Let the GC remove the tmp file`. On non-Windows, the process is replaced by `os.execvpe`, so neither the object's `__del__`/GC nor normal interpreter shutdown ever runs; the temp rcfile is never deleted and is leaked in the temp dir on every `meson devenv` bash invocation. The comment is misleading about how cleanup happens.","fix":"Acknowledge the exec in the comment and clean up explicitly if feasible (e.g. write to a path removed by the shell itself, or delete before exec), and correct the comment which implies GC will handle it.","locations":[{"ref":"mesonbuild/mdevenv.py:236-246","code":"  236 |         if \"bash\" in args[0]:\n  237 |             # Let the GC remove the tmp file\n  238 |             tmprc = tempfile.NamedTemporaryFile(mode='w', encoding='utf-8')\n  239 |             tmprc.write('[ -e ~/.bashrc ] && . ~/.bashrc\\n')\n  240 |             if prompt_prefix:\n  241 |                 tmprc.write(f'export PS1=\"{prompt_prefix} $PS1\"\\n')\n  242 |             for f in bash_completion_files(b, install_data):\n  243 |                 tmprc.write(f'. \"{f}\"\\n')\n  244 |             tmprc.flush()\n  245 |             args.append(\"--rcfile\")\n  246 |             args.append(tmprc.name)","lines":11,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mdevenv.py#L236-L246"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Docstring of `_scan_fortran_file_deps` has a stray typo: the first sentence ends with `include` statements.er` - a trailing `er` fragment left over from an edit.","fix":"Remove the trailing `er`: change `to allow for recursion induced by \\`include\\` statements.er` to `to allow for recursion induced by \\`include\\` statements.`","locations":[{"ref":"mesonbuild/backend/ninjabackend.py:4288","code":" 4288 |     to allow for recursion induced by `include` statements.er","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/backend/ninjabackend.py#L4288"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Copy-pasted comment in `Vs2026Backend.detect_toolset` says the wrong Visual Studio version. It reads `# We don't have support for versions older than 2022 right now.` (copied verbatim from `vs2022backend.py`) inside the 2026 backend.","fix":"Before:\n```python\n                # We don't have support for versions older than 2022 right now.\n```\nAfter:\n```python\n                # We don't have support for versions older than 2026 right now.\n```","locations":[{"ref":"mesonbuild/backend/vs2026backend.py:36","code":"   36 |                 # We don't have support for versions older than 2022 right now.","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/backend/vs2026backend.py#L36"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"A comment in `ConverterTarget.postprocess` ends with a stray digit: 'corresponding custom target is run.2'. The trailing `2` is a leftover typo.","fix":"Remove the stray `2`: change `... is run.2` to `... is run.`","locations":[{"ref":"mesonbuild/cmake/interpreter.py:350-353","code":"  350 |                     # Sometimes projects pass generated source files as compiler\n  351 |                     # flags. Add these as generated sources to ensure that the\n  352 |                     # corresponding custom target is run.2\n  353 |                     self.generated_raw += [Path(j)]","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cmake/interpreter.py#L350-L353"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"In `SingleTestRunner._get_test_cmd`, the inner branch under `if self.test.cmd_is_exe and self.test.is_cross_built and self.test.needs_exe_wrapper:` reads `elif self.test.cmd_is_exe:` with the comment \"If the command is not built (ie, its a python script), then we don't check for the exe-wrapper\". The `elif self.test.cmd_is_exe` condition is always true here (it is already required by the enclosing `if`), so the described \"not built\" path is dead and the `exe_wrapper.found()` check always runs; the comment misdescribes the actual behavior.","fix":"Remove the redundant `elif self.test.cmd_is_exe:` (inline its body) and delete or correct the misleading comment about skipping the exe-wrapper check for non-built commands.","locations":[{"ref":"mesonbuild/mtest.py:1543-1555","code":" 1543 |         elif self.test.cmd_is_exe and self.test.is_cross_built and self.test.needs_exe_wrapper:\n 1544 |             if self.test.exe_wrapper is None:\n 1545 |                 # Can not run test on cross compiled executable\n 1546 |                 # because there is no execute wrapper.\n 1547 |                 return None\n 1548 |             elif self.test.cm d node-building closures into named, unit-testable helpers.","locations":[{"ref":"mesonbuild/cmake/interpreter.py:213-1336","code":"  213 | class ConverterTarget:\n  214 |     def __init__(self, target: CMakeTarget, env: 'Environment', for_machine: MachineChoice) -> None:\n  215 |         self.env = env\n  216 |         self.for_machine = for_machine\n  217 |         self.artifacts = target.artifacts\n  218 |         self.src_dir = target.src_dir\n  219 |         self.build_dir = target.build_dir\n  220 |         self.name = target.name\n  221 |         self.cmake_name = target.name\n  222 |         self.full_name = target.full_name\n  223 |         self.type = target.type\n  224 |         self.install = target.install\n  225 |         self.install_dir: T.Optional[Path] = None\n  226 |         self.link_libraries = target.link_libraries\n  227 |         self.link_targets: T.List[str] = []\n  228 |         self.link_flags = target.link_flags + target.link_lang_flags\n  229 |         self.public_link_flags: T.List[str] = []\n  230 |         self.depends_raw: T.List[str] = []\n  231 |         self.depends: T.List[T.Union[ConverterTarget, ConverterCustomTarget]] = []\n  232 | \n  233 |         if target.install_paths:\n  234 |             self.install_dir = target.install_paths[0]\n  235 | \n  236 |         self.languages: T.Set[Language] = set()\n  237 |         self.sources: T.List[Path] = []\n  238 |         self.generated: T.List[Path] = []\n  239 |         self.generated_ctgt: T.List[CustomTargetReference] = []\n  240 |         self.includes: T.List[Path] = []\n  241 |         self.sys_includes: T.List[Path] = []\n  242 |         self.link_with: T.List[T.Union[ConverterTarget, ConverterCustomTarget]] = []\n  243 |         self.object_libs: T.List[ConverterTarget] = []\n  244 |         self.compile_opts: T.Dict[Language, T.List[str]] = {}\n  245 |         self.public_compile_opts: T.List[str] = []\n  246 |         self.pie = False\n  247 |         self.version: T.Op (function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
