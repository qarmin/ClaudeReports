<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>
<body>
<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"very_easy","description":"`Vs2015Backend.__init__` never calls `super().__init__(build)`, unlike every sibling backend (`Vs2012Backend`, `Vs2013Backend`, `Vs2017Backend`, etc. all call it). Because neither `Vs2010Backend.__init__` nor `Backend.__init__` runs, none of the required instance attributes are set: `self.environment`, `self.build_dir`, `self.build_to_src`, `self.processed_targets`, `self.platform_toolset`, `self.gen_lite`, `self.subdirs`, `self.handled_target_deps`, `self.project_file_version`, etc. The very first thing `generate()` does is call `detect_toolset()`, which reads `self.environment` (and later `self.platform_toolset`), so selecting the vs2015 backend (via `--backend=vs2015` or autodetection of Visual Studio 14.0 in `autodetect_vs_version`) crashes immediately with `AttributeError`. The backend is completely non-functional.","fix":"Add the missing super call as the first statement of `__init__`:\n\nBefore:\n```python\n    def __init__(self, build: T.Optional[Build]):\n        self.vs_version = '2015'\n        self.sln_file_version = '12.00'\n        self.sln_version_comment = '14'\n```\nAfter:\n```python\n    def __init__(self, build: T.Optional[Build]):\n        super().__init__(build)\n        self.vs_version = '2015'\n        self.sln_file_version = '12.00'\n        self.sln_version_comment = '14'\n```","locations":[{"ref":"mesonbuild/backend/vs2015backend.py:18-21","code":"   18 |     def __init__(self, build: T.Optional[Build]):\n   19 |         self.vs_version = '2015'\n   20 |         self.sln_file_version = '12.00'\n   21 |         self.sln_version_comment = '14'","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/backend/vs2015backend.py#L18-L21"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In `ArmCPPCompiler.get_options`, `std_opt` is assigned the result of `self.form_compileropt_key('std')`, which is an `OptionKey`, not the option object stored in `opts`. Every other compiler class (e.g. `TICPPCompiler`, `ArmclangCPPCompiler`) does `opts[key]` to fetch the actual `UserStdOption`. As written, `assert isinstance(std_opt, options.UserStdOption)` fails with an `AssertionError` when assertions are enabled, and when they are disabled the following `std_opt.set_versions(['c++03', 'c++11'])` raises `AttributeError` because `OptionKey` has no `set_versions` method. This code runs during option processing whenever an ARM C++ compiler (`armcc`) is configured, so it makes that compiler unusable.","fix":"Fetch the option from `opts` before asserting/mutating.\nBefore:\n```python\n        std_opt = self.form_compileropt_key('std')\n        assert isinstance(std_opt, options.UserStdOption), 'for mypy'\n        std_opt.set_versions(['c++03', 'c++11'])\n```\nAfter:\n```python\n        key = self.form_compileropt_key('std')\n        std_opt = opts[key]\n        assert isinstance(std_opt, options.UserStdOption), 'for mypy'\n        std_opt.set_versions(['c++03', 'c++11'])\n```","locations":[{"ref":"mesonbuild/compilers/cpp.py:1021-1026","code":" 1021 |     def get_options(self) -> 'MutableKeyedOptionDictType':\n 1022 |         opts = super().get_options()\n 1023 |         std_opt = self.form_compileropt_key('std')\n 1024 |         assert isinstance(std_opt, options.UserStdOption), 'for mypy'\n 1025 |         std_opt.set_versions(['c++03', 'c++11'])\n 1026 |         return opts","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/cpp.py#L1021-L1026"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`HDF5ConfigToolDependency._sanitize_version` does `v = re.search(...); return v.group(1)` without checking for a match. It is invoked from `ConfigToolDependency._check_and_get_version` on the raw `-showconfig` output; if that output does not contain `HDF5 Version: X.Y.Z` (different tool version, error text, etc.) `v` is `None` and `v.group(1)` raises `AttributeError`. This is not caught by the `(FileNotFoundError, PermissionError)` handler in `find_config`, so it surfaces as a `MesonBugException` crash rather than a clean not-found.","fix":"Guard the match: if `v is None`, fall back to the base `_sanitize_version` behavior or return the original string / raise a `DependencyException`, e.g. `return v.group(1) if v else super()._sanitize_version(ver)`.","locations":[{"ref":"mesonbuild/dependencies/hdf5.py:138-140","code":"  138 |     def _sanitize_version(self, ver: str) -> str:\n  139 |         v = re.search(r'\\s*HDF5 Version: (\\d+\\.\\d+\\.\\d+)', ver)\n  140 |         return v.group(1)","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/hdf5.py#L138-L140"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`SystemDependency.meson_version` iterates comma-split version fragments and indexes `v[0]` after stripping. An empty fragment (e.g. a `version` string like `\"1.0,\"` or `\">=1.0, \"`, which yields an empty component after split/strip) makes `v[0]` raise an uncaught `IndexError` when building the meson version constraints for a `system-deps` entry.","fix":"Skip empty fragments:\n```python\n# before\nfor v in vers:\n    v = v.strip()\n    if v[0] not in '><=':\n# after\nfor v in vers:\n    v = v.strip()\n    if not v:\n        continue\n    if v[0] not in '><=':\n```","locations":[{"ref":"mesonbuild/cargo/manifest.py:266-275","code":"  266 |     @lazy_property\n  267 |     def meson_version(self) -> T.List[str]:\n  268 |         vers = self.version.split(',') if self.version else []\n  269 |         result: T.List[str] = []\n  270 |         for v in vers:\n  271 |             v = v.strip()\n  272 |             if v[0] not in '><=':\n  273 |                 v = f'>={v}'\n  274 |             result.append(v)\n  275 |         return result","lines":10,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cargo/manifest.py#L266-L275"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`parse_generator_expressions` evaluates the `IF` generator expression with `x.split(',')[1]` / `x.split(',')[2]` without checking that three comma-separated parts exist. A malformed expression such as `$<IF:1>` or `$<IF:1,a>` (which can appear in externally-supplied CMake package/config files consumed by the CMake dependency backend) raises an uncaught `IndexError`, aborting the Meson run instead of warning like the other unsupported cases. The expression is also split up to three times, which is needlessly wasteful.","fix":"Split once and guard the arity, returning `''` (or warning) when fewer than three parts are present, e.g. `parts = x.split(','); return parts[1] if len(parts) >= 3 and parts[0] == '1' else (parts[2] if len(parts) >= 3 else '')`.","locations":[{"ref":"mesonbuild/cmake/generator.py:98","code":"   98 |         'IF': lambda x: x.split(',')[1] if x.split(',')[0] == '1' else x.split(',')[2],","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cmake/generator.py#L98"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `CMakeTraceParser.parse`, the post-evaluation loop over custom targets does `if command[0] == \"\"` for each evaluated command. If an `add_custom_command`/`add_custom_target` produced an empty `COMMAND` entry (e.g. a `COMMAND` keyword immediately followed by the legacy `ARGS` keyword, which `handle_command` skips, or by end of arguments), that command list is `[]`, and `command[0]` raises an uncaught `IndexError` even in permissive mode. The same empty list would also trip the `assert curr_cmd[0] != ''` in `ConverterCustomTarget.postprocess`.","fix":"Guard against empty command lists before indexing, e.g. `if not command: continue` (or raise a `CMakeException` with a clear message) before evaluating `command[0]`.","locations":[{"ref":"mesonbuild/cmake/traceparser.py:226-230","code":"  226 |             for command, src in zip(ctgt.command, temp):\n  227 |                 if command[0] == \"\":\n  228 |                     raise CMakeException(\n  229 |                         \"We evaluated the cmake variable '{}' to an empty string, which is not a valid path to an executable.\".format(src[0])\n  230 |                     )","lines":5,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cmake/traceparser.py#L226-L230"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `CudaCompiler.to_host_flags_base`, the local `val` is not initialized at the start of each loop iteration. In the single-letter-option branch (`flag[2:3] == ''`, i.e. `-I something`) and the isolated multi-letter branch, a missing following token is handled with `try: val = next(flagit) except StopIteration: pass`, silently leaving `val` unset. Control then reaches `assert val is not None`. If such a bare option (e.g. a trailing `-I`, `-l`, `-o`, `-L`) is the first/only relevant flag, `val` is unbound and `assert val is not None` raises `UnboundLocalError`; if `val` retained a value from a previous iteration, that stale value is used silently for the current flag.","fix":"Initialize `val: T.Optional[str] = None` at the top of each loop iteration and, in the `except StopIteration` handlers, raise a clear error (or `continue`) instead of `pass` so a missing argument is reported deterministically rather than causing an `UnboundLocalError` or silently reusing a stale value.","locations":[{"ref":"mesonbuild/compilers/cuda.py:386-442","code":"  386 |             elif len(flag) >= 2 and flag[0] == '-' and flag[1] in 'IDULlmOxmte':\n  387 |                 # This is a single-letter short option. These options (with the\n  388 |                 # exception of -o) are allowed to receive their argument with neither\n  389 |                 # space nor = sign before them. Detect and separate them in that event.\n  390 |                 if flag[2:3] == '':            # -I something\n  391 |                     try:\n  392 |                         val = next(flagit)\n  393 |                     except StopIteration:\n  394 |                         pass\n  395 |                 elif flag[2:3] == '=':           # -I=something\n  396 |                     val = flag[3:]\n  397 |                 else:                            # -Isomething\n  398 |                     val = flag[2:]\n  399 |                 flag = flag[:2]                  # -I\n  400 |             elif flag in cls._FLAG_LONG2SHORT_WITHARGS or \\\n  401 |                     flag in cls._FLAG_SHORT2LONG_WITHARGS:\n  402 |                 # This is either -o or a multi-letter flag, and it is receiving its\n  403 |                 # value isolated.\n  404 |                 try:\n  405 |                     val = next(flagit)           # -o something\n  406 |                 except StopIteration:\n  407 |                     pass\n  408 |             elif flag.split('=', 1)[0] in cls._FLAG_LONG2SHORT_WITHARGS or \\\n  409 |                     flag.split('=', 1)[0] in cls._FLAG_SHORT2LONG_WITHARGS:\n  410 |                 # This is either -o or a multi-letter flag, and it is receiving its\n  411 |                 # value after an = sign.\n  412 |                 flag, val = flag.split('=', 1)    # -o=something\n  413 |             # Some dependencies (e.g., BoostDependency) add unspaced \"-isystem/usr/include\" arguments\n  414 |             elif flag.startswith('-isystem'):\n  415 |                 val = flag[8:].strip()\n  416 |                 flag = flag[:8]\n  417 |             else:\n  418 |                 # This is a flag, and it's foreign to NVCC.\n  419 |                 #\n  420 |                 # We do not know whether this GCC-speak flag takes an isolated\n  421 |                 # argument. Assuming it does not (the vast majority indeed don't),\n  422 |                 # wrap this argument in an -Xcompiler flag and send it down to NVCC.\n  423 |                 if flag == '-ffast-math':\n  424 |                     xflags.append('-use_fast_math')\n  425 |                     xflags.append('-Xcompiler='+flag)\n  426 |                 elif flag == '-fno-fast-math':\n  427 |                     xflags.append('-ftz=false')\n  428 |                     xflags.append('-prec-div=true')\n  429 |                     xflags.append('-prec-sqrt=true')\n  430 |                     xflags.append('-Xcompiler='+flag)\n  431 |                 elif flag == '-freciprocal-math':\n  432 |                     xflags.append('-prec-div=false')\n  433 |                     xflags.append('-Xcompiler='+flag)\n  434 |                 elif flag == '-fno-reciprocal-math':\n  435 |                     xflags.append('-prec-div=true')\n  436 |                     xflags.append('-Xcompiler='+flag)\n  437 |                 else:\n  438 |                     xflags.append('-Xcompiler='+cls._shield_nvcc_list_arg(flag))\n  439 |                     # The above should securely handle GCC's -Wl, -Wa, -Wp, arguments.\n  440 |                 continue\n  441 | \n  442 |             assert val is not None  # Should only trip if there is a missing argument.","lines":57,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/cuda.py#L386-L442"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `CLikeCompiler._get_library_dirs`, the ELF-class check evaluates `int(header[4])` after reading only 5 bytes. If a candidate `.so` file is exactly 4 bytes and starts with the ELF magic (`\\x7fELF`), then `header[1:4] != b'ELF'` is False and Python evaluates the right operand `int(header[4])`, indexing past the end of a 4-byte `bytes` object -> `IndexError`, which is not caught (only `OSError` is). This aborts library-dir enumeration on an otherwise recoverable corrupt/truncated file.","fix":"Guard against short reads, e.g. `if len(header) < 5 or header[1:4] != b'ELF' or header[4] == elf_class:` before appending, or broaden the `except` to also catch `IndexError`.","locations":[{"ref":"mesonbuild/compilers/mixins/clike.py:225-240","code":"  225 |             for f in files:\n  226 |                 file_to_check = os.path.join(d, f)\n  227 |                 try:\n  228 |                     with open(file_to_check, 'rb') as fd:\n  229 |                         header = fd.read(5)\n  230 |                         # if file is not an ELF file, it's weird, but accept dir\n  231 |                         # if it is elf, and the class matches, accept dir\n  232 |                         if header[1:4] != b'ELF' or int(header[4]) == elf_class:\n  233 |                             retval.append(d)\n  234 |                         # at this point, it's an ELF file which doesn't match the\n  235 |                         # appropriate elf_class, so skip this one\n  236 |                     # stop scanning after the first successful read\n  237 |                     break\n  238 |                 except OSError:\n  239 |                     # Skip the file if we can't read it\n  240 |                     pass","lines":16,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/mixins/clike.py#L225-L240"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`RustCompiler.__init__` does `self.is_beta = '-beta' in full_version` and `self.is_nightly = '-nightly' in full_version`, but the parameter is typed `full_version: T.Optional[str] = None`. If `full_version` is `None` (an allowed value per the signature, and what `RustdocTestCompiler`/`ClippyRustCompiler` could propagate via `self.full_version`), these substring tests raise `TypeError: argument of type 'NoneType' is not iterable`. The current detect path always passes a string, so this is latent, but the default and type annotation make `None` reachable.","fix":"Normalize first, e.g. `full_version = full_version or ''` before the membership tests, or default the flags to False when `full_version is None`.","locations":[{"ref":"mesonbuild/compilers/rust.py:153-154","code":"  153 |         self.is_beta = '-beta' in full_version\n  154 |         self.is_nightly = '-nightly' in full_version","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/rust.py#L153-L154"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`ConfigurationDataHolder.get_unquoted_method` unconditionally indexes `val[0]` and `val[-1]` when `val` is a `str`: `if isinstance(val, str) and val[0] == '\"' and val[-1] == '\"'`. A configuration value can legitimately be the empty string (e.g. `conf.set('x', '')`, since `configuration_data.set` accepts `str`). Calling `conf.get_unquoted('x')` then evaluates `val[0]` on `''`, raising an uncaught `IndexError` and producing an internal Meson traceback instead of returning the empty string.","fix":"Guard the length before indexing, e.g. `if isinstance(val, str) and len(val) >= 2 and val[0] == '\"' and val[-1] == '\"':`.","locations":[{"ref":"mesonbuild/interpreter/interpreterobjects.py:459-461","code":"  459 |         if isinstance(val, str) and val[0] == '\"' and val[-1] == '\"':\n  460 |             return val[1:-1]\n  461 |         return val","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreter/interpreterobjects.py#L459-L461"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`RangeHolder.op_index` is registered with `@InterpreterObject.operator(MesonOperator.INDEX)` but, unlike the analogous `ArrayHolder.op_index` (`@typed_operator(MesonOperator.INDEX, int)`), `DictHolder.op_index` and `_CustomTargetHolder.op_index`, it lacks a `@typed_operator` decorator. `operator_call` therefore performs no argument type check and passes `other` straight to `self.range[other]`. Indexing a range with a non-int (e.g. `range(5)['x']` in a meson.build) raises a raw `TypeError` (only `IndexError` is caught), surfacing as an internal error rather than a clean `InvalidArguments`.","fix":"Add `@typed_operator(MesonOperator.INDEX, int)` above `@InterpreterObject.operator(MesonOperator.INDEX)` (importing `typed_operator`) so a non-int index yields a proper `InvalidArguments` message like the other holders.","locations":[{"ref":"mesonbuild/interpreter/primitives/range.py:23-28","code":"   23 |     @InterpreterObject.operator(MesonOperator.INDEX)\n   24 |     def op_index(self, other: int) -> int:\n   25 |         try:\n   26 |             return self.range[other]\n   27 |         except IndexError:\n   28 |             raise InvalidArguments(f'Index {other} out of bounds of range.')","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreter/primitives/range.py#L23-L28"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `gtkdoc`, both `main_sgml` and `main_xml` are optional (`(str, NoneType)`, no default/required). If the user calls `gnome.gtkdoc('mod')` without either, `main_file` stays `None` and `'--mainfile=' + main_file` raises `TypeError: can only concatenate str (not \"NoneType\") to str` (and again at `'DOC_MAIN_SGML_FILE=' + main_file` when `check` is set), producing an internal traceback instead of a clean `InvalidArguments` error.","fix":"After resolving `main_file`, validate it: `if main_file is None: raise InvalidArguments('gnome.gtkdoc: main_sgml or main_xml is required')`, before building `t_args`.","locations":[{"ref":"mesonbuild/modules/gnome.py:1489-1526","code":" 1489 |         main_file = kwargs['main_sgml']\n 1490 |         main_xml = kwargs['main_xml']\n 1491 |         if main_xml is not None:\n 1492 |             if main_file is not None:\n 1493 |                 raise InvalidArguments('gnome.gtkdoc: main_xml and main_sgml are exclusive arguments')\n 1494 |             main_file = main_xml\n 1495 |         moduleversion = kwargs['module_version']\n 1496 |         targetname = modulename + ('-' + moduleversion if moduleversion else '') + '-doc'\n 1497 |         command = state.environment.get_build_command()\n 1498 | \n 1499 |         namespace = kwargs['namespace']\n 1500 | \n 1501 |         # Ensure we have a C compiler even in C++ projects.\n 1502 |         state.add_language('c', MachineChoice.HOST)\n 1503 | \n 1504 |         def abs_filenames(files: T.Iterable['FileOrString']) -> T.Iterator[str]:\n 1505 |             for f in files:\n 1506 |                 if isinstance(f, mesonlib.File):\n 1507 |                     yield f.absolute_path(state.environment.get_source_dir(), state.environment.get_build_dir())\n 1508 |                 else:\n 1509 |                     yield os.path.join(state.environment.get_source_dir(), state.subdir, f)\n 1510 | \n 1511 |         src_dirs = kwargs['src_dir']\n 1512 |         header_dirs: T.List[str] = []\n 1513 |         for src_dir in src_dirs:\n 1514 |             if isinstance(src_dir, build.IncludeDirs):\n 1515 |                 header_dirs.extend(src_dir.abs_string_list(state.environment.get_source_dir(),\n 1516 |                                                            state.environment.get_build_dir()))\n 1517 |             else:\n 1518 |                 header_dirs.append(src_dir)\n 1519 | \n 1520 |         t_args: T.List[str] = [\n 1521 |             '--internal', 'gtkdoc',\n 1522 |             '--sourcedir=' + state.environment.get_source_dir(),\n 1523 |             '--builddir=' + state.environment.get_build_dir(),\n 1524 |             '--subdir=' + state.subdir,\n 1525 |             '--headerdirs=' + '@@'.join(header_dirs),\n 1526 |             '--mainfile=' + main_file,","lines":38,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/gnome.py#L1489-L1526"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `__native_headers`, `prefix = classes[0] if not package else package`. `classes` is `required=True` but its container default is `[]`, so an explicit empty list (`classes: []`) passes validation; if `package` is also unset, `classes[0]` raises `IndexError` instead of a clean error.","fix":"Validate that `classes` is non-empty (e.g. use `allow_empty=False` on the `KwargInfo`, or raise `InvalidArguments` when `not classes and not package`).","locations":[{"ref":"mesonbuild/modules/java.py:63-90","code":"   63 |     def __native_headers(self, state: ModuleState, args: T.Tuple[T.List[mesonlib.FileOrString]],\n   64 |                          kwargs: T.Dict[str, T.Optional[str]]) -> ModuleReturnValue:\n   65 |         classes = T.cast('T.List[str]', kwargs.get('classes'))\n   66 |         package = kwargs.get('package')\n   67 | \n   68 |         if package:\n   69 |             sanitized_package = package.replace(\"-\", \"_\").replace(\".\", \"_\")\n   70 | \n   71 |         headers: T.List[str] = []\n   72 |         for clazz in classes:\n   73 |             sanitized_clazz = clazz.replace(\".\", \"_\")\n   74 |             if package:\n   75 |                 headers.append(f'{sanitized_package}_{sanitized_clazz}.h')\n   76 |             else:\n   77 |                 headers.append(f'{sanitized_clazz}. `action='append'` with no `default`, so if it is never supplied `options.Xarg` is `None`. The line `cmd = [*cl, *include_args, *options.Xarg]` then unpacks `None`, raising `TypeError: argument ... is not iterable`. Any invocation of the resource-depfile wrapper without at least one `--Xarg` crashes instead of running the preprocessor.","fix":"Give the argument a default list:\nBefore:\n```python\nparser.add_argument('--Xarg', action='append')\n```\nAfter:\n```python\nparser.add_argument('--Xarg', action='append', default=[])\n```","locations":[{"ref":"mesonbuild/scripts/rc.py:16-28","code":"   16 | parser.add_argument('--Xarg', action='append')\n   17 | \n   18 | \n   19 | def run(args: T.List[str]) -> int:\n   20 |     options, rc_args = parser.parse_known_args(args)\n   21 |     target = rc_args[-1] if rc_args else None\n   22 | \n   23 |     rc = options.rc\n   24 |     cl = options.cl\n   25 | \n   26 |     # Use preprocessor to display include files\n   27 |     include_args = [a for a in rc_args if a.startswith(('/I', '-I'))]\n   28 |     cmd = [*cl, *include_args, *options.Xarg]","lines":13,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/rc.py#L16-L28"}]},{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`_run_workers` returns `max(f.result() for f in futures if f.done() and not f.cancelled())`. If every future was cancelled (e.g. the whole run is interrupted via the SIGINT/SIGTERM handler installed just above), the generator is empty and `max()` raises `ValueError: max() arg is an empty sequence`, masking the intended interruption exit.","fix":"Guard the empty case, e.g. `results = [f.result() for f in futures if f.done() and not f.cancelled()]; return max(results) if results else 1`.","locations":[{"ref":"mesonbuild/scripts/run_tool.py:85","code":"   85 |     return max(f.result() for f in futures if f.done() and not f.cancelled())","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/run_tool.py#L85"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `osx_syms`, the index `match` is only assigned inside the `for` loop when a line containing `LC_ID_DYLIB` is found; the loop has no `else`/default. If `otool -l` output does not contain `LC_ID_DYLIB`, `match` is never bound and `result = [arr[match + 2], arr[match + 5]]` raises `NameError`. Even when found near the end of the output, `arr[match + 5]` can raise `IndexError`. Either uncaught exception aborts symbol extraction with a traceback instead of falling back to `dummy_syms`.","fix":"Initialize `match = None` before the loop and, after it, `if match is None or match + 5 >= len(arr): dummy_syms(outfilename); return` before indexing `arr`.","locations":[{"ref":"mesonbuild/scripts/symbolextractor.py:131-136","code":"  131 |     arr = output.split('\\n')\n  132 |     for (i, val) in enumerate(arr):\n  133 |         if 'LC_ID_DYLIB' in val:\n  134 |             match = i\n  135 |             break\n  136 |     result = [arr[match + 2], arr[match + 5]] # Libreoffice stores all 5 lines but the others seem irrelevant.","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/symbolextractor.py#L131-L136"}]},{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Converter.write_entry` handling of `add_library` accesses `t.args[1].value` without checking argument count. A CMake `add_library(foo)` (or any call with a single argument) yields an `IndexError` that aborts the whole conversion. The same unchecked `t.args[0]`/`t.args[1]` pattern exists for other commands (`add_subdirectory`, `find_package`, etc.), making the converter fragile against otherwise valid CMake input.","fix":"Guard on `len(t.args)` before indexing (e.g. treat `add_library` with fewer than 2 args as the plain `library` case) and generally validate argument counts before subscripting.","locations":[{"ref":"tools/cmake2meson.py:197-207","code":"  197 |         elif t.name == 'add_library':\n  198 |             if t.args[1].value == 'SHARED':\n  199 |                 libcmd = 'shared_library'\n  200 |                 args = [t.args[0]] + t.args[2:]\n  201 |             elif t.args[1].value == 'STATIC':\n  202 |                 libcmd = 'static_library'\n  203 |                 args = [t.args[0]] + t.args[2:]\n  204 |             else:\n  205 |                 libcmd = 'library'\n  206 |                 args = t.args\n  207 |             line = '{}_lib = {}({})'.format(t.args[0].value, libcmd, self.convert_args(args, False))","lines":11,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/cmake2meson.py#L197-L207"}]},{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`get_entries()` in `dircondenser.py` does `(number, rest) = e.split(' ', 1)` on every directory name from `glob('*')`. A directory name without a space raises `ValueError: not enough values to unpack` with a confusing message, before the intended numeric check runs. Also the `includedirxyz` skip is evaluated only after the split/`int()` parse, so such a directory that is not numeric would error out instead of being skipped.","fix":"Check for the space (and the `includedirxyz` skip) before unpacking, e.g. `if ' ' not in e: raise SystemExit(...)` and move the `includedirxyz` continue to the top of the loop body.","locations":[{"ref":"tools/dircondenser.py:29-42","code":"   29 | def get_entries() -> T.List[T.Tuple[int, str]]:\n   30 |     entries = []\n   31 |     for e in glob('*'):\n   32 |         if not os.path.isdir(e):\n   33 |             raise SystemExit('Current directory must not contain any files.')\n   34 |         (number, rest) = e.split(' ', 1)\n   35 |         try:\n   36 |             numstr = int(number)\n   37 |         except ValueError:\n   38 |             raise SystemExit(f'Dir name {e} does not start with a number.')\n   39 |         if 'includedirxyz' in e:\n   40 |             continue\n   41 |         entries.append((numstr, rest))\n   42 |     entries.sort()","lines":14,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/dircondenser.py#L29-L42"}]},{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"In `_enable_feature`, a feature string containing a `/` is split into `depname, dep_f = f.split('/', 1)` and then `depname[-1]` is indexed to check for a trailing `?`. If a malformed manifest feature entry begins with `/` (e.g. `/foo`), `depname` is the empty string and `depname[-1]` raises `IndexError` rather than a clean Meson error. Low impact since it requires a malformed Cargo.toml, but it produces an internal traceback instead of a diagnostic.","fix":"Guard against an empty `depname` (e.g. `if depname and depname[-1] == '?':`) or validate the feature string and raise a `MesonException` with a clear message.","locations":[{"ref":"mesonbuild/cargo/interpreter.py:682-685","code":"  682 |             if '/' in f:\n  683 |                 depname, dep_f = f.split('/', 1)\n  684 |                 if depname[-1] == '?':\n  685 |                     depname = depname[:-1]","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cargo/interpreter.py#L682-L685"}]},{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"In `run_clang_format`, `original` is only assigned when `options.check and cformat_ver` and the version is `< 10`. The restore path `if options.check and not clangformat_10: fname.write_bytes(original)` executes whenever `options.check` is set and clang-format is not >=10, which includes the case where `cformat_ver` is falsy. In that case `original` was never bound and an `UnboundLocalError` is raised. It is currently unreachable because `run()` always obtains a truthy version via `get_version()` (which raises otherwise), but the local invariant is fragile.","fix":"Initialize `original = None` (or restructure so the restore branch cannot run when `original` was not read), making the check-mode restore robust regardless of how `cformat_ver` is obtained.","locations":[{"ref":"mesonbuild/scripts/clangformat.py:16-35","code":"   16 | async def run_clang_format(fname: Path, exelist: T.List[str], options: argparse.Namespace, cformat_ver: T.Optional[str]) -> int:\n   17 |     clangformat_10 = False\n   18 |     if options.check and cformat_ver:\n   19 |         if version_compare(cformat_ver, '>=10'):\n   20 |             clangformat_10 = True\n   21 |             exelist = exelist + ['--dry-run', '--Werror']\n   22 |             # The option is not documented but it exists in version 10\n   23 |             if options.color == 'always' or options.color == 'auto' and sys.stdout.isatty():\n   24 |                 exelist += ['--color=1']\n   25 |         else:\n   26 |             original = fname.read_bytes()\n   27 |     before = fname.stat().st_mtime\n   28 |     ret = await run_with_buffered_output(exelist + ['-style=file', '-i', str(fname)])\n   29 |     after = fname.stat().st_mtime\n   30 |     if before != after:\n   31 |         print('File reformatted: ', fname)\n   32 |         if options.check and not clangformat_10:\n   33 |             # Restore the original if only checking.\n   34 |             fname.write_bytes(original)\n   35 |             return 1","lines":20,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/clangformat.py#L16-L35"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`ElbrusCompiler.get_default_include_dirs` launches a raw `subprocess.Popen` and only calls `p.stderr.read()`. It never reads `p.stdout` (opened with `stdout=subprocess.PIPE`), never calls `p.wait()`/`p.communicate()`, and never closes the pipes. This leaks the two pipe file descriptors and leaves the child process unreaped (zombie) on every call; and because `stdout` is a pipe that is never drained, a compiler that writes enough to stdout could deadlock while the parent blocks on `stderr.read()`. Every other subprocess use in this module goes through `Popen_safe`.","fix":"Use `mesonlib.Popen_safe(...)` (as the sibling methods do) and read from the returned captured stderr, or at minimum call `p.communicate()` / use a `with subprocess.Popen(...) as p:` block so stdout is drained and the process is waited on and pipes closed.","locations":[{"ref":"mesonbuild/compilers/mixins/elbrus.py:63-73","code":"   63 |     @functools.lru_cache(maxsize=None)\n   64 |     def get_default_include_dirs(self) -> T.List[str]:\n   65 |         os_env = os.environ.copy()\n   66 |         os_env['LC_ALL'] = 'C'\n   67 |         p = subprocess.Popen(self.get_exelist(ccache=False) + ['-xc', '-E', '-v', '-'], env=os_env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n   68 |         stderr = p.stderr.read().decode('utf-8', errors='replace')\n   69 |         includes: T.List[str] = []\n   70 |         for line in stderr.split('\\n'):\n   71 |             if line.lstrip().startswith('--sys_include'):\n   72 |                 includes.append(re.sub(r'\\s*\\\\$', '', re.sub(r'^\\s*--sys_include\\s*', '', line)))\n   73 |         return includes","lines":11,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/mixins/elbrus.py#L63-L73"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"File handle leak in `ExternalProject._run`. When `self.verbose` is false, `output = open(logfile, 'w', encoding='utf-8')` is opened and passed to `Popen_safe(..., stdout=output)`, but it is never closed on any path. Each non-verbose external-project step (`configure`, `build`, etc.) leaks a file descriptor; a build with many external projects can exhaust the fd table. It also means the file is not deterministically flushed/closed before `mlog.ci_fold_file(logfile, ...)` reads it back on error.","fix":"Wrap the open in a `with` block (or `try/finally`) so the file is closed after `Popen_safe` returns, e.g. open `output` inside `with open(logfile, 'w', encoding='utf-8') as output:` and run `Popen_safe`/return-code handling inside that block, or add `output.close()` in a `finally`.","locations":[{"ref":"mesonbuild/modules/external_project.py:214-235","code":"  214 |     def _run(self, step: str, command: T.List[str], workdir: Path) -> None:\n  215 |         mlog.log(f'External project {self.name}:', mlog.bold(step))\n  216 |         m = 'Running command ' + str(command) + ' in directory ' + str(workdir) + '\\n'\n  217 |         logfile = Path(mlog.get_log_dir(), f'{self.name}-{step}.log')\n  218 |         output = None\n  219 |         if not self.verbose:\n  220 |             output = open(logfile, 'w', encoding='utf-8')\n  221 |             output.write(m + '\\n')\n  222 |             output.flush()\n  223 |         else:\n  224 |             mlog.log(m)\n  225 |         p, *_ = Popen_safe(command, cwd=workdir, env=self.run_env,\n  226 |                            stderr=subprocess.STDOUT,\n  227 |                            stdout=output)\n  228 |         if p.returncode != 0:\n  229 |             m = f'{step} step returned error code {p.returncode}.'\n  230 |             if not self.verbose:\n  231 |                 m += '\\nSee logs: ' + str(logfile)\n  232 |             contents = mlog.ci_fold_file(logfile, f'CI platform detected, click here for {os.path.basename(logfile)} contents.')\n  233 |             if contents:\n  234 |                 print(contents)\n  235 |             raise MesonException(m)","lines":22,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/external_project.py#L214-L235"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In `Resolver.get_data`, a temp file is created unconditionally at the top with `tempfile.NamedTemporaryFile(mode='wb', dir=self.cachedir, delete=False)`. Because `delete=False`, it is only cleaned up on the success path (the caller renames it) or by explicit `os.remove`. On several paths it is leaked as a stray empty file in the cache dir: (1) the `sftp` branch creates and returns a *second* `NamedTemporaryFile` (line 796) and returns early, never touching the outer `tmpfile`; (2) if `open_wrapdburl` raises (line 788) or `urllib.request.urlopen` raises `WrapException` (line 830), the outer `tmpfile` was already created and is never removed. With `get_data_with_backoff` retrying up to 6 times, each failed attempt leaves an orphaned temp file in `cachedir`.","fix":"Only create the outer `tmpfile` on the branch that actually uses it (the whitelisted/normal HTTP download path), or wrap the whole function in try/except that `os.remove(tmpfile.name)` on failure. For the sftp branch, do not create the outer `tmpfile` at all.","locations":[{"ref":"mesonbuild/wrap/wrap.py:782-807","code":"  782 |     def get_data(self, urlstring: str) -> T.Tuple[str, str]:\n  783 |         blocksize = 10 * 1024\n  784 |         h = hashlib.sha256()\n  785 |         tmpfile = tempfile.NamedTemporaryFile(mode='wb', dir=self.cachedir, delete=False)\n  786 |         url = urllib.parse.urlparse(urlstring)\n  787 |         if url.hostname and url.hostname.endswith(WHITELIST_SUBDOMAIN):\n  788 |             resp = open_wrapdburl(urlstring, allow_insecure=self.allow_insecure, have_opt=self.wrap_frontend)\n  789 |         elif WHITELIST_SUBDOMAIN in urlstring:\n  790 |             raise WrapException(f'{urlstring} may be a WrapDB-impersonating URL')\n  791 |         elif url.scheme == 'sftp':\n  792 |             sftp = shutil.which('sftp')\n  793 |             if sftp is None:\n  794 |                 raise WrapException('Scheme sftp is not available. Install sftp to enable it.')\n  795 |             with tempfile.TemporaryDirectory() as workdir, \\\n  796 |                     tempfile.NamedTemporaryFile(mode='wb', dir=self.cachedir, delete=False) as tmpfile:\n  797 |                 args = []\n  798 |                 # Older versions of the sftp client cannot handle URLs, hence the splitting of url below\n  799 |                 if url.port:\n  800 |                     args += ['-P', f'{url.port}']\n  801 |                 user = f'{url.username}@' if url.username else ''\n  802 |                 command = [sftp, '-o', 'KbdInteractiveAuthentication=no', *args, f'{user}{url.hostname}:{url.path[1:]}']\n  803 |                 subprocess.run(command, cwd=workdir, check=True)\n  804 |                 downloaded = os.path.join(workdir, os.path.basename(url.path))\n  805 |                 tmpfile.close()\n  806 |                 shutil.move(downloaded, tmpfile.name)\n  807 |                 return self.hash_file(tmpfile.name), tmpfile.name","lines":26,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/wrap/wrap.py#L782-L807"},{"ref":"mesonbuild/wrap/wrap.py:827-835","code":"  827 |             try:\n  828 |                 req = urllib.request.Request(urlstring, headers=headers)\n  829 |                 resp = urllib.request.urlopen(req, timeout=REQ_TIMEOUT, context=ssl_truststore())\n  830 |             except OSError as e:\n  831 |                 mlog.log(str(e))\n  832 |                 if isinstance(e, urllib.error.URLError) and isinstance(e.reason, ssl.SSLCertVerificationError) and ssl_truststore() is None:\n  833 |                     raise WrapException(f'could not get {urlstring}; is the internet available?{truststore_message}')\n  834 |                 else:\n  835 |                     raise WrapException(f'could not get {urlstring}; is the internet available?')","lines":9,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/wrap/wrap.py#L827-L835"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`create_hash` opens the archive file with `open(fname, 'rb').read()` and never closes the handle, relying on GC finalization. This leaks a file descriptor (ResourceWarning under `-W error`) for each archive hashed.","fix":"Use a context manager. Before:\n```\n    m = hashlib.sha256()\n    m.update(open(fname, 'rb').read())\n```\nAfter:\n```\n    m = hashlib.sha256()\n    with open(fname, 'rb') as f:\n        m.update(f.read())\n```","locations":[{"ref":"mesonbuild/mdist.py:65-72","code":"   65 | def create_hash(fname: str) -> None:\n   66 |     hashname = fname + '.sha256sum'\n   67 |     m = hashlib.sha256()\n   68 |     m.update(open(fname, 'rb').read())\n   69 |     with open(hashname, 'w', encoding='utf-8') as f:\n   70 |         # A space and an asterisk because that is the format defined by GNU coreutils\n   71 |         # and accepted by busybox and the Perl shasum tool.\n   72 |         f.write('{} *{}\\n'.format(m.hexdigest(), os.path.basename(fname)))","lines":8,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mdist.py#L65-L72"}]},{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `ExternalProject._run`, when not verbose, `output = open(logfile, 'w', ...)` is opened and passed as `stdout=` to `Popen_safe`, but the file object is never closed on any path. The handle is only released by garbage collection. Over a build that runs many external-project steps this leaks file descriptors.","fix":"Open the log file with a `with` statement (or explicitly `output.close()` in a `finally`) so the descriptor is released once `Popen_safe` returns.","locations":[{"ref":"mesonbuild/scripts/externalproject.py:72-93","code":"   72 |         output = None\n   73 |         if not self.verbose:\n   74 |             output = open(logfile, 'w', encoding='utf-8')\n   75 |             output.write(m + '\\n')\n   76 |             output.flush()\n   77 |         else:\n   78 |             print(m)\n   79 |         run_env = os.environ.copy()\n   80 |         if env:\n   81 |             run_env.update(env)\n   82 |         p, o, e = Popen_safe(command, stderr=subprocess.STDOUT, stdout=output,\n   83 |                              cwd=self.build_dir,\n   84 |                              env=run_env)\n   85 |         if p.returncode != 0:\n   86 |             m = f'{step} step returned error code {p.returncode}.'\n   87 |             if not self.verbose:\n   88 |                 m += '\\nSee logs: ' + str(logfile)\n   89 |             print(m)\n   90 |             contents = mlog.ci_fold_file(logfile, f'CI platform detected, click here for {os.path.basename(logfile)} contents.')\n   91 |             if contents:\n   92 |                 print(contents)\n   93 |         return p.returncode","lines":22,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/externalproject.py#L72-L93"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`node_to_runtime_value` first tests `isinstance(node, (mparser.StringNode, mparser.BooleanNode, mparser.NumberNode))` and returns `node.value`. The following `elif isinstance(node, mparser.StringNode)` block (which returns `UnknownValue()` for f-strings) is therefore unreachable dead code, because every `StringNode` is already caught by the first branch. Consequently an f-string node returns its raw template `node.value` (e.g. the literal `'@foo@'`) as the runtime value instead of `UnknownValue()`. Since an f-string's interpolated result is not statically known, introspection/rewrite consumers get an incorrect concrete string where they should see an unknown value.","fix":"Handle `StringNode` first so the f-string check runs. Before:\n```python\nif isinstance(node, (mparser.StringNode, mparser.BooleanNode, mparser.NumberNode)):\n    return node.value\nelif isinstance(node, mparser.StringNode):\n    if node.is_fstring:\n        return UnknownValue()\n    else:\n        return node.value\n```\nAfter:\n```python\nif isinstance(node, mparser.StringNode):\n    if node.is_fstring:\n        return UnknownValue()\n    return node.value\nelif isinstance(node, (mparser.BooleanNode, mparser.NumberNode)):\n    return node.value\n```","locations":[{"ref":"mesonbuild/ast/interpreter.py:548-554","code":"  548 |         if isinstance(node, (mparser.StringNode, mparser.BooleanNode, mparser.NumberNode)):\n  549 |             return node.value\n  550 |         elif isinstance(node, mparser.StringNode):\n  551 |             if node.is_fstring:\n  552 |                 return UnknownValue()\n  553 |             else:\n  554 |                 return node.value","lines":7,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/ast/interpreter.py#L548-L554"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `AstPrinter.visit_ArithmeticNode` the decision to parenthesize the right operand is `prec > prec_right or (prec == prec_right and node.operation in {'sub', 'div', 'mod'})`. But `ArithmeticNode.operation` is typed `ARITH_OPERATORS = Literal['+', '-', '*', '/', '%']` and is always stored as the symbol (confirmed: the strings `'sub'`, `'div'`, `'mod'` appear nowhere else in `mparser.py` or `ast/`). So `node.operation in {'sub', 'div', 'mod'}` is always `False`, and the special-case for non-associative operators never fires. As a result the AST printer (used by `meson rewrite` to regenerate `meson.build`) drops required parentheses: `a - (b - c)` is printed as `a - b - c`, `a / (b / c)` as `a / b / c`, and `a - (b + c)` as `a - b + c`, all of which change the expression's value.","fix":"Compare against the actual operator symbols. Before:\n```python\nself.maybe_parentheses(node, node.right, prec > prec_right or (prec == prec_right and node.operation in {'sub', 'div', 'mod'}))\n```\nAfter:\n```python\nself.maybe_parentheses(node, node.right, prec > prec_right or (prec == prec_right and node.operation in {'-', '/', '%'}))\n```","locations":[{"ref":"mesonbuild/ast/printer.py:159","code":"  159 |         self.maybe_parentheses(node, node.right, prec > prec_right or (prec == prec_right and node.operation in {'sub', 'div', 'mod'}))","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/ast/printer.py#L159"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`nonexistent_file` never increments its counter `i`, so the loop body always recomputes the exact same candidate name `prefix + '0'`. Two consequences: (1) if both `prefix` and `prefix0` exist on disk, `os.path.exists(file)` stays `True` forever and the loop hangs (infinite loop); (2) even when it terminates it can only ever produce `prefix0`, so it cannot actually find a unique non-existent name as intended - the `i = 0` / `'%s%d' % (prefix, i)` machinery is pointless. The helper is used to synthesize the `outofdate.file` sentinel used to force targets out-of-date in `gen_custom_target_vcxproj` and `add_custom_build`.","fix":"Increment `i` inside the loop:\n\nBefore:\n```python\n        i = 0\n        file = prefix\n        while os.path.exists(file):\n            file = '%s%d' % (prefix, i)\n        return file\n```\nAfter:\n```python\n        i = 0\n        file = prefix\n        while os.path.exists(file):\n            file = '%s%d' % (prefix, i)\n            i += 1\n        return file\n```","locations":[{"ref":"mesonbuild/backend/vs2010backend.py:2182-2188","code":" 2182 |     @staticmethod\n 2183 |     def nonexistent_file(prefix: str) -> str:\n 2184 |         i = 0\n 2185 |         file = prefix\n 2186 |         while os.path.exists(file):\n 2187 |             file = '%s%d' % (prefix, i)\n 2188 |         return file","lines":7,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/backend/vs2010backend.py#L2182-L2188"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `resolve_cmake_trace_targets`, when a target has `INTERFACE_LINK_OPTIONS`, its flags are appended to the shared accumulator `res.public_link_flags` and then the *entire accumulator* is appended to `res.link_flags`. Since `res.public_link_flags` accumulates across every target processed in the `while` loop, each subsequent target that has `INTERFACE_LINK_OPTIONS` re-adds all previously seen public link flags to `res.link_flags`, producing duplicated (and increasingly duplicated) linker flags. For example, target A with `[flagA]` then target B with `[flagB]` yields `link_flags == [flagA, flagA, flagB]`.","fix":"Append only the current target's flags to `link_flags`:\n```python\nif 'INTERFACE_LINK_OPTIONS' in tgt.properties:\n    new_flags = [x for x in tgt.properties['INTERFACE_LINK_OPTIONS'] if x]\n    res.public_link_flags += new_flags\n    res.link_flags += new_flags\n```","locations":[{"ref":"mesonbuild/cmake/tracetargets.py:116-118","code":"  116 |         if 'INTERFACE_LINK_OPTIONS' in tgt.properties:\n  117 |             res.public_link_flags += [x for x in tgt.properties['INTERFACE_LINK_OPTIONS'] if x]\n  118 |             res.link_flags += res.public_link_flags","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cmake/tracetargets.py#L116-L118"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`GnuDCompiler.get_colorout_args` calls `super().get_colorout_args(colortype)` but discards its return value (missing `return`), so the method always returns `[]`. The base `GnuCompiler.get_colorout_args` returns `gnu_color_args[colortype][:]` when color is supported, so GDC never actually emits colored-diagnostics flags even though `self._has_color_support` is checked and true. The color-output option is silently a no-op for the GDC D compiler.","fix":"Return the value from the super call.\nBefore:\n```python\n        if self._has_color_support:\n            super().get_colorout_args(colortype)\n        return []\n```\nAfter:\n```python\n        if self._has_color_support:\n            return super().get_colorout_args(colortype)\n        return []\n```","locations":[{"ref":"mesonbuild/compilers/d.py:601-604","code":"  601 |     def get_colorout_args(self, colortype: str) -> T.List[str]:\n  602 |         if self._has_color_support:\n  603 |             super().get_colorout_args(colortype)\n  604 |         return []","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/d.py#L601-L604"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `CompCertCompiler.compute_parameters_with_absolute_paths` the guard is `if i[:9] == '-I':`. `-I` is only 2 characters, so `i[:9]` (which returns up to 9 chars) equals `'-I'` only when the argument is the bare string `-I`. For a real include argument like `-I/some/rel/path`, `i[:9]` is `'-I/some/p'` which never equals `'-I'`, so the path is never converted to an absolute path. The slicing width `9` was copy-pasted from a sibling compiler (e.g. `ccrx` uses `-include=`, which is 9 chars). The result is that relative include dirs are left un-normalized for CompCert builds, which can break compilation when the compiler is invoked from a different working directory.","fix":"Change the width to 2 to match `-I`:\n```python\nfor idx, i in enumerate(parameter_list):\n    if i[:2] == '-I':\n        parameter_list[idx] = i[:2] + os.path.normpath(os.path.join(build_dir, i[2:]))\n```","locations":[{"ref":"mesonbuild/compilers/mixins/compcert.py:111-116","code":"  111 |     def compute_parameters_with_absolute_paths(self, parameter_list: T.List[str], build_dir: str) -> T.List[str]:\n  112 |         for idx, i in enumerate(parameter_list):\n  113 |             if i[:9] == '-I':\n  114 |                 parameter_list[idx] = i[:9] + os.path.normpath(os.path.join(build_dir, i[9:]))\n  115 | \n  116 |         return parameter_list","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/mixins/compcert.py#L111-L116"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `Xc16Compiler.compute_parameters_with_absolute_paths` the guard `if i[:9] == '-I':` is wrong for the same reason as the CompCert case: `-I` is 2 characters, so `i[:9] == '-I'` is true only for the bare string `-I`, never for an actual `-I/path` argument. `i[:9] + os.path.normpath(os.path.join(build_dir, i[9:]))` would also mangle the path even if it matched. Include directories are therefore never made absolute for XC16 cross builds.","fix":"Use a width of 2 to match `-I`:\n```python\nfor idx, i in enumerate(parameter_list):\n    if i[:2] == '-I':\n        parameter_list[idx] = i[:2] + os.path.normpath(os.path.join(build_dir, i[2:]))\n```","locations":[{"ref":"mesonbuild/compilers/mixins/microchip.py:109-114","code":"  109 |     def compute_parameters_with_absolute_paths(self, parameter_list: T.List[str], build_dir: str) -> T.List[str]:\n  110 |         for idx, i in enumerate(parameter_list):\n  111 |             if i[:9] == '-I':\n  112 |                 parameter_list[idx] = i[:9] + os.path.normpath(os.path.join(build_dir, i[9:]))\n  113 | \n  114 |         return parameter_list","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/mixins/microchip.py#L109-L114"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `CMakeDependency._detect_dep` the version is stripped of surrounding quotes/spaces, but the result of `str.strip` is discarded instead of assigned, so `self.version` keeps any quoting CMake emitted (e.g. `\"1.2.3\"`).","fix":"Before:\n```python\nself.version = vers_raw[0]\nself.version.strip('\"\\' ')\n```\nAfter:\n```python\nself.version = vers_raw[0]\nself.version = self.version.strip('\"\\' ')\n```","locations":[{"ref":"mesonbuild/dependencies/cmake.py:427-429","code":"  427 |         if len(vers_raw) > 0:\n  428 |             self.version = vers_raw[0]\n  429 |             self.version.strip('\"\\' ')","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/cmake.py#L427-L429"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `ConfigToolDependency.find_config`, when a candidate binary's version does not satisfy `versions`, `tool` is set to `None` but `best_match` is still replaced whenever that candidate's version is numerically greater than the current best. A later, higher-versioned tool that fails the requirement (e.g. requirement `< 2.0` or `== 1.5`, PATH has both 1.5 and 2.5) overwrites a valid lower-versioned match with `(None, higher_version)`, so the dependency is wrongly reported as not found even though a satisfying tool exists.","fix":"Only consider a candidate for `best_match` when its `tool` is not `None` (i.e. it actually satisfies the version requirement), or track the best *satisfying* tool separately from the highest version seen.","locations":[{"ref":"mesonbuild/dependencies/configtool.py:109-122","code":"  109 |             if versions:\n  110 |                 is_found = version_compare_many(version, versions)[0]\n  111 |                 # This allows returning a found version without a config tool,\n  112 |                 # which is useful to inform the user that you found version x,\n  113 |                 # but y was required.\n  114 |                 if not is_found:\n  115 |                     tool = None\n  116 |             if best_match[1]:\n  117 |                 if version_compare(version, '> {}'.format(best_match[1])):\n  118 |                     best_match = (tool, version)\n  119 |             else:\n  120 |                 best_match = (tool, version)\n  121 | \n  122 |         return best_match","lines":14,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/configtool.py#L109-L122"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `CudaDependency.get_link_args`, `link_args = self.lib_modules[lib]` binds `link_args` to the stored list, and for `cudart_static` on Linux `link_args += ['-lrt', '-lpthread', '-ldl']` mutates that stored list in place (`list.__iadd__`). `get_link_args` can be called multiple times during backend generation, so each call appends another copy of `-lrt -lpthread -ldl` to `self.lib_modules['cudart_static']`, producing accumulating duplicate link flags.","fix":"Do not mutate the cached list; build a fresh one, e.g. change `link_args += ['-lrt', '-lpthread', '-ldl']` to `link_args = link_args + ['-lrt', '-lpthread', '-ldl']` (or copy `link_args` at the top of the loop before extending).","locations":[{"ref":"mesonbuild/dependencies/cuda.py:328-340","code":"  328 |         for lib in self.requested_modules:\n  329 |             link_args = self.lib_modules[lib]\n  330 |             if language == 'cuda' and lib in REWRITE_MODULES:\n  331 |                 link_args = REWRITE_MODULES[lib]\n  332 |                 mlog.debug(f'Rewriting module \\'{lib}\\' to \\'{link_args}\\'')\n  333 |             elif lib == 'cudart_static':\n  334 |                 machine = self.env.machines[self.for_machine]\n  335 |                 if machine.is_linux():\n  336 |                     # extracted by running\n  337 |                     #   nvcc -v foo.o\n  338 |                     link_args += ['-lrt', '-lpthread', '-ldl']\n  339 | \n  340 |             args += link_args","lines":13,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/cuda.py#L328-L340"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `DubDependency.__init__`, `self.link_args = self.raw_link_args = []` makes both attributes refer to the *same* list object. Every subsequent `self.link_args.append(...)` (target files, source `.lib`/`.a`, `lflags`, winlibs, `-l` fallbacks) therefore also lands in `raw_link_args`, and in the pkg-config loop the code appends `get_link_args()` to `self.link_args` and `get_link_args(raw=True)` to `self.raw_link_args`, so those pkg-config libs are added twice to the shared list. `raw_link_args` (consumed e.g. by the gnome module) ends up polluted with resolved paths and duplicates instead of the intended raw `-L/-l` form.","fix":"Initialize them as independent lists: `self.link_args = []` and `self.raw_link_args = []`, and populate `raw_link_args` explicitly with the intended raw arguments.","locations":[{"ref":"mesonbuild/dependencies/dub.py:142-143","code":"  142 |         self.compile_args = []\n  143 |         self.link_args = self.raw_link_args = []","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/dub.py#L142-L143"},{"ref":"mesonbuild/dependencies/dub.py:306-316","code":"  306 |         for lib in bs['libs']:\n  307 |             if os.name != 'nt':\n  308 |                 # trying to add system libraries by pkg-config\n  309 |                 pkgdep = PkgConfigDependency(lib, environment, {'required': True, 'silent': True, 'native': self.for_machine})\n  310 |                 if pkgdep.is_found:\n  311 |                     for arg in pkgdep.get_compile_args():\n  312 |                         self.compile_args.append(arg)\n  313 |                     for arg in pkgdep.get_link_args():\n  314 |                         self.link_args.append(arg)\n  315 |                     for arg in pkgdep.get_link_args(raw=True):\n  316 |                         self.raw_link_args.append(arg)","lines":11,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/dub.py#L306-L316"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"For the C++ language, `IMPIDependency` overwrites `self.link_args` with only the `impicxx` library, discarding the base `impi` library set two lines earlier. Linking a C++ MPI program then loses the core Intel MPI C library and its symbols.","fix":"Before:\n```python\nself.link_args = ['-l' + os.path.join(libdir, 'impicxx')]\n```\nAfter:\n```python\nself.link_args.append('-l' + os.path.join(libdir, 'impicxx'))\n```","locations":[{"ref":"mesonbuild/dependencies/mpi.py:303-309","code":"  303 |         self.link_args = ['-l' + os.path.join(libdir, 'impi')]\n  304 |         if self.language == 'cpp':\n  305 |             # Some installations do not have the MPI C++ bindings library\n  306 |             if not os.path.isfile(os.path.join(libdir, 'impicxx.lib')):\n  307 |                 self.is_found = False\n  308 |                 return\n  309 |             self.link_args = ['-l' + os.path.join(libdir, 'impicxx')]","lines":7,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/mpi.py#L303-L309"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `_qt_get_private_includes()` the \"latest version\" fallback loop assigns the\nbare directory name to `private_dir` instead of the full path:\n```python\nprivate_dir = os.path.join(mod_inc_dir, mod_version)\nif os.path.isdir(mod_inc_dir) and not os.path.exists(private_dir):\n    dirs = [filename for filename in os.listdir(mod_inc_dir)\n            if os.path.isdir(os.path.join(mod_inc_dir, filename))]\n    for dirname in sorted(dirs, reverse=True):\n        if len(dirname.split('.')) == 3:\n            private_dir = dirname      # <-- loses mod_inc_dir prefix\n            break\nreturn [private_dir, Path(private_dir, f'Qt{module}').as_posix()]\n```\n`os.listdir()` returns bare names, so after the fallback `private_dir` becomes\ne.g. `5.10.1` rather than `/usr/include/qt5/QtCore/5.10.1`. The returned\n`-I` include paths are then relative/broken, so private headers are not found\nwhenever the exact `QT_INSTALL_HEADERS/module/QtVersion` directory does not\nexist and the fallback path is taken.","fix":"Join with the parent directory:\n```python\nfor dirname in sorted(dirs, reverse=True):\n    if len(dirname.split('.')) == 3:\n        private_dir = os.path.join(mod_inc_dir, dirname)\n        break\n```","locations":[{"ref":"mesonbuild/dependencies/qt.py:45-55","code":"   45 |     private_dir = os.path.join(mod_inc_dir, mod_version)\n   46 |     # fallback, let's try to find a directory with the latest version\n   47 |     if os.path.isdir(mod_inc_dir) and not os.path.exists(private_dir):\n   48 |         dirs = [filename for filename in os.listdir(mod_inc_dir)\n   49 |                 if os.path.isdir(os.path.join(mod_inc_dir, filename))]\n   50 | \n   51 |         for dirname in sorted(dirs, reverse=True):\n   52 |             if len(dirname.split('.')) == 3:\n   53 |                 private_dir = dirname\n   54 |                 break\n   55 |     return [private_dir, Path(private_dir, f'Qt{module}').as_posix()]","lines":11,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/qt.py#L45-L55"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `MKLPkgConfigDependency._set_libs()` the gfortran ABI fixup rebuilds the\nlink argument with a spurious leading `/`:\n```python\ndirname, basename = os.path.split(a)\nif 'mkl_intel_lp64' in basename:\n    basename = basename.replace('intel', 'gf')\n    self.link_args[i] = '/' + os.path.join(dirname, basename)\n```\nIf `a` is an absolute path like `/opt/intel/.../libmkl_intel_lp64.a`, the result\nbecomes `//opt/intel/.../libmkl_gf_lp64.a` (doubled leading slash). Worse, if the\nMKL pkg-config emits a plain `-lmkl_intel_lp64` flag, `os.path.split` yields\n`dirname=''`, `basename='-lmkl_intel_lp64'`, and the result is the corrupt token\n`/-lmkl_gf_lp64`, which is no longer a valid `-l` flag and will break linking.\nThe `'/' +` prefix is spurious.","fix":"Drop the leading-slash concatenation:\n```python\nself.link_args[i] = os.path.join(dirname, basename)\n```","locations":[{"ref":"mesonbuild/dependencies/scalapack.py:109-115","code":"  109 |         if self.clib_compiler.id == 'gcc':\n  110 |             for i, a in enumerate(self.link_args):\n  111 |                 # only replace in filename, not in directory names\n  112 |                 dirname, basename = os.path.split(a)\n  113 |                 if 'mkl_intel_lp64' in basename:\n  114 |                     basename = basename.replace('intel', 'gf')\n  115 |                     self.link_args[i] = '/' + os.path.join(dirname, basename)","lines":7,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/scalapack.py#L109-L115"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`_print_summary` iterates over `self.summary` (keyed by subproject name, shared across all sub-interpreters) and does `self.subprojects.host[subp_name].found()`. In a cross build a subproject configured only for the build machine (`subproject('foo', native: true)`) registers itself in `self.subprojects.build['foo']` but never in `self.subprojects.host`. If that subproject calls `summary(...)`, an entry `self.summary['foo']` is created, and the later `self.subprojects.host['foo']` lookup raises `KeyError`, aborting the whole configure at the very end. The lookup does not account for build-machine-only subprojects.","fix":"Look the subproject up defensively across machines, e.g. check both `self.subprojects.host` and `self.subprojects.build` (or use `.get(subp_name)` and skip/`found()`-default when absent) before calling `.found()`.","locations":[{"ref":"mesonbuild/interpreter/interpreter.py:1525-1530","code":" 1525 |         main_summary = self.summary.pop('', None)\n 1526 |         for subp_name, summary in sorted(self.summary.items()):\n 1527 |             if self.subprojects.host[subp_name].found():\n 1528 |                 summary.dump()\n 1529 |         if main_summary:\n 1530 |             main_summary.dump()","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreter/interpreter.py#L1525-L1530"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `func_custom_target`, the deprecated `build_always` kwarg is remapped to `build_by_default`/`build_always_stale`. The refactor that introduced the local variables `build_by_default` and `build_always_stale` left the final assignment reading from the raw dict: `build_always_stale = kwargs['build_by_defa
