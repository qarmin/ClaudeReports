ult']`. In the original code the previous line mutated `kwargs['build_by_default']` in place, so the stale flag picked up the just-computed value. Now the local `build_by_default` is updated but `kwargs['build_by_default']` is still whatever the user passed (typically `None`). Consequently `custom_target(..., build_always: true)` no longer sets `build_always_stale` (it falls through to `False` at the `if build_always_stale is None` guard), so the target is no longer rebuilt every time as documented. It should reference the local `build_by_default` variable.","fix":"Use the local variable instead of the raw kwarg.\nBefore:\n```python\n            build_always_stale = kwargs['build_by_default']\n```\nAfter:\n```python\n            build_always_stale = build_by_default\n```","locations":[{"ref":"mesonbuild/interpreter/interpreter.py:2214-2217","code":" 2214 |         elif kwargs['build_always'] is not None:\n 2215 |             if build_by_default is None:\n 2216 |                 build_by_default = kwargs['build_always']\n 2217 |             build_always_stale = kwargs['build_by_default']","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreter/interpreter.py#L2214-L2217"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `_env_validator`, the `only_dict_str` branch checks for non-string dictionary values with `any(i for i in listify(dv) if not isinstance(i, str))`. The generator filters to items that are *not* strings but then `any()` tests the *truthiness* of those items, not their presence. A non-string but falsy value (e.g. `0`, `False`, `0.0`, `''`, `[]`, `None`) is filtered in yet evaluates falsy, so `any()` returns `False` and the invalid value passes validation. For example `env : {'FOO': 0}` (via `ENV_KW`, which defaults to `only_dict_str=True`) is wrongly accepted and later fed to `EnvironmentVariables`, causing confusing downstream errors. The `elif` branch just below (line 224) already uses the correct pattern `any(not isinstance(i, str) for i in dv)`.","fix":"Test the predicate, not the value:\nbefore: `if any(i for i in listify(dv) if not isinstance(i, str)):`\nafter: `if any(not isinstance(i, str) for i in listify(dv)):`","locations":[{"ref":"mesonbuild/interpreter/type_checking.py:220-222","code":"  220 |             if only_dict_str:\n  221 |                 if any(i for i in listify(dv) if not isinstance(i, str)):\n  222 |                     return f\"Dictionary element {k} must be a string or list of strings not {dv!r}\"","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreter/type_checking.py#L220-L222"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `qt.compile_translations`, when a `qresource` is supplied, the `.ts` file name is derived from each `.qm` node with `c.rstrip('.qm') + '.ts'`. `str.rstrip` removes any trailing characters that are in the set `{'.', 'q', 'm'}`, not the literal suffix `.qm`. For a resource entry whose base name ends in one of those characters (e.g. `program.qm` -> `progra`, `myqm.qm` -> `my`), the wrong source file name is produced and the translation build breaks or picks up the wrong file.","fix":"Strip the exact suffix instead of a character set. Before: `ts_files.append(c.rstrip('.qm') + '.ts')` After: `ts_files.append(c[:-len('.qm')] + '.ts')` (or `c.removesuffix('.qm') + '.ts'`).","locations":[{"ref":"mesonbuild/modules/_qt.py:726-729","code":"  726 |                 if c.endswith('.qm'):\n  727 |                     ts_files.append(c.rstrip('.qm') + '.ts')\n  728 |                 else:\n  729 |                     raise MesonException(f'qt.compile_translations: qresource can only contain qm files, found {c}')","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/_qt.py#L726-L729"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Inverted condition in `_check_generated_pc_deprecation`. The guard `if obj.get_id() in self.metadata: return` returns early exactly when the id *is* present. Every caller (`_process_reqs` and `_process_libs`) only invokes this method after already checking `obj.get_id() in self.metadata`, so the function always returns immediately and the `mlog.deprecation(...)` warning is **never** emitted. The following line `data = self.metadata[obj.get_id()]` is only reachable when the id is *absent*, in which case it would raise `KeyError`. The condition must be `not in`.","fix":"Change the guard so it returns only when the id is missing:\n```python\n# before\nif obj.get_id() in self.metadata:\n    return\n# after\nif obj.get_id() not in self.metadata:\n    return\n```","locations":[{"ref":"mesonbuild/modules/pkgconfig.py:127-142","code":"  127 |     def _check_generated_pc_deprecation(self, obj: build.LibTypes) -> None:\n  128 |         if obj.get_id() in self.metadata:\n  129 |             return\n  130 |         data = self.metadata[obj.get_id()]\n  131 |         if data.warned:\n  132 |             return\n  133 |         mlog.deprecation('Library', mlog.bold(obj.name), 'was passed to the '\n  134 |                          '\"libraries\" keyword argument of a previous call '\n  135 |                          'to generate() method instead of first positional '\n  136 |                          'argument.', 'Adding', mlog.bold(data.display_name),\n  137 |                          'to \"Requires\" field, but this is a deprecated '\n  138 |                          'behaviour that will change in version 2.0 '\n  139 |                          'of Meson. Please report the issue if this '\n  140 |                          'warning cannot be avoided in your case.',\n  141 |                          location=data.location)\n  142 |         data.warned = True","lines":16,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/pkgconfig.py#L127-L142"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The builtin core option `namingscheme` (defined in `BUILTIN_CORE_OPTIONS`) is missing from the `_BUILTIN_NAMES` set. Every other core/dir option name appears in `_BUILTIN_NAMES`, and the comment above `BUILTIN_DIR_OPTIONS` explicitly says to keep this set in sync. As a result `is_builtin_option(OptionKey('namingscheme'))` and `is_reserved_name(OptionKey('namingscheme'))` both return `False`, so `namingscheme` is not treated as a reserved builtin name (e.g. a project `meson.options` could declare an `option('namingscheme', ...)` without the reserved-name error that all other builtins trigger).","fix":"Add `'namingscheme',` to the `_BUILTIN_NAMES` set, e.g. next to the other core names:\nBefore:\n```python\n    'layout',\n    'optimization',\n```\nAfter:\n```python\n    'layout',\n    'namingscheme',\n    'optimization',\n```","locations":[{"ref":"mesonbuild/options.py:64-103","code":"   64 | _BUILTIN_NAMES = {\n   65 |     'prefix',\n   66 |     'bindir',\n   67 |     'datadir',\n   68 |     'includedir',\n   69 |     'infodir',\n   70 |     'libdir',\n   71 |     'licensedir',\n   72 |     'libexecdir',\n   73 |     'localedir',\n   74 |     'localstatedir',\n   75 |     'mandir',\n   76 |     'sbindir',\n   77 |     'sharedstatedir',\n   78 |     'sysconfdir',\n   79 |     'auto_features',\n   80 |     'backend',\n   81 |     'buildtype',\n   82 |     'debug',\n   83 |     'default_library',\n   84 |     'default_both_libraries',\n   85 |     'errorlogs',\n   86 |     'genvslite',\n   87 |     'install_umask',\n   88 |     'layout',\n   89 |     'optimization',\n   90 |     'prefer_static',\n   91 |     'stdsplit',\n   92 |     'strip',\n   93 |     'unity',\n   94 |     'unity_size',\n   95 |     'warning_level',\n   96 |     'werror',\n   97 |     'wrap_mode',\n   98 |     'force_fallback_for',\n   99 |     'pkg_config_path',\n  100 |     'cmake_prefix_path',\n  101 |     'vsenv',\n  102 |     'os2_emxomf',\n  103 | }","lines":40,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/options.py#L64-L103"},{"ref":"mesonbuild/options.py:694","code":"  694 |         UserComboOption('namingscheme', 'How target file names are formed', 'classic', choices=['platform', 'classic']),","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/options.py#L694"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `process_target` for the `target_add` operation, operator precedence makes the target id wrong for every non-executable target. `target_id = id_base + '_exe' if cmd['target_type'] == 'executable' else '_lib'` parses as `(id_base + '_exe') if ... else '_lib'`, so when the target type is a library the assignment variable name becomes the bare string `'_lib'` (losing the `id_base` prefix) instead of `f'{id_base}_lib'`. Two libraries added this way would both be assigned to a variable literally named `_lib`, colliding.","fix":"Wrap the conditional in parentheses:\nBefore:\n```python\ntarget_id = id_base + '_exe' if cmd['target_type'] == 'executable' else '_lib'\n```\nAfter:\n```python\ntarget_id = id_base + ('_exe' if cmd['target_type'] == 'executable' else '_lib')\n```","locations":[{"ref":"mesonbuild/rewriter.py:907-908","code":"  907 |             id_base = re.sub(r'[- ]', '_', cmd['target'])\n  908 |             target_id = id_base + '_exe' if cmd['target_type'] == 'executable' else '_lib'","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/rewriter.py#L907-L908"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `generate_xc_build_configuration` the custom-targets loop references `buildtype` without introducing it, relying on the value leaked from the earlier `for buildtype in self.buildtypes` loop used for the test target (line 1621). This only works because `self.buildtypes` always contains exactly one element; if it ever held more than one buildtype, every custom target would silently get only the last buildtype's `XCBuildConfiguration` (and would be missing entries for the others), unlike native targets which iterate their own buildtypes. The code is fragile and inconsistent with the surrounding blocks.","fix":"Wrap the custom-target configuration creation in its own `for buildtype in self.buildtypes:` loop, mirroring the native-target and other blocks, instead of depending on a leaked loop variable.","locations":[{"ref":"mesonbuild/backend/xcodebackend.py:1636-1645","code":" 1636 |         for target_name, target in self.custom_targets.items():\n 1637 |             bt_dict = PbxDict()\n 1638 |             objects_dict.add_item(self.buildconfmap[target_name][buildtype], bt_dict, buildtype)\n 1639 |             bt_dict.add_item('isa', 'XCBuildConfiguration')\n 1640 |             settings_dict = PbxDict()\n 1641 |             bt_dict.add_item('buildSettings', settings_dict)\n 1642 |             settings_dict.add_item('ARCHS', self.arch)\n 1643 |             settings_dict.add_item('ONLY_ACTIVE_ARCH', 'YES')\n 1644 |             settings_dict.add_item('SDKROOT', 'macosx')\n 1645 |             bt_dict.add_item('name', buildtype)","lines":10,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/backend/xcodebackend.py#L1636-L1645"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"When `_parse` encounters an empty `all()` or `any()` it detects the immediate `RPAREN` via lookahead (`n_stream[0] == TokenType.RPAREN`) and returns `type_(args)` with empty `args`, but it never consumes that `RPAREN` token from the stream. At top level this is harmless because `parse()` ignores trailing tokens, but when an empty `all()`/`any()` is nested (e.g. `cfg(all(any(), unix))`), the leftover `RPAREN` is consumed by the parent's loop as its own closing paren, terminating the parent early and silently dropping the remaining arguments (here `unix`), yielding a wrong evaluation of the cfg expression.","fix":"Consume the closing paren in the empty case before returning, e.g. call `next(ast)` to discard the `RPAREN` token when `n_stream[0] is TokenType.RPAREN` (and use `is` for enum comparison to match the rest of the module) before `return type_(args)`.","locations":[{"ref":"mesonbuild/cargo/cfg.py:155-168","code":"  155 |     elif token in {TokenType.ANY, TokenType.ALL}:\n  156 |         type_ = All if token is TokenType.ALL else Any\n  157 |         args: T.List[IR] = []\n  158 |         (token, value), n_stream = next(ast)\n  159 |         assert token is TokenType.LPAREN\n  160 |         if n_stream and n_stream[0] == TokenType.RPAREN:\n  161 |             return type_(args)\n  162 |         while True:\n  163 |             args.append(_parse(ast))\n  164 |             (token, value), _ = next(ast)\n  165 |             if token is TokenType.RPAREN:\n  166 |                 break\n  167 |             assert token is TokenType.COMMA\n  168 |         return type_(args)","lines":14,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cargo/cfg.py#L155-L168"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The exception raised when a `dep.path` resolves into the subprojects dir but is not a valid subproject path uses a plain string with `{self.subprojects_dir}` interpolation syntax but no `f` prefix, so the literal text `{self.subprojects_dir}` is shown to the user instead of the actual directory. This defeats the diagnostic purpose of the message.","fix":"Add the `f` prefix:\n\nBefore:\n```python\nraise MesonException('found \"{self.subprojects_dir}\" in path but it is not a valid subproject path')\n```\nAfter:\n```python\nraise MesonException(f'found \"{self.subprojects_dir}\" in path but it is not a valid subproject path')\n```","locations":[{"ref":"mesonbuild/cargo/interpreter.py:613","code":"  613 |                     raise MesonException('found \"{self.subprojects_dir}\" in path but it is not a valid subproject path')","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cargo/interpreter.py#L613"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ConverterTarget._all_lang_stds` always queries the option store with `machine=MachineChoice.BUILD`, ignoring `self.for_machine`. When the converted CMake target is for the HOST machine in a cross build, this reads the build-machine's `<lang>_std` choices (or raises `KeyError` and returns `[]`). In `postprocess`, an empty/incorrect supported list causes valid `-std=`/`std:` flags detected from CMake to be dropped and a spurious 'Unknown <lang>_std' warning to be emitted for host targets.","fix":"Use the target's machine: `OptionKey(f'{lang}_std', machine=self.for_machine)`.","locations":[{"ref":"mesonbuild/cmake/interpreter.py:560-567","code":"  560 |     @lru_cache(maxsize=None)\n  561 |     def _all_lang_stds(self, lang: str) -> 'ImmutableListProtocol[str]':\n  562 |         try:\n  563 |             opt = self.env.coredata.optstore.get_value_object(OptionKey(f'{lang}_std', machine=MachineChoice.BUILD))\n  564 |             assert isinstance(opt, (options.UserStdOption, options.UserComboOption)), 'for mypy'\n  565 |             return opt.choices or []\n  566 |         except KeyError:\n  567 |             return []","lines":8,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cmake/interpreter.py#L560-L567"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"This `raise` uses a plain string, not an f-string, so `{self.platform!r}` is\nemitted literally instead of being interpolated:\n```python\nraise DependencyException('Unknown Windows Python platform {self.platform!r}')\n```\nCompare the correct f-string in `get_windows_python_arch()` a few lines above\n(the MinGW branch). Users hitting an unknown platform get an unhelpful message\ncontaining the raw placeholder text.","fix":"Add the `f` prefix:\n```python\nraise DependencyException(f'Unknown Windows Python platform {self.platform!r}')\n```","locations":[{"ref":"mesonbuild/dependencies/python.py:351-351","code":"  351 |         raise DependencyException('Unknown Windows Python platform {self.platform!r}')","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/python.py#L351"}]},{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`QmakeQtDependency.__init__` shallow-copies `kwargs` and then mutates the\nshared `version` list in place:\n```python\nkwargs = kwargs.copy()          # shallow: 'version' list is shared\n_vers = kwargs.get('version', [])\n_vers.extend([f'>= {self.qtver}', f'< {int(self.qtver) + 1}'])\nkwargs['version'] = _vers\n```\nBecause `dict.copy()` is shallow, `_vers` is the *same list object* stored in\nthe caller's kwargs (the `nwargs` dict shared by all candidates produced by\n`DependencyFactory.__call__`). `.extend()` therefore mutates the caller's\n`version` list, leaking the qmake-only version constraints (`>= 5`, `< 6`) into\nthe original kwargs and any other dependency candidate that shares that list.\nThe intent of `kwargs.copy()` was clearly to avoid exactly this.","fix":"Copy the list before extending it:\n```python\nkwargs = kwargs.copy()\n_vers = list(kwargs.get('version', []))\n_vers.extend([f'>= {self.qtver}', f'< {int(self.qtver) + 1}'])\nkwargs['version'] = _vers\n```","locations":[{"ref":"mesonbuild/dependencies/qt.py:279-282","code":"  279 |         kwargs = kwargs.copy()\n  280 |         _vers = kwargs.get('version', [])\n  281 |         _vers.extend([f'>= {self.qtver}', f'< {int(self.qtver) + 1}'])\n  282 |         kwargs['version'] = _vers","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/qt.py#L279-L282"}]},{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`DepFile.get_all_dependencies()` guards the initial visited-set with a\ntruthiness test rather than an identity test:\n```python\ndef get_all_dependencies(self, name, visited=None):\n    deps = set()\n    if not visited:\n        visited = set()\n```\nIf a caller explicitly passes an empty set (a legitimate \"nothing visited yet\"\nvalue), `not visited` is `True` and the passed-in set is silently discarded and\nreplaced by a fresh one, so the caller's set is never populated. It should test\n`visited is None`.","fix":"Use an identity check:\n```python\nif visited is None:\n    visited = set()\n```","locations":[{"ref":"mesonbuild/depfile.py:68-71","code":"   68 |     def get_all_dependencies(self, name: str, visited: T.Optional[T.Set[str]] = None) -> T.List[str]:\n   69 |         deps: T.Set[str] = set()\n   70 |         if not visited:\n   71 |             visited = set()","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/depfile.py#L68-L71"}]},{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `_install_mode_validator`, the type validation of the second and third `install_mode` components (`mode[1]`, `mode[2]`) is nested inside `if isinstance(perms, str):`. Since `True` is already rejected earlier (`if True in mode`), the first component can legitimately be `False`; in that case the `isinstance(perms, str)` block is skipped and `mode[1]`/`mode[2]` are never type-checked. An invalid value there (e.g. a list or float) then bypasses validation and is silently coerced to `None` by `_install_mode_convertor` (`m if isinstance(m, (str, int)) else None`), so the user's intent is dropped without an error.","fix":"Move the `len(mode) >= 2`/`len(mode) >= 3` type checks for `mode[1]` and `mode[2]` out of the `if isinstance(perms, str):` block so they run regardless of whether the first component is a string or `False`.","locations":[{"ref":"mesonbuild/interpreter/type_checking.py:80-101","code":"   80 |     if isinstance(perms, str):\n   81 |         if not len(perms) == 9:\n   82 |             return ('permissions string must be exactly 9 characters in the form rwxr-xr-x,'\n   83 |                     f' got {len(perms)}')\n   84 |         for i in [0, 3, 6]:\n   85 |             if perms[i] not in {'-', 'r'}:\n   86 |                 return f'permissions character {i+1} must be \"-\" or \"r\", not {perms[i]}'\n   87 |         for i in [1, 4, 7]:\n   88 |             if perms[i] not in {'-', 'w'}:\n   89 |                 return f'permissions character {i+1} must be \"-\" or \"w\", not {perms[i]}'\n   90 |         for i in [2, 5]:\n   91 |             if perms[i] not in {'-', 'x', 's', 'S'}:\n   92 |                 return f'permissions character {i+1} must be \"-\", \"s\", \"S\", or \"x\", not {perms[i]}'\n   93 |         if perms[8] not in {'-', 'x', 't', 'T'}:\n   94 |             return f'permission character 9 must be \"-\", \"t\", \"T\", or \"x\", not {perms[8]}'\n   95 | \n   96 |         if len(mode) >= 2 and not isinstance(mode[1], (int, str, bool)):\n   97 |             return 'second component can only be a string, number, or False'\n   98 |         if len(mode) >= 3 and not isinstance(mode[2], (int, str, bool)):\n   99 |             return 'third component can only be a string, number, or False'\n  100 | \n  101 |     return None","lines":22,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreter/type_checking.py#L80-L101"}]},{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `typed_pos_args`, when a `DefaultObject` (`default()`) is passed in a disallowed position, the code chooses the error wording using `last_pos = num_args` and the test `if i >= last_pos:` (where `i` is the 1-based argument index). This compares against the number of arguments actually supplied rather than the number of required positional types (`num_types`). When only the required arguments are provided (i.e. `num_args <= num_types`), the last required argument is misreported: e.g. `@typed_pos_args('f', str)` called as `f(default())` produces the message `default() objects are not allowed for optional positional arguments` even though that position is required. The boundary should be based on `num_types`.","fix":"Determine the category from the required-type count, e.g. replace `last_pos = num_args` usage with a check `if i > num_types:` (optional/variadic) versus `else:` (required), so the wording matches the actual argument role.","locations":[{"ref":"mesonbuild/interpreterbase/decorators.py:220-253","code":"  220 |             last_pos = num_args\n  221 | \n  222 |             if varargs:\n  223 |                 min_args = num_types + min_varargs\n  224 |                 max_args = num_types + max_varargs\n  225 |                 if max_varargs == 0 and num_args < min_args:\n  226 |                     raise InvalidArguments(f'{name} takes at least {min_args} arguments, but got {num_args}.')\n  227 |                 elif max_varargs != 0 and (num_args < min_args or num_args > max_args):\n  228 |                     raise InvalidArguments(f'{name} takes between {min_args} and {max_args} arguments, but got {num_args}.')\n  229 |             elif optargs:\n  230 |                 if num_args < num_types:\n  231 |                     raise InvalidArguments(f'{name} takes at least {num_types} arguments, but got {num_args}.')\n  232 |                 elif num_args > num_types + len(optargs):\n  233 |                     raise InvalidArguments(f'{name} takes at most {num_types + len(optargs)} arguments, but got {num_args}.')\n  234 |                 # Add the number of positional arguments required\n  235 |                 if num_args > num_types:\n  236 |                     diff = num_args - num_types\n  237 |                     a_types = tuple(list(types) + list(optargs[:diff]))\n  238 |             elif num_args != num_types:\n  239 |                 raise InvalidArguments(f'{name} takes exactly {num_types} arguments, but got {num_args}.')\n  240 | \n  241 |             for i, (arg, type_) in enumerate(itertools.zip_longest(args, a_types, fillvalue=varargs), start=1):\n  242 |                 if not isinstance(arg, type_):\n  243 |                     # if DefaultObject is an explicit allowed allowed type allow\n  244 |                     # it through.\n  245 |                     if isinstance(arg, DefaultObject):\n  246 |                         if i >= last_pos:\n  247 |                             if varargs:\n  248 |                                 msg = 'not allowed for variadic arguments'\n  249 |                             else:\n  250 |                                 msg = 'not allowed for optional positional arguments'\n  251 |                         else:\n  252 |                             msg = 'not allowed for required positional arguments'\n  253 |                         raise InvalidArguments(f'default() objects are {msg}')","lines":34,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreterbase/decorators.py#L220-L253"}]},{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`determine_archives_to_generate` checks `if len(i) == 0` only after the loop, so it inspects the last split element rather than detecting an empty format list, and the check is unreachable in practice: an empty `--formats` value splits to `['']`, and the empty string fails the `i not in archive_choices` test inside the loop first, causing `sys.exit(f'Value \"\" not one of permitted values ...')`. The intended \"No archive types specified.\" branch is dead code and the error message for an empty value is confusing.","fix":"Detect an empty/whitespace formats string up front, e.g. `formats = [f for f in options.formats.split(',') if f]` and `if not formats: sys.exit('No archive types specified.')`, then validate each entry; remove the post-loop `if len(i) == 0` check.","locations":[{"ref":"mesonbuild/mdist.py:370-378","code":"  370 | def determine_archives_to_generate(options: argparse.Namespace) -> T.List[str]:\n  371 |     result = []\n  372 |     for i in options.formats.split(','):\n  373 |         if i not in archive_choices:\n  374 |             sys.exit(f'Value \"{i}\" not one of permitted values {archive_choices}.')\n  375 |         result.append(i)\n  376 |     if len(i) == 0:\n  377 |         sys.exit('No archive types specified.')\n  378 |     return result","lines":9,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mdist.py#L370-L378"}]},{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The sample-project name validation uses `re.match('[a-zA-Z_][a-zA-Z0-9]*', options.name)`. `re.match` anchors only at the start, so any name beginning with a letter/underscore passes regardless of later invalid characters (e.g. `foo bar`, `foo-bar` all pass because the prefix `foo` matches). The second character class also omits `_`, which is inconsistent with the first. The validation is effectively `starts with a letter/underscore`, far weaker than intended.","fix":"Anchor the full string and allow underscores. Before: `if not re.match('[a-zA-Z_][a-zA-Z0-9]*', options.name) and sample:` After: `if not re.match(r'[a-zA-Z_][a-zA-Z0-9_]*$', options.name) and sample:`","locations":[{"ref":"mesonbuild/minit.py:82-86","code":"   82 |     if not options.name:\n   83 |         options.name = Path().resolve().stem\n   84 |         if not re.match('[a-zA-Z_][a-zA-Z0-9]*', options.name) and sample:\n   85 |             raise SystemExit(f'Name of current directory \"{options.name}\" is not usable as a sample project name.\\n'\n   86 |                              'Specify a project name with --name.')","lines":5,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/minit.py#L82-L86"}]},{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`process_dependencies` returns `[f.strip('-I') for f in cflags]`. `str.strip('-I')` removes *any* leading/trailing characters in the set `{'-', 'I'}`, not the prefix `-I`. An include path such as `-IInclude` becomes `nclude`, and non-include compile args gathered from `dep.get_compile_args()` (e.g. `-DFOO`) are mangled to `DFOO`. The intent is to drop the `-I` prefix from include directories only.","fix":"Strip only the prefix, e.g. `return [f[2:] if f.startswith('-I') else f for f in cflags]` (or `f.removeprefix('-I')`), and consider filtering to only `-I` flags before stripping.","locations":[{"ref":"mesonbuild/modules/hotdoc.py:180-209","code":"  180 |     def process_dependencies(self, deps: T.Sequence[TargetDepends | Dependency | File | build.ExtractedObjects]) -> T.List[str]:\n  181 |         # build.ExtractedObjects shouldn't actually\n  182 |         # happen here, but we get them from Dependency.\n  183 |         cflags = set()\n  184 |         for dep in mesonlib.listify(ensure_list(deps)):\n  185 |             if isinstance(dep, InternalDependency):\n  186 |                 inc_args = self.state.get_include_args(dep.include_directories)\n  187 |                 cflags.update([self.replace_dirs_in_string(x)\n  188 |                                for x in inc_args])\n  189 |                 cflags.update(self.process_dependencies(dep.libraries))\n  190 |                 cflags.update(self.process_dependencies(dep.sources))\n  191 |                 cflags.update(self.process_dependencies(dep.ext_deps))\n  192 |             elif isinstance(dep, Dependency):\n  193 |                 cflags.update(dep.get_compile_args())\n  194 |             elif isinstance(dep, (build.StaticLibrary, build.SharedLibrary)):\n  195 |                 self.extra_depends.append(dep)\n  196 |                 for incd in dep.get_include_dirs():\n  197 |                     cflags.update(incd.incdirs)\n  198 |             elif isinstance(dep, HotdocTarget):\n  199 |                 # Recurse in hotdoc target dependencies\n  200 |                 self.process_dependencies(dep.get_target_dependencies())\n  201 |                 self._subprojects.extend(dep.subprojects)\n  202 |                 self.process_dependencies(dep.subprojects)\n  203 |                 self.include_paths.add(os.path.join(self.builddir, dep.hotdoc_conf.subdir))\n  204 |                 self.cmd += ['--extra-assets=' + p for p in dep.extra_assets]\n  205 |                 self.add_extension_paths(dep.extra_extension_paths)\n  206 |             elif isinstance(dep, (CustomTarget, build.BuildTarget, CustomTargetIndex)):\n  207 |                 self.extra_depends.append(dep.get_target())\n  208 | \n  209 |         return [f.strip('-I') for f in cflags]","lines":30,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/hotdoc.py#L180-L209"}]},{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `JunitBuilder.log`, for TAP/multi-result tests the suite element is stored as `self.suites[suitename] = et.Element(...)`. The assertion `assert suitename not in self.suites or harness.options.repeat > 1` explicitly tolerates duplicates when `--repeat > 1`, but the assignment then overwrites the previously stored suite element, so all earlier iterations' results are silently dropped from the JUnit XML. Running `meson test --repeat N` on a TAP/Rust test yields a junit report containing only the last iteration for that suite.","fix":"When a suite name already exists (repeat runs), disambiguate the suite name (e.g. append the iteration/`test.num`) or merge testcases into the existing element instead of replacing it.","locations":[{"ref":"mesonbuild/mtest.py:867-882","code":"  867 |         if test.results:\n  868 |             suitename = f'{test.project}.{test.name}'\n  869 |             assert suitename not in self.suites or harness.options.repeat > 1, 'duplicate suite'\n  870 | \n  871 |             suite = self.suites[suitename] = et.Element(\n  872 |                 'testsuite',\n  873 |                 name=suitename,\n  874 |                 tests=str(len(test.results)),\n  875 |                 errors=str(sum(1 for r in test.results if r.result in\n  876 |                                {TestResult.INTERRUPT, TestResult.ERROR})),\n  877 |                 failures=str(sum(1 for r in test.results if r.result in\n  878 |                                  {TestResult.FAIL, TestResult.UNEXPECTEDPASS, TestResult.TIMEOUT})),\n  879 |                 skipped=str(sum(1 for r in test.results if r.result in\n  880 |                                 {TestResult.SKIP, TestResult.IGNORED})),\n  881 |                 time=str(test.duration),\n  882 |             )","lines":16,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mtest.py#L867-L882"}]},{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `TestHarness.doit`, `self.options.num_processes = min(self.options.num_processes, len(tests) * self.options.repeat)` is not clamped to a positive lower bound. If the user passes `-j0`, `num_processes` becomes `0`, and `_run_tests` creates `asyncio.Semaphore(0)`, so every `run_test` coroutine blocks forever on `async with semaphore` and `meson test` hangs indefinitely. A negative `-j` value would instead raise `ValueError` from `Semaphore`. `argparse` applies no lower bound (`type=int`).","fix":"Clamp to at least 1, e.g. `self.options.num_processes = max(1, min(self.options.num_processes, len(tests) * self.options.repeat))`, or validate `--num-processes >= 1` at argument-parse time.","locations":[{"ref":"mesonbuild/mtest.py:1932-1933","code":" 1932 |         self.options.num_processes = min(self.options.num_processes,\n 1933 |                                          len(tests) * self.options.repeat)","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mtest.py#L1932-L1933"},{"ref":"mesonbuild/mtest.py:2147","code":" 2147 |         semaphore = asyncio.Semaphore(self.options.num_processes)","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mtest.py#L2147"}]},{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `rebuild_deps`, the per-dependency dedup set is populated with `depends.update(d)` where `d` is a target-id string. `set.update(d)` iterates the string and adds each individual character, instead of adding the id. Consequently the guard `if d in depends: continue` almost never fires for real (multi-character) ids, so `targets.update(intro_targets[d])` runs redundantly for every repeated dependency across all tests, and `depends` fills up with meaningless single characters. It happens to remain correct only because `targets` is a set; the intended `O(unique deps)` dedup degrades to `O(total deps)`.","fix":"before:\n```python\n                depends.update(d)\n```\nafter:\n```python\n                depends.add(d)\n```","locations":[{"ref":"mesonbuild/mtest.py:2271-2276","code":" 2271 |         for t in tests:\n 2272 |             for d in t.depends:\n 2273 |                 if d in depends:\n 2274 |                     continue\n 2275 |                 depends.update(d)\n 2276 |                 targets.update(intro_targets[d])","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mtest.py#L2271-L2276"}]},{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"This `mlog.warning(...)` call is missing the `f` prefix, so the placeholders `{key}` and `{subproject}` are printed literally instead of being interpolated. The warning is emitted when an option is set in a subproject that was already processed, and the message will be useless to the user.","fix":"Make it an f-string:\nBefore:\n```python\nmlog.warning('option {key} is set in subproject {subproject} but has already been processed')\n```\nAfter:\n```python\nmlog.warning(f'option {key} is set in subproject {subproject} but has already been processed')\n```","locations":[{"ref":"mesonbuild/options.py:1374","code":" 1374 |                     mlog.warning('option {key} is set in subproject {subproject} but has already been processed')","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/options.py#L1374"}]},{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `ClippyDriver.__call__`, when a source block has `--cap-lints allow`, `break` exits the loop over `target['target_sources']`, skipping every remaining source block in the target. If different source blocks in the same target have different cap-lints settings, the later ones are silently not linted. A `continue` (skip only this block) is almost certainly what was intended given the comment 'no use in running clippy if it wouldn't print anything anyway' refers to the current block.","fix":"Replace `break` with `continue` so only the current source block is skipped, not the rest of the target's source blocks.","locations":[{"ref":"mesonbuild/scripts/clippy.py:61-63","code":"   61 |                 # no use in running clippy if it wouldn't print anything anyway\n   62 |                 if lints_cap == 'allow':\n   63 |                     break","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/clippy.py#L61-L63"}]},{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`cmake_run_ctgt` treats `>` and `>>` (and `&>` / `&>>`) identically: in both cases the captured stdout is written with `out_file.write_bytes(res.stdout)`, which truncates. The append redirection operators `>>`/`&>>` therefore do not append, silently discarding any prior file contents. The distinct operator variants imply append semantics were intended.","fix":"Track whether the redirection operator was an append form and open the output file in append-binary mode (`'ab'`) in that case instead of always using `write_bytes` (which truncates).","locations":[{"ref":"mesonbuild/scripts/cmake_run_ctgt.py:52-72","code":"   52 |         for j in i:\n   53 |             if j in {'>', '>>'}:\n   54 |                 stdout = subprocess.PIPE\n   55 |                 continue\n   56 |             elif j in {'&>', '&>>'}:\n   57 |                 stdout = subprocess.PIPE\n   58 |                 stderr = subprocess.STDOUT\n   59 |                 continue\n   60 | \n   61 |             if stdout is not None or stderr is not None:\n   62 |                 capture_file += j\n   63 |             else:\n   64 |                 cmd += [j]\n   65 | \n   66 |         try:\n   67 |             directory.mkdir(parents=True, exist_ok=True)\n   68 | \n   69 |             res = subprocess.run(cmd, stdout=stdout, stderr=stderr, cwd=str(directory), check=True)\n   70 |             if capture_file:\n   71 |                 out_file = directory / capture_file\n   72 |                 out_file.write_bytes(res.stdout)","lines":21,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/cmake_run_ctgt.py#L52-L72"}]},{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `lib_vala_test_template` the first two `printf` calls use single-backslash `\\n`/`\\t` inside a normal (non-raw) Python triple-quoted string, so they are interpreted as an actual newline and tab embedded in the template. When written to the generated `.vala` test file, the literal newline splits a `\"...\"` Vala string across physical lines, which is a syntax error in Vala (regular string literals cannot span lines). The last line correctly uses `\\\\n`. As a result, `meson init -l vala --type library` produces a test file that fails to compile.","fix":"Escape the backslashes so the sequences survive into the generated file:\n```python\n    stdout.printf(\"\\\\nTesting shlib\");\n    stdout.printf(\"\\\\n\\\\t2 + 3 is %d\", sum(2, 3));\n    stdout.printf(\"\\\\n\\\\t8 squared is %d\\\\n\", square(8));\n```","locations":[{"ref":"mesonbuild/templates/valatemplates.py:52-58","code":"   52 | lib_vala_test_template = '''using {namespace};\n   53 | \n   54 | public void main() {{\n   55 |     stdout.printf(\"\\nTesting shlib\");\n   56 |     stdout.printf(\"\\n\\t2 + 3 is %d\", sum(2, 3));\n   57 |     stdout.printf(\"\\n\\t8 squared is %d\\\\n\", square(8));\n   58 | }}","lines":7,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/templates/valatemplates.py#L52-L58"}]},{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`determine_worker_count` mutates its caller-supplied `varnames` list: `varnames = varnames or []` keeps the original list object when a non-empty list is passed, and `varnames.append('MESON_NUM_PROCESSES')` then appends to the caller's list. Today the only caller passing a list (`mtest.py`) uses a throwaway literal, so it is currently benign, but any caller that reuses its list would see `MESON_NUM_PROCESSES` accumulate across calls.","fix":"Copy instead of aliasing:\n```python\n    varnames = list(varnames) if varnames else []\n```\ninstead of `varnames = varnames or []`.","locations":[{"ref":"mesonbuild/utils/universal.py:1316-1321","code":" 1316 | def determine_worker_count(varnames: T.Optional[T.List[str]] = None) -> int:\n 1317 |     num_workers = 0\n 1318 |     varnames = varnames or []\n 1319 |     # Add MESON_NUM_PROCESSES last, so it will prevail if more than one\n 1320 |     # variable is present.\n 1321 |     varnames.append('MESON_NUM_PROCESSES')","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/utils/universal.py#L1316-L1321"}]},{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Several `function_data` entries reference an incorrect header, so the `#include` prefix used by `cc.has_function()` may fail to compile and the feature is reported absent even when present. `'HAVE_STATFS': ('statfs', 'mount.h')` should use `sys/mount.h` (or `sys/vfs.h`); `'HAVE_MKTIME': ('mktime', 'unistd.h')` should use `time.h`; `'HAVE_CONFSTR': ('confstr', 'time.h')` should use `unistd.h`.","fix":"Fix the header names: `statfs`->`sys/mount.h`, `mktime`->`time.h`, `confstr`->`unistd.h`.","locations":[{"ref":"tools/ac_converter.py:94","code":"   94 |      'HAVE_STATFS': ('statfs', 'mount.h'),","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/ac_converter.py#L94"},{"ref":"tools/ac_converter.py:189","code":"  189 |      'HAVE_CONFSTR': ('confstr', 'time.h'),","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/ac_converter.py#L189"},{"ref":"tools/ac_converter.py:253","code":"  253 |      'HAVE_MKTIME': ('mktime', 'unistd.h'),","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/ac_converter.py#L253"}]},{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`purge()` in `build_website.py` removes a directory with `shutil.rmtree(fname)` and then unconditionally calls `os.unlink(fname)`. After `rmtree` the path no longer exists, so `os.unlink` raises `FileNotFoundError` for every directory argument. (The function is also dead code - it is never called anywhere in the module.)","fix":"```\n# before\n    if os.path.isdir(fname):\n        shutil.rmtree(fname)\n    os.unlink(fname)\n# after\n    if os.path.isdir(fname):\n        shutil.rmtree(fname)\n    else:\n        os.unlink(fname)\n```","locations":[{"ref":"tools/build_website.py:9-14","code":"    9 | def purge(fname: str) -> None:\n   10 |     if not os.path.exists(fname):\n   11 |         return\n   12 |     if os.path.isdir(fname):\n   13 |         shutil.rmtree(fname)\n   14 |     os.unlink(fname)","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/build_website.py#L9-L14"}]},{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`condense()` uses `replace_source`, which does naive whole-file `str.replace(old_name, new_name)` for every `(old_name, new_name)` pair. Because `old_name` like `'3 foo'` is a plain substring, it can match inside unrelated strings (e.g. `'13 foo'`) and replacements are applied sequentially so a later rename can re-hit text produced by an earlier one, silently corrupting `run_unittests.py`/`test.json`/etc.","fix":"Use anchored/word-boundary-aware replacements (e.g. match the directory reference with surrounding quotes/path separators via regex) instead of unconditional `str.replace`, or perform all replacements in a single pass with unique sentinels.","locations":[{"ref":"tools/dircondenser.py:45-76","code":"   45 | def replace_source(sourcefile: str, replacements: T.List[T.Tuple[str, str]]) -> None:\n   46 |     with open(sourcefile, encoding='utf-8') as f:\n   47 |         contents = f.read()\n   48 |     for old_name, new_name in replacements:\n   49 |         contents = contents.replace(old_name, new_name)\n   50 |     with open(sourcefile, 'w', encoding='utf-8') as f:\n   51 |         f.write(contents)\n   52 | \n   53 | def condense(dirname: str) -> None:\n   54 |     curdir = os.getcwd()\n   55 |     os.chdir(dirname)\n   56 |     entries = get_entries()\n   57 |     replacements = []\n   58 |     for _i, e in enumerate(entries):\n   59 |         i = _i + 1\n   60 |         if e[0] != i:\n   61 |             old_name = str(e[0]) + ' ' + e[1]\n   62 |             new_name = str(i) + ' ' + e[1]\n   63 |             #print('git mv \"%s\" \"%s\"' % (old_name, new_name))\n   64 |             subprocess.check_call(['git', 'mv', old_name, new_name])\n   65 |             replacements.append((old_name, new_name))\n   66 |             # update any appearances of old_name in expected stdout in test.json\n   67 |             json = os.path.join(new_name, 'test.json')\n   68 |             if os.path.isfile(json):\n   69 |                 replace_source(json, [(old_name, new_name)])\n   70 |     os.chdir(curdir)\n   71 |     replace_source('run_unittests.py', replacements)\n   72 |     replace_source('run_project_tests.py', replacements)\n   73 |     replace_source('run_format_tests.py', replacements)\n   74 |     replace_source('run_shell_checks.py', replacements)\n   75 |     for f in glob('unittests/*.py'):\n   76 |         replace_source(f, replacements)","lines":32,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/dircondenser.py#L45-L76"}]},{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`AstIndentationGenerator.visit_IfClauseNode` uses `if node.elseblock:` to decide whether to indent the else branch. `EmptyNode` (used when there is no `else`) defines no `__bool__`, so it is always truthy. This means the level is incremented and `node.elseblock.accept(self)` is invoked even for if-clauses with no else block, unlike the rest of the file which tests `isinstance(node.elseblock, EmptyNode)`. It is currently harmless only because the printer skips `EmptyNode` and reads indentation from the `IfClauseNode`, not the `EmptyNode`, but the truthiness test is misleading and fragile.","fix":"Replace `if node.elseblock:` with `if not isinstance(node.elseblock, mparser.EmptyNode):` to match the rest of the codebase.","locations":[{"ref":"mesonbuild/ast/postprocess.py:58-61","code":"   58 |         if node.elseblock:\n   59 |             self.level += 1\n   60 |             node.elseblock.accept(self)\n   61 |             self.level -= 1","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/ast/postprocess.py#L58-L61"}]},{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"`compiles_method` produces a confusing error when no `name` is given, unlike the\nsibling `links_method`/`run_method` which fall back to the literal `\"code\"`:\n```python\nif required and not result:\n    raise InterpreterException(f'Could not compile {testname}')\n```\nWhen `testname` is empty this raises `Could not compile ` with a dangling\ntrailing space. `links_method` uses `testname if testname else \"code\"`.","fix":"Match the wording used by `links_method`:\n```python\nraise InterpreterException(f'Could not compile {testname if testname else \"code\"}')\n```","locations":[{"ref":"mesonbuild/interpreter/compiler.py:519-520","code":"  519 |         if required and not result:\n  520 |             raise InterpreterException(f'Could not compile {testname}')","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreter/compiler.py#L519-L520"}]},{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`BooleanHolder.to_string_method` computes `true_str = args[0] or 'true'` and `false_str = args[1] or 'false'` before validating. Because it uses `or`, an explicitly supplied empty string is silently replaced by the default: `true.to_string('', '')` returns `'true'` instead of `''`. The paired-argument validation passes (both are non-`None`), so the empty-string intent is discarded without error.","fix":"Select the string only after validation and without `or`, e.g. `true_str = args[0] if args[0] is not None else 'true'` (same for `false_str`), so explicit empty strings are honored.","locations":[{"ref":"mesonbuild/interpreter/primitives/boolean.py:41-46","code":"   41 |     def to_string_method(self, args: T.Tuple[T.Optional[str], T.Optional[str]], kwargs: TYPE_kwargs) -> str:\n   42 |         true_str = args[0] or 'true'\n   43 |         false_str = args[1] or 'false'\n   44 |         if any(x is not None for x in args) and not all(x is not None for x in args):\n   45 |             raise InvalidArguments('bool.to_string() must have either no arguments or exactly two string arguments that signify what values to return for true and false.')\n   46 |         return true_str if self.held_object else false_str","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreter/primitives/boolean.py#L41-L46"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `generate_xc_configurationList` the REGENERATE configuration-list block builds a fresh `regen_dict` (lines 1936-1942) but registers `test_dict` under `self.regen_buildconf_id` instead of `regen_dict`. As a result `regen_dict` is fully populated yet never added to `objects_dict`, while the RUN_TESTS config list object (`test_dict`) is inserted twice (once under `test_buildconf_id`, once under `regen_buildconf_id`). The REGENERATE `PBXAggregateTarget`, whose `buildConfigurationList` is `self.regen_buildconf_id` (set in `generate_pbx_aggregate_target`), therefore ends up pointing at a duplicate of the test target's configuration list rather than its own, producing an incorrect `project.pbxproj`.","fix":"Change line 1935 from `objects_dict.add_item(self.regen_buildconf_id, test_dict, ...)` to use `regen_dict`:\n\nBefore:\n```python\nregen_dict = PbxDict()\nobjects_dict.add_item(self.regen_buildconf_id, test_dict, 'Build configuration list for PBXAggregateTarget \"REGENERATE\"')\n```\nAfter:\n```python\nregen_dict = PbxDict()\nobjects_dict.add_item(self.regen_buildconf_id, regen_dict, 'Build configuration list for PBXAggregateTarget \"REGENERATE\"')\n```","locations":[{"ref":"mesonbuild/backend/xcodebackend.py:1934-1942","code":" 1934 |         regen_dict = PbxDict()\n 1935 |         objects_dict.add_item(self.regen_buildconf_id, test_dict, 'Build configuration list for PBXAggregateTarget \"REGENERATE\"')\n 1936 |         regen_dict.add_item('isa', 'XCConfigurationList')\n 1937 |         conf_arr = PbxArray()\n 1938 |         regen_dict.add_item('buildConfigurations', conf_arr)\n 1939 |         for buildtype in self.buildtypes:\n 1940 |             conf_arr.add_item(self.test_configurations[buildtype], buildtype)\n 1941 |         regen_dict.add_item('defaultConfigurationIsVisible', 0)\n 1942 |         regen_dict.add_item('defaultConfigurationName', self.buildtype)","lines":9,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/backend/xcodebackend.py#L1934-L1942"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `MetrowerksCCompilerEmbeddedPowerPC.get_option_std_args`, the `-lang` flag and its value are concatenated into a single argv token via `args.append('-lang ' + std)`, producing one argument like `-lang c99`. The sibling `MetrowerksCCompilerARM.get_option_std_args` (lines 739-746) correctly appends them as two separate tokens (`args.append('-lang'); args.append(std)`). Passing `-lang c99` as a single argument to the compiler will not be parsed as the `-lang` option with argument `c99`, so the C standard selection is silently broken for the mwcceppc compiler.","fix":"Split into two arguments, matching the ARM variant:\n```python\n# before\nif std != 'none':\n    args.append('-lang ' + std)\n# after\nif std != 'none':\n    args.append('-lang')\n    args.append(std)\n```","locations":[{"ref":"mesonbuild/compilers/c.py:767-773","code":"  767 |     def get_option_std_args(self, target: BuildTarget, subproject: T.Optional[str] = None) -> T.List[str]:\n  768 |         args = []\n  769 |         std = self.get_compileropt_value('std', target, subproject)\n  770 |         assert isinstance(std, str)\n  771 |         if std != 'none':\n  772 |             args.append('-lang ' + std)\n  773 |         return args","lines":7,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/c.py#L767-L773"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `_pch_validator`, the two-argument PCH-source check at line 734 tests `has_path_sep(args[1])` (the source file) but the returned error message interpolates `args[0]` (the header) instead of `args[1]`. This is a copy-paste from the header branch above it (lines 732-733). The message therefore names the wrong file, misleading users diagnosing a PCH path error.","fix":"before: `return f'PCH source {args[0]} must not be in the same directory as source files'`\nafter: `return f'PCH source {args[1]} must not be in the same directory as source files'`","locations":[{"ref":"mesonbuild/interpreter/type_checking.py:734-735","code":"  734 |     if num_args == 2 and not has_path_sep(args[1]):\n  735 |         return f'PCH source {args[0]} must not be in the same directory as source files'","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/interpreter/type_checking.py#L734-L735"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`TrimWhitespaces.sort_arguments` builds a sort key per argument, but in the non-`StringNode` branch it reads `getattr(node, 'value', '')` from the enclosing `ArgumentNode` (`node`) instead of from the argument being keyed (`arg`). `ArgumentNode` has no `value`, so every non-string argument in a `files()` call gets the same empty key and they are not sorted relative to each other (or to strings). This makes `sort_files` produce incorrect ordering whenever `files()` contains non-literal entries (e.g. variables).","fix":"Reference the argument, not the parent node. Before: `val = getattr(node, 'value', '')` After: `val = getattr(arg, 'value', '')`","locations":[{"ref":"mesonbuild/mformat.py:320-325","code":"  320 |         def sort_key(arg: mparser.BaseNode) -> tuple[tuple[bool, tuple[int | str, ...]], ...]:\n  321 |             if isinstance(arg, mparser.StringNode):\n  322 |                 val = arg.raw_value\n  323 |             else:\n  324 |                 val = getattr(node, 'value', '')\n  325 |             return pathname_sort_key(val)","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mformat.py#L320-L325"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`_compile_moc_impl` raises a `MesonException` whose message names the wrong tool: it formats `f'uic-qt{self.qt_version}'` even though the missing tool is `moc`. The user is told to check for `uic-qt5`/`uic-qt6` when `moc` was not found, which is misleading.","fix":"Before: `raise MesonException(err_msg.format('MOC', f'uic-qt{self.qt_version}', self.qt_version))` After: `raise MesonException(err_msg.format('MOC', f'moc-qt{self.qt_version}', self.qt_version))`","locations":[{"ref":"mesonbuild/modules/_qt.py:567-570","code":"  567 |         if not self.tools['moc'].found():\n  568 |             err_msg = (\"{0} sources specified and couldn't find {1}, \"\n  569 |                        \"please check your qt{2} installation\")\n  570 |             raise MesonException(err_msg.format('MOC', f'uic-qt{self.qt_version}', self.qt_version))","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/_qt.py#L567-L570"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`stem` passes the wrong feature-name prefix to `_obj_to_pathstr`: it uses `'fs.name'` instead of `'fs.stem'`. When called with a `File`/target, the emitted `FeatureNew` message will incorrectly say `fs.name with file` / `fs.name with build_tgt...` for a call to `fs.stem`.","fix":"```python\n# before\npath = self._obj_to_pathstr('fs.name', args[0], state)\n# after\npath = self._obj_to_pathstr('fs.stem', args[0], state)\n```","locations":[{"ref":"mesonbuild/modules/fs.py:229-231","code":"  229 |     def stem(self, state: ModuleState, args: T.Tuple[FilePathTypes], kwargs: T.Dict[str, T.Any]) -> str:\n  230 |         path = self._obj_to_pathstr('fs.name', args[0], state)\n  231 |         return os.path.splitext(os.path.basename(path))[0]","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/fs.py#L229-L231"}]},{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"Several entries in `function_data` map a `HAVE_*` macro to a function name that does not exist because of a typo, so the generated `cc.has_function()` check can never succeed and the corresponding macro is never defined. `'HAVE_STPCOPY': ('stpcopy', ...)` should be `stpcpy`; `'HAVE_GETPWNAM_R': ('getpwnam', ...)` should be `getpwnam_r` (currently it detects the non-reentrant variant); `'HAVE_MKREMAP': ('mkremap', ...)` should be `mremap`; `'HAVE_RENAMEAT': ('renamat', ...)` should be `renameat`.","fix":"Correct the function names: `stpcopy`->`stpcpy`, `getpwnam`->`getpwnam_r`, `mkremap`->`mremap`, `renamat`->`renameat`.","locations":[{"ref":"tools/ac_converter.py:96","code":"   96 |      'HAVE_STPCOPY': ('stpcopy', 'string.h'),","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/ac_converter.py#L96"},{"ref":"tools/ac_converter.py:127","code":"  127 |      'HAVE_GETPWNAM_R': ('getpwnam', 'pwd.h'),","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/ac_converter.py#L127"},{"ref":"tools/ac_converter.py:254","code":"  254 |      'HAVE_MKREMAP': ('mkremap', 'sys/mman.h'),","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/ac_converter.py#L254"},{"ref":"tools/ac_converter.py:266","code":"  266 |      'HAVE_RENAMEAT': ('renamat', 'stdio.h'),","lines":1,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/tools/ac_converter.py#L266"}]},{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In the Windows Vulkan SDK `lib_dir` selection, the `build_cpu == 'x86'` branch\nbreaks the `if/elif` chain used by the other two branches, using a bare `if`\nfor the native case:\n```python\nelif build_cpu == 'x86':\n    if host_cpu == build_cpu:\n        lib_dir = 'Lib32'\n    if host_cpu == 'aarch64':      # should be elif, like the branches above\n        lib_dir = 'Lib-ARM64'\n    elif host_cpu == 'x86_64':\n        lib_dir = 'Lib'\n```\nIt is currently harmless because `host_cpu` can only equal one value, but the\ninconsistency with the `x86_64`/`aarch64` branches (which use `elif host_cpu ==\nbuild_cpu`) is fragile copy-paste that invites a future bug.","fix":"Make the native case part of the same chain:\n```python\nelif build_cpu == 'x86':\n    if host_cpu == build_cpu:\n        lib_dir = 'Lib32'\n    elif host_cpu == 'aarch64':\n        lib_dir = 'Lib-ARM64'\n    elif host_cpu == 'x86_64':\n        lib_dir = 'Lib'\n```","locations":[{"ref":"mesonbuild/dependencies/ui.py:215-221","code":"  215 |                 elif build_cpu == 'x86':\n  216 |                     if host_cpu == build_cpu:\n  217 |                         lib_dir = 'Lib32'\n  218 |                     if host_cpu == 'aarch64':\n  219 |                         lib_dir = 'Lib-ARM64'\n  220 |                     elif host_cpu == 'x86_64':\n  221 |                         lib_dir = 'Lib'","lines":7,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/ui.py#L215-L221"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"In `Runner.update_git`, `revision_val = self.wrap.values.get('revision')` returns `None` when a git wrap has no `revision` key (e.g. a detached git submodule, which the code a few lines later explicitly anticipates: `if not revision or not url: ... 'It could be a detached git submodule for example.'`). The very next line calls `revision_val.upper()`, which raises `AttributeError: 'NoneType' object has no attribute 'upper'` before that guard is ever reached. This crashes `meson subprojects update` with an uncaught traceback. This is a regression introduced by commit `f0851c9e4` (\"Check for uppercase 'head'\"), which previously was just `revision = self.wrap.values.get('revision')`.","fix":"Guard against `None` before calling `.upper()`:\n\nbefore:\n```python\n        revision_val = self.wrap.values.get('revision')\n        revision = revision_val if revision_val.upper() != 'HEAD' else 'HEAD'\n```\nafter:\n```python\n        revision_val = self.wrap.values.get('revision')\n        revision = revision_val if not revision_val or revision_val.upper() != 'HEAD' else 'HEAD'\n```","locations":[{"ref":"mesonbuild/msubprojects.py:331-338","code":"  331 |         revision_val = self.wrap.values.get('revision')\n  332 |         revision = revision_val if revision_val.upper() != 'HEAD' else 'HEAD'\n  333 |         url = self.wrap.values.get('url')\n  334 |         push_url = self.wrap.values.get('push-url')\n  335 |         if not revision or not url:\n  336 |             # It could be a detached git submodule for example.\n  337 |             self.log('  -> No revision or URL specified.')\n  338 |             return True","lines":8,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/msubprojects.py#L331-L338"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"When `--use-llvm-cov` is passed but `--llvm-cov` is empty (its default is `''`), line 20 sets `llvm_cov_exe = None`. Then in the `use_llvm_cov` branch `gcov_exe_args = ['--gcov-executable', llvm_cov_exe + ' gcov']` performs `None + ' gcov'`, raising `TypeError`. The same `None` also gets embedded into the llvm-cov shim script (`f'@\"{llvm_cov_exe}\" gcov %*'` / the sh variant) producing a broken `None` path. There is no early error telling the user that llvm-cov could not be found.","fix":"When `use_llvm_cov` is requested, validate `llvm_cov_exe` up front and emit a clear error / non-zero exit if it is `None`, rather than letting it flow into string concatenation and the shim scripts.","locations":[{"ref":"mesonbuild/scripts/coverage.py:20-21","code":"   20 |     if llvm_cov_exe == '' or shutil.which(llvm_cov_exe) is None:\n   21 |         llvm_cov_exe = None","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/coverage.py#L20-L21"},{"ref":"mesonbuild/scripts/coverage.py:52-53","code":"   52 |     if use_llvm_cov:\n   53 |         gcov_exe_args = ['--gcov-executable', llvm_cov_exe + ' gcov']","lines":2,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/coverage.py#L52-L53"},{"ref":"mesonbuild/scripts/coverage.py:99-110","code":"   99 |             if use_llvm_cov:\n  100 |                 # Create a shim to allow using llvm-cov as a gcov tool.\n  101 |                 if mesonlib.is_windows():\n  102 |                     llvm_cov_shim_path = os.path.join(log_dir, 'llvm-cov.bat')\n  103 |                     with open(llvm_cov_shim_path, 'w', encoding='utf-8') as llvm_cov_bat:\n  104 |                         llvm_cov_bat.write(f'@\"{llvm_cov_exe}\" gcov %*')\n  105 |                 else:\n  106 |                     llvm_cov_shim_path = os.path.join(log_dir, 'llvm-cov.sh')\n  107 |                     with open(llvm_cov_shim_path, 'w', encoding='utf-8') as llvm_cov_sh:\n  108 |                         llvm_cov_sh.write(f'#!/usr/bin/env sh\\nexec \"{llvm_cov_exe}\" gcov $@')\n  109 |                     os.chmod(llvm_cov_shim_path, os.stat(llvm_cov_shim_path).st_mode | stat.S_IEXEC)\n  110 |                 gcov_tool_args = ['--gcov-tool', llvm_cov_shim_path]","lines":12,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/coverage.py#L99-L110"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`os2_syms` does not call `dummy_syms(outfilename)` when both `nm` and `listomf` fail. Every other backend (`gnu_syms`, `osx_syms`, `openbsd_syms`, `freebsd_syms`, `cygwin_syms`, `windows_syms`) writes a dummy/empty symbol file on failure so that the expected output always exists and relinking is forced. Here, when neither tool works, only `print_tool_warning(...)` runs and `outfilename` is never created or touched. The build rule that declares `outfilename` as its output will then either fail (ninja: output not produced) or silently keep a stale symbol file, defeating the ABI-change detection.","fix":"Add `dummy_syms(outfilename)` after the final `print_tool_warning(...)` call at line 286, matching `windows_syms`/`os2` handling in `gen_symbols`.","locations":[{"ref":"mesonbuild/scripts/symbolextractor.py:267-286","code":"  267 | def os2_syms(impfilename: str, outfilename: str) -> None:\n  268 |     # Get a list of all symbols exported with the name of the library\n  269 |     all_stderr = ''\n  270 |     # First try nm.exe for aout .a\n  271 |     output, e = call_tool_nowarn(get_tool('nm') + ['-P', impfilename])\n  272 |     if output:\n  273 |         result = [x for x in output.split('\\n') if ' E ' in x]\n  274 |         write_if_changed('\\n'.join(result) + '\\n', outfilename)\n  275 |         return\n  276 |     if e:\n  277 |         all_stderr += e\n  278 |     # Next try listomf.exe for omf .lib\n  279 |     output, e = call_tool_nowarn(get_tool('listomf') + ['-d', impfilename])\n  280 |     if output:\n  281 |         result = [x for x in output.split('\\n') if ' IMPDEF ' in x]\n  282 |         write_if_changed('\\n'.join(result) + '\\n', outfilename)\n  283 |         return\n  284 |     if e:\n  285 |         all_stderr += e\n  286 |     print_tool_warning(['nm', 'listomf'], 'do not work or were not found', all_stderr)","lines":20,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/scripts/symbolextractor.py#L267-L286"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`_raw_to_dataclass` handles `foo.workspace = true` inheritance by directly indexing `raw_from_workspace[orig_k]`. If a manifest field claims to inherit from the workspace but the workspace table does not define that key, this raises a bare `KeyError` instead of a descriptive `MesonException`, giving the user an opaque traceback for a malformed Cargo.toml.","fix":"Look the value up defensively and raise a `MesonException` naming the crate/field when the workspace lacks the inherited key, e.g. `if orig_k not in raw_from_workspace: raise MesonException(...); ws_v = raw_from_workspace[orig_k]`.","locations":[{"ref":"mesonbuild/cargo/manifest.py:163-165","code":"  163 |         if isinstance(v, dict) and v.get('workspace', False):\n  164 |             # foo.workspace = true, take value from workspace.\n  165 |             ws_v = raw_from_workspace[orig_k]","lines":3,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cargo/manifest.py#L163-L165"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `load_toml`, the `toml2json` fallback path passes the subprocess stdout straight to `json.loads(out)` without wrapping the result. If `toml2json` returns success but emits output that is not valid JSON (or empty), the resulting `json.JSONDecodeError` propagates uncaught instead of being converted to a `CargoTomlError` with file context, unlike every other error path in this function.","fix":"Wrap the `json.loads(out)` call in a try/except that raises `CargoTomlError(str(e), file=filename)` on `json.JSONDecodeError`.","locations":[{"ref":"mesonbuild/cargo/toml.py:52-57","code":"   52 |         p, out, err = Popen_safe([toml2json, filename])\n   53 |         if p.returncode != 0:\n   54 |             error_msg = err.strip() or 'toml2json failed to decode TOML'\n   55 |             raise CargoTomlError(error_msg, file=filename)\n   56 | \n   57 |         raw = json.loads(out)","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/cargo/toml.py#L52-L57"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the `'CL.EXE COMPATIBILITY' in out` branch of `_detect_c_or_cpp_compiler`, when the re-invocation `Popen_safe(compiler + [arg])` raises `OSError`, the exception is recorded but there is no `continue`. Execution falls through and `version = search_version(out)` / `re.search(..., out, ...)` run against the stale `out` from the previous `cl /?` invocation, and a compiler object is constructed from that stale/possibly-inconsistent data instead of skipping this candidate. Every other `Popen_safe` failure in this function does `continue`.","fix":"Add `continue` in the `except OSError` handler so a failed `--version` invocation skips this compiler candidate like all the other detection branches do.","locations":[{"ref":"mesonbuild/compilers/detect.py:434-438","code":"  434 |             try:\n  435 |                 p, out, err = Popen_safe(compiler + [arg])\n  436 |             except OSError as e:\n  437 |                 popen_exceptions[join_args(compiler + [arg])] = e\n  438 |             version = search_version(out)","lines":5,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/compilers/detect.py#L434-L438"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `CoreData.__load_config_files`, when one or more requested config files are missing the code raises `MesonException(f'Cannot find specified {ftype} file: {f}')`. `f` is the loop variable and, after the loop finishes, holds the *last* filename iterated (which may well be a file that was found), not the missing one(s). The actual missing files are collected in `missing`, but that list is only logged, not used in the exception. Users get a misleading error naming the wrong file whenever the missing file is not the last in the list.","fix":"Reference the collected `missing` list in the exception, e.g. `raise MesonException('Cannot find specified {} file(s): {}'.format(ftype, ', '.join(missing)))`.","locations":[{"ref":"mesonbuild/coredata.py:314-319","code":"  314 |         if missing:\n  315 |             if found_invalid:\n  316 |                 mlog.log('Found invalid candidates for', ftype, 'file:', *found_invalid)\n  317 |             mlog.log('Could not find any valid candidate for', ftype, 'files:', *missing)\n  318 |             raise MesonException(f'Cannot find specified {ftype} file: {f}')\n  319 |         return real","lines":6,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/coredata.py#L314-L319"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`HDF5ConfigToolDependency` sets `os.environ['HDF5_CC']`/`HDF5_CXX`/`HDF5_FC` and `HDF5_*LINKER` and unconditionally `del`s them in the `finally` block. If the user already had any of these variables set before the Meson run, their original values are destroyed rather than restored, leaking state to later dependency lookups.","fix":"Save the previous values (if any) before overwriting and restore them in `finally` (or use a context manager that snapshots/restores the specific keys) instead of `del`.","locations":[{"ref":"mesonbuild/dependencies/hdf5.py:107-115","code":"  107 |         for_machine = kwargs['native']\n  108 |         compiler = environment.coredata.compilers[for_machine][language]\n  109 |         try:\n  110 |             os.environ[f'HDF5_{cenv}'] = join_args(compiler.get_exelist())\n  111 |             os.environ[f'HDF5_{lenv}LINKER'] = join_args(compiler.get_linker_exelist())\n  112 |             super().__init__(name, environment, nkwargs)\n  113 |         finally:\n  114 |             del os.environ[f'HDF5_{cenv}']\n  115 |             del os.environ[f'HDF5_{lenv}LINKER']","lines":9,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/dependencies/hdf5.py#L107-L115"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `errorhandler`, an unhandled `OSError` returns `e.errno or 0`. If the OSError has `errno` of `0` or `None` (possible for some synthesized/wrapped OS errors), Meson prints an error traceback but exits with status `0`, incorrectly signalling success to callers (CI, ninja regen, etc.).","fix":"Fall back to a non-zero code, e.g. `return e.errno or 2` (or 1), so an OSError never produces a success exit status.","locations":[{"ref":"mesonbuild/mesonmain.py:57-60","code":"   57 |         elif isinstance(e, OSError):\n   58 |             mlog.exception(Exception(\"Unhandled python OSError. This is probably not a Meson bug, \"\n   59 |                            \"but an issue with your build environment.\"))\n   60 |             return e.errno or 0","lines":4,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/mesonmain.py#L57-L60"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`generate_hotdoc_config` calls `os.chdir(ncwd)` and only restores the original directory with `os.chdir(cwd)` if `run_hotdoc` succeeds. When hotdoc fails, `raise MesonException('hotdoc failed to configure')` executes before the restoring `os.chdir(cwd)`, leaving the process's working directory changed. Any subsequent code that assumes the original cwd (e.g. relative-path handling elsewhere in the interpreter, or error reporting) can then misbehave.","fix":"Use `try/finally` to guarantee the cwd is restored: wrap the `os.chdir(ncwd)` / `run_hotdoc` block in `try:` and put `os.chdir(cwd)` in a `finally:` clause.","locations":[{"ref":"mesonbuild/modules/hotdoc.py:240-247","code":"  240 |     def generate_hotdoc_config(self) -> None:\n  241 |         cwd = os.path.abspath(os.curdir)\n  242 |         ncwd = os.path.join(self.sourcedir, self.subdir)\n  243 |         mlog.log('Generating Hotdoc configuration for: ', mlog.bold(self.name))\n  244 |         os.chdir(ncwd)\n  245 |         if self.hotdoc.run_hotdoc(self.flatten_config_command()) != 0:\n  246 |             raise MesonException('hotdoc failed to configure')\n  247 |         os.chdir(cwd)","lines":8,"link":"https://github.com/mesonbuild/meson/blob/ce3543969d4341d0265de874964fd7be95e542d0/mesonbuild/modules/hotdoc.py#L240-L247"}]},{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`update_po` is inconsistent in error handling: the msgmerge path uses `run_exe(...)` and returns `1` on failure, but the msginit path uses `subprocess.check_call(...)`, which raises `CalledProcessError` on failure instead of returning a non-zero code like the rest of the function. A failing `msginit` therefore propagates an uncaught exception rather than the intended `return 1`.","fix":"Use `subprocess.call(...)` and check the return code (returning `1` on non-zero), or wrap the `check_call` so failures are reported the same way as the msgmerge branch.","locations":[{"ref":"mesonbuild/scripts/gettext.py:60-70","code":"   60 |
