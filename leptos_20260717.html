tion path (`new_path`)\n            |keys| (keys.get(key), vec![]),\n            || vec![],\n        )\n        .flatten()\n        .map(|(_, idx)| idx)?;\n    let mut path = path.clone();    // WRONG: builds item path off the struct path\n    path.push(segment);\n    Some(path)\n}\n```\nCompare the working inherent `KeyedSubfield::patch` in `reactive_stores/src/patch.rs`,\nwhich computes `path = self.path_unkeyed()` (the collection's *own* full path) and\ncalls `self.path_at_key(&path, key)`.\n\nConcrete consequences when calling `store.patch(SomeStructWithKeyedField { .. })`\n(a documented top-level API for any `#[derive(Patch)]` struct that has a\n`#[store(key: ..)]` field):\n\n1. `with_field_keys(path.clone())` is called with the struct path (e.g. `[]` for a\n   top-level store), which does not match the collection's key entry (stored at\n   `[idx]` by `KeyedSubfield::update_keys`). `keys.get(key)` returns `None`, so\n   `path_at_key` returns `None`, so no per-item fine-grained patching/notification\n   happens and `has_changed` is forced `true`.\n2. Worse, `with_field_keys` **inserts a bogus empty `FieldKeys<K>` entry at the\n   struct path** (via `or_insert_with`). Since that path is now present in\n   `KeyMap.0`, the subsequent `notify(&new_path)` -> `triggers_for_path_unkeyed`\n   -> `get_trigger_unkeyed` (in `reactive_stores/src/store_field.rs`) sees\n   `self.keys.contains_key(&path)` become `true` for that ancestor path, calls\n   `get_key_for_index` which finds no reverse-map entry, and hits the\n   `unwrap_or_else(|| panic!(\"could not find key for index ..\"))`. The result is a\n   reliable **panic** on `store.patch(..)` for any struct containing a keyed field.\n\nThis path is not covered by any test (all keyed-patch tests use the inherent\n`store.todos().patch(..)`).","fix":"Query the KeyMap at the collection path (which is the local `new_path` at this\npoint), not the parent struct `path`. Snapshot it before the closure to avoid\nborrow issues:\n```rust\n} else if let Some(closure) = keyed {\n    quote! {\n        let collection_path = new_path.clone();\n        let structure_changed = #library_path::PatchFieldKeyed::patch_field_keyed(\n            &mut self.#locator,\n            new.#locator,\n            notify,\n            keys,\n            #closure,\n            |key| {\n                let keys = keys.as_ref()?;\n                let segment = keys\n                    .with_field_keys(\n                        collection_path.clone(),\n                        |keys| (keys.get(key), vec![]),\n                        || vec![],\n                    )\n                    .flatten()\n                    .map(|(_, idx)| idx)?;\n                let mut item_path = collection_path.clone();\n                item_path.push(segment);\n                Some(item_path)\n            }\n        );\n        if structure_changed {\n            notify(&new_path);\n        }\n        new_path.replace_last(#idx + 1);\n    }\n}\n```\n(Ideally also call the equivalent of `update_keys` after patching so the KeyMap\nstays in sync, matching `KeyedSubfield::patch`.)","locations":[{"ref":"reactive_stores_macro/src/lib.rs:792-819","code":"  792 |                     } else if let Some(closure) = keyed {\n  793 |                         quote! {\n  794 |                             let structure_changed = #library_path::PatchFieldKeyed::patch_field_keyed(\n  795 |                                 &mut self.#locator,\n  796 |                                 new.#locator,\n  797 |                                 notify,\n  798 |                                 keys,\n  799 |                                 #closure,\n  800 |                                 |key| {\n  801 |                                     let keys = keys.as_ref()?;\n  802 |                                     let segment = keys\n  803 |                                         .with_field_keys(\n  804 |                                             path.clone(),\n  805 |                                             |keys| (keys.get(key), vec![]),\n  806 |                                             || vec![],\n  807 |                                         )\n  808 |                                         .flatten()\n  809 |                                         .map(|(_, idx)| idx)?;\n  810 |                                     let mut path = path.clone();\n  811 |                                     path.push(segment);\n  812 |                                     Some(path)\n  813 |                                 }\n  814 |                             );\n  815 |                             if structure_changed {\n  816 |                                 notify(&new_path);\n  817 |                             }\n  818 |                             new_path.replace_last(#idx + 1);\n  819 |                         }","lines":28,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_stores_macro/src/lib.rs#L792-L819"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Executor::init_local_custom_executor` is documented as installing an executor\n\"for the current thread only\" that \"does not affect other threads or the global\nstate,\" but its implementation writes the *global* `EXECUTOR_FNS` `OnceLock`.\nThe function pointers it stores in `EXECUTOR_FNS` dereference a `thread_local`\n`CUSTOM_EXECUTOR_INSTANCE` via `this.get().unwrap()`. Because `EXECUTOR_FNS` is\nglobal, once this is called any thread that later calls `Executor::spawn` /\n`spawn_local` / `poll_local` runs these closures, and on any thread *other* than\nthe one that initialized it the thread-local `CUSTOM_EXECUTOR_INSTANCE` is unset,\nso `.unwrap()` panics. Additionally, having set the global `EXECUTOR_FNS`, no\nsubsequent global `init_*` (or local init on another thread) can succeed. The\ndoc contract (\"does not affect global state\", \"Returns Err if a *local*\nexecutor has already been set *for this thread*\") does not match the actual\nglobal, cross-thread-panicking behavior.","fix":"Either make the executor genuinely thread-local (store the dispatch functions in\na thread-local rather than the global `EXECUTOR_FNS`, and have `Executor::spawn`\netc. consult that thread-local first), or update the documentation to state that\nthis installs global function pointers backed by a thread-local instance and will\npanic if the resulting `spawn`/`poll_local` are invoked from any other thread.","locations":[{"ref":"any_spawner/src/lib.rs:384-430","code":"  384 |     /// Sets a custom executor *for the current thread only*.\n  385 |     ///\n  386 |     /// This overrides the global executor for calls to `spawn`, `spawn_local`, and `poll_local`\n  387 |     /// made *from the current thread*. It does not affect other threads or the global state.\n  388 |     ///\n  389 |     /// The provided `custom_executor` must implement [`CustomExecutor`] and `'static`, but does\n  390 |     /// **not** need to be `Send` or `Sync`.\n  391 |     ///\n  392 |     /// Returns `Err(ExecutorError::AlreadySet)` if a *local* executor has already been set\n  393 |     /// *for this thread*.\n  394 |     pub fn init_local_custom_executor(\n  395 |         custom_executor: impl CustomExecutor + 'static,\n  396 |     ) -> Result<(), ExecutorError> {\n  397 |         // Store the custom executor instance itself to call its methods.\n  398 |         // Use Box for dynamic dispatch.\n  399 |         thread_local! {\n  400 |             static CUSTOM_EXECUTOR_INSTANCE: OnceLock<\n  401 |                 Box<dyn CustomExecutor>,\n  402 |             > = OnceLock::new();\n  403 |         };\n  404 | \n  405 |         CUSTOM_EXECUTOR_INSTANCE.with(|this| {\n  406 |             this.set(Box::new(custom_executor))\n  407 |                 .map_err(|_| ExecutorError::AlreadySet)\n  408 |         })?;\n  409 | \n  410 |         // Now set the ExecutorFns using the stored instance\n  411 |         let executor_impl = ExecutorFns {\n  412 |             spawn: |fut| {\n  413 |                 // Unwrap is safe because we just set it successfully or returned Err.\n  414 |                 CUSTOM_EXECUTOR_INSTANCE\n  415 |                     .with(|this| this.get().unwrap().spawn(fut));\n  416 |             },\n  417 |             spawn_local: |fut| {\n  418 |                 CUSTOM_EXECUTOR_INSTANCE\n  419 |                     .with(|this| this.get().unwrap().spawn_local(fut));\n  420 |             },\n  421 |             poll_local: || {\n  422 |                 CUSTOM_EXECUTOR_INSTANCE\n  423 |                     .with(|this| this.get().unwrap().poll_local());\n  424 |             },\n  425 |         };\n  426 | \n  427 |         EXECUTOR_FNS\n  428 |             .set(executor_impl)\n  429 |             .map_err(|_| ExecutorError::AlreadySet)\n  430 |     }","lines":47,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/any_spawner/src/lib.rs#L384-L430"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The element-index counter in `buildActualChildren` is broken because it tests the counter with truthiness while it starts at `0`. On the first element of a given tag name the `else` branch sets the count to `0`; on the *second* element `elementCount[name]` is `0`, which is falsy, so it takes the `else` branch again and resets to `0` instead of incrementing. As a result the `number` field is effectively always `0` and never distinguishes the Nth element of a tag. Line 308 (`elementCount[walker.currentNode.nodeName];`) is also a dead no-op expression statement (likely a leftover of an intended `+= 1`).\n```js\nif (elementCount[walker.currentNode.nodeName]) {\n  elementCount[walker.currentNode.nodeName] += 1;\n} else {\n  elementCount[walker.currentNode.nodeName] = 0;\n}\nelementCount[walker.currentNode.nodeName];   // dead statement\n```","fix":"```js\nif (walker.currentNode.nodeName in elementCount) {\n  elementCount[walker.currentNode.nodeName] += 1;\n} else {\n  elementCount[walker.currentNode.nodeName] = 0;\n}\n\nactualChildren.push({\n  type: \"element\",\n  name: walker.currentNode.nodeName,\n  number: elementCount[walker.currentNode.nodeName],\n  node: walker.currentNode,\n  children: buildActualChildren(walker.currentNode),\n});\n```","locations":[{"ref":"leptos_hot_reload/src/patch.js:302-314","code":"  302 |       if (walker.currentNode.nodeType == Node.ELEMENT_NODE) {\n  303 |         if (elementCount[walker.currentNode.nodeName]) {\n  304 |           elementCount[walker.currentNode.nodeName] += 1;\n  305 |         } else {\n  306 |           elementCount[walker.currentNode.nodeName] = 0;\n  307 |         }\n  308 |         elementCount[walker.currentNode.nodeName];\n  309 | \n  310 |         actualChildren.push({\n  311 |           type: \"element\",\n  312 |           name: walker.currentNode.nodeName,\n  313 |           number: elementCount[walker.currentNode.nodeName],\n  314 |           node: walker.currentNode,","lines":13,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_hot_reload/src/patch.js#L302-L314"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"Prop/attribute classification in `component_to_tokens` mixes two different index spaces. `spread_marker` is the position of the `{..}` marker within the *full* attribute list `node.attributes()` (including `NodeAttribute::Block` entries). But `attrs` is then built by `filter_map`-ing out every non-`Attribute` (dropping blocks), and the prop loop compares the *filtered* index against `spread_marker`:\n```rust\nfor (_, attr) in attrs.iter_mut().enumerate().filter(|(idx, attr)| {\n    idx < &spread_marker && { /* ... */ }\n})\n```\nWhen at least one block attribute appears *before* the `{..}` marker, the filtered index of attributes located *after* the marker can still be `< spread_marker`, so a plain HTML attribute placed after the spread marker is wrongly treated as a component prop. Example: attributes `[{blk}, foo=\"a\", {..}, bar=\"b\"]` - `spread_marker == 2` (full-list index of `{..}`), filtered list is `[foo, bar]`, and `bar` gets filtered index `1 < 2`, so `bar` is emitted as a prop (`.bar(...)`) instead of being spread as an HTML attribute.","fix":"Compute `spread_marker` in the same (filtered) index space that the prop loop iterates, or carry the original full-list index alongside each attribute. For example, capture the enumerate index before filtering:\n```rust\nlet mut attrs = node\n    .attributes_mut()\n    .iter_mut()\n    .enumerate()\n    .filter_map(|(idx, node)| match node {\n        NodeAttribute::Attribute(node) => Some((idx, node)),\n        _ => None,\n    })\n    .collect::<Vec<_>>();\n\nfor (orig_idx, attr) in attrs.iter_mut().filter(|(orig_idx, attr)| {\n    *orig_idx < spread_marker && { /* ... existing key checks ... */ }\n}) {\n    // ...\n}\n```","locations":[{"ref":"leptos_macro/src/view/component_builder.rs:31-100","code":"   31 |     let spread_marker = node\n   32 |         .attributes()\n   33 |         .iter()\n   34 |         .position(|node| match node {\n   35 |             NodeAttribute::Block(NodeBlock::ValidBlock(block)) => {\n   36 |                 matches!(\n   37 |                     block.stmts.first(),\n   38 |                     Some(Stmt::Expr(\n   39 |                         Expr::Range(ExprRange {\n   40 |                             start: None,\n   41 |                             limits: RangeLimits::HalfOpen(_),\n   42 |                             end: None,\n   43 |                             ..\n   44 |                         }),\n   45 |                         _,\n   46 |                     ))\n   47 |                 )\n   48 |             }\n   49 |             _ => false,\n   50 |         })\n   51 |         .unwrap_or_else(|| node.attributes().len());\n   52 | \n   53 |     // Initially using uncloned mutable reference, as the node.key might be mutated during prop extraction (for nostrip:)\n   54 |     let mut attrs = node\n   55 |         .attributes_mut()\n   56 |         .iter_mut()\n   57 |         .filter_map(|node| {\n   58 |             if let NodeAttribute::Attribute(node) = node {\n   59 |                 Some(node)\n   60 |             } else {\n   61 |                 None\n   62 |             }\n   63 |         })\n   64 |         .collect::<Vec<_>>();\n   65 | \n   66 |     let mut required_props = vec![];\n   67 |     let mut optional_props = vec![];\n   68 |     for (_, attr) in attrs.iter_mut().enumerate().filter(|(idx, attr)| {\n   69 |         idx < &spread_marker && {\n   70 |             let attr_key = attr.key.to_string();\n   71 |             !is_attr_let(&attr.key)\n   72 |                 && !attr_key.starts_with(\"clone:\")\n   73 |                 && !attr_key.starts_with(\"class:\")\n   74 |                 && !attr_key.starts_with(\"style:\")\n   75 |                 && !attr_key.starts_with(\"attr:\")\n   76 |                 && !attr_key.starts_with(\"prop:\")\n   77 |                 && !attr_key.starts_with(\"on:\")\n   78 |                 && !attr_key.starts_with(\"use:\")\n   79 |         }\n   80 |     }) {\n   81 |         let optional = is_nostrip_optional_and_update_key(&mut attr.key);\n   82 |         let name = &attr.key;\n   83 | \n   84 |         let value = attr\n   85 |             .value()\n   86 |             .map(|v| {\n   87 |                 quote! { #v }\n   88 |             })\n   89 |             .unwrap_or_else(|| quote! { #name });\n   90 | \n   91 |         if optional {\n   92 |             optional_props.push(quote! {\n   93 |                 props.#name = { #value }.map(::leptos::prelude::IntoReactiveValue::into_reactive_value);\n   94 |             })\n   95 |         } else {\n   96 |             required_props.push(quote! {\n   97 |                 .#name(#[allow(unused_braces)] { #value })\n   98 |             })\n   99 |         }\n  100 |     }","lines":70,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_macro/src/view/component_builder.rs#L31-L100"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `component_to_tokens`, the spread-attribute loop emits the wrong token stream for a plain (non-range) block attribute on a component. In the `NodeAttribute::Block` arm the fallback is `quote! { #node }`, but `node` is *not* shadowed in that arm - it still refers to the outer `node: &mut NodeElement`. So for an attribute like `<Comp {my_attrs} />` (a block that is not the `{..}` spread marker) the macro re-emits the *entire element* as an attribute instead of the block value.\nCompare the analogous code in `view/mod.rs` `element_to_tokens`, which correctly pushes `quote! { #block }` in the same situation:\n```rust\n// mod.rs, spread handling\n_ => {\n    additions.push(quote! { #block });\n}\n```\nHere it is `#node` (the whole `<Comp .../>`), which will not compile as an attribute value passed to `.add_any_attr(...)`.","fix":"```rust\nif let NodeAttribute::Block(block) = attr {\n    let dotted = if let NodeBlock::ValidBlock(block) = block {\n        match block.stmts.first() {\n            Some(Stmt::Expr(Expr::Range(ExprRange {\n                start: None,\n                limits: RangeLimits::HalfOpen(_),\n                end: Some(end),\n                ..\n            }), _)) => Some(quote! { #end }),\n            _ => None,\n        }\n    } else {\n        None\n    };\n    // emit the block, not the whole element\n    Some(dotted.unwrap_or_else(|| quote! { #block }))\n}\n```","locations":[{"ref":"leptos_macro/src/view/component_builder.rs:146-167","code":"  146 |             if let NodeAttribute::Block(block) = attr {\n  147 |                 let dotted = if let NodeBlock::ValidBlock(block) = block {\n  148 |                     match block.stmts.first() {\n  149 |                         Some(Stmt::Expr(\n  150 |                             Expr::Range(ExprRange {\n  151 |                                 start: None,\n  152 |                                 limits: RangeLimits::HalfOpen(_),\n  153 |                                 end: Some(end),\n  154 |                                 ..\n  155 |                             }),\n  156 |                             _,\n  157 |                         )) => Some(quote! { #end }),\n  158 |                         _ => None,\n  159 |                     }\n  160 |                 } else {\n  161 |                     None\n  162 |                 };\n  163 |                 Some(dotted.unwrap_or_else(|| {\n  164 |                     quote! {\n  165 |                         #node\n  166 |                     }\n  167 |                 }))","lines":22,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_macro/src/view/component_builder.rs#L146-L167"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`element_to_tokens` references a non-existent module `math` when an ambiguous element (`a`, `script`, or `title`) is nested inside a MathML parent. The direct MathML path uses `::leptos::tachys::mathml::#name()` (correct), but the `TagType::Math` branch of the ambiguous-element match uses `::leptos::tachys::math::#name()`:\n```rust\nTagType::Math => {\n    quote_spanned! { node.name().span() => ::leptos::tachys::math::#name() }\n}\n```\n`tachys/src/lib.rs` only declares `pub mod mathml;` - there is no `math` module - so a view like `<math><a>...<\/a><\/math>` fails to compile with an unresolved module error.","fix":"```rust\nTagType::Math => {\n    quote_spanned! { node.name().span() => ::leptos::tachys::m nput: &S| {\n  158 |                 S::run_on_client(input.clone())\n  159 |             }),\n  160 |             #[cfg(any(debug_assertions, leptos_debuginfo))]\n  161 |             defined_at: Location::caller(),\n  162 |         }\n  163 |     }","lines":15,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_server/src/action.rs#L149-L163"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Same defect as in `action.rs`: `ServerMultiAction::<S>::new` uses `Location::caller()` for `defined_at` but lacks `#[track_caller]`, so the recorded location is always inside `leptos_server` instead of the user's call site. The `Arc` variant `ArcServerMultiAction::new` has the attribute (see `multi_action.rs:26`), so this is an inconsistency/omission.\n```rust\n    /// Creates a new [`MultiAction`] which, when dispatched, will call the server function `S`.\n    pub fn new() -> Self {   // <-- missing #[track_caller]\n        // ...\n        defined_at: Location::caller(),\n```","fix":"```rust\n    /// Creates a new [`MultiAction`] which, when dispatched, will call the server function `S`.\n    #[track_caller]\n    pub fn new() -> Self {\n        // ...\n    }\n```","locations":[{"ref":"leptos_server/src/multi_action.rs:120-129","code":"  120 |     /// Creates a new [`MultiAction`] which, when dispatched, will call the server function `S`.\n  121 |     pub fn new() -> Self {\n  122 |         Self {\n  123 |             inner: MultiAction::new(|input: &S| {\n  124 |                 S::run_on_client(input.clone())\n  125 |             }),\n  126 |             #[cfg(any(debug_assertions, leptos_debuginfo))]\n  127 |             defined_at: Location::caller(),\n  128 |         }\n  129 |     }","lines":10,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_server/src/multi_action.rs#L120-L129"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`SuppressResourceLoad` is not nesting-safe. `new()` unconditionally stores `true` into the global\n`IS_SUPPRESSING_RESOURCE_LOAD` atomic and `drop` unconditionally stores `false`:\n```rust\nimpl SuppressResourceLoad {\n    pub fn new() -> Self {\n        IS_SUPPRESSING_RESOURCE_LOAD.store(true, Ordering::Relaxed);\n        Self\n    }\n}\nimpl Drop for SuppressResourceLoad {\n    fn drop(&mut self) {\n        IS_SUPPRESSING_RESOURCE_LOAD.store(false, Ordering::Relaxed);\n    }\n}\n```\nIf two guards overlap (nested scopes, or re-entrant route generation), the inner guard's `drop`\nturns suppression **off** while the outer guard is still alive, silently re-enabling resource\nloading. Note that the very similar helper `run_in_resource_source_signal` in the same file\ncorrectly saves and restores the previous value; this guard does not. It is also a process-global\natomic (not thread-local), so it affects all threads at once.","fix":"Restore the previous value on drop instead of forcing `false`:\n```rust\npub struct SuppressResourceLoad(bool); // previous value\n\nimpl SuppressResourceLoad {\n    pub fn new() -> Self {\n        let prev = IS_SUPPRESSING_RESOURCE_LOAD.swap(true, Ordering::Relaxed);\n        Self(prev)\n    }\n}\nimpl Drop for SuppressResourceLoad {\n    fn drop(&mut self) {\n        IS_SUPPRESSING_RESOURCE_LOAD.store(self.0, Ordering::Relaxed);\n    }\n}\n```","locations":[{"ref":"leptos_server/src/resource.rs:44-62","code":"   44 | impl SuppressResourceLoad {\n   45 |     /// Prevents resources from loading until this is dropped.\n   46 |     pub fn new() -> Self {\n   47 |         IS_SUPPRESSING_RESOURCE_LOAD.store(true, Ordering::Relaxed);\n   48 |         Self\n   49 |     }\n   50 | }\n   51 | \n   52 | impl Default for SuppressResourceLoad {\n   53 |     fn default() -> Self {\n   54 |         Self::new()\n   55 |     }\n   56 | }\n   57 | \n   58 | impl Drop for SuppressResourceLoad {\n   59 |     fn drop(&mut self) {\n   60 |         IS_SUPPRESSING_RESOURCE_LOAD.store(false, Ordering::Relaxed);\n   61 |     }\n   62 | }","lines":19,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_server/src/resource.rs#L44-L62"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`ArcMemo`'s `Hash` implementation hashes the address of a stack temporary instead of the `Arc`'s pointer, so it is inconsistent with its `PartialEq`/`Eq` (which use `Arc::ptr_eq`).\n\n```rust\nfn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n    std::ptr::hash(&Arc::as_ptr(&self.inner), state);\n}\n```\n\n`std::ptr::hash<T>(hashee: *const T, ...)` hashes the address value passed as `hashee`. Here `Arc::as_ptr(&self.inner)` produces a temporary `*const MemoInner<..>`, and `&` takes a reference to that temporary local, so `T = *const MemoInner<..>` and the address that gets hashed is the *stack slot of the temporary*, not the `Arc` pointer. Consequences: two `ArcMemo` clones that are `Eq` (same `inner`) produce different hashes, and distinct memos can collide, violating the `Hash`/`Eq` contract and corrupting any `HashMap`/`HashSet` keyed on `ArcMemo`. Compare the correct pattern in `channel.rs:81` (`Arc::as_ptr(&self.0).hash(state)`).","fix":"Hash the pointer value directly instead of the address of a temporary:\n\n```rust\nfn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n    Arc::as_ptr(&self.inner).hash(state);\n}\n```","locations":[{"ref":"reactive_graph/src/computed/arc_memo.rs:226-233","code":"  226 | impl<T, S> Hash for ArcMemo<T, S>\n  227 | where\n  228 |     S: Storage<T>,\n  229 | {\n  230 |     fn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n  231 |         std::ptr::hash(&Arc::as_ptr(&self.inner), state);\n  232 |     }\n  233 | }","lines":8,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/computed/arc_memo.rs#L226-L233"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"The two `Write::try_write` implementations for the async-derived types acquire the `inner` lock and the `value` lock in opposite orders, creating a lock-ordering hazard (potential deadlock) if both APIs write the same underlying resource concurrently.\n\n`ArcAsyncDerived::try_write` holds `inner` (a `std::sync::RwLock`) and then blocks on `value` (an `async_lock::RwLock`):\n\n```rust\nlet mut guard = self.inner.write().or_poisoned(); // inner held...\nguard.version += 1;\ndrop(mem::take(&mut guard.pending_suspenses));\nSome(MappedMut::new(\n    WriteGuard::new(self.clone(), self.value.blocking_write()), // ...acquires value\n    ...\n))\n```\n\n`AsyncDerived::try_write` (arena wrapper over the *same* `ArcAsyncDerived`) does the reverse - it holds `value` and then acquires `inner`:\n\n```rust\nlet guard = self.inner.try_with_value(|n| n.value.blocking_write_arc())?; // value held...\nself.inner.try_with_value(|n| {\n    let mut guard = n.inner.write().or_poisoned(); // ...acquires inner\n    guard.version += 1;\n    drop(mem::take(&mut guard.pending_suspenses));\n});\n```\n\nIf thread A calls `ArcAsyncDerived::try_write` (holds `inner`, waits for `value`) while thread B calls `AsyncDerived::try_write` on the same resource (holds `value`, waits for `inner`), both block forever. Because `value` is an async lock acquired with a *blocking* call, this is a hard hang, not a poison.","fix":"Pick a single, documented lock order and use it in both impls. For example, always take `inner` before `value` (matching `ArcAsyncDerived`), and rewrite the arena wrapper to bump the version *before* acquiring the value guard:\n\n```rust\nfn try_write(&self) -> Option<impl UntrackableGuard<Target = Self::Value>> {\n    self.inner.try_with_value(|n| {\n        let mut guard = n.inner.write().or_poisoned();\n        guard.version += 1;\n        drop(mem::take(&mut guard.pending_suspenses));\n    })?;\n    let guard = self.inner.try_with_value(|n| n.value.blocking_write_arc())?;\n    Some(MappedMut::new(WriteGuard::new(*self, guard), |v| v.deref(), |v| v.deref_mut()))\n}\n```","locations":[{"ref":"reactive_graph/src/computed/async_derived/arc_async_derived.rs:680-712","code":"  680 |     fn try_write(&self) -> Option<impl UntrackableGuard<Target = Self::Value>> {\n  681 |         // increment the version, such that a rerun triggered previously does not overwrite this\n  682 |         // new value\n  683 |         let mut guard = self.inner.write().or_poisoned();\n  684 |         guard.version += 1;\n  685 | \n  686 |         // tell any suspenses to stop waiting for this\n  687 |         drop(mem::take(&mut guard.pending_suspenses));\n  688 | \n  689 |         Some(MappedMut::new(\n  690 |             WriteGuard::new(self.clone(), self.value.blocking_write()),\n  691 |             |v| v.deref(),\n  692 |             |v| v.deref_mut(),\n  693 |         ))\n  694 |     }\n  695 | \n  696 |     fn try_write_untracked(\n  697 |         &self,\n  698 |     ) -> Option<impl DerefMut<Target = Self::Value>> {\n  699 |         // increment the version, such that a rerun triggered previously does not overwrite this\n  700 |         // new value\n  701 |         let mut guard = self.inner.write().or_poisoned();\n  702 |         guard.version += 1;\n  703 | \n  704 |         // tell any suspenses to stop waiting for this\n  705 |         drop(mem::take(&mut guard.pending_suspenses));\n  706 | \n  707 |         Some(MappedMut::new(\n  708 |             self.value.blocking_write(),\n  709 |             |v| v.deref(),\n  710 |             |v| v.deref_mut(),\n  711 |         ))\n  712 |     }","lines":33,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/computed/async_derived/arc_async_derived.rs#L680-L712"},{"ref":"reactive_graph/src/computed/async_derived/async_derived.rs:350-391","code":"  350 |     fn try_write(&self) -> Option<impl UntrackableGuard<Target = Self::Value>> {\n  351 |         let guard = self\n  352 |             .inner\n  353 |             .try_with_value(|n| n.value.blocking_write_arc())?;\n  354 | \n  355 |         self.inner.try_with_value(|n| {\n  356 |             let mut guard = n.inner.write().or_poisoned();\n  357 |             // increment the version, such that a rerun triggered previously does not overwrite this\n  358 |             // new value\n  359 |             guard.version += 1;\n  360 | \n  361 |             // tell any suspenses to stop waiting for this\n  362 |             drop(mem::take(&mut guard.pending_suspenses));\n  363 |         });\n  364 | \n  365 |         Some(MappedMut::new(\n  366 |             WriteGuard::new(*self, guard),\n  367 |             |v| v.deref(),\n  368 |             |v| v.deref_mut(),\n  369 |         ))\n  370 |     }\n  371 | \n  372 |     fn try_write_untracked(\n  373 |         &self,\n  374 |     ) -> Option<impl DerefMut<Target = Self::Value>> {\n  375 |         self.inner.try_with_value(|n| {\n  376 |             let mut guard = n.inner.write().or_poisoned();\n  377 |             // increment the version, such that a rerun triggered previously does not overwrite this\n  378 |             // new value\n  379 |             guard.version += 1;\n  380 | \n  381 |             // tell any suspenses to stop waiting for this\n  382 |             drop(mem::take(&mut guard.pending_suspenses));\n  383 |         });\n  384 | \n  385 |         self.inner\n  386 |             .try_with_value(|n| n.value.blocking_write_arc())\n  387 |             .map(|inner| {\n  388 |                 MappedMut::new(inner, |v| v.deref(), |v| v.deref_mut())\n  389 |             })\n  390 |     }\n  391 | }","lines":42,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/computed/async_derived/async_derived.rs#L350-L391"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`ArcStoredValue`'s `Hash` implementation has the same defect as `ArcMemo`: it hashes the address of a stack temporary rather than the `Arc` pointer, breaking the `Hash`/`Eq` contract (`PartialEq` uses `Arc::ptr_eq`).\n\n```rust\nfn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n    std::ptr::hash(&Arc::as_ptr(&self.value), state);\n}\n```\n\n`&Arc::as_ptr(&self.value)` is a reference to a temporary `*const RwLock<T>`, so `std::ptr::hash` hashes the stack address of that temporary, not the allocation address. Equal `ArcStoredValue`s can hash differently and unequal ones can collide, corrupting `HashMap`/`HashSet` usage.","fix":"```rust\nfn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n    Arc::as_ptr(&self.value).hash(state);\n}\n```","locations":[{"ref":"reactive_graph/src/owner/arc_stored_value.rs:65-69","code":"   65 | impl<T> Hash for ArcStoredValue<T> {\n   66 |     fn hash<H: std::hash::Hasher>(&self, state: &mut H) {\n   67 |         std::ptr::hash(&Arc::as_ptr(&self.value), state);\n   68 |     }\n   69 | }","lines":5,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/owner/arc_stored_value.rs#L65-L69"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`AtIndex::writer` fails to `untrack()` the parent writer before wrapping it,\nunlike the analogous `Subfield::writer`, causing writes to an indexed element\nto over-notify (the parent's trigger fires, waking siblings), and causing\n`try_write_untracked` on an `AtIndex` to still notify.\n\n`AtIndex::writer` (`iter.rs`):\n```rust\nfn writer(&self) -> Option<Self::Writer> {\n    let trigger = self.get_trigger(self.path().into_iter().collect());\n    let inner = WriteGuard::new(trigger.children, self.inner.writer()?); // parent NOT untracked\n    let index = self.index;\n    Some(MappedMutArc::new(inner, move |n| &n[index], move |n| &mut n[index]))\n}\n```\nCompare `Subfield::writer` (`reactive_stores/src/subfield.rs`), which\ndeliberately untracks the parent with an explanatory comment:\n```rust\nlet mut parent = self.inner.writer()?;\n// we want to untrack the parent writer so that it doesn't notify the parent's\n// `this` trigger, which would notify our siblings too\nparent.untrack();\nlet triggers = self.triggers_for_current_path();\nlet guard = WriteGuard::new(triggers, parent);\n```\nThe parent writer returned by `self.inner.writer()` is itself a notifying\n`WriteGuard` (e.g. `Store::writer` returns\n`WriteGuard::new(trigger.children, guard)`). Because `WriteGuard::drop` first\ndrops the nested `guard` (which fires the parent's trigger) and only then\nconsults its own `triggerable`, and because `WriteGuard::untrack` only clears\nits *own* `triggerable` (not the nested guard), the un-untracked parent in\n`AtIndex::writer` fires on every write. Consequences:\n- Normal `.write()`/`.set()`/`.update()` on an indexed field notifies the\n  parent path, waking every sibling of the index - defeating the fine-grained\n  reactivity that stores exist to provide (performance + spurious re-runs).\n- `AtIndex::try_write_untracked` calls `writer().untrack()`, which only clears\n  the outer `trigger.children`; the nested parent writer is still live and\n  still notifies, so an \"untracked\" indexed write is not actually untracked.","fix":"Mirror `Subfield::writer`: untrack the parent writer before wrapping it.\n```rust\nfn writer(&self) -> Option<Self::Writer> {\n    let trigger = self.get_trigger(self.path().into_iter().collect());\n    let mut parent = self.inner.writer()?;\n    parent.untrack(); // do not notify the parent's trigger / siblings\n    let inner = WriteGuard::new(trigger.children, parent);\n    let index = self.index;\n    Some(MappedMutArc::new(inner, move |n| &n[index], move |n| &mut n[index]))\n}\n```","locations":[{"ref":"reactive_stores/src/iter.rs:108-117","code":"  108 |     fn writer(&self) -> Option<Self::Writer> {\n  109 |         let trigger = self.get_trigger(self.path().into_iter().collect());\n  110 |         let inner = WriteGuard::new(trigger.children, self.inner.writer()?);\n  111 |         let index = self.index;\n  112 |         Some(MappedMutArc::new(\n  113 |             inner,\n  114 |             move |n| &n[index],\n  115 |             move |n| &mut n[index],\n  116 |         ))\n  117 |     }","lines":10,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_stores/src/iter.rs#L108-L117"},{"ref":"reactive_stores/src/iter.rs:203-223","code":"  203 | impl<Inner, Prev> Write for AtIndex<Inner, Prev>\n  204 | where\n  205 |     Inner: StoreField<Value = Prev>,\n  206 |     Prev: IndexMut<usize> + 'static,\n  207 |     Prev::Output: Sized + 'static,\n  208 | {\n  209 |     type Value = Prev::Output;\n  210 | \n  211 |     fn try_write(&self) -> Option<impl UntrackableGuard<Target = Self::Value>> {\n  212 |         self.writer()\n  213 |     }\n  214 | \n  215 |     fn try_write_untracked(\n  216 |         &self,\n  217 |     ) -> Option<impl DerefMut<Target = Self::Value>> {\n  218 |         self.writer().map(|mut writer| {\n  219 |             writer.untrack();\n  220 |             writer\n  221 |         })\n  222 |     }\n  223 | }","lines":21,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_stores/src/iter.rs#L203-L223"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `FlatRoutesView::rebuild`, when the new URL matches the *same route id* but a\n*different path* (e.g. navigating `/users/1` -> `/users/2`, same route pattern,\ndifferent param), the retained `url` signal is not updated:\n```rust\n// if it's the same route, we just update the params\nif new_id == initial_state.id {\n    initial_state.params.set(matched_params);\n    initial_state.matched.set(matched_string);\n    if let Some(location) = location {\n        location.ready_to_complete();\n    }\n    return;\n}\n```\n`initial_state.url` (the `ArcRwSignal<Url>` provided via context) is left holding\nthe previous URL, even though `initial_state.path` was just updated (lines\n214-216) and the path/query genuinely changed. By contrast the same-path branch\ndoes `initial_state.url.set(url_snapshot.to_owned())` (line 208), and the\nnew-route branch replaces the `url` signal entirely (line 251). Consumers reading\nthe provided `url` context on a same-route param navigation get a stale value.","fix":"Update the `url` signal before returning from the same-id branch:\n```rust\nif new_id == initial_state.id {\n    initial_state.url.set(url_snapshot.to_owned());\n    initial_state.params.set(matched_params);\n    initial_state.matched.set(matched_string);\n    if let Some(location) = location {\n        location.ready_to_complete();\n    }\n    return;\n}\n```","locations":[{"ref":"router/src/flat_router.rs:230-238","code":"  230 |         // if it's the same route, we just update the params\n  231 |         if new_id == initial_state.id {\n  232 |             initial_state.params.set(matched_params);\n  233 |             initial_state.matched.set(matched_string);\n  234 |             if let Some(location) = location {\n  235 |                 location.ready_to_complete();\n  236 |             }\n  237 |             return;\n  238 |         }","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/flat_router.rs#L230-L238"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`<Form>`'s `extract_form_attributes` lowercases the form `action` URL when the\nsubmitter is the `<form>` element itself:\n```rust\nform.get_attribute(\"action\")\n    .unwrap_or_default()\n    .to_lowercase(),\n```\nThe extracted `action` string is then used verbatim for navigation / POST target\n(`post_form_data(&action, ..)`, `post_params(&action, ..)`, and\n`format!(\"{action}?{params}\")`). URLs are case-sensitive (path segments, query\nvalues, encoded characters), so `action=\"/User/Profile?Name=Bob\"` is corrupted to\n`/user/profile?name=bob`. The other extraction branches (input/button and the\nno-submitter branch) do *not* lowercase `action`, so behavior is also\ninconsistent. Only `method` and `enctype` legitimately need case folding.","fix":"Do not lowercase the action URL:\n```rust\nSome((\n    form.clone(),\n    form.get_attribute(\"method\")\n        .unwrap_or_else(|| \"get\".to_string())\n        .to_lowercase(),\n    form.get_attribute(\"action\").unwrap_or_default(),   // keep original case\n    form.get_attribute(\"enctype\")\n        .unwrap_or_else(|| \"application/x-www-form-urlencoded\".to_string())\n        .to_lowercase(),\n))\n```","locations":[{"ref":"router/src/form.rs:356-369","code":"  356 |                 Some((\n  357 |                     form.clone(),\n  358 |                     form.get_attribute(\"method\")\n  359 |                         .unwrap_or_else(|| \"get\".to_string())\n  360 |                         .to_lowercase(),\n  361 |                     form.get_attribute(\"action\")\n  362 |                         .unwrap_or_default()\n  363 |                         .to_lowercase(),\n  364 |                     form.get_attribute(\"enctype\")\n  365 |                         .unwrap_or_else(|| {\n  366 |                             \"application/x-www-form-urlencoded\".to_string()\n  367 |                         })\n  368 |                         .to_lowercase(),\n  369 |                 ))","lines":14,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/form.rs#L356-L369"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`extract_form_attributes` does not lowercase `method` (nor `enctype`) in the\nno-submitter branch, so an uppercase HTML `method` is later mis-compared against\nlowercase literals and mis-routed. The submit handler branches on\n`method == \"post\"` and `enctype == \"multipart/form-data\"`. In the no-submitter\nbranch (form submitted via Enter key):\n```rust\nSome(form) => {\n    let form = form.unchecked_into::<web_sys::HtmlFormElement>();\n    Some((\n        form.clone(),\n        form.get_attribute(\"method\")\n            .unwrap_or_else(|| \"get\".to_string()),   // NOT lowercased\n        form.get_attribute(\"action\").unwrap_or_default(),\n        form.get_attribute(\"enctype\").unwrap_or_else(|| { .. }),  // NOT lowercased\n    ))\n}\n```\n`method=\"POST\"` (valid, case-insensitive per HTML spec) fails `method == \"post\"`\nand falls through to the GET branch, sending the form as a GET request. The\ninput/button branches have the same problem for the element's *own*\n`method`/`enctype` attributes (only their form fallbacks are lowercased at lines\n379-395 and 406-422), so an uppercase `formmethod=\"POST\"` is likewise treated as\nGET.","fix":"Lowercase `method` and `enctype` in every branch. For the no-submitter branch:\n```rust\nSome((\n    form.clone(),\n    form.get_attribute(\"method\")\n        .unwrap_or_else(|| \"get\".to_string())\n        .to_lowercase(),\n    form.get_attribute(\"action\").unwrap_or_default(),\n    form.get_attribute(\"enctype\")\n        .unwrap_or_else(|| \"application/x-www-form-urlencoded\".to_string())\n        .to_lowercase(),\n))\n```\nand apply `.to_lowercase()` to the element's own `method`/`enctype` in the\ninput/button branches as well.","locations":[{"ref":"router/src/form.rs:441-449","code":"  441 |                 Some((\n  442 |                     form.clone(),\n  443 |                     form.get_attribute(\"method\")\n  444 |                         .unwrap_or_else(|| \"get\".to_string()),\n  445 |                     form.get_attribute(\"action\").unwrap_or_default(),\n  446 |                     form.get_attribute(\"enctype\").unwrap_or_else(|| {\n  447 |                         \"application/x-www-form-urlencoded\".to_string()\n  448 |                     }),\n  449 |                 ))","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/form.rs#L441-L449"},{"ref":"router/src/form.rs:379-395","code":"  379 |                     input.get_attribute(\"method\").unwrap_or_else(|| {\n  380 |                         form.get_attribute(\"method\")\n  381 |                             .unwrap_or_else(|| \"get\".to_string())\n  382 |                             .to_lowercase()\n  383 |                     }),\n  384 |                     input.get_attribute(\"action\").unwrap_or_else(|| {\n  385 |                         form.get_attribute(\"action\")\n  386 |                             .unwrap_or_default()\n  387 |                             .to_lowercase()\n  388 |                     }),\n  389 |                     input.get_attribute(\"enctype\").unwrap_or_else(|| {\n  390 |                         form.get_attribute(\"enctype\")\n  391 |                             .unwrap_or_else(|| {\n  392 |                                 \"application/x-www-form-urlencoded\".to_string()\n  393 |                             })\n  394 |                             .to_lowercase()\n  395 |                     }),","lines":17,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/form.rs#L379-L395"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Query/search parameters are percent-decoded twice, corrupting any value that contains a literal\npercent-encoded sequence.\n\nOn the server, `RequestUrl::parse_with_base` builds the search map from `url.query_pairs()`:\n```rust\nlet search_params = url\n    .query_pairs()\n    .map(|(k, v)| (k.to_string(), v.to_string()))\n    .collect::<ParamsMap>();\n```\nThe `url` crate's `query_pairs()` already returns *percent-decoded* keys/values. Collecting into\n`ParamsMap` goes through `FromIterator -> ParamsMap::insert`, and `insert` decodes again:\n```rust\npub fn insert(&mut self, key: impl Into<Cow<'static, str>>, value: String) {\n    let value = Url::unescape(&value);  // percent_decode a second time\n    ...\n}\n```\nThe same double-decode happens on the client: `search_params_from_web_url` reads from\n`web_sys::UrlSearchParams` (already decoded by the browser) and then collects into `ParamsMap`,\ndecoding a second time.\n\nExample: `?name=%2520`. `query_pairs()` yields `name = \"%20\"`; the second `Url::unescape` turns\n`%20` into a space, so `use_query_map()` reports `name = \" \"` instead of `\"%20\"`.\n\nNote the double-decode is correct for *path* params (they arrive raw from the URL slice in\n`ParamSegment`/`WildcardSegment` and legitimately need one decode via `insert`), so the fix should\ntarget the search-param construction sites, not `insert` itself.","fix":"Insert already-decoded search params without re-decoding. Add a crate-internal helper that bypasses\n`Url::unescape`, e.g.:\n```rust\nimpl ParamsMap {\n    /// Inserts a value that is already decoded (used for search params that the\n    /// URL parser / browser has already percent-decoded).\n    pub(crate) fn insert_decoded(&mut self, key: impl Into<Cow<'static, str>>, value: String) {\n        let key = key.into();\n        if let Some(prev) = self.0.iter_mut().find(|(k, _)| k == &key) {\n            prev.1.push(value);\n        } else {\n            self.0.push((key, vec![value]));\n        }\n    }\n}\n```\nand build the search map with it instead of `collect::<ParamsMap>()` in both\n`RequestUrl::parse_with_base` and `search_params_from_web_url`.","locations":[{"ref":"router/src/location/server.rs:36-39","code":"   36 |         let search_params = url\n   37 |             .query_pairs()\n   38 |             .map(|(k, v)| (k.to_string(), v.to_string()))\n   39 |             .collect::<ParamsMap>();","lines":4,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/location/server.rs#L36-L39"},{"ref":"router/src/location/history.rs:276-292","code":"  276 | fn search_params_from_web_url(\n  277 |     params: &web_sys::UrlSearchParams,\n  278 | ) -> Result<ParamsMap, JsValue> {\n  279 |     try_iter(params)?\n  280 |         .into_iter()\n  281 |         .flatten()\n  282 |         .map(|pair| {\n  283 |             pair.and_then(|pair| {\n  284 |                 let row = pair.dyn_into::<Array>()?;\n  285 |                 Ok((\n  286 |                     String::from(row.get(0).dyn_into::<JsString>()?),\n  287 |                     String::from(row.get(1).dyn_into::<JsString>()?),\n  288 |                 ))\n  289 |             })\n  290 |         })\n  291 |         .collect()\n  292 | }","lines":17,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/location/history.rs#L276-L292"},{"ref":"router/src/params.rs:28-37","code":"   28 |     pub fn insert(&mut self, key: impl Into<Cow<'static, str>>, value: String) {\n   29 |         let value = Url::unescape(&value);\n   30 | \n   31 |         let key = key.into();\n   32 |         if let Some(prev) = self.0.iter_mut().find(|(k, _)| k == &key) {\n   33 |             prev.1.push(value);\n   34 |         } else {\n   35 |             self.0.push((key, vec![value]));\n   36 |         }\n   37 |     }","lines":10,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/params.rs#L28-L37"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `reqwest` `ClientRes::has_redirect` impl checks the wrong header. The trait\ndocuments this method as \"Whether the response has the `REDIRECT_HEADER` set\",\nand the browser impl checks `REDIRECT_HEADER` (`\"serverfnredirect\"`):\n\n```rust\n// browser.rs\nfn has_redirect(&self) -> bool {\n    self.0.headers().get(REDIRECT_HEADER).is_some()\n}\n```\n\nBut the reqwest impl checks the standard `Location` header instead:\n\n```rust\n// reqwest.rs\nfn has_redirect(&self) -> bool {\n    self.headers().get(\"Location\").is_some()\n}\n```\n\n`Location` is a normal HTTP header present on essentially every `3xx`/redirect\nresponse and on many `2xx`/`201 Created` responses. In `Http::run_client`\n(`lib.rs`), `has_redirect()` is OR'd into the condition that fires\n`call_redirect_hook(&location)`:\n\n```rust\nif (300..=399).contains(&status) || has_redirect_header {\n    call_redirect_hook(&location);\n}\n```\n\nSo any reqwest-based client (desktop / non-browser) will spuriously invoke the\nredirect hook whenever the server sets a `Location` header, even on a successful\n`200` response that does not carry the server-fn redirect marker. The two client\nbackends thus behave inconsistently for the same response.","fix":"Check the same custom header the browser impl (and the documented contract) use:\n\n```rust\nfn has_redirect(&self) -> bool {\n    use crate::redirect::REDIRECT_HEADER;\n    self.headers().get(REDIRECT_HEADER).is_some()\n}\n```","locations":[{"ref":"server_fn/src/response/reqwest.rs:45-47","code":"   45 |     fn has_redirect(&self) -> bool {\n   46 |         self.headers().get(\"Location\").is_some()\n   47 |     }","lines":3,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/server_fn/src/response/reqwest.rs#L45-L47"},{"ref":"server_fn/src/response/browser.rs:101-103","code":"  101 |     fn has_redirect(&self) -> bool {\n  102 |         self.0.headers().get(REDIRECT_HEADER).is_some()\n  103 |     }","lines":3,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/server_fn/src/response/browser.rs#L101-L103"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`AnyAttribute::rebuild` leaves stale DOM attributes behind when the underlying\nattribute type changes. When the incoming `type_id` differs from the stored state,\nit simply builds fresh state and overwrites `*state`:\n\n```rust\nfn rebuild(self, state: &mut Self::State) {\n    if self.type_id == state.type_id {\n        (self.rebuild)(self.value, state)\n    } else {\n        let new = self.build(&state.el);\n        *state = new;\n    }\n}\n```\n\nThe old `AnyAttributeState` is dropped without removing the attributes/properties\nit applied to the element. Contrast the `Vec<AnyAttribute>` impl, which explicitly\nwalks `old.keys` and calls `set_inner_html(\"\")` / `set_property(UNDEFINED)` /\n`remove_attribute(key)` before rebuilding. So when a single erased attribute at a\ngiven position changes concrete type across a rebuild (e.g. `class` -> `style`, or\na property attribute to a plain attribute), the previously-set key is never\ncleared and lingers on the element, producing incorrect DOM state.","fix":"Remove the old attribute's keys before replacing the state, mirroring the\n`Vec<AnyAttribute>` impl:\n\n```rust\nfn rebuild(self, state: &mut Self::State) {\n    if self.type_id == state.type_id {\n        (self.rebuild)(self.value, state)\n    } else {\n        for key in std::mem::take(&mut state.keys) {\n            match key {\n                NamedAttributeKey::InnerHtml => Rndr::set_inner_html(&state.el, \"\"),\n                NamedAttributeKey::Property(p) => Rndr::set_property(\n                    &state.el, &p, &wasm_bindgen::JsValue::UNDEFINED,\n                ),\n                NamedAttributeKey::Attribute(k) => {\n                    Rndr::remove_attribute(&state.el, &k)\n                }\n            }\n        }\n        *state = self.build(&state.el);\n    }\n}\n```","locations":[{"ref":"tachys/src/html/attribute/any_attribute.rs:247-254","code":"  247 |     fn rebuild(self, state: &mut Self::State) {\n  248 |         if self.type_id == state.type_id {\n  249 |             (self.rebuild)(self.value, state)\n  250 |         } else {\n  251 |             let new = self.build(&state.el);\n  252 |             *state = new;\n  253 |         }\n  254 |     }","lines":8,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/attribute/any_attribute.rs#L247-L254"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`<textarea>` is declared with `ESCAPE_CHILDREN = false`:\n\n```rust\ntextarea HtmlTextAreaElement [...] false,\n```\n\nUnlike `<script>`/`<style>` (genuine RAWTEXT, where escaping must be suppressed), `<textarea>` is an RCDATA element:\nper the HTML serialization algorithm its text content **must** be escaped (`&` -> `&amp;`, `<` -> `&lt;`). Note that\n`<title>`, also RCDATA, is correctly declared `true` on line 416, so the two are inconsistent. Setting\n`ESCAPE_CHILDREN = false` means text children of a `<textarea>` are written to the SSR buffer raw (the `escape`\nargument is threaded straight into the child text node's `to_html_with_buf`). A child value such as\n`<\/textarea><script>alert(1)<\/script>` breaks out of the textarea and injects markup, and even benign values\ncontaining `&`/`<` render incorrectly.\n\nSecondarily, because element hydration skips children when `!E::ESCAPE_CHILDREN`\n(`tachys/src/html/element/mod.rs:556` and `:627`), a reactive text child of a `<textarea>` is never hydrated and\nwill not update on the client.","fix":"Escape `<textarea>` children like every other non-RAWTEXT element (matching `<title>`):\n\n```rust\ntextarea HtmlTextAreaElement [autocomplete, cols, dirname, disabled, form, maxlength, minlength, name, placeholder, readonly, required, rows, wrap] true,\n```","locations":[{"ref":"tachys/src/html/element/elements.rs:406","code":"  406 |     textarea HtmlTextAreaElement [autocomplete, cols, dirname, disabled, form, maxlength, minlength, name, placeholder, readonly, required, rows, wrap] false,","lines":1,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/element/elements.rs#L406"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`HtmlElement::rebuild` tries to detect whether a *custom* element's tag changed (only for `E::TAG.is_empty()`, i.e.\nelements created via `custom(...)`) by comparing the new tag name to the live DOM node's tag name:\n\n```rust\nlet new_tag = self.tag.tag();          // e.g. \"my-element\" (as the user wrote it)\nlet old_tag = state.el.tag_name();     // web_sys Element::tag_name() -> \"MY-ELEMENT\"\nif new_tag != old_tag {\n    // destroy + recreate the element\n}\n```\n\n`web_sys::Element::tag_name()` returns the tag name **upper-cased** for HTML documents (confirmed elsewhere in this\ncrate: `tachys/src/reactive_graph/bind.rs:519` compares `self.tag_name() == \"SELECT\"`). `Custom::tag()` returns the\nuser-provided string verbatim, which is normally lower-case (`\"my-element\"`). The comparison `new_tag != old_tag` is\ntherefore effectively **always true** for custom elements, so every reactive `rebuild` tears down and recreates the\nDOM node even when the tag never changed. This defeats the guard entirely: it drops all event listeners, loses\nfocus/scroll/form/web-component internal state, and re-runs `build` on each update. The intended behavior (recreate\nonly when the tag actually changes) never happens.","fix":"Compare case-insensitively:\n\n```rust\nlet new_tag = self.tag.tag();\nlet old_tag = state.el.tag_name();\nif !new_tag.eq_ignore_ascii_case(&old_tag) {\n    let mut new_state = self.build();\n    state.insert_before_this(&mut new_state);\n    state.unmount();\n    *state = new_state;\n    return;\n}\n```","locations":[{"ref":"tachys/src/html/element/mod.rs:322-337","code":"  322 |         // the compiler should be able to optimize it out\n  323 |         if E::TAG.is_empty() {\n  324 |             // see https://github.com/leptos-rs/leptos/issues/4412\n  325 |             let new_tag = self.tag.tag();\n  326 | \n  327 |             // this is not particularly efficient, but it saves us from\n  328 |             // having to keep track of the tag name for every element state\n  329 |             let old_tag = state.el.tag_name();\n  330 |             if new_tag != old_tag {\n  331 |                 let mut new_state = self.build();\n  332 |                 state.insert_before_this(&mut new_state);\n  333 |                 state.unmount();\n  334 |                 *state = new_state;\n  335 |                 return;\n  336 |             }\n  337 |         }","lines":16,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/element/mod.rs#L322-L337"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `IntoStyle for (K, V)`, the `rebuild` method never writes the new style-property\nname back into the retained state. `state.1` holds the previous name `K`, and when the\nname changes the code calls `reset` (which removes the property under the *old* name) and\nrebuilds under the new name, but leaves `state.1` pointing at the *original* name:\n\n```rust\nfn rebuild(self, state: &mut Self::State) {\n    let (name, value) = self;\n    // state.1 was the previous name, theoretically the css name could be changed:\n    if name.as_ref() != state.1.as_ref() {\n        <Self as IntoStyle>::reset(state);\n        state.2 = value.build(&state.0, name.as_ref());\n        // BUG: state.1 is never updated to `name`\n    } else {\n        value.rebuild(&state.0, name.as_ref(), &mut state.2);\n    }\n}\n```\n\nBecause `<Self as IntoStyle>::reset` removes the property named `state.1` (line 527-530),\nafter the *second* name change the property applied under the *first* changed name is\nnever removed and remains orphaned on the element. Example: name goes `\"color\"` ->\n`\"background\"` -> `\"font-size\"`. On the `\"background\"` step `\"color\"` is removed correctly,\nbut `state.1` stays `\"color\"`. On the `\"font-size\"` step `reset` again removes `\"color\"`\n(a no-op) instead of the currently-applied `\"background\"`, so `\"background\"` is left set\non the element. It also forces a full `build` on every subsequent rebuild because\n`name != state.1` keeps comparing against the stale original name.","fix":"Update the stored name whenever it changes:\n\n```rust\nfn rebuild(self, state: &mut Self::State) {\n    let (name, value) = self;\n    if name.as_ref() != state.1.as_ref() {\n        <Self as IntoStyle>::reset(state);\n        state.2 = value.build(&state.0, name.as_ref());\n        state.1 = name; // keep the retained name in sync\n    } else {\n        value.rebuild(&state.0, name.as_ref(), &mut state.2);\n    }\n}\n```","locations":[{"ref":"tachys/src/html/style.rs:499-508","code":"  499 |     fn rebuild(self, state: &mut Self::State) {\n  500 |         let (name, value) = self;\n  501 |         // state.1 was the previous name, theoretically the css name could be changed:\n  502 |         if name.as_ref() != state.1.as_ref() {\n  503 |             <Self as IntoStyle>::reset(state);\n  504 |             state.2 = value.build(&state.0, name.as_ref());\n  505 |         } else {\n  506 |             value.rebuild(&state.0, name.as_ref(), &mut state.2);\n  507 |         }\n  508 |     }","lines":10,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/style.rs#L499-L508"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"In `StreamBuilder::poll_next`, when an out-of-order chunk resolves, its inner chunks are consumed with `chunks.into_iter().rev()` and any `StreamChunk::Sync(ready)` is appended to the output buffer *inside that reversed iteration*. This reverses the order of the synchronous pieces whenever a resolved OOO chunk contains more than one `Sync` chunk (which happens as soon as the suspended view itself contains a nested out-of-order / async boundary, e.g. chunks `[Sync(\"<div>\"), OutOfOrder(..), Sync(\"<\/div>\")]`).\n\nPlaceholder-found branch:\n```rust\nlet chunks_iter = chunks.into_iter().rev();\n...\nfor chunk in chunks_iter {\n    if let StreamChunk::Sync(ready) = chunk {\n        buf.push_str(&ready);      // appended in REVERSED order\n    } else {\n        held_chunks.push_front(chunk);\n    }\n}\n```\n\nThe `else`/no-placeholder branch (lines 438-446) has the same reversed loop writing into `this.sync_buf` between `push_start`/`push_end`. The reversal is only correct for the non-`Sync` chunks that are re-queued with `push_front`; appending `Sync` content in reverse corrupts the emitted HTML (e.g. produces `<\/div><div>`).","fix":"Iterate the resolved chunks in forward order for the `Sync` content, and only reverse the deferred (non-`Sync`) chunks that are re-pushed to the front of the queue:\n\n```rust\nlet mut deferred = Vec::new();\nbuf.push_str(before);\nfor chunk in chunks {                 // forward order\n    if let StreamChunk::Sync(ready) = chunk {\n        buf.push_str(&ready);\n    } else {\n        deferred.push(chunk);\n    }\n}\nbuf.push_str(after);\nthis.sync_buf = buf;\nfor chunk in deferred.into_iter().rev() {\n    this.chunks.push_front(chunk);\n}\n```\n\nApply the same forward-sync / reversed-defer split in the no-placeholder `<template>` branch.","locations":[{"ref":"tachys/src/ssr/mod.rs:406-432","code":"  406 |                                         let chunks_iter =\n  407 |                                             chunks.into_iter().rev();\n  408 | \n  409 |                                         // TODO can probably make this more efficient\n  410 |                                         let (before, replaced) =\n  411 |                                             this.sync_buf.split_at(start);\n  412 |                                         let (_, after) = replaced.split_at(\n  413 |                                             end - start + closing.len(),\n  414 |                                         );\n  415 |                                         let mut buf = String::new();\n  416 |                                         buf.push_str(before);\n  417 | \n  418 |                                         let mut held_chunks = VecDeque::new();\n  419 |                                         for chunk in chunks_iter {\n  420 |                                             if let StreamChunk::Sync(ready) =\n  421 |                                                 chunk\n  422 |                                             {\n  423 |                                                 buf.push_str(&ready);\n  424 |                                             } else {\n  425 |                                                 held_chunks.push_front(chunk);\n  426 |                                             }\n  427 |                                         }\n  428 |                                         buf.push_str(after);\n  429 |                                         this.sync_buf = buf;\n  430 |                                         for chunk in held_chunks {\n  431 |                                             this.chunks.push_front(chunk);\n  432 |                                         }","lines":27,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/ssr/mod.rs#L406-L432"},{"ref":"tachys/src/ssr/mod.rs:434-453","code":"  434 |                                         OooChunk::push_start(\n  435 |                                             &id,\n  436 |                                             &mut this.sync_buf,\n  437 |                                         );\n  438 |                                         for chunk in chunks.into_iter().rev() {\n  439 |                                             if let StreamChunk::Sync(ready) =\n  440 |                                                 chunk\n  441 |                                             {\n  442 |                                                 this.sync_buf.push_str(&ready);\n  443 |                                             } else {\n  444 |                                                 this.chunks.push_front(chunk);\n  445 |                                             }\n  446 |                                         }\n  447 |                                         OooChunk::push_end_with_nonce(\n  448 |                                             replace,\n  449 |                                             &id,\n  450 |                                             &mut this.sync_buf,\n  451 |                                             nonce.as_deref(),\n  452 |                                         );\n  453 |                                     }","lines":20,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/ssr/mod.rs#L434-L453"}]},{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`<&str as RenderHtml>::to_html_with_buf` only emits a placeholder text node for an\nempty string when `escape == true`:\n\n```rust\nif self.is_empty() && escape {\n    buf.push(' ');\n} else if escape {\n    let escaped = html_escape::encode_text(self);\n    buf.push_str(&escaped);\n} else {\n    buf.push_str(self);   // empty string => pushes nothing at all\n}\n```\n\nWhen `escape == false` and the string is empty, the `else` branch pushes the empty\nstring, so **no** text node (and no `<!>` marker) is emitted into the HTML. This is\nnot a purely theoretical case: elements `textarea`, `script`, `style` and `noscript`\nset `ESCAPE_CHILDREN = false` (see `tachys/src/html/element/elements.rs:342,374,390,406`),\nso a dynamic empty string child such as `<textarea>{some_empty_string}<\/textarea>`\nrenders with `escape == false`.\n\nOn hydration, `<&str>::hydrate` unconditionally walks the cursor and *requires* a text\nnode:\n\n```rust\nlet node = cursor.current();\nlet node = crate::renderer::types::Text::cast_from(node.clone())\n    .unwrap_or_else(|| {\n        crate::hydration::failed_to_cast_text_node(node)\n    });\n```\n\nBecause SSR produced no text node, the cursor lands on the wrong node and\n`failed_to_cast_text_node` is hit (hydration failure / panic). The `escape == true`\npath is immune only because it inserts a space placeholder. The two paths are\ninconsistent for the empty-string case.","fix":"Emit a placeholder text node for the empty string regardless of `escape`, so SSR and\nhydration agree that a text node exists:\n\n```rust\nif self.is_empty() {\n    // browsers drop empty text nodes; emit a placeholder so hydration finds one,\n    // in both escaping and raw-text (textarea/script/style) contexts\n    buf.push(' ');\n} else if escape {\n    let escaped = html_escape::encode_text(self);\n    buf.push_str(&escaped);\n} else {\n    buf.push_str(self);\n}\n```\n\n(Note the space becomes the textarea's value; if that is undesirable the alternative is\nto make `hydrate` tolerant of a missing text node, but the two sides must be made\nconsistent either way.)","locations":[{"ref":"tachys/src/view/strings.rs:68-77","code":"   68 |         if self.is_empty() && escape {\n   69 |             buf.push(' ');\n   70 |         } else if escape {\n   71 |             let escaped = html_escape::encode_text(self);\n   72 |             buf.push_str(&escaped);\n   73 |         } else {\n   74 |             buf.push_str(self);\n   75 |         }\n   76 |         *position = Position::NextChildAfterText;\n   77 |     }","lines":10,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/strings.rs#L68-L77"},{"ref":"tachys/src/view/strings.rs:95-99","code":"   95 |         let node = cursor.current();\n   96 |         let node = crate::renderer::types::Text::cast_from(node.clone())\n   97 |             .unwrap_or_else(|| {\n   98 |                 crate::hydration::failed_to_cast_text_node(node)\n   99 |             });","lines":5,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/strings.rs#L95-L99"}]},{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`submitToReq(ev)` calls `event.preventDefault();` referring to the deprecated,\nnon-standard implicit global `event` instead of the `ev` parameter it was given.\nThis only happens to work because `window.event` is set during the synchronous part\nof event dispatch in Chromium/Firefox; in engines where `window.event` is undefined\nit throws `TypeError: Cannot read properties of undefined`. It is also redundant:\nthe `submit` listener already calls `ev.preventDefault()` after `submitToReq`\nreturns.","fix":"Use the parameter: `ev.preventDefault();` (or delete the line, since the caller already prevents default).","locations":[{"ref":"leptos/src/hydration/islands_routing.js:122-123","code":"  122 | function submitToReq(ev) {\n  123 | \tevent.preventDefault();","lines":2,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos/src/hydration/islands_routing.js#L122-L123"}]},{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`HydrationScripts` caches the wasm-split manifest in a process-global\n`static SPLIT_MANIFEST: OnceLock<Option<WasmSplitManifest>>` via `get_or_init`. The\ninitializer closure depends on the per-render `root` prop and on `options`\n(`site_root`, `site_pkg_dir`, `hash_files`, etc.) — e.g. it stores\n`format!(\"{root}/{pkg_dir}\")`. Because `OnceLock` only runs the initializer once\nfor the whole process, the *first* request's `root`/`options` are baked in forever;\nany later render with a different `root` or config silently reuses the first one.\nIt also permanently caches `None` if the manifest file was not yet readable on the\nfirst call.","fix":"Key the cache on the inputs that affect it (or drop the global cache and read/parse\nthe manifest per render, which happens rarely). At minimum document that `root` and\n`options` must be identical for the lifetime of the process.","locations":[{"ref":"leptos/src/hydration/mod.rs:62-123","code":"   62 |     static SPLIT_MANIFEST: OnceLock<Option<WasmSplitManifest>> =\n   63 |         OnceLock::new();\n   64 | \n   65 |     if let Some(splits) = SPLIT_MANIFEST.get_or_init(|| {\n   66 |         let root = root.clone().unwrap_or_default();\n   67 | \n   68 |         let (wasm_split_js, wasm_split_manifest) = if options.hash_files {\n   69 |             let hash_path = std::env::current_exe()\n   70 |                 .map(|path| {\n   71 |                     path.parent().map(|p| p.to_path_buf()).unwrap_or_default()\n   72 |                 })\n   73 |                 .unwrap_or_default()\n   74 |                 .join(options.hash_file.as_ref());\n   75 |             let hashes = std::fs::read_to_string(&hash_path)\n   76 |                 .expect(\"failed to read hash file\");\n   77 | \n   78 |             let mut split =\n   79 |                 \"__wasm_split.______________________.js\".to_string();\n   80 |             let mut manifest = \"__wasm_split_manifest.json\".to_string();\n   81 |             for line in hashes.lines() {\n   82 |                 let line = line.trim();\n   83 |                 if !line.is_empty() {\n   84 |                     if let Some((file, hash)) = line.split_once(':') {\n   85 |                         if file == \"manifest\" {\n   86 |                             manifest.clear();\n   87 |                             manifest.push_str(\"__wasm_split_manifest.\");\n   88 |                             manifest.push_str(hash.trim());\n   89 |                             manifest.push_str(\".json\");\n   90 |                         }\n   91 |                         if file == \"split\" {\n   92 |                             split.clear();\n   93 |                             split.push_str(\"__wasm_split.\");\n   94 |                             split.push_str(hash.trim());\n   95 |                             split.push_str(\".js\");\n   96 |                         }\n   97 |                     }\n   98 |                 }\n   99 |             }\n  100 |             (split, manifest)\n  101 |         } else {\n  102 |             (\n  103 |                 \"__wasm_split.______________________.js\".to_string(),\n  104 |                 \"__wasm_split_manifest.json\".to_string(),\n  105 |             )\n  106 |         };\n  107 | \n  108 |         let site_dir = &options.site_root;\n  109 |         let pkg_dir = &options.site_pkg_dir;\n  110 |         let path = PathBuf::from(site_dir.to_string());\n  111 |         let path = path.join(pkg_dir.to_string()).join(wasm_split_manifest);\n  112 |         let file = std::fs::read_to_string(path).ok()?;\n  113 | \n  114 |         let manifest = WasmSplitManifest(ArcStoredValue::new((\n  115 |             format!(\"{root}/{pkg_dir}\"),\n  116 |             serde_json::from_str(&file).expect(\"could not read manifest file\"),\n  117 |             wasm_split_js,\n  118 |         )));\n  119 | \n  120 |         Some(manifest)\n  121 |     }) {\n  122 |         provide_context(splits.clone());\n  123 |     }","lines":62,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos/src/hydration/mod.rs#L62-L123"}]},{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The two adjacent preload links in `HydrationScripts` handle the same `nonce` value\ninconsistently. The `modulepreload` link uses `crossorigin=nonce.clone()` (an\n`Option`, so the attribute is omitted when `None`), while the wasm `preload` link\nuses `crossorigin=nonce.clone().unwrap_or_default()` (a `String`, so it emits\n`crossorigin=\"\"` when `None`). Beyond the inconsistency, putting a CSP *nonce*\ninto the `crossorigin` attribute is semantically wrong — `crossorigin` is a CORS\nmode (`anonymous`/`use-credentials`), not a place for a nonce.","fix":"Handle both links identically and stop routing the nonce into `crossorigin`. Use the\nproper CORS value for `crossorigin` (or omit it) and, if a nonce is desired on the\ntags, use a real `nonce=` attribute.","locations":[{"ref":"leptos/src/hydration/mod.rs:178-186","code":"  178 |     view! {\n  179 |         <link rel=\"modulepreload\" href=format!(\"{root}/{pkg_path}/{js_file_name}.js\") crossorigin=nonce.clone()/>\n  180 |         <link\n  181 |             rel=\"preload\"\n  182 |             href=format!(\"{root}/{pkg_path}/{wasm_file_name}.wasm\")\n  183 |             r#as=\"fetch\"\n  184 |             r#type=\"application/wasm\"\n  185 |             crossorigin=nonce.clone().unwrap_or_default()\n  186 |         />","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos/src/hydration/mod.rs#L178-L186"}]},{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`View<T>` derives `PartialEq, Eq, Hash, PartialOrd, Ord` but carries an extra field\n`view_marker: Option<Cow<'static, str>>` only under `#[cfg(debug_assertions)]`.\nDerived comparison/hash/order implementations include every field that exists in\nthat build, so `View` equality, hashing and ordering differ between debug and\nrelease: two views with equal `inner` but different `view_marker` compare unequal in\ndebug yet equal in release. Any code that relies on `View` equality/hashing (e.g. in\ncaches or keyed structures) will behave differently depending on build profile.","fix":"Do not derive these traits over a conditionally-present field. Either exclude\n`view_marker` from the comparison (hand-written impls that only consider `inner`) or\ngate the derives so both builds behave identically.","locations":[{"ref":"leptos/src/into_view.rs:13-21","code":"   13 | #[derive(Debug, Clone, PartialEq, Eq, Hash, PartialOrd, Ord)]\n   14 | pub struct View<T>\n   15 | where\n   16 |     T: Sized,\n   17 | {\n   18 |     inner: T,\n   19 |     #[cfg(debug_assertions)]\n   20 |     view_marker: Option<Cow<'static, str>>,\n   21 | }","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos/src/into_view.rs#L13-L21"}]},{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `hydrate_from` and `hydrate_from_async` the debug-only warning that tells the\nuser they forgot to enable the `hydrate` feature can never fire. Both functions are\nthemselves gated on `#[cfg(feature = \"hydrate\")]`, yet the guard is\n`if !cfg!(feature = \"hydrate\") && FIRST_CALL.get()`. Inside a `hydrate`-gated\nfunction `!cfg!(feature = \"hydrate\")` is always `false`, so the whole warning block\nis dead. The equivalent guards in `mount_to` (checking `!cfg!(feature = \"csr\")`)\nwork because `mount_to` is not feature-gated; these two were copy-pasted without\nadjusting the condition, defeating the diagnostic entirely.","fix":"The `hydrate` functions are only compiled when the feature is on, so the intended\nwarning belongs on a *non-hydrate* fallback definition of these functions (as is\ndone for CSR/`mount_to`). Either provide `#[cfg(not(feature = \"hydrate\"))]`\nvariants that emit the warning, or remove the always-false dead block.","locations":[{"ref":"leptos/src/mount.rs:71-84","code":"   71 |
