<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}

.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}

.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}

.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}

mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`ReadSignal::try_read_untracked` and `RwSignal::try_read_untracked` call the\n*panicking* `read_untracked()` on the inner `ArcReadSignal`/`ArcRwSignal`\ninstead of the fallible `try_read_untracked()`, which defeats the `try_`\ncontract and turns a graceful `None` into a panic.\n\nIn `read.rs`:\n```rust\nfn try_read_untracked(&self) -> Option<Self::Value> {\n    self.inner\n        .try_get_value()\n        .map(|inner| inner.read_untracked()) // <-- panics on None\n}\n```\n`ArcReadSignal::try_read_untracked` is backed by `Plain::try_new`, which uses\n`ArcRwLockReadGuardian::try_take(...)?.ok()`. That returns `None` in two\nlegitimate cases: (1) the value `RwLock` is momentarily *write-locked by\nanother thread* (`try_take` is non-blocking), and (2) the value `RwLock` is\n*poisoned*. In both cases `ArcReadSignal::try_read_untracked()` returns `None`,\nbut the `.map(|inner| inner.read_untracked())` here re-invokes the default\n`read_untracked()` (`traits.rs`), which does\n`self.try_read_untracked().unwrap_or_else(unwrap_signal!(self))` and therefore\n`panic!`s with a misleading \"reactive value ... has already been disposed\"\nmessage.\n\nNet effect: any `get()`/`read()`/`with()` on an arena `ReadSignal`/`RwSignal`\n(these all flow through `try_read_untracked`) will **panic** when the same\nsignal is being concurrently written from another thread, or when the value\nlock has been poisoned by a prior panic - even though the reference-counted\nequivalents (`ArcReadSignal`/`ArcRwSignal`) correctly return `None`. This\ndirectly contradicts the crate's poison-resilience design (`or_poisoned` is\nused elsewhere) and the documented fallibility of the `try_` methods.","fix":"Use the fallible inner method and propagate `None`:\n```rust\n// read.rs\nfn try_read_untracked(&self) -> Option<Self::Value> {\n    self.inner\n        .try_get_value()\n        .and_then(|inner| inner.try_read_untracked())\n}\n\n// rw.rs\nfn try_read_untracked(&self) -> Option<Self::Value> {\n    self.inner\n        .try_get_value()\n        .and_then(|inner| inner.try_read_untracked())\n}\n```","locations":[{"ref":"reactive_graph/src/signal/read.rs:157-162","code":"  157 |     fn try_read_untracked(&self) -> Option<Self::Value> {\n  158 |         self.inner\n  159 |             .try_get_value()\n  160 |             .map(|inner| inner.read_untracked())\n  161 |     }\n  162 | }","lines":6,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/signal/read.rs#L157-L162"},{"ref":"reactive_graph/src/signal/rw.rs:348-353","code":"  348 |     fn try_read_untracked(&self) -> Option<Self::Value> {\n  349 |         self.inner\n  350 |             .try_get_value()\n  351 |             .map(|inner| inner.read_untracked())\n  352 |     }\n  353 | }","lines":6,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/signal/rw.rs#L348-L353"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Server-side panic on malformed multipart requests. In the `FromReq` impl for\n`MultipartFormData`, the boundary is extracted from the untrusted `Content-Type`\nheader and unwrapped with `.expect(\"couldn't parse boundary\")`:\n\n```rust\nlet boundary = req\n    .to_content_type()\n    .and_then(|ct| multer::parse_boundary(ct).ok())\n    .expect(\"couldn't parse boundary\");\n```\n\n`req.to_content_type()` returns the raw client-supplied header. Any request that\nreaches a multipart server function with a missing `Content-Type`, or one whose\nvalue is not a valid `multipart/*; boundary=...` (e.g. `Content-Type: text/plain`,\nor a truncated boundary), makes `parse_boundary` return `None`/`Err`, so `.expect`\npanics. Because this is a network trust boundary reachable by any HTTP client, a\nsingle crafted request aborts the request task (and on some runtimes can abort the\nworker), a trivially exploitable denial-of-service.","fix":"Return an application error instead of panicking:\n\n```rust\nasync fn from_req(req: Request) -> Result<Self, E> {\n    let boundary = req\n        .to_content_type()\n        .and_then(|ct| multer::parse_boundary(ct).ok())\n        .ok_or_else(|| {\n            ServerFnErrorErr::Args(\n                \"missing or invalid multipart boundary in Content-Type header\"\n                    .to_string(),\n            )\n            .into_app_error()\n        })?;\n    let stream = req.try_into_stream()?;\n    let data = multer::Multipart::new(\n        stream.map(|data| data.map_err(|e| ServerFnErrorWrapper(E::de(e)))),\n        boundary,\n    );\n    Ok(MultipartData::Server(data).into())\n}\n```","locations":[{"ref":"server_fn/src/codec/multipart.rs:84-96","code":"   84 |     async fn from_req(req: Request) -> Result<Self, E> {\n   85 |         let boundary = req\n   86 |             .to_content_type()\n   87 |             .and_then(|ct| multer::parse_boundary(ct).ok())\n   88 |             .expect(\"couldn't parse boundary\");\n   89 |         let stream = req.try_into_stream()?;\n   90 |         let data = multer::Multipart::new(\n   91 |             stream.map(|data| data.map_err(|e| ServerFnErrorWrapper(E::de(e)))),\n   92 |             boundary,\n   93 |         );\n   94 |         Ok(MultipartData::Server(data).into())\n   95 |     }\n   96 | }","lines":13,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/server_fn/src/codec/multipart.rs#L84-L96"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`SharedContext::await_data` is implemented as `todo!()` in both the CSR\n(`CsrSharedContext`) and hydration (`HydrateSharedContext`) shared contexts.\n`todo!()` panics if the method is ever invoked. The trait documentation states\nthat on the client this \"should return a `Future` that is immediately ready with\n`None`\", and the SSR implementation correctly returns `None`; only the two\nbrowser implementations panic. Any code path that calls `await_data` during\nclient-side rendering or hydration will crash rather than degrade gracefully.","fix":"Return `None` (matching the documented client-side contract and the SSR\nimplementation) instead of `todo!()` in both `CsrSharedContext::await_data` and\n`HydrateSharedContext::await_data`.","locations":[{"ref":"hydration_context/src/csr.rs:27-30","code":"   27 |     #[inline(always)]\n   28 |     fn await_data(&self, _id: &SerializedDataId) -> Option<String> {\n   29 |         todo!()\n   30 |     }","lines":4,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/hydration_context/src/csr.rs#L27-L30"},{"ref":"hydration_context/src/hydrate.rs:137-139","code":"  137 |     fn await_data(&self, _id: &SerializedDataId) -> Option<String> {\n  138 |         todo!()\n  139 |     }","lines":3,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/hydration_context/src/hydrate.rs#L137-L139"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`StaticPath::into_paths` panics with `todo!()` if a route contains an `OptionalParam` segment while\ngenerating static paths:\n```rust\nOptionalParam(_) => todo!(),\n```\nAny statically-rendered route (`SsrMode::Static`) whose path uses `path!(\"/:x?\")` /\n`OptionalParamSegment` will abort the whole static-generation pass with a panic. Since optional\nparams are a supported routing feature, this is an unhandled combination rather than a truly\nimpossible state.","fix":"Expand optional params the same way `ExpandOptionals` does for matching - emit both the present and\nabsent variants - instead of panicking:\n```rust\nOptionalParam(name) => {\n    let mut new_paths = Vec::new();\n    for path in &paths {\n        // variant where the optional param is absent\n        new_paths.push(path.clone());\n        // variant(s) where it is present\n        if let Some(params) = params.as_ref().and_then(|p| p.get(name)) {\n            for val in params {\n                let sep = if val.starts_with('/') { \"\" } else { \"/\" };\n                new_paths.push(ResolvedStaticPath {\n                    path: format!(\"{}{sep}{val}\", path.path),\n                });\n            }\n        }\n    }\n    paths = new_paths;\n}\n```","locations":[{"ref":"router/src/static_routes.rs:262","code":"  262 |                 OptionalParam(_) => todo!(),","lines":1,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/static_routes.rs#L262"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`impl_attr_for_tuples_truncate_additional!` (used for the 26-element attribute tuple `(A, B, ..., Z)`) implements\n`NextAttribute::add_any_attr` with a `todo!(...)` body:\n\n```rust\ntype Output<NewAttr: Attribute> = ($first, $($ty,)*);\n\nfn add_any_attr<NewAttr: Attribute>(\n    self,\n    _new_attr: NewAttr,\n) -> Self::Output<NewAttr> {\n    todo!(\"adding more than 26 attributes is not supported\");\n    //($first, $($ty,)*)\n}\n```\n\nThe `Output` type already discards `NewAttr` (it is the same 26-tuple), so the intent was clearly to silently\n*truncate* the 27th attribute. Instead the code panics at runtime. Adding a 27th attribute to a single element\n(e.g. many `class:`/`style:`/`aria-*` combinations produced by the `view!` macro) compiles fine but panics as soon\nas `add_any_attr` runs. Because it is `todo!`, the panic message is a generic `not yet implemented`, not the string\nargument. This is a hard runtime abort in otherwise valid user code.","fix":"Either return the truncated tuple (matching the `Output` type, which already drops the new attribute) so that no\npanic occurs:\n\n```rust\nfn add_any_attr<NewAttr: Attribute>(\n    self,\n    _new_attr: NewAttr,\n) -> Self::Output<NewAttr> {\n    // more than 26 attributes are not supported: silently drop the extra one\n    self\n}\n```\n\nor, better, turn it into a compile-time error (e.g. via a `const { assert!(...) }` / a trait bound) so the limit is\nenforced at build time instead of aborting the running program.","locations":[{"ref":"tachys/src/html/attribute/mod.rs:513-525","code":"  513 |             $($ty: Attribute),*,\n  514 | \n  515 |         {\n  516 |             type Output<NewAttr: Attribute> = ($first, $($ty,)*);\n  517 | \n  518 |             fn add_any_attr<NewAttr: Attribute>(\n  519 |                 self,\n  520 |                 _new_attr: NewAttr,\n  521 |             ) -> Self::Output<NewAttr> {\n  522 |                 todo!(\"adding more than 26 attributes is not supported\");\n  523 |                 //($first, $($ty,)*)\n  524 |             }\n  525 |         }","lines":13,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/attribute/mod.rs#L513-L525"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`NodeRef::on_load` unwraps the once-callback unconditionally inside a reactive `Effect`:\n\n```rust\nlet f = Cell::new(Some(f));\nEffect::new(move |_| {\n    if let Some(node_ref) = self.get() {\n        let f = f.take().unwrap();   // panics on the second Some\n        untrack(move || { f(node_ref); });\n    }\n});\n```\n\nThe effect subscribes to the underlying `RwSignal<Option<...>>`. The first time the signal\nbecomes `Some` the callback is taken and run. If the `NodeRef` is loaded a second time\n(e.g. the element it is attached to is rebuilt/re-created, so `NodeRefContainer::load`\ncalls `self.0.set(Some(..))` again - see `node_ref.rs:91-96`), the effect re-runs with a\n`Some` value and `f.take().unwrap()` panics because the callback was already consumed.","fix":"Only run the callback if it is still present:\n\n```rust\nlet f = Cell::new(Some(f));\nEffect::new(move |_| {\n    if let Some(node_ref) = self.get() {\n        if let Some(f) = f.take() {\n            untrack(move || { f(node_ref); });\n        }\n    }\n});\n```","locations":[{"ref":"tachys/src/reactive_graph/node_ref.rs:46-56","code":"   46 |         let f = Cell::new(Some(f));\n   47 | \n   48 |         Effect::new(move |_| {\n   49 |             if let Some(node_ref) = self.get() {\n   50 |                 let f = f.take().unwrap();\n   51 |                 untrack(move || {\n   52 |                     f(node_ref);\n   53 |                 });\n   54 |             }\n   55 |         });\n   56 |     }","lines":11,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/reactive_graph/node_ref.rs#L46-L56"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`PatchFieldKeyed::patch_field_keyed` for `Vec<T>` can panic with an\nindex-out-of-bounds when the *new* collection contains two items with the same\nkey. `new_keyed` is an `IndexMap<K, (idx, item)>`; when two new items share a key,\n`IndexMap::insert` keeps the first position but the stored `idx` values become\nnon-contiguous. The loop then does:\n```rust\nfor (key, (new_idx, new_value)) in new_keyed {\n    ...\n    new.push(old_value);\n    let field_to_patch = &mut new[new_idx];   // new_idx can exceed new.len()-1\n    ...\n}\n```\nIt assumes `new_idx == new.len() - 1` after each `push`, which only holds when the\nnew keys are unique and contiguous. With duplicate keys, `new_idx` can be larger\nthan the number of pushes performed so far, indexing past the end of `new` and\npanicking. (`new.push(new_value)` in the `None` arm has the same latent\nmismatch.) Duplicate keys are user error, but the failure mode is a hard panic\nrather than a graceful skip.","fix":"Track the actual push position instead of trusting `new_idx`, e.g.:\n```rust\nSome((old_idx, old_value)) => {\n    if old_idx != new_idx { has_changed = true; }\n    let pos = new.len();\n    new.push(old_value);\n    let field_to_patch = &mut new[pos];\n    ...\n}\n```\nand, ideally, detect/reject duplicate keys up front.","locations":[{"ref":"reactive_stores/src/patch.rs:356-393","code":"  356 |         for (key, (new_idx, new_value)) in new_keyed {\n  357 |             let old_at_key = old_keyed.remove(&key);\n  358 | \n  359 |             match old_at_key {\n  360 |                 None => {\n  361 |                     // add this item into the new vec\n  362 |                     new.push(new_value);\n  363 | \n  364 |                     // not found in old map, list has changed and will trigger\n  365 |                     has_changed = true;\n  366 |                 }\n  367 |                 // found in old map\n  368 |                 Some((old_idx, old_value)) => {\n  369 |                     // if indices are different, list has changed\n  370 |                     if old_idx != new_idx {\n  371 |                         has_changed = true;\n  372 |                     }\n  373 | \n  374 |                     // if we had an old value for this key, we're actually going to push the *old*\n  375 |                     // value into the vec, and then patch it with the new value; because we're iterating\n  376 |                     // in the new order, it will be at the `new_idx`\n  377 |                     new.push(old_value);\n  378 |                     let field_to_patch = &mut new[new_idx];\n  379 | \n  380 |                     // now we need to actually patch the old item with this key with the new item\n  381 |                     // we do this by calling patch_field(); to get the correct path, we need to get the\n  382 |                     // path to the field at this key\n  383 | \n  384 |                     // we do th\n  385 |                     if let Some(path) = path_at_key(&key) {\n  386 |                         field_to_patch\n  387 |                             .patch_field(new_value, &path, notify, keys);\n  388 |                     } else {\n  389 |                         has_changed = true;\n  390 |                     }\n  391 |                 }\n  392 |             }\n  393 |         }","lines":38,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_stores/src/patch.rs#L356-L393"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"hard","description":"In the optional-route fallback path of `NestedRoute::match_nested`, `segments.test(rematch)` is\nunwrapped and `rematch` is computed with `trim_end_matches`, which strips *all* trailing copies of\nthe pattern rather than a single suffix:\n```rust\nlet rematch = path.trim_end_matches(&format!(\"{matched}{remaining}\"));\nlet new_partial = segments.test(rematch).unwrap();\n```\nTwo problems:\n1. `trim_end_matches(pattern)` removes the pattern repeatedly. If the child's matched text plus the\n   remaining tail happens to appear more than once at the end of `path` (e.g. `path = \"/a/a\"` with\n   `matched+remaining == \"/a\"`), it over-trims to `\"\"`, so the parent's params are re-parsed against\n   the wrong prefix.\n2. When `segments` is a tuple containing a required segment (e.g.\n   `(OptionalParamSegment(\"x\"), StaticSegment(\"bar\"))`, which reports `optional() == true`),\n   re-testing against the trimmed prefix can return `None`, and the `.unwrap()` then panics.\n\nThis only triggers on optional parent routes with a fallback re-match, so it is hard to hit, but it\nis a real panic-on-`None` and an incorrect-suffix bug.","fix":"Strip a single suffix and handle a failed re-test instead of unwrapping:\n```rust\nlet suffix = format!(\"{matched}{remaining}\");\nlet rematch = path.strip_suffix(&suffix).unwrap_or(path);\nif let Some(new_partial) = segments.test(rematch) {\n    params = new_partial.params;\n}\n```","locations":[{"ref":"router/src/matching/nested/mod.rs:257-265","code":"  257 |                             let matched = child\n  258 |                                 .as_ref()\n  259 |                                 .map_or(\"\", Children::Match::as_matched);\n  260 |                             let rematch = path.trim_end_matches(&format!(\n  261 |                                 \"{matched}{remaining}\"\n  262 |                             ));\n  263 |                             let new_partial = segments.test(rematch).unwrap();\n  264 |                             params = new_partial.params;\n  265 |                         }","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/nested/mod.rs#L257-L265"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`FormatType::into_encoded_string` panics on non-UTF-8 bytes for text-format\nencoders:\n\n```rust\nfn into_encoded_string(bytes: Bytes) -> String {\n    match Self::FORMAT_TYPE {\n        Format::Binary => STANDARD_NO_PAD.encode(bytes),\n        Format::Text => String::from_utf8(bytes.into())\n            .expect(\"Valid text format type with utf-8 comptabile string\"),\n    }\n}\n```\n\nThis is invoked from `ServerFnErrorWrapper::<E>::Display` (`error.rs`), which is\nused to render errors for middleware/`throw_error` integration. For any custom\n`FromServerFnError` whose `Encoder` declares `FORMAT_TYPE = Format::Text` but can\nemit bytes that are not valid UTF-8 (e.g. a text-typed wrapper around a binary\npayload), formatting the error panics instead of surfacing it. Note the misspelled\nmessage (\"comptabile\") as well.","fix":"Fall back to a lossy conversion (or base64) instead of panicking:\n\n```rust\nFormat::Text => String::from_utf8(bytes.to_vec())\n    .unwrap_or_else(|e| String::from_utf8_lossy(e.as_bytes()).into_owned()),\n```","locations":[{"ref":"server_fn/src/lib.rs:822-829","code":"  822 |     /// Encodes data into a string.\n  823 |     fn into_encoded_string(bytes: Bytes) -> String {\n  824 |         match Self::FORMAT_TYPE {\n  825 |             Format::Binary => STANDARD_NO_PAD.encode(bytes),\n  826 |             Format::Text => String::from_utf8(bytes.into())\n  827 |                 .expect(\"Valid text format type with utf-8 comptabile string\"),\n  828 |         }\n  829 |     }","lines":8,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/server_fn/src/lib.rs#L822-L829"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`BrowserResponse::try_into_stream` unwraps the JS body, which is nullable. A\n`web_sys`/`gloo` `Response` can have a `null` body (e.g. a `204 No Content`\nresponse, a `HEAD` response, or an opaque response), in which case `self.0.body()`\nreturns `None`:\n\n```rust\nlet stream = ReadableStream::from_raw(self.0.body().unwrap())\n    .into_stream()\n    ...\n```\n\n`.unwrap()` then panics on the client. This is reachable whenever the server (or\nan intermediary) returns a bodyless response to a streaming server function.","fix":"Return an error instead of unwrapping:\n\n```rust\nlet body = self.0.body().ok_or_else(|| {\n    E::from_server_fn_error(ServerFnErrorErr::Deserialization(\n        \"response has no body\".to_string(),\n    ))\n})?;\nlet stream = ReadableStream::from_raw(body).into_stream().map(...);\n```","locations":[{"ref":"server_fn/src/response/browser.rs:60-84","code":"   60 |     fn try_into_stream(\n   61 |         self,\n   62 |     ) -> Result<impl Stream<Item = Result<Bytes, Bytes>> + Send + 'static, E>\n   63 |     {\n   64 |         let stream = ReadableStream::from_raw(self.0.body().unwrap())\n   65 |             .into_stream()\n   66 |             .map(|data| match data {\n   67 |                 Err(e) => {\n   68 |                     web_sys::console::error_1(&e);\n   69 |                     Err(E::from_server_fn_error(ServerFnErrorErr::Request(\n   70 |                         format!(\"{e:?}\"),\n   71 |                     ))\n   72 |                     .ser())\n   73 |                 }\n   74 |                 Ok(data) => {\n   75 |                     let data = data.unchecked_into::<Uint8Array>();\n   76 |                     let mut buf = Vec::new();\n   77 |                     let length = data.length();\n   78 |                     buf.resize(length as usize, 0);\n   79 |                     data.copy_to(&mut buf);\n   80 |                     Ok(Bytes::from(buf))\n   81 |                 }\n   82 |             });\n   83 |         Ok(SendWrapper::new(stream))\n   84 |     }","lines":25,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/server_fn/src/response/browser.rs#L60-L84"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Mountable for Node` has a `todo!()` in `unmount`, which panics if ever invoked:\n\n```rust\nimpl Mountable for Node {\n    fn unmount(&mut self) {\n        todo!()\n    }\n    ...\n}\n```\n\nEvery other `Mountable` DOM impl (`Text`, `Comment`, `Element`) implements `unmount` by\ncalling `self.remove()`. A raw `Node` used as a view state (e.g. via type-erased views)\nthat gets unmounted would hit this landmine and abort the whole WASM instance.","fix":"Provide the same behavior as the other node impls:\n\n```rust\nimpl Mountable for Node {\n    fn unmount(&mut self) {\n        if let Some(parent) = self.parent_node() {\n            let _ = parent.remove_child(self);\n        }\n    }\n    ...\n}\n```","locations":[{"ref":"tachys/src/renderer/dom.rs:612-615","code":"  612 | impl Mountable for Node {\n  613 |     fn unmount(&mut self) {\n  614 |         todo!()\n  615 |     }","lines":4,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/renderer/dom.rs#L612-L615"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`EitherKeepAlive::rebuild` assumes both `state.a` and `state.b` are populated whenever `show_b` toggles, and panics via `unreachable!()` otherwise:\n\n```rust\nmatch (self.show_b, state.showing_b) {\n    (true, false) => match (&mut state.a, &mut state.b) {\n        (Some(a), Some(b)) => { a.insert_before_this(b); a.unmount(); }\n        _ => unreachable!(),\n    },\n    (false, true) => match (&mut state.a, &mut state.b) {\n        (Some(a), Some(b)) => { b.insert_before_this(a); b.unmount(); }\n        _ => unreachable!(),\n    },\n    _ => {}\n}\n```\n\nIf a caller toggles `show_b` to a side whose `Option` was never filled (the struct's `a`/`b` are public `Option`s, and the \"no change\" arms above intentionally leave a side as `None`), this reaches `unreachable!()` and panics rather than degrading gracefully. `Mountable for EitherKeepAliveState` has the same `.expect(\"A/B was not present\")` hazard on `mount`/`unmount`.","fix":"Guard the transitions instead of asserting, e.g.:\n\n```rust\n(true, false) => {\n    if let (Some(a), Some(b)) = (&mut state.a, &mut state.b) {\n        a.insert_before_this(b);\n        a.unmount();\n    }\n}\n(false, true) => {\n    if let (Some(a), Some(b)) = (&mut state.a, &mut state.b) {\n        b.insert_before_this(a);\n        b.unmount();\n    }\n}\n```\n\nand treat a missing side as \"nothing to show\" in the `Mountable` impl.","locations":[{"ref":"tachys/src/view/either.rs:493-511","code":"  493 |         match (self.show_b, state.showing_b) {\n  494 |             // transition from A to B\n  495 |             (true, false) => match (&mut state.a, &mut state.b) {\n  496 |                 (Some(a), Some(b)) => {\n  497 |                     a.insert_before_this(b);\n  498 |                     a.unmount();\n  499 |                 }\n  500 |                 _ => unreachable!(),\n  501 |             },\n  502 |             // transition from B to A\n  503 |             (false, true) => match (&mut state.a, &mut state.b) {\n  504 |                 (Some(a), Some(b)) => {\n  505 |                     b.insert_before_this(a);\n  506 |                     b.unmount();\n  507 |                 }\n  508 |                 _ => unreachable!(),\n  509 |             },\n  510 |             _ => {}\n  511 |         }","lines":19,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/either.rs#L493-L511"},{"ref":"tachys/src/view/either.rs:712-736","code":"  712 |     fn unmount(&mut self) {\n  713 |         if self.showing_b {\n  714 |             self.b.as_mut().expect(\"B was not present\").unmount();\n  715 |         } else {\n  716 |             self.a.as_mut().expect(\"A was not present\").unmount();\n  717 |         }\n  718 |     }\n  719 | \n  720 |     fn mount(\n  721 |         &mut self,\n  722 |         parent: &crate::renderer::types::Element,\n  723 |         marker: Option<&crate::renderer::types::Node>,\n  724 |     ) {\n  725 |         if self.showing_b {\n  726 |             self.b\n  727 |                 .as_mut()\n  728 |                 .expect(\"B was not present\")\n  729 |                 .mount(parent, marker);\n  730 |         } else {\n  731 |             self.a\n  732 |                 .as_mut()\n  733 |                 .expect(\"A was not present\")\n  734 |                 .mount(parent, marker);\n  735 |         }\n  736 |     }","lines":25,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/either.rs#L712-L736"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"hard","description":"`ViewTemplate::add_any_attr` unconditionally panics:\n\n```rust\nfn add_any_attr<NewAttr: Attribute>(self, _attr: NewAttr) -> Self::Output<NewAttr> {\n    panic!(\"AddAnyAttr not supported on ViewTemplate\");\n}\n```\n\n`ViewTemplate<V>` implements `AddAnyAttr` (so it satisfies trait bounds and compiles\ninto any position expecting an attributable view), but calling `add_any_attr` on it is a\nruntime landmine rather than a compile-time error. Any spread/`{..attrs}` or\nhigher-level combinator that routes an attribute into a `ViewTemplate` crashes the app\nat runtime. `Output<SomeNewAttr>` is even declared as `ViewTemplate<V>` (dropping the\nattribute type), which reinforces that the attribute is silently discarded conceptually\nbut violently at runtime.","fix":"Prefer a design that cannot be mis-called at runtime. Either forward the attribute to\nthe wrapped view and re-wrap:\n\n```rust\ntype Output<SomeNewAttr: Attribute> = ViewTemplate<V::Output<SomeNewAttr>>;\n\nfn add_any_attr<NewAttr: Attribute>(self, attr: NewAttr) -> Self::Output<NewAttr>\nwhere\n    Self::Output<NewAttr>: RenderHtml,\n{\n    ViewTemplate { view: self.view.add_any_attr(attr) }\n}\n```\n\nor, if attributes truly cannot be supported, refrain from implementing `AddAnyAttr` so\nthe misuse is caught at compile time. At minimum, document the panic in the method's\ndoc comment.","locations":[{"ref":"tachys/src/view/template.rs:55-68","code":"   55 | impl<V> AddAnyAttr for ViewTemplate<V>\n   56 | where\n   57 |     V: RenderHtml + ToTemplate + 'static,\n   58 |     V::State: Mountable,\n   59 | {\n   60 |     type Output<SomeNewAttr: Attribute> = ViewTemplate<V>;\n   61 | \n   62 |     fn add_any_attr<NewAttr: Attribute>(\n   63 |         self,\n   64 |         _attr: NewAttr,\n   65 |     ) -> Self::Output<NewAttr> {\n   66 |         panic!(\"AddAnyAttr not supported on ViewTemplate\");\n   67 |     }\n   68 | }","lines":14,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/template.rs#L55-L68"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In `ArcOnceResource`/`OnceResourceFuture`, the `suspenses: Arc<RwLock<Vec<SuspenseContext>>>` field is\n**only ever written, never read**. It is pushed to in `try_read_untracked` (line 272) and in\n`OnceResourceFuture::poll` (line 322), but nothing in the crate ever reads or drains the vector.\nWorse, `OnceResourceFuture::poll` pushes a `SuspenseContext` on *every* poll while the resource is\nstill loading:\n```rust\nif let Some(suspense_context) = use_context::<SuspenseContext>() {\n    self.suspenses.write().or_poisoned().push(suspense_context);\n}\n```\nA future polled many times while pending accumulates an unbounded number of `SuspenseContext` clones\nthat are never used or released until the whole resource is dropped. This is both dead state and an\nunbounded-growth retention problem.","fix":"If the `suspenses` collection serves no purpose (nothing consumes it), remove the field and both\npush sites. If it is meant to keep suspense tasks alive, at minimum avoid pushing a duplicate on\nevery poll, e.g. track whether this future has already registered its context, and clear the vector\nonce loading completes.","locations":[{"ref":"leptos_server/src/once_resource.rs:60-60","code":"   60 |     suspenses: Arc<RwLock<Vec<SuspenseContext>>>,","lines":1,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_server/src/once_resource.rs#L60"},{"ref":"leptos_server/src/once_resource.rs:271-276","code":"  271 |                 }\n  272 |                 self.suspenses.write().or_poisoned().push(suspense_context);\n  273 |             }\n  274 |         }\n  275 |         Plain::try_new(Arc::clone(&self.value)).map(ReadGuard::new)\n  276 |     }","lines":6,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_server/src/once_resource.rs#L271-L276"},{"ref":"leptos_server/src/once_resource.rs:300-334","code":"  300 | pub struct OnceResourceFuture<T> {\n  301 |     source: AnySource,\n  302 |     value: Arc<RwLock<Option<T>>>,\n  303 |     loading: Arc<AtomicBool>,\n  304 |     wakers: Arc<RwLock<Vec<Waker>>>,\n  305 |     suspenses: Arc<RwLock<Vec<SuspenseContext>>>,\n  306 | }\n  307 | \n  308 | impl<T> Future for OnceResourceFuture<T>\n  309 | where\n  310 |     T: Clone + 'static,\n  311 | {\n  312 |     type Output = T;\n  313 | \n  314 |     #[track_caller]\n  315 |     fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {\n  316 |         #[cfg(any(debug_assertions, leptos_debuginfo))]\n  317 |         let _guard = SpecialNonReactiveZone::enter();\n  318 |         let waker = cx.waker();\n  319 |         self.source.track();\n  320 | \n  321 |         if let Some(suspense_context) = use_context::<SuspenseContext>() {\n  322 |             self.suspenses.write().or_poisoned().push(suspense_context);\n  323 |         }\n  324 | \n  325 |         if self.loading.load(Ordering::Relaxed) {\n  326 |             self.wakers.write().or_poisoned().push(waker.clone());\n  327 |             Poll::Pending\n  328 |         } else {\n  329 |             Poll::Ready(\n  330 |                 self.value.read().or_poisoned().as_ref().unwrap().clone(),\n  331 |             )\n  332 |         }\n  333 |     }\n  334 | }","lines":35,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_server/src/once_resource.rs#L300-L334"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`connect_to_hot_patch_messages` leaks the source string of *every* incoming\nWebSocket message via `Box::leak(string.into_boxed_str())`, before parsing and\nregardless of whether the message parses, matches the build id, or matches the pid.\nThe comment justifies leaking because `DevserverMsg` borrows `&'static str`, but the\nleak is unconditional and unbounded over the lifetime of the dev session (one leaked\nallocation per received message, including irrelevant/duplicate ones).","fix":"Parse into an owned/`Deserialize`d representation (or only leak when a patch is\nactually going to be applied) so unrelated messages do not permanently leak memory.","locations":[{"ref":"leptos/src/subsecond.rs:35-37","code":"   35 |             // The devserver messages have some &'static strs in them, so we need to leak the source string\n   36 |             let string: String = text.into();\n   37 |             let string = Box::leak(string.into_boxed_str());","lines":3,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos/src/subsecond.rs#L35-L37"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"hard","description":"The generated island hydration function deliberately leaks the mounted view state via `std::mem::forget(state)` (flagged in-source with `// TODO better cleanup`). The hydration `state` (which owns the reactive `Owner`/`OwnedView` and its graph nodes) is never dropped, so every hydrated island permanently leaks its reactive ownership tree. For long-lived pages that repeatedly create/destroy islands this accumulates.\n```rust\nlet state = island.hydrate_from_position::<true>(&el, ::leptos::tachys::view::Position::Current);\n// TODO better cleanup\nstd::mem::forget(state);\n```","fix":"Store the state somewhere it can be disposed on unmount (e.g. attach it to the element/owner and drop it when the island is removed) instead of forgetting it:\n```rust\nlet state = island.hydrate_from_position::<true>(&el, ::leptos::tachys::view::Position::Current);\n::leptos::tachys::html::islands::register_island_state(&el, state);\n```\n(or otherwise tie `state`'s lifetime to the island's DOM lifetime).","locations":[{"ref":"leptos_macro/src/component.rs:538-544","code":"  538 |             let hydrate_fn_inner = quote! {\n  539 |                 #deserialize_island_props\n  540 |                 let island = #name(#island_props);\n  541 |                 let state = island.hydrate_from_position::<true>(&el, ::leptos::tachys::view::Position::Current);\n  542 |                 // TODO better cleanup\n  543 |                 std::mem::forget(state);\n  544 |             };","lines":7,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_macro/src/component.rs#L538-L544"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`SsrSharedContext` derives `Default`, which initializes `non_hydration_id` to\n`0`. The intended constructors `new` and `new_islands` explicitly set\n`non_hydration_id` to `usize::MAX` because `next_id` uses `fetch_sub(1)` for the\nnon-hydrating id space (counting *down* from `usize::MAX` to avoid colliding with\nthe hydrating id space that counts *up* from `0`). If a `SsrSharedContext` is\never created via the derived `Default::default()` instead of `new`, the first\nnon-hydrating `next_id()` returns `0` (colliding with hydration id `0`) and the\ninternal counter wraps to `usize::MAX` on that same call. The public\n`#[derive(Default)]` exposes this footgun.","fix":"Provide a manual `Default` impl that delegates to `new()` (setting\n`non_hydration_id` to `usize::MAX`), or remove the derived `Default` from the\npublic API so callers must go through `new`/`new_islands`.","locations":[{"ref":"hydration_context/src/ssr.rs:26-60","code":"   26 | #[derive(Default)]\n   27 | /// The shared context that should be used on the server side.\n   28 | pub struct SsrSharedContext {\n   29 |     id: AtomicUsize,\n   30 |     non_hydration_id: AtomicUsize,\n   31 |     is_hydrating: AtomicBool,\n   32 |     sync_buf: RwLock<Vec<ResolvedData>>,\n   33 |     async_buf: AsyncDataBuf,\n   34 |     errors: ErrorBuf,\n   35 |     sealed_error_boundaries: SealedErrors,\n   36 |     deferred: Mutex<Vec<PinnedFuture<()>>>,\n   37 |     incomplete: Arc<Mutex<Vec<SerializedDataId>>>,\n   38 | }\n   39 | \n   40 | impl SsrSharedContext {\n   41 |     /// Creates a new shared context for rendering HTML on the server.\n   42 |     pub fn new() -> Self {\n   43 |         Self {\n   44 |             is_hydrating: AtomicBool::new(true),\n   45 |             non_hydration_id: AtomicUsize::new(usize::MAX),\n   46 |             ..Default::default()\n   47 |         }\n   48 |     }\n   49 | \n   50 |     /// Creates a new shared context for rendering HTML on the server in \"islands\" mode.\n   51 |     ///\n   52 |     /// This defaults to a mode in which the app is not hydrated, but allows you to opt into\n   53 |     /// hydration for certain portions using [`SharedContext::set_is_hydrating`].\n   54 |     pub fn new_islands() -> Self {\n   55 |         Self {\n   56 |             is_hydrating: AtomicBool::new(false),\n   57 |             non_hydration_id: AtomicUsize::new(usize::MAX),\n   58 |             ..Default::default()\n   59 |         }\n   60 |     }","lines":35,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/hydration_context/src/ssr.rs#L26-L60"},{"ref":"hydration_context/src/ssr.rs:100-108","code":"  100 |     #[track_caller]\n  101 |     fn next_id(&self) -> SerializedDataId {\n  102 |         let id = if self.get_is_hydrating() {\n  103 |             self.id.fetch_add(1, Ordering::Relaxed)\n  104 |         } else {\n  105 |             self.non_hydration_id.fetch_sub(1, Ordering::Relaxed)\n  106 |         };\n  107 |         SerializedDataId(id)\n  108 |     }","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/hydration_context/src/ssr.rs#L100-L108"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"A `StaticSegment(\"/\")` (or `StaticSegment(\"\")` matched at root) placed *before* another segment in a\nhorizontal tuple causes `matched_len` to double-count the leading `/`, producing an out-of-bounds\nslice `&path[0..matched_len]` and a panic.\n\n`StaticSegment(\"/\")::test` reports `matched = \"/\"` (length 1) but returns `remaining = path`, i.e. it\ndoes *not* consume the `/`:\n```rust\nlet (matched, remaining) = if matched_len == 1 && path.starts_with('/') {\n    (\"/\", path)   // matched claims the '/', remaining still contains it\n} else {\n    path.split_at(matched_len)\n};\n```\nIn the tuple matcher, `matched_len` is accumulated from each segment's `matched.len()`:\n```rust\nmatched_len += m.len();          // counts the '/'\n...\nmatched_len += matched.len();    // next segment re-matches and re-counts the same '/'\n...\nmatched: &path[0..matched_len],  // can exceed path.len()\n```\nFor `(StaticSegment(\"/\"), StaticSegment(\"about\"))` against `\"/about\"`, `matched_len` becomes\n`1 + 6 = 7` while `path.len() == 6`, so `&path[0..7]` panics.\n\nReachability is limited: the `path!` macro only ever emits a bare `\"/\"` segment as the *last*\nelement, so this requires manual segment construction (or a future macro change), which is why the\nseverity is low - but it is a genuine latent index-out-of-bounds panic.","fix":"Compute the matched prefix from the actual consumed length (from `remaining`'s position) rather than\nsumming per-segment `matched.len()`, so a non-consuming `\"/\"` match cannot inflate the count. e.g.:\n```rust\nlet consumed = path.len() - r.len();\nreturn Some(PartialPathMatch {\n    remaining: r,\n    matched: &path[0..consumed],\n    params: p,\n});\n```\nwhich is robust to segments (like `StaticSegment(\"/\")`) that report a `matched` they do not remove\nfrom `remaining`.","locations":[{"ref":"router/src/matching/horizontal/tuples.rs:48-80","code":"   48 | \n   49 |                     matched_len += m.len();\n   50 |                     $(\n   51 |                         if $ty.optional() {\n   52 |                             nth_field += 1;\n   53 |                         }\n   54 |                         if !$ty.optional() || nth_field <= include_optionals {\n   55 |                             let PartialPathMatch {\n   56 |                                 remaining,\n   57 |                                 matched,\n   58 |                                 params\n   59 |                             } = match $ty.test(r) {\n   60 |                                 None => if $ty.optional() {\n   61 |                                     return None;\n   62 |                                 } else {\n   63 |                                     if include_optionals == 0 {\n   64 |                                         return None;\n   65 |                                     }\n   66 |                                     include_optionals -= 1;\n   67 |                                     continue;\n   68 |                                 },\n   69 |                                 Some(v) => v,\n   70 |                             };\n   71 |                             r = remaining;\n   72 |                             matched_len += matched.len();\n   73 |                             p.extend(params);\n   74 |                         }\n   75 |                     )*\n   76 |                     return Some(PartialPathMatch {\n   77 |                         remaining: r,\n   78 |                         matched: &path[0..matched_len],\n   79 |                         params: p\n   80 |                     });","lines":33,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/horizontal/tuples.rs#L48-L80"},{"ref":"router/src/matching/horizontal/static_segment.rs:118-127","code":"  118 |         let (matched, remaining) = if matched_len == 1 && path.starts_with('/')\n  119 |         {\n  120 |             // If only thing that matched is `/` we can't eat it, otherwise next invocation of the\n  121 |             // test function will not be able to tell that we are matching from the beginning of the path segment\n  122 |             (\"/\", path)\n  123 |         } else {\n  124 |             // the remaining is built from the path in, with the slice moved\n  125 |             // by the length of this match\n  126 |             path.split_at(matched_len)\n  127 |         };","lines":10,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/horizontal/static_segment.rs#L118-L127"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"easy","description":"Regression: empty (`StaticSegment(\"\")`) and root (`StaticSegment(\"/\")`) segments no longer match\nwhen the URL has remaining characters, which breaks essentially all nested routing that uses a root/\nlayout parent route.\n\nIn `StaticSegment::test`, the loop rejects the match whenever the pattern iterator `this` is exhausted\nbut the current path char is not a `/`:\n```rust\n} else if n.is_none() {\n    return None;\n}\n```\nCommit `123eec61` changed this branch from `break` to `return None` to fix `StaticSegment(\"fo\")`\nfalsely matching `/foobar`. But this over-corrects: for an *empty* pattern (or the `\"/\"` root pattern),\n`this` is empty from the start, so on the very first non-slash char of the *next* segment (e.g. `a`\nin `/author/contact`) the code returns `None` instead of matching zero-width and leaving the rest as\n`remaining`.\n\nConcretely, `StaticSegment(\"\").test(\"/author/contact\")` now returns `None` where it previously\nreturned a match with `remaining = \"/author/contact\"`. This makes `RouteDefs::match_route` return\n`None` for any nested route whose parent segment is `\"\"` or `\"/\"`.\n\nThis is not theoretical: three in-tree tests currently fail on `main` because of it -\n`matching::tests::matches_nested_route`, `matching::tests::chooses_between_nested_routes`, and\n`matching::tests::arbitrary_nested_routes` (all panic on the `.unwrap()` of a `None` `match_route`\nresult at `mod.rs:207`, `:283`, `:325`). In a real app this manifests as the fallback/404 view being\nshown for every route under a root layout.\n\nThe fix must distinguish \"over-long segment\" (non-empty pattern continuing a word, e.g. `fo` vs\n`foobar` -> reject) from \"zero-width empty/root segment\" (must break and yield the rest).","fix":"```rust\n} else if n.is_none() {\n    // The pattern is exhausted. Reject only if this is a *non-empty* segment\n    // that would otherwise partial-match into the middle of a URL word\n    // (e.g. `StaticSegment(\"fo\")` vs `/foobar`). An empty or `\"/\"` segment\n    // matches zero-width and must leave the remaining path for later segments.\n    if self.0.as_path().is_empty() || self.0.as_path() == \"/\" {\n        break;\n    }\n    return None;\n}\n```","locations":[{"ref":"router/src/matching/horizontal/static_segment.rs:96-98","code":"   96 |             } else if n.is_none() {\n   97 |                 return None;\n   98 |             }","lines":3,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/horizontal/static_segment.rs#L96-L98"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`const_concat_with_separator` is fundamentally broken and does not produce a\nseparator-joined concatenation. The separator-writing block has three separate\nbugs:\n\n```rust\nwhile i < x.len() {\n    buffer[position] = x[i];\n    position += 1;\n    i += 1;\n}\nif !x.is_empty() {\n    let mut position = 0;          // (1) shadows the outer `position`\n    let separator = separator.as_bytes();\n    while i < separator.len() {    // (2) `i` still equals `x.len()`, not reset to 0\n        buffer[position] = separator[i];\n        position += 1;\n        i += 1;\n    }\n}\n```\n\n1. `let mut position = 0;` shadows the outer running write cursor, so any\n   separator bytes are written starting at `buffer[0]`, overwriting the string\n   content already placed there (and the real cursor never advances for the\n   separator).\n2. The loop condition `while i < separator.len()` reuses `i`, which is already\n   `x.len()` from the byte-copy loop above and is never reset to `0`. So when\n   `x.len() >= separator.len()` (the common case) the separator is never emitted\n   at all; otherwise it indexes `separator[i]` from a nonsensical offset.\n3. Even ignoring the above, the separator is appended after every element,\n   including the final one (no `is_last` check).\n\nThe net effect is that the returned buffer is just the raw concatenation with\noccasional corruption of the leading bytes, never a correctly separated string.","fix":"Rewrite the separator handling to use the real `position` cursor, reset the\nseparator index, and only insert separators *between* elements:\n\n```rust\nlet mut first = true;\nwhile let [current, tail @ ..] = remaining {\n    if !first {\n        let sep = separator.as_bytes();\n        let mut j = 0;\n        while j < sep.len() {\n            buffer[position] = sep[j];\n            position += 1;\n            j += 1;\n        }\n    }\n    let x = current.as_bytes();\n    let mut i = 0;\n    while i < x.len() {\n        buffer[position] = x[i];\n        position += 1;\n        i += 1;\n    }\n    first = false;\n    remaining = tail;\n}\n```","locations":[{"ref":"const_str_slice_concat/src/lib.rs:106-139","code":"  106 | pub const fn const_concat_with_separator(\n  107 |     strs: &[&str],\n  108 |     separator: &'static str,\n  109 | ) -> [u8; MAX_TEMPLATE_SIZE] {\n  110 |     let mut buffer = [0; MAX_TEMPLATE_SIZE];\n  111 |     let mut position = 0;\n  112 |     let mut remaining = strs;\n  113 | \n  114 |     while let [current, tail @ ..] = remaining {\n  115 |         let x = current.as_bytes();\n  116 |         let mut i = 0;\n  117 | \n  118 |         // have it iterate over bytes manually, because, again,\n  119 |         // no mutable references in const fns\n  120 |         while i < x.len() {\n  121 |             buffer[position] = x[i];\n  122 |             position += 1;\n  123 |             i += 1;\n  124 |         }\n  125 |         if !x.is_empty() {\n  126 |             let mut position = 0;\n  127 |             let separator = separator.as_bytes();\n  128 |             while i < separator.len() {\n  129 |                 buffer[position] = separator[i];\n  130 |                 position += 1;\n  131 |                 i += 1;\n  132 |             }\n  133 |         }\n  134 | \n  135 |         remaining = tail;\n  136 |     }\n  137 | \n  138 |     buffer\n  139 | }","lines":34,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/const_str_slice_concat/src/lib.rs#L106-L139"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ArcAction::dispatch` (and `dispatch_local`) implement an out-of-order-result guard using the\n`dispatched: ArcStoredValue<usize>` field, but `dispatched` is **never incremented** anywhere in the\ncrate. At dispatch time it snapshots `let current_version = self.dispatched.get_value();` and, when\nthe future resolves, it checks `let is_latest = dispatched.get_value() <= current_version;`. Because\n`dispatched` is always its `Default::default()` value (`0`), `is_latest` is *always* `true`.\n\nThe consequence: if you dispatch the same action twice, the guard that is supposed to ensure only the\n*most recently dispatched* result is written to `value` does nothing. Whichever future resolves *last*\nwins, so a slow older request can clobber the result of a newer one (a classic stale-response race).\nThe `dispatched` field, its `.clone()` into the task, and the whole `is_latest` computation are dead\nas written.","fix":"Increment `dispatched` on every dispatch before snapshotting, so newer dispatches invalidate older\nin-flight ones:\n```rust\n// in dispatch() / dispatch_local(), before spawning:\nlet current_version =\n    self.dispatched.update_value(|n| { *n += 1; *n });\n// ...\n// in the spawned task, on resolve:\nlet is_latest = dispatched.get_value() <= current_version;\n```\nWith the increment in place, an older task sees a larger `dispatched.get_value()` than its own\n`current_version` and correctly skips writing its stale result.","locations":[{"ref":"reactive_graph/src/actions/action.rs:262-304","code":"  262 |     pub fn dispatch(&self, input: I) -> ActionAbortHandle {\n  263 |         let (abort_tx, mut abort_rx) = oneshot::channel();\n  264 |         if !is_suppressing_resource_load() {\n  265 |             let mut fut = (self.action_fn)(&input).fuse();\n  266 | \n  267 |             // Update the state before loading\n  268 |             self.in_flight.update(|n| *n += 1);\n  269 |             let current_version = self.dispatched.get_value();\n  270 |             self.input.try_update(|inp| **inp = Some(input));\n  271 | \n  272 |             // Spawn the task\n  273 |             crate::spawn({\n  274 |                 let input = self.input.clone();\n  275 |                 let version = self.version.clone();\n  276 |                 let dispatched = self.dispatched.clone();\n  277 |                 let value = self.value.clone();\n  278 |                 let in_flight = self.in_flight.clone();\n  279 |                 async move {\n  280 |                     select! {\n  281 |                         // if the abort message has been sent, bail and do nothing\n  282 |                         _ = abort_rx => {\n  283 |                             in_flight.update(|n| *n = n.saturating_sub(1));\n  284 |                         },\n  285 |                         // otherwise, update the value\n  286 |                         result = fut => {\n  287 |                             in_flight.update(|n| *n = n.saturating_sub(1));\n  288 |                             let is_latest = dispatched.get_value() <= current_version;\n  289 |                             if is_latest {\n  290 |                                 version.update(|n| *n += 1);\n  291 |                                 value.update(|n| **n = Some(result));\n  292 |                             }\n  293 |                         }\n  294 |                     }\n  295 |                     if in_flight.get_untracked() == 0 {\n  296 |                         input.update(|inp| **inp = None);\n  297 |                     }\n  298 |                 }\n  299 |             });\n  300 |         }\n  301 | \n  302 |         ActionAbortHandle(abort_tx)\n  303 |     }\n  304 | }","lines":43,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/actions/action.rs#L262-L304"},{"ref":"reactive_graph/src/actions/action.rs:314-355","code":"  314 |     pub fn dispatch_local(&self, input: I) -> ActionAbortHandle {\n  315 |         let (abort_tx, mut abort_rx) = oneshot::channel();\n  316 |         if !is_suppressing_resource_load() {\n  317 |             let mut fut = (self.action_fn)(&input).fuse();\n  318 | \n  319 |             // Update the state before loading\n  320 |             self.in_flight.update(|n| *n += 1);\n  321 |             let current_version = self.dispatched.get_value();\n  322 |             self.input.try_update(|inp| **inp = Some(input));\n  323 | \n  324 |             // Spawn the task\n  325 |             Executor::spawn_local({\n  326 |                 let input = self.input.clone();\n  327 |                 let version = self.version.clone();\n  328 |                 let value = self.value.clone();\n  329 |                 let dispatched = self.dispatched.clone();\n  330 |                 let in_flight = self.in_flight.clone();\n  331 |                 async move {\n  332 |                     select! {\n  333 |                         // if the abort message has been sent, bail and do nothing\n  334 |                         _ = abort_rx => {\n  335 |                             in_flight.update(|n| *n = n.saturating_sub(1));\n  336 |
