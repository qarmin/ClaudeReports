link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_macro/src/view/mod.rs#L1339-L1342"}]},{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`Action::new_local_with_value` imposes a spurious `Send` bound on the future:\n```rust\npub fn new_local_with_value<F, Fu>(value: Option<O>, action_fn: F) -> Self\nwhere\n    F: Fn(&I) -> Fu + 'static,\n    Fu: Future<Output = O> + Send + 'static,   // <-- `+ Send` should not be here\n```\nThe sibling constructor `Action::new_local` requires only `Fu: Future<Output = O> + 'static`\n(no `Send`), and the body forwards to `ArcAction::new_unsync_with_value`, which wraps the future in\n`SendWrapper` precisely so it need not be `Send`. The `+ Send` here is inconsistent and needlessly\nrejects the non-`Send` local futures this constructor exists to support.","fix":"```rust\npub fn new_local_with_value<F, Fu>(value: Option<O>, action_fn: F) -> Self\nwhere\n    F: Fn(&I) -> Fu + 'static,\n    Fu: Future<Output = O> + 'static,\n```","locations":[{"ref":"reactive_graph/src/actions/action.rs:771-785","code":"  771 |     #[track_caller]\n  772 |     pub fn new_local_with_value<F, Fu>(value: Option<O>, action_fn: F) -> Self\n  773 |     where\n  774 |         F: Fn(&I) -> Fu + 'static,\n  775 |         Fu: Future<Output = O> + Send + 'static,\n  776 |     {\n  777 |         Self {\n  778 |             inner: ArenaItem::new(ArcAction::new_unsync_with_value(\n  779 |                 value, action_fn,\n  780 |             )),\n  781 |             #[cfg(any(debug_assertions, leptos_debuginfo))]\n  782 |             defined_at: Location::caller(),\n  783 |         }\n  784 |     }\n  785 | }","lines":15,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/actions/action.rs#L771-L785"}]},{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`UnsyncCallback::matches` uses `with_value` (which panics if the callback has been disposed), while\n`Callback::matches` uses `try_with_value(...).flatten().unwrap_or(false)` (which gracefully returns\n`false`). This is an inconsistent contract: comparing two disposed `UnsyncCallback`s panics, whereas\nthe analogous `Callback` call does not.\n```rust\n// UnsyncCallback::matches\nself.0.with_value(|self_value| {\n    other.0.with_value(|other_value| Rc::ptr_eq(self_value, other_value))\n})\n```","fix":"Mirror `Callback::matches` so a disposed callback yields `false` rather than a panic:\n```rust\npub fn matches(&self, other: &Self) -> bool {\n    self.0\n        .try_with_value(|self_value| {\n            other\n                .0\n                .try_with_value(|other_value| Rc::ptr_eq(self_value, other_value))\n        })\n        .flatten()\n        .unwrap_or(false)\n}\n```","locations":[{"ref":"reactive_graph/src/callback.rs:78-86","code":"   78 |     #[inline]\n   79 |     pub fn matches(&self, other: &Self) -> bool {\n   80 |         self.0.with_value(|self_value| {\n   81 |             other\n   82 |                 .0\n   83 |                 .with_value(|other_value| Rc::ptr_eq(self_value, other_value))\n   84 |         })\n   85 |     }\n   86 | }","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/callback.rs#L78-L86"},{"ref":"reactive_graph/src/callback.rs:220-231","code":"  220 |     #[inline]\n  221 |     pub fn matches(&self, other: &Self) -> bool {\n  222 |         self.0\n  223 |             .try_with_value(|self_value| {\n  224 |                 other.0.try_with_value(|other_value| {\n  225 |                     Arc::ptr_eq(self_value, other_value)\n  226 |                 })\n  227 |             })\n  228 |             .flatten()\n  229 |             .unwrap_or(false)\n  230 |     }\n  231 | }","lines":12,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/callback.rs#L220-L231"}]},{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`LocalStorage`'s `try_with`/`try_with_mut` use the panicking arena accessors (`Arena::with` / `Arena::with_mut`) instead of the fallible ones, so under the `sandboxed-arenas` feature they panic when no arena is active, whereas the analogous `SyncStorage` methods return `None`.\n\n`SyncStorage::try_with` (correct, fallible):\n\n```rust\nfn try_with<U>(node: NodeId, fun: impl FnOnce(&T) -> U) -> Option<U> {\n    Arena::try_with(|arena| { ... }).flatten()\n}\n```\n\n`LocalStorage::try_with` (panics under `sandboxed-arenas` with no active arena):\n\n```rust\nfn try_with<U>(node: NodeId, fun: impl FnOnce(&T) -> U) -> Option<U> {\n    Arena::with(|arena| { ... })\n}\n```\n\n`Arena::with` / `Arena::with_mut` `panic!` when the `sandboxed-arenas` feature is on and there is no active arena (see `arena.rs:52-59` / `87-94`). This makes `ArenaItem::<_, LocalStorage>::try_with_value` (documented to return `None` \"if it has already been disposed\") panic instead in that configuration, inconsistent with `SyncStorage`.","fix":"Use the fallible arena accessors, mirroring `SyncStorage`:\n\n```rust\nfn try_with<U>(node: NodeId, fun: impl FnOnce(&T) -> U) -> Option<U> {\n    Arena::try_with(|arena| {\n        arena.get(node)\n            .and_then(|n| n.downcast_ref::<SendWrapper<T>>())\n            .map(|inner| fun(inner))\n    })\n    .flatten()\n}\n\nfn try_with_mut<U>(node: NodeId, fun: impl FnOnce(&mut T) -> U) -> Option<U> {\n    Arena::try_with_mut(|arena| {\n        arena.get_mut(node)\n            .and_then(|n| n.downcast_mut::<SendWrapper<T>>())\n            .map(|inner| fun(&mut *inner))\n    })\n    .flatten()\n}\n```","locations":[{"ref":"reactive_graph/src/owner/storage.rs:137-154","code":"  137 |     fn try_with<U>(node: NodeId, fun: impl FnOnce(&T) -> U) -> Option<U> {\n  138 |         Arena::with(|arena| {\n  139 |             let m = arena.get(node);\n  140 |             m.and_then(|n| n.downcast_ref::<SendWrapper<T>>())\n  141 |                 .map(|inner| fun(inner))\n  142 |         })\n  143 |     }\n  144 | \n  145 |     fn try_with_mut<U>(\n  146 |         node: NodeId,\n  147 |         fun: impl FnOnce(&mut T) -> U,\n  148 |     ) -> Option<U> {\n  149 |         Arena::with_mut(|arena| {\n  150 |             let m = arena.get_mut(node);\n  151 |             m.and_then(|n| n.downcast_mut::<SendWrapper<T>>())\n  152 |                 .map(|inner| fun(&mut *inner))\n  153 |         })\n  154 |     }","lines":18,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/owner/storage.rs#L137-L154"}]},{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Directive::rebuild` re-invokes the directive handler on every rebuild, with no way to clean up the previous\ninvocation:\n\n```rust\nfn rebuild(self, state: &mut Self::State) {\n    let inner = self.0.expect(super::FEATURE_CONFLICT_DIAGNOSTIC).take();\n    inner.handler.run(state.clone(), inner.param);\n}\n```\n\nThe trait documentation describes a directive as logic that runs \"when the element is created or hydrated\", but\n`rebuild` runs it again for each reactive update of the surrounding view. A directive whose body has a side effect\nthat is not idempotent - for example one that calls `el.add_event_listener(...)`, appends a child, or starts an\nobserver - will accumulate duplicates on every rebuild, effectively leaking listeners/observers. There is no\n`RemoveEventHandler`-style cleanup slot in `State` (which is just the `Element`), so a directive cannot undo its\nprior effect. Either the re-run on rebuild is unintended, or the handler contract needs to guarantee idempotency and\nsay so.","fix":"If re-running is not intended, make `rebuild` a no-op (run only on `build`/`hydrate`). If it is intended for reactive\nparams, give directives a cleanup hook (return an optional teardown from `run`, store it in `State`, and invoke it\nbefore re-running) so effects such as added listeners can be removed:\n\n```rust\nfn rebuild(self, _state: &mut Self::State) {\n    // directives run once, on build/hydrate; do not re-run on rebuild\n}\n```","locations":[{"ref":"tachys/src/html/directive.rs:135-138","code":"  135 |     fn rebuild(self, state: &mut Self::State) {\n  136 |         let inner = self.0.expect(super::FEATURE_CONFLICT_DIAGNOSTIC).take();\n  137 |         inner.handler.run(state.clone(), inner.param);\n  138 |     }","lines":4,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/directive.rs#L135-L138"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`Req::try_into_stream` for the generic `Request<Bytes>` backend iterates the body\none byte at a time. `self.into_body()` is a `Bytes`; passing it to `stream::iter`\nyields an iterator of individual `u8` values (`Bytes: IntoIterator<Item = u8>`),\nwhich are then regrouped into arbitrary 16-byte `Bytes` chunks:\n\n```rust\nfn try_into_stream(\n    self,\n) -> Result<impl Stream<Item = Result<Bytes, Bytes>> + Send + 'static, Error>\n{\n    Ok(stream::iter(self.into_body())\n        .ready_chunks(16)\n        .map(|chunk| Ok(Bytes::from(chunk))))\n}\n```\n\nEvery byte of the request body is pushed through the async-stream machinery\nindividually and then copied into a fresh 16-byte allocation, which is\npathologically slow and allocation-heavy for any non-trivial body (this is the\npath used by `leptos_wasi` and other generic integrations). The whole body is\nalready contiguous in memory, so it can be emitted as a single chunk.","fix":"```rust\nfn try_into_stream(\n    self,\n) -> Result<impl Stream<Item = Result<Bytes, Bytes>> + Send + 'static, Error>\n{\n    Ok(stream::once(async move { Ok(self.into_body()) }))\n}\n```","locations":[{"ref":"server_fn/src/request/generic.rs:46-53","code":"   46 |     fn try_into_stream(\n   47 |         self,\n   48 |     ) -> Result<impl Stream<Item = Result<Bytes, Bytes>> + Send + 'static, Error>\n   49 |     {\n   50 |         Ok(stream::iter(self.into_body())\n   51 |             .ready_chunks(16)\n   52 |             .map(|chunk| Ok(Bytes::from(chunk))))\n   53 |     }","lines":8,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/server_fn/src/request/generic.rs#L46-L53"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`HydrationScripts` reads the hash file and computes `current_exe()`/parent dir twice\nper invocation: once inside the `SPLIT_MANIFEST` initializer (for the wasm-split\nnames) and again below for the js/wasm file names. When `hash_files` is enabled this\nmeans two `std::env::current_exe()` calls plus two full `read_to_string` +\nline-parsing passes over the same file on the render path.","fix":"Read and parse the hash file once, reusing the parsed `js`/`wasm`/`split`/`manifest` hashes for both purposes.","locations":[{"ref":"leptos/src/hydration/mod.rs:68-99","code":"   68 |         let (wasm_split_js, wasm_split_manifest) = if options.hash_files {\n   69 |             let hash_path = std::env::current_exe()\n   70 |                 .map(|path| {\n   71 |                     path.parent().map(|p| p.to_path_buf()).unwrap_or_default()\n   72 |                 })\n   73 |                 .unwrap_or_default()\n   74 |                 .join(options.hash_file.as_ref());\n   75 |             let hashes = std::fs::read_to_string(&hash_path)\n   76 |                 .expect(\"failed to read hash file\");\n   77 | \n   78 |             let mut split =\n   79 |                 \"__wasm_split.______________________.js\".to_string();\n   80 |             let mut manifest = \"__wasm_split_manifest.json\".to_string();\n   81 |             for line in hashes.lines() {\n   82 |                 let line = line.trim();\n   83 |                 if !line.is_empty() {\n   84 |                     if let Some((file, hash)) = line.split_once(':') {\n   85 |                         if file == \"manifest\" {\n   86 |                             manifest.clear();\n   87 |                             manifest.push_str(\"__wasm_split_manifest.\");\n   88 |                             manifest.push_str(hash.trim());\n   89 |                             manifest.push_str(\".json\");\n   90 |                         }\n   91 |                         if file == \"split\" {\n   92 |                             split.clear();\n   93 |                             split.push_str(\"__wasm_split.\");\n   94 |                             split.push_str(hash.trim());\n   95 |                             split.push_str(\".js\");\n   96 |                         }\n   97 |                     }\n   98 |                 }\n   99 |             }","lines":32,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos/src/hydration/mod.rs#L68-L99"},{"ref":"leptos/src/hydration/mod.rs:127-149","code":"  127 |     if options.hash_files {\n  128 |         let hash_path = std::env::current_exe()\n  129 |             .map(|path| {\n  130 |                 path.parent().map(|p| p.to_path_buf()).unwrap_or_default()\n  131 |             })\n  132 |             .unwrap_or_default()\n  133 |             .join(options.hash_file.as_ref());\n  134 |         if hash_path.exists() {\n  135 |             let hashes = std::fs::read_to_string(&hash_path)\n  136 |                 .expect(\"failed to read hash file\");\n  137 |             for line in hashes.lines() {\n  138 |                 let line = line.trim();\n  139 |                 if !line.is_empty() {\n  140 |                     if let Some((file, hash)) = line.split_once(':') {\n  141 |                         if file == \"js\" {\n  142 |                             js_file_name.push_str(&format!(\".{}\", hash.trim()));\n  143 |                         } else if file == \"wasm\" {\n  144 |                             wasm_file_name\n  145 |                                 .push_str(&format!(\".{}\", hash.trim()));\n  146 |                         }\n  147 |                     }\n  148 |                 }\n  149 |             }","lines":23,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos/src/hydration/mod.rs#L127-L149"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`AsyncDerivedFuture::poll` pushes a `SuspenseContext` into `inner.suspenses` on *every* poll, unconditionally, before it even checks whether the value is ready.\n\n```rust\nlet value = self.value.read_arc();\n\nif let Some(suspense_context) = use_context::<SuspenseContext>() {\n    self.inner.write().or_poisoned().suspenses.push(suspense_context); // every poll\n}\n\npin_mut!(value);\nmatch (self.loading.load(Ordering::Relaxed), value.poll(cx)) { ... }\n```\n\nA single `.await` can poll the future many times (each spurious wake), and a completing poll (returning `Poll::Ready`) still pushes a context. These accumulate in `inner.suspenses` and are only cleared on the next rerun (`mem::take` at line 372), so they can pile up as duplicates and, being clones of the suspense signal, keep it live longer than needed. `AsyncDerivedReadyFuture::poll` avoids this by not pushing suspense contexts at all.","fix":"Register the suspense context only once, and only when actually pending, e.g.:\n\n```rust\nmatch (self.loading.load(Ordering::Relaxed), value.poll(cx)) {\n    (true, _) => {\n        if let Some(sc) = use_context::<SuspenseContext>() {\n            let mut inner = self.inner.write().or_poisoned();\n            if !inner.suspenses.contains(&sc) {\n                inner.suspenses.push(sc);\n            }\n        }\n        self.wakers.write().or_poisoned().push(waker.clone());\n        Poll::Pending\n    }\n    (_, Poll::Pending) => Poll::Pending,\n    (_, Poll::Ready(guard)) => Poll::Ready(guard.as_ref().unwrap().clone()),\n}\n```\n(Requires `SuspenseContext: PartialEq`, or track membership with a set.)","locations":[{"ref":"reactive_graph/src/computed/async_derived/future_impls.rs:124-150","code":"  124 |     fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {\n  125 |         #[cfg(debug_assertions)]\n  126 |         let _guard = SpecialNonReactiveZone::enter();\n  127 |         let waker = cx.waker();\n  128 |         self.source.track();\n  129 |         let value = self.value.read_arc();\n  130 | \n  131 |         if let Some(suspense_context) = use_context::<SuspenseContext>() {\n  132 |             self.inner\n  133 |                 .write()\n  134 |                 .or_poisoned()\n  135 |                 .suspenses\n  136 |                 .push(suspense_context);\n  137 |         }\n  138 | \n  139 |         pin_mut!(value);\n  140 |         match (self.loading.load(Ordering::Relaxed), value.poll(cx)) {\n  141 |             (true, _) => {\n  142 |                 self.wakers.write().or_poisoned().push(waker.clone());\n  143 |                 Poll::Pending\n  144 |             }\n  145 |             (_, Poll::Pending) => Poll::Pending,\n  146 |             (_, Poll::Ready(guard)) => {\n  147 |                 Poll::Ready(guard.as_ref().unwrap().clone())\n  148 |             }\n  149 |         }\n  150 |     }","lines":27,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/computed/async_derived/future_impls.rs#L124-L150"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`Error::into_inner` takes `self` by value but returns `Arc::clone(&self.0)`\ninstead of moving the field out. `Error` is a `#[repr(transparent)]` newtype\naround the `Arc` with no `Drop` impl, so the inner `Arc` can simply be moved out.\nThe clone performs an unnecessary atomic increment, immediately followed by an\natomic decrement when `self` is dropped at the end of the function.","fix":"```rust\npub fn into_inner(self) -> Arc<dyn error::Error + Send + Sync> {\n    self.0\n}\n```","locations":[{"ref":"any_error/src/lib.rs:26-29","code":"   26 |     /// Converts the wrapper into the inner reference-counted error.\n   27 |     pub fn into_inner(self) -> Arc<dyn error::Error + Send + Sync> {\n   28 |         Arc::clone(&self.0)\n   29 |     }","lines":4,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/any_error/src/lib.rs#L26-L29"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `ServerMetaContextOutput::inject_meta_context`, `head_loc` is computed via\n`first_chunk.find(\"<\/head>\")`, and then `marker_loc`'s fallback recomputes the exact same search:\n```rust\nlet head_loc = first_chunk.find(\"<\/head>\").expect(...);\nlet marker_loc = first_chunk\n    .find(\"<!--HEAD-->\")\n    .map(|pos| pos + \"<!--HEAD-->\".len())\n    .unwrap_or_else(|| first_chunk.find(\"<\/head>\").unwrap_or(head_loc));\n```\nThe `.unwrap_or_else(|| first_chunk.find(\"<\/head>\").unwrap_or(head_loc))` scans for `<\/head>` a\nsecond time, but that result is always `head_loc`. The closure can just return `head_loc`.","fix":"```rust\nlet marker_loc = first_chunk\n    .find(\"<!--HEAD-->\")\n    .map(|pos| pos + \"<!--HEAD-->\".len())\n    .unwrap_or(head_loc);\n```","locations":[{"ref":"meta/src/lib.rs:249-257","code":"  249 |             let head_loc = first_chunk\n  250 |                 .find(\"<\/head>\")\n  251 |                 .expect(\"you are using leptos_meta without a <\/head> tag\");\n  252 |             let marker_loc = first_chunk\n  253 |                 .find(\"<!--HEAD-->\")\n  254 |                 .map(|pos| pos + \"<!--HEAD-->\".len())\n  255 |                 .unwrap_or_else(|| {\n  256 |                     first_chunk.find(\"<\/head>\").unwrap_or(head_loc)\n  257 |                 });","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/meta/src/lib.rs#L249-L257"}]},{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`resolve_path` uses `str::find` (an O(n*m) substring search) to test a prefix relationship, where\n`str::starts_with` is both clearer and faster:\n```rust\n} else if from_path.find(base_path.as_ref()) != Some(0) {\n```\nThe intent (\"`base_path` is not a prefix of `from_path`\") is exactly `!from_path.starts_with(...)`.","fix":"```rust\n} else if !from_path.starts_with(base_path.as_ref()) {\n    base_path + from_path\n} else {\n    from_path\n}\n```","locations":[{"ref":"router/src/matching/resolve_path.rs:16-20","code":"   16 |             } else if from_path.find(base_path.as_ref()) != Some(0) {\n   17 |                 base_path + from_path\n   18 |             } else {\n   19 |                 from_path\n   20 |             }","lines":5,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/resolve_path.rs#L16-L20"}]},{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`html_len` for the string views returns the raw byte length of the source:\n\n```rust\nfn html_len(&self) -> usize {\n    self.len()\n}\n```\n\n`html_len` is used only as a `String::with_capacity` / `StreamBuilder::with_capacity`\nhint (see `tachys/src/view/mod.rs:139,157,173`). For text that must be HTML-escaped the\nemitted output is longer than `self.len()` (`<` -> `&lt;`, `&` -> `&amp;`, `>` ->\n`&gt;`), and for an empty escaped string one space is emitted while `html_len` returns\n`0`. The result is occasional buffer reallocation. This is a pure capacity hint, so the\nimpact is negligible correctness-wise, but the estimate is systematically low for\nescaped content. Applies to the `&str`, `String`, `Arc<str>` and `Cow<str>` impls, which\nall delegate to `self.len()`.","fix":"Leave as-is if a fast lower-bound hint is acceptable, or bias the estimate slightly for\nescaped content, e.g.:\n\n```rust\nfn html_len(&self) -> usize {\n    // small headroom for HTML entity expansion of `< > &`\n    self.len() + self.len() / 8 + 1\n}\n```","locations":[{"ref":"tachys/src/view/strings.rs:52-54","code":"   52 |     fn html_len(&self) -> usize {\n   53 |         self.len()\n   54 |     }","lines":3,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/strings.rs#L52-L54"},{"ref":"tachys/src/view/strings.rs:188-190","code":"  188 |     fn html_len(&self) -> usize {\n  189 |         self.len()\n  190 |     }","lines":3,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/strings.rs#L188-L190"}]},{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In the tuple `RenderHtml` macro, every element - including the final one - clones the\n`extra_attrs` vector:\n\n```rust\n$first.to_html_with_buf(buf, position, escape, mark_branches, extra_attrs.clone());\n$($ty.to_html_with_buf(buf, position, escape, mark_branches, extra_attrs.clone()));*\n```\n\nand identically in `to_html_async_with_buf`:\n\n```rust\n$first.to_html_async_with_buf::<OUT_OF_ORDER>(buf, position, escape, mark_branches, extra_attrs.clone());\n$($ty.to_html_async_with_buf::<OUT_OF_ORDER>(buf, position, escape, mark_branches, extra_attrs.clone()));*\n```\n\nThe last element could take `extra_attrs` by value instead of cloning, saving one\n`Vec<AnyAttribute>` clone per tuple render. In the common case `extra_attrs` is empty\n(cheap), so this is negligible, but it is a consistent extra allocation on every render\nof any element with `{..}` spread attributes.","fix":"Because the macro cannot easily distinguish the last repetition, one option is to only\nclone for the non-final elements. A simpler pragmatic approach: keep the head cloning\nbut drop the trailing clone by binding the tail count, or accept the clone. If kept,\ndocument why. A structural fix would rewrite the repetition so the last element receives\n`extra_attrs` by move, e.g. by reversing so `$first` (rendered last after a manual\nreorder) consumes it - but note the elements must still render in source order, so the\ncleanest fix is to clone for all but pass the original to the final call via a helper.","locations":[{"ref":"tachys/src/view/tuples.rs:296-300","code":"  296 |                 #[allow(non_snake_case)]\n  297 |                 let ($first, $($ty,)* ) = self;\n  298 |                 $first.to_html_with_buf(buf, position, escape, mark_branches, extra_attrs.clone());\n  299 |                 $($ty.to_html_with_buf(buf, position, escape, mark_branches, extra_attrs.clone()));*\n  300 | \t\t\t}","lines":5,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/tuples.rs#L296-L300"},{"ref":"tachys/src/view/tuples.rs:312-316","code":"  312 |                 #[allow(non_snake_case)]\n  313 |                 let ($first, $($ty,)* ) = self;\n  314 |                 $first.to_html_async_with_buf::<OUT_OF_ORDER>(buf, position, escape, mark_branches, extra_attrs.clone());\n  315 |                 $($ty.to_html_async_with_buf::<OUT_OF_ORDER>(buf, position, escape, mark_branches, extra_attrs.clone()));*\n  316 | \t\t\t}","lines":5,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/tuples.rs#L312-L316"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"The file `leptos/src/lo rc/callback.rs:148-152","code":"  148 | impl<In, Out> fmt::Debug for Callback<In, Out> {\n  149 |     fn fmt(&self, fmt: &mut fmt::Formatter<'_>) -> Result<(), fmt::Error> {\n  150 |         fmt.write_str(\"SyncCallback\")\n  151 |     }\n  152 | }","lines":5,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/callback.rs#L148-L152"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"`Set::set` emits a debug warning claiming an update \"can happen if a read guard\nover the value is still alive\", but for the arena/`Arc` signal types the write\npath *blocks* on the lock rather than failing, so that warning never fires for\nthe reason stated and a same-thread live read guard **deadlocks** instead.\n\n`Set::set` (`traits.rs`):\n```rust\nlet failed = self.try_update(|n| *n = value).is_none();\nif failed && !self.is_disposed() {\n    crate::log_warning(format_args!(\n        \"...the update failed. This can happen if a read guard over the value is still alive.\"\n    ));\n}\n```\nBut the read path is non-blocking (`Plain::try_new` uses\n`ArcRwLockReadGuardian::try_take`, returning `None` on contention), while the\ntracked write path is *blocking*:\n```rust\n// RwSignal / WriteSignal\nArcRwLockWriteGuardian::take(Arc::clone(&n.value)).ok()   // blocking `take`\n// ArcRwSignal / ArcWriteSignal\nself.value.write().ok()                                   // blocking `write()`\n```\n`take()`/`write()` only yield `None` on *poison* (or arena-dispose), never on\na live read guard. So: (a) with a read guard alive on *another* thread the\nwrite simply blocks until release and then succeeds (no warning); (b) with a\nread guard alive on the *same* thread, `std::sync::RwLock::write()` deadlocks\n(or panics on recursive lock), never reaching the warning. The warning text is\ntherefore misleading, and the asymmetry (non-blocking `try_read` vs blocking\n`try_write`/`try_write_untracked`-is-non-blocking) is itself a latent\ndeadlock/footgun.","fix":"Either make the tracked write path non-blocking so the `try_` contract and the\nwarning match reality, or fix the warning text. Preferred (non-blocking, using\nthe same `try_take` the read path uses):\n```rust\n// RwSignal::try_write / WriteSignal::try_write\nlet guard = self.inner.try_with_value(|n| {\n    ArcRwLockWriteGuardian::try_take(Arc::clone(&n.value))?.ok()\n})??;\nSome(WriteGuard::new(*self, guard))\n```\n```rust\n// ArcRwSignal::try_write / ArcWriteSignal::try_write\nself.value\n    .try_write()\n    .ok()\n    .map(|guard| WriteGuard::new(self.clone(), guard))\n```","locations":[{"ref":"reactive_graph/src/traits.rs:546-561","code":"  546 |     #[track_caller]\n  547 |     fn set(&self, value: Self::Value) {\n  548 |         let failed = self.try_update(|n| *n = value).is_none();\n  549 | \n  550 |         #[cfg(any(debug_assertions, leptos_debuginfo))]\n  551 |         if failed && !self.is_disposed() {\n  552 |             let called_at = Location::caller();\n  553 |             let ty = std::any::type_name::<Self::Value>();\n  554 | \n  555 |             crate::log_warning(format_args!(\n  556 |                 \"At {called_at}, you tried to update a {ty}, but the update \\\n  557 |                  failed. This can happen if a read guard over the value is \\\n  558 |                  still alive.\"\n  559 |             ));\n  560 |         };\n  561 |     }","lines":16,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/traits.rs#L546-L561"},{"ref":"reactive_graph/src/signal/rw.rs:371-376","code":"  371 |     fn try_write(&self) -> Option<impl UntrackableGuard<Target = Self::Value>> {\n  372 |         let guard = self.inner.try_with_value(|n| {\n  373 |             ArcRwLockWriteGuardian::take(Arc::clone(&n.value)).ok()\n  374 |         })??;\n  375 |         Some(WriteGuard::new(*self, guard))\n  376 r (taking `&mut inner`)\nwould remove the duplication and the divergence risk.","fix":"Factor the marker-skipping loop into a private helper and call it from both `child` and\n`sibling`:\n\n```rust\n#[cfg(feature = \"mark_branches\")]\nfn skip_branch_markers(inner: &mut crate::renderer::types::Node) {\n    while inner.node_type() == COMMENT_NODE {\n        match inner.text_content() {\n            Some(c) if c.starts_with(\"bo\") || c.starts_with(\"bc\") => {\n                match Rndr::next_sibling(inner) {\n                    Some(sibling) => *inner = sibling,\n                    None => break,\n                }\n            }\n            _ => break,\n        }\n    }\n}\n```","locations":[{"ref":"tachys/src/hydration.rs:54-68","code":"   54 |         #[cfg(feature = \"mark_branches\")]\n   55 |         {\n   56 |             while inner.node_type() == COMMENT_NODE {\n   57 |                 if let Some(content) = inner.text_content() {\n   58 |                     if content.starts_with(\"bo\") || content.starts_with(\"bc\") {\n   59 |                         if let Some(sibling) = Rndr::next_sibling(&inner) {\n   60 |                             *inner = sibling;\n   61 |                             continue;\n   62 |                         }\n   63 |                     }\n   64 |                 }\n   65 | \n   66 |                 break;\n   67 |             }\n   68 |         }","lines":15,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/hydration.rs#L54-L68"},{"ref":"tachys/src/hydration.rs:83-96","code":"   83 |         #[cfg(feature = \"mark_branches\")]\n   84 |         {\n   85 |             while inner.node_type() == COMMENT_NODE {\n   86 |                 if let Some(content) = inner.text_content() {\n   87 |                     if content.starts_with(\"bo\") || content.starts_with(\"bc\") {\n   88 |                         if let Some(sibling) = Rndr::next_sibling(&inner) {\n   89 |                             *inner = sibling;\n   90 |                             continue;\n   91 |                         }\n   92 |                     }\n   93 |                 }\n   94 |                 break;\n   95 |             }\n   96 |         }","lines":14,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/hydration.rs#L83-L96"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`CustomAttr::to_html` writes a custom attribute by delegating to `AttributeValue::to_html`, passing the key straight\nthrough with no escaping or validation:\n\n```rust\nfn to_html(self, buf: &mut String, ...) {\n    self.value.to_html(self.key.as_ref(), buf);   // key.as_ref() is written verbatim\n}\n```\n\nand `AttributeValue::to_html` (e.g. `&str`, `value.rs:150-156`) emits ` `, then the key **unescaped**, then\n`=\"<escaped value>\"`. The attribute *value* is escaped via `escape_attr`, but the attribute *name* is not.\n`CustomAttributeKey` is implemented for `String`, `Cow<'static, str>`, and `Arc<str>` (custom.rs:167-177), so the\npublic `.attr(key, value)` API accepts a runtime, potentially user-derived key. A key such as\n`x\" onmouseover=\"alert(1)` or `x><script>` breaks out of the attribute and injects arbitrary markup/handlers into\nthe server-rendered HTML. Unlike `inner_html` (which carries a prominent `# Security` warning), nothing here escapes\nthe name or documents the hazard.","fix":"Validate/escape the attribute name before writing it. At minimum reject names containing characters that are illegal\nin an attribute name (whitespace, `\"`, `'`, `>`, `/`, `=`) so a malformed key cannot terminate the attribute, e.g.:\n\n```rust\nfn to_html(self, buf: &mut String, ...) {\n    let key = self.key.as_ref();\n    debug_assert!(\n        !key.bytes().any(|b| matches!(b, b' ' | b'\\t' | b'\\n' | b'\\r' | b'\"' | b'\\'' | b'>' | b'/' | b'=')),\n        \"invalid custom attribute name: {key:?}\"\n    );\n    self.value.to_html(key, buf);\n}\n```\n\nand document the injection risk on `CustomAttribute::attr` when a dynamic key is used.","locations":[{"ref":"tachys/src/html/attribute/custom.rs:62-70","code":"   62 |     fn to_html(\n   63 |         self,\n   64 |         buf: &mut String,\n   65 |         _class: &mut String,\n   66 |         _style: &mut String,\n   67 |         _inner_html: &mut String,\n   68 |     ) {\n   69 |         self.value.to_html(self.key.as_ref(), buf);\n   70 |     }","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/attribute/custom.rs#L62-L70"},{"ref":"tachys/src/html/attribute/value.rs:150-156","code":"  150 |     fn to_html(self, key: &str, buf: &mut String) {\n  151 |         buf.push(' ');\n  152 |         buf.push_str(key);\n  153 |         buf.push_str(\"=\\\"\");\n  154 |         buf.push_str(&escape_attr(self));\n  155 |         buf.push('\"');\n  156 |     }","lines":7,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/attribute/value.rs#L150-L156"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The `Deserialize` impl for `Signal<T>` carries an unnecessary `Serialize` bound\nin its `where` clause, over-constraining deserialization:\n```rust\nimpl<'de, T: Deserialize<'de>> Deserialize<'de> for Signal<T>\nwhere\n    T: Send + Sync + Serialize + 'static, // `Serialize` is not needed to deserialize\n{\n    fn deserialize<D>(deserializer: D) -> Result<Self, D::Error> ...\n}\n```\nDeserializing a `Signal<T>` only produces a `T` via `Signal::stored`; it never\nserializes anything, so requiring `T: Serialize` needlessly restricts which\n`Signal<T>` values can be deserialized.","fix":"```rust\n#[allow(deprecated)]\nimpl<'de, T: Deserialize<'de>> Deserialize<'de> for Signal<T>\nwhere\n    T: Send + Sync + 'static,\n{\n    fn deserialize<D>(deserializer: D) -> Result<Self, D::Error>\n    where\n        D: serde::Deserializer<'de>,\n    {\n        T::deserialize(deserializer).map(Signal::stored)\n    }\n}\n```","locations":[{"ref":"reactive_graph/src/serde.rs:158-169","code":"  158 | #[allow(deprecated)]\n  159 | impl<'de, T: Deserialize<'de>> Deserialize<'de> for Signal<T>\n  160 | where\n  161 |     T: Send + Sync + Serialize + 'static,\n  162 | {\n  163 |     fn deserialize<D>(deserializer: D) -> Result<Self, D::Error>\n  164 |     where\n  165 |         D: serde::Deserializer<'de>,\n  166 |     {\n  167 |         T::deserialize(deserializer).map(Signal::stored)\n  168 |     }\n  169 | }","lines":12,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/serde.rs#L158-L169"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"The `ToTemplate::TEMPLATE` const for `&str` is `\" <!>\"` (space then a comment marker),\nbut the `to_template` function only ever pushes a single space (plus a conditional\nleading `<!>` when following text):\n\n```rust\nconst TEMPLATE: &'static str = \" <!>\";\n\nfn to_template(buf: &mut String, ..., position: &mut Position) {\n    if matches!(*position, Position::NextChildAfterText) {\n        buf.push_str(\"<!>\")\n    }\n    buf.push(' ');\n    *position = Position::NextChildAfterText;\n}\n```\n\nThe runtime `<template>` element is built from `to_template` (see\n`tachys/src/renderer/dom.rs:531`, `get_template` calls `V::to_template`), so the const's\nextra trailing `<!>` is not part of the actual cloned template. The const only feeds\n`ToTemplate::LEN` (`const LEN: usize = Self::TEMPLATE.len();`, `tachys/src/view/mod.rs:446`)\nand const-concatenation of parent templates, i.e. capacity/length estimation. The effect\nis a 3-byte-per-string over-estimate of template length; harmless but the divergence\nbetween the const and the function is mis <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
