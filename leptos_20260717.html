t check `if let ... a { if Tuple => return Ordering::Greater }` returns `Greater` before the symmetric `b` check is reached, so `cmp(a,b)` and `cmp(b,a)` can both yield `Greater`. Rust's `sort_by` will not panic, but with an inconsistent comparator the resulting order is unspecified, which can silently reorder `class=(...)`/`style=(...)` tuple attributes relative to each other in a non-deterministic way.\n```rust\nif let NodeAttribute::Attribute(a) = a {\n    if let Some(Tuple(_)) = a.value() {\n        return Ordering::Greater;\n    }\n}\nif let NodeAttribute::Attribute(b) = b {\n    if let Some(Tuple(_)) = b.value() {\n        return Ordering::Less;\n    }\n}\n```","fix":"Handle the both-tuple case explicitly so the comparator is antisymmetric, e.g.:\n```rust\nlet a_tuple = matches!(a, NodeAttribute::Attribute(a) if matches!(a.value(), Some(Tuple(_))));\nlet b_tuple = matches!(b, NodeAttribute::Attribute(b) if matches!(b.value(), Some(Tuple(_))));\nmatch (a_tuple, b_tuple) {\n    (true, true) => return Ordering::Equal,\n    (true, false) => return Ordering::Greater,\n    (false, true) => return Ordering::Less,\n    (false, false) => {}\n}\n```","locations":[{"ref":"leptos_macro/src/view/mod.rs:805-844","code":"  805 |     node.attributes_mut()[0..spread_position].sort_by(|a, b| {\n  806 |         let key_a = match a {\n  807 |             NodeAttribute::Attribute(attr) => match &attr.key {\n  808 |                 NodeName::Path(attr) => {\n  809 |                     attr.path.segments.first().map(|n| n.ident.to_string())\n  810 |                 }\n  811 |                 _ => None,\n  812 |             },\n  813 |             _ => None,\n  814 |         };\n  815 |         let key_b = match b {\n  816 |             NodeAttribute::Attribute(attr) => match &attr.key {\n  817 |                 NodeName::Path(attr) => {\n  818 |                     attr.path.segments.first().map(|n| n.ident.to_string())\n  819 |                 }\n  820 |                 _ => None,\n  821 |             },\n  822 |             _ => None,\n  823 |         };\n  824 | \n  825 |         if let NodeAttribute::Attribute(a) = a {\n  826 |             if let Some(Tuple(_)) = a.value() {\n  827 |                 return Ordering::Greater;\n  828 |             }\n  829 |         }\n  830 |         if let NodeAttribute::Attribute(b) = b {\n  831 |             if let Some(Tuple(_)) = b.value() {\n  832 |                 return Ordering::Less;\n  833 |             }\n  834 |         }\n  835 | \n  836 |         match (key_a.as_deref(), key_b.as_deref()) {\n  837 |             (Some(\"class\"), Some(\"class\")) | (Some(\"style\"), Some(\"style\")) => {\n  838 |                 Ordering::Equal\n  839 |             }\n  840 |             (Some(\"class\"), _) | (Some(\"style\"), _) => Ordering::Less,\n  841 |             (_, Some(\"class\")) | (_, Some(\"style\")) => Ordering::Greater,\n  842 |             _ => Ordering::Equal,\n  843 |         }\n  844 |     });","lines":40,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_macro/src/view/mod.rs#L805-L844"}]},{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`MultiAction::dispatch` / `ArcMultiAction::dispatch` guard their work behind\n`if !is_suppressing_resource_load()`, but `dispatch_sync` does not. During environments where\nresource loading is suppressed (e.g. `SuppressResourceLoad` in route-list generation), an async\n`dispatch` correctly no-ops, yet a `dispatch_sync` still pushes a submission and bumps `version`,\nproducing side effects the suppression is meant to prevent. The asymmetry is undocumented and easy\nto hit inconsistently.","fix":"If `dispatch_sync` is intended to run even under suppression, document why. Otherwise gate it the\nsame way:\n```rust\npub fn dispatch_sync(&self, value: O) {\n    if is_suppressing_resource_load() {\n        return;\n    }\n    // ...\n}\n```","locations":[{"ref":"reactive_graph/src/actions/multi_action.rs:232-235","code":"  232 |     pub fn dispatch_sync(&self, value: O) {\n  233 |         self.inner\n  234 |             .try_with_value(|inner| inner.dispatch_sync(value));\n  235 |     }","lines":4,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/actions/multi_action.rs#L232-L235"},{"ref":"reactive_graph/src/actions/multi_action.rs:562-573","code":"  562 |     pub fn dispatch_sync(&self, value: O) {\n  563 |         let submission = ArcSubmission {\n  564 |             input: ArcRwSignal::new(None),\n  565 |             value: ArcRwSignal::new(Some(value)),\n  566 |             pending: ArcRwSignal::new(false),\n  567 |             canceled: ArcRwSignal::new(false),\n  568 |         };\n  569 | \n  570 |         self.submissions\n  571 |             .try_update(|subs| subs.push(submission.clone()));\n  572 |         self.version.try_update(|n| *n += 1);\n  573 |     }","lines":12,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/actions/multi_action.rs#L562-L573"}]},{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"In the async-derived spawn loop, `pending_suspenses` is drained unconditionally after `fut.await`, before the version check that decides whether this run is still current. A stale run therefore clears (and thus signals \"done\" to) suspense task handles that may belong to a newer, still-pending run.\n\n```rust\nlet new_value = fut.await;\n\nlet latest_version = {\n    let mut guard = inner.write().or_poisoned();\n    drop(mem::take(&mut guard.pending_suspenses)); // drops ALL pending handles, even if stale\n    guard.version\n};\n\nif latest_version == this_version {\n    Self::set_inner_value(...).await;\n}\n```\n\nEach run moves the currently-registered `suspenses` into `pending_suspenses` at its start (see lines 372-377) and drops them here at its end. When two runs overlap (a source changes again before the first future resolves), the earlier-finishing run drops the combined `pending_suspenses` - including the later run's handles. Dropping a `TaskHandle` removes it from the suspense set, so the `Suspense` boundary can resolve prematurely (content flashes/settles before the newer computation is actually ready).","fix":"Only clear the pending suspenses when this run is the current one:\n\n```rust\nlet new_value = fut.await;\n\nlet latest_version = inner.read().or_poisoned().version;\n\nif latest_version == this_version {\n    {\n        let mut guard = inner.write().or_poisoned();\n        drop(mem::take(&mut guard.pending_suspenses));\n    }\n    Self::set_inner_value(new_value, value, wakers, inner, loading, Some(ready_tx)).await;\n}\n```","locations":[{"ref":"reactive_graph/src/computed/async_derived/arc_async_derived.rs:380-390","code":"  380 |                                     let new_value = fut.await;\n  381 | \n  382 |                                     let latest_version = {\n  383 |                                         let mut guard = inner.write().or_poisoned();\n  384 |                                         drop(mem::take(&mut guard.pending_suspenses));\n  385 |                                         guard.version\n  386 |                                     };\n  387 | \n  388 |                                     if latest_version == this_version {\n  389 |                                         Self::set_inner_value(new_value, value, wakers, inner, loading, Some(ready_tx)).await;\n  390 |                                     }","lines":11,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/computed/async_derived/arc_async_derived.rs#L380-L390"}]},{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`untrack` (and `untrack_with_diagnostics`) use `Observer::take`, which saves only the previous subscriber and drops its `untracked` flag; when the guard restores it via `Observer::set`, the observer is unconditionally re-installed with `untracked: false`.\n\n```rust\nfn take() -> SetObserverOnDrop {\n    SetObserverOnDrop(\n        OBSERVER.with_borrow_mut(Option::take).map(|o| o.subscriber), // discards `untracked`\n    )\n}\n\nfn set(observer: Option<AnySubscriber>) {\n    OBSERVER.with_borrow_mut(|o| {\n        *o = observer.map(|subscriber| ObserverState { subscriber, untracked: false }) // forces false\n    });\n}\n```\n\nIf `untrack(...)` is called inside a scope established by `with_observer_untracked` (which sets `untracked: true`), the observer that is restored after `untrack` returns will have `untracked: false`. Reactive reads that occur later in that same untracked scope will then subscribe (track) even though the surrounding context requested no tracking, causing spurious dependencies.","fix":"Preserve and restore the full `ObserverState` (including `untracked`) instead of only the subscriber. E.g. make `SetObserverOnDrop` carry `Option<ObserverState>` and restore it verbatim:\n\n```rust\nstruct SetObserverOnDrop(Option<ObserverState>);\n\nimpl Drop for SetObserverOnDrop {\n    fn drop(&mut self) {\n        OBSERVER.with_borrow_mut(|o| *o = self.0.take());\n    }\n}\n\nfn take() -> SetObserverOnDrop {\n    SetObserverOnDrop(OBSERVER.with_borrow_mut(Option::take))\n}\n```\n(and adjust `replace`/`replace_untracked` accordingly to store/return `ObserverState`).","locations":[{"ref":"reactive_graph/src/graph/subscriber.rs:53-66","code":"   53 |     fn take() -> SetObserverOnDrop {\n   54 |         SetObserverOnDrop(\n   55 |             OBSERVER.with_borrow_mut(Option::take).map(|o| o.subscriber),\n   56 |         )\n   57 |     }\n   58 | \n   59 |     fn set(observer: Option<AnySubscriber>) {\n   60 |         OBSERVER.with_borrow_mut(|o| {\n   61 |             *o = observer.map(|subscriber| ObserverState {\n   62 |                 subscriber,\n   63 |                 untracked: false,\n   64 |             })\n   65 |         });\n   66 |     }","lines":14,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/graph/subscriber.rs#L53-L66"}]},{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`SignalTypes::eq` compares two `DerivedSignal` variants with\n`std::ptr::eq(l0, r0)` where `l0`/`r0` are `&Arc<dyn Fn() -> T + Send + Sync>`.\n`std::ptr::eq` here compares the addresses of the two `Arc` *handles*\n(the enum fields), not the addresses of the pointed-to closures, so it is\n**always `false`** for two distinct `SignalTypes`/`ArcSignal` values - even for\na value compared against its own clone:\n```rust\n(Self::DerivedSignal(l0), Self::DerivedSignal(r0)) => {\n    std::ptr::eq(l0, r0) // compares &Arc addresses, never the Arc pointees\n}\n```\nSince `ArcSignal::eq` delegates to `SignalTypes::eq`, two clones of the same\nderived `ArcSignal` never compare equal. The intent is clearly to test whether\nthe two share the same underlying closure allocation, which requires\n`Arc::ptr_eq`.","fix":"```rust\n(Self::DerivedSignal(l0), Self::DerivedSignal(r0)) => Arc::ptr_eq(l0, r0),\n```","locations":[{"ref":"reactive_graph/src/wrappers.rs:88-90","code":"   88 |                 (Self::DerivedSignal(l0), Self::DerivedSignal(r0)) => {\n   89 |                     std::ptr::eq(l0, r0)\n   90 |                 }","lines":3,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/wrappers.rs#L88-L90"}]},{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`SignalSetterTypes::eq` compares two `Mapped` variants with\n`std::ptr::eq(l0, r0)` where `l0`/`r0` are `&ArenaItem<Box<dyn Fn(T) + Send +\nSync>, S>`. As with the `DerivedSignal` case, `std::ptr::eq` compares the\naddresses of the two `ArenaItem` *fields* (which live inside two distinct\n`SignalSetterTypes` values), not the arena slots they identify, so it is\n**always `false`** - including comparing a `Copy` `SignalSetter` against a copy\nof itself:\n```rust\n(Self::Mapped(l0), Self::Mapped(r0)) => std::ptr::eq(l0, r0),\n```\n`ArenaItem` implements `PartialEq` (it is compared directly elsewhere, e.g. in\n`Signal::eq` via `self.inner == other.inner`), so the comparison should use\nvalue equality.","fix":"```rust\n(Self::Mapped(l0), Self::Mapped(r0)) => l0 == r0,\n```","locations":[{"ref":"reactive_graph/src/wrappers.rs:2322-2333","code":" 2322 |     impl<T, S> PartialEq for SignalSetterTypes<T, S>\n 2323 |     where\n 2324 |         T: PartialEq,\n 2325 |     {\n 2326 |         fn eq(&self, other: &Self) -> bool {\n 2327 |             match (self, other) {\n 2328 |                 (Self::Write(l0), Self::Write(r0)) => l0 == r0,\n 2329 |                 (Self::Mapped(l0), Self::Mapped(r0)) => std::ptr::eq(l0, r0),\n 2330 |                 _ => false,\n 2331 |             }\n 2332 |         }\n 2333 |     }","lines":12,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/wrappers.rs#L2322-L2333"}]},{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`AtKeyed::writer` acquires the collection's value write-lock **before** resolving\nthe key's index, and index resolution may need to read the same value:\n```rust\nfn writer(&self) -> Option<Self::Writer> {\n    let mut inner = self.inner.writer()?;   // holds the store value WRITE lock\n    inner.untrack();\n    let index = self.resolve_index()?;      // may read the value\n    ...\n}\n```\n`resolve_index` (line 542) calls `with_field_keys(inner_path, .., || self.inner.latest_keys())`.\nIf the `KeyMap` has no entry for `inner_path` yet (the field has never been\niterated/tracked), the `initialize` closure `latest_keys()` runs, which calls\n`self.reader()` and attempts a **read** lock on the value while this thread still\nholds the **write** lock from `self.inner.writer()`. `Plain::try_new` fails under\nthat contention, so `latest_keys()` returns an empty vec, `FieldKeys` is\ninitialized empty, `keys.get(&self.key)` returns `None`, and `writer()` returns\n`None` — the write is silently dropped. Normal usage initializes keys first (via\n`track`/iteration), so this only bites when the very first access to a keyed\nfield is a write on a freshly-constructed `AtKeyed`. The reader path is unaffected\n(read locks are shared).","fix":"Resolve the index (and thus force key initialization) *before* taking the value\nwrite lock:\n```rust\nfn writer(&self) -> Option<Self::Writer> {\n    let index = self.resolve_index()?;   // initializes keys without holding the write lock\n    let mut inner = self.inner.writer()?;\n    inner.untrack();\n    let triggers = self.triggers_for_current_path();\n    ...\n}\n```","locations":[{"ref":"reactive_stores/src/keyed.rs:637-656","code":"  637 |     fn writer(&self) -> Option<Self::Writer> {\n  638 |         let mut inner = self.inner.writer()?;\n  639 |         inner.untrack();\n  640 |         let index = self.resolve_index()?;\n  641 |         let triggers = self.triggers_for_current_path();\n  642 |         Some(WriteGuard::new(\n  643 |             triggers,\n  644 |             MappedMutArc::new(\n  645 |                 inner,\n  646 |                 {\n  647 |                     let key = self.key.clone();\n  648 |                     move |n| n.keyed(index, &key)\n  649 |                 },\n  650 |                 {\n  651 |                     let key = self.key.clone();\n  652 |                     move |n| n.keyed_mut(index, &key)\n  653 |                 },\n  654 |             ),\n  655 |         ))\n  656 |     }","lines":20,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_stores/src/keyed.rs#L637-L656"}]},{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`FieldKeys::new` initializes `current_key` from `keys.len()` (the deduplicated\nmap length) rather than `from_keys.len()` (the number of segments actually\nassigned):\n```rust\nfor (idx, key) in from_keys.into_iter().enumerate() {\n    let segment = idx.into();\n    keys.insert(key, (segment, idx));   // segments span 0..from_keys.len()-1\n}\nSelf {\n    spare_keys: Vec::new(),\n    current_key: keys.len().saturating_sub(1),   // uses deduped length\n    keys,\n}\n```\nSegments are handed out as `0..from_keys.len()-1`, but `current_key` is set to\n`keys.len()-1`. If `from_keys` contains duplicate keys, `keys.len() <\nfrom_keys.len()`, so `next_key()` (which returns `current_key + 1`) can return a\nsegment value that is still in use by an existing entry, producing a\n`StorePathSegment` collision (two distinct keys mapping to the same reactive\ntrigger path). Without duplicates the two lengths are equal and there is no bug.","fix":"Base `current_key` on the number of segments actually assigned:\n```rust\nlet len = keys.len();\nlet mut segment_high_water = 0usize;\nfor (idx, key) in from_keys.into_iter().enumerate() {\n    keys.insert(key, (idx.into(), idx));\n    segment_high_water = idx;\n}\nSelf {\n    spare_keys: Vec::new(),\n    current_key: segment_high_water,   // highest segment actually used\n    keys,\n}\n```\n(Or reject duplicate keys.)","locations":[{"ref":"reactive_stores/src/lib.rs:339-354","code":"  339 |     pub fn new(from_keys: Vec<K>) -> Self {\n  340 |         let mut keys = FxHashMap::with_capacity_and_hasher(\n  341 |             from_keys.len(),\n  342 |             Default::default(),\n  343 |         );\n  344 |         for (idx, key) in from_keys.into_iter().enumerate() {\n  345 |             let segment = idx.into();\n  346 |             keys.insert(key, (segment, idx));\n  347 |         }\n  348 | \n  349 |         Self {\n  350 |             spare_keys: Vec::new(),\n  351 |             current_key: keys.len().saturating_sub(1),\n  352 |             keys,\n  353 |         }\n  354 |     }","lines":16,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_stores/src/lib.rs#L339-L354"}]},{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ParamSegment::test` (and identically `WildcardSegment::test` and `OptionalParamSegment::test`)\nsilently drops the first character of `path` when `path` does not begin with `/`. The first char is\nconsumed by `test.next()` to probe for a leading slash and is never re-added when it is not `/`:\n```rust\nlet mut test = path.chars();\n// match an initial /\nif let Some('/') = test.next() {   // consumes first char unconditionally\n    matched_len += 1;\n    param_offset = 1;\n}\nfor char in test {                 // starts from the *second* char if no leading '/'\n    ...\n}\n```\nFor `path = \"foo\"`, `test.next()` eats `f`, the loop only sees `oo`, and the extracted value becomes\n`\"fo\"` with `remaining = \"o\"` - wrong. Today the horizontal-matching contract guarantees each segment\nis tested against a string that is empty or begins with `/`, so this is not hit in normal routing,\nbut it is a fragile, easy-to-break invariant duplicated across all three dynamic segment types.","fix":"Use a peekable iterator so a non-slash first char is not discarded:\n```rust\nlet mut test = path.chars().peekable();\nif let Some('/') = test.peek() {\n    test.next();\n    matched_len += 1;\n    param_offset = 1;\n}\nfor char in test {\n    ...\n}\n```","locations":[{"ref":"router/src/matching/horizontal/param_segments.rs:46-63","code":"   46 |         let mut test = path.chars();\n   47 | \n   48 |         // match an initial /\n   49 |         if let Some('/') = test.next() {\n   50 |             matched_len += 1;\n   51 |             param_offset = 1;\n   52 |         }\n   53 |         for char in test {\n   54 |             // when we get a closing /, stop matching\n   55 |             if char == '/' {\n   56 |                 break;\n   57 |             }\n   58 |             // otherwise, push into the matched param\n   59 |             else {\n   60 |                 matched_len += char.len_utf8();\n   61 |                 param_len += char.len_utf8();\n   62 |             }\n   63 |         }","lines":18,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/horizontal/param_segments.rs#L46-L63"},{"ref":"router/src/matching/horizontal/param_segments.rs:136-146","code":"  136 |         let mut test = path.chars();\n  137 | \n  138 |         // match an initial /\n  139 |         if let Some('/') = test.next() {\n  140 |             matched_len += 1;\n  141 |             param_offset += 1;\n  142 |         }\n  143 |         for char in test {\n  144 |             matched_len += char.len_utf8();\n  145 |             param_len += char.len_utf8();\n  146 |         }","lines":11,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/horizontal/param_segments.rs#L136-L146"},{"ref":"router/src/matching/horizontal/param_segments.rs:177-194","code":"  177 |         let mut test = path.chars();\n  178 | \n  179 |         // match an initial /\n  180 |         if let Some('/') = test.next() {\n  181 |             matched_len += 1;\n  182 |             param_offset = 1;\n  183 |         }\n  184 |         for char in test {\n  185 |             // when we get a closing /, stop matching\n  186 |             if char == '/' {\n  187 |                 break;\n  188 |             }\n  189 |             // otherwise, push into the matched param\n  190 |             else {\n  191 |                 matched_len += char.len_utf8();\n  192 |                 param_len += char.len_utf8();\n  193 |             }\n  194 |         }","lines":18,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/horizontal/param_segments.rs#L177-L194"}]},{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`has_scheme` in `resolve_path` under-detects valid URL schemes: it only accepts ASCII letters and\ndigits in the scheme, but RFC 3986 schemes may also contain `+`, `-`, and `.`:\n```rust\nprefix.chars().all(\n    |c: char| matches!(c, 'a'..='z' | 'A'..='Z' | '0'..='9'),\n)\n```\nAs a result absolute URLs such as `git+ssh://host/repo`, `custom-scheme://x`, or `x.y://z` fail the\n`has_scheme` check and are treated as relative paths, so `resolve_path` will incorrectly prepend the\nbase/current path to them.","fix":"```rust\nprefix.chars().enumerate().all(|(i, c): (usize, char)| {\n    if i == 0 {\n        c.is_ascii_alphabetic()\n    } else {\n        c.is_ascii_alphanumeric() || matches!(c, '+' | '-' | '.')\n    }\n}) && !prefix.is_empty()\n```","locations":[{"ref":"router/src/matching/resolve_path.rs:32-44","code":"   32 | fn has_scheme(path: &str) -> bool {\n   33 |     path.starts_with(\"//\")\n   34 |         || path.starts_with(\"tel:\")\n   35 |         || path.starts_with(\"mailto:\")\n   36 |         || path\n   37 |             .split_once(\"://\")\n   38 |             .map(|(prefix, _)| {\n   39 |                 prefix.chars().all(\n   40 |                     |c: char| matches!(c, 'a'..='z' | 'A'..='Z' | '0'..='9'),\n   41 |                 )\n   42 |             })\n   43 |             .unwrap_or(false)\n   44 | }","lines":13,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/resolve_path.rs#L32-L44"}]},{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`IntoClass for Option<T>` does not override `should_overwrite`, so it inherits the trait default of `false`, whereas\nthe underlying full-string class types (`&str`, `String`, `Cow`, `Arc<str>`) all return `true`. `Class::to_html`\nuses `should_overwrite` to decide whether a `class=\"...\"` value should clear class fragments contributed by\n`class:name=value` directives:\n\n```rust\nfn to_html(self, _buf, class, _style, _inner_html) {\n    if self.class.should_overwrite() {   // false for Option<T>, true for &str/String/...\n        class.clear();\n    }\n    class.push(' ');\n    self.class.to_html(class);\n}\n```\n\nConsequently `class=Some(\"foo\")` behaves differently from `class=\"foo\"`: the former does not clear previously\naccumulated classes during SSR, while the latter does. This makes an optional full-class value silently inconsistent\nwith its non-optional counterpart when combined with `class:` directives on the same element.","fix":"Forward `should_overwrite` to the inner value in the `Option<T>` impl:\n\n```rust\nfn should_overwrite(&self) -> bool {\n    self.as_ref().is_some_and(IntoClass::should_overwrite)\n}\n```","locations":[{"ref":"tachys/src/html/class.rs:204-218","code":"  204 | impl<T: IntoClass> IntoClass for Option<T> {\n  205 |     type AsyncOutput = Option<T::AsyncOutput>;\n  206 |     type State = (crate::renderer::types::Element, Option<T::State>);\n  207 |     type Cloneable = Option<T::Cloneable>;\n  208 |     type CloneableOwned = Option<T::CloneableOwned>;\n  209 | \n  210 |     fn html_len(&self) -> usize {\n  211 |         self.as_ref().map_or(0, IntoClass::html_len)\n  212 |     }\n  213 | \n  214 |     fn to_html(self, class: &mut String) {\n  215 |         if let Some(t) = self {\n  216 |             t.to_html(class);\n  217 |         }\n  218 |     }","lines":15,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/class.rs#L204-L218"},{"ref":"tachys/src/html/class.rs:59-66","code":"   59 |     ) {\n   60 |         // If this is a class=\"...\" attribute (not class:name=value), clear previous value\n   61 |         if self.class.should_overwrite() {\n   62 |             class.clear();\n   63 |         }\n   64 |         class.push(' ');\n   65 |         self.class.to_html(class);\n   66 |     }","lines":8,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/class.rs#L59-L66"}]},{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ElementExt::on` always attaches the listener in the bubbling phase, ignoring `E::CAPTURE`:\n\n```rust\nfn on<E>(&self, ev: E, cb: ...) -> RemoveEventHandler<Element> {\n    on::<E, _>(ev, cb).attach(self.as_ref())   // never attach_capture\n}\n```\n\nBy contrast, the static `On` attribute honors capture (`event.rs:304-308`, `:313-319`, `:330-334`) by calling\n`attach_capture` when `E::CAPTURE` is true. As a result, attaching a `Capture<E>` event (or any descriptor with\n`CAPTURE = true`) through the runtime `ElementExt::on` helper silently registers a bubbling-phase listener instead of\na capture-phase one, so it fires in the wrong phase (or, for capture-only expectations, not before descendants as\nintended).","fix":"Mirror the static path and dispatch on `E::CAPTURE`:\n\n```rust\nfn on<E>(&self, ev: E, cb: impl FnMut(E::EventType) + 'static) -> RemoveEventHandler<Element>\nwhere ... {\n    let handler = on::<E, _>(ev, cb);\n    if E::CAPTURE {\n        handler.attach_capture(self.as_ref())\n    } else {\n        handler.attach(self.as_ref())\n    }\n}\n```","locations":[{"ref":"tachys/src/html/element/element_ext.rs:76-87","code":"   76 |     fn on<E>(\n   77 |         &self,\n   78 |         ev: E,\n   79 |         cb: impl FnMut(E::EventType) + 'static,\n   80 |     ) -> RemoveEventHandler<Element>\n   81 |     where\n   82 |         E: EventDescriptor + Send + 'static,\n   83 |         E::EventType: 'static,\n   84 |         E::EventType: From<JsValue>,\n   85 |     {\n   86 |         on::<E, _>(ev, cb).attach(self.as_ref())\n   87 |     }","lines":12,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/element/element_ext.rs#L76-L87"}]},{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`GetValue<bool> for web_sys::Element` reads the *attribute* `checked` and compares it to\nthe string `\"true\"`:\n\n```rust\nimpl GetValue<bool> for web_sys::Element {\n    fn get_value(&self) -> bool {\n        self.get_attribute(\"checked\").unwrap_or_default() == \"true\"\n    }\n}\n```\n\nThe HTML `checked` attribute is a boolean attribute: when present its value is the empty\nstring `\"\"` or `\"checked\"`, never `\"true\"`, and the live checked state lives on the\n`checked` *property*, not the attribute. So `get_value` returns `false` for an actually\nchecked element. (The sibling `GetValue<String>` similarly reads the stale `value`\nattribute rather than the `.value` property.) This is currently only reachable through the\n`group`/radio path of `bind`, so impact is limited, but the result is incorrect.","fix":"Read the live property instead of the attribute:\n\n```rust\nimpl GetValue<bool> for web_sys::Element {\n    fn get_value(&self) -> bool {\n        js_sys::Reflect::get(self, &wasm_bindgen::JsValue::from_str(\"checked\"))\n            .map(|v| v.is_truthy())\n            .unwrap_or_default()\n    }\n}\n```","locations":[{"ref":"tachys/src/reactive_graph/bind.rs:541-545","code":"  541 | impl GetValue<bool> for web_sys::Element {\n  542 |     fn get_value(&self) -> bool {\n  543 |         self.get_attribute(\"checked\").unwrap_or_default() == \"true\"\n  544 |     }\n  545 | }","lines":5,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/reactive_graph/bind.rs#L541-L545"}]},{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`IntoProperty::rebuild` for `BoolOrT<T>` rebuilds into a throw-away temporary tuple and\nnever writes the resulting `JsValue` back into the retained `state`:\n\n```rust\nfn rebuild(self, state: &mut Self::State, key: &str) {\n    let (el, prev) = state;\n    match self {\n        Self::T(s) => s.rebuild(&mut (el.clone(), prev.clone()), key),\n        Self::Bool(b) => <bool as IntoProperty>::rebuild(\n            b,\n            &mut (el.clone(), prev.clone()),\n            key,\n        ),\n    }\n}\n```\n\nThe inner `rebuild` mutates the `.1` field of the temporary `(el.clone(), prev.clone())`,\nwhich is immediately dropped, so `state.1` (the stored previous `JsValue`) is left stale\nforever. The DOM itself is still updated (the inner `rebuild` calls\n`set_property_or_value`), so the visible effect is limited, but the retained state is a\ndead write and diverges from the actual property value. It also clones `el` and `prev`\nneedlessly on every reactive update.","fix":"Compute the value once and store it back into `state`:\n\n```rust\nfn rebuild(self, state: &mut Self::State, key: &str) {\n    let (el, prev) = state;\n    match self.clone() {\n        Self::T(s) => s.rebuild(&mut (el.clone(), prev.clone()), key),\n        Self::Bool(b) => <bool as IntoProperty>::rebuild(\n            b,\n            &mut (el.clone(), prev.clone()),\n            key,\n        ),\n    }\n    *prev = self.into();\n}\n```","locations":[{"ref":"tachys/src/reactive_graph/bind.rs:598-609","code":"  598 |     fn rebuild(self, state: &mut Self::State, key: &str) {\n  599 |         let (el, prev) = state;\n  600 | \n  601 |         match self {\n  602 |             Self::T(s) => s.rebuild(&mut (el.clone(), prev.clone()), key),\n  603 |             Self::Bool(b) => <bool as IntoProperty>::rebuild(\n  604 |                 b,\n  605 |                 &mut (el.clone(), prev.clone()),\n  606 |                 key,\n  607 |             ),\n  608 |         }\n  609 |     }","lines":12,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/reactive_graph/bind.rs#L598-L609"}]},{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The microtask `queue` helper drops (indefinitely defers) any task enqueued while the queue\nis being flushed:\n\n```rust\nQUEUE.with_borrow_mut(|q| q.push(fun));\nif !PENDING.replace(true) {\n    queue_microtask(|| {\n        let tasks = QUEUE.take();\n        for task in tasks {\n            task();\n        }\n        PENDING.set(false);\n    })\n}\n```\n\n`PENDING` stays `true` for the entire duration of the flush. If any `task()` calls `queue`\nagain, its closure is pushed onto `QUEUE`, but `PENDING.replace(true)` returns `true`, so\nno new microtask is scheduled. After the `for` loop finishes, `PENDING.set(false)` runs,\nleaving the freshly-pushed task sitting in `QUEUE` with nothing scheduled to run it until\nthe next unrelated `queue` call. Currently the only caller is `set_property_or_value` for\n`\"value\"`, which does not re-enter, so it is latent - but the mechanism is unsound.","fix":"Re-check the queue after draining and reschedule if anything was enqueued during the flush:\n\n```rust\nQUEUE.with_borrow_mut(|q| q.push(fun));\nif !PENDING.replace(true) {\n    fn flush() {\n        let tasks = QUEUE.take();\n        for task in tasks {\n            task();\n        }\n        if QUEUE.with_borrow(|q| !q.is_empty()) {\n            queue_microtask(flush);\n        } else {\n            PENDING.set(false);\n        }\n    }\n    queue_microtask(flush);\n}\n```","locations":[{"ref":"tachys/src/renderer/dom.rs:58-76","code":"   58 | fn queue(fun: Box<dyn FnOnce()>) {\n   59 |     use std::cell::{Cell, RefCell};\n   60 | \n   61 |     thread_local! {\n   62 |         static PENDING: Cell<bool> = const { Cell::new(false) };\n   63 |         static QUEUE: RefCell<Vec<Box<dyn FnOnce()>>> = RefCell::new(Vec::new());\n   64 |     }\n   65 | \n   66 |     QUEUE.with_borrow_mut(|q| q.push(fun));\n   67 |     if !PENDING.replace(true) {\n   68 |         queue_microtask(|| {\n   69 |             let tasks = QUEUE.take();\n   70 |             for task in tasks {\n   71 |                 task();\n   72 |             }\n   73 |             PENDING.set(false);\n   74 |         })\n   75 |     }\n   76 | }","lines":19,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/renderer/dom.rs#L58-L76"}]},{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Dom::first_child` and `Dom::next_sibling` gate their hot-reload marker-skipping logic on\n`#[cfg(debug_assertions)]` only, whereas the rest of the crate consistently gates\nequivalent debug/hydration behavior on `#[cfg(any(debug_assertions, leptos_debuginfo))]`\n(see e.g. `hydration.rs:141-157`, `lib.rs:101` and the `CURRENTLY_HYDRATING` machinery).\n\n```rust\npub fn first_child(node: &Node) -> Option<Node> {\n    #[cfg(debug_assertions)]\n    { /* skip `hot-reload` comment markers */ }\n    #[cfg(not(debug_assertions))]\n    { node.first_child() }\n}\n```\n\nIn a release build compiled with `leptos_debuginfo` (the flag used to keep debug-style\nhydration paths in optimized builds), the `hot-reload` comment markers are *not* skipped\nhere even though the hydration cursor logic elsewhere is active, which can desynchronize\nthe hydration walk.","fix":"Use the same cfg predicate as the rest of the crate:\n\n```rust\npub fn first_child(node: &Node) -> Option<Node> {\n    #[cfg(any(debug_assertions, leptos_debuginfo))]\n    { /* skip `hot-reload` comment markers */ }\n    #[cfg(not(any(debug_assertions, leptos_debuginfo)))]\n    { node.first_child() }\n}\n```\n(apply the same change to `next_sibling`).","locations":[{"ref":"tachys/src/renderer/dom.rs:161-209","code":"  161 |     pub fn first_child(node: &Node) -> Option<Node> {\n  162 |         #[cfg(debug_assertions)]\n  163 |         {\n  164 |             let node = node.first_child();\n  165 |             // if it's a comment node that starts with hot-reload, it's a marker that should be\n  166 |             // ignored\n  167 |             if let Some(node) = node.as_ref() {\n  168 |                 if node.node_type() == 8\n  169 |                     && node\n  170 |                         .text_content()\n  171 |                         .unwrap_or_default()\n  172 |                         .starts_with(\"hot-reload\")\n  173 |                 {\n  174 |                     return Self::next_sibling(node);\n  175 |                 }\n  176 |             }\n  177 | \n  178 |             node\n  179 |         }\n  180 |         #[cfg(not(debug_assertions))]\n  181 |         {\n  182 |             node.first_child()\n  183 |         }\n  184 |     }\n  185 | \n  186 |     pub fn next_sibling(node: &Node) -> Option<Node> {\n  187 |         #[cfg(debug_assertions)]\n  188 |         {\n  189 |             let node = node.next_sibling();\n  190 |             // if it's a comment node that starts with hot-reload, it's a marker that should be\n  191 |             // ignored\n  192 |             if let Some(node) = node.as_ref() {\n  193 |                 if node.node_type() == 8\n  194 |                     && node\n  195 |                         .text_content()\n  196 |                         .unwrap_or_default()\n  197 |                         .starts_with(\"hot-reload\")\n  198 |                 {\n  199 |                     return Self::next_sibling(node);\n  200 |                 }\n  201 |             }\n  202 | \n  203 |             node\n  204 |         }\n  205 |         #[cfg(not(debug_assertions))]\n  206 |         {\n  207 |             node.next_sibling()\n  208 |         }\n  209 |     }","lines":49,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e erates over *all* states and only then falls back to the marker. As a result a sibling view can fail to mount before a keyed list whose first element has no DOM presence, even though the list marker is always available.","fix":"Iterate all rendered items and fall back to the marker, mirroring `VecState`:\n\n```rust\nfn insert_before_this(&self, child: &mut dyn Mountable) -> bool {\n    for item in self.rendered_items.iter().flatten() {\n        if item.1.insert_before_this(child) {\n            return true;\n        }\n    }\n    self.marker.insert_before_this(child)\n}\n```","locations":[{"ref":"tachys/src/view/keyed.rs:473-484","code":"  473 |     fn insert_before_this(&self, child: &mut dyn Mountable) -> bool {\n  474 |         self.rendered_items\n  475 |             .first()\n  476 |             .map(|item| {\n  477 |                 if let Some((_, item)) = item {\n  478 |                     item.insert_before_this(child)\n  479 |                 } else {\n  480 |                     false\n  481 |                 }\n  482 |             })\n  483 |             .unwrap_or_else(|| self.marker.insert_before_this(child))\n  484 |     }","lines":12,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/keyed.rs#L473-L484"},{"ref":"tachys/src/view/iterators.rs:252-259","code":"  252 |     fn insert_before_this(&self, child: &mut dyn Mountable) -> bool {\n  253 |         for state in &self.states {\n  254 |             if state.insert_before_this(child) {\n  255 |                 return true;\n  256 |             }\n  257 |         }\n  258 |         self.marker.insert_before_this(child)\n  259 |     }","lines":8,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/iterators.rs#L252-L259"}]},{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Static<V>` renders inconsistently between `to_html_with_buf` and `to_template`, which can cause hydration/escaping mismatches:\n\n- `to_html_with_buf` HTML-escapes the value (`html_escape::encode_text(V)`) and, for an empty `V`, emits a single space `' '` to guarantee a text node exists:\n```rust\nif V.is_empty() && escape {\n    buf.push(' ');\n} else if escape {\n    let escaped = html_escape::encode_text(V);\n    buf.push_str(&escaped);\n} else {\n    buf.push_str(V);\n}\n```\n- `to_template` emits `V` verbatim (no escaping) and emits nothing for an empty `V`:\n```rust\nbuf.push_str(V);   // TEMPLATE = V, unescaped, no space for empty V\n```\n\nSo a `Static<V>` hydrated from a `<template>` (`FROM_SERVER = false`) expects raw/absent text, while the same value rendered server-side (`FROM_SERVER = true`) produces escaped text or a space. For an empty `V` the template has no text node but `hydrate` calls `Text::cast_from(cursor.current())`, which can fail.","fix":"Make `to_template` match `to_html_with_buf`: escape `V` and emit the same space placeholder for empty `V`.\n\n```rust\nfn to_template(buf: &mut String, _c: &mut String, _s: &mut String, _i: &mut String, position: &mut Position) {\n    if matches!(*position, Position::NextChildAfterText) {\n        buf.push_str(\"<!>\");\n    }\n    if V.is_empty() {\n        buf.push(' ');\n    } else {\n        buf.push_str(&html_escape::encode_text(V));\n    }\n    *position = Position::NextChildAfterText;\n}\n```\n(and keep `TEMPLATE`/`to_html` consistent with whichever escaping policy is chosen).","locations":[{"ref":"tachys/src/view/static_types.rs:196-205","code":"  196 |         if V.is_empty() && escape {\n  197 |             buf.push(' ');\n  198 |         } else if escape {\n  199 |             let escaped = html_escape::encode_text(V);\n  200 |             buf.push_str(&escaped);\n  201 |         } else {\n  202 |             buf.push_str(V);\n  203 |         }\n  204 |         *position = Position::NextChildAfterText;\n  205 |     }","lines":10,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/static_types.rs#L196-L205"},{"ref":"tachys/src/view/static_types.rs:261-277","code":"  261 | impl<const V: &'static str> ToTemplate for Static<V> {\n  262 |     const TEMPLATE: &'static str = V;\n  263 | \n  264 |     fn to_template(\n  265 |         buf: &mut String,\n  266 |         _class: &mut String,\n  267 |         _style: &mut String,\n  268 |         _inner_html: &mut String,\n  269 |         position: &mut Position,\n  270 |     ) {\n  271 |         if matches!(*position, Position::NextChildAfterText) {\n  272 |             buf.push_str(\"<!>\")\n  273 |         }\n  274 |         buf.push_str(V);\n  275 |         *position = Position::NextChildAfterText;\n  276 |     }\n  277 | }","lines":17,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/static_types.rs#L261-L277"}]},{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`<() as RenderHtml>::to_html_with_buf` only writes its `<!>` marker (and only advances\n`position`) when `escape == true`:\n\n```rust\nfn to_html_with_buf(self, buf: &mut String, position: &mut Position, escape: bool, ...) {\n    if escape {\n        buf.push_str(\"<!>\");\n        *position = Position::NextChild;\n    }\n}\n```\n\nBut `<() as RenderHtml>::hydrate` *always* consumes a placeholder:\n\n```rust\nfn hydrate<const FROM_SERVER: bool>(self, cursor: &Cursor, position: &PositionState) -> Self::State {\n    let marker = cursor.next_placeholder(position);\n    position.set(Position::NextChild);\n    marker\n}\n```\n\nIn a non-escaping context (`textarea`/`script`/`style`/`noscript`, `ESCAPE_CHILDREN =\nfalse`), SSR emits nothing for `()` while hydration still expects a `<!>` comment node,\nso the cursor desynchronizes. This is the same class of SSR/hydrate asymmetry as the\nempty-`&str` case, just for the unit view. Additionally, when `escape == false` the\n`position` is left unchanged, which can further misalign sibling positioning versus the\n`escape == true` path.","fix":"Emit the marker (and update `position`) unconditionally so SSR matches `hydrate`, which\nalways consumes a placeholder:\n\n```rust\nfn to_html_with_buf(self, buf: &mut String, position: &mut Position, _escape: bool, ...) {\n    buf.push_str(\"<!>\");\n    *position = Position::NextChild;\n}\n```","locations":[{"ref":"tachys/src/view/tuples.rs:31-43","code":"   31 |     fn to_html_with_buf(\n   32 |         self,\n   33 |         buf: &mut String,\n   34 |         position: &mut Position,\n   35 |         escape: bool,\n   36 |         _mark_branches: bool,\n   37 |         _extra_attrs: Vec<AnyAttribute>,\n   38 |     ) {\n   39 |         if escape {\n   40 |             buf.push_str(\"<!>\");\n   41 |             *position = Position::NextChild;\n   42 |         }\n   43 |     }","lines":13,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/tuples.rs#L31-L43"},{"ref":"tachys/src/view/tuples.rs:45-53","code":"   45 |     fn hydrate<const FROM_SERVER: bool>(\n   46 |         self,\n   47 |         cursor: &Cursor,\n   48 |         position: &PositionState,\n   49 |     ) -> Self::State {\n   50 |         let marker = cursor.next_placeholder(position);\n   51 |         position.set(Position::NextChild);\n   52 |         marker\n   53 |     }","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/view/tuples.rs#L45-L53"}]},{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"For `IntoProperty` on `Option<$prop_type>` (and `Option<&str>` / `Option<Arc<str>>`),\n`build` and `hydrate` only call `set_property_or_value` when the value is `Some`, but\n`rebuild` calls it unconditionally, even for `None`:\n\n```rust\n// build / hydrate\nlet was_some = self.is_some();\nlet value = self.into();\nif was_some {\n    Rndr::set_property_or_value(el, key, &value);\n}\n// rebuild\nfn rebuild(self, state: &mut Self::State, key: &str) {\n    let (el, prev) = state;\n    let value = self.into();               // None -> JsValue null\n    Rndr::set_property_or_value(el, key, &value);  // always runs\n    *prev = value;\n}\n```\n\nWhen the value is `None`, `self.into()` yields a JS `null`/`undefined`, and `rebuild`\nwrites it to the property, whereas `build`/`hydrate` skip it entirely. Setting the property\nto `null` on a `Some -> None` transition is arguably intentional (to clear it), but doing\nit on every `None -> None` rebuild is a redundant DOM write and is inconsistent with the\nbuild path.","fix":"Track whether a value is currently set and only touch the property on real transitions,\ne.g.:\n\n```rust\nfn rebuild(self, state: &mut Self::State, key: &str) {\n    let (el, prev) = state;\n    let value = self.into();\n    if !value.is_null() && !value.is_undefined() {\n        Rndr::set_property_or_value(el, key, &value);\n    } else if !prev.is_null() && !prev.is_undefined() {\n        // was set, now cleared\n        Rndr::set_property_or_value(el, key, &value);\n    }\n    *prev = value;\n}\n```","locations":[{"ref":"tachys/src/html/property.rs:268-273","code":"  268 |             fn rebuild(self, state: &mut Self::State, key: &str) {\n  269 |                 let (el, prev) = state;\n  270 |                 let value = self.into();\n  271 |                 Rndr::set_property_or_value(el, key, &value);\n  272 |                 *prev = value;\n  273 |             }","lines":6,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/property.rs#L268-L273"},{"ref":"tachys/src/html/property.rs:362-367","code":"  362 |             fn rebuild(self, state: &mut Self::State, key: &str) {\n  363 |                 let (el, prev) = state;\n  364 |                 let value = JsVal }","lines":12,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos_server/src/resource.rs#L850-L861"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"The macro-generated tuple `MatchNestedRoutes` impls (arities 3..=16) fabricate a positional\n`RouteMatchId($count)` (0..=15) instead of propagating the real id returned by the inner\n`match_nested`, unlike the hand-written 2-tuple impl and the `StaticVec` impl which forward the real\nid:\n```rust\n// macro (3..=16): discards inner id, uses a positional constant\n$(if let (Some((_, matched)), remaining) = $ty.match_nested(path) {\n    return (Some((RouteMatchId($count), $either::$ty(matched))), remaining);\n})*\n```\n```rust\n// hand-written (A, B): forwards the real inner id\nif let (Some((id, matched)), remaining) = A.match_nested(path) {\n    return (Some((id, Either::Left(matched))), remaining);\n}\n```\nIn practice the outer `RouteMatchId` returned here is discarded by all callers (`RouteDefs::match_route`\ntakes `.1`, and `nested/mod.rs` binds `Some((_, child))`), and the id that actually drives outlet\ndiffing is `NestedMatch.id` obtained via `MatchInterface::as_id`, so there is no functional bug today.\nBut the inconsistency is a latent trap: any code that starts relying on the tuple's returned id (a\n`pub` trait contract) will see positional 0..=15 collisions across sibling routes for arities >= 3 but\ncorrect unique ids for arity 2.","fix":"Forward the real inner id in the macro, matching the 2-tuple/`StaticVec` behavior:\n```rust\n$(if let (Some((id, matched)), remaining) = $ty.match_nested(path) {\n    return (Some((id, $either::$ty(matched))), remaining);\n})*\n```\n(the `$count` metavariable can then be dropped from the `tuples!` invocations).","locations":[{"ref":"router/src/matching/nested/tuples.rs:299-307","code":"  299 |             fn match_nested<'a>(&'a self, path: &'a str) -> (Option<(RouteMatchId, Self::Match)>, &'a str) {\n  300 |                 #[allow(non_snake_case)]\n  301 | \n  302 |                 let ($($ty,)*) = &self;\n  303 |                 $(if let (Some((_, matched)), remaining) = $ty.match_nested(path) {\n  304 |                     return (Some((RouteMatchId($count), $either::$ty(matched))), remaining);\n  305 |                 })*\n  306 |                 (None, path)\n  307 |             }","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/nested/tuples.rs#L299-L307"},{"ref":"router/src/matching/nested/tuples.rs:164-177","code":"  164 |     fn match_nested<'a>(\n  165 |         &'a self,\n  166 |         path: &'a str,\n  167 |     ) -> (Option<(RouteMatchId, Self::Match)>, &'a str) {\n  168 |         #[allow(non_snake_case)]\n  169 |         let (A, B) = &self;\n  170 |         if let (Some((id, matched)), remaining) = A.match_nested(path) {\n  171 |             return (Some((id, Either::Left(matched))), remaining);\n  172 |         }\n  173 |         if let (Some((id, matched)), remaining) = B.match_nested(path) {\n  174 |             return (Some((id, Either::Right(matched))), remaining);\n  175 |         }\n  176 |         (None, path)\n  177 |     }","lines":14,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/router/src/matching/nested/tuples.rs#L164-L177"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`StreamingText` advertises `CONTENT_TYPE = \"text/plain\"`, but both the request and\nresponse codecs for `TextStream` send the body with `Streaming::CONTENT_TYPE`\n(`\"application/octet-stream\"`) instead of `StreamingText::CONTENT_TYPE`:\n\n```rust\n// IntoReq for StreamingText\nRequest::try_new_post_streaming(path, accepts, Streaming::CONTENT_TYPE, ...)\n\n// IntoRes for TextStream\nResponse::try_from_stream(Streaming::CONTENT_TYPE, ...)\n`` r the child argument:\n\n```js\nfn append_child(id: u32, id2: u32) {\n    \"this.nodes[$id$].appendChild(nodes[$id2$]);\"\n}\n```\n\nEvery other generated function uses `this.nodes[...]`. As written this would throw a `ReferenceError` (`nodes is not defined`) at runtime. (The function is currently unused because `insert_node` uses `insert_before`, and the module is not compiled at all - see the dead-code finding - but the JS is still wrong.)","fix":"```js\nfn append_child(id: u32, id2: u32) {\n    \"this.nodes[$id$].appendChild(this.nodes[$id2$]);\"\n}\n```","locations":[{"ref":"tachys/src/renderer/sledgehammer.rs:94-96","code":"   94 |     fn append_child(id: u32, id2: u32) {\n   95 |         \"this.nodes[$id$].appendChild(nodes[$id2$]);\"\n   96 |     }","lines":3,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/renderer/sledgehammer.rs#L94-L96"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The Actix `redirect` fallback logs \"Couldn't retrieve either Parts or\nResponseOptions while trying to redirect().\" `Parts` is Axum terminology; the\nActix integration retrieves a `Request` (via `use_context::<Request>()`), not\n`Parts`. The message is copy-pasted from the Axum integration and names a type\nthat does not apply here.","fix":"Reword the Actix message to reference `Request` instead of `Parts`.","locations":[{"ref":"integrations/actix/src/lib.rs:259-268","code":"  259 |     } else {\n  260 |         let msg = \"Couldn't retrieve either Parts or ResponseOptions while \\\n  261 |                    trying to redirect().\";\n  262 | \n  263 |         #[cfg(feature = \"tracing\")]\n  264 |         tracing::warn!(\"{}\", &msg);\n  265 | \n  266 |         #[cfg(not(feature = \"tracing\"))]\n  267 |         eprintln!(\"{}\", &msg);\n  268 |     }","lines":10,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6 chys/src/html/class.rs:597","code":"  597 |     fn into_cloneable_owned(self) -> Self::Cloneable {","lines":1,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/class.rs#L597"},{"ref":"tachys/src/html/node_ref.rs:109","code":"  109 |     fn into_cloneable_owned(self) -> Self::Cloneable {","lines":1,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/node_ref.rs#L109"},{"ref":"tachys/src/html/element/inner_html.rs:256","code":"  256 |     fn into_cloneable_owned(self) -> Self::Cloneable {","lines":1,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/element/inner_html.rs#L256"},{"ref":"tachys/src/html/element/inner_html.rs:309","code":"  309 |     fn into_cloneable_owned(self) -> Self::Cloneable {","lines":1,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/element/inner_html.rs#L309"}]},{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `impl Attribute for Style<S>`, the `to_html` parameters are misnamed relative to the\ntrait signature `fn to_html(self, buf, class, style, inner_html)` (see\n`html/attribute/mod.rs:44-50`). The second parameter (the `class` buffer) is named\n`_style` and the third (the real `style` buffer) is named `style`:\n\n```rust\nfn to_html(\n    self,\n    _buf: &mut String,\n    _style: &mut String,   // this slot is actually `class`\n    style: &mut String,    // this slot is `style`\n    _inner_html: &mut String,\n) {\n    self.style.to_html(style);\n}\n```\n\nThe behavior is correct (it writes to the positionally-correct `style` buffer), but the\nname `_style` for the class slot is misleading. `ToTemplate::to_template` for `Style`\n(lines 129-138) has the same swapped naming (`_style` then `_class`).","fix":"Rename the parameters to match the trait, e.g.:\n\n```rust\nfn to_html(\n    self,\n    _buf: &mut String,\n    _class: &mut String,\n    style: &mut String,\n    _inner_html: &mut String,\n) {\n    self.style.to_html(style);\n}\n```","locations":[{"ref":"tachys/src/html/style.rs:59-67","code":"   59 |     fn to_html(\n   60 |         self,\n   61 |         _buf: &mut String,\n   62 |         _style: &mut String,\n   63 |         style: &mut String,\n   64 |         _inner_html: &mut String,\n   65 |     ) {\n   66 |         self.style.to_html(style);\n   67 |     }","lines":9,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/style.rs#L59-L67"},{"ref":"tachys/src/html/style.rs:129-138","code":"  129 |     fn to_template(\n  130 |         _buf: &mut String,\n  131 |         _style: &mut String,\n  132 |         _class: &mut String,\n  133 |         _inner_html: &mut String,\n  134 |         _position: &mut Position,\n  135 |     ) {\n  136 |         // TODO: should there be some templating for static styles?\n  137 |     }\n  138 | }","lines":10,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/html/style.rs#L129-L138"}]},{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`MockDom::remove_node` uses a wrong `expect` message copied from `insert_node`: it says the *anchor* is not a child, but the variable being located is `child`:\n\n```rust\nlet current_pos = children\n    .iter()\n    .position(|item| item.0 == child.0)\n    .expect(\"anchor is not a child of the parent\");\n```","fix":"```rust\n    .expect(\"child is not a child of the parent\");\n```","locations":[{"ref":"tachys/src/renderer/mock_dom.rs:516-519","code":"  516 |                 let current_pos = children\n  517 |                     .iter()\n  518 |                     .position(|item| item.0 == child.0)\n  519 |                     .expect(\"anchor is not a child of the parent\");","lines":4,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/tachys/src/renderer/mock_dom.rs#L516-L519"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`LocalResourceNotifier::notify` calls `.unwrap()` on the result of `oneshot::Sender::send`, which panics if the receiver has already been dropped.\n\n```rust\npub fn notify(&mut self) {\n    if let Some(tx) = self.0.lock().or_poisoned().take() {\n        tx.send(()).unwrap();\n    }\n}\n```\n\nA `oneshot::Sender::send` returns `Err(())` when the `Receiver` half was dropped, which is a completely normal outcome (the consumer stopped listening). The rest of this crate handles exactly this case deliberately, e.g. `arc_async_derived.rs:440` does `_ = ready_tx.send(());` with a comment that a dropped receiver is expected. Here the `.unwrap()` turns that benign situation into a panic that unwinds through whatever reactive code invoked `notify`.","fix":"Ignore the send error, since a dropped receiver just means nobody is listening:\n\n```rust\npub fn notify(&mut self) {\n    if let Some(tx) = self.0.lock().or_poisoned().take() {\n        // Err just means the Receiver was dropped; nothing to notify.\n        let _ = tx.send(());\n    }\n}\n```","locations":[{"ref":"reactive_graph/src/computed/async_derived/mod.rs:130-135","code":"  130 |         /// Send the notification. If the inner channel has already been used, this does nothing.\n  131 |         pub fn notify(&mut self) {\n  132 |             if let Some(tx) = self.0.lock().or_poisoned().take() {\n  133 |                 tx.send(()).unwrap();\n  134 |             }\n  135 |         }","lines":6,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/computed/async_derived/mod.rs#L130-L135"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`IntoReq for StreamingText` silently discards stream errors and replaces them with\nempty payloads. When encoding a `TextStream<E>` into a streaming request, each item\nis `unwrap_or_default()`'d:\n\n```rust\nfn into_req(self, path: &str, accepts: &str) -> Result<Request, E> {\n    let data = self.into();\n    Request::try_new_post_streaming(\n        path,\n        accepts,\n        Streaming::CONTENT_TYPE,\n        data.0.map(|chunk| chunk.unwrap_or_default().into()),\n    )\n}\n```\n\n`data.0` is a `Stream<Item = Result<String, E>>`. Any `Err` item is converted to\n`String::default()` (an empty string), so a producer error is transformed into a\nsilent empty chunk on the wire. The receiver cannot distinguish \"the producer\nerrored\" from \"an empty chunk was sent\", and no error is surfaced to either side.\nThis is a silent data-corruption / lost-error path on a streaming boundary.","fix":"Propagate the error rather than swallowing it - e.g. terminate the outgoing stream\non the first error, or forward a sentinel. At minimum, stop mapping `Err` to an\nempty success chunk:\n\n```rust\ndata.0.map(|chunk| match chunk {\n    Ok(text) => Ok(Bytes::from(text)),\n    Err(e) => Err(e),\n})\n```\n\nand thread the fallible stream through a streaming API that can report the error,\ninstead of `unwrap_or_default()`.","locations":[{"ref":"server_fn/src/codec/stream.rs:209-224","code":"  209 | impl<E, T, Request> IntoReq<StreamingText, Request, E> for T\n  210 | where\n  211 |     Request: ClientReq<E>,\n  212 |     T: Into<TextStream<E>>,\n  213 |     E: FromServerFnError,\n  214 | {\n  215 |     fn into_req(self, path: &str, accepts: &str) -> Result<Request, E> {\n  216 |         let data = self.into();\n  217 |         Request::try_new_post_streaming(\n  218 |             path,\n  219 |             accepts,\n  220 |             Streaming::CONTENT_TYPE,\n  221 |             data.0.map(|chunk| chunk.unwrap_or_default().into()),\n  222 |         )\n  223 |     }\n  224 | }","lines":16,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/server_fn/src/codec/stream.rs#L209-L224"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The CSS hot-reload handler does `link.getAttribute(\"href\").includes(msg.css)` for\nevery `<link>` on the page. `getAttribute(\"href\")` returns `null` for any `<link>`\nwithout an `href` (e.g. some `<link rel=\"preload\">` or module links), and\n`null.includes(...)` throws a `TypeError`, aborting the loop and breaking CSS\nhot-reload for the remaining links.","fix":"Guard against missing href, e.g. `const href = link.getAttribute(\"href\"); if (href && href.includes(msg.css)) { ... }`.","locations":[{"ref":"leptos/src/hydration/reload_script.js:15-21","code":"   15 | \t\t\tdocument.querySelectorAll(\"link\").forEach((link) => {\n   16 | \t\t\t\tif (link.getAttribute(\"href\").includes(msg.css)) {\n   17 | \t\t\t\t\tlet newHref = \"/\" + msg.css + \"?version=\" + Date.now();\n   18 | \t\t\t\t\tlink.setAttribute(\"href\", newHref);\n   19 | \t\t\t\t\tfound = true;\n   20 | \t\t\t\t}\n   21 | \t\t\t});","lines":7,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/leptos/src/hydration/reload_script.js#L15-L21"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`HashedStylesheet` reads the cargo-leptos hash file with `.expect(\"failed to read hash file\")`:\n```rust\nif hash_path.exists() {\n    let hashes = std::fs::read_to_string(&hash_path)\n        .expect(\"failed to read hash file\");\n```\nA TOCTOU race or permission problem between `hash_path.exists()` and `read_to_string` turns a\nrecoverable I/O error into a panic in the server shell function. Since this runs during response\ngeneration, a transient filesystem error crashes the request rather than degrading gracefully.","fix":"Handle the read failure without panicking, e.g.:\n```rust\nif let Ok(hashes) = std::fs::read_to_string(&hash_path) {\n    for line in hashes.lines() {\n        // ...\n    }\n}\n```\n(dropping the separate `exists()` check, which is also redundant with a fallible read).","locations":[{"ref":"meta/src/stylesheet.rs:58-79","code":"   58 |     if options.hash_files {\n   59 |         let hash_path = std::env::current_exe()\n   60 |             .map(|path| {\n   61 |                 path.parent().map(|p| p.to_path_buf()).unwrap_or_default()\n   62 |             })\n   63 |             .unwrap_or_default()\n   64 |             .join(options.hash_file.as_ref());\n   65 |         if hash_path.exists() {\n   66 |             let hashes = std::fs::read_to_string(&hash_path)\n   67 |                 .expect(\"failed to read hash file\");\n   68 |             for line in hashes.lines() {\n   69 |                 let line = line.trim();\n   70 |                 if !line.is_empty() {\n   71 |                     if let Some((file, hash)) = line.split_once(':') {\n   72 |                         if file == \"css\" {\n   73 |                             css_file_name\n   74 |                                 .push_str(&format!(\".{}\", hash.trim()));\n   75 |                         }\n   76 |                     }\n   77 |                 }\n   78 |             }\n   79 |         }","lines":22,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/meta/src/stylesheet.rs#L58-L79"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The blanket `ReactiveNode` and `Source` implementations for\n`T: AsSubscriberSet + DefinedAt` lock the subscriber set with `.read().unwrap()`\n/ `.write().unwrap()`, which **panics if the lock is poisoned**, whereas the\nconcrete `impl Source for RwLock<SubscriberSet>` in the same file uses\n`.write().or_poisoned()` (the poison-tolerant helper, already imported at the\ntop via `use or_poisoned::OrPoisoned;`). This is an inconsistent,\npoison-fragile handling of the same lock type:\n```rust\n// blanket impls (panic on poison)\nlet subs = inner.borrow().read().unwrap().clone();      // mark_subscribers_check\ninner.borrow().write().unwrap().take();                 // clear_subscribers\ninner.borrow().write().unwrap().subscribe(subscriber);  // add_subscriber\ninner.borrow().write().unwrap().unsubscribe(subscriber);// remove_subscriber\nlet subs = self.write().unwrap().take();                // RwLock<SubscriberSet>::mark_subscribers_check\n```\n```rust\n// concrete impl (recovers from poison)\nfn clear_subscribers(&self) { self.write().or_poisoned().take(); }\nfn add_subscriber(&self, subscriber: AnySubscriber) { self.write().or_poisoned().subscribe(subscriber) }\n```\nA panic that unwinds while the subscriber-set write lock is held will poison\nit, after which every notification/subscription path built on the blanket impls\nwill panic instead of continuing, contrary to the crate's documented\nfallibility/poison-resilience goal.","fix":"Replace `.unwrap()` with `.or_poisoned()` (already in scope) in the blanket\nimpls, matching the concrete impl, e.g.:\n```rust\nfn mark_subscribers_check(&self) {\n    if let Some(inner) = self.as_subscriber_set() {\n        let subs = inner.borrow().read().or_poisoned().clone();\n        for sub in subs {\n            sub.mark_dirty();\n        }\n    }\n}\n// ...and likewise `.write().or_poisoned()` in clear/add/remove_subscriber and\n// the RwLock<SubscriberSet>::mark_subscribers_check impl.\n```","locations":[{"ref":"reactive_graph/src/signal/subscriber_traits.rs:56-63","code":"   56 |     fn mark_subscribers_check(&self) {\n   57 |         if let Some(inner) = self.as_subscriber_set() {\n   58 |             let subs = inner.borrow().read().unwrap().clone();\n   59 |             for sub in subs {\n   60 |                 sub.mark_dirty();\n   61 |             }\n   62 |         }\n   63 |     }","lines":8,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/signal/subscriber_traits.rs#L56-L63"},{"ref":"reactive_graph/src/signal/subscriber_traits.rs:76-94","code":"   76 | impl<T: AsSubscriberSet + DefinedAt> Source for T {\n   77 |     fn clear_subscribers(&self) {\n   78 |         if let Some(inner) = self.as_subscriber_set() {\n   79 |             inner.borrow().write().unwrap().take();\n   80 |         }\n   81 |     }\n   82 | \n   83 |     fn add_subscriber(&self, subscriber: AnySubscriber) {\n   84 |         if let Some(inner) = self.as_subscriber_set() {\n   85 |             inner.borrow().write().unwrap().subscribe(subscriber)\n   86 |         }\n   87 |     }\n   88 | \n   89 |     fn remove_subscriber(&self, subscriber: &AnySubscriber) {\n   90 |         if let Some(inner) = self.as_subscriber_set() {\n   91 |             inner.borrow().write().unwrap().unsubscribe(subscriber)\n   92 |         }\n   93 |     }\n   94 | }","lines":19,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/signal/subscriber_traits.rs#L76-L94"},{"ref":"reactive_graph/src/signal/subscriber_traits.rs:123-128","code":"  123 |     fn mark_subscribers_check(&self) {\n  124 |         let subs = self.write().unwrap().take();\n  125 |         for sub in subs {\n  126 |             sub.mark_dirty();\n  127 |         }\n  128 |     }","lines":6,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/reactive_graph/src/signal/subscriber_traits.rs#L123-L128"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`FromServerFnError::ser` can panic via `.expect` in its error-recovery path:\n\n```rust\nfn ser(&self) -> Bytes {\n    Self::Encoder::encode(self).unwrap_or_else(|e| {\n        Self::Encoder::encode(&Self::from_server_fn_error(\n            ServerFnErrorErr::Serialization(e.to_string()),\n        ))\n        .expect(\n            \"error serializing should success at least with the Serialization error\",\n        )\n    })\n}\n```\n\n`ser()` is used all over the server/response paths (including\n`error_response`, stream error mapping, and the websocket serialize path) and is\nassumed to be infallible. The assumption \"encoding the `Serialization` error\nvariant cannot fail\" is not guaranteed for arbitrary user-provided `Encoder`\nimplementations (e.g. an encoder that rejects a particular enum shape, or a binary\nencoder that errors on a specific value). If the fallback encode fails, the whole\nserver task panics while trying to report an error. Since this runs on the server\nin response to request handling, it is a latent panic on the trust boundary for\ncustom error encoders.","fix":"Provide a truly infallible last-resort instead of `.expect`, e.g. fall back to a\nfixed byte string:\n\n```rust\nfn ser(&self) -> Bytes {\n    Self::Encoder::encode(self).unwrap_or_else(|e| {\n        Self::Encoder::encode(&Self::from_server_fn_error(\n            ServerFnErrorErr::Serialization(e.to_string()),\n        ))\n        .unwrap_or_else(|_| Bytes::from_static(b\"error serialization failed\"))\n    })\n}\n```","locations":[{"ref":"server_fn/src/error.rs:571-582","code":"  571 |     /// Serializes the custom error type to bytes, according to the encoding given by `Self::Encoding`.\n  572 |     fn ser(&self) -> Bytes {\n  573 |         Self::Encoder::encode(self).unwrap_or_else(|e| {\n  574 |             Self::Encoder::encode(&Self::from_server_fn_error(\n  575 |                 ServerFnErrorErr::Serialization(e.to_string()),\n  576 |             ))\n  577 |             .expect(\n  578 |                 \"error serializing should success at least with the \\\n  579 |                  Serialization error\",\n  580 |             )\n  581 |         })\n  582 |     }","lines":12,"link":"https://github.com/leptos-rs/leptos/blob/f81ffcd5fcb4def75ac14dcc50e1f1de6de8d336/server_fn/src/error.rs#L571-L582"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`slot_to_tokens` generates a `.dyn_attrs(vec![...])` call whenever a slot uses `attr:` attributes:\n```rust\nlet dyn_attrs = if dyn_attrs.is_empty() {\n    quote! {}\n} else {\n    quote! { .dyn_attrs(vec![#(#dyn_attrs),*]) }\n};\n// ...\nlet slot = #component_path::builder() ... .build() #dyn_attrs;\n```\nBut the slot's `DynAttrs` implementation is commented out in `slot.rs` (the whole `impl ... DynAttrs for #name` block is inside a `/* ... */`), and no `dyn_attrs` method is generated for slot structs. Therefore using an `attr:` attribute on a slot expands to a call to a method that does not exist, producing a compile error rather than the intended behavior.","fix":"Either restore a working `DynAttrs`/dyn-attrs implementation for slot structs, or reject `attr:` on slots with a clear diagnostic instead of silently generating a broken call:\n```rust\n// in slot_to_tokens, when dyn attrs are present but unsupported:\nif !dyn_attrs_list.is_empty() {\n    proc_macro_error2::emit_error!(\n        node.name().span(),\n        \"`attr:` attributes are not currently supported on slots\"\n    );\n}\n```","locations":[{"ref":"leptos_macro/src/view/slot_helper.rs:83-100","code":"   83 |     let dyn_attrs = attrs\n   84 |         .iter()\n   85 |         .filter(|attr| attr.key.to_string().starts_with(\"attr:\"))\n   86 |         .filter_map(|attr| {\n   87 |             let name = &attr.key.to_string();\n   88 |             let name = name.strip_prefix(\"attr:\");\n   89 |             let value = attr.value().map(|v| {\n   90 |                 quote! { #v }\n   91 |             })?;\n   92 |             Some(quote! { (#name, #value) })\n
