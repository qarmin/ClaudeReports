  let mut remaining_size = r.read_u32::<LittleEndian>()? as u64;\n  326 |         while remaining_size > 0 {\n  327 |             let signer_size = r.read_u32::<LittleEndian>()?;\n  328 | \n  329 |             let signed_data_size = r.read_u32::<LittleEndian>()?;\n  330 |             let mut signed_data = vec![0; signed_data_size as _];\n  331 |             r.read_exact(&mut signed_data)?;\n  332 | \n  333 |             let mut signatures = vec![];\n  334 |             let mut remaining_signature_size = r.read_u32::<LittleEndian>()?;\n  335 |             while remaining_signature_size > 0 {\n  336 |                 let signature_size = r.read_u32::<LittleEndian>()?;\n  337 |                 let algorithm = r.read_u32::<LittleEndian>()?;\n  338 |                 let size = r.read_u32::<LittleEndian>()?;\n  339 |                 let mut signature = vec![0; size as usize];\n  340 |                 r.read_exact(&mut signature)?;\n  341 |                 signatures.push(ApkSignature {\n  342 |                     algorithm,\n  343 |                     signature,\n  344 |                 });\n  345 |                 remaining_signature_size -= signature_size + 4;\n  346 |             }\n  347 | \n  348 |             let public_key_size = r.read_u32::<LittleEndian>()?;\n  349 |             let mut public_key = vec![0; public_key_size as _];\n  350 |             r.read_exact(&mut public_key)?;\n  351 | \n  352 |             signers.push(ApkSigner {\n  353 |                 signed_data,\n  354 |                 signatures,\n  355 |                 public_key,\n  356 |             });\n  357 |             remaining_size -= signer_size as u64 + 4;\n  358 |         }","lines":36,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/sign.rs#L323-L358"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"AppImage::add_icon extension handling: `path.extension().map(|ext| ext.to_str()).unwrap_or_default()` yields Option<&str> where unwrap_or_default() on the outer Option gives None (Option<&str> default) when there is no extension, then .context() converts that. But if the extension exists yet is non-UTF-8, to_str() returns None which is then unwrapped by .context as if there were no extension - the error message 'unsupported extension' is misleading for the non-UTF-8 case, and the double-Option nesting is confusing.","fix":"Flatten the Option<Option<&str>> with .and_then(|e| e.to_str()) and give distinct error messages.","locations":[{"ref":"appimage/src/lib.rs:48-59","code":"   48 |     pub fn add_icon(&self, path: &Path) -> Result<()> {\n   49 |         let ext = path\n   50 |             .extension()\n   51 |             .map(|ext| ext.to_str())\n   52 |             .unwrap_or_default()\n   53 |             .context(\"unsupported extension\")?;\n   54 |         let name = format!(\"{}.{}\", self.name, ext);\n   55 |         self.add_file(path, Path::new(&name))?;\n   56 |         #[cfg(unix)]\n   57 |         std::os::unix::fs::symlink(name, self.appdir.join(\".DirIcon\"))?;\n   58 |         Ok(())\n   59 |     }","lines":12,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/appimage/src/lib.rs#L48-L59"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"`choose_package_version` selects the package with the *fewest* candidate versions but, when versions are tied or already chosen, the comparison `v.len() < versions.len()` keeps the previously-selected package only if it has strictly fewer; equal counts cause it to switch. The `early_exit` heuristic also breaks out as soon as a package with <2 versions is seen, which may not be the globally smallest. The commented-out debug log on line 194 references variables (`latest`/`release`) that are not in scope, indicating the line was left in a broken state.","fix":"Clarify the tie-breaking intent and remove or fix the stale commented-out log line.","locations":[{"ref":"mvn/src/lib.rs:178-195","code":"  178 |         let mut selected: Option<(_, Vec<_>)> = None;\n  179 |         for (p, r) in potential_packages {\n  180 |             let versions = self.versions(p.borrow(), r.borrow());\n  181 |             if let Some((_, v)) = &selected {\n  182 |                 if v.len() < versions.len() {\n  183 |                     continue;\n  184 |                 }\n  185 |             }\n  186 |             let early_exit = versions.len() < 2;\n  187 |             selected = Some((p, versions));\n  188 |             if early_exit {\n  189 |                 break;\n  190 |             }\n  191 |         }\n  192 |         let (p, v) = selected.expect(\"non empty iterator\");\n  193 |         let v = v.into_iter().next();\n  194 |         //log::debug!(\"chose {} {:?} (latest {}) (release {})\", p.borrow(), v);\n  195 |         Ok((p, v))","lines":18,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/mvn/src/lib.rs#L178-L195"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"`DataItem::string` slices `&self.string_data[span.start()..(span.end() - 1)]` assuming every stored string is NUL-terminated (length includes the trailing NUL). If a span has length 0 (empty/no terminator), `span.end() - 1` underflows and the index range is invalid, panicking. Read data from a malformed file can trigger this.","fix":"Guard against zero-length spans and bound-check end-1 before slicing.","locations":[{"ref":"pri/src/data_item.rs:92-96","code":"   92 |     pub fn string(&self, index: usize) -> Option<&str> {\n   93 |         let span = self.string_spans.get(index)?;\n   94 |         let bytes = &self.string_data[span.start()..(span.end() - 1)];\n   95 |         std::str::from_utf8(bytes).ok()\n   96 |     }","lines":5,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/data_item.rs#L92-L96"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"When parsing rustc-link-search output, lines without a `kind=` prefix are split with `split_once('=')` defaulting kind to \"all\". But a search path that itself contains an `=` character is mis-split: everything before the first `=` is taken as the kind and discarded as unknown, dropping a valid native search path.","fix":"Only treat the prefix as a kind when it is one of the known kinds; otherwise treat the entire value as the path.","locations":[{"ref":"xbuild/src/cargo/mod.rs:220-227","code":"  220 |                     if let Some(link_search) = line.strip_prefix(\"cargo:rustc-link-search=\") {\n  221 |                         let (kind, path) =\n  222 |                             link_search.split_once('=').unwrap_or((\"all\", link_search));\n  223 |                         match kind {\n  224 |                             // FIXME: which kinds of search path we interested in\n  225 |                             \"dependency\" | \"native\" | \"all\" => paths.push(path.into()),\n  226 |                             _ => (),\n  227 |                         };","lines":8,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/cargo/mod.rs#L220-L227"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"`use_windows_sdk` and `use_macos_sdk`/`use_ios_sdk` hardcode the `x86_64` arch directory and `--target=x86_64-apple-darwin` / `arm64-apple-ios` triples regardless of the actual `self.target`. Building Windows for aarch64 or macOS for arm64 will pick the wrong SDK lib directories and cross-compile target, silently producing the wrong architecture.","fix":"Derive the arch directory and target triple from `self.target` instead of hardcoding x86_64/arm64.","locations":[{"ref":"xbuild/src/cargo/mod.rs:327-329","code":"  327 |         self.add_lib_dir(&path.join(\"crt\").join(\"lib\").join(\"x86_64\"));\n  328 |         self.add_lib_dir(&path.join(\"sdk\").join(\"lib\").join(\"um\").join(\"x86_64\"));\n  329 |         self.add_lib_dir(&path.join(\"sdk\").join(\"lib\").join(\"ucrt\").join(\"x86_64\"));","lines":3,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/cargo/mod.rs#L327-L329"},{"ref":"xbuild/src/cargo/mod.rs:343","code":"  343 |         self.add_link_arg(\"--target=x86_64-apple-darwin\");","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/cargo/mod.rs#L343"},{"ref":"xbuild/src/cargo/mod.rs:373","code":"  373 |         self.add_link_arg(\"--target=arm64-apple-ios\");","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/cargo/mod.rs#L373"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"Host `name()` runs `uname` with no arguments, which prints the kernel name (e.g. \"Linux\") rather than a hostname or device name; combined with `details()` (which prepends the distro NAME), the `x devices` listing for the host shows \"Linux\" as the device name, which is misleading.","fix":"Use `uname -n` (nodename) or `hostname` for the device name, or read the distro NAME, to produce a meaningful host identifier.","locations":[{"ref":"xbuild/src/devices/host.rs:10-19","code":"   10 |     pub fn name(&self) -> Result<String> {\n   11 |         if cfg!(target_os = \"linux\") {\n   12 |             let output = Command::new(\"uname\").output()?;\n   13 |             anyhow::ensure!(output.status.success(), \"uname failed\");\n   14 |             let name = std::str::from_utf8(&output.stdout)?.trim();\n   15 |             Ok(name.to_string())\n   16 |         } else {\n   17 |             Ok(\"host\".to_string())\n   18 |         }\n   19 |     }","lines":10,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/devices/host.rs#L10-L19"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"`disk_image_mounted` parses the count of mounted images out of the first `[...]` pair in `ideviceimagemounter -l` output. This is brittle: it assumes the textual summary always contains `[N]`. If the tool's output format changes or contains an earlier unrelated bracket, parsing yields a wrong number or errors. External tool output is parsed without a robust contract.","fix":"Match a more specific marker (e.g. parse the documented summary line) and degrade gracefully (treat parse failure as not-mounted) rather than failing the whole run.","locations":[{"ref":"xbuild/src/devices/imd.rs:63-79","code":"   63 |     fn disk_image_mounted(&self, device: &str) -> Result<bool> {\n   64 |         let output = Command::new(&self.ideviceimagemounter)\n   65 |             .arg(\"--udid\")\n   66 |             .arg(device)\n   67 |             .arg(\"-l\")\n   68 |             .output()?;\n   69 |         anyhow::ensure!(output.status.success(), \"failed to run ideviceimagemounter\");\n   70 |         let num_images: u32 = std::str::from_utf8(&output.stdout)?\n   71 |             .split_once('[')\n   72 |             .context(\"unexpected output\")?\n   73 |             .1\n   74 |             .split_once(']')\n   75 |             .context(\"unexpected output\")?\n   76 |             .0\n   77 |             .parse()?;\n   78 |         Ok(num_images > 0)\n   79 |     }","lines":17,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/devices/imd.rs#L63-L79"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"`product_version` parses the iOS version as `major.minor` via two `split_once('.')` calls. A two-component version like \"17.4\" (no second dot) fails the second `split_once('.')` and errors out, even though it is a valid product version. Only versions with at least two dots (e.g. \"15.2.1\") parse.","fix":"Split on '.' once for major, then take the next component up to the next '.' or end-of-string (e.g. use `splitn`/iterate components and default the patch).","locations":[{"ref":"xbuild/src/devices/imd.rs:141-146","code":"  141 |     pub fn product_version(&self, device: &str) -> Result<(u32, u32)> {\n  142 |         let version = self.getkey(device, \"ProductVersion\")?;\n  143 |         let (major, version) = version.split_once('.').context(\"invalid product version\")?;\n  144 |         let (minor, _) = version.split_once('.').context(\"invalid product version\")?;\n  145 |         Ok((major.parse()?, minor.parse()?))\n  146 |     }","lines":6,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/devices/imd.rs#L141-L146"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"`imd.devices()` failures are swallowed via `.ok()` while `adb.devices()` failures are propagated with `?`. The two backends are treated inconsistently for no documented reason; an adb hiccup aborts `x devices`/build target resolution entirely, whereas an imd hiccup is silently ignored.","fix":"Treat both backends consistently - either propagate both errors or log-and-continue for both.","locations":[{"ref":"xbuild/src/devices/mod.rs:61-66","code":"   61 |         if let Ok(adb) = Adb::which() {\n   62 |             adb.devices(&mut devices)?;\n   63 |         }\n   64 |         if let Ok(imd) = IMobileDevice::which() {\n   65 |             imd.devices(&mut devices).ok();\n   66 |         }","lines":6,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/devices/mod.rs#L61-L66"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"negligible","easy":false,"description":"`uidof` parses the uid with `uid.parse()` after stripping `uid:`, but `pm list package -U` output appends the uid field that may include trailing whitespace already trimmed by line splitting; however if a package line lacks the `uid:` field entirely for some Android versions the `strip_prefix` correctly errors. The fragile part is `split_once(' ')` assuming exactly `package:<id> uid:<n>` ordering with a single space - some `pm` variants emit additional fields, which would break the (package,uid) tuple extraction.","fix":"Parse fields by locating the `uid:` token explicitly (e.g. split_whitespace and find the token starting with `uid:`) rather than relying on positional `split_once(' ')`.","locations":[{"ref":"xbuild/src/devices/adb.rs:231-243","code":"  231 |         let output = std::str::from_utf8(&output.stdout)?;\n  232 |         let (_package, uid) = output\n  233 |             .lines()\n  234 |             .filter_map(|line| line.split_once(' '))\n  235 |             // `pm list package` uses the id as a substring filter; make sure\n  236 |             // we select the right package in case it returns multiple matches:\n  237 |             .find(|(package, _uid)| package.strip_prefix(\"package:\") == Some(id))\n  238 |             .with_context(|| format!(\"Could not find `package:{id}` in output `{output}`\"))?;\n  239 |         let uid = uid\n  240 |             .strip_prefix(\"uid:\")\n  241 |             .with_context(|| format!(\"Could not find `uid:` in output `{output}`\"))?;\n  242 |         Ok(uid.parse()?)\n  243 |     }","lines":13,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/devices/adb.rs#L231-L243"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"Apk::entry_point indexes strings with package_value/name_value as usize without bounds checking (strings[package_value as usize]). raw_value is read directly from the parsed binary XML and can be -1 (no raw value) or out of range; -1 as usize is a huge index causing an index-out-of-bounds panic on a manifest where the package/name attribute has no string raw_value.","fix":"Validate that package_value/name_value are >= 0 and within strings.len() before indexing, returning an error otherwise.","locations":[{"ref":"apk/src/lib.rs:192-199","code":"  192 |         let entry = if let (Some(package_value), Some(name_value)) = (package_value, name_value) {\n  193 |             EntryPoint {\n  194 |                 package: strings[package_value as usize].clone(),\n  195 |                 activity: strings[name_value as usize].clone(),\n  196 |             }\n  197 |         } else {\n  198 |             anyhow::bail!(\"invalid manifest 3\");\n  199 |         };","lines":8,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/lib.rs#L192-L199"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"Msix::sign unwraps the signer creation: `signer.map(Ok).unwrap_or_else(|| Signer::new(DEBUG_PEM)).unwrap()`. If Signer::new(DEBUG_PEM) fails (embedded PEM somehow unparsable, or future change) the whole signing path panics. The APK equivalent in sign.rs:97 correctly uses `?`.","fix":"Propagate the error with `?` instead of `.unwrap()`.","locations":[{"ref":"msix/src/lib.rs:95-99","code":"   95 |     pub fn sign(path: &Path, signer: Option<Signer>, compress: bool) -> Result<()> {\n   96 |         let signer = signer\n   97 |             .map(Ok)\n   98 |             .unwrap_or_else(|| Signer::new(DEBUG_PEM))\n   99 |             .unwrap();","lines":5,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/msix/src/lib.rs#L95-L99"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"`pom(...).unwrap()` in `get_dependencies` turns any POM read/parse error into a panic during dependency resolution. Network/cache/parse failures for a transitive dependency's POM crash the resolver instead of surfacing an error (the function already returns `Result<_, Box<dyn Error>>`).","fix":"Propagate the error with `?` (mapping anyhow::Error into the boxed error) instead of `.unwrap()`.","locations":[{"ref":"mvn/src/lib.rs:207","code":"  207 |         let pom = self.pom(Artifact { package, version }).unwrap();","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/mvn/src/lib.rs#L207"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":true,"description":"Read of `max_full_path_length` drops the `?`, so an IO error here is silently ignored (the `Result<u16>` is bound to `_max_full_path_length` and discarded). Unlike every other field read in this function, a short/failed read at this position will not be reported and parsing continues with the stream mis-positioned.","fix":"Add the `?`: `let _max_full_path_length = r.read_u16::<LE>()?;`.","locations":[{"ref":"pri/src/hierarchical_schema.rs:49","code":"   49 |         let _max_full_path_length = r.read_u16::<LE>();","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/hierarchical_schema.rs#L49"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"`android_sdkmanager::download_and_extract_packages(...)` is invoked as a bare statement with no error propagation. If the download/extraction fails, the failure is silently ignored and the function returns `Ok(())`, leaving `android.jar` missing; the subsequent build then fails with a confusing unrelated error.","fix":"Capture and propagate the result (or, if the function is infallible, verify `path.exists()` afterwards and bail with a clear error if it is still missing).","locations":[{"ref":"xbuild/src/download.rs:233-241","code":"  233 |             let package = format!(\"platforms;android-{sdk}\");\n  234 |             android_sdkmanager::download_and_extract_packages(\n  235 |                 dir.to_str().unwrap(),\n  236 |                 android_sdkmanager::HostOs::Linux,\n  237 |                 &[&package],\n  238 |                 Some(&[android_sdkmanager::MatchType::EntireName(\"android.jar\")]),\n  239 |             )\n  240 |         }\n  241 |         Ok(())","lines":9,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/download.rs#L233-L241"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"find_android_jar (test helper) ends with `Ok(jar.unwrap())`, panicking if no android.jar is found rather than returning the Result error it is declared to produce. Test-only, but defeats the Result return type.","fix":"Use `jar.context(\"no android.jar found\")` instead of unwrap().","locations":[{"ref":"apk/src/lib.rs:226-238","code":"  226 |     pub fn find_android_jar() -> Result<PathBuf> {\n  227 |         let home = std::env::var(\"ANDROID_HOME\")?;\n  228 |         let platforms = Path::new(&home).join(\"platforms\");\n  229 |         let mut jar = None;\n  230 |         for entry in std::fs::read_dir(platforms)? {\n  231 |             let android = entry?.path().join(\"android.jar\");\n  232 |             if android.exists() {\n  233 |                 jar = Some(android);\n  234 |                 break;\n  235 |             }\n  236 |         }\n  237 |         Ok(jar.unwrap())\n  238 |     }","lines":13,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/lib.rs#L226-L238"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"ResTableConfig::read computes `let unknown_len = size as usize - 28;` with an unchecked subtraction. A config whose size field is < 28 (corrupt input) underflows in release (wrapping to a huge usize) and then `vec![0; unknown_len]` attempts a massive allocation / aborts. In debug it panics.","fix":"Use checked_sub and bail with an error when size < 28.","locations":[{"ref":"apk/src/res.rs:540-543","code":"  540 |         let version = r.read_u32::<LittleEndian>()?;\n  541 |         let unknown_len = size as usize - 28;\n  542 |         let mut unknown = vec![0; unknown_len];\n  543 |         r.read_exact(&mut unknown)?;","lines":4,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/res.rs#L540-L543"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"In `metadata()`/`pom()`/`artifact()` the download loop swallows every per-repository error via `.is_ok()` and only reports a generic \"not found\" at the end. Real failures (network errors, auth, disk-full while writing `path`) are indistinguishable from a 404, and a partially-written cache file from a failed download is left on disk and treated as valid on the next run because `path.exists()` becomes true.","fix":"Download to a temp file and rename on success; surface the underlying error instead of discarding it.","locations":[{"ref":"mvn/src/lib.rs:118-128","code":"  118 |         if !path.exists() {\n  119 |             let mut downloaded = false;\n  120 |             for repo in &self.repositories {\n  121 |                 let url = package.url(repo);\n  122 |                 if self.client.download(&url, &path).is_ok() {\n  123 |                     downloaded = true;\n  124 |                     break;\n  125 |                 }\n  126 |             }\n  127 |             anyhow::ensure!(downloaded, \"meta nfig = LocalizedConfig {\n  232 |         config: toml::from_str::<Config>(toml).unwrap(),\n  233 |         // Path does not have to exist\n  234 |         workspace: PathBuf::from(\"my/work/space\"),\n  235 |     };\n  236 | \n  237 |     config.set_env_vars().unwrap();\n  238 | \n  239 |     let path = std::env::var(\"CARGO_SUBCOMMAND_TEST_ENV_SRC_DIR\")\n  240 |         .expect(\"Relative env var should always be set\");\n  241 |     let path = PathBuf::from(path);\n  242 |     assert!(\n  243 |         path.is_relative(),\n  244 |         \"Workspace was not absolute so this shouldn't either\"\n  245 |     );\n  246 |     assert_eq!(path, Path::new(\"my/work/space/src\"));\n  247 | }","lines":78,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/cargo/config.rs#L170-L247"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","easy":false,"description":"On error during `fetch`, cleanup removes `item.output`, but for the `.tar.zst` branch the archive is extracted into `item.output.parent()` (line 77) rather than `item.output` itself, so a partially-extracted tree can be left behind and a stale/incomplete extraction is not cleaned. Subsequent runs may see partial contents and skip re-fetch.","fix":"Track the actual extraction destination per-branch and clean that, or extract into a temp dir and atomically rename into place on success.","locations":[{"ref":"xbuild/src/download.rs:79-88","code":"   79 |                 for entry in archive.entries()? {\n   80 |                     let mut entry = entry?;\n   81 |                     if item.no_symlinks && entry.header().entry_type() == EntryType::Symlink {\n   82 |                         continue;\n   83 |                     }\n   84 |                     if item.no_colons && entry.header().path()?.to_str().unwrap().contains(':') {\n   85 |                         continue;\n   86 |                     }\n   87 |                     entry.unpack_in(dest)?;\n   88 |                 }","lines":10,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/download.rs#L79-L88"},{"ref":"xbuild/src/download.rs:107-113","code":"  107 |         if result.is_err() {\n  108 |             if item.output.is_dir() {\n  109 |                 std::fs::remove_dir_all(&item.output).ok();\n  110 |             } else {\n  111 |                 std::fs::remove_file(&item.output).ok();\n  112 |             }\n  113 |         }","lines":7,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/download.rs#L107-L113"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":false,"description":"`set_env_vars` mutates the global process environment via `std::env::set_var` for every entry in `.cargo/config.toml`. `std::env::set_var` is not thread-safe and this is called implicitly during `Cargo::new`; in a process that also spawns threads this is undefined behavior on some platforms. It also permanently pollutes the parent process environment.","fix":"Set the variables on the spawned `Command` (per-process env) rather than mutating the global process environment, or document/guard the single-threaded requirement.","locations":[{"ref":"xbuild/src/cargo/config.rs:67-83","code":"   67 |     pub fn set_env_vars(&self) -> Result<()> {\n   68 |         if let Some(env) = &self.config.env {\n   69 |             for (key, env_option) in env {\n   70 |                 // Existing environment variables always have precedence unless\n   71 |                 // the extended format is used to set `force = true`:\n   72 |                 if !matches!(env_option, EnvOption::Value { force: true, .. })\n   73 |                     && std::env::var_os(key).is_some()\n   74 |                 {\n   75 |                     continue;\n   76 |                 }\n   77 | \n   78 |                 std::env::set_var(key, env_option.resolve_value(&self.workspace)?.as_ref())\n   79 |             }\n   80 |         }\n   81 | \n   82 |         Ok(())\n   83 |     }","lines":17,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/cargo/config.rs#L67-L83"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"Block::new uses the deprecated `base64::encode` free function (base64 0.13-era API). On newer base64 crates this is deprecated/removed in favor of the Engine API. Same pattern is the only base64 use here.","fix":"Use the Engine API, e.g. base64::engine::general_purpose::STANDARD.encode(...).","locations":[{"ref":"msix/src/block_map.rs:114-121","code":"  114 | impl Block {\n  115 |     pub fn new(bytes: &[u8]) -> Self {\n  116 |         Self {\n  117 |             hash: base64::encode(Sha256::digest(bytes)),\n  118 |             size: None,\n  119 |         }\n  120 |     }\n  121 | }","lines":8,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/msix/src/block_map.rs#L114-L121"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"`start_debug_server_proxy` spawns a detached thread that calls `cmd.status().unwrap()`. If the proxy command fails to spawn or exits nonzero, the thread panics; more importantly the thread/process is never joined or killed, so the debugserver proxy leaks (keeps running) after lldb exits.","fix":"Spawn the child with a handle, store it, and kill it when lldb finishes (mirroring the `lldb_server.kill()` pattern in adb.rs); avoid `.unwrap()` in the thread.","locations":[{"ref":"xbuild/src/devices/imd.rs:185-195","code":"  185 |     pub fn start_debug_server_proxy(&self, device: &str, port: u16) -> Result<()> {\n  186 |         let mut cmd = Command::new(&self.idevicedebugserverproxy);\n  187 |         cmd.arg(\"--udid\")\n  188 |             . function loadHash() {

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      const easyStr = f.easy ? ' ⚡ easy' : '';
      out += '### ' + f.id + sevStr + easyStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    const easyStr = f.easy ? ' ⚡' : '';
    lines.push('- [ ] - ' + f.id + sevStr + easyStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.easy) lns.push(pad('easy') + '= true');
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + (f.easy ? ' ⚡ easy' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.easy ? 'easy quick win' : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.easyOnly && !f.easy)                   return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.easy ? '<span class="badge easy-badge" style="cursor:default" title="Easy to verify &amp; fix - no deep knowledge of the code, SDK or technology required">\u26a1 Easy</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_EASY)
    h += '<div class="filter-row"><span class="filter-lbl">Quick wins:</span>'
       + '<button class="badge easy-badge" data-easy="1">\u26a1 Easy only</button></div>';

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-easy]'))   b.classList.toggle('off', !S.easyOnly);
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Event delegation
document.getElementById('filterbar').addEventListener('click', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-easy]');
  if (!b) return;
  if (b.dataset.easy) {
    S.easyOnly = !S.easyOnly;
  }
  else if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES    : STATUSES;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
