<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.sev-info    {background:#0c2a2a;color:#5eead4;border-color:#0f766e}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.easy-badge{background:#052e16;color:#86efac;border-color:#16a34a}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>
<body>
<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","easy":false,"description":"ResTablePackageHeader::read initializes name_len = 0xff (255). If the 128 u16 package-name characters never contain a NUL terminator, name_len stays 255 and String::from_utf16(&name[..name_len]) slices a 128-element array with [..255], which panics with index-out-of-bounds. A malformed/crafted resources.arsc (parsed by import_apk / Apk::entry_point / Table::import_apk) triggers this.","fix":"Clamp name_len to the buffer length, e.g. after the loop do `let name_len = name_len.min(128);`, or default name_len to 128 instead of 0xff so the slice is always in bounds.","locations":[{"ref":"apk/src/res.rs:388-401","code":"  388 |         let mut name = [0; 128];\n  389 |         let mut name_len = 0xff;\n  390 |         for (i, item) in name.iter_mut().enumerate() {\n  391 |             let c = r.read_u16::<LittleEndian>()?;\n  392 |             if name_len < 128 {\n  393 |                 continue;\n  394 |             }\n  395 |             if c == 0 {\n  396 |                 name_len = i;\n  397 |             } else {\n  398 |                 *item = c;\n  399 |             }\n  400 |         }\n  401 |         let name = String::from_utf16(&name[..name_len])?;","lines":14,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/res.rs#L388-L401"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","easy":false,"description":"ResTablePackageHeader::write writes the package name into a fixed [u16; 128] array via `name[i] = c` with no bounds check. A package name whose UTF-16 encoding exceeds 128 code units causes an index-out-of-bounds panic. Package names come from the manifest/user input (compile_mipmap passes package_name straight through).","fix":"Validate the name length up front (bail with an error if encode_utf16().count() > 128) or use `.take(128)` / `.zip` to avoid out-of-bounds writes.","locations":[{"ref":"apk/src/res.rs:420-423","code":"  420 |         let mut name = [0; 128];\n  421 |         for (i, c) in self.name.encode_utf16().enumerate() {\n  422 |             name[i] = c;\n  423 |         }","lines":4,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/res.rs#L420-L423"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"compile_attr unwraps several Option values that assume well-formed table data: entry.attribute_type().unwrap() (line 9), entry.lookup_value(id).unwrap() (lines 24, 32) and ResValueType::from_u8(...).unwrap() (lines 25, 34). A reference to an enum/flag value not present in the attribute's value map, or an unknown data_type byte, panics instead of producing an error for invalid manifest input.","fix":"Replace these .unwrap() calls with .context(...)? to return descriptive errors.","locations":[{"ref":"apk/src/compiler/attributes.rs:7-39","code":"    7 | pub fn compile_attr(table: &Table, name: &str, value: &str, strings: &Strings) -> Result<ResValue> {\n    8 |     let entry = table.entry_by_ref(Ref::attr(name))?;\n    9 |     let attr_type = entry.attribute_type().unwrap();\n   10 |     let (data, data_type) = match attr_type {\n   11 |         ResAttributeType::Reference => {\n   12 |             let id = table.entry_by_ref(Ref::parse(value)?)?.id();\n   13 |             (u32::from(id), ResValueType::Reference)\n   14 |         }\n   15 |         ResAttributeType::String => (strings.id(value) as u32, ResValueType::String),\n   16 |         ResAttributeType::Integer => (value.parse()?, ResValueType::IntDec),\n   17 |         ResAttributeType::Boolean => match value {\n   18 |             \"true\" => (0xffff_ffff, ResValueType::IntBoolean),\n   19 |             \"false\" => (0x0000_0000, ResValueType::IntBoolean),\n   20 |             _ => anyhow::bail!(\"expected boolean\"),\n   21 |         },\n   22 |         ResAttributeType::Enum => {\n   23 |             let id = table.entry_by_ref(Ref::id(value))?.id();\n   24 |             let value = entry.lookup_value(id).unwrap();\n   25 |             (value.data, ResValueType::from_u8(value.data_type).unwrap())\n   26 |         }\n   27 |         ResAttributeType::Flags => {\n   28 |             let mut data = 0;\n   29 |             let mut data_type = ResValueType::Null;\n   30 |             for flag in value.split('|') {\n   31 |                 let id = table.entry_by_ref(Ref::id(flag))?.id();\n   32 |                 let value = entry.lookup_value(id).unwrap();\n   33 |                 data |= value.data;\n   34 |                 data_type = ResValueType::from_u8(value.data_type).unwrap();\n   35 |             }\n   36 |             (data, data_type)\n   37 |         }\n   38 |         _ => anyhow::bail!(\"unsupported attribute type\"),\n   39 |     };","lines":33,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/compiler/attributes.rs#L7-L39"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"Strings::id does a linear search and unwraps with .unwrap(), panicking if a string was not registered in the pool during the build_string_pool pass. compile_node calls strings.id on every tag/attribute/value; any string missed by build_string_pool (e.g. a namespace or value path that diverges between the two walks) panics the whole build instead of returning an error.","fix":"Propagate a Result from id() (the surrounding compile functions already return Result) rather than unwrapping.","locations":[{"ref":"apk/src/compiler/attributes.rs:106-114","code":"  106 | impl Strings {\n  107 |     pub fn id(&self, s2: &str) -> i32 {\n  108 |         self.strings\n  109 |             .iter()\n  110 |             .position(|s| s == s2)\n  111 |             .with_context(|| format!(\"all strings added to the string pool: {s2}\"))\n  112 |             .unwrap() as i32\n  113 |     }\n  114 | }","lines":9,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/compiler/attributes.rs#L106-L114"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"Entry::attribute_type panics (`panic!(\"attribute_type: 0x{data:x}\")`) when it encounters an attribute whose type bitmask is not one of the hard-coded patterns and not recognized by ResAttributeType::from_u32. Android allows arbitrary combinations of format flags, so a valid android.jar attribute with a multi-type format mask will crash the compiler instead of returning an error.","fix":"Return None or an Err instead of panicking on unrecognized format masks; pick a reasonable default type for multi-format attributes.","locations":[{"ref":"apk/src/compiler/table.rs:152-173","code":"  152 |     pub fn attribute_type(self) -> Option<ResAttributeType> {\n  153 |         if let ResTableValue::Complex(_, entries) = &self.entry.value {\n  154 |             let data = entries[0].value.data;\n  155 |             // TODO: android supports multiple types\n  156 |             if data == 0b110 {\n  157 |                 return Some(ResAttributeType::Integer);\n  158 |             }\n  159 |             if data == 0b11 {\n  160 |                 return Some(ResAttributeType::String);\n  161 |             }\n  162 |             if data == 0b111110 {\n  163 |                 return Some(ResAttributeType::String);\n  164 |             }\n  165 |             if let Some(value) = ResAttributeType::from_u32(entries[0].value.data) {\n  166 |                 Some(value)\n  167 |             } else {\n  168 |                 panic!(\"attribute_type: 0x{data:x}\");\n  169 |             }\n  170 |         } else {\n  171 |             None\n  172 |         }\n  173 |     }","lines":22,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/compiler/table.rs#L152-L173"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"hash_chunk uses `r.read_exact(buffer).unwrap()` instead of `?`. The function returns Result, so any IO error (truncated file, etc.) panics the process instead of being propagated. This is reachable from sign()/verify() on a malformed APK.","fix":"Replace `.unwrap()` with `?` so the error is returned to the caller.","locations":[{"ref":"apk/src/sign.rs:168-178","code":"  168 | ) -> Result<()> {\n  169 |     let end = std::cmp::min(*pos + MAX_CHUNK_SIZE as u64, size);\n  170 |     let len = (end - *pos) as usize;\n  171 |     buffer.resize(len, 0);\n  172 |     r.read_exact(buffer).unwrap();\n  173 |     hasher.update([0xa5]);\n  174 |     hasher.update((len as u32).to_le_bytes());\n  175 |     hasher.update(buffer);\n  176 |     chunks.push(hasher.finalize_reset().into());\n  177 |     *pos = end;\n  178 |     Ok(())","lines":11,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/sign.rs#L168-L178"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"Subtraction underflow on malformed PRI input. `r.read_u32::<LE>()? as usize - string_data_length` (blob offset) and `total_data_length - string_data_length` are unchecked. A corrupt/hostile file where a blob offset is smaller than the computed string_data_length, or total_data_length < string_data_length, panics in debug builds and silently wraps to a huge value in release (then a huge `Vec::with_capacity`/allocation).","fix":"Use checked_sub and return an error (anyhow::bail!) on underflow instead of relying on wrapping/panic.","locations":[{"ref":"pri/src/data_item.rs:50","code":"   50 |             let offset = r.read_u32::<LE>()? as usize - string_data_length;","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/data_item.rs#L50"},{"ref":"pri/src/data_item.rs:54","code":"   54 |         let blob_data_length = total_data_length - string_data_length;","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/data_item.rs#L54"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"`char::from_u32(c as u32).unwrap()` is used in several UTF-16 decode loops. While u16->u32 always yields a valid scalar for non-surrogate values, lone surrogate code units (0xD800-0xDFFF), which can appear in malformed/corrupt PRI data, make `char::from_u32` return None and the `.unwrap()` panics. The decoders also do not combine surrogate pairs, so any astral-plane string is decoded incorrectly even when it doesn't panic.","fix":"Decode UTF-16 properly via `char::decode_utf16` / `String::from_utf16`, returning an error on invalid sequences instead of unwrapping.","locations":[{"ref":"pri/src/hierarchical_schema.rs:36","code":"   36 |             unique_name.push(char::from_u32(c as u32).unwrap());","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/hierarchical_schema.rs#L36"},{"ref":"pri/src/hierarchical_schema.rs:45","code":"   45 |             name.push(char::from_u32(c as u32).unwrap());","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/hierarchical_schema.rs#L45"},{"ref":"pri/src/hierarchical_schema.rs:88","code":"   88 |                         name.push(char::from_u32(c as u32).unwrap());","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/hierarchical_schema.rs#L88"},{"ref":"pri/src/hierarchical_schema.rs:96","code":"   96 |                         name.push(char::from_u32(c as u32).unwrap());","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/hierarchical_schema.rs#L96"},{"ref":"pri/src/decision_info.rs:83","code":"   83 |                     value.push(char::from_u32(c as u32).unwrap());","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/decision_info.rs#L83"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"Out-of-bounds index on malformed PRI input. The candidate's resource-value-type byte is used directly to index `resource_value_type_table` (`resource_value_type_table[r.read_u8()? as usize]`). A corrupt file with an index >= table size panics. Similarly `distinct_qualifier_infos[info.index]` in decision_info.rs and `index_table[...]` accesses are unchecked.","fix":"Validate indices with `.get(...)` and return an error on out-of-range values rather than indexing directly.","locations":[{"ref":"pri/src/resource_map.rs:100","code":"  100 |             let resource_value_type = resource_value_type_table[r.read_u8()? as usize];","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/resource_map.rs#L100"},{"ref":"pri/src/decision_info.rs:73","code":"   73 |             let distinct_info = &distinct_qualifier_infos[info.index];","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/decision_info.rs#L73"},{"ref":"pri/src/decision_info.rs:97","code":"   97 |                 qualifiers_in_set.push(index_table[info.first_qualifier_index_index + i]);","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/decision_info.rs#L97"},{"ref":"pri/src/decision_info.rs:109","code":"  109 |                     .push(index_table[info.first_qualifier_set_index_index + i]);","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/decision_info.rs#L109"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"`min_sdk_version.unwrap()` panics when the Android manifest does not specify a minimum SDK version. A user building for Android without `min_sdk_version` set crashes the tool instead of getting a clear error.","fix":"Return a descriptive error (context/ensure) when `min_sdk_version` is None, or supply a sensible default.","locations":[{"ref":"xbuild/src/command/build.rs:120-126","code":"  120 |                         env.config()\n  121 |                             .android()\n  122 |                             .manifest\n  123 |                             .sdk\n  124 |                             .min_sdk_version\n  125 |                             .unwrap()\n  126 |                             .to_string(),","lines":7,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/command/build.rs#L120-L126"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"`dirs::cache_dir().unwrap()` panics on platforms/configurations where no cache directory can be determined (e.g. unusual environments with HOME/XDG vars unset). This is a startup panic for every build/run/lldb command rather than a graceful error.","fix":"Use `.context(\"could not determine cache directory\")?` to return an error instead of panicking.","locations":[{"ref":"xbuild/src/lib.rs:517","code":"  517 |         let cache_dir = dirs::cache_dir().unwrap().join(\"x\");","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/lib.rs#L517"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"Parsing of `llvm-readobj --needed-libs` output uses three chained `.unwrap()` calls: UTF-8 decode, `split_once(\"NeededLibraries [\\n\")`, and `strip_suffix(\"]\\n\")`. Any deviation in llvm-readobj output (different version, non-ELF input, localized output, CRLF line endings) panics the whole process instead of returning an error, despite the function signature being `Result`.","fix":"Replace each `.unwrap()` with `?`/`.context(...)` returning an error (e.g. `from_utf8`->`?`, `split_once(...).context(\"unexpected llvm-readobj output\")?`).","locations":[{"ref":"xcommon/src/llvm.rs:66-68","code":"   66 |     let output = std::str::from_utf8(&output.stdout).unwrap();\n   67 |     let (_, output) = output.split_once(\"NeededLibraries [\\n\").unwrap();\n   68 |     let output = output.strip_suffix(\"]\\n\").unwrap();","lines":3,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xcommon/src/llvm.rs#L66-L68"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"appbundle add_executable/add_lib/add_framework call path.file_name().unwrap() and add_executable additionally .to_str().unwrap(). A path ending in `..` (no file_name) or a non-UTF-8 file name panics instead of returning an error.","fix":"Use .context(...)? on file_name() and to_str() to return errors for invalid paths.","locations":[{"ref":"appbundle/src/lib.rs:137-161","code":"  137 |     pub fn add_executable(&mut self, path: &Path) -> Result<()> {\n  138 |         let file_name = path.file_name().unwrap().to_str().unwrap();\n  139 |         let exe_dir = self.executable_dir();\n  140 |         std::fs::create_dir_all(&exe_dir)?;\n  141 |         std::fs::copy(path, exe_dir.join(file_name))?;\n  142 |         if self.info.cf_bundle_executable.is_none() {\n  143 |             self.info.cf_bundle_executable = Some(file_name.to_string());\n  144 |         }\n  145 |         Ok(())\n  146 |     }\n  147 | \n  148 |     pub fn add_framework(&self, path: &Path) -> Result<()> {\n  149 |         let framework_dir = self.framework_dir().join(path.file_name().unwrap());\n  150 |         std::fs::create_dir_all(&framework_dir)?;\n  151 |         xcommon::copy_dir_all(path, &framework_dir)?;\n  152 |         Ok(())\n  153 |     }\n  154 | \n  155 |     pub fn add_lib(&self, path: &Path) -> Result<()> {\n  156 |         let file_name = path.file_name().unwrap();\n  157 |         let framework_dir = self.framework_dir();\n  158 |         std::fs::create_dir_all(&framework_dir)?;\n  159 |         std::fs::copy(path, framework_dir.join(file_name))?;\n  160 |         Ok(())\n  161 |     }","lines":25,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/appbundle/src/lib.rs#L137-L161"}]},{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"appbundle finish()/sign_dmg unwrap several conversions that can fail: rasn::der::encode(signer.cert()).unwrap() and signer.key().to_pkcs8_der().unwrap(). Certificate/key encoding errors panic instead of being reported. sign_dmg also unwraps cf_bundle_identifier without the ensure! guard that finish() has.","fix":"Propagate encoding errors with map_err/?; guard cf_bundle_identifier with context before unwrapping in sign_dmg.","locations":[{"ref":"appbundle/src/lib.rs:217-222","code":"  217 |             let mut signing_settings = SigningSettings::default();\n  218 |             let cert =\n  219 |                 CapturedX509Certificate::from_der(rasn::der::encode(signer.cert()).unwrap())?;\n  220 |             let secret = signer.key().to_pkcs8_der().unwrap();\n  221 |             let key = InMemorySigningKeyPair::from_pkcs8_der(secret.as_bytes())?;\n  222 |             signing_settings.set_signing_key(&key, cert);","lines":6,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/appbundle/src/lib.rs#L217-L222"},{"ref":"appbundle/src/lib.rs:250-262","code":"  250 |         let cert = CapturedX509Certificate::from_der(rasn::der::encode(signer.cert()).unwrap())?;\n  251 |         let secret = signer.key().to_pkcs8_der().unwrap();\n  252 |         let key = InMemorySigningKeyPair::from_pkcs8_der(secret.as_bytes())?;\n  253 |         signing_settings.set_signing_key(&key, cert);\n  254 |         signing_settings.chain_apple_certificates();\n  255 |         signing_settings\n  256 |             .set_team_id_from_signing_certificate()\n  257 |             .context(\"signing certificate is missing team id\")?;\n  258 |         signing_settings.set_time_stamp_url(\"http://timestamp.apple.com/ts01\")?;\n  259 |         signing_settings.set_binary_identifier(\n  260 |             SettingsScope::Main,\n  261 |             self.info.cf_bundle_identifier.as_ref().unwrap(),\n  262 |         );","lines":13,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/appbundle/src/lib.rs#L250-L262"}]},{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"to_xml unwraps quick_xml serialization (`quick_xml::se::to_writer(...).unwrap()`), and AppxManifest::Display / AndroidManifest::Display also unwrap quick_xml::se::to_string. A serialization failure (e.g. an invalid field) panics. Serialization of these manifests is driven by user-provided config.","fix":"Return a Result from the helper and propagate, or at minimum use expect with a clear message; the Display impls cannot return errors so consider logging instead of unwrap.","locations":[{"ref":"msix/src/lib.rs:159-167","code":"  159 | fn to_xml<T: Serialize>(xml: &T, standalone: bool) -> Vec<u8> {\n  160 |     let mut buf = vec![];\n  161 |     let standalone = if standalone { \"yes\" } else { \"no\" };\n  162 |     buf.extend_from_slice(\n  163 |         format!(r#\"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"{standalone}\"?>\"#).as_bytes(),\n  164 |     );\n  165 |     quick_xml::se::to_writer(&mut buf, xml).unwrap();\n  166 |     buf\n  167 | }","lines":9,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/msix/src/lib.rs#L159-L167"},{"ref":"apk/src/manifest.rs:57-61","code":"   57 | impl std::fmt::Display for AndroidManifest {\n   58 |     fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {\n   59 |         write!(f, \"{}\", quick_xml::se::to_string(self).unwrap())\n   60 |     }\n   61 | }","lines":5,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/manifest.rs#L57-L61"}]},{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`dep.range().unwrap()` panics if a dependency version string fails to parse into a range. `add_package` and `get_dependencies` both unwrap range parsing; a malformed version in a POM (or passed via `add_package`) aborts the program rather than producing an error.","fix":"Propagate the `Result` (e.g. `collect::<Result<_>>()?`) instead of unwrapping each range.","locations":[{"ref":"mvn/src/lib.rs:51","code":"   51 |             .map(|dep| (dep.package(), dep.range().unwrap()))","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/mvn/src/lib.rs#L51"},{"ref":"mvn/src/lib.rs:212","code":"  212 |             .map(|dep| (dep.package(), dep.range().unwrap()))","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/mvn/src/lib.rs#L212"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`selected.expect(\"non empty iterator\")` will panic if `choose_package_version` is ever called with an empty iterator. While pubgrub's contract says the iterator is non-empty, relying on a panic for an API contract is fragile and produces an opaque crash.","fix":"Return a `Box<dyn Error>` describing the unexpected empty input instead of `expect`.","locations":[{"ref":"mvn/src/lib.rs:192","code":"  192 |         let (p, v) = selected.expect(\"non empty iterator\");","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/mvn/src/lib.rs#L192"}]},{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`path.file_name().unwrap().to_str().unwrap()` panics if the apk path has no file name component or is not valid UTF-8. Reachable from user-supplied paths.","fix":"Use `path.file_name().context(\"apk path has no file name\")?` and handle non-UTF-8 via `to_str().context(...)?` or pass the OsStr through without lossy conversion.","locations":[{"ref":"xbuild/src/devices/adb.rs:79","code":"   79 |         let file_name = path.file_name().unwrap().to_str().unwrap();","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/devices/adb.rs#L79"}]},{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`item.url.rsplit_once('/').unwrap().1` panics if a configured/url has no '/'. While xbuild's own URLs always contain slashes, this is unguarded parsing of a string that originates from `WorkItem::new` and could be a malformed user/config-derived URL.","fix":"Use `.rsplit_once('/').map(|x| x.1).unwrap_or(&item.url)` or return an error with context.","locations":[{"ref":"xbuild/src/download.rs:70","code":"   70 |         let name = item.url.rsplit_once('/').unwrap().1;","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/download.rs#L70"}]},{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`entry.header().path()?.to_str().unwrap()` panics on a tar entry whose path is not valid UTF-8 when `no_colons` filtering is enabled. External archive contents control this path.","fix":"Use `to_string_lossy()` for the contains(':') check, or skip/err gracefully on non-UTF-8 paths.","locations":[{"ref":"xbuild/src/download.rs:84","code":"   84 |                     if item.no_colons && entry.header().path()?.to_str().unwrap().contains(':') {","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/download.rs#L84"}]},{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`clear_last_lines(1).unwrap()` panics if the terminal operation fails (e.g. stdout is redirected to a file/pipe, or in a non-tty CI environment). A failure to clear a status line should not abort the whole build.","fix":"Ignore the result (`let _ = self.term.clear_last_lines(1);`) or handle it gracefully instead of unwrapping.","locations":[{"ref":"xbuild/src/task.rs:48","code":"   48 |             self.term.clear_last_lines(1).unwrap();","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/task.rs#L48"}]},{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`Signer::sign` calls `self.key.sign(...).unwrap()`. An RSA signing failure (e.g. malformed/zero key) panics rather than returning an error, even though it is reachable from normal signing flows on user-provided keys.","fix":"Return `Result<Vec<u8>>` and propagate the signing error with context instead of unwrapping.","locations":[{"ref":"xcommon/src/lib.rs:181-185","code":"  181 |     pub fn sign(&self, bytes: &[u8]) -> Vec<u8> {\n  182 |         let digest = Sha256::digest(bytes);\n  183 |         let padding = PaddingScheme::new_pkcs1v15_sign::<sha2::Sha256>();\n  184 |         self.key.sign(padding, &digest).unwrap()\n  185 |     }","lines":5,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xcommon/src/lib.rs#L181-L185"}]},{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`extract_zip_file` does `Vec::with_capacity(f.size() as usize)` where `f.size()` is the uncompressed size declared in the zip's metadata. A maliciously crafted or corrupt zip can declare a huge size, causing an allocation-failure abort (decompression bomb of the capacity hint), even before any bytes are read.","fix":"Cap the pre-allocation (e.g. `min(size, sane_limit)`) and let the Vec grow, or read into a bounded buffer.","locations":[{"ref":"xcommon/src/lib.rs:473-479","code":"  473 | pub fn extract_zip_file(archive: &Path, name: &str) -> Result<Vec<u8>> {\n  474 |     let mut archive = ZipArchive::new(File::open(archive)?)?;\n  475 |     let mut f = archive.by_name(name)?;\n  476 |     let mut buf = Vec::with_capacity(f.size() as usize);\n  477 |     f.read_to_end(&mut buf)?;\n  478 |     Ok(buf)\n  479 | }","lines":7,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xcommon/src/lib.rs#L473-L479"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"compile_node casts attribute index `i` to u16 (`i as u16 + 1`) for id_index/class_index/style_index, and attrs.len() to u16 for attribute_count. An element with more than 65535 attributes silently truncates. Unlikely in practice but unchecked.","fix":"Guard against attribute counts exceeding u16::MAX with an explicit error.","locations":[{"ref":"apk/src/compiler/xml.rs:83-91","code":"   83 |     let mut id_index = 0;\n   84 |     let mut class_index = 0;\n   85 |     let mut style_index = 0;\n   86 |     let mut attrs = BTreeMap::new();\n   87 |     for (i, attr) in node.attributes().enumerate() {\n   88 |         match attr.name() {\n   89 |             \"id\" => id_index = i as u16 + 1,\n   90 |             \"class\" => class_index = i as u16 + 1,\n   91 |             \"style\" => style_index = i as u16 + 1,","lines":9,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/compiler/xml.rs#L83-L91"},{"ref":"apk/src/compiler/xml.rs:139","code":"  139 |             attribute_count: attrs.len() as _,","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/compiler/xml.rs#L139"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In `Scaler::write`, `(opts.target_width - opts.scaled_size)` and the height variant are unsigned subtractions. If a future `ScalerOpts` is constructed (e.g. via `ScalerOpts::new` plus manual fields, or a scale>1 with padding interactions) such that `scaled_size > target_width`, this underflows and panics in debug / wraps in release. The invariant (scaled_size <= target) is implicit and unchecked.","fix":"Use `saturating_sub`, or assert/clamp `scaled_size <= target_width/target_height` before subtracting.","locations":[{"ref":"xcommon/src/lib.rs:69-72","code":"   69 |             let x = (opts.target_width - opts.scaled_size) / 2;\n   70 |             let y = (opts.target_height - opts.scaled_size) / 2;\n   71 |             let mut padded = RgbaImage::new(opts.target_width, opts.target_height);\n   72 |             image::imageops::overlay(&mut padded, &resized, x as i64, y as i64);","lines":4,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xcommon/src/lib.rs#L69-L72"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"serialize_opengles_version formats the version with decimal padding (`0x{:04}{:04}`) instead of hex. The Android glEsVersion attribute must be a hex integer (e.g. 0x00030002). For a (3, 2) pair this emits \"0x00030002\" by luck for small values but for any component > 9 (e.g. (16,0)) it produces \"0x00160000\" which is wrong: the digits are decimal, not hex, so values >= 10 are mis-encoded.","fix":"Use hex formatting: `format!(\"0x{:04x}{:04x}\", version.0, version.1)`.","locations":[{"ref":"apk/src/manifest.rs:232-245","code":"  232 | fn serialize_opengles_version<S>(\n  233 |     version: &Option<(u8, u8)>,\n  234 |     serializer: S,\n  235 | ) -> Result<S::Ok, S::Error>\n  236 | where\n  237 |     S: Serializer,\n  238 | {\n  239 |     match version {\n  240 |         Some(version) => {\n  241 |             let opengles_version = format!(\"0x{:04}{:04}\", version.0, version.1);\n  242 |             serializer.serialize_some(&opengles_version)\n  243 |         }\n  244 |         None => serializer.serialize_none(),\n  245 |     }","lines":14,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/manifest.rs#L232-L245"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"Exclusive lower bounds are ignored when converting a Maven version range to a pubgrub range. `Range::Greater(Bound { version, .. })` discards the `inclusive` flag and always uses `SRange::higher_than`, which includes the bound. For a range like `(1.1,)` (exclusive lower bound) version `1.1` is wrongly considered in range. This is why `test_range_8` is marked `#[ignore]` - the behavior is known-broken.","fix":"Match on `inclusive`; for an exclusive lower bound, bump the version (or use a strictly-greater construction) before calling `higher_than`, mirroring how the inclusive upper bound is handled.","locations":[{"ref":"mvn/src/range.rs:152-155","code":"  152 |             Range::Greater(Bound { version, .. }) => {\n  153 |                 let version = Version::from_str(&version)?;\n  154 |                 SRange::higher_than(version)\n  155 |             }","lines":4,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/mvn/src/range.rs#L152-L155"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"Operator precedence bug computing `name_offset`. `flags as u64 & 0xf << 16` parses as `flags & (0xf << 16)` because `<<` binds tighter than `&`. Since `flags` is a `u8` (max 0xff), `flags & 0xf0000` is always 0, so the high 4 bits of the 20-bit name_offset are never read back. The matching write side correctly does `(self.name_offset >> 16) as u8 & 0xf`, so any string offset >= 65536 is read incorrectly (wrong string parsed / OOB seek).","fix":"Add parentheses: `r.read_u16::<LE>()? as u64 | ((flags as u64 & 0xf) << 16)`.","locations":[{"ref":"pri/src/hierarchical_schema.rs:228","code":"  228 |         let name_offset = r.read_u16::<LE>()? as u64 | (flags as u64 & 0xf << 16);","lines":1,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/hierarchical_schema.rs#L228"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"Reading the primary resource map section compares against `0xfff` (3 nibbles) as the sentinel for \"no primary section\", but the writer uses `0xffff` (4 nibbles). A round-trip of a file with no primary resource map section therefore writes `0xffff` and reads it back as `Some(0xffff)` instead of `None`, and a legitimate section index `0xfff` (4095) would be wrongly treated as the sentinel on read. The read and write paths disagree.","fix":"Change the read-side comparison to `0xffff` so it matches the writer.","locations":[{"ref":"pri/src/pri_descriptor.rs:28-32","code":"   28 |         let primary_resource_map_section = if primary_resource_map_section == 0xfff {\n   29 |             None\n   30 |         } else {\n   31 |             Some(primary_resource_map_section)\n   32 |         };","lines":5,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/pri_descriptor.rs#L28-L32"},{"ref":"pri/src/pri_descriptor.rs:80-81","code":"   80 |         let primary_resource_map_section = self.primary_resource_map_section.unwrap_or(0xffff);\n   81 |         w.write_u16::<LE>(primary_resource_map_section)?;","lines":2,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/pri/src/pri_descriptor.rs#L80-L81"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"Swapped format arguments in the package-not-found error message. The format string is \"package `{}` not found in workspace `{}`\" but the arguments are passed as `manifest_path.display()` then `name`, so the message prints the path where the package name should be and vice versa, producing a nonsensical/misleading error.","fix":"Swap the two arguments: pass `name` first and `manifest_path.display()` second (or reorder to match the intended message).","locations":[{"ref":"xbuild/src/cargo/manifest.rs:91-95","code":"   91 |                     Err(anyhow::anyhow!(\n   92 |                         \"package `{}` not found in workspace `{}`\",\n   93 |                         manifest_path.display(),\n   94 |                         name,\n   95 |                     ))","lines":5,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/cargo/manifest.rs#L91-L95"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"All `launch_args` are joined with `shlex::try_join` into a single string and passed to `am start` as one positional argument. `am start` (and adb shell) will treat the entire quoted blob as a single token rather than separate arguments/flags, so multiple launch arguments are not delivered to the activity as distinct args. Also no `-e`/extras flag is used, so these are passed as bare trailing tokens to `am`, which is not how Android passes args to an activity.","fix":"Pass each launch arg as a separate `.arg(...)` (after appropriate `am` extras flags such as `--es`/`-e`) instead of shlex-joining them into one argument, or document precisely how `am` is expected to consume them.","locations":[{"ref":"xbuild/src/devices/adb.rs:103-116","code":"  103 |         // Quote arguments for `am` so that they don't already get parsed by `adb`.\n  104 |         let launch_args = shlex::try_join(launch_args.iter().map(String::as_str))\n  105 |             .context(\"Failed to re-quote launch arguments\")?;\n  106 | \n  107 |         let status = self\n  108 |             .shell(device, None)\n  109 |             .arg(\"am\")\n  110 |             .arg(\"start\")\n  111 |             .arg(\"-a\")\n  112 |             .arg(\"android.intent.action.MAIN\")\n  113 |             .arg(\"-n\")\n  114 |             .arg(format!(\"{package}/{activity}\"))\n  115 |             .arg(launch_args)\n  116 |             .status()?;","lines":14,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/devices/adb.rs#L103-L116"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"The icon DPI table has a duplicate density bucket: both 144px and 192px map to \"xxh\", producing the directory `mipmap-xxhdpi` twice. The second iteration (192px) overwrites the icons written for the first (144px) and there is no `xhdpi`/correct `xxxhdpi` split as Android expects (m=48, h=72, xh=96, xxh=144, xxxh=192). The 256px entry is also non-standard. This is a copy-paste mistake that yields wrong-resolution launcher icons.","fix":"Use the correct standard densities and unique bucket names, e.g. [(\"m\",48),(\"h\",72),(\"xh\",96),(\"xxh\",144),(\"xxxh\",192)] (drop the duplicate \"xxh\" and the stray 256 entry).","locations":[{"ref":"xbuild/src/gradle/mod.rs:150-157","code":"  150 |         let dpis = [\n  151 |             (\"m\", 48),\n  152 |             (\"h\", 72),\n  153 |             (\"xh\", 96),\n  154 |             (\"xxh\", 144),\n  155 |             (\"xxh\", 192),\n  156 |             (\"xxxh\", 256),\n  157 |         ];","lines":8,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/gradle/mod.rs#L150-L157"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"Table::lookup_package_id returns `header.id as u8` after matching by name, but ResTablePackageHeader.id is a u32. If a package id exceeds 255 nd byte length each as a single u8 (write_u8(chars as u8), write_u8(string.len() as u8)). The UTF-8 string-pool format supports a 2-byte length encoding for lengths >= 0x80 (which the parser in Chunk::parse even reads), but the writer cannot emit it: any string of length >= 127 bytes triggers the assert and aborts, and char counts/byte lengths between 0x80 and 0xff would be silently mis-encoded if the assert were relaxed.","fix":"Implement the 2-byte high-bit length encoding for char count and byte length when they exceed 0x7f, mirroring the parser.","locations":[{"ref":"apk/src/res.rs:1110-1118","code":" 1110 |                 for string in strings {\n 1111 |                     indices.push(w.stream_position()? - strings_start);\n 1112 |                     assert!(string.len() < 0x7f);\n 1113 |                     let chars = string.chars().count();\n 1114 |                     w.write_u8(chars as u8)?;\n 1115 |                     w.write_u8(string.len() as u8)?;\n 1116 |                     w.write_all(string.as_bytes())?;\n 1117 |                     w.write_u8(0)?;\n 1118 |                 }","lines":9,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/res.rs#L1110-L1118"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"BlockMapBuilder::add reads in chunks of buf.capacity() and breaks only when a read returns fewer bytes than capacity. When the file size is an exact multiple of the chunk size, the final read returns 0 bytes (len 0 != capacity), but the loop has already pushed all real blocks and now pushes an extra Block computed over an empty buffer (hash of empty data). This adds a spurious trailing block to the block map for files that are exact multiples of 65536 bytes.","fix":"Break out of the loop when the read returns 0 bytes before pushing the block, or track total bytes read against file size to avoid emitting an empty trailing block.","locations":[{"ref":"msix/src/block_map.rs:36-45","code":"   36 |         loop {\n   37 |             self.buf.clear();\n   38 |             f.take(self.buf.capacity() as u64)\n   39 |                 .read_to_end(&mut self.buf)?;\n   40 |             file.blocks.push(Block::new(&self.buf));\n   41 |             if self.buf.len() != self.buf.capacity() {\n   42 |                 break;\n   43 |             }\n   44 |         }\n   45 |         self.block_map.files.push(file);","lines":10,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/msix/src/block_map.rs#L36-L45"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"`versions()` filters out every version whose `suffix` is `Some(..)`, so pre-release/qualified versions (e.g. `1.0.0-alpha`) can never be selected even when a range explicitly targets them. Combined with range parsing that stores suffixes, ranges over pre-release versions silently resolve to nothing.","fix":"Only filter pre-release versions when the requested range does not itself reference a pre-release, rather than unconditionally dropping all suffixed versions.","locations":[{"ref":"mvn/src/lib.rs:104-106","code":"  104 |                 .filter_map(|version| Version::from_str(version).ok())\n  105 |                 .filter(|version| version.suffix.is_none())\n  106 |                 .filter(|version| range.contains(version))","lines":3,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/mvn/src/lib.rs#L104-L106"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"On a read error from the logcat child's stdout, the `Err(_)` arm does nothing and the `loop` immediately retries `read_line`. A persistent error (e.g. broken pipe after the child dies) causes a tight infinite busy-loop that spins a CPU core forever, since the iterator never returns `None` on error.","fix":"On `Err(_)` return `None` (or break) to terminate iteration, optionally logging the error.","locations":[{"ref":"xbuild/src/devices/adb.rs:424-443","code":"  424 |     fn next(&mut self) -> Option<Self::Item> {\n  425 |         loop {\n  426 |             self.line.clear();\n  427 |             match self.reader.read_line(&mut self.line) {\n  428 |                 Ok(0) => return None,\n  429 |                 Ok(_) => {\n  430 |                     let line = self.line.trim();\n  431 |                     if let Some((date, line)) = line.split_once(' ') {\n  432 |                         if let Some((time, line)) = line.split_once(' ') {\n  433 |                             if date.len() == 5 && time.len() == 12 {\n  434 |                                 return Some(line.to_string());\n  435 |                             }\n  436 |                         }\n  437 |                     }\n  438 |                     return Some(self.line.clone());\n  439 |                 }\n  440 |                 Err(_) => {}\n  441 |             }\n  442 |         }\n  443 |     }","lines":20,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/xbuild/src/devices/adb.rs#L424-L443"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"add_attribute treats platformBuildVersionCode/platformBuildVersionName specially by inserting only the attribute name into the string pool, not the value. But compile_node (xml.rs) for these same attributes parses the value as an IntDec (attr.value().parse()), it does not look the value up in the string pool, so the asymmetry is benign here - however the else branch and this branch are identical except for not inserting the value, while compile_attr never handles these names, so if the value were ever needed as a string it would be absent. The special-case branch and its else branch are duplicative and the intent is unclear.","fix":"Document why the value is intentionally omitted for platformBuildVersion* (it is parsed as an integer), or remove the redundant branch.","locations":[{"ref":"apk/src/compiler/attributes.rs:74-79","code":"   74 |         if attr.name() == \"platformBuildVersionCode\" || attr.name() == \"platformBuildVersionName\" {\n   75 |             self.strings.insert(attr.name());\n   76 |         } else {\n   77 |             self.strings.insert(attr.name());\n   78 |             self.strings.insert(attr.value());\n   79 |         }","lines":6,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/compiler/attributes.rs#L74-L79"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"ResStringPoolHeader parsing in Chunk::parse reads UTF-8 string char/byte high-bit lengths but ORs the high byte incorrectly: `charsh & 0x7f | r.read_u8()? as u16` keeps only the low 7 bits of the first byte and ORs the second byte without shifting it left by 8 (the spec encodes the value as ((b0 & 0x7f) << 8) | b1). The same shift bug appears for the UTF-16 path (`charsh & 0x7fff | next`). Lengths >= 0x80 (UTF-8) / 0x8000 (UTF-16) are decoded wrong; values are only ignored (assigned to _chars), but the bytes length uses the same broken decode and IS used to size the buffer.","fix":"Decode as `((high & 0x7f) << 8) | low` (and `((high & 0x7fff) << 8)` style per spec) so multi-byte lengths are correct; the byte length feeds read_exact buffer sizing.","locations":[{"ref":"apk/src/res.rs:897-925","code":"  897 |                     if string_pool_header.is_utf8() {\n  898 |                         let charsh = r.read_u8()? as u16;\n  899 |                         let _chars = if charsh > 0x7f {\n  900 |                             charsh & 0x7f | r.read_u8()? as u16\n  901 |                         } else {\n  902 |                             charsh\n  903 |                         };\n  904 |                         let bytesh = r.read_u8()? as u16;\n  905 |                         let bytes = if bytesh > 0x7f {\n  906 |                             bytesh & 0x7f | r.read_u8()? as u16\n  907 |                         } else {\n  908 |                             bytesh\n  909 |                         };\n  910 |                         let mut buf = vec![0; bytes as usize];\n  911 |                         r.read_exact(&mut buf)?;\n  912 |                         // some times there is an invalid string?\n  913 |                         let s = String::from_utf8(buf).unwrap_or_default();\n  914 |                         strings.push(s);\n  915 |                         if r.read_u8()? != 0 {\n  916 |                             // fails to read some files otherwise\n  917 |                             r.seek(SeekFrom::Start(end_pos))?;\n  918 |                         }\n  919 |                     } else {\n  920 |                         let charsh = r.read_u16::<LittleEndian>()? as u32;\n  921 |                         let chars = if charsh > 0x7fff {\n  922 |                             charsh & 0x7fff | r.read_u16::<LittleEndian>()? as u32\n  923 |                         } else {\n  924 |                             charsh\n  925 |                         };","lines":29,"link":"https://github.com/rust-mobile/xbuild/blob/e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1/apk/src/res.rs#L897-L925"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"SignedData::read and ApkSignatureBlockV2::read decrement unsigned `remaining_*` counters by attacker-controlled lengths (e.g. `remaining_size -= signer_size as u64 + 4`, `remaining_signature_size -= signature_size + 4`, `remaining_certificates_size -= length + 4`). If a length field is larger than the remaining counter, the u32/u64 subtraction underflows (panic in debug, wrapping huge value -> effectively infinite loop / over-read in release) on a malformed APK
