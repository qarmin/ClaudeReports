<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `run_method` in `convert_32bit_to_64bit.rs`, `argument_sizes` is computed for every kernel input argument via `arg.info.v_type.layout().unwrap()`. `Type::layout()` (defined in `ptx_parser/src/ast.rs`) explicitly returns `None` for `Type::Texref` (`Type::Texref => return None`). PTX allows old-style texture-reference kernel parameters declared as `.param .texref` (parsed via `multi_variable` in `ptx_parser/src/lib.rs`, which produces `VariableInfo { v_type: Type::Texref, .. }` for `.param` state space). Since `convert_32bit_to_64bit::run` is invoked unconditionally for every 32-bit module (`ptx/src/pass/mod.rs`, `if ast.address_size == 32 { convert_32bit_to_64bit::run(...) }`), any 32-bit kernel with a `.texref` parameter causes `.unwrap()` to panic on `None`, crashing the whole compilation instead of returning a `TranslateError`.","fix":"Replace the `.unwrap()` with proper error propagation, e.g. `let layout = arg.info.v_type.layout().ok_or_else(error_unreachable)?;` (or `error_todo()` if `.texref` kernel parameters are not yet supported by the 32-bit pass), so malformed/unsupported input produces a `TranslateError` instead of a panic.","locations":[{"ref":"ptx/src/pass/convert_32bit_to_64bit.rs:190-199","code":"  190 |         let argument_sizes = method\n  191 |             .input_arguments\n  192 |             .iter()\n  193 |             .map(|arg| {\n  194 |                 let layout = arg.info.v_type.layout().unwrap();\n  195 |                 let size = layout.size() as u32;\n  196 |                 let align = layout.align() as u32;\n  197 |                 (size, align)\n  198 |             })\n  199 |             .collect();","lines":10,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx/src/pass/convert_32bit_to_64bit.rs#L190-L199"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`is_addressable` in `insert_implicit_conversions.rs` uses `todo!()` for `ast::StateSpace::SharedCluster`, `ast::StateSpace::SharedCta`, and `ast::StateSpace::ParamFunc`, which unconditionally panics if reached. It is called from `default_implicit_conversion` (used on every operand of every instruction that isn't itself in `Reg` space) whenever `operand_space != ast::StateSpace::Reg` and the instruction is in `Reg` space - e.g. taking the address of a `.shared::cta` or `.shared::cluster` variable (a legitimate, modern PTX ISA feature used with cluster-scoped shared memory on newer GPUs). Note that the sibling function `coerces_to_generic` in the same file treats `SharedCta` and `SharedCluster` as normal, valid address spaces (grouped with `Shared`), showing `is_addressable` is simply missing the equivalent arms rather than these spaces being genuinely unsupported. Unlike other unimplemented-feature paths in this codebase which return a graceful `TranslateError` via `error_todo()`/`error_unreachable()`, this uses a hard `todo!()` panic that will crash the whole compiler on otherwise-valid PTX input.","fix":"Add `ast::StateSpace::SharedCluster | ast::StateSpace::SharedCta => true` (mirroring `coerces_to_generic`) and handle `ast::StateSpace::ParamFunc` explicitly (`true` or `false` depending on intended semantics) instead of falling through to `todo!()`, so `is_addressable` never panics on a valid `ast::StateSpace` value.","locations":[{"ref":"ptx/src/pass/insert_implicit_conversions.rs:184-196","code":"  184 | fn is_addressable(this: ast::StateSpace) -> bool {\n  185 |     match this {\n  186 |         ast::StateSpace::Const\n  187 |         | ast::StateSpace::Generic\n  188 |         | ast::StateSpace::Global\n  189 |         | ast::StateSpace::ParamEntry\n  190 |         | ast::StateSpace::Local\n  191 |         | ast::StateSpace::Shared => true,\n  192 |         ast::StateSpace::Param | ast::StateSpace::Reg => false,\n  193 |         ast::StateSpace::SharedCluster\n  194 |         | ast::StateSpace::SharedCta\n  195 |         | ast::StateSpace::ParamFunc => todo!(),\n  196 |     }","lines":13,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx/src/pass/insert_implicit_conversions.rs#L184-L196"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`zluda_common::drop_checked` transmutes the incoming `T::CudaHandle` directly into a `ManuallyDrop<Box<LiveCheck<T>>>` and immediately calls `LiveCheck::drop_checked` on it, with no null check. This is inconsistent with the sibling function `as_ref` (`zluda_common/src/lib.rs:1088-1094`), which explicitly checks `mem::transmute_copy::<_, usize>(handle) == 0` and returns `None` before dereferencing. Because callers such as `zluda::impl::module::unload` pass the raw `CUmodule` handle straight through (via `from_cuda_nop!`, which performs no null check for bare handle types like `CUmodule`), a caller invoking e.g. `cuModuleUnload(0)` with a NULL handle causes `drop_checked` to dereference a null pointer inside `LiveCheck::drop_checked`'s `self.cookie == T::COOKIE` check, crashing the process.","fix":"Add the same null check used in `as_ref` to `drop_checked` before transmuting the handle, e.g. return `Err(T::LIVENESS_FAIL)` if `mem::transmute_copy::<_, usize>(&handle) == 0`.","locations":[{"ref":"zluda_common/src/lib.rs:1088-1094","code":" 1088 | pub fn as_ref<'a, T: ZludaObject>(handle: &'a T::CudaHandle) -> Option<&'a LiveCheck<T>> {\n 1089 |     if unsafe { mem::transmute_copy::<_, usize>(handle) } == 0 {\n 1090 |         return None;\n 1091 |     }\n 1092 |     let option_box = unsafe { mem::transmute::<_, &'a ManuallyDrop<Box<LiveCheck<T>>>>(handle) };\n 1093 |     Some(option_box)\n 1094 | }","lines":7,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda_common/src/lib.rs#L1088-L1094"},{"ref":"zluda_common/src/lib.rs:1100-1106","code":" 1100 | pub fn drop_checked<T: ZludaObject>(handle: T::CudaHandle) -> Result<(), T::Error> {\n 1101 |     let mut wrapped_object: ManuallyDrop<Box<LiveCheck<T>>> =\n 1102 |         unsafe { mem::transmute_copy(&handle) };\n 1103 |     let underlying_error = LiveCheck::drop_checked(&mut wrapped_object)?;\n 1104 |     unsafe { ManuallyDrop::drop(&mut wrapped_object) };\n 1105 |     underlying_error\n 1106 | }","lines":7,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda_common/src/lib.rs#L1100-L1106"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`cuGetExportTable` is generated by the `override_fn_full` macro (`zluda_trace/src/lib.rs:149-159`), which calls `cuGetExportTable_impl` directly with no `catch_unwind` protection, unlike every other traced entry point which goes through `GlobalState2::under_lock` whose `under_lock_impl` closure is wrapped in `std::panic::catch_unwind` (see `zluda_trace/src/lib.rs:1067-1078`). Inside `cuGetExportTable_impl`, the `LateInit::Error => panic!()` arm and the following `.unwrap()` (`zluda_trace/src/lib.rs:691` and `:696`) are reachable in normal operation: if a previous CUDA call already failed to load the real driver library (e.g. `ZLUDA_CUDA_LIB` points at a missing/invalid library, or `GlobalDelayedState::new` otherwise fails), `global_state.delayed_state` becomes `LateInit::Error`, and any subsequent call to `cuGetExportTable` hits the explicit `panic!()`. Because this panic unwinds across an `extern \"system\"` FFI boundary with no `catch_unwind` guard, the process aborts (Rust aborts on unwind across a non-`C-unwind` extern boundary) instead of gracefully returning an error the way every other intercepted function does.","fix":"Wrap the body of `cuGetExportTable_impl` in `std::panic::catch_unwind` (mirroring `GlobalState2::under_lock`), or better, refactor `cuGetExportTable_impl` to reuse `GlobalState2::under_lock` so all entry points share the same panic-safety guarantees.","locations":[{"ref":"zluda_trace/src/lib.rs:149-159","code":"  149 | macro_rules! override_fn_full {\n  150 |     ($($abi:literal fn $fn_name: ident ( $($arg_id:ident : $arg_type:ty),* ) -> $ret_type:ty;)*) => {\n  151 |         $(\n  152 |             #[no_mangle]\n  153 |             #[allow(non_snake_case)]\n  154 |             pub unsafe extern $abi fn $fn_name ( $( $arg_id : $arg_type),* ) -> $ret_type {\n  155 |                 paste!{ [<$fn_name _impl >] ( $($arg_id),* ) }\n  156 |             }\n  157 |         )*\n  158 |     }\n  159 | }","lines":11,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda_trace/src/lib.rs#L149-L159"},{"ref":"zluda_trace/src/lib.rs:688-698","code":"  688 |     let delayed_state = match global_state.delayed_state {\n  689 |         LateInit::Success(ref mut delayed_state) => delayed_state,\n  690 |         // There's no libcuda to load, so we might as well panic\n  691 |         LateInit::Error => panic!(),\n  692 |         LateInit::Unitialized => {\n  693 |             global_state.delayed_state = GlobalDelayedState::new(panic_guard.writer, &mut logger);\n  694 |             // `global_state.delayed_state` could be LateInit::Error,\n  695 |             // we can crash in this case since there's no libcuda\n  696 |             global_state.delayed_state.as_mut().unwrap()\n  697 |         }\n  698 |     };","lines":11,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda_trace/src/lib.rs#L688-L698"},{"ref":"zluda_trace/src/lib.rs:928","code":"  928 |     override_fn_full <= [cuGetExportTable],","lines":1,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda_trace/src/lib.rs#L928"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"hard","description":"In `cu_launch_kernel` (`zluda32/src/lib.rs:513-528`), the `.scan(...)` closure that builds `kernel_params` calls `layout.extend(arg_info.to_layout().unwrap()).unwrap()` - two chained `unwrap()`s per kernel argument. `arg_info` comes from `state.function_args`, which was populated by the `zludaGetFunctionArgs` IPC response (`zludaGetFunctionArgsOut.args`, a `Vec<FunctionArgInfo>` deserialized from the 64-bit server, see `cu_module_get_function` at `zluda32/src/lib.rs:703-735`). If `arg_info.to_layout()` fails (e.g. an invalid/zero alignment or a size that isn't a multiple of a power-of-two alignment) the first `unwrap()` panics; if the running `Layout::extend` computation overflows `isize::MAX` while accumulating many/huge argument sizes, the second `unwrap()` panics. Because `FunctionArgInfo` values ultimately originate from parsing the loaded module/kernel's argument metadata (which for a corrupted, adversarial, or simply buggy PTX/cubin module can contain unusual sizes/alignments), a crafted kernel signature can crash the 32-bit `zluda32` client process via this reachable panic instead of surfacing a `CUerror`.","fix":"Replace both `unwrap()` calls with proper error propagation, e.g. `let layout = arg_info.to_layout().map_err(|_| CUerror::INVALID_VALUE)?; let (new_layout, offset) = layout_acc.extend(layout).map_err(|_| CUerror::INVALID_VALUE)?;`, changing the closure to return `Result<_, CUerror>` for every branch.","locations":[{"ref":"zluda32/src/lib.rs:513-528","code":"  513 |     let kernel_params = args\n  514 |         .iter()\n  515 |         .scan(\n  516 |             unsafe { Layout::from_size_align_unchecked(0, 1) },\n  517 |             |layout, arg_info| {\n  518 |                 let (new_layout, offset) = layout.extend(arg_info.to_layout().unwrap()).unwrap();\n  519 |                 total_size = offset + arg_info.size as usize;\n  520 |                 *layout = new_layout;\n  521 |                 let start = arg_ptr.wrapping_byte_add(offset as usize).cast::<u8>();\n  522 |                 Some(Ok(unsafe {\n  523 |                     std::slice::from_raw_parts(start, arg_info.size as usize)\n  524 |                 }\n  525 |                 .to_vec()))\n  526 |             },\n  527 |         )\n  528 |         .collect::<Result<Vec<_>, CUerror>>()?;","lines":16,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda32/src/lib.rs#L513-L528"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `ptx_parser_macros_impl/src/lib.rs`, `ArgumentField::parse_block` parses the `{ type: ..., space: ..., repr: ..., dst: ..., relaxed_type_check: ... }` block form of an argument declaration used inside `arguments<T>: { ... }` in the `generate_instruction_type!` DSL (consumed from `ptx_parser/src/ast.rs`). The `repr` key is optional at the syntax level (nothing enforces its presence while parsing `all_fields`), but the function ends with `Ok((repr.unwrap(), type_, space, is_dst, relaxed_type_check))`. If a developer writes a field block that omits `repr:` (e.g. only specifies `type:`/`space:`), `repr` stays `None` and `.unwrap()` panics during macro expansion instead of reporting a clean error at the relevant span. The same anti-pattern also occurs in `InstructionVariant::emit_visit_map`, where `Some(Arguments::Decl(_)) => { let map = self.map.as_ref().unwrap(); ... }` panics if a variant using the `arguments: SomeType` (`Decl`) form omits the required `map:` property that `emit_visit_map` needs.","fix":"Replace both `.unwrap()` calls with proper `syn::Error`s: in `parse_block`, if `repr` is `None` after the loop, return `Err(syn::Error::new(content.span(), \"missing required `repr` key in argument block\"))` instead of `Ok((repr.unwrap(), ...))`; in `emit_visit_map`, when `self.map` is `None` for a `Arguments::Decl` variant, return a `syn::Error` from the enclosing fallible parse/emit path (or validate eagerly in `InstructionVariant::parse`) instead of calling `.unwrap()` on `self.map.as_ref()`.","locations":[{"ref":"ptx_parser_macros_impl/src/lib.rs:573-624","code":"  573 |     fn parse_block(\n  574 |         input: syn::parse::ParseStream,\n  575 |     ) -> syn::Result<(Type, Option<Expr>, Option<Expr>, Option<bool>, bool)> {\n  576 |         let content;\n  577 |         braced!(content in input);\n  578 |         let all_fields =\n  579 |             Punctuated::<ExprOrPath, Token![,]>::parse_terminated_with(&content, |content| {\n  580 |                 let lookahead = content.lookahead1();\n  581 |                 Ok(if lookahead.peek(Token![type]) {\n  582 |                     content.parse::<Token![type]>()?;\n  583 |                     content.parse::<Token![:]>()?;\n  584 |                     ExprOrPath::Type(content.parse::<Expr>()?)\n  585 |                 } else if lookahead.peek(Ident) {\n  586 |                     let name_ident = content.parse::<Ident>()?;\n  587 |                     content.parse::<Token![:]>()?;\n  588 |                     match &*name_ident.to_string() {\n  589 |                         \"relaxed_type_check\" => {\n  590 |                             ExprOrPath::RelaxedTypeCheck(content.parse::<LitBool>()?.value)\n  591 |                         }\n  592 |                         \"repr\" => ExprOrPath::Repr(content.parse::<Type>()?),\n  593 |                         \"space\" => ExprOrPath::Space(content.parse::<Expr>()?),\n  594 |                         \"dst\" => {\n  595 |                             let ident = content.parse::<LitBool>()?;\n  596 |                             ExprOrPath::Dst(ident.value)\n  597 |                         }\n  598 |                         name => {\n  599 |                             return Err(syn::Error::new(\n  600 |                                 name_ident.span(),\n  601 |                                 format!(\"Unexpected key `{}`, expected `repr` or `space\", name),\n  602 |                             ))\n  603 |                         }\n  604 |                     }\n  605 |                 } else {\n  606 |                     return Err(lookahead.error());\n  607 |                 })\n  608 |             })?;\n  609 |         let mut repr = None;\n  610 |         let mut type_ = None;\n  611 |         let mut space = None;\n  612 |         let mut is_dst = None;\n  613 |         let mut relaxed_type_check = false;\n  614 |         for exp_or_path in all_fields {\n  615 |             match exp_or_path {\n  616 |                 ExprOrPath::Repr(r) => repr = Some(r),\n  617 |                 ExprOrPath::Type(t) => type_ = Some(t),\n  618 |                 ExprOrPath::Space(s) => space = Some(s),\n  619 |                 ExprOrPath::Dst(x) => is_dst = Some(x),\n  620 |                 ExprOrPath::RelaxedTypeCheck(relaxed) => relaxed_type_check = relaxed,\n  621 |             }\n  622 |         }\n  623 |         Ok((repr.unwrap(), type_, space, is_dst, relaxed_type_check))\n  624 |     }","lines":52,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx_parser_macros_impl/src/lib.rs#L573-L624"},{"ref":"ptx_parser_macros_impl/src/lib.rs:311-327","code":"  311 |     fn emit_visit_map(&self, enum_: &Ident, tokens: &mut TokenStream) {\n  312 |         let name = &self.name;\n  313 |         let data = &self.data.as_ref().map(|_| quote! { data,});\n  314 |         let arguments = match self.arguments {\n  315 |             None => None,\n  316 |             Some(Arguments::Decl(_)) => {\n  317 |                 let map = self.map.as_ref().unwrap();\n  318 |                 quote! {\n  319 |                     #enum_ :: #name { #data arguments } => {\n  320 |                         #map\n  321 |                     }\n  322 |                 }\n  323 |                 .to_tokens(tokens);\n  324 |                 return;\n  325 |             }\n  326 |             Some(Arguments::Def(ref def)) => Some(def),\n  327 |         };","lines":17,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx_parser_macros_impl/src/lib.rs#L311-L327"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `ptx_parser_macros_impl/src/parser.rs`, `Arguments::parse` handles the `[...]` (bracketed) argument syntax used for e.g. `[a{, b}, c]`. When the bracket content does not start with `|` (the `pre_pipe` case), it recursively calls `Self::parse(&bracketed)` into `sub_args`, then unconditionally does `sub_args.0.first_mut().unwrap().pre_bracket = true;` and `sub_args.0.last_mut().unwrap().post_bracket = true;`. If the bracketed content is empty or contains only a stray comma (e.g. a typo like `[]` or `[,]` in the `derive_parser!`/`generate_instruction_type!` DSL input inside `ptx_parser/src/lib.rs` or `ptx_parser/src/ast.rs`), the recursive `Arguments::parse` call returns an empty `Vec` (its parse loop hits the trailing `else { break; }` immediately), and `first_mut()`/`last_mut()` return `None`, so `.unwrap()` panics. This turns a simple typo in the macro's DSL input into an unhelpful Rust panic during macro expansion instead of a clean `syn::Error` pointing at the offending source location.","fix":"Before calling `.unwrap()`, check whether `sub_args.0` is empty and return a `syn::Error` (e.g. `syn::Error::new(bracketed.span(), \"expected at least one argument inside `[...]`\")`) instead of panicking, so malformed DSL input produces a normal macro-expansion diagnostic.","locations":[{"ref":"ptx_parser_macros_impl/src/parser.rs:551-563","code":"  551 |             } else if lookahead.peek(token::Bracket) {\n  552 |                 let bracketed;\n  553 |                 bracketed!(bracketed in input);\n  554 |                 if bracketed.peek(Token![|]) {\n  555 |                     optional = true;\n  556 |                     bracketed.parse::<Token![|]>()?;\n  557 |                     pre_pipe = true;\n  558 |                     ident = bracketed.parse::<HyphenatedIdent>()?;\n  559 |                 } else {\n  560 |                     let mut sub_args = Self::parse(&bracketed)?;\n  561 |                     sub_args.0.first_mut().unwrap().pre_bracket = true;\n  562 |                     sub_args.0.last_mut().unwrap().post_bracket = true;\n  563 |                     if peek_brace_token(input, Token![.]) {","lines":13,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx_parser_macros_impl/src/parser.rs#L551-L563"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`host_alloc` calls `hipHostMalloc(pp, bytesize, flags)?` to allocate pinned host memory and then `add_allocation(*pp, bytesize, context)?` to record it in the global allocation table. If `add_allocation` fails (e.g. `global_state().allocations.lock()` returns an error because the mutex was poisoned by an earlier panic elsewhere in the process), `host_alloc` returns `Err` without freeing the memory that `hipHostMalloc` already allocated into `*pp`. This both leaks the pinned host allocation and leaves `*pp` pointing at a live-but-untracked buffer even though the function reports failure, so the caller (having received an error) will never call `cuMemFreeHost` on it. This is inconsistent with the sibling function `alloc_v2`, which wraps the equivalent registration step in a `DropGuard` that calls `hipFree` if `add_allocation` fails.","fix":"Mirror the `DropGuard` pattern used in `alloc_v2`/`fill_with_zero_and_register`: on `add_allocation` failure, call `hipFreeHost(*pp)` before propagating the error, e.g. wrap the call in a guard that frees `*pp` unless `add_allocation` succeeds.","locations":[{"ref":"zluda/src/impl/memory.rs:159-168","code":"  159 | pub(crate) unsafe fn host_alloc(\n  160 |     pp: &mut *mut ::core::ffi::c_void,\n  161 |     bytesize: usize,\n  162 |     flags: ::std::os::raw::c_uint,\n  163 | ) -> CUresult {\n  164 |     let context = context::get_current_context()?;\n  165 |     hipHostMalloc(pp, bytesize, flags)?;\n  166 |     add_allocation(*pp, bytesize, context)?;\n  167 |     Ok(())\n  168 | }","lines":10,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda/src/impl/memory.rs#L159-L168"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`Allocator::alloc_range` in `zluda64_server/src/main.rs` computes `size.next_multiple_of(Self::ALLOCATION_UNIT)` where `size: u32` comes directly from the client-controlled `cuMemAlloc_v2In.bytesize` field (forwarded unchecked from the 32-bit client's `cu_mem_alloc_v2`). `u32::next_multiple_of` rounds up via `self + (rhs - r)`, which overflows `u32` for any `size` within `Self::ALLOCATION_UNIT` (256) of `u32::MAX` (e.g. `size = u32::MAX` gives `4294967295 % 256 == 255`, so it computes `4294967295 + 1`, which overflows). In a release build (no overflow checks) this silently wraps to a tiny value, so `units` ends up far smaller than the requested `size`; `alloc_range`/`alloc` then hands back a device pointer backed by a much smaller real allocation than the caller asked for and believes it received. Any subsequent memcpy/memset that uses the original (huge) `bytesize` against that pointer will write/read past the actual backing allocation inside the server's 512 MiB device memory pool, corrupting adjacent allocations. In a debug build the overflow instead panics, crashing the 64-bit server. Either way, a `cuMemAlloc_v2` call with a `bytesize` near `u32::MAX` (a value fully representable and reachable through the 32-bit client's `usize` argument) triggers this.","fix":"Use a checked computation, e.g. `size.checked_add(Self::ALLOCATION_UNIT - 1).and_then(|s| s.checked_div(Self::ALLOCATION_UNIT)).ok_or(CUerror::OUT_OF_MEMORY)?`, and return `CUerror::OUT_OF_MEMORY`/`CUerror::INVALID_VALUE` instead of letting the rounding arithmetic overflow.","locations":[{"ref":"zluda64_server/src/main.rs:219-225","code":"  219 |     fn alloc_range(&mut self, size: u32) -> Result<Range<u32>, CUerror> {\n  220 |         self.get_or_allocate_device_ptr()?;\n  221 |         let units = size.next_multiple_of(Self::ALLOCATION_UNIT) / Self::ALLOCATION_UNIT;\n  222 |         self.allocator\n  223 |             .allocate_range(units)\n  224 |             .map_err(|_| CUerror::OUT_OF_MEMORY)\n  225 |     }","lines":7,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda64_server/src/main.rs#L219-L225"},{"ref":"zluda64_server/src/main.rs:914-922","code":"  914 | fn cu_mem_alloc_v2(\n  915 |     state: &mut State,\n  916 |     input: &ArchivedcuMemAlloc_v2In,\n  917 | ) -> Result<cuMemAlloc_v2Out, CUerror> {\n  918 |     let fake_ptr = state.devmemory.alloc(input.bytesize.to_native())?;\n  919 |     Ok(cuMemAlloc_v2Out {\n  920 |         dptr: u32_le::from_native(fake_ptr),\n  921 |     })\n  922 | }","lines":9,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda64_server/src/main.rs#L914-L922"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"The `s32` function in `ptx_parser/src/lib.rs` parses a signed 32-bit immediate by first parsing the *unsigned magnitude* text with `i32::from_str_radix(text, radix)` and only negating the result afterwards if a `Minus` token was seen. Because `i32::from_str_radix` on the unsigned magnitude only accepts values up to `i32::MAX` (2147483647), the legitimate value `i32::MIN` (-2147483648, magnitude 2147483648) fails to parse: `i32::from_str_radix(\"2147483648\", 10)` returns `Err(PosOverflow)`, so `s32` falls back to returning `0` and records a bogus `PtxError::ParseInt` (`PosOverflow`) instead of the correct value. This was confirmed empirically: parsing the token stream for `-2147483648` with `s32` yields `Ok(0)` plus a `ParseInt`/`PosOverflow` error, instead of `Ok(-2147483648)`. `s32` is used to parse the signed offset in register-offset operands (`preceded(Token::Plus, s32)` inside `ParsedOperand::parse`'s `ident_operands`), so a legitimate PTX memory operand such as `[%rd1+-2147483648]` silently gets mis-parsed into an offset of `0` plus a spurious integer-parse error. The sibling function `int_immediate` avoids this bug by formatting the sign into the string first (`format!(\"-{num}\")`) before calling `i64::from_str_radix`, which correctly handles `i64::MIN`.","fix":"Mirror the approach used in `int_immediate`: build the signed string first and parse it in one call, e.g. `let text = if sign.is_some() { format!(\"-{text}\") } else { text.to_string() }; match i32::from_str_radix(&text, radix) { Ok(x) => Ok(x), Err(err) => Err((0, PtxError::from(err))) }`, so the full signed range (including `i32::MIN`) parses correctly in a single `from_str_radix` call instead of parsing the magnitude as unsigned-range-limited `i32` and negating afterwards.","locations":[{"ref":"ptx_parser/src/lib.rs:316-325","code":"  316 | fn s32<'a, 'input>(stream: &mut PtxParser<'a, 'input>) -> PResult<i32> {\n  317 |     take_error((opt(Token::Minus), num).map(|(sign, x)| {\n  318 |         let (text, radix, _) = x;\n  319 |         match i32::from_str_radix(text, radix) {\n  320 |             Ok(x) => Ok(if sign.is_some() { -x } else { x }),\n  321 |             Err(err) => Err((0, PtxError::from(err))),\n  322 |         }\n  323 |     }))\n  324 |     .parse_next(stream)\n  325 | }","lines":10,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx_parser/src/lib.rs#L316-L325"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"Both sides of the `zluda32`/`zluda64_server` IPC channel read a length-prefix field from the pipe and then allocate/reserve a buffer of that exact size with no upper bound. On the client side, `Server::remote_call_framed_out` (`zluda32/src/ipc.rs:135-161`) reads `out_size` via `read_u32(self)` (line 154) and immediately does `self.buffer.resize(out_size as usize, 0)` (line 155) before reading that many bytes from the pipe. On the server side, `handle_cuda_function_framed_in` (`zluda64_server/src/main.rs:1098-1127`) reads `length_prefix` via `client.read_u32_le().await? as usize` (line 1108) and passes it to `read_sized`, which calls `buffer.reserve(remaining_read)` (`zluda64_server/src/main.rs:1169-1188`, line 1175) with no cap. In both cases a truncated, corrupted, or version-mismatched IPC message (or simply a bug in the peer process) supplying a length prefix close to `u32::MAX` causes an attempted multi-gigabyte allocation before any of the actual payload bytes have even been validated, aborting the process (both `zluda32.dll`'s host process and `zluda64_server.exe` allocate via `AlignedVec`/`Vec`, which abort on allocation failure) instead of returning a `CUerror`.","fix":"Cap the accepted length prefix to a sane maximum (e.g. a few tens of megabytes, well above any legitimate `cuLaunchKernel`/`cuModuleLoadData`/`cuMemcpyHtoDAsync_v2` payload) and return `CUerror::UNKNOWN`/close the connection instead of calling `resize`/`reserve` with an attacker- or corruption-controlled size.","locations":[{"ref":"zluda32/src/ipc.rs:154-155","code":"  154 |         let out_size = read_u32(self)?;\n  155 |         self.buffer.resize(out_size as usize, 0);","lines":2,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda32/src/ipc.rs#L154-L155"},{"ref":"zluda64_server/src/main.rs:1108-1109","code":" 1108 |     let length_prefix = client.read_u32_le().await? as usize;\n 1109 |     buffer = read_sized(buffer, client, length_prefix).await?;","lines":2,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda64_server/src/main.rs#L1108-L1109"},{"ref":"zluda64_server/src/main.rs:1169-1188","code":" 1169 | async fn read_sized(\n 1170 |     mut buffer: AlignedVecBuffer,\n 1171 |     client: &mut NamedPipeClient,\n 1172 |     mut remaining_read: usize,\n 1173 | ) -> std::io::Result<AlignedVecBuffer> {\n 1174 |     buffer.clear();\n 1175 |     buffer.reserve(remaining_read)?;\n 1176 |     while remaining_read > 0 {\n 1177 |         let BufResult(read_result, new_buffer) = client.append(buffer).await;\n 1178 |         let n = read_result?;\n 1179 |         remaining_read = remaining_read.checked_sub(n).ok_or_else(|| {\n 1180 |             std::io::Error::new(\n 1181 |                 std::io::ErrorKind::InvalidData,\n 1182 |                 \"Read more bytes than expected\",\n 1183 |             )\n 1184 |         })?;\n 1185 |         buffer = new_buffer;\n 1186 |     }\n 1187 |     Ok(buffer)\n 1188 | }","lines":20,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda64_server/src/main.rs#L1169-L1188"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`cu_device_get_name` in `zluda64_server/src/main.rs` does `let mut name = vec![0u8; input.len.to_native() as usize];` where `input.len` is the `cuDeviceGetNameIn.len` field, which on the client side (`zluda32/src/lib.rs:376-396`, `cu_device_get_name`) is taken directly from the caller-supplied `len: ::core::ffi::c_int` argument of `cuDeviceGetName` and forwarded over IPC unmodified. `c_int` is signed. If a caller (or a corrupted/malformed IPC message) supplies a negative `len`, `input.len.to_native() as usize` wraps around to a huge value close to `usize::MAX` on the 64-bit server, so `vec![0u8; ...]` attempts a near-unbounded allocation, aborting the 64-bit server process (and therefore breaking the whole 32-bit-to-64-bit proxy for the running application) instead of returning `CUerror::INVALID_VALUE`.","fix":"Validate `input.len.to_native()` is non-negative (and reasonably bounded) before using it as an allocation size, e.g. `let len = input.len.to_native(); if len < 0 { return Err(CUerror::INVALID_VALUE); } let mut name = vec![0u8; len as usize];`.","locations":[{"ref":"zluda64_server/src/main.rs:1014-1033","code":" 1014 | fn cu_device_get_name(\n 1015 |     state: &mut State,\n 1016 |     input: &ArchivedcuDeviceGetNameIn,\n 1017 | ) -> Result<cuDeviceGetNameOut, CUerror> {\n 1018 |     if input.dev.to_native() != state.device {\n 1019 |         return Err(CUerror::INVALID_DEVICE);\n 1020 |     }\n 1021 |     let mut name = vec![0u8; input.len.to_native() as usize];\n 1022 |     unsafe {\n 1023 |         cuDeviceGetName(\n 1024 |             name.as_mut_ptr().cast(),\n 1025 |             input.len.to_native(),\n 1026 |             state.device,\n 1027 |         )\n 1028 |     }?;\n 1029 |     if let Some(pos) = name.iter().copied().position(|c| c == 0) {\n 1030 |         name.truncate(pos);\n 1031 |     }\n 1032 |     Ok(cuDeviceGetNameOut { name })\n 1033 | }","lines":20,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda64_server/src/main.rs#L1014-L1033"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`get_elf_size` in `zluda_trace/src/trace.rs` reads the ELF header (`*start.cast::<elf32::header::Header>()` or `*start.cast::<elf64::header::Header>()`, 52/64 bytes) and then walks program/section headers purely based on offsets found inside that header, without ever validating that the underlying `raw_image` buffer is actually that large. `raw_image` originates from application-controlled arguments to `cuModuleLoadData`/`cuModuleLoadDataEx`/`cuModuleLoadFatBinary`/`cuLibraryLoadData`, which `record_new_library` (`zluda_trace/src/trace.rs:70-117`) passes straight into `zluda_common::CodeLibraryRef::try_load`. `CodeLibraryRef::try_load` only checks the first 4 bytes for the ELF magic (`zluda_common/src/lib.rs:1173-1187`) before classifying the buffer as `CodeModuleRef::Elf`; it performs no length validation. If the application supplies a module image that starts with the ELF magic bytes but is truncated (fewer than 52/64 bytes, or with corrupted/out-of-range program/section header offsets), `get_elf_size` reads past the end of the allocation, an out-of-bounds heap read that can crash the tracing process or leak adjacent memory into the dumped trace.","fix":"Thread the known/declared image size (when available from a wrapping fatbin/cubin header) into `get_elf_size` and bound every offset/read against it before dereferencing, or at minimum validate that program/section header offsets plus their sizes are not obviously insane (e.g. sanity-check against a conservative maximum) before doing the pointer arithmetic in `get_max_end_for`.","locations":[{"ref":"zluda_trace/src/trace.rs:168-192","code":"  168 | unsafe fn get_elf_size(start: *const c_void) -> Option<usize> {\n  169 |     let start = start.cast::<u8>();\n  170 |     let ei_class = start.add(mem::size_of_val(elf::header::ELFMAG));\n  171 |     let (header, header_size, is_64bit): (elf::header::Header, _, _) = match *ei_class {\n  172 |         elf::header::ELFCLASS32 => (\n  173 |             (*start.cast::<elf32::header::Header>()).into(),\n  174 |             mem::size_of::<elf32::header::Header>() as u64,\n  175 |             false,\n  176 |         ),\n  177 |         elf::header::ELFCLASS64 => (\n  178 |             (*start.cast::<elf64::header::Header>()).into(),\n  179 |             mem::size_of::<elf64::header::Header>() as u64,\n  180 |             true,\n  181 |         ),\n  182 |         _ => return None,\n  183 |     };\n  184 |     let mut max_end = header_size;\n  185 |     max_end = max_end.max(get_max_end_for::<elf::program_header::ProgramHeader>(\n  186 |         start, header, is_64bit,\n  187 |     )?);\n  188 |     max_end = max_end.max(get_max_end_for::<elf::section_header::SectionHeader>(\n  189 | (state.handles.get(input.stream.to_native())?);\n  903 |     unsafe {\n  904 |         cuMemcpyHtoDAsync_v2(\n  905 |             CUdeviceptr_v2(devptr),\n  906 |             input.src_host.as_ptr().cast(),\n  907 |             input.src_host.len(),\n  908 |             stream,\n  909 |         )\n  910 |     }?;\n  911 |     Ok(cuMemcpyHtoDAsync_v2Out {})\n  912 | }","lines":16,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda64_server/src/main.rs#L897-L912"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"hard","description":"`GlobalState2::under_lock` (via `under_lock_impl`) acquires `GLOBAL_STATE2` (a `ReentrantMutex<RefCell<GlobalState2>>`) once at the top of the function and holds it for the *entire* duration of the call, including the call to `inner_call(pre_ptr)` which invokes the real, potentially long-blocking CUDA driver function (e.g. `cuStreamSynchronize`, `cuEventSynchronize`, `cuCtxSynchronize`, which are routed through this same path via the `extern_redirect` macro). Since virtually every intercepted CUDA entry point in `zluda_trace` goes through `GlobalState2::under_lock`, this means all CUDA calls across *all* threads in the traced process are fully serialized on one global lock for as long as the underlying driver call takes. Because `ReentrantMutex` only allows re-entry from the *same* thread, this can deadlock a real multi-threaded application: if thread A calls a blocking function like `cuStreamSynchronize` (holding `GLOBAL_STATE2` for the whole wait), and the work it is waiting for must be submitted by thread B via another traced function such as `cuLaunchKernel`, thread B will block forever trying to acquire `GLOBAL_STATE2`, so the awaited work is never submitted and thread A never wakes up. This directly contradicts the function's own design comment stating 'Thread-safety: CUDA functions can be called from multiple threads'.","fix":"Do not hold the the synthesized `ast::CvtaDetails`.","locations":[{"ref":"ptx/src/pass/insert_explicit_load_store.rs:302-332","code":"  302 |     fn visit_mov(\n  303 |         &mut self,\n  304 |         data: ptx_parser::MovDetails,\n  305 |         mut arguments: ptx_parser::MovArgs<SpirvWord>,\n  306 |     ) -> ast::Instruction<SpirvWord> {\n  307 |         if let Some(remap) = self.variables.get(&arguments.src) {\n  308 |             match remap {\n  309 |                 RemapAction::PreLdPostSt { .. } => {}\n  310 |                 RemapAction::LDStSpaceChange {\n  311 |                     name, new_space, ..\n  312 |                 } => {\n  313 |                     let generic_var = self\n  314 |                         .resolver\n  315 |                         .register_unnamed(Some((data.typ.clone(), ast::StateSpace::Reg)));\n  316 |                     self.pre.push(ast::Instruction::Cvta {\n  317 |                         data: ast::CvtaDetails {\n  318 |                             state_space: *new_space,\n  319 |                             direction: ast::CvtaDirection::ExplicitToGeneric,\n  320 |                             size: 64,\n  321 |                         },\n  322 |                         arguments: ast::CvtaArgs {\n  323 |                             dst: generic_var,\n  324 |                             src: *name,\n  325 |                         },\n  326 |                     });\n  327 |                     arguments.src = generic_var;\n  328 |                 }\n  329 |             }\n  330 |         }\n  331 |         ast::Instruction::Mov { data, arguments }\n  332 |     }","lines":31,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx/src/pass/insert_explicit_load_store.rs#L302-L332"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`resolve_function_pointers::run` (via `run_directive`) walks `directives` in a single forward pass, inserting each non-kernel `method.name` into `functions` only after it is reached, and immediately calling `run_method` on that same directive using the `functions` set as it stands at that point. `run_statement` recognizes a function-pointer `Mov` only if `functions.contains(&src_reg)` is already true. Because the set is populated incrementally in file order, any `mov.u64 %rd, some_func;` that takes the address of a `.func` whose `Directive2::Method` directive appears *later* in `directives` than the directive currently being processed will not be recognized as a function pointer (the name is not yet in `functions`), so the statement is left as a plain `Statement::Instruction(ast::Instruction::Mov ...)` instead of being rewritten to `UnconditionalStatement::FunctionPointer(FunctionPointerDetails { .. })`. Downstream passes (e.g. `remove_unreachable_basic_blocks` and LLVM emission in `ptx/src/pass/llvm/emit.rs`, which special-cases `Statement::FunctionPointer`) never see this case as a function pointer, so a forward reference to a function pointer silently miscompiles instead of being resolved or reported as an error.","fix":"Do two passes over `directives`: first collect every non-kernel `method.name` into `functions` (via `Directive2::Method` matching without recursing into bodies), then do a second pass calling `run_method`/`run_statement` with the now-complete `functions` set. For example, change `run` to first `directives.iter().for_each(|d| if let Directive2::Method(m) = d { if !m.is_kernel() { functions.insert(m.name); } })` before mapping `run_directive` over the directives (and drop the `functions.insert` call currently inside `run_directive`).","locations":[{"ref":"ptx/src/pass/resolve_function_pointers.rs:5-28","code":"    5 | pub(crate) fn run<'input>(\n    6 |     directives: Vec<UnconditionalDirective>,\n    7 | ) -> Result<Vec<UnconditionalDirective>, TranslateError> {\n    8 |     let mut functions = FxHashSet::default();\n    9 |     directives\n   10 |         .into_iter()\n   11 |         .map(|directive| run_directive(&mut functions, directive))\n   12 |         .collect::<Result<Vec<_>, _>>()\n   13 | }\n   14 | \n   15 | fn run_directive<'input>(\n   16 |     functions: &mut FxHashSet<SpirvWord>,\n   17 |     directive: UnconditionalDirective,\n   18 | ) -> Result<UnconditionalDirective, TranslateError> {\n   19 |     Ok(match directive {\n   20 |         var @ Directive2::Variable(..) => var,\n   21 |         Directive2::Method(method) => {\n   22 |             if !method.is_kernel() {\n   23 |                 functions.insert(method.name);\n   24 |             }\n   25 |             Directive2::Method(run_method(functions, method)?)\n   26 |         }\n   27 |     })\n   28 | }","lines":24,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx/src/pass/resolve_function_pointers.rs#L5-L28"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`context::set_current` (which implements both `cuCtxSetCurrent` and, via `push_current`, `cuCtxPushCurrent`) always *pushes* a new `(CUcontext, hipDevice_t)` entry onto the per-thread `STACK` when `raw_ctx` is non-null, instead of replacing the top of the stack as the real CUDA driver does for `cuCtxSetCurrent`. Per NVIDIA's documented behavior, `cuCtxSetCurrent` replaces the top of the context stack; it does not grow it. Because ZLUDA routes `cuCtxSetCurrent` straight to `set_current` (same function used for `cuCtxPushCurrent`), every call to `cuCtxSetCurrent(ctx)` adds a new frame to the thread-local `STACK` (a `Vec<(CUcontext, hipDevice_t)>`). A caller that legitimately calls `cuCtxSetCurrent` repeatedly (a very common pattern for binding the current context before an operation) causes `STACK` to grow without bound - an unbounded per-thread memory leak - and desynchronizes `cuCtxPopCurrent`/`cuCtxGetCurrent` from actual CUDA semantics: a later `cuCtxPopCurrent` reveals a stale context that a real CUDA driver would never have retained, since `SetCurrent` should have simply overwritten it.","fix":"Split `set_current` into two distinct behaviors: keep the current push semantics for `push_current`/`cuCtxPushCurrent`, and give `cuCtxSetCurrent` its own implementation that replaces the top-of-stack entry (`stack.last_mut()` update, or pop-then-push a single frame) instead of unconditionally calling `stack.push(...)`, matching the documented `cuCtxSetCurrent` contract of replacing rather than stacking the current context.","locations":[{"ref":"zluda/src/impl/context.rs:180-211","code":"  180 | pub(crate) fn set_current(raw_ctx: CUcontext) -> CUresult {\n  181 |     let new_device = if raw_ctx.0 == ptr::null_mut() {\n  182 |         STACK.with(|stack| {\n  183 |             let mut stack = stack.borrow_mut();\n  184 |             if let Some((_, old_device)) = stack.pop() {\n  185 |                 if let Some((_, new_device)) = stack.last() {\n  186 |                     if old_device != *new_device {\n  187 |                         return Some(*new_device);\n  188 |                     }\n  189 |                 }\n  190 |             }\n  191 |             None\n  192 |         })\n  193 |     } else {\n  194 |         let ctx: &Context = FromCuda::<_, CUerror>::from_cuda(&raw_ctx)?;\n  195 |         let device = ctx.device;\n  196 |         STACK.with(move |stack| {\n  197 |             let mut stack = stack.borrow_mut();\n  198 |             let last_device = stack.last().map(|(_, dev)| *dev);\n  199 |             stack.push((raw_ctx, device));\n  200 |             match last_device {\n  201 |                 None => Some(device),\n  202 |                 Some(last_device) if last_device != device => Some(device),\n  203 |                 _ => None,\n  204 |             }\n  205 |         })\n  206 |     };\n  207 |     if let Some(dev) = new_device {\n  208 |         unsafe { hipSetDevice(dev)? };\n  209 |     }\n  210 |     Ok(())\n  211 | }","lines":32,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda/src/impl/context.rs#L180-L211"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`impl std::fmt::Display for LinkingDirective` in `ptx_parser/src/ast.rs` uses an `if ... else if ... else if ...` chain to decide which linking keyword to print (`.extern`, `.visible`, `.weak`), even though `LinkingDirective` is a `bitflags` type and the parser (`linking_directive` in `ptx_parser/src/lib.rs`, which folds tokens with `x | y`) can legitimately produce values with more than one bit set, e.g. `.weak .visible .func foo(...)` yields `LinkingDirective::WEAK | LinkingDirective::VISIBLE`. Because the branches are `else if`, only the first matching flag (`EXTERN`, then `VISIBLE`, then `WEAK`) is ever pushed into `directives`, so a value with both `VISIBLE` and `WEAK` set prints only `.visible` and silently drops `.weak`. This function is exercised by `ptx/src/pass/test/mod.rs` (`format!(\"{} \", function.linkage)`), so any dumped/round-tripped PTX for a weak-and-visible function loses the `.weak` modifier.","fix":"Replace the `else if` chain with independent `if` checks so every set flag is emitted, e.g.:\n```rust\nif self.contains(LinkingDirective::EXTERN) {\n    directives.push(\".extern\");\n}\nif self.contains(LinkingDirective::VISIBLE) {\n    directives.push(\".visible\");\n}\nif self.contains(LinkingDirective::WEAK) {\n    directives.push(\".weak\");\n}\n```","locations":[{"ref":"ptx_parser/src/ast.rs:1971-1983","code":" 1971 | impl std::fmt::Display for LinkingDirective {\n 1972 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n 1973 |         let mut directives = vec![];\n 1974 |         if self.contains(LinkingDirective::EXTERN) {\n 1975 |             directives.push(\".extern\");\n 1976 |         } else if self.contains(LinkingDirective::VISIBLE) {\n 1977 |             directives.push(\".visible\");\n 1978 |         } else if self.contains(LinkingDirective::WEAK) {\n 1979 |             directives.push(\".weak\");\n 1980 |         }\n 1981 |         write!(f, \"{}\", directives.join(\" \"))\n 1982 |     }\n 1983 | }","lines":13,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx_parser/src/ast.rs#L1971-L1983"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`ContextState::reset` is invoked from inside `Context::with_state_mut`'s closure, i.e. while the `Context`'s `state: Mutex<ContextState>` is already locked by the current thread. Inside `reset`, for every stored context-local-storage entry it directly invokes the user-supplied destructor callback `_cb(data.handle, ...)` (registered via the dark-API `context_local_storage_put`) while still holding that same lock. Because `std::sync::Mutex` is not reentrant, if the callback calls back into the CUDA driver on the same context - for example via `cuCtxSetFlags`, `cuCtxGetContextLocalStorage`/`cuCtxSetContextLocalStorage` (`context_local_storage_get`/`_put`/`_delete` in `driver.rs`), or `cuDevicePrimaryCtxGetState` on the same primary context - the thread deadlocks trying to re-lock `self.state`. The code even has a `TODO` acknowledging this exact risk but does not prevent it.","fix":"Collect the `(handle, key, value, reset_cb)` tuples into a temporary `Vec` first, drop the `state` lock (return from the locked closure with the pending callbacks), and invoke the callbacks afterwards, outside of `with_state_mut`, so a callback that re-enters the driver on the same context cannot deadlock on `self.state`.","locations":[{"ref":"zluda/src/impl/context.rs:41-61","code":"   41 |     pub(crate) fn reset(&mut self) -> CUresult {\n   42 |         for (key, data) in self.storage.iter_mut() {\n   43 |             if let Some(_cb) = data.reset_cb {\n   44 |                 // TODO: check that these callbacks do not call into the CUDA driver\n   45 |                 // since this could result in a recursive mutex lock.\n   46 |                 _cb(data.handle, *key as *mut c_void, data.value as *mut c_void);\n   47 |             }\n   48 |         }\n   49 |         self.ref_count = 0;\n   50 |         self.flags = 0;\n   51 |         // drop all modules and return first error if any\n   52 |         let result = self.modules.drain().fold(Ok(()), |res: CUresult, hmod| {\n   53 |             match (res, zluda_common::drop_checked::<module::Module>(hmod)) {\n   54 |                 (Err(e), _) => Err(e),\n   55 |                 (_, Err(e)) => Err(e),\n   56 |                 _ => Ok(()),\n   57 |             }\n   58 |         });\n   59 |         self.storage.clear();\n   60 |         result\n   61 |     }","lines":21,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda/src/impl/context.rs#L41-L61"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`FUNC(nanosleep_u32)` (the device-side implementation of PTX `nanosleep.u32`) computes `uint64_t cycles_per_ns = ATTR(CLOCK_RATE) / 1000000;` before multiplying by `nanoseconds`. Since `ATTR(CLOCK_RATE)` is the GPU clock rate in kHz, any device clocked below 1 GHz (`CLOCK_RATE < 1000000`) makes `cycles_per_ns` truncate to `0`, so `cycles = nanoseconds * cycles_per_ns` is always `0` regardless of the requested sleep duration, and `nanosleep.u32` becomes a near no-op (only the fixed `+= 63` / `>> 6` rounding contributes a fixed few cycles) instead of sleeping for the requested time. Even for clock rates above 1 GHz that aren't exact multiples of 1000000 kHz, dividing before multiplying systematically under-counts cycles versus computing `nanoseconds * ATTR(CLOCK_RATE) / 1000000`.","fix":"Compute cycles with the multiplication before the division to preserve precision, e.g. `uint64_t cycles = (uint64_t)nanoseconds * ATTR(CLOCK_RATE) / 1000000;`, avoiding the intermediate truncated `cycles_per_ns`.","locations":[{"ref":"ptx/lib/zluda_ptx_impl.cpp:314-335","code":"  314 |     void FUNC(nanosleep_u32)(uint32_t nanoseconds)\n  315 |     {\n  316 |         // clock_rate is in kHz\n  317 |         uint64_t cycles_per_ns = ATTR(CLOCK_RATE) / 1000000;\n  318 |         uint64_t cycles = nanoseconds * cycles_per_ns;\n  319 |         // Avoid small sleep values resulting in s_sleep 0\n  320 |         cycles += 63;\n  321 |         // s_sleep N sleeps for 64 * N cycles\n  322 |         uint64_t sleep_amount = cycles / 64;\n  323 | \n  324 |         // The argument to s_sleep must be a constant\n  325 |         for (size_t i = 0; i < sleep_amount >> 4; i++)\n  326 |             __builtin_amdgcn_s_sleep(16);\n  327 |         if (sleep_amount & 8U)\n  328 |             __builtin_amdgcn_s_sleep(8);\n  329 |         if (sleep_amount & 4U)\n  330 |             __builtin_amdgcn_s_sleep(4);\n  331 |         if (sleep_amount & 2U)\n  332 |             __builtin_amdgcn_s_sleep(2);\n  333 |         if (sleep_amount & 1U)\n  334 |             __builtin_amdgcn_s_sleep(1);\n  335 |     }","lines":22,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/ptx/lib/zluda_ptx_impl.cpp#L314-L335"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ref_set_address_v2` in `zluda/src/impl/tex.rs` takes an output parameter `byte_offset: *mut usize` that callers rely on being written (matching CUDA's `cuTexRefSetAddress`, which always writes `*ByteOffset`). When `dev_ptr` is null, the function takes an early-return shortcut calling `hipUnbindTexture(texref)` instead of `hipTexRefSetAddress`, and never writes to `*byte_offset`. Any caller that passes an uninitialized `usize` for `byte_offset` (as is typical, since the driver is expected to fill it in) and then uses the returned offset for subsequent address computation will silently use a stale/uninitialized value instead of the `0` (or otherwise correct) offset a real driver would report for this case.","fix":"In the `dev_ptr.0.is_null()` branch, write `*byte_offset = 0` (or the appropriate value) before calling `hipUnbindTexture(texref)`, so the out parameter is always initialized the same way it is on the normal `hipTexRefSetAddress` path.","locations":[{"ref":"zluda/src/impl/tex.rs:98-108","code":"   98 | pub(crate) unsafe fn ref_set_address_v2(\n   99 |     byte_offset: *mut usize,\n  100 |     texref: *mut textureReference,\n  101 |     dev_ptr: hipDeviceptr_t,\n  102 |     bytes: usize,\n  103 | ) -> hipError_t {\n  104 |     if dev_ptr.0.is_null() {\n  105 |         return hipUnbindTexture(texref);\n  106 |     }\n  107 |     hipTexRefSetAddress(byte_offset, texref, dev_ptr, bytes)\n  108 | }","lines":11,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda/src/impl/tex.rs#L98-L108"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In `occupancy_max_active_blocks_per_multiprocessor_with_flags`, after calling `hipModuleOccupancyMaxActiveBlocksPerMultiprocessorWithFlags` to compute `num_blocks` (the number of resident *blocks* per multiprocessor), the code clamps it with `*num_blocks = (*num_blocks).max(1).min(max_block_size);` where `max_block_size` was obtained from `hipFuncGetAttribute(..., HIP_FUNC_ATTRIBUTE_MAX_THREADS_PER_BLOCK, ...)`, i.e. the maximum *threads per block*. This mixes two unrelated units: clamping a block count against a thread-per-block limit is meaningless and appears copy-pasted from the neighboring `occupancy_max_potential_block_size` function (lines 671-694), where clamping `block_size` (a thread count) against `max_block_size` is correct. Additionally, the `.max(1)` forces the reported occupancy to be at least 1 block even when HIP legitimately determines that 0 blocks can be resident (e.g. the kernel's shared memory or register usage is too large for the given `block_size`), silently misreporting an infeasible launch configuration as feasible to any caller of `cuOccupancyMaxActiveBlocksPerMultiprocessorWithFlags` doing occupancy-based tuning.","fix":"Remove the incorrect `.max(1).min(max_block_size)` clamp on `num_blocks` (or replace it with a real bound, if any, expressed in blocks-per-multiprocessor, not threads-per-block). Return the value from `hipModuleOccupancyMaxActiveBlocksPerMultiprocessorWithFlags` as-is, including the legitimate `0` case.","locations":[{"ref":"zluda/src/impl/driver.rs:647-669","code":"  647 | pub(crate) unsafe fn occupancy_max_active_blocks_per_multiprocessor_with_flags(\n  648 |     num_blocks: &mut ::core::ffi::c_int,\n  649 |     func: &function::Function,\n  650 |     block_size: ::core::ffi::c_int,\n  651 |     dynamic_smem_size: usize,\n  652 |     flags: ::core::ffi::c_uint,\n  653 | ) -> hipError_t {\n  654 |     hipModuleOccupancyMaxActiveBlocksPerMultiprocessorWithFlags(\n  655 |         num_blocks,\n  656 |         func.base,\n  657 |         block_size,\n  658 |         dynamic_smem_size,\n  659 |         flags,\n  660 |     )?;\n  661 |     let mut max_block_size = 0;\n  662 |     hipFuncGetAttribute(\n  663 |         &mut max_block_size,\n  664 |         hipFunction_attribute::HIP_FUNC_ATTRIBUTE_MAX_THREADS_PER_BLOCK,\n  665 |         func.base,\n  666 |     )?;\n  667 |     *num_blocks = (*num_blocks).max(1).min(max_block_size);\n  668 |     Ok(())\n  669 | }","lines":23,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda/src/impl/driver.rs#L647-L669"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In `apply_detours` (`zluda_redirect/src/lib.rs`), the block that calls `DetourAttach(std::ptr::from_mut(&mut get_cubin_size).cast(), get_ptx_size as _)` (lines 421-427) is immediately followed by an identical, duplicated block doing the exact same `DetourAttach` call again (lines 428-434). This is clearly a copy-paste error: the intent was almost certainly to attach a third pair (likely `get_cubin`/`get_ptx` was meant to be attached once and something else a second time, or the duplicate should have been removed). Calling `DetourAttach` twice on the same trampoline pointer without an intervening `DetourDetach` fails in Microsoft Detours (returns a non-`NO_ERROR` code), so the second, duplicated call causes `apply_detours` to return `false`. In `detour_nvrtc`, `apply_detours` returning `false` triggers `DetourTransactionAbort()`, which rolls back *all* detours attached so far in the transaction - including the legitimate `get_cubin` -> `get_ptx` attach done earlier at line 418. The net effect is that `nvrtcGetCUBIN`/`nvrtcGetCUBINSize`/`nvrtcCompileProgram` redirection silently never actually applies for any loaded `nvrtc*.dll`, breaking the core mechanism this file exists for (making apps that call `nvrtcGetCUBIN` receive PTX data instead), with no user-visible error.","fix":"Remove the duplicated `DetourAttach` block at lines 428-434, or replace it with the actually-intended additional attach (e.g. attaching `get_ptx`/`get_ptx_size` themselves, or another entry point) if a third redirection was meant to be installed there.","locations":[{"ref":"zluda_redirect/src/lib.rs:421-434","code":"  421 |     if DetourAttach(\n  422 |         std::ptr::from_mut(&mut get_cubin_size).cast(),\n  423 |         get_ptx_size as _,\n  424 |     ) != NO_ERROR as i32\n  425 |     {\n  426 |         return false;\n  427 |     }\n  428 |     if DetourAttach(\n  429 |         std::ptr::from_mut(&mut get_cubin_size).cast(),\n  430 |         get_ptx_size as _,\n  431 |     ) != NO_ERROR as i32\n  432 |     {\n  433 |         return false;\n  434 |     }","lines":14,"link":"https://github.com/vosen/ZLUDA/blob/af8a3b185660460a6ea1f4c7925bdafd30dcefcd/zluda_redirect/src/lib.rs#L421-L434"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"hard","description":"`take_till_end_of_statement` in `ptx_parser/src/lib.rs` is the statement-level error-recovery scanner used by `statement`'s `with_recovery` to find the end of a malformed/unrecognized statement. It tracks brace `depth` correctly for `Token::LBrace`/`Token::RBrace` (only erroring on an `RBrace` when `depth == 0`), but the `Token::Semicolon | Token::Colon` arm terminates the scan unconditionally, ignoring the current `depth`. So if a malformed statement contains a `{ ... }` group with a semicolon inside it (e.g. a stray/garbled `unknown_op { a; b };`), recovery stops at the *inner* semicolon instead of the statement-ending one, leaving the rest (including the now-unmatched closing `}`) in the token stream. This was confirmed empirically with the input `unknown_op { a; b };` inside a function body: `parse_module_checked` returns two errors, `UnrecognizedStatement(\"unknown_op { a;\")` (truncated at the inner semicolon, as predicted) and a second, uninformative `Parser(ContextError { context: [], cause: None })`, i.e. the leftover unmatched `}` breaks the surrounding grammar and produces an opaque top-level parse failure in addition to the mis-scoped recovery message, even though only one statement in the source was malformed.","fix":"Guard the `Token::Semicolon | Token::Colon` arm with the same `depth == 0` check used for `Token::RBrace`, e.g. only treat a semicolon/colon as the end of the malformed statement when `depth == 0`; otherwise fall through to the default `_ => {}` arm so the scan continues past semicolons/colons that are nested inside an unbalanced `{ ... }` group.","locations":[{"ref":"ptx_parser/src/lib.rs:882-919","code":"  882 | fn take_till_end_of_statement<\n  883 |     'a,\n  884 |     I: Stream<Token = (Token<'a>, std::ops::Range<usize>)>,\n  885 |     E: ParserError<I>,\n  886 | >() -> imp
