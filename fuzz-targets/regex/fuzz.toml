# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "regex"
features = ["logging", "perf", "perf-backtrack", "perf-cache", "perf-dfa", "perf-dfa-full", "perf-inline", "perf-literal", "perf-onepass", "std", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment", "use_std"]
disabled_features = [{ name = "pattern", reason = "auto: fails to build alone: error[E0554]: `#![feature]` may not be used on the stable release channel" }, { name = "unstable", reason = "auto: fails to build alone: error[E0554]: `#![feature]` may not be used on the stable release channel" }]
extra_crates = ["regex-lite", "regex-syntax", "regex-automata"]
git = "https://github.com/rust-lang/regex"
rev = "72d650cb0a880a01ab6dc2137c0888e8f89740f7"

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

