# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "comfy-table"
features = ["_debug", "_integration_test", "custom_styling", "reexport_crossterm", "tty"]
git = "https://github.com/nukesor/comfy-table"
rev = "b947cb6bf4a9aef846e4ec00a67f68bd85d41c73"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[crash]]
id = "comfy-table/src/utils/arrangement/helper.rs:51:9"
kind = "panic"
location = "comfy-table/src/utils/arrangement/helper.rs:51:9"
message = "attempt to add with overflow"
top_api_fn = "comfy_table::utils::arrangement::helper::count_border_columns"
reproducer = "crashes/comfy_table_src_utils_arrangement_helper_rs_51_9_43574e/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 4
stmts = 1
