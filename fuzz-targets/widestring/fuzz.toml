# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "widestring"
features = ["alloc", "std"]
disabled_features = [{ name = "debugger_visualizer", reason = "auto: fails to build alone: error[E0554]: `#![feature]` may not be used on the stable release channel" }]
git = "https://github.com/VoidStarKat/widestring-rs"
rev = "5c65b30447e5cf4beb824eb2d6464b63110bce76"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

