[target]
crate = "png"
features = ["benchmarks", "zlib-rs"]
disabled_features = [{ name = "unstable", reason = "auto: fails to build alone: error[E0554]: `#![feature]` may not be used on the stable release channel" }]
git = "https://github.com/image-rs/image-png"
rev = "b2f10c6a7e3127d4aaf231f3eae731a33e6eb0bc"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

