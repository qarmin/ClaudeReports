# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "jxl"
git = "https://github.com/libjxl/jxl-rs"
rev = "7f539c803ddd9c5d2eb654de0814d8595e2225b2"
features = ["all-simd", "avx", "avx512", "brotli", "neon", "shuttle", "simd128", "sse42", "tracing"]

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048
drop_documented = true

[[exclude]]
fn = "jxl_simd::Avx512Descriptor::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "jxl_simd::AvxDescriptor::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "jxl_simd::Sse42Descriptor::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "jxl::api::JxlOutputBuffer::new_from_ptr"
reason = "TODO (auto: unsafe fn)"

[[panics_doc]]
fn = "jxl::api::JxlColorProfile::as_icc"
reason = "TODO (auto: documents a `# Panics` section)"

[[exclude]]
fn = "jxl::image::*"
reason = "internal helpers exposed as pub"

[[ignore_crash]]
location = "jxl/src/image/*"
reason = "internal helpers exposed as pub"

[[ignore_crash]]
location = "jxl/src/headers/*"
reason = "internal helpers exposed as pub"

[[ignore_crash]]
location = "jxl/src/api/data_types.rs:*"
reason = "huge sizes passed straight to the API"

[[ignore_crash]]
location = "shuttle-engine/*"
reason = "test-only runtime"

[[ignore_crash]]
message = "*JxlPixelFormat::*"
reason = "huge sizes passed straight to the API"

[[crash]]
id = "out of memory in jxl::api::JxlDecoder::set_pixel_format"
kind = "out of memory"
location = ""
message = "process ended abnormally (out of memory) while calling jxl::api::JxlDecoder::set_pixel_format"
top_api_fn = "jxl::api::JxlDecoder::set_pixel_format"
reproducer = "crashes/out_of_memory_in_jxl_api_jxldecoder_set_pixel_format_450c70/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 1398
stmts = 2

