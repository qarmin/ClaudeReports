# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "bytemuck"
features = ["aarch64_simd", "align_offset", "alloc_uninit", "avx512_simd", "bytemuck_derive", "const_zeroed", "derive", "extern_crate_alloc", "extern_crate_std", "impl_core_error", "latest_stable_rust", "min_const_generics", "must_cast", "must_cast_extra", "nightly_stdsimd", "pod_saturating", "rustversion", "track_caller", "transparentwrapper_extra", "unsound_ptr_pod_impl", "wasm_simd", "zeroable_atomics", "zeroable_maybe_uninit", "zeroable_unwind_fn"]
disabled_features = [{ name = "nightly_docs", reason = "auto: fails to build alone: error[E0554]: `#![feature]` may not be used on the stable release channel" }, { name = "nightly_float", reason = "auto: fails to build alone: error[E0554]: `#![feature]` may not be used on the stable release channel" }, { name = "nightly_portable_simd", reason = "auto: fails to build alone: error[E0425]: cannot find type `LaneCount` in module `core::simd`" }]
git = "https://github.com/Lokathor/bytemuck"
rev = "ea3616110b0134e9991fdb66be8892dbc427c5ac"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

