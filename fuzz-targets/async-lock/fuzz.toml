# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "async-lock"
features = ["loom", "std"]
git = "https://github.com/smol-rs/async-lock"
rev = "23e181d5cfb91a59382e5719c682caa58ff43ace"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[crash]]
id = "timeout in async_lock::Barrier::wait_blocking"
kind = "timeout"
location = ""
message = "process ended abnormally (timeout) while calling async_lock::Barrier::wait_blocking"
top_api_fn = "async_lock::Barrier::wait_blocking"
reproducer = "crashes/timeout_in_async_lock_barrier_wait_blocking_4d5407/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 130
stmts = 4

[[exclude]]
fn = "async_lock::OnceCell<u8>::get_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "async_lock::OnceCell<u32>::get_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "async_lock::OnceCell<String>::get_unchecked"
reason = "TODO (auto: unsafe fn)"
