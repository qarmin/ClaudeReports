# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "wgpu"
features = ["angle", "counters", "custom", "drm", "dx12", "exhaust", "fragile-send-sync-non-atomic-wasm", "gles", "glsl", "metal", "naga-ir", "noop", "serde", "spirv", "static-dxc", "std", "strict_asserts", "trace", "vulkan", "vulkan-portability", "web", "webgl", "webgpu", "wgpu-core", "wgsl"]
extra_crates = ["naga", "wgpu-hal", "wgpu-core", "naga-types", "wgpu-types"]
git = "https://github.com/gfx-rs/wgpu"
rev = "efcf445784dd31537f09bc61bad27431de713fce"

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

