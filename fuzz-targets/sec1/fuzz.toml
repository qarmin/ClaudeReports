# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "sec1"
features = ["alloc", "ctutils", "der", "pem", "point", "serde", "std", "subtle", "zeroize"]
git = "https://github.com/RustCrypto/formats"
rev = "13a0390d40297121e272044ee73d796e1bfb72ee"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[crash]]
id = "sec1/src/point.rs:556:9"
kind = "panic"
location = "sec1/src/point.rs:556:9"
message = "attempt to add with overflow"
top_api_fn = "sec1::point::Tag::message_len"
reproducer = "crashes/sec1_src_point_rs_556_9_7f1ae6/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 4
stmts = 2

