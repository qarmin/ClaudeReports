# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "symphonia"
git = "https://github.com/pdeljanov/Symphonia"
rev = "ee35874b571a35a9a6e15d3bc9a3aaf8f11fbeee"
features = ["aac", "adpcm", "aiff", "alac", "all", "all-codecs", "all-formats", "all-meta", "ape", "caf", "exp-subtitle-codecs", "exp-video-codecs", "flac", "id3v1", "id3v2", "isomp4", "mkv", "mp1", "mp2", "mp3", "mpa", "ogg", "opt-simd", "opt-simd-avx", "opt-simd-neon", "opt-simd-sse", "pcm", "vorbis", "wav"]
extra_crates = ["symphonia-bundle-flac", "symphonia-codec-adpcm", "symphonia-codec-pcm", "symphonia-codec-vorbis", "symphonia-common", "symphonia-core", "symphonia-format-mkv", "symphonia-format-ogg", "symphonia-format-riff", "symphonia-metadata"]
internal_crates = ["symphonia-core", "symphonia-common"]

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048
drop_documented = true

