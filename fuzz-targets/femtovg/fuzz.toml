# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "femtovg"
features = ["debug_inspector", "image", "image-loading", "serde", "swash", "textlayout", "wgpu"]
disabled_features = [{ name = "glutin", reason = "auto: fails to build alone: error: Please select at least one api backend" }]
git = "https://github.com/femtovg/femtovg"
rev = "9f5ad2614e922677a467e2d6f66fecba14d3a30a"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[exclude]]
fn = "femtovg::renderer::OpenGl::new_from_function"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "femtovg::renderer::OpenGl::new_from_function_cstr"
reason = "TODO (auto: unsafe fn)"

