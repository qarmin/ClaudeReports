# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "moxcms"
features = ["any_to_any", "avx", "avx512", "avx512_shaper_fixed_point_paths", "avx512_shaper_optimized_paths", "avx_luts", "avx_shaper_fixed_point_paths", "avx_shaper_optimized_paths", "avx_shaper_paths", "extended_range", "in_place", "lut", "neon", "neon_luts", "neon_shaper_fixed_point_paths", "neon_shaper_optimized_paths", "neon_shaper_paths", "options", "sse", "sse_luts", "sse_shaper_fixed_point_paths", "sse_shaper_optimized_paths", "sse_shaper_paths", "sve"]
git = "https://github.com/awxkee/moxcms"
rev = "a61db8babddcb47f8cb46314f2c6577756d7496f"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

