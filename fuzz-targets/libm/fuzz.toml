# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "libm"
features = ["arch", "force-soft-floats", "unstable-float", "unstable-public-internals"]
git = "https://github.com/rust-lang/compiler-builtins"
rev = "f521807de24520770991263387ba8c06e462edf8"
extra_crates = []
disabled_features = [{ name = "unstable", reason = "auto: fails to build alone: error[E0554]: `#![feature]` may not be used on the stable release channel" }, { name = "unstable-intrinsics", reason = "auto: fails to build alone: error[E0554]: `#![feature]` may not be used on the stable release channel" }]

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[exclude]]
fn = "libm::support::u256::unchecked_narrowing_div_rem"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "libm::support::unchecked_div_i32"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "libm::support::unchecked_div_isize"
reason = "TODO (auto: unsafe fn)"

