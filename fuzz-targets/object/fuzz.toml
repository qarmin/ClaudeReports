# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "object"
features = ["all", "alloc", "archive", "build", "build_core", "coff", "compression", "core", "doc", "elf", "macho", "names", "pe", "read", "read_core", "rustc-dep-of-std", "std", "unaligned", "unstable", "unstable-all", "wasm", "write", "write_core", "write_std", "xcoff"]
disabled_features = [{ name = "cargo-all", reason = "auto: fails to build alone: error: '--all-features' is not supported; use '--features all' instead" }, { name = "goff", reason = "auto: fails to build alone: error: 'goff' is an unstable feature; enable 'unstable' as well" }]
git = "https://github.com/gimli-rs/object"
rev = "4ef27e429dd86949ac3d3a995b3266440bedcf5c"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

