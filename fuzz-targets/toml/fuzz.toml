[target]
crate = "toml"
version = "1.1.8+spec-1.1.0"
features = ["debug", "display", "fast_hash", "parse", "preserve_order", "serde", "std", "unbounded"]
extra_crates = ["toml_edit@0.25.17+spec-1.1.0", "toml_write@0.1.2", "toml_parser@1.1.5+spec-1.1.0", "toml_writer@1.1.3+spec-1.1.0", "serde_spanned@1.1.2", "toml_datetime@1.1.2+spec-1.1.0"]

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

