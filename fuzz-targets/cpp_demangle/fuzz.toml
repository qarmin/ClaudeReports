# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "cpp_demangle"
features = ["afl", "alloc", "fuzz", "logging", "run_libiberty_tests", "std"]
git = "https://github.com/gimli-rs/cpp_demangle"
rev = "076632f924b1c87c7de8ef6a5c604edb97964978"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[crash]]
id = "cpp_demangle/src/lib.rs:75:60"
kind = "panic"
location = "cpp_demangle/src/lib.rs:75:60"
message = "Recursion limit must be > 0"
top_api_fn = "cpp_demangle::ParseOptions::recursion_limit"
reproducer = "crashes/cpp_demangle_src_lib_rs_75_60_624dde/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 4
stmts = 1

[[crash]]
id = "cpp_demangle/src/lib.rs:122:60"
kind = "panic"
location = "cpp_demangle/src/lib.rs:122:60"
message = "Recursion limit must be > 0"
top_api_fn = "cpp_demangle::DemangleOptions::recursion_limit"
reproducer = "crashes/cpp_demangle_src_lib_rs_122_60_969e55/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 4
stmts = 2
# drop_documented = true    # skip panics documented in a `# Panics` section instead of recording them

# [[exclude]]           never call matching functions (glob on the full name shown in `just report`)
# fn = "krilla::surface::Surface::push_*"
# reason = "..."

# [[constrain]]         skip calls whose argument fails the check (`x` is a reference to the value)
# fn = "krilla::page::PageSettings::new"
# arg = "width"
# check = "x.is_finite() && *x > 0.0"
# reason = "..."

# [[protocol]]          call-order rules; offending calls are skipped instead of executed
# kind = "balanced"     # balanced | requires_before | at_most | terminal | custom
# scope = "krilla::surface::Surface"
# open = ["push_*"]
# close = ["pop"]
# on_scope_end = "auto_close"   # auto_close | allow
# reason = "..."

# [[provider]]          hand-written constructor for a type the generator cannot build
# type = "krilla::color::rgb::Color"
# params = ["r: u8", "g: u8", "b: u8"]
# code = "krilla::color::rgb::Color::new(r, g, b)"
# reason = "..."
