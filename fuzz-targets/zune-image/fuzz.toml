# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "zune-image"
git = "https://github.com/etemesi254/zune-image"
rev = "b39e0123084027389e565328c0fea8d0f721985e"
default_features = false
features = ["bmp", "farbfeld", "hdr", "heic", "jpeg", "jpeg-xl", "jpeg_2000", "png", "ppm", "psd", "qoi", "webp", "metadata", "serde-support", "threads", "simd", "log"]
extra_crates = ["zune-bmp", "zune-core", "zune-farbfeld", "zune-hdr", "zune-heic", "zune-inflate", "zune-isobmff", "zune-jpeg", "zune-jpegxl", "zune-png", "zune-ppm", "zune-psd", "zune-qoi"]
internal_crates = ["zune-core", "zune-isobmff"]

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048
drop_documented = true

