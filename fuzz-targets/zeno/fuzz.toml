# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "zeno"
features = ["eval", "libm", "std"]
git = "https://github.com/dfrg/zeno"
rev = "698399439f8035736d01de00cbcdc413b3976a18"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[crash]]
id = "zeno/src/mask.rs:34:9"
kind = "panic"
location = "zeno/src/mask.rs:34:9"
message = "attempt to multiply with overflow"
top_api_fn = "zeno::Format::buffer_size"
reproducer = "crashes/zeno_src_mask_rs_34_9_16e438/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 4
stmts = 2

