message = "index out of bounds: the len is 0 but the index is 0"
top_api_fn = "chacha20::variants::Legacy::set_block_pos"
reproducer = "crashes/chacha20_src_variants_rs_75_9_63122c/src/main.rs"
status = "new"
documented = false
repro_verified = true
