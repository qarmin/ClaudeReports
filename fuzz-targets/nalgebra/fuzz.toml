[target]
crate = "nalgebra"
features = ["alga", "alloc", "arbitrary", "bytemuck", "compare", "convert-bytemuck", "convert-glam030", "convert-glam031", "convert-glam032", "convert-glam033", "convert-mint", "debug", "defmt", "encase", "glam030", "glam031", "glam032", "glam033", "io", "libm", "libm-force", "macros", "matrixcompare-core", "matrixmultiply", "mint", "nalgebra-macros", "pest", "pest_derive", "proptest", "proptest-support", "quickcheck", "rand", "rand-no-std", "rand-package", "rand_distr", "rayon", "rkyv", "rkyv-safe-deser", "rkyv-serialize", "rkyv-serialize-no-std", "serde", "serde-serialize", "serde-serialize-no-std", "slow-tests", "sparse", "std"]
