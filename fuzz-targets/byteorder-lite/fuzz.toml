# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "byteorder-lite"
features = ["std"]
git = "https://github.com/image-rs/byteorder-lite"
rev = "7d44da06a48fe10d7e23efd9a932d18a7a2def63"
