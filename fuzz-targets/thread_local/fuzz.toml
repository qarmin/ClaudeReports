kind = "panic"
location = "thread_local-rs/src/lib.rs:185:35"
message = "range end index 64 out of range for slice of length 63"
top_api_fn = "thread_local::ThreadLocal<String>::with_capacity"
reproducer = "crashes/thread_local_rs_src_lib_rs_185_35_d517c9/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 4
stmts = 1
