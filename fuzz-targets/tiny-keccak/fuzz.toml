# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "tiny-keccak"
features = ["cshake", "fips202", "k12", "keccak", "kmac", "parallel_hash", "sha3", "shake", "sp800", "tuple_hash"]
git = "https://github.com/debris/tiny-keccak"
rev = "f0fa14629021cdffe1041eee7261843fb05bb373"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[crash]]
id = "tiny-keccak/src/parallel_hash.rs:108:32"
kind = "panic"
location = "tiny-keccak/src/parallel_hash.rs:108:32"
message = "attempt to divide by zero"
top_api_fn = "tiny_keccak::ParallelHash::update"
reproducer = "crashes/tiny_keccak_src_parallel_hash_rs_108_32_f06dc7/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 4
stmts = 2
