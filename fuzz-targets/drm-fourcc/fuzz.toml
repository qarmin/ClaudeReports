location = "drm-fourcc-rs/src/lib.rs:203:31"
message = "called `Option::unwrap()` on a `None` value"
top_api_fn = "drm_fourcc::UnrecognizedFourcc::string_form"
reproducer = "crashes/drm_fourcc_rs_src_lib_rs_203_31_1f7db6/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 4
stmts = 2

