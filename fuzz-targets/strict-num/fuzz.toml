# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "strict-num"
features = ["approx-eq", "float-cmp", "serde"]
git = "https://github.com/RazrFalcon/strict-num"
rev = "76d36febdb73e875ae3e0c6ae1310a084a7860c7"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[exclude]]
fn = "strict_num::FiniteF32::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "strict_num::FiniteF64::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "strict_num::NonZeroPositiveF32::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "strict_num::NonZeroPositiveF64::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "strict_num::NormalizedF32::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "strict_num::NormalizedF64::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
fn = "strict_num::PositiveF32::new_unchecked"
reason = "TODO (auto: unsafe fn)"

[[exclude]]
