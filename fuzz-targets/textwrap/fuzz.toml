# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "textwrap"
features = ["hyphenation", "icu_segmenter", "smawk", "std", "terminal_size", "unicode-linebreak", "unicode-linebreak-complex", "unicode-width"]
git = "https://github.com/mgeisler/textwrap"
rev = "07fdbbb92103a22c48a61be271dca36c739fdde3"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[panics_doc]]
fn = "textwrap::wrap_columns"
reason = "TODO (auto: documents a `# Panics` section)"

[[crash]]
id = "out of memory in textwrap::wrap_columns"
kind = "out of memory"
location = ""
message = "process ended abnormally (out of memory) while calling textwrap::wrap_columns"
top_api_fn = "textwrap::wrap_columns"
reproducer = "crashes/out_of_memory_in_textwrap_wrap_columns_625726/src/main.rs"
status = "new"
documented = false
