# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "tokio"
features = ["bytes", "fs", "full", "io-std", "io-util", "libc", "macros", "mio", "net", "parking_lot", "process", "rt", "rt-multi-thread", "signal", "signal-hook-registry", "socket2", "sync", "test-util", "time", "tokio-macros", "tracing", "windows-sys"]
disabled_features = [{ name = "io-uring", reason = "auto: fails to build alone: error: The `io-uring` feature requires `--cfg tokio_unstable`." }, { name = "schedule-latency", reason = "auto: fails to build alone: error: The `schedule-latency` feature requires `--cfg tokio_unstable`." }, { name = "taskdump", reason = "auto: fails to build alone: error: The `taskdump` feature requires `--cfg tokio_unstable`." }]
git = "https://github.com/tokio-rs/tokio"
rev = "cdd9dae3aa5056e23dc4d5bc4f852ab8fbf27aff"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

