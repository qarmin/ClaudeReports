# rfuzz target configuration.
# Entries marked "TODO (auto: ...)" were added automatically - review them and write a real reason.

[target]
crate = "sha1_smol"
features = ["alloc", "serde", "std"]
git = "https://github.com/mitsuhiko/sha1-smol"
rev = "f9d88bd70e9bd577c7c3afdc6acd0313af605324"
extra_crates = []

[fuzz]
boundary_percent = 50   # how often primitives come from the boundary-value table
timeout_secs = 3        # per program
memory_mb = 2048        # RLIMIT_AS of every fuzz process
sandbox = "auto"        # auto | docker | bwrap | none
determinism_every = 16  # run every N-th program twice and compare observable results (0 = off)
max_disk_mb = 2048

[[crash]]
id = "sha1-smol/src/lib.rs:568:46"
kind = "panic"
location = "sha1-smol/src/lib.rs:568:46"
message = '''end byte index 8 is not a char boundary; it is inside '\u{d4f98}' (bytes 5..9 of string)'''
top_api_fn = "sha1_smol::Digest::from_str"
reproducer = "crashes/sha1_smol_src_lib_rs_568_46_c1d992/src/main.rs"
status = "new"
documented = false
repro_verified = true
hits = 4
stmts = 1
