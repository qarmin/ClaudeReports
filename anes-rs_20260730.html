<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`advance_escape_state` does not recognise the string-introducer final bytes `0x50` (`P`, DCS), `0x58` (`X`, SOS), `0x5D` (`]`, OSC), `0x5E` (`^`, PM) and `0x5F` (`_`, APC). The final-character range on line 207 is `0x30..=0x4F | 0x51..=0x57 | 0x59 | 0x5A | 0x5C | 0x60..=0x7E`, which deliberately skips them, but the `_` arm on line 220 then just does `self.set_state(State::Ground)` — it does **not** enter a string-collecting state. Every byte of the string payload that follows is therefore parsed in `Ground` and emitted through `provide_char`. A perfectly normal terminal reply such as an OSC colour report `\\x1B]11;rgb:1c1c/1c1c/1c1c\\x1B\\\\` or a DCS `DECRQSS` reply is turned into a burst of bogus `Sequence::Key(KeyCode::Char(..))` events. Any application driving the terminal with `ReportCursorPosition`-style queries and OSC queries will see phantom keystrokes.","fix":"Add the missing states so the payload is consumed and discarded rather than printed. Add a variant to `State`:\n\n```rust\n/// DCS / OSC / SOS / PM / APC string payload; consumed and discarded.\nIgnoreString,\n```\n\nroute the introducers to it in both `advance_escape_state` and `advance_escape_intermediate_state`:\n\n```rust\n// DCS (P), SOS (X), OSC (]), PM (^), APC (_) -> consume the string, dispatch nothing\n0x50 | 0x58 | 0x5D | 0x5E | 0x5F => self.set_state(State::IgnoreString),\n```\n\nand terminate it on `BEL` / `ST`:\n\n```rust\nfn advance_ignore_string_state(&mut self, _provider: &mut dyn Provide, byte: u8) {\n    // 0x07 = BEL, 0x9C = ST; Esc-based ST is handled by handle_possible_esc.\n    if byte == 0x07 || byte == 0x9C {\n        self.set_state(State::Ground);\n    }\n}\n```\n\nFinally add `State::IgnoreString => self.advance_ignore_string_state(provider, byte)` to the dispatch `match` in `advance`.","locations":[{"ref":"anes/src/parser/engine.rs:193-222","code":"  193 |     fn advance_escape_state(&mut self, provider: &mut dyn Provide, byte: u8) {\n  194 |         match byte {\n  195 |             0x1B => unreachable!(),\n  196 | \n  197 |             // Intermediate bytes to collect\n  198 |             0x20..=0x2F => {\n  199 |                 self.set_state(State::EscapeIntermediate);\n  200 |             }\n  201 | \n  202 |             // Escape followed by '[' (0x5B)\n  203 |             //   -> CSI sequence start\n  204 |             0x5B => self.set_state(State::CsiEntry),\n  205 | \n  206 |             // Escape sequence final character\n  207 |             0x30..=0x4F | 0x51..=0x57 | 0x59 | 0x5A | 0x5C | 0x60..=0x7E => {\n  208 |                 provider.provide_esc_sequence(byte as char);\n  209 |                 self.set_state(State::Ground);\n  210 |             }\n  211 | \n  212 |             // Execute\n  213 |             0x00..=0x17 | 0x19 | 0x1C..=0x1F => provider.provide_char(byte as char),\n  214 | \n  215 |             // TODO Does it mean we should ignore the whole sequence?\n  216 |             // Ignore\n  217 |             0x7F => {}\n  218 | \n  219 |             // Other bytes are considered as invalid -> cancel whatever we have\n  220 |             _ => self.set_state(State::Ground),\n  221 |         };\n  222 |     }","lines":30,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L193-L222"},{"ref":"anes/src/parser/engine.rs:224-251","code":"  224 |     fn advance_escape_intermediate_state(&mut self, provider: &mut dyn Provide, byte: u8) {\n  225 |         match byte {\n  226 |             0x1B => unreachable!(),\n  227 | \n  228 |             // Intermediate bytes to collect\n  229 |             0x20..=0x2F => {}\n  230 | \n  231 |             // Escape followed by '[' (0x5B)\n  232 |             //   -> CSI sequence start\n  233 |             0x5B => self.set_state(State::CsiEntry),\n  234 | \n  235 |             // Escape sequence final character\n  236 |             0x30..=0x5A | 0x5C..=0x7E => {\n  237 |                 provider.provide_esc_sequence(byte as char);\n  238 |                 self.set_state(State::Ground);\n  239 |             }\n  240 | \n  241 |             // Execute\n  242 |             0x00..=0x17 | 0x19 | 0x1C..=0x1F => provider.provide_char(byte as char),\n  243 | \n  244 |             // TODO Does it mean we should ignore the whole sequence?\n  245 |             // Ignore\n  246 |             0x7F => {}\n  247 | \n  248 |             // Other bytes are considered as invalid -> cancel whatever we have\n  249 |             _ => self.set_state(State::Ground),\n  250 |         };\n  251 |     }","lines":28,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L224-L251"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`parse_csi_arrow_key_modifiers` reads the **wrong parameter** and then applies a nonsensical `saturating_sub(48)`. Real terminals encode a modified arrow key as `CSI 1 ; <mod> A` — the modifier is the **second** parameter and it is already a decoded integer (the engine converts ASCII digits to numbers in `advance_csi_entry_state`/`advance_csi_parameter_state`). The code instead takes `parameters.first()` (which is always the literal `1`) and subtracts `48` (the ASCII offset of `'0'`), so `1.saturating_sub(48) == 0` and `parse_key_modifiers(Some(0))` returns `KeyModifiers::empty()`. Consequence: **`Shift`/`Ctrl`/`Alt` + arrow keys are silently reported as unmodified arrow keys**. `parse_csi_tilde_key_code` on line 101 does it correctly with `parameters.get(1)`, which shows the intended contract. The existing test `csi_arrow_key_modifiers` in `anes/tests/parser/key.rs` feeds `b\"\\x1B[50A\"` / `b\"\\x1B[53A\"` — sequences no terminal ever emits — so it locks in the bug instead of catching it.","fix":"Read the second parameter and drop the `48` offset, matching `parse_csi_tilde_key_code`:\n\n```rust\nfn parse_csi_arrow_key_modifiers(parameters: &[u64]) -> KeyModifiers {\n    parse_key_modifiers(parameters.get(1).cloned())\n}\n```\n\nand update the four call sites to pass the whole slice:\n\n```rust\n'A' => Some(Sequence::Key(KeyCode::Up, parse_csi_arrow_key_modifiers(parameters))),\n```\n\nThen fix `anes/tests/parser/key.rs::csi_arrow_key_modifiers` to use the sequences terminals actually send: `b\"\\x1B[1;2A\"` → `KeyCode::Up` + `KeyModifiers::SHIFT`, `b\"\\x1B[1;5A\"` → `KeyCode::Up` + `KeyModifiers::CONTROL`.","locations":[{"ref":"anes/src/parser/parsers.rs:65-67","code":"   65 | fn parse_csi_arrow_key_modifiers(parameter: Option<u64>) -> KeyModifiers {\n   66 |     parse_key_modifiers(parameter.map(|x| x.saturating_sub(48)))\n   67 | }","lines":3,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L65-L67"},{"ref":"anes/src/parser/parsers.rs:37-52","code":"   37 |         'A' => Some(Sequence::Key(\n   38 |             KeyCode::Up,\n   39 |             parse_csi_arrow_key_modifiers(parameters.first().cloned()),\n   40 |         )),\n   41 |         'B' => Some(Sequence::Key(\n   42 |             KeyCode::Down,\n   43 |             parse_csi_arrow_key_modifiers(parameters.first().cloned()),\n   44 |         )),\n   45 |         'C' => Some(Sequence::Key(\n   46 |             KeyCode::Right,\n   47 |             parse_csi_arrow_key_modifiers(parameters.first().cloned()),\n   48 |         )),\n   49 |         'D' => Some(Sequence::Key(\n   50 |             KeyCode::Left,\n   51 |             parse_csi_arrow_key_modifiers(parameters.first().cloned()),\n   52 |         )),","lines":16,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L37-L52"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When a UTF-8 multi-byte sequence is truncated, `advance_utf8_state` discards the offending byte along with the partial sequence. On seeing a byte that is not a continuation byte it calls `self.set_state(State::Ground)` and `return`s **without re-processing that byte in the ground state**. So for input `b\"\\xC3a\"` the parser drops both the broken lead byte and the perfectly valid `a`, and the application loses a keystroke. The correct recovery for a truncated UTF-8 sequence is to abandon the sequence and re-dispatch the current byte.","fix":"Re-feed the byte to the ground state instead of dropping it:\n\n```rust\nfn advance_utf8_state(&mut self, provider: &mut dyn Provide, byte: u8) {\n    if byte & 0b1100_0000 != 0b1000_0000 {\n        // Truncated sequence: abandon it, but the current byte is still valid input.\n        self.set_state(State::Ground);\n        self.advance_ground_state(provider, byte);\n        return;\n    }\n    ...\n```\n\n`set_state(State::Ground)` clears `utf8_points_count`/`utf8_points_expected_count` first, so the recursive call cannot re-enter `State::Utf8` with stale state.","locations":[{"ref":"anes/src/parser/engine.rs:394-398","code":"  394 |     fn advance_utf8_state(&mut self, provider: &mut dyn Provide, byte: u8) {\n  395 |         if byte & 0b1100_0000 != 0b1000_0000 {\n  396 |             self.set_state(State::Ground);\n  397 |             return;\n  398 |         }","lines":5,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L394-L398"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The `'m'` and `'M'` arms of `parse_csi_sequence` are asymmetric. `'M'` is only treated as an xterm SGR mouse event when the private marker `<` is present (`parameters.first() == Some(&0x3C)`), but `'m'` is routed to `parse_csi_xterm_mouse` unconditionally. `parse_csi_xterm_mouse` then blindly reads `parameters[1]`/`[2]`/`[3]` as `cb`/`cx`/`cy`, assuming `parameters[0]` is the `<` marker. Any ordinary SGR sequence with four or more parameters is therefore misdecoded as a mouse release: `\\x1B[38;2;255;0;0m` (24-bit foreground colour) yields `parameters == [38, 2, 255, 0, 0]`, so `cb = 2`, `cx = 255`, `cy = 0` and the parser emits `Sequence::Mouse(Mouse::Up(MouseButton::Right, 255, 0), ..)` out of thin air.","fix":"Guard `'m'` with the same private-marker check as `'M'`:\n\n```rust\n'm' if parameters.first() == Some(&0x3C) => parse_csi_xterm_mouse(parameters, ch),\n'M' if parameters.first() == Some(&0x3C) => parse_csi_xterm_mouse(parameters, ch),\n'M' => parse_csi_rxvt_mouse(parameters),\n```\n\n(The bare `'m' => ...` arm must be removed, otherwise it still shadows nothing but keeps the old behaviour.)","locations":[{"ref":"anes/src/parser/parsers.rs:56-59","code":"   56 |         'R' => parse_csi_cursor_position(parameters),\n   57 |         'm' => parse_csi_xterm_mouse(parameters, ch),\n   58 |         'M' if parameters.first() == Some(&0x3C) => parse_csi_xterm_mouse(parameters, ch),\n   59 |         'M' => parse_csi_rxvt_mouse(parameters),","lines":4,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L56-L59"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"A stray `Esc O` swallows the next keypress, including `Esc` itself. `provide_esc_sequence` sets `self.esc_o = true` for `'O'`, and `parse_char` then takes the `if esc_o` early-return branch which returns `None` for everything outside `'P'..='S'`. So after the parser has seen `\\x1BO`, an input of `\\x1BOZ` drops the `Z`, and — more surprisingly — the user pressing the `Esc` key alone produces `provide_char('\\x1B')`, which is also swallowed instead of yielding `KeyCode::Esc`. The flag is cleared afterwards, so only one keystroke is lost, but it is lost silently.","fix":"Fall through to normal character handling when the follower is not an `F1`-`F4` final byte:\n\n```rust\npub(crate) fn parse_char(ch: char, esc_o: bool) -> Option<Sequence> {\n    if esc_o {\n        if let 'P'..='S' = ch {\n            return Some(Sequence::Key(\n                KeyCode::F(ch as u8 - b'P' + 1),\n                KeyModifiers::empty(),\n            ));\n        }\n        // Not an SS3 function key - treat `O` as a lost Alt+O and keep the follower.\n    }\n    ...\n```","locations":[{"ref":"anes/src/parser/parsers.rs:3-12","code":"    3 | pub(crate) fn parse_char(ch: char, esc_o: bool) -> Option<Sequence> {\n    4 |     if esc_o {\n    5 |         return match ch {\n    6 |             'P'..='S' => Some(Sequence::Key(\n    7 |                 KeyCode::F(ch as u8 - b'P' + 1),\n    8 |                 KeyModifiers::empty(),\n    9 |             )),\n   10 |             _ => None,\n   11 |         };\n   12 |     }","lines":10,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L3-L12"},{"ref":"anes/src/parser.rs:177-190","code":"  177 |     fn provide_esc_sequence(&mut self, ch: char) {\n  178 |         if ch == 'O' {\n  179 |             // Exception\n  180 |             //\n  181 |             // Esc O - dispatched as an escape sequence followed by single character (P-S) representing\n  182 |             // F1-F4 keys. We store Esc O flag only which is then used in the dispatch_char method.\n  183 |             self.esc_o = true;\n  184 |         } else {\n  185 |             self.esc_o = false;\n  186 |             if let Some(seq) = parsers::parse_esc_sequence(ch) {\n  187 |                 self.seqs.push_back(seq);\n  188 |             }\n  189 |         }\n  190 |     }","lines":14,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser.rs#L177-L190"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`parse_char` never produces `KeyModifiers::CONTROL` for ordinary keys, and does not map `0x08`. `Ctrl+A` arrives as the byte `0x01` and is reported as `Sequence::Key(KeyCode::Char('\\u{1}'), KeyModifiers::empty())`, forcing every caller to re-derive the control mapping itself even though `KeyModifiers::CONTROL` exists in the public API. Related: `'\\x7F'` is mapped to `KeyCode::Backspace` but `'\\x08'` (which several terminals send for `Backspace`, and which is `Ctrl+H`) falls through to `KeyCode::Char('\\u{8}')`, so the same physical key yields two different `Sequence` values depending on terminal configuration.","fix":"Decode the C0 control range into letter + `CONTROL`, and treat `0x08` as `Backspace`:\n\n```rust\nlet (code, modifiers) = match ch {\n    '\\r' | '\\n' => (KeyCode::Enter, KeyModifiers::empty()),\n    '\\t' => (KeyCode::Tab, KeyModifiers::empty()),\n    '\\x08' | '\\x7F' => (KeyCode::Backspace, KeyModifiers::empty()),\n    '\\x1B' => (KeyCode::Esc, KeyModifiers::empty()),\n    '\\0' => (KeyCode::Null, KeyModifiers::empty()),\n    c @ '\\x01'..='\\x1A' => (\n        KeyCode::Char((c as u8 - 0x01 + b'a') as char),\n        KeyModifiers::CONTROL,\n    ),\n    _ => (KeyCode::Char(ch), KeyModifiers::empty()),\n};\nSome(Sequence::Key(code, modifiers))\n```\n\nNote this is a breaking behaviour change for downstream consumers, so it belongs in a minor-version bump (and `'\\t'` must stay ahead of the `'\\x01'..='\\x1A'` arm, as must `'\\r'`/`'\\n'`).","locations":[{"ref":"anes/src/parser/parsers.rs:14-22","code":"   14 |     let code = match ch {\n   15 |         '\\r' | '\\n' => KeyCode::Enter,\n   16 |         '\\t' => KeyCode::Tab,\n   17 |         '\\x7F' => KeyCode::Backspace,\n   18 |         '\\x1B' => KeyCode::Esc,\n   19 |         '\\0' => KeyCode::Null,\n   20 |         _ => KeyCode::Char(ch),\n   21 |     };\n   22 |     Some(Sequence::Key(code, KeyModifiers::empty()))","lines":9,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L14-L22"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`CSI H` (`Home`) and `CSI F` (`End`) always report `KeyModifiers::empty()` and ignore any parameters. Terminals send `CSI 1 ; 5 H` for `Ctrl+Home` and `CSI 1 ; 2 F` for `Shift+End`, so those modifiers are silently dropped. `parse_csi_tilde_key_code` already decodes the same `1 ; <mod>` shape correctly for `CSI 1 ~` / `CSI 4 ~`, so `Home`/`End` behave differently depending on which encoding the terminal happens to use.","fix":"Decode the modifier from the second parameter, same as the tilde and arrow forms:\n\n```rust\n'H' => Some(Sequence::Key(\n    KeyCode::Home,\n    parse_key_modifiers(parameters.get(1).cloned()),\n)),\n'F' => Some(Sequence::Key(\n    KeyCode::End,\n    parse_key_modifiers(parameters.get(1).cloned()),\n)),\n```","locations":[{"ref":"anes/src/parser/parsers.rs:53-54","code":"   53 |         'H' => Some(Sequence::Key(KeyCode::Home, KeyModifiers::empty())),\n   54 |         'F' => Some(Sequence::Key(KeyCode::End, KeyModifiers::empty())),","lines":2,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L53-L54"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"The whole `match byte` block in `advance_ground_state` is unreachable. `handle_possible_utf8_code_points` is called first and its very first branch, `byte & 0b1000_0000 == 0b0000_0000`, already calls `provide_char(byte as char)` and returns `true` for **every** byte in `0x00..=0x7F`, so `advance_ground_state` returns before the `match`. `0x1B` is likewise intercepted earlier by `handle_possible_esc`. The only bytes that reach the `match` are `>= 0x80` values that are not valid UTF-8 lead bytes, and those all land in `_ => {}`. That means the `Execute` arm (`0x00..=0x17 | 0x19 | 0x1C..=0x1F`), the `Print` arm (`0x20..=0x7F`) and the `unreachable!()` are dead, and the distinction between \"execute\" and \"print\" the code appears to make is not actually implemented.","fix":"Delete the dead arms and make the real behaviour explicit:\n\n```rust\nfn advance_ground_state(&mut self, provider: &mut dyn Provide, byte: u8) {\n    // ASCII and UTF-8 lead bytes are fully handled here; anything else is an\n    // invalid lead byte (0x80..=0xBF, 0xF8..=0xFF) and is dropped.\n    self.handle_possible_utf8_code_points(provider, byte);\n}\n```\n\nIf the execute/print distinction is genuinely wanted, move it into the ASCII branch of `handle_possible_utf8_code_points` instead, where the byte is actually seen.","locations":[{"ref":"anes/src/parser/engine.rs:175-191","code":"  175 |     fn advance_ground_state(&mut self, provider: &mut dyn Provide, byte: u8) {\n  176 |         if self.handle_possible_utf8_code_points(provider, byte) {\n  177 |             return;\n  178 |         }\n  179 | \n  180 |         match byte {\n  181 |             0x1B => unreachable!(),\n  182 | \n  183 |             // Execute\n  184 |             0x00..=0x17 | 0x19 | 0x1C..=0x1F => provider.provide_char(byte as char),\n  185 | \n  186 |             // Print\n  187 |             0x20..=0x7F => provider.provide_char(byte as char),\n  188 | \n  189 |             _ => {}\n  190 |         };\n  191 |     }","lines":17,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L175-L191"},{"ref":"anes/src/parser/engine.rs:148-151","code":"  148 |     fn handle_possible_utf8_code_points(&mut self, provider: &mut dyn Provide, byte: u8) -> bool {\n  149 |         if byte & 0b1000_0000 == 0b0000_0000 {\n  150 |             provider.provide_char(byte as char);\n  151 |             true","lines":4,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L148-L151"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`ignored_parameters_count` is tracked by the engine, threaded through the `Provide` trait and passed all the way into `parse_csi_sequence`, where it is bound to `_ignored_count` and never read. So the plumbing exists but the information is thrown away: a CSI sequence with more than `MAX_PARAMETERS` (30) parameters is dispatched as if it were complete, and neither the parser nor the caller can tell that parameters were dropped. Either the count should influence the decision (reject over-long sequences) or the parameter should be removed from the whole call chain.","fix":"Prefer using it — a truncated CSI sequence is malformed and should not be given a meaning:\n\n```rust\npub(crate) fn parse_csi_sequence(\n    parameters: &[u64],\n    ignored_count: usize,\n    ch: char,\n) -> Option<Sequence> {\n    if ignored_count > 0 {\n        // More than MAX_PARAMETERS parameters: the sequence is truncated, don't guess.\n        return None;\n    }\n    match ch { ... }\n}\n```\n\nIf that behaviour is not wanted, delete `ignored_parameters_count`, the `ignored_count` argument of `Provide::provide_csi_sequence`, and the `_ignored_count` parameter here, so the dead plumbing stops suggesting the value matters.","locations":[{"ref":"anes/src/parser/engine.rs:101-109","code":"  101 |     fn store_parameter(&mut self) {\n  102 |         if self.parameters_count < MAX_PARAMETERS {\n  103 |             self.parameters[self.parameters_count] = self.parameter;\n  104 |             self.parameters_count += 1;\n  105 |         } else {\n  106 |             self.ignored_parameters_count += 1;\n  107 |         }\n  108 |         self.parameter = DEFAULT_PARAMETER_VALUE;\n  109 |     }","lines":9,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L101-L109"},{"ref":"anes/src/parser/engine.rs:55-61","code":"   55 | pub(crate) trait Provide {\n   56 |     fn provide_char(&mut self, ch: char);\n   57 | \n   58 |     fn provide_esc_sequence(&mut self, ch: char);\n   59 | \n   60 |     fn provide_csi_sequence(&mut self, parameters: &[u64], ignored_count: usize, ch: char);\n   61 | }","lines":7,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L55-L61"},{"ref":"anes/src/parser/parsers.rs:31-35","code":"   31 | pub(crate) fn parse_csi_sequence(\n   32 |     parameters: &[u64],\n   33 |     _ignored_count: usize,\n   34 |     ch: char,\n   35 | ) -> Option<Sequence> {","lines":5,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L31-L35"},{"ref":"anes/src/parser.rs:192-198","code":"  192 |     fn provide_csi_sequence(&mut self, parameters: &[u64], ignored_count: usize, ch: char) {\n  193 |         if let Some(seq) = parsers::parse_csi_sequence(parameters, ignored_count, ch) {\n  194 |             self.seqs.push_back(seq);\n  195 |         }\n  196 | \n  197 |         self.esc_o = false;\n  198 |     }","lines":7,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser.rs#L192-L198"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Two commented-out `eprintln!` debug statements are left in the parser hot path. `anes/src/parser/engine.rs:415` carries `// eprintln!(\"advance: {:?} {} {}\", self.state, byte, more);` and `anes/src/parser.rs:169` carries `//        eprintln!(\"dispatch_char: {}\", ch);` with stray indentation.","fix":"Delete both lines. If per-byte tracing is worth keeping, put it behind a real feature gate instead:\n\n```rust\n#[cfg(feature = \"trace\")]\neprintln!(\"advance: {:?} {} {}\", self.state, byte, more);\n```","locations":[{"ref":"anes/src/parser/engine.rs:414-416","code":"  414 |     pub(crate) fn advance(&mut self, provider: &mut dyn Provide, byte: u8, more: bool) {\n  415 |         // eprintln!(\"advance: {:?} {} {}\", self.state, byte, more);\n  416 | ","lines":3,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L414-L416"},{"ref":"anes/src/parser.rs:168-170","code":"  168 |     fn provide_char(&mut self, ch: char) {\n  169 |         //        eprintln!(\"dispatch_char: {}\", ch);\n  170 | ","lines":3,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser.rs#L168-L170"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`parse_esc_sequence` is declared as returning `Option<Sequence>` but has exactly one code path and always returns `Some(..)`. The `Option` makes the caller in `SequenceProvider::provide_esc_sequence` write an `if let Some(seq) = ...` whose `else` branch can never be taken, and it advertises a fallibility the function does not have. The function body is also documented with a question rather than a statement (`// No need to handle other cases here? It's just Alt+$char`), leaving the intended contract unclear. A side effect of the unconditional `Some` is that any escape final byte becomes an `Alt+<char>` key event — `\\x1B#8` (`DECALN`) is reported as `Alt+8`.","fix":"Either narrow the return type to `Sequence` and drop the `if let` at the call site, or — better, since it also fixes the `DECALN` case — return `None` for final bytes that are not plausible `Alt+key` characters:\n\n```rust\npub(crate) fn parse_esc_sequence(ch: char) -> Option<Sequence> {\n    // EscO[P-S] is handled by the SequenceProvider, see parse_char & the esc_o argument.\n    // Everything else in the printable range is Alt+<char>; other final bytes belong to\n    // sequences we do not decode, so they are discarded.\n    match ch {\n        '\\x20'..='\\x7E' => Some(Sequence::Key(KeyCode::Char(ch), KeyModifiers::ALT)),\n        _ => None,\n    }\n}\n```","locations":[{"ref":"anes/src/parser/parsers.rs:25-29","code":"   25 | pub(crate) fn parse_esc_sequence(ch: char) -> Option<Sequence> {\n   26 |     // EscO[P-S] is handled in the Performer, see parse_char & esc_o argument\n   27 |     // No need to handle other cases here? It's just Alt+$char\n   28 |     Some(Sequence::Key(KeyCode::Char(ch), KeyModifiers::ALT))\n   29 | }","lines":5,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L25-L29"},{"ref":"anes/src/parser.rs:186-188","code":"  186 |             if let Some(seq) = parsers::parse_esc_sequence(ch) {\n  187 |                 self.seqs.push_back(seq);\n  188 |             }","lines":3,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser.rs#L186-L188"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The `queue!` macro keeps writing after a write has already failed and reports only the **last** error. The generated code assigns `error = Some(e)` inside the loop over sequences, so an earlier `io::Error` (say `BrokenPipe` on the first sequence) is silently overwritten by whatever the final sequence returns, and if the final write happens to succeed the earlier error is not overwritten but every intermediate sequence was still pushed at a stream already known to be broken. Callers get a misleading error kind and a partially written escape stream, which for ANSI sequences means the terminal can be left in a half-applied state. `execute!` inherits the problem because it delegates to `queue!`.","fix":"Stop at the first error and return it, keeping the block-expression shape so `queue!` still evaluates to a `Result`:\n\n```rust\n#[macro_export]\nmacro_rules! queue {\n    ($dst:expr_2021, $($sequence:expr_2021),* $(,)?) => {{\n        (|| -> ::std::io::Result<()> {\n            $(\n                write!($dst, \"{}\", $sequence)?;\n            )*\n            Ok(())\n        })()\n    }}\n}\n```\n\nIf the immediately-invoked closure is undesirable (it borrows `$dst`), keep the flag but short-circuit:\n\n```rust\nlet mut result = Ok(());\n$(\n    if result.is_ok() {\n        result = write!($dst, \"{}\", $sequence);\n    }\n)*\nresult\n```","locations":[{"ref":"anes/src/macros.rs:214-231","code":"  214 | #[macro_export]\n  215 | macro_rules! queue {\n  216 |     ($dst:expr_2021, $($sequence:expr_2021),* $(,)?) => {{\n  217 |         let mut error = None;\n  218 | \n  219 |         $(\n  220 |             if let Err(e) = write!($dst, \"{}\", $sequence) {\n  221 |                 error = Some(e);\n  222 |             }\n  223 |         )*\n  224 | \n  225 |         if let Some(error) = error {\n  226 |             Err(error)\n  227 |         } else {\n  228 |             Ok(())\n  229 |         }\n  230 |     }}\n  231 | }","lines":18,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/macros.rs#L214-L231"},{"ref":"anes/src/macros.rs:259-268","code":"  259 | #[macro_export]\n  260 | macro_rules! execute {\n  261 |     ($dst:expr_2021, $($sequence:expr_2021),* $(,)?) => {{\n  262 |         if let Err(e) = $crate::queue!($dst, $($sequence),*) {\n  263 |             Err(e)\n  264 |         } else {\n  265 |             $dst.flush()\n  266 |         }\n  267 |     }}\n  268 | }","lines":10,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/macros.rs#L259-L268"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`handle_possible_utf8_code_points` accepts lead bytes that can never start a valid UTF-8 sequence: `0xC0`/`0xC1` match `byte & 0b1110_0000 == 0b1100_0000` (overlong two-byte forms) and `0xF5`-`0xF7` match `byte & 0b1111_1000 == 0b1111_0000` (code points above `U+10FFFF`). The engine happily enters `State::Utf8`, consumes the following continuation bytes, and then `std::str::from_utf8` fails in `advance_utf8_state`; the `if let Some(ch)` simply produces nothing. The result is that up to four bytes of input vanish with no diagnostic at all — the parser cannot distinguish \"nothing was typed\" from \"malformed input was received\".","fix":"Reject the invalid lead bytes up front so they fall through to the invalid-byte path instead of eating the following bytes:\n\n```rust\n} else if byte >= 0xC2 && byte & 0b1110_0000 == 0b1100_0000 {\n    // 0xC0/0xC1 would only encode overlong forms.\n    ...\n} else if byte <= 0xF4 && byte & 0b1111_1000 == 0b1111_0000 {\n    // 0xF5..=0xF7 would encode code points above U+10FFFF.\n    ...\n```\n\nIndependently, make the decode failure visible rather than silent — at minimum replace the dropped character with `char::REPLACEMENT_CHARACTER`:\n\n```rust\nlet ch = std::str::from_utf8(&self.utf8_points[..self.utf8_points_count])\n    .ok()\n    .and_then(|s| s.chars().next())\n    .unwrap_or(char::REPLACEMENT_CHARACTER);\nprovider.provide_char(ch);\n```","locations":[{"ref":"anes/src/parser/engine.rs:148-173","code":"  148 |     fn handle_possible_utf8_code_points(&mut self, provider: &mut dyn Provide, byte: u8) -> bool {\n  149 |         if byte & 0b1000_0000 == 0b0000_0000 {\n  150 |             provider.provide_char(byte as char);\n  151 |             true\n  152 |         } else if byte & 0b1110_0000 == 0b1100_0000 {\n  153 |             self.utf8_points_count = 1;\n  154 |             self.utf8_points[0] = byte;\n  155 |             self.utf8_points_expected_count = 2;\n  156 |             self.set_state(State::Utf8);\n  157 |             true\n  158 |         } else if byte & 0b1111_0000 == 0b1110_0000 {\n  159 |             self.utf8_points_count = 1;\n  160 |             self.utf8_points[0] = byte;\n  161 |             self.utf8_points_expected_count = 3;\n  162 |             self.set_state(State::Utf8);\n  163 |             true\n  164 |         } else if byte & 0b1111_1000 == 0b1111_0000 {\n  165 |             self.utf8_points_count = 1;\n  166 |             self.utf8_points[0] = byte;\n  167 |             self.utf8_points_expected_count = 4;\n  168 |             self.set_state(State::Utf8);\n  169 |             true\n  170 |         } else {\n  171 |             false\n  172 |         }\n  173 |     }","lines":26,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L148-L173"},{"ref":"anes/src/parser/engine.rs:403-411","code":"  403 |         if self.utf8_points_count == self.utf8_points_expected_count {\n  404 |             if let Some(ch) = std::str::from_utf8(&self.utf8_points[..self.utf8_points_count])\n  405 |                 .ok()\n  406 |                 .and_then(|s| s.chars().next())\n  407 |             {\n  408 |                 provider.provide_char(ch);\n  409 |             }\n  410 |             self.set_state(State::Ground);\n  411 |         }","lines":9,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L403-L411"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"CSI parameters are accumulated as `u64` with `saturating_mul`/`saturating_add` in the engine, but every consumer truncates them with a plain `as` cast. `parse_csi_cursor_position` does `parameters[0] as u16` / `parameters[1] as u16`, and the mouse parsers do `parameters[1] as u8` and `parameters[2] as u16`. Because the values come straight off the terminal (i.e. from outside the process), a hostile or merely buggy stream such as `\\x1B[65537;65537R` silently wraps to `CursorPosition(1, 1)` instead of being rejected, and `\\x1B[<256;1;1M` truncates `cb` to `0` and reports a left-button press. Silent wrap-around is worse than dropping the sequence, because the caller cannot tell the value was bogus.","fix":"Use `try_into()` and drop the sequence when a parameter does not fit. For example in `parse_csi_cursor_position`:\n\n```rust\nlet y = u16::try_from(parameters[0]).ok()?;\nlet x = u16::try_from(parameters[1]).ok()?;\n```\n\nand in `parse_csi_xterm_mouse`:\n\n```rust\nlet cb = u8::try_from(parameters[1]).ok()?;\nlet cx = u16::try_from(parameters[2]).ok()?;\nlet cy = u16::try_from(parameters[3]).ok()?;\n```\n\n(`parse_csi_rxvt_mouse` keeps `cb` as `u64` for the bit tests, so only `cx`/`cy` need converting there.)","locations":[{"ref":"anes/src/parser/parsers.rs:119-130","code":"  119 | fn parse_csi_cursor_position(parameters: &[u64]) -> Option<Sequence> {\n  120 |     // ESC [ Cy ; Cx R\n  121 | \n  122 |     if parameters.len() < 2 {\n  123 |         return None;\n  124 |     }\n  125 | \n  126 |     let y = parameters[0] as u16;\n  127 |     let x = parameters[1] as u16;\n  128 | \n  129 |     Some(Sequence::CursorPosition(x, y))\n  130 | }","lines":12,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L119-L130"},{"ref":"anes/src/parser/parsers.rs:132-141","code":"  132 | fn parse_csi_xterm_mouse(parameters: &[u64], ch: char) -> Option<Sequence> {\n  133 |     // ESC [ < Cb ; Cx ; Cy (;) (M or m)\n  134 | \n  135 |     if parameters.len() < 4 {\n  136 |         return None;\n  137 |     }\n  138 | \n  139 |     let cb = parameters[1] as u8;\n  140 |     let cx = parameters[2] as u16;\n  141 |     let cy = parameters[3] as u16;","lines":10,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L132-L141"},{"ref":"anes/src/parser/parsers.rs:189-198","code":"  189 | fn parse_csi_rxvt_mouse(parameters: &[u64]) -> Option<Sequence> {\n  190 |     // ESC [ Cb ; Cx ; Cy ; M\n  191 | \n  192 |     if parameters.len() < 3 {\n  193 |         return None;\n  194 |     }\n  195 | \n  196 |     let cb = parameters[0];\n  197 |     let cx = parameters[1] as u16;\n  198 |     let cy = parameters[2] as u16;","lines":10,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L189-L198"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `sequence!` macro's doc example for the dynamic-struct form contradicts the real implementation and the ANSI spec. The doc says `Moves the cursor to the given location (column, row)` and `Top/left cell is represented as 1, 1`, but the body writes `write!(f, csi!(\"{};{}H\"), this.0, this.1)` — column first. `CUP` is `CSI row ; column H`, and the shipping `MoveCursorTo` in `anes/src/sequences/cursor.rs:143` correctly writes `this.1, this.0`. The example's own assertion, `format!(\"{}\", MoveCursorTo(10, 5)) == \"\\x1B[10;5H\"`, bakes in the swapped order, so anyone copying this example to build their own sequence gets row and column transposed.","fix":"Make the example match `cursor.rs`:\n\n```rust\n/// sequence!(\n///     /// Moves the cursor to the given location (column, row).\n///     ///\n///     /// # Notes\n///     ///\n///     /// Top/left cell is represented as `1, 1`.\n///     struct MoveCursorTo(u16, u16) =>\n///     |this, f| write!(f, csi!(\"{};{}H\"), this.1, this.0)\n/// );\n///\n/// assert_eq!(&format!(\"{}\", MoveCursorTo(10, 5)), \"\\x1B[5;10H\");\n```","locations":[{"ref":"anes/src/macros.rs:100-112","code":"  100 | ///\n  101 | /// sequence!(\n  102 | ///     /// Moves the cursor to the given location (column, row).\n  103 | ///     ///\n  104 | ///     /// # Notes\n  105 | ///     ///\n  106 | ///     /// Top/left cell is represented as `1, 1`.\n  107 | ///     struct MoveCursorTo(u16, u16) =>\n  108 | ///     |this, f| write!(f, csi!(\"{};{}H\"), this.0, this.1)\n  109 | /// );\n  110 | ///\n  111 | /// assert_eq!(&format!(\"{}\", MoveCursorTo(10, 5)), \"\\x1B[10;5H\");\n  112 | /// ```","lines":13,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/macros.rs#L100-L112"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment of `ResetAttributes` cross-links the two colour sequences to each other's pages: the bullet labelled `SetForegroundColor` points at `struct.SetBackgroundColor.html` and the bullet labelled `SetBackgroundColor` points at `struct.SetForegroundColor.html`. Readers of the rendered docs on docs.rs land on the wrong type.","fix":"Swap the two link targets:\n\n```rust\n/// * [`SetAttribute`](struct.SetAttribute.html)\n/// * [`SetForegroundColor`](struct.SetForegroundColor.html)\n/// * [`SetBackgroundColor`](struct.SetBackgroundColor.html)\n```","locations":[{"ref":"anes/src/sequences/attribute.rs:8-10","code":"    8 |     /// * [`SetAttribute`](struct.SetAttribute.html)\n    9 |     /// * [`SetForegroundColor`](struct.SetBackgroundColor.html)\n   10 |     /// * [`SetBackgroundColor`](struct.SetForegroundColor.html)","lines":3,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/sequences/attribute.rs#L8-L10"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`advance_csi_entry_state`'s catch-all arm stores the raw byte value as a parameter (`self.parameter = byte as u64; self.store_parameter();`), which is how the private markers `<` and `?` survive into `parse_csi_sequence` — hence checks like `parameters.first() == Some(&0x3C)`. But a raw marker byte is indistinguishable from a genuine numeric parameter of the same value: `CSI 60 ; 0 ; 20 ; 10 M` produces exactly the same `parameters` slice as `CSI < 0 ; 20 ; 10 M`, because `'<'` is `0x3C == 60`. The arm also swallows any other stray byte (including `0x80`-`0xFF`) into the parameter list rather than invalidating the sequence, and it is inconsistent with `advance_csi_parameter_state`, which routes `0x3C..=0x3F` to `State::CsiIgnore`.","fix":"Track the private marker in a dedicated field instead of smuggling it through the parameter array. Add `private_marker: Option<u8>` to `Engine`, clear it in `set_state` alongside the other `State::Ground` resets, and set it in `advance_csi_entry_state`:\n\n```rust\n// Private parameter marker: '<', '=', '>', '?'\n0x3C..=0x3F => self.private_marker = Some(byte),\n\n// Anything else here is not a valid CSI parameter byte.\n_ => self.set_state(State::CsiIgnore),\n```\n\nThen extend `Provide::provide_csi_sequence` with the marker and have `parse_csi_sequence` match on `Some(b'<')` rather than on `parameters.first() == Some(&0x3C)`.","locations":[{"ref":"anes/src/parser/engine.rs:290-294","code":"  290 |             // Collect rest as parameters\n  291 |             _ => {\n  292 |                 self.parameter = byte as u64;\n  293 |                 self.store_parameter();\n  294 |             }","lines":5,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L290-L294"},{"ref":"anes/src/parser/engine.rs:348-349","code":"  348 |             // Ignore\n  349 |             0x3A | 0x3C..=0x3F => self.set_state(State::CsiIgnore),","lines":2,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L348-L349"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The dynamic-struct arm of `sequence!` coerces the user-supplied closure to a trait object on every single `Display::fmt` call: `let write: &dyn Fn(&Self, &mut Formatter<'_>) -> Result = &$write;` followed by `write(self, f)`. The coercion exists only to give the closure's parameters a type, but it forces an indirect call and blocks inlining of the closure body. Every dynamic sequence in the crate goes through this path — `MoveCursorTo`, `MoveCursorUp`/`Down`/`Left`/`Right`, `SetForegroundColor`, `SetBackgroundColor`, `SetAttribute`, `ScrollBufferUp`/`Down`, `ResizeTextArea` — and these are exactly the sequences a TUI emits per cell/per frame.","fix":"Pin the closure's type with a generic identity helper instead of a trait object, keeping the call static:\n\n```rust\nimpl ::std::fmt::Display for $type {\n    fn fmt(&self, f: &mut ::std::fmt::Formatter<'_>) -> ::std::fmt::Result {\n        fn typed<F>(f: F) -> F\n        where\n            F: Fn(&$type, &mut ::std::fmt::Formatter<'_>) -> ::std::fmt::Result,\n        {\n            f\n        }\n        typed($write)(self, f)\n    }\n}\n```\n\n`typed` is a no-op at runtime and monomorphises per closure, so the write is inlined.","locations":[{"ref":"anes/src/macros.rs:174-180","code":"  174 |         impl ::std::fmt::Display for $type {\n  175 |             fn fmt(&self, f: &mut ::std::fmt::Formatter<'_>) -> ::std::fmt::Result {\n  176 |                 let write: &dyn Fn(&Self, &mut ::std::fmt::Formatter<'_>) -> ::std::fmt::Result =\n  177 |                     &$write;\n  178 |                 write(self, f)\n  179 |             }\n  180 |         }","lines":7,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/macros.rs#L174-L180"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`Engine::advance` takes `provider: &mut dyn Provide` and is invoked once per input byte from `Parser::advance`, so every byte pays a virtual dispatch for `provide_char`/`provide_esc_sequence`/`provide_csi_sequence`, and the compiler cannot inline the provider. The only production implementor is `SequenceProvider`; `dyn` is used solely so the engine's unit tests can swap in `CharProvider`/`CsiProvider`/`EscProvider`. Generics give the tests the same flexibility with static dispatch.","fix":"Make the provider a type parameter of the method (not of `Engine`, so `Engine: Default` and the field layout are unchanged):\n\n```rust\npub(crate) fn advance<P: Provide + ?Sized>(&mut self, provider: &mut P, byte: u8, more: bool) {\n```\n\nand change the private `advance_*_state` / `handle_possible_*` helpers to the same signature. The existing test helper already passes `&mut dyn Provide`, which still satisfies `P: Provide + ?Sized`, so the tests compile unchanged.","locations":[{"ref":"anes/src/parser/engine.rs:414-431","code":"  414 |     pub(crate) fn advance(&mut self, provider: &mut dyn Provide, byte: u8, more: bool) {\n  415 |         // eprintln!(\"advance: {:?} {} {}\", self.state, byte, more);\n  416 | \n  417 |         if self.handle_possible_esc(provider, byte, more) {\n  418 |             return;\n  419 |         }\n  420 | \n  421 |         match self.state {\n  422 |             State::Ground => self.advance_ground_state(provider, byte),\n  423 |             State::Escape => self.advance_escape_state(provider, byte),\n  424 |             State::EscapeIntermediate => self.advance_escape_intermediate_state(provider, byte),\n  425 |             State::CsiEntry => self.advance_csi_entry_state(provider, byte),\n  426 |             State::CsiIgnore => self.advance_csi_ignore_state(provider, byte),\n  427 |             State::CsiParameter => self.advance_csi_parameter_state(provider, byte),\n  428 |             State::CsiIntermediate => self.advance_csi_intermediate_state(provider, byte),\n  429 |             State::Utf8 => self.advance_utf8_state(provider, byte),\n  430 |         };\n  431 |     }","lines":18,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L414-L431"},{"ref":"anes/src/parser.rs:136-142","code":"  136 |     pub fn advance(&mut self, buffer: &[u8], more: bool) {\n  137 |         let len = buffer.len();\n  138 |         for (idx, byte) in buffer.iter().enumerate() {\n  139 |             self.engine\n  140 |                 .advance(&mut self.provider, *byte, idx < len - 1 || more);\n  141 |         }\n  142 |     }","lines":7,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser.rs#L136-L142"}]},{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The six `advance_*_state` methods repeat the same boilerplate arms with no shared helper: `0x1B => unreachable!()`, `0x00..=0x17 | 0x19 | 0x1C..=0x1F => provider.provide_char(byte as char)`, `0x7F => {}` (each carrying an identical copy of the `// TODO Does it mean we should ignore the whole sequence?` comment), and `_ => self.set_state(State::Ground)`. That is four arms duplicated across six functions. The duplication is not inert: the `Ignore`/`Execute` arms are subtly inconsistent between states (`advance_csi_ignore_state` folds `0x20..=0x3F` into the ignore arm, `advance_csi_intermediate_state` does not), and a fix to the shared `TODO` has to be applied in six places, which is precisely the kind of drift that produces one-branch-updated bugs.","fix":"Factor the shared tail into one helper and have each state delegate for the bytes it does not handle itself:\n\n```rust\n/// Bytes handled identically in every non-ground state: C0 controls are executed,\n/// DEL is ignored, anything else cancels the sequence.\nfn advance_common(&mut self, provider: &mut dyn Provide, byte: u8) {\n    match byte {\n        0x00..=0x17 | 0x19 | 0x1C..=0x1F => provider.provide_char(byte as char),\n        0x7F => {}\n        _ => self.set_state(State::Ground),\n    }\n}\n```\n\nEach `advance_*_state` then keeps only its state-specific arms and ends with `_ => self.advance_common(provider, byte)`. Resolve the `TODO` once, in `advance_common`.","locations":[{"ref":"anes/src/parser/engine.rs:193-222","code":"  193 |     fn advance_escape_state(&mut self, provider: &mut dyn Provide, byte: u8) {\n  194 |         match byte {\n  195 |             0x1B => unreachable!(),\n  196 | \n  197 | mpty()\n   93 |     }\n   94 | }","lines":26,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/parsers.rs#L69-L94"}]},{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"very_easy","description":"Seven `0x1B => unreachable!()` arms guard against an `Esc` byte reaching a state handler. They are genuinely unreachable today because `Engine::advance` calls `handle_possible_esc` first and that function returns `true` for every `0x1B`, so the handlers are never entered with that byte. But the invariant is implicit and spread across seven sites: any future refactor that calls an `advance_*_state` helper directly, or that adds an early-return path to `handle_possible_esc`, converts a parser bug into a hard panic in a library whose input is untrusted terminal data. A parser should not have a reachable-by-refactor `unreachable!()`.","fix":"Replace each `0x1B => unreachable!(),` with a `debug_assert!` in `advance` plus a safe fallback in the handlers. In `advance`:\n\n```rust\npub(crate) fn advance(&mut self, provider: &mut dyn Provide, byte: u8, more: bool) {\n    if self.handle_possible_esc(provider, byte, more) {\n        return;\n    }\n    debug_assert_ne!(byte, 0x1B, \"Esc must be consumed by handle_possible_esc\");\n    ...\n```\n\nand delete the seven `0x1B` arms so the byte falls into each state's existing `_ => self.set_state(State::Ground)` arm — a cancelled sequence rather than an abort.","locations":[{"ref":"anes/src/parser/engine.rs:180-181","code":"  180 |         match byte {\n  181 |             0x1B => unreachable!(),","lines":2,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844/anes/src/parser/engine.rs#L180-L181"},{"ref":"anes/src/parser/engine.rs:194-195","code":"  194 |         match byte {\n  195 |             0x1B => unreachable!(),","lines":2,"link":"https://github.com/zrzka/anes-rs/blob/0ec7d42fbd631199b0735702553ec3b2eda1f844 <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);

const STATUSES = ['open','fixed','wont-fix','false-positive'];
