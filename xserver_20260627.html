CMD_HDR_SIZE);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/renderpixswap.c#L44"},{"ref":"Xext/glx/renderpix.c:44","code":"   44 |     hdrlen = __GLX_PAD(__GLX_CONV_FILT_CMD_DISPATCH_HDR_SIZE);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/renderpix.c#L44"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"In __glXDrawArraysReqSize (rensize.c:417), the validation condition for GL_EDGE_FLAG_ARRAY uses logical\nAND: '(numVals != 1) && (datatype != GL_UNSIGNED_BYTE)'. This means the check only rejects packets\nwhere both conditions are simultaneously true. A packet with numVals=99 but datatype==GL_UNSIGNED_BYTE\npasses validation even though the array element count is wrong. Similarly, numVals==1 with\ndatatype==GL_FLOAT passes even though the type is invalid for edge flags. The condition should use\nlogical OR to reject when either constraint is violated.","fix":"Change the condition to: if ((numVals != 1) || (datatype != GL_UNSIGNED_BYTE)) { return -1; }","locations":[{"ref":"Xext/glx/rensize.c:416-421","code":"  416 |         case GL_EDGE_FLAG_ARRAY:\n  417 |             if ((numVals != 1) && (datatype != GL_UNSIGNED_BYTE)) {\n  418 |                 /* bad size or bad type */\n  419 |                 return -1;\n  420 |             }\n  421 |             break;","lines":6,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/rensize.c#L416-L421"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"GetConvolutionFilter in singlepixswap.c has the 1D/2D condition inverted compared to the non-swap version in singlepix.c. singlepix.c correctly sets height=1 for GL_CONVOLUTION_1D; singlepixswap.c sets height=1 for GL_CONVOLUTION_2D instead, which means a 2D filter reports height=1 (wrong buffer size) and a 1D filter queries GL_CONVOLUTION_HEIGHT (wrong query). This causes an incorrect compsize, potentially allocating too small a buffer or sending garbage data.","fix":"Change the condition in singlepixswap.c from `if (target == GL_CONVOLUTION_2D)` to `if (target == GL_CONVOLUTION_1D)` to match the logic in singlepix.c.","locations":[{"ref":"Xext/glx/singlepixswap.c:305-318","code":"  305 |     swapBytes = *(GLboolean *) (pc + 12);\n  306 | \n  307 |     glGetConvolutionParameteriv(target, GL_CONVOLUTION_WIDTH, &width);\n  308 |     if (target == GL_CONVOLUTION_2D) {\n  309 |         height = 1;\n  310 |     }\n  311 |     else {\n  312 |         glGetConvolutionParameteriv(target, GL_CONVOLUTION_HEIGHT, &height);\n  313 |     }\n  314 |     /*\n  315 |      * The two queries above might fail if we're in a state where queries\n  316 |      * are illegal, but then width and height would still be zero anyway.\n  317 |      */\n  318 |     compsize = __glGetTexImage_size(target, 1, format, type, width, height, 1);","lines":14,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/singlepixswap.c#L305-L318"},{"ref":"Xext/glx/singlepix.c:280-294","code":"  280 |     swapBytes = *(GLboolean *) (pc + 12);\n  281 | \n  282 |     glGetConvolutionParameteriv(target, GL_CONVOLUTION_WIDTH, &width);\n  283 |     if (target == GL_CONVOLUTION_1D) {\n  284 |         height = 1;\n  285 |     }\n  286 |     else {\n  287 |         glGetConvolutionParameteriv(target, GL_CONVOLUTION_HEIGHT, &height);\n  288 |     }\n  289 |     /*\n  290 |      * The two queries above might fail if we're in a state where queries\n  291 |      * are illegal, but then width and height would still be zero anyway.\n  292 |      */\n  293 |     compsize = __glGetTexImage_size(target, 1, format, type, width, height, 1);\n  294 |     if (compsize < 0)","lines":15,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/singlepix.c#L280-L294"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"In config.c select_ns(), calloc() is called but its return value is never checked for NULL. If the allocation fails, `newns->name = strdup(name)` immediately dereferences the NULL pointer, crashing the server during config loading.","fix":"Check `if (!newns) FatalError(\"Xnamespace: failed allocating namespace\\n\");` immediately after the calloc call.","locations":[{"ref":"Xext/namespace/config.c:40-41","code":"   40 |     struct Xnamespace *newns = calloc(1, sizeof(struct Xnamespace));\n   41 |     newns->name = strdup(name);","lines":2,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/config.c#L40-L41"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"Multiple namespace hooks (hookClient, hookDevice, hookExtAccess, hookExtDispatch, hookReceive, hookSelectionFilter, hookServerAccess, hookWindowProperty, hookResourceAccess) dereference `subj->ns->superPower` or other fields without first checking that `subj` or `subj->ns` is non-NULL. XNS_HOOK_HEAD provides no early-return when client is NULL, and XnsClientPriv(NULL) returns NULL. A NULL subj causes an immediate crash; a NULL subj->ns (possible during client teardown) is equally fatal.","fix":"Add `if (!subj || !subj->ns) return;` at the top of each hook that accesses subj->ns. Alternatively, add the guard directly into XNS_HOOK_HEAD.","locations":[{"ref":"Xext/namespace/hook-client.c:27","code":"   27 |     if (subj->ns->superPower || XnsClientSameNS(subj, obj))","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-client.c#L27"},{"ref":"Xext/namespace/hook-device.c:21","code":"   21 |     if (subj->ns->superPower)","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-device.c#L21"},{"ref":"Xext/namespace/hook-ext-access.c:19","code":"   19 |     if (subj->ns->superPower)","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-ext-access.c#L19"},{"ref":"Xext/namespace/hook-ext-dispatch.c:26","code":"   26 |     if (subj->ns->superPower)","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-ext-dispatch.c#L26"},{"ref":"Xext/namespace/hook-receive.c:37","code":"   37 |                             if ((!subj->ns->allowMouseMotion) || !isRootWin(param->pWin))","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-receive.c#L37"},{"ref":"Xext/namespace/hooks.h:19-25","code":"   19 | #define XNS_HOOK_HEAD(t) \\\n   20 |     t *param = calldata; \\\n   21 |     ClientPtr client = param->client; \\\n   22 |     if (!client) { \\\n   23 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   24 |     } \\\n   25 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hooks.h#L19-L25"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"hookPropertyAccess dereferences `subj->ns->rootWindow` after the same-namespace check without first verifying that `subj` or `subj->ns` is non-NULL. XNS_HOOK_HEAD does not early-return when `client` is NULL; XnsClientPriv(NULL) returns NULL, making subj NULL. Also, if a client's namespace was cleared by hookClientDestroy before a subsequent hook fires, subj->ns can be NULL. Both cases cause a NULL pointer dereference crash.","fix":"After XNS_HOOK_HEAD, add `if (!subj || !subj->ns) return;` before any access to `subj->ns`. Apply the same guard in all other hooks that dereference `subj->ns` without checking.","locations":[{"ref":"Xext/namespace/hook-property.c:33","code":"   33 |     if (param->pWin == subj->ns->rootWindow)","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-property.c#L33"},{"ref":"Xext/namespace/hooks.h:19-25","code":"   19 | #define XNS_HOOK_HEAD(t) \\\n   20 |     t *param = calldata; \\\n   21 |     ClientPtr client = param->client; \\\n   22 |     if (!client) { \\\n   23 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   24 |     } \\\n   25 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hooks.h#L19-L25"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"hookResourceAccess (hook-resource.c) dereferences `obj` at line 109\n(`obj->isServer`) and at line 135 (`obj->ns->name`) without checking whether\n`obj` is NULL. `obj = XnsClientPriv(owner)` where `owner = dixLookupXIDOwner(param->id)`.\n`dixLookupXIDOwner` can return NULL (when the XID does not map to a live client,\ne.g. server-internal resources or a just-disconnected client). In that case\n`XnsClientPriv(NULL)` returns NULL, and the code reaches line 109 after\n`XnsClientSameNS(subj, obj)` returns FALSE (different namespaces: one NULL, one\nnot), leading to a NULL dereference.","fix":"Add a NULL check for `obj` before line 109: `if (!obj) goto reject;` (or treat it as the server owning the resource and handle accordingly).","locations":[{"ref":"Xext/namespace/hook-resource.c:24-25","code":"   24 |     ClientPtr owner = dixLookupXIDOwner(param->id);\n   25 |     struct XnamespaceClientPriv *obj = XnsClientPriv(owner);","lines":2,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-resource.c#L24-L25"},{"ref":"Xext/namespace/hook-resource.c:109-123","code":"  109 |     if (obj->isServer) {\n  110 |         if (param->rtype == X11_RESTYPE_COLORMAP) {\n  111 |             if (checkAllowed(param->access_mode, DixReadAccess | DixGetPropAccess | DixUseAccess | DixGetAttrAccess | DixAddAccess))\n  112 |                 goto pass;\n  113 |         }\n  114 | \n  115 |         if (param->rtype == X11_RESTYPE_WINDOW) {\n  116 |             /* allowed ones should already been catched above */\n  117 |             XNS_HOOK_LOG(\"REJECT server owned window 0x%0lx!\\n\", (unsigned long)((WindowPtr)param->res)->drawable.id);\n  118 |             goto reject;\n  119 |         }\n  120 | \n  121 |         if (checkAllowed(param->access_mode, DixReadAccess))\n  122 |             goto pass;\n  123 |     }","lines":15,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-resource.c#L109-L123"},{"ref":"Xext/namespace/hook-resource.c:135","code":"  135 |         obj->ns->name);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-resource.c#L135"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"hookSelectionFilter (hook-selection.c) dereferences `subj->ns->superPower` at\nline 37 without a NULL guard on `subj`. Same root cause as above: XNS_HOOK_HEAD\ndoes not early-return for NULL client.","fix":"Add `if (!subj) return;` immediately after XNS_HOOK_HEAD.","locations":[{"ref":"Xext/namespace/hook-selection.c:34-37","code":"   34 |     XNS_HOOK_HEAD(SelectionFilterParamRec);\n   35 | \n   36 |     /* no rewrite if client is in root namespace */\n   37 |     if (subj->ns->superPower)","lines":4,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-selection.c#L34-L37"},{"ref":"Xext/namespace/hooks.h:19-25","code":"   19 | #define XNS_HOOK_HEAD(t) \\\n   20 |     t *param = calldata; \\\n   21 |     ClientPtr client = param->client; \\\n   22 |     if (!client) { \\\n   23 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   24 |     } \\\n   25 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hooks.h#L19-L25"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"hookSend (hook-send.c) dereferences `obj->ns->name` at line 39 in the log\nmessage after calling `clientAllowedOnClient()` returned FALSE. `targetClient =\ndixClientForWindow(param->pWin)` can return NULL (dixClientForWindow returns NULL\nfor NULL pWin or when the window is owned by the server). If `targetClient` is NULL,\n`obj = XnsClientPriv(NULL) = NULL`, and `obj->ns->name` at line 39 is a NULL\ndereference.","fix":"Check `if (!targetClient || !obj)` before logging and before using `obj->ns`.","locations":[{"ref":"Xext/namespace/hook-send.c:34-39","code":"   34 |     ClientPtr targetClient = dixClientForWindow(param->pWin);\n   35 |     struct XnamespaceClientPriv *obj = XnsClientPriv(targetClient);\n   36 |     if (clientAllowedOnClient(client, targetClient))\n   37 |         goto pass;\n   38 | \n   39 |     XNS_HOOK_LOG(\"BLOCK target @ %s\\n\", obj->ns->name);","lines":6,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-send.c#L34-L39"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"hookServerAccess (hook-server.c) dereferences `subj` unconditionally at line 17\n(`subj->ns->superPower`) before checking whether `subj` is NULL. XNS_HOOK_HEAD\nsets `subj = XnsClientPriv(client)`, which returns NULL when `client` is NULL.\nAlthough the ServerAccessCallback callers currently always pass a non-NULL client,\nthe guard comment in XNS_HOOK_HEAD is disabled (`/* XNS_LOG... */`), leaving no\nactual early return for NULL. If a future caller passes NULL, this is a NULL\ndereference crash.","fix":"Add `if (!subj) return;` (or `if (!client) return;`) immediately after XNS_HOOK_HEAD in hookServerAccess, before the first use of `subj`.","locations":[{"ref":"Xext/namespace/hook-server.c:15-18","code":"   15 |     XNS_HOOK_HEAD(ServerAccessCallbackParam);\n   16 | \n   17 |     if (subj->ns->superPower)\n   18 |         goto pass;","lines":4,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-server.c#L15-L18"},{"ref":"Xext/namespace/hooks.h:19-25","code":"   19 | #define XNS_HOOK_HEAD(t) \\\n   20 |     t *param = calldata; \\\n   21 |     ClientPtr client = param->client; \\\n   22 |     if (!client) { \\\n   23 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   24 |     } \\\n   25 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hooks.h#L19-L25"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"hookWindowProperty (hook-windowproperty.c) dereferences `subj` at line 20\n(`subj->ns->superPower`) and again at lines 33, 37, and 42, with no NULL guard.\nXNS_HOOK_HEAD allows `client` to be NULL (the guard is a no-op comment), which\nmakes `subj = XnsClientPriv(NULL) = NULL`. The PropertyFilterCallback currently\nreceives a real client, but the pattern is fragile.","fix":"Add `if (!subj) return;` immediately after XNS_HOOK_HEAD.","locations":[{"ref":"Xext/namespace/hook-windowproperty.c:17-20","code":"   17 |     XNS_HOOK_HEAD(PropertyFilterParam);\n   18 | \n   19 |     // no redirect on super power\n   20 |     if (subj->ns->superPower)","lines":4,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-windowproperty.c#L17-L20"},{"ref":"Xext/namespace/hooks.h:19-25","code":"   19 | #define XNS_HOOK_HEAD(t) \\\n   20 |     t *param = calldata; \\\n   21 |     ClientPtr client = param->client; \\\n   22 |     if (!client) { \\\n   23 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   24 |     } \\\n   25 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hooks.h#L19-L25"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In compFreeClientSubwindows(), pClient is obtained via dixClientForXID(id) (line 433), which\ncan return NULL when the client no longer exists (e.g., during server reset or forced client\ndisconnect). pClient is then passed to DamageExtSetCritical() (line 441) and\ncompUnredirectWindow() (line 454). DamageExtSetCritical() internally calls\nGetDamageClient(pClient) which dereferences pClient->devPrivates without a NULL guard.\ncompUnredirectWindow() has BUG_RETURN_VAL(!pClient, BadValue) which only logs a bug and\nreturns -- but DamageExtSetCritical() is called first and will crash.","fix":"After line 433, add a NULL check: if (pClient == NULL) goto skip_client_ops; and restructure\nthe DamageExtSetCritical() call to be inside a pClient != NULL guard.","locations":[{"ref":"Xext/composite/compalloc.c:433-454","code":"  433 |             ClientPtr pClient = dixClientForXID(id);\n  434 | \n  435 |             *prev = ccw->next;\n  436 |             if (ccw->update == CompositeRedirectManual) {\n  437 |                 /*\n  438 |                  * tell damage extension that damage events for this client are\n  439 |                  * critical output\n  440 |                  */\n  441 |                 DamageExtSetCritical(pClient, false);\n  442 |                 csw->update = CompositeRedirectAutomatic;\n  443 |                 pWin->inhibitBGPaint = FALSE;\n  444 |                 if (pWin->mapped)\n  445 |                     (*pWin->drawable.pScreen->ClearToBackground) (pWin, 0, 0, 0,\n  446 |                                                                   0, TRUE);\n  447 |             }\n  448 | \n  449 |             /*\n  450 |              * Unredirect all existing subwindows\n  451 |              */\n  452 |             for (WindowPtr pChild = pWin->lastChild;\n  453 |                     pChild; pChild = pChild->prevSib)\n  454 |                 (void) compUnredirectWindow(pClient, pChild, ccw->update);","lines":22,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/composite/compalloc.c#L433-L454"}]},{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In ProcCompositeQueryVersion() (compext.c lines 118-121), when the client requests a major\nversion lower than SERVER_COMPOSITE_MAJOR_VERSION, the reply is set to the client's requested\nversion including the client's minor version verbatim. This is correct when major versions\nmatch exactly, but when the major version differs the server should negotiate down to its own\ncapabilities for that major version, not blindly echo the client's minor version. A client\ncould claim major=0 minor=999 and the server would reply with minor=999 even though it only\nsupports a lower minor version.","fix":"When stuff->majorVersion < SERVER_COMPOSITE_MAJOR_VERSION, clamp the replied minor version to\nthe server's known minor version for that major, rather than echoing stuff->minorVersion.","locations":[{"ref":"Xext/composite/compext.c:117-121","code":"  117 |     /* if client asking for a lower version, use this one */\n  118 |     if (stuff->majorVersion < SERVER_COMPOSITE_MAJOR_VERSION) {\n  119 |         reply.majorVersion = stuff->majorVersion;\n  120 |         reply.minorVersion = stuff->minorVersion;\n  121 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/composite/compext.c#L117-L121"}]},{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In compAddAlternateVisuals(), the return value is computed by OR-ing all calls to\ncompAddAlternateVisual() (line 304). compAddAlternateVisual() returns FALSE on real failures\n(PictureMatchFormat fails, ResizeVisualArray fails), but also returns FALSE when the depth is\nnot suitable for this screen (line 243). The OR-combination means compScreenInit() aborts\n(returns FALSE, line 336-338) only if ALL visual additions fail. However, it also means\ncompScreenInit() succeeds even when one visual depth fails due to a genuine allocation error\nas long as at least one other visual succeeds, hiding a partial failure. The function type is\ndeclared 'Bool' but uses an int accumulator (line 301) which happens to work only by accident.","fix":"Track failures separately from the 'not applicable' case. Return FALSE only when a visual that\nshould have been added failed. Or use a separate 'any_failure' bool accumulator instead of OR-ing\nbooleans that conflate 'inapplicable' and 'failed'.","locations":[{"ref":"Xext/composite/compinit.c:298-307","code":"  298 | static Bool\n  299 | compAddAlternateVisuals(ScreenPtr pScreen, CompScreenPtr cs)\n  300 | {\n  301 |     int ret = 0;\n  302 | \n  303 |     for (int alt = 0; alt < ARRAY_SIZE(altVisuals); alt++)\n  304 |         ret |= compAddAlternateVisual(pScreen, cs, altVisuals + alt);\n  305 | \n  306 |     return ret;\n  307 | }","lines":10,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/composite/compinit.c#L298-L307"},{"ref":"Xext/composite/compinit.c:336-338","code":"  336 |     if (!compAddAlternateVisuals(pScreen, cs)) {\n  337 |         free(cs);\n  338 |         return FALSE;","lines":3,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/composite/compinit.c#L336-L338"}]},{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In DRI2DrawableGone(), when iterating with xorg_list_for_each_entry_safe, the second branch `if (ref->id == id)` does not have a `break` or `continue` after deleting the ref entry. This means that after deleting a ref by X drawable id, the loop continues to the next iteration using `next`, which is correct for the _safe variant. However, if a single X drawable id has multiple associated dri2_ids (which is possible since DRI2AddDrawableRef can add multiple entries with the same id but different dri2_ids), only the first matching entry is freed, but FreeResourceByType is called for its dri2_id, which triggers DRI2DrawableGone again recursively for each associated dri2_id - potentially causing double-free of ref entries. The missing `continue` is a latent hazard if the structure is extended.","fix":"Add `continue;` after `free(ref);` in the `ref->id == id` branch, or rethink the loop to handle multi-ref cases explicitly.","locations":[{"ref":"Xext/dri2/dri2.c:390-394","code":"  390 |         if (ref->id == id) {\n  391 |             xorg_list_del(&ref->link);\n  392 |             FreeResourceByType(ref->dri2_id, dri2DrawableRes, TRUE);\n  393 |             free(ref);\n  394 |         }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dri2/dri2.c#L390-L394"}]},{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In do_get_buffers(), the err_out cleanup loop iterates `for (i = 0; i < count; i++)` to destroy buffers, but `i` was advanced past `count` if the extra real-front or fake-front buffers were added after the main loop (lines 594-617). Those extra buffers at index `count` and `count+1` are not destroyed in the error path, causing a resource leak. The local `buffers` array was allocated as `min(count, DRI2BufferHiz) + 1` elements, and the extra entries added after the main loop fall within the array but are skipped by the err_out loop.","fix":"Change the err_out cleanup loop bound from `count` to `i` (the current index at the time of the goto), so all allocated buffers including the extra front/fake-front entries are destroyed.","locations":[{"ref":"Xext/dri2/dri2.c:647-664","code":"  647 |  err_out:\n  648 | \n  649 |     *out_count = 0;\n  650 | \n  651 |     if (buffers) {\n  652 |         for (i = 0; i < count; i++) {\n  653 |             if (buffers[i] != NULL)\n  654 |                 destroy_buffer(pDraw, buffers[i], 0);\n  655 |         }\n  656 | \n  657 |         free(buffers);\n  658 |         buffers = NULL;\n  659 |     }\n  660 | \n  661 |     update_dri2_drawable_buffers(pPriv, pDraw, buffers, *out_count, width,\n  662 |                                  height);\n  663 | \n  664 |     return buffers;","lines":18,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dri2/dri2.c#L647-L664"}]},{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In proc_dri3_query_version(), the version negotiation skips from 1.2 to 1.4, never reporting 1.3. If the screen supports 1.4, the code reports 1.4; if not, it falls back to 1.2. Protocol version 1.3 introduced SetDRMDeviceInUse (which is dispatched in proc_dri3_dispatch as xDRI3SetDRMDeviceInUse) but the capability check function dri3_screen_can_one_point_four() controls both 1.3 and 1.4 features. A client requesting exactly 1.3 would receive a capped reply of 1.2 when the server actually supports SetDRMDeviceInUse. Since SetDRMDeviceInUse is a no-op this is not critical, but the version reporting is incorrect.","fix":"Add a `dri3_screen_can_one_point_three()` capability check (or reuse the existing one since 1.3 uses no new driver interfaces) and report 1.3 before 1.4 in the version ladder.","locations":[{"ref":"Xext/dri3/dri3_request.c:88-123","code":"   88 | \n   89 |     DIX_FOR_EACH_SCREEN({\n   90 |         if (!dri3_screen_can_one_point_one(walkScreen)) {\n   91 |             reply.minorVersion = 0;\n   92 |             break;\n   93 |         }\n   94 |         if (!dri3_screen_can_one_point_two(walkScreen)) {\n   95 |             reply.minorVersion = 1;\n   96 |             break;\n   97 |         }\n   98 |         if (!dri3_screen_can_one_point_four(walkScreen)) {\n   99 |             reply.minorVersion = 2;\n  100 |             break;\n  101 |         } else {\n  102 |             reply.minorVersion = 4;\n  103 |             break;\n  104 |         }\n  105 |     });\n  106 | \n  107 |     DIX_FOR_EACH_GPU_SCREEN({\n  108 |         if (!dri3_screen_can_one_point_one(walkScreen)) {\n  109 |             reply.minorVersion = 0;\n  110 |             break;\n  111 |         }\n  112 |         if (!dri3_screen_can_one_point_two(walkScreen)) {\n  113 |             reply.minorVersion = 1;\n  114 |             break;\n  115 |         }\n  116 |         if (!dri3_screen_can_one_point_four(walkScreen)) {\n  117 |             reply.minorVersion = 2;\n  118 |             break;\n  119 |         } else {\n  120 |             reply.minorVersion = 4;\n  121 |             break;\n  122 |         }\n  123 |     });","lines":36,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dri3/dri3_request.c#L88-L123"}]},{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In __glXDRIscreenCreateDrawable() (DRI2 path), after DRI2CreateDrawable2 succeeds, createNewDrawable() is called to create the DRI drawable but the return value is stored in private->driDrawable without any NULL check. If the driver returns NULL, the function returns &private->base with a NULL driDrawable. All subsequent operations (swapBuffers, waitGL, waitX, destroy) dereference private->driDrawable unconditionally, causing a NULL pointer dereference.","fix":"Check the return value of createNewDrawable. If it is NULL, call FreeResource(private->dri2_id, FALSE), __glXDrawableRelease(), free(private), and return NULL.","locations":[{"ref":"Xext/glx/glx_dri/glxdri2.c:626-630","code":"  626 |     private->driDrawable =\n  627 |         (*driScreen->dri2->createNewDrawable) (driScreen->driScreen,\n  628 |                                                config->driConfig, private);\n  629 | \n  630 |     return &private->base;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glx_dri/glxdri2.c#L626-L630"}]},{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In glxdriswrast.c __glXDRIscreenCreateContext(), when core->createNewContext() returns NULL (e.g. out of memory), the function returns &context->base with context->driContext == NULL. All vtable callbacks (makeCurrent, loseCurrent, copy, destroy) then unconditionally dereference context->driContext, causing a NULL pointer dereference. By contrast, the DRI2 path correctly checks for NULL and frees the context.","fix":"After the createNewContext call, check if context->driContext is NULL; if so, free(context) and return NULL, mirroring the check done in the DRI2 path (glxdri2.c:565-568).","locations":[{"ref":"Xext/glx/glx_dri/glxdriswrast.c:233-237","code":"  233 |     context->driContext =\n  234 |         (*core->createNewContext) (screen->driScreen, driConfig, driShare,\n  235 |                                    context);\n  236 | \n  237 |     return &context->base;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glx_dri/glxdriswrast.c#L233-L237"}]},{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In __glXDRIscreenCreateDrawable() (swrast path), createNewDrawable() is called but its return value stored in private->driDrawable is never checked for NULL. If the driver returns NULL, the function returns &private->base with a NULL driDrawable and subsequent use (swapBuffers, destroy) will dereference it.","fix":"After the createNewDrawable call, check private->driDrawable != NULL; if NULL, call __glXDrawableRelease(), free(private), and return NULL.","locations":[{"ref":"Xext/glx/glx_dri/glxdriswrast.c:266-270","code":"  266 |     private->driDrawable =\n  267 |         (*driScreen->swrast->createNewDrawable) (driScreen->driScreen,\n  268 |                                                  config->driConfig, private);\n  269 | \n  270 |     return &private->base;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glx_dri/glxdriswrast.c#L266-L270"}]},{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"DoGetDrawableAttributes() accesses pGlxDraw->config->fbconfigID at line 1867 without guarding against a NULL config. With GLX_EXT_no_config_context enabled (which both DRI2 and swrast enable), a context can be created without an fbconfig and can then be bound to a drawable created under that context. If such a drawable's config pointer is NULL, the dereference is a NULL pointer dereference.","fix":"Wrap the ATTRIB(GLX_FBCONFIG_ID, ...) line in a check: only emit the attribute when pGlxDraw->config != NULL.","locations":[{"ref":"Xext/glx/glxcmds.c:1862-1868","code":" 1862 |     if (pGlxDraw) {\n 1863 |         ATTRIB(GLX_TEXTURE_TARGET_EXT,\n 1864 |                pGlxDraw->target == GL_TEXTURE_2D ?\n 1865 |                 GLX_TEXTURE_2D_EXT : GLX_TEXTURE_RECTANGLE_EXT);\n 1866 |         ATTRIB(GLX_EVENT_MASK, pGlxDraw->eventMask);\n 1867 |         ATTRIB(GLX_FBCONFIG_ID, pGlxDraw->config->fbconfigID);\n 1868 |         if (pGlxDraw->type == GLX_DRAWABLE_PBUFFER) {","lines":7,"link":"https://github.com/X11Li "LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"In __glXDisp_Map2d (render2.c:141), the guard for the __GLX_ALIGN64 memmove checks 'vorder < 0 ||\nuorder < 0 || k < 0'. This is weaker than the swap variant (__glXDispSwap_Map2d, render2swap.c:187)\nwhich checks 'vorder <= 0 || uorder <= 0 || k < 0'. The non-swap variant permits order == 0 which\nmeans zero control points; compsize becomes 0, but glMap2d is subsequently called with order = 0\nproducing a GL error that could have been avoided. More importantly the inconsistency with the swap\nvariant is a maintenance hazard.","fix":"Change render2.c line 141 from 'vorder < 0 || uorder < 0 || k < 0' to 'vorder <= 0 || uorder <= 0 || k < 0'.","locations":[{"ref":"Xext/glx/render2.c:141","code":"  141 |     if (vorder < 0 || uorder < 0 || k < 0) {","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/render2.c#L141"},{"ref":"Xext/glx/render2swap.c:187","code":"  187 |     if (vorder <= 0 || uorder <= 0 || k < 0) {","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/render2swap.c#L187"}]},{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In __glXImageSize() (rensize.c), for the GL_BITMAP path, `rowSize = bits_to_bytes(groupsPerRow)` is checked for < 0, but then `rowSize += alignment - padding` is applied without overflow protection. Additionally, the return `safe_mul(safe_add(h, skipRows), rowSize)` does not guard against rowSize having overflowed before reaching safe_mul. This mirrors the non-bitmap path issue but is a separate code path.","fix":"Add overflow check before the padding addition: `if (padding && rowSize > INT_MAX - (alignment - padding)) return -1; rowSize += alignment - padding;`","locations":[{"ref":"Xext/glx/rensize.c:207-215","code":"  207 |         rowSize = bits_to_bytes(  |     image1len = __GLX_PAD(image1len);\n   60 | \n   61 |     glSeparableFilter2D(hdr->target, hdr->internalformat, hdr->width,\n   62 |                         hdr->height, hdr->format, hdr->type,\n   63 |                         ((GLubyte *) hdr + hdrlen),\n   64 |                         ((GLubyte *) hdr + hdrlen + image1len));","lines":9,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/renderpix.c#L56-L64"}]},{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"hookResourceAccess (hook-resource.c) accesses `subj->ns->allowTransparency`\nat line 35 inside the `DixCreateAccess` branch without first confirming that\n`subj` is non-NULL. The serverClient check at line 28 uses `param->client ==\nserverClient`, not `subj != NULL`, so if `subj` is NULL (which XNS_HOOK_HEAD\nallows when client is NULL) and `param->client != serverClient`, execution\nreaches line 35 and dereferences NULL.","fix":"Add a NULL guard for `subj` near the top of hookResourceAccess, before the transparency check.","locations":[{"ref":"Xext/namespace/hook-resource.c:28-38","code":"   28 |     if (param->client == serverClient)\n   29 |         goto pass;\n   30 | \n   31 |     // special filtering for windows: block transparency for untrusted clients\n   32 |     if (param->rtype == X11_RESTYPE_WINDOW) {\n   33 |         WindowPtr pWindow = (WindowPtr) param->res;\n   34 |         if (param->access_mode & DixCreateAccess) {\n   35 |             if (!subj->ns->allowTransparency) {\n   36 |                 pWindow->forcedBG = TRUE;\n   37 |             }\n   38 |         }","lines":11,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-resource.c#L28-L38"}]},{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"hookSelectionFilter (hook-selection.c) passes `origSelectionName` (the return\nvalue of `NameForAtom`) directly to `snprintf` as a `%s` argument at line 43\nwithout checking for NULL. `NameForAtom` returns NULL (integer 0) for invalid\nor out-of-range atoms. Passing NULL to `%s` in snprintf is undefined behavior\n(typically crashes or prints \"(null)\" and produces a wrong atom name, breaking\nnamespace isolation silently).","fix":"Check `if (!origSelectionName) return;` after line 40 before using it in snprintf.","locations":[{"ref":"Xext/namespace/hook-selection.c:40-43","code":"   40 |     const char *origSelectionName = NameForAtom(param->selection);\n   41 | \n   42 |     char selname[PATH_MAX] = { 0 };\n   43 |     snprintf(selname, sizeof(selname)-1, \"<%s>%s\", subj->ns->name, origSelectionName);","lines":4,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-selection.c#L40-L43"}]},{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"hookSelectionFilter (hook-selection.c) builds the namespaced selection name into\na stack buffer of `PATH_MAX` bytes (line 42). X atom names are limited only by\nthe X11 request size (CARD16 nbytes, so up to 65535 bytes), which far exceeds\nPATH_MAX (typically 4096). A client can intern a very long atom name and use it\nas a selection; the namespaced form `<ns>LONGNAME` would be silently truncated by\nsnprintf, producing a mangled atom that does not match the server-internal\nnamespaced atom. This breaks namespace selection isolation without error,\nallowing the selection operation to appear to succeed but be mis-routed.","fix":"Allocate the buffer dynamically using the actual lengths of the namespace name and the selection atom name, or validate that the combined length fits before constructing the string.","locations":[{"ref":"Xext/namespace/hook-selection.c:42-44","code":"   42 |     char selname[PATH_MAX] = { 0 };\n   43 |     snprintf(selname, sizeof(selname)-1, \"<%s>%s\", subj->ns->name, origSelectionName);\n   44 |     Atom realSelection = dixAddAtom(selname);","lines":3,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-selection.c#L42-L44"}]},{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"hookServerAccess (hook-server.c) blocks ALL X request opcodes not explicitly\nwhitelisted (X_ListFonts, X_ListFontsWithInfo) with BadAccess. Only X_GrabServer\nis explicitly rejected by name; every other opcode falls through to the\n`XNS_HOOK_LOG` + `reject:` path. The log message at line 29 says \"BLOCKED access\nto server configuration request\" for all these cases, but the ServerAccessCallback\nis fired for many non-configuration requests (e.g., DixReadAccess on font lists).\nAny X opcode that legitimately needs a ServerAccessCallback check (such as font\nqueries not yet whitelisted) is rejected with no meaningful error to the caller,\nbreaking legitimate non-configuration server access silently.","fix":"Add a default `goto pass;` case inside the switch (or after the switch before the log) so only explicitly denied operations are rejected. Review which access_mode values warrant a block.","locations":[{"ref":"Xext/namespace/hook-server.c:20-34","code":"   20 |     switch (client->majorOp) {\n   21 |         case X_ListFonts:\n   22 |         case X_ListFontsWithInfo:\n   23 |             goto pass;\n   24 | \n   25 |         case X_GrabServer:\n   26 |             goto reject;\n   27 |     }\n   28 | \n   29 |     XNS_HOOK_LOG(\"BLOCKED access to server configuration request %s\\n\",\n   30 |         LookupRequestName(client->majorOp, client->minorOp));\n   31 | \n   32 | reject:\n   33 |     param->status = BadAccess;\n   34 |     return;","lines":15,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-server.c#L20-L34"}]},{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"compConfigNotify() declares 'Bool ret = 0' (line 715) and then uses 'if (ret) return ret' (line\n726-727) to propagate the error code from the chained ConfigNotify. This works by accident\nbecause Bool is typically int and Success is 0, but returning a Bool where an int error code\nis expected is semantically wrong: if the underlying ConfigNotify returns a nonzero error code,\n'ret' is coerced to 1 (TRUE) and that value 1 is returned as the X error code, which may not\nbe the correct error (e.g. BadAlloc is 11, not 1).","fix":"Change 'Bool ret = 0' to 'int ret = Success' so the actual error code is propagated without truncation.","locations":[{"ref":"Xext/composite/compwindow.c:715-727","code":"  715 |     Bool ret = 0;\n  716 |     WindowPtr pParent = pWin->parent;\n  717 |     int draw_x, draw_y;\n  718 |     Bool alloc_ret;\n  719 | \n  720 |     if (cs->ConfigNotify) {\n  721 |         pScreen->ConfigNotify = cs->ConfigNotify;\n  722 |         ret = (*pScreen->ConfigNotify) (pWin, x, y, w, h, bw, pSib);\n  723 |         cs->ConfigNotify = pScreen->ConfigNotify;\n  724 |         pScreen->ConfigNotify = compConfigNotify;\n  725 | \n  726 |         if (ret)\n  727 |             return ret;","lines":13,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/composite/compwindow.c#L715-L727"}]},{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"ProcDPMSCapable() always returns `capable = TRUE` regardless of whether any screen actually supports DPMS. The extension is only registered when DPMSSupported() returns TRUE, so in practice this is consistent - but if the capability changes at runtime (screens are added/removed), the reply would be stale. More importantly, the reply is hardcoded rather than calling DPMSSupported() dynamically.","fix":"Change the reply to `capable = DPMSSupported()` so it reflects the actual current state rather than always returning TRUE.","locations":[{"ref":"Xext/dpms/dpms.c:252-261","code":"  252 | ProcDPMSCapable(ClientPtr client)\n  253 | {\n  254 |     X_REQUEST_HEAD_STRUCT(xDPMSCapableReq);\n  255 | \n  256 |     xDPMSCapableReply reply = {\n  257 |         .capable = TRUE\n  258 |     };\n  259 | \n  260 |     return X_SEND_REPLY_SIMPLE(client, reply);\n  261 | }","lines":10,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dpms/dpms.c#L252-L261"}]},{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In DRI2CanFlip(), the condition `pDraw->x != pWinPixmap->screen_x` checks that the drawable's x matches the pixmap's screen_x. However, the preceding condition already checked `pDraw->x != 0`, so this second check is partially redundant. More importantly, the check combines `pDraw->x != 0 || pDraw->x != pWinPixmap->screen_x` which evaluates to `pDraw->x != 0` whenever screen_x is also 0 (the common case) and to TRUE whenever they differ. The logic intent is to require both `x == 0` AND `x == screen_x`, but since both are checked against 0 implicitly, the combined condition is overly broad for non-zero screen_x origins.","fix":"The condition is logically correct for the zero-origin common case but the double-check of x/y against 0 and then against screen_x/screen_y is redundant. Simplify to just `pDraw->x != pWinPixmap->screen_x || pDraw->y != pWinPixmap->screen_y` since that subsumes the `!= 0` checks when screen_x/y are 0.","locations":[{"ref":"Xext/dri2/dri2.c:917-920","code":"  917 |     if (pDraw->x != 0 || pDraw->y != 0 ||\n  918 |         pDraw->x != pWinPixmap->screen_x || pDraw->y != pWinPixmap->screen_y ||\n  919 |         pDraw->width != pWinPixmap->drawable.width ||\n  920 |         pDraw->height != pWinPixmap->drawable.height)","lines":4,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dri2/dri2.c#L917-L920"}]},{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In __glXDisp_SwapBuffers(), pGlxDraw->type is compared against DRAWABLE_WINDOW (the X drawable type constant, value 0 from pixmap.h) instead of GLX_DRAWABLE_WINDOW (the GLX-private enum, also value 0 from glxdrawable.h). While these constants happen to share the same numeric value today, mixing the two enumerations is semantically wrong and fragile.","fix":"Change 'pGlxDraw->type == DRAWABLE_WINDOW' to 'pGlxDraw->type == GLX_DRAWABLE_WINDOW' to use the correct enum namespace.","locations":[{"ref":"Xext/glx/glxcmds.c:1628","code":" 1628 |     if (pGlxDraw->type == DRAWABLE_WINDOW &&","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxcmds.c#L1628"}]},{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"__glXRemoveFromContextList is missing a break after it removes cx from the list. After executing `prev->next = c->next` the loop continues, setting prev = cx (the just-removed, possibly-freed-later element) and iterating the remaining nodes. Since cx is unique in the list this does not corrupt state, but it wastes iterations and leaves prev dangling for the rest of the loop body.","fix":"Add `break;` immediately after `prev->next = c->next;` on line 161 to stop scanning once the element is found and removed.","locations":[{"ref":"Xext/glx/glxext.c:155-165","code":"  155 |     if (cx == glxAllContexts)\n  156 |         glxAllContexts = cx->next;\n  157 |     else {\n  158 |         prev = glxAllContexts;\n  159 |         for (c = glxAllContexts; c; c = c->next) {\n  160 |             if (c == cx)\n  161 |                 prev->next = c->next;\n  162 |             prev = c;\n  163 |         }\n  164 |     }\n  165 | }","lines":11,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxext.c#L155-L165"}]},{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"The global `static GLboolean errorOccured` in glxext.c is process-global state used to communicate GL errors between `__glXErrorCallBack` and callers in singlepix.c. There is no re-entrancy guard: if a GL call that triggers the callback happens to be interleaved (or if the callback fires during a different client's request via a nested dispatch), the flag can be spuriously cleared or read by the wrong caller. The misspelling 'Occured' (one 'r') is also inconsistent with the English word 'occurred'.","fix":"The global-flag pattern is inherently fragile. At minimum rename to `errorOccurred` for clarity. A more robust fix would pass an error-context pointer through the GL error callback registration rather than using a global.","locations":[{"ref":"Xext/glx/glxext.c:209-235","code":"  209 | static GLboolean errorOccured = GL_FALSE;\n  210 | \n  211 | /*\n  212 | ** The GL was will call this routine if an error occurs.\n  213 | */\n  214 | void\n  215 | __glXErrorCallBack(GLenum code)\n  216 | {\n  217 |     errorOccured = GL_TRUE;\n  218 | }\n  219 | \n  220 | /*\n  221 | ** Clear the error flag before calling the GL command.\n  222 | */\n  223 | void\n  224 | __glXClearErrorOccured(void)\n  225 | {\n  226 |     errorOccured = GL_FALSE;\n  227 | }\n  228 | \n  229 | /*\n  230 | ** Check if the GL command caused an error.\n  231 | */\n  232 | GLboolean\n  233 | __glXErrorOccured(void)\n  234 | {\n  235 |     return errorOccured;","lines":27,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxext.c#L209-L235"},{"ref":"Xext/glx/glxext.h:60-62","code":"   60 | extern void __glXErrorCallBack(GLenum code);\n   61 | extern void __glXClearErrorOccured(void);\n   62 | extern GLboolean __glXErrorOccured(void);","lines":3,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxext.h#L60-L62"}]},{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In xorgGlxThunkRequest, when `resource` is 0 (i.e. the request is not a resource-creation request - including all destroy and query cases), the tail `if (ret != Success) glxServer.removeXIDMap(resource)` unconditionally calls `removeXIDMap(0)`. For the X_GLXvop_DestroyGLXPbufferSGIX case in particular, a failure from forwardRequest means the pbuffer's XID map entry was not removed (the success-path removal at line 439 was not reached), yet the cleanup call uses XID 0 instead of the actual pbuffer XID. The pbuffer mapping leaks on failure.","fix":"For the Destroy case, track the pbuffer XID separately and call `glxServer.removeXIDMap(pbufferXid)` on failure, just as the success path does. Guard the final `removeXIDMap(resource)` with `if (resource)` to avoid the unnecessary removeXIDMap(0) for non-create paths.","locations":[{"ref":"Xext/glx/glxext.c:437-445","code":"  437 |     if (ret == Success && vendorCode == X_GLXvop_DestroyGLXPbufferSGIX) {\n  438 |         xGLXDestroyGLXPbufferSGIXReq *req = (void *)stuff;\n  439 |         glxServer.removeXIDMap(maybe_swap32(client, req->pbuffer));\n  440 |     }\n  441 | \n  442 |     if (ret != Success)\n  443 |         glxServer.removeXIDMap(resource);\n  444 | \n  445 |     return ret;","lines":9,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxext.c#L437-L445"}]},{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"__glXTexImage3DReqSize (indirect_reqsize.c:571-572) returns 0 when the CARD32 field at pc+76 is\nnon-zero (the 'null image' flag). This correctly signals 'no pixel data'. However the caller\n(__glXGetProtocolSizeData / the render dispatch loop) treats a return of 0 from the size function\nas 'variable part has zero bytes', not as 'this variant is different from the fixed-size entry'.\nThe fixed-size entry for TexImage3D in Render_size_table[282] is {84, 48} (84 fixed bytes, size\nfunction index 48). If the size function returns 0 for the null-image variant, the total validated\nlength is 84 bytes, which is correct. But the comment at pc+76 is not documented; future maintainers\nmay not realize that returning 0 here has a special meaning different from an error.","fix":"Add a comment explaining that returning 0 here means 'no variable data' for the null-image fast path, not an error.","locations":[{"ref":"Xext/glx/indirect_reqsize.c:571-572","code":"  571 |     if (*(CARD32 *) (pc + 76))\n  572 |         return 0;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_reqsize.c#L571-L572"}]},{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In __glXDispSwap_DrawArrays (render2swap.c:300-309), the first loop decodes numVals and datatype\nfrom compHeader by reading the fields and calling swapl on local copies. The stride is accumulated\nfrom these swapped locals. The second loop (lines 315-371) re-reads the same fields from compHeader\nand calls swapl again, getting the same (still unswapped in memory) values. This is redundant but\ncorrect. However it means the in-memory compHeader fields are never actually byte-swapped, so if\nany other code were to read them after this function, they would still be in wire-byte order.\nBy contrast, the hdr header fields (numVertexes, numComponents, primType) are swapped in-place via\npointer alias (swapl(&numVertexes) but numVertexes is a local copy - still not in-place). The code\nis correct but confusing and inconsistent: some fields appear to be swapped in-place (they are not;\nswapl operates on local copies) and the double-read pattern is redundant.","fix":"Swap compHeader fields in-place once, or store the swapped values in local variables and reuse them in the second loop to avoid re-reading and re-swapping.","locations":[{"ref":"Xext/glx/render2swap.c:300-309","code":"  300 |     for (i = 0; i < numComponents; i++) {\n  301 |         GLenum datatype = compHeader[i].datatype;\n  302 |         GLint numVals = compHeader[i].numVals;\n  303 |         GLenum component = compHeader[i].component;\n  304 | \n  305 |         swapl(&datatype);\n  306 |         swapl(&numVals);\n  307 |         swapl(&component);\n  308 | \n  309 |         stride += __GLX_PAD(numVals * __glXTypeSize(datatype));","lines":10,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/render2swap.c#L300-L309"},{"ref":"Xext/glx/render2swap.c:315-372","code":"  315 |     for (i = 0; i < numComponents; i++) {\n  316 |         GLenum datatype = compHeader[i].datatype;\n  317 |         GLint numVals = compHeader[i].numVals;\n  318 |         GLenum component = compHeader[i].component;\n  319 | \n  320 |         swapl(&datatype);\n  321 |         swapl(&numVals);\n  322 |         swapl(&component);\n  323 | \n  324 |         swapArray(numVals, datatype, stride, numVertexes, pc);\n  325 | \n  326 |         switch (component) {\n  327 |         case GL_VERTEX_ARRAY:\n  328 |             glEnableClientState(GL_VERTEX_ARRAY);\n  329 |             glVertexPointer(numVals, datatype, stride, pc);\n  330 |             break;\n  331 |         case GL_NORMAL_ARRAY:\n  332 |             glEnableClientState(GL_NORMAL_ARRAY);\n  333 |             glNormalPointer(datatype, stride, pc);\n  334 |             break;\n  335 |         case GL_COLOR_ARRAY:\n  336 |             glEnableClientState(GL_COLOR_ARRAY);\n  337 |             glColorPointer(numVals, datatype, stride, pc);\n  338 |             break;\n  339 |         case GL_INDEX_ARRAY:\n  340 |             glEnableClientState(GL_INDEX_ARRAY);\n  341 |             glIndexPointer(datatype, stride, pc);\n  342 |             break;\n  343 |         case GL_TEXTURE_COORD_ARRAY:\n  344 |             glEnableClientState(GL_TEXTURE_COORD_ARRAY);\n  345 |             glTexCoordPointer(numVals, datatype, stride, pc);\n  346 |             break;\n  347 |         case GL_EDGE_FLAG_ARRAY:\n  348 |             glEnableClientState(GL_EDGE_FLAG_ARRAY);\n  349 |             glEdgeFlagPointer(stride, (const GLboolean *) pc);\n  350 |             break;\n  351 |         case GL_SECONDARY_COLOR_ARRAY:\n  352 |         {\n  353 |             PFNGLSECONDARYCOLORPOINTERPROC SecondaryColorPointerEXT =\n  354 |                 __glGetProcAddress(\"glSecondaryColorPointerEXT\");\n  355 |             glEnableClientState(GL_SECONDARY_COLOR_ARRAY);\n  356 |             SecondaryColorPointerEXT(numVals, datatype, stride, pc);\n  357 |             break;\n  358 |         }\n  359 |         case GL_FOG_COORD_ARRAY:\n  360 |         {\n  361 |             PFNGLFOGCOORDPOINTERPROC FogCoordPointerEXT =\n  362 |                 __glGetProcAddress(\"glFogCoordPointerEXT\");\n  363 |             glEnableClientState(GL_FOG_COORD_ARRAY);\n  364 |             FogCoordPointerEXT(datatype, stride, pc);\n  365 |             break;\n  366 |         }\n  367 |         default:\n  368 |             break;\n  369 |         }\n  370 | \n  371 |         pc += __GLX_PAD(numVals * __glXTypeSize(datatype));\n  372 |     }","lines":58,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/render2swap.c#L315-L372"}]},{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In single2.c __glXDisp_RenderMode(), the non-swapped path does not call any X_REPLY_FIELD_CARD32() markers for the reply fields (retval, size, newMode), while the swap counterpart single2swap.c __glXDispSwap_RenderMode() explicitly marks all three fields with X_REPLY_FIELD_CARD32(). This asymmetry is suspicious: the non-swap path relies on the framework sending the reply fields without per-field byte-swapping annotations. If the reply framework requires these annotations to work correctly for all client endiannesses, the non-swap path may send incorrectly formatted replies to native-endian clients.","fix":"Add X_REPLY_FIELD_CARD32(retval), X_REPLY_FIELD_CARD32(size), and X_REPLY_FIELD_CARD32(newMode) before X_SEND_REPLY_WITH_RPCBUF in __glXDisp_RenderMode(), matching the swap variant.","locations":[{"ref":"Xext/glx/single2.c:200-211","code":"  200 |     /*\n  201 |      ** First reply is the number of elements returned in the feedback or\n  202 |      ** selection array, as per the API for glRenderMode itself.\n  203 |      */\n  204 |  noChangeAllowed:;\n  205 |     xGLXRenderModeReply reply = {\n  206 |         .retval = retval,\n  207 |         .size = nitems,\n  208 |         .newMode = newMode\n  209 |     };\n  210 | \n  211 |     return X_SEND_REPLY_WITH_RPCBUF(client, reply, rpcbuf);","lines":12,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/single2.c#L200-L211"},{"ref":"Xext/glx/single2swap.c:207-217","code":"  207 |  noChangeAllowed:;\n  208 |     xGLXRenderModeReply reply = {\n  209 |         .retval = retval,\n  210 |         .size = nitems,\n  211 |         .newMode = newMode\n  212 |     };\n  213 |     X_REPLY_FIELD_CARD32(retval);\n  214 |     X_REPLY_FIELD_CARD32(size);\n  215 |     X_REPLY_FIELD_CARD32(newMode);\n  216 | \n  217 |     return X_SEND_REPLY_WITH_RPCBUF(client, reply, rpcbuf);","lines":11,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/single2swap.c#L207-L217"}]},{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"ht_destroy() in hashtable.c does not accept NULL and immediately dereferences the ht pointer (`ht->bucketBits`). GlxDispatchReset() in vndcmds.c calls ht_destroy(vendorPrivHash) and then sets vendorPrivHash = NULL. If GlxDispatchReset were ever called a second time before GlxDispatchInit re-creates the hash (e.g., by code added in the future), it would crash. The API contract is inconsistent with the pattern of the NULL-safe callers (vendorPrivHash starts as NULL).","fix":"Add a NULL guard at the top of ht_destroy: `if (!ht) return;`","locations":[{"ref":"Xext/hashtable.c:73-88","code":"   73 | ht_destroy(HashTable ht)\n   74 | {\n   75 |     int c;\n   76 |     BucketPtr it, tmp;\n   77 |     int numBuckets = 1 << ht->bucketBits;\n   78 |     for (c = 0; c < numBuckets; ++c) {\n   79 |         xorg_list_for_each_entry_safe(it, tmp, &ht->buckets[c], l) {\n   80 |             xorg_list_del(&it->l);\n   81 |             free(it->key);\n   82 |             free(it->data);\n   83 |             free(it);\n   84 |         }\n   85 |     }\n   86 |     free(ht->buckets);\n   87 |     free(ht);\n   88 | }","lines":16,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/hashtable.c#L73-L88"},{"ref":"Xext/glx/vndcmds.c:450-456","code":"  450 | void GlxDispatchReset(void)\n  451 | {\n  452 |     memset(dispatchFuncs, 0, sizeof(dispatchFuncs));\n  453 | \n  454 |     ht_destroy(vendorPrivHash);\n  455 |     vendorPrivHash = NULL;\n  456 | }","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/vndcmds.c#L450-L456"}]},{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"In config.c select_ns(), the newly allocated Xnamespace struct's `auth_tokens` list head is left as zero-initialized memory (from calloc). While xorg_list_append() calls __xorg_list_autoinit() and can handle this, xorg_list_for_each_entry() (used in XnsFindByAuth and config logging) does not auto-init and iterating an uninitialized list head is undefined if the autoinit path is not taken. This is fragile and depends on calloc zeroing matching the autoinit sentinel.","fix":"Call xorg_list_init(&newns->auth_tokens) explicitly after calloc to make the initialization intent clear and safe regardless of list iteration implementation.","locations":[{"ref":"Xext/namespace/config.c:40-43","code":"   40 |     struct Xnamespace *newns = calloc(1, sizeof(struct Xnamespace));\n   41 |     newns->name = strdup(name);\n   42 |     xorg_list_append(&newns->entry, &ns_list);\n   43 |     return newns;","lines":4,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/config.c#L40-L43"}]},{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","easy":true,"description":"PanoramiXExtensionInit (panoramiX.c) stores `masterScreen->CreateGC` into\n`pScreenPriv->CreateGC` for every screen (line 472), not each screen's own\n`CreateGC`. When XineramaCreateGC later fires for a non-master screen, it\nrestores the GC's screen CreateGC pointer to masterScreen's function and calls\nit, invoking the wrong screen's CreateGC. If secondary screens have different\nCreateGC implementations (e.g., different hardware drivers), this silently calls\nthe wrong driver function.","fix":"Change line 472 to `pScreenPriv->CreateGC = walkScreen->CreateGC;` so each screen's original CreateGC is saved and later restored correctly.","locations":[{"ref":"Xext/panoramiX/panoramiX.c:462-474","code":"  462 |     XINERAMA_FOR_EACH_SCREEN_BACKWARD({\n  463 |         PanoramiXScreenPtr pScreenPriv = calloc(1, sizeof(PanoramiXScreenRec));\n  464 |         dixSetPrivate(&walkScreen->devPrivates, &PanoramiXScreenKeyRec,\n  465 |                       pScreenPriv);\n  466 |         if (!pScreenPriv) {\n  467 |             noPanoramiXExtension = TRUE;\n  468 |             return;\n  469 |         }\n  470 | \n  471 |         dixScreenHookClose(walkScreen, XineramaCloseScreen);\n  472 |         pScreenPriv->CreateGC = masterScreen->CreateGC;\n  473 |         walkScreen->CreateGC = XineramaCreateGC;\n  474 |     });","lines":13,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/panoramiX/panoramiX.c#L462-L474"},{"ref":"Xext/panoramiX/panoramiX.c:166-189","code":"  166 | XineramaCreateGC(GCPtr pGC)\n  167 | {\n  168 |     ScreenPtr pScreen = pGC->pScreen;\n  169 |     PanoramiXScreenPtr pScreenPriv = (PanoramiXScreenPtr)\n  170 |         dixLookupPrivate(&pScreen->devPrivates, &PanoramiXScreenKeyRec);\n  171 |     Bool ret;\n  172 | \n  173 |     pScreen->CreateGC = pScreenPriv->CreateGC;\n  174 |     if ((ret = (*pScreen->CreateGC) (pGC))) {\n  175 |         PanoramiXGCPtr pGCPriv = (PanoramiXGCPtr)\n  176 |             dixLookupPrivate(&pGC->devPrivates, &PanoramiXGCKeyRec);\n  177 | \n  178 |         pGCPriv->wrapFuncs = pGC->funcs;\n  179 |         pGC->funcs = &XineramaGCFuncs;\n  180 | \n  181 |         pGCPriv->clipOrg.x = pGC->clipOrg.x;\n  182 |         pGCPriv->clipOrg.y = pGC->clipOrg.y;\n  183 |         pGCPriv->patOrg.x = pGC->patOrg.x;\n  184 |         pGCPriv->patOrg.y = pGC->patOrg.y;\n  185 |     }\n  186 |     pScreen->CreateGC = XineramaCreateGC;\n  187 | \n  188 |     return ret;\n  189 | }","lines":24,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/panoramiX/panoramiX.c#L166-L189"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"critical","easy":true,"description":"__glXDisp_PrioritizeTextures passes the same pointer (pc + 4) for both the 'textures' and 'priorities' arrays. The GLX protocol lays out the textures array at pc+4 followed by the priorities array at pc + 4 + n*4, but the code reads both from pc+4. The effect is that the texture priorities are silently set from the texture names array, corrupting GL state, and the actual priority data from the client is never consumed.","fix":"Change the second argument to use the correct offset: (const GLclampf *) (pc + 4 + n * 4).","locations":[{"ref":"Xext/glx/indirect_dispatch.c:2679-2686","code":" 2679 | __glXDisp_PrioritizeTextures(GLbyte * pc)\n 2680 | {\n 2681 |     const GLsizei n = *(GLsizei *) (pc + 0);\n 2682 | \n 2683 |     glPrioritizeTextures(n,\n 2684 |                          (const GLuint *) (pc + 4),\n 2685 |                          (const GLclampf *) (pc + 4));\n 2686 | }","lines":8,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L2679-L2686"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","easy":true,"description":"In glxdricommon.c attribMap, __DRI_ATTRIB_TRANSPARENT_INDEX_VALUE is mapped to the 'transparentPixel' field instead of 'transparentIndex'. There are two separate fields in __GLXconfig: transparentPixel (at offset 70) and transparentIndex (at offset 73). The DRI transparent type goes to transparentPixel correctly, but the index value is silently written to the wrong field, corrupting transparentPixel a second time instead of populating transparentIndex.","fix":"Change __ATTRIB(__DRI_ATTRIB_TRANSPARENT_INDEX_VALUE, transparentPixel) to __ATTRIB(__DRI_ATTRIB_TRANSPARENT_INDEX_VALUE, transparentIndex).","locations":[{"ref":"Xext/glx/glx_dri/glxdricommon.c:70","code":"   70 |         __ATTRIB(__DRI_ATTRIB_TRANSPARENT_INDEX_VALUE, transparentPixel),","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glx_dri/glxdricommon.c#L70"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","easy":true,"description":"PrioritizeTextures passes (pc + 4) as both the textures array and the priorities array, and both bswap_32_array calls use count 0. The priorities should start after the n texture IDs at pc + 4 + n*4. This is present in both the swap and non-swap versions, but is worse here because even the texture IDs are not swapped.","fix":"Pass n to bswap_32_array for the textures array, and compute the priorities pointer as (pc + 4 + n * sizeof(GLuint)), with a separate bswap_32_array call passing n.","locations":[{"ref":"Xext/glx/indirect_dispatch_swap.c:2956-2966","code":" 2956 | void\n 2957 | __glXDispSwap_PrioritizeTextures(GLbyte * pc)\n 2958 | {\n 2959 |     const GLsizei n = (GLsizei) bswap_CARD32(pc + 0);\n 2960 | \n 2961 |     glPrioritizeTextures(n,\n 2962 |                          (const GLuint *) bswap_32_array((uint32_t *) (pc + 4),\n 2963 |                                                          0),\n 2964 |                          (const GLclampf *)\n 2965 |                          bswap_32_array((uint32_t *) (pc + 4), 0));\n 2966 | }","lines":11,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch_swap.c#L2956-L2966"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","easy":true,"description":"In DRI2ExtensionInit(), AddExtension() can return NULL if it fails (e.g., out of memory or too many extensions), but the return value is not checked. The very next line `DRI2EventBase = dri2Extension->eventBase` unconditionally dereferences the pointer, causing a NULL pointer dereference and server crash.","fix":"Add a NULL check after AddExtension(): `if (!dri2Extension) return;` before accessing `dri2Extension->eventBase`.","locations":[{"ref":"Xext/dri2/dri2ext.c:594-602","code":"  594 |     dri2Extension = AddExtension(DRI2_NAME,\n  595 |                                  DRI2NumberEvents,\n  596 |                                  DRI2NumberErrors,\n  597 |                                  ProcDRI2Dispatch,\n  598 |                                  ProcDRI2Dispatch,\n  599 |                                  NULL,\n  600 |                                  StandardMinorOpcode);\n  601 | \n  602 |     DRI2EventBase = dri2Extension->eventBase;","lines":9,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dri2/dri2ext.c#L594-L602"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"dispatch_GLXClientInfo() in vndcmds.c forwards the GLXClientInfo request to every registered vendor library but ignores the return value of each `vendor->glxvc.handleRequest(client)` call. If one vendor returns an error, the loop continues and the function returns Success unconditionally. Errors from vendor processing are silently swallowed.","fix":"Capture the return value: `int ret = vendor->glxvc.handleRequest(client); if (ret != Success) { free(requestCopy); return ret; }` - or at minimum track and return the last non-Success result.","locations":[{"ref":"Xext/glx/vndcmds.c:139-143","code":"  139 |     xorg_list_for_each_entry(vendor, &GlxVendorList, entry) {\n  140 |         vendor->glxvc.handleRequest(client);\n  141 |         // Revert the request buffer back to our copy.\n  142 |         memcpy(client->requestBuffer, requestCopy, requestSize);\n  143 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/vndcmds.c#L139-L143"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","easy":false,"description":"In DamageExtRegister() (damageext.c lines 251-256), when report is TRUE the function casts\npDrawable to WindowPtr unconditionally to access borderClip. The call site in DamageExtCreate()\n(line 282-283) passes (pDrawable->type == DRAWABLE_WINDOW) as the report flag, which means the\ncast is safe in DamageExtCreate. However, the Xinerama path (line 619) calls\nDamageExtRegister(pDrawable, pDamage, walkScreenIdx != 0) where the condition is purely\nindex-based and does not guarantee pDrawable->type == DRAWABLE_WINDOW at all times. If the\ndrawable is a pixmap and walkScreenIdx != 0, the cast to WindowPtr and access to borderClip\nwill read garbage memory.","fix":"Change DamageExtRegister() to check pDrawable->type == DRAWABLE_WINDOW before doing the cast,\nindependent of the report parameter. Or add an assertion / type check in the Xinerama call path.","locations":[{"ref":"Xext/damage/damageext.c:245-257","code":"  245 | static void\n  246 | DamageExtRegister(DrawablePtr pDrawable, DamagePtr pDamage, Bool report)\n  247 | {\n  248 |     DamageSetReportAfterOp(pDamage, TRUE);\n  249 |     DamageRegister(pDrawable, pDamage);\n  250 | \n  251 |     if (report) {\n  252 |         RegionPtr pRegion = &((WindowPtr) pDrawable)->borderClip;\n  253 |         RegionTranslate(pRegion, -pDrawable->x, -pDrawable->y);\n  254 |         DamageReportDamage(pDamage, pRegion);\n  255 |         RegionTranslate(pRegion, pDrawable->x, pDrawable->y);\n  256 |     }\n  257 | }","lines":13,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/damage/damageext.c#L245-L257"},{"ref":"Xext/damage/damageext.c:619","code":"  619 |             DamageExtRegister(pDrawable, pDamage, walkScreenIdx != 0);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/damage/damageext.c#L619"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"ProcDbeSwapBuffers() validates that all windows are unique by doing an O(n^2) nested loop\n(lines 478-483). For large swap lists this is quadratic. While swap lists are typically small\nin practice, this is protocol-controlled input so a malicious or buggy client could pass a\nlarge list.","fix":"Sort the window array before validation to allow an O(n log n) uniqueness check, or use a hash set for O(n) average.","locations":[{"ref":"Xext/doublebuffer/dbe.c:477-483","code":"  477 |         /* Each window must only be specified once - BadMatch. */\n  478 |         for (int j = i + 1; j < nStuff; j++) {\n  479 |             if (dbeSwapInfo[i].window == dbeSwapInfo[j].window) {\n  480 |                 free(swapInfo);\n  481 |                 return BadMatch;\n  482 |             }\n  483 |         }","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/doublebuffer/dbe.c#L477-L483"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"In ProcDbeAllocateBackBufferName(), line 231 writes stuff->buffer into pDbeWindowPriv->IDs[0],\nbut the very next loop (lines 233-234) immediately overwrites all elements of IDs[] with\nDBE_FREE_ID_ELEMENT (value 0). The write on line 231 is a dead store with no observable effect.","fix":"Remove the dead assignment on line 231 (pDbeWindowPriv->IDs[0] = stuff->buffer).","locations":[{"ref":"Xext/doublebuffer/dbe.c:229-234","code":"  229 |         /* Initialize the buffer ID list. */\n  230 |         pDbeWindowPriv->maxAvailableIDs = DBE_INIT_MAX_IDS;\n  231 |         pDbeWindowPriv->IDs[0] = stuff->buffer;\n  232 | \n  233 |         for (int i = 0; i < DBE_INIT_MAX_IDS; i++)\n  234 |             pDbeWindowPriv->IDs[i] = DBE_FREE_ID_ELEMENT;","lines":6,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/doublebuffer/dbe.c#L229-L234"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"In ProcDbeSwapBuffers(), line 425 already returns Success if stuff->n == 0. The inner check\non line 434 (if (stuff->n != 0)) inside the client->swapped branch is therefore always true\nand guards code that would run unconditionally. It is unreachable dead code.","fix":"Remove the redundant 'if (stuff->n != 0)' inner guard on line 434.","locations":[{"ref":"Xext/doublebuffer/dbe.c:425-426","code":"  425 |     if (stuff->n == 0)\n  426 |         return Success;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/doublebuffer/dbe.c#L425-L426"},{"ref":"Xext/doublebuffer/dbe.c:432-443","code":"  432 |     if (client->swapped) {\n  433 |         xDbeSwapInfo *pSwapInfo;\n  434 |         if (stuff->n != 0) {\n  435 |             pSwapInfo = (x t line 1814, leaving only the type and copySubBuffer checks.","locations":[{"ref":"Xext/glx/glxcmds.c:1811-1817","code":" 1811 |     if (!pGlxDraw)\n 1812 |         return error;\n 1813 | \n 1814 |     if (pGlxDraw == NULL ||\n 1815 |         pGlxDraw->type != GLX_DRAWABLE_WINDOW ||\n 1816 |         pGlxDraw->copySubBuffer == NULL)\n 1817 |         return __glXError(GLXBadDrawable);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxcmds.c#L1811-L1817"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"`extern void __glXFlushContextCache(void);` is declared in glxext.h but has no definition anywhere in the codebase and is never called. It is a dead declaration.","fix":"Remove the declaration (and its definition if one is ever found).","locations":[{"ref":"Xext/glx/glxext.h:57","code":"   57 | extern void __glXFlushContextCache(void);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxext.h#L57"}]},{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"`extern RESTYPE __glXClientRes;` is declared in glxserver.h but is never defined in any translation unit and is never referenced in the codebase. It is a stale symbol left over from an older implementation.","fix":"Remove the declaration.","locations":[{"ref":"Xext/glx/glxserver.h:149","code":"  149 | extern RESTYPE __glXClientRes;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxserver.h#L149"}]},{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"In __glXDisp_CallLists the variable 'lists' is initialised on line 92 and then immediately overwritten with the identical expression on line 94. The first assignment is unreachable dead code and suggests a generator artefact or a copy-past (function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible','info'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const HAS_EASY = FINDINGS.some(f => f.easy);
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};

}

  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
