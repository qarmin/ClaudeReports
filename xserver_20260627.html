<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.sev-info    {background:#0c2a2a;color:#5eead4;border-color:#0f766e}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.easy-badge{background:#052e16;color:#86efac;border-color:#16a34a}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>
<body>
<script type="application/json" id="D">[{"id":"SEC_1","type":"security","type_label":"Security","severity":"high","easy":false,"description":"Every dispatch function that resolves a GL entry point via __glGetProcAddress (118 call sites) calls the resulting function pointer immediately without checking whether it is NULL. If the underlying OpenGL implementation does not expose that entry point, __glGetProcAddress returns NULL and the call dereferences a null pointer, crashing the X server. A malicious client that sends a request for one of these commands (e.g., glBeginQuery, glCompressedTexImage1D, glSampleCoverage, glCheckFramebufferStatus, etc.) to a server whose driver lacks the extension can exploit this to trigger a server crash. Functions with a context guard (cx != NULL) still execute the null-pointer call inside the guard, so the guard does not protect against this.","fix":"After each __glGetProcAddress call, check the result for NULL and return an appropriate error (e.g., BadRequest or __glXError(GL_INVALID_OPERATION)) before invoking the function pointer.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:3604-3616","code":" 3604 | __glXDisp_CompressedTexImage1D(GLbyte * pc)\n 3605 | {\n 3606 |     PFNGLCOMPRESSEDTEXIMAGE1DPROC CompressedTexImage1D =\n 3607 |         __glGetProcAddress(\"glCompressedTexImage1D\");\n 3608 |     const GLsizei imageSize = *(GLsizei *) (pc + 20);\n 3609 | \n 3610 |     CompressedTexImage1D(*(GLenum *) (pc + 0),\n 3611 |                          *(GLint *) (pc + 4),\n 3612 |                          *(GLenum *) (pc + 8),\n 3613 |                          *(GLsizei *) (pc + 12),\n 3614 |                          *(GLint *) (pc + 16),\n 3615 |                          imageSize, (const GLvoid *) (pc + 24));\n 3616 | }","lines":13,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L3604-L3616"},{"ref":"Xext/glx/indirect_dispatch.c:3848-3853","code":" 3848 | __glXDisp_BeginQuery(GLbyte * pc)\n 3849 | {\n 3850 |     PFNGLBEGINQUERYPROC BeginQuery = __glGetProcAddress(\"glBeginQuery\");\n 3851 | \n 3852 |     BeginQuery(*(GLenum *) (pc + 0), *(GLuint *) (pc + 4));\n 3853 | }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L3848-L3853"},{"ref":"Xext/glx/indirect_dispatch.c:4025-4028","code":" 4025 |     PFNGLBLENDEQUATIONSEPARATEPROC BlendEquationSeparate =\n 4026 |         __glGetProcAddress(\"glBlendEquationSeparate\");\n 4027 |     BlendEquationSeparate(*(GLenum *) (pc + 0), *(GLenum *) (pc + 4));\n 4028 | }","lines":4,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L4025-L4028"},{"ref":"Xext/glx/indirect_dispatch.c:4546-4563","code":" 4546 | __glXDisp_CheckFramebufferStatus(__GLXclientState * cl, GLbyte * pc)\n 4547 | {\n 4548 |     PFNGLCHECKFRAMEBUFFERSTATUSPROC CheckFramebufferStatus =\n 4549 |         __glGetProcAddress(\"glCheckFramebufferStatus\");\n 4550 |     xGLXVendorPrivateReq *const req = (xGLXVendorPrivateReq *) pc;\n 4551 |     int error;\n 4552 |     __GLXcontext *const cx = __glXForceCurrent(cl, req->contextTag, &error);\n 4553 | \n 4554 |     pc += __GLX_VENDPRIV_HDR_SIZE;\n 4555 |     if (cx != NULL) {\n 4556 |         GLenum retval;\n 4557 | \n 4558 |         retval = CheckFramebufferStatus(*(GLenum *) (pc + 0));\n 4559 |         __glXSendReply(cl->client, dummy_answer, 0, 0, GL_FALSE, retval);\n 4560 |         error = Success;\n 4561 |     }\n 4562 | \n 4563 |     return error;","lines":18,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L4546-L4563"}]},{"id":"SEC_2","type":"security","type_label":"Security","severity":"high","easy":false,"description":"hookPropertyAccess never sets param->status, so it never actually blocks cross-namespace property access. The hook logs the violation but takes no enforcement action. Any client in any namespace can read or write properties on windows owned by clients in other namespaces without restriction.","fix":"Add `param->status = BadAccess;` in the cross-namespace path after deciding to block. Also add a NULL check for `subj` (see related finding) before accessing `subj->ns`.","locations":[{"ref":"Xext/namespace/hook-property.c:23-47","code":"   23 | void hookPropertyAccess(CallbackListPtr *pcbl, void *unused, void *calldata)\n   24 | {\n   25 |     XNS_HOOK_HEAD(XacePropertyAccessRec);\n   26 |     struct XnamespaceClientPriv *obj = XnsClientPriv(dixClientForWindow(param->pWin));\n   27 | \n   28 |     ATOM name = (*param->ppProp)->propertyName;\n   29 | \n   30 |     if (XnsClientSameNS(subj, obj))\n   31 |         return;\n   32 | \n   33 |     if (param->pWin == subj->ns->rootWindow)\n   34 |         return;\n   35 | \n   36 |     if (winIsRoot(param->pWin)) {\n   37 |         XNS_HOOK_LOG(\"window is the screen's root window\\n\");\n   38 |     } else {\n   39 |         XNS_HOOK_LOG(\"not a root window\\n\");\n   40 |     }\n   41 | \n   42 |     XNS_HOOK_LOG(\"access to property %s (atom 0x%x) window 0x%lx of client %d\\n\",\n   43 |         NameForAtom(name),\n   44 |         name,\n   45 |         (unsigned long)param->pWin->drawable.id,\n   46 |         dixClientForWindow(param->pWin)->index);\n   47 | }","lines":25,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/hook-property.c#L23-L47"}]},{"id":"SEC_3","type":"security","type_label":"Security","severity":"medium","easy":false,"description":"In proc_dri3_dispatch(), the `!client->local` check rejecting non-local clients is applied at the top of the dispatch function before processing any opcode. However, proc_dri3_query_version() is also blocked for non-local clients, returning BadMatch. DRI2 extension allows QueryVersion from non-local clients (only the local check gates all other DRI2 ops). Blocking DRI3 QueryVersion from remote clients makes DRI3 unusable for remote X sessions where the client just wants to probe what DRI3 version the server supports, as required by the extension negotiation protocol. While this is intentionally security-restrictive, it deviates from the DRI3 spec's expectation that QueryVersion is always available.","fix":"Move the `!client->local` check inside the switch, exempting `X_DRI3QueryVersion` from the locality restriction (matching how DRI2 handles it in dri2ext.c lines 538-544).","locations":[{"ref":"Xext/dri3/dri3_request.c:651-655","code":"  651 | proc_dri3_dispatch(ClientPtr client)\n  652 | {\n  653 |     REQUEST(xReq);\n  654 |     if (!client->local)\n  655 |         return BadMatch;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dri3/dri3_request.c#L651-L655"}]},{"id":"SEC_4","type":"security","type_label":"Security","severity":"medium","easy":false,"description":"__glXCompressedTexImage1DReqSize, __glXCompressedTexImage2DReqSize, and __glXCompressedTexImage3DReqSize\n(indirect_reqsize.c:613-647) all accept a client-supplied imageSize and return 'safe_pad(imageSize)'\nwithout any upper-bound check. A malicious client can supply a very large imageSize value just below\nINT_MAX which passes safe_pad (since safe_pad detects overflow) but causes the protocol length\nvalidation to accept a packet far larger than any real compressed texture. While safe_pad prevents\nthe arithmetic from overflowing, there is no check that imageSize is sane relative to the texture\ndimensions (which are present in the same packet at pc+12, pc+16, etc.) before the server reads\nimageSize bytes of pixel data from the client connection. The same applies to CompressedTexSubImage3D.","fix":"Add a sanity upper bound for imageSize (e.g. reject if > MAX_COMPRESSED_TEXTURE_SIZE) or cross-validate against the dimensions present in the packet.","locations":[{"ref":"Xext/glx/indirect_reqsize.c:613-659","code":"  613 | int\n  614 | __glXCompressedTexImage1DReqSize(const GLbyte * pc, Bool swap, int reqlen)\n  615 | {\n  616 |     GLsizei imageSize = *(GLsizei *) (pc + 20);\n  617 | \n  618 |     if (swap) {\n  619 |         imageSize = bswap_32(imageSize);\n  620 |     }\n  621 | \n  622 |     return safe_pad(imageSize);\n  623 | }\n  624 | \n  625 | int\n  626 | __glXCompressedTexImage2DReqSize(const GLbyte * pc, Bool swap, int reqlen)\n  627 | {\n  628 |     GLsizei imageSize = *(GLsizei *) (pc + 24);\n  629 | \n  630 |     if (swap) {\n  631 |         imageSize = bswap_32(imageSize);\n  632 |     }\n  633 | \n  634 |     return safe_pad(imageSize);\n  635 | }\n  636 | \n  637 | int\n  638 | __glXCompressedTexImage3DReqSize(const GLbyte * pc, Bool swap, int reqlen)\n  639 | {\n  640 |     GLsizei imageSize = *(GLsizei *) (pc + 28);\n  641 | \n  642 |     if (swap) {\n  643 |         imageSize = bswap_32(imageSize);\n  644 |     }\n  645 | \n  646 |     return safe_pad(imageSize);\n  647 | }\n  648 | \n  649 | int\n  650 | __glXCompressedTexSubImage3DReqSize(const GLbyte * pc, Bool swap, int reqlen)\n  651 | {\n  652 |     GLsizei imageSize = *(GLsizei *) (pc + 36);\n  653 | \n  654 |     if (swap) {\n  655 |         imageSize = bswap_32(imageSize);\n  656 |     }\n  657 | \n  658 |     return safe_pad(imageSize);\n  659 | }","lines":47,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_reqsize.c#L613-L659"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"In compRedirectWindow(), when a new CompWindowRec (cw) is freshly allocated and wired into the\nwindow's devPrivates, and then AddResource() fails for ccw->id (line 207), the function returns\nBadAlloc without cleaning up the newly-created cw. At this point cw is already stored via\ndixSetPrivate() (line 203) and ccw is already prepended to cw->clients (line 205-206), but no\nresource exists to trigger FreeCompositeClientWindow -> compFreeClientWindow on teardown.\nThe cw allocation, its damage object, and the ccw are leaked. Subsequent calls will find cw via\nGetCompWindow() without having the resource they expect.","fix":"When AddResource() fails at line 207, before returning BadAlloc, remove ccw from cw->clients,\nand if cw was newly allocated in this call (i.e., it was NULL before), destroy cw->damage,\nuninit cw->borderClip, clear the devPrivates pointer, and free cw and ccw.","locations":[{"ref":"Xext/composite/compalloc.c:177-208","code":"  177 |     if (!cw) {\n  178 |         cw = calloc(1, sizeof(CompWindowRec));\n  179 |         if (!cw) {\n  180 |             free(ccw);\n  181 |             return BadAlloc;\n  182 |         }\n  183 |         cw->damage = DamageCreate(compReportDamage,\n  184 |                                   compDestroyDamage,\n  185 |                                   DamageReportNonEmpty,\n  186 |                                   FALSE, pWin->drawable.pScreen, pWin);\n  187 |         if (!cw->damage) {\n  188 |             free(ccw);\n  189 |             free(cw);\n  190 |             return BadAlloc;\n  191 |         }\n  192 | \n  193 |         anyMarked = compMarkWindows(pWin, &pLayerWin);\n  194 | \n  195 |         RegionNull(&cw->borderClip);\n  196 |         cw->update = CompositeRedirectAutomatic;\n  197 |         cw->clients = 0;\n  198 |         cw->oldx = COMP_ORIGIN_INVALID;\n  199 |         cw->oldy = COMP_ORIGIN_INVALID;\n  200 |         cw->damageRegistered = FALSE;\n  201 |         cw->damaged = FALSE;\n  202 |         cw->pOldPixmap = NullPixmap;\n  203 |         dixSetPrivate(&pWin->devPrivates, CompWindowPrivateKey, cw);\n  204 |     }\n  205 |     ccw->next = cw->clients;\n  206 |     cw->clients = ccw;\n  207 |     if (!AddResource(ccw->id, CompositeClientWindowType, pWin))\n  208 |         return BadAlloc;","lines":32,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/composite/compalloc.c#L177-L208"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":false,"description":"In compRedirectSubwindows(), when AddResource() fails for ccw->id (line 405), the function\nreturns BadAlloc without removing ccw from csw->clients (it was prepended on line 403-404).\nIf csw was newly allocated in this call, neither csw nor ccw is freed, and the devPrivates\npointer is left dangling. Even if csw pre-existed, ccw is leaked and csw->clients is corrupted.","fix":"On AddResource() failure, unlink ccw from csw->clients, free ccw, and if csw was newly\ncreated (csw->clients is now empty), clear the devPrivates and free csw before returning BadAlloc.","locations":[{"ref":"Xext/composite/compalloc.c:401-406","code":"  401 |      * Hook into subwindows list\n  402 |      */\n  403 |     ccw->next = csw->clients;\n  404 |     csw->clients = ccw;\n  405 |     if (!AddResource(ccw->id, CompositeClientSubwindowsType, pWin))\n  406 |         return BadAlloc;","lines":6,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/composite/compalloc.c#L401-L406"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In compCreateOverlayClient(), the new pOc node is prepended to cs->pOverlayClients (lines 107-108)\nbefore AddResource() is called (line 114). If AddResource() fails, the function returns NULL but\npOc remains in the cs->pOverlayClients list without being freed. Any subsequent call to\ncompFreeOverlayClient() for the same pOc pointer that arrives via a different code path would\ndouble-free it; more practically, the dangling entry in pOverlayClients causes\ncompDestroyOverlayWindow() to never be called when appropriate.","fix":"If AddResource() fails, restore cs->pOverlayClients to its previous head (pOc->pNext), free pOc,\nand return NULL. Alternatively, call AddResource() before inserting into the list.","locations":[{"ref":"Xext/composite/compoverlay.c:107-115","code":"  107 |     pOc->pNext = cs->pOverlayClients;\n  108 |     cs->pOverlayClients = pOc;\n  109 | \n  110 |     /*\n  111 |      * Create a resource for this element so it can be deleted\n  112 |      * when the client goes away.\n  113 |      */\n  114 |     if (!AddResource(pOc->resource, CompositeClientOverlayType, (void *) pOc))\n  115 |         return NULL;","lines":9,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/composite/compoverlay.c#L107-L115"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"In DRI2ScreenInit(), when `dri2_probe_driver_name()` returns a heap-allocated string (via strdup) and that string is not NULL, the function then checks `if (!ds->driverNames[0]) return FALSE;` - but if the string *is* non-NULL yet the function exits via the `err_out` path later (e.g. the `driverNames` calloc at line 1508 succeeded but something else later fails), the strdup'd driver name stored in `ds->driverNames[0]` and `ds->driverNames[1]` is freed only indirectly via `free(ds->driverNames)` (which frees the pointer array but not the strings). Additionally, the FIXME comment at line 1515-1516 explicitly acknowledges the leak of the strdup'd string for the success path. On the early-return path at line 1519, `ds->driverNames` has already been allocated and assigned but is not freed before returning FALSE.","fix":"Free the strdup'd driver name string in all error/exit paths. In the `err_out` label, add `free(ds->driverNames)` (already done) but also `free((void*)ds->driverNames[0])` when the probe path was taken. For the success path, store the probed name in a local variable and free it in DRI2CloseScreen.","locations":[{"ref":"Xext/dri2/dri2.c:1508-1524","code":" 1508 |         ds->driverNames = calloc(ds->numDrivers, sizeof(*ds->driverNames));\n 1509 |         if (!ds->driverNames)\n 1510 |             goto err_out;\n 1511 | \n 1512 |         if (info->driverName) {\n 1513 |             ds->driverNames[0] = info->driverName;\n 1514 |         } else {\n 1515 |             /* FIXME dri2_probe_driver_name() returns a strdup-ed string,\n 1516 |              * currently this gets leaked */\n 1517 |             ds->driverNames[0] = ds->driverNames[1] = dri2_probe_driver_name(pScreen, info);\n 1518 |             if (!ds->driverNames[0])\n 1519 |                 return FALSE;\n 1520 | \n 1521 |             /* There is no VDPAU driver for i965, fallback to the generic\n 1522 |              * OpenGL/VAAPI va_gl backend to emulate VDPAU on i965. */\n 1523 |             if (strcmp(ds->driverNames[0], \"i965\") == 0)\n 1524 |                 ds->driverNames[1] = \"va_gl\";","lines":17,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dri2/dri2.c#L1508-L1524"}]},{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"dispatch_DestroyGLXPixmap() in vnd_dispatch_stubs.c forwards the request to the vendor but never calls `glxServer.removeXIDMap(glxpixmap)` on success, unlike every other destroy handler (DestroyContext, DestroyPbuffer, DestroyPixmap, DestroyWindow) which all remove the XID map entry after a successful forward. The XID-to-vendor mapping remains in the idResource table for the lifetime of the client, preventing the XID slot from being reused correctly.","fix":"Add `if (ret == Success) { glxServer.removeXIDMap(glxpixmap); }` after the forwardRequest call, matching the pattern in dispatch_DestroyPixmap.","locations":[{"ref":"Xext/glx/vnd_dispatch_stubs.c:196-212","code":"  196 | static int dispatch_DestroyGLXPixmap(ClientPtr client)\n  197 | {\n  198 |     REQUEST(xGLXDestroyGLXPixmapReq);\n  199 |     CARD32 glxpixmap;\n  200 |     GlxServerVendor *vendor = NULL;\n  201 |     REQUEST_SIZE_MATCH(*stuff);\n  202 |     glxpixmap = GlxCheckSwap(client, stuff->glxpixmap);\n  203 |     vendor = glxServer.getXIDMap(glxpixmap);\n  204 |     if (vendor != NULL) {\n  205 |         int ret;\n  206 |         ret = glxServer.forwardRequest(vendor, client);\n  207 |         return ret;\n  208 |     } else {\n  209 |         client->errorValue = glxpixmap;\n  210 |         return GlxErrorBase + GLXBadPixmap;\n  211 |     }\n  212 | }","lines":17,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/vnd_dispatch_stubs.c#L196-L212"}]},{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"low","easy":false,"description":"In proc_dri3_buffers_from_pixmap(), when WriteFdToClient() fails for fd[i], the error recovery loop `while (i--) close(fds[i])` closes fds[0]..fds[i-1] but does NOT close fds[i+1]..fds[num_fds-1] (those not yet attempted). Only the already-tried fds before the failing index are closed; the remaining ones are leaked as open file descriptors in the server process. The fds from dri3_fds_from_pixmap are owned by the caller.","fix":"After the `while (i--) close(fds[i]);` loop, also close fds[i+1] through fds[num_fds-1] that were not yet sent. Alternatively, restructure: send all fds first, then handle errors, or close all remaining fds after detecting failure.","locations":[{"ref":"Xext/dri3/dri3_request.c:551-556","code":"  551 |     for (i = 0; i < num_fds; i++) {\n  552 |         if (WriteFdToClient(client, fds[i], TRUE) < 0) {\n  553 |             while (i--)\n  554 |                 close(fds[i]);\n  555 |             return BadAlloc;\n  556 |         }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dri3/dri3_request.c#L551-L556"}]},{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"low","easy":false,"description":"PanoramiXExtensionInit (panoramiX.c) iterates screens backward and, for each\nscreen, calls calloc then dixSetPrivate then checks for NULL. If calloc fails\nfor screen N, screens already processed (higher-indexed screens in the backward\niteration) have had their `pScreenPriv` allocated and stored, and the close hook\nregistered. Execution then hits `noPanoramiXExtension = TRUE; return;` without\nfreeing those prior allocations. While the close hook will eventually fire when\nthose screens close, the extension is now disabled and PanoramiXResetProc will not\nrestore ProcVector entries that were already installed, leaving a partially\nmodified dispatch table. This is also a correctness issue: some screens have the\nXinerama GC hooks installed even though the extension is flagged as disabled.","fix":"Separate the allocation loop from the hook-registration loop: first allocate all privs in one pass (returning on failure before any hooks are set), then register hooks in a second pass only if all allocations succeeded.","locations":[{"ref":"Xext/panoramiX/panoramiX.c:462-474","code":"  462 |     XINERAMA_FOR_EACH_SCREEN_BACKWARD({\n  463 |         PanoramiXScreenPtr pScreenPriv = calloc(1, sizeof(PanoramiXScreenRec));\n  464 |         dixSetPrivate(&walkScreen->devPrivates, &PanoramiXScreenKeyRec,\n  465 |                       pScreenPriv);\n  466 |         if (!pScreenPriv) {\n  467 |             noPanoramiXExtension = TRUE;\n  468 |             return;\n  469 |         }\n  470 | \n  471 |         dixScreenHookClose(walkScreen, XineramaCloseScreen);\n  472 |         pScreenPriv->CreateGC = masterScreen->CreateGC;\n  473 |         walkScreen->CreateGC = XineramaCreateGC;\n  474 |     });","lines":13,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/panoramiX/panoramiX.c#L462-L474"}]},{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"low","easy":true,"description":"`XineramaConnectionCallbackList` entries registered via\n`XineramaRegisterConnectionBlockCallback` (panoramiX.c lines 363-375) are\nconsumed and freed inside `PanoramiXCreateConnectionBlock` (lines 673-679).\nHowever, `PanoramiXResetProc` (lines 865-876) does not drain the list. If the\nextension is reset before `PanoramiXCreateConnectionBlock` is called, all\nregistered callback list nodes leak.","fix":"Add a drain loop in PanoramiXResetProc that frees any remaining ConnectionCallbackList entries (same loop as in PanoramiXCreateConnectionBlock, minus calling the function pointers).","locations":[{"ref":"Xext/panoramiX/panoramiX.c:865-876","code":"  865 | PanoramiXResetProc(ExtensionEntry * extEntry)\n  866 | {\n  867 |     int i;\n  868 | \n  869 |     PanoramiXRenderReset();\n  870 |     PanoramiXFixesReset();\n  871 |     PanoramiXDamageReset();\n  872 |     PanoramiXCompositeReset ();\n  873 |     screenInfo.numScreens = PanoramiXNumScreens;\n  874 |     for (i = 256; i--;)\n  875 |         ProcVector[i] = SavedProcVector[i];\n  876 | }","lines":12,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/panoramiX/panoramiX.c#L865-L876"},{"ref":"Xext/panoramiX/panoramiX.c:673-679","code":"  673 |     while (ConnectionCallbackList) {\n  674 |         void *tmp;\n  675 | \n  676 |         tmp = (void *) ConnectionCallbackList;\n  677 |         (*ConnectionCallbackList->func) ();\n  678 |         ConnectionCallbackList = ConnectionCallbackList->next;\n  679 |         free(tmp);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/panoramiX/panoramiX.c#L673-L679"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"Several 'Single' dispatch functions compute n * 4 (or n * 8 for doubles) as a signed 32-bit multiplication (GLsizei * int) and pass the result directly to __glXGetAnswerBuffer as size_t. When a client supplies n = 0x40000000, the signed multiplication n * 4 overflows and wraps to 0. __glXGetAnswerBuffer receives required_size = 0, which is less than sizeof(answerBuffer), so it returns the 200-element stack buffer. The GL function (e.g., glGenTextures, glGenQueries, glGenFramebuffers) is then called with the original, unclamped n = 0x40000000 and writes 2^30 elements into that stack buffer, overflowing it. Affected functions include: __glXDisp_GenTextures, __glXDisp_GenTexturesEXT, __glXDisp_GenQueries, __glXDisp_GenProgramsARB, __glXDisp_GenFramebuffers, __glXDisp_GenRenderbuffers.","fix":"Validate n before the multiplication: if n <= 0 or n > some reasonable upper bound (e.g., the request length divided by sizeof(GLuint)), return BadValue. Alternatively cast to size_t before multiplying: (size_t)n * 4.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:2596-2612","code":" 2596 |     if (cx != NULL) {\n 2597 |         const GLsizei n = *(GLsizei *) (pc + 0);\n 2598 | \n 2599 |         GLuint answerBuffer[200];\n 2600 |         GLuint *textures =\n 2601 |             __glXGetAnswerBuffer(cl, n * 4, answerBuffer, sizeof(answerBuffer),\n 2602 |                                  4);\n 2603 | \n 2604 |         if (textures == NULL)\n 2605 |             return BadAlloc;\n 2606 |         glGenTextures(n, textures);\n 2607 |         __glXSendReply(cl->client, textures, n, 4, GL_TRUE, 0);\n 2608 |         error = Success;\n 2609 |     }\n 2610 | \n 2611 |     return error;\n 2612 | }","lines":17,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L2596-L2612"},{"ref":"Xext/glx/indirect_dispatch.c:2621-2638","code":" 2621 |     pc += __GLX_VENDPRIV_HDR_SIZE;\n 2622 |     if (cx != NULL) {\n 2623 |         const GLsizei n = *(GLsizei *) (pc + 0);\n 2624 | \n 2625 |         GLuint answerBuffer[200];\n 2626 |         GLuint *textures =\n 2627 |             __glXGetAnswerBuffer(cl, n * 4, answerBuffer, sizeof(answerBuffer),\n 2628 |                                  4);\n 2629 | \n 2630 |         if (textures == NULL)\n 2631 |             return BadAlloc;\n 2632 |         glGenTextures(n, textures);\n 2633 |         __glXSendReply(cl->client, textures, n, 4, GL_TRUE, 0);\n 2634 |         error = Success;\n 2635 |     }\n 2636 | \n 2637 |     return error;\n 2638 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L2621-L2638"},{"ref":"Xext/glx/indirect_dispatch.c:3883-3908","code":" 3883 | int\n 3884 | __glXDisp_GenQueries(__GLXclientState * cl, GLbyte * pc)\n 3885 | {\n 3886 |     PFNGLGENQUERIESPROC GenQueries = __glGetProcAddress(\"glGenQueries\");\n 3887 |     xGLXSingleReq *const req = (xGLXSingleReq *) pc;\n 3888 |     int error;\n 3889 |     __GLXcontext *const cx = __glXForceCurrent(cl, req->contextTag, &error);\n 3890 | \n 3891 |     pc += __GLX_SINGLE_HDR_SIZE;\n 3892 |     if (cx != NULL) {\n 3893 |         const GLsizei n = *(GLsizei *) (pc + 0);\n 3894 | \n 3895 |         GLuint answerBuffer[200];\n 3896 |         GLuint *ids =\n 3897 |             __glXGetAnswerBuffer(cl, n * 4, answerBuffer, sizeof(answerBuffer),\n 3898 |                                  4);\n 3899 | \n 3900 |         if (ids == NULL)\n 3901 |             return BadAlloc;\n 3902 |         GenQueries(n, ids);\n 3903 |         __glXSendReply(cl->client, ids, n, 4, GL_TRUE, 0);\n 3904 |         error = Success;\n 3905 |     }\n 3906 | \n 3907 |     return error;\n 3908 | }","lines":26,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L3883-L3908"},{"ref":"Xext/glx/indirect_dispatch.c:4255-4281","code":" 4255 | int\n 4256 | __glXDisp_GenProgramsARB(__GLXclientState * cl, GLbyte * pc)\n 4257 | {\n 4258 |     PFNGLGENPROGRAMSARBPROC GenProgramsARB =\n 4259 |         __glGetProcAddress(\"glGenProgramsARB\");\n 4260 |     xGLXVendorPrivateReq *const req = (xGLXVendorPrivateReq *) pc;\n 4261 |     int error;\n 4262 |     __GLXcontext *const cx = __glXForceCurrent(cl, req->contextTag, &error);\n 4263 | \n 4264 |     pc += __GLX_VENDPRIV_HDR 8d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L4635-L4662"},{"ref":"Xext/glx/indirect_dispatch.c:4664-4690","code":" 4664 | int\n 4665 | __glXDisp_GenRenderbuffers(__GLXclientState * cl, GLbyte * pc)\n 4666 | {\n 4667 |     PFNGLGENRENDERBUFFERSPROC GenRenderbuffers =\n 4668 |         __glGetProcAddress(\"glGenRenderbuffers\");\n 4669 |     xGLXVendorPrivateReq *const req = (xGLXVendorPrivateReq *) pc;\n 4670 |     int error;\n 4671 |     __GLXcontext *const cx = __glXForceCurrent(cl, req->contextTag, &error);\n 4672 | \n 4673 |     pc += __GLX_VENDPRIV_HDR_SIZE;\n 4674 |     if (cx != NULL) {\n 4675 |         const GLsizei n = *(GLsizei *) (pc + 0);\n 4676 | \n 4677 |         GLuint answerBuffer[200];\n 4678 |         GLuint *renderbuffers =\n 4679 |             __glXGetAnswerBuffer(cl, n * 4, answerBuffer, sizeof(answerBuffer),\n 4680 |                                  4);\n 4681 | \n 4682 |         if (renderbuffers == NULL)\n 4683 |             return BadAlloc;\n 4684 |         GenRenderbuffers(n, renderbuffers);\n 4685 |         __glXSendReply(cl->client, renderbuffers, n, 4, GL_TRUE, 0);\n 4686 |         error = Success;\n 4687 |     }\n 4688 | \n 4689 |     return error;\n 4690 | }","lines":27,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L4664-L4690"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"In xfont.c __glXMakeBitmapFromGlyph(), `allocBytes = widthPadded * h` is a plain int multiply with no overflow check. widthPadded derives from glyph width metrics (INT16 ascent/descent sums allow values up to ~65534) and h similarly. Their product can overflow a 32-bit int to a negative value. If allocBytes overflows to a value <= __GL_CHAR_BUF_SIZE (2048), the code uses the 2048-byte stack buffer `buf` for a glyph that actually requires gigabytes, resulting in a stack buffer overflow and potential code execution.","fix":"Replace the plain multiply with a checked form: use `(int64_t)widthPadded * h`, check it is positive and <= some reasonable limit, then cast to int for allocBytes.","locations":[{"ref":"Xext/glx/xfont.c:69-78","code":"   69 |     allocBytes = widthPadded * h;\n   70 |     if (allocBytes <= __GL_CHAR_BUF_SIZE) {\n   71 |         p = buf;\n   72 |         allocbuf = 0;\n   73 |     }\n   74 |     else {\n   75 |         p = calloc(1, allocBytes);\n   76 |         if (!p)\n   77 |             return BadAlloc;\n   78 |         allocbuf = p;","lines":10,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/xfont.c#L69-L78"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":true,"description":"initGlxVisual computes `visual->ColormapEntries = 1 << maxBits` where ColormapEntries is declared as `short` (16 bits) and maxBits comes from GLint config->redBits / greenBits / blueBits. For any config with a channel width >= 16 (e.g. float or HDR configs where a channel can be 16 or 32 bits) the shift either overflows int (UB for maxBits >= 31) or silently truncates when stored in the short field.","fix":"Cap maxBits before shifting, e.g. `if (maxBits < 15) visual->ColormapEntries = (short)(1 << maxBits); else visual->ColormapEntries = SHRT_MAX;`. Also guard against maxBits >= 31 to avoid signed UB.","locations":[{"ref":"Xext/glx/glxscreens.c:229-236","code":"  229 |     int maxBits;\n  230 | \n  231 |     maxBits = MAX(config->redBits, MAX(config->greenBits, config->blueBits));\n  232 | \n  233 |     config->visualID = visual->vid;\n  234 |     visual->class = glxConvertToXVisualType(config->visualType);\n  235 |     visual->bitsPerRGBValue = maxBits;\n  236 |     visual->ColormapEntries = 1 << maxBits;","lines":8,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxscreens.c#L229-L236"},{"ref":"Xext/glx/glxscreens.h:47","code":"   47 |     GLint redBits, greenBits, blueBits, alphaBits;      /* bits per comp */","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glxscreens.h#L47"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"The __GLX_ALIGN64 alignment-fixup blocks in __glXDisp_VertexAttribs{1,2,3,4}dvNV compute cmdlen as a signed 32-bit expression: e.g., '12 + __GLX_PAD((n * 8)) - 4' where n is GLsizei from client data. For large n (e.g., n = 0x10000000 for the factor-8 variant), n * 8 overflows a signed 32-bit integer (undefined behaviour in C, typically wraps). The resulting cmdlen is wrong, so memmove copies an incorrect byte count; either too few bytes are moved (doubles remain unaligned, triggering SIGBUS on strict-alignment architectures) or, if the wrap produces a large value, memory outside the packet buffer is read. Affected: __glXDisp_VertexAttribs1dvNV (n*8), __glXDisp_VertexAttribs2dvNV (n*16), __glXDisp_VertexAttribs3dvNV (n*24), __glXDisp_VertexAttribs4dvNV (n*32).","fix":"Cast n to size_t before multiplication: e.g., 'const size_t cmdlen = 12 + __GLX_PAD(((size_t)n * 8)) - 4;'. Also validate that n is non-negative and that n * element_size does not exceed the packet length.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:4956-4973","code":" 4956 | void\n 4957 | __glXDisp_VertexAttribs1dvNV(GLbyte * pc)\n 4958 | {\n 4959 |     PFNGLVERTEXATTRIBS1DVNVPROC VertexAttribs1dvNV =\n 4960 |         __glGetProcAddress(\"glVertexAttribs1dvNV\");\n 4961 |     const GLsizei n = *(GLsizei *) (pc + 4);\n 4962 | \n 4963 | #ifdef __GLX_ALIGN64\n 4964 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 8)) - 4;\n 4965 | \n 4966 |     if ((unsigned long) (pc) & 7) {\n 4967 |         (void) memmove(pc - 4, pc, cmdlen);\n 4968 |         pc -= 4;\n 4969 |     }\n 4970 | #endif\n 4971 | \n 4972 |     VertexAttribs1dvNV(*(GLuint *) (pc + 0), n, (const GLdouble *) (pc + 8));\n 4973 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L4956-L4973"},{"ref":"Xext/glx/indirect_dispatch.c:4995-5012","code":" 4995 | void\n 4996 | __glXDisp_VertexAttribs2dvNV(GLbyte * pc)\n 4997 | {\n 4998 |     PFNGLVERTEXATTRIBS2DVNVPROC VertexAttribs2dvNV =\n 4999 |         __glGetProcAddress(\"glVertexAttribs2dvNV\");\n 5000 |     const GLsizei n = *(GLsizei *) (pc + 4);\n 5001 | \n 5002 | #ifdef __GLX_ALIGN64\n 5003 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 16)) - 4;\n 5004 | \n 5005 |     if ((unsigned long) (pc) & 7) {\n 5006 |         (void) memmove(pc - 4, pc, cmdlen);\n 5007 |         pc -= 4;\n 5008 |     }\n 5009 | #endif\n 5010 | \n 5011 |     VertexAttribs2dvNV(*(GLuint *) (pc + 0), n, (const GLdouble *) (pc + 8));\n 5012 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L4995-L5012"},{"ref":"Xext/glx/indirect_dispatch.c:5034-5051","code":" 5034 | void\n 5035 | __glXDisp_VertexAttribs3dvNV(GLbyte * pc)\n 5036 | {\n 5037 |     PFNGLVERTEXATTRIBS3DVNVPROC VertexAttribs3dvNV =\n 5038 |         __glGetProcAddress(\"glVertexAttribs3dvNV\");\n 5039 |     const GLsizei n = *(GLsizei *) (pc + 4);\n 5040 | \n 5041 | #ifdef __GLX_ALIGN64\n 5042 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 24)) - 4;\n 5043 | \n 5044 |     if ((unsigned long) (pc) & 7) {\n 5045 |         (void) memmove(pc - 4, pc, cmdlen);\n 5046 |         pc -= 4;\n 5047 |     }\n 5048 | #endif\n 5049 | \n 5050 |     VertexAttribs3dvNV(*(GLuint *) (pc + 0), n, (const GLdouble *) (pc + 8));\n 5051 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L5034-L5051"},{"ref":"Xext/glx/indirect_dispatch.c:5073-5090","code":" 5073 | void\n 5074 | __glXDisp_VertexAttribs4dvNV(GLbyte * pc)\n 5075 | {\n 5076 |     PFNGLVERTEXATTRIBS4DVNVPROC VertexAttribs4dvNV =\n 5077 |         __glGetProcAddress(\"glVertexAttribs4dvNV\");\n 5078 |     const GLsizei n = *(GLsizei *) (pc + 4);\n 5079 | \n 5080 | #ifdef __GLX_ALIGN64\n 5081 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 32)) - 4;\n 5082 | \n 5083 |     if ((unsigned long) (pc) & 7) {\n 5084 |         (void) memmove(pc - 4, pc, cmdlen);\n 5085 |         pc -= 4;\n 5086 |     }\n 5087 | #endif\n 5088 | \n 5089 |     VertexAttribs4dvNV(*(GLuint *) (pc + 0), n, (const GLdouble *) (pc + 8));\n 5090 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L5073-L5090"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"The cmdlen calculations in the __GLX_ALIGN64 blocks for VertexAttribs*dvNV use expressions like `n * 32` where n is a client-supplied GLsizei (signed 32-bit). A large n causes signed integer overflow, yielding a small or negative cmdlen that is then passed to memmove, potentially reading or writing far outside the buffer.","fix":"Validate n against the actual packet length (req->length) before using it in the memmove size calculation, or cast to size_t before multiplying.","locations":[{"ref":"Xext/glx/indirect_dispatch_swap.c:5485","code":" 5485 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 8)) - 4;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch_swap.c#L5485"},{"ref":"Xext/glx/indirect_dispatch_swap.c:5533","code":" 5533 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 16)) - 4;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch_swap.c#L5533"},{"ref":"Xext/glx/indirect_dispatch_swap.c:5581","code":" 5581 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 24)) - 4;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch_swap.c#L5581"},{"ref":"Xext/glx/indirect_dispatch_swap.c:5629","code":" 5629 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 32)) - 4;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch_swap.c#L5629"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"In __glXDisp_Map1d (render2.c:98) and __glXDisp_Map2d (render2.c:145), when __GLX_ALIGN64 is defined,\ncompsize is computed as 'order * k' or 'uorder * vorder * k' using plain C multiplication without\noverflow protection. Although order/uorder/vorder are client-supplied, the request-size validators\n(__glXMap1dReqSize/__glXMap2dReqSize) use safe_mul and would reject oversized values before the\ndispatch handlers are called. However the dispatch functions themselves recompute this product\nunsafely and pass 'compsize * 8' to memmove (__GLX_MEM_COPY). If the validators are bypassed or\ncalled from a different path, or if the __GLX_ALIGN64 branch is taken with large values, this can\nproduce an integer overflow leading to a heap/stack corruption via an undersized memmove.","fix":"Use safe_mul for compsize computation in these branches, and return early without the memmove if compsize overflows.","locations":[{"ref":"Xext/glx/render2.c:94-99","code":"   94 |     if (order < 0 || k < 0) {\n   95 |         compsize = 0;\n   96 |     }\n   97 |     else {\n   98 |         compsize = order * k;\n   99 |     }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/render2.c#L94-L99"},{"ref":"Xext/glx/render2.c:141-146","code":"  141 |     if (vorder < 0 || uorder < 0 || k < 0) {\n  142 |         compsize = 0;\n  143 |     }\n  144 |     else {\n  145 |         compsize = uorder * vorder * k;\n  146 |     }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/render2.c#L141-L146"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"In __glXImageSize() (rensize.c), after `rowSize = safe_mul(groupsPerRow, groupSize)` is checked for overflow, the padding adjustment `rowSize += alignment - padding` is performed without an overflow check. For alignment=8 and padding=1, the adjustment adds 7. If rowSize was already INT_MAX-6, the result silently overflows to a negative value. This negative rowSize then flows into safe_mul(h, rowSize) and safe_mul(..., imageSize) which will interpret it as an error sentinel -1, but only if the product itself triggers the safe check - a crafted rowSize value close to INT_MAX may not be caught.","fix":"After the safe_mul check, use `if (padding && (rowSize > INT_MAX - (alignment - padding))) return -1; rowSize += alignment - padding;` - or call safe_add(rowSize, alignment - padding) and check the result.","locations":[{"ref":"Xext/glx/rensize.c:317-322","code":"  317 |         if ((rowSize = safe_mul(groupsPerRow, groupSize)) < 0)\n  318 |             return -1;\n  319 |         padding = (rowSize % alignment);\n  320 |         if (padding) {\n  321 |             rowSize += alignment - padding;\n  322 |         }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/rensize.c#L317-L322"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","easy":true,"description":"dri3_fd_from_pixmap() writes `size[0]` instead of `strides[0]` for the size field. The parameter `size` is a `CARD32 *` pointer, so `size[0]` dereferences the pointee as an array element (which happens to compile and be the same as `*size`) but the author clearly intended to assign `strides[0]` (the stride) to `*stride` is already done on the previous line, and `strides[0]` should have been used for `*size` - but actually the intent was to assign `strides[0]` to the stride output (already done) AND populate the size output from the local `strides` buffer. The correct assignment is `*size = strides[0]` since there is no local `sizes` array - the function receives `size` as an output pointer, not an array. Writing `size[0]` is identical to `*size` by C semantics (no crash), but the value returned in `*size` will be whatever value `*size` contained on entry (the caller's uninitialized or stale value) rather than the buffer size from the v2 API. The caller in proc_dri3_buffer_from_pixmap uses the returned size field in the protocol reply, so clients receive garbage.","fix":"Replace `*size = size[0];` with `*size = strides[0];`. The local `strides[4]` array holds the per-plane stride; for a single-plane buffer the stride value serves as the size approximation, matching what the old `fd_from_pixmap` interface returned via its `CARD32 *size` parameter.","locations":[{"ref":"Xext/dri3/dri3_screen.c:151-152","code":"  151 |     *stride = strides[0];\n  152 |     *size = size[0];","lines":2,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/dri3/dri3_screen.c#L151-L152"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"critical","easy":true,"description":"__glXDRIdrawableCopySubBuffer() passes arguments to copy_box() in completely wrong order. copy_box() signature is (drawable, dst, src, x, y, w, h), but the call passes (drawable, x, height-y-h, w, h, DRI2BufferFrontLeft, DRI2BufferBackLeft). This maps the x coordinate as 'dst' buffer enum, the height-adjusted y as 'src' buffer enum, and the DRI2 buffer constants end up as the width and height. The copy effectively operates on garbage buffer IDs at the wrong region, so CopySubBufferMESA silently does the wrong thing.","fix":"Swap arguments: copy_box(drawable, DRI2BufferFrontLeft, DRI2BufferBackLeft, x, private->height - y - h, w, h);","locations":[{"ref":"Xext/glx/glx_dri/glxdri2.c:139-141","code":"  139 |     copy_box(drawable, x, private->height - y - h,\n  140 |              w, h,\n  141 |              DRI2BufferFrontLeft, DRI2BufferBackLeft);","lines":3,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glx_dri/glxdri2.c#L139-L141"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"critical","easy":false,"description":"In indirect_program.c, DoGetProgramString calls get_programiv (line 83) and get_program_string (line 89) without checking whether those function pointers are NULL. __glGetProcAddress returns NULL when the extension is not present. A NULL call causes an immediate server crash. Both __glXDisp_GetProgramStringARB and __glXDispSwap_GetProgramStringARB are affected.","fix":"Add null checks after __glGetProcAddress and return an appropriate error (e.g. BadRequest or __glXError) if either pointer is NULL.","locations":[{"ref":"Xext/glx/indirect_program.c:83-89","code":"   83 |         get_programiv(target, GL_PROGRAM_LENGTH_ARB, &compsize);\n   84 | \n   85 |         if (compsize != 0) {\n   86 |             __GLX_GET_ANSWER_BUFFER(answer, cl, compsize, 1);\n   87 |             __glXClearErrorOccured();\n   88 | \n   89 |             get_program_string(target, pname, (GLubyte *) answer);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_program.c#L83-L89"},{"ref":"Xext/glx/indirect_program.c:105-124","code":"  105 | int\n  106 | __glXDisp_GetProgramStringARB(struct __GLXclientStateRec *cl, GLbyte * pc)\n  107 | {\n  108 |     PFNGLGETPROGRAMIVARBPROC get_program =\n  109 |         __glGetProcAddress(\"glGetProgramivARB\");\n  110 |     PFNGLGETPROGRAMSTRINGARBPROC get_program_string =\n  111 |         __glGetProcAddress(\"glGetProgramStringARB\");\n  112 | \n  113 |     return DoGetProgramString(cl, pc, get_program, get_program_string, FALSE);\n  114 | }\n  115 | \n  116 | int\n  117 | __glXDispSwap_GetProgramStringARB(struct __GLXclientStateRec *cl, GLbyte * pc)\n  118 | {\n  119 |     PFNGLGETPROGRAMIVARBPROC get_program =\n  120 |         __glGetProcAddress(\"glGetProgramivARB\");\n  121 |     PFNGLGETPROGRAMSTRINGARBPROC get_program_string =\n  122 |         __glGetProcAddress(\"glGetProgramStringARB\");\n  123 | \n  124 |     return DoGetProgramString(cl, pc, get_program, get_program_string, TRUE);","lines":20,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_program.c#L105-L124"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"critical","easy":true,"description":"In config.c parseLine(), when parsing an `auth` directive, the second strtok call (for the hex token) is not checked for NULL. If the config line is malformed (e.g., `auth MIT-MAGIC-COOKIE-1` with no hex data following), strtok returns NULL, and the subsequent `strlen(token)` on line 115 dereferences NULL, causing a crash. Additionally, if strdup() for authProto fails, the resulting NULL pointer is passed to strlen() on line 124.","fix":"Add `if (token == NULL) { free(new_token->authProto); free(new_token); return; }` after `token = strtok(NULL, \" \");`. Also check the return of strdup: `if (!new_token->authProto) { free(new_token); return; }`.","locations":[{"ref":"Xext/namespace/config.c:113-116","code":"  113 |         token = strtok(NULL, \" \");\n  114 | \n  115 |         new_token->authTokenLen = strlen(token)/2;\n  116 |         new_token->authTokenData = calloc(1, new_token->authTokenLen);","lines":4,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/namespace/config.c#L113-L116"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"In SGEGenericEvent() the bounds check uses `> MAXEXTENSIONS` (strict greater-than), but the array `GEExtensions` has exactly MAXEXTENSIONS (128) elements indexed 0-127. An extension whose masked opcode equals exactly 128 passes the check but then indexes `GEExtensions[128]`, which is one element past the end of the array - undefined behaviour and a potential read/write of out-of-bounds memory. GERegisterExtension() correctly uses `>= MAXEXTENSIONS`, exposing the inconsistency.","fix":"Change the condition from `> MAXEXTENSIONS` to `>= MAXEXTENSIONS` to match the guard in GERegisterExtension().","locations":[{"ref":"Xext/geext/geext.c:131","code":"  131 |     if ((gefrom->extension & 0x7f) > MAXEXTENSIONS) {","lines":1,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/geext/geext.c#L131"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In dri2_convert_glx_attribs(), the version guard for GLX_CONTEXT_RESET_NOTIFICATION_STRATEGY_ARB is inverted. The code returns BadValue when screen->dri2->base.version >= 4, meaning it rejects reset notification requests when the driver is new enough to handle them, and silently accepts them (writing to *reset) when the driver is too old. The intent was almost certainly to reject when the driver is too old (version < 4), not the other way around.","fix":"Change 'if (screen->dri2->base.version >= 4)' to 'if (screen->dri2->base.version < 4)' so that the error is returned when the driver does not support the reset notification attribute.","locations":[{"ref":"Xext/glx/glx_dri/glxdri2.c:382-386","code":"  382 |         case GLX_CONTEXT_RESET_NOTIFICATION_STRATEGY_ARB:\n  383 |             if (screen->dri2->base.version >= 4) {\n  384 |                 *error = BadValue;\n  385 |                 return FALSE;\n  386 |             }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/glx_dri/glxdri2.c#L382-L386"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"The __GLX_ALIGN64 alignment fixup in every __glXDisp_VertexAttrib{1,2,3,4}dv and __glXDisp_VertexAttrib{1,2,3,4}dvNV function does not actually align the double array to an 8-byte boundary. The protocol layout for these commands is [index: 4 bytes][doubles: N*8 bytes]. The fixup copies the block to pc-4 and decrements pc by 4, so the doubles end up at address (new_pc + 4). When the original pc was offset 4 mod 8 (the triggering condition), new_pc is 8-aligned but new_pc+4 is only 4-aligned. On strict-alignment architectures (SPARC, MIPS, early ARM) this causes a SIGBUS when the double array is accessed. By contrast, functions whose doubles start at offset 0 (e.g., MultiTexCoord1dv) or offset 8 (e.g., TexGendv, ProgramEnvParameter4dvARB) are fixed correctly by the same pattern.","fix":"The GLX protocol should place the doubles before the index (as MultiTexCoord*dv does) so the fixup works. Alternatively, use memcpy to a local aligned double array instead of the memmove-in-place trick.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:4039-4052","code":" 4039 | void\n 4040 | __glXDisp_VertexAttrib1dv(GLbyte * pc)\n 4041 | {\n 4042 |     PFNGLVERTEXATTRIB1DVPROC VertexAttrib1dv =\n 4043 |         __glGetProcAddress(\"glVertexAttrib1dv\");\n 4044 | #ifdef __GLX_ALIGN64\n 4045 |     if ((unsigned long) (pc) & 7) {\n 4046 |         (void) memmove(pc - 4, pc, 12);\n 4047 |         pc -= 4;\n 4048 |     }\n 4049 | #endif\n 4050 | \n 4051 |     VertexAttrib1dv(*(GLuint *) (pc + 0), (const GLdouble *) (pc + 4));\n 4052 | }","lines":14,"link":"https://github.com/X11Libre/xserver/blob/4564f0f16f6ccbf86260a28d6bf0332466ee77b3/Xext/glx/indirect_dispatch.c#L4039-L4052"},{"ref":"Xext/glx/indirect_dispatch.c:4062-4075","code":" 4062 | void\n 4063 | __glXDisp_VertexAttrib2dv(GLbyte * pc)\n 4064 | {\n 4065 |     PFNGLVERTEXATTRIB2DVPROC VertexAttrib2dv =\n 4066 |         __glGetProcAddress(\"glVertexAttrib2dv\");\n 4067 | #ifdef __GLX_ALIGN64\n 4068 |     if ((unsigned long) (pc) &
